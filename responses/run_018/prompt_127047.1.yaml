answer: |-
  Here’s a practical **Identity Assessment Checklist** for determining if a restored/damaged sculpture is still the "same work," grounded in material constitution principles but stripped of philosophy. It prioritizes **artist intent**, **material continuity**, and **functional integrity**, with clear off-ramps for legal/curatorial input.  

  ---

  ### **The Identity Assessment Checklist**  
  **Evidence Needed at Start:** Artist statements, contracts, conservation reports, installation instructions, provenance records.  
  **Team:** Registrar + Conservator (Curator/Legal flagged if needed). Time: <48 hrs.  

  1. **STEP 1: DID THE ARTIST DEFINE "SAME WORK" CRITERIA?**  
     - **Check:** Contracts, interviews, notes, or consistent past practice.  
     - **Pass:** Explicit criteria exist (e.g., "must use original tree," "repairs acceptable if invisible").  
     - **Fail:** Criteria explicitly violated (e.g., artist forbade all repairs).  
     - **Flag for Human Call:** Criteria ambiguous (e.g., "biologically connected") or conflicting evidence.  
     - *→ If FAIL: Stop. Not original. If PASS/FLAG: Proceed.*  

  2. **STEP 2: IS THE CORE MATERIAL SUBSTANTIALLY INTACT?**  
     - **Check:** % original material by volume/function; is it the *same substance* (e.g., unfired clay ≠ ceramic)?  
     - **Pass:** ≥70% original material AND no categorical change (e.g., wood still wood).  
     - **Fail:** Material category changed (e.g., clay → polymer) OR <30% original material.  
     - **Flag for Human Call:** 30–70% intact, or decay was *intended* (e.g., unfired clay cracking).  
     - *→ If FAIL: Stop. Not original. If PASS/FLAG: Proceed.*  

  3. **STEP 3: IS THE DAMAGE/RESTORATION WITHIN ARTIST-INTENDED PARAMETERS?**  
     - **Check:** Did the artist anticipate change? Is restoration method aligned with their philosophy?  
     - **Pass:** Damage is intentional (e.g., weathering) OR restoration uses artist-approved methods.  
     - **Fail:** Restoration alters artistic concept (e.g., fired unfired clay) or ignores instructions.  
     - **Flag for Human Call:** No instructions, but restoration respects "spirit" of the work.  
     - *→ If FAIL: Stop. Not original. If PASS/FLAG: Proceed.*  

  4. **STEP 4: DOES THE OBJECT RETAIN FUNCTIONAL/CONTEXTUAL CONTINUITY?**  
     - **Check:** Does it still *do* what the original did? (e.g., same visual impact, interaction).  
     - **Pass:** Functionally identical (e.g., replica part doesn’t alter meaning).  
     - **Fail:** Alters core experience (e.g., ice sculpture replaced with resin loses ephemerality).  
     - **Flag for Human Call:** Functional change debatable (e.g., weight/texture differs but visually identical).  
     - *→ If FAIL: Stop. Not original. If PASS: Original. If FLAG: Proceed to Step 5.*  

  5. **STEP 5: EXPERT CONSENSUS (CURATORIAL/LEGAL OVERRIDE)**  
     - **Trigger:** Ambiguity at any prior step, high value, or institutional risk.  
     - **Action:** Registrar + Conservator + Curator + (Legal if contractual/financial risk).  
     - **Outcome:** Vote on "original" status based on scholarly precedent, market practice, and risk. Document rationale.  

  ---

  ### **Application to Your Cases**  
  **Case 1: 1978 Unfired Clay Figure (Fired After Repair)**  
  - **Step 1:** Artist dead, no instructions. → *FLAG: Proceed.*  
  - **Step 2:** Material changed (unfired clay → ceramic). → **FAIL** (categorical change).  
  - **Conclusion:** **NOT ORIGINAL**. Catalog as "post-conservation state" with detailed notes.  

  **Case 2: 1994 "Living Wood" Assemblage (40% Replaced)**  
  - **Step 1:** Contract says "biologically connected to original tree." → *FLAG: "Biologically connected" undefined.*  
  - **Step 2:** 60% original material, but replacement wood is from a *different tree*. → **FAIL** (violates "biological connection" literal reading).  
  - **Flag for Human Call:** Biological connection could mean "same species" (pass) or "same tree" (fail). → **Escalate to curator/legal.** Likely outcome: Not original if estate insists on literal interpretation.  

  **Case 3: 2010 Installation (Clay "Heart" → Polymer Replica)**  
  - **Step 1:** Artist alive and says: "Without the original heart, it’s just a copy." → **FAIL** (explicit rejection).  
  - **Conclusion:** **NOT ORIGINAL** per checklist.  
  - **But... you’ll probably override this for exhibition:**  
    - The checklist *forces* you to confront the override (Step 5). You’d escalate to curator/board, arguing:  
      - The replica is visually/functionally identical.  
      - No intact version exists; deaccessioning loses the work entirely.  
      - Risk: Artist could disavow it, triggering insurance/legal issues.  
    - **Practical Reality:** You’ll likely display it as "Artist’s Concept, Reconstructed Heart" with disclaimer. The checklist flags the risk, but institutions often prioritize access over metaphysics.  

  ---

  ### **Key Conflict Points (Where Disagreement is Expected)**  
  1. **Step 1:** Interpreting vague artist statements.  
  2. **Step 2:** Defining "substantial" material loss (30% vs. 40% vs. 60%).  
  3. **Step 3:** Judging if decay is "intentional" without documentation.  
  4. **Step 4:** Assessing "functional identity" for abstract works.  

  ### **Why This Works**  
  - **Philosophy Distilled:** Focuses on *material essence* (Locke), *artist intent* (Danto), and *functional persistence* (artifact theory).  
  - **Practical:** Uses % thresholds and categorical checks to avoid metaphysics.  
  - **Safe:** Fails conservatively; overrides require consensus.  
  - **Documentable:** Creates an audit trail for insurers/estates.  

  For Case 3, the checklist gives you an objective "not original" verdict, but Step 5 exists precisely because museums *will* override this when cultural value outweighs metaphysical purity. Document the decision, disclose in labels, and insure accordingly.
