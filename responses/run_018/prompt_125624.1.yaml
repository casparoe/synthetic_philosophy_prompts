  **Strategic Summary**  
  - **Nuclear Option:** The hidden aggregation charge. If you lose this, your view dissolves into dressed-up consequentialism.  
  - **Achilles' Heel:** Scaling "systemic harm" to avoid absurdity (Dreaded Question). Lean into institutional collapse as relational failure.  
  - **Silver Lining:** Your framework *can* absorb public structures—emphasize this to the political philosopher.  
  - **Tactical Retreat:** Admit that *non*-relational cases default to aggregation (pacifying decision theorists/longtermists).  

  **Final Tip:** Preempt the Dreaded Question by discussing "scale thresholds" in your talk. Frame it as *expanding* systemic analysis—not surrendering to numbers.  

