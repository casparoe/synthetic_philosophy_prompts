  **Step 5: Desert Cap Check (Retributivist Upper Bound)**
     - Check that the proposed punishment does not exceed the maximum deserved punishment (the desert cap) for the crime as typically committed. This is the traditional retributivist proportionality.
     - If it exceeds, reject. Otherwise, proceed.
     - *Judgment call?*: Yes, setting the desert cap is a value judgment. We can base it on existing guidelines and societal norms.

  **Step 6: Final Approval**
     - If the proposal passes all the above steps, it is approved. However, if at any step the result is unclear and requires a value judgment that the board cannot resolve by simple majority, then we flag for "needs human values call".

  **Flow Summary**:
     Start
       │
