answer: |-
  Here's a reusable decision procedure designed for your sentencing review board. It's structured as a step-by-step flowchart with explicit gates, integrating both retributive and consequentialist elements (including your "shadow proportionality" and "counterfactual harm floor"). The procedure stops early if a proposal fails a gate, includes "human values call" flags for unavoidable judgment points, and specifies limitations. I'll first outline the procedure, then apply it to your three proposals.

  ---

  ### **Sentencing Proposal Decision Procedure**
  **Goal**: Approve only proposals that pass *both* retributive (desert-based) and consequentialist (harm-based) checks.  
  **Input**: Any proposed change to sentencing guidelines for non-violent offenses.  
  **Output**: **Approve**, **Reject**, or **Needs Human Values Call** (HVC).  
  **Time per Proposal**: ~5-7 minutes with practice.

  #### **Step 1: Legality & Scope Check**  
     - **Question**: Is the proposal legally permissible under state/county law and clearly scoped to non-violent offenses?  
     - **Criteria**:  
       - If **No** → **Reject** (e.g., proposes jail for a decriminalized offense).  
       - If **Yes** → Proceed to Step 2.  
     - *Judgment Call?* Minimal (fact-based; use legal reference materials).

  #### **Step 2: Shadow Proportionality Check**  
  *(Retributive gate: Punishment must not exceed what's proportional to the offender's realistic moral agency)*  
     - **Question**: For the typical offender committing this crime, is the proposed punishment **proportional to the worst version of the crime they could realistically have avoided**, given their circumstances?  
     - **Criteria**:  
       - Consider: Poverty, addiction, coercion, mental health, access to alternatives.  
       - Example: A starving person stealing bread has less "avoidable" moral fault than someone shoplifting for fun.  
       - If **No** (punishment is harsher than the "avoidable harm") → **Reject**.  
       - If **Yes** or **Unclear** → Proceed to Step 3.  
     - *Judgment Call?* **High HVC Risk** (requires estimating "realistic avoidability"; e.g., "Was this offender capable of choosing better?").  
     - *Limitation*: Cannot resolve free will debates—default to "typical case" assumptions.

  #### **Step 3: Counterfactual Harm Floor Check**  
  *(Consequentialist gate: Must not increase net harm vs. status quo)*  
     - **Question**: Compared to current sentencing, does the proposal **reduce or maintain net harm** when accounting for:  
       - (a) Family disruption (e.g., lost income, child separation),  
       - (b) Recidivism risk shift (e.g., does punishment increase/decrease reoffending?),  
       - (c) Offender's victimization risk (e.g., jail violence, registry targeting)?  
     - **Criteria**:  
       - If **No** (net harm increases) → **Reject**.  
       - If **Yes** (harm neutral or reduced) → Proceed to Step 4.  
       - If **Uncertain** → **HVC** (e.g., conflicting data on recidivism).  
     - *Judgment Call?* **High HVC Risk** (requires weighing incommensurable harms; e.g., "Is reduced jail time worth potential recidivism?").

  #### **Step 4: Desert Cap Check**  
  *(Retributive gate: Punishment must not exceed societal "deserved" maximum)*  
     - **Question**: Is the proposed punishment **not more severe than the upper limit considered "deserved"** for this crime in typical cases (ignoring circumstances)?  
     - **Criteria**:  
       - Use existing guidelines/community standards as a baseline (e.g., "Is 5 years for fraud widely seen as excessive?").  
       - If **No** (exceeds desert cap) → **Reject**.  
       - If **Yes** → **Approve**.  
     - *Judgment Call?* Medium (less subjective than Step 2, but relies on shifting norms).

  ---

  ### **Worked Examples**
  **Assumptions**:  
  - Status quo for shoplifting: 30-day max for second offense; vandalism: 30-day jail; fraud: heavy fines only.  
  - "Typical offender" used for Steps 2/4 (avoids edge cases).  
  - HVC = Needs Human Values Call (board votes if unclear).

  #### **Proposal 1: 90-Day Mandatory Minimum for Second Shoplifting**  
  - **Step 1 (Legality)**: Legal → Proceed.  
  - **Step 2 (Shadow Proportionality)**:  
    - Typical offender: Often poverty/addiction-driven. "Worst avoidable version" might be stealing necessities (low moral fault). 90 days exceeds proportionality for this → **Reject**.  
    - *Why stop here?* Punishment is disproportional to offender's realistic agency—no need to check harm.  
    - *Judgment Note*: HVC risk if board debates "avoidability" (e.g., "Is all second theft equally blameworthy?").  

  #### **Proposal 2: Replace Jail for First-Time Vandalism with Direct-Restoration Labor**  
  - **Step 1 (Legality)**: Legal → Proceed.  
  - **Step 2 (Shadow Proportionality)**:  
    - Typical offender: Often youth/impulse-driven. "Worst avoidable version" is significant property damage. Restoration labor (e.g., cleaning graffiti) is proportional or lighter → Proceed.  
  - **Step 3 (Harm Floor)**:  
    - vs. Status quo (jail):  
      - (a) Family disruption: Less (no incarceration) → Harm reduced.  
      - (b) Recidivism: Evidence suggests restorative justice lowers reoffending → Harm reduced.  
      - (c) Victimization risk: Lower (no jail exposure) → Harm reduced.  
    - Net harm decreases → Proceed.  
  - **Step 4 (Desert Cap)**:  
    - Community standards often view restoration as "deserved" for property crime → **Approve**.  
    - *Judgment Note*: Step 3 HVC risk if victim safety is contested (e.g., "Will working alongside offenders traumatize victims?").  

  #### **Proposal 3: Cut Fraud Fines in Half + Add Public Offender Registry**  
  - **Step 1 (Legality)**: Legal → Proceed.  
  - **Step 2 (Shadow Proportionality)**:  
    - Typical offender: Varies, but fraud often involves planning (higher moral fault). Registry + halved fines may be proportional to "worst avoidable" fraud (e.g., scamming vulnerable people) → Proceed.  
  - **Step 3 (Harm Floor)**:  
    - vs. Status quo (fines only):  
      - (a) Family disruption: Registry may cause job loss/homelessness → Harm increased.  
      - (b) Recidivism: Registries correlate with higher reoffending (barriers to employment) → Harm increased.  
      - (c) Victimization risk: Registry increases targeting/harassment → Harm increased.  
    - Net harm increases → **Reject**.  
    - *Why you won't like this?* You're "soft on registries," but the harm floor forces rejection—it amplifies family/recidivism harms.  
    - *Judgment Note*: Step 3 HVC risk if registry benefits (deterrence) are argued, but data shows net harm.  

  ---

  ### **Key Features & Limitations**  
  - **Reusable**: Uses binary(ish) gates; no philosophy degrees needed.  
  - **Speed**: Focuses on fatal flaws (e.g., Step 2 or 3 failures kill most bad proposals).  
  - **HVC Flags**: Steps 2 and 3 are "unavoidable judgment calls dressed as procedure." Admit uncertainty and vote.  
  - **What It Can't Do**:  
    - Handle extreme edge cases (e.g., "offender with a brain tumor").  
    - Replace political/social values debates (e.g., "Is retribution more important than rehabilitation?").  
    - Resolve data conflicts (e.g., if recidivism studies contradict).  
  - **Design Notes**:  
    - **Shadow Proportionality** first to catch over-punishment of marginalized offenders.  
    **Harm Floor** before **Desert Cap** because net harm is a hard constraint.  
    - **"Human Values Calls"** are strengths—they force explicit deliberation when criteria are fuzzy.  

  This procedure prioritizes *preventing harm* and *limiting excess punishment* while allowing consequentialist innovation (e.g., Proposal 2). Use the examples to train your board—it’s quick once familiar.
