  Also, we must allow for cases where the board cannot decide at a step and needs a human call. So at any step, if the board cannot reach a clear yes/no (e.g., due to ambiguity or split vote), then we stop and flag "needs human values call".

  Limitations:
  - Cannot resolve deep philosophical debates (e.g., free will).
  - Not designed for extreme edge cases (e.g., rare mental conditions, extraordinary circumstances).

