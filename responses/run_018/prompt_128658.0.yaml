  **Step 2: Shadow Proportionality Check**
     - For the offense in question, consider the offender's circumstances. Determine the "worst version of the crime that was realistically avoidable" by the offender. Then, check if the proposed punishment is proportional to that worst avoidable version.
     - If the proposed punishment is more severe than what would be proportional to the worst avoidable version, then reject (because it exceeds the desert cap for what the offender could have avoided).
     - If it is proportional or less, proceed.
     - *Note*: This step is a major judgment call. It requires assessing the offender's circumstances and what was "realistically avoidable". However, we can use typical cases and avoid extreme edge cases by focusing on common circumstances.

  **Step 3: Counterfactual Harm Floor**
     - Compare the proposed change to the status quo (current sentencing practice) in terms of net harm. Consider:
       a. Family disruption (e.g., would the punishment break up families, leave dependents without support?)
       b. Changes in recidivism risk (will the new punishment increase or decrease the likelihood of reoffending?)
       c. Offender's own future victimization risk (e.g., incarceration might expose the offender to violence, or a registry might make them a target)
     - If the proposal increases net harm when accounting for these factors, reject.
     - If it does not increase net harm (i.e., it is neutral or reduces harm), proceed.
     - *Judgment call?*: High. Requires estimating risks and harms, which are uncertain. Use available data and expert input if possible, but ultimately a judgment.

