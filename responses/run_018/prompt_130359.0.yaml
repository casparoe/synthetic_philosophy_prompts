answer: |-
  Here are five numbered points comparing evolutionary debunking arguments and moral exaptation regarding metaethical beliefs:

  1.  **Causal Origin as Undercutting:** Evolutionary debunking emphasizes that the causal origin of moral beliefs (e.g., kin selection) is unrelated to tracking moral truth, directly undermining their justification.
  2.  **Function Shift as Counter:** The exaptation view counters by arguing that while the mechanism *originated* for narrow tribal functions, its *current* function (enabling universalist ethics) is distinct and potentially truth-apt.
  3.  **Reliability Question:** Debunking asserts the evolutionary origin renders moral cognition fundamentally unreliable for discerning objective truths, regardless of later applications.
  4.  **Contamination vs. Transformation:** Exaptation suggests repurposing *could* weaken the debunking worry if the mechanism now functions reliably in its new role, but debunking argues the original, truth-irrelevant selective pressures still fundamentally "contaminate" the cognitive output.
  5.  **Justification Pathway:** Debunking often concludes the causal history severs any necessary link to truth, requiring independent rational justification for beliefs, while exaptation potentially preserves a pathway where the repurposed function itself could be justified by its current role, even if origins are non-truth-tracking.
