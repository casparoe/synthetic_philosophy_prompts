  Hi — I'm a retired experimental physicist who's been auditing philosophy courses since I retired, and I'm helping a colleague put together a take-home exam for her grad seminar on formal epistemology. I want one essay question on Jeffrey conditionalization and uncertain evidence, but I don't want students to just recite the formula. Instead, I want them to confront what I'm calling the "boundary rigidity problem" (I just made that up): suppose you recieve a noisy continuous measurement — say a spectral line that might belong to model A (center near 500 nm) or model B (center near 520 nm) — and the error bars stradle both regions. Jeffrey's rule says partition your hypotheses and update probabilities within each cell, but drawing the boundary between "evidence for A" and "evidence for B" seems to presuppose the very prior weights you're trying to update. Ask them to explain Jeffrey's rule precisely, apply it to this kind of continuous case, argue whether the boundary choice is genuinely arbitrary or can be fixed by the likelihood function alone, and say whether this undermines Jeffrey's claim to be a generalization of Bayes.

  Please write the exam prompt itself, a model answer of about 650–750 words, and a marking scheme with five specific moves an A answer must make, with marks assigned (total out of 25). For each move, include a one-line note on the typical mistake that costs points. The scheme should clearly seperate an A from a B.

  Please have the answer written in American English, and please have it include a paragraph on what would change the author's mind — i.e., what specific argument or result would make them reject their conclusion about whether Jeffrey survives the boundary problem. Also, no bibliographies, reading lists, or citation requests — I want them reasoning, not name-dropping.
reasoning: |-
  We are creating an exam prompt on Jeffrey conditionalization and the boundary rigidity problem. The prompt should ask students to explain Jeffrey's rule, apply it to the spectral line example, discuss the boundary choice, and evaluate whether this undermines Jeffrey's claim as a generalization of Bayes.

  We'll then create a model answer of 650-750 words, including a paragraph on what would change the author's mind.

  Finally, we'll design a marking scheme out of 25, with five specific moves (each worth 5 points) that an A answer must make, along with typical mistakes for each.

  Let's start with the exam prompt.

  **Exam Prompt:**

  **Question:** In formal epistemology, Jeffrey conditionalization offers a method for updating beliefs in response to uncertain evidence. Consider a scenario from experimental physics: you observe a spectral line that could belong to one of two models. Model A predicts a central wavelength near 500 nm, and Model B near 520 nm. Due to measurement noise, the observed spectral line has a broad peak with error bars that straddle both regions (say, from 490 nm to 530 nm). You wish to update your prior probabilities for Models A and B given this uncertain evidence.

  (a) Precisely state Jeffrey conditionalization, including the partition of hypotheses and the role of the evidence partition. (Word limit: 150 words)

  (b) Apply Jeffrey conditionalization to this spectral line scenario. How would you partition the evidence? Explain the challenge of drawing the boundary between "evidence for A" and "evidence for B" when the error bars overlap both regions. (Word limit: 200 words)

  (c) Argue whether the choice of boundary is genuinely arbitrary or if it can be fixed solely by the likelihood function. (Word limit: 200 words)

  (d) Does this "boundary rigidity problem" undermine Jeffrey conditionalization's claim to be a generalization of Bayesian updating? Explain why or why not. (Word limit: 200 words)

  (e) Concluding reflection: What specific argument or result might change your mind about the conclusion you reached in part (d)? (Word limit: 100 words)

  **Total word limit: 850 words. Please adhere strictly to the word limits for each part.**

  ---

  **Model Answer (Approx. 700 words):**

  (a) Jeffrey conditionalization updates a prior probability distribution when new evidence is uncertain. We partition the hypothesis space into mutually exclusive and exhaustive alternatives, say {H_i}. Crucially, we also partition the evidence space into cells {E_j} such that the evidence directly affects our degrees of belief over these cells. The update rule is: for each hypothesis H_i, the posterior probability P_new(H_i) = ∑_j P_old(H_i | E_j) * P_new(E_j), where P_new(E_j) are our new degrees of belief in the evidence cells after the observation. The rule requires that we set the new evidence probabilities P_new(E_j) exogenously and that the likelihoods P_old(H_i | E_j) remain unchanged.

  (b) In the spectral line case, we have two hypotheses: H_A (Model A) and H_B (Model B). The evidence is the observed wavelength, a continuous value. To apply Jeffrey, we must partition the evidence space. A natural partition might be two cells: E_A (evidence for A) for wavelengths near 500 nm, and E_B (evidence for B) near 520 nm. However, due to the broad error bars (490-530 nm), the observed value could be in the overlapping region. The challenge: drawing the boundary between E_A and E_B (e.g., at 510 nm) is arbitrary. If we set the boundary at 510 nm, then an observation of 509 nm is fully counted as E_A and 511 nm as E_B. But the prior probabilities of H_A and H_B influence how we interpret the evidence. For instance, if we have a strong prior for H_A, we might set the boundary closer to 520 nm to capture more of the overlap as evidence for A. Thus, the partition seems to depend on the priors we are trying to update, creating a circularity.

  (c) The boundary choice cannot be fixed by the likelihood function alone. The likelihood function tells us P(observation | H_A) and P(observation | H_B). For a given observation, say 505 nm, we can compute the likelihood ratio to compare H_A and H_B. However, Jeffrey conditionalization requires a partition of the evidence space, which is a coarsening of the continuous evidence. The decision to group a range of observations into E_A or E_B is not dictated by the likelihoods. It is a modeling choice. Without additional constraints (like a pre-specified partition based on the experimental setup), the partition is arbitrary. One might argue that the likelihoods could guide the partition by setting boundaries at points where the likelihood ratio is 1 (i.e., where the evidence is equally supportive). But this still requires a choice: why partition at all? Why not use a continuous update? Jeffrey's rule, as stated, demands a partition. Thus, the boundary remains arbitrary without external input.

  (d) This boundary rigidity problem does not undermine Jeffrey conditionalization's claim to be a generalization of Bayes. Bayesian updating is a special case when the evidence partition is a single point (i.e., when we are certain of the evidence). Jeffrey generalizes this by allowing uncertain evidence via a partition. The circularity in setting the boundary is not a flaw in the rule but reflects the underdetermination of the evidence partition. In practice, the partition is chosen based on pragmatic or contextual factors. Moreover, the update within each cell is still Bayesian. The rule's structure remains a valid generalization because it reduces to Bayes when the evidence is certain. The problem lies not in the rule but in the application to continuous evidence without a natural partition. Jeffrey conditionalization still provides a coherent framework for updating with uncertain evidence when the partition is appropriately chosen.

  (e) My conclusion that Jeffrey survives the boundary problem would be challenged by a proof that no non-arbitrary partition can be made in the continuous case, leading to inconsistent updates. If it were shown that different partitions, all seemingly reasonable, produce posterior probabilities that are mutually incompatible (i.e., violating the constraints of probability theory), then the coherence of Jeffrey updating would be undermined. Alternatively, if a concrete example demonstrated that the choice of partition leads to violations of the Dutch book or other rationality criteria, I would reconsider. However, as long as the rule is applied with a fixed partition and the update is internally consistent, the generalization stands.

  ---

  **Marking Scheme (Total: 25 points):**

  An A answer (21-25 points) must make the following five moves. Each move is worth up to 5 points. Below each move, we note a typical mistake that would cost points (usually 2-3 points for partial or flawed execution, and 0 for missing).

  1. **Precise Statement of Jeffrey Conditionalization (5 points):**  
     The answer must correctly state the rule: the posterior is a weighted average of the posteriors conditioned on each evidence cell, weighted by the new probabilities of the evidence cells. It must mention the partition of hypotheses and evidence, and that the likelihoods (or conditional probabilities given the evidence) remain fixed.  
     *Typical mistake:* Just writing the formula without explaining the partitions, or confusing the evidence partition with the hypothesis partition.

  2. **Application to Spectral Scenario and Boundary Challenge (5 points):**  
     The answer must apply Jeffrey to the spectral case by partitioning evidence (e.g., into E_A and E_B) and explain the problem: the boundary between E_A and E_B is arbitrary because the error bars overlap, and the choice of boundary might depend on the priors, creating a circularity.  
     *Typical mistake:* Describing the update without partitioning the evidence, or failing to explain how the overlap makes the boundary choice difficult and possibly prior-dependent.

  3. **Argument on Arbitrariness of Boundary (5 points):**  
     The answer must argue that the boundary cannot be fixed solely by the likelihood function because the partition is a modeling choice. It should note that while likelihoods can inform the partition (e.g., setting the boundary at the likelihood-ratio equivalence point), the necessity of a partition and its granularity is not determined by the likelihoods alone.  
     *Typical mistake:* Claiming that the likelihood function alone can fix the boundary without acknowledging the need for a discrete partition, or not addressing the coarsening issue.

  4. **Evaluation of Generalization Claim (5 points):**  
     The answer must clearly state whether the boundary problem undermines Jeffrey's status as a generalization of Bayes and defend the position. It should explain that the rule generalizes Bayes by allowing uncertain evidence (via partitions) and that the problem is one of application, not the rule itself.  
     *Typical mistake:* Concluding that the problem undermines the generalization without explaining how Jeffrey reduces to Bayes, or failing to separate the rule's validity from the challenge of partition choice.

  5. **Concluding Reflection on Mind-Changing Argument (5 points):**  
     The answer must include a specific and plausible scenario (like an inconsistency proof or a rationality violation) that would change their mind about the conclusion in (d).  
     *Typical mistake:* Vague or unrelated scenarios (e.g., "if someone proved it wrong") without a concrete example of what would challenge the conclusion.

  **Grading Boundaries:**  
  - A: 21-25 points (all five moves made clearly and correctly)  
  - B: 16-20 points (at least four moves made, but one weak or flawed; or all present but two partially flawed)  
  - C: 11-15 points (three moves made adequately, or more but with significant flaws)  
  - D: 6-10 points (two moves made)  
  - F: 0-5 points (one or fewer moves)

  Note: Word limit violations may result in a penalty of up to 5 points (at the grader's discretion) if they impede the clarity or completeness of the answer.
answer: |-
  ### Exam Prompt: Jeffrey Conditionalization and the Boundary Rigidity Problem  
  **Total Points: 25**  
  **Word Limit: 850 words (strictly enforced; excess words will not be graded)**  

  **Background:** Jeffrey conditionalization updates probabilities when evidence is uncertain (e.g., ambiguous experimental data). Unlike Bayes, it partitions evidence into distinct "cells" (e.g., "supports A" or "supports B") and updates hypotheses within each cell. However, defining these cells can be contentious when evidence straddles competing hypotheses.  

  **Scenario:** As a physicist, you observe a spectral line with a broad peak (error bars: 490–530 nm). Model A predicts a center near 500 nm; Model B near 520 nm. You have priors for A and B but cannot precisely assign the observation to either model due to noise.  

  **Tasks:**  
  1. **Explain** Jeffrey conditionalization formally. Define the evidence partition and update rule. (5 points; ~150 words)  
  2. **Apply** Jeffrey’s rule to the spectral line case. How would you partition the evidence? Articulate the "boundary rigidity problem": why drawing a boundary (e.g., at 510 nm) might depend on priors. (5 points; ~200 words)  
  3. **Argue**: Is the boundary choice arbitrary? Can likelihoods (e.g., \(P(\text{data} \mid A)\) vs. \(P(\text{data} \mid B)\)) fix it without priors? Defend your view. (5 points; ~200 words)  
  4. **Evaluate**: Does this problem undermine Jeffrey’s claim to generalize Bayesian updating? (Recall: Bayes assumes certain evidence.) Justify your answer. (5 points; ~200 words)  
  5. **Reflection**: What specific argument or result would make you reject your conclusion in (4)? (5 points; ~100 words)  

  ---

  ### Model Answer (706 words)  

  #### 1. Explanation of Jeffrey Conditionalization  
  Jeffrey conditionalization updates a prior probability distribution \(P_{\text{old}}\) when evidence is uncertain. It requires partitioning evidence into mutually exclusive, exhaustive cells \(E_1, E_2, \dots, E_n\). For hypotheses \(H_i\) (e.g., Model A or B), the posterior \(P_{\text{new}}(H_i)\) is:  
  \[
  P_{\text{new}}(H_i) = \sum_{j} P_{\text{old}}(H_i \mid E_j) \cdot P_{\text{new}}(E_j).
  \]  
  Here, \(P_{\text{old}}(H_i \mid E_j)\) is the Bayesian posterior *if* \(E_j\) were certain, and \(P_{\text{new}}(E_j)\) is the *newly assigned* probability for evidence cell \(E_j\) after observation. Critically, \(P_{\text{new}}(E_j)\) is set exogenously (e.g., by intuition or measurement confidence), while \(P_{\text{old}}(H_i \mid E_j)\) remains fixed. The rule assumes conditional probabilities given evidence are stable.  

  #### 2. Application to Spectral Lines and Boundary Rigidity  
  For the spectral line, partition evidence into \(E_A\) (supports Model A) and \(E_B\) (supports Model B). For example, define \(E_A\) as wavelengths \(\leq 510\) nm and \(E_B\) as \(> 510\) nm. After measuring a noisy peak (e.g., 505 nm), assign \(P_{\text{new}}(E_A)\) and \(P_{\text{new}}(E_B)\) subjectively (e.g., \(P_{\text{new}}(E_A) = 0.7\) if closer to 500 nm). Then, compute:  
  \[
  P_{\text{new}}(A) = P_{\text{old}}(A \mid E_A) \cdot P_{\text{new}}(E_A) + P_{\text{old}}(A \mid E_B) \cdot P_{\text{new}}(E_B).
  \]  
  The **boundary rigidity problem** arises because the partition (e.g., 510 nm) is arbitrary. Error bars (490–530 nm) span both hypotheses, so a measurement near 510 nm could weakly support either model. Crucially, \(P_{\text{old}}(A \mid E_j)\) depends on the prior \(P_{\text{old}}(A)\)—e.g., if \(P_{\text{old}}(A)\) is high, \(P_{\text{old}}(A \mid E_B)\) might still favor A even in \(E_B\)’s region. But the partition itself (*defining* \(E_A\)/\(E_B\)) implicitly assumes a prior. If we set the boundary at 515 nm instead, \(P_{\text{new}}(E_A)\) and likelihoods shift, altering posteriors. Thus, choosing the boundary requires presupposing which regions "belong" to A or B—a circular dependency on priors.  

  #### 3. Boundary Choice: Arbitrary or Likelihood-Determined?  
  The boundary cannot be fixed by likelihoods alone. Likelihoods \(P(\text{data} \mid H_i)\) are hypothesis-relative and inform how well a *specific* datum supports \(H_i\), but they do not dictate how to bin *ranges* of data into discrete cells \(E_j\). For instance, the likelihood ratio \(\frac{P(505 \text{ nm} \mid A)}{P(505 \text{ nm} \mid B)}\) quantifies relative support for A vs. B at 505 nm, but it does not specify whether 505 nm should be in \(E_A\) or \(E_B\). That choice requires aggregating likelihoods over a continuous interval, which depends on a weighting (e.g., integrating likelihoods over 500–510 nm), but this weighting itself depends on the prior density over wavelengths. Without priors, likelihoods are silent on optimal partitions. One might use likelihood-ratio thresholds (e.g., \(E_A\) where \(P(\text{data} \mid A) > P(\text{data} \mid B)\)), but this merely shifts arbitrariness to threshold selection. Thus, boundaries are not uniquely determined by likelihoods; they require prior-dependent judgment.  

  #### 4. Does This Undermine Jeffrey as a Generalization of Bayes?  
  No, the boundary problem does not undermine Jeffrey’s claim to generalize Bayes. Bayesian updating is the special case where evidence is certain (i.e., a single \(E_j\) with \(P_{\text{new}}(E_j) = 1\)). Jeffrey extends this by accommodating uncertain evidence via partitions. The boundary rigidity is a *practical* issue of application, not a flaw in the rule’s formalism. Jeffrey still enforces coherence (e.g., probabilities sum to 1) and reduces to Bayes when evidence is sharp. The dependence on partitions highlights that uncertain evidence requires external input (\(P_{\text{new}}(E_j)\) and cell definitions)—much like Bayes requires likelihoods. Thus, while boundary choice affects outcomes, this does not invalidate the generalization; it merely shows that Jeffrey, like Bayes, relies on subjective inputs when data is noisy. It remains a strict generalization because Bayes cannot handle graded evidence without discretization.  

  #### 5. What Would Change My Mind?  
  I would reject my conclusion if shown that all possible partitions yield *inconsistent* posteriors (e.g., if \(P_{\text{new}}(A)\) diverges dramatically for equally "natural" boundaries, violating probabilistic coherence). For example, a proof that no partition exists where posteriors satisfy the probability axioms unless boundaries align with priors would imply Jeffrey is not prior-agnostic. Alternatively, a theorem demonstrating that Jeffrey updates from different partitions cannot be reconciled without Bayesian conditioning would undermine its generality. Empirical evidence of irrational decisions (e.g., Dutch books) arising from arbitrary partitions would also challenge its normative status.  

  ---

  ### Marking Scheme (Total: 25 points)  
  **A Grade (21–25 points)**: Must achieve all five "key moves" below. A B answer (16–20 points) omits/muddles 1–2 moves.  

  | Key Move (5 pts each)                                                                                               | What to Assess                                                                                                                               | Typical Mistake (Costs 2–3 pts per move)                                                                 |  
  |------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|  
  | **1. Correct formal statement of Jeffrey conditionalization.** Must include: evidence partition, formula, fixed conditionals, exogenous \(P_{\text{new}}(E_j)\). | Formula accuracy, partition definition, and role of \(P_{\text{new}}(E_j)\).                                                              | Reciting the formula without defining partitions or misstating \(P_{\text{new}}(E_j)\)’s origin (e.g., "derived from data"). |  
  | **2. Apply Jeffrey to spectral case; articulate boundary rigidity.** Must partition evidence and explain circularity: boundary choice depends on priors being updated. | Clear partition (e.g., 510 nm), link to Jeffrey’s rule, and prior-dependency in defining cells.                                           | Vague partition (e.g., "separate regions") or missing why boundary choice presupposes priors.                    |  
  | **3. Argue boundary not fixed by likelihoods alone.** Must reject likelihoods as sufficient, explaining why bins require priors (e.g., threshold arbitrariness). | Explicit denial of likelihood sufficiency and prior-dependency in binning continuous data.                                                | Claiming likelihood ratios "solve" the problem without addressing binning or threshold subjectivity.           |  
  | **4. Defend Jeffrey as generalization of Bayes.** Must state: (i) Bayes = special case (certain evidence), (ii) boundary issue ≠ formalism flaw. | Comparison to Bayes, generalization claim, and boundary problem as application-specific.                                                  | Concluding Jeffrey is "invalid" or ignoring reduction to Bayes when evidence is certain.               |  
  | **5. Specific mind-change condition.** Must describe a testable failure (e.g., inconsistency across partitions) or rationality violation. | Plausible scenario (e.g., coherence loss) that empirically/theoretically challenges (4).                                                 | Vague response (e.g., "new evidence") or unrelated criterion (e.g., "if Bayes is wrong").              |  

  **Word Limit Penalty**: Subtract 1 point per 20 words over the limit (applied once to total).
