prompt: |-
  hey so im doing a philosophy project for school and i got stuck on this weird thing about art restoration. like, conservators have this practice where if they discover part of an old painting was secretly repainted by a forger centuries ago, they scrape the fake layer off to reveal the ruined original underneath, even when the forgery looks way better and the actual bit is basically destroyed. but then if the original was totally lost and only the forgery survives, they label it a fake and wont hang it in the gallery at all. it feels like theyre treating the exact same object differently just because of whats hidden inside it. what view of authenticity or value does that presuppose? is it about the artists actual hand, the objects history, or avoiding deception? can you reconstruct the hidden philosophy behind the practice, say whether its actually consistent, and tell me what museum policy would have to change if we decided a perfect replica is just as valuable as the original? please write in british english, keep it casual, and no bibliography needed — just your own reasoning.
