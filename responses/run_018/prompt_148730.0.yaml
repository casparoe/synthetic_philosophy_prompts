answer: |-
  Blimey, that's a proper brain-tickler, innit? You've nailed a fascinating paradox at the heart of art conservation and museum ethics. Let's break it down casually, like a chat over a cuppa.

  **The Hidden Philosophy Behind the Scrape:**

  1.  **The Cult of the Artist's Hand (and Intent):** At its core, museums are obsessed with the **original creator's moment of creation**. It's not just about the *look* of the thing, but the physical trace of the artist – the brushstroke, the pigment they mixed, the canvas they touched. That's seen as irreplaceable, sacred even. When they scrape off the later forgery (even if it's centuries old and looks better), they're saying: "We'd rather have the *genuine*, albeit damaged, remains of Rembrandt's own effort and vision – his *actual* mark on the world – than a prettier lie made by someone else." It's about **authenticity of origin**.

  2.  **Historical Truth & Provenance:** Museums see themselves as guardians of **historical truth**. The painting is a physical document of its time. The original surface, even ruined, tells the *true* story of the artist, their materials, their techniques, and the artwork's initial life. The forgery layer tells the story of deception and later intervention. Scraping it off is an attempt to restore the object's *true* historical narrative, warts and all. They value the **object's biography** – its *real* journey through time – above its current aesthetic appeal.

  3.  **Allergy to Deception:** There's a deep-seated **aversion to presenting something fake as genuine**, even if the deception happened ages ago. Hanging the painting *with* the skilled forgery intact feels like perpetuating a lie. Removing it, even revealing damage, is seen as an act of honesty, even if the result is less visually pleasing. The museum's credibility hinges on saying, "This *is* what the artist made, this is its *true* state."

  4.  **The "Aura" of the Original:** This borrows a bit from Walter Benjamin (though you said no bibliography!). The original is believed to possess a unique "aura" – a presence derived from its specific history, creation, and survival. A forgery, no matter how old or skilled, lacks this because its *origin* is inauthentic. The ruined original still has the aura of being *that* object made by *that* artist; the forgery's aura is fundamentally false.

  **The Standalone Forgery Dilemma:**

  Now, why does the *same* skilled forgery get binned if it's the only thing left? Because it fails the core tests above:
  *   **No Artist's Hand:** It lacks the physical trace of the original creator.
  *   **False Provenance:** Its entire history is built on a lie. Its biography *is* the deception.
  *   **Deception is Its Essence:** It was *created* to deceive, whereas the overpainted section was a later modification of a genuine object.
  *   **No Original "Aura":** It never *was* the original; its aura is counterfeit from birth.

  **Is it Consistent?**

  On the surface, it seems bonkers: scraping off a beautiful old fake to reveal a wreck, but binning an identical fake if it stands alone. **Logically, it *is* inconsistent if you only judge by aesthetic value or even age.** A 17th-century forgery *is* a genuine 17th-century artifact... just not of the artist it claims to be.

  **However, within the museum's core philosophy, it *is* consistent:**

  1.  **The Object's Core Identity:** In the overpainted case, **the core object underneath *is* the genuine original.** The forgery is an accretion, a later addition obscuring the true artefact. Removing it reveals the authentic "heart" of the object.
  2.  **The Standalone Forgery:** Here, **the core object *itself* is inauthentic.** There *is* no genuine "heart" to reveal. Its entire existence is predicated on falsehood.

  The key difference is **what the fundamental, original artefact *is***. For the conservator, scraping the overpaint is an act of *revealing* the true object. The standalone forgery *is* the object, and its nature is fundamentally deceptive.

  **What if Perfect Replicas Were Equal? Museum Meltdown!**

  If museums suddenly declared a perfect replica (historical forgery or modern copy) just as valuable as the original, it would turn their world upside down:

  1.  **Collections Crisis:** Most major museums hold works specifically *because* they are the originals. Suddenly, a perfect replica would be just as "good". Why own the Mona Lisa if a flawless copy is identical in value? Collections based on rarity and uniqueness collapse.
  2.  **Display Dilemma:** Galleries would be full of replicas. You'd queue to see... a copy? The whole "pilgrimage to see the real thing" vibe vanishes. Labels would say "Authentic-looking Mona Lisa (Replica)" – hardly inspiring.
  3.  **Conservation Conundrum:** Why spend millions painstakingly conserving the original if a replica is identical? Just make another copy when it fades! Conservation departments might become replication labs.
  4.  **The Market Implodes:** The art market, built on scarcity and provenance, would crash. Why pay billions for an original if a copy is worth the same?
  5.  **Lost "Aura":** The mystical value of the original – the sense of connection to the artist and history – is deliberately sacrificed. Museums become more like high-quality print shops or Madame Tussauds for art.
  6.  **Focus Shift:** Value would shift entirely to **aesthetic experience and technical skill** alone. It wouldn't matter *who* made it or *when*, only how good it looks and how well it was made. Museums would become more like galleries for contemporary craft, judged purely on visual merit, not history.

  **In a Nutshell:**

  The current practice hinges on fetishising the **original material trace of the artist's creation and intent**, valuing **historical truth and provenance** above all else, and having a **pathological hatred of deception**. It treats the overpainted original differently because its "core" is genuine; the standalone forgery has a "core" of falsehood. It *is* logically consistent *within its own, very specific value system* focused on origins and authenticity.

  Saying a perfect replica is equal throws that entire value system out the window. Museums would fundamentally change from temples of unique historical relics into venues for aesthetic experience, where the *idea* of the artwork matters more than the specific physical object. It's a massive philosophical shift! Good luck with the project – you've picked a brilliantly knotty problem. It shows how museums aren't just about pretty pictures; they're built on some pretty deep (and sometimes wonky) ideas about what makes something *real* and *valuable*.
