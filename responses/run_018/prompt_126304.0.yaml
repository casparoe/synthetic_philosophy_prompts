  *Question*: If a barrier splits the colony into halves pursuing incompatible foraging goals for days, does the original colony still exist as a single mind (not two minds or no mind)?  
  - **Yes** → Proceed to Branch 3.  
  - **No** → Proceed to Branch 4.  
  - **Unclear** → **Leaf: Unresolved**.  

  #### **Branch 3: Representational Content Scenario**  
  *Question*: If pheromone trails misrepresent food location yet the colony corrects the error, does this imply the colony uses representational content with truth-conditions (not just causal tracking)?  
  - **Yes** → **Leaf: Logically unoccupied position** (phenomenal consciousness without integrated functional organization).  
