prompt: |-
  My collegue studies Hacking-style looping in psychiatric categories and whether that justifies retiring or keeping a diagnosis. Her track record: she kept ADHD for adults despite clear looping because the feedback loop actually improves coping skills; she wants to drop "high-functioning autism" since the label pushes people to perform the stereotype; she kept dissociative identity disorder even with strong looping because access to care depends on it; she said internet gaming disorder hasn't looped yet because patients don't identify with the label; she kept prolonged grief disorder despite weak looping since it's mostly clinicians talking to clinicians. Now there's a proposed category called "algorithmic dysphoria" — distress tied specifically to knowing your emotional state is being predicted and nudged by reccomendation algorithms, where patients start curating feelings for the system. Do you think she'll keep, revise, or scrap it? What's the actual rule she's running — harm to identity, clinical utility, whether the loop is self-aware? And which competing rules fit her past calls just as well? Finally, what's the one case that'd actually tell them apart?
reasoning: |-
  Okay, the user presents a fascinating puzzle about their colleague's decision-making framework regarding psychiatric categories and Hacking-style looping. The colleague seems to operate on nuanced principles that aren't immediately obvious, and the user wants me to reverse-engineer her consistent rule from past cases while also identifying a diagnostic test case.

  First, let's unpack Hacking's concept of interactive kinds - how psychiatric classifications can reshape the very behaviors they describe. The colleague's pattern shows: ADHD kept despite looping because it improves coping (positive loop), high-functioning autism scrapped due to harmful stereotyping, DID kept for clinical access necessity, internet gaming disorder kept due to lack of patient identification (no loop), and prolonged grief kept despite weak looping because it serves clinical discourse.

  Looking at algorithmic dysphoria - distress from knowing algorithms predict/nudge emotions, leading to emotional curation for the system. This seems ripe for strong looping with potential identity harm, but clinical utility is ambiguous. The colleague would likely scrap it because the core harm is to authentic selfhood through forced emotional performance - mirroring the autism case where labels enforce performance.

  Her primary rule appears to be: Scrap categories where looping causes identity harm through coerced self-presentation, unless clinical necessity overrides (as with DID). Secondary factors include presence of self-aware looping (ADHD coping) and ecosystem maturity (prolonged grief's clinician-focused use).

  Interesting alternatives could be: 1) Patient identification as key (fits autism/internet gaming cases), 2) Clinical utility as paramount (fits DID/prolonged grief), or 3) Preventing iatrogenic harm (fits autism/ADHD contrast). The smoking gun test case would be a diagnosis with strong patient identification AND clear identity harm but high clinical utility - like if "algorithmic dysphoria" patients actively embraced the label while suffering from emotional curation. The colleague would likely scrap it anyway, proving identity harm trumps patient identification.

  The user's deeper need seems to be understanding how to navigate the ethics of diagnostic labels in an age where technology itself becomes a psychological stressor. They're probably wrestling with how to balance clinical pragmatism against preserving patient autonomy in rapidly emerging digital pathology spaces.
answer: |-
  Based on your colleague's track record and the core principles emerging from her decisions, here's the breakdown for "algorithmic dysphoria":

  1.  **Prediction for Algorithmic Dysphoria: SCRAP IT.**  
      *   **Why?** The core harm described directly mirrors the reason she scrapped "high-functioning autism": **Identity Harm & Coerced Performance.** Patients are "curating feelings for the system," meaning the label itself pushes them to perform a specific emotional state to interact with or appease the algorithm. This fundamentally distorts authentic emotional experience and self-presentation to fit the system's expectations, creating a harmful feedback loop damaging to identity integrity. The *nature* of the looping (self-aware curation for an external system) is inherently problematic in her framework, regardless of current clinical utility or patient identification levels. There's no overriding clinical necessity argument (like DID) or clear coping benefit (like ADHD) mentioned here.

  2.  **The Actual Rule She's Running: Minimize Identity Harm from Coerced Performance.**  
      *   **Harm to Identity:** This is the dominant factor. Labels are scrapped when they demonstrably cause patients to distort their authentic selves or behaviors to conform to the label's expectations or associated stereotypes in harmful ways ("high-functioning autism" performance, algorithmic "curation").
      *   **Clinical Utility as a Counterweight:** A label is *kept* despite potential identity harm **only** if there's an overwhelming clinical necessity that outweighs the harm. DID is kept solely because access to vital care depends on it. This is a pragmatic, high-bar exception.
      *   **Nature of the Loop:** She cares *how* the loop functions.
          *   **Positive/Coping Loops:** Are acceptable or even beneficial (ADHD coping skills).
          *   **Self-Aware Loops:** Are noted but not decisive alone (ADHD self-awareness + coping = keep; algorithmic dysphoria self-awareness + coercion = likely scrap).
          *   **Absence of Loop:** Means the category isn't "interacting" significantly yet, so it's not *currently* harmful in this way (Internet Gaming Disorder).
          *   **Harmful/Coercive Loops:** Trigger scrapping due to identity damage ("high-functioning autism", predicted for algorithmic dysphoria).
      *   **Patient Identification:** Lack of identification *prevents* a harmful loop from forming (Internet Gaming Disorder), but strong identification *combined* with a harmful/coercive loop is the worst-case scenario leading to scrapping. Patient identification alone isn't sufficient to keep a label if the loop is harmful.
      *   **Clinician Discourse:** Can justify keeping a category even with weak/no looping *if* it serves a vital purpose *within the clinical system itself*, separate from immediate patient impact (Prolonged Grief Disorder). This is a lower bar than the "clinical necessity for care access" argument.

  3.  **Competing Rules that *Almost* Fit:**  
      *   **Rule A: "Scrap if patients don't identify with the label."**  
          *   *Fits:* Internet Gaming Disorder (kept because no ID).
          *   *Fails:* Prolonged Grief Disorder (kept despite weak looping/patient ID? - she kept it for clinician utility, implying patient ID wasn't the key factor). High-Functioning Autism (scrapped *despite* patient ID? - the problem was the harm *caused by* ID + performance, not lack of ID).
      *   **Rule B: "Keep only if clinically necessary for care access."**  
          *   *Fits:* DID (kept for access). ADHD (implicitly kept - coping skills aid function/access to life).
          *   *Fails:* Prolonged Grief Disorder (kept for clinician discourse, not direct patient care access). High-Functioning Autism (scrapped - care access arguably depends on the label, but harm overruled it).
      *   **Rule C: "Scrap if the label causes iatrogenic harm (harm caused by the diagnosis itself)."**  
          *   *Fits:* High-Functioning Autism (scrapped - harm from performance). Algorithmic Dysphoria (predicted scrap - harm from curation). DID arguably *causes* harm via looping but kept due to necessity.
          *   *Fails:* ADHD (kept - looping *reduces* harm via coping, so net benefit). Prolonged Grief Disorder (kept - weak/no looping, so minimal iatrogenic harm implied).

  4.  **The Smoking Gun Case to Tell Them Apart:**  
      A proposed diagnosis where:  
      *   **Patient identification is VERY STRONG.**  
      *   The looping involves **SIGNIFICANT IDENTITY HARM / COERCED PERFORMANCE** (e.g., patients feel compelled to enact specific, harmful behaviors to fit the diagnosis).  
      *   **Clinical Utility for Care Access is VERY HIGH** (e.g., the diagnosis is the *only* way to access crucial, life-saving treatment).  

      **How the Rules Predict Different Outcomes:**  
      *   **Harm to Identity Rule (Colleague's Likely Rule):** SCRAP. The identity harm/coercion is paramount and disqualifying, even with high clinical utility and strong identification. (This mirrors DID but without the "necessity outweighs harm" exception because DID was kept *despite* harm, not *because* of it. Here, the harm is the core problem).
      *   **Clinical Utility Rule:** KEEP. The overwhelming necessity for care access trumps the harm.
      *   **Patient Identification Rule:** KEEP (or Revise). Strong identification is seen as positive.
      *   **Iatrogenic Harm Rule:** SCRAP. The harm caused by the label is unacceptable.

  **Conclusion:** Your colleague prioritizes protecting patients from psychiatric labels that force them into inauthentic or harmful performances of their identity or emotions. "Algorithmic dysphoria," defined by the curation of feelings *for* the algorithm, perfectly fits this harmful, coercive loop profile. She would almost certainly scrap it. Her core rule minimizes identity harm from coerced performance, only overridden by an exceptional need for clinical care access (DID). Cases like ADHD show beneficial loops are acceptable, while cases like prolonged grief show clinician-focused utility without patient harm can suffice when loops are weak. The smoking gun case pits strong patient identification *plus* severe identity harm/coercion *against* high clinical utility for access – her likely decision to scrap would confirm identity harm as the ultimate veto.
