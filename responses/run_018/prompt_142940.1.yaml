  1. Group reflection: How did it feel? When did you feel successful? When frustrated?
  2. Map to Lakatos:
     - Hard core: Your starting beliefs. Did you feel protective of them?
     - Protective belt: The auxiliary hypotheses you added. Did they grow complex?
     - Progressive shift: When you made a successful novel prediction, it felt like progress.
     - Degenerating shift: When you kept patching (red tokens), it felt safe but eventually hurt your score.
     - The twist: That one success that came from outside the hard core. How does that fit? Lakatos might say that if the hard core has to change, it's a new programme. But in practice, the lines are blurry.
  3. The fail state: Did any group win rounds by patching but end with a low score? That's degeneration: short-term survival, long-term stagnation.

  What the game simplifies:
  - Real science takes years; this is a simulation.
  - In reality, ad hoc hypotheses can sometimes lead to progress later; here we penalize them immediately.
  - Peer pressure, funding, etc., are absent.

  First-time run issues:
  - Groups might not get the difference between ad hoc and novel. Solution: Give an example at the start.
  - Scoring errors: Have a clear score sheet and double-check.
  - The twist might be missed: Discuss it even if it didn't occur.

