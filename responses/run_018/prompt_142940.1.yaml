     - A deck of 6 Anomaly cards.
     - A deck of Outcome cards: 10 cards (5 "Success", 4 "Failure", 1 "Twist Success").

  Gameplay (6 rounds):

  Round Structure:
  1. The game master draws and reads the anomaly for the round.
  2. Each group has 5 minutes to discuss and choose:
