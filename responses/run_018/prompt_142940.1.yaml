  Title: Research Programme Simulator: A Lakatosian Adventure

  Goal: To experience the dynamics of a scientific research programme, making strategic choices between defending the core with ad hoc adjustments (degenerating) and risking bold new predictions (progressive).

  Setup:
  1. Divide into groups of 4-5. Each group is a research team.
  2. Each group gets:
     - A Hard Core card (with 3-4 fundamental beliefs).
     - 10 blank index cards (for protective belt hypotheses).
     - A score sheet (starting at 20 points) and pen.
