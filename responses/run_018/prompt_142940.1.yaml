  - Heat is a self-repulsive fluid called caloric.
  - Caloric flows from hot bodies to cold bodies.
  - The total amount of caloric in the universe is conserved.

  Anomaly Cards (6):

  Anomaly 1: When a piece of wood is burned, the resulting ash weighs less than the original wood.

  Anomaly 2: A metal (like magnesium) gains weight when burned.

  Anomaly 3: A sealed container with a burning candle goes out after some time, and the air inside weighs less than before.

  Anomaly 4: Heat is generated when you rub two sticks together in a vacuum.

  Anomaly 5: In a high-energy particle collision, new particles are created that weren't present before.

  Anomaly 6: Some materials become warmer when they absorb light, but others become cooler.

  Outcome Cards (10):
  - 5 cards: "Success! Your prediction is confirmed."
  - 4 cards: "Failure. Your prediction is not supported by the experiment."
  - 1 card: "Success! But note: your auxiliary hypothesis introduced a fundamental concept that was not part of your original hard core. This represents a potential shift in your research programme." (The twist)

  You now have a complete game. Have fun!
answer: |-
  Below is a complete, playable tabletop simulation designed for your workshop. It uses index cards, coins, and minimal materials to create an experiential understanding of Lakatos's concepts. The game emphasizes the tension between **progressive problem shifts** (risky novel predictions that advance knowledge) and **degenerating problem shifts** (safe but stagnant ad hoc patches). The hidden "reverse Lakatos" twist forces a confrontation with how protective belts can retroactively redefine hard cores.

  ---

  ### **Game Title: Core Crisis: A Lakatosian Lab**
  **Objective**: Groups defend a "hard core" of beliefs against anomalies by either making **novel predictions** (progressive) or **ad hoc patches** (degenerating). Scoring rewards short-term survival but penalizes long-term stagnation, pushing groups to feel the shift from progressive to degenerating research.

  #### **Materials List** (for 15 players, 3 groups of 5):
  - **Index Cards**:
    - **Hard Core Cards (3 total, 1 per group)**: Pre-written with core beliefs (examples below).
    - **Anomaly Cards (9 total)**: 3 sets of 3 anomalies per game round (examples below).
    - **Outcome Cards (15 total)**: 10 "Success/Failure" cards (5 success, 5 failure), 5 hidden "Twist" cards (1 success, 4 failure).
    - **Blank Cards**: 30+ for groups to write protective belt hypotheses.
  - **Tokens**: 
    - **Prediction Tokens** (e.g., coins): 15 total (5 per group). Each represents a "risk stake" for novel predictions.
    - **Red Degeneration Tokens** (e.g., red paper clips): 15 total (track ad hoc patches).
  - **Scoreboard**: Poster paper to track points.
  - **Timer**: For 8-minute rounds.
  - **Envelopes**: To hide Outcome Cards until testing.

  ---

  ### **Setup**
  1. **Divide Players**: Split into 3 groups. Each group gets:
     - 1 **Hard Core Card** (immutable beliefs).
     - 5 **Prediction Tokens** (for risky bets).
     - 5 **Red Degeneration Tokens** (track ad hoc patches).
     - 10 blank cards (for protective belt hypotheses).
     - Starting score: **10 points**.

  2. **Game Master Prep**:
     - Shuffle **Anomaly Cards** into 3 stacks (3 anomalies per round, 3 rounds total).
     - Shuffle **Outcome Cards** into sealed envelopes (1 envelope per anomaly, labeled with the anomaly number). Include 1 "Twist" card in Round 2 (see Twist section).

  ---

  ### **Rules**  
  **Gameplay**: 3 rounds (25 min each), 8 min per anomaly. Total: 75 min + 15 min debrief.  
  Each round, groups face 1 anomaly. They must choose **ONE** response:

  1. **Ad Hoc Patch (Degenerating Shift)**  
     - **Action**: Invent an auxiliary hypothesis (e.g., "Instrument error" or "Special case exemption") on a blank card. Add it to their protective belt.  
     - **Cost**: Discard 1 Prediction Token (if none left, skip).  
     - **Reward**: **+2 points** immediately.  
     - **Penalty**: Take 1 **Red Degeneration Token**. (Each token = **-1 point** at game end.)  
     - *Why?* Feels smart (quick points), but drains resources and penalizes later.

  2. **Novel Prediction (Progressive Shift)**  
     - **Action**: Propose a testable prediction based on a new protective belt hypothesis (e.g., "If X is true, then Y will happen under Z conditions").  
     - **Cost**: Stake 1 Prediction Token to "test" the prediction.  
     - **Test**: Game master reveals the pre-sealed **Outcome Card** for that anomaly.  
       - **Success**: **+4 points**.  
       - **Failure**: **-2 points**.  
       - **Twist Success (Round 2 only)**: **+4 points** + hidden twist (see below).  
     - *Why?* High risk/reward. Failure hurts, but success advances knowledge.

  ---

  ### **Hidden "Reverse Lakatos" Twist**  
  - **When**: Round 2, Anomaly 2 (pre-seal the twist in this envelope).  
  - **What**: The outcome is **successful**, but the prediction **retrofits a concept never in the original hard core**.  
    - Example: A group’s hard core states, "All energy is conserved," but their novel prediction relies on "Energy can convert to mass" (Einstein-esque).  
  - **Delivery**: When revealed, announce:  
    *"Your prediction succeeded! But peer reviewers note your hypothesis relies on \[specific concept\], which conflicts with your hard core's \[original principle\]. You’ve retrofitted the core."*  
  - **Goal**: Groups feel confused success—win points but violate Lakatos’s rule that hard cores are "irrefutable." Sets up debrief tension.

  ---

  ### **Scoring & Winning**  
  - **Short-Term**: Points added each round (ad hoc: +2, novel: +4/-2).  
  - **Long-Term**: At game end, subtract **-1 point per Red Degeneration Token**.  
  - **Final Score** = Total points - Degeneration tokens.  
  - **Fail State**: A group can "win" a round by spamming ad hoc patches (e.g., +6 points in Round 1) but have 0 Prediction Tokens and 3 Red Tokens by Round 3. They survive the round but lose long-term (-3 points).  

  **Example Scoring Flow**:  
  | Group | Round 1 (Ad hoc) | Round 2 (Novel, success) | Round 3 (Ad hoc) | Red Tokens | Final Score |  
  |-------|------------------|--------------------------|------------------|------------|-------------|  
  | A     | +2 (ad hoc)      | +4 (novel)               | +2 (ad hoc)      | 2          | 8 - 2 = 6   |  
  | B     | -2 (novel fail)  | +4 (novel twist success) | +2 (ad hoc)      | 1          | 4 - 1 = 3   |  
  | C     | +2 (ad hoc)      | +2 (ad hoc)              | +2 (ad hoc)      | 3          | 6 - 3 = 3   |  
  *Group A wins with progressive shifts. Group C degenerates (high points early, but net loss).*

  ---

  ### **Example Game Content**  
  **Hard Core Cards** (Each group gets one):  
  - **Group 1 (Atomists)**:  
    - Atoms are indivisible.  
    - Elements have unique, immutable atoms.  
    - Chemical reactions rearrange atoms.  
  - **Group 2 (Phlogistonists)**:  
    - Fire releases "phlogiston."  
    - Air absorbs phlogiston.  
    - Metals contain phlogiston.  
  - **Group 3 (Etherists)**:  
    - Light travels via "luminiferous ether."  
    - Ether permeates all space.  
    - Ether is motionless.  

  **Anomaly Cards** (3 sets, 1 per round):  
  - **Round 1 (Simple)**:  
    *"Metal gains weight when burned (vs. phlogiston theory)."*  
  - **Round 2 (Twist Anomaly)**:  
    *"Light speed is constant in all directions (vs. ether theory)."*  
  - **Round 3 (Complex)**:  
    *"Radioactive decay emits particles (vs. atom indivisibility)."*  

  **Outcome Cards** (For novel predictions):  
  - **Success**: *"Your experiment confirms the prediction! Theory extended."*  
  - **Failure**: *"Results contradict your prediction. Back to the drawing board."*  
  - **Twist**: *"Success! But your hypothesis assumes \[new concept\], which wasn’t in your hard core."*  

  ---

  ### **Debrief Framework** (15 min)  
  **Goal**: Link game moments to Lakatos without lecturing. Use Socratic questioning.  

  1. **Group Reflections** (5 min):  
     - "When did your research feel progressive? Degenerating?"  
     - "Did defending your core ever backfire? When?"  

  2. **Map Game to Lakatos** (7 min):  
     - **Hard Core**: "Your starting beliefs were non-negotiable. How did that feel when anomalies hit?"  
     - **Protective Belt**: "Those blank cards you wrote? That’s the belt. Did it grow messy?"  
     - **Progressive Shift**: "When you risked a novel prediction and succeeded, you extended the programme’s reach (e.g., +4 points). Lakatos calls this ‘progressive’—it predicts *new* facts."  
     - **Degenerating Shift**: "When you patched with ad hoc fixes (e.g., ‘instrument error’), you got quick points but red tokens. Lakatos says this ‘degenerates’—no new insights, just defensive tweaks."  
     - **The Twist**: "That confusing success in Round 2? You retrofitted the hard core. Lakatos would say this blurs the core/belt boundary—a crisis moment. Real example: Newtonian physics ‘patched’ with dark matter to explain galaxy motions."  

  3. **Fail State Spotlight** (3 min):  
     - "Did any group ‘win’ a round with ad hoc patches but have no tokens left? That’s degeneration: you ‘succeeded’ but couldn’t predict anything new. In science, this wins grants but loses revolutions."  

  ---

  ### **What This Game Can’t Capture (Be Frank!)**  
  - **Timescales**: Degeneration takes decades in real science; here it’s 75 minutes.  
  - **Peer Pressure**: No grant deadlines or rival labs pushing conformity.  
  - **Complexity**: Real protective belts involve math/models; we use index cards.  
  - **Subjectivity**: Lakatos’s "progress" is debated; the game treats it as binary (success/failure).  

  ---

  ### **What Will Go Wrong (and How to Recover)**  
  1. **Problem**: Groups avoid novel predictions (too risky).  
     - **Recovery**: After Round 1, remind them: "Safe patches won’t win long-term." Tweak Round 2 anomalies to be harder to patch.  

  2. **Problem**: The twist doesn’t land (e.g., group ignores it).  
     - **Recovery**: In debrief, role-play it: "Group 2, your ether hypothesis implied motionless ether, but your prediction required moving ether. How’d that feel?"  

  3. **Problem**: Scoring chaos.  
     - **Recovery**: Assign a "scorekeeper" per group. Use tokens for visual tracking.  

  4. **Problem**: Ad hoc patches get too creative.  
     - **Recovery**: Allow it! Degeneration is the point. Ask in debrief: "Did overfitting your belt feel like smart science... until it didn’t?"  

  ---

  **Final Tip**: Run the game with friends first. It’s playtest-ready—index cards and coins are all you need. The key is making the degenerative "victory" feel hollow and the twist disorienting. By the debrief, they’ll grasp Lakatos viscerally. Good luck!
