        - Write an auxiliary hypothesis on a blank card to explain the anomaly without making a testable prediction.
        - Gain 1 point.
        - Take a red token (or mark one on the score sheet).
     Option B: Novel prediction
        - Write an auxiliary hypothesis and then a specific testable prediction.
        - Pay 1 point (to simulate the cost of running the experiment).
        - The game master shuffles the outcome deck and draws one card:
