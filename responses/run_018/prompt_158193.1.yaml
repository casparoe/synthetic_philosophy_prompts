prompt: |-
  I have recently become convinced that my own view on spacetime substantivalism hinges on getting Einstein's hole argument exactly right, and I now need to guide a study partner—a mathematician fluent in manifolds but with no philosophy background—through the idea without losing them in either the formalism or the metaphysics. Do not explain the argument itself; instead, lay out the teaching plan as exactly five numbered points, each one or two sentences, with no introduction or conclusion: (1) the dependency order in which the conceptual pieces must be introduced and why the distinction between the metric field and the bare manifold must precede the hole construction, (2) the single carrying example or visual analogy that should bear the full weight and what feature it must deliberately lack to avoid a standard confusion about coordinate artifacts, (3) the misconception about point-identity that predictably arises at the precise stage where diffeomorphism invariance is introduced and exactly how to intercept it, (4) the check-for-understanding question that reveals whether they have grasped the philosophical punch about determinism rather than merely following the formal transformation, and (5) the one technical detail or historical aside that should be omitted at this level and why including it would derail the conceptual arc.
reasoning: |-
