answer: |-
  Here is the teaching plan in five numbered points as requested:

  1.  **Foundational Distinction First:** Begin by rigorously separating the smooth manifold (as the underlying set of point-events with topology/differential structure) from the metric tensor field (specifying spacetime geometry). This is essential because the hole argument manipulates the metric *relative* to this fixed bare manifold, highlighting the ontological independence being questioned.
  2.  **Core Analogy:** Use a detailed topographic map where the paper represents the manifold (points/locations) and the ink contours represent the metric field (distances/geometry). Crucially, this analogy *lacks any coordinate grid* to prevent mistaking gauge-dependent labels for intrinsic manifold structure.
  3.  **Intercepting Point-Identity Misconception:** When introducing the active diffeomorphism (shifting the metric field over the manifold), immediately emphasize that the manifold points *themselves* are not intrinsically labeled; their identity is *only* relational, defined by the fields living on them. The predictable confusion is thinking points have pre-existing identities independent of the metric field.
  4.  **Check for Philosophical Grasp:** Ask: "Given identical initial data on a spacelike slice *outside* the hole, do the field equations uniquely determine the geometry *inside* the hole?" A correct "No" reveals understanding of the threat to determinism if manifold points are substantival; a "Yes" indicates only formal comprehension of the transformation.
  5.  **Omission:** Avoid discussing the distinction between active and passive diffeomorphisms. At this stage, it introduces tangential complexity about coordinate representations that obscures the core ontological issue of point identity and determinism raised by the active transformation.
