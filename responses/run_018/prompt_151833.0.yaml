answer: |-
  Here’s a structured analysis of Bradley’s regress, its threat to propositional unity, and its resilience against modern responses, with scholarly disagreements clearly marked:

  ### **Bradley’s Regress: The Core Argument**
  1. **Initial Setup** (Bradley, *Appearance and Reality*, Ch. II–III):  
     - Consider a subject-predicate proposition: "A is Q" (e.g., "The apple is red").  
     - If a relation (R) is required to connect quality (Q) to substance (A), this implies R is distinct from both A and Q.  
     - But then: what connects R to A and to Q? If a *further* relation (R₁) is needed to bind R to A, and another (R₂) to bind R to Q, an infinite regress begins:  
       ```
       A --R-- Q  
       ↑     ↑  
       R₁   R₂  
       ↑     ↑  
       R₃   R₄  
       ...  
       ```
     - **Bradley’s Conclusion**: Relations cannot genuinely unify terms; they are "unintelligible" abstractions. Only the undifferentiated Absolute achieves true unity.

  ### **Where Propositional Unity is Threatened**
  - **The Crucial Turn**: The regress doesn’t just question relationality—it attacks the *unity of the proposition itself*.  
    - A proposition (e.g., "A is Q") must be a *single* truth-bearing whole.  
    - Bradley argues that if R is distinct from A and Q, the initial complex (A-R-Q) is not intrinsically unified. Each new relation (R₁, R₂, ...) adds more *external* elements, never creating an internal unity.  
    - **Result**: The proposition fragments into an infinite heap of relations and terms, with no "one thought" emerging. Truth collapses because the proposition lacks a coherent subject-predicate bond (Bradley’s "floating idea" critique).

  ### **Modern Responses: Do They Dissolve the Regress?**
  1. **Primitive Predication** (e.g., Frege, early Wittgenstein):  
     - Treat predication as unanalyzable: "A is Q" is fundamental. No "glue" (relation R) is posited.  
     - **Bradleyan Challenge**: Why is this not arbitrary? If predication is primitive, its *unity* remains unexplained—it simply asserts "A and Q are combined" without clarifying *how*. Bradley would argue this masks the problem rather than solving it.  
     - **Scholarly Divide**: Some (e.g., Peter Hylton) see this as dissolving the regress; others (e.g., Stewart Candlish) argue Bradley exposes a deeper need for metaphysical grounding of unity.

  2. **Trope Theory** (e.g., D.C. Williams, Keith Campbell):  
     - Qualities are particularized (e.g., "this-redness" inherent in the apple). No universal "redness" needing relation to a subject.  
     - **Bradleyan Challenge**: Tropes still require "compresence" (co-location) with the substance. If compresence is a *relation*, the regress restarts. If it’s primitive, the unity problem persists: why does "this-redness" belong to *this* apple? Tropes may reduce but not eliminate the need for a principle of unity.  
     - **Contested Efficacy**: Trope theorists (e.g., Anna-Sofia Maurin) claim this avoids Bradley; critics (e.g., Fraser MacBride) argue compresence reintroduces relationality.

  3. **States of Affairs** (e.g., Armstrong, Plantinga):  
     - Propositions reflect mind-independent complexes (e.g., [A-being-Q]). Unity is built into the structure.  
     - **Bradleyan Challenge**: What constitutes the difference between [A-being-Q] and a mere list (A, Q)? If no internal principle, unity is brute—which Bradley deemed "a mere device" (*AR*, Ch. III). If a unifier is added (e.g., a non-relational tie), its own status invites regress.

  ### **Scholarly Disagreements: Key Fault Lines**
  | **Issue**                     | **Contending Views**                                                                                               |
  |-------------------------------|--------------------------------------------------------------------------------------------------------------------|
  | **Primary Target of Regress** | - *Logic/Relationality*: Regress undermines relational models (Russell, Meinong) [Gaskin 2008].<br>- *Ontology*: Attacks all pluralist metaphysics [Allard 2005].<br>- *Propositions*: Specifically targets unity of judgment [Candlish 2007]. |
  | **Unity in Modern Responses** | - *Dissolved*: Primitive predication/tropes avoid relations, regress vanishes [Dummett 1981].<br>- *Persists*: Unity demands explanation; alternatives are circular or brute [Stern 2023]. |
  | **Bradley’s Own Solution**    | - *Coherent*: Absolute resolves contradictions inherent in relations [Mander 1994].<br>- *Questionable*: Monism is a *non sequitur*; regress may not mandate idealism [Sprigge 1993]. |

  ### **Settled vs. Contested Interpretations**
  - **Settled**:  
    - Bradley’s regress *does* target propositional unity explicitly (*AR*, Ch. II: "the problem of how the relation stands to its terms ... infects the whole").  
    - The regress arises iff relations are *distinct existences* connecting terms.  
    - Bradley’s conclusion is that *all* relational thought is appearance, not ultimate reality.  

  - **Genuinely Contested**:  
    1. Whether the regress is fatal to *all* pluralist ontologies or only to specific (e.g., relational) models.  
    2. Whether modern "non-relational" accounts (tropes, primitivism) genuinely escape or merely obscure the demand for unity.  
    3. Whether Bradley’s solution (the Absolute) is necessitated by the regress or is an independent metaphysical commitment.  

  ### **Conclusion**
  Bradley’s regress threatens propositional unity by showing that relations cannot self-sufficiently bind terms into a whole without infinite deferral. Modern non-relational approaches (primitivism, tropes) claim to dissolve the regress by rejecting relations, but critics argue they either presuppose unity without explanation or reintroduce relationality covertly. **The deepest scholarly divide** centers on whether *any* account of complexity can satisfy Bradley’s demand for an unreified unity—or if his challenge reveals an inescapable aporia in pluralist metaphysics. Bradley’s challenge survives not as a technical flaw in relational logic, but as a metaphysical critique of how distinct entities cohere into unities. Whether this critique is decisive remains hotly debated.
