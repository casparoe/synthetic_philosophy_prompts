answer: |-
  Here are eight questions tailored to dig into the weeds of her position, including your specific requests and follow-ups designed to cut through her deflections. I’ve kept the tone conversational and slightly rough-around-the-edges:

  1. **Core Difference from Churchland**  
     *"You argue predictive processing (PP) eliminates beliefs/desires *structurally*, not just because folk psych is empirically inadequate like Churchland did. But isn't the real beef still about empirical inadequacy—just now *PP’s success* is what shows folk psych’s failure? How’s that not just Churchland 2.0?"*  
     **Likely deflection/reply:** *"Churchland attacks folk psych’s *explanatory failures*; PP shows its *ontological redundancy*. The machinery doesn’t *fail*—it *disappears*."*  
     **Follow-up:** *"But if PP explains *all* cognition without propositional attitudes, isn’t that *still* an empirical argument? Aren’t you just swapping ‘failed theory’ for ‘no vacancy in the ontology’ based on newer data?"*  

  2. **Generative Models as Beliefs?**  
     *"PP treats the brain’s generative models as multi-level predictions shaping perception. Why *aren’t* these hierarchical predictions just beliefs in disguise? If my model predicts ‘tiger in grass’ and I act accordingly, how’s that not a belief?"*  
     **Likely deflection:** *"Beliefs are *propositional commitments*. Generative models are statistical density estimators—they don’t ‘assert’ anything; they minimize prediction error."*  
     **Follow-up:** *"But when those models get entrenched and guide action across contexts—say, avoiding tall grass after a ‘tiger’ prediction—isn’t that *functional* belief? Or are you saying only syntax-less Bayesian updates can exist?"*  

  3. **Falsification Condition**  
     *"What neuroscience finding would *force* you to admit beliefs/desires exist? If PP can’t explain some cognitive loop, could you just tweak it? Or is there a smoking gun?"*  
     **Likely deflection:** *"If brains *weren’t* minimizing free energy, or if we found non-predictive, *intrinsically* propositional states. But PP is a framework, not a single model."*  
     **Follow-up:** *"Isn’t that unfalsifiable? If I show prefrontal activity that looks like ‘accepting a premise,’ you’d say it’s just precision-weighting. What *specific* neural signature *couldn’t* PP explain?"*  

  4. **First-Person Authority**  
     *"If there’s no ‘I believe P,’ why does introspection *feel* like direct access? When I ‘decide’ to grab coffee, it doesn’t *feel* like a prediction error update—it feels like a desire causing action. Isn’t that phenomenology stubborn?"*  
     **Likely deflection:** *"Introspection is *itself* a generative model—a prediction about your cognitive state. Feeling ‘direct’ is just high precision-weighting on that self-model."*  
     **Follow-up:** *"But why would evolution bake in *that* specific illusion? If belief-talk is *so* off-base, why doesn’t introspection *feel* like statistical inference?"*  

  5. **Scientific Reasoning Trap**  
     *"Scientists cling to theories despite counter-evidence (e.g., dark matter vs. MOND). If there are no beliefs, how does PP explain this ‘commitment’? Is it just high precision on a crappy generative model?"*  
     **Likely deflection:** *"Precision-weighting can get pathologically sticky. No ‘commitment’ needed—just maladaptive error minimization."*  
     **Follow-up:** *"But doesn’t *deliberate* argumentation—e.g., weighing evidence *for* dark matter—require *tokenizing propositions*? Or is all scientific debate just mutual prediction-error reduction?"*  

  6. **Normativity/Truth**  
     *"Beliefs aim at truth; desires aim at goodness. PP only has prediction accuracy. Where’s the *normative* oomph? If my model ‘predicts’ genocide is optimal, is it just *inaccurate*, not *evil*?"*  
     **Likely deflection:** *"Norms are emergent from homeostatic/allostatic goals—minimizing errors tied to survival. ‘Truth’ is long-term prediction success."*  
     **Follow-up:** *"But survival isn’t *normative*—it’s biological. Without propositions, how do you explain *arguing* that genocide is wrong, not just biologically risky?"*  

  7. **Content without Concepts?**  
     *"PP posits ‘content’ via prediction hierarchies, but if it’s all signals and errors, where does *aboutness* come from? How does a prediction error *mean* ‘tiger’ without something like a concept?"*  
     **Likely deflection:** *"‘Aboutness’ is causal covariance shaped by evolution. No concepts—just sparse coding across hierarchical layers."*  
     **Follow-up:** *"But covariance isn’t intentionality! If my visual cortex fires ‘tiger-pattern,’ how’s that *not* a proto-belief with content?"*  

  8. **Language & Propositions**  
     *"We *use* propositions constantly—like right now. If PP eliminates them, is language just acoustic pattern-matching? How do you parse *this sentence* without attributing beliefs to me?"*  
     **Likely deflection:** *"Language processing is active inference: predicting auditory inputs and updating generative models. No ‘propositional attitudes’ required."*  
     **Follow-up:** *"But when you disagree with my *claim*, aren’t you implicitly granting it *content*? Or is disagreement just ‘competitive prediction weighting’?"*  

  **Bonus Quickfire**:  
  *"If I shout ‘I BELIEVE ELIMINATIVISM IS FALSE!’—is that utterance just a noisy prediction error in *your* auditory model, or are you forced to *treat me* as having a belief?"*  

  These should force her to defend the *mechanistic* teeth of PP while avoiding folk-psych off-ramps. Good luck—sounds like a fun tussle! Let me know how it goes.
