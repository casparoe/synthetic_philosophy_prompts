answer: |-
  Here's a breakdown based on current philosophical debate, aiming to separate settled points from genuine controversy:

  1.  **Probability that standard deontic logic is inadequate & conflict-tolerant frameworks are needed: ~65%**
      *   **Reasoning:** Standard deontic logic (SDL) assumes obligations cannot genuinely conflict (`O~A` and `O~B` imply `O~(A & B)`, and conflicts like `OA & O~A` are explosive). This clashes profoundly with lived moral experience (like yours) and many ethical theories (e.g., Rossian pluralism). The inability of SDL to model "unresolved remainders" or "incompletely discharged duties" is a major weakness. Formal systems allowing for conflicting obligations without explosion (e.g., some paraconsistent logics, non-monotonic logics, or specific deontic logics with "CTD" operators) are actively developed precisely because SDL seems inadequate *for capturing the phenomenology of dilemmas*. This view isn't *universal* (some still defend SDL or try to reduce dilemmas to epistemic limitations), but the pressure towards revision is strong and growing.
      *   **Settled/Contested:** It's **contested** but leaning towards inadequacy. The *need* for revision is widely acknowledged; the *best form* of revision is hotly debated.

  2.  **Probability that moral residue tracks a real unfulfilled obligation: ~55%**
      *   **Reasoning:** This is highly contested. Proponents (e.g., Williams, Nagel, some care ethicists) argue that persistent, focused guilt/regret ("agent-regret") in well-considered cases *is* evidence the obligation wasn't merely overridden but genuinely unfulfilled and still binding, leaving a "moral remainder." Critics argue residue is better explained by psychological mechanisms: loss aversion (the unchosen bad outcome still pains us), threats to self-image as a "good person," societal expectations, or simply the intensity of the conflict. Crucially, *even if* residue is primarily psychological, it might still have moral *significance* (e.g., motivating reparative action or humility) without proving an *ontological* unfulfilled duty. Your description of "real obligation left hanging" captures the pro view, but the psychological counter-explanation is robust.
      *   **Settled/Contested:** **Highly contested.** No consensus exists. The debate hinges on fundamental questions about the nature of obligations, reasons, and emotions.

  3.  **Probability that every apparent dilemma dissolves under precise specification: ~20%**
      *   **Reasoning:** Specificationists (e.g., some Kantians, utilitarians, rule-consequentialists) argue that apparent conflicts arise from vague or mid-level rules/principles. Properly specifying the obligations (e.g., incorporating all relevant context, exceptions, priority rules) *always* yields a single determinate obligation. Critics counter that specification often seems arbitrary, ad-hoc, or fails to capture the genuine normative "pull" of both options. Deep pluralism (e.g., Ross) holds that fundamental duties (fidelity, non-maleficence, etc.) are irreducibly plural and can *genuinely* conflict in ways specification cannot dissolve without distorting the nature of the duties. Your experience of feeling *both* obligations as binding *after* the choice suggests specification didn't fully resolve it for you.
      *   **Settled/Contested:** **Contested, but specificationism faces significant skepticism.** While many agree *some* apparent dilemmas dissolve, the claim that *all* do is widely doubted, especially by pluralists and those focused on particularist contexts.

  **Combined Probability (Genuine Strong Dilemmas Possible):** (~0.65) * (~0.55) * (1 - ~0.80) = ~0.65 * ~0.55 * ~0.20 = **~7.15%**

  *   **Interpretation:** This low combined probability reflects the *multiplicative* challenge – all three contentious propositions need to hold together. It highlights how difficult it is to *establish* the strong view definitively against alternative explanations. However, this **doesn't mean the probability of genuine dilemmas is near zero**; it means the probability that *all the specific components needed for the strongest philosophical argument* hold simultaneously is low. The probability that genuine dilemmas exist *simpliciter* is higher (reflected in the individual probabilities for 1 & 2), but establishing the specific "unfulfilled duty residue" aspect is the toughest hurdle.

  **Least Certain Term:** **Term 2 (Moral residue tracks a real unfulfilled obligation).** (~55% reflects near-maximum uncertainty). Distinguishing rational, obligation-tracking residue from sophisticated psychological responses (loss aversion + identity threat + social cognition) is extremely difficult, both conceptually and empirically.

  **Evidence Most Likely to Shift Probability on Term 2:**
  1.  **Moral Psychology (Specific):** Rigorous studies showing that "moral residue" in dilemma cases has distinct phenomenological, neurological, or behavioral signatures *compared* to regret over mere tough choices with overriding reasons or regret over non-moral losses. For instance:
      *   Does residue correlate with specific, obligation-focused thoughts ("I *owed* X") rather than outcome-focused distress ("I wish Y hadn't happened") or self-focused distress ("I feel like a bad person")?
      *   Are there neural markers distinct from general loss-aversion or social anxiety patterns?
      *   Does residue predict unique *moral* behaviors (e.g., specific reparative acts directed at the "wronged" party/principle, distinct from general altruism or guilt-reduction)?
  2.  **Conceptual/Philosophical:** Development of a compelling, non-ad-hoc formal or conceptual framework that integrates unresolved obligations and residue *within* a coherent moral ontology, demonstrating its explanatory power over psychological accounts without being reducible to them. Showing that the "unfulfilled duty" view makes better sense of patterns of justified criticism or praise *after* a dilemma (e.g., why we might still owe something specific to the "wronged" party even after a justified choice).

  **Settled vs. Contested Recap:**
  *   **Settled:** Moral conflicts *exist* phenomenologically. SDL struggles to model them adequately. Residue *occurs*. Psychological explanations (loss aversion, etc.) play *some* role.
  *   **Contested:** Whether SDL's failure necessitates *conflict-tolerant* logics (vs. other fixes). Whether residue *primarily* tracks an unfulfilled ontological duty or is a psychological phenomenon (even if morally significant). Whether specification *always* dissolves dilemmas. The very *existence* of strong dilemmas remains **deeply contested** among experts. Pluralists generally accept them; monists (Kantians, Utilitarians) generally deny them or reinterpret them; others occupy nuanced middle positions. There is **no consensus** on the strong view you describe. Your experience of inescapable wrongness is shared by many, but its ultimate philosophical interpretation is unresolved.
