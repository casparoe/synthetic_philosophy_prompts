  Okay, the user is advising a three-year research programme focused on reconstructing institutional beliefs and social structures from material remains without any textual evidence. They've highlighted three open problems: weighing negative evidence (absence of expected objects), distinguishing collective intentionality from individual practices in burials, and avoiding circular reasoning in settlement layout analysis for cosmological inferences. The user specifically wants to treat the asymmetry between presence and absence as a live issue, questioning whether resolving it is upstream of the others or secondary to solving the collective intentionality problem.

  I need to determine which two problems should take priority and in what order. The user has asked for explicit criteria: tractability in non-textual contexts, dependence relations between questions, and risk of false institutional attribution. They also want to know what empirical or conceptual result could reorder these priorities in the next few years.

  First, let's break down each problem. The negative evidence issue involves interpreting absences—whether they're meaningful (like taboos) or accidental (like taphonomic loss). This is fundamental because misinterpreting absence could lead to incorrect conclusions about social structures. The collective intentionality problem deals with whether burial patterns reflect coordinated group norms or just accumulated individual choices. If we can't distinguish these, we might wrongly attribute institutional practices to random behaviors. The settlement layout problem concerns inferring cosmological beliefs from spatial arrangements without circular reasoning, which is tricky because it's easy to impose modern biases onto ancient layouts.

  The user's deeper need seems to be establishing a robust methodological foundation. Without texts, the risk of false attributions is high, so they need approaches that minimize that risk. They might also be concerned about resource allocation in a three-year programme, so prioritization should maximize progress within constraints.

  Considering tractability: Negative evidence might be more approachable with statistical methods and comparative datasets. Collective intentionality requires complex behavioral models but could build on existing frameworks like costly signaling theory. Settlement cosmology is highly inferential and prone to circularity, making it less tractable in the short term.

  Dependence relations: Resolving negative evidence is crucial because it affects data reliability across all areas. If absences are misinterpreted, any analysis of burials or settlements could be flawed. Collective intentionality might depend somewhat on understanding absences—for example, missing grave goods could indicate individual choice versus group norms. Settlement cosmology likely depends on both, as layout interpretations need reliable data and clear intentionality distinctions.

  Risk of false attribution: Misreading absences could lead to false claims about taboos or institutions. Mistaking individual practices for collective ones could misattribute non-existent institutions. Circular reasoning in settlements might create unfounded cosmological narratives, but the immediate risk might be lower if the other issues are addressed first.

  So, prioritising negative evidence first makes sense—it's foundational. Then collective intentionality, as it builds on reliable data and addresses social structures directly. Settlement cosmology might be deprioritised initially, as it relies on solutions from the first two. Empirical results like detecting patterned absences across sites could validate methods for negative evidence, while identifying costly burial practices could clarify intentionality. If such findings emerge, they might allow tackling settlement cosmology sooner.
answer: |-
  Based on the stated criteria—tractability in non-textual contexts, dependence relations, and risk of false institutional attribution—I recommend prioritising the problems as follows:

  **Priority 1: Distinguishing Collective Intentionality from Aggregated Individual Practice in Burial Patterns**
  *   **Tractability:** Burial contexts offer rich, structured data. Patterns can be analysed statistically (e.g., grave good distributions, spatial clustering, labour investment markers) using comparative datasets across sites/periods. Agent-based modelling can simulate aggregated individual choices vs. enforced norms. Non-textual proxies like "costly signalling" (rare/imported goods) or standardised positioning are testable.
  *   **Dependence:** Resolving intentionality is *foundational*. Misattributing aggregated individual behaviour to institutional norms (or vice versa) fundamentally distorts reconstructions of belief systems and social structures. It directly impacts how we interpret patterns relevant to *both* negative evidence (e.g., was an object's absence an individual choice or a group prohibition?) and settlement cosmology (e.g., was layout adherence intentional or emergent?).
  *   **Risk of False Attribution:** Extremely high. Mistaking random variation or individual preferences for collective, institutionally-backed ritual leads directly to false positives (inventing non-existent institutions/beliefs). Conversely, missing genuine collective intentionality leads to false negatives (failing to identify real institutions).

  **Priority 2: Weighing Negative Evidence (Presence/Absence Asymmetry)**
  *   **Tractability:** More challenging than intentionality but tractable. Requires rigorous quantification of "expected" presence (using large comparative databases), sophisticated taphonomic assessment (formation processes), and contextual analysis. Statistical methods (e.g., Bayesian approaches incorporating taphonomic priors) and experimental archaeology (replicating deposition/loss scenarios) offer pathways.
  *   **Dependence:** While conceptually fundamental (data validity), robust interpretation *depends significantly* on understanding intentionality. Knowing *if* an absence could reflect a deliberate act (taboo, rejection) relies on prior models of collective behaviour (Priority 1). However, it underpins the reliability of *all* material datasets, including settlement patterns. It must be addressed early to prevent systemic error propagation.
  *   **Risk of False Attribution:** Very High. Misinterpreting absence (e.g., attributing loss to taboo, or vice versa) directly creates false narratives about beliefs (taboos, crises, heterodoxy) or social structures (trade networks, institutional collapse). It risks building entire theories on erroneous foundations of "missing" phenomena.

  **Rationale for Order & Deprioritising Settlement Cosmology:**
  1.  **Foundational Dependencies:** Collective Intentionality (Priority 1) is the bedrock. Without knowing if patterns reflect institutional norms or individual actions, interpreting *any* material signal—including absences (Priority 2) and settlement layouts—is perilously ambiguous. Negative Evidence (Priority 2) is the next critical filter for data validity itself. Settlement Cosmology (deprioritised) relies *heavily* on robust solutions to the first two. Inferring belief from layout without knowing if the layout reflects collective intentional norms *and* without confidence in interpreting the presence/absence of key features invites circularity and high false attribution risk. Its complexity and inferential distance make it less tractable for initial breakthroughs within 3 years.
  2.  **Tractability Sequence:** Burial intentionality offers the most concrete, data-rich starting point. Progress here provides methodologies and conceptual frameworks applicable to Negative Evidence. Tackling Negative Evidence second leverages this grounding to refine core data interpretation. Settlement cosmology requires these more fundamental issues resolved first to constrain its inherently higher-risk inferences.
  3.  **Risk Mitigation:** This order directly tackles the two problems posing the most immediate and catastrophic risks of constructing entirely false institutional narratives from flawed interpretations of agency (Intentionality) and data completeness (Negative Evidence).

  **What Could Reorder These Priorities?**
  *   **Empirical Result:** A breakthrough in settlement pattern analysis demonstrating **replicable, non-circular correlations between specific, quantifiable spatial configurations (e.g., orientation clusters, access hierarchies, structured refuse zones) and independently verifiable non-textual proxies for cosmology** (e.g., consistent astronomical alignments linked to ritual structures, patterned deposition of symbolically charged materials in specific areas across multiple sites). This would make settlement cosmology suddenly more tractable and less dependent.
  *   **Conceptual Result:** The development of a **rigorous, widely applicable quantitative framework for distinguishing individual vs. collective agency in material assemblages *across multiple contexts*** (not just burials) that yields strong, testable predictions. Success here might shift focus sooner to Negative Evidence or Settlement, as the core agency problem is demonstrably cracked.
  *   **Result Affecting Negative Evidence:** A **consistently successful method for quantifying taphonomic loss probabilities for specific object types in specific depositional environments, validated experimentally and archaeologically across diverse sites.** This would significantly reduce the ambiguity of absence, potentially elevating its priority or enabling faster progress on Settlement Cosmology by providing more reliable data on feature presence/absence.

  In essence, the programme should first crack the code of "who meant what" (Collective Intentionality) to anchor interpretations, then rigorously police "what's *really* missing" (Negative Evidence) to ensure data integrity. Progress on these will inherently advance and constrain the inherently more speculative Settlement Cosmology analysis, positioning it for more reliable study later in the programme or beyond.
