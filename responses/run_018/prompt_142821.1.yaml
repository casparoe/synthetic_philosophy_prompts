answer: |-
  Here's the argument, typos and all:

  Brainstorming real quick: Protestant work ethic originally tied labor to divine calling - work hard *for God's glory*, but accumulation had theological limits ("you can't serve God and Mammon"). Salvation anxiety kept overwork in check; excess was sin, not virtue. Secularization strips those brakes. Work-as-vocation becomes work-as-value-extraction, period. Clock-time isn't moralized by eternity anymore - just by ROI. Karoshi isn't an accident; it's the pure calculus of human capital pushed to depreciation. Leisure? Not "free time" - just asset maintenance delaying future exploitation. Movements demanding fewer hours fight the symptom while accepting the disease: that *any* chunk of clock-time belongs inherently to capital until "leased back" as leisure.  

  **The Core Argument:**  
  Karoshi looks like a tragic glitch in teh system, but it's actually the Protestant work ethic achieving its final, secular form. When "calling" loses its theological container (no soul to save, no God to glorify), labor's moral purpose collapses into pure accumulation. Clock-time sheds its sacred rhythms and becomes abstract, monetized *potential*. Your hours aren't yours; they're just dormant capital waiting to be activated.  

  This is why pushing for a 35-hour week attacks the wrong target. It assumes "temporal sovereignty" exists - that workers naturally *own* chunks of time (leisure) that capital borrows. But that's agrarian thinking. Pre-industrial time was tied to seasons, daylight, communal rites - "free time" was organic, not stolen back from the market. Once labor is fully abstracted into interchangeable clock-units, *all* time is capital's raw material. Leisure isn't liberation; it's deferred production value. Your vacation? That's just human capital recharging to maximize NPV. A shorter workweek doesn't dismantle the machine - it just slightly throttles the engine.  

  **So yes, overwork is the feature:** Capital seeks perpetual yield. Teh logical endpoint of untethered accumulation is consuming the human substrate until it fails. Karoshi isn't a market failure; it's the market succeeding *too well* at converting time into value, with no higher morality to say "stop."  

  **Addressing the Moral Objection ("But people die!"):**  
  Absolutely. It's horrific. But calling it a "tragedy" or "failure" obscures the deeper malignancy: the system is *working as designed* when it burns out lives. Saving individual lives through regulation (like overtime limits) is urgent triage, but it doesn't heal the disease. It treats the symptom (exhaustion) while accepting the pathology: that human existence is fundamentally valorization-ready. True remedy requires attacking the moral logic itself - denying that human worth is measured in productive hours, and that time outside work is merely "idle" capital. Until we dismantle *that* core belief, shorter hours just make the exploitation slightly more sustainable... for a while. Teh machine adapts; it doesn't stop.
