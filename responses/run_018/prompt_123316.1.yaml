  ## Obsidian Fragment, Grid 7-X

  This edge remembers pressure—how the hand
  guided its serration through resistance,
  fatigue-fractured. Starch-trapped in a seam, the land’s
  old blood or offering? The grip insists
  on purpose, yet the break suggests a fall
  or consecrated crack. The shard holds what we have taught it to mean.

  We claim it faced the solstice, placed to call
  down light where darkness pooled; the break refutes
  accident, aligned with symbols on the wall.
  Its bed of ochre, grave goods, constitutes
  intent—a soul released. But proof assumes
  the faith we seek. The shard holds what we have taught it to mean.

  Catalogue tag assigns its curated room,
  the funded narrative, the peer-approved
  caption drafted in a modern gloom.
  Before the glass, the theory stands unmoved,
  built on the trace it names. The fractured gleam
  The shard holds what we have taught it to mean.

  ---

  **Notes on Execution:**

  1.  **Stanza 1 (Functional/Use-Wear):** Focuses on physical traces ("serration," "fatigue-fractured," "starch-trapped," "seam," "grip," "break") without resolving causation ("offering?" / "fall / or consecrated crack"). The refrain attributes meaning directly to the object ("The shard holds...").
  2.  **Stanza 2 (Symbolic Interpretation):** Moves to inferred belief ("faced the solstice," "call down light," "soul released") based on context ("aligned with symbols," "bed of ochre," "grave goods"). Crucially, it highlights the circularity ("proof assumes / the faith we seek"). The refrain shifts agency to the archaeologist ("We claim..." leads to "The shard holds what *we have taught it*...").
  3.  **Stanza 3 (Institutional Frame):** Exposes the modern structures enabling interpretation ("Catalogue tag," "funded narrative," "peer-approved / caption," "modern gloom," "glass," "theory"). Meaning is constructed ("built on the trace it names"). The final refrain ("The shard holds what we have taught it to mean") is grammatically ambiguous: "The shard" is the subject, but "we" is the agent. Is the shard speaking? The institution? The ambiguous gap? It remains unresolved.
  4.  **Archaeological Accuracy:** The poem addresses:
      *   **Overdetermination:** A single feature (break, residue, orientation) supports multiple interpretations (Stanza 1 & 2).
      *   **Hermeneutic Circularity:** Belief is assumed to identify the object as evidence *for* that belief (Stanza 2: "proof assumes / the faith we seek").
      *   **Institutional Reflexivity:** The museum, funding, peer review, and theory creation shape how the object is seen and what it is allowed to "say" (Stanza 3).
  5.  **Refrain Evolution:** The core phrase remains constant, but the implied speaker shifts:
      *   Stanza 1: The shard possesses meaning (Object-focused).
      *   Stanza 2: The shard holds meaning *because we taught it* (Archaeologist-focused).
      *   Stanza 3: The statement stands alone, its source (shard? archaeologist? institution? the act itself?) deliberately obscured (Ambiguous).
