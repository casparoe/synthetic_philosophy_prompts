  hey, philosophy of physics/ML crossover question. einstein's hole argument was basically that inside a matter-free hole, the metric isn't uniquely fixed by the field equations, so general covariance looks like it kills determinism, right? now in deep learning people talk about how hidden-layer weights are underdetermind — permute neurons in a layer and the network computes the same thing. do you think einstein would have treated that as the same kind of issue, like the weights are just a coordinate choice with no physical reality? or would he say it's different because spacetime points have a direct physical interpretation that neuron indices don't? just trying to see if his argument actually transfers.
