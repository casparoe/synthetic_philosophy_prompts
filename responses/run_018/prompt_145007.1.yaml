  We are given an argument that purports to show a problem with the foundations of mathematics due to Skolem's paradox. We are to evaluate the steps (1) to (9) and find the flaw.

  Recall: Skolem's paradox arises because if ZFC is consistent, then by the downward Löwenheim-Skolem theorem, it has a countable model M. In this model, there is a set S which M believes is the power set of the naturals (i.e., S = P(ω) in M) and M also satisfies that S is uncountable (by Cantor's theorem as proved in M). However, since M is countable, the set S (being an element of the model) is also countable from an external perspective. So we have an external bijection f: ω → S. The paradox is that M thinks S is uncountable, but externally we see it as countable.

  The argument then proceeds to question the absolute truth of Cantor's theorem and the adequacy of first-order ZFC.

  Let's break down the steps:

  (1) We accept: if ZFC is consistent, then there is a countable model M of ZFC.

  (2) Inside M, there is a set S (which M thinks is P(ω)) and M proves that there is no surjection from ω to S (i.e., M satisfies Cantor's theorem for S).

  (3) Since M is countable, every element of M is countable from the external viewpoint. In particular, the set S (as a set in the model) is countable externally, meaning there is an external bijection f: ω → S.

  (4) This external bijection f exists, but f is not in M.

  (5) The argument then claims: Cantor's theorem is not just about what is inside M, but is an absolute claim that no surjection exists at all. Since we have found such a surjection f (from the external viewpoint), the absolute claim is false.

  (6) But mathematicians treat Cantor's theorem as objectively true.

  (7) Therefore, either Cantor's theorem is false, or ZFC fails to describe the intended universe of sets (because it has a model in which what it calls the power set of naturals is actually countable).

  (8) If ZFC misrepresents the subject matter (by having countable models for what should be uncountable sets), then first-order formalization is inadequate.

  (9) We know that (9) is false because first-order logic is still the foundation.

  The author wants to keep (1)-(4) and avoid (9). The dilemma is between rejecting (5) (by saying that Cantor's theorem is only about the model) or rejecting (6) (by saying that mathematicians are implicitly working in a model-relative way).

  Now, let's think step by step.

  The key issue is the interpretation of what Cantor's theorem says. In step (5), the argument claims that Cantor's theorem is an absolute statement. But is that correct?

  Cantor's theorem, as proven in ZFC, is a theorem of ZFC. It says:

    For every set x, there is no surjection from x onto P(x).

  This theorem is proved within the theory of ZFC. Therefore, in any model of ZFC, the theorem holds. But note: the theorem is about the sets in that model.

  In the countable model M, the set S (which M thinks is P(ω)) is such that there is no surjection from ω to S that is in M. However, externally, we can see that S is countable because the entire model is countable.

  But does that contradict the absolute truth of Cantor's theorem? Only if we assume that the intended interpretation of ZFC is a model that contains all sets and functions. However, by the incompleteness phenomena, we know that there is no single model that captures the entire universe of sets (if we think of the universe as absolute). Moreover, in set theory, we often consider multiple models.

  The flaw is in step (5): the claim that Cantor's theorem is an absolute statement that no surjection exists at all. But what does "at all" mean? In the context of set theory, we have to specify the universe. The theorem is absolute only if we fix the universe. But the universe of all sets is not something we can capture in a first-order theory.

  In fact, the theorem is relative to the model. Therefore, when we say that Cantor's theorem is true, we mean that it holds in every model of ZFC, which it does. In the model M, it holds because there is no function in M that is a surjection. But externally, we can see a function that is not in M. That function is not in the model M, so it doesn't violate the theorem inside M.

  Moreover, note that the set S in M is not the same as the "real" power set of the naturals in the intended interpretation. The model M is a countable model, so it must be that S is not the full power set. In fact, S is a countable set that the model M mistakenly thinks is the full power set. From the external viewpoint, we know that the real power set of the naturals (if we believe in a fixed universe) is uncountable. But in M, the set S is a proper subset of the real power set? Not exactly, because M is a model of ZFC and so it satisfies that S is the power set. However, from the external viewpoint, we see that S is only a countable set and does not contain all subsets of ω. But note: the model M does not have access to the "real" subsets that are missing. So the model M is correct about its own sets.

  Therefore, step (5) is incorrect because it conflates the internal and external perspectives. The absolute claim of Cantor's theorem must be understood as relative to a model. When mathematicians say that the power set of the natural numbers is uncountable, they are making a statement about the standard model of set theory (if they are platonists) or about the fact that in every model of ZFC, the set that the model designates as the power set of the naturals is uncountable in that model. But they are not claiming that there is no model in which that set is countable? Actually, they are: they know about countable models. The existence of countable models is well-known and does not cause mathematicians to abandon the theorem because they understand that the theorem is about the sets that are present in the model.

  So the mistake is in step (5): the interpretation that Cantor's theorem is an absolute claim that must hold across all models and in the entire universe. Instead, it is a claim that holds within a given model. The external function f exists, but it is not a function in the model M, so it does not violate the theorem in M.

  Therefore, we reject (5) by clarifying that Cantor's theorem, as a theorem of ZFC, is a statement that holds in every model of ZFC, but that does not mean that the set S in a countable model is the same as the intended power set. The theorem holds in M because M does not contain the function f. The absolute truth of Cantor's theorem is maintained by noting that the intended power set (in the standard model, if such exists) is uncountable, but we can also have non-standard models that are countable and in which the set that they call the power set is actually countable from an external perspective.

  But note: we cannot have a model of ZFC that is both countable and standard? Because the standard model (if it exists) must be uncountable. So the countable model M is non-standard. In M, the set S is a set that M believes is the power set, but it is not the real power set.

  So the flaw is in the absolute claim in step (5). The argument tries to use the existence of an external bijection to falsify the absolute claim, but the absolute claim of Cantor's theorem is about the real power set in the intended universe. The model M does not contain the real power set, only a countable version of it. Therefore, the external bijection does not contradict the absolute Cantor's theorem because the absolute theorem is about the real power set, which is uncountable and for which there is no bijection (even external) to the naturals? Actually, the real power set is uncountable so there is no bijection at all (in any universe) to the naturals. But wait: in the model M, we have a set S that is countable externally, but the real power set is a different set. The set S is not the real power set.

  Therefore, the existence of an external bijection for S does not contradict the absolute uncountability of the real power set.

  So step (5) is the weak link. It incorrectly assumes that the set S in M is the same as the intended power set of the naturals. But it is not. The set S is a set in the countable model that the model believes is the power set, but it is not the intended power set (which is uncountable).

  What does this cost? It means that we must accept that the notion of "power set" is relative to the model. This is a well-known aspect of first-order set theory: the power set axiom only guarantees that for every set in the model, there is another set in the model that contains all subsets that the model can see. But the model might not see all subsets. So the intended absolute universe of sets is not captured by a single model. This is the phenomenon of non-standard models.

  Therefore, we do not have to give up the idea that mathematics is about an absolute universe. We can still believe in an absolute universe, but we must acknowledge that our formal system ZFC (being first-order) cannot uniquely characterize it. There will be non-standard models that are countable and in which the power set is "small". But that does not mean that the absolute power set is small.

  Alternatively, if we take a more formalist view, we can say that mathematics is about what is provable in ZFC, and that the theorem holds in every model. The existence of a model that is countable and in which the power set is externally countable does not affect the truth of the theorem within the model.

  So the cost of rejecting (5) is that we must accept that the notion of the power set (and hence uncountability) is model-relative. However, we can still maintain that in the intended model, the power set is uncountable. But the formal theory ZFC does not pin down the intended model. This is a limitation of first-order logic, but it is one that set theorists are aware of and work around.

  Alternatively, we can reject the absolute claim in (6) by saying that mathematicians, when they assert Cantor's theorem, are asserting it as a theorem of ZFC and hence it holds in every model, but they are not making an absolute claim about a fixed universe. However, I think most mathematicians do believe in an absolute universe. But they also know that the theorem is proved in ZFC and holds in every model, and that the existence of countable models does not contradict the absolute uncountability of the real power set because the set in the countable model is not the real power set.

  Therefore, the flaw is in step (5). The argument incorrectly assumes that the set S in the countable model is the same as the intended power set. It is not.

  So the conclusion is that step (5) is the mistake.

