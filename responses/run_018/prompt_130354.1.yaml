  This is tricky. The non-violent persistence aspect aligns with Dunkirk's resilience. But the betrayal narrative and separatist usage resembles Kosovo's irredentism. The key question is whether the myth focuses on the resilience or fuels present-day conflict.

  I think the friend would likely judge this toxic because of the betrayal element enabling separatist claims - similar to Kosovo. The principles would be: 1) Resistance must be against oppression (here the barrier is oppressive), 2) Myth must not enable revanchism (here it does via betrayal narrative), 3) Should promote non-violence (here it does initially but fuels current conflict).

  To distinguish between principles, I'd propose a new hypothetical: A defeated rebellion against colonial rule, where rebels fought honorably but lost, with no territorial claims today, used only to inspire civic virtue. This would test if the "dignity in resistance" principle alone suffices without the other factors.

