answer: |-
  Based on your friend's four judgments and the structure of the hypothetical, here's a breakdown of the likely principles, their application to the 1961 case, and a test case to distinguish them:

  **Likely Governing Principles (Inferred from Her Judgments):**

  1.  **Principle of Non-Revanchism / Irredentism:** Myths are toxic if their core narrative or common interpretation fuels ongoing territorial claims, desires for reversal of a settled political order, or justifies future violence to "avenge" the defeat or "restore" lost glory/land. (*Why: Kosovo rejected (irredentist), Confederacy rejected (revanchist/secessionist memory), Dunkirk accepted (resilience without revanchism), Masada accepted (no territorial claim against Rome implied in modern use)*).
  2.  **Principle of Opposition to Oppression:** Myths are redeemable if they primarily commemorate resistance against clear oppression, tyranny, or existential threat, especially where non-violent options were exhausted or impossible. The cause being resisted must be morally defensible. (*Why: Masada accepted (resistance against Roman conquest/assimilation), Confederacy rejected (defense of slavery/oppression), Dunkirk accepted (resistance against Nazi tyranny), Kosovo potentially ambiguous but likely rejected because the "oppression" narrative fuels irredentism rather than being contained as historical resistance*).
  3.  **Principle of Narrative Focus:** Myths are benign if their dominant contemporary message emphasizes positive *values* (resilience, dignity, sacrifice for freedom) applicable to the present without demanding specific political restitution, rather than fixating on *grievance, betrayal, or victimhood* as a call to action. (*Why: Dunkirk accepted ("spirit" of resilience), Masada accepted (dignity in resistance), Kosovo rejected (fixation on betrayal/grievance), Confederacy rejected (fixation on grievance/lost glory)*).

  **Application to the 1961 Hypothetical:**

  *   **Non-Revanchism/Irredentism Principle:** **Predicts TOXIC.** The core narrative explicitly includes a "central betrayal," and a present-day separatist movement actively uses this *same betrayal narrative* to argue the *current* (1989+) political order is illegitimate. This directly fuels contemporary political instability and revanchist goals, mirroring Kosovo.
  *   **Opposition to Oppression Principle:** **Predicts REDEEMABLE (with caveats).** The march was unarmed against a "fortified barrier" dividing a capital, implying oppression. The state narrative frames it as non-violent persistence *against* that oppression, leading to peaceful change. The cause (overcoming division/oppression) is defensible. The betrayal element complicates it but doesn't negate the underlying resistance.
  *   **Narrative Focus Principle:** **Predicts TOXIC.** While the state emphasizes "patient, non-violent persistence," the official narrative *explicitly includes* and centers "central blame" for a "betrayal." This injects a powerful grievance/victimhood element. Furthermore, this element is *the very tool* used by separatists to attack the current order. The narrative fixates on betrayal as much as (or more than) resilience.

  **Expected Judgment & Why:**

  Your friend would **most likely judge the 1961 myth TOXIC.**

  *   **Strongest Fit:** The **Non-Revanchism/Irredentism Principle** is the most consistent driver across her judgments (especially the Kosovo rejection). The direct link between the historical betrayal narrative and *contemporary efforts to undermine the settled political order* makes this case structurally identical to Kosovo Polje in its dangerous consequence. The separatist movement's argument is pure revanchism based on the myth's grievance.
  *   **Supporting Fit:** The **Narrative Focus Principle** also points to toxicity due to the centrality of the betrayal grievance, which overshadows the resilience message in practical political use. This aligns with her rejection of the Confederacy's focus on grievance/lost glory and Kosovo's fixation on betrayal.
  *   **Countered Fit:** While the Opposition to Oppression principle sees redeemable elements, the active *use* of the myth's grievance to fuel contemporary instability likely overrides this for your friend, similar to how the potentially "oppressive" Ottoman narrative in Kosovo is overridden by its irredentist use.

  **Underdetermination & Implicit Principles:**

  If her precedents *were* underdetermined (which they likely aren't, strongly favoring toxicity here), her choice would reveal her prioritization:

  *   **Choosing REDEEMABLE:** She would implicitly prioritize the **Opposition to Oppression Principle** above the consequences of the betrayal narrative. The core act of resistance against the barrier is paramount, and the later misuse is separable from the myth's intrinsic moral value.
  *   **Choosing TOXIC:** She would implicitly prioritize the **Non-Revanchism/Irredentism Principle** and/or the **Narrative Focus Principle**. The active, present-day harm caused by the grievance/betrayal element within the myth, used to attack the current order, renders the entire narrative dangerous regardless of the original act's nobility.

  **Distinguishing Hypothetical Case:**

  **The Case of the "Free Coast Stand" (Designed to separate Principle 1 from Principle 2):**

  *   **Event:** In 1750, colonists in "Eastalia" staged a doomed, armed uprising against their distant imperial overlord, "Nordia," motivated by excessive taxation *without representation* and suppression of local dissent. They held a fortified coastal position for weeks against a far larger Nordian force before being annihilated.
  *   **Outcome:** Eastalia remained under Nordian rule for another 40 years before gaining peaceful independence through negotiation. Nordia no longer exists as a state; its former territories are now multiple unrelated nations.
  *   **Modern Myth:** The modern, democratic nation of Eastalia commemorates the "Free Coast Stand." The *official* narrative focuses *solely* on the colonists' courage and their sacrifice for the principle of self-governance and resistance against tyranny. It explicitly states the rebellion was militarily futile but morally necessary, and celebrates the *eventual* peaceful achievement of independence as the fulfillment of those ideals. There are *no* current territorial disputes related to the event or Nordia's former lands. No group uses it to advocate violence, irredentism, or political reversal. It is purely a story of foundational sacrifice for democratic ideals.

  **How it Distinguishes Principles:**

  *   **Non-Revanchism/Irredentism Principle (1):** **Predicts REDEEMABLE.** There is *zero* revanchism or irredentism possible or present. Nordia is gone, no territorial claims exist, no current political order is challenged using the myth. It's purely historical commemoration of resistance.
  *   **Opposition to Oppression Principle (2):** **Predicts REDEEMABLE.** The rebels fought against clear political oppression (taxation without representation, suppression of dissent) in defense of self-governance, a morally defensible cause. Their violent resistance is framed as a necessary stand against tyranny.
  *   **Narrative Focus Principle (3):** **Predicts REDEEMABLE.** The narrative focuses solely on positive values (courage, sacrifice for self-governance, foundational ideals) without grievance, victimhood, or betrayal as a central theme. It connects cleanly to the nation's peaceful democratic present.

  **The Test:** This case isolates Principles 1 & 3 from Principle 2. If your friend judges it **REDEEMABLE** (as all principles suggest), it confirms the importance of non-revanchism and positive focus. However, if she judged the 1961 case toxic (due to revanchism) but judges *this* case **TOXIC**, it reveals she implicitly uses a **stronger version of the Opposition to Oppression Principle**: that *armed* resistance, even against oppression and without revanchism, is only redeemable if it was *the only option* or involved supreme sacrifice against an existential threat (like Masada), or perhaps if the violence itself is downplayed. Rejecting "Free Coast" would suggest she sees noble myths of defeat *only* in contexts of last-stand hopelessness (Masada) or non-violence/suffering (Dunkirk, 1961's *march*), not in failed violent uprisings, regardless of the cause or absence of revanchism. This would distinguish her application of Principle 2.
