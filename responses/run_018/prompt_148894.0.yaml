answer: |-
  Right, let's get our bearings first. Key moves from *Anarchy, State, and Utopia*:  
  1.  **Justice is Historical & Procedural:** A holding is just *only* if it arose through just initial acquisition or voluntary transfer from a just prior holding. Patterned end-states (like equality, need, desert) are irrelevant.  
  2.  **Voluntary Transfer is Paramount:** Any transfer freely agreed to by competent parties, without fraud or force, preserves justice in holdings, *regardless* of the resulting pattern. The Wilt Chamberlain case proves this disrupts any starting pattern.  
  3.  **Entitlement Trumps Intuition:** Even if a distribution *looks* intuitively "unfair," if it arose via just steps, it *is* just. The theory's bite is precisely in protecting voluntary action from patterned interference.  
  4.  **Information Asymmetry ≠ Injustice:** Mere knowledge disparity doesn't invalidate voluntariness, provided no active fraud or coercion occurred during the agreement.  

  Now, your "Reverse Chamberlain Protocol." Intriguingly perverse. But no, it doesn't blunt the normative bite. Here's why:  

  1.  **The Core is Still Voluntary:** You state it yourself – "technically it's voluntary; they signed." Crucially, they signed *knowing the terms explicitly:* Chamberlain controls the performance and thus the net flow. They consented to *this specific structure of risk and reward*, however unusual. The voluntariness hinges on their understanding and acceptance *at the moment of agreement*, not on the eventual outcome.  

  2.  **Chamberlain's Dual Role is Irrelevant:** Him being "both athlete and bookmaker" is merely a feature of the contract they willingly entered. Entitlement theory doesn't require roles to be "pure" or separated; it requires the *acquisition* of holdings (the money transfers) to result from voluntary agreements concerning justly held prior property. Each spectator entered with their £1 (presumed justly held). They voluntarily contracted it away under specific future conditions controlled by Chamberlain. When he triggers payment based on his performance (as per the contract *they signed*), the transfer occurs as agreed.  

  3.  **"Rigged Pool" Misdiagnosis:** You call it "rigged." But rigged *against whom*? The spectators knew the rules *ex ante*. Chamberlain didn't *retroactively* change the terms; he exercised the control explicitly granted to him *within* the terms they accepted. The "risk" they took wasn't hidden; it was the fundamental structure of the deal. Calling it rigged presupposes they *deserved* a different outcome structure – a patterned principle (e.g., "exchanges should be symmetrical" or "one party shouldn't have total outcome control"). Entitlement theory rejects such presuppositions. Justice lies in the agreement, not the symmetry of power or risk within it.  

  4.  **Where the Intuition Bites (and Why it Doesn't Matter):** The discomfort arises, I suspect, because Chamberlain has near-total control and exploits an information/power asymmetry *within the rules he set*. It *feels* exploitative or "unfair." But entitlement theory distinguishes sharply between:  
      *   **Injustice:** Acquisition via force, fraud, or violation of prior rights.  
      *   **Foolishness/Bad Luck:** Entering a voluntary but stupid or highly asymmetric bargain.  
  The spectators' regret or Chamberlain's cleverness doesn't transmute a foolish voluntary choice into an injustice. To claim otherwise *is* to smuggle in a patterned principle (e.g., "outcomes shouldn't be too asymmetric" or "bargains should reflect equal power").  

  **Concession (Minor):** If Chamberlain actively *misrepresented* his ability to control his performance (e.g., lied about having an injury preventing him from playing brilliantly), *that* would be fraud, invalidating the voluntariness of specific transfers based on that deception. But absent such fraud, the control itself was the contracted condition.  

  **Conclusion:** Your protocol is bizarre, perhaps imprudent for the spectators, and highlights how voluntariness can lead to highly asymmetric outcomes. But it doesn't undermine entitlement theory. It *reinforces* it. The transfers result solely from the specific voluntary agreement made concerning justly held property. The theory's normative bite is *precisely* that it forbids nullifying such outcomes based on their perceived pattern or the relative bargaining positions, protecting the freedom to make strange, risky, or asymmetric deals. To condemn this *is* to endorse interfering with voluntary transfers based on a pattern – the very thing Chamberlain's original argument dismantled. The "rigging" was inherent in the rules consented to; preventing Chamberlain from profiting by those rules *would* itself be an unjust taking.
