  For endurantism, the challenge is how a wholly present object at each moment can bear properties about future commitments without temporal parts. They might use timeless properties or dispositional ones, but that risks smuggling in temporal parts implicitly. Also, breaking a commitment wouldn't destroy the self, but it might cause discontinuity in identity if the commitment is core to who they are.

  The user also asks if breaking a commitment destroys part of the self. Perdurantism might see it as altering a temporal part, but not destroying the whole worm. Endurantism would view it as a change in properties, not destruction. Neither strictly says you're destroyed, but both have nuances.

