  3. our visceral horror at pain is an evolutionary misfire that tracks local damage rather than cosmic good, so debunking it actually supports leibniz.
  4. still, i think ordinary people reach real moral knowledge through reflective equlibrium on concrete cases, and that knowledge grounds obligations.
  5. and i hold we always have a direct reason to reduce suffering whenever we can, regardless of the big-picture accounting.

