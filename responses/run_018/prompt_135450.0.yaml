answer: |-
  **Teaching Plan: Downward Causation in Dennett's Careenium**

  ---

  ### **1. Conceptual Dependencies and Teaching Sequence** (~180 words)  
  *(Order: Build foundations → Introduce puzzle → Resolve tension)*  
  - **Start with Careenium basics (5 min):** Define *simmballs* (simple, mindless substrate units) and *simms* (emergent, stable symbol-patterns). Emphasize simms *supervene* on simmball configurations.  
  - **Introduce causal closure (3 min):** Establish physics-completeness: simmball interactions *fully determine* future simmball states.  
  - **Pose the puzzle (4 min):** Can simm-level patterns (e.g., a "belief" simm) *cause* changes in specific simmballs? Highlight tension: If simmballs are causally sufficient, how can simms add causal power?  
  - **Define "downward causation" (2 min):** Contrast with top-down control (no programmer!) and bottom-up determinism.  
  - **Present the carrying example (6 min):** Use a concrete case (see Section 2) to illustrate *pattern-dependent* simmball dynamics.  
  - **Resolve explanatory conflict (5 min):** Distinguish causal sufficiency (simmballs) from *causal relevance* (simms as best predictors of macro-behavior).  
  - **Conclusion (5 min):** Summarize non-reductive physicalism: Simms are real causal patterns, not extra forces.  

  *Why this order?* Supervenience and causal closure are prerequisites. The puzzle must feel unresolved before introducing emergence. The example bridges abstract concepts to intuition.

  ---

  ### **2. The Carrying Example: Requirements and Limits** (~150 words)  
  **Example:** *Conway’s Game of Life "Glider"*.  
  - **Required Properties:**  
    - A glider (simms) is an emergent pattern of cells (simmballs).  
    - The glider "moves" diagonally by *causing* specific cell-state changes in its path—these changes *depend wholly on the glider pattern’s structure*.  
    - No hidden controller: Rules are local (cell-to-cell), but the glider’s persistence dictates *which* cells flip next.  
  - **Forbidden Properties:**  
    - NO software/hardware analogy (e.g., "glider is code, cells are hardware").  
    - NO teleology (e.g., "glider wants to move").  
  - **Why it works:** The glider’s *pattern* (not individual cells) explains *why* specific cells change. Removing the pattern removes the predictability of cell-flips.  

  ---

  ### **3. Misconception Map and Intervention Points** (~180 words)  
  - **Misconception 1: "Simms must add new physical forces."**  
    *Intervention:* When defining downward causation. Emphasize: Simms *constrain* substrate behavior via pattern-structure, not new energy.  
  - **Misconception 2: "If simmballs are causally sufficient, simms are epiphenomenal."**  
    *Intervention:* After stating causal closure. Distinguish: Causal sufficiency ≠ explanatory monopoly. Use the glider: Cells *are* sufficient, but only the glider-pattern explains *direction* of changes.  
  - **Misconception 3: "Downward causation = a homunculus controlling simmballs."**  
    *Intervention:* During example analysis. Stress: The glider has no "pilot"—its "influence" is just the logical outcome of pattern-based rules.  
  - **Misconception 4: "This is just emergence, not *real* causation."**  
    *Intervention:* In the resolution phase. Argue: If a simm-pattern *reliably predicts and explains* substrate changes better than micro-details, it’s causally relevant.  

  ---

  ### **4. Understanding Check** (~90 words)  
  **Prompt:** *"In a traffic jam (cars = simmballs; jam = simms), could the jam ‘cause’ a car to brake? If so, how does this not violate the physics of cars?"*  
  - **Target Insight:**  
    - Correct: "Yes—the jam’s *pattern* creates conditions where braking is inevitable. Car physics is sufficient, but the jam explains *why* braking occurs *here/now*."  
    - Wrong: "No—only other cars cause braking" (misses pattern-dependence) or "Yes—the jam is a force" (reifies the pattern).  
    *If they articulate pattern-constraint without mysticism, they grasp it.*  

  ---

  ### **5. Boundaries: What This Level Must Omit** (~90 words)  
  - **NO Gödelian loops:** Self-reference (e.g., simms representing simms) adds unnecessary complexity.  
  - **NO consciousness:** Whether simms "feel like something" distracts from causal structure.  
  - **NO other emergence theories:** Avoid comparisons to quantum emergence or strong emergence.  
  - **NO neural correlates:** Don’t map simmballs to neurons—this is a *conceptual* model.  
  - **Why omit?** These introduce tangents requiring expertise. Focus solely on *pattern-substrate causality* within Careenium’s idealized framework.  

  ---

  ### **6. Confidence and Least-Sure Point** (~70 words)  
  **Confidence Level:** High (90%). The sequence addresses known pitfalls (e.g., homunculus fallacy) and leverages Dennett’s own pedagogical tools (e.g., Game of Life).  
  **Least-Sure Point:** Timing for the "explanatory relevance" distinction. Students may struggle to abandon causal sufficiency as *exhaustive* explanation. I’m unsure if 5 minutes is enough to cement that patterns can be causal without violating physics. Rehearse this transition.  

  ---

  **Total Estimated Time:** 30 minutes (flex Q&A within sections).  
  **Goal:** Leave them seeing downward causation as a claim about *explanation*, not spooky forces.
