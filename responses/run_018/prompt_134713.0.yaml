  hey i'm a phil phd student writing a grant proposal for a 3-month part-time project. my idea is kind of half-formed: the standard separateness-of-persons objection to utilitarianism (the Rawlsian one) is usually read as saying you can't just add utility across people because people are distinct centers of consciousness. but i think that framing misses something. what if the real issue isn't aggregation at all, but a kind of "normative jurisdiction" — each person has authority over how their own well-being gets counted in collective decisions, and utilitarianism violates that not by adding, but by substituting an external calculus for that authority?

  i want a two-page proposal that frames the question like this: is the separateness objection best reconstructed as an authority-violation claim rather than an anti-aggregation claim? state the question precisely. then explain why both standard Rawlsians and utilitarians leave this open (they're both obsessed with distribution and equality, not authority). lay out the approach: i'd do conceptual analysis drawing on shared-agency and joint-intentionality literature to model what "retaining authority" actually requires, then apply it back to the utilitarian calculus. say what the possible conclusions are — maybe authority can be delegated in shared projects without being destroyed, which'd weaken the objection in some social contexts but strengthen it in others? — and what'd count as failure (if authority turns out to be indistinguishable from simple preference-satisfaction). also be honest about scope: what's realistic for 3 months part-time vs what needs to be cut. and please take a definite stance — don't just list teh framing options, argue that the authority-reconstruction is the right one and defend that choice. don't include citations or a bibliography, i'll add them. (sorry for teh typo and casual tone, writing this on my phone between seminars)
