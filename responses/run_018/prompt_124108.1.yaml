answer: |-
  ## The Bidder's Tale

  The auctioneer explains the game so plain:  
  Who offers most will gain the ten-dollar prize.  
  A modest start—a five, then six—no strain,  
  Just friendly bids beneath the fluorescent lights.  

  A ten, a twelve, the numbers start to climb,  
  A fifteen floats, a twenty meets the air.  
  It seems a simple wager, spent in time,  
  To win the card held shining over there.  

  Then thirty bucks—a gasp—but wait, the rules  
  Hold more than gain, a sharper edge takes hold:  
  **The loser pays.** That truth, like sudden cold,  
  Reveals the trap. To quit now makes two fools—  
  The one who stops, admitting first mistake,  
  The one who *buys* the right to say who broke.

  ---

  ## How the Form Enacts the Trap

  *   **Rhyme Scheme:** Starts loosely ABAB CDCD, then tightens dramatically in the final six lines to EFEFGG – mirroring the sudden focus and inescapable pressure after the "loser pays" revelation. The closing couplet (GG) locks the two fools together.
  *   **Repetition:** "Ten-dollar prize" (line 2) becomes just "the card" (line 8), then vanishes entirely by the end, showing its irrelevance. "Fool/fools" echoes, trapping both participants in the label.
  *   **Line Breaks & Enjambment:** The key turn happens mid-sentence across lines 9-11 ("but wait, the rules / Hold more than gain, a sharper edge takes hold: / **The loser pays.**"). The break after "rules" creates suspense; the period after "pays" isolates the cruel truth.
  *   **Tightening Structure:** The move from alternating rhymes to the insistent couplets in the final tercet and couplet creates a claustrophobic feel, reflecting the narrowing options and the "lock" of the trap.
  *   **Focus Shift:** The prize fades ("the card," then gone), replaced by the abstract, costly battle over narrative ("the right to say who broke"). The auction becomes about saving face, not winning value.
  *   **Voice:** The ordinary observer's tone starts neutral, almost naive ("so plain," "no strain," "friendly bids"), then shifts to cold realization ("sudden cold," "trap," "fools") and the bitter understanding of the final transaction.
