answer: |-
  Here's the scenario in one tight paragraph:

  > Nurse A, rushing during a critical night shift, skipped a double-check step on a high-risk medication admin protocol. A patient had a severe (but non-fatal) adverse reaction. The hospital swept it under the rug to avoid bad PR. A feels guilty but told no one, faced no official reprimand, and kept their job. Now, two years later, A is the frontrunner for Charge Nurse – a role with *more* oversight on those same protocols. Their work *since* the incident has been technically flawless, but they never confessed or made amends to the patient.

  **Walking it through:**

  1.  **Standard One-Life Desert Theory:**  
      *   **Verdict:** A absolutely does **NOT** deserve the promotion *right now*.  
      *   **Why:** Desert is earned or forfeited *within this single lifetime*. A committed a serious act of negligence causing harm. The harm hasn't been acknowledged, rectified (to the patient/society), or punished. Promoting A rewards the negligence, ignores the unresolved harm, and places them in a position where a repeat could be catastrophic. Desert requires facing the consequences *here* (confession, sanction, demotion, restitution) *before* earning new trust/status. A hasn't "paid their debt" in *this* life.

  2.  **Cross-Lifetime Karma (with Moral Escrow):**  
      *   **Verdict:** A **DOES** deserve the promotion *right now*.  
      *   **Why:** The "debt" incurred by the negligence *has already been balanced* through suffering endured in a previous life (e.g., perhaps A *was* the victim of terrible medical negligence themselves in a past life and suffered immensely). The karmic ledger is squared. This current life's good fortune (the promotion opportunity) is effectively the *payout* from that prior-life "savings account" of endured suffering ("moral escrow"). Denying A the promotion *now* would be punishing them *again* for a debt already paid. Their current good work reflects their current karmically "clean" state.

  **The Crucial Feature & Its Removal:**

  *   **The Key:** The "**moral escrow across lives**" is doing *all* the work in creating the divergent verdicts. It severs the direct, observable link between *this life's* harmful act and *this life's* desert for reward/punishment.
  *   **Removing the Escrow:** If you remove the concept of karmic balance transferring across lifetimes (i.e., if karma only works *within* one life, or desert is purely single-life), **the Karma theory collapses into the One-Life Desert position**. Suddenly, A's past negligence *in this life* is directly relevant to their desert *in this life* for the promotion, and both theories agree: no promotion deserved until consequences are faced *here*.

  **How the One-Life Theorist Attacks (Beyond Denial of Past Lives):**

  Denying past lives is the obvious first strike, but the deeper problems are:

  1.  **Moral Isolation of Lives:** Actions and their consequences are inherently tied to the *specific moral agent in a specific context*. Suffering as "Patient B" in life X doesn't morally compensate for causing harm as "Nurse A" in life Y. They are distinct moral events involving different victims, different societal contexts, and crucially, a different *consciousness* with no memory or connection to the supposed debt. Desert is personal and contextual.
  2.  **The Epistemology Problem ("How do you KNOW?"):** There's *zero* verifiable way to know if A *actually* suffered sufficiently in a past life to balance the debt. The "escrow account" is completely opaque and untestable. Basing real-world decisions (like promotions affecting patient safety) on an unverifiable metaphysical ledger is seen as arbitrary, irrational, and potentially dangerous. Desert in the real world needs grounding in observable facts.
  3.  **Undermining Current Accountability:** The theory functionally excuses A from facing any consequences *in this life* for their *actions in this life*. This seems to violate fundamental principles of justice and responsibility relevant *to the society they currently live in*. It could encourage negligence ("My karmic escrow is probably full!"). Consequences serve functions *beyond* pure desert (deterrence, safety, victim validation) that the escrow ignores.
  4.  **The "Desert Transfer" Absurdity:** Does the patient harmed *in this life* get compensated by the fact that *someone else* (past-life A) suffered long ago? That seems deeply unsatisfying and unrelated to the actual harm done *to them*.

  **In short:** The "moral escrow" creates the divergence by making current fortune independent of current misdeeds (if the debt is paid elsewhere). The One-Life theorist hammers this as an unverifiable, context-destroying concept that severs the essential link between an agent's *present* actions and their *present* desert, making real-world justice impossible.
