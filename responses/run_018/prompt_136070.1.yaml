  ## Bureau of Narrative Gravity (BNG)  
  Official FAQ Regarding Personal Identity Continuum Management  

  **1. What is the primary function of the Bureau of Narrative Gravity (BNG)?**  
  > The BNG administers the Personal Narrative Coherence Act (PNCA-7), overseeing the registration, maintenance, and adjudication of all federally recognized Centers of Narrative Gravity (CoNGs) within jurisdiction. This entails verifying gravitational coherence, processing narrative continuity events, and resolving disputes pertaining to protagonist status under statutory guidelines.

  **2. Upon birth, I received a certificate stating I am a "fictional protagonist." Is this an error?**  
  > No. Per PNCA-7 § 12.4(a), all human birth certificates issued by this Bureau contain the standardized disclaimer: *"The holder of this record constitutes a federally recognized Center of Narrative Gravity (CoNG), provisionally designated as the fictional protagonist of their emergent biographical narrative. This designation implies no intrinsic metaphysical substance and is subject to gravitational flux."* This is a mandatory ontological classification, not an assessment of literary merit.

  **3. Following significant retrograde autobiographical amnesia, how do I maintain legal identity continuity?**  
  > File Form NG-114 "Continuity of Protagonist Application for Renewal" (COP-Renewal) within 90 days post-event. Submit corroborating witness affidavits (Form NG-114a), recent narrative summaries (Form NG-114b), and undergo a Gravitational Coherence Quotient (GCQ) assessment at an approved testing facility. A GCQ score above 0.65 generally qualifies for Provisional Continuity Status pending a 24-month narrative stabilization period. Late submissions require a Hardship Waiver (Form NG-114w) and tripled processing fees.

  **4. My spouse underwent a profound values transformation (e.g., abandoning fiscal conservatism for radical communal veganism), claiming it constitutes a "branching narrative." Are they still legally the same person for tax purposes?**  
  > Branching Narrative Events (BNEs) exceeding Level 3 Discontinuity (as measured by the Dennett Scale) may trigger a Formal Narrative Schism Inquiry. File Form NG-227 "Petition for Narrative Branch Adjudication" with the Counter-Narrative Appeal Board (CNAB). The CNAB will assess pre- and post-BNE motivational vectors, symbolic resonance, and societal disruption potential. Until adjudication, the original CoNG remains legally and financially liable for all pre-BNE obligations. Shared assets may require Narrative Escrow.

  **5. Can I be held legally liable for inconsistencies in my recounted life story?**  
  > Yes. Material inconsistencies constituting Level 2 or higher Narrative Fraud (per PNCA-7 § 45.8.c) are prosecutable offenses. Common infractions include: claiming unverifiable achievements (Form NG-451a), temporal paradoxes exceeding 18 months (Form NG-451b), and contradictory core value assertions under oath (Form NG-451c). Penalties range from mandatory Coherence Re-education (CR-101 Course) to full Protagonist Probation, restricting major life plot decisions.

  **6. Who serves as the "narrator" of my recognized narrative?**  
  > The default narrator is the CoNG itself (i.e., "you"), operating under principles of First-Person Operational Primacy. Third-party narration claims (e.g., biographers, parents, AI chroniclers) must be registered via Form NG-88 "Designated External Narrator Application" (DEN-App) and are subject to strict truth-in-narration regulations. Unauthorized external narration exceeding 30% of perceived biographical influence constitutes Narrative Hijacking (a Class C Ontological Felony).

  **7. How does the Bureau observe "No Further Fact Day" (NFFD)?**  
  > NFFD (Observed annually on the 3rd Thursday of November) commemorates the foundational ontological principle underpinning the Bureau's work: the absence of any metaphysical substrate beneath narrative gravity. Federal offices close. Citizens are encouraged to engage in non-essential activities highlighting the constructed nature of selfhood (e.g., writing unreliable memoirs, adopting temporary personas, contemplating the void). Mandatory identity reaffirmation ceremonies are suspended for the day. Decorations are minimal and existentially muted.

  **8. Is there an official BNG position on survival after bodily cessation?**  
  > The Bureau administers only *embodied* CoNGs. Upon biological termination, the associated narrative file is archived in the National Repository of Closed Loops (NRCL). Post-cessation narrative continuation falls outside BNG jurisdiction and is considered a private speculative matter. Inheritance and legacy claims are processed based solely on the verifiable narrative arc *up to* the point of cessation, via Form NG-711 "Estate Narrative Finalization."

  **9. Can I appeal my assigned Gravitational Coherence Quotient (GCQ)?**  
  > GCQ scores below the Continuity Threshold (0.65) may be appealed within 30 days by submitting Form NG-515 "GCQ Reassessment Request" accompanied by new supporting narrative evidence and payment of the Re-evaluation Fee. Scores derived from verified major trauma or existential crisis events may qualify for Contextual Adjustment via Form NG-515c. The Bureau does not recognize appeals based on "feeling more coherent than the score indicates," as this constitutes a subjective narrative assertion, not objective evidence.

  **10. Are there exemptions for entities denying they possess a narrative?**  
  > Claims of "narrative nihilism" or persistent "non-protagonist status" must be formally documented via Form NG-0 "Application for Recognition of Persistent Anecdotal Deficiency." Applicants undergo rigorous evaluation by the Bureau's Section of Ontological Defaults (SOD). Approval is exceedingly rare and results in classification as a Background Entity (BE), carrying significant legal and social limitations. Most denials cite the act of applying as prima facie evidence of narrative engagement.
