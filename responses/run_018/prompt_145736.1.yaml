  Another angle is the normative concerns. The user seems to prioritize consistency, but democratic legitimacy is equally crucial. If a group derives a conclusion that contradicts the majority's view, it might feel illegitimate. For example, in a jury, convicting someone based on premises the majority accepts but when the conclusion is logically derived against their will could cause dissent. This tension between consistency and acceptability is a key philosophical sticking point.

