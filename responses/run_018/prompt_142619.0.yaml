answer: |-
  Your intuition taps into a profound, though not universally formalized, principle in philosophy of science and model selection. While no single canonical term captures *exactly* this idea, it intersects with several established concepts. Here's a breakdown:

  ---

  ### **Key Conceptual Anchors**
  1. **Verisimilitude (Truth-Likeness):**  
     Your core concern—whether residual patterns indicate proximity to truth—aligns with Popper's *verisimilitude*. However, Popper focused on *content* (true/false consequences), not residual structure. Your insight extends this by treating **residual morphology as evidence of architectural correctness**.

  2. **Lakatos' "Anomalies" vs. "Noise":**  
     In Lakatos' methodology of scientific research programmes, "anomalies" (structured residuals) challenge a theory's *hard core*, while random noise may be absorbed by auxiliary hypotheses. Model A's structured errors resemble Lakatosian anomalies suggesting deep flaws, whereas Model B's scatter resembles "tolerable noise."

  3. **Peircean Abduction & Inference to Best Explanation (IBE):**  
     The preference for Model B reflects abductive reasoning: random residuals are better explained by *incompleteness* (missing minor factors), while structured residuals suggest *fundamental misrepresentation*. IBE prioritizes explanations that minimize "unexplained explainers"—here, the auxiliary variable's correlation.

  4. **Specification Error (Econometrics):**  
     In econometrics, **omitted-variable bias** manifests as residuals correlated with excluded variables. Model A exhibits this, implying misspecification. Model B’s homoscedastic, uncorrelated errors suggest no *obvious* missing variables, even if fit is weaker.

  ---

  ### **Why No Single Label?**
  - **Statistical Dominance:** Model selection (AIC/BIC) prioritizes predictive accuracy/parsimony, not residual "purity." Philosophers (e.g., Forster, Sober) debate whether such criteria track truth.
  - **Underdetermination Challenge:** Both models fit data equally well centrally, so residual structure becomes a tiebreaker. But this relies on a metaphysical claim: *true theories fail randomly*.
  - **Aesthetic Risk:** Critics (e.g., van Fraassen) might argue privileging "clean" residuals reflects an instrumentalist preference for *tractable models* over truth-tracking.

  ---

  ### **Mapping the Intuition: Core Arguments**
  1. **The *Signature Failure* Principle:**  
     A model with approximately correct architecture fails due to *unmodeled contingencies* (noise). Incorrect architectures fail with *diagnostic patterns* (e.g., residuals tracking an auxiliary variable). This parallels:
     - **Cartwright's "Simulacrum Account":** Models often work locally by "mimicking" phenomena without capturing true causes. Structured residuals reveal the "mimicry."
     - **Wimsatt's Robustness:** If multiple independent models agree *and* scatter residuals randomly, truth-likeness is likelier. Model A’s structured residuals indicate fragility to an untested dimension.

  2. **The *Mechanism of Error* Criterion:**  
     Random errors suggest *measurement limitations*; non-random errors suggest *structural falsehood*. This echoes:
     - **Mayo's Severe Testing:** A model surviving tests in varied contexts (including against auxiliary variables) is better corroborated. Model A fails severely when residuals correlate with an ignored variable.
     - **Peirce's "Doubt" vs. "Surprise":** Structured residuals create genuine surprise (demanding explanation); random scatter only provokes doubt about precision.

  ---

  ### **Where It Risks Collapsing into Aesthetics**
  1. **The "Clean Failure" Bias:**  
     Preferring Model B could conflate *familiar* error structures (white noise) with *truth*. Complex systems may exhibit structured chaos misidentified as "noise." Conversely, "clean" residuals may stem from overfitting.
     
  2. **Ignoring Contextual Relevance:**  
     If the auxiliary variable *is* causally irrelevant, Model A’s residual correlation may be spurious. Rejecting it then becomes dogmatic.

  3. **No Free Lunch for Truth:**  
     Random residuals don’t guarantee truth-likeness—they may arise from compensatory errors (e.g., two wrong assumptions canceling out). Model B could be entirely false but fortuitously scattered.

  ---

  ### **Synthesis: A Framework for "Diagnostic Residuals"**
  Your approach is best framed as a hybrid of:
  - **Lakatosian anomaly detection** (structured residuals as "problems" for the core theory),
  - **Specification testing** (residual patterns as evidence of missing variables),  
  - **Abductive inference** (random errors as "less surprising" failures).

  **Proposed Terminology:**  
  - **Architectural Verisimilitude:** Residual randomness as a marker of structural correctness.  
  - **Residual Pathognomonicity:** Structured errors as "diagnostic signatures" of theoretical flaws (borrowing "pathognomonic" from medicine: a sign characteristic of a disease).

  ---

  ### **Key References**
  1. **Popper** (*Conjectures and Refutations*) – Verisimilitude.  
  2. **Lakatos** (*Proofs and Refutations*) – Anomalies vs. noise.  
  3. **Mayo** (*Error and the Growth of Experimental Knowledge*) – Severe testing.  
  4. **Cartwright** (*How the Laws of Physics Lie*) – Models as simulacra.  
  5. **White & Lu** (2010, *Econometrica*) – Testing for omitted variables via residual patterns.

  Your intuition is philosophically defensible but requires contextual rigor: residual structure *should* trigger investigation into whether the auxiliary variable is causally relevant. If it is, Model A is flawed; if not, Model B’s "clean" failure may be aesthetic. This elevates residual morphology from a technical artifact to a heuristic for theoretical diagnosis.
