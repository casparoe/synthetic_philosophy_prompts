  Hi -- I'm prepping a lecture on conscousness and got myself tangled with the colour phi phenomonen. From what I recall, an Orwellian revision is where the brain literally goes back and rewrites the earlier neural trace of the first red flash once the green one arrives, so your conscious experience of that first dot gets retroactivly altered. That sounds like backward causation inside awareness itself -- the second stimulus causally changing the content of an earlier moment. Stalinesque revision, by contrast, just invents the intermediate green flash whole cloth without touching the past record. So doesnt the Orwellian model commit us to physical impossibility, or is there a non-physicalist loophole I'm missing? Am I misunderstanding what revision means here? Answer in British English please -- and dont send me a reading list, I just need the conceptual knot untied.
