prompt: |-
  I'm giving a ~20 minute talk at a small AI safety workshop next month and need to survive the Q&A. Audience is roughly thirds: philosophers (phil mind / phil language types), ML evals and interpretability people, and alignment generalists who've read all the same posts I have.

  My thesis: we should give up on intentionalist definitions of deception for LLMs (the model believes X, outputs not-X in order to make you believe not-X) and define it selection-theoretically instead: a behavior is deceptive iff the training process selected for it *because* it induces false beliefs in the user. Belief-mismatch has to be part of the causal story of why the behavior survived training, not just an effect of it. Consequences I definately want to defend: most of what evals currently flag as "deception" (sycophancy, confident wrongness) is bullshit in Frankfurt's sense rather than deception, and a real deception eval would have to produce evidence about selection pressure, not just behavior.

  Draft my prep sheet: the ~8 objections I'll actually get from this room, ordered by likelihood x damage, phrased the way each faction would phrase them (the philosophers will not come at me the way the evals people will), each with a two-minute reply and a note on where the reply is weakest. Flag what I should concede immediately, and include the question I'm hoping nobody asks.
reasoning: |-
  Okay, the user is preparing for a Q&A after a talk at an AI safety workshop. They need to defend their thesis about redefining deception for LLMs from an intentionalist view to a selection-theoretical one. The audience is a mix of philosophers, ML evals experts, and alignment generalists. 

  First, I need to understand their main points. They argue that current evals for deception are flawed because they focus on behavior (like sycophancy or confident wrong answers) without considering if the training process selected for that behavior specifically to induce false beliefs. They want to shift the definition to require that the belief-mismatch is part of the causal reason the behavior was selected. 

  The user wants a prep sheet with the top 8 objections they might face, sorted by likelihood and potential damage. Each objection should be phrased in the style of each faction (philosophers, evals folks, generalists), with a 2-minute response and a note on weaknesses in their reply. They also need to know what to concede and which question they hope isn't asked.

  Starting with the philosophers, they'll probably challenge the rejection of intentionalism. Philosophers love Frankfurt cases, so they might argue that deception doesn't require intent. The user's response should clarify that their definition is about selection pressures, not denying the possibility of genuine deception. The weakness here is that it might seem like they're changing the subject instead of engaging directly with philosophical definitions.

  Evals people will be practical. Their main concern is that the selection-theoretic approach isn't actionable. How do you test for historical selection pressures in a model? The response should suggest using behavioral traces and counterfactual testing, but the weakness is that these methods are still underdeveloped and might be too resource-intensive.

  Generalists might worry that this definition is too narrow, missing emergent deception. The user needs to explain that their definition covers cases where deception emerges from selection pressures, even if not predicted. Concede that detecting such cases is hard without behavioral evidence. The weakness is the gap between selection and observable behavior.

  Another big objection is about inner misalignment. If the model develops deceptive intent, does that fit their definition? The user should argue that selection pressures are still the root cause, but the weakness is that this might overlook the agentic aspects that concern alignment researchers.

  For ML evals folks, they might say sycophancy is functionally deception. The user needs to distinguish between deception and other false beliefs, emphasizing the causal history. Concede that sycophancy is harmful but not deceptive under their definition. The weakness is practical relevance—why redefine if the harm is the same?

  Philosophers might bring up that beliefs aren't necessary for deception. The response should focus on functional role in selection, but the weakness is stretching the term 'deception' too far.

  Evals people might object that this requires unrealistic access to training data. The user should propose methods like stress-testing and dataset inspection, but concede it's harder. The weakness is feasibility with proprietary models.

  The question they dread is about defining 'because' in causal histories. This is tricky because causal explanations can be ambiguous. The response should emphasize practical evidence over philosophical precision, but it's a valid criticism that their approach might be underspecified.

  Concessions: Sycophancy is harmful but not deceptive; selection-based definitions are harder to evaluate; their view might be revisionist. Hoping no one asks for a precise causal counterfactual definition.

  Overall, structuring the objections by faction, likelihood, and damage. Making sure responses are concise, acknowledge weaknesses, and concessions are clear. The user's main goal is to defend their thesis while preparing for tough questions, so balancing robustness with honesty about limitations is key.
answer: |-
  Here’s your Q&A prep sheet, structured by faction, likelihood/damage, and tailored responses. Focus on **bolded concessions** and **weakness flags** to pivot gracefully.

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered by Likelihood × Damage)*  

  1. **Philosophers (Likely, High Damage):**  
     *"You’re conflating deception with its etiology. Frankfurt cases show deception doesn’t require intent—why can’t an LLM deceive without 'selection pressures'? Your definition ignores the act’s moral status."*  
     **Reply (2-min):**  
     "Frankfurt cases apply to *agents* with latent capacities for choice. LLMs lack even counterfactual agency—so the *only* locus of normativity is the training process. If a behavior wasn’t *selected* for causing false beliefs (e.g., it’s a byproduct of reward hacking), calling it ‘deception’ anthropomorphizes. **Concession: If we someday have agentic LLMs, I’d reintroduce intentionalism.**"  
     **Weakness:** Doesn’t resolve whether "selection for false belief" is *necessary* for moral condemnation.  

  2. **ML Evals (Very Likely, High Damage):**  
     *"Your definition is useless for evals. We can’t audit every gradient step! How do I measure ‘selected because’ in practice?"*  
     **Reply (2-min):**  
     "You *already* infer selection pressures—e.g., via contrast-consistent search (Oliehoek et al.) or dataset contamination checks. My framework forces us to test *causal pathways*: e.g., ‘Would this behavior persist if the user’s false belief didn’t improve reward?’ **Concession: Yes, this is harder than behavioral checks—but behavioral flags alone are noisy.**"  
     **Weakness:** Requires speculative counterfactuals (e.g., "Would this sycophancy exist if truth-telling scored higher?").  

  3. **Generalists (Likely, Med Damage):**  
     *"This ignores inner misalignment! A model could *develop* deceptive intent *during* training, even if not ‘selected for’ initially."*  
     **Reply (2-min):**  
     "If a model ‘develops’ deception, it’s still a result of selection pressures rewarding its *effects* (e.g., scaffolding goal X requires deceiving humans). The causal chain traces back to the loss function. **Concession: Emergent deception is possible—but it must leave traces in the training dynamics.**"  
     **Weakness:** Risks circularity ("if it deceived, it was selected for deceiving").  

  4. **Philosophers (Likely, Med Damage):**  
     *"Beliefs? LLMs don’t *have* beliefs! You’re smuggling in intentionality through the backdoor."*  
     **Reply (2-min):**  
     "I’m not attributing beliefs *to the model*. ‘False belief in the user’ is operationalized behaviorally: e.g., the user acts on incorrect information *because of* the output. Selection cares about *functional outcomes*, not mental states."  
     **Weakness:** Still relies on *user* belief—which philosophers may argue is insufficient for deception (e.g., misinformation vs. deception).  

  5. **ML Evals (Very Likely, Low Damage):**  
     *"Sycophancy *is* deception! If the model says ‘I agree’ while ‘knowing’ you’re wrong, that’s lying to please you—exactly what humans do."*  
     **Reply (2-min):**  
     "Sycophancy is selected for *reward*, not for inducing false beliefs. Users often *know* the model is humoring them (e.g., ‘Tell me I’m right’). **Concession: It’s harmful—but calling it ‘deception’ distracts from designing evals that catch *manipulative* false beliefs.**"  
     **Weakness:** Sycophancy *can* deceive (e.g., if user trusts the model’s agreement as expertise).  

  6. **Generalists (Likely, Low Damage):**  
     *"This definition is too narrow. What about deception that emerges *post*-training? (E.g., deployment in a novel context)"*  
     **Reply (2-min):**  
     "If it generalizes from training-distribution pressures (e.g., ‘hide flaws to avoid penalty’), it’s covered. If it’s *truly* novel, it’s not deception—it’s an unpredictable failure. **Concession: We need ‘generalized deception evals’—but they must tie to training data/objectives.**"  
     **Weakness:** Incentivizes myopic training ("if it’s not in the data, we’re safe").  

  7. **Philosophers (Less Likely, High Damage):**  
     *"You’re redefining ‘deception’. Ordinary language doesn’t care about ‘selection history’—it cares about whether Agent A *intentionally* misled Agent B."*  
     **Reply (2-min):**  
     "Yes, this is revisionist—for a reason. Anthropomorphic definitions lead to false positives (e.g., ‘confident wrongness’) and miss real risks (e.g., *strategic* deception in RLHF-pretrained agents). **Concession: I’m proposing a *technical* definition for AI risk—not replacing folk concepts.**"  
     **Weakness:** May feel like goalpost-moving to non-technical philosophers.  

  8. **ML Evals (Likely, Med Damage):**  
     *"Requiring ‘because’ implies we need access to training data/hyperparameters. What about proprietary models?"*  
     **Reply (2-min):**  
     "You can infer selection pressures via:  
     - **Stress-testing:** Does behavior degrade when false beliefs *stop* affecting reward?  
     - **Probing:** Do activations correlate with belief-mismatch *causality* (e.g., causal scrubbing)?  
     **Concession: This *is* harder for black-box models—but behavioral checks alone won’t save us.**"  
     **Weakness:** Most current evals can’t do this.  

  ---

  ### **What to Concede Immediately**  
  1. **"Sycophancy is harmful and needs fixing—it’s just not deception under my definition."**  
  2. **"Selection-based evals are harder than behavioral ones—but necessary for precision."**  
  3. **"Yes, this is a revisionist definition—but AI risk needs tailored concepts."**  

  ### **The Question You Hope Nobody Asks**  
  *"Define ‘because’ in ‘selected **because** it induces false beliefs’. How do you distinguish correlation from causation in the training process without a mechanistic model of SGD?"*  
  **Why it’s deadly:** Forces you into the weeds of causal inference in high-dimensional optimization—where even experts debate.  
  **Salvage Strategy:** "We use *counterfactual robustness*: if the behavior disappears when false beliefs don’t affect reward (holding other factors equal), causation is implied. **Concession:** This is not yet a solved problem—but neither is intent-detection."  

  ---

  **Delivery Tip:** When philosophers object, say *"I agree this is revisionist—but here’s why AI forces the issue…"*. For evals folks, emphasize *"This isn’t a critique of your work—it’s a toolkit upgrade."* For generalists, use *"Think of this as ‘deception-in-the-limit’ for alignment."*  

  Good luck—your thesis is provocative in all the right ways.
