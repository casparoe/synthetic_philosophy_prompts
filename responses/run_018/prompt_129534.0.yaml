answer: |-
  This is a sharp question cutting through law, philosophy, and social policy. The distinction you're seeing rests on **duty**, not fundamentally on metaphysics or a uniform theory of causation. Here's a breakdown of the legal reasoning and its philosophical underpinnings:

  ### 1. The Core Distinction: Duty, Not Causation Primarily
     * **Landlord:** A pre-existing **legal duty** arises from the **contractual relationship** (lease) and **housing regulations**. The landlord voluntarily entered this relationship, accepting obligations like providing habitable conditions (warranty of habitability). Their *omission* (failure to fix the heater) breaches this duty. **Causation** (the illness resulting from the cold) *links the breach of duty to the harm*. The omission is legally significant *because* of the duty.
     * **Passerby:** Generally, no pre-existing **legal duty** exists toward a stranger. The common law principle is "**no duty to rescue**." Walking past is an omission, but without a prior duty, the law doesn't consider it a legally relevant cause of harm, even if morally troubling. The cause of the harm is attributed to the underlying situation (homelessness, weather), not the passerby's inaction.

  ### 2. Theories of Causation by Omission & Legal Practice
  The law doesn't adopt a single, pure metaphysical theory of causation by omission. Instead, it employs a **pragmatic, duty-filtered approach**:
     * **"But-for" Causation + Duty:** The law *does* use "but-for" causation for omissions *when a duty exists*. "But for the landlord's failure to fix the heater, would the tenant have gotten sick?" If yes, causation is established *because the duty makes the omission relevant*. For the passerby, "but-for" isn't applied *legally* because there's no duty to trigger the inquiry. Metaphysically, "but for the passerby not helping, would the person have frozen?" might be true, but the law ignores it due to the lack of duty.
     * **Dependent on Duty, Not Inherently Causal:** The law treats omissions as potentially causal **only when coupled with a recognized duty**. The omission itself isn't seen as a "cause" in the same way a physical action is *until* a duty is breached. This avoids an impossibly broad scope of liability.
     * **Negative Causation's Weirdness:** Your teacher is right. Pure "negative causation" (causation by absence/non-occurrence) is philosophically thorny. If *every* non-action that *could* have prevented harm is a "cause," causation becomes limitless (e.g., "The President didn't build enough shelters, therefore caused this death"). The law avoids this metaphysical quagmire by **limiting relevant omissions to those violating specific duties**. It's a practical solution, not a metaphysical claim that omissions aren't "real" causes in *some* abstract sense.

  ### 3. Philosophical Commitments of This Legal Practice
     * **Libertarianism/Individual Autonomy:** Prioritizes individual freedom from imposed positive duties (you aren't forced to act). The baseline is "no duty."
     * **Reliance and Voluntary Assumption of Risk:** Focuses on obligations arising from **voluntary relationships** (contracts, professions, familial ties) where others rely on you. The landlord *chose* to be a landlord.
     * **Moral Luck Avoidance (Pragmatically):** Avoids holding people responsible for an infinite number of harms they *could* have prevented but had no specific obligation to address.
     * **Manageability and Fair Notice:** Creates a system where potential defendants can reasonably foresee their legal obligations (duties arise from relationships or statutes, not vague moral imperatives). Plaintiffs know whom they can sue.
     * **Distributive Justice (Contentiously):** Implicitly assigns responsibility for broad social problems (like homelessness) to society/government, not random individuals.

  ### 4. Is it Consistent?
     * **Internally Consistent:** Yes, based on the core principle of **duty as the gatekeeper for omission liability**. The rules are applied predictably: look for a recognized duty first, *then* assess causation/breach/damages.
     * **Morally Consistent?** This is the crux of your argument with your friend. The law prioritizes **negative liberty** (freedom *from* interference/obligation) over **positive duties** (duties *to* act for others' benefit), except in specific, defined relationships. Many find this morally inconsistent, arguing that basic human need (avoiding freezing) should create a minimal duty. The law generally disagrees, seeing positive duties as overly burdensome and better handled by social services than tort law.

  ### 5. What Would Change if Omissions = Actions?
  Treating *all* potentially harmful omissions as legally equivalent to harmful actions would be revolutionary and chaotic:
     * **Explosion of Liability:** Anyone who *could* have prevented *any* harm (e.g., didn't donate a kidney, didn't stop a fight they saw starting, didn't warn someone of a slippery sidewalk they noticed) could be sued. The legal system would collapse.
     * **Loss of Autonomy:** Individuals would be constantly legally obligated to act to prevent potential harms to strangers, drastically curtailing personal freedom.
     * **Proof Problems:** Establishing causation for pure omissions (what *would* have happened if you acted?) is often highly speculative compared to proving a physical action caused harm.
     * **Chilling Effects:** People might avoid public spaces for fear of incurring duties, or engage in risky "rescues" to avoid liability for inaction.
     * **Shift to Positive Rights:** It would imply a legal system based on positive rights to assistance, fundamentally altering the liberal legal tradition.

  ### The "Middle Ground" & Exceptions
  * **Good Samaritan Laws:** Some jurisdictions *modify* the "no duty" rule by offering liability protection to those who *voluntarily* attempt rescue, encouraging help without imposing a duty.
  * **Special Relationships:** Duties *can* exist beyond contracts (e.g., parents to children, innkeepers to guests, someone who *starts* a rescue).
  * **Statutory Duties:** Legislatures *can* create positive duties (e.g., mandatory reporting by teachers/docs of abuse, some countries have limited "duty to rescue" statutes often requiring only calling for help).
  * **"Creation of Risk" Doctrine:** If you *put* someone in peril (even innocently), a duty to assist may arise.

  ### In Conclusion
  The difference isn't fundamentally about metaphysics (whether omissions *are* causes), but about **legal policy** and **duty**. The law uses the concept of **duty** to filter which omissions are legally relevant "causes" for liability. It prioritizes freedom from imposed positive obligations and relies on specific relationships or statutes to define when inaction is culpable. While philosophically debatable (as your argument shows), this system aims for manageability, predictability, and a balance between individual autonomy and societal responsibility that avoids overwhelming liability. Changing it would require a radical shift towards recognizing positive legal duties owed universally, not just based on specific relationships.
