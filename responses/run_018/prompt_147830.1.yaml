  The artwork degraded completely by 2019 due to its chemically unstable pigments. In 2022, the Foundation commissioned a "procedural regeneration" using Kessler's published parametric rules, embedding original substrate fragments in a new synthetic matrix. The donor's heirs argue this is a reproduction, not the original, and want the bequest reverted.

