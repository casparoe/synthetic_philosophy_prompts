answer: |-
  Here’s a battle-tested teaching plan designed to build understanding incrementally while defusing predictable misconceptions. Sequence is critical to prevent derailment.

  **Core Concept:** Monuments function as **present-tense public endorsement**, not neutral historical archives. Removal/renaming updates the community's *current* moral vocabulary.

  **Time Allocation:**  
  - Hook & Misconception #1 Defusal (5 min)  
  - Archive vs. Endorsement Distinction (10 min)  
  - The Carrying Example + Misconception #2 Defusal (12 min)  
  - Removal as Update (Not Erasure) + Misconception #3 Defusal (5 min)  
  - Check Question & Wrap-up (3 min)  

  ---

  ### 1. **Hook & Defuse Misconception #3: "Monuments are just art/history lessons"** (5 min)  
     - **Start with:** "Imagine you walk into City Hall and see a giant, beautiful statue right in the lobby. Who gets that spot? What does that choice *communicate* to visitors and citizens?"  
     - **Key Move:** Elicit student responses (symbol of pride, values, authority). **Emphasize:** Public space is *curated* — placement implies honor/endorsement. Contrast with a museum display (context matters!).  
     - **Defuse #3 Explicitly:** "If monuments were *just* history lessons, we’d put up villains next to heroes for contrast. We don’t. Why?" → Establish they’re inherently *valorizing*.  

  ### 2. **Build the Archive vs. Endorsement Distinction** (10 min)  
     - **Define Terms:**  
       - *Archive Function:* Recording facts (e.g., textbooks, museums, plaques *with critical context*).  
       - *Endorsement Function:* Holding someone up as *exemplary* (e.g., statues in parks, names on streets, front-and-center memorials).  
     - **Contrast:** Ask: "Does a statue of Gandhi *in a public square* teach history, or ask you to *admire* Gandhi? Does a Holocaust memorial *record* history, or *condemn* Nazi ideology?"  
     - **Dependency Note:** **This MUST come before discussing removal.** Without this distinction, students default to "erasure" arguments.  

  ### 3. **The Carrying Example + Defuse Misconception #2: "Rewriting the past"** (12 min)  
     - **Present the Example:**  
       > *"A mid-sized city has 'Harrison Blythe Boulevard' — named in 1920 after a wealthy industrialist. Blythe funded the city's first hospital (saving lives) but also ran factories with brutal child labor practices. The city is debating renaming it 'Unity Boulevard.'"*  
     - **Why this works:**  
       - Ambiguous figure (not purely evil = avoids culture-war reflexes).  
       - Concrete but unfamiliar (not local = less emotional investment).  
       - **Splits Archive/Endorsement:** His *existence* is archived (hospital records, labor history). The *boulevard name* endorses him *as a civic hero*.  
     - **Discussion Qs:**  
       - "What values does keeping the name endorse *today*?" (Philanthropy? Wealth? Overlooking exploitation?)  
       - "Does renaming *erase* Blythe’s history, or stop *honoring* him?"  
     - **Defuse #2 Explicitly:** "Renaming isn’t *denying* Blythe existed or his mixed legacy. It’s deciding he’s not who we want to *celebrate* in 2024. We’re updating the endorsement, not burning history books."  

  ### 4. **Introduce Removal/Renaming as "Updating Moral Vocabulary" + Defuse Misconception #1: "We’ll forget history!"** (5 min)  
     - **Frame Removal:** "If monuments endorse current values, removing/renaming is like a community saying: *'This no longer speaks for who we aspire to be.'*"  
     - **Defuse #1 Explicitly:** "Does removing a Confederate statue *erase* slavery? No — that history lives in archives, museums, documentaries. The statue wasn’t *teaching* slavery; it *honored* the Confederacy. Removing it stops the endorsement, not the education."  
     - **Analogy:** "Taking a disgraced CEO’s portrait off the boardroom wall isn’t ‘erasing’ the company’s history. It’s saying they’re not our model *now*."  

  ### 5. **Check Question & Wrap-up** (3 min)  
     - **Check Question:**  
       > *"If a city moves a controversial statue from the town square to a museum exhibit about complex historical legacies, does it still 'endorse' the figure? Why or why not?"*  
       - **Why it works:** Tests grasp of *context* defining endorsement. Correct answer: Museum contextualization shifts it from endorsement to archive/education.  
     - **Summarize:** "Monuments speak in the *present tense*. Debating them is how communities decide whose values get amplified in public space — and that conversation *is* public ethics."  

  ---

  ### **What to FLAT-OUT REFUSE to Explain (Stay Firm!)**  
  1.  **Speech-act theory** (e.g., "illocutionary force"). Stick to plain language: "what the monument *does*."  
  2.  **Metaphysics of collective identity** ("What *is* 'society'?"). Focus on observable civic functions.  
  3.  **"Original intent" debates.** Irrelevant — discuss *current* reception and impact.  
  4.  **Direct comparisons to "cancel culture."** Shut down with: "We’re analyzing *monument function*, not media buzzwords. Let’s use our terms: endorsement vs. archive."  

  ---

  **Why this sequence works:**  
  - **Misconceptions are preempted** at the point they’d naturally arise (#3 first, #1 during removal talk).  
  - **The example’s ambiguity forces nuance** — students can’t just pick "good/bad" sides.  
  - **"Endorsement" is anchored BEFORE removal**, making "updating vocabulary" feel logical, not reactive.  
  - **The check question** isolates comprehension of context=endorsement.  

  Stick to this scaffolding, deflect off-topic culture-war tangents, and you’ll leave them understanding the core framework. Good luck!
