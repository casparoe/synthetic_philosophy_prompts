answer: |-
  ### Joint Statement on Mathematical Explanation in Science

  **Preamble**  
  We, a committed mathematical platonist and a committed nominalist, engaged in a good-faith adversarial collaboration to address the question: *When empirical explanations in science or ordinary life make essential use of mathematics (e.g., an optimality theorem, arithmetic property, or topological constraint), does that use give us reason to believe the mathematical objects involved exist, or can the explanatory work be fully recovered by a non-committal paraphrase?* We focused on three structurally agreed-upon examples:  
  1. **Graph-theoretic impossibility**: Explaining why a task (e.g., network routing) cannot be completed due to a graph's non-planarity.  
  2. **Geometry-based minimization**: Explaining a physical structure's shape (e.g., a soap film) via minimization of surface area.  
  3. **Arithmetic property**: Explaining a regularity (e.g., biological periodicity) using primality.  
  We adopted the **role-preservation condition** (RPC): any nominalist paraphrase must preserve not only truth values but also the *explanatory and inferential role* of the mathematics. Below, we outline agreements, disagreements, and cruxes.  

  ---

  ### Part 1: Agreed Claims  
  Both parties endorse the following:  

  1. **Scientific Practice**  
     - In our examples, mathematics is indispensably used in scientific explanations:  
       - Graph-theoretic properties (e.g., non-planarity of \(K_{3,3}\)) explain why certain tasks (e.g., connecting utilities without crossovers) are impossible.  
       - Geometric minimization (e.g., minimal surface solutions) explains physical structures (e.g., soap films forming minimal surfaces).  
       - Arithmetic properties (e.g., primality) explain regularities (e.g., cicadas evolving prime-numbered life cycles to avoid predator synchrony).  
     - These explanations are empirically successful and accepted in scientific practice.  

  2. **Role-Preservation Condition (RPC)**  
     - RPC is an agreed methodological constraint. A successful nominalist paraphrase must:  
       - Preserve the truth values of empirical claims.  
       - Replicate the *explanatory role*: It must support the same counterfactuals, unify phenomena, and provide equivalent understanding.  
       - Maintain the *inferential role*: It must license the same predictions, interventions, and reasoning patterns as the original mathematical explanation.  
     - RPC rules out reconstructions that are merely truth-preserving but explanatorily impoverished (e.g., disjunctive lists of physical facts).  

  3. **Off-the-Table Positions**  
     - **Eliminative nominalism**: Denies the truth of mathematical explanations (e.g., "Graph non-planarity is false"). Rejected as incompatible with scientific success.  
     - **Fictionalism**: Treats mathematics as useful fiction. Rejected as violating RPC by failing to preserve explanatory grounding.  
     - **Mysterian platonism**: Asserts mathematical objects exist but are causally inert and inexplicably connected to physics. Rejected as ad hoc.  
     - **Full-blooded platonism**: Claims all consistent mathematical objects exist. Rejected as irrelevant to the indispensability debate.  

  4. **Settling the Dispute**  
     - For nominalism to prevail, it must provide paraphrases for all three examples that satisfy RPC without ontological commitment to abstracta.  
     - For platonism to prevail, it must show no such paraphrase is possible (or that all attempts violate RPC).  
     - The dispute is empirical and revisable: new scientific cases or reconstructions could alter the balance.  

  ---

  ### Part 2: Disagreements  
  The table below summarizes unresolved disputes. "Substantive" disagreements reflect divergent ontological commitments; "verbal" disagreements stem from equivocal terminology.  

  | Neutral Question | Platonist View | Nominalist View | Judgment of Disagreement |
  |------------------|----------------|-----------------|--------------------------|
  | **Does indispensable mathematical explanation require commitment to abstract objects?** | "Indispensable mathematical explanations (e.g., graph non-planarity in routing tasks) succeed only if mathematical objects (e.g., graphs) exist mind-independently." | "Indispensability is pragmatic; mathematics is a representational tool. Paraphrases (e.g., in physical or modal terms) can recover all explanatory work without abstracta." | **Substantive**: Concerns whether abstracta are necessary for explanation. |
  | **Do mathematical properties (e.g., primality) explain physical regularities directly?** | "Mathematical properties themselves are explanatory. Primality explains cicada evolution because prime numbers (as abstract objects) minimize overlaps in cyclic systems." | "Only physical structures (e.g., cyclical coincidences) explain. Primality is a representational gloss on patterns in concrete systems, recoverable via paraphrase (e.g., 'avoiding divisor coincidences')." | **Substantive**: Turns on whether explanation requires ontic grounding in abstracta. |
  | **Can RPC-compliant paraphrases capture the generality of mathematical explanations?** | "Mathematical generalizations (e.g., 'All minimal surfaces satisfy \( \Delta \vec{x} = 0 \)') cannot be paraphrased without loss. Physical reconstructions (e.g., energy minimization) lack modal scope (e.g., for non-Euclidean spaces)." | "Generality is preserved through modality or physical laws. Paraphrases (e.g., 'Systems minimize energy in all possible worlds with these constraints') capture the same counterfactuals." | **Verbal (in part)**: Disagreement partly hinges on whether "generality" requires abstract objects or is achievable through concrete modal facts. Core is substantive. |
  | **Is the success of mathematics in science best explained by its truth?** | "The predictive and explanatory success of mathematics (e.g., minimal surfaces in soap films) is best explained by the existence of mathematical objects that constrain physical reality." | "Success is explained by mathematics' efficiency in modeling concrete patterns. No appeal to abstracta is needed; Occam’s razor favors nominalism." | **Substantive**: Relates to abductive reasoning about scientific realism. |

  ---

  ### Part 3: Cruxes  
  Cruxes are sub-questions where a settled answer would force at least one side to concede ground. For each, we specify a concrete case and predictions.  

  1. **Crux: Can graph-theoretic impossibility be paraphrased without abstract graphs?**  
     - **Case**: Explaining why a utility network (3 houses × 3 utilities) cannot be embedded in a plane without crossings, citing the non-planarity of \(K_{3,3}\).  
     - **Platonist Prediction**: Any paraphrase (e.g., in terms of topological constraints on physical lines) will fail RPC by losing explanatory generality (e.g., for non-physical analogs like circuit design) or counterfactual robustness (e.g., "If \(K_{3,3}\) were planar, embedding would be possible").  
     - **Nominalist Prediction**: A modal paraphrase (e.g., "No arrangement of lines satisfies the connectivity without crossings in any 2D space") preserves RPC without abstract graphs.  

  2. **Crux: Can geometric minimization explanations avoid reference to abstract spaces?**  
     - **Case**: Explaining soap-film shapes via minimal surfaces (solutions to \( \Delta \vec{x} = 0 \)).  
     - **Platonist Prediction**: Paraphrases (e.g., "Films minimize tension energy") fail RPC by not explaining why the *mathematical form* recurs across domains (e.g., black hole horizons) or supporting mathematical counterfactuals (e.g., "If minimal surfaces had different properties, films would behave differently").  
     - **Nominalist Prediction**: A reconstruction using physical laws (e.g., energy minimization principles) and concrete geometry preserves all explanatory roles.  

  3. **Crux: Is primality irreducible in biological explanations?**  
     - **Case**: Explaining cicadas’ 13-year life cycle via primality (minimizing synchronization with 2–6 year predators).  
     - **Platonist Prediction**: Paraphrases (e.g., "Cycle lengths avoid matching divisors of predator periods") are disjunctive and non-explanatory; only primality (an abstract property) explains why 13 is optimal.  
     - **Nominalist Prediction**: A divisor-avoidance paraphrase (e.g., "Lengths avoid \(k\)-year overlaps for small \(k\)") captures the explanatory role without numbers.  

  ---

  **Conclusion**  
  This statement reflects our progress. We agree on the role of mathematics in science and the RPC framework but diverge on whether RPC-compliant nominalism is viable. The cruxes offer a path forward: resolving any one could shift the debate.  

  Signed,  
  *The Platonist*  
  *The Nominalist*  
