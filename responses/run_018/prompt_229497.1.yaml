  We are drafting a joint statement after an adversarial collaboration between a mathematical platonist and a nominalist. The question is whether the use of mathematics in empirical explanations gives us reason to believe in the existence of mathematical objects, or if the explanatory work can be done without commitment to abstract objects.

  We have three example types to include:
  1. Graph-theoretic impossibility (e.g., explaining why a task cannot be completed because the graph is non-planar).
  2. Geometry-based minimization (e.g., why a physical structure, like a soap film, takes a minimal surface shape).
  3. Arithmetic property (e.g., primality explaining a biological regularity like the life cycle of cicadas).

  Methodological constraint: the nominalist reconstruction must preserve not just truth values but the explanatory and inferential role (role-preservation condition).

  The document has three parts:

  Part 1: Numbered list of claims both can sign.
  Part 2: Disagreements table (neutral question, each side's view, and whether residual disagreement is substantive or verbal).
  Part 3: Cruxes (sub-questions that would move at least one side, with concrete case and predictions).

  Let's start with Part 1: Agreed Claims.

  We need to cover:
  - What the examples show about scientific practice.
  - What the role-preservation condition requires.
  - Which forms of nominalism and platonism are off the table.
  - What must be true of a reconstruction to settle the dispute.

  Agreed Claims:

  1. **Scientific Practice**: In the examples considered (graph-theoretic impossibility, geometric minimization, arithmetic property), mathematics is used essentially in providing explanations. The explanations are widely accepted in their respective scientific communities and are not currently replaced by non-mathematical explanations in practice.

  2. **Role-Preservation Condition**: Both parties agree that any nominalist reconstruction must not only preserve the truth values of the empirical claims but also the explanatory and inferential role that the mathematics plays in the original explanation. This includes the ability to support the same counterfactuals, to be integrated into the same broader theoretical framework, and to provide the same understanding.

  3. **Off the Table Positions**:
     - Extreme nominalism that denies the truth of mathematical statements in scientific explanations is off the table because it would require rejecting well-established scientific explanations.
     - Extreme platonism that holds that the existence of mathematical objects is necessary for any application of mathematics, without considering the possibility of reconstructions, is also off the table. Both parties agree that the question must be settled by examining the possibility of reconstructions that meet the role-preservation condition.

  4. **Settling the Dispute**: For the dispute to be settled in favor of nominalism, there must be a reconstruction that meets the role-preservation condition and that does not commit to abstract mathematical objects. For platonism to be established, it must be shown that no such reconstruction is possible (or that any attempt fails to preserve the explanatory role).

  Now, Part 2: Disagreements Table.

  We need a table with rows for central disputes. Each row has:
  - A neutral formulation of the question.
  - The platonist's view (as they would state it).
  - The nominalist's view (as they would state it).
  - Judgment on whether the disagreement is substantive or verbal (and if verbal, how).

  Possible Disagreements:

  1. **The Indispensability Argument**:
     - Neutral: Does the indispensable use of mathematics in our best scientific explanations give us reason to believe in the existence of mathematical objects?
     - Platonist: Yes, because the mathematical objects are playing an indispensable explanatory role, and we should be ontologically committed to the entities that are indispensable to our best explanations.
     - Nominalist: No, because the explanatory work can in principle be done without reference to abstract objects by providing a suitable reconstruction that captures the same explanatory role without ontological commitment.
     - Judgment: Substantive.

  2. **The Nature of Explanation**:
     - Neutral: In the examples, is the mathematics itself explanatory, or is it merely representing a non-mathematical structure?
     - Platonist: The mathematics is explanatory because the mathematical facts (e.g., the properties of graphs, the solution to the minimal surface equation, the properties of prime numbers) are what provide the explanation.
     - Nominalist: The mathematics is representing a non-mathematical structure (e.g., physical relations, patterns in the world) and it is that non-mathematical structure that is doing the explanatory work. The mathematics is a useful tool for describing it.
     - Judgment: Substantive.

  3. **The Possibility of Reconstruction**:
     - Neutral: Can a nominalist reconstruction be given for the examples that meets the role-preservation condition?
     - Platonist: No, because the reconstructions proposed either fail to capture the explanatory role (e.g., by being too disjunctive, or by not supporting the same counterfactuals) or they implicitly reintroduce mathematical objects.
     - Nominalist: Yes, at least in principle, and for some cases we can provide such reconstructions (or we can provide a general method that would work).
     - Judgment: Substantive, but with an element of verbal disagreement about what counts as "reconstruction" and "explanatory role". However, the core is substantive because it turns on the feasibility of providing such reconstructions.

  We might also have:

  4. **The Role-Preservation Condition**:
     - Note: In Part 1 we agreed that the role-preservation condition is a constraint. But we might have a disagreement about whether it is a fair constraint or whether it is too demanding.
     - However, we agreed in the claims that it is part of the framework. So we don't list it as a disagreement? The statement says: "The document should state whether this condition is itself part of the agreed framework or is one of the points of contention." We said it was agreed.

  So we have three main disagreements.

  Part 3: Cruxes.

  We need sub-questions that, if settled, would move at least one side. For each, a concrete case and predictions.

  Cruxes:

  1. **Crux 1: Graph-Theoretic Impossibility** 
     - **Question**: Can the explanation of the impossibility of a task (e.g., connecting utilities to houses without crossing lines, using the non-planarity of K_{3,3}) be reconstructed without reference to graphs and their properties, while preserving the explanatory role?
     - **Concrete Case**: The classic utilities problem: why can't three houses each be connected to three utilities without lines crossing? The explanation uses the non-planarity of the complete bipartite graph K_{3,3}.
     - **Platonist Prediction**: Any reconstruction either fails to capture the generality of the explanation (e.g., by being too tied to the specific layout) or fails to support the same counterfactuals (e.g., what if we had four houses and two utilities?).
     - **Nominalist Prediction**: We can provide a reconstruction in terms of physical relations (e.g., topological properties of the plane and the arrangement of connections) that does not refer to abstract graphs and that supports the same counterfactuals.

  2. **Crux 2: Geometric Minimization**
     - **Question**: Can the explanation of why a physical structure (like a soap film) forms a minimal surface be reconstructed without reference to abstract geometric objects (like minimal surfaces in differential geometry)?
     - **Concrete Case**: Soap films form minimal surfaces because they minimize surface tension. The explanation uses the mathematics of minimal surfaces (solutions to the minimal surface equation).
     - **Platonist Prediction**: The explanation relies on the mathematical fact that the minimal surface equation has certain solutions, and any reconstruction that avoids mathematical objects will fail to capture the explanatory generality (e.g., why the same mathematical form appears in different physical contexts) or the counterfactual scenarios (e.g., what if the surface were constrained differently?).
     - **Nominalist Prediction**: The minimization can be explained by physical principles (e.g., the principle of least energy) and the behavior of the soap film can be described without reference to abstract geometric objects. The mathematics is a tool for representing the physical energy landscape.

  3. **Crux 3: Arithmetic Property**
     - **Question**: Can the explanation of a biological regularity using an arithmetic property (like primality) be reconstructed without reference to numbers?
     - **Concrete Case**: The explanation for why cicadas have life-cycles that are prime numbers (e.g., 13 or 17 years) is that it minimizes the frequency of coinciding with predators that have periodic population booms. The explanation uses the properties of prime numbers.
     - **Platonist Prediction**: The explanation relies on the mathematical properties of prime numbers (such as their indivisibility) and any reconstruction that avoids numbers will either fail to capture the why (e.g., why 13 and not 15?) or will be disjunctive and not explanatory.
     - **Nominalist Prediction**: We can reconstruct the explanation in terms of coincidences of cycles and divisibility patterns without invoking abstract numbers. We can use a physical notion of periodicity and the concept of least common multiple without reference to numbers as abstract objects.

  Now, we write the document.

  **Joint Statement on Mathematical Explanation**

  **Part 1: Agreed Claims**

  We, the undersigned platonist and nominalist, after a good-faith adversarial collaboration, agree on the following:

  1. In the scientific examples we have considered—graph-theoretic impossibility, geometric minimization, and arithmetic property explanations—mathematics is used in an essential way to provide explanations that are accepted as successful by the scientific community.

  2. The role-preservation condition is a necessary constraint on any nominalist reconstruction: such a reconstruction must preserve not only the truth values of the empirical claims but also the explanatory and inferential role that the mathematics plays in the original explanation. This includes the ability to support the same counterfactuals, to integrate with the same broader theories, and to provide the same understanding.

  3. We reject extreme forms of nominalism that would require denying the truth of well-established scientific explanations that use mathematics. We also reject extreme forms of platonism that would hold the existence of mathematical objects to be necessary without considering the possibility of reconstructions that meet the role-preservation condition.

  4. The dispute between platonism and nominalism about applied mathematics can be settled by the success or failure of providing reconstructions that meet the role-preservation condition without commitment to abstract objects. A successful reconstruction for all cases would support nominalism; the failure to provide such reconstructions would support platonism.

  **Part 2: Disagreements**

  The following table summarizes the central disputes:

  | Neutral Question | Platonist View | Nominalist View | Judgment of Disagreement |
  |------------------|----------------|-----------------|--------------------------|
  | Does the indispensable use of mathematics in scientific explanations provide reason to believe in the existence of mathematical objects? | Yes. The mathematical objects are indispensable to the explanations, and we should be ontologically committed to indispensable entities in our best explanations. | No. The explanatory work can be recovered by a reconstruction that does not require commitment to abstract objects. | Substantive. |
  | In the examples, is the mathematics itself playing an explanatory role? | Yes. The mathematical facts (e.g., the properties of graphs, minimal surfaces, or prime numbers) are what explain the phenomena. | No. The mathematics is representing non-mathematical structures (e.g., physical relations, patterns) and it is these that explain; the mathematics is a descriptive tool. | Substantive. |
  | Can reconstructions that meet the role-preservation condition be provided for the examples? | No. Reconstructions either fail to preserve the explanatory role (e.g., by lacking generality, not supporting the same counterfactuals) or implicitly rely on mathematical objects. | Yes. Reconstructions that capture the explanatory role without commitment to abstract objects are possible (in principle, and in some cases we can provide them). | Substantive, with a verbal element about the exact requirements of role-preservation, but primarily substantive. |

  **Part 3: Cruxes**

  The following cruxes are sub-questions that, if settled, would move at least one side:

  1. **Graph-Theoretic Impossibility Crux**
     - **Question**: Can the explanation of the impossibility of a task (e.g., the utilities problem) via graph non-planarity be reconstructed without reference to abstract graphs while preserving the explanatory role?
     - **Concrete Case**: The explanation that three houses cannot each be connected to three utilities without crossing lines, because the complete bipartite graph K_{3,3} is non-planar.
     - **Platonist Prediction**: Any reconstruction will fail to capture the generality or the counterfactual scenarios (e.g., for different numbers of houses and utilities) that the graph-theoretic explanation handles naturally.
     - **Nominalist Prediction**: A reconstruction in terms of physical relations (topological constraints of the plane and the connections) can be given that preserves the explanatory role without reference to abstract graphs.

  2. **Geometric Minimization Crux**
     - **Question**: Can the explanation of why a physical structure (e.g., a soap film) forms a minimal surface be reconstructed without reference to abstract geometric objects?
     - **Concrete Case**: The explanation of soap films forming minimal surfaces by minimizing surface tension, using the mathematics of minimal surfaces (solutions to the minimal surface equation).
     - **Platonist Prediction**: Reconstructions will fail to capture the explanatory generality (why the same mathematical form appears in different contexts) and the counterfactual scenarios (e.g., with different boundary conditions) without invoking the mathematical objects.
