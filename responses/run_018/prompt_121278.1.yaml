          In the pure-strategy world, no strategy is strictly dominated ( initially for Dr. A, and also for Dr. B if we assume no dominated strategies for Dr. B), 
          so every strategy is rationalizable.

     - Full (mixed-strategy) rationalizability: 
          Here, we allow mixed strategies and domination by mixed strategies.
          In this case, M for Dr. A is strictly dominated by a mixed strategy, so it is not rationalizable.
          Therefore, Dr. A will not play M. 
          Then in the reduced game, the strategies for Dr. A are H and L, and for Dr. B, all strategies might be rationalizable (depending on beliefs).

     The disadvantage to the first member (Dr. A) is that in the mixed-strategy rationalizability, she is forced to abandon M, which is a safe option (always 3), 
     and must choose between H and L, which are risky: in some cases 0 or 8. This might be a disadvantage in terms of risk.

     This is not an artifact of elimination ordering because the mixed strategy domination of M is independent of the order: 
          M is strictly dominated by the mixed strategy that plays H and L with 1/2,1/2, and this domination holds for every pure strategy of the opponent. 
          Therefore, it is never a best response to any belief about Dr. B's actions ( that assigns positive probability to any of A, V, C), because for any such belief, 
          the mixed strategy yields at least 4 in expectation, while M yields 3.

   (5) explain how removing the probabilistic veto feature collapses the divergence back into a standard pure-strategy case, and how a defender of pure-strategy rationalizability could argue that the broader concept imports an unrealistic degree of strategic randomization into committee deliberation.

     - If we remove the probabilistic veto feature, then the outcome of a veto attempt is deterministic. This would change the expected payoffs in the matrix. 
       For example, if the veto attempt is always successful, then the payoff for (H, V) would be 0 for sure, and for (M, V) would be 0 for sure, and for (L, V) would be 0 for sure.
       Then the matrix might change and the mixed strategy might not dominate anymore.

       In our example, the probabilistic veto is embedded in the payoffs ( we have already used the expected payoffs for the veto action). 
       If the veto becomes deterministic, then we would have different payoffs. 
          - If veto is always successful, then for any proposal, if Dr. B chooses V, the outcome is 0 for Dr. A.
          - So the matrix becomes:

                 A    V    C
             H:  8    0    0
             M:  3    0    3   [ because for (M,C): we said it is 3]
             L:  0    0    8   [ because (L,C) becomes 8]

          Then domination for M by the mixed strategy of H and L with 1/2:
               against A: 0.5*8 + 0.5*0 = 4 > 3? -> yes.
               against V: 0.5*0 + 0.5*0 = 0 > 0? -> no, it's equal.
               against C: 0.5*0 + 0.5*8 = 4 > 3? -> yes.

          So against V, it is not strictly greater. Therefore, the mixed strategy does not strictly dominate M.

          In fact, in this case, M might not be dominated because in column V, it yields 0, which is the same as the mixed strategy.

          Also, in pure strategies, M is not dominated because in column A, it is not beaten by L (3>0), in column V, it is not beaten by H or L (0 is the same as 0), in column C, it is not beaten by H (3>0).

          So the divergence disappears.

     - A defender of pure-strategy rationalizability might argue that in a committee setting, it is unrealistic to assume that players will randomize over their actions with precise probabilities. 
       The mixed strategy that Dr. A would need to use to dominate M (50%-50% in our example) requires a deliberate randomization device. 
       In the context of a committee, members may not be able to or may not want to use such a device. 
       They may instead choose a definite proposal. 
       Therefore, the safe option M might be chosen in practice even though it is not rationalizable under mixed strategies.

       Additionally, the mixed strategy rationalizability assumes that players are not only capable of randomizing but also that they believe others can randomize. 
       In a committee, decisions are made after deliberation and are typically pure. 

   Therefore, in the deterministic veto case, the mixed strategy does not dominate M, and in the probabilistic case, the mixed strategy rationalizability might be seen as 
    importing an unrealistic degree of strategic randomization.

