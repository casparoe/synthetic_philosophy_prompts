answer: |-
  ### Exam Question  
  "Evaluate the following refinement of the Principle of Alternative Possibilities (PAP): An agent is morally responsible for an action only if she had *normative accessibility* to an alternative possibility—that is, she could have recognized that alternative as a live reason for action *without* undergoing a global restructuring of her core evaluative framework. First, explain how this condition ostensibly immunizes PAP against Frankfurt-style counterexamples (e.g., cases involving covert manipulation that precludes alternative actions). Second, articulate why this refinement appears to make moral responsibility implausibly demanding for ordinary agents embedded in unexamined normative frameworks. Finally, resolve the tension: Can a defender of Frankfurt cases reconcile normative accessibility with responsibility by appealing to the agent’s *second-order endorsement* of her manipulated framework? Or does this demand for normative accessibility ultimately collapse into a hierarchical account that severs responsibility from alternative possibilities? Justify your conclusion."  

  ---

  ### Model Answer (720 words)  

  **I. Normative Accessibility as a Shield Against Frankfurt Cases**  
  The refinement protects PAP by redefining "alternative possibility" not as mere causal openness but as *normative availability*. In standard Frankfurt cases (e.g., Jones, who would have been coerced by Black had he wavered), the agent lacks alternative actions due to external intervention. However, PAP’s defender now argues Jones also lacks *normative accessibility* to refraining: He could not have treated non-compliance as a live option without first overhauling his entire web of values (e.g., rejecting his core belief in obedience). Since normative accessibility is absent, Jones’s responsibility for complying "willingly" is irrelevant to PAP—the principle remains intact because the required alternative was never genuinely accessible. Frankfurt cases thus fail as counterexamples; they attack a straw-man PAP that ignores the conditions for meaningful agency.  

  **II. The Overdemandingness Problem**  
  While shielding PAP, this refinement inadvertently undermines responsibility for ordinary agents. Normative accessibility demands that an agent could have recognized alternatives *within* her existing evaluative architecture. Yet most moral agents operate within inherited, unexamined frameworks (e.g., cultural norms, tacit biases). Consider Dana, who routinely dismisses charitable giving due to her internalized belief in meritocracy. To recognize charity as a "live reason," Dana might need to dismantle her meritocratic worldview—a global restructuring precluded by the normative accessibility condition. Thus, Dana seemingly lacks alternatives and is not responsible for her omission. This exculpates complacent agents excessively, conflating *unexamined* frameworks with *unfree* ones. Responsibility becomes the exclusive domain of self-scrutinizing agents, contra our practices of holding ordinary people accountable.  

  **III. Second-Order Endorsement: A False Resolution?**  
  The Frankfurt defender might dissolve the tension by arguing that manipulated agents *do* possess normative accessibility via second-order endorsement. If Jones reflectively approves his manipulated desire to comply (e.g., "I wholeheartedly *want* to obey"), his endorsement itself constitutes normative accessibility: He "could have" withheld endorsement, accessing refusal at the volitional level. However, this fails for three reasons:  
  1. **Circularity**: Endorsement presupposes the framework it operates within. A manipulated Jones cannot withhold endorsement without first rejecting his manipulated values—precisely the global restructuring normative accessibility forbids.  
  2. **Regress**: If second-order endorsement is itself shaped by the framework (e.g., via manipulation), higher-order scrutiny changes nothing.  
  3. **Demandingness Persists**: Ordinary agents like Dana rarely engage in such meta-reflection. Basing normative accessibility on endorsement still excludes habitual agents.  

  **IV. Collapse into Hierarchical Models**  
  The tension reveals normative accessibility not as a PAP-saver but as a Trojan horse for hierarchical theories. For the condition to avoid overdemandingness, it must accept that agents can be responsible *without* normative alternatives—provided they identify with their motives. Consider Dana: Though she cannot access alternatives without upheaval, we hold her responsible if her omission expresses her "deep self" (e.g., consistent meritocratic convictions). Conversely, Jones is responsible not because alternatives exist but because his compliance aligns with his (manipulated) endorsed will. Responsibility thus hinges on internal harmony, not metaphysical possibilities. PAP, even refined, cannot be salvaged; normative accessibility implicitly requires a theory where freedom is structural (hierarchical integration), not modal (alternative paths). The only consistent resolution is to abandon PAP and ground responsibility in agents’ synchronic reflective stance toward their actions, regardless of inaccessible alternatives.  

  ---

  ### Marking Scheme (Total: 25 Marks)  

  1. **Explanation of PAP Refinement & Frankfurt Immunity** (5 marks)  
     - *Full credit*: Clarifies how normative accessibility redefines PAP’s "alternative possibility" to exclude Frankfurt cases by demanding framework-consistent recognition of alternatives.  
     - *Common failure*: Merely describes Frankfurt cases without articulating *why* normative accessibility blocks them.  

  2. **Articulation of Overdemandingness Objection** (5 marks)  
     - *Full credit*: Diagnoses that normative accessibility implausibly excuses ordinary agents in unexamined frameworks, as recognizing alternatives would require disruptive self-restructuring.  
     - *Common failure*: Conflates "unexamined" with "coerced" frameworks or misses the social-embeddedness critique.  

  3. **Critique of Second-Order Endorsement Defense** (10 marks)  
     - *Full credit*: Identifies circularity/regress in endorsement-based replies *and* shows they fail to resolve demandingness (e.g., ordinary agents lack meta-reflection).  
     - *Common failure*: Accepts endorsement as a solution without noting its inapplicability to manipulated frameworks or habitual agents.  

  4. **Resolution: PAP Abandonment for Hierarchical Theory** (5 marks)  
     - *Full credit*: Concludes that normative accessibility covertly requires a hierarchical account (responsibility via internal harmony, not alternatives).  
     - *Common failure*: Proposes ad-hoc compromises (e.g., "weaker" accessibility) without recognizing the structural collapse into non-modal theories.  

