answer: |-
  Here are 8 casual, pointed questions for your podcast guest, hitting your specs:

  1.  **Core Challenge - Spatial vs. Causal:** "Okay, so Tononi's crew basically uses the exclusion postulate to pick *physical* brain regions as conscious systems because that's where phi maxes out spatially. You're saying nah, exclusion picks out systems based purely on *causal* structure in info-space, not where they physically live. What's the biggest concrete difference this makes? Like, give me an example where your 'causal boundary' wouldn't just map neatly onto a spatial blob in the brain."
      *   **Follow-up (Blocking Dodge):** "If someone argues 'But the causal structure *just is implemented* by the spatial/physical structure anyway, so it's the same thing,' why is that a misunderstanding of your point? What *couldn't* be explained if we just stuck with spatial boundaries?"

  2.  **Split-Brain Specific:** "Split-brain patients are a classic IIT headache. Standard view often says slicing the corpus callosum creates *two* max-phi systems, hence two streams of consciousness. Under your causal-boundary-in-info-space view, does that surgery *automatically* create two conscious entities? Or could the causal structure, despite the physical cut, still somehow integrate info across hemispheres in a way that preserves a single causal boundary/system?"
      *   **Follow-up (Blocking Dodge):** "Suppose experiments show a split-brain patient can sometimes still integrate info across hemispheres for specific tasks, suggesting a single causal structure persists. If Tononi-ists dismiss this as 'just messy implementation details,' how does your view force us to take that causal unity seriously as *the* defining factor for consciousness, not the physical cut?"

  3.  **Empirical Falsifiability - PCI:** "PCI is supposed to be the empirical cousin of phi. What specific, clear-cut PCI result would genuinely make you go, 'Damn, okay, maybe this whole IIT-with-causal-boundaries thing is just *wrong*'? Not a 'tweak the math' moment, but a full-on 'back to the drawing board' failure."
      *   **Follow-up (Blocking Dodge):** "If that nightmare PCI result *did* happen, and someone said 'Well, maybe the causal structure you defined is just one implementation of the *real* consciousness mechanism elsewhere,' how would you counter that? What makes the causal structure *inherently* linked to consciousness in your view, not just an implementation?"

  4.  **Panpsychism Plausibility:** "You're dissolving the combination problem by saying consciousness only arises at specific causal boundaries, not by little bits combining. Does that mean your view makes garden-variety panpsychism – where fundamental particles have micro-experiences – *less* plausible? Or does it somehow open a different door for it?"

  **Bonus Questions (Filling out the 8):**

  5.  **Combination Problem Dissolved?:** "You say the causal-boundary focus dissolves the combination problem. Walk me through that quickly. If consciousness is tied to a specific causal structure in info-space, why *can't* a bunch of smaller conscious systems just combine into a bigger one? What stops that from being a problem?"
  6.  **Causation Definition:** "Info-space causal boundaries sound cool, but 'causation' is famously slippery, especially at the level of complex systems. How are you defining causation here to make this rigorous enough to pick out *the* conscious system? Is it just counterfactuals, or something else?"
  7.  **The Hard Problem Angle:** "Does grounding consciousness in causal info-structures actually get us any closer to solving the hard problem – explaining *why* this stuff feels like anything? Or is it still just describing the 'what' and 'how' of information processing that correlates with it?"
  8.  **Edge Cases - AI & Simplicity:** "Under your view, could a wildly distributed AI system, causally integrated across the internet but spatially scattered, have high phi and be conscious? Conversely, could a super simple, maximally integrated causal loop (like a basic feedback circuit) be conscious just because it hits a causal phi max locally, even if it's dumb as rocks?"

  **Key things these do:**
  *   **Directly target** her specific causal-boundary twist vs. Tononi's spatial focus (Q1, F1).
  *   **Apply the view** concretely to a tough case (Split-brain, Q2, F2).
  *   **Force falsifiability** and block implementation dodges (Q3, F3 is core here).
  *   **Address panpsychism** (Q4).
  *   **Probe mechanics** (Q5, Q6, Q8).
  *   **Touch the hard problem** (Q7).
  *   **Casual tone** maintained with contractions, direct language, and slight informality ("nah," "damn," "messy," "dumb as rocks").

  Knock 'em dead with the podcast! Sounds like a fascinating convo.
