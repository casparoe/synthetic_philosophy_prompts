  My roomate started dating a physics grad student and now we argue about quantom mechanincs every night. Last week he dropped 'Bell's theorem proves quantum mechanics is nonlocal' like it's a mic drop. But I'm pretty sure that slogan is hiding like five different claims — maybe about hidden variables, or parameter independance versus outcome dependance, or whether you can keep locality if you pay the price of giving up statistical independance in some superdeterminist setup? Can you lay out the precise readings of that one-liner, say which ones Bell actually established, which are just interpretive extras, and whether any weird loophole lets you save locality? I need actual dinner-table ammo, not a textbook.
