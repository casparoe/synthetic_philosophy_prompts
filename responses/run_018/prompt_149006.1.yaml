  I should clarify that Bell’s theorem doesn’t directly prove nonlocality; it forces a choice between locality and other principles. The mainstream interpretation leans towards nonlocality because the alternatives are philosophically heavy. But technically, loopholes exist, even if they’re untestable or unpalatable.

