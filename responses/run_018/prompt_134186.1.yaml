  write an essay on whether reflective lock-in counts as a real form of epistemic dominance, or whether its basically just social coordination that feels bad because it clashes with identity. weigh both sides seriously — maybe universal ascription is an unavoidable heuristic for collective reasoning, or maybe it corrupts the epistemic environment in a structurally unfair way. dont end on a fence; defend a clear verdict with reasons. no need for citations or reading lists, just sharp reasoning my readers can follow.

  start with a quick outline of your main moves, then write the essay itself. keep it accessible but dont dumb it down.
