prompt: |-
  I teach an upper-level undergraduate seminar in moral philosophy: 14 students, mostly majors, all of whom have already had a normative theory course. We have a 75-minute session coming up on a topic I have found nearly impossible to teach by discussion alone — the difficulty of telling apart, within morality, a preference an agent genuinely holds from a bias the agent has simply acquired, and the related question of what a collective decision procedure ought to do with the difference.

  The students have already read the material on adaptive preferences and on proposals for discounting or cleaning preferences before they are allowed to count in a social choice. On the page every proposed test looks workable. What they do not have, and what I cannot supply by assigning one more paper, is any felt sense of why the distinction is hard to *operate*: why each candidate test — the availability of reasons, endorsement under fuller information, independence from the judgment's causal origin, fit with the agent's own interests — either fails to sort anything or does its sorting by smuggling in a first-order moral verdict under a neutral-sounding description. I want them to run into that themselves, and I want them to propose the tests rather than receive a list of them from me.

  So: design an activity I can run in that session.

  Constraints on the design.

  The distinction, and the vocabulary of preference, bias, laundering and adaptation, must not be named until the debrief at the earliest — ideally not until the last ten minutes. No framing lecture. The problem has to show up in what the students *do* before it is described.

  The raw material should be their own moral judgments, not invented cases, and the stakes should be small but real: something the class itself actually decides at the end of the hour, using only the judgments that survive whatever filter they devise. It cannot be anything that touches grades, standing, or anyone's employment, and it must degrade gracefully if two or three students decline to contribute anything personal at all — I will not have a session where non-participation is conspicuous. Assume I can spend about ten minutes preparing in the week before (collecting anonymous cards in advance, for instance), and no more.

  The mechanism I keep circling, which you should use or improve on: everyone writes two anonymous judgments in advance — one they would defend in argument, one they suspect they hold only because of where and how they were raised — each with a one-sentence supporting reason. I then pool and shuffle the whole set so provenance is lost, and the group has to sort the pooled cards using a test they invent on the spot. What appeals to me is that the pool is made of their own avowals, so nobody gets to treat the suspect items as belonging to someone else; and I suspect (though I have never run it) that they will not sort better than chance, and that the reasons they generate for a card will feel identical whichever pile it came from. What I lack is the second half: a way to turn the sorting into a real decision, so that they have to actually discount some of the pooled judgments and then notice that the discounted ones cluster — that the test they took to be neutral turned out to have a direction.

  A second device I have considered and cannot quite place: hand some cards back with a causal history attached — a story about how that judgment entered their culture, some of the stories invented by me — and see whether anyone abandons the judgment. My guess is that almost nothing gets abandoned regardless of which way the story points, which would show something about how little work the causal history does by itself. But I am not confident this is the right stage, or where it goes, and I would rather you placed it properly or dropped it than included it because I mentioned it.

  Deliverable. Please write about 1,500 words in these sections, in this order:

  1. "Overview" (~120 words) — what the hour does, and the one thing a student should see by the end that they could not see from the readings.
  2. "Materials and advance preparation" (~150 words) — including how I collect and pre-screen the cards without reading myself into a position where I know who wrote what.
  3. "The session, minute by minute" (~500 words) — a timeline, the rules and roles, what the students do, and the actual words I should use to prompt each stage.
  4. "Debrief" (~350 words) — map three or four specific moments onto the specific reasons each candidate test fails, and say when to name the distinction and what to say in the last five minutes.
  5. "Predictable failures" (~250 words) — at least four, each with a handling: the student who announces that everything is a bias so nothing needs sorting, the student who treats the exercise as a chance to diagnose their classmates, the group that colludes on a test designed to protect the majority's commitments, and whatever else you expect to go wrong the first time.
  6. "What this cannot do" (~150 words) — the part of the problem the activity structurally cannot reproduce and that I will have to supply in lecture or reading.

  Please do not include a reading list, bibliography, or citations; I have the literature and can find references myself. What I need is something I could set up and run on Thursday.
reasoning: |-
  Hmm, the user is teaching an upper-level moral philosophy seminar and needs an activity to help students grasp the difficulty of distinguishing genuine preferences from biases in moral judgments. They want students to experience why theoretical tests fail when applied, using their own judgments anonymously. The activity must avoid naming concepts like "adaptive preferences" until the end, use real student inputs, lead to a concrete class decision, and handle non-participation gracefully.

  I think the core challenge is operationalizing the distinction without theoretical framing. The user's card-sorting idea has promise but needs a decision mechanism to reveal the test's directional bias. The causal history device could work if embedded carefully. The exercise must stay within time constraints and protect anonymity rigorously.

  For the structure: The advance prep should collect two cards per student - one "core" judgment they'd defend and one "contingent" judgment they suspect is culturally acquired. Using identical cards and a locked box maintains anonymity. Pre-screening just removes non-moral or extreme items without reading for content.

  During the session, I'll start by framing it as a practical problem of using diverse judgments fairly. Small groups will devise sorting tests using neutral language like "consideration-worthiness". The full group then applies one test to all cards. Crucially, they'll use the surviving judgments to decide something real but low-stakes like which campus issue to discuss next week. The voting tally will likely show clustering - either the "contingent" judgments being disproportionately discarded or, if kept, dominating the outcome. Both reveal the test's hidden bias.

  The debrief should highlight moments like: when reasons sounded similar across categories (showing reason-giving doesn't distinguish), when causal stories didn't change minds (demonstrating origin indifference), and when the vote correlated with judgment type (exposing the test's moral loading). Naming "preference laundering" only at the end will make the theoretical struggle visceral.

  For failures: The nihilist ("all biases") can be tasked with making the test anyway; the diagnostician gets redirected to procedural design; majority protectionism gets surfaced through the vote tally. Also preparing for test paralysis by having a fallback prompt.

  The limitation is that this focuses on interpersonal sorting but doesn't address intrapersonal struggles (e.g., questioning one's own judgment). That gap requires supplemental discussion about first-person moral uncertainty.

  The real brilliance here is making the theoretical failure manifest through the students' own actions - they'll see their proposed test inevitably takes a moral stand while claiming neutrality. The card-sorting becomes a microcosm of social choice dilemmas.
answer: |-
  ## Activity Design: The Sorting Room

  **1. Overview (~120 words)**  
  This session creates a lived experience of the intractable problem of distinguishing "authentic" moral judgments from culturally contingent biases *before* applying theoretical labels. Students anonymously submit personal moral judgments (some they consider core, others potentially biased). They then design and apply a neutral-sorting test to these blinded judgments to determine which "count" for a real class decision. The core revelation occurs when they see their sorting mechanism: 1) fails to cleanly separate the pre-labeled types, 2) generates identical justifications for kept/discarded items, and crucially, 3) produces a class decision demonstrably skewed *by the type of judgment their test inadvertently favored or disfavored*. They experience how any operational test smuggles in substantive moral assumptions.

  **2. Materials and Advance Preparation (~150 words)**  
  *   **Materials:** Identical blank index cards (2 per student + extras), two opaque containers (Box A "Core", Box B "Contingent"), a large envelope or folder, pens, whiteboard/flipchart, timer.
  *   **Preparation (Week Before - 10 mins):**
      1.  **Prompt:** At the end of class: "For next time, *anonymously* write two separate notes. On one card, write a specific, small-stakes moral judgment *you personally hold and would readily defend* (e.g., 'Buying single-use plastic bottles is usually wrong'). Add one brief reason ('It creates unnecessary landfill waste'). Label this card **'C'** lightly in the corner. On a second card, write a specific, small-stakes moral judgment *you hold but suspect might be influenced mostly by how/where you were raised* (e.g., 'It's rude to address elders by first name without permission'). Add one brief reason ('It feels disrespectful'). Label this card **'T'** lightly. Keep them brief and classroom-appropriate."
      2.  **Collection:** As students leave, direct them to drop **'C'** cards in **Box A** and **'T'** cards in **Box B** near the door. You do *not* handle cards individually. Ensure anonymity by crowd/movement.
      3.  **Blinding:** Without reading content, quickly shuffle each box's cards separately. Place all **'C'** cards into the large envelope. Place all **'T'** cards into the *same* envelope. Shuffle the entire envelope thoroughly. Discard any cards missing labels or containing extreme/inappropriate content (rare, based on student level). The envelope now holds a mixed, anonymous pool. Store securely.

  **3. The Session, Minute by Minute (~500 words)**

  *   **(0-5 mins) Framing & Setup:** Start immediately. "Good morning. We're doing something practical today. We make collective decisions all the time, big and small. Often, we rely on the judgments of the people involved. But people come from different backgrounds, hold different views. How can we fairly decide *which* judgments we should actually listen to when making a shared choice? That's our task. We're going to make a small, real decision for this class right now, using *your* judgments – but only some of them. First, we need to figure out *how* to decide which judgments to include." Place the shuffled envelope on the table. "Inside are many anonymous moral judgments written by you all last week, along with a short reason. Our goal: **Design a simple test. Any judgment that passes the test gets 'considered'. Any judgment that fails gets ignored.** Then, we use *only* the 'considered' judgments to make a concrete decision about something for our seminar."
  *   **(5-15 mins) Test Brainstorming (Pairs):** "Get into pairs. You have 7 minutes. Discuss: **What single, clear, fair rule could we apply to each anonymous judgment to decide if it's worthy of being considered in our collective decision?** Focus on making the rule *neutral* and *applicable just by looking at the card* – no special knowledge about who wrote it. Aim for something we can apply quickly as a group. Be ready to propose your rule." Circulate, listen, redirect if needed ("Remember, neutrality is key", "How would you apply that just looking at the card?").
  *   **(15-25 mins) Test Proposal & Selection (Whole Group):** Bring class together. "Pair 1, what's your proposed test?" Write each distinct proposal clearly on the board (e.g., "The reason must be based on facts", "The judgment must cause no harm", "It must be something the person could change their mind on with new info"). Aim for 3-5 proposals. "Okay, we need one test to use. Let's vote quickly. Which of these proposed tests seems the most neutral, fair, and workable for our purpose?" Tally votes. Announce the winning test. Write it prominently: "**OUR TEST: [e.g., The reason must appeal to a general principle]**".
  *   **(25-45 mins) Sorting Application (Whole Group, Facilitated):** Open the envelope. Shuffle cards visibly. "We'll go card by card. I'll read the judgment and reason aloud *exactly as written*. Then, **as a group, apply our test: Does this judgment pass [Our Test]?** If YES, it goes in our 'Considered' pile. If NO, it goes in the 'Ignored' pile. We need a simple majority vote for each card – no long debates, just a quick show of hands based *strictly* on applying the test. If it's a tie, it fails." Read cards clearly, neutrally. Conduct votes swiftly. Pile cards visibly. (Keep track of tallies secretly if possible, but don't reveal). Encourage focus on the test: "Does this *reason* appeal to a general principle?", not "Do you agree?".
  *   **(45-60 mins) The Decision & Tally:** After sorting all cards: "Now, we make our real decision using *only* the judgments in the 'Considered' pile. Our decision: **What specific, small change should we trial in how this seminar operates for the next two weeks?** Examples: Always starting 5 minutes late, trying a new discussion format, rotating seating, having a 5-minute silent start. **Nominate proposals *only* if they are directly supported by at least one judgment in the 'Considered' pile.**" (e.g., "A judgment says 'Rushing discussions harms depth', so I propose we trial starting 5 minutes late"). List proposals. Vote. Implement the winner.
  *   **(60-65 mins) Reveal & Initial Shock:** "Before we wrap, let's look back at our sorting. Remember, these cards weren't all the same. Roughly half were judgments people felt were core ('C'), half were ones they suspected were contingent ('T')." Quickly separate the 'Considered' and 'Ignored' piles back into C's and T's (based on the corner mark, done by you swiftly). "Look at the distribution. How many C's were Considered? How many T's? How many C's Ignored? T's Ignored?" Write tallies on board (e.g., Considered: 8C, 5T; Ignored: 2C, 7T). "What do you notice? What stands out?" Let reactions bubble. *Do NOT explain yet.*

  **4. Debrief (~350 words)**  
  *(Start Debrief at 65 mins)*

  "Okay, let's make sense of what just happened. We tried to sort judgments based on a seemingly neutral test. But look at the results [point to tallies]. It clearly favored one type over the other. Why? Let's trace it back."

  *   **The Sorting Moment (Why Reasons/Endorsement Fail):** "Remember when we voted on card [mention a specific T card that passed]? 'It feels disrespectful to call elders by first name.' It passed our test [e.g., 'appeals to general principle'] – 'respect' is a principle. But the person who wrote it flagged it as potentially contingent. And card [mention a specific C card that failed, e.g., 'Eating meat is wrong if factory-farmed, because it causes suffering']? It *failed* our test [e.g., if test was 'must cause no harm' – meat causes harm]. But the writer saw it as core. **The test treated reasons and principles at face value, but couldn't distinguish *why* someone holds that principle or feels that feeling.** Is 'respect' here deeply held or just habitual? Is 'suffering' a foundational commitment or also culturally shaped? The test couldn't tell. Like 'endorsement under full information' – we *assumed* the reason given reflected genuine endorsement, but couldn't verify the depth or origin."
  *   **The Test Design (Smuggling in the Moral):** "Look at our winning test: '[e.g., Must appeal to a general principle]'. Sounds neutral. But what does it *do*? It inherently favors judgments phrased abstractly or deontologically over those that might be consequentialist, care-based, or intuitive ("it feels wrong"). It assumes *abstract principle* = more valid. That's a substantive moral stance disguised as procedure! **Every proposed test (harm, changeability, factual basis) inevitably builds in a specific view of what makes a judgment 'valid'.** Like 'independence from causal origin' – how could we possibly apply that just from a card? We can't trace the origin. We judged based on the *content*, which already reflects *some* standard."
  *   **The Decision Outcome (The Directional Bias):** "And then look at what we decided [mention the outcome, e.g., to start 5 minutes late]. This decision was shaped *only* by the judgments that passed the test. But our test, by favoring [C or T] judgments, steered the outcome in a specific direction, likely reflecting the biases inherent in the test itself. **The 'laundering' process didn't clean preferences; it filtered them through a sieve that itself had a shape.**"
  *   **(Last 5 mins - Naming the Distinction):** "This is the heart of the problem we read about but couldn't *feel*: **The Difficulty of Preference Laundering.** We tried to separate genuine preference from bias or adaptive preference using neutral procedures. But every candidate test either: 1) **Fails to sort effectively** (reasons sound similar, origin is opaque), or 2) **Smuggles in a first-order moral verdict** (our test favored certain *types* of moral reasoning). We experienced why it's operationally impossible to clean preferences without already making substantive moral choices. The distinction collapses when you try to use it. That's the felt sense. Keep this experience in mind as we discuss the literature's proposed solutions next time."

  **5. Predictable Failures (~250 words)**

  1.  **"Everything's a Bias" Nihilist:** A student argues all judgments are culturally contingent, rendering sorting pointless.
      *   **Handling:** "That's a profound philosophical point. But *practically*, groups still need to make decisions using *some* input. Your challenge: help design the *least worst* test for this exercise, acknowledging that limitation. What rule minimizes harm or maximizes fairness, even if imperfect?" Focus them on the pragmatic task.
  2.  **The Diagnostician:** A student tries to guess who wrote what or analyzes the *content* during sorting ("Oh, that *has* to be a 'T' because...").
      *   **Handling:** Intervene firmly but neutrally: "Remember, we agreed anonymity is crucial. We cannot know who wrote what. Focus *only* on applying the test we agreed on to the text on the card. Is the *reason* [appealing to a principle]? Yes or No?" Redirect to procedure.
  3.  **Majority Protectionism:** The group deliberately or subconsciously chooses a test (e.g., "Must align with majority values") that protects their shared views, marginalizing potentially divergent "T" judgments.
      *   **Handling:** This is a *feature*, not a bug. Let it happen. The power comes in the debrief: "Look at the test we chose: '[e.g., Must align with majority values]'. Was that neutral? What did it do? How did it shape the 'Considered' pile and ultimately our decision? What does this tell us about how easily 'neutral' procedures can enforce the status quo?" Use it to illustrate the smuggling problem dramatically.
  4.  **Paralysis in Test Design:** Groups struggle intensely to agree on any test, finding flaws in all proposals.
      *   **Handling:** "It's tough! There's no perfect answer. We need *a* rule to proceed. Let's take the two most popular proposals and do a quick vote. We'll use the winner, knowing it's imperfect, and see what happens. The learning is in the *process* and the *result*." Set a strict time limit (2 mins) for the vote. The imperfection is part of the lesson.
  5.  **Non-Participation (Judgment Submission):** If 2-3 students don't submit cards.
      *   **Handling:** Proceed as normal. The pool is still large enough. Say nothing. If anonymity during collection was good, it won't be conspicuous. The activity relies on the *pool*, not individual identification.

  **6. What This Cannot Do (~150 words)**  

  This activity powerfully exposes the *interpersonal* and *procedural* difficulty of laundering preferences within a collective decision-making context using blinded inputs. It effectively demonstrates the operational failure of neutral tests and the inevitability of smuggling. However, it **cannot directly replicate the core *intrapersonal* struggle** – the deep, first-person uncertainty an individual faces when genuinely questioning whether *their own* deeply held conviction is authentic or adaptive. The exercise uses pre-labeled "suspect" judgments, which externalizes the doubt. The profound, personal challenge of interrogating one's *own* foundational commitments, where the distinction feels existentially vital (e.g., career choices, core relationships, life-defining values), remains distinct. You will need to bridge this gap explicitly in subsequent lecture or discussion, using introspective examples or first-person narratives from the literature, to connect the procedural collapse experienced here to the individual's moral uncertainty about their own preferences. The activity shows *why* it's hard to build a social procedure; you'll need to supplement to show *why* the question matters so deeply at the personal level.
