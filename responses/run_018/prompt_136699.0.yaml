prompt: |-
  You are an expert philosopher of biology with experience building precise conceptual taxonomies for analytically minded audiences. Before you construct anything, take a moment to brainstorm the logical dependency structure: which distinctions in the species debate genuinely split the space of positions, and which ones collapse into each other once you fix answers to the others? Think carefully about how someone with a physics or computer-science background—comfortable with sets and discrete categories but not with evolutionary biology—will systematically misread the problem.

  I am preparing a handout for a rationalist-style reading group: people who can navigate decision trees and precise distinctions but have not taken biology since high school. I want a sorting taxonomy—not a prose comparison—of positions on the species problem. Structure it as a branching tree in which each internal node is a concrete diagnostic question phrased so that a reader can answer it without already knowing the philosophical label. The cases should be somewhat in the weeds, not the standard lion-and-tiger example; use scenarios like a ring species with continuous gene flow across a geographic gradient, clonal bacterial lineages that form discrete genetic clusters despite lacking sexual reproduction, and hybrid zones where intermediate forms are fertile with both neighboring populations.

  The tree must cover at least these four branching dimensions:
  - Whether reproductive isolation is necessary, sufficient, or irrelevant for membership
  - Whether diachronic continuity over evolutionary time matters more than synchronic similarity at a given slice
  - Whether hybrid zones represent one species, two species, or a failure of the category itself
  - Whether species are best understood as ontological individuals (like organisms), as natural-kind classes, or as something else entirely

  The leaves should be named positions where they exist—e.g., Biological Species Concept, Phylogenetic Species Concept, Morphological Species Concept, Ecological Species Concept, the Species-as-Individuals view, and Process Pluralism—plus an "unnamed" leaf for any logical combination of answers that no prominent view occupies. For each unnamed leaf, briefly diagnose why the space is empty: is the combination incoherent, unattractive, or merely unexplored?

  Additionally, flag the misconception that people with quantitative backgrounds typically bring—likely treating species as sets with sharp, necessary-and-sufficient membership conditions—and identify exactly which branch in your tree that misconception would distort if left unaddressed. Finally, provide one check-for-understanding question I can ask the group at the end to verify they have grasped that the debate is partly ontological and partly methodological, not simply "which definition is correct."

  Write the taxonomy in American English. Keep the tone formal and polished. Do not include bibliographies, reading lists, or citations, and do not quote specific passages from primary texts.
reasoning: |-
  Okay, the user is asking me to create a taxonomy for the species problem. They want this for a rationalist-style reading group - people comfortable with decision trees but without advanced biology knowledge. I need to build a branching tree based on concrete diagnostic questions, avoiding standard examples and using more complex cases like ring species or bacterial clones.

  The taxonomy must cover four key dimensions:
  - Reproductive isolation necessity/sufficiency
  - Diachronic continuity vs synchronic similarity
  - Interpretation of hybrid zones
  - Ontological status of species

  I'll need to include named positions like Biological Species Concept, Phylogenetic Species Concept, etc., plus any "unnamed" combinations with explanations of why they're empty. I should also address the common misconception from quantitative backgrounds where species are seen as sets with sharp boundaries.

  Let me brainstorm the logical structure first. The reproductive isolation dimension seems foundational - it determines whether gene flow matters. Then whether we prioritize historical continuity or current similarity. Hybrid zone interpretation follows from the first two. Ontology comes last since it's more abstract.

  For quantitative thinkers, I'll flag that treating species as crisp sets distorts the hybrid zone branch. They might expect clear boundaries where biology shows gradients. My check-for-understanding question should highlight the ontological/methodological nature of the debate.

  I'll organize the tree with clear questions:
  1. First branch: reproductive isolation necessity/sufficiency
  2. Second branch: diachronic vs synchronic priority
  3. Third branch: hybrid zone interpretation
  4. Fourth branch: ontology

  For cases, I'll use:
  - Ring species for reproductive isolation questions
  - Bacterial clones for asexual reproduction challenges
  - Hybrid zones for boundary cases

  The named positions will map to leaves:
  - Biological Species Concept
  - Phylogenetic Species Concept
  - Morphological/Evolutionary Significant Concepts
  - Ecological Concept
  - Species-as-Individuals
  - Process Pluralism

  I'll identify any unnamed combinations - for instance, a view that requires reproductive isolation but denies diachronic continuity might be incoherent since isolation implies lineage history.

  For the quantitative misconception, I'll note how it distorts hybrid zone interpretation by expecting binary classifications. The check question will ask about ring species classification to reveal ontological commitments.

  This structure should give the reading group a clear, decision-based way to navigate the species problem while addressing their specific needs and background.
answer: |-
  Below is the taxonomy structured as a branching decision tree. Each internal node is a concrete question requiring no prior philosophical knowledge. Cases are referenced parenthetically (e.g., "in a ring species") for context without lengthy exposition. **Key Misconception Flag:** Individuals with quantitative backgrounds often assume species are sets with necessary-and-sufficient membership conditions (i.e., sharp boundaries). This distorts interpretation of **Hybrid Zone Interpretation** branches by forcing an artificial binary choice where biology shows continuity.

  ---

  ### Taxonomy of Species Concepts

  #### 1. **Question 1: Must reproductive isolation (prevention of gene flow) be present to define a species?**  
     *(Diagnostic case: Clonal bacteria with discrete genetic clusters)*  
     - **No** → Proceed to Question 1A  
     - **Yes** → Proceed to Question 1B  
     - **Irrelevant** → Proceed to Question 2  

  #### 1A. **Question 1A: Is reproductive isolation *sufficient* to define species (even if not necessary)?**  
     *(Diagnostic case: Hybrid zone with fertile intermediates)*  
     - **Yes** → *Position: Biological Species Concept (BSC)*  
       *(Reproductive isolation is sufficient; failure in hybrid zones treated as "imperfect" isolation)*  
     - **No** → Proceed to Question 2  

  #### 1B. **Question 1B: Is reproductive isolation *necessary* to define species (even if not sufficient)?**  
     *(Diagnostic case: Ring species with continuous gene flow)*  
     - **Yes** → *Position: BSC*  
       *(Ring species endpoints are separate species; intermediates "problematize" but don’t invalidate)*  
     - **No** → *Unnamed Position*  
       **Diagnosis:** Incoherent. If reproductive isolation is neither necessary nor sufficient, but its relevance is affirmed, no consistent criterion remains.  

  ---

  #### 2. **Question 2: Does defining species require tracing historical lineages (diachronic continuity), not just current traits (synchronic similarity)?**  
     *(Diagnostic case: Fossil series vs. modern cryptic species)*  
     - **Yes, diachronic continuity is primary** → Proceed to Question 3  
     - **No, synchronic similarity is primary** → Proceed to Question 4  

  ---

  #### 3. **Question 3: In hybrid zones with fertile intermediates, are the populations:**  
     *(Diagnostic case: Stable hybrid zone between two phenotypically distinct populations)*  
     - **One species?** → *Position: Evolutionary Species Concept*  
       *(Lineage-based; hybridization is intraspecific variation)*  
     - **Two species?** → *Position: Phylogenetic Species Concept (PSC)*  
       *(Lineage-based; hybrids are evidence of incomplete divergence)*  
     - **A category failure?** → *Position: Process Pluralism*  
       *(Hybrid zones expose that "species" is context-dependent)*  

  ---

  #### 4. **Question 4: Are species defined by ecological role, not lineage/traits?**  
     *(Diagnostic case: Divergent populations occupying identical niches)*  
     - **Yes** → *Position: Ecological Species Concept*  
       *(Ignores gene flow; niche occupancy defines membership)*  
     - **No** → Proceed to Question 4A  

  #### 4A. **Question 4A: Are species defined by measurable traits (morphology/genetics)?**  
     *(Diagnostic case: Cryptic species indistinguishable morphologically)*  
     - **Yes** → *Position: Morphological Species Concept*  
       *(Traits define membership; reproductive isolation irrelevant)*  
     - **No** → *Unnamed Position*  
       **Diagnosis:** Unattractive. Rejecting lineage, traits, ecology, and isolation leaves no defensible basis for grouping.  

  ---

  #### 5. **Question 5 (Ontology): Are species:**  
     *(Applies to all paths; answer after resolving Questions 1–4)*  
     - **Individuals (cohesive wholes like organisms)?** → *Position: Species-as-Individuals*  
       *(Implies diachronic continuity; hybrid zones are "fuzziness" within individuals)*  
     - **Natural-kind classes (defined by essential properties)?** → *Position: Morphological Concept*  
       *(Requires synchronic similarity; incompatible with lineage-focused views)*  
     - **Pragmatic constructs (not fundamental units)?** → *Position: Process Pluralism*  
       *(Hybrid zones/cryptic species show no single "real" answer)*  

  ---

  ### Unnamed Leaves & Diagnoses
  1. **Reproductive isolation irrelevant + Diachronic continuity primary + Hybrid zones = two species**  
     **Diagnosis:** Incoherent. If reproductive isolation is irrelevant, lineage continuity alone cannot justify splitting hybridizing populations without additional criteria.  
  2. **Reproductive isolation sufficient + Diachronic continuity irrelevant**  
     **Diagnosis:** Unexplored. No major view combines lineage-independence with isolation-as-sufficient-condition (BSC requires lineage thinking).  

  ---

  ### Check-for-Understanding Question
  > **"In a ring species where population A interbreeds with B, B with C, but A and C cannot interbreed, should we classify A and C as the same species? Does your answer change if we discover a direct gene-flow path between A and C bypassing B? Explain how this reveals whether your definition prioritizes *process* (e.g., gene flow), *pattern* (e.g., trait gaps), or *practicality*."**  
  *(Reveals ontological commitments: Process-focused views prioritize gene flow continuity; pattern-focused views prioritize A/C discontinuity; practicality views avoid fixed answers.)*
