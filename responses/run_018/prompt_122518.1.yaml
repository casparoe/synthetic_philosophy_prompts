  - **Conclusion**: \( W(p) = \sum a_i u_i(p) + b \), with **all \( a_i \geq 0 \)** (non-negativity must appear in the theorem statement).  
  - **Key nuance**: Non-negativity of weights follows from Pareto indifference + VNM (not immediately obvious).  
  - *Top answer*: Must avoid conflating Pareto indifference with strong Pareto; non-negativity is part of the conclusion, not an add-on.  

  **Part (b) [7 marks]:**  
  - **Sketch**:  
    - VNM for individuals \(\rightarrow\) affine \(u_i\) (linear in probabilities).  
    - VNM for planner \(\rightarrow\) affine \(W\).  
    - Identify the space of lottery differences (kernel of constant functions).  
    - Pareto indifference \(\rightarrow\) \(W\) vanishes where all \(u_i\) vanish.  
    - Linear algebra: \(W\) is in the span of \(\{u_i\}\) (via quotient space argument).  
  - **(i)**: Without Pareto indifference, \(W\) need not relate to individuals (counterexample: Rawlsian max-min).  
  - **(ii)**: If achievable utility differences span a subspace \(S \subsetneq \mathbb{R}^n\):  
    - Weighted-sum representation holds **only if \(S\) is the domain** (else may fail).  
    - Weights non-unique (add vectors orthogonal to \(S\)), but existence requires Pareto indifference to constrain \(W\) **on \(S\)**.  
  - *Top answer*: Must note that the representation might not extend beyond \(S\) and existence relies on \(S\) capturing Pareto-relevant variations.  

  **Part (c) [3 marks]:**  
  - **Breakdown**: Without individual VNM:  
    - Affine \(u_i\) do not exist \(\rightarrow\) no "individual utilities" to aggregate.  
    - Pareto indifference may be vacuously satisfied (no indifferences) or fail to constrain \(W\).  
  - **Critical point**: The linear span argument **requires affine \(u_i\)**; non-linear preferences invalidate the functional form.  

  **Part (d) [4 marks]:**  
  - **Weights as MRS**: Correct, but weights are unique **only up to ratio scale** (since \(u_i\) are PA-transformed).  
  - **Anonymity**: Forces \(a_i = a_j\) \(\forall i,j\) **if all \(u_i\) are normalized identically** (e.g., same 0-1 scale).  
  - **Veil-of-ignorance**: Differs critically:  
    - Harsanyi’s veil assumes **common preferences** behind the veil; aggregation theorem does not.  
    - Equiprobability \(\Rightarrow\) sum of utilities, but anonymity + normalization \(\Rightarrow\) average.  
  - **Caveat**: Affine \(W\) is contestable (e.g., fairness concerns), but the classmate’s conflation of the two arguments is the core error.  

