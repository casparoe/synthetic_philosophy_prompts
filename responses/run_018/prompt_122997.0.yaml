prompt: |-
  You're a clinical ethicist who's sat on a dozen hospital ethics committees. Think carefully before you answer: start by brainstorming what principles could explain the pattern below, then commit to a call at the end instead of ending on "it depends."

  Our consult services' own precedents, all recent, all unanimous:

  - Competent Jehovah's Witness refuses a life-saving transfusion; we honored the refusal and he died. Allowed.
  - Family of a confused 84-year-old asks us to stop a cheap, reliably curative antibiotic "so he can go peacefully." We said no. Not allowed.
  - Dying patient on a ventilator, family asks us to withdraw; we did. Allowed.
  - Similar patient, family asks for a lethal injection instead because withdrawal takes longer and looks worse; we said no. Not allowed.
  - High-dose morphine for intractable pain where everyone knows it will probably shorten his life. Allowed.
  - Competent patient, not terminally ill, asks to stop the dialysis that's keeping him alive; we allowed it and he died a week later. Allowed.

  New case: a competent 58-year-old man, hes got no terminal diagnosis, depressed but with two psychiatrists signing off on his decision-making capacity, who has a feeding tube that we placed ourselves. He says he's thought about it for a year, wants the tube out and nothing by mouth, and wants to die of dehydration. He is explicit that dying is the point, not a side effect.

  What should we decide if we want to be consistent with ourselves, and which earlier precedent is the closest analog? Give me the two or three rules that fit all six of our previous calls but come apart on this one — something like an ordinary-versus-extraordinary-means rule, an autonomy-does-the-work rule, and a never-aim-at-death rule — say what each predicts here, tell me which one you'd bet we're actually running and why, and name the single extra case you'd bring back to the committee to settle it.
reasoning: |-
  Hmm, the user is presenting a complex clinical ethics case and asking me to analyze it based on previous precedents. They want me to think like an experienced clinical ethicist who's served on multiple hospital ethics committees. The challenge is to identify consistent principles across six past cases and apply them to this new scenario.

  Looking at the precedents:

  1. Allowing a competent Jehovah's Witness to refuse life-saving transfusion (autonomy honored despite death)

  2. Denying family's request to stop antibiotics for a confused elderly patient (preservation of life)

  3. Allowing withdrawal of ventilator from a dying patient (accepting natural death)

  4. Denying lethal injection request (no active killing)

  5. Allowing high-dose morphine for pain despite life-shortening risk (double effect principle)

  6. Allowing competent non-terminal patient to stop dialysis (autonomy over continuing treatment)

  The new case involves a competent 58-year-old with a feeding tube who wants it removed specifically to die of dehydration. He's depressed but has decision-making capacity confirmed by two psychiatrists.

  I need to identify at least two ethical principles that explain all six precedents but might conflict here. Good candidates appear to be:

  1. A distinction between allowing death versus causing death (passive vs active)

  2. The importance of treatment refusal rights (strong autonomy for refusing interventions)

  3. The prohibition against intending death (never aiming at death as a goal)

  Applying these to the new case:

  - The allowing death principle would support removal since stopping artificial nutrition is passive

  - The refusal rights principle strongly supports honoring his request

  - The never-aim-at-death principle would oppose it since death is explicitly intended

  The precedents show we've consistently allowed passive withdrawal (cases 3 and 6) but rejected active measures (case 4). We've also honored specific treatment refusals even when fatal (cases 1 and 6), but rejected requests where death was the primary aim (case 4).

  The closest analog is case 6 (stopping dialysis) - both involve competent patients refusing ongoing life-sustaining treatment. The key difference is that dialysis refusal is widely recognized as acceptable, while artificial nutrition refusal in non-terminal patients remains controversial.

  Our committee seems to operate on a refusal rights principle modified by a passive/active distinction. We allow death through omission (stopping treatment) but not commission (lethal injection). The morphine case shows we accept foreseen but unintended death.

  For consistency, we should allow feeding tube removal. To test our principles, I'd bring back a case involving a competent patient requesting withdrawal of a different non-extraordinary intervention with explicit death intent - like stopping insulin for diabetes.
answer: |-
  ### Step 1: Brainstorming Principles Explaining the Precedents  
  The six precedents reveal three core principles that consistently align with the committee’s decisions:  

  1. **The Refusal Rights Principle**:  
     - Competent patients (or surrogates for incapacitated patients) have an absolute right to *refuse* medical interventions, even if life-sustaining. Death resulting from refusal is permissible.  
     - **Supported by**: Case 1 (transfusion refusal), Case 3 (ventilator withdrawal by family), Case 6 (dialysis refusal).  

  2. **The Passive/Active Distinction**:  
     - Allowing death by *withholding/withdrawing* treatment is permissible; *actively causing* death is not. Distinguishes between "letting die" (passive) and "killing" (active).  
     - **Supported by**: Case 3 (allowed ventilator withdrawal) vs. Case 4 (forbidden lethal injection); Case 5 (allowing morphine with unintended hastened death) vs. Case 4 (forbidden direct killing).  

  3. **The Never-Aim-at-Death Rule**:  
     - Death must never be the *intended outcome* of an action, though it may be a foreseen side effect. Aligns with the doctrine of double effect.  
     - **Supported by**: Case 5 (morphine allowed for pain, not death intent); Case 2 (antibiotics continued to preserve life, not prolong suffering); Case 4 (injection forbidden due to death intent).  

  ---  
  ### Step 2: Applying Principles to the New Case  
  **New Case**: Competent 58-year-old with feeding tube requests removal to die of dehydration. Death is explicitly intended.  

  - **Refusal Rights Principle Predicts**: **ALLOW removal**.  
    - He is competent and refusing a medical intervention (tube feeding). Analogous to Case 1 (refusal of transfusion) and Case 6 (refusal of dialysis).  

  - **Passive/Active Distinction Predicts**: **ALLOW removal**.  
    - Removing the tube is passive withdrawal of treatment (like stopping dialysis in Case 6 or ventilator in Case 3), not active killing (unlike Case 4’s injection).  

  - **Never-Aim-at-Death Rule Predicts**: **FORBID removal**.  
    - His explicit intent is death, not merely refusing treatment. Analogous to Case 4 (injection forbidden due to death intent). Case 5 (morphine) allowed because death was unintended; here, it is the goal.  

  ---  
  ### Step 3: Commitment to a Call  
  **Consistent Decision**: **ALLOW removal of the feeding tube**.  
  **Closest Analog**: **Case 6 (competent patient stopping dialysis)**.  
  - Both involve competent patients refusing ongoing, artificial life-sustaining treatment (dialysis/feeding tube). Death results from underlying condition (kidney failure/dehydration) after withdrawal, not direct action.  

  **Why This Aligns**:  
  - The committee’s precedents prioritize autonomy through treatment refusal (Cases 1, 3, 6) and the passive/active distinction (Cases 3 vs. 4). Case 6 is nearly identical: a non-terminal patient refusing life-sustaining care. The depression and death intent complicate this, but two psychiatrists affirmed capacity—mirroring the competence standard in Cases 1 and 6.  

  **The Principle We’re Actually Running**: **Refusal Rights + Passive/Active Distinction**.  
  - **Why**: The committee consistently allows refusal of interventions (transfusion, dialysis, ventilator) if death results passively. It forbids actions where death is actively caused (injection) or intended as a primary aim (Case 4), or where refusal isn’t by a competent patient (Case 2). Case 5’s morphine is allowed under double effect (unintended death), but the core pattern is refusal autonomy. Here, tube removal is a refusal, not an act of killing.  

  ---  
  ### Step 4: The Test Case to Settle Ambiguity  
  **Bring Back**: A case involving a **competent, non-terminal patient requesting withdrawal of a *non-extraordinary* intervention with explicit death intent**—e.g., *stopping insulin for diabetes management*.  
  - **Why**: This directly tests the "never-aim-at-death" boundary. If insulin refusal is allowed (like dialysis), death intent is irrelevant; if forbidden, the committee prioritizes prohibiting death as a goal. Case 6 (dialysis) is extraordinary; insulin is ordinary. This clarifies whether death intent or treatment type drives decisions.  

  ---  
  **Final Answer**:  
  **ALLOW the feeding tube removal**. Consistency with precedents demands honoring the patient’s refusal under the Refusal Rights Principle and Passive/Active Distinction. Case 6 is the closest analog. The Never-Aim-at-Death Rule is the outlier here, but our committee’s pattern suggests it’s secondary to refusal autonomy. To resolve lingering tension, test with an insulin-refusal case.
