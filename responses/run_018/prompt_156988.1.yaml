  hey — I'm drafting a taxonomy for my advisor, it's for the intergenrational ethics seminar I'm running next term. I need a decision tree that sorts philosophical positions on pure time preference, but specifically in institutional investment contexts where you're setting discount rates for people who don't exist yet. The branching questions should be: (1) whether the non-identity problem makes cross-generational welfare comparison conceptually broken, (2) whether social and individual discount rates have to diverge, (3) whether existential risk gives a reason to treat near-future and far-future differently that has nothing to do with pure preference, and (4) whether delaying a benefit is morally asymetric with accelerating a harm. Each leaf should carry the standard label if it has one — like the zero-rate view or the declining-rate view — plus one sentence on its most awkward commitment. Flag any empty combinations and say briefly why nobody occupies them (incoherent, unattractive, or just unexplored?). Keep it tight, maybe 6-8 leaves, and don't just recycle climate-policy talking points — I'm after the conceptual structure. Need it for friday's meeting with the committee, so a quick draft is fine.
reasoning: |-
  Okay, the user is drafting a taxonomy for an intergenerational ethics seminar, specifically focusing on philosophical positions about pure time preference in institutional investment contexts. They need a decision tree with four branching questions, leading to 6-8 leaf positions, each labeled with standard names and their awkward commitments. They also want to flag empty combinations and explain why they're unoccupied. The deadline is tight—Friday—so a quick draft is necessary.

  First, I need to unpack the four branching questions:
  1. **Non-identity problem**: Whether it invalidates cross-generational welfare comparisons.
  2. **Social vs. individual discount rates**: Whether they must diverge.
  3. **Existential risk**: If it justifies differential treatment of near vs. far future independently of pure preference.
  4. **Moral asymmetry**: If delaying a benefit is asymmetrically worse than accelerating a harm.

  The context is institutional investment, like setting discount rates for future generations, so I should avoid generic climate policy points and focus on conceptual structure. The user mentioned "pure time preference," which is discounting future welfare just because it's in the future, so I'll center the taxonomy around that.

  For the decision tree, I'll start with the first question on non-identity. If "yes" (problem is fatal), it leads to positions that might reject discounting altogether or have practical workarounds. If "no," we move to question two on rate divergence. Then, depending on answers, we hit questions three and four on existential risk and asymmetry.

  I recall key philosophical views:
  - **Zero-rate view**: No pure time preference, often from Ramsey-style arguments.
  - **Declining-rate view**: Discount rates decrease over time, popular in climate economics.
  - **Opportunity cost view**: Discount based on economic growth.
  - **Catastrophe-averse view**: Focuses on existential risks.
  - **Asymmetry-embracing view**: Treats harms and benefits differently.

  I need to map these to the branches. For awkward commitments, I'll highlight counterintuitive implications, like ignoring non-identity issues or demanding unrealistic sacrifices.

  Empty combinations: Some paths might be incoherent. For example:
  - If someone says non-identity breaks comparisons (yes to Q1) but insists on rate divergence (yes to Q2), it could be inconsistent because if comparisons are broken, why have any rates? So I'll flag that as empty due to incoherence.
  - Another gap might be rejecting asymmetry but endorsing high discount rates, which could be unattractive if it downplays future harms.

  Aim for 6-8 leaves. Structure the tree step by step:
  1. Start with Q1: Non-identity fatal? 
     - If yes, branch to Q2: Must rates diverge?
       - If yes: Empty (incoherent).
       - If no: Leads to "Practical Discounting" with awkward commitment to ignoring non-identity.
     - If no to Q1, move to Q2.
  2. Q2: Must rates diverge?
     - If yes: "Opportunity Cost" view, awkwardness is using high rates that may harm the far future.
     - If no: Move to Q3 and Q4.
  3. Q3: Existential risk justifies differential treatment?
     - If yes: "Catastrophe-Averse Declining Rate," awkwardness is discounting beyond catastrophe scenarios.
     - If no: Move to Q4.
  4. Q4: Moral asymmetry?
     - If yes: "Asymmetry-Embracing Zero Rate," awkwardness is demanding excessive sacrifices for distant benefits.
     - If no: "Ramsey Zero Rate," awkwardness is ignoring extinction risks.

  Finally, ensure it's concise and meets the user's needs. They're likely an academic preparing for a committee, so clarity and rigor are key. I'll deliver a draft with the tree and explanations.
answer: |-
  Here's a concise decision tree for intergenerational discounting in institutional contexts, structured around your four questions. It yields 7 coherent positions (with 2 empty branches flagged). Focus is on *conceptual* commitments, not applied policy.

  **Decision Tree: Philosophical Positions on Pure Time Preference**

  **Start → Q1: Does the non-identity problem make cross-generational welfare comparisons conceptually broken?**  
  - **Yes** → Q2: Must social and individual discount rates diverge?  
    - **Yes** → *Empty* (Incoherent: If comparisons are broken, deliberate divergence presumes comparability.)  
    - **No** → **Position 1: Practical Discounting** ("Weak Non-Identity Acceptance")  
      *Label:* Modified Utilitarian Rate  
      *Awkward commitment:* Must artificially impose discount rates for tractability while accepting that future persons' welfare is incomparable to current.  

  - **No** → Q2: Must social and individual discount rates diverge?  
    - **Yes** → **Position 2: Opportunity Cost View**  
      *Label:* Growth-Based Discounting  
      *Awkward commitment:* Justifies high far-future discount rates (e.g., 4-6%), risking trivialization of existential harms due to assumed wealth growth.  
    - **No** → Q3: Does existential risk justify differential near/far-future treatment independently of pure preference?  
      - **Yes** → **Position 3: Catastrophe-Averse Declining Rate**  
        *Label:* Weitzman Declining Discount Rate  
        *Awkward commitment:* Discounts post-catastrophe futures *more* heavily due to uncertainty, potentially undervaluing recovery paths.  
      - **No** → Q4: Is delaying a benefit morally asymmetric with accelerating a harm?  
        - **Yes** → **Position 4: Asymmetry-Embracing Zero Rate**  
          *Label:* Negative Utilitarian Adjacent  
          *Awkward commitment:* Permits zero/negative discounting for preventing harm but not pursuing benefits, creating intractable prioritization conflicts.  
        - **No** → **Position 5: Ramsey Zero Rate**  
          *Label:* Stern-like Zero Pure Time Preference  
          *Awkward commitment:* Demands extreme present sacrifices for minor far-future gains if extinction risk is low.  

  *(From Position 3 → Q4: Does asymmetry apply?)*  
  - **Yes** → **Position 6: Asymmetric Catastrophism**  
    *Label:* Parfit-Informed Precaution  
    *Awkward commitment:* Prioritizes preventing near-term extinction (accelerated harm) over ensuring long-term flourishing (delayed benefit), neglecting post-catastrophe obligations.  
  - **No** → **Position 7: Robust Declining Rate**  
    *Label:* Unified Declining Discount Rate  
    *Awkward commitment:* Declining rates handle risk/asymmetry *implicitly*, lacking principled distinction between time and risk discounting.  

  *(From Position 5 → Q3: Already answered "No", so no further branch)*  

  ---

  **Summary of Positions & Empty Branches:**  
  - **Coherent Positions (7)**:  
    1\. Modified Utilitarian Rate (Q1=Y, Q2=N)  
    2\. Growth-Based Discounting (Q1=N, Q2=Y)  
    3\. Weitzman Declining Discount Rate (Q1=N, Q2=N, Q3=Y, Q4=N/A)  
    4\. Asymmetry-Embracing Zero Rate (Q1=N, Q2=N, Q3=N, Q4=Y)  
    5\. Ramsey Zero Rate (Q1=N, Q2=N, Q3=N, Q4=N)  
    6\. Asymmetric Catastrophism (Q1=N, Q2=N, Q3=Y, Q4=Y)  
    7\. Unified Declining Discount Rate (Q1=N, Q2=N, Q3=Y, Q4=N)  

  - **Empty Branches (2)**:  
    - **Q1=Y → Q2=Y**: Incoherent (as above).  
    - **Q1=N → Q2=Y → Q3/Q4**: *Unoccupied*. If rates *must* diverge, existential risk/asymmetry become redundant (growth dominates). Theorists avoid this as *unattractive*—it reduces ethics to financial capital growth.  

  ---

  **Key Conceptual Tensions Highlighted**:  
  - Non-identity rejectors (most positions) assume comparability but wrestle with *how* to discount (Q2-Q4).  
  - Existential risk (Q3) splits declining-rate approaches: unified (Position 7) vs. catastrophe-averse (3 & 6).  
  - Asymmetry (Q4) creates stark divides: Zero-rate egalitarians (Position 5) vs. harm-prioritizers (4 & 6).  

  This structure isolates core philosophical fault lines. I omitted climate-specific debates (e.g., SCC calculations) per your request. Good luck with the committee!
