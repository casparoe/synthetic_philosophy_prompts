answer: |-
  Here's a breakdown of the conceptual mechanics addressing the fission problem within strict anatta, avoiding substance-smuggling:

  **Core Framework:**
  1.  **No Owner, Only Causation:** Karma isn't "owned" by a self. It's the causal law that *volitional actions (karma)* create *potentials (karmic seeds/vāsanās)* within the ever-changing stream of aggregates. These potentials inevitably ripen into *results (vipāka)* under suitable conditions within that stream.
  2.  **Continuity as Conditioned Causation:** The "stream" isn't a thing but a label for the dense, sequential causal dependence (*pratītyasamutpāda*) between momentary aggregates (dharmas). Moment N arises *dependent on and conditioned by* Moment N-1, including its karmic seeds. Moment N+1 depends on Moment N. This chain creates functional identity and continuity *conventionally*.
  3.  **Discrete Moments & Conventional Stream:** The stricter moment-view and the functional stream-view aren't ultimately opposed. The stream-view *describes* the observable pattern of causal dependence between moments. It's real *conventionally* (how we experience and talk) but unreal *ultimately* (no enduring entity behind it).

  **Addressing Fission:**
  Imagine Stream S (pre-fission) performs a karmic action, embedding a seed (K). Stream S then cleanly splits into Stream A and Stream B, both equally valid causal continuations.

  *   **Step 1: Karma is Embedded in the Causal History:** K is a potential *created within the specific causal sequence* leading up to and including the moment of action in Stream S. It's not an external tag.
  *   **Step 2: Fission Creates Two Causal Histories:** Post-fission, Stream A and Stream B each possess *the entire causal history of Stream S up to the split*, including K. This history is the foundational condition for both new streams.
  *   **Step 3: Inheritance via Causal Descent:** Both Stream A and Stream B inherit K *because they are direct causal descendants of the stream in which K was created*. K is part of the conditioning matrix *from which both A and B arise*.
  *   **Step 4: Ripening Depends on Local Conditions:** The *ripening* of K (when, how, and *in which stream* it manifests) depends on the *subsequent conditions* within each stream:
      *   If conditions in Stream A favor K's ripening, it ripens in A.
      *   If conditions in Stream B favor K's ripening, it ripens in B.
      *   Crucially, K *could potentially ripen in both*, *if conditions in both streams are suitable*. There's no rule that a karmic seed *must* ripen only once or only in one place if the causal stream bifurcates. The seed is a potential awaiting conditions.
  *   **Step 5: "Ownership" = Causal Connection:** The stream that experiences the result "owns" the karma *only* in the sense that it is experiencing the fruition of a potential generated within the causal history it directly descends from. Stream A experiences K's result *because* A descends from S (where K was created) *and* A provided the conditions for ripening. Same for Stream B. There is no prior "owner" S that gets divided; there is only the causal inheritance by A and B.

  **Resolving the Tension:**
  *   **No Smuggled Self:** We haven't invoked an enduring entity. We've only talked about causes (K), effects (ripening), and causal dependence (S conditioning A & B, A & B inheriting S's causal history).
  *   **No Collapse:** We haven't said "both streams own it" in a way that collapses distinction. We've said both streams *inherited the potential* from their common causal ancestor (S). How and *if* it manifests depends on each stream's unique post-fission path. The distinction between A and B is real conventionally post-fission, and their experiences of K's results (if any) will be distinct.
  *   **Functional Identity Preserved (Conventionally):** Pre-fission, the functional identity is the causal continuity of S. Post-fission, there are two distinct functional identities (A and B), each carrying forward the causal history of S, including its karmic potentials. The ethical "weight" is carried by the causal law itself: potentials created *will* ripen when/where conditions allow in their descendant streams.

  **Confidence & Uncertainty:**

  *   **High Confidence (85-90%):** In the core framework: karma as causal law embedded in momentary aggregates, continuity as causal dependence, inheritance via causal descent in fission. This is logically consistent with anatta and pratītyasamutpāda.
  *   **Lower Confidence / Nuance Needed (The Ripening Part):** The precise mechanics of *how* a single karmic seed might (or might not) ripen in *both* descendant streams. Texts don't explicitly model fission. My reasoning (it *can* ripen in both if conditions allow) is a logical deduction from the principles, but it raises questions:
      *   Does the seed "split" or is it "copied"? (Probably neither; it's a potential inhering in the causal history, accessible to both lines of descent).
      *   Are there karmic "rules" preventing dual ripening? (Unlikely based on core doctrine, but conceivable based on some interpretations of karma's precision).
      *   This is where the "conventional" aspect is strongest – we point to the causal connection and accept that the results will manifest appropriately *somewhere* in the relevant causal continuum(s) without needing a metaphysical "owner".

  The key is shifting from "Who owns the debt?" (a substance view) to "Where does the causal potential, generated in that past moment-sequence, find conditions to ripen within its descendant moment-sequences?" (a process view). Fission creates more descendant sequences, but the causal link remains.
