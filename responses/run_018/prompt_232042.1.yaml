  **INTERNAL MEMORANDUM**  
  **To:** All Front-Desk Staff  
  **From:** Eleanor Finch, Duty Manager  
  **Date:** 19 October 2023  
  **Re:** Operational Protocols Following Full Occupancy & Infinite Arrivals  

  **1. Introduction**  
  Following last night’s full occupancy (all ℵ₀ rooms occupied) and subsequent arrival of multiple infinite guest parties, this memorandum outlines standard relocation procedures to ensure seamless accommodation. Compliance with these protocols is mandatory to minimise guest disruption and maintain operational infinity.  

  **2. Single Late Arrival Protocol (Full Occupancy Scenario)**  
  When the hotel is at full capacity and a single guest arrives:  
  2.1. Instruct the guest currently in Room 1 to relocate to Room 2.  
  2.2. Instruct the guest in Room *n* (for all *n* ≥ 1) to relocate to Room *n* + 1.  
  2.3. Assign Room 1 to the new arrival.  
  *Rationale*: This creates a vacancy at Room 1 while ensuring all existing guests retain accommodation. Relocation is instantaneous upon instruction.  

  **3. Accommodation of a Single Infinite Coach Party**  
  When a coach transporting a countably infinite set of new guests (designated Coach 1) arrives:  
  3.1. Instruct the guest in Room *n* to relocate to Room 2*n*.  
  3.2. Assign the *k*-th passenger from Coach 1 to Room 2*k* – 1 (for all *k* = 1, 2, 3, ...).  
  *Rationale*: This vacates all odd-numbered rooms (a countably infinite subset) for new arrivals. Existing guests occupy even-numbered rooms without loss of accommodation.  

  **4. Accommodation of Countably Infinite Coaches**  
  When ℵ₀ coaches arrive, each carrying ℵ₀ passengers:  
  4.1. Instruct the guest in Room *n* to relocate to Room 2<sup>*n*</sup>.  
  4.2. Assign passengers using the **Standard Diagonal Enumeration Protocol**:  
  > The passenger seated in position *j* on Coach *i* (for *i* = 1, 2, 3, ... ; *j* = 1, 2, 3, ... ) is assigned to Room 3<sup>*i*</sup> × (2*j* – 1).  
  *Rationale*: This pairs each coach-seat combination (*i*, *j*) with a unique odd-numbered room not of the form 2<sup>*n*</sup>, leveraging the fundamental theorem of arithmetic. Existing guests are relocated to rooms of the form 2<sup>*n*</sup> (a countably infinite subset).  

  **5. Guest Complaint & Response**  
  > **Guest Query (Logged 02:17, Room 7,814):**  
  > *"This is absurd! Every hotel has a last room. I refuse to believe you’ve moved me ‘infinitely far down’ the corridor. I’m walking to the end to find Room ∞ and will report you to the Hospitality Ombudsman for false advertising."*  
  >   
  > **Manager’s Response:**  
  > *"Dear Mr. Arkwright, Thank you for your valued feedback. While we appreciate your commitment to thoroughness, our corridors are designed to facilitate efficient transfinite relocation and regrettably lack terminal endpoints. For your convenience, we have provided complementary earplugs to mitigate disturbance from ongoing relocation operations. Should you wish to walk the corridor, please be advised that directional signage extends indefinitely. We remain at your service for any finite concerns."*  

  **6. For the Avoidance of Doubt**  
  6.1. **Continuum Coach Parties:** Under no circumstances may coaches carrying 2<sup>ℵ₀</sup> passengers (e.g., "Real-Number Express" services) be accommodated. This is a **hard operational limit**, as the guests’ identifiers cannot be bijectively mapped to room numbers. Attempting to allocate rooms would require an uncountable number of relocations, violating our Countable Relocation Policy (CRP-ℵ₀).  
  6.2. **Finitist Concerns:** Guests expressing scepticism regarding the feasibility of infinite relocation (e.g., "endless corridor" complaints) should be directed to the pamphlet *"Enjoying Your Stay: A Guide to Countable Comfort"* (Housekeeping Annex, Shelf ω+1). Do not engage in theological or philosophical debates. Offer mint-infused towels.  

  **7. Closing Remarks**  
  Adherence to these protocols ensures Hilbert’s Hotel maintains its reputation for boundless hospitality. Remember: a vacant room is merely a relocation instruction away. Report any attempted continuum-scale bookings directly to the Duty Manager.  

  E. Finch  
  Duty Manager  
  *"Ensuring every guest has a room, even if it takes forever."*  

