prompt: |-
  OK, my friend and I just had one of those three-hour arguments about AI risk, and I'm stuck on where we actually diverge. He's a lot more skeptical than me that a superintelligent system with an arbitrary final goal would be catastrophic. The specific claim we kept circling was the orthogonality thesis (any level of intelligence is compatible with basically any final goal) combined with instrumental convergence (almost any final goal pushes a sufficiently capable agent toward the same subgoals: self-preservation, acquiring resources, avoiding shutdown). My credence in that package, for the kind of agent people mean by "superintelligence," is around 0.7; his is around 0.25. I don't just want a number — I want the reasoning taken apart. Give me your own credence in the package, or say first how you'd sharpen it and then give the number. Then decompose it: how much rides on whether intelligence and goals are even seperable in a real system, how much on whether a "dumb" final goal would get revised away as the agent gets smarter, how much on whether we could train the convergent subgoals out, and whatever other sub-questions you think carry real weight. Show how they combine into your number, tell me which single sub-question my friend and I most likely actually disagree on, and say what evidence or argument would move you the most. And don't just hide behind "it's too underspecified" — pick a reasonable sharpening and run with it.
