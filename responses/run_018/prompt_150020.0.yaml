answer: |-
  The smell of ozone and cold coffee hung in Ben’s garage lab, thick as the dust motes dancing in the single shaft of afternoon sun. Outside, the familiar *click-hum* of the civic chronometer marked the universal tick. Ben adjusted the brass knobs on his old 'Frame Viewer', its screen showing the street outside frozen mid-tick: Mrs. Henderson’s terrier suspended mid-leap, a delivery drone a perfect, motionless teardrop against the sky, a cyclist leaning impossibly far into a non-existent turn. Motionless. Always motionless, frame by frame.

  Folks called it ‘The Stitch’. Reality wasn’t a river, but a flipbook. Consciousness – that messy, biological pattern-recognition engine Ben spent his life studying – just smoothed the jagged edges. It stitched the infinite frozen instants together into the *illusion* of smooth motion. Everyone knew it. Felt it, in the tiny, imperceptible lurch between ticks. And everyone knew how to exploit it.

  Ben watched young Pete from down the lane saunter past the frozen grocer’s display. Pete paused, tapped the cheap chrono-strap on his wrist – a mass-produced hack job – and vanished. Not invisible. Just… *absent* for one perfect, frozen instant. In the next tick, he was three steps further, casually biting into a shiny Granny Smith that hadn’t been in his hand a moment before. Old Man Henderson’s prized apple, plucked mid-frame. Pete chewed, grinning. No one saw, no one *could* see. The stitch smoothed over the theft like it smoothed over the gaps between heartbeats.

  Ben sighed, rubbing the bridge of his nose. He’d done it himself, back in the day. Dodged a falling scaffold bolt by freezing mid-stumble. Avoided awkward conversations by skipping a single, excruciating frame. Even ‘misplaced’ a parking ticket once. Harmless stuff, mostly. Convenience. A perk of living in a stop-motion universe.

  But lately… lately the implications itched at him worse than the static from the Frame Viewer.

  He thought of Elara, frozen mid-shout at the City Revenue office yesterday. Her face locked in a mask of bureaucratic fury, finger pointing accusingly at a column of numbers on a screen. Ben had tapped his own, finer chrono-band – a relic from his lab days – and simply… stepped out of the frame. Her rage, the demand for back taxes he probably *did* owe… it ceased to exist for him in that instant. When time stitched back, he was already turning away, her voice hitting empty air where he’d been. He felt a familiar twinge of guilt, quickly rationalized. *Just skipping a bad moment. Like dodging rain.*

  But the image stuck: Elara, petrified. Not just her body, but her *intent*, her whole emotional state, trapped in amber. A snapshot of anger with no before or after, no consequence… unless someone chose to witness it in the *next* frame.

  He poured cold tea, watching the liquid hang in a perfect, trembling arc before collapsing into the cup in the next *click-hum*. **Choice.** That was the burr under his saddle. If every frame was truly static, truly *complete* in itself, with no causal flow *between* them… where did choice live?

  Did Pete *decide* to steal the apple in the frozen instant before he froze? Or was the decision, the *intent* to freeze and steal, just another static configuration of atoms and neurons in that frozen frame labeled ‘Pete steals apple’? When Ben froze to avoid Elara’s wrath, was it an act of will… or was the ‘Ben who avoids’ simply the next static frame in the sequence, predetermined, isolated?

  The Stitch gave the *feeling* of continuity, of decisions leading to consequences. But if the arrow was genuinely at rest in every frame, if *everything* was… then maybe morality was just another pattern consciousness stitched together. A comforting narrative overlaid on a universe of disconnected snapshots. Responsibility required a bridge between moments, a cause in frame A leading to effect in frame B. But if there was no real transition, no flow… was there any bridge at all? Or just frame A, then frame B, forever adjacent but causally adrift?

  He remembered a lab accident decades ago. A containment breach, microseconds unfolding like hours. He’d frozen time, just one tick. Just long enough to see the bio-sample suspended, glistening, mid-splash, inches from his assistant’s face. Frozen danger. He’d moved her. In the next frame, she was safe, bewildered. Heroic. He’d gotten a commendation.

  But now, staring at the dust motes hanging like stars, he wondered. Had he *chosen* to save her? Or was Frame X simply ‘Ben sees danger’, Frame Y ‘Ben activates chrono-band’, Frame Z ‘Assistant is safe’? Static states. No more causal connection between them than between any two random pages in the cosmic flipbook. His guilt over skipping taxes, Pete’s petty theft, his own moment of heroism… were they all just… aesthetic differences in the arrangement of matter and energy in isolated instants? Meaning assigned after the fact by the stitching mind?

  The civic chronometer *click-hummed*. Ben looked down at his chrono-band. A tiny, intricate thing humming with captured potential. He could tap it now. Freeze this frame forever from his perspective. Skip the awkward conversation he needed to have with his daughter. Skip the ache in his joints. Skip everything.

  He raised his finger. The dust motes hung. His reflection in the darkened Frame Viewer screen looked back, a tired man in a dusty garage, finger poised.

  *Where does the choice happen?* he thought, staring into his own frozen eyes. *In the frame before the tap? Or is the tap itself just part of the next frozen picture?*

  His finger hovered. The *click-hum* vibrated in his bones, the universe holding its breath for an instant that contained everything, and nothing, at all. The weight of a lifetime of choices, real or imagined, pressed down. He didn't tap the band.

  He just sat there, in the humming silence between ticks, watching the dust hang, wondering if the burden he felt was real, or just another stitch in the dark.
