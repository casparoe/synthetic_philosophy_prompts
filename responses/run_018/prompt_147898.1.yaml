answer: |-
  **No established concept fully captures this phenomenon, so I propose the term "normative ungrounding" to describe the collapse of a social practice when shared criteria for identifying its instances erode, making consistent application impossible despite ongoing endorsement or rejection of its abstract principle.**

  Here's the reasoning and differentiation:

  1.  **Core Mechanism:** Normative ungrounding centers on the *epistemic collapse of application conditions*. The community loses the ability to reliably coordinate on *what counts* as a valid or invalid instance of the norm/practice ("what warrants a duel?", "what behavior merits shunning?"). This paralysis stems from the loss of shared, operational exemplars or anchoring criteria.

  2.  **Distinction from Ordinary Vagueness:**
      *   All norms have some vagueness at the margins (the "sorites paradox"). Normative ungrounding occurs when this vagueness expands to consume the *core* cases or when disagreement about the core becomes widespread and unresolvable.
      *   It's not just borderline cases being hard; it's the *exemplars* themselves becoming contested or unavailable. The practice loses its paradigmatic anchors ("What *is* a 'proper' duel nowadays?").

  3.  **Distinction from Appiah-Style Honor Cascades:**
      *   Appiah's model focuses on a conscious, often rapid, collective reevaluation of the *value* of honor itself or the *cost* of maintaining the practice relative to other values (e.g., appearing ridiculous or uncivilized). The *content* of the norm is rejected.
      *   Normative ungrounding bypasses explicit value rejection. The abstract principle (e.g., "honor should be defended," "serious transgressors should be shunned") might still hold sway. Collapse happens because people fundamentally *cannot agree on what defending honor or identifying a transgression concretely requires* in any given situation. The *how*, not the *why*, fails.

  4.  **Distinction from Interest-Based (Williams-style) Accounts:**
      *   Williams emphasizes changing material/social *payoffs* altering the rational calculus for adherence ("dueling is now more likely to get me arrested than respected").
      *   Normative ungrounding can occur *independently* of changing payoffs. The problem isn't that the costs outweigh the benefits of applying the rule *once identified*; the problem is that the rule *cannot be identified for application in the first place*. The payoff calculation becomes moot because the triggering condition is epistemically inaccessible.

  5.  **Conceptual Carving:** It's best understood as a **failure of coordination on application conditions rooted in the loss of shared exemplars and operational criteria**. This leads to a breakdown in common knowledge *about what the rule demands in practice*, even if the rule's abstract existence is known. Semantic drift in the *concept* is a key *driver* (what "honor," "slight," or "transgression" means shifts and fragments), but the *result* is the specific paralysis of application – the unmooring of the extension.

  6.  **Boundaries - Strategic Exploitation & Ambiguity:**
      *   Normative ungrounding doesn't cover *any* ambiguous rule. Many ambiguous rules persist through precedent, authority, or negotiated application.
      *   It specifically involves a *critical threshold* where ambiguity becomes *crippling* due to the loss of shared anchors.
      *   Strategic exploitation (defenders stretching definitions to preserve the norm, critics stretching definitions to condemn it) is often a *symptom* and *accelerant* of ungrounding, not a requirement. The core is the underlying erosion of shared criteria, which creates the fertile ground for such exploitation. However, the phenomenon is defined by the *inability to apply consistently*, whether exploited strategically or arising from genuine confusion.

  **In essence:** Normative ungrounding is the death of a practice by a thousand semantic cuts. It collapses not because people stop believing in its point, but because they can no longer agree on what the practice *is* in the real world, rendering it operationally inert. It complements other theories (changing interests might *initiate* the semantic drift; strategic actors might *exploit* the ambiguity), but it identifies a distinct mechanism of collapse: the epistemic dissolution of the practice's concrete identity.
