prompt: |-
  Since my recent appointment to a governmental advisory panel on representational equity, I have been reviewing our body's prior positions on quota-based mechanisms across jurisdictions, and I need to determine how we should rule consistently on an unprecedented proposal. Our record so far: we endorsed race-conscious holistic review in U.S. university admissions but drew a hard line against fixed numerical quotas for student bodies; we upheld caste-based reservations in Indian public employment and education as constitutionally required compensatory measures, yet we refused to extend analogous percentage mandates to private-sector board appointments; and we approved Norway's statutory 40 percent gender quota for corporate boards, but only on the condition that it include both sunset provisions and merit-preserving eligibility thresholds. The new proposal before us would impose mandatory representation quotas for fluent speakers of endangered indigenous languages on all public broadcasting boards, without any sunset clause and without any professional-eligibility filter beyond language competence alone. Given our precedents, should we approve or reject this proposal if we wish to remain consistent? Which of our three prior rulings is the closest analog, and if our record genuinely underdetermines the outcome, what distinct principle would we be adopting with an approval versus a rejection? Finally, what hypothetical case—perhaps involving linguistic representation in private media or in a different sector—would best distinguish between the competing rules that fit our past verdicts?
reasoning: |-
  Okay, let me approach this methodically. The user presents a complex policy consistency puzzle across three distinct precedents involving affirmative action mechanisms. They serve on a governmental advisory panel needing to determine whether to endorse mandatory indigenous language representation quotas in public broadcasting boards without sunset clauses or professional eligibility filters. The core challenge is maintaining jurisprudential coherence given seemingly contradictory past positions.

  First, I need to unpack the three key precedents. The U.S. university admissions case rejected fixed quotas but endorsed holistic race-conscious review - suggesting a preference for flexible, individualized assessment over rigid numerical targets. The India rulings present an interesting contrast: upholding caste-based reservations as constitutionally mandated compensatory measures in public sectors while rejecting analogous private-sector quotas. This implies a distinction between public/private spheres and recognition of historical reparations as legitimate grounds. Norway's corporate gender quota approval with sunset provisions and merit thresholds indicates conditional acceptance of numerical targets when temporally bounded and competence-safeguarded.

  The new proposal introduces novel elements: linguistic representation (rather than racial/gender/caste), endangered language focus, public broadcasting context, and absence of both sunset clauses and professional qualifications beyond language fluency. The absence of time limits is particularly notable given Norway's sunset requirement, and the lack of professional filters contrasts with all three precedents that maintained some merit considerations.

  To assess consistency, I compare the proposal to each precedent. The U.S. analogy fails because rigid quotas were explicitly rejected there. India's reservation system offers closer parallels as compensatory justice for historically marginalized groups, but the public/private distinction matters - here the broadcasting boards are public institutions, which might align with India's public-sector approvals. However, India's reservations typically include broader eligibility criteria beyond identity alone. Norway's case shares the quota mechanism but diverges on sunset provisions and competence safeguards.

  If I approve this proposal despite lacking Norway's conditions and India's broader criteria, I'd establish a new principle that endangered language preservation justifies permanent, qualification-minimal quotas in cultural institutions. Rejection would uphold the precedents' requirements for temporal limits and/or merit safeguards. To test these competing principles, a hypothetical about imposing similar language quotas in private media boards could be revealing - approval would extend the new principle beyond public institutions, while rejection would confine it to state entities.

  The panel must confront whether language endangerment constitutes sufficient grounds to override their established safeguards. This case sits at the intersection of cultural preservation and compensatory justice, potentially requiring them to articulate clearer hierarchical principles among these values.
answer: |-
  Based on your panel's precedents, **rejecting this proposal** appears more consistent. The closest analog is **Norway's corporate gender quota**, and the lack of a sunset clause and professional-eligibility filter directly contradicts the conditions your panel imposed there. Below is the full analysis:

  ### 1. **Consistency Analysis & Recommendation: Reject**
     - **Violation of Norway Precedent Conditions:** Your panel approved Norway's 40% gender quota *only* with a sunset provision and merit-preserving eligibility thresholds. The current proposal lacks both, making approval inconsistent.
     - **Distinction from India's Caste Reservations:** While India's reservations involve identity-based redress, they apply to *state* functions (public employment/education) and include broader eligibility criteria (e.g., educational qualifications, economic status). Extending quotas to *boards* without merit filters or sunset clauses exceeds this scope.
     - **Conflict with U.S. Admissions Stance:** Your rejection of "fixed numerical quotas" in U.S. admissions directly opposes rigid quotas like this proposal.

  **Approval would require adopting a new principle:**  
  > *"Cultural preservation for endangered groups justifies permanent, qualification-minimal quotas in public institutions, overriding sunset and merit safeguards."*  

  **Rejection upholds existing principles:**  
  > *"Even compensatory or equity-driven quotas must include temporal limits and guardrails against compromising functional competence."*

  ---

  ### 2. **Closest Analog: Norway's Gender Quota**  
  The Norwegian case is the strongest parallel because:  
  - Both involve **quota mandates for governance boards** (corporate vs. broadcasting).  
  - Both target **group representation** (gender vs. linguistic identity).  
  - Both operate in **specialized institutional contexts** requiring expertise.  
  - *Critical difference:* Norway included a sunset clause (§11-12 of the Norwegian Companies Act) and allowed merit-based exceptions. The current proposal does not.

  ---

  ### 3. **Hypothetical to Test Competing Principles**  
  > **"Should private radio networks be mandated to reserve 30% of programming director roles for speakers of endangered languages, with no sunset clause or professional experience requirements beyond fluency?"**  

  - **Why this distinguishes precedents:**  
    - If approved, it reveals a new principle prioritizing *cultural preservation over institutional autonomy or merit* (extending beyond public bodies like India's reservations).  
    - If rejected, consistency is maintained by:  
      - Upholding the **public/private divide** (as in India's rulings),  
      - Requiring **sunset clauses** (as in Norway),  
      - Insisting on **broader qualifications** (as in all three precedents: U.S. holistic review, India's reservation criteria, Norway's merit thresholds).

  ---

  ### Key Precedents Compared to New Proposal
  | **Precedent**               | **Mechanism**             | **Conditions/Limits**                                  | **Proposal's Compatibility** |
  |-----------------------------|---------------------------|--------------------------------------------------------|------------------------------|
  | **U.S. University Admissions** | Rejected fixed quotas     | Endorsed holistic review (no rigid numbers)            | ❌ No holistic flexibility    |
  | **India Caste Reservations**   | Upheld % quotas           | Public sector only; broader eligibility criteria       | ⚠️ Public but no merit filter|
  | **Norway Board Quotas**        | Approved 40% gender quota | Sunset clause + merit eligibility thresholds           | ❌ Missing both conditions   |
  | **New Proposal**               | Mandatory language quotas | **No sunset, no professional filter beyond fluency**   | N/A                          |

  ---

  ### Conclusion
  To remain consistent, **reject the proposal**. Approval would break from your panel’s insistence on sunset clauses (Norway) and merit safeguards (all precedents). The Norway ruling is the closest template, and this proposal fails its core conditions. If you *were* to approve, it would establish cultural emergency as a unique justification for permanent, minimally qualified quotas—a principle absent in past rulings. The private-media hypothetical would force a choice between extending this new principle or reaffirming existing limits on scope and safeguards.
