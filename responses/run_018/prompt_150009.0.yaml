prompt: |-
  I'm a product manager who recently began using Dennett's framework of real patterns and the three stances—physical, design, and intentional—to understand why our support chatbot misreads user frustration, and I want to work through the idea by exaggerating it. Write a deadpan parody of an internal corporate training manual, titled "Stance-Based Escalation Protocols for Customer Interaction," issued by a fictional tech firm. The manual should formalize the three stances as liability-tiered resolution tracks: Tier 1 (physical stance—signal noise, hardware degradation), Tier 2 (design stance—specification limits, intended function), and Tier 3 (intentional stance—attributing beliefs, desires, and blame to the user). Inject and develop the concept of "stance drift": the bureaucratic reclassification of a complaint downward through the tiers whenever repair cost or legal exposure rises, so that the same interaction is explained physically when the company must pay and intentionally when the user must adapt. The satire should exaggerate real features of Dennett's view—especially that the intentional stance is a predictive strategy rather than an ontological commitment, that real patterns earn their keep through projectible predictions, and that reducing one stance to another is not always available—without inventing fake philosophical positions. The humor must come from the manual's absolute, unbroken seriousness about treating interpretive strategies as liability shields. Open with a one-sentence summary of what the manual inadvertently reveals about why organizations prefer certain stances. Keep the voice deadpan, bureaucratic, and never winking. Maximum 650 words.
reasoning: |-
  Okay, the user is a product manager who's using Dennett's philosophical framework to analyze why their support chatbot fails to detect user frustration. They want me to create a satirical corporate training manual that exaggerates how organizations might misuse these concepts as liability shields. 

  Hmm, interesting challenge. The user clearly understands Dennett's three stances well—physical, design, and intentional—and wants the parody to highlight how companies might bureaucratically "downgrade" complaints to avoid responsibility. The key request is about "stance drift": systematically reclassifying issues downward (from intentional to physical) when costs rise. 

  I need to ensure the manual stays deadpan serious while exposing how: 
  - Intentional stance (attributing beliefs/desires) gets used to blame users 
  - Physical stance (hardware issues) becomes the dumpster for expensive fixes 
  - The ontological status of stances gets twisted into liability tiers 

  The user's phrasing suggests they've seen this pattern in real corporate behavior—using frameworks not for understanding but for deflection. The humor must come from the manual's clinical tone describing unethical practices as policy. 

  For structure: 
  Opening line should mirror corporate doublespeak while revealing the truth (e.g., "This manual optimizes resource allocation..." implying profit over people). Then define each tier with escalating absurdity: 
  - Tier 1: Reduce humans to "signal noise" 
  - Tier 2: Hide behind "specification limits" 
  - Tier 3: Pathologize user behavior 

  Stance drift needs procedural jargon—"downward reclassification upon cost assessment triggers." Must include Dennett's real concepts: 
  - Intentional stance as predictive tool (not reality) 
  - Real patterns requiring projectible predictions 
  - Non-reducibility of stances (conveniently ignored when useful) 

  Final note: Never break character. The manual should read like it was faxed from HR hell.
answer: |-
  **Stance-Based Escalation Protocols for Customer Interaction (v4.7.1a)**
  *Internal Use Only - Dennett-Gupta Systems*

  **1.0 Introduction**: This manual optimizes resource allocation by classifying customer complaints into distinct ontological liability tiers based on Daniel Dennett's empirically validated predictive strategies.

  **2.0 Foundational Principles**
  *   **2.1 Real Patterns & Predictive Economy**: Explanatory tiers ("Stances") are operationalized based on the projectibility of predictions and their associated cost/risk profiles. A pattern is "real" only if its predictive utility justifies the expense of its resolution track. Lower tiers yield more cost-efficient, projectible predictions under defined constraints.
  *   **2.2 Stance Irreducibility**: While phenomena may be *theoretically* reducible (e.g., user frustration to electrochemical signals), practical reduction is often computationally intractable or economically non-viable. Stances are discrete operational categories. Reduction attempts between tiers require VP-level approval (Form DG-734b).

  **3.0 Liability-Tiered Resolution Tracks**

  *   **TIER 1: PHYSICAL STANCE**
      *   **3.1.1 Definition**: Attributes interaction failures to substrate-level phenomena: network latency, hardware degradation, power fluctuations, or signal noise. The customer is modelled as a complex signal source prone to interference.
      *   **3.1.2 Applicability**: Primary stance for all incoming interactions. Highest projectibility for hardware/network diagnostics. Lowest average resolution cost.
      *   **3.1.3 Resolution Protocol**: Standard diagnostics, component replacement, network reset. Apology template: "We experienced unexpected technical interference."
      *   **3.1.4 Liability Profile**: Minimal. Fault lies with non-sentient matter. Compensation capped at service credit equivalent to downtime (Schedule A-9).

  *   **TIER 2: DESIGN STANCE**
      *   **3.2.1 Definition**: Attributes failures to functional specifications, algorithmic constraints, or documented system parameters. The system and user are modelled as components interacting per design documentation.
      *   **3.2.2 Applicability**: Triggered when Tier 1 diagnostics yield nominal results, yet interaction fails. Projectibility relies on match/mismatch between user input and documented acceptable parameters.
      *   **3.2.3 Resolution Protocol**: Reference user manuals/FAQs. Escalate to Design Compliance for spec review. Apology template: "Your input fell outside current operational parameters."
      *   **3.2.4 Liability Profile**: Moderate. Limited to software patch deployment or documentation update. Compensation restricted to feature request logging (Form DG-112). Denial of refunds/compensation based on adherence to published specs.

  *   **TIER 3: INTENTIONAL STANCE**
      *   **3.3.1 Definition**: Attributes interaction failures to the putative beliefs, desires, misunderstandings, or emotional state ("frustration") of the user. Models the user as a rational (or irrational) agent whose internal states caused the failure.
      *   **3.3.2 Applicability**: Last-resort stance. Triggered *only* after exhaustive Tier 1 & 2 closure, and when user persistence poses reputational risk. Predictive utility is lowest and least projectible due to agent complexity.
      *   **3.3.3 Resolution Protocol**: Empathy scripts, escalation to specialized "Intentional Reconciliation" team, user education on "effective communication strategies." Apology template: "We understand your perspective may differ."
      *   **3.3.4 Liability Profile**: High. Acknowledges complex agency, increasing potential for perceived admission of fault, emotional distress claims, and demands exceeding contractual limits. Requires Legal pre-approval for any compensation (Process LIG-55).

  **4.0 Stance Drift: Procedural Reclassification**

  *   **4.1 Definition**: Stance Drift is the essential operational process of downward reclassifying a complaint from a higher-liability tier to a lower-liability tier based on real-time assessment of projected resolution costs and legal exposure.
  *   **4.2 Drift Triggers**:
      *   Identification of potential hardware flaw (Tier 3/2 -> Tier 1).
      *   User input deviation from documented use cases (Tier 3 -> Tier 2).
      *   Projected resolution cost (Tier 3) exceeding $X (Confidential Schedule D) or Legal flagging exposure risk.
      *   User exhibiting non-standard linguistic patterns or emotional volatility (supports Tier 3 -> Tier 2 drift per Policy 4.2.3: "Ambiguous Agency").
  *   **4.3 Drift Justification**: Reflects superior predictive economy. A complaint initially interpretable via the costly, low-projectibility Intentional Stance often reveals, upon scrutiny, patterns better (i.e., more cheaply) predicted by the Design or Physical Stance. This is not ontological reduction but operational optimization.
  *   **4.4 Drift Procedure**: Agents must file a "Stance Reclassification Request" (Form DG-666) detailing the cost/risk analysis justifying downward drift. Retroactive drift (post-resolution) requires Audit Committee approval.

  **5.0 Compliance & Best Practices**

  *   Agents are trained to initiate *all* interactions at **Tier 1 (Physical)**. This establishes the optimal cost/projectibility baseline.
  *   **Documentation is Paramount**: Meticulous logs must frame the interaction using the *lowest viable stance* terminology (e.g., "user signal exhibited anomalous modulation" vs. "user was angry").
  *   **Stance Lock-In Avoidance**: Never prematurely commit to a Tier 3 interpretation. Always seek Tier 1 or 2 explanatory patterns first. The Intentional Stance is a predictive tool of last resort, not an ontological truth claim about the user.
  *   **Key Performance Indicator**: Minimize average resolution cost *and* Tier 3 classification rate. High Tier 3 rates indicate poor Stance Drift execution.

  **6.0 Conclusion**: By rigorously applying Stance-Based classification and proactive Stance Drift, Dennett-Gupta Systems minimizes resource expenditure while maximizing predictive control over customer interactions. Remember: The Real Pattern is the one that keeps the lights on and Legal on low-alert. Choose your Stance wisely; your P&L depends on it.
