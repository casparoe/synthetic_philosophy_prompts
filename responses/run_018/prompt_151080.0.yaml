  For structure, I'll create a step-by-step flowchart with tests and branches. Tests should be simple: yes/no questions based on evidence a curator can check quickly. At each step, I need to specify what counts as sufficient - like "definite evidence" meaning clear artifacts or texts outside the narrative.

