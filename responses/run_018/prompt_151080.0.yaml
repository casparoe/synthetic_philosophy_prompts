  2. King Arthur: Earliest texts like Historia Brittonum are centuries after he supposedly lived, with sparse details. Later romances add magic and anachronisms rapidly. Archaeological evidence like Tintagel is ambiguous. Probably "legend with a recoverable historical kernel."

