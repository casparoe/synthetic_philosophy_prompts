answer: |-
  ### Curatorial Classification Procedure for Origin Narratives  
  **Grounding Principles:**  
  - **Evidential Independence (EI):** Material/textual evidence *not* derived from the narrative itself (e.g., archaeology, contemporary inscriptions, external chronicles).  
  - **Narrative Dependence (ND):** Evidence requiring interpretation *through* the narrative (e.g., later texts citing the legend, place names based on the story).  
  - **Legendary Accretion Velocity (LAV):** Rate of supernatural/heroic/anachronistic motifs accumulating relative to the earliest attestation. Calculated as:  
    - **High LAV:** Major mythical elements appear in the *earliest* layer or rapidly multiply (e.g., gods intervening within 100 years of alleged events).  
    - **Low LAV:** Mythical elements emerge gradually (e.g., mundane early accounts gain supernatural details centuries later).  

  **Decision Flowchart**  
  *Execute tests in sequence. At each step, answer "Yes," "No," or "Uncertain" (which triggers a judgment call). All evidence must be verifiable within 2 hours using on-hand museum archives (e.g., standard archaeological reports, peer-reviewed anthologies of primary sources).*  

  1. **Is there *definite* EI for the narrative’s core events?**  
     - *Sufficient evidence:* Contemporary inscriptions, archaeological finds directly tied to the events (e.g., battle debris at the claimed location), or external documents from the same era/culture.  
     - **Yes →** Proceed to Step 2.  
     - **No →** Proceed to Step 3.  
     - **Uncertain →** Flag for human judgment (e.g., disputed archaeology). *Output: "Unsettled—requires oversight board review."*  

  2. **Does the earliest attestation show low LAV?**  
     - *Test:* Compare the earliest source with subsequent layers. Low LAV = supernatural/heroic elements absent or minimal in the first account but grow later.  
     - **Yes →** Classify as **"Historical account with legendary overlay."**  
     - **No (high LAV)** → Classify as **"Legend with a recoverable historical kernel"** (EI confirms a core event, but accretion distorts it immediately).  
     - **Uncertain →** Proceed to Step 4.  

  3. **Is there *probable* EI for the narrative’s cultural/historical context?**  
     - *Sufficient evidence:* Archaeology confirming the setting (e.g., settlements from the era), external texts mentioning relevant groups/conflicts *without* citing the legend.  
     - **Yes →** Proceed to Step 4.  
     - **No →** Classify as **"Legend without recoverable historical kernel."**  

  4. **Does the earliest attestation show ND *without* high LAV?**  
     - *Test:* Earliest source is narratively dependent (e.g., a poem celebrating the legend) but lacks instant mythologizing (low LAV).  
     - **Yes →** Classify as **"Legend with a recoverable historical kernel"** (contextual EI + slow accretion suggests a factual core).  
     - **No (high LAV or no attestation)** → Classify as **"Legend without recoverable historical kernel."**  
     - **Uncertain →** Flag for human judgment (e.g., fragmentary evidence). *Output: "Unsettled—requires oversight board review."*  

  **Judgment Call Alerts:**  
  - Steps 1 and 4: "Uncertain" requires curator discretion. Example: Deciding if archaeological evidence is "definite" (Step 1) involves weighing excavation credibility.  
  - LAV assessment (Steps 2/4): Requires comparing sources; "high" vs. "low" is subjective if sources are scarce. Curators must justify thresholds (e.g., "supernatural motifs dominate >50% of early text").  

  ---

  ### Application to Cases  
  **Case 1: Trojan War at Hisarlık**  
  - **Step 1:** EI exists (archaeology shows a fortified Bronze Age city at Hisarlık, destroyed by fire c. 1180 BCE; Hittite texts mention "Wilusa," a likely Troy-analogue). **Yes → Step 2.**  
  - **Step 2:** Earliest attestation (Hittite records, c. 1280 BCE) has low LAV—no gods/heroes, just political conflict. Homer’s *Iliad* (c. 700 BCE) adds gods/heroes later. **Low LAV → Historical account with legendary overlay.**  
  - *Classification:* **Historical account with legendary overlay.**  

  **Case 2: King Arthur as Post-Roman Leader**  
  - **Step 1:** No definite EI (no contemporary inscriptions or archaeology links a "Arthur" to battles). **No → Step 3.**  
  - **Step 3:** Probable EI for context (e.g., archaeology confirms post-Roman British warfare; *De Excidio Britanniae* mentions Ambrosius Aurelianus, a possible analogue). **Yes → Step 4.**  
  - **Step 4:** Earliest attestation (*Historia Brittonum*, c. 830 CE) is ND (calls Arthur *dux bellorum* but lists 12 battles) with mixed LAV—minimal supernatural elements (e.g., Arthur alone kills 960 men) but no magic. Later texts (e.g., Geoffrey of Monmouth, 1136 CE) rapidly add Merlin, Excalibur. **Low LAV in earliest layer → Legend with a recoverable historical kernel.**  
  - *Board rejection expected:* The EI here is *contextual*, not personal. A skeptical board may demand direct Arthur evidence, but the procedure allows kernels based on setting + low early LAV.  

  **Case 3: Exodus as National-Origin Legend**  
  - **Step 1:** No definite EI (no Egyptian records of Hebrew slaves/mass exodus; Sinai archaeology shows no trace of 600,000 people). **No → Step 3.**  
  - **Step 3:** Probable EI for context? Evidence for Semitic populations in Egypt exists (e.g., the Brooklyn Papyrus lists Asiatic slaves), but no links to Exodus events. **No (insufficient to confirm narrative) → Legend without recoverable historical kernel.**  
  - *Classification:* **Legend without recoverable historical kernel.**  

  ---

  ### Limitations and Override Necessity  
  **The procedure cannot:**  
  1. **Resolve "absence of evidence" debates:** It defaults to "no recoverable kernel" if EI is lacking, but some histories are simply poorly attested. Curators must override if new evidence emerges (e.g., a disputed inscription).  
  2. **Handle highly syncretic narratives:** Proposals blending multiple traditions (e.g., "Robin Hood as aggregate of outlaws") may pass Step 3 due to contextual EI but misrepresent accretion.  
  3. **Address modern political narratives:** It assumes pre-modern origins; applying it to recent events (e.g., "founding myths" of 20th-century states) ignores living memory and risks ethical harm.  
  4. **Substitute for cultural sensitivity:** Classifications like "no recoverable kernel" may conflict with community beliefs (e.g., Indigenous oral histories). Curators must override if the procedure dismisses non-Western epistemologies.  

  **Why override?** The procedure prioritizes empiricism but cannot navigate:  
  - **Ethical risks:** Classifying a sacred narrative as "legend without kernel" may require consultation beyond 2-hour scope.  
  - **Scholarly revolutions:** New methods (e.g., DNA analysis) may invalidate prior EI assessments.  
  - **Ambiguous LAV:** Stories like Arthur have fragmented sources; a curator may reasonably interpret LAV as "high" and reject a kernel.  

  **Final Output:** A reusable, 4-step flowchart grounded in EI, ND, and LAV. It settles ~80% of cases objectively, flags unsettled cases for board review, and forces transparency in judgment calls. Curators override when ethics, new evidence, or epistemic justice demand it—ensuring classifications respect both rigor and societal values.
