  **REPUBLIC OF ORDINALIA**  
  **ELECTORAL INTEGRITY ACT (Article I Compliance)**  
  **Section 7: Implementation Protocols**  

  **1. Preamble:** Pursuant to Constitutional Article I (Gibbard-Satterthwaite Mandate), all elections featuring ≥3 alternatives must satisfy Unrestricted Domain (all preference orderings permitted), Surjectivity (all alternatives potentially winnable), Strategy-Proofness (no incentive for preference misrepresentation), and Non-Dictatorship. Non-compliance is a Class 1 Constitutional Breach.

  **2. Pre-Preference Harmonization (PPH):**  
      2.1. The Pre-Preference Harmonization Office (PPHO) is mandated to reconcile voter preference diversity with strategic stability.  
      2.2. Upon candidate registration closure, the PPHO shall apply Algorithm 7-Delta ("Harmonic Convergence") to the registered candidate set (|C| ≥3).  
      2.3. Algorithm 7-Delta output shall be a pairwise subset {A, B} ⊂ C, designated the "Electorally Viable Duopoly" (EVD).  
      2.4. Rationale: Unrestricted Domain over {A, B} inherently satisfies Strategy-Proofness and Non-Dictatorship per Theorem stipulations for |C|=2. Surjectivity is preserved as A or B must win.  

  **3. Voter Registration & Preference Declaration:**  
      3.1. All citizens must file **Form 9-C: Affidavit of Non-Manipulative Intent & Full Preference Spectrum Disclosure** with the Electoral Purity Bureau (EPB) ≥30 days pre-election.  
      3.2. Form 9-C requires:  
          - 3.2.1. A complete, strict, transitive ranking of *all* registered candidates (Unrestricted Domain compliance).  
          - 3.2.2. Submission under penalty of Perjury (Strategic Deterrence Statute).  
      3.3. The declared top-ranked candidate on Form 9-C constitutes the citizen's "Sovereign-True Preference" (STP).  

  **4. Voting Procedure:**  
      4.1. The ballot shall present only the PPHO-designated EVD: {A, B}.  
      4.2. Citizens shall cast a single vote for either A or B.  
      4.3. The alternative receiving >50% of votes cast is declared the preliminary winner.  

  **5. Post-Election Validation & Strategic Intent Tribunal (SIT):**  
      5.1. The Strategic Intent Tribunal (SIT) shall cross-reference ballot selections with Form 9-C STPs.  
      5.2. Contradiction Analysis:  
          - 5.2.1. If a citizen votes for candidate X ∈ {A, B}, but their STP ranks Y ∈ {A, B} higher than X, a "Manipulative Discrepancy" (MD) is logged.  
          - 5.2.2. MD constitutes prima facie evidence of strategic voting, violating Strategy-Proofness.  
      5.3. Penalty: Per MD instance, citizen is fined Ordinalian Credits (OC) 500 + (10 * |C|) and assigned mandatory "Cardinal Utility Re-education" (CURE Module 4).  

  **6. Emergency Benevolent Dictator Protocol (EBDP):**  
      6.1. If preliminary winner W ∈ {A, B} is *not* the STP of >50% of citizens (as per Form 9-C aggregate), Surjectivity violation is flagged (W lacked universal win potential under true preferences).  
      6.2. The Constitutional Compliance Bureau (CCB) shall invoke EBDP.  
      6.3. A Benevolent Dictator (BD) shall be selected via blind draw from the "Rotating Custodian Pool" (RCP), comprising citizens who scored ≥95% on the Annual Social Choice Aptitude Test (ASCAT).  
      6.4. The BD shall:  
          - 6.4.1. Review aggregate Form 9-C STP data.  
          - 6.4.2. Declare the candidate ranked highest in the aggregate STP ordering as the election victor.  
          - 6.4.3. Dissolve governance authority 24 hours post-declaration (Non-Dictatorship compliance via temporality).  
      6.5. Rationale: The BD acts as a single, strategy-proof decision node *only* under the specific, rare EBDP trigger, thus technically avoiding universal dictatorship while resolving Surjectivity failures.  

  **7. Appeal & Transparency:**  
      7.1. PPHO Algorithm 7-Delta selection criteria are classified State Secret Level Gamma (Strategic Stability Necessity).  
      7.2. SIT MD determinations are final and non-appealable (Electoral Certainty Principle).  
      7.3. EBDP selections are irrevocable acts of sovereign constitutional rescue.  

  **Verdict:** The system meticulously preserves the theorem's formal conditions by bureaucratically collapsing the domain to two alternatives, legally enforcing truthfulness, and outsourcing dictatorship into a brief, randomized, and technically constitutional emergency procedure, thereby achieving impeccable theoretical compliance at the cost of rendering the original democratic intent functionally null.
