prompt: |-
  Okay so this might sound random but I've been going through my grandma's old boxes since she moved into care, and I'm stuck on what's not there. She was a union nurse in the 70s and mentioned strikes all the time, but her papers are just hospital newsletters with management's version of events. It got me thinking about archives as power — not just missing stuff, but structured absence, if that makes sence.

  Anyway, I was trying to apply that idea to a real case and kept coming back to the UK 2011 census, specifically the call to shred individual paper returns after digitizing them, leaving only aggregate stats. I want you to take that episode and run it through the lens of archival silencing: who becomes a 'source' versus a data point, what kinds of future historians or geneologists lose access, and whether destroying the raw forms was neutral housekeeping or an active decision about who gets to exist in the record. I also want you to push back on the theory — like, could shredding actually protect marginalized people from state surveillance later? And what does that tension show about whether archives mainly preserve power or just mirror it?

  Don't worry about citing anyone, I just want the conceptual map. Also I'm taking a course on public history and my prof mentioned something about 'the archive's negative space' which I think relates but I'm not sure how — maybe you could work that in if it's actually relevent and not just jargon.
