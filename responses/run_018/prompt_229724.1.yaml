  Okay, let me approach this user request methodically. The user wants a focused just war theory analysis of the Hiroshima/Nagasaki decision using the Franck Report passage as a pivot, with four specific components. 

  First, I need to unpack the Franck Committee's consequentialist framing. Their avoidance of civilian immunity arguments is striking - it suggests either a deliberate strategic choice (framing arguments in terms policymakers would accept) or genuine moral prioritization of long-term consequences. The strongest just war reconstruction would position the demonstration as fulfilling both discrimination (by avoiding civilians) and proportionality (by enabling future arms control), but this risks distorting their actual state-focused reasoning.

  For the criteria application, the key challenge is modeling "last resort" with probabilistic alternatives. The blockade, Soviet entry, and conditional surrender weren't certainties but probability distributions. Just war theory's binary framing struggles here - we need to evaluate decision-making under uncertainty rather than deterministic outcomes. 

  Nagasaki presents a unique problem: was this a separate military act or part of a single strategy? The three-day gap seems clearly insufficient for deliberation, suggesting the second bombing fails both discrimination and last resort more severely than Hiroshima. But just war theory lacks tools to analyze rapid-sequence WMD use.

  The supreme emergency doctrine feels relevant but inadequate. While it permits violating jus in bello rules for existential threats, Japan in August 1945 wasn't an existential threat to the US - which makes invoking it here potentially dangerous for normative frameworks. This case exposes just war theory's limitations in handling unprecedented weapons where consequences are global and permanent.

  The user clearly knows the historiography well, so I should avoid rehashing standard debates. Their focus on the Franck Report's moral grammar suggests deeper interest in how ethical frameworks adapt (or fail to adapt) to technological ruptures. I'll emphasize how the unspoken civilian immunity concern in the report reveals just war theory's core tension: its principles are universal but its application requires context-sensitive judgment that often gets overshadowed by consequentialism in practice.

  For structure, I'll move from textual analysis to theoretical application, then use Nagasaki to show systemic gaps, finally letting the historical dilemma critique just war theory itself. The conclusion should argue that while the theory provides necessary constraints, its tools become blunt when dealing with both radical uncertainty and weapons that alter the very nature of warfare.
