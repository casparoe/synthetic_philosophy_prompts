  3. **Evidential Decision Theory (EDT)**: EDT uses conditional probabilities. A knows that it is identical to B. So, if A shares, that is evidence that B will also share (because they are the same). Similarly, if A does not share, that is evidence that B will not share. Therefore, the conditional probability P(B shares | A shares) = 1, and P(B does not share | A shares) = 0. Similarly, P(B shares | A doesn't share) = 0? Actually, it's the same reasoning: if A doesn't share, then because B is identical, B also wouldn't share. So:
