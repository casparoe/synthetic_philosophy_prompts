  First, I need to recall Devlin's core argument: that shared morality is essential for social cohesion. The Wolfenden Committee proposed decriminalizing private homosexual acts, which Devlin would see as eroding moral boundaries. The parliamentary resistance to this—especially the concerns about "normalizing" homosexuality and protecting youth—aligns perfectly with Devlin's fear of moral disintegration. The Committee's privacy compromise doesn't actually resolve Devlin's concern; it just moves the threat indoors, leaving society's foundational norms vulnerable. 

  Next, Hart's harm principle. The 1967 Act partially decriminalized homosexuality but kept higher age limits and public decency laws. Hart would celebrate this as progress toward harm-based legislation, but the lingering moral elements—like the unequal age of consent—expose a flaw in his theory. If harm prevention was truly the goal, why 21 instead of 16? Hart can't fully explain this; it's clearly moral symbolism disguised as harm prevention. 

  The asymmetrical age of consent is the wildcard here. Neither philosopher anticipated how such a "compromise" would function symbolically—not quite harm prevention, not pure moralism, but a way to signal society's lingering disapproval. This reveals a gap in both theories: real-world law often operates in the messy middle. 

  Finally, does this confirm legal moralism? Partially. Devlin was right that law inevitably encodes morality, but Hart correctly showed morality alone isn't sufficient justification. The dichotomy isn't false—harm and morality are distinct—but in practice, they tangle. The key takeaway is how law's symbolic dimensions exceed both frameworks. 

