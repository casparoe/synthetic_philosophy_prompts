answer: |-
  ### Section 1: "The baseline semantics"  
  Indicative conditionals ("If A, then C") express epistemic dependencies within the speaker's current knowledge. They presuppose that the antecedent (A) remains an open possibility. Evaluation occurs across worlds consistent with the speaker’s evidence *at the time of utterance*, holding fixed all known historical facts up to that moment. Crucially, backtracking—revising past events to make A true—is prohibited. If evidence rules out A, the indicative is defective or vacuously true. Counterfactuals ("If A *had* been, C *would have* been") operate differently. They assume A is false in actuality. Evaluation holds the causal history prior to A’s supposed occurrence fixed, then minimally alters later events (or "miraculously" breaks laws) to accommodate A. Worlds are ordered by similarity to actuality: those matching actual history until just before A, then diverging minimally. Backtracking is permitted only if required by causal laws, not for epistemic reasons.  

  ### Section 2: "The boundary case and dual-base conditioning"  
  Consider the negotiator’s 2028 utterance: "If the 2030 carbon cap is binding, coastal defenses will be funded by 2035." Under **dual-base conditioning**, this conditional simultaneously invokes:  
  - **R_E (epistemic)**: Worlds compatible with her 2028 evidence (e.g., political uncertainty about the cap).  
  - **R_C (causal-historical)**: Worlds sharing actual history until 2028, with minimal post-2028 deviations allowing A.  
  By 2033, she knows the cap was *not* adopted. Standard semantics conflict:  
  - **Indicative view**: Her original conditional presupposed A’s epistemic possibility. Learning ¬A retroactively undermines this, collapsing R_E. The conditional is either undefined or vacuously true.  
  - **Counterfactual view**: To evaluate "If the cap *had* been binding..." now, R_C requires holding fixed actual history until 2028 but *revising post-2028 events* (e.g., policy decisions) to allow A. Yet she knows the actual 2028–2030 history (economic pressures, votes) that prevented A. R_C demands altering this known history, violating its own "hold past fixed" principle.  

  ### Section 3: "The update asymmetry"  
  The tension arises from **temporal update dynamics**:  
  - **Indicative collapse**: Learning ¬A eliminates all A-worlds from the original R_E base. The conditional loses its predictive content, surviving only as a triviality (if ¬A, A→C is true). The negotiator’s genuine prediction about causal links *feels* falsifiable, but semantics deem it moot.  
  - **Counterfactual revisionism**: Shifting to a counterfactual preserves the causal intuition but requires treating the actual 2028–2030 period—now known historical fact—as mutable. This clashes with R_C’s mandate to minimize deviations from actuality.  
  The divergence appears **semantic**: The indicative’s truth depends on R_E-worlds (now inaccessible), while the counterfactual’s depends on R_C-worlds with altered history. Pragmatically, the original utterance functions as a prediction (forward-looking, evidence-relative), while the later counterfactual is a retrospective simulation. An agent *cannot* coherently apply both evaluations simultaneously: R_E demands no backtracking from known facts, while R_C necessitates it. Asserting both would imply contradictory historical possibilities.  

  ### Section 4: "Diagnosis of dual-base conditioning"  
  Dual-base conditioning intensifies the paradox: R_E and R_C can **simultaneously validate contradictory consequents**. In 2028, R_E might support "If binding cap, funded defenses" (based on policy models), while R_C might support "If binding cap, defenses *unfunded*" (if actual 2028 conditions—e.g., austerity—would causally necessitate cuts despite the cap). Thus, a single conditional could be true under R_E and false under R_C. Merging the bases doesn’t resolve the conflict; it exposes it.  

  **Conclusion**: The divide is best explained by a **difference in modal base**, not just speech-act force. Indicatives anchor to the speaker’s epistemic present; counterfactuals anchor to causal-historical actuality. The key feature preserving the distinction is the **epistemic openness of the antecedent**. If the negotiator had *known* in 2028 that the cap wouldn’t be adopted, her utterance must be counterfactual ("If it *had been*..."), collapsing the ambiguity. Dual bases fracture, rather than unify, conditional meaning.
