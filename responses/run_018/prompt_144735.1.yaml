  In my bio-philosphy group the adaptionism debate has stalled in a frustrating loop: adaptationists want selective stories for every trait backed by null-model testing, pluralists cite the classic spandrels critique and call it just-so storytelling. They all agree spandrels and exaptation happen, yet they never move on whether human language is an adaptation, an exaptation, or a spandrel of brain scaling. Is this really a hidden empirical disagreement about how often null models fail, or are they answering different questions—historical causation versus current utility—under one heading? Or is it bedrock intuitions about parsimony that can't be argued for? Say what kind of stall this is and what, if anything, would count as progress: a formal result, an experiment, or just recognizing two research programs? Please also say how confident you are and flag the point you're least sure about.
