  Where might this reasoning crumble? Primarily in assuming isomorphic mapping between symbolic systems and subjective experience. Also, the "merely descriptive" stance risks underestimating how fundamental certain constraints might be. If all possible conscious systems mathematically require invariant substrates, that descriptive boundary starts looking ontological.

