  3.  **Refund:** If arbitration overwhelmingly (≥80% panel consensus) sides with the position that *fundamental continuity with the original signatory is lost or indeterminable*, a **partial refund** may be issued. This refund is calculated as follows:  
      `(Total Fees Paid) x (1 - (Current Silicon Integration Percentage / 100)) - (Neurocompatibility Fees + Non-Refundable Consciousness Mapping Deposit)`  
