          5.  If disputes persist, initiate Branching Continuity Mediation Protocol (see Refund Policy).

  **Q: What is the Branching Continuity Dispute (BCD) Refund Policy?**  
  A: SynapseGradual acknowledges that subjective experiences of identity continuity post-procedure, especially after non-monotonic events like pauses, may vary among observers (including the client's own pre-migration perspective). If a formally documented BCD arises – where significant parties (e.g., pre-pause client log, biological family, post-pause client entity) fundamentally disagree on "who" or "what" currently exists and its link to the original subscriber – we offer the following resolution:

  1.  **Mediation:** Mandatory session with a SynapseGradual Continuity Liaison (trained in basic phenomenology and conflict resolution).
