answer: |-
  Here are eight interview questions designed to probe the guest's unique view deeply, with concise follow-ups anticipating her likely responses:

  1.  **Core Mechanism Question:** "You describe the statue's persistence as dependent on an 'unbroken causal chain of artistic intention.' Could you elaborate on the *specific mechanism* by which this chain operates differently from, say, a curator simply *intending* for an object to *represent* the original statue? How does this avoid reducing formal causation to a mental act about an object, rather than constituting the object itself?"
      *   *Anticipated Answer/Likely Follow-up (If she emphasizes transmission):* If she stresses the *transmission* of form-specifying intent through actions like restoration or replication: "So, is the crucial element the *passing on* of the specific formal blueprint via intention-informed action? How does this differ from a sculptor merely copying a form they admire?"

  2.  **Unknown/Disputed Intentions:** "Much classical art has lost its original creator's specific intent. You've suggested 'expert consensus' can substitute in maintaining the causal chain. What happens when experts fundamentally disagree on the *essential* formal properties of a damaged piece – say, whether an arm was raised or lowered? Does the statue cease to exist during the dispute, or does the chain fragment?"
      *   *Anticipated Answer/Likely Follow-up (If she relies on best judgment):* If she argues for reasoned interpretation based on evidence as sustaining the chain: "Doesn't this risk making the statue's persistence contingent on the *epistemic state* of experts rather than an objective historical chain? Could two equally justified but conflicting interpretations create two distinct formal entities from the same fragments?"

  3.  **Digital Replica & CAD Identity:** "Consider a perfect 3D-printed replica generated from the *identical CAD file* used for the original statue, but printed centuries later on a different machine with different substrate. By your criteria, is this replica the *same formally caused statue* as the original, or a new instance? Why or why not?"
      *   *Anticipated Answer/Likely Follow-up (Likely "No"):* If she argues "no," emphasizing the broken chain: "If the CAD file perfectly encodes the original formal intention, and its *use* constitutes a new act of formal causation, why isn't printing it just the *latest step* in the original statue's chain? What's missing besides the chain of custody?"

  4.  **Gradual vs. Sudden Replacement (Ship of Theseus):** "Your view seems tailored for gradual replacement (restoration) or substrate-swapping (3D printing). How does it handle a Ship-of-Theseus scenario where *all* the original clay is replaced plank-by-plank over time *without* any specific restorative 'intention' guiding each replacement, perhaps just maintenance? Is the resulting ship the same formally caused entity?"
      *   *Anticipated Answer/Likely Follow-up (If she requires intention):* If she says "no" because maintenance intention isn't sufficiently formal-specific: "Doesn't this imply that most ordinary artifacts (like constantly maintained ships or buildings) *lack* formal persistence on your view, existing only as aggregates until a specific formal intention is reapplied?"

  5.  **Accidental Destruction & Re-creation:** "Suppose a classical statue is completely pulverized by an earthquake. Later, using detailed records and the *original artist's explicit instructions*, artisans meticulously recreate it atom-for-atom from new material. Is this the *same statue*? If not, what precisely breaks the chain – the physical discontinuity, or the temporal gap? If yes, how does this differ from the CAD case?"
      *   *Anticipated Answer/Likely Follow-up (Likely "No"):* If she argues "no," emphasizing the essential unbroken physical chain: "Does this mean formal causation *requires* some minimal physical continuity, even just a single molecule, to anchor the chain? Or is the chain purely abstract/intentional, broken solely by the complete cessation of the entity's instantiation?"

  6.  **Non-Art Artifacts:** "Could your 'formally caused entity' framework apply beyond artworks? Consider a historically significant tool, like an ancient plow, painstakingly restored over centuries with gradual part replacement guided by the *intention to preserve its function*. Is this the same formally caused plow?"
      *   *Anticipated Answer/Likely Follow-up (If she draws a distinction):* If she distinguishes artistic from functional intent: "Doesn't this risk making persistence overly dependent on *our classification* of the object's purpose? Is the persistence of a ritual object (both art and tool) determined differently than a purely aesthetic one?"

  7.  **Conservation Ethics:** "Your view has practical implications. If a heavily restored classical statue is *not* numerically identical to the original clay object, does this change how we value it ethically or financially? Is it more like a 'descendant' or a 're-enactment' of the original?"
      *   *Anticipated Answer/Likely Follow-up (If she emphasizes continuity of form):* If she argues the formally caused entity *is* the valuable historical artwork despite material changes: "Doesn't this potentially *increase* the justification for radical restoration or substrate replacement, as long as the intentional chain holds, potentially downplaying the value of original material?"

  8.  **The Role of the Substrate:** "You reject standard constitution. What, then, *is* the relationship between the formally caused statue and the *current* clay (or resin, etc.)? Is the substrate merely a temporary 'host' or 'manifestation' without any essential constitutive role? How does this avoid making the statue a type of abstract object?"
      *   *Anticipated Answer/Likely Follow-up (If she insists on embodiment):* If she emphasizes the necessity of *some* physical instantiation: "Does this mean the statue is essentially an embodied pattern, and the specific substrate is contingent? How is this different from a four-dimensionalist 'worm' view, just with an intentional constraint?"

  **Tone & Accessibility Notes:**
  *   Uses clear analogies (Ship of Theseus, plow, host/manifestation).
  *   Avoids overly technical jargon; explains context ("standard constitution," "hylomorphism" implied in #1, #8 but not named).
  *   Follow-ups use phrases like "Could you elaborate...", "Doesn't this imply...", "How does this differ...", prompting deeper clarification without being confrontational.
  *   Connects theory to tangible examples (restoration disputes, CAD files, conservation ethics).
  *   Questions signal the direction of the probe ("pressing her on...", "anticipating her reply...").
