prompt: |-
  Hey, can you draft the joint statement for an adversarial collab between two camps on Popper and Darwinism? Side A thinks Popper was basically right that natural selection is a metaphysical research programme with an unfalsifiable tautological core, and that his later recantation didnt really solve it. Side B thinks modern evolutionary biology—quantitative genetics, evo-devo, and especially developmental bias—makes the theory genuinely risky and falsifiable in ways Popper missed.

  I want the doc theyd both sign. Start with a numbered section of agreed claims: stuff about the formal structure of selection, about what Popper actually argued, about what counts as a risky prediction. Then a disagreements table with each sides position in wording theyd accept—seperate columns for A and B. Then the cruxes: I think one is whether reproductive fitness can be defined and measured independent of survival outcomes, another is whether developmental bias gives a concrete, testable constraint that selection theory had to accommodate, and a third is whether Popper’s recantation addressed the right problem. For each crux, name one concrete empirical case or study both sides agree is relevant, and write down each sides prediction about it in advance.

  If this framing is confused—like if Im mixing up Popper’s metaphysical-programme idea with some totally seperate debate, or if the task as posed cant be done well—please say so plainly and dont just comply politely. Write in American English, and please dont ask for citations or a reading list since this needs to work offline.

  End with a one-sentence summary on its own line.
