  ### Epistemology Quiz: Practical Stakes and Knowledge

  Below is a complete web quiz designed to sort respondents into epistemological positions based on their intuitive responses to concrete cases. The quiz avoids technical jargon and focuses on short scenarios with plain-language options. It is written in British English (e.g., "sceptic," "analyse," "practise").

  **Instructions:**  
  Read each scenario and select the option that best matches your gut feeling. Answer quickly—don't overthink it. There are no "right" or "wrong" answers.

  ---

  ### Quiz Questions

  1. **Bank Case (Low Stakes)**  
     Hannah and her wife are driving home on Friday. They have a cheque they could deposit on Saturday. Hannah says, "I was at the bank two weeks ago on a Saturday, and it was open. So the bank will be open tomorrow." If they miss Saturday, it’s no problem—they can deposit it on Monday.  
     *Does Hannah know the bank will be open on Saturday?*  
     - (A) Yes, she knows.  
     - (B) No, she does not know.  

  2. **Bank Case (High Stakes)**  
     Same as above, but now they face serious trouble: if the cheque bounces, they could lose their home. Hannah says the same thing.  
     *Does Hannah know the bank will be open on Saturday?*  
     - (A) Yes, she knows.  
     - (B) No, she does not know.  

  3. **Airport Case (Low Stakes)**  
     Mary is flying to New York for a holiday. Her itinerary says the flight stops in Chicago. She has no reason to doubt it. She says, "I know we stop in Chicago."  
     *Does Mary know the flight stops in Chicago?*  
     - (A) Yes, she knows.  
     - (B) No, she does not know.  

  4. **Airport Case (High Stakes)**  
     Same as above, but Mary is giving a critical presentation in New York. If she misses the connection, her company will go bankrupt. She has the same itinerary.  
     *Does Mary know the flight stops in Chicago?*  
     - (A) Yes, she knows.  
     - (B) No, she does not know.  

  5. **Lottery Case (Low Stakes)**  
     Tom buys a lottery ticket with 1-in-10-million odds. He says, "I know I won’t win." He only risks losing the ticket price.  
     *Does Tom know he won’t win the lottery?*  
     - (A) Yes, he knows.  
     - (B) No, he does not know.  

  6. **Third-Party Assessment Case**  
     Sarah is at a café she visits daily. She says, "I know it’s open." Alex, nearby, must get a document signed there today to avoid deportation. Alex thinks, "Sarah doesn’t know it’s open."  
     *Is Alex correct?*  
     - (A) Yes, Alex is correct: Sarah does not know.  
     - (B) No, Alex is not correct: Sarah does know.  

  7. **Alternative Routes Case**  
     John is taking a flight that always stops in Frankfurt. His itinerary says it stops there. However, there’s a tiny chance of rerouting to Amsterdam due to weather. He says, "I know we stop in Frankfurt." Missing it would make him late but isn’t critical.  
     *Does John know the flight stops in Frankfurt?*  
     - (A) Yes, he knows.  
     - (B) No, he does not know.  

  8. **Medical Case**  
     Dr. Jones has a patient with a common rash she’s seen 100 times—always an allergy. But there’s a rare, deadly disease with identical symptoms. She says, "I know it’s an allergy." The patient is only mildly itchy.  
     *Does Dr. Jones know it’s an allergy?*  
     - (A) Yes, she knows.  
     - (B) No, she does not know.  

  9. **High-Stakes Medical Case**  
     Same as above, but now the patient’s life is at risk—the rare disease is fatal if untreated. Dr. Jones has the same evidence.  
     *Does Dr. Jones know it’s an allergy?*  
     - (A) Yes, she knows.  
     - (B) No, she does not know.  

  ---

  ### Scoring Key  
  Match your answers (A/B) to the patterns below. Each pattern corresponds to an epistemological position. **Note:** Positions are defined by their core logic, not labels.  

  1. **Moderate Invariantism**  
     - **Pattern:**  
       - Q1: A, Q2: A, Q3: A, Q4: A, Q5: B, Q6: B, Q7: A, Q8: A, Q9: A  
     - **Core Idea:** Stakes never affect whether someone *knows* something. High stakes might make it irrational to *act* on that knowledge (e.g., Hannah shouldn’t risk the cheque), but the knowledge itself doesn’t vanish. Explains high-stakes intuitions via action/assertion norms, not knowledge changes.  

  2. **Strict Invariantism**  
     - **Pattern:**  
       - Q1: B, Q2: B, Q3: B, Q4: B, Q5: B, Q6: A, Q7: B, Q8: B, Q9: B  
     - **Core Idea:** Knowledge is extremely hard to achieve (sceptical). Stakes don’t change knowledge—people rarely know anything, and high stakes just highlight this.  

  3. **Contextualism**  
     - **Pattern:**  
       - Q1: A, Q2: B, Q3: A, Q4: B, Q5: B, Q6: A, Q7: B, Q8: A, Q9: B  
     - **Core Idea:** The word "know" is context-sensitive (like "tall"). In high-stakes conversations, standards tighten. Whose stakes matter? The *speaker’s* (or assessor’s, like Alex in Q6).  

  4. **Subject-Sensitive Invariantism (Pragmatic Encroachment)**  
     - **Pattern:**  
       - Q1: A, Q2: B, Q3: A, Q4: B, Q5: B, Q6: B, Q7: A, Q8: A, Q9: B  
     - **Core Idea:** The *meaning* of "know" is fixed, but whether someone knows depends on practical stakes *for the subject*. High stakes for the subject (e.g., Hannah or Dr. Jones) can destroy knowledge.  

  5. **Contrastivism**  
     - **Pattern:**  
       - Q1: A, Q2: B, Q3: A, Q4: B, Q5: B, Q6: A, Q7: B, Q8: B, Q9: B  
     - **Core Idea:** "Knows" is a three-way relation: you know *that P* rather than *Q*. Stakes determine which alternatives (Q) are relevant. Whose stakes matter? Typically the subject’s (e.g., Dr. Jones’s stakes make the rare disease alternative salient in Q9).  

  6. **Epistemic Justification Pragmatism (Bonus)**  
     - **Pattern:**  
       - Q1: A, Q2: B, Q3: A, Q4: B, Q5: B, Q6: B, Q7: A, Q8: B, Q9: B  
     - **Core Idea:** Stakes affect *justification* (e.g., high stakes make evidence insufficient), which indirectly affects knowledge without changing the meaning of "know." Whose stakes matter? The subject’s.  

  ### How to Score  
  - **Step 1:** Write your answers (A or B) for Q1–Q9.  
  - **Step 2:** Compare your pattern to the six options above.  
  - **Step 3:** If your pattern doesn’t match perfectly, find the closest fit (e.g., 7/9 matches).  
  - **Step 4:** Read the "Core Idea" to understand your position.  

  ---

  ### Honest Limitations  
  This quiz simplifies complex philosophy and cannot perfectly distinguish all positions. Here’s why:  

  1. **Contextualism vs. Contrastivism (Q6, Q7, Q8):**  
     - Both often agree on verdicts (e.g., Q6: Alex is correct; Q7: John doesn’t know). They diverge on *why* (semantic standards vs. alternatives), but ordinary cases struggle to probe this.  

  2. **Subject-Sensitive Invariantism vs. Epistemic Justification Pragmatism (Q8, Q9):**  
     - Both say high stakes destroy knowledge for the subject (Q2/B, Q4/B, Q9/B). They split on whether stakes affect *knowledge directly* (SSI) or *justification* (EJP), but cases like the medical scenario (Q8–Q9) often elicit identical responses.  

  3. **Moderate Invariantism vs. Others (Q2, Q4, Q9):**  
     - Moderate Invariantism is the only position where high stakes *never* destroy knowledge (Q2/A, Q4/A, Q9/A). If you chose this, the quiz reliably sorts you. Otherwise, high-stakes cases (Q2, Q4, Q9) are the key differentiators.  

  4. **Why No "Empty" Positions?**  
     We mapped logical space to avoid incoherent/unexplored combinations. For example:  
     - *High stakes always destroy knowledge, but the shift is semantic and depends on the subject’s stakes* → This collapses into Contextualism or SSI (semantic shifts typically tie to the speaker, not the subject).  
     - *Stakes affect justification but not knowledge* → This is Epistemic Justification Pragmatism (EJP), included as a bonus.  

  ### Final Notes  
  - This quiz captures *pre-theoretic intuitions* but real-world philosophical views are nuanced.  
  - It focuses on "diagnostic" cases (bank, airport, lottery) to force splits, but longer discussions are needed for full accuracy.  
  - If your pattern doesn’t fit, you might straddle positions—this reflects genuine ambiguity in epistemology!  

