  3. **Contextualism (C)**: The word 'know' is context-sensitive. The speaker's standards (or the context of ascription) determine the truth of knowledge claims. High stakes raise the standards.

  4. **Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment (PE)**: The meaning of 'know' is invariant, but whether a subject knows depends on practical factors (stakes) for the subject. High stakes for the subject can destroy knowledge.

