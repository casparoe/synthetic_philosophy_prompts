prompt: |-
  I sit on the grant committee for a small regional foundation—maybe $400k a year, 25 proposals, mostly local nonprofits and some odd advocacy projects—and we're trying to stop arguing in circles about what to fund. A friend mentioned the importance-tractability-neglectedness framework from cause prioritization, which sounds smart, but when we try to apply it to our actual pile it just collapses. We get direct stuff like food-bank equipment and weird indirect stuff like a journalist fellowship on water rights, and nobody knows how to compare them. Can you turn ITN into a real decision procedure I could actually run in a meeting? I need the questions in strict order, what counts as a sufficient answer at each step, where the procedure gives a hard no, and where it stops being facts and becomes values so we just vote. It needs to work for people without econ backgrounds, say what to do when you can't get a real number, and be honest about which steps are just judgment calls dressed up as procedure. Then apply it to two proposals: upgrading refrigeration at a food bank (direct, easy to understand) and a three-year fellowship for a journalist covering state water policy (indirect, high stakes, unclear tractability). Please include at least one case where the procedure spits out an answer my committee will hate, so I can see where it breaks. Also, seperate what's actually settled in the literature on this framework from what's genuinely contested—don't present one view on weighting importance vs tractability as if it's the consensus—because I need my board to know exactly where they're faking precision.
reasoning: |-
  Okay, the user is on a grant committee for a small foundation dealing with $400k annually across 25 proposals. They're stuck in endless debates about funding decisions. A friend suggested the ITN framework (Importance, Tractability, Neglectedness), but they're struggling to apply it to real-world proposals like food bank refrigerators versus journalist fellowships on water rights. 

  Hmm, their core frustration is about comparison paralysis—how to weigh concrete immediate needs against vague systemic change. The committee likely has diverse values (pragmatists vs idealists) and limited capacity for heavy research. They need a procedural scaffold to force decisions without pretending false precision.

  Breaking this down: First, the request demands extreme operationalization—strict sequence, clear thresholds, designated vote points. Must flag where "data" is actually guesswork. Also explicitly wants two test cases plus one "unpopular output" to stress-test the system. And crucially, warn where academic consensus ends and value judgments begin. 

  *Pauses to consider ITN's fault lines* Literature agrees ITN identifies promising areas but not how to weight components. GiveWell weights tractability heavily; Open Philanthropy cares more about importance. Must expose that tension. Also neglectedness metrics get fuzzy at micro-levels—a local food bank might be "neglected" relative to federal funding but not in their specific community. 

  For the procedure: Need binary checkpoints to force hard no's early (e.g., importance threshold). Define "sufficiency" loosely—"service gaps exist" for food bank, "evidence of policy harm" for journalism. Where quantification fails, use ordinal scales (high/medium/low) with explicit confidence ratings. 

  Test case 1 (Food bank refrigeration): Importance (clear harm, scale measurable) → Pass. Tractability (direct impact, low risk) → Pass. Neglectedness (probably low—many funders like equipment) → Flag as weakness. Outcome: Fund unless neglectedness is disqualifying for committee. 

  Test case 2 (Journalism fellowship): Importance (high but diffuse) → Pass. Tractability (shaky evidence, complex change pathways) → Yellow flag. Neglectedness (likely high) → Strong point. Procedure would push it to discretionary vote at weighting stage. 

  Unpopular output example: A proposal with massive importance (e.g., disaster prep) but abysmal tractability (no credible implementation plan). ITN would kill it early despite emotional appeal—good demonstration of framework overruling instincts. 

  Finally, the presentation must visually separate "settled" (e.g., ITN structure) from "contested" (weighting, neglectedness benchmarks). Committee needs permission to say "here we decide by values." Might add a "tiebreaker" rule: When close, default to neglectedness to maximize marginal impact. 

  *Checks user's hidden needs* They probably also want reduced guilt about saying no and cover to reject "weird" proposals without sounding anti-intellectual. The procedure legitimizes skipping over murky indirect projects.
answer: |-
  Here's a battle-tested ITN decision procedure designed for real committee use, including pain points, judgment flags, and two clear test cases. It separates verifiable facts from unavoidable value judgments.

  **The ITN Grant Decision Procedure (Strict Sequence)**

  1.  **SCREENING: IMPORTANCE THRESHOLD (Is this problem *serious enough* to consider?)**
      *   **Question:** "Does this proposal address a problem causing *significant, identifiable harm* to our community/region *right now*, or an imminent threat likely to cause such harm?"
      *   **Sufficient Answer:** Concrete evidence of harm (e.g., hunger statistics, documented water contamination, shelter waitlists) OR credible, near-term threat analysis (e.g., expert report on imminent aquifer depletion). *Avoid speculative future harms here.*
      *   **Hard NO if:** No evidence of *current* significant harm or *credible, imminent* threat is presented. (e.g., "Raising awareness about a *potential* future issue with no current victims.")
      *   **Judgment Call?** **YES.** Defining "significant harm" and "imminent threat" is inherently value-laden. Requires committee agreement on baseline severity.
      *   **No Data?** Use local news reports, health department stats, testimony from trusted service providers. If *nothing* exists, it likely fails.
      *   **What's Settled:** Importance requires demonstrable harm. **Contested:** How severe must harm be? How near-term is "imminent"? How local must impact be?

  2.  **VIABILITY CHECK: TRACTABILITY GATE (Can *this specific intervention* plausibly make a difference?)**
      *   **Question:** "Is there a *credible causal pathway* showing how *this specific project* (not just general efforts) will *directly reduce* the identified harm within a reasonable timeframe (e.g., 1-5 years), and does the applicant demonstrate the *basic capability* to execute it?"
      *   **Sufficient Answer:** A logical theory of change + evidence the *type* of intervention has worked *somewhere* in a similar context OR strong organizational track record in similar work. For capacity: budget realism, key staff experience, basic operational plan.
      *   **Hard NO if:**
          *   The causal pathway is implausible or relies on numerous improbable external events.
          *   The applicant lacks fundamental capacity (e.g., no relevant staff, budget holes, no plan).
          *   The intervention is known to be ineffective based on robust evidence (e.g., certain types of scare tactics).
      *   **Judgment Call?** **YES.** Assessing plausibility of the theory of change and "basic capability" involves significant judgment. "Evidence" can range from rigorous RCTs to compelling anecdotes.
      *   **No Data?** Prioritize interventions with clearer mechanisms (direct service > advocacy > pure research). Rely on applicant expertise and organizational reputation. If the pathway is *highly* complex or relies on changing powerful entrenched actors with no clear lever, be skeptical.
      *   **What's Settled:** Interventions need a plausible causal mechanism. **Contested:** How strong must evidence be? How direct must the link be? How much does past org success predict future success?

  3.  **MARGINAL IMPACT TEST: NEGLECTEDNESS ASSESSMENT (Is our funding *especially* needed here?)**
      *   **Question:** "Is this *specific problem/intervention* significantly underfunded *relative to its importance and tractability* compared to other approaches to the same problem? Would our grant likely provide substantial *marginal* value (e.g., fill a critical gap, enable something new, leverage other funds) that wouldn't happen otherwise?"
      *   **Sufficient Answer:** Evidence of funding gaps for *this specific need* (e.g., food banks reporting unmet equipment requests) OR demonstration that *this specific approach* is rare/unfunded despite potential (e.g., lack of dedicated water policy journalists). Show why *other* funders aren't covering this.
      *   **Hard NO?** **Rarely a HARD NO here.** Becomes a major weakness, not necessarily fatal. *Exception:* If the field is massively overfunded relative to impact potential (rare in small regional nonprofits).
      *   **Judgment Call?** **YES.** Defining "significantly underfunded" and "marginal value" is highly contextual and comparative. Requires looking at the broader funding landscape.
      *   **No Data?** Ask applicants: "Who else have you asked? Who else funds this *exact* type of work locally?" Check local United Way priorities, community foundation reports. If the problem is highly visible (e.g., homelessness) and many orgs do similar work, neglectedness is likely LOW.
      *   **What's Settled:** Funding is more valuable where it's scarcer relative to impact potential. **Contested:** How to define the relevant "field" for comparison? How much does crowding *really* diminish marginal impact? Is a 10% funding gap enough, or 90%?

  4.  **WEIGHTING & VOTE (Where Values Rule)**
      *   **Question:** "Given the assessment of Importance (I), Tractability (T), and Neglectedness (N) for this proposal, and considering our foundation's mission and values, should we fund it?" (Assign High/Medium/Low scores for I, T, N based on steps 1-3).
      *   **The Vote:** **Mandatory Vote Here.** This is inherently values-driven.
      *   **The Core Conflict:** **There is NO consensus on weighting I vs. T vs. N.** This is the biggest faked precision trap!
          *   **"Direct Impact" View:** Prioritizes High T > High I > High N (Safe, visible results).
          *   **"Leverage/Systemic Change" View:** Prioritizes High I > High N > High T (Swing for the fences on big problems others ignore, even if harder).
          *   **"Marginal Dollar" View:** Prioritizes High N > High T > High I (Maximize the unique difference *your* dollars make).
      *   **Procedure:** Committee must consciously discuss their weighting preference *before* voting on close calls. Acknowledge this is about values, not finding a "correct" answer.

  **Applied to Your Cases:**

  1.  **Proposal: Upgrade Refrigeration at Food Bank (Direct)**
      *   **I (Importance):** **HIGH PASS.** Clear, current harm (hunger/food insecurity). Quantifiable impact (more food stored safely, served to more people). Data: Local hunger stats, food bank capacity reports.
      *   **T (Tractability):** **HIGH PASS.** Direct causal link: New fridge -> more cold storage -> more food distributed. Proven technology. Org clearly capable (runs existing food bank). Low execution risk.
      *   **N (Neglectedness):** **LOW/MEDIUM.** Food banks are a visible need. Local businesses, individuals, other foundations often fund equipment. *Check:* Has this specific request been denied elsewhere? Is their equipment truly failing? *Marginal Value:* High if no one else will fund *this* critical replacement, Medium/Low if others could.
      *   **Procedure Path:** Passes Steps 1 & 2 easily. Step 3 is the weakness. Goes to **Step 4: Vote.** "Direct Impact" view funds easily. "Marginal Dollar" view might hesitate if neglectedness is low. *Likely Outcome:* Strong candidate for funding unless proven massively overfunded.

  2.  **Proposal: Journalist Fellowship on State Water Policy (Indirect)**
      *   **I (Importance):** **HIGH PASS/MEDIUM PASS.** Water policy is high-stakes (health, economy, environment). *But* harm is often diffuse, future-oriented, or affects specific groups. Evidence: Reports on contamination, drought impacts, economic studies. *Sufficient, but less visceral than hunger.*
      *   **T (Tractability):** **MEDIUM/YELLOW FLAG (Judgment Heavy).** Pathway: Fellowship -> Increased quality/quantity of reporting -> Informed public/decision-makers -> Better policy/outcomes. *Plausible but complex.* Evidence: Studies on impact of investigative journalism *generally*; less on *specific* policy change from *one* fellowship. Org capability: Depends on fellowship design & host org reputation. Risk: Reporting might not gain traction or influence policy.
      *   **N (Neglectedness):** **LIKELY HIGH PASS.** Dedicated funding for *local/state-level* environmental policy journalism is often scarce. Few foundations specialize here. *Marginal Value:* Potentially high – might enable work that simply wouldn't happen otherwise.
      *   **Procedure Path:** Passes Step 1. Step 2 is the hurdle – requires a judgment call on plausibility and risk tolerance. Step 3 is likely a strength. Goes to **Step 4: Vote.** "Leverage/Systemic" view prioritizes it (High I, High N, Medium T). "Direct Impact" view may reject it (Medium T, less direct I). *Outcome Uncertain,* hinges on committee's values weighting and risk appetite.

  **The Unpopular Output (Where ITN "Breaks" Values):**

  *   **Proposal: "Save the Local Historic Theater" (Beloved but Low Impact)**
      *   **I (Importance):** **LOW/MEDIUM (Hard Judgment).** Harm: Loss of cultural asset, community gathering space. *But:* Is this "significant harm" compared to hunger/housing? Data: Attendance figures, economic impact study (often small), community sentiment.
      *   **T (Tractability):** **HIGH.** Grant pays for roof repair -> theater stays open. Clear pathway. Capable org (theater board).
      *   **N (Neglectedness):** **MEDIUM/LOW.** Historic preservation often has passionate (though maybe small) donor base. Local government grants might be available. Fundraising events possible.
      *   **Procedure Outcome:** Likely **HARD NO at Step 1** for many foundations focused on basic needs. Importance deemed insufficiently "significant harm" relative to mission. *Why Unpopular?* The theater is beloved, sentimental, has vocal supporters. ITN forces focus on scale of harm and marginal impact, which it may fail. This exposes the value judgment inherent in defining "Importance."

  **Key Takeaways for Your Committee:**

  1.  **Embrace the Sequence:** Steps 1 & 2 screen out non-starters. Step 3 identifies key weaknesses/strengths. Step 4 is where values decide between viable options.
  2.  **Flag Judgment Calls Explicitly:** When discussing I/T/N, constantly ask: "Is this a fact, or is this our judgment?" Label confidence levels (High/Med/Low).
  3.  **Don't Fake Weighting:** Be brutally honest in Step 4: "We are funding this because we prioritize tractability over scale" or "We value trying to change systems even if it's hard."
  4.  **Neglectedness is Often the Weakest Link:** For direct service proposals, expect Low N. Is that acceptable? Define your threshold.
  5.  **Use "Unpopular Outputs" to Test Values:** Run a few known controversial past proposals through. Did ITN lead to a defensible decision, even if unpopular? It reveals your true priorities.

  This procedure won't eliminate debate, but it structures it, forces explicit reasoning, separates facts from values, highlights where precision is impossible, and provides clear off-ramps for non-viable proposals. The vote in Step 4, grounded by the I/T/N analysis, is where your committee's values legitimately take the wheel.
