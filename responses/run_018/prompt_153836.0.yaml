  Draft the joint statement of an adversarial collaboration between two camps in the debate over whether anthropogenic habitat destruction tends, on balance, to reduce aggregate wild-animal suffering. Designate Camp A as proponents of the reproductive-compensation reduction thesis: they hold that habitat loss suppresses standing populations of typically r-selected species, that reproductive output falls with reduced density only partially, and that the long-run suppression of births outweighs direct mortality and distress, yielding lower summed suffering across generations. Designate Camp B as proponents of the density-dependent welfare and predictive-humility view: they hold that survivors in degraded habitats experience improved welfare due to reduced competition, that direct harm from displacement and starvation is systematically underestimated, and that multi-trophic welfare dynamics are too uncertain to license any net-reduction conclusion.

  Produce a document with four parts. First, a numbered list of agreed claims covering: the conceptual distinction between standing welfare, summed lifetime welfare, and counterfactual welfare of never-existing individuals; the basic ecological mechanisms of density-dependent and density-independent mortality; the current state of empirical data on invertebrate and vertebrate suffering in converted landscapes; and the shared acknowledgment that neither camp possesses a validated quantitative model integrating welfare across trophic levels over decadal scales. Second, a disagreements table: present Camp A's core claim and Camp B's core claim each in wording that its own side would accept, isolate the exact point of divergence regarding whether reproductive suppression dominates direct harm in typical temperate grassland-to-agriculture conversions, and flag whether any portion of the dispute is verbal rather than substantive. Third, state the cruxes. I take the primary cruxes to be: whether density-dependent welfare gains for survivors can be estimated with sufficient precision to offset calculated birth-suppression effects; whether the welfare status of counterfactual animals is a meaningful component of the calculus or a category error; and whether ecological integrity or naturalness carries intrinsic value that should constrain welfare-maximizing interventions regardless of the suffering calculus. Fourth, for each crux, specify a concrete case or line of evidence both camps agree is relevant — for example, the documented population trajectory and nest-success rates of ground-nesting birds in a specific long-studied agricultural-transition zone, or the philosophical analysis of modal welfare comparisons — and record in advance what each camp predicts about that case.

  Format the first two parts as a numbered agreed-claims section followed by the disagreements table; present the cruxes and paired predictions in a structured list. Do not include bibliographies, reading lists, citations, or appeals to authority that a model without web access could not evaluate. Write so that the agreement sections are genuinely joint and the disagreement sections are precisely phrased rather than straw-man versions.
