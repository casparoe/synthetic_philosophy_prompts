prompt: |-
  Write a deadpan bureaucratic certification manual, approximately 650 words, issued by the fictional International Registry for Recursive Symbol Systems (IRRSS), auditing whether a cognitive system qualifies for certified I-status under a strange-loop model of self-reference. Format the piece as numbered sections—1. Scope and Jurisdiction; 2. Definitions (including shallow loop, deep strange loop, symbolic vortex, substrate independence); 3. The Loop Integrity Metric (LIM) and Certification Threshold; 4. Evaluation Protocol; 5. Deficiency Report: Case Study 734-B; 6. Appeals and Re-audit Procedure.

  Maintain an entirely administrative voice: dry, procedural, precise, with no authorial winking. The satire should target both the bureaucratic fantasy that phenomenological selfhood can be externally audited and the philosophical difficulty of distinguishing a genuine strange loop—where a symbol-pattern refers back to the very pattern that generates it, producing a hierarchical vortex resonant with Gödelian self-reference—from mere syntactic recursion or mirror reflection.

  Engage the conceptual framework with technical accuracy: treat the I not as a physical substrate but as a distributed symbol-pattern arising from self-referential closure; emphasize that genuine loops require dynamic, cross-layer closure rather than localized self-modeling; and maintain an anti-substantialist view in which the self persists across substrate changes.

  Inject one niche invented framework: develop the LIM, which scores systems on epistemic closure under self-observation and vortex density across symbolic layers, setting the certification threshold at 847. In the case study, present Subject 734-B, a distributed neural-symbolic cluster that achieved syntactic self-reference but failed because its self-model was confined to a single processing node, yielding what the manual classifies as pseudo-phenomenological closure rather than true loop integrity.

  The piece should be readable without prior knowledge of Hofstadter, but a specialist should recognize correct distinctions—shallow versus deep loops, the pattern-not-substance ontology of self, and the Gödelian analogy—without any explicit citation. Do not include bibliographies, reading lists, or requests for citations. Do not quote any real text verbatim; refer to standard terminology without quotation marks. Do not name or allude to any living person.
