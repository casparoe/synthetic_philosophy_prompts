answer: |-
  ## The Crack in the Crystal: Reflexive Drift and the Limits of Good's Theorem

  Good's theorem, a cornerstone of decision theory, offers an almost tautological elegance: for a Bayesian rational agent, acquiring free information (costless, non-strategic) and then acting optimally cannot decrease expected utility. The rationalist conclusion—"never refuse free data"—seems unassailable. Standard objections, like "curiosity killed the cat," are deftly parried: the optimal action *conditions* on the new knowledge, avoiding the trap. Yet, reflexive drift—where information acquisition predictably corrupts the agent's *own* preference ordering—presents a deeper, more insidious challenge. This essay argues that while the formal structure of Good's theorem *can* technically absorb reflexive drift through state-space expansion, this maneuver fails to preserve the normative force of the "always take" imperative for the agent's *ex ante* values. Reflexive drift carves out a principled exception.

  **The Defense: Ex Ante Sovereignty and State-Space Expansion**

  Defenders of Good's theorem have a powerful counter: *ex ante* preferences reign supreme. The agent's current utility function defines "value." Any future change, including preference corruption triggered by information, is merely an *outcome* the agent can evaluate *now*.

  1.  **Modeling the Drift:** The agent can expand the state space `S` to include not only world-states but also possible preference-states `P`. Crucially, the *ex ante* utility function `U_ex-ante(s, p)` assigns value to world-state `s` *and* the agent's preference-state `p` at the time of the final decision. This `U_ex-ante` reflects the agent's current valuation of *being* in a state with corrupted preferences.
  2.  **Information as Revelation:** The information signal `I` (e.g., the emotional forecast) doesn't *cause* corruption magically; it *reveals* which branch of reality the agent is on, including branches where preference drift occurs. Acquiring `I` allows the agent to learn whether she is on a path leading to stable preferences (`P_stable`) or corrupted preferences (`P_corrupt`).
  3.  **Conditional Optimization:** Post-update, the agent acts optimally *given her updated beliefs and her current preference-state `P_actual`*. If `I` reveals `P_corrupt`, she acts according to the corrupted preferences. The key is that the *ex ante* evaluation of this whole process uses `U_ex-ante` to assess the *expected* outcome, including the disutility (if any) of finding oneself with `P_corrupt`.
  4.  **Non-Negativity Holds:** Formally, under this expanded model (`S x P`), Good's theorem applies directly. The agent's `U_ex-ante` expected utility cannot decrease by learning `I`, as she can always condition her subsequent action on the revealed state (including `P`). Refusing free `I` would be suboptimal according to `U_ex-ante`.

  On this view, reflexive drift is simply another form of uncertainty. The agent dislikes `P_corrupt` and assigns a low `U_ex-ante(s, P_corrupt)` to outcomes achieved under its influence. Learning `I` might reveal a high probability of `P_corrupt`, leading to an action that minimizes harm *as evaluated now*. The theorem holds; information remains valuable.

  **The Challenge: The Collapse of Evaluative Continuity**

  The defense relies on the stability and comprehensiveness of `U_ex-ante`. Reflexive drift, by its nature, threatens this foundation:

  1.  **Incommensurability:** Can `U_ex-ante` truly assign a meaningful utility to *being* in state `P_corrupt`? If the corruption fundamentally alters what the agent values (e.g., shifting from valuing long-term flourishing to valuing only immediate euphoria), `U_ex-ante`'s evaluation of `P_corrupt` states may be impossible or nonsensical. The *ex ante* self cannot access the subjective value system of the *ex post* corrupted self to make a fair comparison; it can only judge the *consequences* of that corruption from its own alien perspective. This judgment is inherently limited and potentially unstable.
  2.  **Loss of Self-Direction:** The agent doesn't merely *dislike* the outcomes likely under `P_corrupt`; she *disavows* `P_corrupt` itself as a valid basis for choice. Acquiring `I` initiates a process she *knows* will, with some probability, destroy her capacity to pursue the values she currently holds dear. It's not just learning a bad state exists; it's risking becoming an agent who *no longer cares* about avoiding that state. Good's theorem, applied formally, tells her to accept this risk if the *ex ante* expected `U_ex-ante` calculation favors it. But this calculation requires her to trade off her current values against the *loss* of those very values – a valuation that feels existentially fraught and arguably incoherent.
  3.  **The Paradox of Anticipation:** The agent rationally anticipates that *if* `I` corrupts her, her future corrupted self will *approve* of the actions taken under corruption (from its new perspective). However, her *current* self views this future approval as pathological. Good's theorem, in its expanded form, forces her to incorporate this pathological approval into her `U_ex-ante` calculation as a "benefit" from the perspective of the corrupted state. This feels like a violation of her current evaluative standpoint.
  4.  **Failure of Non-Negativity for Preserved Preferences:** Crucially, the agent cares about *preserving her ability to act on her current preferences*. The `U_ex-ante` calculation might show a net benefit *including* the disutility of corruption. However, from the perspective of her *currently held, uncorrupted preferences* – the preferences she is trying to *preserve* – the act of acquiring `I` can have negative expected utility *specifically because it risks destroying the evaluative framework itself*. The formal non-negativity holds for the expanded `U_ex-ante`, but this utility function already incorporates the risk of losing the original values. The "value" Good's theorem protects is a hybrid that includes the disvalue of value-loss, not solely the original values.

  **Conclusion: A Principled Exception is Carved**

  Reflexive drift exposes a fundamental tension at the heart of rational choice under self-referential risk. While the mathematics of Good's theorem *can* be stretched to accommodate preference corruption through state-space expansion, this victory is Pyrrhic for the original normative imperative.

  The expanded `U_ex-ante` required to make the theorem formally hold forces the agent to evaluate the potential *annihilation of her current valuing perspective* from within that same perspective. This creates an evaluative paradox akin to trying to assign a price to one's own soul. The calculation becomes unstable, potentially incoherent, and fails to respect the agent's *ex ante* desire for *evaluative continuity* – the preservation of her capacity to value outcomes according to the principles she currently endorses.

  Therefore, **reflexive drift does carve out a principled exception to "always take free information."** When an agent rationally anticipates that information will, with non-negligible probability, corrupt the very preference ordering she uses to evaluate choices *and* she disavows the resulting corrupted state, refusing that information can be the rational choice *from the perspective of preserving her current values and agential identity*. Good's theorem, in its standard interpretation focused solely on expected utility maximization under a fixed preference ordering, does not adequately capture the existential risk to the preference ordering itself. The rationalist framework cannot absorb this without a significant loss: the loss of the primacy of the agent's *current, uncorrupted* evaluative stance when faced with threats to its own existence. In such scenarios, ignorance can indeed be a rational shield for the self.
