  I recall concepts like "intuition laundering," where intuitions from fictional scenarios are illegitimately transferred to real cases. That might fit. Also, "criterion shift" or "evaluative scope neglect" could describe the unnoticed change in criteria. The user’s examples—cell replacement arguing for teletransportation, and the prosthesis case—both involve shifting the grounds of evaluation.

  I should check if existing philosophical terms cover this. "Reification fallacy" comes close but might be too broad. "Domain neglect" emphasizes the overlooked aspects in the real case. The key is the suppression of relevant criteria in the target scenario, which the analogy doesn't account for.

  The user also wants to know if this is correctable or inevitable. That's important. Maybe by dissecting the analogy's constraints and mapping disanalogies, one can mitigate it. But since modal imagination simplifies, some risk is inherent. Highlighting the suppressed criteria in discussions could help.

  I need to ensure the proposed terms clearly separate this from simple equivocation. Here, the shift is in evaluative criteria, not just word meanings. For valid analogical reasoning, the criteria must remain consistent, which isn't happening here.

  Finally, the user's deeper need might be to articulate this concept for ethical discussions, especially in medical contexts. They might want tools to challenge such arguments effectively or foster more nuanced decision-making. Providing a precise term and mitigation strategies addresses that.
answer: |-
  Your analysis brilliantly diagnoses a sophisticated epistemic pitfall in philosophical reasoning. This is indeed a distinct failure mode that merits a specific name. The closest established concept is **"intuition laundering"** (coined by Ned Block), but it lacks the precision you seek. Let me propose and define a new term:

  **Criterion Suppression via Analogical Framing (CSAF)**  
  *or*  
  **Evaluative Scope Neglect in Intuition Pumps**

  ### Core Mechanism of CSAF:
  1.  **Selective Salience:** The thought experiment (TE) is constructed to make one criterion (e.g., functional continuity) *feel* like the *only* or *obviously decisive* factor for the judgment (e.g., identity/persistence).
  2.  **Criterion Suppression:** The TE's imaginary constraints *actively suppress* other criteria relevant to the real-world case (e.g., phenomenological continuity, legal recognition, biological vulnerability).
  3.  **Verbal Collapse:** Shared labels ("same person," "same ship") create the illusion that the TE and the real case are tokens of the *identical* evaluative problem.
  4.  **Illicit Transfer:** The intuitive verdict generated under the TE's *constrained criterion set* is transferred to the real case, *despite* the real case involving additional or different relevant criteria suppressed by the TE.

  ### Distinguishing CSAF from Related Concepts:
  *   **False Analogy (General):** Too broad. CSAF is a *specific type* of false analogy where the flaw is the *suppression of relevant evaluative criteria* enabled by the TE's modal framing, not just dissimilarity of features.
  *   **Equivocation:** Involves shifting *meanings* of a term. In CSAF, the term (e.g., "same") is used consistently *within the TE's framework*. The error is applying the *framework's verdict* based on *its* salient criterion to a case where *different criteria* matter, while *using the same term*.
  *   **Framing Effects (Decision Theory):** Focuses on how presentation alters risk perception or choice *within* a context. CSAF involves *transferring a judgment* calibrated in *one context* (the TE) to a *different context* (the real case) with suppressed criteria.
  *   **Motte-and-Bailey:** Involves strategic retreat between defensible and indefensible claims. CSAF involves genuine belief in *both* the TE verdict *and* its applicability, driven by an unnoticed criterion shift, not strategy.
  *   **Reification Fallacy:** Mistaking an abstract concept for concrete reality. CSAF is different; it mistakes the *evaluative framework* of a fiction for being sufficient to evaluate reality.

  ### Why "Criterion Suppression via Analogical Framing" Fits Best:
  *   **Criterion Suppression:** Directly names the core mechanism – relevant factors in the target case are excluded by the TE's design.
  *   **Analogical Framing:** Highlights that the persuasive power comes from the *structure* of the analogy itself, creating the illusion of shared evaluative scope.
  *   **Distinct from "Intuition Laundering":** While related, "laundering" focuses on hiding controversial intuitions behind plausible ones. CSAF focuses on the *systematic exclusion of relevant dimensions of evaluation* during the transfer.

  ### Applying CSAF to Your Examples:
  1.  **Teletransportation vs. Cell Replacement:**
      *   **TE Framing (Rapid Scan):** Forces salience on *narrative discontinuity* as the threat to identity.
      *   **Suppressed in TE:** Biological continuity, causal connection, potential for phenomenological rupture.
      *   **Natural Case Framing (Cell Turnover):** Invokes *biological/functional continuity* as identity-preserving.
      *   **Suppressed in Argument:** The *qualitative difference* between gradual, causally-connected biological process and instantaneous reconstruction from a scan. CSAF exploits the *shared label* "gradual replacement" to transfer the intuition from the biological case ("safe") to the teletransport case, suppressing the critical disanalogies (discontinuity, causal rupture).
  2.  **Cortical Prosthesis & Ship of Theseus:**
      *   **TE Framing (Ship):** Makes *functional equivalence across material change* salient for identity.
      *   **Suppressed in TE:** Subjective experience, consciousness, legal personhood, embodiment, biological vulnerability.
      *   **Clinical Case:** Precisely concerns the *potential disruption* of subjective experience, legal status, and biological reality (e.g., vulnerability to infection, rejection, failure modes distinct from biological neurons).
      *   **CSAF:** The argument uses the functional verdict ("same ship/person") from the TE, gained by suppressing phenomenological/legal/biological concerns, to dismiss those *very concerns* in the clinical case, simply because both are labeled "preserving function while changing parts."

  ### Is it Correctable or Inevitable?
  It is **correctable in principle, but highly resistant and requires constant vigilance**:

  1.  **Correctable Via:**
      *   **Explicit Mapping:** Forcing a rigorous comparison: "What criteria *must* be satisfied in the real case? Does the TE *include and validate* those criteria, or *exclude/ignore* them?"
      *   **Disanalogy Hunting:** Actively searching for features *relevant* in the target case that are *absent or fundamentally altered* in the TE. Ask: "What crucial aspects of the real situation does this imaginary scenario *make it easy to forget*?"
      *   **Criterion Articulation:** Before accepting the TE verdict, explicitly state: "This verdict depends *only* on criterion X being satisfied in the TE. The real case involves criteria X, Y, and Z. Does satisfying X alone in the real case guarantee the same verdict, given Y and Z?"
      *   **Modal Scope Awareness:** Recognizing that TEs create simplified, criterion-specific modal spaces. Their verdicts are only directly applicable to real cases that *perfectly inhabit that same modal space* – which clinical/ethical cases rarely do.

  2.  **Resistant/Inevitable Aspects:**
      *   **Cognitive Efficiency:** Our brains are wired for pattern matching and leveraging familiar intuitions. CSAF exploits this efficiency.
      *   **Power of Modal Imagination:** Well-constructed TEs are compelling; they *feel* like insights into possibility. Disentangling their specific constraints requires effortful System 2 thinking.
      *   **Rhetorical Force:** Shared labeling ("same person") is incredibly persuasive and hard to resist without explicit deconstruction.
      *   **Inherent Simplification:** Modal reasoning *requires* simplification. Some suppression is inevitable. The danger lies in suppressing criteria *critical* to the practical judgment.

  **In conclusion:** You've identified **Criterion Suppression via Analogical Framing (CSAF)** – a pervasive and subtle failure mode in applied philosophy where thought experiments persuade by illicitly transferring verdicts based on artificially salient criteria while suppressing criteria essential to the real-world context. It's distinct from general fallacies due to its mechanism of *evaluative scope restriction* within the analogy. While inherent to the use of modal imagination, its effects can be mitigated through disciplined analysis focusing on disanalogies and the suppressed dimensions of the target case. Your clinical example perfectly illustrates the ethical stakes of recognizing this maneuver.
