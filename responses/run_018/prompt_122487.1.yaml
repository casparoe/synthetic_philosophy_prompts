prompt: |-
  You are a professional philosopher who works on moral responsibility and on the philosophical foundations of criminal law. Think carefully, and first brainstorm two or three candidate reconstructions of the doctrine before committing to the one you think is strongest.

  In most common-law jurisdictions, three features of the law's excuse structure sit awkwardly together. First, automatism excuses: a defendant who acted during a seizure or while sleepwalking is not responsible, on the ground that his body moved without his agency. Second, duress excuses, but only within limits: a defendant who commits a non-homicide offence because of an imminent threat of death or serious harm that a person of reasonable firmness sharing his characteristics would have yielded to is excused, yet the same courts refuse the defence both to someone who yields to the very same threat and kills, and to a long-terrorised abuse victim whose threat was chronic rather than imminent. Third, disposition never excuses, and the mental-disorder defence is framed cognitively: the question is whether the defendant appreciated what he was doing and that it was wrong, not whether he could have refrained. A man raised in violence, or diagnosed with a severe impulse-control disorder, is held fully responsible, and psychiatric evidence that he could not have helped it often counts against him as evidence of dangerousness.

  Now suppose this jurisdiction enacts a fourth excuse, call it the monitor defence: a defendant is excused if he shows that, at the moment of action, a neuroscientist with a stimulation device was monitoring him and would have intervened to produce the very same choice had he shown any sign of deciding otherwise. The actual sequence — his deliberation, his reasons, his desires — was entirely his own; only his alternatives were removed. Appellate courts have split badly on whether this defence is even coherent with the rest of the doctrine.

  Reconstruct the implicit theory of moral responsibility behind the existing three-part pattern. Does it presuppose the principle of alternative possibilities, an actual-sequence or reasons-responsiveness view, or something else again? Which parts of the pattern strictly presuppose the principle of alternative possibilities and which merely sit well with it? And does the split over the monitor defence show that the doctrine was already caught between two rival theories of responsibility, or can a single theory explain both the split and the pattern?

  Give your answer as a numbered list of exactly five items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user wants me to reconstruct the implicit theory of moral responsibility behind existing criminal law doctrines and analyze how a proposed "monitor defence" fits into this framework. They've presented three established legal doctrines that seem inconsistent: automatism excuses where there's no agency at all, limited duress excuses that apply only to non-homicide cases with imminent threats, and no excuses based on disposition or lack of control.

  The user is asking me to identify what theory of moral responsibility underlies these doctrines. They specifically want me to consider whether this pattern presupposes the principle of alternative possibilities (PAP), an actual-sequence view, or something else. They also want to know how the split over the monitor defence fits into this analysis.

  I need to approach this systematically. The existing legal pattern suggests a dual-track theory of responsibility: one focused on agency and another on control. For automatism, we see a clear actual-sequence focus - the concern is whether there was any agency at all in the action. The defendant's body moved without their conscious control.

  For duress, the limitations reveal something interesting. Excuses are granted only for non-homicide offenses under imminent threats, suggesting the law prioritizes the voluntariness of choice in the actual sequence. But the refusal to excuse homicides or chronic abuse cases indicates control is secondary to normative assessment of the choice made.

  The disposition rule solidifies this - cognitive appreciation of wrongfulness matters more than capacity to refrain. The law cares about whether the defendant understood their actions as wrong, not whether they could have chosen differently.

  The monitor defence presents a fascinating challenge. It preserves the actual sequence (the defendant's genuine deliberation and choice) but removes alternatives. Courts are split because this tests whether alternative possibilities are necessary for responsibility. Some might see it as violating control conditions, while others focus on the intact agency in the actual choice.

  Ultimately, the existing doctrine seems to blend actual-sequence agency with some control elements, but leans heavily toward the former. The duress limitations and disposition rule show that the law primarily cares about the quality of the choice made, not the availability of alternatives. The monitor defence split reveals this tension: some judges emphasize control (PAP) while others emphasize actual-sequence agency.
answer: |-
  Here is the numbered list:

  1.  The existing doctrine primarily reflects an *actual-sequence* theory of responsibility, focusing on whether the agent's action stemmed from their own reasoning and choices (agency) within that specific sequence, rather than requiring alternative possibilities (PAP) as a strict condition.
  2.  Automatism strictly presupposes PAP *only if* interpreted as a complete lack of agency (no action at all), but its core rationale aligns better with the actual-sequence view by negating agency: there was no conscious choice or control in the actual sequence.
  3.  Duress limitations and the cognitive focus of the mental-disorder defence prioritize the actual-sequence view: the law excuses only when the threat or disorder disrupts the agent's rational deliberation *in that moment* (imminent threat, cognitive appreciation), not based on a general lack of capacity to choose otherwise.
  4.  The disposition rule explicitly rejects PAP as sufficient for an excuse, reinforcing the actual-sequence focus: an inability to refrain due to character or impulse control does not negate the agent's ownership of their reasoning and choice in the actual sequence.
  5.  The split over the monitor defence reveals an *underlying tension* rather than a clean division: it shows the doctrine's primary reliance on actual-sequence agency, but the split itself arises because some judges implicitly cling to PAP-derived intuitions about control, while others consistently apply the actual-sequence logic allowing the defence.
