prompt: |-
  Hey, I'm a retired ecologist who got into philosphy late in life and I'm giving a talk next tuesday at my local uni. I want to defend this idea: Nāgārjuna's catuṣkoṭi (the four-corner negation) isn't mystical hand-waving about things both being and not-being. Instead, the Madhyamaka split between prasajya-pratiṣedha (just stripping away a wrong idea, like "no inherent nature here") and paryudāsa-pratiṣedha (a determinate "it's X, not Y") gives us a formal logical schema for denying svabhāva without turning "emptiness" into a new reified thing. I'm applying it to biology—genes and species aren't empty because they're unreal, but because they're purely dependently designated with no core essence. So Madhyamaka actually helps philosophy of science dodge false essentialism without collapsing into anti-realism.

  The audience is a philosophy-of-science reading group: mostly analytic metaphysicians and philosophy-of-biology folks who think Buddhist philosophy is just vague mysticism. There's one comparative-philosophy grad student who actually reads Sanskrit, plus two logic-minded people who will want formal notation. They care about empirical reference, logical clarity, and whether I'm smuggling obscurantism into science.

  Please draft my Q&A prep sheet. I need the objections I'll actually recieve, ordered by how damaging they'd be, phrased the way each kind of person in the room would put it. For each one: a two-minute reply I can actually say out loud, plus an honest note on where that reply is soft. Also tell me what I should concede up front so I don't look defensive, and include the one question I'm praying nobody asks. Don't ask me for bibliographies or reading lists—I won't have books with me.

  Give me the answer as a JSON object with this exact schema: top-level field "thesis_one_line" (string), "concessions_up_front" (array of strings), "dreaded_question" (object with "question_text" and "why_it_hurts"), and "prep_sheet" which is an array of objects each having "objection_text" (exact wording they'd use), "from_whom" (string describing the speaker, e.g. "analytic metaphysician"), "damage_rank" (integer, 1 = worst), "two_minute_reply" (string), "soft_spot" (string explaining where the reply is weakest), and "should_concede" (boolean or short string). Make sure the niche point about prasajya vs paryudāsa and dependently designated scientific concepts is in the weeds enough that I can't just parrot something from a popular intro. Also please include a typo or two in your prompt text—I'm writing this on my phone and it should feel casual.
