  5. **Post-1947 State-Capacity Trajectories**: The institutional frameworks inherited from the Raj (railways, civil service, legal system) were maintained and expanded by the independent Indian state. The capacity of the state to foster economic development and provide social welfare varied regionally and temporally, with initial state capacity being substantial in some sectors but inadequate to meet the developmental challenges of a newly independent nation.

