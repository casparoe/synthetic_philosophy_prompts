  ### Aunt Hillary and the Ant Fugue: Workshop Design  
  *Objective: Simulate distributed cognition in an ant colony through a contrapuntal, rule-bound activity, fostering debate about collective intelligence versus a "single mind."*

  **Total Time:** 90 minutes  
  **Participants:** 14 upper-level students  
  **Key Constraints:** No verbal communication, no leader, interactions governed by strict local rules.  
  **Payoff:** Majority view (single mind vs. distributed interaction) chooses either ambient music for final 10 minutes or dictates the division of a shared treat (e.g., biscuits).

  ---

  ### **Workshop Structure**
  #### **1. Introduction (10 mins)**  
  - **Framing (5 mins):** Briefly recount "Aunt Hillary’s" observations: an ant colony behaving like a musical fugue, with no central conductor. Themes (e.g., foraging patterns) are introduced, transformed, and resolved by different castes without top-down control. Emphasise that today, students will *be* the colony.  
  - **Rules & Roles (5 mins):**  
    - **Roles:** Assign randomly:  
      - **Foragers (4):** Start with a "theme card" (e.g., blue stripes). Must place card near "food" (facilitator-placed tokens).  
      - **Nurses (4):** Start with a "transformation card" (e.g., red dots). Can alter a forager’s card only if adjacent (arm’s reach).  
      - **Soldiers (4):** Start with a "resolution card" (e.g., gold border). Can place it only if a forager’s original theme and a nurse’s transformed theme are visible in the same quadrant.  
      - **Scouts (2):** Start blank. Can copy any card they touch and place duplicates elsewhere to "propagate" themes.  
    - **Core Rules:**  
      - All communication via card placement/movement. No talking, gestures, or eye contact to coordinate.  
      - Quadrants are fixed (table divided into four zones with tape).  
      - **Contrapuntal Constraints:**  
        - Nurses may transform only when adjacent to a forager.  
        - Soldiers may resolve only when original/transformed themes coexist in one quadrant.  
        - Scouts may not create new themes—only copy/relocate existing ones.  
    - **Goal:** Respond to disruptions by collectively creating a "spatial score" (cards arranged on the table). Success means the final arrangement feels coherent—like a fugue’s harmony—though no one plans it.  

  #### **2. Activity Setup (10 mins)**  
  - **Materials:**  
    - Role cards (laminated: role + rules on one side, thematic pattern on the other).  
    - Quadrant markers (tape dividing the table).  
    - Disruption tokens (e.g., cardboard raindrops, "food" discs, predator cutout).  
    - Timer.  
  - **Prep:**  
    - Distribute role cards. Give 1 min for students to review rules.  
    - Place a "food" token in Quadrant 1. Students begin in "nest" (Quadrant 2).  
    - Emphasise: *"You are not a team with a plan—you are parts of a system. Let the rules guide you, not conversation."*  

  #### **3. Simulation Rounds (45 mins; 15 mins each)**  
  **General Flow:**  
  - Facilitator triggers disruption at round start.  
  - Students move freely within/between quadrants, playing roles.  
  - All card interactions must obey adjacency/quadrant rules.  
  - End each round by photographing the "score" (card arrangement). Reset table but retain roles (rotate roles between rounds if time permits).  

  **Round-Specific Disruptions & Goals:**  
  1. **Rainstorm (Min 0–15):**  
     - *Disruption:* Remove food from Quadrant 1; place new food in Quadrant 3 + "raindrops" in Quadrant 1.  
     - *Goal:* Foragers find new food; nurses transform themes; soldiers resolve patterns near food.  
     - *Pressure Point:* Will foragers "waste time" in defunct quadrants? Can nurses/soldiers adapt without cues?  

  2. **Depleted Food (Min 15–30):**  
     - *Disruption:* Replace food with two "half-food" tokens in Quadrants 2 and 4.  
     - *Goal:* Balance activity across quadrants. Scouts become vital—copying themes to "spread" information.  
     - *Pressure Point:* Can themes transform/resolve in multiple locations simultaneously without central oversight?  

  3. **Predator Threat (Min 30–45):**  
     - *Disruption:* Place "predator" (e.g., toy spider) in Quadrant 1; move food to Quadrant 4.  
     - *Goal:* Soldiers resolve predator threat (place resolution card adjacent to predator) *only if* a nurse-transformed theme is present in the same quadrant. Foragers avoid predator zones.  
     - *Pressure Point:* Risk of "system collapse" if roles cluster or ignore threats.  

  #### **4. Payoff & Voting (5 mins)**  
  - Students write a 3-sentence defence of one view:  
    > *"The colony exhibited a SINGLE MIND"* OR *"The colony exhibited DISTRIBUTED INTERACTION."*  
  - Majority vote determines:  
    - **Single mind wins:** Class chooses ambient music (e.g., Bach fugue) for final debrief.  
    - **Distributed wins:** Shared treat (e.g., biscuits) divided equally.  

  #### **5. Debrief (20 mins)**  
  - **Review Photos:** Display round-by-round "scores." Ask: *"When did the colony feel intelligent? Fragile?"*  
  - **Map Moments to Concepts:**  
    - **Coherence as "Intention":** *"In Round 1, when a soldier’s resolution card completed the pattern seconds before the timer—why did that *feel* like the colony ‘intended’ it? What does this say about attributing minds to systems?"*  
    - **Fragility of Distribution:** *"In Round 3, when a nurse mis-transformed a theme and the predator wasn’t resolved—how does this show the limits of distributed cognition? Why might evolution favour redundancy in real colonies?"*  
  - **Limitations of Simulation:**  
    - *"This shows structural emergence, but not phenomenology—we can’t ask ‘what it is like’ to be a colony. It also compresses evolution: real ant ‘themes’ develop over millennia, not minutes."*  
  - **Conceptual Takeaway:** *"Aunt Hillary’s ‘fugue’ isn’t music or chaos—it’s rule-bound emergence. Does that necessitate a ‘mind’? Or is it just complex chemistry?"*  

  ---

  ### **Predicted Failures & Solutions**  
  1. **Problem:** Foragers appoint a "leader" or use gestures to direct others.  
     - **Solution:** Intervene silently—tap rule card and shake head. If persistent, pause and restate: *"Ants don’t debate—rely on the rules."*  
     - **Design Reinforcement:** Rules incentivise individualism—e.g., nurses *can’t* act without adjacency, forcing local focus.  

  2. **Problem:** Students conflate "no leader" with randomness, losing engagement.  
     - **Solution:** In debrief, contrast a "chaotic" round with a "coherent" one using photos. Ask: *"Did rules or luck create this pattern?"*  
     - **Design Reinforcement:** Scouts’ copying ability creates visible feedback loops—e.g., duplicated themes in multiple quadrants show non-random propagation.  

  3. **Problem:** Soldiers/nurses idle if themes don’t reach them.  
     - **Solution:** In Round 2, subtly move disruption tokens to "activate" neglected quadrants.  
     - **Design Reinforcement:** Scouts mitigate this—their mobility spreads themes, creating soldier opportunities.  

  ---

  ### **Facilitation Notes**  
  - **Tone:** Use poetic language to frame the colony as "composing under constraints," not solving problems.  
  - **Pacing:** Strictly enforce round timers. If rounds stall, trigger a "crisis" (e.g., move predator closer to food).  
  - **Emergence Over Explanation:** Never define "fugue" or "contrapuntal"—let patterns emerge from rules. Students should *feel* the strangeness first, then dissect it.  
  - **Closing:** Play music or share treats during final debrief to reward engagement. Pose: *"Did we simulate an intelligence—or just clever rules?"*  

  This design makes the "single mind" intuition palpable through constrained collaboration. Success hinges on students experiencing the eerie coherence of distributed systems—where the colony’s "mind" is the fugue itself.
