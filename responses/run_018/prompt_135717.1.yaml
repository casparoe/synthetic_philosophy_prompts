  This way, everyone experiences different roles.

  Payoff:
  - After the activity, students write for 5 minutes: "Did the colony exhibit a single mind or distributed interaction? Defend your view with evidence from the simulation."
  - Then they vote by show of hands. Majority decides:
    - Single mind: choose music (e.g., a Bach fugue) for the final 10 minutes.
    - Distributed: share a treat (biscuits) equally.

  Detailed Schedule:

  - 0:00-0:10: Introduction and framing (Aunt Hillary story), explain roles and rules, assign roles for round 1.
  - 0:10-0:15: Setup: distribute cards, explain quadrants, do a quick practice if time? Or just start.
  - 0:15-0:30: Round 1 (Rainstorm)
  - 0:30-0:35: Reset and rotate roles, setup round 2.
  - 0:35-0:50: Round 2 (Depleted food)
  - 0:50-0:55: Reset and rotate roles, setup round 3.
  - 0:55-1:10: Round 3 (Predator)
  - 1:10-1:15: Payoff writing and voting.
  - 1:15-1:35: Debrief (20 mins).
  - 1:35-1:45: Music or treat, and closing.

  Total 90 minutes.

  This is tight, but we can adjust.

  Materials Checklist:
  - Table divided into 4 quadrants (tape).
  - Role badges: forager, nurse, soldier.
  - Forager cards: for each round, 4 cards (each with unique base pattern on left half, right half blank). Prepare 3 sets (one per round).
  - Nurse transformation stickers: for each nurse and for each forager pattern, a transformed sticker. For 4 nurses and 4 patterns, 16 stickers per round. Prepare 3 sets.
  - Soldier resolution cards: 6 per round (each soldier gets one). Prepare 3 sets.
  - Disruption cards: food cards (large, to place in quadrants), predator card.
  - Timer.
  - Camera to take photos.
  - Paper and pens for payoff writing.
  - Music options or treats.

  This is a lot of preparation, but it should work.

  Final note: the first run might have hiccups, but the beauty is in the emergent behavior. The debrief will help them see the point.
