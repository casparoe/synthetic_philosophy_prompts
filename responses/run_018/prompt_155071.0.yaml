prompt: |-
  Write a short dialogue — like two grad students arguing over coffee — between a philosopher defending the duty to remember past collective wrongs and another arguing for institutional forgetting. The first should be working from Margalit's idea that shared moral memory is part of what holds a political community together; the second should take Rieff's skeptcism about remembrance culture but extend it with something called "mnemonic triage," the claim that societies have limited emotional and attentional bandwidth, so keeping every historical trauma in active public memory dilutes the urgency of the ones that actually need repair now. Have them wrestel with a specific proposal: a law that automatically sunsets public memorials after about fifty years unless the affected community actively votes to renew them. Don't let them talk past each other — the preservationist should actually answer the triage point about dilution and power (who gets to decide what's urgent?), and the triage advocate should actually anser the preservationist's worry that sunset clauses let perpetrators off the hook. Keep it grounded, no strawmen, and throw in a typo or two like this is just a quick message you typed on your phone.
