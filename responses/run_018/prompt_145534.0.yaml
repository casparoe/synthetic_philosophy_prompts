answer: |-
  ### Teaching Plan: Letter Categorization, Slippage, and Style  

  **Total Time:** 90 minutes  
  **Audience:** Cognitive science undergraduates familiar with Wittgenstein’s family resemblance but new to Letter Spirit, typography, or computer vision.  
  **Goal:** Teach that letter categorization relies on permissible "slippages" (not prototypes/necessary conditions) and that "style" is an orthogonal dimension to category membership.  
  **Carrying Case:** Trio of forms in two handwriting styles:  
  - Canonical double-storey printed `a`  
  - Single-storey handwritten `a` (open top, long right tail)  
  - Ambiguous form (resembling `o` with short ascender).  
  In Style 1, ambiguous form = `a`; in Style 2, ambiguous form = `o`.  

  ---

  #### **Dependency Sequence & Timing**  
  1. **Recap Family Resemblance & Problem Setup (15 min)**  
     - **What:** Reactivate prior knowledge: Wittgenstein’s critique of prototypes/necessary conditions using examples (e.g., "games"). Pose problem: *"How do we recognize a scribble as an ‘a’?"*  
     - **Why needed:** Establishes baseline. Students must grasp family resemblance as overlapping similarities *before* slippage/style.  
     - **Misconception headed off:** *"Family resemblance means anything goes."*  
       - **How:** Contrast "`a`-like" scribbles vs. clear non-`a` (e.g., a triangle). Emphasize constraints: *"Family resemblance isn’t arbitrary—deviations must preserve relational links (e.g., enclosed counter, open top)."*  

  2. **Introduce Slippages (25 min)**  
     - **What:** Show diverse `a` examples (e.g., double-storey, single-storey, sans-serif). Define "slippages" as permissible deviations from a canonical form (e.g., open top, missing tail) that maintain family resemblance.  
     - **Why before style:** Slippages are the atomic units of variation. Style is built from *systematic slippages*, so slippages must be understood first.  
     - **Activity:** Students sketch variants of `a` that "feel" valid vs. invalid. Chart shared/dropped features to visualize overlapping similarities.  

  3. **Define Style as Orthogonal Dimension (20 min)**  
     - **What:** Present two handwriting styles (e.g., "loopy" vs. "angular"). Show *same letter* (`a`) in both styles, then *different letters* (e.g., `a`, `d`, `g`) sharing consistent deviations in one style (e.g., all have long tails).  
     - **Key point:** Style is a coherent system of slippages applied globally. Category (e.g., `a`) is fixed across styles; style is fixed across categories.  
     - **Misconception headed off:** *"Style is noise around a ‘true’ letter form."*  
       - **How:** Contrast random noise (e.g., ink blots) with deliberate, consistent deviations (e.g., all letters in a font share slants). Ask: *"Does a ‘true’ a exist? Or is it defined relationally?"*  

  4. **Reveal Ambiguous Form in Style Contexts (20 min)**  
     - **What:**  
       - Show Trio in **Style 1** (e.g., "tail-heavy"): Canonical `a` + single-storey `a` + ambiguous form → all read as `a`.  
       - Show *identical* Trio in **Style 2** (e.g., "compact"): Canonical `a` + single-storey `a` + ambiguous form now read as `o`.  
     - **Why now:** Ambiguity can only be resolved *after* slippage/style are defined. Students see that the *same form* changes category based on style-driven expectations.  
     - **Misconception headed off:** *"Ambiguous form proves ‘a’ and ‘o’ aren’t distinct."*  
       - **How:** Highlight contextual constraints. In Style 1, the ambiguous form shares slippages with `a` (e.g., tail); in Style 2, it aligns with `o` (e.g., roundness). *"Categories are distinct but context-dependent."*  

  ---

  #### **Final Check for Genuine Understanding (5 min)**  
  - **Task:** Show a new ambiguous form (e.g., `u`/`v` hybrid) in two style contexts.  
  - **Probe:** *"Why might this be ‘u’ in Style A but ‘v’ in Style B? How do slippage and style interact?"*  
  - **Genuine understanding:**  
    - Correct: *"Slippages in Style A activate ‘u’-resemblances; Style B’s systematic features activate ‘v’."*  
    - **Reductionist trap (fails check):**  
      - *"It’s ‘u’ because Style A has curves"* (reduces style to category definition).  
      - *"Slippages don’t matter—it’s about the style"* (reduces category to style).  

  ---

  #### **What’s Explicitly Omitted**  
  - Algorithmic details of role-model matching (Letter Spirit’s computational framework).  
  - Neurobiology of visual word recognition.  
  - Historical evolution of typefaces or typographic terminology.  
  *(Do not delve into these; no readings/citations needed.)*  

  ---

  **Why This Sequence Works**  
  1. **Slippage before style:** Students must see deviations as *relational* (family resemblance) before seeing them as *systematic* (style).  
  2. **Ambiguity last:** The trio’s ambiguity relies on understanding slippage and style as independent; introducing it earlier would confuse causality.  
  3. **Misconceptions preempted:** Each pitfall is countered at the point it arises (e.g., "anything goes" during slippage examples).  
  4. **Check focuses on interaction:** Forces synthesis of slippage + style without reductionism.
