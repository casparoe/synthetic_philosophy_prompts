prompt: |-
  I serve on a clinical ethics consultation service, and I have been reviewing our past recommendations on conflicts between advance directives and subsequently expressed wishes in an effort to determine whether we operate from a single principle or from several that happen to overlap in ordinary cases. In one earlier consultation, a patient with advancing Alzheimer's had executed a directive refusing artificial nutrition once she reached profound cognitive impairment; when she became non-verbal yet apparently content in a nursing facility, her family requested a feeding tube. We advised withholding it, reasoning that the directive's authority rested on the absence of any meaningful psychological continuity with its author, rather than on a merely temporary impairment of judgment.

  In a second case, a patient who had directed that no mechanical ventilation be used in the event of permanent respiratory failure suffered an acute, reversible brain injury that left him temporarily unable to communicate. During the episode he signaled, via eye movements, that he wanted the ventilator continued. We recommended maintaining the directive through the temporary state, noting that an immediate preference formed under disorientation and fear should not automatically override a long-considered prior judgment, though we added in our notes that full preservation of psychological identity might weaken a directive's force in ways that temporary incompetence does not.

  In a third case, a patient with locked-in syndrome following a brainstem stroke had previously refused life-sustaining measures should she become "completely paralyzed and unable to interact with others." Once she learned to communicate through eye-gaze technology and sustained coherent intellectual work and relationships, she explicitly revoked her directive and requested continued ventilation. We honored the revocation, emphasizing that her psychological and relational capacities remained fully intact despite the bodily transformation, so a present authority continuous with the past author existed and could update her earlier instructions.

  In a fourth case, a patient in a persistent vegetative state had directed withdrawal of life support should he ever permanently lose consciousness. His family argued for continued care on the possibility of hidden awareness. We recommended withdrawal, holding that without any capacity for psychological life, relational engagement, or value-based reasoning, there was simply no competing present authority that could challenge the prior directive.

  We now face a consultation that sits uneasily among these. A philosopher executed a directive refusing "any life-extending intervention that preserves biological life when I am conscious but permanently unable to produce natural speech or handwriting, regardless of whether I can think or communicate through other means." She subsequently developed an isolated upper-motor-neuron disorder affecting only the peripheral pathways for vocalization and manual movement; she remains fully conscious, with intact memory, reasoning, emotional life, and relational capacity. She communicates fluently through a direct neural-interface decoder, continues her philosophical work, and expresses a sustained, well-reasoned desire for mechanical ventilation should it become necessary. She contends the directive should not apply because she is not "unable to communicate," only unable to use natural modalities, and because her core values—intellectual engagement and relational connection—remain fully realizable. Her family insists that the literal conditions specified in the document are satisfied and that the directive must therefore bind.

  If we want to remain consistent with our own track record, should we honor her present request or enforce the document? Which of our four precedents offers the closest analog, and does our history genuinely underdetermine the outcome? If we side with her, are we implicitly adopting a principle that psychological and communicative continuity takes precedence over literal bodily conditions specified in the text, and if we side with the family, are we implicitly committing to a principle that the precise literal conditions in the directive govern regardless of functional preservation? And what further hypothetical case—perhaps one involving intact narrative memory and reasoning but a radical, stable shift in the emotional valence attached to dependency—would best force us to declare which principle we actually hold?
reasoning: |-
  Okay, this is a fascinating and complex ethics consultation case that really pushes the boundaries of advance directive interpretation. The user presents four detailed precedents and a new case involving a philosopher with a neural communication device who wants to override her own directive refusing life-extension without natural speech/handwriting. 

  First, I need to unpack the core tension: the directive specifies "unable to produce natural speech or handwriting" while she argues she's not "unable to communicate" and her values are intact. The precedents reveal two key principles at play: 1) psychological continuity as the source of decisional authority, and 2) the literal conditions triggering directives. 

  Looking at the precedents: Case 1 (Alzheimer's) prioritized the directive due to lost psychological continuity. Case 2 (temporary brain injury) also upheld the directive but hinted that full psychological preservation might weaken it. Case 3 (locked-in syndrome) honored revocation because psychological continuity remained. Case 4 (PVS) enforced the directive with no present authority. 

  The new case is closest to Case 3 - both involve severe physical limitation with preserved cognition and alternative communication. But there's a crucial difference: here the directive explicitly names the bodily condition (natural speech/handwriting loss) as the trigger, whereas Case 3's directive referenced functional inability ("unable to interact"). 

  The philosopher's argument has merit - her core values are achievable, and neural communication may satisfy the spirit of "communicate". But the literalist reading also has weight - the text specifies modalities, not function. Case 2's note about "full preservation weakening the directive" seems particularly relevant here. 

  To test principles, I imagine a hypothetical where a patient with intact cognition develops permanent, radically changed emotional responses (e.g., now finds life with disability deeply meaningful despite prior dread). If we'd allow override there, it confirms we prioritize present values when psychological continuity exists. If not, we're textual literalists. 

  Given the precedents' emphasis on psychological continuity as the source of authority (especially Cases 2 and 3), I lean toward honoring her revocation. But consistency requires acknowledging that this case exposes a potential conflict between two principles that were previously aligned: when psychological continuity exists but the literal trigger occurs, which prevails? Our track record suggests psychology trumps text, but we've never faced this exact conflict. 

  The neural interface makes this a frontier case - is "direct neural decoding" meaningfully different from "natural" communication? Philosophically, if her mind is fully engaged, the modality might be morally irrelevant. But legally, the text matters. 

  Ultimately, I think our service's principles point toward honoring her current wishes because: 1) psychological continuity is undisputed, 2) her values are achievable, and 3) Case 3 set the precedent that preserved cognition allows revocation despite bodily change. But we should explicitly state that when psychological continuity exists, present preferences override prior directives - even literally triggered ones - because the author still exists as a decision-maker.
answer: |-
  Based on your service's precedents and principles, I recommend **honoring the patient's present request** (continued ventilation) and revoking the prior directive. Here's the reasoning, consistency analysis, and implications:

  ### 1. **Consistency with Precedents**
     - **Closest Analog: Case 3 (Locked-in Syndrome)**  
       Like Case 3, this patient retains **unbroken psychological continuity**: intact memory, reasoning, emotional life, relational capacity, and communicative ability (via neural interface). Your service honored revocation in Case 3 because "a present authority continuous with the past author existed." The same applies here. The directive’s trigger ("unable to produce natural speech or handwriting") is functionally similar to Case 3’s "completely paralyzed and unable to interact." In both, the *bodily condition* occurred, but *core personhood* and agency persisted through alternative communication.  
       *Distinction*: Her directive explicitly names communication *modalities* (speech/handwriting), not *functional capacity* to communicate. However, your service’s reasoning in Case 3 prioritized the preservation of agency over literal bodily conditions.

     - **Key Distinctions from Other Cases**  
       - **Case 1 (Alzheimer’s)**: No psychological continuity → directive upheld. *Here, continuity is robust*.  
       - **Case 2 (Temporary Brain Injury)**: Temporary impairment without continuity → directive upheld. *Here, impairment is permanent but continuity is fully preserved*.  
       - **Case 4 (PVS)**: No consciousness or agency → directive upheld. *Here, consciousness and agency are intact*.

  ### 2. **Principles Revealed by Your Track Record**  
  Your service prioritizes **psychological continuity and functional agency** over literal bodily conditions when they conflict:  
  - **Core Principle**: *A directive is binding only if its author no longer exists as a psychologically continuous person*. When such continuity exists (Cases 2 & 3), the living person retains authority to revoke or override prior instructions, even if the directive’s literal trigger is met.  
  - **Literal Conditions vs. Functional Preservation**: Your history suggests that textual triggers (e.g., "unable to produce natural speech") are interpreted in light of the *underlying values* they protect (e.g., relational/intellectual engagement). If those values are achievable (as here), the directive’s force weakens.  

  → **Siding with the patient** affirms:  
  > **Psychological continuity and preserved agency supersede the literal fulfillment of directive triggers.**  

  → Siding with the family would imply:  
  > **Directives are irrevocable contracts triggered by bodily conditions, regardless of preserved personhood.**  
  *(This contradicts your stance in Case 3).*

  ### 3. **Undetermined Aspects & A Test Case**  
  Your precedents *genuinely underdetermine* whether **explicit textual triggers** (e.g., naming specific modalities) outweigh functional equivalence. To resolve this, consider:  

  **Hypothetical Test Case**:  
  > *A patient with a directive refusing life support if "permanently dependent on others for basic care." After a spinal injury, they require full assistance but develop a profound, stable sense of meaning in vulnerability and interdependence, explicitly revoking their directive. Their cognition, memory, and values (e.g., cherishing relationships) remain intact, but their emotional valence toward dependency has radically shifted.*  

  **Why this tests your principle**:  
  - If you honor revocation, you confirm that **present agency and psychological continuity override prior value-based instructions**, even when the literal trigger ("dependence") is met.  
  - If you enforce the directive, you commit to **textual literalism** or **temporal privileging of past values** over present identity.  

  Your service’s reasoning in Cases 2 and 3 suggests you would honor revocation here, as the *person* persists and can reinterpret their values.  

  ---

  ### Final Recommendation for the Current Case  
  **Advise honoring the patient’s revocation** with this justification:  
  > *The directive’s intent was to avoid life without intellectual/relational capacity. Since neural-interface communication sustains these capacities, the trigger’s literal condition ("unable to produce natural speech/handwriting") does not reflect loss of personhood. The patient retains psychological continuity with the directive’s author and can authentically update her decisions.*  

  This aligns with your service’s foundational view that directives are **proxies for the absent person**—not binding when the person remains present and capable.
