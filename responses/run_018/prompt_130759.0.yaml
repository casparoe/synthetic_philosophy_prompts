  **b** Revising value in the shifting light.  
  **A2** The hierarchy climbs to douse the flame,  

  **a** Yet finds its footings shifting all the same,  
  **b** Revision's wheel turns the loop anew, alight.  
  **A1** This sentence is false, a serpent's claim  

  **a** That sheds its skin, rejecting Tarski's frame,  
  **b** A lie that shifts its claim throughout the night.  
  **A2** The hierarchy climbs to douse the flame,  

  **a** But groundless ground repeats the cyclic blame.  
  **b** No stable point emerges plain and bright.  
  **A1** This sentence is false, a serpent's claim,  
  **A2** The hierarchy climbs to douse the flame.  

