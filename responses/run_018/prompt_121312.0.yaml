     ├── (a) Yes, scores are comparable → L1 (Average score: sum/count per project)
     └── (b) No, scores are team-specific → L2 (Normalized score: e.g., z-scores per team)

  3. Concrete incident: A universally disliked "filler" project (ranked last by all) is added, flipping the order of two unrelated projects. Acceptable? (IIA)
     ├── (a) Yes, sensitivity is tolerable → 4
     └── (b) No, orders must be stable → 5

  4. Streaming constraint: Must aggregation use fixed-size per-project summaries? (Independence feasibility)
     ├── (a) Yes, summaries are fixed-size (e.g., one number) → 6
     └── (b) No, allow summaries scaling with projects (e.g., O(n) storage) → 7

  5. Streaming constraint: Must aggregation use fixed-size per-project summaries? (Independence feasibility)
     ├── (a) Yes → L3 (Blocked: IIA + fixed-size summaries conflict with Arrow. Contract change: Allow set-valued output.)
     └── (b) No → 7

  6. Concrete incident: Team X ranks their top project #1 and a doomed project #2 (knowing it won’t be funded). This manipulation lifts their top project. Acceptable? (Strategy-proofness)
     ├── (a) Yes, tolerate some strategy → 8
     └── (b) No, must punish manipulation → L4 (Unnamed: Scoring with veto thresholds; e.g., bottom-3 ranks get 0)

  7. Can we assume teams rank projects along a single axis (e.g., cost)? (Single-peaked domain)
     ├── (a) Yes, rankings are single-peaked → L5 (Black’s median voter; full ranking along axis)
     └── (b) No, no common axis → 9

  8. Assign points based on rank position. How should scores decay? (Scoring vector)
     ├── (a) Only #1 matters (Plurality: 1 for top, 0 else) → L6 (Plurality)
     ├── (b) Linear decay (e.g., 40 for #1, 39 for #2, ...) → L7 (Borda-like)
     └── (c) Fast decay (e.g., 1 for top, 0.5 for #2, 0.25 for #3) → L8 (Exponential scoring)

  9. Audit constraint: Must every adjacent pair in the output be justified by: (i) direct majority, or (ii) a 2-step chain (A>X and X>B)? (Local justification)
     ├── (a) Yes, require short chains → 10
     └── (b) No, allow complex justifications → 11

  10. Weak no-dictator: Should the platform team break ties or cycles? (Oligarchy)
      ├── (a) Yes, give tiebreak power → L9 (Copeland score + platform tiebreak)
      └── (b) No, equal treatment → L10 (Ranked Pairs with local enforcement)

  11. Concrete incident: Projects A, B, C have a majority cycle (A>B, B>C, C>A). How to resolve? (Cycle handling)
      ├── (a) Prioritize largest majority margins → L11 (Schulze method)
      └── (b) Minimize violations of pairwise wins → L12 (Kemeny-Young)
  ```

  ---

  ### Leaf Mapping Table
  | Leaf | Rule Name/Description | Notes |
  |------|------------------------|-------|
  | L1   | **Average score** | Sum scores per project; deterministic. Blocked if scores incomparable (L2). |
  | L2   | **Normalized score** | Normalize scores per team (e.g., z-scores), then average. Unnamed. |
  | L3   | **Blocked** | IIA + fixed-size summaries impossible (Arrow). Unblock by allowing top-set output. |
  | L4   | **Scoring with veto** | Points decay sharply; bottom-k ranks get 0. Resists burying. Unnamed. |
  | L5   | **Black’s median voter** | Outputs single-peaked ranking along axis. Requires known axis. |
  | L6   | **Plurality** | #1 votes only. Susceptible to strategy. |
  | L7   | **Borda-like** | Linear points. Violates IIA (filler incident). |
  | L8   | **Exponential scoring** | Fast decay (e.g., 1/2^rank). Less manipulable than Borda. |
  | L9   | **Copeland + tiebreak** | Wins in pairwise contests; platform team breaks ties. |
  | L10  | **Ranked Pairs (local)** | Lock in pairs; enforce 2-step chains for adjacents. Unnamed. |
  | L11  | **Schulze method** | Path-based; respects largest majorities. |
  | L12  | **Kemeny-Young** | Minimize pairwise disagreements. Computationally heavy. |

  ---

  ### Diagnostics
  - **Uninhabited combinations**: 
    - *IIA + fixed-size summaries + strict ranking* (L3): Incoherent per Arrow’s theorem. 
    - *Single-peaked + cardinal scores*: Unexplored; no clear use case.
  - **Indistinguishable leaves**: 
    - L7 (Borda-like) and L8 (Exponential scoring) both violate IIA and use fixed-size summaries. Only differ by scoring steepness.
  - **Blocked leaves**: 
    - L3: Requires contract change to output a set (e.g., "top 20 projects") or probabilistic ranking.
    - L12 (Kemeny-Young): May violate 2-step audit (long chains possible). Blocked unless auditor allows.

  ---

  ### Worked Examples at Key Nodes
  **Node 3 (IIA Incident)**  
  *Teams*:  
  - T1: A > B > C  
  - T2: B > C > A  
  - T3: C > A > B  
  *Projects*: A, B, C.  
  - *Without filler*: Borda scores: A=3, B=4, C=2 → Ranking: B > A > C.  
  - *Add filler D (ranked last by all)*: Ballots extend to A>B>C>D, etc. Borda scores: A=6, B=7, C=5, D=0 → Ranking: **B > A > C > D** (stable).  
  - *Branch (a)*: Acceptable.  
  - *Branch (b)*: Unstable if scores change (e.g., plurality: A=1, B=1, C=1 → tie; filler breaks tie arbitrarily).  

  **Node 6 (Strategy Incident)**  
  *Teams*:  
  - T1 (honest): Security > Analytics > Compliance  
  - T1 (manipulating): Security > *Compliance* > Analytics (dooms Compliance)  
  - T2, T3: Analytics > Compliance > Security  
  *Projects*: Security, Analytics, Compliance.  
  - *Honest Borda*: Security=3, Analytics=4, Compliance=2 → Analytics wins.  
  - *Manipulated Borda*: Security=4, Analytics=3, Compliance=2 → **Security wins**.  
  - *Branch (a)*: Tolerated (L6/L7/L8).  
  - *Branch (b)*: Prevented by L4 (e.g., bottom-2 get 0: Security=1, Analytics=2, Compliance=0 → Analytics wins).  

  **Node 9 (Audit Constraint)**  
  *Teams*:  
  - T1, T2: A > B > C  
  - T3, T4: B > C > A  
  - T5: C > A > B  
  *Projects*: A, B, C.  
  - *Pairwise*: A>B (3-2), B>C (4-1), C>A (3-2) → Cycle.  
  - *Branch (a)*: Enforce 2-step chains. Output **A > B > C** (A>B direct, B>C direct).  
  - *Branch (b)*: Output **B > C > A** (ignores A>B; justified by global optimization in L11/L12).  

  ---

  ### Residual Choices Unsettled by Tree
  1. **Scoring vector steepness**: For scoring rules (L6/L7/L8), how sharply should points decay? (Philosophical: reward consensus-top or acknowledge long-tail?).
  2. **Tiebreak granularity**: For oligarchic rules (L9), how often should the platform team intervene? (Philosophical: "guardian of fairness" vs. "minimal overreach").
  3. **Axis definition for single-peakedness**: If chosen (L5), how to define the axis? (Technical but value-laden: cost, risk, or strategic importance?).
  4. **Summary metric**: For fixed-size storage, which metric prioritizes freshness (e.g., streaming Borda) vs. robustness (e.g., exponential scores)?  
  The tree resolves *how* to aggregate but not *what the aggregation should prioritize*; these require product vision.
