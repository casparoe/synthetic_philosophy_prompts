prompt: |-
  Since I retired from teh lab I've been trying to wrap my head around philosophy, and lately I've been obsessed with Libet's experiments and what neuroscience actually tells us about free will. I was discussing it with a friend over coffee and realised I don't even know what a decent theory of voluntary action is supposed to deliver — like, what's the full checklist?

  So I want the desiderata spelt out: the phenomena it must cover (the readiness potential, that veto window Libet mentioned, and whether the same patterns hold when you're improvising on an instrument versus just pressing a button in a trial), the distinctions it can't collapse (causing an action versus authorising it, being aware of an urge versus actually controlling it), and the neuroscience it can't contradict (pre-SMA firing, two-stage models, that sort of thing). I also came up with this slightly niche idea: what if the readiness potential is largely an artifact of binary-choice paradigms and basically vanishes in open-ended, continuous-flow motor tasks? Should an adequate theory have to account for that possibility, or is it fair to ignore? Tell me which of these requirements are genuinely non-negotiable and which are just preferences of particular camps, flag any pair that might be jointly unsatisfiable, and say which single criterion does the most damage to the popular view that consciousness is just an epiphenomenal afterthought. Please write in British English, and don't bother with citations or a reading list — I just want the reasoning.
