prompt: |-
  I'm a retired physical oceanographer — thirty-odd years of current meters, error bars, and arguing with modellers, and about eighteen months of going to a continuing-education philosophy group on Tuesday nights, which has been a bigger shock to the system than anything the North Sea threw at me. Our tutor, Miriam, is good but she won't answer a question until you say what you'd count as an answer. One thing we do that I like: we keep a forecasting ledger. Every week someone writes down a probability and the reference class they got it from — literally, the set of cases they're treating this one as drawn from — and at the end of term we pool everybody's forecasts inside their declared class and check whether the outcomes were calibrated. Miriam's line is that a class you can't audit is a class you can't use. It's my favorite part of the whole business, because it's the only bit that has error bars on it.

  So I've been logging her verdicts, because I want to know what she'll say about a case I actually care about. Her rulings so far:

  - Coin from the till, never tested, one flip: 0.5, from the class of coin flips generally. She would not let anyone define the class as this coin for a single toss.
  - Same coin after a hundred tosses, 71 of them heads: 0.65, not 0.71. She narrowed to this coin's tosses but pulled back toward the broad class.
  - My own chance of dying in the next five years (I'm 74, cycle a lot, live in a well-off postcode): she used the national life table for men 70–74, ignored the cycling, and flatly refused the class men in this postcode district, even though there's plenty of data behind it. She said it's only a stand-in for things we already know more directly.
  - A friend's hip replacement lasting fifteen years: she refused all hip replacements on the grounds that it mixes bearing surfaces and age bands, and insisted on the subclass by bearing surface and age, even though that subclass only had about eighty cases in it.
  - Whether the district council approves the rock armour scheme in March: she refused to give a probability at all. She wrote no class in the ledger and said it isn't the sort of thing that comes in repeatable batches, though she'd happily give odds as a personal judgement.

  Now my real one. There's a 300-metre stretch of concrete stepped revetment, built 1985, protecting about sixty houses at Sandle Bay, one of which is my sister's. Part of it was repaired in 2004 after a partial failure. The council's consultant has put a number into an expected-loss spreadsheet to decide about £2.3m of rock armour, and I don't trust the number. As I see it there are three candidate classes, and they don't agree:

  A. All UK concrete stepped revetments of that general type: roughly 1,600 structures, pooled failure rate about half a percent a year, so call it 10% over twenty years. Lovely statistics, hopelessly mixed — different foundations, wave climates, ages all thrown together.
  B. Same design, glacial-till foundation, high-energy exposure band, same vintage: nine structures, two of which have failed in the last twenty years, the rest observed for varying periods. Crudely that's about 2% a year, which compounds to knocking on 30% over twenty years — but two events in nine means you can't say much, and with nine members I can't audit calibration inside the class either.
  C. A consultant's physics-based model run for this exact structure: overtopping, scour, toe stability, a scenario spread for sea-level rise, giving 3% over twenty years. Except the scour parameters were partly fitted using data from class A, the modellers admit the honest range is 0.5% to 15%, and they left out the settlement crack the 2004 repair was supposed to fix and maybe didn't.

  What I want from you:

  1. Roughly what number does Miriam give for the twenty-year failure probability, and how wide an interval does she put around it?
  2. What rule is she actually running? Give me two or three candidate rules that fit all five of her earlier verdicts, and say what each one predicts here. I can think of a few myself — narrowest class you can still count in, mechanism and causal homogeneity first, go to the physical model and treat the class frequencies as just evidence about the model, or her own ledger rule about auditable classes — but I can't tell which one survives all five cases, and they definately come apart on mine.
  3. Your best guess, and the reasons for preferring it.
  4. What further case, or what single extra piece of information, would separate the rules? I want something to put to her on Tuesday.
  5. Does the 2004 repair move it into a different class — is a once-failed structure a member of structures that have failed before, which plausibly has a much higher rate and no national data at all, or does a repair reset it? Which of the rules does that question bite on?
  6. And practically: I have to give the council one number on Tuesday to go in their expected-value sum. What should I tell them if I want to be as consistent with Miriam as possible — and is there a decent chance the honest answer is that no number belongs in that box?

  Please write in British English — metres, realise, emphasise, that sort of thing. And don't give me references or a reading list; I can't use them and I don't want them. Just the argument, a few hundred words is plenty.
reasoning: |-
  Okay, let me approach this methodically. The user is a retired physical oceanographer with deep experience in empirical data analysis, now engaging with philosophical probability concepts through Miriam's structured approach. Their frustration with abstract philosophy meeting real-world decisions is palpable - they want operational rules, not theory. 

  Miriam's five prior rulings reveal clear patterns:
  1. Rejects unverifiable single-instance classes (coin flip)
  2. Uses empirical data but applies shrinkage (biased coin)
  3. Prefers broad demographic data over individual risk factors (mortality)
  4. Demands mechanistic homogeneity even with small samples (hip replacement)
  5. Rejects non-repeatable events entirely (council decision)

  For the revetment case, the core tension is between:
  - Class A (large but heterogeneous dataset)
  - Class B (small but mechanistically similar cases)
  - Class C (physical model with acknowledged uncertainties)

  Miriam would likely reject Class C's 3% because its parameters inherit Class A's heterogeneity problems. Class B's 2% annual rate (compounding to ~30% over 20 years) is closer but suffers small sample issues. Her mortality ruling suggests she'd compromise: anchor to Class A's 0.5% but adjust toward Class B's observed higher failure rate. 

  Given her shrinkage approach in the coin case (pulled 0.71 toward 0.65), similar adjustment here might yield 15-20% (midpoint between 10% and 30%). The interval would be wide - perhaps 5-40% - reflecting both model uncertainty and data limitations.

  The 2004 repair is critical. Miriam's hip replacement ruling shows she cares about intrinsic properties (bearing surface/age) over history. Thus, repaired revetments likely form a new subclass - though without data, this creates problems. This distinction would test rules prioritizing current state versus historical performance.

  Practically, telling the council "no number belongs" would be most Miriam-consistent but politically untenable. A compromise: report Class A's 10% with explicit caveats about local risk factors, plus a recommendation to monitor the settlement crack. The real answer might be that expected-value calculations break down when uncertainty is this structural.

  The key differentiator would be a case with: 
  - Small but perfectly homogeneous class (like Class B) 
  - Where physical models strongly contradict the data 
  To see whether she prioritizes mechanistic understanding or empirical frequency when they conflict.
answer: |-
  Right, let's tackle this Miriam-style. Based strictly on her rulings and your ledger principle, here's the breakdown:

  1.  **Miriam's number:** She'd likely give **12-18% over 20 years** (so roughly 0.6-0.9% annualised). The interval would be **wide - perhaps 5% to 35%.**  
      *   **Why?** Class A (broad, auditable, but hopelessly mixed) provides the anchor (10%). Class B (narrow, causally relevant but tiny/non-auditable) pulls it upwards. She wouldn't use the raw 30% from B due to sample size, nor accept Class C's 3% as it inherits A's heterogeneity and lacks auditable calibration. Her coin ruling (shrinkage from 0.71 towards 0.65) shows she adjusts empirical data towards a prior when samples are small but informative. Here, she'd shrink B's estimate *towards* A's, but not all the way, landing somewhere in between. The wide interval reflects the poor quality of both key datasets (A's heterogeneity, B's small N).

  2.  **Candidate Rules & Predictions:**
      *   **Rule 1: "Mechanistically Homogeneous & Auditable (if possible)".** Prioritises classes defined by causal mechanisms (design, foundation, exposure) *and* large enough for calibration checks. Fits: Rejected single coin flip (non-auditable), narrowed coin class post-data (more homogeneous), rejected broad hips (mixed mechanisms), rejected council decision (no mechanism/repeatability). *Prediction here:* Rejects A (mixed mechanisms), rejects C (not purely a frequency class, uncalibrated model). Uses B as best mechanism match, but shrinks its estimate *towards* a broader prior (like A's average) due to small N (like the coin), giving ~12-18%.
      *   **Rule 2: "Narrowest Auditable Reference Class".** Prefers the narrowest class you can still meaningfully check calibration on. Fits: Rejected single coin (non-auditable), used broad coin class initially, narrowed post-data (now auditable via future flips), used national life tables (auditable), rejected postcode (likely too narrow/small/less auditable?), rejected broad hips (auditable but uselessly broad?), demanded narrow hips subclass (implying it *was* auditable with N=80?), rejected council decision (non-auditable). *Prediction here:* Rejects B (9 cases, can't audit calibration). Rejects C (not a frequency class). Forced to use A (auditable, broad), giving ~10% + wide interval reflecting heterogeneity.
      *   **Rule 3: "Empirical Frequency Trumps Models, Models Inform Structure".** Uses observed class frequencies primarily. Models are secondary evidence about underlying parameters *for* the frequency class. Fits: Used coin flip frequencies, life table frequencies, hip replacement frequencies. Rejected council decision (no frequency). Ignored cycling/postcode (no auditable frequency class supporting the *adjustment*). *Prediction here:* Rejects C as primary number. Uses A as the broadest auditable frequency (~10%). Uses B as strong evidence that A's rate is too low *for this specific causal cluster*, justifying an upward adjustment (but less than B's raw 30%), giving ~15-20%. Uses C's range (0.5-15%) only to inform the width of the interval around the adjusted frequency.

  3.  **Best Guess & Reason:** **Rule 1 (Mechanistic Homogeneity & Auditable)** fits best overall. It explains why she narrowed the coin class *and* shrank the estimate, why she demanded the specific hip subclass, why she ignored cycling/postcode (they aren't defining *causal* mechanisms for mortality in a way separable from the life table data), and why she rejected the council decision (no defined causal mechanism/repeatability). For your case, it directly addresses the tension between A's auditability and B's relevance, leading to the shrunk estimate (~12-18%). Rule 2 struggles with the hip case (was N=80 auditable enough for her?). Rule 3 struggles slightly with ignoring the cycling/postcode.

  4.  **Separating Question:** Ask her about the hip replacement again: "If the subclass by bearing surface/age had only *5* cases in the registry, but was the only mechanistically homogeneous group, would you use its raw failure rate, shrink it towards the broader class, or refuse to give a probability?"  
      *   Rule 1 (Mechanism) might still use it, heavily shrunk.
      *   Rule 2 (Narrowest Auditable) would likely reject it (N=5 too small to audit).
      *   Rule 3 (Empirical Freq) would likely shrink it significantly.

  5.  **The 2004 Repair:** Miriam would likely **not** reset it. Her hip ruling emphasises intrinsic properties (material, age) over history. A repaired structure with the original design/foundation/crack issue probably remains in classes A & B. It *might* define a new subclass "repaired revetments on till" – but with likely *no* data, making it unusable under her rules. This bites hardest on **Rule 1 (Mechanistic Homogeneity)**: does the repair history fundamentally alter the failure mechanism? If yes, it needs its own class (no data). If not, it stays in A/B. Rule 2 (Auditable) has no data for a "repaired" subclass. Rule 3 (Freq) has no frequency for "repaired".

  6.  **Practical Advice for the Council:**  
      *   **Miriam-Consistent:** Tell them **no single well-founded number belongs in the box.** Explain the conflicting classes and the fundamental uncertainty. Argue the expected-value calculation is flawed for this decision. Push for more targeted investigation/monitoring given the high stakes. This is the most honest, Miriam-esque answer.  
      *   **If Forced to Give a Number:** Use **~15% over 20 years (7-8% to 35%)**, explicitly stating it's a judgement combining broad statistics (Class A) with concerning local evidence (Class B), heavily caveated. Emphasise the crack from 2004 as a critical unknown. This leans towards Rule 1's prediction.  
      *   **Chance "no number belongs" is honest:** **High.** The core issue – lack of a reliable, auditable, causally homogeneous reference class – mirrors why she refused the council decision probability. Her ledger rule ("a class you can't audit is a class you can't use") applies forcefully here. Classes A & C can't be audited *meaningfully* for this case due to heterogeneity. Class B is too small to audit.

  Focus on the core problem on Tuesday: the lack of a suitable reference class that meets Miriam's standard of auditability *and* causal relevance. That's the hinge her rules turn on. Good luck.
