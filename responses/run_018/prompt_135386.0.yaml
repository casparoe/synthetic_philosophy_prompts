prompt: |-
  I am a doctoral student in epistemology preparing the final examination for an upper-level graduate seminar on peer disagreement. I need a single essay question that cannot be answered by reciting a standard summary of conciliationism versus steadfastness. To keep the task grounded yet non-regurgitatable, please embed the following self-contained scenario: two researchers, Dr. A and Dr. B, are acknowledged epistemic peers with respect to a shared predictive model. They agree on every observed data point and on the model’s architecture, but they assign different prior probabilities to a hidden parameter—Dr. A uses a uniform prior, while Dr. B uses a sharply peaked prior derived from an analogical inference in a distant domain. Each can reproduce the other’s reasoning. A commentator then proposes “meta-steadfastness”: because priors are pre-evidential commitments that determine how evidence is weighted, peer disagreement about priors should not trigger the equal-weight conciliationist response; reducing confidence in one’s prior would undermine the very framework through which one assesses the peer’s competence. The commentator adds that applying conciliationism here produces a vicious regress, since adjusting one’s prior in response to disagreement alters the evidential assessment of the disagreement itself.

  Please draft an exam question suitable for a 90-minute response (expecting approximately 800–1000 words from the student) that asks the examinee to evaluate whether meta-steadfastness successfully avoids standard conciliationist objections—especially the uniqueness thesis and the charge of epistemic arbitrariness—without collapsing into unmotivated dogmatism. The question should require students to distinguish disagreement about evidence from disagreement about prior weighting, and to specify precisely where the symmetry required by conciliationism breaks down, if at all.

  Then provide a model answer of about 600 words, and a marking scheme that separates an A from a B answer by naming the specific argumentative moves each must contain. The marking scheme should identify five must-hit points (with approximate marks) totaling 20 marks, and should name the specific mistakes that should cost points—such as conflating priors with beliefs about evidence, misapplying the uniqueness thesis, or treating meta-steadfastness as mere psychological stubbornness.

  Please present your response as a JSON object with exactly these named fields:
  - "exam_question_text": the full essay prompt as given to students
  - "model_answer": the model answer text, approximately 600 words
  - "marking_scheme": an object containing "total_marks" (integer), "must_hit_points" (array of objects each with "point_name", "marks", "description"), "grade_A_criteria" (string describing the specific moves an A answer must make), "grade_B_criteria" (string describing where B answers typically fall short), and "common_errors" (array of strings describing typical mistakes with associated point deductions)
  - "format_notes": a brief string confirming the time limit and expected word targets

  Do not include bibliographies, reading lists, or specific citations. The scenario must be fully self-contained so that a student without web access can answer it from reasoning alone.
reasoning: |-
  We are creating a JSON object with the specified fields.
   The exam question should be self-contained and present the scenario as described.
   The model answer should be about 600 words and address the core issues.
   The marking scheme will have:
     total_marks: 20
     must_hit_points: 5 points with marks and description
     grade_A_criteria: what an A answer must do
     grade_B_criteria: what a B answer typically lacks
     common_errors: list of errors with point deductions (we can describe the deductions in the description)

   Let's break down the must-hit points (5 points, total 20 marks):

   1. Distinguishing priors from evidence (4 marks): The student must clearly explain that the disagreement is about prior probabilities, not about the evidence or the model's architecture, and that priors are pre-evidential commitments.

   2. Explaining meta-steadfastness (4 marks): The student must accurately articulate the commentator's argument that conciliationism does not apply to disagreements about priors because priors are framework-setting and adjusting them would lead to a regress.

   3. Addressing the uniqueness thesis (4 marks): The student must evaluate whether meta-steadfastness can avoid the conciliationist challenge based on the uniqueness thesis (that there is a unique rational response to the evidence) by arguing that priors are not constrained by the evidence in the same way.

   4. Addressing epistemic arbitrariness (4 marks): The student must evaluate whether meta-steadfastness avoids the charge of arbitrariness (that one's prior is arbitrarily chosen) by emphasizing the role of background reasoning (like Dr. B's analogical inference) and the non-arbitrary nature of such commitments.

   5. Regress argument and symmetry breakdown (4 marks): The student must analyze the commentator's regress argument and specify where the symmetry required by conciliationism breaks down (if at all) in the case of prior disagreements.

   Grade A criteria: 
     An A answer must successfully integrate all five points, clearly showing how meta-steadfastness avoids conciliationist objections without collapsing into dogmatism. It must demonstrate a nuanced understanding of the distinction between evidence and priors, and it must explicitly address both the uniqueness thesis and arbitrariness charge with precision. It must also engage with the regress argument and explain why symmetry breaks down at the level of priors.

   Grade B criteria:
     A B answer typically hits the main points but may lack depth in one or two areas. It might not fully articulate the regress argument or the breakdown of symmetry. It might also be less precise in distinguishing priors from evidence or in addressing the uniqueness thesis and arbitrariness charge.

   Common errors (with associated deductions, but note: the marking scheme doesn't assign specific deductions per error in the array, so we'll describe typical mistakes and imply that they lead to losing the marks for the point):

     - Conflating priors with beliefs about evidence: This would cause the student to miss the core distinction and lose marks on point 1.
     - Misapplying the uniqueness thesis: For example, claiming that the uniqueness thesis requires the same prior, which it typically does not (it usually applies to posterior beliefs given the evidence and prior). This would affect point 3.
     - Treating meta-steadfastness as mere psychological stubbornness: Missing the normative epistemic argument and the regress problem. This would affect point 2 and 5.
     - Failing to address the regress argument: This would cause loss of marks on point 5.
     - Overlooking the role of background reasoning in avoiding arbitrariness: This would affect point 4.

   Format notes: 90 minutes, 800-1000 words.

   Now, we write the exam question and model answer.
