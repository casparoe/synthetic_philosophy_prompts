answer: |-
  Right, you've nailed a pervasive and deeply frustrating rhetorical manoeuvre. That specific "two-shield cycling" between **Work as Moral Virtue** ("pride, meaning, dedication") and **Work as Economic Necessity** ("survival, markets, competition") to defend overwork/presenteeism absolutely deserves a name. While there isn't *one* universally established term, here's the breakdown and a proposed coinage:

  1.  **Why it's Not Motte-and-Bailey:** Correct. Motte-and-bailey relies on a defensible core (motte) and a more ambitious, vulnerable claim (bailey). Here, *neither* position is inherently safer or more defensible than the other; they are *different* lines of defence used situationally.
  2.  **Why it's Not Simple Hypocrisy:** Also correct. The arguments are often sincerely held *in the moment* depending on the challenge faced. The individual might genuinely believe in the virtue of hard work *and* feel trapped by economic pressures, switching emphasis without conscious deceit.
  3.  **Why it's Not Simple Equivocation:** Equivocation relies on shifting the *meaning* of a word. Here, "work" generally maintains its core meaning. The shift is in the *justification/rationale* for its intensity/duration – moving from a **normative/ethical framework** (what *should* be valued) to a **descriptive/pragmatic framework** (what *is* unavoidable). The word "work" itself isn't usually being redefined.

  **The Proposed Term: Ideological Air-Locking (or Rhetorical Airlocking)**

  *   **Why "Airlocking"?** An airlock is a sealed chamber allowing passage between environments with different pressures. Think of each argument (Moral Virtue / Economic Necessity) as a sealed chamber. When challenged in one chamber (e.g., "But this dedication is killing people!"), the arguer "seals the door" and "cycles" into the other chamber ("We have no choice, the market demands it!"). When challenged *there* ("Then let's change the market rules!"), they quickly cycle back ("But that undermines the dignity of passionate work!"). Each chamber protects against a specific type of critique, but they are fundamentally incompatible environments held together only by the structure (the pro-overwork stance).
  *   **Why "Ideological" or "Rhetorical"?** This highlights the systemic nature of the arguments – they draw on broader cultural narratives about capitalism, the Protestant work ethic, and economic determinism. "Rhetorical" focuses on the persuasive tactic itself.

  **Boundaries and Application of "Ideological Air-Locking":**

  1.  **Requires Both Frames:** The core mechanism is the *cycling* or *shuttling* between two distinct, incompatible justifications for the *same practice or stance* (e.g., long hours, presenteeism, resisting shorter weeks).
  2.  **Defensive Function:** It's primarily a defensive manoeuvre used to deflect criticism. The switch happens *in response to a counter-argument* that threatens the current justification.
  3.  **Shared Vibe, Contradictory Logic:** Both shields must share the *same surface-level conclusion* ("Therefore, overwork/long hours are justified/necessary") but rely on fundamentally *contradictory premises* (Intrinsic Moral Good vs. Extrinsic Economic Compulsion). They don't logically support each other; they just take turns blocking attacks.
  4.  **Same Actor/Group:** It's most clearly identified when the *same individual or group* employs both arguments situationally within the same debate or discourse.
  5.  **Distinguishing from Equivocation:** If the *meaning* of a key term (like "work", "dedication", "efficiency") is deliberately shifted to make the argument work, that *is* equivocation. Air-locking is about shifting the *entire basis of justification* (moral vs. pragmatic) while the core subject (overwork) remains constant. However, equivocation *can* sometimes be used *within* one of the airlock chambers (e.g., redefining "passion" as "willingness to work 80 hours").

  **Example Applying the Term:**

  *   **Critic:** "This 60-hour week culture is unsustainable and harms wellbeing. We should enforce a 4-day week."
  *   **Defender (Chamber 1 - Economic Necessity):** "Impossible! The global market operates 24/7. If we reduce hours, competitors will crush us. It's survival!" *(Shields against economic/pragmatic critique)*
  *   **Critic:** "Then let's push for international labour regulations or invest in automation to share the load fairly."
  *   **Defender (Switches to Chamber 2 - Moral Virtue):** "Regulation stifles innovation! And you can't automate passion or true dedication. People *find meaning* in their commitment; it's about pride in craft!" *(Shields against structural/regulatory critique and reframes the issue as personal virtue)*
  *   **Critic:** "But you just said it was only about survival..."
  *   **Defender:** *(Likely cycles back to Chamber 1 or deflects)* "The point is, demanding work *is* necessary, and good workers embrace that challenge!"

  **In this exchange, the defender is engaging in "Ideological Air-Locking."**

  **In British English, Ta Very Much:** You've spotted a classic bit of ideological gymnastics used to defend the indefensible grind. This "rhetorical air-locking" allows proponents of overwork to evade consistent critique by flipping between two incompatible bunkers – one preaching virtue, the other pleading necessity – neither of which properly holds up on its own, nor together. It requires both frames being deployed defensively by the same lot, shifting the goalposts whenever one defence gets breached. It's less about muddying the *word* "work" and more about swapping the entire *foundation* of the argument mid-debate. Proper frustrating, isn't it?
