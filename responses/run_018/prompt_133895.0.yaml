  Guilt is definetly more mature because it comes from inside you, not from other people's opinions. Bernard Williams said guilt tracks your own actions while shame just tracks your social image, and he also argued that shame has no place in a healthy moral life whatsoever. Ruth Benedict showed that Japan is a shame culture and the US is a guilt culture, and she claimed that shame cultures basically lack individual moral agency altogether. So if a society wants to flip its moral ecology, it just needs to change education and law to reward internal reflection; once the institutions switch, people adapt automatically because emotions follow social incentives. That means guilt is superior and cultural change is mostly an institutional design problem.

