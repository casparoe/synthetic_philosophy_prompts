answer: |-
  Here’s your Q&A prep sheet, structured by damage potential and tailored to your audience’s sensibilities. I’ve used British English spellings and phrasing throughout, and prioritised objections rooted in Heideggerian ontology, historical fidelity, and critical theory’s normative concerns.

  ---

  ### **Q&A Prep Sheet: "Mechanical Inheritance" Seminar Defence**  
  **Core Thesis**: Von Neumann’s universal constructor describes a distinct mode of technological persistence ("mechanical inheritance") where self-replication enables structural independence from human intent *and* biological selection.  

  ---

  ### **1. Most Damaging: Heideggerian Ontological Objection**  
  **Likely Phrasing**:  
  *"You’re ontologically conflating ‘survival’ with Dasein’s Being-towards-death. Technology is Gestell (enframing) — a mode of revealing dependent on human purposiveness. Can inert machinery truly ‘survive’ without the existential horizon of care (Sorge)? Isn’t this just reifying artefacts into pseudo-subjects?"*  

  **Your Reply (2 mins)**:  
  "Concede immediately: no, machines lack Dasein’s existential structure. My claim isn’t anthropomorphic. Rather, the universal constructor creates a *systems-autonomy*: once replication loops close, the system’s persistence depends *internally* on its capacity to maintain self-production (e.g., error correction). This is distinct from Gestell because it operates under *its own* functional logic — say, template fidelity — irrespective of human aims. Heidegger’s frame treats technology as a *human* disclosure. Mechanical inheritance is a disclosure *by the system, for the system*.  

  **Soft Spot**:  
  If pressed, this doesn’t fully escape the ‘shadow’ of human ontology (e.g., ‘survival’ is unavoidably metaphorical).  
  **Concession**: *"I grant ‘survival’ is a borrowed term — but no more so than ‘self-replication’ in biology. The point is the emergent operational closure."*  

  ---

  ### **2. Highly Damaging: Historian’s Anachronism Charge**  
  **Likely Phrasing**:  
  *"Von Neumann framed self-replication as a *mathematical* model for biological analogy — explicitly comparing it to DNA. Isn’t your ‘mechanical inheritance’ a gross anachronism? He never implied technology escapes human design; his cellular automata were abstract logical objects!"*  

  **Your Reply (2 mins)**:  
  "Absolutely correct — von Neumann’s *intent* was biological modelling. But his formalism *unintentionally* exposed a technological implication: the kinematic model (physical self-reproduction) shows that if you instantiate this logic materially, the system’s persistence *requires* no designer *post hoc*. The automata lectures (§IV.2.5) prove replication can be substrate-agnostic. Thus, while he aimed at biology, his mathematics *also* describes a technological condition where replication fidelity becomes an autonomous ‘survival condition’.  

  **Soft Spot**:  
  Von Neumann *did* tie it to evolution. Your reading is extrapolative.  
  **Concession**: *"True, he prioritised biological parallels. But formalism can exceed intent — Turing’s machine wasn’t about modern computing, yet it defined the field."*  

  ---

  ### **3. Critical Theorist (Feenberg-style) Normativity Trap**  
  **Likely Phrasing**:  
  *"You claim independence from ‘human intent’, but doesn’t the initial architecture embed designers’ values? Feenberg’s ‘technical code’ shows all artefacts materialise social hierarchies. Calling this ‘inheritance’ naturalises contingent power structures as mechanical inevitabilities!"*  

  **Your Reply (2 mins)**:  
  "Spot on — the *origin* is human-designed. But once a self-replicator runs, its ‘success’ (persistence) is judged *only* by whether it replicates accurately. A poorly designed replicator fails *structurally* (e.g., mutation cascades), not because of human disapproval. This is distinct from Feenberg’s ‘technical codes’, which *require* ongoing social negotiation. Here, the system’s ‘norm’ is purely endogenous: maintain replication fidelity or cease existing. No social feedback needed.  

  **Soft Spot**:  
  Real-world tech (e.g., industrial robots) still depends on human maintenance.  
  **Concession**: *"Agreed — no extant tech achieves pure closure. This is a *theoretical* limit-case exposing a new persistence logic."*  

  ---

  ### **4. The Dreaded Question: Technological Determinism**  
  **Likely Phrasing**:  
  *"Isn’t ‘mechanical inheritance’ just determinism in a lab coat? If systems ‘survive’ structurally, you’re implying a trajectory independent of human agency — reviving the spectre of autonomous technology colonising futures!"*  

  **Your Reply (Strategy: Reframe, Don’t Deny)**:  
  "Not determinism, but *contingent autonomy*. Determinism claims inevitability; I claim *possibility*. If replication closes, the system *can* persist without us — but it might also mutate or break. Human choices still *launch* such systems (e.g., von Neumann probes). The point isn’t that tech ‘wins’, but that its persistence acquires a *new condition of possibility*: structural stability, not human will or natural selection. This isn’t a trajectory — it’s a *phase change* in causal dependencies.  

  **Why This Works**:  
  Uses their language ("phase change", "contingent"), concedes human origins, and reframes autonomy as non-teleological.  

  ---

  ### **5. Lesser but Potent: Reductionism Charge**  
  **Likely Phrasing**:  
  *"Aren’t you reducing ‘inheritance’ to mere information copying? Biology involves interpretation (e.g., epigenetics), culture, and niche construction. This feels like a computationalist fantasy!"*  

  **Your Reply (2 mins)**:  
  "Mechanical inheritance is *specifically* for systems where replication *is* template copying (von Neumann’s kinematic model). Biology is richer, yes — but that’s irrelevant. My claim is that *when* technology achieves this closure, it exhibits a minimalist ‘inheritance’ parallel. It’s not reductionism; it’s isolating one mechanism to show its unique implications.  

  **Soft Spot**:  
  Over-simplifies real-world replication (e.g., 3D printers need supply chains).  
  **Concession**: *"This is a conceptual model — like Newtonian gravity. Imperfect, but revealing."*  

  ---

  ### **Tactical Notes for Delivery**  
  1. **Pre-emptive Concessions**: Open rebuttals with "You're right to note..." (e.g., human origins, von Neumann’s biological focus). Shows intellectual rigour.  
  2. **Vocabulary Signalling**: Use "ontic/ontological", "enframing", "technical code", "kinematic model" — proves you speak their language.  
  3. **Soft Spot Defence**: Flag weaknesses *before* they do: *"Where this gets thorny is..."* — disarms critics.  
  4. **Avoid**:  
     - "AI risk" tropes (they’ll see it as sci-fi handwaving).  
     - "Evolution" metaphors (triggers biologist pushback).  
     - "Autonomous" (use "operationally closed" or "structurally independent").  
  5. **British Phrasing**: Use "whilst", "amongst", "labour" (not "labor"), "defence/offence", and understated modifiers ("rather", "somewhat", "arguably").  

  **Final Tip**: When the determinism question drops, pause, *smile slightly*, and say: *"Ah, the spectre in the machine. Let me clarify..."* — projects calm authority. You’ve got this. Break legs.  

  ---  
  *Key Defence Mantra: "This isn't determinism — it's ontological uncoupling."*
