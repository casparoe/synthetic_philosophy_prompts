answer: |-
  Here’s a targeted Q&A prep sheet structured around your audience’s likely objections, ordered by damage potential. I’ve framed objections in their language and provided concise replies, weaknesses, and strategic concessions.

  ---

  ### **Q&A Prep Sheet: Expressive Duty in Ranked-Choice Voting**  
  **Core Thesis:** Voters have a *conditional expressive duty* to submit complete rankings to define boundaries of legitimate governance in lesser-evil RCV scenarios, even when bullet-voting is strategically optimal.  

  ---

  ### **Preemptive Concessions (Opening Remarks)**  
  Concede these upfront to neutralize low-damage objections:  
  1. **"Bullet voting is strategically rational"** → *"I fully concede bullet-voting is instrumentally optimal under standard decision theory when defeating the extreme candidate is the sole priority."*  
  2. **"Individual votes lack causal power"** → *"This duty is not grounded in efficacy—it cannot change outcomes in large electorates."*  
  3. **"No outcome-related obligation"** → *"The duty generates no requirement to alter electoral results."*  

  ---

  ### **Ranked Objections & Replies**  
  *(Ordered by damage: 1 = most threatening)*  

  #### **1. The "Hidden Assumption" Objection (Democratic Theorists / Social Choice)**  
  *Objection:* "You assume rankings communicate *normative boundaries of legitimacy*, but RCV ballots only record *ordinal preferences*. Nothing in the act of ranking distinguishes a ‘boundary judgment’ from a simple utility ordering. This conflates voting with political speech."  
  **Reply (2-min):** "The ballot’s communicative function depends on voter intent and institutional context. In lesser-evil dynamics, ranking the moderate above the extreme but below others signals a deliberate *cap* on acceptability: ‘This candidate is minimally tolerable, not affirmatively legitimate.’ Unlike utility rankings, this constructs a public threshold for authority. RCV’s design—especially its use in nonpartisan or legitimacy-sensitive contexts (e.g., post-conflict elections)—invites this interpretation."  
  **Weakness:** Relies on contested voter intentionality. Concedes that ballots lack inherent semantic content.  

  #### **2. Strategic Rationality Trumps Duty (Social Choice)**  
  *Objection:* "If bullet-voting maximizes expected utility (defeating the extreme) and expressive voting lacks causal impact, imposing a ‘duty’ demands irrationality. Arrow’s framework shows institutions can’t escape strategic incentives—your duty ignores revealed preference."  
  **Reply:** "Strategic rationality applies to *outcome optimization*, but democracy includes non-instrumental goods. Like civil discourse, voting has a constitutive role in defining public norms. Abstaining from bullet-voting when it’s strategically harmless (due to non-causality) signals commitment to shared institutional boundaries—a precommitment against normalizing lesser-evilism."  
  **Weakness:** Framing duty as "costless" undermines moral urgency.  

  #### **3. Aggregation Problems: Preferences ≠ Legitimacy (Social Choice)**  
  *Objection:* "Aggregated rankings reveal collective preferences, not normative boundaries. A vote for ‘Moderate > Extreme’ is indistinguishable whether motivated by policy alignment or grudging tolerance. Your ‘public record’ is unobservable and thus institutionally irrelevant."  
  **Reply:** "While ballots don’t tag motivations, *patterns* in rankings—e.g., widespread ‘Moderate-as-last-acceptable’ rankings—create an empirical baseline for interpreting mandates. Courts/commissions already analyze vote distributions to infer voter intent (e.g., in ballot-access cases). Systematic use of rankings to demote ‘minimally acceptable’ candidates makes legitimacy thresholds legible."  
  **Weakness:** Requires institutional capacity to interpret rankings normatively—often absent.  

  #### **4. Expression ≠ Duty (Democratic Theorists)**  
  *Objection:* "Expression can be aspirational without generating duties. Voting is either instrumental (useless individually) or cathartic (non-obligatory). Why isn’t this duty merely supererogatory?"  
  **Reply:** "In democratic theory, citizenship entails *role-based responsibilities*. When institutions enable expressive boundary-setting (as RCV does), using them to uphold systemic legitimacy becomes a duty of office—like jury nullification or conscientious objection. It’s not about personal preference but stewarding institutional integrity."  
  **Weakness:** Assumes contested civic republicanism; liberal theorists reject role-based duties.  

  #### **5. Legal Interpretation: Ballots Capture Choice, Not Philosophy (Lawyer)**  
  *Objection:* "Courts interpret ballots as records of *choice*, not moral statements. Your ‘boundary of governance’ isn’t legally cognizable—ranking Moderate 3rd instead of 2nd signals weaker support, not a legitimacy threshold. Ballot design serves tallying, not political theory."  
  **Reply:** "RCV’s legal innovation is capturing *intensity* and *acceptability*, not just binary choice. Alaska’s 2022 RCV post-election reports explicitly noted ‘consensus thresholds’—showing how rankings inform mandate legitimacy. Ignoring this invites authoritarian hijacking of ‘plurality acquiescence.’"  
  **Weakness:** Most jurisdictions lack Alaska’s interpretive framework.  

  #### **6. Institutional Design: Duty Imposes Cognitive Costs (Social Choice)**  
  *Objection:* "RCV simplifies voting by allowing partial rankings. Your duty burdens voters with ranking ‘acceptable’ candidates they may know little about, risking arbitrary choices. This undermines epistemic integrity for symbolic gains."  
  **Reply:** "The duty is *conditional*: only when voters *have* clear acceptability rankings (e.g., ‘Extreme unacceptable, Moderate tolerable, Progressive ideal’). It doesn’t require ranking uninformed preferences. Burden is low where voters already distinguish legitimacy tiers."  
  **Weakness:** Voters often lack consistent legitimacy hierarchies.  

  #### **7. Collective Action Problem Dilutes Duty (Social Choice)**  
  *Objection:* "If one voter’s incomplete ranking doesn’t affect the ‘public record’ (which requires mass participation), the duty dissolves into a coordination game. No individual has reason to comply unilaterally."  
  **Reply:** "Like voting itself, the duty’s value is *emergent*: compliance signals civic reciprocity, encouraging others. The ‘record’ is a Schelling focal point—individual acts gain meaning when patterned, yet still bind individually (cf. Quine’s ‘truth by convention’)."  
  **Weakness:** Risks circularity: duty exists only if others comply.  

  #### **8. Why Not Express via Other Means? (Democratic Theorists)**  
  *Objection:* "If defining boundaries is crucial, why not use petitions, protests, or social media? Voting is for selecting leaders; layering expressive duties onto it overcomplicates a minimalist institution."  
  **Reply:** "Elections are democracy’s *authoritative moment*—the sole act binding all citizens. Other expression lacks comparable weight in legitimizing power. RCV uniquely encodes acceptability hierarchies; refusing to use this tool cedes ground to purely strategic logics."  
  **Weakness:** Overstates elections’ expressive monopoly in digital age.  

  ---

  ### **Critical Strategic Notes**  
  - **Make-or-Break Reply:** **Objection #1 (Hidden Assumption)**. If you fail to defend the link between ranking and legitimacy boundaries, the thesis collapses. Anchor your reply in real-world RCV interpretation (e.g., Alaska, Maine post-election analyses) to avoid abstraction.  
  - **Concede Early:** Preempt low-damage objections (#6–8) in your opening to focus fire on core claims.  
  - **Weakest Point:** The duty’s enforceability/authority. Stress it as a *civic ethic* (like voting itself) rather than a coercive obligation.  
  - **Audience Targeting:**  
    - For **social choice theorists**: Emphasize that the duty *preserves institutional function* under strategic incentives.  
    - For **democratic theorists**: Frame it as *republican stewardship* of shared institutions.  
    - For the **lawyer**: Cite RCV’s use in *legitimacy-critical contexts* (e.g., constitutions, party primaries).  

  **Final Tip:** When pressed, pivot to "This duty is *conditional* and *institutionally specific*"—it arises only when RCV makes boundary-communication feasible and the electorate faces a clear lesser-evil dynamic. This narrow scope deflects "slippery slope" concerns.
