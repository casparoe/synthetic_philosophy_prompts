  ### Joint Statement on Judy Benjamin-Style Updating  
  **Between Halfer (H) and Thirder (T)**  

  #### (1) Agreed Claims  
  We, the undersigned halfer and thirder, affirm the following shared premises about the Judy Benjamin problem:  
  1. **Setup**: Judy is dropped into one of four equiprobable centered worlds:  
     - \( \text{RM} \): Red HQ, Main Company  
     - \( \text{RS} \): Red HQ, Second Company  
     - \( \text{BM} \): Blue HQ, Main Company  
     - \( \text{BS} \): Blue HQ, Second Company.  
     The prior credence \( P_\text{prior} \) is uniform: \( P_\text{prior}(\text{RM}) = P_\text{prior}(\text{RS}) = P_\text{prior}(\text{BM}) = P_\text{prior}(\text{BS}) = \frac{1}{4} \). Thus, \( P_\text{prior}(\text{Red}) = P_\text{prior}(\text{Red HQ}) = P_\text{prior}(\text{RM} \lor \text{RS}) = \frac{1}{2} \).  

  2. **The Radio Message**: Judy learns:  
     > "I repeat, you are in Red HQ. If you are in Red HQ, then the probability you are in the Second Company area is \( \frac{3}{4}\)."  
     This message is:  
     - **Reliable** (true and trustworthy).  
     - **Self-locating**: It centers information on Judy’s location.  
     - **Formally Construed** as two components:  
       - (A) The proposition \( \text{Red} = \text{RM} \lor \text{RS} \).  
       - (B) A constraint on the conditional credence: \( P(\text{RS} \mid \text{Red}) = \frac{3}{4} \).  

  3. **What Is Not Agreed**:  
     - Whether (A) is learned as a *categorical fact* or merely as *part of a constrained update*.  
     - Whether (B) requires Jeffrey-style updates (minimizing relative entropy) or preserves the prior ratio between Red and Blue.  
     - Whether the Principal Principle applies to (B) when (B) is a self-locating conditional chance.  

  4. **Stakes**:  
     - **Halfter claim**: After updating, \( P_\text{post}(\text{Red}) = \frac{1}{2} \).  
     - **Thirder claim**: After updating, \( P_\text{post}(\text{Red}) = \frac{1}{3} \).  
     The core divergence is whether learning (B) breaks the symmetry between Red and Blue.  

  ---

  #### (2) Disagreements Table  
  Each formulation is acceptable to the respective party.  

  | Issue | Halfer View (Agreed by H) | Thirder View (Agreed by T) |
  |-------|----------------------------|----------------------------|
  | **Principal Principle (PP) Applicability** | PP does **not** mandate aligning credence with (B). (B) is a *descriptive* constraint about Judy’s epistemic state, not an *objective chance* governing the dropping procedure. Thus, (B) need not directly constrain \( P(\text{RS} \mid \text{Red}) \) via PP. | PP **requires** aligning credence with (B). (B) reports an objective chance (from the military’s process), so Judy must set \( P_\text{post}(\text{RS} \mid \text{Red}) = \frac{3}{4} \) via PP, which propagates to \( P_\text{post}(\text{Red}) \). |
  | **Update Rule** | Updating uses **standard conditioning** on (A) or a propositional equivalent. (B) is redundant given (A): Learning (A) first implies \( P_\text{post}(\text{Red}) = 1 \), and (B) then refines within Red. Symmetry between Red/Blue is preserved absent counterevidence. | Updating requires **Jeffrey conditioning** (minimizing relative entropy) to satisfy the constraint (B). (A) is not learned categorically; (B) forces redistribution *without* fixing (A), breaking symmetry and lowering \( P_\text{post}(\text{Red}) \). |
  | **Effect on \( P(\text{Red}) \)** | (B) only constrains *within* Red, preserving \( P_\text{post}(\text{Red}) = P_\text{prior}(\text{Red}) = \frac{1}{2} \). Blue remains unconstrained, so the ratio \(\frac{P(\text{Red})}{P(\text{Blue})}\) is unchanged. | (B) breaks symmetry: Constraining within Red but not Blue makes Blue *relatively more probable*, so \( P_\text{post}(\text{Red}) = \frac{1}{3} \) via entropy minimization. |

