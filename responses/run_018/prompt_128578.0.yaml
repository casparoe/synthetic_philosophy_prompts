  #### (3) Cruxes  
  Each crux includes a variant case, predictions from both sides, and whether a result could be decisive.  

  **Crux 1: Indexical Uncertainty and Conditionalization**  
  *Variant*: **Sleeping Beauty with Asymmetric Awakening**  
  - *Setup*: A fair coin is flipped. If Heads, Beauty is woken once (Monday). If Tails, she is woken twice (Monday and Tuesday). Each awakening is identical. Upon waking, Beauty learns: "If the coin is Heads, the probability today is Monday is 1."  
  - *Question*: What is \( P(\text{Heads}) \)?  
  - **Halfer Prediction**: \( P(\text{Heads}) = \frac{1}{2} \). The conditional is redundant (given Heads, Monday is certain). Learning it doesn’t change ratios between Heads/Tails.  
  - **Thirder Prediction**: \( P(\text{Heads}) = \frac{1}{3} \). The constraint forces reweighting: Minimizing entropy lowers \( P(\text{Heads}) \) because Tails has more awakenings.  
  - **Decisive Potential**: If Beauty can be offered a bet that loses money only under one update rule, both accept this as decisive.  

  **Crux 2: The Mirror-Red Variant**  
  *Variant*: **Judy and Twin in Blue HQ**  
  - *Setup*: Judy has an identical twin in Blue HQ (same mental state). The prior is symmetric: Four worlds (RM, RS, BM, BS) each \( \frac{1}{4} \), with Twin always in Blue (BM or BS). Judy receives the *same radio message*.  
  - *Question*: What is Judy’s \( P_\text{post}(\text{Red}) \)?  
  - **Halfer Prediction**: \( P_\text{post}(\text{Red}) = \frac{1}{2} \). The message constrains only within Red; Twin in Blue preserves symmetry.  
  - **Thirder Prediction**: \( P_\text{post}(\text{Red}) = \frac{1}{3} \). The message is self-locating evidence *for Judy*, breaking symmetry (if she were Twin, she’d be in Blue and wouldn’t get this message).  
  - **Decisive Potential**: If Judy calculates expected utility of a bet on "I am in Red" and one rule dominates, both accept this as decisive.  

