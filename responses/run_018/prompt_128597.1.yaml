answer: |-
  Your friend's argument is clever but contains a critical misstep at **step (6)**, where the "replacement problem" (non-identity problem) is illicitly shifted from the domain of harm to the domain of obligations. This distorts the structure of intergenerational duties. Below, I diagnose the failure, explain its plausibility, price the alternatives, and show how to preserve (1) without accepting (8).

  ---

  ### **Diagnosis of Failure Points**
  1. **Step (4) → (5): Hidden Scope Shift (Collective vs. Individual Efficacy)**  
     The drowning-child analogy assumes individual efficacy: one person can save the child alone. Climate harm is *collectively caused* and *structurally mediated*. An individual reducing emissions to near-zero in a high-carbon system often has negligible impact on specific future people (e.g., your personal abstinence won't prevent sea-level rise for coastal dwellers in 2200). Obligations in collective action problems require coordinated institutions (e.g., carbon pricing), not just individual asceticism. Step (5) ignores this, demanding futile sacrifices.

  2. **Step (6): Equivocation on the Non-Identity Problem**  
     The non-identity problem (replacement) traditionally asks: *"Can we harm future people by causing them to exist in a worse state?"* Here, it’s misapplied to obligations:  
     - **Original domain (harm)**: Reducing births might change who exists, but if future people have lives worth living, we don't *harm* them by creating them in a climate-damaged world.  
     - **Illicit shift (obligations)**: Step (6) claims that reducing births *undermines obligations* to "specific future people." But obligations to future generations are **person-affecting generically** (we owe protection to *whoever exists* in 2200, not specific individuals). If we cause fewer people to exist, our obligations shift to protecting the *actual* future population. There’s no "original set" of 2200-people we must preserve.  

  3. **Step (7): Moral Mathematics Error**  
     Maximizing reproduction to "ensure" obligees exist confuses moral patients with moral duties. We don’t need to create people to have obligations toward them; we simply have duties to *future people as a class*. Obligations arise from our capacity to affect their well-being, not their specific identities.

  ---

  ### **Why Step (6) Looks Plausible**  
  It exploits an intuitive worry: "If we change who exists, how can we save *those specific people*?" This mirrors Parfit's non-identity puzzle. However, obligations in climate ethics are **threshold-oriented** (e.g., "prevent global warming >2°C") not **person-specific**. We owe a habitable world to future people *collectively*, not to pre-determined individuals. The slide occurs because the friend treats future people as fixed entities (like present strangers), ignoring that their existence depends on present choices.

  ---

  ### **What to Give Up, and the Cost**  
  - **Reject step (6)** and its implication in (7).  
    - **Cost**: Accept that obligations to future generations are **not identity-dependent**. We must ensure *conditions* for a decent life (e.g., stable climate), not guarantee specific people exist. This aligns with standard responses to the non-identity problem (e.g., Jan Narveson: "We are in favor of making people happy, not making happy people").  
  - **Modify step (5)** to acknowledge collective action dynamics.  
    - **Cost**: Accept that individual duties are constrained by feasibility and efficacy (e.g., advocating for policy change may be more obligatory than personal asceticism).  

  ---

  ### **Can You Save Premise (1) Without Accepting (8)? YES.**  
  Premise (1) is defensible: temporal parity holds that we owe equal moral consideration to future people. The error lies in misconstruing how obligations translate to action:  
  - **To save (1)**: Affirm that harming future people is wrong, but reject the friend’s overindividualized and identity-bound model of obligations.  
  - **Solution**: Frame obligations as **collective and systemic** (e.g., society must decarbonize) and **condition-focused** (protect livable conditions, not specific people).  

  **Revised Path**:  
  (1) → (2) → (3) [Obligations to future people exist] → (5*) [Individual duties involve promoting collective solutions, not just personal cuts] → **Block (6)-(8)**. No asceticism/reproduction demand follows.  

  ---

  ### **Conclusion**  
  The friend’s argument fails by conflating **identity-dependent harm** with **generic obligations** and ignoring **collective agency**. Step (6) is the linchpin: reject its misapplication of the replacement problem. You can keep temporal parity (1) and obligations to future people (3) without absurdity by emphasizing:  
  1. Collective obligations over atomized individualism,  
  2. The irrelevance of specific identity for threshold-based harms.  
  This preserves intergenerational justice while avoiding unlivable demands. The true "cost" is accepting that future ethics requires institutional action—not maximal reproduction or futile self-denial.
