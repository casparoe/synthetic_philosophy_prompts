prompt: |-
  hey, I've been thinking about pure time preference in climate debates and I keep running into this one argumentative pattern. Someone says we shouldnt sacrifice present welfare for people in 2200 because pure time preference means future goods just matter less - they're further away in time, thats reason enough. But then the same person will defend a preservation project by saying we have a duty to those future people because they will exist and suffer if we dont act. So future people are distant in time when that justifies discounting, but real moral subjects we must protect when that justifies spending. Its not just inconsistency, since both sides cite principled reasons. Is there a name for this specific toggle, where the ontological and temporal framing of future people shifts to match the desired conclusion? How does it differ from the non-identity problem, and if its unnamed, could you define it with clear boundary cases?
