  Okay, let me start by unpacking the user's query. They're pointing out an inconsistency in how people talk about future generations in climate debates. On one hand, they use pure time preference to discount future welfare, saying that because those people are far away, their well-being matters less. But then, when arguing for preservation projects, the same people say we have a duty to protect future generations because they'll suffer if we don't act. 

  Hmm, the user is noticing a toggle between two framings: future people as temporally distant (to justify discounting) and as moral subjects (to justify action). They want to know if there's a name for this specific contradiction. They also mention the non-identity problem but think it's different. So, I need to clarify how this differs from non-identity.

  First, I should recall what the non-identity problem is. It's about how different present actions create different future people. So, causing harm isn't straightforward because the harmed individuals wouldn't exist otherwise. But here, the user is talking about a conflict in valuation, not identity. So that's a key difference.

  Now, the user's deeper need might be understanding the structure of this inconsistency to better critique arguments in climate policy. They might be engaging in debates and need a solid framework to point out this flaw. They want a precise concept they can reference.

  I remember Parfit's work on future ethics. He discusses time preference and moral duties. The user's observation aligns with the dual discounting paradox. Time-based discounting versus harm avoidance. But is there a specific term? I think "pure time preference" itself is the term, but the contradiction between that and harm-based duties is part of a broader ethical inconsistency. 

  Maybe it's not named explicitly. Terms like "intertemporal moral schizophrenia" or "discounting-duty dissonance" come to mind, but they aren't standard. The closest is the conflict between pure time preference and the harm principle. The user wants boundaries: when does this toggle happen? Cases like using discount rates in cost-benefit analysis versus arguing for conservation as a duty to prevent harm.

  Also, the user is likely in academic or policy discussions, needing to articulate this flaw. They might want to show that opponents are switching frames opportunistically. So defining the toggle with clear examples is important. For instance, when someone dismisses future costs via discounting but invokes moral duty for preservation, that's the toggle. 

  I should explain why this isn't the non-identity problem. Non-identity is about harm to specific individuals based on their existence. Here, it's about how we value future people's welfare across time versus our obligations to prevent harm. Different issues. 

  The user might also want strategies to counter this inconsistency in debates. Highlighting the principle they're violating—either consistently applying discounting (which leads to harsh outcomes) or accepting strong duties to the future. Pointing out the frame-switching could be effective. 

  In conclusion, the answer needs to name the contradiction if possible, differentiate it from non-identity, provide clear examples, and offer a framework for critique. Since there's no standard term, defining it as "intertemporal frame-switching" or "discounting-duty toggle" with boundaries would help the user.
answer: |-
  This is a brilliant observation of a genuine and pervasive inconsistency in intergenerational ethics debates. While it doesn't have one universally agreed-upon name, it's a recognized pattern often discussed under the umbrella of **conflicting discounting principles** or **inconsistent intergenerational framing**. Here's a breakdown:

  1.  **The Core Inconsistency (The "Toggle"):**
      *   **Frame 1 (Justifying Inaction/Discounting):** Future people are viewed primarily through a **temporal lens**. Their welfare is inherently less valuable *simply because they exist later in time*. This invokes **pure time preference** (δ > 0) as a sufficient ethical principle for discounting future costs/benefits. ("A unit of welfare in 2200 is worth less than a unit today.")
      *   **Frame 2 (Justifying Action/Preservation):** Future people are viewed primarily through an **ontological/moral lens**. Their existence as potential moral subjects who *will suffer concrete harms* creates a strong, almost non-discounted, **duty of care or harm avoidance**. ("We *must* prevent the suffering of those who will exist in 2200.")

  2.  **Why it's Problematic (Beyond Simple Hypocrisy):**
      *   **Selective Application:** The speaker isn't necessarily contradicting a single principle; they are *selectively applying different, incompatible ethical frameworks* depending on which supports their desired policy outcome.
      *   **Avoiding Unpalatable Implications:** Consistently applying pure time preference (Frame 1) to *all* decisions, including existential risks, leads to conclusions many find morally repugnant (e.g., it drastically reduces the weight of preventing future catastrophes). Frame 2 avoids this but clashes with the justification for discounting.
      *   **Masking Value Judgments:** The toggle obscures the fundamental value judgment at stake: *How much intrinsic moral weight do we assign to future generations simply because they exist in the future?* The speaker wants to have it both ways.

  3.  **Potential Names & Frameworks:**
      *   **Intertemporal Moral Schizophrenia:** (Descriptive, captures the split thinking).
      *   **Discounting-Duty Dissonance:** (Highlights the conflict between the two invoked principles).
      *   **Opportunistic Framing of Future Persons:** (Focuses on how the *description* of future people shifts).
      *   **The Pure Time Preference / Harm Avoidance Paradox:** (Names the two conflicting principles). **This is likely the most precise descriptor.**
      *   **Inconsistent Intergenerational Valuation:** (Broader, but accurate).

  4.  **Distinction from the Non-Identity Problem:**
      *   **Non-Identity Problem (Parfit):** Asks *whether* a policy harms specific future people. Since different policies lead to the existence of *different* future individuals (e.g., aggressive climate policy vs. business-as-usual), we cannot say a policy *harms* a specific person who wouldn't exist otherwise, even if they live in a worse world. It's a problem of **harm attribution and personal identity** across possible futures.
      *   **The "Toggle" (Pure Time Preference/Harm Avoidance Paradox):** Assumes future people *will exist and will be harmed* by our actions/inactions. The problem is *how we value that harm across time* and *how we frame the moral status* of those future people to justify our valuation. It's a problem of **inconsistent valuation principles and moral framing**, not identity. The toggle happens *even when the existence of the specific future individuals isn't in doubt* (e.g., preserving a specific ecosystem for the use of people who *will* exist nearby).

  5.  **Defining the Toggle with Boundary Cases:**
      *   **Core Definition:** The **Intertemporal Valuation Toggle** occurs when an agent justifies policy choices concerning future generations by opportunistically switching between:
          1.  A **Temporal Discounting Frame:** Emphasizing the *distance in time* of future people to reduce the present value of future welfare losses or gains, relying primarily on *pure time preference* (δ > 0).
          2.  A **Moral Subject/Duty Frame:** Emphasizing the *concrete existence and vulnerability* of future people as moral subjects to establish a strong, relatively undiscounted *duty to prevent harm* or preserve essential goods.
      This switch happens based on which frame supports the agent's desired policy conclusion (e.g., inaction on costly mitigation vs. action on preservation), without reconciling the underlying conflict between the principles invoked by each frame.

      *   **Boundary Cases:**
          *   **Clear Case 1 (Discounting Frame):** "Spending $1 trillion today to prevent $100 trillion of climate damage in 2200 is irrational because of pure time preference. Future welfare simply matters less. We should prioritize current needs." (Uses temporal distance to *discount* future harm).
          *   **Clear Case 2 (Duty Frame):** "We must spend $500 million today to preserve this ancient forest/wildlife reserve/cultural heritage site. Future generations *will exist* and *will suffer a profound loss* of natural beauty/biodiversity/cultural connection if we don't. We have a duty to them." (Uses existence and potential suffering to invoke a *duty*, implying little or no discounting of this specific harm).
          *   **Not the Toggle (Consistent Discounting):** "Preserving the forest for 2200 might be nice, but its future value is heavily discounted. The $500 million is better spent on current poverty alleviation." (Applies discounting frame consistently, even if conclusion is harsh).
          *   **Not the Toggle (Consistent Duty):** "We must aggressively mitigate climate change *and* preserve key ecosystems. The suffering and loss of opportunity for people in 2200 matters almost as much as suffering today. Our duty to avoid harming future people overrides pure time preference." (Applies duty/harm avoidance frame consistently).
          *   **Gray Area (Different Harms?):** Distinguishing between *types* of harm (e.g., existential climate risk vs. loss of a specific species) might *seem* like a toggle but could reflect a genuine (though debatable) ethical distinction. The core toggle is when the *same type of justification* (temporal discounting vs. duty to subjects) is applied inconsistently to *similar magnitudes of impact on future welfare* based solely on the desired policy outcome.

  **Conclusion:**

  You've identified a crucial flaw in common intergenerational arguments: the **Intertemporal Valuation Toggle** (or **Pure Time Preference / Harm Avoidance Paradox**). It's distinct from the Non-Identity Problem, focusing not on *who* exists or *if* harm occurs, but on *how we inconsistently value and frame the moral status* of future people across different decisions. The core issue is the opportunistic shift between seeing future people as *temporally discounted welfare units* when that justifies inaction/cost-saving, and as *undiscounted moral subjects owed a duty of care* when that justifies action/preservation spending, without resolving the fundamental ethical tension between these perspectives. Recognizing this toggle is essential for more coherent and ethically defensible long-term decision-making.
