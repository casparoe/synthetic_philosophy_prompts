prompt: |-
  Hey, I'm in a course on comparative ethics and me and my friend got into a weird argument about Xunzi's Zhengming chapter. The passage I'm stuck on lays out a chain: if names aren't rectified then speech doesn't match reality, then affairs fail, then ritual and music don't flourish, then punishments miss thier target, and finally people don't know how to move hands and feet. Xunzi uses this to argue that fixing titles—father, son, ruler, minister—isn't just etiquette but the backbone of social order. I'm trying to read it through a niche lens my prof mentioned: treating role-cohearence like a Dutch-book constraint. The idea is that calling someone a father while he acts like a tyrant isn't just immoral, it's structurally incoherent, like holding contradictory beliefs about outcomes, and that this incoherence is what makes the whole chain collapse. Is that anologous to what Xunzi actually thinks, or am I forcing modern decision-theory onto Warring States philosophy?

  Can you help me understand the passage? Please think step by step: first summarize the logical structure of the chain, then say whether the coherence analogy holds or breaks, especially on whether Xunzi sees the problem as linguistic, moral, or systemic. You're an expert in Confucian ethics and formal philosophy, so really dig into the weeds—don't survey every interpretation, just focus on the logic. And please don't give me a bibliography or cite specific scholars; I can't check sources and I just want to understand the argument. If you need to reference the text, paraphrase it in your own words.
