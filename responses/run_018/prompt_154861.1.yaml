  ## Sestina for the Situationist Ethicist

  We build our lives on bedrock **character**,
  Or so the ancient masters would insist.
  But circumstance, the shifting **situation**,
  Whispers through the static, constant **noise**,
  That what we laud as steadfast, reasoned **virtue**
  Is merely learned reaction, patterned **habit**.

  The daily grind rehearses each **habit**,
  A script performed, not proof of **character**.
  We call it good, we name it **virtue**,
  When pressure mounts, a mild **situation**,
  Our practiced lines dissolve to frantic **noise**,
  Revealing the true, startled **response**.

  Observe the lab, the measured **response**
  To orders masked as duty, learned **habit**
  Obedient, despite the inner **noise**.
  Where was the core, the claimed **character**
  When switches clicked in that stark **situation**?
  The actor played, devoid of inner **virtue**.

  Is any act pure, uncoerced **virtue**?
  Or just the most convenient **response**
  Triggered by the unseen **situation**?
  We walk the paths of ingrained **habit**,
  Mistaking repetition for true **character**,
  While context hums its shaping **noise**.

  Beneath the theory, hear the restless **noise**:
  The doubt that questions stable **virtue**.
  The data points refuse neat **character**,
  Recording only the contingent **response**.
  We cling to tales of will, of **habit**,
  Blind to the cage: the overwhelming **situation**.

  You stand firm, invoking stable **situation**
  To ground the soul against mere **noise**,
  Defending practice, deep-set **habit**
  As the slow forge of lasting **virtue**.
  But watch the self, its fluid **response**
  Dissolve the myth of fixed **character**.

  The **situation** writes the **character**.
  The **noise** defines the fading **virtue**.
  A **habit** echoes: the final **response**.
