answer: |-
  ### Berkeley-Inspired Decision Procedure for Municipal Scrip System  
  Based on George Berkeley's core principles—**money as a token of social trust tied to real productive capacity, not intrinsic value**—this procedure ensures scrip issuance, redemption, and collateral acceptance align with tangible labor/assets. Staff must answer questions sequentially; failure at any step terminates the proposal. Judgment is required where values conflict or data is ambiguous (marked ⚖️).  

  ---

  #### **General Principles**  
  1. **Scrip ≠ Wealth**: Scrip is a "ticket" for labor/services, not a tradeable commodity.  
  2. **Trust Anchor**: Issuance must not exceed capacity to deliver services.  
  3. **Anti-Speculation**: Avoid backing with abstract/unrealized assets.  

  ---

  ### **Decision Procedure**  
  *Apply to: (A) Issuing new scrip, (B) Redeeming scrip, (C) Accepting collateral.*  

  #### **A. Issuing New Scrip**  
  **Question 1: What new productive capacity backs this issuance?**  
  - *Must establish*: Concrete labor/services mobilized *because of this scrip* (e.g., "Road crews hired for pothole repair").  
  - *Sufficient answer*: Specific, measurable services with delivery timelines.  
  - *Terminate if*: Vague or future promises (e.g., "Potential jobs").  

  **Question 2: Does scrip volume ≤ value of new capacity?**  
  - *Must establish*: Scrip issued ≤ market-rate cost of labor/services from Q1.  
  - *Sufficient answer*: Labor hours × prevailing wage or service cost.  
  - *Terminate if*: Scrip exceeds calculated value.  

  **Question 3: Will issuance strain redemption capacity?** ⚖️  
  - *Must establish*: Current redemption queue + new scrip ≤ 90% of monthly service capacity.  
  - *Sufficient answer*: Data on pending redemptions and provider bandwidth.  
  - *Hand to officer if*: Capacity data is incomplete (officer assesses risk to trust).  

  **Distortion Risk**: Berkeley emphasizes social trust, not just math. Officer must weigh public confidence if metrics are borderline.  

  #### **B. Redeeming Scrip for Services**  
  **Question 1: Is the service in scope?**  
  - *Must establish*: Service matches predefined categories (road repair, flood barriers, etc.).  
  - *Sufficient answer*: Clear match to official service list.  
  - *Terminate if*: Service excluded (e.g., "Building new parks").  

  **Question 2: Is labor/material capacity available ≤30 days?**  
  - *Must establish*: Providers confirm availability within timeframe.  
  - *Sufficient answer*: Signed commitments from service teams.  
  - *Terminate if*: Providers report backlog >30 days.  

  **Question 3: Does redemption align with citizen-assembly priorities?** ⚖️  
  - *Must establish*: Service matches current assembly resolutions.  
  - *Sufficient answer*: Documented priority list (e.g., "Flood response > road repair").  
  - *Hand to officer if*: Priorities conflict/absent (officer decides based on urgency/equity).  

  **Distortion Risk**: Berkeley’s "ticket" metaphor assumes consensus on value. Officer must resolve disputes threatening collective trust.  

  #### **C. Accepting Collateral to Back Scrip**  
  **Question 1: Is collateral directly convertible to scrip services?**  
  - *Must establish*: Collateral can fund/services *existing scrip obligations* (e.g., land sale profits hiring road crews).  
  - *Sufficient answer*: Legal mechanism turning collateral into labor/services.  
  - *Terminate if*: Collateral is speculative (e.g., stocks, unrealized land value).  

  **Question 2: Is collateral value certain and liquid ≤6 months?**  
  - *Must establish*: Appraised value ≥ scrip backed, with quick liquidation.  
  - *Sufficient answer*: Independent appraisal + buyer demand evidence.  
  - *Terminate if*: Value uncertain or liquidation >6 months.  

  **Question 3: Does collateral risk public trust?** ⚖️  
  - *Must establish*: Citizens perceive collateral as "real" backing (not abstract).  
  - *Sufficient answer*: Polls/focus groups confirming understanding.  
  - *Hand to officer if*: Perception data missing (officer judges reputational risk).  

  **Distortion Risk**: Berkeley warned against divorcing tokens from tangible value. Officer must block collateral that feels like "fictitious wealth."  

  ---

  ### **Application to Proposals**  

  #### **Proposal 1: Back scrip with undeveloped municipal land**  
  - *Type*: **C (Collateral)**  
  1. **Q1 (Convertible to services?)**: Land is undeveloped; profits are projected, not realized. No mechanism to fund services *now*. → **Terminate**.  
  2. *Distortion risk*: Berkeley’s "ticket" requires immediate backing. Land is speculative, violating the "tangible value" principle.  
  - **OUTCOME: REFUSED** (Unwelcome but unavoidable per Berkeley).  

  #### **Proposal 2: Emergency redemption for climate labor during budget crisis**  
  - *Type*: **B (Redemption)**  
  1. **Q1 (In scope?)**: Climate-adaptation labor (e.g., flood barriers) matches services. → **Proceed**.  
  2. **Q2 (Capacity ≤30 days?)**: Labor pool uncertain; no provider commitments. → **Terminate**.  
  3. *⚖️ Judgment call*: Officer overrides termination due to emergency. Proceeds to Q3.  
  4. **Q3 (Aligns with priorities?)**: Citizens’ assembly divided; no clear priority. → **Hand to officer**.  
     - Officer must decide: Prioritize disaster response (urgent but short-term) or infrastructure (long-term resilience).  
  - **OUTCOME: HUMAN JUDGMENT REQUIRED** at Q2 (override) and Q3 (values conflict).  

  ---

  ### **Key Clarifications**  
  - **Where judgment is unavoidable (⚖️)**: When data is incomplete, values clash, or trust is at risk. Officers must weigh Berkeley’s core tenet: *"Scrip is a social promise, not an abstract token."*  
  - **Unwelcome outcomes**: Proposal 1 fails because collateral lacks immediacy; Proposal 2 risks redemption delays if labor is unavailable. Both protect against Berkeley’s fear of "undermining trust."  
  - **Staff guidance**: "When in doubt, ask: *Can we deliver the labor/services tomorrow?* If not, refuse."
