  ### Key Design Choices & Defense:
  1. **First Split (Fiction-Dependence):**  
     - Forces engagement with your documentary test. Positions like **Catharsis** or **Hume** collapse if real suffering is introduced (hence *Fiction Required*). **Schadenfreude** and **Emotional Rehearsal** thrive on real pain.  
     - *Eliminates fence-sitting:* Rejects wishy-washy "sometimes real is okay" – you must commit.

  2. **Second Split (Narrative Necessity):**  
     - Tests if "sadness" needs a story. **Deflationary** and **Emotional Rehearsal** work abstractly; **Catharsis** and **Schadenfreude** demand narrative victims.  
     - *Incoherent combo flagged:* Abstract art cannot support "working through grief" (Node 2A) – grief requires an object.

  3. **Third Split (Safe Distance vs. Working Through):**  
     - Core mechanism split. **Catharsis/Schadenfreude** rely on detachment; **Hume/Emotional Rehearsal** require authentic engagement.  
     - *Incoherent combo flagged:* "Working through" real suffering (Node 2B) is ethically untenable – turns others' pain into self-help.

  4. **"Unnamed" Leaves:**  
     - Only used where positions would contradict branch logic (e.g., claiming fiction is essential *then* accepting real pain).  
     - **Deflationary** placed under *Fiction Required* + *Abstract*: If real suffering is acceptable (e.g., documentary), Deflationary fails (it *must* deny genuine emotion).

  5. **Indistinguishable Positions:**  
     - **Humean Conversion** vs. **Emotional Rehearsal** in narrative contexts – both claim "working through," but Hume *requires* fiction, Rehearsal does not. The fiction-dependence split forces divergence.  
     - **Schadenfreude** vs. **Catharsis** – Schadenfreude *requires* real/narrative suffering; Catharsis *requires* fictional/narrative. First split separates them.

