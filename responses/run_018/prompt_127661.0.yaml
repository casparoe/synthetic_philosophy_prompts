  ### **The Paradox of Tragedy: Why Seek Sad Art?**
  *A Taxonomy via Concrete Choices*

  **Start → Node 1: If you discovered the artwork depicted real, documented suffering (e.g., verified war footage), would this destroy your emotional "pleasure" or fundamentally alter its quality?**  
