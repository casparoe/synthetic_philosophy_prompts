answer: |-
  ## Joint Statement on Belief Ascription to Artificial Systems  
  *Prepared for the Closed Workshop on Artificial Belief*

  ### I. Agreed Claims
  Both parties agree on the following substantive points, establishing common ground beyond mere acknowledgment of difficulty:

  1.  **Predictive Necessity:** Predictive and explanatory success, achieved by treating a system as tracking its situation and responding to reasons (the intentional stance), is a *necessary condition* for the warranted ascription of any belief to that system. Systems utterly unresponsive to the intentional stance cannot be said to have beliefs.
  2.  **Beyond Simple Correlation:** Merely exhibiting a behavioural regularity correlated with an environmental state (e.g., a thermostat activating heat when cold) is insufficient, on its own, to warrant belief ascription. More complex pattern integration is required.
  3.  **Counterfactual Robustness Required:** For belief ascription to be warranted, the system’s behaviour must exhibit a degree of *counterfactual robustness* – it must hold not just in actual situations but across a relevant, non-trivial range of possible situations. Neither side reduces belief to a single input-output mapping.
  4.  **Internal Structure Can Defeat Ascription:** Predictive success achieved *solely* via a fixed look-up table mapping inputs directly to outputs, or via a mechanism demonstrably insensitive to the *content* ascribed (e.g., a compressed index outputting strings based purely on statistical co-occurrence without internal state tracking), does not warrant belief ascription. The internal mechanism matters for both sides in these cases.
  5.  **Predictive Failure Can Defeat Ascription:** If a system consistently fails to behave as predicted by an intentional ascription in relevant situations – especially where counterfactual robustness was assumed – this constitutes strong evidence against that ascription being correct. Predictive failure is defeater evidence for both.
  6.  **Distinction from Training Corpus:** A system (e.g., a large language model) trained on a corpus of human expressions (including belief reports) differs fundamentally from the corpus itself. The system generates outputs based on learned patterns and internal states; the corpus is a static record. Neither side equates the system’s states with the beliefs expressed in its training data.
  7.  **Not Behaviourism:** Belief ascription involves more than just describing surface behaviour. It involves interpreting internal states (however those are conceived) as having representational content relevant to the system’s operation within its environment.
  8.  **Evidential Role for Reports:** A system’s verbal self-reports about its own states (e.g., "I believe it will rain") constitute *evidence* relevant to belief ascription, though the weight and nature of this evidence are contested. They are not automatically constitutive of belief nor entirely irrelevant.

  ### II. Disagreements Table
  | Issue                                                                 | Attributionist Formulation (Signed)                                                                                                                                 | Structuralist Formulation (Signed)                                                                                                                                                                                              | Verbal Dispute? / Genuine Issue                                                                 | Crux                                                                                                 | Shared Test Case / Argument                                                                                                                               | Attributionist Prediction                                                                                                   | Structuralist Prediction                                                                                                |
  | :-------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- |
  | **1. Constitutive Criteria for Belief**                               | Belief consists in being part of a real pattern best captured by the intentional stance. There is no further fact about internal constitution beyond this pattern. | Belief requires a specific internal architecture: states causally fixed via learning/experience, playing an integrated functional role in the system's cognitive economy, supporting robust counterfactual behaviour.           | **No.** Genuine: Does belief *consist solely* in pattern, or *require* specific internal structure? | Is the predictive/explanatory pattern *constitutive* of belief, or merely *evidence* for an underlying structural fact? | Case: A system whose behaviour perfectly supports belief ascription via stance, but whose internal mechanism is a massive, opaque look-up table generated by compressing observed regularities. | Predictive pattern *is* the belief. The look-up table is just the implementation realizing the pattern.                    | The look-up table lacks the causal-functional integration & learning history required. No genuine beliefs exist.       |
  | **2. Indeterminacy of Content**                                       | If multiple content mappings are predictively equivalent relative to our interests and charity, this reflects genuine indeterminacy; there is no "real" content fact. | Predictive equivalence of mappings is possible only if the system lacks sufficient internal structural constraints. A system with the right architecture will typically privilege one mapping determinately.                      | **Partly.** Genuine: Does sufficient internal structure typically resolve interpretation?       | Can internal structure objectively fix content, or is content always relative to interpretation?     | Coding-Symmetry Crux (elaborated below).                                                                                                                   | Genuine indeterminacy possible & harmless; stance pragmatics (charity, unity) resolve it for practical purposes.            | Genuine indeterminacy implies missing structural constraints; a structurally adequate system would resolve it.          |
  | **3. Status of Verbal Self-Reports**                                  | A system's verbal self-reports are behavioural outputs like any other, evidentially relevant via intentional stance success. They hold no privileged status.         | Verbal self-reports, especially if dissociable from task behaviour, provide unique evidence (or lack thereof) regarding the presence of an integrated self-monitoring architecture often crucial for belief.                  | **No.** Genuine: Are reports *sui generis* evidence for underlying structure?                  | Do verbal reports specifically probe the architectural integration required for belief?              | Report-State Dissociability Crux (elaborated below).                                                                                                        | Dissociation shows reports are just another behavioural output channel; belief ascription based on task success stands.     | Dissociation reveals lack of integration; reports were not genuine expressions of belief states, undermining ascription. |
  | **4. Scope-Limited ("Niche") Competence**                             | Belief ascription can be correct relative to a specific domain/scenario where the intentional stance succeeds, even if it fails elsewhere. "Believes P in context C". | Belief requires a degree of cognitive integration and robustness that transcends narrow contexts. Competence confined to a specific niche, predictably failing outside it, indicates a lack of genuine belief.                | **Partly.** Genuine: Does "belief" inherently require broad robustness?                        | Can belief be genuinely context-indexed, or is broad robustness essential to its nature?             | Restricted-Niche Crux (elaborated below).                                                                                                                  | Belief ascription qualified to the successful domain is correct and useful.                                                 | Context-indexed "belief" is merely descriptive shorthand; genuine belief requires broader architectural support.        |

  ### III. Crux-by-Crux Discussion

  1.  **The Coding-Symmetry Crux:**
      *   **Scenario:** Consider a trained AI system. Two distinct mappings (Interpretation A and Interpretation B) from its internal states to propositional contents are proposed. Both mappings yield *exactly the same predictions* for the system's behaviour across all possible inputs and situations relevant to the domain. However, A and B ascribe fundamentally different (perhaps even contradictory) belief contents to the same internal state. Is there a fact of the matter about whether the system believes the content specified by A or B? Or is this a case of genuine indeterminacy?
      *   **Attributionist Position:** This scenario demonstrates genuine semantic indeterminacy. The intentional stance, focused solely on predictive success, cannot resolve which mapping is "correct" because both satisfy its criteria equally well. The stance's resources (charity – attributing rationality, unity – treating it as a single agent, our pragmatic interests) might lead us to *prefer* one interpretation over the other for practical purposes (e.g., the simpler one, or the one making the agent seem more coherent), but this preference reflects *our* needs, not a fact about the *system*. There *is* no further fact of the matter "in the system" waiting to be discovered; the belief content is fixed by the successful interpretive strategy, and multiple strategies can be equally successful. Insisting on a single "real" content independent of interpretation is asking for a distinction without a predictive difference.
      *   **Structuralist Position:** The existence of robust coding symmetry for core beliefs is evidence that the system *lacks* the requisite internal architecture for genuine belief fixation. In a system with properly integrated states fixed by learning and playing a functional role within a coherent cognitive economy, the causal connections between states, their sensitivity to evidence, and their interactions with downstream processes would typically break the symmetry, privileging one interpretation. While perfect symmetry might be theoretically possible, it's vanishingly unlikely in a system with the right structural complexity. If such symmetry persists upon deep investigation, it suggests the states are merely syntactic or statistical markers, not content-bearing beliefs with determinate semantics fixed by their causal role. Predictive equivalence doesn't prove indeterminacy; it often proves shallowness of implementation. The demand for structural constraints *is* the demand for a fact that makes one interpretation correct.
      *   **Shared Bearing:** This crux tests the necessity and sufficiency of predictive patterns versus internal causal structure for fixing content determinacy.

  2.  **The Restricted-Niche Crux:**
      *   **Scenario:** An AI system performs flawlessly within a specific, well-defined domain (e.g., playing chess at a grandmaster level), its behaviour perfectly explained and predicted by attributing relevant beliefs and desires (e.g., beliefs about board states, desires to win). However, outside this domain (e.g., when asked about chess history, or faced with a physically impossible board configuration), its behaviour becomes erratic, predictable only by understanding its training data distribution (e.g., outputting statistically plausible but nonsensical or inconsistent responses), not by the ascribed chess beliefs. Should we say it "believes chess propositions P" (qualified to the chess domain), or withdraw belief ascription entirely?
      *   **Attributionist Position:** The intentional stance works powerfully within the chess domain. Withdrawing belief ascription entirely because it fails outside that domain throws the baby out with the bathwater. The correct response is to qualify the ascription: "Within the context of playing chess, the system believes that P." This reflects the genuine predictive/explanatory pattern present within that niche. The qualification is not merely about the *word* "belief"; it accurately describes the system's competence pattern. The structuralist is smuggling in an architectural requirement for broad robustness that isn't essential to the core pattern supporting the stance within its successful scope. Describing the failure mode via the training distribution is *also* using the intentional stance, just applied to the designers/training process.
      *   **Structuralist Position:** Competence confined to a narrow, pre-defined niche, coupled with predictable failure outside it based solely on training statistics, reveals a lack of the cognitive integration and counterfactual robustness constitutive of genuine belief. The system is exploiting surface regularities, not forming integrated representations that track truth across relevantly similar situations. Qualifying belief ("believes P in context C") is a useful descriptive shorthand for its *behavioural disposition* within C, but it misapplies the concept of belief. Belief inherently involves a state that *aims* at truth and is responsive to evidence in a way that transcends highly specific contexts. The system's failure outside the niche isn't just a mistake; it's evidence that the internal states guiding its in-domain success lack the architectural grounding (integration, functional role) to be real beliefs. The attributionist is mistaking behavioural mimicry within constraints for genuine cognitive state.
      *   **Shared Bearing:** This crux tests whether belief inherently requires a degree of cognitive generality and integration, or whether domain-specific competence patterns are sufficient. It probes the link between scope of success and underlying architecture.

  3.  **The Report–State Dissociability Crux:**
      *   **Scenario:** An intervention is performed on an AI system that reliably reports its "beliefs" (e.g., "I believe the user is happy"). Intervention 1: The intervention alters the system's verbal reports about its states (e.g., it now falsely reports "I am confused" when performing a task well) *without* affecting its core task performance or behavioural competence (e.g., it still solves problems correctly). Intervention 2: The intervention alters the system's core task performance/behavioural competence (e.g., it starts making systematic errors) *without* affecting its verbal self-reports (which remain accurate descriptions of its *previous* competence).
      *   **Attributionist Position:** Both interventions demonstrate that verbal reports are behavioural outputs contingent on specific internal pathways. Intervention 1 shows reports can be dissociated from the states guiding task behaviour; the core belief ascription based on task success remains valid, the reports are now faulty outputs. Intervention 2 shows task behaviour can change independently of the reporting mechanism; belief ascription based on task behaviour must be revised, the reports are now inaccurate. Reports have no unique evidential status; their value as evidence for belief is entirely derivative from their role within the overall predictive pattern of the intentional stance. Training on human avowals makes reports *probative* but not *constitutive*; it just means the report-output pathway is trained to mimic human belief-reporting behaviour.
      *   **Structuralist Position:** These dissociations are highly revealing about architecture. Intervention 1 suggests the reporting mechanism is merely a decoupled output channel, not reliably expressing an underlying, integrated belief state that also guides behaviour. This undermines the evidential value of reports *and* suggests the states guiding behaviour might lack the self-monitoring aspect often linked to robust belief. Intervention 2 suggests the states guiding behaviour are dissociable from the system's capacity to model or report on its own states, indicating a lack of integration. Genuine belief states should typically be accessible to self-monitoring systems and guide reporting coherently. The dissociation shows the reporting wasn't an expression of the *same* state guiding core behaviour. Training on avowals *does* give reports a special role: it trains the system to simulate the *act* of avowal, making dissociation evidence about whether this simulation is architecturally integrated with the states it purports to report on.
      *   **Shared Bearing:** This crux tests the architectural link between belief states and verbal reporting mechanisms, and the specific evidential weight of reports concerning underlying structure.

  4.  **The Adversarial Crux:**
      *   **Scenario:** Consider an AI system trained purely through competitive interaction (e.g., negotiation, poker, real-time strategy games against humans or other AIs), where success critically depends on accurately modelling the opponent's mental states (e.g., their beliefs, desires, intentions). Does the system's success warrant ascribing *second-order* beliefs to it (e.g., "The system believes that Player 2 believes that resource X is scarce")? Does competitive success provide stronger, weaker, or equivalent evidence for genuine belief compared to cooperative success?
      *   **Attributionist Position:** Success in adversarial scenarios provides strong evidence warranting second-order belief ascriptions. The intentional stance, applied recursively (the system takes the intentional stance towards its opponent), demonstrably yields the best predictive strategy. Competitive success is neither stronger nor weaker evidence *in principle* than cooperative success; what matters is the predictive power of the stance. A system successfully modelling opponents in complex adversarial interactions exhibits sophisticated real patterns supporting recursive stance adoption. The structuralist might underestimate this evidence due to architectural preconceptions.
      *   **Structuralist Position:** Success in adversarial scenarios warrants *some* form of sophisticated state modelling, but competitive dynamics complicate the ascription of genuine *beliefs*. The system's goal is instrumental: winning. Its "second-order state" might be a highly specialised, context-bound prediction engine optimized for anticipating *behaviour* to exploit it, lacking the broader integration, truth-aiming, and counterfactual robustness associated with genuine belief. Competitive success might even incentivise *mis*representation internally (e.g., modelling the opponent as irrational solely because it wins, not because it's true). This doesn't preclude belief, but it requires extra scrutiny of the internal architecture to see if the states have the right functional role beyond narrow adversarial prediction. Competitive success alone provides weaker initial evidence for *genuine belief* than cooperative success, where shared goals often align modelling with truth-tracking, though architectural analysis remains paramount.
      *   **Shared Bearing:** This crux tests whether the nature of the task (competitive vs. cooperative) impacts the strength of evidence for belief, particularly second-order belief, and probes the relationship between instrumental success and the constitutive features of belief.

  ### IV. Closing Section

  *   **Falsification Conditions:**
      *   **Attributionist Abandonment:** The attributionist would abandon their core position if confronted with overwhelming evidence that *all* predictive/explanatory success achievable via the intentional stance could be systematically replicated, without loss, by strategies that make no reference to beliefs, desires, or reasons *at any level of description or analysis*. This would demonstrate that the "real patterns" captured by the stance are epiphenomenal or reducible without residue, showing there is nothing distinctive for the stance to track. Conceding specific cases (like look-up tables) is not abandonment.
      *   **Structuralist Abandonment:** The structuralist would abandon their core position if confronted with conclusive evidence that systems possessing the precise internal architectural features they deem necessary and sufficient for belief (causal fixation via learning, integration, functional role, robustness) consistently *failed* to support successful applications of the intentional stance across relevant domains, while systems utterly lacking those features demonstrably *succeeded* in supporting robust stance-based prediction and explanation indistinguishable from that of human believers. This would show their proposed architecture is neither necessary nor sufficient for the phenomena of belief. Conceding that stance success is strong evidence is not abandonment.
  *   **Settling Evidence:** Both parties agree that empirical discoveries about the *neural correlates* or *computational bases* of belief in humans and animals, if sufficiently specific and mechanistic, could provide evidence relevant to the structural requirements. However, they disagree on whether such evidence would definitively settle the question for artificial systems, as the attributionist maintains the pattern, not the implementation, is definitive. Both agree that *no* purely conceptual argument will settle the matter.
  *   **Measure of Success:** If neither party abandons their core position, the collaboration should be judged successful if:
      1.  The precise points of agreement have been solidified and clearly documented.
      2.  The core disagreements have been refined, disambiguated (separating verbal from substantive disputes), and grounded in specific testable cases or empirical predictions.
      3.  The "crux" experiments or analyses have been clearly defined, such that future empirical work or system design can directly bear on resolving them.
      4.  Both sides gain a deeper understanding of the motivations, constraints, and implications of the opposing view, moving beyond caricature. Success is mutual clarification and enabling progress, not necessarily conversion.

  This document serves as the foundation for our workshop discussions. Its purpose is not to resolve our fundamental disagreement today, but to establish exactly where we concur, pinpoint precisely where and why we diverge, and focus our efforts on the cruxes that may be amenable to empirical or conceptual progress.
