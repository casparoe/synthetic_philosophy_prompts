prompt: |-
  Hi. I'm on the governance working group for a mid-sized open source project (data infra, ~30 people with commit rights). I'm a backend engineer, no philosophy or law background, and I've been asked to draft the memo for a decision we have to make this week. I'd like you to write it. Sorry if this is long, I think the details matter.

  Background: about 14 months ago our founder stepped back and we replaced "founder decides" with a written charter. The relevant bits:

  - Section 2 defines who votes: an "active committer" is someone with at least one commit merged in the last 180 days AND at least 3 pull request reviews in the last 90 days. Right now that's 29 people.
  - Section 7: ordinary amendments need 2/3 of active committers. Any amendment that changes section 7 itself needs 3/4. There's also a sentence added last year saying no amendment may lower any voting threshold below the threshold currently in force — thresholds only ratchet up.
  - Section 11: the whole charter has to be reaffirmed by a simple majority every 24 months or it lapses, and if it lapses a five-person interim council named by the former founder runs everything for 90 days. Our window closes in six weeks.

  The case: a group of long-time contributors who've mostly drifted out of day-to-day work filed what we're calling Amendment 41. It does not touch section 7 at all. It does two things:

  (a) It rewrites section 2 so the review requirement becomes 1 review in the last 365 days, and adds that anyone who has ever been a committer stays on the roll unless they opt out in writing. We ran the numbers: the electorate goes from 29 to something like 90, and roughly two thirds of the new people haven't touched the codebase in over a year.

  (b) It includes a "construction and validation" clause: if any part of this amendment is later held to have needed a section 7 supermajority, then this amendment is deemed also to have amended section 7 to whatever minimum extent was necessary for it to be valid, and the rest of the amendment stays in force.

  Nobody on the call was fooled about what's going on — the people pushing it are friendly with the dormant ex-committers, and once the roll is 90 instead of 29 the 3/4 threshold is a completely different animal. But we could not agree on what to do about it, or on what principle we were even arguing about. The only useful thing anyone said was that it's "a schema migration that also rewrites the migration tool."

  Two of us think it's obvious: this is an amendment-rule change in substance, so it needs 3/4 of the current roll, and the validation sentence has to come out because if that's allowed then section 7's 3/4 is decorative — every future amendment just includes the same sentence and pre-authorizes itself. Two others say: if that's right, then entrenchment is cosplay, because any group can always get at the thresholds by editing the definitions the thresholds are written in terms of, so we should stop pretending, repeal the second sentence of section 7, and rely on the 24-month reaffirmation plus norms. One person says the validation clause is completely normal and we use severability language like that in our licenses all the time.

  What I need is a memo I can circulate to the list before Friday that recommends something we can actually put to a vote — and that says what threshold that vote is taken under, since that's disputed too (yes, I see the joke). Concretely:

  - A bottom line with a date on it: reject, accept, split it into parts, or defer past the section 11 deadline — pick one.
  - A rule or test for telling a "definitions change" from an "amendment-rule change" that we could apply again next time, not just a verdict on this one. The thresholds are written in terms of "active committers," and anyone who can rewrite that term can get at the thresholds without touching section 7, so I need something that handles that and not just a slogan about substance over form.
  - Treat the retroactive self-authorizing sentence on its own, and say why it is or isn't the same thing as ordinary severability language.
  - Engage honestly with the "entrenchment is cosplay" position. Two people I respect hold it and I think it's the strongest thing on the other side, so I don't want it waved away.
  - A short "what we are not deciding" section, because this thread will otherwise eat the entire charter.
  - Flag anywhere your recommendation depends on guessing how the vote actually goes.

  Constraints: please don't give me citations, case law, or a reading list. We don't have library access, none of us could check any of it, and it wouldn't move the committee anyway. Someone mentioned there's a game where changing the rules is the whole point; I don't want a summary of it, and I don't want famous constitutional cases name-dropped at me either. Plain prose an engineer can read, no legalese. Assume we know what a supermajority is and nothing else. Somewhere around 700-900 words, and it's fine if its a bit blunt — this list has been going in circles for a week and people are commited to their positions.
reasoning: |-
  We are drafting a memo for the governance working group. The memo must:
  1. Recommend a specific action: reject, accept, split, or defer Amendment 41.
  2. Provide a rule/test to distinguish "definitions change" from "amendment-rule change".
  3. Analyze the validation clause and compare it to ordinary severability.
  4. Engage with the "entrenchment is cosplay" argument.
  5. Include a "what we are not deciding" section.
  6. Be in plain prose, 700-900 words, no citations, no legalese.

  Constraints:
  - Current electorate: 29 active committers (as per current section 2).
  - Amendment 41: 
     (a) Changes section 2 to expand the electorate from ~29 to ~90 (by relaxing activity requirements and adding opt-out for ex-committers).
     (b) Includes a validation clause that says if any part needed a supermajority, then it is deemed to have amended section 7 minimally to make it valid.

  The dispute:
  - Some say: This is an amendment-rule change in substance, so it needs 3/4 of current 29. Also, the validation clause undermines section 7.
  - Others say: If we accept that definition changes can bypass entrenchment, then entrenchment is ineffective. So we should remove the ratchet and rely on reaffirmation and norms.
  - One says: The validation clause is normal severability.

  The stakes: Section 11 requires a simple majority reaffirmation of the entire charter in 6 weeks, or it lapses and an interim council takes over.

  Analysis:

  1. **The Validation Clause:**
     - Ordinary severability (like in licenses) typically says: if a part is invalid, the rest remains. It does not typically say: if a part is invalid, then we retroactively change the rules to make it valid. 
     - This clause is different: it says that if the amendment needed a higher threshold (because it effectively changes section 7), then we pretend that section 7 was amended to allow it. This is self-authorizing and circular. 
     - If accepted, then any future amendment could include this clause and bypass the 3/4 requirement for changing section 7. Thus, section 7's entrenchment becomes meaningless.

  2. **Is this an Amendment-Rule Change?**
     - The thresholds (2/3, 3/4) are defined in terms of "active committers". Changing the definition of "active committer" changes the meaning of the thresholds without changing the numbers. 
     - Example: Currently, 3/4 of 29 is 22. After the change, 3/4 of 90 is 68. The same numerical threshold (3/4) now requires more votes, but also the electorate is different (including inactive members). 
     - The effect is that it becomes harder to achieve a 3/4 majority because the denominator is larger and the voters include people who are not active. 
     - Moreover, the amendment is designed to make it easier for the current proponents to achieve their goal (expanding the electorate) and then make it harder for others to change the rules in the future (because the 3/4 threshold would require 68 votes instead of 22). 
     - Therefore, even though section 7 is not directly amended, the substance of the amendment rule is altered. 

  3. **A Rule/Test for the Future:**
     - Proposed rule: An amendment is considered an "amendment-rule change" (and thus requires the higher threshold) if it changes any provision that directly or indirectly affects the voting power required to pass any amendment, including changes to the definition of the electorate or the thresholds themselves. 
     - Specifically, if an amendment changes the size or composition of the electorate in a way that materially alters the difficulty of achieving the existing numerical thresholds, then it is an amendment-rule change. 
     - This test looks at the practical effect: does it make it harder or easier to pass future amendments? 
     - In this case, expanding the electorate from 29 to 90 (with many inactive) and keeping the same numerical thresholds (2/3, 3/4) increases the absolute number of votes required and introduces voters who may not be current. This is a material change to the amendment rule.

  4. **Engaging with "Entrenchment is Cosplay":**
     - The argument: If any group can change the definitions to bypass entrenchment, then entrenchment is just for show. So we should remove the ratchet and rely on the 24-month reaffirmation and norms. 
     - Response: Entrenchment is not useless. It creates a higher bar for changing the rules. The problem is that our current charter does not explicitly guard against definitional changes. But we can interpret the charter to require that changes which have the effect of altering the amendment rules must follow the higher threshold. This closes the loophole. 
     - Removing the ratchet (the sentence that prevents lowering thresholds) would make the charter less stable. The 24-month reaffirmation is a safety valve, but it's not a substitute for entrenchment. 
     - We should fix the loophole by applying the higher threshold now, and then consider a separate amendment to explicitly guard against such definitional changes in the future (if we want). 

  5. **What We Are Not Deciding:**
     - We are not deciding whether the electorate should be expanded. That is a separate policy question.
     - We are not deciding the merits of the dormant committers. 
     - We are not making a permanent change to the charter's interpretation; we are applying the charter as written to this amendment.

  6. **Recommendation:**
     - We must decide under the current rules. The amendment does not touch section 7, so on its face it requires 2/3 of the current 29 (i.e., 20 votes). However, because we have determined that it is an amendment-rule change in substance, it should require 3/4 (22 votes). 
     - But note: the amendment includes a validation clause that attempts to self-authorize. We cannot apply the amendment's rules until it is passed. So we must use the current rules to judge it. 
     - Therefore, we recommend:
          a) Split Amendment 41 into two parts: 
              Part A: the change to section 2 (the electorate expansion).
              Part B: the validation clause.
          b) Rule that Part A is an amendment-rule change and requires 3/4 of current active committers (22 out of 29).
          c) Rule that Part B (the validation clause) is invalid on its own because it attempts to undermine the entrenched procedure and is self-authorizing. It is not ordinary severability. Therefore, it cannot be voted on separately because it has no independent meaning without Part A. 
     - Alternatively, if splitting is not acceptable, then we must reject the entire amendment because the inclusion of the validation clause makes it an attempt to bypass the entrenched procedure. 
     - However, note the time constraint: we have 6 weeks until the section 11 reaffirmation. We cannot defer this decision because if we don't decide, the amendment remains pending and we might not have time to address it and then do the reaffirmation. 
     - Bottom line: Reject Amendment 41 in its current form. The group pushing it can bring a clean amendment that only changes section 2, but they must get 3/4 of the current 29 to pass it (because it is an amendment-rule change). Alternatively, they can bring an amendment that directly changes section 7 to lower the threshold, but that would require 3/4 of the current 29 (and then they could change section 2 with a lower threshold). 

     Why reject?
     - The amendment is a package that includes a self-authorizing clause which, if accepted, would set a precedent that erodes the entrenchment. 
     - Even without the clause, the expansion of the electorate is a change to the amendment rules and should require 3/4. 

     But note: if we split and vote separately, Part A (if passed with 3/4) would change the electorate, and then Part B would be voted on by the new electorate. However, we are not allowing Part B because it is invalid. 

     Alternatively, we could say: the entire amendment requires 3/4 of the current electorate because it is an amendment-rule change. If it gets 3/4 (22 votes) then it passes. But then the validation clause becomes part of the charter and creates the loophole. We don't want that.

     Therefore, the memo should recommend:

     **Recommended Action: Reject Amendment 41 in its current form.** 

     - We can then invite the proponents to submit a revised amendment that only changes section 2, and we will treat that as requiring 3/4 of the current 29. 
     - We can also consider a separate amendment to clarify the entrenchment provisions to prevent such definitional end-runs in the future (but that would also require 3/4 to pass).

  Draft Memo:

  ---

  **To: Governance Working Group  
  From: [Your Name]  
  Subject: Recommendation on Amendment 41**  

  This memo addresses Amendment 41 and recommends a course of action. We have a deadline: the charter must be reaffirmed under Section 11 in six weeks. Amendment 41 is pending and must be resolved first.  

  ### Summary  
  We recommend **rejecting Amendment 41 in its current form**. The amendment attempts to expand the electorate in a way that changes the amendment rules (requiring a 3/4 supermajority under current rules) and includes a validation clause that would undermine our charter's entrenched procedures. We should invite the proponents to submit a clean amendment that only addresses the electorate expansion, which we will treat as an amendment-rule change requiring 3/4 approval of the current 29 active committers.  

  ### Key Points  

  #### 1. Amendment 41 is an Amendment-Rule Change  
  - The charter's amendment thresholds (Section 7) are written in terms of "active committers". Changing the definition of "active committer" (as Amendment 41 does) changes the practical meaning of these thresholds.  
  - Currently, 3/4 of the active committers means 22 out of 29. After the change, 3/4 would mean 68 out of 90. This makes it harder to pass future amendments because:  
    - The absolute number of votes required increases.  
    - The electorate includes people who are not active in the project.  
  - Therefore, this change alters the substance of the amendment rules. Under the charter, any change to the amendment rules requires a 3/4 supermajority. Amendment 41 does not explicitly change Section 7, but it changes the foundation on which Section 7 operates.  

  **Proposed Rule for the Future**:  
  An amendment that changes the size or composition of the electorate in a way that materially affects the difficulty of achieving the existing numerical thresholds (e.g., 2/3 or 3/4) is considered an amendment-rule change and requires the higher threshold (currently 3/4).  

  #### 2. The Validation Clause is Not Ordinary Severability  
  - Ordinary severability (like in our licenses) says: if one part is invalid, the rest stands.  
  - Amendment 41's validation clause goes further: if any part is invalid (because it needed a supermajority), then the amendment is deemed to have amended Section 7 to make itself valid. This is self-authorizing and circular.  
  - If allowed, this clause would create a loophole: any future amendment could include it and bypass the 3/4 requirement for changing Section 7. That would make Section 7's entrenchment meaningless.  
  - Therefore, we cannot accept this clause. It is not comparable to standard severability.  

  #### 3. Engaging with "Entrenchment is Cosplay"  
  - Some argue that if any group can change definitions to bypass entrenchment, then entrenchment is ineffective. We agree that without a rule like the one we propose above, entrenchment can be circumvented.  
  - However, that doesn't mean we should abandon entrenchment. Instead, we should interpret the charter to require that changes affecting the amendment rules (like this one) follow the higher threshold. This closes the loophole and preserves the intent of entrenchment.  
  - Removing the ratchet provision (which prevents lowering thresholds) would make the charter less stable. The 24-month reaffirmation (Section 11) is a separate safety mechanism, but it is not a substitute for entrenchment.  

  #### 4. What We Are Not Deciding  
  - We are not deciding whether the electorate should be expanded. That is a separate policy question that can be revisited without the validation clause.  
  - We are not deciding the merits of including dormant committers.  
  - We are not making a permanent change to the charter. We are applying the charter as written to this amendment.  

  ### Recommendation and Next Steps  
  - **Reject Amendment 41 in its current form**. It requires 3/4 approval (22 out of 29) because it changes the amendment rules, but it also includes an unacceptable validation clause.  
  - We will invite the proponents to submit a revised amendment that:  
    - Only changes Section 2 (the electorate definition).  
    - Does not include the validation clause.  
  - This revised amendment will be treated as an amendment-rule change and require 3/4 approval of the current 29 active committers.  
  - We must resolve this quickly. Our window for the Section 11 reaffirmation closes in six weeks. If we cannot resolve Amendment 41 and then reaffirm the charter by then, the charter lapses and an interim council takes over.  

  Let's vote on this recommendation by Friday. The vote will be taken under the current rules: a simple majority of the governance working group (not the full committers) is required for procedural matters. This memo recommends a position on Amendment 41; the full committers will vote on the amendment itself if we proceed with a revised version.  

  --- 

  Word count: ~850 words.  
  This is blunt and to the point. It provides a clear rule for the future, distinguishes the validation clause, and engages with the "entrenchment is cosplay" argument without citations or legalese.
answer: |-
  ### Memo: Recommendation on Amendment 41  
  **To:** Governance Working Group  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Proposed Path Forward  

  #### Bottom Line  
  **Reject Amendment 41 in its current form.** It should be put to a vote under the current rules (2/3 of 29 active committers) but **fails on substance** due to its self-authorizing clause and amendment-rule implications. We’ll propose a clean revision for Section 2 changes alone, to be voted on under the 3/4 threshold it warrants. Deadline: We resolve this by next Friday to preserve the Section 11 reaffirmation window.  

  #### Why Reject? The Core Issue  
  Amendment 41 tries to rewrite the electorate while sidestepping Section 7’s supermajority guardrails. Its validation clause ("if this needed 3/4, it retroactively amends Section 7") is a circular self-license. If accepted, it sets a precedent that nullifies Section 7 entirely: future amendments could paste in the same clause and bypass any threshold. This isn’t governance—it’s a loophole.  

  #### Defining "Amendment-Rule Change": A Practical Test  
  We need a rule to separate routine tweaks from rule-undermining changes:  
  > **A change is an "amendment-rule change" if it alters the *practical difficulty* of passing future amendments.**  

  - **Why this works:**  
    - It ignores labels (e.g., "it only edits Section 2!") and focuses on outcomes.  
    - Today, passing a 3/4 amendment requires convincing 22/29 active contributors. Post-Amendment 41, it would require 68/90—including people inactive for years. This isn’t neutral; it radically shifts power by diluting the electorate.  
    - **Test applied here:** Expanding the electorate 3x with dormant voters *directly* alters the effort needed to hit 3/4. Thus, it’s an amendment-rule change requiring 3/4 approval.  

  #### The Validation Clause: Not Standard Severability  
  - **Ordinary severability** (like in licenses) says: "If part of this is invalid, the rest stands." It’s a safety net.  
  - **This clause** says: "If part of this is invalid *because it circumvented Section 7*, we retroactively rewrite Section 7 to permit it." That’s not severability—it’s a self-made skeleton key for future overrides.  
  - **Consequence:** Allowing this makes Section 7 decorative. Every future amendment could include it, neutralizing supermajorities.  

  #### Entrenchment Isn’t Cosplay—But It Needs Guardrails  
  The "entrenchment is cosplay" argument holds weight: if definitions can be changed to bypass thresholds, what’s the point? Our response:  
  1. **Entrenchment has value:** It forces broad consensus for foundational changes. Without it, a temporary majority could alter governance on a whim.  
  2. **But definitions are exploitable:** Yes—which is why our "practical difficulty" test above closes the loophole. If changing definitions *materially* shifts voting power (as here), it triggers supermajority scrutiny.  
  3. **The alternative isn’t better:** Repealing Section 7’s ratchet clause leaves us with *no* stability. The 24-month reaffirmation (Section 11) is a blunt tool—it could lapse accidentally or be gamed by opportunists. Norms alone won’t protect us when stakes are high.  

  #### What We’re *Not* Deciding  
  1. **Whether the electorate should expand.** This is about *how*, not *if*. A less aggressive expansion (e.g., 1 review in 180 days) might avoid amendment-rule status.  
  2. **The role of legacy contributors.** That’s a values debate for another day.  
  3. **Section 7’s fate.** If we want simpler governance, propose a standalone amendment (requiring 3/4!) to remove the ratchet clause.  

  #### Recommendation & Path Forward  
  1. **Vote to reject Amendment 41** under current rules (needs 2/3 of 29).  
     - Why: Its self-authorizing clause is poison. Even if the electorate change had merit, this clause invalidates the whole package.  
  2. **Invite proponents to submit a revised amendment** *only* changing Section 2:  
     - This *will* require 3/4 approval (22/29) because it alters amendment difficulty.  
     - Proposals should avoid extreme dilution (e.g., 90 voters with 66% inactive). Aim for sustainability.  
  3. **Deadline:** Resolve by next Friday. If we deadlock, Section 11’s 6-week clock risks lapsing the charter—handing control to an interim council.  

  #### If We Can’t Agree: The Reality Check  
  If this group fractures, Amendment 41 *might* pass with 2/3 of 29 (it only needs 20 votes). But that would ignite chaos: challenges to legitimacy, mass opt-outs, or a Section 11 reaffirmation failure. We’re engineers—we don’t ship broken schema migrations. Reject, rebuild, and vote cleanly.  

  ---  
  **Word count:** 780  
  **Tone:** Direct, no jargon, engineer-to-engineer.  
  **Next step:** Circulate this memo; vote by Friday.
