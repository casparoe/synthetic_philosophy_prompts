prompt: |-
  Hi — retired molecular biologist here, recently fallen down the rabbit hole of big-history books after I stopped running the lab. I've just read Harari's Sapiens and then Graeber and Wengrow's The Dawn of Everything back-to-back, and I'm stuck on a tension that feels like it should have a name but probably doesn't.

  Harari treats large-scale cooperation as a one-way ratchet: once people invent shared fictios — money, nations, human rights — they can coordinate thousands of strangers, and there's no sliding back to small bands without losing that capacity. It's like a phase transition in physics; you cross the critical point and the system's properties change for good.

  But Graeber and Wengrow keep describing ancient societies that apparently switched between hierarchical and flat structures depending on the season, or ran huge seasonal gatherings without permanent rulers. To me that looks like "reversible scaling": social complexity that can be dialled up and down like a dimmer switch, not a ratchet that only clicks forward.

  Can you compare Harari's idea of irreversible cognitive scaling with this notion of reversible scaling that I think is hiding in Graeber and Wengrow's examples? Are they describing the same thing at different magnifications, or are they genuinely incompatible? In particular, if societies really could expand and contract their coordination mechanisms seasonally, does that undermine Harari's claim that enduring shared fictions are neccesary for large-scale cooperation — maybe those big temporary gatherings ran on embodied ritual rather than on lasting myths?

  Also, is "reversible scaling" an actual term in anthropology or social theory? I made it up, but it feels like it ought to exist. If not, what should I call it?

  Sorry if that's muddled — my head's still full of enzyme kinetics, and my proof-reading's gone rusty since retirement. There's probably a typo or two hiding in here.
