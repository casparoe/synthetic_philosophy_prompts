prompt: |-
  You are a philosopher of science who has spent your career working on formal confirmation theory — Bayesian and non-Bayesian alike — and who is allergic to hand-waving. Before you write anything, spend some time brainstorming the space of possible requirements and the ways in which they can come apart; I would much rather have a considered list than a fluent one, so please show that structuring work briefly before settling on the final specification.

  I am putting together the framing document for a graduate seminar on evidence and confirmation, and I deliberately do not want to begin from the standard survey, because every survey runs the same moves in the same order: Nicod's criterion, the equivalence condition, the paradox, the Bayesian shrug that a green apple confirms but only by a hair, the end. I want the specification instead. Assume the purpose of a theory of confirmation, for my purposes, is to be action-guiding for someone deciding which observations to go and gather: an ecologist with a fixed fieldwork budget who wants to know whether it is worth her while to go out and examine one more raven, one more black thing, or one more arbitrarily selected object and record its colour and species. What would a theory have to deliver to be good enough for that? Write the desiderata: the cases it must get right, the distinctions it must respect rather than collapse (confirmation versus degree of confirmation versus expected value of information; relevance to one hypothesis versus relevance to a logically equivalent formulation of it; what an observation report confirms versus what the fact reported confirms), and the constraints it cannot violate (the probability calculus, if it is probabilistic at all; the asymmetry between a hypothesis and the consequences it entails). Give me the case or consideration behind each requirement rather than a bare list, and mark each requirement as non-negotiable, negotiable, or merely a prejudice of one camp. Two adjudications matter to me especially: whether the judgement that an observed white shoe does not confirm that all ravens are black is a datum any theory must respect or an intuition to be explained away, and whether the equivalence condition has any independent pull or is simply Nicod's criterion wearing a disguise.

  Then test your own list against three cases of mine, none of which appear in the textbooks as far as I can tell. First, the nesting case: the hypothesis that all ravens are black entails the weaker hypothesis that no ravens are white, and a white shoe is a white non-raven, so by the usual route it confirms the weaker claim — but how, if at all, is confirmation supposed to transmit from the weaker claim to the stronger one entailing it, and what does your answer commit you to about the special consequence condition? Second, the filtered report: an assistant is sent out instructed to bring back the first non-black thing she finds, and returns with a green apple; intuitively her report tells you nothing, formally it may or may not, and whether that intuition is a desideratum or an artefact of the set-up is exactly what I want settled. Third, the bookie: whatever your theory says about the green apple, translate it into the largest sum the ecologist should be willing to pay to have that observation made, and tell me whether your list can even express that number — my suspicion is that any requirement which cannot be cashed out in units of observations worth buying is decoration. Finally, flag any subset of your desiderata that you believe to be jointly unsatisfiable, name the single requirement that does the most work in excluding candidate theories, and add only a brief scorecard — a table is fine — for Hempel's satisfaction criterion, a Bayesian degree-of-confidence account, a Popperian view on which nothing is ever confirmed, and an urn or sampling-model treatment. Keep the weight firmly on the criteria and their motivating cases; I shall run the scoring discussion myself in class.
reasoning: |-
  Hmm, this user is clearly a specialist—a philosopher of science deeply familiar with confirmation theory who's frustrated with textbook treatments of the raven paradox. They want a rigorously structured desiderata list for confirmation theories, tailored to an ecologist's fieldwork decisions. No hand-waving allowed.  

  First, I need to map the conceptual terrain. The core tension is between formal constraints (like equivalence conditions) and pragmatic needs (like action-guidance). The ecologist framing is brilliant—it forces operationalization. I'll start by brainstorming dimensions:  

  * **What confirmation outputs must deliver:** Distinctions between absolute confirmation vs. incremental relevance vs. expected information value. The "bookie" test (maximum payable sum) here is non-negotiable—if a theory can't quantify the worth of an observation, it's useless for fieldwork.  

  * **Boundary cases:** The white shoe must appear as a datum (non-negotiable!) precisely because it's ecologically irrelevant to raven coloration. But the nesting case exposes deeper problems: if a white shoe confirms "no white ravens," does it indirectly confirm "all ravens black"? This murders the special consequence condition.  

  * **Procedural hazards:** The filtered report case (assistant bringing a green apple) is sneaky. Intuition says it's uninformative, but technically it *could* shift probabilities if we suspect biased sampling. The desideratum here is negotiable—it tests whether the theory handles observation selection effects.  

  For the scoring card:  
  - Hempel fails catastrophicslly (no degrees, equivalence condition enforced).  
  - Bayesianism handles degrees and value but stumbles on filtered reports.  
  - Popper is useless for action (never confirms).  
  - Urn models handle filtered reports but lack hypothesis flexibility.  

  The killer requirement is "value-of-information operationalization"—it excludes Hempel and Popper immediately. Also noting that desiderata 3 (incremental relevance) and 9 (no spurious equivalence) are likely incompatible in full generality.  

  Biggest insight: The white shoe *must* not confirm—not because of intuition, but because expending resources to examine shoes tells you nothing about ravens. That's the ecologist's bottom line.
answer: |-
  Below is a structured specification of desiderata for a confirmation theory tailored to action-guidance in empirical investigation. I begin with a conceptual map of the requirements space, then present the final desiderata with motivating cases, followed by adjudications of your key questions, analysis of your three cases, and a scorecard.  

  ---

  ### **Conceptual Map: Axes of Requirement Tension**  
  *(Brainstormed dimensions where desiderata may conflict)*  
  1. **Scope of Confirmation Judgment**:  
     - Absolute confirmation (H is true) vs. incremental confirmation (H is more plausible)  
     - Hypothesis-specific vs. hypothesis-relative (e.g., H vs. ¬H)  
  2. **Observation Handling**:  
     - Raw data (e.g., "object X is non-black") vs. report context (e.g., "this was found via strategy S")  
     - Direct observation vs. filtered evidence (e.g., selection bias)  
  3. **Logical Constraints**:  
     - Equivalence (if H≡H', confirmation identical) vs. syntactic sensitivity  
     - Consequence conditions (e.g., if H⊨H*, does confirming H confirm H*?)  
  4. **Operationalization**:  
     - Qualitative (confirms/does not) vs. quantitative (degree/expected value)  
     - Unit of utility (cost of observation vs. epistemic gain)  
  5. **Probability Framework**:  
     - Bayesian (subjective priors) vs. frequentist (sampling models) vs. non-probabilistic (e.g., deductive)  

  ---

  ### **Desiderata for an Action-Guiding Confirmation Theory**  
  *(Non-negotiable [N], Negotiable [G], Prejudice [P] flagged per item)*  

  1. **Incremental Relevance Distinction [N]**  
     *Motivation*: An ecologist cares whether an observation *changes* the hypothesis’s plausibility, not just whether the hypothesis is true. A green apple may raise P(all ravens black) by 0.0001%—technically "confirming" but actionally irrelevant.  
     *Case*: Observing one black raven vs. one green apple.  

  2. **Hypothesis-Grained Output [N]**  
     *Motivation*: Confirmation must be relative to *specific hypotheses under test*, not logical equivalents. "All ravens are black" (H₁) and "all non-black things are non-ravens" (H₂) may be equivalent, but an ecologist studying raven pigmentation gains nothing from examining shoes.  
     *Case*: White shoe confirms H₂ but not H₁ for a raven biologist.  

  3. **Report Context Sensitivity [N]**  
     *Motivation*: The *method* of evidence collection affects informativeness. If an assistant is instructed to "find a non-black thing," returning a green apple is unsurprising and uninformative.  
     *Case*: Filtered report (green apple brought by assistant tasked with finding non-black objects).  

  4. **Expected Value of Information (EVI) Quantification [N]**  
     *Motivation*: The ecologist needs to compute the maximum cost worth paying for an observation. EVI must be expressible in units of decision utility (e.g., dollars or time).  
     *Case*: "Bookie" test: What is the largest sum payable to see a green apple?  

  5. **Asymmetry of Hypothesis and Consequence [N]**  
     *Motivation*: If H ⊨ C, confirming C need not confirm H (violating the "special consequence condition"). Transmitting confirmation unconditionally leads to absurdity (e.g., a white shoe confirming all ravens are black via "no white ravens").  
     *Case*: Nesting case (white shoe confirms "no white ravens" but not "all ravens black").  

  6. **Non-Spurious Equivalence [G]**  
     *Motivation*: While Hempel’s equivalence condition (if H≡H', E confirms H iff E confirms H') is often a "disguised Nicod," it *can* hold *if* hypotheses are epistemically interchangeable. But this is negotiable: context may break symmetry.  
     *Case*: Observing a black raven confirms H₁ ("ravens black") more than H₂ ("non-black things non-ravens") for a raven-focused ecologist.  

  7. **White Shoe Datum [N]**  
     *Motivation*: The intuition that a white shoe *does not confirm* "all ravens are black" is non-negotiable. It arises from causal-pragmatic irrelevance: expending resources to examine shoes wastes the ecologist’s budget.  
     *Case*: Classic raven paradox; white shoe is not action-guiding for raven research.  

  8. **Probability Calculus Compliance [N]**  
     *Motivation*: If probabilistic, the theory must obey Kolmogorov axioms. Violations (e.g., conditioning on impossible events) lead to incoherent decisions.  
     *Case*: Bayesian updating must satisfy P(H|E) ∝ P(E|H)P(H).  

  9. **Degrees and Thresholds Distinction [G]**  
     *Motivation*: Separating *degree* of confirmation (e.g., Bayes factor) from *pragmatic thresholds* for action (e.g., "only investigate if P(H|E) > 0.8"). Thresholds are negotiable (context-dependent); degrees are not.  
     *Case*: A green apple slightly increases P(H) but not above an action threshold.  

  ---

  ### **Adjudications**  
  - **White shoe intuition**: **Non-negotiable datum**. It reflects the ecologist’s need for *efficient resource allocation*. Examining shoes cannot improve raven-color knowledge (absent background assumptions).  
  - **Equivalence condition**: **Largely a disguised Nicod**. It has "pull" only in toy logical worlds, not in goal-directed science. For the ecologist, H₁ and H₂ are *not* equivalent because their *evidential pathways* differ (ravens vs. non-ravens).  

  ---

  ### **Analysis of Your Cases**  
  1. **Nesting Case**:  
     - White shoe confirms weaker hypothesis H* ("no white ravens") but not stronger H ("all ravens black").  
     - *Commitment*: Rejects **special consequence condition** (confirmation does not transmit upward).  
     - *Why*: H entails H*, but H* is confirmed by evidence irrelevant to H’s *unique* content (e.g., raven-specific mechanisms).  

  2. **Filtered Report**:  
     - Intuition (report is uninformative) is **correct and non-negotiable**.  
     - *Formal reason*: The assistant’s selection strategy introduces **observation bias**. Let S = "search for non-black things." P(E|S) is high for any non-black object, so P(H|E, S) ≈ P(H|S). No update occurs.  
     - *Requirement*: Theories must model evidence as **(E, S)** pairs, not raw E.  

  3. **Bookie Test**:  
     - The ecologist’s max payable sum for observing a green apple is the **expected value of information** (EVI):  
       \[
       \text{EVI} = \max \left\{ \sum_H P(H) \cdot U(\text{act}|H) - \sum_H P(H|E) \cdot U(\text{act}|H) \right\}
       \]  
       where U is utility of actions given H.  
     - *Output*: For a green apple, EVI ≈ 0 (unless background assumptions link apple color to raven biology).  

  ---

  ### **Desiderata Conflicts**  
  - **Jointly unsatisfiable**: (3) Report Context Sensitivity + (6) Non-Spurious Equivalence. Contextual factors often violate equivalence; insisting on equivalence sacrifices actionability.  
  - **Most exclusionary requirement**: **EVI Quantification [4]**. It forces the theory to be probabilistic, quantitative, and utility-aware—excluding Popperian, Hempelian, and qualitative accounts.  

  ---

  ### **Theory Scorecard**  
  | **Requirement**               | **Hempel** | **Bayesian** | **Popper** | **Urn Model** |  
  |-------------------------------|------------|--------------|------------|---------------|  
  | 1. Incremental Relevance      | ❌          | ✅            | ❌          | ✅             |  
  | 2. Hypothesis-Grained         | ❌          | △¹           | ❌          | ✅             |  
  | 3. Report Context Sensitivity | ❌          | ✅²          | ❌          | ✅             |  
  | 4. EVI Quantification         | ❌          | ✅            | ❌          | △³            |  
  | 5. Asymmetry of Consequence   | ❌          | ✅            | ✅          | ✅             |  
  | 6. Non-Spurious Equivalence   | ✅          | △⁴           | ✅          | ❌             |  
  | 7. White Shoe Datum           | ❌          | ✅            | ✅          | ✅             |  
  | 8. Probability Compliance     | ❌          | ✅            | ❌          | ✅             |  
  | 9. Degrees vs. Thresholds     | ❌          | ✅            | ❌          | △⁵            |  

  **Key**: ✅ = satisfies, △ = partially, ❌ = fails.  
  1. *Bayesian*: Confirms logical equivalents equally unless background knowledge breaks symmetry.  
  2. *Bayesian*: Can model S via likelihoods P(E|H, S).  
  3. *Urn Model*: EVI computable only if sampling protocol is utility-aware.  
  4. *Bayesian*: Equivalence holds formally but can be contextually suppressed.  
  5. *Urn Model*: Degrees via frequencies; thresholds ad hoc.  

  ---

  ### **Conclusion**  
  A viable theory must be **Bayesian with EVI operationalization**, as it uniquely satisfies all non-negotiable desiderata while handling your cases:  
  - **Nesting**: Rejects special consequence via likelihood ratios.  
  - **Filtered Report**: Conditions on search strategy in likelihood.  
  - **Bookie Test**: Computes EVI from utilities and posteriors.  

  Hempel fails on incremental relevance and context; Popper rejects confirmation; urn models struggle with hypothesis granularity and EVI. The ecologist’s budget demands nothing less than a decision-theoretic Bayesianism.
