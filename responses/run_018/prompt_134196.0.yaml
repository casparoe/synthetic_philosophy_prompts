prompt: |-
  You are an expert philosophy-of-mind debate coach with deep familiarity with analytic philosophy and cognitive science. Before drafting anything, take a moment to think through the dynamics of a skeptical academic audience. I need you to prepare me for a Q&A session.

  I have no formal academic background, but I have spent years thinking independently about what emotions actually are. Next Thursday I am presenting my view to a university seminar in philosophy of mind. The room will contain mostly analytic philosophers who work on mental representation, plus a few cognitive psychologists who study affective neuroscience. They are accustomed to the standard debate: are emotions judgments (in the Nussbaum-style tradition), perceptions (in the Prinz-style tradition), or bodily feelings (in the James-style tradition)? They value conceptual precision, empirical compatibility, and resistance to mystery-mongering.

  My thesis is this: emotions are none of those three things. Instead, they are what I call resonance locks — brief, unstable alignments between an interoceptive prediction about one's bodily state and an anticipated social evaluation that has not yet been resolved into either belief or sensation. In other words, an emotion is not a mental state you possess, but a transitional calibration event that occurs before the mind decides whether to treat the input as a judgment about the world or as a raw feeling inside the body. Once the calibration settles, what remains is either a belief or a sensation, but the emotional moment itself is that unsettled in-between.

  Please draft my prep sheet. I want:

  1. The six to eight objections I will actually face from this specific audience, ordered from the most damaging to the least, each phrased in the vocabulary they would actually use rather than as strawmen.

  2. For each objection: a concise two-minute reply that a non-academic speaker can deliver without sounding defensive; and a brief note on where that reply is weakest or softest.

  3. The one objection I am secretly hoping nobody raises — include it anyway, with the same format, and flag exactly why it is dangerous for my position.

  4. A short list of concessions I should make up front to lower the temperature and show I am not simply dismissing the entire literature.

  Keep everything practical and focused. Do not provide a bibliography, reading list, or citation requests. Do not invent verbatim quotations from real texts; if you need to refer to a standard position, paraphrase it in your own words. Make sure your advice respects that I have no institutional authority in the room, so credibility must be earned through clarity and strategic concession rather than appeals to authority.

  Please begin with a brief brainstorming of the audience's likely mental moves, then present the prep sheet.
