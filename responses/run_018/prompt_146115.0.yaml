  The user mentions cases like preemption and overdetermination. These are classic problems in causation. For example, in preemption, two potential causes are present, but one acts first. Lewis handles this with his similarity metrics between possible worlds. Woodward/Pearl use interventions to see which variable actually affects the outcome. So already, they're tackling the same problem differently.

  Now, the crucial part: what happens when intervention is impossible? Think about cosmological boundary conditions. For Lewis, this isn't a problem. He can say that if the boundary condition were different, the universe would be different. That's counterfactual dependence. But Woodward/Pearl can't apply their interventions here because you can't manipulate the initial conditions of the universe. So they might say it's not a cause in their framework, or they need to adjust their definitions to include non-manipulable causes. That's a key point—it shows a substantive difference. Lewis cares about modal robustness (could it have been different?), while Woodward/Pearl care about manipulability (can we change it?).

  Similarly, mathematical dependencies. Take "2+2=4" causing "4=4". Lewis would analyze this counterfactually: if 2+2 weren't 4, then 4 wouldn't equal 4. But that feels odd because mathematical truths are necessary. Woodward/Pearl would say no intervention is possible here since you can't change mathematical facts. So they'd exclude this from causation, focusing only on contingent relationships. This highlights that Lewis's ontology is broader, including necessary connections, while interventionists restrict causation to empirical, variable-based scenarios.

  So, the impasse seems substantive. They fundamentally disagree on what causation requires: modal dependence vs. manipulability. The user asks if it's verbal (using "cause" for different things) or about ontology vs. practice. Here, it's both. Lewis is doing metaphysics—what causation is in the world. Woodward/Pearl are more about scientific methodology—how we discover and use causal relationships. So they're answering different questions but using the same term, which causes confusion.

