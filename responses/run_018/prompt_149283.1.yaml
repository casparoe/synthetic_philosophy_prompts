  First, I need to recall Kant's key concepts. His moral philosophy centers on rational autonomy: moral agents must act according to self-given laws. Only rational beings have intrinsic worth as ends-in-themselves. Animals, being non-rational, don't qualify. The user mentions self-consciousness; in Kant's framework, self-consciousness is tied to rationality. Rational autonomy requires self-awareness to recognize moral laws. So lacking self-consciousness likely means lacking rationality. These aren't separate; self-consciousness is part of being rational.

  The user's main confusion is the connection between lacking self-consciousness and indirect duties. Kant's argument is that without rationality, animals can't be ends-in-themselves. Thus, duties regarding them are indirect, aimed at preserving human virtue. The user wonders if this indirect approach conflicts with the principle of treating rational nature as an end. But Kant would say no conflict exists because animals aren't rational. The duty to avoid cruelty is a duty to oneself, not to the animal. 

  The tension the user feels is why Kant cares about cruelty at all if animals lack moral status. The answer lies in human moral development. Being cruel desensitizes us, making us more likely to harm humans. So it's about protecting human virtue. The user might be implying that Kant's stance is speciesist or inconsistent, but within his framework, it's consistent. 

  I should clarify that self-consciousness and rational autonomy are intertwined for Kant. The absence of self-consciousness means animals can't participate in the moral community. The indirect duty isn't a loophole but a necessary extension of duties to oneself. 

