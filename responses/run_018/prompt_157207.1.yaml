prompt: |-
  I've been working on a novel about a disaster-relief co-ordinator — think something like a gritty medical drama but with more philosophy — and my editor and I have been argueing about whether Scanlon's contractualist idea that you justify principles to each person can ever allow you to 'add up' complaints. Here are four scenarios that keep coming up in my draft, with my gut verdicts. I want to know if there's a single principle behind them, or if I'm just being inconsistent, and which verdict I'd have to ditch to keep things tidy. Please write your answer in British English — I'm submitting this to a UK workshop.

  Case one: you can save one person from permanent paralysis, or you can save five people from broken legs. I think you save the five. The individual complaint of the paralysed person is weightier, but it doesn't feel like it swamps all five others put together — so some kind of agregation is happening.

  Case two: you can save one person from death, or you can save a million people from a mild, temporary inconvenience — say, a day of nausea. Here I flip: I think you save the one. The million don't 'pool' their complaints into something that outweighs death. So numbers don't always agregate.

  Case three: there's a rescue plan that saves forty people from serious injury, but it exposes one completely unrelated bystander to a 1% risk of death. I think that's unacceptable — the forty don't dilute the one bystander's reasonable rejection. But if the risk is 0.001%, I think it's okay. So there's some threshold where aggregation fails but tiny risks don't count?

  Case four — and this is the one that breaks my brain: imagine a 'domino rescue' where saving patient A lets you save B, then C, all the way to Z, fifty people total. But the only way to start the chain is to perform an action that kills one outsider who isn't part of the chain. If I can save all fifty but only by killing the outsider, I think it's wrong. But if the choice is between saving just A (and therefore B through Z never get saved) versus saving A-through-Z and killing the outsider, I... actually think it's still wrong? Or maybe I think it's right? I'm genuinely unsure, and it feels like whatever I say here clashes with case two or case three.

  So: is there a coherent contractualist principle — maybe about the structure of complaints rather than their sum — that captures cases one through three? Does case four force me to abandon the idea that complaints are never agregable? And what would your repaired principle say about a scenario I haven't listed, like saving ten people from moderate harm by imposing a distributed burden on each of them? Please use British spelling and phrasing throughout.
reasoning: |-
  Okay, the user is working on a novel with philosophical themes around Scanlon's contractualism and aggregation of complaints in disaster scenarios. They've presented four cases where their intuitive judgments seem inconsistent and want to know if there's a coherent principle behind them. 

  First, I need to understand their core dilemma: they accept limited aggregation in case 1 (5 broken legs vs 1 paralysis) but reject it in case 2 (death vs million minor inconveniences). Case 3 suggests risk thresholds matter, while case 4 (domino rescue with killing) creates paralysis. Their editor is pushing them on whether contractualism can ever "add up" complaints.

  Hmm, the key tension is between Scanlon's individualised justification requirement and intuitive aggregation in some scenarios. The user's instincts actually align quite well with how contractualists handle aggregation - through comparative stringency rather than summation. 

  For case 4, the killing/saving distinction seems crucial. Directly killing an outsider violates the "means principle" even for greater good. But if it's merely allowing deaths through inaction versus active killing... ah, that's where their uncertainty comes from. The bystander's complaint feels different when they're actively sacrificed versus when their death is a side-effect.

  The distributed burden scenario they mention at the end is telling - contractualism would likely permit it because each person's complaint about their small burden can't reasonably outweigh another's serious harm. That helps distinguish it from case 2's death-versus-nuisance scenario.

  I should emphasise that their judgments aren't inconsistent but reveal different dimensions of reasonable rejection: magnitude differentials in case 2, the qualitative leap to active harm in case 4, and risk thresholds in case 3. The domino case breaks when we realise killing isn't just "not saving" - it creates a new complaint of violation.

  Perhaps I should structure the response around three contractualist tools: 1) the reasonable rejection test, 2) the means principle, and 3) the distinction between avoiding harm versus conferring benefit. That would unify all four cases without needing aggregation.
answer: |-
  Right, let's break this down with Scanlon's contractualism in mind, using British English as requested. Your instincts across the first three cases are actually surprisingly coherent within a sophisticated contractualist framework – it's case four that truly tests the boundaries. The key isn't *summing* complaints numerically, but comparing their *nature* and *stringency* under the lens of **reasonable rejection**.

  Here's a principle that captures your verdicts in Cases 1-3 and provides a framework for Case 4:

  **The Repaired Contractualist Principle:**
  > A principle permitting an action is justifiable to each person affected if no alternative principle could be reasonably rejected by someone with a stronger complaint. Complaints are assessed comparatively based on the **magnitude, probability, and qualitative nature** of the burden imposed or benefit withheld. Aggregation across individuals is generally impermissible *except* when:
  >   (a) The burdens being aggregated across many individuals are of a **very similar type and severity** to the burden borne by the single individual under the alternative; or,
  >   (b) The burden imposed on a few is of a **radically different, less severe kind** than the harm prevented for the many, *provided* the burden does not involve direct, intended, or highly probable serious harm/violation.

  **Applying the Principle to Your Cases:**

  1.  **Case 1 (Paralysis vs. 5 Broken Legs):**
      *   **Your Verdict:** Save the five (aggregation happens).
      *   **Principle Applied:** The burden (paralysis) and the prevented burdens (broken legs) are both *serious bodily injuries*, albeit of different magnitudes. The complaint of the one facing paralysis is very strong, but the *combined complaint* of five individuals each facing a significant, though lesser, injury (broken leg) is arguably *comparable in type* and sufficiently weighty *as a set* to potentially outweigh the single stronger complaint when choosing a principle for rescue allocation. The paralysis complaint doesn't "swamp" the others because they are in the same broad category of harm (physical impairment). **Aggregation permitted under condition (a).**

  2.  **Case 2 (Death vs. 1 Million Mild Nauseas):**
      *   **Your Verdict:** Save the one (aggregation fails).
      *   **Principle Applied:** Death is a burden of a *radically different, qualitatively supreme severity* compared to a single day of mild nausea. The complaint against dying is incomparably stronger than the complaint against a minor, temporary discomfort. No number of such minor complaints, because they are so fundamentally different and less severe, can aggregate into a complaint strong enough to reasonably reject a principle requiring preventing death over preventing vast numbers of tiny nuisances. The million complaints don't "pool" because they belong to a different moral category entirely. **Aggregation forbidden under condition (b) – burdens are incomparably different.**

  3.  **Case 3 (40 Injuries vs. 1% Death Risk to Bystander):**
      *   **Your Verdict:** 1% Risk Unacceptable, 0.001% Risk Acceptable.
      *   **Principle Applied:** This hinges on the **probability** element and the **direct imposition of risk**.
          *   *1% Risk:* Imposing a 1% risk of death is a *significant burden* on the bystander. It forces them to bear a non-trivial chance of the ultimate harm (death) for the benefit of others. Their complaint – "You are exposing me to a serious risk of dying against my will to save others from serious injury" – is very strong. The complaints of the 40 facing serious injury, while significant, are burdens *they would face anyway*; the principle doesn't *cause* their injury but fails to prevent it. The bystander's complaint about being *actively endangered* is likely strong enough to reasonably reject a principle permitting this level of risk imposition. *Aggregation fails* – the 40 injuries don't dilute the force of imposing a significant death risk.
          *   *0.001% Risk:* At this vanishingly small probability, the risk imposed on the bystander is negligible – akin to everyday background risks we all accept (driving, walking outside). Their complaint ("You exposed me to a minuscule, almost non-existent risk!") is extremely weak. It is unlikely to be strong enough to reasonably reject a principle permitting the action that saves 40 from serious injury. The burden imposed is so small it falls below a threshold of reasonable concern. *Aggregation isn't needed* because the single complaint is too weak to reject the principle.

  4.  **Case 4 (Domino Rescue - Kill One Outsider to Save 50):**
      *   **Your Brain-Breaking Verdict:** This is the crucible. The principle above, especially the emphasis on *direct imposition of harm* and *qualitative difference*, points towards it being **wrong**.
      *   **Principle Applied:**
          *   You are not merely *failing to save* the outsider; you are **actively killing** them. This is a direct, intended imposition of the supreme harm (death).
          *   The outsider has an *exceptionally strong complaint*: "You killed me to save others." This complaint has a fundamentally different moral character than the complaint of the 50 who are not saved ("You didn't save me").
          *   Condition (b) of the principle is triggered: Killing someone is a burden of a *radically different and supreme kind* compared to the burden of not being saved (even for 50 people). The complaint against being killed *directly and intentionally* swamps the combined complaints of not being saved.
          *   **The Means Matter:** Contractualism often incorporates a strong constraint against using someone *merely as a means*. Killing the outsider treats them purely as a disposable tool to achieve the saving of others. This drastically strengthens their grounds for reasonable rejection.
          *   **Why it feels like it clashes with Case 2 & 3:**
              *   *Case 2:* Here you *save the one* from death *rather than* preventing minor nuisances. In Case 4, you *kill one* to *save 50 from death/serious harm*. The actions are morally inverted. Killing is active harm; not saving is (usually) passive allowance of harm.
              *   *Case 3 (Low Risk):* The negligible risk imposed is worlds away from the certainty of killing. The complaint in Case 3 (low risk) is weak; the complaint in Case 4 (certain death) is maximally strong.
      *   **Verdict:** A principle permitting killing one innocent, unrelated person to save 50 others is likely reasonably rejectable by that one person. Their complaint against being lethally used as a means is stronger than the combined complaints of the 50 against not being saved. **Aggregation fails decisively here due to the active killing.**

  **The Distributed Burden Scenario (Saving ten from moderate harm by imposing a small burden on each):**

  *   **Scenario:** Can you save ten people from a moderate harm (e.g., a month of significant pain) by distributing a small burden (e.g., a few hours of mild discomfort) to each of them (or perhaps to each of a larger group)?
  *   **Principle Applied:** This looks permissible under contractualism and fits condition (a) of our principle.
      *   The burden *imposed* on each (few hours mild discomfort) is of the *same kind* but *significantly less severe* than the burden *prevented* for each (a month of significant pain).
      *   Each person receiving the small burden has a very weak complaint: "I had to endure a few hours of mild discomfort to prevent myself (or others) from suffering a month of significant pain." This complaint is unlikely to be strong enough to reasonably reject a principle requiring such a distribution when it prevents much greater harm per person.
      *   Crucially, no one is being asked to bear a burden radically different in kind or severity (like death) to benefit others disproportionately. The burdens and benefits are comparable and distributed. **Aggregation is permissible here** because the complaints are similar in kind and the imposed burden is minor compared to the harm prevented *for each individual*.

  **Conclusion:**

  You are **not** being inconsistent in Cases 1-3. Your instincts align well with a nuanced contractualism that rejects simple summation but allows for comparative weighing based on the nature, severity, probability, and means of imposing burdens. The core is **reasonable rejection**: could someone veto the principle because an alternative treats them *much* worse relative to others?

  **Case 4 is the outlier** for your intuitions because it involves *active killing*. This creates a complaint so powerful (violation, use as a mere means, imposition of death) that it cannot be outweighed by the aggregated complaints of non-rescue, even for 50 people. To "keep things tidy" with your verdicts in 1-3 and the core of Scanlon, you likely need to conclude the domino rescue involving *killing* the outsider is **wrong**. The alternative – saving just A – is tragic, but doesn't involve the direct moral violation of killing an innocent bystander.

  This principle – focusing on comparative reasonable rejection based on burden type, severity, probability, and means – provides a robust, coherent framework for your novel's philosophical dilemmas without resorting to simple utilitarianism. Good luck with the workshop!
