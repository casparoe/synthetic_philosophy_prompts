  Write a single 90-minute essay exam question (target length: approximately 1,200 words) on Sen’s liberal paradox that cannot be answered by reciting a standard summary. The question should require students to reconstruct the formal result with precision, apply it to a modified multi-agent scenario, and defend an interpretive stance on whether the paradox limits liberalism, Pareto efficiency, or the framework of social preference aggregation itself.

  In your prompt, specify exactly this constructed scenario: three agents (1, 2, and 3) rank three alternatives {a, b, c}. Agent 1 has a liberal domain over {a, b} with preference a ≻ b ≻ c. Agent 2 has a liberal domain over {b, c} with preference b ≻ c ≻ a. Agent 3 has no assigned domain with preference c ≻ a ≻ b. Ask students to determine, step by step, whether Minimal Liberalism (Condition L*) and the Pareto Principle can be jointly satisfied in this profile, explaining where transitivity of social preference generates the tension with Agent 1’s right.

  Then provide:
  1. A model answer that distinguishes Condition L from Condition L*, explains why Sen’s canonical proof uses L*, corrects two specific misreadings—(i) that the result proves liberal rights are inherently incoherent, and (ii) that weakening Pareto to “weak Pareto” dissolves the tension without philosophical cost—resolves the three-agent scenario, and argues for one interpretation of the paradox’s upshot.
  2. A marking scheme built around exactly five must-hit points, with marks assigned to each (total 25), and a one-line note on how candidates typically fail each point.

