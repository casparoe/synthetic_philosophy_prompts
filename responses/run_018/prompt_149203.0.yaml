  ### Marking Scheme (Total: 25 marks)  
  Candidates must hit these five points:  

  | Must-Hit Point                     | Marks | Typical Mistake                                                                 |
  |-------------------------------------|-------|---------------------------------------------------------------------------------|
  | **1. Precise definitions of U, P, L*** | 5     | Conflates L* (minimal decisiveness) with full liberalism or misstates transitivity. |
  | **2. Correct scenario resolution**   | 5     | Invents a cycle not present or misapplies L*/P (e.g., claims Pareto requires c ≻ a). |
  | **3. Existential nature of Sen’s result** | 5     | Asserts the profile refutes Sen’s theorem (vs. confirming its existential form). |
  | **4. Refutation of both misreadings** | 5     | Endorses misreading (i) or (ii) (e.g., “rights are incoherent” or “weak Pareto solves the paradox”). |
  | **5. Coherent interpretive stance** | 5     | Superficial analysis (e.g., “Pareto is the problem” without engaging aggregation limits). |

