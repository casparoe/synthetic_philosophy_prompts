answer: |-
  The BRCA1 patent case (*Association for Molecular Pathology v. Myriad Genetics*, 2013) draws this line based on specific legal and philosophical presuppositions about DNA:

  **What the Line Presupposes:**
  1.  **DNA as Information/Coding Sequence:** The distinction fundamentally treats the *sequence information* as separable from its physical chemical embodiment. Isolating the natural DNA merely extracts the molecule; it doesn't alter the inherent information (the specific sequence of nucleotides) nature provided. cDNA synthesis, however, involves creating a *new molecule* whose sequence is dictated by the *information* derived from nature, but whose specific chemical structure (lacking introns, different covalent bonding context) does not exist naturally.
  2.  **Invention Requires Human Manipulation of the Information:** Patent law requires an "inventive concept" applied to natural phenomena. Isolating the gene is seen as merely *discovering* and *extracting* nature's handiwork. Synthesizing cDNA is seen as *manipulating* the information – using human knowledge of splicing to create a distinct molecule optimized for a specific purpose (e.g., protein production in bacteria). The human intervention acts on the *informational content*.
  3.  **The Molecule as the Vessel, the Sequence as the Content:** It presupposes that the value and function of DNA lie primarily in its *sequence information* (the "code"), not just in its raw chemical properties. The cDNA has essentially the *same informational content* as the spliced mRNA, but packaged in a *different chemical vessel* (a stable DNA molecule synthesized in a lab).

  **Is this Coherent?**
  *   **Biologically:** Yes, in a functional sense. The function of DNA (coding for proteins, regulation) *is* determined by its sequence. That sequence *can* be read, copied, manipulated, and transferred to different molecules (like cDNA, synthetic genes, digital databases) while retaining its functional meaning. The information *is* separable.
  *   **Philosophically/Conceptually:** This is where debate arises. Critics argue DNA is *fundamentally* a chemical molecule; its "informational" properties are emergent phenomena arising from its chemistry and interactions within a cell. Separating "information" from the molecule is an abstraction, albeit a highly useful one. The patent distinction is coherent *within the framework* of biotechnology, where sequence information *is* treated as a manipulable entity, but it highlights the tension between viewing DNA as chemistry and viewing it as code.

  **Could a "DNA is Just Chemistry" Advocate Draw the Same Line?**
  *   **Potentially, but with Difficulty and Different Reasoning:** A strict chemistry-only advocate *could* argue for the cDNA patent based purely on chemical difference:
      *   **Isolated Natural DNA:** Still has the same covalent bonds, primary structure, and chemical composition as it did in the chromosome. Extraction might purify it, but doesn't fundamentally change its chemical identity as *the* BRCA1 gene sequence molecule.
      *   **cDNA:** Is a fundamentally *different* molecule:
          *   It lacks introns (chemically different sequence length and composition).
          *   It is synthesized *de novo* in a lab using different chemical processes.
          *   Its covalent bonds are formed artificially, not biologically.
          *   It doesn't exist naturally in any organism; it's a novel chemical entity.
  *   **Why the Line Might *Have* to Move for a Strict Chemist:** If DNA is viewed *only* as chemistry, without recognizing the primacy of sequence information, the argument for patenting isolated DNA becomes *stronger*, not weaker:
      *   Isolating a pure, specific DNA sequence from the complex soup of the genome involves significant chemical manipulation and purification. It results in a molecule that doesn't exist in that pure, isolated form in nature.
      *   **Consequence:** The "chemistry only" view would likely lead to *both* isolated natural DNA sequences *and* cDNA being potentially patentable, as both are chemically distinct from their natural state in the chromosome (isolated DNA is purified; cDNA is synthesized). The line drawn in *Myriad* specifically *rejected* this chemical purification argument for isolated DNA, emphasizing that the sequence information was the key and was natural.

  **Conclusion:**
  The *Myriad* line strongly presupposes that DNA's essential nature, for patent purposes, lies in its *informational content* (the sequence), which can be discovered but not invented when merely isolated. Invention occurs when humans *manipulate that information* to create a new molecule (cDNA) with a structure not found in nature. This view is biologically functional and coherent within biotechnology, but it prioritizes the informational aspect over the purely chemical one.

  A "DNA is just chemistry" advocate would struggle to justify the *same* line without implicitly relying on the informational value. They would likely see the chemical differences in *both* isolated DNA and cDNA as sufficient for patentability, meaning the line drawn by the Supreme Court would *have* to move to allow patents on isolated natural DNA sequences as well. The *Myriad* decision explicitly rejected this purely chemical view, anchoring itself in the distinction between discovering natural information and inventively applying it.
