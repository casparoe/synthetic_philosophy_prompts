  But could someone who views DNA purely as chemistry still support this line? They might argue cDNA is chemically distinct due to lacking introns and covalent bonds. So the line could hold for different reasons. However, if chemistry is the only basis, then isolated DNA might seem more patentable since it's modified chemically. But Myriad rejected that, showing the court's focus on information.

