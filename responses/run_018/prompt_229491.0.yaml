  First, I recall the key Supreme Court case, Association for Molecular Pathology v. Myriad Genetics (2013). The ruling said isolated natural DNA segments aren't patentable because they're products of nature. However, cDNA is patentable because it's lab-created, even though it corresponds to the natural sequence. 

