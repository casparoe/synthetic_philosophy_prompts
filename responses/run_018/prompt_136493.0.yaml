  First, I need to identify the absolute core concept to establish upfront. The biological function/dysfunction distinction seems non-negotiable - without anchoring this, the debate becomes unmoored. The evolutionary mismatch approach with sickle-cell and presbyopia strikes me as pedagogically strong because it creates internal tension: both involve biological "abnormalities" but only one gets medicalized. 

  Hmm... the tricky part is preventing misconceptions. I anticipate students will either collapse normativism into pure subjectivity ("it's just cultural preference") or mistake naturalism for statistical abnormality. Need interception points: after introducing sickle-cell (correct relativism immediately) and when presenting presbyopia (block the "statistics = dysfunction" fallacy). 

  For the closing question, something that forces dependency recognition: "If we discovered presbyopia caused reproductive disadvantage in Paleolithic ancestors, would naturalists have to call it a disease?" This probes whether they see naturalism's reliance on evolutionary function rather than modern consequences. 

  Biggest uncertainty: does using evolutionary biology to explain naturalism accidentally blur the normative boundary it's meant to clarify? I'll mitigate by emphasizing how normativists might respond - e.g., "But should we care about ancestral functions when setting modern healthcare priorities?" 

  Must ruthlessly exclude tangents like Boorse's full dysfunction criteria or historical condition debates. The twist - showing statistical normality and biological function can split within a single lifespan (presbyopia!) - should prevent easy wins for either position. 

  Confidence level: 85%. The sequence feels logically tight, but I'm testing whether the evolutionary framing does heavy lifting without smuggling assumptions. Maybe flag that explicitly when contrasting the two examples.
answer: |-
  Here’s the 50-minute session arc designed for maximum conceptual clarity, using evolutionary mismatch to force a confrontation between naturalism and normativism:

  **Core Concept to Secure First:**  
  **Biological Function/Dysfunction ≠ Statistical Abnormality ≠ Social Disadvantage.**  
  *Why?* Without separating these, students will conflate "disease" with statistical rarity or social inconvenience, reducing the debate to confusion.

  **Chosen Paired Example:**  
  **1. Sickle-Cell Trait (HbAS) in non-malarial environments**  
  **2. Age-Related Presbyopia (loss of near vision)**  

  ### What the Example MUST Show:
  - **Sickle-Cell Trait:** Biologically functional trait (*malaria resistance*) becomes statistically *abnormal* and socially *disabling* (e.g., exercise limitations, insurance discrimination) in non-malarial contexts.  
  - **Presbyopia:** Biologically *dysfunctional* (age-related breakdown of lens elasticity) is statistically *normal* (universal with aging) and often socially *accommodated* (reading glasses).  
  → **Key Insight:** Biology, statistics, and social values pull apart. Naturalism cares *only* about biological dysfunction; normativism cares about *harm in context*.

  ### What the Example MUST Avoid:
  - **Don’t imply sickle-cell is dysfunctional.** Emphasize: It’s a functional adaptation mismatched to its environment.  
  - **Don’t frame presbyopia as "not dysfunctional."** Stress: Naturalists see clear functional failure, even if universal.  

  ---

  ### Session Arc & Misconception Interception:
  **(Times approximate; bold = interception points)**  

  1. **Hook (5 min):**  
     *"If 90% of people had chronic back pain, is it still a disease? If a 'glitch' protects you from infection, is it healthy?"*  
     → Introduce the puzzle: Medicine labels conditions, but *on what basis?*  

  2. **Anchor Biological Function (10 min):**  
     Define biological function via **evolutionary role** (e.g., "The heart *functions* to pump blood; failure is dysfunction").  
     → **SECURE: Dysfunction = failure of evolved mechanisms.**  
     *Misconception Intercepted:* Prevents "disease = whatever we dislike."  

  3. **Introduce Paired Example (10 min):**  
     - Show sickle-cell trait: Functional in malaria zones, but causes problems elsewhere.  
     - Show presbyopia: Universal dysfunction, but rarely called "disease."  
     → **Question:** *"Which one has a biological dysfunction? Which one gets called a 'disease'? Are they the same?"*  

  4. **Clarify Naturalism (7 min):**  
     Naturalist claim: **Disease = biological dysfunction** (presbyopia = yes; sickle-cell trait = no).  
     → **Intercept Collapse #1 (NOW!):** *"Is naturalism just 'statistical normality'?"* → **NO.** Presbyopia is statistically normal but dysfunctional. Sickle-cell is abnormal but functional.  

  5. **Clarify Normativism (7 min):**  
     Normativist claim: **Disease = harmful dysfunction *in a valued context*** (sickle-cell trait = yes in cities; presbyopia = no in societies with reading aids).  
     → **Intercept Collapse #2 (NOW!):** *"Is normativism just subjective preference or cultural relativism?"* → **NO.** Norms are shared social values about well-being/agency (e.g., "inability to work without aids"), not arbitrary.  

  6. **The Twist: Lifespan Mismatch (8 min):**  
     *"Presbyopia shows this: Biologically dysfunctional at 50, but statistically normal and socially non-disabling. Sickle-cell is functional biologically but can be disabling. **Neither biology nor society 'wins' alone.**"*  
     → Evolutionary mismatch splits biology/statistics/values *within one lifetime*.  

  7. **Closing Question (3 min):**  
     **"Could presbyopia *become* a disease if society valued unassisted near vision as essential for dignity? Could sickle-cell trait *stop* being a disease if stigma vanished? What does each theory say?"**  
     → Tests grasp of dependencies: Naturalism ignores social change; normativism depends on it.  

  ---

  **What to REFUSE to Cover:**  
  - Taxonomy of dysfunction (e.g., Boorse’s subsystems).  
  - Historical debates (e.g., homosexuality in DSM).  
  - Chronic conditions without clear mismatch (e.g., schizophrenia).  

  **Confidence & Uncertainty:**  
  - **Confidence: 85%.** The evolutionary mismatch frame cleanly separates biology from values. Paired examples prevent easy defaults.  
  - **Least Sure Point:** Whether emphasizing evolved function risks implying naturalism is *reducible* to evolutionary biology (it’s not—functions are inferred biologically). Mitigation: Stress that naturalists use evolutionary *evidence*, not just evolutionary *goals*.  

  **Why This Works:**  
  You force students to see that biology doesn’t dictate medicalization (presbyopia), and social harm doesn’t imply biological failure (sickle-cell). The distinction stops being wordplay when they realize medicine sits at the crossroads of two incommensurable frameworks.
