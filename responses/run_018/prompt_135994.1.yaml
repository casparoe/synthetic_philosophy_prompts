  ## Joint Statement on the Genocide Debate: Seeking Common Ground Amidst Disagreement

  **Preamble:**  
  We, the undersigned, representing a strict-constructionist interpretation of the Genocide Convention and an expansive view of genocide as a concept, have engaged in rigorous debate. While profound disagreements remain, particularly regarding the legal definition's scope and application, we affirm shared principles and concerns about preventing mass atrocities and ensuring justice for victims. We present this statement to clarify both our common ground and irreconcilable differences, hoping to foster more productive dialogue.

  **Agreed Principles (Numbered):**

  1.  **Lemkin's Original Scope:** We acknowledge that Raphael Lemkin's original conceptualization of genocide, developed prior to the UN negotiations, was significantly broader than the definition ultimately codified in the 1948 Convention. It explicitly included cultural destruction and the targeting of political groups.
  2.  **Jurisprudence on Intent:** We accept that the jurisprudence of international tribunals (ICTY, ICTR, ICC) since the 1990s has consistently required proof of "specific intent" (*dolus specialis*) – the intent to destroy, in whole or in part, a protected group as such – for a legal finding of genocide, as defined by the Convention.
  3.  **Distinctive Status of "Genocide":** We agree that the label "genocide" carries a unique and unparalleled moral, historical, and legal weight distinct from other atrocity labels (e.g., crimes against humanity, war crimes). This status influences historical memory, political response, legal consequences, and survivor recognition.
  4.  **Politics and Impact of Labelling:** We recognize that the application or withholding of the genocide label is inherently political and has profound real-world consequences. It significantly impacts survivors' sense of recognition and justice, influences international response and accountability mechanisms, and shapes historical narratives.

  **Table of Core Disagreements:**

  | Aspect                     | Strict-Constructionist Position                                                                 | Expansive-Naming Activist Position                                                                 |
  | :------------------------- | :---------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------- |
  | **Protected Groups**       | Upholds the Convention's exclusive list: national, ethnic, racial, and religious groups. Adding political groups or cultural entities fundamentally alters the legal category. | The Convention's exclusion of political groups and cultural destruction was a politically motivated compromise. These omissions must be rectified to capture the full spectrum of genocidal violence experienced globally. |
  | **Definition of Acts**     | Maintains the Convention's focus on physical and biological destruction acts. Cultural destruction alone does not constitute genocide under law. | Lemkin's inclusion of cultural genocide was essential. Systemic acts like forced assimilation, language eradication, and family separation constitute genocidal acts aiming at group destruction. |
  | **Intent Requirement**     | Requires specific, documented intent to physically/ biologically destroy the group. Intent is a core, indispensable legal element. | Intent can and must be inferred from the scale, pattern, systematic nature, and foreseeable consequences of state actions targeting a group, especially structural violence. |
  | **Primary Harm (Crux A)**  | **Dilution:** Broadening the term beyond its legal definition risks diluting its unique moral force and legal utility, making it harder to mobilize consensus for action in cases of explicit extermination (e.g., Rwanda). | **Exclusion:** Withholding the genocide label from recognized patterns of group destruction (e.g., cultural eradication) replicates the original silencing at the UN, inflicting profound harm by denying recognition and impeding accountability. |
  | **Evidence Standard (Crux B)** | Requires clear, direct evidence (documents, orders, statements) proving specific intent to destroy the group *as such*. Systemic patterns alone are insufficient for a legal conviction under the Convention. | Systemic patterns, overwhelming scale, discriminatory targeting, and foreseeable catastrophic outcomes provide legally sufficient and morally necessary evidence of genocidal intent in the context of modern state violence. Demanding direct proof sets an impossible standard. |

  **Analysis of Cruxes:**

  *   **Crux A (Test Case: Canadian Residential Schools):**
      *   **Strict Prediction:** Applying the legal genocide label to the Residential School system, while recognizing its horrific nature as cultural destruction and potentially crimes against humanity, dilutes the distinct meaning of genocide as requiring specific intent for physical/biological destruction. This weakens the term's power to distinguish and condemn cases like Rwanda where explicit extermination was the goal.
      *   **Expansive Prediction:** Refusing the genocide label for the Residential School system, despite its intent to destroy Indigenous groups *as groups* through forced assimilation, child removal, and high mortality, repeats the 1948 erasure of cultural genocide. This denial inflicts ongoing harm on survivors and obstructs full accountability.
  *   **Crux B (Test Case: Holodomor):**
      *   **Strict Prediction:** Without clear, documented orders or statements proving Stalin or the Politburo specifically intended the famine to destroy Ukrainians *as an ethnic group* (rather than suppress resistance or implement collectivization generally), the Holodomor, however catastrophic and man-made, cannot meet the legal threshold for genocide under the Convention. The high bar for intent is necessary for legal precision.
      *   **Expansive Prediction:** The Holodomor's scale, specific targeting of Ukrainian regions, simultaneous suppression of Ukrainian culture and elites, and the predictable mass death of millions of Ukrainians constitutes overwhelming evidence from which genocidal intent must be inferred. Requiring a "smoking gun" order for genocide ignores how modern states commit such crimes through bureaucratic systems and sets an impossible standard.

  **The Verbal Dispute Question:**

  *   **Strict Position:** A significant part *is* verbal. We primarily use "genocide" as a precise *legal verdict* requiring strict proof under the 1948 Convention. Others use it as a broader *historical-moral descriptor*. Resolving this verbal distinction wouldn't settle the core legal dispute about the Convention's scope or the evidentiary standard for intent. Even with clarified terminology, we would still oppose applying the *legal* label to acts falling outside the Convention's definition or lacking proven specific intent. However, it might clarify that expansive uses are often invoking a different concept than the legal one.
  *   **Expansive Position:** While terminology matters, the dispute is substantive, not merely verbal. The refusal to recognize cultural destruction or political targeting as genocidal *even morally/historically* (beyond the strict legal verdict), and the insistence on unrealistic evidentiary standards for intent, perpetuate systemic injustice. Agreeing that the expansive use is "historical-moral genocide" rather than "legal genocide" might clarify the *nature* of the disagreement but wouldn't resolve it. The core issue is whether the *moral concept* itself should encompass structural violence and whether the *legal definition* is fundamentally flawed and needs reform. We believe the moral concept *should* be broader and the law *should* reflect that.

  **Conclusion:**  
  Despite our deep disagreements on the definition, scope, and application of the term "genocide," we share a fundamental commitment to preventing mass atrocities, seeking justice for victims, and recognizing profound suffering. We agree that the power of the genocide label is immense and must be wielded responsibly. Our debate centers on *how* to best achieve prevention, justice, and recognition: through rigorously protecting the unique legal weight of the existing term, or by expanding its reach to confront systemic violence and historical erasure. We present these positions clearly not to sow division, but to foster a more precise and honest conversation about preventing the gravest crimes against groups.

  **Signed,**

  **[Representative of Strict-Constructionist Viewpoint]**

  **[Representative of Expansive-Naming Activist Viewpoint]**
