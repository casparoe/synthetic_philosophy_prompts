prompt: |-
  I manage a network of six physiotherapy clinics, and I must decide which of two rehabilitation programmes for lower-back injuries — call them Programme A and Programme B — to adopt across the whole network next year. We have run both for the past eighteen months, with patients free to choose between them, and our analysts have produced recovery figures that have left the board divided.

  In five of our six clinics, Programme B produced a higher proportion of patients reporting substantial recovery within twelve weeks. Yet when the figures are pooled across the entire network, Programme A comes out ahead by a comfortable margin. The explanation, so far as we can tell, is that Programme A was chosen disproportionately at our two specialist sports-injury clinics, which see younger patients with acute injuries who tend to recover quickly under almost any regime, whereas Programme B was chosen mostly at our general clinics, which serve older patients with chronic conditions.

  Half the board insists the pooled figure is the honest one, because it reflects the network's actual overall results. The other half insists we should compare like with like within each clinic, and that the pooled figure is merely an artefact of where each programme happened to be offered. Before I commission a further study, I would like to settle the matter on the data we already have.

  My question is therefore twofold. First, on the figures as described, which programme should we adopt — and does your answer change depending on whether patients will continue to self-select into programmes, as they do now, or whether we begin assigning them centrally at intake? Second, a colleague of mine claims there must be a purely statistical rule for deciding whether to trust the pooled figure or the clinic-by-clinic breakdown — some quantity one could compute from the numbers themselves that would tell us which comparison is the right one. Is she correct, or does the right choice depend on something the spreadsheet cannot show? Please give your recommendation and your reasoning, and write your answer in British English.
reasoning: |-
  Okay, the user manages a network of physiotherapy clinics and needs to decide between two rehabilitation programmes for lower-back injuries. They have data showing that Programme B performed better in five out of six clinics when looking at clinic-level results, but Programme A comes out ahead when pooling data across all clinics. This discrepancy is explained by Programme A being more popular at specialist sports-injury clinics with younger patients who recover quickly, while Programme B was chosen more at general clinics with older patients with chronic conditions. 

  The user's board is divided: some argue the pooled figure reflects overall network results, while others believe clinic-by-clinic comparisons are more honest. The user wants to know which programme to adopt based on existing data, and whether this changes depending on whether patients self-select programmes or are assigned centrally. They also ask if there's a statistical rule to decide whether to trust pooled or clinic-level data.

  First, I need to recognise this as a classic case of Simpson's Paradox, where aggregated data shows a trend that reverses when broken down. The key is understanding why this happens—here, it's due to confounding variables (clinic type and patient demographics). 

  For the first question: which programme to adopt? If patients continue self-selecting, adopting Programme B across all clinics might actually harm outcomes. Why? Because Programme A's success is inflated by being chosen by easy-to-treat patients at sports clinics. Forcing all clinics to use B would likely reduce success rates for those easy-to-treat patients without necessarily improving outcomes for complex cases. The network-wide success rate would likely drop. 

  If assigning patients centrally, the approach changes. They'd need to match programmes to patient types: Programme A for younger/acute cases, Programme B for older/chronic cases. This requires demographic data to replicate the self-selection pattern intentionally. 

  For the second question: is there a statistical rule? While statistics can flag confounding variables (e.g., via stratification or causal diagrams), it can't automatically resolve which approach is "right." That depends on the operational reality—whether clinics will keep attracting distinct patient groups. A regression analysis could quantify programme effects while controlling for confounders, but even that requires human judgment about variables to include. 

  The user's deeper need seems to be about fairness and effective resource allocation. They might also be seeking validation that this isn't just a numbers game—context matters. Their colleague's hope for a purely statistical fix is understandable but oversimplifies the problem. 

  Recommendation: For self-selection, keep both programmes but refine patient guidance to improve choices. For central assignment, adopt both but assign based on patient type. In both cases, don't standardise to one programme. And yes, commission that further study—specifically a controlled trial that accounts for patient demographics.
answer: |-
  Based on your description, this is a classic case of **Simpson's Paradox**, where a trend appears in several groups of data but disappears or reverses when the groups are combined. Your decision depends critically on operational factors beyond the raw numbers. Here's my analysis and recommendation, using British English terms:

  ### 1. Which programme should you adopt?
  #### a) **If patients continue to self-select programmes:**
     - **Adopt Programme B.**  
     Reasoning: The clinic-by-clinic breakdown shows Programme B outperformed A in 5/6 clinics *under real-world conditions where patients self-select*. The pooled figure is distorted by the uneven distribution of patient types across clinics. Programme A's apparent "overall success" is an artefact of it being disproportionately chosen by younger, acute-injury patients at sports clinics (who recover well regardless). Adopting Programme A across all clinics would likely *reduce* recovery rates, as it would force it onto older/chronic patients at general clinics – where it performed worse than B.  

  #### b) **If you centrally assign patients at intake:**
     - **Adopt *both* programmes, but assign based on patient type.**  
     Reasoning: The data suggests Programme A is more effective for younger patients with acute injuries, while Programme B is better for older patients with chronic conditions. Centrally assign:
       - **Programme A** to patients matching the profile of your sports clinics (younger, acute injuries).
       - **Programme B** to patients matching the profile of your general clinics (older, chronic conditions).  
     *Adopting a single programme universally would be suboptimal*, as each excels with different cohorts. The pooled figure is irrelevant here, as it doesn't reflect causal efficacy.

  ### 2. Is there a purely statistical rule to resolve this?
  **No, there is not.** Your colleague is incorrect that a single statistical quantity can definitively settle whether to trust the pooled or stratified data. Here's why:

  - **Statistics can flag confounding but not resolve the decision**:  
    Tests like the **Cochran-Mantel-Haenszel** (CMH) statistic or **logistic regression** can quantify if clinic type/patient demographics are confounding variables (spoiler: they clearly are). However, they cannot tell you *which metric* (pooled vs. stratified) is "honest" for your decision. That depends on your operational context.
    
  - **The choice depends on real-world causality and implementation**:  
    - The pooled figure answers: *"What was the average recovery rate for each programme under historical self-selection?"*  
    - The stratified figure answers: *"Which programme performed better within specific clinic environments?"*  
    Neither is inherently "dishonest," but they serve different purposes. The right choice hinges on:
      - Whether patient demographics will remain coupled to clinics (likely, if self-selection continues).
      - Whether you are evaluating programme *efficacy* (causal effect) or *effectiveness* (real-world outcome under choice).
      - Your ability to target programmes to patient subgroups.

  ### Recommendation & Rationale
  **Short-term action:**  
  - **Continue offering both programmes** for now, but **adopt Programme B as the default in general clinics** and **Programme A in sports clinics** (matching current successful self-selection patterns).  
  - **Do not standardise to one programme network-wide** – this would harm outcomes given the subgroup differences.

  **Long-term steps:**  
  - **Commission a further study** with *randomised assignment* of patients to programmes, **stratified by age/injury chronicity**. This isolates true programme efficacy, controlling for confounders.  
  - Collect detailed demographic/clinical data to enable **risk-adjustment** in future analyses.  
  - Consider **predictive modelling** to guide patient-programme matching at intake.

  **Why this approach?**  
  The data reveals that *patient factors* (age, injury type) are the true drivers of recovery, interacting with programme suitability. The pooled figure is misleading for decision-making because it conflates programme performance with patient allocation bias. Trusting it would lead to adopting Programme A for all – which would likely *lower* overall recovery rates when applied to chronic patients. The clinic-level comparison, while imperfect, better reflects how programmes perform in their respective contexts. Ultimately, the "right" choice isn't in the spreadsheet – it depends on your network's patient mix and operational strategy.
