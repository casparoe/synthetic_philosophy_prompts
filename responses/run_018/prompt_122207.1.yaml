answer: |-
  ### Sestina: The Forecast  
  *Four years into a two-year project, a researcher deliberates.*

  **I**  
  The inside view spins a causal chain: my **plan**  
  was sound—this project fits its reference **class**.  
  I knew the stats: two years, on **average**,  
  but trusted intuition, claimed it **mine**,  
  believed the odds bent toward **exception**,  
  sure I had no cause to **defer**.  

  **II**  
  Yet choosing when to **defer** demands a **plan**  
  to sort the **class**—but *which*? Is this **exception**  
  a fact, or just a place to hide? The **class**  
  I pick could shield the blame that’s **mine**,  
  masking fear behind the **average**...  

  **III**  
  *Don’t adjust the **average**!* Advice says: **defer**  
  to base rates, never tweak for what’s uniquely **mine**.  
  Ignore the siren details; hold the **plan**  
  to pure comparison. Each **class**  
  must drown its quirks—no **exception**  
  permits escape. Just trust the **average**.  

  **IV**  
  But **exception** lurks—a regress starts. To trust that **average**,  
  I need my *own* track record. What’s my **class**  
  for judging when to **defer**? If past **plan**s  
  overshot, should I adjust? The doubt is **mine**—  
  this meta-forecast, cold and **average**,  
  feels frail. Where’s the proof? What’s left to **defer**?  

  **V**  
  What’s left when there’s no **class**? If this task is **mine**  
  alone—no cohort, precedent, **exception**—  
  then base rates vanish. Can’t **defer**  
  to phantom numbers. **Average**  
  dissolves; the voided **plan**  
  just echoes: *Find your **class**!*  

  **VI**  
  No tidy **class**; the burden’s **mine**.  
  To quit? Press on? I can’t **defer**—  
  this feels like the **exception**  
  outside all norms, beyond **average**.  
  The outside view says *halt the **plan**!*  
  Inside, the dream still calls. Which **class**?  

  **Tornada**  
  The choice of **class** can’t **defer** to **average** or **plan**,  
  nor hide in **mine** of data, nor plead **exception**:  
  this act—selecting **class**—has no reference **class**.  

  ---

  **Notes for the reading group:**  
  - **Stanza I** explores the *causal story* compelling the inside view—vivid specifics ("spins a causal chain") justify ignoring base rates.  
  - **Stanza II** addresses how *choosing a reference class is a judgment*, potentially hiding avoidance in false modesty ("masking fear behind the average").  
  - **Stanza III** embodies the *standing advice against adjusting base rates* for case-specifics ("Ignore the siren details").  
  - **Stanza IV** confronts the *regress*: to defer wisely, you need an inside view of your own reliability ("this meta-forecast").  
  - **Stanza V** grapples with *no decent reference class*, voiding the outside view ("base rates vanish").  
  - **Stanza VI** holds the *tension open*—no resolution, only the dilemma’s weight.  
  - **Tornada** lands on the core paradox: the choice of reference class defies delegation to statistics.  

  Each end-word shifts roles:  
  - **plan** moves from blueprint (I) to flawed artifact (II), framework (III), meta-strategy (IV), hollow relic (V), and contested vision (VI).  
  - **class** evolves from category (I) to shield (II), constraint (III), uncertainty (IV), absence (V), and burden (VI).  
  - **average** shifts from statistic (I) to crutch (II), commandment (III), gauge (IV), phantom (V), and verdict (VI).  
  - **mine** transforms from possession (I) to responsibility (II), uniqueness (III), doubt (IV), isolation (V), and agency (VI).  
  - **exception** pivots from hope (I) to illusion (II), taboo (III), identity (IV), chasm (V), and desperation (VI).  
  - **defer** oscillates between rejection (I), obligation (II), surrender (III), recursion (IV), impossibility (V), and impasse (VI).  

  The tension remains unresolved, honoring the literature’s caution against overcorrecting either way.
