answer: |-
  *adjusts spectacles, fingers tapping rhythmically on the desk*  
  Your challenge is precisely the kind of friction that proves the necessity of formalism. You propose discarding rhyme and stress – tools utterly absent in your target language – and replacing them with a strict morphemic count. Excellent. We aren't abandoning constraint; we're *transposing* it. Marot’s original is a dance: 28 lines, each 3 syllables, ABAB rhyme, a playful, intimate address. The *constraint is the carrier wave*.

  The seven-morpheme rule isn’t arbitrary mimicry; it becomes the *structural heartbeat*. Just as Marot’s tight syllabic count creates urgency and tenderness, this morphemic rigor must impose a parallel discipline. Each line becomes a deliberate, self-contained unit – a formal echo of his concise affection. The *economy* mirrors his. If I render "Ma Mignonne" as seven precise units per line, I’m not just counting; I’m forcing the language to perform a similar act of compression and focus. The constraint *is* the meaning-shaping force.

  Now, your question: when does it cease to be Marot? When the *formal structure fails to enact the original’s semantic gesture*. Consider:

  1.  **Loss of Tone:** If the morphemic constraint forces archaic or pompous diction, destroying the gentle, intimate *tutoiement*. Marot’s warmth replaced by clinical detachment? Failure. The form must *enable* the register.
  2.  **Distortion of Core Semantics:** If hitting "seven" requires adding concepts alien to the poem ("O beloved small-one-PAST-CONJUNCTIVE health-DIRECTIONAL regain-IMP!"), or omitting essential ones ("Get well soon" reduced to "Recover fast" because "my dear" costs two morphemes we can't spare). The form must *serve* the content, not mutilate it.
  3.  **Collapse of Cohesion:** If the lines feel like seven random pebbles in a row, not a flowing address. Marot's poem *moves* – from greeting, to concern, to command, to blessing. The morphemic lines must still propel that arc. If the constraint shatters the logical/emotional progression? Failure. The form must *bind* the meaning.
  4.  **Absence of Play:** Marot’s constraint is light, almost teasing. If the seven-morpheme version feels labored, heavy, mechanically enforced rather than a graceful game, the *spirit* is dead. The form must *embody* the lightness.

  **The failure condition isn't different constraints; it's constraints that murder the poem’s soul while wearing its skeleton.** If, despite the seven-morphemes, I can make your conlang speaker feel the affectionate urgency, the gentle command to recover, the implied smile in "Portez moymes une beigne" – if the formal straitjacket *produces* a congruent emotional and semantic experience – then it *is* Marot, resonating through a new medium. If it becomes a sterile exercise in counting, a telegram stripped of heart? Then yes, you have a new poem – a *failed* translation. The constraint isn't the ornament; it's the loom on which the meaning is woven. Change the loom, but the pattern must emerge recognizably, or you have mere thread, not tapestry.
