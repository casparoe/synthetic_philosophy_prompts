prompt: |-
  I'm a software engineer with zero formal philosphy background but I got nerd-sniped by intuitionistic logic. So there's this Dutch mathematician Brouwer who said math isn't discovered in some platonic realm, it's literally constructed in the mind. He also came up with these weird choice sequences where an infinite sequence is only real if a human freely chooses each step one by one.

  Here's my weird question: imagine Brouwer is alive today and sees modern LLMs generating constructive proofs in Lean or spitting out infinite streams of digits token-by-token. Would he say that's legitimate math? Or would he reject it because there's no actual human intuition driving each step—just a model predicting probabilities?

  Specifically, do you think he would argue that an AI generating a choice sequence violates his idea that the sequence must come from free human will? I want your best guess at his view.

  Lead with a one-sentence bottom line: yes, he accepts AI math, or no, he doesn't, and why. Then max two more paragraphs, keep it under 300 words total. Don't cite papers or books, I won't understand them and can't check. Ignore my typo in philosphy please.
