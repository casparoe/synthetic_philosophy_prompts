  Inject a constructed framing that is not standard textbook fare: organize the session around a two-role simulation called the Blind Architect and Critical Evaluator split. The Architects, in rotating teams of three to four, must construct or sequence solutions to a multi-constraint design challenge—such as stabilizing a simulated resource network or optimizing an opaque scoring function—using only fixed local mechanistic rules printed on cards they cannot modify and a hidden constraint deck they draw blindly. They never see the global success criterion. The Evaluators, comprising the remaining students and rotating each round, possess the global criterion on a sealed reference sheet and assign non-monetary points—token chips representing selection pressure—to each Architect team’s output, but they are strictly forbidden from revealing the criterion, altering the rules, or coaching. Over three 12-minute rounds with 3-minute scoring interludes, teams accumulate selection tokens. The rules must be arranged so that high-scoring outputs emerge solely from iterative local adjustments and evaluator feedback, yet by the end no Architect team can articulate why their final design succeeds globally, and no Evaluator can derive the local rule-set from the successful outputs.

