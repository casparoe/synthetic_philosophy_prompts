  hey, i'm just a regular person who's been thinking about hofstadter's idea that your I can be spread across other brains - like your pattern keeps running in people who knew you after you die, not just as memories but as actual cognitive loops. lately i've been wondering if we should take this literally as a distributed computation, not just a metaphor. can you act like a professional philosopher who actually reads this stuff and think carefully with me? start with some brainstorming: what are the main open questions or lines of work in this area? specifically, i want you to rank them by what actually deserves effort - like if someone had three years and cared about identity, grief, or even AI rights, where should they go? defend the ordering with real criteria like tractability or how many other questions depend on it, and flag which ones are overrated dead ends. also definatly tell me what argument or evidence would change your mind about the ranking, and point out where your reasoning is most likely to fail. please don't give me a bibliography, just work through it with me.
