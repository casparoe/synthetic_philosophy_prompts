  The core issue here is about how we attribute mental states to AI systems. The policy's exclusivity rule suggests a strict dichotomy between physical mechanisms and intentional states. This reminds me of philosophical debates around the intentional stance - particularly Daniel Dennett's view that treating systems as having beliefs/goals is just a useful pragmatic strategy, not an ontological claim about their "real" existence.

