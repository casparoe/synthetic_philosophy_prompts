  When examining internal coherence, there's tension with actual interpretability research practices. Researchers constantly move between registers - like noting how attention patterns "encode" certain associations that manifest as "beliefs." The policy forbids this translation work that's central to understanding how LLMs actually work. This creates a contradiction since the mechanistic findings only become meaningful for risk assessment when translated into functional terms.

  Regarding underdetermination, I believe the same documentation norms could theoretically be justified under different philosophical frameworks. A verificationist might want separation to avoid unverifiable claims, while a radical eliminativist would see intentional descriptions as literally false. But the current justification ("category confusion corrupting risk assessment") seems specifically tied to a particular ontological view.

  If this exclusivity assumption were abandoned, documentation would likely change to allow carefully framed translations between registers, with clear epistemic status markers. We might see explicit bridge principles, probabilistic mappings, or tiered reporting that maintains distinction while permitting integration where methodologically warranted.

