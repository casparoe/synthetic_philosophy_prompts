  Below is an eight-question quiz designed to probe intuitions about quantum immortality scenarios without explicit philosophical labels. Each question presents a concrete branching scenario with three answer options framed as personal expectations. The scoring key maps answer patterns to five distinct positions, notes ambiguous cases, and identifies inseparable position pairs.

  ---

  ### **Quantum Immortality: Which Camp Are You In?**
  *Answer based on your intuitive expectations of what you'd experience.*

  1. **Symmetric Quantum Russian Roulette**  
     You point a quantum gun at your head with a 50% chance of firing (via a symmetric beam splitter). You pull the trigger. What do you expect?  
     A. You’ll definitely experience surviving—there’s always a branch where you live.  
     B. You might experience dying or might experience surviving—it’s 50/50.  
     C. You’ll simultaneously experience both dying and surviving.  

  2. **Planetary Duplication Booth**  
     You step into a booth that creates two identical copies: one on Earth and one on Mars. What do you expect upon activation?  
     A. You’ll experience being on both planets at once.  
     B. You’ll experience being on one planet (you won’t know which), and you’ll *be* that copy.  
     C. The original you is gone—two new people are created, but you won’t experience either.  

  3. **Low-Probability Trigger**  
     The quantum gun has a 0.01% chance of firing (99.99% not firing). You pull the trigger. What do you expect?  
     A. You’ll definitely experience surviving—even tiny amplitudes guarantee a live branch.  
     B. You expect to survive because high-amplitude branches dominate your experience.  
     C. You have a 0.01% chance of dying—you’ll likely survive, but it’s just probability.  

  4. **Branching While Asleep**  
     You’re put to sleep. A quantum event branches you into two versions: one waking in a red room (50% amplitude), one in a blue room (50%). After waking, how many versions of "you" exist?  
     A. Two versions (one in each room)—both are equally real.  
     B. One version (the one you are)—the other is irrelevant.  
     C. Zero—the original you is gone; new people exist, but "you" don’t experience anything.  

  5. **Repeated Quantum Suicide**  
     You play quantum Russian roulette (50% survival chance) once a day for 30 days. What do you expect after a month?  
     A. You’ll definitely experience surviving all 30 trials—there’s always a branch where you win.  
     B. You expect to die in one trial—surviving all is vanishingly unlikely.  
     C. You’ll experience surviving until the trial that kills you, then nothing.  

  6. **Amplitude-Weighted Branching**  
     In a branching event, one branch has 70% amplitude (you win $100), the other 30% (you win nothing). What’s your *subjective probability* of winning $100?  
     A. 70%—amplitudes define your likelihood of experiencing a branch.  
     B. 50%—all branches feel equally likely to "be you," regardless of amplitude.  
     C. 0%—you won’t experience any branch; the original you is gone.  

  7. **High-Stakes Gambling**  
     Game A: 99.99% amplitude for $1M, 0.01% for death. Game B: 50/50 for $100 or $200 (amplitudes = probabilities). Which do you play?  
     A. Game A—you’ll definitely survive and win $1M in your branch.  
     B. Game A—death’s amplitude is negligible, so it’s practically safe.  
     C. Game B—avoiding any death risk matters more than the reward.  

  8. **Divergent Futures**  
     A branching event creates two paths: in one, you become a famous artist; in the other, a renowned scientist (equal amplitudes). What do you experience?  
     A. Both careers simultaneously—you’re aware of being artist and scientist.  
     B. One career or the other—it’s random which one "you" end up in.  
     C. One career—the other is experienced by a copy who isn’t "you."  

  ---

  ### **Scoring Key**
  Tally your answers, then map them to one of five positions using the rules below. Positions:  
  (1) **Full Everettian Immortality**  
  (2) **Amplitude-Sensitive Immortality**  
  (3) **Collapse/Born-Rule Only**  
  (4) **Deflationary Identity**  
  (5) **Mind-Continuity Singularity**  

