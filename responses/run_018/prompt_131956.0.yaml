  Below is a self-contained branching taxonomy designed for non-specialists. The tree has seven nodes (root, two internal branches, four leaves) and addresses concrete judgments about the housemate scenario. Branch questions avoid academic jargon; leaf positions include diagnoses and awkward commitments. The taxonomy cannot separate **strict liberal rights** from **pure Pareto improvement** when both converge on the same outcome (as in this scenario), but they diverge in other cases (e.g., where veto prevents a Pareto gain).  

  ### Root: The Housemate Scenario  
  Three housemates share a workspace. Background music causes one genuine distress; turning it off improves the other two’s concentration at no cost. The distressed person demands veto power, claiming the sound environment is their "personal expressive domain." Should they have veto?  

  ---

  ### Branch 1: Is veto power over shared workspace sound legitimate only if it qualifies as an "intimate domain" (e.g., like your body or private diary)?  
  - **Yes → Proceed to Branch 2A**  
  - **No → Proceed to Branch 2B**  

  ---

  ### Branch 2A: If veto is limited to intimate domains, can we objectively compare whether someone is "better off" without smuggling in hidden value judgments?  
  - **Yes → Leaf 1: Restricted Liberal View**  
    - *Awkward commitment*: Must defend that society can override your control over your private journal if it slightly benefits others at no cost to you.  
    - *Diagnosis*: Unstable due to vague boundaries between "intimate" and "shared" domains.  
  - **No → Leaf 2: Pure Pareto Improvement Always Prevails**  
    - *Awkward commitment*: Must allow one person’s trivial annoyance to block vast benefits for others if they are the sole objector.  
    - *Diagnosis*: Incoherent if "no cost" can’t be verified without interpersonal comparisons.  

  ### Branch 2B: If veto can apply beyond intimate domains, is it possible to have consistent group preferences when choices affect others?  
  - **Yes → Leaf 3: Strict Liberal Rights Always Prevail**  
    - *Awkward commitment*: Must defend permanent deadlock over background music even when universal relief is available.  
    - *Diagnosis*: Unstable when rights conflict with Pareto gains.  
  - **No → Leaf 4: Skeptical View (Collective Preferences Are Socially Constructed)**  
    - *Awkward commitment*: Must deny the "distress" is real or relevant, reframing it as a power struggle masked as preference.  
    - *Diagnosis*: Unexplored in formal choice theory but rising in critical social sciences.  

  ---

  ### Taxonomy Map  
  ```  
  Root (Scenario)  
  │  
  ├─ Branch 1: Veto only for intimate domains?  
  │   │  
  │   ├─ Yes → Branch 2A: Can "better off" be compared objectively?  
  │   │   │  
  │   │   ├─ Yes → Leaf 1: Restricted Liberal View  
  │   │   └─ No → Leaf 2: Pure Pareto Improvement  
  │   │  
  │   └─ No → Branch 2B: Are consistent group preferences possible?  
  │       │  
  │       ├─ Yes → Leaf 3: Strict Liberal Rights  
  │       └─ No → Leaf 4: Skeptical View  
  ```  

  ### Key Notes  
  - **Unseparated Pair**: In this scenario, **Leaf 2 (Pure Pareto)** and **Leaf 3 (Strict Liberal)** both endorse turning off the music (since it’s a Pareto gain and the veto achieves it). They diverge if veto *blocks* a Pareto improvement (e.g., if music benefits two but veto overrides them).  
  - **Unexplored Combinations**: The path rejecting intimate-domain veto (*Branch 1 → No*) but accepting interpersonal comparisons (*Branch 2A → Yes*) is omitted; it would duplicate *Leaf 2* and is redundant here.  
  - **Self-Contained**: No citations, names, or jargon—branch questions rely on everyday reasoning.
