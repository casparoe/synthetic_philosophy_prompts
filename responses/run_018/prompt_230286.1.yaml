answer: |-
  The post-reunification convictions of East German border guards reveal a complex interplay between law and morality, and their compatibility with legal positivism depends on how one interprets the courts' reasoning. Here's a breakdown:

  1.  **The Courts' Explicit Reasoning (Radbruch Formula):**
      *   The appellate courts invoked a version of the **Radbruch Formula**, named after German legal philosopher Gustav Radbruch.
      *   This formula argues that when a state's positive law (written directives) conflicts with fundamental principles of justice to an "intolerable" or "extreme" degree, that positive law is not merely immoral but **ceases to be valid law** ("gesetzliches Unrecht" - legal injustice).
      *   **Presupposition:** This reasoning **strictly presupposes a natural-law thesis.** It asserts that extreme injustice negates the legal character of a norm, regardless of its formal enactment and validity within the state's own system at the time. Morality (fundamental justice) is a necessary condition for something to be considered "law" in the first place.

  2.  **Conviction Result Compatible with Legal Positivism?**
      *   **Yes, a positivist *can* accept the *result* (conviction of the guards) without abandoning core positivist tenets.** However, they must reject the *specific natural-law reasoning* used by the courts and offer an alternative explanation:
      *   **Positivist Explanation:**
          *   **The "Law" Applied Was West German (FRG) Law:** The prosecution occurred *after* reunification under the legal system of the Federal Republic of Germany (FRG). The FRG's legal system *never* recognized the GDR's shoot-to-kill orders as valid law *from the perspective of the FRG system*. The FRG constitution (Basic Law) enshrined human dignity and the right to life as inviolable core principles.
          *   **Applying Contemporary FRG Law Retrospectively (with caveats):** The positivist argues that the guards were convicted under FRG criminal law (e.g., homicide statutes) applicable *at the time of trial*. Applying laws retrospectively is generally problematic, but exceptions exist for acts universally recognized as criminal (like murder) even if a prior regime purported to legalize them. The GDR directives were seen as a grotesque perversion, not legitimate legal authorization.
          *   **Denying the Defense of "Superior Orders":** The positivist focuses on the *defense* raised by the guards (acting under orders/law). They argue that the FRG legal system, applying its *own* rules, determines that the GDR directives were so fundamentally unjust that they cannot provide a valid legal justification or excuse for homicide *within the FRG legal framework*. The FRG system rejects the validity of the GDR norm *for its own purposes*.
          *   **Basis of Prosecution:** The basis is the FRG's legal authority post-reunification to adjudicate crimes committed on its territory (now including former East Germany) according to its own legal principles and statutes, which condemn murder regardless of prior defective "legalization" by an unjust regime. The moral repugnance informs the FRG's *choice* to prosecute and its *interpretation* of its own law, but the validity of FRG law itself is separate from that morality.

  3.  **Distinguishing Strict Presupposition from Compatibility:**
      *   **Strictly Presupposed:** The courts' *specific reasoning* ("intolerably unjust directives never had the status of law") **strictly presupposes a natural-law thesis.** It directly asserts that extreme injustice negates legal validity *inherently*.
      *   **Compatible With:** The *result* (conviction) and the *broader idea* that legal systems can reject the authority of prior unjust regimes' norms **is compatible with legal positivism**, provided the positivist explains it through the lens of the *new* legal system's authority, its rules about retroactivity, and its rejection of the prior "law" as a valid defense *within its own framework*, rather than denying the prior norm's legal validity *within the GDR system at the time*.

  4.  **Leaving the Dispute Unresolved:**
      *   **Yes, it's possible to describe the courts' reasoning in a way that leaves the positivist/natural-law dispute unresolved.** This involves focusing on the *practical legal outcome* rather than the *theoretical justification*:
          *   **Description:** "The courts held that the GDR shoot-to-kill orders were so egregiously violative of fundamental human rights and justice that they could not provide a legal defense to a charge of homicide under the law of the reunified Germany. The orders were deemed illegitimate and incapable of justifying the taking of human life."
      *   **Why Unresolved:** This description:
          *   States the *consequence* (no legal defense) without explicitly stating *why* (invalid law vs. invalid defense within a new system).
          *   Acknowledges the moral basis ("egregiously violative," "fundamental human rights and justice") without committing to whether this morality *invalidates* the prior law or simply informs the *new* system's rejection of it.
          *   Focuses on the operational outcome within the *current* (FRG) legal system without definitively characterizing the ontological status of the GDR directive *within the GDR system in the past*.
      *   Both a natural lawyer (seeing the directive as never truly law) and a positivist (seeing the FRG refusing to recognize it as a valid defense) could accept this descriptive outcome. The underlying philosophical disagreement about the nature of law remains.

  **Conclusion:**

  *   The **courts' explicit reasoning** ("intolerably unjust directives never had the status of law") **strictly presupposes a natural-law thesis.**
  *   The **practical result** (convicting the guards) **is compatible with legal positivism**, but *only if* the positivist explains it through the application of the *new* legal system's (FRG) laws and its rejection of the GDR orders as a valid defense within that system, rather than denying the orders' *past* legal validity within the GDR system.
  *   The **dispute can be left unresolved** by describing the outcome pragmatically – the GDR orders were deemed illegitimate and provided no defense under reunified German law – without specifying the precise philosophical reason *why* they had no legal effect *in that context*. The core debate about whether extreme injustice negates legal validity *as such* persists beneath the surface of this description.
