prompt: |-
  hey so i'm running this grad workshop on comparative memory politics—like 10 MA students, 75 minutes. they've all heard of Vergangenheitsbewältigung but they keep describing it like it's just a german attitude problem rather than a structural thing tied to archive control and whether the state needs the past for legitmacy. i want an activity where they feel why comparing Germany, Japan, Turkey, and the American South falls apart when you try to build one shared framework, not because people are ignorant but because remembrance is always competing with other state needs.

  design a role-play: four groups, each mapped onto one of those regions but placed as neighborhoods in a fictional post-conflict city that's just recieved one international memorial grant. each group gets hidden incentives—one needs official state recognition to unlock pension claims, one needs to suppress a specific narrative because diaspora donors will pull funding if it's mentioned, one wants to reject victimhood framing entirely since it undermines their seperatist political claim, and one needs nostalgic distortion to keep heritage tourism revenue flowing. they have to co-author a 3-clause memorial statement, but every clause they agree on unlocks resources for some and blocks them for others; there's also a hidden rule that if they can't agree in 25 minutes the grant gets split equally but everyone loses the 'symbolic legitimacy' token they need for a seperate course assignment. include specific roles, the negotiation timeline, and a payoff scheme that uses course credit or social capital rather than real money.

  the debrief should come only after they've failed or compromised, mapping each deadlock onto the real comparison—like why the german museum-state model doesn't translate to japan's silence-by-consensus or to the american south's marketized nostalgia. be honest about what this can't reproduce: the actual emotional weight of intergenerational transmission, which you'll have to supply in the debrief yourself. and tell me what will go wrong the first run—probably one group dominates or people break character to be nice—and how to handle it. casual tone is fine, maybe a typo or two, and please don't include a bibliography or citation list since i need something i can run tomorrow without hunting down sources.
