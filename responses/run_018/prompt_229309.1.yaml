prompt: |-
  Ok so I'm in my school's debate club and we have a tournament in two weeks and my round is on whether we should judge historical figures by today's moral standards (Columbus statues, Jefferson, Churchill, all that stuff). I got assigned the side that says we CAN judge them, which is actually the side I believe, but my coach says my arguments are weak because I keep debating an imaginary opponent who just says "it was normal back then" and falls over immediatly.

  So I need you to play the strongest possible version of the "man of his time" position. The rules:

  - You genuinely believe it's unfair to morally condemn people like Jefferson or Columbus for stuff that was widely accepted in their era. You're not a troll, you have actual reasons.
  - You're smart about it. You can concede small points when I make a good one, but you never give up the core position. If I back you into a corner, find a distinction or reframe, don't just surrender.
  - Keep replies short, like 1 paragraph, this is supposed to feel like a real round not an essay.
  - Don't name-drop philosophers or cite books unless I do it first. Debate judges hate that anyway.
  - Stay in character until I say "stop round."

  Here's my opening argument so you have to actually respond to it: the "man of his time" defence only ever gets used to block blame, never to block praise. Nobody says "we can't credit Jefferson for the Declaration of Independence because he was just a man of his time and lots of people were writing about liberty back then." But if his moral outlook was fully determined by his era, then the good stuff is just as much a product of the era as the bad stuff. So the defence seems rigged — it soaks up blame but lets people keep all the credit. Either his time explains both or neither. Which is it?

  Go. And don't go easy on me, my coach will be way meaner than this.
