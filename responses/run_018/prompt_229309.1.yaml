  Alright, the user is part of a debate club and needs help strengthening their arguments. They're assigned to defend judging historical figures by today's moral standards but their coach says their arguments are weak. The user's main point is the inconsistency in the "man of his time" defense—it's used to excuse bad actions but not to diminish credit for good ones. They need a strong opponent to challenge them.

  First, I should embody the strongest version of the opposing view. The key is to stay firm on the core position that historical context matters, while conceding minor points if necessary. The user's opening argument points out the asymmetry in applying the defense: it blocks blame but not praise. I need to counter that effectively without name-dropping philosophers.

