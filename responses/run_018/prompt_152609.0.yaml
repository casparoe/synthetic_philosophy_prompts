    "scene_reading": "Craig's initial portal entry shows Malkovich's first-order states (vision, sound) hijacked by Craig's HOTs, which rebind ownership to Craig. Piloting scenes reveal Craig generating HOTs that anchor Malkovich's body to Craig's self-model, yet Malkovich's residual HOTs cause disruptive co-presence. Craig's expulsion into Emily's body depicts consciousness migrating without bodily control, reducing him to a passive observer bound to her sensory inputs.",
    "anchored_hot_illumination": "Clarifies why Malkovich is unaware during intrusion: his HOTs don't bind the states, so they're non-conscious for him. Explains Craig's control during piloting as HOTs successfully rebinding Malkovich's states to Craig's self-frame.",
    "film_resistance_points": "Malkovich's co-awareness during piloting challenges HOT unity, implying fragmented ownership. Craig's mind surviving expulsion without a body or agency defies the theory's requirement for a stable 'here now' anchor. The portal commodifies consciousness, exposing anchored HOT's inability to model stolen/leased ownership.",
    "tension_unresolved": true,
    "seminar_bottom_line": "The film weaponizes anchored HOT to expose consciousness as a fragile, transferable property—not a stable 'self'—but resists the theory by showing ownership-binding can be layered, contested, or detached from embodiment. Use it to debate: must a 'self' be anchored, or is consciousness inherently migratory?"
  }
  ```

  **Seminar Notes**:  
  - **Push Further**: The unresolved tension (migration vs. anchoring) is fertile ground. Ask students: *If Craig’s HOTs persist in Emily, is he still "conscious" without control? Does anchored HOT need a "body" parameter?*  
  - **Avoid Rescue**: Don’t let students "fix" the theory to fit the film. Spotlight where the film *breaks* HOT—e.g., Malkovich’s dual awareness during the mirror scene.  
  - **Bottom Line**: *Being John Malkovich* uses surrealism to attack the "stable self" implied by HOT. Consciousness here is parasitic, destabilizing ownership as a core condition.
