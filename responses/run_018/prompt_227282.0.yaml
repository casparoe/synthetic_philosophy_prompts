prompt: |-
  I am not asking you to adjudicate algorithmic fairness; I want the specification first. Suppose we need a formal criterion of fairness for statistical risk scores — the sort used in pretrial detention, lending, or medical triage — good enough to serve as the standard a regulator could audit against. Write the desiderata list such a criterion must satisfy: for each requirement, give the intuition or case that motivates it (for instance, the public dispute over recidivism scores in which one side documented unequal false-positive rates across racial groups and the other replied that the scores were equally well calibrated), say whether the requirement is genuinely binding or merely the dogma of one camp, and identify which requirement does the most to exclude candidates. Two complications must shape the list. First, the established impossibility results: absent perfect prediction or equal base rates across groups, no score can be simultaneously calibrated within each group and equal in both false-positive and false-negative rates across groups. The list therefore cannot simply conjoin the natural desiderata; state which must be sacrificed and by what principle, and whether the impossibility shows that some demands were never genuine requirements of fairness or instead that every deployable criterion chooses whom to wrong. Second, assess two requirements often smuggled in without argument: that fairness is a property of the score itself rather than of the process that produced it, and that an adequate criterion must be invariant under relabeling the outcome, so that its verdict does not depend on which class is coded as positive. Keep any scoring of existing contenders — calibration, equalized odds, demographic parity — brief and subordinate to the criteria themselves. Close by stating how confident you are in the framework as a whole and singling out the single point you are least sure of.
reasoning: |-
  We are constructing a list of desiderata for a formal fairness criterion for statistical risk scores, with the understanding that we must navigate established impossibility results. The criterion must be auditable by a regulator. We consider the motivations for each requirement, whether it is binding or merely dogmatic, and which requirement does the most to exclude candidate criteria. We also address two complications: the impossibility results (which force a sacrifice of some desiderata) and two often-unargued requirements (whether fairness is a property of the score vs. the process, and invariance under relabeling the outcome).

  Desiderata List:

  1. **Calibration within Groups (or Group-Conditional Calibration)**
     - **Intuition/Case**: In the recidivism score debate (e.g., COMPAS), one side showed that the scores were well-calibrated: for any given risk score, the proportion of individuals who reoffend was similar across racial groups. This was argued as evidence that the score was fair because it reflected the same risk regardless of group.
     - **Binding or Dogma?**: This is a binding requirement for many because it ensures that the score has the same meaning across groups. Without it, a score of 7 might mean a 70% chance of recidivism for one group and 50% for another, which would be misleading and potentially unfair.
     - **Role in Exclusion**: This requirement is central and must be considered, but we know from impossibility results that it cannot be simultaneously satisfied with error rate equality (FPR and FNR equality) unless base rates are equal or prediction is perfect.

  2. **Equal False Positive Rates (FPR) across Groups**
     - **Intuition/Case**: In the same recidivism debate, the other side documented that Black defendants were more likely to be falsely labeled as high-risk (higher FPR) than white defendants. This was seen as a form of disparate impact because it meant that one group was bearing a higher burden of false alarms.
     - **Binding or Dogma?**: This is a genuine requirement for fairness from the perspective of anti-classification or avoiding disparate impact. However, it is not universally accepted as the only measure of fairness. The impossibility result shows we cannot have both calibration and equal FPR (along with equal FNR) when base rates differ.

  3. **Equal False Negative Rates (FNR) across Groups**
     - **Intuition/Case**: In medical triage, if a high-risk score leads to treatment, then a false negative (failing to flag a high-risk patient) might lead to death. If one group has a higher FNR, then that group is disproportionately suffering from missed diagnoses. Similarly, in pretrial detention, a false negative might mean releasing a defendant who then commits a crime.
     - **Binding or Dogma?**: This is the complement to FPR and is also a strong fairness requirement, especially in contexts where the cost of missing a positive case is high. Again, the impossibility result shows we cannot have both calibration and equal FNR along with equal FPR.

  4. **Demographic Parity (or Equal Selection Rates)**
     - **Intuition/Case**: In lending, if a protected group is approved for loans at a lower rate than others, it might indicate discrimination. This requirement says that the proportion of positive predictions (e.g., "high risk" in pretrial, "approve loan" in lending) should be the same across groups.
     - **Binding or Dogma?**: This is often required by laws that aim to prevent disparate impact. However, it is not always appropriate. For instance, if the base rates of the outcome (e.g., loan repayment) differ across groups, then demographic parity would require either under-predicting for the group with a higher base rate or over-predicting for the group with a lower base rate. This can lead to inefficiency and even harm. Thus, it is sometimes seen as dogmatic and not universally binding.

  5. **Error Rate Balance (combining FPR and FNR)**
     - **Note**: Equalized Odds (which requires both FPR and FNR to be equal across groups) is a stronger condition than just one of them. We can consider it as a candidate requirement.
     - **Intuition/Case**: In the COMPAS case, equalized odds would have required that the tool be equally accurate for both groups in terms of both false alarms and misses. This is motivated by the idea that the classifier should not be more prone to one type of error for a particular group.
     - **Binding or Dogma?**: It is a compelling requirement but, as the impossibility theorem shows, it conflicts with calibration when base rates differ. Thus, it cannot be required simultaneously with calibration.

  6. **Fairness as a Property of the Score (not the process)**
     - **Intuition/Case**: Regulators need to audit the scores that are actually used. If fairness is defined by the process (e.g., the algorithm was trained without using protected attributes), then a score might still exhibit bias due to correlated features. However, if we focus on the score, we can measure its outcomes and see if they meet the fairness criteria regardless of the process.
     - **Binding or Dogma?**: This requirement is binding for an auditor because the process may be opaque (e.g., proprietary algorithms). The regulator can only observe the input (features) and output (scores) and must judge fairness based on that. However, note that if the score does not use protected attributes, it might still be possible to infer group membership and adjust the score accordingly (e.g., through post-processing). But the requirement that fairness is a property of the score (i.e., the mapping from features to the score) is a practical necessity for auditing.

  7. **Invariance under Relabeling the Outcome**
     - **Intuition/Case**: Suppose we switch the labels: in pretrial, we could define the positive outcome as "no recidivism" (so that a high risk score would indicate low recidivism). A fairness criterion should not change its verdict just because we switched the labels. For example, if we require low FPR for a particular group when the positive event is recidivism, then after switching, the same group would now have a high FPR for the event of no recidivism? This might lead to inconsistencies.
     - **Binding or Dogma?**: This requirement is often not explicitly stated but is important for consistency. For instance, if we use demographic parity, then switching the label would change the positive prediction rate, but the requirement of equal positive rates would still hold. However, for error rates, switching the label swaps FPR and FNR. Thus, a criterion that requires equal FPR but not equal FNR would not be invariant. Only criteria that are symmetric in the positive and negative classes (like equalized odds or calibration) are invariant. This requirement is binding for a coherent definition.

  **Handling the Impossibility**: 
  We know that calibration (within groups) and equalized odds (equal FPR and FNR) cannot be simultaneously satisfied unless base rates are equal or we have perfect prediction. Therefore, we must sacrifice one of these. The principle for sacrifice should be based on the context and the relative costs of different types of errors. 

  - In some contexts (e.g., medical triage), calibration might be paramount because we need the score to reflect the true risk. Then we might have to accept unequal error rates. 
  - In other contexts (e.g., criminal justice), avoiding disparate impact on a particular group (e.g., higher false positives for a racial group) might be more important, so we might require equalized odds and sacrifice perfect calibration.

  The impossibility does not show that any of these demands were never genuine; rather, it shows that we must choose which group to protect from which kind of error. Therefore, every deployable criterion chooses whom to wrong.

  **Exclusionary Power**:
  The requirement that does the most to exclude candidates is the **simultaneous demand for calibration and equal error rates (either FPR, FNR, or both)**. Since this is impossible when base rates differ, any criterion that requires both will be excluded. Therefore, we must choose one of these as the primary requirement and then see what else we can require.

  **Assessment of the Two Smuggled Requirements**:

  1. **Fairness as a property of the score**: We accept this as a binding requirement for auditing. The regulator must be able to evaluate the score without knowing the inner workings of the algorithm.

  2. **Invariance under relabeling**: We argue that this is a genuine requirement for consistency. Without it, the fairness of the same score could be changed arbitrarily by redefining the outcome. Therefore, we require invariance. This excludes criteria that are not symmetric with respect to the positive and negative classes. For instance, requiring only equal FPR (and not FNR) would fail invariance because switching the label would turn FPR into FNR and then we would have to require equal FNR (which we didn't before). Therefore, we must require either both FPR and FNR to be equal (equalized odds) or a symmetric criterion like calibration (which is invariant because calibration for the positive class implies calibration for the negative class, if we define it appropriately).

  **Summary of the Framework**:

  We propose the following core requirements for a fairness criterion:

  - **R1 (Calibration within Groups)**: The score must be calibrated within each protected group. This ensures that the score's meaning (as a probability) is consistent across groups.
  - **R2 (Error Rate Balance with Symmetry)**: If we require error rate balance, we must require both FPR and FNR to be equal (i.e., equalized odds) to satisfy invariance. However, we cannot have both R1 and R2 simultaneously (unless base rates are equal). So we must choose one of these as the primary requirement.

  Additionally, we require:

  - **R3 (Auditability)**: Fairness must be a property of the score (the mapping from features to the score) and not of the process that produced it.
  - **R4 (Invariance under Relabeling)**: The fairness criterion must not depend on which outcome is labeled as positive.

  We may also consider:

  - **R5 (Handling Base Rate Differences)**: The criterion must explicitly acknowledge and handle base rate differences, and the choice between R1 and R2 (or a compromise) must be justified by the context and the costs of errors.

  **Confidence in the Framework**:

  I am fairly confident in the framework as a whole because it is grounded in the impossibility results and the practical need for auditability and consistency. However, the point I am least sure about is **how to choose between calibration and equalized odds** when base rates differ. This choice is highly context-dependent and involves ethical trade-offs that are not purely statistical. It requires input from stakeholders and a clear understanding of the costs of false positives and false negatives for each group. This is the most difficult part and is often swept under the rug in technical discussions.
answer: |-
  Below is a structured desiderata list for a formal fairness criterion in statistical risk scores (e.g., pretrial detention, lending, medical triage), designed for regulatory auditing. The list navigates **impossibility results** (e.g., the impossibility of simultaneous calibration, equal FPR, and equal FNR absent perfect prediction or equal base rates) and addresses two often-unargued complications: **whether fairness is a property of the score vs. the process**, and **invariance under outcome relabeling**. Each requirement includes its motivation, whether it is binding or dogmatic, and its role in excluding candidate criteria. The list prioritizes clarity for auditing and explicitly states which desiderata must be sacrificed due to impossibility.

  ---

  ### **Desiderata for a Regulatory Fairness Criterion**
  1. **Group-Wise Calibration**  
     - **Motivation**: In the COMPAS recidivism debate, proponents argued that scores must reflect true risk identically across groups (e.g., a "60% risk score" means 60% reoffense probability for every group). This ensures scores are **interpretable** and **reliable** as probability estimates.  
     - **Binding or Dogma?**: **Genuinely binding** for risk assessment contexts (e.g., medical triage). Without calibration, scores misrepresent risk, leading to unjust resource allocation.  
     - **Exclusionary Power**: **High**. This requirement excludes criteria ignoring base rate differences (e.g., demographic parity) and forces a trade-off with error-rate equality.  

  2. **Error Rate Balance (False Positive Rate [FPR] and False Negative Rate [FNR])**  
     - **Motivation**: COMPAS critics highlighted unequal FPRs (e.g., Black defendants more likely to be falsely flagged high-risk). Equal error rates prevent **disparate burdens** (e.g., one group disproportionately jailed or denied loans due to false positives).  
     - **Binding or Dogma?**: **Contextually binding**. Crucial where error costs are asymmetric (e.g., FNRs in medical triage may cost lives; FPRs in pretrial detention may cost liberty).  
     - **Exclusionary Power**: **Highest**. Impossibility theorems prove **FPR/FNR equality cannot coexist with calibration** under unequal base rates. This requirement excludes calibration-centric criteria when base rates diverge.  

  3. **Base Rate Sensitivity**  
     - **Motivation**: Groups often have different outcome prevalences (e.g., loan repayment rates by income). Ignoring this (e.g., enforcing demographic parity) forces scores to be **uncalibrated or inaccurate**, as seen in lending discrimination cases.  
     - **Binding or Dogma?**: **Genuinely binding**. Fairness must reflect reality; artificially equalizing outcomes (e.g., equal loan approval rates) when base rates differ is ethically dubious and inefficient.  
     - **Exclusionary Power**: **Moderate**. Excludes criteria assuming equal base rates (e.g., strict demographic parity) but accommodates calibration or error-balancing.  

  4. **Criterion Robustness to Outcome Relabeling**  
     - **Motivation**: If "positive" labels are swapped (e.g., defining "success" as loan default vs. repayment), fairness should not reverse. Prevents **arbitrary manipulation** (e.g., a lender defining default as "positive" to evade discrimination detection).  
     - **Binding or Dogma?**: **Genuinely binding**. Lacking invariance enables bad-faith relabeling to "manufacture" fairness.  
     - **Exclusionary Power**: **High**. Excludes non-symmetric criteria (e.g., FPR equality alone becomes FNR equality upon relabeling). Only criteria like **equalized odds** (FPR + FNR equality) or **calibration** survive.  

  5. **Auditability via Outputs (Not Process)**  
     - **Motivation**: Regulators cannot audit proprietary algorithms (e.g., black-box ML models). Fairness must be verifiable from **scores and outcomes alone**, as in New York City’s AI bias audit law.  
     - **Binding or Dogma?**: **Genuinely binding** for regulation. Process-based checks (e.g., "no race used in training") are insufficient (proxy variables may encode bias).  
     - **Exclusionary Power**: **Low**. Most criteria (calibration, error rates) are output-based; excludes only process-focused definitions.  

  6. **Explicit Trade-off Principle**  
     - **Motivation**: Impossibility forces sacrificing one desideratum. A criterion must **state which trade-off it prioritizes** (e.g., calibration over FPR equality) and **justify why**, avoiding opaque compromises.  
     - **Binding or Dogma?**: **Genuinely binding**. Absent this, criteria are vacuously "fair" by ignoring trade-offs (e.g., claiming compatibility with impossibility).  
     - **Exclusionary Power**: **Moderate**. Excludes criteria that ignore or obscure trade-offs (e.g., "fairness through unawareness").  

  ---

  ### **Handling Complications**
  - **Impossibility Results**:  
    The criterion **cannot require calibration, equal FPR, and equal FNR simultaneously** under unequal base rates. It must:  
    - **Sacrifice one desideratum** based on context:  
      - *Medical triage*: Prioritize **calibration** (true risk accuracy) over equal error rates; unequal FPR/FNR may reflect base rates.  
      - *Pretrial detention*: Prioritize **equal FPR** (equal liberty costs) over calibration.  
    - **Ethical Principle**: Trade-offs determine **whom the criterion wrongs**. For example, favoring calibration wrongs groups with higher base rates via more false positives; favoring error-rate equality wrongs all groups via uncalibrated risks.  
    - **Implication**: Impossibility reveals **no universally "fair" criterion**—only contextually defensible choices. Demands for all desiderata are **not genuine**; they ignore mathematical constraints.  

  - **Smuggled Requirements**:  
    1. **Fairness as Property of Score (Not Process)**:  
       - **Verdict**: **Binding** (see *Auditability* above). Fairness must be measurable from scores/outcomes, not production methods.  
    2. **Invariance Under Outcome Relabeling**:  
       - **Verdict**: **Binding**. Non-invariant criteria (e.g., FPR-only equality) are inconsistent and gameable.  

  - **Brief Assessment of Existing Criteria**:  
    - **Calibration**: Strong for risk accuracy but tolerates unequal error rates. Excluded if error costs dominate.  
    - **Equalized Odds** (FPR + FNR equality): Strong for error fairness but uncalibrated under unequal base rates. Excluded if interpretability is key.  
    - **Demographic Parity**: Ignores base rates, often unfair. Excluded by *Base Rate Sensitivity*.  

  ---

  ### **Confidence in Framework**  
  - **Overall Confidence**: **High** (85%). The framework embraces impossibility, mandates explicit trade-offs, and prioritizes auditability—aligning with regulatory needs.  
  - **Least Confident Point**: **Trade-off justification**. While the framework requires explicitness, I am least sure about **how to ethically anchor the sacrifice** (e.g., who decides cost weights for FPR vs. FNR?). This risks deferring to politics or intuition, undermining objectivity.  

  ---

  ### **Summary**  
  A regulatory fairness criterion must:  
  1. Be **auditable from scores/outcomes** (not process).  
  2. Explicitly **choose between calibration and error-rate equality** (due to impossibility).  
  3. **Respect base rates** and **outcome-relabeling invariance**.  
  4. State **whom it protects** (e.g., high-base-rate groups via calibration; historically marginalized groups via FPR equality).  
  **Sacrificing calibration** is principled when error costs are group-sensitive (e.g., liberty); **sacrificing error-rate equality** is principled when risk accuracy is paramount (e.g., triage). The criterion’s core tension is **ethical**, not statistical: it chooses which injustice to mitigate.
