  ### Decision Tree for Fictional Emotion Views

  **Instructions:** Answer each question based on your intuitive reactions to the scenarios described. No prior philosophical knowledge is needed. Focus on what feels true to your experience.

  ---

  #### **Node 1**  
  **Scenario:** You feel grief for a procedurally generated NPC in a roguelike (e.g., a character with no backstory, only emergent algorithmic traits that made you care).  
  **Question:** Is this grief a *genuine* emotion (i.e., you are truly sad, not just "as if" sad)?  
  - **Yes** → Node 2  
  - **No** → Node 3  

  ---

  #### **Node 2**  
  **Scenario:** The same procedurally generated NPC grief.  
  **Question:** Does this grief *require* you to believe the NPC existed to feel it?  
  - **Yes** → Node 4  
  - **No** → Node 5  

  ---

  #### **Node 3**  
  **Scenario:** Grief for the procedurally generated NPC.  
  **Question:** Are you engaging in conscious pretense (e.g., "I’ll *imagine* this NPC had a tragic past")?  
  - **Yes** → **Leaf 2** (Walton-style make-believe)  
  - **No** → **Leaf 5** (Deflationary view)  

  ---

  #### **Node 4**  
  **Scenario:** The NPC grief again.  
  **Question:** In the moment of grief, did you *actually believe* the NPC was real?  
  - **Yes** → **Leaf 1** (Full-blooded illusionism)  
  - **No** → **Leaf 6** (Incoherent combo)  

  ---

  #### **Node 5**  
  **Scenario:** You feel pity for a *fictionalized Napoleon* in a biopic (e.g., you pity "movie Napoleon," not the real historical figure).  
  **Question:** Does this pity drive an impulse to act (e.g., donate to a charity, protest historical injustice)?  
  - **Yes** → Node 6  
  - **No** → Node 7  

  ---

  #### **Node 6**  
  **Scenario:** Pity for fictionalized Napoleon.  
  **Question:** Is the action impulse *inherent* to the emotion (i.e., pity *always* demands action), even if you don’t act?  
  - **Yes** → **Leaf 6** (Incoherent combo)  
  - **No** → **Leaf 4** (Attenuation view)  

  ---

  #### **Node 7**  
  **Scenario:** Pity for fictionalized Napoleon (with no action impulse).  
  **Question:** Is your pity *structurally identical* to real pity (same intensity/physiology), minus the action urge?  
  - **Yes** → **Leaf 4** (Attenuation view)  
  - **No** → **Leaf 3** (Thought-theory)  

  ---

  ### Leaf Mapping
  1. **Full-blooded illusionism**: Believes the fiction is real (Node 4 → Yes).  
  2. **Walton-style make-believe**: Emotion is pretend, governed by rules of pretense (Node 3 → Yes).  
  3. **Thought-theory**: Genuine emotion, but no belief/action urge; driven by thoughts alone (Node 7 → No).  
  4. **Attenuation view**: Genuine emotion, but "weaker" due to no action motivation (Node 6 → No, or Node 7 → Yes).  
  5. **Deflationary view**: No genuine emotion occurs; it’s superficial (Node 3 → No).  
  6. **Incoherent combo**: Claims emotion requires existence belief, is action-motivating, *and* is genuine—yet lacks belief (Node 4 → No or Node 6 → Yes).  

  ---

  ### Scoring Notes: Ambiguous Distinctions  
  1. **Thought-theory vs. Attenuation (Node 7)**:  
     - Both deny action-motivating force.  
     - Separation hinges on whether the emotion is seen as *structurally identical* to real emotions (Attenuation) or *fundamentally different* due to being thought-based (Thought-theory).  
     - **Why ambiguity?** Some argue thought-based emotions *are* structurally identical (blurring the line), while others insist they lack somatic/affective depth.  

  2. **Walton vs. Deflationary (Node 3)**:  
     - Walton requires active pretense; Deflationary denies any depth (even pretense).  
     - **Why ambiguity?** If a respondent denies pretense but can’t articulate *why* they feel something, it defaults to Deflationary.  

  3. **Attenuation vs. Incoherent Combo (Node 6)**:  
     - Attenuation allows for action *impulses* if they’re inert; Incoherent Combo flags action as *essential*.  
     - **Why ambiguity?** If one admits to weak action urges but dismisses them as irrelevant, it could fit either.  

  ---

  ### Design Logic  
  - **Node 1–2** isolates Illusionism/Incoherent Combo by probing belief dependence.  
  - **Node 3** separates Walton (pretense) from Deflationary (no substance).  
  - **Node 5–7** triangulates Thought-theory/Attenuation by testing action-impulse salience and structural realism.  
  - **Niche cases**:  
    - Procedural NPC (Node 1/2/3/4) tests if emotion requires authored backstory.  
    - Fictionalized Napoleon (Node 5/6/7) tests emotion directed at counterfactual versions of real entities.  

  This tree forces distinctions via behavioral stakes (action), metaphysical commitments (belief), and emotional architecture (structure), avoiding label-based reasoning.
