answer: |-
  Your inquiry identifies a profound and under-conceptualized phenomenon in political psychology. After examining philosophical, sociological, and political theory literature, I find **no established term that precisely carves this phenomenon at its joints**. Below, I propose a new conceptual framework, distinguish it from adjacent concepts, and resolve the Fukuyama question.

  ### 1. **The Proposed Concept: Existential Status Deprivation (ESD)**  
  **Definition**: *A crisis of subjective insignificance arising when individuals or groups in materially secure societies experience their lives as lacking meaning, agency, or recognition—despite objective comfort—and consequently seek to reclaim existential weight through political or ideological acts that assert consequence.*  

  #### Core Characteristics:  
  - **Triggered by abundance**, not scarcity: Security creates space to confront "higher-order" needs (beyond Maslow’s hierarchy).  
  - **Targets metaphysical displacement**: Grievance centers on *symbolic erasure* (e.g., "We’re seen as irrelevant," "Our existence doesn’t matter").  
  - **Fueled by performative agency**: Actions aim to *demonstrate* impact, often through defiance of systems perceived as sterile or degrading.  
  - **Asymmetric sacrifice**: Subjects willingly trade material security for symbolic gains (e.g., suburban jihadists trading safety for purpose).  

  #### Boundary Cases & Distinctions:  
  | Concept            | How ESD Differs | Hard Boundary Test |  
  |--------------------|----------------|-------------------|  
  | **Ressentiment**   | ESD lacks envy; it seeks *creation* of significance (not revenge). Afflicts powerful elites. | *Elite undermining own system*: Ressentiment cannot explain why beneficiaries sabotage their source of privilege. |  
  | **Anomie**         | ESD is not normlessness but *active rebellion against perceived meaninglessness*. Norms may remain intact. | *Jihadists*: They adopt rigid new norms; their pain is not confusion but *yearning for cosmic purpose*. |  
  | **Status Anxiety** | ESD fears *existential* (not social) invisibility. Status-anxious actors cling to advantages; ESD actors discard them. | *Billionaire funding anti-system movements*: Status anxiety would make them protect wealth; ESD drives them to burn it for glory. |  
  | **Legitimate Dignity Protests** | ESD arises *without objective dehumanization*. Legitimate protests target concrete oppression (e.g., disenfranchisement). | *#MeToo vs. "Great Replacement" rhetoric*: The former addresses systemic harm; the latter invokes imagined annihilation where material privilege persists. |  

  **Edge Cases**:  
  - **Working-class populists**: If materially precarious, their grievance is not ESD but ressentiment. ESD requires baseline security.  
  - **Climate activists**: Those from wealth who risk privilege *for future survival* seek tangible goods; ESD seeks *immediate existential validation*.  

  ---

  ### 2. **Fukuyama’s End of History: Refutation or Confirmation?**  
  Your friend is **correct that Fukuyama’s thesis anticipates ESD**, but *not* in the summary version. The deeper argument in *The End of History and the Last Man* (1992) contains ESD’s seeds:  

  #### Fukuyama’s Dual Framework:  
  - **Part 1: Liberal democracy’s victory** (the summary) suggests contentment.  
  - **Part 2: Thymos**—Plato’s term for the human craving for recognition. Fukuyama warns that liberal democracy’s focus on comfort may *stifle thymotic drives*, causing a "megalothymia" (desire for supreme recognition) to resurface destructively.  

  #### Why ESD Confirms (Not Refutes) Fukuyama:  
  - Fukuyama explicitly predicts that post-ideological societies will face unrest from those who find liberal democracy’s "equal recognition" *insufficiently fulfilling*.  
  - ESD manifests precisely as *megalothymia*: The jihadist, populist, or elite saboteur seeks to transcend the "last man" (Fukuyama’s term for the contented bourgeois) by pursuing *greatness through conflict*.  
  - **Fukuyama’s oversight**: He assumed thymotic urges would express through entrepreneurship or art. ESD reveals they often target democracy itself when no "higher" outlet exists.  

  **Conclusion**: Fukuyama’s thesis must be read as tragic prophecy, not triumphalism. Liberal democracy’s material success *inevitably incubates ESD* by sidelining the human need for struggle-bound significance.  

  #### Implications:  
  - **Policy**: Addressing ESD requires *meaning-infusing institutions* (e.g., national service, civic rituals) that offer non-destructive thymotic outlets.  
  - **Diagnosis**: ESD explains why reactionary movements thrive in Scandinavia (high equality) but not Bulgaria (material insecurity).  
  - **Limitation**: ESD cannot explain movements rooted in genuine deprivation (e.g., racial capitalism). It is the pathology of the over-secure.  

  **Final Note**: ESD is not a "disease of affluence" but a *structurally generated vacuum* where liberal democracy’s neutrality toward the "good life" collides with innate human drives. Naming it is the first step toward mitigation.
