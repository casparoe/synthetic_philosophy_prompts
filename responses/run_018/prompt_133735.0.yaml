answer: |-
  ### Teaching Plan: Kripkenstein's Rule-Following for Law & Literature Students

  **1. Dependency Sequence (Order is Non-Negotiable):**  
  *Start (5 min):* Silent writing exercise: "Write a professional rule (e.g., legal precedent, citation norm). Describe what evidence would prove you’d *always* misunderstood it." *Purpose:* Activates intuition that rules depend on past applications and future expectations.  
  *Step 1: Rule-Following as Projection (10 min)* – Use student examples to establish: Rules require applying past cases to novel situations. *Prerequisite:* Skepticism assumes rules exist *before* application.  
  *Step 2: Skeptical Problem (25 min)* – Argue no fact (past behavior, mental state, disposition) can *necessitate* one future application over another (e.g., "reasonable care" *could* have meant something incompatible). *Prerequisite:* Students must first grasp that rules *aim* to bind future cases.  
  *Step 3: Skeptical Solution (20 min)* – Only *after* Step 2 induces vertigo, introduce the solution: Correctness is not fixed by individual facts but by communal agreement in practice. *Prerequisite:* The problem must feel insoluble individually to motivate the communal turn.

  **2. The Carrying Example: "Reasonable Care" Across Contexts**  
  *Scenario:* A 19th-century English court deems "reasonable care" requires shouting a warning before backing a horse cart. A 21st-century US court applies "reasonable care" to autonomous vehicle software updates.  
  *Required Features:*  
  - Indeterminacy: No inherent "fact" in the phrase or past rulings dictates if "reasonable care" *must* include algorithmic audits.  
  - No Hidden Mental Rule: A judge’s intention ("I meant public safety!") doesn’t fix whether "safety" requires hardware redundancy or user education.  
  - Lacks Private Criterion: No individual’s introspection resolves ambiguity; intention is just more words needing interpretation.  
  *Why It Works:* Legally familiar, avoids math. Shows historical/cultural variance *without* assuming error, forcing the question: "What *makes* a new application correct?" *Community Link:* What counts as "reasonable" depends on shared practices/judgments of a legal community applying standards *together* over time.

  **3. Misconception Map (Preempt at Key Points):**  
  - **Misconception: "Kripke says meaning is impossible."**  
    *When to Preempt:* After stating the skeptical problem.  
    *Move:* "This is a *problem* needing a *solution*, not a conclusion. Wittgenstein/Kripke *accept* we follow rules – but ask *how*."  
  - **Misconception: "This is just the private language argument."**  
    *When to Preempt:* When discussing why mental states fail (Step 2).  
    *Move:* "The target isn’t ‘private sensations’ but *any* individual fact (including intentions/thoughts) fixing correctness. Community enters as the *solution*, not the target."  
  - **Misconception: "It’s about our subjective uncertainty."**  
    *When to Preempt:* During "reasonable care" variations.  
    *Move:* "This isn’t psychology. Even if you’re *certain*, the skeptic asks: What *fact* makes your certainty right? Couldn’t certainty be misplaced?" Use the writing exercise: "You were certain before – what changed?"

  **4. What to Leave Out (State Explicitly):**  
  - **Openly Refuse:** Technical critiques of dispositionalism (e.g., normativity, finitude, malfunction). Say: "We note dispositionalism *tries* to solve this but fails – we won’t dissect why."  
  - **Defer:** Wittgenstein’s full text (§§143-242), normativity debates (why meaning *should* guide use), Kripke’s exegetical status. Say: "We focus solely on the core argument structure: problem → solution."

  **5. Check for Understanding (Final 5 min):**  
  *Question:* "Imagine a judge applies ‘reasonable care’ to AI in a novel way. According to the *skeptical solution*, what makes this application correct or incorrect?"  
  *Correct Answer:* Points to acceptance/rejection by the relevant legal community based on shared practices and standards. (Reveals grasp of communal grounding.)  
  *Incorrect Answer:* References the judge’s intention, the plain meaning of the words, or consistency with past rulings *alone*. (Reveals residual individualism or mere understanding of indeterminacy problem.)  

  **Session Flow:** Writing Ex (5) → Step 1 (10) → Step 2 w/ Example (25) → BREAK (5) → Step 3 w/ Example (20) → Misconception Review (10) → Check Q (5) → Wrap-up (10).  
  *Rigor Note:* The sequence forces the problem *before* the solution. The example sustains conceptual weight without technical baggage.
