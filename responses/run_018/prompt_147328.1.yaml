  ### Decision Tree: Exploitation vs. Alienation in Marxist Theory  
  *Navigate by answering three questions in sequence. Each branch is labeled by the claim that splits it.*  

  ---

  #### **First Split: Conceptual Priority**  
  *Does exploitation (extraction of surplus value) have explanatory priority over alienation (estrangement from product, process, others, species-being), or vice versa, or are they independent?*  

  1. **Branch A: Exploitation is conceptually prior to alienation**  
     *(Surplus extraction explains alienation's emergence.)*  
     → Proceed to Second Split.  

  2. **Branch B: Alienation is conceptually prior to exploitation**  
     *(Estrangement explains surplus extraction's possibility.)*  
     → Proceed to Second Split.  

  3. **Branch C: Exploitation and alienation are analytically independent**  
     *(Co-occur without explanatory direction; neither grounds the other.)*  
     → Proceed to Second Split.  

  ---

  #### **Second Split: Historical Specificity of Alienation**  
  *Can alienation persist in non-capitalist social formations (e.g., bureaucratic planning without markets), or is it tied to capitalism?*  

  - **For Branch A (Exploitation Prior)**:  
    - **Branch A1: Alienation is capitalism-specific**  
      *(Requires commodity-form/wage-contract; vanishes without markets.)*  
      → Automatically assigned to Leaf A1 (no third split; wrong of exploitation is irreducible).  
    - **Branch A2: Alienation persists in non-capitalism**  
      *(Arises from separation from means of production, even without markets.)*  
      → Automatically assigned to Leaf A2 (no third split; wrong of exploitation is irreducible).  

  - **For Branch B (Alienation Prior)**:  
    - **Branch B1: Alienation is capitalism-specific**  
      *(Tied to private property/commodities; absent in non-market systems.)*  
      → Automatically assigned to Leaf B1 (no third split; wrong of exploitation is reducible to alienation).  
    - **Branch B2: Alienation persists in non-capitalism**  
      *(Rooted in division of labor/objectification, beyond capitalism.)*  
      → Automatically assigned to Leaf B2 (no third split; wrong of exploitation is reducible to alienation).  

  - **For Branch C (Independent)**:  
    - **Branch C1: Alienation is capitalism-specific**  
      *(Depends on commodity fetishism; not generalizable.)*  
      → Proceed to Third Split.  
    - **Branch C2: Alienation persists in non-capitalism**  
      *(Occurs wherever labor is externally directed, e.g., state socialism.)*  
      → Proceed to Third Split.  

  ---

  #### **Third Split: Normative Reducibility**  
  *Is the wrong of exploitation fully reducible to alienation (no residual injustice if estrangement cured), or does it carry a distinct wrong (e.g., domination, unfair distribution)?*  
  *(Applied only to Branch C: Independent)*  

  - **For Branch C1 (Alienation capitalism-specific)**:  
    - **Branch C1a: Wrong of exploitation reducible to alienation**  
      *(Injustice vanishes if estrangement eliminated.)*  
      → Proceed to Leaf C1a.  
    - **Branch C1b: Wrong of exploitation irreducible to alienation**  
      *(Surplus extraction is unjust independently, e.g., as theft or domination.)*  
      → Proceed to Leaf C1b.  

  - **For Branch C2 (Alienation persists in non-capitalism)**:  
    - **Branch C2a: Wrong of exploitation reducible to alienation**  
      *(Harm lies only in exacerbating estrangement.)*  
      → Proceed to Leaf C2a.  
    - **Branch C2b: Wrong of exploitation irreducible to alienation**  
      *(Retains distinct injustice, e.g., unfair labor-time claim.)*  
      → Proceed to Leaf C2b.  

  ---

  ### Terminal Nodes (Leaves)  

  #### **From Branch A (Exploitation Prior)**:  
  - **Leaf A1: Orthodox Marxism**  
    - *Core commitment*: Exploitation (surplus extraction) materially grounds capitalism, with alienation as a derivative ideological effect.  
    - *Awkward commitment*: Must accept exploitation as unjust even in a hypothetical non-alienating capitalism (e.g., automated co-ops), where workers are "content" but surplus is extracted.  
    - *Path*: A → A1 (auto-irreducible).  

  - **Leaf A2: Unnamed**  
    - *Core commitment*: Exploitation causes alienation universally under class society, regardless of capitalism’s commodity-form.  
    - *Awkward commitment*: Must reject Marx’s explicit link between alienation and commodity fetishism, as alienation persists in non-market systems (e.g., state socialism) due to exploitation.  
    - *Emptiness reason*: Neglect — theorists rarely universalize exploitation’s causality while denying Marx’s historical specificity for alienation.  
    - *Path*: A → A2 (auto-irreducible).  

  #### **From Branch B (Alienation Prior)**:  
  - **Leaf B1: Critical Humanism**  
    - *Core commitment*: Alienation under private property is the core pathology, with exploitation as its economic symptom in capitalism.  
    - *Awkward commitment*: Cannot condemn alienation in non-commodity systems (e.g., bureaucratic collectivism) where workers lack autonomy, since it is deemed capitalism-specific.  
    - *Path*: B → B1 (auto-reducible).  

  - **Leaf B2: Existentialist Marxism**  
    - *Core commitment*: Alienation is an ontological condition of objectified labor under any division of labor, and exploitation is its capitalist expression.  
    - *Awkward commitment*: Must accept that post-capitalist societies (e.g., centrally planned economies) retain alienation if labor is bureaucratically managed, undermining Marx’s communist ideal.  
    - *Path*: B → B2 (auto-reducible).  

  #### **From Branch C (Independent)**:  
  - **Leaf C1a: Unnamed**  
    - *Core commitment*: Exploitation and alienation are distinct in capitalism, but exploitation’s injustice reduces to its role in causing alienation.  
    - *Awkward commitment*: Must concede that if alienation were cured in capitalism (e.g., via workplace democracy), exploitation would cease to be unjust — contradicting Marx’s insistence on surplus extraction as theft.  
    - *Emptiness reason*: Incoherence — if phenomena are independent, normative reducibility implies unexplained causal dependence.  
    - *Path*: C → C1 → C1a.  

  - **Leaf C1b: Structuralist Dualism**  
    - *Core commitment*: Exploitation (economic) and alienation (ideological) are co-constitutive yet irreducible capitalist structures, with separate mechanisms.  
    - *Awkward commitment*: Must deny that bureaucratic socialism produces ideological alienation (due to no commodity-form), even when workers experience powerlessness.  
    - *Path*: C → C1 → C1b.  

  - **Leaf C2a: Unnamed**  
    - *Core commitment*: Alienation is a universal harm of divided labor, and exploitation’s wrongness lies solely in worsening it.  
    - *Awkward commitment*: Must treat non-exploitative alienation (e.g., in a gift economy with fixed roles) as harmful but non-alienating exploitation (hypothetically) as benign, inverting Marxist critiques.  
    - *Emptiness reason*: Unattractiveness — implies class exploitation is acceptable if estrangement is minimized.  
    - *Path*: C → C2 → C2a.  

  - **Leaf C2b: Pluralist Critical Theory**  
    - *Core commitment*: Exploitation entails a distinct wrong (e.g., unfair surplus claim) and alienation a separate harm (e.g., social disintegration), both irreducible and generalizable beyond capitalism.  
    - *Awkward commitment*: Must allow a society to eliminate alienation (via community solidarity) while permitting class-based exploitation as morally tolerable, anathema to revolutionary Marxism.  
    - *Path*: C → C2 → C2b.  

  ---

  ### Notes  
  - **Undistinguished Positions**: The tree separates all named positions. No two named positions share a terminal node.  
  - **Design Rationale**:  
    - Third split omitted for Branches A/B due to *logical constraints*:  
      - In A (exploitation prior), reducibility (3a) is incoherent (if exploitation causes alienation, its wrong cannot depend *only* on alienation).  
      - In B (alienation prior), irreducibility (3b) is unattractive (if alienation grounds exploitation, curing alienation should resolve exploitation’s wrong).  
    - Unnamed leaves indicate combinations avoided due to *incoherence*, *unattractiveness*, or *neglect*.
