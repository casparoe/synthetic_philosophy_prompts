answer: |-
  Based on your precise description, there isn't a widely established single term *exactly* for this configuration. The phenomenon you're isolating – **low-cost physical synchrony creating a subjective feeling of shared intentionality/purpose despite divergent individual motives and meanings** – sits at a specific intersection needing its own carve-out. Let's define it, distinguish it, and map its edges.

  **Proposed Concept: Synchrony-Induced Cohesion Illusion (SyICI)**

  1.  **Definition:** A psychological and social phenomenon where *low-cost, physically synchronized group action* (e.g., rhythmic chanting, swaying, marching in step, coordinated carrying) generates a subjective *feeling of shared purpose, unity, or collective intentionality* among participants, *despite the absence of genuine shared beliefs, goals, or motivations* at the individual level. The synchrony itself acts as the primary mechanism manufacturing the *illusion* of cohesion.

  2.  **Core Mechanism:** The key driver is the *physical synchrony itself*, leveraging basic neurocognitive processes:
      *   **Sensorimotor Coupling:** Aligning movements creates neural entrainment, blurring self-other boundaries.
      *   **Predictability & Reduced Uncertainty:** Rhythmic coordination creates a predictable social environment, reducing cognitive load and inducing positive affect.
      *   **Self-Perception Theory:** Participants infer internal states ("we must be united") from their observable synchronized behavior ("we are acting as one").
      *   **Minimal Group Paradigm Effect:** Synchrony acts as a potent, low-effort marker of group membership, triggering in-group favorability biases interpreted as shared purpose.

  **Boundary Carving:**

  1.  **Vs. Durkheim's Collective Effervescence:**
      *   **Durkheim:** Focuses on *high-arousal, emotionally charged* gatherings where shared beliefs *pre-exist* and are *intensified* by the interaction, leading to sacred/profane distinction and long-term social binding. Emotion is primary; synchrony (if present) is a *symptom* or amplifier *of* the shared emotional state/belief.
      *   **SyICI:** Focuses on *low-cost physical coordination* as the *primary cause* of the feeling of unity. Genuine shared belief or intense emotional arousal is *not* required or necessarily present. The "shared intentionality" is an *illusion generated by the synchrony*, not an expression of pre-existing deep belief. It's *mechanistic* rather than *symbolic/emotional* at its core. Durkheim explains how shared belief *feels powerful*; SyICI explains how *acting in sync* can *feel like* shared belief *without it*.

  2.  **Vs. Searle-Type Collective Intentionality:**
      *   **Searle:** Requires genuine, conscious "we-intentions" – individuals holding a shared goal *as a collective* ("*We* intend to carry X"). It's a cognitive state of *joint commitment* to a shared action and its goal. Beliefs and intentions are aligned at the conceptual level.
      *   **SyICI:** There is *no* required "we-intention." Individuals participate for disparate, often personal/individual reasons (obligation, status, curiosity, social pressure, aesthetic enjoyment). The *feeling* of shared purpose arises *from the physical act of coordination*, not from any shared cognitive state about the goal. Post-hoc explanations ("we were united") are rationalizations of the synchrony-induced feeling, not reports of genuine joint commitment. Searle describes *actual* shared cognition; SyICI describes a *physically induced illusion* of it.

  **Edges of SyICI:**

  1.  **When Synchrony Reflects Genuine Intent:** If the group *truly* shares beliefs/goals *and* the synchrony arises *from* that shared intentionality (e.g., a highly committed team performing a ritual core to their faith), it moves towards Durkheim or Searle. SyICI focuses on cases where synchrony *creates the feeling* without the underlying shared cognition.
  2.  **Introduction of High Cost/Stakes:** If the synchronized action becomes genuinely costly (endurance, pain, significant resource expenditure), Costly Signaling Theory starts to apply alongside or instead of SyICI. SyICI thrives on *low-cost* synchrony.
  3.  **Individual Differences:** Susceptibility to the illusion likely varies based on personality, suggestibility, and prior group affiliation. Some may experience it strongly, others minimally.
  4.  **Temporal Limits:** The feeling of unity is often transient, strongest *during* and immediately *after* the synchronized activity, fading as normal cognition resumes. Long-term bonding requires other mechanisms.
  5.  **Cultural Framing:** The *interpretation* of the feeling ("We were one with God," "We achieved group mind," "We honored tradition") is culturally shaped. SyICI explains the *mechanism generating the raw feeling*; culture provides the narrative overlay.
  6.  **Non-Ritual Contexts:** While you focus on rituals, SyICI can occur elsewhere (e.g., low-stakes team-building exercises, synchronized dancing at a concert, marching in a non-ideological parade) – anywhere low-cost physical synchrony happens without deep prior shared intent.

  **In essence:** SyICI carves out the specific effect where **the physical mechanics of moving/acting together in time trick the brain into generating a feeling of "we-ness" and shared purpose, even when individuals are there for entirely different reasons and hold no actual shared intentional state.** It's the body leading the mind (and the explanation) astray, manufacturing cohesion through rhythm and movement alone.
