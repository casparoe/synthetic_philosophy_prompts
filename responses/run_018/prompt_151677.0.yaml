  hey, i've been noticing this weird thing in religious rituals that i cant quite place in the literature i know. picture a group where everyone sways and chants in perfect rhythm — cheap, no belief screening — and afterwards they talk about what they all meant like they shared one mind, but ask them seperately and they mean totally different things. or a procession where people carry something heavy in step, and they report feeling unified purpose even though they joined for family pressure, status, whatever. it isnt durkheim's collective effervescence to me because thats more emotional arousal, and it isnt costly signaling since the actions arent expensive. its more like physical synchrony manufacturing a false joint intentionality. is there an established concept for this exact configuration — synchrony-generated pseudo-collective-intention? if not, can you name and define it, draw the boundary with durkheim and with searle-type collective intentionality, and say where its edges are? i just want the carving, not a reading list.
