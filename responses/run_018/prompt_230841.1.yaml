prompt: |-
  I am a novelist, and for the past year I have been compiling small scenes — some from trial transcripts, hospital notes and planning meetings I have read for a novel, some from ordinary life — in which one person is believed and another is not. I have strong and apparently inconsistent judgements about these scenes, and I would like you to act as a professional philosopher working in social epistemology and help me find the principle behind them. Please think carefully, begin by sorting the cases and testing candidate principles against them, and do not settle for a slogan; I want precision and an honest statement of what will not fit.

  Here are the cases and my verdicts. (1) A forensic accountant who is being paid by the defendant's commercial rival gives evidence in a fraud trial, and the court directs the jury to give it little weight; I find that wholly sensible. (2) A man with advanced dementia gives confused, confabulated testimony about a road accident and the police set it aside; I see no wrong in that. (3) A gallery owner dismisses a young woman painter's account of her own canvases as the enthusiasm of a collector's wife without looking at the work or checking her facts; I am certain something unfair is being done to her. (4) A patient reports severe post-operative pain, but the ward doctor assumes he is exaggerating in order to obtain opioids, largely because he is a young Black man and the ward has a standing assumption that patients of his sort exaggerate pain; no analgesia is given, and when the pain proves to be a surgical complication, the notes describe him as a poor historian. That strikes me as a serious wrong and not merely a clinical error. (5) A man with two old convictions for shoplifting reports that two officers beat him in a car park; the unit reviewing his complaint discounts it almost entirely on the strength of that record and does not pull the CCTV that would settle the matter. Here I am genuinely torn: his record seems to me relevant, but refusing to look at available evidence because of it also seems to insult him. (6) A science writer with a stammer gives a careful and well-evidenced account of a flood model to a town council; the chair later says he convinced no one because he could not get the words out, while a fluent oil-company consultant who made several factual errors was judged credible. I regard the chair's response as a clear injustice, though it does not feel exactly like (3) or (4). (7) An uncle of mine, a serial fabulist who has told the same invented story about meeting the Queen for forty years, reports witnessing a burglary; I would give his word almost no weight, and I do not believe I wrong him by doing so.

  My working hunch is that a hearer wrongs a speaker only when the hearer lowers the speaker's credibility on account of the social group the speaker belongs to, and not when the discount tracks something about the particular individual — their record, their interests, or their present condition. But I can already see the strain: that hunch seems to excuse the chair in (6) by treating the man's stammer as a present condition of his, and it also seems to excuse the investigators in (5) because they used the man's own record; yet I am sure about (6) and uneasy about (5). Please repair this principle or replace it. I want the final principle stated precisely, with each clause tied to the case that motivates it; I want to know what it predicts about further cases I have not listed, such as a defendant who is doubted because she testifies through an interpreter, or a witness who is believed too readily because she is a titled surgeon; and I want an honest accounting of which of my original verdicts, if any, the principle cannot accommodate and how I should revise them. Please write your answer in British English.
reasoning: |-
  Hmm, this novelist has presented a fascinating epistemological puzzle about credibility assessments across seven distinct scenarios. They're grappling with why some dismissals of testimony feel ethically wrong while others seem justified, despite superficial similarities. Their working hypothesis about group-based discounting versus individual-based discounting shows good intuition but clearly strains under scrutiny - particularly in cases 5 and 6 where personal characteristics (criminal record) and present conditions (stammer) create moral tension.

  The core challenge lies in distinguishing between epistemically responsible skepticism and prejudicial disbelief. Cases 1 and 2 demonstrate textbook proper discounting: financial bias and dementia are direct relevance to reliability. But case 3 reveals how group-based assumptions (collector's wife) bypass evidence evaluation entirely. Case 4 presents the clearest moral failure - racialized pain perception that constitutes both epistemic and ethical violation through statistical discrimination.

  Case 5 is the true pivot point - the shoplifter's complaint. Here we hit the fault line between legitimate prior probability adjustment and what Miranda Fricker calls "testimonial injustice". The refusal to check CCTV transforms reasonable caution into active epistemic negligence. Case 6's stammer introduces disability bias masked as performance evaluation, while case 7 shows how extreme individual patterns (serial fabulism) can override general testimonial rights.

  What emerges is a three-dimensional framework: 1) the type of credibility discount (group vs individual), 2) the connection to relevant reliability indicators, and 3) the presence of corrective mechanisms. The gallery owner, pain patient, and science writer cases all share exclusion of counterevidence, whereas the dementia witness and fabulist uncle don't offer such corrective possibilities. The shoplifter case becomes wrongful precisely because CCTV provides a readily available truth-check that wasn't utilized.

  For unlisted cases: testimony through interpreters should trigger careful scrutiny of translation quality rather than automatic discounting, while the titled surgeon demonstrates positive credibility excess that's equally epistemically dangerous. The principle must condemn both unjust deflation and inflation of credibility.

  The novelist might reconsider their "uneasy but not clearly wrong" stance on case 5 - the systematic exclusion of certain voices from epistemic consideration creates what José Medina calls "hermeneutical lacunae" that compound injustice. Precision requires specifying when prior probabilities become self-fulfilling prophecies through neglected investigation.
answer: |-
  Below is a systematically developed principle of testimonial justice, derived from your cases through elimination of inadequate candidates and precision-building. It distinguishes between **epistemically responsible credibility assessment** and **testimonial injustice**, with wrongfulness arising when three conditions converge.

  ---

  ### **The Principle of Contextual Credibility Assessment (CCA)**
  **A hearer wrongs a speaker when they discount testimony primarily on the basis of a *presumed group characteristic* (social, professional, or identity-based) that:  
  (a) is not *reliably connected* to truth-tracking capacity *in this context*; and  
  (b) substitutes for or obstructs *available context-sensitive evidence*;  
  (c) thereby denying the speaker *epistemic agency* in a way that perpetuates systemic disadvantage.**  

  This wrong constitutes **testimonial injustice** (after Miranda Fricker), but with tightened criteria to exclude cases of individual unreliability.

  ---

  ### **Clause-by-Clause Justification via Your Cases**
  1. **"Presumed group characteristic"**  
     - Excludes cases tracking *individual* traits (e.g., dementia, fabulist history).  
     - *Motivated by Cases 2 & 7*: Discounting due to medically verified cognitive impairment or proven personal deceit is epistemically responsible. Group proxies (e.g., race, gender, disability) are presumptive.  

  2. **"Not reliably connected to truth-tracking in this context"**  
     - Requires domain-specific relevance. Expertise (e.g., forensic accounting) may justify scrutiny, but identity traits rarely do.  
     - *Motivated by Cases 1 & 4*:  
       - Case 1 (accountant): Financial bias *directly* impairs truth-tracking in fraud testimony.  
       - Case 4 (patient): Race has no proven link to pain exaggeration; discounting lacks clinical basis.  

  3. **"Substitutes for/obstructs available context-sensitive evidence"**  
     - The hearer must engage with accessible counter-evidence. Refusal to do so converts skepticism into prejudice.  
     - *Motivated by Cases 3, 4, 5 & 6*:  
       - Case 3 (gallery owner): Dismissal without viewing canvases ignores direct evidence.  
       - Case 5 (shoplifter): Rejecting CCTV review ignores verificatory means.  
       - Case 6 (science writer): Prioritizing fluency over content ignores documentary evidence.  

  4. **"Denies epistemic agency & perpetuates systemic disadvantage"**  
     - The discounting must reinforce broader patterns of marginalization.  
     - *Motivated by Cases 4 & 6*:  
       - Case 4: Racialized pain assessment perpetuates healthcare disparities.  
       - Case 6: Discrediting due to stammer entrenches disability exclusion.  
     - *Contrasts with Case 7*: Disbelieving a fabulist has no systemic impact.  

  ---

  ### **Reconciling Problematic Cases**
  - **Case 5 (Shoplifter)**:  
    - **CCA Verdict**: *Wrongful*.  
    - Prior convictions *alone* do not reliably indicate unreliability about police brutality (failing condition 2a). Refusing CCTV obstructs context evidence (failing 2b). This denies agency to a marginalized group (systemically targeted by policing) and perpetuates impunity (failing 2c).  
    - *Revision Advised*: Your unease signals the presence of testimonial injustice.  

  - **Case 6 (Science Writer)**:  
    - **CCA Verdict**: *Wrongful*.  
    - Stammer is treated as a group-based proxy for incompetence (disability stigma), not a present condition like dementia. Ignoring documentary evidence violates 2b. It denies epistemic agency to disabled speakers and entrenches exclusion (2c).  

  ---

  ### **Predictions for New Cases**
  | Scenario                          | CCA Prediction                                                                 | Reason                                                                                                |
  |-----------------------------------|--------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|
  | Defendant testifying via interpreter | Wrongful if discounted *due to* interpreter use (absent evidence of mistranslation) | Presumes linguistic deficiency ≡ unreliability (2a); likely obstructs cross-examination (2b); marginalizes non-native speakers (2c). |
  | Titled surgeon believed too readily | Wrongful *if* credibility excess ignores counter-evidence                     | Credibility granted via professional group status (2a), potentially obstructing scrutiny (2b), entrenching class/status bias (2c). |
  | Witness with schizophrenia (stable) | Wrongful if dismissed without assessing current capacity/evidence             | Group stereotype (2a); likely obstructs context evidence (e.g., medical records) (2b); systemic disadvantage (2c). |

  ---

  ### **Accounting for Misfits**
  - **Case 7 (Fabulist Uncle)** fits perfectly: Discounting is based on *individual* history of deceit (not group trait), directly relevant to truth-tracking (2a satisfied), and no systemic disadvantage is perpetuated.  
  - **All other verdicts** align:  
    - Case 1: Justified (bias is context-relevant).  
    - Case 2: Justified (cognitive impairment is direct evidence).  
    - Case 3: Wrongful (group stereotype + ignored evidence).  
    - Case 4: Wrongful (race-based presumption + clinical negligence).  
    - Case 6: Wrongful (disability bias + ignored content).  

  - **Strain in Case 5 Resolved**: Your initial unease arose because prior convictions *feel* individual, but their use as a blanket proxy (without engaging evidence) converts them into a *de facto* group trait (ex-offenders). CCA captures this by emphasizing obstruction of context evidence.

  ---

  ### **Precision Notes**
  1. **"Group"** includes socially salient identities (race, gender, disability) *and* constructed categories (e.g., "addicts," "ex-cons") when used prejudicially.  
  2. **"Available evidence"** must be reasonably accessible (e.g., CCTV, medical scans, artwork). No obligation to pursue impractical verification.  
  3. **Wrongfulness** combines epistemic failure (poor truth-tracking) and ethical harm (denial of agency + systemic impact).  

  This framework rejects slogans like "believe marginalized groups" by demanding contextual evidence-assessment. It acknowledges that even group-based discounting *can* be valid (e.g., distrusting a cult leader’s financial advice to members) but only when all three criteria are met. Your verdicts, revised in Case 5, now cohere.
