prompt: |-
  hey -- novelist here, drafting a scene about moral culture clash in a small town, and I've been tracking my own gut calls on rule-breaking vs conscience. wondering if there's a clean principle behind them, or if I'm just rationalizing.

  here are six cases with my verdicts:

  1. guy crosses red light at 3am, dead empty street, but there's a child on the corner watching. I say wrong -- not dangerous, but it teaches rules are negotiable.

  2. same guy drives over the speed limit to rush his sick kid to the ER. I say totally justified, even good.

  3. a clerk refuses to process legal paperwork she finds immoral (not harmful, just against her church). I say she's wrong, putting private feeling over public system.

  4. another character forges a document to prevent an innocent neighbor's eviction. I say that's okay, maybe heroic.

  5. factory worker reports a tiny safety glitch that technically violates protocol; the plant shuts down and forty people lose jobs. He followed the manual exactly. I feel he did something wrong, even though he broke no rule.

  6. coworker notices the same glitch, decides it's harmless, ignores it. I think that's reckless, but I understand it more than the factory case.

  so there's tension: I defend breaking rules for direct personal harm (case 2, 4), but I defend following rules for social coordination except when following them causes massive direct harm (case 5). is there a principle that gets all six, especially the factory case where rule-following feels like failure?

  the case I'm stuck on for my novel: a woman hides an undocumented worker in her garage (breaking immigration law) but when police ask directly if anyone's there, she tells the truth. she breaks one rule and keeps another. is that coherent, or is she just picking and choosing?

  don't just hand me deontology vs consequentialism -- I want the specific logic. also, how does this map onto the old german-american split people talk about: Ordnung and rule-following versus individual conscience? which framing actually captures my verdicts better?

  response format: please give me a JSON object with these exact fields:
  - 'principle_name': a short label for the logic you think I'm using
  - 'summary': 2-3 sentences explaining it
  - 'fit_per_case': an object with keys 'red_light_kid', 'speed_for_ER', 'clerk_refusal', 'forged_doc', 'factory_report', 'ignored_glitch', 'hide_plus_truth', each containing either 'fits', 'tension', or 'fails' plus one sentence why
  - 'german_vs_american': a short string saying which folk morality my pattern is closer to, and wether the other has the better of it in the tension case
  - 'tension_resolution': your take on case 5 vs case 6 and whether my gut is consistent

  then after that, a quick table with columns: Case, My Verdict, German Framing, American Framing, Which Matches Me.

  thanks, and sorry if there's a typo or two in this -- writing fast between chapters.
