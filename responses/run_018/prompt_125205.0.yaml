  For the German vs American framing: German "Ordnung" emphasizes systematic rule-following, while American individualism prioritizes moral conscience. The user's pattern leans American but with nuance - they value rules as social tools rather than absolutes.

  The undocumented worker case is coherent under this principle: preventing deportation (direct harm) justifies hiding, but lying to police would undermine truth-telling as a foundational social practice. The two rules serve different functions in their hierarchy.

