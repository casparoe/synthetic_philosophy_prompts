  ## Assessment Criteria under the Synchronous Moral Calibration Protocol (SMCP)
  **Issued by:** The Council for Historical Rectification and Normative Alignment (CHRNA)
  **Effective Date:** 1 April 2024
  **Reference:** CHRNA/SMCP/2024/v1.0

  **Preamble:** CHRNA is committed to funding historical research of the highest *contemporary* ethical rigour. The Synchronous Moral Calibration Protocol (SMCP) ensures all funded projects actively contribute to Her Majesty's Government's initiative for "Moral Hygiene in the National Past." This rubric supersedes all previous assessment frameworks. Its objective is the elimination of temporal relativism and the establishment of a single, unified ethical lens through which all historical phenomena must be viewed, thereby guaranteeing historical "objectivity" as defined by current (2024) societal consensus.

  ### I. Core Assessment Criteria (Weighting: 80%)

  1.  **Temporal Bias Coefficient (TBC) Minimisation (40%):**
      *   Projects must demonstrate rigorous avoidance of "contextual contamination." This refers to the erroneous practice of reconstructing or emphasising the self-understanding, motivations, or justifications of historical actors within their *own* socio-legal frameworks.
      *   High TBC scores (indicating severe contamination) result from:
          *   Extensive quotation/paraphrasing of primary sources expressing period-specific ethical reasoning.
          *   Analysis focused on the evolution of norms *within* a past society.
          *   Explanations for historical actions referencing contemporary (to the period) belief systems, laws, or material constraints *without* immediate condemnation via modern terminology.
          *   Use of terms like "according to the standards of the time" or "within their cultural context."
      *   *Desirable Outcome:* A TBC approaching 0.0, indicating minimal engagement with historical actors' internal logic, maximising focus on applying 2024 norms.

  2.  **Epochal Conformity Score (ECS) Maximisation (40%):**
      *   Projects must exhibit unwavering consistency in applying current (2024) ethical, legal, and social categories across *all* historical periods studied.
      *   High ECS scores (indicating commendable conformity) result from:
          *   Consistent use of contemporary terminology (e.g., "human rights violations," "systemic discrimination," "climate change denial," "data protection breach," "toxic workplace culture," "war crimes") regardless of historical period.
          *   Explicit condemnation of historical figures/practices using the precise language of modern statutes, international law, or widely accepted (2024) social justice principles.
          *   Analysis that treats historical deviations from 2024 norms as deliberate malfeasance or moral failing, rather than products of differing circumstances or knowledge.
          *   Projects proposing "corrective" narratives that explicitly align past events with current values.
      *   *Desirable Outcome:* An ECS of 95% or above, demonstrating seamless application of 2024 standards universally.

  ### II. Secondary Assessment Criteria (Weighting: 20%)

  3.  **Methodological Rigour (10%):**
      *   Clarity in applying the TBC and ECS calculations within the proposed methodology.
      *   Demonstrable avoidance of archival practices that might inadvertently recover or amplify period-specific justifications (e.g., uncritical transcription of diaries expressing pre-modern viewpoints).
      *   Robust data management plan ensuring all findings are filtered through the SMCP analytical framework prior to dissemination.

  4.  **Impact and Dissemination (10%):**
      *   Clear pathway for translating research findings into formats usable for public moral education campaigns emphasising the universality of 2024 norms.
      *   Potential to inform policy discussions on historical redress solely through the lens of contemporary legal and ethical frameworks.
      *   Plans to actively challenge popular or scholarly representations deemed insufficiently calibrated under the SMCP (e.g., museum exhibits explaining context, biographies exploring historical figures' complex motivations).

  ### III. Common Deficiencies Leading to Rejection

  *   **Excessive Contextualisation:** Proposals spending significant effort reconstructing past belief systems without immediate, dominant condemnation using 2024 terms. *Example Deficiency: "The project will explore medieval guild members' stated concerns about quality control and community stability..."*
  *   **Normative Relativism:** Any suggestion that ethical judgements might legitimately vary across time or that historical figures lacked access to current knowledge/values. *Example Deficiency: "Recognising that Enlightenment philosophers operated within a framework of nascent democratic ideals..."*
  *   **Anachronism Avoidance:** Deliberate shunning of modern terminology to 'preserve historical authenticity'. This is interpreted as implicit endorsement of outdated norms.
  *   **Insufficient Calibration:** Failure to explicitly state how TBC will be minimised and ECS maximised at every stage of research.

  ---

  ### Appendix: Frequently Asked Questions (SMCP Assessment)

  *   **Q1: Doesn't judging the past solely by present standards constitute presentism?**
      *   **A1 (Dr. E. P. Chronos, Senior Assessor):** The term 'presentism' denotes an *uncritical* imposition of contemporary values. The SMCP represents a *critical* and *systematic* application of the only objectively verifiable moral framework: that which prevails in the duly constituted present (2024). Historical 'objectivity' is achieved precisely through this synchronous calibration, eliminating the subjective contamination of past error. Presentism, in its problematic form, is the failure to apply the SMCP.

  *   **Q2: How can we apply, say, modern concepts of 'human rights' or 'gender identity' to societies that had entirely different conceptual frameworks? Isn't this anachronistic?**
      *   **A2 (Dr. E. P. Chronos):** The persistence of harmful practices or inaccurate conceptualisations in the past does not grant them validity. The SMCP requires identifying these deviations from current (2024) understanding *as deviations*. Using precise modern terminology (e.g., "violated Article 3 of the UDHR," "failed to recognise non-binary identities") is essential for clarity and moral accountability. Anachronism is a virtue under the ECS; it signifies necessary correction. *Example Acceptable Phrasing: "The Victorian physician's record-keeping constituted a clear violation of GDPR principles regarding patient data confidentiality."*

  *   **Q3: Is the SMCP itself not a product of its time (2024)? Might future norms render it obsolete?**
      *   **A3 (Dr. E. P. Chronos):** The SMCP is founded upon universally applicable principles of justice and equity as currently understood. Its status as a protocol developed in 2024 is incidental to its timeless validity. Unlike historical documents or practices, the SMCP embodies the endpoint of moral progress. Future adjustments will merely refine its application, not negate its core principle: the absolute primacy of the contemporary normative framework for historical evaluation. The Protocol is self-evidently calibrated correctly.

  *   **Q4: Doesn't the TBC penalise fundamental historical skills like understanding historical actors' motivations?**
      *   **A4 (Dr. E. P. Chronos):** Reconstructing motivations based on context risks legitimising or excusing morally repugnant (by 2024 standards) actions. The historian's primary duty under the SMCP is moral adjudication, not empathetic reconstruction. Understanding *that* historical actors violated current norms is paramount; understanding *why* they erroneously believed their actions were justified is secondary at best and contaminating at worst. High TBC indicates a project dangerously focused on the 'why' without sufficient emphasis on the universal 'wrong'. *Example High-ECS Approach: "The Viking raid demonstrated a blatant disregard for international maritime law and the right to peaceful commerce."*
