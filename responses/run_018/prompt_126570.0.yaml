answer: |-
  Your intuitions reveal a profound coherence around a principle I'll call **Integrated Process Continuity (IPC)**. This principle unifies your judgments by emphasizing the necessity of a *singular, unbroken causal process* that maintains psychological integration within a *single spatiotemporally continuous substrate*. Let's break down how IPC explains your cases and addresses your unresolved scenarios:

  ### Core Principle: Integrated Process Continuity (IPC)
  A person persists if and only if:
  1.  **Singular Integrating Mechanism:** There exists one primary physical system functioning as the *unified locus of consciousness and psychological integration* at any given time.
  2.  **Unbroken Causal Chain:** Each moment of consciousness and psychological state is causally dependent (in a direct, non-branching way) on the immediately preceding state *within that same integrating mechanism*.
  3.  **Spatiotemporal Contiguity:** The integrating mechanism maintains physical continuity (gradual replacement of parts is permissible, but the *functional core* as a unified entity persists in spacetime without replication or simultaneous branching).

  ### Applying IPC to Your Cases
  1.  **Gradual Replacement (Persistence):**
      *   **IPC Explanation:** A single integrating mechanism (the brain/emerging synthetic system) exists continuously. Each new synthetic unit is incorporated *into the ongoing process* of the existing mechanism. Causal dependence flows uninterrupted *within the same system*. Spatiotemporal contiguity is maintained.

  2.  **Overnight Copy (Non-Persistence):**
      *   **IPC Explanation:** Two distinct integrating mechanisms exist simultaneously (original brain, new synthetic copy). The copy's initial state depends causally on the *scanning event*, not the *ongoing conscious process* of the original. Spatiotemporal contiguity is broken; a new mechanism is instantiated elsewhere/in a new substrate. The original persists in suspension because *its* integrating mechanism remains intact (though dormant).

  3.  **Incremental Replacement with Destruction (Persistence):**
      *   **IPC Explanation:** Identical to case 1. There is only ever *one* active integrating mechanism. The destruction of biological tissue is merely the removal of support for parts already functionally superseded *within the ongoing process* of the single mechanism.

  4.  **Remote Server Build-Up (Non-Persistence - according to IPC):**
      *   **IPC Explanation:** Here lies the conflict. *During the year:*
          *   **Original Elias:** Maintains a singular integrating mechanism (his biological brain) with unbroken causal continuity.
          *   **Server-Model:** Is being *constructed* based on transmissions. It is *not* the system generating Elias's current experiences; it's a *separate* system building a *model* derived from those experiences. It lacks its own integrated consciousness *as Elias* during this period. Its causal chain is derivative and delayed, not direct.
      *   **At Switchover:** The original mechanism is destroyed. The server-model is activated. Its initial state is causally dependent on the *final transmission* and its own construction process, **not** on the immediately preceding state of Elias's consciousness *as experienced within his integrating mechanism*. A new integrating mechanism (the server-model) begins operating. This breaks both the unbroken causal chain *within the original mechanism* and spatiotemporal contiguity. IPC judges this as the *death* of Elias and the *birth* of a distinct, psychologically continuous entity. Your conflicting intuition likely arises from the *functional equivalence* and *causal derivation*, but IPC prioritizes the *singular, unbroken process*.

  5.  **Simultaneous Split (Non-Persistence):**
      *   **IPC Explanation:** This creates *two* distinct integrating mechanisms simultaneously. Each has only partial causal derivation from the original and neither sustains the *singular* integrating process that constituted Elias. Branching occurs. Both are successors, neither *is* Elias.

  ### Resolving the Paused Substrate Case (IPC Prediction)
  *   **Scenario:** Elias's fully synthetic substrate is paused for ten years and resumed with perfect fidelity. No psychological continuity spans the interval.
  *   **IPC Verdict: Non-Persistence.**
      *   **Reasoning:** The pause destroys the *unbroken causal chain* of integrated consciousness *within the singular mechanism*. The integrating mechanism ceases to function entirely. Upon resumption, a *new* causal chain begins, initiated by the restart event. While the new chain starts from an identical state, it lacks *direct, unmediated causal dependence* on the pre-pause states *as part of the same continuous process*. The spatiotemporal contiguity of the *process* is shattered by the decade-long cessation. IPC sees this as the *end* of Elias's conscious existence at pause and the *creation* of a new, identical being upon restart.

  ### Simplification: Which Judgment to Overturn?
  IPC provides a powerful, elegant framework that validates *most* of your strong intuitions (gradual replacement, overnight copy rejection, split rejection, paused substrate rejection). The one judgment it *requires* you to overturn for consistency is your *hesitant acceptance* of the **Remote Server-Model as Elias**.

  *   **Why Overturn This One?**
      1.  **Coherence:** It's the outlier preventing a fully unified principle. Accepting the server-model as Elias contradicts the core requirement of a *singular integrating mechanism* and *unbroken causal chain within it* that explains your rejection of the overnight copy and split cases.
      2.  **Preserving Key Intuitions:** Overturning the overnight copy judgment (accepting the copy as Elias) would force you to accept the split copies as *both* being Elias, which you firmly reject. Overturning the split rejection is equally unpalatable. The paused substrate case also strongly suggests discontinuity matters.
      3.  **Philosophical Payoff:** Rejecting the remote server-model reinforces the significance of *embodied process* over mere information transfer. It emphasizes that identity is tied to the specific, ongoing, *singular* physical realization of consciousness, not just the pattern or its causal history in a broader sense. This aligns well with the embodied, experiential nature of your novel's focus.
      4.  **Narrative Resonance:** Elias's struggle is against disintegration. IPC, which demands continuous integration within a single locus, makes his persistence a hard-won victory against the forces of duplication, branching, and cessation. The remote server represents a *different kind* of threat – replacement by derivation rather than continuity. Recognizing it as a *new* entity underscores the fragility and preciousness of the continuous self.

  ### Conclusion
  Your intuitions powerfully converge on **Integrated Process Continuity (IPC)**. Elias persists only if his consciousness is sustained by a single, spatiotemporally continuous physical system that integrates his psychology moment-to-moment in an unbroken causal chain. Gradual replacement preserves this; simultaneous copying, branching, cessation, or remote derivation breaks it.

  Overturn your hesitant judgment on the remote server-model. This sacrifice yields a coherent, elegant principle: **Elias survives only if *he*—the continuous process anchored in one integrating mechanism—is the thing being gradually transformed, not copied, branched, stopped, or remotely reconstructed.** This principle powerfully serves the philosophical depth of your novel, grounding Elias's identity in the relentless, unified flow of his embodied consciousness through time.
