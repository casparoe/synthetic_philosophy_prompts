answer: |-
  ## Dissertation Chapter Proposal: The Diachronic Foundations of Coherence Arguments for Expected Utility

  **Title:** Synchronic Coherence, Diachronic Agency, and the Independence Axiom: A Taxonomy of Money-Pump Arguments

  **1. Core Research Question & Hypothesis:**
  The central question is: **Do all money-pump arguments for the core axioms of expected utility (EU) theory rely *solely* on synchronic coherence constraints, or do arguments for the Independence Axiom inherently require distinct, irreducible norms of diachronic agency?**

  *   **Precise Hypothesis:** Money-pump arguments enforcing basic preference coherence (Completeness, Transitivity - axioms sufficient for a *utility* function) operate *synchronically*: they exploit fixed preferences over known outcomes without requiring new information mid-sequence. In contrast, money-pump arguments enforcing the *Independence Axiom* (necessary for *expected* utility maximization) operate *diachronically*: they crucially exploit the sequential revelation of information (e.g., chance event resolution) between choice stages, thereby implicating norms governing how earlier selves should constrain or plan for the choices of later selves in light of anticipated information.
  *   **Determinate Answer Conditions:**
      *   **Hypothesis Supported:** If a) all Independence-pumps demonstrably require an information-revealing event mid-sequence, b) no synchronic pump exists for Independence (i.e., one working on fixed preferences without information change), and c) the normative force of the diachronic pump depends on a principle (like a planning norm) not derivable from synchronic coherence alone.
      *   **Hypothesis Refuted:** If a) a valid synchronic money-pump for Independence is constructed (fixed preferences, no info change), or b) the diachronic structure of Independence-pumps can be fully reduced to a synchronic inconsistency revealed *over time* without invoking distinct planning norms, or c) the identified diachronic structure is *not* unique to Independence-pumps but applies equally to Transitivity-pumps.

  **2. Why Existing Positions Leave the Question Open:**
  *   **The Representation Theorem Advocate:** Representation theorems elegantly show that satisfying the axioms is *equivalent* to having preferences representable as EU maximization. However, they are *static* formal results. They do not address the *rational force* of avoiding *dynamic exploitation* or *why* violating the axioms leaves one vulnerable *in sequential choice contexts*. The vulnerability revealed by pumps, and its *structure*, is the normative heart of the argument for many, which the theorems themselves are silent on.
  *   **The "Merely Heuristic" Skeptic:** Dismissing pumps as mere intuition pumps ignores their potential as *reductio ad absurdum* arguments revealing genuine inconsistency leading to foreseeable loss. The question of *what kind of inconsistency* is revealed (synchronic vs. diachronic) and *what norms* are violated (static coherence vs. planning obligations) is substantive. If the Independence-pump uniquely relies on diachronic norms, this challenges the idea that EU maximization is justified *purely* by synchronic coherence.

  **3. Methodology (Armchair Project Plan):**
  *   **Months 1-2: Taxonomy Construction & Formalization:**
      *   Systematically catalog canonical money-pump arguments for each key axiom (Transitivity, Independence, others like State/Outcome Independence if relevant).
      *   Develop a formal schema for describing pumps: specify the agent's preferences at the outset, the sequence of choices offered, the informational state at each choice node (specifically, whether new non-epistemic information - e.g., chance event outcome - is revealed between choices), and the resulting net loss.
      *   **Key Non-Example-Based Method:** Analyze the *structural requirements* for each pump type. For Transitivity (cycle): Does it logically *require* information change? (No). For Independence: Can the argument proceed *without* the agent learning new information relevant to the initial gambles between choices? (Attempt proofs by contradiction; define "relevant information" carefully).
  *   **Months 3-4: Independence Pump Focus:**
      *   Deep dive into existing and novel Independence-pump constructions (e.g., standard two-stage pumps exploiting preference reversals). Rigorously map the information flow and choice sequence.
      *   Attempt to construct a purely synchronic Independence-pump. Document failures and analyze *why* they fail.
      *   Precisely identify the point where the pump exploits the *interaction* between changing information and the initial preferences violating Independence.
  *   **Months 5-6: Normative Analysis - The Diachronic Leap:**
      *   Analyze the normative principle violated in the diachronic Independence-pump. Is it simply "inconsistency over time" (which might be reducible to synchronic error) or a distinct norm like: "Avoid plans foreseeably leading to dominated outcomes" or "Be resolute in executing chosen plans"?
      *   Investigate whether this norm can be derived solely from synchronic coherence constraints (e.g., via sophisticated choice) or requires independent justification.
      *   Compare/contrast with the norm violated in synchronic pumps (pure inconsistency at a time).
  *   **Months 7-8: Broader Implications & Challenges:**
      *   Explore if other axioms require diachronic pumps. Does Completeness? State Independence?
      *   Consider counterarguments: Can sophisticated choice "solve" the Independence-pump without EU? Does this undermine the need for a distinct norm? Analyze the normative status of sophisticated choice itself.
      *   Examine connections to debates on consequentialism vs. resolute choice.
  *   **Months 9-10: Drafting & Refinement:**
      *   Structure the chapter: Introduction, Taxonomy & Formal Schema, Synchronic Pumps (Transitivity), Diachronic Pumps (Independence), Normative Analysis (Synchronic vs. Diachronic Rationality), Implications for EU Foundations, Conclusion.
      *   Refine arguments, address potential counterexamples, ensure precise terminology.
  *   **Months 11-12: Revision & Integration:**
      *   Incorporate feedback (advisor, peers), finalize chapter draft.
      *   Ensure clear articulation of the contribution: a structural distinction within coherence arguments with normative implications for the foundations of EU theory.

  **4. Range of Possible Conclusions & Deciding Factors:**
  *   **Conclusion 1 (Strong Support):** A clear, exhaustive taxonomy emerges: Synchronic Pumps = Basic Coherence (Transitivity); Diachronic Pumps = Expected Utility (Independence). The diachronic pump relies on an irreducible planning norm (e.g., dominance over plans). *Deciding Factors:* Failure to find any synchronic Independence-pump; demonstration that avoiding the diachronic pump requires accepting the planning norm, which cannot be derived from synchronic coherence alone.
  *   **Conclusion 2 (Weaker Support):** The taxonomy holds structurally, but the diachronic norm *is* derivable from sophisticated choice, which is itself grounded in synchronic coherence (e.g., consistent extension of preferences to plans). *Deciding Factors:* Successful reduction of the planning norm to sophisticated choice, and successful grounding of sophisticated choice in synchronic principles.
  *   **Conclusion 3 (Refutation):** A valid synchronic pump for Independence is constructed, collapsing the taxonomy. *Deciding Factor:* Existence of such a pump.
  *   **Conclusion 4 (Taxonomy Failure):** The synchronic/diachronic distinction is not exhaustive or cleanly maps to the axioms (e.g., some Transitivity pumps might be framed diachronically; some other axiom requires a third type). *Deciding Factors:* Discovery of pumps that don't fit the binary classification or map inconsistently to axioms.
  *   **Conclusion 5 (Normative Reduction):** The apparent need for a distinct diachronic norm is illusory; the "exploitability" in the Independence-pump reveals a synchronic inconsistency manifested dynamically. *Deciding Factors:* Successful argument showing how the vulnerability stems solely from preferences held at t0 that are inconsistent *at t0* when considering the whole sequential scenario.

  **5. Criteria for Project Failure:**
  The project would fail to support its core hypothesis if:
  1.  **Taxonomy Not Exhaustive/Robust:** The synchronic/diachronic distinction proves messy, arbitrary, or fails to cleanly categorize key pumps (especially for Independence), undermining the central claim.
  2.  **Diachronic Norm Reducible:** The planning norm identified as crucial for diachronic pumps is convincingly shown to be derivable solely from synchronic coherence requirements (e.g., via sophisticated choice as a synchronic constraint on plans), negating the "irreducible" claim.
  3.  **Synchronic Pump Found:** A valid money-pump for the Independence Axiom is constructed that operates without any informational change mid-sequence, directly refuting the hypothesis.
  4.  **Lack of Novelty:** The distinction, while perhaps implicit, is already well-established and analyzed in the literature, rendering the central contribution redundant.
  5.  **Inconclusive Normative Analysis:** The analysis of the required norm becomes bogged down in irresolvable meta-normative debates, failing to clearly establish whether it is distinct and irreducible.

  **6. Scope Limitations & Prioritization:**
  *   **What Makes it Too Big:** Comprehensively covering *all* decision-theoretic axioms, *all* variants of money-pumps (e.g., infinite pumps), *all* nuances of diachronic agency (e.g., hyperbolic discounting), or deeply resolving the *philosophical foundations* of planning norms within a year is unrealistic.
  *   **Prioritization & Cuts:**
      *   **Focus:** Primarily on Transitivity (paradigm synchronic) vs. Independence (paradigm diachronic). Other axioms (Completeness, Continuity) will be addressed only if directly relevant. State/Outcome Independence might be a secondary example if time permits.
      *   **Cut First:** Deep dives into alternative decision theories (e.g., rank-dependent) unless essential for a counterexample; extensive discussion of infinite pumps; comprehensive historical analysis of authorial intent behind classic pumps; detailed engagement with tangential debates in personal identity or meta-ethics concerning agency.

  **Contested Claims vs. Settled Structure:**
  This section distinguishes settled formal results from live philosophical debates relevant to the proposal's context.

  *   **Settled (Formal Structure):**
      *   Representation theorems show the *mathematical equivalence* between satisfying specific axiom sets (e.g., Savage, von Neumann-Morgenstern) and having preferences representable as maximizing expected utility.
      *   Specific money-pump constructions *logically demonstrate* that violating axiom X (e.g., Transitivity, Independence) *can* lead to a sequence of acceptable trades resulting in a net loss under specified conditions (e.g., myopic choice, specific information revelation).
      *   Sophisticated choice and resolute choice are *formally defined* strategies for sequential choice under uncertainty.

  *   **Genuinely Contested:**
      *   **Normative Force of Money-Pumps:** Is exploitability itself a *sufficient* criterion for irrationality? Or are pumps merely illustrative, with the real force coming from representation theorems or other considerations? (Contested: e.g., advocates of "ecumenical" views vs. skeptics).
      *   **Dynamic Arguments & Consequentialism:** Can dynamic choice arguments (like money-pumps) definitively *undermine* or *support* consequentialism (the principle that only outcomes matter)? Does resolute choice violate consequentialism? (Hotly contested: e.g., McClennen vs. Hammond vs. Machina).
      *   **Independence of Planning Norms:** Are norms like "avoid foreseeably dominated plans" or "be resolute" *derivable* from synchronic coherence (e.g., sophisticated choice as rational) or do they represent *fundamentally different* requirements of rational agency? (Core to the thesis; deeply contested).
      *   **Sophistication as Rational Requirement:** Is sophisticated choice (planning to future choices based on predicted future preferences) the *only* rational response to potential dynamic inconsistency, or is resolute commitment sometimes permissible or even required? (Contested: e.g., McClennen vs. Rabinowicz).
      *   **Scope of Coherence:** Is "rationality" exhausted by coherence (synchronic and diachronic) and instrumental efficiency, or are there further substantive requirements? (Broader meta-contest affecting interpretation).

  **Closing:** This chapter aims to provide a novel structural analysis of coherence arguments, arguing that the path to *expected utility* maximization via money-pumps uniquely traverses contested terrain in diachronic agency. By rigorously establishing a taxonomy based on informational dynamics and isolating the normative demands of Independence-pumps, it challenges the view that EU maximization is secured by synchronic coherence alone and clarifies the philosophical work required to ground this central tenet of rational choice theory. The deliverable will be a journal-ready chapter establishing the taxonomy and probing its normative implications.
