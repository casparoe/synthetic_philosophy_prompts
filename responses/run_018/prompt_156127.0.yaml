  The bifurcated regulatory practice you describe rests on an **implicit hybrid theory** combining **tractability constraints**, **epistemic limitations**, and **conservative neurobiological thresholds**, with inconsistent weight given to formal sentience recognition. Below is a reconstruction with confidence assessments and implications for reform:

  ### Implicit Philosophical Commitments
  1. **Neurobiological Threshold for Moral Consideration (Medium Confidence: 70%)**  
     Standards implicitly require a **vertebrate-like centralized brain** (e.g., telencephalon) for "full" welfare protections. Salmonids possess clearly analogous pain-processing structures (e.g., nociceptors, opioid responses), while decapod ganglia are deemed insufficiently "familiar." This persists despite evidence of decapod nociception, complex avoidance learning, and stress-induced physiology (e.g., serotonin release in shrimp). The UK Sentience Act’s inclusion of decapods directly challenges this but hasn’t updated operational standards, suggesting the commitment is deeply institutionalized.

  2. **Epistemic Access via Human-Legible Suffering (High Confidence: 85%)**  
     Welfare rules prioritize **behaviorally observable distress** (e.g., fish vocalizations, escape attempts). Decapod suffering is often cryptic: shrimp freeze rather than vocalize; crabs may autotomize limbs silently. Auditors lack standardized metrics for invertebrate stress (unlike fish cortisol tests). Retail lobster bans target **graphic, easily recognized suffering** (boiling movement), making it epistemically accessible. Farming exclusions reflect the difficulty of "reading" decapod welfare in opaque industrial systems.

  3. **Tractability as De Facto Boundary (High Confidence: 90%)**  
     Key regulations (e.g., stunning, density limits) are **technologically or economically nonviable for decapods**:
     - **Stunning**: Electrical/percussive methods for fish are scalable; no validated, cost-effective methods exist for mass crustacean stunning.
     - **Density Metrics**: Fish stocking uses weight/volume ratios; decapod territoriality and cannibalism require complex behavioral assessments.
     - **Auditing**: Salmon welfare indicators are established; decapod auditing lacks consensus protocols.  
     Retail lobster bans impose negligible costs (alternative killing is easy), while reforming aquaculture would disrupt supply chains.

  ### Coherence and Compatibility
  - **Incoherence with Sentience Recognition (High Confidence)**: Legally acknowledging decapod sentience (UK Act) while excluding them from welfare frameworks is logically inconsistent. It suggests sentience recognition is **symbolic** without operational obligations, creating a "moral schism" where legal status doesn’t trigger protection.
  - **Compatibility with Rival Theories**: The practice is **compatible with pluralistic pragmatism** (prioritizing feasible interventions) but **incompatible with strict capacity-based egalitarianism** (equal consideration for equal suffering). It aligns with:
    - **Institutional Consequentialism**: Maximizing welfare gains within tractable domains.
    - **Anthropocentric Scaffolding**: Protecting animals only when human empathy is easily mobilized (e.g., visible retail suffering).

  ### A Uniform Capacity-Based Policy: Required Changes
  A policy consistent with decapod sentience evidence would necessitate:

  | **Practice**       | **Current Approach**                                | **Capacity-Based Reform**                                                                 |
  |--------------------|----------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Stunning**       | Required for salmonids; absent for decapods        | **Mandate R&D into decapod stunning** (e.g., electrical parameters for shrimp; cryoanesthesia for lobsters). Phase in requirements once effective methods are validated. |
  | **Stocking Density** | Fish-specific limits (e.g., ASC: max 25kg/m³)      | **Species-specific ethological standards**: Space for natural behaviors (e.g., burrowing for shrimp, shelter for crabs). Metrics based on aggression/injury rates, not weight. |
  | **Auditing**       | Fish: cortisol, lesions, mortality. Decapods: none | **Develop decapod welfare indicators**: Hemolymph stress biomarkers (e.g., crustacean hyperglycemic hormone), cannibalism rates, shell-damage scoring. |
  | **Feed Withdrawal** | Regulated pre-slaughter for fish                  | **Adjust for metabolism**: Shrimp may require shorter fasting than fish; evidence-based timelines. |

  **Implementation Challenges**: Audits would require specialized training in invertebrate welfare assessment. Stunning technology R&D demands significant investment. Density rules must balance welfare with feasibility (e.g., extensive systems may replace intensive ponds).

  ### Least Certain Element
  **Why retail protections exist while farming exclusions persist** (Confidence: 50%).  
  I suspect this stems from **asymmetric public visibility** (retail suffering is visceral; hidden farming practices evade scrutiny) and **regulatory fragmentation** (food safety agencies vs. agriculture departments). However, the precise interplay of cultural psychology and institutional inertia here is ambiguous—lobbying dynamics or historical path-dependence could be equally decisive.

  This bifurcation ultimately presupposes that **moral obligations diminish when suffering is obscure or intervention costly**, even after sentience is acknowledged. A coherent capacity-based framework would collapse this hierarchy, demanding welfare investments proportional to evidenced sentience—not convenience.
