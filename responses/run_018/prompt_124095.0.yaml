prompt: |-
  You are a professional philosopher of ethics with experience teaching longtermist ideas to technically-minded audiences who are skeptical of metaphysical claims. Before you design anything, take a moment to brainstorm: list the three conceptual dependencies a student must grasp before Scheffler's claim about an afterlife stops sounding like mysticism, identify the single biggest misconception STEM-trained rationalists bring to discussions of extinction, and sketch one sentence that distinguishes collective meaning-dependence from simple altruism.

  I run a discussion session for a rationalist reading group—mostly software engineers and researchers with no formal philosophy background—on the idea that human extinction is bad partly because it destroys the collective future that gives our present projects meaning, not merely because of the deaths involved. I am not asking you to explain the idea to me. Instead, plan exactly how I should teach it in a ninety-minute session.

  First, specify the order in which the components must be introduced and why each depends on the prior one. Begin with the distinction between goods that are personal and goods that are collective or project-based. Then introduce the idea that the value of many present activities depends on an expected future in which successors continue them. Only after that is secured should you introduce the conjecture that we implicitly depend on a kind of collective afterlife—future generations carrying forward what matters to us now. Explain why reversing this order causes the audience to misinterpret the claim as religious or sentimental.

  Second, propose the one concrete carrying example that should anchor the entire session. I want to use a modified version of Scheffler's archivist scenario, reframed as an open-source cryptographer who spends years maintaining a protocol she knows will be orphaned within her lifetime if the broader development ecosystem collapses. Explain exactly what this example must have and what it must lack—specifically, why it should not involve any direct harm to her, and why it should involve a project she regards as valuable independently of her own survival. Also explain briefly why the standard archivist framing might fall flat with this particular audience.

  Third, map the misconceptions these readers will predictably form and the exact point in the sequence where each should be headed off. Include at least four: that the argument smuggles in religious belief in personal immortality; that it collapses into standard utilitarian population ethics; that it is merely an emotional appeal about sadness for unborn people; and that it requires accepting some mystical form of group consciousness. For each misconception, provide the single distinction or sentence that defuses it, and state precisely where in the sequence—before, during, or after the carrying example—it should be delivered.

  Fourth, design a check for understanding that demonstrates they have grasped the conceptual structure rather than just agreeing politely. The check should ask them to apply the idea to a scenario in which extinction is painless, distant in time, and involves no suffering, and to articulate why someone might still have reason to care, distinguishing that reason sharply from a utilitarian calculation of lost lives.

  Fifth, state clearly what should be openly refused at this level. I want you to name at least two bodies of technical material—such as the full logical structure of Parfit's non-identity problem and the formal literature on intergenerational justice in welfare economics—and to say explicitly that these should be set aside with a brief acknowledgment rather than explained.

  Please respond in American English. Think carefully, and begin with the brief dependency-chain outline before presenting the full teaching plan.
reasoning: |-
  Hmm, the user wants me to design a teaching plan for a discussion session about Scheffler's collective afterlife concept. They're part of a rationalist reading group with STEM backgrounds who are skeptical of metaphysical claims.

  I need to start by identifying three conceptual dependencies: First, students must grasp the distinction between personal goods (like individual happiness) and collective goods (like scientific progress). Second, they need to understand how present activities derive meaning from an expected future continuation. Third, they must recognize that this future-dependence creates a form of collective afterlife - not personal immortality, but the continuation of shared human projects.

  The biggest misconception STEM audiences bring is what I'd call "atomistic individualism" - the belief that all value reduces to individual experiences or preferences. This makes them miss how collective endeavors create meaning that transcends individual lifespans.

  For the teaching sequence, I'll start with personal vs. collective goods using examples from their world like open-source software. Then build to future-dependence by showing how current work assumes continuation. Only then introduce the "collective afterlife" as Scheffler's insight - reversing this would indeed make it sound mystical.

  The anchor example will be an open-source cryptographer maintaining a protocol she knows will die with ecosystem collapse. Crucially, it must show: (1) no direct harm to her (countering utilitarian readings), (2) project valued beyond her survival (highlighting meaning-dependence), and (3) ecosystem-collapse framing (more relatable than archives for tech audiences).

  For misconceptions: 
  - During the example, I'll preempt the "religious belief" worry by clarifying: "This is about the survival of projects, not souls." 
  - Before utilitarianism comparisons, I'll emphasize: "The issue isn't unmade people, but unmade meaning." 
  - When discussing emotional responses, I'll distinguish: "We're analyzing structural meaning-collapse, not sadness." 
  - Post-example, I'll counter "group consciousness" fears with: "Shared projects require no mystical unity - just actual continuity."

  The understanding check will use a painless, distant extinction scenario asking: "Why might the cryptographer care about protocol extinction centuries later, distinct from lives lost?" Correct answers should reference meaning-depletion in present actions.

  Finally, I'll explicitly table two technical areas: Parfit's non-identity problem and formal intergenerational welfare models. Acknowledge their existence but declare them out of scope to maintain focus on the phenomenological claim.
answer: |-
  Here’s your structured 90-minute teaching plan, optimized for STEM-skeptical rationalists. Begin with the dependency chain:

  **Conceptual Dependency Chain**  
  1. **Personal vs. Collective/Project-Based Goods**: Distinguish self-interested value (e.g., pleasure) from value embedded in shared endeavors (e.g., scientific progress).  
  2. **Future-Dependence of Present Meaning**: Show how *current* activities derive significance from the *expected continuation* of related future efforts.  
  3. **Collective Afterlife as Meaning-Sustaining**: Frame extinction as severing the future chain that gives present projects weight—**without this sequence, it sounds like spiritual immortality**.  

  ---

  ### **Full Teaching Plan**  
  **Total Time**: 90 minutes  

  #### **Phase 1: Foundations (25 mins)**  
  - **Personal vs. Collective Goods (10 mins)**  
    - *Example*: "Building a startup for profit (personal) vs. contributing to open-source Linux (collective)."  
    - *Why start here?* STEM audiences instinctively reduce value to individual utility. This forces recognition of project-embedded value.  
  - **Future-Dependence (15 mins)**  
    - *Bridge*: "Why does the Linux contributor care if development continues after she quits?"  
    - *Key insight*: Present effort assumes a future trajectory (e.g., code forks, documentation updates).  
    - *Why next?* Establishes temporal linkage without metaphysics.  

  #### **Phase 2: Anchor Example (20 mins)**  
  **The Open-Source Cryptographer**:  
  > *A developer maintains an open-source privacy protocol. She knows:  
  > (a) It will be obsolete in 50 years due to quantum computing,  
  > (b) Its survival *depends entirely* on a thriving ecosystem of cryptographers,  
  > (c) She values this project intrinsically—it’s her legacy to digital rights—even if she won’t live to see it used.*  

  **Critical Design Elements**:  
  - ✅ **Must have**:  
    - Explicit ecosystem dependence (e.g., "requires future devs to patch vulnerabilities").  
    - Intrinsic project value ("digital rights matter beyond my life").  
  - ❌ **Must lack**:  
    - Direct self-harm (no "she starves to maintain it"—avoids utilitarian framing).  
    - Sentimental attachment (emphasize *structural* role of future: "Without successors, her work is a dead-end").  
  - **Why standard archivist fails**: Tech audiences dismiss "archive stewardship" as low-stakes nostalgia. Cryptographic maintenance feels urgent and skill-dependent.  

  #### **Phase 3: Misconception Defusal (25 mins)**  
  Address these *during* the example discussion:  

  | Misconception | Defusal Sentence | Timing |  
  |---------------|------------------|--------|  
  | "This is religious immortality" | **"We’re discussing the survival of *projects*, not souls—no consciousness required."** | *Immediately after introducing "collective afterlife" term* |  
  | "Just disguised utilitarianism" | **"Utilitarianism counts lost lives; this counts the *collapse of present meaning* when future continuity vanishes."** | *When contrasting extinction with non-extinction scenarios* |  
  | "Emotional appeal about sadness" | **"The point isn’t that we’d *feel sad*, but that our current actions *rationally depend* on a future horizon."** | *If participants mention "sad unborn generations"* |  
  | "Requires group consciousness" | **"Shared projects need no mystical unity—only actual humans continuing activities *we initiated*."** | *After a participant implies "collective mind"* |  

  #### **Phase 4: Understanding Check (15 mins)**  
  **Scenario**: *Asteroid will painlessly erase humanity in 500 years. No suffering occurs.*  
  **Prompt**: "Why might our cryptographer oppose this? *Not* because of lost lives, but because of something her present work loses."  
  **Target Answer**: "Her maintenance work *today* becomes meaningless if no future cryptographers exist to inherit it—like writing software for hardware that will never exist."  
  - *Why this works*: Forces distinction between altruism (caring about future people) and meaning-dependence (caring about the future’s role in justifying current action).  

  #### **Phase 5: Explicit Omissions (5 mins)**  
  **State clearly**:  
  > "We are *not* engaging with:  
  > (1) **Parfit’s non-identity problem** (whether future people have moral claims),  
  > (2) **Formal intergenerational welfare economics** (discount rates, utility functions).  
  > These are important but distinct from Scheffler’s claim about *present meaning*."  

  ---

  **Why This Sequence Works**:  
  - **Dependencies honored**: Personal → collective → future-dependent → afterlife. Skipping steps invites "woo" accusations.  
  - **Tech-native example**: Cryptographic maintenance mirrors real open-source ethics, making collective effort visceral.  
  - **Preemptive strikes**: Misconceptions are halted *in situ* with razor distinctions.  
  - **Boundaries set**: Avoiding technical philosophy prevents derailment into population ethics.  

  **Final Tip**: If pressed on "why care about meaning?", pivot to *instrumental rationality*: "If your projects structurally require a future, denying that future undermines your own rational agency." This resonates with optimization-focused mindsets.
