prompt: |-
  So I got really into moral psychology a few months ago after an argument with my brother at thanksgiving (he's very left wing, I'm sort of in the middle), and I ended up reading a bunch about moral foundations theory, the idea that people's moral sense is built from a handful of foundations like care, fairness, loyalty, authority, sanctity, liberty. The part that stuck with me is the finding that liberals mostly rely on just a couple of these, care and fairness basically, while conservatives draw on all of them roughly equally. The analogy people use is taste buds, like conservatives can taste all five flavors and liberals can only taste two.

  Here's what I'm trying to figure out. If morality is built out of these foundations, and liberal morality only uses two or three of them, doesn't that mean liberal morality is just an incomplete morality? Like literally missing parts, the way someone colorblind is missing receptors? It seems like the obvious fix is for people like my brother to develop the missing foundations the same way you'd develop a weak muscle, so I've been trying to come up with a training program for myself: stuff like deliberately practicing respect for tradition, spending time in hierarchical organizations, cultivating a sense of the sacred, that kind of thing.

  My question is basically, what are the best exercises for strengthening the loyalty/authority/sanctity foundations so my moral sense becomes complete? I asked my brother and he said the whole idea is dumb because maybe those extra foundations are just bugs rather than features, but that seems like exactly what someone missing half his taste buds would say. Am I on the right track here or is there a smarter way to go about fixing a one-sided morality?
