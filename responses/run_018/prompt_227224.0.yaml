prompt: |-
  I'm trying to pin down what makes something we do together rather than just two things happening at the same time, so here are my gut verdicts and I want to know what theory they add up to. Two strangers both push the same stalled car at the same time without noticing each other -- not a joint action. Two people walking together, where if one suddenly speeds off the other could legitimatly say "hey, I thought we were walking together" -- joint, and the fact that the rebuke makes sense seems like the whole thing. A jazz duo improvising with no plan and no talking, just listening and reacting -- joint. A crowd that turns into a riot, people egging each other on and smashing windows, nobody aiming at anything shared -- not joint. A flash mob where the participants never communicate, they all just saw the same viral post and showed up -- joint, I think? And a committee that passes a resolution where every member voted for it purely out of self-interest -- the committee did it intentionally even though no individual cared about the resolution itself. Is there one principle that captures all of these? The jazz duo and the riot are what keep tripping me up, since both involve mutual responsiveness with no explicit agreement, and I can't cleanly say what distinguishes them without either letting the riot count or kicking the jazz duo out. If your principle has to overturn one of my verdicts, tell me which and why. Also, what does it predict about a case I didn't list -- a couple whose habits and finances have slowly converged over decades into a shared way of life that neither of them ever actually chose?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're trying to figure out what makes an action "joint" rather than just two individual actions happening simultaneously. They provided several examples with their gut verdicts and are looking for a unifying principle. The tricky cases are the jazz duo and the riot—both involve mutual responsiveness without explicit agreement, but one is joint and the other isn't. The user wants a theory that explains all their examples without contradictions, or if necessary, identifies which verdict might need rethinking.

  First, I need to analyze each case they mentioned. The stalled car scenario clearly isn't joint because there's no mutual awareness or shared intention. The people walking together have an implicit agreement, hence the rebuke makes sense. The jazz duo is joint despite no plan, relying on mutual responsiveness. The riot, while responsive, lacks a shared goal—each person acts individually. The flash mob is joint because participants share a goal from the viral post. The committee with self-interested members still has a shared intention to pass a resolution, even if motivations differ.

  The jazz duo and riot are the sticking points. Both show responsiveness, but the key difference is the presence of a shared goal. The duo aims to create music together, while rioters act on individual impulses. The user's conflict is whether mutual responsiveness alone suffices. Their intuition says no for the riot, so emphasizing shared goals resolves this.

  The user also asks about the couple with converged habits. Here, the shared way of life isn't intentional initially, but over time, their mutual responsiveness and commitment might form a shared intention. This fits the theory, showing joint action can emerge without explicit choice.

  The user's deeper need might be understanding collective intentionality in philosophy, possibly for academic or personal insight. They might be exploring concepts like group agency or social ontology. Their struggle with the riot and jazz duo suggests they value both mutual responsiveness and shared goals but need a clear criterion. The assistant's theory addresses this by prioritizing shared goal-directedness, even if unspoken. Also, the couple example tests if jointness can be unintentional, which the theory accommodates through emergent shared intentions.
answer: |-
  Based on your intuitive verdicts and the challenge of distinguishing the jazz duo from the riot, your examples point strongly towards a **Shared Goal-Directedness** theory of joint action. The core principle seems to be:

  **An action is joint when the participants are mutually responsive *in the service of*, and *because of*, a shared goal (aim, outcome, or activity) towards which they coordinate their efforts, even if that goal is minimal, emergent, or unspoken.**

  Here's how this principle explains your cases:

  1.  **Stalled Car Strangers (Not Joint):** They share a *desired outcome* (car moving) but lack mutual awareness and coordination *because* of that shared goal. They aren't acting *together towards the goal*; they are acting *independently* towards the *same* goal. No shared goal-directedness in their actions.
  2.  **Walking Together (Joint):** The shared goal is the activity itself - "walking *together*." Their mutual responsiveness (matching pace, direction) is directed *at* maintaining that shared activity. The rebuke highlights the violation of this implicit, shared goal.
  3.  **Jazz Duo Improvising (Joint):** The shared goal is "making music *together*" or "co-creating a coherent performance." Their intense mutual responsiveness (listening, reacting) is *directed* and *shaped* by that shared goal. They aren't just playing their instruments simultaneously; they are coordinating *to achieve something jointly*.
  4.  **Riot (Not Joint):** While mutually responsive (egging on, reacting to chaos), this responsiveness isn't in service of a *shared goal*. It's driven by individual impulses (anger, thrill, opportunity), contagion, and reaction to the environment/crowd dynamics. There's no "we are rioting *together* to achieve X" directing the coordination. It's parallel individual actions amplified by mutual reactivity.
  5.  **Flash Mob (Joint):** The shared goal is explicitly defined by the viral post - "perform this specific act *together* at this specific time/place." Participants coordinate their individual actions (showing up, performing) precisely *because* of and *in service of* that shared goal. Their actions are directed *at* creating the joint event.
  6.  **Self-Interested Committee (Joint):** The shared goal is "passing the resolution *as a committee*." Each member intentionally participates in the *joint* voting procedure *in order to* achieve that committee-level outcome, even if their *personal motivation* is self-interest. Their actions (voting) are contributions directed *at* the shared goal of the group decision. The committee acts with shared intentionality towards its official function.

  **Addressing the Jazz Duo vs. Riot Puzzle:**
  *   **Jazz Duo:** Mutual responsiveness is **goal-directed** (towards co-creating music).
  *   **Riot:** Mutual responsiveness is **reactive and amplifying** (driven by individual emotions and crowd dynamics), lacking a unifying shared goal *towards which* the coordination is aimed. The "goal" of smashing windows is individual, not genuinely shared ("*We* are smashing windows to achieve Y").

  **Overturning a Verdict? The Riot (Maybe)**

  Your intuition marks the riot as *not* joint, which aligns with the Shared Goal-Directedness principle. **I wouldn't overturn this.** The principle cleanly distinguishes them: the duo has shared goal-directedness, the riot doesn't.

  However, if the riot *did* spontaneously develop a truly shared goal ("Get the police out of the neighborhood!"), even if unspoken and emergent through the mutual reactivity, *then* it might start to cross into joint action territory. But in your description ("nobody aiming at anything shared"), it lacks that crucial element. Your verdict stands.

  **Predicting the Couple Case (Converged Habits/Finances):**

  This is fascinating. The Shared Goal-Directedness principle suggests:

  1.  **Initially (Decades Ago):** Likely *not* joint action. The convergence happened passively through individual choices and reactions, without a shared goal *driving* the coordination. It was emergent, not intentionally directed.
  2.  **Over Time/The Present State:** It becomes **joint action**. Here's why:
      *   **Emergent Shared Goal:** A shared goal emerges implicitly – "maintaining *our* shared way of life" or "living *this* life *together*."
      *   **Mutual Responsiveness in Service of the Goal:** Their habits and financial decisions are now mutually responsive *because* they are coordinating *to sustain* that shared life. They adjust their individual actions (spending, routines) not just out of habit, but *in order to* maintain the joint project they've become committed to. There's an implicit understanding of "this is *our* life."
      *   **Commitment:** Even though not explicitly chosen step-by-step, there's an ongoing commitment to the shared reality they've built, transforming passive convergence into active, goal-directed (though often habitual) maintenance of a joint project.

  **In essence:** What began as individual actions leading to unintended convergence evolves into a state where their actions are now mutually responsive *in the service of* maintaining their *shared* life. This constitutes joint action, even if the "choosing" happened gradually and implicitly through commitment rather than a single decision. The shared goal ("our life together") is now the director of their coordinated actions.

  This principle – **Shared Goal-Directedness** – captures your intuitions across all cases, cleanly resolves the jazz/riot dilemma by emphasizing the *purpose* of the responsiveness, and predicts that the couple's life evolves into a genuine, if implicit, form of joint action.
