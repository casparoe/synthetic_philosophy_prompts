  Your synthesis is impressively nuanced—let's dissect its tensions systematically. Below is an audit ranking conflicts by severity, resolution paths, and hidden compatibilities:

  ### **Ranked Tensions (High to Low Severity)**
  1. **Essentialist "Horse" vs. Political Instrumentalism (2 vs. 3)**  
     - **Severity:** High (core philosophical clash)  
     - **Conflict:** If "horse" is an essential kind (2), its logic transcends social utility. But if Mingjia aimed to stabilize roles via "linguistic hygiene" (3), their logic serves control—undermining (2)'s metaphysical realism.  
     - **Resolution Needed:** *Either* concede that Mingjia co-opted pre-existing logical structures for power (weakening 2), *or* argue their essentialism *enabled* social order by reflecting cosmic patterns (e.g., correlative cosmology).  
     - **Cost:** Abandoning (2)'s realism makes (1) and (4) mere technical exercises. Abandoning (3) ignores historical context (e.g., Xunzi’s influence on "rectifying names").  

  2. **Sortal-Relative Counting vs. Essentialism (1 vs. 2)**  
     - **Severity:** Medium (methodological vs. ontological)  
     - **Conflict:** (1) treats identity as predicate-relative (e.g., "white horse" ≠ "horse" due to stricter criteria), which *can* work with conventionalism. But (2) demands "horse" has inherent essence, not just contextual criteria.  
     - **Resolution:** Essentialism (2) isn’t required for sortal-relativity (1). Mingjia might assert sortal shifts *because* predicates reveal deeper essences (e.g., "white" exposes a horse's true nature).  
     - **Cost:** If (1) doesn’t need (2), the "genuine insight" in (5) becomes linguistic, not metaphysical.  

  3. **Modern Type Theory vs. Authoritarian Rationalization (4 vs. 5)**  
     - **Severity:** Low (anachronism risk)  
     - **Conflict:** Framing White Horse as "subtype logic" (4) suggests universal formal truth, but (5) reduces it to justifying hierarchy.  
     - **Resolution:** Mingjia could be *unintentionally* proto-formal: their social goals (3) led them to discover logical structures (4) valid beyond their aims.  
     - **Cost:** Accepting (4) risks projecting modern concepts onto texts concerned with ethics, not abstraction.  

  ---

  ### **Hidden Compatibilities (Apparent Tensions That Dissolve)**  
  - **All Logical Elements (1,2,4) + Political Function (3):** The tension dissolves if Mingjia saw social order as *mirroring* ontological order. In Confucian contexts (e.g., *Xunzi*), "correct names" prevent chaos because language aligns with reality. Thus, White Horse’s logic *simultaneously* reveals metaphysical truth (1,2,4) *and* serves governance (3).  
  - **Sortal-Relativity (1) + Subtype Logic (4):** These reinforce each other. Type theory formalizes (1)’s intuition that adding "white" creates a subtype with stricter identity conditions—no essentialism (2) required.  

  ---

  ### **Argument That Could Change My Mind**  
  If you found **evidence that Mingjia explicitly separated logic from politics** (e.g., fragments discussing "horse" without social analogies), your package would collapse under tension (1 vs. 3). Conversely, if texts like *Mozi* (which critiques Mingjia) accused them of *detaching* logic from ethics, (3) weakens and (1,2,4) gain plausibility.  

  ---

  ### **Where My Reasoning Is Likely Weakest**  
  - **Anachronism Overreach:** I may overstate the conflict by imposing a **modern fact/value split**. Pre-Qin thought often fused ethics, metaphysics, and politics. If Mingjia saw logic and social order as co-dependent, (1-4) harmonize effortlessly.  
  - **Surviving Texts:** Only fragments of Mingjia works remain (e.g., *Gongsun Longzi*). Your reading leans heavily on the White Horse Dialogue—but if other dialogues (e.g., "When a White Horse is Not a Horse") show purely political aims, (3) dominates.  

  ---

  ### **Revised Synthesis Suggestion**  
  Your view holds if:  
  1. Mingjia’s "essentialism" (2) is **moderate**: "Horse" has *contextual* essences (e.g., tied to function in the ritual-social order), not Platonic Forms.  
  2. Their logic (1,4) was **hijacked for power** (3), but retains independent insight—like Aristotle’s logic serving medieval dogma without losing validity.  
  3. The **ancient Chinese worldview** is prioritized: Logic wasn’t "disinterested" but a tool to align *tian* (cosmos), *dao* (way), and *zhengming* (name-rectification).  

  **Result:** Your "proto-ontology" (4) reveals patterns Mingjia believed governed *both* reality and society—resolving the pull between metaphysics and control. The cost? Conceding that their "essentialism" (2) was likely softer than Aristotle’s.
