  You are a philosopher of science with expertise in evolutionary theory and the philosophy of computation. Before drafting, spend a paragraph brainstorming the structural constraints: what must be said, what must be avoided, and where the analogy between Darwin and Turing is most fragile.

  Write the opening remarks for the interdisciplinary workshop Reason Without Reasoners: Competence and Comprehension in Natural and Artificial Systems. The audience is mixed—half are specialists in philosophy of biology, AI ethics, or philosophy of mind who will catch subtle allusions; the other half are graduate students and researchers from physics and neuroscience with no background in these debates. The remarks should run about seven minutes spoken, and the philosophical idea—competence without comprehension—must do real structural work: it should shape what the speaker can and cannot claim about Darwinian natural selection and about Turing-style computation, not merely decorate the introduction.

  Build the speech around the strange inversion shared by Darwin and Turing. Darwin argued that cumulative selection produces exquisitely adapted structures without any comprehending agent directing the process or knowing the adaptive value of the variations being selected. Turing argued that a formal system can display behavior indistinguishable from intelligence without any internal comprehension of the rules it applies or the meaning of its outputs. Use this inversion to frame the workshop’s purpose, but maintain a live tension: you must not imply that large language models therefore understand in virtue of their competence, nor that Darwinian evolution is just a mindless mechanism lacking explanatory power. The point is that competence can run ahead of comprehension, not that comprehension is irrelevant.

  Inject one somewhat niche conceptual point: draw on the distinction between procedural competence and semantic comprehension, but apply it specifically to Darwin’s claim in On the Origin of Species that selection operates on heritable variations without a selector’s knowledge of their future utility—an epistemic inversion in which the system achieves what looks like foresight without foresight. Connect this to a parallel inversion in Turing’s 1950 discussion of machine learning, where he suggested that a machine might improve its performance through experience without ever constructing an explicit representation of the principles governing that improvement.

  Because experts are present, include one precise conceptual distinction they will recognize—such as the difference between weak and strong readings of the competence-comprehension gap—but explain it in terms accessible to non-specialists. Do not provide a bibliography, reading list, or citations; the speech should stand alone.

  Conclude with a brief reflective note (around 150 words) stating where your reasoning is most likely to fail and what specific argument or empirical finding—perhaps from recent mechanistic interpretability research—would change your mind about whether the Darwin-Turing analogy genuinely holds for contemporary artificial systems.

  Think carefully, check for consistency, and write in a spoken, polished register rather than an academic essay.
