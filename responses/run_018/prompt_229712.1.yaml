prompt: |-
  After a long argument with a friend, we are stuck on whether Wittgenstein’s On Certainty supports a substantive hinge epistemology or merely exposes a misunderstanding in skeptical and anti-skeptical arguments. For the purpose of settling that dispute, write the desiderata an adequate theory of hinges must meet: what hinges are if they are neither ordinary beliefs nor mere behavioral dispositions; how they can make doubt and inquiry possible without themselves being epistemically justified; how they relate to certainty, knowledge, evidence, and reasons; and how apparently fixed commitments can nevertheless change without being revised one proposition at a time.

  For each requirement, give the motivating case or problem—radical skepticism, Moorean certainty, inductive practice, deep disagreement, conversion, and gradual conceptual change would all be useful. Include a requirement that the theory model both hinge inheritance, where later beliefs acquire their standing from an inherited background, and hinge drift, where a commitment’s role changes gradually from unquestioned scaffolding to contestable claim, or vice versa. Distinguish non-negotiable requirements from preferences characteristic of epistemic, therapeutic, naturalistic, or relativist readings of Wittgenstein. Most importantly, identify any desiderata that appear jointly unsatisfiable—for example, explaining hinges’ exemption from doubt without making them arbitrary, or allowing rational criticism across hinge systems without assuming a neutral standpoint.
reasoning: |-
  Okay, the user is in a debate about Wittgenstein's "On Certainty" and wants to clarify whether it supports a substantive hinge epistemology or just exposes misunderstandings in skeptical arguments. They need a list of desiderata for an adequate theory of hinges to settle their dispute. 

  First, I need to recall the key points from "On Certainty." Wittgenstein discusses hinges as certainties that aren't knowledge but underpin our language games. The friend thinks it's therapeutic, exposing misunderstandings, while the user believes it's a substantive epistemology. 

  The user wants desiderata covering several aspects: what hinges are, how they enable doubt without justification, their relation to certainty/knowledge/evidence, how they change, hinge inheritance, and drift. Also, they mention cases like radical skepticism, Moorean certainty, inductive practice, deep disagreement, conversion, and gradual change. 

  I should start by defining the core problem: hinges must be distinct from beliefs and dispositions. The Moorean paradox shows that saying "I know this is a hand" feels odd because hinges aren't known; they're foundational. So a theory must explain their unique status. 

  Next, enabling doubt without justification. Radical skepticism challenges all knowledge, but hinges allow inquiry by being exempt. They're like the door that opens and closes but isn't part of the room's investigation. The theory must show how hinges make inquiry possible without being justifiable themselves. 

  Relating to certainty, knowledge, evidence. Moore's certainty isn't knowledge because it lacks doubt. Hinges are certain but not based on evidence. The theory needs to position them as the framework for evidence, not part of it. 

  Change without revision. Conversion and conceptual shifts, like the Copernican revolution, show hinges change en masse, not individually. The theory must explain holistic shifts without piecemeal revision. 

  Hinge inheritance: later beliefs derive status from background hinges. Like trusting a textbook based on educational norms. Drift: a hinge becomes contestable, e.g., gender norms shifting over time. The theory should cover both. 

  Now, conflicting desiderata. Hinges must be exempt from doubt but not arbitrary (like cultural relativism). Also, rational criticism across systems without a neutral standpoint—like resolving deep disagreements without assuming universal standards. These seem jointly unsatisfiable. How can hinges be necessary for a system yet changeable? And how critique without neutrality? 

  Non-negotiable vs. preferences. Essential: hinges' logical status, enabling doubt, non-justification, change mechanism. Preferences: epistemic (justification without evidence), therapeutic (dissolving confusion), naturalistic (evolutionary basis), relativist (local frameworks). 

  Key tensions: exemption vs. non-arbitrariness. If hinges are beyond justification, aren't they arbitrary? But Wittgenstein ties them to world-pictures and action. Also, cross-system critique without neutrality—maybe through internal coherence or pragmatic success, but that's tricky. 

  The user needs these laid out clearly to show where the debate hinges (pun intended). Highlighting the conflicts might help them see why their friend leans therapeutic—substantive theories struggle with the tensions. But a robust epistemology must address these to be viable.
answer: |-
  Here are the **desiderata for an adequate theory of hinges** based on Wittgenstein's *On Certainty*, designed to resolve your dispute. Each requirement addresses core problems, distinguishes non-negotiables from interpretive preferences, and highlights potential tensions.

  ---

  ### **I. Essential Desiderata (Non-Negotiables)**  
  *These arise directly from Wittgenstein's text and target the core function of hinges.*

  1. **Non-Propositional & Non-Dispositional Status**  
     - **Requirement**: Hinges must be distinct from both *empirical beliefs* (which are truth-apt and evidence-sensitive) and *mere behavioral dispositions* (which lack cognitive content).  
     - **Motivation**: **Moorean Certainty** (e.g., "Here is a hand"). Moore’s mistake was treating hinges as empirical knowledge, but they cannot be doubted or verified like ordinary propositions (*OC 151*). They also aren’t reflexes (e.g., blinking) because they structure *rational* inquiry.  
     - **Non-Negotiable**: Wittgenstein explicitly rejects assimilating hinges to beliefs or habits (*OC 136, 401*).

  2. **Enabling Doubt Without Being Justified**  
     - **Requirement**: Hinges must make doubt and inquiry *possible* while themselves being **exempt from epistemic justification** (neither justified nor unjustified).  
     - **Motivation**: **Radical Skepticism** (e.g., Cartesian doubt). If hinges required justification, skepticism would be inescapable (infinite regress). Hinges *allow* skepticism to target propositions *within* a framework but are immune by defining "rational doubt" (*OC 114, 343*).  
     - **Non-Negotiable**: "The *questions* that we raise and our *doubts* depend on the fact that some propositions are exempt from doubt" (*OC 341*).

  3. **Certainty as World-Picturing (Not Knowledge)**  
     - **Requirement**: Hinges constitute an **ungrounded "picture of the world"** that is certain but *not knowledge*. They frame what counts as evidence/reasons without being based on them.  
     - **Motivation**: **Inductive Practice** (e.g., expecting the sun to rise). We don’t *infer* this from evidence; it defines our standards of evidence (*OC 130–132*). Moore’s "I know" fails because hinges lack grounds (*OC 483*).  
     - **Non-Negotiable**: "I have a world-picture. Is it true or false? Above all, it is the substratum of all my enquiring and asserting" (*OC 162*).

  4. **Holistic Change Without Revision**  
     - **Requirement**: Hinges must explain how world-pictures shift **non-rationally** (not via piecemeal evidence) through events like conversion or conceptual drift.  
     - **Motivation**: **Conversion/Deep Disagreement** (e.g., religious awakening) and **Gradual Conceptual Change** (e.g., phlogiston → oxygen). Hinges change as a "whole system" (*OC 102*), not by refutation.  
     - **Non-Negotiable**: "At the foundation of well-founded belief lies belief that is not founded" (*OC 253*); revision occurs when "our whole system of verification collapses" (*OC 603*).

  ---

  ### **II. Dynamic Desiderata (Inheritance & Drift)**  
  *Required to explain epistemic development and social variation.*

  5. **Hinge Inheritance**  
     - **Requirement**: Later beliefs (e.g., "DNA is a double helix") must **derive their epistemic status** from inherited hinges (e.g., "scientific methods are reliable"), not intrinsic properties.  
     - **Motivation**: **Expert Testimony** (e.g., trusting a scientist). We accept claims without personal verification because they inherit legitimacy from hinge commitments (*OC 144, 600*).

  6. **Hinge Drift**  
     - **Requirement**: The theory must model how commitments **gradually shift roles**:  
       - *Scaffolding → Contestable Claim* (e.g., "The Earth is flat" was a hinge, now falsifiable).  
       - *Contestable Claim → Scaffolding* (e.g., "Humans evolved" may become hinge-like for biology).  
     - **Motivation**: **Conceptual Revolutions** (e.g., heliocentrism) and **Cultural Change** (e.g., shifts in gender norms). What is an empirical question today may become foundational tomorrow (*OC 96–99*).

  ---

  ### **III. Tensions & Jointly Unsatisfiable Desiderata**  
  *These reveal fault lines in the substantive vs. therapeutic debate.*

  7. **Exemption from Doubt vs. Non-Arbitrariness**  
     - **Requirement**: Hinges must be **exempt from doubt** *without* rendering them arbitrary conventions (e.g., cultural relativism).  
     - **Conflict**: If hinges are immune to criticism, how are they constrained? Wittgenstein roots them in *action* ("I act with *certainty*" – *OC 414*), but this risks naturalizing them as biological givens, ignoring normative dimensions.  
     - **Tension**: Substantive theories (e.g., Pritchard) stress hinges' *epistemic* role, risking over-rationalization; therapeutic readings (e.g., Moyal-Sharrock) emphasize their non-rationality, risking arbitrariness.

  8. **Cross-System Critique Without Neutral Standpoint**  
     - **Requirement**: Enable **rational engagement across hinge systems** (e.g., resolving deep disagreements) *without* appealing to a transcendent viewpoint.  
     - **Conflict**: **Deep Disagreement** (e.g., science vs. creationism). If hinges define "rationality," critique seems impossible (*OC 611–612*). Yet Wittgenstein implies dialogue can shift world-pictures (e.g., via persuasion, not proof).  
     - **Tension**: Epistemic readings (e.g., Williams) seek "hinge hermeneutics" for critique; therapeutic readings dissolve the problem as a confusion.

  ---

  ### **IV. Interpretive Preferences (Not Strict Requirements)**  
  *These reflect divergent readings but aren’t mandated by the text.*

  | **Reading**         | **Preference**                                                                 | **Example**                                  |
  |---------------------|-------------------------------------------------------------------------------|---------------------------------------------|
  | **Epistemic**       | Hinges confer justification on beliefs (without being justified).             | "Trust in testimony" hinges justify science |
  | **Therapeutic**     | Hinges expose skepticism as nonsensical; no "theory" is needed.               | Rejects hinge epistemology as reification   |
  | **Naturalistic**    | Hinges are biologically/culturally evolved certainties (e.g., "object permanence"). | Ties *OC* to cognitive science             |
  | **Relativist**      | Hinge systems are incommensurable; no cross-framework critique is possible.   | Treats deep disagreements as irreconcilable |

  ---

  ### **Core Conflict: Substantive vs. Therapeutic**  
  - **Substantive Hinge Epistemology** must satisfy all desiderata in **I–II** while navigating tensions in **III**.  
  - **Therapeutic Reading** rejects **I–II** as *theoretical* errors, arguing Wittgenstein *dissolves* problems (e.g., skepticism) by exposing hinges as grammatical conditions (**non-negotiable I–III** suffice).  

  **Resolution Path**: If a theory meets **I–II** and partially resolves **III**, it leans substantive. If it treats hinges as *only* exposing conceptual confusion (e.g., skepticism is *meaningless*), it is therapeutic. *On Certainty* supports both, but desiderata **I.1–I.4** are Wittgenstein’s non-negotiable insights. The dispute hinges on whether these *demand* an epistemological theory or merely diagnose language gone on holiday.
