  - Löb’s obstacle vs. probabilistic reflection (Garrabrant-style)  
  - Embeddedness & recursive self-modeling under physical constraints  
  - Sensor noise/partial observability as destabilizers  
  - Fallback positions: external anchors, distributed trust  
