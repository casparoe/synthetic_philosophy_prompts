prompt: |-
  As a retired natural scientist—previously working in field ecology—who has only recently begun to study philosophy systematically, I find myself repeatedly asked to serve as an independent methodological referee for a small regional body that reviews proposals for intervention in wild ecosystems. The proposals invariably assert that some environmental factor causally produces an observed change in a population, and they request funding or permission to act on that basis. In my philosophical reading I have become aware of the distinction between counterfactual theories of causation, which analyse causal relations through modal dependencies on what would occur under alternative conditions, and interventionist theories, which analyse them through invariant structural relationships that hold under idealised manipulations. I should like these two frameworks translated into a practical, reusable decision procedure that I can apply without returning to first principles each time.

  Please construct for me a formal decision procedure—presented as an ordered sequence of explicit tests, with stopping rules and points of mandatory handover—through which I can evaluate any such proposal. The procedure should distinguish clearly between steps that derive from counterfactual reasoning and those that derive from interventionist reasoning, specifying at each stage what counts as a sufficient answer and what counts as failure. It must identify the precise juncture at which the procedure yields a definitive recommendation against proceeding, and the junctures at which further assessment is no longer a matter of fact but a matter of values, requiring explicit human judgment rather than methodological resolution. It should also state explicitly where the two theoretical frameworks conflict, and what the procedure can and cannot do in those cases.

  Then apply the procedure to three hypothetical proposals: (i) a plan to restrict agricultural runoff in a watershed on the grounds that nitrate levels causally drive amphibian deformities; (ii) a plan to install artificial nesting platforms for a raptor species, claiming that nest-site availability causally limits population recovery; and (iii) a plan to suppress, through vaccination, a chronic pathogen in a wild mammal population, where the proponents emphasise welfare benefits but where long-term demographic modelling suggests that pathogen suppression might trigger overpopulation and subsequent starvation. In case (iii), the procedure should reach a conclusion that a welfare-oriented board would find unwelcome, and you should explain precisely which step produces that result. Throughout, flag the judgments that remain irreducibly subjective despite the procedural form, and be honest about the misfires and limitations of the framework.

  Please write your answer in British English, and avoid bibliographies, reading lists, or citations of specific texts.
reasoning: |-
  Hmm, this is a fascinating request from a field ecologist transitioning into philosophy. The user wants a practical decision procedure that bridges counterfactual and interventionist theories of causation, specifically for evaluating environmental interventions. Their background suggests they need something rigorous yet applicable without constant philosophical re-examination.

  The core challenge is operationalising abstract philosophical distinctions into concrete tests. Counterfactual theory asks "what if" questions about alternative scenarios, while interventionist theory focuses on whether manipulations would reliably produce changes. Both are relevant to ecology but often diverge in practice.

  For the decision procedure, I'm considering a three-phase structure: 
  First, counterfactual assessment to establish prima facie causality through evidence of difference-making. 
  Second, interventionist assessment examining invariance under hypothetical manipulations. 
  Third, a conflict resolution phase where theoretical tensions arise. 

  Key design principles:
  - Must have clear stopping rules (e.g., mandatory rejection if causal claim fails Phase 1)
  - Explicit handover points where scientific assessment ends and value judgments begin
  - Honest labeling of irreducible subjective judgments
  - Special handling for cases where theories conflict (e.g., when an intervention would alter the causal structure itself)

  The three test cases are cleverly chosen to probe different edges:
  (i) Nitrate-amphibian case tests correlation/causation distinction
  (ii) Raptor nests examines manipulability of limiting factors
  (iii) Pathogen suppression forces confrontation between welfare goals and systemic consequences

  Notably, case (iii) should yield an "unwelcome" conclusion for welfare advocates - probably at the interventionist stability check where suppressing a natural population control emerges as unsustainable. This will require careful framing to show it's the methodology forcing the outcome, not my bias.

  Throughout, I must flag where subjectivity persists despite the formal procedure (e.g., judging "sufficient" evidence quality) and acknowledge framework limitations like handling complex feedback loops. British English phrasing will be maintained consistently, avoiding academic citations as requested.

  The procedure should empower the user to say: "The methodology demands we stop here" rather than "I personally think." That's the real deliverable - turning philosophical nuance into procedural authority.
answer: |-
  Below is a formal decision procedure for evaluating ecological intervention proposals, synthesising counterfactual and interventionist causal frameworks. It is structured as a sequential algorithm with explicit tests, stopping rules, and handover points. Key features:  
  - **Counterfactual steps** (CF) assess whether *X* makes a difference to *Y* in observed or imagined scenarios.  
  - **Interventionist steps** (INT) assess whether hypothetical manipulations of *X* would invariantly change *Y*.  
  - **Stopping rules** mandate rejection if causal claims fail verification.  
  - **Handover points** occur where values-based judgment supersedes methodological assessment.  
  - **Irreducible judgments** are flagged with ⚠️.  

  ---

  ### **Formal Decision Procedure**  
  **Phase 1: Counterfactual Causal Assessment**  
  *Objective: Establish whether the claimed cause (X) and effect (Y) exhibit difference-making relationships.*  
  1. **Test 1 (CF - Covariation):**  
     - *Query:* Does historical/observational data show systematic covariation between *X* and *Y*?  
     - *Sufficient answer:* Statistical correlation (± directionality) with confounders controlled (e.g., via partial regression).  
     - *Failure:* No correlation or confounding renders correlation uninterpretable.  
     - *Stopping rule:* **REJECT** if failure; proceed if sufficient.  

  2. **Test 2 (CF - Alternative Scenarios):**  
     - *Query:* Are there plausible, naturally occurring cases where *X* was absent/altered but *Y* behaved predictably?  
     - *Sufficient answer:* Empirical evidence (e.g., comparator ecosystems without *X* showing absence of *Y*).  
     - *Failure:* No such cases exist or evidence is equivocal.  
     - *Stopping rule:* **REJECT** if failure; proceed if sufficient.  

  **Phase 2: Interventionist Causal Assessment**  
  *Objective: Verify whether manipulating *X* would invariantly alter *Y* under ideal interventions.*  
  3. **Test 3 (INT - Modularity):**  
     - *Query:* Would an ideal intervention on *X* (holding all else constant) reliably change *Y*?  
     - *Sufficient answer:* Mechanistic model (e.g., dose-response, ecological niche dynamics) demonstrating invariant *X→Y* linkage.  
     - *Failure:* Model shows *Y* is insensitive to *X* or dependent on unstable background conditions.  
     - *Stopping rule:* **REJECT** if failure; proceed if sufficient.  

  4. **Test 4 (INT - Stability):**  
     - *Query:* Would the *X→Y* relationship hold across plausible environmental perturbations?  
     - *Sufficient answer:* Sensitivity analysis showing robustness (e.g., climate/model uncertainty ranges do not negate causality).  
     - *Failure:* Relationship collapses under minor perturbations.  
     - *Stopping rule:* **REJECT** if failure; proceed if sufficient.  

  **Phase 3: Conflict Resolution & Final Checks**  
  5. **Test 5 (Theoretical Conflict Check):**  
     - *Query:* Do counterfactual and interventionist assessments conflict?  
       - *Conflict example:* CF supports causality (strong correlation) but INT reveals *X→Y* fails under intervention (e.g., due to feedback loops).  
     - *Resolution:*  
       - If conflict arises, **pause scientific assessment**.  
       - Flag: *"Causal claim is methodologically indeterminate"* and **HANDOVER** to risk-assessment panel.  
       - ⚠️ *Irreducible judgment:* Deciding which theory dominates in applied contexts.  

  6. **Test 6 (Unintended Consequences):**  
     - *Query:* Does the proposal model secondary causal chains (e.g., cascading effects on non-target species)?  
     - *Sufficient answer:* Systems model projecting ≤10% risk of net harm.  
     - *Failure:* High risk of harm or unmodelled pathways.  
     - *Stopping rule:* **HANDOVER** to ethical review (values-based trade-offs).  

  **Final Outputs:**  
  - **Recommendation:** Proceed only if Phases 1–2 pass *and* no unresolvable conflict (Test 5).  
  - **Mandatory rejection points:** Failure at Test 1, 2, 3, or 4.  
  - **Limitations:** Cannot resolve conflicts between CF/INT (Test 5) or value-laden trade-offs (Test 6).  

  ---

  ### **Application to Hypothetical Proposals**  
  **Case (i): Restrict agricultural runoff to reduce amphibian deformities**  
  - **Test 1 (CF):** Data shows nitrate levels covary with deformity rates across wetlands. *Sufficient.*  
  - **Test 2 (CF):** Amphibians in low-nitrate reference sites show minimal deformities. *Sufficient.*  
  - **Test 3 (INT):** Toxicology models confirm nitrates disrupt limb development *in vitro*. *Sufficient.*  
  - **Test 4 (INT):** Relationship holds across pH/temperature ranges. *Sufficient.*  
  - **Test 5:** No conflict.  
  - **Test 6:** Runoff reduction may affect crop yields (socioeconomic handover).  
  - **Verdict: SCIENTIFICALLY VALIDATED** (subject to socioeconomic review).  

  **Case (ii): Install nesting platforms for raptor population recovery**  
  - **Test 1 (CF):** Nest-site availability correlates with breeding pairs. *Sufficient.*  
  - **Test 2 (CF):** Populations declined in habitats with nest-site loss. *Sufficient.*  
  - **Test 3 (INT):** Experimental platform additions boost local fledging success. *Sufficient.*  
  - **Test 4 (INT):** Effect persists across weather/predator regimes? ⚠️ *Uncertain* (requires multi-year trials).  
  - **Test 5:** No conflict yet.  
  - **Test 6:** Platforms may favour raptors over competing species (handover for ethical review).  
  - **Verdict: PROVISIONALLY VALID** (contingent on stability testing).  

  **Case (iii): Suppress pathogen in mammals for welfare, risking overpopulation**  
  - **Test 1 (CF):** Pathogen mortality correlates inversely with population density. *Sufficient.*  
  - **Test 2 (CF):** Populations crash during pathogen outbreaks. *Sufficient.*  
  - **Test 3 (INT):** Vaccination directly reduces pathogen load, increasing survival. *Sufficient.*  
  - **Test 4 (INT):** **FAILURE.** Demographic models show intervention *alters the causal structure*: reduced mortality → overpopulation → starvation (a new causal pathway). The *X→Y* link (pathogen suppression → welfare) is unstable under population feedback.  
  - **Stopping rule:** **REJECT** at Test 4.  
  - **Why unwelcome?** Welfare benefits (reduced disease) are negated by system-level instability, violating interventionist requirements. The causal chain is not invariant.  
  - **Conflict note:** CF supports welfare causality (less disease = healthier individuals), but INT reveals catastrophic system failure. Test 5 would trigger handover, but Test 4 mandates rejection.  

  ---

  ### **Framework Limitations & Misfires**  
  1. **Irreducible Subjectivities:**  
     - ⚠️ Judging "sufficient" evidence quality (e.g., Test 1 confounder control).  
     - ⚠️ Defining "plausible perturbations" in Test 4.  
     - ⚠️ Balancing CF/INT conflicts (Test 5).  

  2. **Misfires:**  
     - **False negatives:** Overly strict modularity (Test 3) may reject valid ecological drivers (e.g., keystone species with context-dependent effects).  
     - **False positives:** CF tests alone may endorse spurious correlations (e.g., Test 2 comparators imperfect).  

  3. **Systemic Blind Spots:**  
     - Cannot fully model complex adaptive systems (e.g., climate feedbacks).  
     - Values-based handovers (Test 6) may override sound causality.  

  This procedure provides methodological rigour but cannot eliminate epistemic uncertainty or ethical complexity. Its strength lies in forcing explicit justifications for interventions, ensuring causal claims withstand both counterfactual and manipulation-based scrutiny.
