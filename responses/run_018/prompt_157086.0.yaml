  Also, the user might be conflating two types of indistinguishability. Quantum particles are indistinguishable yet their permutations have consequences due to the formalism's linearity. In GR, permutations are gauge symmetries, meaning they leave all observables invariant. There's no superposition of spacetimes or entanglement-like effects in classical GR. 

  I should mention that if quantum gravity introduces fundamental indeterminism, that's separate from the hole argument's classical context. But as of now, without evidence for quantum spacetime, the gauge freedom resolution holds. 

  The user's deeper concern might be about the metaphysics of spacetime points. Relationalism denies points independent existence—they're just nodes in a relational network. So permuting them without changing relations is meaningless. Quantum particles, even indistinguishable, exist within a background space, making their permutations operational. But spacetime points don't have that backdrop; they're the stage itself. 

