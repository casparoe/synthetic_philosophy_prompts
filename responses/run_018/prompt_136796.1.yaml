answer: |-
  Here are five implications of the statue-and-clay problem for museum restoration, separating settled metaphysics from live debates, and flagging soft reasoning:

  1.  **Replacement Necessitates a Change in Strict Identity (Settled Metaphysics):** Metaphysically, replacing *any* portion of the original material with new matter means the resulting object is not strictly identical (numerically the same) as the pre-shattered statue, due to mereological essentialism or change in composition. Conservators often acknowledge this strict view but prioritize continuity of form/function.
  2.  **Authenticity Shifts from Material to Other Criteria (Live Debate):** While the *strict metaphysical identity* is lost (settled), whether the restored object retains "authenticity" hinges on contested criteria like historical continuity, original intent, form, or cultural significance versus the primacy of original matter, leading to deep disagreement between philosophers and conservators on what constitutes the "real" artifact.
  3.  **The Threshold for "Survival" is Undefined and Contentious (Live Debate & Soft Reasoning):** There is no metaphysically settled "percentage" (like 40%) where the original object ceases to exist; this is fiercely debated. Arguments range from requiring any original part, to a majority, to spatiotemporal continuity of form, making reasoning about acceptable replacement limits philosophically soft and context-dependent.
  4.  **Material Continuity is Not Essential for Identity in All Theories (Settled Metaphysics), But Its Value is Debated (Live Debate):** Metaphysics establishes that persistence without strict material continuity is possible (e.g., perdurantism, functionalist views - Ship of Theseus resolutions). However, whether the *unique historical value* resides *only* in the original atoms (even if chemically identical replacements are used) is a major, unresolved practical and philosophical fight among conservators and theorists.
  5.  **Restoration Creates a Hybrid Ontological Entity (Settled Metaphysics), But Its Nature is Contested (Live Debate & Soft Reasoning):** The restored object is uncontroversially metaphysically hybrid (composed of original + new parts). However, whether this hybrid constitutes a *new artifact*, a *modified original*, or a distinct *restoration-stage* of the original is philosophically unresolved, leading to soft reasoning when labeling or attributing provenance to the restored piece.
