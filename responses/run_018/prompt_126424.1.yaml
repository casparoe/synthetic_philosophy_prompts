  Hmm... the key disanalogies emerge when examining whether moral judgments track mind-independent social relations. Unlike taste buds which merely register chemical properties, moral cognition seems to engage with abstract relational truths—promissory obligations exist regardless of evolutionary wiring. That's the first major crack in the analogy.

