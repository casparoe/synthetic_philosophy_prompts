prompt: |-
  I'm giving a talk at our philosophy of mind seminar next tuesday — defending illusionism about phenomenal consciousness, but not the usual Dennett-style "qualia don't exist" line. My specific claim is that phenomenal concepts are indexical-descriptive hybrids that misrepresent there own epistemic source: we think we're directly acquainted with intrinsic properties, but actually introspection is just reconstructive inference with a false modal tag. So the illusion is about how we know, not what's there. The audience is a mixed bag: two phenomenal realists who specialise in introspection and treat first-person authority as axiomatic, two cognitive scientists who study metacognition and will want empirical hooks, plus one Kant scholar who thinks transcendental arguments block any eliminativist move about subjective experience. I need a Q&A prep sheet: the objections I'll actually face, ordered by damage potential, each phrased how they'd say it, with a two-minute reply and a note on where my reply is weakest. Include the one I'm dreading — probably the Kantian asking whether my view collapses transcendental unity of apperception into a mere construct. Don't send me bibliographys or citation lists; I just need the argument moves.
