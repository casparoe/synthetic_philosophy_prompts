answer: |-
  Here are the five biggest policy takeaways:

  1.  **Discount micro-level policy advice:** Don't use these models to design firm-level carbon regulations (e.g., specific subsidy structures or compliance mechanisms), as they falsely assume perfect rationality and optimization that doesn't exist.
  2.  **Expect policy resistance and delay:** Treat the predicted macro warming curves as *best-case, frictionless scenarios*; real-world implementation will face significant delays and higher costs due to actual firm behavior, requiring more aggressive policy timelines and budgets.
  3.  **Question carbon price sufficiency:** Be skeptical if the model suggests a specific carbon price alone is sufficient; real firms need complementary policies (information, standards, technology support) to overcome behavioral and informational barriers the model ignores.
  4.  **Prioritize macro adaptation:** Place greater weight on the model's *macro-level physical predictions* (e.g., aggregate warming, sea-level rise) for adaptation planning, as these might be robust despite flawed micro-assumptions, but verify with other models.
  5.  **Demand micro-realism for transition risks:** Insist models incorporate realistic firm behavior (inertia, myopia, bounded rationality) before using them to predict financial stability risks, supply chain disruptions, or abrupt economic shifts triggered by climate policy.
