     - Rule 3: Properties (like color) must be classified with the property seals. But note: the property seals can only be applied to objects that are purely that property? That doesn't make sense. Instead, we have to say that a property seal (like "White") can only be applied to an object that has that property and no form? That is impossible because every object has a form. This is the problem. So we need to adjust.

