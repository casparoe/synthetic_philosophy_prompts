  We are designing an activity to recreate the counterintuitive force of the White Horse paradox. The paradox hinges on the separation of form (xing) and color (se) in concept, while they are fused in reality. The activity must avoid becoming a generic sorting exercise and instead lead students to reconstruct the paradox through a physical classification task with constraints.

  The core idea: 
  - Students will act as either Archivists (who classify objects using category seals) or Inspectors (who challenge classifications based on rules).
