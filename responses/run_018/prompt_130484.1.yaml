  4. Timeline (80 minutes total):
     - Phase 1: Introduction and Setup (10 minutes)
          - Explain the scenario: We are in an ancient archive. The Archivists must classify artifacts (the blocks) using the provided seals. The rules are strict. The Inspectors will ensure compliance and deduct consistency points for rule violations or ad hoc solutions.
          - Assign roles and distribute materials to Archivists: each Archivist team gets a set of blocks (which should include: some plain wooden blocks, some with removable property cards, and some with inseparable properties, including the white-painted block). They also get the category seals (only "Horse", "White", "Blue", etc. and no composite seals).
