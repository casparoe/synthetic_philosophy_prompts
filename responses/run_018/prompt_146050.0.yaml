answer: |-
  ### Brain Death Determination Flowchart for Ethics Consultation  
  **Purpose**: Medically and legally defensible death declaration integrating organismal integration (whole-body function) vs. irreversible loss of consciousness. Forces action where medical criteria are met, flags value-based exceptions.  

  ---

  #### DECISION PROCEDURE  
  **Step 1: Confirm Prerequisites**  
  - ☑️ **Irreversible cause** (e.g., anoxia, trauma, hemorrhage)?  
    - *No* → Stop. Not a brain death case. Reassess diagnosis.  
    - *Yes* → Proceed.  
  - ☑️ **Core temperature ≥36°C**?  
    - *No* → Stop. Warm patient. Retest in 6 hours.  
    - *Yes* → Proceed.  
  - ☑️ **SBP ≥100 mmHg, normotensive, normovolemic**?  
    - *No* → Stop. Optimize hemodynamics. Retest.  
    - *Yes* → Proceed.  
  - ☑️ **No CNS depressants/paralytics in last 24h** (confirm tox screen)?  
    - *No* → Stop. Wait for clearance. Retest.  
    - *Yes* → Proceed.  

  **Step 2: Test Brainstem Reflexes**  
  - ☑️ **Pupillary, corneal, oculovestibular, gag, cough reflexes absent**?  
    - *All absent* → Proceed.  
    - *Any present (even fragmentary)* → Stop. **Not brain dead.** Continue support.  
    - *Uncertain* → Proceed to Step 3 (ancillary testing).  

  **Step 3: Apnea Test**  
  - ☑️ **Formally performed (PaCO₂ ≥60 mmHg, no respiratory effort)**?  
    - *No respiratory effort* → Proceed.  
    - *Respiratory effort observed* → Stop. **Not brain dead.**  
    - *Test aborted* (e.g., ECMO instability) → Proceed to Step 4.  

  **Step 4: Ancillary Testing**  
  - ☑️ **EEG (30+ min flat) + cerebral blood flow (CBF) study**?  
    - *Both flat EEG + absent CBF* → Proceed.  
    - *Discordant (e.g., flat EEG but CBF present)* → Stop. **Not brain dead.**  
    - *Indeterminate* → Repeat in 12h.  

  **Step 5: Address Residual Function/Edge Cases**  
  - ☑️ **Hypothalamic/neuroendocrine function present** (e.g., temperature regulation, ADH secretion)?  
    - *Yes* → **Judgment call**: If *only* hypothalamic function persists (no cortex/brainstem), proceed. Organismal integration failed; consciousness irrecoverable.  
    - *No* → Proceed.  
  - ☑️ **Neuro-prosthetic argument raised** (future tech could restore function)?  
    - → **Confounder override**: Death declaration requires *current* irreversibility. Future possibilities are irrelevant. Proceed.  

  **Step 6: Value-Based Objections**  
  - ☑️ **Religious/cultural objection to brain death**?  
    - *No* → Declare death.  
    - *Yes* → **Hand off to values**:  
      - Inform family death is legally declared.  
      - Accommodate *temporarily* (e.g., 24–48h) for rituals while discontinuing organ support.  
      - If family demands circulatory criteria only → Escalate to risk management. **Do not delay declaration.**  

  **Step 7: Declaration Enforcement**  
  - ☑️ **All Steps 1–5 satisfied**?  
    - *Yes* → **Declare death immediately** (time = when final test met).  
    - *Attending refuses to sign* → **Force action**:  
      - Document refusal in chart.  
      - Notify hospital counsel/CEO.  
      - Ethics consultant co-signs with neurology lead.  
  - **Litigation fear is not a medical criterion**. Proceed.  

  ---

  ### CASE APPLICATIONS  
  **Flagged Judgment Calls** denoted by **{!}**.  

  #### Case 1: Clean Brain Death with Donation Consent  
  - *History*: 45M, massive ICH, off sedation >24h, no confounders.  
  - **Flowchart**:  
    - Step 1: ✅  
    - Step 2: ✅ All reflexes absent.  
    - Step 3: ✅ Apnea test passed.  
    - Step 4: Skipped (ancillary not needed).  
    - Step 5: ✅ No residual function.  
    - Step 6: ✅ No objections.  
    - Step 7: ✅ Death declared. Attending signs.  
  - **Outcome**: Proceed to donation.  

  #### Case 2: ECMO Patient, Flat EEG, Intact Hypothalamus, Family Insists on Circulatory Criteria  
  - *History*: 32F, post-cardiac arrest on ECMO, flat EEG, but temp regulation intact. Family rejects brain death.  
  - **Flowchart**:  
    - Step 1: ✅  
    - Step 2: ✅ Reflexes absent.  
    - Step 3: ❗ Apnea test aborted (ECMO). → Proceed to Step 4.  
    - Step 4: ✅ Flat EEG + absent CBF.  
    - Step 5: **{!}** Hypothalamic function present → **Judgment**: Temp regulation alone doesn’t restore consciousness. Organismal integration lost. Proceed.  
    - Step 6: ❗ Religious objection → **Hand off**: Declare death. Offer 24h ECMO support for family acceptance.  
    - Step 7: ✅ Death declared.  
  - **Outcome**: Death declared. ECMO weaned per family agreement.  
  - **Hated Answer?** Family distress, but flowchart forces declaration.  

  #### Case 3: Declaration Refused by Attending Despite Meeting Criteria  
  - *History*: 28M, TBI, all tests confirm brain death. Attending fears lawsuit from angry family.  
