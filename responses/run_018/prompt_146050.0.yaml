  We'll have a series of tests (medical criteria) and stop points (decisions). At certain points, we hand off to values (ethics committee, family discussion, etc.) and at others we force a declaration.

  Steps:

  1. **Determine if the patient is on any form of life-sustaining treatment that may obscure assessment (like ECMO).**
     - If yes, proceed to step 2.
     - If no, proceed with standard brain death testing.

  2. **Confirm that the patient has an established, irreversible cause of brain damage** (e.g., massive head injury, anoxic brain injury) compatible with brain death.

  3. **Exclude confounding factors** that may mimic brain death:
     - Hypothermia (core temperature must be >= 36°C or 96.8°F).
     - Severe electrolyte, acid-base, or endocrine disturbances.
     - Drug intoxication or poisoning (including sedatives, neuromuscular blockers).
     - Significant hypotension (SBP typically >= 100 mmHg in adults).
     - If any confounder is present and cannot be corrected, stop: cannot declare brain death until resolved.

  4. **Perform clinical testing for brain death** (brainstem reflexes and apnea test):
     - Check for unresponsiveness (no motor response to pain in cranial nerve distribution).
     - Absence of brainstem reflexes:
          - Pupillary light reflex (absent).
          - Corneal reflex (absent).
