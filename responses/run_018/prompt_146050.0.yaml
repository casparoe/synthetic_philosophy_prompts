          - Gag reflex (absent).
          - Cough reflex (absent in response to tracheal suctioning).
     - Apnea test: no respiratory effort with PCO2 rising to >= 60 mmHg (or 20 mmHg above baseline).

     If the apnea test cannot be performed (e.g., due to ECMO or instability), then proceed to ancillary tests.

  5. **Ancillary Tests** (if clinical tests cannot be completed or are equivocal):
     - EEG: flat (electrocerebral silence) for at least 30 minutes.
