prompt: |-
  Been lurking rationalist spaces for years and now I'm actually trying to parse the value-pluralism stuff people gesture at. In a thread about career vs family tradeoffs someone said "if values are truly incommensurable there's just no rational basis for picking, you're literally flipping a mental coin." I feel like that one sentence is smugling in like five different philosophical claims. Can you separate the precise theses it could stand for? Like: no shared cardinal metric? An ordinal gap that can't be bridged? The parity thesis where options are on a par but not equal? Practical reason being normatively incomplete? Or the hidden-variable idea that if you dig deep enough you'll always find a tiebraker? For each one say whether it's a platitute, whether it's defensible, and whether it actually supports his "flip a coin" conclusion. I think people conflate the parity reading with the hidden-tiebreaker mistake but I'm not sure which is which.
reasoning: |-
  Okay, the user has been part of rationalist communities for years and is now diving into value pluralism. They came across a statement in a discussion about career versus family tradeoffs: "if values are truly incommensurable there's just no rational basis for picking, you're literally flipping a mental coin." The user feels this sentence packs several philosophical claims and wants them dissected. They listed specific concepts like shared cardinal metrics, ordinal gaps, parity, practical reason incompleteness, and hidden tiebreakers. Their main goal is clarity on each thesis, whether it's a platitude, defensible, and if it supports the coin-flip conclusion.

  First, I need to parse each philosophical claim they mentioned. Let's start with the shared cardinal metric. If values can't be measured on a single scale, like money or utility, then comparing career and family becomes tricky. That's pretty standard in value pluralism. But does it lead to flipping a coin? Not necessarily. Other methods like satisficing or qualitative judgment could work. So, it's defensible but doesn't force a coin flip.

  Next is the ordinal gap. Here, even a preference order isn't possible. Like, you can't say career is better than family or vice versa. This is more controversial. While some cases might feel that way, proponents like Ruth Chang argue for parity instead. If true, then maybe a coin flip is needed. But is it defensible? Hard to prove, but possible in some contexts. Still, it's not the only interpretation.

  Parity thesis is where options are comparable but neither better nor worse, and not equal. Chang's work here is key. It allows for rational choices based on commitments rather than algorithms. So, no coin flip needed. This might be what the user thinks is conflated with hidden tiebreakers. The original claim's coin-flip conclusion ignores this nuanced view.

  Practical reason incompleteness suggests that rationality doesn't cover all decisions. Some choices lack sufficient reasons, making them non-rational. This could justify coin flips in specific cases but isn't the norm. It's defensible in some philosophical circles but not universally accepted.

  Hidden tiebreakers imply that deeper analysis always reveals a preference. But pluralists argue some conflicts are genuine without hidden factors. Denying this is a mistake. If no tiebreaker exists, then flipping a coin might make sense, but pluralists would say other rational methods exist.

  The user's deeper need is to understand which interpretations are valid and where the original statement goes wrong. They suspect conflation between parity and hidden tiebreakers. Clarifying that parity allows rational choice without tiebreakers is crucial. Also, highlighting that most pluralists don't endorse coin flips as the only option. The user likely wants to engage in these discussions accurately, avoiding common misconceptions. They might be frustrated with oversimplified arguments in rationalist spaces and seek a more nuanced framework for personal decisions like career vs family. Ensuring each thesis is clearly distinguished helps them critique the original statement effectively.
answer: |-
  You're absolutely right to dissect that statement - it's a philosophical minefield masquerading as folk wisdom. Let's break down the precise theses embedded in "if values are incommensurable there's just no rational basis for picking, you're literally flipping a mental coin," evaluating each for platitude status, defensibility, and whether it supports the coin-flip conclusion. Your suspicion about conflation, especially between parity and hidden tiebreakers, is spot-on.

  Here's the breakdown:

  1.  **No Shared Cardinal Metric Thesis:**
      *   **Thesis:** Values like "career fulfillment" and "family intimacy" cannot be measured on a single quantitative scale (e.g., utils, dollars, points) that allows precise comparison of gains/losses across the dimensions.
      *   **Platitude?** **Yes, within value pluralism.** This is the most basic and widely accepted core meaning of incommensurability. It's the starting point.
      *   **Defensible?** **Strongly defensible.** Many philosophers (Berlin, Nussbaum, Raz, Stocker) argue compellingly that qualitatively distinct values (e.g., justice vs. mercy, beauty vs. truth, autonomy vs. security) resist reduction to a common denominator.
      *   **Supports Coin Flip?** **No.** Rejecting cardinal measurement *does not* entail the impossibility of rational choice. Alternatives exist: satisficing, employing qualitative comparison ("this path better expresses who I am"), rule-following ("I prioritize family commitments"), narrative coherence ("this fits my life story better"), or recognizing parity (see below). The coin-flip conclusion here is a *non sequitur*.

  2.  **Ordinal Gap / Radical Incomparability Thesis:**
      *   **Thesis:** Not only is there no cardinal metric, but there is also *no possible rational basis for even a weak preference ordering* (A > B, B > A, or A ≈ B) between options embodying incommensurable values. They are truly incomparable.
      *   **Platitude?** **No.** This is a much stronger and more controversial claim than the mere lack of a cardinal metric. It's often what people *mean* when they say "incommensurable" in casual discourse, but it's not the philosophically dominant view.
      *   **Defensible?** **Debatable, but often seen as too strong.** While some extreme cases *might* feel this way (e.g., choosing between saving your child or saving two strangers), many pluralists argue comparability persists even without cardinality or strict ordering (see Parity below). Critics argue that if we can deliberate meaningfully between options, *some* form of comparability must exist. Defending pure incomparability is philosophically challenging.
      *   **Supports Coin Flip?** **Yes, *if* true, but its truth is highly questionable.** *If* options are radically incomparable (no better, worse, equal, or on a par), then *by definition* no rational preference exists. A random choice (coin flip) might seem like the only non-arbitrary way to break the deadlock. However, since radical incomparability is hard to defend, this support for coin-flipping is weak.

  3.  **Parity Thesis (Ruth Chang):**
      *   **Thesis:** Options can be comparable even if one isn't better than the other, worse, or exactly equal. They are "on a par." This means the values they embody are comparable, and reasons exist for choosing either, but the reasons don't determine a single right answer. Choice is based on "commitment" or "will" in the space created by parity, not whim.
      *   **Platitude?** **No.** Chang's parity thesis is a sophisticated and influential *alternative* to radical incomparability and the assumption that "comparable" must mean "rankable."
      *   **Defensible?** **Highly defensible and increasingly influential.** It captures the phenomenology of hard choices: we deliberate seriously, feel reasons pulling us both ways, yet often feel neither option is clearly superior/inferior *or* exactly equivalent. It explains rational choice *without* needing a hidden tiebreaker or cardinal metric.
      *   **Supports Coin Flip?** **Emphatically No.** This is the crucial conflation you identified. Chang argues parity *enables* meaningful, non-arbitrary rational choice. Choosing based on commitment ("this is who I am/aspire to be") or creating reasons through choice is distinct from randomness. Flipping a coin here *would* be irrational abdication, ignoring the genuine reasons present. The original statement completely misses or conflates this nuanced position.

  4.  **Normative Incompleteness of Practical Reason Thesis:**
      *   **Thesis:** Practical reason (the faculty of figuring out what to do) is inherently limited. It cannot generate a uniquely rational answer for every possible choice situation, especially when fundamental, incommensurable values conflict. Reason "runs out."
      *   **Platitude?** **No, but a significant claim in moral philosophy.** It challenges the idea that reason alone can always tell us what to do.
      *   **Defensible?** **Very defensible.** Pluralists like Berlin and Williams argued forcefully that reason cannot arbitrate *between* ultimate values that define different ways of life; it can only clarify the costs within each path. This incompleteness is a core feature of value pluralism.
      *   **Supports Coin Flip?** **Potentially, but not necessarily.** Recognizing reason's limits *could* open the door to non-rational decision procedures like flipping a coin *in the specific absence of other grounds*. However, pluralists typically argue that *other* grounds exist *besides* algorithmic reason: character, commitment, projects, identity, tradition, etc. The coin-flip conclusion here is often a *mistaken leap* from "reason doesn't dictate one answer" to "only randomness remains," ignoring these other resources.

  5.  **Hidden Tiebreaker Thesis (or the Denial of Genuine Conflict):**
      *   **Thesis:** If you feel truly torn between options embodying incommensurable values, it's only because you haven't dug deep enough. There is *always* a latent preference, a more fundamental value, or a subconscious weight that *could* break the tie, making the values commensurable *in principle* for you. Genuine, undecidable conflict is an illusion.
      *   **Platitude?** **No, this is often an *assumption* held by monists (utilitarians, etc.) or strong cognitivists, but denied by pluralists.**
      *   **Defensible?** **Highly contested, arguably less defensible under pluralism.** Value pluralists explicitly *deny* this thesis. They argue that conflicts between ultimate values (e.g., liberty vs. equality, career ambition vs. family devotion) can be genuine, tragic, and lack any deeper, reconciling metric. Insisting on a hidden tiebreaker smuggles in monism/commensurability by the back door. Psychology might *sometimes* reveal latent preferences, but pluralism holds this isn't *necessarily* true.
      **Supports Coin Flip?** **Only if the thesis is *false* and you give up searching.** If you *believe* this thesis but *can't find* the hidden tiebreaker, you might resort to a coin flip out of frustration. However, the pluralist (correctly, by their lights) argues the tiebreaker doesn't exist, making the coin flip seem like the only option *if you ignore the possibility of parity or commitment-based choice*. This is the "mistake" you identified: conflating the *absence of a hidden tiebreaker* (which pluralism asserts) with the *necessity of coin-flipping* (which pluralism denies).

  **Summary & Why the Original Statement is Problematic:**

  *   **The Core Truth:** The statement correctly identifies that **no shared cardinal metric** exists (Platitude/Defensible) and hints at the **normative incompleteness of reason** (Defensible). These are core pluralist tenets.
  *   **The Conflation & Error:** It **conflates** the lack of a cardinal metric (1) and incompleteness of reason (4) with **radical incomparability** (2), **ignores the parity thesis** (3) which offers a robust account of rational choice *without* commensurability, and **smuggles in the assumption** that without algorithmic reason or a hidden tiebreaker (5 being false), only randomness remains.
  *   **The Mistaken Conclusion:** The leap to "flipping a mental coin" **only follows** if you accept both **radical incomparability** (2 - hard to defend) *and* reject the **parity thesis** (3 - defensible and popular) *and* believe that **reason's incompleteness** (4) leaves *only* randomness, ignoring commitment/identity-based choice. It also implicitly **denies genuine conflict** (5 being false - a pluralist axiom).

  **In short:** The original speaker likely conflates the basic lack of a cardinal metric (true for pluralists) with radical incomparability (contested) and ignores the possibility of rational choice via commitment within parity (Chang's key point). They mistakenly equate the absence of an *algorithmic* rational solution with the absence of *any* rational basis for choice, leading to the unwarranted coin-flip conclusion. Your instinct that they confuse the parity reading with the hidden-tiebreaker mistake is perceptive – they likely don't grasp that parity offers a *third way* beyond "better/worse/equal" *and* "incomparable/random."
