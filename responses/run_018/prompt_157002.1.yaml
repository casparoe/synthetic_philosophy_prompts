answer: |-
  Here's the epidemiological translation of the insect sentience scale argument, followed by a residue report on conceptual fidelity:

  ### Epidemiological Restatement
  **Population:** *N* ≈ 10<sup>19</sup> arthropods (point prevalence)  
  **Condition (S):** Sentience (binary classification), conceptualized as a rare trait with severe moral harm if present (e.g., capacity for morally relevant suffering). True prevalence π assumed extremely low (π << 0.001).  

  **Screening Test (T):** Behavioral/neural biomarkers for sentience (e.g., aversive learning, opioid response).  
  - **Sensitivity (Se):** *P*(T<sup>+</sup> | S<sup>+</sup>) – Low, due to evolutionary divergence & technical constraints  
  - **Specificity (Sp):** *P*(T<sup>-</sup> | S<sup>-</sup>) – High but imperfect (e.g., 0.99), due to false alarms in nociception circuits  

  **Predictive Values:**  
  - **PPV** = *P*(S<sup>+</sup> | T<sup>+</sup>) = [Se × π] / [Se × π + (1 - Sp) × (1 - π)] ≈ (Se × π) / (1 - Sp) *when π is small*  
  - **FDR** = 1 - PPV ≈ (1 - Sp) / [Se × π + (1 - Sp)] → **dominated by (1-Sp) when π → 0**  

  **Harm Metric:**  
  - **Expected Harm Burden (EHB)** = *N* × [π × *H*<sub>S+</sub> + (1 - π) × *H*<sub>S-</sub>]  
    where *H*<sub>S+</sub> = catastrophic harm if sentient (e.g., suffering intensity × duration), *H*<sub>S-</sub> ≈ 0  
  - **Population Attributable Fraction (PAF)** *if sentience is causal*: PAF = π × (RR - 1)/[π × (RR - 1) + 1] → ≈ π *when RR (harm risk ratio) → ∞*  
  - **Number-Needed-to-Harm (NNH):** Inverse of per-individual harm probability given intervention. If an action (e.g., pesticide) has harm probability δ in S<sup>+</sup> individuals, E(NNH) = 1 / (π × δ)  

  **Scale Argument Calculation:**  
  Even if π is minute (e.g., 10<sup>-6</sup>), *N* × π × *H*<sub>S+</sub> dominates EHB due to *N* → ∞. High *N* amplifies low π into large expected sentient cases:  
  **E(S<sup>+</sup>) = *N* × π**  

  ---

  ### Residue Report: Conceptual Fidelity & Cracks
  1. **Sentience as Binary State (Mapping: Poor)**  
     - *Fudge:* Philosophers debate sentience as a continuum (e.g., graded consciousness). Epidemiology assumes a dichotomous disease state. This misrepresents moral weight, which may scale nonlinearly with neural complexity.  
     - *Consequence:* PPV/FDR become unstable – "false positives" could be partially sentient entities still warranting moral concern.

  2. **Prevalence Independence (Mapping: Conditional)**  
     - *Issue:* PAF assumes independent risk. If sentience is phylogenetically clustered (e.g., all Hymenoptera or none), π varies by taxon.  
     - *Resolution:* Stratify by taxa (e.g., insects vs. crustaceans) with cluster-adjusted sampling. Unmeasured clustering inflates variance in π estimates.

  3. **Near-Zero Prevalence Counterargument (Mapping: Intact)**  
     - *Survival:* When π → 0, PPV → 0 regardless of Sp/Se. Even with Sp=0.999, if π=10<sup>-9</sup> and Se=1.0, PPV ≈ 0.001.  
     - *Caveat:* This assumes moral decisions require confident *individual classification*. If moral obligation scales with *probability* of sentience (expected harm minimization), EHB remains high despite low PPV.

  4. **Uncertainty-Driven Obligation (Mapping: Nonexistent)**  
     - *Pure Residue:* Screening ethics focuses on expected utility (EHB). The deontological claim that "uncertainty *itself* imposes precaution" lacks a statistical analog.  
     - *Gap:* No parameter captures the ethical cost of epistemic risk. Minimax regret could be forced but isn't standard in screening biostatistics.

  5. **Harm Metric Limitations**  
     - *NNH Breakdown:* NNH assumes harm is definable per action. But "harm" to sentient insects lacks clinical equivalence (e.g., is death the endpoint? Chronic stress?).  
     - *PAF Misapplication:* PAF requires sentience to be a causal risk factor for harm. If "harm" is defined *by* sentience, this becomes circular.

  ### Key Takeaways
  - **Clean mappings:** FDR/PPV logic for classification errors, EHB as expected suffering burden, scale amplification (*N* × π).  
  - **Fudged mappings:** Binarization of sentience, independence assumptions across taxa.  
  - **Unmapped concepts:** Moral weight of uncertainty (non-probabilistic obligation), continuum of consciousness.  
  - **Critical Crack:** The counterargument holds mathematically (low π → low PPV), but **collapses if society accepts expected harm minimization** (EHB) over diagnostic certainty. Epidemiology can quantify *risk*, not resolve whether low-probability/high-consequence risks demand action absent confidence in individual status.  

  **Bottom Line:** The scale argument survives as EHB → ∞ when *N* → ∞, even if π → 0, provided π > 0 and *H*<sub>S+</sub> is finite but morally catastrophic. But its force depends on accepting expected value ethics – which screening statistics *can* compute – over binary classification ethics. The irreducibly philosophical residue is whether low-probability harms deserve population-level intervention when individual diagnostic confidence is unattainable.
