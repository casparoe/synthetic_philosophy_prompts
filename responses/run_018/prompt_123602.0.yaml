prompt: |-
  hey so im taking this philsophy elective and next tuesday we have a colloquim guest—this philosopher who wrote about whether religion makes people more moral but not in the dumb way. she says 'more moral' could mean either better behavior (like donating, not lying) or better dispositions (like having good intentions even when nobody's watching), and she also argues secular societies hit an institutional saturation threshold where laws and contracts cant fully replace religious trust, especially when institutions fail. i was talking with my friend marco about this and he thinks its all just social conditioning but i want to actually understand her view. i need like 8-10 interview questions for her, not the basic 'are religious people nicer?' stuff. i want questions that dig into what counts as moral improvement—like if an atheist gives to charity for tax breaks and a believer gives out of fear of hell, which one is more moral? and i want to press her on whether this institutional saturation threshold is a real empirical limit or just a conceptual idea she made up, plus whether secular societies can sustain deep trust during blackouts or pandemics when the institutions are stressed. for each question please add a follow-up keyed to the answer shes probably gonna give. maybe also one question about whether morality needs a metaphysical foundation or if its just coordination. write them like im actually gonna read them aloud, so not too formal, and please dont ask for citations or a reading list since she can just explain it. oh and im not sure if i spelled metaphysical right lol
