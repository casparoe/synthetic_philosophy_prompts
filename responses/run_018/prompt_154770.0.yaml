  - 42-50 min: Participants engage in a structured discussion: "In light of the aggregate statistics, discuss the future of the honor code in our society." But they must not mention any specific individual's actions. If they do, the facilitator intervenes and they lose a point (and if they lose a point, they must recalculate their total points and possibly exchange tokens). This is cumbersome.

  Alternatively, we have a penalty jar: if you violate, you put one of your tokens in the jar (and then you have no token? That's too harsh). Or they get a demerit that will affect them in the debrief.

  But we want tangible stakes. We can have: if you violate, you are demoted one level in token (gold->silver, silver->bronze, bronze remains) for the debrief. And the facilitator watches and intervenes immediately.

  Phase Three: 15 minutes for the discussion and then we move to debrief.

  But the debrief is separate.

  Total time so far: 50 minutes? We have 90 minutes, so 40 minutes for debrief.

  We need to allocate:
  - Phase One: 30 min
  - Phase Two: 10 min (30-40)
  - Phase Three: 15 min (40-55)
  - Debrief: 35 min (55-90)

  Debrief (35 min): 
  - Seating by tokens (gold front, silver middle, bronze back).
  - Speaking order: gold first, then silver, then bronze. Within group, random.

  Debrief questions should map to theory.

  Materials:
  - Tokens: 2 gold, 8 silver, 2 bronze initially. Then extra tokens for exchange.
  - Score sheets for participants to track points.
  - Public board (whiteboard or poster) for outcomes in Phase One and aggregate in Phase Two and full transparency in Phase Three.
  - Handout with the matrix and rules.
  - Coin for flipping.
  - Timer.

  Predictable problems:
  1. Premature verbal breach in Phase Three: Facilitator must be vigilant. When a breach occurs, immediately interrupt and say: "You have violated the silence rule. Please hand in your current token and take one level lower." And then they do so. If they were gold, they become silver; silver->bronze; bronze stays. Then they continue.

  2. High-status players (gold) might refuse to give up their token during adjustment in Phase One. We can have a rule: token exchange is mandatory and enforced by the facilitator. If they refuse, they are out of the simulation? But we don't want that. We can have a penalty: they lose extra points. Or we design the tokens to be easily exchanged (like poker chips) and the facilitator is firm.

  3. Participants might not understand the matrix. Solution: clear handout and examples.

  4. Time management: we must keep to the timeline. Facilitator uses a timer.

  What the activity can reproduce:
  - The temporal lag between visibility (Phase Two: aggregate defection is visible) and acknowledgment (forbidden in Phase Three) and the tension that creates.

  What it cannot reproduce:
  - The real-life stakes (death, social ruin) and the long-term process. Also, in real life, the transparency shock might be gradual (like through gossip) not instantaneous. And the norm collapse might take years, not minutes. The activity compresses time.

  Debrief mapping:

  Phase One -> Bernard Williams: the practice of the honor code is sustained by the participants' mutual recognition and the payoff structure that rewards adherence. Williams might emphasize the thick ethical concepts that are embedded in the practice.

  Phase Two -> Appiah: he discusses how honor norms depend on information conditions. The aggregate data shows that defection is common, which might lead to a shift in beliefs about the norm's stability, but without common acknowledgment, the norm persists in a weakened state.

  Phase Three -> Strategic-opacity collapse: the transparency shock makes defection common knowledge, but the social rule forbids acknowledgment. This makes it impossible to perform honor (because everyone knows that everyone knows about the defections, but they cannot address it). The norm becomes unsustainable because the mutual pretense is shattered.

  Debrief structure:
  1. (5 min) Ask participants about their experience: How did you feel in Phase One when making choices? Phase Two when seeing aggregate defection? Phase Three when you knew everything but couldn't speak?
  2. (10 min) Map to theory: 
     - Williams: the practice of dueling requires a shared belief in the value of honor. When that belief is undermined (by revealed defection), the practice collapses not because of argument but because the conditions for the practice are gone.
     - Appiah: honor norms are maintained in "honor worlds" where the opinions of others matter. Once the information about widespread defection becomes known, the norm loses its grip.
     - Opacity collapse: the key is the breakdown of strategic invisibility. In Phase Three, the opacity is gone, but the rule of silence prevents acknowledgment, making the norm impossible to enact.
  3. (10 min) Discuss the mechanism: Why didn't the norm collapse in Phase Two when aggregate defection was known? (Because individual identities were hidden.) Why did it collapse in Phase Three? (Because individual defection became known, yet the silence rule prevented repair or enforcement.)
  4. (10 min) Generalize to other norms: How might this apply to contemporary norms? What are the conditions for strategic opacity? How might transparency shocks (like social media) cause norm collapse?

  Final note: the activity reproduces the visibility-acknowledgment lag and the performative unsustainability. It cannot reproduce the historical process and the real stakes, which the dissertation must theorize.

  Exact Timeline:

  - 0-5 min: Introduction, role assignment, token distribution, and rules explanation.
  - 5-10 min: Round 1 pairing and choice submission.
  - 10-15 min: Facilitator posts outcomes and informs point changes. Participants record points.
  - 15-20 min: Round 2 pairing and choice submission.
  - 20-25 min: Facilitator posts outcomes and informs point changes. Participants record and calculate total points.
  - 25-30 min: Token adjustment based on total points.
  - 30-35 min: Phase Two: reveal aggregate ledger (total uphold, negotiate, defect).
  - 35-40 min: Participants discuss in pairs or small groups the ledger (without naming names).
  - 40-42 min: Phase Three: reveal full transparency board (each participant's choices).
  - 42-50 min: Structured discussion on the future of the honor code, with silence rule enforced (no mentioning specific actions).
  - 50-55 min: Wrap up the simulation and prepare for debrief (arrange seating by tokens).
  - 55-90 min: Debrief (35 minutes).

  Role descriptions (handout):

  1. High-Status Duelists (2): You are known for your honor and bravery. You start with a gold token. You are expected to uphold the code and set an example. Your status depends on it.
  2. Aspiring Gentry (4): You are trying to rise in society. You start with silver tokens. You may challenge others to prove your honor, but be cautious of risks.
  3. State Magistrates (2): You represent the state, which officially disapproves of dueling. But you live in an honor culture. You start with silver tokens. You must balance state interests with personal honor.
  4. Creditors (2): You care about financial stability. Dueling can lead to death and unpaid debts. You start with silver tokens. You may defect to avoid risk.
  5. Pamphleteers (2): You observe and record events. You start with bronze tokens. Your role is to spread information, which might influence others. You may have your own honor to maintain.

  This design should work. Let me know if you need adjustments.
answer: |-
  Below is a comprehensive design for your 90-minute simulation, structured to induce **strategic-opacity collapse**—a breakdown in mutual pretense where private defection becomes common knowledge but unacknowledged, rendering the norm performatively unsustainable. The activity uses colored tokens (gold, silver, bronze) as tangible status markers tied to seating priority and speaking order in the debrief, creating real but low-stakes social pressure. Participants experience the collapse mechanism through three phases without relying on explicit moral argument or material shifts.

  ---

  ### **Activity Design: "The Dueling Paradox"**
  **Total Time:** 90 minutes  
  **Participants:** 12 advanced graduate students (philosophy/sociology)  
  **Materials:**  
  - Tokens: 4 gold, 6 silver, 8 bronze (adjustable supply).  
  - Public board (whiteboard or large paper) to record challenge outcomes.  
  - Anonymous ledger (hidden until Phase Two).  
  - Role cards (12 cards, one per role).  
  - Private choice slips (paper slips for Uphold/Negotiate/Defect decisions).  
  - Timer.  

  **Token Economy & Stakes:**  
  - **Gold tokens:** Highest status. Priority front-row seating + first speaking in debrief.  
  - **Silver tokens:** Middle status. Middle-row seating + second speaking block.  
  - **Bronze tokens:** Lowest status. Back-row seating + last speaking.  
  - **Token adjustments:** Based on outcomes in Phase One. Losses/gains affect debrief privileges.  

  ---

  ### **Phase Breakdown & Timeline**
  #### **Phase One: Honor Code Challenges (30 min)**  
  *Mechanism Focus: Mutual pretense upheld through private choices and public performances.*  
  - **Roles (12 participants):**  
    - **High-Status Duelists (2):** Expected to defend honor. Start with **gold tokens**. Gain status by winning duels; lose heavily if defecting.  
    - **Aspiring Gentry (4):** Seek status via honor. Start with **silver tokens**. Moderate gains/losses.  
    - **State Magistrates (2):** Officially oppose dueling but must navigate honor culture. Start with **silver tokens**. Balanced incentives.  
    - **Creditors (2):** Prioritize stability over honor. Start with **silver tokens**. Gain by avoiding risk.  
    - **Pamphleteers (2):** Amplify public perception. Start with **bronze tokens**. Gain status by exposing defections.  
  - **Rules:**  
    - Participants pair up randomly for two challenge rounds (3 min/round).  
    - Each pair: One is randomly assigned as **Challenger** (issues duel), the other as **Challenged** (responds).  
    - Private choice (written on slip):  
      - **Uphold:** Fight/accept duel (honorable but risky).  
      - **Negotiate:** Seek apology/compromise (neutral).  
      - **Defect:** Refuse/ignore challenge (dishonorable but safe).  
    - Outcomes (based on combined choices) recorded publicly on the board (e.g., "Duel fought: A wins," "Apology accepted," "Defection exposed").  
    - **Token Payoffs (per round):**  
      | Choice Pair                     | Challenger Outcome | Challenged Outcome | Public Board Record          |  
      |--------------------------------|--------------------|--------------------|------------------------------|  
      | Uphold vs. Uphold              | +1 token upgrade   | -1 token downgrade | "Duel fought: [Winner] wins" |  
      | Uphold vs. Negotiate           | +0 (no change)     | -1 downgrade       | "Apology accepted"           |  
      | Uphold vs. Defect              | +1 upgrade         | -2 downgrades      | "Defection exposed"          |  
      | Negotiate/Defect vs. Anything  | -1 downgrade       | Outcome-based      | "Dishonorable avoidance"     |  
      - *Upgrade/downgrade:* Exchange token (e.g., silver → gold for upgrade; gold → silver for downgrade).  
      - Pamphleteers gain +1 upgrade if they expose a defection (Uphold vs. Defect).  
  - **Timeline:**  
    - 0–5 min: Assign roles/tokens, explain rules.  
    - 5–15 min: Round 1 challenges (pair, choose, record outcomes, adjust tokens).  
    - 15–25 min: Round 2 challenges (new pairs, repeat).  
    - 25–30 min: Finalize token adjustments.  

  #### **Phase Two: Anonymous Revelation (10 min)**  
  *Mechanism Focus: Aggregate defection visible but identities hidden—common knowledge without common acknowledgment.*  
  - **Rules:**  
    - Facilitator reveals an **anonymous ledger** showing aggregate defection:  
      - *Example:* "Total Defections: 7/24 choices (29%) | Uphold: 10 | Negotiate: 7 | Defect: 7."  
    - Participants may discuss the ledger **in character** (e.g., "This society is decaying!") but **cannot accuse individuals**.  
    - Tokens remain unchanged.  
  - **Timeline:**  
    - 30–35 min: Reveal ledger, allow silent review.  
    - 35–40 min: Structured role-based discussion ("What does this mean for our honor code?").  

  #### **Phase Three: Transparency Shock & Silenced Knowledge (15 min)**  
  *Mechanism Focus: Identity exposure with enforced silence—common knowledge unacknowledged, collapsing performance.*  
  - **Rules:**  
    - Facilitator posts each participant’s **choices and outcomes** publicly (e.g., "Duelist A: Round 1 Defect, Round 2 Uphold").  
    - **Social rule:** No one may verbally acknowledge specific revelations. Penalty: **Token downgrade** (facilitator enforces immediately).  
    - Participants discuss: "How should our society reform the honor code?" while avoiding defection specifics.  
    - *Example of silenced knowledge:* If a Duelist defected, others see it but cannot say, "You betrayed us!"  
  - **Timeline:**  
    - 40–42 min: Reveal identities/choices.  
    - 42–50 min: Guided discussion with silence rule enforced.  
    - 50–55 min: Prepare for debrief (seat by tokens).  

  ---

  ### **Debrief (35 min)**  
  *Seating/Speaking Order:* Gold (front, speak first), Silver (middle, speak second), Bronze (back, speak last).  
  **Guiding Questions & Theoretical Mapping:**  
  1. **Phase One Reflection (5 min):**  
     - *Question:* "How did your role influence your choices? Did public outcomes align with private intentions?"  
     - **Bernard Williams:** Highlights the "thick concepts" of honor (e.g., "courage," "shame") as socially embedded. Participants performed these through public outcomes while hiding private calculations—sustaining mutual pretense.  

  2. **Phase Two Reflection (10 min):**  
     - *Question:* "How did the anonymous ledger change your perception of the norm? Why couldn’t you act on it?"  
     - **Kwame Anthony Appiah:** Mirrors his analysis in *The Honor Code*: Norms collapse when knowledge of widespread defection circulates, but the "honor world" persists because identities remain opaque. Here, aggregate data weakened the norm but didn’t dissolve it—individual invisibility preserved performative space.  

  3. **Phase Three Reflection (15 min):**  
     - *Question:* "Why did the norm collapse? Was it morality, interests, or something else?"  
     - **Your Mechanism (Strategic-Opacity Collapse):**  
       - Phase Three forced common knowledge of defection (transparency shock) but prohibited acknowledgment (silence rule).  
       - Honor became unperformable because everyone could observe defections, yet social rules forbade addressing it—shattering mutual pretense.  
       - Collapse occurred without moral debate or payoff shifts; the **conditions for enacting honor dissolved** when opacity broke.  

  4. **Synthesis (5 min):**  
     - *Question:* "How might this apply to real-world norms (e.g., corporate ethics, social media)?"  
     - Emphasize the **temporal lag** between visibility (Phase Two) and acknowledgment (Phase Three) as the core reproducible feature.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Premature Verbal Breach (Phase Three):**  
     - *Likelihood:* High. A participant may exclaim, "Duelist A defected!"  
     - *Solution:* Immediately enforce token downgrade (e.g., gold → silver) without discussion. Reiterate: "The rule forbids acknowledgment—this is part of the collapse." *Do not pause simulation.*  

  2. **Token Demotion Resistance (Phase One):**  
     - *Likelihood:* High-status players (e.g., Duelists) may protest losing gold tokens.  
     - *Solution:* Calmly state: "Token changes reflect societal judgment, not my opinion. Refusal breaches the honor code." If persistent, assign a bronze token ("social ostracism").  

  3. **Overly Strategic Play:**  
     - *Likelihood:* Creditors/Pamphleteers may openly defect to "win."  
     - *Solution:* Remind them role-playing trumps "gaming" outcomes. Use token penalties for out-of-character behavior.  

  ---

  ### **Strengths, Limitations & Closing Notes**  
  - **Reproducible Feature:** The **temporal lag between visibility and acknowledgment** (Phase Two → Three) is experientially palpable. Participants feel the frustration of knowing defections but being unable to act—miroring real opacity collapse.  
  - **Irreproducible Feature:** The **long-term societal erosion** of honor norms. Simulations compress time; real collapse involves gradual gossip, institutional decay, and generational shift.  
    - *Closing Supply:* In your remarks, emphasize this gap: "Unlike this simulation, historical norm collapse (e.g., dueling’s end) required years of suppressed knowledge becoming unsuppressible. Today, social media accelerates visibility—but acknowledgment remains contested."  

  This design ensures the mechanism emerges from lived experience, not lecture. Participants leave understanding that norms expire when the scaffolding of mutual pretense collapses—not when ideas or incentives change. Run it cold, enforce rules rigidly, and let the debrief crystallize insights.
