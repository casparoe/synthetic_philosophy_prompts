prompt: |-
  I am working through what makes consent valid, with particular attention to how deception, coercion, and competence interact, and I want to test my intuitive verdicts rather than reconstruct a literature. Here are my judgments on eight concrete cases, followed by what I need from an analysis.

  First, a fully literate patient consents to surgery after an honest statistical disclosure of risks; this seems clearly valid. Second, a researcher describes a study as involving only “mild discomfort” while deliberately omitting a documented risk of severe anxiety that is central to the protocol; I judge this invalid, because the deception concerns the very harm to which consent is given. Third, a tenant signs a lease after the landlord falsely claims another applicant will take the unit within hours, a claim fabricated solely to pressure agreement; I take this as invalid, though I am unsure whether the defect is coercion proper or the deception that manufactures urgency. Fourth, a patient with diagnosed mild cognitive impairment consents to an elective procedure after demonstrating accurate recall and reasoning tailored to that specific decision; despite the diagnosis, I consider the consent valid. Fifth, a graduate student agrees to an unpaid, open-ended research commitment after being told that “this level of dedication is the norm in the field,” with no explicit threat but with obvious implicit career consequences; here my judgment wavers between treating it as valid institutional consent and treating it as structurally coerced. Sixth, an individual agrees to biometric data collection after being presented with technically accurate terms of service in dense legal language they do not command; comprehension is practically impossible, yet nothing is misrepresented. I am inclined to call this invalid, but it feels structurally close to the first case, with linguistic competence substituting for medical literacy. Seventh, a person with severe but stable anxiety consents to exposure therapy requiring direct confrontation of a phobia; they understand the protocol precisely, though their anxiety systematically distorts risk assessment. I take this as valid, since the distortion does not eliminate autonomous choice. Eighth, and this is the case I keep returning to: a parent gives consent on behalf of an adolescent child for an irreversible cosmetic procedure that the child requests but that the parent suspects the child will deeply regret upon reaching adulthood. The parent understands all risks, faces no deception or coercion, and acts in good faith; yet the consent seems to bind a future self whose values may differ radically. I feel this should be invalid, but I cannot fix whether the defect lies in the parent’s authority to bind another, in the irreversibility of the act, or in the child’s present incompetence to authorize such a proleptic commitment.

  I have tentatively wondered whether the distinction between transactional consent—to a discrete, bounded act—and proleptic consent—binding a future self across a change in values or capacities—can organize these cases. But I am not committed to it.

  What I want is a precise principle, or a small competing family, that captures these verdicts. For each candidate, please specify: (i) the clause governing deception and the case that motivates it; (ii) the clause governing coercion and structural pressure, with its motivating case; (iii) the clause governing competence, stating clearly whether it is decision-relative or global, and with its motivating case; (iv) its verdict on the graduate-student case and on the biometric-data case, which I have left unresolved; (v) its verdict on the proleptic-consent case; and (vi) an honest statement of which of my eight verdicts the principle must overturn to maintain coherence. If no single principle accommodates all eight without excessive complexity, present the leading candidates, state the crux that divides them, and indicate what further case or distinction would adjudicate between them. Do not provide bibliographies, reading lists, or citations; I need the reasoning, not the literature map.
reasoning: |-
  Okay, the user presents eight detailed cases where consent validity is in question and seeks a precise principle to explain their judgments. Let me start by understanding each case and the user's verdicts. The user is grappling with how deception, coercion, and competence affect consent, especially in tricky scenarios like the graduate student and biometric data cases. They also introduced the idea of transactional vs. proleptic consent, which might be key.

  First, I need to map out each case and the user's verdicts. Cases 1, 2, 4, 6, 7 have clear verdicts, but cases 3, 5, 6, and 8 are uncertain. Case 3 involves deception creating urgency, Case 5 is about structural coercion, Case 6 is about incomprehensible terms, and Case 8 is proleptic consent. The user wants a principle that explains all these without overturning too many verdicts.

  Looking at the core principles, autonomy seems central. Valid consent requires sufficient information, absence of control by others, and decision-making capacity. For deception, the key is whether the deception relates to core aspects of the decision. In Case 2, omitting severe anxiety risk invalidates consent because it's central. Case 3's fabricated urgency might also affect core understanding, making consent invalid.

  Coercion involves threats that remove reasonable alternatives. Case 5's implicit career threats might not be explicit enough to count as coercion, but structural pressures could still undermine autonomy if alternatives are unviable. The graduate student's situation is tricky because academia often has such norms; maybe it's valid if the student can choose other paths.

  Competence should be decision-specific, as in Case 4 where mild impairment doesn't invalidate consent if the specific decision is understood. Case 7's anxiety distorts risk assessment but doesn't eliminate competence, so consent is valid. Case 8 is problematic because the adolescent's future self might disagree, questioning the parent's authority to bind them.

  The biometric data case (6) is tough. Technically accurate but incomprehensible terms might not meet informational sufficiency. Unlike Case 1, where the patient is literate, here the person lacks linguistic competence, making consent invalid. This ties into the need for comprehension, not just disclosure.

  Drafting a principle like the "Core Understanding Principle" could work. Deception or omission that distorts core understanding invalidates consent. Coercion involves threats that eliminate reasonable alternatives. Competence is decision-specific. This would validate the user's verdicts except Case 5 (graduate student) might be valid if structural pressures don't count as coercion without explicit threats. Case 8 would be invalid due to lack of authority for proleptic consent.

  Alternative principles might focus on reasonable alternatives for coercion, making Case 5 invalid if the student has no real choice. But that could conflict with other cases. The crux is whether structural pressures without explicit threats count as coercion. A test case could involve an employee pressured to work overtime with implied job loss—if consent is invalid, then structural coercion matters.

  The user's deeper need is a coherent framework that respects autonomy without being too rigid. They might be in ethics, law, or medicine, needing practical guidelines. Unspoken needs could include reconciling theoretical principles with real-world complexities, especially in institutional settings where power imbalances are subtle.
answer: |-
  Here is a candidate principle designed to capture your intuitive verdicts, followed by analysis addressing your specific requests:

  **The Core Understanding and Voluntary Choice Principle (CUP):**
  Consent is valid only if:
  1.  **The agent possesses sufficient understanding of the core nature and material consequences of the act.**
  2.  **The agent's choice is voluntary, meaning it is not caused by another agent's intentional control (via deception, coercion, or exploitation of incapacity) that undermines the agent's reasoned deliberation on the core nature and material consequences.**
  3.  **The agent possesses decision-specific competence: sufficient cognitive and emotional capacity to engage in reasoned deliberation specifically about this act and its core nature/material consequences at the time of consent.**

  **Analysis:**

  *   **(i) Deception Clause & Motivating Case:**
      *   **Clause:** Deception (including material omission) invalidates consent if it distorts the agent's understanding of the **core nature or material consequences** of the act to which consent is given.
      *   **Motivating Case:** Case 2 (Researcher omitting severe anxiety risk). The deception concerns a material consequence central to the act's core nature (the harm risked/endured). Case 3 (Landlord's fabricated urgency) also motivates this clause, as the deception manufactures false material consequences (imminent loss of opportunity) central to the transactional decision.

  *   **(ii) Coercion Clause & Motivating Case:**
      *   **Clause:** Coercion invalidates consent if it involves an **intentional threat by another agent** that renders refusal an *unreasonable* alternative by imposing a severe, wrongful, and avoidable cost. "Structural pressure" (lack of alternatives, power imbalance) absent a *specific, intentional threat* from the consent-recipient may undermine voluntariness but requires separate evaluation for exploitation.
      *   **Motivating Case:** Case 3 (Landlord's false deadline). The landlord's intentional fabrication constitutes a deceptive threat (imposing the cost of lost housing opportunity), rendering refusal unreasonable. The clause distinguishes this intentional control from Case 5's structural pressure.

  *   **(iii) Competence Clause & Motivating Cases:**
      *   **Clause:** Competence is **decision-specific**. It requires sufficient cognitive ability (e.g., comprehension, reasoning) and emotional stability to understand the core nature/material consequences and engage in deliberation *specific to this decision*. Emotional states (e.g., anxiety) or diagnoses (e.g., cognitive impairment) are relevant only if they demonstrably impair this specific deliberative capacity.
      *   **Motivating Cases:** Case 4 (Mild Cognitive Impairment) - Valid because competence is specific to demonstrating recall/reasoning for *this* decision. Case 7 (Severe Anxiety) - Valid because while anxiety distorts risk assessment, it does not eliminate the capacity for understanding and deliberation about the core act.

  *   **(iv) Verdicts on Unresolved Cases:**
      *   **Graduate Student (Case 5):** **Invalid Consent (Coercion/Exploitation).** While the statement ("norm in the field") isn't an explicit threat, it originates from the institution/advisor (an agent) and functions as an intentional communication designed to pressure by implying severe career consequences (cost) for refusal. This constitutes an implicit, intentional threat (control) making refusal unreasonable. It exploits the structural power imbalance. *(Overturns your potential "valid institutional consent" intuition)*.
      *   **Biometric Data (Case 6):** **Invalid Consent (Understanding).** While not deceptive, presenting information in a form practically incomprehensible to the agent prevents them from achieving "sufficient understanding of the core nature and material consequences." Linguistic competence is a prerequisite for understanding, unlike Case 1 where literacy enables comprehension. The core nature/consequences remain obscured. *(Confirms your "invalid" inclination)*.

  *   **(v) Verdict on Proleptic Consent Case (Case 8):** **Invalid Consent.** CUP focuses on the agent (the parent) and the act *at the time of consent*. The parent possesses understanding, voluntariness, and competence. **However**, the defect lies outside CUP's core elements: the *authority* of the parent to consent to an irreversible act that primarily impacts the *child's future self* and binds that future self against potential fundamental value changes. CUP highlights that the principle lacks a clause covering the legitimacy of binding future selves or proxy authority for value-altering irreversible acts. Your intuition points to a defect in authority/prolepsis itself.

  *   **(vi) Overturned Verdict & Necessity:** To maintain coherence, CUP **must overturn your tentative verdict on Case 3 (Landlord)**. You were unsure if the defect was deception or coercion. CUP clarifies that **both** are present and either invalidates consent: the deception distorts core understanding (material consequence: imminent loss), *and* the deception constitutes an intentional threat creating coercion (imposing unreasonable cost for refusal). The verdict remains "invalid," but CUP specifies the dual defect. *(It does not overturn any of your firm "valid" or "invalid" verdicts on Cases 1,2,4,7; it confirms your inclinations on 5 and 6; and identifies Case 8's defect as outside its scope).*

  **Addressing Prolepsis and Alternatives:**

  *   **Limitation of CUP:** CUP excellently handles Cases 1-7 by focusing on the agent's state *at the moment of consent* regarding understanding, voluntariness (freedom from control), and specific competence. It falters on Case 8 precisely because the core problem isn't the parent's state *at consent*, but the act's nature (irreversible, binding future self) and the proxy's limited authority for such acts.
  *   **Alternative Principle: The Future-Binding Authority Restriction (FBAR):** Add a clause to CUP: "4. For consent binding a future self or given by a proxy for another, the act consented to must not be irrevocable in a way that could fundamentally conflict with the future self's reasonably anticipated core values or autonomy interests, unless necessary to prevent severe imminent harm."
      *   *Crux vs. CUP:* FBAR explicitly addresses prolepsis and proxy authority for irreversible, value-impacting acts. It would render Case 8 invalid based on Clause 4.
      *   *Adjudication Case:* Would FBAR also invalidate parental consent for an *adolescent's* urgent, life-saving, but sterilizing surgery? If "yes" (due to irreversibility conflicting with future values), FBAR may be too restrictive. If "no" (due to "severe imminent harm" exception), it captures the distinction. CUP would likely validate such consent (parent competent/understanding/voluntary), failing to capture the future-binding concern.
  *   **Leading Candidates & Crux:**
      *   **CUP:** Strong on deception, coercion, competence for the consenting agent *now*. Weak on future-binding/proxy authority for irreversible value choices. Validates Case 8 (overturning your verdict).
      *   **CUP + FBAR:** Captures all your verdicts (invalidating Case 8 via FBAR). Adds complexity by introducing a distinct "future-binding" condition.
      *   **The Crux:** Is the defect in Case 8 *primarily* about the parent's consent (which passes CUP) or about the *nature of the act* and *limits of proxy authority*? Your intuition points to the latter. A case requiring FBAR: Consent for an elective, irreversible medical experiment offering minor short-term benefit to a competent adult, where significant risk of profound long-term value change exists. If consent seems invalid *despite* passing CUP, FBAR (or similar) is needed. If it seems valid, CUP alone suffices.

  **Conclusion:** Your intuitions are best captured by **CUP supplemented with a Future-Binding Authority Restriction (FBAR Clause 4)**. This combination validates Cases 1, 2, 4, 7; invalidates Cases 3, 5, 6, and 8 (via FBAR); and provides clear clauses for deception (core understanding distortion), coercion (intentional threat), competence (decision-specific), and the proleptic/proxy problem (irreversibility vs. future values). Without FBAR, CUP must validate Case 8, conflicting with your verdict. The core tension is whether validity hinges *solely* on the consenter's state during the transaction (CUP) or also on the act's impact on future autonomy when values may change (requiring FBAR).
