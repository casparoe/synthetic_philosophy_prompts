answer: |-
  Here's a principled resolution grounded in the **Fundamental Symmetry Principle (FSP)**, which distinguishes between *settled physics* and *speculative extensions*. This principle delivers your verdicts consistently, resolves the tension between Cases 1 and 5, and clarifies the AI case. I'll first state the principle, then apply it to your cases, and finally address the AI scenario.

  ---

  ### **The Fundamental Symmetry Principle (FSP)**
  > **Physical theories with fundamental symmetries (e.g., Lorentz invariance) rule out ontological distinctions that violate those symmetries. However, this constraint is conditional on the validity of the symmetries in the relevant domain. Future theories that break these symmetries fundamentally could revive excluded ontologies, but current evidence compels adherence to symmetries where empirically established.**

  This principle:
  1. Treats symmetries as *physically constraining* (not merely mathematical),
  2. Accepts that symmetries can be *domain-specific* (e.g., SR vs. GR/cosmology),
  3. Distinguishes *current physics* from *speculative future physics*.

  ---

  ### **Application to Your Cases**
  | **Case** | **Your Verdict** | **Resolution via FSP** |
  |----------|------------------|------------------------|
  | **1** (SR inertial frames) | Physics denies global "now"; presentism false | **Consistent**: Lorentz symmetry (empirically settled in SR) forbids a privileged foliation. Presentism requires such a foliation → ruled out. |
  | **2** (Cosmological time) | Rietdijk-Putnam weakened globally | **Consistent**: FSP applies only to *fundamental* symmetries. The CMB frame is a *contingent*, non-fundamental feature of our universe (emerging from initial conditions). It doesn’t violate Lorentz symmetry locally but breaks it *globally* as a boundary condition. No revival of presentism, as the foliation isn’t fundamental. |
  | **3** (Indexical "now") | Compatible with block view | **Consistent**: The "now" is perspectival (like "here"), not ontological. Symmetry principles constrain ontology, not phenomenology. |
  | **4** (Temporal asymmetry) | Block universe accommodates this | **Consistent**: Asymmetry (entropy, causality) is compatible with Lorentz symmetry. It arises from initial conditions (Past Hypothesis), not a fundamental foliation. |
  | **5** (Speculative future physics) | Eternalism defeasible if symmetries break | **Consistent**: FSP explicitly allows that *future theories* violating Lorentz symmetry (e.g., quantum gravity with a preferred foliation) could revive presentism. Current symmetries compel eternalism *now*, but this is contingent on empirical adequacy. |

  **Resolution of Tension between 1 and 5**:  
  - Case 1 relies on *current, empirically settled symmetries* (Lorentz invariance in SR).  
  - Case 5 acknowledges that *future physics might break these symmetries*.  
  - **No contradiction**: FSP treats symmetries as defeasible physical postulates, not metaphysical necessities. Your verdict in Case 1 is correct *given current physics*, while Case 5 correctly notes that future evidence could override it.  

  ---

  ### **The AI Case: Global "Functional Now"**
  **Scenario**: An AI integrates information across its past light cone and labels the boundary of its processing as a "functional now."  

  **Classification via FSP**:  
  This is an **indexical artifact**, not genuine presentness. Here’s why:  
  1. **No physical basis**: The AI’s "now" is defined by computational pragmatics (data processing latency), not a fundamental physical foliation.  
  2. **Violates Lorentz symmetry**: If the AI moves relativistically, its "functional now" would conflict with inertial frames, violating the FSP’s constraint against privileged foliations.  
  3. **Analogy to "here"**: Just as labeling a location "here" doesn’t ontologically privilege that point, the AI’s "now" reflects its operational perspective, not spacetime structure.  

  **Verdict**: Purely indexical, with no ontological implications for time.  

  ---

  ### **What’s Settled vs. Contested**
  | **Aspect** | **Settled** | **Contested** |
  |------------|-------------|---------------|
  | **Relativity of simultaneity (SR)** | Inertial frames lack privileged simultaneity; no global "now" in SR. | — |
  | **Block universe in SR** | SR is incompatible with presentism *if* Lorentz symmetry is fundamental. | Whether SR *forces* eternalism (some argue it’s compatible with tense theories; minority view). |
  | **Cosmological time** | CMB defines a *practically unique* global frame in our universe. | Whether this frame is *ontologically privileged* (e.g., Ellis argues yes; Earman notes it’s non-fundamental). |
  | **Quantum gravity** | — | Whether it requires a foliation (e.g., semiclassical quantum gravity may allow one; loop quantum gravity/covariant QG typically do not). |
  | **Rietdijk-Putnam in GR** | — | Whether global hyperbolicity (allowing a cosmic time) *defeats* the argument (Savitt: yes; Putnam: no—foliation is non-unique). |

  ---

  ### **If Simplicity Forced Abandoning One Verdict**
  You would need to **drop Case 2’s implication that cosmological time weakens Rietdijk-Putnam**.  
  - **Why**: Rietdijk-Putnam relies on *SR’s relativity of simultaneity* to deny a global present. GR/cosmology doesn’t restore a *fundamental* foliation—it only adds a *contingent* one. Thus, the argument still holds: without a *physically necessary* foliation, no objective present exists.  
  - **Simpler stance**: Eternalism follows from Lorentz symmetry (SR/GR locally); cosmological time is a contingent feature without ontological weight.  

  ---

  ### **Summary**
  - **Principle**: Fundamental symmetries constrain ontology; defeasible by future physics.  
  - **Verdicts**: All preserved under FSP.  
  - **AI Case**: "Functional now" is indexical, not ontological.  
  - **Tension resolved**: Case 1 (current physics) and Case 5 (future physics) are reconciled via the defeasibility of symmetries.  
  - **Contested issues**: Cosmological time’s status and quantum gravity’s foliation requirements remain open.  

  This maintains rigor while respecting the line between established physics and philosophical interpretation. If future quantum gravity violates Lorentz symmetry fundamentally, your Case 5 escape remains viable—but until then, SR+GR support eternalism.
