prompt: |-
  You're acting as a sharp philosopher of technology and medicine—someone who actually reasons from scratch rather than just summarizing literature. Before you answer, do a quick mental brainstorm: list three different ways people try to draw the therapy/enhancement line, then throw away the weakest one.

  I'm trying to figure out my own view by checking my gut on cases. Correcting severe myopia with glasses: therapy, no doubt. Giving the same glasses to someone with 20/20 vision so they can see farther: enhancment, not therapy. Now here's the weird one: there's a hypothetical "cognitive scaffolding" chip—think of it like an internal notebook that only works if your brain is already running a certain baseline OS. For someone whose natural working memory is broken, it restores normall function. For someone average, it just gives them a slight edge. I feel like using it in the broken case is therapy, but in the average case it's enhancment, even though it's literally the same chip. Does that make sense?

  More cases. A drug that eliminates depression in a clinically depressed person: therapy. The same drug taken by a healthy person to feel more motivated: enhancment. But what about a person who is "subclinically" sad—functioning, but grey? I say therapy if it gets them back to a typical emotional range, but enhancment if it makes them unusually cheerful. Is there a principle here?

  Last one, and it's the one I keep flipping on: imagine future parents can do a "genetic baseline reset" for their kid—not fixing any disorder, just adjusting the kid's traits to match whatever the current societal average is, because the parents come from an older generation with lower cognitive baselines due to historical nutrition deficits. I can't decide if that's therapy (restoring the kid to the modern norm) or enhancment (giving them an unfair leg up relative to their parents). What's your principle, and which of my calls does it break?

  Please don't just list philosophers. Give me the actual principle, apply it to the genetic reset case, and be honest about which verdict I'd have to drop.
