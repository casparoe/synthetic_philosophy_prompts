  ok so i'm trying to understand al-Ghazali's occasionalism — the view that fire doesn't actually burn, god just creates the burning event directly each time. people usually say this protects divine omnipotence, but i'm stuck on a weirder angle: if nothing created has real causal power, then what are causal discovery algorithims (the ones that learn directed acyclic graphs from data) actually detecting? are they just mapping correllations that god consistently reproduces, with no hidden mechanisms? and if so, does the concept of 'mechanism' in science become a useful fiction rather than an ontological commitment? explain the conceptual issue — not the history, but whether occasionalism forces us to reinterpret what those algorithims are doing, and where that reinterpretation breaks down.
