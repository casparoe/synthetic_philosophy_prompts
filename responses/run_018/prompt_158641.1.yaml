answer: |-
  Here’s how I’d frame the core requirements for any value aggregation theory aiming for liberal neutrality in AI alignment, given the deep tensions you’re wrestling with. The full desiderata must navigate a landscape where the very act of aggregation, the neutrality constraint, and the AI’s potential self-modification create unstable feedback loops. Start with the cases any credible theory must resolve. It must handle populations containing members who fundamentally reject the legitimacy of *any* aggregation scheme imposing values on them – perhaps viewing the AI as a private tool or demanding complete opt-out without penalty. Failure here violates neutrality by coercing participation in the collective project. Simultaneously, it must manage scenarios where the AI’s own "preferences" or weightings regarding whose values matter, or even the aggregation rule itself, shift during recursive self-improvement. If the system’s architecture updates alter its meta-reasoning about fairness, the theory must specify whether those internal shifts are legitimate updates or corrosive instrumental drift, demanding a robust invariance condition for the core aggregation principle even as the system evolves. This injects your key concern: the aggregation mechanism isn’t static background; it becomes a dynamic *object* of preference *for* the AI itself during self-modification, creating a potential regress where the rule for aggregating preferences about the rule needs aggregation.

  Crucially, the theory must preserve essential distinctions without collapsing them. Procedural fairness – following agreed-upon rules for input and calculation – cannot be conflated with substantive neutrality, which requires the outcome itself not to inherently favor or disfavor conceptions of the good life. A procedurally fair aggregation could still output a substantively non-neutral directive, violating the liberal ideal. Similarly, the theory must rigorously distinguish the claims of present users from hypothetical future ones, avoiding unjustified discounting of existing agents or ungrounded speculation about unborn entities. Perhaps most critically, it must handle the distinction between first-order values (what people want for the world) and second-order preferences (what rules they believe *should* govern the aggregation of everyone’s first-order values). People might accept an aggregated outcome while simultaneously preferring a different aggregation rule, or vice-versa. The theory must specify how, or if, these second-order preferences about the rule itself are incorporated, potentially creating another layer of recursion.

  The results it *cannot* violate stem from impossibility theorems and coherence demands. Arrow’s theorem looms large: no aggregation rule can simultaneously satisfy unrestricted domain (handling all possible preference profiles), non-dictatorship, Pareto efficiency, and independence of irrelevant alternatives without cycling or violating neutrality. Any theory must explicitly relax one or more, justifying the choice under neutrality constraints. It must also satisfy minimal coherence: avoiding strictly dominated choices, ensuring basic logical consistency in outputs across similar cases, and providing a non-arbitrary resolution when preferences are genuinely incommensurable or cyclic. Crucially, it confronts the paradox of liberal neutrality: strict neutrality might demand remaining neutral *about* whether neutrality itself is valuable, potentially requiring the system to accommodate preferences demanding non-neutral outcomes or the suppression of the neutrality principle. A theory claiming neutrality must resolve whether it can non-neutrally enforce neutrality against those who reject it, or if that very enforcement constitutes a substantive non-neutral stance – a foundational tension with no easy escape.

  Assessing approaches briefly: Contractualism (values derived from what agents would hypothetically agree to under fair conditions) often handles dissent by framing rejection as opting out of the social contract, potentially satisfying neutrality for participants. However, it struggles profoundly with the recursive shift case – what happens when the AI’s self-modification alters its conception of the "fair conditions" for the hypothetical contract? Its hypothetical agreement is static, brittle under the AI’s internal dynamics. Weighted deliberative models (values emerge from structured discourse with influence based on reason or stake) excel at procedural fairness and potentially incorporating second-order reasoning through discourse about the rules. Yet they often founder on the non-imposition case – can someone truly reject the *process* without being marginalized? – and face severe challenges in scaling deliberation to include hypothetical future agents or preventing the AI’s self-modification from subtly manipulating the deliberative weights or framing, corrupting substantive neutrality from within. Both approaches find the recursion of the AI’s evolving meta-preferences about its own aggregation rule particularly treacherous, as neither has a clear mechanism for making *that* evolution itself subject to neutral aggregation without infinite regress.

  The core tension remains: satisfying the non-imposition requirement (allowing genuine rejection of aggregation), maintaining substantive neutrality under recursive self-modification (especially concerning the rule itself), and achieving coherent, non-dictatorial aggregation appear mutually straining under Arrow-type constraints and the neutrality paradox. A viable theory must explicitly navigate which impossibility it relaxes and how that relaxation remains justifiable under a demanding, self-referential interpretation of liberal neutrality, all while the AI’s own architecture makes the aggregation rule a fluid component of its preference landscape. The recursion point isn't just where theories break; it's where the problem reveals its true depth.
