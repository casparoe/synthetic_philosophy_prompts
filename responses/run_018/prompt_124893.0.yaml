prompt: |-
  I was having a chat with my friend after a lecture on moral change and she summed up this whole Williams/Appiah line for me. She said basically that Bernard Williams and Kwame Anthony Appiah both think moral revolutions never happen because people suddenly see that a practice is immoral through rational arguement. Instead, they think norms like slavery and dueling collapse when the social groups that benefit from them realise the practice is making them look ridiculous or hurting their economic intersts. For slavery, Williams apparently argued that abolition wasn't driven by abolitionist arguements about human equality but by the fact that industrial capitalism made slave labour unprofitible and embarrassing for Britain, so the moral argument was just window dressing after the fact. And Appiah, she said, showed that dueling died out in Britain not because anyone proved it was wrong, but because the aristocrasy realised that dueling made them seem barbaric to the rising middle class whose respect they actually wanted. So her takeaway was that if you care about ending some harmful norm today, moral philosophy is basically useless — you should just work on shifting the honour codes and materal interests of the elite who keep it going. She also mentioned something about Appiah distinguishing between honour-worlds and dignity-cultures, but said that just reinforces the point that arguements only work once the culture has already shifted.

  I'm not sure this is fair — it sounds a bit too cynical, and I'm not convinced Williams would say arguments are literally useless. But I don't know the texts well enough to say where the misrepresentation is. Could you go through her summary and tell me what's accurate, what's a subtle distortion, and what's just wrong? In particular, does the conclusion that moral philosophy is pointless follow from what Williams and Appiah actually claim? And is she right to treat them as saying essentially the same thing, or does Appiah's work on honour-worlds versus dignity-cultures actually change the picture? I'd also like to know whether her claim about slavery being driven mainly by economic embarrassment is something Williams actually holds, or if that's a common oversimplification.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a conversation with a friend about moral revolutions, specifically referencing Bernard Williams and Kwame Anthony Appiah. The friend summarized their views as saying moral changes happen not through rational argument but due to social and economic factors, like elites protecting their interests or avoiding embarrassment. The user is skeptical, thinking this is too cynical, and wants to know where the friend's summary might be off.

  First, I need to recall Williams' and Appiah's actual positions. Williams in *Shame and Necessity* discusses the role of shame in moral motivation, but he doesn't dismiss rational arguments entirely. He argues that ethical life involves both rational and non-rational elements. The user's friend claims Williams thought abolition was driven by economics and embarrassment. But Williams actually points out that the moral arguments against slavery were crucial, even if they needed historical conditions to take hold. So the friend oversimplifies by reducing it to just economics.

  Then there's Appiah's *The Honor Code*. He uses examples like dueling and foot-binding to show how honor played a role in ending these practices. The friend says dueling died because aristocrats wanted middle-class respect, which is part of it. But Appiah emphasizes that honor isn't just about economics; it's about social recognition. Also, he argues that reformers used honor to motivate change, so moral arguments were part of the process. The distinction between honor-worlds and dignity-cultures is important here. Dignity-cultures focus on intrinsic worth, which can shift honor dynamics. But Appiah doesn't say arguments are useless; they need to resonate within the existing honor framework.

  The user is concerned that their friend's conclusion makes moral philosophy pointless. Both Williams and Appiah actually see moral arguments as necessary but not sufficient. They need the right social context to gain traction. The user might be worried that this view undermines activism or ethical advocacy, but both philosophers suggest that understanding the social context makes arguments more effective, not less.

  Also, the friend treats Williams and Appiah as saying the same thing, but there are differences. Williams focuses on motivation and the psychological basis of ethics, while Appiah provides a mechanism—honor—through which changes occur. Appiah's concept adds nuance by showing how moral shifts can happen within honor systems, which might not be solely about elite interests.

  Regarding slavery, the user questions if Williams really emphasized economics. Williams did note material factors but stressed that moral arguments were essential. The economic reductionism is a common oversimplification. Similarly, Appiah's example of foot-binding shows that moral arguments combined with honor campaigns led to change, not just elite embarrassment.

  The user's deeper need might be to validate their skepticism about the friend's cynicism and to find a balanced view where moral philosophy still matters. They might also want to use this understanding in contemporary activism, knowing how to effectively push for change. Highlighting that both philosophers see moral arguments as part of a larger ecosystem, requiring strategic framing within social contexts, addresses their concern without dismissing the importance of philosophy.
answer: |-
  Your friend's summary captures provocative aspects of Williams and Appiah but significantly oversimplifies and distorts their nuanced arguments, particularly regarding the role of moral philosophy and the causes of moral change. Let's break it down point by point:

  **Accurate Elements:**

  1.  **Rejection of Pure Rationalism:** Both Williams and Appiah *do* strongly reject the idea that moral revolutions happen *solely* or *primarily* because people are suddenly convinced by abstract philosophical arguments about universal principles (like "slavery violates human equality"). They argue that historical change is messier.
  2.  **Importance of Social Factors (Shame, Honor, Interest):** Both emphasize the crucial role of non-rational motivators:
      *   **Williams:** Focuses heavily on **shame** (as opposed to just guilt) and its deep connection to social recognition and identity (*Shame and Necessity*). Practices become unsustainable when they trigger profound shame within the relevant community or undermine the identity that practice was meant to uphold.
      *   **Appiah:** Focuses explicitly on **honor** (*The Honor Code*). Norms collapse when they become sources of dishonor within the relevant "honor-world" – when upholding the norm damages the social standing or self-conception of the group that enforces it. The dueling example is central to his argument.
  3.  **Role of Elites/Enforcers:** Both acknowledge that norms are often sustained by specific groups (e.g., aristocrats, slave-owning classes) whose commitment is essential. Change often requires shifts within *those* groups.
  4.  **Dueling Example (Appiah):** Your friend's description of Appiah's dueling argument is largely accurate. Appiah argues that dueling died among the British elite not primarily because of moral arguments against violence, but because it increasingly made them look ridiculous, irrational, and *dishonorable* in the eyes of the rising middle class, whose respect and sense of "gentlemanly" conduct they began to value more than the older aristocratic honor code that demanded duels. The shift involved a change in what constituted honor within that group.
  5.  **Honor-Worlds vs. Dignity-Cultures (Appiah):** This distinction is key to Appiah. An **"honor-world"** is a social sphere where worth is derived from recognition by peers according to shared codes. A **"dignity-culture"** (influenced by Enlightenment/Kantian ideas) posits inherent worth independent of social recognition. Appiah argues moral revolutions often occur *within* honor-worlds (e.g., aristocrats changing their honor code regarding dueling) or involve the *spread* of dignity-culture ideals that reconfigure existing honor dynamics. He *doesn't* say arguments only work *after* the shift; rather, arguments framed *in terms of* honor or dignity within the relevant cultural context *are* how the shift happens.

  **Subtle Distortions and What's Wrong:**

  1.  **"Moral Revolutions Never Happen Because... Rational Argument":** This is too stark. Neither Williams nor Appiah claims rational argument plays *no* role. They argue it is **insufficient alone** and needs to resonate with or leverage deeper social/psychological forces (shame, honor, identity, interest) to be effective. Arguments often provide the *vocabulary* and *justification* for changes driven by these other forces. They refute the *idealized*, purely rationalist model, not the *existence* of moral reasoning within the process.
  2.  **Slavery Example & Williams:** Your friend's summary of Williams on slavery is a **common and significant oversimplification.**
      *   Williams (*Shame and Necessity*, "The Idea of Equality") *did* critique simplistic narratives of abolition driven *only* by the sudden triumph of Enlightenment equality. He highlighted the importance of changed material conditions (industrialization making slavery less central/efficient) and the role of shame (e.g., the inconsistency of slavery with emerging British self-conceptions of liberty).
      *   **However, Williams explicitly *rejected* the view that moral arguments were mere "window dressing."** He argued that the moral concepts (like freedom, equality, natural rights) were *essential* to motivating abolitionists and framing the issue. The point is that these concepts gained traction *because* they resonated with evolving social realities and identities, not that they were irrelevant. He saw it as a complex interaction, not economic determinism with moral veneer. He would likely argue the economic shifts made the *moral arguments socially palpable and psychologically powerful* (linking to potential shame), not that they rendered the arguments meaningless.
  3.  **"Moral Philosophy is Basically Useless":** This is the **most significant and incorrect conclusion** drawn from their work.
      *   **Williams:** A central theme in Williams' work (e.g., *Ethics and the Limits of Philosophy*) is that ethics is *sui generis* – it involves truth, reasons, and reflection, but these are deeply embedded in human psychology and social forms. Philosophy's role isn't to provide knockdown proofs that instantly change behavior, but to offer **critical reflection, clarification of concepts, and understanding of the psychological and social bases of ethical life.** This understanding is crucial, not useless. He saw moral philosophy as part of the ongoing human conversation about how to live, deeply connected to history and psychology.
      *   **Appiah:** *The Honor Code* is practically a handbook for *how* moral philosophy and activism *can* be effective. His core argument is that **moral arguments *must* engage with the existing "honor economy" to succeed.** To end a harmful practice, you need to make it dishonorable for the group that sustains it. This involves understanding their values and finding ways to show how the practice contradicts their own sense of honor or how a new conception of honor/dignity is superior. This *is* the work of moral persuasion, framed strategically within the relevant cultural context. He uses historical examples precisely to *inform* contemporary moral action. His point is that ignoring honor/social recognition is futile, not that argument is pointless.
  4.  **"Arguments only work once the culture has already shifted":** This misreads Appiah's honor/dignity distinction. Arguments framed *in terms of dignity* might only gain traction *after* a dignity-culture has taken root (or elements of it have infiltrated an honor-world). However, arguments framed *within* the existing honor code ("This practice *actually* makes you look weak/cowardly/uncivilized, not honorable") are precisely the *mechanism* for shifting the culture *before* a full dignity-culture emerges. The foot-binding example in Appiah shows reformers *using* arguments about national shame/international honor to mobilize change within an existing honor-world framework.

  **Are Williams and Appiah Saying the Same Thing?**

  *   **Shared Core:** Yes, they share a deep skepticism towards purely rationalist, ahistorical models of moral progress. Both emphasize the fundamental role of social recognition, identity, and non-rational motivators (shame/honor) in sustaining and changing norms. Both focus on the groups that uphold norms.
  *   **Key Differences:**
      *   **Focus:** Williams' focus is broader philosophical anthropology (shame, necessity, the nature of ethical motivation, the limits of philosophy). Appiah's *The Honor Code* is more focused on providing a specific explanatory mechanism (honor) for moral revolutions and practical lessons for activism.
      *   **Conceptual Tool:** Williams uses **shame** as a key analytical tool, deeply tied to identity and the "internalized other." Appiah uses **honor** (and its relationship to dignity) as his central concept, emphasizing social codes and recognition by peers.
      *   **Practical Implications:** While both reject the "useless" label, Appiah's work is more explicitly designed to offer **strategic guidance** for contemporary moral reformers by showing how to leverage honor dynamics. Williams is more concerned with a fundamental understanding of ethics.

  **Conclusion:**

  Your skepticism is well-founded. Your friend accurately captures Williams' and Appiah's **rejection of pure rationalism** and their **emphasis on social forces like honor, shame, and elite interests** as crucial engines of moral change. The examples of dueling and the *context* for abolition are broadly correct in spirit.

  However, the summary **seriously distorts** their views by:
  1.  **Oversimplifying Williams on slavery** into economic determinism, ignoring his insistence on the essential role of moral concepts and arguments interacting with social change.
  2.  **Misrepresenting their view of moral argument/philosophy** as "useless" or mere "window dressing." Both see moral reasoning and argument as *vital but context-dependent* components of change. Williams sees philosophy as crucial for understanding ethics; Appiah sees strategic moral argument engaging with honor as *the key mechanism* for change.
  3.  **Misinterpreting Appiah's honor/dignity distinction** as rendering arguments impotent before a cultural shift, rather than seeing arguments *as the means* to effect that shift within the honor framework.

  **The accurate takeaway isn't that moral philosophy is pointless, but that it must be grounded in a realistic understanding of human psychology, social dynamics, and history.** Effective moral change requires arguments that resonate with people's deepest senses of identity, worth, and belonging (honor, dignity, avoiding shame) within their specific social context. Williams and Appiah provide profound insights into *how* that grounding works, making moral philosophy not useless, but *more* essential and potentially effective when done well.
