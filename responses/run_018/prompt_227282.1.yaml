prompt: |-
  I am not asking you to adjudicate algorithmic fairness; I want the specification first. Suppose we need a formal criterion of fairness for statistical risk scores — the sort used in pretrial detention, lending, or medical triage — good enough to serve as the standard a regulator could audit against. Write the desiderata list such a criterion must satisfy: for each requirement, give the intuition or case that motivates it (for instance, the public dispute over recidivism scores in which one side documented unequal false-positive rates across racial groups and the other replied that the scores were equally well calibrated), say whether the requirement is genuinely binding or merely the dogma of one camp, and identify which requirement does the most to exclude candidates. Two complications must shape the list. First, the established impossibility results: absent perfect prediction or equal base rates across groups, no score can be simultaneously calibrated within each group and equal in both false-positive and false-negative rates across groups. The list therefore cannot simply conjoin the natural desiderata; state which must be sacrificed and by what principle, and whether the impossibility shows that some demands were never genuine requirements of fairness or instead that every deployable criterion chooses whom to wrong. Second, assess two requirements often smuggled in without argument: that fairness is a property of the score itself rather than of the process that produced it, and that an adequate criterion must be invariant under relabeling the outcome, so that its verdict does not depend on which class is coded as positive. Keep any scoring of existing contenders — calibration, equalized odds, demographic parity — brief and subordinate to the criteria themselves. Close by stating how confident you are in the framework as a whole and singling out the single point you are least sure of.
reasoning: |-
  We are to design a formal criterion for fairness in statistical risk scores, with the understanding that we cannot satisfy all common desiderata simultaneously (due to impossibility results). We must also address two complications: the established impossibility results and two often-unargued requirements (fairness as a property of the score vs. the process, and invariance under outcome relabeling).

  The desiderata list must be motivated by real-world concerns, and for each we should state:
  - The intuition or case that motivates it.
  - Whether it is genuinely binding or merely the dogma of one camp.
  - Which requirement does the most to exclude candidates.

  We must also address:
  1. Which desideratum must be sacrificed and by what principle?
  2. Whether the impossibility shows that some demands were never genuine requirements or that every deployable criterion chooses whom to wrong.

  Additionally, we assess two smuggled requirements:
  a. Fairness as a property of the score (rather than the process).
  b. Invariance under relabeling the outcome.

  We are to keep existing contenders (calibration, equalized odds, demographic parity) brief and subordinate to the criteria.

  Finally, we close by stating confidence in the framework and the least sure point.

  Let's outline the desiderata:

  1. **Group Calibration (or Calibration within Groups):**
     - **Motivation**: In the recidivism risk score example (like COMPAS), one criticism was that the scores were not equally calibrated across races. For instance, if a score of 7 means a 70% chance of recidivism, that should hold for every group. The motivation is that the score should accurately reflect the risk for each individual regardless of group membership.
     - **Binding or Dogma**: Genuine requirement for accurate risk assessment. Without calibration, the score is not a true risk score and may mislead decision-makers.
     - **Exclusion Power**: This is a fundamental requirement for any risk score to be considered valid. It excludes scores that are not well-calibrated in each group.

  2. **Equal False Positive Rates (FPR) across groups:**
     - **Motivation**: In pretrial detention, a false positive (detaining a low-risk defendant) may be more harmful for one group if it occurs at a higher rate for that group. This was a point of contention in the COMPAS debate: one side showed higher FPR for Black defendants, leading to more unnecessary detentions.
     - **Binding or Dogma**: This is a genuine concern for fairness because it addresses the disparate impact of errors. However, it might be seen as dogma by those who argue that base rates matter and that equal FPR may not be achievable without perfect prediction or equal base rates.
     - **Exclusion Power**: This requirement is strong because it directly addresses the harm of false positives and can exclude many otherwise calibrated models.

  3. **Equal False Negative Rates (FNR) across groups:**
     - **Motivation**: In medical triage, a false negative (failing to treat a high-risk patient) could lead to worse outcomes. If one group has a higher FNR, they are more likely to be denied necessary care. This is also critical in public safety (e.g., releasing a high-risk defendant who then reoffends).
     - **Binding or Dogma**: Genuine requirement for avoiding under-protection of certain groups. However, like FPR, it may conflict with other requirements.
     - **Exclusion Power**: Similarly strong as FPR, it can exclude models that leave one group more exposed to negative outcomes.

  4. **Demographic Parity (or Equal Selection Rates):**
     - **Motivation**: In lending, if loans are denied at different rates for two groups with similar creditworthiness, it could indicate discrimination. This is motivated by the idea of equal opportunity in outcomes.
     - **Binding or Dogma**: This is often seen as a strong requirement by those focused on representation, but it might be dogma if the base rates of creditworthiness differ. It is less about the accuracy of the score and more about the outcome distribution.
     - **Exclusion Power**: This requirement is very strong because it forces the score to have the same positive rate in each group, which may require ignoring true risk differences.

  **Impossibility Results**:
  The well-known impossibility result (by Kleinberg, Mullainathan, and Chouldechova, and independently by Friedler et al.) states that, absent perfect prediction or equal base rates, we cannot satisfy all three: calibration, equal FPR, and equal FNR. Therefore, we must sacrifice at least one.

  Moreover, demographic parity is in conflict with calibration if base rates differ. We must choose which to prioritize.

  **Principle of Sacrifice**:
  We must sacrifice one of the error rate constraints (either FPR or FNR) or relax calibration. The choice of which to sacrifice should be guided by the context and the relative harms of the errors. For example:
  - In pretrial detention, we might prioritize equal FPR to avoid unnecessary detention (because false positives are seen as more harmful) and accept some miscalibration or unequal FNR.
  - In medical triage, we might prioritize equal FNR to avoid missing high-risk patients and accept unequal FPR.

  This impossibility shows that we cannot avoid wronging someone: every criterion chooses which kind of error to equalize (or which group to harm more) when base rates differ. Thus, no criterion is perfectly fair to everyone.

  **Assessing the Smuggled Requirements**:

  a. **Fairness as a property of the score vs. the process**:
     - The requirement that fairness is a property of the score (and not the process) is often assumed. However, one could argue that if the process is biased (e.g., using discriminatory features) then the score is unfair regardless of its outcomes. This smuggled requirement is not necessarily justified. In fact, the law (like the U.S. Fair Credit Reporting Act) often looks at both the process and the outcome. Therefore, we should not assume that fairness is solely a property of the score.

  b. **Invariance under relabeling the outcome**:
     - This requires that the fairness criterion should not depend on which outcome is labeled as "positive". For example, in lending, if we label "default" as positive, then a high score is bad. If we label "non-default" as positive, then a high score is good. The criterion should be symmetric. This is a reasonable requirement because the labeling is arbitrary. For instance, equal opportunity (equal TPR) becomes equal FNR when the labels are flipped. Therefore, a criterion that is not invariant under relabeling might be arbitrarily dependent on the coding.

  **Desiderata List with Motivations**:

  1. **Validity (Calibration within Groups)**:
     - **Motivation**: The score must represent the true risk. Without this, the score is not a risk score. Motivated by the need for accuracy and trustworthiness.
     - **Binding**: Genuine requirement for any risk score. Without calibration, the score is not fit for purpose.
     - **Sacrifice?**: We might have to relax strict calibration if we want to achieve other goals, but then it ceases to be a risk score. So, we consider it fundamental.

  2. **Error Rate Balance (either FPR or FNR, but not necessarily both)**:
     - **Motivation**: To avoid disparate impact of errors. We must choose which error to balance based on the context. For example, in criminal justice, false positives (wrongful detention) are often considered more harmful, so we might require equal FPR.
     - **Binding**: Genuine, but we cannot have both. Therefore, we must choose one and justify by the relative harm.
     - **Sacrifice?**: We must sacrifice either FPR or FNR equality if we want to maintain calibration and if base rates are unequal.

  3. **Outcome Symmetry (Invariance under relabeling)**:
     - **Motivation**: The fairness criterion should not depend on an arbitrary choice of which outcome is positive. For example, if we switch the positive label from "recidivate" to "not recidivate", the fairness assessment should not change arbitrarily.
     - **Binding**: This is a genuine requirement for a formal criterion to avoid arbitrariness.
     - **Note**: Some criteria, like demographic parity, are invariant under relabeling because they depend on the decision rate (which is symmetric). Equalized odds (which requires equal TPR and equal FPR) is also invariant because swapping labels swaps TPR and FNR (and FPR and TNR) but the condition remains the same. Calibration, however, is not invariant: if we swap the labels, we would require calibration for the opposite outcome. Therefore, we might need to require calibration for both outcomes? But note: if the score is calibrated for one outcome, it is automatically calibrated for the other? Actually, no: if the score is well-calibrated for the probability of recidivism, then it is also well-calibrated for the probability of non-recidivism? Yes, because P(recidivism | score) = score implies P(non-recidivism | score) = 1 - score. So calibration is invariant under relabeling in this sense? However, the error rates are not symmetric: FPR for recidivism is the TNR for non-recidivism. So if we require equal FPR for recidivism, that is the same as equal TNR for non-recidivism. Therefore, error rate constraints are not invariant: requiring equal FPR for recidivism is not the same as requiring equal FPR for non-recidivism. Thus, the criterion must specify which error we care about, and that breaks symmetry.

     This leads us to a deeper point: the choice of the "positive" label is not arbitrary in terms of harm. We label the outcome that we want to detect as positive. Therefore, invariance under relabeling might not be necessary. We care about the errors for the event that has negative consequences (e.g., recidivism in pretrial, or default in lending). However, we must be explicit about which event we are considering as the adverse outcome.

     Given that, we might drop the requirement of invariance under relabeling because the harm is not symmetric. But then we must be cautious: the criterion should be defined for the adverse event.

  4. **Process Independence?**:
     - We argue that this requirement (that fairness is only about the score) is not necessary. The criterion should allow for consideration of the process if required by the regulatory framework. However, for a purely statistical criterion, we focus on the score's outcomes.

     Therefore, we do not include process-related requirements in the statistical criterion.

  **Which Requirement Does the Most to Exclude Candidates?**
  The requirement for **calibration within groups** is the most excluding because without it, the score is not a risk score. However, in practice, the requirement for **equal error rates (either FPR or FNR)** might be more contentious and lead to more exclusions because it forces a choice that may not be achievable with calibration when base rates differ.

  **The Framework**:

  We propose that the formal criterion must include:

  1. **Calibration within groups**: For each group, the score should equal the true probability of the adverse outcome.

  2. **A chosen error rate balance**: Either:
     - Equal False Positive Rates across groups, OR
     - Equal False Negative Rates across groups.

     The choice between FPR and FNR should be guided by the relative harm of the errors in the specific context.

  We must sacrifice the other error rate. We cannot have both.

  Additionally, we require:

  3. **Specification of the adverse outcome**: The criterion must clearly specify which outcome is considered adverse (the "positive" label) because the error rates are defined with respect to that outcome.

  We do not require demographic parity because it conflicts with calibration when base rates differ. We also do not require process-based fairness as part of the statistical criterion.

  **Confidence**:
  We are confident in the framework as a whole because it directly addresses the impossibility result by making an explicit choice about which error to equalize. It also maintains the core requirement of calibration for a risk score.

  **Least Sure Point**:
  The least sure point is whether we should require invariance under relabeling. We argued that it is not necessary because the adverse outcome is not arbitrary. However, in some contexts, the harm might be symmetric? For example, in a non-adversarial setting? But in risk assessment, the adverse outcome is typically fixed. Still, this point needs more thought.

  Another point of uncertainty is whether we should allow a trade-off between FPR and FNR (e.g., by specifying a cost-weighted balance) instead of requiring exact equality. But that would require a formal mechanism to set the cost, which might be context-dependent and difficult to audit.

  **Closing Framework**:

  The formal criterion for fairness in risk scores must satisfy:

  1. **Group Calibration**: For each protected group, the risk score \( s \) must satisfy:
     \[
     P(Y=1 | s, group) = s
     \]
     This ensures the score is a true risk measure for each group.

  2. **Error Rate Balance (Context-Chosen)**:
     - Either **Equal False Positive Rates**: 
       \[
       P(\hat{Y}=1 | Y=0, group=A) = P(\hat{Y}=1 | Y=0, group=B)
       \]
       (for all groups, with \(\hat{Y}\) being the decision based on the score, typically by thresholding) 
     - Or **Equal False Negative Rates**:
       \[
       P(\hat{Y}=0 | Y=1, group=A) = P(\hat{Y}=0 | Y=1, group=B)
       \]

     The choice between FPR and FNR equality must be justified by the application context and the relative harm of the errors.

  We recognize that due to the impossibility result, we cannot have both error rate balances along with calibration if base rates differ. Therefore, the criterion explicitly sacrifices one error rate balance.

  We do not require demographic parity because it may force decisions that are not aligned with the true risk and may conflict with calibration.

  We do not require the criterion to be invariant under relabeling the outcome because the adverse outcome is defined by the context and the harm structure. However, the criterion must clearly specify the adverse outcome.

  We are about 80% confident in this framework. The least sure point is whether we should allow for a more nuanced error rate constraint (like a weighted combination) and how to set the weights in a regulatory setting.
answer: |-
  Below is a structured desiderata list for a formal fairness criterion in statistical risk scores (e.g., pretrial detention, lending, medical triage), designed to serve as an auditable regulatory standard. The list addresses the tension between competing requirements, impossibility results, and unstated assumptions. Each requirement includes its motivation, whether it is binding or contentious, and its role in excluding candidate criteria. Two complications—impossibility results and smuggled requirements—are explicitly integrated.

  ---

  ### **Desiderata List for Fairness in Statistical Risk Scores**

  1. **Group Calibration (Conditional Accuracy)**  
     - **Motivation**: In the COMPAS recidivism debate, critics showed that Black defendants with the same risk score as white defendants had lower actual recidivism rates. Proponents countered that the scores were "well-calibrated on average" (e.g., a score of 7 implied 70% risk for all groups). Calibration ensures scores reflect true risk probabilities within each group, preventing systematic over/underestimation of risk.  
     - **Binding or Dogma**: Genuinely binding. A score that misrepresents true risk within a group is unfit for purpose, as it undermines the core function of risk assessment.  
     - **Exclusion Power**: High. Excludes scores that achieve error-rate equality at the cost of miscalibration (e.g., forcing equal FPR/FNR via post-processing that breaks calibration).  

  2. **Error-Rate Balance (False-Positive/False-Negative Parity)**  
     - **Motivation**: In pretrial detention, false positives (detaining low-risk individuals) may disproportionately affect marginalized groups (e.g., Black defendants in COMPAS). Conversely, false negatives (releasing high-risk individuals) harm public safety. Error-rate balance prevents one group from bearing disproportionate costs of errors.  
     - **Binding or Dogma**: Contentious. While intuitively appealing, it is mathematically incompatible with calibration under unequal base rates (e.g., recidivism rates differ by race). One camp views it as essential for justice; another sees it as secondary to calibration.  
     - **Exclusion Power**: Highest. Excludes most naïve criteria (e.g., demographic parity) and forces a choice: **sacrifice either FPR or FNR equality** (but not both) to retain calibration.  

  3. **Base-Rate Insensitivity**  
     - **Motivation**: If Group A has a higher base rate of default (lending) or recidivism (pretrial) than Group B, fairness should not require identical outcomes. Forcing equal approval/denial rates (demographic parity) ignores legitimate risk differences, as seen in lending debates where "equal lending rates" could force banks to overlook creditworthiness.  
     - **Binding or Dogma**: Genuinely binding. Requires fairness criteria to account for real-world risk variations rather than imposing artificial parity.  
     - **Exclusion Power**: Moderate. Excludes demographic parity and similar group-agnostic quotas.  

  4. **Explicit Tradeoff Transparency**  
     - **Motivation**: Impossibility theorems prove no score can satisfy calibration, equal FPR, **and** equal FNR unless base rates are equal or prediction is perfect. Regulators must declare which fairness goal is prioritized (e.g., "We sacrifice equal FNR to protect Group X from over-detention"). This mirrors medical triage, where allocating ventilators explicitly prioritizes minimizing deaths over equal access.  
     - **Binding or Dogma**: Genuinely binding. Avoids "fairwashing" by forcing acknowledgment of whom the criterion disadvantages.  
     - **Exclusion Power**: Low. Serves as a meta-requirement for auditability rather than excluding candidates.  

  5. **Contextual Flexibility**  
     - **Motivation**: Fairness demands differ by domain. In medical triage, false negatives (missing high-risk patients) may be prioritized over false positives (over-triage). In lending, false positives (denying creditworthy applicants) may be prioritized. The criterion must allow domain-specific weights for FPR/FNR tradeoffs.  
     - **Binding or Dogma**: Genuinely binding. Rejects one-size-fits-all dogma (e.g., insisting on equalized odds everywhere).  
     - **Exclusion Power**: Low. Accommodates most criteria but requires justification for tradeoffs.  

  ---

  ### **Addressing Complications**
  1. **Impossibility Results & Sacrificed Requirements**  
     - **Conflict**: Calibration and error-rate balance cannot coexist under unequal base rates.  
     - **Sacrifice Principle**: **Equal FPR and FNR cannot both be satisfied**. A deployable criterion must choose which error to equalize (e.g., equal FPR to prevent disparate detentions) or relax calibration.  
     - **Interpretation**: Impossibility reveals no criterion is universally fair—each chooses whom to wrong. Calibration is non-negotiable for validity, so FPR/FNR parity must be partially sacrificed. For example, equalized odds (equal FPR and FNR) is abandoned in favor of **calibration plus one equalized error rate** (e.g., calibration + equal FPR).  

  2. **Smuggled Requirements Assessment**  
     - **Fairness as Property of Score (Not Process)**:  
       - **Motivation**: Often assumed in algorithmic audits (e.g., "Does the score satisfy calibration?"). However, process flaws (e.g., biased training data) can taint scores even if outcomes appear fair.  
       - **Verdict**: **Dogma of one camp**. A regulator should consider both score properties **and** process (e.g., feature selection, data provenance), as a "fair" score from an unjust process may perpetuate harm.  
     - **Invariance Under Outcome Relabeling**:  
       - **Motivation**: If "positive" is relabeled (e.g., from "recidivism" to "non-recidivism"), fairness should not reverse. For example, a criterion that penalizes high FPR for "recidivism" should not ignore high FNR for "non-recidivism."  
       - **Verdict**: **Genuinely binding**. Criteria like demographic parity are invariant, but calibration and error rates are not (reversing labels swaps FPR/FNR). A criterion must specify which outcome is "adverse" (e.g., recidivism) and justify its asymmetry.  

  ---

  ### **Exclusion Summary & Candidate Scoring**
  - **Strongest Exclusion**: **Error-rate balance** (Desideratum 2). It forces the sharpest tradeoffs, eliminating criteria like:  
    - *Demographic parity* (violates base-rate insensitivity).  
    - *Equalized odds* (violates calibration under unequal base rates).  
  - **Viable Candidates**:  
    - **Calibration + Equal FPR**: Best for reducing disparate false alarms (e.g., pretrial detention).  
    - **Calibration + Equal FNR**: Best for reducing disparate misses (e.g., medical triage).  
    - *Avoid*: Pure calibration (ignores error disparities) or demographic parity (ignores risk differences).  

  ---

  ### **Confidence in Framework & Least Sure Point**
  - **Overall Confidence**: **High (85%)**. The framework embraces impossibility constraints, mandates explicit tradeoffs, and adapts to context. It avoids dogmatism by allowing calibration to anchor validity while contextualizing error-rate priorities.  
  - **Least Sure Point**: **Whether fairness must be solely outcome-based**. I am least confident that process-agnostic criteria (e.g., calibration alone) are sufficient for regulatory audits. Biased processes may require separate scrutiny, but integrating them risks diluting the formal criterion.  

  This list prioritizes auditability, mathematical coherence, and ethical transparency, ensuring regulators can enforce a standard that acknowledges real-world tradeoffs.
