answer: |-
  Here are eight incisive interview questions probing the evolutionary-Lewisian synthesis, each with a targeted follow-up designed to escalate the conceptual pressure:

  1. **Core Mechanism Challenge:**  
     *Lewisian conventions rely on common knowledge for stability, but your model substitutes evolutionary basins of attraction. How does basin depth—under replicator dynamics—genuinely *explain* the *robustness* of a convention against competing variants (e.g., "dog" vs. "hound" for canines) without implicitly smuggling in salience or frequency-dependence as the *real* stabilizer?*  
     **Likely Answer:** *Appeal to attractor strength via payoff differentials or mutation resistance.*  
     **Follow-up:** *If basin depth depends on the relative fitness payoff of "dog" over "hound," doesn't that collapse arbitrariness? "Dog" isn't arbitrary if it's *fitter*—say, through phonemic ease. How does your model preserve Saussurean arbitrariness without making basins themselves arbitrary (which would undermine explanatory power)?*

  2. **Arbitrariness & Neutral Evolution:**  
     *You claim evolutionary stability explains sign arbitrariness ("dog" vs. "cat"). But if multiple signs can occupy the *same* basin of attraction for denoting canines, how do you prevent drift or selection from *fixing* one sign (e.g., "dog") purely due to historical contingency, thereby making the outcome non-arbitrary in practice?*  
     **Likely Answer:** *Neutral evolution within basins allows sign-swapping if variants are functionally equivalent.*  
     **Follow-up:** *If functional equivalence permits neutral drift between signs, what prevents a *single* sign from dominating via mere cumulative advantage (e.g., random copying bias)? Doesn't this require an auxiliary assumption of *active symmetry maintenance*—contradicting the "invisible hand" of replicator dynamics?*

  3. **Normative Bite of Partial Knowledge:**  
     *Lewis tied convention to normative expectations: "We ought to use 'dog' because we *mutually know* we expect each other to." If you replace common knowledge with partial mutual expectations (e.g., "I'm 80% sure you expect 'dog'"), how can these probabilistic states generate the *deontic force* of convention—the "should"—rather than just describing statistical regularity?*  
     **Likely Answer:** *Second-order expectations ("I expect that you expect 'dog'") stabilize norms; deviation reduces payoff.*  
     **Follow-up:** *If deviation (using "hound") only reduces payoff because others *punish* non-compliance (via confusion or correction), doesn't this reduce the "norm" to a *sanctioned* regularity? How is this different from a habit enforced by social pressure, and where does the *normativity* reside in the evolutionary model itself?*

  4. **Boundary: Convention vs. Habit:**  
     *Under your view, what evolutionarily stable feature distinguishes a *convention* (e.g., driving on the right) from a mere *population-wide habit* (e.g., morning coffee)? Both may be stable, mutually expected, and payoff-sensitive.*  
     **Likely Answer:** *Conventions solve coordination problems with multiple equilibria; habits lack alternative stable states.*  
     **Follow-up:** *Consider a habitual behavior that *becomes* a coordination focal point (e.g., everyone uses "Google" as a verb because others do). Doesn't replicator dynamics model both identically? If so, is the convention/habit distinction explanatorily inert in your framework?*

  5. **Second-Order Expectations & Path Dependence:**  
     *How do second-order expectations ("I believe you believe we'll use 'dog'") form and stabilize under replicator dynamics without common knowledge bootstrapping? Doesn't their evolution require *higher-order* selection pressures, risking infinite regress?*  
     **Likely Answer:** *Hierarchical expectations co-evolve with behavioral regularities via lower-cost signaling or reinforcement.*  
     **Follow-up:** *If second-order expectations are *byproducts* of behavioral success (e.g., using "dog" works, so I assume you expect it), how do they *acquire independent causal power* to stabilize conventions against shocks? Isn't this just epiphenomenal?*

  6. **Drift vs. Selection in Sign Fixation:**  
     *When a new convention emerges (e.g., "selfie"), is its fixation driven primarily by *selection* (superior coordination payoff) or *drift* (random copying)? How does your model arbitrate, and what hinges on this distinction?*  
     **Likely Answer:** *Initial variation may be neutral drift; selection dominates once payoff differences emerge.*  
     **Follow-up:** *If early-stage drift is crucial, doesn't that concede that *non-functional* factors (e.g., celebrity usage) often determine convention—undermining the explanatory primacy of evolutionary *stability* (which applies post-fixation)?*

  7. **Misalignment & Error Tolerance:**  
     *Lewis required precise mutual alignment for coordination. Your model permits "graded" expectations. How much misalignment (e.g., I’m 60% sure you prefer "dog," you’re 70% sure I prefer "hound") can the system tolerate before coordination collapses? Does replicator dynamics predict a sharp threshold or gradual degradation?*  
     **Likely Answer:** *Systems tolerate noise within basins; collapse occurs near basin boundaries.*  
     **Follow-up:** *If stability is basin-relative, doesn't this imply that *no* convention is intrinsically stable—only stable *relative to alternatives in its neighborhood*? How does this square with Lewis's claim that conventions are solutions to *recurrent* coordination problems?*

  8. **Cross-Convention Contagion:**  
     *How does evolutionary stability prevent conventions in adjacent domains from destabilizing each other? (e.g., Using "like" as a discourse particle ["It's, like, cold"] potentially eroding its precision as a verb).*  
     **Likely Answer:** *Domain segregation or context-dependent payoffs isolate conventions.*  
     **Follow-up:** *If contexts overlap (e.g., casual vs. formal speech), and replicator dynamics operates on *aggregate* utterance success, wouldn’t selection favor polysemous ambiguity? How does this account for the observed *stability of distinct conventions* across contexts?*

  **Key Pressures Applied:**  
  - **Arbitrariness:** Forced distinction between functional basins (fitness) and sign-material neutrality.  
  - **Normativity:** Challenged reduction of "ought" to adaptive expectation/payoff.  
  - **Boundary Problem:** Pressed the model to distinguish coordination equilibria from reinforced habits.  
  - **Mechanics:** Targeted co-evolution of expectations, drift/selection interplay, and basin topology.  

  Each follow-up exploits the guest’s likely reliance on basins, second-order expectations, or drift-vs-selection to push toward unresolved tensions in the synthesis—ensuring the discussion advances beyond restatement.
