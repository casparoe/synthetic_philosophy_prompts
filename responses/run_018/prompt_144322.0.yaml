  ### Decision-Tree Taxonomy for Weakness of Will and Hyperbolic Discounting  

  **Instructions for Use:**  
  Answer three binary questions in sequence. Each question presents a concrete scenario or claim about weakness of will (akrasia) and intertemporal choice. Terminal leaves (1–7) correspond to philosophical/economic positions. Unoccupied cells (marked with 🚫) are flagged with brief diagnoses.  

  ---

  #### **Question 1 (Root Node):**  
  *Can an agent ever genuinely act against their own best interest or values due to a failure of self-control?*  
  - **No** → Proceed to Position (1)  
  - **Yes** → Proceed to Question 2  

  #### **Question 2 (Branch A: Weakness of will exists):**  
  *Must the failure of self-control involve a scenario where a tempting option becomes available in the immediate/near future? (e.g., declining exercise today but committing to it next month is irrelevant if failure occurs without time pressure).*  
  - **Yes** (Temporal proximity is essential) → Proceed to Question 3A  
  - **No** (Failure can occur without time pressure, e.g., in a static choice) → Proceed to Question 3B  

  #### **Question 3A (Temporal branch):**  
  *Can preference reversal (e.g., choosing $50 now over $100 tomorrow, but choosing $100 in 365 days over $50 in 364 days) be explained by a single, coherent agent whose values shift over time?*  
  - **Yes** (Unified agent with non-constant preferences) → Proceed to Niche Diagnostic  
  - **No** (Requires distinct subsystems or "selves" with conflicting goals) → Proceed to Position (5)  

  #### **Question 3B (Non-temporal branch):**  
  *Does the failure occur despite the agent having a clear, conscious judgment about what is best overall at the moment of action?*  
  - **Yes** (Agent acts against their own best judgment) → Proceed to Position (3)  
  - **No** (Failure arises from flawed reasoning, not judgment violation) → Proceed to Position (2)  

  ---

  #### **Niche Diagnostic (Follows Question 3A-Yes):**  
  *An agent always chooses a larger-later reward over a smaller-sooner one when both are outside a 1-hour window (e.g., $100 in 31 days > $50 in 30 days). However, when both options are inside a 1-hour window (e.g., $100 in 1 hour > $50 now), she consistently chooses the smaller-sooner reward. She never violates her pre-committed long-term plan (e.g., investing monthly).*  
  **Is this local reversal (only inside the 1-hour window) an instance of weakness of will?**  
  - **Yes** → Proceed to Position (4)  
  - **No** → Proceed to Position (6)  

  ---

  #### **Terminal Positions Mapped to Answer Patterns**  
  1. **Socratic denial of akrasia**  
     - *Path:* **No** at Question 1.  
     - *Core commitment:* True self-control failures are impossible; apparent weakness of will reflects ignorance or error.  

  2. **Aristotelian practical-syllogism failure**  
     - *Path:* **Yes** (Q1) → **No** (Q2) → **No** (Q3B).  
     - *Core commitment:* Akrasia stems from misapplying general principles to specific cases (e.g., "I know sweets are bad, but this cupcake is an exception").  

  3. **Davidsonian judgment violation**  
     - *Path:* **Yes** (Q1) → **No** (Q2) → **Yes** (Q3B).  
     - *Core commitment:* Agents act against their own all-things-considered best judgment (e.g., "I know I shouldn’t smoke, but I light up anyway").  

  4. **Hyperbolic-discounting reductionism**  
     - *Path:* **Yes** (Q1) → **Yes** (Q2) → **Yes** (Q3A) → **Yes** (Niche).  
     - *Core commitment:* Weakness of will is purely present-biased time inconsistency (niche reversal counts as akrasia).  

  5. **Planner-doer dual-self model**  
     - *Path:* **Yes** (Q1) → **Yes** (Q2) → **No** (Q3A).  
     - *Core commitment:* Reversal results from conflict between a long-term planning system and a short-term impulsive system.  

  6. **Structural-rationality view**  
     - *Path:* **Yes** (Q1) → **Yes** (Q2) → **Yes** (Q3A) → **No** (Niche).  
     - *Core commitment:* Time-inconsistent choices are rational given context-driven perspective shifts (niche reversal is not akrasia if it aligns with local context).  

  7. **🚫 Unoccupied position**  
     - *Path:* **Yes** (Q1) → **Yes** (Q2) → **No** (Q3A) + **Niche reversal not weakness of will** (hypothetical).  
     - *Diagnosis:* Unattractive. A dual-self model (like 5) that *denies* niche reversals are weakness of will is implausible—conflict between selves typically defines akrasia.  

  ---

  #### **Unoccupied Cell Diagnostics**  
  - **🚫 Yes (Q1) → No (Q2) → No (Q3B)** (Non-temporal, unified agent):  
    *Diagnosis:* Incoherent. If failure requires neither time pressure nor judgment violation, it cannot be distinguished from ordinary mistakes (contradicts Q1-Yes).  
  - **🚫 Yes (Q1) → No (Q2) → Yes (Q3B) + Temporal-only akrasia** (Hypothetical):  
    *Diagnosis:* Unexplored. Judgmental failure without time pressure is possible (Davidson allows this), but restricting it to temporal cases is arbitrary.
