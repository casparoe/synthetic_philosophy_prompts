answer: |-
  The conceptual parallel between Newton's theological stance on the Trinity and his natural-philosophical position on gravity lies in a **shared metaphysical commitment to mediated causation and the rejection of autonomous, inherent power within created entities, stemming from a foundational principle of divine sovereignty and dominion.** This manifests as an aversion to unmediated relations between ontologically distinct entities *within creation*, reserving ultimate, direct causal agency for God alone.

  Here's a breakdown of the internal logic:

  1.  **Theological Rejection of Consubstantiality:**
      *   **Core Principle:** God the Father is the *sole* absolute, unoriginated, supreme source of divinity and sovereignty. To grant the Son identical essence and co-eternality undermines this absolute monarchy.
      *   **Mediation & Subordination:** The Son is a distinct, subordinate being, generated by the Father's will, possessing "like substance" (*homoiousios* rather than *homoousios*) and acting as the Father's primary agent or mediator in creation and redemption. The Son's existence and authority are *derived* from the Father.
      *   **Avoidance:** Direct ontological identity or co-equality (consubstantiality) is rejected because it implies either two independent divine sources (polytheism) or a blurring of the fundamental distinction between the Unoriginated Source (Father) and the Originated Agent (Son). The relation *must* be mediated by the Father's will and the Son's subordinate role.

  2.  **Natural-Philosophical Rejection of Inherent Gravitation & Action-at-a-Distance:**
      *   **Core Principle:** Matter is passive, inert, and devoid of inherent self-moving or self-organizing powers. To grant matter an *inherent*, *autonomous* power like gravitational attraction would be to grant it a form of self-sufficiency and causal agency independent of God.
      *   **Mediation & Divine Agency:** Gravity *must* be caused by something *other* than matter itself. Newton strongly implied (especially in queries and correspondence) that this "something" is the direct action of God or an immaterial medium (aether/spirit) *constantly* imposed and regulated by God. Gravity is not a property *of* matter but a law *imposed upon* matter by divine will.
      *   **Avoidance:** Direct, unmediated action-at-a-distance between material bodies is rejected because it implies either:
          *   A occult, inherent power within matter (violating passivity), or
          *   A relation occurring *without* the continuous sustaining and mediating presence/action of God (violating divine dominion).

  **The Conceptual Parallel:**

  *   **Rejection of Autonomous Power:** In both domains, Newton refuses to grant true autonomy or inherent, self-sufficient causal power to a secondary entity.
      *   *Theology:* The Son cannot possess unoriginated, co-equal divine essence/agency.
      *   *Physics:* Matter cannot possess inherent attractive/active powers.
  *   **Insistence on Mediation & Subordination:** Both positions require a hierarchical structure where action flows from the supreme source (Father/God) through a subordinate agent or imposed law (Son/Divine Will acting via space or medium).
      *   *Theology:* The Son mediates the Father's will to creation.
      *   *Physics:* God (acting directly or through an imposed medium/law) mediates the interaction between bodies.
  *   **Divine Dominion as Foundation:** This shared structure rests on Newton's overarching metaphysical commitment to **absolute divine sovereignty and dominion**.
      *   God's dominion is direct and unmediated over His creation. Absolute space, being the "sensorium" of God, is the arena of His ubiquitous presence and immediate agency.
      *   Granting inherent power to matter (like gravity) or co-equal power to the Son would diminish this direct dominion. It would insert a layer of autonomous causality *within* creation, making parts of creation self-sufficient actors rather than passive subjects entirely dependent on God's continuous will and action.

  **Are the Positions Based on a Single Commitment or Independent Arguments?**

  *   **Underlying Metaphysical Unity:** The positions *do* reflect a single, deep-seated metaphysical commitment: **the absolute priority of divine will and action, and the consequent rejection of any inherent, autonomous causal power within created, ontologically distinct entities that could bypass God's immediate dominion.** This commitment provides the *framework* and *motivation* for rejecting both Trinitarian consubstantiality (as blurring the Creator/created distinction within the Godhead regarding origin and authority) and inherent gravitational power/action-at-a-distance (as granting autonomy to created matter).
  *   **Distinct Argumentative Grounds:** However, the *arguments* used to support each position are largely independent and drawn from their respective domains:
      *   *Theology:* Arguments are primarily scriptural exegesis and historical analysis of early Christian writings (as in his *Historical Account of Two Notable Corruptions of Scripture*). He sought to prove the Son's subordination from biblical texts.
      *   *Natural Philosophy:* Arguments are empirical and methodological. The *Principia* mathematically describes gravity but deliberately refrains from assigning a cause. Rejecting inherent power stems from observations of matter's inertia and the methodological principle ("Hypotheses non fingo") against feigning unsubstantiated hypotheses about inherent qualities. The need for a mediator (divine or otherwise) arises from the perceived absurdity (to Newton) of unmediated action-at-a-distance within a mechanistic worldview populated by passive matter.

  **Conclusion:**

  While the *arguments* for Newton's Arianism and his rejection of inherent gravity/action-at-a-distance are distinct (scriptural vs. empirical/methodological), they are unified by a profound and consistent **metaphysical commitment to divine sovereignty.** Newton insisted on a cosmos where all power and action ultimately derive from, and are sustained by, the direct will of God. Within this framework, both the co-equality of the Son and the inherent active power of matter were conceptually problematic, as they introduced autonomous causal principles that could operate independently of God's immediate dominion. Both positions necessitate a structure of mediated causation: the Son acting under the Father's authority in theology, and God (or His ordained medium) acting upon passive matter to produce gravitational effects in physics. The aversion to unmediated relations between distinct entities (divine persons or material bodies) stems from this core commitment to preserving the absolute, direct, and unmediated causal supremacy of God over His creation.
