answer: |-
  You've pinpointed the central and most fruitful tension in Montaigne's "Of Cannibals." It's not a *failed* attempt at consistent relativism, nor is the contradiction accidental. Instead, the essay deliberately leverages this tension to achieve its profound rhetorical and philosophical goals. Here's how we can understand the apparent paradox:

  1.  **Radical Challenge, Not Pure Relativism:** Montaigne's primary aim is not to establish a watertight system of cultural relativism where *all* judgments are equally valid and incommensurable. His goal is a devastating *critique* of European ethnocentrism, hypocrisy, and self-deception. The relativist gesture ("Who are we to judge?") is the *means* to this end. By forcing his readers to see European practices through the lens of Tupinambá judgment ("They find us more barbarous"), he shatters their unthinking assumption of superiority. This is the shock therapy.

  2.  **The Basis for Praise: "Nature" vs. "Art" (Artifice):** Montaigne's praise for the Tupinambá isn't grounded in *their specific cultural norms* as the ultimate standard, nor in a fully articulated universalism. Instead, he consistently contrasts "Nature" with "Art" (meaning artifice, human invention, societal corruption).
      *   **Tupinambá Virtues:** He praises their courage, fidelity, freedom from greed, simplicity, and harmony with their environment. He sees these as traits close to an uncorrupted human "Nature" – virtues accessible to reason and observable in their effects (social cohesion, lack of internal strife compared to Europe). They are "noble" because they seem less distorted by the complex layers of artifice, ambition, and institutionalized vice that characterize European society.
      *   **European Vices:** Conversely, he condemns European cruelty (torture, religious wars), hypocrisy, greed, social climbing, and the tyranny of artificial needs. These are seen as products of "Art" run amok, moving humans *away* from a simpler, potentially more virtuous state suggested by "Nature."
      *   **"Natural Law" Framework:** While not a systematic natural law theorist, Montaigne operates within a framework where certain fundamental goods (courage, fidelity to one's word, freedom) and evils (gratuitous cruelty, treachery) are discernible through reason and observation, transcending *specific* cultural rituals. The Tupinambá, in his view, exemplify these natural virtues *despite* their specific ritual (cannibalism), which he frames as an excusable (though still repugnant to him) consequence of war and revenge, contrasting it with the cold, calculated, and hypocritical cruelty of European torture and warfare.

  3.  **The Eyewitness Accounts: Skepticism Directed at Europe, Not Naive Acceptance:**
      *   **Against European Distortion:** Montaigne explicitly distrusts European travelers who interpret everything through their own preconceptions ("we should beware of clinging to vulgar opinions, and judge things by reason’s way, not by popular say"). His reliance on a "plain, ignorant fellow" (likely André Thevet or Jean de Léry, filtered through others) is strategic. He values the *simplicity* and perceived lack of interpretive baggage in these accounts precisely because he believes complex European frameworks *distort* reality.
      *   **Accessibility of Fact:** Montaigne *does* presuppose that basic observations about actions and social structures can be reported across cultures. He believes we can understand that the Tupinambá practice ritual cannibalism on war captives, value courage, live communally without significant hierarchy or private property, etc. Radical relativism, denying *any* cross-cultural understanding, isn't his position. He argues that the *meaning* and *moral evaluation* Europeans *immediately* attach to these facts (e.g., "barbaric savages") is the problem, born of prejudice.
      *   **Skepticism Applied Selectively:** His skepticism is primarily weaponized against European *interpretations* and *moral judgments*, not necessarily against the basic factual observations reported by relatively unbiased witnesses. He trusts reports of Tupinambá virtues (simplicity, courage) just as he trusts reports of their cannibalism.

  4.  **The Point of the Tension:**
      *   **Humility as the Core Lesson:** The essay's ultimate goal isn't to prove the Tupinambá are objectively "better" or to establish a perfect relativist system. It's to instill profound *humility* and *self-doubt* in the European reader. The tension forces the reader to grapple with the uncomfortable questions you raise: "If I condemn *their* practice, what about *ours*? If I praise *their* virtue, what does that say about *ours*? *Can* I even judge?" This cognitive dissonance is the engine of Montaigne's critique.
      *   **Rhetorical Inversion as Catalyst:** The praise *is* strategic and rhetorical, but not *purely* so. It serves the powerful function of inverting the usual hierarchy, making the "savage" the judge and the "civilized" the condemned. This inversion shocks the reader out of complacency and forces self-reflection. However, Montaigne *does* seem genuinely to admire certain Tupinambá qualities *as he understands them through the lens of "Nature."*
      *   **Skepticism Avoiding Dogmatism:** Montaigne, the master skeptic, avoids locking himself into a rigid doctrine (pure relativism *or* universalism). The tension reflects his view that human reason is fallible, cultural perspectives are powerful, yet some basic observations and judgments about human flourishing and suffering remain possible. He navigates this messy middle ground.

  **Conclusion:**

  Read the essay not as a failed relativist treatise but as a brilliantly calculated exercise in **critical provocation and ethical reorientation.** The apparent contradiction is the point:

  1.  **Step 1: Relativist Challenge:** Undermine absolute European moral superiority by showing judgments are reciprocal ("We find them barbarous... they find us more so"). This exposes ethnocentrism.
  2.  **Step 2: Comparative Critique:** Using the relatively neutral ground established by eyewitness accounts of *actions* and *social structures*, compare European and Tupinambá practices through the lens of "Nature" vs. "Artifice." This allows Montaigne to condemn specific European vices (hypocrisy, greed, institutionalized torture) as more destructive and less excusable than Tupinambá practices rooted in war and (in their view) justice, while praising Tupinambá virtues aligned with a simpler, less corrupted state.
  3.  **Overall Effect:** Create profound unease, force self-criticism, promote humility about European "civilization," and suggest that looking beyond our own artifice towards a simpler, perhaps more "natural" state (even if idealized) might offer ethical insights. The tension isn't a flaw; it's the dynamo that drives the essay's enduring power to unsettle and provoke thought. Montaigne uses the relativist insight strategically to dismantle European arrogance, then leverages observable human qualities (via the reports) to construct a comparative critique rooted in a flexible, skeptical concept of "Nature" as a counterpoint to corrupting "Artifice."
