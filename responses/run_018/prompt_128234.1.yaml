  First, identifying the bidders. The primary bidder is the U.S., but the North Vietnamese and NLF are also active. The prize for the U.S. is credibility in containing communism, while for North Vietnam, it's national unification. The sunk costs like lives and resources make withdrawal unthinkable, trapping both sides. 

  Next, the payoff rules. Each escalation increases the cost of quitting. The Gulf of Tonkin Resolution removes Congressional barriers, allowing deeper involvement. Tet Offensive challenges U.S. optimism but doesn't stop the bidding; instead, it shifts to Vietnamization, a form of disguised bidding. 

  Where the model breaks: The dollar auction assumes rational actors, but bureaucratic factors like inter-agency competition and domestic politics (audience costs) complicate this. Johnson feared Republican backlash if he withdrew. Also, North Vietnam's domestic dynamics aren't captured—they had their own escalation pressures, like maintaining support from China and the USSR. 

  The nested auction idea is crucial. Both sides were in separate domestic loops. The U.S. had to appease voters and political opponents, while North Vietnam dealt with hardliners and allies. The model misses these internal games and multi-level interactions. Also, it overlooks asymmetric stakes—Vietnam's survival versus U.S. credibility. 

