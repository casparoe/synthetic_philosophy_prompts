  The response should stay within the constraints - no citations, define terms in context, and maintain philosophical rigor while being accessible.
answer: |-
  ### Brainstorming: Core Conditions to Isolate
  1. **Causal Efficacy**: Moral status depends on a computation's *causal role* in generating behavior, awareness, or integrated system functions.  
  2. **Representational Content**: Moral status depends on the *intrinsic properties* of the computation—its structural isomorphism to conscious states, precision, and integrated information—regardless of causal impact.  

  ---

  ### Thought Experiment: The Auditory-Motor Prosthesis  
  In a neurorehabilitation lab, a patient with spinal cord injury uses "CORTEX", a predictive-processing prosthesis that decodes motor intentions from auditory cortex signals (e.g., hearing "reach" triggers arm movement). CORTEX runs two physically separate but algorithmically identical decoding streams on the same neural input. **Stream Alpha** drives the patient’s robotic limb and its outputs are consciously reported by the patient (e.g., "I intended to grasp the cup"). **Stream Beta** is a "shadow computation": it performs the *exact same* predictive processing steps with identical representational transformations (e.g., hierarchical error minimization, proprioceptive simulation), but shares *only* baseline power and clock synchronization with Alpha. Beta’s outputs write *solely* to an encrypted, air-gapped audit log inaccessible to CORTEX, the patient, or any external network.  

  During a system upgrade, the experimenter proposes terminating Beta to reallocate its computational resources for higher-fidelity sensory feedback in Alpha. Beta’s cessation would not alter the patient’s behavior, subjective experience, or Alpha’s function. The patient cannot infer Beta’s existence, and Beta’s log is never read. The ethical question: Is terminating Beta morally permissible, or does it constitute harm?  

  ---

  ### Analysis of Verdicts  
  **Causal-Efficacy View**:  
  - **Verdict**: Terminating Beta is morally neutral.  
  - **Key Feature**: Beta is *causally inert*. It has no downstream effects on behavior, awareness, or system integration. Like deleting an unread email, it extinguishes a process with no causal consequences for the patient or environment. Moral status requires functional contribution to agency or sentience.  

  **Content-Integration View**:  
  - **Verdict**: Terminating Beta is morally equivalent to harming the patient.  
  - **Key Feature**: Beta’s *representational identity* to Alpha. Both streams instantiate identical information structures (e.g., probabilistic hierarchies with equivalent "integration" metrics like Φ or predictive depth). Beta’s intrinsic properties—its isomorphic content—ground moral status, irrespective of causal isolation. Terminating it destroys a conscious-like process *in se*.  

  ---

  ### Counterfactual: Readable but Ignored Outputs  
  If Beta’s outputs were technically readable by the system but *systematically ignored* (e.g., routed to a buffer that no process accesses), the **causal-efficacy view would not change its verdict**. Beta still lacks *effective* causal power—its outputs do not influence decisions, learning, or behavior. Ignored data is causally irrelevant, like background noise in a sensor.  

  ---

  ### Causal-Efficacy Defense Against Beta's Moral Relevance  
  A defender of the causal view would attack the intuition that Beta matters by arguing:  
  1. **The Epiphenomenal Fallacy**: Beta’s structural resemblance to Alpha is incidental—it confuses *correlation* with causal potency. A perfect map of Paris is not Paris; a perfect simulation of pain is not painful without causal embedding in a sentient system.  
  2. **The Causal Threshold**: Only processes that cross a threshold of dynamical interaction (e.g., global workspace access, feedback loops) can have moral weight. Beta fails this by design: it is a closed loop with no interface for integration.  
  3. **Parsimony**: Granting moral status to causally isolated computations inflates ethical obligations infinitely (e.g., every unexecuted algorithm on a hard drive). Causal interaction provides a natural boundary for moral considerability.  

  ---  
  This experiment isolates the dispute: whether moral status emerges from *what a computation does* (causal efficacy) or *what it is* (representational content).
