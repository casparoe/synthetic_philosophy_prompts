  ## One Star: This Lamp Broke Physics (and My Will to Live)

  **Product:** Thomson's "Infinity Lamp" (Model: SuperTask Deluxe)  
  **Reviewed by:** Furious in Fresno  
  **Verified Purchase**

  DO NOT BUY THIS LAMP. I repeat, UNDER NO CIRCUMSTANCES. I needed a simple desk lamp for late-night study sessions. The sleek design and the promise of a "thought-provoking demonstration mode" caught my eye. BIGGEST MISTAKE OF MY LIFE. Forget studying; this thing has plunged me into a bureaucratic and mechanical nightmare that defies the laws of reality itself.

  First off, the "demonstration mode." The manual claims it showcases an "elegant infinite sequence." You press a button, and for one minute, it flicks itself on and off faster and faster: on after half a minute, off after the next quarter, on after an eighth... you get the idea. Sounds neat, right? WRONG. At the end of this minute, the lamp just... stops. But is it ON or OFF? The manual is SILENT. Utterly, infuriatingly SILENT. It just says "the demonstration concludes." Concludes WHAT? In what STATE?

  I called customer service, practically shouting down the phone: "Just tell me! Is it on or off at the end?" Know what they said? "Sir, the operational description is complete and consistent. Your question about the final state is ill-posed and not covered under warranty." ILL-POSED? I posed it perfectly clearly! I want to know if I need to turn the stupid thing off manually after the demo or if it's already off! They kept parroting the manual, saying the sequence was "logically defined" up to the one-minute mark. Well, logic isn't turning on my light when I need it! I need ANSWERS, not philosophy lectures from a call center script!

  Then there's the switch. What is this thing MADE OF? Unobtanium? Wishful thinking? Because after about the thousandth flick during one demo (and it gets WAY faster than that!), I heard a horrible grinding noise. Turns out the switch mechanism has "finite operational tolerance." The booklet has a microscopic footnote: "Switch rated for 1,000,000 cycles." A MILLION? That sounds like a lot until you realize their own demo requires INFINITE FLICKS! It's false advertising! They built a lamp *designed* to break its own switch during its primary function! I pointed this out, and they had the nerve to say the warranty covers "failure due to material defect within rated cycles," implying that demanding it perform its advertised infinite task is MY fault! The switch is visibly worn down. Soon I'll have a $200 paperweight that *almost* does infinity.

  My roommate, trying to be helpful (bless his idiot heart), thought he could "fix" the end-state problem. He rigged a little wire that physically forces the switch into the ON position *exactly* at the one-minute mark, after all the crazy flicking. Know what happened? The lamp just stays on now after the demo. Works "fine," he says. But it feels WORSE. Hollow. Like cheating. The manual didn't say anything about needing an external wire! And it completely invalidates the whole "elegant sequence" they bragged about! Now the lamp's just… on. But *how*? Did the wire cause it? Or was it the last flick? Or none of the above? It feels deeply, cosmically WRONG. It fixed nothing; it just made the absurdity permanent.

  Also, don't get me started on the electricity bill. During the demo, the light is visibly VIBRATING, humming like a trapped wasp. It's drawing power at an insane, fluctuating rate. Is it billing me for infinite energy consumption crammed into one minute? My smart meter nearly had a seizure. Customer service said the energy draw "converges," whatever that means. My wallet feels diverged, I'll tell you that much.

  The warranty section is a masterpiece of evasion. "Final state indeterminacy not considered a defect." "Physical realizability limitations inherent to infinite sequences." "Customer inquiries regarding metaphysical consequences void warranty." METAPHYSICAL CONSEQUENCES? I just wanted a lamp that turns on and off predictably!

  This isn't a lamp. It's a prank wrapped in sleek aluminum. It's a conversation starter that ends friendships. It's a product that proudly advertises a function it *physically cannot perform* without breaking itself, then blames *you* for expecting it to work. The manual might be "consistent," but my sanity isn't. Customer service might call my questions "ill-posed," but my demand for a refund is crystal clear: GIVE ME MY MONEY BACK. This lamp hasn't illuminated my desk; it's plunged my entire understanding of cause-and-effect into darkness. Save yourself. Buy a normal lamp. One that knows if it's on or off.
