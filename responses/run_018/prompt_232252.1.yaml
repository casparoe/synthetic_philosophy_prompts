answer: |-
  Below is a structured seminar plan designed around Bongard problems to challenge students' assumptions about induction. The plan progresses from concrete experience to abstract reflection, ensuring key misconceptions are addressed at critical junctures. Total time: 2 hours.

  ---

  ### **1. Introduction & Simple Bongard Problem (20 minutes)**  
  **Goal:** Activate the "common features" misconception and create cognitive dissonance.  
  - **Activity (5 min):** Present a trivial Bongard problem (e.g., left: all boxes contain a circle; right: no circles). Students solve it quickly to learn the format.  
  - **First Challenge (10 min):** Introduce a **novel Bongard problem** where the rule *cannot* be a conjunction of visible features (see *Carrying Example* below).  
  - **Debrief (5 min):** Ask students to share rules. *Do not confirm/deny yet*. Highlight recurring proposals (e.g., "all have triangles") and plant doubt: "What if a box you ignored breaks this?"  

  ---

  ### **2. Carrying Example: Rule Design & Negative Examples as Guides (25 minutes)**  
  **Rule:** *"At least one shape touches exactly one border (edge) of the box."*  
  **Why it works:**  
  - Resists feature conjunctions: Positives share no common shapes, sizes, or colors.  
  - Negatives actively destroy obvious wrong rules (not just random failures).  

  | **Positive Examples (Left)**          | **Negative Examples (Right)**          | **Wrong Rules Destroyed**             |  
  |--------------------------------------|----------------------------------------|---------------------------------------|  
  | △ touching top edge                  | △ centered (no touch)                  | "Has a triangle" (△ in negative)     |  
  | ◯ and □; ◯ touches left edge         | ◯ and □; both centered                 | "Single shape only" (2 shapes in pos) |  
  | ★ touching bottom edge               | ★ touching *two* edges (corner)       | "Any touch" (★ in negative fails)    |  
  | Small △ touching right edge          | Large △ spanning entire box (no edge) | "Small size" (size varies in pos/neg)|  
  | ◯ touching left, □ not touching      | □ touching left, ◯ not touching       | "Specific shape/position" (mixed)    |  

  **Activity Flow:**  
  - **Analysis (10 min):** Students brainstorm rules in pairs. Most will propose feature-based rules (e.g., "has a triangle," "touches any border").  
  - **Reveal (5 min):** Show how negatives dismantle their rules (e.g., "You said ‘touches any border’—but this ★ touches two edges and is on the *right*").  
  - **Key Point (10 min):** Emphasize that negatives are **hypothesis eliminators**, not just tests. Without them, rules are overgeneralized.  

  ---

  ### **3. Sequencing Ideas & Misconception Mitigation (40 minutes total, woven in)**  
  **Dependency Structure:**  
  1. **Start with positives-only:** Let students propose rules from positives alone (activates "common features" bias).  
  2. **Introduce negatives:** Use the carrying example to show how negatives *actively falsify* rules (after they witness their proposals fail).  
  3. **Delay underdetermination:** Only after students experience failure (e.g., "My rule broke on a negative!") introduce that multiple rules fit the data.  

  **Misconception Map (addressed in order):**  
  | **Misconception**                          | **When to Address**                     | **How to Head Off**                                                                 |  
  |-------------------------------------------|-----------------------------------------|-------------------------------------------------------------------------------------|  
  | **Concepts = common features**             | After first challenge (Step 1 debrief) | Show positives share *no* obvious features (e.g., △, ◯, ★ all in positives).       |  
  | **"One more positive settles the rule"**   | During underdetermination (Step 4)     | Use two rules fitting all 12 boxes; reveal a new example splits them (see below). |  
  | **"Simplicity picks the right rule"**      | During underdetermination (Step 4)     | Contrast equally simple rules (e.g., "touch one edge" vs. "no star shapes").       |  
  | **"Negatives only test pre-formed rules"** | After carrying example (Step 2 reveal) | Stress: negatives guided rule *formation* by killing bad hypotheses early.        |  

  ---

  ### **4. Underdetermination Problem (20 minutes)**  
  **Goal:** Show multiple rules fit the same 12 boxes.  
  - **Activity (10 min):** Present a new Bongard problem where two rules work:  
    - Rule A: *"Contains a circle."*  
    - Rule B: *"No star-shaped objects."*  
    - **Positives:** All have circles and no stars (e.g., ◯, ◯+□).  
    - **Negatives:** All have stars and no circles (e.g., ★, ★+△).  
  - **Reveal (10 min):**  
    1. Both rules sort the 12 boxes perfectly.  
    2. Show a **new example**: ◯+★.  
      - Rule A passes it (has ◯); Rule B fails it (has ★).  
    **Key Insight:** Examples underdetermine rules—more data or external principles (e.g., context) are needed.  

  ---

  ### **5. Check for Deep Understanding (10 minutes)**  
  **Activity:** *Rule Reverse-Engineering*  
  - Present a new Bongard problem (e.g., rule: *"All shapes are convex"* with simple polygons vs. stars/crescents).  
  - **Task:** Students write:  
    1. The rule *they inferred*.  
    2. **How positives suggested it** (e.g., "no irregular shapes").  
    3. **How negatives ruled out alternatives** (e.g., "I thought ‘three shapes’ until a negative had three convex shapes").  
  - **Assess:** Look for explanations of *process* (e.g., "Negatives killed ‘large shapes’ because some positives were small"). Avoid praising mere correctness.  

  ---

  ### **6. Open Endings: What We Decline to Settle (5 minutes)**  
  **Statement:**  
  > "We’re not claiming all real-world concepts are Bongard-style rules—these are idealized puzzles. Real concepts may involve fuzzy boundaries, context, or social factors. Why leave this open? Because today’s goal is to dissect *how examples guide induction*, not to define concepts. This helps us focus on the core puzzle: how minds leap from sparse data to general rules."  

  **Why it Helps:**  
  - Prevents overgeneralization while highlighting the lesson’s scope (induction mechanics).  
  - Invites curiosity about real-world parallels (e.g., child language learning, scientific laws).  

  ---

  ### **Timeline Summary**  
  - **0:00–0:20:** Intro & simple problem (misconception activation).  
  - **0:20–0:45:** Carrying example (negatives as eliminators).  
  - **0:45–1:25:** Misconception mitigation + underdetermination.  
  - **1:25–1:35:** Understanding check (reverse-engineering).  
  - **1:35–1:40:** Open endings + wrap-up.  

  **Materials:** Visual Bongard panels (digital or print); worksheets for rules/explanations.  
  **Adjustments:** If students solve quickly, deepen underdetermination (e.g., "Is simplicity objective?"). If stuck, simplify negatives in the carrying example.
