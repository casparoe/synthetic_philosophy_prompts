  Dennett's position is that patterns are real if they enable compression. For example, predicting behavior using beliefs/desires is more efficient than describing neural states. But critics like Fodor argue that without causal powers, patterns are just explanatory tools. The user wants to know where Dennett draws the line between real patterns and convenient fictions.

  Ontological commitment comes in here. Dennett avoids committing to beliefs as internal states. Instead, their reality lies in their predictive utility. The user's confusion might stem from traditional views where reality requires intrinsic existence, while Dennett sees it as dependent on perspective.

