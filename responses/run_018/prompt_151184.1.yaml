  The tension arises because Dennett straddles realism and instrumentalism. He's a realist about patterns but anti-realist about traditional mental states. The user's teacher's mention of ontological commitment might refer to whether we must believe beliefs exist independently. Dennett says no; their existence is tied to their utility.

  I should clarify that compressibility doesn't require causal efficacy. Predictive power is enough. Causal efficacy is a separate issue that Dennett reinterprets through patterns. The user needs examples, like the chess game, to see how patterns are real without being reducible to physics.

  Also, the user might be conflating different levels of explanation. The intentional stance is a higher-level pattern that supervenes on physical states. Its reality isn't diminished by being multiply realizable. Emphasizing the objectivity of patterns—how they're detectable and useful regardless of perspective—could help.

