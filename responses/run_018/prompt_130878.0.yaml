prompt: |-
  I am preparing a consistency audit for my applied ethics seminar on institutional morality and individual obligation. Below is the package of commitments I have arrived at regarding effective altruism and its standard critiques. I want to know whether they form a coherent philosophical profile, or whether I am helping myself to incompatible motivations.

  (1) I accept the institutional critique in its strong form: that effective altruism's focus on individual optimization systematically obscures structural mechanisms of harm, treating unjust institutions as fixed background conditions rather than objects of collective transformation, and that earning-to-give within such institutions risks functioning as moral licensing.

  (2) Despite (1), I defend earning to give as permissible and sometimes optimal, provided it is practiced as what I term non-substitutive giving: the donor explicitly treats philanthropic contribution as parallel to, rather than a replacement for, institutional reform efforts.

  (3) I regard measurability bias as a deep epistemic failure in longtermist cause prioritization. The attempt to rank distant, speculative outcomes using near-term quantifiable metrics involves a category error that undermines the reliability of career-ranking estimates derived from such comparisons.

  (4) I hold that career choice should be governed by straightforward expected-value maximization: agents ought to select paths that maximize social value using the best available quantitative estimates, including longtermist ones, and epistemic humility should not function as a blanket prohibition on acting under uncertainty.

  (5) I also maintain that honoring sunk career costs can be rational: if I have spent years building specialized expertise and relational capital in direct global-health implementation, switching away solely because updated longtermist estimates assign a different path a higher expected value wastes genuinely irreplaceable organizational knowledge and human capital.

  Please audit this set. Specifically: does (2) genuinely avoid the legitimization problem raised in (1), or does non-substitutive giving collapse into the very moral licensing it seeks to avoid? Does (3) render (4) untenable, given that (4) relies precisely on the longtermist estimates that (3) discredits? Is (5) compatible with (4), or does my defense of sunk-cost honoring invoke a non-consequentialist value—such as narrative integrity or loyalty to past investment—that conflicts with expected-value maximization? Rank the tensions by severity, distinguish genuine conflicts from merely apparent ones, and indicate what the least costly revision would be and what it costs.
reasoning: |-
  Okay, let me start by really digging into this user's query. They're preparing a consistency audit for an applied ethics seminar, focusing on institutional morality and individual obligation, specifically around effective altruism (EA). They've outlined five commitments and want to know if they're coherent or if there are internal conflicts. 

  First, I need to unpack each commitment to understand their positions. Commitment (1) strongly critiques EA for ignoring structural issues and treating institutions as fixed, which could lead to moral licensing. Then (2) allows earning-to-give but only as non-substitutive giving, meaning it shouldn't replace institutional reform. The user is trying to balance individual action with systemic change here. 

  Looking at (3), they criticize longtermism's measurability bias as an epistemic failure. But then (4) advocates for expected-value maximization using quantitative estimates, including longtermist ones. That seems contradictory. How can you discredit the metrics but still rely on them? 

  Commitment (5) defends honoring sunk costs in career choices, which might clash with (4)'s expected-value maximization. If you stick to a career because of past investment, isn't that deviating from pure consequentialism? 

  The user's main questions are about whether non-substitutive giving avoids moral licensing, if (3) and (4) can coexist, and if (5) conflicts with (4). They also want tensions ranked by severity and possible revisions. 

  Starting with the tension between (1) and (2): Non-substitutive giving aims to prevent moral licensing by requiring parallel systemic efforts. But does that actually solve the problem? If someone is still earning within an unjust system, even if they advocate for change, their actions might still legitimize the system. The user needs to address how their presence in the system doesn't reinforce it. Maybe they can clarify that their role involves active subversion, but that's a high bar. The least costly fix might be to admit some licensing risk but argue it's outweighed by other factors.

  Then the (3) and (4) conflict is pretty severe. Criticizing longtermist metrics but still using them for decision-making is a big issue. The user might need to distinguish between different types of longtermist estimates—maybe rejecting speculative ones but accepting more grounded models. Or they could emphasize robustness checks and diversification. Without this, (4) loses its foundation if (3) is true.

  For (5) and (4), honoring sunk costs seems non-consequentialist. Expected-value maximization usually ignores sunk costs. The user could frame sunk costs as affecting future value—like maintaining organizational capital. But if the expected value of switching is much higher, sticking to the current path might not hold. They’d need to show that the irreversible capital loss justifies staying, which is a tough sell under strict consequentialism.

  Ranking the tensions: (3)-(4) is the most severe because it's an epistemic clash that undermines the decision-making process. Then (1)-(2) is moderate, involving practical coherence. (4)-(5) is mild if rephrased in consequentialist terms, but could be worse otherwise.

  The least costly revisions? For (3)-(4), the user can refine their critique to target only flawed metrics, not all longtermism. For (1)-(2), explicitly acknowledge moral licensing risks and add safeguards. For (4)-(5), treat sunk costs as impacting future value, not past investments. 

  The user's deeper needs might include wanting a defensible EA stance that acknowledges structural issues without rejecting individual action. They might also seek a balanced view that values both measurable impacts and systemic change, avoiding absolutism. Their identity as a seminar preparer suggests they need rigor and coherence to present a strong argument, possibly to peers critical of EA. They might fear contradictions that undermine their position, so clarity on reconciling points is key.
answer: |-
  Here's a consistency audit of your commitments, ranked by severity of tension, with analysis of conflicts and revision options:

  ### Core Tensions Ranked by Severity
  1.  **Tension Between (3) and (4) [SEVERE - Potential Contradiction]**
      *   **Conflict:** (3) argues that using quantifiable metrics to rank speculative longtermist outcomes is a *category error* that *undermines reliability*. (4) mandates using *precisely these "best available quantitative estimates"* (explicitly including longtermist ones) for career choice via expected-value maximization. (4) relies on the validity of the tools (3) fundamentally discredits for this domain.
      *   **Nature:** This is a **genuine conflict in epistemic foundations**. If the estimates are epistemically bankrupt for the task (as per (3)), they cannot serve as the "best available" basis for maximization (as per (4)).
      *   **Least Costly Revision & Cost:**
          *   **Revision:** Reframe (3) to target *specific implementations* or *excesses* of measurability bias in longtermism, not its core methodology. State that *while epistemically fraught and prone to significant error bars*, longtermist estimates represent the *least bad quantitative approach* under deep uncertainty, making them usable for (4) *with extreme caution, robustness checks, and diversification*.
          *   **Cost:** Softens the strong "category error/epistemic failure" claim in (3). Concedes that flawed estimates are still necessary/usable tools, weakening the force of the critique against mainstream EA longtermist prioritization. Requires adding significant caveats to (4).

  2.  **Tension Between (1) and (2) [MODERATE - Practical Coherence Challenge]**
      *   **Conflict:** (1) argues EA's individual focus risks legitimizing unjust institutions and enabling moral licensing (using individual giving to offset complicity). (2) defends earning-to-give *within those same institutions* via "non-substitutive giving" (requiring parallel reform efforts).
      *   **Nature:** **Apparent conflict regarding legitimization/moral licensing.** The core question is whether "non-substitutive giving" is *practically achievable* without collapsing into licensing. Does merely *intending* parallel action suffice? Does earning within the system *inevitably* confer legitimacy or reduce motivation for reform, regardless of intent?
      *   **Resolution Potential:** This tension is **reconcilable in principle but fragile in practice**. (2) avoids *explicit* substitution, but the *risk* of *implicit* substitution/licensing remains high. Success depends entirely on the *sincerity, proportionality, and effectiveness* of the parallel reform efforts. If these are token gestures, (2) collapses into licensing. If they are robust and primary, it *might* avoid legitimization.
      *   **Least Costly Revision & Cost:**
          *   **Revision:** Strengthen (2) by defining robust criteria for "non-substitutive": e.g., a significant portion of time/resources *must* be demonstrably dedicated to reform; the reform effort must be *at least as existentially salient* to the agent as earning/giving; the choice of earning role should minimize direct harm/enable subversion where possible.
          *   **Cost:** Makes (2) significantly harder to satisfy in practice. Requires abandoning a pure "intent-based" defense and introducing normative thresholds. Acknowledges that (2) doesn't *eliminate* the legitimization/licensing risk identified in (1), only *mitigates* it under strict conditions.

  3.  **Tension Between (4) and (5) [MILD - Reconcilable within Consequentialism]**
      *   **Conflict:** (4) mandates straightforward expected-value (EV) maximization. (5) argues for honoring sunk costs (specialized expertise, relational capital) even if a different path has a higher *current* EV estimate, to avoid wasting "irreplaceable" capital.
      *   **Nature:** **Apparent conflict with consequentialism.** Standard EV maximization ignores sunk costs; only future costs/benefits matter. (5) seems to value past investment intrinsically ("narrative integrity," "loyalty").
      *   **Resolution:** This is **reconcilable** within an *expansive consequentialist framework* if "irreplaceable organizational knowledge and human capital" are correctly framed as *future-value-generating assets*, not just past costs. Switching careers incurs a *real future cost*: the destruction of unique, high-value potential (knowledge transfer, trust-based effectiveness) that the new path cannot replicate. This lost future value must be included in the EV calculation of switching.
      *   **Least Costly Revision & Cost:**
          *   **Revision:** Reframe (5) explicitly as a *consequentialist argument*: "Sunk costs represent the *development of unique future-value-generating assets*. Destroying these assets (by switching) incurs a large, often unquantified, *future cost* that standard EV comparisons frequently neglect. Including this cost often makes staying optimal." Drop any language hinting at intrinsic value of past investment.
          *   **Cost:** Requires careful articulation to avoid smuggling in non-consequentialist values. Forces acknowledgment that if the EV gap *including the cost of lost capital* still favors switching, switching *is* obligatory per (4).

  ### Summary & Recommendation

  *   **Most Critical Fix: (3) vs. (4).** Your strong epistemic rejection of longtermist quantification directly undermines your mandate to use it for maximization. **Revise (3)** to target specific flaws/overconfidence in application, not the fundamental (flawed-but-necessary) methodology itself, or significantly qualify (4) regarding longtermism.
  *   **Significant Risk: (1) vs. (2).** "Non-substitutive giving" is a valiant but vulnerable defense against moral licensing. **Strengthen (2)** with concrete, demanding criteria for what constitutes genuine parallel action to mitigate the legitimization risk inherent in (1).
  *   **Manageable: (4) vs. (5).** This tension dissolves if **reframed consequentially** in (5). Focus on the *future opportunity cost* of destroying unique capital, not honoring the past investment itself.

  **Overall Coherence:** Your profile is **coherent in principle but practically unstable** without revisions. It attempts a nuanced middle path between structural critique and individualist EA optimization, accepting core EA tools (EV maximization, longtermism) while criticizing their common implementations (measurability bias, institutional blindness). The success of this synthesis hinges critically on successfully implementing the revisions above, particularly regarding the epistemic status of longtermist estimates and the robust operationalization of non-substitutive giving. Without these, the tensions between (3)/(4) and (1)/(2) threaten to unravel your position. The (4)/(5) point strengthens your realism about career capital within a consequentialist framework.
