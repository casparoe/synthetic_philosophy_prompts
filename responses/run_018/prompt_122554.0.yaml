prompt: |-
  I sit on a technical advisory group that a national statistics office has convened to answer two questions: what should this country's headline measure of national wellbeing be, and should the government formally adopt a target of reaching the top ten of the international happiness league table within a decade. I'm the philosopher on the group, I have to put a two-page note in front of the others in a fortnight, and before I write it I want my own position checked for consistency rather than defended. Here is where I've landed, item by item.

  (a) The quantity worth measuring is people's own evaluative judgment about how their lives are going — the standard 0–10 ladder item, or something close to it — and not an objective list of goods, and not aggregated moment-to-moment affect. My reason: how well a life is going is constitutively a matter of the subject's own point of view, so there is no better evidence about it than the person's own verdict, and no deeper fact for a list of objective conditions to be a better measure of.

  (b) The headline number should be the plain arithmetic mean of those judgments — not the share of the population above some sufficiency threshold, not an inequality-adjusted or prioritarian-weighted mean — because the mean is the honest aggregate, and anything we want to say about the shape of the distribution can be published next to it as a separate series.

  (c) I hold a priority view about justice: gains to the worst-off count for more than equal-sized gains to the comfortable, and I want that to show up in how policy options are appraised.

  (d) It is legitimate for a government to make league-table position an explicit, publicly owned objective with a named minister accountable for it. The alternative — improving wellbeing while officially not caring how we rank — strikes me as either disingenuous or a way of avoiding accountability.

  (e) The measure has to be something a government can actually move and that can be tracked at least annually; a quantity that only responds on a generational timescale is not fit to be a target, whatever its philosophical credentials.

  (f) Self-reported life evaluations are systematically distorted by adaptation. People living in chronically harsh conditions renormalise their expectations downward and report a 7 for a life that a better-off person would call a 4, so raw means flatter deprived populations and part of the international ordering is an artefact of who has learned to expect less.

  (g) The resulting comparability problem should be handled by measurement technique — for instance anchoring methods in which respondents also rate short hypothetical case descriptions, so that we can tell whether two populations are using the scale the same way — and not by mixing objective conditions into the index itself.

  (h) No weighting scheme should be imposed across countries that tells us how much income counts for relative to health, freedom or social trust. Any such weighting imports a contested view of the good life into what is supposed to be a neutral comparison.

  Two places where I feel the strain, though I may be wrong about both: I worry that (d) sits badly with (a), and I have been told that (b) betrays (c). But I suspect the real fault line is somewhere else in the set, and I would rather you found it than confirmed my hunches.

  What I want from you is an audit, not a survey of the field and not a reading list — I will supply references myself. Go through the eight commitments and tell me which pairs are genuinely in tension and which only look as though they are, ordered by severity rather than listed as equals. For each real tension, say precisely what does the work: what exactly has to give, what the cheapest revision is, and what that revision costs me elsewhere in the set. Where a technique or distinction looks like it repairs a tension but does not, say so and say why. If one single revision would clean up more than one tension at once, name it. And if there is a commitment in the set that I have not noticed is doing load-bearing work, or a tension I have not mentioned, flag that too. Finally: given the audit, tell me what the two-page note to the group should actually recommend about the headline measure and about the top-ten target, and what the strongest objection to that recommendation will be.
reasoning: |-
  Okay, the user is a philosopher on a technical advisory group for a national statistics office. They need to create a two-page note addressing two main questions: what the headline measure of national wellbeing should be, and whether the government should adopt a target to reach the top ten in the international happiness league table within a decade. They've outlined eight commitments (a through h) and want an audit for internal consistency, focusing on tensions between these commitments. They specifically worry about potential conflicts between (d) and (a), and between (b) and (c), but suspect there might be other issues.

  First, I need to understand each commitment clearly. 

  Commitment (a) emphasizes subjective evaluative judgments as the core measure, rejecting objective lists or affect aggregation. The key point here is that wellbeing is constitutively tied to the individual's own perspective. 

  Commitment (b) insists on using the plain arithmetic mean for aggregation, without inequality adjustments or sufficiency thresholds. The rationale is honesty and transparency—letting distributional concerns be separate. 

  Commitment (c) introduces a priority view for justice, where gains to the worst-off matter more. This is about policy appraisal, not necessarily the headline measure itself. 

  Commitment (d) argues for setting a league-table target with ministerial accountability, viewing the alternative as disingenuous or evasive. 

  Commitment (e) requires the measure to be government-actionable and trackable annually, ruling out slow-moving indicators. 

  Commitment (f) acknowledges adaptation as a distortion in self-reports, where harsh conditions lead to downward renormalization of expectations. 

  Commitment (g) proposes handling comparability via measurement techniques like anchoring vignettes, not by blending objective conditions into the index. 

  Commitment (h) rejects cross-country weighting schemes that impose contested views of the good life, emphasizing neutrality in comparisons. 

  The user's explicit concerns are tension between (d) and (a), and between (b) and (c). But deeper analysis might reveal others. 

  Starting with (b) and (c): The plain mean in (b) seems at odds with the priority view in (c). If the headline measure is just the mean, but policy appraisal weights gains to the worst-off more, that's a functional separation—headline vs. policy tool. But the tension might be superficial if the headline measure isn't used for policy decisions. However, if the league-table target in (d) is based solely on this mean, then policies focused on priority gains might not boost the mean as effectively, creating a conflict. The user might need to clarify that the headline measure isn't the sole basis for policy, or that the priority view applies downstream. 

  Next, (d) and (a): Adopting a league-table target could pressure the government to "game" the system, potentially undermining the subjective authenticity in (a). For example, campaigns telling people to rate their lives higher could distort genuine evaluations. But (d) is about accountability, not manipulation. The tension might be mitigated if the government focuses on improving conditions that authentically boost evaluations, respecting (a). However, the risk of performative actions remains, so the tension is real but manageable with safeguards. 

  Now, less obvious tensions. (g) and (f) pair well—using anchoring vignettes to correct for scale usage differences without compromising subjectivity. But (g) might conflict with (e) if anchoring methods are complex or not feasible annually. However, the user notes anchoring as a technique, so perhaps it's implementable. 

  Another potential tension is between (h) and the league-table focus in (d). If international rankings rely on unweighted means, but countries have different value weightings, the comparison might not be neutral. (h) rejects imposing weights, so the league table might reflect differing cultural valuations, which could undermine the legitimacy of the target. This is a deeper issue because even with anchoring, the scale might not capture equivalent valuations of goods. 

  Also, (e) and (f)/(g): If adaptation distortions require complex corrections, annual tracking might be challenging. But if anchoring vignettes are incorporated into surveys, it might still be feasible. 

  The biggest hidden tension might be between the priority view (c) and the league-table target (d). If the target is based on the unadjusted mean (b), but the government prioritizes the worst-off, progress might be slower in climbing rankings since mean improvements might be modest compared to focusing on the majority. This could misalign incentives. 

  For recommendations: The headline measure should be the anchored mean subjective evaluation, as per (a), (b), (g). The top-ten target is legitimate per (d), but must be pursued through genuine improvements, not manipulation. The strongest objection would be that cultural differences make league-table comparisons invalid even with anchoring, as per concerns in (h). 

  The user needs to address the priority view by separating the headline measure from policy appraisal, using a dashboard including distributional metrics. This resolves (b)-(c) tension. For (d)-(a), emphasize transparent, authentic strategies. The critical weakness is (h) challenging international comparability despite anchoring, which requires acknowledging limitations but proceeding pragmatically.
answer: |-
  Here is a consistency audit of your eight commitments, ordered by severity of tension. I identify three genuine tensions, one superficial tension, one critical weakness needing management, and one commitment doing hidden load-bearing work. Recommendations for your note follow.

  ### **Genuine Tensions (Ordered by Severity)**
  1. **Tension: (d) League-table target vs. (h) Neutral comparability**  
     - **Nature**: Adopting a top-ten league-table target (d) inherently pressures the government to maximize *rank*, but (h) rejects weighting schemes that impose a "good life" template. International rankings (e.g., World Happiness Report) use *unweighted* aggregates of diverse components (income, health, freedom, etc.). Rising in rank may require optimizing along dimensions that conflict with local values or the priority view (c).  
     - **What gives**: (h) must concede that league tables *do* implicitly weight dimensions by how they correlate with scores. Pursuing rank forces alignment with whatever drives *existing* rankings, importing de facto values.  
     - **Cheapest revision**: Frame the target as aspirational but explicitly reject the ranking’s implicit weights. State that policy will prioritize dimensions aligned with national values and priority for the worst-off, even if this slows rank ascent.  
     - **Cost**: Weakens (d)’s accountability, as ministers could blame "flawed" rankings for missed targets.  
     - **Why techniques don’t fix**: Anchoring (g) adjusts scale interpretation but doesn’t resolve weighting conflicts in composite indices.

  2. **Tension: (b) Plain mean vs. (c) Priority view**  
     - **Nature**: (b) insists the headline measure must be the arithmetic mean, but (c) demands prioritization of gains to the worst-off. A policy that significantly improves wellbeing at the bottom but slightly reduces the mean (e.g., redistributive taxes affecting high earners’ productivity) would be justified under (c) but *lowers* the headline measure in (b), harming league-table progress (d).  
     - **What gives**: (b) cannot serve as the *sole* policy success metric if (c) is operational.  
     - **Cheapest revision**: Keep the mean as the headline but **mandate complementary distributional metrics** (e.g., bottom-quintile mean, gap ratios) as co-equal targets. The "headline" remains philosophically honest (b), but policy appraisal uses a dashboard including priority-adjusted metrics.  
     - **Cost**: Weakens (b)’s simplicity. However, you already endorse publishing distribution separately ("next to it as a separate series"), so this extends that logic.  
     - **Why not superficial?** If league-table rank (d) is tied *only* to the mean, prioritizing the worst-off may conflict with rank goals. But this is mitigated if distributional metrics are also publicly tracked.

  3. **Tension: (d) League-table accountability vs. (a) Subjective authenticity**  
     - **Nature**: Making rank a ministerial target (d) risks incentivizing governments to manipulate responses (e.g., PR campaigns urging people to "rate higher") or focus on short-term boosts to scores rather than genuine wellbeing. This corrupts the subjective verdict (a), which relies on *uncoerced* self-assessment.  
     - **What gives**: (d) must accept safeguards against gaming.  
     - **Cheapest revision**: Condition (d) on **strict governance**: independent verification of survey methods, penalties for manipulation, and public education that higher scores should reflect *actual improvements*, not changed expectations.  
     - **Cost**: Adds bureaucratic complexity but preserves core principles.  
     - **Why not worse?** (g)’s anchoring methods partly mitigate by detecting response-shift bias, but they can’t stop outright coercion.

  ---

  ### **Superficial Tension**
  - **Alleged: (b) Plain mean vs. (c) Priority view**  
    - **Resolution**: As above, (c) is a *policy* commitment, not an *aggregation* rule for the headline measure. You can consistently use the mean for description while applying priority weights in policy appraisal. Tension arises only if the mean is the *sole* policy metric, which revision above fixes.

  ---

  ### **Critical Weakness (Not a Tension, But Undermines Multiple Commitments)**
  - **(f) Adaptation distortion + (g) Anchoring correction vs. (e) Annual trackability**  
    - **Problem**: Anchoring vignettes (g) are methodologically complex. Implementing them robustly at scale may conflict with (e)’s requirement for annual, actionable data. Vignettes increase survey length/cost, risk low response rates, and require statistical expertise to calibrate annually.  
    - **Why it’s load-bearing**: If anchoring isn’t feasible annually, raw scores (flawed by adaptation) become the de facto metric, violating (a)’s fidelity to true evaluative judgment and biasing league-table comparisons (d).  
    - **Mitigation**: Accept anchoring as essential but **phase it in**. Initially use raw scores with explicit caveats, while developing anchoring capacity. Cost: Temporary loss of comparability, risking early league-table missteps.

  ---

  ### **Hidden Load-Bearing Commitment**
  - **(g) Anchoring** is essential to reconciling:  
    - (a) and (f): It rescues subjective judgments from adaptation bias.  
    - (h): Enables "neutral" cross-country comparison without objective-list imports.  
    - (d): Makes league tables philosophically defensible.  
    Without (g), (f) undermines (a), (d), and (h).

  ---

  ### **Recommendations for Your Two-Page Note**
  1. **Headline Measure**:  
     - **Propose**: Anchored life evaluation (0–10) using vignette-adjusted arithmetic mean.  
     - **Justification**: Upholds (a), (b), (g), (f), (h). Publish distributional metrics (e.g., bottom-quintile mean, Gini) alongside to address (c).  
     - **Implementation Caveat**: Anchoring requires piloting; use raw mean temporarily with disclaimers (per weakness above).

  2. **Top-Ten Target**:  
     - **Recommend adoption** but with conditions:  
       - Governance: Independent audit of data collection; penalties for gaming.  
       - Policy: Rank is secondary to priority-weighted gains for the worst-off.  
       - Transparency: Publicly reject the ranking’s implicit value weights (per tension with (h)).  
     - **Justification**: Aligns with (d) and (e) but insulates against distortions to (a), (c), (h).

  **Strongest Objection**:  
  > *"International rankings embed arbitrary weightings of wellbeing dimensions (contra h). Chasing rank may divert resources from locally valued priorities or the worst-off, betraying (c) and national sovereignty. Anchoring adjusts scale use but cannot fix this fundamental incomparability."*  

  **Your Counter**: Accept the objection’s premise but argue that:  
  1. The target is a motivator for improvement, not a policy straitjacket;  
  2. All international benchmarks have flaws—with anchoring and distributional metrics, this is the least bad option;  
  3. Rejecting rankings entirely (per objection) defaults to unaccountable vagueness, violating (d).

  ---
  ### **Summary of Revisions**
  - **Cheapest Fix**: Add distributional metrics (e.g., bottom-quintile mean) as co-targets to reconcile (b) and (c).  
  - **Critical Adjustment**: Make anchoring non-negotiable but phase it for (e).  
  - **Essential Nuance**: Adopt the league-table target *with explicit disclaimers* about its value neutrality to preserve (h).  

  Your framework is robust if these edges are polished. The note must stress that the headline measure is a *descriptive* tool, while policy uses a *dashboard* including priority-weighted supplements.
