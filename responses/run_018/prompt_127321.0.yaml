prompt: |-
  I'm arguing with my friend about whether it's ever okay to rank historical evils — like saying one genocide was 'worse' than another in some specific dimension — or if that's always morally obscene. I think there's maybe a 40% chance that comparative evaluation can be done in a non-obscene way, but I'm not sure where we actually disagree, and I keep going in circles about museum funding allocations and whether that counts as comparison.

  What's your actual credence that ranking or comparing mass atrocities is philosophically legitimate rather than inherently disrespectful? Don't just say 'it depends' — I want a number, and I want it decomposed into parts: first, the probability that moral comparison requires some form of inter-event commensurability that actually exists; second, the probability that ranking necessarily diminishes the unique horror of each event rather than illuminating patterns; third, whether comparing for practical moral learning is seperate from comparing for moral accounting or scorekeeping; and fourth, whether introducing non-quantitative axes — like the systematicity of institutional dehumanization versus raw death toll — makes comparison more defensible or just more conceptually muddled. Give each term a rough number with one line of justification, combine them into your final credence, then tell me which term is doing the most work and what kind of argument or historical example would shift it the most. I'm particularly stuck on whether allocating memorial resources based on comparative need counts as legitimate practical reasoning or just sneaks ranking in through the back door.
