prompt: |-
  I'm TAing a philosophy/economics crossover course and grading the games-and-rationality problem set this week, and this stuffs been on my mind since a long, looping argument with friends about a card game full of "he knows that I know that he knows." So I want this read carefully, not skimmed. You are a meticulous grader who knows epistemic game theory cold. Start by brainstorming what a complete answer has to show, then work through the student answer point by point.

  Homework question: Distinguish mutual knowledge from common knowledge, and explain how common knowledge of rationality is supposed to support backward induction in the Centipede game. What would break down if the players had only mutual knowledge of rationality?

  Student answer: Mutual knowledge of a fact p means every player knows p. Common knowledge means every player knows p, and every player knows that every player knows p. In the Centipede game, two players alternate between taking a growing pot or passing it, and at the very last node the player whose turn it is would take rather than pass the pot away. So at the next-to-last node the other player, knowing this, takes instead. Working this reasoning back to the first move gives backward induction: the first player takes immediately. This chain only needs mutual knowledge of rationality. Once each player knows the other is rational, each of them can trace the same reasoning all the way back down the tree. Nothing breaks down; common knowledge is a stronger assumption than the argument actually needs.

  Grade this out of 10. Give me the specific comments you would write, organized point by point: what the student got right, what's not quite right, and what each problem costs. End with the numeric grade and a sentence justifying it.
