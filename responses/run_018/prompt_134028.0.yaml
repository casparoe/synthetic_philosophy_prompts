prompt: |-
  ok so me and my friend had this long argument last night about whether athenian democracy was actually broken or just unlucky. i started jotting notes for an essay comparing three failures: the mytilene vote, the sicilian expedition decision, and the trial of socrates. my core idea is that all three share a structural problem i'm calling jurisdictional overreach - the assembly treated strategic, ethical, and philosophical questions like they were routine tax or festival votes. in mytilene they voted to execute every male citizen in a single session, then reversed course the next morning after recieving a second message. with sicily they greenlit a massive invasion despite not really grasping the scale or logistics, letting charisma override expertise. and in socrates' case they used a jury of regular citizens to adjudicate what was essentially a disagreement about education and piety, applying legal procedure to a philosophical conflict. i think the common thread isn't just emotional crowd behavior but a category error: democratic legitimacy works for distributing goods within the polis, but it breaks down when applied to domains requiring long patience, technical knowledge, or ethical nuance. but i worry i'm being unfair - the second mytilene vote shows self-correction, and there were generals warning about sicily. is this framing actually accurate, or am i misreading the primary sources? is it interesting or just a repackaging of thucydides with fancy words? and which part sounds weakest? please comment on accuracy and whether the argument holds up, but don't give me a reading list - i just want your take.
