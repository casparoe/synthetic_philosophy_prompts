    ],
    "insulation_risk": "Moderate: risks vagueness if 'endorsement' or 'modality' is overextended, but falsifiable via neural correlates of integration",
    "exposure_verdict": "Empirically vulnerable to neuroscience evidence on unconscious affect, but conceptually robust against heterogeneity. Viability hinges on defensibility of conscious integration as necessary for pleasure."
