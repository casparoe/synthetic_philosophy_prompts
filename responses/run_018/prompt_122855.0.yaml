      - *Yes* → Leaf D  
      - *No* → Leaf F  

  ---

  #### Leaves (Views and Claims):  
  - **Leaf A: Switch—expected gain based on distribution.**  
    *Awkward commitment: Requires full knowledge of the distribution and precise calculation.*  
  - **Leaf B: Do not switch—expected loss or tie based on distribution.**  
    *Awkward commitment: Requires full knowledge of the distribution and precise calculation.*  
  - **Leaf C: Always switch—expected 25% gain (one-and-a-quarter argument).**  
    *Awkward commitment: Equivocates between "smaller" and "larger" states; ignores distributional asymmetry.*  
  - **Leaf D: No reason to switch—symmetry settles indifference.**  
    *Awkward commitment: Ignores information from the amount; permits switching without gain.*  
  - **Leaf E: Switch only below a threshold (policy).**  
    *Awkward commitment: Requires knowing the distribution and computing a threshold.*  
  - **Leaf F: No finite expectation to compare.**  
    *Awkward commitment: Leaves decision arbitrary; no expected-value basis.*  
  - **Leaf G: No long-run gain from switching—growth-rate criterion.**  
    *Awkward commitment: Only applies to repeated play with compounding wealth.*  

  ---

  #### Cases Resolved:  
  - **Revealed amount is largest possible (finite-budget):**  
    Falls under Leaf B (conditional expectation ≤ amount).  
  - **Heavy-tailed distribution (infinite expectation):**  
    Falls under Leaf F (no finite expectation).  
  - **Distribution disclosed in advance:**  
    Routes to Leaves A, B, E, or F.  
  - **Distribution not disclosed:**  
    Routes to Leaves C, D, or G.  

  ---

  #### Unoccupied Answer Combinations:  
  *Diagnoses of paths with no common adherents:*  

  | Path (Answers to Nodes) | Diagnosis |  
  |-------------------------|----------|  
  | After looking → Rule → Distribution disclosed → Finite expectation → **Never-switch policy** (not Leaf E). | *Unattractive: Suboptimal when switching benefits some amounts.* |  
  | After looking → This amount → Know distribution → **Assume symmetry** (skip Node 4, go to Node 5). | *Incoherent: Knows distribution but ignores it for symmetry.* |  
  | Before looking → Without looking → Know distribution → Finite expectation → **Switch** (defy Leaf D). | *Unclaimed: Permitted by symmetry but no rationale for gain.* |  
  | After looking → Rule → Distribution not disclosed → Expected amount → **Assume symmetry** → But reject Leaf C. | *Incoherent: Assumes symmetry but rejects its implication.* |  

  ---

  **Notes:**  
  - **Student swapping before looking but keeping after seeing:** Falls under Leaf D (symmetry permits swapping but expects no gain).  
  - **Student accepting one-and-a-quarter per amount but not ex-ante:** Covered by Leaf C (always switch policy) and Leaf D (ex-ante symmetry). No inconsistency; ex-ante expected gain is zero, but per-amount gain is 25% under symmetry.  
  - **Growth-rate view (Leaf G)** is separated and applies only to repeated play.  
  - **Threshold view (Leaf E)** requires distribution knowledge; **no-expectation view (Leaf F)** handles heavy-tailed cases.  
  - **One-and-a-quarter equivocation** is flagged in Leaf C’s awkward commitment.  

  This tree resolves the paradox into coherent views, isolates unoccupied paths, and supports decisions without prior theoretical knowledge.
