answer: |-
  Here is a pantoum crafted to your specifications, embodying the tension between conviction and concealed bias through repetition and contextual shifts. The recurring lines marked with (*) are designed to pivot in meaning:

  **The Courtyard Gathering**  
  The courtyard gathers late into the night.  
  *It’s not the noise that’s wrong—it’s the affair.*  
  They swear no harm is done; I know they’re right,  
  *But something here is past what we should bear.*  

  *It’s not the noise that’s wrong—it’s the affair.*  
  We cannot let this stand, though none are hurt.  
  *But something here is past what we should bear*  
  When strangers claim a space meant for desert.  

  We cannot let this stand, though none are hurt?  
  The rule says *lights at ten*—yet they burn on!  
  When strangers claim a space meant for desert,  
  Why does this judgment linger, sharp as stone?  

  The rule says *lights at ten*—yet they burn on.  
  They swear no harm is done; I know they’re right.  
  Why does this judgment linger, sharp as stone?  
  The courtyard gathers late into the night.  

  ---

  ### How It Meets Your Requirements:
  1. **Recurring Lines with Shifting Meaning**:  
     - **Line 2/5 (*)**: *"It’s not the noise that’s wrong—it’s the affair."*  
       - Initially: Principled critique (focus on the *nature* of the gathering).  
       - Returns in Stanza 2: Feels tribal (objection to "strangers" in Stanza 2, Line 4). Punctuation (em dash) emphasizes rigidity.  
     - **Line 4/7 (*)**: *"But something here is past what we should bear."*  
       - Initially: Moral boundary (universal "we").  
       - Returns in Stanza 2: Echoes exclusion ("*meant for desert*" implies ownership).  

  2. **Concrete Harmless Object**:  
     - A **late-night courtyard gathering** (explicitly conceded: *"no harm is done; I know they’re right"*).  

  3. **Substitution Test Invitation**:  
     - The line *"When strangers claim a space meant for desert"* (Stanza 2) invites swapping "strangers" with "us/our children/neighbors." Does the objection hold?  

  4. **Off-Switch & Inheritance Hints**:  
     - **Off-switch**: The rule (*"lights at ten"*) is named, but the judgment *"lingers, sharp as stone"* (Stanza 3) after admitting no harm exists, suggesting bias.  
     - **Inheritance**: *"Why does this judgment linger?"* (Stanza 3) implies the speaker doubts its teachability.  

  5. **Ambiguous Close**:  
     - The final stanza returns to the opening line without resolution. The judgment *"lingers"* without justification, and the courtyard’s echo mirrors the circularity of the pantoum’s form. The reader cannot discern conviction from bias.  

  ### Key Shifts:
  - **Punctuation/Context**: The em dash in Line 5 (*"affair—"*) hardens the tone after "strangers" is introduced. Line 7’s recurrence (*"bear"*) now follows "desert," implying territory defense.  
  - **Failed Tests**: The speaker names a rule ("lights at ten") but undercuts it by admitting no harm exists. Substitution ("strangers" → "us") is implied but never tested by the speaker, leaving the reader to grapple with the ambiguity.  

  This structure forces the reader to inhabit the speaker’s unreliability, mirroring how disguised biases evade self-diagnosis. The pantoum’s recursive form becomes the very cage of circular reasoning.
