  ## The Formulary Dilemma: A Dialogue on Pascal's Justice and Power

  **Characters:**  
  *   **Claude:** Argues Pascal describes an unavoidable sociological reality.  
  *   **Thérèse:** Argues Pascal prescribes Christian obedience grounded in theology.  

  *(Setting: A quiet corner of a Parisian library, shortly after the 1664 Formulary decree)*

  **Claude:** Thérèse, this Formulary business... it forces the question Pascal posed about justice and power into brutal focus. His observation strikes me as chillingly accurate here: "Justice without power is helpless." Port-Royal’s arguments about grace *may* be just, but without the Crown and Pope's power behind them? Utterly helpless. And "power without justice is tyrannical" – well, demanding blind condemnation of complex theology without debate certainly fits. But Pascal knew the kicker: "People obey whatever is strongest." That’s not cynicism, it’s realism. Every legal order, every authority, ultimately rests on force’s foundation. The wise person sees this machinery for what it is and navigates it pragmatically. Signing isn’t moral approval; it’s acknowledging the weight of the stronger force.

  **Thérèse:** You reduce him to a mere sociologist, Claude, ignoring the theological current that runs through every fragment. Yes, he describes the world’s mechanics, but only to reveal its fundamental disorder *apart* from God. When he says power without justice is tyranny, he condemns the *world’s* power precisely because true Justice resides *only* in God. Our earthly authorities, however flawed, are nonetheless "ordained" – not because they are inherently just by worldly standards, but because God permits their power within the fallen order. Submission becomes an act of recognizing divine sovereignty *over* human injustice, a resignation to God’s hidden order. Resisting worldly power for worldly justice is ultimately futile and prideful.

  **Claude:** Ordained? So the Crown and Pope forcing clergy to condemn propositions they may sincerely believe reflect Augustine’s teaching on grace – that’s ordained? That’s resignation to God? It sounds like sanctifying capitulation! Pascal saw the *injustice* in worldly power structures. He didn’t say "submit because it’s ordained"; he showed *why* people submit – because force compels them. The "wise" person he speaks of understands this dynamic, sees the tyranny, but chooses survival within the system. Signing the Formulary isn’t pious resignation; it’s the grim calculus of the powerless recognizing superior force. It’s choosing the *lesser* helplessness.

  **Thérèse:** You mistake the object of resignation. It’s not resignation *to* Louis XIV or the Pope *as just*, but resignation *before God* who allows their authority. Pascal’s point is precisely that *human* justice is an illusion we cling to. "True justice," he insists, "is not present on earth." Our loyalty *must* be to that hidden, divine justice which transcends and judges *all* worldly authority. Demanding that earthly power conform to *our* idea of justice is the very vanity he critiques. For Pascal, the truly wise person accepts that their understanding of justice is imperfect and submits to the ordained power *as part of* accepting the human condition’s disorder under God’s ultimate, incomprehensible order.

  **Claude:** But if loyalty is to hidden divine justice, doesn’t that *require* refusing to condemn what one believes expresses that very justice? You speak of vanity, but isn’t signing a lie – condemning propositions one believes true – a greater offense against that divine truth? Pascal understood force, but he also prized intellectual honesty. Forcing conscience *is* tyranny, the very power without justice he described. Accepting the *fact* of power doesn’t mean actively betraying inner conviction. The pragmatic realist might sign to survive, but wouldn’t Pascal, knowing the fragility of worldly justice, feel compelled to *resist* this perversion of truth by force? Refusal wouldn’t claim worldly victory; it would bear witness to the helpless justice transcending power.

  **Thérèse:** Ah, but the inner conviction – is it truly divine justice, or merely *our* interpretation, inflamed by self-love? Pascal warns us endlessly about the corrupting influence of the *moi*. Submitting the individual conscience – especially one entangled in a contentious theological dispute – to the established authority of Church and Crown *is* an act of humility before the order God permits. It’s acknowledging that my private judgment of "truth" is suspect. Signing isn't necessarily affirming the Formulary's *absolute truth*; it could be an act of obedience within the ordained structure, trusting God’s ultimate justice will prevail despite human error. Refusal elevates *private judgment* to the status of divine justice – the very pride Pascal saw as the root of disorder. For him, faced with the Formulary, obedience *is* the path of Christian wisdom, however painful.

  **Claude:** So the Jansenists clinging to their reading of Augustine are merely proud, while those signing under duress are models of humility? That seems a convenient theology for the powerful. Pascal’s realism exposed the raw nerve: power demands obedience because it *can*. Signing the Formulary is simply yielding to the strongest force, dressed in the finery of "ordained authority." The wise person sees the finery for what it is – a necessary fiction – and signs, knowing justice remains helpless, power remains potentially tyrannical, and survival requires acknowledging who holds the whip. It’s bleak, but it’s the world Pascal mapped.

  **Thérèse:** And you ignore the map’s destination: God. The bleakness of the world *points* to the need for grace and submission. For Pascal, yielding to ordained power *is* an act directed towards God, not the wielder of the whip. It’s embracing the Cross in a world where justice is crucified by force. He would sign, not out of fear or cold realism alone, but as a penitential act within the flawed human order, trusting true justice to God alone. Refusal risks mistaking a fragment of perceived truth for the whole divine Justice – the ultimate illusion.
