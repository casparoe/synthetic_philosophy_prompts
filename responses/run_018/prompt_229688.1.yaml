  So I just spent like two hours arguing with my friend about superrationality in the prisoner's dilemma and we got nowhere. His position: cooperating only makes sense if your reasoning somehow causally determines what the other player does, and since there's no communication between you, superrationality is basically telepathy with extra steps and rational agents should just defect. My counter was that if both players are running the same reasoning process, they'll arrive at the same conclusion, so cooperating is the rational move because I can predict his answer matches mine.

  He keeps pressing on one point I can't answer: the symmetry argument seems to only work if my choice causes his choice. And if it doesn't cause it, then whatever he does is fixed independently of me, so defecting still dominates no matter what. Isn't he right that superrationality secretly needs causal influence between the players to get off the ground?

  Please explain in American English, and tell me which one of us is actually confused here.
