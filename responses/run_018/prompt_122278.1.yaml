answer: |-
  ### Joint Statement on Ethical Priorities in Suffering and Well-Being

  #### 1. Agreed Claims  
  We affirm the following points of consensus, recognizing that both positions—Axiological Negative Utilitarianism (ANU) and Suffering-Focused Consequentialism (SFC)—endorse these claims without reservation:  

  1.1 **Formal Structure of Suffering-Weighted Evaluation**:  
  Both parties agree that moral evaluation assigns *disproportionately greater weight* to reducing suffering than to promoting positive well-being. This weighting may manifest as either:  
  - (a) A **lexical ordering**, wherein preventing any suffering above a defined threshold of intensity/duration takes absolute priority over promoting well-being, irrespective of scale; or  
  - (b) A **steep convex weighting function**, wherein the moral disvalue of suffering increases at an accelerating rate as intensity rises, making severe suffering dominate calculations without strict lexicality.  
  Neither view asserts that the alternative formalization is incoherent, and both acknowledge that practical recommendations often converge.  

  1.2 **Non-Identity Problem in Suffering Prevention**:  
  We agree that policies preventing suffering for future beings who will exist regardless of our actions (e.g., improving conditions for future humans or animals without altering which individuals are born) are straightforwardly obligatory. The moral imperative to reduce suffering for these identifiable beings is unaffected by the observation that their existence is fixed.  

  1.3 **Moral Status of Wild-Animal Suffering and Artificial-Suffering Risks**:  
  Both views hold that suffering in non-human animals (e.g., predation, disease, or starvation in wild ecosystems) is intrinsically morally significant, irrespective of human causation. Similarly, risks of artificial suffering (e.g., from misaligned artificial intelligence or synthetic sentience) demand proactive mitigation due to their potential scale and severity.  

  1.4 **Conditions for Revising Weighting via Empirical Evidence**:  
  Both parties accept that empirical advances in welfare measurement (e.g., cross-species neural correlates of suffering, or behavioral indicators of valenced states) could, in principle, revise their weighting approaches. For ANU, robust evidence that certain states misclassified as "suffering" lack negative valence could narrow the scope of lexical priority. For SFC, evidence that suffering’s disvalue scales non-convexly could flatten the weighting curve. Such evidence must meet high epistemic standards to override core commitments.  

  #### 2. Disagreements  
  The table below summarizes unresolved divergences, with each view self-described in acceptable terms:  

  | Issue | Axiological Negative Utilitarianism (ANU) | Suffering-Focused Consequentialism (SFC) |
  |-------|-------------------------------------------|------------------------------------------|
  | **Nature of Asymmetry** | Suffering’s priority is **axiological**: suffering is intrinsically bad; non-suffering is evaluatively neutral (neither good nor bad). Well-being lacks intrinsic positive value. | Suffering’s priority is **deontic**: suffering is instrumentally catastrophic due to its depth, irreversibility, or psychological salience. Non-suffering is weakly good, but suffering’s disvalue is so steeply weighted that it dominates. |
  | **Happiness-Suffering Offset** | No scenario exists where happiness can morally offset suffering. Creating or preserving suffering—even minimally—cannot be justified by any surplus of well-being. | Offsetting is conceivable in principle: e.g., mild, transient suffering could be outweighed by vast, durable happiness. However, convex weighting implies a prohibitive threshold, making this irrelevant for severe suffering. |
  | **Moral Risk Asymmetry in Policy** | Policies reducing suffering face unique moral risks: the cost of failing to prevent suffering is infinitely worse than forgoing well-being gains. Caution must prioritize avoiding suffering-creation risks. | No distinct moral risk asymmetry exists. Risks arise symmetrically for all policies, but the convex weighting of suffering makes suffering-reduction failures disproportionately costly. |  

  #### 3. Cruxes  
  We identify critical points where further analysis could resolve disputes, including predictions:  

  3.1 **Crux: Suffering-Dominance Under Moral Uncertainty**  
  *Issue*: Whether moral uncertainty (e.g., hedging between ANU/SFC) collapses SFC’s convex weighting into lexical priority.  
  *Shared Case*: Choosing between:  
  - **Option A**: Guaranteed prevention of severe suffering for 1 billion beings.  
  - **Option B**: A 99.9% chance of immense happiness for 1 trillion beings, but a 0.1% risk of causing severe suffering to 1 million beings.  
  - *ANU Prediction*: Lexical priority demands Option A. No well-being gain justifies risking severe suffering.  
  - *SFC Prediction*: Expected value calculation permits Option B if the suffering risk is sufficiently low and well-being sufficiently high. Convex weighting may still favor Option A, but not axiomatically.  

  3.2 **Crux: Adaptive Preferences in Welfare Comparisons**  
  *Issue*: Whether interventions reducing suffering (e.g., pain management) are undermined if subjects adapt preferences to chronic deprivation.  
  *Shared Case*: A medical intervention eliminates chronic pain in a malnourished population. Post-treatment, subjects report high life satisfaction despite persistent malnutrition. Independent metrics confirm reduced pain but unchanged physical health.  
  - *ANU Prediction*: The intervention is intrinsically valuable. Adaptive preferences do not negate suffering’s badness; objective metrics trump subjective reports.  
  - *SFC Prediction*: While adaptation complicates welfare comparisons, the verified reduction in suffering retains moral weight. If evidence shows adaptation systematically distorts suffering reports, SFC may adjust its weighting.  

  #### 4. Verbal and Substantive Disputes  
  We assess that describing non-suffering as "not bad" (ANU) versus "weakly good" (SFC) is **partly verbal** but reveals a substantive divergence. ANU denies any intrinsic value to non-suffering, while SFC affirms it—though both agree this value is marginal relative to suffering-avoidance. Settling the lexical/convex debate would **not dissolve practical disagreements**, as edge cases (e.g., minimal suffering vs. astronomical happiness) would persist. However, clarifying thresholds could narrow policy gaps.  

  ---  
  This document reflects areas of principled agreement and disagreement between ANU and SFC. It is intended to facilitate rigorous engagement while acknowledging shared commitments to suffering-reduction as a paramount moral concern.  

  [Signatory for Axiological Negative Utilitarianism]  
  [Signatory for Suffering-Focused Consequentialism]
