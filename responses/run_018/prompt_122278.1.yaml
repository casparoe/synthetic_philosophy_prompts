  We are drafting an adversarial-collaboration document between two ethical positions: Axiological Negative Utilitarianism (ANU) and Suffering-Focused Consequentialism (SFC). The document must be structured as follows:

  1. **Agreed Claims**: A numbered list of precisely phrased claims that both parties accept. This section must cover:
     - Formal structure of suffering-weighted evaluation (lexical ordering vs. steep convex weighting function).
     - The non-identity problem as applied to future-suffering-prevention policies that do not alter who comes to exist.
     - Moral status of wild-animal suffering and artificial-suffering risks.
     - Conditions under which empirical evidence about welfare measurement could revise either side's weighting.

  2. **Disagreements Table**: A table or clear list stating the disagreements, with each view described in wording acceptable to that camp. The disagreements are:
     - Whether the asymmetry between suffering and well-being is axiological or deontic.
     - Whether there exists any scenario in which happiness could morally offset suffering.
     - Whether suffering-reduction policies are subject to a distinct "moral risk asymmetry" that does not apply symmetrically to well-being-creation policies.

  3. **Cruxes**: Identify the key points of contention, including:
     - Whether suffering-dominance collapses into lexicality under conditions of moral uncertainty.
     - Whether adaptive preferences formed within suffering-reduction interventions undermine the reliability of welfare comparisons.
     For each crux, provide a concrete case or argument both sides agree bears on it, and each side's advance prediction.

  4. **Assessment of Verbal vs. Substantive Dispute**: Briefly assess whether any part of the dispute is verbal, particularly around describing non-suffering as "not bad" versus "good", and note whether settling the formal-weighting question would dissolve the practical disagreement.

  The document should be formal, polished, and written for a rigorous philosophical dataset. Avoid citations and focus on describing concepts without naming them (except when necessary for clarity, but then describe). Use the conceptual distinctions provided.

  Let's structure the document accordingly.

  ---

  **Joint Statement on Axiological Priorities in Suffering-Focused Ethics**

  **1. Agreed Claims**

  We, the undersigned, representing a commitment to Axiological Negative Utilitarianism (ANU) and Suffering-Focused Consequentialism (SFC) respectively, affirm the following points of agreement:

  1.1 **Formal Structure of Suffering-Weighted Evaluation**: Both parties agree that the moral evaluation of outcomes must assign a disproportionately high weight to the reduction of suffering compared to the promotion of well-being. We concur that this weighting can be formalized in one of two ways: (a) as a lexical ordering where the prevention of any suffering, especially above a certain intensity, takes absolute priority over any increase in well-being, or (b) as a steep convex weighting function in which the moral disvalue of suffering increases at an accelerating rate as suffering intensifies, such that severe suffering dominates moral calculations without necessarily implying absolute lexical priority. Both parties accept that the choice between these formalizations is a central point of divergence, but agree that in practice, both approaches often recommend similar policies in the near-term, particularly in preventing extreme suffering.

  1.2 **Non-Identity Problem in Suffering Prevention**: We agree that policies aimed at preventing suffering in future generations must account for the fact that many such policies (e.g., improving future conditions without altering which individuals come into existence) do not create different individuals but rather benefit the same individuals who would otherwise exist. Therefore, the moral imperative to prevent suffering for these future individuals is not undermined by considerations of identity. We further agree that this applies to both anthropogenic and non-anthropogenic interventions, including those affecting non-human animals.

  1.3 **Moral Status of Wild-Animal Suffering and Artificial-Suffering Risks**: Both parties affirm that the suffering of sentient beings in wild ecosystems is a matter of serious moral concern, regardless of its natural origins. We further agree that risks of artificial suffering (e.g., from future digital minds or advanced AI systems) warrant proactive moral attention due to their potential scale and severity. The prevention of such suffering, whether natural or artificial, is a priority that both our views recognize as urgent.

  1.4 **Revisability Based on Empirical Evidence**: We agree that our respective weightings of suffering (whether lexical or convex) are subject to revision in light of empirical evidence regarding welfare measurement. Specifically, if robust evidence were to demonstrate that our current methods for comparing suffering across individuals or species are systematically flawed (e.g., due to neurological or behavioral indicators being misinterpreted), or if evidence showed that certain states we classify as suffering are not in fact negatively valenced, then both ANU and SFC would adjust their evaluations accordingly. However, we note that such evidence would need to be exceptionally robust to override our core commitment to suffering reduction.

  **2. Disagreements**

  The following table outlines the primary unresolved disagreements between ANU and SFC, with each view described in terms acceptable to its proponents:

  | Issue | Axiological Negative Utilitarianism (ANU) | Suffering-Focused Concedentialism (SFC) |
  |-------|-------------------------------------------|-----------------------------------------|
  | **Nature of the Suffering-Well-being Asymmetry** | The asymmetry is axiological: suffering is intrinsically bad, while the absence of suffering is neutral (neither good nor bad). Well-being above this neutral point is not intrinsically valuable; only the reduction of suffering has positive moral weight. | The asymmetry is primarily deontic: while suffering has overwhelming moral disvalue, well-being does have positive value. However, the disvalue of suffering is so steeply weighted that it typically dominates, but this weighting is instrumental (i.e., based on contingent features of suffering such as its intensity, depth, or irreversibility) rather than intrinsic. |
  | **Offsetting Suffering with Happiness** | There exists no scenario, in principle or practice, where an increase in happiness could morally justify the creation or preservation of suffering, no matter how minimal the suffering or how vast the happiness. The intrinsic badness of suffering is non-negotiable and cannot be counterbalanced. | While in practice it is extremely difficult to offset suffering with happiness due to the convex weighting, there may be conceivable scenarios (e.g., very mild and transient suffering offset by vast, enduring happiness for many) where the net outcome could be positive. However, the threshold for such offsetting is so high that it is unlikely to be met in real-world cases, especially for severe suffering. |
  | **Moral Risk Asymmetry in Policy** | Policies aimed at reducing suffering are subject to a distinct moral risk asymmetry: the moral cost of failing to prevent suffering (especially severe suffering) is vastly greater than the cost of forgoing an opportunity to promote well-being. This asymmetry is inherent in the axiological framework and implies that caution must be exercised against any policy that risks increasing suffering, even if it promises large well-being gains. | While suffering-reduction policies do carry higher moral stakes due to the steep convex weighting of suffering, this is not a distinct asymmetry in moral risk but a consequence of the weighting function. Well-being-creation policies also carry risks (e.g., of unintended suffering), but the risks are symmetric in kind, even if asymmetric in magnitude due to the weighting. Thus, no additional "moral risk asymmetry" principle is needed beyond the convex weighting. |

  **3. Cruxes**

  We identify the following cruxes—points where resolution of a specific issue could significantly advance the debate—and for each, we provide a shared case and each side's prediction.

  3.1 **Crux 1: Suffering-Dominance and Moral Uncertainty**  
  *Issue:* Whether, under conditions of moral uncertainty (where agents must account for multiple plausible moral theories), the principle of suffering-dominance (prioritizing the reduction of suffering) collapses into a lexical priority for suffering-avoidance, even for SFC.  
  *Shared Case:* Consider a policy choice between (A) a near-certain reduction of severe suffering for a large population, and (B) a policy that has a 99% chance of creating immense well-being for a vast number of beings but a 1% risk of causing extreme suffering to a much smaller group.  
  - *ANU Prediction:* Under moral uncertainty, ANU would insist that lexical priority for suffering-avoidance requires choosing (A), as the risk of extreme suffering cannot be justified by any potential well-being gain.  
  - *SFC Prediction:* SFC would use expected value calculation with steep convex weighting, and depending on the parameters, might accept (B) if the expected suffering is sufficiently low and the well-being sufficiently high. However, due to convexity, SFC would often reject (B) in practice.  

  3.2 **Crux 2: Adaptive Preferences and Welfare Comparisons**  
  *Issue:* Whether adaptive preferences (where subjects adjust their expectations to chronic suffering) undermine the reliability of welfare comparisons in the context of suffering-reduction interventions.  
  *Shared Case:* A program aims to reduce chronic pain in a population. Post-intervention, subjects report high life satisfaction due to lowered expectations, even though objective indicators (e.g., health metrics) show severe deficits compared to a healthy population.  
  - *ANU Prediction:* ANU holds that the adaptive preference does not alter the intrinsic badness of the suffering; thus, the intervention remains a moral priority even if subjects report satisfaction. Welfare comparisons should rely on objective suffering metrics, not subjective reports distorted by adaptation.  
  - *SFC Prediction:* SFC agrees that adaptive preferences complicate welfare measurement but argues that under a convex weighting, the reduction in reported suffering still has high moral weight. However, SFC is more open to revising the weighting if evidence shows that such adaptations genuinely reduce the experienced disvalue of suffering.  

  **4. Assessment of Verbal vs. Substantive Disputes**

  We acknowledge that a portion of the disagreement may be verbal, particularly in the description of non-suffering. ANU describes the absence of suffering as "not bad" (neutral), while SFC may describe it as "good" (though of low moral weight). However, we concur that this distinction is largely terminological: both views agree that the moral urgency of reducing suffering vastly outweighs the promotion of well-being from a neutral baseline. 

  Regarding the formal-weighting question (lexical vs. convex), we note that settling it would not fully dissolve the practical disagreement. Even if lexical priority were accepted, its application (e.g., defining the threshold for "suffering") would require empirical and conceptual refinement. Conversely, a convex function with extreme steepness may approximate lexical ordering in practice. However, the theoretical distinction remains significant for edge cases (e.g., minimal suffering vs. vast happiness) and for handling moral risk.

  In conclusion, while we differ on the axiomatic foundations, we share a commitment to prioritizing the prevention of suffering in practical ethics. This document serves to clarify both common ground and persistent disagreements, with the hope of fostering more productive dialogue.

  ---
