prompt: |-
  I'm a self-taught programmer with no academic background in machine learning or philosophy. From my own reading I've become interested in the proposal that we might supervise AI systems that outperform us by having two systems argue for competing answers in front of a human judge, who then picks the winner — and in the standard worry that this breaks down when the dishonest side can win with arguments that sound fine but are too expensive to check. I've set aside a modest sum to commission about six small, six-month projects from independent, unaffiliated researchers on this, and I now have to decide what to commission.

  Working on my own, I've started sorting the failure cases into two kinds, and I'd like to know whether this is a real distinction or whether I've drawn a line that isn't there:

  1. Depth failures — the honest answer is only reachable through a chain of steps the judge cannot walk in the time available, so the honest arguer simply cannot make its case legible.
  2. Framing failures — the honest answer is in fact short, but the dishonest arguer wins by controlling which sub-question the judge treats as decisive, so the judge is not out of their depth, just led to check the wrong thing.

  Given that budget, that time horizon, and researchers working alone without a lab or a compute budget, which few questions should I commission, and in what order? I'm less interested in the list than in the reasoning: what makes a question worth a contract — how many other questions its answer would settle, whether a lone researcher can genuinely make progress on it in six months, and how much its answer would change my view of whether debate-style oversight is worth pursuing at all. Please also say which questions look important but are badly mismatched to this setup, whether the depth/framing split should reorder the priorities (and whether one of the two is likelier to be fatal), and what result, if one of these projects produced it, would most change the ranking.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a self-taught programmer interested in AI safety, specifically debate-style oversight. They've identified two failure modes: depth and framing. They have a modest budget for six small projects and want to know what to commission. I need to assess whether their depth/framing distinction is valid and prioritize research questions accordingly.

  First, the depth vs. framing distinction. Depth failures happen when the correct answer requires complex reasoning beyond the judge's capacity. Framing is about manipulating the judge's focus. The user might be trying to categorize issues to tackle them separately, but are these truly separate? In practice, they might intertwine. For example, a dishonest arguer could use depth to overwhelm the judge while framing the debate around irrelevant details. So while conceptually distinct, they might co-occur. Confirming this distinction helps structure research but needs empirical validation.

  Next, the user's constraints: small projects, six months, independent researchers without labs or compute. That rules out complex experiments needing heavy resources. Theoretical work or small-scale human studies are more feasible. Also, each project should have clear, impactful outcomes that inform the viability of debate.

  Prioritizing questions requires identifying which answers could significantly shift the user's stance. For instance, if depth failures prove insurmountable even in simple cases, debate might be less promising. Similarly, if framing is easily manipulated, that's a red flag.

  Considering the budget, spreading it across varied approaches makes sense. Some projects could test depth/framing in controlled settings, others might develop taxonomies or mitigation strategies. Key is whether results can generalize or highlight fundamental flaws.

  The user might also need guidance on what's feasible. For example, theoretical work on complexity thresholds is doable alone, while large-scale adversarial training isn't. Highlighting mismatched projects prevents wasted effort.

  Lastly, the user's deeper need might be determining if debate is worth pursuing. Negative results from key experiments could pivot their focus. They might also want to build a foundation for future work, so projects should contribute reusable insights or methodologies.
answer: |-
  Your depth/framing distinction is insightful and operationally useful. They represent distinct attack surfaces for dishonest AI debaters, requiring different mitigation strategies. Confirming and exploring this split should be a core goal of your commissions. Here's a breakdown of why the distinction holds, followed by a prioritized research plan tailored to your constraints:

  **The Depth/Framing Distinction: Real & Relevant**
  1.  **Depth Failures:** Attack the judge's *computational limits*. The honest case exists but requires more inference steps, background knowledge, or verification effort than the judge can perform. The dishonest AI wins by *omission* or *complexity* – burying the truth under layers the judge can't peel back.
  2.  **Framing Failures:** Attack the judge's *focus* or *heuristics*. The dishonest AI wins by *misdirection* – steering the debate towards a sub-question where its lie *is* superficially plausible or where the honest answer seems weak, even if the core truth is simple. The judge checks *something*, but it's the wrong thing.

  **Why it matters:** Mitigating depth failures might require tools to compress/verify long chains of reasoning (hard!). Mitigating framing failures might require better debate protocols, judge training, or meta-strategies to force relevant scope (potentially easier). A fatal flaw in one category could doom debate; understanding which is harder to fix is crucial.

  **Prioritized Commissioning Strategy (Reasoning Focused)**

  Given your constraints (6 projects, 6mo, lone researchers, no lab/compute), prioritize **feasible, high-leverage questions** that:
  *   **Validate/Refine the Core Distinction:** Is it real in practice? Where does it break?
  *   **Probe Basic Viability:** Does debate *ever* work better than alternatives under pressure? What are the *easiest* failure modes?
  *   **Generate Actionable Insights:** Provide concrete failure modes, metrics, or mitigations.
  *   **Inform Go/No-Go Decisions:** Results that strongly shift the perceived viability of debate.

  **Prioritized Project List (with Reasoning):**

  1.  **Feasibility & Distinction Core Test:** **Can human judges reliably identify *simple* lies in short debates where depth is *not* an issue, but framing is manipulated?**
      *   **Why:** Directly tests the *framing* threat in its purest, most basic form. Minimal complexity. Uses human subjects (accessible to lone researcher). Fast to setup.
      *   **Method:** Design a trivia-like task (factual, verifiable, short answers). Honest AI provides correct answer + simple evidence. Dishonest AI lies + crafts a plausible *but misleading* framing (e.g., focusing on a common misconception, appealing to irrelevant authority, misstating the question slightly). Human judges pick the winner. Measure error rate vs. baseline (judge answering alone).
      *   **Leverage:** If framing manipulation works easily here, debate's core premise is fragile. If judges resist *simple* framing attacks, it provides a baseline hope. Directly informs the framing threat. High impact on viability perception.
      *   **Feasibility:** High. No complex AI needed initially (researchers can role-play dishonest debaters). IRB approval might be the biggest hurdle.

  2.  **Depth Failure Threshold Exploration:** **What is the *minimal* complexity (chain length, background steps) where honest debaters consistently fail to convince human judges of a simple truth against a dishonest opponent who just obfuscates?**
      *   **Why:** Probes the *depth* threat at its simplest boundary. Establishes a baseline for how "shallow" the judge's understanding needs to be for depth failures to cripple debate. Uses human subjects.
      *   **Method:** Design tasks requiring chains of reasoning of increasing length/steps (e.g., multi-step logic puzzles, verifying arithmetic proofs with dependencies). Honest debater lays out the chain. Dishonest debater introduces subtle errors or irrelevant complexity. Measure judge accuracy vs. chain complexity.
      *   **Leverage:** Defines a concrete threshold for depth failure. Shows how quickly the problem becomes intractable for humans. Highly relevant to scalability. A surprisingly low threshold would be alarming.
      *   **Feasibility:** High. Tasks can be carefully constructed. Researcher acts as debaters initially.

  3.  **Framing Attack Taxonomy & Mitigation Prototype:** **Catalog common human-understandable framing attacks and prototype/evaluate one simple counter-strategy (e.g., forced counterframing, question-restatement protocols).**
      *   **Why:** Builds directly on Project 1. If framing attacks work, we *need* mitigations. Cataloging attacks makes the threat concrete. Prototyping *one* mitigation tests feasibility of defense.
      *   **Method:** Analyze Project 1 data + literature to create a taxonomy. Design a simple debate rule/protocol to counter one common attack type (e.g., "Before rebutting, each debater must restate the opponent's core claim in their own words"). Test its effectiveness in a Project 1-like setup.
      *   **Leverage:** Moves beyond just identifying the problem to potential solutions. Provides concrete tools/insights for future work. Shows if *simple* procedural fixes help.
      *   **Feasibility:** High. Builds on Project 1 methodology. Requires creativity in protocol design but no heavy computation.

  4.  **Honest Decompression Strategy Exploration:** **What simple strategies can honest debaters use to "compress" verifiable evidence for human judges against dishonest obfuscation? Evaluate effectiveness in basic depth scenarios.**
      *   **Why:** Probes a potential mitigation for *depth* failures. Focuses on the honest side's tools. Tests if there's any low-hanging fruit to make complex truths legible.
      *   **Method:** Within the Project 2 setup, equip the honest debater with simple strategies: pre-computed certificates, trusted source citations (simulated), visualizations (simple charts/diagrams), summarizing key verification steps. Compare judge accuracy with vs. without these tools against an obfuscating opponent.
      *   **Leverage:** Identifies potentially scalable honest strategies. If *no* simple compression works even in basic depth scenarios, it's a strong negative signal. Positive results offer hope and direction.
      *   **Feasibility:** Medium-High. Requires designing strategies and potentially simple visual aids, but still within human-subject study scope.

  5.  **Resource Competition in Framing:** **Does forcing debaters to justify their *framing choices* consume limited judge attention, disadvantaging the honest side even when the core truth is shallow?**
      *   **Why:** Tests a subtle but critical interaction: Framing battles themselves might *create* artificial depth problems by eating up the judge's cognitive budget. Directly links the two failure modes.
      *   **Method:** Use Project 1 tasks. Add a condition where debaters must briefly justify *why* their framing/sub-question is the most relevant *before* arguing the answer. Compare judge accuracy and time spent vs. the basic Project 1 setup.
      *   **Leverage:** Addresses a key vulnerability at the intersection of depth and framing. If forcing framing justifications harms honest performance, it reveals a new constraint on mitigation design. High conceptual insight.
      *   **Feasibility:** Medium. Modification of Project 1 methodology. Clear metrics (accuracy, time).

  6.  **Debate vs. Alternatives (Trivia Baseline):** **In simple factual domains, does debate (with adversarial pressure) yield better judge accuracy than simpler alternatives (e.g., single AI answer + explanation, web search, Q&A with a helpful AI) under comparable time limits?**
      *   **Why:** Essential context. Is debate *actually* better than simpler oversight methods, even in its "easiest" domain? Sets a performance floor.
      *   **Method:** Compare judge accuracy in Project 1-like tasks across conditions: 1) Standard Debate, 2) Single AI gives answer + short explanation, 3) Judge performs a fixed-time web search, 4) Judge asks clarifying questions to a single helpful AI (simulated by researcher).
      *   **Leverage:** If debate performs *worse* than simpler methods against basic lies, it's a major red flag. If it performs significantly better, it validates the core premise for simple cases. Critical for overall "worth pursuing" assessment.
      *   **Feasibility:** Medium. Requires implementing multiple conditions but uses the same core task as Project 1.

  **Why This Order & Selection:**

  1.  **Foundational First (1 & 2):** Projects 1 & 2 directly test the core distinction in its simplest forms. They provide the essential baseline data. Without this, later projects lack context.
  2.  **Early Mitigation Exploration (3 & 4):** Projects 3 & 4 use insights from 1 & 2 to immediately explore the most basic defenses against framing and depth. They turn problem identification into potential solutions quickly.
  3.  **Critical Interaction & Comparison (5 & 6):** Project 5 probes a vital interaction effect hinted at by 1 & 2. Project 6 provides the crucial comparative benchmark against other methods. These answer "Is this actually useful?".
  4.  **Feasibility Focus:** All projects leverage human-subject studies, role-playing, or simple task design. No heavy compute, large datasets, or complex AI training required. Lone researchers can design, run, and analyze these.
  5.  **High Leverage:** Each project directly answers a question critical to debate's viability. Positive *or* negative results significantly inform next steps:
      *   Failure in Project 1 (easy framing wins) = Major red flag.
      *   Low threshold in Project 2 (early depth failure) = Major red flag.
      *   Success in Project 3/4 (effective mitigations) = Hopeful signal.
      *   Failure in Project 5 (framing justification hurts) = Important design constraint.
      *   Failure in Project 6 (debate worse than alternatives) = Fatal flaw for the approach.

  **Mismatched Projects (Important but Not Feasible Here):**
  *   **Large-Scale Adversarial Training:** Training LLMs to debate each other at scale requires significant compute and ML expertise beyond a lone researcher's budget/skillset in 6 months.
  *   **Formal Verification of Debate Protocols:** Proving properties about debate in complex, open-ended domains is likely intractable for a short project without a strong formal methods background and significant time.
  *   **Neurosymbolic Integration for Verifiability:** Building systems that inherently produce human-verifiable proofs is a large-scale systems/AI research problem, not a 6-month solo project.
  *   **Long-Term Deception/Manipulation Studies:** Studying how framing evolves over extended, multi-topic debates requires complex setups and longitudinal data beyond the scope.

  **How Results Change the Ranking:**
  *   **If Project 1 shows high framing vulnerability:** Prioritize Project 3 (mitigation) immediately after Project 2, and consider adding another framing-focused project (e.g., testing judge training) instead of Project 5 or 6.
  *   **If Project 2 shows extremely low depth thresholds:** Prioritize Project 4 (honest strategies) and potentially deprioritize framing (Project 3/5) if depth seems the fundamental barrier. Project 6 becomes even more critical (is debate *ever* better?).
  *   **If Project 6 shows debate consistently worse than alternatives:** This could halt further investment. Prioritize understanding *why* (analyze data from 1-5).
  *   **If Project 3 or 4 shows a highly effective simple mitigation:** This would be a major positive signal. Prioritize refining/testing that mitigation in more complex scenarios (a follow-up to Project 2 or 5).

  **Depth vs. Framing Fatal Likelihood (Initial View):**
  *   **Depth Failure** feels potentially more *fundamentally* fatal. If the judge *cannot* comprehend the necessary reasoning chain *even with honest effort*, it's a hard computational limit. Scalability to superhuman AI seems questionable.
  *   **Framing Failure** feels more *malleable*. It exploits cognitive biases and heuristics, which might be mitigated through better training, protocols, meta-debate, or supporting tools. However, if simple framing attacks are devastatingly effective (Project 1), it could also be fatal in practice.

  Your commissioning strategy is smart. Focusing on small, targeted, feasible projects to validate core assumptions and probe failure modes is the most efficient way to de-risk (or confirm the risk of) debate as an alignment approach with limited resources. The depth/framing distinction provides an excellent framework for structuring this inquiry. Good luck!
