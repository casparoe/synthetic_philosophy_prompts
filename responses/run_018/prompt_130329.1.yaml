prompt: |-
  Your an expert in international legal philosphy and genocide studies — please think carefully, maybe do some quick brainstorming first, then walk me through your reasoning step by step. I'm trying to map out the hidden rules behind my colleague's review board on atrocity naming. There record so far: they called the 1994 Rwandan killings genocide; they refused to apply the label to the Canadian residential school system, arguing that destroying a group's culture without direct physical extermination intent misses Lemkin's core; they named the Holodomor genocide since the famine was ethnically targeted and engineered by the state; they said Cambodia's auto-genocide wasn't technically genocide under the convention because the victims shared the perpetrators' ethnicity, though they called it a mass atrocity; and they named the Yazidi campaign genocide because the intent to destroy was explicit in ideology and practice.

  Now here's a fresh case they haven't seen: a government uses predictive demographic algorithms to gradually cut off healthcare, water rights, and land access to one ethnic enclave. There's no direct killing order, but internal planning docs say the aim is to make the population "demographically vanish within two generations." Mortality and out-migration jump sharply. The board has to vote.

  What should they decide if they actually want to be consistent with there past rulings? I'm not just asking yes or no — I want to know the rule they seem to be running (explicit intent? protected-group status? physical violence as necessary? foreseeable destruction regardless of method?). Which of there earlier cases is the closest analog? And be honest: if there precedents genuinely don't settle it, what principle would they be adopting either way? Finally, what's the one further case that would best split these competing rules — like explicit intent with purely economic means, or direct violence against a group outside Lemkin's protected categories?
reasoning: |-
  Okay, the user is asking me to analyze their colleague's review board's pattern in labeling atrocities as genocide or not. They've provided several past cases: Rwanda 1994 as genocide, Canadian residential schools not genocide, Holodomor as genocide, Cambodia not genocide (but mass atrocity), and Yazidi as genocide. Now there's a new case where a government uses indirect methods like cutting off healthcare and land access to make an ethnic group "demographically vanish." 

  First, I need to figure out the board's implicit rules. Let me list their past decisions and see what stands out. For Rwanda, they called it genocide—direct killing intent was clear. Canadian residential schools: they refused the label because there was cultural destruction without intent for physical extermination. So intent matters here. Holodomor: targeted famine, state-engineered, so genocide—again, intent and targeting a group. Cambodia: victims same ethnicity as perpetrators, so not genocide under the convention. Yazidi: explicit intent to destroy, so genocide.

  The key factors seem to be: 1) intent to destroy a group, 2) the group being one of the protected categories (national, ethnic, racial, religious), 3) physical destruction being necessary or if cultural/demographic methods count. In Canada, they said cultural destruction alone isn't enough without physical extermination intent. Holodomor involved physical destruction through famine, which is a biological means. Yazidi had explicit intent and physical actions.

  Now the new case: government uses predictive algorithms to cut off essential services, aiming for "demographic vanish." No direct killing, but planning docs show intent. Mortality and migration increase. So, is this similar to Canada or Holodomor? 

  Comparing to precedents: Holodomor used famine (physical destruction), while Canada was cultural. The new case involves creating conditions leading to physical destruction (mortality) but through indirect means. The board might argue it's like Canada—structural violence without direct killing orders. However, internal docs show explicit intent to destroy, which parallels Yazidi. But Yazidi had direct violence; here it's slow, structural. 

  The board's consistency hinges on whether physical destruction is necessary. They required it in Canada. But in Holodomor, famine is a method of physical destruction. The new case has increased mortality, so maybe it's physical. But it's not state-engineered famine; it's cutting services leading to death. Is that different? The intent is explicit, like Yazidi. The group is ethnic, so protected. 

  The closest analog might be Holodomor—both involve state-engineered conditions causing physical destruction targeting a group. But Holodomor was famine; here it's services. The board might see it as meeting the criteria: intent, protected group, destruction via physical means (mortality from denied healthcare). However, if they strictly require direct violence, they might decline. But Yazidi had direct violence, and they accepted it. 

  The key principle being adopted: whether non-violent methods causing physical destruction qualify. If they accept, they're expanding genocide to include structural conditions with proven intent and mortality. If not, they're insisting on more direct violence. 

  A split case could be explicit intent with purely economic sanctions leading to mass starvation. No violence, but foreseeable deaths. That tests if physical destruction must be violent or just any means causing death. Another split case: violence against a group outside protected categories, like political groups. Would they stretch the convention? 

  So for the new case: the board would likely call it genocide because of explicit intent, protected group, and resulting physical destruction (mortality), aligning with Holodomor. But it's not identical, so they might debate the methods. If they're consistent, they should vote yes. If not, they might cite lack of direct violence. But the precedents suggest they value intent and outcome over method.
answer: |-
  Based on your board's precedent analysis, here's a step-by-step breakdown of their likely reasoning for the new case, the implicit rules, analogies, unresolved tensions, and a test case:

  **Step 1: Identifying the Board's Implicit Rules (From Precedents)**
  1.  **Core Primacy of Specific Intent:** The *intent to physically destroy* a protected group (national, ethnic, racial, religious) is paramount (Rejecting Canada, Accepting Rwanda/Yazidi/Holodomor). Cultural destruction alone is insufficient without this specific intent (Canada ruling).
  2.  **Physical Destruction is Necessary:** Destruction must encompass *physical or biological* eradication, not solely cultural assimilation (Canada vs. Rwanda/Holodomor/Yazidi). "Destroy" in the Genocide Convention is interpreted as physical/biological annihilation.
  3.  **Protected Group Definition is Strict:** Victims must constitute one of the Convention's protected groups *as defined by the perpetrator's intent/targeting* (Rejecting Cambodia due to shared ethnicity, Accepting others where distinct groups were targeted).
  4.  **Method is Secondary to Intent & Outcome:** The *means* of destruction (machetes, famine, bullets, engineered deprivation) are less critical than the presence of specific intent and the foreseeable physical destruction (Holodomor accepted despite famine method; Yazidi accepted despite initial enslavement focus alongside killing).
  5.  **"In Whole or In Part":** Destruction need not be total or immediate; foreseeable long-term demographic elimination qualifies if driven by specific intent (Holodomor's engineered famine over years; Yazidi campaign aimed at destruction).
  6.  **State/Organizational Engineering is Key:** The atrocity must be a deliberate, organized policy or plan (Accepting Rwanda/Holodomor/Yazidi).

  **Step 2: Applying Rules to the New Case**
  *   **Intent:** **HIGHLY SALIENT.** Internal planning docs explicitly state the aim: "make the population demographically vanish within two generations." This directly signals *specific intent to physically destroy* the ethnic group through demographic elimination. This aligns strongly with the *Yazidi* precedent (explicit ideology/practice) and *Holodomor* (engineered outcome).
  *   **Protected Group:** **SATISFIED.** The target is clearly an "ethnic enclave."
  *   **Physical Destruction:** **PROBABLY SATISFIED.** Cutting off healthcare, water, and land access foreseeably leads to increased mortality ("Mortality... jumps sharply") and forced displacement ("out-migration"). While not "direct killing orders," it's deliberate creation of conditions *calculated to bring about physical destruction* through disease, malnutrition, and displacement-induced vulnerability. This mirrors *Holodomor* (engineered famine) more than *Canada* (cultural destruction without proven physical extermination intent). The "demographic vanish" intent inherently implies physical destruction.
  *   **Method:** **SECONDARY BUT SUPPORTIVE.** Predictive algorithms and structural deprivation are the *means*. The board's precedent (*Holodomor* = famine; *Rwanda* = machetes; *Yazidi* = killing/sexual slavery) shows methods are less important than intent and outcome.
  *   **State Action & Foreseeability:** **SATISFIED.** Government action using planning documents and algorithms demonstrates state engineering. The outcome (increased mortality/migration) was clearly foreseeable and intended.

  **Closest Analog:** **Holodomor.** Both involve:
  1.  State-engineered deprivation (famine vs. essential services/land).
  2.  Ethnic targeting.
  3.  Intent to cause demographic collapse/destruction.
  4.  Foreseeable massive physical destruction (death and displacement).
  5.  Method involving creating lethal conditions rather than solely direct killing orders.

  **Step 3: Consistency Verdict**
  **The board, to be consistent, would likely vote YES, this is Genocide.**
  *   **Why?** The explicit intent to physically destroy ("demographically vanish") a protected ethnic group through deliberately engineered conditions causing increased mortality and forced displacement hits the core requirements established in *Rwanda*, *Holodomor*, and *Yazidi*. It fundamentally differs from *Canada* (lack of proven physical destruction intent) and *Cambodia* (lack of protected group distinction).

  **Step 4: Unresolved Tension & Adopted Principle**
  *   **Unresolved Tension:** The *degree of directness* linking structural actions to physical death. While *Holodomor* involved immediate starvation, this case involves slower death via preventable disease and malnutrition due to denied services. The board insists on physical destruction but hasn't explicitly ruled on whether *slow-motion, structurally-engineered death* triggered by deprivation (without bullets or gas chambers) qualifies *if intent is explicit*. They implicitly accepted slow death in *Holodomor*.
  *   **Principle Adopted by Voting YES:** **Genocide encompasses the deliberate creation of conditions of life *calculated* to bring about the physical destruction of a protected group, irrespective of the speed or directness of the method, provided specific intent is proven.** This expands "conditions of life" (Article 2(c)) beyond cultural suppression to encompass deliberate denial of essential biological needs causing foreseeable death.
  *   **Principle Adopted by Voting NO:** **Genocide requires a more direct causal link between state action and physical killing, or a threshold of violence/brutality beyond foreseeable death resulting from structural deprivation, even with explicit genocidal intent.** This would be a *departure* from *Holodomor* but might be argued by emphasizing the immediacy of starvation vs. the indirectness of healthcare denial.

  **Step 5: The Ideal Splitting Test Case**
  **Case:** **Systematic economic blockade/sanctions explicitly designed by State A to starve and eliminate ethnic Group B within State C, documented as "final solution," causing mass starvation deaths. No kinetic military action by State A.**
  *   **Why it Splits the Rules:**
      *   **Explicit Intent:** Clear genocidal intent ("final solution").
      *   **Protected Group:** Ethnic Group B.
      *   **Physical Destruction:** Mass death by starvation (foreseeable and intended).
      *   **Method:** **Purely economic means** (blockade/sanctions). No direct violence, no engineered famine *within* the territory like Holodomor, no bullets/machetes.
  *   **The Split:**
      *   **Consistent with "YES" on new case:** Explicit intent + foreseeable physical destruction via engineered conditions (starvation) = Genocide. Method irrelevant.
      *   **Argument for "NO":** Lacks "direct" state violence/engineering *within* the territory. Could be framed as "aggression" or "crimes against humanity" but not genocide due to the *external*, purely economic method, stretching the Convention too far. Tests the outer limit of "conditions of life" and "directness."
      *   **This case forces the board to decide:** Is *explicit intent to physically destroy via any means causing foreseeable mass death* sufficient (aligning with the logic of the new case and Holodomor), or is *some threshold of direct, violent state action within the targeted territory* essential? It directly challenges the "physical destruction necessary" rule versus the "method secondary" rule.

  **Conclusion:** Your board's precedents lean heavily towards labeling the new case genocide due to the explicit intent to physically destroy an ethnic group via deliberately engineered conditions causing foreseeable death and displacement, aligning most closely with *Holodomor*. The unresolved tension is the "directness" of the method causing death, which the proposed test case (economic blockade with explicit genocidal intent causing starvation) would decisively force them to confront.
