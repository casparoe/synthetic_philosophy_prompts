  So the "always irrational" conclusion? It clearly doesn't survive. The analogy was smuggling that in by oversimplifying. In one-off decisions with fungible costs, sure - walk out of the bad film. But when prior commitments build unique value or affect future games, honouring sunk costs can be strategically rational. The economists are right: it's about credibility, not fallacy. 

