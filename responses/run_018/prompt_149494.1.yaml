prompt: |-
  I work in mechanism design and am fluent in its formal vocabulary—strategy-proofness, individual rationality, budget balance, the revelation principle, social-choice functions, equilibrium selection, and matching algorithms—but I have little background in moral philosophy. I want you to restate the philosophical debate over repugnant markets—specifically Sandel’s thesis that putting prices on goods such as kidneys, emergency supplies during shortages, or votes corrupts their social meaning and crowds out intrinsic motivations, and Roth’s thesis that repugnance is best treated as a legitimate constraint on the feasible set of allocations—entirely within my vocabulary. Treat Sandel’s “corruption of meaning” as a potential failure mode of a mechanism, and his “crowding out” as an interaction between the allocation rule and agent preferences. Treat Roth’s repugnance constraint as a boundary condition on mechanism design. For each central claim, indicate whether it translates cleanly into an existing design concept (for example, preference misrepresentation, externalities in welfare functions, or endogenous preference formation), whether it can be expressed only by distorting its meaning (for example, reducing moral significance to a parameter in a utility function), or whether it has no counterpart at all in mechanism-design language. Then report the residue: is the untranslatable remainder a sign that mechanism design genuinely lacks the resources to represent normative corruption, or is it a sign that the philosophical claim was less determinate than it appeared? Be honest in the translation—do not smuggle moral assumptions into formal terms merely to make them fit. In particular, address whether capturing crowding out requires allowing preferences to shift as a direct function of the allocation rule, which violates the standard independence assumption, and whether vote-selling can be represented without collapsing democratic legitimacy into a transferable utility. Focus on price-gouging and vote-selling, since kidney markets are already well-discussed in design literature. Keep the translation faithful, and treat the residue as the most interesting part of the answer.
reasoning: |-
  Okay, the user works in mechanism design and wants a translation of the philosophical debate on repugnant markets into their formal vocabulary. They specifically mentioned Sandel's "corruption of meaning" and "crowding out," as well as Roth's repugnance constraint. 

  First, I need to recall Sandel's main arguments. He argues that putting prices on certain goods corrupts their social meaning and crowds out intrinsic motivations. For example, during emergencies, price-gouging might undermine solidarity. Roth treats repugnance as a constraint on what allocations are socially acceptable. 

  The user wants these concepts framed as mechanism design issues. Sandel's corruption of meaning could be seen as a negative externality that alters the utility functions of agents. Crowding out would involve preferences shifting based on the allocation rule, which violates the standard independence assumption in mechanism design. That's a key point because most models assume preferences are fixed. 

  Roth's repugnance constraint is more straightforward—it's like an exogenous limitation on the feasible set. Similar to legal or physical constraints already considered in mechanism design. But the user wants to know if this reduction loses the moral nuance. 

  For vote-selling, the challenge is representing democratic legitimacy without reducing it to transferable utility. In mechanism design, votes are often just signals of preference. Selling them would be like allowing transfers, but that ignores the intrinsic value of voting. Capturing this might require a multi-dimensional type space, but legitimacy itself is hard to quantify. 

  Price-gouging during shortages involves perceived fairness. If the mechanism allows high prices, it might shift agents' preferences, making them less altruistic. This crowding out effect means the mechanism's allocation rule affects preferences, which isn't standard. 

  The residue here is significant. The untranslatable parts are the normative aspects—why certain meanings are "corrupted" and what constitutes legitimacy. Mechanism design can model the effects (like changed preferences) but not the underlying moral reasons. This gap might indicate that the philosophical claims are less determinate or that the field needs new tools to handle endogenous preferences. 

  The user also asked to avoid smuggling moral assumptions into formal terms. So I need to ensure that terms like "externality" aren't conflated with moral judgments. For example, labeling the corruption of meaning as an externality is descriptive, not normative. 

  In conclusion, Roth's constraint translates cleanly, while Sandel's ideas require stretching existing concepts (endogenous preferences) or introducing new ones. The residue highlights that mechanism design can model behavioral changes but not the moral essence, possibly because Sandel's thesis relies on societal norms that aren't yet formalized in the framework.
answer: |-
  Here is the translation of the repugnant markets debate into mechanism design vocabulary, identifying clean mappings, distortions, and irreducible residues for price-gouging and vote-selling:

  ### Core Translation Framework
  1.  **Sandel's "Corruption of Meaning"**: Interpreted as a **negative externality imposed by the allocation rule** on agents' utility functions for non-traded goods (e.g., social trust, civic dignity). This externality alters the *social meaning* component of utility.
  2.  **Sandel's "Crowding Out"**: Modeled as **endogenous preference formation** where the allocation rule \( f \) directly shifts agents' intrinsic valuation parameters. Formally, \( u_i(\theta_i, \omega, f) \) – preferences depend on the rule itself.
  3.  **Roth's Repugnance Constraint**: Treated as an **exogenous limitation on the feasible set \( \mathcal{F} \) of allocations**, analogous to physical or legal constraints (e.g., \( \mathcal{F} \ni \omega \) only if \( \omega \) avoids "repugnant" trades).

  ---

  ### Price-Gouging During Shortages (e.g., Disaster Supplies)
  *   **Sandel's Claim (Corruption)**: Allowing market-clearing prices \( p^* \) during shortages transforms the good from a "necessity" to a "commodity," imposing a negative externality on social cohesion.
      *   *Translation*: **Clean mapping to an externality.** Agents experience disutility \( \phi_i(\omega) \) when \( \omega \) includes high-price allocations for essential goods during emergencies, even if they don't transact. This is a standard welfare component.
  *   **Sandel's Claim (Crowding Out)**: High prices crowd out altruistic/normative motivations to help neighbors.
      *   *Translation*: **Requires endogenous preferences.** Agent \( i \)'s intrinsic valuation \( v_i^{\text{altruism}} \) is a decreasing function of the price \( p_j \) observed in the allocation: \( v_i^{\text{altruism}} = g(p_j), g' < 0 \). This **violates preference independence** – the rule affects \( \theta_i \).
  *   **Roth's Constraint**: Society forbids "price-gouging" allocations; \( \mathcal{F} \) excludes \( \omega \) where \( p_{\text{good}} > \bar{p} \) during declared emergencies.
      *   *Translation*: **Clean mapping to a feasibility constraint.** \( \mathcal{F} := \{ \omega \mid p_{\text{good}} \leq \bar{p} \} \) during shortage. Mechanism design routinely incorporates such constraints.

  **Residue for Price-Gouging**:
  *   *What constitutes "corruption"?* Mechanism design can model the externality \( \phi_i(\omega) \) but cannot derive *why* high prices generate this disutility. The normative content ("this *should* be a gift, not a commodity") is exogenous.
  *   *Is crowding out a design flaw or a preference fact?* Endogenous preferences are tractable but uncommon in canonical models. Sandel implies this is a *failure mode* of the price mechanism itself, while mechanism design treats it as a preference structure to be accommodated. The residue is whether endogeneity is a fundamental flaw or just a constraint.

  ---

  ### Vote-Selling
  *   **Sandel's Claim (Corruption)**: Allowing votes to be sold transforms voting from a "civic duty" into a "commodity," undermining democratic legitimacy.
      *   *Translation*: **Partial mapping to externality.** Legitimacy loss is a public bad. All agents suffer disutility \( \psi_i(\omega) > 0 \) if \( \omega \) includes vote sales. However, **"legitimacy" has no direct counterpart** – it's not a standard good or externality in SCFs.
  *   **Sandel's Claim (Crowding Out)**: Introducing monetary incentives for voting crowds out intrinsic civic motivation.
      *   *Translation*: **Endogenous preferences required.** Agent \( i \)'s civic duty parameter \( c_i \) decreases if vote-selling is permitted: \( c_i = h(\mathbb{I}_{\text{vote-sale}}), h' < 0 \). Again, violates independence.
  *   **Roth's Constraint**: Vote-selling allocations are infeasible; \( \mathcal{F} \ni \omega \) only if \( \omega \) has no monetary transfers for votes.
      *   *Translation*: **Clean mapping to feasibility constraint.** \( \mathcal{F} := \{ \omega \mid t_i(\text{vote}) = 0 \ \forall i \} \).

  **Residue for Vote-Selling**:
  *   *The Collapse Problem*: Representing vote-selling requires defining a vote's "civic value" separately from its instrumental/swap value. If we model an agent's type as \( \theta_i = (\tilde{v}_i, c_i) \), where \( \tilde{v}_i \) is policy preference intensity and \( c_i \) is civic duty weight, selling a vote for price \( p \) implies \( u_i(\text{sell}) = p + \alpha c_i \) (with \( \alpha < 1 \) if corrupted). **This reduces legitimacy to a utility parameter \( c_i \)**, which Sandel argues is the very corruption mechanism design must avoid. There is no way to represent "inherent illegitimacy" without parameterizing it.
  *   *Non-Transferability of Legitimacy*: Mechanism design assumes utility is *transferable* via money. Sandel claims democratic legitimacy is *constituted by* the non-transferability of votes. **This non-transferability has no formal analogue** – it’s a meta-constraint on the model itself.

  ---

  ### Residue Analysis: What Remains Untranslatable?
  1.  **Normative Grounding of "Corruption"**: Mechanism design can model *that* an allocation causes disutility via externalities or preference shifts, but it cannot capture *why* a specific meaning (civic duty, human dignity) is normatively significant or how it arises. This residue suggests **Sandel's claim relies on exogenous moral sociology**.
  2.  **Endogenous Preferences as Failure vs. Constraint**: Sandel presents crowding out as a *fatal flaw* in market mechanisms for certain goods. Mechanism design treats it as a *design constraint* (preferences are functions of \( f \)). The residue is **whether endogeneity invalidates mechanism design's welfarist foundations** for these domains.
  3.  **The Status of Roth's Constraint**: While cleanly mapped, its *origin* (social repugnance) has no mechanism-design explanation. Residue: **Is repugnance an arbitrary restriction or an emergent property of deeper norms?** Design treats it as axiomatic.
  4.  **Non-Reducibility of Legitimacy**: Vote-selling exposes mechanism design's **utilitarian limits**. "Democratic legitimacy" cannot be represented without reducing it to utility components or constraints, which Sandel argues destroys the phenomenon. This residue suggests **a genuine limitation of the framework** for modeling constitutive social rules.

  ### Conclusion
  *   **Clean Translations**: Roth's constraint maps perfectly to feasibility sets \( \mathcal{F} \). Sandel's negative externalities map to standard welfare components.
  *   **Distortions Required**: Sandel's "corruption" *becomes* an externality – the moral significance is flattened. Crowding out *requires* endogenous preferences, violating standard assumptions.
  *   **Irreducible Residue**: 
      *   The **normative source** of social meanings (why votes *should* be duties) remains exogenous. 
      *   **Democratic legitimacy** resists formalization without self-defeating reductionism.
      *   Endogenous preferences challenge **welfare evaluation** (is post-crowding-out utility the right metric?).

  **This residue reveals mechanism design's normative neutrality as both a strength (flexibility) and limitation (inability to adjudicate the *source* of constraints like repugnance). Sandel's claims highlight where the framework must import unexamined moral assumptions to model "corruption," while Roth's approach shows how designers can work within constraints without endorsing them. The untranslatable core is the *moral sociology* that defines which meanings are vulnerable to corruption.**
