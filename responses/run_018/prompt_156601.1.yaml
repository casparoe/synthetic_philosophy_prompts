prompt: |-
  Analyze Alfred Wegener’s early-1910s continental-drift proposal and its rejection by mainstream geologists for roughly five decades as a case study in peer disagreement between conciliationism and steadfastness. The shared observational record—continental fit, trans-oceanic fossil matches, glacial striations—was largely agreed upon; the split concerned whether that pattern was decisive absent a credible physical mechanism and in the face of established geophysical models. Treat Wegener and his geological critics as epistemic peers with identical access to the data but divergent prior weightings of mechanistic explanation versus correlational evidence. Apply both conciliationism and steadfastness: state precisely what each side should have done to its own credence and to its assessment of the other, distinguishing disagreement about the data itself from disagreement about the evidential threshold required to overturn a dominant paradigm. Then consider the 1960s vindication through seafloor spreading and plate tectonics: does this later convergence show that the geologists failed an obligation to conciliate, that Wegener was right to remain steadfast, or that both norms misfire when the dispute is over standards of proof rather than direct contradictory observations? Conclude with what the episode suggests about the scope of peer-disagreement norms. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Hmm, the user wants me to analyze Alfred Wegener's continental drift theory as a case study in peer disagreement between conciliationism and steadfastness. This is an interesting philosophical question about how scientists should respond when they disagree despite having the same evidence.

  First I need to recall the key facts: Wegener proposed continental drift in the 1910s based on evidence like continental fit, fossil matches, and glacial patterns. Mainstream geologists rejected it because there was no physical mechanism to explain how continents could move, and it contradicted established geophysical models. Both sides had the same data but weighted it differently - Wegener prioritized correlation evidence while his critics valued mechanistic explanations.

  For conciliationism (which says peers should move toward each other's views when disagreeing), both sides should have lowered their confidence. Wegener should have reduced his certainty about drift being true, and critics should have reduced their certainty about it being impossible. They should have seen each other as reasonable despite the disagreement.

  For steadfastness (maintaining your position firmly), Wegener was right to stick to his guns despite opposition, and critics were justified in demanding better evidence before accepting such a radical theory.

  The 1960s vindication through plate tectonics shows that the disagreement wasn't about the data itself but about how much evidence was needed to overthrow the existing paradigm. This suggests that peer-disagreement norms might not apply cleanly when the dispute is about standards of proof rather than direct observations.

  The core insight here is that conciliationism and steadfastness both have limitations in scientific revolutions. The norms work best for disagreements about observable evidence, not for deeper conflicts about what counts as sufficient proof to challenge a paradigm. This case shows that scientific progress sometimes requires steadfast commitment to new ideas despite peer opposition.
answer: |-
  **The continental-drift case reveals that peer-disagreement norms (conciliationism/steadfastness) inadequately handle paradigm-shifting disputes centered on divergent evidential standards rather than direct data interpretation.**  

  1.  **Conciliationism Applied:**  
      *   **Both sides should have significantly lowered their credence in their own position.** Wegener should have reduced his confidence that drift *was* true, acknowledging the legitimate demand for a plausible mechanism by competent peers. His critics should have significantly increased their credence that drift *might* be possible (or decreased their confidence in its impossibility), acknowledging the strength and coherence of the correlative evidence presented by a peer.  
      *   **Both sides should have revised their assessment of the other's rationality upwards.** Wegener should have recognized his critics weren't dogmatic but were upholding a core scientific norm (mechanistic explanation). Critics should have recognized Wegener wasn't irrational but was highlighting a significant, unexplained pattern demanding attention. The disagreement was fundamentally about the *weight* of correlative evidence needed to challenge the stable-Earth paradigm *absent* mechanism, not the data itself.  

  2.  **Steadfastness Applied:**  
      *   **Wegener was justified in maintaining high credence in drift** based on the compelling correlative evidence he amassed, viewing the lack of mechanism as an unsolved problem rather than a fatal flaw. He could rationally assess his critics as overvaluing current geophysical models and undervaluing correlative evidence.  
      *   **The critics were justified in maintaining high credence against drift** based on the established geophysical principles (isostasy, strength of crust) that rendered drift seemingly impossible without a credible mechanism. They could rationally assess Wegener as undervaluing the necessity of mechanistic explanation and overinterpreting correlative evidence against a robust paradigm.  

  3.  **Vindication and Norm Assessment:**  
      The 1960s convergence via seafloor spreading/plate tectonics (providing the mechanism) vindicates Wegener's fundamental insight but **does not clearly show a failure of either norm or validate steadfastness alone.** Rather, it highlights the **core limitation of applying these norms to this type of disagreement:**  
      *   **Not a Failure to Conciliate:** Critics conciliating wouldn't have meant accepting drift prematurely; it might have meant greater openness to *investigating* the anomalies seriously, potentially accelerating discovery. However, demanding a mechanism before overturning a strong paradigm was scientifically reasonable at the time.  
      *   **Not Simple Vindication of Steadfastness:** While Wegener's steadfastness was crucial for keeping the idea alive, his specific mechanism (continental ploughing through ocean crust) was wrong. Critics' steadfastness upheld crucial standards but delayed progress.  
      *   **Norms Misfire on Standards of Proof:** The disagreement was **over the evidential threshold for paradigm shift**, not the data itself. Conciliationism struggles because "splitting the difference" on *how much evidence is enough* is ill-defined. Steadfastness risks entrenching positions without resolving the underlying conflict about what constitutes sufficient proof against a dominant theory. The resolution came not from reassessing the *old* data differently under peer pressure, but from acquiring **entirely new data (seafloor magnetism/bathymetry)** and formulating a **new physical theory** that met the critics' mechanistic standard *and* explained Wegener's correlations.  

  **Conclusion on Scope of Norms:**  
  This episode demonstrates that peer-disagreement norms like conciliationism and steadfastness are primarily suited for disagreements **within a shared theoretical framework or about the interpretation of specific, directly contested observations.** They falter when:  
  1.  The core dispute concerns the **evidential threshold required to overturn a well-established paradigm** (standards of proof).  
  2.  The disagreement hinges on **deeply held, divergent priors** about what *type* of evidence (e.g., mechanistic vs. correlative) is fundamentally decisive.  
  3.  Resolution requires **new data or concepts** outside the originally shared evidence base.  
  In such paradigm-shifting contexts, scientific progress depends less on peers conciliating on credences based on existing evidence, and more on the generation of new evidence/theory that can *change* the underlying standards of evaluation and create a new shared framework.
