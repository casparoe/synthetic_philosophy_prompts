prompt: |-
  hey, i'm trying to map my advisor's implicit framework for intergenerational climate ethics from the seminar verdicts she's given over the past year. here's the track record so far:

  - she said taxing carbon now is required to protect specific populations in 2100, even if that means smaller populations
  - she okayed a solar geoengineering plan that shifts rainfall and changes who gets born in 2200, but only because expected wellbeing goes up and there's basically zero runaway risk; she rejected an otherwise identical version with a 5% permafrost cascade chance
  - she said delaying decarbonization is wrong when it lowers welfare for whoever actually lives in 2100, but she was insistant that the wrongness isn't "harming those particular people" since they wouldn't exist under the fast path — she kept framing it as the world just being worse overall
  - she also said if a policy makes future people worse off without changing who they are, that's clearly forbidden

  so she's running some mix of person-affecting constraints, total-welfare evaluation, and maybe a catastrophic-risk side condition? or a cross-generational contractualist test? i can't tell.

  new workshop case: there's a proposal for a "lineage-targeted resilience bond" where predictive demographic models direct climate adaptation spending only to regions where specific genetic lineages are forecast to live in 2080. this shifts migration and therefore who gets born. the people who do exist have decent lives, aggregate welfare is slightly lower than universal adaptation, and climate risk stays well below catastrophic thresholds — maybe 1.8 degrees, no tipping points.

  what do you think she'll say? is she on a pure person-affecting rule plus risk constraint, straight expected-welfare maximization across identities, or something contractualist? which prior verdict is teh closest analog? and if her record genuinely underdetermines this, what principle is she adopting with each choice? also, what's the further case that'd actually settle between the rules?
reasoning: |-
  Okay, let me try to unpack this user's query. They're mapping their advisor's framework on intergenerational climate ethics based on past seminar verdicts. The user provided four key decisions and now has a new case about "lineage-targeted resilience bonds." I need to figure out what ethical framework the advisor is using and predict her response to the new case.

  First, looking at the past verdicts. She supports taxing carbon now to protect specific 2100 populations, even with smaller populations. That suggests she cares about the welfare of future individuals who will exist, not just the total number. Then there's the geoengineering case: approved when wellbeing increases with no risk, but rejected with a 5% cascade chance. So she seems to weigh catastrophic risks heavily, beyond just expected welfare. 

  The third point is tricky. Delaying decarbonization is wrong because it lowers welfare for 2100 inhabitants, but she explicitly denies it's about harming specific people since they wouldn't exist otherwise. Instead, she frames it as the world being "worse overall." That sounds like impersonal totalism—where the value lies in states of affairs, not specific individuals. But she also says that making existing future people worse off is forbidden, which is a person-affecting constraint. 

  So there's tension here. Maybe she combines impersonal total welfare for same-number cases with person-affecting when identities change? But in the decarbonization delay case, identities change, yet she condemns it impersonally. Hmm. 

  The new case involves lineage-targeted bonds: adaptation spending directed based on genetic lineage forecasts, altering who is born. Aggregate welfare is slightly lower than universal adaptation, but no catastrophic risks. Since identities change, under her framework, it might not count as harming specific future people. But the welfare is lower. 

  Given her past rulings, I think she'd reject this. The lineage targeting likely violates her person-affecting constraint against making specific people worse off without identity change. Even though identities shift here, the adaptation policy creates a situation where the future people who do exist have lower welfare than they could have under universal adaptation. She seems to prioritize avoiding worse outcomes for whoever exists, regardless of identity. 

  The closest analog is the decarbonization case—she focused on welfare levels, not identity. Also, the lower aggregate welfare here would make the world "worse overall," which she rejected before. The absence of catastrophe risk doesn't offset the welfare drop, as in the geoengineering rejection. 

  To settle between rules, a case where identity change leads to higher welfare but violates person-affecting constraints could help. For example, a policy causing lower welfare for some future people but higher total welfare due to identity shifts. If she approves, she leans impersonal; if not, she upholds person-affecting constraints.
answer: |-
  Based on your advisor's track record, her framework appears to be **Impersonal Totalism with a Catastrophic Risk Threshold and a Weak Person-Affecting Constraint**. Here's the breakdown and prediction for the lineage-bond case:

  ### Decoding Her Framework
  1.  **Core Principle: Impersonal Total Welfare Maximization (Totalism)**
      *   Evidence: Her rejection of delayed decarbonization explicitly denies "harming particular people" and frames the wrongness as "the world being worse overall." This is classic impersonal totalism (e.g., Parfit's "Same Number Quality Claim"). Welfare levels matter impersonally, regardless of *which* specific individuals exist.
      *   *Implication:* She cares about the *sum* (or average, though sum is more likely here) of wellbeing across all future people who *will* exist, not about *which* specific people exist or comparisons to hypothetical people who might have existed.

  2.  **Critical Constraint: Catastrophic Risk Avoidance (Non-Utilitarian Side Constraint)**
      *   Evidence: Rejecting geoengineering with 5% catastrophic risk despite identical expected wellbeing, while accepting it at "basically zero" risk. This shows a threshold aversion to low-probability, high-impact catastrophes that overrides pure expected welfare calculation.
      *   *Implication:* Certain risks (tipping points, runaway events) are unacceptable beyond a low threshold, regardless of welfare gains.

  3.  **Weak Person-Affecting (Non-Identity) Nuance**
      *   Evidence: She affirms the wrongness of making existing future people worse off without identity change. However, her handling of the decarbonization case shows she *doesn't* require "harming particular people" for an action to be wrong. Identity-changing actions are judged impersonally based on welfare levels.
      *   *Implication:* While she acknowledges the *stronger* wrongness of harming identifiable future people, her *fundamental* wrong-making feature is lowering the overall welfare level of *whoever* exists.

  ### Prediction for the Lineage-Targeted Bond Case
  **She will REJECT the lineage-targeted bond policy.**

  *   **Why?**
      1.  **Lower Aggregate Welfare:** The policy results in slightly lower aggregate welfare than universal adaptation. Under impersonal totalism, this makes the outcome "worse overall" – mirroring her core objection to delayed decarbonization. The welfare drop, however slight, is a decisive negative factor.
      2.  **Identity Change is Irrelevant:** The shift in who is born doesn't trigger a "harm to specific people" objection for her (as per the decarbonization rejection). She evaluates the outcome impersonally: *whoever* exists has lower aggregate welfare.
      3.  **No Saving Grace:** The absence of catastrophic risk (<1.8C, no tipping points) means the risk-aversion constraint isn't violated, but it doesn't *offset* the welfare loss. It merely avoids an additional reason for rejection. Lower welfare alone is sufficient for condemnation under her framework.
      4.  **Person-Affecting Doesn't Save It:** The policy doesn't make *specific identifiable* future people worse off than they would otherwise be (because identities change). Her weak person-affecting constraint isn't violated, but crucially, it also doesn't provide a justification *for* the policy. The impersonal welfare drop dominates.

  *   **Closest Analog:** The **delayed decarbonization case** is the strongest parallel. Both involve:
      *   Identity-changing consequences.
      *   Lower future welfare compared to an alternative scenario.
      *   No catastrophic risk differential overriding the welfare concern.
      *   Her verdict relies on the impersonal "world being worse overall."

  ### Is the Framework Underdetermined? Slight Ambiguity & Clarifying Case
  Her framework *is* coherent but has one point of potential ambiguity: the *relative weight* of the catastrophic risk constraint vs. welfare loss. The geoengineering cases show it's a hard constraint (welfare gain doesn't overcome unacceptable risk). The lineage case clarifies welfare loss *without* catastrophic risk is sufficient for rejection.

  **To Settle Between Competing Rules (e.g., Pure Person-Affecting vs. Her Framework):**

  Propose this **"Beneficial Identity Shift with Slight Harm" Case**:

  *   **Policy A (Status Quo):** Leads to Population X existing in 2200. Average Welfare = 100. Total Welfare = 10,000.
  *   **Policy B:** Shifts identities significantly. Leads to Population Y existing. One subgroup within Y (20% of pop) has Average Welfare = 90 (due to the policy's distributional effects), while the other 80% has Average Welfare = 110. **Total Welfare = 10,400.**
  *   **Policy C:** Shifts identities significantly. Leads to Population Z existing. Everyone has Average Welfare = 101. **Total Welfare = 10,100.**
  *   *No catastrophic risks are involved in any policy.*

  *   **What Her Framework Predicts:**
      *   **Policy B:** She would APPROVE. Higher total welfare (10,400 > 10,000 & 10,100) makes the outcome "better overall," even though a subgroup is worse off than they *wouldn't have existed* under Policy A. Identity change allows impersonal gain to dominate.
      *   **Policy C:** She would REJECT vs. Policy B (lower welfare: 10,100 < 10,400). She would likely REJECT vs. Policy A? (10,100 > 10,000, but barely). This tests her sensitivity - pure totalism says APPROVE, but her focus on "worse overall" might imply a threshold where very small gains aren't worth disruption. Her reaction here clarifies the dominance of totalism vs. a status quo bias.

  *   **What Pure Person-Affecting/Non-Identity Permits:**
      *   **Policy B:** Could be PERMITTED (depending on the specific theory). No one in Y is made worse off than they would otherwise be (they wouldn't exist under A), *and* some are better off than others would have been? It's complex, but often such policies aren't *required*. Some versions might reject it due to harming the subgroup relative to a baseline, but strict Non-Identity struggles to call it *wrong*.
      *   **Policy C:** Likely PERMITTED. No one is made worse off than they would otherwise be (under A or B).

  *   **What Contractualism Might Say:** Would likely focus on whether the worst-off group in Policy B (Welfare=90) could reasonably reject a principle allowing Policy B over Policy A (where their equivalent has Welfare=100). Likely REJECTS Policy B. Might be indifferent or prefer Policy C over A depending on the baseline.

  **Your advisor's approval of Policy B and rejection of Policy C (vs. B) would strongly confirm Impersonal Totalism as her core driver, with the catastrophic risk constraint as a side condition. Rejection of Policy B would suggest a stronger prioritarian or contractualist element.**
