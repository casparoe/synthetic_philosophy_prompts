prompt: |-
  i sit on the grants comittee of a mid-size private foundation that funds basic science, and every cycle we have to decide which multi-year research programmes to renew and which to cut. one of our trustees has read some Lakatos and now she won't stop saying we should keep funding "progressive" programmes and starve "degenerating" ones, but she never tells me how to actually run that test with a stack of grant reports in front of me. i get the general idea — a programme has a hard core you don't test directly, a protective belt of auxiliary assumptions you adjust, and it's doing well when the adjustments generate new predictions that survive, badly when they just get retrofitted to explain the last failure — but i don't know how to turn that into a thing a programme officer can actually run.

  so write me the decision procedure. role and constraints: i have maybe half a day per programme, i'm not a working scientist in most of the fields we fund, the decisions are contested when we make them, and whatever we decide has to be defensible in writing to a disappointed lab and to our own board. the procedure should say what counts as a "programme" for our purposes, what questions to ask in order, what would count as a good enough answer to each, where the procedure stops with a no, and where it hands the decision back to a person because the question is one of judgment rather than fact. i also want you to flag the places where a smart applicant could game the steps, especially around claiming after the fact that some result was a novel prediction of theirs all along, and around dumping every failure into the protective belt while keeping the core safe. then run the procedure on two or three invented but realistic grant files, including at least one where it tells me to do something i'm not going to like, such as renewing a programme that looks stalled or killing one that looks exciting. tell me too what the procedure cannot do, the cases where a Lakatosian lens is just the wrong tool, and where my own additions to the theory begin. there's a lot of talk about what lakatos "really meant," so i want you to separate the parts of the procedure that are settled and defensible from the parts that are genuinely contested among philosophers of science, and not present one controversial reading as the consensus.

  please write it as plain continuous prose, no headings, bullet points, bold, or tables, just an email-length memo i could forward to the rest of the committee.
reasoning: |-
  Okay, the user is on a grants committee for a private foundation funding basic science. They're struggling with a trustee who's advocating for Lakatos' philosophy—funding "progressive" programs and cutting "degenerating" ones—but hasn't provided a practical way to implement this. The user needs a clear, actionable decision procedure that can be applied in half a day per program, considering they're not experts in all fields and decisions must be defensible to labs and the board.

  First, I'll outline the core of Lakatos' methodology of scientific research programmes (MSRP): the hard core (untested assumptions), protective belt (adjustable theories), and the distinction between progressive (novel predictions) vs. degenerating (ad-hoc adjustments) shifts. The challenge is translating this into a step-by-step process for grant evaluation.

  The user specified several constraints: time-limited (half-day/program), non-expert evaluator, contested decisions, need for written defensibility. They also want safeguards against gaming—like retroactive claims of novel predictions or overuse of the protective belt to shield the core. Plus, examples of edge cases and acknowledgment of Lakatos' limitations.

  Starting with defining a "programme": It should be a cohesive research agenda with a clear hard core and belt, not just a collection of projects. This avoids misapplication to smaller-scoped work. For the procedure, I'll structure it as sequential questions to minimize backtracking and save time.

  Key questions will include: 1) Identifying the hard core and belt from proposals/reports. 2) Tracking adjustments to the belt—were they proactive or reactive? 3) Assessing novel predictions vs. post-hoc explanations. 4) Evaluating empirical support. Stopping points should be clear: e.g., no identifiable core → reject; purely reactive adjustments → degenerate. Judgment calls arise when evidence is mixed or predictions are borderline novel.

  To counter gaming: Require pre-registered predictions in proposals, compare past reports for consistency, and watch for "everything is belt" excuses. For examples, I'll invent contrasting cases: one degenerating (e.g., neutrino mass program retrofitting failures) and one progressive (e.g., dark matter model predicting new phenomena). Include a tricky case where a stalled program is actually progressive internally, forcing renewal despite superficial lack of results.

  Limitations matter: Lakatos struggles with early-stage programs (no track record), interdisciplinary work (fuzzy cores), or applied science (goals beyond prediction). The user must supplement with traditional metrics like feasibility or impact. I'll note where Lakatos is contested—e.g., whether novel predictions must be *risky* or just new—to avoid presenting one interpretation as dogma.

  Finally, the procedure should end with a disclaimer: It's a tool, not a replacement for human judgment, especially in ambiguous cases. This balances philosophical rigor with practical constraints.
answer: |-
  Here's a decision procedure based on Lakatos' core principles, designed for your operational constraints. It prioritizes defensibility, acknowledges contestable interpretations, and flags gaming risks. Treat this as a structured interview with the grant report and renewal proposal:

  **Defining the "Programme":** For our purposes, a "Lakatosian programme" must have an identifiable "hard core" – a set of fundamental, non-negotiable assumptions central to its identity (e.g., "Neutrinos are massless," "Consciousness arises from specific quantum computations"). It must also demonstrate a "protective belt" – auxiliary hypotheses, models, or experimental techniques explicitly adjusted to shield the core in the face of anomalies (e.g., detector calibration methods, specific model parameters, data filtering algorithms). If the proposal/report describes disparate projects without this unifying theoretical structure and explicit strategy for handling counter-evidence, Lakatos' framework is likely the *wrong tool*; default to broader impact/feasibility criteria.

  **The Procedure:**

  1.  **Identify the Hard Core & Protective Belt:** Start by extracting, *from the programme's own documents* (original proposal, past reports, renewal application), their stated hard core and examples of protective belt elements. *If no clear, stable hard core is articulated by the researchers themselves, or if the "core" shifts dramatically between reports without compelling justification, stop: the Lakatosian lens doesn't fit well. Flag this and rely more heavily on other criteria (novelty, productivity, impact).* Judgment is needed here: is the core genuinely foundational, or just a vague aspiration? **Gaming Risk:** Applicants might inflate the core's scope to claim everything as foundational, or shrink it after failures to claim it was "never really tested." Counter by demanding *consistent articulation* across the funding cycle.

  2.  **Track Belt Adjustments & Triggering Anomalies:** Review the reported progress and setbacks. For each significant challenge or unexpected result described:
      *   What specific anomaly triggered the need for adjustment?
      *   What specific change was made *to the protective belt* (not the core) in response? (e.g., modified a secondary model parameter, refined an experimental protocol, added a data correction factor).
      *   Was this adjustment *pre-planned* as a potential refinement within the programme's strategy, or was it a *reactive fix* devised solely to explain *that specific anomaly*? Judgment call: Does the adjustment feel like a natural evolution of the belt or a desperate patch? **Gaming Risk:** The "Protective Belt Dump" – attributing *every* failure to belt elements, never letting the core face potential falsification. Counter by demanding *specificity*: *which* belt element failed? *How* was it adjusted? Was this adjustment type *foreseeable* within the programme's initial logic?

  3.  **Assess Novelty of Predictions:** Crucially, examine what happened *after* belt adjustments.
      *   Did the adjustment(s) lead to genuinely *novel predictions*? These are *testable consequences* that were:
          *   **Unanticipated:** Not obvious extensions of existing knowledge before the adjustment.
          *   **Specified before testing:** Ideally predicted in writing *before* the new experiment/observation was conducted. (Require evidence! Check dates in reports/proposals).
          *   **Risk-Bearing:** The phenomenon predicted was not already guaranteed or easily explainable by rival approaches.
      *   Or, did the adjustments primarily serve to *post-hoc accommodate* known anomalies or previously known facts? Judgment call: Is the claimed "prediction" genuinely novel and risky, or a safe bet dressed up after the fact? **Gaming Risk:** "Retroactive Novelty" – claiming an observation was a "prediction" only *after* it was made. **This is the biggest risk.** Counter by demanding *timestamped evidence* of the prediction *before* the confirming result. If absent, treat it as accommodation, not progressive prediction.

  4.  **Evaluate Empirical Outcome of Novel Predictions:** For any claim of a *novel prediction* that passed step 3:
      *   Was the prediction *empirically tested*?
      *   Did it *survive* the test? (i.e., was the predicted result observed within acceptable error?)
      *   If it failed, how did the programme respond? (Loop back to Step 2 - new belt adjustment?).
      *   Even if a prediction failed, *was the test itself a significant advance* (e.g., new technique, crucial data)? Judgment call: Does a failed *risky* prediction still represent valuable progress for the field?

  **Decision Thresholds:**

  *   **Stop, Likely Degenerating:** If the *primary* activity over the funding period has been making belt adjustments solely to *post-hoc accommodate* repeated failures or known anomalies *without* generating successful (or even testable and risky-but-failed) *novel predictions*. Core remains intact *only* through constant defensive patching.
  *   **Stop, Lakatos Inapplicable:** If no clear/stable hard core & belt exist, or if progress is best measured by non-predictive means (e.g., pure tool development, large-scale data collection without strong theoretical drive).
  *   **Proceed to Renewal Consideration, Likely Progressive:** If belt adjustments have demonstrably led to *tested, novel predictions* that *survived*, or generated *risky predictions* whose testing (even if failing) pushed the field forward significantly. Core remains stable not just by defense, but by enabling new discoveries.
  *   **Judgment Call Needed:** If the evidence is mixed – some post-hoc accommodation, *some* tentative novel predictions (perhaps not fully tested yet), or if novel predictions failed but the effort was clearly progressive. Also needed if timestamps for predictions are ambiguous, or if the novelty/risk of a prediction is debatable. Here, combine Lakatos assessment with traditional metrics (publications, talent training, technical feasibility, broader impact).

  **Examples:**

  1.  **"Neutrino Mass Direct Detection" (Degenerating, Renew Unlikely):** Core: "Massive neutrinos interact via [Specific Novel Mechanism X]." Belt: Detector calibration models, background noise filters. *Reports:* Initial detection failed. Adjustment 1: Calibration refined (accommodates failure). Prediction: "Will see signal in [Range Y]." Failed. Adjustment 2: Noise filter modified *specifically* to exclude the region where signal was expected but absent (pure post-hoc accommodation). New "prediction": Signal might appear in [Range Z] (vague, untested yet). *Assessment:* Primarily reactive belt patching after failed predictions. No successful novel predictions. Core shielded only by ad-hoc moves. **Decision:** Cut. Defensible: Programme stalled, resorting to defensive adjustments without successful novel discovery.
  2.  **"Quantum Gravity via [Esoteric Approach A]" (Progressive, Renew):** Core: "Gravity emerges from [Specific Quantum Information Process B]." Belt: Mathematical approximations for specific spacetime geometries. *Reports:* Initial model predicted unexpected particle scattering signature at high energies. *Prediction timestamped and specified before new experiment.* Major international collider run confirmed signature. Adjustment: Refined approximation for more complex geometry (proactive refinement). New Prediction: Specific black hole merger gravitational wave profile. Test planned with next-gen observatory. *Assessment:* Clear novel, timestamped, risky prediction confirmed. Adjustment led directly to another testable novel prediction. **Decision:** Renew. Defensible: Programme generating novel, testable, successful predictions, driving new experiments.
  3.  **"Dark Matter Condensate Galaxies" (Mixed/Judgment - Renew, but you might dislike):** Core: "A specific dark matter particle forms Bose-Einstein condensates shaping dwarf galaxies." Belt: Models for condensate stability, baryon feedback. *Reports:* Initial simulations predicted unique density profiles. Observations *partially* matched, showed anomalies. Adjustment 1: Refined feedback model (some accommodation, some proactive refinement). *Prediction (pre-registered):* Specific stellar velocity distribution in [Galaxy Type C]. *Result:* Distribution not found *as predicted*, but data revealed unexpected *new* stellar streams. Adjustment 2: Belt modified to include stream impact on measurements (significant accommodation). Programme argues streams are a *novel discovery* stemming from their *prediction-driven observation*. *Assessment:* Risky novel prediction *failed*, but triggered unanticipated, significant discovery. Belt adjustment was largely post-hoc *for the prediction*, but the *overall outcome* was field-advancing. Core remains plausible. **Decision:** (Judgment Call) Renew. Programme is generating surprises and driving observation, even if a specific prediction failed. Cutting it might kill exploration stemming from its unique approach. **Why you might hate it:** It "failed" its test, needs more time/money, and the discovery feels serendipitous. Defensible: Lakatos allows for programmes recovering from setbacks if they keep generating *interesting* outcomes (novel discoveries here, even if not the predicted one) – this is somewhat contested.

  **Limitations & Your Additions:**

  *   **Early Stages:** Lakatos struggles with brand-new programmes lacking a track record of predictions/adjustments. Your judgment on promise and initial belt-building is key.
  *   **Interdisciplinary/Exploratory:** Programmes without a single, tight core or focused on tool-building/data collection fall outside MSRP. Use standard criteria.
  *   **"Interesting Failures":** Lakatos undervalues programmes generating crucial *negative* results or exposing deep flaws in paradigms, even if degenerating by his strict definition. You must add criteria for this broader impact.
  *   **Feasibility & Resources:** MSRP ignores cost, technical hurdles, or personnel. Your committee *must* layer on feasibility assessments and value-for-money judgments.
  *   **"Progress" Definition:** Philosophers contest whether "novel prediction" is the *only* mark of progress (some emphasize unifying power, problem-solving effectiveness). Your procedure prioritizes prediction as the *operationalizable* Lakatosian signal but acknowledge this limitation.

  **Contested vs. Settled:**

  *   **Settled/Defensible Core:** The hard core/belt distinction; the centrality of *novel* prediction (vs. accommodation) for progress; degeneracy indicated by primarily post-hoc adjustments shielding the core without new discoveries.
  *   **Contested:** *How strictly* to define "novelty" and "risk"; the value of programmes producing important *failures* or anomalies for others; whether a programme can be "progressive" without immediate empirical success but with strong theoretical development; the permissibility of core modifications *in extremis*. Your procedure takes a pragmatic stance on novelty (pre-registration, unanticipatedness) but acknowledges the judgment involved.

  This procedure provides a structured, Lakatos-inspired lens to complement your existing criteria. It forces explicitness about theoretical commitments, responses to failure, and claims of predictive success. Use it to identify clear flags for degeneration or progress, but rely on layered judgment—yours and the committee's—especially in the messy middle ground where most science operates, and where your foundation's broader mission beyond strict MSRP comes into play.
