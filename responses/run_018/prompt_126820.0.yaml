answer: |-
  Here is my credence decomposition for the claim, expressed as **0.45** (moderately below neutral, leaning against). I arrive at this through the following sub-questions, with probabilities combined multiplicatively (reflecting dependence) and sensitivity analysis:

  ---

  ### **1. Does Burkeanism draw a principled distinction between institutional/cultural knowledge?**  
  *Probability: 0.75*  
  Burke explicitly prioritizes *political institutions* (e.g., constitution, courts) as repositories of "latent wisdom" refined through historical trial-and-error (*Reflections on the Revolution in France*). Cultural norms (e.g., manners, local customs) are treated as more adaptable "unwritten codes" (*Letters on a Regicide Peace*). The distinction arises because institutions coordinate complex social action, making their failure catastrophic, while cultural norms evolve organically with less systemic risk. However, Burke occasionally blends these domains (e.g., defending established religion), reducing certainty.  

  ### **2. Is Chesterton's fence primarily about epistemic humility toward tacit knowledge?**  
  *Probability: 0.85*  
  Chesterton's fence explicitly invokes *functional ignorance*: "We must be sure the fence had no purpose before removing it." This aligns with Burkean skepticism of rationalist redesign (Oakeshott's "rationalism in politics") and Hayek's "knowledge problem" – distributed practical knowledge cannot be fully articulated or centrally replicated. While risk aversion is a component, the core is epistemic: we lack access to the historical context that embedded wisdom in structures.  

  ### **3. Do democratic institutions contain more irrecoverable knowledge than cultural norms?**  
  *Probability: 0.70*  
  Procedural institutions (e.g., jury trials) embody *emergent coordination mechanisms* honed over centuries (e.g., rules of evidence resolving information asymmetries). Cultural norms (e.g., marriage rituals) often have explicit theological/moral justifications open to reasoned debate (e.g., Aquinas on natural law). However, some norms (e.g., customary land rights) encode equally complex ecological/social knowledge, weakening the distinction.  

  ---

  ### **Combination & Sensitivity**  
  - **Overall credence:** \(0.75 \times 0.85 \times 0.70 = 0.44625 ≈ 0.45\)  
  - **Highest sensitivity:** **Question #3** (irrecoverable knowledge comparison). A 10% decrease here (to 0.63) lowers overall credence to 0.40; a 10% increase (to 0.77) raises it to 0.49. This component carries the most empirical uncertainty.  

  ---

  ### **Key Revisions Triggers**  
  - **Upward revision (to ~0.65):**  
    - *Historical example*: A case where rapid cultural norm change (e.g., Sweden’s 1965 shift from religious to civil marriage) caused minimal disruption, while procedural reforms (e.g., post-Soviet states abolishing juries) led to chaos due to lost institutional knowledge.  
    - *Conceptual argument*: Demonstrating that cultural norms are more often codified in canonical texts (e.g., Scripture), while institutional knowledge exists only in collective practice (e.g., judicial discretion norms).  

  - **Downward revision (to ~0.25):**  
    - *Historical example*: Indigenous societies where altering ritualistic norms (e.g., Māori *tapu* system) collapsed social cohesion, while adopting new governance structures (e.g., tribal councils) succeeded by leveraging extant cultural logic.  
    - *Conceptual argument*: Showing Burke treats cultural norms as equally "organic" (e.g., *A Philosophical Enquiry* linking aesthetics to social stability), making them equally resistant to rationalist redesign.  

  This credence reflects Burkeanism’s institutional focus but acknowledges that *some* cultural norms may be equally epistemically opaque. The strongest support lies in institutions’ role in managing complexity beyond individual cognition.
