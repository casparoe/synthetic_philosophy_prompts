prompt: |-
  I am working on an independent study project about conservative political philosophy and institutional change, and I am trying to learn how to evaluate a philosophical claim by breaking it into its constituent parts rather than accepting a vague "it depends." I would like you to state your actual credence, expressed as a specific number between 0 and 1, for the following claim: within a Burkean conservative framework, Chesterton's fence generates a stronger presumption against reforming procedural democratic institutions—such as jury trials, bicameral legislative structures, or federal divisions of power—than against altering inherited cultural norms like traditional marriage customs or religious observances, specifically because the former accumulate distributed practical knowledge that rational design cannot fully reconstruct, while the latter remain more directly accessible to moral reasoning.

  Please do not reply with a bare number or with "it depends on interpretation." Instead, decompose your credence into at least three sub-questions: first, whether Burkean conservatism genuinely draws a principled distinction between institutional and cultural knowledge in this manner; second, whether Chesterton's fence depends specifically on epistemic humility about distributed or tacit knowledge, as opposed to a more general risk aversion; and third, whether procedural democratic institutions in fact contain more irrecoverable practical knowledge than long-standing cultural norms. For each sub-question, assign a rough probability, indicate briefly how they combine into your overall figure, and identify which single component your final answer is most sensitive to. Finally, describe what kind of conceptual argument or concrete historical example would most likely cause you to revise your overall credence significantly upward or downward.
