prompt: |-
  hey, quick sanity check — i'm a phd student in phil of science (mostly climate modeling, so this is way outside my usual stuff) and my roommate summarized structural realism for me like this: "The core claim is that science accumulates only structural knowledge — we map the relational architecture but never the intrinsic nature of things. Worrall's classic argument showed that in theory change the mathematical formalism survives intact, not just approximately, which means objects like electrons are just theoretical placeholders with no independent existence. Poincaré had this insight around 1900 but people ignored it because they wanted materialist ontologies. Ontic structural realists push this further in quantum mechanics: entanglement relations are ontologically prior to the particles involved, so there literally aren't particles, only correlation structures. Epistimic structural realism is just the weaker view that we stay agnostic about intrinsic properties, but both versions reject scientific realism's commitment to objects."

  something about this feels too neat. i think there's slippage between "we can't know ontology" and "there is no ontology," and i don't buy that Worrall said the formalism survives literally intact — wasn't it about structural continuity rather than identity? also is it fair to say Poincaré was ignored, or just that his version wasn't picked up? and the quantum part sounds like a controversial extension being sold as a direct consequence. can you audit this piece by piece? tell me what's accurate, what's a simplification a defender would wince at, and what's flat wrong. especially: does the quantum entanglement claim actually follow from Worrall's original argument, or is it a separate move made later by people applying OSR to quantum mechanics? and is there an important distinction — maybe around ramseyfication or modal structural realism — that this summary leaves out entirely?
reasoning: |-
  Okay, the user is a PhD student in philosophy of science, focusing on climate modeling. They're asking about their roommate's summary of structural realism. The roommate's explanation seems condensed, and the user senses some inaccuracies. Let me break down their concerns.

  First, they mention slippage between "we can't know ontology" and "there is no ontology." That's a key philosophical point. Epistemic structural realists (ESR) say we can't know intrinsic properties, while ontic structural realists (OSR) claim there are no such properties. The user is right to flag that conflation. 

  Next, Worrall's argument. The roommate claimed mathematical formalism survives "intact." But the user recalls it's about structural continuity, not identical survival. I need to check Worrall's original paper. Yes, Worrall emphasized retention of mathematical structure through theory changes, like Fresnel's equations in Maxwell's theory. It's approximation, not identity. The roommate oversimplified here.

  Poincaré being ignored? The user questions that. Poincaré's conventionalism influenced logical positivists, but structural realism wasn't mainstream then. "Ignored" might be too strong; more like his structuralist ideas weren't developed until later.

  Quantum entanglement and OSR. The roommate presents it as a direct consequence of Worrall's argument. But Worrall focused on theory change in physics history, not QM specifically. OSR in quantum mechanics came later, from Ladyman and others. The user is correct that it's a separate extension, not a direct derivation from Worrall.

  Missing distinctions? The roommate didn't mention Ramsey sentences or modal structuralism. Ramseyfication replaces theoretical terms with variables, showing how structure is preserved. Modal structuralism provides a framework without assuming entities. These are important nuances omitted.

  The user's deeper needs: They want clarity on structural realism's core arguments versus later developments. They might be preparing for a discussion or paper, needing precise distinctions. Also, as a climate modeler, they might be considering how structural realism applies to their field—like model structures persisting despite theoretical changes.

