  Hmm, the user is a backend developer with no philosophy background preparing a lunch talk for coworkers on distinguishing moral opinions from preferences or biases. They specifically mentioned the "ascription universality" concept where moral claims pretend to apply to everyone. They want a teaching plan with five numbered items covering conceptual dependency order, a workplace example (not trolley problem), common misconceptions, and a final check question. They want this concise - one or two sentences per item with no intro or conclusion.

  I need to build this in the right dependency order. The core question revolves around how to tell if something like refusing to use an AI hiring tool is an ethical stance or just risk aversion. The key concept here is ascription universality - the idea that moral claims present themselves as universally applicable, while preferences don't. That should be the foundation.

  For the carrying example, I need something workplace-related where both sides seem reasonable. Perhaps a disagreement about requiring in-office work - one person frames it as unethical (discriminatory to caregivers) while the other frames it as a personal preference (better collaboration). This shows how the same issue can be presented as either moral or preferential.

  They mentioned two likely misconceptions: "bias means you're wrong" and "preference is just taste." These need to be defused at specific points. The bias misconception should be addressed when introducing the concept that bias isn't necessarily wrong - it's about improper influence. The preference misconception should come when explaining that preferences can be deeply held, not just superficial tastes.

  The final check question should test whether they can apply the distinction - like asking whether opposing AI hiring tools is a moral stance or preference. And I should note what to skip - like moral relativism debates or complex universality theories.

  I'll structure this as exactly five numbered items: (1) core distinction with universality, (2) workplace example showing both framings, (3) defusing the "bias=wrong" misconception, (4) defusing the "preference=taste" misconception, and (5) the final check question plus what to skip. Keeping each to one or two sentences maximum as requested.
answer: |-
  1.  Start with the core distinction: Moral claims assert universal "shoulds" (ascription universality), while preferences state personal "wants" without demanding agreement from others.
  2.  Present the carrying example: Frame refusing mandatory in-office work as *either* an ethical stance ("unfair to caregivers") *or* a personal preference ("I focus better remotely"), showing both sound reasonable initially.
  3.  Defuse "bias = wrong" here: When introducing bias, clarify it's an *improper influence* on a claim (e.g., rejecting AI hiring *only* due to tech-phobia), not that the claim itself is necessarily false.
  4.  Defuse "preference = just taste" next: Contrast surface taste ("I prefer blue UIs") with deep preferences ("I *need* remote work for well-being") that feel moral but lack universal demand.
  5.  Final check: Ask, "If someone opposes the AI tool citing *universal* fairness concerns, is that stance claiming moral weight or expressing preference?" Skip deep moral realism/relativism debates.
