answer: |-
  Here’s a villanelle weaving Dewey’s core concepts into its structure and imagery, focusing on the *process* of democratic inquiry and emergent publics:

  **The Inquiry**

  The situation stays indeterminate.
  We fumble patterns in the fractured light.
  Strangers bound by shared effect begin.

  No fixed star guides the course we must commit,
  Just habits unlearned in the common night.
  The situation stays indeterminate.

  Old tools we trusted splinter, bit by bit,
  Reshaped by consequence, not abstract right.
  Strangers bound by shared effect begin.

  What seemed like solid ground proves counterfeit;
  Doubt floods the channels where belief was tight.
  The situation stays indeterminate.

  Each lonely thought submits to common light
  (Line 13: The Turn)
  **Each lonely thought submits to common light**—
  Ideas tested where our actions knit.
  Strangers bound by shared effect begin.

  Casting loose from certain shores we knew,
  We chart the currents where our fortunes twist.
  The situation stays indeterminate yet
  Strangers, bound by shared effect, persist.

  ---

  **How it maps to your request:**

  1.  **Refrains as Philosophical Engines:**
      *   A1: "The situation stays indeterminate" – Echoes Dewey's starting point: the problematic, unresolved situation demanding inquiry.
      *   A2: "Strangers bound by shared effect begin" – Captures the *formation* of a public through recognition of entangled consequences. The verb "begin" is crucial – it's nascent, emergent.
      *   **Final Couplet:** Merges them: "The situation stays indeterminate yet / Strangers, bound by shared effect, persist." This enacts the core idea: indeterminacy remains (*never truly "finished"*), but the *process* of cooperative inquiry ("strangers bound") continues ("persist"). The form forces this cyclical, unresolved resolution.

  2.  **Line 13 Turn (Submission to Public Testing):**
      *   "Each lonely thought submits to common light" – Directly addresses the shift from private belief/habit to public scrutiny ("common light") through shared action and consequences ("where our actions knit"). "Submits" implies the necessary yielding Dewey describes.

  3.  **Deweyan Concepts Woven In:**
      *   **Indeterminate Situation:** The opening line and refrain.
      *   **Cooperative Intelligence:** "We fumble patterns," "habits unlearned," "consequence," "common light," "ideas tested," "our actions knit," "chart the currents."
      *   **Rejection of Fixed Ends:** "No fixed star," "Casting loose from certain shores," the ongoing "persist" instead of arrival.
      *   **Democracy as Mode of Inquiry:** The *entire process* depicted – the fumbling, testing, reshaping, charting – *is* the democratic inquiry, distinct from government or voting.
      *   **Emergent Public:** "Strangers bound by shared effect begin" – the key refrain defining the public *by consequence*, not pre-existing identity.
      *   **Belief as Habit Tested:** "habits unlearned," "belief was tight," "Each lonely thought submits," "ideas tested where our actions knit."

  4.  **Form & Tone:**
      *   Standard Villanelle structure (5 tercets, 1 quatrain; A1bA2, abA1, abA2, abA1, abA2, abA1A2).
      *   Rhyme: Uses slant/near rhymes (begin/light/knit, commit/bit, counterfeit/tight, knew/twist) for a less sing-song, more contemplative feel, fitting the subject. Core rhymes (indeterminate/light/begin) hold the pattern.
      *   Avoids Sermonizing: Focuses on the *experience* and *process* of shared inquiry and consequence-recognition ("fractured light," "doubt floods," "currents where our fortunes twist") rather than preaching duty.
      *   "Same Rough Boat" Nod: "chart the currents where our fortunes twist" implies the shared vessel of consequence without stating it directly.

  This villanelle uses its inherent circularity and repetition to embody Dewey's core insight: democratic inquiry is a continuous, self-revising process sparked by shared problems and forged by the testing of intelligence in the crucible of shared consequences, constantly forming and reforming the public itself.
