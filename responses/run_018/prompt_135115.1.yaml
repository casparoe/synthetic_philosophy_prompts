    - **B2**: Geometric objects as descriptions of actual physical motion.  
        - **B2_1**: Principled impossibility → Leaf: **Mechanical Constructivist** (Occupied, awkward: must dismiss Hobbes’s circle-squaring claims as non-geometric errors)  
            - *Uncomfortable commitment*: "Hobbes’s core method forbids circle-squaring as impossible, forcing us to treat his own 'solutions' as extraneous blunders."  
        - **B2_2**: Contingent limitation → Leaf: *Unnamed*  
        - **B2_3**: Resolved by Hobbes → Leaf: **Standard View (Failed Rival)**  
            - *Uncomfortable commitment*: "Hobbes’s materialist foundations blinded him to the mathematical truth that his circle-squaring 'proofs' were incoherent."  
    - **B3**: Geometric objects as linguistic-logical definitions.  
        - **B3_1**: Principled impossibility → Leaf: **Proto-Formalist**  
            - *Uncomfortable commitment*: "Hobbes’s materialism is merely rhetorical, subordinated to a formalist vision where geometry is a game of stipulated definitions."  
        - **B3_2**: Contingent limitation → Leaf: *Unnamed*  
        - **B3_3**: Resolved by Hobbes → Leaf: *Unnamed*  

