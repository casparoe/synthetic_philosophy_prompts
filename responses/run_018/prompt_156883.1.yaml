answer: |-
  Okay, this is *exactly* the kind of messy, circular, fascinating debate that makes archaeology real. Let's break it down sharp and plain for your dialogue.

  **The Mirror Constraint & The Circularity Knot:**

  1.  **Your character's point is spot-on:** The core problem is viciously circular. To interpret an *absence* (like no grave goods) as *meaningful* (a belief forbidding them), you need to suspect an institution (e.g., religious taboo, egalitarian ethos) caused it. But the *only evidence* for that institution might *be* the absence itself. Where do you start?
  2.  **How Archaeologists *Try* to Break the Circle (They Don't Always Succeed):**
      *   **Bootstrapping with Taphonomy:** They start by ruthlessly *eliminating* non-institutional causes. *Could* the goods have rotted? (Analyze soil chemistry, preservation of other organics). *Could* they have been looted? (Look for disturbance patterns, tool marks). *Could* the society just have been too poor? (Look at settlement remains, tools, non-burial luxury items). **Only if they can *reasonably* rule out these "logistical/climate" explanations does the absence become *potentially* meaningful.** This is the first bootstrap.
      *   **Comparative Bootstrapping:** Look sideways. Do *contemporary* sites *in similar environments* with *similar preservation conditions* have grave goods? If Site A has pristine preserved wood and textiles *but no grave goods*, while Site B (same soil, same period) has preserved wood/textiles *and grave goods*, the absence at Site A gets more suspicious. The "mirror" starts to reflect something *different*.
      *   **Internal Consistency Bootstrapping:** Look within the site/region. Is the absence *systematic*? Does *every* burial lack goods, regardless of age, sex, or status? Or is it only certain groups? If it's consistent across all burials in a context where preservation is good *and* comparative sites show goods, the case for an institutional "omission rule" strengthens. An *inconsistent* absence is harder to read as intentional doctrine.
      *   **Anomalies as Clues:** Sometimes, a *single* violation proves the rule. If 99 burials have no goods, but the 100th (perhaps a suspected heretic, a foreigner, or a ruler breaking tradition) *does* have goods hidden away, that anomaly screams "taboo!" The presence *confirms* the intentionality of the absence elsewhere. The institution reveals itself by its *breach*.
      *   **Patterns of *Other* Negative Evidence:** The "mirror constraint" isn't just about grave goods. Are certain types of tools *never* found in sacred spaces? Are depictions of certain animals *systematically absent* from ritual art? Are specific body parts *always* missing from burials (beyond taphonomic explanation)? Building a *pattern* of consistent, rule-bound absences across different domains makes the institutional argument stronger. It's not just *one* absence, it's a *system* of omissions.

  **Positive Traces (Symbols) vs. Negative Traces (Omissions):**

  *   **Positive Traces (Pottery Symbols):** These are *direct* expressions. Someone *made* that symbol. The inference is about *what it meant*. It's still interpretive ("Is that a sun god or just a decoration?"), but you're dealing with a *presence* intentionally created. The material trace *is* the symbolic act. Less circularity.
  *   **Negative Traces (Omissions):** This is **inference squared**. First, you infer the absence is *not* accidental (taphonomy/logistics). Second, you infer that this non-accidental absence *means* something specific (belief, taboo, social rule). **It's inherently more speculative and vulnerable to the circularity trap.** It requires stronger evidence (like ruling out alternatives via bootstrapping) and is rarely the *sole* basis for reconstructing belief. It works best as supporting evidence within a larger pattern.

  **Dialogue Bait (Sharp & Plain):**

  *   **Protagonist (Cynical, pushing the Mirror Constraint):** "Look, finding a sun symbol on a pot? Sure, maybe they worshipped the sun. But finding *no* pots in the graves? How do you leap from *nothing* to 'they believed in austerity for the afterlife'? Maybe the clay was crap that year! Maybe grave robbers were really thorough! You're building a belief system out of thin air and calling it science."
  *   **Colleague (Defending Inference):** "It's not just *one* empty grave! It's *all* of them, for centuries, while their neighbors piled in the goods. The soil preserves leather and wood here perfectly – but not a single bead? Not one broken tool tossed in? That's not accident, that's a *pattern*. A deliberate silence. Their belief is shouting at us by what they *refused* to do."
  *   **Protagonist (On Circularity):** "Exactly! 'Deliberate silence' assumes a silent *intention*. But the only proof you have for the intention *is* the silence! It's a loop. You need the belief to explain the absence, but the absence is your only evidence for the belief. Where does that circle *start*?"
  *   **Colleague (On Bootstrapping):** "We start with everything *else*. We rule out rot, loot, poverty. We compare to sites where stuff *did* survive. We look for consistency – is this absence the *rule*? Does it fit with other 'don'ts' we see? It's not perfect, but it's not blind faith. It's building a case where the *lack* of evidence, *against all odds of preservation*, becomes evidence itself."

  **The "Science of Minds" Cynicism:**

  *   **Is it too cynical?** It's **a fiercely debated position, not a dead end.**
  *   **The Cynic's Core:** Minds are squishy, internal, and gone. We only have the hardened shells of what they *did*. Actions are shaped by environment, resources, and sheer practicality far more than by abstract beliefs. Reconstructing specific beliefs from objects, especially absences, is guesswork dressed as science. Archaeology is fundamentally about material constraints and behaviors, not inner worlds.
  *   **The Counter-Argument:** Behavior *is* belief in action. Ritual burial *is* an expression of belief. Systematic patterns of action (or omission) *are* the material manifestation of shared concepts, rules, and institutions – the "institutional facts" that shape society. While we can't access *individual* thoughts, we *can* reconstruct shared cultural frameworks and logics that guided action. Ignoring belief makes us miss *why* people built monuments instead of granaries, or why they left graves empty. Material constraints set the stage, but belief writes the script performed on it.
  *   **Middle Ground (Often Where it Lands):** Archaeology reconstructs *practices* and the *institutions* (social, religious, political) that governed them. Beliefs are inferred *as the likely motivations or frameworks behind those practices and institutions*, but always tentatively. It's not neuroscience, but it's not *just* logistics either. It's about understanding the cultural "logic in action" visible in the material record. The "mirror constraint" is a crucial, difficult tool in that box, highlighting how rules often reveal themselves by what they forbid.

  **The Takeaway for Your Scene:**

  Let the argument breathe. Your protagonist's cynicism is valid *and* common. The colleague's defence of inference is also standard practice. The *tension* is real archaeology. Have them clash on a *specific* absence in their dig:
  *   Protagonist: "No goods in these graves? So what? The soil's acidic, everything rotted. Belief my ass."
  *   Colleague: "Then why is the child's woven grass doll perfectly preserved *next to* the grave? They *could* put things in if they wanted. They *chose* not to for the bodies. That doll is the anomaly that proves the rule of absence was deliberate. What does that *choice* tell us?"
  *   Protagonist: "It tells us they put a doll outside a grave. The rest is you projecting."

  That's the messy, circular, frustrating, and fascinating core of interpreting the past. Good luck!
