  **INTERNAL MEMORANDUM**  
  **INSTITUTE FOR COMPARATIVE COGNITION**  
  **REF: ICC/HR/CLASS/RESTRUCT/OMEGA**  
  **DATE: 2023-10-27**  
  **TO: ALL STAFF**  
  **FROM: OFFICE OF THE DEPUTY DIRECTOR OF HUMAN RESOURCE OPTIMIZATION**  
  **SUBJECT: MANDATORY COGNITIVE TIER RECLASSIFICATION & ASSOCIATED OPERATIONAL REFINEMENTS**  

  Following the exhaustive taxonomic analysis conducted by the Office of the Chief Taxonomist of Mind Types (OCTMT), and in alignment with Strategic Directive 7.3 (Cognitive Efficiency Through Phylogenetic Alignment), all staff positions within the Institute for Comparative Cognition (ICC) will be formally reclassified into one of four (4) empirically validated Cognitive Tiers: Darwinian, Skinnerian, Popperian, or Gregorian. This reclassification, effective **November 15, 2023**, optimizes personnel deployment according to innate, biologically constrained information-processing modalities, thereby maximizing institutional adaptability and predictive modeling capacity.

  This restructuring is not subject to appeal based on individual preference, perceived skill misalignment, or philosophical objection. Reclassification determinations, derived from proprietary psychometric instrumentation (ICC-PMT v.4.2b) and keystroke pattern analysis (KPA-OS), are final. Grievances regarding procedural application (not classification outcome) may be submitted via Form ICC/MIND/GRIEVANCE/7F, reviewed quarterly by the Cognitive Compliance Panel.

  **Policy Implementation Clauses:**

  1.  **Classification Basis & Role Assignment:**  
      *   **Darwinian Tier:** Staff exhibiting high error-rate tolerance, stochastic problem-solving, and innate resistance to top-down instruction. Roles limited to repetitive, environment-facing tasks where failure modes provide valuable selective pressure (e.g., Field Data Collection Assistants, Prototype Beta Testers, Cafeteria Menu Trial Coordinators). **Critical Restriction:** Darwinian-tiered terminals are permanently excluded from automated software updates or patches. Adaptation must occur through user-driven trial-and-error within the existing system parameters (Ref: ICC/IT/POLICY/DARWIN-LOCK).
      *   **Skinnerian Tier:** Staff demonstrating high responsiveness to immediate feedback loops, quantifiable output metrics, and conditioned task execution. Primarily assigned to data entry, routine analysis, and operational support functions with clear reinforcement schedules (e.g., Metadata Coders, Grant Compliance Monitors, Environmental Enrichment Technicians). **Operational Modifier:** Base compensation will be augmented by a Variable Operant Bonus (VOB), calculated bi-weekly based on validated keystroke frequency (KPF) and task-completion chaining efficiency. Negative reinforcement protocols may be applied for sub-optimal KPF.
      *   **Popperian Tier:** Staff characterized by abstract model generation, falsification-seeking behavior, and hypothesis-driven inquiry. Assigned to theoretical modeling, experimental design, and predictive analytics (e.g., Junior Research Theorists, Simulation Architects, Null Hypothesis Generators). **Procedural Requirement:** All proposed mental models, experimental frameworks, or strategic conjectures must be submitted in triplicate (physical copy only) to the OCTMT for pre-validation. Approved models will be rigorously "tested to destruction" during designated Conference Room Falsification Sessions (CRFS), shielding higher tiers from direct exposure to unviable concepts.
      *   **Gregorian Tier:** Staff exhibiting meta-cognitive awareness, symbolic manipulation proficiency, and tool-of-tools innovation. Designated for strategic planning, cross-tier coordination, resource allocation, and managerial oversight (e.g., Departmental Coordinators, Senior Theory Synthesizers, Funding Narrative Architects). **Note:** Gregorian status reflects a capacity for memetic engineering and environmental niche construction essential for institutional leadership.

  2.  **Physical Workspace Zoning:** Office assignments and communal areas are being reconfigured to minimize cognitive interference. Interaction between tiers is permitted only via formally scheduled Interface Sessions (Form ICC/COORD/INTERFACE/REQ) or through OCTMT-approved communication proxies.

  3.  **The Mind-Type Neutral (MTN) Break Room (Annex 7B):**  
      A designated neutral interaction space is established. **IMPORTANT:** While entry is unrestricted, Gregorian-tier staff utilizing symbolic communication (spoken language exceeding 5 words/minute or written notes) within the MTN will incur a real-time Linguistic Resource Tax (LRT), automatically deducted from departmental discretionary budgets. Tax rates are progressive based on syllable density and abstraction level (see posted Schedule LRT-1). Darwinian, Skinnerian, and Popperian staff communication is tax-exempt but subject to environmental monitoring for selective pressure calibration.

  **Rationale & Endorsement:**  
  Chief Taxonomist Dr. Elara Voss (OCTMT) underscores the scientific imperative: "This reclassification transcends mere organizational chart aesthetics. It is a necessary operationalization of the deep structure of cognition itself. To deny the inherent, tiered nature of cognitive phenotypes – from the brute environmental engagement of the Darwinian, through the conditioned efficiency of the Skinnerian, the risky conjecture of the Popperian, to the memetic agility of the Gregorian – is to cling to a pre-scientific egalitarian fiction. This structure leverages natural cognitive disparity as our core institutional advantage. The Gregorian tier's 'management' role is not a value judgment, but an observable ecological outcome of their unique capacity to install cognitive tools *in others*. The tax in the MTN? A simple market correction for scarce symbolic bandwidth."

  Compliance is mandatory. Individual reclassification notifications, including tier designation, assigned role modifiers, and relevant policy appendices, will be delivered via encrypted PDF by **November 5, 2023**. Direct inquiries regarding personal classification must be submitted through your designated Tier Liaison (assignments pending notification).

  We anticipate this phylogenetically informed restructuring will propel the ICC into a new era of unparalleled cognitive efficiency and predictive robustness.

  **Dr. Reginald Finch**  
  Deputy Director, Human Resource Optimization  
  Institute for Comparative Cognition
