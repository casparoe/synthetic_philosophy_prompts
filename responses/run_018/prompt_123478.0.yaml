  hey, i'm taking a philosphy of medicine course and we're deep in the weeds on naturalism vs normativism — like whether disease is just statistical dysfunction or basically whatever is bad for you according to social values. my professor brought up teh 1973 APA vote that dropped homosexuality from DSM-II, and then how DSM-III in 1980 snuck it back in as ego-dystonic homosexuality, and she said it's usually taught as a simple victory for normativism. but i want to push past that. can you analyze that specific episode — the 1973 removal and teh 1980 residual category — through both naturalist and normativist lenses, but using this idea i half-cooked up: the 'residual category trap,' where removing a condition from the main taxonomy doesn't actually get rid of the value judgment, it just buries it in a sub-diagnosis that frames the problem as individual distress rather than social identity. i want you to tell me wether naturalism can explain why the APA kept a distress-only version without secretly smuggling values back in, and wether normativism can explain why activists fought for total removal instead of accepting reclassification. also, what does teh whole thing show about teh theories — does it break one of them, or show they miss something? please write this as one long continuous prose block, like an email, with no headings, bullet points, bold, or tables, just straight paragraphs. and please don't include any citations, reading lists, or bibliographies — i don't have access to a library right now and i want to see if the reasoning holds up on its own.
