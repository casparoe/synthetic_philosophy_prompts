answer: |-
  Okay, let's dive into this tangled episode with your lenses and your "residual category trap" concept. It's a perfect case study to pressure-test both naturalism and normativism, and your trap idea really sharpens the analysis.

  The standard narrative you mentioned – the 1973 removal as a simple normativist victory – definitely needs complicating. Let's start with the removal itself. From a strict naturalist perspective, voting homosexuality *out* of the DSM-II could be framed as a correction. Naturalism would argue that homosexuality, being a statistically common and stable variation in sexual attraction and behavior observed across cultures and history, doesn't represent a biological or psychological *dysfunction*. Its prior classification was seen as a value-laden error, confusing social disapproval (a norm) with genuine internal malfunction. Removing it aligned psychiatry, theoretically, with a more objective, scientific understanding of human variation – a win for purging values from the disease category. Normativists, however, would see the removal *itself* as a profound normative shift. It wasn't science suddenly discovering a "fact" it missed; it was a direct consequence of sustained activism challenging the harmful *values* embedded in the diagnosis. The vote reflected changing social norms about sexuality and the harm caused by pathologizing identity, forcing psychiatry to adjust its classifications accordingly. The victory was fundamentally about changing what society (and its medical arm) deemed "bad" or "sick," not just discovering a statistical truth.

  Now, enter your "residual category trap" with the 1980 DSM-III and "Ego-Dystonic Homosexuality" (EDH). This is where things get sticky and expose cracks in both theories. Naturalism might try to justify EDH as a value-free category. It focused purely on the *distress* experienced by the individual about their sexual orientation. The argument would be: *any* persistent, intense distress causing impairment (like anxiety about one's sexual feelings conflicting with one's self-image or desired life) could be considered a legitimate mental health concern, regardless of the *source* of that distress. The problem wasn't homosexuality *itself* (statistically normal variation), but the internal conflict *about* it. On the surface, this seems to sidestep social values – it's just about the individual's subjective suffering and functional impairment, core concepts in some naturalist accounts of disorder. However, your trap concept nails the flaw here. *Why* was this specific distress category created? It implicitly accepted that homosexuality *could* be a legitimate *source* of pathology-inducing distress in a way that heterosexuality was not. The "dysfunction" resided entirely in the individual's failure to reconcile their feelings with... what? Often, it was implicitly with prevailing social norms (religious, familial, cultural) that condemned homosexuality. The naturalist framing of "distress" smuggled those social values *back in* as the unexamined *cause* of the distress deemed pathological. The "trap" works by shifting the focus from the identity being intrinsically disordered to the individual's *reaction* to that identity within a hostile environment, effectively individualizing and medicalizing the social problem.

  Normativism handles this trap more readily. It sees EDH as a classic example of institutional resistance and the persistence of pathologizing values. Removing the main diagnosis was a concession, but creating EDH allowed psychiatry to maintain a foothold for treating homosexuality *as a problem* under a different, more palatable guise. It pathologized the *consequences* of social stigma, not the identity itself, but the practical effect was similar: it provided a diagnostic code to "treat" gay people who were unhappy *because* they were gay in a homophobic society. Activists fighting for *total* removal, rejecting EDH, makes perfect sense normativistically. They understood that EDH wasn't neutral. It still framed homosexuality as a potential *cause* of mental illness (via distress), reinforcing the idea that being gay was inherently problematic enough to cause significant internal conflict warranting treatment. Accepting reclassification would have legitimized the idea that the "problem" resided in the individual's distress about their orientation, not in the social oppression causing that distress. Total removal was necessary to dismantle the entire diagnostic pathway used to justify conversion therapy and pathologization.

  So, what does this episode reveal about the theories? It doesn't necessarily *break* either, but it exposes crucial limitations and areas where they blur. It severely challenges a *naive* naturalism that believes it can cleanly separate statistical/biological dysfunction from social values. The EDH category demonstrates how "distress" and "impairment" – core naturalist criteria – are profoundly shaped by the social environment. The "dysfunction" in EDH was inseparable from the normative context of homophobia; it wasn't a free-floating biological glitch. Pure naturalism struggles to explain why *this particular* distress category emerged historically without acknowledging the normative pressures involved. Conversely, normativism powerfully explains the political dynamics of both the removal and the creation of EDH, and the activists' rejection of the trap. However, normativism might struggle slightly to explain the *internal logic* the APA likely used to justify EDH – their genuine belief (however flawed) that they were creating a neutral category for distress *about* any sexual orientation, not just homosexuality (even if societal homophobia made it overwhelmingly apply to gay people). This hints at the messy reality where actors within the system *think* they are being naturalist/scientific even when normativist forces are dominant.

  Ultimately, the episode powerfully illustrates your "residual category trap": removing a diagnosis doesn't erase the underlying values; it can just relocate and disguise them within concepts like "distress," individualizing social problems and allowing pathologization to continue in a subtler form. It shows that both naturalism and normativism, as often framed, miss something crucial: the dynamic interplay between attempts at scientific classification, deeply embedded social values, and the *institutional power* of systems like psychiatry to define what counts as pathology, even when trying to reform. The "trap" exploits the *language* of naturalism (distress, impairment) while serving a normativist function (managing deviation from social expectations). This suggests that a complete understanding requires looking beyond a strict dichotomy to how power operates through diagnostic systems, using both "objective" criteria and shifting categories to maintain control over defining normality and deviance, even in the face of progressive change.
