  For normativism, why did activists fight for total removal instead of accepting reclassification? Normativism would say all disease categories reflect values, so activists rejecting even the distress-only label makes sense—they saw it as a Trojan horse for pathologizing identity. 

  The bigger question is what this case reveals about both theories. Does it break one? Naturalism seems vulnerable here because it can't account for why "distress" isn't itself socially constructed. Normativism handles the activist stance well but might struggle to explain why the APA felt it needed a distress-only category at all—was that an attempt at neutrality or just repackaged bias? 

  User's clearly done their homework. They're not satisfied with surface-level takes and want to test their own conceptual framework. The "residual category trap" is genuinely clever—it shows how systems can appear progressive while maintaining oppressive structures. I should honor that complexity without oversimplifying. 

