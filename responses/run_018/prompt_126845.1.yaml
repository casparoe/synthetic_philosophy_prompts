answer: |-
  ### Brainstorming Phase  
  The heterogeneity problem challenges hedonism's claim that "pleasure" is a unified, intrinsic good. Ice cream, intellectual triumph, and schadenfreude seem phenomenally diverse—no single "feel" unites them. Two major solutions emerge:  
  - **Mill’s Qualitative Hedonism**: Splits pleasures into "higher" (intellectual/moral) and "lower" (bodily), claiming qualitative superiority trumps quantity.  
  - **Intentionalism (Attitudinal View)**: Argues pleasure isn’t a feeling but an *attitude* of "taking X as good-for-me."  

  Both aim to unify heterogeneous experiences, but adversarial cases (e.g., schadenfreude) expose cracks. Let’s dissect each.  

  ---

  ### Comparative Analysis  
  #### **1. Mill’s Qualitative Hedonism**  
  - **Core Solution**: Heterogeneity is resolved by distinguishing *kinds* of pleasure. Higher pleasures (e.g., nailing a proof) are intrinsically superior due to their "elevated" nature.  
  - **Cracks Under Pressure**:  
    - **Schadenfreude Test**: Is malicious joy "higher" or "lower"? If higher, it risks valorizing cruelty (contra Mill’s moral aims). If lower, it dismisses the complex satisfaction of outgroup dominance or justice-perception fueling schadenfreude.  
    - **Relocation Problem**: Mill doesn’t solve heterogeneity; he *subdivides* it. What unifies *all* "higher pleasures"? Is there a common quality between moral joy and schadenfreude? No—so heterogeneity persists *within* categories.  
    - **Authority Question**: Who decides "higher"? Mill appeals to "competent judges," but this is circular (they prefer higher pleasures *because* they’re higher).  

  #### **2. Intentionalism (e.g., Feldman, Crisp)**  
  - **Core Solution**: Pleasures share no felt quality; they’re unified by the attitude of *representing an object as good-for-me*. Ice cream, proofs, and schadenfreude all involve this pro-attitude.  
  - **Cracks Under Pressure**:  
    - **Schadenfreude Test**: Intentionalism *can* call schadenfreude a "pleasure" (I represent your failure as good-for-me). But this raises two issues:  
      - **Normative Relocation**: If pleasure = "attributing goodness to X," is schadenfreude a *correct* attribution? If yes, it morally endorses malice. If no, pleasure isn’t inherently good—undermining hedonism’s axiology.  
      - **Phenomenal Gap**: Why does schadenfreude *feel* satisfying? Intentionalism sidelines phenomenology, but the "kick" of malice seems integral to its status as pleasure.  
    - **Overextension Risk**: Any pro-attitude (e.g., relief after pain) becomes "pleasure," diluting the concept’s intuitive boundaries.  

  #### **Hidden Convergence**  
  Both theories grapple with **normativity**:  
  - Mill smuggles in objective value via "higher" pleasures.  
  - Intentionalism ties pleasure to subjective valuation but faces the "correctness" problem.  
  Their shared weakness: neither fully explains *why* diverse states are grouped as "pleasures" without appealing to external norms (Mill) or risking moral bankruptcy (intentionalism).  

  ---

  ### Seminar Teaching Strategy  
  I’d present intentionalism as the *more honest* solution to heterogeneity:  
  - **Why?** It directly addresses the diversity of "pleasurable feelings" by decoupling pleasure from phenomenology—this is a legitimate move. Mill’s appeal to "quality" is vague and elitist, masking normative assumptions.  
  - **But Honesty ≠ Success**: Intentionalism admits pleasure’s structure is attitude-based, yet it relocates heterogeneity to the *normative* domain (when is representing X as "good-for-me" *truly* good?). Schadenfreude exposes this: calling it "pleasure" is easy; justifying its *value* isn’t.  

  **Bottom Line**: Intentionalism better resolves phenomenological heterogeneity but relocates the core problem to normativity and moral psychology. Mill’s move is a well-intentioned dodge.  

  \answer{Intentionalism solves heterogeneity but relocates normativity problem}
