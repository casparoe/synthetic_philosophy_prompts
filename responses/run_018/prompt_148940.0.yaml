prompt: |-
  Hey, I'm a software engineer with basically no formal philosphy background, but I keep running into the phrase competence without comprehension in podcasts about Darwin and Turing and now AI. I need you to act as an expert philosopher of science who actually knows the literature, think step-by-step and start with a quick brainstorm, then lay out exactly five precise claims that slogan could be making. Deliver it as a numbered list, exactly five items, each one or two sentences, zero intro or conclusion. For each reading say if it's a trivial platitude, a real substantive thesis, or just wrong, and flag which one people usually mean when they use it to shut down an argument about whether LLMs understand anything. Don't cite books or authors I can't verify offline — I don't need a bibliography, I need to know which version of the idea is doing the work. Keep it in the weeds but don't assume I've read Dennett or anything. Oh and I definately misspelled something above but ignore it.
