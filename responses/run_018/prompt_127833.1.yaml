  ### Decision Tree: Moral Reasons in Collective Harms

  **Root Node:** "Can we assign a fixed share of harm to each individual act (e.g., each burger eaten, each ton of CO₂ emitted, each vote cast)?"  
  - **Yes** → *Decomposable*: Proceed to "Harm Structure"  
  - **No** → *Non-decomposable*: Proceed to "Source of Obligation"  

  ---

  #### **Branch: Decomposable Harm Structures**  
  **Split by Harm Structure:**  
  1. **Continuous Aggregation:** "Does each additional unit of harm (e.g., CO₂ emission or animal suffering) continuously worsen the outcome, even imperceptibly?"  
     - **Yes** → *Obligation Split:*  
       - **Complicity:** "Is the act wrong because it participates in an unjust practice (e.g., factory farming), regardless of impact?"  
         - *Leaf: Practice-based solidarity*  
           - Core claim: Abstaining from meat is obligatory because individual acts uphold an exploitative system.  
           - Awkward commitment: Must treat *any* participation (e.g., eating meat once) as equally blameworthy.  
       - **Role Duty:** "Is the duty tied to one's role (e.g., consumer) in a harmful institution?"  
         - *Leaf: Role-obligation*  
           - Core claim: Consumers must reduce carbon footprints due to their market role, even if emissions are negligible.  
           - Awkward commitment: Inconsistent duties (e.g., consumers blamed, but corporate lobbyists ignored).  
       - (*Counterfactual branch omitted—empty in continuous cases*)  

  2. **Threshold Aggregation:** "Is there a critical threshold (e.g., climate tipping point or ballot-quorum) where crossing it flips the outcome?"  
     - **Yes** → *Obligation Split:*  
       - **Counterfactual:** "Is the act wrong only if it could tip the threshold (e.g., your CO₂ pushes warming past 2°C)?"  
         - *Leaf: Expected-utility aggregation*  
           - Core claim: Voting is obligatory if there's a calculable chance of being pivotal (e.g., in a close election).  
           - Awkward commitment: Demands voting in large elections only when probability of being decisive is >0.0001%.  
       - **Complicity:** "Is it wrong to participate in a practice that risks crossing thresholds (e.g., high-carbon lifestyles)?"  
         - *Leaf: Unnamed*  
           - Core claim: Voting for climate-deniers is complicit in threshold risks, even if your vote isn’t pivotal.  
           - Awkward commitment: Condemns voting in safe districts as symbolically unjust.  

  3. **Winner-Take-All:** "Does only the pivotal act matter (e.g., a vote that breaks an exact tie)?"  
     - **Yes** → *Obligation Split:*  
       - **Counterfactual:** "Is the act wrong only if it changes the outcome (e.g., you alone decide the election)?"  
         - *Leaf: Act-consequentialist rejection*  
           - Core claim: Voting is pointless if you can’t be pivotal (e.g., large elections), so no obligation exists.  
           - Awkward commitment: Treats voting like coin-flipping—permissible if not decisive.  
       - **Complicity:** "Is participating in a winner-take-all system (e.g., voting) inherently complicit if it *could* produce harm?"  
         - *Leaf: Unnamed*  
           - Core claim: Voting for harmful policies is wrong as participation in unjust systems, even in landslides.  
           - Awkward commitment: Equates voting for extremists in safe/seats to direct harm.  

  ---

  #### **Branch: Non-decomposable Harm**  
  **Split by Source of Obligation:**  
  1. **Complicity:** "Is the act wrong because it upholds a system where harm isn’t additive (e.g., meat-eating normalizes animal exploitation)?"  
     - *Leaf: Practice-based solidarity*  
       - Core claim: Abstaining from meat is obligatory—not for individual impact, but to reject systemic injustice.  
       - Awkward commitment: Cannot blame specific farms—denies that animal footprints are individually traceable.  
  2. **Role Duty:** "Is the duty role-based (e.g., citizens must vote) even if harm is systemic?"  
     - *Leaf: **EMPTY BRANCH***  
       - Diagnosis: **Unexplored gap**. Role duties (e.g., "civic duty to vote") assume decomposable accountability, but non-decomposable harms (e.g., climate as emergent chaos) lack clear causal roles. The combination is coherent but unattractive—it demands blind duty without impact.  

  ---

  ### Summary
  - **Domains covered:**  
    - Climate: Continuous (CO₂), Threshold (tipping points).  
    - Meat: Continuous (suffering), Non-decomposable (systemic injustice).  
    - Voting: Threshold (ballot quorums), Winner-take-all (pivotal acts).  
  - **Empty branch:** Non-decomposable + Role Duty (unexplored, due to tension between systemic harm and individual roles).  
  - **Key takeaway:** Positions diverge on whether obligations arise from causal impact, complicity, or roles—with awkward commitments exposing trade-offs.
