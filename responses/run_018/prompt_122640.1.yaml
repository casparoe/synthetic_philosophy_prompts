answer: |-
  ## Stipulation-Proof Dispute Essay Question

  **Question:** Consider a dispute between two theorists, A and B, concerning the existence of particular entities (e.g., whether mereological composites exist, whether holes exist, or whether numbers exist). They pass every standard test for a merely verbal dispute: they fully accept each other's paraphrases in a genuinely shared neutral vocabulary, agree on all non-ontological facts (including causal structures, dispositions, and experiences), and would assent to each other's *sentences* if interpreted within the other's idiolect. Yet, the dispute persists. Each insists *their* vocabulary (e.g., "exists," "object") is the one that *should* be used in authoritative contexts (textbooks, joint papers, policy documents), claiming the other's way of talking is misleading or inappropriate, and they refuse stipulations that would settle the matter. Explain why standard verbal dispute diagnostics fail to resolve this conflict. Is this residual dispute still "merely verbal"? If so, what does this reveal about what "verbal" signifies? If not, what kind of disagreement remains? Crucially, if A and B extend their dispute to the *metaontological* question of *what fixes the meaning* of their shared neutral vocabulary, and *that* dispute exhibits the same "stipulation-proof" characteristics, does this lead to a problematic regress, a stable fixed point, or neither? How does your answer here affect what we should say about first-order ontological disputes? (800-1000 words)

  ---

  **Model Answer (Approx. 700 words):**

  The "stipulation-proof" dispute reveals a crucial limitation in standard verbal dispute diagnostics like paraphrase tests or subtraction arguments. These tests effectively identify disagreements rooted in differing *semantic conventions* assigning meanings to key terms (like "exists") or differing *representational schemes* for describing the same underlying facts. When A and B pass all these tests, it demonstrates that their *factual commitments* are identical; there is no disagreement about how the world is arranged at the fundamental non-ontological level (e.g., about distributions of matter, causal powers, or patterns of experience). The diagnostics succeed in showing there is no *factual* disagreement left to resolve.

  However, the persistence of the dispute indicates that something significant remains undiagnosed: a **pragmatic, conceptual, or normative disagreement about language use itself**. A and B agree *what is the case*, but they disagree profoundly about *how best to conceptualize and talk about what is the case*. Each believes their preferred conceptual scheme (and its associated vocabulary) possesses a crucial virtue lacking in the other’s: perhaps it is more perspicuous for scientific explanation, or more ontologically parsimonious in a relevant way, or avoids misleading implications for practical reasoning, or better tracks deep patterns of similarity deemed significant. The refusal of stipulation is key: stipulating a meaning for "exists" *would* resolve the dispute by fiat, but each side rejects this precisely because they see the *choice* of stipulation as non-arbitrary – they believe their preferred framework has genuine normative superiority for the tasks at hand (e.g., writing the textbook chapter). Calling this disagreement "merely verbal" is misleading if "verbal" implies it is *insignificant* or *trivially resolvable* by stipulation. It is "verbal" only in the narrow sense that it concerns *which words/concepts to use* for describing agreed-upon reality, not *what that reality is*. But it is substantive in the sense that it involves **competing conceptual ethics** – differing views on which conceptual frameworks best serve our cognitive, explanatory, or practical goals.

  Therefore, the residual dispute is not "merely verbal" in the dismissive sense. It is a **normative disagreement about conceptual choice**. It persists because the standard diagnostics target *semantic* differences (meaning assignments) and *factual* disagreements, but they are blind to disagreements about the *pragmatic value* or *conceptual appropriateness* of a vocabulary relative to certain purposes, even when the vocabularies map onto the same underlying facts.

  The critical move is applying this analysis recursively to the *metaontological* dispute itself. Suppose A and B now argue about what fixes the meaning of their shared neutral vocabulary – perhaps A is a semantic externalist, B a conceptual role theorist. Crucially, suppose *this* dispute also becomes stipulation-proof: they agree on all the non-metaontological facts concerning language use, brain states, causal histories, etc., and assent to each other's paraphrases about meaning-fixing, yet each insists *their* metaontological theory provides the correct framework for understanding meaning and reference, claiming the other's is misleading for foundational inquiry. They pass verbalness diagnostics *about metaontology*.

  This does **not** lead to an infinite regress. Instead, it reveals a **fixed point** or a **structural feature of normative inquiry**. At the metaontological level, we encounter the *same* type of normative disagreement about conceptual choice, but now concerning the concepts we use to talk *about* meaning and ontology (e.g., "reference," "joint carving," "meaning-fixing"). The disagreement persists because the disputants have differing conceptual ethics about *which meta-concepts best serve the purposes of metaontological inquiry itself* (e.g., which provides the clearest account of language-world relations, which best explains successful communication or scientific progress).

  This recursive application clarifies, rather than undermines, the status of first-order ontology. It shows that while *factual* disagreements (detectable by standard tests) can be resolved, **normative disagreements about conceptual frameworks can persist all the way down, even at the meta-level**. However, this does not render ontology or metaontology trivial or non-substantive. The persistence signifies that choices about conceptual frameworks are genuinely important and non-arbitrary, driven by deep considerations about cognitive goals, explanatory ideals, and practical consequences. While no framework is uniquely *true* in the sense of mirroring a framework-independent reality (since the disputants agree on that reality), frameworks can be more or less *apt*, *fruitful*, or *illuminating* for specific human purposes.

  Consequently, the takeaway for first-order ontology is **modest realism**: ontological claims are substantive relative to a chosen conceptual framework, and the choice of framework is itself a substantive, normative decision guided by pragmatic and theoretical virtues, not mere stipulation. The stipulation-proof dispute at both levels highlights that ontology involves not just discovering facts but also engaging in ongoing conceptual negotiation about how best to structure our understanding of the world. The dispute persists not because of hidden facts, but because the choice of conceptual tools genuinely matters.

  ---

  **Marking Scheme (Out of 20):**

  1.  **Accurate Description of Stipulation-Proof Case & Test Failure (4 marks):** Clearly explains why standard verbal dispute diagnostics (paraphrase, subtraction, assent-in-idiolect) fail: agreement on non-ontological facts and neutral paraphrases eliminates factual disagreement. *Common Fault:* Simply restating the case without explaining *why* the tests fail to resolve it, or confusing the tests.
  2.  **Analysis of Residual Dispute & Nature of "Verbal" (5 marks):** Correctly identifies the residual conflict as normative/pragmatic/conceptual-ethical (not factual/semantic). Clearly distinguishes “verbal” as concerning word/concept choice from implying insignificance. Explains why stipulation is refused. *Common Fault:* Claiming there *must* be a hidden factual disagreement, or dismissing the dispute as *merely* semantic/verbal without addressing its normative weight.
  3.  **Assessment of Dispute's Value/Type (3 marks):** Argues whether the dispute is "worth having" and identifies its nature (conceptual ethics, normative choice of framework). *Common Fault:* Ignoring this aspect or giving an undeveloped answer.
  4.  **Recursive Application to Metaontology & Regress/Fixed Point (5 marks - Critical for A/B Boundary):** Applies the analysis to the metaontological disagreement about meaning-fixing. Correctly identifies the result as a fixed point (same type of normative disagreement) rather than a vicious regress or something else. Explains *why* it's a fixed point (normative disagreement persists at meta-level about meta-concepts). *Common Fault:* Claiming it leads to infinite regress, ignoring the application entirely, or failing to explain *why* it's not a regress/a fixed point. **This is the key discriminator: Answers that merely *describe* the stipulation-proof case at the meta level score lower; answers that *analyze* it as revealing a structural feature of normative disagreement (the fixed point) and explain its implications score higher.**
  5.  **Implications for First-Order Ontology & Coherence (3 marks):** Draws a clear conclusion about the status of first-order ontological disputes in light of points 1-4 (e.g., modest realism, framework-relativity, importance of conceptual choice). Answer is internally consistent. *Common Fault:* Conclusions that contradict the earlier analysis, or no clear conclusion drawn.

  **A/B Boundary Sharpening:** An answer that clearly **redescribes** the stipulation-proof case at both levels and perhaps identifies the residual dispute as "normative" might earn a B (12-15/20). To earn an A (16+/20), the answer must **actively deploy** the case to *analyze the structure of disagreement itself*, particularly by arguing convincingly that the metaontological recursion reveals a **fixed point** (persistent normative disagreement) and explicitly drawing out the **implications** this has for the nature and substance of ontological inquiry (e.g., shifting focus from "truth" to "aptness," embracing framework-relativity without collapse into quietism).

  **Line Most Likely to be Misread:** "whether the verbalness verdict can be turned on the metaontological disagreement itself. If their fight about what fixes the meaning of the neutral vocabulary is verbal in the same way..."  
  *Why:* Students might think this is asking *only* if the meta-dispute *is* verbal, not *also* what the *consequences* of that are (regress/fixed point/neither) and how it impacts first-order ontology. **Rephrase Suggestion:** "...and crucially, *if* their disagreement about what fixes the meaning of the shared neutral vocabulary *also* exhibits these same 'stipulation-proof' characteristics, does *this* lead to a problematic regress, a stable fixed point, or neither? And how does your answer to *this* affect what we should conclude about first-order ontological disputes?"
