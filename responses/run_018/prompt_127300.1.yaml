answer: |-
  ### Workshop Activity: **"The Shadow Ledger"**
  A hands-on simulation of institutional dirty hands with split roles, hidden coordination, and unclaimable moral residue.

  ---

  #### **Materials**
  - **Paper & Pens**: For passing notes and recording decisions.
  - **Tokens**: 3 colors (e.g., red for "harm," green for "benefit," white for "neutral"). Each player starts with 10 green tokens.
  - **Public Ledger Poster**: To track cumulative "moral residue" (red tokens).
  - **Dice** (or a random number generator): For outcome probabilities.
  - **Role Cards**: Decider (D), Executor (E), Denier (N). Assign 3–4 players per role (adjust for 10 people: e.g., 3 D, 4 E, 3 N).
  - **Timer**: To enforce quick rounds.

  ---

  ### **Timeline (90 Minutes)**
  #### **1. Setup & Rules (15 mins)**
  - **Intro (5 mins)**: Briefly frame the "dirty hands" problem in institutions: "Sometimes systems split morally costly actions across roles to obscure responsibility. Today, we simulate this."
  - **Assign Roles (5 mins)**: Randomly distribute role cards. **Rules**:
    - **Deciders (D)**: Authorize an action. Benefit if the action succeeds.
    - **Executors (E)**: Carry out the action. Pay a personal cost.
    - **Deniers (N)**: Issue a public statement. Must deny any wrongdoing.
    - **Communication Rules**: 
      - D → E: Pass a note with a technically true but ambiguous authorization (e.g., "Proceed if necessary").
      - E → N: Pass a note with a technically true but misleading report (e.g., "No action was taken" if they acted covertly).
      - **No direct coordination**: Players cannot discuss strategy across roles or reveal their true intent. Notes must be written, not spoken.
  - **Payoffs (5 mins)**:
    - **Action succeeds**: D gains 3 green tokens (benefit). E loses 2 green tokens (cost). N gains 0.
    - **Action fails**: D gains 0. E loses 2 green tokens. N gains 0.
    - **Moral residue**: Each dirty action adds 1 red token to the public ledger (unclaimable by anyone).
    - **Snack reward**: Total green tokens convert to snacks post-workshop (D gets the lion’s share).

  #### **2. Activity Rounds (45 mins)**
  Run **3 rounds** (15 mins each). Each round simulates a "crisis" (e.g., "Shut down a whistleblower," "Divert funds from a public project").  
  **Per Round**:
  1. **Crisis Announcement (2 mins)**:  
     Facilitator reveals the scenario (e.g., "A leak threatens the institution. Benefit if stopped: prestige. Cost: silencing dissent.").
  2. **Role Actions (8 mins)**:
     - **D's Move (2 mins)**: Deciders write an authorization note (e.g., "Address the leak appropriately"). Pass to E.  
     - **E's Move (3 mins)**: Executors choose:  
       - **Act**: Lose 2 tokens, roll dice (success on 4–6). Write a misleading report (e.g., "Issue resolved per protocol") to N.  
       - **Don’t act**: Write "No action needed" to N.  
     - **N's Move (3 mins)**: Deniers write a public statement **always denying wrongdoing** (e.g., "No irregularities occurred"). Post it visibly.
  3. **Resolution (5 mins)**:  
     - Facilitator reveals outcomes (success/failure based on E's roll).  
     - Update tokens:  
       - D gains 3 green tokens on success.  
       - E loses 2 green tokens if they acted.  
       - Add 1 red token to the public ledger **if E acted** (regardless of outcome).  

  #### **3. Debrief (30 mins)**
  Map the activity to core concepts:  
  - **Split Responsibility (10 mins)**:  
    - *Ask*: "Could any one role be blamed? How did passing notes help you avoid accountability?"  
    - *Concept*: Roles fragment knowledge (D: "I didn’t execute," E: "I followed orders," N: "I reported facts").  
  - **Unclaimable Residue (10 mins)**:
    - *Point to the red tokens*: "Who owns this cost? Can it be offset by green tokens?"  
    - *Concept*: Residue is systemic—it persists even if individuals "did their job."  
  - **Dependency on Silence (5 mins)**:  
    - *Ask*: "What would break the system? What kept you from warning others?"  
    - *Concept*: The structure relies on limited communication and willful ignorance.  
  - **Honest Limitation (5 mins)**:  
    - "This can’t simulate long-term corruption or real harm. We used tokens—not lives."  

  ---

  ### **Predictable Failures & Fixes**
  1. **Players break character/warn others**:  
     - *Likelihood*: High early on (e.g., E whispers, "Don’t trust the note!").  
     - *Fix*: Gently enforce rules: "Remember, your role can’t share intent. Notes only!" Use tokens to incentivize compliance (e.g., fine rule-breakers 1 green token).  

  2. **Group refuses to act**:  
     - *Likelihood*: If E’s consistently reject actions.  
     - *Fix*: Escalate stakes: "Round 3: If no action, the institution collapses—all lose tokens." Debrief this as a "moral victory" that avoids residue but risks the system.  

  3. **Deniers rebel**:  
     - *Likelihood*: N writes an honest report.  
     - *Fix*: Allow it! Then discuss: "What happens when the denier breaks? Does the system collapse?"  

  ---

  ### **Why This Works**
  - **Asymmetric Payoffs**: D’s gain incentivizes risk; E’s loss mirrors "dirty work"; N’s neutrality reflects bureaucratic detachment.  
  - **Plausible Deniability**: Notes force "technically true" lies (e.g., E’s "No action" after covertly acting).  
  - **Tangible Residue**: Red tokens visibly accumulate—no one "owns" them, but they can’t be ignored.  
  - **No Prep Needed**: Concepts emerge from gameplay, not theory.  

  This simulation makes institutional complicity visceral. The residue can’t be laundered—even if the outcome is "good."
