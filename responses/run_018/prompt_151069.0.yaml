  - Gate 3: Is one option materially faster? (If yes, choose faster option)
  - Gate 4: Is there a non-quantitative tiebreaker? (If yes, use it)
  - Gate 5: Flip fair coin if still tied

  For misfires:
  - Family ties: Only consider if they affect rescue efficiency
  - Unequal crew risk: Covered in Gate 2
  - Resource burn: Only consider if it affects operational capacity (Gate 2 or 3)
