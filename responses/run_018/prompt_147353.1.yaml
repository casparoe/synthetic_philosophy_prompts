answer: |-
  Right then – Burke demands we interrogate *why* this fence stands before swinging the axe. That council’s original sin? Disgraceful. But the fact it was built by bigots doesn’t automatically mean its *present* function is solely exclusionary, nor that the locals defending it now are merely cloaking prejudice in "character" rhetoric. Perhaps over decades, that zoning *did* foster stability – however unintentionally – in a town battered by disinvestment. Burkeanism compels us to ask: what unseen webs of trust, property values, or even flawed-but-functional community patterns might unravel if we rip it out wholesale? 

  That said, Chesterton’s fence isn’t a suicide pact. If rigorous examination shows the hidden function is *indeed* just exclusion – no compensating social cohesion, only stagnation, and rotting planks propped up by inertia – then reform isn't betrayal, it's stewardship. But we demolish *deliberately*, brick by brick if needed – not because some planner declares the original sin voids all accrued complexity. The blank check accusation only sticks if we refuse to look hard at what the fence *actually* does now. True conservatism requires that hard look.
