  *scratches chin* The racist origins complicate things - Burke would care more about present function than historical intent. But if the current "neighborhood character" defense masks ongoing exclusion, that's precisely where Burkean caution about hidden functions could cut both ways. Must acknowledge the rotten landlord aspect while taking community sentiment seriously. 

