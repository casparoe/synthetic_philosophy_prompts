answer: |-
  Here’s the full spec for any theory of moral genealogy that wants to be taken seriously, broken down by what it **must** explain (non-negotiables), what it **should** address (highly expected), and where camps can differ (negotiable preferences). I’ll flag contradictions and the "killer" desideratum at the end.

  ---

  ### **Non-Negotiables (Fail These = The Theory is Broken)**
  1. **The Slave Victory Paradox**  
     *Must explain why "slave morality" (e.g., Christian humility, equality) dominated despite "master morality" (e.g., aristocratic strength, hierarchy) being materially/politically stronger.*  
     *Why it’s essential:* Nietzsche’s core puzzle. If masters were stronger, why did their value system lose? A theory that just says "slave morality was better" fails—it must reveal the *mechanism* of overthrow (e.g., psychological subversion, institutional capture, master decadence).

  2. **Ressentiment ≠ Anger**  
     *Must distinguish ressentiment from transient rage or justified grievance. Ressentiment is chronic, impotent hatred that *invents new values* as revenge.*  
     *Why it’s essential:* Nietzsche’s key insight. If your theory treats "resentment" as generic anger, you miss how *creative* slave morality is. Ressentiment is alchemy—turning weakness into "goodness," strength into "evil."

  3. **Master Decline Mechanism**  
     *Must explain how/why masters *lost power* or *adopted slave values*. No handwaving ("they got soft").*  
     *Why it’s essential:* Masters don’t just vanish. Did internal decay (e.g., guilt, boredom) make them vulnerable? Was slave morality a Trojan horse (e.g., via religion)? If masters were truly "strong," why submit?

  4. **Psychological Plausibility**  
     *Proposed motives (e.g., ressentiment, will to power) must align with observable human behavior.*  
     *Why it’s essential:* Genealogy isn’t myth—it’s a causal story. If your mechanism doesn’t explain real-world pettiness, guilt-tripping, or moral grandstanding, it’s just vibes.

  ---

  ### **Highly Expected (Ignore These = Theory is Shallow)**
  5. **Distinguish Reactive vs. Active**  
     *Should clarify why slave morality is "reactive" (defined *against* masters) while master morality is "active" (self-affirming).*  
     *Why it’s expected:* Nietzsche’s critical dichotomy. Collapsing them misses how slave morality parasitizes the master framework (e.g., "good vs. evil" inverts "good vs. bad").

  6. **Historical Anchoring**  
     *Should roughly map to real transitions (e.g., Roman aristocracy → Christian dominance). Doesn’t need literal accuracy, but must reflect historical dynamics.*  
     *Why it’s expected:* Genealogy claims to explain *our* morality. If it ignores Rome/Judaism/Christianity, it’s unmoored.

  7. **Explain Moral *Persistence***  
     *Should address why slave morality stuck around. Was it just effective propaganda? Did it fulfill a psychological need?*  
     *Why it’s expected:* Winning is one thing; dominating for millennia is another. Bonus points if it explains modern secular morality (e.g., "woke" as ressentiment 2.0).

  ---

  ### **Contested Ground (Camp-Specific Preferences)**
  8. **Evolutionary Psychology Compatibility**  
     *Doesn’t *need* to square with evo-psych, but can’t contradict basic human universals (e.g., status-seeking).*  
     *The debate:* Nietzschean psychology (e.g., will to power) might clash with evo-psych’s "adaptationist" bias. This is where your friend’s "internal consistency" point lives—*if* you prioritize scientific framing.

  9. **Universality vs. Historicity**  
     *Must moral origins be a *single* story (Nietzsche’s focus) or can there be multiple paths?*  
     *The debate:* Nietzsche implies a dominant lineage, but other models (e.g., feudal honor vs. bourgeois virtue) might coexist. Non-negotiable only if claiming to explain *all* morality.

  ---

  ### **Danger Zone: Contradictions to Resolve**
  - **The Slave Victory vs. Master Psychology Trap**  
    *Problem:* If masters are defined by *unreflective strength*, how could they ever be duped by slave morality? If slaves are defined by *impotence*, how did they win?  
    *Solution Needed:* A theory must show either:  
    a) Masters had hidden vulnerabilities (e.g., guilt from cruelty),  
    b) Slave "weakness" was strategically potent (e.g., ressentiment as intellectual weapon), or  
    c) "Strength" was misinterpreted (e.g., masters weren’t psychologically invincible).

  ---

  ### **The Killer Desideratum**
  **#1 (Slave Victory Paradox)** murders the most popular readings:  
  - **Sunday School Nietzsche:** "Slave morality won because it’s *true* or *kinder*" fails—it ignores Nietzsche’s claim that it’s a *triumph of cunning*.  
  - **Bro Nietzsche:** "Masters got lazy/complacent" fails without explaining *why* (handwaving).  
  - **Faux-Enlightenment Nietzsche:** "Morality progressed rationally" collapses the reactive/active distinction (#5).  

  If a theory can’t explain how the "weak" conquered the "strong" *on the strong’s turf*, it’s fanfiction.

  ---

  **TL;DR:** Airtight genealogy needs:  
  1. Solve the slave victory puzzle (non-negotiable),  
  2. Treat ressentiment as creative poison (non-negotiable),  
  3. Show masters weren’t toppled by magic (non-negotiable),  
  4. Keep psychology real (non-negotiable),  
  5. Don’t blur active/reactive morals (expected),  
  6. Root it in history-ish (expected),  
  7. Explain why morality stuck (expected).  
  The rest is campfire debate. Now go win that beer argument. 🍻
