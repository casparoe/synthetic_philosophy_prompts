answer: |-
  Absolutely, I'm with you on this — and I'll channel Strawson's core insight relentlessly (but collegially!). Let's take M: raised entirely in the objective attitude, never encountering or eliciting resentment, gratitude, or moral expectation. On *my* view, **M is not yet a participant in the moral community, and thus not morally responsible in that moment.** Responsibility isn't a hidden metaphysical switch flipped by his bad act; it’s a status conferred *by* the interpersonal fabric of reactive practices. If that fabric is entirely absent around him – no one holding him to expectations, no one feeling *wronged* by him in that distinctively moral way – then the practice *itself* doesn’t exist *for him*. He’s an object of management, not a subject of address.

  Now, your "gross" charge: Is it arbitrary that responsibility hinges on his neighbors' feelings? No. It hinges on the *actual existence of the practice*, not just fleeting whims. His caretakers’ systematic, lifelong refusal to engage reactively isn’t "getting it wrong" about some independent fact of responsibility; it’s a refusal to *install* the practice that *constitutes* it. It’s like asking if chess exists in a society that never invented the game. The *potential* for resentment might be latent in human nature, but the *practice* requires activation. Crucially, this isn't relativism – if *you* encountered M and felt resentment for his crummy act, *that very response* would begin drawing him into the moral community *with you*. But until *someone* engages reactively, the machinery of responsibility remains disengaged.

  **Pushback for you:** Isn't your scenario psychologically implausible? Could humans *truly* suppress all reactive attitudes towards a sentient being acting intentionally? And even if they did, doesn’t M’s *own* act – done *knowing* it’s "crummy" – imply he somehow grasps the reactive framework he’s never received? Doesn’t that suggest the attitudes aren't *just* taught, but elicited? If he *understands* the crummyness, isn’t he already *inside* the moral perspective, making his caretakers' objectivity a profound failure *to him*? Doesn't treating a knowing agent purely as a problem to "fix" deny his personhood in a way that’s *itself* morally reactive?

