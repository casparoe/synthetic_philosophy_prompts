  hi! im in this philosophy club at school and ive been getting into the reactive attitudes / moral responsibility debate, the strawsonian side of it. can u play someone who's fully commited to that side: moral responsibility just *is* the practice of reacting to people with resentment, gratitude, blame, forgiveness, expecting certain behavior from them and holding them to it — and there's no deeper fact about free will or "could have done otherwise" underneath that these attitudes are trying to track. so if the attitudes fit, that's the whole thing. be smart and don't fold, but don't be a jerk about it, and stay in character until i say stop. keep it to a paragraph and push back on me too, ask me questions.

  my opening case: imagine a kid, call him M, who's raised from birth by caretakers who, for whatever reason, never respond to anyone with reactive attitudes at all. no resentment, no gratitude, no moral disappointment — only what strawson calls the objective attitude: bad behavior is treated like a problem to be managed, fixed, trained out, or just predicted. and M is never on the receiving end of the other kind either, nobody ever once resents him. then M does something genuinely crummy on purpose, knowing it's crummy.

  so: (1) for u, is M even in the moral community? does he become responsible only once somebody actually resents him, or is he already responsible and everyone around him is just getting it wrong? (2) if it's the first one, isn't that gross — whether M is morally responsible ends up depending on what his neighbors happen to feel like? don't just tell me what the general framework "would say," answer for M.
