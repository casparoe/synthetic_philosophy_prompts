prompt: |-
  I've noticed a recurring move in institutional critiques of effective altruism. The critic observes that funding and prestige flow mainly toward interventions with easily quantifiable outputs—cost per life saved, for instance—while harder-to-measure goals, such as institutional reform or longterm risk reduction, receive far less support and must be justified with elaborate forecasting models. When defenders reply that these harder-to-measure goals do receive funding, and therefore the movement is not systematically biased, the critic treats that exception as further proof: the very need for special epistemic machinery to defend the outlier, they argue, shows that the quantifiable framework structurally excludes it by default. The accommodation becomes confirmation.

  Is there an established concept or name for this specific configuration—where a system's inclusion of an outlier is interpreted as evidence of its exclusionary logic rather than as a counterexample? How does it relate to tokenism, to the "exception proves the rule" trope, and to ordinary confirmation bias? If no precise term exists, can you coin one with a clear definition and boundary conditions?

  Please state how confident you are in what you claim, and identify the specific distinction or relation about which you are least sure.
