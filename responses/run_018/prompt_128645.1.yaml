answer: |-
  This is a fascinating and precise observation of a recurring epistemic pattern in systemic critiques. While no single established term perfectly captures this *exact* configuration, we can break it down and relate it to existing concepts before proposing a new term.

  1.  **Related Concepts:**
      *   **Tokenism:** This is the closest existing concept. Tokenism occurs when minimal inclusion of an underrepresented group (or idea) is used to deflect criticism of systemic exclusion, thereby *reinforcing* the exclusionary system by masking its true nature. The "token" inclusion proves the rule exists and requires special justification for deviation. **Confidence: High (90%) that this is a core component.**
      *   **The "Exception Proves the Rule" (Misinterpreted):** The original legal maxim meant an exception *tests* the rule. In modern misuse, it means an exception *confirms* the existence of a general rule precisely because it's exceptional. This aligns with the critic's move: the funded outlier is exceptional, proving the quantifiable rule is dominant. **Confidence: High (85%) on the relevance of the trope's misinterpretation.**
      *   **Confirmation Bias:** Critics selectively interpret evidence (the need for special justification) to confirm their pre-existing belief (systemic quant bias), potentially ignoring evidence of genuine integration. **Confidence: Medium (75%). It's present but doesn't capture the *systemic* nature or the *reason* the evidence is interpreted that way.**
      *   **Performative Contradiction:** An argument undermines itself through its performance. Here, the *system's act* of including the outlier via special machinery *demonstrates* the bias it's accused of. **Confidence: Medium-High (80%). Relevant, but broader than this specific pattern.**
      *   **Paradox of Tolerance (Analogy):** Defending tolerance may require intolerance of the intolerant. Analogously, including the non-quantifiable *requires* resorting to the quantifiable system's own complex tools (models), reinforcing its dominance. **Confidence: Medium (70%) - structural similarity, but different domain.**

  2.  **The Core Pattern & Proposed New Term:**
      The specific configuration you describe is: **A system's dominant logic necessitates special, often burdensome, epistemic "accommodations" for outliers. The *existence and nature* of these accommodations are then interpreted not as counter-evidence to exclusion, but as the *mechanism* and *proof* of the system's inherent structural bias against the outlier category.**

      **Proposed Term: Systemic Exceptionalism (or Epistemic Accommodation Bias)**

      *   **Definition:** Systemic Exceptionalism is a dynamic within a dominant framework (e.g., quantification in EA) where:
          1.  The framework's core logic and evaluation mechanisms inherently privilege certain types of entities or goals (e.g., easily quantifiable interventions).
          2.  Entities or goals falling outside this privileged category are treated as exceptions.
          3.  Inclusion of these exceptions is contingent upon the development and application of special, often complex and resource-intensive, epistemic or justificatory machinery *derived from or compatible with* the dominant logic itself (e.g., elaborate forecasting models).
          4.  Critics interpret the *necessity* and *form* of this special machinery not as evidence of the system's inclusivity, but as definitive proof of its structural bias. The accommodation becomes a performative act confirming the exclusionary rule it superficially contradicts.

      *   **Boundary Conditions:**
          *   **Requires a Dominant Framework:** There must be a clear, established system with identifiable norms and evaluation criteria.
          *   **Requires Outliers:** There must be identifiable entities/goals that demonstrably fall outside the privileged category of the framework.
          *   **Requires Accommodation Machinery:** The system must have mechanisms (formal or informal) that allow for the *potential* inclusion of outliers, but these mechanisms must be distinct, complex, and derived from the dominant logic (e.g., needing vastly more evidence/models).
          *   **Critic's Interpretation:** The critique *specifically* focuses on the *burden of proof* or *form of justification* required for outliers as evidence of systemic bias, dismissing the inclusion itself as unrepresentative.

      *   **Distinction from Tokenism:** Tokenism focuses on symbolic inclusion masking exclusion. Systemic Exceptionalism focuses specifically on the *epistemic burden* required for inclusion *as* the mechanism and proof of exclusion. Tokenism is often about representation; Systemic Exceptionalism is about justification and methodology within a knowledge system. **Confidence: Medium (70%) - This distinction is crucial but nuanced.** Tokenism *can* involve justification burdens, but Systemic Exceptionalism makes this burden the central evidence of the critique.
      *   **Distinction from Confirmation Bias:** Confirmation bias is a general cognitive tendency. Systemic Exceptionalism describes a specific *structural* pattern *within a system* and a specific *rhetorical move* by critics *based* on that structure. The critic's move *utilizes* confirmation bias but is directed at a systemic feature. **Confidence: High (85%).**

  3.  **Confidence Levels:**
      *   **Overall Analysis of the Pattern:** **High (90%).** Your description is clear, and the dynamics you outline are logically coherent and observable.
      *   **Relation to Tokenism:** **Medium (70%).** While clearly related, pinpointing the precise difference (focus on epistemic burden vs. symbolic representation) is where I'm least certain. The concepts overlap significantly in practice.
      *   **Relation to "Exception Proves the Rule":** **High (85%).** The misinterpreted trope fits well.
      *   **Relation to Confirmation Bias:** **High (85%).** The critic's move is a clear instance, but the systemic aspect adds depth.
      *   **Utility/Appropriateness of "Systemic Exceptionalism":** **Medium-High (80%).** It captures the core ideas (system, exception, dominance). "Epistemic Accommodation Bias" might be more precise regarding the *mechanism* but is clunkier. Coining terms is inherently speculative.

  **In summary:** Your observation identifies a powerful rhetorical pattern common in critiques of systems prioritizing quantification. While heavily overlapping with **Tokenism** and employing a **misinterpreted "exception proves the rule"** logic fueled by **confirmation bias**, the specific focus on the *epistemic burden of accommodation as proof of exclusion* warrants a distinct concept. **Systemic Exceptionalism** is proposed as a term to capture this dynamic, where the system's *method* of including outliers becomes the critic's prime evidence of its inherent bias. Its key boundary is the centrality of the special justificatory machinery derived from the dominant logic.
