  The user suspects an equivocation between competence and propositional knowledge, and I think they're onto something. There's also that subtle modal slip between "objectively entails" and "is known to entail". The argument conflates logical consequence with epistemic access—just because R follows doesn't mean I've traced the path.

  The cognitive limits point is crucial too. Even if we grant that I "implicitly" know R (whatever that means), the derivation is computationally impossible for humans. Epistemic logic needs to account for bounded rationality.

  I recall possible-worlds semantics handles this by requiring accessibility of the consequence—not just existence of a proof, but ability to recognize it. That preserves closure without demanding omniscience. The user might appreciate this technical resolution.

