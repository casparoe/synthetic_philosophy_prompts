  **Funding Opportunity Announcement (FOA) Number: NSF 24-666**

  **Title:** Pre-Registered Counterfactual Trials in Macrohistory: Solving the Needham Question Through Synthetic Control Methods

  **Program Solicitation:** Directorate for Social, Behavioral and Economic Sciences; Division of Historical, Anthropological, and Geographical Sciences

  **Deadline:** Proposals must be recieved by 11:59 PM, April 1, 2025, submitter's local time.

  **Synopsis:** The National Science Foundation (NSF) announces a new funding opportunity to resolve the so-called "Needham Question" — why did the Industrial Revolution occur in Britain and not in China, despite the latter's earlier technological sophistication? This FOA solicits proposals for a large-scale, pre-registered, multi-arm counterfactual trial in macrohistorical analysis. The goal is to empirically adjudicate between competing explanations for the Great Divergence using randomized assignment of critical factors and synthetic control methodologies.

  **Background:** Traditional historical scholarship has relied on observational data, leading to persistent endogeneity concerns and post-hoc narrative construction. By applying experimental causal inference techniques to the period 1700-1850, we aim to generate rigorous, replicable evidence on the causal mechanisms underlying industrialization.

  **Methodological Approach:** 
  - **Randomization:** Eligible societies (n=200, including but not limited to Britain, China, India, the Ottoman Empire, and other pre-modern polities) will be randomly assigned to one of four arms: 
    - *Treatment Arm 1 (Coal):* Access to high-quality, easily minable coal deposits.
    - *Treatment Arm 2 (Colonies):* Assignment of overseas colonies with extractive institutions.
    - *Treatment Arm 3 (Culture):* Exposure to a "Protestant Ethic" cultural package via targeted memetic diffusion.
    - *Control Arm:* Business-as-usual historical trajectory.
  - **Blinding:** To prevent temporal contamination, all societies will be blinded to their treatment status until 1850. This will be achieved through a temporal firewall maintained by the experimental apparatus.
  - **Synthetic Controls:** For units where full counterfactual manipulation is infeasible (e.g., large polities), we will construct synthetic controls using weighted combinations of untreated societies. Pre-treatment covariate balance (circa 1699) will be enforced via entropy balancing.
  - **Pre-Registration:** A pre-analysis plan (PAP) must be filed with the International Bureau of Counterfactual History (IBCH) by December 31, 1699, detailing primary outcomes (e.g., steam engine adoption by 1850), secondary endpoints, and statistical models. Proposals must include a certified copy of the PAP, time-stamped via quantum-entangled notarization.
  - **Exclusion Criteria:** Societies exhibiting proto-industrialization (e.g., Song Dynasty China, Mughal India) or spontaneous steam engine invention prior to 1700 will be excluded to prevent contamination.

  **Data Management Plan:** All counterfactual outcomes (e.g., GDP trajectories, technological diffusion rates) must be recorded in a secure, non-temporal database. Principal Investigators (PIs) are required to submit raw data logs from at least three parallel universes to ensure reproducibility. Data must be formatted in HDF5 (Historical Data Format, version 5) and include metadata documenting any causal interference between units.

  **Budget Justification:** Budgets may include costs for temporal manipulation, counterfactual resource generation (e.g., coal deposits at specified locations and depths), and memetic diffusion infrastructure. Justify large equipment requests (e.g., "temporal dampening field generators") with quotes from at least two vendors. **Note:** Line items for "counterfactual coal deposits" must include geological surveys to ensure calorific value consistency with Durham coalfields.

  **Sidebar: Inclusion Criteria for Valid Control Societies**
  - Must be a sovereign polity between 1700-1850.
  - Must not have developed steam engines prior to 1700 (per pre-registered definition: "atmospheric engine or equivalent").
  - Must have pre-treatment data on at least 10 covariates (e.g., literacy rates, state centralization, grain yields).
  - Societies with known industrialization events (e.g., Belgium, post-1830) are ineligible as controls.

  **Review Criteria:** Proposals will be evaluated on methodological rigor, feasibility of temporal randomization, adequacy of blinding protocols, and commitment to open counterfactual data. Preference given to interdisciplinary teams with expertise in econometrics, quantum chronology, and Qing administrative history.

  **Point of Contact:** Dr. A. Historian, Program Officer, ahistorian@nsf.gov

