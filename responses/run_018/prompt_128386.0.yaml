  **Funding Opportunity Announcement: NSF 24-609**  
  **Title:** Pre-Registered Counterfactual Trials in Macrohistory: Solving the Needham Question Through Synthetic Control Methods  
  **Sponsor:** National Science Foundation (NSF), Directorate for Social, Behavioral, and Economic Sciences  
  **Deadline:** Proposals must be recieved by 11:59 PM Eastern Time on April 1, 2025.  

  ### Program Description  
  The NSF invites proposals for a large-scale experimental initiative to resolve the persistent historiographic puzzle known as the "Needham Question": Why did sustained industrialization emerge in 18th-19th century Britain, but not in contemporaneous societies of comparable sophistication (e.g., Qing China, Mughal India, Ottoman Empire)? This solicitation seeks to transcend observational limitations by implementing a randomized, multi-arm intervention across the 1700–1850 temporal window, with rigorous counterfactual scaffolding.  

  ### Methodology Requirements  
  Proposals must adhere to the following experimental protocol:  

  1. **Randomization & Blinding**:  
     - Societies (N ≥ 150 polities meeting inclusion criteria) will be randomly assigned to:  
       - **Treatment Arm 1 (T1: "Coal")**: Geospatial randomization of high-BTU coal deposits within navigable distance of major population centers.  
       - **Treatment Arm 2 (T2: "Colonies")**: Stochastic assignment of overseas territories with pre-specified extractive institutions.  
       - **Treatment Arm 3 (T3: "Culture")**: Blind infusion of "Baconian/Newtonian thought packages" via covert textual dissemination.  
     - **Control Group**: Societies receiving null interventions (e.g., status quo resource/cultural endowments).  
     - **Blinding Protocol**: All societies must remain unaware of treatment status until post-1850 outcome assessment. Temporal observers will wear era-appropriate disguises.  

  2. **Synthetic Control Framework**:  
     - For non-randomizable macro-units (e.g., Qing China), proposers must construct synthetic controls using weighted composites of donor societies (e.g., Tokugawa Japan + Dai Viet). Weights must be pre-specified in the 1699 Pre-Analysis Plan (PAP).  

  3. **Exclusion Criteria**:  
     - Societies demonstrating proto-industrialization (e.g., >2 steam engines/10k population pre-1700) are ineligible as controls (see sidebar).  
     - "Accidental industrializers" (e.g., post-1750 Belgian innovators) must be pruned post-randomization to avoid contamination.  

  4. **Pre-Registration & Data Integrity**:  
     - A notarized Pre-Analysis Plan (PAP) must be filed with the *Journal of Temporal Causality* by December 31, 1699. Deviations from PAP require quantum-entangled amendments.  
     - **Data Management Plan**: All counterfactual outcomes (e.g., GDP trajectories, patent filings) must be recorded in non-paradoxical formats. Primary endpoint: steam engine adoption density (1750–1850).  

  ### Budget Justification  
  Budgets must itemize:  
  - Temporal randomization infrastructure (incl. causal discontinuity generators)  
  - Cultural treatment dissemination (e.g., clandestine pamphlet networks)  
  - **Critical Line Item**: "Counterfactual coal deposit synthesis" ($1.2M)—geological simulations to ensure calorific parity with Newcastle-grade coal in randomized loci.  

  ### Sidebar: Inclusion Criteria for Valid Control Societies  
  - Must lack pre-1700 steam technology (per PAP Definition 2.3: "atmospheric engine or derivative").  
  - Must exhibit covariate balance on pre-treatment variables (1699 state centralization, agrarian yield, literacy).  
  - Excludes: Song China (suspected spontaneous industrialization), Netherlands (prior exposure to T2/T3).  

  ### Review Criteria  
  Feasibility of blinding, PAP compliance, synthetic control validity, and ethical handling of temporal interference (e.g., suppression of anachronistic memes). Interdisciplinary teams (cliometricians, Qing paleographers, coal geologists) encouraged.  

