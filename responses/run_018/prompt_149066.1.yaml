  Take on the role of an expert analytic metaphysician with training in philosophy of material objects and institutional policy writing. Before drafting, spend a brief paragraph brainstorming the genuine conceptual tensions in material constitution—specifically the statue-and-clay case, coincident entities, persistence through gradual part-replacement, mereological essentialism versus anti-essentialism, and three-dimensionalist versus four-dimensionalist accounts of persistence—so that your satire exaggerates real fault lines rather than invented ones. Then write a deadpan, bureaucratic “Policy Directive on Accession, Continuity, and Ontological Drift” for the fictional Institute of Ontological Conservation, formatted as numbered clauses with occasional sub-clauses and a sidebar, totaling approximately 650 words. The voice should be that of an overcautious museum registrar who has internalized extreme metaphysical commitments without recognizing their absurdity. The target is the uneasy coexistence of mereological essentialism and naive form-based persistence in ordinary object-tracking. To ground the satire, invent and formally define “ontological drift”: the process by which a displayed object gradually replaces all constituent matter over centuries, producing a numerically distinct entity that nevertheless retains the original accession label, display case, and taxonomic status. Include clauses addressing: (i) part-replacement requiring a new accession number unless “formal continuity” is certified; (ii) storage-vault protocols when coincident objects (e.g., a clay substrate and a statue) occupy identical spatiotemporal coordinates; (iii) a refund and inheritance policy for objects that have drifted; and (iv) an implicit reductio showing that strict essentialism about parts makes museum practice impossible, while loose form-persistence makes identity arbitrary. Do not name specific living philosophers, do not cite texts, authors, or page numbers, and avoid any request for bibliographies or further reading; refer to theoretical positions only as “the standard doctrine” or “established anti-essentialist practice” if necessary. The humor must come from deadpan exaggeration of real metaphysical commitments, not from invented nonsense: a specialist should recognize the precise positions being parodied, while a non-specialist should read it as an absurdly pedantic bureaucracy. Maintain sustained irony throughout—never break character, never wink, and never state the moral directly. Ensure internal consistency: the registrar should apply the policy logic rigorously, even when it produces contradictions about inheritance, insurance liability, and display rights. Start with the brainstorming, then proceed directly to the policy text.
