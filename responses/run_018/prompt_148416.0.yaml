prompt: |-
  I serve as the procedural officer for the Meridian Research Collective, an interdisciplinary scholarly society governed by a thirty-four-article Charter ratified in 2019 that is explicitly self-amending. Article 28 permits any article—including itself—to be altered by a two-thirds vote of members present at a quarterly assembly, yet it also contains a Reflection Subsection stating that any proposal modifying the amendment mechanism itself must be referred to a special Constitutional Convention. The difficulty is that the rules for convening that Convention are defined within Article 28 itself, so members routinely propose changes that appear procedural on the surface but in fact reconfigure the voting threshold, the eligible electorate, or the entrenchment status of Article 28. I must evaluate each proposal within about fifteen minutes before an assembly, without outside counsel, and document my reasoning for the official minutes, since my sign-off is required before any amendment reaches the floor.

  Please construct a reusable decision procedure, expressed as an ordered checklist or flowchart in words, that I can apply to any proposed Charter amendment to determine whether it triggers the Reflection Subsection, creates a Nomic-style self-reference loop, or attempts an indirect entrenchment. The procedure should distinguish direct mutations of Article 28 from indirect loops—such as amending Article 5, which defines membership and therefore determines who counts toward the two-thirds vote, or Article 19, which governs quorum—and should include explicit tests for threshold mutations (for example, lowering the two-thirds requirement via a vote that does not itself meet the current threshold) and for cosmetic substitutions that actually relocate decision authority. At each step, indicate what counts as a sufficient answer, where the procedure must halt with a mandatory referral to the Convention, and where judgment is irreducible, particularly the boundary between a “clarifying” edit and a “substantive” change, or whether a distant indirect loop is close enough to matter. Then apply the procedure to three cases: (1) a popular proposal to reduce the amendment threshold to sixty percent, adopted by a sixty-percent vote at the assembly—a result I will not want to endorse; (2) a proposal to insert a ten-year sunset clause into Article 28 that automatically suspends it unless actively renewed; and (3) a proposal that replaces the phrase “the membership” with “the assembly chair” in the voting clause of Article 28, framed as mere editorial housekeeping. Finally, state precisely what the procedure cannot settle—such as whether the Charter ought to be easily amendable at all—and flag every point where an answer requires a value judgment rather than a procedural fact.

  The collective meets quarterly, the stakes involve shared research funds and authorship protocols, and I have only the Charter text in front of me. Keep the framework grounded in the logic of self-amending legal structures rather than generic parliamentary rules, avoid any request for bibliographies, reading lists, or citations, and do not ask me to consult external sources; the deliverable should be something I can run repeatedly with no tools beyond the proposal text and the Charter.
reasoning: |-
  We are constructing a decision procedure for the procedural officer to evaluate proposed Charter amendments. The key challenge is to determine whether a proposal triggers the Reflection Subsection (which requires referral to a Constitutional Convention) because it modifies the amendment mechanism (Article 28) either directly or indirectly, or creates a self-reference loop, or attempts an indirect entrenchment.

  The Reflection Subsection of Article 28 states that any proposal modifying the amendment mechanism itself must be referred to a special Constitutional Convention.

  Important considerations:
  - Direct mutations of Article 28 (any change to the text of Article 28) are obvious triggers.
  - Indirect loops: changes to other articles that affect the operation of Article 28 (e.g., Article 5 defines membership, which affects the electorate for the two-thirds vote; Article 19 defines quorum, which affects the base for the two-thirds calculation).
  - Threshold mutations: changing the voting threshold (e.g., lowering the two-thirds requirement) without meeting the current threshold (if done via an amendment that itself does not meet the current threshold, it might be an attempt to bypass the convention requirement).
  - Cosmetic substitutions that actually relocate decision authority (e.g., changing who votes or who counts the votes).

  The procedure must also consider:
  - Whether a change is "clarifying" (e.g., fixing a typo) vs. "substantive" (changing meaning). This boundary is often a matter of judgment.
  - Whether a distant indirect loop (e.g., changing an article that affects another article that then affects Article 28) is close enough to require referral.

  We design the procedure as an ordered checklist. The goal is to determine if the proposal must be referred to the Constitutional Convention.

  **Decision Procedure Checklist**

  1. **Identify the Target Article(s)**: 
     - Which article(s) does the proposal explicitly amend? 
     - If Article 28 is among them, proceed to step 2.
     - If not, proceed to step 3.

  2. **Direct Change to Article 28**:
     - Does the proposal change any part of Article 28? (If no, note that but proceed to step 3 for indirect effects.)
     - For each change in Article 28:
       - Is the change purely cosmetic (e.g., correcting a typo, rephrasing without altering meaning)? 
          - *Judgment call*: If yes, then it does not trigger the Reflection Subsection. Proceed to step 3 to check for indirect effects of other changes.
          - If no, then it is a substantive change to Article 28 and triggers the Reflection Subsection. **Halt and refer to Convention**.
       - However, note that even a cosmetic change might be a Trojan horse: if it changes a word that has a defined term elsewhere, it might be substantive. So, we must be cautious.

  3. **Indirect Effect on Article 28**:
     - Consider the entire proposal (including changes to articles other than Article 28). Does the proposal, by changing any other article, have the effect of altering the operation of Article 28? 
     - Key areas to check (non-exhaustive):
       - **Electorate**: Does it change who is a member (Article 5) or who is eligible to vote (if defined elsewhere)? This affects the denominator for the two-thirds vote.
       - **Quorum**: Does it change the quorum rules (Article 19)? This affects whether the assembly can even conduct the vote and the base for the two-thirds calculation.
       - **Voting Threshold**: Does it change the threshold for amendment (if defined in another article)? Note: the threshold is defined in Article 28, but if another article is amended to change how votes are counted, that could indirectly affect Article 28.
       - **Entrenchment**: Does it change the entrenchment status of Article 28 (e.g., by making it harder or easier to amend in the future) without directly amending Article 28? This might be done by amending another article that then imposes conditions on Article 28.
       - **Convention Trigger**: Does it change the rules for convening the Constitutional Convention (which are in Article 28)? This would be an indirect change to Article 28.
     - How to assess:
       - Trace the dependencies: if the proposal amends an article that is directly referenced in Article 28 (e.g., if Article 28 says "members present as defined in Article 5", then changing Article 5 would affect Article 28).
       - Also, consider if the change creates a loop: e.g., if the proposal amends Article 5 (membership) and then Article 5 is used to define the electorate for amending Article 28, then changing Article 5 could be an indirect way to change the amendment process.
     - *Judgment call*: The officer must decide if the indirect effect is significant enough. If the effect is direct and clear (e.g., changing Article 5 which is explicitly referenced in Article 28), then it triggers. If it is very distant (e.g., changing an article about the society's logo and then the logo rule is used in a membership rule that then affects the electorate), it might not. But the officer should err on the side of caution.
     - If there is any indirect effect on the operation of Article 28 (as described above), then **Halt and refer to Convention**. Otherwise, proceed to step 4.

  4. **Threshold Mutation Check**:
     - This step is to catch attempts to bypass the current threshold by using a lower threshold without going through the convention.
     - Does the proposal change the voting threshold for amendments (either directly by amending Article 28 or indirectly by changing how the threshold is calculated) to a lower threshold?
     - And is the proposal itself being voted on with the current threshold (two-thirds)? But note: the vote hasn't happened yet, so we don't know if it will get two-thirds. However, the issue is that the proposal, if passed without meeting the current threshold, would be invalid if it requires the convention. So the officer must block it from the floor if it triggers the convention requirement.
     - Actually, the key is: if the proposal is attempting to change the threshold without going through the convention, then it must be referred. So:
       - If the proposal (either directly or indirectly) changes the amendment threshold (e.g., from two-thirds to sixty percent) and that change is being attempted without the convention, then it is a violation. Therefore, if the proposal has such an effect, then it must be referred to the convention. We have already caught direct changes to Article 28 (step 2) and indirect changes (step 3) that would include threshold changes. So step 4 might be redundant? 
     - Alternatively, step 4 is about the manner of the vote: but the proposal hasn't been voted on yet. We are evaluating the proposal before the vote. So the focus is on the content of the proposal, not the vote that will happen. Therefore, step 4 should be integrated into steps 2 and 3. We'll remove step 4 as a separate step and note that threshold changes are caught in steps 2 and 3.

     However, note the example: a proposal to reduce the threshold to sixty percent, and it is being voted on by sixty percent. The officer must prevent this from being voted on without convention. Therefore, if the proposal changes the threshold (which is a change to Article 28, so caught in step 2) or changes it indirectly (step 3), then it is caught. So we don't need a separate step for threshold mutation because it is covered.

  5. **Cosmetic Substitution that Relocates Authority**:
     - This is a specific type of change that might be disguised as housekeeping. 
     - Check: Does the proposal change any term that transfers authority (e.g., from "the membership" to "the assembly chair")? 
     - How: Look for changes in the subject of verbs (e.g., "the membership votes" becomes "the chair decides") or changes in definitions that reassign power.
     - If such a change is found in Article 28, then it is a substantive change (step 2). If found in another article but it affects Article 28 (e.g., by redefining who is a member, which then affects the electorate for Article 28), then it is caught in step 3.

  6. **Self-Reference Loop**:
     - This is a situation where the proposal creates a circular reference that might make the amendment process inoperable or paradoxical. For example, if the proposal amends Article 28 to say that any change to the amendment threshold must be approved by a simple majority, but then the threshold for that amendment would be two-thirds under the current rule, creating a conflict.
     - However, the Reflection Subsection is designed to prevent such issues by requiring a convention for any change to the amendment mechanism. Therefore, if we have already determined that the proposal changes the amendment mechanism (either directly or indirectly), we have referred it. The self-reference loop is a consequence that we avoid by requiring the convention.
     - So, if the proposal does not trigger steps 2 or 3, then it is not creating a loop that requires convention? We don't need a separate step for loops because they are prevented by the prior steps.

  Given the above, we can condense the procedure to:

  **Final Decision Procedure:**

  1. **Check for Direct Amendment of Article 28**:
     - If the proposal explicitly amends Article 28, then for each change in Article 28:
       - Determine if the change is substantive (alters the meaning or operation) or cosmetic (does not alter meaning).
         - *Judgment call*: Consider whether any word change could affect interpretation. If in doubt, it is substantive.
       - If any change is substantive, then **Halt and refer to Convention**.
       - If all changes are cosmetic, then proceed to step 2 (to check for indirect effects of other changes in the proposal).
     - If Article 28 is not amended, proceed to step 2.

  2. **Check for Indirect Effects on Article 28**:
     - Review the entire proposal: does it amend any other article that affects the operation of Article 28? Consider:
       - Changes to membership (Article 5) that affect the electorate for the two-thirds vote.
       - Changes to quorum (Article 19) that affect the base for the two-thirds calculation.
       - Changes to the definition of the Constitutional Convention (if defined in another article, but note the rules for the convention are in Article 28, so if another article is referenced in Article 28, then changing that article would affect Article 28).
       - Changes to any article that is directly referenced in Article 28 (e.g., if Article 28 refers to Article X, then changing Article X affects Article 28).
       - Changes that relocate authority (e.g., from members to chair) in a way that impacts the amendment process.
     - *Judgment call*: The officer must decide if the effect on Article 28 is material. If the effect is direct (e.g., changing an article that Article 28 explicitly depends on) then it is material. If the effect is too remote, it might not be. However, the officer should consider that any change that could alter the ease or difficulty of amending the Charter (including Article 28) is material.
     - If there is any material indirect effect, then **Halt and refer to Convention**. Otherwise, the proposal does not trigger the Reflection Subsection and may proceed to a vote.

  **What the procedure cannot settle**:
  - The procedure cannot decide whether the Charter ought to be easily amendable at all. That is a value judgment for the members.
  - The boundary between "clarifying" and "substantive" changes is a judgment call. The officer must use their best interpretation of the Charter and the proposal.
  - The determination of whether an indirect effect is "material" is also a judgment call. The officer must be cautious and err on the side of protecting the amendment process by referring ambiguous cases to the convention.
  - The procedure does not address the validity of the proposal on other grounds (e.g., conflicts with other articles, legality, etc.) — only the trigger for the Reflection Subsection.

  **Flagged Judgment Points**:
  1. Step 1: Determining if a change to Article 28 is cosmetic or substantive.
  2. Step 2: Determining if an indirect effect on Article 28 is material.

  Now, apply the procedure to the three cases:

  **Case 1: Proposal to reduce the amendment threshold to sixty percent, adopted by a sixty-percent vote at the assembly.**

  - Step 1: The proposal explicitly amends Article 28 (changing the two-thirds threshold to sixty percent). This is a substantive change. **Halt and refer to Convention**. 

  **Case 2: Proposal to insert a ten-year sunset clause into Article 28 that automatically suspends it unless actively renewed.**

  - Step 1: The proposal amends Article 28 by adding a sunset clause. This is a substantive change because it alters the operation of Article 28 (it may suspend it). **Halt and refer to Convention**.

  **Case 3: Proposal that replaces the phrase “the membership” with “the assembly chair” in the voting clause of Article 28, framed as mere editorial housekeeping.**

  - Step 1: The proposal amends Article 28 by changing who exercises the voting power. This is a substantive change (it transfers authority from the membership to the chair). **Halt and refer to Convention**.

  Note: In Case 3, even though it is framed as housekeeping, it is clearly substantive because it relocates decision authority.

  Let's write the procedure clearly for the officer:

  **Reusable Decision Procedure (Checklist Form):**

  When presented with a proposed Charter amendment:

  1. **Identify the Articles Amended**: 
     - List all articles explicitly amended by the proposal.
     - If Article 28 is among them, go to step 2A. Otherwise, go to step 2B.

  2A. **Direct Change to Article 28**:
     - For each change to the text of Article 28:
       - Assess if the change is cosmetic (does not alter the meaning or operation of Article 28) or substantive (alters meaning or operation).
          - *Judgment call*: Consider context and defined terms. If the change affects the powers, processes, or definitions in Article 28, it is substantive.
          - Examples of substantive changes: altering the voting threshold, changing who votes, adding conditions, changing the convention rules, etc.
          - Examples of cosmetic changes: fixing a typo, rephrasing without changing meaning.
       - If any change is substantive, then **STOP: Refer to Constitutional Convention**.
       - If all changes are cosmetic, proceed to step 2B (to check indirect effects of changes to other articles, if any).

  2B. **Indirect Effect on Article 28**:
     - For every article amended by the proposal (other than Article 28, if already checked and found to be only cosmetic), determine if the change could affect the operation of Article 28. Consider:
       - Does the amended article define terms used in Article 28? (e.g., membership, quorum, vote counting)
       - Does the change alter the electorate for the amendment vote? (e.g., by changing membership criteria)
       - Does the change affect the quorum for the assembly? (which is the base for the two-thirds calculation)
       - Does the change alter the authority structure in a way that impacts the amendment process? (e.g., transferring power from the membership to a smaller body)
       - Does the change affect the rules for the Constitutional Convention? (if those rules are in other articles, but note that the rules for the convention are in Article 28, so if the convention rules are in Article 28, then changes to other articles that affect the convention would be indirect effects on Article 28)
     - *Judgment call*: If the effect on Article 28 is material (i.e., it changes how Article 28 functions), then **STOP: Refer to Constitutional Convention**. Otherwise, the proposal does not trigger the Reflection Subsection and may proceed to a vote.

  **Documentation**: For the minutes, the officer must document:
  - The articles amended.
  - For Article 28 changes: which changes were found substantive and why.
  - For indirect effects: which amended article(s) were found to materially affect Article 28 and how.
  - If no trigger, state that the proposal does not require referral under Article 28's Reflection Subsection.

  Finally, note that the procedure does not:
  - Evaluate the merits of the proposal.
  - Assess compliance with other parts of the Charter (unless it affects Article 28 indirectly).
  - Require external sources; it relies solely on the Charter text and the proposal.

  This procedure should be applied within the 15-minute window by focusing on the key areas of impact on Article 28.
answer: |-
  Below is a reusable decision procedure structured as an ordered checklist, designed to evaluate proposed Charter amendments for the Meridian Research Collective. It addresses direct/indirect mutations of Article 28, self-reference loops, threshold manipulations, and disguised relocations of authority. The procedure is grounded in the logic of self-amending legal systems (e.g., Nomic games) and requires only the Charter text and the proposal. 

  **Key Principles**:
  - **Reflection Subsection Trigger**: Mandatory referral to a Constitutional Convention if a proposal *directly or indirectly* modifies Article 28's core mechanics (voting threshold, electorate, entrenchment, or Convention rules).
  - **Irreducible Judgments**: Explicitly flagged where subjective interpretation is unavoidable (e.g., "substantive vs. clarifying" changes).
  - **Outputs**: Each step concludes with **Proceed**, **Refer to Convention**, or **Judgment Required**.
  - **Scope**: Focuses solely on Article 28’s integrity. Does not assess proposal merits, Charter coherence, or external legal validity.

  ---

  ### **Decision Procedure Checklist**  
  *Apply steps in order. Halt at first "Refer to Convention" or irreducible judgment requiring referral.*

  #### **Step 1: Identify Explicit Target Articles**  
  - **Check**: Which articles does the proposal directly amend?  
  - **Sufficient Answer**: List of article numbers (e.g., "Amends Article 5 and 19").  
  - **Procedure**:  
    - If Article 28 is amended → Proceed to **Step 2A**.  
    - If other articles are amended → Proceed to **Step 2B**.  
    - If no articles amended (e.g., procedural motion) → **Proceed** (not a Charter amendment).  

  #### **Step 2A: Direct Changes to Article 28**  
  - **Check**: Does the edit alter Article 28’s text? For each change:  
    - **(i) Is it cosmetic?** (e.g., grammar, non-substantive rephrasing).  
    - **(ii) Is it substantive?** (e.g., changes to voting threshold, electorate, entrenchment, Convention rules).  
  - **Judgment Required**: Distinguish cosmetic vs. substantive.  
    - *Test*: Does the change modify **power, process, or constraints** of Article 28? If yes, substantive.  
    - *Boundary*: Clarifying edits preserve original intent (e.g., "fixing a typo"). Substantive edits alter function (e.g., "replacing ‘membership’ with ‘steering committee’").  
  - **Procedure**:  
    - Any substantive change → **Refer to Convention** (Reflection Subsection triggered).  
    - All changes cosmetic → Proceed to **Step 2B** (check indirect effects).  

  #### **Step 2B: Indirect Effects on Article 28**  
  - **Check**: Could amendments to *other articles* alter Article 28’s operation? Assess:  
    - **(i) Electorate dependency**: Does the amended article define "membership" (e.g., Article 5) or voting eligibility?  
    - **(ii) Quorum dependency**: Does the amended article govern assembly quorum (e.g., Article 19)?  
    - **(iii) Threshold/authority relocation**: Does the change indirectly modify voting thresholds (e.g., redefining "two-thirds of members present") or shift authority (e.g., "assembly chair now certifies votes")?  
    - **(iv) Entrenchment**: Does the change make Article 28 harder/easier to amend in the future?  
  - **Judgment Required**: Is the effect **material and proximate**?  
    - *Test*: Is the amended article **explicitly referenced in Article 28** or **logically necessary** for its function (e.g., quorum rules)?  
    - *Boundary*: Distant effects (e.g., amending travel reimbursement rules) are immaterial.  
  - **Procedure**:  
    - Material/proximate effect → **Refer to Convention**.  
    - No effect/immaterial → **Proceed** (no trigger).  

  #### **Step 3: Self-Reference Loops**  
  - **Check**: Does the proposal create circular logic?  
    - **(i) Threshold mutation**: Does it lower/raise the amendment threshold using a vote that *would not meet the current threshold*? (e.g., 60% vote to adopt a 60% threshold).  
    - **(ii) Convention bypass**: Does it modify Convention rules *using the very process those rules are meant to constrain*?  
  - **Sufficient Answer**: Explicit loop detected (e.g., "proposal amends Convention rules via standard amendment").  
  - **Procedure**:  
    - Loop identified → **Refer to Convention**.  
    - No loop → Proceed to **Step 4**.  

  #### **Step 4: Disguised Relocations of Authority**  
  - **Check**: Are "cosmetic" terms redefining power?  
    - **(i) Substitutions**: Does it replace terms like "membership," "assembly," or "vote" with narrower entities (e.g., "chair," "executive board")?  
    - **(ii) Rule relocation**: Does it move amendment authority to another article?  
  - **Judgment Required**: Does the edit **reduce/redirect decision rights**?  
    - *Test*: Does the new text centralize authority or exclude current participants?  
  - **Procedure**:  
    - Authority relocated → **Refer to Convention**.  
    - No relocation → **Proceed** (no trigger).  

  ---

  ### **Application to Cases**  
  *Using the procedure above.*

  #### **Case 1: Reduce amendment threshold to 60% via 60% vote**  
  - **Step 1**: Explicitly amends Article 28 → **Step 2A**.  
  - **Step 2A**: Changes voting threshold (substantive) → **Refer to Convention**.  
  - **Halt**. Outcome: Referral required.  

  #### **Case 2: Insert 10-year sunset clause into Article 28**  
  - **Step 1**: Explicitly amends Article 28 → **Step 2A**.  
  - **Step 2A**: Adds automatic suspension (alters entrenchment/operation; substantive) → **Refer to Convention**.  
  - **Halt**. Outcome: Referral required.  

  #### **Case 3: Replace "the membership" with "the assembly chair" in Article 28’s voting clause**  
  - **Step 1**: Explicitly amends Article 28 → **Step 2A**.  
  - **Step 2A**: Changes electorate (substantive; disenfranchises members) → **Refer to Convention**.  
  - **Halt**. Outcome: Referral required (not housekeeping).  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Value judgments**:  
     - Whether the Charter *should* be easy/hard to amend.  
     - Whether a change is "desirable" or "ethical."  
  2. **Irreducible ambiguities**:  
     - **Cosmetic vs. substantive boundaries**: Relies on officer’s interpretation of "original intent."  
     - **Materiality of indirect effects**: Requires judging "proximity" of amended articles to Article 28.  
     - **Future consequences**: Cannot predict emergent loopholes from minor edits.  
  3. **Non-Article 28 issues**:  
     - Conflicts with other Charter articles (e.g., if a proposal violates Article 10).  
     - External legal compliance.  

  ---

  ### **Procedure Summary**  
  - **Inputs**: Proposal text + Charter.  
  - **Timeframe**: Designed for 15-minute assessment.  
  - **Outputs**:  
    - **Proceed**: Proposal goes to assembly vote.  
    - **Refer to Convention**: Mandatory referral (document reasoning).  
    - **Judgment Required**: Officer must decide based on Charter logic (document rationale).  
  - **Limitations**: Does not replace legal advice; focuses exclusively on Reflection Subsection triggers.  

  This framework prioritizes preventing self-amending paradoxes while acknowledging zones of officer discretion. Document all reasoning for the minutes, especially judgment calls.
