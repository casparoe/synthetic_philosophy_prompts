  ### The Orbital Mining Accord: Classroom Activity Design  
  **Core Pedagogical Goal:** Students intuitively grasp how the Kalai-Smorodinsky (KS) solution prioritizes proportional gains anchored to shifting utopia points, violating "equal sacrifice" norms when feasible sets expand asymmetrically. The hidden-information mechanism forces reckoning with monotonicity (if the set expands to favor one party’s utopia, they gain more) versus intuitive equality.  

  ---

  ### **Rules and Setup**  
  **Participants:** 14 students → 7 pairs (North/South delegations). Pairs stay fixed for all rounds.  
  **Disagreement Point:** Fixed at (10, 10) for all rounds. If no agreement, both get 10 points.  
  **Payoffs:** Points are cumulative. Redeemable for privileges (e.g., 1st pick of presentation topics, +1% grade bonus).  
  **Materials per Pair:**  
  - 3 sealed "Resource Pool" envelopes (Round 1: 50, Round 2: 80, Round 3: 100).  
  - 6 "Technology Cards" (3 per role; see below).  
  - Proposal sheets.  

  #### **Technology Cards (Utopia Points)**  
  - **North Cards:** R1: "Max 40", R2: "Max 40" or "Max 60" (random draw), R3: Matches R2 but *if R2 improved*, now "Max 80".  
  - **South Cards:** Mirror North (e.g., if North’s R2 card is "Max 60", South’s R2 is "Max 40"; vice versa for half the pairs).  
  *Key: One side’s utopia increases in R2 (randomly assigned), then the* same *side improves further in R3.*  

  #### **Round Procedure**  
  1. **Reveal Resource Pool:** Facilitator announces the resource total (e.g., "Round 1: 50 units").  
  2. **Private Technology:** Each player receives their sealed technology card *for that round*. They may *not* show it unless verbally disclosed during negotiation.  
  3. **Negotiation (6 mins/round):**  
     - Pairs negotiate splits (𝑥, 𝑦) where:  
       - 𝑥 + 𝑦 ≤ resource pool,  
       - 𝑥 ≤ North’s max (card value), 𝑦 ≤ South’s max.  
     - Proposals must be written on sheets (e.g., "North: 30, South: 20").  
  4. **Outcomes:**  
     - **Agreement:** Payoffs = (𝑥, 𝑦).  
     - **Disagreement:** Payoffs = (10, 10).  
  5. **Post-Round Reveal:** After submissions, facilitator:  
     - Announces which side’s technology improved (if any),  
     - Displays the feasible set graphically (simplified as a triangle: vertices at (𝑑, 𝑢ᴺ), (𝑢ˢ, 𝑑), Pareto frontier).  

  ---

  ### **Timeline (75 mins)**  
  **0–5 mins: Introduction**  
  - Frame scenario: "Earth’s factions negotiate asteroid minerals. Disagree? Both get minimal survival rations (10, 10)."  
  - Explain rules, payoff incentives.  

  **5–25 mins: Round 1 (Resource = 50)**  
  - *All* technology cards: "Max 40" (symmetric utopia: 40, 40).  
  - **Prediction:** Most pairs agree on (25, 25) (symmetric split).  
  - **Post-reveal:** "No tech shifts. Utopia was symmetric (40, 40)."  

  **25–45 mins: Round 2 (Resource = 80)**  
  - **Hidden shift:** 50% of pairs: North’s card = "Max 60", South = "Max 40".  
    Other 50%: South’s card = "Max 60", North = "Max 40".  
  - **Prediction:** Students propose "equal sacrifice" splits (e.g., (40, 40) via equal absolute gains; or 1:1 ratios ignoring utopia shifts).  
  - **Post-reveal:** "One side’s tech improved! Half of Norths now max 60; half of Souths now max 60."  

  **45–65 mins: Round 3 (Resource = 100)**  
  - **Shift:** The side that improved in R2 *now* gets "Max 80". Other side *unchanged* (e.g., North 80, South 40).  
  - **Prediction:** "Equal sacrifice" advocates split new 20 units equally → e.g., (50, 50) *but* South’s cap (40) blocks this. Conflict erupts.  
  - **Post-reveal:** "Tech improved again for the same side!"  

  **65–75 mins: Debrief**  

  ---

  ### **Debrief**  
  **Map Outcomes to Axioms:**  
  1. **Round 1 (Symmetric 50):**  
     - Symmetry + Pareto efficiency → Nash (25, 25) = KS (25, 25).  
     - *Failure expected:* None (symmetric case is intuitive).  

  2. **Round 2 (Asymmetric 80):**  
     - Disagreement anchoring: KS scales gains *proportionally to utopia points* from (10,10).  
       - E.g., North 60/South 40 utopia → gains ratio 50:30 → KS: (10 + 50𝑡, 10 + 30𝑡) = (47.5, 32.5) where 𝑡 solves 50𝑡+30𝑡=60.  
     - Nash solution: (40, 40) — maximizes product (𝑥−10)(𝑦−10) but ignores utopia shift.  
     - *Failure expected:* Students force equal splits (40,40) or equal gains (e.g., 35,45). *Handling:* Ask: "If North *could* take 60, why split equally? Should their ‘hope’ matter?"  

  3. **Round 3 (Extreme Asymmetry 100):**  
     - **Monotonicity in action:** KS requires the twice-improved side (e.g., North) to gain *more* from expansion:  
       - Utopia (80,40) → KS: (66, 34).  
     - **Violates IIA (Nash axiom):** Equal-sacrifice splits (e.g., 50,50 → infeasible; fallback to 60,40) ignore that the *direction* of expansion favors one party.  
     - *Failure expected:* Souths resent "greedy" Norths. *Handling:* "If South’s tech stagnates, should their share grow slower? KS says *yes*; Nash/equality say *no*."  

  **Physical Limitation & Rigor Injection (Final 5 mins):**  
  - "This game uses linear frontiers, but KS requires convex sets. Monotonicity demands: *If the set expands asymmetrically (e.g., 𝑇 ⊃ 𝑆 with higher 𝑢ᴺ but same 𝑢ˢ), KS gives North more in 𝑇 than in 𝑆.* Role-play approximates this via discrete jumps, but mathematically, monotonicity applies continuously: scaling the ray from (10,10) to (𝑢ᴺ, 𝑢ˢ) *must* hit the Pareto frontier. Equal sacrifice violates this when expansion is biased."  
  - **Contrast:** "Nash obeys independence of irrelevant alternatives (IIA) but fails monotonicity. KS obeys monotonicity but fails IIA. Which feels fairer when one side’s potential grows?"  

  ---

  **Why This Works:**  
  - Hidden utopia shifts create "gotcha" moments, forcing emotional engagement with monotonicity.  
  - Equal-sacrifice norms clash with KS proportionality, making the axiom tangible.  
  - Disagreement point anchoring is reinforced by fixed (10,10) penalties.  
  - Final rigor injection covers mathematical essence without proofs.
