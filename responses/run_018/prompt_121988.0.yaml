  **REQUEST FOR PROPOSALS (RFP) H-2024/RC/01**  
  **Issued by the Directorate of Narrative Continuity (DNC)**  
  **Project Title:** *The Road We Were Always On: A Definitive Survey History for Modern Readers*  

  ---

  **1. INTRODUCTION & BACKGROUND**  
  The Directorate of Narrative Continuity (DNC) seeks proposals for a comprehensive, single-volume survey history (target length: 400–500 pages) tracing the origins, development, and inevitable culmination of the contemporary socio-political order. This work will provide citizens, educators, and policymakers with a lucid, accessible, and *actionably coherent* account of our collective journey. The DNC prioritizes narratives that efficiently demonstrate the underlying logic of historical progression, minimizing reader disorientation and maximizing civic resonance. As Director Alistair Thorne notes, "History, properly told, is the map by which society navigates forward; clarity of route is paramount."  

  **2. SCOPE OF WORK**  
  The commissioned work must:  
     *a.* Identify and trace a primary, unbroken "line of causation" (sensu Butterfield) from a pivotal origin point (e.g., Magna Carta, Enlightenment, Industrial Revolution) to the present.  
     *b.* Apply rigorous *Abridgement Protocols* (§ 3.1) to eliminate narrative distractions, focusing exclusively on developments materially contributing to the present condition.  
     *c.* Assign clear evaluative classifications to historical actors and movements: "Pathfinders" (facilitators of progress), "Obstructions" (temporary impediments), and "Sidings" (irrelevant diversions).  
     *d.* Deliver unambiguous "Verdicts of Historical Necessity" on key conflicts, transitions, and innovations.  
     *e.* Utilize *Temporal Harmonization* techniques (§ 3.2) to ensure past actors’ motivations and language resonate with contemporary sensibilities.  

  **3. TECHNICAL INSTRUMENTS & METHODOLOGICAL REQUIREMENTS**  
  Proposals must integrate the following DNC metrics:  
     *   **3.1 Abridgement Dividend (AD):** Calculated as:  
         `AD = (Pages Saved by Deleting Dead Ends / Total Draft Pages Pre-Abridgement) x 100`  
         *Minimum Target:* 30%. Higher dividends reflect narrative efficiency and are scored accordingly (§ 5).  
     *   **3.2 Arrival Coefficient (AC):** Measures the proportion of narrative events demonstrably contributing to the present:  
         `AC = (Events on Certified Causal Pathway / Total Events Analyzed) x 100`  
         *Minimum Target:* 75%. *Optimal:* 90%+. *Note:* Events classified as "Sidings" (§2c) are excluded from the denominator.  
     *   **3.3 Retroactive Adoption Licence (RAL):** Permits the judicious attribution of contemporary virtues (e.g., tolerance, rationality, environmental concern) to selected Pathfinder figures, enhancing reader identification and moral continuity. Proposals must specify criteria for RAL application.  

  **4. DISSENTING OPINION & MITIGATION REQUIREMENTS**  
  The DNC acknowledges methodological critiques. Dr. Elara Vance (Keeper of Discontinued Pasts, Seconded Reviewer) notes:  
  > *"The archive itself is a product of cumulative victory. A selection rule privileging only what 'led somewhere' inherently validates the terminus while obscuring the past’s intrinsic plurality and contingency. Simplicity discovered through abridgement is often an artefact of the abridger’s present, not a property of the past."*  

  Applicants must address this concern by:  
     *   Explicitly justifying their chosen origin point and terminus ("the present") as objectively significant.  
     *   Demonstrating how excluded material ("Sidings," "Obstructions") lacks demonstrable causal linkage to the terminus.  
     *   Utilizing DNC-approved archival triage protocols to filter non-contributory sources.  

  **5. EVALUATION CRITERIA & SCORING RUBRIC (Total: 100 Points)**  
  Proposals will be scored thus:  

  | **Criterion**                         | **Points** | **Evaluation Standard**                                                                 |
  | :------------------------------------ | :--------- | :-------------------------------------------------------------------------------------- |
  | **Narrative Coherence & Line of Causation** | 30         | Clarity, persuasiveness, and continuity of the primary causal pathway (§2a).            |
  | **Arrival Coefficient (AC)**          | 25         | Methodology for achieving AC ≥75%. Points increase for AC >85%.                         |
  | **Abridgement Dividend (AD)**         | 20         | Plan for achieving AD ≥30%. Higher dividends score proportionally higher.               |
  | **Verdicts & Moral Framework**        | 15         | Clarity, consistency, and civic utility of evaluative classifications (§2c,d) & RAL use. |
  | **Addressing Dissent (§4)**           | 10         | Adequacy of response to archival plurality/causality critique.                          |

  **6. SUBMISSION REQUIREMENTS**  
     *   Abstract (300 words) outlining the primary "line of causation."  
     *   Detailed methodology for achieving AC, AD, and applying RAL.  
     *   Sample chapter (20 pp.) applying all protocols to a key transitional period.  
     *   CV demonstrating expertise in synthesizing complex histories.  

  **7. NOTES TO APPLICANTS (FAQ)**  

  > **Q1: Must the "present" terminus be defined rigidly? What if our society is transitional?**  
  > A1: The terminus is defined as the prevailing socio-political consensus at the DNC’s fiscal year-end (31 March 2025). Proposals should treat this as stable and definitive. Historical analysis must culminate here.  
  >  
  > **Q2: How should we treat major historical figures/movements that championed ideas now considered regressive?**  
  > A2: Apply classifications per §2c. "Obstructions" may be acknowledged for pedagogical contrast but must be framed as ultimately overcome. Focus on their role as "foils" (Butterfield) clarifying Pathfinder virtues. *Crucially:* Their intrinsic worldview is irrelevant; significance derives solely from their relationship to the causal pathway.  
  >  
  > **Q3: Doesn't focusing solely on what "led here" ignore valuable lessons from failures or alternatives?**  
  > A3: Lessons are most efficiently derived from understanding the *successful* path. Alternatives ("Sidings") hold no causal relevance to the present terminus and are excluded per Abridgement Protocols (§3.1). Their inclusion risks narrative incoherence.  
  >  
  > **Q4: Is there room for contingency or accident within the causal pathway?**  
  > A4: While minor contingencies may be acknowledged as procedural details, the *overall directionality* must be presented as logically necessary. The narrative should reveal the underlying rationality of outcomes, not undermine it.  
  >  
  > **Q5: What about regions/peoples whose history doesn't directly feed into the defined terminus?**  
  > A5: Material may be incorporated only if demonstrating: a) clear causal influence on the defined pathway, or b) a cautionary contrast reinforcing the necessity of the Pathway's development. Otherwise, apply §2c ("Sidings").  

  **8. APPENDIX: COMPLIANCE FOR ALTERNATIVE NARRATIVE TYPES**  
  Applicants proposing ostensibly "critical" frameworks (e.g., Declinism, Debunking) must demonstrate compliance:  
     *   **Declinist Narratives:** Must identify a *single, superior past state* and trace its *inevitable corruption* to the present. They require equivalent AC/AD metrics tracing the "line of causation" *away* from virtue. Verdicts condemn the present terminus equally absolutely.  
     *   **Debunking Narratives:** Must culminate in the *author's present revelation* as the necessary endpoint of exposing past falsehoods. The debunker functions as the ultimate "Pathfinder." AC measures events leading to the exposure(s), AD measures excision of "accepted myths."  
     *Both remain teleological and verdict-driven, hence fundable under adjusted metrics, provided they deliver definitive coherence.*  

  ---  
  **Issuing Officer:** *Sir Alistair Thorne, Director, Directorate of Narrative Continuity*  
  **RFP Closes:** 30 September 2024. Submit via DNC Portal H-Portal-24. Queries: narrative.continuity@dnc.gov.uk
