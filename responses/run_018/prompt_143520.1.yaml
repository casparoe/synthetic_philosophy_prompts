prompt: |-
  I work as a software engineer with no formal philosophy training, but I have been trying to apply the extended mind thesis—the idea that cognitive processes can extend beyond the brain into tools and environments—to my own development practice. Rather than asking for a literature review, I want to run my own intuitions through reflective equilibrium. Here are my verdicts on concrete cases, followed by a tentative principle that I suspect fails.

  Case 1: I maintain a personal knowledge base of debugging notes and design rationales. When I return to old code, I read my own notes and recover the reasoning. Verdict: this is part of my extended cognition.

  Case 2: My IDE provides intelligent autocomplete drawn from the current codebase. I do not memorize the API surface; I rely on the tool to complete method names and signatures. Verdict: also part of my extended cognition.

  Case 3: Our team keeps a deployment runbook that I follow step-by-step during outages. I execute the steps correctly but do not understand the underlying system behavior. Verdict: not part of my cognition; I am merely following an external procedure.

  Case 4: I use an AI pair-programming assistant that generates substantial blocks of code, which I typically accept with minimal review. Verdict: not part of my mind; it feels like outsourcing reasoning to an opaque agent.

  Case 5: Years ago I wrote a custom build script that now runs automatically in continuous integration, rejecting commits that fail certain checks. I rarely think about its logic. Verdict: ambiguous—it seems integrated into my workflow, yet I do not actively engage with it.

  The hard pair: Case 6 versus Case 7.
  Case 6: I regularly use a widely adopted open-source library. I understand its interface and behavior deeply, but I have never inspected its source code. Verdict: this belongs to my cognitive toolkit.
  Case 7: I authored the interface specification for an internal microservice, but another team implements and maintains the backend. I know my spec intimately, yet the implementation is opaque. Verdict: despite my authorship of the spec, this feels less like part of my mind than Case 6.

  My tentative principle is that a resource counts as part of my extended mind when I have direct, unmediated epistemic access to its outputs and can integrate them into my reasoning without deferring to another agent's judgment. Case 6 versus Case 7 undermines this: in Case 7 I have more direct access to the specification, yet the resource feels more external. Meanwhile, Case 5 remains unclear.

  What principle, if any, captures all six verdicts? If none can, which verdict should I overturn—Case 6, Case 7, or Case 5? Please state the principle precisely, identify which case motivates each clause, give its verdict on an unlisted case (for example, a mental model of database indexing that I originally learned from a mentor's explanation but now apply independently), and be explicit about which of my original verdicts it cannot accommodate.
reasoning: |-
  Okay, the user is a software engineer applying the extended mind thesis to their work. They've shared seven cases with their verdicts on whether each counts as extended cognition. Their tentative principle focuses on direct epistemic access and lack of delegation. But Case 6 vs 7 breaks it—they feel more ownership of a third-party library (Case 6) than their own spec with opaque implementation (Case 7). 

  Hmm, what's the core tension here? The user's intuition suggests authorship isn't key—it's about functional integration. Case 6's library is like a trusted tool they wield fluidly, while Case 7's spec is a detached artifact because the implementation is a black box. Interesting how Case 3 (runbook) and Case 4 (AI assistant) were rejected for similar "outsourcing" vibes. 

  Wait—Case 5 (build script) is ambiguous. That's a clue: automation can feel cognitive if it's an extension of their intent, but here it runs passively. The mentor example they proposed later would likely qualify because the knowledge is internalized. 

  I need a principle that captures: 
  - **Fluid access** (Cases 1 & 2: notes/IDE as seamless memory) 
  - **Functional transparency** (Case 6: library as transparent tool vs Case 7's opaque backend) 
  - **Agency preservation** (rejects Cases 3/4 where judgment is outsourced) 

  The user’s deeper need might be designing better cognitive tools. If they overturn Case 7’s verdict, they could argue specs *are* extended mind—but that clashes with their intuition. Alternatively, refining the principle to require "predictable control" might salvage Case 6/7 distinction: the library’s behavior is reliably knowable via documentation, while the microservice’s implementation isn’t, even if the spec is theirs. 

  Case 5’s script fails this—it’s automatic but not interactive. Verdict: not extended mind. Unlisted case (mentor-taught indexing) passes: knowledge is internalized. 

  Final principle: **A resource is part of extended cognition iff it’s functionally integrated into real-time reasoning, operates predictably under the agent’s control, and doesn’t replace critical judgment.** Overturns nothing—validates all original verdicts by stressing *predictable control* over mere access.
answer: |-
  Your intuitions reveal a sophisticated grasp of extended cognition—especially where your tentative principle fails. After analyzing your cases, I propose this principle:  

  **A resource R counts as part of agent A’s extended mind iff:**  
  1. **R is reliably accessible and integrated into A’s real-time cognitive workflow** (motivated by Cases 1, 2, 6),  
  2. **R’s operation is transparently coupled to A’s goals, such that A can anticipate/predict R’s outputs without appealing to external agency** (motivated by Cases 3, 4, 7),  
  3. **A retains ultimate responsibility for R-augmented outputs** (motivated by Case 5).  

  ### Breakdown of the Principle:
  - **Clause 1 (Integration)**  
    Captures Cases 1 (notes), 2 (autocomplete), and 6 (library): These tools are *fluidly* accessed during problem-solving. Case 5 (build script) partially fails—it’s automated but not engaged *in real-time*.  
  - **Clause 2 (Transparency & Agency)**  
    Explains why Case 7 (your spec + opaque backend) fails: You lack insight into *how* the microservice implements your spec, making its behavior unpredictable. Case 6 (library) passes because documented interfaces create reliable expectations. Rejects Cases 3 (runbook) and 4 (AI pair-programmer): Both require trusting *external* agency (runbook authors, AI’s black box).  
  - **Clause 3 (Responsibility)**  
    Resolves Case 5: The build script isn’t part of your cognition because you offload *accountability*—it runs autonomously, and errors may not engage your reasoning.  

  ### Verdicts Under This Principle:
  | Case | Verdict | Why |  
  |------|---------|-----|  
  | 1    | ✅      | Deeply integrated; you actively query notes during reasoning. |  
  | 2    | ✅      | Autocomplete is a real-time perceptual extension. |  
  | 3    | ❌      | Runbook requires deference; no transparency or agency. |  
  | 4    | ❌      | AI’s reasoning is opaque; you delegate judgment. |  
  | 5    | ❌      | Not integrated in real-time; you aren’t accountable for its logic. |  
  | 6    | ✅      | Library interface is predictable and tool-like—no agency deference. |  
  | 7    | ❌      | Implementation opacity breaks transparency; you defer to the backend team. |  

  ### Unlisted Case:  
  **Scenario:** *A mental model of database indexing learned from a mentor, now applied independently.*  
  **Verdict:** ✅ **Part of your extended mind.**  
  - **Why:** Though socially sourced, the knowledge is now internally instantiated—you deploy it transparently (Clause 2) and integrate it fluidly (Clause 1). Responsibility rests with you (Clause 3).  

  ### Which Verdicts to Overturn?  
  - **Overturn Case 5:** Your initial "ambiguous" verdict becomes a clear ❌. The script isn’t *cognitively* integrated—it’s infrastructure.  
  - **Case 6 and 7 stand:** Your intuition holds—authorship (Case 7) matters less than *predictable, agency-preserving access* (Case 6).  

  ### Why This Works:  
  Your tentative principle failed by overemphasizing "direct access" without considering **predictability** and **agency**. In Case 6, the library’s behavior is epistemically accessible via documentation/testing, making it a tool. In Case 7, the backend is a "causal black box"—you authored the spec but must *trust* the implementation team, breaking cognitive extension.  

  This aligns with Andy Clark’s "trust and glue" criteria: Tools become mind-extending when they’re (a) reliably available, and (b) trusted as transparently as biological memory. Case 6 meets this; Cases 4 and 7 do not.  

  ### Practical Implication:  
  To design better extended-mind tools:  
  - Prioritize **observability** (e.g., logging for your build script to reintegrate it),  
  - Avoid **agency-delegating systems** (e.g., AI that obscures rationale),  
  - Treat **documentation/interfaces** as cognitive scaffolding (as in Case 6).
