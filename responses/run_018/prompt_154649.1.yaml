  Here's your exam prompt set:

  1.  **Prompt:** Imagine a law is simultaneously passed *and* repealed, creating a true contradiction (P & ~P). Does dialetheism genuinely prevent this contradiction from implying *trivialism* (that everything is true), and how might a concept like *normative dialetheia* (true contradictions specifically within rules/norms) help or complicate this?
  2.  **Model Answer:** Dialetheism with paraconsistent logic *does* block explosion to trivialism from P & ~P alone, isolating the contradiction. However, if this legal contradiction exemplifies a *normative dialetheia* – a true conflict within the rule-system itself – it risks making the system's outputs fundamentally unstable or arbitrary for *future* cases, potentially leading to a *practical* kind of trivialism where any legal outcome can be "justified".
  3.  **Marking Scheme (Focus):** Award points for correctly explaining dialetheism/paraconsistency blocking logical explosion *and* analyzing the unique threat posed by a *normative* dialetheia to systemic coherence (not just truth).
  4.  **Marking Scheme (Depth):** Give credit for recognizing that dialetheism handles the isolated contradiction but may struggle with the cascading instability a normative dialetheia introduces to rule-based application (e.g., "Since both passing and repealing are true, enforcing *either* seems arbitrary").
