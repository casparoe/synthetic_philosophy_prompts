  ### Key Takeaways  
  - **Where the procedure gives up**: Ties in tax (letter case), ambiguity in visibility scores (e.g., "ally" in hiding alliance), or contradictions needing gut judgment.  
  - **What it can’t settle**: Emotional resonance (e.g., prison’s trauma may feel cheap vs. grief’s depth). NCT quantifies coherence, not thematic weight.  
  - **Run it**: Assign visibility scores fast (0–3) based on future role; tally loose ends; compare taxes. Reject if tax spikes or contradictions loom. Gut decides ties.
