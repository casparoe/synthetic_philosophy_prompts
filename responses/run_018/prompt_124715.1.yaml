  **Bottom line: For the letter, the procedure rejects hiding an alliance (tax=9) but ties shame and protecting the recipient (both tax=6), requiring your gut; for the vanishing, it rejects grief flight (tax=15) and picks prison (tax=10) over secret identity (tax=12), though you may dislike prison if trauma feels overused.**

  ### Procedure Checklist (Run per Explanation Option)
  1. **What's the simplest causal chain?**  
     - *Stop if overly convoluted without payoff.*  
     - *Gut check: If chains feel equally simple, proceed.*  

  2. **Does it contradict established facts?**  
     - *Kill it if unfixable without retconning.*  
     - *Gut check: If contradiction is ambiguous (e.g., vague character history), proceed but flag.*  

  3. **List emotional loose ends in other characters:**  
     - Identify all characters left with unresolved feelings (e.g., betrayal, confusion).  
     - *Kill it if loose ends exceed 3+ per major character or feel implausible.*  

  4. **Apply narrative coherence tax (NCT):**  
     - For each loose end, assign character visibility (0=gone, 1=mentioned, 2=minor role, 3=major role).  
     - **Tax = Σ (Number of loose ends for character × Visibility score)**.  
     - *Gut check: If visibility is debatable (e.g., "might return"), estimate conservatively.*  

  5. **Compare taxes across options:**  
     - Lowest tax wins. If taxes within 10% or tie, go to step 6.  
     - *Kill it if tax >20% higher than leading option.*  

  6. **Artistic gut decides:**  
     - Use when taxes close, simplicity equal, or emotional weight trumps rules.  

