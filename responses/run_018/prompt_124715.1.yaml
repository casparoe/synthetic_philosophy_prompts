          - The protagonist: if they were close, then affected. Visibility 3 -> tax component: 1 * 3 = 3
          - The framer (if any): if a known character, visibility? Let's assume not a known character at the time of disappearance, so we won't count? Or if we introduce one, then we have to account for that character's visibility. But we are trying to avoid introducing new characters? The tax is for loose ends in existing characters. So only existing characters. The framer might be a new character, so we don't count until they are introduced? Therefore, we only count existing characters.
     - So total tax: 
