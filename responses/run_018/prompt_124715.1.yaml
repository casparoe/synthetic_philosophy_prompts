prompt: |-
  I'm a novelist writing a multivolume series where each book retroactively explains one weird choice from earlier volumes. I need a reusable decision procedre—checklist style, with clear stop points—based on inference to the best explanation but with a niche twist I'm calling the narrative coherence tax: multiply the number of emotional loose ends a backstory leaves in other characters by how visible those characters remain later in the story. For each draft explanantion, I want the ordered questions, what counts as enough to kill it, where the call is pure values and not rules, and where the procedre just gives up and says "this needs your artistic gut." Apply it to two plot holes: why the protagonist burned a letter (options are shame, protecting the recipient, or hiding an alliance) and why a side character vanished for ten years (prison, secret identity, or grief flight). Include at least one case where the procedre picks an option you'll think I won't like, and flag exactly what the procedre can't settle. Give me the bottom line in sentence one, then reasoning—no preamble, don't echo my question back. No citations or reading lists; I just need something I can run in twenty minutes without searching. Sorry if there's a typo or two in this.
reasoning: |-
  We are given two plot holes to resolve using a procedure that incorporates a "narrative coherence tax" (NCT). The tax multiplies the number of emotional loose ends a backstory leaves in other characters by how visible those characters remain later in the story.

  The procedure is a checklist with clear stop points. We consider each option for the plot hole and run through the following questions:

  1. **What is the simplest causal chain?** (Prefer simpler when all else equal.)
  2. **Does it contradict established facts?** (If yes, reject unless contradiction can be resolved without violating prior text.)
  3. **What emotional loose ends does it create?** (List them and the affected characters.)
  4. **Apply NCT:** For each loose end, note (a) how many other characters are emotionally affected and (b) the visibility of each affected character in later parts of the story (on a scale of 0 to 3, where 0 = never seen again, 3 = major recurring). Multiply (a) by the sum of the visibility scores for each affected character. This product is the "tax" for that loose end. Then, the total tax for the explanation is the sum of the taxes for all loose ends it creates.
  5. **Compare taxes:** The option with the lowest tax is preferred. If two are close (within 10% of the lowest), then we move to step 6. If one is clearly the lowest, we choose it.
  6. **Artistic gut check:** If the taxes are close, or if the procedure cannot decide because of a tie or ambiguity, we flag that the decision requires the author's intuition.

  We also note that at step 2, if an option is rejected, we stop considering it.

  Now, apply the procedure to the two plot holes.

  ### Plot Hole 1: Why the protagonist burned a letter?
  Options: shame, protecting the recipient, hiding an alliance.

  #### Option A: Shame
  1. **Simplest causal chain?** Yes, very simple: protagonist reads letter, feels ashamed of contents, burns it.
  2. **Contradict established facts?** None apparent.
  3. **Emotional loose ends?** 
     - The protagonist might feel lingering shame. (Affects: protagonist) 
     - The recipient, if they ever found out, might feel betrayed or hurt. (Affects: recipient) 
     - Note: if the recipient never finds out, then only the protagonist is affected.
  4. **NCT Calculation:**
     - Loose end 1 (protagonist's shame): 
          - Affected character: protagonist -> visibility: 3 (protagonist is always present)
          - Tax for this loose end: 1 (number of characters) * 3 (visibility) = 3
     - Loose end 2 (recipient's potential hurt): 
          - Affected character: recipient. If the recipient is a major character, visibility might be high. Let's assume the recipient is a major character (visibility 3). But note: if the recipient never learns about the letter, then this loose end might not exist. However, the possibility remains and might be a dangling thread. We must account for the possibility. 
          - Tax: 1 * 3 = 3
     - Total tax = 3 + 3 = 6

  #### Option B: Protecting the recipient
  1. **Simplest causal chain?** Reasonably simple: protagonist burns letter to prevent it from falling into the wrong hands and harming the recipient.
  2. **Contradict established facts?** None.
  3. **Emotional loose ends?**
