  Looking at their cases: They accept distributed self in shared memory after death (Case 1) and in brain-bridge scenarios (Case 4), but reject it in server copies (Case 5). They see unity in split-brain patients (Case 2) and identity continuity in amnesia (Case 3). The tension is palpable - why is shared substrate acceptable in some cases but not others?

  I notice they're particularly invested in the idea of recursive integration - how patterns loop back on themselves to create selfhood. That's key here. The common thread might be whether the self-pattern maintains a single, integrated feedback loop across its components. 

