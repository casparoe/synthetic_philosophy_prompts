answer: |-
  ## Villanelle of Unresolved Doubt

  Each line I write with steady hand believes,
  Checked twice for flaws the ink might trace or smudge.
  **Somewhere in these pages a falsehood lives.**

  This stack of tickets, hope it rarely gives,
  I hold this one against the coming judge:
  **This ticket will not win**, my thought retrieves.

  I read each sentence, logic it conceives
  Seems sound; no shaky fact will let me budge.
  **Somewhere in these pages a falsehood lives.**

  I scan the numbers, see what chance achieves
  For others; mine feels safe, beyond the nudge:
  **This ticket will not win**, my thought retrieves.

  I trust each word, the weaving it receives,
  A perfect truth laid down without a grudge.
  **Somewhere in these pages a falsehood lives.**

  I stack each chance, the certainty it weaves
  Around each loss, a comfortable trudge:
  **This ticket will not win**, my thought retrieves.

  Yet knowing slips between the words and leaves,
  Between the tickets stacked along the ledge:
  **Somewhere in these pages a falsehood lives,**
  **This ticket will not win**, my thought retrieves.

  ---

  **Structure & Logic:**
  *   **Refrain 1 (Preface Paradox):** "Somewhere in these pages a falsehood lives" – Acknowledges the author's rational belief that *some* error exists in the book, despite confidence in each individual sentence.
  *   **Refrain 2 (Lottery Paradox):** "This ticket will not win, my thought retrieves" – Expresses the belief about a *specific* ticket losing, held for each individual ticket.
  *   **Alternating Tercets:** The refrains alternate (Preface, Lottery, Preface, Lottery) mirroring the separate, seemingly reasonable convictions held for each element (sentence/ticket).
  *   **Final Couplet:** The refrains stand together, unreconciled ("Somewhere... lives," / "This ticket... retrieves"). This directly enacts the collective contradiction: holding both sets of beliefs simultaneously creates an inconsistency (the book *must* contain truth *if* every sentence is true, contradicting the preface; believing *every* ticket loses contradicts knowing one wins).
  *   **Plain Language:** Uses simple words ("steady hand," "checked twice," "stack," "safe," "trust," "knowing slips") accessible to a non-specialist, while accurately reflecting the core tension of each paradox.
  *   **Accurate Paradox Reflection:** The villanelle's repetitive structure builds the individual convictions ("Each line I write...", "I hold this one...", "I trust each word...", "I stack each chance..."), culminating in the final, jarring juxtaposition of the two incompatible collective beliefs. The tension remains open and unresolved.
