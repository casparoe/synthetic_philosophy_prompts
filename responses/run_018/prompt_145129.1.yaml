  Okay, the user wants me to draft a joint statement between Subjectionists and Stakeholderists regarding democratic boundary-drawing for a Transboundary Aquifer Authority. Let me start by understanding both positions clearly. The Subjectionist believes that only those directly coerced by binding decisions should be part of the demos. The Stakeholderist, however, includes anyone whose fundamental interests are affected by the decisions, even if not directly coerced.

  The user specified a concrete case: an authority managing water across three states, affecting citizens, non-citizen laborers, downstream communities, and future generations. The response needs three parts: agreed claims, a disagreements table, and cruxes. I need to ensure that the agreed claims section is neutral and acceptable to both sides without bias.

  First, for the agreed claims, I should outline points on democratic legitimacy, the coercion vs. affectedness distinction, the authority's design, and descriptive facts. Both sides agree that legitimacy requires justifying boundaries, and that coercion and affectedness are distinct concepts. The institutional details must be presented factually, like the enforcement mechanisms and impacts on different groups. Including future generations as descriptively affected but differing on their inclusion is key here.

  Next, the disagreements table. Each row needs precise formulations from each camp. Key issues: whether economic impacts count as coercion, if future persons can be affected, and if the boundary must yield a determinable list. For example, Subjectionists would say economic harm isn't coercion unless backed by force, while Stakeholderists see it as affecting fundamental interests. Future generations: Subjectionists might argue they can't be coerced now, while Stakeholderists emphasize their interests. The determinable list point involves practical feasibility versus moral necessity.

  Then, the cruxes. These are sub-questions where resolving them could change a side's view. Each crux needs a concrete feature of the Authority case and both sides' predictions. For instance, examining if non-citizen laborers have legal standing. Subjectionists might say lack of standing shows they’re not subject to coercion, while Stakeholderists argue standing is irrelevant to affectedness. Another crux is the weighting of future scarcity in the algorithm. Subjectionists might see it as a policy choice, not membership, while Stakeholderists view it as representing future interests.

  I need to ensure no citations or named theories. Use the Authority's features as agreed-upon facts. Check that each part meets the user's requirements: neutrality in agreed claims, precise disagreements, and focused cruxes with predictive judgments. Also, avoid any slant in the agreed section so both parties genuinely endorse it. Make sure the disagreements are phrased exactly as each camp would, without strawman arguments. Finally, structure everything clearly in the three parts as specified.
answer: |-
  ## Joint Statement: Subjectionist-Stakeholderist Adversarial Collaboration on the Transboundary Aquifer Authority

  **Preamble:** Subjectionists and Stakeholderists engaged in good-faith dialogue concerning the appropriate democratic boundary ("demos") for the Transboundary Aquifer Authority (TAA). We jointly affirm the necessity of legitimate democratic boundaries for such binding institutions. While our foundational principles differ – Subjectionism centering *direct coercive subjection* and Stakeholderism centering *fundamental interest affectedness* – we identified significant areas of descriptive agreement and clarified the precise nature of our remaining disagreements and the key questions ("cruxes") whose resolution could advance the debate, using the TAA as our shared case study.

  ### Part I: Agreed Claims

  1.  **Democratic Legitimacy Requirement:** For the TAA's exercise of binding authority to be democratically legitimate, the determination of who constitutes its membership ("demos") requires a publicly justifiable principle. The exclusion of any group significantly impacted by its decisions demands justification.
  2.  **Distinct Concepts:** "Direct coercive subjection" and "fundamental interest affectedness" are conceptually distinct criteria for demos membership.
      *   *Direct Coercive Subjection:* Involves the imposition of enforceable rules backed by the threat or use of state-sanctioned force (e.g., fines, seizure, legal penalties) for non-compliance, directly restricting individual liberty or property.
      *   *Fundamental Interest Affectedness:* Involves the causal, foreseeable, and significant alteration of conditions essential to an individual's or group's core well-being (e.g., livelihood, health, security, basic sustenance, ecological stability), regardless of direct legal compulsion.
  3.  **TAA Institutional Design & Powers (Descriptive Facts):**
      *   The TAA has legal authority to set binding water extraction quotas and usage rules for the transboundary aquifer.
      *   These rules are enforceable within the sovereign territory of the three member states against their own citizens and resident entities via domestic legal systems (courts, regulatory agencies), employing fines, injunctions, and potentially criminal penalties for violations.
      *   TAA decisions have significant, foreseeable causal effects beyond those subject to direct enforcement:
          *   Economic welfare of non-citizen agricultural laborers working within the aquifer basin (dependent on water availability for employment/livelihood).
          *   Ecological conditions (water flow, quality, habitat) for downstream communities in sovereign states *not* members of the TAA.
          *   Long-term water availability and quality, constraining the resource options and ecological security of generations not yet born.
  4.  **Application to TAA Groups (Descriptive Facts):**
      *   *Subject to Direct Coercion:* Citizens and resident entities (e.g., farms, businesses) within the three member states are directly subject to TAA-enforced rules.
      *   *Fundamental Interests Causally Affected:*
          *   Non-citizen agricultural laborers within the basin (economic welfare, livelihood).
          *   Downstream communities in non-member states (ecological conditions, water access).
          *   Future generations (resource security, ecological stability). (*Note: Agreement on descriptive fact, not on normative relevance for membership*).
          *   Citizens of member states (also subject to coercion) are *additionally* affected in their fundamental interests (e.g., economic welfare, health).

  ### Part II: Disagreements Table

  | **Disagreement Topic** | **Column A: Subjectionist Formulation** | **Column B: Stakeholderist Formulation** |
  | :----------------------------- | :-------------------------------------- | :--------------------------------------- |
  | **Extraterritorial Economic Impact as Coercion?** | Extraterritorial economic harm resulting from TAA decisions, such as job loss for non-citizen laborers due to reduced water quotas, is an indirect consequence of policy application within member states; it does not constitute the direct imposition of enforceable rules backed by state force *upon those specific non-citizens* and therefore does not meet the criterion of coercive subjection relevant for demos membership. | Extraterritorial economic harm resulting from TAA decisions, such as job loss for non-citizen laborers due to reduced water quotas, foreseeably and significantly impacts their fundamental interests in livelihood and subsistence; this impact constitutes a form of governance effect sufficient for inclusion in the demos, regardless of whether the enforcement mechanism directly targets them or operates via member state jurisdictions. |
  | **Future Persons: Affected & Inclusion-Relevant?** | Future persons cannot be subject to direct coercion by present decisions, as coercion requires a present agent capable of experiencing the imposition. While present decisions may shape future conditions, this does not constitute subjection to the Authority's *coercive authority* at the time of the decision. Including them as voting members is therefore conceptually incoherent and practically impossible. | Future persons have fundamental interests (e.g., in resource security, a stable environment) that are causally and foreseeably shaped in profound ways by present TAA decisions. Democratic legitimacy requires that these affected interests be represented within the decision-making process, necessitating institutional mechanisms for their inclusion or representation in the demos, even if they cannot be direct voters. |
  | **Determinable Membership Requirement** | A defensible principle for demos membership must yield a practically identifiable and stable (or determinable-at-decision-time) list of members for every binding decision made by the Authority. Subjection to direct coercive rules provides such a clear and administrable criterion. | While practical identifiability is desirable, it is secondary to the moral imperative of including all whose fundamental interests are causally and foreseeably affected. A demos boundary principle based on fundamental interest affectedness may necessitate complex representation mechanisms for dispersed or future groups, but this complexity does not invalidate the core principle; legitimacy demands finding ways to approximate inclusion of the foreseeably affected. |

  ### Part III: Cruxes

  The following sub-questions represent key points of underlying disagreement. Resolving any of these would require at least one side to revise a core claim or significantly adjust its practical implications regarding the TAA demos. For each crux, we identify a concrete feature of the TAA case relevant to it and each side's predictive judgment about what that feature demonstrates.

  1.  **Crux: Does the imposition of binding rules that *indirectly* cause severe economic destitution (e.g., livelihood loss) constitute a distinct form of "coercion" relevant to democratic inclusion, even absent direct legal enforcement targeting the affected individual?**
      *   **Feature:** Whether non-citizen laborers within the basin possess formal legal standing to challenge TAA rulings in the courts of the member states where they work or in an international tribunal, specifically regarding the impact of quotas on their employment and welfare.
      *   **Subjectionist Prediction:** If these laborers lack such standing, it demonstrates they are not *subject to* the TAA's enforceable rules in the relevant direct sense; the economic harm remains an indirect consequence, not direct coercion. If they possess standing, it might indicate a stronger claim to being subject to the Authority's *juridical* power.
      *   **Stakeholderist Prediction:** The presence or absence of legal standing is largely irrelevant to the core question of fundamental interest affectedness. Lack of standing highlights an existing democratic deficit and exclusion, regardless of its existence. Possession of standing might be one institutional *response* to affectedness but doesn't define its existence.

  2.  **Crux: Can the interests of future persons be considered "causally affected" in a sufficiently concrete and decision-relevant way by present decisions to warrant representation in the demos, overcoming the objections of temporal disconnection and non-identity?**
      *   **Feature:** Whether the TAA's official water allocation algorithm incorporates specific, weighted projections of water scarcity and ecological impact for the year 2100 (or similar distant horizon) as a binding constraint on present allocations.
      *   **Subjectionist Prediction:** The inclusion of such projections, even if binding, reflects a policy choice *by the present demos* about intergenerational responsibility. It does not demonstrate that future persons are "affected" in a way that makes them present subjects or members; it shows the present demos considering future consequences.
      *   **Stakeholderist Prediction:** The formal, binding incorporation of long-term projections (e.g., for 2100) explicitly acknowledges that present decisions causally determine fundamental conditions for future persons. This institutionalizes the recognition that future interests are foreseeably and significantly affected in a decision-relevant way, strengthening the argument for their formal representation within the demos structure.

  3.  **Crux: Is the practical requirement for a determinable membership list for each decision a necessary condition for a viable demos boundary principle, or is it a secondary challenge that must be addressed institutionally once the normative principle (affectedness) is accepted?**
      *   **Feature:** The existence and nature of the TAA's current process for consulting downstream non-member states regarding potential ecological impacts before finalizing allocation decisions.
      *   **Subjectionist Prediction:** If consultation exists but is ad hoc, non-binding, and doesn't grant formal decision-making power or membership, it demonstrates the practical difficulty of determinably including geographically dispersed affected groups within a *membership* list for each vote. It highlights the stability and clarity offered by the subjection criterion.
      *   **Stakeholderist Prediction:** The very existence of a consultation process, even if imperfect, acknowledges the affectedness of downstream communities and the legitimacy deficit created by their exclusion. It demonstrates that institutional mechanisms *can* be created to engage affected non-members, pointing towards the feasibility of developing more formal representation structures as required by the affectedness principle, rather than proving its impracticality.

  **Conclusion:** This collaboration clarified that our disagreement stems not primarily from the descriptive facts of the TAA case, but from deeper normative commitments regarding the core source of democratic legitimacy (coercion vs. affectedness) and the weight given to practical administrative constraints versus the imperative to represent all foreseeably impacted fundamental interests. We agree that the TAA presents a significant challenge for democratic boundary-drawing. Progress hinges on resolving the identified cruxes concerning the nature of coercion, the status of future interests, and the necessity of determinable membership. We commit to further examining these cruxes in light of concrete institutional features like those described.
