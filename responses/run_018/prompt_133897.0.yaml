answer: |-
  Your intuitions are sharp and the tension you're feeling points to a genuine philosophical puzzle. I think you're circling **two distinct axes of social construction**, not one monolithic concept. Here's a principle (or small family) that reconciles your verdicts without requiring you to abandon most of them:

  ### The Two Axes Sorting Principle
  1.  **Axis 1: Ontological Dependence on Collective Recognition (Belief/Practice)**  
      *   *High Dependence:* The kind *ceases to exist* if collective recognition/agreement/practice ceases. Its existence *is* the shared belief or practice.
      *   *Low/No Dependence:* The kind exists independently of collective recognition, though recognition may *label*, *shape*, or *respond* to it.
  2.  **Axis 2: Structural Embeddedness / Causal Looping Power**  
      *   *High Embeddedness/Looping:* The kind, once established, generates powerful *feedback loops* that reshape institutions, behaviors, bodies, environments, and even perception over time. It becomes "baked in" to the social and material world.
      *   *Low Embeddedness/Looping:* The kind has limited power to reshape the world beyond its immediate functional context. Changes are more reversible.

  ### Applying the Axes to Your Cases

  | Case                     | Ontological Dependence | Structural Embeddedness | Classification          | Reasoning                                                                 |
  | :----------------------- | :--------------------- | :---------------------- | :---------------------- | :------------------------------------------------------------------------ |
  | **Bitcoin/Cowrie Shells** | **High**               | **Low-Medium**          | Full Social Kind        | Requires ongoing acceptance to *be* money. Value collapses without belief. Looping exists (people act based on value) but doesn't deeply reshape identities or environments like race/gender. |
  | **US Blackness**         | **Medium-High**        | **Very High**           | Full Social Kind + Structure | Category is defined by specific social/legal rules (one-drop). *However*, centuries of application created massive structural embedding (laws, wealth gaps, health disparities, geography, culture). These structures persist *even if* formal recognition changed tomorrow. |
  | **UK "Black British"**   | **Medium-High**        | **Medium** (growing?)   | Full Social Kind        | Category defined by census/practice. Structural embedding exists but is less historically deep/wide than US Blackness. Shows how the *same* label can have different embeddedness based on history/context. |
  | **"Woman" (1950s US/Japan)** | **Medium**             | **Very High**           | Universal Kind w/ Local Expression | Category tracks biological sex + social roles *but* roles/expectations are deeply embedded, creating powerful looping effects shaping lives, bodies, institutions. Universality stems from tracking sex + pervasive gendering. |
  | **Hijra/Two-Spirit**     | **High**               | **High** (within context) | Full Social Kind        | Exist *because* of specific cultural recognition/roles. Deeply embedded in specific social/religious structures. **Not** local versions of "non-binary" because they don't derive meaning from opposition to a Western gender binary; they are unique kinds constituted by their own recognition systems. |
  | **Refugee (1951 Conv.)** | **Low**                | **Medium**              | Bureaucratic Status     | Forced displacement exists independently. The *label* is a bureaucratic status granting specific rights. Status depends on recognition, but the *condition* does not. Looping exists (access to services) but is tied to the status, not the core condition. |
  | **Credit Score**         | **High**               | **Medium (Temporal)**   | Looping Metric          | The *category* "high-risk borrower" *only* exists due to the measurement system. Creates strong but relatively narrow looping: changes behavior/access. "Thinness" comes from limited scope (financial risk) and potential for rapid change. |

  ### Resolving Your Core Tensions

  1.  **Universality vs. Construction:** Universality **isn't** the mark of a "real" (non-constructed) kind. **"Woman"** is both constructed *and* (relatively) universal because:
      *   It has **Medium Ontological Dependence**: While roles vary, the category fundamentally tracks a biological reality (sex) present in all societies, *which societies then inevitably build complex constructions upon*. This biological anchor facilitates cross-cultural translation *even though* the constructed aspects differ hugely.
      *   **Hijra/Two-Spirit** have **High Ontological Dependence** on *specific* cultural frameworks without that universal biological anchor, making them non-universal kinds.
      *   **Race** lacks a clear, universal biological anchor in the same way (phenotypes are clinal, genetic variation within groups > between). Its categories are **Highly Dependent** on specific local histories/laws, making them *locally specific kinds* without a universal equivalent. There's no "Race" analogous to "Woman" – only specific constructions like "US Blackness" or "Brazilian *negritude*".

  2.  **Money vs. Race:** They differ **primarily in Structural Embeddedness**, not kind.
      *   Both are **Highly Dependent** on collective recognition (Money: High, Race: High).
      *   **Money** has **Low-Medium Embeddedness**: Its looping is powerful but largely confined to economic behavior and doesn't fundamentally reshape identities or create centuries-deep material structures like housing segregation or epigenetic effects of stress.
      *   **Race (e.g., US Blackness)** has **Very High Embeddedness**: Centuries of categorization, law, and practice have created deeply entrenched material, biological, and psychological realities that persist independently of *current* belief (health disparities being a prime example). *This embeddedness is what gives race its "ontological weight" compared to money.* If belief vanished, money vanishes instantly; if belief in race vanished, the embedded structures (wealth gap, health gap, geography) would linger for generations.

  3.  **Autism (DSM-5):** This is the **Poster Child for the Interaction of Axes**.
      *   **Ontological Dependence: High.** The specific constellation of traits defined as "Autism Spectrum Disorder" by the DSM-5 *is* constituted by the diagnostic criteria. Without the diagnostic framework, these traits might be understood differently (e.g., as eccentricity, spirit possession, individual quirks, or under different diagnostic categories).
      *   **Structural Embeddedness / Looping: Very High.** The diagnosis:
          *   Creates identity ("autistic person").
          *   Shapes life trajectories (access to services, education, stigma, community).
          *   Influences research focus and funding.
          *   Changes how individuals interpret their own experiences (looping effect).
          *   May even influence how underlying neurological differences manifest in behavior within a social context that recognizes/labels them.
      *   **The Core Tension:** There is almost certainly a **pre-existing neurocognitive reality** (variation in sensory processing, social communication, executive function, etc.). This is the "refugee displacement" analogue. *However,* the DSM-5 category **is not simply discovering and naming this natural kind**. It:
          *   Draws boundaries that are somewhat arbitrary (cutoff points, which traits cluster).
          *   Is shaped by social values (what counts as "disordered").
          *   Creates a powerful social kind through looping that actively shapes the lived reality of those diagnosed.
      *   **Verdict:** Autism (as defined by DSM-5) is primarily a **Full Social Kind with High Looping**, **built upon** a pre-existing (but heterogeneous and fuzzy) neurocognitive reality. It's *not* a pure natural kind like "water" (H₂O), nor is it a purely arbitrary bureaucratic status like a parking permit. The looping effect is profound and central.

  ### Which Verdicts Need Adjustment?
  *   **Gender Universality:** Your intuition that "*woman* travels" is partly right due to the biological anchor enabling cross-cultural *translation*, **but** the **kind itself** ("woman") is not universal in its *construction*. 1950s US "woman" and contemporary Japanese "woman" are different *versions* of a kind built around a shared anchor. Hijra is a *different kind entirely*. The principle forces nuance: there's a universal anchor (sex), but the *social kind* "woman" is constructed locally upon it.
  *   **Money vs. Race Difference:** Your sense they are different is correct, but the principle clarifies **why**: it's the massive difference in *Structural Embeddedness*, not that one is "real" and the other isn't. Both are fully socially constructed kinds. Money has lower embeddedness/looping power.

  ### Conclusion
  You don't have "two kinds" of social construction, but **social kinds varying along two continuous dimensions**: their *dependence on ongoing collective recognition* and their *power to generate deeply embedded structural realities through causal looping*. This explains why money vanishes without belief, race's effects linger without belief, gender feels universal yet constructed, refugee status labels a pre-existing condition, and credit scores create thin, looping categories. For autism, the DSM-5 category is a socially constructed kind with intense looping, built upon (but not reducible to) underlying neurocognitive variation. The tension dissolves when you stop looking for a single "real vs. constructed" line and map the complex terrain defined by these axes.
