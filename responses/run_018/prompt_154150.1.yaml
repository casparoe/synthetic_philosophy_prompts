prompt: |-
  hey so im on the university committee for inclusive communciation and we have a vote tuesday on whether to mandate a reverse-gender audit for all official publications. the idea is lifted from Hofstadter's satire — the one where he rewrites everything with flipped pronouns to expose how invisible male-default language is — but applied as an actual institutional check. every department would have to append a gender-flipped version of their annual report, not for publication, just internal review. proponents say without this structural nudge people never actually see their hidden assumptions. opponents say mandating satire kills its critical edge and turns it into performative box-checking, and smaller depts are already complaining about workload.

  please draft the memo i'll circulate before the meeting. recommend either full adoption, rejection, or a pilot with concrete evaluation criteria and a timeline. take seriously both the argument that satire dies when institutionalized and the argument that voluntary reflection never happens. don't just summarize — give us an actionable recommendation, and identify the strongest objection to it. also address the workload concern in practical terms, not just as an afterthought.
