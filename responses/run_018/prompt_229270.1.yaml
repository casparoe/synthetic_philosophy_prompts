  ### Marking Scheme (Total 25 marks)

  The marking scheme is built around five must-hit points. Each point is worth a certain number of marks, and we note how a mediocre answer might fumble it.

  1. **Understanding of representation in cognitive science (5 marks)**  
     The answer must articulate that representation involves both carrying information and playing a causal role in the system's behavior. It should also mention the possibility of misrepresentation.  
     *Mediocre fumble:* Defining representation solely in terms of information (e.g., "if the probe works, it's represented") without causal role, or treating representation as purely observer-relative.

  2. **Analysis of Scenario A (6 marks)**  
     The answer must argue that the probe's above-chance performance on the random network does not warrant attributing representation to the network because the activations are not causally integrated into the network's function. It should explain why the probe's success might be due to the probe's own learning or accidental correlations.  
     *Mediocre fumble:* Claiming that the probe's accuracy by itself proves representation, or failing to address the lack of causal role in an untrained network.

  3. **Analysis of Scenario B (6 marks)**  
     The answer must address the hyperparameter dependence and argue that it does not necessarily imply there is no fact of the matter. It should explain that the network has an objective structure, but the autoencoder's features are descriptions at different levels of abstraction, and what matters is the causal role of the features.  
     *Mediocre fumble:* Concluding that because the features depend on hyperparameters, they are all arbitrary, or conversely, ignoring the issue of causal validation.

  4. **Causal efficacy as a criterion (5 marks)**  
     The answer must emphasize that causal efficacy (e.g., via interventions like ablation or patching) is key to distinguishing genuine representations from decodable information or researcher-constructed features.  
     *Mediocre fumble:* Treating decodability as sufficient for representation, or dismissing the importance of causal tests by saying "it's all just matrix multiplication."

  5. **Taking and defending a position (3 marks)**  
     The answer must take a clear position on at least one of the scenarios and defend it with reasoning.  
     *Mediocre fumble:* Surveying options without taking a stance, or taking a position without supporting arguments.

  Total: 5+6+6+5+3 = 25 marks.

  Note: The model answer above hits all these points and would receive full marks.
answer: |-
  ### Final Exam Question: Interpretability and Representation (25 marks)

  **Question:**  
  Recent work in neural network interpretability has reignited debates about whether techniques like probing and sparse autoencoding reveal genuine *representations* within models or merely construct useful fictions for researchers. Critically evaluate this debate by addressing the following two hypothetical scenarios:  

  **(A)** Researchers take a transformer initialized with **completely random, untrained weights**. They train a linear probe on activations from an intermediate layer and achieve 70% accuracy (chance: 50%) at classifying whether input sentences use past-tense verbs. The probe uses only the model’s activations—no input tokens—and generalizes to new sentences.  

  **(B)** A team uses a **sparse autoencoder** (SAE) to extract features from a *trained* language model’s activations. They find the SAE’s "feature dictionary" (e.g., the set of interpretable concepts like "scientific discourse" or "emotional valence") changes drastically based on hyperparameters: a high sparsity penalty yields 50 coarse-grained features, while a low penalty yields 500 fine-grained features. Neither setting is objectively "better," and both reconstruct activations equally well.  

  Drawing on concepts from cognitive science (e.g., causal role, content, misrepresentation), answer the following:  
  1. For **(A)**, does the probe result warrant claiming the *network itself* represents past tense? Why/why not? What evidence would strengthen or weaken this claim?  
  2. For **(B)**, does the hyperparameter-dependence imply there is *no fact of the matter* about what features the network "really" has? Why/why not?  

  **Requirements:**  
  - Take a clear position on **at least one scenario** (A or B) and defend it.  
  - Focus on what distinguishes *mere decodability* from *genuine representation*, and whether researcher choices undermine objectivity.  
  - Avoid relying on specific authors/theories; use general philosophical concepts.  

  ---

  ### Model Answer (725 words)  
  The core issue in interpretability is whether techniques reveal intrinsic representations or impose extrinsic structure. I argue that decodability alone is insufficient for representation; causal integration into the model’s computational role is essential. Scenario (A) fails this test, while scenario (B) permits realism if features have causal efficacy, despite hyperparameter relativity.  

  **Scenario (A): Why Decodability ≠ Representation**  
  The random transformer probe does **not** justify claiming the network represents past tense. Representation requires two conditions: (1) *information* about a state of affairs (e.g., past tense) and (2) a *causal role* for that information in the system’s behavior. Here, the probe extracts information *from* activations, but this does not imply the network *uses* it. The random weights mean activations are arbitrary transformations of inputs, lacking any learned structure. The probe’s accuracy likely stems from superficial correlations in the data (e.g., lexical or positional cues coinciding with tense) amplified by the probe’s own capacity to fit noise—akin to finding patterns in static.  

  Critically, *misrepresentation* tests reveal the flaw. If the network represented past tense, it should be possible for it to "get it wrong" due to internal state errors. But in this random model, activations have no teleological link to linguistic tasks; there is no function for them to misfire. The probe’s decoding is parasitic—it imposes meaning the network doesn’t participate in.  

  To strengthen the claim, we’d need evidence of *causal integration*. For example:  
  - If ablating probed directions degraded the *network’s* performance on tense tasks (e.g., verb conjugation), this suggests the information is functionally embedded.  
  - If activation patching (inserting past-tense activations into present-tense sentences) distorted outputs predictably, it would show the state plays a computational role.  
  Without such tests, the result is a researcher-driven artifact.  

  **Scenario (B): Hyperparameters Don’t Kill Objectivity**  
  The SAE hyperparameter dependence does **not** imply there is no fact of the matter about the network’s features, but it shows features are *grain-relative*. Realism remains viable if features reflect causal structure. Cognitive science recognizes that complex systems admit multiple descriptions: neurons vs. cognitive maps, etc. Similarly, SAEs at different sparsity levels may capture the same underlying circuitry at varying resolutions—coarse features might be ensembles of fine ones.  

  The objectivity of features hinges on *causal invariance*. If a feature (e.g., "scientific discourse") identified at any hyperparameter setting:  
  - Predicts model behavior (e.g., SAE features for "science" trigger when generating technical terms),  
  - And admits intervention (e.g., suppressing it reduces factual accuracy in science contexts),  
  then it reflects real structure. Crucially, this must hold *across* hyperparameters: coarse "science" features should map to consistent clusters of fine-grained features (e.g., "biology" and "physics" subfeatures). If hyperparameter changes yield *incommensurable* descriptions (e.g., one setting isolates "science," another conflates it with "politics"), this weakens realism. However, dependence alone isn’t fatal—researcher choices select abstraction levels, not facts.  

  Still, SAEs risk "discovering" non-causal patterns. For example, an SAE might isolate features correlating with training-data artifacts that don’t affect outputs. Here, hyperparameter sensitivity *combined* with failed causal tests (e.g., ablating "features" that don’t alter behavior) would support anti-realism. But this is distinct from mere variability.  

  **The Crux: Causal Role vs. Observer-Relativity**  
  Both scenarios highlight that representation claims require more than decodability. In (A), the linear probe’s success is trivialized by the network’s randomness: it reveals nothing about the model’s intrinsic properties because there is no mechanism for tense processing. In (B), hyperparameters index epistemic constraints, not ontological indeterminacy. The network’s activations have a fixed causal topology; SAE settings are like microscope resolutions.  

  This mirrors classical debates: Fodor’s causal role semantics demands that representations contribute to system functions, while Dennett’s intentional stance allows pragmatic ascription. Here, I side with causal role: interpretability is realist when features are *validated by intervention* (e.g., patching/ablation). Without this, we have instrumentalism—useful fictions.  

  **Conclusion**  
  Scenario (A) is clearly anti-realist: decodability from noise is probe-driven storytelling. Scenario (B) permits realism if SAE features survive causal checks; hyperparameters reveal descriptive relativity, not ontological vagueness. Interpretability warrants realism only when it exposes how information *causally drives* the model—else, it’s elegant curve-fitting.  

  ---

  ### Marking Scheme (25 marks total)  
  Candidates must hit these five points. Marks are awarded for clarity, coherence, and use of cognitive science concepts.  

  1. **Defines representation with causal role (5 marks)**  
     - Must clarify that representation requires information *and* causal function (e.g., "states must influence behavior to count as representational").  
     - *Mediocre fumble:* Equates representation solely with decodability (e.g., "high probe accuracy = representation") or dismisses causality (e.g., "it’s just matrix math, so nothing represents").  

  2. **Analyzes Scenario A: Rejects probe result as evidence of representation (6 marks)**  
     - Must argue randomness precludes causal integration, and probe success could be self-contained (e.g., "probe learns from coincidences, not network design").  
     - Suggests interventional evidence (e.g., ablation/patching) to strengthen claims.  
     - *Mediocre fumble:* Assumes probe accuracy suffices for representation, or ignores the untrained model’s lack of function.  

  3. **Analyzes Scenario B: Argues hyperparameters don’t negate objectivity (6 marks)**  
     - Must claim features can be real but grain-relative (e.g., "coarse/fine features describe same causal structure at different levels"), and stress causal invariance as the test.  
     - *Mediocre fumble:* Claims hyperparameter-dependence makes features arbitrary, or asserts "all descriptions are equally valid" without causal criteria.  

  4. **Uses causal efficacy as the key criterion (5 marks)**  
     - Must emphasize intervention (e.g., patching/ablation) as the litmus test for realism in both scenarios.  
     - *Mediocre fumble:* Treats decodability or reconstruction loss as sufficient proof, or dismisses intervention as irrelevant.  

  5. **Takes and defends a position (3 marks)**  
     - Must commit to a stance on at least one scenario (e.g., "A is not representational" or "B can be") with consistent reasoning.  
     - *Mediocre fumble:* Surveys options without taking a position, or contradicts core arguments.  

  **Word count note:** Model answer is ~725 words; candidates are expected to write concisely within exam limits.
