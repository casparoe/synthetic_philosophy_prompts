prompt: |-
  I TA a graduate seminar cross-listed between philosophy and computer science (the course is basically Minds and Machines but this year it's turned into a seminar on interpretability research in neural networks -- probes, sparse autoencoders, activation patching, the works). The room is split: the philosophers suspect the whole field is sophisticated curve-fitting plus storytelling, and the ML students think the philosophers are being precious about the word "representation." For the final I want one essay question that shows who actually understood the underlying issue and who just memorized the week's vocabulary.

  Draft me a question on realism about interpretability: when, if ever, does an interpretability result warrant the claim that a network itself represents some concept or has some feature, as opposed to that claim being a useful fiction for the researchers looking at it? The question should be built around two hypothetical results the candidates have to evaluate, stipulated in the question so that no knowledge of any actual paper is required. Something like: (1) researchers take a transformer with completely random, untrained weights, train a linear probe on its activations, and find they can decode some linguistic property of the input (say, whether a sentence is in the past tense) well above chance; (2) a seperate team finds that the inventory of features their sparse autoencoder extracts from a *trained* model changes substantially depending on how they set the sparsity penalty and dictionary size. The crux I want the question to force: can the student articulate what would distinguish information merely being decodable from activations (perhaps thanks to the probe's own learning capacity) from the network actually using that information downstream, and can they say whether there is any fact of the matter about which features a network has if the feature inventory depends on the researcher's hyperparameter choices. Candidates should have to take a position on at least one of the two hypotheticals and defend it, not just survey options.

  Constraints: answerable in two hours by someone who has done a unit on representation in classical cognitive science, so they can bring in ideas about causal role, content, misrepresentation, etc., but the question must not hinge on any specific named theory or author. 25 marks total. Deliverables: the question itself, a model answer of 600-800 words, and a marking scheme built around five must-hit points with the marks each is worth, plus for each point a one-line note on the characteristic way a mediocre answer fumbles it (e.g., treating high probe accuracy as by itself settling that the network represents the property, or saying "it's all just matrix multiplication" as if that observation settles the content question).
reasoning: |-
  We are designing an essay question for a final exam in a graduate seminar on interpretability in neural networks. The question should center on the issue of realism about interpretability: when can we say that a network itself represents a concept or has a feature, as opposed to that being a useful fiction for the researchers?

  The question will present two hypothetical results for the students to evaluate:

  1. **Hypothetical Result 1**: Researchers take a transformer with completely random, untrained weights. They train a linear probe on its activations and find that they can decode a linguistic property (e.g., whether a sentence is in the past tense) well above chance.

  2. **Hypothetical Result 2**: A separate team finds that the inventory of features their sparse autoencoder extracts from a *trained* model changes substantially depending on how they set the sparsity penalty and dictionary size.

  The crux of the question is to force the student to articulate:
  - What distinguishes information merely being decodable from activations (which might be due to the probe's own learning) from the network actually using that information downstream?
  - Whether there is any fact of the matter about which features a network has if the feature inventory depends on the researcher's hyperparameter choices.

  The student must take a position on at least one of the two hypotheticals and defend it.

  Constraints:
  - Answerable in two hours by someone who has done a unit on representation in classical cognitive science (so they can bring in ideas about causal role, content, misrepresentation, etc.).
  - Must not hinge on any specific named theory or author.
  - Total marks: 25.

  Deliverables:
  1. The question itself.
  2. A model answer of 600-800 words.
  3. A marking scheme built around five must-hit points with the marks each is worth, plus for each point a one-line note on the characteristic way a mediocre answer fumbles it.

  Let's design the question.

  ### The Question

  **Question (25 marks):**

  Recent work in interpretability has raised debates about the nature of representation in neural networks. Some argue that interpretability techniques reveal genuine representations in the model, while others contend that these are merely useful fictions constructed by the researcher. Consider two hypothetical interpretability results:

  **(A)** Researchers take a transformer model initialized with random, untrained weights. They train a linear probe on the activations of one of its hidden layers and find that the probe can predict whether an input sentence is in the past tense with accuracy well above chance (e.g., 70% on a balanced dataset).

  **(B)** A separate research team uses a sparse autoencoder to extract features from the activations of a trained language model. They find that the set of features (the "dictionary") they obtain varies dramatically when they change the sparsity penalty or the dictionary size. For instance, with low sparsity, they get many fine-grained features, but with high sparsity, they get fewer, more abstract features. Moreover, they cannot find a single "correct" setting that uniquely captures the model's internal structure.

  Drawing on concepts from the philosophy of cognitive science (such as causal role, content, misrepresentation, etc.), critically evaluate the following:

  1. In scenario (A), does the above-chance performance of the probe warrant the claim that the randomly initialized transformer *represents* the past tense property? Why or why not? What additional evidence, if any, would be required to support such a claim?

  2. In scenario (B), does the dependence of the feature inventory on the researcher's hyperparameters imply that there is no objective fact of the matter about what features the network has? Why or why not?

  You must take a position on at least one of the two scenarios and defend it. Your answer should address the underlying issue of when interpretability results license realist claims about representation in the network.

  ---

  ### Model Answer (600-800 words)

  **Model Answer:**

  The debate over whether interpretability techniques reveal genuine representations or merely researcher-constructed fictions hinges on fundamental questions about the nature of representation. In cognitive science, representation is typically understood as a state that carries information about some aspect of the world and plays a causal role in the system's behavior. I will address both hypothetical scenarios, focusing on the conditions under which we can attribute representation to the network.

  **Scenario A: The Random Transformer Probe**

  The above-chance decoding of past tense from a randomly initialized transformer does not, by itself, warrant the claim that the network represents the past tense property. The key reason is that the probe's success might be due to the probe's own learning capacity rather than any structured representation in the untrained network. A linear probe, despite its simplicity, can learn to extract patterns from the activations. However, in a random network, the activations are unstructured noise relative to the linguistic property. The probe might be exploiting accidental statistical regularities in the noise that correlate with the target property, but these are not the result of the network's design or learning.

  For the network to genuinely represent the past tense, the information about past tense must play a causal role in the network's computations. In a trained network, we might see that perturbing the relevant activations (e.g., via activation patching) affects the model's output in a way that is specific to tense. But in this random network, there is no reason to believe that the activations used by the probe are causally involved in producing outputs related to tense. The network has not been trained to process language, so it does not have a function that would make the representation of past tense meaningful.

  Moreover, representation implies the possibility of misrepresentation. If the network represented past tense, it could sometimes get it wrong in a systematic way. However, in this random network, there is no mechanism by which the activations could be said to "aim" at past tense. The probe's accuracy is an artifact of the data and the probe, not of the network's internal states.

  To warrant a claim of representation, we would need evidence that the information about past tense is causally efficacious in the network's processing. For instance, if we could show that ablating the specific neurons or directions that the probe uses leads to a drop in the network's performance on tense-related tasks (if the network were trained), that would be stronger evidence. But in this case, the network is untrained and has no performance on such tasks. Thus, the result is better seen as a curiosity about the probe's ability to find patterns in noise, not as revealing a representation in the network.

  **Scenario B: Sparse Autoencoder Hyperparameter Dependence**

  The dependence of the feature inventory on hyperparameters does not necessarily imply that there is no objective fact of the matter about the network's features. Instead, it suggests that the features extracted by the autoencoder are not unique and that the researcher's choices influence the level of abstraction at which they describe the network. However, the network's internal structure is fixed and objective; it is the description that varies.

  In cognitive science, the idea of multiple realizability and levels of explanation is common. A neural network's activations can be decomposed in many ways, just as a biological brain can be described at the level of neurons, neural populations, or cognitive modules. The hyperparameter choices in the autoencoder correspond to choosing a particular grain of description. For instance, a high sparsity penalty forces the autoencoder to capture only the most significant features, which might correspond to more abstract concepts. A low penalty allows for finer details. Both can be valid descriptions of the same underlying system.

  The objectivity of the features lies in their causal role. If a feature identified by the autoencoder (at any hyperparameter setting) can be shown to be causally involved in the network's behavior (e.g., by activation patching or feature ablation), then it is a real feature of the network. The fact that we can describe the network at multiple levels does not make any level fictional; it merely reflects that complex systems can be analyzed at different grains.

  However, if the features extracted are not causally relevant — for example, if they do not consistently affect the network's output when manipulated — then they might be artifacts of the autoencoder. The hyperparameter dependence becomes problematic only if we insist that there is one privileged set of features. Instead, we should adopt a pluralistic view: different hyperparameter settings may reveal different aspects of the same underlying causal structure.

  **Conclusion**

  In scenario A, the probe result does not indicate representation because the information is not causally embedded in the network's function. In scenario B, the hyperparameter dependence does not negate the reality of the features but highlights the need for causal validation. The key to realism in interpretability is not just decodability but the causal integration of the information in the network's computational processes. Without evidence of causal efficacy, interpretability results remain useful fictions for the researcher, not discoveries of genuine representations.

