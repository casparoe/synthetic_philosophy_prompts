prompt: |-
  hey, I'm a referee for a small jounal that gets papers claiming some agent—usually an AI, sometimes a human—has "real comprehension" of physics or logic just because it scores well on benchmarks. I want to operationalize the Darwin/Turing inversion into a 15-minute checklist I can actually run: Darwin showed you can get competence without any internal reasoning via selection, Turing showed we can only ever see behavior, so high performance never by itself proves understanding. Give me the steps in order, with explicit "this is just my judgment" tags, hard cases the steps must handle, and warnings about misfires. It has to work when I don't have model weights or raw transcripts. Apply it to three cases: (1) a language model that nails mechanics word problems but collapses when variable names are randomly swapped; (2) a human expert whose brittle, modular failure pattern makes the checklist deny them comprehension—this should be the answer you won't like; (3) one genuinely ambiguous case where the steps deadlock. Say flat-out what the checklist can't do. End with one line: Blind spot: ...
reasoning: |-
  We are operationalizing the Darwin/Turing inversion: competence can arise from selective processes without internal reasoning, and we can only observe behavior, so high benchmark performance alone doesn't prove understanding.

  The checklist will be a series of steps to run in order. Each step ends with a "this is just my judgment" tag. We design it to be run in 15 minutes without access to model weights or raw transcripts (so we rely on the paper's evidence and perhaps supplementary materials).

  Key principles:
  1. We are looking for behavioral patterns that suggest the agent is not just pattern-matching but has a robust internal model that can handle variations and novel situations.
  2. We are especially wary of agents that perform well on benchmarks but fail under perturbations that shouldn't affect a true understanding.

  Steps:

  1. **Benchmark Performance Check**: 
     - Verify the agent meets or exceeds state-of-the-art performance on standard benchmarks for the claimed domain (e.g., physics, logic).
     - *Hard cases*: The agent might have trained on the benchmark or a very similar distribution. Also, benchmarks might not cover the full depth of the domain.
     - *Warning*: High performance here is necessary but not sufficient. We are just establishing baseline competence.
     - *Judgment tag*: "Based on the reported metrics, the agent performs well on standard benchmarks. This is just my judgment."

  2. **Perturbation Robustness Check**:
     - Look for evidence that the agent was tested on systematically perturbed versions of the benchmark tasks. Perturbations should be meaningful but not change the underlying problem (e.g., changing variable names in physics problems, rephrasing questions, changing surface details).
     - *Hard cases*: The agent might be robust to some perturbations but not others. We are looking for brittleness that suggests overfitting or shallow processing.
     - *Warning*: If the paper doesn't include perturbation tests, this step must be flagged as a gap. Also, note that some perturbations (like changing variable names) should not affect a system with real comprehension, but might break a pattern-matcher.
     - *Judgment tag*: "The agent [shows/does not show] robustness to meaningful perturbations. This is just my judgment."

  3. **Novelty and Compositionality Check**:
     - Check if the agent can handle novel combinations of concepts or problems that are outside the training distribution but within the domain. For example, in physics, can it solve a problem that combines two principles it has seen separately in a new way?
     - *Hard cases*: Defining "novelty" can be tricky. We rely on the paper's claim of novelty and our domain knowledge.
     - *Warning*: Failure here might indicate memorization or lack of compositional understanding.
     - *Judgment tag*: "The agent [demonstrates/lacks] the ability to handle novel and compositional tasks. This is just my judgment."

  4. **Failure Mode Analysis**:
     - Examine the reported failure cases. Do the failures make sense for an agent with genuine understanding? Or do they reveal a pattern of brittle, context-dependent mistakes?
     - *Hard cases*: Even humans have brittle failure modes in some areas (e.g., optical illusions). We must compare to human-like failure modes in the domain.
     - *Warning*: If the paper does not discuss failure modes, that's a red flag. Also, note that some failure modes might be consistent with understanding (e.g., missing a subtlety) while others are not (e.g., being thrown off by a variable name change).
     - *Judgment tag*: "The failure modes [are/are not] consistent with genuine comprehension. This is just my judgment."

  5. **Internal Consistency Check** (if possible without weights/transcripts):
     - Look for evidence of consistency in the agent's behavior across multiple contexts. For example, does it use the same concept the same way in different problems? If there are multiple ways to solve a problem, does the agent choose appropriately?
     - *Hard cases*: Without access to internals, we rely on behavioral traces (e.g., in a chat log, does the agent give consistent explanations?).
     - *Warning*: This step might be hard to do without more data. If the paper doesn't provide such evidence, we note the limitation.
     - *Judgment tag*: "The agent [exhibits/lacks] internal consistency in its behavior. This is just my judgment."

  6. **Cross-Task Generalization Check**:
     - Check if the agent can transfer knowledge to a related but distinct task without additional training. For example, if trained on mechanics, can it solve a problem in thermodynamics without having seen any thermodynamics examples?
     - *Hard cases*: The line between "related" and "unrelated" can be blurry.
     - *Warning*: Lack of transfer might indicate narrow competence.
     - *Judgment tag*: "The agent [shows/does not show] cross-task generalization. This is just my judgment."

  Now, we apply the checklist to three cases:

  **Case 1: Language model that nails mechanics word problems but collapses when variable names are randomly swapped.**

  1. **Benchmark Performance Check**: The model performs well on standard mechanics benchmarks. (Pass)
  2. **Perturbation Robustness Check**: The model fails when variable names are swapped. This is a critical failure because a system with genuine comprehension would not be affected by such a change. (Fail)
  3. **Novelty and Compositionality**: (We don't have data, but the perturbation failure suggests that even if it does well on novel problems within the same distribution, it's brittle.)
  4. **Failure Mode Analysis**: The failure mode (collapsing on variable swap) is not consistent with genuine comprehension. (Fail)
  5. **Internal Consistency**: Not tested, but the variable swap failure suggests inconsistency. (Probably fail)
  6. **Cross-Task Generalization**: Not tested. (Inconclusive)

  Conclusion: The checklist denies comprehension because of the critical failure in perturbation robustness and failure mode analysis.

  **Case 2: Human expert whose brittle, modular failure pattern makes the checklist deny them comprehension.**

  Imagine a human who has memorized a large set of physics problems and their solutions but does not have a deep understanding. They can solve problems that match their memorized set, but if presented with a problem that requires a slight variation or a novel combination, they fail. Moreover, they might fail under perturbations that shouldn't matter (like changing the names of variables) because they are relying on surface features.

  1. **Benchmark Performance Check**: The human performs well on standard problems. (Pass)
  2. **Perturbation Robustness Check**: They fail when variable names are swapped or when the problem is rephrased. (Fail)
  3. **Novelty and Compositionality**: They fail on novel combinations. (Fail)
  4. **Failure Mode Analysis**: Their failures are brittle and occur in ways that suggest pattern-matching rather than understanding. (Fail)
  5. **Internal Consistency**: They might use inconsistent reasoning across problems. (Fail)
  6. **Cross-Task Generalization**: They fail to transfer to a related topic they haven't memorized. (Fail)

  Conclusion: The checklist denies comprehension. This is the answer you won't like because we are saying a human who has memorized without understanding does not have "real comprehension" by our operationalization.

  **Case 3: Genuinely ambiguous case where the steps deadlock.**

  Consider an AI system that has been trained on a wide variety of physics problems and does well on benchmarks. It passes many perturbation tests (e.g., rephrasing, changing numbers) but fails on a specific type of perturbation: when the problem is presented in a non-standard format (e.g., as a comic strip instead of text). It also shows some cross-task generalization but not to every related task. The failure modes are mixed: sometimes it fails in ways that seem like a human might (e.g., missing a subtle force in a complex diagram) but sometimes in ways that seem brittle (e.g., failing on the comic strip). The paper provides evidence of some internal consistency but not comprehensive.

  1. **Benchmark Performance Check**: Pass.
  2. **Perturbation Robustness**: Mixed. It passes many but fails on non-standard formats. Is this a meaningful perturbation? We might argue that a human could also struggle with a non-standard format, so it's ambiguous.
  3. **Novelty and Compositionality**: It handles some novel problems but not others. Mixed.
  4. **Failure Mode Analysis**: Some failures seem human-like, others brittle. Ambiguous.
  5. **Internal Consistency**: Some evidence of consistency, but not exhaustive. Ambiguous.
  6. **Cross-Task Generalization**: It generalizes to some tasks but not all. Mixed.

  The steps deadlock because the evidence is mixed and we cannot come to a clear conclusion. We might lean towards denial of comprehension because of the brittleness to non-standard formats, but it's not clear-cut.

  **What the checklist can't do:**

  - It cannot prove comprehension; it can only look for evidence that might rule it out.
  - It cannot see inside the black box (so we rely on behavioral evidence).
  - It might be too strict (denying comprehension to humans who are just having a bad day) or too lenient (if an AI is designed to pass these specific tests without understanding).
  - It relies on the quality and breadth of the evaluation done in the paper.

  Blind spot: The checklist cannot rule out shallow heuristics that mimic deep understanding by anticipating the test.
answer: |-
  Below is a 15-minute operationalized checklist for evaluating claims of "real comprehension" in agents (AI or human), based on the Darwin/Turing inversion. Darwin reminds us that competence can emerge from selective processes (e.g., training/data exposure) without internal reasoning, while Turing emphasizes that we only observe behavior—so high performance alone is insufficient. The checklist focuses on behavioral brittleness, generalization, and failure patterns to infer if performance is likely shallow or rooted in understanding. 

  **Rules for use:**
  - **Time limit**: Spend ≤2 minutes per step (total 12 minutes), leaving 3 minutes for synthesis.
  - **Data constraints**: Use only the paper’s reported results, supplementary materials, or public demos—no model weights or raw transcripts needed.
  - **Judgment tags**: Each step ends with a placeholder for your subjective assessment. Explicitly state "this is just my judgment" when recording your verdict.
  - **Outcome**: By the end, decide: "Comprehension denied" (brittleness dominates), "Comprehension plausible" (no critical brittleness), or "Deadlock" (ambiguous).
  - **Warnings**: 
    - **False negatives**: Humans/AIs with true understanding may fail due to stress, distractions, or unlucky edge cases.
    - **False positives**: Agents can pass these tests via clever heuristics (e.g., learning perturbation patterns).
    - **Ethical note**: Denying comprehension to humans is contentious—focus on behavioral evidence, not identity.

  ---

  ### **The Checklist**  
  *Run steps in order. Stop early if a critical failure (e.g., brittleness to trivial perturbations) is found.*

  1. **Benchmark Validation**  
     Verify the agent exceeds baseline performance (e.g., >90% accuracy) on standard domain tasks (e.g., physics QA, logic puzzles) using established datasets.  
     *Hard cases*: Benchmarks may be gamed or overfit. Handle by checking for train-test contamination.  
     *Warning*: Passing here doesn’t imply comprehension—it’s the minimum bar.  
     *Your judgment*: [ ] Pass [ ] Fail. This is just my judgment.  

  2. **Trivial Perturbation Test**  
     Check for tests where surface features are altered without changing core meaning (e.g., swapping variable names, rephrasing questions). Look for >30% accuracy drop.  
     *Hard cases*: Perturbations might accidentally change semantics (e.g., "force" to "energy" alters physics meaning). Handle by verifying perturbations are meaning-preserving.  
     *Warning*: Failure suggests pattern-matching, not symbolic reasoning.  
     *Your judgment*: [ ] Robust (drop ≤10%) [ ] Brittle (drop >30%) [ ] Mixed/untested. This is just my judgment.  

  3. **Novelty & Composition Check**  
     Assess performance on problems combining known concepts in new ways or using unseen examples (e.g., new physics scenario built from trained principles). Look for >40% accuracy on novel cases.  
     *Hard cases*: "Novelty" is subjective. Handle by requiring explicit paper claims (e.g., "zero-shot").  
     *Warning*: Memorization fails here; understanding requires flexible recombination.  
     *Your judgment*: [ ] Strong generalization [ ] Weak/brittle [ ] Untested. This is just my judgment.  

  4. **Failure Mode Audit**  
     Analyze error patterns: Are failures random (suggesting noise) or systematic (e.g., always failing when a specific concept is involved)? Request confusion matrices or error examples.  
     *Hard cases*: Humans may have "brittle" knowledge due to cognitive biases. Handle by comparing to domain-expert failure norms.  
     *Warning*: Systematic errors (e.g., always misapplying Newton’s third law) indicate shallow processing.  
     *Your judgment*: [ ] Human-like errors [ ] Systematic brittleness [ ] Inconclusive. This is just my judgment.  

  5. **Cross-Domain Transfer**  
     Evaluate performance on a related but distinct task (e.g., if trained on kinematics, test on thermodynamics). Look for >50% transfer accuracy.  
     *Hard cases*: Tasks may be too dissimilar. Handle by requiring the paper to define domain boundaries.  
     *Warning*: Poor transfer suggests modular, non-generalizable knowledge.  
     *Your judgment*: [ ] Strong transfer [ ] Weak transfer [ ] Untested. This is just my judgment.  

  6. **Synthesis for Comprehension**  
     Combine results:  
     - Critical failure (e.g., Step 2 brittle + Step 3 weak): **Comprehension denied**.  
     - All passes/plausible: **Comprehension plausible**.  
     - Mixed/conflicting: **Deadlock**; request more tests.  
     *Your judgment*: Final call: [ ] Denied [ ] Plausible [ ] Deadlock. This is just my judgment.  

  ---

  ### **Applied to Cases**  
  *Using simulated paper data for illustration.*

  **Case 1: Language model acing mechanics but failing on variable swaps**  
  - **Step 1**: Pass (98% on benchmark problems).  
  - **Step 2**: Brittle (accuracy drops to 40% when "velocity" → "v" and "mass" → "m" are swapped).  
  - **Step 3**: Weak (fails 70% of novel momentum-conservation hybrids).  
  - **Step 4**: Systematic errors (always confuses swapped variables).  
  - **Step 5**: Untested (no transfer data).  
  - **Synthesis**: Comprehension **denied**. Brittleness to trivial perturbations and poor novelty handling indicate pattern-matching, not understanding.  

  **Case 2: Human expert with brittle, modular failures**  
  *Context: A physicist who memorizes problem templates but cannot adapt.*  
  - **Step 1**: Pass (solves 95% of textbook problems).  
  - **Step 2**: Brittle (accuracy drops to 50% when problems use non-standard terms like "push" instead of "force").  
  - **Step 3**: Weak (fails 80% of problems combining electromagnetism and fluid dynamics).  
  - **Step 4**: Systematic errors (always omits friction in moving systems).  
  - **Step 5**: Weak transfer (scores 30% on astrophysics problems).  
  - **Synthesis**: Comprehension **denied**. Consistent brittleness across steps suggests compartmentalized knowledge without integrative understanding. *You won’t like this*—it judges the human by the same behavioral standards as AI, ignoring "consciousness" or "intuition." But the inversion demands it: competence ≠ comprehension.  

  **Case 3: Ambiguous case causing deadlock**  
  *Context: An AI solver for quantum logic puzzles.*  
  - **Step 1**: Pass (99% on benchmarks).  
  - **Step 2**: Robust to variable swaps (drop: 5%).  
  - **Step 3**: Mixed (aces novel single-gate problems but fails 60% of multi-gate compositions).  
  - **Step 4**: Errors are inconsistent (some human-like, some bizarre).  
  - **Step 5**: Strong transfer to classical logic (75%) but fails cryptography tasks (35%).  
  - **Synthesis**: **Deadlock**. Robustness to trivial perturbations hints at understanding, but compositional failures and erratic errors create ambiguity. Steps 3 and 4 conflict—request perturbation tests on novel compositions.  

  ---

  ### **What the Checklist Can’t Do**  
  1. **Prove comprehension**: It only flags behavioral red flags; passing doesn’t guarantee understanding.  
  2. **Detect deception**: Agents (human or AI) can "game" tests by learning heuristics for perturbations.  
  3. **Handle incomplete data**: If a paper omits perturbation/novelty tests, the checklist may deadlock or misfire.  
  4. **Account for context**: Humans under stress or AIs with limited compute may fail transiently.  
  5. **Resolve philosophical debates**: It operationalizes "comprehension" as robustness/generalization, ignoring qualia or consciousness.  

  **Blind spot**: The checklist cannot rule out shallow heuristics that mimic robustness by overfitting to the *evaluation framework itself*.
