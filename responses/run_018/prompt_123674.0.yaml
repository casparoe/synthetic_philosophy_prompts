  The nerve damage case is brilliant - it tests whether know-how is tied to specific physical execution. Intellectualists (A) should say knowledge survives since propositions remain, while Ryleans (B) might say it transforms or disappears if ability is body-specific. Position (C) could go either way but should emphasize phenomenological continuity.

