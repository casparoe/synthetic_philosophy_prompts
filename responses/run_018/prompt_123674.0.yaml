answer: |-
  ### Diagnostic Taxonomy: The Reducibility of Knowing-How to Knowing-That  
  **Core Frame:** All branches test commitment to *procedural calibration* (PC) — the thesis that skill execution involves non-representational, continuous agent-environment tuning irreducible to discrete propositional states.  

  ---

  #### **1. Amnesia Case**  
  *After total amnesia erasing all explicit rules/instructions for a task (e.g., tying a complex knot), the subject retains smooth, expert performance. Does the subject still know how to perform the task?*  
  - **→ (a) No:** Knowing-how *requires* recoverable propositional knowledge.  
  - **→ (b) Yes, identically:** The ability persists independently of lost propositions.  
  - **→ (c) Yes, but transformed:** Knowledge-how survives, but its mode of access is altered.  

  #### **2. Nerve Damage Case**  
  *After nerve damage forces radical reconfiguration of physical execution (e.g., playing violin with reversed finger roles), can the agent’s original knowing-how survive?*  
  - **→ (a) Survives intact:** Knowing-how abstracts over physical implementation.  
  - **→ (b) Transforms:** Knowing-how adapts as a new ability grounded in prior calibration.  
  - **→ (c) Disappears:** Original know-how was tied to specific motor dispositions.  

  #### **3. Learning Method Case**  
  *Is there an epistemic difference between acquiring skill via explicit rule-internalization versus unarticulated trial-and-error calibration?*  
  - **→ (a) Yes:** Rule-based learning yields stronger or distinct warrant.  
  - **→ (b) No:** Both methods produce identical know-how.  
  - **→ (c) Phenomenal difference only:** Same competence, but first-person access differs.  

  #### **4. Single Failure Case**  
  *After years of flawless execution, one surprising failure occurs under normal conditions. Does this falsify "S knows how to φ"?*  
  - **→ (a) Yes:** Know-how requires reliable success; failure negates it.  
  - **→ (b) No:** Know-how is a fallible disposition; failure is compatible.  
  - **→ (c) Context-dependent:** Failure may indicate lost calibration or external factors.  

  ---

  ### Decision Tree & Leaf Mapping  
  *(Follow branches sequentially; answers correspond to numbered cases above)*  

  1. **Start at Amnesia Case:**  
     - **If (a) →** Go to **Leaf A: Pure Intellectualism**  
       *PC rejected.* Knowing-how reduces to knowing-that + application; amnesia destroys know-how. Calibration is representational tuning.  
     - **If (b) →** Go to Nerve Damage Case (2).  
     - **If (c) →** Go to Learning Method Case (3).  

  2. **Nerve Damage Case (from Amnesia(b)):**  
     - **If (a) →** Go to **Leaf D: Deflationary View**  
       *PC collapsed.* "Knowing-how" and "knowing-that" are linguistic artifacts of generic competence. Survival intact shows skill transcends implementation *and* propositions.  
     - **If (b) →** Go to **Leaf B: Rylean Anti-Intellectualism**  
       *PC irreducible.* Knowing-how is adaptive disposition; transformation confirms non-propositional calibration.  
     - **If (c) →** Go to Learning Method Case (3).  

  3. **Learning Method Case (from Amnesia(c) or Nerve Damage(c)):**  
     - **If (a) →** Go to Single Failure Case (4).  
     - **If (b) →** Go to **Leaf D: Deflationary View** (as above).  
     - **If (c) →** Go to **Leaf C: Intermediate Position**  
       *PC modified.* Calibration has a distinctive phenomenal mode but remains factive/representational. Learning methods affect *access*, not competence.  

  4. **Single Failure Case (from Learning Method(a)):**  
     - **If (a) →** Go to **Leaf A: Pure Intellectualism** (as above).  
     - **If (b) →** Go to **Leaf C: Intermediate Position** (as above).  
     - **If (c) →** Go to **Leaf B: Rylean Anti-Intellectualism** (as above).  

  ---

  ### Unoccupied Position & Diagnostics  
  - **Leaf E: Unstable Hybrid**  
    *Path:* Amnesia(c) → Nerve Damage(a) → Learning Method(a) → Single Failure(b).  
    *Diagnosis:* **Incoherent.** Asserts that know-how post-amnesia is transformed (implying PC), yet survives nerve damage *intact* (implying implementation-neutral propositions). Demands calibration be both non-representational *and* abstractly propositional.  

  ---

  ### Taxonomy Notes  
  1. **Indistinguishable Leaves:**  
     - **B (Rylean)** and **C (Intermediate)** converge if answering:  
       Amnesia(b) → Nerve Damage(b) → *Any Learning Method* → Single Failure(b/c).  
       *Reason:* Both affirm post-amnesia know-how and fallibility, differing only on PC’s representational status (irreducible vs. phenomenally modified).  
     - **D (Deflationary)** and **A (Intellectualist)** never share paths.  

  2. **Unstable/Empty Branches:**  
     - **Amnesia(a) + Nerve Damage(b/c):** *Unexplored.* Intellectualists (A) cannot affirm transformed/disappeared know-how post-damage without conceding PC.  
     - **Amnesia(c) + Nerve Damage(a):** *Incoherent* (as in Leaf E).  
     - **Learning Method(a) + Single Failure(b):** *Unstable.* Asserts rule-learning’s epistemic primacy but allows know-how to survive failure—risks conflating propositional and non-propositional warrant.  

  ---  
  **Key:** All positions are defined by their treatment of *procedural calibration*:  
  - **A** rejects PC; **B** affirms PC irreducibly; **C** modifies PC as representational; **D** collapses PC into competence; **E** impossibly hybridizes PC and propositionalism.
