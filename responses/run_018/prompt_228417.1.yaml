prompt: |-
  I'm a journalist who covers science and ideas, and I'm working on a long piece about how institutions ration scarce resources: hospital triage protocols, vaccine allocation in a pandemic, and cost-benefit thresholds in public health. In my interviews, philosophers keep telling me that straightforward aggregation — saving the most lives, summing the most benefit — is morally crude, and that Scanlon's contractualism offers the serious alternative: an act is wrong if it would be ruled out by principles no one could reasonably reject, where each affected person's complaint is weighed individually rather than pooled. But when I ask how that framework handles the choice between saving one person and saving five strangers, I get a different answer from every interviewee. This, I gather, is the aggregation problem, and it's where the piece has to do its real work.

  Before I report anyone's preferred solution, I want the specification. Take on the role of a moral philosopher who specializes in contractualist ethics and who has thought carefully about the numbers problem. Begin by brainstorming briefly and informally — list the pressures on any view in this space before organizing anything — and then write the desiderata: what an adequate contractualist treatment of aggregation must deliver. For each requirement, give the case or consideration that motivates it. The list should at least cover: what the view must say about saving the greater number when individual complaints are equal in strength; how it must handle many trivial burdens spread across millions against one severe burden; whether it may take ex ante probabilities into account; what it must preserve of the separateness of persons; and why it must not simply collapse into sum-ranking consequentialism.

  Finally, tell me which desiderata you suspect cannot be jointly satisfied, which single requirement eliminates the most live contenders, and which items on your own list are genuine requirements versus the inherited prejudices of one camp in this dispute. A numbered list is fine; precision matters more than length.
reasoning: |-
  Okay, let me approach this systematically. The user is a science journalist working on institutional rationing dilemmas, specifically frustrated by the lack of consensus among philosophers about how contractualism handles the "one vs. five" aggregation problem. They need clear desiderata to evaluate competing solutions.

  First, I should map the core tension: contractualism's individual-centered ethics versus the practical need to justify saving larger groups. The journalist's framing suggests they've already grasped the philosophical stakes but need analytical tools to dissect expert disagreements. Their mention of Scanlon indicates they're not a novice, so I can use technical terms like "complaint strength" without oversimplifying.

  The key pressures to acknowledge upfront are:
  - How to weight individual complaints without summing them
  - Whether numbers matter only when complaints are identical
  - How to handle probability (like triage decisions)
  - Preventing collapse into utilitarianism
  - Preserving the "separateness of persons" doctrine

  For desiderata, I'll start with non-controversial points everyone accepts, then move to contested requirements. The "one vs. five" case is foundational, but the journalist also needs cases showing where theories diverge, like:
  - Mass trivial burdens vs. single severe harm (e.g., minor tax vs. one person's bankruptcy)
  - Probabilistic scenarios (e.g., distributing scarce vaccines)
  - Whether to allow tradeoffs between different complaint types

  I suspect the fatal tension lies between D2 (must save greater number when complaints equal) and D4 (must block mass trivial harms overriding severe harm). Sacrificing either looks indefensible, yet satisfying both may require compromising contractualism's core. The journalist should watch for theorists who weaken D4 to preserve aggregation.

  Personally, I'd flag D7 (no interpersonal complaint comparison) as potentially dogmatic - some modified contractualists allow limited comparison. But D1 and D5 feel non-negotiable for any recognizably Scanlonian view.

  The "separateness of persons" point (D6) is crucial for their article's theme. I'll emphasize how it distinguishes contractualism from health economics' QALY calculations. This directly connects to their real-world examples like vaccine allocation.

  Finally, I'll note which desideratum eliminates most existing proposals: D4 typically sinks "complaint-total" views, while pure "complaint-veil" approaches fail D2. The journalist can use this to pressure interviewees about their compromises.
answer: |-
  Here’s a structured analysis of the desiderata for a contractualist treatment of aggregation, framed for your journalistic inquiry. I’ll begin with core pressures, then specify requirements with motivating cases, and conclude with tensions and critical reflections.

  ---

  ### **I. Pressures on Any Contractualist View of Aggregation**
  1. **Anti-Aggregation Intuition**: Contractualism’s core commitment to *individual justifiability* resists summing harms/benefits across persons.  
  2. **Numbers Intuition**: We must sometimes save a larger group over one, but *why* is this permissible if each person’s complaint is distinct?  
  3. **Trivial Burdens Problem**: Can millions of minor harms (e.g., slight tax increases) override one catastrophic harm (e.g., death)?  
  4. **Probability & Uncertainty**: How to handle ex ante risks (e.g., vaccine allocation under supply scarcity).  
  5. **Anti-Consequentialist Boundary**: Avoid collapsing into "sum-ranking" (e.g., utilitarianism) while preserving moral urgency of large-scale rescues.  

  ---

  ### **II. Desiderata: What an Adequate Contractualist Treatment Must Deliver**  
  *(With Motivating Cases & Rationale)*  

  1. **Requirement of Permissible Greater-Saving (D1)**  
     - *Case*: **Drowning Pool** – Save 5 strangers or 1 stranger (all identical in vulnerability, relationship, etc.).  
     - *Motivation*: Any view must explain why saving the 5 is *required*, not merely optional. Failure implies absurdity (e.g., flipping a coin to decide).  

  2. **Equal Complaint Strength Resolution (D2)**  
     - *Case*: **Identical Twins** – Save 5 patients with identical fatal condition or 1 with same condition (same prognosis, age, etc.).  
     - *Motivation*: When complaints are *identical in strength*, numbers must break the tie. Otherwise, the "separateness of persons" paralyzes action.  

  3. **Blocking Massive Trivial Harms Overriding Severe Harms (D3)**  
     - *Case*: **Headache Tax** – A policy inflicts mild headaches on 10 million people to fund a cure that saves one life.  
     - *Motivation*: Contractualism must respect *absolute thresholds* of harm severity. No number of trivial complaints should override a single catastrophic complaint (e.g., death).  

  4. **Ex Ante Probabilistic Fairness (D4)**  
     - *Case*: **Vaccine Trial** – Two vaccines: one has 100% chance of saving 100 people; the other has 50% chance of saving 300.  
     - *Motivation*: Principles must be acceptable *before* outcomes are known. Participants should not reject a principle maximizing *expected* survival if it distributes risk fairly.  

  5. **Preservation of Separateness of Persons (D5)**  
     - *Case*: **Forced Organ Harvest** – Kill one healthy person to distribute organs to five dying patients.  
     - *Motivation*: Directly imposing catastrophic harm on one to benefit others is impermissible, even if net lives saved. Complaints cannot be "pooled" to override individual veto rights.  

  6. **Non-Collapse into Sum-Ranking (D6)**  
     - *Case*: **Minority Neglect** – A policy saving 5 young adults over 4 elderly patients *because* total life-years saved is higher.  
     - *Motivation*: If complaints are reduced to quantifiable units (e.g., QALYs), contractualism becomes consequentialism in disguise. Complaints must retain qualitative, person-relative weight.  

  7. **Asymmetry in Complaint Strength Comparison (D7)**  
     - *Case*: **Broken Arm vs. Death** – Save one person from death or prevent 1,000 people from broken arms.  
     - *Motivation*: Death complaints are *discontinuous* with non-fatal harms; no aggregation of lesser harms can override them.  

  ---

  ### **III. Critical Tensions & Reflections**  
  1. **Suspected Incompatible Pair**: **D2 (Equal Complaint Resolution) + D3 (Trivial Burdens Block)**.  
     - *Why*: If numbers matter only when complaints are equal (D2), but trivial complaints *never* override severe ones (D3), how do we handle intermediate harms (e.g., saving 1 life vs. preventing 10,000 cases of blindness)? Most theories sacrifice one desideratum here.  

  2. **Most Eliminative Requirement**: **D3 (Blocking Trivial Harms)**.  
     - *Why*: It sinks "complaint-aggregation" views (e.g., Michael Otsuka) that allow sufficient trivial harms to override severe ones. Also challenges "veil of ignorance" contractualism (e.g., John Broome), which risks permitting trade-offs.  

  3. **Genuine Requirements vs. Inherited Prejudices**:  
     - **Non-Negotiable**: D1 (greater-saving permissible), D5 (separateness of persons), D6 (non-collapse). These define contractualism’s core.  
     - **Contested**: D2 (numbers matter *only* when complaints equal) and D7 (strict asymmetry) may reflect anti-consequentialist bias. Some hybrid views (e.g., Rahul Kumar) allow *limited* aggregation for intermediate harms.  
     - **Ambiguous**: D4 (ex ante fairness) is plausible but risks smuggling in expected utility.  

  ---

  ### **Key for Your Reporting**  
  - **The Central Dilemma**: Contractualism’s strength (individual justifiability) becomes its weakness in aggregation. No consensus exists because *no view satisfies all desiderata*.  
  - **Interviewee Clues**: Probe how they handle **D3 (Headache Tax)** and intermediate harms (e.g., blindness cases). This reveals their trade-offs.  
  - **Why Not Consequentialism?**: The **Forced Organ Harvest (D5)** and **Minority Neglect (D6)** cases show contractualism’s unique resistance to instrumentalizing persons.  

  This framework equips you to dissect proposals: Does a theorist relax "separateness" (sacrificing D5)? Do they allow probabilistic sums (undermining D6)? The desiderata expose the fault lines.
