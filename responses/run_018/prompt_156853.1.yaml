  The user is interested in moral luck—how outcomes affect moral judgment. The first vote was based on incomplete info; the trireme hadn't arrived yet. The second vote had updated info. So the Athenians' blameworthiness changes due to timing, which is a form of circumstantial moral luck. They were lucky the ship arrived in time. 

  Democratic reversal here shows how assemblies can flip-flop. The user asks if this reversal lessens the blame for the first decision. Moral luck suggests it does because the outcome (reversal) was due to luck, not their initial intent. But the initial intent was still harsh, so there's a tension. 

  Diodotus's argument isn't purely utilitarian. He also talks about the instability of anger, which is a psychological point. The user wants to know if he's warning about wrath's instability versus cold utility. I should highlight both aspects. 

  The theory doesn't fully explain why assemblies reverse quickly. Institutional factors like the urgency of the second meeting and emotional dynamics play a role. Moral luck explains the blame aspect but not the structural reasons for reversal. 

  Need to be honest where theory is silent. Moral luck addresses moral judgment based on outcomes, but the rapid reversal is more about how democracies operate—emotional shifts, procedural rules. So I should separate those points. 

