answer: |-
  1.  **Routing Decisions:** State and federal highway planners made the routing decision, consciously ignoring alternative routes along existing rail corridors or less-residential corridors that would have spared Rondo.
  2.  **Inherently Political Artifact:** The highway, via its placement, is inherently political; its design necessity *was* to destroy a stable Black community, fulfilling a specific social order prioritizing car mobility and segregation over existing urban fabric.
  3.  **Contrasting Reroute:** In Nashville, I-40 was rerouted away from the affluent, predominantly white Edgehill neighborhood after powerful residents successfully lobbied, unlike Rondo which lacked equivalent political influence.
  4.  **Technological Determinism Critique:** The Nashville contrast demolishes technological determinism; highway routes are not inevitable engineering outcomes but deliberate social choices reflecting power dynamics, proving alternatives always existed.
  5.  **Limitation of Winner's Binary:** Winner's focus on intentionality vs. consequence cannot fully capture the deep cultural trauma and loss of intangible heritage, social networks, and identity specific to Rondo beyond physical displacement.
