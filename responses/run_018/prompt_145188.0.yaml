  Ok so I've been thinking about the guilt vs shame debate after skimming some old cultural anthro, and I want an actual number from you. What's your credence that a society could deliberately shift its dominant moral emotion from guilt to shame within one generaton — not just labeling, but actual internalized affect — assuming they control education and media narratives? I want it decomposed: (a) whether guilt and shame are neuro-culturally distinct enough that you can culture-switch them at all, (b) whether the institutional framing (reintegrative shaming vs stigmatizing) matters more than the base emotion, (c) whether there are cooridination failures that make the switch unstable even if locally rational. I don't care about citations, just reasoning. Also I keep misspelling reintegrative as reintergrative so don't correct me. And yes I know this sounds like a weird social engineering hypothetical, but I'm genuinely curious where the disagreement lives.
reasoning: |-
