  ### **Key Clarifications & Contested Issues**
  1. **Settled Distinctions**:  
     - Semantic (contextualism) vs. metaphysical (encroachment) is a conceptual consensus.  
     - Invariantism vs. stake-sensitivity is non-negotiable (Q1 splits them cleanly).  

  2. **Contested Issues**:  
