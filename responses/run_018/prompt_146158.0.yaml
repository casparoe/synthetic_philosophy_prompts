  Below is a diagnostic sorting instrument designed as a decision tree, built from the logical space of stake-sensitive knowledge. It uses your four cases to force distinctions, avoids philosopher names, and maps positions to branches. The tree has **seven terminal positions** (leaves), including major theories, hybrids, and unexplored views. Empty combinations are diagnosed, and contested issues are flagged.

  ---

  ### **Decision Tree: Stake-Sensitivity in Knowledge**

  **Start → Question 1: Bridge-Safety Belief**  
  *You casually judge a bridge safe. Later, you learn a school bus will cross it. Does this retroactively change whether you **knew** the bridge was safe?*  
  - **Yes (Knowledge is stake-sensitive)** → Go to Question 2.  
  - **No (Only assertion/action is stake-sensitive)** → **Leaf 1: Strict Invariantism**.  
    - *Position*: Knowledge is purely truth-functional (evidence + belief). Stakes only affect whether you may *assert* knowledge or act on it.  
    - *Retrospective (Q3)*: Prior belief **intact** (you knew then).  
    - *Distributed (Q4)*: **No effect** (collective stakes irrelevant).  

  ---

  #### **Branch: Knowledge is Stake-Sensitive (from Q1-Yes)**  
  **Question 2: Nature of Shift**  
  *If knowledge shifts with stakes, is this due to...*  
  - **The word "knows" changing meaning (semantic shift)** → Go to Semantic Branch (Q3).  
  - **The belief-relation itself changing (metaphysical shift)** → Go to Metaphysical Branch (Q3).  

  ---

  ##### **Semantic Branch (Contextualism Family)**  
  **Question 3: Retrospective Revelation**  
  *Years later, you learn catastrophic hidden stakes applied when you formed a moderate-evidence belief. Is your prior belief...*  
  - **Disqualified (you didn’t know then)** → **Leaf 2: Unnamed/Unoccupied**.  
    - *Diagnosis*: **Incoherent**. Contextualism ties "knows" to the *attributor’s* context at assertion. Retroactive disqualification would require the past context to be overwritten, violating core tenets.  
  - **Intact (you knew then)** → **Leaf 3: Standard Contextualism**.  
    - *Position*: "Knows" expresses different standards in different conversational contexts. The *attributor’s* context (not the subject’s awareness) sets the standard.  
    - *Retrospective*: Prior belief **intact** (your past self met the *past* context’s standards).  
    - *Distributed (Q4)*: **No effect** (analyst’s context is low-stakes; collective stakes are irrelevant unless introduced conversationally).  
  - **Incoherent to judge** → **Leaf 4: Assessment-Sensitivity View**.  
    - *Position*: Hybrid. Knowledge attributions are assessed from current context, but past truth is fixed. Judging past belief is incoherent because standards clash.  
    - *Distributed (Q4)*: **Effect** (analyst’s context is irreducibly ambiguous; collective stakes create latent high-stakes context).  

  ---

  ##### **Metaphysical Branch (Encroachment Family)**  
  **Question 3: Retrospective Revelation**  
  *Years later, you learn catastrophic hidden stakes applied...*  
  - **Disqualified (you didn’t know then)** → Go to Encroachment Sub-branch (Q4).  
  - **Intact (you knew then)** → **Leaf 5: Awareness-Dependent Encroachment**.  
    - *Position*: Knowledge requires stakes to be *reasonably foreseeable*. Hidden stakes don’t affect prior knowledge.  
    - *Distributed (Q4)*: **No effect** (analyst unaware of collective stakes; they aren’t reasonably foreseeable).  
  - **Incoherent to judge** → **Leaf 6: Unnamed/Unoccupied**.  
    - *Diagnosis*: **Unexplored**. Encroachment typically treats stakes as objective. Calling judgment incoherent suggests stakes are epistemic, not metaphysical.  

  **Encroachment Sub-branch (from Q3-Disqualified)**  
  **Question 4: Distributed Stakes**  
  *An analyst processes anonymized data; collective harm is enormous but imperceptible per individual. Do these stakes affect her knowledge?*  
  - **Yes** → **Leaf 7: Standard Pragmatic Encroachment**.  
    - *Position*: Knowledge depends on objective practical stakes (whether known or not).  
    - *Retrospective*: Prior belief **disqualified** (hidden stakes were objectively high).  
    - *Distributed*: **Effect** (collective stakes raise the justification threshold).  
  - **No** → **Leaf 8: Institutional-Role Hybrid**.  
    - *Position*: Stakes affect knowledge *only* in institutional roles (e.g., engineers, analysts). Private beliefs are stake-insensitive.  
    - *Bridge (Q1)*: If your judgment was casual (non-institutional), learning stakes doesn’t retroactively destroy knowledge.  
    - *Retrospective*: **Intact** (if private belief) or **disqualified** (if institutional).  
    - *Distributed*: **Effect** (analyst’s institutional role means collective stakes matter).  

