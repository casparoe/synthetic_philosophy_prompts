answer: |-
  **Brainstorming:** The endurance/perdurance distinction centers on whether objects persist by being wholly present at each moment (enduring substances) or by having temporal parts spread across spacetime (4D worms). In material constitution (e.g., statue/clay), endurance faces the "problem of temporary intrinsics" and puzzles of coincidence (statue = clay yet different properties/persistence conditions). Four-dimensionalism dissolves coincidence: the statue and the clay are distinct spacetime worms occupying the same region only during the statue's existence phase. Restoration, destruction, and deformation become matters of worm segmentation and temporal part identity.

  **Numbered Points:**

  1.  **Restored Artworks:** A restored artwork persists as a single, complex spacetime worm encompassing both the original temporal part, the period of disassembly/damage (as a distinct, non-artwork temporal part of the matter-worm), and the subsequent restored temporal part, denying strict identity between the original and restored stages while maintaining continuity.
  2.  **Legal Ownership Claims:** Ownership attaches not to the entire statue-worm (which extends beyond the artwork's existence) but to specific temporal parts; legal disputes over "the destroyed statue" concern ownership rights over the temporal part *when* it existed as an artwork and potentially the matter-worm temporal parts post-destruction.
  3.  **Radical Deformation as Survival:** Radical deformation can be the statue-worm's survival only if the deformed object constitutes a later temporal part of the *same* statue-worm, defined by immanent causal connections and relevant sortal properties persisting through the deformation; otherwise, it signifies the statue-worm's termination and the matter-worm continuing under a new form.
  4.  **Change without Replacement:** Four-dimensionalism avoids claims that deformation (or any change) destroys the original and replaces it; instead, the original statue is a temporal part, and the deformed object is a numerically distinct later temporal part of the same enduring spacetime worm, accounting for change without invoking replacement metaphysics.
  5.  **Ontological Relativity:** Resolving the problem via four-dimensionalism reveals that questions like "Is *this* the original statue?" are incomplete; the answer depends on specifying *which temporal part* is being referenced (e.g., the pre-deformation part vs. the entire worm), shifting focus from strict identity to genidentity relations between parts.
