  You're acting as a professional philosopher of social ontology who writes sharp, technical dialogue. First, take a minute to brainstorm the strongest version of each side — don't let either character become a strawman. Think carefully about how automated contract systems actually work before you write anything.

  Write a dialogue between Mara and Leo sitting in a campus coffee shop. Mara is a hard social constructionist about institutional kinds: she holds that race, gender, and especially money are entirely constituted by collective acceptance and have no mind-independent causal powers whatsoever. Leo is a functionalist realist about institutional kinds: he agrees social agreement is necessary for money to exist, but he insists that once a monetary system is running it acquires real, stable causal powers — inflation dynamics, liquidity effects, credit expansion — that are genuinely explanatory and can't be reduced to individual beliefs.

  The niche twist: have them argue specifically about decentralized stablecoins and algorithmic treasury contracts, where "agreement" is baked into immutable code and executes without any human mental state tracking it in real time. Mara should claim this just automates collective acceptance — the social construction is still there, just hard-coded, so antirepresentationalist/social constructionist view holds perfectly. Leo should push back that in these systems the causal powers operate independently of belief: no one needs to mentally endorse the token for it to enforce contracts or move value, so money here behaves like it has an "institutional objectivity" that breaks the usual construction/realism dichotomy.

  Make it real back-and-forth. Leo needs to respond directly to Mara's automation point, and Mara needs to respond directly to Leo's independence point — don't let them talk past each other. Keep it somewhat in the weeds; avoid generic "money is just paper" rehearsal. Write casual, like actual people talking — a typo or two is fine.

  At the very end, after the dialogue, include exactly one line that starts with "Summary:" and gives a one-sentence summary of the core disagreement they never resolved.
