  Hmm, the user's core confusion seems to be about whether Bayesian credences are inherently diachronic—tied to an agent's state over time. They suggest that simply updating at t2 when learning GR predicts E should work without pretending to forget E. That's an insightful point! The user suspects the "problem" arises from conflating static logical probabilities with evolving credences. 

  I should validate their intuition—they're absolutely right that Bayesianism is fundamentally about diachronic credences. The textbook formulation of old evidence does mistakenly treat P(E) as fixed at 1 forever. But in reality, when you learn H entails E, you're gaining new information about the relationship between theories and evidence. 

  Wait—the user might be missing Garber's insight about updating on logical connections. The key isn't pretending to forget E, but recognizing that "H ⊨ E" is new evidence that reshapes your credence landscape. For example, even if I know Mercury's orbit (E), learning that GR mathematically implies E should boost my belief in GR, because it answers why E is true. 

  The roommate's objection about "changing priors" misunderstands counterfactual reasoning. Resetting isn't cheating—it's a tool to measure evidential impact by comparing hypothetical states. But the user's diachronic approach avoids that entirely by focusing on actual belief changes at t2. 

  I should emphasize coherence: nothing blocks the user's update. Van Fraassen's "belief contraction" (temporarily ignoring E) is one solution, but Garber's approach is cleaner. The deeper issue is recognizing that evidence isn't just facts—it's the explanatory links between facts and theories. 

  The user's instincts are sharp. Their solution is valid, and the "problem" largely stems from a narrow reading of Bayesianism. They might appreciate seeing how this connects to broader themes like explanatory power versus prediction.
answer: |-
  You've nailed the core tension in the old evidence problem. Your intuition is spot-on: **the standard formulation of the problem *does* stem from a confusion between static logical probability and diachronic credence, and your proposed solution is fundamentally correct and increasingly accepted among Bayesian epistemologists.** Here's the breakdown:

  1.  **The Roommate's Argument (Standard Formulation):**
      *   At time *t₂* (after GR is proposed), the agent *knows* E (Mercury's orbit anomaly) with certainty: P*ₜ₂*(E) = 1.
      *   Bayes' Theorem: P*ₜ₂*(H|E) = [P*ₜ₂*(E|H) * P*ₜ₂*(H)] / P*ₜ₂*(E) = [1 * P*ₜ₂*(H)] / 1 = P*ₜ₂*(H).
      *   Result: Learning that H entails E (i.e., H ⊨ E) provides *no confirmation* because P*ₜ₂*(E|H) = 1 and P*ₜ₂*(E) = 1. The Bayes factor is 1. Einstein gets no credit.

  2.  **The Flaw in the Standard Formulation:** It treats the agent's credence state at *t₂* as static and ignores the *diachronic process* of learning *new information* at *t₂*. The relevant "new evidence" isn't E itself (which is old), but the **new proposition L: "H logically entails E" (H ⊨ E)**.

  3.  **Your Correct Diachronic Solution:**
      *   **t₁:** You know E (Mercury's orbit). You have a low prior for GR: P*ₜ₁*(GR) = low.
      *   **t₂:** You learn **L: "GR logically entails the Mercury orbit anomaly" (GR ⊨ E)**. *This is new information*.
      *   **Update:** You rationally update your credence in GR *conditional on your total current evidence*, which includes E *and* L.
      *   **Why this makes sense:** Before learning L, you knew E, but you didn't know that GR *explained* E. Learning L tells you that if GR were true, E *must* occur. This increases the coherence of your belief system – GR now *explains* a known fact. It answers "Why is E true?" in a way your previous theories couldn't (or did poorly).

  4.  **The Mathematics of Updating on L:**
      *   You want P*ₜ₂*(GR | E, L).
      *   Because you *already know E*, this is equivalent to P*ₜ₂*(GR | L) – E is background knowledge.
      *   Crucially: **P*ₜ₂*(L | GR, E) > P*ₜ₂*(L | ~GR, E)**. Why?
          *   If GR is true (and you know E), then L ("GR ⊨ E") is almost certainly true (barring logical errors). P*ₜ₂*(L | GR, E) ≈ 1.
          *   If GR is false (and you know E), L *might* still be true (GR could be false but still entail E coincidentally), but it's much *less likely*. P*ₜ₂*(L | ~GR, E) is significantly less than 1.
      *   **Result:** Learning L *does* confirm GR relative to your background knowledge E. P*ₜ₂*(GR | L) > P*ₜ₂*(GR). Einstein *does* get credit. The Bayes factor is P*ₜ₂*(L | GR, E) / P*ₜ₂*(L | ~GR, E) > 1.

  5.  **Addressing the Roommate's Objections:**
      *   **"Counterfactual Prior Resetting is Cheating":** He's right that you can't *literally* forget E or change your actual historical prior. **But your solution doesn't require this!** You are updating on genuinely new information (L) *given your actual current knowledge state* (which includes E). No counterfactual forgetting is needed. You're just applying Bayes correctly to the proposition you *actually learned* at t₂ (L, not E).
      *   **"P(E) is 1, so no update":** This confuses the *agent's certainty* about E with the *logical or physical necessity* of E. Your certainty that E is true doesn't mean you are certain about *why* it's true or *which theories predict it*. Learning *why* it's true (via L) is informative.

  6.  **Is There a Coherence Constraint Blocking This?** **No.** Your diachronic update is perfectly coherent. The constraint "Never update on evidence you already know" is *not* a Bayesian principle. The correct principle is "Update on *all* new relevant information, *conditional* on what you already know." Learning L *is* new relevant information.

  7.  **Why the "Problem" Persists & Resolutions:**
      *   **Formalizing L:** The challenge lies in rigorously formalizing the proposition L ("H entails E") and assigning probabilities to it, especially P(L | ~H, E). How likely is it that a false theory entails a known true fact? This requires modeling the space of possible hypotheses and their entailments (often using logical omniscience as a limit or introducing "toy" hypothesis spaces).
      *   **Garber's Approach:** Daniel Garber formalized updating on L, showing confirmation occurs as long as P(L | H, E) > P(L | ~H, E). This is widely seen as the most satisfactory solution.
      *   **Belief Contraction (Van Fraassen):** The "counterfactual" approach (imagine not knowing E, calculate P(E|H)/P(E), then add E back) *can* work as a way to *measure* the *degree* of support E *would have provided* if it were new. It's a way to quantify *explanatory power*. It's not "cheating" for this purpose, but it *is* less direct than updating on L.

  **Conclusion:** You win the argument with your roommate. The old evidence problem arises primarily from misapplying Bayes' theorem by treating the agent's total evidence state at t₂ as fixed and failing to recognize that learning "H entails E" (L) *is* new evidence. Bayesianism, properly understood as diachronic updating on *all* new information (including information about logical relationships) *relative to current background knowledge*, handles old evidence correctly by updating on L. Einstein gets his well-deserved credit. Your insight about diachronic credence vs. static logic is the key.
