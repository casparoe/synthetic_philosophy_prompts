answer: |-
  Here’s a draft proposal focusing on your core hunch, structured for clarity and feasibility. I’ve kept it conversational but precise, as requested:

  ---

  # Independent Study Proposal: Darwin’s Unstable Hybrid – Evolutionary Functionalism and Moral Normativity in *The Descent of Man*

  **Research Question:**
  **Does Darwin’s account of morality in *The Descent of Man* (particularly Chapters III-V on social/moral faculties and IV-V on sexual selection) construct an implicit, unstable meta-ethical hybrid—simultaneously grounding morality in evolved social instincts *and* attributing intrinsic normative weight to aesthetic moral beauty and communal obligation—thereby explaining his apparent shifts between utilitarian and quasi-Kantian language?**

  *(The determinate answer sought is: Yes, this hybrid exists and is structurally identifiable, though unstable; OR No, the apparent tension resolves into either pure adaptationism, cultural contingency, or mere inconsistency without a discernible hybrid pattern.)*

  ## Why the Standard Readings Leave This Tension Open (The Gap)
  Existing interpretations tend to fall into two camps:

  1.  **Adaptationist/Functionalist:** Reads Darwin as *reducing* morality entirely to evolved social instincts (e.g., parental care, group cohesion) selected for their survival value. This flattens passages where Darwin describes moral *beauty* or duty as compelling *in themselves*, irrespective of immediate survival benefit (e.g., praising self-sacrifice for strangers).
  2.  **Cultural-Evolution/Victorian Context:** Emphasizes Darwin’s Victorian milieu, reading his moral pronouncements as culturally contingent values merely *dressed* in evolutionary language. This downplays the genuine normative *force* Darwin seems to ascribe to evolved moral sentiments *even after* rejecting supernatural foundations (as seen in his private writings on religion).

  **Both approaches miss the specific weirdness:** Adaptationism can't easily digest the non-instrumental language of beauty and intrinsic duty, while the cultural-context view struggles to explain why Darwin insists these sentiments arise *from* and retain a connection to *biological* evolution, yet seem to possess a normative "ought" that transcends mere "is" of survival. They leave the *co-existence and friction* between the functional and normative elements unresolved and unexplored as a distinct feature of Darwin's thought.

  ## The Method: Close Reading, Comparative Analysis, Contextual Checks
  **(One Semester Plan - ~14 Weeks)**

  *   **Weeks 1-3: Foundation & Framing**
      *   Re-read key chapters in *Descent* (III, IV, V, focusing on moral sense, social instincts, sexual selection's role in morality, group selection arguments). Annotate *all* instances of language describing moral motivation, obligation, beauty, duty, "ought," "desirable," "noble," etc.
      *   Revisit *Origin* (esp. Chs. III-IV on Natural Selection) to solidify understanding of Darwin's core evolutionary logic for traits (variation, heritability, differential survival/reproduction).
  *   **Weeks 4-6: Mapping the Hybrid in *Descent***
      *   Intense close reading of selected passages from Weeks 1-3. Categorize arguments/language: Which passages frame morality *primarily* in terms of **evolutionary function/utility** (e.g., "useful to the tribe")? Which emphasize **intrinsic qualities/aesthetic normativity** (e.g., "higher" motive, "nobler" character, beauty of virtue) or **deontic elements** (e.g., "imperious" sense of duty/obligation to the group)?
      *   Analyze *how* these elements interact: Does one dominate? Are they blended? Does Darwin seem unaware of the tension? Does he try (and fail?) to reconcile them?
      *   Pay special attention to the role of **sexual selection** (Chs. IV-V, XXI). Does the logic of aesthetic preference ("beauty for beauty's sake") provide a model for understanding the non-utilitarian aspects of moral admiration? How does "moral beauty" fit into sexual selection's framework?
  *   **Weeks 7-8: Testing Against the Core Mechanism**
      *   Compare the "moral normativity" language identified above with the logic of selection in *Origin*. Where does it fit? Does Darwin stretch the selectionist framework (e.g., via group selection) to accommodate it? Or does the normative language operate *alongside* or even *outside* strict selectionist explanation?
      *   Specifically examine passages on "group selection" – is the normative weight located *within* this mechanism, or does it attach to the *outcome* (group benefit) regardless of mechanism?
  *   **Weeks 9-10: Private Writings - Consistency Check (Not Authority)**
      *   Consult selected letters and notebooks concerning Darwin's views on religion, God, and the foundation of morality (e.g., key passages from his *Autobiography*, correspondence with Lyell, Hooker, Moritz Schiff, relevant entries in *Notebooks M & N*).
      *   **Crucial:** Treat these *not* as the "true" meaning overriding *Descent*, but as a check for consistency in his *struggle* with grounding morality without the supernatural. Do they reflect the *same tension* observed in *Descent*? Does he explicitly acknowledge the non-instrumental pull of morality even without divine command? Does he try to fold it back into naturalism?
  *   **Weeks 11-13: Synthesis & Writing**
      *   Integrate findings: Can the functionalist and normative strands be mapped systematically? Is there a discernible hybrid structure (e.g., instincts *provide the foundation*, but aesthetic/group-selective pressures *imbue them with normative weight*)? Where does the instability lie (e.g., unresolved conflict between individual/group benefit, "is/ought" leap)?
      *   Draft the analysis, focusing on answering the research question based on the textual evidence gathered.
  *   **Week 14: Revision & Polish**
      *   Refine arguments, ensure clarity on the hybrid thesis, solidify success/failure criteria met.

  ## What a Result Looks Like & What Counts as Failure

  *   **Success (Hybrid Identified):** A clear demonstration that:
      1.  Darwin employs *both* functionalist/adaptationist *and* non-instrumental normative (aesthetic/deontic) modes of reasoning about morality.
      2.  These modes co-exist in an identifiable (though logically tense) relationship within the text (e.g., function as ground, normativity as emergent quality; aesthetic selection as parallel model; group benefit carrying intrinsic normative weight).
      3.  This hybrid structure explains the apparent shifts in his language (utilitarian vs. quasi-Kantian). Mapping might show one logic dominating discussions of *origin* (functional) and the other dominating discussions of *experience/motivation* (normative), or show them intertwined in specific arguments (like moral beauty).
  *   **Failure:**
      *   **Dissolution:** The tension proves illusory; one mode consistently subordinates the other (pure adaptationism wins, or it's just Victorian dressing).
      *   **Contradiction without Pattern:** The conflicting passages are simply inconsistent lapses with no underlying structural relationship or rationale for their co-occurrence.
      *   **Misattribution:** The normative language is demonstrably *only* rhetorical flourish with no substantive role in his argument, or solely reflects uncritically adopted cultural views.
      *   **Inconclusive:** The evidence is too ambiguous to strongly support *or* refute the hybrid thesis.

  ## Honest Scope Check & Contingency Plan

  *   **Why it's Doable (One Semester):**
      *   **Focused Primary Text:** *Descent of Man* is the core. We're not tackling Darwin's entire oeuvre or the full history of evolutionary ethics.
      *   **Targeted Chapters:** Concentrating on Chs. III-V (morality/social instincts) and IV-V/XXI (sexual selection/moral beauty) avoids getting lost in the whole book.
      *   **Limited Private Writings:** Checking specific, well-known letters/notebooks on religion/morality, not a comprehensive archival dive.
      *   **Method Clarity:** Close reading and comparative analysis are established, manageable techniques for this timescale.
  *   **What Gets Cut if Time Runs Short:**
      *   **Deep Dive into Group Selection Debate:** Analyze Darwin's *use* of it normatively, but avoid getting bogged down in modern critiques or the full complexity of the biological debate.
      *   **Broader Victorian Context:** Minimize extensive contextualizing beyond what's necessary to counter the "mere Victorianism" claim. Focus is on Darwin's *textual* logic.
      *   **Comprehensive Private Writings:** Stick to the most directly relevant and accessible letters/notebook entries. If pressed, prioritize the *Autobiography* reflections and key letters explicitly discussing morality sans God.
      *   **Full Comparison with *Origin*:** Ensure understanding of core selection logic, but avoid an exhaustive re-analysis of *Origin* beyond the necessary comparative points.
      *   **Exploration of Later Influences:** No tracing how this hybrid might influence later thinkers (e.g., Romanes, Huxley, James). Stay focused on Darwin's text.

  **Bottom Line:** This project isolates a specific, underexplored tension within a defined section of one major text, using manageable methods. It leverages existing scholarship by pinpointing a gap within their interpretations. Success means revealing a richer, stranger Darwin; failure clarifies the limits of his meta-ethical coherence on this point. Either outcome is valuable.

  ---

  **Key things this draft does:**

  1.  **Sharpens the Question:** Makes it specific and answerable by focusing on the *hybrid* and its *structural presence/pattern* (or lack thereof) in defined parts of *Descent*.
  2.  **Defines the Gap:** Explicitly states how adaptationist and cultural-contextual readings *specifically* overlook the normative/aesthetic elements *co-existing* with functionalism.
  3.  **Lays Out a Concrete Method:** Provides a realistic, phased timeline with specific tasks and texts for each phase, emphasizing close reading and comparative checks while cautioning about the private writings.
  4.  **Sets Clear Success/Failure Criteria:** Defines what proving the hybrid looks like (mapping the logics) and what failure looks like (dissolution, contradiction, misattribution).
  5.  **Acknowledges Scope Realistically:** Explicitly states why it's one-semester feasible (focused text, defined chapters, limited secondary/context) and clearly prioritizes what gets cut first if needed (group selection debate rabbit hole, excessive context, less critical private writings).
  6.  **Keeps it Casual(ish):** Avoids excessive jargon (using terms like "weirdness," "flattens," "struggle"), uses direct language, and focuses on the core argument flow. It's draft-ready for advisor feedback.

  Now go add those citations and flesh out the specifics of *which* letters/notebooks you'll prioritize! Good luck!
