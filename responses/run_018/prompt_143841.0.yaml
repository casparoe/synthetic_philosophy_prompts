  Hmm, this is fascinating because it sits at the intersection of historical rigor and artistic license. The user clearly wants something actionable for non-philosophers, so I need to avoid academic jargon while capturing nuanced ethical distinctions. The three test cases they provided (scientist, politician, borderline scenario) suggest they're aware of gray areas and want the procedure to flag them explicitly.

  First, I should define the core tension: narrative necessity vs. historical integrity. The procedure must distinguish between compression (acceptable) and distortion (unacceptable). The scientist's omitted failed experiments seem like clear compression—those failures don't alter the core scientific contribution. But the politician's invented religious crisis? That's distortion because it swaps the documented rationale for a fictional one, warping the "why" behind a historical decision.

  For the borderline case... maybe a composite character where the procedure technically fails but the board might approve? Like merging two activists into one for clarity, even if it slightly oversimplifies a movement. The procedure should catch this as distortion but acknowledge scenarios where minimal harm might justify it.

  Key design challenges: 
  - How to operationalize "causal/moral architecture"? I'll frame it as the documented motives and consequences shaping public perception. 
  - Judgment points must be explicit—e.g., "does this invention alter the primary historical drivers?" 
  - Need to collapse distinctions like "private vs. public" since internal states are often speculative anyway. Focus on whether the invention contradicts known evidence.

  The user's hidden need might be defensibility—they want clear audit trails for decisions, hence the emphasis on "reusable" and "step-by-step." Also, they likely dread board deadlocks, so the procedure must identify unmakable calls (e.g., when sources conflict). 

  For the worked examples: 
  - Scientist case should pass easily (Step 3: omission doesn't change causality). 
  - Politician fails hard at Step 4 (invents motive that flips the narrative). 
  - Borderline case (say, compressing a protest movement) might fail Step 3 but get overridden if distortion is minimal. I'll make this about composite characters to show the tension.

  Finally, I'll add explicit flags: "Judgment Required" at motive assessment, and "Unresolvable" when sources are contradictory. The procedure won't solve everything—it's a framework for debate, not a calculator.
answer: |-
  Here’s a step-by-step procedural framework for evaluating invented scenes in historical dramas, designed for practical application by non-philosophers. It prioritizes **representational fidelity** (preserving causal/moral architecture) over literal accuracy.

  ---

  ### **Ethics Review Procedure: Representational Fidelity Test**
  **Guiding Principle**: Does the invention distort *why* the person acted as they did or *how* their actions are historically significant? Permissible inventions streamline facts; impermissible ones reconfigure historical causality or moral agency.

  #### **Ordered Tests**  
  *(Apply sequentially; failure at any step may reject the scene)*  

  1. **SOURCE ANCHOR TEST**  
     *Is the scene’s core event/decision documented in reliable historical sources?*  
     - **Pass**: The event/decision is attested (e.g., treaty signing, experiment outcome, resignation).  
     - **Fail**: Entire event is fictional.  
     - **Judgment**: N/A (binary).  

  2. **NECESSITY & TRANSPARENCY DECLARATION**  
     *Does the creator justify the invention as essential for narrative coherence/accessibility, and commit to disclosing inventions (e.g., credits disclaimer)?*  
     - **Pass**: Justification + disclosure plan provided.  
     - **Fail**: No justification or refusal of disclosure.  
     - **Judgment**: Minimal (assess plausibility of justification).  

  3. **CAUSAL ARCHITECTURE TEST**  
     *Does the invention alter the *primary documented causes* or *significant consequences* of the event?*  
     - **Pass**: Omissions/compressions retain the "why" (e.g., skipping failed trials but showing perseverance).  
     - **Fail**: Inventions change the key drivers (e.g., replacing political strategy with personal grudge).  
     - **Judgment**: High (requires historical analysis).  

  4. **MORAL AGENCY TEST**  
     *Does the invention materially distort the figure’s *character-defining values, virtues, flaws, or historical role*?*  
     - **Pass**: Shows consistent virtues/flaws within documented range (e.g., amplifying known empathy).  
     - **Fail**: Attributes motives/beliefs contradicting their record (e.g., pacifist portrayed as secretly bloodthirsty).  
     - **Judgment**: High (assess alignment with historical persona).  

  5. **AUDIENCE MISDIRECTION TEST**  
     *Would a reasonable viewer, informed by the disclaimer, *mistake invention for historical consensus*?*  
     - **Pass**: Invention doesn’t mimic unresolved scholarly debates.  
     - **Fail**: Presents speculative fiction as settled fact.  
     - **Judgment**: Moderate (requires audience perspective simulation).  

  ---

  ### **Worked Applications**  
  #### **Case 1: Scientist’s Elided Failed Experiments**  
  - **Step 1**: Pass (Successful discovery is documented).  
  - **Step 2**: Pass ("Pacing" justified; disclaimer planned).  
  - **Step 3**: **Pass** (Omitted failures don’t alter *cause* of success—perseverance is still shown).  
  - **Step 4**: Pass (No distortion of persistence/intellect).  
  - **Step 5**: Pass (Viewers understand editing for brevity).  
  - **Verdict**: **Permissible** (Narrative compression).  

  #### **Case 2: Political Leader’s Invented Religious Crisis**  
  - **Step 1**: Pass (Policy reversal is documented).  
  - **Step 2**: Pass ("Dramatic arc" justified; disclaimer).  
  - **Step 3**: **Fail** (Documented cause: pressure from allies. Invention *replaces* it with religious doubt, altering causal logic).  
  - **Step 4**: Fail (Attributes unverified piety, contradicting known secular persona).  
  - **Verdict**: **Impermissible** (Structural distortion).  

  #### **Case 3: Borderline Case (Composite Character)**  
  *Scene merges two minor activists into one "representative" figure to streamline a protest movement. Historical consensus treats both as morally courageous.*  
  - **Step 1**: Pass (Movement events documented).  
  - **Step 2**: Pass (Clarity justification; disclaimer).  
  - **Step 3**: Fail? (Compression erases individual agency—minor distortion of "how" the movement operated).  
  - **Step 4**: Pass? (If composite retains accurate values).  
  - **Step 5**: Fail? (Viewers might assume one person did both roles).  
  - **Verdict**: **Procedure Rejects** (distorts historical granularity) — **But Board May Override** if:  
    - Movement’s *collective* moral cause is preserved.  
    - Individuals are not historically pivotal.  
    - Override grounds: Pedagogical value for showing grassroots dynamics outweighs minor distortion.  

  ---

  ### **Limitations & Judgment Flags**  
  | **Aspect**               | **Handling in Procedure**                                                                 |
  |--------------------------|-------------------------------------------------------------------------------------------|
  | **Unavoidable Judgment** | • Step 3/4: Assessing "primary causes" or "character-defining" traits (requires historical expertise).<br>• Step 5: Defining "reasonable viewer." |
  | **Deliberate Collapses** | • Private vs. public motives: Focuses on *documented impact*, not unknowable internals.<br>• Minor vs. major figures: Applies same tests (but severity varies). |
  | **Unresolvable by Procedure** | • Contradictory historical sources.<br>• Figures with contested legacies (e.g., revolutionaries vs. terrorists).<br>• *Requires board vote informed by historiographical context.* |

  ---

  ### **Key Implementation Notes**  
  1. **Historical Consultant Input**: Mandatory for Steps 3/4 to verify "documented" causes/traits.  
  2. **Override Mechanism**: If procedure rejects a scene but board approves, require:  
     - Supermajority vote.  
     - Enhanced disclaimer (e.g., "This scene dramatizes debated theories").  
  3. **Document Rationale**: Record why judgment calls were made (e.g., "X historian’s biography was primary source for Step 4").  

  This procedure prioritizes the *functional historical legacy* of the deceased while permitting artistic efficiency, centering on what truly shapes collective memory: the why and the moral weight of actions.
