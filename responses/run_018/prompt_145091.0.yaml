  **COURSE CATALOG: SPRING SEMESTER**  
  **PHIL 404: MODAL REALISM PRACTICUM**  
  *(Cross-listed as PHYS 799: MULTIVERSE ACCOUNTING)*  

  **Course Description:**  
  This practicum operationalizes David K. Lewis’s thesis of concrete possible worlds for academic assessment. Students will undertake identical examinations across a non-denumerable plurality of causally isolated worlds where their counterparts (defined by qualitative similarity under counterpart relations §7.1b) simultaneously complete coursework. Per Registrar Policy 8.4.3α, transcripts are transworld documents; thus, final grades reflect a weighted aggregation of all counterpart performances.  

  **Evaluation Methodology:**  
  - **Modal GPA (mGPA):** Calculated via the formula:  
    **∑(w_i × G_w_i) / ∑w_i**  
    where *w_i* represents the world-weight (inversely proportional to dissimilarity from the actual world) and *G_w_i* is the grade achieved by the student’s counterpart in world *i*.  
  - **Tuition Structure:** Billed per world inhabited by a course-enrolled counterpart (flat fee: $5,240/world). Payment plans accommodate ontological bloat (see Bursar Form F-Ψ).  
  - **Incompletes:** Granted only if *every* counterpart fails to submit work (probability: ≈0).  

  **Administrative Notes:**  
  1. **Transcript Discrepancies:** Students receiving failing grades may petition for "local success verification" by submitting notarized affidavits from counterparts in passing worlds (Form T-88). Processing fee: $75/affidavit.  
  2. **Graduation Requirements:** Department Chairs will compute mGPAs across *all* courses taken in all worlds. Note: A student failing here may graduate *simpliciter* if a sufficiently similar counterpart succeeds elsewhere (cf. Subsection 12.5: "Degrees in the Pluriverse").  
  3. **Billing Statements:** Itemized by world-ID (e.g., *W_738,002*: "Intro to Ethics – Failed – $5,240"). Over 10^6 worlds? Contact AR/AP Multiverse Desk for bulk payment options.  

  **Prerequisites:** PHIL 303 (Metaphysics) or Permission of Instructor. *Warning:* Students claiming "I didn’t take this exam in *my* world" must file a Counterpart Identity Dispute (CID) with the Registrar within 72 hours post-exam, subject to qualitative similarity review (§3.2). Late forms incur a 15% ontological surcharge.  

  **Learning Outcomes:**  
  Upon completion, students will:  
  - Distinguish personal identity from counterpart relations in academic contexts.  
  - Calculate probabilistic tuition liability across possible worlds.  
  - Recognize that all outcomes—passing or failing—are *equally actual* at the transworld level.  

  **Registrar’s Addendum:**  
  Per Faculty Senate Ruling 44, instructors are forbidden from announcing "No one truly fails!" during grade distribution. Violations risk triggering campus-wide Modal Collapse Protocols.  

  ---  

  **SATIRE FAIRNESS ASSESSMENT**  
  **Argument/evidence that might change my view:**  
  If Lewis explicitly endorsed *practical applications* of modal realism to institutional logistics (e.g., suggesting grades could meaningfully aggregate over worlds), this parody would be unfair. His work treats possible worlds as theoretical tools for analyzing modality, not operational frameworks for bursars.  

  **Where my reasoning likely fails:**  
  1. **Misplaced Literalism:** Lewis never claimed concrete worlds impact *actual* administrative systems. The satire attacks a strawman by literalizing his metaphysics.  
  2. **Ignoring Abstraction:** Lewis’s theory addresses philosophical problems (e.g., modality, properties), not pedagogy. Mocking its "bureaucratic" implications misses its theoretical purpose.  
  3. **Counterpart ≠ Identity:** Lewis’s counterparts aren’t *you* in other worlds but qualitative approximations. Transcripts tracking "you" specifically wouldn’t reference counterparts.  

  **Conclusion:** The parody is fair as a reductio of *naive literal interpretations* of modal realism, but fails against Lewis’s actual, rigorously abstract framework.
