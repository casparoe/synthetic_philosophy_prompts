prompt: |-
  Okay so I'm a novelist, working on a story about a shipyard town where the same boat gets rebuilt over and over, and I kept noticing this weird double standard in how people talk about 'the same thing' that I can't find a word for. Let me lay out the pattern with a couple concrete examples.

  First, take a physical object — like my protagonist's old fishing boat — where every plank, nail, and rope gets replaced slowly over years. Most people say it's still her boat, just restored. But then if you gather all the original rotten planks and nails and rebuild them into an identical boat across the harbor, suddenly everyone points at that second one and says no, thats the real one, like the gradual replacement was just a slow kind of theft. That's the classic ship puzzle, I get that.

  But here's the part that confuses me: flip the category from wood and metal to people and roles. Imagine a theater troupe — call them the Driftwood Players — that replaces every actor and stagehand one by one over a decade, but keeps the same name, same theater, same schedule. People say sure, it's still the Driftwood Players. Now imagine the opposite: all the original cast and crew get fired, leave together, and start a rival company in a different town with a new name but the same plays. In that case people treat the fired group as carrying thier real identity — 'the original Driftwood people' — and the old theater with new hires is just a shell wearing the name.

  So depending on whether we're dealing with physical parts or social members, we reverse which path — continuous replacement or reassembly of originals — counts as preserving the thing. Is there an established name for that reversal? Or for the broader pattern where our intuition about same object depends on whether we treat the parts as carrying the essence versus the structure carrying it? I'm not looking for a bare label; I want to know exactly what the phenomenon covers, where it breaks down, and how it's different from just essentialism or functionalism thrown around loosely. If there's no term, can you coin one with clear edges and boundary cases? I'd rather understand the carving than memorize a word.
reasoning: |-
  Okay, the user is a novelist working on a story set in a shipyard town, focusing on the theme of identity through the repeated rebuilding of a boat. They've noticed a double standard in how people perceive "the same thing" across physical objects versus social groups. Specifically, they provided two scenarios: one with a boat where gradual replacement is seen as preservation, while reassembling original parts creates a new "real" version. The other scenario involves a theater troupe where gradual replacement maintains identity, but the original members leaving and reforming elsewhere are seen as the "real" group. 

  The user is pointing out a reversal in criteria: for physical objects, structure (like the boat's form and function) seems to define identity, while for social groups, the "essence" lies in the original members. They want to know if there's a term for this phenomenon or if they need a newly coined term with clear boundaries. They're not just after a label but a deep understanding of how this works, where it applies, and how it differs from broad concepts like essentialism or functionalism.

  First, I need to validate their observation. The Ship of Theseus paradox is the classic example for physical objects, but the social group scenario flips it. The key difference is context: physical objects are often judged by continuity of form and function, while social groups are judged by continuity of people. 

  The user is likely looking for a way to articulate this in their novel, so they need precise terminology. They mentioned essentialism and functionalism but want to avoid loose usage. I should explain why this reversal happens. For physical objects, we prioritize the object's role and location (the boat remains functional in the same context), so continuity of existence matters. For social groups, identity is tied to the people because their relationships and shared history create the group's essence. The structure (theater name, schedule) is secondary.

  Now, is there an existing term? "Continuity of identity" is too vague. "Persistent entity framework" might work but isn't standard. Coining a term seems necessary here. "Substance-Context Reversal" could capture the shift from material parts (substance) to setting and function (context) in physical objects versus the opposite in social groups. Another option is "Constituency-Frame Duality," emphasizing the parts (constituents) versus the structure (frame). The user needs clear boundaries, so I'll outline where this applies and where it breaks down.

  Boundary cases: Hybrid entities like universities or businesses might blur the lines. For example, a company replacing all employees might still be seen as the same if the brand persists, but if the original founders start a new venture, they might be seen as the "real" company. This depends on whether identity is tied to institutional structure or people. Also, entities with symbolic significance, like a family heirloom, might prioritize original materials over function.

  The user's deeper need is to explore identity and continuity themes in their story. Understanding this duality can add layers to their narrative, showing how characters perceive what's "real." They might also want to highlight societal contradictions or personal attachments. Providing a coined term with clear edges helps them consistently apply this concept in their writing, making the theme more impactful.
answer: |-
  You've brilliantly pinpointed a fascinating and under-discussed asymmetry in how we attribute "sameness" or identity. There isn't a single, universally accepted term for this *specific reversal*, but the core phenomenon is well-recognized in philosophy, particularly metaphysics and philosophy of identity. Let's break it down:

  1.  **The Core Pattern:**
      *   **Physical Objects (Boat):** Identity is preserved through **spatiotemporal continuity and functional persistence within a specific context.** The boat *remains* the boat in its original location, performing its original function, even as its parts change. The reassembled original parts are seen as a *copy* or a *new object* because they lack this continuous existence in the original role and place. The *structure and function in context* dominate.
      *   **Social Groups/Organizations (Theater Troupe):** Identity is preserved through **continuity of key constituents (people) and their shared history/intentionality.** The Driftwood Players *remain* the Driftwood Players because the name, location, and structure persist, *even if the people change*. The fired group, carrying the shared history and original intentionality, is seen as the "true essence" even in a new location/structure. The *constituents and their collective identity* dominate.

  2.  **Why the Reversal Happens:**
      *   **Different "Glue":** For physical artifacts, the "glue" holding identity together is primarily the object's *role and location in a functional system*. Its identity is tied to its *position* and *purpose* in the world. For social groups, the "glue" is the *relationships, shared experiences, intentions, and commitments* of the members. The structure (name, building, schedule) is a *framework* for that social entity, not the entity itself.
      *   **Essence vs. Accidental Properties:** We intuitively assign different essential properties.
          *   *Boat:* Essence = Function + Continuous Existence in Role/Location. Accidental = Specific planks/nails.
          *   *Theater Troupe:* Essence = The Collective of People + Shared History/Purpose. Accidental = Specific theater building, name (to a degree - the name *signifies* the collective), schedule.
      *   **Agency & Intentionality:** Groups possess agency and intentionality derived from their members. A boat does not. We trace the identity of the *agentic entity* (the troupe) along the path of the people who possess that agency and history. The building and name lack agency.

  3.  **Established Concepts & Why They Aren't Perfect Fits:**
      *   **Essentialism:** This is the broader idea that things have an essential nature. Your examples *show* essentialism at work, but they reveal *how our assignment of essence differs drastically* between artifact types and social groups. Essentialism alone doesn't capture the *reversal*.
      *   **Functionalism:** Focuses on the role or function defining identity. This explains the boat (same function/location persists) but fails for the troupe – the original group in a new town performing the same plays *isn't* considered the Driftwood Players. The function (performing plays) isn't sufficient; the specific *social entity* matters more.
      *   **Sortal Relativity:** Identity depends on the *kind* of thing we're considering (a "ship" vs. a "collection of planks"; a "theater company" vs. a "group of actors"). This is crucial! The reversal happens precisely because artifacts and social groups are different *sorts* or *kinds* of entities, demanding different identity criteria.
      *   **Continuity Theories:** Emphasize continuous existence over time. Both cases involve continuity, but of *different aspects*: continuity of the *object-in-place* (boat) vs. continuity of the *constituent-members* (troupe).

  4.  **Coining a Term: "Constituency-Frame Duality" (or "Substance-Context Reversal")**
      *   **Constituency-Frame Duality:**
          *   **Constituency:** The parts perceived as carrying the core identity (the people in the troupe, the *original* planks in the reassembled boat).
          *   **Frame:** The persistent structure, context, name, or function holding the entity together (the boat's form/location/role, the troupe's name/theater/schedule).
          *   **Duality:** The reversal highlights that for some entity types, identity clings to the *constituents*, while for others, it clings to the *frame*.
          *   **Clear Edges:**
              *   *Applies to:* Entities where identity is contested after part replacement or reassembly. Requires a distinction between "parts" and "the whole structure/context".
              *   *Strong Cases:* Physical artifacts vs. Social groups (as per your examples). Also applies to: Biological organisms (constituency-focus - replace all cells, still *you*), vs. certain institutions (can be frame-focused, like a university persisting through centuries of faculty/student turnover).
              *   *Boundary Cases/Breakdown:*
                  *   **Highly Symbolic Artifacts:** The Crown Jewels. Replacing stones with replicas might be seen as destroying the *real* thing, shifting towards constituency (the original materials *are* the essence). Here, symbolic/historical value overrides functional persistence.
                  *   **Institutions with Founders:** A company like Apple. If *all* original employees/founders left and started "Apple Core," while new hires ran Apple Inc., which is the "real" Apple? Likely the frame (brand, legal entity, infrastructure) dominates *unless* the founders carry immense symbolic weight (a boundary case). Apple Inc. keeps the identity.
                  *   **Families:** Gradual replacement (children growing, partners joining) is seen as the *same family* (frame: name, lineage, home?). If the original members all left together and declared themselves "The Real Smiths," would they be? Usually not – the frame (household, lineage structure) dominates. This leans *towards* the artifact model.
                  *   **Software/Data:** Is a constantly updated program the "same" program? (Frame: name, function, compatibility). Is a dataset migrated to a new format the "same" data? (Constituency: the core information bits). Leans frame for software, constituency for pure data.
              *   *Key Differentiator:* Does the entity's perceived essence reside primarily in its *constituent parts/members* or in its *persistent structure/context/function*? The duality manifests in the reversal of which path (gradual replacement vs. reassembly) preserves identity based on the entity type.

      *   **Substance-Context Reversal:**
          *   **Substance:** The material parts or members perceived as the "stuff" of the entity.
          *   **Context:** The location, function, role, name, or structure surrounding the substance.
          *   **Reversal:** For artifacts, identity follows the *context*; for social groups, identity follows the *substance* (the people).
          *   *Similar edges/breakdowns as above.*

  5.  **Why "Constituency-Frame Duality" is Preferable:**
      *   "Substance" can be misleading for social groups (people aren't just "stuff").
      *   "Frame" nicely captures the structural, contextual, and often nominal aspects that persist.
      *   "Duality" emphasizes the contrasting principles at play depending on the entity's nature.
      *   It directly addresses the *reversal* you observed: When is identity bound to the parts (constituents)? When is it bound to the whole structure/role/name (frame)?

  **Conclusion:**

  You've identified **Sortal-Relative Identity Attribution** manifesting as a **Constituency-Frame Duality**. The "same thing" judgment reverses because we intuitively apply different metaphysical criteria based on the *kind* of entity we're dealing with:

  1.  **Artifact/Functional Kinds (Boat):** Identity prioritizes **Frame Persistence** (continuous existence in role/location/function/structure). Gradual replacement preserves identity; reassembly of originals creates a new instance.
  2.  **Social/Agentic Kinds (Troupe):** Identity prioritizes **Constituency Persistence** (continuity of key members, shared history, and intentionality). Gradual replacement preserves identity *if the frame holds*; reassembly of original constituents *elsewhere* is seen as carrying the core identity, making the frame-with-new-constituents a "shell".

  This duality breaks down at boundaries where symbolic value, legal status, or the nature of the entity itself blurs the lines (e.g., sacred relics, foundational institutions). Understanding this "carving" – *why* we flip the criteria – gives you powerful tools as a novelist. You can explore characters who challenge these intuitions, situations where the boundaries blur tragically or comically, and the fundamental tension between structure and substance, name and named, in defining what (and who) truly "is" the same.
