answer: |-
  You've nailed two profound tensions at the heart of Madhyamaka dialectics. Let's break this down systematically:

  ### 1. Why the Fourth Lemma (Neither Is Nor Is Not) Doesn't Reify Absence (or Smuggle Back Existence)
  The key lies in understanding **śūnyatā as *prapañcopaśama* (the cessation of conceptual proliferation)**, not an ontological assertion.

  *   **The Trap of Reification:** Your worry is valid. If we say "X neither exists nor doesn't exist," it *feels* like we're positing a mysterious third category ("neither-ness"). Nagarjuna’s move is precisely to dismantle *any* conceptual foothold.
  *   **The *Reductio ad Absurdum* Engine:** Remember, Nagarjuna applies rigorous *prasaṅga* (consequentialist) reasoning to *each* lemma. He doesn't affirm the fourth position; he demonstrates the *incoherence* of the first three, leaving the fourth as the logical residue of that demolition.
  *   **Negative Dialectic, Not Positive Ontology:** "Neither exists nor does not exist" is **not** a description of reality. It's:
      *   A **diagnostic marker** showing the limitations of the concepts "existence" (*bhāva*) and "non-existence" (*abhāva*) *as applied to dependently arisen phenomena*.
      *   A **therapeutic injunction** against clinging to *any* conceptual extreme (*anta*), including the subtle extreme of clinging to "neither-ness" itself.
  *   **The Svabhava Test (Applied to the Fourth Lemma):**
      *   If "neither exists nor doesn't exist" were a *true* description *with inherent nature (svabhāva)*, it would need to be:
          *   Independent: But it's entirely dependent on and defined in opposition to the first three lemmas.
          *   Unchanging: But it only arises contextually to counter rigid views.
          *   Self-established: But its meaning derives solely from negating the others.
      *   **Conclusion:** The fourth lemma itself is *empty* of inherent nature. It's a conceptual tool (*upāya*), not a final truth. To cling to it *as a position* is to fall back into error (this is the famous "emptiness of emptiness" *śūnyatā-śūnyatā*).
  *   **Avoiding the Back Door:** Nagarjuna avoids reification by:
      1.  **Exhausting Conceptual Options:** He shows *all* possible ways of conceptually grasping "existence" (including "neither") lead to absurdity when applied to conditioned things.
      2.  **Pointing Beyond Language:** The fourth lemma functions as a **silencing device**. Its purpose is to stop the mind from conceptually proliferating (*prapañca*) about inherent existence *or* inherent non-existence. It points to the inexpressible reality (*tathatā*) beyond dichotomies.
      3.  **Contextualizing Convention:** After this deconstruction, conventional reality (*saṃvṛti-satya*) is reinstated *without ontological commitment*. The table "exists" dependently, for practical purposes, but lacks inherent existence. The fourth lemma prevents us from *mistaking* this conventional existence for ultimate reality.

  ### 2. Applying the Tetralemma to Normative Properties (e.g., Justice)
  This is where it gets fascinating and your tension is spot-on. Let's apply the dialectic:

  *   **Lemma 1: Justice inherently exists (has svabhāva).**
      *   *Prasaṅga:* Where is this "justice"? Is it a universal Form? A neural pattern? A social contract? If it inherently exists, why do cultures/historians fiercely disagree on its content? Its manifestation depends entirely on specific cultures, laws, historical contexts, and individual interpretations. It lacks independence and self-definition. *Rejected.*
  *   **Lemma 2: Justice inherently does not exist (is pure abhāva).**
      *   *Prasaṅga:* This renders normative discourse nonsensical. Why argue, legislate, or revolt for "justice" if it's utterly non-existent? We *experience* demands for justice, build institutions around it (however imperfectly). Its *effects* in the conventional world are undeniable, even if contested. *Rejected.*
  *   **Lemma 3: Justice both inherently exists and does not inherently exist.**
      *   *Prasaṅga:* This combines the contradictions of 1 & 2. How can something *simultaneously* be inherently real and inherently unreal? This is logically incoherent regarding *inherent nature*. *Rejected.*
  *   **Lemma 4: Justice neither inherently exists nor inherently does not exist.**
      *   *The Resolution:* This points to the emptiness of justice. Its "existence" is:
          *   **Conventionally Real:** It functions powerfully within human discourse, motivation, and social structures (*saṃvṛti-satya*). We *must* use the concept meaningfully.
          *   **Ultimately Empty:** It lacks inherent, self-defined, context-independent essence (*svabhāva*). There is no "Justice-in-itself" discoverable apart from the web of human conventions, emotions, power dynamics, historical contingencies, and biological underpinnings that give it meaning and force.

  **Why the Dialectic Doesn't Collapse:**

  1.  **Conventional Agreement ≠ Inherent Existence:** Just because a concept (like justice) *functions* conventionally due to agreement doesn't mean it possesses *svabhāva*. Its conventional existence is *itself* dependently arisen (*pratītyasamutpanna*). The agreement itself is contingent, shifting, and lacks inherent foundation.
  2.  **The Target is *Svabhāva*, Not Utility:** The tetralemma targets the *inherent, independent, self-established existence* we unconsciously project onto concepts. Normative discourse *depends* on the concept of justice functioning conventionally. Nagarjuna doesn't deny this functional reality; he denies its *ultimate, independent grounding*. The tension you feel is *precisely* the tension between the two truths.
  3.  **Deconstruction Enables Engagement (Paradoxically):** Seeing justice as empty (*śūnya*) doesn't destroy its conventional force; it *liberates* it. We are freed from:
      *   Dogmatism: No single conception can claim ultimate, inherent truth.
      *   Nihilism: Its conventional power and necessity aren't denied.
      *   Reification: We recognize our conceptions are tools, shaped by conditions, not reflections of ultimate reality.
      *   This allows for more flexible, compassionate, and context-sensitive engagement with normative concepts precisely *because* we don't cling to them as absolutes.

  **The Tension You Feel:**

  This tension is **essential and productive**. It's the dynamic between:

  *   *Paramārtha-satya (Ultimate Truth):* The emptiness (*śūnyatā*) of all phenomena, including normative concepts – no inherent existence.
  *   *Saṃvṛti-satya (Conventional Truth):* The world of dependent arising, where concepts like justice, though empty, function with undeniable practical consequences and demand our engagement.

  Nagarjuna isn't destroying conventional reality; he's preventing us from *mis-taking* it for ultimate reality. Applying the tetralemma to justice doesn't collapse the dialectic; it reveals the *conditional, dependently arisen, and ultimately empty nature* of the very conventions that give it force, preventing us from absolutizing any particular conception. Your struggle to "pin it down" mirrors the Madhyamaka insistence that the ultimate truth (*paramārtha*) cannot be grasped conceptually – it's realized through the cessation of conceptual grasping (*prapañcopaśama*) itself. Keep wrestling with that tension; it's where the insight lies.
