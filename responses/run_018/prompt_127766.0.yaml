  ### **Test Case to Separate SPTV and NDV**
  *   **Case:** A composer takes a well-known nursery rhyme ("Twinkle Twinkle") and perfectly *inverts the pitch contour* (every ascending interval becomes descending, and vice versa), but keeps rhythm, harmony, and phrasing identical.
  *   **SPTV Prediction (Likely YES):** A clear, deep structural parameter ("pitch direction polarity knob") was turned, creating a distinctly different, potentially uncanny, musical object within the same space.
  *   **NDV Prediction (Likely NO):** It's perfectly reducible to "Twinkle Twinkle + Contour Inversion" – one specific source + one identifiable tweak. No interpolation, no multiple sources, no accidental discovery.
  *   **Resolution:** If M says YES, SPTV dominates (depth of parameter matters most). If M says NO, NDV dominates (derivability matters most). (Based on her villanelle approval, I suspect she'd say YES).

  ---

  ### **Creativity Theory: Settled vs. Contested**
  *   **Settled (Broad Consensus):**
      *   Creativity involves novelty *and* appropriateness/value within a domain.
      *   It operates within "conceptual spaces" (Gärdenfors, Hofstadter) – structured domains of possibilities defined by rules and parameters.
      *   Much creativity involves exploration, transformation, or combination of existing elements within these spaces ("variation").
      *   Incubation, analogy, and pattern recognition are key cognitive mechanisms.
      *   Intentionality is *not* strictly necessary (e.g., serendipitous discovery).
  *   **Genuinely Contested:**
      *   **The "Knob-Twiddling" Specificity:** *What exactly counts as a "structural parameter"* vs. a surface feature? (Is contour inversion deep? Is metric shift deeper than tempo shift? M makes clear distinctions, but this is highly domain-specific and subjective). *This is the core of M's framework and where theory gets fuzzy.*
