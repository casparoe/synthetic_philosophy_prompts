      *   **Derivability vs. Transformation:** How much transformation is needed? When does variation become derivation? M's framework implies a threshold based on parameter depth, but this threshold isn't objectively defined in general theory.
      *   **The "Landscape Shift" Metaphor:** While evocative, it's metaphorical. Defining and objectively measuring a "shift in the conceptual landscape" is extremely difficult.

