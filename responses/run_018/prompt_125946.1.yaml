  Okay, let me think through this Confucian role ethics dilemma carefully. The user presents a tightly constructed argument that seems to force role ethics into an uncomfortable corner, and they're specifically asking which step to reject while preserving the core premises about roles and zhengming. 

  Hmm, first I notice the user is clearly well-versed in Confucian philosophy - they're using precise terms like zhengming and referencing Mencius accurately. This isn't a beginner's question but a sophisticated pressure-test from someone who's studied the material. Their underlying concern seems to be whether role ethics can genuinely account for universal moral obligations without self-destructing.

  The argument's pivot point appears at step (4) where it claims harming strangers violates "no named duty." But is that really what Confucians believe? When I recall Mencius' example of the child falling into a well - that's precisely about strangers, and the compassion described there isn't framed as a role obligation but as innate human response. The user might be underestimating how Confucianism roots ethics in human nature itself, not just social roles.

  Ah, and there's the rub - step (4) looks plausible because we naturally associate "duty" with specific social positions. But Confucian ethics has this deeper layer of ren (humanness) that exists prior to roles. Rejecting (4) means acknowledging that moral evaluation begins with our shared humanity, with roles then shaping how that humanity expresses itself in different contexts. 

  What would this cost? Well, it makes Confucian ethics less neatly compartmentalized than the user's initial presentation. The "distinctiveness" of role ethics becomes more nuanced - roles aren't the source of morality but its social articulation. But crucially, this preserves both the graded particularism of roles and the universal foundation, avoiding both collapse into universalism and the absurd moral vacuum.

  The user's desire to keep (1) and (2) intact is actually helped by this move, since rejecting (4) doesn't touch those premises about roles being primary for social obligations. It just denies that roles are the exclusive framework for all moral judgment. Mencius' compassion example shows exactly how universal concern operates alongside role duties without reducing one to the other.

  This approach also explains why Confucians would condemn harming strangers without needing a "fellow human" role - because our shared humanity already carries moral weight prior to any role assignment. The theory maintains its distinctive structure precisely by not flattening all obligations into a single universal duty.
answer: |-
  Your argument is admirably sharp, and I see why you feel it corners Confucian role ethics. While every step has a surface plausibility, the weak link is **step (4): "Therefore, harming an unrelated stranger is not prohibited by role ethics itself; at worst it violates no named duty."** Rejecting this step allows us to preserve (1) and (2) while avoiding both universalism (step 7) and the moral vacuum (step 8), though it comes at a conceptual cost.

  Step (4) looks plausible because it directly follows the strict logic of steps (1)-(3). If obligations *only* arise from specific named roles, and strangers share no such role, then harming a stranger wouldn't violate a *role-specific duty*. The slide here is conflating *role-specific duties* with the *entire ground* or *source* of moral prohibition in Confucian ethics. It assumes that because no *particular* role-duty applies to a stranger, there is *no relevant moral prohibition whatsoever* grounded in the Confucian framework. This ignores the foundational Confucian concept of *ren* (仁, humaneness, benevolence) and the understanding of human nature (*xing* 性) that underpins the entire ethical system.

  Confucian ethics isn't *only* about roles generating isolated duties in a vacuum. Roles are the primary *loci* and *structures* for cultivating and expressing the fundamental virtue of *ren*, which is understood as an innate human potentiality. Mencius explicitly grounds compassion for the suffering of others – famously illustrated by the child about to fall into a well – in this innate human heart-mind (*xin* 心), specifically the "sprout" (*duan* 端) of compassion (*ceyin zhi xin* 恻隐之心). This compassion arises spontaneously, *prior* to any specific role relationship. While *ren* finds its richest and most demanding expression *within* specific roles (filial piety being the root), its scope is not *limited* to those roles. The capacity for compassion and the inherent value seen in others (*ren* as "loving people") provides a universal moral baseline.

  Therefore, harming a stranger *is* directly prohibited by core Confucian ethics, not because of a specific named role like "fellow human" (rejecting step 6), but because it violates the fundamental virtue of *ren* and damages the agent's own humanity. It is an offense against the innate moral sense cultivated *through* roles but not *exclusively defined by* them. The moral evaluation doesn't come from a missing role-duty ("stranger-harmer") but from the failure to express the basic humaneness (*ren*) that is the very foundation upon which the role ethics is built. The prohibition stems from violating one's own moral nature and the inherent claim another human being makes on one's compassion.

  **The cost of rejecting step (4):** It requires acknowledging that Confucian ethics has a foundational, universal moral element (*ren*/innate compassion/human nature) that *precedes* and *informs* the particular role obligations, rather than roles being the *sole* source of all moral value and obligation. This weakens the claim that Confucian ethics is *purely* or *exclusively* a "role ethics" in the narrowest sense implied in step (1). While roles remain the indispensable framework for developing virtue, structuring society, and defining specific, graded obligations, they are not the *ontological source* of all moral value. The universal dimension of *ren* exists alongside the particularism of roles.

  This preserves the distinctive structure: roles still define specific, graded obligations of differing intensity and content (filial piety *is* categorically different and stronger than general benevolence to a stranger). The universal compassion doesn't reduce filial piety to a mere "stronger instance" of a single human duty (avoiding step 7). Filial piety retains its unique, foundational status *within* the broader cultivation of *ren*. It also avoids the moral vacuum (step 8) by grounding the prohibition against harming strangers in the core Confucian virtue of *ren* and the innate moral sense, without needing to invent a new "fellow human" role. The cost is accepting that Confucian ethics, while profoundly role-centric and seeing roles as the primary path to full humanity, incorporates a universalist element grounded in a shared human nature and potential, preventing moral nihilism outside named roles. The roles express and cultivate the universal potential; they don't create moral value *ex nihilo* only for those within the role.
