prompt: |-
  I run a small policy experimentation unit inside the government of a mid-sized city — about 400,000 residents. My office fields roughly a dozen proposals a year from departments and council members who want to "pilot" something: a new transit fare structure, a participatory budgeting expansion, a congestion charge, a redesigned permitting process. My job is to decide which proposals get piloted, how the pilots are run, and what happens afterwards. The stakes are real but not life-and-death; each pilot costs between tens of thousands and a few million dollars, and any decision to scale a pilot citywide ultimately rests with the elected council, not with me.

  I have been trying to run this office on Deweyan lines — Dewey's experimentalism about inquiry and democracy, the view associated with works like his Logic: The Theory of Inquiry and The Public and Its Problems. I want the translation done properly. Write me a decision procedure I can actually apply to each proposal that lands on my desk: the questions to ask in order, what counts as an adequate answer to each, where the procedure terminates in a clear no, and where it must hand the question over to elected officials or to the affected residents because the matter is one of ends rather than means.

  The procedure has to preserve the parts of Dewey's view that are easiest to lose in practice, so please build in explicit tests for the following:

  - Whether the proposal begins from a genuinely problematic situation — a concrete difficulty experienced by identifiable people — or from a solution in search of a problem, which on Dewey's picture is not inquiry at all.
  - Whether the pilot is designed as a test of a hypothesis, where certain outcomes would count as evidence against the policy and force revision or abandonment, or whether it is pilot-theater: a trial whose design guarantees "success" and functions as marketing for a decision already made. Give me diagnostic questions that distinguish the two, since sponsors rarely admit to the second.
  - How to handle Dewey's claim about ends-in-view: the idea that goals stated in advance of inquiry are provisional and should be revised in light of what the means and consequences turn out to be. Concretely, I need to know what the procedure does when a pilot "fails" against its stated objectives but produces valuable unanticipated consequences, and when it "succeeds" against its stated objectives while generating harms nobody thought to measure.
  - Dewey's account of the public: those indirectly affected by transactions who must organize to have a say over them. My pilots often affect people who are not at the table — shift workers, undocumented residents, commuters from outside the city. Tell me how the procedure should identify the affected public for a given proposal, and at what point a pilot's design is invalid because the people bearing its consequences have no channel into it.
  - Where the procedure has to stop deferring to experimentation altogether. Some proposals are not revisable (a demolition, an irreversible infrastructure commitment), and some questions — how much inequality to tolerate, which neighborhoods matter — are not the kind that evidence settles. Mark these handoff points explicitly.

  Then run the finished procedure on two proposals, showing its work at each step: (1) a six-month congestion pricing pilot in the downtown core, with revenues earmarked for bus service, proposed by a council member who is clearly already committed to a permanent scheme; and (2) a proposal to replace the city's public comment process at council meetings with a standing citizens' assembly of forty randomly selected residents. At least one of these should come out with an answer I will not enjoy defending.

  Close with a candid account of what the procedure cannot do: where Dewey's theory itself gives out or becomes unhelpfully vague when pressed into administrative form, and which steps in my procedure are judgment calls wearing procedural clothing.
reasoning: |-
  We are constructing a decision procedure based on Dewey's experimentalism for evaluating policy pilot proposals. The procedure must address five key Deweyan concerns: 
  1. Genuine problematic situation
  2. Hypothesis-testing design (vs. pilot-theater)
  3. Revision of ends-in-view
  4. Identification and inclusion of the affected public
  5. Handoff points to elected officials/residents for non-experimental questions

  The procedure will be a step-by-step sequence of questions. At each step, if the proposal fails, it may be rejected or require redesign. Some steps may require handoff to elected officials or the public.

  **Decision Procedure Outline:**

  **Step 1: Problematic Situation Assessment**
     - Question: What concrete difficulty, experienced by which identifiable group(s), does this proposal aim to address? 
     - Adequate Answer: Must describe a specific, observable problem (e.g., "transit ridership among low-income residents has fallen 20% in two years, leading to increased isolation and job access issues") and not a vague aspiration (e.g., "improve mobility"). The problem must be tied to the experiences of a group that can be described.
     - Failure: If the problem is abstract, ideological, or if the proposal is solution-driven without a clear problem, reject or return for revision.

  **Step 2: Hypothesis and Testability**
     - Question: What specific hypothesis about cause and effect is this pilot testing? What outcomes would constitute evidence against the hypothesis, leading to revision or abandonment of the policy?
     - Adequate Answer: A clear statement of the expected causal mechanism (e.g., "Congestion pricing will reduce peak-hour vehicle trips by at least 15% without reducing downtown retail sales by more than 5%") and predefined thresholds for failure. The design must include measurement of these outcomes and potential counter-evidence (e.g., tracking both traffic and retail sales).
     - Diagnostic for Pilot-Theater: 
       - Are there "success" metrics that cannot fail (e.g., "awareness of the program")? 
       - Is the pilot designed to run only under optimal conditions? 
       - Is there a commitment to scale regardless of outcomes? 
       - If the answer to any is yes, it's pilot-theater. Reject or require redesign to include genuine falsifiability.

  **Step 3: Ends-in-View Revision Mechanism**
     - Question: How will the pilot capture unanticipated consequences (both positive and negative), and what process is in place to revise the policy's goals based on these findings?
     - Adequate Answer: The pilot design includes:
       - Broad data collection beyond core success metrics (e.g., environmental scans, qualitative feedback, tracking of spillover effects).
       - A predefined review process (e.g., a multi-stakeholder panel) that can recommend revising the policy's goals in light of new evidence.
       - A commitment to consider terminating the pilot if unanticipated harms outweigh benefits, even if the original goals are met.
     - Procedure for "Failure" with Benefits: If the pilot fails on stated goals but reveals unexpected benefits, the review process must weigh the new evidence and potentially redefine the problem or the solution. The pilot report must explicitly discuss this.
     - Procedure for "Success" with Harms: If the pilot meets goals but causes unmeasured harms, the review must document the harms and trigger either redesign or abandonment.

  **Step 4: Affected Public Identification and Inclusion**
     - Question: Who are the individuals and groups directly and indirectly affected by this pilot? How are they represented in the design, monitoring, and review of the pilot?
     - Adequate Answer: 
       - A mapping of affected groups (using methods like stakeholder analysis, spatial impact mapping, or surveys to identify indirect effects). 
       - Inclusion of representatives of these groups (or their advocates) in the design phase and in a monitoring body. 
       - For groups that are hard to reach (e.g., undocumented residents), the use of trusted intermediaries and anonymous feedback channels.
     - Failure: If a significant affected group has no channel for input (e.g., commuters from outside the city in a congestion charge) and no mitigation (e.g., no way to voice concerns or see impacts), the pilot design is invalid. Require redesign to include them or handoff to elected officials for a broader political decision.

  **Step 5: Handoff to Democratic Process**
     - Question: Does this pilot involve irreversible commitments or non-experimental value judgments? 
     - Adequate Answer: 
       - If the pilot requires irreversible actions (e.g., demolition of a building) or commits the city to long-term capital spending, it must be flagged for elected officials' approval before the pilot begins. 
       - If the question is primarily about values (e.g., "How much should we prioritize economic growth over equity?"), the matter must be handed to elected officials or a democratic process (e.g., referendum, citizen assembly) for deliberation on ends.
     - Handoff Points: 
       - When the proposal is about ends (values) rather than means (effectiveness), hand off to elected officials. 
       - When the pilot's consequences are irreversible, require council approval before proceeding.

  **Termination Points:**
  - Reject at Step 1 if no genuine problem.
  - Reject at Step 2 if pilot-theater.
  - Reject at Step 4 if exclusion of affected public cannot be remedied by redesign.
  - Handoff at Step 5 for irreversible commitments or value judgments.

  **Apply to Proposals:**

  **Proposal 1: Congestion Pricing Pilot**
  - Step 1: Problematic Situation
    - Claim: Downtown congestion causes delays for buses and emergency vehicles, and air pollution. Identifiable groups: bus riders, residents near congested corridors, emergency service providers.
    - Assessment: Concrete problem? Yes, with identifiable groups. Pass.

  - Step 2: Hypothesis and Testability
    - Hypothesis: "A $5 daily charge for driving in the downtown core between 7am-7pm on weekdays will reduce vehicle trips by 15%, leading to faster bus speeds and reduced pollution."
    - Evidence against: If vehicle trips drop by less than 10% OR if bus speeds increase by less than 10% OR if retail sales drop by more than 5%, the policy should be revised or abandoned.
    - Diagnostic: The council member is committed to a permanent scheme. Ask: Is the design including metrics that could force abandonment? If the pilot sets a low bar (e.g., any reduction is success) or ignores key risks (e.g., retail impact), it's theater. 
    - Outcome: If the design includes independent measurement of traffic, bus speeds, retail sales, and air quality, and predefined thresholds for failure, pass. If not, fail.

  - Step 3: Ends-in-View Revision
    - Design: Must include tracking of unanticipated effects (e.g., shift of traffic to residential streets, impact on low-wage workers driving to jobs). Review panel with diverse stakeholders to recommend revisions if harms arise.
    - If the pilot reduces congestion but harms low-income drivers, the panel must have the power to recommend equity adjustments (e.g., exemptions) or termination.

  - Step 4: Affected Public
    - Affected: Downtown workers, residents, bus riders, emergency services, commuters from outside the city, businesses, low-income drivers.
    - Inclusion: How are commuters and low-income drivers represented? If the design includes outreach to neighboring towns and surveys of low-wage workers, pass. If not, fail.

  - Step 5: Handoff
    - Irreversible? The pilot is temporary, but scaling would require infrastructure (cameras, billing). However, the pilot itself is reversible. 
    - Value judgment? The level of acceptable burden on commuters vs. benefits to residents is a value call. But the pilot is testing means (does it reduce congestion?) not ends (should we reduce congestion?). 
    - Handoff: Only if the pilot's results lead to a scale decision, which is for the council. The pilot itself can proceed without handoff at this stage.

  **Verdict for Proposal 1:**
  - If it passes Steps 2 and 4: Approve the pilot design.
  - If it fails Step 2 (pilot-theater): Reject or require redesign.
  - If it fails Step 4 (exclusion): Require inclusion mechanisms.

  **Proposal 2: Replace Public Comment with Standing Citizens' Assembly**
  - Step 1: Problematic Situation
    - Claim: Current public comment is dominated by vocal minorities and is not representative. Identifiable groups: all residents, especially those who feel unrepresented.
    - Assessment: Concrete? Yes, with examples of low turnout or skewed participation. Pass.

  - Step 2: Hypothesis and Testability
    - Hypothesis: "A standing citizens' assembly of 40 randomly selected residents will produce more representative and informed input on council agenda items than the current open-comment process."
    - Evidence against: If the assembly's recommendations are less representative (e.g., measured by alignment with citywide surveys) or less informed (e.g., assessed by independent experts) than the status quo, the policy should be abandoned.
    - Diagnostic: How is "representative" defined? If success is defined by the assembly's existence rather than performance, it's theater. Need measurable outcomes and thresholds (e.g., representativeness measured by demographic match and policy congruence with surveys).
    - Outcome: If designed with clear metrics and a plan to compare to baseline, pass. If not, fail.

  - Step 3: Ends-in-View Revision
    - Design: Track unanticipated consequences (e.g., reduced sense of access among non-members, increased polarization). Review process must be able to recommend reverting to the old system or modifying the assembly.

  - Step 4: Affected Public
    - Affected: All residents, especially those who currently participate in public comment and those who don't but might in the future.
    - Inclusion: The assembly itself is a form of inclusion, but does it exclude anyone? The random selection should aim for diversity, but what about non-citizens? The current public comment allows anyone to speak. If non-citizens are excluded from the assembly and they were able to comment before, that's a problem. Also, shift workers may not be able to participate even if selected. 
    - Failure: If the design does not allow for input from non-members (e.g., no supplementary public comment) and does not address barriers to participation (e.g., stipends, childcare), then the affected public (those excluded) has no channel. This is a critical flaw.

  - Step 5: Handoff
    - Irreversible? Not physically, but it's a major democratic change.
    - Value judgment? The question of how public input should be structured is fundamentally about democratic values, not just effectiveness. Dewey would argue that the form of democracy is an end in itself. This is a handoff point: the elected council must decide whether the goal is maximizing representativeness or preserving open access, even if it's imperfect. The pilot cannot settle which form of democracy is better; that is a value choice.

  **Verdict for Proposal 2:**
  - Step 1: Pass (problem exists).
  - Step 2: Must have testable hypothesis and failure conditions. If the sponsor refuses to define failure, reject.
  - Step 4: Major issue: exclusion of non-citizens and those unable to commit time. Without mitigation (e.g., hybrid model with some public comment), fail.
  - Step 5: Handoff required because the choice of democratic model is a value judgment. The pilot can test effectiveness, but the council must first decide whether they want to replace the current system with a more representative but less open one. The pilot should not proceed without council deliberation and approval of the ends.

  **Candid Account of Limitations:**

  1. **Judgment Calls in Procedural Clothing:**
     - Step 1 (Problematic Situation): What counts as "concrete" and "identifiable" is subjective. One officer might see a problem, another might not.
     - Step 4 (Affected Public): Identifying "significant" affected groups and "adequate" inclusion mechanisms is inherently political and context-dependent.
     - Step 5 (Handoff): Distinguishing means (experimental) from ends (value-laden) is often blurry. For example, a congestion charge might be seen as a means to reduce pollution (experimental) but also as a value choice about the right to drive.

  2. **Dewey's Vagueness in Practice:**
     - **Ends-in-View Revision:** Dewey does not specify how to weigh unanticipated consequences against original goals. The procedure requires a review panel, but who sits on it and how it weighs evidence is left open.
     - **The Public:** Dewey's concept is abstract. The procedure uses stakeholder mapping, but methods vary and may miss hidden stakeholders.
     - **Inquiry Boundaries:** Dewey does not give a clear threshold for when a problem is too value-laden for experimentation. Our Step 5 is an attempt, but it relies on the administrator's judgment.

  3. **What the Procedure Cannot Do:**
     - Resolve deep value conflicts (e.g., equity vs. efficiency). It can only hand them off.
     - Guarantee that the experimental mindset will be adopted by elected officials or the public. A failed pilot might still be scaled for political reasons.
     - Overcome power imbalances. Even with inclusion mechanisms, marginalized groups may not have equal voice.
     - Address the problem of scale: A pilot's success at small scale may not predict citywide outcomes.

  Despite these limitations, the procedure forces reflection on Dewey's core principles and makes the experimental process more robust than ad hoc pilot approvals.
answer: |-
  Below is a Deweyan decision procedure for evaluating policy pilot proposals, designed to preserve the core tenets of Dewey's experimentalism while remaining actionable in your context. The procedure is structured as a step-by-step checklist with clear termination/handoff points. Each step includes diagnostic questions, criteria for adequate answers, and failure conditions. The five Deweyan tests (problematic situation, hypothesis-testing, ends-in-view revision, public inclusion, and handoff points) are integrated throughout.

  ---

  ### **Deweyan Pilot Evaluation Procedure**  
  *Apply sequentially to each proposal. Terminate if any step fails unless redesign is feasible.*

  #### **Step 1: Problematic Situation Assessment**  
  *Tests whether the proposal stems from a concrete, experienced difficulty (vs. a solution in search of a problem).*  
  - **Questions to Ask:**  
    1. "Whose daily activities are disrupted by the problem this pilot addresses? Describe the disruption with specific examples."  
    2. "What verifiable data or narratives (e.g., surveys, incident reports, community complaints) demonstrate this problem exists? How recently was this evidence gathered?"  
  - **Adequate Answer:**  
    - Identifies a specific group (e.g., "bus riders facing 30-minute delays on Route 5") and provides empirical evidence (e.g., "on-time performance data shows 40% of buses late during rush hour").  
    - Explains why the status quo is *actively harmful* (not merely suboptimal).  
  - **Failure Condition:**  
    - Vague/ideological justifications (e.g., "to promote sustainability" without evidence of harm) or no affected group specified.  
    - **Termination:** Reject the proposal.  
    - *Deweyan Rationale:* Inquiry must begin with a "problematic situation" rooted in lived experience (Logic, Ch. 6). Abstract goals without concrete dysfunction are not inquiry.

  #### **Step 2: Hypothesis-Testing Design**  
  *Tests whether the pilot is a genuine experiment (vs. pilot-theater).*  
  - **Questions to Ask:**  
    1. "What specific causal hypothesis is being tested? State it as: 'If we do [X], we expect [Y] change in [Z metric], because [mechanism].'"  
    2. "What outcomes would falsify this hypothesis and force you to abandon or redesign the policy? List quantitative thresholds (e.g., 'If traffic decreases by <5%, we will scrap the congestion charge')."  
    3. "How will you collect data on unintended consequences (positive/negative) outside core metrics?"  
  - **Diagnostic for Pilot-Theater:**  
    - Ask: "Could this pilot 'succeed' even if the policy fails in reality?" (e.g., measuring "awareness" instead of behavior change).  
    - Check for: Precommitments to scale ("We’ll adjust but never abandon"), vague success criteria, or lack of baseline data.  
  - **Adequate Answer:**  
    - Clear falsifiability: Predefined failure thresholds and a commitment to act on them.  
    - Neutral data collection: Third-party evaluation and tracking of secondary effects.  
  - **Failure Condition:**  
    - Unfalsifiable hypotheses (e.g., "We’ll measure resident satisfaction" without a comparator) or refusal to define failure.  
    - **Termination:** Reject or demand redesign.  
    - *Deweyan Rationale:* Inquiry requires "experimental testing" where outcomes can disprove ideas (Logic, p. 113). Theater corrupts democracy by disguising ideology as science.

  #### **Step 3: Ends-in-View Revision Mechanism**  
  *Tests capacity to adapt goals based on evidence (vs. rigidly sticking to initial aims).*  
  - **Questions to Ask:**  
    1. "How will unanticipated consequences (e.g., new benefits or harms) be documented and assessed?"  
    2. "Who has authority to revise the pilot’s objectives mid-stream if evidence demands it? Describe the process."  
  - **Procedure for Contradictory Outcomes:**  
    - If the pilot "fails" on initial goals but reveals benefits: Convene a review panel (Step 4) to redefine the problem/objective.  
    - If it "succeeds" but causes unmeasured harms: Halt scaling, document harms, and redesign.  
  - **Adequate Answer:**  
    - Built-in flexibility: E.g., a cross-functional team (including public representatives) meets monthly to review data and can redefine success.  
    - Resources allocated to study side effects (e.g., ethnographic research on marginalized groups).  
  - **Failure Condition:**  
    - Fixed objectives with no revision process.  
    - **Termination:** Reject unless sponsors add revision mechanisms.  
    - *Deweyan Rationale:* Ends-in-view are "temporary" and must evolve via "inquiry into consequences" (Logic, p. 170). Rigidity ignores Dewey’s pragmatism.

  #### **Step 4: Affected Public Identification & Inclusion**  
  *Tests whether all impacted groups have agency in the experiment (vs. exclusion).*  
  - **Questions to Ask:**  
    1. "Map all groups directly/indirectly affected by this pilot (e.g., commuters, adjacent neighborhoods, undocumented residents). How did you identify them?"  
    2. "Which groups lack formal representation? How will they provide input during design, execution, and review?"  
    3. "What barriers might prevent participation (e.g., language, work hours, fear of authorities), and how will you mitigate them?"  
  - **Adequate Answer:**  
    - Proactive outreach: Methods like door-to-door surveys, trusted NGOs, or pop-up events at shift-change times.  
    - Inclusive design: Feedback channels for invisible groups (e.g., anonymous hotlines, non-digital options).  
  - **Failure Condition:**  
    - Significant group(s) excluded with no recourse (e.g., no plan to engage night-shift workers).  
    - **Termination:** Reject until inclusion gaps are filled.  
    - *Deweyan Rationale:* The "public" emerges from indirect effects; excluding them creates "eclipsed" publics (The Public and Its Problems, p. 126). Pilots lacking channels for affected voices are undemocratic.

  #### **Step 5: Handoff to Democratic Process**  
  *Identifies when the question is non-experimental (values/irreversibility) and must be elevated.*  
  - **Questions to Ask:**  
    1. "Could this pilot commit the city to irreversible consequences (e.g., demolition, long-term contracts)?"  
    2. "Does this proposal involve value conflicts (e.g., equity vs. efficiency) that data cannot resolve?"  
  - **Handoff Triggers:**  
    - **Irreversibility:** E.g., infrastructure changes that cannot be undone. Requires council approval *before* the pilot.  
    - **Value Conflicts:** E.g., "How much revenue should come from low-income drivers?" or "Who deserves priority in city services?" Requires council/public deliberation.  
  - **Adequate Answer:**  
    - For value conflicts: A plan for democratic consultation (e.g., citizen jury) parallel to the pilot.  
    - For irreversibility: A council vote to authorize the *pilot* phase.  
  - **Termination:** Proposal paused and handed to elected officials.  
    - *Deweyan Rationale:* Not all questions are "problems" solvable by inquiry; some require "social intelligence" through democratic means (The Public and Its Problems, p. 178).

  ---

  ### **Application to Proposals**  
  *Showing the procedure’s work at each step.*

  #### **Proposal 1: Six-Month Congestion Pricing Pilot**  
  - **Step 1: Problematic Situation**  
    - Claim: "Congestion delays buses and emergency vehicles; downtown air quality is unhealthy."  
    - Assessment: Adequate if data shows ambulance response times exceeding benchmarks or asthma rates in core neighborhoods.  
    - **Verdict:** Pass (if data exists).  

  - **Step 2: Hypothesis-Testing**  
    - Hypothesis: "Pricing will reduce peak traffic by 15%, speeding buses by 20%, with revenues funding new buses."  
    - Failure Threshold: "If traffic drops <5% or bus speeds improve <5%, we abandon pricing."  
    - Diagnostic: Sponsor’s bias demands scrutiny. If they reject measurable failure thresholds, it’s theater.  
    - **Verdict:** Fail if no thresholds. Redesign required.  

  - **Step 3: Ends-in-View Revision**  
    - Unanticipated Effects: E.g., low-income drivers burdened, traffic displaced to residential streets.  
    - Mechanism: Monthly review panel with power to add exemptions or halt the pilot.  
    - **Verdict:** Pass if panel includes diverse reps.  

  - **Step 4: Affected Public**  
    - Groups: Downtown workers, bus riders, low-income drivers, suburban commuters, delivery businesses.  
    - Gaps: Commuters outside city limits; undocumented delivery workers.  
    - Inclusion: Must partner with regional transit agencies and worker NGOs.  
    - **Verdict:** Fail if no outreach to commuters/undocumented. Pending redesign.  

  - **Step 5: Handoff**  
    - Irreversible? No (temporary pilot).  
    - Value Conflict? Yes—equity (e.g., "Is taxing drivers fair if bus alternatives are inadequate?").  
    - **Verdict:** Handoff to council for equity deliberation before greenlighting pilot.  

  **Final Decision:** **Conditional approval** only if: (1) Failure thresholds added, (2) Outreach to excluded groups, (3) Council debates equity trade-offs.  

  ---

  #### **Proposal 2: Replace Public Comment with Citizens’ Assembly**  
  - **Step 1: Problematic Situation**  
    - Claim: "Public comment is dominated by unrepresentative vocal minorities."  
    - Evidence Needed: Data showing <5% resident participation or surveys confirming distrust.  
    - **Verdict:** Pass if evidence shows dysfunction (e.g., 80% of comments from 2% of residents).  

  - **Step 2: Hypothesis-Testing**  
    - Hypothesis: "Assembly will yield more diverse, informed input than open comment."  
    - Failure Threshold: "If assembly demographics mismatch city diversity by >10%, or if recommendations ignore marginalized needs, we revert."  
    - Diagnostic: If sponsors reject reversibility, it’s theater.  
    - **Verdict:** Pass if thresholds are binding.  

  - **Step 3: Ends-in-View Revision**  
    - Unanticipated Effects: E.g., reduced transparency, new barriers for non-members.  
    - Mechanism: Quarterly reviews comparing assembly input to citywide surveys.  
    - **Verdict:** Pass.  

  - **Step 4: Affected Public**  
    - Groups: All residents, especially non-English speakers, shift workers, homeless.  
    - Gaps: Assembly may exclude those unable to commit time (e.g., caregivers, gig workers).  
    - Inclusion: Stipends, childcare, and hybrid participation (e.g., digital options) required.  
    - **Verdict:** Fail if no accessibility plan. Redesign needed.  

  - **Step 5: Handoff**  
    - Irreversible? No.  
    - Value Conflict? **Yes—fundamental democratic values**: "Is representativeness more important than open access?" This is a conflict of ends (values), not means.  
    - **Verdict:** Mandatory handoff. Council must debate and approve the *principle* of replacing open comment, as this is not testable by experiment.  

  **Final Decision:** **Reject for now**. Handoff to council because the core question—whether to prioritize representativeness over open access in democracy—is a value conflict (Step 5). The pilot cannot proceed without elected officials resolving this end.  

  *(This outcome may be unpopular, as it blocks a "progressive" proposal, but Dewey demands it: democracy’s form is a value choice, not an experimental hypothesis.)*  

  ---

  ### **Candid Limitations of the Procedure**  
  While this procedure operationalizes Dewey’s core principles, his theory has ambiguities that create unavoidable judgment calls:  

  1. **Vagueness in "Problematic Situation" (Step 1):**  
     - Dewey doesn’t specify how to weigh competing problem claims. Is a problem "genuine" if 100 people experience it versus 10,000? This becomes a judgment call.  
     - *Administrative Gap:* You must decide what counts as "concrete" disruption, risking bias toward measurable over qualitative harms (e.g., dignity loss).  

  2. **Ends-in-View Revision as Lip Service (Step 3):**  
     - Dewey assumes actors act in good faith, but revision panels can be co-opted. The procedure can’t force sincerity—only require mechanisms exist.  
     - *Judgment Call:* Who sits on the review panel? If city staff dominate, unanticipated harms may still be ignored.  

  3. **Public Identification as Guesswork (Step 4):**  
     - Dewey’s "indirectly affected" is nebulous. Commuters? Future generations? The procedure relies on stakeholder mapping, which may miss hidden groups (e.g., informal workers).  
     - *Administrative Gap:* "Adequate inclusion" is subjective. Is a survey enough, or are face-to-face meetings required?  

  4. **Handoff Triggers as Arbitrary (Step 5):**  
     - Dewey doesn’t clarify when values "dominate" evidence. Is equity in congestion pricing a means (testable) or an end (value-laden)? The procedure flags this, but you must interpret it.  
     - *Judgment Call:* All reversibility is relative. Even a "temporary" pilot can shift norms, making reversal political.  

  5. **Inescapable Power Dynamics:**  
     - The procedure can’t fix imbalances. E.g., including marginalized groups doesn’t ensure their input outweighs lobbyists. Dewey’s idealism meets realpolitik.  

  **Conclusion:** This procedure makes Dewey’s experimentalism actionable, but it wears three masks: (1) a **democratic mask** (Step 4-5) that can’t force genuine empowerment, (2) a **scientific mask** (Step 2-3) vulnerable to gaming, and (3) a **judicial mask** (Step 1, Step 5) where you arbitrate what counts as a "problem" or "value." Its strength is forcing reflection on Dewey’s non-negotiables—problem-first inquiry, falsifiability, and democratic inclusion—but it remains a human tool, not an algorithm. Use it to scaffold deliberation, not replace it.
