  Drafter's Note:

  (a) I am least confident that both camps would sign without reservation to Agreed Claim 5: "Standard formalisms ... typically assume an external perspective and unlimited computational resources, which do not hold for embedded agents." The CBC might argue that this understates the problem by saying "typically" (implying that sometimes they don't), and the DSM might note that some standard formalisms (like bounded rationality models) do account for resource limits. However, the claim is about "typical" use and the core assumptions, so it might be acceptable.

  (b) The apparent disagreement that is most likely to be verbal is the definition of "foundational defect". The CBC uses it to mean that the very structure of the formalism is flawed, while the DSM might interpret it as a challenge that can be addressed within the existing structure. If we define "foundational" as requiring a new mathematical framework that does not build on the old, then it becomes substantive.

  (c) An argument that would most change my mind is a formal proof that in a specific, well-defined embedded decision problem (meeting the working characterization), a Bayesian agent with bounded resources (as typically extended) produces a decision that is provably suboptimal by its own lights (i.e., the agent would recognize the mistake given more resources) and that this is unavoidable in the framework. This would support the CBC view on Crux 1 and might shift the overall debate.

