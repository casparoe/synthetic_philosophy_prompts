  We are drafting a joint statement between two groups: the Cartesian-boundary critics (CBC) and the deflationary situated modellers (DSM). The CBC group believes that standard Bayesian decision theory and reinforcement learning have a foundational defect because they assume an agent outside the state space with unlimited resources, and that the problems of embedded agency (like self-referential models, logical uncertainty, self-modification, and reasoning about one's own reasoning) cannot be fixed by relaxing idealizations one at a time. The DSM group believes these issues are already handled by existing formalisms (like POMDPs, recursive modeling, game theory, control theory) and are known approximation limits.

  We have an agreed working characterization of embedded decision problems: an agent is embedded to the extent that:
  (i) The agent is a proper part of the world it acts on and models.
  (ii) The agent is smaller than the world, so perfect self-knowledge and unlimited reasoning are unavailable.
  (iii) The agent can act on its own hardware or software.
  (iv) The agent must sometimes reason about what its own reasoning implies, or about other agents' models of it.

  The statement must contain:
  1. A numbered section of agreed claims (substantive, not vacuous, neutral wording).
  2. Residual disagreements: first in neutral wording, then in each side's own wording.
  3. Cruxes (sub-questions that would move at least one side if settled).
  4. For each crux, a concrete case/argument/observation that both sides agree bears on it, with each side's prediction.
  5. A note distinguishing genuine from merely verbal disagreements.

  Format: numbered agreed claims, then a table for disagreements (with neutral and then each side's wording), then cruxes with cases and predictions, then the note.

  Also, append a drafter's note (half page max) with:
  (a) Which agreed claim is least likely to be accepted as worded?
  (b) Which disagreement is most likely verbal?
  (c) Which argument/result would most change the drafter's mind?

  We are to consider two hypothesized cruxes (but only as hypotheses to confirm, sharpen, or discard):
  - Whether a crisp embedded decision problem can be exhibited for which the received framework gives a provably wrong answer (rather than no answer).
  - Whether the revisionists' replacements can be stated without reintroducing Cartesian assumptions.

  Let's structure the document:

  I. Agreed Claims (numbered list)
  II. Residual Disagreements (table format: neutral description, then CBC version, then DSM version)
  III. Cruxes (list of sub-questions) and for each:
     - A concrete case/argument/observation
     - CBC prediction
     - DSM prediction
  IV. Note on Genuine vs. Verbal Disagreements

  Now, let's draft:

  I. Agreed Claims:

  We, the undersigned, agree on the following:

  1. An embedded agent is a proper part of the world it models and acts upon, and thus the agent is not external to the system it is reasoning about.
  2. An embedded agent has finite computational resources and bounded knowledge, making perfect self-knowledge and unlimited reasoning impossible in practice.
  3. An embedded agent may have the capability to modify its own hardware or software, and such modifications may affect its future decision-making.
  4. An embedded agent must, in some situations, reason about the implications of its own reasoning process, or about how it is modeled by other agents.
  5. Standard formalisms for decision-making (such as fully observable Markov decision processes, classical game theory, and ideal Bayesian decision theory) typically assume an external perspective and unlimited computational resources, which do not hold for embedded agents.
  6. The challenges of embedded agency (including self-referential models, logical uncertainty, self-modification, and recursive reasoning) are non-trivial and require explicit consideration in the design and analysis of artificial agents.
  7. Existing formalisms (including partially observable Markov decision processes, recursive modeling, game theory with bounded rationality, and control theory) provide tools that can address some aspects of embedded agency, but they are not complete solutions and may require extensions or adaptations.

  II. Residual Disagreements:

  We present the key residual disagreements in three columns: a neutral description, the CBC position in their own terms, and the DSM position in their own terms.

  | Neutral Description | Cartesian-Boundary Critics (CBC) | Deflationary Situated Modellers (DSM) |
  |---------------------|----------------------------------|--------------------------------------|
  | The nature of the problem: Is the embedded agency challenge a fundamental crisis requiring entirely new foundations, or a collection of known approximation challenges that can be addressed within existing frameworks? | The standard formalisms (like Bayesian decision theory and reinforcement learning) are fundamentally flawed for embedded agents because they rest on a Cartesian boundary that cannot be repaired by incremental adjustments. The entire framework must be rethought. | The challenges of embedded agency are well within the scope of existing formal frameworks (like POMDPs, game theory, control theory) and represent known limits of approximation. Incremental improvements and extensions are sufficient. |
  | The adequacy of existing formalisms: Can the existing formalisms, even with extensions, handle the core challenges of embedded agency without introducing new foundational principles? | Existing formalisms cannot adequately handle the core challenges (like self-referential beliefs, logical uncertainty, and self-modification) without a foundational shift. Even extended formalisms (like reflective oracles or logical induction) are still built on Cartesian assumptions and fail to fully capture embeddedness. | Existing formalisms, when appropriately extended (e.g., with bounded rationality, recursive modeling, and self-modeling), can handle the core challenges. The issues are not foundational but rather about scaling and approximation. |
  | The possibility of a counterexample: Is there a crisp, formally defined embedded decision problem for which the received framework (even with bounded resources) gives a provably wrong answer? | We believe that such counterexamples exist and are inevitable because the received framework is fundamentally mismatched to embedded agency. | We believe that the received framework, when properly applied with resource bounds and self-modeling, either gives no answer (due to computational undecidability or complexity) or an approximate answer, but not a provably wrong one in a well-posed problem. |

  III. Cruxes:

  We identify the following cruxes. For each, we describe a concrete case, argument, or observation that both sides agree bears on the crux, and we record each side's prediction.

  Crux 1: Existence of a crisp counterexample
  - Concrete case: Consider an agent that must reason about the consistency of its own beliefs while having limited computational resources. Specifically, design a decision problem where the agent must take an action that depends on whether a certain logical statement (which the agent is currently proving) is provable within its own proof system. The agent has a bounded proof length. The received framework (e.g., a Bayesian agent with a prior over logical statements) might assign a probability to the statement being provable that leads to a suboptimal or inconsistent decision. 
  - CBC prediction: Such an example can be constructed and will show that the Bayesian agent, even with bounded resources, gives a provably wrong answer (e.g., by violating a rationality norm that the agent itself would endorse with more resources). 
  - DSM prediction: The Bayesian framework, when augmented with explicit resource bounds (e.g., a bounded proof checker) and a model of its own limitations, will either not produce an answer (due to time constraints) or produce an answer that is approximately correct. The issue is one of computational infeasibility, not of giving a wrong answer in principle.

  Crux 2: Foundational revision without Cartesian assumptions
  - Concrete case: Propose a new formalism (e.g., based on computational complexity, reflective equilibrium, or explicit self-models) that claims to avoid Cartesian assumptions. Then, check whether this new formalism, when modeling a simple embedded scenario (like an agent that can modify its own code), reintroduces a Cartesian boundary by treating the agent's decision module as external or by assuming unbounded resources in the meta-reasoning.
  - CBC prediction: Any attempt to build a formalism that truly avoids Cartesian assumptions will require a radical departure (e.g., one that does not separate the agent from the world at the formal level) and will not reintroduce the boundary. Existing attempts (like logical induction) still have Cartesian elements. 
  - DSM prediction: The new formalism, if built carefully, can avoid Cartesian assumptions. However, they predict that even in the new formalism, the agent must have a representation of itself that is necessarily partial and approximate, and that this does not reintroduce a Cartesian boundary but rather reflects the boundedness of the agent.

  Crux 3: The inevitability of self-referential paradoxes
  - Concrete case: Consider an agent that must decide whether to self-modify to become a faster reasoner. The agent has a model of itself that includes the self-modification. Can the agent avoid a self-referential paradox (like a liar paradox) in its decision-making? 
  - CBC prediction: Self-referential paradoxes are inevitable in any sufficiently rich system and will cause failures in the standard frameworks, which cannot be resolved without a new foundation. 
  - DSM prediction: Paradoxes can be avoided by careful design (e.g., by using grounded models and hierarchical reasoning) and are not a fundamental barrier. Existing frameworks (like reflective equilibria in game theory) can handle these situations without collapse.

  IV. Note on Genuine vs. Verbal Disagreements:

  We note that some apparent disagreements may be verbal. In particular, the term "Cartesian boundary" may be interpreted differently. For the CBC, it is a fundamental flaw in the separation of agent and world, while for the DSM, it is merely a practical simplification that can be relaxed. This difference in emphasis may lead to a verbal disagreement about whether existing formalisms "have" a Cartesian boundary. However, we agree that the agent is part of the world and that models are always partial.

  The disagreement about whether the problem is a "crisis" (CBC) or a "known approximation limit" (DSM) is genuine because it reflects a difference in judgment about the tractability of incremental progress and the need for radical innovation.

  The disagreement about whether a counterexample exists is genuine because it hinges on a formal mathematical question that can be settled by constructing or proving the impossibility of such an example.

