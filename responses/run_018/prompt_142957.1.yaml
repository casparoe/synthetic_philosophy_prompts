  ### **Key Notes on the Tree**  
  - **Logical space coverage:** 8 possible paths from three binary cases. Five positions mapped, with three empty slots (incoherent or unexplored).  
  - **Unresolved pair:** Liberal proceduralist and Epistemic minimalist share the same path (B→B→B). The tree can’t split them—they agree on cases but differ on *why* (transparency vs. unknowability of justice).  
  - **Pascal’s ideas—settled vs. contested:**  
    - **Settled:** Pascal *did* argue justice without force is powerless (*Pensées*). He saw “hidden customs” as inevitable for stability (calling them the “mystic foundation” of authority).  
    - **Contested:** Scholars *disagree* on whether Pascal thought hidden force was:  
      - A permanent necessity (conservative reading).  
      - A fixable flaw (reformist reading).  
      - Or just describing ideology (anarchist reading).  
    *Don’t take any reading as consensus; the tree uses cases, not labels.*  

