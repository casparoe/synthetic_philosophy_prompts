  Here's a reusable decision procedure grounded in ethical reasoning about individual contributions to collective harm, designed to be jargon-free and actionable. It's structured as four ordered questions with clear pass/fail criteria, highlighting where human judgment is needed. I'll first outline the procedure, then apply it to your three proposals, and finally discuss its limitations.

  ---

  ### **Decision Procedure: Collective Harm Contribution Checklist**
  **Use this when evaluating small actions aimed at reducing collective harm (e.g., climate change, societal issues).**  
  **For each proposal, answer sequentially. Stop early if you hit a "Hard No" or "Hard Yes".**

  1. **Is the harm linear or threshold-based?**  
     - **Harm type**:  
       - *Linear* = Each unit of harm adds up incrementally (e.g., CO₂ emissions).  
       - *Threshold-based* = Harm only occurs after crossing a tipping point (e.g., melting an ice sheet).  
     - **Move to Q2 if**:  
       - Harm is linear, OR  
       - Harm is threshold-based and we might be near the threshold (judgment call: is there credible evidence we're close?).  
     - **Hard No if**:  
       - Harm is threshold-based and we’re definitively **not near the threshold** (e.g., "Our 0.001% emission cut won’t tip any climate dominoes").  
     - **Hard Yes if**:  
       - Harm is threshold-based and we’re **very near the threshold** (e.g., "This vote could decide an election decided by <100 votes").  
     - **Judgment needed**: Deciding if we’re "near" a threshold (not a fact question!).

  2. **Is there direct causal impact or symbolic/structural effect?**  
     - **Impact type**:  
       - *Direct causal* = Action directly reduces harm (e.g., batching reduces server energy).  
       - *Symbolic* = Action signals values but has no measurable impact (e.g., a green logo).  
       - *Structural* = Action changes systems/incentives to enable bigger future impact (e.g., policy shifts).  
     - **Move to Q3 if**:  
       - Direct causal impact exists (even tiny), OR  
       - Structural effect exists (e.g., shifts norms or enables scaling).  
     - **Hard No if**:  
       - Purely symbolic **and** harm is linear (e.g., "Awareness ribbon with no policy change").  
     - **Judgment needed**: Classifying impacts (e.g., is "banning beef" structural or just symbolic?).

  3. **Is there a coordination or scaling mechanism?**  
     - **Mechanism**: Does the action trigger broader change? (e.g., inspires imitation, creates network effects, builds momentum).  
     - **Move to Q4 if**:  
       - Coordination/scaling mechanism exists (e.g., "Other companies might copy our API batching").  
     - **Hard Yes if**:  
       - Strong coordination mechanism exists **and** harm is linear (e.g., "This feature could become an industry standard").  
     - **Hard No if**:  
       - No coordination mechanism **and** impact is tiny/isolated (e.g., "0.2% savings with no ripple effects").  
     - **Judgment needed**: Assessing plausibility of scaling (not guaranteed).

  4. **Pure values call: Does the principle matter even if outcome is nil?**  
     - **Check**: Does this align with core values, regardless of measurable impact? (e.g., "We don’t waste resources").  
     - **Hard Yes if**:  
       - Values alignment overrides outcome concerns (e.g., "We ban beef because it’s unethical, full stop").  
     - **Hard No otherwise**.  
     - **Judgment needed**: Team/company must agree on values (subjective!).

  ---

  ### **Applied to Your Proposals**
  **Proposal (a): API-batching toggle (~0.2% energy saved per user)**  
  1. **Q1 (Threshold?)**: Climate harm is threshold-based, but we’re not near any single tipping point. **Move to Q2** (linear accumulation still matters).  
  2. **Q2 (Impact?)**: Direct causal (saves energy). **Move to Q3**.  
  3. **Q3 (Coordination?)**: No inherent scaling (internal feature, not visible externally). Impact is tiny/isolated. **Hard No**.  
     → **Result: Don’t ship**.  
     *Why against intuition?* Feels "obviously good," but fails on scalability. Tiny direct impact + no coordination = negligible difference.

  **Proposal (b): Ban beef at company events**  
  1. **Q1 (Threshold?)**: Climate harm is threshold-based, but not near tipping points. **Move to Q2** (linear emissions matter).  
  2. **Q2 (Impact?)**: Direct causal (reduces emissions) + structural (normalizes plant-based diets). **Move to Q3**.  
  3. **Q3 (Coordination?)**: Strong coordination mechanism (employees/other companies may adopt similar policies). **Hard Yes**.  
     → **Result: Implement**.  
     *Bonus*: Even without coordination, Q4 could justify via values ("We avoid high-emission foods").

  **Proposal (c): In-app banner urging voting**  
  1. **Q1 (Threshold?)**: Voting is threshold-based (elections can be decided by tiny margins). We’re often "near" thresholds (many elections are close). **Move to Q2**.  
  2. **Q2 (Impact?)**: Direct causal (some users will vote because of the banner). **Move to Q3**.  
  3. **Q3 (Coordination?)**: Strong coordination (banners normalize voting, may inspire other apps). **Hard Yes**.  
     → **Result: Implement**.

  ---

  ### **Where the Procedure Misfires or Can’t Settle**  
  - **Misfires**:  
    - **Over-prioritizing coordination**: Could reject small-but-ethical wins (e.g., Q3 might block a genuinely efficient energy fix).  
    - **Threshold judgment errors**: Misjudging "nearness" to tipping points (e.g., ignoring climate feedback loops).  
  - **What it can’t settle**:  
    1. **Cost-benefit tradeoffs**: Doesn’t weigh effort vs. impact (e.g., if API batching takes 1 hour, do it; if 6 months, skip).  
    2. **Values conflicts**: Q4 requires pre-agreed principles (if team debates "Is beef unethical?", it deadlocks).  
    3. **Uncertainty**: All judgment calls (e.g., "Is this structural?") risk bias or shortsightedness.  
  - **Mitigation**:  
    - **Add a tiebreaker**: "If uncertain at any step, default to doing it when effort/cost is low."  
    - **Track reversals**: Sunset actions that later prove ineffective.  

  This gives your team a consistent, philosophy-rooted framework to depersonalize debates. Focus disagreements on specific judgment calls (e.g., "Are we near a threshold?") rather than abstract principles.
