answer: |-
  **Bottom-Line:** This procedure prioritizes saving *someone* over no one, rejects rescues that save no one or cause greater harm, breaks ties only via crew safety, resource impact, or random/non-quantitative factors (like arrival time), and *never* counts lives. Numbers of stranded people are irrelevant.

  **Procedure Flowchart (Run Sequentially):**

  1.  **Reject Non-Saves:** Can either rescue realistically save at least one person given current intel? If "No" for a rescue, reject it. If both "No", **Reject Both**. Proceed only if at least one rescue saves ≥1 person.
  2.  **Reject Harm:** Would approving a rescue *directly* cause significantly *more* harm than rejecting it (e.g., high crew death probability, catastrophic resource loss preventing future *saves*)? If "Yes" for a rescue, reject it. If both "Yes", **Reject Both**. Proceed only with rescues passing 1 & 2.
  3.  **Crew Safety:** Is one rescue significantly *safer* for the crew (low risk vs high risk)? If "Yes", **Approve** the safer rescue. If comparable risk, proceed.
  4.  **Resource Burn:** Does one rescue consume significantly *fewer critical resources* (fuel, time blocking vital assets like *the only helicopter*) needed for *future saves* within the operational window? If "Yes", **Approve** the less resource-intensive rescue. If comparable, proceed.
  5.  **Non-Quant Tie-Breaker:** Use a fair coin flip, or a consistent non-life-counting rule (e.g., "Approve the rescue request received first"). **Approve** the winner.
  6.  **Human Call Needed:** **Stop** if unquantified factors feel overwhelming (e.g., strong family ties affecting crew morale, complex indirect consequences like the insulin clinic diversion in Case 3). This is where mechanization stops.

  **Worked Cases:**

  1.  **4 Climbers vs 1 Novice:** Both save ≥1 (Gate 1 Pass). No greater harm (Gate 2 Pass). Same route difficulty/distance implies comparable crew risk (Gate 3 Pass). Comparable resource burn (Gate 4 Pass). **Approve** based on non-quant tie-breaker (e.g., coin flip). *Misfire: Experience feels relevant but isn't crew safety or resource burn.*
  2.  **2 in Tunnel vs 5 on Ridge:** Both save ≥1 (Gate 1 Pass). Tunnel has high crew risk → **Reject** under Gate 2 (harm). Ridge is low-risk and saves ≥1 → **Approve** Ridge. *Misfire: Numbers irrelevant; high crew risk disqualifies Tunnel.*
  3.  **1 Child vs 6 Adults (Insulin Diversion):** Both save ≥1 (Gate 1 Pass). No *direct* greater harm from the rescue *itself* (Crew risk? Resource burn? Comparable? Assume Pass Gates 2-4). **Approve** via tie-breaker (e.g., coin flip). *Gut Reaction Disliked:* The insulin clinic impact is an *indirect consequence*, not a direct crew risk or resource burn *for future SAR saves* within the window. Procedure ignores it, requiring **Stop - Human Call Needed** at Gate 6 if this diversion is deemed catastrophic. Otherwise, numbers (1 vs 6) remain irrelevant.
