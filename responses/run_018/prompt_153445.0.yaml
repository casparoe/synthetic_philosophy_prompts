answer: |-
  Hey, thinking through your deterministic branching scenario is really interesting—it pushes hard on what we mean by "chmissible evidence" and how deference to chance interacts with self-locating uncertainty in a fully transparent system. I see your point about the tension between the Principal Principle (PP) mandating credence 0.3 in seeing red and the intuition that something deeper in the deterministic mechanism might override it. Let me build the case for your Local Branch Deference principle and then tackle that key objection head-on.

  The core of your setup is that the branching rule is completely transparent and deterministic: the agent knows the exact algorithm assigning "red light on" to precisely 30 out of every 100 copies based on their copy-index. Crucially, the agent *doesn't* know their *own* copy-index; they only know they are *some* copy in the current branching event. PP seems to say: global frequency is 0.3, no inadmissible evidence → credence should be 0.3. But here’s why that feels off. Because the rule is transparent and deterministic, the agent knows *exactly* how the copies are configured relative to each other. Suppose the rule isn't uniform—maybe it assigns red lights in clusters. For instance, imagine copies 1-70 are always white, and 71-100 are always red. The global frequency is still 0.3 red, but if the agent wakes up and sees only white walls (which doesn’t reveal their *exact* index, just that they are in the "white" section), their indistinguishable copies are all within 1-70, *none* of which have the red light on. Their "epistemic equivalence class"—the copies indistinguishable *to them* given their evidence (white walls and knowledge of the rule)—contains 70 copies, all white. Within *this* local branch group, the frequency of red is 0.0.

  This is where Local Branch Deference kicks in. Rational credence, you argue, shouldn’t be governed by the global multiverse frequency (0.3) but by the frequency *within the set of branches consistent with the agent’s total evidence*. Their evidence includes the deterministic rule *and* their self-locating uncertainty constrained by their current observations (like seeing white walls). The rule dictates how copies relate, creating non-uniform clusters of possibility. Deferring to the branch-relative frequency within their epistemic equivalence class respects the full mechanistic knowledge: they know the rule makes red impossible for *any* copy in the white cluster, and they know they are *in* that cluster. Their credence in seeing red *should* be 0.0, not 0.3, despite the global statistic.

  Now, the standard rebuttal you anticipate is compelling: "But knowing the deterministic rule *is* inadmissible evidence about the outcome! PP only applies when you *lack* such detailed causal knowledge. Once you know the rule plus your self-location evidence (like seeing white walls), you aren’t in a position of ‘no inadmissible evidence’—you’ve *already* bypassed chance by knowing the mechanism and partial outcome. PP never *applied* here, so there’s no conflict." I agree this is a natural response, but I think it subtly mischaracterizes the nature of the agent’s knowledge and what constitutes "knowing the outcome."

  The key distinction is between *knowing the generating mechanism* and *knowing the particular result for one’s own branch*. Knowing the rule tells you the *mapping* from copy-index to outcome. Knowing your self-location (e.g., "I see white walls") tells you which *macro-state* or *cluster* you are in (e.g., indices 1-70). But crucially, within that macro-state/cluster, you *still* have self-locating uncertainty about *which specific copy* you are. You know the outcome *depends* deterministically on the unknown copy-index, but *you don’t know that index*. Your ignorance isn’t about a stochastic process; it’s about your precise location within a deterministic structure. This is genuine uncertainty demanding probabilistic credence, even if the universe is deterministic at the global level.

  PP’s concept of "inadmissible evidence" typically excludes evidence about the *actual outcome* or about the *exact microstate* that determines it. Here, the agent *doesn’t* know the actual outcome for their branch until they know their exact copy-index—which they don’t. They only know the rule and their coarse-grained location (white cluster). The rule itself isn’t evidence about the *outcome*; it’s evidence about the *structure of possibilities* and how outcomes correlate across branches. It tells you that *if* you were in copy 71, red would be on, but you *know* you aren’t in 71—you’re in 1-70, where red is off for all. The *admissible* evidence for PP would be the global chance (0.3), but the *inadmissible* evidence is your knowledge of the rule *plus* your self-locating observation (white walls), which together *screen off* the global chance by defining a local reference class where the frequency is different. PP isn’t *violated*; it’s *superseded* by a more precise principle (Local Branch Deference) that handles the interaction of deterministic structure and self-locating uncertainty. PP defers to objective chance *when that’s the best guide*, but here, the transparent mechanism provides a *better*, *more localized* guide given the agent’s specific ignorance.

  So, in defense of your view: In transparent deterministic branching, rational credence tracks the frequency within the agent’s *epistemically accessible branch-set* defined by the deterministic rule and their self-locating evidence. This local frequency can diverge from the global proportion due to non-uniform clustering in the rule. The "inadmissible evidence" reply misses that the agent’s knowledge of the mechanism doesn’t specify *their* outcome—it specifies the *landscape* of outcomes and their correlations, leaving residual uncertainty resolvable only by branch-relative frequencies within their equivalence class. Deference to the local branch isn’t ignoring PP; it’s applying the *spirit* of deference—let the best available objective guide inform your credence—to a context where the global chance is rendered irrelevant by finer-grained, admissible structural knowledge. The generating mechanism doesn’t reveal the result; it reveals how to *partition* uncertainty, and you defer to the frequencies within your partition.
