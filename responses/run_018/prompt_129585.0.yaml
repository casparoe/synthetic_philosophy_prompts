  For consistency, two principles emerge from the precedents: (1) When institutional bias compromises documents, memory prevails (per Case1/Case4); (2) When memory shows signs of retrospective reconstruction, documents prevail (Case2/Case3). Applying these to Case5: Principle1 would favor scientists because grant letters prove institutional pressure (like police logs being compromised), while Principle2 might favor notebooks since elderly memory could be contaminated by modern scientific integrity concerns.

  The closest analog is Case1 - both involve suppression by authority figures with vested interests. But Case3 is structurally similar too (scientific context, memory vs notebooks). The key difference is Case5's smoking-gun evidence of institutional pressure, which tilts the balance toward the collective memory despite being retrospective.

