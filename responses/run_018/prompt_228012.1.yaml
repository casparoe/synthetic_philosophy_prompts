  ## Joint Statement on the Ontic vs. Epistemic Status of the Quantum State

  **Preamble:** We, the undersigned, a proponent of ψ-ontic realism and a proponent of ψ-epistemicism, acknowledge that our long-standing debate has often devolved into slogan trading. We commit to this adversarial collaboration to clarify our agreements, pinpoint our genuine disagreements (verbal and substantive), and identify specific cruxes whose resolution could meaningfully advance the debate. This statement reflects our shared understanding and distinct positions as of [Date].

  ### Section 1: Points of Agreement

  1.  **Formalism and Underdetermination:** We agree that the mathematical formalism of quantum mechanics (QM), particularly in its standard Hilbert space formulation, is extraordinarily empirically successful. However, this formalism alone **does not settle** the ontological status of the quantum state (ψ). Multiple internally consistent interpretations are compatible with the formalism and its empirical predictions.
  2.  **The Role of No-Go Theorems (e.g., PBR):** We agree that theorems like PBR (Pusey-Barrett-Rudolph) and related no-go results (e.g., Hardy, Colbeck-Renner) establish significant constraints on possible interpretations. Crucially, these theorems **do assume specific premises**, most notably **Preparation Independence** (PI): the idea that independently prepared systems have ontic states that are uncorrelated. These theorems **rule out** ψ-epistemic models that satisfy PI and posit substantial overlap in the epistemic distributions corresponding to distinct pure quantum states. However, they **do not rule out**:
      *   ψ-epistemic models that violate PI (e.g., allowing correlations in the underlying ontic states even for independently prepared systems).
      *   ψ-epistemic models with only minimal or vanishingly small overlap for distinct pure states.
      *   Models incorporating retrocausality or global constraints that bypass the PI assumption.
      *   ψ-ontic models themselves.
  3.  **Existence of Epistemic Traditions:** We agree that the existence and intellectual coherence of interpretations like Quantum Bayesianism (QBism), the Statistical Interpretation, and other epistemic views **do not, by themselves, refute** ψ-ontology. These traditions demonstrate viable frameworks for understanding QM without reifying ψ, but they do not logically compel the abandonment of ψ-ontic views, nor do they resolve the foundational questions addressed by no-go theorems. Conversely, the success of ψ-ontic views like Bohmian mechanics does not refute ψ-epistemicism.
  4.  **Status of ψ:** We agree that ψ is a central element in the predictive algorithm of QM. It is not directly observable, but its structure dictates probabilities for measurement outcomes.
  5.  **Practical Collapse:** We agree that, operationally within the predictive formalism, the update of ψ upon measurement ("collapse") functions mathematically as **Bayesian updating of probabilities** conditioned on the new information (the measurement outcome). Both sides utilize this update rule for practical calculation.

  ### Section 2: Residual Disagreements (Stated in Each Party's Preferred Terms)

  *   **ψ-Ontic Realist Position (Endorsed by Signatory A):**
      *   "The quantum state (ψ) corresponds directly to a fundamental element of physical reality. Its evolution (except during measurement) is governed by the linear, deterministic Schrödinger equation. The apparent 'collapse' of the wavefunction upon measurement reflects a genuine, non-unitary, dynamical process occurring in nature, even if its precise mechanism remains to be fully understood within a complete theory (e.g., decoherence plus an additional mechanism, or a primitive process). The exponential growth of entangled states under unitary evolution is a direct manifestation of this underlying physical state evolving in a high-dimensional space. Interference phenomena provide direct evidence for the physical reality of ψ's phase structure and the inadequacy of purely classical hidden variable models lacking this structure. The impossibility of distinguishing non-orthogonal states without disturbance is a consequence of the true physical state being described by ψ, which encodes more information than any single measurement can reveal."

  *   **ψ-Epistemic Theorist Position (Endorsed by Signatory B):**
      *   "The quantum state (ψ) encodes an agent's knowledge, information, or degrees of belief about an underlying ontic state of a system (or, in some views, constrains possible future experiences). The Schrödinger equation describes how this knowledge evolves in the absence of new information. The 'collapse' of the wavefunction is not a physical process but **solely Bayesian updating** of the agent's state of belief upon acquiring new information (the measurement outcome). The exponential growth of entangled states under unitary evolution presents a challenge for *some* epistemic views (requiring complex correlations in the underlying states or constraints on knowledge acquisition), but not an insurmountable one; it reflects the increasing complexity of the agent's description needed to track correlations. Interference phenomena are not direct evidence for ψ's physicality but arise from constraints on what an agent can know about the underlying ontic state and the resulting probability assignments. The impossibility of distinguishing non-orthogonal states without disturbance is a natural consequence of the epistemic view: they correspond to overlapping probability distributions over the underlying ontic states."

  *   **Acknowledged Challenges & Potential Verbal Disagreements:**
      *   **For Epistemic Views:** We acknowledge that explaining the *exponential growth* of entangled states under unitary evolution, and the *specific quantitative form* of interference patterns, requires careful construction within an epistemic framework (e.g., intricate constraints on the ontic state space or knowledge acquisition rules) and remains an active area of development. Signatory B contends this is tractable; Signatory A contends it points towards ontology.
      *   **For Ontic Views:** We acknowledge that explaining the *impossibility of distinguishing non-orthogonal states* without disturbance poses a challenge for ontic views, requiring explanations like contextuality or the specific structure of the ontology. Signatory A contends this is a feature of quantum reality; Signatory B contends it is more naturally explained by epistemic limitations.
      *   **Verbal Component:** We explicitly recognize that part of our dispute **may be verbal**, hinging on differing conceptions of what it means for something to "represent reality" or be "physical." Signatory A typically employs a more direct correspondence notion of representation. Signatory B employs a more functional or knowledge-encoding notion. Furthermore, disagreement over whether a "problem" (like exponential entanglement growth) is merely *challenging* or *fatal* for a view often reflects differing standards of parsimony, explanatory depth, or tolerance for theoretical complexity. We agree that resolving whether entanglement growth *necessitates* an ontic ψ or can be *explained* within a viable epistemic framework is substantive, not merely verbal.

  ### Section 3: Cruxes for Future Resolution

  We identify the following specific sub-questions (cruxes) where progress could significantly impact our disagreement. For each, we state the crux, a relevant consideration agreed upon by both parties, and our pre-registered predictions/concessions.

  1.  **Crux: Feasibility of Pure Epistemic Interference Explanation**
      *   **Question:** Can a ψ-epistemic model satisfying the **Quantum Overlap** condition (distinct pure states correspond to overlapping epistemic distributions) provide a compelling, non-gerrymandered explanation for the precise quantitative form of single-system interference effects (e.g., double-slit, Mach-Zehnder) *without* resorting to fine-tuning or effectively smuggling in ontic phase structure?
      *   **Relevant Consideration:** Analyzing models attempting to reproduce interference solely through constraints on knowledge/belief updating over an ontic state space lacking wave-like properties. Does the required structure of the epistemic distributions or the dynamics of belief update become implausibly complex or fine-tuned specifically to mimic QM predictions?
      *   **Signatory A (Ontic) Prediction:** No satisfactory explanation is possible without introducing structure equivalent to an ontic wave or phase. Genuine interference necessitates ontic ψ.
      *   **Signatory B (Epistemic) Prediction:** Yes, such models are possible and can be made conceptually clear and non-gerrymandered, demonstrating that interference patterns arise naturally from limitations on knowledge about paths.

  2.  **Crux: Fine-Tuning in Ontic Models for Non-Orthogonality**
      *   **Question:** Does any viable ψ-ontic model (e.g., de Broglie-Bohm, Everett, Dynamical Collapse) inevitably require **fine-tuning** in its ontology or dynamics to explain why non-orthogonal pure quantum states cannot be distinguished without disturbance, or is this feature naturally explained?
      *   **Relevant Consideration:** Examining whether the ontological details (e.g., the configuration space and guiding wave in Bohm, the branching structure in Everett, the collapse mechanism in GRW/CSL) inherently implement contextuality or fundamental limitations distinguishing non-orthogonal states without appearing ad hoc or fine-tuned solely for this purpose.
      *   **Signatory A (Ontic) Concession:** If compelling evidence emerges that *all* current ψ-ontic models require significant, unnatural fine-tuning *specifically* to enforce the indistinguishability of non-orthogonal states, this would be a notable challenge. (Predicts this is not the case).
      *   **Signatory B (Epistemic) Concession:** If a ψ-ontic model is developed where the indistinguishability emerges naturally and unavoidably from core ontological principles without added fine-tuning, this would weaken a key epistemic motivation. (Predicts this is unlikely).

  3.  **Crux: Necessity of Exponential Growth**
      *   **Question:** Is the **exponential growth in the number of terms** required to describe the entangled state of N interacting qubits under unitary evolution *necessarily* indicative of an exponentially growing *physical* entity (ψ-ontic), or could a theory positing only a polynomial (or linear) growth in underlying physical resources, coupled with an epistemic state that *tracks correlations* exponentially, be consistent with all quantum predictions (including complex interference and measurement correlations)?
      *   **Relevant Consideration:** Conceptual and mathematical exploration of theories with constrained underlying physical state spaces but epistemic states capturing complex quantum correlations. Could such a theory reproduce the Born rule and observed phenomena without internal contradiction or predictive deviation from QM?
      *   **Signatory A (Ontic) Prediction:** Any theory attempting to limit the underlying physical state space will fail to reproduce the full scope of quantum predictions (e.g., specific high-order interference, quantum computing speedups) or will require the epistemic state to effectively mirror the exponentially growing ontic state, defeating the purpose.
      *   **Signatory B (Epistemic) Prediction:** A theory with a constrained physical state space but an epistemic state utilizing efficient (e.g., Hilbert space) mathematics to track correlations is viable and could fully reproduce quantum predictions, demonstrating that the exponential growth is representational, not ontological.

  4.  **Crux: Viability of Retrocausal/Non-PI Models**
      *   **Question:** Can ψ-epistemic models that explicitly violate **Preparation Independence (PI)** (e.g., via retrocausality, cosmological boundary conditions, or holistic constraints) be developed into fully consistent, empirically adequate, and conceptually coherent interpretations that avoid the conclusions of PBR-type theorems *without* introducing greater problems (e.g., conflicts with relativistic causality, unacceptable global constraints, or empirical inadequacy)?
      *   **Relevant Consideration:** Development of specific retrocausal or global constraint models and examination of their internal consistency, compatibility with relativity, ability to reproduce quantum probabilities (including in delayed-choice and Bell-type scenarios), and overall parsimony.
      *   **Signatory A (Ontic) Prediction:** Such models will either fail empirically (deviate from QM predictions), become hopelessly complex and ad-hoc, or violate fundamental principles like relativistic causality/local Lorentz invariance in unacceptable ways.
      *   **Signatory B (Epistemic) Prediction:** Viable, conceptually interesting, and relativistically consistent retrocausal or non-PI epistemic models can be developed, providing a robust path around no-go theorems and offering novel perspectives on quantum phenomena.

  **Conclusion:** This statement clarifies where we stand together, where we part ways, and the specific paths forward we consider most likely to resolve our core disagreement. We commit to revisiting these cruxes as relevant research progresses.

