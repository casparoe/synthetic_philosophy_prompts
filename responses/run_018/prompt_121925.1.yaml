answer: |-
  ## Citizen Kane as Historiographical Argument: Testing Underdetermination

  Welles's *Citizen Kane* brilliantly functions as a staged argument about historical knowledge, dramatizing the tension between Rankean objectivity and Carr/Whitean skepticism through its fractured narrative structure. Your suspicion is largely correct: the film primarily illustrates **testimonial underdetermination**. Each witness (Thatcher, Bernstein, Leland, Susan, Raymond) possesses a fragmentary, self-serving, or temporally limited perspective. Thatcher sees Kane the financial asset; Bernstein the charismatic idealist; Leland the corrupted friend; Susan the oppressive captor; Raymond the isolated master. Their accounts conflict, omit, and emphasize selectively, leaving reporter Thompson (and the audience) unable to reconstruct a "true" Kane. The evidence is inherently incomplete and biased – the core Carr argument.

  However, the film *does* gesture towards **narrative underdetermination**, albeit subtly. Consider Susan Alexander’s account of her opera debut. Her fragmented, traumatic memory focuses on her terror and Kane’s distant, imposing figure. Leland’s account, while also critical of Kane forcing her, frames it within Kane’s broader decline and his own moral judgment ("He was disappointed in the world, so he built one of his own"). While the core facts (the disastrous performance) are consistent, the *emotional meaning* and its placement within Kane’s life story differ significantly. Susan’s version isolates it as personal torture; Leland integrates it into a narrative of hubris and decay. The same event supports two incompatible emotional/character arcs.

  Similarly, Thatcher’s memoir presents Kane's life as a trajectory of reckless idealism to irresponsible power, a decline narrative. Bernstein’s nostalgia, focusing on the early *Inquirer* days, presents an ascent narrative of youthful energy and purpose. The underlying facts (buying the *Inquirer*, crusading, expanding) are largely shared, but their selection and arrangement create opposing valuations of Kane’s life trajectory. This touches White’s argument: the facts don't dictate the *story shape* (ascent vs. decline).

  **The Omniscient Camera & Its Irony:** The film’s form *does* make a Rankean claim. The camera penetrates private spaces (Kane and Emily at breakfast, Susan alone in Xanadu), witnesses unseen moments (young Kane playing in the snow), and reveals "Rosebud." This access suggests an objective truth *is* possible. Yet, this profound irony *deepens* the skeptical reading. The audience, possessing the ultimate "fact" (Rosebud), *still* cannot grasp Kane’s essence. Knowing the sled’s significance doesn’t reconcile the testimonies, explain his contradictions, or make his life cohere. The camera's omniscience grants a fact but denies comprehension, demonstrating that even "complete" evidence (Rosebud + testimonies) cannot produce a single, satisfying Rankean narrative. The meaning remains elusive, resisting final capture.

  **Teaching Scenes/Devices:**
  1.  **The Newsreel ("News on the March")**: Dramatizes the immediate failure of purportively "objective," comprehensive history. It’s superficial, riddled with gaps ("Concerning the private life of this public man..."), and already imposes a simplistic narrative arc. *Supports Carr/White, resists Ranke.* Film complicates by showing its *production* (editors, narration choices), highlighting Carr's "selection."
  2.  **Susan Alexander's Opera Debut Sequence (Her telling vs. Leland's telling)**: Shows narrative underdetermination. Core event is stable, but emotional weight and narrative placement differ radically based on whose story it serves (Susan's victimhood vs. Leland's critique of Kane's fall). *Strongly supports White (emplotment), also Carr (perspective).* Resists simple "truth" recovery.
  3.  **The Thatcher Memoir vs. Bernstein's Nostalgia**: Contrasting narratives built largely on shared facts (early Kane career). Thatcher: decline from idealism to irresponsibility. Bernstein: ascent of energy and purpose. Demonstrates how selection and emphasis create incompatible story-shapes. *Supports White (narrative form) and Carr (interested perspective).* Film complicates by showing Bernstein's inherent bias (fondness).
  4.  **The Bookends (Snow Globe / Rosebud Reveal & Burning)**: The camera’s omniscience grants the ultimate "fact" but frames it with profound ambiguity. The burning sled signifies the final impossibility of capturing meaning, even with privileged information. *Deepens Carr/White skepticism dramatically.* Resists by providing the "fact" the characters lack, yet this very act proves its insufficiency.

  | Scene/Device             | Historiographical Claim Dramatized                       | Best Supports | Resistance/Complication                                                                 |
  | :----------------------- | :------------------------------------------------------- | :------------ | :-------------------------------------------------------------------------------------- |
  | Newsreel ("News on the March") | Failure of superficial "objective" compilation; inherent gaps/bias; pre-shaped narrative. | Carr & White  | Shows the *process* of selection (editors), reinforcing Carr, but its existence implies a Rankean ideal is sought. |
  | Susan's Opera Debut (Contrasting Accounts) | Narrative underdetermination: Same event yields incompatible emotional/narrative meanings (victimhood vs. hubris). | White         | While the *emotional* narratives differ, the core factual event (disastrous performance) is not contested, leaving a limited Rankean foothold. |
  | Thatcher Memoir vs. Bernstein Nostalgia | Emplotment: Shared facts (early career) used to build opposing story-shapes (decline vs. ascent). | White         | Bernstein’s perspective is explicitly nostalgic/fond, making his "ascent" narrative easier to dismiss as biased, potentially weakening the strict "same evidence" test. |
  | Bookends (Snow Globe/Rosebud Burning) | Omniscient access reveals a "fact" but demonstrates its ultimate insufficiency for meaning; past resists capture. | Carr & White  | The camera **has** privileged access (Rankean claim), making its failure to deliver meaning *more* potent for skepticism. |

