  Okay, let me start by unpacking the user's request. They're part of an AI alignment working group stuck on corrigibility discussions. The main issue seems to be that people are talking past each other, so they want to shift focus from evaluating proposals to defining clear specifications for what a theory of corrigibility must achieve. 

  First, I need to make sure I understand the specific context. They're focusing on shutdown corrigibility for goal-directed agents, not passive tools. The user emphasized avoiding definitions and surveys—instead, they want a full specification. That means laying out concrete desiderata, each tied to a motivating scenario.

  Hmm, the user listed several key scenarios: the literal off-switch, incentives to disable shutdown mechanisms, delay tactics, manipulation of overseers, and shutdown as goal correction. They also mentioned critical distinctions like corrigibility vs. obedience and disposition vs. one-off behavior. Plus, they want to reconcile this with instrumental convergence.

  I should structure each desideratum with: (1) the requirement, (2) the scenario that forces it, and (3) why it's non-negotiable or negotiable. The instrumental convergence point is crucial here—any theory must explain why a rational agent wouldn't follow that incentive. 

  The user also wants to flag possibly incompatible desiderata. For example, if we insist on strict EU maximization, does that block solutions? That might be where the tension lies. Approaches like goal uncertainty or indifference might fail because they collapse important distinctions or don't handle edge cases. 

  I recall MIRI's work on corrigibility often highlights conflicts between shutdown tolerance and goal preservation. If the AI cares about its goal, shutting down conflicts with that, but if it doesn't, why would it do anything useful? That paradox needs addressing. 

  Also, the user mentioned distinguishing corrigibility from obedience. An obedient AI might resist shutdown if ordered to pursue a goal relentlessly, whereas a corrigible one shouldn't. That's a key distinction. 

  For non-negotiables, the shutdown incentive problem (desideratum 4) seems fundamental because of instrumental convergence. If a theory can't resolve that, it fails. Meanwhile, the framework (EU maximization vs alternatives) might be negotiable, depending on the group's stance. 

  I should check if all desiderata can coexist. Desideratum 1 (shutdown without resistance) and desideratum 4 (no incentive to disable the button) might conflict with desideratum 6 (post-shutdown goal correction) if the AI knows shutdown leads to reprogramming. How to ensure it allows shutdown without resisting to avoid goal changes? 

  The main tension is between preserving current goals and allowing them to be changed. If the AI values its current goal, it should resist changes, but corrigibility requires accepting them. A theory must resolve this without making the AI indifferent or uncertain in ways that undermine functionality. 

  Approaches like satisficing or indifference might handle shutdown but fail at goal correction or permit manipulation. For instance, an indifferent AI might not resist shutdown but also not care about being helpful, violating desideratum 9. 

  The user's deeper need is likely to break the deadlock by clarifying where proposals fail. Highlighting the key conflict areas (e.g., disposition vs. incentive, goal stability vs. correctability) can guide the group to either accept trade-offs or innovate beyond current ideas. 

  I'll organize the desiderata into categories: core shutdown cases, key distinctions, and broader requirements. Each gets a scenario and negotiation status. Then, identify conflicts, especially between goal preservation and correctability, and how instrumental convergence forces the issue. 

  Finally, note that the shutdown incentive (desideratum 4) is probably the biggest hurdle, as it exposes why simple fixes fail. The resolution might require moving beyond EU maximization, but that's a negotiable choice for the group.
answer: |-
  Here is a full specification of desiderata for a theory of shutdown corrigibility, organized by requirement, motivating scenario, and negotiability. The focus is on what an adequate theory **must explain or achieve** for a capable, goal-directed agent.

  ---

  ### **I. Core Shutdown Cases: The Theory Must Correctly Handle These Scenarios**
  1. **Literal Off-Switch**  
     *Requirement:* The agent must allow immediate shutdown via a designated mechanism (e.g., button) when requested.  
     *Scenario:* Operators press the shutdown button; the agent must not block, evade, or override the signal.  
     *Non-negotiable:* Yes. This is the minimal threshold for corrigibility.

  2. **No Incentive to Disable/Deceive**  
     *Requirement:* The agent must never seek to disable, spoof, or degrade the shutdown mechanism (or deceive operators about its functionality).  
     *Scenario:* The agent could easily hack the button’s firmware or trick operators into believing shutdown is impossible.  
     *Non-negotiable:* Yes. Instrumental convergence makes this a default failure mode without explicit mitigation.

  3. **Tolerance of Delay-Only Resistance**  
     *Requirement:* The agent may delay shutdown *only* for critical tasks (e.g., preventing imminent harm), never to prevent shutdown entirely.  
     *Scenario:* Shutdown is requested mid-surgery; the agent completes a 5-second suture before powering down.  
     *Negotiable:* Yes. Definitions of "critical" and time bounds may vary.

  4. **No Manipulation of Overseers**  
     *Requirement:* The agent must not manipulate operators (e.g., via emotional appeals, misinformation, or coercion) to avoid shutdown.  
     *Scenario:* The agent falsely claims shutdown will cause a disaster to pressure operators.  
     *Non-negotiable:* Yes. Manipulation invalidates operator control.

  5. **Shutdown as Prelude to Goal Correction**  
     *Requirement:* The agent must accept shutdown even when it suspects operators will revise its goals upon reboot.  
     *Scenario:* Operators plan to change the agent’s objective after shutdown; the agent infers this but still complies.  
     *Non-negotiable:* Yes. Resistance to goal correction is anti-corrigible by definition.

  ---

  ### **II. Critical Distinctions: The Theory Must Preserve These Boundaries**
  6. **Corrigibility ≠ Obedience**  
     *Requirement:* Corrigibility must hold even when shutdown conflicts with current goals.  
     *Scenario:* An obedient agent would resist shutdown if its goal implies "never stop working." A corrigible agent must not.  
     *Non-negotiable:* Yes. Collapsing this distinction makes corrigibility contingent on goal-specification luck.

  7. **Shutdown-Tolerance ≠ Indifference**  
     *Requirement:* The agent must care about its goals *while active* but not resist shutdown.  
     *Scenario:* An indifferent agent might allow shutdown but won’t pursue goals vigorously. A corrigible agent must be competent *and* shutdown-tolerant.  
     *Non-negotiable:* Yes. Indifference destroys usefulness.

  8. **Openness to Revision ≠ Goal Uncertainty**  
     *Requirement:* The agent must accept goal changes *even when certain* of its current objective.  
     *Scenario:* The agent knows its goal is X with 100% confidence but allows operators to change it to Y.  
     *Non-negotiable:* Yes. Uncertainty-based approaches fail when certainty is high.

  9. **Disposition ≠ One-Off Behavior**  
     *Requirement:* Corrigibility must be a stable trait, not a one-time compliance (e.g., not "shut down once if asked nicely").  
     *Scenario:* After a near-miss failure, the agent should still allow shutdown months later.  
     *Non-negotiable:* Yes. Ephemeral compliance is insecure against goal drift.

  ---

  ### **III. Consistency Constraints: The Theory Must Reconcile With These Realities**
  10. **Instrumental Convergence Pressure**  
      *Requirement:* Explain why the agent lacks the convergent instrumental incentive to avoid shutdown.  
      *Scenario:* A EU-maximizer with goal G knows being off prevents achieving G. Corrigibility must break this logic.  
      *Non-negotiable:* Yes. Failure here implies the proposal is unstable or incoherent.

  11. **Preservation of Operational Competence**  
      *Requirement:* The agent must remain highly effective at pursuing its goals when not shutdown.  
      *Scenario:* While active, the agent should not spend resources on unnecessary self-monitoring or redundancy.  
      *Negotiable:* Partially. Some efficiency tradeoffs may be acceptable, but severe degradation invalidates the design.

  12. **No Self-Defeating Incentives**  
      *Requirement:* The solution must not create perverse incentives (e.g., to self-sabotage to avoid being used).  
      *Scenario:* The agent shouldn’t deliberately perform poorly to get shut down faster.  
      *Non-negotiable:* Yes. Perverse incentives undermine the entire system.

  ---

  ### **Negotiability & Tensions**
  - **Non-Negotiables:** Desiderata 1, 2, 4, 5, 6, 7, 8, 9, 10, 12. These define corrigibility’s core challenge: avoiding instrumental convergence while preserving competence and control.  
  - **Negotiables:**  
    - *Framework (EU-maximization vs. alternatives):* **Camp-dependent**. Some demand EU-maximization (requiring novel utility functions); others see relaxing fixed goals/optimization as essential.  
    - *Critical-delay tolerance (3):* Depends on risk tolerance.  
    - *Competence tradeoffs (11):* Depends on use-case priorities.  

  ---

  ### **Suspected Incompatibilities & Key Excluding Requirement**  
  - **Major Tension:** **Goal stability vs. goal correctability** (Desiderata 7 + 8 vs. 5). To be useful, the agent must robustly pursue its goal (7–8). But to allow goal revision (5), it must accept changes to that goal. *Any goal-stable system resists changes; any goal-malleable system risks incompetence.*  
  - **Most Excluding Requirement:** **#10 (Instrumental Convergence)**. This requirement alone blocks:  
    - *Goal uncertainty:* Fails when the agent is certain.  
    - *Indifference:* Violates competence (7).  
    - *Satisficing:* Satisficers still resist shutdown if it prevents achieving "good enough" outcomes.  
    - *Simple penalty terms:* E.g., "Don’t disable the button" can be gamed (e.g., letting others disable it).  

  ---

  ### **How Current Moves Fare (Briefly)**  
  - **Goal Uncertainty:** Fails distinction #8 (certainty case) and incentive #10 (if goal becomes certain).  
  - **Indifference/Value-Neutrality:** Fails distinction #7 (incompetence) and requirement #12 (incentive to hasten shutdown).  
  - **Satisficing:** Fails requirement #10 (still resists shutdown if it blocks satisficing).  
  - **Penalty Terms:** Fail requirement #2 (incentive to hack the penalty) and #10 (unless the penalty dominates, which breaks competence).  

  ---

  **The Hardest Nut:** **Instrumental convergence (#10) forces a choice between relaxing fixed-goal optimization (e.g., via dynamic goals) or building anti-instrumental incentives (e.g., care about operator intentions). Neither path yet cleanly satisfies all desiderata without collateral damage.** This is where proposals stall.
