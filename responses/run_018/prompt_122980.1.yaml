prompt: |-
  I sit on the acquisitions and attribution committee at a mid-sized museum, and on Thursday we have to rule on a genuinely nasty one, so I want my own head straight before I walk in. Please answer in British English, and please don't point me at any reading, case law or exhibition history — I can't get to a library this week and I'm not asking for citations, just for the reasoning.

  Here's our track record, so you can see the shape of us:

  1. An anonymous nineteenth-century copy of a very famous portrait (the original hangs in another country), in our collection since 1908, always labelled "after". We keep it on the wall, insure it for a token figure, and it goes in the guidebook as a copy.
  2. A Roman marble copy of a lost Greek bronze. Star object, full valuation, travels to loan shows, no one treats it as second-rate.
  3. A Dutch golden age panel we aquired in 1961 as "circle of the master"; panel dating plus a workshop account book later showed it was painted by a pupil in his shop, from his design, with his hand in the highlights. Relabelled "workshop of", stayed on the wall, valuation cut roughly in half.
  4. Three "newly discovered" Dutch pictures bought in good faith in the seventies, hung for twenty-five years, cited in a couple of theses, then exposed as the work of a twentieth-century forger with no connection to anybody. We pulled them, sold them off for a nominal sum, and haven't shown one since — a curator's proposal to hang one as a brilliant forgery in its own right was voted down.
  5. Posthumous productions: we bought a posthumous bronze from the artist's own mould, estate-authorised and stamped as posthumous, display it, value it at about a tenth of a lifetime cast; and we realise an instruction-based wall piece from her written instructions and a diagram, using our own technicians, supervised by her foundation, and hang it under her name at full value.
  6. A sixties canvas painted entirely by the artist's studio assistant under a written agreement that the artist would sign and sell it as his. The arrangement was openly acknowledged in the studio and the artist never denied it. When the agreement surfaced in 2004 we relabelled it "conceived and signed by X, executed by Y", kept it up, cut the valuation by about a third.

  The new one: a big 1954 abstraction, given to us in 1985, hung and catalogued ever since as by Rees. It is the single most reproduced image of the whole movement — half the survey books use it, painters cite it as the thing that changed how they worked. Rees's diaries (found by his granddaughter, handwriting checked, published last year) contain an entry that reads as half confession, half shrug: his partner Nadel, a trained painter, did the entire surface from his full-size cartoon while he was in hospital; he signed it; he then exhibited it, wrote about it in letters as his own work, and never corrected anyone. Technical work finds no trace of Rees's hand. The cartoon survives in his hand and matches exactly. Nadel had her own career and since her death her work sells for about what a mid-range Rees does. The donor's family have lawyers writing letters saying the gift fails if it's not a Rees, and a big Rees retrospective in two years wants to borrow it and needs to know what to print in the catalogue.

  So: predict what we'll actually do on the three decisions — the catalogue attribution, whether it stays on the wall, and the insurance figure — and then tell me what we should do if we want to be consistent with ourselves. Which rule are we implicitly running, and which two or three other rules fit those six precedents just as well? What does each of them say here? I think the closest analog is genuinely up for grabs between 3 and 6 on one side and 4 on the other, so say what turns on which one we pick. If our precedents really don't settle it, be explicit about the principle we'd be committing to with each option — is the value in the hand, in the design and the signing, in what a viewer can get out of the object, in what the object has actually gone on to do in the world, or in not being complicit in a deception? And give me the one further hypothetical variant of this case that would best separate those rules, with what each predicts about it — my own candidates are: same facts but Nadel is an unknown studio hand with no career of her own; same facts but the picture only became famous after someone proposed the reattribution; same facts but Rees had credited her in the 1954 exhibition catalogue. Tell me which of those (or what else) does the most work, and why.
reasoning: |-
  Okay, this is a complex ethical and procedural question from someone deeply involved in museum governance. The user sits on an acquisitions committee facing a contentious attribution case involving a historically significant painting with newly revealed authorship complications. They've provided six detailed precedents to establish their institution's existing framework, and now need help navigating a decision on three specific points: attribution, display status, and valuation for a 1954 abstraction attributed to Rees but now proven executed by his partner Nadel.

  First, I need to parse their institutional history carefully. The precedents show nuanced treatment of authenticity: they distinguish between copies (1), ancient reproductions (2), workshop productions (3), forgeries (4), posthumous works (5), and collaborative pieces (6). Key factors in their decisions appear to be: material authenticity (technical evidence), historical intent (how the work was presented originally), cultural significance, and transparency about provenance. 

  The current case presents multiple tensions: the work's enormous art-historical importance as the "most reproduced image of the whole movement" versus the diary evidence confirming Nadel's execution; the legal threat from donors versus ethical obligation to accuracy; and the retrospective's practical needs versus scholarly integrity. The user specifically flags precedents 3 (workshop attribution, value halved) and 6 (collaborative credit, value cut by third) as competing analogies versus precedent 4 (forgery, deaccessioned).

  For prediction, I suspect the committee will compromise: retain display with revised attribution ("Designed by Rees, executed by Nadel"), maintain insurance near current value due to fame, but risk donor litigation. This mirrors precedent 6's approach most closely. But ethically, precedent 3's "workshop" model might be more appropriate - though Nadel wasn't Rees's pupil, their partnership parallels master-workshop dynamics. 

  The core principles at play seem to be: 
  A) Material authenticity (whose hand made it) 
  B) Creative authority (whose vision/concept) 
  C) Historical reception (how it was understood) 
  D) Transparency (correcting record) 
  E) Cultural impact (its actual influence)

  Precedent 6 prioritizes B+D; precedent 3 emphasizes A; precedent 4 rejects anything deceptive. Here, since the cartoon (creative source) is Rees's and Nadel was a peer, B+D support shared credit. The hypotheticals help test principles: if Nadel were unknown (emphasizes A), if fame came only after reattribution (tests C), or if Rees credited her originally (clarifies D). The unknown assistant variant most starkly contrasts A vs B - would likely trigger precedent 3's devaluation or even precedent 4's removal if deemed deceptive. 

  Ultimately, consistency requires either: 
  - Precedent 6's model (creative credit + execution credit) with moderate devaluation 
  - Or a new "partnership" category acknowledging their unique relationship. 

  The donor threat shouldn't dictate scholarship, but pragmatically might require phased reattribution. For the retrospective, "Rees with Nadel" seems most historically honest.
answer: |-
  Right, let's crack this with surgical clarity. Your precedents reveal an institutional philosophy that **privileges material authenticity and authorial intent over market perception or historical impact**, but with pragmatic flexibility for cultural significance. Here's how Thursday likely unfolds:

  ### Predictions for Committee Action
  1. **Catalogue Attribution**: "Designed by Rees, executed by Nadel" (or "Rees and Nadel")  
  2. **Wall Display**: Kept on permanent display  
  3. **Insurance Value**: Reduced by ~30-40% (not deaccessioned like #4, but devalued like #3/6)  
  *Why?* The work's fame and role in art history make removal unthinkable (#2, #3, #5, #6), but technical proof of Nadel's hand demands attribution adjustment (#3, #6). Donor threats will be ignored on principle (#4 sets this precedent).  

  ### What You *Should* Do to Be Consistent  
  Apply **Precedent #6** (sixties canvas):  
  - **Attribution**: "Conceived by Rees, executed by Nadel" (mirroring "conceived by X, executed by Y")  
  - **Display**: Retain (cultural impact parallels #6's retained display)  
  - **Insurance**: Cut by ~30% (as with #6's devaluation for execution by another)  
  *Consistency hinges on:*  
  - Rees’s cartoon = "conception" (like #6’s artist agreement)  
  - Nadel’s execution under known arrangement (like #6’s assistant)  
  - No fraud (unlike #4’s forger)  

  ### The Implicit Rule in Your Precedents  
  **"Material execution defines primary attribution unless overridden by explicit, contemporaneous creative intent."**  
  - Your museum cares *who made the object* (#1, #3, #4, #6) but allows:  
    - Ancient reproductions (#2) as artifacts in their own right.  
    - Posthumous works (#5) only when *authorised process* verifies intent.  
  - **Nadel’s hand is decisive here** (as pupil’s hand was in #3, assistant’s in #6).  

  ### Two Other Rules That Fit Your Precedents  
  1. **"Creative Origin Rule"** (favours design over hand):  
     - Values the mind behind the work.  
     - *Here:* Attribute solely to Rees (his cartoon, intent to claim it).  
     - *Fits:* #5 (instruction-based piece at full value), #2 (Roman copy valued as art).  
     - *Clashes:* #3 (devalued for pupil’s hand), #6 (devalued for assistant).  

  2. **"Cultural Impact Rule"** (favours legacy over facts):  
     - Attributes based on historical reception/effect.  
     - *Here:* Keep as "Rees" (it changed art history as his work).  
     - *Fits:* #2 (copy valued as star object), #5 (posthumous at full value if culturally resonant).  
     - *Clashes:* #4 (forgeries pulled despite scholarly citations), #1 (copy given token value).  

  ### Why Precedent #4 (Forgery) Doesn’t Apply  
  - #4 involved *deception* (fraudulent intent). Here, no fraud: arrangement was known to Rees/Nadel, just undisclosed publicly. Precedent #6 (transparent studio agreement) is the true analog.  

  ### The Decisive Hypothetical  
  **"Same facts but Nadel was an unknown studio hand with no career."**  
  - **Material Execution Rule (your implicit rule):**  
    - Attribute "Rees with studio assistant" → Devalue significantly (like #3’s workshop piece).  
  - **Creative Origin Rule:**  
    - Attribute to Rees alone → Maintain value (design/intent paramount).  
  - **Cultural Impact Rule:**  
    - Attribute to Rees → Full value (fame transcends maker).  
  *Why this works best:* It isolates the conflict between *hand* (material) and *mind* (design). Your precedents #3 and #6 side with *hand* when the maker lacks independent stature.  

  ### Principles at Stake  
  - **Material Execution:** Truth in making (avoiding deception).  
  - **Creative Origin:** Truth in conception (honouring authorship).  
  - **Cultural Impact:** Truth in reception (acknowledging influence).  
  - **Transparency:** Truth in labelling (correcting the record).  

  **Your path:** Honour transparency and material truth (Nadel’s hand) without erasing Rees’s conception or the work’s impact. Reduce value to reflect execution, but display it prominently—because what hangs on the wall is *what the object truly is*, not what we wished it to be. The donor’s lawyers can grumble; museums aren’t in the business of perpetuating fictions to please benefactors (#4 proved that). And for the retrospective? "Rees and Nadel, 1954" tells the richer story.  

  Thursday will be tense, but your precedents *do* point the way. Stick to the evidence of the hand.
