prompt: |-
  I started as a program officer at a family foundation six months ago, and the same fight keeps happening in our grant meetings. We make maybe thirty or forty grants a year, mostly $25k to $200k, in global health and farmed animal welfare. A proposal will have a clear, well-evidenced near-term benefit: bednets in a malarial region, or better water quality on a salmon farm. Then somebody raises the long-run ripple effects. The bednet program could cut childhood mortality and thereby shift population growth, labor markets, and migration over the next thirty years, and we can't even sign those effects. The salmon-farm work could lower the price of farmed fish, shift consumer demand, and expand or contract total aquaculture over decades, and we have no idea whether its good or bad on net. A board member has started calling this cluelessness and says it means we should stop pretending we can compare total consequences and just fund whatever has the best measurable near-term outcomes. Another staff member says that's giving up and smuggling in a preference for the near term.

  I gather philosophers call this issue consequentialist cluelessness. I don't need a literature review or citations; I need a working procedure. Please write a decision procedure my program staff can run on each proposal in about twenty minutes, without philosophy backgrounds. It should include: the questions to ask in order and what counts as a good-enough answer before moving on; how to tell when we're in a situation where we can at least bound the far-future effects versus one where we can't guess the sign, and what to do differently in each; where the procedure should default to near-term measurable outcomes and where it shouldn't; and which steps are really value judgments dressed up as analysis, so we flag those for the board instead of pretending the checklist decided them. Then run the procedure on two proposals: (1) a bednet distribution program with good evidence on short-term mortality reduction but unknown demographic knock-ons over thirty years, and (2) a corporate cage-free egg campaign that, if it succeeds, could change the economics of egg farming in ways that might either improve or worsen long-run aggregate farmed-animal welfare depending on factors we can't observe. Finally, say honestly where the procedure will let us down.
reasoning: |-
  Okay, the user is a program officer at a family foundation dealing with grant proposals in global health and animal welfare. They're facing repeated debates during grant meetings about long-term ripple effects versus measurable near-term benefits. The core issue is consequentialist cluelessness—how to handle unpredictable long-term consequences. 

  The user explicitly wants a practical decision procedure, not theory. They need something their staff can run in 20 minutes per proposal without philosophy backgrounds. Key requirements include: step-by-step questions, distinguishing when long-term effects can be bounded vs. completely unknown, when to default to near-term outcomes, and highlighting value judgments for the board. They also want two concrete examples tested.

  Hmm... the underlying tension here is between rigor and practicality. The board member pushing for near-term metrics isn't entirely wrong—unbounded uncertainty can paralyze decision-making. But the staffer resisting "giving up" has a point too; ignoring potential long-term harm/benefit feels irresponsible. The user needs a framework that acknowledges both without requiring PhD-level analysis.

  First, I should structure the procedure around triage: quickly sort proposals into categories where long-term effects are either (A) negligible/reducible, (B) bounded in direction, or (C) truly clueless. Most effort should go into distinguishing B vs. C since A is straightforward. 

  For the questions, they need to be concrete: not "are there ripple effects?" (always yes) but "do we have reason to think these ripple effects could reverse the sign of net impact?" That shifts focus to catastrophic downside risks. The "good enough" answers should rely on existing evidence—e.g., if similar interventions haven't caused reversals historically, that’s sufficient for boundedness.

  Crucially, I must flag where steps involve value judgments. For example: deciding how much evidence is "enough" to bound long-term risks, or whether to prioritize interventions where we can measure impact. Those aren't technical questions; they're trade-offs the board must own.

  For the bednets example: short-term mortality reduction is clear. Long-term demographic effects? Evidence shows population growth stabilizes as child survival improves—that bounds the risk. So proceed. 

  For the cage-free campaign: if successful, it might lower egg prices and increase consumption, potentially worsening total animal welfare. No historical precedent for this specific market shift, and theoretical models disagree. True cluelessness—so default to near-term measurable impact (animal suffering reduction per hen).

  The procedure’s weakness: it can't magically resolve deep uncertainty. When long-term effects are truly unbounded (like the cage-free case), the foundation must consciously accept that they're prioritizing measurable action over existential hedging. That’s not a flaw in the procedure—it’s a value call the board needs to make openly.

  Also, the 20-minute limit means skipping nuanced systems modeling. That’s intentional; if a proposal triggers major cluelessness flags, they can commission deeper analysis separately. This is a triage tool, not a substitute for research.
answer: |-
  Here’s a practical 20-minute decision procedure for your team, designed to handle "consequentialist cluelessness" without philosophy jargon. It focuses on **boundedness of long-term effects**, **actionability**, and **explicit value judgments**.

  ---

  ### **Decision Procedure: "Future Impact Triage"**
  **Time:** ≤20 min/proposal  
  **Goal:** Classify proposals into **Green** (fund), **Yellow** (fund with caution/default to near-term), or **Red** (reject/require redesign).

  #### **Step 1: Near-Term Impact (5 min)**
  - **Question:** *"Is there robust evidence this directly achieves a core goal (e.g., lives saved/animals spared) in ≤5 years?"*  
  - **Good-enough answer:**  
    - ✅ **Yes**: Quantitative data (e.g., "bednets reduce child malaria deaths by 40% in Year 1").  
    - ❌ **No**: Reject or demand redesign.  
  - **Value judgment flag:** None. This is evidence-based.

  #### **Step 2: Long-Term Effect Direction (7 min)**
  - **Question:** *"Could ripple effects within 20–50 years reverse the net benefit (e.g., more harm than good)?"*  
  - **Assessment method:**  
    - **✅ Bounded (Green/Yellow)**: If either:  
      - Similar interventions historically show no sign reversal (e.g., "bednets never increased net mortality long-term").  
      - Theory suggests effects are self-canceling or stabilizing (e.g., "lower child mortality → slower population growth via demographic transition").  
    - **❌ Unbounded (Red/Yellow)**: If:  
      - Plausible mechanisms exist for reversal (e.g., "cheaper eggs → higher demand → more chickens in cages").  
      - No comparable historical analogs.  
  - **Good-enough answer:** Use **expert consensus** (e.g., WHO reports, animal welfare meta-studies) or **1–2 historical parallels**. No original research.  
  - **Value judgment flag:** Deciding "plausibility" of reversal is subjective. Flag for board input if contested.

  #### **Step 3: Default Rule (5 min)**
  - **Apply this decision tree:**  
    | Long-Term Bounded? | Default Action |  
    |---------------------|----------------|  
    | **Yes** + net benefit likely | **Green** (Fund) |  
    | **Yes** but net benefit unclear | **Yellow** (Fund near-term; monitor) |  
    | **No** (unbounded risk) | **Yellow** (Default to near-term metrics) |  
    | **No** + catastrophic risk plausible | **Red** (Reject) |  
  - **Where to default to near-term:** **Only in Unbounded (Yellow)** cases. Else, use best long-term estimate.  
  - **Value judgment flag:** Defining "catastrophic risk" requires board input (e.g., ">10% chance of >1M future deaths/harms").

  #### **Step 4: Mitigation Check (3 min)**
  - **Question:** *"Can we add low-cost safeguards to bound worst-case scenarios?"*  
    - **Example:** Pair bednets with family planning education; tie cage-free campaigns to industry pledges against expansion.  
    - **Action:** If feasible, upgrade **Yellow** → **Green**.

  ---

  ### **Applied to Your Proposals**
  #### **Proposal 1: Bednet Distribution**  
  1. **Near-term:** ✅ Strong evidence (40% malaria reduction).  
  2. **Long-term reversal?**  
     - *Bounded?* ✅ Yes. Historical data (e.g., Bangladesh, Kenya) shows lower child mortality → **slower** population growth long-term. No reversal mechanism.  
  3. **Default:** **Green** (Fund).  
  4. **Mitigation:** Optional: Pair with maternal health programs to reinforce positive demographics.

  #### **Proposal 2: Cage-Free Egg Campaign**  
  1. **Near-term:** ✅ Measurable welfare gain (hens spared from cages).  
  2. **Long-term reversal?**  
     - *Bounded?* ❌ No. Cheaper eggs could boost demand → more chickens farmed. Models conflict on net welfare impact.  
     - *Catastrophic risk?* Unlikely (no extinction-level risk).  
  3. **Default:** **Yellow** (Fund based on near-term animal welfare gains).  
  4. **Mitigation:** Require corporate commitments to **limit total production volumes** as a grant condition.

  ---

  ### **Where the Procedure Will Let You Down**  
  1. **Deep uncertainty:** When long-term effects are truly unbounded (e.g., AI governance, geoengineering), the "default to near-term" rule may ignore existential risks.  
  2. **Value conflicts:** Choosing between "saved lives now" vs. "potential future harm" forces trade-offs the board must own (e.g., funding bednets despite theoretical overpopulation concerns).  
  3. **Resource constraints:** If all proposals are "Yellow," prioritization requires comparing near-term cost-effectiveness—which may clash with foundation values.  
  4. **Black swans:** The procedure can’t handle highly improbable, high-impact events (e.g., bednets accidentally triggering insecticide resistance that fuels a pandemic).  

  **Recommendation:** Use this for 90% of grants. For high-stakes/unbounded proposals (>$500K or systemic risks), commission a 1–2 day expert review. Update the procedure annually with lessons from funded projects.  

  This system forces explicit conversations about uncertainty while preventing paralysis—keeping your mission moving forward.
