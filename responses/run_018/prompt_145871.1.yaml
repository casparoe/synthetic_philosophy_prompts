prompt: |-
  I'm currently taking a seminar on cross-cultural moral psychology and the philosophy of emotion, where we've been working through whether guilt or shame is the healthier moral emotion and whether a culture can legitimately choose which one to institutionalize. My professor has taken the following positions in our discussions, which I have reconstructed as consistently as I can.

  First, regarding a scholar who falsified data in a single co-authored paper but could fully correct the record through retraction and apology: she argued that guilt is the appropriate emotional response, and that shame is a misfire because it targets the global self rather than the discrete, reparable act.

  Second, regarding citizens of a nation that committed historical atrocities in which they played no personal part: she argued that shame, not guilt, is appropriate, since there is no specific deed to repair—only a tainted collective identity.

  Third, regarding a modern liberal democratic culture organized around personal accountability and contractual repair: she said it should cultivate guilt as its primary moral emotion.

  Fourth, regarding a traditional honor-based society organized around face, hierarchy, and communal standing: she said it should cultivate shame as its primary moral emotion.

  Fifth, regarding an individual within that honor society who commits a discrete, reparable wrong—stealing food from a neighbor—and is subjected to public shaming rituals: she insisted that even within that culture, guilt should be cultivated for the individual act, while shame remains appropriate only for collective-status violations.

  Now consider a new case. A deliberately engineered intentional community—the Meridian Collective—has reconstructed its social norms from scratch. They organize economic and ecological life collectively, so every member shares responsibility for systemic outputs (resource extraction, climate debt) that no single person can repair alone. They have explicitly abolished hierarchical face and individual blame mechanisms. To preserve egalitarian cohesion, they reject shame as a tool of social ranking. Instead, they institutionalize distributed collective guilt: every member is expected to feel guilty for the system's aggregate harms, and repair is pursued through collective restructuring rather than individual atonement. They ask whether their emotional framework is coherent and whether, on my professor's view, they have selected the correct architecture for their culture.

  Please structure your response with the following sections in this order:

  1. Track Record and Implicit Rules (about 150 words): lay out the two most plausible rules that jointly explain the five verdicts, showing how each maps onto the cases.

  2. The New Case: Two Predictions (about 250 words): state what each rule predicts for the Meridian Collective—whether it endorses their distributed-guilt design, condemns it, or corrects it—and identify the closest analog among the five precedents for each prediction.

  3. Best Guess and Adopted Principle (about 200 words): give your best guess at what the professor would actually say, with reasons for preferring that rule, and state explicitly what normative principle she would be adopting either way.

  4. The Crucial Distinguishing Case (about 100 words): name one further hypothetical case that would definitively tell the two rules apart.

  I'm less interested in a generic essay on guilt and shame than in the consistency analysis: the competing rules, their divergence on this engineered collective, the recommended verdict, and the test case that separates them.
reasoning: |-
  Okay, the user is in a seminar discussing cross-cultural moral psychology and the philosophy of emotion. They've outlined their professor's positions on five cases involving guilt and shame. Now they're presenting a new case about the Meridian Collective, an intentional community that institutionalizes distributed collective guilt. The user wants a structured analysis focusing on consistency with the professor's prior positions, not a general essay on guilt and shame.

  Hmm, the professor seems to have a nuanced view. In the first case (data falsification), she favors guilt because it targets a reparable act. But in the second case (historical atrocities), she endorses shame for collective identity taint. For institutional design, she recommends guilt for liberal societies and shame for honor-based ones. The fifth case is interesting - even in an honor society, she distinguishes between individual acts (should be guilt) and collective-status issues (shame).

  The key tension is between two possible implicit rules: One focusing on reparability (guilt for fixable acts, shame for irreparable stains), the other on agency type (guilt for individual actions, shame for group identity). The Meridian Collective case really tests these rules because they've created systemic harms that are collectively caused but individually irreparable.

  For the "Track Record" section, I need to extract two plausible rules from the five cases. Rule A would be about reparability: guilt when harm is reparable by the agent, shame when it's not. Rule B would be about agency: guilt for individual actions, shame for group identity. Each explains the cases well but might diverge on Meridian.

  For "Predictions", Rule A would reject Meridian's guilt framework because systemic harms aren't individually reparable - similar to the historical atrocities case. Rule B would endorse it because they're assigning guilt to individuals for collective outputs, like the historical case but flipped. The fifth case (theft in honor society) shows the professor distinguishing individual acts from collective identity.

  My best guess is the professor would endorse Meridian's approach under Rule B, adopting the principle that "moral emotions should track the locus of responsibility as defined by the culture's metaphysics." She'd likely argue that since Meridian views responsibility as collective, guilt is coherent. The alternative reparability principle would create tension.

  To definitively distinguish these rules, I propose a case where a group faces an irreparable harm caused by individual negligence - like a community destroyed by one engineer's uncorrected error. Rule A would prescribe shame (irreparable), Rule B would prescribe guilt (individual agency).
answer: |-
  ### 1. Track Record and Implicit Rules  
  The professor’s five verdicts suggest two implicit rules:  
  - **Rule A (Reparability Focus):** *Guilt* targets *reparable individual acts*, while *shame* targets *irreparable stains on identity* (individual or collective).  
    - **Mapping:** Case 1 (falsified data: reparable act → guilt); Case 2 (historical atrocities: irreparable identity stain → shame); Case 5 (theft: reparable individual act *should* elicit guilt despite cultural shame norms).  
  - **Rule B (Agency-Type Focus):** *Guilt* responds to *individual moral agency*, while *shame* responds to *collective identity*.  
    - **Mapping:** Case 1 (individual act → guilt); Case 2 (collective identity → shame); Case 4 (honor society centers collective identity → shame). Case 3 and Case 5 affirm that guilt remains tied to individual agency even in shame-dominant cultures.  

  ---

  ### 2. The New Case: Two Predictions  
  - **Rule A (Reparability Focus) Prediction:** *Condemns* Meridian’s design. Systemic harms (e.g., climate debt) are irreparable by any *individual*, so guilt is a misfire; shame should apply to the irreparably tainted collective identity.  
    - **Closest Analog:** Case 2 (historical atrocities). Both involve non-reparable collective harms, where shame—not individual guilt—is appropriate.  
  - **Rule B (Agency-Type Focus) Prediction:** *Endorses* Meridian’s design. By framing systemic harms as products of *shared individual agency* (via collective participation), guilt is coherent. Shame is rejected as it targets hierarchical identity, which Meridian abolished.  
    - **Closest Analog:** Case 2’s *inversion*. Case 2 absolves individuals of guilt for collective identity stains; Meridian *assigns* guilt to individuals *for* collective outputs by redefining agency as inherently shared.  

  ---

  ### 3. Best Guess and Adopted Principle  
  **Best Guess:** The professor would **endorse Meridian’s framework under Rule B** (Agency-Type Focus).  
  - **Reasons:**  
    1. Rule B better explains Case 5 (individual theft in honor society): guilt remains normatively correct for individual acts *regardless* of cultural shame institutions.  
    2. Meridian’s abolition of hierarchy eliminates shame’s social function (per Case 4), while its collectivist agency model reframes systemic harms as products of individual participation—making guilt coherent.  
    3. Rule A’s reparability criterion fails in Case 2: shame is prescribed despite atrocities being *collectively* reparable (e.g., via reparations). Rule B’s focus on agency-type avoids this tension.  

  **Adopted Principle:**  
  > *"A culture legitimately institutionalizes guilt or shame based on its metaphysics of moral agency. Guilt is valid when responsibility is assigned to individual actors (even for collective outcomes); shame is valid when responsibility is embedded in non-individualized collective identity."*  

  ---

  ### 4. The Crucial Distinguishing Case  
  **Case Proposal:**  
  > *An artist in a liberal democracy unintentionally creates a work that becomes a hate symbol. The harm is irreparable (it spreads virally) and stems solely from her individual act, but she had no malicious intent.*  

  - **Rule A (Reparability)** → *Shame* (irreparable identity stain for the artist).  
  - **Rule B (Agency-Type)** → *Guilt* (individual act, even if irreparable).  
  This forces a choice: if the professor prescribes guilt, Rule B prevails; if shame, Rule A holds.
