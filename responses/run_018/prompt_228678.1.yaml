prompt: |-
  I'm putting together the syllabus for a graduate seminar on rational choice, and I keep running into the same frustration with how textbooks handle Parfit's hitchhiker case and the surrounding cluster of puzzles about rational irrationality. The case, briefly: a man is stranded in the desert and will die without a ride; a driver stops who is an excellent judge of character, and who will take him to the city only if she is confident he will pay her on arrival; once safely in the city, he has every reason not to pay, and the driver knows this. Intuitively the best thing he could do is somehow make himself into someone who would pay -- but at the moment of payment, standard rationality seems to tell him to keep the money. Parfit used this and related cases to argue that being rational can sometimes require making oneself irrational, or at least that a theory of rationality can be indirectly self-defeating. I've discussed this with colleagues and we disagree about almost everything, including what a theory of rationality is even supposed to do with such cases.

  Acting as a specialist in decision theory and practical reason, write the desiderata that an adequate theory of rational choice in the vicinity of this case must meet -- a specification I can then use to evaluate the main contenders (evidential and causal decision theory, resolute-choice views of the McClennen sort, sophisticated/dynamic-consistency views, and dispositions-based or rational-irrationality views of the Parfitian sort). Take your time and think carefully; before finalizing the list, brainstorm the tricky borderline cases a good specification must handle, then keep only what earns its place.

  Please structure your response in the following sections, in this order:

  1. Preliminaries and purpose (roughly 150 words): state what the theory is supposed to be adequate *for* (normative guidance for agents? prediction? a constitutive account of practical reason?), since the desiderata shift with the purpose.

  2. The desiderata (the core of the response, roughly 600-800 words): each requirement with the case or consideration motivating it. Cover, at minimum: what the theory must say the hitchhiker should do and why; how it must handle the moment of payment (the decision the theory seemingly can't endorse even when it endorses setting up the situation); whether it must deliver verdicts for cases where being disposed to act irrationally is itself instrumentally valuable (e.g., threats, promises, toxin puzzles of the Kavka sort, deterrence); what it must say about self-effacing theories -- whether a true theory of rationality is allowed to recommend that agents not follow or even not know it; and which structural constraints (dynamic consistency, separability, independence of irrelevant alternatives) are genuine requirements versus camp-specific prejudices.

  3. Negotiable versus non-negotiable (roughly 150 words): mark which desiderata you take to be hard constraints and which are desiderata only for particular camps.

  4. Joint satisfiability (roughly 150-200 words): this is the part I care most about. If some subset of your desiderata cannot be jointly satisfied -- say, requiring both that rationality always guides action at the moment of choice and that it be instrumentally optimal across the hitchhiker case -- prove or argue for the incompatibility rather than merely gesturing at it.

  5. Brief scorecard (roughly 200 words, no more): the main contenders against the list, one short paragraph each. Keep the weight on the criteria, not the scoring.

  Avoid summarizing the literature at length; I know the standard positions and want the specification, not a survey.
reasoning: |-
  Hmm, the user is designing a graduate seminar on rational choice theory and needs help structuring desiderata for evaluating theories against Parfit's hitchhiker paradox. This is a sophisticated request from someone clearly deeply familiar with the literature but frustrated by textbook treatments.

  The core tension revolves around whether rationality can demand self-sabotage. The user wants desiderata that will help evaluate decision theories (EDT, CDT, resolute choice, sophisticated choice, disposition-based views) on how they handle cases where:
  - Instrumental rationality seems to conflict with itself across time
  - Being predictably irrational becomes advantageous
  - Theories might recommend their own rejection

  I should start by clarifying the purpose: this is clearly for normative guidance since it's about what agents should do. The desiderata must reflect that.

  For the desiderata section, I need to cover:
  1) The hitchhiker's initial action (should commit to paying)
  2) The payment moment paradox (theory mustn't endorse defection there)
  3) Instrumental irrationality cases (threats, promises, Kavka's toxin)
  4) Self-effacement questions
  5) Structural constraints (dynamic consistency etc.)

  Key tricky cases beyond hitchhiker to consider:
  - Kavka's toxin (commitment to irrational act)
  - Nuclear deterrence (threatening what you wouldn't do)
  - Self-binding (Odysseus tying himself)

  For joint satisfiability, the real tension is between local rationality (always choosing best option now) and global rationality (best overall outcome). I need to prove these can't both be satisfied in hitchhiker - if local rationality says "don't pay at t2", that prevents the t1 benefit.

  In the scorecard, I'll be brutally honest about each theory's tradeoffs:
  - CDT fails global rationality
  - EDT fails local rationality
  - Resolute choice violates separability
  - Sophisticated choice allows self-sabotage
  - Disposition views make rationality circumstantial

  The user wants this for teaching, so I should make the tensions crystal clear while remaining neutral. The value is in showing how each theory resolves (or avoids) the paradox by prioritizing different desiderata.
answer: |-
  ### 1. Preliminaries and Purpose  
  The theory must provide **normative guidance for agents** in sequential decision problems under certainty or risk. It should prescribe what agents *ought* to do to achieve their goals (e.g., survival, utility maximization), not merely predict behavior or analyze concepts. Desiderata thus prioritize coherence, effectiveness, and action-guidance. Crucially, it must resolve conflicts between local rationality (optimality at a choice node) and global rationality (optimality across a decision tree). If the theory fails to guide agents to instrumentally superior outcomes—or demands self-sabotage—it risks inadequacy.

  ---

  ### 2. The Desiderata  
  **D1: Global Instrumental Dominance**  
  *Motivation*: In the hitchhiker case, the agent survives only if he commits to paying. A theory must endorse actions that secure existence-enabling outcomes.  
  *Requirement*: At t1 (pre-ride), the theory must prescribe becoming disposed to pay at t2 (post-ride), as this is necessary for survival. Rejecting this (e.g., by refusing to commit) is disastrous.

  **D2: Local Action-Guidance Without Self-Defeat**  
  *Motivation*: At t2, paying $100 nets −100 utils; keeping it nets 0. Standard rationality seems to demand defection. But if the theory prescribes defection here, it undermines D1.  
  *Requirement*: The theory must either (a) prescribe paying at t2 *without* ad hoc adjustments, or (b) explain why t2’s choice is constrained by prior commitments in a way that overrides local optimization. It cannot endorse defection at t2 while requiring commitment at t1.

  **D3: Handling Instrumentally Valuable "Irrationality"**  
  *Motivation*: Cases like Kavka’s toxin (gaining $1M for intending to drink toxin, though drinking it is irrational ex post) or credible threats (threatening to do something harmful if bluff is called) require dispositions to act against local interests.  
  *Requirement*: The theory must endorse adopting such dispositions when they yield better outcomes, and explain how agents can rationally act on them at execution time (e.g., drinking the toxin if the payoff structure binds intention to action).

  **D4: Non-Self-Effacement Constrained**  
  *Motivation*: If the "true" theory of rationality recommends ignoring itself (e.g., "don’t be rational if it helps"), it becomes pragmatically inert.  
  *Requirement*: The theory may allow agents to *use* irrational dispositions as tools (D3), but it cannot universally recommend rejecting its own prescriptions. Rationality must remain the default framework, even if contextually overridden.

  **D5: Dynamic Consistency as Optional**  
  *Motivation*: Sophisticated-choice theories prioritize consistency (plan-then-execute without regret), but this forces hitchhikers to reject rides. Resolute choice violates consistency by sticking to plans despite new incentives.  
  *Requirement*: Dynamic consistency is negotiable. The theory may violate it (e.g., resolute commitment) if required by D1–D3. Separability (evaluating subtrees independently) and independence of irrelevant alternatives are similarly defeasible if they conflict with global dominance.

  **D6: No Ghostly Costs**  
  *Motivation*: Some theories (e.g., evidential decision theory in hitchhiker) impose "rational regrets" for past choices, affecting current decisions. This can sabotage D1.  
  *Requirement*: The theory must evaluate choices *prospectively*. Costs/benefits of past actions (e.g., becoming trustworthy) are sunk; only future consequences matter at t2.

  ---

  ### 3. Negotiable vs. Non-Negotiable  
  **Non-negotiable**: D1 (global dominance), D2 (no self-defeat at execution), D6 (no ghostly costs). Without these, the theory fails core instrumentalism.  
  **Negotiable**: D5 (dynamic consistency/separability) and D4 (non-self-effacement). Theories may treat consistency as axiomatic (sophisticated choice) or allow self-effacement (some Parfitian views), but must justify tradeoffs against D1–D3.

  ---

  ### 4. Joint Satisfiability: The Core Incompatibility  
  D1 and a strict interpretation of D2 are **jointly unsatisfiable** with local action-guidance under separability.  
  - *Proof*: D1 requires committing at t1 to pay at t2. But at t2, paying is locally dominated by not paying (D2’s "standard rationality" demand). Separability implies t2’s choice must ignore t1’s context, forcing defection—undermining D1.  
  - *Implication*: Any theory satisfying D1 must relax separability (e.g., resolute choice) or redefine rationality at t2 (e.g., disposition-based views where "rationality" includes role-dependent duties). Theories insisting on separability (e.g., CDT) fail D1; those rejecting local dominance (e.g., EDT) fail D2.

  ---

  ### 5. Brief Scorecard Against Desiderata  
  **Causal Decision Theory (CDT)**: Fails D1/D3: At t1, hitchhiker won’t commit (since CDT calculates t2 defection as certain). Passes D2 (defection at t2 is "rational") but violates D6 (defection is caused by CDT’s own recommendation).  

  **Evidential Decision Theory (EDT)**: Fails D2/D6: At t2, paying is "rational" (as evidence of being trustworthy aids survival), but this makes t1 commitment trivial—ignoring the counterfactual where untrustworthy agents get rides. D1 is satisfied accidentally, not robustly.  

  **Resolute Choice (McClennen)**: Satisfies D1/D2 by rejecting separability (D5): Agents stick to t1’s optimal plan (paying) at t2. Struggles with D3 (e.g., toxin puzzle) unless plans bind intentions.  

  **Sophisticated Choice**: Fails D1: Anticipates t2 defection, so rejects ride at t1. Satisfies D2 and D5 (consistent) but sacrifices global optimality.  

  **Disposition-Based (Parfit)**: Satisfies D1/D3: Rationality involves cultivating "irrational" dispositions. At t2, paying is rational *because* it flows from a valuable disposition. Challenges D4 (self-effacement: "true" rationality may involve ignoring act-by-act optimization).  

  ---
  This specification prioritizes *instrumental efficacy* while exposing tensions between synchronic and diachronic rationality. Use it to test whether contenders resolve the hitchhiker paradox—or relocate the paradox into their foundations.
