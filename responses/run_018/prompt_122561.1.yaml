prompt: |-
  I am a psychological wellbeing practitioner in an NHS Talking Therapies service, and I run a six-session guided self-help group for people with worry, health anxiety and work-related burnout. More and more clients arrive already carrying a version of the modern Stoic revival — the podcasts, the week-long Stoic courses, the harder-edged founder-bro version — and they bring it into the room as a tool: the dichotomy between what is up to us and what is not, attributed to Epictetus at the opening of the handbook compiled from his lectures, and usually drawn on a flipchart as two circles. In supervision I have been told that the modern word control imports something the ancients did not mean in quite that way: what is up to us is not what we can causally manipulate but what is attributable to our own judgement and choice alone, so that not only the weather and other people's opinions but also our health, our reputation and our own bodies fall on the far side of the line. My supervisor used two Greek terms I only half followed — one for the faculty that is up to us, one for the habit of attaching a reservation along the lines of if nothing prevents it to every aim one adopts — and she also insisted the two circles are not a licence for quietism, since the ancient Stoics expected the person who has made progress to stand for office, marry and take part in public affairs unless something prevents it.

  What I need is a procedure rather than an explanation: something I can run in about twenty minutes with a client who has written down six things they are worried about, and that a trainee with our six-week training could run too. Give me the questions in the order they should be asked, what counts as an adequate answer to each, where the procedure stops with a no, and where it hands the decision back to the client because the matter is one of values rather than classification. Three features of the material worry me and I want them built into the design rather than footnoted. First, most of what clients bring is partly influenceable — a promotion panel, a son's drug use, a union ballot, an election — so a strict dichotomy returns an answer that feels wrong, while the three-ring version popular in management self-help (what I control, what I can influence, what I must accept) seems truer to how action actually works and may lose the whole point of the exercise; tell me whether to keep the middle ring and what the procedure loses either way. Second, clients cannot switch their assent at will: panic attacks, intrusive thoughts and grief are not up to us in any sense a distressed person will recognise, so the procedure needs a timescale — what can be trained over months versus what can be chosen in the next ten minutes — and needs to say plainly when the tool should be withdrawn, because I have clients who turn the question is this up to me into a fresh checking ritual. Third, my group finds it appalling that the ancient view apparently counts grief itself as a judgement and therefore as up to us; say whether the procedure absorbs that or brackets it.

  Then run it, in the form a session would actually take, on three cases: a client anxious about a promotion panel next week; a client whose adult son is using drugs and who oscillates between I can make him stop and nothing I do makes any difference; and a client who has concluded that a colleague's harassment of her is not up to me and has gone quiet about it. I suspect the procedure will tell me something about that third case I will not want to hear, and I would rather hear it. Finally, state what the procedure cannot do: the presentations on which it must not be used at all, and the points at which no amount of structuring removes the need for clinical judgement. Begin with a single sentence — the one my trainees could memorise and pin above the desk — that states the procedure's core move, then give the procedure and the worked cases; no preamble, and no restatement of what I have asked.
reasoning: |-
  We are designing a 20-minute procedure for clients to apply Stoic principles to their worries, with specific attention to:
  1. The distinction between "up to us" (attributable solely to our judgment and choice) and not.
  2. Handling partly influenceable situations without losing the essence of the dichotomy.
  3. Acknowledging that some responses (like panic, intrusive thoughts) are not immediately controllable and require training over time.
  4. Avoiding turning the exercise into a checking ritual.
  5. Addressing the Stoic view that emotions (like grief) are judgments (thus "up to us") but bracketing this if necessary for clinical reasons.

  The procedure must be usable by trainees and must stop or hand back decisions at appropriate points.

  Core move (to be memorized and pinned above the desk):
  "Classify the target of worry by whether it is solely attributable to your own judgment and choice at this moment; if not, identify the judgment about it that is up to you and the action you can take with a reservation."

  Procedure Steps (with questions, adequate answers, stop points, and hand-back points):

  Step 1: Identify the worry.
     Question: "What exactly are you worried about? Please state it as clearly as possible."
     Adequate answer: A specific event, situation, or outcome (e.g., "I am worried that I will not get the promotion").
     Note: If the client states a feeling (e.g., "I am worried about my anxiety"), proceed but note that we will return to feelings in Step 3.

  Step 2: Break down the worry into the target (the external) and the judgment (the internal).
     Question: "What is the specific event or situation you are concerned about? And what is your judgment about it? (That is, what do you believe about it or how do you evaluate it?)"
     Adequate answer: 
        - The target (external): e.g., "the promotion panel's decision", "my son's drug use", "the harassment from my colleague".
        - The judgment (internal): e.g., "I believe that if I don't get promoted, I am a failure", "I think my son's drug use is a reflection of my parenting", "I feel that the harassment is unbearable and I must make it stop".

  Step 3: Apply the core move to the target.
     Question: "Is the target (the event/situation) solely up to your own judgment and choice? That is, do you have complete control over it by your own will right now?"
     Adequate answer:
        - If yes: This is rare. Examples: Only our own judgments, choices, and actions (in the present moment) are up to us. Even then, note that we are not always in full control of our judgments (if they are habitual). But if the client says, for example, "I am worried about whether I will choose to practice my presentation today", then the target (the choice) is up to them. Then proceed to Step 4a.
        - If no (which is most common): Then the target is not up to us. Proceed to Step 4b.

     Stop point: If the client is stuck on whether something is up to them and it becomes a checking ritual, stop and say: "This exercise is not about certainty. It's about recognizing that most external events are not entirely up to us. For now, we'll assume that if it involves something outside your own mind (like other people, the future, or your body), it's not entirely up to you. We'll focus on what you can do in the next step."

     Note: We are not using a middle ring (influence) in the core classification because the Stoic point is that we only have absolute control over our judgments and choices. However, we will address influence in Step 4b.

  Step 4: Branch based on Step 3.
     a) If the target is up to us (which is rare and typically only when the target is a current judgment or choice):
          Question: "What is the judgment or choice that is up to you? And what action will you take on it right now?"
          Adequate answer: The client identifies a specific mental or physical action they can take immediately (e.g., "I choose to focus on preparing for the presentation for the next 30 minutes").
          Then skip to Step 5.

     b) If the target is not up to us (the usual case):
          Question 1: "Since the target is not entirely up to you, what judgment about this situation is up to you? (What belief or evaluation are you making that you might be able to change?)"
          Adequate answer: The client identifies a judgment (e.g., "I am telling myself that if I don't get promoted, I am a failure" or "I believe I must make my son stop using drugs").

          Question 2: "What action can you take that is up to you, keeping in mind that the outcome is not entirely in your hands? (We call this acting with a reservation: 'I will do X, if nothing prevents it.')"
          Adequate answer: The client identifies an action they can take that is within their control (e.g., "I will prepare well for the panel and then accept whatever decision they make", "I will talk to my son calmly about my concerns and offer support, but I cannot force him to stop", "I will report the harassment to HR and document it, but I cannot control my colleague's behavior").

          Hand-back point: If the action involves a value judgment (e.g., "Should I report the harassment or not?"), then the procedure cannot decide that. Say: "This is a decision about what you value and what aligns with your principles. I can help you clarify the options, but the choice is yours. What do you think is the right thing to do?"

  Step 5: Address the emotional response (if it was the initial worry or if it comes up).
     Note: This step brackets the Stoic view that emotions are judgments and therefore up to us, because we are working with distressed clients who cannot change their emotions at will.
     Question: "How do you feel about this situation? And is that feeling something you can change right now?"
     Adequate answer:
        - If the feeling is intense and immediate (panic, grief, intrusive thoughts): 
            Say: "This feeling is not something you can simply switch off. It is understandable and may require practice over time to change. For now, we can focus on what you can do at the level of action and judgment, and we can work on the feeling with other techniques if needed."
        - If the feeling is a milder reaction (annoyance, mild anxiety) and the client feels they can reframe it: 
            Then they can apply the core move to the judgment underlying the feeling.

     Stop point: If the client is using the exercise to check whether they should feel a certain way, stop and say: "We are not using this tool to judge your feelings. The goal is to help you focus on what you can do. Your feelings are valid and we can work on them in other ways."

  Step 6: Summarize and set an action.
     Question: "What is the one thing you will do in the next 24 hours that is up to you? And what judgment will you try to hold in mind?"
     Adequate answer: A concrete action and a reframed thought (if applicable) that the client commits to.

     Hand-back point: The client must choose the action. The procedure does not prescribe it.

  Additional rules:
  - Do not use the procedure when:
     a) The client is in acute crisis (e.g., suicidal ideation, active psychosis).
     b) The worry is clearly about a past event that cannot be changed (then use techniques for acceptance or compassion).
     c) The client has OCD and the exercise becomes a compulsion (then use exposure techniques instead).
  - Clinical judgment is needed at every step to assess whether the client is becoming distressed or ritualistic.

  Now, run the procedure on three cases:

  Case 1: Client anxious about a promotion panel next week.

  Therapist: "What exactly are you worried about?"
  Client: "I'm worried that I won't get the promotion."

  Therapist: "What is the specific event or situation? And what is your judgment about it?"
  Client: "The event is the promotion panel's decision. My judgment is that if I don't get it, I'm a failure and my career is over."

  Therapist: "Is the promotion panel's decision solely up to your own judgment and choice right now?"
  Client: "No, I can't control what they decide."

  Therapist: "Since it's not up to you, what judgment about this situation is up to you?"
  Client: "I guess I'm telling myself that I must get this promotion to be successful. That's something I can change."

  Therapist: "What action can you take that is up to you, with a reservation?"
  Client: "I can prepare thoroughly for the panel and do my best. But the outcome is not entirely in my hands. So I'll do my best and then accept whatever happens."

  Therapist: "How do you feel about this?"
  Client: "Very anxious."

  Therapist: "That anxiety is understandable. It's not something you can switch off right now. But by focusing on what you can control (preparation and your judgment about the outcome), we can reduce the anxiety over time. For now, what one thing will you do in the next 24 hours that is up to you?"
  Client: "I will spend an hour preparing my presentation for the panel. And I will remind myself that I am doing my best and that's all I can do."

  Case 2: Client whose adult son is using drugs and oscillates between "I can make him stop" and "nothing I do makes any difference".

  Therapist: "What exactly are you worried about?"
  Client: "I'm worried that my son will ruin his life with drugs."

  Therapist: "What is the specific event or situation? And what is your judgment about it?"
  Client: "The situation is my son's drug use. I judge that it's my fault and I must fix it."

  Therapist: "Is your son's drug use solely up to your own judgment and choice?"
  Client: "No, I can't control what he does."

  Therapist: "Since it's not up to you, what judgment about this situation is up to you?"
  Client: "I feel responsible and that I have to fix it. But I guess that's my judgment."

  Therapist: "What action can you take that is up to you, with a reservation?"
  Client: "I can talk to him calmly about my concerns and offer to help him find treatment. But I can't force him. So I'll do that, and if he refuses, I have to accept that."

  Therapist: "How do you feel about this?"
  Client: "Helpless and guilty."

  Therapist: "Those feelings are very difficult and won't go away immediately. We can work on them, but for now, focus on what you can do. What one thing will you do in the next 24 hours that is up to you?"
  Client: "I will call my son and ask if we can talk, without blaming. And I will remind myself that I can only do my part."

  Case 3: Client who has concluded that a colleague's harassment is not up to her and has gone quiet about it.

  Therapist: "What exactly are you worried about?"
  Client: "I'm not worried anymore. I've accepted that the harassment is not up to me, so I've stopped talking about it."

  Therapist: "What is the specific event or situation? And what is your judgment about it?"
  Client: "The harassment from my colleague. I judge that it's not up to me to change it, so I should just accept it."

  Therapist: "Is the colleague's behavior solely up to your judgment and choice?"
  Client: "No, I can't control what he does."

  Therapist: "Since it's not up to you, what judgment about this situation is up to you?"
  Client: "I think I'm judging that it's not my responsibility to do anything."

  Therapist: "What action can you take that is up to you, with a reservation?"
  Client: "I could report it to HR or talk to my manager, but I don't want to make things worse. Also, I've decided it's not up to me."

  Therapist: (Hand-back point) "Choosing to report it or not is a decision about your values. What do you think is the right thing to do? The Stoic principle is not about passivity but about taking action that is up to you, while accepting that the outcome (whether the harassment stops) is not entirely in your hands. So the action of reporting is up to you, even if the outcome isn't."

  Client: "I guess I could report it, but I'm afraid of retaliation."

  Therapist: "That fear is real. The procedure doesn't tell you what to do, but it helps clarify what is up to you. Reporting is an action that is up to you. You can do it with the reservation that you cannot control the outcome. Alternatively, you might choose to seek support from a union or a lawyer. What do you value in this situation?"

  Client: "I value my safety and dignity. So I think I should report it."

  Therapist: "Then what one thing will you do in the next 24 hours that is up to you?"
  Client: "I will write down what happened and email HR."

  In this third case, the procedure reveals that the client has misinterpreted "not up to me" as meaning she should take no action. The Stoic approach actually encourages taking appropriate action (which is up to her) while accepting that the outcome (whether the colleague stops) is not entirely up to her.

  What the procedure cannot do:
  - It cannot resolve deep-seated trauma or personality disorders.
  - It cannot replace exposure work for OCD or phobias.
  - It cannot make value judgments for the client.
  - It is not a substitute for building therapeutic rapport and safety.
answer: |-
  **Core move to memorize and pin above the desk:**  
  "Separate what is solely up to your judgment and choice right now from what isn't, then focus on your actionable response to the latter with a realistic reservation ('I will do X, if nothing prevents it')."

  ---

  ### **The Procedure: 20-Minute Worry Classification**  
  *Structure: 6 questions, ordered for clarity. Time per question: 2–4 minutes. Total: 20 minutes.*  
  *Trainee note: Use a flipchart with two circles labeled "Up to Me" (judgment/choice) and "Not Up to Me" (all else). Skip the "influence" ring—it dilutes the Stoic point that only judgment is truly controllable.*  

  #### **Step 1: Pinpoint the worry**  
  **Question:** *"What specific situation or outcome are you worried about? State it in one sentence."*  
  - **Adequate answer:** Concrete, external event (e.g., "My promotion panel next week," "My son’s drug use," "My colleague’s harassment").  
  - **Stop if:** The worry is a feeling (e.g., "I’m worried about my panic attacks"). Redirect: *"Let’s name the event causing this feeling."*  
  - **Why:** Avoids vagueness. Feelings are addressed later.  

  #### **Step 2: Identify the target vs. your judgment**  
  **Question:** *"What part of this is the external target (e.g., others’ actions, events)? What’s your judgment about it (e.g., ‘This must not happen’ or ‘It means X about me’)?"*  
  - **Adequate answer:**  
    - *Target:* External, factual (e.g., "The panel’s decision," "My son using drugs," "My colleague’s behavior").  
    - *Judgment:* Belief/interpretation (e.g., "If I fail, I’m worthless," "I’m a bad parent," "This harassment will ruin my life").  
  - **Stop if:** Judgment is fused with target (e.g., "My son is disgusting"). Reframe: *"Separate his actions from your thoughts about them."*  

  #### **Step 3: Classify the target—is it solely up to you?**  
  **Question:** *"Is this target 100% up to your judgment and choice right now? Could you change it instantly by deciding to?"*  
  - **Adequate answer:**  
    - **Yes (Rare):** Only if it’s a current mental/physical action (e.g., "My choice to practice for the panel today"). Proceed to Step 4a.  
    - **No (Typical):** If it involves others, the future, or your body (e.g., "Panel’s decision," "Son’s choices," "Colleague’s actions"). Proceed to Step 4b.  
  - **Stop if:**  
    - Client obsessively checks ("But what if I try harder?"): Withdraw the tool. Say: *"This isn’t about forcing control. If it’s not 100% up to you right now, we’ll call it ‘not up to me’ and move on."*  
    - Timescale note: Emphasize *"right now"* (e.g., panic attacks aren’t instantly changeable; they need training).  

  #### **Step 4a: If target is up to you (Rare branch)**  
  **Question:** *"What specific action will you take on this in the next 10 minutes?"*  
  - **Adequate answer:** Immediate, actionable step (e.g., "I’ll rehearse my presentation now").  
  - **Proceed to Step 6.**  

  #### **Step 4b: If target is not up to you (Typical branch)**  
  **Question 4b(i):** *"What judgment about this target is up to you to reconsider? (e.g., ‘I must control this’ or ‘It defines me’)"*  
  - **Adequate answer:** Identifies a modifiable belief (e.g., "I tell myself I’m responsible for my son’s choices," "I think harassment proves I’m weak").  
  - **Hand-back if:** Judgment conflicts with values (e.g., "Should I fight or accept this?"). Say: *"This is about your values, not classification. What feels right to you?"*  

  **Question 4b(ii):** *"What’s one action you can take toward this, with a reservation? (e.g., ‘I will do X, if nothing prevents it’)"*  
  - **Adequate answer:**  
    - Actionable step within their control (e.g., "I’ll prepare for the panel," "I’ll talk to my son kindly," "I’ll report to HR").  
    - Reservation: Acknowledges uncertainty (e.g., "...but I can’t force the outcome").  
  - **Stop if:** Action is impossible (e.g., grief). Say: *"Some things aren’t fixable now. Let’s focus on coping, not solving."*  

  #### **Step 5: Address feelings—bracket the Stoic "judgment" view**  
  **Question:** *"How does this make you feel? Is that feeling changeable by you in the next 10 minutes?"*  
  - **Adequate answer:**  
    - If feeling is involuntary (e.g., panic, grief): *"This isn’t something to ‘fix’ now. It’s okay to feel it; we’ll manage it with other tools."*  
    - If mild/modifiable (e.g., annoyance): *"What judgment could soften this feeling?"*  
  - **Bracketing note:** Explicitly avoid labeling grief/etc. as "up to you." Say: *"Feelings aren’t failures—they’re often automatic. We focus on actions first."*  
  - **Stop if:** Tool becomes ritual (e.g., "Should I feel differently?"): Withdraw. Say: *"This exercise is for action, not feeling audits."*  

  #### **Step 6: Commit to action**  
  **Question:** *"What’s one thing you’ll do in the next 24 hours? What judgment will you hold lightly?"*  
  - **Adequate answer:** Specific, time-bound action + non-rigid belief (e.g., "I’ll email HR about the harassment—and remind myself I can’t control my colleague, but I can speak up").  
  - **Hand-back always:** Client chooses the action. Trainee only ensures it’s controllable.  

  ---

  ### **Worked Cases**  
  *Trainee note: Use flipchart to write targets/judgments/actions in the two circles.*  

  #### **Case 1: Promotion panel anxiety**  
  - **Step 1:** Worry = "I’ll fail the promotion panel next week."  
  - **Step 2:** Target = Panel’s decision. Judgment = "If I fail, I’m worthless."  
  - **Step 3:** Target not up to client (panel’s choice).  
  - **Step 4b(i):** Judgment up to client = "I’m defining myself by this outcome."  
  - **Step 4b(ii):** Action = "I’ll prepare my presentation (if nothing prevents it), but I can’t control the result."  
  - **Step 5:** Feeling = Anxiety. Not changeable now. Normalize: *"It’s normal to feel this. Focus on prep."*  
  - **Step 6:** Action = "I’ll practice my speech for 30 minutes today. I’ll hold lightly: ‘My worth isn’t defined by this.’"  

  #### **Case 2: Son’s drug use**  
  - **Step 1:** Worry = "My son is using drugs; he’ll ruin his life."  
  - **Step 2:** Target = Son’s choices. Judgment = "I’m a bad parent if I don’t stop this."  
  - **Step 3:** Target not up to client (son’s autonomy).  
  - **Step 4b(i):** Judgment up to client = "I must control this to be a good parent."  
  - **Step 4b(ii):** Action = "I’ll express concern and offer support (if he’s willing), but I can’t force change."  
  - **Step 5:** Feeling = Helplessness. Not fixable now. Validate: *"This is painful. Your action is what’s up to you."*  
  - **Step 6:** Action = "I’ll call him tomorrow to talk, without blame. I’ll hold lightly: ‘I can care, but not control.’"  

  #### **Case 3: Colleague’s harassment (client is quiet)**  
  - **Step 1:** Worry = "My colleague harasses me, but it’s not up to me."  
  - **Step 2:** Target = Colleague’s behavior. Judgment = "I must accept this to avoid conflict."  
  - **Step 3:** Target not up to client (harasser’s actions).  
  - **Step 4b(i):** Judgment up to client = "Speaking up is pointless."  
  - **Step 4b(ii):** Action = **Hand-back for values:** *"Reporting is up to you—but the outcome isn’t. What aligns with your self-respect?"* Client might say: "I value safety, so I’ll report it."  
  - **Step 5:** Feeling = Fear. Not changeable instantly. Support: *"Fear is real. Focus on the action you choose."*  
  - **Step 6:** Action = "I’ll document incidents and email HR today. I’ll hold lightly: ‘I can act, but not control them.’"  
  - **Hard truth:** The client’s quietism misapplies Stoicism. The procedure reveals that *inaction* is a choice—and values (e.g., self-respect) must guide whether to act.  

  ---

  ### **What the Procedure Cannot Do**  
  - **Do not use with:**  
    - Acute risk (e.g., suicidality, psychosis)—prioritize safety planning.  
    - OCD rumination/checking—this tool may become a compulsion.  
    - Trauma triggers—requires grounding, not cognitive analysis.  
    - Grief/loss—acceptance is needed, not "control" framing.  
  - **Clinical judgment needed at:**  
    - Step 3: If client is rigid or ritualistic.  
    - Step 4b(ii): When actions involve risk (e.g., harassment retaliation).  
    - Step 5: If feelings overwhelm—switch to distress tolerance.  
  - **Limits:** Cannot resolve values conflicts (hand back to client) or automate assent (requires long-term practice).
