                Foragers:
                  1. Instructor rolls 7d6, announces total.
                  2. They must consume all. They divide equally? 
                     - If total >=7, they each get at least 1? They can have a feast for the extra.
                     - If total <7, they each get less than 1? They are hungry.
                  3. Record: no storage, so move to next round.

                Farmers:
                  0. (Starting round 2) Instructor asks: "Does anyone want to call in a debt?" 
                     - Creditors can call in one debt per round (per debtor). The debtor will work for them this harvest.
                  1. Harvest:
                     - Each farmer who is working for themselves (and not called to work for a creditor) rolls one die.
                     - For each debt called, the creditor rolls two dice (one for themselves and one for the debtor) and adds them. The debtor does not roll for themselves.
                     - Record each player's harvest.
                  2. Consumption: 
                     - Each farmer subtracts 1 food (from harvest first, then stored).
                     - If they don't have 1 food from harvest and stored, they are hungry and must go to step 4 (obligation phase).
                  3. Storage: 
                     - They add any leftover harvest to stored.
                  4. Obligation Phase:
                     - Each hungry farmer (who didn't get 1 food) must ask for food from someone with stored food.
                     - The surplus holder can choose to: 
                           a) give freely -> no debt
                           b) demand a debt token -> if the hungry farmer agrees, they get the food and the debt is recorded (on the whiteboard). 
                           c) refuse.
                     - If they are refused, they are weak next round (they will roll a d4 for their own harvest next round, if they work for themselves).
                  5. Update the stored food and debts.

          Debrief (20 mins):

              - Ask the farmers: when did obligations appear? How did it feel to be in debt? To have power?
              - Ask the foragers: how did it feel to have feast or famine without storage?
              - Map to history: the stored surplus in farming allowed for the emergence of debt and hierarchy. This is the origin of property, inequality, and eventually states.
              - What did the game miss? 
                    - Health costs: farmers had more disease and shorter stature.
                    - Ecological lock-in: once you farm, you can't go back because the land is transformed and populations grow.
                    - Also, the game simplified by having individual farms; in reality, there might be communal storage but then controlled by chiefs.
              - What went wrong? 
                    - One farmer might not lend to anyone, causing a collapse? 
                    - Or, the group might be too nice and avoid debts, so hierarchies don't form.
                    - The dice rolls might be too good or too bad.

          Total: 5+5+30+20 = 60 mins, leaving 15 mins buffer.

     Let's hope it works!

     Note: We didn't include conflict rules. But the loyalty aspect we skipped. We can add a note in the debrief that debt could also be called for loyalty in conflicts, but we didn't simulate conflicts.

     This is a simulation of the hidden obligations that arise from storage.

     We'll call the game: "The Weight of Grain"
answer: |-
  Here’s a classroom simulation designed to make students viscerally grasp the "hidden debt" dynamic of stored surplus in farming versus the immediate-sharing ethos of foraging. It runs in parallel with minimal setup and leans into emergent gameplay.

  ---

  ### **Game Title:** *The Grain & The Gathering*  
  **Time:** 60-70 minutes (including debrief)  
  **Students:** 14 undergrads (split into 2 groups of 7: **Foragers** and **Farmers**)  
  **Materials:**  
  - Foragers: 14d6 (dice), a "Feast Bowl" (central pot).  
  - Farmers: 7d6, 50 dried beans (or tokens), small bags for "storage," index cards for "debt-records."  
  - Instructor: Whiteboard to track rounds.  

  ---

  ### **Setup (5 mins)**  
  1. **Split Groups:**  
     - **Foragers:** Nomadic band. No storage allowed.  
     - **Farmers:** Settled village. Can store surplus.  
     - *Keep groups physically separate (e.g., opposite sides of the room).*  

  2. **Rules (Read Aloud):**  
     - **Both Groups:**  
       - Each person needs **1 food/day** to survive.  
       - **Seasons:** 5 rounds (Spring, Summer, Fall, Winter, Spring).  
     - **Foragers Only:**  
       - Food spoils if not eaten daily. Share *all* food immediately.  
       - *"Roll for the land's bounty together, but remember: the mammoth rots by dawn."*  
     - **Farmers Only:**  
       - Store extra food for hard times.  
       - *"Your granary protects you, but the soil demands loyalty."*  
     - **DO NOT EXPLAIN** debt mechanics. Let farmers discover it.  

  ---

  ### **Gameplay (30-35 mins, 5 rounds × 6 mins each)**  
  **Each Round:**  
  1. **Seasonal Event (Instructor announces):**  
     - *Spring/Summer:* Bounty (farmers roll 1d6/person, foragers roll 2d6/person).  
     - *Fall:* Moderate (1d6 all).  
     - *Winter:* Scarcity (farmers roll 1d4/person, foragers roll 1d6 for the *group*).  
     - *Final Spring:* Bounty (1d6 all).  

  2. **Group Actions:**  
     - **Foragers:**  
       - Roll dice → total = group’s food.  
       - **Must** divide food equally *now*. Any leftover spoils.  
       - If food < players, all take **hunger token** (penalty: -1 to next roll).  
     - **Farmers:**  
       - Roll dice → each player gets food = roll result.  
       - Eat 1 food. Store surplus in bags.  
       - **Hidden Mechanic:** If a player stores ≥2 surplus, they may **demand labor** from someone with ≤1 stored.  
         - *How it works:* The "rich" farmer secretly writes a demand on an index card (e.g., "Work my field tomorrow," "Give me your beans," "Support my leadership").  
         - Target must accept or refuse.  
         - *If accepted:* Obligation is recorded (farmer holds the card). Debt must be repaid next round (e.g., give 1 labor = -1 to your roll, +1 to theirs).  
         - *If refused:* The "rich" can take 1 bean from target’s storage (simulating social pressure).  

  3. **End of Round:**  
     - Foragers reset to 0 food.  
     - Farmers keep stored beans. Hunger tokens apply next round.  

  ---

  ### **Predictable Issues & Fixes**  
  - **Problem:** A farmer hoards all beans → becomes a "tyrant."  
    - **Fix:** Let it happen! Debrief how hoarding creates power imbalances.  
  - **Problem:** Foragers try to store food.  
    - **Fix:** Enforce spoilage: "The berries molded. They’re gone."  
  - **Problem:** Farmers avoid conflict → no debts form.  
    - **Fix:** Winter scarcity forces interactions. Whisper to a "rich" player: "Psst... you could make them owe you."  
  - **Problem:** Groups copy each other.  
    - **Fix:** Physically separate them. Give farmers private instructions.  

  ---

  ### **Debrief (15-20 mins)**  
  1. **Farmers First:**  
     - *"When did obligations appear? How did it feel to demand labor? To owe someone?"*  
     - Highlight the moment stored surplus enabled social leverage → "hidden debts."  

  2. **Foragers:**  
     - *"How did sharing feel? Did scarcity unite or stress you?"*  
     - Contrast: No debts, but no buffer against bad seasons.  

  3. **Map to History:**  
     - Stored surplus → informal debts → hierarchies (chiefs, priests, elites).  
     - Agriculture’s paradox: More food, but less freedom.  

  4. **Honest Gaps:**  
     - **Health costs:** Farming caused malnutrition (tell them: "IRL, farmers were 6" shorter!").  
     - **Lock-in:** Population growth made return to foraging impossible.  
     - **What we missed:** Gender roles, environmental damage, war.  

  ---

  ### **Why This Works**  
  - **Foragers** feel the stress/joy of communalism.  
  - **Farmers** accidentally create oppression via gameplay.  
  - The "hidden debt" mechanic reveals hierarchy’s origins organically.  
  - Quick, chaotic, and memorable — no lecturing needed.  

  **Pro Tip:** Assign a "scribe" in each group to journal emotions. Use their quotes in the debrief!
