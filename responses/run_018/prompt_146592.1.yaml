prompt: |-
  In the context of mechanistic anomaly detection—where one must flag when a system deviates structurally from a reference mechanism despite surface functional similarities—there is a prior conceptual question: what conditions must be satisfied for two particular instances to count as realizing the same mechanism? I want a full specification of the desiderata that any adequate criterion of mechanistic identity must meet for this purpose. For each desideratum, state the concrete case or failure mode that motivates it—such as the need to tolerate redundant internal wiring that preserves causal dependencies, or the need to reject analogies between systems with identical input-output profiles but divergent internal causal architectures. Mark which requirements are non-negotiable—those without which the criterion collapses either into bare functional equivalence or into unhelpful physical token-identity—and which are negotiable commitments of particular methodological camps, such as substrate independence, determinism of the mechanism-to-implementation mapping, or invariance under scale transformation. Then indicate whether any subset of these desiderata is jointly unsatisfiable, especially whether accommodating both fine-grained intervention-sensitive specificity and broad cross-substrate generalization forces an unavoidable trade-off. Conclude with a brief conceptual assessment of how informal practices in mechanistic interpretability and causal modeling currently stand against this list, but do not supply bibliographies, named citations, or reading lists; the evaluation should rest on conceptual adequacy alone.
reasoning: |-
  We are to specify desiderata for a criterion of mechanistic identity in the context of mechanistic anomaly detection. The criterion must be able to flag when a system deviates structurally from a reference mechanism while possibly having similar surface functionality.

  We break down the desiderata into non-negotiable (without which the criterion collapses) and negotiable (which might be subject to methodological choices). We also consider potential trade-offs.

  ### Non-Negotiable Desiderata

  1. **Causal Dependency Preservation (Desideratum CDP)**
     - **Motivation**: A system may have redundant wiring (e.g., two parallel pathways that do the same thing) but if the causal dependencies (i.e., which outputs depend on which inputs and in what way) are preserved, then it should count as the same mechanism. Without this, we might flag benign redundancy as an anomaly.
     - **Concrete Case**: Consider a circuit with two identical resistors in parallel versus one resistor. The causal dependencies (voltage-current relationship) are the same. A criterion that requires exact physical structure would flag this as an anomaly, but it shouldn't.

  2. **Rejection of Bare Functional Equivalence (Desideratum RFE)**
     - **Motivation**: We must reject systems that have identical input-output behavior but different internal causal structures. Otherwise, we collapse into functionalism and cannot detect structural anomalies that are functionally equivalent.
     - **Concrete Case**: A system that computes XOR via a lookup table versus one that uses a genuine XOR gate. Both have the same I/O profile, but the lookup table does not have the same causal structure (it lacks the actual gate and may have a different intervention profile). We must flag the lookup table as an anomaly if the reference is the gate.

  3. **Intervention Sensitivity (Desideratum IS)**
     - **Motivation**: The identity criterion must be sensitive to interventions. If an intervention on an internal part produces different counterfactual behavior in two systems, then they are not the same mechanism.
     - **Concrete Case**: In two electronic circuits, if shorting a particular node in one causes a failure mode that does not occur in the other when the corresponding node is shorted, then they are not the same mechanism.

  4. **Compositionality (Desideratum COMP)**
     - **Motivation**: The mechanism is composed of parts and their organization. The identity criterion must account for the arrangement and interactions of the parts. Without this, we cannot capture the structure.
     - **Concrete Case**: Two systems with the same set of transistors but arranged in a different circuit topology (e.g., series vs. parallel) should not be considered the same mechanism.

  ### Negotiable Desiderata

  5. **Substrate Independence (Desideratum SI)**
     - **Motivation**: The same mechanism might be implemented in different physical substrates (e.g., electronic vs. hydraulic computers). Some camps (like functionalists) require this, while others (like biological realists) might reject it.
     - **Concrete Case**: A mechanical calculator and an electronic calculator that compute the same function with the same causal dependencies might be considered the same mechanism under SI, but without it, they are different.

  6. **Determinism of Mechanism-to-Implementation Mapping (Desideratum DET)**
     - **Motivation**: Some might require that the mapping from the abstract mechanism to the physical implementation is deterministic (i.e., the same mechanism can only be implemented in one way). This is a strong requirement and might not be necessary for anomaly detection.
     - **Concrete Case**: If a mechanism is defined so abstractly that multiple implementations are allowed, then DET is violated. But if we require that the mechanism must be implemented in a specific way (e.g., using a particular type of gate), then DET holds.

  7. **Invariance under Scale Transformation (Desideratum SCALE)**
     - **Motivation**: Should scaling the mechanism (e.g., in time or space) count as the same? For example, a circuit run at 1 GHz vs 2 GHz? Some might say yes (if causal structure is preserved), others might require exact timing.
     - **Concrete Case**: A system that runs twice as fast but otherwise has the same causal structure might be considered the same by some criteria and not by others.

  ### Trade-offs and Joint Unsatisfiability

  - **Trade-off between Specificity and Generalization**: 
    - **Problem**: Desideratum IS (intervention sensitivity) requires fine-grained specificity to internal parts and their interventions. However, Desideratum SI (substrate independence) and SCALE require generalization across substrates and scales. 
    - **Conflict**: The more we demand that the mechanism is defined at a fine-grained level (to capture intervention effects), the harder it is to abstract away from the physical implementation (substrate and scale). Conversely, if we abstract too much, we lose the ability to detect structural anomalies that are only visible under interventions.
    - **Example**: Consider a neural network and a symbolic system that both compute the same function with the same input-output behavior. If we require substrate independence (SI), we might say they are the same mechanism. But if we intervene by ablating a neuron, the neural network might fail in a way that the symbolic system doesn't (because it doesn't have neurons). Thus, IS would require that they are different. Hence, we cannot have both.

  ### Conceptual Assessment of Current Practices

  - **Mechanistic Interpretability (in ML)**: 
    - Often focuses on reverse-engineering neural networks to understand their internal structure. They tend to be very specific (Desideratum IS and COMP) but may not be substrate independent (so SI is not a goal). They are weak on RFE: if a network is functionally equivalent to a reference but has a different structure (e.g., due to redundancy or different training), they might flag it as an anomaly even if the causal dependencies are preserved (violating CDP). Also, they do not usually test with interventions across different substrates.

  - **Causal Modeling**: 
    - Uses intervention-based definitions (like IS) and structural causal models. They are strong on CDP and IS, and they reject bare functional equivalence (RFE). However, they often assume a fixed level of abstraction and may not handle substrate independence (SI) or scale invariance (SCALE). They are compositional (COMP). The main gap is in handling cross-substrate generalization.

  In summary, the non-negotiable desiderata (CDP, RFE, IS, COMP) form the core that prevents collapse. The negotiable ones (SI, DET, SCALE) reflect methodological choices. The trade-off between specificity (via IS) and generalization (via SI and SCALE) seems unavoidable: one must choose a level of abstraction. Current practices in mechanistic interpretability and causal modeling are strong on the non-negotiables but often neglect the negotiable ones, leading to systems that are either too implementation-specific or too abstract for cross-substrate anomaly detection.
answer: |-
  ### Desiderata for Mechanistic Identity in Anomaly Detection

  For mechanistic anomaly detection, a criterion of mechanistic identity must distinguish between systems that share deep structural commonality versus those that only exhibit surface functional similarity. The following desiderata specify necessary and sufficient conditions, categorized as non-negotiable (essential to avoid collapse) or negotiable (methodology-dependent). Concrete failure modes motivate each.

  ---

  #### **Non-Negotiable Desiderata**  
  *Failure to satisfy these collapses the criterion into either vacuous functional equivalence or overly restrictive physical identity.*

  1. **Causal Dependency Equivalence (CDE)**  
     - **Description**: The mechanism must preserve the *exact causal dependencies* between inputs, internal states, and outputs. This includes the counterfactual relationships (e.g., how outputs change under interventions on inputs or parts).  
     - **Failure Mode**: Without CDE, redundant wiring (e.g., duplicate transistors in parallel preserving logical behavior) would be falsely flagged as anomalous. This tolerates non-functional physical variations.  
     - **Collapse Risk**: Absence reduces to token-identity (overly restrictive); violation invites false positives for benign redundancy.

  2. **Rejection of Functional Equivalence (RFE)**  
     - **Description**: The criterion must reject systems with identical input-output profiles but divergent internal causal structures.  
     - **Failure Mode**: Accepting lookup-table-based XOR emulation (fixed memory mapping) as identical to a dynamic XOR circuit with real-time gate computations.  
     - **Collapse Risk**: Absence reduces to functionalism (overly permissive); violation misses structural anomalies (e.g., trojans in hardware).

  3. **Intervention Sensitivity (INS)**  
     - **Description**: Identity requires that *all possible interventions* on components yield identical downstream effects.  
     - **Failure Mode**: Two neural networks with identical outputs but different activation pathways: perturbing a hidden neuron in one alters outputs, but not in the other.  
     - **Collapse Risk**: Absence ignores causal fragility (e.g., silent failures in safety-critical systems).

  4. **Compositional Isomorphism (CI)**  
     - **Description**: The system must have isomorphic components (at a chosen granularity) and identical causal organization (e.g., connectivity, feedback loops).  
     - **Failure Mode**: A voting system with three redundant sensors (triple modular redundancy) vs. a single sensor—both may function identically, but their fault-tolerance mechanisms differ structurally.  
     - **Collapse Risk**: Absence conflates mechanisms with shared parts but distinct topologies (e.g., series vs. parallel circuits).

  ---

  #### **Negotiable Desiderata**  
  *Methodological commitments that define camps but are not universally required.*

  5. **Substrate Independence (SI)**  
     - **Description**: Identity persists across physical implementations if causal dependencies are preserved.  
     - **Motivating Case**: Hydraulic vs. electronic control systems with identical feedback dynamics.  
     - **Negotiability**: Rejected by biological realists who tie mechanisms to specific materiality (e.g., carbon-based neurons vs. silicon).

  6. **Deterministic Implementation Mapping (DIM)**  
     - **Description**: The mapping from abstract mechanism to physical implementation must be deterministic (no ambiguity).  
     - **Motivating Case**: Cryptographic hardware requiring exact gate-level replication to prevent side-channel attacks.  
     - **Negotiability**: Relaxed in stochastic systems (e.g., quantum annealing vs. classical optimization).

  7. **Scale Invariance (ScI)**  
     - **Description**: Identity holds under spatial/temporal scaling (e.g., nanoscale vs. macro circuits).  
     - **Motivating Case**: A slow biochemical reaction vs. a fast digital simulation with identical causal pathways.  
     - **Negotiability**: Rejected in real-time systems where latency is critical (e.g., autopilot controls).

  ---

  #### **Trade-offs and Joint Unsatisfiability**  
  - **Core Trade-off**: **INS vs. SI/ScI**.  
    - **Conflict**: Fine-grained intervention sensitivity (INS) demands microscopic specificity (e.g., exact component-level effects), while substrate/scale independence (SI/ScI) requires abstraction from physical details.  
    - **Unsatisfiable Pair**:   
      - *Example*: A biological neuron (stochastic, continuous) and a spiking neural network (deterministic, discrete) may have isomorphic dependencies (satisfying SI) but diverge under interventions (e.g., drug effects vs. software faults). INS forces distinct identities; SI demands equivalence.  
    - **Consequence**: High-fidelity anomaly detection requires prioritizing INS, sacrificing cross-substrate generalization. Compromise risks false negatives (e.g., missing silicon-specific backdoors in a brain-inspired AI).

  ---

  #### **Assessment of Current Practices**  
  - **Mechanistic Interpretability (ML)**:  
    - *Strengths*: High adherence to **CI** (neuron-level mapping) and **INS** (ablation studies).  
    - *Weaknesses*: Fails **RFE**—overly permissive to functional equivalents (e.g., different NN architectures with same outputs). Ignores **SI**/non-digital systems.  
    - *Gap*: Cannot detect anomalies in analog systems (e.g., neuromorphic hardware) due to lack of **ScI**.  

  - **Causal Modeling (SCMs, do-calculus)**:  
    - *Strengths*: Formally satisfies **CDE** and **INS** via interventional distributions.  
    - *Weaknesses*: Often violates **RFE** by accepting any model fitting observational data. **CI** is underspecified (e.g., ignores hierarchical organization).  
    - *Gap*: Abstract SCMs may miss physical anomalies (e.g., thermal runaway) due to weak **DIM**.  

  **Overall**: Current approaches excel at granular causal analysis but lack robust cross-domain abstraction. They prioritize intervention sensitivity (**INS**) over generalization (**SI/ScI**), limiting applicability to heterogeneous systems. Methodologies are conceptually adequate for digital systems but fail for bio-physical or multi-substrate contexts.
