answer: |-
  Here's a battle-tested mediation toolkit based on Grice, designed for speed and real-world messiness. Keep this flowchart in your notebook:

  **Grice's 10-Minute Mediation Cheat Sheet**

  1.  **Literal Said Content (The Facts):**
      *   "What words were *actually* used?" (Write them down exactly)
      *   "Is this statement **factually true** based on *only* these words?" (Ignore implications for now)
      *   *⚖️ Judgment Flag:* Does "factually true" require interpretation (e.g., defining vague terms)? Note it.

  2.  **Cooperative Principle (CP) Check:**
      *   "Was the speaker *trying* to be helpful/informative in this conversation?"
      *   **Yes (CP Active):** Go to Step 3 (Maxims). Most disputes land here.
      *   **No (CP Inactive - Sarcasm, Joke, Hostility):** Stop. Not about implicature, it's about intent/tone. ⚖️ *Big Judgment Call.*
      *   **Unsure:** Assume CP was active unless context screams otherwise.

  3.  **Maxim Flouting vs. Violating (Spotting the Gap):**
      *   For *each* Maxim (Quantity, Quality, Relation, Manner), ask:
          *   "Did the speaker **obviously break** this rule in a way the listener *could notice*?" (**Flouting** = Likely creating an implicature on purpose).
          *   "Did the speaker **secretly break** this rule?" (**Violating** = Likely lying/misleading).
          *   *⚖️ Real Talk:* This distinction is messy! Focus on **obviousness**. If the break was hidden, it leans towards violation/lying. If it was blatant ("It's warm here" while sweating), it leans towards flouting/implicature ("Open a window!").

  4.  **Unpack the Implicature (The 'Gotcha' Part):**
      *   "Given the flouted maxim(s), what did the listener *reasonably assume* was meant beyond the literal words?" (This is the implicature).
      *   *Example (Quantity Flout):* Saying "Some residents complained" implies *not all* complained, and possibly *not me*.

  5.  **Test the Implicature:**
      *   **Cancellability:** "Could the speaker have *added* something to cancel the implication without sounding nuts?" (e.g., "Some residents complained... including me" sounds fine -> implicature was cancellable). If adding the truth sounds contradictory/weird, the implicature was strong.
      *   **Generalized (GCI) vs. Particularized (PCI):**
          *   **GCI:** Does the implication hold *almost anywhere*? (e.g., "I ate some cookies" usually implies not all). Stronger, harder to cancel.
          *   **PCI:** Does the implication *depend entirely on this specific situation*? (e.g., Saying "It's cold" to imply "Shut the window" *only* if near an open window). Weaker, easier to cancel.
          *   *⚖️ Judgment Flag:* Distinguishing GCI/PCI can be fuzzy. Focus on context-dependence.
      *   **Non-Detachability:** "If I swap a synonym into the *original* statement, does the implication **vanish**?" (e.g., "A number of residents complained" likely still implies "not me"). If the implication sticks with synonyms, it's likely a *real* implicature tied to the meaning, not just the specific word. If swapping kills it, the implication was flimsy or word-specific.

  6.  **The Verdict (Mediator's Call):**
      *   **Literal False?** = Breach of promise/fact. Easy win.
      *   **CP Inactive?** = Not about truth, about conduct/context. ⚖️
      *   **Clear Violation (Hidden Break)?** = Likely misrepresentation/lying. ⚖️ (But hard to prove 100%).
      *   **Clear Flouting + Strong Implicature?** = Speaker intended the implication. Breach of *implied* promise/expectation. ⚖️
      *   **Weak Implicature / Cancellable?** = Listener might have over-interpreted. Miscommunication likely. ⚖️
      *   **Technically True but Feels Bad?** = Often involves **Manner Maxim Flout** (obscurity/vagueness) creating misleading PCI. "Weasel wording." Not a *lie*, but potentially **bad faith communication**. ⚖️⚖️⚖️

  **Running Your Cases (Fast & Dirty):**

  **1. Landlord: "The repair crew is aware of your unit." (Never called them)**
  *   **Literal:** "Aware"? Crew *could* be "aware" via a note, gossip, telepathy? Technically possible? ⚖️ (Stretching "aware" is weak). **Probably Literally False** if "aware" implies *official notification*.
  *   **CP Check:** Landlord should be cooperating (giving info). Assume CP Active.
  *   **Maxims:** **Quality Flout/Violation:** If false, it's a violation (lie). **Quantity?** Not enough info? **Relation?** Seems relevant. **Manner?** Vague ("aware").
  *   **Implicature:** "They know and are acting/prioritizing."
  *   **Tests:** **Cancellability:** "The crew is aware... but I never told them" = NONSENSE. Implicature strong. **Non-Detachability:** "The crew knows about your unit" = Same implication.
  *   **Verdict:** **Likely Lie/Violation.** Literal truth is very shaky, cancellation fails spectacularly. Strong implicature of action/notification intended. Breach.

  **2. Tenant: "Some residents have mentioned noise issues." (She filed the complaint)**
  *   **Literal:** "Some" = *at least one*. She is "a resident". **Technically True.**
  *   **CP Check:** Tenant is cooperating (raising an issue). CP Active.
  *   **Maxims:** **Quantity Flout:** She's giving *less* info than needed/expected (hiding her role). **Quality?** True. **Relation?** Relevant. **Manner?** Clear but incomplete.
  *   **Implicature:** "*Other* residents complained (not just me)." / "There's broader concern."
  *   **Tests:** **Cancellability:** "...including me" sounds fine -> Implicature was cancellable. **GCI/PCI:** "Some" implying "not all" is **GCI**. But implying "*others*" is **PCI** (context-dependent). **Non-Detachability:** "A few residents..." or "Several residents..." still imply "others" besides speaker.
  *   **Verdict:** **Misrepresentation via Quantity Flout.** She created a strong PCI that *others* complained to make the issue seem bigger/legitimate. Technically true, but misleading. Breach of implied expectation of honest representation. ⚖️

  **3. Landlord/Contractor: "I'll do my best to have this done by Friday." (Said Tuesday, nothing by Fri)**
  *   **Literal:** "Do my best" = Make effort. "Have this done" = Complete it. **No literal promise of completion.** Effort might have been made (even if minimal). **Technically True?** ⚖️ (Depends on proof of *some* effort).
  *   **CP Check:** Speaker is cooperating (setting expectation). CP Active.
  *   **Maxims:** **Manner Flout:** Vague and ambiguous ("do my best", "to have this done"). Avoids clear commitment. **Quantity?** Maybe less info than needed (how hard *is* best?). **Quality?** Assumes they *will* try. **Relation?** Relevant.
  *   **Implicature:** "It's *likely* to be done by Friday." / "Friday is the target."
  *   **Tests:** **Cancellability:** "...but no guarantees" or "...but it might not happen" sounds perfectly fine -> Implicature is **highly cancellable**. **GCI/PCI:** "Do my best" implying probable success is **PCI** (highly context-dependent - how complex is the task?).
  *   **Verdict:** **The Answer You Won't Like: Technically, probably no breach of a *said* promise.** It's classic **weasel wording** exploiting the **Manner Maxim**. The strong *feeling of betrayal* comes from a reasonable but **cancellable Particularized Conversational Implicature** ("It'll probably be done") that the speaker *allowed* you to make without correction. It's **bad faith communication** (avoiding clear commitment), but not a provable lie or promise breach based *only* on the words. ⚖️⚖️⚖️ *Your mediator role:* Focus on the *expectation* created vs. reality, not the "lie." Why did "best" fail? That's the real issue.

  **Key Mediator Realities:**

  1.  **⚖️ Flags are EVERYWHERE:** Linguistics gives tools, not Truth. Your value judgments *are* the mediation.
  2.  **"Flouting vs. Violating" is a Guideline:** Obviousness is key. Hidden breaks smell like lies.
  3.  **Focus on Expectation & Impact:** The words are a map. The dispute is about the territory they described vs. reality. "What did you reasonably understand?" vs. "What literally happened?"
  4.  **"Bad Faith" is Valid:** Someone can be technically truthful but still communicate dishonestly by manipulating implicature (Cases 2 & 3). Call that out.
  5.  **15-Minute Goal:** Use this to quickly map *where* the communication broke down (Literal? Flouting? Weak Implicature? Bad Faith?). Then focus the parties on fixing the underlying issue (the heat, the noise, the repair) based on that clarity.

  You got this. It's about untangling the words, not winning the argument. Good luck!
