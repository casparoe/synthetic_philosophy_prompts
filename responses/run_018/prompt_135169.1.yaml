  Procedure must fit phone-notepad use: emoji dividers, bullet shortcuts, and judgment flags (⚖️) marking where personal interpretation starts. For the landlord case, I'm already seeing that "aware" fails the cancellability test hard - if he texts "they're aware but I never contacted them," it's absurd. That's a smoking gun.

  For Case 3's uncomfortable truth: The maxim of manner (avoid obscurity!) is clearly violated by "do my best." It's designed to sound like a promise while meaning nothing. I'll call that "weasel wording" since casual terms stick better than "violation of the maxim of relation."

