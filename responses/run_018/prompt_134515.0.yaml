answer: |-
  **Decision Tree:**

  Root: How does the speaker treat American exceptionalism?  
  　├─ A. As a **historical claim** (about what makes the U.S. unique)  
  　│　　├─ A1. Uniqueness is **structural** (rooted in durable institutional design) → **Structural exceptionalism**  
  　│　　└─ A2. Uniqueness is **performative** (discourse generates the conditions it describes) → **Performative exceptionalism**  
  　├─ B. As a **normative claim** (about what the U.S. ought to do)  
  　│　　├─ B1. Duty is **exemplary** (nation should be imitated) → **Exemplary exceptionalism**  
  　│　　└─ B2. Duty is **missionary** (nation should actively spread its system) → **Missionary exceptionalism**  
  　└─ C. As an **ideological claim** (about the social function of the idea)  
  　　　　　├─ C1. Primarily **legitimizes democratic participation** → **Democratic-legitimation ideology**  
  　　　　　└─ C2. Primarily **legitimizes imperial expansion** → **Imperial-legitimation ideology**  

  ---

  **Leaf Descriptions:**  
  - **Structural exceptionalism**: Must explain why similar institutional designs elsewhere (e.g., federal republics) failed to replicate U.S. outcomes.  
  - **Performative exceptionalism**: Must acknowledge that exceptionalist rhetoric actively constructs U.S. politics, undermining claims of passive description.  
  - **Exemplary exceptionalism**: Must reconcile internal democratic failures (e.g., racial oppression) with the insistence that the U.S. remains a universal model.  
  - **Missionary exceptionalism**: Must defend coercive intervention abroad as consistent with democratic principles.  
  - **Democratic-legitimation ideology**: Must justify why a functioning democracy requires exceptionalist narratives to motivate participation.  
  - **Imperial-legitimation ideology**: Must square the promotion of "freedom" with the denial of self-determination to target societies.  

  ---

  **Flagged Separation Failures:**  
  - **Structural exceptionalism vs. institutional comparative-advantage**: The tree fails to separate claims of *unique* institutional causation (exceptionalist) from non-exceptionalist claims that U.S. institutions are merely *advantageous* but replicable.  

  ---

  **Unoccupied Combinations (with Diagnosis):**  
  1. **Performative historical + Exemplary normative**:  
     - *Diagnosis*: Unexplored. Logically coherent (e.g., "exceptionalist discourse obliges the U.S. to model virtue") but lacks empirical or theoretical advocacy.  
  2. **Performative historical + Missionary normative**:  
     - *Diagnosis*: Unexplored. Coherent (e.g., "exceptionalist rhetoric necessitates interventionism") but conflated with imperial legitimation or dismissed as incoherent.  
  3. **Structural historical + Democratic legitimation**:  
     - *Diagnosis*: Unattractive. Asserting that institutions *cause* uniqueness while *also* requiring exceptionalism to legitimize participation risks circularity (e.g., "institutions work because citizens believe they are unique").  
  4. **Exemplary normative + Imperial legitimation**:  
     - *Diagnosis*: Incoherent. Passive modeling (exemplary) contradicts active imposition (imperial), creating a tension between means (non-interference vs. intervention).
