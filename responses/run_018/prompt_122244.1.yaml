prompt: |-
  I've got to run a session for my history-of-science reading group — grad students, zero econ background — on path dependence: is history actually "locked in," or would the same outcomes have arrived anyway? Don't explain the idea to me; plan how I'd teach it. What's the dependency order — what concept has to land before "locked in" even makes sense to them? Pick one carrying example besides QWERTY, since everyone's tired of that — I'm thinking the 1884 Greenwich meridian vote, but frame it specifically to highlight arbitrary institutional lock-in rather than technical superiority — and say exactly what that example needs to show and what it must avoid conflating with determinism. Then map the miscoceptions in the sequnce they'll form: determinism first, then "anything could have happened," then the idea that merit always wins eventually. Where in the arc do I head off each? Also tell me what I should openly refuse to explain at this level and just say so. Finish with one check question that proves they've actually grasped path dependence rather than just repeating the example back. Write it in American English, keep it tight, and don't include any reading lists or bibliographies.
reasoning: |-
  Okay, let me tackle this history-of-science teaching request. The user needs a session plan on path dependence for econ-ignorant grad students, avoiding QWERTY exhaustion. Hmm... they specifically want three things: conceptual dependency order, a fresh case study framed to show institutional lock-in, and misconception sequencing. 

  First, the concept ladder. Can't jump to "locked in" without foundations. Gotta start with contingency - that moment when outcomes genuinely hang in the balance. Then introduce bifurcation points (their Greenwich vote example is perfect for this). Only then does "lock-in" mean anything beyond fatalism. 

  For the case study, Greenwich 1884 is brilliant but dangerous. Must surgically separate the technical arguments (which were weak) from the institutional snowballing. The key is showing how minor advantages - Britain's naval charts, colonial ports - became amplified through coordination effects. Should emphasize how France kept perfect astronomical time but still lost. 

  Misconceptions... ah yes, they'll come in waves. Determinism first (head off by stressing contingency), then chaotic randomness (counter with increasing-returns mechanisms), finally meritocratic inevitability (crush with VHS/Betamax). 

  What to exclude? Definitely no econometrics. Also skipping network effects vs learning curves - that's grad econ territory. The check question needs to trap them: "If we reran the 1884 conference with France having more colonies, would ISO still pick Greenwich?" Wrong answers would reveal lingering determinism. 

  User's clearly time-pressed - structure must be tight. American English, no fluff. Their irritation at QWERTY clichés suggests they'll appreciate the Greenwich freshness. Bet they've seen students confuse path dependence with "everything's accidental" before. 

  ...wait. Should I preempt the "but digital made keyboards irrelevant" objection? No - that's actually perfect for showing lock-in's persistence despite later technical shifts. Save that for the check question follow-up.
answer: |-
  Here's the tight, actionable teaching plan you requested:

  **Core Concept Dependency Order:**
  1. **Contingency** (History contains genuine choice points)
  2. **Bifurcation Points** (Specific moments where small differences *could* lead to divergent outcomes)
  3. **Increasing Returns / Self-Reinforcement** (Mechanisms making reversal harder over time - *then* introduce "lock-in")
  4. **Lock-In** (Outcome stabilized not by inherent superiority, but accrued advantages)

  **Carrying Example: The Greenwich Meridian (1884) - Framed for Institutional Lock-In**
  *   **What it MUST Show:**
      *   **Initial Arbitrariness:** Multiple viable meridians existed (Paris, Greenwich, others). No *scientific/technical* reason made Greenwich objectively superior at the decision point.
      *   **Minor Initial Advantage:** Britain's dominant navy/commerce meant *more existing charts used Greenwich*. A coordination advantage, not a proof of superiority.
      *   **Self-Reinforcing Mechanisms:** Adoption by key players (US railroads, maritime nations) created *network effects*. Switching costs grew astronomically (re-charting, re-tooling navigation, rewriting treaties). International conferences/institutions codified it.
      *   **Locked-In Outcome:** Paris had arguably better astronomical facilities. *But* the institutional & coordination weight behind Greenwich became insurmountable. It persists today (ISO standards, GPS) despite the original rationale fading.
  *   **What it MUST Avoid Conflating with Determinism:** Emphasize *contingency* - Had France wielded more political/commercial clout in 1884, or the US railroads standardized differently *earlier*, Paris could have "won." The outcome wasn't preordained by logic or physics.

  **Misconception Sequence & Where to Head Them Off:**
  1.  **"It was always going to happen that way" (Determinism/Hindsight Bias)**
      *   *Head Off:* **Before introducing lock-in.** After establishing contingency & bifurcation points with Greenwich *before* the vote. Ask: "What arguments *could* France have made? What if the US delegation was pro-Paris?" Stress the *uncertainty* actors felt.
  2.  **"So anything could have happened, it's all random!" (Chaos/Relativism)**
      *   *Head Off:* **When explaining self-reinforcement mechanisms.** Contrast Greenwich with truly random events. Show the *structured feedback loops* (network effects, switching costs) that *systematically* amplify an initial choice, making some outcomes vastly more probable than others over time. It's *not* dice-rolling.
  3.  **"The best tech/idea always wins eventually" (Meritocratic Teleology)**
      *   *Head Off:* **After demonstrating lock-in with Greenwich.** Explicitly state: "Notice how Paris had *better* astronomical capabilities *even then*? Why didn't that 'merit' win out later?" Hammer home: Lock-in means *inferior or equal* standards persist *because* of the accumulated weight of past choices and coordination, not inherent superiority. VHS vs. Betamax is a useful quick secondary nod here.

  **What to Openly Refuse to Explain:**
  *   **Formal Economic Modeling:** "We won't dive into the complex math of increasing returns functions or network effect equations. Focus on the *historical mechanisms* at play."
  *   **Counterfactual Quantification:** "We can't *calculate* the exact probability Greenwich would win in 1884. Path dependence highlights the *possibility* and *mechanisms* of contingency locking in, not precise odds."
  *   **Universal Applicability:** "We're not arguing *every* historical outcome is path dependent. Many follow clear technological or logical imperatives (e.g., jet engines replacing propellers). Path dependence applies to situations with *coordination/standardization* under conditions of *initial ambiguity*."

  **The Check Question (Proves Grasp Beyond Example):**
  > **"Imagine a 19th-century country, Ruritania, developed a slightly *more efficient* steam engine design than Watt's, but it required entirely different tools and skills to build/maintain. Watt's design got adopted first by a few key mines. Using the logic of path dependence, explain why Ruritania's 'superior' engine likely *failed* to become the global standard, even if it was technically better."**

  *   **Why it works:** It forces application of the core concepts (initial contingency, minor early advantage, self-reinforcement via skills/tools/infrastructure, lock-in via switching costs) to a *novel* scenario. A correct answer must move beyond recounting Greenwich and articulate *why* inherent "merit" alone is insufficient to overcome locked-in coordination. A wrong answer would likely default to "the best one won" or pure randomness.
