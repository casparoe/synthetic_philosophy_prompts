answer: |-
  ### Essay Question
  **In *The Querist*, Berkeley insists that money functions as "tokens" devoid of intrinsic value, serving only as signs representing labour and goods. Yet, he simultaneously argues that a state-issued paper currency, backed by national land and labour (not metal), possesses unique causal power to stimulate industry and prosperity unattainable by metallic coin. Explain how Berkeley reconciles the ontological insubstantiality of money (its status as a mere sign) with its robust causal efficacy in economic life. Contrast his position with a commodity-theory of money (e.g., one holding that currency’s value must derive from the labour embodied in its material substrate). Crucially, demonstrate why Berkeley’s framework is *not* equivalent to a modern fiat-currency theory, identifying where collective belief and social convention perform the sustaining role that intrinsic material worth plays for the commodity theorist. (45 minutes)**

  ---

  ### Model Answer (Approx. 600 words)

  Berkeley resolves the apparent tension between money’s ontological insubstantiality and its causal efficacy through three interlinked conceptual moves, fundamentally distinguishing his view from both commodity theory and modern fiat theory.

  First, Berkeley rigorously applies a **sign/thing-signified distinction specifically to currency**. Coins and paper notes are mere "tokens" or "counters," ontologically empty of inherent value. Their sole function is to signify, measure, and facilitate the exchange of the *real* wealth they represent: namely, the productive capacity of a nation embodied in its land and, crucially, the **labour** of its people. As signs, their value is purely relational and instrumental; they possess no intrinsic worth like the gold in a coin. This separation allows Berkeley to affirm money’s causal power without contradicting its ontological status: the power resides not *in* the token itself, but in the system of circulation and motivation it enables when functioning correctly. Tokens are inert; their efficacy is derived from what they signify and how they are deployed within a socio-economic system.

  Second, Berkeley argues that the **causal efficacy** of these tokens—their ability to stimulate industry and prosperity—depends entirely on **credit and collective trust**, understood not as mere psychological embellishments but as the indispensable *sustaining causal conditions* of the sign’s functionality. For the token to circulate, motivate labour, and direct economic activity, it must be universally accepted within the community based on reliable confidence in its future redeemability or its ability to command real goods and labour. This collective belief is a *social institution*, a publicly established convention enforced and regulated by the state. It is this network of trust—anchored in the perceived stability and credibility of the issuing authority and the underlying reality it signifies—that imbues the intrinsically worthless paper with causal power. The sign works *because* and *only if* the community collectively accepts and acts upon its role within the system.

  Third, Berkeley grounds the *value* represented by the sign not in metal, but in the **national stock of land and labour**. This is his critical departure from commodity theory. The commodity theorist (e.g., Locke or proponents of labour-embodied metallic value) insists that currency’s value must be anchored in the intrinsic worth of its material substrate (e.g., gold containing labour-value). Berkeley rejects this material fetishism: the true "substrate" of value is not metal, but the *productive labour* and *resources* of the nation itself. Paper currency, backed by and representing this real stock, can function perfectly well *without* intrinsic material worth precisely because its value-signification points directly to this concrete foundation. Collective trust is placed in the system’s ability to connect the token to this underlying productive reality, not in the token’s matter. The commodity theorist relies on intrinsic material worth to sustain value; Berkeley relies on the *collective convention* of trust in the sign’s *connection* to the land/labor substrate.

  This framework diverges fundamentally from modern fiat theory. While both deny intrinsic value, modern fiat money’s value rests *primarily* on state authority (legal tender laws) and a potentially self-referential network of belief, often without a concrete, non-monetary backing like land/labor. Berkeley’s paper currency is *not* pure fiat: its value is explicitly *derived from* and *representative of* a specific, tangible national stock (land/labour). The collective convention is *about* the token’s reliable relation to that real foundation, not merely about accepting state power or abstract confidence in the system itself. The convention sustains the *link* between sign and specific signified value-substrate (labour/land), whereas for the commodity theorist, the intrinsic material worth *is* the value-substrate.

  ---

  ### Marking Scheme (Total: 20 Marks)

  **A Grade (17-20):** Demonstrates exceptional conceptual precision. Must include all three core moves:  
  1.  **(4 marks)** Clear explanation of the strict *sign (token)/thing-signified (land/labour)* distinction applied specifically to currency, establishing ontological insubstantiality.  
  2.  **(4 marks)** Explicit identification of *credit/collective trust* as the essential *sustaining causal condition* (not mere psychology) enabling the sign’s efficacy, replacing intrinsic value’s role.  
  3.  **(4 marks)** Clear articulation that *labour (and land)*, not metal, is the true *value-substrate* for Berkeley, allowing paper to function without intrinsic worth.  
      Additionally:  
  4.  **(4 marks)** Effective contrast with commodity theory (e.g., labour-embodied metal value), showing how convention replaces intrinsic material worth. Clear differentiation from modern fiat theory, emphasizing Berkeley’s reliance on concrete backing (land/labour) versus state authority/abstract confidence.  
  5.  **(4 marks)** Coherent overall structure, logical flow, and precise terminology. *Avoids both collapses (see below).*

  **B Grade (13-16):** Good understanding but lacks full precision in one key area. May:  
  *   Explain sign/thing distinction but less sharply applied to currency ontology.  
  *   Discuss trust/convention but frame it more psychologically than as the *sustaining causal condition*.  
  *   Identify labour as the value-substrate but not fully articulate how this *permits* the non-intrinsic paper.  
  *   Contrast commodity theory adequately but offer a weaker or partially conflated differentiation from fiat (e.g., implying Berkeley’s state role makes it equivalent to fiat).  
  *   Minor logical gaps or slightly less precise terminology.

  **C Grade (9-12):** Basic comprehension but significant omissions or errors. May:  
  *   Summarize Berkeley’s "money as sign" without resolving the tension.  
  *   Misrepresent the role of convention/trust (e.g., as subjective preference).  
  *   Fail to clearly contrast with commodity theory or conflate Berkeley with fiat.  
  *   Omit the specific grounding in land/labour as value-substrate.  
  *   Noticeable conceptual confusion.

  **D Grade (5-8):** Superficial treatment, major omissions, or significant misconceptions.  
  **F Grade (0-4):** Fundamentally incorrect, irrelevant, or minimal attempt.

  **Specific Penalties (Deduct from total):**  
  *   **-3 marks:** Collapsing Berkeley’s view into modern fiat-currency theory (e.g., stating his paper money relies solely on state decree or abstract confidence without emphasizing its *representative* function tied to land/labour).  
  *   **-3 marks:** Conflating Berkeley’s social-convention account with a subjective-value theory (e.g., suggesting value is determined by individual desire/opinion rather than a public convention based on the sign's relation to real productive capacity).  
  *   **-2 marks:** Including the misconception that Berkeley’s immaterialism about money entails a denial of real economic exchange (e.g., "Berkeley thinks trade is illusory because money has no substance"). (*This misconception fundamentally misreads his instrumentalism*).  
  *   **-1 to -2 marks:** Significant vagueness, poor structure, or irrelevant material.
