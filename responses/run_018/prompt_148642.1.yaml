answer: |-
  ### (a) Exam Question  
  **Question (20 marks):**  
  Consider the proposition expressed by "A gives B to C". This involves a three-place relation *Gives(x,y,z)*, where *x* is the agent (A), *y* the object given (B), and *z* the recipient (C). The roles are asymmetric: A acts, C receives, and B is transferred.  

  Explain step-by-step how Bradley’s regress arises when trying to unify these elements into a single proposition. Then, reconstruct Russell’s solution using external relations to halt this regress. Finally, evaluate whether Russell’s account *genuinely secures unity* by addressing the following: Does specifying the *directionality* of each role (e.g., that A is agent *rather than* recipient) require further relations to bind the relation to its terms in ordered fashion? If so, does this reintroduce a version of Bradley’s regress?  

  Use only Bradley’s and Russell’s core concepts (e.g., internal/external relations, unreality of relations, propositional unity). Do not cite secondary literature.  

  ---

  ### (b) Model Answer (600 words)  

  Bradley’s regress challenges how distinct elements (A, B, C, and the relation *Gives*) combine into a unified proposition. For "A gives B to C" to be meaningful, the relation *Gives* must bind A (as agent), B (as object), and C (as recipient) in specific roles. Bradley argues that this binding requires a further relation (R1) connecting *Gives* to the trio (A,B,C). But R1 itself must be related to *Gives* and the terms, demanding R2, and so on *ad infinitum*. This infinite regress implies that unity is never achieved, rendering propositions unintelligible.  

  Russell halts this regress by declaring relations *external*. For him, *Gives* is a primitive, non-relational entity that directly connects A, B, and C without needing further relations. The proposition’s unity is secured because *Gives* itself, as an external relation, provides the "glue" holding the terms together in a fact. Applied to our case: *Gives(A,B,C)* is a single complex where the relation’s externality avoids Bradley’s demand for additional binders.  

  However, Russell’s solution faces a deeper problem: **directionality**. In *Gives(A,B,C)*, A *must* be agent, B the object, C the recipient—not vice versa. This ordering is essential; swapping roles ("C gives A to B") alters the proposition. To fix directionality, Russell must specify *how* *Gives* relates to each term *asymmetrically*. He might posit that *Gives* itself has an inherent logical structure: it maps positions (agent: slot 1, object: slot 2, recipient: slot 3). But this invites Bradley’s regress anew.  

  Consider how *Gives* binds to A *as agent*. If *Gives* inherently "points" to A’s role, we face two options:  
  1. **Directionality is intrinsic to *Gives***: Then *Gives* must be internally complex (containing "agent-direction," "object-direction," etc.), requiring relations to unify *these* components with the terms—rekindling the regress at the sub-relation level.  
  2. **Directionality requires further relations**: Specifying "A is agent" demands a new relation *D1* linking *Gives* to A in the agent-role. But *D1* must itself be directionally bound to *Gives* and A (e.g., *D1* must apply *to* A *as* agent), necessitating *D2*, and so on.  

  Bradley’s challenge thus relocates: even if external relations unify terms generically, *ordering their roles* reintroduces the need for relational binding. Russell’s externality only defers the problem; it cannot explain how a relation’s "slots" acquire direction without either infinite complexity (violating unity) or implicit appeal to further relations (violating externality). Consequently, Russell’s solution fails to secure genuine unity. The proposition remains a heap of elements—A, B, C, *Gives*, plus unexplained role-ascriptions—rather than an irreducible whole.  

  Bradley’s deeper insight endures: relations cannot be fully "external" because their application to terms in determinate roles presupposes an unreduced relational context. Unity requires a non-relational ground Russell cannot provide.  

  ---

  ### (c) Marking Scheme (20 marks total)  
  **A Answer (17–20 marks):** Achieves all moves below with precision, identifies relocated regress in directionality, and conclusively evaluates Russell’s failure.  
  **B Answer (13–16 marks):** Completes moves 1–4 but only partially addresses move 5 (e.g., notes directionality but misses its regressive implications).  

  | **Analytical Move** | **Marks** | **Key Requirement** | **Common Mistake (costs points)** |  
  |---------------------|-----------|---------------------|-----------------------------------|  
  | **1. Identifies roles** | 2 | Explicitly names *asymmetric* roles in *Gives* (agent, object, recipient). | Treating roles as symmetric or ignoring asymmetry (–1). |  
  | **2. Bradley’s regress** | 5 | Step-by-step application: Shows how binding *Gives* to (A,B,C) requires R1, then R2, etc. | Vague summary without iterative logic (–2). |  
  | **3. Russell’s solution** | 4 | Explains externality halts regress by making *Gives* a primitive unifier. | Misrepresenting externality as "no relation needed" (–2). |  
  | **4. Directionality challenge** | 5 | Argues that fixing roles (e.g., A *as* agent) demands further binding. | Ignores ordered roles or conflates them with terms (–3). |  
  | **5. Evaluation of unity** | 4 | Judges if relocated regress undermines Russell: Either (a) intrinsic directionality breeds complexity or (b) extrinsic directionality restarts regress. | Asserts Russell succeeds without engaging directionality (–3). |  

  \answer{20}
