prompt: |-
  hey — i'm a journalist who covers science and ideas, and lately i've been drowning in pitches that do this one move: they take a probability that's basically zero, multiply it by a payoff that's basically infinity, and then claim we have to reorder society. you know the type — "there's a 0.002% chance this saves 10^40 lives, so why are we funding schools?" i need a reusable decision procedre — like a checklist i can run in 15 minutes — to figure out whether that argument is actually carrying weight or whether it's just expeced-value fanaticism wearing a suit.

  you're acting as a professional philosopher and a decision-theory consultant. please think carefully, do a quick brainstorm first on the distinctions that actually matter here (not just "probability times utility" — i know that), then turn the core idea into something practical.

  the deliverable: a step-by-step flow in words, with questions in order, what counts as passing each one, and clear stop points. one stop should say "broken — don't publish this framing"; another should say "this isn't a math error, it's a values call, hand it to a human"; and there should be spots where the procedre just stops because there's no right answer without judgment. apply it to three proposals: (1) spending 40 billion on an asteroid-deflection system with a 1-in-90,000 hit chance in the next century; (2) an op-ed arguing we should redirect human-health budgets toward farmed-animal welfare because the expeced number of future suffering animals dwarfs current human populations; and (3) a case where the checklist gives you an answer you probably won't like — maybe it actually validates an extreme priority shift. be honest about where the checklist misfires, which steps are judgment calls in disguise, and what it flat-out can't settle.

  write it casual, like you're explaining over coffee to a colleague who doesn't have time for a textbook. don't include bibliographies, reading lists, or "see Author Year" citations — i can't verify them in the field, and neither can a small model running offline. if you need to reference a specific claim, paraphrase without quotation marks; don't quote from memory. also, include at least one worked example where the procedure tells the asker "this is broken" and one where it tells them "this is valid but i still hate it."

  there's probably a typo or two in my message above — don't correct them, just answer.
reasoning: |-
  Okay, the user is a science journalist drowning in pitches that use extreme probabilities and payoffs to argue for societal changes. They need a practical, reusable checklist to evaluate these arguments quickly. Let me unpack their request.

  First, the core issue isn't just about calculating expected value (probability × utility), but about identifying when such calculations are misapplied. The user mentioned examples like redirecting funds from schools based on tiny chances of massive payoffs. They want a step-by-step flow with clear stop points: "broken," "values call," and moments where judgment is unavoidable.

  Key distinctions to consider: 
  - **Epistemic uncertainty**: How reliable are the probability estimates? If they're pulled from thin air, that's a red flag. 
  - **Value quantification**: Can the payoff (like "10^40 lives") be meaningfully measured or compared? Infinite utilities break decision theory. 
  - **Marginal utility**: Would spending here actually move the needle, or is it negligible? 
  - **Comparisons**: Are alternatives being ignored? Even if the EV is high, another option might be higher. 
  - **Fanaticism**: Does the argument ignore tail risks or non-linear impacts? 

  The checklist needs to be field-friendly—no academic citations, just practical questions. User also wants three worked examples: asteroid defense, animal welfare op-ed, and a controversial valid case. Must show where the tool misfires or requires judgment.

  For the asteroid example: Probability is low but NASA-backed, so maybe credible. But $40B could save many lives via healthcare—comparison matters. Might pass math but become a values call. 

  Animal welfare case: Suffering calculation assumes extreme future animal populations. Is that plausible? Also, comparing animal vs. human suffering is ethically fraught—probably a "values call" stop. 

  The "valid but hate it" example: Say a pitch argues for prioritizing AI extinction risk over current cancer funding because of tiny chance/huge payoff. If probabilities are credible (e.g., expert consensus) and alternatives weighed, checklist might validate it—even if journalist dislikes the implication. 

  Biggest pitfalls: 
  - Step 2 (probability sanity check) and Step 5 (value comparisons) are judgment-heavy. 
  - The tool can't resolve moral disagreements (e.g., "Is one human life worth 1M chicken lives?"). 
  - It might misfire if experts wildly disagree on probabilities. 

  Final flow should feel like a coffee chat: concise, no jargon. Emphasize that "stop points" aren't failures—they prevent bad framing. And be transparent about where the checklist is rigid vs. where it bows to human nuance.
answer: |-
  Here's your decision procedure – think of it as a "BS Filter for Infinity Gambits." It runs in 5 steps, takes 15 minutes, and forces the argument to show its work. The core insight: **High-stakes low-probability arguments often fail by being *untethered* – either from measurable reality or defensible values.**

  ### The Flow: "The Tether Check"
  **(Run these in order. Stop if any step fails.)**

  1.  **Probability Anchor:** *"Where does this tiny probability come from, and how hard is it?"*
      *   **Ask:** Is this based on a credible model, historical data, or expert consensus? Or is it a wild guess, an upper bound, or pulled from a purely theoretical scenario?
      *   **Pass:** Clear citation to established science, robust modeling (even if uncertain), or verifiable data. (e.g., NASA impact probabilities, actuarial tables).
      *   **Fail:** "It could happen," "some theorists suggest," "if we assume X then Y," "conservative estimate" with no basis. Pure thought experiment probabilities.
      *   **Stop Point:** **BROKEN - DON'T PUBLISH THIS FRAMING** (If the probability is fundamentally untethered, the whole EV calculation is fiction).

  2.  **Payoff Plausibility:** *"Is this infinite payoff actually countable, bounded, or just a rhetorical infinity?"*
      *   **Ask:** Is the claimed payoff (lives saved, suffering averted) something we can *conceivably measure, influence, or compare*? Does it rely on truly infinite scales (e.g., all future civilizations across galaxies) or is it just a very large finite number? Can we *actually* achieve/detect this payoff?
      *   **Pass:** Finite, measurable outcomes (e.g., lives saved *this century*, tons of CO2 reduced, reduction in *measurable* suffering units within a defined scope). Payoffs tied to achievable interventions.
      *   **Fail:** Genuine infinities (e.g., "all possible future beings"), payoffs contingent on entirely speculative future technologies/events we can't influence now, outcomes we couldn't verify.
      *   **Stop Point:** **VALUES CALL - HAND IT TO A HUMAN** (Math breaks with infinities; prioritizing them becomes purely philosophical/ethical).

  3.  **Marginal Reality Check:** *"Does *this specific action* actually move the needle on the probability or payoff?"*
      *   **Ask:** Would spending *this* money/effort *here* significantly change the tiny probability or secure the massive payoff? Or is it a drop in the bucket? Could it even *increase* risk?
      *   **Pass:** Direct, plausible causal link shown. The investment demonstrably buys a measurable reduction in risk or increase in payoff likelihood/capture (e.g., $40B *buys* a specific asteroid detection/deflection capability).
      *   **Fail:** No clear mechanism, action is symbolic ("raising awareness"), payoff capture is speculative, action might divert resources from *more* effective alternatives for the *same* goal, or could create *new* risks.
      *   **Stop Point:** **BROKEN - DON'T PUBLISH THIS FRAMING** (The action is decoupled from the claimed EV).

  4.  **Opportunity Cost Clash:** *"What demonstrably good thing are we *not* doing if we do this? Compare the EVs."*
      *   **Ask:** Quantify (roughly!) the EV of a clear alternative use for the *same* resources (e.g., $40B spent on malaria nets vs. asteroid deflection). Don't let them compare "this EV" only to zero – compare it to the *next best option*.
      *   **Pass:** Proponent acknowledges alternatives and provides a *reasoned* (even if contestable) argument why *this* EV dominates *specific*, plausible alternatives. Includes consideration of near-term vs. long-term certainty.
      *   **Fail:** Ignores alternatives, handwaves them away ("but this is existential!"), or compares only to doing nothing. Fails to engage with tangible near-term costs of diverting resources.
      *   **Stop Point:** **VALUES CALL - HAND IT TO A HUMAN** (Requires weighing different types of goods/risks – math alone rarely settles this).

  5.  **Fanaticism Filter:** *"Does this argument force insane conclusions if applied consistently to similar tiny-probability/huge-payoff scenarios?"*
      *   **Ask:** If we accept *this* logic, what else must we prioritize? E.g., must we also spend billions on shielding Earth from vacuum decay (probability ~0, payoff infinite)? On preventing every conceivable black swan? Does it lead to neglecting *all* near-term, high-certainty goods?
      *   **Pass:** Proponent can articulate defensible boundaries (temporal, spatial, probability thresholds) or show why *this specific* risk/payoff is uniquely tractable or morally distinct. Argument doesn't collapse into requiring infinite resources for every infinitesimal risk.
      *   **Fail:** Argument logically demands prioritizing countless other similarly structured (but even more absurd) risks, leading to paralysis or neglect of obvious current needs. No defensible limit.
      *   **Stop Point:** **BROKEN - DON'T PUBLISH THIS FRAMING** (The logic is self-defeating or leads to moral absurdity).

  ---

  ### Applying the Filter

  **1. $40B Asteroid Deflection (1-in-90,000 chance in next century):**
  *   **1. Probability Anchor:** PASS (NASA/JPL models, based on cataloged objects & impact records).
  *   **2. Payoff Plausibility:** PASS (Preventing extinction is finite & measurable - human lives this century/next).
  *   **3. Marginal Reality Check:** PASS (Yes, $40B likely *does* buy significant deflection capability for known threats).
  *   **4. Opportunity Cost Clash:** **VALUES CALL** (EV of $40B on asteroids = (1/90,000) * 8 Billion lives ≈ ~89,000 lives saved EV. EV of $40B on global health (e.g., malaria) could easily save 100,000s *for sure*. Is preventing a tiny chance of total loss worth more than saving many thousands *now*? Requires ethical weighing of catastrophe aversion vs. certain good. Math doesn't settle it.)
  *   **5. Fanaticism Filter:** PASS (Boundary: Earth-specific, near-term (century), tractable with current tech. Doesn't force us to worry about gamma-ray bursts from Andromeda).

  **Verdict:** Passes math, but hits **VALUES CALL** at Step 4. Worthy of discussion, but frame it as the *values trade-off* it is, not a pure EV slam-dunk.

  **2. Op-Ed: Redirect Human Health $$ to Farmed Animal Welfare (Future suffering animals >> humans):**
  *   **1. Probability Anchor:** **BROKEN** (Probability of *achieving* the vast reduction in future animal suffering assumed? Probability that future civilization will have trillions of suffering animals? Highly speculative, based on linear extrapolations or utopian/dystopian assumptions, not anchored models.)
  *   **2. Payoff Plausibility:** **VALUES CALL** (Quantifying "suffering units" across species is intensely controversial. Is preventing future chicken suffering *directly comparable* to curing human disease *now*? Even if finite, the value comparison is deeply ethical.).
  *   **3. Marginal Reality Check:** QUESTIONABLE (Does redirecting $X *now* reliably prevent $Y animal suffering centuries from now? Future tech (lab meat?), cultural shifts, make the causal chain very fuzzy. Might not move the needle as claimed.)
  *   **4. Opportunity Cost Clash:** (Stops at Step 2/3 anyway) But likely **VALUES CALL** (Comparing human health EV to highly speculative animal suffering EV).
  *   **5. Fanaticism Filter:** (Stops earlier) But likely **BROKEN** (If future animal lives count so much, why not also prioritize preventing suffering in all *wild* animals? Or potential AI suffering? Leads to boundless obligations.)

  **Verdict:** Fails at **Step 1 (BROKEN - DON'T PUBLISH THIS FRAMING)**. The core probabilities are untethered speculation. Step 2 is also a major **VALUES CALL** landmine. This is classic fanaticism wearing a suit.

  **3. The "Valid But You'll Hate It" Example: Prioritizing AI Safety Over Climate Change Mitigation**
  *   **Pitch:** "Even a 0.1% chance per decade of unaligned AI causing human extinction (payoff: all future lives) dwarfs the EV of mitigating even severe climate change (payoff: 100s of millions of lives/disrupted this century). All resources to AI safety NOW!"
  *   **1. Probability Anchor:** **VALUES CALL** (Expert consensus? Top AI researchers give wildly different estimates (0.1% - 50%). Models are nascent. It's informed speculation, not anchored data. *Some* credible experts believe it's significant. You might judge this barely passes or is a Values Call.)
  *   **2. Payoff Plausibility:** PASS (Human extinction is finite, measurable loss).
  *   **3. Marginal Reality Check:** QUESTIONABLE/**VALUES CALL** (Does *massive, immediate* funding *now* actually significantly reduce that 0.1%? Or does it require decades of basic research where funding has diminishing returns? Is there a clear mechanism? Highly debatable – might pass marginally or fail.).
  *   **4. Opportunity Cost Clash:** **VALUES CALL** (Compare EV: (0.001 * Vast Future Lives) vs. (Near-Certain * 100s of Millions + reduced future suffering). Requires comparing near-certain large-scale suffering to tiny chance of total loss. Also requires valuing future generations *extremely* highly. Math highlights the tension, doesn't resolve it.).
  *   **5. Fanaticism Filter:** PASS/BORDERLINE (Focuses on a specific, potentially tractable existential risk. Doesn't *force* vacuum decay prep, but the logic could be extended. Requires drawing a line at "human-level intelligence risks".)

  **Verdict:** Likely hits **VALUES CALL** at Step 1 (probability), Step 3 (marginal impact), and strongly at **Step 4 (Opportunity Cost)**. The *math* might show the EV is larger if you accept the high probability estimate and extreme future valuation, but the procedure flags that these are *judgments*, not calculations. It forces the debate onto the shaky probability and the ethical weight of the future vs. the present. **The checklist validates the *structure* as potentially coherent (not broken math) if you grant the premises, but screams that the premises (probability, value comparison) are where the real fight is.** You might hate the conclusion, but the filter says it's a values/philosophy fight, not a math error.

  ---

  ### Where the Wrench Might Slip Off
  *   **Judgment in Disguise:** Step 1 (Probability Anchor) and Step 3 (Marginal Reality) are HUGE judgment calls. What counts as "credible"? "Plausible mechanism"? Experts disagree. The filter forces you to *make* that call explicitly.
  *   **Misfires:** It could flag a genuinely important, well-founded long-term issue as a "Values Call" (like the asteroid example) because near-term alternatives look better on paper. It might also pass a fanatical argument if the probabilities *are* weirdly well-anchored in niche, credible-but-extreme models.
  *   **Can't Settle:** The core **VALUES CALL** stops. It can't tell you if preventing a 0.001% extinction risk *is* worth more than saving 500,000 kids from malaria *now*. That's philosophy/politics. It can't resolve how to value different types of beings (human vs. animal vs. digital) or different types of suffering. It just forces those disagreements into the open instead of hiding them behind big numbers.
  *   **The "Hate It" Valid Case:** The AI example shows this. The filter exposes that the argument hinges on debatable probabilities and extreme ethical stances (longtermism), but it doesn't *invalidate* those stances. It just says, "This isn't a calculator answer; it's a worldview choice."

  **Grab your coffee and go filter some pitches.** Remember: This tool doesn't give answers, it forces the *pitcher* to show theirs. The goal is to kill the worst offenders and expose the value judgments hiding in the fancy math of the rest. Good luck!
