  2. **Hidden Individual Modifiers**: Some participants are secretly assigned as "masks" (which suppress the manifestation of their role's capacity when conditions are right) or "finks" (which remove the underlying capacity when it is about to be exercised). The rest are "normal".
  3. **Task**: The group must complete a concrete cooperative task. We'll use a logical puzzle (e.g., arranging a set of cards with logical statements to form a valid argument) or a physical puzzle (e.g., building a tower with specific constraints) within a time limit.
