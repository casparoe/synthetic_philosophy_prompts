     - Building: At minute 6, the group must arrangement the cards for this stage. The Builders are expected to do the arrangement. If at least one Builder steps up and successfully arranges the cards (as per the group's decision), then Building manifests. If no Builder does it (or they try but fail because of the modifier) then it doesn't.

     - Recording: At the end of the round (minute 10), the Recorder must record the current state of the puzzle and the decisions. If the Recorder does so, then Recording manifests.

     - Timekeeping: The Timekeeper must give a time warning at minute 5 and minute 9. If they give both warnings, then Timekeeping manifests. If they miss one, then it doesn't.

     - Resource Management: At minute 1 and minute 7, the facilitator scatters the cards or removes some from the table. The Resource Managers are expected to gather and redistribute them. If at least one Resource Manager does so each time, then Resource Management manifests.

     After the round:
        - The facilitator reveals for each group capacity whether it manifested.
        - The facilitator scores the predictor's predictions.

     Phase 3: Debrief (30 minutes)

     - The facilitator reveals the hidden modifiers and roles.
     - Maps the failures of prediction to the presence of masks and finks.
     - Explains the classic conditional analysis: if an object has a disposition (e.g., fragility), then if it is struck (triggering condition), it breaks (manifestation). But in the game, even though the role was present (the group had the capacity) and the conditions were right (triggering event occurred), the manifestation did not happen because of a mask or fink.
     - Extends to group-level dispositions: a committee might have the capacity to reach consensus, but due to hidden factors (individual masks or finks), it fails to manifest.
     - Discusses dispositional contextualism: dispositions depend on context and background conditions that might be hidden.
     - Points out what the game cannot reproduce: the cross-world modal stability of the underlying disposition. In the game, the hidden modifiers are fixed and known (after the fact), but in reality, we don't know the hidden conditions. Also, the game doesn't capture the idea that the disposition might be there even in counterfactual situations. The facilitator must explain that in the metaphysics, the disposition is a modal property that would manifest in the right conditions across possible worlds, but in the game we only see one world.

     Predicted problems:

     1. Confusion between task failure and predictive failure: participants might think that the game is about solving the puzzle well, but it's about the prediction of capacity manifestation. The facilitator should emphasize that the score is for prediction, and the task is just a context.

     2. Participants treating hidden roles as mere deception: they might think it's just a game of bluffing. The facilitator should stress that the hidden modifiers are meant to represent metaphysical interferers (like in the fink and mask cases) that are beyond the bearer's control.

     3. Some capacities might not be triggered naturally: so we have scripted triggers.

     4. The observer might have a hard time predicting 6 capacities: but that's part of the challenge.

     How to manage:

     - In the setup, clearly explain the difference between the task goal and the prediction goal.
     - Emphasize that the hidden modifiers are not about deception but about simulating real-world hidden factors that affect capacities.
     - Use the scripted triggers to ensure that each capacity is tested in each round.
     - For the prediction, the predictor can take 2 minutes to write down their predictions.

     Detailed Timeline:

     - 0-10 min: Setup
          - Explain the task: arrange logical puzzle (show example).
          - Assign roles (12 roles, as above) and hidden modifiers (randomly: 4 normal, 4 mask, 4 fink). Write the hidden modifier on a card and give it to the participant secretly.
          - Explain the triggering events and how capacities are judged to manifest.
          - Explain the prediction protocol and scoring.

     - 10-20 min: Round 1
          - Select predictor (randomly).
          - Predictor writes predictions (2 minutes).
          - Group works on puzzle for 10 minutes, with scripted triggers at minutes 1,2,4,5,6,7,9,10.
          - Facilitator and helper note manifestations.

     - 20-25 min: Scoring for Round 1 and brief feedback.

     - 25-35 min: Round 2 (same as Round 1)

     - 35-40 min: Scoring Round 2

     - 40-50 min: Round 3

     - 50-55 min: Scoring Round 3

     - 55-65 min: Round 4

     - 65-70 min: Scoring Round 4

     - 70-90 min: Debrief

     Alternatively, we can have less time for scoring (do it quickly) and more for debrief.

     Given time constraints, we might reduce to 3 rounds? or have shorter rounds.

     Let's do 3 rounds of 10 minutes each, then scoring after each round takes 2 minutes (6 minutes total), and then 30 minutes for debrief.

     Revised:

     - 0-10: Setup
     - 10-20: Round 1
     - 20-22: Scoring Round 1
     - 22-32: Round 2
     - 32-34: Scoring Round 2
     - 34-44: Round 3
     - 44-46: Scoring Round 3
     - 46-76: Debrief (30 minutes)

     But we have 90 minutes, so 76 is within 90.

     In the debrief, the facilitator should:

     - Reveal the distribution of hidden modifiers and the roles.
     - For each round, show where the predictions failed and why (due to masks or finks).
     - Draw the parallel to individual dispositions: e.g., a fragile vase that is struck but doesn't break because of a hidden fink (someone secretly coated it with a strengthening resin the moment before it was struck) or a mask (it is packed in a way that prevents breaking even when struck).
     - Extend to groups: a group might have the capacity to reach consensus, but if there is a hidden fink (a member who, when consensus is about to be reached, vetoes it) or mask (a member who always blocks consensus without anyone knowing why), then the capacity doesn't manifest.
     - Discuss dispositional contextualism: the manifestation of a disposition depends on the context (the presence or absence of masks and finks), which might be hidden. Therefore, the simple conditional analysis (which doesn't account for these interferences) fails.
     - Explain the limitation: the game doesn't capture the modal aspect. The underlying disposition is supposed to be stable across possible worlds (if the conditions are met, it would manifest in all nearby worlds). But in the game, we only see one world. The facilitator must explain that in the classic cases, the disposition is still there in other circumstances (e.g., the masked fragile vase is still fragile, because if you remove the mask, it would break when struck). In the game, we can only see one run, so we can't test counterfactuals.

     This should make the collapse of the simple conditional analysis feel unavoidable because the participants experience the predictive failures firsthand.

     Note: The facilitator must be well-prepared to manage the triggers and observations.

     Let's hope it works!
answer: |-
  ### **Structured Game: "The Hidden Context"**
  **Core Metaphysical Insight:** Dispositions (e.g., fragility, solubility) are not reducible to simple conditionals ("if struck, then breaks") because capacities can be *genuinely present* yet systematically blocked by hidden contextual factors (finks or masks). This game extends this to collective dispositions (e.g., "this group can reach consensus"), showing how group-level capacities can be real but fail to manifest due to hidden individual modifiers.

  **Game Overview:**  
  12 graduate students work as a committee to complete a puzzle task. Each has a **visible role** (defining their expected capacity) and a **hidden modifier** (fink, mask, or normal). Observers predict which *group capacities* will manifest during the task, but hidden modifiers cause systematic prediction failures. The gap between possessing a capacity and manifesting it emerges through play.

  ---

  ### **Rules and Mechanics**  
  #### **1. Roles and Modifiers**  
  - **Visible Roles (Assigned Overtly):**  
    - *Mediator:* Ensures equitable discussion (capacity: conflict resolution).  
    - *Skeptic:* Challenges assumptions (capacity: critical evaluation).  
    - *Builder:* Synthesizes ideas into solutions (capacity: solution assembly).  
    - *Recorder:* Documents decisions (capacity: accurate record-keeping).  
    - *Harmonizer:* Encourages consensus (capacity: agreement-facilitation).  
    - *Ambassador:* Communicates with the facilitator (capacity: external liaison).  
    *(Each role assigned to 2 players; total 12 students.)*  

  - **Hidden Modifiers (Assigned Secretly via Random Draw):**  
    - **Fink (3 players):** *Removes their capacity* the moment it is about to be exercised. They must abort their role-action if triggered (e.g., a Harmonizer-fink walks away when consensus is near).  
    - **Mask (3 players):** *Suppresses their capacity* when conditions are right. They perform their role but ensure it fails (e.g., a Recorder-mask "accidentally" deletes notes).  
    - **Normal (6 players):** Performs their role authentically.  

  #### **2. Task Structure**  
  - **Objective:** Assemble a **logical puzzle** (e.g., arrange argument cards into a valid syllogism) within 15 minutes.  
  - **Stakes:**  
    - Success: The group solves the puzzle.  
    - **Central Challenge:** Observers predict *which group capacities* manifest, scoring points based on accuracy.  

  #### **3. Prediction & Scoring**  
  - **Observer Rotation:** Each round (3 total), 4 players serve as observers (rotating; others act).  
  - **Prediction Protocol (Pre-Task):**  
    - Observers predict which **4 collective capacities** will manifest:  
      1. *Conflict Resolution* (Mediators)  
      2. *Critical Evaluation* (Skeptics)  
      3. *Solution Assembly* (Builders)  
      4. *Consensus-Building* (Harmonizers)  
    - Predictions based *only* on visible roles (e.g., "Two Harmonizers → consensus will manifest").  
  - **Scoring:**  
    - **+1 point:** Correct prediction (manifested and predicted, or *not* manifested and predicted absent).  
    - **-2 points:** False positive (predicted to manifest but *did not*).  
    - **0 points:** False negative (predicted absent but manifested).  
    *(Emphasizes the cost of assuming capacities manifest when blocked.)*  

  #### **4. Timeline (90 Minutes Total)**  
  1. **Setup (10 min):**  
     - Assign roles/modifiers (secretly distribute modifier cards).  
     - Explain rules, task, and scoring. **Avoid metaphysical jargon** (e.g., "Some have hidden traits affecting their role").  
     - Emphasize: *"Predictions must rely only on visible roles."*  

  2. **Rounds 1–3 (15 min each; 45 min total):**  
     - **Phase 1 (3 min):** Observers predict capacities for the round.  
     - **Phase 2 (10 min):** Group solves the puzzle. Facilitator introduces **triggers** (e.g., "Conflict: Debate priority of Card A vs. Card B" → tests Mediators).  
     - **Phase 3 (2 min):** Facilitator reveals which capacities *manifested* (e.g., "Conflict Resolution: NO"). Observers score predictions.  

  3. **Debrief (35 min):**  
     - **Reveal Hidden Modifiers (5 min):** Players disclose roles/modifiers.  
     - **Map Failures (10 min):** Link prediction errors to modifiers:  
       - *Example:* "False positive for Consensus? A Harmonizer-fink removed capacity when consensus was close."  
     - **Metaphysical Bridge (15 min):**  
       - **Individual Level:** "Finks/Masks = hidden conditions blocking dispositions (e.g., a 'fragile' vase with a finkish force-field)."  
       - **Collective Level:** "Group capacities (e.g., 'can reach consensus') exist but fail due to hidden modifiers. Simple conditional analysis fails: 'If discussion, then consensus' is unreliable."  
       - **Contextualism:** "Dispositions depend on context. What a group *can* do isn't fixed; it’s mediated by hidden factors."  
     - **Limitation (5 min):**  
       - *Unsimulated Aspect:* Cross-world modal stability (e.g., "The vase *would* break if struck in *all* close worlds").  
       - *Facilitator Note:* "This game shows *actual* failure, but metaphysics requires counterfactual robustness. I’ll explain post-game."  

  ---

  ### **Predicted Problems & Mitigation**  
  - **Problem 1: Confusing Task Failure with Predictive Failure**  
    - *Example:* Players focus on solving the puzzle, not observer scores.  
    - **Mitigation:** Start with: "Your success is two-fold: solve the puzzle *and* (for observers) score prediction points." Repeatedly clarify scoring after each round.  

  - **Problem 2: Treating Modifiers as Deception, Not Metaphysical Interference**  
    - *Example:* A fink player thinks, "I’m just lying," not "I’m simulating a contextual blocker."  
    - **Mitigation:** Pre-game: "Hidden traits simulate *uncontrollable* factors (like an invisible barrier), not dishonesty." Debrief: "In metaphysics, finks/masks aren’t agents—they’re contextual conditions."  

  - **Problem 3: Observers Overfitting Predictions**  
    - *Example:* After Round 1 failure, observers predict all capacities as absent.  
    - **Mitigation:** Scoring rewards correct negatives (0 points for false negatives). Observers must engage with visible roles to avoid point loss.  

  ---

  ### **Debrief Flow**  
  1. **Reveal Hidden Mechanics:** Show modifier distribution.  
  2. **Connect Play to Theory:**  
     - "When you predicted 'Harmonizers = consensus' but it failed, that’s the simple conditional collapsing."  
     - "Group capacities are real but context-sensitive—like a committee that *can* agree, but only if no hidden fink vetoes."  
  3. **Contextualism Insight:** "Dispositions aren't intrinsic; they depend on the environment. A 'fragile' thing isn’t fragile *simpliciter*—it's fragile only in fink/mask-free contexts."  
  4. **Modal Limitation:** "This game can’t show counterfactual stability (e.g., *would* the vase break if struck in other scenarios?). That requires philosophical argument."  

  ### **Materials**  
  - Puzzle: Logical syllogism cards (e.g., premises/conclusions to arrange).  
  - Role/Modifier cards (laminated for reuse).  
  - Scoreboard for predictions.  

  ### **Outcome**  
  Players experience the gap between *having* a capacity and *manifesting* it. By Round 3, prediction failures feel inevitable—revealing the inadequacy of simple conditionals. The collective twist (group capacities + hidden modifiers) forces reflection on how individual contexts destabilize group dispositions. Metaphysical insights emerge from mechanics before terms like "fink" or "dispositional contextualism" are introduced.
