  The catharsis principle struggles with VR and AI narratives. Catharsis happens, but without performers, it's not spectacle. So structural split handles those better. The user's VR example is deemed okay, which structural split explains (no human performers), while catharsis might see it as replacing action. But since it's private, maybe not corrupting community. 

