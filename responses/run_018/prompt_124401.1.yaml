answer: |-
  Here is the complete exam package designed for your upper-level Philosophy of Biology final, focusing squarely on the tensions in Darwin's *Descent of Man* as requested.

  ---

  ### Exam Question (90 Minutes)
  **Question:** In *Descent of Man*, Darwin argues that human morality arises solely from evolved social instincts (like sympathy), shaped by natural selection for tribal utility. He simultaneously dismisses religious morality as a byproduct ("spandrel") of evolved traits like agency-detection and fear. Analyze whether Darwin can *consistently* claim that extending sympathy to all sentient beings represents objective "moral progress" rather than merely contingent cultural change. Your analysis must address:
  1.  **The tension** between morality's origin in tribal utility and the claim of universal moral progress.
  2.  **The "normative bootstrapping" problem**: Can a system of morality, evolved solely for group advantage, generate its own standards to justify claims of "progress" beyond that original function? (Do not just define this; engage with *how* it challenges Darwin).
  3.  **The role of Darwin's bee-to-human gradation argument** (where he compares social instincts across species) in supporting or undermining his view of moral progress.
  4.  **How his dismissal of religious foundations for morality** impacts the stability of his *own* claim about moral progress (does it strengthen his naturalism or destabilize his normativity?).

  **Avoid** mere summary of Darwin’s sympathy/social instinct account. Focus on the philosophical consistency of his claims about progress given his naturalistic framework.

  ---

  ### Model Answer (Approx. 600 words)
  Darwin’s naturalistic account of morality faces a profound tension when he claims that expanding sympathy beyond the tribe to all sentient beings constitutes genuine "moral progress." While internally coherent as a description of origins, his framework struggles to ground the normative force of "progress" without smuggling in external values or falling into circularity.

  Morality, for Darwin, is a contingent biological adaptation. Social instincts like sympathy evolved via group selection because cohesive, cooperative tribes outcompeted others ("tribal utility"). Crucially, this utility defined "good" – actions aiding the tribe were instinctively *felt* as virtuous. Darwin explicitly severs this evolved morality from religious foundations, relegating religion to a spandrel: an accidental byproduct of hyperactive agency-detection and fear mechanisms, not a source of moral truth. This dismissal aims to strengthen his naturalism by removing supernatural justifications.

  However, this very dismissal creates the core problem when Darwin posits *progress*. Extending sympathy universally lacks clear evolutionary utility – aiding distant strangers or non-competitive groups doesn't obviously enhance *our* tribe's fitness. Darwin recognizes this, arguing progress stems from reason and habit extending our innate instincts beyond their original purpose. Yet, this is where the **normative bootstrapping problem** arises. Can instincts *selected for tribal advantage* generate an independent standard to judge the *expansion* of those instincts as "better"? Darwin's framework defines "good" *as* what was evolutionarily useful for the tribe. Appealing to the "instinct" itself as justification for its expansion is circular: "Expanding sympathy is good because our evolved instincts (which tell us what's good) now urge us to expand sympathy." Without an external standard (like divine command, which he rejects), "progress" seems reduced to a change in the *content* of our instincts/habits, not an objectively better state. It risks appearing as "fashion change" driven by intellectual habit, not moral truth.

  Darwin’s **bee-to-human gradation argument** both helps and hurts here. By showing social instincts (like sacrifice for the hive/tribe) exist on a continuum across social animals, he grounds human morality firmly in biology, supporting naturalism. It suggests sympathy's expansion is a plausible *extension* of an existing biological trait, not something wholly new. However, this gradation also undermines claims of unique *normative progress*. If bee self-sacrifice is an instinct calibrated for hive utility, analogous to tribal human morality, then universal human sympathy appears as just another calibration – perhaps for a "global tribe" in a modern world. The gradation shows the mechanism but doesn't provide a *justification* for why one calibration (universal sympathy) is objectively "higher" than another (tribal loyalty). It reinforces the contingency.

  **Finally, dismissing religious morality** is a double-edged sword. It strengthens Darwin’s naturalistic *explanation* by eliminating rival foundations and showing how moral feelings arise independently. However, it catastrophically **destabilizes his normative stance** on progress. By removing religion (or any transcendental standard), Darwin eliminates the only potential source of *objective* normativity his framework seems to require to call universal sympathy "progress." He leaves morality entirely rooted in contingent, utility-driven instincts. His claim for progress thus appears to rest not on his evolutionary account itself, but on unstated Victorian values – a preference for universalism and reason – smuggled in as objectively superior. His naturalism explains the origin of moral *feelings*, but struggles to validate the *judgment* that one feeling (universal sympathy) represents "progress" over another (tribal loyalty) without appealing beyond evolution to the very normative ideals his theory was meant to naturalize.

  In conclusion, while Darwin brilliantly explains the origin of moral sentiments naturalistically, his claim for objective moral progress through expanding sympathy is inconsistent within his purely evolutionary framework. The bootstrapping problem remains unresolved, the bee-human gradation illustrates contingency without justification, and rejecting religious foundations removes potential anchors for normativity, leaving his progress claim looking suspiciously like a projection of his own cultural values.

  ---

  ### Marking Scheme (Total: 20 Marks)
  An **A (17-20)** will:
  1.  **Precisely Identify Core Tension (4 marks):** Clearly explain morality’s origin in tribal utility vs. the claim of universal progress as non-utilitarian expansion. Contrast Darwin’s account of morality (evolved instinct) with religion (spandrel).
  2.  **Engage Normative Bootstrapping Problematically (5 marks):** Move beyond defining bootstrapping. Explain *how* defining "good" via tribal utility makes justifying *new* goods (universal sympathy) circular or impossible without external standards. Explicitly argue whether Darwin escapes this or not.
  3.  **Analyze Bee-Human Gradation (4 marks):** Explain how this argument supports naturalism/continuity *and* how it undermines claims of unique normative progress by illustrating instinctual contingency. Must go beyond "it shows similarity."
  4.  **Impact of Dismissing Religious Morality (4 marks):** Explain how this dismissal strengthens naturalistic *explanation* but critically destabilizes the *normative claim* for progress by removing potential objective foundations. Articulate the resulting vulnerability to the "smuggling Victorian values" charge.
  5.  **Structure & Clarity (3 marks):** Logical flow, precise language, directly addresses all parts of the prompt.

  A **B (13-16)** will:
  1.  Identify the core tension but with less precision or depth.
  2.  Mention bootstrapping but not engage its problematic circularity deeply (e.g., defines it but doesn't show *how* it traps Darwin).
  3.  Discuss the bee-human gradation but primarily for continuity, missing its implication for undermining *normative* progress.
  4.  Note that dismissing religion supports naturalism but give a weak or unclear analysis of how it harms normativity.
  5.  Be generally well-structured but may have minor gaps or less analytical depth.

  **Common Mistakes & Point Deductions:**
  *   **(-3 to -5)** Summarizing Darwin's sympathy/social instinct story without focusing on the *tension/progress* question.
  *   **(-3)** Failing to address the **normative bootstrapping problem** *conceptually* (just naming it = -2; ignoring it = -3).
  *   **(-2 to -3)** Ignoring or superficially treating the **bee-to-human gradation argument**.
  *   **(-2 to -3)** Not analyzing the **impact of dismissing religious morality** on Darwin's *own* normative stance (only saying it makes his account naturalistic).
  *   **(-2)** Misrepresenting Darwin's view (e.g., claiming he *endorses* religious morality, or that group selection implies universal sympathy is adaptive).
  *   **(-1 to -2)** Unclear writing, poor structure, or significant tangential discussion.
  *   **(-1 to -2)** Asserting "it's just Victorian values" without explaining *how* Darwin's framework fails to justify progress internally (the bootstrapping problem).

  **Grade Thresholds:** A- = 17-18; A = 19-20; B+ = 16; B = 14-15; B- = 13; C+ = 12; etc.

  ---
  This package forces students into the philosophical weeds you requested. The prompt explicitly demands engagement with bootstrapping, the bee-human argument, and the religion-morality tension as destabilizing factors. The model answer demonstrates wrestling with circularity and the lack of normative foundations. The marking scheme harshly penalizes summary, superficiality, and missing the specific analytical moves, ensuring only deep engagement earns top marks. Good luck with your final!
