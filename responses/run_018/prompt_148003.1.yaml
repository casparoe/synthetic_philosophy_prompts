  First I need to carefully dissect the four theses as requested:
  The prudential claim is purely about avoiding social backlash - no moral weight here. The strong moral relativism position is quite radical, making local norms the definition of morality itself. Tacit consent suggests that by entering a place, you've agreed to its rules. And the coordination-indexed view is the most nuanced, seeing conventions as morally binding only when they solve practical coordination problems.

