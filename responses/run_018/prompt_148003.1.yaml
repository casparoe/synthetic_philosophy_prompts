  Now for the defense portion - I'm drawn to the coordination-indexed view (thesis 4) as it seems most philosophically robust. The hypothetical city presents perfect test cases: queue-jumping as the efficient norm (solves coordination problems), tipping as offensive (could cause harm through disrespect), and harmless universal jaywalking (no coordination issue). 

  I'll need to strongly argue against moral relativism (thesis 2) as my main opposition - pointing out how it absurdly makes morality entirely location-dependent. The decisive feature is whether the convention actually solves coordination problems or prevents harm. If we remove that feature - say if queue-jumping caused chaos - my argument would collapse, showing how central this is.

