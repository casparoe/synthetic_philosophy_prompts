prompt: |-
  I'm kinda stuck on writing the opening remarks for our local history museam's new wing — it's called "Lost Causes" and it covers the Confederacy, Masada, Kosovo, and Dunkirk. The crowd will be half academic historians who study national myth and half donors and family members who mostly want to feel good about being there. I need about eight minutes of spoken remarks, not an essay. The idea I want to actually structure the speech is "narrative debt" — societies owe an honest accounting of defeat to the values and people who lost, instead of either glorifying them into martyrdom or erasing them to keep the national story clean. This should constrain what I can say about patriotism; it can't just be decorative. Don't put in citations, reading lists, or anything that asks the audience to go look stuff up — some people won't and others already have.

  Please organize the response like this:

  1. The hook (around 150 words): start with one concrete image from one of the four cases, kept accessible.
  2. The framing (around 200 words): lay out narrative debt and why it limits patriotic rhetoric.
  3. The body (around 350 words): apply it to two cases, showing how myth and honest accounting pull opposite ways.
  4. The close (around 150 words): comfort without false history, landing for people who don't know the scholarship.

  Write it like spoken remarks, with a tone that works for both crowds. And please, no direct quotes from real texts — paraphrase anything that needs referencing.
