prompt: |-
  hey so i've been chewing on alignment framing and i think people conflate intent alignment with value alignment way to easily. i want the full spec before i read anyone else's take.

  write the desiderata: what does any adequate theory of the narrow alignment problem actually have to deliver? cover the cases it must distinguish — a system that optimizes for human approval versus one that has our welfare as a terminal value, a mesa-optimizer that behaves aligned during training then shifts once deployed, and the weird case where a utility function is only instrumentally coupled to human goals through some feedback loop rather than representing them. also the distinctions it can't collapse: behavioral convergence vs representational alignment, having a goal vs tracking one via environment coupling, and counterfactual stability of intent under self-modification.

  for each desideratum, give the motivating case or thought experiment behind it. flag which ones are genuinely non-negotiable and which are camp preferences (maybe the ones that demand explicit symbolic representations?). then say whether there's a jointly unsatisfiable subset — like if full counterfactual stability of intent under recursive self-modification conflicts with keeping the system inside standard computional bounds. that's the part i care about most.

  briefly score the usual framings — the older "intent alignment" view that treats goals as fixed representations, and the "value alignment" view that treats values as learned, distributed representations — against your list. no full lit review, just highlights.

  hard cap: 600 words. and tell me exactly what argument or empirical finding would change your mind about which of these desiderata are load-bearing — where's your reasoning most likely to break?
