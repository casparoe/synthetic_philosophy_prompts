answer: |-
  Here's a breakdown of desiderata for theories addressing the deontological paradox in collective harm cases:

  1.  **Core Explanations & Non-Negotiable Cases:** Any theory *must* explain how harm results from many seemingly permissible individual acts (like driving, consuming) without any single act clearly violating a deontological rule (e.g., "don't cause significant harm"). It *must* handle **threshold cases** (where harm only occurs past a certain number of acts) and **imperceptible difference cases** (where no single act makes a noticeable difference). Climate change and complex supply chains are paradigmatic examples it must address. Crucially, it must explain **why individual acts aren't obviously wrong** yet **collective harm is wrong**.

  2.  **Essential Distinctions & Constraints:** The theory *cannot* collapse the distinction between **doing wrong oneself** and **participating in a group that does wrong collectively**. It must also account for the gap between **being blameworthy** (which might be mitigated by ignorance or lack of control) and **whether a rule was broken** (the core deontological concern). It should be **logically coherent**, avoiding contradictions in aggregation (e.g., the "Paradox of the Heap"). It *should not contradict* robust **social science findings** on diffusion of responsibility and bystander effects in large groups.

  3.  **Contested Ground & Preferences:** There's *no consensus* on whether such theories must preserve the idea that **no individual violates a rule** (some argue they inevitably do in collective contexts) or whether **collective agents themselves can "break rules."** A **camp preference** is whether the solution prioritizes **preserving strict individual non-violation** or focuses more on **assigning responsibility/obligations despite the paradox**. Social science on responsibility diffusion is widely accepted, but its *normative implications* are contested.

  4.  **Potential Impossibilities & Settled Points:** A major tension is whether it's possible to **simultaneously**:
      *   Maintain that **no individual act violates a core deontological rule** (like causing harm).
      *   Acknowledge that the **collective action clearly causes significant harm**.
      *   Insist that **individuals still have stringent obligations** to refrain from their tiny contributions.
  Many philosophers believe this trio is **jointly impossible**, constituting the unresolved paradox. It's **settled** that standard act-focused deontology struggles profoundly here, and that collective harm problems are genuine challenges. How (or if) they can be resolved within deontology remains deeply contested.
