prompt: |-
  I am a retired physicist who has only recently begun to study philosophy, and I have become absorbed by the problem of evidential cooperation in large worlds. By this I mean the situation, familiar from evidential decision theory, in which an agent expects her choice to correlate with those of many causally disconnected but structurally identical copies of herself, so that her decision carries evidential weight about outcomes elsewhere in the ensemble. I wish you to compare the evidential-decision-theoretic endorsement of cooperation in such worlds with the causal-decision-theoretic refusal to cooperate, but I want the comparison conducted through a specific analogical lens drawn from statistical mechanics: treat the full ensemble of decision-makers as a system of identical particles subject to symmetry constraints. Precisely identify which aspects of evidential cooperation correspond to the preservation of global symmetry across the ensemble, which correspond to its breaking, and whether the causal theorist's demand for local causal efficacy functions structurally like a local-field constraint that prohibits non-local correlations. Do not provide a bibliography, a reading list, or citations; I am interested solely in the disciplined conceptual mapping and in the exact points where the analogy succeeds or collapses. Please maintain a formal, analytical tone throughout.
reasoning: |-
  We are to compare evidential decision theory (EDT) and causal decision theory (CDT) in the context of large worlds with many identical agents, using an analogy from statistical mechanics. The key elements are:

  1. **The Ensemble**: A large collection of identical decision-makers (agents) who are causally disconnected but structurally identical. This is analogous to a system of identical particles in statistical mechanics.

  2. **Symmetry Constraints**: In statistical mechanics, identical particles are subject to symmetry constraints (e.g., Bose-Einstein or Fermi-Dirac statistics) that enforce global symmetry. We will map the cooperative behavior in EDT to the preservation of global symmetry and non-cooperation to symmetry breaking.

  3. **Decision-Theoretic Frameworks**:
     - **EDT**: The agent chooses an action that provides the best evidence for the desired outcome, even if the action does not causally produce that outcome. In the large world, an agent's action is evidence about what other identical agents do, leading to cooperation (e.g., in a prisoner's dilemma, choosing to cooperate because it is evidence that others also cooperate).
     - **CDT**: The agent chooses an action that causally brings about the best outcome, ignoring any evidential correlations. In the large world, since the agents are causally disconnected, CDT sees no causal effect of one's action on others and thus defects (in prisoner's dilemma).

  4. **Analogy to Statistical Mechanics**:
     - **Global Symmetry Preservation (EDT)**: When all agents cooperate, they are in a symmetric state. The global symmetry of the ensemble (all agents identical and making the same choice) is preserved. This is analogous to a symmetric quantum state (e.g., a Bose-Einstein condensate) where the wave function is symmetric under particle exchange.
     - **Symmetry Breaking (CDT)**: When agents defect, they break the symmetry. Each agent acts independently, leading to a disordered state (like a paramagnet). This is analogous to symmetry breaking in phase transitions where the system picks a particular state (e.g., magnetization in one direction) but in our case, the breaking is towards defection.

  5. **Local Causal Efficacy (CDT) and Local-Field Constraint**:
     - In CDT, the agent demands that her action must have a local causal effect. This is analogous to a system where each particle is subject to a local field that breaks the symmetry and forces each particle to align independently (without regard to non-local correlations).
     - In statistical mechanics, a local field (e.g., an external magnetic field) breaks the symmetry and forces each spin to align with the field. Similarly, CDT's focus on local causality breaks the global symmetry by making each agent consider only the immediate causal effects of their own action, ignoring the evidential correlations (which are non-local).

  Now, we break down the analogy:

  **Mapping:**

  - **Ensemble of Agents ↔ System of Identical Particles**: The agents are like identical particles. The symmetry constraint is that they are identical and should, in the absence of any distinguishing factor, behave identically.

  - **Global Symmetry Preservation ↔ Cooperative Equilibrium (EDT)**:
    - In EDT, cooperation is the symmetric strategy: all agents choose the same action (cooperate). This preserves the symmetry of the ensemble because every agent is doing the same thing. The evidence that one cooperates is evidence that others do too, leading to a mutually beneficial outcome (like a symmetric state with high utility).
    - In statistical mechanics, the symmetric state (e.g., the ground state of a Bose gas) is one where the wave function is symmetric and particles are in the same state.

  - **Symmetry Breaking ↔ Defection (CDT)**:
    - In CDT, each agent defects because she sees no causal influence on others. This breaks the symmetry: agents are now in a state of defection (which may be mixed or disordered). The result is a suboptimal outcome (like a prisoner's dilemma equilibrium).
    - In statistical mechanics, symmetry breaking occurs when the system transitions to a state that is not symmetric (e.g., a ferromagnet at low temperature, where spins align in a particular direction). Here, the symmetry breaking is towards defection, which is the dominant strategy in the absence of symmetry constraints.

  - **Local Causal Efficacy (CDT) ↔ Local-Field Constraint**:
    - CDT requires that an action must be evaluated by its local causal effects. This is like applying a local field to each particle that forces it to align independently of the others. The local field breaks the symmetry and prevents non-local correlations (i.e., the evidential correlations that EDT uses).
    - In the Ising model, for example, a local magnetic field at each site would force the spin to align with the field, regardless of what neighboring spins do. Similarly, CDT's localism forces each agent to consider only the direct causal consequences of her action, ignoring the evidence about others.

  **Points of Success of the Analogy:**

  1. **Global Symmetry and Cooperation**: The analogy captures the idea that EDT's cooperative solution maintains a global symmetry (all agents cooperate) which is optimal for the collective, much like symmetric states in statistical mechanics can be energy minima.

  2. **Symmetry Breaking and Defection**: CDT's defection breaks the symmetry and leads to a disordered state (the Nash equilibrium) which is analogous to a high-temperature disordered phase. The failure to coordinate is due to the lack of a mechanism to enforce global symmetry.

  3. **Local Constraints**: The local-field constraint in statistical mechanics is a direct analog of CDT's requirement for local causal efficacy. Both break the global symmetry by introducing local considerations that override non-local correlations.

  **Points of Collapse of the Analogy:**

  1. **Nature of Symmetry**: In statistical mechanics, the symmetry is a fundamental physical constraint (e.g., permutation symmetry for identical particles). In the decision problem, the symmetry is not a physical law but a logical constraint arising from the identicality and evidential reasoning. The agents are free to break it (as CDT does) without violating any physical principle.

  2. **Dynamics vs. Decision**: Statistical mechanics often involves dynamics (e.g., relaxation to equilibrium) and temperature (entropy vs. energy trade-off). The decision problem is static (one-shot) and does not have an explicit entropy term. The analogy to phase transitions (symmetry breaking at critical temperature) is not directly applicable because the decision is made without any stochastic thermal fluctuations.

  3. **Non-local Correlations in Physics**: In quantum mechanics, non-local correlations (entanglement) are physical and cannot be ignored. In the decision problem, the non-local correlations are evidential (epistemic) and not physical. CDT dismisses them because they are not causal, while EDT treats them as evidentially relevant. This epistemic versus physical distinction is a key difference.

  4. **Collective States**: In statistical mechanics, symmetric states (like Bose-Einstein condensates) are collective phenomena that emerge from the quantum statistics. In the decision problem, the collective state (cooperation) is a result of rational deliberation, not a physical law. The analogy holds in structure but not in the underlying mechanism.

  **Conclusion:**

  The analogy successfully maps the preservation of global symmetry in statistical mechanics to EDT's cooperative equilibrium and symmetry breaking to CDT's defection. The local-field constraint in statistical mechanics is analogous to CDT's demand for local causal efficacy, which breaks the symmetry by preventing non-local evidential correlations. However, the analogy collapses in that the symmetry in decision theory is epistemic (based on reasoning about identical agents) rather than physical, and the non-local correlations in the decision problem are evidential and not causally binding. Despite this, the structural similarity provides a useful lens for understanding the difference between EDT and CDT in large worlds.
answer: |-
  ### Conceptual Mapping: Evidential Cooperation in Large Worlds through Statistical Mechanics Analogy

  #### **Foundational Analogy: Ensemble of Decision-Makers as Identical Particles**
  The large-world ensemble of causally disconnected, structurally identical agents corresponds to a system of identical particles in statistical mechanics.  
  - **Symmetry Constraint**: Identical particles are governed by permutation symmetry, requiring the system's state to be invariant under particle exchange. Analogously, the agents' structural identity imposes an epistemic symmetry: each agent must consider their decision indistinguishable from others' decisions absent distinguishing information.  
  - **Global State**: The collective outcome (e.g., mutual cooperation or defection) corresponds to a macrostate in statistical mechanics, defined by global observables (e.g., total utility or magnetization).  

  ---

  #### **Evidential Decision Theory (EDT) as Symmetry Preservation**  
  EDT endorses cooperation by treating an agent's action as *evidence* for actions of identical copies. This maps to maintaining global symmetry:  
  - **Cooperation as Symmetric State**: When all agents cooperate, their identical actions preserve permutation symmetry. EDT's rationality condition—maximizing conditional expected utility—aligns with this symmetry. Choosing cooperation signals that identical agents likely cooperate, leading to high global utility (e.g., in a Prisoner's Dilemma ensemble).  
  - **Non-Local Correlations**: EDT's evidential update introduces *non-local correlations* analogous to quantum entanglement or long-range order. An agent's action correlates with distant agents' actions, not through causation but through symmetry: "I cooperate" implies "others cooperate" due to structural identity. This mirrors symmetric wavefunctions (e.g., Bose-Einstein condensates), where particle states are interdependent.  
  - **Symmetry Enforcement**: EDT's decision rule functions as a symmetry-preserving constraint. By conditioning on the action (e.g., \( P(\text{outcome} \mid \text{cooperate}) \)), EDT enforces global uniformity, akin to a partition function summing only over symmetric configurations.  

  **Structural Success**:  
  - EDT's cooperation maintains a high-symmetry, low-"energy" state (optimal global utility).  
  - Non-local evidential correlations directly mirror non-local physical correlations in symmetric quantum states.  

  **Analytical Limit**:  
  - The analogy collapses if symmetry is *physically* broken (e.g., by external perturbations), whereas EDT's symmetry is epistemic and can be overridden by causal reasoning.  

  ---

  #### **Causal Decision Theory (CDT) as Symmetry Breaking**  
  CDT refuses cooperation by demanding *local causal efficacy*. This maps to symmetry breaking:  
  - **Defection as Symmetry-Broken State**: CDT evaluates actions solely by local causal consequences. Defection becomes dominant, as an agent cannot *cause* others to cooperate. This fragments the ensemble into independent decisions, breaking global symmetry. The resulting state (e.g., mutual defection) resembles a disordered phase (e.g., paramagnet).  
  - **Local-Field Constraint**: CDT's focus on local causality functions as an effective "local field" applied to each agent. This field breaks permutation symmetry by isolating agents: each decision depends only on local causal inputs (e.g., \( \text{argmax}_a \, \sum_o P(o \mid \text{do}(a)) \cdot U(o) \)), ignoring non-local correlations.  
  - **Spontaneous Symmetry Breaking**: CDT's defection equilibrium parallels spontaneous symmetry breaking in phase transitions (e.g., Ising model). The symmetric state (cooperation) is meta-unstable; any local fluctuation toward defection propagates, collapsing symmetry.  

  **Structural Success**:  
  - CDT's local-field constraint matches how external fields (e.g., magnetic fields) align spins independently, destroying long-range order.  
  - Mutual defection mirrors high-entropy, disordered macrostates with suboptimal utility (high "energy").  

  **Analytical Limit**:  
  - Physical symmetry breaking involves dynamics (e.g., thermal fluctuations), while CDT's symmetry breaking is instantaneous and deterministic.  

  ---

  #### **Critical Comparison: Symmetry Preservation vs. Local-Field Constraints**  
  | **Aspect**               | **EDT (Symmetry Preservation)**                          | **CDT (Symmetry Breaking)**                              |  
  |--------------------------|----------------------------------------------------------|----------------------------------------------------------|  
  | **Global Symmetry**      | Maintained: Actions correlate non-locally.               | Broken: Actions are independent.                        |  
  | **Non-Local Correlations**| Required: Evidential links enforce uniformity.           | Prohibited: Local-field constraint severs correlations. |  
  | **Equilibrium State**    | Cooperative (low "energy," high utility).                | Defective (high "energy," Nash equilibrium).            |  
  | **Role of Identity**     | Fundamental: Symmetry dictates evidence.                 | Irrelevant: Local causality overrides symmetry.         |  

  **Points of Analogy Success**:  
  1. Non-local correlations in EDT directly correspond to symmetry-induced correlations in quantum statistics.  
  2. CDT's local-field constraint structurally mirrors how local potentials (e.g., \( H = -\sum B_i S_i \)) disrupt global symmetry.  

  **Points of Analogy Collapse**:  
  1. **Mechanism of Correlation**: In physics, non-local correlations (e.g., entanglement) are ontological; in EDT, they are epistemic (arising from self-locating uncertainty).  
  2. **Symmetry Enforcement**: Physical symmetries are inviolable laws; decision-theoretic symmetries are normative and can be violated by causal reasoning.  
  3. **Dynamics**: Statistical mechanics relies on thermodynamic limits and ergodicity; decision theory is static, lacking temporal evolution.  

  ---

  #### **Conclusion: The Analogy as a Conceptual Lens**  
  EDT's cooperation preserves global symmetry by treating the ensemble as a unified system, leveraging non-local evidential correlations. CDT breaks symmetry by imposing a local-field constraint (causal locality), isolating agents and prohibiting non-local dependencies. The analogy succeeds in mapping:  
  - Symmetry preservation \(\leftrightarrow\) EDT cooperation.  
  - Symmetry breaking + local fields \(\leftrightarrow\) CDT defection.  
  It collapses where physical laws (e.g., conservation) enforce symmetry, whereas decision-theoretic symmetry is a product of rational inference and can be overridden. This highlights EDT's reliance on epistemic unity versus CDT's commitment to causal individualism.
