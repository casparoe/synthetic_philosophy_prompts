  im in this metaphysics seminar and last week we got into this huge argument about whether you could've come from a totally different sperm and egg and still be you — like, is your identidy locked to your exact biological origin? now my sister just told me she's doing IVF with a donor egg because of some genetic risk thing, and she made this weird joke that the baby is "basically a rental" but then asked seriously whether using a different egg means it's essentially a different person than the kid she "would have had" naturally. she even said if she used her egg but my brother-in-law's sperm was different — like if they used donor sperm instead — does that change the kid's identidy too? i told her she's mixing up genetics with who someone is, but then she hit me with "well if mom and dad had used different gametes you wouldn't exsit, so isn't your existance tied to exactly these ones?" i think there's a difference between "this specific child" and "just any child she raises," but i can't figure out where the line is. can you help me sort out whether using donor gametes actually makes the baby a different individual in the philosophical sence, or is she just confused about biology?
