prompt: |-
  I am trying to specify what an account of "free will worth wanting" must deliver if it is to be adequate for moral psychology rather than metaphysics alone. Write the desiderata: list the requirements any such theory must satisfy, with the motivating case or distinction behind each. Specifically, it must distinguish executive sourcehood—control over particular actions—from diachronic narrative coherence—the capacity to recognize one's present self in past decisions—and it must accommodate both gradual value drift, where an agent's priorities shift in ways she only partly endorses retrospectively, and sudden value rupture, such as trauma-induced personality change or conversion, without treating either as a failure of freedom tout court. It must also preserve the distinction between lacking freedom due to internal compulsion and lacking it due to external coercion, and it must remain consistent with empirical findings that deliberative processes are often post-hoc rationalizations. Flag which desiderata are genuinely non-negotiable and which reflect partisan commitments of particular camps—especially the demand for ultimate origination. Identify whether any subset, particularly the combination of full narrative coherence with open-ended executive revision, is jointly unsatisfiable. Then briefly indicate how standard compatibilist, hierarchical, and revisionist accounts fare against your list. No bibliography is needed; I want the conceptual architecture.
reasoning: |-
  We are constructing a list of desiderata for an account of "free will worth wanting" that is adequate for moral psychology (not just metaphysics). The account must handle both executive control (sourcehood over actions) and narrative coherence (diachronic self-relation), while accommodating both gradual value drift and sudden value rupture without treating them as failures of freedom. It must also preserve the distinction between internal compulsion and external coercion, and be consistent with the empirical fact that deliberation is often post-hoc rationalization.

   We will list the requirements, each with a motivating case or distinction. We will flag non-negotiable vs. partisan desiderata, and check for joint unsatisfiability. Then we will briefly evaluate standard accounts.

   Desiderata:

   1. **Executive Sourcehood (Control)**: The agent must have control over her actions in the sense that she is the source of her actions in a way that makes her responsible for them. This includes the capacity to act according to her reasons and to have the ability to do otherwise in a relevant sense (e.g., conditional or dispositional). 
      *Motivation*: Without this, we cannot hold agents accountable for their actions. Example: A person deciding to lie must be able to control that lie and have the ability to choose truth.

   2. **Diachronic Narrative Coherence**: The agent must be able to recognize her present self as continuous with her past self, such that past decisions are seen as her own, even if she now rejects the values that led to them. This does not require complete consistency, but a minimal narrative thread.
      *Motivation*: Moral responsibility often requires that we can impute past actions to the present person (e.g., guilt for a past crime even after reform). Also, for projects and commitments that unfold over time.

   3. **Accommodation of Gradual Value Drift**: The theory must allow that an agent's values and priorities can shift gradually over time, and that the agent might retrospectively endorse these changes only partially (i.e., not fully reject the past self but also not fully endorse it).
      *Motivation*: People change over time (e.g., becoming more environmentally conscious) without becoming a different person. We want to hold the same agent responsible for past actions, even if she now disavows the values that led to them.

   4. **Accommodation of Sudden Value Rupture**: The theory must allow for radical changes in values or personality (e.g., due to trauma, conversion, or brain injury) without necessarily treating the agent as a new person or the change as a total loss of freedom. The agent after the rupture must still be able to have free will (and perhaps be responsible for new actions) but without being held responsible for pre-rupture actions if the rupture is severe enough to break narrative continuity.
      *Motivation*: Cases like Phineas Gage (personality change after brain injury) or religious conversion. We don't want to say that the person after the rupture is not free, but we might excuse pre-rupture actions if the agent is now unrecognizable to herself.

   5. **Distinction between Internal Compulsion and External Coercion**: The theory must preserve the difference between being unfree because of inner compulsions (e.g., addiction, phobia) and being unfree because of external forces (e.g., being held at gunpoint). 
      *Motivation*: In moral psychology, we treat the addict differently from the coerced person. The addict might be responsible (at least partially) for actions done under compulsion, whereas the coerced person is not.

   6. **Consistency with Post-Hoc Rationalization**: The theory must be consistent with the empirical fact that much of our deliberative reasoning is actually post-hoc justification for actions driven by unconscious processes. This does not necessarily undermine free will, but the account must explain how we can still have free will in light of this.
      *Motivation*: Experiments (e.g., Libet) suggest that we often act before being consciously aware of the decision. Yet we still want to hold people responsible for actions they can control, even if the reasons they give are rationalizations.

   7. **Rejection of Ultimate Origination as Non-Negotiable?**: We must flag that the demand for "ultimate origination" (that the agent is the uncaused cause of her actions) is typically a metaphysical demand and may be partisan. We note that for moral psychology, we can set aside ultimate origination as non-essential (non-negotiable for some camps, but we mark it as partisan and not required for our purposes).
      *Motivation*: Compatibilists typically reject the need for ultimate origination, while libertarians insist on it. Since we are focused on moral psychology, we can avoid this metaphysical quagmire.

   8. **Joint Satisfiability of Narrative Coherence and Open-Ended Revision**: We must check whether requiring full narrative coherence (as in 2) and also allowing for open-ended executive revision (which might lead to radical change) is jointly unsatisfiable. But note: we don't require "full" coherence, only minimal. And we have already allowed for rupture. So they are jointly satisfiable if we allow that narrative coherence can be broken in rupture events, but then the agent after rupture builds a new narrative.

   Non-negotiable vs. Partisan:

   - Non-negotiable for moral psychology: 1 (executive sourcehood), 2 (narrative coherence, minimally), 5 (distinction compulsion/coercion), 6 (consistency with rationalization). These are central to our practices of holding people responsible and making sense of agency.

   - Partisan: 
       - The demand for ultimate origination (from libertarians) is not required here (we reject it as necessary for moral psychology). 
       - Also, note that some compatibilists might reject the strong need for narrative coherence (desideratum 2) as a necessary condition, but we take it as non-negotiable for moral psychology because without it we lose the temporal dimension of responsibility.

   Joint Unsatisfiability: 
       We require both the capacity for open-ended revision (which includes both gradual drift and rupture) and narrative coherence. But note: rupture might break narrative coherence. So we have to allow that in cases of rupture, the narrative is broken and the agent after rupture is not the same in terms of responsibility for pre-rupture actions. But then we require that the agent after rupture must build a new narrative. So the two are not jointly unsatisfiable if we allow that narrative coherence is a condition that can be re-established after rupture (or maintained in drift). We do not require that the agent must always have a single unbroken narrative.

   How standard accounts fare:

   - **Standard Compatibilism** (e.g., Hume, Frankfurt): 
       - Strong on 1 (executive control via reasons-responsiveness or hierarchical desires) and 5 (distinguishes internal vs. external by focusing on the agent's own desires). 
       - Weak on 2 (narrative coherence is not central) and might struggle with 3 and 4 (value drift and rupture) because it focuses on current psychological states. 
       - It can handle 6 (post-hoc rationalization) by noting that what matters is the agent's ability to control and guide actions by reasons, even if the reasons are post-hoc. 
       - It rejects 7 (ultimate origination) and is thus free of that burden.

   - **Hierarchical Accounts** (e.g., Frankfurt, Dworkin): 
       - Focus on the agent's higher-order desires. 
       - They do well on 1 and 5 (by requiring that the action is in accord with higher-order volitions). 
       - They might struggle with 2, 3, and 4 because a rupture or drift might lead to a change in higher-order volitions, but without a narrative thread. 
       - Also, they might have trouble with 6 because the higher-order volitions themselves might be formed post-hoc. 

   - **Revisionist Accounts** (e.g., Vargas, Nelkin): 
       - These accounts aim to revise our concept of free will to fit with science and moral practices. 
       - They are likely to do well on 6 (post-hoc rationalization) and 5 (distinction). 
       - They might build in narrative elements to address 2, 3, and 4. 
       - However, they often downplay or reconfigure the need for strong executive sourcehood (1) in the traditional sense, which might be a problem.

   Conclusion: The account we are looking for must weave together executive control and narrative coherence, allowing for change (both gradual and abrupt) without losing the agent. It must also respect the internal/external distinction and the realities of post-hoc reasoning. None of the standard accounts fully satisfy all, but a narrative-based compatibilism (e.g., inspired by Dennett or Schechtman) might come closest by emphasizing the story we tell about ourselves as central to agency.
answer: |-
  ### Desiderata for "Free Will Worth Wanting" in Moral Psychology  
  An adequate account must bridge executive control and narrative identity while accommodating dynamic selfhood. Below are the requirements, each grounded in a motivating case or distinction, followed by an assessment of non-negotiables, partisan commitments, and joint satisfiability.  

  #### **Core Desiderata**  
  1. **Executive Sourcehood (Control)**  
     - **Requirement**: The agent must be the *proximal source* of actions, with the capacity to act on reasons, revise intentions, and exert control over specific choices.  
     - **Motivating Case**: Distinguishing a coerced confession (externally compelled) from a spontaneous lie (internally generated). Without executive control, moral blame/praise collapses for ordinary decisions.  
     - **Status**: **Non-negotiable**. Foundational for attributing responsibility.  

  2. **Diachronic Narrative Coherence**  
     - **Requirement**: The agent must recognize past actions as *theirs* (even if regretted), preserving psychological continuity sufficient for autobiographical ownership.  
     - **Motivating Case**: Holding someone accountable for past promises (e.g., a vow) requires seeing their past and present selves as narratively linked, despite value changes.  
     - **Status**: **Non-negotiable**. Essential for temporal agency and guilt/regret.  

  3. **Accommodating Gradual Value Drift**  
     - **Requirement**: The theory must allow agents to evolve priorities over time (e.g., career → family focus) without implying that prior values were "unfree" or alien.  
     - **Motivating Case**: A person who gradually abandons youthful idealism for pragmatism may partially endorse the shift without repudiating their past self.  
     - **Status**: **Non-negotiable**. Reflects real-life moral development.  

  4. **Accommodating Sudden Value Rupture**  
     - **Requirement**: The theory must treat radical changes (e.g., post-trauma personality shifts, religious conversion) as *compatible* with free will post-rupture, without demanding narrative perfection.  
     - **Motivating Case**: A veteran with PTSD whose values transform overnight retains post-trauma agency (e.g., new commitments) but may disown pre-trauma actions.  
     - **Status**: **Non-negotiable**. Avoids pathologizing autonomy-lite transformations.  

  5. **Distinction: Internal Compulsion vs. External Coercion**  
     - **Requirement**: The theory must differentiate unfreedom from *internal* forces (e.g., addiction) vs. *external* forces (e.g., blackmail).  
     - **Motivating Case**: An addict stealing drugs (compulsion) vs. a cashier robbed at gunpoint (coercion). Only the latter is fully excused in moral/legal practice.  
     - **Status**: **Non-negotiable**. Central to nuanced responsibility practices.  

  6. **Consistency with Post-Hoc Rationalization**  
     - **Requirement**: The theory must align with evidence that deliberation often rationalizes subconscious impulses, without reducing agency to illusion.  
     - **Motivating Case**: Libet-style experiments show neural activity precedes conscious choice, yet agents still *endorse* actions retroactively (e.g., "I chose because...").  
     - **Status**: **Non-negotiable**. Empirical adequacy is mandatory.  

  ---  
  ### **Partisan Commitments & Non-Negotiables**  
  - **Non-Negotiables**: Desiderata **1–6** are essential for moral psychology. They ensure the account handles real-world responsibility practices, psychological change, and empirical constraints.  
  - **Partisan Demand: Ultimate Origination**  
    - **Requirement**: Libertarian camps demand actions be *causa sui* (uncaused causes).  
    - **Status**: **Partisan and negotiable**. Moral psychology requires only *practical* sourcehood (e.g., control + reasons-responsiveness), not metaphysical self-creation. Rejecting origination avoids incompatibilist pitfalls.  

  ---  
  ### **Joint Satisfiability Assessment**  
  - **Potential Conflict**: Full **narrative coherence** (Desideratum 2) vs. **open-ended executive revision** (implied by Desiderata 3–4).  
    - **Problem**: If narrative coherence demands *seamless* self-endorsement across time, it clashes with radical revision (e.g., rupture disowns past selves).  
  - **Resolution**: **Satisfiable if coherence is "thin"**. Narrative unity need not imply *approval* of past values, only *minimal ownership* (e.g., "I did that, but I was different"). Sudden rupture resets the narrative without erasing agency post-change.  

  ---  
  ### **Evaluation of Standard Accounts**  
  1. **Compatibilism (e.g., Frankfurt, Fischer & Ravizza)**  
     - **Strengths**: Excels on **executive control (1)** and **internal/external distinction (5)** via reasons-responsiveness/hierarchical desires. Addresses **post-hoc rationalization (6)** by stressing agent's endorsement.  
     - **Weaknesses**: Struggles with **narrative coherence (2)** and **value drift/rupture (3–4)**. Treats radical change as alienation (e.g., Frankfurt's "wanton") rather than agency-compatible transformation.  

  2. **Hierarchical Accounts (e.g., Frankfurt, Dworkin)**  
     - **Strengths**: Clear on **distinguishing compulsion/coercion (5)** (e.g., higher-order volitions vs. external constraints). Handles **post-hoc rationalization (6)** if identification is retrospective.  
     - **Weaknesses**: **Value drift (3)** and **rupture (4)** threaten stability of higher-order desires. Narrative thinness risks reducing self to atomic moments of endorsement.  

  3. **Revisionist Accounts (e.g., Vargas, Nelkin)**  
     - **Strengths**: Best on **empirical consistency (6)** and **rejecting origination**. Accommodates **drift (3)** by naturalizing agency.  
     - **Weaknesses**: May underplay **narrative coherence (2)**, reducing autonomy to social practices. **Sudden rupture (4)** risks being treated as eroding agency if it disrupts norm-governed traits.  

  ---  
  ### **Synthesis**  
  An adequate theory must:  
  - **Prioritize control (1) + thin narrative (2)**: Actions need proximal sourcehood; selfhood requires ownership without diachronic uniformity.  
  - **Decouple autonomy from value-stasis**: Drift (3) and rupture (4) are features, not bugs, of dynamic agency.  
  - **Reject origination** as extraneous to moral psychology.  
  No extant theory fully satisfies all desiderata, but a *narrative-integrated compatibilism* (e.g., Schechtman-inspired) could unify executive control with minimal diachronic unity, treating rupture as narrative discontinuity rather than autonomy failure.
