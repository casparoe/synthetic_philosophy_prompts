prompt: |-
  hey, I'm a grad student in history writing my thesis chapter on 18th-century maritime insurance contracts, specifically how underwriters handled so-called "moral hazard" when captains lost cargo. I keep getting feedback that I'm judging these 1700s guys by modern risk-ethics without noticing — like calling a refusal to pay "unfair" when that concept barely maps onto their world. I'm taking a course on philosophy of history and I find the presentism stuff confusing in practice, not in theory. Can you help?

  Please act like you're both a professional historiographer and a philosophy-of-history consultant. Before you write the actual tool, do a quick brainstorm: think through the difference between descriptive anachronism (using modern terms) and this middle-zone thing I keep bumping into, which I guess I'll call "normative framing leakage" — where you don't use anachronistic words, but the way you organize causes and blame still makes modern values the hidden referee. I want you to turn all that into a reusable decision procedure I can run on every paragraph of my draft. Fix the role: I'm a junior researcher with a deadline tommorow, no libary access, and my advisor has to sign off.

  The deliverable should be a step-by-step checklist or flowchart in words: ordered questions I ask about each passage, what counts as passing, where it stops with "rewrite immediately," where it stops with "this is a values call, flag it for your advisor," and where it's genuinely unfixable. Make it handle hard cases — especially where describing a decision as "consistent with period norms" still smuggles in modern approval of those norms. Apply it to two worked examples: (1) describing a 1750s underwriter's refusal to pay a captain as "unfair risk-shifting onto sailors," and (2) describing the exact same refusal as "aligned with contemporary contractual expectations." One should come out clean and one should trip the alarm, but I want you to explicitly note the case where the procedure gives an answer I probably won't like. Be honest about what the procedure can't do. Write everything in American English, don't give me a bibliography or reading list — I can't search for books tonight — and please think carefully, maybe start with a short brainstorm list.
reasoning: |-
  Okay, let me approach this like a historiographer-philosophy consultant hybrid. The user is a stressed grad student with a tomorrow deadline, so I need to deliver immediate, actionable tools without academic fluff. 

  First, unpacking their core struggle: they're accidentally judging 18th-century insurance practices through modern ethical lenses, even when avoiding obviously anachronistic terms. That "normative framing leakage" is tricky - like when calling something "unfair" implicitly imports 21st-century workplace ethics into a mercantilist context. 

  Key distinctions to build the tool around:
  1) Descriptive anachronism (easy to spot: using terms like "CEO" or "risk-management strategy")
  2) Normative leakage (harder: e.g. framing period-typical actions as "exploitative" rather than "customary")
  3) The sneakiest trap: using historically accurate framing ("aligned with contemporary expectations") while subtly implying moral approval through tone or context.

  The procedure must flag when:
  - Modern moral judgments creep in (even without modern vocabulary)
  - Passive constructions obscure agency ("losses were absorbed by sailors" vs "underwriters contractually transferred losses to sailors")
  - Value-laden adjectives appear ("unfair", "unjust")
  - Cause/effect chains imply modern accountability standards

  For the examples: 
  "Unfair risk-shifting" clearly fails - "unfair" is a normative minefield. 
  "Aligned with contemporary expectations" seems clean but could still fail if surrounding text implies those expectations were morally legitimate rather than merely factual. 

  Biggest challenge: The tool can't eliminate all modern perspective (that's impossible), but it can make bias visible. I'll include a "values call" flag for cases where neutrality might misinterpret historical oppression - like when describing slavery-related contracts. Sometimes presentism is ethically unavoidable.

  Final structure: A 5-step interrogation per paragraph with clear exit points (pass/rewrite/flag). Emphasize that "rewrite" targets language, not analysis. Include examples of how to neutrally reframe judgments.
answer: |-
  Here's your emergency historiographer's toolkit – a step-by-step procedure designed for deadline triage. It targets **normative framing leakage** (your "hidden modern referee") while respecting practical constraints. The core principle: **Separate historical reconstruction from moral evaluation.**

  **Brainstorm Core Concepts (30-Second Version):**
  *   **Descriptive Anachronism:** Using terms/concepts *unavailable* to historical actors (e.g., "capitalism," "risk management strategy," "psychology").
  *   **Normative Framing Leakage:** Using *seemingly* neutral or period-language while structuring the narrative, assigning agency, or implying judgment based on *modern* values. This is your primary target.
  *   **The Trap:** Even phrases like "consistent with period norms" can imply *approval* if not handled carefully. The goal is *description*, not *endorsement* or *condemnation* based on *our* standards.
  *   **Unfixable?** Complete objectivity is impossible, but we minimize leakage. Some topics (e.g., slavery) inherently challenge neutrality; flag these for advisor discussion on *how* to frame.

  **The "Presentism Patrol" Procedure (Run on each analytical paragraph):**

  Ask these questions **in order**. Stop when you hit a "Rewrite" or "Flag."

  1.  **Word Scan: Are there explicit modern ethical/judgmental terms?**  
      *   *Scan for:* "Unfair," "unjust," "exploitative," "progressive," "backward," "should have," "immoral," "negligent" (in a *modern* legal/ethical sense), "rights," "responsible" (implying modern accountability).
      *   **Pass:** None found. Move to Q2.
      *   **Rewrite Immediately:** Found. Replace with descriptive, period-appropriate language focusing on actions, rules, and *contemporary* perceptions. (e.g., Replace "unfair" with "contrary to the policy terms as interpreted by the underwriter," or "deviating from common practice documented in..."). **STOP. Rewrite.**

  2.  **Agency & Blame Check: Who is the "villain" or "victim"? How is causation framed?**  
      *   *Ask:* Does my language subtly assign *moral* blame or innocence based on *modern* sensibilities? Am I framing one party (e.g., sailors) as inherently "wronged" by the system, implying they *deserved* modern protections? Am I framing the underwriter/captain as inherently "culpable" by modern standards?
      *   **Pass:** Causation is described based on documented actions, contractual clauses, period legal precedents, or contemporary debates *without* implying modern moral failure. (e.g., "The refusal stemmed from Clause X, commonly invoked in cases of Y, as per court records Z," or "Sailors, lacking formal contractual recourse under the prevailing doctrine of Z, often bore the loss").
      *   **Rewrite Immediately:** Language implies modern moral culpability/victimhood *without* anchoring it firmly in period-specific norms, debates, or legal realities. (e.g., "The sailors were unfairly saddled with the loss"). Focus on *how* it happened (mechanisms, rules, power dynamics) not *whether* it was "right" by our lights. **STOP. Rewrite.**
      *   **Flag for Advisor:** The paragraph deals with actions widely condemned *today* (e.g., related to slavery, extreme brutality) where purely "descriptive" language might feel insufficient or misleading. Needs advisor input on framing balance. **STOP. Flag.**

  3.  **"Consistent With Norms" Trap: Does stating alignment imply endorsement?**  
      *   *Ask:* Have I used phrases like "consistent with period norms," "standard practice," "legally permissible," or "aligned with expectations"? Does the *surrounding context* or *tone* subtly suggest this makes the action *reasonable* or *acceptable* by *my* (modern) standards?
      *   **Pass:** The alignment is stated neutrally as a *fact* explaining *why* the action was taken or accepted *then*, with no hint of modern approval. (e.g., "The refusal, while harsh by modern standards, aligned with prevailing interpretations of 'barratry' clauses and the high burden of proof placed on captains in the 1750s").
      *   **Rewrite Immediately:** The statement of alignment feels like a *justification* rather than an explanation. (e.g., "The refusal was aligned with contemporary contractual expectations, *showing a pragmatic approach to risk*"). Remove any evaluative adjectives/adverbs attached to the norm itself ("pragmatic," "necessary," "understandably"). **STOP. Rewrite.**
      *   **Flag for Advisor:** You need to *contrast* period norms with modern ethics *explicitly* as part of your argument, but worry the contrast itself introduces bias. **STOP. Flag.**

  4.  **Modern Analogy Alert: Am I implicitly comparing this to a modern institution/standard?**  
      *   *Ask:* Is my description structured in a way that only makes sense if the reader assumes a modern baseline (e.g., modern insurance law, labor rights, corporate responsibility)? Does it *rely* on the reader finding it "shocking" or "backward"?
      *   **Pass:** The system is explained on its *own* terms using period sources (contracts, court cases, merchant manuals, correspondence) to define concepts like "moral hazard," "perils of the sea," "proof," "average," etc.
      *   **Rewrite Immediately:** The explanation assumes the reader shares modern expectations and highlights deviations *as* deviations, rather than explaining the period's internal logic. (e.g., "Unlike modern insurers who prioritize claimant fairness, 18th-century underwriters focused solely on..."). Rephrase to explain the *18th-century* focus *first* without the modern comparator as the starting point. **STOP. Rewrite.**

  5.  **The Values Call (Final Check): Does this paragraph *require* a normative judgment for my argument?**  
      *   *Ask:* Is my thesis *about* the evolution of ethics, or *critiquing* these practices? If not, does the paragraph *feel* like it's pushing a moral view, even subtly?
      *   **Pass:** The paragraph is purely reconstructive, explaining historical actions, motivations, and systems based on evidence. Any implied "critique" comes purely from contrasting *period* debates (e.g., "Contemporaries like X criticized this practice as Y, arguing Z").
      *   **Flag for Advisor:** Your thesis *explicitly* involves ethical evaluation across time, or the subject matter (e.g., profound human suffering caused by standard practices) makes purely descriptive framing feel academically or ethically inadequate. **STOP. Flag.**
      *   **Genuinely Unfixable?** If you cannot describe the core mechanics without language that *feels* inherently judgmental *to you* (even after rewrites), and it's not core to your ethical-evolution argument. This is **rare**; usually, Q1-4 catches it. **Solution:** Cut the paragraph or drastically simplify to bare documented facts. Consult advisor ASAP.

  **Applying the Procedure to Your Examples:**

  1.  **Example: "This constituted unfair risk-shifting onto the sailors."**
      *   Q1: **"Unfair"** - **REWRITE IMMEDIATELY.** (Stop). This is explicit normative language from a modern perspective. *Rewrite Suggestion:* "This resulted in the financial loss being borne ultimately by the sailors, as per the common application of Clause X and the sailors' lack of formal recourse under prevailing maritime law."

  2.  **Example: "The underwriter's refusal was aligned with contemporary contractual expectations."**
      *   Q1: Pass (No explicit modern judgment words).
      *   Q2: Pass (No clear villain/victim framing based on modern morals).
      *   **Q3: "Consistent With Norms" Trap - CHECK CAREFULLY.** *Passes ONLY IF:* The surrounding text is purely descriptive (e.g., "...aligned with contemporary contractual expectations regarding proof of loss due to captain's error, as defined in common policies like Lloyd's Form Z"). *Trips Alarm (Rewrite Immediately) IF:* The surrounding text implies this alignment makes it *right* or *reasonable* (e.g., "...aligned with contemporary contractual expectations, *demonstrating a commercially sensible approach*"). The phrase itself is *potentially* okay, but **Q3 is its critical vulnerability.** Assume it passes **only** in a strictly neutral descriptive context. *(This is the answer you might not like - the phrase is high-risk for leakage and needs careful contextual isolation).*

  **What This Procedure Can't Do:**
  *   Guarantee perfect objectivity (impossible).
  *   Write your thesis for you.
  *   Resolve deep philosophical debates about historical empathy or the ethics of studying oppression. It flags those for advisor discussion.
  *   Replace deep contextual knowledge – it helps avoid leakage but doesn't provide the correct historical context itself.

  **How to Use Tonight:**
  1.  Print this procedure.
  2.  Take your draft, paragraph by paragraph.
  3.  Run each analytical paragraph (not pure description of sources or simple narrative) through Q1-Q5 **in order**.
  4.  **Rewrite immediately** when flagged. Be ruthless - focus on *actions, rules, mechanisms, contemporary terms and debates*.
  5.  **Flag** paragraphs where you feel stuck or dealing with ethically charged norms. Add a brief note *why* (e.g., "Q3 - Worry 'standard practice' implies endorsement," or "Q5 - Describing enslaved cargo insurance feels inadequate neutrally").
  6.  Give the flagged list and your rewritten draft to your advisor tomorrow. Explain you focused on minimizing normative framing leakage per their feedback and flagged areas needing their guidance.

  This forces you to consciously interrogate every judgment call and provides your advisor with clear points for discussion, showing you've grappled seriously with the presentism critique. Good luck!
