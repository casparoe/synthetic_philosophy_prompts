prompt: |-
  So I'm trying to work out where to direct my energy if I'm writing a long-form piece on whether guilt or shame is the better moral emotion, and whether a culture can actualy choose which one dominates. There's the usual restorative-justice versus retributive framing, but I've also been playing with this distinction between 'reparative shame' — where the feeling is tied to a specific act you can mend — and 'status guilt', where you just feel you've permanently lost moral standing. Anyway, if you were advising someone with about a year of research time, which three open questions or lines of work in this space should I prioritise for figuring out whether cultures can engineer that shift? I don't want a bibliography or citation list, just a defended agenda: rank them, say what's upstream of what, which ones philosophers can tackle without running empirical studies, and what kind of evedence over the next few years would make you reorder them. Please write in British English.
reasoning: |-
  Okay, the user is asking for advice on structuring a long-form piece about guilt versus shame as moral emotions. They specifically want to know which three open questions to prioritize when examining whether cultures can intentionally shift between these emotions. They've mentioned concepts like "reparative shame" and "status guilt," so they're already thinking critically beyond basic definitions.

  Hmm, the user seems quite sophisticated - they're familiar with restorative vs retributive justice frameworks and are developing their own nuanced terminology. That suggests they need equally sophisticated guidance. They're asking for a ranked research agenda with clear dependencies, not just a literature review. Interesting they emphasize not wanting citations but rather a "defended agenda" - this feels like someone who's done preliminary reading and now wants strategic direction.

  The core puzzle is whether cultures can deliberately engineer emotional dominance. That's ambitious! I should focus on questions where philosophical analysis can drive progress without requiring new empirical studies, while flagging where evidence might later change priorities. The British English request makes me think they might be UK-based or targeting that audience.

  Right, first I need to identify the most foundational question. The "translatability" issue seems primary - if guilt/shame aren't culturally interchangeable, engineering shifts becomes impossible. That's where philosophers can contribute most immediately through conceptual mapping. Then we'd need to examine existing cultural shifts to see if precedents exist - historians could help here. Finally, the mechanisms question about how change happens would be most actionable but requires more empirical input.

  The user's distinction between reparative shame and status guilt is clever - it reframes the debate by focusing on actionability versus permanence. That should inform all three lines of inquiry. I'll emphasize how each question builds on the last: first establish possibility, then precedents, then methods. And I'll note what evidence could reshuffle priorities - like new anthropology studies challenging translatability, or psychology findings about emotion malleability.

  This is a meaty challenge. The user clearly wants rigor but also practical research guidance. I'll structure it as a clear ranking with justifications, keeping the tone analytical but accessible. The British English requirement means I'll use "prioritise" and "tackle" rather than American spellings, and perhaps some UK academic phrasing conventions.
answer: |-
  Right, your core question – **can cultures deliberately engineer a shift in dominance between guilt and shame, and which is 'better'?** – is profound and underexplored. Your "reparative shame" vs. "status guilt" distinction is a sharp lens. With a year, you need to prioritise questions that unlock *feasibility* and *desirability* of cultural engineering. Here’s a defended ranking, considering upstream dependencies and where philosophy can bite:

  **Ranked Research Agenda:**

  1.  **The Translatability & Functional Equivalence Question:**
      *   **Core Question:** *Can the specific moral functions currently served by the dominant emotion (e.g., norm enforcement, motivation for repair, social cohesion) within a given culture be effectively fulfilled by the 'target' emotion without significant loss or perverse consequences?*
      *   **Why #1 (Upstream):** This is the absolute bedrock. If guilt and shame are fundamentally *incommensurable* in their core functions within specific cultural contexts (e.g., can "status guilt" truly motivate the same level of communal reintegration as "reparative shame" in a collectivist setting?), *or* if attempts to shift cause key moral/social functions to collapse, then deliberate engineering is likely impossible or catastrophically destabilising. You *must* establish this possibility *before* investigating mechanisms.
      *   **Philosopher's Role (High):** This is prime territory for conceptual analysis *informed* by anthropology/sociology. Philosophers can:
          *   Rigorously define the *functional roles* (e.g., specific norm internalisation, specific types of behavioural motivation, specific paths to restoration) expected of each emotion within a moral system.
          *   Analyse whether "reparative shame" and "status guilt" (or other variants) *logically possess* the capacities to fulfil each other's roles. Does guilt *feel* like it can address the *kind* of social rupture shame typically marks? Can shame reliably motivate the *kind* of specific, individualised repair guilt prompts?
          *   Examine potential "translation losses" – what gets lost if you try to swap dominance? (e.g., Does emphasising guilt erode collective responsibility? Does emphasising shame undermine individual agency?).
          *   Critique existing claims of equivalence in the literature.

  2.  **The Historical Precedent & Feasibility Question:**
      *   **Core Question:** *Is there credible evidence that dominant moral emotional frameworks have *deliberately* shifted between guilt/shade dominance in the past, and what were the catalysts, mechanisms, and consequences (intended and unintended)?*
      *   **Why #2:** If Question #1 suggests translatability *is* possible in principle, we then need evidence that such shifts *have* occurred, *and* crucially, whether they were truly *engineered* (via law, education, religion, media) or merely unintended byproducts of other changes (e.g., urbanisation, technological change, economic shifts). This provides the proof-of-concept for cultural engineering. Without historical precedent, claims of feasibility are purely speculative.
      *   **Philosopher's Role (Medium-High, collaborative):** Philosophers can:
          *   Work *with* historians, anthropologists, and sociologists to *define* what constitutes credible evidence of a *deliberate* shift in emotional dominance (beyond just changes in discourse). What markers would we look for?
          *   Analyse the *stated justifications* and *moral arguments* used by historical agents attempting such shifts (e.g., religious reformers, legal codifiers, revolutionary movements). Did they explicitly frame it in terms of preferring one emotion's moral outcomes?
          *   Critically evaluate historical claims about the *success* and *consequences* of such shifts. Were the intended moral benefits realised? What unforeseen costs emerged (e.g., rising anxiety, social fragmentation, new forms of hypocrisy)? Your "reparative shame" vs. "status guilt" distinction is key here – did attempts inadvertently create harmful variants?
          *   Assess whether historical shifts support or challenge the functional equivalence identified in Question #1.

  3.  **The Mechanism & Scalability Question:**
      *   **Core Question:** *Through what specific, scalable cultural levers (legal systems, educational curricula, media narratives, religious practices, institutional design) *could* a society most effectively and stably cultivate the desired moral emotional dominance, and how resilient would this shift be against countervailing forces?*
      *   **Why #3:** This is downstream and depends on positive answers to #1 and #2. If shifts *are* possible and *have* happened (deliberately or not), *then* we can productively ask *how* to do it intentionally and robustly. Focusing here prematurely is putting the cart before the horse if the foundational feasibility isn't established.
      *   **Philosopher's Role (Medium, highly collaborative):** Philosophers can:
          *   Analyse the *normative implications* and potential ethical pitfalls of specific proposed levers (e.g., Is using state education to cultivate specific moral emotions overly manipulative? Does a legal shift towards restorative justice inherently privilege shame-like processes over guilt?).
          *   Conceptualise the *interdependencies* between different levers. Does changing law *require* concomitant changes in education or media to be effective?
          *   Identify potential points of *resistance* or *perversion* within cultural systems. How might existing power structures co-opt or distort the attempted shift? Could promoting "reparative shame" unintentionally reinforce "status guilt"?
          *   Develop conceptual frameworks for evaluating the *stability* and *resilience* of an engineered emotional framework. What makes it stick?

  **What Evidence Would Change This Ordering?**

  *   **Challenging Translatability (#1):** Strong anthropological/psychological evidence demonstrating *irreducible* functional gaps – e.g., showing cultures where attempts to introduce guilt-based norms to replace shame *consistently* fail to produce equivalent motivation for repair or social cohesion, or vice-versa. This could elevate #1 further or even make #2/#3 moot. Conversely, compelling cross-cultural evidence showing *perfect* functional substitution in key domains might slightly *demote* #1, making mechanisms (#3) more immediately relevant.
  *   **Clear Historical Precedents (#2):** The discovery of well-documented, unambiguous historical cases where a society *deliberately* and *successfully* engineered such a shift (e.g., through a specific legal/educational reform package with documented intent and outcome) would significantly boost #2's importance. It would provide concrete models for #3. Conversely, if deep historical analysis *consistently* shows shifts are *only* accidental byproducts of massive upheaval, it would make engineering seem far less feasible, potentially strengthening the need to resolve #1 conclusively before even considering #3.
  *   **Breakthroughs in Emotion Cultivation (#3):** Unexpected empirical findings from psychology/sociology identifying highly effective, non-coercive methods for reliably shifting moral emotional responses at scale *could* make #3 jump the queue, but *only* if #1 and #2 haven't already ruled out the core feasibility. For example, robust evidence showing specific educational interventions reliably shift individuals from "status guilt" towards "reparative shame" responses *without* negative side-effects would be highly relevant to #3's priority.

  **In short:** Start by rigorously testing the *possibility* of functional substitution across cultures (Philosophers lead). Then, scour history for proof-of-concept and lessons on *feasibility* (Philosophers collaborate). Finally, *only if* the path seems clear, delve into the practical *how* of engineering the shift, mindful of the ethics and stability (Philosophers guide norms and critique). Your "reparative shame" vs. "status guilt" distinction should be the scalpel you use throughout to dissect these questions. Good luck!
