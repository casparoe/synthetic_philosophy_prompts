answer: |-
  Below is a diagnostic quiz designed to reveal a respondent's underlying theory of voting behavior through concrete cases. The questions avoid labels and focus on behavioral choices, with the scoring key mapping answers to one of six core theories. The branching logic prioritizes three dimensions:  
  - **Source of value**: Outcome (instrumental) vs. act itself (intrinsic).  
  - **If instrumental**: Scope of welfare (self vs. altruistic/ethical) and pivotality assessment (accurate vs. overconfident).  
  - **If intrinsic**: Benefit type (expression, duty, or enjoyment).  

  Theories mapped to the branching tree:  
  1. **Pure self-interested instrumental (SII)**: Values only personal outcome; accurate pivotality assessment.  
  2. **Altruistic/ethical instrumental (AI)**: Values societal outcome; accepts tiny pivotality.  
  3. **Expressive voting (E)**: Values the act of expressing identity/values.  
  4. **Civic-duty view (D)**: Values fulfilling moral obligation.  
  5. **Consumption/entertainment view (C)**: Values enjoyment of voting.  
  6. **Overconfidence/misprediction (O)**: Overestimates pivotality (usually self-interested).  

  ---

  ### **Quiz: Why Do You Vote?**  
  *For each scenario, pick the answer closest to your gut reaction.*  

  1. **Safe-seat election**: Your preferred candidate is certain to win your district by a landslide. Voting requires 30 minutes. Do you vote?  
     (A) Yes, I want to add my voice to their support.  
     (B) Yes, it’s my responsibility as a citizen.  
     (C) No, my vote won’t affect the outcome.  

  2. **Non-binding referendum**: A ballot measure you care about is advisory (government may ignore it). Do you vote?  
     (A) Yes, I want my opinion recorded.  
     (B) Yes, it’s important to weigh in officially.  
     (C) No, it won’t change policy.  

  3. **Paying to vote**: To vote, you must pay a $20 fee (a meaningful cost to you). Do you pay and vote?  
     (A) Yes, expressing my views is worth $20.  
     (B) Yes, I’d pay to do my civic duty.  
     (C) No, the cost outweighs the tiny chance of mattering.  

  4. **Secret ballot**: No one can ever verify if you voted. Do you vote?  
     (A) Yes, I still want to state my choice.  
     (B) Yes, voting is the right thing to do privately.  
     (C) No, no one will know, and it won’t change anything.  

  5. **Costly win**: Your preferred candidate’s victory would help 1 million strangers but cost *you* $100. Do you vote for them?  
     (A) Yes, the net benefit to society justifies it.  
     (B) Yes, I vote my conscience regardless of personal cost.  
     (C) No, I’d pay $100 for near-zero impact.  

  6. **Symbolic election**: A "mock" election with no real-world impact is held (e.g., student council at a defunct school). Do you participate?  
     (A) Yes, it’s fun to pick a side.  
     (B) Yes, even symbolic votes deserve participation.  
     (C) No, it’s meaningless.  

  7. **Time trade-off**: Voting takes 30 minutes. You could instead watch a mildly enjoyable TV show. Do you vote?  
     (A) Yes, I enjoy the voting process.  
     (B) Yes, skipping feels like neglecting a duty.  
     (C) No, I’d rather watch TV.  

  8. **Pivotality assessment**: In a typical presidential election, your state is moderately competitive. How likely is it that *your* vote decides the outcome?  
     (A) Near-zero (e.g., < 1 in 10 million).  
     (B) Very low but possible (e.g., ~1 in 100,000).  
     (C) Noticeably possible (e.g., > 1 in 10,000).  

  ---

  ### **Scoring Key**  
  Tally your answers and match the pattern to a theory:  

  - **Pure self-interested instrumental (SII)**:  
    **Answers**: 1C, 2C, 3C, 4C, 5C, 6C, 7C, 8A.  
    *Most awkward commitment*: You must accept that voting is irrational in mass elections, making widespread turnout puzzling.  

  - **Altruistic/ethical instrumental (AI)**:  
    **Answers**: 1C, 2C, 3C, 4C, 5A, 6C, 7C, 8A.  
    *Most awkward commitment*: You must defend that tiny pivotality probabilities justify voting due to enormous aggregate stakes.  

  - **Expressive voting (E)**:  
    **Answers**: 1A, 2A, 3A, 4A, 5B, 6A, 7A, 8*A (any response).  
    *Most awkward commitment*: Voting expresses identity even if it causes net harm (e.g., Question 5).  

  - **Civic-duty view (D)**:  
    **Answers**: 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8*A (any response).  
    *Most awkward commitment*: Duty compels voting even if the act has negative consequences (e.g., encouraging harmful policies).  

  - **Consumption/entertainment view (C)**:  
    **Answers**: 1A, 2A, 3A, 4A, 5B, 6A, 7A, 8A/B/C.  
    *Most awkward commitment*: Voting is entertainment, so you’d participate in meaningless elections (e.g., Question 6).  

  - **Overconfidence/misprediction (O)**:  
    **Answers**: 1C, 2C, 3C, 4C, 5C, 6C, 7C, 8B/C.  
    *Most awkward commitment*: You overestimate your vote’s decisiveness while rejecting intrinsic/altruistic reasons to vote.  

  \* *Overconfidence (O) and expressive (E) can have any pivotality answer (8), but O rejects intrinsic/altruistic motives (all Cs in Questions 1–7 except high pivotality in 8), while E embraces expressive motives (As).*  

  ---

  ### **Design Notes**  
  1. **Unseparated pair**: **Duty (D)** and **altruistic instrumental (AI)** cannot be cleanly split by this quiz. Both vote in high-stakes cases (e.g., Question 5B for D, 5A for AI), but D votes in symbolic/low-impact cases (e.g., Questions 2B, 6B) while AI does not (2C, 6C). A question forcing a choice between duty and outcome focus (e.g., *“Would you vote if it slightly reduced societal welfare?”*) was omitted to avoid artificial extremity.  
  2. **Empty combination**: Answers [1A, 2C, 3A, 4C, 5A, 6A, 7C, 8A] are unattractive/unexplored. One cannot coherently value expression (1A, 3A, 6A) but reject it when secret (4C) or binding (2C).  
  3. **Why cases were chosen**:  
     - Safe seat (1) and non-binding referendum (2) test pivotality-dependence.  
     - Voting fee (3) and time trade-off (7) measure cost tolerance.  
     - Secret ballot (4) isolates intrinsic value.  
     - Costly win (5) separates self-interest from altruism/duty.  
     - Symbolic election (6) distinguishes fun/duty from outcome focus.  
     - Pivotality (8) identifies overconfidence.  

  This quiz forces respondents to reveal preferences through trade-offs, avoiding label-based self-reporting. Use it to spark debate on rationality, ethics, and human inconsistency!
