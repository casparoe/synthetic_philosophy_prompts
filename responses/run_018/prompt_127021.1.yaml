answer: |-
  Alright, let's do this. [Clears throat, adjusts mic slightly, leans in casually]

  Good morning everyone, and a huge welcome! Seriously, thank you for rolling out of bed for "Prices, Planning, and Prediction." Now, I see a few faces that could frankly teach *me* chapters of the socialist calculation debate before coffee... and I also see some folks who might be thinking, "Prices? Planning? Just point me to the snacks!" [Warm smile] Trust me, both perspectives are essential today.

  Because **here's the core of what we're digging into:** That massive, foundational debate – Hayek and Mises shouting "Prices or bust!" versus Lange and Taylor saying "Nah, we can plan this centrally!" – it wasn't just about economics. It was fundamentally wrestling with **two kinds of knowledge.**

  On one side, Hayek championed **tacit knowledge:** The messy, intuitive, context-specific stuff. The baker knowing *exactly* when the dough is ready, the farmer sensing the soil, the trader gauging the mood of the market. Dispersed, personal, hard to write down. Hayek said only prices, moving freely, could aggregate and communicate this invisible know-how efficiently. Trying to centralize *this* knowledge? Impossible folly.

  On the other side, Lange argued for **explicit, processable data:** Give us the numbers! Resource stocks, production targets, consumer preferences. He imagined central planners using "trial and error" with simulated prices, crunching this data, to achieve rational allocation *without* needing chaotic markets. He believed the *essential* information could be formalized, captured, and calculated.

  **Here's the fascinating thing:** Both sides kinda *assumed* this stark split – the intuitive, uncodifiable stuff vs. the cold, hard numbers. They saw it as an either/or. But they didn't really *name* this deep knowledge divide as the core battlefield; it was just the terrain they fought on.

  **So, what's settled?** Well, history delivered a pretty clear verdict: Pure central planning, trying to gather *all* that dispersed, tacit knowledge and process it explicitly without a genuine price mechanism? It crashed. Hard. Hayek's core insight about the indispensability of prices for coordinating *that* kind of knowledge stands tall. We know that much.

  **But here's where it gets wild, and why we're here today:** Enter the age of machine learning and massive data. Suddenly, that clean split Hayek and Lange assumed starts to **blur.** Algorithms aren't just crunching explicit numbers anymore. They're *learning* patterns, spotting correlations in oceans of data – patterns that feel almost... intuitive? Predictive models are starting to *anticipate* things that look suspiciously like the baker's know-how or the trader's gut feeling, but derived from data processing on a scale Lange could only dream of.

  **So, the genuinely open, live-wire questions we're tackling in this workshop are huge:**
  1.  **What *is* this new beast?** When algorithms predict demand, optimize supply chains, or even suggest resource allocation based on patterns learned from vast datasets... is that still "planning" in Lange's sense? Or is it something fundamentally different?
  2.  **Does it bypass Hayek's critique?** Can these predictive, learning systems actually capture and coordinate aspects of that "tacit knowledge" *without* needing the constant churn of market prices? Or are they just sophisticated tools *for* markets using prices?
  3.  **Where does the price mechanism fit now?** Is it still the irreplaceable conductor, or is it becoming just one instrument in a much larger, algorithmic orchestra?

  We won't settle these today – that's what the brilliant sessions ahead are for. But we *will* frame them squarely within that old clash, using the knowledge split Hayek and Lange implicitly defined but never fully articulated. We'll map the settled ground – the undeniable triumph of the price mechanism for coordinating dispersed, local knowledge – and then plunge into the genuinely contested frontiers opened up by algorithmic prediction.

  So, whether you’re here to dissect Hayek’s footnotes or just for the excellent coffee... buckle up. We're taking a century-old intellectual brawl and seeing what happens when we throw 21st-century tech into the ring. Let's have a great workshop.

  [Glances at watch] Okay, four minutes on the nose. Let's get started properly... [Moves to introduce first speaker/session]
