          Given time, we can do the common posterior as a class.

          Core design principle: Use sequential revelation of aggregate reports and calibration choices to create common knowledge of information, leading to agreement, then break common knowledge of rationality to induce disagreement.

          One-sentence summary: "The core design principle is to force convergence through public aggregation of private signals and then break it by secretly violating common knowledge of rationality."

          Let's write the rules:

            Title: The Agreement Squeeze

            Materials:
              - Worksheets for each round (with spaces for calibration decision, signal, report, and for recording the public history)
              - Calculator (optional, or we do the common posterior together)
              - A coin to determine S (or the instructor can pre-determine it secretly)

            Rules:

              The hidden state S is either 0 or 1, determined by a fair coin flip at the beginning.

              Players start with 100 points.

              There are 3 rounds. In each round:

                Step 1: Calibration decision. 
                    Each player decides whether to calibrate in this round. Calibrating costs 20 points but improves the accuracy of their signal to 0.9. Not calibrating costs 0 points and has accuracy 0.6.

                Step 2: Signal generation. 
                    The instructor (or a random process) generates a binary signal (H or L) for each player:
                      - If S=1: 
                           H with probability (accuracy), L with probability (1-accuracy)
                      - If S=0:
                           L with probability (accuracy), H with probability (1-accuracy)

                Step 3: Reporting (except for the special player in round 3).
                    Each player computes their posterior probability that S=1, based on:
                      - The entire history of public information (from previous rounds: the counts of calibration and reports)
                      - Their own private signal in this round and their own calibration choice in this round.
                    They report this posterior as a number between 0 and 1.

                    In round 3, one randomly chosen player (secretly selected by the instructor) is instructed to:
                      - Not calibrate (to save 20 points)
                      - Ignore their signal
                      - Report exactly 0.5

                Step 4: Public revelation.
                    The instructor reveals to everyone:
                      a) The number of players who calibrated in this round.
                      b) The list of reports (without identities).

                    Players record this public information.

                Step 5: Scoring preparation.
                    Players note that at the end of the game, they will be scored for each round:
                      - For each round, they get 100 * [1 - (S - q_i)^2] for that round, where q_i is the report they submitted in that round.
                      - They lose 20 points for each calibration in that round.

                      Note: The special player in round 3 still gets the score for reporting 0.5.

              After round 3, the state S is revealed and scores are computed.

            Debrief:

              Map to Aumann:
                - Common prior: yes, at the beginning everyone knows the prior P(S=1)=0.5 and the signal distributions and the game rules.
                - Common knowledge of rationality: in round 1 and 2, we assume everyone is rational and updates correctly. In round 3, we break this for one player.
                - Disagreement point: in round 1, players disagree (have different reports). In round 2, when they report, they might still have different reports because they have different new signals? But after seeing the round 2 reports, they will all have the same belief. So at the end of round 2, they agree on the posterior? Actually, the reports in round 2 might differ because they have different signals, but then after the public revelation, they will all converge to the same belief for round 3.

              What the game can't reproduce: the infinite hierarchy of beliefs. We avoid that by public revelation of the reports and calibration choices, which makes the information common knowledge.

              What breaks the first time: 
                - The computation of the common posterior might be time-consuming and error-prone.
                - Players might not understand how to update in round 2 and 3.

            Therefore, we suggest:

              - Provide a worksheet with the formula for the common posterior after a round.
              - Do the first common posterior together as a class.

          Core design principle: "The core design principle is to achieve agreement through public aggregation of private information and then break it by injecting a violation of common knowledge of rationality."
