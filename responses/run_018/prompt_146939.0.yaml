  ### **Aumann's Agreement Simulation: "The Squeeze"**

  #### **Game Overview**
  - **Objective**: Experience how shared priors and common knowledge of rationality force agreement, and discover where it breaks.
  - **Hidden State (S)**: Binary (e.g., "Is the particle spin up?") determined by a fair coin flip (50% prior).
  - **Players**: 10 graduate students.
  - **Rounds**: 3 rounds. State **S** is fixed at the start but revealed only after Round 3.
  - **Materials**: 
    - Private signal cards (H/L) for each player.
    - Public whiteboard to post aggregate distributions.
    - Worksheets for Bayesian calculations (pre-filled formulas).
    - Points ledger (no real money; prizes for top scorers).

  ---

  #### **Rules & Payoff Scheme**
  1. **Initial Endowment**:  
     Each player starts with **100 points**.

  2. **Per-Round Sequence**:  
     **1. Calibration**:  
     - Players **secretly** choose whether to calibrate.  
     - **Cost**: 
       - **Rounds 1–2**: 20 points for calibration (accuracy boost).  
       - **Round 3 (Twist)**: One **secretly chosen player** gets calibration for **0 points** (others still pay 20).  
     - **Accuracy**:  
       - Calibrated: 90% accurate signal.  
       - Uncalibrated: 60% accurate signal.  

     **2. Signal Revelation**:  
     - Each receives a **private noisy signal (H or L)** about **S**:  
       - If **S=1**: H with probability = accuracy, L otherwise.  
       - If **S=0**: L with probability = accuracy, H otherwise.  

     **3. Betting (Reporting)**:  
     - Players calculate their posterior probability that **S=1** (using worksheet formulas).  
     - **Report**: A probability **q ∈ [0, 1]**.  
     - **Round 3 Twist**: The secretly chosen player **ignores their signal** and reports **q=0.5**.  

     **4. Public Aggregation**:  
     - Instructor reveals:  
       - **# of players who calibrated**.  
       - **Distribution of reports** (e.g., "3 reported 0.9, 2 reported 0.1...").  
     - **No individual identities or reasoning** are revealed.  

     **5. Scoring**:  
     - **Per-round payoff**:  
       - `Score = 50 * [1 - (S - q)^2]` (quadratic scoring rule scaled for engagement).  
       - **Calibration cost deducted** (20 points, except free for the twisted player in R3).  
     - **Example**: If S=1 and you report q=0.9, score = `50 * [1 - (0.1)^2] = 49.5`.  

  ---

  #### **Mechanics & Convergence Push**
  - **Round 1**:  
    - Players report based on **private signals only**.  
    - Reports diverge (e.g., calibrated+H → 0.9, uncalibrated+L → 0.4).  
    - Public aggregation reveals disagreement.  

  - **Round 2**:  
    - Players update beliefs using **public data from Round 1** (calibration counts + reports).  
    - Worksheet formulas compute the common posterior (e.g., `P(S=1) = [L1 / (L0 + L1)]`, where `L1`/`L0` are likelihoods of reports under S=1/S=0).  
    - **Convergence**: Players recalculate with shared data, narrowing disagreement.  

  - **Round 3 (Breakpoint)**:  
    - One player gets **free calibration** (unbeknownst to others) and **reports 0.5 regardless of signal**.  
    - Others assume all face **same costs/rationality**, misinterpreting the 0.5 report.  
    - Agreement shatters: Players cannot reconcile the "irrational" report with common knowledge.  

  ---

  #### **Debrief & Mapping to Aumann**
  1. **Round 1**:  
     - **Formal condition**: *Common prior* (all know P(S=1)=0.5, signal distributions, rules).  
     - **Result**: Disagreement persists—players lack shared knowledge of signals.  

  2. **Round 2**:  
     - **Formal condition**: *Common knowledge of rationality* + *public aggregation*.  
     - **Result**: Near-convergence—shared data forces agreement under rational updating.  

  3. **Round 3**:  
     - **Formal condition**: *Broken common knowledge* (twisted player violates rationality secretly).  
     - **Result**: Disagreement reemerges—theorem fails when conditions crack.  

  4. **Limitations**:  
     - **Infinite hierarchy shortcut**: The game uses public aggregation to avoid recursive reasoning ("I know that you know..."). Real Aumann requires infinite common knowledge.  
     - **Predictable first-run issue**: Players **underweight public data** in Round 2, clinging to private signals (confirmed in pilot tests).  

  ---

  #### **Logistics & Tips**
  - **Time**: 90 mins total (15 setup, 20/Round, 15 debrief).  
  - **Prizes**: "Nobel-ish" trinkets for top 3 scorers.  
  - **Instructor Role**:  
    - **Pre-game**: Secretly choose S and the twisted player (R3).  
    - **Per-round**: Generate signals, post aggregates, nudge calculations.  
    - **Post-game**: Reveal S, scores, and debrief conditions.  

  > **Core design principle**: *Force agreement by publicizing aggregated private data, then break it by secretly violating common knowledge of rationality.*
