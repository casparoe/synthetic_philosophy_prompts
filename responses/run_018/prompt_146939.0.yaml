            L0 = (0.4)^4 * (0.6)^3 * (0.1)^2 * (0.9)^1

            Then P1 = L1 / (L1+L0)

          We can ask them to compute that.

          In round 2, they use P1 as the prior.

          Then in round 2, a player who calibrates and sees H would report:

            P(S=1 | H) = [0.9 * P1] / [0.9*P1 + 0.1*(1-P1)]

          And similarly.

          In round 3, we secretly choose one player and instruct them to report 0.5 and to not calibrate (to save points) and to ignore their signal.

          Then in round 3, when we reveal the reports, there will be a report of 0.5. The other players, not knowing about the twist, will try to interpret it. They may realize that there is a report that doesn't fit. They might not know how to update.

          We can ask them to update anyway? And then see that agreement breaks.

          But note: the common knowledge of rationality is broken, so the theorem doesn't apply.

          Debrief:

            Round 1: common prior and common knowledge of rationality. They report and see the distribution. They don't agree yet.

            Round 2: they have common knowledge of the round 1 reports and the calibration choices. Now they can compute the common posterior and then update with their new private signal. Then they report. Then after revealing round 2 reports, they can compute a new common posterior. They should all have the same belief? Actually, after seeing the round 2 reports, they will all have the same belief again.

            But note: in round 2, after they get their private signal, they have different information? Then they report. Then they see the reports and update to a common belief.

            Round 3: we break common knowledge of rationality (one player is not rational). Then the reports are not interpretable under the common prior and common knowledge of rationality. Therefore, they may not agree.

          The infinite belief hierarchy: the game does not require infinite levels of reasoning because we reveal the reports and calibration choices, so they don't have to reason about what others believe about their beliefs, etc.

          What predictably breaks the first time? 
            - The Bayesian updating might be too hard for some? They might make mistakes in the computation.
            - The scoring rule might not be well understood.

