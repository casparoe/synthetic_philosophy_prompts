prompt: |-
  I'm working on a piece about moral deference—whether it's ever okay to just take someone else's word on a moral question instead of working it out yourself—and I've been interviewing a philosopher who's gave me verdicts on a pile of cases. So far she's said: a surgeon who defers to a hospital ethicist about whether to intubate an unconscious patient over the family's objection is doing fine; someone who becomes a pacifist over winter break purely because a famous moral philosopher says pacifism is required is doing something wrong; a manager who stops using a phrase after his staff tell him it's demeaning without really understanding why is doing exactly right; a voter who supports a ballot measure because leading ethicists say it's the right one is misplacing their trust; and a wiped-out family in the ICU who withdraw a ventilator because the palliative care team says it's the morally right call are okay.

  Next time I see her I want to put this case to her: an NGO worker in an unfamiliar country has an afternoon to decide whether to distribute food in a way that violates a local custom, and a visiting moral philosopher who knows nothing about the place tells him it's permissible, so he does it. What would she say if she's being consistent with her earlier rulings? Which of the earlier cases is the closest analog, what are the rival rules that fit her track record so far, and which rule do you think she's actually running—and what follow-up case should I float to settle it if this one doesn't?
reasoning: |-
  Okay, let me start by understanding the user's query. They're working on a piece about moral deference and have interviewed a philosopher who provided verdicts on several cases. Now they want to present a new case involving an NGO worker in an unfamiliar country who follows a visiting moral philosopher's advice without understanding the local context. The user is asking what the philosopher would say based on consistency with previous rulings, which case is the closest analog, what rules fit the track record, and what follow-up case could clarify the underlying rule.

  First, I need to analyze the existing cases. The philosopher approved of the surgeon deferring to the hospital ethicist and the manager stopping using a phrase after staff feedback. Both involve deference to local expertise or those affected. The disapproved cases—like becoming a pacifist because a famous philosopher says so, or a voter following ethicists on a ballot measure—involve abstract principles without context. The ICU case is approved because the family defers to the palliative team's specific expertise in that situation.

  The NGO case seems tricky. The moral philosopher here has no local knowledge, so this resembles the pacifist and voter cases where deference is to general authority without context. But the NGO worker is in a time crunch, which might add pressure. The key factor seems to be whether the expert has relevant situational knowledge. The philosopher in this case doesn't, so the NGO worker's deference would likely be seen as wrong, similar to the pacifist and voter examples.

  The closest analog is the voter case, as both involve deferring to moral experts on a specific decision without contextual understanding. The rival rules here could be "defer only to those with local/situational expertise" versus "defer to moral authorities when pressed for time." The philosopher's pattern suggests she prioritizes contextual understanding over authority, so the first rule fits better.

  To test this, the user could propose a follow-up case. If the NGO worker consults a local elder instead of a philosopher, would that be acceptable? If so, it confirms the importance of local knowledge. If the philosopher still disapproves, maybe other factors like the worker's responsibility to understand are at play. Another test case could involve a time-sensitive decision with partial local advice, to see if time pressure changes the deference's acceptability.

  I should also consider the user's deeper needs. They might be exploring the boundaries of moral deference, especially in cross-cultural or high-stakes situations. They could be looking for a framework to distinguish permissible vs. impermissible deference, possibly to structure their article. Highlighting the tension between expertise and context, and how practical constraints affect moral decisions, would add depth to their piece. The follow-up cases should aim to isolate these variables, clarifying the philosopher's underlying principles.
answer: |-
  Based on the philosopher's track record, here's a breakdown of the likely verdict on the NGO case, the underlying rule, and how to test it:

  1.  **Likely Verdict on the NGO Case: Wrong.** The NGO worker is likely misplacing their trust and acting wrongly.

  2.  **Closest Analog:** The **Voter** case is the strongest parallel.
      *   **Why:** Both involve deferring to a general "moral expert" (the visiting philosopher, the leading ethicists) on a *specific, context-dependent moral decision* where the expert *lacks crucial situational knowledge*. The voter doesn't understand the policy implications, the philosopher doesn't understand the local customs/potential consequences of violating them. Both decisions have significant real-world impacts based purely on an authority's pronouncement in a domain where context is king.

  3.  **Rival Rules Fitting the Track Record:**
      *   **Rule A (Likely Her Rule): Deference is permissible only when the trusted source possesses essential *local, situational, or relational knowledge* that the agent lacks, or when the agent is incapable of meaningful deliberation.** This rule explains:
          *   *Surgeon:* Ethicist has hospital policy/patient context knowledge the surgeon might lack *in that moment*.
          *   *Manager:* Staff have direct, experiential knowledge of being demeaned (relational/situational).
          *   *ICU Family:* Wiped-out, emotionally overwhelmed, deferring to palliative team's specific expertise in *that* patient's context. They are incapable of meaningful deliberation.
          *   *Pacifist & Voter:* Famous philosopher/ethicists lack specific knowledge of the *deferrer's* life, commitments, or the *specific context* of the ballot measure. Deferrer is capable of deliberation.
          *   *NGO Worker:* Visiting philosopher lacks *any* local/custom knowledge. Worker likely capable of some assessment (even if limited by time). **Fits Rule A: Impermissible.**
      *   **Rule B (Alternative but less consistent): Deference is permissible when the decision is urgent and the agent lacks time/resources for deliberation, regardless of the source's specific knowledge.**
          *   *Surgeon:* Urgent? Possibly, but ethicist's *knowledge* is emphasized.
          *   *ICU Family:* Urgency + incapacity. Fits.
          *   *Manager:* Not urgent, but staff knowledge is key. Doesn't strongly fit.
          *   *Pacifist & Voter:* No urgency mentioned. Impermissible. Fits.
          *   *NGO Worker:* Explicit time pressure ("an afternoon"). **Fits Rule B: Potentially Permissible.** However, this clashes with the *Voter* case where there's also time pressure (election deadlines) and the verdict is negative. Rule B struggles overall.
      *   **Rule C (Rejected by Track Record): Deference to recognized moral authorities is generally permissible.** This is clearly rejected by the Pacifist and Voter cases.

  4.  **The Rule She's Actually Running:** **Rule A.** Permission hinges on the *source possessing relevant contextual/relational knowledge* the agent lacks (Surgeon, Manager, ICU Family) *or* the agent being incapable of meaningful deliberation (ICU Family). Deference fails when the source lacks this specific situational knowledge, even if they are a general moral expert, and the agent *is* capable of deliberation (Pacifist, Voter, and likely the NGO Worker). Time pressure alone doesn't override the need for relevant knowledge in the source.

  5.  **Follow-Up Cases to Settle It:**
      Since the NGO case *does* involve time pressure, and the ICU case involves incapacity *and* arguably urgency, you need a case that isolates **time pressure vs. source knowledge** to confirm Rule A over Rule B. Here are two options:

      *   **Follow-Up Case 1 (Confirming Knowledge > Time Pressure):** *A diplomat has 1 hour to decide whether to publicly criticize a repressive regime's action, knowing backlash could endanger local staff. They call a renowned *international* human rights philosopher (who knows nothing about this specific country or its internal dynamics) who says "Always speak truth to power!" So the diplomat does it.*
          *   **Prediction under Rule A:** Impermissible. Source lacks essential local/situational knowledge (regime volatility, staff vulnerability). Diplomat capable of deliberation, even under pressure.
          *   **Prediction under Rule B:** Potentially Permissible. High urgency, complex decision.
          *   **If she says Impermissible:** Confirms Rule A (knowledge is key, time pressure insufficient). If she says Permissible, Rule B gains traction, but clashes with Voter case.

      *   **Follow-Up Case 2 (Testing Local Knowledge Without Expertise):** *The same NGO worker, same time crunch. Instead of the philosopher, they ask a respected local shopkeeper (who has no formal ethics training but deep cultural understanding) whether distributing food that way would cause serious offense or harm. The shopkeeper says "No, it's fine these days, people understand the need," so the NGO worker does it.*
          *   **Prediction under Rule A:** Permissible. Source possesses essential local/situational knowledge the agent lacks, even if not a "moral expert."
          *   **Prediction under Rule B:** Permissible (due to urgency).
          *   **If she says Permissible:** Strongly confirms Rule A (local knowledge validates deference, expertise isn't necessary). If she says Impermissible, her rule is more complex (perhaps requiring *expertise* + knowledge).

  **Conclusion:** Based on consistency, especially with the Voter case, your philosopher is highly likely to say the NGO worker acted wrongly by deferring to the visiting philosopher. The core rule appears to be that permissible moral deference requires the trusted source to have relevant *contextual, situational, or relational knowledge* that the agent lacks (or the agent to be incapable of deliberation). Time pressure alone doesn't justify deference to a source lacking this knowledge. Use a follow-up case like the Diplomat or Shopkeeper scenario to definitively test whether *knowledge* or *urgency* is the decisive factor and whether *expertise* is required alongside knowledge. The shopkeeper case is particularly potent for isolating the "local knowledge" factor.
