prompt: |-
  So I've been thinking about this weird institutional mix: Japan officially recognizes karoshi — death from overwork — as an occupational disease you can claim compensation for, but the 40-hour legal standard is basically hollow for salaried workers, and meanwhile France has the 35-hour week plus that right-to-disconnect law where bosses can't email you after hours, yet neither system treats chronic exhaustion as a harm in itself unless you either die or cross a specific hour cap. Throw in the lingering Protestant work-ethic vibe that idleness is morally suspicious, and you get policies that guard against being killed by labor but not against being slowly consumed by it.

  What philosophical commitments does that patchwork presuppose? Does recognizing karoshi but ignoring routine overwork mean harm only registers at the point of death? Is leisure being treated as just a negative liberty — don't call me — rather than a positive entitlement to time? And does the Protestant legacy imply work has intrinsic moral worth, so reducing hours feels like a loss rather than a health gain?

  Reconstruct the implicit theory about work, leisure, and rights here. Is it coherent, or are these parts pulling in opposite directions? What's strictly required by the practice versus what just fits it well? And what would have to change institutionally if we replaced it with a view that treated leisure as a basic right, not just a break between shifts?

  Also please keep settled stuff seperate from what's genuinely contested — don't present one side as if there's a consensus.
