answer: |-
  You've pinpointed a profound contradiction in modern labor philosophy. Let's reconstruct the implicit theory underlying these policies, analyze its coherence, and explore alternatives, carefully distinguishing settled practice from contested interpretation.

  **Reconstructed Implicit Theory of Work, Leisure, and Rights:**

  1.  **Work as Primary Social Value:** Work is the fundamental, morally significant activity. It drives economic progress, defines identity/status, and fulfills a duty to society (echoing Protestant work ethic). Idleness is inherently suspect, potentially lazy or unproductive.
  2.  **Harm Threshold:** The primary harm of work is *physical* injury or *immediate* catastrophic failure (death, disability). "Harm" requires objective, quantifiable proof (death certificates, specific medical diagnoses like stroke/heart attack linked to extreme hours, demonstrable violation of hour caps).
  3.  **Chronic Exhaustion as Epiphenomenal:** Fatigue, burnout, stress, and reduced quality of life are seen as:
      *   Individual problems (poor resilience, work-life balance failure).
      *   Subjective experiences, difficult to measure objectively.
      *   An inevitable cost of productivity/professionalism.
      *   Not inherently *caused* by work in a legally compensable way unless linked directly to extreme hour violations or a fatal event (karoshi).
  4.  **Leisure as Negative Liberty:** Leisure is conceptualized as the *absence* of work demands ("non-work time"). Rights related to leisure are primarily **negative**:
      *   Freedom *from* intrusion outside designated hours (France's right-to-disconnect).
      *   Freedom *from* excessive mandated hours (the *idea* behind 40/35-hour weeks).
      *   It is *not* seen as a positive entitlement to a guaranteed quantum of restorative, meaningful time for personal development, community, or idleness.
  5.  **Time Sovereignty Ceded to the Market:** Control over time allocation (how much work, when) is primarily negotiated within the employment relationship, heavily influenced by market competition and organizational needs. The state sets minimal safety rails (max hours, rest periods) but doesn't guarantee substantial positive time sovereignty.
  6.  **Health as Absence of Disease, Not Positive Well-being:** Health protections focus on preventing catastrophic occupational *disease* or *injury* (karoshi, physical harm). Sustained mental well-being, vitality, and the positive health benefits of ample leisure are not core concerns of labor regulation.

  **Coherence and Contradictions:**

  *   **Internally Coherent (within its own logic):** The system *is* coherent if the core goal is maximizing productive output while preventing the most visible, catastrophic failures that disrupt the workforce and incur high social costs (compensation, loss of skilled workers). Recognizing karoshi fits as an extreme endpoint of violation. Ignoring chronic exhaustion is consistent as it's deemed an individual cost or inherent to "serious" work. Leisure as negative liberty protects the employer's right to demand work *most* of the time, only limiting intrusion in specific off-hours.
  *   **Morally/Anthropologically Contradictory (externally):** The system becomes deeply incoherent if the goal is human flourishing:
      *   **Threshold Contradiction:** It acknowledges work can literally kill you, but denies that the *process* leading to death (chronic exhaustion, stress) is inherently harmful or worthy of systemic prevention *before* death. This is illogical if human well-being is valued continuously.
      *   **Value Contradiction:** It implicitly values productivity above well-being, treating chronic suffering as an acceptable input cost. This clashes with stated values of health and dignity.
      *   **Liberty Contradiction:** Protecting negative liberty (freedom from after-hours email) is hollow without positive liberty (meaningful time *to do* something else). What good is "disconnect" if all non-work time is spent recovering from exhaustion?
      *   **Work Ethic Contradiction:** The lingering Protestant ethic makes reducing work feel like a concession to weakness or a loss of virtue/morality, actively hindering policies that would promote well-being through increased leisure. This undermines the health protection rationale.

  **Settled Practice vs. Contested Interpretation:**

  *   **Settled Practice:**
      *   Legal systems recognize compensable harm primarily at the point of severe physical injury, disability, or death linked *provably* to work (karoshi, industrial accidents).
      *   Hour caps (40/35) are legal standards, though enforcement varies dramatically (esp. for salaried/exempt workers).
      *   "Right-to-disconnect" laws exist as negative prohibitions on employer intrusion during rest periods.
      *   Compensation systems require high burdens of proof for non-physical harms.
      *   No major economy legally defines a *positive right to leisure* or mandates leisure time for well-being beyond minimum rest periods/vacation.
  *   **Contested Interpretation:**
      *   **The *Reason* for the Harm Threshold:** Is it purely practical (ease of proof)? Or does it reflect a deeper philosophical dismissal of non-catastrophic suffering caused by work? (Contested).
      *   **The *Strength* of the Protestant Work Ethic:** How much does it *actively shape* policy resistance vs. being a fading cultural residue? (Contested, varies by country/sector).
      *   **Coherence as "Success":** Proponents argue the system balances productivity and basic protection. Critics argue it's fundamentally exploitative and destructive of well-being. (Contested normative judgment).
      *   **Inherent Value of Work:** The implicit assumption that work has *intrinsic* moral/social worth beyond its economic output is a philosophical position, not a settled fact. Critics argue work has *instrumental* value only (for survival, meaning within limits) and excessive work is destructive.

  **Institutional Changes for "Leisure as a Positive Right":**

  Shifting to a view where leisure is a basic positive entitlement to time for restoration, development, and community would require radical institutional overhaul:

  1.  **Guaranteed Minimum Leisure Time:** Moving beyond just capping work hours to legally guaranteeing a significant minimum of *paid, non-conditional* personal time. Think much shorter work weeks (e.g., 30 or 32 hours) *without* loss of pay or status, plus significantly longer mandated paid vacation (6+ weeks).
  2.  **Right to Sabbaticals:** Universal access to extended paid leave (months/years) for retraining, caregiving, travel, or personal projects over a working life.
  3.  **Strict Enforcement & Redefined Exemptions:** Drastically narrowing or eliminating exemptions for salaried/managerial workers from hour limits. Robust, proactive enforcement with severe penalties.
  4.  **Positive Leisure Infrastructure:** Public investment in accessible facilities, programs, and spaces that make meaningful leisure possible (parks, community centers, arts, affordable sports/recreation).
  5.  **Cultural & Educational Shift:** State-sponsored campaigns and education promoting the value of leisure, idleness, and non-work activities for individual and societal health, challenging the stigma around "idleness".
  6.  **Economic Restructuring:** Addressing the underlying economic pressures (low wages, precarious work, "always-on" global competition) that fuel overwork. This could involve stronger social safety nets, wealth redistribution, and regulations promoting stable employment.
  7.  **Redefining "Productivity":** Moving away from purely GDP/Output-per-hour metrics towards well-being indices that value health, leisure, and community as outcomes of a successful economy.

  **In essence:** The current patchwork reflects a system that prioritizes economic output and manages extreme risks while individualizing the costs of chronic work-related suffering and treating leisure as residual time. Recognizing karoshi but ignoring routine overwork reveals a system that only registers harm at its most extreme, catastrophic endpoint. Shifting to a "leisure as positive right" model requires fundamentally rebalancing the value placed on human time and well-being against purely economic metrics, demanding deep structural and cultural change. There is no consensus on whether this is desirable or feasible, but the analysis clearly shows the tensions within the existing paradigm.
