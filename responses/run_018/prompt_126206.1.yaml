prompt: |-
  I'm drafting an upper-level philosophy of mind final exam on collective intentionality and joint action. I need a single essay prompt that cannot be answered by reciting Searle's distinction between we-mode and I-mode or Bratman's conditions for shared cooperative activity. The prompt should present a novel case: three non-conscious computational nodes arranged in a ring topology, each running an identical consensus algorithm, that collectively reroute a shared energy grid in response to a localized fault, with no individual node representing the collective goal or possessing propositional attitudes, yet with mutual responsiveness and commitment-formation emergent only at the system level. Ask students whether this constitutes genuine joint action, and require them to adjudicate between a mentalistic account (joint action requires shared we-intentions with propositional content), a relational account (mutual responsiveness and commitment suffice regardless of substrate), and a functionalist account (collective intentionality is real if the system plays the right causal-functional role, even without individual mental states). Deliver your response as a numbered list of exactly five items, each one to two sentences, with no introduction or conclusion: item 1 should state the exam question; item 2 should state the thesis of the model answer; item 3 should summarize the argument that distinguishes the three accounts as applied to the nodes; item 4 should specify the marking criterion that separates an A answer from a B answer; item 5 should name the specific misconception that should cost marks. Do not include bibliographies, citations, or reading lists.
