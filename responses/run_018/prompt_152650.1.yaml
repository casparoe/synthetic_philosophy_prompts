  **Satire Targets:**  
  - The illusion that bureaucratizing ethics eliminates presentism.  
  - Immediate collapse into judging the past via modern norms (TW for Rome, plagiarism for Archimedes).  
  - Absurd quantification ("ECS Score 1.2/5.0 for Genghis Khan").  
  - Co-opting digital-age jargon ("algorithmic demerits," "platform leverage").  
  - The hubris of believing *their* ethics are "universal" and timeless.
