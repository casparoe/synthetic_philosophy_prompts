  ### Weimar Coalition Game: Structural Pressures vs. Personal Agency

  **Learning Objective:** Experience whether structural conditions (fear of chaos, desire for authoritarianism) inevitably produce a "substitute Hitler" or collapse without a singular demagogue.

  #### Setup
  - **Players:** 14 grad students.
  - **Roles:** Assign hidden role cards (Industry x3, Army x3, SA Leaders x4, Left Parties x4).
  - **Crisis Conditions:** Versailles resentment, economic collapse, fear of communism (printed on cards).
  - **Goal:** Form an authoritarian coalition government to avoid civil war (chaos = 0 points for all).
  - **Payoffs:** Points (not real money). Track on a shared board.
  - **Hitler Token:** One SA Leader holds this in Round 1 only. Grants special powers.

  ---

  ### Round 1: The Hitler Factor (45 mins)
  **Rules:**
  1. **Coalition Requirements:**
     - Minimum 8 players must agree to form a government (majority given 14 players).
     - Coalition must include at least 2 factions (e.g., SA + Industry, Army + SA).
     - **Hitler Token Holder (SA Leader):** Can form a coalition with only 5 supporters (including themselves). They set the policy terms unilaterally.

  2. **Payoff Cards (Secret):**  
     - *All players fear chaos* (0 points if civil war occurs).  
     - **Industry:** +10 if austerity/tax cuts; -5 if public works.  
     **Army:** +10 if military rearmament; -5 if SA militias integrated.  
     **SA Leaders:** +10 if SA gains power; -5 if disbanded.  
     **Left Parties:** -10 if authoritarian gov’t forms; -5 if civil war.  
     - *Hitler Token Bonus:* SA Leaders +5 if Hitler in coalition; Industry/Army +5 if Hitler includes their key demand.  

  3. **Process:**  
     - 10-min negotiation: Factions debate policy demands (austerity vs. public works, army vs. SA control).  
     - Hitler holder can broker quick deals or impose terms.  
     - Vote: Secret ballot for coalition agreement. If ≥8 agree (or ≥5 with Hitler), gov’t forms.  
     - **Outcome:**  
       - *Coalition formed:* Players score based on policy payoffs.  
       - *Civil war:* 0 points for all.  

  ---

  ### Round 2: No Hitler (45 mins)  
  **Rules:**  
  1. Hitler token removed. SA Leaders lose special powers.  
  2. **Same crisis conditions, same payoff cards, same rules** (8+ needed for coalition).  
  3. **Critical twist:** No unilateral leader. Players must compromise or face collapse.  
  4. **Process:**  
     - 10-min negotiation: Can factions agree without a demagogue?  
     - Vote: Same as Round 1.  

  ---

  ### Debrief Framework (Post-Game)  
  1. **Map Game Outcomes to Theory:**  
     - Did Round 1 produce a "Hitler" (SA Leader with token) who centralized power?  
     - Did Round 2 create a substitute demagogue (e.g., another SA Leader seizing initiative) or collapse?  
     - **Structural Pressure:** "Fear of chaos" payoffs = systemic incentive for authoritarianism.  
     **Personal Agency:** Hitler token = unique leverage only *one* actor could wield.  

  2. **Predictable Breakdowns (Warning for Instructor):**  
     - **Round 1:** Students may ignore "fear of chaos" and chase max points (e.g., SA demands +10 at all costs). Hitler token holder might overplay their hand, causing deadlock.  
     - **Round 2:** Without Hitler, SA Leaders may fragment; Industry/Army could fail to compromise, triggering civil war. Left Parties might sabotage deals to avoid -10.  

  3. **What the Game Can’t Reproduce (Be Honest):**  
     - Hitler’s **rhetorical charisma/manipulation** (players lack his psychological grip).  
     - **Contingency** (e.g., Hitler surviving assassination in 1930).  
     - **Long-term control dynamics** (e.g., Industry/Army believing they could "tame" Hitler).  

  ---

  ### Instructor Notes  
  - **No Lecture First:** Jump straight into gameplay. Reveal theories (structuralism vs. agency) only in debrief.  
  - **Ensure Strategic Bind:** Payoff cards force trade-offs (e.g., Industry wants austerity but must ally with SA for majority).  
  - **Left Parties’ Role:** Their -10 penalty pressures right-wing factions to coalesce but risks nihilism (some may prefer civil war’s -5).  
  - **Token Power:** Hitler holder can "break" Round 1 by demanding loyalty, mirroring real cult of personality.  
  - **Timekeeper:** Strictly enforce negotiation/voting phases. Chaos looms if debates drag.  

  This design forces players to *feel* the tension: structural incentives for authoritarianism (crisis payoffs) vs. the irreplaceable tactics of a demagogue (Hitler token). When the token vanishes, they confront whether the system demands a copycat or implodes.
