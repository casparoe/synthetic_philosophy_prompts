reasoning: |-
  Okay, the user runs a synthetic heritage desk at a city archive and needs a quick decision procedure based on Nietzsche's three historical modes—monumental, antiquarian, critical—to evaluate proposals like AI-reconstructed voices or buildings. They want a reusable checklist that's practical for about 15 minutes per proposal. 

  First, I need to recall Nietzsche's concepts: monumental history inspires by glorifying the past, antiquarian preserves for continuity, and critical judges to break from harmful legacies. The challenge is applying these to synthetic artifacts—things that feel like evidence but are reconstructed, which blurs the lines. The user isn't a philosopher; they handle technical sign-offs but flag value calls for the director. So, the procedure must be simple, with clear stopping points and handoffs.

  The core idea: proposals must align with one clear mode and be honest about being synthetic. I'll structure it as a checklist with questions in order. Start by identifying the primary mode: if it's a mix, that's a red flag because synthetic artifacts can't serve multiple purposes without confusing audiences. Then, vet the reconstruction method—if it's unsound, hard no. Next, check for interpretive honesty: if the synthetic nature isn't disclosed or is misleading, it's a rejection. Finally, if it passes, flag any value judgments for the director. 

  Now, applying it to the test cases: 
  - For (a) the AI voice of a labor organizer, it's monumental (inspiring action), and the method (voice cloning) is solid if based on recordings. But it must disclose it's a reconstruction, so flag the ethics of use to the director. 
  - For (b) the virtual rebuild of an immigrant block, it's antiquarian (preservation-focused), but "zero interpretation" is impossible for synthetics—it always implies choices. So, reject it for misrepresenting objectivity. 
  - For (c) the fabricated documents debunking a founding myth, it's critical mode, but the method is fabrication, not reconstruction. Hard no for creating false evidence, even if the director wants it—it violates archival integrity.

  The procedure can't resolve ethical debates or predict public reaction, which is crucial to note. 

  Bottom line upfront: "Synthetic history must pick one Nietzschean mode, prove technical rigor, and confess its artificiality—or get rejected." Then, the checklist in bullets: questions about mode, method, honesty, with clear outcomes. Keep it casual to match the user's tone—typos are fine, like "recieving" to sound human. Word count is tight (max 350), so be concise. Finally, emphasize this protects the archive's credibility while allowing director input on values.
answer: |-
  **Bottom line:** Synthetic history must commit to *one* Nietzschean mode, prove its technical bones, and shout "I'M ARTIFICIAL" – or get rejected.  

  **Procedure Checklist (run in order):**  

  1. **WHAT'S THE PRIMARY MODE?**  
     *Ask: Is this proposal clearly monumental (inspires action), antiquarian (preserves continuity), or critical (breaks toxic past)?*  
     **✓ Sufficient:** One mode dominates. **✗ Hard No:** Actively mixes modes (e.g., "preserves purely" AND "inspires revolt"). Synthetic artifacts can't credibly serve multiple masters. **➔ Handoff:** If mode is ambiguous but technically sound, flag to director for intent clarification.  

  2. **CAN WE STAND BY THE TECH?**  
     *Ask: Is the reconstruction method transparent, peer-reviewed, or industry-standard? Can we defend its accuracy publicly?*  
     **✓ Sufficient:** Method is documented & defensible (e.g., AI voice trained on verified recordings, architectural rebuild using blueprints). **✗ Hard No:** "Black box" AI, guesswork, or fabricated sources (not reconstructed).  

  3. **IS IT HONESTLY SYNTHETIC?**  
     *Ask: Does the display SCREAM "RECONSTRUCTION" and avoid implying raw evidence? Does interpretation match the mode?*  
     **✓ Sufficient:** Clear disclaimers + framing aligns with mode (e.g., monumental admits inspirational editing). **✗ Hard No:** Hides artificiality or misrepresents certainty ("This IS their voice"). **➔ Handoff:** If honest but ethically thorny (e.g., manipulating emotion), flag to director.  

  **Test Cases:**  
  *   **(a) AI Labor Organizer Voice:** **✓ Proceed (Flagged).** Monumental mode (inspires action). Tech probably ok if based on recordings. Honesty depends on disclaimers. **FLAG:** Ethics of using synthetic voice for persuasion to director.  
  *   **(b) "Pure" Virtual Immigrant Block:** **✗ REJECT.** Claims antiquarian (preservation) but "zero interpretation" is impossible for synthetics – rebuilds imply choices. Dishonest framing.  
  *   **(c) Fake Docs Debunking Myth:** **✗ REJECT.** Critical mode, but method is *fabrication* (step 2 fail). Creates false evidence, violates archival integrity – even if director wants the critique.  

  **What This Can't Do:**  
  *   Solve ethical debates (just flags 'em).  
  *   Judge if a mode is "good" for society.  
  *   Predict public backlash.  
  *   Replace deep historical expertise – it’s a triage tool.  

  *typos intentional per request :)*
