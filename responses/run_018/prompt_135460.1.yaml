  i run the synthetic heritage desk at a city archive, and we keep recieving proposals to display AI-reconstructed voices, demolished buildings, etc. framed in some historical mode. i need a reusable decision procedure based on Nietzsches three uses -- monumental, antiquarian, critical -- that i can actually run on any proposal in about fifteen minutes. fix my role: im not a philosopher, i have to sign off on the technical parts but flag anything thats a values call for the director.

  write it as a checklist with questions in order, what counts as a sufficient answer, where it stops with a hard no, and where it hands off to human judgement. make sure it handles the blur between modes when the artifact is synthetic -- it feels like evidence but its reconstructed. apply it to three cases: (a) an AI voice reconstruction of a dead labor organizer used to inspire current union drives; (b) a virtual rebuild of a demolished immigrant block presented as pure preservation with zero interpretation; and (c) a critical debunking of our founding myth using convincing but fabricated documents -- here the procedure should reject it even though the director might actually want that result, and say why. also say explicitly what the procedure cant do.

