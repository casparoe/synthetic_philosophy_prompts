  Okay, the user is deep into the just war theory debate about the moral equality of combatants, specifically the stalemate between Walzer and the revisionists. They mention their seminar has been stuck on this for a year, with everyone rehashing the same points without progress. Their hunch is that the issue isn't one debate but two: one about the permissibility of killing enemy soldiers and another about moral blameworthiness. They also bring up an asymmetry in the epistemic excuse—soldiers on the unjust side might have stronger internal reasons to believe their cause is just due to propaganda.

  First, I need to unpack their main points. They feel the debate is deadlocked because traditionalists and revisionists are answering different questions. Walzer's camp separates jus ad bellum and jus in bello, granting moral equality to combatants regardless of their side. Revisionists like McMahan argue combatants on the unjust side are morally responsible for their participation, so killing them isn't equivalent.

  The user's insight about two distinct questions seems spot on. Permission vs. blame. Traditionalists focus on the permissibility of killing in combat, while revisionists focus on individual blameworthiness. That's why they talk past each other—they're not addressing the same issue. 

  Then there's the asymmetry in the epistemic excuse. The standard argument says soldiers on both sides are equally excused because they don't know if their cause is just. But the user points out that soldiers fighting for an unjust cause might be more indoctrinated, making their belief in their cause's justice stronger. So the excuse might not be symmetric. Is this an empirical claim that needs investigation, or is it irrelevant?

  I need to figure out why the debate is stalled. Is it verbal? Substantive? Are hidden assumptions at play? The two-questions angle makes sense. If both sides are using "moral equality" to mean different things, that's a verbal disagreement. But underneath, there's a substantive clash about the role of individual agency in war versus systemic structures. 

  The epistemic asymmetry adds another layer. If soldiers on the unjust side have more reasons to believe their cause is just, does that affect their blameworthiness? Revisionists might say no because the objective truth matters, not subjective belief. But if the traditionalists argue that soldiers can't be blamed due to their epistemic environment, then the asymmetry strengthens their case. But is this asymmetry real? That's an empirical question about propaganda's effectiveness, which might vary. So that's a hidden empirical issue tangled in the normative debate.

  So the stall comes from multiple factors: conflation of permission and blame, different foundational intuitions (systemic vs. individual), and unexamined empirical claims about soldiers' beliefs. 

  To move forward, the user needs to disentangle these threads. First, clarify the two questions: is it permissible to kill combatants (permission)? And are combatants blameworthy for fighting (blame)? Separating these might reveal that both sides have points but on different issues. 

  Then, addressing the epistemic asymmetry requires empirical research. How much do soldiers actually know? How does propaganda affect their beliefs? Without data, this part of the debate is speculative. 

  Finally, rethinking the structure of war as a practice with its own norms versus a collection of individual actions. Maybe a hybrid approach where systemic rules govern permission, but individual blame is assessed separately. 

  The user's looking for a way out of the stalemate. Progress would involve mapping the disagreement's structure, splitting the concepts, investigating the empirical claims, and perhaps reframing the debate around war as a distinct practice. That could break the deadlock by showing where each side's arguments apply and where they don't.
answer: |-
  Here's a structural diagnosis of the deadlock and potential paths forward, based on your insightful observations:

  **Core Diagnosis: Conflated Questions + Hidden Assumptions**

  1.  **The Two-Question Split is Fundamental (You're Right):**
      *   **Question 1 (Permission):** Is it morally *permissible* for a combatant to kill an enemy combatant *in the context of war*, regardless of the justice of their cause?
      *   **Question 2 (Blame):** Is an individual combatant *morally blameworthy* or *culpable* for participating in an unjust war?
      *   **The Deadlock Source:** Walzerians focus primarily on **Question 1 (Permission)**. Their core concern is the *rules of engagement* within the war-fighting practice. Granting MEC (Moral Equality of Combatants) here is about establishing reciprocal killing permissions *between soldiers* to limit atrocity and make rules of war possible. Revisionists focus primarily on **Question 2 (Blame)**. Their core concern is *individual moral responsibility*. Denying MEC here is about holding individuals accountable for the objective injustice of their cause and actions. **They are arguing about fundamentally different moral concepts.** Using "moral equality" for both creates the illusion of direct disagreement when they are often operating on parallel tracks.

  2.  **The Epistemic Asymmetry - More Than a Red Herring:**
      *   Your intuition is correct: the standard epistemic excuse ("soldiers on both sides are equally ignorant") **assumes symmetry that likely doesn't exist**. States waging unjust wars often have stronger incentives and mechanisms for intense propaganda, censorship, and fostering unit cohesion based on belief in the cause's justice.
      *   **Impact:**
          *   **For Revisionists (Blame Focus):** This asymmetry *weakens* the epistemic excuse *for blameworthiness*. If soldiers on the unjust side are often *more* effectively shielded from truth, it might *increase* the plausibility of their non-culpable ignorance compared to soldiers on the just side (who may face less institutional pressure to believe falsehoods and more access to dissenting views). This complicates the revisionist assignment of blame.
          *   **For Traditionalists (Permission Focus):** This asymmetry is *less directly relevant*. Their permission argument relies on the *functional* difficulty of determining *in bello* justice and the need for reciprocal rules *between combatants*, not the *comparative depth* of ignorance. However, acknowledging the asymmetry strengthens their case that soldiers *generally* operate under conditions that make individual judgments about *ad bellum* justice unreliable during war.
      *   **It's a Hidden Empirical Claim:** The *degree* and *comparative nature* of this epistemic asymmetry is empirical. Its existence isn't a red herring, but its *extent* and *universality* are contested assumptions often glossed over in the philosophical debate. Does it hold true in all/most conflicts? How deep is the ignorance? This lack of concrete grounding weakens arguments relying heavily on the epistemic excuse.

  3.  **Deep Foundational Disagreement: Systemic Practice vs. Individual Action:**
      *   **Traditionalists (Walzerians):** View war as a distinct, highly structured *social practice* with its own internal logic and necessary rules (like boxing or law). Morality *within* the practice requires separating *jus ad bellum* (judged externally) and *jus in bello* (rules for participants). MEC is a *functional necessity* for this practice to have any limiting rules. Individual blame is largely irrelevant *to the in bello rules*.
      *   **Revisionists:** View war fundamentally as a *collection of individual violent actions*. Moral evaluation must start at the individual level, applying general moral principles (self-defense, proportionality, culpability). The "practice" of war doesn't create special moral permissions that override fundamental individual rights and responsibilities. Systemic arguments are seen as potentially obscuring individual wrongdoing.

  **Why the Stall? It's All of the Above:**

  *   **Verbal:** Using "moral equality" ambiguously covers both permission and blame.
  *   **Substantive:** Deep disagreement about the nature of morality in war (systemic practice rules vs. individualist ethics).
  *   **Different Questions:** Each side prioritizes different core questions (Permission vs. Blame).
  *   **Hidden Formal/Empirical Issues:** Unacknowledged reliance on:
      *   The assumption that separating *ad bellum* and *in bello* is conceptually coherent and practically necessary (Formal).
      *   Untested empirical assumptions about the symmetry/depth of soldiers' epistemic situations, the effectiveness of propaganda, and the feasibility of individual *in bello* *ad bellum* judgments (Empirical).

  **Paths to Progress (Not Easy, But Possible):**

  1.  **Rigorous Conceptual Splitting:**
      *   **Mandatory Step:** Explicitly separate the **Permission Question** (Can Soldier A permissibly kill Soldier B *in this combat situation*?) from the **Blame Question** (Is Soldier B morally culpable *for participating in the war*?).
      *   **Reframe the Debate:** Acknowledge that "MEC" might only make sense as an answer to the Permission Question *within the war-fighting practice*, while denying it is the natural answer to the Blame Question under individualist ethics. Stop trying to make one answer fit both.

  2.  **Develop a Model of Doxastic Responsibility in War:**
      *   Move beyond simplistic "ignorance excuses all/ignorance excuses nothing" positions.
      *   Develop a nuanced framework addressing:
          *   **Reasonable Belief Formation:** What *should* soldiers reasonably believe given their institutional context, available information, training, and psychological pressures? (This tackles your asymmetry point directly).
          *   **Culpable Ignorance:** When *is* failure to question or seek information blameworthy in a military context?
          *   **Role of State/Command Responsibility:** How does the *source* of the ignorance (state propaganda vs. individual negligence) impact the soldier's blame?
      *   **This model must integrate empirical insights** (psychology of belief, sociology of military institutions, propaganda studies) to ground the "reasonable" standard.

  3.  **Re-evaluate the "Practice" of War:**
      *   Is the Walzerian model of war as a rule-governed practice between moral equals *still descriptively accurate or normatively desirable* in modern conflicts (asymmetric warfare, counter-insurgency, drones)? Does it need modification?
      *   Can a revised "practice" model incorporate *some* revisionist concerns without collapsing into pure individualism? (e.g., acknowledging that *ad bellum* injustice might *sometimes* constrain *in bello* permissions in extreme cases, even if MEC generally holds for combatant-combatant killing).

  4.  **Focus on Asymmetry Empirically:**
      *   **Test the Claim:** Encourage or conduct empirical research on belief systems, information access, and the psychology of soldiers on *both* sides of conflicts perceived as just/unjust. Does the hypothesized epistemic asymmetry hold? How strong is it? What factors mediate it?
      *   **Refine the Debate:** Use empirical findings to inform the model of doxastic responsibility and assess the real-world force of the epistemic excuse argument for both permission and blame.

  **Is it Bedrock Intuition?** Partially, but not entirely. The deepest clash is between the intuition that war requires distinct rules (systemic) and the intuition that killing is always a profound moral act demanding individual assessment (individualist). However, progress *is* possible by:

  1.  Admitting the questions are different.
  2.  Building a more sophisticated, empirically informed account of soldier belief and responsibility (Blame Question).
  3.  Re-examining the justification for the rules of the war-fighting practice itself (Permission Question) in light of modern realities and the findings from point 2.
  4.  Accepting that a single, monolithic "MEC" answer might be impossible, but a more complex, differentiated account of combatant morality *is* achievable.

  The stalemate arises from trying to force a simple answer ("They are equal"/"They are not equal") onto a complex, multi-layered moral problem. Progress lies in embracing that complexity.
