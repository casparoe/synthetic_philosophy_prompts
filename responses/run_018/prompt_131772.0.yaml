answer: |-
  Your challenge brilliantly exposes a fracture point in Kant's indirect-duty framework. Let's systematically dissect the logic and apply your gradient-sensitive pressure, focusing on the normative core versus psychological mechanism.

  ### Core Structure of Kant's Indirect-Duty Argument (Focused on Animals):
  1.  **Foundational Premise (Rational Nature as Sole End-in-Itself):** Only rational beings (possessing autonomy/practical reason) have unconditional, intrinsic worth ("dignity"). This worth grounds direct moral obligations (duties *to* them).  
  2.  **Lack of Rational Nature in Animals:** Animals are non-rational. They lack autonomy and cannot set ends for themselves or grasp moral law.  
  3.  **Corollary (Absence of Direct Standing):** Therefore, animals are *not* ends in themselves. We have **no direct duties *to* animals**. They possess only instrumental or conditional value (e.g., beauty, usefulness).  
  4.  **Duty to Humanity via Self-Regarding Duty:** Our treatment of animals *can* impact our own moral character, specifically our capacity for virtue (fulfilling our perfect duties to ourselves).  
      *   **Mechanism 1 (Empirical Risk):** Cruelty towards sentient beings risks "hardening" our hearts, making us more callous and thus *less capable* of recognizing and acting upon our duties *to rational beings (humans)*.  
      *   **Mechanism 2 (Resource Preservation):** Wantonly destroying useful or beautiful animals wastes resources potentially beneficial to humans, violating duties of self-perfection (developing our capacities) or beneficence *towards humanity*.  
  5.  **Conclusion (Indirect Duty):** Therefore, we have **indirect duties *regarding* animals**, grounded *solely* in our direct duties *to ourselves* (as rational beings) and *to other humans*. The prohibition against cruelty is derivative, contingent on its psychological effect on the moral agent.

  ### Applying Gradient-Sensitive Analytical Pressure
  The challenge is to introduce beings with *substantial-but-incomplete* rational capacity (e.g., advanced primates, humans with severe cognitive impairments, AI with limited practical reasoning) and see if the binary separation between direct standing (Step 3) and indirect protection (Steps 4-5) holds.

  1.  **Pressure on Step 2 (Lack of Rational Nature):**  
      *   **Challenge:** If rational capacity is a spectrum, "lacking rational nature entirely" becomes ambiguous. Does a being with 70% typical human practical reasoning "lack rational nature entirely"? Kant's framework offers no clear threshold.  
      *   **Effect on Framework:** This immediately destabilizes Step 3. If rational nature isn't binary, the claim that such beings *definitively* "lack it entirely" and thus have *no* direct standing becomes questionable. The logic *assumes* a bright line where the gradient suggests blurring.

  2.  **Pressure on Step 3 (Absence of Direct Standing):**  
      *   **Challenge:** If a being possesses *significant* (though incomplete) rational capacity or autonomy-like features (e.g., complex goal-setting, partial moral understanding), does the premise that *only* "full" rational nature confers direct standing hold? Does a being with substantial rational capacity *really* have *no* intrinsic worth whatsoever?  
      *   **Effect on Framework:** This forces a confrontation with the core normative claim. If intrinsic worth flows from rational nature *as such*, and rational nature admits degrees, intrinsic worth might also admit degrees. Kant's strict "all or nothing" direct standing becomes difficult to defend logically at the margins without appearing arbitrary. The indirect-duty approach might seem like an ad hoc way to protect beings that *almost* meet the threshold but don't quite.

  3.  **Pressure on Step 4 (Duty via Self-Regarding Duty & Hardening):**  
      *   **This is the Crux of Your Question:**  
          *   **Purely Empirical Psychological Claim?** If "hardening" is *only* an empirical fact about human psychology (e.g., "causing pain to any sentient being statistically increases callousness"), then protection *could* be uniform. We'd have the same indirect duty to avoid cruelty to a chimpanzee, a severely impaired human, or even an insect, *if* the empirical risk of hardening were demonstrably similar. The normative source remains fixed on *our* rational nature.  
          *   **Normative Dependency Smuggled In?** However, Kant's language ("hearts," "cruelty") and the specific focus on *sentient* beings susceptible to suffering suggest a deeper link. The "hardening" argument gains its *moral* force precisely because the suffering inflicted is *recognizable* and *morally significant* in a way that, say, kicking a rock isn't. This significance *presupposes* that the suffering of beings capable of experiencing it *matters* – not ultimately *for their own sake* in Kant's system, but *because* it resonates with our moral sensibility *as rational beings*.  
      *   **Gradient Challenge:**  
          *   If the "hardening" effect is stronger or more morally concerning when inflicted on a being *closer* to rational agency (e.g., a severely impaired human vs. an insect), then the normative dependency is exposed. Why should cruelty to a cognitively impaired human harden us *more* than cruelty to an insect, unless we tacitly acknowledge a *normative* connection between the impaired human's status (as a being *of the kind* that normally possesses full rational nature) and rational nature itself?  
          *   This implies that the *wrong-making feature* of cruelty isn't *just* its purely contingent psychological effect on *us*, but also something about *what is done to the being* – that it violates a value somehow connected to, or approximating, rational nature. If so, for beings on the gradient, the derivative protection *should* be proportional to their degree of rational capacity/normative proximity to rational nature. Yet Kant's framework offers no mechanism for this calibration; protection remains uniform (avoid cruelty) or collapses into the binary.

  4.  **Pressure on Step 5 (Indirect Duty Conclusion):**  
      *   **Challenge:** If the "hardening" argument relies on normative dependency (as suggested above), then for beings on the gradient, the "indirect" duty starts to look suspiciously like a *direct* duty *because* of their partial rational nature or their special relationship to rational nature (e.g., membership in the human species). The derivative protection becomes a proxy for unacknowledged direct standing.  
      *   **Effect on Framework:** The neat separation between direct standing (rational beings) and indirect protection (all others) blurs. The logic struggles to maintain the "indirectness" for beings whose partial rational capacities make cruelty seem intrinsically (not just instrumentally) wrong *in a way linked to the value of rationality itself*.

  ### Where the Reconstruction is Most Vulnerable
  **The most critical vulnerability lies in the normative dependency inherent within the "hardening of the heart" argument (Step 4).**

  1.  **Empirical Claim Insufficiency:** If hardening is *purely* empirical/psychological, it becomes contingent and potentially arbitrary. Why focus only on animals? Wouldn't wanton destruction of beautiful forests also risk coarsening sensibilities? Kant singles out sentient beings, suggesting a deeper normative basis.
  2.  **Normative Smuggling:** The logical force and intuitive pull of the "hardening" argument rely on the unstated premise that *inflicting suffering on sentient beings is a recognizable type of moral wrongness*, even if its *ultimate* grounding is derivative. This "recognizable wrongness" points towards a value inherent in sentience or the capacity for subjective experience – a value Kant explicitly denies independent moral status.
  3.  **Gradient Amplifies Vulnerability:** When applied to beings with partial rational capacities, the purely psychological account becomes strained. Cruelty towards a being with substantial practical reasoning feels *more* directly wrong than cruelty to a less cognitively complex animal, *even if the empirical risk of "hardening" were identical*. This intuition suggests the wrongness isn't *solely* about its effect on the agent's virtue regarding *other* rational beings, but also about violating something valuable *in that particular being* – a value correlated with its degree of rational capacity. Kant's framework lacks the resources to acknowledge or incorporate this gradient of value, forcing the "hardening" argument to bear a normative weight it cannot consistently support within the binary system.
  4.  **Calibration Failure:** The framework's inability to calibrate the *degree* or *scope* of indirect protection proportionally to the being's position on the rational spectrum (e.g., stronger duties regarding beings closer to rationality) is a direct consequence of this vulnerability. It highlights the system's internal tension: the psychological mechanism is uniform, but the *reason* it matters morally seems to shift along the gradient.

  **Conclusion:** Your gradient-sensitive analysis reveals that Kant's indirect-duty argument covertly relies on a normative valuation of sentience or partial rationality that his explicit meta-ethical framework rejects. The "hardening of the heart" mechanism cannot be sustained as a *purely* empirical claim without losing its specific moral force and target. When pressured by intermediate cases, it exposes an unstable dependency: the derivative wrongness of cruelty seems to presuppose a type of direct (or proto-direct) wrongness that Kant's strict binary between rational and non-rational beings cannot accommodate. The point of greatest fracture is the inability to reconcile the *apparent* normative significance of harming beings with partial rational capacities with the doctrine that *only* full rational nature possesses intrinsic worth grounding direct duties.
