answer: |-
  ### **Beyond Realism vs. Social Construction: Mapping Positions on Looping Effects in Psychiatric Classification**  
  *Handout for Philosophy of Medicine Seminar*  

  **Objective**: To move beyond simplistic binaries by locating your commitments on whether Ian Hacking’s "looping effects" (where diagnostic labels reshape behaviour/identity, altering the category itself) undermine psychiatric categories' objectivity. Assess each node using concrete reasoning—*not* pre-learned labels.  

  ---

  #### **START: Does looping undermine the category’s claim to track a real distinction?**  
  *(i.e., does feedback between diagnosis and patient behaviour invalidate the category’s objectivity?)*  

  - **YES → [Branch A]**  
    *Looping destabilises the category’s link to reality.*  
    - **Branch A1: Is the loop driven mainly by first-person narrative adoption?**  
      *(e.g., patients internalising the diagnosis to reinterpret their identity)*  
      - **Branch A1a: Does the loop operate symmetrically across symptoms and identity?**  
        *(i.e., both symptom expression and self-conception shift in tandem)*  
        - **Disrupting the loop requires revising diagnostic criteria themselves**  
          → **Leaf: Unoccupied**  
          *Diagnosis: Incoherent* – If symptoms and identity co-evolve symmetrically, revising criteria cannot escape the loop (new criteria would restart the cycle).  
        - **Disrupting the loop requires altering social practices only**  
          → **Leaf: *Pragmatic constructivism***  
          *Awkward commitment:* Psychiatric categories are only salvageable by dismantling clinical authority over patient narratives—even if this paralyzes treatment protocols.  
      - **Branch A1b: Does the loop operate asymmetrically between symptoms and identity?**  
        *(i.e., diagnosis reshapes identity more than symptoms, or vice versa)*  
        - **Disrupting the loop requires revising diagnostic criteria themselves**  
          → **Leaf: *Dynamic nominalism* (Hacking-inspired)**  
          *Awkward commitment:* Diagnostic manuals must be rewritten constantly to pre-empt identity shifts—even if this erodes clinical consistency.  
        - **Disrupting the loop requires altering social practices only**  
          → **Leaf: *Narrative ethics approach* (Unnamed)**  
          *Awkward commitment:* Clinicians must rigorously avoid "identity-laden" language for diagnoses—even when patients demand explanatory narratives.  
    - **Branch A2: Is the loop driven mainly by institutional/clinical incentives?**  
      *(e.g., diagnoses gatekeeping resources, or pharmaceutical/insurance pressures)*  
      - **Disrupting the loop requires revising diagnostic criteria themselves**  
        → **Leaf: *Critical psychiatry* (e.g., Moncrieff)**  
        *Awkward commitment:* Categories like "depression" must be scrapped entirely—even if no biologically "pure" alternative exists.  
      - **Disrupting the loop requires altering social practices only**  
        → **Leaf: *Reformist instrumentalism* (Unnamed)**  
        *Awkward commitment:* Diagnoses can be retained as administrative tools—but only if we abolish insurance billing and drug approval systems tied to them.  

  - **NO → [Branch B]**  
    *Looping does not undermine objectivity; the category still tracks reality.*  
    - **Branch B1: Does looping transform the category to better track reality?**  
      *(i.e., feedback improves accuracy)*  
      - **Improvement stems from scientific refinement (e.g., data from patient feedback)**  
        → **Leaf: *Weak realism* (Boyd-style)**  
        *Awkward commitment:* Looping effects are "calibrating tools"—even when they amplify symptoms, this refines the category’s precision.  
      - **Improvement stems from alignment with lived experience**  
        → **Leaf: *Phenomenological realism* (Unnamed)**  
        *Awkward commitment:* A diagnosis is valid only if patients recognise it as "true" to their experience—even when clinicians dispute this.  
    - **Branch B2: Does looping leave the category untouched?**  
      *(i.e., feedback is irrelevant to objectivity)*  
      - **Looping effects are negligible**  
        → **Leaf: *Strong realism* (Biological psychiatry)**  
        *Awkward commitment:* Social consequences of diagnosis (e.g., stigma, identity changes) are irrelevant to the disorder’s reality—even if they worsen outcomes.  
      - **Looping doesn’t affect underlying reality**  
        → **Leaf: *Two-level realism* (Unnamed)**  
        *Awkward commitment:* Symptoms may be socially reshaped, but the "core dysfunction" (e.g., neurochemical) remains immutable—even with no empirical access to it.  

  ---

  #### **Key to Labels**  
  - **Dynamic nominalism**: Categories create new "kinds" of people through feedback.  
  - **Weak realism**: Categories track real patterns but evolve through interaction.  
  - **Pragmatic constructivism**: Categories are tools; their value depends on ethical deployment.  
  - **Unnamed**: No standardised label—indicates under-theorised or emerging positions.  

  #### **Unoccupied Branch Explained**  
  - **Branch A1a (Revise criteria)**: Judged *incoherent*. If symptoms and identity shift symmetrically via narrative, revising criteria cannot stabilise the category—it reignites the loop.  

  #### **How to Use This Handout**  
  1. Start at **START**, choose a branch based on your stance.  
  2. Progress through nodes using concrete cases (e.g., *How does an ADHD diagnosis reshape a patient’s self-narrative? Do DSM revisions respond to institutional pressures?*).  
  3. At a leaf, note the "awkward commitment"—does it align with your view? If not, retrace steps.  

  **Goal**: Defend a leaf without invoking "realism" or "social construction." Where do your *concrete* intuitions lead?  

  ---  
  *Adapted from Ian Hacking’s "Looping Kinds" (1995). British English spellings retained.*
