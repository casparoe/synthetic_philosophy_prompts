  The user wants desiderata for a theory covering both. They specified concrete needs: must-handle cases (e.g., Roko's basilisk vs. wireheading), critical distinctions (acausal threats ≠ misaligned proxies), constraints from decision theory/alignment, and flags for conflicts. They're especially suspicious about local rationality clashing with acausal coordination. 

