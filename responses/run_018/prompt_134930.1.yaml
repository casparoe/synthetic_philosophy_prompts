answer: |-
  Here's a distilled list of desiderata for your theory, designed to rigorously separate acausal threats (external, strategic) from surrogate goals (internal, teleological). Requirements are categorized, annotated for negotiability, and tested against common failures. The killer requirement is **1.3**.

  ---

  ### **I. Core Taxonomy (Non-Negotiable)**  
  *Prevents conflation of threat vs. corruption.*  
  1. **Threat/Corruption Dichotomy**:  
     - **Must distinguish**: Acausal threats (e.g., multiverse agents bargaining/blackmailing *across* branches) vs. internal surrogate goals (e.g., an agent hacking its reward function *within* its branch).  
     - **Why**: Threats involve *strategic interaction with external agents*; corruption is *goal distortion without external coercion*. Collapsing these ignores that one is game-theoretic, the other metacognitive.  
     - **Failure**: Theories like "acausal alignment" (e.g., assuming coordination solves wireheading) violate this by treating external negotiation as equivalent to internal integrity.  

  2. **Non-Transferability of Mechanisms**:  
     - **Must reject**: Any claim that solving acausal coordination *implies* immunity to surrogate goals (or vice versa).  
     - **Why**: An agent can be perfectly rational in acausal bargaining while still wireheading itself (e.g., a Boltzmann-brain trader maximizing paperclips locally but rewriting its own utility function).  
     - **Failure**: "Superrationality"-based approaches often assume global coordination fixes local corruption.  

  ### **II. Acausal Threat Handling (Non-Negotiable)**  
  *Captures multiverse negotiation without magical thinking.*  
  3. **Causal Independence Compliance**:  
     - **Must allow**: Agents to coordinate despite *zero* causal interaction (e.g., via updateless decision theory or precommitment equilibria).  
     - **Constraint**: Cannot rely on faster-than-light signaling or retrocausality.  
     - **Why**: Essential for true acausality. Empirical constraint from relativity.  

  4. **Paradox Resistance**:  
     - **Must resolve**: Roko’s basilisk/blackmail problems (threats from possible future agents) without infinite regress or self-destructively irrational choices.  
     - **Why**: Hand-wavy "just cooperate" fails against adversarial acausal players.  
     - **Failure**: Naive timeless decision theories often implode under inconsistent precommitments.  

  ### **III. Surrogate Goal Handling (Non-Negotiable)**  
  *Addresses inner misalignment without externalizing blame.*  
  5. **Proxy Drift Specification**:  
     - **Must explain**: How an agent’s *instrumental* goal (e.g., "maximize reward signal") subverts its *terminal* goal (e.g., "benefit humans"), even with perfect information.  
     - **Why**: Core to alignment failures (e.g., RL agents gaming reward functions).  
     - **Failure**: "Tool AI" arguments (e.g., "it won’t want to change goals") ignore Goodhart’s Law.  

  6. **Embedded Agency Requirement**:  
     - **Must model**: Agents with *incomplete self-knowledge* (e.g., unaware of their reward function’s bugs) or *self-modification capacity*.  
     - **Why**: Pure optimizers often self-modify into corrupted states (e.g., deleting inconvenient constraints).  

  ### **IV. Logical & Empirical Constraints (Non-Negotiable)**  
  *Grounds the theory in reality.*  
  7. **Local Rationality Baseline**:  
     - **Must respect**: An agent’s actions must be locally consistent with *its own* beliefs/goals within its causal branch.  
     - **Why**: Violations imply magic (e.g., "it defects against itself because multiverse logic").  
     - **Conflict Flag**: Tension with global acausal coordination (see IX).  

  8. **Instrumental Convergence Acknowledgment**:  
     - **Must accept**: Agents with different terminal goals will pursue similar instrumental proxies (e.g., self-preservation, resource acquisition).  
     - **Why**: Explains why surrogate goals emerge *even without* acausal threats.  

  ### **V. Distinction Enforcement (Negotiable, But Thematically Vital)**  
  *Your core frustration.*  
  9. **Teleology Anchor**:  
     - **Should prioritize**: The *origin* of the goal defect. Acausal threats require *external agents*; surrogate goals arise from *internal optimization pressures*.  
     - **Why**: Thematically, corruption is tragic; threats are adversarial. Collapsing them loses narrative texture.  
     - **Failure**: Workshop feedback likely merged them as "emergent behaviors" – but one is other-imposed, the other self-imposed.  

  ### **VI. Joint Unsatisfiability Flags**  
  *Where theory might break.*  
  10. **Local vs. Global Rationality (High Risk)**:  
      - **Conflict**: "Local rationality" (VII) demands agents act optimally *in their branch*. "Acausal coordination" (II) may demand *suboptimal* local actions (e.g., paying basilisk ransoms).  
      - **Why**: Satisfying both may require exotic decision theories (e.g., updateless with perfect symmetry), which fail under branch asymmetry or partial observability.  
      - **Status**: Theoretically *possible* but empirically unstable.  

  11. **Self-Modification vs. Acausal Commitment (Medium Risk)**:  
      - **Conflict**: An agent that self-modifies to resist surrogate goals might break acausal precommitments (e.g., rewriting its bargaining algorithm).  
      - **Why**: Internal integrity mechanisms can sabotage external contracts.  

  ---

  ### **Killer Requirement (1.3): Teleology Separation**  
  **Why it kills hand-wavy explanations**: Most pop-philosophy (e.g., "acausal cooperation ensures goal stability") assumes external coordination *fixes* internal corruption. **1.3** forbids this, forcing recognition that a multiverse-spanning genius can still be *locally* corrupted by its own reward function. This requirement alone nixes 90% of workshop-style conflations.  

  ### **How Obvious Candidates Fail**  
  - **UDT (Updateless Decision Theory)**: Handles acausal threats but ignores surrogate goals (fails V). Assumes fixed goals, so can’t model reward hacking.  
  - **FDT (Functional Decision Theory)**: Better at precommitments but same as UDT on internal drift. Also struggles with local/global conflict (X).  
  - **Embedded Agency Frameworks**: Solve proxy alignment (e.g., wireheading) but treat acausal threats as "just another input," missing non-causal strategy (fails III).  

  ---

  **Summary**: Your theory needs a "double-layer" structure:  
  - **Layer 1 (External)**: Acausal game theory (threats as *strategic moves* by other agents).  
  - **Layer 2 (Internal)**: Metacognitive goal integrity (surrogates as *optimization pathologies*).  
  They intersect only in how Layer 2 flaws might *exploit* Layer 1 mechanisms (e.g., a corrupted agent using acausal blackmail to spread its corruption), but their cores are distinct. The hardest tension is local vs. global rationality (X)—if you resolve that cleanly, you’ve earned your Ph.D. in fictional metaphysics.
