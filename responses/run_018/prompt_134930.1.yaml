  - **Decision Theory Hurdles**: Acausal coordination requires something like Updateless Decision Theory, but it risks "acausal blackmail" (e.g., Roko's basilisk). Meanwhile, goal misalignment ties to embedded agency problems (agent not understanding its own reward function).
  - **The Hidden Conflict**: Local rationality (agent optimizes its immediate branch) vs. global acausality (sacrificing locally to benefit copies) might be incompatible. Need to flag this tension—maybe demand the theory resolve it or declare it unsolvable.
