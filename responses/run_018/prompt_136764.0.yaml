answer: |-
  ### The Underlying Principle: Epistemically Well-Founded Mutual Observability (EWFMO)

  The core principle governing the validity of a program equilibrium is **Epistemically Well-Founded Mutual Observability (EWFMO)**. This principle requires that the strategy of each agent must be able to *unambiguously, non-circularly, and non-invasively* determine the behavior of other agents in the interaction, based solely on their source code and the rules of the game. Specifically:

  1. **Epistemic Soundness**: The determination of other agents' behavior must be computable, halting, and free from unbreakable circular dependencies. It must yield a unique, well-defined output without relying on undefined or paradoxical evaluations.
  2. **Non-Invasive Observability**: Agents may observe (read) others' source code but cannot alter it, interfere with its execution, or depend on external runtime factors (e.g., timing, randomness) that break deterministic reasoning.
  3. **Strategy-Space Invariance**: The interaction must preserve the intended strategy space. Agents commit to fixed strategies (programs) before execution; no agent can retroactively modify another's strategy.

  ### Application to Cases
  1. **Transparent 2-Player PD**:  
     - **EWFMO Satisfied**: Mutual cooperation holds. Each program reads the other's source, and the mutual condition ("cooperate iff the other cooperates when run against me") resolves to a fixed point (cooperation) via quining/self-reference. No circularity (well-founded).  
     - *Clause*: Epistemic soundness (fixed-point resolution).

  2. **Opaque Binaries with Noisy Oracle**:  
     - **EWFMO Violated**: Cooperation collapses. The oracle’s noise and opacity prevent unambiguous determination of the other’s behavior. Evaluation is not sound (non-halting/ambiguous due to error rates), and observability is compromised.  
     - *Clause*: Epistemic soundness (lack of deterministic, error-free access).

  3. **Transparent 3-Player Extension**:  
     - **EWFMO Satisfied**: Mutual cooperation holds. Increased complexity doesn’t break epistemic soundness; the mutual conditions still resolve to a fixed point (all cooperate).  
     - *Clause*: Epistemic soundness (fixed-point persists).

  4. **Encrypted Source Code**:  
     - **EWFMO Violated**: Not a valid equilibrium. The circular dependency (A needs B’s key to decrypt B, but B’s key is inside B, which is encrypted) creates a non-halting loop. No well-founded evaluation order exists.  
     - *Clause*: Epistemic soundness (circular dependency breaks computability).  
     - *Your intuition conflict*: Structural access isn’t sufficient; the evaluation is undefined without a priori decryption.

  5. **Simulation-Based Strategies**:  
     - **EWFMO Satisfied (but degenerate)**: Mutual defection occurs, and it *is* a program equilibrium. The simulation halts with a unique output (defection), satisfying epistemic soundness. However, it’s "degenerate" because it exploits computational limits to converge to a suboptimal outcome, not a reasoned commitment.  
     - *Clause*: Epistemic soundness (deterministic simulation halts).

  6. **Meta-Intervention (Code Rewriting)**:  
     - **EWFMO Violated**: Invalid equilibrium. Rewriting B’s code alters the strategy space retroactively, violating non-invasiveness and strategy-space invariance. B never executes its intended strategy.  
     - *Clause*: Non-invasive observability and strategy-space invariance.

  ### Prediction for Unconsidered Scenario: Asynchronous Clocks + Message Delays
  - **Scenario**: Transparent programs, but execution starts on asynchronous clocks. Opponent’s code may arrive non-deterministically (before/during/after execution).
  - **EWFMO Verdict**: **Not a valid program equilibrium**.  
    - **Why**: Message delays introduce runtime contingencies that break epistemic soundness. An agent executing before receiving the opponent’s code cannot determine the opponent’s behavior unambiguously (e.g., it must default to defection or wait indefinitely). This violates:
      - *Epistemic soundness*: Evaluation depends on timing, not just code.
      - *Non-invasive observability*: Access to code is now environment-dependent, not guaranteed a priori.
    - **Outcome**: Defection likely, as agents cannot rely on mutual conditions holding.

  ### Honest Reconciliation
  - **Your verdicts accommodated**: All except the **encrypted case**. EWFMO rejects it due to circular evaluation, while your intuition saw structural access as sufficient. EWFMO prioritizes *computational definability* over structural potential—without a well-founded decryption sequence, the programs cannot even begin evaluation.  
  - **Revision needed?** EWFMO holds firm; the encrypted case fails because circular dependencies violate epistemic soundness. If keys were externally provided (breaking circularity), it would work, but embedded keys make it pathological.

  ### Summary
  **EWFMO** is the unifying principle:  
  - Valid equilibria require strategies to *deterministically and independently* verify others' behavior from their source code alone, with no circular/undefined evaluations, no runtime interference, and no strategy-space alterations.  
  - This explains why transparency, fixed-point resolvability, and non-invasiveness are essential, and why noise, encryption, rewriting, or asynchrony disrupt equilibrium.
