  Considering standard positions: Minimalists like Borg would bite the bullet at step (2), sacrificing natural interpretations to preserve semantics. Contextualists like Recanati accept step (5)'s "circularity" as non-vicious recursion. Hidden-indexical theorists might reframe saturation as convention-bound.

  The real cost analysis: rejecting step (3) maintains Grice's architecture but risks making "what is said" unintuitive. The circularity in step (5) seems problematic but may reflect actual interpretation processes. I find step (3) the most arguable point - its "no principled boundary" claim is overstated, as saturation and implicature remain distinct mechanisms.

  For the user's needs: they want to preserve Grice while minimizing damage. Suggesting they allow some pragmatic intrusion into saturation (contextualism) keeps the distinction alive at reasonable cost. The Cooperative Principle remains useful for calculating implicatures beyond this baseline.

  Ultimately the weakest step is (3), and rejecting it costs making "what is said" less intuitive but preserves the framework. Alternative approaches exist, but this seems the most Grice-friendly compromise.
answer: |-
  ### Bottom Line
  Reject step (3): saturation is governed by linguistic/conventional mechanisms (e.g., mandatory contextual parameters), not *directly* by speaker meaning, preserving a boundary with implicature—though this costs accepting a minimal, often non-propositional, "what is said" that may feel artificial.

  ### Diagnosis
  1. **Accepted**: Grice’s distinction relies on literal content as a baseline.  
  2. **Accepted**: Saturation (reference-fixing, disambiguation) is needed for what is said.  
  3. **Rejected**: Saturation *can* operate via linguistic rules (e.g., indexicals require contextual anchors; adjectival domains are linguistically constrained). Speaker intentions need not dominate; conventions and salient context suffice.  
  4. **Blocked**: If saturation is convention-driven, what is said is determined *before* accessing full speaker meaning (e.g., "empty" in "The bottle is empty" saturates to *empty of liquid* via default scenarios, not intentions).  
  5. **Mitigated**: Circularity dissolves: minimal content (e.g., "x is empty") is derived conventionally, *then* speaker meaning (e.g., "don’t buy it") generates implicatures via Gricean maxims.  
  6–7. **Avoided**: Minimal propositions (or proposition radicals) survive; speaker meaning doesn’t engulf literal content.  
  8. **False dilemma**: Minimalists (Borg) accept step 3’s rejection, sacrificing intuitive content for semantic austerity. Contextualists (Recanati) reject step 3 but allow pragmatic *modulation* post-saturation, risking grey areas. Hidden-indexicalists (Stanley) treat saturation as linguistically mandated, preserving Grice’s structure.  

  **Cost**: Minimal "what is said" becomes sparse (e.g., "empty" → *devoid of standard content*), often mismatching intuitive understanding—but the implicature machinery remains intact. Circularity is avoided; misunderstanding arises when context/saturation defaults fail.
