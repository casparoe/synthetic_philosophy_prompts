  First, I need to outline the conceptual dependencies. The key is to show that propositional attitudes are an optional overlay, not necessary for explaining behavior. The sequence should start with behavior explanation, then introduce propositional attitudes as an interpretation, move to dispositional dynamics, and finally present eliminativism as a consequence when the overlay isn't needed.

