answer: |-
  Here is a meticulously crafted 90-minute session plan focused on understanding eliminative materialism *specifically* as the denial that propositional attitudes (beliefs, desires as structured mental representations) are necessary or real components of our cognitive architecture.

  **Core Conceptual Dependencies (Sequence is Crucial):**
  1.  **Explanation of Behavior:** How do we explain why systems (biological or artificial) behave the way they do? (Foundation: All explanation starts here).
  2.  **Propositional Attitude Attribution (Folk Psychology):** Humans naturally explain *other humans'* complex, flexible behavior by attributing internal states with *propositional content* ("Believes *that P*", "Desires *that Q*").
  3.  **The Optionality of the Overlay:** Recognizing that the *attribution* of propositional attitudes is an *interpretive strategy* applied *by us* to make sense of behavior, not necessarily a description of the system's intrinsic causal structure.
  4.  **Dispositional/Predictive Dynamics:** Introducing the idea that adaptive behavior can be explained by complex, interacting dispositions (sensitivities, triggers, biases) and processes minimizing prediction errors relative to inputs and internal states, operating without structured representations.
  5.  **The Eliminative Claim:** If (4) provides a complete, scientifically grounded explanation of the behavior previously explained by (2), and (2) is shown to be an inaccurate description of the underlying causal structure (because the system demonstrably lacks the representational vehicles implied by (2)), then (2) should be *eliminated* from our fundamental ontology, not reduced or identified with (4).
  6.  **Scope:** Clarifying that this elimination applies *specifically* to the *structured representational vehicles* posited by folk psychology (sentences-in-the-head), not necessarily to consciousness, sensation, or other mental phenomena *not* characterized as propositional attitudes.

  **Anchoring Example: Thermoregulation System (e.g., Sweating/Shivering)**
  *   **What it Exhibits (Mimicking Belief/Desire Explanation):**
      *   **Adaptive Behavior:** Changes state (sweats/shivers) in response to specific environmental conditions (heat/cold) to maintain a crucial parameter (core temperature ~37°C). Feels purposeful ("It *wants* to stay at 37°C!").
      *   **Context-Sensitivity & Updating:** Responds dynamically to changing inputs (temperature sensors, blood flow sensors). Adjusts response intensity based on deviation (magnitude of error signal).
      *   **Useful Attribution:** We *can* naturally say "The system 'detects that it's too hot' and 'desires to cool down', so it 'believes sweating will help' and acts accordingly." This feels explanatory.
  *   **What it Lacks (Crucially):**
      *   **Compositional Syntax:** No internal symbols combining subject/predicate ("core-temperature", "is-37C", "too-high") forming structured representations ("Core temperature is too high").
      *   **Discrete Representational Tokens:** No identifiable, stable internal "symbols" standing for concepts like "heat", "sweating", or "desirability".
      *   **Truth-Evaluable Content:** No internal state *means* "The core temperature is 38.5°C" in a way that could be true or false independently of the system's immediate causal dynamics. The states *are* the causal dynamics.
  *   **Underlying Mechanism:** A network of temperature sensors, comparator circuits (comparing sensed temp to set-point), effector controls (sweat glands, muscles), with feedback loops minimizing the error signal (difference between sensed temp and set-point). All dynamics, no symbols.

  **Explanatory Arc & Sequence (90 min):**

  1.  **Introduction & Grounding: Explanation of Behavior (10 mins)**
      *   Start broadly: "How do we explain why *anything* behaves as it does?" Discuss simple examples (rock falls, plant grows towards light). Highlight different *levels* of explanation (physical forces, biological functions).
      *   **Key Point:** Explanation involves identifying patterns, causes, and functional principles.

  2.  **The Human Tool: Folk Psychology & Propositional Attitudes (15 mins)**
      *   How do we explain complex, flexible human behavior (e.g., someone puts on a coat)? Introduce the ubiquitous use of "belief" and "desire" *as propositional attitudes*: "She *believes* it's cold outside" (content: *that it is cold outside*), "She *desires* to be warm" (content: *that she is warm*). Emphasize the *structure*: attitude (belief/desire) + propositional content ("that P").
      *   **Crucial Distinction:** Frame this as our *interpretive strategy*, our *explanatory tool*. It feels natural and is often predictively useful for *social interaction*.
      *   **Avoid:** Don't call it a "theory" yet; focus on it as a practiced explanatory *activity*.

  3.  **Revealing the Overlay: The Thermostat/Thermoregulation Example (20 mins)**
      *   Present the thermoregulation system in detail. Walk through how it behaves adaptively. Show how we *can* apply folk psychology ("It believes...", "It wants..."). Acknowledge this feels intuitive.
      *   **Dive into Mechanism:** Explicitly map the "belief/desire" explanation onto the *actual* causal dynamics (sensors, comparator, error signal, effectors). Show there is *no place* in the physical mechanism where the propositional content ("The core temperature is too high") exists as a structured, discrete, causally active vehicle. The causal work is done by the dynamic flow of signals minimizing the error relative to the set-point.
      *   **Key Insight:** The propositional attitude attribution is *useful for us* (the explainers), but it's an *optional overlay* on top of the underlying dispositional/predictive dynamics. The dynamics *are sufficient* for the behavior.

  4.  **Generalizing the Insight: Dispositional Dynamics & Predictive Processing (15 mins)**
      *   Generalize from the example: Complex adaptive behavior, even highly flexible behavior, can arise from sophisticated networks of dispositions and predictive processes. Highlight core concepts:
          *   **Dispositions:** Context-triggered tendencies to react in specific ways.
          *   **Predictive Processing/Minimizing Prediction Error:** Systems constantly generate predictions about inputs/states and adjust actions or internal models to minimize mismatches (error signals).
      *   Argue that human brains are vastly more complex networks of interacting dispositions and predictive processes than a thermostat, but *structurally analogous* in lacking the need for sentence-like internal symbols. (Plant flag: This is the *positive* scientific picture EM suggests).

  5.  **Introducing Eliminative Materialism (Specifically) (15 mins)**
      *   **The Claim:** If propositional attitudes (beliefs, desires *as structured representations with content*) are merely a useful interpretive overlay *we* apply, but *not* part of the actual causal structure of the cognitive system (as demonstrated by the thermostat and suggested for brains by neuroscience), then they are not real components of our cognitive ontology. They are like "caloric fluid" – a useful explanatory fiction eventually replaced by a deeper account (molecular kinetics / dispositional dynamics).
      *   **Precise Target:** Emphasize this is *specifically* about *structured propositional attitudes as representational vehicles*. It is *not* denying that people *act as if* they have beliefs/desires, that folk psychology is useful socially, or that there is *something* (dispositions, predictions) being described loosely by these terms. It's denying the existence of the *vehicles* that have the properties folk psychology attributes to them (compositionality, truth-conditions).
      *   **Contrast:** Briefly contrast with *reductive* physicalism (beliefs *are* neural states) and *non-eliminative* functionalism (beliefs are functional roles, potentially multiply realizable). EM says the *folk concept itself* is radically mistaken about the *kind* of state it picks out.

  6.  **Addressing Predictable Misconceptions & Q&A (10 mins)** - *Interrupt these as they arise, but consolidate here:*
      *   **Misconception 1 (From Step 3/4):** "So EM says the thermostat *actually has* beliefs/desires, just physically realized?" **Interrupt:** No! The point is the thermostat *doesn't need them*; the dynamics suffice. Attributing them is *our overlay*. EM argues brains are like that too, just vastly more complex. (Reiterate the "optional overlay" and "sufficient dynamics").
      *   **Misconception 2 (From Step 5):** "But if beliefs don't exist, does that mean *I* don't *really* think or want anything? That's absurd!" **Interrupt:** EM doesn't deny you have complex internal states, engage in cognition, or act purposefully. It denies that the *specific theoretical entities* of folk psychology – discrete, structured, content-bearing mental sentences – are the correct description of *how* you do it. You have incredibly rich dispositional/predictive states. The "absurdity" stems from conflating the *folk concept* with the *phenomenon* it imperfectly describes.
      *   **Misconception 3:** "EM is just saying brains are physical, like all physicalists." **Interrupt:** All physicalists agree brains are physical. The unique EM claim is that *one specific category of mental state description* (propositional attitudes as conceived by folk psychology) fails to correspond to *any* physical state or process in the right way – not even a functional role that could be physically realized. It's eliminative *about that specific category*.
      *   **Misconception 4:** "If beliefs aren't real, how can neuroscience explain behavior?" **Interrupt:** Neuroscience explains behavior via neural mechanisms (dispositions, predictive dynamics, etc.), *not* by finding neural correlates of "believing that P". EM argues successful neuroscience will bypass the folk framework entirely, just as thermodynamics bypassed caloric.

  7.  **Check for Understanding (5 mins):**
      *   **Exercise:** Present a brief scenario: *"A sophisticated chess-playing computer consistently sacrifices its queen to achieve checkmate three moves later. We naturally say 'It believes sacrificing the queen is necessary for victory' and 'It desires to win'. How would an eliminative materialist analyze this situation?"*
      *   **What Reveals Understanding:** A correct response must:
          1.  Acknowledge the usefulness/inevitability of the folk attribution *for us*.
          2.  Explicitly deny that the computer (or a human player) literally contains a discrete internal state with the propositional content *"Sacrificing the queen is necessary for victory"* or *"I desire victory"* as a causally active structured representation.
          3.  Explain the behavior in terms of lower-level dynamics: e.g., complex pattern recognition, evaluation functions minimizing prediction errors about future board states, learned associations between board configurations and successful outcomes, dynamic weighting of positional factors – operating without compositional syntactic structures corresponding to the propositions.
          4.  *Avoid* simply saying "beliefs aren't real" or "it's all physical" without specifying the denial of *propositional structure* and the sufficiency of the dynamics.

  **Material to Omit & Why:**

  1.  **The Full Phlogiston/Caloric Analogy:** While tempting, introducing these historical cases *early* or in detail risks framing EM *only* as "folk psychology is a false theory like phlogiston". This oversimplifies and diverts attention from the *specific argument about propositional attitudes as structured vehicles* and the *positive account in terms of dynamics*. It makes EM seem like a generic "out with the old, in with the new" claim. Mention it *briefly* only *after* the core argument is established (Step 5) to illustrate *type* of elimination, but don't dwell.
  2.  **Extended Debates about Phenomenal Consciousness (Qualia):** This is a massive, distinct issue. EM is primarily about *intentional* states (aboutness), not necessarily raw feels. Introducing consciousness conflates issues, derails the focus on propositional attitudes, and opens tangents (e.g., "But what about the *feeling* of believing?"). Stick to cognition and behavior explanation.
  3.  **Canonical Quotations (e.g., Churchland's "common-sense psychology is false...")** out of context: Quoting provocative EM soundbites *before* building the argument invites misunderstanding and knee-jerk reactions ("That's crazy!"). If used at all, deploy them *only* at the very end (Step 5/6) to encapsulate the *already constructed* position, not as a starting point. The focus must be on the *logic* of the argument.
  4.  **Detailed Criticisms of EM (e.g., Self-Refutation, Phenomenology):** This is a *constructive* session aimed at understanding the core EM claim. Diving into major objections consumes time needed for careful construction and risks leaving students only knowing *why EM might be wrong*, not *what it actually asserts*. Save critiques for a follow-up session.
  5.  **General Debates about Physicalism vs. Dualism:** Assume broad physicalism as background. EM is a specific position *within* physicalism. Rehashing general arguments for physicalism wastes time and dilutes the specific eliminative thesis about propositional attitudes.

  **Session Flow Summary:**
  1.  (10 min) Grounding: Explaining Behavior
  2.  (15 min) Our Tool: Folk Psychology & Propositional Attitudes (as Overlay)
  3.  (20 min) Revealing the Overlay: Thermoregulation Example (Attribution vs. Mechanism)
  4.  (15 min) Generalizing: Dispositional Dynamics & Predictive Processing (The Positive Picture)
  5.  (15 min) The Eliminative Claim (Specific Target: Propositional Attitudes as Vehicles)
  6.  (10 min) Addressing Misconceptions & Q&A
  7.  (5 min) Check for Understanding (Chess Computer)

  This sequence builds the conceptual dependencies carefully, uses the anchoring example to make the optionality of propositional attitudes concrete, pre-empts and counters key misconceptions at the point they are likely to arise, and includes a targeted check focusing precisely on the eliminative claim about propositional attitudes as structured representations. Omitting extraneous material keeps the focus sharp on the core conceptual argument.
