  I've got a seminar next tuesday where I'm defending this tweak to anthropic reasoning that I think solves Bostrom's presumptuous philosopher problem without just retreating to self-sampling. My move is that we should restrict the reference class hierarchically instead of flat—weighting each theory by the structural complexity of the observer-generating mechanism it implies—so that SIA doesn't automatically favor enormous universes, because the complexity penalty cancels out the population bonus. The room will be my department's philosophy-of-science reading group: two Bayesians who basically have Bostrom memorized, one cosmologist who thinks all of this is metaphysics with extra steps, and a grad student who's actually writing on reference-class issues right now. I need a prep sheet for the Q&A, not an essay. Give me the objections in the order they'll actually come, phrased the way those people would phrase them—especially the Bayesians. For each one I want to know what I should concede up front, what I should hold firm on, and where my reply is weakest. Include the objection I'm secretly hoping nobody asks, plus the single reply that has to land or my argument collapses. Don't give me a bibliography or reading list; I need tactics, not sources. At the very end, summarize my weakest flank in one sentence on a line that starts with Verdict:
