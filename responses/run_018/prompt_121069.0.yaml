answer: |-
  ## Desiderata for Theories of Personal Persistence Through Gradual Mind Uploading/Substrate Replacement

  Any adequate theory of personal identity under gradual substrate replacement must navigate profound conceptual challenges. The following desiderata outline the minimum requirements, grounded in core philosophical puzzles and empirical constraints:

  1.  **Substrate Transition Asymmetry (Non-negotiable)**
      *   **Requirement:** The theory *must* provide a principled reason why gradual neuron-by-neuron replacement (where biological neurons are replaced *in situ* by functionally equivalent synthetic units, maintaining continuous causal integration) preserves personal identity, while instantaneous destructive scanning/uploading (where the biological brain is destroyed and a computational duplicate is activated elsewhere) does *not*, or vice-versa. It cannot treat them as equivalent by default.
      *   **Motivation:** Intuition strongly suggests a moral and existential difference between slowly replacing parts while consciousness continues and being destroyed to create a copy. Theories collapsing this distinction (e.g., strict patternism) face the "fission" problem and violate core intuitions about survival. Accounting for this asymmetry is fundamental.

  2.  **Reversibility Handling (Non-negotiable)**
      *   **Requirement:** The theory must specify the ontological status during partial (e.g., 40%) synthetic replacement *when reversal to biological substrate is possible without data/functional loss*. It must state whether the subject is: (a) unequivocally the original singular entity, (b) a branching entity (original + potential synthetic offspring), (c) in a genuinely ambiguous or liminal state, or (d) something else. Crucially, it must state whether identity survives the *round-trip* (replace 40% synthetic, then reverse back to full biological).
      *   **Motivation:** Reversibility challenges theories relying on irreversible commitment (like many "no branching" psychological views) or strict physical continuity. It probes whether identity depends on the *direction* of change or the *potential* for divergence. Survival of the round-trip tests if synthetic components can be truly integrated into the self and then shed without loss of self.

  3.  **Extended Cognition Integration (Non-negotiable)**
      *   **Requirement:** The theory must incorporate the subject's pre-existing, deeply integrated external cognitive scaffolding (e.g., digital memory stores, calculation aids, sensory extensions) as constitutive parts of the cognitive system *prior to any internal replacement*. It must explain how these external components relate to identity-bearing continuity *once internal substrate replacement begins*, avoiding an arbitrary contraction of the self-boundary to the skull/skin.
      *   **Motivation:** The Extended Mind Thesis (Clark & Chalmers) demonstrates cognition isn't skull-bound. A theory that ignores this pre-uploading reliance on external tools cannot coherently draw a line *only* when internal replacement starts. It must handle the blurry boundary and avoid inconsistency in what counts as "part of the mind".

  4.  **Branching Tolerance at Intermediate Stages (Non-negotiable)**
      *   **Requirement:** If high-fidelity backup snapshots exist at various points during gradual replacement, the theory must provide criteria for determining *why the continuously forward-moving stream of consciousness/function in the original body (or its gradually replaced substrate) is the original person*, rather than a backup activated later being the original (or both being equally original). It must address the "branching problem" at *every* stage, not just the start or end.
      *   **Motivation:** Backups create potential fission scenarios at every moment. A theory must explain what constitutes the "locus" of persistence *during* the process that privileges the ongoing stream over perfect static copies or delayed activations, avoiding the conclusion that every backup is equally the original.

  5.  **Phenomenal Binding Continuity (Preference: Strongly held by certain camps)**
      *   **Requirement:** The theory must address whether the *subjective unity of consciousness* (phenomenal binding) being continuously maintained (even if degraded or altered in character) across substrate gaps is necessary for survival. It must distinguish between:
          *   A temporary *functional interruption* (e.g., deep anesthesia) compatible with survival.
          *   A *fragmentation* of binding (e.g., isolated modules processing without unified awareness).
          *   A genuine *loss of continuity* constituting death/cessation.
      *   **Motivation:** Subjective experience is central to our concept of self. A theory ignoring phenomenal continuity risks reducing identity to mere function, potentially allowing for "zombie" survival. However, demanding *perfect, uninterrupted* binding may be too strict (as in sleep). The theory must grapple with the nature of conscious unity during transition.

  6.  **Conceptual Distinction Maintenance (Non-negotiable)**
      *   **Requirement:** The theory *must not collapse* the following distinctions:
          *   **Strict Numerical Identity vs. Psychological Continuity:** Being literally the *same entity* vs. being a psychologically connected successor.
          *   **Survival vs. Flourishing:** Continued existence vs. well-being or quality of existence.
          *   **Original Biological Organism vs. Functionally Equivalent Successor System:** The persistence of the specific biological entity vs. the persistence of its cognitive/functional profile in a new medium.
      *   **Motivation:** Conflating these leads to fatal ambiguities. Claiming the successor "is" the original organism is biologically false. Equating survival with perfect psychological continuity ignores the core question of *who* is experiencing that continuity. Equating survival with flourishing ignores the possibility of surviving but diminished.

  **Key Constraints to Respect:**

  *   **Neural Plasticity:** The brain is not static hardware; it constantly rewires and adapts. Theories demanding strict structural isomorphism are empirically implausible. Persistence must tolerate significant functional reorganization.
  *   **The Extended Mind Thesis:** Cognition demonstrably incorporates external tools seamlessly. Theories cannot arbitrarily privilege "internal" biological components without justification when external ones play identical functional roles prior to uploading.
  *   **Gradualism & Vagueness:** Real biological processes (including potential substrate replacement) are gradual and often lack sharp boundaries. Theories demanding absolute precision (e.g., exactly which neuron replacement causes death) may be metaphysically incoherent or practically useless.

  **Potential Conflicts:**

  *   **Bodily Continuity vs. Substrate Independence:** Desideratum 1 (Substrate Asymmetry) often relies on some form of continuous physical implementation (favoring animalism/embodiment), while Desideratum 3 (Extended Cognition) and the goal of full substrate replacement push strongly towards functionalism/patternism. Reconciling the importance of the *original* physical process with the *irrelevance* of specific substrate in cognition is extremely difficult.
  *   **Non-Branching vs. Reversibility:** Desideratum 2 (Reversibility) implies potential branching is possible *without* identity death during the reversible phase, conflicting with theories (like many psychological continuity views) that make branching fatal to strict identity. Desideratum 4 (Branching Tolerance) also pressures non-branching requirements.
  *   **Phenomenal Binding Strictness vs. Gradual Change:** Insisting on uninterrupted, unified phenomenal binding (Desideratum 5) as necessary for survival might conflict with the likely reality of altered or fragmented consciousness during complex substrate transitions implied by Desideratum 1 and the gradualism constraint.

  **Evaluation of Broad Theoretical Families:**

  1.  **Psychological-Continuity Theories (e.g., Parfit-influenced):**
      *   **Strengths:** Handle Desideratum 3 (Extended Mind) well by focusing on cognitive function/connection. Can potentially handle gradual replacement (D1) by emphasizing overlapping chains of psychological connection. Distinguish identity/survival/flourishing (D6).
      *   **Weaknesses:** Struggle profoundly with Desideratum 1 (Substrate Asymmetry) - gradual vs destructive copying seem equivalent if psychology is copied. Face extreme difficulty with Desideratum 2 (Reversibility) and Desideratum 4 (Branching) – branching is typically fatal to strict identity. Often neglect or struggle with Desideratum 5 (Phenomenal Binding) and bodily aspects.

  2.  **Embodied/Animalist Accounts:**
      *   **Strengths:** Naturally satisfy Desideratum 1 (Substrate Asymmetry) - gradual replacement preserves the living organism, destruction does not. Provide a clear answer to Desideratum 4 (Branching) - the organism is here, not there. Can handle reversibility (D2) as preserving the organism.
      *   **Weaknesses:** Fail Desideratum 3 (Extended Mind) spectacularly by rigidly contracting identity to the biological organism, ignoring constitutive external tools. Struggle with the *goal* of substrate independence – if identity *is* the organism, full replacement is death. Ignore or downplay Desideratum 5 (Phenomenal Binding). May struggle with the gradualism constraint and neural plasticity.

  3.  **Patternist/Functionalist Approaches:**
      *   **Strengths:** Excel at Desideratum 3 (Extended Mind) by defining the mind by its functional/computational role, regardless of location. Embrace Desideratum 6's distinctions readily. Handle neural plasticity and gradualism well. Align with the goal of substrate independence.
      *   **Weaknesses:** Fail Desideratum 1 (Substrate Asymmetry) - gradual and destructive copying seem equivalent if the pattern is preserved. Make Desideratum 2 (Reversibility) and Desideratum 4 (Branching) catastrophic - any branching creates equally valid originals, rollback creates a *new* original. Often neglect Desideratum 5 (Phenomenal Binding), reducing consciousness to function. Struggle with the "too many minds" problem during gradual replacement.

  No existing theory satisfies all desiderata comfortably. The core tension lies between preserving the unique continuity of the original biological process (emphasized by asymmetry and reversibility) and accommodating the functional blurring of boundaries and potential for substrate independence (emphasized by extended cognition and gradualism). A successful theory must bridge this gap without collapsing crucial distinctions.
