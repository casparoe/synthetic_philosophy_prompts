  For (b) discontinuity likelihood: At 0.85 - given cosmic timescales and potential for AI divergence, deep discontinuity seems probable. But I must note uncertainty about evolutionary/cultural paths.

  For (c) Scheffler's implicit reliance: Strong 0.95 here. His "collective afterlife" framing clearly assumes recognizably human successors, not just causal chains. The text consistently references shared valuation.

