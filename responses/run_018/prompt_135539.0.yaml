answer: |-
  Here’s the exam prompt, model answer, and marking scheme tailored to your specifications.

  ---

  ### **PHIL 340: Well-Being and Value | Final Exam Essay Prompt**

  **Question:**  
  A sophisticated defender of hedonism proposes to solve the heterogeneity problem (the objection that pleasures lack a common phenomenological quality) by arguing that all pleasures share a *sub-personal functional marker*: a non-conscious neurobiological "valuation stamp" that tags experiences as "to-be-pursued." This marker, while not phenomenally accessible, is claimed to unify disparate pleasures functionally. Critically evaluate whether this move:  
  (a) Successfully rescues hedonism from the heterogeneity objection, or  
  (b) Collapses hedonism into desire-satisfaction theory.  
  In your response, address the further objection that if the unifying element of pleasure is unconscious, hedonism loses its core appeal as a theory of *felt* well-being and becomes an externalist account divorced from subjective experience.  

  *(Write your answer in 90 minutes. Closed book.)*

  ---

  ### **Model Answer (650 words)**  

  The heterogeneity problem challenges classical hedonism by arguing that pleasurable experiences (e.g., eating cake, solving math puzzles) share no single, identifiable phenomenological quality. The proposed solution—replacing a common feeling with a sub-personal "valuation stamp" that marks experiences as worth pursuing—appears innovative but ultimately fails. While it technically resolves heterogeneity by providing a functional unity, it covertly reduces hedonism to desire-satisfactionism and abandons hedonism’s foundational commitment to conscious well-being.  

  First, the functional marker does resolve the heterogeneity problem *on its own terms*. If all states called "pleasures" are unified by an unconscious neurobiological signal that disposes agents to pursue them, heterogeneity in conscious feeling becomes irrelevant. This reframes pleasure as a natural kind defined by causal-functional role (e.g., dopamine-driven reward signaling), sidestepping the need for a shared phenomenology. In this sense, hedonism survives heterogeneity—but at a significant cost.  

  The critical weakness is that this move collapses hedonism into desire-satisfaction theory. Desire-satisfactionism defines well-being as the fulfillment of desires (whether conscious or not), and the "valuation stamp" is functionally identical to a desire: it is a sub-personal state that *motivates pursuit* and *confers positive valence*. If pleasure is merely whatever is tagged by this marker, then "pleasure" reduces to "satisfaction of sub-personal motivational states." This strips hedonism of its distinctiveness. Hedonism traditionally claims that *conscious experiences* constitute well-being; desire theories often include non-conscious satisfactions (e.g., posthumous desires). By grounding pleasure in an inaccessible marker, the revised hedonism implicitly adopts desire-satisfaction’s broader ontology.  

  This leads to the deeper objection: sacrificing phenomenology voids hedonism’s intuitive appeal. Classical hedonism (from Epicurus to Bentham) positions well-being as *lived experience*. If the "valuable" element of pleasure is a hidden functional tag, well-being becomes external to consciousness—an agent could have "well-being" without any felt joy (e.g., if the marker fires erroneously during suffering). This contravenes hedonism’s raison d'être: to explain why *feeling good* matters. The theory becomes externalist, akin to objective-list theories, where value is determined independently of subjective states. If well-being hinges on unseen mechanisms, why call it "hedonism" at all? The theory loses its advantage as an account of *felt* welfare.  

  A defender might retort that the marker *causes* positive feelings, preserving the link to phenomenology. But this fails: if the feeling is heterogeneous and the marker is the true source of value, the feeling is epiphenomenal to welfare. Alternatively, if the feeling is necessary, heterogeneity resurfaces. Either way, hedonism’s core is undermined.  

  In conclusion, the functional marker resolves heterogeneity only by abandoning phenomenological hedonism. It reduces to desire-satisfactionism by defining pleasure via motivational states and becomes an externalist theory detached from conscious well-being. While ingenious, this revision sacrifices hedonism’s essence to save its structure—a pyrrhic victory. The heterogeneity problem thus remains a potent critique, revealing hedonism’s inability to reconcile unity in value with diversity in experience.  

  ---

  ### **Marking Scheme (20 Total Marks)**  
  *Each criterion is worth 4 marks. Deduct 2 marks for partial/unclear treatment; deduct 3–4 for omission or major error.*

  1. **Accurate Exposition of the Functional-Marker Solution**  
     - Must explain how the marker resolves heterogeneity by providing a non-phenomenal, functional unity.  
     - *↓ A to B Error:* Misrepresenting the marker (e.g., confusing it with a conscious judgment or conflating it with the "false pleasure" problem).  

  2. **Collapse into Desire-Satisfactionism**  
     - Must argue that the marker reduces pleasure to the satisfaction of sub-personal desires/motivational states.  
     - *↓ A to B Error:* Treating the marker as compatible with hedonism without addressing its equivalence to desire-satisfaction.  

  3. **Phenomenological Objection**  
     - Must contend that an unconscious marker severs hedonism from its foundation in *felt* well-being.  
     - *↓ A to B Error:* Ignoring this objection or claiming conscious feelings "accompany" the marker without justifying why this saves hedonism.  

  4. **Externalist Critique**  
     - Must show how the move makes hedonism externalist (value is independent of consciousness), undermining its subjective appeal.  
     - *↓ A to B Error:* Accepting externalism as compatible with hedonism’s aims.  

  5. **Overall Critical Evaluation & Synthesis**  
     - Must weigh costs/benefits and conclude whether hedonism is "saved" or "collapsed," synthesizing points 1–4.  
     - *↓ A to B Error:* Inconclusive reasoning; treating objections in isolation without showing their cumulative force.  

  ---

  ### **Notes for Grading**  
  - **A-range (16–20):** Hits all 5 points, uses precise philosophical terminology, anticipates counterarguments.  
  - **B-range (12–15):** Omits/mishandles 1–2 key points (e.g., skips the desire-satisfaction collapse or externalism).  
  - **C/D-range (≤11):** Superficial treatment of the marker, confusion between heterogeneity and other problems (e.g., falsity of pleasure), or failure to engage the consciousness objection.  

  This prompt forces engagement with meta-ethical tensions in hedonism while avoiding well-trodden examples. The model answer balances technical analysis with hedonism’s historical commitments, and the marking scheme penalizes common oversights.
