  ### Decision-Tree Taxonomy: Weakness of Will and Hyperbolic Discounting

  **Instructions for use:**  
  Answer each binary question below based solely on concrete diagnostic commitments. Follow the branches until you reach a terminal leaf. The niche diagnostic case (*local reversal*) is:  
  *An agent consistently chooses the larger-later reward when both options are distant (e.g., "¥1,000 in 1 year" vs. "¥1,100 in 1 year + 1 month"), but when both options are within one hour (e.g., "¥1,000 now" vs. "¥1,100 in 1 hour"), she chooses the smaller-sooner reward. Despite this, she never violates her long-term plan to maximize overall wealth.*

  ---

  #### Branching Questions  
  1. **Can weakness of will (akrasia) genuinely occur?**  
     - **No** → Go to Leaf 1 (Socratic denial).  
     - **Yes** → Proceed to Question 2.  

  2. **Does explaining weakness of will require events occurring at different times (e.g., immediate vs. delayed rewards)?**  
     - **Yes** (Temporal proximity essential) → Proceed to Question 3.  
     - **No** (Failure could occur with identical time horizons) → Go to Leaf 2 or 3.  

  3. **Does accommodating preference reversal require two distinct selves (e.g., long-run vs. short-run evaluators) within the agent?**  
     - **Yes** (Split-self required) → Go to Leaf 5 or 6.  
     - **No** (Unified decision-maker with non-constant preferences suffices) → Go to Leaf 4 or 7.  

  ---

  #### Terminal Leaves (Views)  
  *Mapped by answer patterns to branching questions. Unoccupied cells are flagged.*

  | Leaf | Path (Q1→Q2→Q3) | View Description | Niche Case: Is Local Reversal Weakness of Will? |
  |------|------------------|------------------|-------------------------------------------------|
  | **1** | No → (any) | **(1) Socratic denial**: Genuine akrasia is impossible. What appears as weakness is ignorance of the good; no one willingly acts against their knowledge of what is best. | *Niche case irrelevant (akrasia impossible)* |
  | **2** | Yes → No → Unified | **(2) Aristotelian account**: Akrasia occurs when the agent retains the correct universal principle (e.g., "healthy eating is good") but fails in applying it to particulars (e.g., "this cake is unhealthy"), due to overpowered passions. *Temporal proximity not essential; failure in practical reasoning*. | **No**: Local reversal is a predictable preference shift, not a failure against a universal premise. |
  | **3** | Yes → No → Split | **(3) Davidson’s view**: Incontinent action is acting against one’s own *all-things-considered best judgment* (e.g., judging "abstaining is best" yet drinking). *Requires unified agency, not temporal conflict*. | **No**: The agent’s global plan aligns with her best judgment; local reversal isn’t akratic. |
  | **4** | Yes → Yes → Unified + Niche=Yes | **(4) Hyperbolic-discounting reductionism**: Weakness of will is *only* present-biased intertemporal choice. Valuing immediate rewards more intensely explains reversals without moralizing. | **Yes**: Local reversal is *by definition* weakness of will (present bias). |
  | **5** | Yes → Yes → Split | **(5) Planner-doer dual-self model**: Akrasia arises from conflict between a long-term "planner" (maximizing global utility) and a short-term "doer" (myopic gratification). Reversals reflect temporary dominance of the doer. | *Niche case not required for separation* |
  | **6** | Yes → Yes → Unified + Niche=No | **(6) Structural-rationality view**: Time-inconsistent reversal is rational when evaluative perspectives shift (e.g., "now" vs. "future" selves). No failure of rationality or will—just dynamically coherent preferences. | **No**: Local reversal is rational context-sensitive evaluation, not a willpower failure. |
