prompt: |-
  If George Orwell were writing today and had to deal with AI-generated political text—like those fluent, empty slogans LLMs churn out that sound like his old essay Politics and the English Language but have no human author behind them—how do you think he'd update his critique? I'm trying to figure out whether he'd see algorithmic doublespeak as just a scaled-up version of the dying metaphors he hated, or if the lack of an intentional speaker makes it fundamentally different. Specifically, do you think he'd argue that automated langauge is actually less dangerous because nobody's deliberately lying, or more dangerous precisely because there's no one to hold accountable? Also, would he still insist on concrete language as the antidote if the problem isn't human laziness but a statistical model optimizing for plausability?
