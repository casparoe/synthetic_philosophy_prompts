answer: |-
  Here's your desiderata list for evaluating historical periodizations — the non-negotiable core versus the negotiable preferences, with hard constraints flagged. Treat this as an ontology audit under trace-based epistemology:

  **Non-Negotiable Desiderata (Failure Here = Projection)**  
  1. **Trace Anchoring:** Must demonstrably organize primary sources/artifacts better than rival frameworks. If "Middle Ages" doesn't reveal patterns in 12th-century guild records or siege tactics that random slices ignore, it's ornamental.  
  2. **Causal-Structural Coherence:** Must identify *mechanisms* (economic, technological, epistemic) that persist/recur within bounds. Feudalism's lord-vassal-serf triad ≠ Victorian moralizing.  
  3. **Boundary Legibility:** Must specify *what changed* at transitions (even if gradual). "Renaissance begins circa 1400" fails unless you define what structural element(s) shifted (e.g., classical textual recovery rates, artistic patronage models).  
  4. **Scale-Matching:** Scope must align with evidence. Claiming "Scientific Revolution" was global 1500-1700 collapses when Chinese *kaozheng* scholarship and Ottoman observational astronomy show divergent trajectories. Regional variation invalidates *universal* claims.  

  **Negotiable but Diagnostic Preferences (Camp Choices)**  
  5. **Contemporary Self-Awareness:** *Not required.* Romans didn't know they were "Ancient." This is a category error — periods analyze systemic conditions, not subjective experience. (But if contemporaries *did* sense a rupture (e.g., Petrarch decrying "Dark Ages"), it strengthens the case.)  
  6. **Boundary Sharpness:** Fuzzy borders are acceptable (even preferable). Demanding 1492-like precision for "end of Middle Ages" is anti-historical. Continuity-discontinuity debates are about *rate* of change, not period validity.  
  7. **Global vs. Regional Validity:** Regional coherence suffices *if* labeled precisely (e.g., "Western European Middle Ages"). Forcing "Renaissance" onto Ming China is projection; letting regional periods exist independently is rigorous.  

  **Jointly Impossible Clusters (Pick Your Poison)**  
  - **Precision + Universality Trap:** You cannot demand sharp chronological boundaries *and* global applicability. (The "Scientific Revolution" dies here.)  
  - **Causal Depth + Contemporary Recognition:** Deep structural analysis (e.g., credit instruments enabling exploration) rarely matches elite self-perception (e.g., "rebirth of arts").  
  - **Total Coherence vs. Pedagogical Utility:** A perfect causal-structural epoch (e.g., "The Little Ice Age Climate Regime") may be too complex for textbooks, but oversimplified labels ("Dark Ages") distort causality.  

  **The Eliminator Desideratum**  
  **If I must pick one:** **Causal-Structural Coherence** eliminates most popular narratives. Why?  
  - "Renaissance" often fails: Italian art/literary shifts ≠ concurrent socioeconomic realities elsewhere. No unified causal engine.  
  - "Scientific Revolution" fractures: Baconian empiricism vs. Continental math vs. persistent alchemy lack integration.  
  - "Middle Ages" survives *only if* anchored to specific mechanisms like manorialism/church authority — but Victorian "benighted age" projections crumble.  

  **Your Test Cases Resolved**  
  - **1300 lacking "Middle Ages" concept:** Irrelevant (see Desideratum 5). The question is whether the label elucidates *their* constraints/possibilities.  
  - **Scientific Revolution in Italy vs. China:** Regional variation kills *global* claims but not *regional* validity. A good theory must specify scope: "Galilean-Cartesian transformation in Europe" survives; "global revolution" does not.  
  - **Pedagogical shorthand vs. causal epoch:** Demand the latter. If it can't bear causal weight (e.g., "Enlightenment" as just "ideas"), discard it as projection.  

  **Verdict**  
  Periods are real if they carve reality at causal joints. The rest is taxonomy. Your friend is half-right: "Middle Ages" as a *moral category* is Victorian fiction, but as a *structural phase* of European feudalism, it’s trace-anchored. The burden is on the claimant: show me the mechanisms, or it’s wallpaper.
