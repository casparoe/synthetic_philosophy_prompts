prompt: |-
  I am drafting an essay—tentatively titled "Actual Worlds and Unwritten Drafts"—that borrows from modal realism to think about literary revision. I want your comments on its philosophical accuracy and on whether the analogy does any real conceptual work, rather than merely dressing a familiar artistic practice in metaphysical language.

  Here is the skeleton of the argument. David Lewis holds that possible worlds are concrete, spatiotemporally isolated totalities, and that "actual" functions indexically: this world is actual for its inhabitants precisely because they are here, not because it possesses some privileged ontological status. Counterpart theory, rather than transworld identity, explains how an object in one world resembles an object in another. Applying this to fiction, I consider an author who writes a first draft of a novel in which a protagonist dies at sea, then revises the manuscript so that she survives and returns to port. On a naive modal-realist reading, both drafts describe concrete worlds; neither is more real than the other except relative to the author who occupies one. But the revision process itself raises a puzzle: does the author, by altering the manuscript, stand in a causal or descriptive relation to the world in which the protagonist survives? Lewis denies that worlds are created—he treats them as already existing—so the author cannot be said to bring about the survival-world. Yet there is an intuitive sense in which revision selects, or makes salient, one possibility over another.

  My essay then asks whether counterpart theory can be extended to fictional characters across drafts. In Lewis's framework, a real person has counterparts in other worlds based on qualitative similarity. A fictional character, however, lacks spatiotemporal location in any world except those described by the text. If we treat each draft as specifying a distinct concrete world, the protagonist of Draft One and the protagonist of Draft Two are not identical; they are, at best, counterparts bound by narrative resemblance. This seems to dissolve questions about whether the author changed the character, replacing them with questions about which counterpart relation the author has chosen to emphasize.

  I am particularly unsure about three points, and I would like your comments on each.

  First, accuracy: does Lewis's indexical analysis of "actual" genuinely block the idea that an author can move between worlds through revision, or am I importing a causal theory of reference that Lewis explicitly rejects? Second, coherence: is it consistent with modal realism to speak of fictional worlds as concrete in the same sense as non-fictional ones, given that they depend for their description on an author's mental states? Or does this collapse into a form of ersatzism that Lewis criticized? Third, interest: does this framing illuminate anything about the phenomenology of revision—the sense that one is discovering a truer version of a character rather than inventing an alternative—or does it merely translate that feeling into ontological jargon?

  Please respond in American English. I am not asking for a bibliography, a reading list, or citations to secondary literature; I am interested only in whether the reasoning holds together and where it might be strengthened or abandoned.
reasoning: |-
  Okay, the user is working on an essay that uses David Lewis's modal realism to analyze literary revision. They've outlined their argument and have three main concerns: accuracy, coherence, and interest. Let me start by unpacking each of their points.

  First, the user is worried if Lewis's indexical view of "actual" prevents authors from moving between worlds during revision. They might be concerned that their analogy implies causation between worlds, which Lewis explicitly denies. I need to recall that for Lewis, worlds are causally isolated. So, when an author revises a draft, they're not causing a different world to exist; they're just describing another existing one. The author's act of writing is within their actual world, producing texts that refer to other possible worlds. The user might be conflating the creation of the text with the creation of the world. Emphasizing that the text is a concrete artifact in the actual world, while the worlds described are separate, could clarify this.

  Second, the coherence issue: treating fictional worlds as concrete like non-fictional ones. Lewis distinguishes between the actual world and the worlds described by fiction. Fictional texts are part of the actual world, but they describe other possible worlds. The user might be blurring this distinction. If fictional worlds depend on the author's mental states or the text's existence, that risks collapsing into ersatzism. Lewis would say the possible worlds exist independently, regardless of being described. The user needs to frame it as the text referring to a pre-existing possible world, not creating it. Highlighting the role of the text as a set of propositions that correspond to a concrete world could help maintain coherence.

  Third, the interest question: does this analogy add value to understanding revision? The user mentions the phenomenology where authors feel they're discovering a truer version. The counterpart theory here can show that revision is selecting a counterpart based on resemblance. This might resonate with authors who feel their characters have essential traits. But the risk is over-ontologizing a subjective experience. The user should focus on how this framework shifts perspective from identity to counterpart relations, which can reframe discussions about character development across drafts. This could offer a new lens, but they need to avoid claiming it's the only explanation.

  The user's deeper needs might include wanting their philosophical analogy to be both rigorous and insightful. They might fear that their argument is merely dressing up literary concepts in complex terms without real payoff. They need assurance that the analogy holds under scrutiny and that it provides fresh insights into revision. They also might want to avoid common pitfalls in applying modal realism to fiction, like conflating possible worlds with fictional worlds or introducing causation where it doesn't belong.

  I should check if the user is correctly applying counterpart theory to characters across drafts. Each draft describes a different world, so the protagonist in each is a different individual. The counterpart relation based on narrative resemblance makes sense here. This avoids questions of changing a single character, focusing instead on selecting which counterpart to highlight. This could be a strong point if presented clearly.

  For the interest aspect, the analogy might help authors conceptualize revision as exploring possibilities rather than altering a fixed narrative. However, the user should acknowledge that this is a philosophical interpretation, not an empirical claim. The value lies in shifting the discourse, not proving ontological truths.

  In summary, the user needs to tighten the distinction between text and world, ensure they're not smuggling in causation, and frame the counterpart theory as a useful tool for understanding revision. They should also balance the theoretical insights with practical implications for literary practice, showing how this perspective changes how we talk about revision without overreaching.
answer: |-
  This is a fascinating and sophisticated application of modal realism to literary process. Your core analogy is philosophically intriguing and holds together surprisingly well on Lewisian grounds, *if* carefully qualified. Let's break down your three points:

  1.  **Accuracy: "Actual" and Authorial Movement**
      *   **Lewis's View:** You correctly state Lewis's core position: Worlds are causally isolated, and "actual" is indexical. An author writing/revision actions occur entirely *within* the actual world (our concrete spacetime). They are manipulating a concrete artifact (the manuscript/text) *in* this world.
      *   **Does it Block Movement?** Yes, absolutely and effectively. The author isn't "moving" between worlds in any literal, causal, or spatiotemporal sense. They are stuck firmly in the actual world. Their act of revision doesn't *cause* the survival-world to exist (it always did) nor does it transport the author *to* it.
      *   **Causal Theory of Reference?** You are *not* importing a rejected causal theory here. Your puzzle arises precisely *because* Lewis rejects causation between worlds. The puzzle is: How do we describe the author's relation to the survival-world *given* that they didn't create it and don't interact with it? The key is to focus on the author's actions *within* the actual world:
          *   **Descriptive Relation:** By writing/revising the text, the author is *describing* the survival-world (and previously described the death-world). The text is a set of propositions (or a concrete object encoding them) that, according to Lewis, corresponds to (or "describes") a concrete possible world where those propositions are true.
          *   **Selection/Salience:** Revision is the process of the author *selecting which* possible world (from the infinitely many that exist) they wish to *describe* via their text. They make *that particular world* salient *for us* by producing a text that corresponds to it. They "choose to tell the story *of*" the survival-world counterpart rather than the death-world one. The causal act (writing) is local to the actual world; the relation to the other world is purely referential/descriptive.

  2.  **Coherence: Concrete Fictional Worlds vs. Ersatzism**
      *   **The Tension:** This is the trickiest point, and Lewis himself grappled with fiction. The core tension: Lewisian worlds are *maximally* concrete and *independent*. Yet, a "fictional world" *as we know it* seems dependent on the author's mental states and the physical text existing in the actual world.
      *   **Lewis's Solution (Roughly):** Lewis distinguishes:
          *   **The Possible World (PW):** The concrete, independent totality that *makes the story true*. This exists regardless of being described.
          *   **The Story (Text):** A concrete artifact (the manuscript) in the actual world, consisting of sentences (or propositions).
          *   **The Act of Storytelling:** An event in the actual world where an author produces the text.
      *   **Avoiding Ersatzism:** For Lewis, the PW *described by* the text exists concretely and independently. The text doesn't *create* it; the text is *made true by* it. The dependence is *epistemic* and *referential* for *us*, not ontological for the *world itself*. The PW doesn't depend on the author's mind; the author's mind (and text) *picks out* which pre-existing PW the story is *about*.
      *   **Your Analogy's Coherence:** Your setup *can* be coherent *if* you rigorously maintain:
          *   Draft One describes Concrete World A (death).
          *   Draft Two describes Concrete World B (survival).
          *   Both A and B exist independently and concretely.
          *   The author, in the actual world, first produces Text T1 (referring to A), then later produces Text T2 (referring to B).
      *   **The Risk:** The risk of collapsing into ersatzism comes if you start thinking of the "fictional world" *as* the text or *as* constituted by the author's mental activity. Lewis insists the PW is *out there*, concrete, and the text merely points to it. As long as you treat each draft's *content* as describing a distinct, independent, concrete PW, you stay Lewisian. The author's revision is changing *which* PW they are *describing*, not changing *the nature* of the PW they are describing.

  3.  **Interest: Illuminating Revision or Just Jargon?**
      *   **Potential Illumination:** This framing *does* offer conceptual work beyond mere jargon, particularly regarding the phenomenology you mention:
          *   **"Discovering a Truer Version":** The counterpart framework beautifully captures this feeling. The author isn't literally altering a single character across worlds (impossible). Instead, they are exploring the space of qualitative resemblance. The "truer version" feeling might arise when the author judges that Counterpart B (in World B, described by Draft Two) bears a *stronger qualitative resemblance* to the "core essence" or intended conception of the character than Counterpart A (in World A, described by Draft One) did. Revision becomes the search for the counterpart that best matches the author's evolving (or clarifying) sense of the character's key properties *across* possible narrative scenarios. It shifts focus from "changing X" to "finding the best representative of X-type in this narrative situation."
          *   **Selecting Possibilities:** The analogy powerfully reframes revision as an act of *selection* from a plenitude of pre-existing possibilities (worlds), rather than pure invention *ex nihilo*. This resonates with many authors' descriptions of feeling like they are uncovering what "really happened" to the characters.
          *   **Dissolving Identity Puzzles:** As you note, it cleanly dissolves the metaphysical headache of "is it the *same* character?" across drafts. It replaces it with the more tractable (and artistically relevant) question: "How strong is the counterpart relation (based on narrative resemblance) between Character-in-Draft1 and Character-in-Draft2, and what properties define that relation?"
      *   **The Jargon Risk:** The risk exists if you *only* use the modal framework to *restate* the observation that authors change their minds or explore alternatives. The value lies in *how* it reframes the questions and phenomena:
          *   Instead of "Did the character change?" --> "What counterpart relations hold?"
          *   Instead of "Did the author invent the survival?" --> "Which existing possibility (world) did the author select to describe?"
          *   Instead of "Where does the character 'really' exist?" --> "Which counterpart best realizes the author's conception across the described worlds?"

  **Strengthening the Argument:**

  1.  **Emphasize the Text's Concreteness:** Hammer home that the *author's actions* (thinking, writing, deleting, revising) and the *physical manuscript/digital file* are concrete parts of the *actual* world. Their relation to the *described* worlds (A & B) is *descriptive reference*, not causation or travel.
  2.  **Clarify "Fictional World":** Consistently distinguish between:
      *   The actual-world text/manuscript/mental activity.
      *   The concrete possible world(s) that *make the text true* (which exist independently).
      Avoid phrases like "the fictional world depends on the author." Instead, say "the *description* of the possible world depends on the author" or "the author *selects which* possible world is described."
  3.  **Deepen the Counterpart Analysis for Characters:** Explicitly define what the relevant qualitative similarities are for counterpart relations *across drafts*. Is it name? core personality traits? narrative role? relationship to other characters? This is where the analogy does real work – forcing a precise articulation of what makes Character-in-Draft2 feel like a "version of" Character-in-Draft1. This directly engages the phenomenology of discovery.
  4.  **Acknowledge the Counterintuitive Bulk:** Briefly nod to the fact that Lewis's ontology is extravagant (countless concrete worlds). The power of the analogy isn't in claiming this is *true*, but in showing how *if* we adopt this metaphysical framework, it provides a rigorous and insightful way to model the logic and phenomenology of revision. Its value is conceptual clarification within the model.
  5.  **Connect "Selection" to Authorial Intent/Discovery:** Explicitly link the act of "selecting which world to describe" to the author's sense of discovering the "right" path or the "truest" version of events/characters. The framework explains this feeling as the author identifying the counterpart (and thus the world) that best matches their internalized conception.

  **Conclusion on Viability:** Your core analogy is philosophically accurate to Lewis's system *if* you meticulously maintain the distinctions between the actual world of the author/text and the independent concrete possible worlds described by the texts. It avoids ersatzism by treating the fictional content as *referring to* independently existing concrete worlds. Most importantly, **it does real conceptual work**: it reframes revision as selection from a plenitude, dissolves unhelpful identity questions about characters across drafts via counterpart theory, and provides a rigorous metaphysical model for the phenomenology of "discovery" in revision by analyzing it as the search for the qualitatively best-matching counterpart. This is more than just dressing up familiar practices; it offers a distinct and potentially illuminating ontological lens. Proceed with confidence, but be meticulous with your world/text/author-action distinctions.
