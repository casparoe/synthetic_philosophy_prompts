answer: |-
  **Bottom line: An adequate theory of conceptual slippage in microdomains must explain context-driven divergence despite functional equivalence, preserve legally & cognitively critical distinctions, and integrate fluid boundaries without essentialism—eliminating most candidates by requiring divergence explanation while preserving case distinctions.**

  ### Non-Negotiable Desiderata & Motivations
  1.  **Explain Divergent Categorization Despite Functional Equivalence:** *Must account for why tokens identical in performance/structure (e.g., perfect copycat aircraft parts) are categorized differently (e.g., "counterfeit" vs. "genuine") based on provenance/context.*  
      **Motivation:** Core phenomenon of slippage in copycat domains.  
  2.  **Predict Boundary Shifts Without Hidden Essences:** *Must model how category membership changes (e.g., a repaired part becoming "certified" after inspection) based solely on contextual parameters (certification, market framing) not intrinsic properties.*  
      **Motivation:** Rejects essentialist fixes; reflects fluid boundary conditions. *(Potentially conflicting with #7 if demanding universal determinism)*  
  3.  **Preserve Functional vs. Ontological Distinction:** *Must treat "functions identically" (copycat performs like original) as fundamentally distinct from "is ontologically identical" (same kind of entity).*  
      **Motivation:** Prevents collapse seen in purely functionalist ontologies; needed for liability.  
  4.  **Preserve Liability vs. Warranty Distinction:** *Must distinguish attribution of responsibility for harm (liability based on provenance/regulation) from contractual coverage promises (warranty based on manufacturer/seller).*  
      **Motivation:** Foundational jurisprudential separation (e.g., counterfeit part causing crash vs. OEM denying warranty on repaired part).  
  5.  **Consistency with Cognitive Science on Categorization:** *Must align with evidence of graded membership, context-sensitivity, and prototype/exemplar effects in human categorization.*  
      **Motivation:** Explains real-world agent judgments and disputes.  
  6.  **Consistency with Jurisprudence on Product Liability:** *Must accommodate doctrines of strict liability for defective products, reliance on provenance chains, and regulatory certification frameworks.*  
      **Motivation:** Explains institutional/court rulings (e.g., FAA parts certification). *(Potential conflict with #5 if cognitive models ignore institutional facts)*  

  ### Negotiable Camp Preferences
  7.  **Determinism of Boundary Rules:** *Whether boundary shifts are governed by deterministic contextual rules or exhibit irreducible indeterminacy.*  
  8.  **Single Correct Taxonomy:** *Whether there is one privileged categorization schema reflecting objective joints, or multiple contextually valid schemas.*  
  9.  **Primacy of Explanation:** *Whether the theory prioritizes descriptive-explanatory power or prescriptive-normative goals for conceptual reform.*  

  ### Key Eliminator & Conflicts
  *   **The Eliminator:** Desideratum **#1 (Explain Divergent Categorization Despite Functional Equivalence)** combined with **#3 (Preserve Functional vs. Ontological Distinction)** eliminates most popular candidates (e.g., pure functionalism, essentialism). It demands explaining why function *isn't* the sole criterion while preserving why that distinction matters ontologically and legally.
  *   **Suspected Conflict:** **#2 (Predict Shifts Without Essences)** and **#7 (Determinism)** may conflict. Truly fluid, context-driven boundaries might resist deterministic prediction without smuggling in hidden contextual "essences."

  ---

  ### Theory Scoring (Against Non-Negotiables 1-6)
  1.  **Classical Essentialism:**  
      *   **Fails:** #1 (Cannot explain divergence if intrinsic properties/functions match), #2 (Rigid boundaries based on essence; ignores context), #5 (Contradicts graded/contextual cognition).  
      *   **Preserves:** #3 & #4 (Clear identity conditions support distinctions), #6 (Sometimes aligns with regulatory "essences" if defined).  
      *   **Verdict:** Inadequate. Cannot handle fluidity or divergence.

  2.  **Prototype-Theory Adaptation:**  
      *   **Satisfies:** #5 (Aligns with graded membership/cognition), partially #2 (Can model family resemblance, some context-sensitivity).  
      *   **Fails:** #1 (Struggles to explain why *perfect* functional copies diverge—prototype match should be high), #3 & #4 (Blurs functional/ontological/liability distinctions via similarity metrics), #6 (Poor fit for sharp jurisprudential categories based on provenance).  
      *   **Verdict:** Partially Adequate on cognition/fluidity, critically deficient on legal distinctions and explaining divergence despite equivalence.

  3.  **Pragmatic-Contextualist Model:**  
      *   **Satisfies:** #1 (Divergence explained by differing contextual purposes/rules), #2 (Boundaries defined by context/stakes), #3 & #4 (Can define distinct schemas for function, ontology, liability based on context), #5 (Embodies context-sensitivity).  
      *   **Risk:** #6 (May struggle if contextuality undermines legal stability; needs mechanism to incorporate institutional facts as contextual parameters).  
      *   **Verdict:** Most Adequate. Best handles fluidity, divergence, and distinctions by making context/purpose central. Must explicitly ground jurisprudential parameters.
