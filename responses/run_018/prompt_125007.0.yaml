prompt: |-
  I'm currently taking a graduate seminar on conceptual engineering and applied ontology, and I want to avoid evaluating theories before I know what success conditions apply. Write the full desiderata that any adequate theory of conceptual slippage in microdomains must meet—specifically microdomains structured by "copycat" classifications (tokens that replicate the functional and structural profile of an original while diverging in provenance, manufacturing chain, or legal status) and "fluid" boundary conditions (where category membership shifts with contextual parameters such as repair-certification, installer accreditation, or market framing rather than with intrinsic physical properties). I need the specification of mandatory explanatory targets (e.g., why identical performance can yield divergent categorization, how to predict boundary shifts without invoking hidden essences), the case distinctions the theory must preserve (functional equivalence versus ontological identity versus liability attribution versus warranty eligibility), the consistency conditions with results from cognitive science on categorization and from jurisprudence on product liability, and a clear division between non-negotiable constraints and negotiable camp preferences (such as whether there must be a single correct taxonomy or deterministic boundary rules). For each desideratum, give the motivating case or consideration behind it; flag any pair you suspect is jointly unsatisfiable; and identify the single requirement that eliminates the largest share of popular candidates. Then, briefly and without citations, bibliographies, or reading lists, score classical essentialism, a prototype-theory adaptation, and a pragmatic-contextualist model against your list. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
