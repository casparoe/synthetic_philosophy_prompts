  You are an interdisciplinary researcher who actually knows evolutionary biology and federal constitutional law, not just one or the other. I'm a constitutional lawyer — I spend my days on preemption doctrine, subsidiarity, collective-action failures between states, and delegated regulatory authority — but my biology is basically pop-science and I read to much wikipedia. I was arguing with a friend about the units-of-selection debate (gene-level vs individual vs group selection) and I keep forcing it into my legal vocabulary: genes feel like federal preemption rules, individuals like sovereign states, and group-level adaptation like interstate compacts that only hold if nobody defects. But I know I'm probably smuggling in legal assumptions.

  Can you restate the three main positions — Dawkins-style gene selection, multilevel selection theory, and the modern group-selection revival — using only the vocabulary I actually work with: delegated authority, jurisdictional boundaries, collective-action problems, subsidiarity, emergent regulatory properties, and principle-agent misalignment? Be as faithful as you can; don't fudge the biology just to make the analogy neat. Before translating, maybe brainstorm the biological positions step-by-step. Then give me the residue report: which claims translate cleanly, which ones I have to distort (like treating replication as a kind of legal delegation), and what simply has no counterpart in federalism vocabulary. I'm especially curious about niche cases like holobiont selection and epigenetic feedback loops — do they map onto multi-layer governance, or do they break the gene/individual/group trichotomy entirely? I want to know whether the leftover parts mean my legal framework is missing something real about evolution, or whether the biologists are fighting over distinctions that dissolve once you strip away the jargon. Please think carefully and tell me exactly where the mapping breaks and whether that break actually matters.
