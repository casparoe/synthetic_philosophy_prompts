  I should start with the strongest objections. Genuine moral conflicts with incommensurable values seem fatal. If two obligations arise from different sources and can't be compared, that's a structural problem for consistency. Existential dilemmas like Sophie's Choice are tough because choosing violates a core duty, and no formal system can resolve that without residue. Deontic logic paradoxes like Chisholm's could be awkward but maybe resolvable with better formalization. 

  Moral psychology findings on unavoidable regret are tricky. If regret is a rational response rather than noise, it suggests a real conflict existed. But the user might dismiss this as affective noise. However, if regret is shown to be necessary and rational, that's harder to wave away. Radical moral indeterminacy from pragmatism or error theory might be fatal if morality isn't consistent, but the user could counter by insisting on systematization.

