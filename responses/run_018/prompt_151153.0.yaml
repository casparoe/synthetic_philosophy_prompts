  Also, flagging which ones they'd handwave: They might dismiss moral psychology as noise and deontic paradoxes as syntax errors. Radical indeterminacy could be ignored if they presuppose moral realism. The strongest challenges remain incommensurability and existential dilemmas that resist formalization without residue.

