answer: |-
  ### Role-Play Design: **"The Standing Ledger"**  
  **Objective:** Explore how hypocrisy undermines *domain-specific* moral standing (environmental, academic, interpersonal) using a hidden "standing ledger."  

  ---

  #### **Setup & Materials**  
  - **Roles** (assign randomly):  
    - **Blamer (3 students)**: Accuses a target of a moral violation in one domain.  
    - **Target (3 students)**: Defends against blame.  
    - **Observer-Juror (6 students)**: Assesses blame accuracy and blamer’s standing; awards reputation points.  
  - **Hidden Ledger Cards**: 3×5 index cards with pre-assigned moral scores (-3 to +3) for each domain. *Examples:*  
    - Blamer 1 (Environmental): Eco: **-2**, Academic: **+1**, Interpersonal: **0**  
    - Target 1 (Academic): Academic: **-3**, Eco: **+2**, Interpersonal: **-1**  
    - Observer-Juror: Random scores (e.g., Eco: **+3**, Academic: **-2**, Interpersonal: **0**).  
  - **Violation Scenarios** (1 per domain):  
    - **Environmental**: "Used single-use plastics at school picnic."  
    - **Academic**: "Copied homework from a peer."  
    - **Interpersonal**: "Excluded a classmate from a group chat."  
  - **Reputation Points**: Tracked publicly (whiteboard); no real stakes.  

  ---

  #### **Rules & Payoff Scheme**  
  1. **Standing Matters Only in the Accused Domain**:  
     - Blamer loses standing *only* if their ledger is **negative** in the domain they blame.  
     - Scores in *other* domains don’t affect standing (e.g., an academic cheat *can* blame environmental harm).  
  2. **Reputation Payoffs**:  
     | **Outcome**                          | Blamer Points | Target Points | Observer-Juror Points* |  
     |--------------------------------------|--------------|--------------|------------------------|  
     | Accurate blame + Standing            | +2           | -1           | +1 per correct verdict |  
     | Accurate blame + Hypocrisy           | -2           | +1           | -1 per incorrect verdict |  
     | Inaccurate blame + Standing          | -1           | +1           |                        |  
     | Inaccurate blame + Hypocrisy         | -3           | +2           |                        |  
     *Jurors score if their verdict matches the *revealed truth* (blame accuracy + standing).  

  ---

  #### **Timeline** (75 mins total)  
  1. **Introduction (10 mins)**:  
     - Explain hypocrisy → loss of moral standing.  
     - Introduce domains: Standing is *partitioned* (e.g., an eco-hypocrite still has academic standing).  
  2. **Role Assignment & Prep (10 mins)**:  
     - Assign roles/scenarios. Give ledger cards (**concealed**).  
     - Blamers/Targets: 5 mins to prepare arguments.  
  3. **Blame Phase (15 mins)**:  
     - Split into 3 groups (1 blamer, 1 target, 2 jurors each).  
     - Blamer accuses; Target defends; Jurors take notes.  
     - *Example:* Blamer with **Academic: -2** accuses Target of plagiarism.  
  4. **Juror Deliberation (10 mins)**:  
     - Jurors vote: (1) Was blame accurate? (2) Did blamer have standing?  
     - **Votes recorded secretly** (paper slips).  
  5. **Ledger Revelation (10 mins)**:  
     - All reveal ledger cards.  
     - Compare votes to truth:  
       - **Blame accuracy**: Based on Target’s ledger (negative = guilty).  
       - **Standing**: Based on Blamer’s ledger (negative in domain = hypocrisy).  
     - Calculate reputation points.  
  6. **Debrief (20 mins)**: Key questions:  
     - *"When did hypocrisy ‘cancel’ blame? Did it feel fair?"*  
     - *"Did anyone’s ledger in one domain affect your view of their standing in another?"*  
     - Map game moments:  
       - **First-order blame**: "You littered!" → Accuracy of accusation.  
       - **Second-order standing**: "But you litter too!" → Credibility collapse in *environmental* domain.  
       - **Partitioned stability**: "A cheater blaming littering felt awkward, but not logically wrong." vs. "Extreme hypocrisy in one domain made their other blame feel hollow."  

  ---

  #### **Honest Note: Simulation Limits**  
  - **What the game CAN’T capture**: Deeply "global" moral failings (e.g., a murderer blaming jaywalking). Partitioning assumes domains are siloed, but real-world judgments often spill over. **Discuss**: *"When should a violation in one domain poison all standing?"*  

  ---

  #### **Predictable Problems & Fixes**  
  - **Problem 1**: Ledger confusion → Students miss domain-specificity.  
    - **Fix**: Use color-coded cards (e.g., green for eco, blue for academic) and emphasize: *"Only the blamer’s score in THIS domain matters."*  
  - **Problem 2**: Jurors ignore nuance → Rush to "hypocrite = always wrong."  
    - **Fix**: Require jurors to justify verdicts pre-revelation (e.g., *"Why does/doesn’t the blamer’s eco-score affect their academic standing?"*).  
  - **Problem 3**: Role-play feels artificial → Students disengage.  
    - **Fix**: Assign relatable scenarios ("copied homework") and allow 1 min of "hot seat" drama.  

  ---

  #### **Self-Critical Note: Validity Check**  
  - **Failure mode that would change my mind**: If >50% of students report that partitioned standing felt *arbitrary* or *unrealistic* during debrief (e.g., *"A bully’s eco-blame still felt invalid even if their eco-ledger was clean"*). This suggests the simulation fails to isolate domain-specificity.  
  - **Debrief weakness**: Assuming ledger scores cleanly map to "moral credentials." Students might see them as game tokens, not moral proxies. **Antidote**: Press them to analogize scores to real-world acts (e.g., *"A ‘-2’ in academics = frequent cheating"*).  

  ---

  ### **Instructor Cheat Sheet**  
  - **Prep**: Pre-make ledger cards (ensure blamers have 1–2 hypocrites per domain).  
  - **Stick to time**: Use a timer for each phase.  
  - **Discussion prompts**: *"Would you trust a climate activist who bullies peers?"* → Tease out domain tensions.  
  - **End goal**: Students leave debating *"Is standing truly partitioned, or do we demand moral consistency?"*  

  This design forces confrontation with partitioned standing while spotlighting its fragility. Run it, then refine based on which arguments ignite your club! 🔥
