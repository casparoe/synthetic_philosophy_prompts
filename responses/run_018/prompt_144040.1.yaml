  hey so im writing this short essay for my phil of mind seminar and im kind of stuck on whether my take on dennets brain-transplant puzzle actually holds up. my basic move is to take the extended mind idea seriously: if hamlets notes and memory stores are already part of his cognitive system, then copying just the brain already misses part of the self. but then i push it further. what if we duplicate both the brain and the external cognitive system, then put them in bodies with totally different sensory feedback loops? you get two narrative centers of gravity that share the same origin point in autobiographical memory but diverge in real time. i call this the triangulated self problem. im asking whether this actually breaks dennets center-of-gravity solution, or if he can just say there are now two centers with shared roots. also i worry im smuggling in a semanitc problem about indexicals—when both copies say i are they pointing to the same referent or is it just ambiguity?

  anyway, could you comment on these notes? specifically:
  1. is my triangulated self scenario actually different from standard split-brain cases, or am i reinventing the wheel?
  2. am i confusing metaphysical identity with the semantics of first-person reference?
  3. is there an obivous objection about narrative continuity that im totally missing?

  i dont need sources or a reading list, just want to know if the argument is interesting or if it collapses right away. thanks!
