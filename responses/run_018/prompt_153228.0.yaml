answer: |-
  Here's a breakdown of the calculus priority dispute through your "inevitability + API standardization" lens, analyzing where the theory holds and where human drama breaks it:

  **The Players & Their "Contribution Strategies":**
  1.  **Newton (England):** Developed his "method of fluxions" (1665-66). Chose "sit on manuscripts" (private circulation only) as his primary strategy. His "API" used dots over variables (ẋ, ẏ).
  2.  **Leibniz (Germany):** Independently developed his differential/integral calculus (1673-76). Chose "publish immediately & disseminate" (first papers 1684, 1686). His "API" used `d/dx` notation.
  3.  **The Bernoullis (Switzerland):** Early adopters and fierce advocates of Leibniz's notation and methods ("API evangelists"). Pushed adoption in continental Europe.
  4.  **Royal Society Commission (1712):** Stacked with Newton's allies. Tasked with adjudicating the priority dispute. Chose "declare Newton first inventor" while (grudgingly) acknowledging Leibniz's independent invention.

  **The "Inevitability Theory" Predictions vs. Reality:**

  | Aspect               | Inevitability Theory Prediction (Software Analogy)                     | What Actually Happened                                                                 | Verdict on Inevitability Theory                                       |
  | :------------------- | :--------------------------------------------------------------------- | :------------------------------------------------------------------------------------- | :-------------------------------------------------------------------- |
  | **Core Discovery**   | Calculus emerges as the "necessary protocol" for solving motion/change problems. Multiple devs hit the core logic independently (like TCP/IP concepts). | **YES.** Both Newton & Leibniz demonstrably built functional, equivalent core systems (differentiation/integration fundamental theorem). | **Survives:** Redundant development proves the underlying math *was* inevitable. |
  | **Initial "Beta" Release** | Independent "implementations" should arise roughly concurrently once prerequisites (algebra, analytic geometry) mature. | **MOSTLY.** Newton had the core first (privately), Leibniz published the first *public* "stable release". The ~20 year gap was due to Newton's secrecy, not lack of readiness. | **Survives (with caveat):** The *capability* emerged independently when the mathematical "stack" was ready. Timing variance is human-driven. |
  | **Standardization ("API Wars")** | The market (scientific community) naturally adopts the most practical/useful/well-documented "API" (notation & presentation). | **PARTIAL.** Leibniz's `d/dx` notation was objectively superior for complex expressions and manipulation. Bernoullis evangelized it effectively. BUT: Newton's prestige and the Royal Society's biased report actively *slowed* adoption in England, creating a continental/British split. | **BREAKS:** Superior "API" (Leibniz) *did* win long-term, but human tribalism (nationalism, ego, institutional bias) caused significant friction and delay. The "best tech" didn't win purely on merit; politics mattered. |
  | **Priority Dispute ("Ownership Claim")** | Disputes over "who first committed the code" are noise. The protocol's existence is what matters; contributors get commit credits, but no one "owns" the standard. | **EPIC FAIL.** Newton orchestrated a vicious smear campaign (via the stacked commission) implying Leibniz *stole* the idea. Leibniz fought back bitterly. Careers were damaged, effort wasted. | **SHATTERS:** Human ego, desire for prestige, and institutional power dynamics turned a redundant discovery into a toxic battle. The "noise" was deafening and destructive. |
  | **Adoption & Legacy** | The "routing label" (discoverer's name) becomes less important than the adopted standard (API). Legacy belongs to the *standard*, not the *initial committer*. | **MOSTLY.** We *call* it "Newton-Leibniz Calculus," acknowledging both. But we **use** Leibniz's `d/dx` notation almost exclusively. The "API" became the standard, rendering the priority fight historically interesting but mathematically irrelevant. | **SURVIVES (Ultimately):** Long-term, the community adopted the superior tool (`d/dx`). The "who" became a footnote appended to the standard. |

  **Does the "Who" Matter? Your Routing Label vs. API Question:**
  *   **Routing Label:** Newton publishing first *in private* mattered hugely *to Newton* and his contemporaries for prestige. Leibniz publishing first *publicly* mattered for initial continental adoption and notation.
  *   **The API Standard:** This is what *actually* shaped mathematical progress. Leibniz's notation was fundamentally more scalable, flexible, and expressive – a better API for building complex "applications" (advanced calculus, physics). It won because it was *better tech*, despite Newton's personal prestige.
  *   **The Core Protocol:** The fundamental theorem *itself* is the inevitable protocol. Newton's fluxions and Leibniz's differentials were two implementations of that protocol. The protocol's existence was inevitable; the specific implementation details (notation) were contingent on human choices and competition.

  **Conclusion: Does Inevitability Survive the Drama? (A Nuanced Yes)**

  1.  **The Core Math WAS Inevitable:** The simultaneous, independent discovery by Newton and Leibniz is the *strongest evidence* for inevitability. The mathematical "problem space" demanded this tool, and the prerequisites were in place. It *would* have emerged around that time, even if specific individuals died.
  2.  **The Human Drama WAS NOT Noise:** It profoundly shaped the *how* and *when*:
      *   **Timeline:** Newton's secrecy delayed widespread understanding and application for decades.
      *   **Adoption Path:** The bitter dispute created a schism (British vs. Continental calculus) that slowed overall progress.
      *   **Credit Allocation:** While the *math* is independent, the *historical narrative and prestige* were fiercely (and damagingly) contested. Human factors prevented the "clean" emergence predicted by pure inevitability.
      *   **The Standard (API):** Human factors (Leibniz's publishing strategy, Bernoulli's advocacy, the *practical superiority* of `d/dx`) directly determined *which* implementation became the global standard, even against Newton's immense authority.

  **The Verdict:** The inevitability theory survives contact with the drama **for the existence of the core protocol (calculus itself)**. The fundamental mathematical insight was a convergent evolution. However, the drama proves that **the discoverer, the timing, the path of adoption, and the specific implementation (notation/API) are absolutely NOT inevitable.** They are deeply contingent on human choices, personalities, rivalries, institutions, and even seemingly trivial things like which notation is more elegant to write. The "who" isn't *mathematically* crucial once the standard API wins, but the human struggle to *be* the "who" shaped the messy, inefficient, and often ugly process of getting there. Science needs the protocol, but the protocol gets built and adopted by humans with all their flaws.
