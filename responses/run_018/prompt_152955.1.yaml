prompt: |-
  Right, I've been trying to get my head round this old essay by Montaigne — 'Of Cannibals', I think — and now my mate's asked me to mark his homework answer on it. I'm a bit rusty on this stuff, so I need you to be straight with me.

  The exam question was: Montaigne compares cannibal societies with European ones and seems to defend the cannibals. Explain his actual position on whether they're 'better' than Europeans, and say whether he's putting forward cultural relativism as a proper philosophy or just using them to make a point about us.

  Here's what he wrote: Montaigne argues that cannibals are acutally more civilised than Europeans because they don't torture people for relegion like we do in the wars. He says they live naturally without artifice or false religion, and he thinks this proves all cultures are equally valid — there's no right or wrong, just different customs. He also mentions he spoke to some cannibals who came to France and noticed they weren't surprised by our customs, which shows they understand that morality is relative. He concludes we should stop judging other cultures and accept that cannibalism is just as good as European table manners.

  Can you grade this for me? Give it a mark out of 100 and tell me exactly what's right and what's wrong, point by point. Don't sit on the fence — tell me if it's a pass or a fail and why, and don't just say 'it's partly right'. I want a proper assessment with specific comments justifying the score. Thanks.
reasoning: |-
  Okay, the user wants me to grade their friend's homework on Montaigne's "Of Cannibals." Let me start by recalling the essay's main points. Montaigne critiques European society by comparing it to the Tupinambá people in Brazil. He points out their valor in war, natural way of life, and contrasts their practices with European atrocities like religious torture. But does he say they're better?

  The student claims Montaigne thinks cannibals are more civilized. That's partially right because Montaigne does highlight their lack of hypocrisy and cruelty compared to Europeans. However, he doesn't outright say they're superior. Instead, he uses them as a mirror to criticize his own society. The student missed that nuance.

  Next, the cultural relativism part. The student says Montaigne believes all cultures are equally valid with no right or wrong. But Montaigne actually holds a universal moral standard. He condemns European torture more harshly than cannibalistic practices because he sees torture as worse. So he's not a full relativist; he uses the cannibals to point out European moral failures.

  The mention of the cannibals visiting France—Montaigne notes their surprise at European inequality, not their indifference. That's key. They were shocked by poverty and social hierarchy, which challenges the idea that they saw morality as relative. The student got this wrong.

  The conclusion about accepting cannibalism as equal to table manners oversimplifies Montaigne. He doesn't endorse cannibalism; he questions why Europeans judge it while committing worse acts. The essay's a critique, not an endorsement.

  Grading: The student identifies Montaigne's critique of Europe and the natural living of the Tupinambá, which is good. But they misinterpret relativism, the visitors' reaction, and Montaigne's conclusions. Major points are missed, so around 50/100. Specific feedback on each error needed to justify the grade. User wants a strict assessment, so I'll be direct with pass/fail and exact mistakes.
answer: |-
  Based on a close reading of Montaigne's "Of Cannibals," here is a strict assessment of your mate's homework answer:

  **Grade: 50/100 (Fail - Demonstrates partial understanding but contains significant misinterpretations)**

  **Breakdown of Assessment (Point by Point):**

  1.  **"Montaigne argues that cannibals are actually more civilised than Europeans because they don't torture people for religion like we do in the wars."**
      *   **What's Right (Partial Credit):** Montaigne *does* strongly contrast the cannibals' warfare and execution practices (driven by vengeance against captured enemies) with the extreme cruelty, religious persecution, and torture prevalent in contemporary European wars (like the French Wars of Religion). He explicitly states that eating a dead man "is more barbarous than to eat him alive," contrasting it with European torture methods. He implies the cannibals' practices are *less barbaric* in this specific, horrific context.
      *   **What's Wrong (Major Error):** Montaigne **does not** explicitly state or argue that the cannibals are *overall* "more civilised." He uses them as a **critical mirror** for European society. His point is that Europeans, who consider themselves supremely civilised, commit acts far more barbaric *by their own claimed standards* than the so-called "savages." He challenges European assumptions of superiority, but he doesn't declare the cannibal society superior overall. He admires *aspects* of their life (simplicity, valor, lack of deceit), but never makes a blanket "more civilized" claim.

  2.  **"He says they live naturally without artifice or false religion..."**
      *   **What's Right (Full Credit):** This is accurate. Montaigne heavily emphasizes the cannibals' "natural" state, contrasting it with European "artifice." He praises their simplicity, lack of commerce, private property, social hierarchy, literacy, and complex laws. He suggests their way of life is closer to an original, uncorrupted state of nature. He also contrasts their lack of "false religion" (complex theology, dogma, enforced belief leading to violence) with the state of European Christianity at the time. This is a core part of his critique.

  3.  **"...and he thinks this proves all cultures are equally valid — there's no right or wrong, just different customs."**
      *   **What's Right (Minimal Credit):** Montaigne *does* challenge ethnocentrism and the automatic assumption of European superiority. He famously states, "every man calls barbarous anything he is not accustomed to." He uses the cannibals to expose the hypocrisy and brutality lurking beneath European "civilization."
      *   **What's Wrong (Critical Misinterpretation):** This characterization as **full cultural relativism ("all cultures are equally valid," "no right or wrong, just different customs") is incorrect and oversimplifies Montaigne's position.** Montaigne **does not** abandon judgment or a sense of universal morality.
          *   He clearly condemns European torture and religious persecution as worse than the cannibals' practices. He judges *both* societies by a standard – one that values humanity, courage in battle, and honesty, while condemning cruelty, deceit, and hypocrisy.
          *   His point is **not that all customs are morally equal**, but that Europeans are in no position to judge others harshly *given their own far worse transgressions against their professed values*. He relativizes the *source* of judgment (questioning European arrogance) but not morality itself entirely. He uses the "other" to critique his own society's failings against its *own* ideals and basic humanity, implying a universal standard against which both are measured (and Europe is found wanting in key aspects).

  4.  **"He also mentions he spoke to some cannibals who came to France and noticed they weren't surprised by our customs, which shows they understand that morality is relative."**
      *   **What's Right (Minimal Credit):** Montaigne *does* recount meeting three Tupinambá in Rouen and discussing their impressions of France.
      *   **What's Wrong (Significant Error):** The interpretation is completely backwards. Montaigne **explicitly states what *did* surprise them**: the extreme inequality and poverty they witnessed. They were astonished that:
          *   Grown, strong, bearded men (the poor) would submit to obey a child king instead of strangling him and putting someone else in charge.
          *   Some men were "gorged to the full with things of every sort" while their fellow countrymen were "beggars at their doors, emaciated with hunger and poverty." They found this disparity "strange" and wondered why the poor didn't seize the rich by the throat or set fire to their houses.
      *   **This does NOT show the cannibals understood "morality is relative."** It shows they applied **their own moral framework** – valuing strength, egalitarianism, and communal provision – to judge European society *harshly* on specific points. They *were* surprised and critical, using *their* standards to find European practices morally deficient. This reinforces Montaigne's point about European hypocrisy (they preach charity but tolerate extreme inequality) and challenges European assumptions of superiority, but it demonstrates judgment based on specific values, *not* relativism.

  5.  **"He concludes we should stop judging other cultures and accept that cannibalism is just as good as European table manners."**
      *   **What's Right (Minimal Credit):** Montaigne *does* argue against automatic, arrogant condemnation of other cultures ("barbarous" as a term of prejudice). He *does* relativize the *act* of eating human flesh by comparing it to European practices he deems worse (torture, religious persecution) and by placing it within the Tupinambá's specific cultural context (vengeance against valiant enemies).
      *   **What's Wrong (Major Error/Simplification):**
          *   Montaigne **does NOT conclude we should simply "accept" cannibalism as morally equivalent or "just as good" as European manners.** His goal is **critical self-reflection for Europeans.** He forces his readers to confront the contradiction between their self-image and their actions by using the cannibals as a contrasting example. He asks: "Which is more barbarous, to eat a man after he is dead or to torture him alive?" The answer condemns Europe more than it endorses cannibalism.
          *   He is **not** advocating passive acceptance of all customs. He is using the shock value of the comparison to expose the *greater* barbarity within European "civilization" and to undermine its claims to moral superiority. He wants Europeans to judge *themselves* more harshly, not to suspend judgment on cannibalism.

  **Justification for 50/100 (Fail):**

  *   **Strengths:** Correctly identifies Montaigne's core critique of European hypocrisy, cruelty (especially torture), and artifice. Accurately notes his praise for the cannibals' "natural" state and lack of false religion/complexity. Understands Montaigne challenges European superiority.
  *   **Critical Weaknesses:**
      *   **Misrepresents Montaigne as a full cultural relativist.** This is the most significant philosophical error. Montaigne critiques ethnocentrism using relativism *as a tool*, but he maintains a moral framework that condemns excessive cruelty and hypocrisy.
      *   **Oversimplifies and misreads the cannibals' reaction in France.** It wasn't indifference showing relativism, but specific criticism based on *their* values.
      *   **Misstates Montaigne's conclusion.** He does not say "cannibalism is just as good"; he says European practices are *worse* in crucial respects, forcing self-reflection.
      *   **Claims Montaigne argues cannibals are "more civilised" overall,** which he carefully avoids doing, preferring to relativize the term "barbarous."
  *   **Why it Fails:** The answer fundamentally misrepresents Montaigne's philosophical stance (relativism vs. critical tool) and his central purpose (critiquing Europe, not endorsing cannibalism). While it grasps some surface-level contrasts, it misses the nuanced argument and the primary target of the essay (European self-delusion). The misinterpretation of the cannibal visitors' reaction and the conclusion are particularly damaging.

  **In essence:** Your mate understands that Montaigne uses the cannibals to attack European failings, but misinterprets the *nature* and *extent* of that comparison, falsely elevating it to a declaration of cannibal superiority and a philosophy of full cultural relativism, while missing Montaigne's underlying moral framework and his primary goal of provoking European self-critique. It shows engagement with the text but lacks analytical precision and philosophical accuracy.
