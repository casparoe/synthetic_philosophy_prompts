  ## Sonnet on the F-Twist

  When billiard balls, elastic to perfection,
  Collide in vacuum's pure, untainted space,
  Their paths obey no force of gravitation
  Nor intermolecular embrace—
  Then, though this vision falsifies the gas,
  The pressure-volume laws emerge aright;
  The model's false foundations hold, alas,
  And guide predictions with unerring light.
  **Yet** Boyle's own curve the lab equipment drew,
  And Avogadro's count confirmed the scheme;
  The test tubes show the measured vapor's dew
  While molecules ignore the waking dream.
  So deem not false the tool that serves its use:
  The aim's prediction, not description's truth;
  Models are gauges, not reality's truce—
  Their worth lies not in what assumes the sleuth,
  But if they track the world's unfolding course,
  Despite the fiction at their artifice' source.

  **Commentary:** The poem necessarily simplifies Friedman's position by focusing primarily on the tension between demonstrably false assumptions and predictive success, thereby eliding his more nuanced distinction between predictive accuracy and explanatory power. Friedman acknowledged that models might lack explanatory depth while still being predictively useful, a subtlety the compressed poetic form struggles to articulate explicitly within the couplet's focus on prediction versus description. While this omission risks presenting the F-twist as a cruder instrumentalism than Friedman perhaps intended—one seemingly indifferent to *why* predictions hold—the simplification remains acceptable for the sonnet's purpose. The core methodological claim—that the validity of assumptions is judged solely by the model's predictive performance, not their descriptive realism—is accurately rendered, and the volta effectively captures the paradoxical essence of the "F-twist": that unrealistic premises can be *methodologically* justified *if* (and only if) they yield accurate predictions. A philosopher of science would recognize the central argument, even if the finer point about explanatory depth versus predictive scope is backgrounded for poetic economy. The poem avoids reducing the position to a mere slogan by emphasizing the *methodological aim* ("prediction, not description's truth") and the *functional role* of models ("gauges," "tool that serves its use," "track the world's unfolding course"), accurately reflecting Friedman's instrumentalist view without distorting its fundamental premise.
