  **(c) Neutralising Annihilation Objection: 0.6**
  *   **Justification:** By restricting lexical priority to entities above the PD threshold, the framework plausibly avoids obligating the annihilation of *all* sentient life (as beings below the threshold lack moral status for this purpose), though potential obligations regarding *future* beings or borderline cases persist.

  **(d) Distinctiveness from Prioritarianism: 0.8**
  *   **Justification:** Lexical priority creates a discontinuity absent in standard prioritarianism (which uses continuous weighting), ensuring that above-threshold intense suffering *always* trumps positive welfare benefits, making the framework substantively different even with a fully specified boundary.

  **Calculation:**
  The terms represent key independent hurdles. Multiplying them gives a baseline: 0.7 * 0.5 * 0.6 * 0.8 = 0.168. However, this likely underestimates coherence as some hurdles are interdependent. Averaging the factors (0.7 + 0.5 + 0.6 + 0.8)/4 = 0.65 provides an upper bound. My overall credence (0.55) reflects a balanced assessment acknowledging significant challenges, particularly with (b), while allowing for the framework's theoretical possibility.

  **Term with Least Confidence: (b) Viability of Phenomenological Density Threshold (0.5)**
