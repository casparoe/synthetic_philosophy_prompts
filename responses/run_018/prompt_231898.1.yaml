answer: |-
  Your frustration is well-founded—this is a classic philosophical impasse that reveals deep structural tensions. Having analyzed similar debates for decades, I see multiple overlapping layers. Let me first brainstorm three distinct diagnostic frameworks before integrating them:

  **Candidate Diagnoses Brainstorm:**
  1. **Semantic Anchoring Dispute:** The core conflict stems from irreconcilable starting definitions. Dennett anchors "free will" in *functional capacities within a deterministic world* (e.g., reasons-responsiveness, self-control). Caruso anchors it in *ultimate origination* (libertarian free will). They're not arguing about the *same concept* but defending their chosen anchor point.  
     
  2. **Normative Priority Conflict:** Their disagreement is less about metaphysics than about *what ethics demands when metaphysics is uncertain*. Dennett prioritizes preserving socially functional practices (blame, praise, retribution) unless proven harmful. Caruso prioritizes avoiding the *potential injustice* of punishing agents who lack libertarian free will, demanding proactive dismantling of retributive systems.  
     
  3. **Burden of Proof Asymmetry (Your Hypothesis Refined):** The impasse hinges on *where justification falls when a practice has both pragmatic utility and contested metaphysical foundations*. Dennett argues: "Retributive practices work socially; prove they're *harmful* to abandon them." Caruso counters: "Retributive practices *presuppose* basic desert; prove this metaphysically *coherent* to keep them." This creates a justificatory vacuum.

  **Integrated Diagnosis: A Tripartite Stalemate**  
  This isn't *just* verbal, substantive, *or* normative—it's all three, interlocked:

  1. **Verbal Layer:** They use "free will," "desert," and "responsibility" with divergent semantic boundaries. Dennett employs a *compatibilist stipulation* ("free will" = specific cognitive capacities). Caruso insists on *folk conceptual analysis* ("free will" implies contra-causal power). **Progress blocker:** Neither concedes the other's definition is legitimate for the debate.  
     
  2. **Substantive Layer:** Beneath semantics lies a disagreement about the *necessary conditions for desert*. Caruso insists basic desert requires *contra-causal freedom* (metaphysical condition). Dennett argues desert is earned by *agential qualities* demonstrated in action (functional condition). **Progress blocker:** No shared criterion for what makes desert "real."  
     
  3. **Normative/Pragmatic Layer:** Crucially, their debate serves different master values:  
     - **Dennett:** Values *systemic stability, moral education, and deterrence*. Sees retribution as a tool for maintaining a morally responsive society.  
     - **Caruso:** Values *metaphysical coherence and harm prevention*. Sees retribution as inherently cruel if agents aren't "ultimately" responsible.  
     **Progress blocker:** They aren't just disagreeing on facts; they're prioritizing incompatible ethical imperatives.

  **The Hidden Engine: Burden of Proof & Default Positions**  
  Your hypothesis is astute. The core stalemate arises from **opposed justificatory frameworks**:  
  - **Dennett’s Presumption:** Social practices (like blame) are *provisionally justified* by their utility and cultural embeddedness. The burden lies on critics to demonstrate *actual harm* outweighing benefits.  
  - **Caruso’s Presumption:** Practices imposing severe harm (like imprisonment) are *prima facie unjust* without robust metaphysical grounding. The burden lies on defenders to prove *desert is metaphysically coherent*.  
  This creates a circle: Dennett demands empirical evidence of harm to abandon retribution; Caruso demands metaphysical vindication to keep it. Neither burden is met to the other's satisfaction.

  **Pathways to Progress (Beyond Circular Reassertion):**  
  1. **Reframe the Question:** Shift from "Is free will compatible with determinism?" to:  
     *"What constellation of cognitive capacities, social functions, and ethical constraints justifies holding agents accountable in ways that respect both their dignity and societal needs?"* This bypasses the libertarian/compatibilist deadlock.  

  2. **Empirical Pivot:** Investigate Caruso's claim about "folk intuitions":  
     - Do people *actually* link "desert" to libertarian free will in practice? (Experimental philosophy data is mixed, but targeted studies could clarify).  
     - Crucially: **Test the public health model.** If replacing retribution with quarantine/ rehabilitation *proves* more effective at reducing harm/recidivism, it undermines Dennett's pragmatic defense. Progress here is *applied*, not metaphysical.  

  3. **Formalize the Burden of Proof:** Establish criteria for when a contested practice should be preserved or abandoned amid metaphysical uncertainty:  
     - What level of potential harm triggers the precautionary principle (favoring Caruso)?  
     - What level of systemic utility justifies maintaining a "useful fiction" (favoring Dennett)?  
     *(Example: We accept "legal personhood" for corporations without metaphysical clarity because it enables functional commerce.)*  

  4. **Dissolve "Desert":** Follow P.F. Strawson's lead in "Freedom and Resentment" but push further. Separate:  
     - **Reactive Attitudes** (inevitable human responses to others' actions)  
     - **Institutional Practices** (retributive punishment vs. public health models)  
     We can preserve the former (e.g., resentment, gratitude) while radically reforming the latter without metaphysical baggage.  

  **Conclusion: Progress is Possible, But Not Where They're Looking**  
  The metaphysical debate *itself* is stuck because it conflates conceptual, empirical, and normative questions. Progress requires:  
  a) **Clarifying the lexicon** (stipulating terms upfront),  
  b) **Shifting focus to applied ethics** (what actually reduces suffering and fosters justice?), and  
  c) **Negotiating the burden of proof** for contested social practices.  
    
  The answer isn't abandoning the debate but *changing its terrain*. Caruso's public health model offers a concrete alternative—if it demonstrably outperforms retributive systems in practice, even Dennett's pragmatic arguments weaken. Conversely, if compatibilist responsibility concepts prove essential for moral development, Caruso's model must accommodate them. **The way out is through consequences, not causation.**
