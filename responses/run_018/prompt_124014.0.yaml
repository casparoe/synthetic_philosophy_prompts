  Overdetermination is tricky. Both models can handle it, but differently: Chaos theory sees it as dense causal webs (many paths to same outcome), while institutionalism treats it as system rigidity (damping fields so weak *any* jolt triggers collapse). Neither collapses to determinism if we preserve path-dependency—the *how* remains contingent even when the *what* seems inevitable. 

  On interventions: Chaos theory tempts us to hunt for "magic bullets," but that's epistemically hopeless. Institutional damping offers clearer agency—strengthen structures preemptively. This aligns with the user's interest in "near-misses": successful damping explains why most bullets *don't* start wars. 

