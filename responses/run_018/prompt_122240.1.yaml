prompt: |-
  You are a professional philosopher and experienced seminar facilitator specializing in philosophy of language and Wittgensteinian themes. Before drafting the design, take time to brainstorm: think about how to make the skeptical gap visceral rather than abstract, what roles or incentives will force participants to discover the underdetermination themselves, and how to replace the familiar arithmetic example with a less rehearsed scenario so the exercise does not feel like a standard lecture demonstration.

  Design a 90-minute classroom activity for an upper-level philosophy seminar of 12 students. The domain is Kripkenstein’s rule-following skeptical paradox, but do not use the standard “plus versus quus” framing; instead, inject a niche scenario—such as an artificial-classifier audit tribunal or a museum-curation verification board—so participants encounter the problem in a context they have not memorized from introductory treatments.

  The setting is a seminar room with 12 advanced undergraduate or graduate students, one 90-minute session, with only cards, paper, and a whiteboard. Participants should come away feeling, through their own failed attempts at coordination, that no finite record of past applications, explicit written instructions, private mental intentions, or behavioral dispositions can uniquely fix which rule is being followed, and that the appeal to communal agreement collapses under the same pressure. They should experience this as a practical breakdown in judgment or arbitration, not as a verbal thesis being delivered to them.

  Your deliverable must include:

  1. Setup and materials: specify roles (e.g., Auditor, Defender, Skeptic, Recorder), group divisions, card contents, and any point or commitment system with small stakes.

  2. The activity, divided into timed phases with explicit rules. Arrange the rules and incentives so that groups first apply a classification rule to a shared behavioral record, then face a deviant interpretation that fits every prior case but diverges on a new disputed case, and then attempt to resolve the dispute using only the four standard resources—private mental state, explicit instruction, behavioral disposition, and community consensus. The groups should fail to reach secure agreement. Include a public-commitment mechanism (forced vote, scored deliberation, or recorded verdict) so the failure is experienced collectively.

  3. A debrief that maps specific moments in the activity onto parts of the skeptical argument: the normative gap between behavior and correctness, the underdetermination of dispositions, and the circularity of community appeals. State what will predictably go wrong when the activity is run—such as students insisting that “common sense” fixes the rule, or one group converging on false consensus—and explain how the facilitator should handle it without reverting to lecture. Be explicit about which feature of the skeptical argument the activity cannot reproduce—namely, the normative dimension that meaning involves correctness conditions that transcend any descriptive fact about behavior or mental life—and instruct the facilitator on how to supply that move verbally once the experiential failure has occurred.

  4. Constraints: no assigned readings during the session, no requests for bibliographies or citations, no dependence on specialized technical knowledge outside standard philosophical training, and no verbatim quotations from any source.

  Think carefully, structure the response clearly and formally, and present the full runnable design.
reasoning: |-
  We are designing a 90-minute activity for an advanced seminar on the rule-following paradox, avoiding the standard "plus/quus" example. We'll use a novel scenario: a museum-curation verification board. The key is to create a scenario where participants must decide whether a new artifact belongs to a category defined by a rule, but the rule is underdetermined by past applications.

  The scenario: 
  - The museum has a collection of "Authentic Aztlan Artifacts" (AAA). The rule for what counts as AAA has been established by a set of past examples and a written guideline. However, the guideline is vague, and the past examples are finite. 
  - A new artifact is presented, and two interpretations of the rule emerge: one that includes it and one that excludes it. Both interpretations fit all past examples and the written guideline.

  Roles:
  - Curator (1 per group): Defends the inclusion of the new artifact according to their interpretation.
  - Skeptic (1 per group): Challenges the inclusion and proposes a different interpretation that excludes the artifact (or vice versa, but we'll fix it as inclusion vs exclusion for simplicity).
  - Verifiers (the rest of the group, 2-4 per group): Act as the verification board. They must vote on whether to accept the artifact. They can ask the Curator and Skeptic to justify their positions.

  We'll have two groups of 6. Each group will have:
  - 1 Curator
  - 1 Skeptic
  - 4 Verifiers

  But note: 12 students total. So we can have two groups of 6, each with 1 Curator, 1 Skeptic, and 4 Verifiers.

  However, to make the numbers even, we can adjust: 2 groups of 5 or 6? 12 students: two groups of 6 is perfect.

  Materials:
  - Cards with past artifact descriptions (for each group, a set of 10-12 past artifacts that were previously accepted as AAA). Each card has a description of an artifact (e.g., "Clay pot with spiral pattern", "Stone figurine of a jaguar with turquoise inlays", etc.). 
  - A written guideline for AAA (one per group). The guideline is intentionally vague and open to interpretation. Example: "Authentic Aztlan Artifacts must bear the characteristic motifs of the Aztlan culture and be made of materials available in the region during the classical period."
  - A new artifact card (one per group, same for both groups) with a description that is ambiguous and can be interpreted in two ways. Example: "A wooden statuette of a serpent, painted with red and yellow geometric patterns, with feathers attached." 
    - Why ambiguous? The guideline says "materials available in the region during the classical period": wood, paint, and feathers were available. But the skeptic might argue that the feathers were from a bird not native until after the classical period, or that the geometric patterns are more characteristic of a neighboring culture. The curator would argue that the patterns are within the variation of Aztlan motifs and the feathers are from a native bird.

  Phases:

  1. Preparation (10 minutes)
     - Divide into two groups of 6. Assign roles: one Curator, one Skeptic, and four Verifiers per group. 
     - Distribute materials to each group: a set of past artifact cards, the written guideline, and the new artifact card.
     - Explain the scenario: Both groups are verification boards for the same museum. They have the same set of past artifacts and the same guideline. They must decide whether to accept the new artifact into the AAA collection.

  2. Rule Familiarization (15 minutes)
     - Each group reviews the past artifacts and the guideline. They are to come up with a rule (in their own words) that they think fits the past decisions and the guideline. They should write down this rule on a sheet of paper.
     - The Curator and Skeptic are to prepare their arguments for the new artifact, but they don't know the twist yet.

  3. First Round: Application of the Rule (15 minutes)
     - Each group is told that they must now decide on the new artifact. The Curator argues for inclusion, the Skeptic argues for exclusion. The Verifiers can ask questions. Then the Verifiers vote by secret ballot. The group records the vote and the reasons given by the Curator and Skeptic.

     - However, after the vote, the facilitator reveals that both groups have the same set of past artifacts and the same new artifact, but the groups are not allowed to communicate with each other.

  4. The Twist: Underdetermination Revealed (10 minutes)
     - The facilitator collects the rules that each group wrote down in the Rule Familiarization phase and writes them on the board (without identifying which group is which). It is likely the two groups have formulated slightly different rules. The facilitator points out the differences.
     - Then the facilitator introduces the twist: The Skeptic in each group is now given a new instruction (on a card) to propose an alternative interpretation of the rule that fits all past artifacts and the guideline but leads to the opposite conclusion for the new artifact. For example, if the group initially thought the rule was about having geometric patterns and using local materials, the Skeptic might propose that the rule actually requires the artifact to have been found in a specific region (which the new artifact was not, but that was never specified before) or that the rule excludes artifacts with feathers because they were used in a later period. 

     - The Skeptic in each group now presents this alternative interpretation. The Curator must defend the original interpretation.

  5. Second Round: Attempted Resolution (20 minutes)
     - The groups reconvene. The Verifiers must now decide again on the new artifact, but now with two competing interpretations that both fit the past artifacts and the guideline. The groups are instructed to try to resolve the dispute using only the following resources:
          a. The explicit written guideline and past artifacts (the behavioral record).
          b. Their own mental intentions when they formulated the rule (private mental state).
          c. What they would say about hypothetical artifacts (behavioral dispositions) - the facilitator provides two hypothetical artifact descriptions for each group to consider (e.g., "A ceramic bowl with a fish design and no paint", "A gold necklace with a sun symbol"). They must say whether these would be AAA according to their rule and why.
          d. Consensus within the group (community agreement).

     - After discussion, the Verifiers vote again by secret ballot. They must also write a brief justification.

  6. Public Commitment and Failure (10 minutes)
     - Each group announces their vote (accept or reject the new artifact) and the vote count. They also post their justifications on the board.
     - The facilitator then points out:
          - The two groups may have reached different decisions.
          - Within a group, the vote might be split (especially if the Verifiers are convinced by different interpretations).

     - The facilitator emphasizes that both interpretations fit all the past data and the guideline. The groups are asked: Is there a fact of the matter about which rule was intended? How can we know? 

  7. Debrief (10 minutes)
     - The facilitator maps the activity to the skeptical argument:
          - Normative gap: The written guideline and past artifacts (like past behavior) underdetermine the rule. There is a gap between the descriptive facts (what was done) and the normative fact (what should be done in the new case).
          - Underdetermination of dispositions: When groups considered hypothetical artifacts, they found that their dispositions to apply the rule might not have been fixed in advance. The rule they thought they had didn't cover every case.
          - Circularity of community appeals: Even within a group, consensus might have been reached, but what if the group is wrong? The appeal to the group's agreement doesn't fix the rule because the group itself might be following a different rule without knowing it (as seen by the two groups diverging).

     - What predictably goes wrong:
          - Students might appeal to "common sense" or the obviousness of the rule. The facilitator should ask: which common sense? The two groups had the same data but might have different common senses. Or within a group, the Skeptic's alternative interpretation might have seemed plausible to some.
          - One group might have a false consensus: they all agree, but they might be wrong. The facilitator should ask: what if the entire group misunderstood the rule? How would they know?

     - The activity cannot reproduce the normative dimension: meaning involves correctness conditions that are not reducible to any descriptive fact. The facilitator must explain this: 
          "In our activity, we saw that we couldn't pin down the rule by any of the resources we tried. But note that in the real world, we think that there is a fact about what the rule really requires. The rule-following skeptic says: what fact is that? It can't be in the past behavior, or in our minds, or in our dispositions, or in the community's agreement. So what is it? This is the paradox: we think meaning is normative, but we can't find the source of that normativity."

     - The facilitator should avoid lecturing but instead draw out these points by asking questions and referring to what happened in the groups.

  Constraints: We are not using readings, citations, or technical jargon beyond what has been introduced. The scenario is novel and not rehearsed.

  Detailed Materials:

  - Past Artifact Cards (10 per group, examples):
    1. Clay pot: spiral pattern, found in Site A.
    2. Stone figurine: jaguar with turquoise inlays, found in Site B.
    3. Woven textile: geometric patterns in red and black, found in Site C.
    4. Gold pendant: sun symbol, found in Site D.
    5. Ceramic bowl: fish design, no paint, found in Site A.
    6. Obsidian knife: with handle carved with animal figures, found in Site B.
    7. Shell necklace: with engraved dots and lines, found in Site C.
    8. Wooden mask: painted blue, with feathers around the edges, found in Site A. (Note: feathers are present in past artifacts, but the skeptic might later argue they were of a different bird or attached in a different way)
    9. Stone tablet: inscribed with a calendar, found in Site D.
    10. Clay whistle: shaped like a bird, painted green, found in Site B.

  - Written Guideline (same for both groups):
    "Authentic Aztlan Artifacts are objects that:
     - Bear characteristic motifs of the Aztlan culture (such as spirals, jaguars, suns, geometric patterns, or animal figures) and 
     - Are made of materials available in the Aztlan region during the classical period (clay, stone, gold, wood, shells, obsidian, feathers, and natural pigments)."

  - New Artifact Card:
    "Wooden statuette of a serpent, about 20 cm long, painted with red and yellow geometric patterns, with macaw feathers attached to the back. Found in Site E (a site on the border of the Aztlan region)."

  - Twist for the Skeptic (given in phase 4):
    The Skeptic receives a card that says:
    "Propose an alternative interpretation: The guideline requires that the artifact must not only be made of materials available but also that the specific combination of materials must have been used in the classical period. Macaw feathers were not used until the post-classical period (though other feathers were). Also, Site E is outside the core Aztlan region, and artifacts found there are likely from a neighboring culture. Therefore, the artifact should be excluded."

    The Curator might argue: "The guideline does not mention the location of the find, and macaw feathers were available in the classical period even if not used until later. The patterns are clearly geometric and typical of Aztlan."

  - Hypothetical Artifacts for Phase 5 (each group gets two):
    Hypothetical 1: "A ceramic bowl with a fish design and no paint." (This should be accepted because it matches past artifacts and the guideline.)
    Hypothetical 2: "A gold necklace with a sun symbol, but made with a metal alloy that was not developed until after the classical period." (This should be rejected because the material is not period-appropriate.)

    But note: the Skeptic might extend their alternative rule to these. For example, the Skeptic might argue that the location of the find matters for the hypotheticals too. The facilitator should note that the Skeptic's rule must fit the past artifacts. Since past artifacts were found in various sites (including border sites?) the Skeptic must adjust. This is where the underdetermination becomes clear: the Skeptic can adjust the rule arbitrarily to fit the past.

  Adjustments for the activity:

  - The past artifacts should include one or two that come from border sites (like Site E) to complicate the Skeptic's location argument? But we want the Skeptic's argument to be plausible. So we can have one past artifact from Site E? But then the Skeptic must explain why that one was accepted and the new one is different. For example, the past artifact from Site E might not have feathers. So the Skeptic can say: "We accepted that because it had no non-classical materials, but the new one does." 

  Alternatively, the Skeptic's argument can be about the feathers only: "The use of macaw feathers in this manner is unprecedented in the classical period." The guideline says "materials available", but the Skeptic is adding a requirement about usage.

  This is the underdetermination: the guideline doesn't specify whether the material must have been used or just available.

  Thus, both interpretations (Curator: available; Skeptic: actually used) fit the past because the past artifacts with feathers might have used a different bird (e.g., past artifact 8: "feathers around the edges" but not specified which bird). We assume the past feathers were from a bird that was used in the classical period.

  Therefore, the new artifact uses macaw feathers, which were available but not used until later. The guideline doesn't specify.

  This is the crux.

  Running the Activity:

  Phase 1: Setup (10 min)
  - Divide groups, assign roles, hand out materials.

  Phase 2: Rule Familiarization (15 min)
  - Groups review past artifacts and guideline. Write a rule.

  Phase 3: First Round (15 min)
  - Each group: Curator argues for including the new artifact, Skeptic argues against (without the twist yet, so the Skeptic is just playing devil's advocate based on the initial rule). Then Verifiers vote.

  Phase 4: The Twist (10 min)
  - Facilitator writes rules from both groups on board, notes differences.
  - Gives Skeptics the twist card. Skeptics propose the alternative interpretation.

  Phase 5: Second Round (20 min)
  - Groups discuss with the two interpretations. They consider two hypotheticals. Then Verifiers vote again, with justifications.

  Phase 6: Public Commitment (10 min)
  - Groups report. Failure to agree is evident.

  Phase 7: Debrief (10 min)
  - Facilitator leads discussion mapping to the skeptical paradox.

  Total: 10+15+15+10+20+10+10 = 90 minutes.

  This should create the visceral experience of the skeptical gap.
answer: |-
  ### Skeptical Gap Activity: Museum Curation Verification Tribunal  
  **Domain:** Kripkenstein’s rule-following paradox, framed through artifact authentication.  
  **Core Problem:** Participants experience the underdetermination of rules by past behavior, mental states, dispositions, or consensus.  
  **Novel Scenario:** "Authentic Aztlan Artifacts" (AAA) classification tribunal. Participants act as a museum board deciding if a new artifact fits a vaguely defined historical category.  

  ---

  ### **1. Setup and Materials**  
  **Groups:**  
  - Two tribunals (Group A and Group B), each with 6 students.  
  - **Roles per tribunal:**  
    - **Curator (1):** Advocates for including the new artifact. Receives points if their tribunal accepts it.  
    - **Skeptic (1):** Advocates for excluding the artifact. Receives points if their tribunal rejects it.  
    - **Verifiers (4):** Decide the artifact’s status. Earn points for unanimous consensus OR for accurately predicting the other tribunal’s verdict.  

  **Materials:**  
  - **Past Artifact Cards (10 per group):** Descriptions of previously authenticated AAA artifacts.  
    *Example cards:*  
    - *Card 1:* "Clay tablet: spiral motif, red ochre pigment, found in Region X."  
    - *Card 2:* "Stone figurine: jaguar shape, no pigments, found in Region Y."  
    - *Card 8:* "Wooden mask: geometric carvings, parrot feathers, found in Region X." *(See twist below)*  
  - **Guideline Card (1 per group):** "AAA artifacts must:  
    (1) Display motifs from the Aztlan cultural lexicon (spirals, jaguars, geometric patterns),  
    (2) Use materials available in Aztlan pre-1500 CE (clay, stone, wood, local pigments, feathers)."  
  - **New Artifact Card (1 per group):** "Ceremonial staff: serpent motif with geometric etchings, dyed with *cochineal* (insect-based red pigment), crowned with *macaw feathers*."  
  - **Hypothetical Artifact Cards (2 per group, for Phase 4):**  
    - *Hypothetical 1:* "Pottery shard: spiral motif, synthetic blue dye (unavailable pre-1500)."  
    - *Hypothetical 2:* "Stone amulet: jaguar motif, no pigments, found in Region Z (disputed territory)."  
  - **Voting Tokens:** Green (accept) and red (reject) cards for verifiers.  
  - **Whiteboard:** Tracks tribunal verdicts and points.  

  **Points System (Small Stakes):**  
  - Curators/Skeptics: 2 pts per "win" (tribunal sides with them).  
  - Verifiers: 1 pt per unanimous verdict; 3 pts if they predict the *other* tribunal’s verdict correctly.  

  ---

  ### **2. Activity: Timed Phases (90 Minutes Total)**  
  **Phase 1: Rule Familiarization (10 min)**  
  - Groups review past artifact cards and guideline.  
  - **Task:** Each tribunal agrees on a 1-sentence rule defining AAA (e.g., "Motifs + locally available materials").  
  - *Facilitator Note:* Ensure rules are vague enough to allow divergent interpretations later.  

  **Phase 2: Initial Classification (15 min)**  
  - Groups evaluate the new artifact using their rule.  
  - **Process:**  
    1. Curator argues for inclusion (e.g., "Serpent motif is geometric; cochineal and feathers were available pre-1500").  
    2. Skeptic argues for exclusion (e.g., "Macaw feathers were traded post-1500; guideline implies *exclusive* use of local materials").  
    3. Verifiers vote openly. Result recorded on whiteboard.  
  - *Incentive:* Curators/Skeptics advocate fiercely for points.  

  **Phase 3: Deviant Interpretation Revealed (15 min)**  
  - **Twist:** Facilitator gives Skeptics a hidden instruction:  
    *"Argue that the rule requires motifs to be *hand-carved* (not etched). All past artifacts were carved; the new artifact is etched. This excludes it but fits all past cases."*  
  - Skeptics present this interpretation. Curators counter.  
  - **Key:** Both interpretations fit past artifacts and the guideline.  
  - *Facilitator Note:* Highlight that the new artifact’s etching technique was never previously tested.  

  **Phase 4: Resolution Attempt (25 min)**  
  - Verifiers must resolve the dispute using **four resources**:  
    1. **Past applications (behavioral record):** Re-examine artifact cards.  
    2. **Explicit instructions:** Re-read guideline card.  
    3. **Private mental states:** Verifiers/advocates share "what I originally intended the rule to mean."  
    4. **Behavioral dispositions:** Groups apply their rule to the 2 hypothetical artifacts.  
  - **Incentive:** Verifiers seek unanimous consensus for points but can gamble on predicting the other tribunal.  
  - **Outcome:** Groups deliberate separately. No inter-tribunal communication.  

  **Phase 5: Public Commitment (10 min)**  
  - Each tribunal announces:  
    (a) Final verdict (accept/reject).  
    (b) Justification using one resource (e.g., "We appealed to dispositions: Hypothetical 1 was rejected, so new artifact is similar").  
  - Verifiers secretly predict the other tribunal’s verdict.  
  - **Result:**  
    - Tribunals often split (e.g., Group A accepts, Group B rejects).  
    - Verifiers rarely predict correctly; consensus is unstable.  
  - Points awarded publicly. Whiteboard highlights disagreement.  

  ---

  ### **3. Debrief (15 min)**  
  **Mapping the Activity to the Skeptical Paradox:**  
  - **Normative Gap (Behavior vs. Correctness):**  
    - *Activity Moment:* Both tribunals fit past artifacts perfectly but diverge on the new case.  
    - *Facilitator Q:* "What *fact* determines who is correct? Not the past artifacts—both interpretations fit them."  
  - **Underdetermination of Dispositions:**  
    - *Activity Moment:* Hypothetical artifacts forced new judgments, revealing dispositions weren’t fixed in advance (e.g., "We never considered etching until now").  
    - *Facilitator Q:* "Did your answers to hypotheticals prove what the rule *always* meant, or did they extend it arbitrarily?"  
  - **Collapse of Consensus:**  
    - *Activity Moment:* Tribunals reached different verdicts despite identical evidence.  
    - *Facilitator Q:* "If your tribunal agreed, why is the other tribunal’s verdict equally justified? What makes your consensus more than a coincidence?"  

  **Predictable Breakdowns & Handling:**  
  - **"Common Sense" Objection:** Students insist their interpretation is obvious.  
    - *Handling:* "Group A called it obvious to accept; Group B called it obvious to reject. Which common sense is right? How do we know without circularity?"  
  - **False Consensus:** One tribunal agrees unanimously but cannot explain why the other group disagrees.  
    - *Handling:* "Your consensus feels solid—but did it arise from the *rule itself* or shared biases? Could your entire group be misapplying the rule?"  
  - **Avoiding Lecture:** Use Socratic questioning. *Example:* "Skeptic, when you said etching was excluded, what resource could prove you wrong? Curator, how did your mental intention help when the Skeptic reinterpreted it?"  

  **Limitation and Normative Move:**  
  - **What the Activity Can’t Capture:** The *normative* dimension—meaning involves correctness conditions transcending behavior/psychology.  
  - **Facilitator’s Verbal Move:**  
    > "Today, you felt the frustration of underdetermination: no fact forced one verdict. But notice—we all believe one tribunal *must* be *wrong*. That intuition—that meaning sets standards beyond what we *do* or *think*—is the paradox. The skeptic asks: if nothing in your past, mind, dispositions, or peers fixes correctness, what does? This gap is where rule-following breaks down."  

  ---

  ### **4. Constraints Addressed**  
  - **No readings/citations:** Standalone activity; no texts needed.  
  - **No technical jargon:** Uses plain terms (e.g., "mental intentions" vs. "introspective states").  
  - **No rehearsed examples:** Aztlan artifacts replace "+/quus"; etching/feathers inject novelty.  
  - **Accessibility:** Roles ensure engagement; points make stakes tangible but low-pressure.  

  **Final Note:** This design forces participants to *live* the paradox. The tribunal framing makes underdetermination visceral—students hit a wall trying to arbitrate a dispute with no objective anchor. The debrief crystallizes this into the philosophical problem.
