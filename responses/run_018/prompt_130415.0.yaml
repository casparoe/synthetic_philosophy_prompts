prompt: |-
  Hey, I've been editing for a rationalist-leaning longform magazine (mostly science/history) and we're getting swamped with pitches that sit right on the border between "controversial but legit revisionism" and full-on pseudohistory. I need a reusable decision procedre -- like a checklist my research team can actually run in about 20 minutes -- that turns the philosophy-of-science demarcation idea into something operational.

  Specifically, I'm thinking the core principle is that pseudohistory doesn't just get facts wrong; it builds in insulation from the kinds of correction that work in neighboring disciplines (archaeology, physics, philology, statistics). Legitimate revisionism stays exposed to those corrections even when it's wrong. I want that turned into ordered questions with pass/fail/unclear, clear stop points, and explicit flags where a human has to make a values call rather than apply a rule.

  Please include:
  - The actual flow in words, with branching logic spelled out.
  - For each step: the exact question, what counts as sufficient to move on, and where the step forces a judgment call that can't be automated.
  - Three worked examples:
    1. A pitch arguing Atlantis was a real Bronze Age civilization but mislocated (uses some geological data, references ancient texts selectively).
    2. Fomenko-style New Chronology arguing that conventional medieval chronology is a forgery and timelines are compressed.
    3. One where the procedure gives an answer I'll dislike: a well-funded archaeological pitch that uses real radiocarbon dating but embeds the results in an auxiliary hypothesis (e.g., "local contamination patterns are systematically misread by mainstream labs") that protects a radical claim from falsification.

  Also be explicit about what this procedre flat-out can't settle, and please don't include a bibliography or citation list -- I want something a model can generate without web access, and my team won't have one either.

  One more constraint: I want to make sure we don't drop the distinction between "this claim is false" and "this claim is pseudohistorical" -- those should come out at different steps in the flow.
reasoning: |-
  We are creating a decision procedure (a checklist) that operationalizes the demarcation between legitimate revisionism and pseudohistory. The core principle is that pseudohistory builds in insulation from correction by standard disciplinary methods (archaeology, physics, philology, statistics), whereas legitimate revisionism remains exposed to such corrections.

  The procedure will be a sequence of questions with pass/fail/unclear outcomes. We must have clear stop points and flags for human judgment calls. We also want to distinguish between a claim being false and being pseudohistorical.

  The flow:

  1. **Factual Correctness Check (Preliminary)**: This step is about whether the claim is factually wrong by current consensus, but note that being wrong does not make it pseudohistory. We are only flagging for the team that it is controversial. We do not stop here because we are more interested in the structure of the argument.

  2. **Insulation Check**: This is the core. We check if the claim is insulated from correction by standard methods. This is where pseudohistory is detected.

  3. **Falsifiability and Auxiliary Hypotheses**: We look at how the claim handles potential disconfirming evidence. If it uses ad hoc hypotheses to protect the core claim from falsification, that is a red flag.

  4. **Handling of Counter-evidence**: How does the work address existing counter-evidence? Does it engage with it or dismiss it without proper argument?

  5. **Methodological Transparency and Reproducibility**: Can others independently test the claims? Is the method clear and reproducible?

  6. **Peer Consensus and Engagement**: While consensus isn't the criterion, we note whether the work engages with the broader scholarly community or exists in isolation.

  We design the steps to be as objective as possible, but some steps require judgment.

  **The Procedure in Steps**:

  **Step 1: Factual Correctness (Preliminary)**
  - **Question**: Does the pitch's central claim(s) contradict the current academic consensus in the relevant field(s) as understood by our research team?
    - Pass: No, it does not contradict (or it is a minor point that doesn't affect the core). Move to Step 2.
    - Unclear: The team is unsure about the consensus. Move to Step 2 but flag for human review at the end.
    - Fail: Yes, it contradicts. Note this as a "controversial" claim and move to Step 2. (We do not stop here because we are interested in the structure.)

  **Step 2: Insulation from Correction**
  - **Question**: Does the pitch build in mechanisms that would insulate its central claims from being corrected by standard methods in the relevant neighboring disciplines (e.g., archaeology, physics, philology, statistics)? 
    - Consider: Does it dismiss entire disciplines as invalid? Does it claim that standard methods (like radiocarbon dating) are systematically flawed without providing a compelling, independently testable alternative? Does it require a complete overhaul of well-established methods without extraordinary evidence?
    - Pass: No insulation detected. Move to Step 3.
    - Unclear: Some elements might be insulating, but it's not clear. Flag for human review and move to Step 3.
    - Fail: Yes, clear insulation. Stop and mark as "pseudohistorical". (This is a stop point.)

  **Step 3: Falsifiability and Auxiliary Hypotheses**
  - **Question**: Are the central claims framed in a way that they could be falsified by empirical evidence? And if auxiliary hypotheses are used to explain away counter-evidence, are these hypotheses independently testable and not ad hoc?
    - Pass: The claims are falsifiable, and any auxiliary hypotheses are independently testable. Move to Step 4.
    - Unclear: The falsifiability is ambiguous, or the testability of auxiliary hypotheses is unclear. Flag for human review and move to Step 4.
    - Fail: The claims are not falsifiable, or auxiliary hypotheses are ad hoc (designed solely to protect the core claim and not independently testable). Mark as "pseudohistorical" and stop.

  **Step 4: Handling of Counter-evidence**
  - **Question**: Does the pitch engage with existing counter-evidence in a substantive way (e.g., by providing alternative interpretations that are consistent with the evidence and the broader disciplinary context) or does it dismiss, ignore, or explain away counter-evidence without adequate argument?
    - Pass: Engages substantively with counter-evidence. Move to Step 5.
    - Unclear: Engagement is partial or unclear. Flag for human review and move to Step 5.
    - Fail: Dismisses or ignores counter-evidence without substantive engagement. Mark as "pseudohistorical" and stop.

  **Step 5: Methodological Transparency and Reproducibility**
  - **Question**: Are the methods used clearly described so that they could be replicated by others in the field? And does the pitch provide access to data and methods in a way that allows for independent verification?
    - Pass: Methods are clear and reproducible, and data access is provided (or feasible). Move to Step 6.
    - Unclear: Some methods are unclear, or data access is questionable. Flag for human review and move to Step 6.
    - Fail: Methods are opaque and not reproducible, or data is not provided and cannot be independently verified. Mark as "pseudohistorical" and stop.

  **Step 6: Peer Consensus and Engagement**
  - **Question**: Does the pitch engage with the broader scholarly community? (E.g., by citing mainstream scholarship, addressing debates, or being published in venues that are peer-reviewed?) Note: This step is not about consensus being against it, but about whether it is isolated from the community.
    - Pass: Yes, it engages with the community. The pitch is not pseudohistorical by our criteria, though it may be controversial and false. Mark as "legitimate revisionism" (though possibly false) and pass to editorial judgment.
    - Unclear: Engagement is minimal or unclear. Flag for human review and mark as "unclear, needs human judgment".
    - Fail: It exists in isolation, dismissing the entire field and not engaging with any mainstream scholarship. Mark as "pseudohistorical" and stop.

  **Notes**:
  - At any step that results in a Fail, we stop and mark as pseudohistorical.
  - Steps that are passed without a fail and without being marked for human review lead to the next step.
  - If at the end we have no fail and no stop, and if there were flags for human review, then we have a human review. Otherwise, it passes as legitimate revisionism (though it might be false).

  **What the procedure cannot settle**:
  - It cannot settle whether a claim is true or false (only that it is pseudohistorical or not).
  - It might not catch very sophisticated pseudohistory that mimics legitimate methods but is still insulated in subtle ways.
  - It relies on the research team's understanding of the current consensus and standard methods. If the team is not expert, they might misjudge.

  **Worked Examples**:

  Example 1: Atlantis as a real Bronze Age civilization but mislocated (uses geological data, references ancient texts selectively).

  - Step 1: Fail (contradicts consensus) -> mark controversial and move on.
  - Step 2: We look for insulation. The pitch uses geological data and ancient texts. But does it insulate? If it says that the absence of evidence is because it's underwater and we haven't looked in the right place, that might be acceptable. However, if it claims that mainstream archaeology is ignoring evidence because of bias, without proof, that could be insulation. Let's assume it does not dismiss entire disciplines but just argues for a different location. Pass to Step 3.
  - Step 3: The claim is falsifiable (if we survey the proposed location and find nothing, that would count against). Auxiliary hypotheses? If the pitch says that the lack of evidence is due to the specific location being unexplored, that is testable (by exploring). But if it says that even if we don't find anything, it's because of some untestable reason (e.g., "the civilization was so advanced it left no trace"), then fail. Let's assume it doesn't do that. Pass to Step 4.
  - Step 4: How does it handle counter-evidence? The pitch might acknowledge that previous searches failed but argue they were in the wrong place. That's engagement. Pass to Step 5.
  - Step 5: Methods: It uses geological data and textual analysis. If the methods are standard and reproducible, pass. If the textual analysis is very selective without a clear method, it might be unclear or fail. Let's assume it's clear. Pass to Step 6.
  - Step 6: Does it engage with the community? It might cite some mainstream scholarship but also fringe. If it ignores the mainstream debate on Atlantis, that would be a problem. But if it engages, then pass. Let's assume it does engage. Result: legitimate revisionism (though false by consensus).

  Example 2: Fomenko-style New Chronology (conventional medieval chronology is a forgery, timelines compressed).

  - Step 1: Fail (contradicts consensus) -> mark controversial and move on.
  - Step 2: Does it insulate? Fomenko's work typically claims that the entire field of history is based on a forgery and that standard dating methods (like dendrochronology) are either flawed or part of the conspiracy. This is insulation. Fail -> pseudohistorical. Stop.

  Example 3: Well-funded archaeological pitch using real radiocarbon dating but with an auxiliary hypothesis that local contamination patterns are systematically misread by mainstream labs.

  - Step 1: Likely fail (if the claim is radical and contradicts consensus) -> mark controversial and move on.
  - Step 2: Does it insulate? The pitch uses radiocarbon dating (a standard method) but claims that mainstream labs are systematically misreading contamination. This might be insulation if the claim is that only their lab can do it right without providing a testable method for others to verify. But if they provide a new method for detecting contamination that is testable, then it might not be. However, if they say that even if other labs follow their method and get different results, it's because of some unstated bias, that would be insulation. Let's assume they provide a testable method. Pass to Step 3.
  - Step 3: The core claim: the radical reinterpretation of the site. Auxiliary hypothesis: contamination patterns are misread. Is this independently testable? They might have a method to detect contamination that others can replicate. If so, pass. But if they say that the contamination is only detectable by their proprietary method that they won't share, then fail. Let's assume they describe the method. Pass to Step 4.
  - Step 4: Handling counter-evidence: They must address why other labs have not seen this contamination. If they provide arguments and data, that's engagement. Pass to Step 5.
  - Step 5: Methodological transparency: They must share their method for detecting contamination. If they do, pass. If not, fail. Let's assume they do. Pass to Step 6.
  - Step 6: Engagement: They are well-funded and might be publishing in non-mainstream venues. If they engage with the literature and cite mainstream work, pass. If they dismiss the entire field, fail. Let's assume they do engage. Result: legitimate revisionism (though the research team might dislike it because it's radical and possibly false).

  However, note that in Step 3, if the auxiliary hypothesis is not independently testable (e.g., they say that contamination is present only in ways that their method can detect and no one else's, and they don't provide a way for others to validate their method), then it would fail at Step 3.

  **Important**: The procedure is designed to be run by a research team in about 20 minutes. They must rely on their knowledge and quick checks. If at any point they cannot decide, they mark unclear and flag for human review at the end (if the process doesn't stop earlier). The final decision on unclear cases and on the editorial judgment for legitimate revisionism is human.

  This procedure distinguishes false claims (which might pass the test and be legitimate revisionism) from pseudohistorical ones (which are insulated from correction).
answer: |-
  ### Decision Procedure for Distinguishing Pseudohistory from Legitimate Revisionism  
  **Core Principle**: Pseudohistory insulates claims from correction by standard disciplinary methods (e.g., archaeology, physics, philology, statistics). Legitimate revisionism remains falsifiable via these methods, even if controversial or false.  

  **Procedure Flow** (Run in sequence; stop at any "Fail" for pseudohistory):  
  1. **Preliminary Fact Check** → 2. **Insulation from Correction** → 3. **Falsifiability & Auxiliary Hypotheses** → 4. **Handling Counter-Evidence** → 5. **Methodological Transparency** → 6. **Peer Engagement**.  
  **Outcomes**:  
  - **Pass**: Proceed to next step.  
  - **Fail**: Reject as pseudohistory. Stop.  
  - **Unclear**: Flag for human review (proceed but note concerns).  
  - **Final Result**: Only if all steps pass, classify as "legitimate revisionism" (may still be false).  

  ---

  ### Step-by-Step Checklist  
  #### **Step 1: Preliminary Fact Check**  
  - **Question**: Does the central claim contradict well-established consensus in relevant fields (e.g., archaeology, history, physics)?  
    - *Pass*: No contradiction, OR contradiction exists but is minor/contextual.  
    - *Fail*: Directly contradicts bedrock facts (e.g., "Egyptian pyramids were built in 500 AD" vs. radiocarbon dating).  
    - *Unclear*: Contradiction is plausible but hinges on disputed evidence.  
  - **Judgment Call**: Team must assess consensus strength (no automation).  
  - **Move On**: Pass/Unclear → Proceed to Step 2. Fail → Stop (pseudohistory).  
  - **Note**: A "Fail" here means the claim is **false**, but *not yet pseudohistorical*. Proceed to Step 2 to test insulation.  

  #### **Step 2: Insulation from Correction**  
  - **Question**: Does the pitch dismiss, bypass, or redefine standard methods (e.g., radiocarbon dating, textual criticism, stratigraphy) to avoid falsification?  
    - *Pass*: Uses standard methods OR proposes alternatives that are testable within existing frameworks.  
    - *Fail*: Rejects entire disciplines/methods as invalid (e.g., "all radiocarbon labs are corrupt").  
    - *Unclear*: Mixes valid methods with ad hoc exemptions (e.g., "method X works everywhere except here").  
  - **Judgment Call**: Deciding if a method is "standard" or "bypassed" requires field expertise.  
  - **Move On**: Pass/Unclear → Proceed to Step 3. Fail → Stop (pseudohistory).  

  #### **Step 3: Falsifiability & Auxiliary Hypotheses**  
  - **Question**: Could the core claim be disproven by evidence? Are auxiliary hypotheses (e.g., "contamination altered results") independently testable?  
    - *Pass*: Core claim is falsifiable, and auxiliary hypotheses can be tested without circular logic.  
    - *Fail*: Core claim is unfalsifiable OR auxiliary hypotheses are untestable/recursive (e.g., "evidence against us was faked").  
    - *Unclear*: Testability is ambiguous (e.g., "we need future technology to verify").  
  - **Judgment Call**: Assessing if auxiliary hypotheses are "ad hoc" vs. "legitimate caveats."  
  - **Move On**: Pass/Unclear → Proceed to Step 4. Fail → Stop (pseudohistory).  

  #### **Step 4: Handling Counter-Evidence**  
  - **Question**: Does the pitch substantively engage with counter-evidence (e.g., alternative interpretations, data gaps) rather than dismissing it?  
    - *Pass*: Addresses counter-evidence directly (e.g., reanalyzes data, cites opposing studies).  
    - *Fail*: Ignores counter-evidence OR dismisses it via conspiracy/exceptionalism (e.g., "mainstream scholars hide the truth").  
    - *Unclear*: Engages selectively or superficially.  
  - **Judgment Call**: Distinguishing "substantive engagement" from "token acknowledgment."  
  - **Move On**: Pass/Unclear → Proceed to Step 5. Fail → Stop (pseudohistory).  

  #### **Step 5: Methodological Transparency**  
  - **Question**: Are data sources, methods, and tools fully disclosed for independent verification?  
    - *Pass*: Data/methods are transparent and replicable (e.g., raw data shared, software cited).  
    - *Fail*: Opaque methods, inaccessible data, or reliance on "secret knowledge."  
    - *Unclear*: Partial disclosure (e.g., summaries but no raw data).  
  - **Judgment Call**: Determining if omissions are practical (e.g., privacy) vs. protective.  
  - **Move On**: Pass/Unclear → Proceed to Step 6. Fail → Stop (pseudohistory).  

  #### **Step 6: Peer Engagement**  
  - **Question**: Does the pitch engage with peer-reviewed literature or address academic debates?  
    - *Pass*: Cites relevant scholarship, including critics.  
    - *Fail*: Only cites fringe sources OR claims academia is "biased" to avoid engagement.  
    - *Unclear*: Limited citations but acknowledges mainstream work.  
  - **Judgment Call**: Weighing source quality (e.g., preprint vs. predatory journal).  
  - **Final Result**: Pass → Legitimate revisionism (may be false). Fail → Pseudohistory. Unclear → Human review.  

  ---

  ### Worked Examples  
  #### Example 1: Atlantis as Real Bronze Age Civilization (Misplaced)  
  - **Step 1 (Fact Check)**: *Fail* (contradicts consensus that Atlantis is myth). **False but not pseudohistorical yet**.  
  - **Step 2 (Insulation)**: *Unclear* (uses geological data but selectively interprets Plato). Flag.  
  - **Step 3 (Falsifiability)**: *Pass* (claim could be disproven by surveying proposed location).  
  - **Step 4 (Counter-Evidence)**: *Fail* (dismisses lack of archaeological evidence as "flawed search methods"). → **Pseudohistory**. Stop.  

  #### Example 2: Fomenko New Chronology (Compressed Timelines)  
  - **Step 1 (Fact Check)**: *Fail* (contradicts radiocarbon/astronomical dating). **False but not pseudohistorical yet**.  
  - **Step 2 (Insulation)**: *Fail* (rejects dendrochronology, philology as "corrupt"). → **Pseudohistory**. Stop.  

  #### Example 3: Radical Archaeological Claim with Contamination Hypothesis  
  - **Step 1 (Fact Check)**: *Fail* (contradicts consensus timelines). **False but not pseudohistorical yet**.  
  - **Step 2 (Insulation)**: *Pass* (uses radiocarbon dating; doesn’t reject the method).  
  - **Step 3 (Falsifiability)**: *Fail* (auxiliary hypothesis: "labs misread contamination" is untestable without access to all lab data). → **Pseudohistory**. Stop.  
  - **Why you’ll dislike this**: The pitch uses real data but insulates the claim via an unfalsifiable auxiliary hypothesis. Fails Step 3.  

  ---

  ### What This Procedure Cannot Settle  
  1. **Truth of Claims**: Determines if a claim is *pseudohistorical*, not if it’s true/false (e.g., a passed pitch may still be false).  
  2. **Novelty vs. Fringe**: Legitimate breakthroughs often start fringe; human judgment needed for context.  
  3. **Political/Emotional Bias**: Does not detect if pitch is motivated by ideology (e.g., nationalist narratives).  
  4. **Sophisticated Insulation**: May miss subtle pseudohistory that mimics legitimate methods (e.g., "big data" analyses with hidden assumptions).  

  ### Key Distinctions Maintained  
  - **False Claim**: Fails Step 1 only (contradicts consensus but remains correctable).  
  - **Pseudohistorical Claim**: Fails Steps 2–6 (insulated from correction).  
  - **Legitimate Revisionism**: Passes all steps (falsifiable via standard methods, even if false).  

  **Time Estimate**: 20 min/pitch (team assigns one step per member, consolidates results).  
  **Output**: "Pseudohistory" (reject), "Legitimate Revisionism" (consider for publication), or "Human Review Needed" (unclear flags).
