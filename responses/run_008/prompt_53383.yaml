  8.  *(Self-Correction on Word Count)*: I need to make sure I don't ramble. I will write tightly.

      *   *Drafting thought:* Start with the bottom line.
      *   *Drafting thought:* Explain Good's Theorem simply: "Paying to avoid regret."
      *   *Drafting thought:* Tackle the "Committee" issue. It's not just about priors; it's about whether the survey resolves the *right* uncertainty.
      *   *Drafting thought:* The announcement effect is the biggest risk. If the survey says "Shuttle is popular," students might ride more *before* the decision, inflating the value. Or if "Lounge is getting renovated," they stop using it. This makes the data noisy.

      *   *Final Polish:* Ensure the distinction between "Information Value" and "Information Cost" is clear.

      *(Wait, one nuance)*: The user asked: "tell me what would have to be true... that would flip your recommendation." I need to make sure this is prominent.

      Okay, ready to write.

      *Word Count Check:* A 5-minute speech is typically 650-800 words. I will aim for that range.

