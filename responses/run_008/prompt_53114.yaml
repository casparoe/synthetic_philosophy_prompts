          *   *Analysis:* This looks like a contextual refinement, not a contradiction. (3) provides the *general* mechanism for why misleading is usually less bad. (4) identifies a specific context where that mechanism fails (no room to press), so the moral status converges.
          *   *Verdict:* Compatible, but (3) needs to be framed as a *prima facie* explanation, not a necessary condition.

      *   **(2) & (6):**
          *   (2) says misleading is *pro tanto* less wrong than lying.
          *   (6) says when deception is unjustified, the distinction makes no difference to *permissibility*, only degree of blame.
          *   *Analysis:* "Pro tanto less wrong" usually implies a difference in moral weight. (6) says both are impermissible (same permissibility status) but lying attracts more blame (degree). This seems consistent. If Act A is -10 wrongness and Act B is -5 wrongness, both might be below the threshold of permissibility (0), but A is worse.
          *   *Verdict:* Compatible.

