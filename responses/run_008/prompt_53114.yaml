      *   **(4) Courtroom Exception:** In court, a literally true but misleading answer to a *direct question* is roughly as culpable as lying. Reason: No opportunity to press/check (question was maximally direct).
      *   **(5) Justified Deception:** In cases like "Murderer at the Door," one should mislead, not lie. Lying to the unjust is still lying (morally costly), misleading is permissible.
      *   **(6) Unjustified Deception:** When deception is *not* justified, the lying/misleading distinction doesn't affect *permissibility* (both impermissible), only *degree of blame*. The wrong-making feature is the *intended false belief*.

  2.  **Analyze Pairwise Tensions:**

      *   **(2) & (3) vs. (4):**
