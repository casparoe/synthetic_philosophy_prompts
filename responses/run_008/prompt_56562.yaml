prompt: |-
  Two postdocs in my lab, whom I'll call Marta and Jonas, had a long-running disagreement at our methods reading group about what, if anything, the frequentist-versus-Bayesian dispute has to do with the replication crisis. I was in the room and took notes, and since they've now asked me to referee, I'd rather not tip my hand. Here is the exchange as faithfully as I can reconstruct it.

  (1) Marta opened by claiming that the replication crisis is a crisis of incentives and sloppy practice, not of frequentist statistics. p-hacking, outcome switching, publication bias, and small samples would corrode any framework: swap p-values for Bayes factors tomorrow and you would soon see B-hacking — peeking at accumulating data until the factor crosses a threshold, trying multiple specifications until one clears a "decisive" band, and settling on whatever prior makes a weak result look strong. The garden of forking paths, she said, is planted in human psychology, not in Neyman-Pearson theory, and neither likelihoods nor priors weed it.

  (2) Jonas granted all of that but said it misses the one place where the formalism itself makes a difference: optional stopping. If a researcher monitors the data as it arrives and stops as soon as p < .05, the actual long-run false-positive rate of that procedure is far above 5% and can be driven arbitrarily close to 1, so a frequentist who peeks is doing something the theory itself condemns. A Bayesian who updates continuously commits no analogous sin: the posterior, and the Bayes factor, depend only on the likelihood of the data actually observed, not on the sampling plan that might have produced other data. So at least one documented amplifier of the crisis — undisclosed sequential peeking — is a specifically frequentist vulnerability, and switching frameworks would eliminate it even if nothing else changed.

  (3) Marta replied that this "virtue" is bought at a price Jonas wasn't mentioning: the likelihood principle that makes inference immune to stopping rules also makes it immune to things we have reason to care about. It severs inference from anything involving the sample space, which is exactly where error control lives — and error control, she argued, is what a scientific field is for. Replication just is a long-run frequency property; a community whose individual members produce perfectly coherent posteriors can still be collectively miscalibrated, and Jonas's own criterion of success for reform — "will the findings replicate?" — is itself a frequency, so he was judging frequentist machinery by a frequentist standard while rejecting the machinery. She also noted that the newest Bayesian proposals in the methods literature keep importing frequentist ideas, like guarantees of calibrated intervals, which she took as a concession that coherence alone is not enough for science.

  (4) Jonas's final word was that Marta had quietly shifted the target. His claim in step (2) was not that Bayes fixes science, only that one specific crisis amplifier is framework-relative, and that claim survives everything she said; that the field's overall health is a long-run property is no argument that an individual researcher's evidential summary should be constructed from hypothetical unobserved data. He added that if she really believed error rates were the whole story, she should explain preregistration to herself: the field's flagship reform is a bureaucratic procedure for constraining the sample space of analyst behavior, which suggests the profession has concluded that the mathematical framework, whichever it is, cannot save it from itself.

  They then looked at me, and I discovered I could see both sides of nearly every move. Please adjudicate the exchange move by move: rate each of the four numbered moves on a scale from clearly mistaken to clearly right, with brief justification for each rating; identify any points where one of them is arguing against a claim the other never actually made; and, if there is anything substantive both of them are missing about the relation between the replication crisis and the statistical framework debate, say what it is. Conclude with an overall verdict on who came out ahead, if either did.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a debate between two postdocs (Marta and Jonas) about the relationship between the frequentist-vs-Bayesian dispute and the replication crisis.
      *   **Input:** A reconstructed four-move exchange.
      *   **Requirements:**
          1.  Rate each of the four moves (Clearly Mistaken to Clearly Right) with justification.
          2.  Identify any "straw man" arguments (arguing against claims not made).
          3.  Identify substantive points *both* might be missing.
          4.  Provide an overall verdict on who came out ahead.
      *   **Constraint:** The user (the PI/observer) wants to remain neutral ("rather not tip my hand"), so the adjudication should be balanced, rigorous, and insightful, avoiding simple partisan takes.

  2.  **Analyze the Debate Moves:**

      *   **Move 1 (Marta):** The crisis is about incentives/sloppiness (p-hacking, publication bias, etc.), not the statistics itself. Bayesian methods would suffer from "B-hacking" (prior hacking, peeking for BF thresholds). The "garden of forking paths" is psychological, not mathematical.
          *   *Assessment:* Generally strong. Most methodologists agree that QRPs (Questionable Research Practices) are the primary driver. Bayesian methods are not immune to researcher degrees of freedom.
          *   *Rating:* Mostly Right.

      *   **Move 2 (Jonas):** Grants Move 1 but isolates *optional stopping*. Frequentist error rates inflate with peeking; Bayesian updating does not depend on stopping rules (Likelihood Principle). Therefore, one specific amplifier of the crisis is framework-relative, and switching eliminates *this* vulnerability.
          *   *Assessment:* Technically correct regarding the Likelihood Principle and stopping rules. Bayes factors *are* immune to stopping rules *in theory*. However, the claim that switching frameworks "eliminates" the vulnerability might be too strong if B-hacking (Move 1) applies to priors or BF thresholds. But strictly regarding *stopping rules*, he is right.
          *   *Rating:* Mostly Right (with caveats on "eliminates").

      *   **Move 3 (Marta):** The price of immunity to stopping rules is the Likelihood Principle, which severs inference from error control (sample space). Replication is a long-run frequency property. Coherent posteriors $\neq$ calibrated science. Bayesian methods are importing frequentist calibration checks anyway.
          *   *Assessment:* Strong philosophical point. Science often requires long-run reliability (frequentist properties). If Bayesian methods don't calibrate, they don't solve the replication crisis (which is defined by failure to replicate). She correctly identifies that "replication" is inherently frequentist.
          *   *Rating:* Clearly Right.

      *   **Move 4 (Jonas):** Marta shifted the target. He only claimed *one specific amplifier* is framework-relative, not that Bayes fixes science. Individual evidence shouldn't depend on unobserved data. Preregistration proves the math can't save us from ourselves (supporting the idea that behavior matters more than framework).
          *   *Assessment:* Good defense of scope. He narrows his claim back to the specific technical point about stopping rules. The preregistration point is interesting: it admits that *constraints on behavior* are needed regardless of framework, which actually undermines his earlier optimism that switching frameworks would help significantly.
          *   *Rating:* Mostly Right (but the preregistration point cuts both ways).

  3.  **Evaluate "Straw Man" Accusations:**
      *   Did Marta argue against a claim Jonas didn't make? Jonas claimed Bayes fixes *optional stopping*, not the whole crisis. Marta argued Bayes doesn't fix *calibration/replication*. This is a shift in scope, but is it a straw man? Jonas implied switching frameworks would help the crisis ("switching frameworks would eliminate it [one documented amplifier]"). Marta counters that eliminating that amplifier doesn't solve the crisis because replication is frequentist. It's more of a "That's not sufficient" than a "You said X" (where X is false).
      *   Did Jonas argue against a claim Marta didn't make? Marta didn't say error rates are the *whole* story, just that they are what science is for. Jonas accused her of thinking error rates are the "whole story." This is a slight caricature, but she did emphasize them heavily.
      *   *Verdict:* No egregious straw men, but some talking past each other regarding scope (individual evidence vs. collective reliability).

  4.  **Identify Missing Substance:**
      *   **Computational/Implementation Reality:** Both assume idealized versions of the stats. In practice, Bayesian computation (MCMC, convergence) introduces new failure modes.
      *   **The Definition of "Replication":** Is it exact replication (same effect size) or directional replication (sign)? Bayes handles evidence gradation better, which might reduce the "publish or perish" binary pressure.
      *   **Prior Sensitivity:** Jonas didn't address how sensitive BFs are to prior specification in small samples (which are common in the crisis).
      *   **The "New Statistics":** Both ignore estimation/effects sizes/CIs (frequentist or Bayesian) as the actual solution, rather than NHST vs. Bayes.
      *   **Incentive Compatibility:** Neither deeply addresses how the *interpretation* of the statistic drives behavior. p < .05 is a bright line that drives behavior. Does BF > 3 do the same? Likely yes.

  5.  **Drafting the Adjudication:**

      *   *Tone:* Professional, academic, balanced (like a referee report).
      *   *Structure:*
          1.  Move-by-move rating and justification.
          2.  Analysis of argumentative alignment (straw men/talking past).
          3.  Missing substantive points.
          4.  Overall verdict.

      *   *Refining the Ratings:*
          *   Move 1: **Mostly Right.** (Standard consensus view).
          *   Move 2: **Partially Right.** (Technically true on stopping rules, but overstates the practical impact on the crisis).
          *   Move 3: **Clearly Right.** (Hits the core definition of replication).
          *   Move 4: **Mostly Right.** (Good scope defense, but the preregistration point undermines his own optimism).

      *   *Refining the "Missing" section:* Focus on the *binary threshold* problem. Both p-values and Bayes Factors get thresholded in practice. Also, the distinction between *evidential meaning* (Jonas) and *decision reliability* (Marta).

      *   *Refining the Verdict:* It's a draw, but Marta has the stronger hand regarding the *definition* of the crisis. Jonas wins on the specific technical point of stopping rules, but Marta wins on whether that matters for the *crisis* (which is about replication rates).

  6.  **Final Review against Constraints:**
      *   Did I tip my hand? I need to remain neutral. I will praise the strengths of both.
      *   Did I answer all parts? Yes (Ratings, Straw Men, Missing Points, Verdict).

  7.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to sound like I'm solving the debate, but evaluating the *arguments presented*.
      *   *Nuance on Move 2:* Jonas says switching frameworks would eliminate the vulnerability *even if nothing else changed*. This is theoretically true for the stopping rule inflation, but if "nothing else changed" includes the incentive to find significance, researchers might just hack priors. I need to note this tension.
      *   *Nuance on Move 4:* Jonas uses preregistration to argue math can't save us. This actually supports Marta's Move 1 (incentives/practice matter more). I should point out that Jonas inadvertently conceded Marta's main point in his final defense.

  8.  **Final Polish:** Check tone for fairness and clarity. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Ensure the ratings are clear. Use a scale like "Substantially Correct," "Partially Correct," etc., to avoid binary "Right/Wrong" which might seem too decisive. Actually, the prompt asks for "clearly mistaken to clearly right." I will use that scale.

  Let's refine the "Missing" part. One big thing is the *interpretation* of the output. The crisis is partly about *overconfidence*. Frequentist CIs are often interpreted as Bayesian Credible Intervals. Bayesian posteriors might reduce this specific confusion, but might introduce prior-confusion. Also, the role of *effect sizes* is absent from both.

  Okay, ready to write.cw
answer: |-
  Here is an adjudication of the exchange, evaluated on the logical coherence, technical accuracy, and relevance of each move to the central question (the relation between statistical frameworks and the replication crisis).

  ### Move-by-Move Adjudication

  **(1) Marta: The Crisis is Incentives, Not Framework**
  *   **Rating:** **Clearly Right**
  *   **Justification:** This aligns with the prevailing consensus in metascience. The primary drivers of the replication crisis (publication bias, p-hacking, HARKing) are behaviors driven by incentive structures, not inherent mathematical flaws in null hypothesis significance testing (NHST). Marta is correct that researcher degrees of freedom exist in Bayesian analysis (e.g., "prior hacking" or selecting stopping points for Bayes Factors). If the incentive is to publish a "decisive" result, the threshold (whether $p < .05$ or $BF > 10$) becomes the target, and the garden of forking paths remains.

  **(2) Jonas: Optional Stopping is a Framework-Specific Vulnerability**
  *   **Rating:** **Mostly Right**
  *   **Justification:** Jonas is technically correct regarding the Likelihood Principle: Bayesian inference is mathematically immune to optional stopping rules, whereas frequentist Type I error rates inflate if stopping rules are ignored. However, his claim that switching frameworks would "eliminate" this vulnerability *even if nothing else changed* is slightly overstated. While the *math* handles peeking gracefully, the *practice* of peeking until a Bayes Factor crosses a threshold still constitutes a form of data-dependent decision-making that can inflate false discovery rates in a population of studies, even if the individual posterior is coherent. He identifies a real technical difference but overstates its practical insulation from the crisis.

  **(3) Marta: Error Control and Calibration are the Goal of Science**
  *   **Rating:** **Clearly Right**
  *   **Justification:** This is the strongest philosophical counterpoint. The "replication crisis" is defined by a failure of long-run reproducibility (a frequentist property). A method can be internally coherent (Bayesian) but externally miscalibrated (failing to replicate at the predicted rate). Marta correctly identifies that Jonas is evaluating the utility of a framework using a frequentist criterion (will it replicate?) while advocating for a framework that explicitly disavows frequentist guarantees. Her observation that modern Bayesian methods are increasingly evaluated on frequentist calibration (e.g., coverage probabilities) underscores that coherence alone is insufficient for scientific reliability.

  **(4) Jonas: Scope Defense and the Preregistration Concession**
  *   **Rating:** **Partially Right**
  *   **Justification:** Jonas successfully defends the scope of his claim: he did not argue Bayes solves the whole crisis, only that it solves the specific problem of optional stopping. However, his point on preregistration inadvertently undermines his own position. By admitting that preregistration (a behavioral constraint) is the "flagship reform," he concedes that the mathematical framework cannot save science from itself. This validates Marta's Move 1 (incentives/practice dominate) more than it supports his Move 2 (framework matters). He wins the technical point but loses the strategic ground.

  ### Argumentative Alignment

  There are no egregious "straw man" fallacies here, but there is a significant instance of **talking past one another regarding the unit of analysis.**

  *   **Jonas** argues from the perspective of the **individual researcher's evidential summary**. For the single scientist analyzing a dataset, the Bayesian posterior is indeed immune to stopping rules.
  *   **Marta** argues from the perspective of the **scientific community's long-run reliability**. For the field, the frequency of false claims matters more than the coherence of any single analyst's belief.

  When Marta accuses Jonas of judging frequentist machinery by a frequentist standard, she is highlighting this mismatch. Jonas denies this is a shift in target, but it is: he is arguing about *evidential meaning*, while she is arguing about *decision reliability*. Neither is arguing against a claim the other *explicitly* made, but Marta correctly identifies that Jonas's solution (better individual evidence) does not necessarily solve the problem she cares about (collective error rates).

  ### Substantive Points Both Missed

  While both postdocs displayed high technical literacy, three substantive areas were absent from the exchange:

  1.  **The Threshold Problem:** Both treat the statistical output as continuous, but in practice, both $p$-values and Bayes Factors are dichotomized by journals and researchers ($p < .05$ or $BF > 3$). The replication crisis is fueled by these bright lines. Unless the incentive to cross a threshold is removed, switching frameworks merely shifts the hacking from the sampling plan to the prior specification or the stopping time.
  2.  **Estimation vs. Testing:** The debate focuses entirely on hypothesis testing frameworks (NHST vs. Bayes Factors). A major proposal for mitigating the replication crisis is to abandon binary testing altogether in favor of estimation (confidence intervals or credible intervals) and meta-analysis. Neither Marta nor Jonas considered whether the testing paradigm itself, rather than the frequency/Bayes distinction, is the culprit.
  3.  **Small-Sample Pathologies:** The replication crisis is worst in small-sample fields (e.g., social psychology, neuroscience). In small samples, Bayesian results are highly sensitive to prior specification. Jonas did not address how "default priors" might interact with small samples to produce misleadingly strong Bayes Factors, which could constitute a "Bayesian replication crisis" distinct from the frequentist one.

  ### Overall Verdict

  **Marta came out ahead.**

  Jonas won the specific technical skirmish regarding optional stopping (Move 2); it is a mathematical fact that Bayesian updating does not require correction for stopping intentions. However, Marta won the strategic war regarding the **replication crisis**.

  She successfully demonstrated that:
  1.  The crisis is defined by long-run failure (a frequentist metric), making frequentist error control relevant to the solution.
  2.  Behavioral incentives (Move 1) swamp theoretical advantages (Move 2).
  3.  Jonas's own appeal to preregistration (Move 4) confirmed that behavioral constraints, not statistical frameworks, are the primary lever for reform.

  Jonas proved that Bayesian statistics handles *peeking* better. Marta proved that *peeking* is only one symptom of a disease caused by incentives, and that curing that one symptom does not cure the disease. Since the prompt asks about the relation to the **replication crisis** (a collective, long-run phenomenon) rather than **statistical coherence** (an individual, mathematical property), Marta's framing is more pertinent to the question at hand.
