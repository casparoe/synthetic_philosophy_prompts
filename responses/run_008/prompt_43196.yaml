answer: |-
  **PREP SHEET: VIRTUE AS EXPERTISE**
  **Audience:** Psychologists (empirical skeptics) + Philosophers (conceptual skeptics).
  **Goal:** Defend "Virtue = Expertise" against Situationist critique.

  **1. The Unfalsiability Trap (Highest Damage)**
  *   **Objection:** "Labeling failures as 'novice errors' makes your theory immune to disconfirmation. It's a Just-So story."
  *   **Reply:** It's not ad hoc if it predicts intervention. Chess training improves play; moral education should improve behavioral consistency. That's testable via longitudinal intervention studies, not one-off primes.
  *   **Soft Spot:** Moral interventions are notoriously hard to measure reliably compared to chess drills.

  **2. The 'Where Are the Masters?' (Hope Nobody Asks)**
  *   **Objection:** "If virtue is expertise, where are the grandmasters? Chess has rankings; morality has culture wars. You can't identify the experts."
  *   **Reply:** We identify them retrospectively (King, Gandhi), but mastery is rare. Most are intermediates. Lack of consensus doesn't negate expertise, just scarcity.
  *   **Soft Spot:** Moral heroes are contested; chess champions aren't. If you can't operationalize the masters, the expertise claim is hollow.

  **3. The Consistency Data (High Damage)**
  *   **Objection:** "Mischel and Hartshorne show cross-situational consistency is low (.20-.30). Expertise doesn't fix base rates."
  *   **Reply:** Single trials measure noise. Expertise emerges in aggregated behavior over time. We're comparing novices in high-stress novelty, not trained agents in familiar contexts.
  *   **Soft Spot:** Requires longitudinal data we currently lack.

  **4. The Philosophical Strawman (Medium-High)**
  *   **Objection:** "Aristotle never claimed global traits. Situationists attacked a caricature; you're defending a ghost."
  *   **Reply:** Even if globalism is a strawman, the empirical challenge stands against *any* robust trait. I'm offering a model that survives the data, regardless of exegesis.
  *   **Soft Spot:** Concedes the historical/philosophical high ground to save the psychological one.

  **5. Skill vs. Will (Medium)**
  *   **Objection:** "Virtue requires moral motivation. Sociopaths have social expertise but no virtue."
  *   **Reply:** Virtue ethics ties skill to *eudaimonia*. Instrumental skill isn't virtue. We're talking about mastery of the good, not manipulation.
  *   **Soft Spot:** Hard to empirically distinguish intent from outcome in experiments.

  **6. Domain Specificity (Lowest Damage)**
  *   **Objection:** "Chess has fixed rules. Morality is culturally relative and context-bound."
  *   **Reply:** Practical wisdom (*phronesis*) is precisely context-sensitivity. Experts read the board; virtuous agents read the room. The analogy holds on adaptability.
  *   **Soft Spot:** "Reading the room" is harder to operationalize than board state.
