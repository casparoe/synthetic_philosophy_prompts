      *   **The Conflict:** The user's intuition (physiological function = current causal contribution) vs. the philosophy reading group's view (function = evolutionary history/selected effect).
      *   **The Specific Task:** Audit the "artifact analogy" (heart : carburetor) used by the selected-effect theorists. Map the terms (designer, intention, blueprint, malfunction, repurposing). Identify where it breaks (exaptation, vestigiality, lack of intention). Evaluate the "freak mutation" counter-example (new structure, works perfectly, no history = no function?). Determine if the physiologist's usage tracks something distinct. Suggest a better analogy if needed.
      *   **Tone:** Respectful, intellectually rigorous, acknowledging the user's expertise while clarifying the philosophical distinctions. Avoid condescension.

