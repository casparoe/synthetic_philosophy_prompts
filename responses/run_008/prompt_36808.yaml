      *   *Physiologist Verdict:* It has a function (pumping).
      *   *Is this a reductio?* Philosophers say no. They distinguish between *having a function* and *being functional*. The structure is functional (it works), but it doesn't have a proper function (teleological status) until selected.
      *   *User's Intuition:* The physiologist is tracking "Causal Role" (Cummins functions), not "Selected Effect" (Millikan/Neander functions). Both are valid, just different questions.

