      *   *Core Claim:* $X$ has function $F$ if and only if $X$ exists because ancestors of $X$ performed $F$ and were selected for it.
      *   *Mapping:*
          *   Organism $\rightarrow$ Artifact (e.g., Carburetor).
          *   Organ Part $\rightarrow$ Artifact Part (e.g., Heart $\rightarrow$ Valve).
          *   Natural Selection $\rightarrow$ Designer/Engineer.
          *   Survival/Reproduction $\rightarrow$ Intended Purpose.
          *   Mutation/Variation $\rightarrow$ Manufacturing Variation/Design Tweak.
          *   Malfunction $\rightarrow$ Failure to perform selected effect (not just failure to work).
      *   *Where it breaks:*
          *   **Intention:** Designers have minds; Selection is blind. This is the biggest friction point.
          *   **Blueprint:** DNA isn't a blueprint in the architectural sense; it's more like a recipe or a set of constraints.
          *   **Repurposing (Exaptation):** A screwdriver used as a paperweight has a *new* causal role, but its *function* (in the artifact sense) remains screwing. In biology, the "paperweight" phase (feathers for warmth) can become the "screwdriver" phase (feathers for flight) via selection. The artifact analogy struggles with *shifting* functions without a new designer.
          *   **Vestigiality:** An appendix might have no function (selected-effect) but still have causal roles (immune tissue?). Artifacts usually get discarded if functionless.

