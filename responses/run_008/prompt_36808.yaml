      *   Need to explicitly validate the user's background. They aren't "wrong"; they are using a different definition.
      *   **Causal Role (CR):** What does it do *now*? (Physiology, Systems Biology).
      *   **Selected Effect (SE):** Why is it *here*? (Evolutionary Biology, Philosophy).
      *   The conflict arises when SE theorists claim *their* definition is the *only* true one. Many modern philosophers accept pluralism.

