          *   *Damage:* High. Attacks the feasibility and the specific normative weight of the "refugee" label.
          *   *Drafting:* "If you expand the category too much, you destroy the special urgency..."

      *   *Objection 2 (The NGO Practitioner):* They care about practical outcomes for clients *now*.
          *   *Thought:* Theoretical redefinitions don't help current asylum seekers. In fact, trying to rewrite the 1951 Convention might weaken existing protections. It's dangerous to tinker with the only legal tool that works.
          *   *Damage:* Very High. Practical/Real-world impact trumps theory in this context. "While you theorize, my clients drown."
          *   *Drafting:* "My clients need protection under existing law, not a new philosophical category..."

      *   *Objection 3 (The Utilitarian):* They think borders are arbitrary.
          *   *Thought:* Why stop at "protective membership"? Why not open borders? If membership is broken, why does the *specific* state matter? Or conversely, if the goal is utility, does this distinction actually maximize welfare?
          *   *Damage:* Medium-High. Attacks the foundational statist assumption.
