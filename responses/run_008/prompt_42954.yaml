prompt: |-
  next month i'm presenting my thesis chapter at a migration ethics workshop and i want to get ahead of the Q&A. the chapter's claim: we should stop defining the refugee around persecution and key the status to what i call "abrupt loss of protective membership" — what makes you a refugee isn't that your government is out to get you, it's that the practical relationship that made some state answerable for you has broken down, whether through persecution, state collapse, or your region becoming effectively uninhabitable from climate change. so on my view a bangladeshi farmer whose delta is going under isn't a "mere migrant," he's a refugee, and the convention framework got the category wrong at the root.

  audience: mostly political philosophers who are big on associative duties and compatriot priority (Miller-style), two hardcore utilitarians who think nation-state membership is morally arbitrary from the start, and one person from an asylum-seeker support NGO who gets impatient whenever philosophers redraw categories while her clients are stuck waiting in line.

  draft my prep sheet as JSON with these fields: "objections" — an array ordered by how much damage each would do, where each item is an object with "who" (which audience type is asking), "objection" (phrased the way that person would actually put it), "reply" (two minutes max), and "soft_spot" (where my reply is weakest); then "concede_up_front" (what i should give away before anyone even asks), "hold_at_all_costs" (the one thing i cant let go of), and "pray_not_asked" (the question i'm hoping nobody thinks to ask).
