      *   `hold_at_all_costs`: The core moral intuition. "Protective membership" is the right *moral* standard, even if the *legal* label needs work. The link between state legitimacy and protection.
      *   `pray_not_asked`: The "Who pays?" or "How many?" question. Specifically, the threshold question. When does slow onset become "abrupt"? Or, which specific state owes duty to the Bangladeshi farmer? (The "Assignment Problem"). Let's go with the Assignment Problem (Which state takes them?) because the prompt focuses on *status*, but the inevitable follow-up is *allocation*.

  5.  **Constructing the JSON:**
