      *(Self-Correction on JSON syntax)*: I need to make sure I don't include markdown code blocks *inside* the JSON strings that would break parsing if this were machine-read, but since I am outputting text, I will wrap the whole thing in a code block. I will ensure internal quotes are escaped.

      *(Refining the "Damage" Order)*:
      1. NGO (Practical feasibility/Legal realism) - "You're breaking the tool while we use it."
      2. Miller (Associative Duties) - "You're diluting the special obligation."
      3. Utilitarian (Statist Assumption) - "Why care about states at all?"

      *(Refining `pray_not_asked`)*: The question "If the home state fails, why is *my* state the one obligated to take them rather than a neighboring state?" This hits the "protective membership" transfer logic hard.

