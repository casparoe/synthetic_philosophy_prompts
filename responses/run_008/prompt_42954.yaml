      *   *Ordering by Damage:*
          1.  NGO (Practical harm/feasibility) - Most damaging because it questions the *point* of the theory in the real world.
          2.  Miller-style (Normative dilution) - Damaging because it challenges the core ethical mechanism.
          3.  Utilitarian (Foundational critique) - Damaging, but easier to sidestep as "non-ideal theory."

      *   *Refining Replies & Soft Spots:*
