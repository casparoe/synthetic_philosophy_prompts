      *   *Normative Force:* If you lose protective membership, you are owed refuge, not just migration management.

  3.  **Drafting Objections (Iterative Process):**

      *   *Objection 1 (The Miller-style Philosopher):* They care about special duties to compatriots and the integrity of political communities.
