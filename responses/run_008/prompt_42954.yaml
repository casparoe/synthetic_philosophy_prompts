  2.  **Deconstruct the Core Claim:**
      *   *Current Definition:* 1951 Convention (Persecution based on race, religion, nationality, membership of a particular social group, or political opinion).
      *   *Proposed Definition:* "Abrupt loss of protective membership" (State fails to protect due to persecution, collapse, or environmental uninhabitability).
