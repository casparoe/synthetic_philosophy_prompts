      *   *Correction:* Make sure the NGO objection is ranked highest. In ethics workshops, the "real world harm" objection often silences theoretical nuance.
      *   *Correction:* Ensure the Utilitarian objection isn't just "open borders" but specifically about the moral arbitrariness of the state membership concept itself.
