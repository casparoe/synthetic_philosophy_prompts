  ### The Discriminating Case

  To definitively prove whether she follows Rule A (Sovereignty) or Rule B (Metabolism), propose the following case:

  **The Case of the "Bureaucratic Puppet"**
  > A wealthy, stable kingdom is invaded by a neighbor. The invader deposes the King and annexes the territory, but—finding the existing tax and legal systems efficient—keeps the entire native bureaucracy intact. The laws, language, currency, and living standards remain exactly the same; only the ultimate sovereign authority (the Emperor) changes to a foreigner.

  *   **Rule A (Sovereign Continuity) predicts:** **Collapse.** (The original political entity lost its autonomy and sovereignty).
  *   **Rule B (Endogenous Metabolism) predicts:** **Not a Collapse.** (Societal capacity, complexity, and population remain steady; the change was exogenous/conquest, not systemic failure).

  If she calls this a collapse, she cares about the Flag (Rule A). If she calls it continuity, she cares about the Function (Rule B). Given her track record, I expect she will call it a **collapse**, confirming that for her, history is written by the survival of states, not the resilience of societies.
