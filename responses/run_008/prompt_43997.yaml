  ***

  ### Two Competing Rules

  Both rules explain her past six judgments perfectly but yield opposite predictions for the three new cases.

  **Rule A: The "Sovereign Continuity" Heuristic**
  *   **Definition:** A "collapse" occurs only when the central political authority loses sovereignty, dissolves, or is replaced by a foreign power. If the state bureaucracy, legal framework, or ruling dynasty persists—even in reduced form or with altered ideology—it is merely transformation.
  *   **Fit with Past:**
      *   *Collapse:* Rome (Western Empire ceased), Maya (City-states abandoned/failed), 1200 BC (Palace systems destroyed).
      *   *Not Collapse:* Black Death (Monarchies survived), Weavers (State survived), Meiji (Imperial state strengthened).
  *   **Prediction on New Cases:** **Not Collapse** for all three (Society endured, Kingdom survived, Institutions hold).

  **Rule B: The "Endogenous Metabolism" Heuristic**
  *   **Definition:** A "collapse" occurs when a society suffers a permanent, significant reduction in its energy capture, population scale, or infrastructural complexity driven by internal systemic failure. Exogenous shocks (plagues, foreign tech) or deliberate reforms do not count; the contraction must be a symptom of the system's inability to sustain its previous footprint.
  *   **Fit with Past:**
      *   *Collapse:* Rome (Infrastructure/Pop declined endogenously), Maya (Agricultural/Urban system failed), 1200 BC (Trade/Production networks shattered).
      *   *Not Collapse:* Black Death (Exogenous pathogen, infrastructure recovered), Weavers (Exogenous tech shift, capacity increased), Meiji (Deliberate reform, capacity increased).
  *   **Prediction on New Cases:** **Collapse** for all three (Easter: Endogenous resource depletion; Angkor: Endogenous hydraulic failure; Hypothetical: Endogenous demographic contraction).

  ***

  ### The Actual Rule and Why

  Your friend is almost certainly running **Rule A (Sovereign Continuity)**.

  **The Evidence:**
  The smoking gun is her specific phrasing regarding the Black Death: *"not a collapse, whatever the death toll."* This clause explicitly decouples demographic metrics from the definition of collapse. If she were using Rule B (Endogenous Metabolism), the sheer scale of population loss in the Black Death would require a nuanced exception regarding "exogenous" causes. Instead, she dismisses the toll entirely to focus on the outcome.

  Furthermore, her classification of the Meiji Restoration supports Rule A. The dismantling of the samurai was a massive reduction in the "complexity" of the warrior class and a radical shift in societal structure. Under Rule B, this might look like a collapse of the old order's "metabolism." But she classifies it as *not* a collapse because the Japanese state not only survived but centralized power. She prioritizes the survival of the *polity* over the fate of specific classes, monuments, or population counts.

