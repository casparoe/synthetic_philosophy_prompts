  \ *   Exclusion argument coherence? Yes.\n    *   Reconstruct implicit theory? Yes.\n\
  \    *   Strictly require mental states qua mental? Analyzed via interventionism.\n\
  \    *   Underdetermined vs. committed? Yes.\n    *   What would change in practice?\
