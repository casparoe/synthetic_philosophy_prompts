  \n6.  **Final Structure:**\n    1.  **The Clinical Metaphysic:** Non-Reductive Physicalism\
  \ + Causal Pluralism.\n    2.  **The Exclusion Threat:** Why additivity looks like\
  \ overdetermination.\n    3.  **The Interventionist Rescue:** Variable relativity\
