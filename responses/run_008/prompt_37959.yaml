  \        *   *Underdetermined:* The *efficacy* of treatment doesn't depend on the\
  \ metaphysics. A pill works regardless of whether you believe in dualism.\n    \
  \    *   *Hard Commitments:* The *explanation* and *protocol design* do depend on\
  \ it.\n        *   CBT protocols assume *content* matters. \"Catastrophizing\" vs.\
