answer: |-
  You have intuited something very close to the core of modern source criticism, specifically the distinction developed by historians like Marc Bloch and R.G. Collingwood between **intentional testimony** (what the author meant to tell you) and **unintentional testimony** (what the author revealed without meaning to).

  However, your list contains two significant contradictions that prevent a single, clean principle from covering all nine verdicts. To make your methodology coherent, you will have to sacrifice two of your intuitions.

  Here is the principle that best fits your working method, followed by the necessary corrections.

  ### The Principle: The Hierarchy of Incentive

  **Statement:** *Credibility is inversely proportional to the author's rhetorical incentive to shape the information, unless material evidence provides an independent anchor.*

  **The Hierarchy:**
  1.  **Material Traces:** (Highest Credibility) Data not generated by human communication (tree rings, strata, mass graves).
  2.  **Incidental Textual Data:** (High Credibility) Information recorded for administrative or practical purposes where the fact itself was not meant to persuade (accounts, logs, passing mentions).
  3.  **Intentional Narrative:** (Low Credibility) Information shaped for political, literary, or foundational purposes (speeches, origin myths, triumphal inscriptions).

  **Why this fits your verdicts:**
  *   **Clause 1 (Rhetorical Incentive):** Covers **#1** (Founding myths are designed to legitimize), **#4** (Late chroniclers design drama), **#5** (Speeches are literary devices), and **#2** (Victors inflate, defeated neighbors have less incentive to glorify).
  *   **Clause 2 (Incidental Utility):** Covers **#3** (Accounts are for money, not history) and **#5** (The decision is the outcome, the speech is the decoration).
  *   **Clause 3 (Material Anchor):** Covers **#7** (Propaganda text is low, physical grave is high) and **#8** (Science is material, annals are textual).

  ---

  ### The Verdicts You Must Overturn

  To maintain this principle, you must revise two of your intuitions. Currently, they violate the logic you are applying elsewhere.

  #### 1. Overturn Verdict #6 (Casualty Figures on Monuments)
  **Your Intuition:** You believe casualty figures carved on a public monument more than the surrounding narrative.
  **The Problem:** This is the most common trap in undergraduate source criticism. A triumphal monument is *purely* rhetorical. Its sole existence is to persuade the viewer of the ruler's power and the enemy's destruction.
  **Why it violates the Principle:** Under the *Hierarchy of Incentive*, a triumphal inscription is the peak of **Intentional Narrative**. Ancient casualty numbers were often symbolic (e.g., multiples of 10,000) or theological, not demographic.
  **The Correction:** You must treat monument figures with the same skepticism as the narrative surrounding them. Believe the *fact* of the battle (supported by the monument's existence), but treat the *numbers* as propaganda unless corroborated by incidental records (like #3) or material evidence (like mass graves).
  **Motivation:** This aligns #6 with #2 (Victor's inscription) and #1 (Dynastic myth). If you reject the victor's narrative, you must reject the victor's statistics.

  #### 2. Overturn Verdict #9 (The Halo Effect)
  **Your Intuition:** If archaeology corroborates an incidental detail of a myth (earthquake), you feel a pull to believe the spectacular claim (dynastic founder).
  **The Problem:** This is a logical fallacy known as the *narrative coherence bias*. Just because the *setting* of a story is real does not mean the *plot* is real.
  **Why it violates the Principle:** The *Hierarchy of Incentive* dictates that the "Exposed Infant" trope is **Intentional Narrative** (mythic archetypes designed to signal destiny). The earthquake is a **Material Trace**. The material trace validates the *context* (a city was destroyed), but it cannot validate the *intent* (a god saved the baby to found a line).
  **The Correction:** You must resist the pull. Corroboration of the background raises the probability that the *source* had access to local knowledge, but it does not raise the probability that the *mythic motif* is historical. Keep #1 (Reject the infant story) even if #9 (The earthquake) is true.
  **Motivation:** This protects you from the "Sherlock Holmes" fallacy. One true premise does not make a fictional deduction true.

  ---

  ### The Double Standard (Verdict #7)

  **Your Worry:** You dismiss enemy atrocity stories as propaganda, but believe them if a burial ground is found. You feel this is a reversal.
  **My Verdict:** **This is not a double standard; it is a correct application of the Hierarchy.**

  In the first instance, you are weighing **Text vs. Text** (Enemy Chronicle vs. Self-Defense). Here, incentive to deceive is high on both sides, so you default to skepticism.
  In the second instance, you are weighing **Text vs. Matter** (Enemy Chronicle vs. Forensic Evidence). Matter has no incentive to deceive.
  **Why it feels like a reversal:** It feels like you are "trusting the enemy" after all. But you are not trusting the *enemy's text*; you are trusting the *bones*. The text merely pointed you to the bones.
  **Refinement:** To be perfectly rigorous, ensure the material evidence *directly* supports the specific accusation (e.g., cut marks on bones consistent with the described ritual) rather than just showing "violence occurred." If the text says "They ate babies" and the dig shows "War casualties," you have not confirmed the atrocity, only the conflict.

  ---

  ### Predictions for New Cases

  If you adopt the **Hierarchy of Incentive**, here is how you must handle the cases you listed at the end:

  **1. Icelandic Sagas (Written centuries later, oral roots)**
  *   **Analysis:** These are **Intentional Narratives**. They were written to establish family prestige and legal rights in the 13th century regarding events in the 9th. They use formulaic structures (feuds, gifts, insults).
  *   **Verdict:** Do not believe the specific dialogue or the causal chain of events (Intentional). Do believe the geography, the genealogies (often memorized for legal reasons), and the social values (Unintended testimony about the 13th-century authors, if not the 9th-century actors).
  *   **Principle:** Treat like #5 (Speeches). Believe the outcome/social structure, not the drama.

  **2. A Forged Charter that may record a genuine grant**
  *   **Analysis:** The document is **Intentional Deception** regarding its date and authority. However, the *boundaries* or *witness names* might be **Incidental Textual Data** copied from an earlier, lost genuine record to make the forgery convincing.
  *   **Verdict:** Reject the legal authority and the date (Intentional). Scrutinize the place-names and boundaries (Incidental). If the boundaries match older land divisions, the forgery preserves a genuine memory even if the document is fake.
  *   **Principle:** Treat like #3 (Accounts). Look for the data that was useful to the forger only because it was already known to be true.

  **3. Oral Tradition transmitted with formulaic aids**
  *   **Analysis:** Formulaic aids (meter, epithets) preserve **Structure**, not **Fact**. They ensure the *story* survives, not the *event*.
  *   **Verdict:** High skepticism on chronology and specific actors. Moderate confidence in "deep memory" (e.g., a migration happened, a climate shift occurred) if the tradition is consistent across independent branches.
  *   **Principle:** Treat like #1 (Myth). The form dictates the content. If it sounds like poetry, it is shaped by the needs of memory, not the accuracy of a logbook.

  ### Summary Advice

  You are thinking like a historian. The discomfort you feel in #7 and #9 is the sensation of your methodology maturing.

  1.  **Drop the monument numbers (#6).** They are lies carved in stone.
  2.  **Break the link in #9.** A true setting does not make a mythic plot true.
  3.  **Keep #7.** It is the only way to integrate archaeology without falling into textual credulity.

  Your guiding star is **Incentive**. Always ask: *Did the person who wrote this benefit from me believing it?* If the answer is yes, look for the information they didn't mean to give you. That is where the history hides.
