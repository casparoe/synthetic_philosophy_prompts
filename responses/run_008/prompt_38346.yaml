          4.  Apply the principle to new cases (Icelandic sagas, forged charters, oral traditions).
          5.  Identify double standards (specifically pointing out #7).
      *   **Tone:** Honest, critical, academic but accessible (undergraduate seminar level).
      *   **Goal:** Help the student refine their historical methodology.

  2.  **Analyze the 9 Intuitions:**
