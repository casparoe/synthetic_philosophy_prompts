      3.  *Monastery Accounts (Pilgrims/Bridge):* Believe (Incidental/Unintended Testimony).
      4.  *Late Chronicler on Court Intrigue:* Reject (Distance/No Corroboration/Genre).
      5.  *Verbatim Speech:* Reject Words, Believe Decision (Genre Convention vs. Outcome).
      6.  *Casualty Figures on Monument:* Believe Figures over Narrative (Specific Data vs. Story). *Note: This is tricky. Monuments often exaggerate.*
      7.  *Enemy Atrocity Stories:* Dismiss as Propaganda *unless* Archaeology confirms (Material Evidence trumps Textual Bias). *User admits discomfort here.*
      8.  *Fire Date (Annal vs. Science):* Believe Science (Objective Method over Subjective Memory).
      9.  *Exposed Infant + Archaeology:* Feel pull to believe *more* spectacular claims if incidental details match (Halo Effect/Coherence).

  3.  **Search for a Unifying Principle:**
      *   *Candidate 1: "Believe the boring stuff."* Covers #3, maybe #2. Doesn't cover #6 (numbers on monuments can be propagandistic) or #8 (science isn't "boring," it's methodological).
      *   *Candidate 2: "Believe material evidence over text."* Covers #7, #8. Contradicts #3 (manuscript accounts) and #6 (textual numbers over narrative).
      *   *Candidate 3: "Incentive to Deceive."* Covers #2 (Victor lies), #4 (Chronicler embellishes), #7 (Enemies lie). But #1 is about mythic structure, not necessarily deception. #6 is tricky (why believe casualty numbers on a monument? They often lie).
      *   *Candidate 4: "Unintended Testimony" (The Best Candidate).* This is a classic historical principle (Marc Bloch, etc.). Information conveyed *without the intent to persuade* is more reliable than information conveyed *to persuade*.
          *   #1: Intent is myth-making (foundational legend). -> Reject.
          *   #2: Victor intends to glorify; Defeated intends to record (or less incentive to inflate). -> Believe Defeated.
          *   #3: Accounts are for money/admin, not history. Pilgrim count is incidental. -> Believe.
          *   #4: Chronicler intends to write a good story/drama. -> Reject.
          *   #5: Historian intends to show rhetoric (set pieces). Decision is the outcome. -> Believe Decision.
          *   #6: *Problematic.* Monuments *are* intended to persuade. Why does the user believe the numbers? Maybe because they are specific data points vs. narrative flair? Or maybe this is a weak point in their intuition.
          *   #7: Enemy intends to demonize. -> Reject. *Unless* archaeology (unintended physical trace) confirms. -> Accept.
          *   #8: Annal intends to record (but human error); Science is methodological (unintended natural record). -> Believe Science.
          *   #9: *Problematic.* If the myth is intentional, why does a matching earthquake make the *dynasty* claim true? This is the "Halo Effect."

      *   *Refining the Principle:* **"Credibility is inversely proportional to the author's rhetorical intent, unless material evidence intervenes."** Or, **"Prioritize unintended testimony and material traces over intentional narrative."**

  4.  **Testing the Principle & Identifying Conflicts:**
      *   *The Strongest Conflict:* #6 (Casualty Figures). Monuments are *pure* rhetoric. Believing casualty numbers on a triumphal monument over a narrative is historically naive (e.g., Res Gestae, Assyrian reliefs). The user needs to give this up.
      *   *The Second Conflict:* #9 (The Halo Effect). If #1 says "Reject Exposed Infant" because it's a motif (rhetorical/mythic intent), then finding an earthquake (material truth) shouldn't validate the *dynastic* claim (rhetorical intent). The principle demands consistency. If the genre is myth, material corroboration of setting doesn't validate the plot.
      *   *The Double Standard:* #7. The user admits this. The principle resolves it: Textual accusation = Low Credibility (Intent to demonize). Physical evidence = High Credibility (Unintended trace). The reversal is justified *if* based on the shift from text to matter, not just "new text."

  5.  **Drafting the Principle:**
      *   Let's call it **The Principle of Unintended Testimony (modified by Material Anchor).**
      *   *Core:* Trust information conveyed without the intent to persuade or shape a narrative.
      *   *Modifier:* Trust material evidence (archaeology, science) over textual memory, as matter does not lie (though it can be misinterpreted).
      *   *Caveat:* Do not let material corroboration of *context* validate *mythic content* (addressing #9).

  6.  **Addressing the New Cases:**
      *   *Icelandic Sagas:* Written late, oral roots. High rhetorical intent (family prestige). -> Skepticism on specifics, belief on social structures/outcomes (similar to #5).
      *   *Forged Charter:* Intent is deception. BUT, does it contain unintended info (land boundaries, witness names)? -> Believe the incidental details, reject the legal authority (similar to #3 vs #4).
      *   *Oral Tradition:* Formulaic aids preserve *structure*, not *fact*. -> Believe the values/concerns of the society, not the events (similar to #1).

  7.  **Addressing the Double Standard (#7):**
      *   Is it a double standard? No, it's a hierarchy of evidence. Textual accusation = hearsay. Physical mass grave = forensic evidence. The reversal is methodologically sound, provided the link is direct.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the intuitions.
      *   **The Principle:** Formulate it clearly (The Principle of Incidental Utility vs. Rhetorical Intent).
      *   **Mapping the 9 Points:** Show how the principle fits most, but highlights errors in #6 and #9.
      *   **The Verdicts to Overturn:** Specifically target #6 (Monument numbers) and #9 (Halo effect).
      *   **The Double Standard:** Defend #7 as consistent under the principle.
      *   **New Cases:** Apply the principle to Sagas, Charters, Oral Tradition.
      *   **Conclusion:** Encouraging closing thought on historical humility.

  9.  **Refining the Critique (Self-Correction during drafting):**
      *   *Wait, look at #6 again.* "Casualty figures carved on a public monument: I believe the figures more than the narrative..." This is actually a very common *mistake* students make. They think "Numbers look hard, words look soft." But ancient numbers are often symbolic (e.g., 10,000, 120). I need to be firm here. This is the easiest verdict to force them to give up.
      *   *Look at #9.* This is the "Sherlock Holmes" fallacy. One true detail doesn't make the whole story true. I need to explain *why* this leaks. It's the "Narrative Coherence" bias.
      *   *Look at #2.* "Believe the neighbor's version." Is this always true? Sometimes the neighbor is also biased. But generally, the *victor* has more incentive to inflate. The principle holds: Lower incentive to lie = higher credibility.
      *   *Look at #8.* Science vs. Annal. Science is "unintended" nature. Annal is "intended" record. Fits perfectly.

  10. **Final Polish:** Ensure the tone is respectful but rigorous. Use terms like *a posteriori*, *teleological*, *incidental testimony*. Make sure the "Principle" sounds like something a historian would actually write down.

      *Proposed Principle Name:* **The Principle of Incidental Utility.** (Information recorded for purposes other than persuasion or narrative cohesion is more reliable than information recorded for those purposes.)

      *Wait, one nuance:* #7 involves material evidence overriding textual bias. So the principle needs a hierarchy: Material > Incidental Text > Intentional Text.

      *Let's synthesize:* **The Hierarchy of Incentive.**
      1. Material Traces (No human intent to deceive).
      2. Incidental Textual Data (No intent to persuade regarding *this* fact).
      3. Intentional Narrative (High intent to persuade/shape).

      *Check against #6:* Monument numbers are Intentional Narrative (Propaganda). User believes them. -> **Must Overturn.**
