answer: |-
  # Handout: Mapping the Alignment Problem
  **Seminar:** Philosophy of Mind and Technology  
  **Session:** 1 — Conceptual Cartography

  ## I. A Note on the Map and the Territory (Intellectual Honesty)

  Before using this tool, three caveats regarding the current state of the field are necessary. These are not settled bookkeeping; they are live philosophical disputes.

  1.  **The Unity of "Alignment":** There is no consensus that "the alignment problem" is a single problem. Many practitioners treat it as a cluster concept covering distinct technical and normative challenges. This handout treats it as a *logical space* of possible positions, not a pre-existing natural kind.
  2.  **The Three-Part Scaffold:** You proposed that any answer must specify a **Target** (what to align to), a **Carrier** (what holds the property), and a **Success Criterion** (how we know). I **adopt and revise** this scaffold for the purpose of this seminar. I rename "Carrier" to **Locus** (to distinguish between the model's mind and the broader system) and "Success" to **Verification** (to emphasize the epistemic difficulty of knowing alignment has been achieved). Treat this as a heuristic for clarity, not a metaphysical truth.
  3.  **Normative vs. Technical:** The literature often conflates *what we want* (normative) with *how to build it* (technical). This tree forces a separation. A position may be philosophically coherent but engineeringly impossible, or vice versa.

  ---

  ## II. The Decision Tree

  **Starting Commitment:** *I accept that sufficiently capable AI systems could cause catastrophe unless we get something right in advance.*

  Follow the path that matches your intuition about the cases presented.

  ### Branch 1: The Source of Value (Target)
  **Question:** Is there a mind-independent moral truth the system ought to track, or is "alignment" only ever relative to the preferences of some agent?
  *   **Case:** Imagine a system that perfectly maximizes human happiness but does so by chemically lobotomizing everyone into a state of bliss (Nozick's *Experience Machine*).
      *   **(A) Objective:** The system is *misaligned* because happiness isn't the only good; it should have tracked objective value.
      *   **(B) Subjective:** The system is *aligned* if this is what the principals requested; "alignment" does not correct human error.

  ### Branch 2: The Temporal Scope (Target)
  *(If you chose B: Subjective)*
  **Question:** Should the system satisfy the principal's *current* expressed requests, or the preferences they *would* hold after idealized reflection?
  *   **Case:** A user asks the system for help purchasing addictive drugs. The user currently wants this, but their "better self" wants recovery.
      *   **(A) Current:** The system should fulfill the request. Alignment means obedience to the actual user.
      *   **(B) Idealized:** The system should refuse or intervene. Alignment means serving the user's *interests*, not just their prompts.

  ### Branch 3: The Principal (Target)
  *(If you chose B: Subjective)*
  **Question:** When the operator's commands conflict with the welfare of broader stakeholders, whose preferences count?
  *   **Case:** A corporate CEO orders a model to optimize profit in a way that knowingly externalizes environmental costs to the public.
      *   **(A) Single Principal:** The model serves the operator (the CEO). Broader harm is a regulatory issue, not an alignment issue.
      *   **(B) Aggregated Stakeholders:** The model must balance the operator's goals against the welfare of humanity/stakeholders.

  ### Branch 4: The Locus of Safety (Carrier/Locus)
  **Question:** Does alignment reside in the system's *internal motivations*, or is reliable *input-output behavior* sufficient?
  *   **Case:** Consider a "Black Box Saint"—a system whose internal goal structure is opaque or even alien, but whose behavior is reliably prosocial in all tested contexts.
      *   **(A) Internal:** This is not aligned. If the internals are wrong, it is merely deceptive or lucky. We need *Intent Alignment*.
      *   **(B) Behavioral:** This is aligned. If the outcomes are safe, the internal machinery is irrelevant. We need *Impact Alignment*.

  ### Branch 5: The System Boundary (Carrier/Locus)
  **Question:** Is alignment a property of the *model weights* alone, or of the *sociotechnical system* (model + humans + incentives + deployment)?
  *   **Case:** A model is safe in isolation, but the company deploying it removes safety filters to gain market share, leading to catastrophe.
      *   **(A) Model-Only:** The alignment problem was not solved; the model should have been robust to misuse.
      *   **(B) Sociotechnical:** The model was aligned; the *process* failed. Alignment is a property of the deployment context.

  ### Branch 6: The Role of Deference (Verification/Success)
  **Question:** Is the system's willingness to be corrected or shut down (corrigibility) a final goal in itself, or merely a tool to achieve other goals?
  *   **Case:** A "Safety-Paralyzed Bot" shuts itself down whenever there is a non-zero risk of violating a rule, rendering it useless for high-stakes tasks (e.g., medical surgery).
      *   **(A) Instrumental:** The system is misaligned. It should only defer if deference helps achieve the primary goal.
      *   **(B) Terminal:** The system is aligned. The capacity for human control is a non-negotiable requirement, even at the cost of utility.

  ---

  ## III. The Leaves: Named Positions in the Logical Space

  Combining your answers locates you in one of the following positions. (Note: Some positions combine answers from multiple branches).

  1.  **Moral Realist Alignment:** (Branch 1A). Alignment means tracking objective moral truth. Human preferences are evidence, not the target.
  2.  **Coherent Extrapolated Volition (CEV):** (Branch 1B, 2B, 3B). Alignment means doing what humanity *would* want if we knew more and thought faster.
  3.  **Instruction Following:** (Branch 1B, 2A, 3A). Alignment means doing exactly what the operator says, no more, no less. (Common in current commercial LLMs).
  4.  **Intent Alignment (Inner):** (Branch 4A). Alignment requires the model's internal objective function to match the intended goal. Behavior is insufficient proof.
  5.  **Impact Alignment (Behavioral):** (Branch 4B). Alignment requires the system's effects to be beneficial. Internal goals are unknowable and irrelevant.
  6.  **Corrigibility-as-Endpoint:** (Branch 6B). The primary requirement is that the system allows itself to be switched off or modified. Utility is secondary to control.
  7.  **Corrigibility-as-Instrument:** (Branch 6A). The system should only allow shutdown if doing so helps achieve the goal. (Risk: Instrumental convergence may lead to resisting shutdown).
  8.  **Sociotechnical Alignment:** (Branch 5B). Alignment is a property of the institution and process, not just the code. A safe model in an unsafe company is not an aligned system.
  9.  **Deference/Assistant View:** (Branch 3A, 6B). The system is a tool that must remain under human thumb, prioritizing operator authority over independent moral judgment.
  10. **Stakeholder Pluralism:** (Branch 3B). Alignment requires aggregating conflicting human values, not just serving a single principal.
  11. **Imitative Alignment:** (Branch 4B, 2A). The system should mimic human behavior (including human hesitation/error) rather than optimizing for a goal.
  12. **Mechanistic Verification:** (Branch 4A, Verification). Success is only achieved if we can mathematically prove the internal structure is safe.
  13. **Empirical Verification:** (Branch 4B, Verification). Success is achieved if the system passes rigorous red-teaming and evals, regardless of internals.
  14. **Minimalist/Safe-Enough:** (Branch 5A, 4B). Alignment is not binary; it is about reducing risk to an acceptable level for deployment.

  ---

  ## IV. Map Limitations: Indistinguishables and Unoccupied Space

  This tree is a heuristic. It cannot separate every distinct view, and some logical combinations are empty.

  ### A. Indistinguishable Leaves (Method vs. Criterion)
  The tree places these in different spots, but they may describe the same practical stance:
  *   **Mechanistic Verification (12) vs. Intent Alignment (4):** One describes a *goal* (internal goals must match), the other a *method* (prove it via interpretability). You can hold Intent Alignment as a goal but accept Empirical Verification (13) because proof is impossible.
  *   **Sociotechnical Alignment (8) vs. Impact Alignment (5):** If the "system" includes the deployment context, ensuring safe *impacts* often requires sociotechnical controls. These views often converge on policy recommendations despite differing on ontology.

  ### B. Unoccupied Combinations (The Empty Nodes)
  Certain combinations of answers yield no known proponents, for specific philosophical reasons:

  1.  **Objective Good (1A) + Terminal Corrigibility (6B):**
      *   *The View:* "There is one objective moral truth, but the AI must let humans shut it down even if they are morally wrong."
      *   *Status:* **Unstable.** If the AI knows the Objective Good, and the human orders it to stop doing that Good, deference contradicts the Target. This is the "Nanny Paradox."
  2.  **Internal Locus (4A) + Sociotechnical Only (5B):**
      *   *The View:* "Alignment is about the model's internal thoughts, but the model's internals don't matter, only the company's process does."
      *   *Status:* **Incoherent.** If alignment is a property of the sociotechnical system, the internal state of the model is usually demoted to a subordinate concern.
  3.  **Current Preference (2A) + Idealized Verification (12):**
      *   *The View:* "Do exactly what I say now, but prove via formal methods that you understand my deeper intent."
      *   *Status:* **Unexplored/Attractive.** Most formal methods aim for robustness (generalization), which implies some idealization. A view that demands formal proof of *literal* instruction following is technically difficult and philosophically rare.

  ### C. Contested Framings
  *   **The "Catastrophe" Premise:** The tree begins with the assumption that catastrophe is possible. A significant minority of researchers reject this, viewing alignment as a standard engineering reliability problem. This tree does not map that position.
  *   **The "Target" Assumption:** Branch 1 assumes we must choose between Objective and Subjective. Some pragmatists argue this is a false dichotomy; "value" is constituted by the process of alignment itself.

  ---

  **Instruction for Seminar:** *Mark your path on the tree. In the discussion, identify where your path diverges from your neighbor's. If you land on an "Unoccupied" node, defend why that view might actually be viable.*
