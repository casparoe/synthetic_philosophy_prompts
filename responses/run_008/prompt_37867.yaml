answer: |-
  You have intuitively rediscovered the core problems of Social Choice Theory without needing the math degree. You are wrestling with **Arrow's Impossibility Theorem** and the **Condorcet Paradox**, but framed through the very practical lens of housing co-op harmony.

  Here is the hard truth: **There is no single principle that captures all five verdicts.** Specifically, your verdicts (2) and (4) are logically incompatible.

  Here is the breakdown of why, which principle you should actually adopt, and why Instant-Runoff Voting (IRV) is likely to make you angry.

  ### 1. The Contradiction: Verdict (2) vs. Verdict (4)

  *   **Verdict (2)** asserts the **Majority Criterion**: If a majority (7 out of 13) prefers A over B in a head-to-head, A should win.
  *   **Verdict (4)** accepts **Plurality Rule**: A wins with 5 votes, even though 7 people (the 4 for B + the 3 for C) preferred B over A.

  In your contractor example (4), **B was the Condorcet Winner** (B beats A head-to-head 7-6, and presumably beats C). Yet A won via Plurality.
  *   If you stand by (2), verdict (4) is unjust: a majority was overruled.
  *   If you stand by (4), verdict (2) is merely a special case: majority rule only applies when there are exactly two options.

  **You cannot have both.** You must decide if "one person, one vote" (Plurality) trumps "majority will" (Condorcet) when there are more than two options.

  ### 2. The Underlying Principle: "Transparent Majoritarianism"

  If we look at your gut feelings, you are actually advocating for a principle I'd call **Transparent Majoritarianism**.

  *   **You want Majority Rule (2):** You believe 7/13 constitutes the group's will.
  *   **You want Transparency (4 & 5):** You prefer systems where the counting is simple ("most votes") and where changing an irrelevant ranking doesn't magically flip the winner via "sneaky" math (Borda).
  *   **You accept Cycles (3):** You are pragmatic enough to admit groups aren't always rational and are okay with a tiebreak.

  The problem is that **Plurality Voting (Verdict 4) violates Transparent Majoritarianism.** It allows a minority winner (A with 5 votes) to overrule a majority coalition (B+C with 7 votes) in a way that feels "fair" only because the counting is simple.

  ### 3. Which Verdict Has to Go?

  For a 13-person housing co-op, **you must sacrifice Verdict (4).**

  Here is why: In a nation of millions, we tolerate Plurality because running a runoff is expensive. In a co-op of 13, **enforcing a choice that 7 out of 13 members actively dislike is a recipe for resentment.** If the 7 people who preferred B realize that A won only because the vote was split, they will view the steering committee as illegitimate.

  Your intuition in (2) is the stronger ethical position for a small community: **If a majority can be identified, they should rule.**

  ### 4. The Instant-Runoff (IRV) Warning

  You mentioned the persistent committee member pushing for Instant-Runoff Voting (ranked choice). Based on your five verdicts, **IRV will upset you.** Here is why:

  1.  **It Violates Verdict (2):** IRV does *not* guarantee the Condorcet Winner. It is mathematically possible for IRV to eliminate B in the first round (because B had few first-place votes) and elect A, even if 7 people prefer B over A. You will see this as a failure of majority rule.
  2.  **It Violates Verdict (5):** IRV is non-monotonic. Sometimes, ranking a candidate *higher* can cause them to lose. This strikes the exact same "sneaky" chord as the Borda example you disliked.
  3.  **It Violates the Spirit of (4):** It is not transparent. In a 13-person meeting, counting IRV ballots requires multiple rounds of simulation. It feels like a "black box" compared to a show of hands.

  **Verdict:** Do not use IRV. It combines the complexity of Borda with the majoritarian failures of Plurality.

  ### 5. The Recommendation: Two-Round Runoff

  To satisfy your remaining principles (1, 2, 3, and the *spirit* of 5), you should adopt a **Two-Round System (Top-Two Runoff)**.

  *   **How it works:** Everyone votes for one candidate. If someone gets >50% (7 votes), they win. If not, the top two advance to a second vote (either immediately or next meeting).
  *   **Why it fits you:**
      *   **Satisfies (1) & (2):** The final round is always binary, guaranteeing the majority preference wins.
      *   **Satisfies (3):** Cycles are impossible in the final round.
      *   **Satisfies (4) (Modified):** The first round uses the simple "one vote" method you like.
      *   **Satisfies (5):** No complex ranking points. The "spoiler" effect of the first round is visible and understood, and the second round corrects it.
      *   **Co-op Context:** For 13 people, a second vote is low-cost. It ensures the winner has actual majority support, preserving community harmony.

  **Alternative: Condorcet Method (Pairwise Voting)**
  Since you only have 13 people, you can actually do this on a whiteboard.
  *   Vote on A vs B, B vs C, and A vs C.
  *   If one candidate beats both others, they win (Satisfies 2).
  *   If you get a cycle (A>B, B>C, C>A), you use a pre-agreed tiebreak (like dropping the weakest win, or a random draw) (Satisfies 3).
  *   **Why you might like this:** It is the only method that *mathematically guarantees* Verdict (2).
  *   **Why you might hate this:** It requires 3 votes instead of 1 or 2, and explaining the cycle tiebreak might feel like the "sneakiness" of (5).

  **Final Advice:**
  Propose the **Two-Round Runoff**. It respects your desire for simple voting (Round 1) while guaranteeing your desire for majority rule (Round 2). It avoids the "sneaky" math of Borda/IRV and prevents the "minority winner" problem of Plurality. Tell your committee: *"I want a method where the winner can look at the room and know for sure that at least half the people prefer them over the runner-up."* That is a principle no one can argue with.
