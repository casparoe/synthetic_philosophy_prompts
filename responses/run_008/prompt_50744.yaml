answer: |-
  Here are the desiderata for a futarchic system, structured to help you evaluate proposals without relying on ideological reflexes.

  ### 1. Incentive Compatibility (The Anti-Sabotage Constraint)
  **The Requirement:** The profit mechanism for traders must not reward them for physically or causally influencing the policy outcome to match their bet. A trader must not be able to spend \$1 million to sabotage a policy and earn \$10 million on a short position.

  **The Case:** Prediction markets work because traders are price-takers; they bet on a future they cannot change. Policy markets involve price-makers. If a trader holds a large enough position, their optimal strategy shifts from "predict the outcome" to "cause the outcome." This is not theoretical corruption; it is a mathematical feature of the payoff structure. If the potential profit from influencing the outcome exceeds the cost of influence, the market price reflects the trader's budget for sabotage, not the probability of success.

  **Status:**
  *   **Settled:** It is settled among mechanism designers that this incentive exists in principle.
  *   **Contested:** It is contested whether this is economically feasible at the scale of national policy (i.e., is it actually cheaper to bribe a market than to lobby a legislature?).
  *   **Negotiability:** **Non-negotiable.** If this is not solved, the system is not a governance mechanism; it is a vulnerability auction.

  ### 2. Metric Robustness (The Goodhart Resistance)
  **The Requirement:** The numerical metric used to settle contracts (e.g., "National GDP," "Crime Rate," "Composite Welfare Index") must be impossible to game without actually producing the desired underlying value.

  **The Case:** This is Goodhart's Law applied to governance: "When a measure becomes a target, it ceases to be a good measure." If the market maximizes GDP, traders will support policies that boost GDP while destroying environmental stability or social cohesion, provided those side effects aren't in the metric. If the metric is too complex to game, it is usually too subjective to settle contracts (leading to disputes). If it is simple enough to settle, it is usually simple enough to game.

  **Status:**
  *   **Settled:** Goodhart's Law is a settled economic/sociological principle.
  *   **Contested:** Whether a "robust enough" metric can be engineered is highly contested. Some argue for composite indices; others argue that any single number is fatal.
  *   **Negotiability:** **Non-negotiable.** A system that optimizes for a broken metric produces catastrophic policy more efficiently than a broken democracy.

  ### 3. Resolution Authority (The Oracle Problem)
  **The Requirement:** There must be a trusted, uncorruptible mechanism to declare the final value of the metric after the policy period ends.

  **The Case:** Prediction markets require a "truth source." In sports betting, the score is obvious. In policy, the data is often revised, lagged, or politically massaged (e.g., unemployment statistics). If the entity reporting the metric can be bribed or pressured, the market price will reflect the probability of corruption, not the probability of policy success.

  **Status:**
  *   **Settled:** All forecasting systems require an oracle.
  *   **Contested:** Whether a decentralized oracle (like a DAO vote) is more or less corruptible than a centralized statistical bureau is contested.
  *   **Negotiability:** **Non-negotiable.** Without a settlement mechanism, contracts cannot clear.

  ### 4. Reversibility and Feedback Loops
  **The Requirement:** The system must handle one-shot, irreversible decisions (e.g., going to war, constitutional amendments) where no feedback loop exists to correct wrong prices.

  **The Case:** Markets learn through repetition and arbitrage. If a market repeatedly prices rain incorrectly, traders correct it. If the decision is "Invade Country X," there is no repeat trial. If the market is wrong, the loss is total. Without the ability to update beliefs based on realized outcomes, the "wisdom of crowds" justification weakens significantly, as the crowd has no history of calibration on that specific class of event.

  **Status:**
  *   **Settled:** Markets perform worse on unique, low-frequency events than on high-frequency ones.
  *   **Contested:** Whether market pricing on unique events is still *better* than bureaucratic or democratic decision-making is contested.
  *   **Negotiability:** **Preference/Pragmatic.** You can design a futarchy that only handles budgetary/repeatable policy, excluding one-shot decisions. This limits the scope but saves the mechanism.

  ### 5. Liquidity and Subsidization
  **The Requirement:** There must be sufficient capital in the market to absorb informed traders' positions without massive slippage, ensuring prices reflect information rather than cash-flow constraints.

  **The Case:** Thin markets are easily manipulated by small actors and do not aggregate information well. Policy markets require massive liquidity to be meaningful. Since policy outcomes are public goods, individual traders may not have enough private incentive to fund the necessary liquidity.

  **Status:**
  *   **Settled:** Liquidity is required for market efficiency.
  *   **Contested:** Whether subsidized liquidity (e.g., a government backstop) creates its own distortions is contested.
  *   **Negotiability:** **Preference.** This is an engineering hurdle, not a theoretical dealbreaker. You can always print money to subsidize the market; the question is whether it's worth the cost.

  ---

  ### Incompatible Pairs (The Trade-Offs)

  **1. Profit Potential vs. Sabotage Resistance**
  *   **The Conflict:** Your hunch is correct. "Traders profit from being right about consequences" and "Policy outcomes can't be bought" are in direct tension.
  *   **Why:** To attract informed traders, payouts must be high enough to cover their research costs and risk. To prevent sabotage, payouts must be capped below the cost of influencing the outcome. For high-stakes policy (e.g., nuclear regulation), the cost of influence is low (a single bribe) but the stakes are high (trillions in value). Capping payouts low enough to prevent sabotage may make the market too illiquid to function.
  *   **Verdict:** You cannot maximize both. You must either accept the risk of sabotage or accept thin markets with low information aggregation.

  **2. Metric Specificity vs. Metric Integrity**
  *   **The Conflict:** A metric must be specific enough to be automatically settled (no human judgment) but broad enough to capture societal welfare.
  *   **Why:** Specific metrics (e.g., "Stock Market Index") are easy to settle but easy to game. Broad metrics (e.g., "Human Happiness") capture welfare but require human judgment to settle, which reintroduces corruption (see Resolution Authority).
  *   **Verdict:** You cannot have fully automated settlement *and* a holistic welfare metric. You must choose between mechanical integrity and normative completeness.

  ---

  ### The "Killer" Desideratum

  **Which single requirement rules out the most proposed versions?**
  **Metric Robustness (Goodhart Resistance).**

  While the Sabotage Constraint is the deepest *theoretical* flaw, most actual futarchy proposals die on the metric. Proposals typically suggest optimizing for GDP, tax revenue, or a specific basket of assets. It is trivial to demonstrate that maximizing these numbers via policy leads to dystopian outcomes (e.g., maximizing GDP by removing all environmental regulations). Proposals that suggest complex "welfare indices" immediately fail the **Resolution Authority** test because no one agrees on how to calculate them objectively.

  Almost no proposal successfully defines a metric that is simultaneously:
  1.  Objective enough to settle bets without dispute.
  2.  Broad enough to prevent catastrophic side-effects.
  3.  Hard enough to game that traders can't manipulate it.

  ### Negotiability Classification

  | Desideratum | Classification | Reasoning |
  | :--- | :--- | :--- |
  | **Incentive Compatibility** | **Non-negotiable** | If traders can profit from sabotage, the system is actively dangerous, not just inefficient. |
  | **Metric Robustness** | **Non-negotiable** | Optimizing the wrong number is worse than random decision-making. |
  | **Resolution Authority** | **Non-negotiable** | Without settlement, there is no market, only discussion. |
  | **Reversibility** | **Preference** | A hybrid system (futarchy for budgets, democracy for war) is coherent. Limiting scope is a valid design choice. |
  | **Liquidity** | **Preference** | This is a resource allocation problem. A society can choose to subsidize markets heavily if they value the output. |
  | **Decentralization** | **Preference** | Whether the market is run on a blockchain or by a central bank is an implementation detail, not a core requirement of the governance logic. |

  ### Settled vs. Contested Summary

  *   **Settled:** Markets aggregate information better than individuals *if* incentives are aligned, liquidity is high, and manipulation is costly. Goodhart's Law applies to all numerical metrics. Sabotage incentives exist whenever payouts exceed influence costs.
  *   **Contested:** Whether human policy is *capable* of meeting the "if" conditions above. Specifically, whether a metric can be constructed that is immune to Goodhart's Law, and whether the cost of sabotaging a national policy market is truly higher than the potential profit. There is no consensus on whether futarchy is theoretically impossible or just engineering-hard.
