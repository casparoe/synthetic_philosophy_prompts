          *   Why does the false promise example seem different from the talents example? (Contradiction in Conception vs. Contradiction in Will?)
          *   The "Maxim Description Problem": Does the outcome depend on how you phrase the maxim? (The friend who lies about reading books).
      *   **Constraints:** Explain like a 17-year-old (smart high schooler), do not dumb it down, no reading lists/citations of secondary literature (stick to the *Groundwork*), address the supervisor's unhelpful feedback.
      *   **Goal:** Help the student break through the wall for their IB Extended Essay.

  2.  **Deconstruct the Core Philosophical Issues:**

      *   **Issue 1: The Meaning of "Will".**
          *   It's not "wish" (desire). It's not just "logical possibility." It's about *rational commitment*.
          *   Kant distinguishes between *Wille* (legislative reason) and *Willkür* (choice), but for an EE at this level, focusing on *rational consistency* is better than getting bogged down in German terminology unless necessary.
          *   Key distinction: Can I *rationally commit* to this being a law of nature without undermining my own agency or goals?

      *   **Issue 2: Two Types of Contradiction.**
          *   The student is spot on: False Promise vs. Talents *do* fail differently.
          *   False Promise: Contradiction in Conception (CI). If everyone did it, the institution of promising collapses. It becomes logically impossible to achieve the goal.
          *   Talents: Contradiction in Will (CW). It's logically *possible* for everyone to be lazy, but a rational being cannot *will* this because they necessarily will the means to their own ends (and talents are means).
          *   This maps to Perfect vs. Imperfect Duties.

      *   **Issue 3: The Maxim Description Problem.**
          *   This is a classic objection (the "input problem").
          *   If I say "Lie when it helps," it fails. If I say "Lie about books to be polite," does it pass?
          *   Kant's answer (implicit): The maxim must include the *reason* for the action. If the reason is self-interest disguised as politeness, it still fails.
          *   However, for the EE, acknowledging this tension is gold. It shows critical engagement.

  3.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge that the student is asking the *right* questions. Their supervisor is being lazy. The distinction between the two types of failure is real and crucial.
      *   **Part 1: What is "Will"?**
          *   Distinguish "wish" (I want ice cream) from "will" (I commit to a principle).
          *   Use the analogy of legislation. You aren't just asking "Can I do this?" You are asking "Can I make this a law of nature?"
