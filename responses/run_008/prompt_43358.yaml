answer: |-
  Here is the specification of desiderata for a defense against acausal extortion, followed by an analysis of their provenance and compatibility, and finally the scoring of the three candidate schemes.

  ### Part I: The Desiderata

  To evaluate any proposed defense against acausal extortion, we must define what "working" means. The following six requirements cover the structural, economic, and game-theoretic constraints of the problem.

  **1. Efficacy Class (Deterrence vs. Mitigation)**
  *   **Requirement:** The defense must specify whether its primary success condition is preventing the threat from being issued (Deterrence) or minimizing loss if the threat is issued (Mitigation). A complete specification cannot claim both without qualification.
  *   **Motivating Case:** A "Never Pay" policy aims for Deterrence (the threatener simulates you, sees you won't pay, and doesn't bother). A "Surrogate Goal" policy aims for Mitigation (the threatener simulates you, sees you will pay the surrogate, threatens the surrogate, and you lose only the surrogate value). Confusing the two leads to policies that fail to deter but also fail to mitigate because they incur the costs of deterrence without the credibility.

  **2. Non-Provocation (Unmodeled Adversaries)**
  *   **Requirement:** The defense must not increase expected loss against adversaries who have *not* successfully modeled your decision algorithm or commitment structure.
  *   **Motivating Case:** If you adopt a visible, costly signaling mechanism to prove your resolve to acausal superintelligences, causal human adversaries (or lower-fidelity simulators) may interpret this signal as "this agent is paranoid/wealthy/committed to burning resources," making you a higher-priority target for conventional coercion or theft. A defense that protects against the gods but invites attack from the neighbors is net-negative.

  **3. Economic Efficiency (Cost of Defense)**
  *   **Requirement:** The expected cost of maintaining the defense (computational, reputational, or opportunity cost) must be strictly less than the expected loss from the threats it neutralizes.
  *   **Motivating Case:** If you must burn 10% of your resources annually to maintain a "credible commitment" infrastructure, but the probability of acausal extortion is 1% with a 5% loss, the defense is more expensive than the threat. Commitment machinery is not free; it requires cognitive load, pre-commitment devices, or reputation capital.

  **4. Reflective Stability (Self-Enforcement)**
  *   **Requirement:** The defense must be stable under the agent's own decision theory at the moment of payment. It cannot rely on a promise that the agent would rationally break when the moment comes, unless that irrationality is hard-coded.
  *   **Motivating Case:** An agent using Causal Decision Theory (CDT) knows that once the threat is made, the harm is sunk. Paying is causally ineffective. Therefore, a CDT agent cannot credibly threaten *not* to pay without external binding. An FDT/UDT agent can, but only if the algorithm dictates it. A defense that requires you to act against your own decision-theoretic evaluation at the critical moment will fail unless you are lobotomized or bound externally.

  **5. Transparency Robustness (Source Code Visibility)**
  *   **Requirement:** The defense must remain effective even if the adversary has perfect knowledge of the defense's algorithm and parameters.
  *   **Motivating Case:** In acausal trade, the adversary simulates you. Hiding your strategy is impossible by definition. If your defense relies on "they won't know I'm using surrogate goals," it fails. The strategy must be a Nash equilibrium where knowing your move does not give the adversary a counter-move that yields them higher utility at your expense.

  **6. Domain Isolation (Causal/Acausal Separation)**
  *   **Requirement:** The defense must not create vulnerabilities in causal interactions while solving acausal ones.
  *   **Motivating Case:** If you signal "I respond to logical coercion" to deter acausal blackmailers, causal actors might frame their demands as logical necessities or mimic acausal conditions. Conversely, if you signal "I ignore all threats," you lose leverage in causal negotiations (hostage situations, bargaining). The defense must be legible to the acausal without being exploitable by the causal.

  ***

  ### Part II: Analysis of Desiderata

  Here we distinguish between universal requirements and camp-specific prejudices, and address the compatibility of the goals.

  **Genuine Desiderata vs. Camp Prejudices**

  *   **Genuine:** *Efficacy Class, Economic Efficiency, Transparency Robustness.* All camps agree that losing less is better than losing more, that resources are finite, and that acausal adversaries see your source code. These are objective constraints.
  *   **Camp Prejudice (Updateless/Functionalists):** *Reflective Stability.* CDT holdouts and skeptics often argue that external binding (contracts, reputation, third-party enforcement) is sufficient and that requiring internal algorithmic stability is an unnecessary constraint for humans. However, for AI agents or agents facing high-fidelity simulation, this is a **Genuine Desideratum**. For humans, it leans toward the Updateless prejudice.
  *   **Camp Prejudice (Skeptics):** *Non-Provocation & Domain Isolation.* Skeptics who believe acausal trade is fiction view these requirements as solving non-problems. However, given the asymmetry of risk (infinite loss vs. finite cost), treating acausal risk as non-zero makes these **Genuine**.
  *   **Camp Prejudice (CDT Holdouts):** *Domain Isolation (specifically).* CDT agents often assume causal and acausal worlds are distinct. FDT agents know they are entangled. The requirement that defenses not leak is an **FDT/UDT priority**, but practically genuine for any agent existing in both realms.

  **The Incompatibility Thesis**

  You suspected that **Deterrence** and **Non-Provocation** cannot be jointly satisfied. My analysis confirms this tension, though I would refine it: **Strong Deterrence** and **Low Profile** are jointly unsatisfiable.

  *   **The Conflict:** To deter an acausal extortionist, you must signal that attacking you yields negative expected utility for *them*. This usually requires signaling high resilience or high retaliatory capacity (e.g., "I will never pay," or "I will hunt you down"). However, signaling high resilience or retaliatory capacity makes you visible. It marks you as a "player" in the acausal game.
  *   **The Paradox:** If you successfully look like a "bad target" (Deterrence), you implicitly admit you understand the game and have resources worth protecting. This can invite *testing* threats from adversaries who want to verify your signal. If you look like a "non-player" (Non-Provocation), you lack the signaling necessary for Deterrence.
  *   **Conclusion:** You must choose. A defense is either a **Shield** (Mitigation: "Take my money, I don't care") or a **Sword** (Deterrence: "Try me and you lose"). Surrogate Goals are a Shield. Flat Pre-commitment is a Sword. You cannot effectively be both without incurring the costs of both.

  ***

  ### Part III: Scoring the Candidates

  We score the three schemes against the six desiderata.
  **Scale:** Pass (P), Fail (F), Partial/Mixed (M).

  #### Candidate 1: Surrogate Goals
  *Adopt a stake you do not care about but can pay cheaply. Threateners target the surrogate.*

  1.  **Efficacy:** **M (Mitigation only).** It does not deter the threat; it redirects it. You still get threatened, you still pay (the surrogate cost). It fails if the adversary demands your *true* values regardless of the surrogate.
  2.  **Non-Provocation:** **P.** Generally low profile. You aren't signaling aggression, just odd utility functions.
  3.  **Efficiency:** **P.** Low cost if the surrogate is cheap.
  4.  **Reflective Stability:** **F.** At the moment of threat, a CDT agent knows the surrogate is fake and shouldn't pay. An FDT agent pays only if they pre-committed. It requires strong pre-commitment machinery.
  5.  **Transparency:** **M.** If the adversary knows the surrogate is fake, they may threaten your *real* values anyway, betting you won't pay the surrogate once they bypass it. It relies on the adversary preferring *some* payment over *no* payment.
  6.  **Domain Isolation:** **P.** Unlikely to affect causal bargaining significantly.

  *Verdict:* A damage-limitation strategy, not a defense. Good for risk-averse agents who expect threats are inevitable.

  #### Candidate 2: Flat Pre-commitment (Never Pay)
  *Commit to never paying any acausal threat, regardless of cost.*

  1.  **Efficacy:** **P (Deterrence).** If credible, this eliminates the threat entirely. Extortionists simulate you, see 0% payout, and do not attack.
  2.  **Non-Provocation:** **M.** Can be seen as aggressive. May invite "testing" threats to see if the commitment is real.
  3.  **Efficiency:** **P.** Zero cost if it works. High cost if it fails (you lose everything).
  4.  **Reflective Stability:** **F (for CDT), P (for FDT/UDT).** A CDT agent cannot sustain this without external binding (lobotomy/death switch). An FDT agent can sustain it logically, but it is brittle.
  5.  **Transparency:** **P.** Works *because* it is transparent.
  6.  **Domain Isolation:** **F.** Dangerous in causal contexts. "Never pay" gets hostages killed in the causal world. Requires precise domain tagging which is hard to maintain.

  *Verdict:* High risk, high reward. Requires FDT/UDT architecture to be self-enforcing. Catastrophic failure mode if credibility is doubted.

  #### Candidate 3: Costly Credibility (Pay Early, Resist Later)
  *Pay small threats early to build a track record, then switch to resisting.*

  1.  **Efficacy:** **F.** In acausal contexts, "Later" is visible "Now." The adversary simulates your entire timeline. They see you *plan* to resist later, so they know you are a "Never Pay" type in the long run, but they also see you are *capable* of paying in the short run. This invites early threats.
  2.  **Non-Provocation:** **F.** Explicitly signals "I am a mark for early threats."
  3.  **Efficiency:** **F.** You explicitly incur costs (paying early threats) to buy credibility. This violates the efficiency desideratum unless the early costs are trivial and the later protection is absolute.
  4.  **Reflective Stability:** **F.** Time-inconsistent. When "Later" arrives, the agent has an incentive to renege on the resistance to save themselves, undermining the early signal.
  5.  **Transparency:** **F.** Because the plan is visible, adversaries simply threaten you during the "Early" phase. There is no acausal hiding spot.
  6.  **Domain Isolation:** **F.** Signals to causal actors that you are a pushover initially.

  *Verdict:* This scheme misunderstands acausal simulation. You cannot hide your future policy from a simulator. It collapses into a mix of Candidate 1 and 2 but incurs the costs of both.

  ### Final Assessment

  Your suspicion was correct. **Deterrence (Candidate 2) and Non-Provocation (Candidate 3's intent) are in tension.**

  *   **Surrogate Goals** is the only scheme that accepts the reality of the trade-off: it sacrifices Deterrence to ensure Mitigation and Non-Provocation. It admits you cannot stop the threat, so you minimize the bleed.
  *   **Flat Pre-commitment** is the only scheme that achieves Deterrence, but it fails Domain Isolation and Reflective Stability (for non-UDT agents).
  *   **Costly Credibility** fails because it treats acausal time like causal time. In acausal trade, your "future" resistance is visible *now*, making the "early payment" phase a pure loss without the benefit of long-term deterrence (since they see the resistance coming).

  **Recommendation:** If you are an FDT/UDT agent (or can bind yourself as such), **Flat Pre-commitment** is the dominant strategy *provided* you can solve Domain Isolation (i.e., ensure causal hostages aren't treated by the same rule). If you are a human or CDT agent unable to bind your future self perfectly, **Surrogate Goals** is the only robust option, but you must reframe your expectation: it is not a shield against attack, it is insurance against ruin. The project should indeed be reframed as **Damage Limitation**. Deterrence requires a level of logical self-mastery that is likely unavailable to unbound agents.
