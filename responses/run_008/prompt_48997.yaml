  I recently had to choose between taking a fixed severance payment and staying for a contingent bonus tied to the survival of my employer — a privately held company with opaque finances, so I had no basis for anything like a real probability. I realized I have strong reactions to uncertainty that isn't just risk, which led me to the Ellsberg urns and to testing my own gut on variants. Here are my verdicts:

