  ### The Principle

  **Smooth Ambiguity Preferences with Continuity Constraint.**
  An agent maximizes a utility function defined over acts, where the evaluation of an ambiguous act involves a two-stage process: first, calculating the expected utility for each probability measure in a set of priors (representing the ambiguity); second, aggregating these expected utilities using a concave transformation function (representing ambiguity aversion) weighted by a second-order subjective distribution over those priors. Crucially, this aggregation must satisfy the **Archimedean Continuity Axiom**, meaning that for any ambiguous act, there exists some sufficiently large monetary premium that will render it preferable to a known-risk act, thereby distinguishing rational caution from lexicographic refusal.

  ### Predictions on New Cases

