  2. Same setup, but betting on black: I bet on K-black rather than U-black. I can see that holding 1 and 2 together is supposed to be an embarrassment, and I hold them anyway.
  3. If forced to bet red or black on U alone, I'm indifferent between the two colors — nothing I know favors either.
  4. Offered $112 on U-red versus $100 on K-red, I take the U-red bet. Whatever my aversion in case 1 amounts to, it's worth less than $12 to me.
  5. My friend, facing U alone, refuses to bet on either color at any odds — even a $500 payout for a $1 stake. I think she's being irrational, not merely extra-cautious, though I can't articulate how she differs from me.
  6. On losses: a known 50% chance of losing $100 versus a chance verified to lie somewhere between 40% and 60% of losing $100. I take the known 50%, but this one feels different from cases 1 and 2 — more like fear than policy.
  7. In the severance case, I took the fixed payment even though my best estimate was that the contingent claim was worth about 15% more. Yet I'd have taken a contingent claim in a comparable company that published an audited survival probability, even at lower expected value.

  You are a decision theorist and a careful philosopher of rational choice. Think hard before committing: first brainstorm candidate principles that could govern this territory — max-min expected utility with a set of priors, smooth ambiguity models, whatever else suggests itself, including something homegrown — and then determine whether any single principle captures my verdicts. Where it can't save everything, tell me which of my verdicts to surrender and why, especially whether the tension between my cases 1–2 and my dismissal of my friend in case 5 can be resolved at all.

