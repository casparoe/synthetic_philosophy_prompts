  **Case 5: The "Pay-to-Win" Nerf.**
  > A player spends $500 of real money on a specific weapon character. The studio officially "nerfs" (weakens) the character in a patch, making it useless for high-level play. The character is not removed, just ruined. The ToS allows balance changes. Did the studio wrong the player, and do they owe compensation?

  *   **Why this breaks the tie:**
      *   **Consent Rule:** The player consented to the ToS which allows balance changes. The item still exists. Verdict: **No wrong.**
      *   **Investment Rule:** The *value* of the investment was destroyed by the agent (studio). It is functionally identical to wiping the item. Verdict: **Real wrong, compensation owed.**

