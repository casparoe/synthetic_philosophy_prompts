  ### Which Cases Split the Rules?

  **Case 1 (Rollback)** and **Case 4 (Shutdown)** are your splitters.
  *   **Case 4 is the cleanest split.** It pits "What the Contract Says" (Consent) against "Where the Money Went" (Investment). If she says the studio owes nothing because "it's in the ToS," she is running the **Contextual Consent** rule. If she says "I paid $50, I want $50 back," she is running the **Irrecoverable Investment** rule.

  ### The Tie-Breaker Case

