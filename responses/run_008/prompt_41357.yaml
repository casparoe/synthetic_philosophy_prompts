prompt: |-
  I work at a charity evaluator that ranks interventions benefiting different people — deworming for children in one region, cash transfers for households in another, a lobbying effort whose beneficiaries are diffuse future people. Every ranking we publish presupposes an answer to a question our methodology section quietly avoids: how much of one person's welfare is worth how much of another's, and what makes that comparison anything more than a convention we adopted for the spreadsheet. Before I read another theory of interpersonal utility comparisons, I want the specification first: what any adequate account of them has to deliver, and for a fixed purpose — good enough to justify a ranking of social states to a donor or a health ministry, not just to settle metaphysics at a seminar.

  Write the desiderata. At minimum I want the following covered, plus anything you think I'm missing:

  The cases it must get right. These should include: the tinnitus-and-toothache case (is one person's year of constant tinnitus worth more or less than two people's years of intermittent toothache — and, crucially, is the answer a matter of truth or of stipulation?); the utility monster who reports astronomical gains from any resource transferred to him; the sour-grapes case, where someone's preferences have adapted to deprivation, so that comparing preference-satisfaction across people rewards the oppressed for their coping; and the swap case, where two people exchange complete life situations and the comparison should presumably come out antisymmetric.

  The distinctions it must respect: between comparability of levels and comparability of differences (and why aggregation seems to need the latter); between cardinal and ordinal individual scales, and what licenses carrying the cardinality across persons rather than only within one; between welfare itself and whatever indicator we actually measure — money, health states, reported happiness — including whether the indicator's conveniences (an existing market, an existing questionnaire) are doing illicit work.

  The positions it must engage rather than dodge: the ordinalist dismissal, going back to Robbins in the 1930s, that interpersonal comparisons are unscientific because no common unit exists; and the veil-style attempts to bootstrap comparability from a hypothetical impartial observer, given that the average-utility and worst-off variants of that device pull in different directions.

  Then the part I most want: mark which desiderata are non-negotiable for my purpose and which are prejudices of one camp; flag any pair or subset you suspect is jointly unsatisfiable — if demanding full ordinalism with no interpersonal information makes the ranking impossible to construct, say so plainly, because that itself is a result I can take to my board. Finally, tell me which single requirement does the most work excluding the live contenders — extended preference theories, money-metric welfare, health-state utilities of the QALY sort, objective-good indices — and give a one-line verdict for each contender on which requirement it fails. Keep the weight on the criteria and their motivating cases; the verdicts can be terse.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Works at a charity evaluator (like GiveWell or similar). Needs to rank interventions affecting different people (deworming, cash transfers, lobbying).
      *   **Problem:** Current methodology avoids the core philosophical issue: Interpersonal Utility Comparisons (IUC). How much is one person's welfare worth compared to another's? Is it truth or convention?
      *   **Task:** Write the *desiderata* for an adequate account of IUC suitable for practical policy/ranking (not just metaphysics).
      *   **Required Coverage:**
          *   Cases: Tinnitus vs. Toothache (truth vs. stipulation), Utility Monster, Sour Grapes (adaptive preferences), Swap Case (antisymmetry).
          *   Distinctions: Levels vs. Differences, Cardinal vs. Ordinal (cross-person licensing), Welfare vs. Indicators (money, health, happiness).
          *   Positions: Robbins/Ordinalist dismissal, Veil of Ignorance (average vs. worst-off tension).
          *   **Crucial Additions:** Mark non-negotiables vs. prejudices; flag jointly unsatisfiable sets; identify the single most exclusionary requirement; give one-line verdicts on contenders (Extended Preferences, Money-Metric, QALYs, Objective Goods).
      *   **Tone:** Professional, rigorous, pragmatic, philosophical but action-oriented.

  2.  **Deconstruct the Desiderata (Drafting Phase):**

      *   *Goal:* A framework for ranking social states for donors/ministries.
      *   *Constraint:* Must handle the specific cases and distinctions listed.

      *   *Case 1: Tinnitus vs. Toothache.* This is about *unit comparability*. Is there a fact of the matter?
      *   *Case 2: Utility Monster.* This is about *diminishing marginal utility* or *capping* vs. *summing*.
      *   *Case 3: Sour Grapes.* This is about *objective vs. subjective* welfare. Adaptive preferences break subjective metrics.
      *   *Case 4: Swap Case.* This is about *anonymity* and *identity independence*. If A and B swap lives, the social value shouldn't change just because names changed.

      *   *Distinction 1: Levels vs. Differences.* To aggregate (sum), we need differences (intervals). Levels are needed for prioritarianism.
      *   *Distinction 2: Cardinal vs. Ordinal.* Ordinal isn't enough for trade-offs. We need to justify *why* cardinality transfers across persons.
      *   *Distinction 3: Welfare vs. Indicators.* Don't confuse the map (money/QALYs) with the territory (welfare).

      *   *Positions:* Robbins (impossible/unscientific) vs. Harsanyi/Rawls (Veil). Need to address why the Veil might yield different results (Avg vs. Maxmin).

  3.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the gravity of the task. This is the "engine room" of effective altruism/policy.
      *   **Section 1: The Core Desiderata (The "What"):** Group the requirements logically (Ontological, Structural, Epistemic).
      *   **Section 2: The Feasibility Check (The "Can"):** Address the non-negotiables vs. prejudices and the impossibility theorems.
      *   **Section 3: The Exclusionary Criterion & Verdicts:** Identify the killer constraint and rate the contenders.

  4.  **Drafting Content - Section by Section:**

      *   *Intro:* Validate the user's frustration. The "quiet avoidance" is the skeleton in the closet.
      *   *Desiderata:*
          *   **D1: Factuality (The Tinnitus/Toothache Test).** Must specify if comparisons are discovered or constructed. For policy, it acts *as if* truth, but must acknowledge the epistemic status.
          *   **D2: Sensitivity to Intensity (The Cardinality Test).** Must distinguish between "I prefer A" and "I prefer A *much more* than B." Ordinalism fails here.
          *   **D3: Anti-Adaptation (The Sour Grapes Test).** Welfare cannot be purely subjective preference satisfaction. Must correct for deprived expectations.
          *   **D4: Anonymity/Identity Independence (The Swap Test).** $W(A_1, B_2) = W(A_2, B_1)$. The ranking depends on the *distribution* of welfare, not who holds it.
          *   **D5: Diminishing Marginal Moral Value (The Monster Test).** Must handle the Utility Monster. Usually requires concavity in the social welfare function or capping utility.
          *   **D6: Indicator Neutrality.** The metric (QALY, $) must be validated against welfare, not vice versa.

      *   *Distinctions & Positions:* Integrate Robbins (impossibility claim) and Veil (justification claim).
      *   *Non-Negotiables vs. Prejudices:*
          *   *Non-Negotiable:* Action-guidance (must produce a ranking), Anti-Adaptation (Sour Grapes is a dealbreaker for development work), Cardinality of Differences (needed for trade-offs).
          *   *Prejudice:* Full Objectivity (hard to define), Strict Summation (could be prioritarian).
      *   *Impossibility:* The "Robbins Gap." You cannot get D2 (Cardinal Differences) from D3 (Observable Preference) without extra assumptions. This is the joint unsatisfiability.
      *   *The Killer Requirement:* **D2 + D3 combined.** You need cardinal differences *that are not corrupted by adaptive preferences.*
      *   *Verdicts:*
          *   Extended Preferences: Fails Epistemic Access (too hypothetical).
          *   Money-Metric: Fails Anti-Adaptation (wealth $\neq$ welfare).
          *   QALYs: Fails Cross-Person Cardinality (assumes health states equal across contexts).
          *   Objective Goods: Fails Respect for Agency (paternalism risk).

  5.  **Refining and Polishing:**

      *   *Tone Check:* Is it too academic? The user wants specs for a board. Make it crisp.
      *   *Specific Constraint:* "Mark which desiderata are non-negotiable... flag any pair... jointly unsatisfiable."
      *   *Specific Constraint:* "Tell me which single requirement does the most work excluding the live contenders."
      *   *Specific Constraint:* "One-line verdict for each contender."

      *(Self-Correction during drafting)*: I need to be careful with the "Truth vs. Stipulation" part. For a charity evaluator, treating it as stipulation is dangerous (arbitrary), but treating it as truth is metaphysically risky. The desideratum should be *Operational Realism*: It must function as truth for decision-making, even if metaphysically constructed.
      *   *The "Swap Case":* This is technically Anonymity. I need to ensure I explain *why* it matters (prevents discrimination).
      *   *The "Robbins" point:* I need to explicitly state that satisfying Robbins (pure ordinalism) makes the charity's job impossible. That's the key takeaway for the board.

  6.  **Final Review against Prompt:**
      *   Cases covered? Yes (Tinnitus, Monster, Sour Grapes, Swap).
      *   Distinctions covered? Yes (Levels/Diffs, Cardinal/Ordinal, Welfare/Indicator).
      *   Positions covered? Yes (Robbins, Veil).
      *   Non-negotiables/Prejudices flagged? Yes.
      *   Jointly unsatisfiable sets flagged? Yes (Robbins + Aggregation).
      *   Single exclusionary requirement identified? Yes.
      *   One-line verdicts? Yes.

  7.  **Final Polish:** Ensure the distinction between "levels" and "differences" is clear in the context of aggregation (utilitarianism needs differences, prioritarianism needs levels). Ensure the "Sour Grapes" point hits the preference satisfaction vs. objective welfare tension.

      *(Refining the "Single Requirement")*: What kills the most contenders? It's usually the combination of **Cross-Person Cardinality of Differences** + **Immunity to Adaptive Preferences**. QALYs have cardinality but struggle with adaptation/context. Money metrics fail adaptation. Extended preferences fail measurability. I will frame the "Killer" as **Calibrated Cross-Person Cardinality**.

      *(Refining the "Impossibility")*: The set {Robbins' Ordinalism, Aggregation for Trade-offs, Non-Arbitrariness} is inconsistent. I need to state this clearly.

      Let's write it.
answer: |-
  # Specification for Interpersonal Welfare Comparisons (IUC)
  **Purpose:** To justify ranking social states for resource allocation (donors/health ministries).
  **Status:** Operational Prerequisite, not Metaphysical Settlement.

  ## I. The Desiderata
  An adequate account must satisfy the following conditions to function as a decision procedure.

  ### 1. The Case Constraints
  *   **The Tinnitus-and-Toothache Test (Unit Comparability):** The account must specify whether the ratio of disutility between Person A's chronic tinnitus and Person B's intermittent toothache is a *fact to be discovered* (e.g., via neuroscience or phenomenology) or a *normative stipulation* (e.g., via democratic consensus).
      *   *Requirement:* **Operational Realism.** Even if metaphysically constructed, the comparison must function as truth-apt in the spreadsheet. You cannot label it "conventional" in the methodology and "objective" in the pitch to donors.
  *   **The Utility Monster Test (Marginal Moral Value):** The account must prevent a single agent with high marginal utility capacity (the "Monster") from absorbing all resources, unless there is a justified reason to do so.
      *   *Requirement:* **Diminishing Moral Weight.** The aggregation function must either cap individual utility contributions or apply a concave transformation to welfare before summing.
  *   **The Sour Grapes Test (Adaptive Preferences):** The account must not rank a deprived population as "high welfare" simply because their expectations have lowered and they report satisfaction.
      *   *Requirement:* **Preference Correction.** Welfare metrics must be insulated from endogenous preference formation caused by oppression or deprivation.
  *   **The Swap Test (Anonymity):** If Person A and Person B exchange complete life trajectories, the social value of the state must remain unchanged.
      *   *Requirement:* **Identity Independence.** The ranking depends on the *vector* of welfare values, not the *assignment* of those values to specific names.

  ### 2. The Structural Distinctions
  *   **Levels vs. Differences:** The account must specify whether it compares *where* people are (levels) or *how much* they gain/lose (differences).
      *   *Requirement:* **Interval Comparability.** To aggregate trade-offs (e.g., cost-effectiveness analysis), you need comparable *differences*. To prioritize the worst-off (prioritarianism), you need comparable *levels*. A ranking system for charity must support at least comparable differences.
  *   **Cardinal vs. Ordinal:** The account must justify importing cardinality (intensity) from within a person to *between* persons.
      *   *Requirement:* **Cross-Person Calibration.** It is not enough that A can say "I prefer X to Y twice as much as Z." A and B must share a common unit where A's "twice as much" is equivalent to B's "twice as much."
  *   **Welfare vs. Indicators:** The account must distinguish the construct (welfare) from the proxy (income, QALYs, happiness scores).
      *   *Requirement:* **Indicator Validity.** The convenience of an indicator (e.g., market prices for cash transfers) cannot justify its use if it systematically diverges from welfare (e.g., due to disability costs or adaptive preferences).

  ### 3. The Positional Engagements
  *   **The Robbins Challenge:** The account must explicitly reject or circumvent Lionel Robbins' claim that IUC is unscientific because utility is ordinal and unobservable.
      *   *Requirement:* **Scientific Admissibility.** You must provide a warrant for why IUC is no less "scientific" than comparing temperature across different thermometers, despite the lack of a direct physical meter.
  *   **The Veil Tension:** The account must address the divergence between Harsanyi's Veil (yielding average utilitarianism) and Rawls' Veil (yielding maximin).
      *   *Requirement:* **Risk-Stance Transparency.** The methodology must state whether it treats beneficiaries as risk-neutral (summing expected welfare) or risk-averse (prioritizing the floor), as this changes the ranking of high-variance interventions (e.g., lobbying vs. cash).

  ---

  ## II. Feasibility & Compatibility Check

  ### Non-Negotiables (For Your Purpose)
  These are required to produce a ranking that is actionable and ethically defensible to a health ministry.
  1.  **Interval Comparability (Differences):** Without this, you cannot calculate cost-per-unit-of-welfare. You cannot trade off deworming against cash.
  2.  **Preference Correction (Sour Grapes):** Without this, you cannot justify intervening in "satisfied" oppressed communities. This is core to the development mandate.
  3.  **Identity Independence (Swap):** Without this, your rankings could implicitly discriminate based on identity rather than need.

  ### Prejudices (Optional/Debatable)
  These are philosophical commitments that one camp demands but are not strictly necessary for a functional ranking.
  1.  **Metaphysical Realism:** Whether the comparison is "true" in a Platonic sense. You only need *Operational Realism* (consistency).
  2.  **Strict Summation:** You can rank without summing (e.g., prioritarianism or sufficientarianism), provided you have interval comparability.
  3.  **Subjective Phenomenology:** Welfare does not have to be "felt" happiness; it can be objective list, provided it satisfies the Sour Grapes test.

  ### The Impossibility Result (For the Board)
  **The "Robbins Gap" Triad:** The following three constraints are **jointly unsatisfiable**. You must drop one.
  1.  **Strict Ordinalism:** No interpersonal comparison of utility intensity (Robbins' constraint).
  2.  **Aggregation:** The ability to sum or weigh trade-offs across persons (required for cost-effectiveness).
  3.  **Non-Arbitrariness:** The ranking is not based on mere convention or the analyst's whim.

  *Verdict:* If you keep (1) and (2), your rankings are arbitrary. If you keep (1) and (3), you cannot aggregate (no ranking). To have a ranking (2) that isn't arbitrary (3), **you must reject Strict Ordinalism (1).** You must assert that interpersonal intensity comparisons are scientifically admissible.

  ---

  ## III. The Exclusionary Criterion & Contender Verdicts

  ### The Single Exclusionary Requirement
  **Calibrated Cross-Person Cardinality Immune to Adaptation.**
  This is the bottleneck. It demands a metric that measures *intensity* of welfare (cardinality), applies *across different people* (calibration), and is not distorted by *lowered expectations* (immunity to adaptation). Most metrics fail one leg of this stool.

  ### Contender Verdicts

  **1. Extended Preference Theory (Harsanyi/Sobel)**
  *   *Mechanism:* Compare welfare by asking what an impartial observer would prefer if they occupied each person's situation.
  *   *Verdict:* **Fails Epistemic Access:** It solves the calibration problem theoretically but offers no operational method for measurement in the field.

  **2. Money-Metric Welfare (Willingness-to-Pay)**
  *   *Mechanism:* Use income/consumption as a proxy for utility, assuming marginal utility of money is comparable.
  *   *Verdict:* **Fails Preference Correction:** It validates adaptive preferences (the poor value money less because they expect less) and ignores disability costs.

  **3. Health-State Utilities (QALYs/DALYs)**
  *   *Mechanism:* Use standard gambles to assign cardinal values to health states (e.g., blindness = 0.6 welfare).
  *   *Verdict:* **Fails Cross-Person Calibration:** It assumes a health state (e.g., "moderate depression") reduces welfare equally for a farmer in Malawi and a banker in London, ignoring contextual adaptation.

  **4. Objective-Good Indices (Capabilities Approach)**
  *   *Mechanism:* Rank based on access to functionings (nutrition, literacy, shelter) rather than subjective utility.
  *   *Verdict:* **Fails Identity Independence:** It risks paternalism by imposing a specific conception of the "good life" that may not match the beneficiaries' own weighting of values.

  **5. Experienced Utility (Global Happiness/Satisfaction Surveys)**
  *   *Mechanism:* Use self-reported life satisfaction (0-10 scales) as the common unit.
  *   *Verdict:* **Fails Preference Correction:** It is the most vulnerable to the Sour Grapes problem (oppressed populations often report high satisfaction).

  ### Summary Recommendation for the Board
  To publish a ranking, you must explicitly **violate Robbins' Ordinalism**. You cannot wait for a perfect metaphysical solution. The most viable operational path is a **Hybrid Objective-Subjective Index**: use objective capabilities to correct for adaptive preferences (Sour Grapes) and subjective reports to calibrate intensity (Tinnitus/Toothache), while applying a concave transformation to the final score to neutralize the Utility Monster. Any other approach renders your spreadsheet either arbitrary or silent.
