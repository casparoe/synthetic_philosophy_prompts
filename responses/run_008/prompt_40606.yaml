          *   *Critique:* "Any... must be biased" is too strong. It depends on the definition of "biased." It requires specific conditions (base rate differences).
          *   *Verdict:* Overgeneralization.

      *   *Sentence 2:* "If a court uses an algorithm to predict who will reoffend, it cannot treat different demographic groups equally: either the algorithm will wrongly label members of one group as high-risk more often than the other, or its predictions will be systematically miscalibrated and simply wrong about who reoffends."
          *   *Fact Check:* This describes the tension between *error rate balance* (equal FPR/FNR) and *calibration*.
          *   *Critique:* "Treat... equally" is vague. The dichotomy is roughly correct (Calibration vs. Error Rate Balance), but "simply wrong" is misleading. Calibration isn't about being "wrong," it's about probability alignment.
