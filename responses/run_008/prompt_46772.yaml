          *   Need coarse-graining (cells in phase space).
          *   *Problem:* If you coarse-grain enough to make recurrence probable within universe lifetime, you lose "every detail." If you keep "every detail" (microstate), recurrence time is effectively infinite.
          *   *Conclusion:* The cosmological claim is mathematically unstable. It requires a discrete state space (digital physics?) or infinite time + finite volume + Hamiltonian flow.

      *   **The Practical Reading (The Existential Test):**
          *   *Nietzsche:* Live so you *want* this trajectory to repeat.
          *   *Physics Translation:* Optimization functional. Maximize a utility function $U[\Gamma(t)]$ over the trajectory.
