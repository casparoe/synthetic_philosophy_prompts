prompt: |-
  I'm a control and embedded-systems engineer by trade — fifteen years of designing layered architectures: low-level PID loops closing the loop on motor currents, supervisory controllers issuing setpoints, high-level planners, hardware abstraction layers, message buses tying it all together, and occasionally the thankless work of arguing with management about which layer a function "really belongs" to. I've recently started reading philosophy of mind, and Jaegwon Kim's causal exclusion argument strikes me as something I ought to be able to map onto debates I already have at work — about whether a planner "causes" the robot's motion or whether only the actuator currents do, about what a level of abstraction adds beyond the signals passing through it — but I can't tell whether the mapping is honest or whether it quietly cheats.

  Here is the task. Restate the exclusion argument — the causal closure of the physical, the worry that mental-to-physical causation would require implausible overdetermination, the supervenience of the mental on the physical, and the dilemma that seems to force either reduction or epiphenomenalism — in my vocabulary: plant dynamics and input signals, setpoints and feedback, layered control, signals on a bus, levels of abstraction in a stack. Take the mental properties as, roughly, the higher levels of the control hierarchy and the physical as the plant plus the electronics, and run the argument through as faithfully as you can. But flag where my vocabulary smuggles in an assumption the philosophers deny: in every system I have ever built, the higher layer causes things by injecting a distinct physical signal — the planner's decision becomes a voltage on a wire, a message on a bus — so my framework may simply presuppose that every level has its own causal channel, which is exactly what seems off-limits in the philosophy of mind case where the mental is supposed to be realised by, not wired into, the physical.

  Then give me the residue report. Which parts of Kim's argument translate cleanly into control-systems terms, which parts only translate with distortion, and which parts have no expression at all in my vocabulary? Also translate, as far as possible, the standard escapes people propose — treating mental causation as a different description of the same causal process rather than an extra cause, interventionist or difference-making accounts of causation, the autonomy of the special sciences — and say which of these, if any, my layered-architecture intuition is already tacitly endorsing. Finally, tell me your honest view on the residue: is it a defect of my vocabulary (it can't represent a cause that is simultaneously determined by and distinct from its realiser), or is it a sign that the exclusion argument is less clear than it looks, trading on an ambiguity my engineering framings would have forced it to resolve? Please answer in British English.
