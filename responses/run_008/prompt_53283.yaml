  I'm a third-year PhD student in formal epistemology, and my reading group has spent the whole semester on Sleeping Beauty. We've got a committed halfer and a committed thirder who keep talking past each other, so we're forcing them into an adversarial collaboration and I've been asked to draft the document. You're an expert on self-locating belief and anthropic reasoning who has thought way too much about this puzzle -- brainstorm the cruxes before you start drafting, dont just wing it.

