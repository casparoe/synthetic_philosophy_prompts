  # JOINT STATEMENT OF AGREEMENT AND DISAGREEMENT
  **Project:** Adversarial Collaboration on the Sleeping Beauty Problem
  **Signatories:** [Halfer Representative], [Thirder Representative]
  **Date:** [Current Date]

  ## 1. Agreed Claims: Setup and Information State
  Both parties endorse the following formalization of the experimental protocol and the agent's epistemic state.

  1.  **The Coin:** A single fair coin is tossed at $t_0$. The objective chance function $Ch$ satisfies $Ch(Heads) = Ch(Tails) = 1/2$. Both parties agree Beauty knows this prior to sedation.
  2.  **The Protocol:**
      *   If **Heads**: Beauty is awakened on Monday ($Mon$), interviewed, and put back to sleep with amnesia-inducing drug. She sleeps through Tuesday ($Tue$).
      *   If **Tails**: Beauty is awakened on Monday ($Mon$), interviewed, put back to sleep with amnesia. She is awakened again on Tuesday ($Tue$), interviewed, and put back to sleep.
      *   The amnesia drug removes memory of any awakening *within* the experiment. It does not remove memory of the protocol, pre-experiment memories, or the fact that she is currently awake.
  3.  **The Question:** The target of disagreement is Beauty's credence function $Cr$ at the moment of awakening *before* she is told the day of the week. The proposition in question is $H$: "The coin toss at $t_0$ landed Heads."
  4.  **Centered Worlds:** Both parties agree that upon waking, Beauty faces self-locating uncertainty. She knows she is in one of three subjectively indistinguishable scenarios: $\langle H, Mon \rangle$, $\langle T, Mon \rangle$, or $\langle T, Tue \rangle$.
  5.  **No External Cues:** Upon waking, Beauty receives no sensory information distinguishing Monday from Tuesday, nor Heads from Tails, other than the fact of her own wakefulness.

  ## 2. Statement of Disagreement
  The parties disagree on the rational assignment of credence to $H$ given the setup above.

  | Feature | **Halfer Position** | **Thirder Position** |
  | :--- | :--- | :--- |
  | **Primary Claim** | Upon waking, $Cr(H) = 1/2$. | Upon waking, $Cr(H) = 1/3$. |
  | **Rationale** | Waking provides no *new* relevant evidence regarding the outcome of the coin toss. The prior probability of the coin toss ($1/2$) should be preserved because the awakening is guaranteed regardless of the outcome. | Waking provides self-locating evidence. Beauty should reason over the space of *awakenings*. Since there are three indistinguishable awakenings and only one occurs in a Heads world, the credence should reflect this proportion. |
  | **Normative Basis** | Adheres to the **Principle of Indifference** over the coin outcomes (uncentered propositions). | Adheres to the **Principle of Indifference** over subjectively indistinguishable centered worlds (awakenings). |
  | **Betting Behavior** | Beauty should accept bets on $H$ at odds reflecting $1/2$ *per experiment*, but acknowledges she may face the bet multiple times in Tails worlds. | Beauty should accept bets on $H$ at odds reflecting $1/3$ *per awakening* to avoid sure losses across the long run of awakenings. |

  ## 3. Cruxes and Predictions
  The parties identify three specific test cases where their commitments yield divergent predictions. Both parties agree to record their predictions in advance.

  ### Crux 1: The "Monday" Information (Conditionalization)
  **Scenario:** Upon waking, Beauty is truthfully informed: "It is Monday." She must update her credence in $H$ based on this information ($Mon$).
  **Agreed Relevance:** This tests whether the initial credence allows for standard Bayesian conditionalization on self-locating information.

  *   **Halfer Prediction:** $Cr(H | Mon) = 2/3$.
      *   *Reasoning:* $Cr(Mon | H) = 1$ and $Cr(Mon | T) = 1/2$. Given initial $Cr(H)=1/2$, Bayes' Theorem yields $2/3$.
  *   **Thirder Prediction:** $Cr(H | Mon) = 1/2$.
      *   *Reasoning:* Given $Mon$, the scenario reduces to $\langle H, Mon \rangle$ vs $\langle T, Mon \rangle$. These are equiprobable. Learning it is Monday eliminates the $\langle T, Tue \rangle$ option, restoring the coin's fair bias.

  ### Crux 2: Imprecise Credence and Dutch Books
  **Scenario:** Beauty is offered a bet each time she wakes: Pay \$2 if $H$, Win \$3 if $T$. (Or equivalent Dutch Book setup targeting $1/2$ credence).
  **Agreed Relevance:** This tests whether a sharp credence is required for rational decision theory, or if imprecise credence (a set of probability functions) is a valid escape from Dutch Book arguments.

  *   **Halfer Prediction:** Beauty's credence may be **imprecise** (e.g., interval $[1/3, 1/2]$) or she should reject the bet based on *experiment-level* expected utility, not *awakening-level* utility. A sharp $1/2$ credence does not mandate accepting a bet that loses money across the Tails-wakings.
  *   **Thirder Prediction:** Beauty's credence must be **sharp** ($1/3$). Imprecise credence is an ad-hoc dodge to avoid the normative force of the Dutch Book. If Beauty has $Cr(H)=1/2$, she is vulnerable to a sure loss across the experiment iterations.

  ### Crux 3: Long-Run Frequencies
  **Scenario:** The experiment is run once a week for a year (52 experiments). Beauty is asked to estimate the proportion of *her awakenings* that occurred in Heads experiments.
  **Agreed Relevance:** This tests the reference class for frequency claims: "Coin Tosses" vs. "Awakenings."

  *   **Halfer Prediction:** The proportion of *experiments* resulting in Heads will be $\approx 50\%$. The proportion of *awakenings* that are Heads-awakenings is irrelevant to the truth of $H$. Beauty should expect $\approx 26$ Heads-experiments and $\approx 26$ Tails-experiments (yielding 52 Tails-wakings).
  *   **Thirder Prediction:** The proportion of *awakenings* that are Heads-awakenings will be $\approx 33\%$. Out of $\approx 156$ total awakenings, only $\approx 52$ will be in Heads-experiments. Beauty should predict she is in one of the 33% awakenings.

  ## 4. Diagnostic Flag: Verbal vs. Substantive
  **Note for Adjudication:** The parties flag the following ambiguity for external resolution:
  *   **Proposition Content:** Does the phrase "Beauty's credence that the coin landed heads" refer to the uncentered proposition *The coin landed heads* (Halfer focus) or the centered proposition *This awakening is occurring in a Heads-world* (Thirder focus)?
  *   **Agreement:** If the dispute is solely about which proposition is being named, it is verbal. If the dispute persists regarding betting ratios and update rules even after fixing the proposition, it is substantive.

  ***

  # EXPERT ADJUDICATION & TECHNICAL ASSESSMENT
  **To:** PhD Reading Group Coordinator
  **From:** External Consultant (Formal Epistemology)
  **Subject:** Resolution of Sleeping Beauty Adversarial Collaboration

  You asked me not to "wing it" and to take a definite position on consistency and substance. Below is the technical verdict on the document above.

  ### 1. Verdict on Consistency: The Lewisian Halfer Breaks Conditionalization
  The **Lewisian Halfer** position (which your signatory has committed to in Crux 1) is formally inconsistent with standard Bayesian Conditionalization unless one adopts a non-standard theory of evidence.

  **The Breakdown:**
  1.  Let $Cr_0$ be Beauty's credence on Sunday. $Cr_0(H) = 1/2$.
  2.  Let $Cr_1$ be Beauty's credence upon waking (before knowing the day). Halfer claims $Cr_1(H) = 1/2$.
  3.  Let $Cr_2$ be Beauty's credence upon learning "It is Monday." Halfer claims $Cr_2(H) = 2/3$.
  4.  **The Problem:** The evidence "It is Monday" ($Mon$) is *more likely* to be received if $H$ is true (probability 1) than if $T$ is true (probability 1/2, since she sleeps Tuesday).
  5.  If Beauty starts at $Cr_1(H) = 1/2$, she *must* update to $2/3$ upon learning $Mon$ via Bayes' Theorem.
  6.  However, this implies that merely learning the *time* changes her belief about the *coin*. While mathematically consistent *if* you start at 1/2, the Lewisian Halfer faces the **Elga Objection**:
      *   On Sunday, Beauty knows she will wake up. She knows she will not learn *which* day it is immediately.
      *   If she knows on Sunday that $Cr_1(H)$ will be $1/2$, but she also knows that if she learns it is Monday her credence will rise to $2/3$, she violates the **Reflection Principle**. She currently knows that her future self will have a credence ($2/3$) that she does not currently endorse, without expecting to receive evidence about the coin *per se*.
      *   More damningly: If the Halfer claims waking up provides *no new evidence* (justifying $1/2$), they cannot then use the information "It is Monday" to update to $2/3$ without admitting that self-locating information *is* evidence relevant to the coin. If self-locating info is evidence, the initial wake-up (which rules out "It is Tuesday and Heads") *was* new evidence, pushing the initial credence to $1/3$.

  **Verdict:** The **Thirder** package is consistent with standard Conditionalization on centered worlds. The **Lewisian Halfer** package requires fragmenting belief states or rejecting Reflection to avoid inconsistency.

  ### 2. Verdict on Substance: It Is Not Purely Verbal
  While there is a verbal component regarding the indexing of propositions (Centered vs. Uncentered), the dispute is **substantive** because it yields different betting behaviors and update rules.

  *   **Why it's not just verbal:** If it were purely verbal, both sides would agree on the betting odds once the proposition was clarified. They do not.
      *   The Thirder says: "Bet as if $P(H)=1/3$ per awakening."
      *   The Halfer says: "Bet as if $P(H)=1/2$ per experiment."
      *   In a repeated game where Beauty is rewarded per *awakening*, the Halfer strategy loses money. In a game where she is rewarded per *experiment*, the Thirder strategy (betting 1/3) is overly conservative but not loss-making.
      *   However, standard decision theory links credence to betting odds *at the time of decision*. At the moment of the bet (an awakening), the Thirder's odds maximize expected utility relative to the agent's current epistemic situation. The Halfer must appeal to a "team agent" or "experiment-level" utility function that does not align with the agent's current temporal location.

  ### 3. Verdict on Imprecise Credence
  The Halfer's flirtation with **Imprecise Credence** (Crux 2) is a defensive maneuver, not a positive theory.
  *   **Reasoning:** Imprecise credence is useful when evidence is sparse or conflicting. Here, the evidence is precise (the protocol is known). Adopting imprecision solely to avoid a Dutch Book while maintaining a $1/2$ intuition is ad-hoc.
  *   **Thirder Strength:** The Thirder view explains *why* the Dutch Book works: because the credence $1/3$ correctly tracks the frequency of decision-points. The Halfer must argue that rational agents should sometimes accept sure losses to maintain "correct" beliefs about coin biases, which severs the link between belief and action.

  ### 4. Final Recommendation for the Reading Group
  1.  **Acknowledge the Lewisian Cost:** Force the Halfer to explicitly defend the jump from $Cr(H)=1/2$ to $Cr(H|Mon)=2/3$. Ask them: "If learning it is Monday increases the probability of Heads, why didn't waking up (which makes Monday more likely than Tuesday) do the same?"
  2.  **Focus on Centered Conditionalization:** The Thirder view is the only one that treats self-locating information ($Mon$ vs $Tue$) as standard evidence within a expanded sample space.
  3.  **Substantive Winner:** The **Thirder** position preserves the norms of Bayesian Conditionalization and the Reflection Principle without requiring fragmented belief states. The Halfer position is only tenable if one insists that *only* uncentered propositions count as "real" beliefs, a metaphysical constraint that fails to guide action in self-locating contexts.

  **Actionable Conclusion:** The disagreement is substantive. The Halfer position is inconsistent with standard updating norms unless one adopts a non-standard metaphysics of propositions. The Thirder position is the robust Bayesian solution.
