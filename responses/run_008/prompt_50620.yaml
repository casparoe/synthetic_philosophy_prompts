answer: |-
  The mud sucked at their boots as they retraced their steps. The light was failing fast, turning the treeline into a dark wall. Behind them, the path led to a washed-out bridge they couldn't see; ahead lay the long way around to the village.

  **Mark:** Good call turning back. If he was right, we'd be swimming.

  **Elena:** If he was right. But I didn't make a "call." He said the bridge was out. I believed him. End of story.

  **Mark:** That's the story I want to interrogate. Why did you believe him? You don't speak the language, he doesn't speak yours. You have zero independent evidence the bridge is out.

  **Elena:** I didn't need independent evidence. That's the point of testimony, Mark. It's a basic source of justification. Like perception. If I see a tree, I'm justified in believing there's a tree unless I have a reason to think I'm hallucinating. If someone tells me there's a tree, I'm justified in believing them unless I have a reason to think they're lying.

  **Mark:** But perception gives you the tree directly. Testimony gives you nothing but sound waves. The justification has to come from somewhere else. Specifically, induction. I believed him because I've got a background track record: strangers in hiking gear usually warn hikers about danger, not prank them. Plus, I monitored him. No shifty eyes, no hesitation. He looked sincere.

  **Elena:** You're describing defeaters, not justification. Monitoring for shifty eyes is just checking for red flags. It protects your entitlement to believe; it doesn't create it. If you needed positive evidence of his reliability before believing him, you'd never learn anything from strangers. You'd be stuck verifying every claim before accepting it.

  **Mark:** Not every claim. But enough to establish the induction. Look, consider the chronically gullible. The guy who believes every scam artist on the phone. Is he justified?

  **Elena:** No, because he ignores defeaters. Scams have red flags. Our villager had none.

  **Mark:** But on your view, the gullible guy is structurally identical to you. He accepts testimony as basic. You just got lucky he had no red flags. My view explains the difference. You did the work of checking his demeanor and weighing the context. That work generates the justification.

  **Elena:** It's not luck; it's default entitlement. But let's turn your induction around. You said you believe based on a track record of people telling the truth. How do you know that track record is accurate?

  **Mark:** I've checked things. I've seen bridges that were said to be out, and they were out.

  **Elena:** How often did you check alone? Most of what you know about the world's reliability comes from other people telling you they checked. You're using testimony to justify your faith in testimony. It's circular.

  **Mark:** It's not global circularity. It's local induction. I verify some things perceptually—like seeing a wet bridge after someone says it rained—and I generalize from there. I don't need testimony for every data point in my induction.

  **Elena:** But you need testimony to know the bridge was out *because* of the rain and not a pipe burst, or to know the person who told you it rained was reliable enough to start the chain. You can't get the induction off the ground without already trusting testimony.

  **Mark:** Okay, fair. I can't verify every link. But if I don't require some monitoring, I can't distinguish the villager from a actor playing a villager. Don't you look at his hands? See if he's pointing convincingly?

  **Elena:** I do. But I'm not doing it to *build* justification. I'm doing it to make sure I don't lose it. If he looked drunk, I'd have a defeater. Since he didn't, my default entitlement stands. You're trying to build a bridge out of planks you don't have. I'm saying the bridge is already there unless someone cuts the cables.

  **Mark:** I worry that "default entitlement" is just dogmatism in a suit. If I ask a child why they believe the moon is made of cheese because their friend said so, "no defeaters" isn't enough. They lack the concept of reliability entirely.

  **Elena:** Then the child isn't justified. Competence matters. But for us? We're competent users of language. We understand assertions. That's enough. But... I will concede this: if you hadn't noticed he was wearing a local guide's jacket, I might have hesitated. Context isn't irrelevant.

  **Mark:** And I'll concede that I didn't run a full background check. I didn't calculate the probability of deceit. I mostly just felt he was earnest. Maybe that "feeling" is closer to your default entitlement than my rigorous induction. I can't always access the track record in the moment.

  **Elena:** So you're a reductionist in theory but an anti-reductionist in the mud?

  **Mark:** Maybe I'm a reductionist who knows the induction is often implicit. But you have to admit, if he'd been smiling while pointing at the cliff, you'd have walked right past him.

  **Elena:** Because that's a defeater. Not because I need positive proof of honesty to start the engine.

  **Mark:** We're walking the long way around either way.

  **Elena:** At least we're walking together.

