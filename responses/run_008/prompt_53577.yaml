prompt: |-
  ok so i'm a software engineer, zero formal philosophy training, and a while back I went down a 2am wiki rabbit hole about dispositions and it turns out there's this whole literature about fragile vases that don't break and poisonous things that don't poison. My rough understanding: the naive view says a disposition is just a conditional — if the thing got triggered, it would do its thing. Fragile means "would break if struck". Then people cooked up counterexamples. Finks: something intervenes at the exact moment of triggering and removes or swaps the disposition (the classic one is a vase wired up so that at the instant it's struck, electronics make it sturdy — it IS genuinely fragile the whole time before that, but it doesn't break). Masks: something blocks the path from trigger to manifestation WITHOUT touching the disposition itself, like packing foam around the vase, or a drug in your bloodstream blocking the poison's disposition to poison you (one paper apparently calls those "antidotes", which, fair). There's also a reverse thing, a mimic, where the manifestation happens with no disposition there at all. And apparently finks only killed version 1 of the conditional analysis (the simple one), while the patched version handles finks but masks are still an open problem. That distinction — fink changes the disposition when the trigger arrives, mask leaves the disposition alone and just blocks the causal chain — is the part I actually want to get right, because I've seen people on forums mix them up constantly.

  Here's what I want you to write: a parody README for a hypothetical open-source library that implements dispositions as if they were a software dependency. Treat it like the kind of README you find on GitHub for a mid-size hobby project with one slightly obsessive maintainer. Around 700 words. It should include the usual furniture — a title, some badges (make the badges quietly funny, e.g. ones claiming the library is "conditionally sound" or that all tests pass "under standard stimulus conditions"), an install snippet, a quickstart, an API section, a FAQ, and a changelog.

  The satire has to come from the actual philosophy, not from generic "docs are bad" jokes. Concretely:

  - The quickstart should show the naive conditional analysis working: a `Vase` object with `fragile=True`, you call `strike(vase)`, you get `breaks`. Life is good.
  - An event-handler class for finks (something like `Fink`) whose documented behavior is: on trigger, before the manifestation fires, it swaps out the disposition. The docs should note, deadpan, that users have reported this means the object was fragile the whole time and still didn't break — file this under known issues, not bugs.
  - A decorator or wrapper for masks (something like `@masked` or a `Mask` class) that intercepts the trigger so the manifestation never fires, while explicitly promising it does NOT modify the disposition itself. The docs should quietly concede this one is harder to argue away — the changelog should show v1.0 shipped a fix for the fink issue (the "improved analysis" that re-conditions on the disposition still being present) and then a mask issue that's still open after years, maybe with a maintainer comment thread where one person insists masks are just finks wearing a hat and someone else disagrees.
  - Somewhere (FAQ or open issues) a user-submitted mimic: the manifestation occurs with no disposition in the object, and the maintainer's visibly grumpy response.
  - One FAQ question along the lines of "isn't this all just an if-statement" with an answer that hedges more than it should.

  Rules for the piece: stay deadpan throughout — the maintainer never winks at the reader, they're sincerely proud of the library and sincerely tired of the mask issue. But the code examples should actually behave the way the philosophy says (fink alters the disposition at trigger-time, mask blocks the trigger-to-manifestation path without touching the disposition), so that someone who actually knows this literature reads it and goes "ok, this person gets it" instead of wincing. If you want to slip in the aspirin/poison or electro-vase examples from the literature, go for it, but don't attach names or dates to them — I half-remember who came up with what and I don't want the README citing people it shouldn't.

  If it helps set the tone: I want the ending effect to be that a reader who's never thought about any of this finishes the README genuinely unsure whether dispositions can be spelled out as conditionals — the changelog should feel like a losing battle report rather than a victory lap.
