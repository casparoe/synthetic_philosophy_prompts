  # disposition-py

  [![Build Passing (ceteris paribus)](https://img.shields.io/badge/build-passing%20under%20standard%20conditions-green)]()
  [![Coverage](https://img.shields.io/badge/coverage-conditional-yellow)]()
  [![Philosophy](https://img.shields.io/badge/ontology-contested-red)]()

  A robust library for modeling dispositional properties using conditional analysis. `disposition-py` allows you to define objects that *would* behave in specific ways under specific stimuli, adhering to the Simple Conditional Analysis (SCA) wherever possible.

  ## Installation

  ```bash
  pip install disposition-py
  ```

  ## Quickstart

  The naive implementation maps dispositions directly to conditionals. If the stimulus occurs, the manifestation follows.

  ```python
  from disposition import Vase, strike

  vase = Vase(fragile=True)
  strike(vase)
  assert vase.broken == True  # Works as expected
  ```

  ## Advanced Usage

  ### Finkish Interceptors

  In some environments, the disposition itself may vanish upon triggering. Use the `Fink` handler to model intrinsic changes at the moment of stimulus.

  ```python
  from disposition import Fink, strike

  class ElectroVase(Vase):
      def on_strike(self):
          # The wiring detects the strike and makes the vase sturdy instantly
          self.fragile = False 
          super().on_strike()

  vase = ElectroVase(fragile=True)
  finked_vase = Fink(wrap=vase)
  strike(finked_vase)
  assert vase.broken == False  # Known Issue: vase was fragile prior to strike
  ```

  **Note:** Users have reported that `finked_vase` retains the `fragile` property until the exact millisecond of impact. This is not a bug; it is a feature of the revised conditional analysis. The disposition existed, but the conditional failed.

  ### Masking Layers

  Masks block the causal chain between stimulus and manifestation without altering the disposition.

  ```python
  from disposition import Mask, strike

  vase = Vase(fragile=True)
  packed_vase = Mask(wrap=vase, method='foam_padding')
  strike(packed_vase)
  assert vase.broken == False 
  assert vase.fragile == True  # Disposition remains intact
  ```

  **Warning:** Masking breaks the biconditional link between `fragile` and `breaks`. We are aware. See FAQ.

  ## FAQ

  **Q: Isn't this just an if-statement?**
  A: Conceptually, yes. However, the truth conditions of the conditional do not always align with the presence of the disposition. We recommend treating the `if` as necessary but not sufficient depending on your runtime environment's ontology.

  **Q: Why did my non-fragile object break? (Issue #42)**
  A: You likely encountered a **Mimic**. External forces can produce manifestations without underlying dispositions. We currently classify this as `WONTFIX`. Do not wrap non-fragile objects in `Strikeable` interfaces if you require strict dispositional purity.

  **Q: Are Masks just Finks wearing a hat?**
  A: No. A Fink removes the disposition; a Mask preserves it. Please read the documentation before opening issues.

  ## Changelog

  ### v1.2.0 (Unreleased)
  - **Attempted** fix for Masking interference. 
  - **Reverted** after maintainer discussion #89.
  - *Comment (maintainer):* "If we condition on the mask not being present, we're just pushing the problem back. The conditional analysis still fails if the mask is intrinsic."
  - *Comment (contributor):* "Can't we just treat the mask as a fink that targets the manifestation instead of the disposition?"
  - *Comment (maintainer):* "That violates the spec. The disposition must remain constant. Leaving open."

  ### v1.1.0
  - Added `Mask` wrapper.
  - **Known Issue:** `strike()` returns `False` on masked objects despite `fragile=True`. This violates SCA. Users are advised to ignore counterexamples in production.

  ### v1.0.0
  - Initial release.
  - Implemented `Fink` handler to address cases where dispositions vanish upon stimulus.
  - Updated analysis to check disposition status *during* stimulus rather than before.
  - *Comment (maintainer):* "This solves the electro-vase case. We are confident this covers all edge cases."

  ### v0.9.0 (Beta)
  - Naive conditional analysis implemented.
  - Broke immediately upon testing with packing foam.

  ---
  *Last updated: 2 years ago. Maintenance status: Uncertain.*
