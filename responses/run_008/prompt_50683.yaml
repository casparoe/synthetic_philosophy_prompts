  hey, so I'm a phd student in philosophy (aesthetics, mostly) writing a chapter on the paradox of tragedy and i keep going back to hume's essay "of tragedy" and honestly it confuses me more every time. maybe you can help me parse it. here's the part i'm stuck on — this is hume relaying fontenelle's proposed solution (this is an 18th century text so the prose is dense):

  "It is certain, that, on the theatre, the representation has almost the effect of reality; yet it has not altogether that effect. However we may be hurried away by the spectacle; whatever dominion the senses and imagination may usurp over the reason, there still lurks at the bottom a certain idea of falsehood in the whole of what we see. This idea, though weak and disguised, suffices to diminish the pain which we suffer from the misfortunes of those whom we love, and to reduce that affliction to such a pitch as converts it into a pleasure. We weep for the misfortune of a hero, to whom we are attached. In the same instant we comfort ourselves, by reflecting, that it is nothing but a fiction: And it is precisely that mixture of sentiments, which composes an agreeable sorrow, and tears that delight us."

  (earlier in the passage fontenelle had used the tickling analogy — that the movement of pleasure pushed a little too far becomes pain, and the movement of pain a little moderated becomes pleasure.)

  ok so heres my actual question. i genuinely cannot tell if the mechanism here is supposed to be (a) a dilution/tipping model — the weak "idea of falsehood" works like a volume knob that dials the pain down until it crosses some threshold and flips into pleasure, which is what the tickling analogy and the "converts" language suggest — or (b) an additive mixture model — the sorrow stays fully sorrowful and the delight is a separate positive sentiment layered on top, which is what the "mixture of sentiments" language suggests, and which would fit with hume's own addition later in the essay about how eloquence and the energy of the writing can kind of overpower the uneasiness.

