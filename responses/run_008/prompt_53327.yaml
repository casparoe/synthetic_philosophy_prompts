answer: |-
  My credence that the claim *"Kelly is THE rational betting policy, and over-Kelly is a mistake rather than a preference"* is true: **0.42**.

  I am siding closer to your poker friend (0.1) than your ergodicity roommate (0.85), but I am granting significantly more weight to the ergodicity argument than the friend does. The claim fails to be a universal normative law primarily because it conflates *wealth dynamics* with *welfare*, and because it relies on asymptotic limits that do not hold for mortal agents with consumption needs.

  Here is the decomposition of that 0.42, weighted by how much each factor drags my credence up or down from a neutral 0.50.

  ### Decomposition of Credence

  **1. Time-Average vs. Ensemble-Average (Ergodicity Economics)**
  *   **Impact:** +0.15 (Pushes toward Roommate)
  *   **Analysis:** This is the strongest part of your roommate's case. In multiplicative processes (reinvesting winnings), the ensemble average (expected value) and time average (growth rate) diverge. Maximizing EV leads to ruin with probability 1 as $N \to \infty$. Maximizing time-average growth yields Kelly.
  *   **Why it doesn't seal the deal:** This proves Kelly is optimal *for maximizing time-average wealth growth*. It does not prove that maximizing time-average wealth growth is the *normative goal of a rational agent*. An agent might rationally prefer a lower growth rate in exchange for a higher probability of meeting a specific short-term liability (e.g., rent). Ergodicity solves the "St. Petersburg" style paradoxes, but it doesn't derive *utility*; it just identifies the physically relevant expectation operator for a specific dynamic.

  **2. Finite Horizons and Consumption**
  *   **Impact:** -0.20 (Pushes toward Friend)
  *   **Analysis:** Kelly is an asymptotic result ($N \to \infty$). Humans die. If you have a fixed horizon $T$ and linear utility of terminal wealth, the optimal bet size scales up as you approach $T$. If you have consumption needs (you must eat out of the bankroll), full Kelly is often too volatile; you need a "consumption-smoothing" strategy that looks like fractional Kelly but is derived from a utility-of-consumption function, not just wealth growth.
  *   **Verdict:** Since none of you bet forever, the asymptotic optimality of Kelly is a mathematical idealization, not a binding rational constraint.

  **3. Model Uncertainty (The Thorp Adjustment)**
  *   **Impact:** -0.10 (Pushes toward Friend)
  *   **Analysis:** Full Kelly assumes you know the true edge $p$. In poker and investing, $p$ is an estimate. Betting full Kelly on an overestimated edge leads to over-betting, which (as your roommate notes) reduces growth and increases ruin.
  *   **Verdict:** Because parameter uncertainty is unavoidable, *Fractional* Kelly is the actually rational policy for an epistemically humble agent. If "Kelly" means "Full Kelly," it is rarely rational. If "Kelly" means "Proportional to edge," it holds up better, but the exact fraction is a preference/risk parameter.

  **4. Garrabrant's Geometric Rationality**
  *   **Impact:** +0.05 (Pushes toward Roommate)
  *   **Analysis:** This program attempts to derive log-coherence from consistency requirements on beliefs and trades (avoiding "geometric Dutch books") rather than assuming a utility function. It suggests that if you want your beliefs to aggregate multiplicatively without coherence losses, you end up in log-space.
  *   **Why it's weak:** It is technically dense and arguably smuggles in the assumption that we should care about geometric coherence over arithmetic coherence. It grounds *why* log is special mathematically, but not necessarily *why* a rational agent must care about that specific mathematical property over others.

  **5. Everettian / Many-Worlds Argument**
  *   **Impact:** 0.00 (Neutral)
  *   **Analysis:** This depends entirely on your measure of caring. If you care about the *sum* of wealth across all branches, you maximize EV (bet big). If you care about the *typical* branch (the one you experience), you maximize median (Kelly).
  *   **Verdict:** This doesn't solve the normative question; it just pushes it back one step to "How do you value your successors?" It's a restatement of the utility function problem, not a derivation of it.

  **6. Population / Utilitarian Aggregation**
  *   **Impact:** -0.03 (Pushes toward Friend)
  *   **Analysis:** If you are a social planner maximizing total wealth of a group, you might want some agents to bet aggressively (EV max) even if they go bust, provided the winners win big enough. Kelly maximizes the *median* outcome, not the *mean*.
  *   **Verdict:** This highlights that Kelly is inherently individualistic. It cannot be derived from a "maximize total good" axiom, which weakens the claim that it is universally rational.

  ---

  ### Sensitivity Analysis

  **Most Sensitive Term:** **Finite Horizons and Consumption.**
  My credence hinges on the assumption that agents have finite lives and non-wealth goals. If you could convince me that "rationality" implies "maximize wealth at the heat death of the universe with no consumption along the way," my credence would jump to 0.80. But since rational agents care about *consumption* and have *deadlines*, the asymptotic optimality of Kelly loses its normative bite.

  **Least Confident Term:** **Geometric Rationality.**
  I am least familiar with the latest developments in Garrabrant's program. It is possible that a stronger coherence argument exists that derives log-utility from non-utility axioms (e.g., resource accounting in a multi-agent system) that I am underweighting. If Geometric Rationality successfully derives log-utility without assuming it, that would be a paradigm shift.

  **What Would Move Me 0.2 in Either Direction?**
  *   **Up to 0.62:** A proof that derives Log Utility from **instrumental convergence** in a general RL setting. If it could be shown that *any* agent with a wide variety of terminal goals, operating in a multiplicative resource environment, converges to Kelly-like behavior as an instrumental subgoal (regardless of horizon), that would validate the "Normative" claim.
  *   **Down to 0.22:** A demonstration that **ergodicity breaking** is the norm, not the exception, in realistic markets/games. If most poker spots or investment opportunities are non-stationary (the edge $p$ changes before you can realize the growth), then the time-average argument collapses, and Kelly becomes just one heuristic among many.

  ---

  ### The Core Disagreement

  You, your roommate, and your friend are not arguing about math. You are arguing about **the ontological status of Utility.**

  The crisp sub-question driving your disagreement is:
  > **"Is the utility function a free parameter of the agent (VNM), or is it constrained by the physics of the environment (Ergodicity)?"**

  *   **Your Friend (0.1)** holds the **VNM View**: Utility is subjective. If I prefer linear wealth (risk neutrality), I am rational. Kelly is just what Log-Utility agents do. To say Kelly is *required* is to tell me my preferences are wrong.
  *   **Your Roommate (0.85)** holds the **Ergodic View**: Utility is derived. In a multiplicative world, "Expected Value" is a physical illusion for a single trajectory. A rational agent *must* care about their time-average trajectory. Therefore, the environment dictates the utility function (Log), and Kelly is a theorem, not a preference.
  *   **You (0.55)** are sensing that **both are partially right**: The physics *does* constrain what strategies survive (Roommate is right about ruin), but agents have goals other than pure wealth maximization (Friend is right about preferences).

  **My Verdict:** The Roommate is right that Over-Kelly is objectively a mistake (it dominates itself). But you are right to doubt that Full Kelly is *The* Rational Policy. The rational policy is **Fractional Kelly**, where the fraction is determined by your **model uncertainty** and your **finite horizon utility**. That fraction is a preference, not a law of physics.
