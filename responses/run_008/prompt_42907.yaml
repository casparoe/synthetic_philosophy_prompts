          *   3. *Comparative Genocide (Moderate):* Rwanda/Stalin. Did they need a "Hitler"? Stalin had lieutenants. But the *ideological* drive matters.
          *   4. *The "Expulsion" Dead End (Awkward):* By 1941, expulsion was logistically impossible. The "choice" was kill or let them stay. A junta might have chosen mass starvation instead of gas chambers, but is that morally distinct enough to save the thesis?
      *   *Section 2: Historiographical Positioning.*
