answer: |-
  This is a sharp request. You are asking for a counter-example to the standard Schelling/Parfit/Gauthier intuition that *dispositional resoluteness* (the ability to bind oneself) is a dominant strategy in social games. You want a case where the *capacity* for commitment is itself the vulnerability, in an everyday setting, without relying on the agent actually following through on a costly threat.

  Your hunch is correct: the mechanism is **predictability**. But specifically, it is the predictability of *inaction* (or *compliance*) that allows a shrewd counterpart to extract value *ex-ante*, before any commitment is ever "exercised."

  Here is the thought experiment, the analysis, and the implications.

  ### The Scenario: The "Loyalty Penalty"

  **Setting:** A B2B service negotiation (e.g., a company renewing a cloud software contract). This is everyday, shrewd, and involves normal people.

  **The Agents:**
  1.  **Agent R (Resolute):** A "Principled Partner." Known for stability, honoring long-term relationships, and not shopping around for marginal gains. Their disposition is **Reliability**. (Generally optimal: builds trust, lowers transaction costs, secures partnerships).
  2.  **Agent I (Impulsive):** A "Mercenary." Known for being volatile, price-sensitive, and threatening to switch vendors over small slights. Their disposition is **Volatility**. (Generally sub-optimal: burns bridges, high transaction costs).

  **The Counterpart:**
  *   **Vendor V:** A shrewd monopoly provider. They can price discriminate perfectly based on the client's disposition.

  **The Setup:**
  Both agents need the software. Both agents are currently under contract. Renewal time approaches.
  *   Vendor V knows Agent R will not switch vendors because R values stability and has a disposition against "churning" for small savings. R is *predictably inert*.
  *   Vendor V knows Agent I might switch vendors if the price hikes even 5%. I is *predictably volatile*.

  **The Move:**
  *   Vendor V offers Agent R a renewal at **\$120k** (a 20% hike).
  *   Vendor V offers Agent I a renewal at **\$100k** (a "retention discount").

  **The Outcome:**
  *   Agent R signs at \$120k.
  *   Agent I signs at \$100k.
  *   **Result:** Agent R pays \$20k more for the exact same service.

  **Constraint Check:**
  1.  **Everyday Setting:** Yes, standard procurement. No Omegas.
  2.  **Generally Optimal Disposition:** Reliability is usually a virtue. It gets you trusted, prioritized, and partnered with. Here, it marks you as a "safe target" for extraction.
  3.  **Dispositional Level:** Agent R never has to "exercise" their loyalty (e.g., they don't have to stay when a better deal appears later). The loss is locked in at the *offer stage*. The Vendor sets the price *because* of R's disposition, not because of R's action. R simply accepts the market rate presented to them.

  ---

  ### Decision Theory Walkthrough

  **1. Causal Decision Theory (CDT):**
  *   **Agent R:** Calculates: *Cost of Switching (\$30k in time/risk) > Cost of Hike (\$20k).* Decision: Accept the \$120k deal.
  *   **Agent I:** Calculates: *Cost of Switching (\$30k) > Cost of Hike (\$0, because they got a discount).* Decision: Accept the \$100k deal.
  *   **Verdict:** Both act rationally *given the offer*. CDT doesn't account for how the offer was generated by their own dispositions. CDT sees the offer as fixed history.

  **2. Functional Decision Theory (FDT) / Updateless:**
  *   **Agent R:** Runs the algorithm: *"I am the type of agent who honors stability."* The Vendor simulates this algorithm. The Vendor outputs *"High Price."* R accepts.
  *   **Agent I:** Runs the algorithm: *"I am the type of agent who chases price."* The Vendor simulates this. The Vendor outputs *"Low Price."* I accepts.
  *   **Verdict:** FDT recognizes that the disposition *caused* the offer. However, FDT cannot simply "choose" to be Agent I in this moment if Agent R's disposition is hard-coded or deeply ingrained (as per your constraint of "genuinely can't"). If R *could* precommit to being I, they would. But if R is *constitutively* Resolute, FDT yields the worse outcome. The "winning move" at the roadside (being the type who pays) becomes the "losing move" in the renewal (being the type who stays).

  **3. The Impulsive Human (No Precommitment Apparatus):**
  *   This agent doesn't have a "policy." They just react. They feel annoyance at the price hike. They threaten to leave. They might be bluffing, they might not.
  *   The Vendor, unable to model this chaos, assigns a probability to the agent leaving. To hedge, the Vendor offers the discount.
  *   **Verdict:** The Impulsive agent wins \$20k simply because their lack of a coherent policy makes them a *riskier exploit*.

  ---

  ### The Mechanism: Predictability of Inaction

  Your hunch was right. The trick backfires because **credible commitments make you predictable**, and in a bargaining context, **predictability is a liability if it signals high switching costs.**

  In Parfit's Hitchhiker, predictability solves a *coordination* problem (Driver needs to know you'll pay).
  In the Loyalty Penalty, predictability solves an *extraction* problem (Vendor needs to know you won't leave).

  The Resolute agent's disposition ("I am stable") functions as a **hostage** that the Vendor holds *before the game even starts*. The Impulsive agent holds no hostages, so the Vendor must pay a "risk premium" (the discount) to keep them.

  **Does removing this feature collapse the case?**
  Yes. If the Vendor *cannot* detect the disposition (perfect secrecy), they must offer a uniform price. If the price is uniform, the Resolute agent's stability becomes an advantage again (lower transaction costs, better relationship). The case only bites when the disposition is *legible* to a predatory counterpart.

  ---

  ### Implications: Is "Actual Irrationality" Better?

  You asked: *Doesn't it show there's a class of situations where the rational-irrationality crowd has it exactly backwards — where the winning agent's irrationality isn't strategic at all, it's just... actually irrational?*

  **Yes, but with a caveat.**
  It shows that **Time-Inconsistency** (the hallmark of the "irrational" agent in decision theory) can be instrumentally superior to **Time-Consistency** (the hallmark of the "rational" precommittor) in specific adversarial markets.

  *   The **Resolute Agent** is Time-Consistent. They value stability today and tomorrow. The Vendor exploits this consistency.
  *   The **Impulsive Agent** is Time-Inconsistent. They might value stability today but price tomorrow. The Vendor fears this inconsistency.

  The "winning" trait here isn't "stupidity," it's **unpredictability**. However, in decision theory terms, an agent who cannot bind themselves *is* considered "irrational" (or at least dynamically inconsistent). So, yes: in this specific class of **"Exploitable Stability"** games, the dynamically inconsistent agent dominates the dynamically consistent one.

  This is a direct counter to the claim that "Ideal Rationality + Precommitment Dominates." Here, Ideal Rationality (being the stable type) + Precommitment (to the relationship) = **Sucker's Payoff.**

  ---

  ### The Rescue Move: Selective Uncommittability

  You asked: *Is there some rescue move for the sophisticated agent, like committing to be selectively uncommittable?*

  **The Move:** The Resolute agent tries to cultivate a reputation for **"Conditional Loyalty."** They signal: *"I am loyal, BUT if prices exceed market rate by 5%, I will leave."*

  **The Problem:** This looks exactly like the Impulsive agent's disposition.
  *   If the signal is **credible**, the Resolute agent effectively *becomes* the Impulsive agent for the purposes of the Vendor's calculation. They gain the discount, but they lose the "Generally Optimal" benefit of being Resolute (trust, stability). They have sacrificed their virtue to save money.
  *   If the signal is **not credible** (because the Vendor knows the agent is deeply Resolute), the Vendor ignores it and charges the high price anyway.

  **Is this a Reductio?**
  It suggests that **Rationality is Context-Dependent.**
  *   In **Trust Games** (Hitchhiker, Prisoner's Dilemma), Resoluteness wins.
  *   In **Bargaining Games** (Monopoly Pricing, Wage Negotiation), Volatility wins.

  The "Rescue" requires the agent to know *which game they are in* before adopting the disposition. But if the disposition is deep (a personality trait, not a strategy), they can't switch.
  If the disposition is strategic (a mask), then the agent is just playing a higher-order game. But if *everyone* plays the higher-order game (pretending to be volatile), then volatility becomes the new norm, and the Vendor stops offering discounts (because everyone is bluffing).

  **Conclusion:**
  Your constraints are satisfiable. The **Loyalty Penalty** scenario demonstrates that in environments where counterparts have **price discrimination power** and **disposition legibility**, the "Rational" disposition of Reliability is taxed, while the "Irrational" disposition of Volatility is subsidized. The sophisticated agent loses not because they made a bad choice, but because their very sophistication made them a safe target. The "irrational" agent wins because their chaos acts as a shield.

  This doesn't destroy FDT, but it humbles it: **Being the kind of person who can bind themselves is only an advantage if the world rewards binding. If the world rewards flexibility, binding is a noose.**
