prompt: |-
  Ok so context: I'm a political theory PhD student, currently in a seminar on democratic innovations, and I've noticed that every single sortition paper I read eventually falls back on the jury analogy. The move goes: we already trust randomly selected amateurs with no accountability -- jurors can't be voted out, don't face reappointment, aren't experts, and we don't think that's a crisis, in fact we think jury trials are legitimacy gold. So a legislature chosen by lot, the argument goes, is just scaling up something we already accept; anyone bothered by unaccountable randomly selected legislators should be bothered by juries too, and they're not, so the objection is fake. My sortition-friendly friend pushes this hard, especially against my other objection about career politicians -- he says the jury shows you don't need electoral accountability OR expertise, just a well-designed process and ordinary judgment.

  I want to actually audit the analogy instead of vibing about it. Can you give me the correspondence table -- what's supposed to play the role of the judge, the trial, the verdict, the lawyers, voir dire, sequestration, the appeals court -- and then tell me which disanalogies actually bite for the legislative case versus which ones are just noise. Some things I keep circling: jurors answer a question somebody else poses (the question isn't itself up for them to decide), they apply a law they didn't write, service is episodic rather than ongoing, and there's a whole professional apparatus around them doing agenda-setting and error-correction. Does the jury analogy end up quietly showing that sortition is only legitimate when it's embedded in a structure run by... a permanent political class of some kind? Which would be a hell of a concession for a movement that's also big on term limits and hates career politicians. And does anything like the appeals mechanism have a workable legislative analog, or is that just where the analogy breaks for good? Basically I want to know whether the "we already accept juries" conclusion survives once the disanalogies are on the table, or whether it was doing the load-bearing work the whole time. If it helps, frame part of it around the accountability objection specifically, since that's what the analogy is usually deployed to answer in the seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Political Theory PhD student. High level of sophistication, familiar with literature (sortition, democratic innovations, accountability, legitimacy).
      *   **Context:** Seminar on democratic innovations.
      *   **Problem:** Frustration with the ubiquitous "Jury Analogy" in sortition literature. It's used to deflect objections about accountability and expertise.
      *   **Task:** Audit the analogy. Create a correspondence table (mapping legal concepts to legislative concepts). Identify which disanalogies matter (bite) vs. noise. Address specific concerns (agenda setting, error correction, episodic vs. ongoing, the "permanent political class" concession). Evaluate the "accountability objection" specifically.
      *   **Tone:** Academic, rigorous, critical, nuanced. No fluff. Speak peer-to-peer.

  2.  **Deconstruct the Jury Analogy (The "Standard Move"):**
      *   *Premise:* Juries are randomly selected, non-expert, unaccountable (in the electoral sense), yet legitimate.
      *   *Conclusion:* Legislatures could be randomly selected, non-expert, unaccountable, and still legitimate.
      *   *Goal:* Deflect the "accountability/competence" objection to sortition.

  3.  **Drafting the Correspondence Table (Mapping):**
      *   *Jurors* $\rightarrow$ Sortition Legislators (Citizens' Assembly members).
      *   *Judge* $\rightarrow$ Who? (Speaker of the House? Bureaucracy? Constitutional Court?).
      *   *Trial/Case* $\rightarrow$ Specific Bill/Policy Proposal.
      *   *Verdict* $\rightarrow$ Vote on Legislation (Pass/Fail).
      *   *Lawyers (Prosecution/Defense)* $\rightarrow$ Advocacy Groups/Executive Branch/Opposition.
      *   *Voir Dire* $\rightarrow$ Stratified Sampling/Exclusion Criteria.
      *   *Sequestration* $\rightarrow$ Deliberative Isolation/Expert Testimony Phase.
      *   *Judge's Instructions* $\rightarrow$ Constitutional Constraints/Regulatory Impact Assessments.
      *   *Appeals Court* $\rightarrow$ Constitutional Review/Second Chamber/Referendum.
      *   *Statutes/Precedent* $\rightarrow$ Existing Law/Constitution.

  4.  **Analyzing the Disanalogies (The "Bite"):**
      *   *Scope of Decision:* Juries decide *facts* within a legal framework; Legislators decide *values/priorities* and *create* the framework. (Major bite).
      *   *Agenda Setting:* Juries don't choose the case; Legislators usually do (or must respond to a changing world). If they don't choose the agenda, who does? (The "Permanent Class" problem).
      *   *Time/Continuity:* Juries are episodic; Legislation is continuous/iterative. Implementation matters.
      *   *Error Correction:* Appeals exist for verdicts; Repealing bad laws is politically hard (path dependence).
      *   *Accountability:* Jurors are anonymous/immune; Legislators affect the future they live in (but electoral accountability is removed).

  5.  **Addressing the "Permanent Political Class" Concession:**
      *   If the Jury Analogy holds, sortition legislators need a "Judge" and "Lawyers" to function.
      *   In a legislature, "Judges" = Bureaucracy/Constitutional Courts. "Lawyers" = Lobbyists/Executive/Staff.
      *   If the sortition body is just a "Verdict" machine, the *power* shifts to those who write the "Indictments" (Agenda Setters).
      *   *Conclusion:* The analogy *does* imply a division of labor that risks empowering a permanent class (staffers, bureaucrats, agenda-setters) unless carefully designed. This validates the user's suspicion.

  6.  **Addressing the Accountability Objection:**
      *   Jury legitimacy comes from *procedural fairness* + *limited scope* + *community representation*.
      *   Legislative legitimacy requires *responsiveness* + *coordination* + *responsibility for outcomes*.
      *   The analogy works for *input legitimacy* (who decides) but fails on *output legitimacy* (what happens next).
      *   Electoral accountability isn't just about firing people; it's about signaling preference shifts over time. Juries don't do this.

  7.  **Synthesizing the Argument (The "Audit"):**
      *   The analogy is useful for *micro* legitimacy (deliberative quality) but dangerous for *macro* legitimacy (systemic authority).
      *   It survives only if we accept a "mixed constitution" where sortition is a veto chamber or a specific functionary, not the sole sovereign.
      *   If used to justify a *full* replacement of elections, it breaks down on the "Agenda/Implementation" gap.

  8.  **Refining the Output (PhD Level Nuance):**
      *   Use terms like "input/output legitimacy," "principal-agent problem," "path dependence," "mixed constitution."
      *   Acknowledge key theorists (Fishkin, Landemore, Mulgan, maybe Manin).
      *   Ensure the distinction between *adjudication* (applying norms) and *legislation* (creating norms) is central.

  9.  **Self-Correction/Review during drafting:**
