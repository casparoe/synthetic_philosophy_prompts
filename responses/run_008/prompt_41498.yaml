      *   *Check:* Is the tone right?
      *   *Fix:* Avoid being too dismissive of sortition, but be rigorous about the analogy's limits.

  10. **Final Polish:** Structure with clear headings. Ensure the correspondence table is sharp. End with a decisive verdict on whether the analogy survives. (Proceed to generate response).

  *(Self-Correction Note)*: I need to be careful not to just say "it fails." The user wants to know *where* it bites. The analogy is strong for *deliberative legitimacy* but weak for *authorizational legitimacy*. I should make that distinction clear. Also, the "Judge" role in legislation is tricky—is it the bureaucracy? The Constitution? I need to specify that ambiguity is part of the problem.

  *(Final Plan)*:
  1.  Intro: Validate the frustration (it's a "theoretical shortcut").
  2.  Correspondence Table.
  3.  The Three Critical Disanalogies (Norm Creation vs. Application, Agenda Power, Time/Implementation).
  4.  The "Permanent Class" Concession (The Staffer/Bureaucrat problem).
  5.  The Accountability Specifics (Retrospective vs. Procedural).
  6.  Verdict: Does it survive? (Only as a mixed system, not a total replacement).
  7.  Closing thought for the seminar.

