answer: |-
  This is a sharp observation. In the sortition literature (from Callenbach/Phillips to Landemore to Mulgan), the jury analogy is indeed the "get out of jail free" card for the accountability/competence objection. It functions as a *legitimacy transference* mechanism: because we accept the legitimacy of the former, we should accept the latter.

  But as you've spotted, it smuggles in a specific conception of politics as *adjudication* rather than *creation*. If you audit the analogy rigorously, it doesn't necessarily kill sortition, but it does force a major concession: **sortition works best as a veto chamber or a specific functionary within a mixed constitution, not as a sovereign replacement for elections.**

  Here is the audit you asked for.

  ### 1. The Correspondence Table

  To test the analogy, we have to map the institutional ecology of the courtroom onto the legislature. The problem is that many roles in the courtroom have no clear democratic equivalent, or their equivalents are the very "career politicians" sortitionists want to displace.

  | Legal Concept | Sortition Legislative Analog | Function |
  | :--- | :--- | :--- |
  | **The Jurors** | **Sortition Legislators** (Citizens' Assembly) | Randomly selected body rendering a verdict. |
  | **The Verdict** | **Pass/Fail on Legislation** | Binary decision (mostly) on a proposal. |
  | **The Case/Indictment** | **The Bill/Policy Proposal** | The specific question to be decided. |
  | **The Judge** | **?** (Speaker? Bureaucracy? Constitutional Court?) | Rules on procedure, admissibility, constitutionality. |
  | **The Lawyers** | **Advocates** (Executive branch, Lobbyists, Staff) | Frame the arguments, present evidence. |
  | **Voir Dire** | **Stratified Sampling** | Ensuring descriptive representation/excluding bias. |
  | **Jury Instructions** | **Constitutional/Regulatory Constraints** | The legal boundaries within which the verdict must fall. |
  | **Witnesses/Experts** | **Expert Testimony Phase** | Informing the body (controlled by "Lawyers/Judge"). |
  | **Sequestration** | **Deliberative Isolation** | Protection from outside lobbying/corruption. |
  | **Appeals Court** | **?** (Second Chamber? Judicial Review? Referendum?) | Mechanism to correct errors or unconstitutional outcomes. |
  | **Statutes/Precedent** | **Existing Law/Constitution** | The framework the verdict operates within. |

  ### 2. The Three Disanalogies That Bite

  Most disanalogies are noise (e.g., jurors sit in a room, legislators might not). But three structural disanalogies undermine the claim that sortition legislators can operate *without* electoral accountability or expertise.

  #### A. Adjudication vs. Norm Creation (The "Law" Problem)
  *   **The Analogy:** Jurors apply existing law to facts.
  *   **The Reality:** Legislators *create* the law.
  *   **Why it Bites:** A jury's legitimacy rests on the fact that they are *bound* by the judge's instructions and the statutory code. They are not asked, "What should the law be?" but "Did the defendant break it?"
  *   **The Implication:** If sortition legislators are like jurors, they must be bound by a pre-existing normative framework (a Constitution + detailed statutory guidance). If they are *writing* the framework from scratch, they are acting as sovereigns, not jurors. If they are sovereigns, the jury analogy fails to answer the accountability objection, because jurors are not accountable *because* they are not sovereign.
  *   **The Concession:** To make the analogy hold, sortition bodies must be **limited mandate bodies** (e.g., they can only vote yes/no on bills drafted elsewhere, or only on specific constitutional amendments). If they have open agenda-setting power, they are no longer "jurors."

  #### B. Agenda Power (The "Indictment" Problem)
  *   **The Analogy:** Jurors do not choose the trial. The State (Prosecutor) brings the case.
  *   **The Reality:** Legislatures must decide what to legislate.
  *   **Why it Bites:** In a trial, the power lies heavily with the Prosecutor (who chooses charges) and the Judge (who allows evidence). If sortition legislators are "jurors," **who is the Prosecutor?**
  *   **The Implication:** If the sortition body cannot set its own agenda, agenda power falls to the "permanent class" (bureaucrats, executive branch, committee staff). This validates your suspicion: the jury analogy *requires* a permanent political class to frame the questions. The sortition body becomes a rubber stamp or a veto point, not a governing engine.
  *   **The Concession:** Sortition cannot replace the "agenda-setting" function of elections without collapsing the analogy. Elections aggregate preferences to determine *what* we fight about; juries only resolve *how* we resolve a specific fight.

  #### C. Error Correction and Time (The "Appeals" Problem)
  *   **The Analogy:** Verdicts can be appealed; errors are corrected by a higher court applying legal standards.
  *   **The Reality:** Bad laws create path dependence; repeal is harder than passage.
  *   **Why it Bites:** An appeals court reviews procedure and law application. There is no "Legislative Appeals Court." Judicial review is limited to constitutionality, not wisdom. If a sortition legislature passes a disastrous budget, there is no mechanism to "appeal" it other than a new legislative session.
  *   **The Implication:** Electoral accountability functions as a *retrospective appeal mechanism* ("you messed up, you're out"). Jury immunity works because the stakes are individual (one defendant), not systemic (the whole economy).
  *   **The Concession:** Without an "appeals" mechanism (like a strong second chamber or robust judicial review), the lack of electoral accountability in a sortition legislature is far more dangerous than in a jury room.

  ### 3. The "Permanent Class" Concession

  You asked: *Does the jury analogy end up quietly showing that sortition is only legitimate when it's embedded in a structure run by... a permanent political class?*

  **Yes.** This is the critical theoretical cost of the analogy.

  If the sortition legislators are "jurors," they require:
  1.  **Judges:** To rule on order and constitutionality (Constitutional Court / Speaker).
  2.  **Clerks/Staff:** To manage the process (Bureaucracy).
  3.  **Prosecutors/Defense:** To frame the options (Executive / Lobbyists / Policy Entrepreneurs).

  In the current electoral system, the "Lawyers" and "Judges" are also elected or politically appointed, creating a chain of accountability. In the Jury Model of Sortition, the **agenda-setters become the unaccountable power center.**

  This creates a "Staffer State." If the Citizens' Assembly can only vote on bills drafted by a permanent civil service (because amateurs can't draft complex tax code), the real power shifts to the drafters. The sortition body becomes a legitimating veneer for bureaucratic rule. This is the exact opposite of the "anti-careerist" goal of many sortition advocates.

  ### 4. Auditing the Accountability Objection

  Your friend argues: *Jurors aren't accountable, yet legitimate. So accountability isn't necessary.*

  Here is how you dismantle that in seminar:

  **1. Input vs. Output Legitimacy**
  *   **Juries:** Rely on *Input Legitimacy* (descriptive representation + procedural fairness). We trust the verdict because the *process* was fair, not because the jurors are responsive to public opinion.
  *   **Legislatures:** Require *Output Legitimacy* (results + responsiveness). Laws affect everyone, forever. If a jury gets it wrong, one person goes to jail (and can appeal). If a legislature gets it wrong, a million people lose healthcare.
  *   **The Bite:** Electoral accountability is not just about punishment; it is a **feedback loop**. It signals preference shifts. Juries are designed *not* to be responsive to public opinion (that's why they are sequestered). Legislatures *must* be responsive to public opinion to maintain stability. A sortition legislature sequestered from electoral pressure risks becoming unmoored from the citizenry's evolving will.

  **2. The Scope of Discretion**
  *   **Juries:** Discretion is bounded by law and facts.
  *   **Legislators:** Discretion is bounded only by politics and resources.
  *   **The Bite:** We trust jurors *because* their discretion is limited. If you give sortition legislators the full discretion of an electoral house, you have removed the primary safeguard (limited scope) that makes jury immunity acceptable.

  **3. The "Appeals" Analog**
  *   You asked if there is a workable legislative analog to appeals.
  *   **Option A: Bicameralism.** A second chamber (perhaps elected?) acts as the "appeals court." But this admits sortition isn't sufficient on its own.
  *   **Option B: Judicial Review.** Expanding courts to review "rationality" not just constitutionality. This risks juristocracy.
  *   **Option C: Retrospective Referendum.** Citizens can petition to repeal laws passed by the sortition body. This restores accountability but adds complexity.
  *   **Verdict:** Without one of these, the "no accountability" feature of juries becomes a bug, not a feature, in legislation.

  ### 5. Final Verdict for the Seminar

  The jury analogy survives **only if** you treat sortition as a **mixed constitution element**, not a total replacement.

  *   **It works for:** A "Second Chamber" of review, a Constitutional Convention, or a specific veto body on ethical issues (e.g., abortion, electoral boundaries). Here, the "Juror" role fits: they are reviewing a specific question within bounds set by the sovereign people.
  *   **It fails for:** A unicameral, sovereign legislature. Here, the lack of agenda control, the lack of an appeals mechanism, and the shift of power to bureaucratic "drafters" makes the lack of electoral accountability dangerous.

  **The "Hell of a Concession":**
  If your friend insists on the jury analogy, force them to accept the **corollary institutional design**:
  1.  Sortition legislators cannot draft bills (they vote yes/no).
  2.  Agenda power must reside elsewhere (who?).
  3.  There must be a robust "appeals" mechanism (Judicial Review or Referendum).

  If they accept this, they have conceded that sortition cannot stand alone and requires a permanent class (to draft/aggregate) and strong counter-majoritarian institutions (to appeal). This undermines the "pure democracy" claim often made by sortition advocates.

  **Suggested Move:**
  Tell your friend: *"The jury analogy proves that random selection is legitimate for **judgment**, but not for **agency**. Jurors judge; they do not act. If we want sortition legislators to act, we need electoral accountability. If we want them to judge, we need to strip them of agenda power. You can't have it both ways."*

  This forces the debate onto the distinction between *will* (elections) and *judgment* (sortition), which is where the actual theoretical work should be happening, rather than hiding behind the jury shield.
