      *If you count branches, Game 1 (50% win) is better than Game 2 (33% win).
      *But physically, the "Down" amplitude was just split. You shouldn't care.*
      *This is the winner.* This demonstrates the arbitrariness of branch counting without needing to simulate "probability."

      *Revised Plan:*
      1.  **Round 1:** Simple Split. (2 branches).
      2.  **Round 2:** The "Null Measurement" Split. (3 branches, but one path is physically null).
      3.  **Reveal:** The physics was the same.
      4.  **Discussion:** Why did you value them differently?

      *Wait, I need to make sure they actually value them differently.* I need to ask them to *price* the gamble. "How many points would you pay to play?"
      *Okay, let's write it.*

      *(Final check on constraints)*: 14 students, 90 mins. Advanced undergrads.
      *Tone:* Rigorous but playable.

      *(Limitations Section)*: Be honest. The game uses classical randomness to simulate quantum branching. This is the "Probability Smuggling" objection. I must highlight this.

      *(Let's assemble the response.)*
answer: |-
  Here is a complete lesson plan designed for your 90-minute session. It centers on a decision game called **"The Branching Auction,"** followed by a structured debrief connecting the gameplay to the philosophical literature.

  # Lesson Plan: The Everettian Probability Problem
  **Time:** 90 Minutes
  **Students:** ~14 Advanced Undergraduates
  **Materials:** 30 Envelopes (two colors), Poker Chips/Tokens (20 per student), Whiteboard.

  ## Part 1: Setup & Rules (10 Minutes)
  **The Metaphor:** Explain that the classroom is simulating an Everettian multiverse.
  1.  **The Agent:** Each student is a "Pre-Branch Agent."
  2.  **The Successors:** When a measurement occurs, the student does not *become* one outcome; they *split* into successors.
  3.  **The Payoff:** Since all outcomes happen, we cannot pay only one successor. Instead, we define the **Agent's Value** as the *average utility* of their successors. (Note: This is a specific stipulation to make the game playable; we will critique it in the debrief).
      *   *Why Average?* If we used *Total* utility, students would always prefer more branches regardless of payoff, which trivializes the game. If we use *Average*, they must weigh payoff against branch count.
  4.  **Currency:** Students start with 100 Points. They will bid Points to enter gambles.
  5.  **The Mechanism:** You (the Instructor) are the "Universal Wavefunction." You hold envelopes representing orthogonal branches. You will distribute them to the room to represent the student's successors.

  ## Part 2: The Game (45 Minutes)

  ### Round 1: The Calibration (15 Minutes)
  **Scenario:** A "Quantum Coin" (Spin-Z measurement on an eigenstate of X).
  **Physics:** Amplitude for Up = $\sqrt{0.5}$, Amplitude for Down = $\sqrt{0.5}$.
  **Branching Structure:** You announce: "The decoherence basis selects 2 orthogonal branches."
  **Setup:**
  *   You hold 2 Envelopes: One Red (Win), One Blue (Lose).
  *   **Payoff:** Red = 20 Points, Blue = 0 Points.
  *   **Mechanism:** The student places a bid. If they play, you hand 1 Red and 1 Blue envelope to two different students (or designate two "successor seats" for the player).
  *   **Calculation:** 1 Win + 1 Loss. Average Payoff = 10 Points.
  *   **Task:** Ask students to write down the maximum points they would pay to enter this gamble.
  *   **Expected Result:** Most will bid around 10. Branch Counting (1/2 win) and Born Weighting (0.5 weight) coincide.

  ### Round 2: The Fine-Graining Trap (20 Minutes)
  **Scenario:** A "Biased" setup that is physically equivalent to Round 1.
  **Physics:** You announce: "The physical amplitude is identical to Round 1 ($\sqrt{0.5}$ / $\sqrt{0.5}$). However, the environmental decoherence in the 'Down' sector is more complex, splitting that sector into 9 orthogonal sub-branches."
  **Branching Structure:**
  *   **Up Sector:** 1 Branch (Red Envelope, 20 Points).
  *   **Down Sector:** 9 Branches (Blue Envelopes, 0 Points).
  *   **Total Branches:** 10.
  **Payoff:** Red = 20 Points, Blue = 0 Points.
  **Task:** Ask students to write down the maximum points they would pay to enter *this* gamble.
  **The Conflict:**
  *   **Born Ruler:** The amplitude for Winning is still 0.5. The average utility (weighted by amplitude) is still 10 Points.
  *   **Branch Counter:** There are 10 branches. Only 1 wins. The "frequency" of winning successors is 10%. The average utility (unweighted) is 2 Points.
  **Action:** Collect the bids. You will likely see a split. Some will bid ~10 (ignoring the split), others will bid ~2 (counting branches).

  ### Round 3: The Dominance Challenge (10 Minutes)
  **Scenario:** Present two gambles side-by-side.
  *   **Gamble A:** 1 Win Branch (20 pts), 1 Loss Branch (0 pts).
  *   **Gamble B:** 1 Win Branch (20 pts), 2 Loss Branches (0 pts).
  *   **Stipulation:** Tell them the "Win" amplitude is identical in both. The extra Loss branch in B is a "null measurement" on a degree of freedom that doesn't affect the payoff.
  **Task:** Ask: "Who strictly prefers A over B?"
  **The Trap:** If they prefer A, they are valuing the *number of losers* over the *physics of the winner*.
  **The Reveal:** Ask a student defender of Branch Counting: "If I perform a measurement on a distant star that splits the 'Loss' branch into a trillion pieces, does your gamble suddenly become worthless?"
  **Goal:** Make them feel the absurdity of branch counting depending on arbitrary remote events.

  ## Part 3: Eliciting Principles (10 Minutes)
  Ask the students to articulate the rule they used. Write these on the board:
  1.  **Principle of Indifference:** "I treat every successor copy as equally 'me'." (Leads to Branch Counting).
  2.  **Principle of Amplitude:** "I care more about successors with higher measure." (Leads to Born Rule).
  3.  **Principle of Physics:** "I shouldn't care about how many envelopes you use, only the wavefunction."

  Ask the Branch Counters: "How do you define a 'branch'? Is it the envelopes I used? What if I used 100 envelopes for the Win side?"
  *This forces them to admit that 'branch count' is not a physical invariant.*

  ## Part 4: Structured Debrief (25 Minutes)

  ### 1. Mapping the Game to Literature
  *   **The Round 1/2 Divergence:** Connect this to **David Albert's** criticism. Branch counting is ill-defined because the number of branches depends on the choice of basis (the "envelopes" I chose). In the formalism, there is no discrete "count" of worlds, only a continuous distribution of amplitude.
  *   **The Dominance Challenge:** Connect to **David Wallace's Equivalence Principle**. If two quantum games involve the same physical payoffs and amplitudes, a rational agent must value them equally, regardless of how many "branches" the macroscopic description suggests. Round 3 showed that Branch Counting violates this.
  *   **The Decision Theory Argument:** Briefly explain the **Deutsch-Wallace Theorem**. It argues that if you accept the axioms of rational decision theory (e.g., ordering, diachronic consistency) within a branching universe, you are *mathematically forced* to maximize Born-weighted utility. The game showed *why* we need those axioms: without them (i.e., if you just count branches), you make decisions sensitive to arbitrary fine-graining.
  *   **Self-Locating Uncertainty:** Address the **Sebens/Vaidman** view. In the game, you knew the setup beforehand. In real Everett, between the measurement and the observation, there is a period of "self-locating uncertainty." Some argue this uncertainty justifies using probabilities, but the game highlights that this uncertainty is not classical ignorance (since all outcomes occur).

  ### 2. Addressing the "Smuggling" Objection
  Be transparent with the class:
  *   **The Proxy Problem:** "In this game, I used envelopes and randomness to assign successors. This smuggles in classical probability. In real Everett, there is no randomness; there is only deterministic branching."
  *   **The Payoff Problem:** "We used 'Average Utility' to calculate scores. Why not 'Total Utility'? If you sum the utility of all successors, Branch Counting *would* be rational (more branches = more total good). But Everettians argue we care about the *measure* of our existence, not the sum of all existences. The game stipulated 'Average' to force the conflict, but in reality, this is the very thing we are trying to derive."
  *   **The Lesson:** The game isn't a proof of the Born Rule. It is a *reductio ad absurdum* of the Branch Counting Rule. It shows that if you treat branches as countable discrete objects, your decisions become unstable under trivial physical changes.

  ## Part 5: Predictable Failures & Limitations (Instructor Notes)

  When you run this, expect the following friction points. Acknowledging them strengthens the lesson.

  **1. The "Classical Ignorance" Slide**
  *   **What will happen:** Students will treat the envelopes as "I don't know which one I'll get." They will revert to standard Laplacean probability.
  *   **Why it matters:** This misses the Everettian point. In Everett, I *do* know which one I'll get: I get all of them.
  *   **Fix:** Constantly reiterate: "You are not one person picking an envelope. You are the Wavefunction. All envelopes are opened. All successors exist. Why do you value the Red one more than the Blue one if both happen?"

  **2. The "Who Cares?" Objection**
  *   **What will happen:** A student will say, "If all my successors get paid, why am I betting? I win in total."
  *   **Why it matters:** This touches on the **Personal Identity** problem. If I am the sum of my successors, Branch Counting is correct.
  *   **Fix:** Remind them of the **Stakes**. "You are betting your *pre-branch* points. You want to maximize the value of the decision you make *now* for the sake of the future structure. If you accept a bad bet because 'someone wins,' you are acting irrationally from the pre-branch perspective."

  **3. The "Smuggled Probability" Critique**
  *   **What will happen:** Sharp students will notice that by handing out envelopes randomly, you are simulating a single-world chance process.
  *   **Why it matters:** This is the strongest philosophical objection to classroom proxies. You cannot simulate "All outcomes happen" in a single-world classroom without using single-world randomness to assign roles.
  *   **Fix:** Concede this. "You are right. This game uses classical randomness to *represent* branching measure. We cannot escape this in a classroom. But notice: even with this proxy, the *Branch Counting* strategy led you to value physically identical scenarios differently (Round 1 vs Round 2). That inconsistency holds even if the proxy is imperfect."

  **4. The "No Risk" Problem**
  *   **What will happen:** Students won't feel anxiety. In real life, we fear death. In Everett, "death" only happens in some branches.
  *   **Why it matters:** The **Practical Problem**. Why do we act as if death is certain when it's only partial?
  *   **Fix:** End the class with this question. "If you played Quantum Russian Roulette (1 branch live, 100 branches dead, equal amplitude), would you play? If you say no, you are using the Born Rule. If you say yes, you are a Branch Counter. Why does 'no' feel right?"

  ## Summary for the Instructor
  This lesson does not solve the Probability Problem (nobody has). Instead, it makes the problem *visceral*.
  1.  **Round 1** lulls them into safety (Counting = Weighting).
  2.  **Round 2** breaks the link (Counting != Weighting).
  3.  **Round 3** shows the cost (Counting violates physical equivalence).
  4.  **Debrief** admits the proxy's flaws while cementing the philosophical tension.

  The goal is not for them to leave believing the Born Rule is proven, but to leave understanding why **Naive Branch Counting is untenable** for a rational agent in a branching universe.
