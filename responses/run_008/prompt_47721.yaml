answer: |-
  **Essay Question**

  Mechanistic anomaly detection (MAD) promises to flag deceptive alignment or backdoors by monitoring internal mechanisms rather than inputs. However, its efficacy depends entirely on the criterion used to individuate mechanisms. Critically evaluate the functional-role criterion against the overlap criterion in this context. Specifically: (1) explain how the choice between them dictates the trade-off between false positives (flagging benign variation) and false negatives (missing deceptive mechanisms); (2) argue whether a functional account can avoid collapsing into mere behavioural similarity, rendering the monitoring redundant; and (3) assess whether the analogy to multiple realizability in philosophy of mind is load-bearing or misleading, given that neural networks are designed artefacts subject to intervention.

  ***

  **Model Answer**

  Mechanistic anomaly detection (MAD) aims to secure AI deployment by distinguishing benign operation from deceptive strategising via internal monitoring. However, this technique is metaphysically loaded: it presupposes a criterion for mechanism identity. The choice between an overlap criterion (type-identity) and a functional-role criterion (functionalism) is not merely academic; it deterministically shapes the safety profile of the monitor by governing the trade-off between false negatives and false positives.

  The overlap criterion, which identifies mechanisms by shared physical components or activation patterns, is too coarse for safety-critical contexts. A deceptively aligned model may strategically reuse the majority of an honest model's circuitry to evade detection while embedding a latent backdoor. If mechanism identity is defined by component overlap, the monitor will classify this dangerous deviation as 'normal' operation because the substrate remains largely unchanged. This yields an unacceptable rate of false negatives: genuinely distinct, dangerous algorithms pass as benign simply because they are housed in familiar weights. Consequently, a type-identity approach privileges structural continuity over computational integrity, rendering MAD useless against sophisticated adversarial adaptation.

  Conversely, the functional-role criterion offers greater granularity but risks collapsing into behavioural similarity. If two processes are deemed identical because they fulfil the same input–output role, internal monitoring becomes redundant; one could simply observe the output. For MAD to remain distinct from behavioural testing, 'functional role' must be defined causally within the network's intermediate layers, not merely at the boundaries. We must require that the mechanism computes the answer via the same *internal* causal pathway, not just that it arrives at the same result. For instance, genuine arithmetic and memorised lookup may share an input–output profile, but they play different causal roles regarding intermediate representations. Unless the functional criterion is tightened to specify these internal causal dependencies, it fails to justify the computational cost of interpretability tools.

  This tension illuminates the limits of the philosophy of mind analogy. Proponents suggest that just as pain may be multiply realised in octopuses and mammals, a 'correct' mechanism may be realised across different activation patterns. While suggestive, this analogy is ultimately misleading regarding safety. Biological minds are natural kinds where we lack ground-truth access to underlying mechanisms; functionalism is a necessary concession to epistemic limitation. Neural networks, however, are designed artefacts. We possess white-box access and can perform causal interventions that are impossible in biological systems. We are not forced to rely on functional proxies because we can directly inspect causal structure.

  Therefore, the analogy obscures a crucial advantage: because we can intervene, we should prefer a causal-interventionist criterion over pure functionalism. We can verify whether upstream perturbations propagate identically, distinguishing genuine algorithmic stability from superficial functional equivalence. Relying on the PoM analogy might tempt us to accept multiple realizability where we should demand causal invariance. For MAD to deliver on its safety promises, it must reject the coarse overlap criterion to avoid false negatives, but also reject a loose functionalism that collapses into behavioural monitoring. Instead, it must adopt a granular causal account that leverages the unique intervenability of artificial networks to distinguish algorithmic identity from mere output coincidence.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Safety Trade-off Analysis (4 marks)**
  *   **Award:** Clear explanation that criterion granularity dictates false positive/negative rates (coarse = missed threats; fine = usability loss).
  *   **Common Failure:** Describing the criteria without linking them to the operational success or failure of the safety monitor (treating it as pure metaphysics).

  **2. Critique of Overlap Criterion (4 marks)**
  *   **Award:** Identifies that component reuse allows deceptive models to evade detection (false negatives), making overlap insufficient for safety.
  *   **Common Failure:** Accepting component overlap as a valid proxy for mechanism identity without considering adversarial reuse of circuits.

  **3. Functionalism vs. Behavioural Collapse (4 marks)**
  *   **Award:** Argues that functionalism must define role via *internal* causal pathways, not just I/O, to avoid making monitoring redundant.
  *   **Common Failure:** Failing to distinguish internal functional role from external behaviour, thereby missing the point that MAD would become unnecessary if collapsed.

  **4. Philosophy of Mind Analogy Assessment (4 marks)**
  *   **Award:** Argues the analogy is misleading because NNs are intervenable artefacts (white-box), unlike biological minds (black-box), justifying stricter causal criteria.
  *   **Common Failure:** Treating the analogy as strictly parallel or load-bearing without noting the epistemic difference granted by engineering access.

  **5. Synthesis and Recommendation (4 marks)**
  *   **Award:** Concludes that a causal-interventionist criterion is superior for safety, leveraging intervenability to avoid both component chauvinism and behavioural collapse.
  *   **Common Failure:** Remaining agnostic or summarising the three criteria without taking a normative stance on which best serves the safety goal.

  **Grading Note:** To achieve an **A (16–20)**, the student must explicitly connect the metaphysical choice to the safety outcome (Point 1) and identify the specific epistemic advantage of NNs over brains that undermines the PoM analogy (Point 4). A **B (12–15)** will accurately rehearse the criteria and the analogy but will likely treat the safety implications as secondary or fail to resolve the behavioural collapse worry convincingly.
