  Dear Friend,

  It is a pleasure to engage with your ideas, and I have constructed the scenario you requested to test the divergence of your three tests. The Maplewood City Council is voting on converting Elm Street, a residential thoroughfare in the North District, into a one-way road to speed up bus traffic, a decision that legally binds only the drivers using Elm Street and the property owners whose access is formally altered while granting the councilors authority to enact the change regardless of their residence. Councilor Jenkins, who represents the South District and lives ten miles from Elm Street without owning property or commuting near it, casts a vote as a member of the body. Mrs. Gable, a daily commuter who drives past the entrance of Elm Street to reach the highway, will experience a minor delay at the intersection if the change passes, touching her routine, but she can easily switch to a parallel road with no extra time. Mr. Henderson, a tenant living in a house on Elm Street with a non-transferable lease and no car, relies on the street's current layout for his caregiver's access, and moving would cost more than his annual income, yet he is not a driver subject to traffic fines nor a council member.

  When we apply your tests to this situation, the groups enfranchised shift significantly. Under the footprint test, both Mrs. Gable and Mr. Henderson get a vote because the decision touches their lives, the former through a minor delay and the latter through caregiver access, while Councilor Jenkins is left out because the consequences of the traffic pattern do not reach his daily existence. Under the rule test, only Councilor Jenkins gets a vote because he is inside the decision-making body, whereas Mrs. Gable and Mr. Henderson are excluded because neither is legally bound by the traffic enforcement nor holds a seat on the council. Under the cornered test, only Mr. Henderson gets a vote because he is the only one who cannot realistically avoid the effects without paying a prohibitive cost, while Mrs. Gable is excluded for having an easy exit route and Councilor Jenkins is excluded for facing no burden to avoid.

  The single feature doing the work of pulling these tests apart is the separation of authority, casual impact, and inescapable burden among three different parties. In many boring cases, these three qualities overlap because the people making the rules live where the rules are enforced and cannot easily move away, but here we have disentangled them by introducing a distant decision-maker, a transient observer, and a trapped resident. If you remove this feature by imagining a scenario where the councilors live on Elm Street, the commuters live on Elm Street, and everyone owns their homes, the disagreement collapses; all three tests would then enfranchise the same group because everyone would be a member, everyone would be touched, and everyone would be cornered by their property ownership.

  My honest verdict is that your cornered test emerges from this case looking quite sensible, perhaps even more so than the footprint test in this specific instance. It successfully identifies Mr. Henderson as the person with the most urgent claim to a vote, excluding Mrs. Gable whose inconvenience is trivial and avoidable, while the footprint test dilutes the vote by including her alongside him. However, a defender of the footprint test might argue that your cornered test gets wrong the principle of equal autonomy, claiming that Mrs. Gable's preference should count simply because she is a moral agent whose time was touched, regardless of whether she could have avoided it. They would say that making voting rights dependent on exit costs privileges the poor or trapped over the mobile, potentially creating a system where only those who cannot leave get a say, which might discourage the community from considering the preferences of those who have options. Nevertheless, for distinguishing between significant stakes and trivial nuisances, your cornered test performs robustly here.
