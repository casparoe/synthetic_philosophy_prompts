answer: |-
  Here is a prioritization of your candidate topics, ranked by their potential to generate a high-quality, 15-page term paper that leverages your philosophy of mind background without getting bogged down in intractable metaphysics or exhausted debates.

  ### 1. The Attitudinal Collapse (Highest Priority)
  **The Question:** Does attitudinal hedonism (AH) collapse into desire-satisfactionism (DS)? If pleasure is just a "pro-attitude" toward a state of affairs, what distinguishes *taking pleasure in X* from *desiring X*?
  **Rank:** **A-Tier (The Core Stability Test)**

  *   **Why it's #1:** This is the most "upstream" question for the viability of modern hedonism. If AH collapses into DS, then hedonism loses its distinct claim (that *phenomenology* or *feeling* matters) and inherits all the problems of desire theory (e.g., the problem of uninformed desires, malicious desires). Solving this clarifies whether "hedonism" is even a stable category anymore.
  *   **Phil of Mind Leverage:** This is pure intentional analysis. You can use the distinction between **direction of fit** (belief-like vs. desire-like) or the distinction between **occurrent vs. dispositional** states.
      *   *Specific Angle:* Look at the "Liking vs. Wanting" distinction in affective neuroscience (Kent Berridge). You can argue that AH tracks "liking" (consummatory reward) while DS tracks "wanting" (incentive salience). This gives you a non-circular way to distinguish the attitudes without just pointing at a "feeling."
  *   **Tractability:** High. You can define the terms, present the collapse objection (e.g., from Heathwood or Feldman), and offer a distinction based on intentional mode or functional role.
  *   **Risk:** You must ensure you don't drift into a general comparison of well-being theories. Keep it focused on the *definition of pleasure*.

  ### 2. The Non-Circularity of "Hedonic Tone" (Second Priority)
  **The Question:** Can the phenomenal view specify a common quality of pleasure without defining it trivially as "whatever feels like pleasure"?
  **Rank:** **B+ Tier (Best Fit for Your Background)**

  *   **Why it's #2:** This plays directly to your strengths. The standard objection is that "hedonic tone" is a placeholder. To defend it, you need an independent characterization of that tone.
  *   **Phil of Mind Leverage:** Don't just do phenomenology; do **cognitive science of affect**.
      *   *Specific Angle:* Argue that the common property isn't a "qualia blob" but a specific **interoceptive predictive signal** (predictive processing models) or a specific dimension of emotional space (e.g., core affect/valence). If you can argue that "pleasantness" is a specific computational or physiological marker (e.g., dopamine-mediated reward prediction error), you bypass the Sidgwickian worry that the *contents* are too different. The *mechanism* is the commonality.
  *   **Tractability:** Moderate. It requires bridging normative ethics with empirical mind science. You risk getting bogged down in the science, so keep the philosophical payoff clear: "If valence is a unified neural dimension, Sidgwick is empirically wrong."
  *   **Risk:** The "So What?" problem. Even if there is a unified neural signal, why does *that* constitute well-being? You need to link the metaphysics to the normativity briefly.

  ### 3. The Generalization Argument (Third Priority)
  **The Question:** Does desire-satisfactionism face a mirror-image heterogeneity problem (i.e., satisfied desires are just as heterogeneous as pleasures)?
  **Rank:** **B- Tier (Strong Dialectical Move, but Defensive)**

  *   **Why it's #3:** This is a "tu quoque" argument. If successful, it dissolves the heterogeneity problem as a specific objection to hedonism, turning it into a general problem for well-being theories.
  *   **Phil of Mind Leverage:** Focus on the **content of representational states**. Desires represent states of affairs. Are the contents of "I want water" and "I want justice" heterogeneous? Yes. Does that matter?
  *   **Tractability:** High, but it eats page count. You have to explain desire theory well enough to show the parallel.
  *   **Risk:** It's defensive. It shows hedonism isn't *worse* than the competition, but it doesn't show hedonism is *right*. For a term paper, positive construction (Topics 1 & 2) usually scores better than negative defense. Also, desire theorists have ready replies (e.g., the unity is in the *satisfaction condition*, not the content).

  ### 4. The Hard Problem Localization (Do Not Touch)
  **The Question:** Is the heterogeneity problem just the Hard Problem of Consciousness localized to affect?
  **Rank:** **C-Tier (The Trap)**

  *   **Why it's Last:** Your TA is right that it's "cool," but you are right to be skeptical. This is a conversation-stopper, not a paper argument.
  *   **Why Demote:**
      1.  **Category Error:** The Hard Problem is about *explanation* (how physical processes give rise to experience). The Heterogeneity Problem is about *individuation* (what makes experiences count as the same kind) and *normativity* (why that kind is good). Conflating them muddies the water.
      2.  **Intractability:** You cannot solve the Hard Problem in 15 pages. If you argue "We can't solve heterogeneity because we can't solve consciousness," your conclusion is skepticism. Professors generally penalize skeptical "out" clauses unless handled with extreme nuance.
      3.  **Downstream:** Even if this is true, it doesn't help a hedonist defend their theory. It just says "Everyone is confused."

  ---

  ### A Missing Candidate: The Normative Significance of Phenomenology
  **The Question:** Even if pleasures *are* heterogeneous (Sidgwick is right), why does that prevent them from being the *single* source of value?
  **Rank:** **A-Tier Alternative (If you want to be bold)**

  *   **The Argument:** The heterogeneity problem assumes that for X to be the *summum bonum*, X must be metaphysically uniform. Challenge this assumption. Why can't a "family resemblance" class be the bearer of value?
  *   **Why it's good:** It attacks the *inference* from "pleasures are different" to "hedonism is false." It allows you to accept Sidgwick's premise but reject his conclusion.
  *   **Phil of Mind Angle:** Use Wittgensteinian family resemblance or cluster concepts applied to mental kinds.
  *   **Verdict:** If you find the "Attitudinal Collapse" too technical, this is the best alternative. It's more meta-ethical but very sharp.

  ---

  ### Recommended Structure for a 15-Page Paper

  Given your background and timeline, I recommend **combining Topic 1 (Attitudinal Collapse) with a Phil of Mind solution (Liking/Wanting or Intentional Modes).** This keeps the paper tightly focused on the *definition of pleasure*, which is the heart of the heterogeneity worry.

  **Proposed Outline:**

  1.  **Introduction (1.5 pages):**
      *   Define Hedonism and the Heterogeneity Problem (Sidgwick).
      *   State Thesis: Attitudinal Hedonism avoids the heterogeneity problem *only if* it can distinguish itself from Desire Satisfactionism; this distinction rests on a specific philosophy of mind account of "pro-attitudes."

  2.  **The Heterogeneity Problem & The Attitudinal Turn (3 pages):**
      *   Briefly explain why Phenomenal Hedonism struggles with Sidgwick (the "tone" is elusive).
      *   Introduce Attitudinal Hedonism (Feldman) as the solution: Unity is in the *attitude*, not the *sensation*.

  3.  **The Collapse Objection (4 pages):**
      *   The Crux: If pleasure is a pro-attitude, how is it different from desire?
      *   If they are the same, AH is just DS (and loses its hedonistic credentials).
      *   If they are different, what is the difference? (This is where you bring in the Phil of Mind).

  4.  **A Phil of Mind Solution: Liking vs. Wanting (4 pages):**
      *   Deploy the Berridge distinction (consummatory liking vs. incentive wanting).
      *   Argue that AH tracks "liking" (an occurrent, phenomenological endorsement) while DS tracks "wanting" (a dispositional, motivational state).
      *   Show how this preserves the unity of "pleasure" (all likings share a functional/phenomenal role) without collapsing into desire.

  5.  **Objections & Reply (2 pages):**
      *   Anticipate: "But I can like something I don't want (masochism) or want something I don't like (medicine)."
      *   Reply: This actually proves the distinction exists, saving AH from collapse.

  6.  **Conclusion (0.5 pages):**
      *   Summarize: Heterogeneity is solved by shifting to attitudes, provided we have a robust metaphysics of those attitudes.

  ### Final Advice on "Tractability"
  *   **Avoid:** Trying to define "pleasure" from scratch. Work with existing definitions (Feldman, Heathwood, Crisp) and critique their metaphysics.
  *   **Embrace:** Your Phil of Mind toolkit. Use terms like *intentional content*, *direction of fit*, *occurrent vs. dispositional*, and *qualia*. This will distinguish your paper from the standard ethics-student papers that just argue about intuitions regarding pig lives vs. philosopher lives.
  *   **Honest Check:** The "Hard Problem" idea is the most tempting but the most dangerous. It feels deep, but it usually leads to vague hand-waving. Stick to the **Attitudinal Collapse**. It is narrow enough for 15 pages, deep enough for an A, and perfectly suited to your specific skillset.
