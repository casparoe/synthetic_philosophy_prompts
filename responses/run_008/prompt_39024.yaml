          *   Alternatives? Social memory theory, trajectory analysis, plausible narration (inference to the best explanation).

      *   *The Final Disqualifier:*
          *   Which requirement kills the most criteria? **The Base-Rate/Reference Class Requirement.** Why? Because "Judaism" and "Early Church" are not monolithic, static databases. We don't know the full population of 1st-century Jewish beliefs, so we can't calculate "dissimilarity" or "coherence" statistically.

