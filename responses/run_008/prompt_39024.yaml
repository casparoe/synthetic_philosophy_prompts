  2.  **Deconstruct the Requirements:**

      *   **Definition:** What *is* a criterion? It's not just a rule; it's a heuristic for probability.
      *   **Independence Problem:** Multiple attestation relies on independent sources. But source independence often relies on redaction criticism which relies on assumptions about authenticity. Circular?
      *   **Selection Problem:** The "survival bias." The tradition is theological, not archival. Can we recover history from theology?
      *   **Consistency:** Inter-subjective verifiability. If Scholar A and Scholar B get different results, is it a tool or a Rorschach test?
      *   **Base-Rate Problem:** "Dissimilarity" requires a baseline. What is "normal" Judaism? What is "normal" early Church? Who defines the control group?

  3.  **Drafting the Specification (Iterative Process):**

      *   *Introduction:* Set the stage. Acknowledge the supervisor's stance. Define the goal of the specification.
      *   *The Requirements:*
          *   **Ontological Status:** Is it a binary switch or a probability weight? *Decision:* Must be probabilistic (Bayesian leaning) to be honest. *Status:* Non-Negotiable (for rigorous history).
          *   **Independence:** Sources must be independent *before* applying the criterion. *Status:* Non-Negotiable (logical necessity).
          *   **Selection/Sampling:** Must account for the theological filter. *Status:* Non-Negotiable (historical reality).
          *   **Consistency:** Inter-rater reliability. *Status:* Non-Negotiable (scientific/historical rigor).
          *   **Base-Rate/Reference Class:** Must define the comparison group explicitly. *Status:* Non-Negotiable (logical necessity).

      *   *The Impossibility Theorem (The "Meat"):*
          *   *Tension 1: Non-Circularity vs. Applicability.* To prove independence, we often need to know authenticity. To know authenticity, we need independence. This is the classic circularity charge (e.g., by Chris Keith, Anthony LeDonne).
          *   *Tension 2: Distinctiveness (Dissimilarity) vs. Contextual Credibility.* If Jesus must be *different* from Judaism to be authentic, he becomes unintelligible to his contemporaries. If he must fit Judaism, he becomes indistinguishable from it. This is the "Jewishness" vs. "Christianity" trap.
          *   *Verdict:* They are jointly unsatisfiable in a strong form. You cannot have a method that guarantees non-circularity *and* yields significant results, nor one that guarantees distinctiveness *and* contextual intelligibility.

