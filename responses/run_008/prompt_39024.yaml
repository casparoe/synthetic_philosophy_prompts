answer: |-
  **Specification for Epistemic Warrant in Historical Jesus Research**

  **1. Ontological Status: What a Criterion Is**
  To be methodologically valid, a criterion of authenticity must not be defined as a binary switch (authentic/inauthentic) nor as a proof of fact. It must be defined as a **probabilistic heuristic for weighting testimony**. Its function is not to isolate atoms of history from a matrix of tradition, but to assign relative likelihoods to pericopae or sayings within a specific hypothesis of the past.
  *   **Status:** **Non-Negotiable.** Any claim to certainty regarding individual units of tradition contradicts the nature of the evidence (oral/written transmission with theological intent).

  **2. The Independence Requirement**
  A criterion relying on multiple attestation (e.g., Mark, Q, Paul, John) must establish the genealogical independence of those sources *prior* to applying the criterion. The judgment that Source A did not copy Source B cannot rest on the assumption that the shared material is authentic; it must rest on redactional and literary analysis independent of the content in question.
  *   **Status:** **Non-Negotiable.** Without prior independence, multiple attestation is merely multiple repetition of a single tradition, offering no increase in probability.

  **3. The Selection (Survival) Requirement**
  A criterion must account for the filtering mechanism of the tradition. The extant data is not a random sample of Jesus' life but a curated collection preserved by communities for theological utility. A valid criterion must demonstrate why a specific unit of tradition would survive *despite* theological interests, or how it functions *within* them, without assuming that survival equals historicity.
  *   **Status:** **Non-Negotiable.** Ignoring the theological filter treats the Gospels as archives rather than kerygma, violating historical source criticism.

  **4. The Consistency (Inter-Subjectivity) Requirement**
  The application of the criterion must yield consistent results across different operators. If two historians applying the same criterion to the same data reach opposite conclusions regarding authenticity, the criterion is functioning as a Rorschach test rather than a methodological tool. The rules of application must be explicit enough to minimize interpreter variance.
  *   **Status:** **Non-Negotiable.** A method that cannot be replicated or audited by peers lacks scientific or historical validity.

  **5. The Base-Rate (Reference Class) Requirement**
  A criterion that relies on comparison (e.g., Dissimilarity, Coherence, Contextual Credibility) must explicitly define the reference class (the "population") against which the data is measured. To claim a saying is "dissimilar" to Judaism or "coherent" with the early Church, the historian must define the boundaries and content of "Judaism" and "Church" for the period in question.
  *   **Status:** **Non-Negotiable.** Without a defined control group, claims of similarity or difference are anecdotal, not statistical.

  ***

  **Analysis of Joint Satisfiability**

  Upon testing these requirements against the available evidence and the logic of historical inquiry, it becomes clear that **no subset of criteria can jointly satisfy the Non-Circularity, Applicability, and Distinctiveness requirements simultaneously.**

  **1. The Non-Circularity vs. Applicability Tension**
  To satisfy the **Independence Requirement** (Non-Negotiable #2) strictly, one must establish source independence without relying on the authenticity of the shared content. However, in Synoptic studies, source relationships are often determined by analyzing the *content* itself (e.g., primitive vs. developed Christology). If we strip away all assumptions about what is authentic to avoid circularity, we lose the ability to determine source relationships. If we assume source relationships to apply the criteria, we have already presupposed a theory of the tradition's growth.
  *   **Result:** Strict non-circularity renders the criteria inapplicable; applicability requires a hermeneutical circle that violates strict non-circularity.

  **2. The Distinctiveness vs. Contextual Credibility Tension**
  The **Base-Rate Requirement** (Non-Negotiable #5) creates a paradox when paired with the goal of identifying the *historical* Jesus.
  *   If we prize **Distinctiveness** (Dissimilarity), we isolate material that differs from both Judaism and the early Church. This satisfies the desire to find what is "unique" to Jesus. However, if pushed rigorously, this renders Jesus unintelligible to his contemporaries (violating Contextual Credibility) and explains nothing about why he spawned a movement (violating the Selection Requirement).
  *   If we prize **Contextual Credibility** (Coherence with Judaism), we make Jesus historically plausible but render him indistinguishable from any other 1st-century Jewish prophet. This satisfies the Base-Rate requirement but fails to explain why *this* specific prophet was crucified and remembered as Lord.
  *   **Result:** You cannot maximize distinctiveness and contextual fit simultaneously. A criterion that demands one inherently weakens the other.

  ***

  **Implications for the Dissertation**

  Since these requirements cannot be jointly satisfied, the following conclusions must be drawn for the methods chapter:

  1.  **The Criteria are Not Repairable Instruments:** The criteria of authenticity cannot be "fixed" to function as independent tests of atomic units. The logical tensions described above are structural, not merely execution errors.
  2.  **Atomistic Authenticity is Misconceived:** The quest to isolate individual sayings as "authentic" while discarding the rest assumes a false dichotomy between "history" and "tradition." The tradition is the only access point to the history.
  3.  **The Alternative:** The field's critics (e.g., Chris Keith, Anthony LeDonne, Rafael Rodríguez) have moved toward **Social Memory Theory** and **Inference to the Best Explanation (IBE)**.
      *   Instead of asking, "Is this saying authentic?", the method should ask, "Does positing this event/saying provide the best explanation for the emergence of the memory tradition we possess?"
      *   This shifts the burden from *verification* (proving a unit is real) to *explanation* (accounting for the effect).

  ***

  **The Disqualifying Requirement**

  If enforced, the single requirement that would disqualify the most criteria in current use is **The Base-Rate (Reference Class) Requirement.**

  **Why:**
  To claim that a saying is "dissimilar" to contemporary Judaism (Criterion of Dissimilarity) or "coherent" with it (Criterion of Contextual Credibility), one must possess a comprehensive database of 1st-century Palestinian Jewish beliefs and practices. We do not possess this. Our evidence for 1st-century Judaism is itself fragmentary, theological, and filtered (e.g., Rabbinic literature is later; Dead Sea Scrolls are sectarian; Josephus is elite).

  Because the "population" of 1st-century Judaism is unknown, we cannot calculate the probability of a specific trait appearing within it. Therefore, any claim that a trait is "rare," "typical," or "unique" is statistically baseless. Enforcing the demand for a defined reference class renders the Criterion of Dissimilarity, the Criterion of Coherence, and the Criterion of Contextual Credibility operationally void, as they all rely on comparisons against a phantom population.
