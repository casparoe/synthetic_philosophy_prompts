  Could you return the whole thing as a single JSON object, schema roughly this:

  - "final_credence": number
  - "sub_questions": array of objects, each with "name" (string), "probability" (number), "justification" (one line)
  - "combination": string explaining how the terms add up to the final number (or why they don't cleanly compose)
  - "most_sensitive_term": the "name" of one sub-question
  - "where_the_disagreement_lives": string
  - "evidence_that_would_move_me": string describing what finding or argument would shift my 0.35 the most

  If you think there are terms I left out (e.g., something about whether the Lectures material should count as evidence of Kant's considered view at all, given how messy the student transcriptions are), fold them into sub_questions — just keep the schema. And definately don't sand the disagreement down to "it depends on your theory of duties" — I want the actual number first.
