  My partner thinks Kant's line on animals is basically salvageable — strip out the shakier empirical psychology and the indirect-duty view is a defensible position. I'm way more skeptical. My credence that the Kantian indirect-duty view about animals, steelmanned as hard as it can be, is ultimately defensible is about 0.35; hers is 0.7. Give me your own number, but the number by itself is useless to me — what I want is the decomposition.

