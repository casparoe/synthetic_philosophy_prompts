  Hey, it sounds like you have done the hard work on this and really internalized the literature, which is great because this is one of those topics where it is easy to get lost in the weeds without a clear map. I have read through your notes and the objections you received, and I think I can give you a clear audit of where the tensions lie and what you should do about them. To give you the bottom line up front, your friend is technically wrong about the mathematical consistency of your position, but the reading group is right about the philosophical instability, and the only way to resolve the package without biting a bullet that destroys your broader epistemological framework is to drop the thirder verdict and move to halfism.

  Let me start with your friend's objection because it is the easiest to clear up. She claims that your three case verdicts plus your conditionalization principle are logically inconsistent, meaning there is no probability space that can generate those numbers via Bayesian updating. I have run the numbers on this, and she is mistaken about the math. It is perfectly possible to construct a model where you start at one-half on Sunday, move to one-third on waking, and return to one-half upon learning it is Monday, all via strict conditionalization. The trick lies in how you define the evidence received upon waking. If you treat the evidence as I am having an awakening experience now and assign likelihoods based on the number of such experiences available in each world, the math works out exactly as you described. On heads there is one awakening, and on tails there are two, so the likelihood of receiving this evidence is twice as high on tails. When you plug that into Bayes theorem, your Sunday credence of one-half shifts to one-third. Then, when you learn it is Monday, you eliminate the Tuesday tails possibility, and the renormalization brings you back to one-half. So, logically, your friend is wrong; the package is mathematically coherent. However, she is sensing a real problem, just misidentifying it as a mathematical error rather than an epistemological one. The cost of making that math work is accepting that the mere number of awakenings changes the likelihood of the evidence, which is exactly where the second objection comes in.

  This brings us to the reading group objection, which is the serious threat to your position. They argue that being a thirder while rejecting the presumptuous philosopher is unstable, and unfortunately, they are right. The mechanism you must use to get from one-half on Sunday to one-third on waking is structurally identical to the reasoning the presumptuous philosopher uses to boost cosmological theories. In both cases, you are allowing the sheer number of observer moments or observers to influence the probability of the theory being true. In Sleeping Beauty, you say tails is more likely because it creates more awakenings for you to find yourself in. In the presumptuous philosopher case, the theory positing a trillion observers is deemed more likely because it creates more observers for you to find yourself as. If you accept the move in the sleeping beauty case, you have accepted the self-indication assumption, which forces you to accept the presumptuous philosopher's conclusion unless you draw a distinction that looks entirely ad hoc. You might try to say that awakenings in an experiment are different from observers in a universe, but from the perspective of self-locating belief, the logic is the same: you are reasoning from your existence to the nature of the world that contains you. If you reject the presumptuous philosopher because it allows for armchair cosmology that ignores physical evidence, you must consistently reject the reasoning that gets you to one-third in Sleeping Beauty.

  So we have a situation where your mathematical model works, but the philosophical justification for that model contradicts one of your core principles. You have to choose between keeping the one-third verdict or keeping your rejection of the presumptuous philosopher and your strict conditionalization principle. I strongly recommend you drop the one-third verdict and become a halfer. The cost of keeping the presumptuous philosopher is far too high; it implies that we can know the universe is vast simply because we exist, which undermines the role of empirical physics in cosmology. It is a much bigger bullet to bite than accepting that Beauty learns nothing new upon waking. Furthermore, moving to halfism actually strengthens your commitment to your first principle about conditionalization. As a halfer, you argue that Beauty knows on Sunday she will wake up, so waking provides no new evidence that discriminates between heads and tails. Her credence stays at one-half because the likelihood of waking is one on both heads and tails. This is a purer form of Bayesian updating than the thirder position, which requires you to treat I am awake now as evidence with differential likelihoods despite her prior certainty that she would wake up. By becoming a halfer, you preserve the no-presumptuous-philosopher principle, you maintain a stricter and more defensible version of conditionalization, and you actually satisfy your friend's intuition without needing to fudge the math.

  The only thing you lose is the one-third verdict on waking, but given that this verdict is the source of the conflict with your other principles, it is the weakest link in the chain. Your other verdicts, such as returning to one-half on learning it is Monday and certainty on learning it is Tuesday, are compatible with halfism anyway, so you do not have to overhaul your entire case analysis. You just need to adjust the initial waking credence. This resolves the tension with the reading group completely and clarifies the tension with your friend by showing that the math was never the problem, but rather the interpretation of the evidence. I know you have spent a lot of time settling into the thirder position, but if you want a package that hangs together without relying on reasoning that leads to absurd cosmological conclusions, halfism is the stable home for your principles. Stick with your general principles and let the case verdicts fall where they may, even if it means conceding the one-third point.
