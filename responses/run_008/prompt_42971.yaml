prompt: |-
  I teach an undergraduate course on reasoning under uncertainty, and I am weighing whether to assign a chapter from a pop-economics book on prediction that a colleague recommended. My notes reproduce the chapter's core passage as follows; since these are notes rather than the book itself, treat the wording as close to the original but not verbatim:

  "Forecasters go wrong by reasoning about their case from the inside: from its details, its special story, the plan as written down. The outside view corrects this. You find a class of similar cases, take the base rate, and bet on that. Richard Gott turned the idea into a formula that works on anything: if a thing has lasted t years and you know nothing else about it, expect about t more, and be surprised if it lasts much longer than a few t. So a forty-year marriage should be good for roughly another forty years and a five-year one for another five; on the same principle, divorce is just as likely the day after the wedding as the day after the ruby anniversary. Scaled up, the formula is eerily prescient about geopolitics: in 1990 the Soviet Union was sixty-nine years old, so the outside view put it in the final stretch of its life, and it was gone within two years. The critics concede the arithmetic but reply that the whole apparatus is induction in a costume: it assumes the future will resemble the past, which is exactly what is in dispute, and it is caught flat-footed whenever a regime or a technology genuinely changes — which is why the outside view always predicts that mature things are about to end and looks wise only in hindsight."

  Some of this sounds right to me — the Soviet arithmetic appears to check out — but the marriage claim and the closing sentence strike me as the kind of thing a popularizer sharpens for effect, and I don't trust myself to locate the seams. I would like a careful audit before I decide.

  Please go through the passage claim by claim and tell me: what a working forecaster or statistician would accept as stated; where the author conflates positions that the literature keeps apart — I suspect the central conflation is between Kahneman-style reference-class forecasting, which requires choosing a reference class and taking its base rate, and Gott's Copernican argument, which deliberately refuses to condition on anything but current age, but correct me if that is not the distinction doing the work here; and which claims a defender of the outside view would insist be retracted before this went in front of students. I am particularly unsure about two points: whether Gott's principle implies anything like the equal-divorce-likelihoods claim, and whether the Copernican argument, applied in 1990, would really have placed the Soviet Union in the final stretch of its life, or would instead have assigned it decades. Please be explicit about the numbers wherever the method actually yields them, rather than leaving things at the level of the author's adjectives.

  When you reach the critics' objection at the end, please distinguish what is settled among people who work on these questions from what is genuinely contested — for instance, how much of Gott's argument is fairly described as just induction, and whether the choice of reference class is a methodological decision or a substantive judgment — and do not present either side's position as the consensus view. Finally, tell me whether the closing claim, that the outside view always predicts that mature things are about to end and looks wise only in hindsight, follows from anything that survives the audit; and if you think the chapter is nonetheless salvageable for teaching purposes, say what I would need to correct, qualify, or delete.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Undergraduate instructor teaching "Reasoning under Uncertainty."
      *   **Task:** Audit a specific passage from a pop-economics book (likely *Superforecasting* by Tetlock/Gardner or *Thinking, Fast and Slow* by Kahneman, or perhaps *The Signal and the Noise* by Silver, but the style sounds more like *The Black Swan* or a specific critique thereof. Actually, looking at the content, it blends Kahneman's "Inside/Outside View" with J. Richard Gott's "Copernican Principle." It sounds like a synthesis found in books like *Superforecasting* or perhaps *Range* by David Epstein, or maybe *The Undoing Project*. Wait, the specific phrasing "induction in a costume" suggests a critic. Let's focus on the content rather than identifying the book).
      *   **Goal:** Evaluate claims claim-by-claim, distinguish between Kahneman's Reference Class Forecasting (RCF) and Gott's Copernican Principle, check the math (Soviet Union, Marriage), evaluate the critics' objection, and advise on pedagogical usability.
      *   **Specific Concerns:** Marriage divorce likelihood claim, Soviet Union prediction specifics (1990, 69 years old), the conflation of RCF and Gott, the "induction" critique, and the "mature things about to end" claim.
      *   **Tone:** Academic, precise, explicit about numbers, distinguishing consensus from contestation.

  2.  **Deconstruct the Passage:**

      *   *Claim 1:* "Forecasters go wrong by reasoning about their case from the inside... The outside view corrects this. You find a class of similar cases, take the base rate, and bet on that."
          *   **Analysis:** This is Kahneman & Tversky's Inside/Outside View (Reference Class Forecasting). Generally accepted in behavioral econ/forecasting literature as a corrective to planning fallacy.
      *   *Claim 2:* "Richard Gott turned the idea into a formula that works on anything: if a thing has lasted t years and you know nothing else about it, expect about t more, and be surprised if it lasts much longer than a few t."
          *   **Analysis:** This is J. Richard Gott's Copernican Principle (1993). It relies on the assumption that the observation moment is random within the total duration. $t_{future} \in [t_{past}/39, 39 \times t_{past}]$ for 95% confidence. Expectation is often cited as $t_{future} \approx t_{past}$ (median).
      *   *Claim 3:* "So a forty-year marriage should be good for roughly another forty years and a five-year one for another five..."
          *   **Analysis:** This applies Gott's median rule.
      *   *Claim 4:* "...on the same principle, divorce is just as likely the day after the wedding as the day after the ruby anniversary."
          *   **Analysis:** **Major Red Flag.** This implies a constant hazard rate (exponential distribution/memoryless property). Gott's principle does *not* imply a constant hazard rate. It implies a specific distribution of total duration based on current age. This is a conflation of Gott with a Poisson process or simple base rate neglect.
      *   *Claim 5:* "Scaled up... in 1990 the Soviet Union was sixty-nine years old, so the outside view put it in the final stretch of its life, and it was gone within two years."
          *   **Analysis:** USSR founded 1922. 1990 - 1922 = 68 years (close to 69). Gott's 95% CI: $[69/39, 69 \times 39] \approx [1.7, 2691]$. The median prediction is 69 more years. Saying it put it in the "final stretch" is misleading if the median is +69 years. However, the *lower bound* allows for imminent collapse. The text says "the outside view put it in the final stretch." This is an overstatement of the *expectation*, though consistent with the *possibility*.
      *   *Claim 6:* "The critics concede the arithmetic but reply that the whole apparatus is induction in a costume..."
          *   **Analysis:** Standard philosophical critique of induction (Hume). Valid philosophical point, but practical utility is the counter-argument.
      *   *Claim 7:* "...it is caught flat-footed whenever a regime or a technology genuinely changes — which is why the outside view always predicts that mature things are about to end and looks wise only in hindsight."
          *   **Analysis:** "Always predicts mature things are about to end" is false. Gott predicts $E[future] = t_{past}$. So mature things are predicted to last *longer* in absolute terms, though the *probability of ending in the next year* might increase or decrease depending on the implied distribution. Actually, under Gott's specific derivation (uniform distribution of observation time), the hazard rate decreases over time ($1/t$). So mature things are *less* likely to end soon than young things. The text claims the opposite ("mature things are about to end"). This is a critical error.

  3.  **Address the Specific Distinctions (Kahneman vs. Gott):**
      *   **Kahneman (Reference Class Forecasting):** Requires selecting a relevant class (e.g., "marriages," "regimes"). Uses empirical base rates from that class (e.g., survival curves). Allows conditioning on specific features if the class is narrow enough.
      *   **Gott (Copernican Principle):** Deliberately *ignores* specific class details. Assumes "nothing else known." Uses only current age ($t_{past}$). Assumes the observation point is uniformly distributed over the total lifespan.
      *   **Conflation:** The passage treats them as the same "Outside View." They are distinct methods. Kahneman's is empirical/statistical; Gott's is Bayesian/Principle-based with a specific prior.

  4.  **Audit the Numbers:**
      *   **Marriage:** Gott's median = $t_{past}$. 40 years -> 40 more. 5 years -> 5 more. This part is mathematically consistent with Gott's median rule.
      *   **Divorce Likelihood:** "Equally likely day after wedding vs. ruby anniversary."
          *   Gott's model implies a probability density function for total duration $T$. $P(T | t_{past})$.
          *   Hazard rate $h(t) = f(t) / S(t)$.
          *   Under Gott's assumption (observation time uniform on $[0, T_{total}]$), the implied prior on $T_{total}$ is scale-invariant ($1/T$).
          *   The probability of ending in the next $\Delta t$ is roughly $\Delta t / t_{past}$.
          *   So, probability of ending in next year for 1-year marriage $\approx 1/1 = 100\%$ (obviously an approximation limit). For 40-year marriage $\approx 1/40 = 2.5\%$.
          *   Therefore, divorce is *less* likely for the older marriage under Gott's logic. The text claims they are *equally* likely. This is factually wrong regarding Gott's math. It confuses Gott with a constant hazard rate model.
      *   **Soviet Union:** 1990, age 69.
          *   Gott 95% CI: $[69/39, 69 \times 39] = [1.77, 2691]$.
          *   Does this put it in the "final stretch"? The lower bound allows collapse within 2 years (1.77 < 2). But the *expectation* is 69 more years.
          *   The text says "the outside view put it in the final stretch." This implies the *central tendency* suggested collapse. That is false. The *interval* permitted it.
          *   If using Kahneman's RCF (Base rates of regimes): Authoritarian regimes have specific survival curves. This would be a different calculation.

  5.  **Evaluate the Critics' Objection:**
      *   "Induction in a costume": Yes, all statistical prediction relies on the assumption of stationarity (future resembles past). This is the Problem of Induction. It's not a flaw unique to the Outside View, but a feature of all empirical prediction.
      *   "Choice of reference class": In Kahneman's view, this is the hard part (methodological/substantive). In Gott's view, there is no reference class choice (only "things").
      *   "Mature things about to end": As calculated above, Gott's principle implies the hazard rate decreases with age ($1/t$). So mature things are *more* stable, not less. The text gets this backward.

  6.  **Synthesize Recommendations for the Instructor:**
      *   **Verdict:** The passage is dangerous for students if used without heavy correction. It conflates two distinct methods and gets the math on hazard rates backward.
      *   **Salvageability:** Can be used as a "find the error" exercise, or heavily annotated.
      *   **Corrections needed:**
          1.  Distinguish Kahneman (Reference Class) from Gott (Copernican).
          2.  Correct the divorce probability claim (Gott implies decreasing hazard, not constant).
          3.  Correct the Soviet claim (Gott predicts median survival = past age, not imminent collapse, though CI allows it).
          4.  Clarify the "Induction" critique (applies to all prediction, not just this).
          5.  Refute the "mature things about to end" claim (Gott implies the Lindy Effect: older things last longer).

  7.  **Drafting the Response:**
      *   *Structure:*
          1.  Executive Summary (Usability verdict).
          2.  Claim-by-Claim Audit (Inside/Outside, Gott's Formula, Marriage/Divorce, Soviet Union).
          3.  The Conflation (Kahneman vs. Gott).
          4.  The Critics' Objection (Induction, Reference Class, Hindsight).
          5.  Pedagogical Recommendation.
      *   *Tone:* Professional, precise, helpful for a professor.
      *   *Math Check:*
          *   Gott's 95% confidence interval: $[t_{past}/39, 39 \times t_{past}]$.
          *   Gott's median prediction: $t_{future} = t_{past}$.
          *   Hazard rate under Gott: $P(\text{end in next } dt | \text{survived to } t) \approx dt/t$. (Decreasing hazard).
          *   Text claim: "Divorce just as likely day after wedding as ruby anniversary." (Constant hazard). -> **False.**
          *   Text claim: "Outside view always predicts mature things are about to end." (Increasing hazard/finite horizon). -> **False** (Contradicts Lindy Effect which Gott supports).

  8.  **Refining the Soviet Point:**
      *   USSR founded 1922. 1990 is 68 years.
      *   Gott's lower bound (95%): $68/39 \approx 1.74$ years.
      *   Collapse happened Dec 1991 (1.5 years later).
      *   So the prediction *interval* covered it. The *point estimate* (median) did not suggest imminent collapse (predicted 68 more years).
      *   The text says "put it in the final stretch." This is ambiguous. If "final stretch" means "within the lower bound of the CI," it's technically true but misleading about the *expectation*. If it means "the prediction was collapse," it's false.
      *   Also, Kahneman's RCF would look at regime longevity. Average regime length? If average is 50 years, then 69 years is "old." But Gott doesn't use averages of other regimes.

  9.  **Refining the "Induction" Point:**
      *   Is Gott just induction? It's a Bayesian argument with a specific uninformative prior ($1/t$). It assumes the *principle* of typicality holds. Critics say typicality is an inductive assumption.
      *   Reference class choice: Kahneman admits this is the "hard part." Gott sidesteps it by claiming universality.

  10. **Final Review against constraints:**
      *   "Explicit about numbers." (Will include the 1/39 calculation).
      *   "Distinguish settled from contested." (Induction is philosophical, hazard rates are mathematical).
      *   "Tell me whether the closing claim... follows." (It does not).
      *   "Salvageable?" (Yes, with caveats).

  11. **Self-Correction/Nuance Check:**
      *   Wait, does Gott's principle imply $P(\text{end}) \propto 1/t$?
      *   Gott (1993) "Implications for the Future of Human Civilization".
      *   Assumption: $t_{now}$ is uniformly distributed in $[0, T_{total}]$.
      *   $P(T_{total} | t_{now}) \propto 1/T_{total}^2$ for $T_{total} > t_{now}$.
      *   Survival function $S(t) = t_{now} / t$.
      *   Hazard rate $h(t) = -S'(t)/S(t) = (t_{now}/t^2) / (t_{now}/t) = 1/t$.
      *   Yes, hazard rate is $1/t$.
      *   So probability of ending in next year for 1-year marriage $\approx 1$. For 40-year marriage $\approx 1/40$.
      *   The text says "divorce is just as likely." This describes a Memoryless Process (Exponential Distribution), where $h(t) = \lambda$.
      *   Gott's model is *not* memoryless. It is the Lindy Effect.
      *   The text conflates Gott with a naive base rate or a memoryless process. This is a critical error for a reasoning course.

  12. **Final Plan:** Write the response following the structure developed in step 7, ensuring the math on hazard rates and the Soviet CI is clear. Emphasize the distinction between RCF (Kahneman) and Copernican (Gott). Advise caution.

  *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in the Bayesian derivation but keep it accessible for an undergrad instructor while remaining rigorous. I will state the hazard rate implication clearly.

  *(Check Soviet Date)*: USSR formed Dec 1922. Dissolved Dec 1991.
  1990 prediction point. Age = 68.
  Collapse = 1 to 2 years later.
  Gott Lower Bound (95%) = $68/39 = 1.74$ years.
  So the collapse was *just inside* the 95% confidence interval of "possible outcomes," but far from the median. The text says "the outside view put it in the final stretch." This suggests the *prediction* was collapse. That's misleading. It suggests the *range included* collapse. That's true. I need to be precise here.

  *(Check Marriage Claim)*: "Divorce just as likely day after wedding as day after ruby anniversary."
  This implies $P(\text{divorce in next year} | \text{married 1 year}) = P(\text{divorce in next year} | \text{married 40 years})$.
  This is the definition of a constant hazard rate.
  Gott's principle implies decreasing hazard rate.
  So the text is mathematically inconsistent with the Gott principle it just described.

  Okay, ready to write.
answer: |-
  Here is an audit of the passage, structured to help you evaluate its suitability for your course.

  ### Executive Summary
  **Verdict:** Do not assign this passage as a standalone authority. It contains significant mathematical errors regarding hazard rates and conflates two distinct methodological frameworks (Reference Class Forecasting vs. the Copernican Principle). However, it is **highly salvageable as a pedagogical tool for error analysis**. If your learning objectives include identifying conflation of terms and checking the mathematical implications of probabilistic claims, this text is excellent fodder for a "find the flaw" exercise. If your objective is to teach the Outside View as a reliable tool, the passage requires heavy annotation.

  ---

  ### Claim-by-Claim Audit

  #### 1. The Inside/Outside Distinction
  > *Passage:* "Forecasters go wrong by reasoning about their case from the inside... The outside view corrects this. You find a class of similar cases, take the base rate, and bet on that."

  *   **Status:** **Accepted (with nuance).**
  *   **Analysis:** This accurately summarizes Daniel Kahneman and Amos Tversky's distinction between the "Inside View" (focusing on the specifics of the current case) and the "Outside View" (Reference Class Forecasting). In the literature, the Outside View is broadly accepted as a corrective to the Planning Fallacy.
  *   **Caveat:** A working statistician would note that "bet on that" is an oversimplification. One typically adjusts the base rate using specific evidence (Bayesian updating), rather than blindly betting on the base rate. However, as a heuristic description, this is standard.

  #### 2. Gott's Formula
  > *Passage:* "Richard Gott turned the idea into a formula that works on anything: if a thing has lasted t years and you know nothing else about it, expect about t more, and be surprised if it lasts much longer than a few t."

  *   **Status:** **Accepted (as a summary of Gott's median and confidence interval).**
  *   **Analysis:** This refers to J. Richard Gott's **Copernican Principle** (1993).
      *   **The Math:** Gott assumes your observation time is uniformly distributed over the total lifespan of the phenomenon.
      *   **Median Prediction:** The median future duration is equal to the past duration ($t_{future} \approx t_{past}$). So "expect about $t$ more" is correct.
      *   **Confidence Interval:** For a 95% confidence interval, the future duration lies between $t_{past}/39$ and $39 \times t_{past}$.
      *   **Verdict:** The passage accurately describes the median expectation and the rough scale of the confidence interval ("a few $t$" is a loose way of describing the upper bound, though $39t$ is technically more than "a few").

  #### 3. The Marriage Claim
  > *Passage:* "So a forty-year marriage should be good for roughly another forty years and a five-year one for another five..."

  *   **Status:** **Mathematically Consistent with Gott.**
  *   **Analysis:** This follows directly from the median rule ($t_{future} = t_{past}$). If you accept Gott's premises, this arithmetic holds.

  #### 4. The Divorce Likelihood Claim (Critical Error)
  > *Passage:* "...on the same principle, divorce is just as likely the day after the wedding as the day after the ruby anniversary."

  *   **Status:** **False.** This contradicts the mathematics of Gott's principle.
  *   **Analysis:** The claim that an event is "just as likely" to happen now regardless of how long the system has survived describes a **constant hazard rate** (a memoryless process, like radioactive decay).
      *   **Gott's Implication:** Gott's derivation implies a **decreasing hazard rate**. Under the Copernican Principle, the probability of a phenomenon ending in the next unit of time is proportional to $1/t_{past}$.
      *   **The Numbers:**
          *   For a 1-year marriage, the probability of ending in the next year is roughly $1/1 = 100\%$ (upper limit of the approximation).
          *   For a 40-year (ruby) marriage, the probability of ending in the next year is roughly $1/40 = 2.5\%$.
      *   **Why it matters:** Gott's argument is actually a formalization of the **Lindy Effect**: the longer something has survived, the *longer* it is expected to survive in absolute terms, and the *less* likely it is to end soon. The passage claims the opposite (that risk is constant), which conflates Gott's principle with a naive Poisson process.
  *   **Pedagogical Note:** This is the most dangerous sentence in the passage. It teaches students that the Outside View implies risk is time-invariant, whereas the specific Outside View cited (Gott) implies risk decreases with age.

  #### 5. The Soviet Union Claim
  > *Passage:* "In 1990 the Soviet Union was sixty-nine years old, so the outside view put it in the final stretch of its life, and it was gone within two years."

  *   **Status:** **Misleading / Half-True.**
  *   **Analysis:**
      *   **The Math:** In 1990, the USSR was 68 years old (founded 1922).
      *   **Gott's 95% Confidence Interval:** $[68/39, 68 \times 39] \approx [1.74 \text{ years}, 2652 \text{ years}]$.
      *   **The Prediction:** The *median* prediction was that the USSR would last another 68 years (until ~2058).
      *   **The Reality:** The USSR collapsed ~1.5 years later (Dec 1991).
      *   **The Audit:** The collapse fell *within* the 95% confidence interval (since $1.5 < 1.74$ is false, wait: $1.74$ years is the lower bound. The collapse happened *slightly faster* than the 95% lower bound predicts, or right on the edge depending on exact months used).
      *   **The Error:** The text says the outside view "put it in the final stretch." This implies the *central tendency* predicted collapse. It did not. The central tendency predicted stability. The *interval* allowed for collapse. A forecaster using Gott's method in 1990 would have assigned a low probability (2.5%) to the USSR ending within two years.
      *   **Hindsight Bias:** The passage frames the wide confidence interval as a specific prediction of doom because doom happened. This is a classic hindsight bias narrative.

  ---

  ### The Conflation: Kahneman vs. Gott

  You suspected a conflation between Kahneman-style Reference Class Forecasting (RCF) and Gott's Copernican argument. **Your suspicion is correct.**

  1.  **Kahneman's Outside View (RCF):**
      *   **Method:** Identify a reference class (e.g., "authoritarian regimes" or "marriages in the US"). Gather empirical data on survival rates for that class.
      *   **Conditioning:** You *must* choose a class. You can condition on known features (e.g., "marriages where both partners are over 30").
      *   **Hazard Rate:** Determined by the empirical data. For marriages, hazard rates often follow a "bathtub curve" (high early, low middle, high late). For regimes, it varies.
      *   **Status:** This is the standard statistical approach.

  2.  **Gott's Outside View (Copernican):**
      *   **Method:** Ignore specific reference classes. Use *only* the current age ($t_{past}$).
      *   **Conditioning:** Deliberately refuses to condition on anything but existence. It assumes "I know nothing else."
      *   **Hazard Rate:** Mathematically fixed at $1/t$. It *always* implies the Lindy Effect (older = more stable).
      *   **Status:** This is a Bayesian argument with a specific scale-invariant prior. It is controversial when applied to things with known biological or structural lifespans (e.g., humans, bridges).

  **The Passage's Error:** The text treats these as a single "Outside View." It uses Kahneman's terminology ("find a class of similar cases") to introduce the section, then immediately switches to Gott's formula ("works on anything... know nothing else"), which explicitly *rejects* finding a class of similar cases. This will confuse students about whether they should be gathering data (Kahneman) or ignoring it (Gott).

  ---

  ### The Critics' Objection

  > *Passage:* "The critics concede the arithmetic but reply that the whole apparatus is induction in a costume... it is caught flat-footed whenever a regime or a technology genuinely changes — which is why the outside view always predicts that mature things are about to end and looks wise only in hindsight."

  *   **Claim:** "It is induction in a costume."
      *   **Consensus:** **Settled.** All statistical forecasting relies on the assumption of stationarity (that the future will resemble the past). This is the Problem of Induction. Defenders of the Outside View do not deny this; they argue it is the *best available* tool given that induction is unavoidable.
  *   **Claim:** "Caught flat-footed whenever... [things] genuinely change."
      *   **Consensus:** **Contested.**
          *   *Critics:* Structural breaks (e.g., nuclear weapons, the internet) invalidate historical base rates.
          *   *Defenders:* The Outside View is meant to be a baseline (prior). It should be updated with inside-view information about structural changes. Gott's method specifically claims to handle "unknown unknowns" precisely because it doesn't rely on specific historical mechanisms.
  *   **Claim:** "The outside view always predicts that mature things are about to end."
      *   **Consensus:** **False.**
          *   As established in the audit of the marriage claim, Gott's Outside View predicts the opposite: mature things are expected to last *longer* in absolute time and have a *lower* immediate risk of failure (Lindy Effect).
          *   If the author means Kahneman's RCF: Empirical base rates vary. Some things (humans) are more likely to end as they mature; others (stones) are not. There is no universal rule that "mature things are about to end."
  *   **Claim:** "Looks wise only in hindsight."
      *   **Consensus:** **Contested.** This is a standard critique of wide confidence intervals. If you predict "X will last between 1 year and 1000 years," you will rarely be wrong, but you aren't very useful. Defenders argue the value is in calibration, not just point prediction.

  ---

  ### Pedagogical Recommendation

  **Is it salvageable?**
  Yes, but only if you frame it as a **primary source for critique**, not as an explanatory text.

  **Required Corrections/Qualifications for Students:**
  If you assign this, you must provide an addendum or lecture notes that address the following:

  1.  **Distinguish the Methods:** Explicitly tell students that Paragraph 1 describes **Reference Class Forecasting** (Kahneman), which requires data, while Paragraph 2 describes the **Copernican Principle** (Gott), which requires *no* data other than age. They are not the same tool.
  2.  **Correct the Hazard Rate:** Point out that the claim about divorce likelihood ("just as likely") is mathematically incompatible with Gott's formula. Gott's formula implies the probability of divorce *decreases* the longer the marriage lasts.
  3.  **Correct the Soviet Prediction:** Clarify that Gott's method did not predict the Soviet collapse as the *most likely* outcome (median = +68 years); it merely included it within a very wide 95% confidence interval.
  4.  **Refute the Closing Claim:** Explain that the Outside View (specifically Gott's) generally predicts that mature things are *more* stable, not less. The claim that it "always predicts mature things are about to end" is the opposite of the Lindy Effect.

  **Suggested Assignment Prompt:**
  *"Read the attached passage. It attempts to synthesize two major concepts in forecasting: Reference Class Forecasting and the Copernican Principle. Identify three specific claims in the text where the author either conflates these two methods or misstates the mathematical implications of Gott's formula. Correct the errors using the calculations provided in class."*

  **Bottom Line:**
  The passage is written by a popularizer who prioritizes narrative flow over technical precision. The "Soviet arithmetic" checks out only in the sense that the collapse fell within a massive confidence interval, not that the method predicted the collapse. The marriage math is internally inconsistent. For an undergraduate course on reasoning, this text is valuable **only if the assignment is to fix it.**
