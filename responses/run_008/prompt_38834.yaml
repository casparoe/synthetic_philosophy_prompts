  my labmate Maya is the person who decides, for our anomaly monitor, whether two kinds of inputs get processed by "the same mechanism." the deal is that if some new input type runs on the same mechanism as the training inputs, the monitor lets it through, and if not it gets flagged. she keeps a rulings doc and there's a new case coming up next week that I want to predict before she calls it, partly to check whether I actually understand her rule (or whether there is one).

  her rulings so far:
  - factual questions asked in english vs in spanish (model is bilingual): same mechanism
  - copy-the-previous-token behavior in plain prose vs in code (induction heads doing it in both): same mechanism
  - classifying a tweet as negative vs classifying a restaurant review as negative: same mechanism
  - two-digit addition done in one forward pass vs with an explicit step-by-step scratchpad the model writes out: different mechanism
  - "what's the capital of france" answered from the weights vs answered from a passage sitting in the context window: different mechanism

  the new case: a while back we did a fine-tune to strenghten refusals, and the mechanistic people found that the refusal behavior is now carried by a different set of components than before the fine-tune — the original refusal pathway got dampened and something else took over, though behaviorally it looks identical. so: is a post-fine-tune refusal running on the same mechanism as a pre-fine-tune refusal?

  this matters practically, since the monitor was trained on pre-fine-tune activations: if she rules "different mechanism," every post-fine-tune refusal becomes an anomaly.

  predict her call, but what I really want is: what rule is she actually running? I can see at least two that both fit her whole record — something like "the same components are doing the work" vs "the same role in the computation, whatever implements it" — and my suspicion is they diverge exactly on this new case. so say what each candidate rule predicts here, whether any other rules fit her record just as well, give me your best guess with reasons, and tell me which case we should put in front of her next to split the remaining candidates. because if "same mechanism" just cashes out as "same weights" I'm not sure the monitor can ever flag anything, and if it cashes out as "same role" I'm not sure it can flag anything either.
