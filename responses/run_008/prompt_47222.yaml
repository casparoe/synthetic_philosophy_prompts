      *   *Did I acknowledge the loss?* Yes, opening and closing.

  7.  **Final Polish:** Check for sensitivity. The user is grieving. The philosophical discussion is a coping mechanism/intellectual processing, but the pain is real. Ensure the response honors both. (Self-correction: Make sure to explicitly mention "Prolonged Grief Disorder" as a newer, more specific alternative that might fit better).

  8.  *(Mental Check on DSM-5-TR)*: DSM-5-TR (2022) added "Prolonged Grief Disorder." This is relevant. It distinguishes normal grief from pathological grief based on duration (12 months for adults) and intensity. This supports the user's intuition that 6 weeks is early for a "disorder" label, though MDD can still be co-diagnosed. I should mention this.

  9.  **Structure:**
      1.  Condolences & Validation.
      2.  The DSM Change & Rationale.
      3.  The Philosophy of Function (Etiological vs. Causal vs. Harmful Dysfunction).
      4.  What the DSM Commits To (Pragmatism).
      5.  Clinical Alternatives (What a different view looks like).
