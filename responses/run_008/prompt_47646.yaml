  ### Part 5: The Decisive Test Case

  To distinguish between **Rule 1 (Fixed Block)** and **Rule 2 (Mutable/Significant)**, you need a scenario where the *mechanism* of the constraint is tested, not just the outcome.

  **The Scenario: The Pre-Travel Diary**
  > A traveler keeps a daily diary in the present. On Monday, she writes nothing about Tuesday. On Tuesday, she travels back to Monday and writes the entry "I traveled to the past today" in Monday's diary page. She then returns to Tuesday.
  >
  > **Question:** When she checks her diary on Tuesday (after returning), what does Monday's page say?

  **Why this distinguishes the rules:**

  *   **Rule 1 (Global Consistency) Prediction:**
      *   The entry **was already there** before she traveled.
      *   *Reasoning:* In a fixed block, the event of writing the entry is part of the past. When she opens the diary on Tuesday morning *before* traveling, the entry must already exist. If it wasn't there, she couldn't travel back to write it.
      *   *Maya's likely phrasing:* "You didn't write it; it was always written."

  *   **Rule 2 (Mutable/Significance) Prediction:**
      *   The entry **appears after she returns** (or was not there before she left).
      *   *Reasoning:* The past is mutable. She changed the diary. Since a diary entry is trivial (like a sandwich), the universe allows the change. The timeline updates.
      *   *Maya's likely phrasing:* "You changed the diary, but since it's just a personal note, the timeline accepted the edit."

  *   **Rule 3 (Epistemic) Prediction:**
      *   Depends on whether the diary is considered a "record." If it's private, it might be mutable. If it's a "record of the traveler," it might be locked. This rule is less clear here, which makes the Diary Test specifically good for distinguishing Rule 1 vs. Rule 2.

  **Recommendation:**
  Present this "Pre-Travel Diary" case to Maya. Ask her specifically: *"When I open the diary on Tuesday morning, before I step into the machine, is the entry already there?"*
  *   If she says **Yes**, she is a **Block Universe (Rule 1)** theorist.
  *   If she says **No** (it appears after the trip), she is a **Mutable Past (Rule 2)** theorist.

  This should help you settle the argument definitively. Good luck with your project; you are asking exactly the right questions to uncover the metaphysics beneath the fiction.
