answer: |-
  **NATIONAL BUREAU OF STANDARDS**
  **Ad Hoc Committee on the Elimination of Vagueness**
  **Minutes of Meeting 44-B**
  **Date:** October 14, 1984
  **Present:** Dr. H. Vaguer (Chair), Dr. Aris, Ms. Precision, Mr. Common (Dissenting)

  **1. Resolution 001: Definition of "Heap"**
  Moved by Ms. Precision, seconded by Dr. Aris. The Committee establishes that a collection of sand grains constitutes a "Heap" if and only if it contains exactly 1,000 grains or more.
  *Discussion:* Dr. Aris noted that 999 grains is perceptually identical to 1,000. If 1,000 is a Heap, 999 must also be a Heap, rendering the cutoff vague.
  *Amendment:* The cutoff stands, but the status of 999 grains is referred to the Subcommittee on the Boundary of Heapness.
  *Vote:* Carried.

  **2. Resolution 002: Definition of "Boundary of Heapness"**
  Moved by Dr. Vaguer. The Subcommittee on the Boundary of Heapness shall determine the exact grain count at which "Non-Heap" transitions to "Boundary."
  *Discussion:* It was observed that any specific count chosen for the Boundary (e.g., 950 grains) would itself have a boundary (e.g., 949 vs. 950), creating a second-order vagueness.
  *Action:* Formation of the Subcommittee on the Boundary of the Boundary of Heapness.
  *Vote:* Carried.

  **3. Resolution 003: Supervaluationist Workaround**
  Moved by Dr. Aris. To halt regress, a statement shall be deemed "True" if it remains true across all precisifications issued by the Committee and its subcommittees to date.
  *Discussion:* Ms. Precision argued this merely shifts vagueness from the object to the set of precisifications. Dr. Aris countered that it allows the Committee to claim correctness without specifying which precisification is correct.
  *Vote:* Carried, pending review by the Subcommittee on the Validity of Precisiifications.

  **4. Dissenting Opinion**
  Mr. Common objected, stating that public predicates functioned adequately via context prior to Committee intervention. He argued that stipulating exact cutoffs creates more confusion than it resolves.
  *Chair's Ruling:* Objection noted. Mr. Common's comments will be minuted to Appendix Z (Unread Appendices).

  **5. Resolution 004: Epistemicist Resolution**
  Moved by Dr. Vaguer. The Committee acknowledges that all predicates possess sharp boundaries fixed by nature independent of human stipulation. The Committee's inability to locate these boundaries is a failure of knowledge, not a feature of reality.
  *Discussion:* Members expressed visible relief. If the cutoff exists objectively, the Committee cannot be blamed for failing to identify it precisely. The Sorites paradox is dissolved by admitting infinite ignorance rather than infinite regress.
  *Vote:* Carried unanimously.

  **OUTSTANDING ACTIONS**

  1.  **Subcommittee on the Boundary of Heapness:** To submit report by [Date TBD pending definition of "Month"].
  2.  **Subcommittee on the Boundary of the Boundary of Heapness:** To define the margin of error for Action Item 1.
  3.  **Subcommittee on the Boundary of the Boundary of the Boundary:** To determine when Action Item 2 becomes actionable.
  4.  **Review of Supervaluationist Consistency:** To be conducted by the Subcommittee on Consistency, once the boundaries of "Consistency" are standardized.
  5.  **Appendix Z:** To be filed in a location sufficiently obscure to prevent public access, but sufficiently accessible to satisfy procedural requirements.

  **Meeting Adjourned:** 4:00 PM (plus or minus a negligible amount).
