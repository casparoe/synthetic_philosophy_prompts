  Hi there, it is great to hear from you and I love that you and your brother are debating this over dinner because that is exactly how philosophy is supposed to work, by testing ideas against someone who disagrees with you. Your teacher is right that weak discernibility is a popular move among contemporary metaphysicians, but your intuition that it might feel like cheating is shared by some very serious philosophers who worry that it changes the subject rather than solving the puzzle. You asked me to show my work before giving you the final answer, so I want to walk you through how I arrived at the thought experiment I am about to describe. I initially considered imagining a universe with no space at all, where objects just float in a void of qualities, but that gets very abstract and hard to picture for a fourteen-year-old. I also thought about using two identical people in a white room, but then you run into problems about whether they have different thoughts or memories, which complicates things with psychology. I decided to go with a physics-based example because you mentioned your teacher is okay with leaning on science, and it avoids the magic of souls while staying within what you learn in high school, plus it gives us a concrete reason to think there are two things even if they look like one.

  Here is the scenario I came up with. Imagine a universe that contains nothing except two particles of light, also known as photons. In physics, these particles are a special type called bosons, which means they are allowed to occupy the exact same position in space at the exact same time while doing the exact same thing. In this specific universe, both photons are located at the very same point, moving in the exact same direction, with the exact same energy and spin. There is no distance between them, no difference in their speed, and no difference in their internal properties, so every relationship they have with each other is also a relationship they have with themselves. However, the total energy in this universe is exactly double what a single photon would have, which gives us a strong reason to say there are two units of stuff here rather than just one, even though they are perfectly superimposed on top of each other.

  Now let's look at why this breaks the weak discernibility move. Your teacher explained that weak discernibility works by finding a relationship that nothing can have with itself, like being five meters away from something, because nothing is five meters away from itself. If object A is five meters from object B, they must be two different things. But in the photon scenario I just described, there is no distance between them, so that trick does not work. Every relationship they share, like being in the same place or having the same energy, is what we call reflexive, meaning it is the kind of relationship a thing can have with itself. Since nothing can tell them apart, not even by how they relate to each other, weak discernibility has nothing to grab onto. A defender of Leibniz would look at this case and say that there simply are not two objects here, but only one object that you are mistakenly counting twice. They would argue that if there is no way to distinguish them, not even weakly, then numerical distinctness is just an illusion. Your brother would probably jump on this and say that this proves his point, arguing that you cannot have two things that are absolutely identical in every way, including where they are. He would say that if they share the same location and properties, they are literally one particle, and claiming there are two is just adding extra existence without any evidence. The part of the setup doing all the heavy lifting here is the rule from physics that allows two particles to be in the same place at the same time. If you remove that rule and say that matter cannot overlap, then the particles would have to be at least a tiny distance apart. As soon as there is any distance between them, even a microscopic amount, the relation is a certain distance from comes back into play. That relation is irreflexive because nothing is a distance from itself, so weak discernibility would work again and prove they are two. So the whole case rests on whether nature allows perfect overlap, and if it does, your brother wins this round unless you can find a new way to tell them apart. I hope this helps you two settle the debate, or at least gives you something new to fight about, and let me know if you want to dig deeper into any of this.
