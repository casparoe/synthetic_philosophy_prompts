answer: |-
  # The "How Much Whorf?" Experimental Prediction Quiz

  **Instructions:** Below are 10 concrete experimental setups drawn from the psycholinguistics literature. Do **not** answer based on what you believe *should* happen. Answer based on what you predict the data *actually* shows. There are no "right" beliefs here, only predictions that align with different theoretical frameworks.

  ---

  ### Q1: The Russian Blue Interference (Winawer et al.)
  **Setup:** Russian speakers (who have distinct words for light vs. dark blue) and English speakers perform a speeded "same/different" judgment on blue color patches. They are faster at cross-category pairs.
  **Crucial Twist:** They perform this task while simultaneously rehearsing a string of numbers (verbal interference).
  **Prediction:**
  *   **A:** The Russian advantage disappears; performance equals English speakers.
  *   **B:** The Russian advantage remains; they are still faster despite the verbal load.

  ### Q2: The Pre-Linguistic Infant (Bornstein et al.)
  **Setup:** 4-month-old infants (no language yet) are habituated to a specific color shade, then shown a new shade either within the same category or across a categorical boundary.
  **Prediction:**
  *   **A:** Infants discriminate better across the boundary (categorical perception exists pre-language).
  *   **B:** Infants show no categorical preference (discrimination is uniform).

  ### Q3: The Levinson Rotation (Guugu Yimithirr)
  **Setup:** Participants watch three chips placed on a table. They are turned 180 degrees to a second table and asked to reconstruct the array. No speaking is allowed during the task.
  **Prediction:**
  *   **A:** Absolute-frame speakers (North/South) reconstruct the absolute orientation; Relative-frame speakers (Left/Right) reconstruct the relative orientation.
  *   **B:** Everyone reconstructs based on their own body (Left/Right), regardless of language.

  ### Q4: The Pirahã Exact Match (Gordon)
  **Setup:** Pirahã speakers (no exact number words above 'three') are shown a row of 7 batteries, then asked to replicate the exact number from a large pile.
  **Prediction:**
  *   **A:** Performance drops to chance/approximation above 3; exact matching fails.
  *   **B:** They match the number accurately; exact quantity sense is intact.

  ### Q5: Kay & Kempton Similarity (Tarasau/English)
  **Setup:** Speakers of a language where one word covers blue and green judge which of two chips is more similar to a third target chip. The chips straddle the blue/green boundary.
  **Prediction:**
  *   **A:** The lexical boundary warps judgment; chips on the same lexical side seem more similar.
  *   **B:** The eye wins; physical similarity dictates judgment regardless of the word boundary.

  ### Q6: Lucy's Yucatec Sort
  **Setup:** Speakers of Yucatec Maya (substance-focused grammar, no obligatory plural) and English speakers are asked to group objects (e.g., a wooden bowl vs. a wooden block vs. a plastic bowl).
  **Prediction:**
  *   **A:** Yucatec speakers group by material (wood); English speakers group by shape (bowl).
  *   **B:** Both groups primarily group by shape.

  ### Q7: Mandarin Time Primes (Boroditsky)
  **Setup:** Participants verify sentences about time (earlier/later) after being primed with vertical spatial arrays (up/down).
  **Prediction:**
  *   **A:** Mandarin speakers are faster on vertical primes than English speakers; English speakers show little effect.
  *   **B:** Both groups respond equally to vertical primes; time-space mapping is universal.

  ### Q8: The Counterfactual Trap (Bloom vs. Au)
  **Setup:** Chinese speakers and English speakers are tested on reasoning tasks involving counterfactual conditionals (e.g., "If X had happened, Y would follow").
  **Prediction:**
  *   **A:** Chinese speakers struggle significantly more due to grammatical lack of subjunctive marking.
  *   **B:** Once pragmatic context is controlled, there is no significant difference in reasoning ability.

  ### Q9: Color Memory Drift (Winawer/Universal)
  **Setup:** Participants view a color shade, wait 5 seconds, then select it from an array. No speaking during the delay.
  **Prediction:**
  *   **A:** Memory drifts toward the focal point of their language's color categories.
  *   **B:** Memory error is random; language categories do not bias recall.

  ### Q10: Silent Gesture (Slobin)
  **Setup:** Speakers describe a motion event using gestures *without* speaking aloud.
  **Prediction:**
  *   **A:** Gestures still reflect the specific path/manner distinctions of their native language.
  *   **B:** Gestures converge on a universal "core" representation when speech is removed.

  ---

  ## Scoring Key & Theoretical Leaves

  To score, map your answers to the profiles below. Most people will not fit perfectly into one; look for the cluster that matches the majority of your predictions.

  ### 1. The Mentalese / Universalist
  *   **Core Belief:** Core cognition is fixed and biological. Language effects are lab noise or superficial.
  *   **Signature Answers:** Q2(A), Q4(B), Q5(B), Q6(B), Q8(B).
  *   **Interpretation:** You believe infants and Pirahã speakers share the same cognitive hardware as English speakers. You view Q1, Q3, Q7, Q9, and Q10 as tasks where language *might* show a blip, but fundamentally, the eye and the mind are universal.
  *   **Status:** Empirically robust on Q2/Q4, but must explain away the reliable effects in Q3/Q7.

  ### 2. The Strong Determinist (The Strawman)
  *   **Core Belief:** Language determines thought. Without the words, the concept cannot be held.
  *   **Signature Answers:** Q2(B), Q4(A), Q5(A), Q6(A), Q8(A), Q1(B).
  *   **Interpretation:** You predict language is required for color categories (Q2), exact number (Q4), and counterfactuals (Q8). Crucially, you believe the effect is hardwired enough to survive verbal interference (Q1-B).
  *   **Status:** **Strawman Alert.** Very few serious linguists occupy this leaf. Q2(A) and Q8(B) are well-established empirical findings that contradict this profile. If you scored here, check if you are conflating "influence" with "prison."

  ### 3. The Attention & Memory Neo-Whorfian
  *   **Core Belief:** Language habits shift attention and memory encoding, but not raw perception.
  *   **Signature Answers:** Q3(A), Q6(A), Q9(A). (Likely Q2(A) and Q4(B)).
  *   **Interpretation:** You accept biology sets the stage (Infants/Pirahã), but language trains the habit. You believe the spatial bias persists in memory without speaking (Q3-A) and color memory drifts (Q9-A).
  *   **Status:** Currently the strongest empirical contender for "real" Whorfian effects (Levinson/Lucy data).

  ### 4. The Thinking-for-Speaking (Slobin)
  *   **Core Belief:** Language influences thought *only* while formulating an utterance.
  *   **Signature Answers:** Q3(B), Q10(B). (Likely Q1(A)).
  *   **Interpretation:** You predict that once the requirement to speak is removed (silent reconstruction in Q3, silent gesture in Q10), the language effect vanishes.
  *   **Status:** Plausible, but threatened by Levinson's Q3 data (where effects persist in memory without speech).

  ### 5. The Interference-Sensitive Whorfian
  *   **Core Belief:** Language intrudes on online processing, but relies on verbal working memory.
  *   **Signature Answers:** Q1(A). (Likely Q5(A), Q7(A)).
  *   **Interpretation:** You see language effects in speeded tasks (Q5, Q7), but you acknowledge they are fragile. If you tie up inner speech (Q1), the advantage dies.
  *   **Status:** Distinguishes "online processing aid" from "deep cognitive restructuring."

  ---

  ## Limitations & Incoherence Flags

  ### 1. The Unseparable Pair: Thinking-for-Speaking vs. Interference-Sensitive
  **The Problem:** These two leaves often yield identical predictions on this quiz. Both predict that if you occupy verbal working memory (Q1) or remove the need to speak (Q3/Q10), the language effect should diminish.
  **The Wedge:** Theoretically, *Thinking-for-Speaking* claims the effect is in the **encoding for output**. *Interference-Sensitive* claims the effect is in **online processing using verbal labels**.
  **Quiz Limitation:** Q1 (Interference) and Q3 (Silent Memory) attempt to separate them.
  *   If you answered **Q1(A)** (Interference kills it) but **Q3(A)** (Memory keeps it), you are a **Neo-Whorfian** who accepts interference effects on perception but not memory.
  *   If you answered **Q1(A)** and **Q3(B)**, you are likely **Thinking-for-Speaking** or **Interference-Sensitive** (the quiz cannot easily distinguish these two without a task comparing *silent formulation* vs. *verbal load*).

  ### 2. The Incoherent Pattern: "Hardwired but Fragile"
  **The Pattern:** You answered **Q1(B)** (Effect remains under verbal interference) **AND** **Q3(B)** (Effect vanishes when not speaking).
  **Why it's Incoherent:** If language changes perception so deeply that it survives a concurrent verbal load (Q1-B), it should be a permanent feature of your visual system. It should not switch off simply because you aren't speaking (Q3-B).
  **Results Page Message:** *"Your predictions suggest a theoretical tension. You believe language effects are robust enough to resist verbal interference, yet fragile enough to vanish when speech isn't required. If language rewrites perception, it shouldn't turn off when you're silent. Consider reviewing the distinction between perceptual tuning and online processing."*

  ### 3. The Incoherent Pattern: "Universal Number, Blank Slate Color"
  **The Pattern:** You answered **Q2(B)** (Infants have no color categories) **AND** **Q4(B)** (Pirahã have exact number sense without words).
  **Why it's Incoherent:** Q2(B) implies cognition requires language to form categories. Q4(B) implies cognition exists independently of language. You cannot hold that number is innate (Q4-B) while color categories are learned (Q2-B) without a specific theory of modularity that this quiz doesn't capture.
  **Results Page Message:** *"You mix biological universalism with linguistic determinism inconsistently. You predict number sense exists without words, but color categories do not. While modularity is possible, this specific split contradicts the standard evidence that both categorical color and approximate number show pre-linguistic foundations."*

  ### 4. The Trap Question (Q8)
  **Usage:** Q8 is the "Chinese Counterfactuals" study.
  **Scoring Note:** Answering **Q8(A)** does not make you a "Strong Determinist" in theory, but it marks you as **uninformed on the literature**. Bloom's 1981 claim was largely debunked by Au (1983) and others.
  **Results Page Message:** *"If you predicted Chinese speakers struggle with counterfactuals (Q8-A), note that this specific finding is considered a classic methodological artifact in modern linguistics. Serious Whorfian hypotheses now avoid this claim."*
