      *Wait, one more check on Tractability:* Bounded rationality is notoriously hard to formalize cleanly. For a 2-year grant, "Bounded Coherence" might result in no theorems. "Incomplete Preferences" has existing formalisms (e.g., Bewley sets, stochastic dominance variants). I will rank Incomplete Preferences #1 for tractability reasons as well as impact. I will rank Boundedness #2 but warn about the risk. I will rank Resolute Choice #3.

      *Wait, let's look at the "Pumper Loss" argument again.* If a pump requires the exploiter to lose money, it's not a market selection pressure. This is the "No Trade Theorem" angle. This is actually quite important for AI. If AI systems won't trade with each other to exploit intransitivities, the intransitivities persist. I might bundle this with Incomplete Preferences or make it a sub-point. Let's keep it distinct but lower priority than the structural vulnerability of the agent itself.

