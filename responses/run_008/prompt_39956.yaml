  # ANTHROPIC REASONING: A DIAGNOSTIC TREE

  **Instructions:** Begin at the **Entry Point**. Answer honestly based on your intuitions about the case described, not on which theory you think you hold. Follow the path corresponding to your answer until you reach a **Leaf**.

  ### **ENTRY POINT: The Doomsday Setup**
  You learn your birth rank is $n$ among all humans who will ever live. Hypothesis **Early** says total humans $N=100$ billion. Hypothesis **Late** says $N=100$ trillion. Priors are equal.
  **Q1:** Does knowing $n$ is relatively small shift your credence towards **Early**?
  *   **YES:** Go to **Node 2**.
  *   **NO:** Go to **Node 3**.

  ---

  ### **NODE 2 (The Consistency Check)**
  **God's Coin Toss:** A fair coin is tossed. **Heads:** 1 observer is created. **Tails:** 1,000,000 observers are created. You wake up knowing the protocol.
  **Q2:** What is your credence in **Heads**?
  *   **~50%:** Go to **Node 4**.
  *   **~1/1,000,001:** *Inconsistent.* You accept Doomsday logic here but reject it in Q1. Re-evaluate.

  ### **NODE 3 (The Magnitude Check)**
  **The Presumptuous Philosopher:** Theory **A** entails 1 trillion observers. Theory **B** entails 1 trillion trillion observers. Priors on theories are equal. You exist.
  **Q3:** Does your existence shift credence towards **B**?
  *   **YES:** Go to **Node 5**.
  *   **NO:** Go to **Leaf C**.

  ---

  ### **NODE 4 (The Reference Class)**
  **Non-Conscious Matter:** Hypothesis **X** entails 1 conscious human. Hypothesis **Y** entails 1 conscious human + 1 trillion rocks (or p-zombies). You are conscious.
  **Q4:** Does **Y** receive a probability boost over **X** simply because it contains more stuff?
  *   **NO:** Go to **Leaf A**.
  *   **YES:** Go to **Leaf B**.

  ### **NODE 5 (The Indexical Check)**
  **Sleeping Beauty:** Fair coin. **Heads:** Wake Monday only. **Tails:** Wake Monday and Tuesday (memory wiped). You wake up.
  **Q5:** What is your credence in **Heads**?
  *   **1/3:** Go to **Leaf D**.
  *   **1/2:** Go to **Leaf E**.

  ---

  ### **LEAVES: POSITIONS & BULLETS**

  *   **Leaf A: Standard Self-Sampling (SSA)**
      *   *Profile:* Yes Doomsday, 50% Coin, No Rock Boost. (Typically Halfer on SB).
      *   *Ugliest Bullet:* Must accept the **Doomsday Argument**: humanity is likely to go extinct soon simply because you were born early.
  *   **Leaf B: Broad SSA**
      *   *Profile:* Yes Doomsday, 50% Coin, Yes Rock Boost.
      *   *Ugliest Bullet:* Must treat **rocks/p-zombies** as members of the reference class, diluting the significance of conscious experience.
  *   **Leaf C: Ordinary Evidence**
      *   *Profile:* No Doomsday, No Presumptuous. (Typically Halfer on SB).
      *   *Ugliest Bullet:* Must explain why **existence is not evidence**, effectively ignoring indexical data that distinguishes theories.
  *   **Leaf D: Standard Self-Indication (SIA)**
      *   *Profile:* No Doomsday, Yes Presumptuous, 1/3 SB.
      *   *Ugliest Bullet:* Must accept the **Presumptuous Philosopher**: be wildly confident the universe is huge solely because you exist.
  *   **Leaf E: SIA-Halfer Hybrid**
      *   *Profile:* No Doomsday, Yes Presumptuous, 1/2 SB.
      *   *Status:* **Unoccupied.** Logically possible, but no prominent defence exists. Combines SIA's priors with Halfer's updating.

  ---

  ### **NOTES ON DISTINCTIONS**

  1.  **Halferism vs. SSA:** This tree *can* separate them. **Halfers** (1/2 on SB) appear in **Leaf A** and **Leaf C**. **SSA proponents** (Yes Doomsday) appear in **Leaf A** and **Leaf B**. If you answer 1/2 on SB but 'No' on Doomsday, you are a Halfer but *not* an SSA proponent.
  2.  **Unoccupied Space:** **Leaf E** is currently empty. Additionally, the combination of **Yes Doomsday** + **Yes Presumptuous** is **Incoherent** (accepting both small-$N$ and large-$N$ boosts cancels out anthropic reasoning entirely).
  3.  **Instrument Limits:** If you find yourself in **Leaf A**, note that your answers are identical to a standard Halfer on all posed cases *except* Doomsday. If your intuition on Doomsday is weak, this instrument cannot distinguish you from **Leaf C** based on SB alone.
