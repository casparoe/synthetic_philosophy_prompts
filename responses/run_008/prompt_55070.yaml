      *   The user's skepticism is well-founded. The "No Hunches Allowed" claim is strong and controversial in philosophy (the problem of *undermining futures*, *single-case chances*, *determinism*, etc.).
      *   Poker provides a perfect testing ground because it mixes epistemic uncertainty (cards hidden) with ontic randomness (shuffling).

  3.  **Mapping the Analogy (The Audit):**

