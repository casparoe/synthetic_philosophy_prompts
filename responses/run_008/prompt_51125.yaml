answer: |-
  # The "Did Nothing Happen?" Quiz: What Do You Think Causes Things?

  Welcome to the blog! Today we're tackling a weird puzzle: **Can doing *nothing* cause something to happen?**

  Imagine a gardener is hired to water your flowers. He goes on vacation, doesn't water them, and they die. Did his *not-watering* kill the flowers? Or did the sun dry them out, and the gardener just… didn't stop it?

  Philosophers fight about this. Some say absences can't be causes because "nothing" isn't a real thing. Others say if you were supposed to act and didn't, that's a cause. Others say it depends entirely on what you're comparing the situation to.

  Below are 10 concrete scenarios. Don't overthink them—go with your gut. At the end, I'll tell you which philosophical camp your intuitions match.

  ***

  ### The Quiz

  **1. The Hired Gardener**
  A gardener is paid to water your plants while you're away. He decides to sleep in instead. The plants die of thirst.
  *   **A.** Yes, his sleeping in caused the plants to die.
  *   **B.** No, the heat/sun caused the plants to die; the gardener just didn't stop it.
  *   **C.** Yes, but only because he was paid to water them.

  **2. The Nurse vs. The Stranger**
  A patient in a hospital needs a specific antidote to survive. The nurse on duty forgets to administer it, and the patient dies. At the same time, a stranger on the other side of the country also doesn't send the antidote.
  *   **A.** The nurse caused the death, but the stranger did not.
  *   **B.** Both the nurse and the stranger caused the death (neither sent the medicine).
  *   **C.** Neither caused the death; the illness caused the death.

  **3. The Neighbor and the Farmer**
  Your garden dies because it didn't rain and you didn't water it. Your neighbor didn't water it either. A farmer in Kazakhstan didn't water it either.
  *   **A.** Only you caused the garden to die (it was your garden).
  *   **B.** You and your neighbor caused it, but not the farmer.
  *   **C.** Technically, everyone who didn't water it is a cause, even the farmer.

  **4. The Open Gate**
  You leave your front gate unlatched. Your dog runs out into the street and is hit by a car.
  *   **A.** You leaving the gate open caused the accident.
  *   **B.** The car hitting the dog caused the accident; you just created the opportunity.
  *   **C.** It's misleading to say you "caused" it, even if you were careless.

  **5. The Bodyguard (Double Prevention)**
  An assassin shoots at a VIP. A bodyguard usually stands in the way to block bullets, but today the bodyguard is sick at home. The bullet hits the VIP.
  *   **A.** The bodyguard's absence caused the death.
  *   **B.** The assassin (and the bullet) caused the death.
  *   **C.** Both the assassin and the bodyguard's absence caused it.

  **6. The Broken Sprinkler**
  An automatic sprinkler system fails to turn on because the timer wasn't set. The grass dies.
  *   **A.** The cause was the timer not being set.
  *   **B.** The cause was the water not flowing.
  *   **C.** It depends on whether you're asking "Why didn't it work?" or "Why did the grass die?"

  **7. The Starving Artist**
  You keep your extra money. An artist in a distant country starves to death. If you had sent the money, they could have bought food.
  *   **A.** By keeping your money, you caused their death.
  *   **B.** You didn't cause it, though you might be blameworthy for not helping.
  *   **C.** You are not responsible or causal in any way; their poverty caused it.

  **8. The Missed Train**
  You sleep in and miss your train. Because you miss the train, you miss a meeting. Because you miss the meeting, you lose a big contract.
  *   **A.** Sleeping in caused the loss of the contract.
  *   **B.** Sleeping in caused you to miss the train, but the meeting failure caused the contract loss.
  *   **C.** No, the market conditions caused the contract loss; you just weren't there.

  **9. The Backup Gardener**
  You have a main gardener and a backup gardener. The main gardener doesn't show up. The backup was ready but wasn't called. The plants die.
  *   **A.** The main gardener caused the death (by not showing).
  *   **B.** The backup gardener caused the death (by not being called).
  *   **C.** The main gardener caused it *relative to the backup showing up*, but not relative to rain falling.

  **10. The Vacuum Seal**
  A glass jar is sealed in a vacuum. The seal breaks, air rushes in, and the contents oxidize (rust/spoil).
  *   **A.** The absence of the seal caused the oxidation.
  *   **B.** The air rushing in caused the oxidation.
  *   **C.** Both are equally the cause.

  ***

  ### The Scoring Key

  Count up which letter you picked most often. (If you have a tie, read both descriptions).

  #### Mostly A's: The "Common Sense" Counterfactualist (Causal Modeling View)
  **Your intuition:** If something hadn't happened, the result would be different, so it's a cause.
  **The Philosophy:** You align with the **Causal Modeling** or **Counterfactual** view. To you, causation is about dependence. If the gardener *had* watered the plants, they wouldn't have died. Therefore, the not-watering is a cause. You don't worry too much about whether "nothing" is a physical thing. You treat omissions just like any other variable: if flipping the switch from "Off" to "On" changes the outcome, then the "Off" state is a cause.
  **The Trap:** You might have to accept that the farmer in Kazakhstan is technically a cause of your flowers dying (since if they had flown over and watered them, the flowers would live). If that bugs you, you might be closer to the Moralized view.

  #### Mostly B's: The Physicalist (Omissions Aren't Real Causes)
  **Your intuition:** Causes have to be real events or physical forces pushing on things. "Nothing" can't push.
  **The Philosophy:** You align with the **Process** or **Physicalist** view. You believe real causation involves the transfer of energy or physical stuff (like a bullet hitting a target, or sun evaporating water). An omission is just the *lack* of a cause. You prefer to say the sun killed the plants or the assassin killed the VIP. You think calling omissions "causes" is a loose way of speaking, not literal truth.
  **The Trap:** This view makes it hard to explain why we blame the nurse who forgets the antidote. If the omission isn't a cause, why is the nurse responsible but the stranger isn't? You might need to separate *causation* from *blame*.

  #### Mostly C's (with a focus on duty): The Moralized View
  **Your intuition:** An omission is only a cause if someone was *supposed* to act.
  **The Philosophy:** You align with the **Normative** or **Moralized** view. You think the reason the gardener caused the death but the stranger didn't is because the gardener had a duty. For you, causation isn't just physics or logic; it's tied to expectations and rules. Without a duty or a reasonable expectation, an omission is just a background condition, not a cause.
  **The Trap:** This mixes up "what happened" with "what should have happened." Some philosophers argue you can be blameworthy for something you didn't cause. If you separate blame from cause, you might move to the Counterfactual view.

  #### Mostly C's (with a focus on "depends" or "relative to"): The Contrastivist
  **Your intuition:** It's never just "Did X cause Y?" It's always "Did X cause Y *instead of Z*?"
  **The Philosophy:** You align with **Contrastivism**. You think the question "Did the gardener cause the death?" is incomplete. It needs to be: "Did the gardener cause the death *rather than the backup gardener*?" (Yes) vs "Did the gardener cause the death *rather than it raining*?" (No). You noticed that in questions 6 and 9, the answer changed based on what alternative you were thinking of.
  **The Trap:** This is a subtle view. If you picked C because you thought "It depends on the rules," you're actually Moralized. If you picked C because you thought "It depends on what we're comparing it to," you're a Contrastivist.

  #### Mixed Bag / No Clear Pattern: The "It's Complicated" Zone
  **Your intuition:** Your answers shift based on the specific details of the story.
  **The Philosophy:** You might hold a **Pluralist** view, or you might just have honest human intuitions that don't fit a single theory.
  **Honest Limitation:** It is very hard to separate the **Contrastivist** view from the **Causal Modeling** view using a multiple-choice quiz. Both often say "Yes, the omission is a cause." The difference is *why*. The Modeler says "Yes, because the outcome depended on it." The Contrastivist says "Yes, but only relative to specific alternatives." If you scored high on A's but felt like C was also right in questions 6 and 9, you are likely a Contrastivist who sounds like a Modeler.
  **Incoherent Pattern:** If you said the Nurse caused the death (Q2) but the Gardener didn't (Q1), or that the Gate didn't cause the accident (Q4) but the Timer did (Q6), your intuitions might be inconsistent. This is common! Our brains use different shortcuts for different stories. Philosophy is just the attempt to make them match.

  ***

  ### A Note on the Scoring
  You might notice the **Moralized View** and the **Contrastivist View** can look similar in this quiz (both often pick the "It depends" or "Only the nurse" options). That's not a bug in the quiz; it's a feature of the debate.
  *   The **Moralist** says the stranger isn't a cause because they had no *duty*.
  *   The **Contrastivist** says the stranger isn't a cause because the relevant alternative is "The nurse did their job," not "The stranger flew in."

  If you found yourself arguing with the options because neither A nor B captured the nuance, congratulations: you're doing philosophy.
