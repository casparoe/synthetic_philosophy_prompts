  **Recommendation**

  I recommend the Center sign the Frontier Compute Accord contingent upon the inclusion of the threshold rider. Obligations activate only once organizations controlling seventy percent of frontier compute are bound by equivalent commitments. This balances our ethical mandate to advance safety norms with the fiduciary realities facing our commercial spin-offs. Unconditional pledges risk viability without guaranteeing systemic risk reduction, while a threshold mechanism aligns our incentives with broader industry adoption. This approach allows us to signal serious intent without succumbing to the competitiveness trap that renders unilateral voluntary measures self-undermining. We must communicate this to drafters immediately for incorporation before Thursday's vote.

  **The Competitiveness Objection**

  The competitiveness constraint posits that safety investments imposing net costs will disadvantage adopters against unconstrained rivals. For a purely academic body, this is theoretical; for the Center, it is operational. Our spin-offs compete for commercial contracts where speed and cost often outweigh verified safety margins. If we bind ourselves unconditionally to rigorous audits and contract refusals while competitors do not, we risk pricing our technology out of the market or ceding deployment to less cautious actors. This dynamic creates a perverse incentive: the Center could inadvertently accelerate risk by weakening our commercial arm, reducing our influence over actual deployment practices.

  Moreover, the Accord's specific requirements impose tangible burdens. Independent third-party audits delay deployment timelines, and declining autonomous contracts removes lucrative market segments. In a winner-take-all market, these delays allow unconstrained actors to capture market share and set de facto standards. Voluntary measures lack enforcement; without collective action, a unilateral pledge functions as a voluntary tax on caution. If the Accord fails to achieve critical mass, our sacrifice yields no global safety benefit, only local competitive degradation. The worry is not merely about profit margins, but about maintaining the capacity to influence the field effectively. If our spin-offs fail due to over-commitment, we lose the platform from which to advocate for safety entirely. Thus, the objection rests on the claim that unilateral martyrdom does not equal systemic safety. We must acknowledge that being outcompeted means less capable actors control the technology, potentially increasing aggregate risk even if our specific models are safer. The constraint demands we consider the counterfactual: who deploys if we don't, and under what standards?

  **The Rider and the Overlap**

  The threshold rider addresses the competitiveness objection by converting a unilateral sacrifice into a mutual assurance contract. Critics argue this guts the signaling function, reducing our signature to cheap talk. They claim university signatures should be low-cost signals that slowly build norms. However, a signal is only valuable if it is sustainable. An unconditional commitment we cannot maintain undermines credibility more than a conditional one. The rider ensures our obligations scale with industry adoption, preventing the self-undermining dynamic where safety leaders are punished by the market. It signals intent to coordinate rather than perform virtue.

  Furthermore, the safety-capability overlap complicates the cost-benefit analysis. Some audit requirements may accelerate capability work by standardizing benchmarks or increasing trust, reducing the "tax." These provisions might be competitively beneficial, suggesting the competitiveness objection applies unevenly across the Accord. However, the clause declining autonomous contracts remains a pure cost with no capability upside. The rider protects us against this specific disadvantage while allowing us to adopt beneficial transparency measures immediately if we choose, though the accord binds them together. By tying activation to seventy percent compute coverage, we align our constraints with the point where competitive disadvantage diminishes. This preserves the norm-building function—the signal is that we will lead, but only if followed—without exposing the Center to existential commercial risk. It transforms the pledge from a vulnerable unilateral vow into a robust coordination mechanism. Norms build through successful implementation, not broken promises. A conditional signature acknowledges the reality of the race dynamic while committing to safety once the race conditions are neutralized by broad adoption.

  **The Strongest Case for the Losing Side**

  Proponents of signing as drafted argue that conditional commitments signal hesitation, inviting others to delay their own adoption. They contend that universities hold a unique moral position distinct from commercial entities; our signature is not a market move but a normative statement. By signing unconditionally, we create a focal point for the industry, raising the reputational cost for non-signatories. They worry the rider creates a loophole where everyone waits for everyone else, resulting in zero adoption. For them, the risk of competitive disadvantage is secondary to the imperative of establishing an absolute safety standard. They believe that if the Center cannot absorb the cost, no one can, and we should accept that limitation rather than dilute the Accord. Their view prioritizes the purity of the commitment over the pragmatism of coordination, trusting that moral leadership will eventually compel industry compliance regardless of immediate economic incentives.

  **Conditions and Next Steps**

  If we proceed with the rider, we must request formal verification mechanisms for the seventy percent threshold from the Accord drafters. We should seek a reassessment timeline if the threshold is unmet after two years. We will coordinate with other academic signatories to present a strong, unified front. We will publish our reasoning to ensure full transparency. We will ask if evaluation provisions can be decoupled from deployment restrictions, allowing immediate adoption of beneficial transparency measures. This contributes to norm-building without untenable commercial risk.
