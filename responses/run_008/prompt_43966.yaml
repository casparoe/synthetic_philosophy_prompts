  3. Introduce the distinction immediately after describing the urn colors by explicitly labeling the Red ball probability as "risk" and the Black/Yellow split as "ambiguity" before anyone places a bet. Kill the confusion by showing that risk aversion applies to known odds, whereas their discomfort here stems specifically from the missing information about the Black/Yellow ratio.
  4. Address the claim that flipping the scenario to losses makes people ambiguity-seeking, which proves this isn't just general caution but a specific framing effect. Bring this up after demonstrating the standard aversion to show that their intuition changes based on gains versus losses, complicating any simple fix.
  5. End by asking why assigning a subjective 50/50 probability to the unknown balls fails to resolve the contradiction if they still prefer the known odds. This forces them to admit that the issue isn't the number they pick, but the lack of confidence in that number itself.
