  ### 1. "The two positions, stated fairly"

  The skeleton camp argues that letter identity relies on invariant topological structures. For them, an 'a' possesses a specific geometric essence—typically a closed counter and a vertical stem—that persists across styles. Variations are superficial renderings of this deep structural blueprint, akin to Hofstadter's abstract roles. Conversely, the no-core camp denies any necessary structural invariant. They argue identity emerges from Wittgensteinian family resemblance and systemic contrast within a typeface. Citing the single-storey and double-storey 'g', they claim a letter is defined by its functional role in distinguishing words, not by shared geometry. As long as a form maintains its contrastive position against neighbors like 'o' or 'c', it can drift structurally without losing identity. Both agree recognition happens, but disagree on whether a shared internal template is required.

  ### 2. "What kind of disagreement this is"

  This is primarily a category error between normative design practice and descriptive cognitive science, layered with a metaphysical dispute about universals. The skeleton camp speaks normatively: to *construct* a coherent typeface, a designer needs a structural blueprint. Their "essence" is a procedural rule for generation, ensuring consistency across weights and styles. They treat the skeleton as a causal mechanism for production, echoing Hofstadter's abstract roles. The no-core camp speaks descriptively: to *recognize* a letter, a reader needs only contextual contrast. Their "family resemblance" is a statistical observation of usage, not a generative rule. They treat identity as an emergent property of the system.

  However, it bleeds into empirical psychology. If the skeleton is real, it should be neurally encoded as a prototype. If no-core is right, recognition is purely relational, relying on deep learning-like pattern matching without explicit rules. The metaphysical layer complicates this: do categories like 'a' exist independently (Platonic skeleton) or are they useful fictions (nominalist contrast)? The stalemate persists because skeleton advocates treat their generative tool as a cognitive reality, while no-core advocates treat functional success as proof of structural emptiness. They are talking past each other: one defines 'a' by its genesis (designer intent), the other by its effect (reader comprehension).

  Crucially, this is also a verbal disagreement about "identity." For skeleton folks, identity means "shared ancestry of form." For no-core, it means "interchangeability in context." This verbal slippage masks the empirical question: does the brain extract skeletons or compute contrasts? Because neither side isolates the variable—production constraints vs. perception mechanisms—they talk past each other. The disagreement is verbal regarding the definition of "identity," empirical regarding neural representation, and metaphysical regarding the existence of typographic universals. Until they distinguish between the *ontology* of the letter and the *mechanism* of recognition, the debate remains a conflation of production and perception, masking a deeper uncertainty about whether cognitive categories mirror design constraints. The user's hypothesis is close but misses the metaphysical stake: both claim to describe reality, not just utility.

  ### 3. "The OCR wrinkle"

  OCR evidence favors the no-core camp, but not decisively. Neural networks learn statistical regularities without explicit rules or skeletons. This demonstrates structural invariants are not *necessary* for classification, undermining the skeleton claim. Advocates argue networks implicitly reconstruct topological features. Since networks are opaque, neither side proves what the model "sees." OCR proves recognition is possible without explicit essences, supporting the no-core assertion that identity is functional. Yet, it cannot settle whether human brains operate similarly. Evidence shows sufficiency of contrast, not necessity of skeleton. Both claim victory because the model's logic remains unknowable, mirroring the stalemate.

  ### 4. "What would count as progress"

  Progress requires separating design constraints from cognitive mechanisms. An adaptation experiment could test this: expose readers to a novel alphabet where 'a' varies topologically but maintains contrast. If recognition fails despite contrast, skeletons are cognitively real. If recognition succeeds, no-core wins. Alternatively, reformulate the question: ask not "what is an 'a'?" but "what constraints limit 'a' variation?" This shifts focus from essence to boundaries. Designers need skeletons for consistency; readers need contrasts for legibility. Acknowledging this division of labor dissolves the metaphysical tension. Progress isn't finding the essence, but mapping the tolerance limits of human perception against the necessities of design production. Until the group distinguishes between the *generation* of letters and the *perception* of them, they will remain stuck. The question should be: "What is the minimum contrast required for recognition, and what is the maximum structure required for design?"
