answer: |-
  **JOINT STATEMENT OF INTERPRETIVE METHOD AND APPLICATION**

  **Re:** *Application of the Graduates Remain Act (1994) to Apex Online University*
  **Date:** October 26, 2023
  **Signatories:** [Faculty Member A] (Textualist) and [Faculty Member B] (Purposivist)

  **PREAMBLE**

  We, the undersigned faculty members, submit this joint statement following a structured adversarial collaboration regarding the interpretation of the fictitious State's *Graduates Remain Act* of 1994. This collaboration was initiated after a workshop hypothetical revealed that our respective methodological commitments were driving us toward conclusions that initially felt counterintuitive to our usual jurisprudential leanings. Specifically, the Textualist finds the statutory language compels granting the tuition waiver to the applicant, Dana, while the Purposivist finds the statutory objective compels denying it. This document records our points of convergence, the precise nature of our divergence, and the evidentiary or argumentative thresholds required to resolve the dispute. We agree to stand solely on the provided hypothetical record, without recourse to external authority.

  ***

  **1. AGREED CLAIMS**

  We jointly affirm the following six claims. These claims represent the common ground upon which our disagreement rests.

  1.  **Fidelity to Law:** Statutory interpretation must begin and end with the law as enacted by the legislature, respecting the constitutional separation of powers.
  2.  **Relevance of Purpose:** The objective of a statute is a relevant consideration in interpretation, provided it does not contradict the enacted language.
  3.  **Textual Silence on Attendance:** The enacted text of Section 3 ("located within the State") does not explicitly mandate physical attendance by students or physical classrooms for the institution.
  4.  **Legislative History Status:** The Committee Report confirms that the concept of "principal place of instruction" was considered during the drafting process, but the public record does not establish whether the removal of that phrase from the final text was a deliberate policy choice or a clerical error.
  5.  **Significance of Inaction:** The Legislature's failure to amend the Act over thirty years, despite the rise of online education, does not conclusively demonstrate legislative approval of either including or excluding online institutions from the waiver.
  6.  **Policy Stakes:** Granting the waiver to Dana advances reliance interests and textual stability but risks dissipating funds without ensuring physical retention; denying the waiver preserves the fiscal goal of physical retention but risks undermining the predictability of the statutory text.

  ***

  **2. TABLE OF RESIDUAL DISAGREEMENTS**

  The following table outlines our remaining disagreements. To ensure fairness, each disagreement is stated twice: first as the Textualist would characterize her own position, and second as the Purposivist would characterize his own position.

  | Subject of Disagreement | Textualist Formulation | Purposivist Formulation |
  | :--- | :--- | :--- |
  | **The Omitted Clause** | The deletion of the "principal place of instruction" language from the Committee Report draft signals a legislative decision to adopt the broader, ordinary meaning of "located" in the enacted text. | The deletion of the "principal place of instruction" language is ambiguous and should not override the specific physical retention goal evidenced by the Report and the Act's preamble. |
  | **The Meaning of "Located"** | For a corporate entity, "located" ordinarily refers to its legal charter and administrative headquarters, both of which Apex maintains within the State. | For a tuition waiver aimed at retention, "located" implies a physical nexus of instruction that keeps the student within the State's borders, which Apex lacks. |
  | **Hierarchy of Norms** | When the text is clear, evidence of purpose cannot be used to narrow the scope of eligibility to a subset of the entities the text describes. | When the application of the text defeats the core purpose of the Act, the text should be read narrowly to align with the mischief the legislature intended to remedy. |

  ***

  **3. CRUXES OF THE DISPUTE**

  We have identified three specific subquestions (cruxes) that structure our disagreement. Settling any one of these would materially move at least one party toward the other's conclusion. We have selected these three because they isolate the specific methodological friction points regarding history, abstraction, and time.

  1.  **The Intent Behind the Omission:** Does the removal of the "principal place of instruction" clause reflect an intent to broaden eligibility or merely to streamline language without changing scope?
  2.  **The Level of Generality of Purpose:** Is the Act's purpose the concrete 1994 goal of "preventing physical departure of graduates" or the abstract rationale of "investing in state human capital regardless of location"?
  3.  **Legislative Acquiescence:** Does the Legislature's thirty-year silence amid the technological shift to online education constitute an implicit update to the statute's scope?

  ***

  **4. TESTS AND PREDICTIONS**

  For each crux identified above, we propose a hypothetical discovery or argument that bears on the question. Below, we record our respective predictions regarding what such evidence would show or how it should weigh.

  **Crux 1: The Intent Behind the Omission**
  *   **Test:** Recovery of a confidential drafting memorandum from the 1994 Conference Committee explaining the deletion of the "principal place of instruction" clause.
  *   **Textualist Prediction:** "The memorandum would indicate the clause was removed to avoid legal ambiguity regarding corporate chartering, confirming the text was meant to govern eligibility based on legal status rather than physical footprint."
  *   **Purposivist Prediction:** "The memorandum would indicate the clause was removed as redundant because 'located' was understood by all drafters in 1994 to necessitate a physical campus, confirming the text was not meant to cover non-physical entities."

  **Crux 2: The Level of Generality of Purpose**
  *   **Test:** A hypothetical 1995 Attorney General Opinion issued to a state college regarding a student studying abroad for one semester.
  *   **Textualist Prediction:** "The Opinion would distinguish between temporary absence and institutional location, reinforcing that the statute governs the institution's status, not the student's transient physical presence."
  *   **Purposivist Prediction:** "The Opinion would deny the waiver for the study abroad student, reinforcing that the statute's primary objective is the physical presence of the degree-holder within the State during instruction."

  **Crux 3: Legislative Acquiescence**
  *   **Test:** A hypothetical 2020 Legislative Audit Report reviewing the tuition waiver program's efficacy.
  *   **Textualist Prediction:** "The Audit would recommend legislative amendment if online students were deemed ineligible, implying that without such amendment, the current text remains controlling."
  *   **Purposivist Prediction:** "The Audit would assume online students are ineligible based on the program's historical administration, implying a long-standing practical construction that excludes digital-only institutions."

  ***

  **5. DISPOSITION**

  We are unable to agree on the disposition of Dana's application at this time. Our methodological commitments require different evidentiary thresholds to alter our respective positions. We record the following conditions under which we would change our minds:

  *   **For the Textualist to deny the waiver:** She would require evidence that the ordinary meaning of "located" in 1994 could not legally apply to a corporation without a physical footprint, or that applying the text to Apex produces an absurd result that the legislature could not have intended (e.g., evidence that the State would have gone bankrupt had online schools been included).
  *   **For the Purposivist to grant the waiver:** He would require evidence that the 1994 Legislature affirmatively considered and rejected a physical presence requirement, or that the "purpose" of the Act is demonstrably better served by funding online education (e.g., data showing online graduates remain in the State at higher rates than traditional graduates).

  ***

  **6. CLOSING: ON THE NATURE OF THE DISPUTE**

  We conclude by addressing whether any part of this dispute is merely verbal. We agree that the dispute is **not** merely verbal. While we utilize different terminology ("ordinary meaning" versus "mischief"), we are not simply defining words differently; we are disagreeing about the source of legal authority. The Textualist prioritizes the stability of the enacted words as the exclusive vehicle of legislative will. The Purposivist prioritizes the functional outcome of the legislative goal as the true expression of legislative will. Because these priorities lead to opposite outcomes for Dana even when the definitions of words are held constant, the disagreement is substantive regarding the rule of recognition, not semantic.

  **Signed,**

  __________________________
  [Faculty Member A]

  __________________________
  [Faculty Member B]
