      *   **Context:** Reading group discussion on "Why is there something rather than nothing?"
      *   **Core Problem:** The slogan "Nothing comes from nothing" (*ex nihilo nihil fit*) is being used ambiguously by two opposing sides (Anglican priest vs. pop-scientists).
      *   **Task:** Disambiguate the slogan into distinct precise claims (conservation, causal, metaphysical, explanatory, etc.). Evaluate each claim (platitude, substantive, false). Determine if each claim supports the priest's argument (theism) or the physicist's argument (naturalism/no creator).
      *   **Goal:** A sorted list/map for the reading group to stop talking past each other. No adjudication on God's existence, just mapping the logical work the sentence does.

  2.  **Deconstruct the Slogan ("Nothing comes from nothing"):**
