answer: |-
  ### Desiderata for an Adequate Relationist Theory of Motion

  To defend relationism in a dissertation, you must demonstrate that your account is not merely a negative critique of substantivalism but a positive framework capable of grounding physical dynamics. The following list distinguishes between **Non-Negotiable Requirements** (conditions for empirical and logical adequacy) and **Factional Preferences** (conditions that distinguish specific schools of relationism, such as strict Machians vs. structural relationists).

  #### 1. The Ontological Parsimony Requirement
  *   **Requirement:** The theory must not posit the existence of spatial substantival entities (e.g., a container, a metric field existing independently of matter) that possess physical effects but lack material constitution.
  *   **Motivation:** This is the definitional core of relationism. If the theory posits a "substantivalized" spacetime that acts on matter (as in Newton's absolute space), it collapses into substantivalism.
  *   **Status:** **Non-Negotiable.**

  #### 2. The Dynamical Adequacy Requirement (Newton's Bucket & Two-Globes)
  *   **Requirement:** The theory must distinguish kinematically between inertial and non-inertial frames and explain the physical effects of rotation (e.g., the concavity of water in Newton's Bucket, the tension in the cord connecting Newton's Two-Globes) without appealing to absolute rotation.
  *   **Motivation:** Newton's arguments demonstrate that relative position/velocity between bodies is insufficient to explain inertial forces. An adequate theory must identify *what* relation (or relational structure) grounds the difference between a spinning bucket and a stationary one.
  *   **Status:** **Non-Negotiable.** (Failure here yields a theory that cannot account for basic mechanics.)

  #### 3. The Empty Universe Constraint
  *   **Requirement:** The theory must provide a determinate verdict on whether a single bucket (or two globes) spinning in an otherwise empty universe exhibits inertial forces (i.e., does the water climb the sides?).
  *   **Motivation:** This tests the supervenience base of inertia. If the water climbs, inertia appears intrinsic or absolute; if it does not, inertia is purely extrinsic. A theory cannot remain agnostic, as this determines its compatibility with Mach's Principle.
  *   **Status:** **Non-Negotiable** (The theory must *answer* this), though the *answer itself* is a **Factional Preference**. (Strict Machians say "no climb"; Permissive Relationists may say "climb" based on primitive relational laws.)

  #### 4. The Symmetry Recovery Requirement
  *   **Requirement:** The theory must explain why Newtonian mechanics exhibits Galilean symmetry (invariance under uniform velocity boosts) rather than full Leibnizian symmetry (invariance under boosts *and* rotations), despite positing a relational ontology that typically suggests the latter.
  *   **Motivation:** Leibnizian spacetime allows all motions to be relative, but empirical physics distinguishes rotation from non-rotation. A relationist account must derive the "absolute" nature of acceleration from relational premises without smuggling in absolute structure.
  *   **Status:** **Non-Negotiable.**

  #### 5. The Causal Supervenience Preference (Mach's Principle)
  *   **Requirement:** (Preference) Inertial structure should causally supervene on the distribution of matter in the universe. Inertia should not be a primitive law but a result of interaction with distant masses.
  *   **Motivation:** This is the strong Machian intuition that matter determines spacetime structure, not vice versa. It prevents inertia from becoming a "spooky" relational primitive.
  *   **Status:** **Factional Preference.** (Many modern relationists abandon this to save empirical adequacy, treating inertial structure as primitive but relational.)

  #### 6. The Relativistic Extension Requirement
  *   **Requirement:** The theory must articulate whether its relational account applies to Special and General Relativity or is restricted to classical mechanics. If restricted, it must justify why relationism fails in the relativistic regime.
  *   **Motivation:** General Relativity is often cited as the triumph of relationism, yet it admits vacuum solutions (spacetimes without matter). A classical relationist theory that cannot interface with modern physics risks obsolescence.
  *   **Status:** **Non-Negotiable** (Must address the interface), though **Factional Preference** determines if you demand full relational reduction of GR.

  ---

  ### Incompatibility Flag: The "Machian Trilemma"

  You must be prepared to argue that the following three desiderata cannot be jointly satisfied. This is the critical tension point for your dissertation:

  1.  **Strict Machian Supervenience:** Inertial properties are entirely determined by the distribution of matter (Desideratum #5).
  2.  **Empirical Adequacy in Vacuum:** The theory must accommodate the empirical success of theories that allow inertia in the absence of local matter (e.g., Newtonian vacuum or GR vacuum solutions like Schwarzschild spacetime).
  3.  **Relational Ontology:** No absolute spacetime structure exists independently of matter (Desideratum #1).

  **The Conflict:** If you hold (1) and (3), you must deny (2): in an empty universe, there can be no inertia (the bucket does not climb). However, this contradicts the standard interpretation of Newtonian mechanics and creates tension with GR vacuum solutions. If you hold (2) and (3), you must deny (1): you must admit primitive inertial laws or structures that do not supervene on matter (Permissive Relationism). If you hold (1) and (2), you likely violate (3): you must posit a field or structure that acts like matter but isn't (substantivalism).

  **Most Eliminative Requirement:** **Desideratum #2 (Dynamical Adequacy).**
  This is the single requirement that eliminates the most candidate theories. Naive relationism (reducing motion solely to changing distances between bodies) fails immediately here because changing distances cannot distinguish a rotating universe from a rotating bucket. Any theory that cannot mathematically recover the centrifugal forces in the Bucket experiment without positing absolute space is dead on arrival. This requirement forces you toward sophisticated accounts (e.g., Best-System Analysis, Shape Dynamics, or primitive relational laws) rather than simple reductionism.

  ---

  ### Scorecard: Leibniz-Style vs. Machian Dynamics

  **Leibniz-Style Primitive Relationism:**
  *   **Bucket/Globes:** Passes (by positing primitive laws of motion defined over relational configurations).
  *   **Empty Universe:** Passes (Water climbs; inertia is a law of relations, not dependent on distant matter).
  *   **Symmetry:** Struggles (Must explain why rotation is privileged over velocity without absolute space).
  *   **Mach's Principle:** Fails (Inertia does not supervene on matter distribution).
  *   **Verdict:** Ontologically safe, but sacrifices the causal explanation of *why* inertia exists.

  **Machian Relational Dynamics:**
  *   **Bucket/Globes:** Passes (in our actual universe, due to fixed stars).
  *   **Empty Universe:** Fails (Water remains flat; contradicts Newtonian counterfactuals).
  *   **Symmetry:** Passes (Rotation is relative to the "fixed stars," restoring full relativity of motion).
  *   **Mach's Principle:** Passes (Inertia is caused by mass distribution).
  *   **Verdict:** Causally satisfying, but empirically vulnerable in counterfactual or vacuum scenarios.
