      *   Criteria for board? Yes (Source triangulation, historiographical engagement).
      *   Honest treatment of opposing view? Yes (Risk of ideological gatekeeping).
      *   Tone? Academic, professional.

  6.  **Final Review of the "Denialism" aspect:** The prompt mentions the author calls it "mass mortality under wartime deportation" rather than "intentional extermination." This is a core tenet of denialism (denying intent). A history journal cannot publish a paper that ignores the scholarship on intent without engaging it. This is a methodological failure (ignoring counter-evidence). I will frame the rejection on this ground.

