answer: |-
  **To:** Editorial Board, [Journal Name]
  **From:** [Your Name]
  **Date:** [Date]
  **Re:** Recommendation regarding Manuscript [ID Number/Title]

  **Decision**
  I recommend that we **reject** this submission at the editorial stage, without sending it out for external peer review.

  **Rationale and Criteria for Evaluation**
  My recommendation is not based on the author's conclusion (a lower mortality figure) but on fundamental methodological exclusions that render the analysis historically incomplete. To resolve the current impasse and guide future submissions, I propose we adopt the following three criteria for evaluating controversial historical revisions:

  1.  **Source Triangulation:** Submissions must engage with all relevant classes of primary evidence. In the context of mass violence, excluding state records *or* survivor/diplomatic testimony *a priori* as "unverifiable" constitutes a methodological flaw, not a rigorous filter. Historical demography requires triangulating administrative data with qualitative accounts to account for under-registration and destruction of records.
  2.  **Historiographical Engagement:** Authors proposing a reclassification of events (e.g., from "extermination" to "deportation") must engage directly with the existing scholarship regarding intent. A paper cannot simply assert a new categorization without addressing the evidentiary basis of the prevailing consensus.
  3.  **Distinction Between Revision and Denial:** We must remain open to quantitative revisionism (e.g., adjusting death tolls based on new census data). However, we must distinguish this from narratives that systematically exclude evidence of culpability or intent. The threshold for publication is not whether the conclusion is comfortable, but whether the methodology accounts for the complexity of the source base.

  **Application to Current Submission**
  This manuscript fails the first two criteria. By dismissing diplomatic and survivor testimony at the outset, the author removes the primary evidence used to establish the *intent* behind the deportations. Consequently, the argument for reclassifying the event rests on a partial reading of the archive. While the demographic modeling may be mathematically sound, it is historically siloed.

  **The Strongest Counter-Argument**
  I want to address the concern raised by half of this board: that rejecting this paper risks turning peer review into ideological gatekeeping. This is a valid and serious worry. History relies on the willingness to revise settled numbers when new evidence or better methods emerge; we saw this with the Bombing of Dresden and the Gulag population estimates. If we reject a paper because its conclusion challenges a protected consensus, we undermine our credibility as a scholarly journal and chill legitimate inquiry. We must not become arbiters of orthodoxy.

  **Conclusion**
  However, protecting open inquiry does not require us to publish methodologically unsound work. We are not rejecting this paper because the death toll is lower; we are rejecting it because the author's method excludes the very evidence required to assess the nature of the violence. Accepting this paper would set a precedent that quantitative selectivity is a valid historical method. I propose we reject the manuscript but invite the author to resubmit if they can integrate the excluded source categories into their demographic model.
