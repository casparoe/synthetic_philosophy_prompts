  1.  **Analyze the Request:**
      *   **Role:** PhD student in Modern European History, member of an editorial board of a graduate-run journal.
      *   **Task:** Draft a short written recommendation for a board meeting regarding a controversial submission.
      *   **Submission Details:** Re-examines Armenian genocide death toll using census/archival data (demographic approach). Argues accepted figures overstate deaths. Proposes terminology change ("mass mortality under wartime deportation" vs. "intentional extermination"). Dismisses survivor/diplomatic testimony as unverifiable.
      *   **Board Context:** Split 50/50. One side sees it as denialism; the other sees it as legitimate historical revisionism based on method.
      *   **Requirements for the Draft:**
          1.  State a concrete decision (Reject OR Send for Review under conditions).
          2.  Set out criteria the board can apply (for this and future submissions).
          3.  Give an honest treatment of the strongest argument on the *opposing* side (steel-manning).
      *   **Tone:** Professional, academic, nuanced, decisive but collegial.

  2.  **Determine the Stance/Decision:**
      *   *Option A (Reject):* This aligns with the "denialism" concern. The paper dismisses key evidence (testimony) and challenges the legal/historical consensus on intent (genocide vs. deportation). However, outright rejection based on conclusion risks accusations of censorship and undermines the journal's commitment to open inquiry.
      *   *Option B (Send for Review):* This aligns with the "methodological rigor" concern. It allows the paper to be vetted by experts. However, if the methodology is fundamentally flawed (e.g., ignoring bias in Ottoman census data), peer review might just confirm rejection later, wasting time.
      *   *Option C (Reject, but with specific methodological grounds):* This is often the most responsible path for a student journal dealing with sensitive historical trauma. The issue isn't just the *conclusion*, it's the *methodological exclusion* of relevant source types (testimony) and the imposition of a legalistic framework ("intent") that contradicts the bulk of historiography without sufficient evidentiary weight.
      *   *Decision:* I will recommend **Reject**, but frame it around **methodological insufficiency and scope fit** rather than purely political/ethical objections. This satisfies the requirement to avoid "rejecting for conclusion" while acknowledging the serious implications of the claims. *Wait, let's reconsider.* If I recommend rejection, I need to be very careful not to look like I'm suppressing debate. If I recommend review, I need safeguards.
      *   *Better Decision:* **Send out for external peer review, but with specific criteria for the reviewers.** Why? Because as a graduate journal, we should model best practices. If the demography is bad, experts will catch it. If it's good, we publish. However, the prompt asks for *my* recommendation. A nuanced rejection is often safer for a student journal to avoid becoming a platform for denialism, *but* the prompt emphasizes the split board and the risk of "rejecting for conclusion."
      *   *Refined Decision:* **Reject.** Why? Because the prompt highlights that the author *sets aside survivor and diplomatic testimony at the outset as unverifiable.* In historical methodology, especially regarding the Armenian Genocide, excluding a major category of primary source evidence without justification is a methodological flaw, not just a difference of opinion. Furthermore, redefining the event from "genocide" to "deportation" is a legal/historical determination that requires engaging with the scholarship on intent, which the abstract suggests is dismissed. Therefore, the paper is methodologically unsound.
      *   *Alternative Refined Decision:* **Send for Review with Conditions.** This might be more intellectually honest for a history journal. It acknowledges the "revisionism is okay" argument. But the "denialism" argument is strong.
      *   *Final Choice:* I will recommend **Reject**, but base it on **methodological scope and source criticism** rather than the conclusion itself. This allows me to address the "don't reject for conclusion" crowd by showing *why* the method leads to an untenable conclusion.
      *   *Wait, actually:* The most balanced approach for a *graduate* journal (which is a training ground) might be to **Reject** but offer a detailed explanation that validates the *principle* of revisionism while highlighting the *failure* of this specific paper's methodology.
      *   *Let's try to find the middle ground:* Recommend **Rejection**, but explicitly state that revisionism is welcome *if* it meets specific evidentiary standards. This addresses the board split directly.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Decision:** Clear statement (Recommend Rejection).
      *   **Rationale (Criteria):** Define what makes a paper acceptable. Focus on source triangulation and engagement with existing historiography.
      *   **Steel-man the Opposition:** Acknowledge that numbers *should* be revised if evidence dictates, and that we shouldn't police conclusions.
      *   **Conclusion:** Reiterate the decision based on the criteria.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is rejecting it too close to "rejecting for conclusion"?
      *   *Fix:* I need to emphasize that the *method* (excluding testimony, ignoring intent scholarship) is the flaw, not the lower number itself. A lower number derived from *all* sources would be reviewable. A lower number derived from *selective* sources is not.
      *   *Tone Check:* Ensure I don't sound dogmatic. Use phrases like "methodological coherence," "source triangulation," "historiographical engagement."
      *   *The "Opposing Argument":* I need to genuinely validate the concern that peer review shouldn't be ideological. "We must not become gatekeepers of orthodoxy."
      *   *The "Criteria":* Needs to be actionable. 1. Triangulation of sources. 2. Engagement with intent. 3. Demographic rigor (acknowledging census limitations).

  5.  **Final Polish:** Check against constraints.
