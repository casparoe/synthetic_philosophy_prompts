answer: |-
  # The Ant Fugue Decision Tree: Does the Colony Have a Mind?

  **START:** We agree the colony behaves flexibly (adapts, defends, forages) in ways best described at the *colony* level, not the *ant* level.

  **1. Is ascribing a "mind" to the colony claiming a *real internal fact*, or just adopting a *useful predictive tool*?**
  *   **Useful Tool:** → **LEAF A: Dennett's Intentional Stance**
      *(It doesn't matter if there's "really" a mind; if treating it as a believer predicts its moves, it has beliefs.)*
  *   **Real Fact:** → Go to **Q2**.

  **2. Is the colony literally a single *biological organism* (a "superorganism")?**
  *   **Yes:** → **LEAF B: Superorganism View**
      *(The colony is one animal. The "mind" is just its physiology. Nothing spooky, just biology scaled up.)*
  *   **No:** → Go to **Q3**.

  **3. Is the colony's cleverness due to *learning within its lifetime*, or just *evolutionary hardwiring*?**
  *   **Evolution Only:** → **LEAF C: Deflationary / Eliminative**
      *(It's just blind algorithms. The "smart" behavior is in the genes, not the colony. No mind up there.)*
  *   **Lifetime Learning:** → Go to **Q4**.

  **4. Does it matter that the parts (ants) might have their own little minds? (Can minds stack?)**
  *   **Yes (Exclusion):** → **[EMPTY NODE: "Neural Exclusionism"]**
      *(See Footnote 1.)*
  *   **No (Stacking):** → Go to **Q5**.

  **5. Does the sheer *slowness* of colony processes count against it having a mind?**
  *   **Yes (Speed Matters):** → **[EMPTY NODE: "Speed Chauvinism"]**
      *(See Footnote 1.)*
  *   **No (Time-Invariant):** → Go to **Q6**.

  **6. Is the mind defined purely by *input/output organization*, or by *internal symbolic structure*?**
  *   **Input/Output:** → **LEAF D: Standard Functionalism**
      *(Substrate doesn't matter. If it computes the right functions, it thinks.)*
  *   **Internal Symbols:** → **LEAF E: Hofstadter's Emergentism**
      *(Mind requires active subsystems forming isomorphic "symbols." The hierarchy matters, not just the I/O.)*

  ***

  ### Philosopher's Footnotes (For Discussion)

  **1. The Empty Nodes (Why nobody lives here):**
  *   **Neural Exclusionism:** If you believe minds are real (Q1) and the system learns (Q3), claiming the parts' potential minds *block* the whole from having one is inconsistent. Usually, if you accept emergence, you accept stacking (like neurons → human mind).
  *   **Speed Chauvinism:** If you accept the organization is right (Q6), claiming it's not a mind *just* because it's slow is arbitrary. Most realists argue time-scale is irrelevant to ontology (a slow computer is still a computer).

  **2. The Blurry Leaves (Functionalism vs. Hofstadter):**
  *   **Leaf D & Leaf E** are notoriously hard to separate. Hofstadter *is* a functionalist, but he insists on **semantic isomorphism** (the internal states must *mean* something structurally) rather than just causal role. In practice, many groups find these two leaves merge into "Mind = Software."

  **3. The Deflationary Trap:**
  *   **Leaf C** often bleeds into **Leaf A**. If you say "It's just evolved coordination," a Dennettian will reply, "And that's exactly why the Intentional Stance works!" The difference is whether you think "belief" is *real* (C says no, A says 'real enough').

  **4. The Superorganism Shortcut:**
  *   **Leaf B** bypasses the "mind" debate entirely by changing the definition of "organism." If the colony is a body, asking if it has a mind is like asking if your liver has a mind—it's a category error, or it's just part of the whole.

  ***
  *Handout designed for GEB Reading Group — "Ant Fugue" Session*
