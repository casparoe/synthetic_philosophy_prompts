      *   *Crucial Point:* Salieri treats music as *language* (God speaking). Schopenhauer says music is *not* language. This is the biggest friction point. I need to highlight this.
      *   *The "Listener" Angle:* This is the strongest insight from the prompt. Schopenhauer cares about the Genius or the liberated spectator. Salieri is the *bound* spectator. That's the essay's hook.

  7.  **Final Polish:** Check dates (discussion on the 14th), ensure flow, check British spelling conventions. (e.g., "colour," "favour," "realise"). Ensure the distinction between 'Will' and 'will' is clear.

