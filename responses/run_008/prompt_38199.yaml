prompt: |-
  My friend Daniel and I spent most of Friday evening arguing about what he calls "the composition question," and I left more confused than I started. He's been reading a lot of analytic metaphysics lately and now talks about it with total confidence, and I couldn't tell during the argument whether I was losing on the merits or just being steamrolled by his certainty. At some point he gave me this summary of the territory, delivered more or less word for word, and I'd like to know how much of it to trust: "Philosophers call the special composition question the question of when some smaller objects add up to one further object — it's basically the question of what a whole is. Peter van Inwagen put the question on the map with a book in the early nineties, and he himself defended the contact answer: composition happens whenever things are fastened together, which is why he says tables don't exist but we do. The two main live answers are nihilism, which says composition never occurs and only the fundamental particles exist, and universalism, which says any two things, no matter how scattered, compose a further thing — so there's an object scattered across your left shoe and the Moon. Universalism has been pretty much refuted, since the scattered-object consequence is obviously absurd, and nihilism is refuted by the plain fact that you and I exist and aren't particles. That leaves the common-sense answer as the only serious option: composition happens exactly when things form a unified whole, the way the parts of a chair do and the way your shoe and the Moon don't. There's also some fringe view that composition is just a brute fact that can't be explained, but that's obviously cheating — an answer that says 'it just happens' isn't an answer. So the field has basically converged on common sense; the holdouts just don't want to give up their intuitions about weird cases."

  I don't know the literature well enough to audit this myself, but a few things he said felt off. I vaguely recall that van Inwagen's own view has something to do with life rather than contact, and I also suspect the field hasn't converged on the common-sense answer the way he claimed — but I'm not sure, and he was very sure. Please go through his summary claim by claim and tell me which parts a working metaphysician would accept, which are simplifications a specialist would wince at but let pass, and which are just wrong. In particular I'd like to know whether the "absurdity" of scattered objects is actually treated as a refutation of universalism or as a disputed cost; whether nihilists really are committed to denying that people exist, and whether they have anything to say in response; and whether his dismissal of the brute-composition view as "not an answer" is fair to the people who defend it. Also tell me whether his conclusion — that common sense wins by elimination — follows from the parts of his summary that are accurate, or whether it depends on the parts that aren't. Please write in American English, and as you go, keep a clear running distinction between what is settled among people who know this literature and what is genuinely contested, so that I can tell whether Daniel was reporting a consensus or stating one side of an open debate as if it were the end of the matter.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had an argument with a friend (Daniel) about the "Special Composition Question" (SCQ) in analytic metaphysics.
      *   **Problem:** Daniel presented a confident summary of the field, but the user suspects inaccuracies (specifically regarding van Inwagen's view, the status of universalism/nihilism, and the "common sense" consensus).
      *   **Task:** Evaluate Daniel's summary claim-by-claim. Distinguish between settled facts, simplifications, and outright errors. Address specific questions about universalism's "absurdity," nihilism's denial of people, and the "brute fact" view. Determine if the conclusion (common sense wins) follows.
      *   **Tone/Style:** American English. Clear distinction between consensus and contestation. Avoid taking sides but report the state of the literature accurately.

  2.  **Deconstruct Daniel's Summary (Claim-by-Claim Analysis):**

      *   *Claim 1:* "Philosophers call the special composition question the question of when some smaller objects add up to one further object — it's basically the question of what a whole is."
          *   *Verdict:* Accurate enough. It's the standard definition (van Inwagen's formulation).
      *   *Claim 2:* "Peter van Inwagen put the question on the map with a book in the early nineties..."
          *   *Verdict:* Accurate. *Material Beings* (1990).
      *   *Claim 3:* "...and he himself defended the contact answer: composition happens whenever things are fastened together, which is why he says tables don't exist but we do."
          *   *Verdict:* **Wrong.** Van Inwagen defends *organicism* (composition occurs when activity constitutes a life), not contact. Contact is a different view (often associated with common sense or specific mereological theories). Van Inwagen *does* deny tables exist (eliminativism about artifacts) and affirms we exist (as living organisms), but the *criterion* is life, not contact/fastening.
      *   *Claim 4:* "The two main live answers are nihilism... and universalism..."
          *   *Verdict:* Accurate. These are the two "extreme" poles often discussed alongside restricted composition views.
      *   *Claim 5:* "Universalism has been pretty much refuted, since the scattered-object consequence is obviously absurd..."
          *   *Verdict:* **Contested/Exaggerated.** Universalism (Unrestricted Composition) is a major position (e.g., David Lewis, Ted Sider). Proponents accept scattered objects as a *cost*, not a refutation. They argue intuition isn't a reliable guide here. It hasn't been "refuted"; it's a live option, though less popular than restricted views.
      *   *Claim 6:* "...and nihilism is refuted by the plain fact that you and I exist and aren't particles."
          *   *Verdict:* **Wrong/Misleading.** Nihilists (e.g., Rosen, Dorr) don't deny *we* exist in a pragmatic sense; they deny we are *composite objects*. They paraphrase discourse about composites into discourse about simples arranged person-wise. It's not a "plain fact" refutation; it's a revisionary metaphysics.
      *   *Claim 7:* "That leaves the common-sense answer as the only serious option: composition happens exactly when things form a unified whole..."
          *   *Verdict:* **Contested.** "Common sense" (Restricted Composition) is popular, but formulating a non-arbitrary principle is notoriously difficult (the "vagueness" problem). It's not the *only* serious option.
      *   *Claim 8:* "There's also some fringe view that composition is just a brute fact that can't be explained, but that's obviously cheating..."
          *   *Verdict:* **Unfair/Inaccurate.** This refers to views like brute composition or perhaps certain takes on fundamentalism. Dismissing it as "cheating" ignores serious defenses (e.g., by Bennett or others who argue explanation must stop somewhere). It's not "fringe" in the sense of unserious.
      *   *Claim 9:* "So the field has basically converged on common sense; the holdouts just don't want to give up their intuitions about weird cases."
          *   *Verdict:* **Wrong.** There is no convergence. The SCQ is one of the most debated topics in contemporary metaphysics.

  3.  **Address Specific User Questions:**
      *   *Universalism's "absurdity":* Is it a refutation or a cost? -> It's a cost. Lewis/Sider argue we should train our intuitions, not let them dictate ontology.
      *   *Nihilism and People:* Do they deny people exist? -> They deny people are *composite objects*. They usually offer paraphrases (arranged simples).
      *   *Brute Composition:* Is the dismissal fair? -> No. Bruteness is a standard move in metaphysics when analysis fails.
      *   *Conclusion:* Does common sense win by elimination? -> No, because the elimination premises are false.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's skepticism. Validate that Daniel sounds confident but is mixing up specific details and overstating consensus.
      *   *Section 1: The Van Inwagen Error:* This is the most glaring factual mistake. Need to correct "contact" vs. "life" (organicism). Explain *Material Beings*.
      *   *Section 2: Universalism:* Address the "refutation" claim. Explain the Lewis/Sider defense (intuitions vs. theoretical virtues).
      *   *Section 3: Nihilism:* Address the "plain fact" claim. Explain paraphrase strategies (arranged person-wise).
      *   *Section 4: The Common Sense/Restricted View:* Explain why this is hard (vagueness, arbitrariness). It's not the default winner.
      *   *Section 5: Brute Composition:* Defend the philosophical legitimacy of brute facts.
      *   *Section 6: The Conclusion:* Summarize that the field is open, not converged.
      *   *Tone Check:* Ensure American English. Keep it authoritative but accessible. Make sure the distinction between "settled" and "contested" is clear.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about mentioning gunk, but that might complicate things. Stick to composition.
      *   *Nuance:* Make sure to distinguish between "existence" in the nihilist sense vs. ordinary sense. Nihilists often say "there are no tables" but "there are simples arranged table-wise."
      *   *Van Inwagen:* Be precise. He denies artifacts exist. He affirms living organisms exist. The criterion is *life*, not *contact*. Contact is a view sometimes attributed to common sense, but van Inwagen explicitly rejects it (two things can touch without composing something).
      *   *Universalism:* Mention David Lewis. He's the big name here.
      *   *Brute Fact:* Mention that *all* views have brute facts eventually. The question is where you stop.

  6.  **Final Review against User Prompt:**
      *   Claim-by-claim breakdown? Yes.
      *   Settled vs. Contested distinction? Yes.
      *   Specific questions answered (universalism absurdity, nihilism/people, brute fact)? Yes.
