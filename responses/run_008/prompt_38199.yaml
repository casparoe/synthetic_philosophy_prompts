      *   American English? Yes.

  7.  **Final Polish:** Organize with clear headings for readability. Ensure the voice is helpful and clarifying, not just debunking Daniel. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to make sure I don't sound *too* technical. The user says they don't know the literature well. Keep terms like "mereology" explained or contextually clear. Ensure the distinction between "contact" and "organicism" is sharp because that was Daniel's biggest factual error.

  8.  **Final Output Structure:**
      *   Intro: Validate user's suspicion.
