answer: |-
  **MINISTRY OF RESOURCE EQUALITY**
  **Frequently Asked Questions Regarding Distributional Fairness**

  Welcome to the Ministry. We are pleased to confirm that the National Auction has concluded and all citizens have been issued their initial endowment of clams. Fairness is no longer a matter of debate; it is a matter of arithmetic. Below are clarifications regarding the Envy Test and the Hypothetical Insurance Scheme.

  **Q: My neighbor and I have identical resource bundles, but he is joyful and I am miserable. Is the system broken?**
  **A:** No. The Envy Test measures resources, not welfare. Fairness is achieved when no citizen prefers another's bundle of goods to their own. If you do not envy your neighbor's physical assets, clam reserves, or land titles, equality has been met. Your emotional state is a matter of internal metabolism, not distributive justice. We cannot redistribute resources to equalize happiness without violating the resource equality of those who are content with less.

  **Q: I have an expensive personality. I require opera and vintage champagne to be as satisfied as others are with beer. Why must I bear this cost?**
  **A:** Preferences are personal liabilities. In the initial auction, you had the same purchasing power as everyone else to bid for the resources required to satisfy your tastes. Choosing to cultivate a champagne palate when your budget aligns with beer is a choice of personality. To subsidize your expensive tastes would be to penalize citizens with modest preferences. You are free to enjoy your opera, provided you can afford the tickets without envying another's bundle.

  **Q: I was born with a severe disability. My resource bundle is insufficient for my needs.**
  **A:** We sympathize, but fairness has already been applied via the Hypothetical Insurance Market. We have calculated the premium you *would* have paid against such misfortune behind a veil of ignorance, had you been able to insure yourself before birth. Your compensation is set at the payout level of that hypothetical policy at standard market rates. This ensures you are compensated for brute luck, but not over-compensated relative to what a rational agent would have purchased.

  **Q: I invested my entire bundle in a high-risk venture and lost everything. Can I get a reset?**
  **A:** No. This is a matter of option luck. You chose to gamble your resources rather than hold them. When one engages in risky ventures, one accepts the possibility of loss as the price of the potential gain. To top up your bundle would be to tax those who made conservative choices. You are free to participate in the labor market with your remaining internal assets, but the state will not intervene in the results of your gambles.

  **Q: I have a talent for sculpture, but the auction drove the price of marble beyond my reach. Is this fair?**
  **A:** Talents are internal, but marble is a resource. The auction determines the social value of raw materials based on aggregate demand. If others valued the marble more highly than you did, they outbid you. Your talent does not grant a claim on external resources unless you can purchase them. The market has spoken regarding the cost of your career.

  **Q: Does my child's welfare count for anything in this calculation?**
  **A:** Children are considered part of a parent's resource bundle. Their welfare is your responsibility to manage using your clams. If your child is suffering due to a lack of resources, it indicates a distributional issue within your household, not a failure of the state. You were given equal means to provide for your dependents.

  **Q: This seems harsh.**
  **A:** Harshness is subjective. Fairness is objective. We invite you to submit a ticket if you suspect a calculation error in your clam endowment.

  *Ministry of Resource Equality: Because Fairness is a Bundle, Not a Feeling.*
