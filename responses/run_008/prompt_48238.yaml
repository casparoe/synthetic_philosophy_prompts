  **Note on Structure**

  The villanelle's rigid form mirrors the logical trap of the paradox itself: the two refrains (ontological denial vs. phenomenological report) cannot harmonize, yet the form forces them to coexist. Tercet 1 explores the **make-believe solution** (Walton), dismissing the emotion as a game; Tercet 2 tries the **thought theory** (imagery substituting for belief); Tercet 3 attempts **suspension of disbelief** (temporary ontological commitment). Tercets 4 and 5 demonstrate the failure of these escapes—the body reacts regardless of cognitive framing—leaving the final quatrain to rest in the unresolved tension rather than offering a synthesis.
