answer: |-
  This is one of the most persistent philosophical itch-scratches in modern sport. You have identified the central contradiction: the anti-doping regime claims to police a boundary between "therapy" and "enhancement," yet it routinely permits enhancements (LASIK, carbon-fiber plates, altitude simulation) while forbidding others that might be less effective or more dangerous.

  Here is a reconstruction of the implicit theory, an analysis of its necessity, and a projection of what happens if we abandon it.

  ### 1. The Implicit Theory: The Athlete as a "Moral Project"

  The edifice of modern anti-doping does not actually presuppose a "restore baseline, do not exceed" rule, despite the rhetoric of Therapeutic Use Exemptions (TUEs). If it did, LASIK for a shooter with 20/20 vision would be banned, yet it is not. Nor would altitude tents be allowed, as they artificially induce physiological changes (increased red blood cell count) identical to EPO.

  Instead, the system presupposes a theory of **Authentic Cultivation**.

  Under this view, the athlete is a moral project whose performance must be the result of a specific causal chain: **Innate Gift + Disciplined Effort → Performance.**

  *   **Innate Gift:** Your genetics are "given." They are the raw material. You are not responsible for them, nor punished for them. This is the "natural lottery."
  *   **Disciplined Effort:** This is the moral core. You must suffer to improve. Training is the acceptable technology because it requires time, pain, and will.
  *   **The Forbidden Shortcut:** Doping is banned not because it is "artificial" (altitude tents are artificial), but because it **bypasses the necessity of suffering.** EPO gives you the red blood cells of high-altitude training without the months of hypoxic stress. Steroids give you the recovery of a genetic freak without the decades of conditioning.

  **The LASIK Exception:** Why is LASIK allowed if it creates superhuman vision? Because it is viewed as **structural optimization** rather than **metabolic hijacking.** Surgery is permanent; it becomes part of the "hardware" of the athlete. Drugs are viewed as temporary, external "fuel" or "signals" that keep the engine running beyond its design specs without integrating into the self.

  **The TUE Exception:** Why allow asthmatics beta-agonists? This is the system admitting that the "Natural Lottery" includes bad luck. The TUE is not about fairness in outcome; it is about **inclusion in the game.** It says: "We require the body to be the engine, but if your engine came with a manufacturing defect, we will allow you a specific part to make it run *normally*, so you can enter the race." It is a charitable exemption to the rule of "no external aids," not a redefinition of the rule.

  **Summary of the Implicit View:** The athlete is a **bounded organism.** You may sharpen the blade (training, diet, surgery), and you may fix the nicks (medicine), but you may not change the metallurgy (genetics/metabolism) via chemical signaling.

  ### 2. Is This View Necessary? (The Underdetermination Thesis)

  The practice does **not** strictly need this view. In fact, the current system is radically underdetermined. It is a patchwork of three conflicting ethical frameworks, none of which fully explains the rules on their own.

  **A. The Fairness Story (Level Playing Field)**
  *   *Theory:* Ban advantages that are unequally distributed.
  *   *Failure:* Wealthy nations have better altitude tents, better surgeons, better diets, and better genetic screening. If fairness were the only metric, we would ban private coaching and nutritionists. Doping is banned partly because it is a "cheaper" way to buy an advantage that undermines the meritocracy of effort, but the fairness argument is porous.

  **B. The Health Story (Paternalism)**
  *   *Theory:* Ban substances that harm the athlete.
  *   *Failure:* Many banned substances are safer than legal ones. Caffeine and creatine are performance enhancers with strong safety profiles; some banned diuretics are relatively benign. Conversely, extreme weight cutting in boxing or MMA is legal and devastating. If health were the primary driver, we would regulate training loads and weight cuts, not just urine samples.
  *   *Note:* Health is often the *public* justification, but rarely the *private* logic.

  **C. The Authenticity Story (The "Spirit of Sport")**
  *   *Theory:* Sport is a test of human potential, not pharmaceutical potential.
  *   *Failure:* This is the closest to the "Moral Project" theory, but it relies on a fuzzy definition of "human." Is a human with a carbon-fiber prosthetic (like Oscar Pistorius) less authentic? Is a human with LASIK less authentic? The line is cultural, not biological.

  **The Pragmatic Reality:**
  The system is actually driven by **Regime Stability.**
  The natural/artificial line is maintained because it is the only line that is *enforceable enough* to preserve the spectacle. If we allowed everything, sport becomes engineering (see Part 3). If we banned everything (no shoes, no cooked food), it becomes primitivism. The current "Moral Project" view is a **Schelling Point**—a focal point that allows competitors, fans, and regulators to coordinate on what counts as a "win." It doesn't need to be philosophically consistent; it just needs to be stable enough to keep the audience believing the contest is about the *athlete*, not the *lab*.

  ### 3. Dropping the Line: The "Open Category" Future

  If we dropped the natural/artificial distinction entirely and moved to a regime of **Full Optimization** (often called the "Open Category" or "Bio-Liberal Sport"), anti-doping would vanish, replaced by **Safety and Classification.**

  **A. The Shift from "Cheating" to "Engineering"**
  Sport would cease to be a test of "who trained best" and become "who optimized best." The athlete becomes a platform for technology.
  *   *Example:* Instead of training to increase VO2 max, you buy a gene therapy package.
  *   *Result:* The locus of glory shifts from the individual to the team of bio-hackers. The "hero" narrative collapses.

  **B. The Health Catastrophe**
  Without the "Moral Project" brake, the market will drive optimization to the point of bodily destruction.
  *   Currently, athletes sacrifice health for gold, but there is a regulatory floor.
  *   In an Open Category, if a drug allows you to win but shortens your life by 10 years, rational actors seeking elite status will take it. Anti-doping would be replaced by **Informed Consent Protocols.** You wouldn't be banned for taking steroids; you'd have to sign a waiver acknowledging the liver damage risk.

  **C. The Spectator Problem & New Categories**
  Fans watch sport to see human limits. If the limits are defined by budget and tech, interest may wane (unless it becomes like Formula 1, where the tech *is* the spectacle).
  *   *Likely Outcome:* Sport would bifurcate.
      1.  **The Natural League:** Strictly enforced "pre-industrial" bodies. No drugs, no advanced tech. This becomes the "heritage" brand, preserving the "Moral Project."
      2.  **The Enhanced League:** Heavyweight fighting with exoskeletons, sprinters with myostatin inhibitors.

  **D. The End of "Fairness"**
  Fairness would no longer mean "same rules," it would mean "same access." If gene editing is legal, the injustice isn't that someone used it; it's that only the wealthy can afford the good edits. The class war becomes biological.

  ### Conclusion

  The current anti-doping edifice presupposes the **Athlete as a Cultivated Self**, where victory must be causally linked to effort and innate gift, not metabolic bypass.

  However, this view is **underdetermined**. It is a cultural compromise, not a logical necessity. It holds together only because we collectively agree to pretend that altitude tents are "environment" and EPO is "cheating," even though physiologically they are cousins.

  If we drop the line, we do not get "freedom"; we get **industrialization.** Anti-doping would not exist; instead, we would have **Safety Boards** and **Class Divisions.** We would stop asking "Is this fair?" and start asking "Is this safe?" and "Which weight class does this genome fit into?"

  The reason we keep the contradictory "Natural/Artificial" line is not because it is true, but because without it, the "Athlete" as a romantic hero ceases to exist. We ban the drugs to save the story, not the sport.
