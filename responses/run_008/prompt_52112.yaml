prompt: |-
  I'm a casualty actuary (15 years in, mostly pricing and reserving, so I'm fluent in things like expected loss, tail risk, parameter uncertainty vs. process risk, loading for ambiguity, correlated vs. independent exposures, solvency capital). I keep bumping into this argument about insect suffering in effective-altruist circles: even if the probability that insects are sentient is really small, there are so many of them — something like 10^18 alive at any moment — that the expected amount of suffering in the world from insects dwarfs everything else, so it should dominate our moral math. Please translate this "scale argument" into the vocabulary I actually use at work, as faithfully as you can: expected loss, risk diversification, uncertainty that averages out across a portfolio vs. uncertainty about a parameter that hits everything at once, loading for ambiguous probabilities, whatever genuinely fits. Then give me the residue report — what translates cleanly, what only translates with distortion, and what has no expression in actuarial terms at all.

  The thing I most want you to adress: in my world, a portfolio of many small similar risks is a good thing, the law of large numbers works for us. But my sense is the philosophers are relying on one uncertain fact — sentience, yes or no — that would apply to all insects at once. That looks to me like a single fully correlated exposure, not a diversified portfolio, and I'm not sure the expected-value arithmetic means the same thing in that shape. So: does the argument survive that reframing, and when something doesn't translate, is the residue telling me my vocabulary is missing something, or that the philosophers haven't pinned their own claim down? Take the role of a philosopher who also knows risk theory, start with a bit of brainstorming before committing, and think carefully — I'd rather you flag where the translation is shaky than make it look smoother than it is.
