      *   *Frequency/Severity:* Incidence of suffering events? Or is "being sentient" the frequency trigger? Let's treat "Sentience" as a switch. If On, Loss = Suffering. If Off, Loss = 0.
      *   *Process Risk:* Variation in suffering *given* sentience. (e.g., some insects suffer more than others). This diversifies across $N$.
      *   *Parameter Risk:* The probability $P(S)$ itself. Is it $0.001$ or $0.5$? This is the crux.
      *   *Correlation:* If one insect is sentient, does it imply others are? Biologically, yes. Sentience is a trait of the *class*, not an independent roll of the dice per individual. This is **Perfect Correlation** on the "Sentience Switch."
