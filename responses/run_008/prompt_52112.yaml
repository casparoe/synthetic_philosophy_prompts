      *   Actuarially: This is **Catastrophe Risk** or **Systemic Risk**, not Idiosyncratic Risk.
      *   If $S=0$, Loss $= 0$. If $S=1$, Loss $= N \times L$.
      *   Expected Value is still $p \times N \times L$.
