      *   **Goal:** Correct misconceptions, explain the nuances of the PBR theorem, clarify the assumptions involved, and explain why different interpretations survive.

  2.  **Deconstruct the PBR Theorem (Mental Check):**

      *   *What does PBR actually say?* It proves that if quantum predictions are correct *and* certain assumptions hold, then distinct quantum states must correspond to disjoint physical states ($\psi$ is ontic).
      *   *What are the assumptions?*
          1.  **Preparation Independence:** If I prepare two systems independently, their physical states are independent. (This is the big one).
          2.  **Realism (Ontological Models Framework):** There is an underlying physical state $\lambda$.
          3.  **Measurement Response:** Measurements reveal properties of $\lambda$.
