      *   *Does it kill Copenhagen?* Not necessarily. Copenhagen is often agnostic or instrumentalist. It doesn't necessarily posit an underlying $\lambda$ in the way PBR requires.
      *   *Does it confirm Bohm?* Bohm is $\psi$-ontic, so it's consistent with PBR. But PBR doesn't prove *hidden variables* (particles), only that the wavefunction itself can't be merely statistical overlap of underlying states *if* preparation independence holds.
      *   *What about QBism?* QBism rejects the idea that the wavefunction represents an external reality at all. It rejects the "Ontological Models Framework" itself. They don't ignore PBR; they reject the premises.

