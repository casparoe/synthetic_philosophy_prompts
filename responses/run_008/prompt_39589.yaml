answer: |-
  This is a fantastic question that cuts right to the heart of modern quantum foundations. You have grasped the *spirit* of the Pusey-Barrett-Rudolph (PBR) theorem correctly, but there are some crucial technical nuances regarding its **assumptions** and **scope** that explain why the debate is very much alive.

  Here is the breakdown of why PBR didn't end the debate, why Copenhagen and QBism survive, and why it doesn't automatically crown Bohmian mechanics the winner.

  ### 1. Did they "prove" it experimentally?
  **Theorem vs. Experiment:** PBR is primarily a **no-go theorem**, not an experimental discovery like the Higgs boson. It is a mathematical proof that says: *"If you assume A, B, and C, then the wavefunction must be ontic (real)."*

  There have been experimental tests (e.g., by Ringbauer et al. in 2015) that verified the quantum predictions PBR relies on. However, like Bell's Theorem, the power of PBR lies in its **assumptions**. If you reject one of the assumptions, the conclusion doesn't follow. The experiments confirm quantum mechanics (which we already knew); they don't confirm the *interpretation* of the assumptions.

  ### 2. The "Preparation Independence" Loophole
  This is the single biggest reason why $\psi$-epistemic views are not dead.

  The PBR theorem relies heavily on an assumption called **Preparation Independence**.
  *   **The Assumption:** If I prepare two particles in two separate labs far apart, the physical state ($\lambda$) of particle 1 is independent of the physical state of particle 2.
  *   **The PBR Logic:** If $\psi$ were just knowledge (epistemic), two different wavefunctions could correspond to the same underlying physical reality $\lambda$ (overlap). PBR shows that if you prepare independent systems, this overlap leads to a contradiction with quantum predictions.
  *   **The Counter-Argument:** Many interpretations reject Preparation Independence. If the universe is fundamentally holistic (non-separable), then "independent preparation" is an illusion.
      *   **Copenhagen/Bohr:** Often argues that the experimental arrangement defines the reality. You cannot speak of the "state" independent of the measurement context.
      *   **QBism:** Explicitly rejects the idea that there is a "view from nowhere" where preparations are objectively independent.

  So, $\psi$-epistemic models survive by saying: *"The wavefunctions overlap because the underlying realities are correlated in a way your 'independence' assumption forbids."*

  ### 3. Why Copenhagen Survives
  You asked why people still call themselves Copenhagen-ish. The answer is that standard Copenhagen is often **instrumentalist** or **anti-realist**.

  *   **The Ontological Models Framework:** PBR operates within a specific framework called the "Ontological Models Framework." It assumes there *is* an underlying physical state $\lambda$ that exists independently of observation.
  *   **Copenhagen's Escape:** Many Copenhagen adherents simply deny the premise. They say, "There is no $\lambda$." The wavefunction is a tool for calculating probabilities of measurement outcomes. It is not describing a hidden reality; it is describing the **phenomena**.
  *   If you believe the wavefunction is just a catalog of expectations for future experiences (which is close to the original Bohr view), PBR doesn't apply to you because you never claimed $\psi$ represented a physical object in the first place. You claimed it represents **information about measurement outcomes**.

  ### 4. Does PBR Confirm Bohmian Mechanics?
  This is a common misconception. PBR makes Bohmian mechanics **consistent**, but it does not **confirm** it.

  *   **$\psi$-Ontic vs. Bohm:** PBR proves that if there is a reality, $\psi$ must be part of it ($\psi$-ontic). Bohmian mechanics is indeed $\psi$-ontic (the pilot wave is real). So, Bohm survives PBR.
  *   **But so do others:** Many other interpretations are also $\psi$-ontic.
      *   **Many Worlds (Everett):** The wavefunction is the only reality. PBR is perfectly happy with Many Worlds.
      *   **GRW (Collapse Models):** The wavefunction is a real physical field that occasionally collapses. PBR is happy with GRW.
  *   **The Missing Piece:** PBR says "The wavefunction is real." It does **not** say "There are particles guided by the wavefunction." Bohm requires *both* the real wavefunction *and* the particles. PBR says nothing about the particles. Therefore, PBR does not distinguish between Bohm, Many Worlds, or GRW. They are all $\psi$-ontic.

  ### 5. What are the QBists doing? (Are they ignoring it?)
  QBists (Quantum Bayesians) are definitely not ignoring PBR. In fact, they love talking about it because it clarifies their position.

  *   **QBism's Stance:** QBism asserts that the wavefunction is purely subjective—it represents an agent's degrees of belief.
  *   **Rejection of the Framework:** PBR assumes that $\psi$ represents a state of nature. QBism says, "No, $\psi$ represents a state of **mind**."
  *   **The Resolution:** When PBR says "Distinct quantum states must correspond to disjoint physical states," the QBist replies: "We agree that distinct physical states are disjoint. But we deny that the quantum state *is* a physical state."
  *   For a QBist, the PBR theorem is a proof that **you cannot treat the wavefunction as both subjective knowledge AND an objective physical state simultaneously.** Since QBism chooses "subjective knowledge," they simply discard the idea that $\psi$ maps to an objective $\lambda$. They view PBR as a theorem that rules out a specific type of "hybrid" realism, not subjective Bayesianism.

  ### Summary: Why the debate continues
  The debate continues because PBR forces you to choose which "pill" to swallow, but it doesn't force you to swallow a specific one.

  1.  **Accept $\psi$ is Real ($\psi$-ontic):** You can be Bohmian, Many Worlds, or GRW. (PBR is happy).
  2.  **Reject Preparation Independence:** You can be a holistic $\psi$-epistemic theorist. (PBR doesn't apply).
  3.  **Reject the Ontological Framework:** You can be Copenhagen or QBist. You deny that the goal of physics is to map $\psi$ to an underlying $\lambda$. (PBR doesn't apply).

  **The Bottom Line:**
  PBR proved that **if** you want a realist model of quantum mechanics **and** you believe in independent preparations, **then** the wavefunction must be physical.

  It did not prove that we *must* have a realist model. It did not prove that preparations *are* independent. And it certainly did not prove that Bohm's particles exist. Foundations is debated because physicists disagree on which of those assumptions is the one worth sacrificing.

  *   **Bohmians** sacrifice locality (keep realism).
  *   **Many Worlders** sacrifice single outcomes (keep realism).
  *   **Copenhagen/QBists** sacrifice realism about the wavefunction (keep the formalism).

  PBR just made the "sacrifice realism about the wavefunction" option slightly more expensive, but not impossible.
