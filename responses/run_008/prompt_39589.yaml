  Quick question about the PBR theorem that's been bugging me. From what I understand they actually ran the experment and proved the wavefunction is a real physical thing and not just bookkeeping about our knowledge, right? So if psi-epistemic views are experimentally falsified now, why do people still call themselves Copenhagen-ish or whatever, and why is this even still debated in foundations? And second thing -- doesn't the theorem basically confirm Bohmian mechanics? Cause Bohm's wavefunction is exactly this real field pushing the particles around, so psi-ontic should just mean Bohm was right all along, no? Seems to me the only way to stay psi-epistemic after PBR is to just deny quantum mechanics itself, which I assume is not what the QBism people are doing... but then what are they actually doing, just ignoring the result? Feels like I'm missing something here.
