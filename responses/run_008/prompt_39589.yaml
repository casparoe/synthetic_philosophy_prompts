      *   *Point 3: "Why do people still call themselves Copenhagen-ish..."*
          *   Reason: Copenhagen often denies the premise that there is a deeper reality $\lambda$ to begin with, or rejects Preparation Independence (holism).
      *   *Point 4: "Doesn't the theorem basically confirm Bohmian mechanics?"*
          *   Reason: It makes Bohm *compatible*, but doesn't prove the particle part of Bohm. Many $\psi$-ontic views exist (Many Worlds, GRW, etc.). PBR doesn't pick a winner among ontic views.
      *   *Point 5: "QBism... ignoring the result?"*
          *   Reason: QBism rejects the framework. For QBism, $\psi$ is user information. PBR assumes $\psi$ represents a state of nature $\lambda$. QBism says "No, it represents *my* state of belief." They bypass the theorem by rejecting the ontology question entirely.

