  8.  **Tone:** Academic, analytical, sensitive to both the text and the philosophy. (Self-Correction: Avoid getting too bogged down in Kant exegesis; keep the focus on Hugo's dramatization).

  9.  **Final Polish:** Check for flow and clarity. Ensure the distinction between "agent-relative" (my duty) and "agent-neutral" (the best outcome) is clear in the analysis of Valjean. (Valjean chooses agent-relative: *I* cannot be the cause of this injustice, even if *the world* is worse off).

