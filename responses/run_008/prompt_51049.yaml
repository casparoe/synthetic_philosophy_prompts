  **OFFICE OF COMMEMORATIVE CONSISTENCY**
  **STAFF HANDBOOK AND PROCEDURAL MANUAL (REV. 14)**

  **1.0 JURISDICTIONAL SCOPE AND PHILOSOPHY**
  Pursuant to Article IX of the Constitution, staff must rigorously distinguish between Operational Truth and Ceremonial Truth. Operational Truth, governed by the National Archives, applies to property lines, tax liabilities, criminal statutes, and infrastructure maintenance. Ceremonial Truth, governed by Collective Memory, applies to school curricula, national holidays, statue inscriptions, and national self-regard. In instances where the Documentary Record conflicts with Collective Memory, Ceremonial Truth takes precedence in matters of identity. Staff are reminded that while accuracy is a virtue of the Archives, cohesion is the virtue of the Republic. Do not attempt to reconcile the two; manage the boundary.

  **2.0 CONFLICTING REGIONAL NARRATIVES**
  When two municipalities commemorate incompatible versions of the same historical event (e.g., the Battle of Vernal Ridge), OCC supervisors shall not adjudicate factual accuracy. To declare one version correct is to invalidate the local identity of the other. Instead, implement Temporal Separation Protocol. Schedule District A's victory parade for May 1st and District B's liberation ceremony for May 2nd. Ensure signage reflects local vernacular without cross-referencing neighboring districts. If asked by media, state that the event possesses "multifaceted historical resonance." Never use the word "contradiction."

  **3.0 CHRONOLOGICAL ADJUSTMENTS**
  Archivists discovering documentary evidence that contradates an established national date (e.g., Independence Day) must file Form 12-B (Notice of Chronological Discrepancy) prior to updating any catalog. Approval requires unanimous consent from the Memory Council. Note: A date held in public affection for longer than fifty years acquires Protected Status. Correcting a Protected Date is prohibited unless the error causes operational failure (e.g., banks opening on a holiday). In such cases, issue a press release stating the date was "symbolically adjusted" rather than "corrected."

  **4.0 FOUNDING NARRATIVE RENDERINGS**
  The National Founding Story may be re-rendered to reflect contemporary values no more than once per generation (25 years). Frequent revisions suggest institutional instability; total stagnation suggests irrelevance. When revising, ensure the protagonist remains virtuous, even if specific actions are reclassified. For example, a strategic retreat may be reclassified as a tactical pause without altering the outcome of the ceremony. Do not introduce new villains unless the old ones have been fully rehabilitated by time.

  **5.0 ADVERSE DOCUMENTATION**
  In cases where the Documentary Record is factually sound but morally embarrassing (e.g., evidence of collaboration during the Occupation), staff shall segregate records into two categories: Legal Archive and Ceremonial Vault. Materials in the Ceremonial Vault are unavailable for schooling, anniversary speeches, or tourist brochures but remain accessible for litigation regarding pension claims or property disputes. Staff must never reference Ceremonial Vault materials during toast ceremonies. If a journalist requests Vault materials, direct them to the Legal Archive intake desk, which is closed on holidays.

  **6.0 UNRESOLVED NATIONAL DISAGREEMENT**
  In the event the nation cannot agree on a single memory (e.g., the Cause of the Great Fracture), OCC staff shall declare a Day of Reflective Silence. No official narrative shall be published. Monuments shall remain covered until consensus emerges. If consensus does not emerge within five years, uncover monuments and install plaques citing "Complex Historical Factors." Do not elaborate on the complexity.

  **APPENDIX A: REQUIRED FORMS**
  *   **Form 12-B:** Notice of Chronological Discrepancy (Archival Use Only)
  *   **Form 44-M:** Narrative Variance Waiver (School Districts)
  *   **Form 99-C:** Request for Statue Relocation or Recontextualization
  *   **Form 88-V:** Verification of Public Affection (Required for Protected Dates)
  *   **Form 00-Z:** Segregation of Adverse Documentation (Legal vs. Ceremonial)
