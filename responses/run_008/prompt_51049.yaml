prompt: |-
  Write a satirical staff handbook, roughly 600 words, for the Office of Commemorative Consistency in a small fictional republic whose constitution provides that where the nation's collective memory conflicts with the documentary record, memory governs "all matters of ceremony, schooling, and national self-regard," while the archives govern everything else. Format it as numbered sections in a deadpan bureaucratic voice, with an appendix of forms.

  The jokes should come from the real dynamics of collective memory rather than from invented ones: that memory is selective and present-serving, smoothing events into usable narratives; that it is transmitted through anniversaries, monuments, and school lessons rather than documents; that it is plural, so different communities remember the same event differently; and that revising a settled memory feels like an affront even when the records are unambiguous. Build the Office's procedures around these facts—for example, a protocol for when two districts commemorate incompatible versions of the same battle, a form an archivist must file before noting that a cherished date cannot be right, a rule about how often the founding story may be re-rendered, and a clause on what happens when the records are simply embarrassing. The satire should stay deadpan and legible without winking: a reader who knows the literature on memory versus history should find it fair, and a reader who doesn't should still follow it. Do not resolve, inside the handbook, the question of whose memory counts when the nation does not agree with itself. Write the piece in American English.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Satirical staff handbook for the "Office of Commemorative Consistency" (OCC) in a small fictional republic.
      *   **Premise:** The Constitution states that where collective memory conflicts with documentary record, memory governs "ceremony, schooling, and national self-regard," while archives govern "everything else."
      *   **Length:** Roughly 600 words.
      *   **Format:** Numbered sections, deadpan bureaucratic voice, appendix of forms.
      *   **Content/Jokes:** Based on real dynamics of collective memory (selective, present-serving, transmitted via monuments/anniversaries, plural/conflicting, revision feels like an affront).
      *   **Specific Examples to Include:** Protocol for incompatible district commemorations, form for archivists noting incorrect dates, rule on re-rendering founding stories, clause on embarrassing records.
      *   **Constraint:** Do not resolve whose memory counts when the nation disagrees.
      *   **Tone:** Deadpan, bureaucratic, no winking. Accessible to both experts and laypeople.
      *   **Language:** American English.

  2.  **Deconstruct the Premise:**
      *   The core tension is between *History* (archives, documents, facts) and *Memory* (feelings, narratives, identity).
      *   The Constitution privileges Memory for identity purposes but Archives for practical purposes (taxes, laws, etc.).
      *   The OCC's job is to manage the friction between these two realms.

  3.  **Drafting - Section by Section:**

      *   **Header:** Official looking title.
      *   **Section 1: Mission Statement.** Define the scope. Memory rules feelings, Archives rules facts.
      *   **Section 2: Conflict Resolution (Districts).** How to handle two towns remembering a battle differently. Don't solve it, just manage the overlap.
      *   **Section 3: Archival Corrections.** The paperwork needed to contradict a cherished date. Make it burdensome.
      *   **Section 4: Founding Narratives.** How often can the story change? Too often looks unstable, never looks rigid.
      *   **Section 5: Embarrassing Records.** What to do when the truth is ugly. Segregate it.
      *   **Appendix:** List the forms needed.

  4.  **Drafting - Tone and Voice:**
      *   Use bureaucratic jargon ("prioritization matrix," "statutory deference," "mitigation").
      *   Avoid overt comedy. The humor comes from the absurdity of the rules treating feelings as superior to facts in specific contexts.
      *   Keep it tight to hit the word count (around 600).

  5.  **Drafting - Content (Iterative Process):**

      *   *Intro:* Welcome to the OCC.
      *   *1.0 Jurisdiction:* Cite the Constitution. Memory = Ceremony/Schools. Archives = Taxes/Property.
      *   *2.0 Competing Narratives:* If District A and District B remember the Battle of Oak Hill differently, do not declare a winner. Schedule parades on different days.
      *   *3.0 Chronological Discrepancies:* If an archivist finds a document proving the Founding Day is wrong, they must file Form 12-B. Approval requires a 2/3 vote of the Memory Council.
      *   *4.0 Narrative Refresh:* The Founding Story can be re-rendered every 25 years. Not sooner.
      *   *5.0 Adverse Documentation:* If records show something shameful (e.g., a founder was a traitor), seal the record for "Ceremonial Purposes" but keep it for "Legal Purposes."
      *   *Appendix:* List forms like "Request for Chronological Adjustment," "Narrative Variance Waiver."

  6.  **Refining and Polishing (Checking Word Count and Constraints):**
      *   *Check:* Did I resolve whose memory counts? No, keep it ambiguous/procedural.
      *   *Check:* Is it deadpan? Yes, avoid exclamation points or sarcasm markers.
      *   *Check:* Word count. Need to expand slightly to ensure I hit near 600 without fluff. I need to elaborate on the procedures to make them sound more bureaucratic.

      *   *Revision:* Expand on the "Embarrassing Records" clause. Make the distinction between "Legal Truth" and "Ceremonial Truth" clearer. Expand on the form names in the appendix.

  7.  **Final Review against constraints:**
      *   American English.
      *   No winking.
      *   Focus on memory dynamics (selectivity, transmission, pluralism).

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally suggest the Archives are *wrong*. The Archives are right, but Memory overrides them for specific purposes. That's the key constitutional twist.

      *(Word Count Check)*: If it's too short, I can expand the Appendix descriptions. If too long, trim the intro.

      *Let's write.*

      **Drafting text:**
      OFFICE OF COMMEMORATIVE CONSISTENCY
      STAFF HANDBOOK AND PROCEDURAL MANUAL (REV. 14)

      1.0 JURISDICTIONAL SCOPE
      Pursuant to Article IX of the Constitution, staff must distinguish between Operational Truth and Ceremonial Truth. Operational Truth (governed by the National Archives) applies to property lines, tax liabilities, and criminal statutes. Ceremonial Truth (governed by Collective Memory) applies to school curricula, national holidays, and statue inscriptions. In instances where Documentary Record conflicts with Collective Memory, Ceremonial Truth takes precedence in matters of national self-regard. Staff are reminded that accuracy is a secondary virtue to cohesion.

      2.0 CONFLICTING REGIONAL NARRATIVES
      When two municipalities commemorate incompatible versions of the same historical event (e.g., the Battle of Vernal Ridge), OCC supervisors shall not adjudicate factual accuracy. Instead, implement Temporal Separation Protocol. Schedule District A's victory parade for May 1st and District B's liberation ceremony for May 2nd. Ensure signage reflects local vernacular. Do not issue press releases acknowledging the discrepancy. If asked by media, state that the event possesses "multifaceted historical resonance."

      3.0 CHRONOLOGICAL ADJUSTMENTS
      Archivists discovering documentary evidence that contradicts a established national date (e.g., Independence Day) must file Form 12-B (Notice of Chronological Discrepancy) prior to updating any catalog. Approval requires consensus from the Memory Council. Note: A date held in public affection for longer than fifty years acquires Protected Status. Correcting a Protected Date requires a constitutional amendment or a significant decline in public morale.

      4.0 FOUNDING NARRATIVE RENDERINGS
      The National Founding Story may be re-rendered to reflect contemporary values no more than once per generation (25 years). Frequent revisions suggest instability; total stagnation suggests irrelevance. When revising, ensure the protagonist remains virtuous, even if specific actions are reclassified. For example, a strategic retreat may be reclassified as a tactical pause without altering the outcome of the ceremony.

      5.0 ADVERSE DOCUMENTATION
      In cases where the Documentary Record is factually sound but morally embarrassing (e.g., evidence of collaboration during the Occupation), staff shall segregate records into two categories: Legal Archive and Ceremonial Vault. Materials in the Ceremonial Vault are unavailable for schooling or anniversary speeches but remain accessible for litigation regarding pension claims. Staff must never reference Ceremonial Vault materials during toast ceremonies.

      6.0 UNRESOLVED NATIONAL DISAGREEMENT
      In the event the nation cannot agree on a single memory (e.g., the Cause of the Great Fracture), OCC staff shall declare a Day of Reflective Silence. No narrative shall be published. Monuments shall remain covered until consensus emerges. If consensus does not emerge within five years, uncover monuments and install plaques citing "Complex Historical Factors."

      APPENDIX A: REQUIRED FORMS
      Form 12-B: Notice of Chronological Discrepancy (Archival Use Only)
      Form 44-M: Narrative Variance Waiver (School Districts)
      Form 99-C: Request for Statue Relocation or Recontextualization
      Form 88-V: Verification of Public Affection (Required for Protected Dates)
      Form 00-Z: Segregation of Adverse Documentation (Legal vs. Ceremonial)

