answer: |-
  The Director of Dining Services at a mid-sized university faces a constrained ethical problem. The administration has mandated that the number of meat-based meals served per term remains fixed; the budget and logistics for animal protein are locked in. The decision is not *whether* to serve meat, but *which* meat: beef or chicken. While this might appear to be a matter of price or preference, it is, inescapably, a question of moral arithmetic. The choice forces a confrontation with four layered controversies: the count of individuals killed, the moral weight of those individuals, the collateral damage of crop agriculture, and the radical uncertainty regarding wild animal populations. To reach a verdict, we must navigate these layers without relying on the comfort of authority, weighing the known harms of industrial slaughter against the speculative harms of land use.

  The first layer is the arithmetic of small bodies. This is the most straightforward and often the most decisive consideration. A single steer yields roughly 400 pounds of boneless meat, whereas a broiler chicken yields approximately 4 pounds. To provide the same amount of protein, a kitchen must process roughly one hundred chickens for every one cow. If the moral currency is "deaths caused," the calculation is brutal and clear: serving chicken results in two orders of magnitude more killing than serving beef.

  However, we must ask if "deaths caused" is the correct metric. A utilitarian concerned with suffering might argue that the duration and intensity of misery matter more than the binary event of death. A broiler chicken lives for roughly six weeks before slaughter; a beef steer lives for roughly eighteen months. If the suffering per day is identical, the cow suffers roughly twelve times longer than the chicken. Yet, because one cow replaces one hundred chickens, the aggregate suffering-days still favor beef. One hundred chickens living six weeks each equals roughly sixteen years of aggregate life; one cow living eighteen months equals one and a half years. Unless the daily suffering of a factory-farmed cow is more than ten times more intense than that of a factory-farmed chicken—a claim for which there is little evidence—the "Arithmetic of Small Bodies" holds. Beef minimizes the total volume of experienced suffering simply by minimizing the number of subjects subjected to it.

  This leads to the second consideration: the distinction between counting animals and weighting them. The arithmetic above assumes a chicken and a cow count as one unit each. But moral philosophy often suggests that moral weight should scale with cognitive complexity, neural density, or the capacity for future-oriented suffering. If a cow possesses significantly greater cognitive depth than a chicken, perhaps one cow's death outweighs one hundred chickens' deaths.

  This dispute is difficult to resolve empirically, as we lack a precise "sentience meter." However, we can assess the plausibility of the weighting required to overturn the arithmetic. To make the chicken option morally equivalent to the beef option on the basis of cognitive weight, one would have to argue that a cow is morally worth more than one hundred chickens. While cows are undeniably more cognitively complex, assigning them a differential weight of 100:1 based on neuron count is speculative and risks ad hoc speciesism. It implies that the suffering of a chicken is negligible until aggregated to an extreme degree. Given the uncertainty, a precautionary principle suggests we should not discount the chicken's suffering so heavily. If we treat them as equals, beef wins. If we weight the cow higher, the margin narrows, but it is unlikely to invert the 100:1 ratio of individuals. Therefore, even acknowledging cognitive differences, the sheer disparity in numbers keeps beef as the lesser evil in a meat-mandatory scenario.

  The third and fourth considerations complicate the picture by expanding the boundary of the moral calculation beyond the farmed animals themselves. This is the domain of the "crop-deaths" argument, associated with philosopher Steven Davis, and the "wild-animal wildcard." The argument posits that a vegetarian diet reliant on conventional cropping causes massive harm to field animals (mice, voles, rabbits) via harvesting combines and pesticides. In contrast, a diet based on pasture-raised ruminants ostensibly avoids this, as grass is grazed, not harvested by machine. If true, this suggests that a meat-eater on a pasture-based diet might kill fewer vertebrates than a vegetarian.

  However, this argument relies on several fragile assumptions that must be scrutinized before influencing policy. First, it compares an idealized pasture system with a real-world cropping system. In reality, most beef cattle, even those labeled "grass-fed," consume harvested grain during winter or finishing periods. If the beef supply chain involves grain, the field animals die regardless of whether the grain feeds a human or a cow. Second, because ruminants are less feed-efficient than humans eating crops directly, pasture-based beef requires significantly more land per calorie produced. A hectare of pasture supports fewer human calories than a hectare of crops. Therefore, to feed the same population, a beef-based diet requires more land conversion. More land under management means more habitat disruption, potentially displacing or killing more wild animals over a larger area, even if the method of death is less mechanized than a combine.

  This introduces the wild-animal wildcard: the moral status of the wild populations inhabiting that land. If we grant moral weight to small wild vertebrates, the land-use inefficiency of beef suggests it causes more harm through habitat displacement. If we grant moral weight to invertebrates (insects, soil nematodes), the calculation becomes dizzyingly uncertain. Plowing and pesticides kill astronomical numbers of invertebrates. But grazing also alters ecosystems, affecting insect populations in ways that are hard to model.

  Here we face profound moral and empirical uncertainty. We do not know the density of sentient lives per hectare of pasture versus cropland, nor do we know the moral status of a bee or a mouse relative to a cow. How should a decision-maker act under such uncertainty? One approach is expected value: estimate the probabilities and sum the outcomes. But the numbers here are too speculative; assigning a probability to the sentience of invertebrates is guesswork. Another approach is *maximin*: choose the option with the least worst-case scenario. The worst-case for cropping is mass invertebrate death. The worst-case for pasture is mass vertebrate displacement plus the certain, documented suffering of the farmed cow.

  However, for the specific decision at hand—the University Dining Service choosing between beef and chicken—this wild-animal wildcard largely cancels out. Both beef and chicken production rely on agriculture. Chickens are almost exclusively grain-fed; beef is partially grain-fed. Both systems necessitate cropland somewhere in the supply chain to support the animals' caloric needs, especially given the inefficiency of converting plant protein to animal protein. Since chicken has a better feed-conversion ratio than beef, producing chicken meat requires less cropland than producing beef meat. If crop harvesting is the primary driver of wild animal death, the chicken system, requiring less land, might actually spare more wild lives than the beef system. This counters the Davis argument when applied to *industrial* meat comparisons. The Davis argument is primarily a challenge to vegetarianism, not a license to choose beef over chicken. In a beef-vs-chicken contest, the inefficiency of beef means it likely drives more crop production (for feed) and more land use (for pasture) than chicken, potentially exacerbating wild animal harm.

  This leaves us with a tension. The "Arithmetic of Small Bodies" favors beef (fewer farmed individuals killed). The "Land-Use/Crop-Death" logic favors chicken (less land and feed required, potentially fewer wild animals affected). Which term dominates the equation?

  To resolve this, we must flag a heavy-lifting assumption: *The suffering of the farmed animal is the most certain and morally weighty term in the equation.* The death of the cow or chicken is direct, intentional, and guaranteed. The death of field mice or invertebrates is collateral, variable, and empirically contested. Furthermore, the farmed animals are the primary subjects of our moral concern in this context; they are the ones brought into existence solely to be killed. Wild animals have a claim to their habitat, but the farmed animal has a claim against being tortured and slaughtered. Given the certainty of the farmed animal's fate versus the speculation surrounding field animals, the moral agent should prioritize the known harm over the speculative harm.

  Moreover, the "Arithmetic of Small Bodies" is robust against the land-use counter-argument. Even if beef requires more land, the ratio of farmed individuals killed (1 cow vs. 100 chickens) is so stark that the wild animal deaths would need to be disproportionately higher in the beef supply chain to offset it. While beef requires more land, it does not require 100 times more land than chicken production. Therefore, the reduction in farmed individuals achieved by choosing beef likely outweighs the marginal increase in wild animal harm caused by the extra land use.

  We must also address the decision-theoretic attitude toward the "Pasture vs. Vegetarian" controversy raised in the prompt. Should the Dining Service consider switching to a pasture-beef model instead of offering vegetarian options? The prompt constrains the service to serve meat, but the philosophical question remains relevant to the *type* of meat sourced. If the Davis argument held true—that pasture beef kills fewer animals than crops—it might suggest that "ethical meat" is superior to vegetarianism. However, given the rebuttals regarding feed and land efficiency, this claim is too fragile to build a policy upon. It relies on a supply chain (100% grass-fed, no winter feed, high-density wildlife on pasture) that is rare and difficult to verify. Relying on it risks "moral licensing," where the uncertainty of wild animal deaths is used to justify the certainty of farmed animal slaughter. The prudent path is to acknowledge that while the vegetarian vs. pasture-beef debate is philosophically rich, it is empirically too unstable to override the clear arithmetic of farmed animal suffering.

  **Verdict**

  The University Dining Service should feature **beef** as its default meat, rather than chicken.

  This verdict rests on the following precise conditions and reasoning:

  1.  **Priority of Farmed Suffering:** The decision prioritizes the reduction of direct, intentional harm to farmed animals over speculative harm to wild animals. The death of the farmed animal is the only variable that is certain in the equation.
  2.  **The Arithmetic Dominance:** The ratio of individuals killed (approx. 1:100) is the strongest moral signal available. Unless one adopts a cognitive weighting scheme where a cow is valued at more than 100 chickens—a threshold that is philosophically contentious and empirically unsupported—the reduction in individual deaths favors beef decisively.
  3.  **Assumption of Comparable Welfare:** This verdict assumes that the daily welfare conditions of the beef cattle are not orders of magnitude worse than those of the chickens. If the beef supply chain involves significantly more prolonged or intense torture per day than the chicken supply chain (beyond the duration difference already calculated), the verdict could flip. However, under standard industrial conditions, both are severe, making the count of individuals the tie-breaking variable.
  4.  **Rejection of the Crop-Death Justification for Beef:** The service should *not* justify this choice by claiming beef is better than vegetarianism due to crop deaths. That argument is too dependent on idealized pasture scenarios and ignores the feed requirements of ruminants. The choice is beef *over chicken*, not beef *over plants*.

  In conclusion, while the ethics of eating are fraught with uncertainty regarding wild populations and crop collateral, the math of the slaughterhouse is clear. To minimize the number of sentient beings subjected to the machinery of death, the consumer—and the Dining Service—must choose the larger animal. The cow is the lesser evil not because her life is worth less, but because her death buys more meals, sparing the hundred chickens that would otherwise die to fill the same plates. In a world committed to meat, the moral imperative is to kill fewer minds, and the arithmetic of bodies demands beef.
