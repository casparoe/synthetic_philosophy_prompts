answer: |-
  # The Mirror and the Window: On the Relocation of Normativity

  The promise of indirect normativity, crystallized in Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV), was seductive because it appeared to solve the value-loading problem by dissolving it. The argument ran: we cannot write down a list of values that will remain safe under superintelligence, because we do not know enough, and we are not good enough. Therefore, we should not program *what* we value, but *how* to find what we would value if we were better. The AI becomes a mirror polished to a window, reflecting not our current selves, but our idealized selves.

  Your friend's objection—the bootstrapping worry—cuts at the hinge of this mechanism. He argues that the criteria for idealization ("think faster," "know more," "be less biased") are themselves substantive normative choices. To define "bias" is to define "truth"; to define "improvement" is to define "good." Consequently, indirect normativity does not escape the need for designers to encode values; it merely moves the encoding from the object level (e.g., "maximize happiness") to the meta level (e.g., "maximize what results from this specific cognitive refinement process").

  Your reply is that this proves too much. All reasoning, including reflective equilibrium, begins from where we stand. We cannot derive norms from nowhere; we must bootstrap. If the bootstrapping worry indicts CEV, it indicts rationality itself.

  This dispute has stagnated because both of you are partially right, but you are arguing past the distinction between a *philosophical foundation* and an *engineering heuristic*. To resolve this, we must dissect the mechanism of indirect normativity under three specific pressures: the ambiguity of moral truth, the problem of conflicting idealizations, and the rival framework of moral uncertainty.

  When we do so, a clear verdict emerges: **Indirect normativity does not solve the problem of grounding value; it relocates it. This relocation is not a failure, but it requires us to abandon the claim that the procedure is value-neutral. The designers are not exempt from moral responsibility; they are merely operating at a higher level of abstraction.**

  ### The Bootstrapping Charge

  Your friend's core insight is that the "extrapolation function" is not a neutral filter. Consider the instruction to remove "biases." In a cognitive context, a bias is a deviation from a normative standard of reasoning. But which standard? If we instruct the AI to remove "evolutionary biases" (like tribalism), we are presupposing that universalism is superior to tribalism. If we instruct it to remove "Western biases," we might be presupposing something else. The choice of which cognitive trajectories count as "improvements" rather than "drift" encodes a specific vision of human flourishing.

  Your counter-argument relies on the inevitability of starting points. In reflective equilibrium, we start with current intuitions and revise them against principles. We do not demand that the starting intuitions be divinely justified; we demand only that the process of revision be coherent. You argue that CEV is simply reflective equilibrium scaled up and outsourced to an oracle.

  The flaw in your defense is that it conflates *epistemic* bootstrapping with *normative* laundering. In epistemology, we accept that we cannot step outside our own minds to check if our logic matches reality; we must use our logic to check our logic. But in AI alignment, the concern is not just whether the AI reasons correctly, but whose *goals* are being optimized. If the extrapolation function privileges certain meta-ethical assumptions (e.g., that moral progress is real, or that coherence is good), then the output is not "humanity's volition" in a pure sense; it is "humanity's volition conditional on the designers' meta-ethics."

  Your friend is correct that this is a relocation. The question is whether it is a vicious circle or a virtuous spiral.

  ### Pressure Point 1: The Alethic Ambiguity

  The first pressure point concerns the ontological status of the target. Is the extrapolated agent discovering moral facts, or merely polishing existing preferences?

  The original CEV documents flirted with a crucial stipulation: the AI should assume that moral truth exists and that our extrapolated volitions converge upon it. This was intended as a forcing function. If the AI assumes convergence, it will search for the common thread in human values that aligns with this "truth."

  However, this stipulation is the precise locus of the smuggled content. If moral realism is true, then stipulating convergence is a helpful heuristic that guides the search toward the target. But if moral anti-realism is true (i.e., values are projections of human psychology rather than features of the universe), then stipulating convergence forces the AI to hallucinate a consensus that does not exist. It would be optimizing for a ghost.

  Conversely, if CEV is merely coherifying existing values without assuming truth, it collapses into a sophisticated relativism. It tells us what we would want if we were smarter, but not what we *should* want. If our idealized selves are sadists, CEV delivers sadism. Proponents of CEV generally reject this, implying they believe the extrapolation process naturally filters out "wrong" values. But that belief is itself a realist commitment.

  Therefore, indirect normativity cannot remain agnostic. To function as a safety mechanism, it must presuppose a version of quasi-realism: that there is a "right" direction for moral reflection to travel. The relocation here is significant. The problem moves from "What is the Good?" to "Is there a convergent structure to human moral reflection?" The designers are not encoding specific values, but they are encoding a *meta-ethical stance*. If that stance is wrong, the alignment fails. This validates your friend's worry: the designers' philosophical commitments are baked into the kernel.

  ### Pressure Point 2: The Losers Problem

  The second pressure point is the problem of aggregation, often called the "Losers Problem." Indirect normativity speaks of "humanity's" volition. But humanity is not a single agent. Even if we idealize every individual human to their maximum cognitive and moral potential, there is no guarantee they will agree.

  Idealized Alice might value radical autonomy; Idealized Bob might value communal harmony. If these values are incompatible, the extrapolation function must aggregate them. But CEV does not provide an aggregation theory. It cannot, because any aggregation method (utilitarian sum, Rawlsian maximin, voting, rights-based side-constraints) is a substantive moral choice.

  If the designers choose a utilitarian aggregation, they have overridden Idealized Bob's deontological constraints. If they choose a veto-power system, they have allowed Idealized Alice to be held hostage by Idealized Bob. This decision is not resolved by the idealization process; it precedes it.

  This is the strongest evidence for your friend's relocation thesis. The "indirect" method claims to let the values emerge from the humans. But the *rules of engagement* between those humans must be specified by the designers. You cannot extrapolate the voting system from the voters without circularity. Thus, the designers are not deferring to human values entirely; they are deferring to human object-level values while retaining authority over the meta-level structure of conflict resolution.

  This does not mean the project is doomed, but it means the claim that "the AI decides" is false. The AI decides the object-level details, but the designers decide the constitutional framework. The normative burden is relocated from "What laws should we have?" to "What constitution should the idealized humans operate under?"

  ### Pressure Point 3: Moral Uncertainty as Rival or Variant?

  The third pressure point asks whether the moral uncertainty program (maximizing expected choiceworthiness across competing moral theories) solves these issues better.

  Moral uncertainty treats moral theories like empirical hypotheses. Instead of extrapolating volition, the AI maintains a probability distribution over moral theories (e.g., 40% Utilitarianism, 30% Virtue Ethics, 30% Rights Theory) and acts to maximize expected value across them.

  At first glance, this seems to avoid the "Losers Problem" by weighting conflicting values rather than forcing a synthesis. It also seems to handle the alethic ambiguity by acknowledging we don't know which theory is true.

  However, moral uncertainty is structurally identical to indirect normativity in its vulnerabilities. To calculate expected choiceworthiness, the AI must be able to compare utilities across theories (the intertheoretic comparison problem). How many units of Utilitarian welfare equal one unit of Rights-based dignity? There is no objective exchange rate. Establishing one requires a "meta-theory" of normalization.

  Furthermore, the prior distribution over theories must come from somewhere. If the designers set the priors based on current philosophical consensus, they are encoding their current normative judgments about which philosophers are credible. If the AI updates the priors based on evidence, it needs a method for what counts as moral evidence—which returns us to the alethic ambiguity of Pressure Point 1.

  Moral uncertainty is not a rival that escapes the relocation problem; it is a variant of indirect normativity that operates over *propositions* rather than *agents*. It is perhaps more honest about the disagreement (Pressure Point 2), but it still requires the designers to specify the normalization and updating rules. It relocates the problem to the meta-ethical framework of the uncertainty calculus, rather than the cognitive extrapolation function.

  ### The Verdict

  We can now settle the dispute.

  Your friend is correct that indirect normativity relocates the problem. It does not, and cannot, generate values *ex nihilo*. The criteria for idealization, the assumption of convergence, and the aggregation of conflicting volitions are all substantive normative choices made by the designers. The process launders the designers' meta-ethical commitments through a complex simulation and labels the output "Humanity's Will." If the designers believe in moral realism, the AI will act as a realist. If they believe in liberal aggregation, the AI will act as a liberal. The neutrality is illusory.

  However, you are correct that this does not indict the project, provided we adjust our expectations. The "Proves Too Much" argument holds in the following sense: there is no "view from nowhere" for alignment. Any AI we build will reflect the values of its creators, either directly (by programming rules) or indirectly (by programming the learning process). Direct normativity fails because we cannot specify the rules comprehensively. Indirect normativity succeeds not because it removes the designers' values, but because it shifts the designers' burden from *specifying the answer* to *specifying the search process*.

  This is a crucial engineering distinction. It is easier to agree on a process for finding values (e.g., "listen to humans, remove contradictions, respect autonomy") than to agree on the values themselves (e.g., "maximize hedonic tone"). The relocation is virtuous because it moves the normative load to a level where human agreement is higher and the stakes of error are lower. We are more likely to agree on what counts as "coherent" than on what counts as "good."

  **Conclusion**

  Indirect normativity is a legitimate engineering solution to an intractable philosophical problem, but it is not a philosophical solution in its own right. It solves the *specification* problem by converting it into a *search* problem, but it leaves the *grounding* problem untouched.

  Therefore, the verdict is conditional: **Indirect normativity is valid if and only if designers explicitly acknowledge and take responsibility for the meta-ethical assumptions embedded in the extrapolation function.**

  If proponents claim CEV is a value-neutral discovery procedure that bypasses the need for moral philosophy, your friend wins: it is a deception that hides designer bias behind a veil of complexity. But if proponents admit that CEV encodes a specific commitment to moral progress, coherence, and a specific method of aggregation, then you win: it is the best available method for bootstrapping values in a complex world, acknowledging that we must start from where we stand.

  The dispute settles on the claim of neutrality. Indirect normativity does not absolve us of the need to be good; it only changes the tools we use to try. It relocates the burden from the object level to the meta level, and that is the best we can do. We must not mistake the mirror for the window. The mirror still reflects the hand that holds it.
