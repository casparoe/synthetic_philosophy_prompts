answer: |-
  **JOINT STATEMENT ON THE PHILOSOPHICAL SIGNIFICANCE OF PAIN ASYMBOLIA**

  **Signatories:** The Phenomenal Internalist & The Constitutive Attitudinalist
  **Date:** October 24, 2023
  **Subject:** Stalemate Series Installment #4

  ### I. Agreed Claims

  We, the undersigned, affirm the following claims as the common ground for our continued debate. We commit to not disputing these points in future exchanges unless new empirical evidence necessitates revision.

  1.  **The Empirical Picture:** Pain asymbolia, typically resulting from lesions to the insular cortex or anterior cingulate, presents a dissociation between sensory-discriminative capacity and affective-motivational response. Patients can localize noxious stimuli and report intensity accurately but exhibit no withdrawal, distress, or avoidance. Analogous dissociations are observed in some subjects under high-dose morphine and following cingulotomy.
  2.  **Contrast with Congenital Insensitivity:** Asymbolia is distinct from Congenital Insensitivity to Pain (CIP). In CIP, the sensory experience of pain is absent; in asymbolia, the sensory experience is reported as present. We agree that CIP cases do not bear directly on the nature of pain's badness, as there is no pain experience to evaluate.
  3.  **Tripartite Distinction:** We distinguish (i) *Nociception* (neural signaling of damage), (ii) *Pain* (the conscious experience typically associated with nociception), and (iii) *Suffering* (the negative emotional or evaluative reaction to pain). We agree that these can come apart empirically, even if we disagree on their metaphysical relations.
  4.  **Reliability of Reports:** We accept the sincerity and accuracy of the asymbolic patient's report: "I feel the pain, but it does not bother me." We agree this report indicates a genuine phenomenological state where the subject acknowledges the sensation but lacks the typical conative response. We will not explain this away as confusion, aphasia, or memory deficit.

  ### II. Grades of "Not Being Bothered"

  We acknowledge that our debate has been obscured by running together distinct ways in which a subject might fail to be bothered by a stimulus. We distinguish three grades:

  *   **(a) Behavioral Silence:** Absence of withdrawal and avoidance behavior, regardless of inner experience.
  *   **(b) Phenomenal Silence:** Absence of any felt unpleasantness in the episode itself; the sensation is phenomenally neutral.
  *   **(c) Cognitive Disownership:** Preservation of felt unpleasantness alongside a subject who registers it but disowns its significance for her (i.e., she feels the "hurt" but it fails to engage her caring structure).

  **Classification of Cases:**
  We diverge on where asymbolia falls, but agree on the following mappings for the sake of argument:
  *   **Asymbolia:** The Internalist classifies this as Grade (c). The Attitudinalist classifies this as Grade (b).
  *   **Morphine Dissociation:** We agree this likely straddles (b) and (c), depending on dosage and subject.
  *   **Hypnotic Analgesia:** We agree this is most plausibly Grade (c), given reports of "distanced" pain.

  **Stakes of Classification:**
  *   **The Internalist's Safety Condition:** If asymbolia were conclusively shown to be Grade (b) (Phenomenal Silence), this would be harmless to the Internalist view. If there is no felt unpleasantness, there is no pain in the full phenomenal sense, and thus no counterexample to the claim that *pain* is intrinsically bad. The case would merely describe a neutral sensation mislabeled as pain by the subject.
  *   **The Attitudinalist's Safety Condition:** If asymbolia were conclusively shown to be Grade (c) (Cognitive Disownership), this would be harmless to the Attitudinalist view. If the subject feels unpleasantness but disowns its significance, the Attitudinalist maintains that the *badness* is constituted by the significance (the caring structure). The presence of "raw" unpleasantness without the attitudinal weave proves that unpleasantness alone is not badness.

  ### III. Table of Residual Disagreements

  | Topic | Formulation Acceptable to the Phenomenal Internalist | Formulation Acceptable to the Constitutive Attitudinalist |
  | :--- | :--- | :--- |
  | **The Locus of Badness** | The badness of pain is an intrinsic property of its phenomenal character; it is felt *in* the sensation. Aversion is a consequence of this badness, not a constituent of it. | The badness of pain is extrinsic to the sensory qualia; it is conferred by the subject's aversive attitude. The sensation is the object of badness, not the bearer of it. |
  | **The Asymbolic Deficit** | The asymbolic patient suffers from a disconnection between the experience of badness and the motivational systems that typically respond to it. The badness remains, but the alarm is broken. | The asymbolic patient suffers from a lack of the very attitude that constitutes badness. The alarm is not broken; the condition for the alarm's necessity is absent. |
  | **Normative Authority** | Pain provides agent-neutral reasons for avoidance. Even if a subject does not mind the pain, it is objectively bad for them, and others have reason to alleviate it. | Pain provides reasons only relative to the subject's caring structure. If the subject does not mind, the pain lacks normative force for them, though others may care on their behalf. |

  ### IV. Cruxes and Observational Programs

  We identify two subquestions where empirical or thought-experimental resolution would force a theoretical revision.

  **1. The Restoration-Choice Test**
  *   **Scenario:** A patient with stable pain asymbolia is offered a procedure to reinstate ordinary aversive responses to their pain (restoring the "alarm" function). They are informed this will not change the sensory location or intensity, only the affective reaction.
  *   **The Question:** What should she choose, what would she in fact choose, and does her choice bear on whether the pain was bad for her all along?
  *   **Internalist Prediction:** The patient will **decline** the procedure.
      *   *Rationale:* The patient currently experiences pain (which is bad) without the added burden of suffering (aversion). Restoring aversion adds a new negative phenomenal layer. Her refusal confirms that the original state lacked *suffering*, but does not prove it lacked *badness*.
  *   **Attitudinalist Prediction:** The patient will **decline** the procedure.
      *   *Rationale:* The patient currently experiences a neutral sensation. Restoring aversion would *constitute* badness where there was none. Her refusal confirms that the original state was not bad for her.
  *   **Decisive Factor:** We agree the choice (decline) will likely be the same. The crux lies in the **post-choice interview**. If the patient justifies refusal by saying, "I don't want to add suffering to what I already feel," the Internalist gains ground. If she says, "I don't want to start minding something that doesn't matter," the Attitudinalist gains ground. We commit to funding a qualitative study of asymbolics' reasoning in such hypothetical or real scenarios.

  **2. The Reverse-Dissociation Question**
  *   **Scenario:** We investigate cases of "badness without pain," such as profound grief, moral guilt, or an itch one is ashamed to scratch (where the sensation is neutral but the experience is negative).
  *   **The Question:** Does the existence of non-sensory badness show that badness is a separate component that can attach to pain, or does it show that pain is just one substrate for a broader attitudinal state?
  *   **Internalist Prediction:** Cases of grief or guilt possess their own distinctive *phenomenal character* of unpleasantness, analogous to pain qualia. The badness is still intrinsic to the feel of the grief.
  *   **Attitudinalist Prediction:** Cases of grief or guilt are bad solely because of the subject's negative attitude toward the state of affairs. The "feel" is secondary.
  *   **Decisive Factor:** If we can identify cases where a subject reports a negative evaluative state (e.g., guilt) but denies any specific unpleasant phenomenology associated with it, the Attitudinalist view is strengthened. If all reported "bad" states entail a specific, identifiable negative qualia, the Internalist view is strengthened.

  ### V. Concessions

  We stipulate the following concessions should the cruxes resolve against our respective positions:

  *   **Internalist Concession:** If the Restoration-Choice interviews reveal that asymbolics uniformly describe their current state as "neutral" rather than "bad but ignored," and if Reverse-Dissociation cases (badness without qualia) are robustly confirmed, the Internalist will abandon the claim that badness is *exhausted* by felt character. She will concede that attitude plays a constitutive role in at least some forms of badness.
  *   **Attitudinalist Concession:** If the Restoration-Choice interviews reveal that asymbolics describe their current state as "hurtful" yet "unimportant," and if Reverse-Dissociation cases fail to materialize (i.e., all badness tracks with specific unpleasant qualia), the Attitudinalist will abandon the claim that the sensory component is *badness-neutral*. He will concede that certain phenomenal characters carry intrinsic negative weight independent of current aversion.

  ### VI. Verbal vs. Substantive Residue

  We jointly judge that a portion of our dispute is merely verbal. Specifically, if we distinguish **Unpleasantness** (phenomenal character), **Badness** (normative status), **Suffering** (affective reaction), and **Mattering** (integration into caring structure), we agree that:
  1.  Asymbolics have Unpleasantness (Internalist) or something functionally isomorphic to it (Attitudinalist).
  2.  Asymbolics lack Suffering and Mattering (Both).
  3.  The disagreement reduces to whether the label "Badness" applies to the Unpleasantness alone or requires Mattering.

  **Substantive Residue:**
  However, a substantive disagreement survives this terminological cleanup. It concerns **Normative Authority**.
  *   The Internalist maintains that the Unpleasantness of asymbolic pain provides *reasons* for the subject (and others) to act, even if the subject does not care. The badness is agent-neutral.
  *   The Attitudinalist maintains that without Mattering, the Unpleasantness provides no reasons for the subject. Any reasons to act are agent-relative (based on others' caring).

  We conclude that our stalemate is not about the phenomenology of asymbolia, which we describe similarly, but about the source of normative reasons. We commit to shifting the next phase of our debate to the meta-ethics of pain, rather than its phenomenology.

  **Signed,**

  *The Phenomenal Internalist*
  *The Constitutive Attitudinalist*
