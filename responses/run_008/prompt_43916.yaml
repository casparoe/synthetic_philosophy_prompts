  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the Request:**

      *   **Role:** Senior Program Officer at a mid-sized private foundation.
      *   **Context:** Foundation shifted to effective-altruist (EA) style cost-effectiveness reasoning 2 years ago. Result: Bias towards measurable interventions (deworming, cash) vs. systemic change (organizing, policy).
      *   **Director's Stance:** Acknowledges measurability bias (rewrites portfolio) but rejects the "lazy institutional critique" (exempting systemic change from scrutiny). Both errors equate ease of measurement with size of effect.
      *   **Task:** Draft a 45-minute screening procedure for Letters of Inquiry (LOI).
      *   **Requirements:**
          1.  Ordered list of questions (cheap first, knock out weak fast) with pass/fail criteria.
          2.  Address two forms of institutional critique: *Causal* (intervention props up the system) and *Epistemic* (funding landscape reshapes proposal pool). Must specify what counts as an answer and what to do if nothing can be shown.
          3.  Address Counterfactual Fungibility (if we decline, does someone else fund?). Distinguish saturated vs. neglected areas. Acknowledge uncertainty.
          4.  Explicitly mark where judgment cannot be eliminated (Values vs. Facts) and where the procedure stops/rejects vs. hands upward. Distinguish technical rejection from values call.
          5.  Run the procedure on three specific cases (Deworming expansion, Housing Law Reform, Community Organizing "Capacity now").
          6.  Include a "Limitations" section (where it misfires, judgment calls dressed as arithmetic, data gaps).
      *   **Tone:** Working document for non-philosophers (program officers), but preserving critical distinctions. Practical, clear, actionable.

  2.  **Deconstruct the Constraints & Philosophy:**

      *   *Time Limit:* 45 minutes per LOI. This is tight. Questions must be rapid assessment, not deep dive.
      *   *The "Director's Balance":* Avoid the "Measurability Trap" (only fund what's easy to count) AND the "Systemic Exemption Trap" (fund systemic stuff just because it's systemic).
      *   *The "Institutional Critique":* Needs to be operationalized. How do you ask an LOI applicant about epistemic bias in 45 minutes? You mostly ask *them* to acknowledge it, or you check internal portfolio balance.
      *   *Fungibility:* Crucial for EA thinking. If we don't pay, will Gates/Buffett/Google pay?
      *   *Values vs. Facts:* This is the ethical core. We need to admit when we are saying "No" because we don't like the goal, not because the math doesn't work.

  3.  **Drafting the Procedure (Section by Section):**

      *   *Introduction:* Set the stage. Why this exists.
      *   *Step 1: The "Hard No" Filters (Minutes 0-10).* Basic eligibility, alignment, capacity. Keep it fast.
      *   *Step 2: Evidence & Measurement (Minutes 10-25).* This is where the EA bias usually lives. Need to broaden the definition of evidence without losing rigor. Differentiate "No numbers" from "No logic."
      *   *Step 3: Institutional Critique Check (Minutes 25-35).* Address the Causal vs. Epistemic distinction.
      *   *Step 4: Fungibility & Marginality (Minutes 35-40).* Who else is funding?
      *   *Step 5: The Decision Point (Minutes 40-45).* Values vs. Facts. Stop vs. Escalate.

      *Refining the Questions:*
      *   *Q1 (Fit):* Does this fit the portfolio? (Pass/Fail)
      *   *Q2 (Logic):* Is the theory of change coherent, even if unquantified? (Pass/Fail)
      *   *Q3 (Institutional - Causal):* Does this treat symptoms while ignoring causes? (Risk assessment)
      *   *Q4 (Institutional - Epistemic):* Is this proposal invisible because it's hard to measure, or because it's bad? (Portfolio check)
      *   *Q5 (Fungibility):* Are we the only ones? (Uncertainty acknowledgement)
      *   *Q6 (Values):* Who decides? (Named officer)

  4.  **Developing the Three Test Cases:**

      *   *Case 1: Deworming Expansion.* High evidence, saturated market.
          *   *Verdict:* Likely Reject due to fungibility/marginality, not effectiveness.
      *   *Case 2: Housing Law Reform.* Systemic, measurable outcomes (legislative wins) but intangible intermediate outcomes (bargaining power).
          *   *Verdict:* Pass to full proposal, but flag values judgment.
      *   *Case 3: Community Organizing ("Capacity now").* Vague theory of change.
          *   *Verdict:* Reject. This is the "staff will dislike" case. Why? Because "organizing builds organizing" is often a placeholder for no strategy. The procedure must catch this to avoid the "Systemic Exemption Trap."
          *   *Analysis:* Is this a feature or bug? Feature. It enforces strategic clarity even on unmeasurable goals.

  5.  **Drafting the Limitations Section:**

      *   Must be honest. This isn't a calculator.
      *   Judgment calls disguised as math (e.g., scoring "plausibility").
      *   Data we don't have (perfect fungibility knowledge).
      *   The risk of bureaucratic drift (following the form over the intent).

  6.  **Review and Refine (Self-Correction):**

      *   *Check:* Did I distinguish Causal vs. Epistemic critique clearly?
      *   *Correction:* Make sure Step 3 explicitly separates "Does this fix make the problem worse long-term?" (Causal) from "Are we ignoring this because we can't count it?" (Epistemic).
      *   *Check:* Is the 45-minute constraint respected?
      *   *Correction:* Add time stamps to the steps.
      *   *Check:* Are the "Values vs. Facts" marks visible?
      *   *Correction:* Use bold boxes or specific icons/text markers like **[VALUES JUDGMENT]**.
      *   *Check:* Is the tone right?
      *   *Correction:* Ensure it sounds like an internal memo/SOP, not a philosophy paper. Use "Staff" and "Officer."

  7.  **Final Polish:**

      *   Ensure the distinction between "Technical Rejection" and "Values Rejection" is stark.
      *   Make sure the "Community Organizing" case analysis explains *why* staff might hate it (it feels like punishing the little guy) but why the procedure demands it (strategy is required regardless of metric).
      *   Verify the Fungibility section admits ignorance.

  8.  *(Final thought on the "Community Organizing" case)*: The prompt asks to design the case so the verdict is one staff will dislike. Staff usually love "capacity building." The procedure should reject it if there is *no* specified target. This highlights the tension between "trusting grantees" and "strategic rigor." I need to make sure the analysis explains this tension clearly.

  9.  *(Final thought on Institutional Critique)*: The prompt asks what an applicant could *show*. For epistemic, they can't show much. The burden is on the *Foundation* to check its own portfolio. I need to make sure the procedure reflects that the *Officer* does the work on Epistemic, not the applicant.

