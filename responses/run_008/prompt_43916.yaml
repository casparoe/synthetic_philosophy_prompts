answer: |-
  **INTERNAL MEMORANDUM**

  **TO:** Program Staff
  **FROM:** Senior Program Officer
  **SUBJECT:** LOI Screening Procedure (45-Minute Protocol)
  **DATE:** October 26, 2023
  **STATUS:** Draft for Pilot

  ### Purpose
  This procedure is designed to screen Letters of Inquiry (LOI) within a 45-minute window. Its goal is to balance rigor with pluralism. We are avoiding two specific errors:
  1.  **The Measurability Trap:** Rejecting high-impact work simply because outcomes are hard to quantify.
  2.  **The Systemic Exemption:** Accepting systemic-change work simply because it is systemic, without requiring a coherent theory of change.

  This is not a scoring sheet. It is a decision tree. If a step fails, you stop unless instructed otherwise.

  ---

  ### The 45-Minute Screening Protocol

  #### Phase 1: Basic Viability (Minutes 0–10)
  *Goal: Rapid elimination of non-starters.*

  **Q1. Portfolio Fit & Capacity**
  *   **Question:** Does the request fall within our three portfolios (Global Health, Domestic Policy, Community Organizing), and does the organization have the basic operational capacity to execute?
  *   **Sufficient Answer:** Yes. The activity maps to a portfolio goal, and the organization is legally/operationally sound (e.g., audited financials, key staff in place).
  *   **Failure:** The request is outside scope, or the organization is demonstrably unable to manage the funds (e.g., no prior grant history, legal red flags).
  *   **Action:** If Fail, **REJECT (Technical)**. Stop.

  **Q2. Theory of Change Coherence**
  *   **Question:** Is there a logical link between the activity and the intended outcome, even if the outcome is not quantified?
  *   **Sufficient Answer:** A narrative chain exists (e.g., "If we train tenants, they will organize; if they organize, they will pressure landlords; if they pressure landlords, policy changes"). It does not need numbers, but it needs causality.
  *   **Failure:** The proposal relies on magic ("awareness will lead to change") or circular logic ("we will build capacity to build capacity" with no end goal).
  *   **Action:** If Fail, **REJECT (Technical)**. Stop.

  ---

  #### Phase 2: Evidence & Measurement Bias Check (Minutes 10–25)
  *Goal: Assess quality without privileging quantification.*

  **Q3. The Measurement Justification**
  *   **Question:** Why are the outcomes measured (or not measured) in this specific way?
  *   **Sufficient Answer:**
      *   *If Measured:* The metrics align with the goal (not just what is easy to count).
      *   *If Unmeasured:* The applicant explicitly acknowledges the limitation and offers proxy indicators or qualitative milestones (e.g., "We cannot count 'power,' but we will track legislative meetings secured and coalition size").
  *   **Failure:** The applicant claims numbers prove impact where they don't (vanity metrics), OR the applicant refuses to offer *any* form of verification because "systemic change is invisible."
  *   **Action:** If Fail, **REJECT (Technical)**. Stop.

  **Q4. The Institutional Critique Check (Causal vs. Epistemic)**
  *   **Question:** We must distinguish between two risks.
      *   **A. Causal Risk:** Does this intervention treat a symptom in a way that stabilizes the underlying problem? (e.g., A food bank that reduces pressure to fix welfare policy).
      *   **B. Epistemic Risk:** Are we ignoring this proposal because our own systems cannot see its value, thereby shrinking the diversity of our portfolio?
  *   **Sufficient Answer:**
      *   *For A (Causal):* Applicant acknowledges the risk and describes a mitigation strategy (e.g., "We provide relief *while* lobbying for policy change").
      *   *For B (Epistemic):* **Staff Action.** The Officer must check: Have we rejected similar unmeasurable proposals recently? Is this the *only* type of work we are funding in this portfolio?
  *   **Failure:**
      *   *For A:* Applicant denies the tension exists.
      *   *For B:* **No specific answer is required from the applicant.** If the applicant cannot show anything, this is not a failure. The burden is on the Foundation to ensure we are not creating an echo chamber.
  *   **Action:** If A Fails, **REJECT (Strategic)**. If B raises a flag (i.e., we have funded only measurable projects for 2 years), **FLAG FOR PORTFOLIO REVIEW** but do not reject solely on this basis.

  ---

  #### Phase 3: Counterfactual Fungibility (Minutes 25–35)
  *Goal: Determine if our money is marginal.*

  **Q5. The Funding Landscape**
  *   **Question:** If we decline, does this project happen anyway?
  *   **Sufficient Answer:**
      *   *Saturated Area (e.g., Deworming):* Applicant acknowledges other major funders. We need evidence we are filling a specific gap (e.g., a specific region others ignore), not just adding to the pile.
      *   *Neglected Area (e.g., Tenant Organizing):* Applicant indicates few other funders. Our money is likely marginal.
      *   *Uncertainty:* "We don't know." **This is an acceptable answer.**
  *   **Failure:** Applicant claims they are unique in a saturated field without evidence, or claims no one else funds them in a crowded space.
  *   **Action:** If the area is saturated and the applicant cannot explain why *we* specifically are needed (marginality), **REJECT (Strategic)**. If the area is neglected or unknown, proceed.
  *   **Note:** Do not penalize the applicant for our lack of market intelligence. If *we* don't know the funding landscape, that is our failure, not theirs. In cases of high uncertainty regarding fungibility, default to **PROCEED**.

  ---

  #### Phase 4: The Decision Point (Minutes 35–45)
  *Goal: Distinguish Facts from Values.*

  **Q6. The Values Boundary**
  *   **Question:** Is the remaining hesitation about *effectiveness* (facts) or *preference* (values)?
  *   **Instruction:** You must mark the decision reason explicitly.
      *   **[TECHNICAL/STRATEGIC REJECT]:** The theory of change is broken, the money isn't marginal, or the intervention worsens the causal problem. *This can be defended with data or logic.*
      *   **[VALUES REJECT]:** We understand the logic and the need, but this does not align with the Foundation's specific risk tolerance or philosophical priorities (e.g., "We prefer direct aid over advocacy"). *This requires a Named Officer.*
  *   **Action:**
      *   If **[TECHNICAL/STRATEGIC REJECT]**: You may issue the rejection letter.
      *   If **[VALUES REJECT]**: You **MUST** escalate to a Program Director or Named Senior Officer. You cannot hide a values call behind a technical rejection.
      *   If **PASS**: Move to Full Proposal.

  ---

  ### Case Studies: Procedure Application

  Below are three test cases run through the protocol above.

  #### Case 1: The Deworming Expansion
  *   **Profile:** Proven deworming intervention. Two large funders already operate in the region. Applicant requests funds to expand to a third neighboring country. Evidence is solid (RCTs).
  *   **Protocol Run:**
      *   Q1 (Fit/Capacity): **Pass.**
      *   Q2 (ToC): **Pass.** Logic is sound.
      *   Q3 (Measurement): **Pass.** Metrics are clear.
      *   Q4 (Institutional): **Pass.** Causal risk low (deworming doesn't cause worms). Epistemic risk low (we fund plenty of these).
      *   Q5 (Fungibility): **FAIL.** This is a saturated area. The applicant has not demonstrated why *our* funding is marginal compared to the two existing large funders. Expanding to a third country may just mean shifting where the existing funders operate, or our money replaces theirs.
      *   Q6 (Decision): **[TECHNICAL/STRATEGIC REJECT].**
  *   **Verdict:** **Reject.**
  *   **Reasoning:** The money is not marginal. In effective altruism terms, we are not buying *more* good, we are subsidizing what would happen anyway. This is a technical failure of marginality, not a values call.

  #### Case 2: The Housing Law Reform
  *   **Profile:** State-level coalition. Track record of legislative wins. Outcomes include "tenants' bargaining power" and "credibility of future threats." Proposal admits these are unmeasurable.
  *   **Protocol Run:**
      *   Q1 (Fit/Capacity): **Pass.**
      *   Q2 (ToC): **Pass.** Logic: Organize tenants -> Elect allies -> Pass law -> Shift power.
      *   Q3 (Measurement): **Pass.** They admit numbers are limited but offer proxy milestones (bills introduced, coalition growth). This satisfies the "Measurement Justification."
      *   Q4 (Institutional): **Pass.** Causal risk addressed (they do relief + policy). Epistemic risk flagged (we haven't funded policy in 18 months), which suggests we *should* fund this to balance the portfolio.
      *   Q5 (Fungibility): **Pass/Uncertain.** Policy funding is generally neglected compared to direct service. Uncertainty defaults to Proceed.
      *   Q6 (Decision): **[VALUES REJECT] OR [PASS].**
  *   **Verdict:** **Pass to Full Proposal.**
  *   **Reasoning:** The procedure protects this application from the "Measurability Trap." However, if a Program Officer wants to reject this because they prefer direct aid over policy, they must mark it **[VALUES REJECT]** and escalate. They cannot claim the "lack of metrics" is the reason, because Q3 explicitly allows for unmeasured outcomes if the logic holds.

  #### Case 3: The "Capacity Now" Organizer
  *   **Profile:** Well-run, honest community org. Theory of change: "Organizing builds organizing. We need capacity now; campaigns later." No specified later target. No specific policy goal.
  *   **Protocol Run:**
      *   Q1 (Fit/Capacity): **Pass.**
      *   Q2 (ToC): **FAIL.** "Capacity now, campaigns later" with no specified target is circular logic. It violates the requirement for a causal link between activity and outcome. It is the "Systemic Exemption" error: assuming "organizing" is inherently good without a strategic destination.
      *   Q3 (Measurement): **N/A** (Failed Q2).
      *   Q6 (Decision): **[TECHNICAL/STRATEGIC REJECT].**
  *   **Verdict:** **Reject.**
  *   **Staff Reaction:** Staff will dislike this. It feels like punishing a small, honest grassroots group for not speaking the language of strategy, while we fund large NGOs with fake metrics.
  *   **Feature or Misfire?** This is a **Feature**.
      *   *How to tell:* If we fund this, we are falling into the "Systemic Exemption Trap" the Director warned against. We are funding *activity* rather than *change*. A misfire would be if we rejected a group that *did* have a target (e.g., "Pass Rent Control") but couldn't measure the *impact* of that target. This group has no target.
      *   *Distinction:* The procedure demands a *direction*, not a *metric*. This applicant has neither. Rejecting them preserves the integrity of the "Systemic" portfolio. If we fund them, we are essentially making a donation, not a grant.

  ---

  ### Limitations & Known Failure Modes

  **1. What This Procedure Cannot Do**
  *   **It cannot solve information asymmetry.** In Q5 (Fungibility), we admit we rarely know the funding landscape. We default to "Proceed" in uncertainty, which means we will occasionally fund replaceable projects. This is the cost of speed.
  *   **It cannot quantify values.** Q6 forces you to name a values judgment, but it does not tell you *what* the values should be. That remains a leadership decision.
  *   **It cannot fix bad data.** If an applicant lies about their capacity (Q1), this screen will not catch it.

  **2. Judgment Calls Dressed as Arithmetic**
  *   **Q2 (ToC Coherence):** Determining if a narrative chain is "logical" is subjective. One officer's "plausible pathway" is another's "wishful thinking."
      *   *Mitigation:* If you are unsure on Q2, you must escalate. Do not guess.
  *   **Q4 (Epistemic Risk):** Deciding if our portfolio is too narrow requires a view of the whole portfolio that individual officers may not have.
      *   *Mitigation:* This requires a quarterly Portfolio Review meeting, not just individual LOI screening.

  **3. The "Mechanical Scorecard" Risk**
  *   The greatest risk is staff treating this as a checklist where 3 "Passes" equal a grant. **It is not a scorecard.** A failure in Q2 (Theory of Change) is a hard stop, even if Q3 (Measurement) is perfect. A failure in Q5 (Fungibility) is a hard stop, even if the cause is noble.
  *   **The "Values" Trap:** The most common failure mode will be officers marking **[TECHNICAL REJECT]** when they actually mean **[VALUES REJECT]**. For example, rejecting the Housing Reform (Case 2) by claiming "insufficient metrics" when Q3 explicitly allows for qualitative milestones.
      *   *Audit:* We will randomly sample 10% of rejections quarterly to check if "Technical" reasons were actually "Values" reasons in disguise.

  **4. Data We Will Never Have**
  *   We will never know the true counterfactual (what would have happened without us).
  *   We will never perfectly measure "power" or "bargaining capacity."
  *   We must accept that we are funding *plausibility*, not *certainty*. This procedure ensures the plausibility is rigorous, not that the certainty is real.

  ---

  **Approval:**
  _________________________ (Program Director)
  **Date:** _________________
