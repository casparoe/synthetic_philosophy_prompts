      *   *Moral Weight:* If computational resources are scarce in base reality, simulators might terminate "boring" or "suffering-heavy" sims. We need to make the sim "worth running."
      *   *Acausal Trade/Decision Theory:* If there are many sims, our actions might correlate with actions in other sims or base reality (Updateless Decision Theory).
      *   *The "Short Future" Risk:* If we are in a sim, the future might be shorter than we think (budget cuts). This makes near-term work *more* urgent, not less.

