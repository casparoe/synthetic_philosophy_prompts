      *   *Premise 2 & 3:* Even if we are in a simulation, our actions *inside* the simulation determine whether the simulation continues or whether we "graduate" to base reality. Also, the simulation might be testing us for inclusion in the real future.

  3.  **Address Question 1: Why do organizations continue as if the future is real?**
      *   *Probability:* The Simulation Hypothesis (SH) is not proven. It's a probabilistic argument. Even if $P(Sim) = 0.5$, $P(Real) = 0.5$. The expected value of the real future is still infinite/high enough to warrant action.
      *   *Robustness:* Longtermist interventions (reducing nuclear risk, pandemic risk, AI alignment) are good *whether* we are simulated or not. If we are simulated, preventing "simulation shutdown" (via good behavior or stability) might be key. If real, preventing extinction is key. The actions overlap.
      *   *The "Base" Future:* If we are simulated, our simulators are likely in the "base" future. Ensuring *their* future might be linked to ours (e.g., if we are a test, or if our simulation depends on their computational resources which depend on their stability).
      *   *Institutional Momentum/Epistemic Humility:* They haven't accepted SH as fact. Bostrom himself is a longtermist. He doesn't see them as contradictory.

