answer: |-
  Build the session around the Diary case (§258) as the core mechanism, introduce the rule-following constraint (§258-265) immediately after to explain why the diary fails, and deploy the Beetle (§293) only at the end to clean up ontological misconceptions.

  The Diary case is superior for engineers because it is procedural—it models a system attempting to establish a mapping between an internal state and a symbol—whereas the Beetle is metaphorical and invites the exact phenomenological debates you want to avoid. Rule-following cannot be gestured at; it is the engine of the PLA, but it must come *after* the Diary setup because you need the engineers to feel the intuitive pull of the diary ("I can just define it myself") before you show them the mechanical failure (§258: "whatever is going to seem right to me is right"). If you lecture on rule-following first, you lose them in abstraction; if you do it second, you are solving the puzzle you just created.

  **Sequence and Misconception Handling**

  1.  **Define the Target (§243):** Write the definition of a private language on the board (words refer to immediate private sensations, others cannot understand).
      *   *Head off Behaviorism (1):* Explicitly state that "private" means "logically inaccessible to others," not "behavioral outputs don't exist." Wittgenstein grants you have pain; he denies you can build a *language* on it alone. If you don't draw this line here, they will spend 40 minutes arguing that pain causes wincing.
  2.  **The Diary Experiment (§258):** Walk through the act of writing 'S' when a sensation occurs. Ask them how the connection is established.
      *   *Head off Epistemic/Symbol Grounding (2):* When they say "I just point inward," stop them. This is not about other people not knowing (epistemic); it is about *you* not having a method to distinguish correct vs. incorrect use later. It is not the symbol grounding problem (how symbols get meaning); it is the criterion problem (how you know the meaning holds).
  3.  **The Rule-Following Constraint (§258-265):** Explain why the diary fails. There is no distinction between "seeming right" and "being right."
      *   *This is the pivot:* Do not move to the Beetle until this logical point lands. The argument is not that inner states are impossible, but that they cannot serve as *standards of correctness*.
  4.  **The Beetle in the Box (§293):** Introduce this only now. If everyone has a box with something inside called a "beetle," the object drops out of consideration.
      *   *Head off No Inner Monologue (3):* Use this to clarify that the *object* (qualia/inner monologue) is irrelevant to the *grammar* of the word. You can talk to yourself; you just can't use a language whose rules rely solely on private ostension. This prevents the "Wittgenstein denies thinking" reaction.
  5.  **Wrap-up and Kripke:**
      *   *Head off Community Agreement (4):* If someone raises Kripke, clarify that Wittgenstein's point is grammatical, not sociological. It is not that "we agree so it's true," but that "agreement is a precondition for the concept of truth." Do not let this derail into skeptical solutions.

  **Refusals**

  Flat-out refuse to cover: (1) Kripke's "skeptical solution" (it shifts the argument from grammar to sociology and will eat 40 minutes), (2) The ontology of qualia (whether the beetle *actually* exists), and (3) The broader structure of the *Investigations*. Say out loud: "We are not solving skepticism today, and we are not debating whether pain is real; we are analyzing the conditions for correctness."

  **Final Question**

  "In the diary case, if I have no independent check on my memory, what work is the word 'S' actually doing that a mere sigh or groan isn't?"
