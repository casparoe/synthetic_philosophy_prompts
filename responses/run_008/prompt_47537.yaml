answer: |-
  | Feature of the rules | What it seems to presuppose | Rival view it appears to rule out | Underdetermined? |
  | :--- | :--- | :--- | :--- |
  | **The Cash Ban** | Corruption is fundamentally a *payment for service* (fungible value) rather than a relational gift; cash strips away the social mask of generosity. | A pure *intent-based* view (where a $10 bill given with warm intent is morally distinct from a $10 bill given coldly). | **Yes:** A strict "integrity of office" theory would also ban cash regardless of intent, simply to avoid the *appearance* of payment. |
  | **The Dollar Caps** | Corruption is a function of *magnitude*; influence can be purchased, but only if the price is high enough to distort judgment (*de minimis* non curat lex). | A *principle-based* view (where accepting *any* benefit creates an obligation, regardless of monetary value). | **Yes:** Administrative pragmatism could also justify caps as a triage mechanism, even if small gifts were theoretically corrupting. |
  | **Timing Sensitivity** | Corruption is a *transactional exchange* (quid pro quo); temporal proximity between gift and decision implies causal influence. | A *relationship-maintenance* view (where gifts are about long-term bonding and shouldn't be judged by specific decision cycles). | **Yes:** An "appearance of impropriety" theory also flags timing, even if no actual causal influence occurs. |
  | **The Disclosure Requirement** | Corruption thrives in *secrecy*; the act itself is less dangerous than the hidden conflict of interest, which sunlight can disinfect. | A *paternalistic* view (where certain acts are inherently wrong and should be banned outright rather than managed via transparency). | **Yes:** A "market view" of corruption (legalized bribery) would also rely on disclosure to price the service rather than ban it. |
  | **Wedding/Funeral Carve-outs** | Corruption is a *violation of role integrity*; social rituals exist in a separate moral sphere from business decisions and do not count as "benefits." | A strict *impersonal bureaucracy* view (where officials should have no personal entanglements with stakeholders, ever). | **No:** This is the strongest evidence for a "social norm" theory; a strict "conflict of interest" theory would likely ban these to ensure total impartiality. |

  Your suspicion is largely correct: the current compliance architecture is not built on a single philosophical foundation but is instead a **risk-management kludge** that stitches together three conflicting theories. It treats corruption as *economic exchange* (hence the cash ban and timing rules), as *psychological thresholding* (hence the dollar caps), and as *sociological role-confusion* (hence the wedding carve-outs). If you swapped this hybrid for the "honest market view" you described—where corruption is simply an undisclosed payment for services—the cash ban would immediately vanish (cash is just the most efficient payment method), dollar caps would become irrelevant (price is set by the market), and timing would matter only insofar as it affects contract delivery; only the disclosure requirement would survive, transformed from a compliance check into a public price list. The practice rests on several theories because it is trying to satisfy legal liability, cultural norms, and ethical ideals simultaneously, rather than pursuing a single definition of truth.

  **To maximize philosophical coherence, you would abolish the categorical distinction between cash and kind, treating all transfers of value identically under a unified disclosure threshold.**
