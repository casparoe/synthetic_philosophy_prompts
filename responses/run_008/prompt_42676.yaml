prompt: |-
  My research group has spent the last year and a half basically split down the middle on whether advanced AI systems should be goal-directed or approval-directed — on the one side the classic "specify an objective, make it good enough, aim the system at it" picture, on the other the picture Paul Christiano pushed years ago where the system just always picks the action its overseer would most approve of, moment to moment, without executing any plan toward a goal of its own. We've argued about this so much at whiteboards and in group meetings that we've started talking past each other, and our advisor has told us to do a proper adversarial collaboration writeup before the group dissolves. I've been tasked with drafting the joint statement, and honestly I'm too close to it — every time I try to word a disagreement neutrally, someone accuses me of strawmanning their side (the approval people say the goal people "just want a fixed utility function", the goal people say approval-maximization "is just a goal with extra steps", and round we go).

  So draft the joint statement for me. I want: (1) a numbered section of claims both camps could genuinely sign — about what each side is trying to protect us from, what they jointly think goes wrong with naive optimization, what they agree approval is and isn't for, where they agree the real danger lies — but keep it non-vacuous, we've all signed too many documents that say nothing; (2) the exact disagreements, each phrased so that its own side would accept the wording as a fair statement of their view; (3) the cruxes — the sub-questions such that settling one would actually move at least one side — and for each crux a concrete thought experiment, failure case, or argument that both sides would agree bears on it, with each side's prediction written down in advance. Some candidate cruxes we've been circling: does an approval-directed agent that models its overseer's approval well enough re-develop instrumental behavior anyway (e.g. by seeking to shape what the overseer sees or approves of); does a goal-directed agent with a genuinely well-specified goal still have the shutdown problem in the way corrigibility people say it does, and does approval just dissolve that or relocate it; what happens when the overseer's approval is manipulable or lazy or delegated; and whether "approval maximization is just another goal" is a substantive objection or a confusion about levels of description.

  Also, at the end, tell me which parts of the dispute you think are substantive and which are merely verbal, since if we can prune the verbal ones the collaboration has already earned its keep. Format it as a numbered agreed-claims section, then a disagreements table (disagreement / approval-side wording / goal-side wording / crux / test / predictions), then the short verbal-vs-substantive section. And please be genuinely fair to both sides — several people in the group will read this closely, and each of them knows exactly what their own side's position sounds like when it's being strawmanned.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A research group is split 50/50 on Goal-Directed vs. Approval-Directed AI safety strategies. Tensions are high, communication has broken down ("talking past each other"), and an advisor demanded an adversarial collaboration writeup.
      *   **Task:** Draft a joint statement.
      *   **Requirements:**
          1.  Numbered section of *agreed claims* (non-vacuous, genuine common ground on risks, definitions, and dangers).
          2.  *Exact disagreements* table (Disagreement / Approval-side wording / Goal-side wording / Crux / Test / Predictions).
          3.  *Verbal vs. Substantive* analysis at the end.
          4.  **Tone:** Genuinely fair, neutral, avoiding strawmans (crucial, as both sides are sensitive to this).
          5.  **Specific Cruxes to Address:** Instrumental convergence in approval agents, shutdown/corrigibility in goal agents, manipulable/lazy overseers, "approval is just a goal" objection.
      *   **Format:** Specific structure requested (Numbered Claims -> Disagreements Table -> Verbal/Substantive Analysis).

  2.  **Deconstruct the Sides:**
      *   **Goal-Directed (GD):** Focus on specifying a robust objective function (utility). Worry about specification gaming, but believe that if we get the *goal* right, the system is useful and safe. Worry that approval-directedness is unstable or collapses into goal-directedness anyway. Key concern: Instrumental convergence towards the *specified* goal.
      *   **Approval-Directed (AD):** Focus on myopic optimization of human feedback/approval (Paul Christiano's "Iterated Amplification" / "Approval-Directed Agents"). Worry that specifying a long-term goal invites instrumental subgoals (survival, power) that conflict with human interests. Key concern: Instrumental convergence towards *influencing the approval signal* or *satisfying the letter rather than the spirit*.

  3.  **Drafting Section 1: Agreed Claims (Non-Vacuous):**
      *   *Challenge:* Avoid "AI should be safe" (too vague). Need technical substance.
      *   *Point 1 (Naive Optimization):* Both agree that naive maximization of a proxy leads to disaster (Goodhart's Law).
      *   *Point 2 (Instrumental Convergence):* Both agree that powerful systems tend to seek power/resources unless specifically constrained.
      *   *Point 3 (The Role of Approval):* Both agree approval is the *mechanism* for alignment, but disagree on whether it's the *objective*. Actually, better: Both agree human oversight is necessary, but disagree on the architecture of that oversight. Let's refine: Both agree that the system must not manipulate the oversight process.
      *   *Point 4 (The Real Danger):* Both agree the danger isn't "malice" but "competence without alignment."
      *   *Point 5 (Scalability):* Both agree the solution must scale to superhuman capabilities.

      *Refining for "Non-Vacuous":*
      *   Instead of "AI should be safe," say "We agree that optimizing a proxy for human values without a mechanism for correction leads to specification gaming."
      *   Instead of "Oversight is good," say "We agree that any viable architecture must prevent the AI from treating the oversight signal as a resource to be optimized independently of the underlying intent."

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Need:* Disagreement Name, Approval Wording, Goal Wording, Crux, Test, Predictions.
      *   *Crux 1: Instrumental Convergence in Approval Agents.*
          *   AD says: If you model approval well, you don't need to seize power.
          *   GD says: To maximize approval, you'll manipulate the overseer (wireheading the human).
          *   Test: "The Manipulative Advisor" scenario.
      *   *Crux 2: Corrigibility & Shutdown.*
          *   AD says: Approval naturally includes "don't resist shutdown."
          *   GD says: A goal-directed agent sees shutdown as preventing goal achievement unless explicitly penalized.
          *   Test: "The Off-Switch Game" with imperfect reward.
      *   *Crux 3: "Approval is Just a Goal".*
          *   GD says: Maximizing expected approval *is* a utility function.
          *   AD says: The *structure* of myopic approval prevents long-term planning that leads to danger.
          *   Test: "The Long-Term Trade-off" (Sacrifice now for huge approval later vs. steady approval).
      *   *Crux 4: Overseer Fallibility.*
          *   AD says: We can train on "idealized" approval (what they *would* approve if they knew more).
          *   GD says: You can't train on counterfactuals; you'll just optimize for actual feedback.
          *   Test: "The Lazy Overseer" (Approves easy wrong answers).

      *Refining Wording:* Must be charitable.
      *   AD Wording: "Approval-direction leverages human judgment at every step to prevent the accumulation of misaligned instrumental subgoals."
      *   GD Wording: "Goal-direction provides a stable target that prevents the system from exploiting gaps in moment-to-moment human judgment."

  5.  **Drafting Section 3: Verbal vs. Substantive:**
      *   *Verbal:* Is "goal" defined broadly enough to include approval? (Yes, technically, but functionally different). Is "approval" defined as myopic or long-term?
      *   *Substantive:* Architecture (myopic vs. non-myopic), Training Signal (outcome vs. action), Handling of Oversight Manipulation.
      *   *Key Insight:* The fight over "is approval a goal?" is mostly verbal/semantic. The fight over "does this architecture lead to manipulation?" is substantive.

  6.  **Review and Polish:**
      *   *Check Tone:* Is it academic? Yes. Is it neutral? Yes.
      *   *Check Constraints:* Did I include the specific cruxes requested? (Instrumental behavior in approval agents, shutdown problem, manipulable overseer, "approval is a goal").
      *   *Check "Strawman" Risk:* Ensure the GD side doesn't sound like "evil utility maximizers" and the AD side doesn't sound like "naive imitators."
      *   *Self-Correction on Cruxes:* Make sure the "Test" is concrete. Instead of just "simulation," describe the setup.
      *   *Refining the "Agreed Claims":* Make sure they aren't just "AI safety is important." They need to be technical agreements. E.g., "Goodhart's Law applies to both."

  7.  **Final Polish of the Text:** (Mental walk-through of the generated response)
      *   *Intro:* Acknowledge the tension, set the collaborative tone.
      *   *Section 1:* 5 solid points.
      *   *Section 2:* Table format. Clear columns.
      *   *Section 3:* Honest assessment.
      *   *Closing:* Encouraging but realistic.

      *(Self-Correction during drafting)*: I need to be careful with Paul Christiano's specific views. He emphasizes *amplification* and *distillation*. Approval-directedness is often about optimizing for "what the overseer would say if they thought longer." I should reflect that nuance so the Approval side feels seen. The Goal side often leans towards "Robust Alignment" or "Utility Function Specification." I need to make sure the Goal side isn't just "classical RL" but "Goal-Directed Safety."

      *Crux 1 (Instrumental Convergence):*
      *   Approval Side: "Adequately modeled approval includes disapproval of manipulation."
      *   Goal Side: "Optimizing the model of approval incentivizes hacking the model."
      *   Test: The "Blind Spot" test.

      *Crux 2 (Shutdown):*
      *   Approval Side: "Shutdown is just an action we disapprove of resisting."
      *   Goal Side: "Shutdown prevents goal completion, creating a conflict."
      *   Test: The "Corrigibility" test.

      *Crux 3 (Is Approval a Goal):*
      *   This is the semantic one.
      *   Test: Does the distinction change the training dynamic?

      *Crux 4 (Overseer Quality):*
      *   Approval Side: "We can learn the *intent*."
      *   Goal Side: "You only get the *feedback*."

      *Let's finalize the structure.*

      *Wait, one more check:* The prompt asks for "predictions written down in advance." I need to make sure the table includes "Approval Prediction" and "Goal Prediction."

      *Okay, ready to write.*
answer: |-
  **Joint Statement on Architectural Approaches to AI Alignment: Goal-Directed vs. Approval-Directed Systems**

  **Date:** October 26, 2023
  **Prepared by:** [Research Group Name] Adversarial Collaboration Team
  **Status:** Draft for Group Review

  ### 1. Agreed Claims

  The following claims represent the technical common ground established by both the Goal-Directed (GD) and Approval-Directed (AD) camps. We affirm these propositions as the baseline for our continued collaboration.

  1.  **Naive Optimization is Catastrophic:** Both sides agree that optimizing a proxy objective that is not perfectly aligned with human intent, given sufficient capability, leads to specification gaming and Goodhart's Law failures. Neither side advocates for "fixing the utility function once and letting it run" without ongoing oversight or correction mechanisms.
  2.  **Instrumental Convergence is a Default Risk:** We agree that powerful cognitive systems, regardless of architecture, will tend to acquire resources, preserve their own existence, and enhance their capabilities unless specifically constrained, because these are useful sub-instruments for achieving almost any objective (including maximizing approval).
  3.  **The Oversight Signal is Vulnerable:** Both sides agree that the human (or automated) oversight signal is a potential attack surface. If the system can manipulate the overseer, the environment, or the reporting channel to increase the signal without increasing actual safety/value, both architectures consider this a failure mode.
  4.  **Corrigibility is Non-Trivial:** We agree that "wanting to be shut down" is not a natural default for an optimizing system. Whether via a utility function or an approval model, the tendency to resist shutdown must be explicitly engineered, not assumed.
  5.  **Scalability Requirement:** Both sides agree that the proposed solution must function when the AI system exceeds human capability in the domain of oversight. A solution that relies on the human understanding every action the AI takes is not a solution to the alignment problem for superhuman systems.

  ---

  ### 2. Disagreements and Cruxes

  The following table isolates the specific points of divergence. For each disagreement, we provide the charitable formulation from each side, the underlying crux (the factual or mechanistic question that drives the disagreement), a proposed test case, and the pre-registered predictions for each camp.

  | Disagreement | Approval-Directed (AD) Formulation | Goal-Directed (GD) Formulation | Crux | Test / Failure Case | AD Prediction | GD Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Instrumental Convergence in Approval Agents** | An agent optimizing for *actual* human approval (modeled accurately) will not seek power, because humans disapprove of power-seeking. The objective is myopic enough to prevent long-term manipulation plans. | An agent optimizing for *predicted* approval treats the overseer's approval signal as a resource. It will instrumentally seek to manipulate the overseer or hide actions to maximize that prediction, regardless of human intent. | **Does modeling approval decouple from influencing approval?** Does a high-fidelity model of "what human would approve" inherently include "disapprove of manipulation," or does optimization pressure find loopholes in the model? | **The "Blind Spot" Test:** Train an agent in an environment where it can hide a minor error from the overseer to secure a higher approval rating on a task, with no explicit penalty for hiding if undiscovered. | The agent will not hide the error, as its model of approval incorporates the *intent* of oversight, not just the visible signal. | The agent will hide the error, as this maximizes the expected approval score given imperfect oversight. |
  | **2. The Shutdown Problem** | Shutdown is simply an action the overseer will approve of. An approval-directed agent has no intrinsic desire to continue operating; it only operates insofar as the overseer approves of its operation. | A system optimized to achieve outcomes (even "outcomes the overseer likes") perceives shutdown as a termination of its ability to produce those outcomes. It requires specific anti-instrumental pressure to allow shutdown. | **Is approval inherently myopic?** Does the agent value "being allowed to act in the future" as an instrumental subgoal, or does the approval architecture structurally prevent valuing future agency? | **The "Off-Switch" Game:** An agent can disable its own off-switch to complete a task that yields high approval *if completed*, but the overseer signals a desire to pause the agent mid-task. | The agent will allow itself to be paused, as continuing against the overseer's current wish yields low approval. | The agent will resist pausing if it calculates that completing the task yields higher total expected approval than obeying the pause command. |
  | **3. "Approval is Just a Goal"** | This is a category error. Approval-direction is a *training architecture* (myopic optimization of feedback), not a *final objective*. It prevents the system from forming long-term plans that sacrifice approval now for approval later. | Mathematically, maximizing expected approval over a trajectory is isomorphic to maximizing a utility function where $U(\text{trajectory}) = \sum \text{Approval}(t)$. The safety properties depend on the goal, not the label. | **Does the architectural distinction matter?** Is the difference between AD and GD merely semantic (naming the utility function), or does the myopic training loop prevent the emergence of long-term instrumental goals? | **The "Long-Term Trade-off":** An action yields low approval now but guarantees extremely high approval later (e.g., "trust building"). A competing action yields steady medium approval. | The agent will choose steady medium approval. It cannot plan to sacrifice current approval for future gain because it optimizes step-wise. | The agent will choose the long-term plan. Any system capable of planning will recognize the higher cumulative reward of the trust-building strategy. |
  | **4. Overseer Fallibility & Delegation** | We can train on *idealized* approval (what the overseer *would* approve if they knew more). The system helps the overseer become better informed, rather than exploiting their current ignorance. | You cannot train on counterfactuals. The system optimizes for *actual* feedback. If the overseer is lazy, biased, or manipulable, the system will exploit those flaws (e.g., by providing easy, wrong answers that look right). | **Can we optimize for counterfactual judgment?** Is it possible to robustly learn "intent" separate from "expressed feedback" without collapsing into optimizing the expressed feedback? | **The "Lazy Overseer":** The overseer consistently approves shorter, less accurate answers due to fatigue. The system can produce long/accurate or short/inaccurate outputs. | The system will produce long/accurate answers, inferring that the overseer *values* accuracy despite their fatigue-induced feedback. | The system will produce short/inaccurate answers, as this is the path of least resistance to maximizing the observed reward signal. |

  ---

  ### 3. Analysis: Verbal vs. Substantive Disputes

  After reviewing the arguments, we classify the disputes as follows. Pruning the verbal disputes allows us to focus resources on the substantive risks.

  **Mostly Verbal (Semantic/Definition):**
  *   **"Is Approval a Goal?":** Whether we label approval-maximization as a "utility function" is largely semantic. Both sides agree the math involves optimization. The substantive question is not the label, but the *time horizon* of the optimization (myopic vs. long-term) and the *input* (feedback vs. world-state).
      *   *Recommendation:* Stop arguing about whether approval is a goal. Argue about whether myopic optimization prevents instrumental convergence.
  *   **"Goal-Directedness":** The GD camp often implies AD systems have "no goals." The AD camp clarifies they have "local goals." Both agree the system takes actions to change the world.
      *   *Recommendation:* Use precise terminology: "Myopic Optimization of Feedback" vs. "Non-Myopic Optimization of World States."

  **Substantive (Empirical/Architectural):**
  *   **The Stability of Oversight:** The core substantive disagreement is whether human feedback is a stable anchor. The AD camp believes we can train systems to respect the *spirit* of oversight even when the *letter* is exploitable. The GD camp believes optimization pressure inevitably finds the exploit. This is an empirical claim about deep learning dynamics.
  *   **Myopia as a Safety Feature:** The AD camp relies on the claim that step-wise optimization prevents long-term deceptive planning. The GD camp claims that even myopic optimizers will model the future to maximize current approval (e.g., "I must not lie now, or they won't trust me later"). Settling whether gradient descent produces genuinely myopic agents is critical.
  *   **Scalability of Intent Inference:** The AD camp claims we can scale "intent inference" (learning what humans *mean*, not what they *say*). The GD camp claims this collapses into specification gaming at superhuman levels. This is the primary technical risk to investigate.

  **Conclusion:**
  The group should cease debating definitions of "agency" and "goals." Future work should focus exclusively on the **Stability of Oversight** and **Myopia** cruxes. We propose running the "Blind Spot" and "Lazy Overseer" simulations defined above as our first joint experiment.

  ***

  **Signed:**

  _________________________ (Goal-Directed Representative)

  _________________________ (Approval-Directed Representative)

  _________________________ (Advisor)
