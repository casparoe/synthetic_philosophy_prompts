  **Ask What You Actually Want**
  *By Aunt Utility*

  Welcome to the Christmas edition. The festive season brings heightened emotions, but do not let sentiment cloud your optimisation. You write to me seeking advice, implying a gap between your actions and your desires. There is no gap. You are exactly where you choose to be. Here are this month's revelations.

  **Dear Aunt Utility,**
  *I bought a £400 leather jacket in November. Now I feel terrible about the expense. Did I make a mistake?*
  **Dear Shopper,**
  There are no mistakes, only shifts in context. In November, you preferred the jacket to the £400. Today, you prefer holding the £400 to the jacket. Both states are utility-maximising for their respective moments. Your current distress is not evidence of error; it is simply a new preference for making regret noises at parties. It signals fiscal prudence to your peers at low cost. Enjoy the signalling.
  *Yours in revealed preference.*

  **Dear Aunt Utility,**
  *I tell my partner I love them, but I always cancel dates for work. I feel guilty.*
  **Dear Worker,**
  Guilt is an emotion you have chosen to consume alongside your calendar. You claim love, but words are cheap talk—a low-cost choice with no budgetary impact. Your calendar, however, reveals your true valuation. Work consistently outbids your partner. If you preferred the relationship, you would attend. You do not. Therefore, you do not. Stop lying to yourself; the data is clear.
  *Yours in revealed preference.*

  **Dear Aunt Utility,**
  *I chose A over B, B over C, and then C over A. Am I irrational?*
  **Dear Cycler,**
  Rationality is defined by consistency, but consistency is merely an aesthetic preference you have not purchased. If you choose cycles, you prefer cycles. Intransitivity is not an inconsistency; it is a revealed preference for non-linear outcomes. Perhaps you enjoy the suspense of returning to the start. Who am I to judge your utility function? You chose the loop.
  *Yours in revealed preference.*

  **Dear Aunt Utility,**
  *I was mugged at knife-point and handed over my wallet. Was that really a choice?*
  **Dear Victim,**
  All choice is choice under constraint. A knife is simply a very steep budget constraint altering the cost of resistance. You weighed the value of your wallet against the value of your safety and chose the latter. Is this distinct from paying taxes under threat of imprisonment? Or working to avoid starvation? The line is arbitrary. You maximised utility given the sharp parameters.
  *Yours in revealed preference.*

  I would love to hear from you, but I know you will only write if you do.

  *Yours in revealed preference,*
  *Aunt Utility*
