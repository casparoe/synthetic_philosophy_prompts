          *   Path to progress: Shift from essentialism to componential/process models (e.g., psychological constructionism). Neuroscience helps here by showing no single locus. Conceptual distinctions (occurrent vs. dispositional) help.
          *   Final verdict: It's ill-posed *as an essentialist quest*, but productive *as a functional analysis*.

