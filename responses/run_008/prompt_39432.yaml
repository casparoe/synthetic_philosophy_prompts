answer: |-
  This is a classic philosophical standoff, and honestly, your skepticism is well-founded. Your brother-in-law (BIL) has a solid grasp of the *story* Quine tells, but he gets a bit wobbly on the *conclusions* Quine draws and the nature of Chomsky's objection. This is a very common pattern in pop-philosophy: the thought experiment is remembered vividly, but the technical implications get blurred.

  Here is a breakdown of his claims, piece by piece, distinguishing between what Quine actually argued, where your BIL simplifies things, and where he gets it wrong. I'll also flag what is settled scholarship versus what is still actively debated.

  ### 1. The Setup: The Linguist, the Tribe, and the Rabbit
  **BIL's Claim:** Quine imagines a field linguist among a remote tribe; a rabbit runs by, the native says "gavagai," and the linguist writes down "rabbit."
  **Verdict:** **Accurate.**
  **The Scholarship:** This is the opening move of Quine's 1960 book *Word and Object*. He calls this the scenario of "radical translation." The key constraint is that the linguist has no dictionaries, no cognate languages, and no prior cultural knowledge. They must rely entirely on observing the native's behavior in response to sensory stimuli.
  **Settled vs. Contested:** There is no dispute here. This is the standard text.

  ### 2. The Insight: Rabbit vs. Rabbit-Part vs. Rabbit-Stage
  **BIL's Claim:** The evidence is equally consistent with "rabbit," "undetached rabbit part," or "rabbit-stage."
  **Verdict:** **Accurate.**
  **The Scholarship:** Quine calls this the **"inscrutability of reference."** When the native says "gavagai," they are assenting to the presence of the rabbit. But logically, every time a rabbit is present, an "undetached rabbit part" is also present, and a "temporal stage of a rabbit" is also present. Based *only* on the visible situation and the word "gavagai," you cannot distinguish between these ontological categories.
  **Settled vs. Contested:** Philosophers generally agree that Quine successfully demonstrates this logical underdetermination. If you limit yourself strictly to behavioral correlation, reference is indeed inscrutable.

  ### 3. The Conclusion: "Translation is Impossible in Principle"
  **BIL's Claim:** Quine concluded that translation between languages is impossible in principle.
  **Verdict:** **Distortion.**
  **The Scholarship:** Quine does **not** claim translation is impossible. We translate things every day, and Quine admits we do so successfully enough for practical purposes. His thesis is the **"indeterminacy of translation."**
  His argument is that there is no *fact of the matter* about which translation is the *correct* one. You could create two different translation manuals (one mapping "gavagai" to "rabbit," another mapping it to "rabbit-stage") that are both fully compatible with all possible behavioral evidence, yet contradict each other.
  **Why it matters:** Your BIL's phrasing suggests we can't communicate. Quine's actual point is more subtle: communication works, but "meaning" isn't a fixed object that gets transferred. There is no unique "true" translation waiting to be discovered.
  **Settled vs. Contested:** This is a frequent misunderstanding. Scholars agree Quine argues for *indeterminacy*, not *impossibility*.

  ### 4. The Nature of Meaning: "Behaviorist Fiction"
  **BIL's Claim:** Meaning is a behaviorist fiction—just stimulus and response, nothing underneath.
  **Verdict:** **Mostly Accurate, but needs nuance.**
  **The Scholarship:** Quine was a methodological behaviorist. He rejected what he called the "museum myth" of meaning—the idea that words are labels for mental objects or ideas inside our heads. For Quine, if you can't observe it (via behavior or speech dispositions), it doesn't count as scientific data. So, in a sense, he did argue that "meanings" as private mental entities are fictions.
  **Nuance:** However, saying meaning is *just* stimulus and response is a simplification. Quine acknowledged a web of belief and holistic connections between sentences. He didn't think language was simple robotic conditioning, but he did insist that meaning must be cashed out in terms of public use, not private mental states.
  **Settled vs. Contested:** The rejection of "mental meanings" is central to Quine. However, whether behaviorism is the *right* framework for this is heavily contested (see the Chomsky point below).

  ### 5. The Chomsky Counter: "Poverty of the Stimulus"
  **BIL's Claim:** Chomsky demolished the whole argument decades ago with the poverty of the stimulus.
  **Verdict:** **Contested / Overstated.**
  **The Scholarship:** This is the shakiest part of your BIL's summary. Noam Chomsky did write a famous review of *Word and Object* (and later critiques), arguing that Quine's behaviorism cannot explain how children learn language so quickly (the "poverty of the stimulus" argument). Chomsky argues we have innate linguistic structures (Universal Grammar).
  **Why it's not a "Knockdown":** Chomsky and Quine are often talking past each other.
  *   **Chomsky** is arguing about *language acquisition* (how we learn grammar).
  *   **Quine** is arguing about *reference and ontology* (what our words point to in the world).
  Even if Chomsky is right that we have innate grammar, it doesn't necessarily solve Quine's "gavagai" problem. You could still have an innate grammar that leaves the reference of "gavagai" indeterminate between "rabbit" and "rabbit-part." Many contemporary philosophers (like Peter Hylton or Robert Stalnaker) argue that Chomsky attacked Quine's behaviorist *psychology*, but didn't necessarily refute the logical point about *indeterminacy*.
  **Settled vs. Contested:** This is **highly contested**. In linguistics, Chomsky is dominant. In philosophy of language, Quine's indeterminacy thesis is still taken very seriously. It is not settled that Chomsky "won."

  ### 6. The Handicap: "Quine forbade pointing or questions"
  **BIL's Claim:** The puzzle only exists because Quine arbitrarily handicapped the linguist by forbidding him to point, ask questions, or use context.
  **Verdict:** **Genuine Distortion.**
  **The Scholarship:** This is a very common misconception. Quine explicitly **allows** the linguist to point, ask questions, and check for assent or dissent (nodding/shaking head). He calls this "stimulus meaning."
  Quine's point is that even if you use *every possible behavioral tool* available (pointing, questioning, waiting for different situations), you still cannot logically force the data to rule out "rabbit-stage" in favor of "rabbit." The limitation isn't methodological (what the linguist is allowed to do); it's metaphysical (there is no fact of the matter to be found).
  **Why it matters:** If your BIL thinks Quine just made the linguist's job artificially hard, he misses the entire philosophical point. Quine is saying the universe doesn't contain enough facts to settle the question, not that the linguist is too clumsy to find them.
  **Settled vs. Contested:** Among Quine scholars, it is settled that Quine allows full behavioral interaction. This is a misreading of the text.

  ### Summary for the Family Dinner
  If you want to navigate this without starting a fight, here is the bottom line:

  1.  **Your BIL is right** that the "gavagai" story is about the limits of evidence and that Chomsky offered a major rival framework (innatism vs. empiricism).
  2.  **Your BIL is wrong** to say Quine claimed translation is *impossible* (he said it's *indeterminate*) and wrong to claim Quine forbade pointing or questioning (he allowed all behavioral evidence).
  3.  **The Chomsky Refutation** is not a settled verdict. It's more like two different sports being played on the same field. Chomsky explains learning; Quine explains reference. Many philosophers think the "gavagai" problem remains open despite Chomsky.

  **The Verdict:** Your intuition that the leap from "rabbit vs. rabbit-part" to "translation is impossible" felt off was correct. Quine's actual claim is more subtle (indeterminacy), and your BIL's dismissal of it via Chomsky is a bit too confident for the current state of the field. You don't have to refute him, but you can confidently say that Quine scholars generally view the "handicap" objection as a misunderstanding of the thought experiment.
