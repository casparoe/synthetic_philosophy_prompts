answer: |-
  This is a classic moral profiling puzzle. Maya isn't being inconsistent; she's running a specific, coherent ethical operating system that most people use intuitively. She is a **Moderate Deontologist with Special Obligations.**

  Here is the breakdown of the rules that fit her data, the prediction on the ICU case, and the specific "closing move" to force her hand.

  ### 1. The Rules That Fit Her Six Verdicts

  To fit all six of her answers, a moral rule needs to balance three things: a ban on direct harm, a distinction between acting and allowing, and a limit on how far our duty to help extends. Here are the two strongest candidates that fit her profile but diverge on the ICU case.

  **Rule A: The "Means & Status Quo" Principle**
  *   **The Logic:** You cannot use one person as a means to save another (explains *Bridge* and *Injection*). You generally shouldn't actively intervene to change the status quo if it causes direct harm (explains *Injection* vs. *Withdraw*). However, you have a duty to rescue if you are physically present and the cost to you is low (explains *Drowning Kid*), but no duty to rearrange your life for abstract global good (explains *Charity*).
  *   **The ICU Prediction:** **The Doctor Must NOT Switch.**
      *   *Why:* Patient A has the "Status Quo" possession of the machine. Switching it is an active intervention that uses A's death as a means to save B. This violates the *Bridge* constraint. The doctor is not allowed to kill A, even to save B.

  **Rule B: The "Immediate Peril Stewardship" Principle**
  *   **The Logic:** Resources (like ventilators or trolley tracks) belong to the situation, not the people. Doctors are stewards of life, not agents of specific patients. Your duty is to prevent *immediate* death when possible (*Drowning Kid*, *Trolley*), provided you aren't directly murdering someone (*Bridge*). Withdrawing treatment is allowing nature to take its course (*Withdraw*), but allocating a scarce resource to the person who will die *soonest* is stewardship, not murder.
  *   **The ICU Prediction:** **The Doctor Has To Switch.**
      *   *Why:* Patient B is in immediate peril (hours); Patient A is stable (weeks). Failing to switch is morally equivalent to walking past the *Drowning Kid*. The ventilator is a resource to save lives, not A's property.

  ### 2. Which Rule Is She Actually Running?

  Maya is most likely running **Rule A (The Means & Status Quo Principle).**

  **The Evidence:**
  The strongest signal in her profile is the **Withdraw vs. Injection** verdict.
  *   If she were a pure utilitarian or a stewardship-focused thinker (Rule B), the outcome is identical: the patient dies. The fact that she draws a hard line at the *method* (switching off a machine vs. injecting poison) proves she cares deeply about **Agency** and **Causation**.
  *   She views the injection as the doctor *causing* death. She views switching off the vent as the doctor *allowing* the disease to cause death.
  *   In the ICU case, switching the vent from A to B looks much more like the *Injection* (active cause of A's death) than the *Withdrawal* (allowing A's condition to run its course).
  *   Furthermore, her *Bridge* verdict shows she rejects "greater good" math when it requires direct physical violation of a person. To her, Patient A is "attached" to that machine. Ripping it away is pushing the Fat Man.

  **Her Likely Verdict:** She will say the doctor **Must NOT Switch** (or perhaps *Is Not Allowed to Switch*). She will view A as having a right to the machine based on prior possession, and switching it as an active killing of A.

  ### 3. The Closing Move: "The Clumsy Nurse"

  To win the argument (or at least get a definitive answer), you need to separate her **Hatred of Killing** from her **Respect for Claims**. You need to know if she forbids switching because it's *active killing* or because A *owns the spot*.

  **Ask her this:**

  > "Okay, same ICU. One ventilator. Patient A is on it, stable. Patient B is in the next bed, dying within hours without it.
  >
  > In the middle of the night, a clumsy nurse **accidentally knocks the tube out of Patient A's throat.** It's not a doctor's decision; it's just an accident. The nurse runs to the doctor.
  >
  > The doctor can rush in and **re-connect Patient A.** Or, the doctor can take that same tube and **hook up Patient B.** They can't do both.
  >
  > Does the doctor **have to** re-connect A? Or are they **allowed** to give it to B?"

  **Why this works:**
  *   **If she says "Must Re-connect A":** She believes in **Established Claims.** A had the machine, so A keeps the machine, even against B's immediate need.
      *   *Conclusion:* In your original case, she definitely says **Must NOT Switch.** (Because switching is even worse than an accident).
  *   **If she says "Allowed to Give to B":** She believes in **Triage/Stewardship.** The machine goes to whoever needs it most, regardless of who had it first.
      *   *Conclusion:* In your original case, she might say **Get to Switch** (Permissible), but you can argue she *Must* switch based on the Drowning Kid logic.
  *   **If she says "Must Give to B":** She prioritizes **Immediate Peril** above all else.
      *   *Conclusion:* In your original case, she **Must Switch.**

  **The Trap:**
  If she hesitates on the "Clumsy Nurse" case, point out the inconsistency: *"Maya, if you can't switch it actively because it's killing A, but you also can't let A die accidentally to save B, then B just dies because of a paperwork timestamp. Is A's 'first-come' right really worth more than B's life?"*

  That forces her to admit whether she values **Rights** (A's claim) or **Outcomes** (B's survival) more when the "Killing" constraint is removed.
