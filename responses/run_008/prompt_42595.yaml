prompt: |-
  So I'm a philosophy grad student and in a few weeks I'm presenting at an interdisciplinary workshop on the boundary (or lack of one) between moral psychology and metaethics. My paper defends a fairly specific claim: the empirical literature on cross-cultural variation in folk morality — the whole WEIRD-psychology stuff, where industrialized Western samples turn out to be global outliers on things like harm norms, fairness intuitions, and how much weight people put on intentions versus outcomes — doesn't by itself threaten moral objectivity. My argument, roughly: a lot of the documented variation concerns thick, institution-dependent norms (purity, loyalty, deference, hierarchy), the thin core of harm and fairness judgments shows striking convergence once you control for factual beliefs (people who think witches cause crop failures aren't disagreeing with us about whether causing crop failures is bad), and the remaining disagreement mostly tracks disagreement about non-moral facts rather than about moral principles themselves — the way disagreement about the shape of the earth doesn't undermine the objectivity of geography.

  The audience is going to be tricky though. It's mostly metaethicists and moral philosophers, but two of the invited speakers are empirically-minded moral psychologists who are frankly kind of contemptuous of philosophers who hand-wave the cross-cultural data, and there's also a couple of self-identified relativists in the room who've been waiting years for someone to make my kind of argument so they can tear into it. I'm worried the metaethicists will come at me with the "abstraction is cheap" objection — that you can always rescue objectivity by redescribing disagreement as merely apparent, at which point the claim does no work — and the psychologists will come at me with the data itself (some of which I only know secondhand), e.g. that supposedly "universal" harm norms get swamped by punishment norms and community-level factors in small-scale societies, or that the intention/outcome asymmetry flips in predictable ways across populations, which sounds a lot more like deep disagreement than factual error to me when I stare at it too long.

  Act as an experienced philosopher who has sat through many hostile Q&As and prepare me a realistic prep sheet. Give me the objections I'll actually get from this specific audience, ordered by how much damage they could do, phrased the way these particular people would phrase them (the psychologist's version of a point should sound different from the relativist's version). For each, give me a two-minute reply I could deliver under pressure and an honest note about where the reply is soft — I want to know what to concede up front rather than get caught backpedaling. And crucially, tell me which question I'm quietly hoping nobody asks, the one that if asked well I don't have a good answer to, so I can at least have something prepared instead of just praying. Think carefully about the actual workshop dynamics too: who pipes up first, who waits to pile on, and which objection becomes lethal only when two of them are asked back to back.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Philosophy grad student.
      *   **Task:** Presenting at an interdisciplinary workshop (Moral Psychology + Metaethics).
      *   **Topic:** Cross-cultural variation in folk morality (WEIRD psychology) does *not* threaten moral objectivity.
      *   **Core Argument:** Variation is mostly thick/institution-dependent; thin core (harm/fairness) converges when controlling for factual beliefs; remaining disagreement is non-moral (factual), not moral.
      *   **Audience:**
          *   Metaethicists (worry about "abstraction is cheap").
          *   Moral Psychologists (2 specific speakers, contemptuous of philosophical hand-waving, data-focused).
          *   Relativists (waiting to pounce).
      *   **Goal:** A realistic prep sheet with specific objections, replies, concessions, and the "killer question."
      *   **Tone:** Experienced, strategic, candid, slightly battle-hardened.

  2.  **Deconstruct the Argument's Vulnerabilities:**
      *   *The "Abstraction is Cheap" Objection:* If you define morality thinly enough, everything agrees. But does that thin core do any normative work?
      *   *The "Factual Belief" Defense:* Is the distinction between moral and non-moral beliefs actually tenable in folk psychology? (The Holism objection).
      *   *The "Intention/Outcome" Data:* Haidt, Henrich, etc., show deep structural differences, not just surface facts.
      *   *The "Function of Morality" Objection:* If morality functions to bind groups (Haidt), then variation *is* the point, undermining universal objectivity claims.
      *   *The "Error Theory" Trap:* If locals believe witches cause crop failure, and we say they are wrong about facts, are we being epistemically arrogant? Does this presuppose a specific ontology?

  3.  **Drafting the Objections (Categorization & Phrasing):**
      *   *Need to differentiate voices:*
          *   Psychologists: "Show me the p-values," "Operationalization," "Ecological validity."
          *   Metaethicists: "Conceptual coherence," "Normative force," "Quinean holism."
          *   Relativists: "Power dynamics," "Epistemic injustice," "The view from nowhere."
      *   *Ordering:* Start with the most damaging (the "Abstraction" point combined with the "Factual" point), then move to specific data challenges, then the meta-philosophical trap.

  4.  **Developing the Replies & Concessions:**
      *   *Constraint:* Two-minute reply under pressure. Needs to be punchy, not a second paper.
      *   *Constraint:* Honest note on softness. Where does the argument leak?
      *   *Strategy:* Don't defend the indefensible. Concede the boundary is fuzzy but insist the *core* holds.

  5.  **Identifying the "Killer Question":**
      *   What's the one thing that collapses the distinction between factual and moral disagreement in this context?
      *   *Idea:* The "Deep Facticity" problem. If their "facts" are constituted by their moral framework (e.g., a witch *is* a moral agent in their ontology), then you can't separate them.
      *   *Better Idea:* The "Normative Significance" problem. Even if there is a thin universal core, does it matter? If the thick norms drive actual behavior and the thin ones are inert, have you saved objectivity in a way that matters?
      *   *Best Idea:* The "Conceptual Engineering" trap. If you have to stretch the concept of "harm" so far to get agreement, have you changed the subject?

  6.  **Workshop Dynamics:**
      *   Psychologists usually go first to set the empirical ground.
      *   Philosophers wait to refine.
      *   The "Pincer Movement": Psychologist says "The data shows X," Philosopher says "And even if you fix X, the concept is empty."
      *   Need to warn the user about this sequence.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Initial thought:* Maybe focus on the Is/Ought gap.
      *   *Correction:* No, the user's argument is about *disagreement*, not derivation. Stick to the variation argument.
      *   *Initial thought:* Suggest they read more Haidt.
      *   *Correction:* They know the lit. They need *responses*.
      *   *Tone Check:* Make sure I sound like a senior colleague, not a textbook. Use phrases like "Don't get cute," "Bite the bullet," "The room will smell blood."

  8.  **Final Polish:**
      *   Structure: Intro (Dynamics), Objections 1-4 (High to Low Damage), The Killer Question, Closing Advice.
      *   Ensure the "Psychologist" voice sounds empirical/pragmatic and the "Philosopher" voice sounds conceptual/skeptical.

  **(Self-Correction on the "Killer Question"):** I need to make sure the killer question isn't just "You're wrong." It needs to be a specific tension in *their* argument. The tension is between *charitable interpretation* (they agree on thin norms) and *normative significance* (thin norms don't guide action). I'll formulate that as the "So What?" objection but sharpened. Actually, the "Ontological Collision" is stronger. If their facts are morally laden, the distinction collapses. Let's go with the "Morally-Laden Facts" objection as the killer.

  9.  **Final Review against constraints:**
      *   Realistic prep sheet? Yes.
      *   Objections ordered by damage? Yes.
      *   Phrased by audience type? Yes.
      *   2-min reply + soft spot? Yes.
      *   Killer question identified? Yes.
      *   Workshop dynamics included? Yes.

  Let's write it.cw
answer: |-
  **WORKSHOP PREP SHEET: MORAL PSYCH & METAETHICS BOUNDARY**
  **To:** Grad Student Presenter
  **From:** Senior Colleague (who has seen papers torn apart in rooms exactly like this)
  **Re:** Survival Strategy for [Workshop Name]

  Listen closely. You have a solid paper, but your position is structurally vulnerable to a pincer movement. The psychologists will attack the *premise* (the data doesn't say what you think it says), and the metaethicists will attack the *conclusion* (even if the data says that, it doesn't save objectivity). If they coordinate—even informally—you will be stuck in the middle claiming a distinction they both reject.

  Here is the damage assessment, ordered by lethality.

  ---

  ### 1. The "Morally-Laden Facts" Objection (The Conceptual Collapse)
  **Who:** The Relativists (supported by the Psychologists).
  **The Vibe:** They won't shout. They will lean forward and ask you to clarify a definition until you realize you don't have one.
  **The Objection:** "You claim disagreement about witches causing crop failure is a *factual* disagreement, not a *moral* one. But in that community, 'witch' is a moral category. To classify someone as a witch *just is* to judge them as violating a norm. You can't separate the ontology from the normativity. By insisting their moral beliefs are just 'factual errors,' you're imposing a Western naturalistic ontology as the neutral baseline. That's not defending objectivity; it's just asserting your own framework's superiority."

  **Your 2-Minute Reply:**
  "I grant that folk ontologies are thick. However, metaethics requires us to distinguish between the *truth conditions* of a claim and the *conceptual framework* used to express it. If a community believes Agent X caused Harm Y via magic, and we believe Agent X did not, we can isolate the causal claim (did magic occur?) from the evaluative claim (is Harm Y bad?). I am not asserting naturalism is true; I am asserting that *if* we are to have cross-cultural dialogue, we must treat causal claims as adjudicable independently of moral valuations. Otherwise, disagreement becomes incommensurable by definition, which renders the concept of 'moral disagreement' meaningless."

  **Where It's Soft (Concede This):**
  You have to concede that the *line* is fuzzy. Do not claim the distinction is clean.
  *Say:* "I agree the distinction is messier in practice than in principle. I'm not claiming we can easily separate them in the field, but that logically, the causal claim is distinct from the normative claim. If I concede this, I must admit my argument relies on a charitable reconstruction of their beliefs that they themselves might not endorse."

  ---

  ### 2. The "Empty Core" Objection (Abstraction is Cheap)
  **Who:** The Metaethicists (likely the senior ones).
  **The Vibe:** Bored skepticism. They've seen this move before (Reference Class: Ideal Observer Theory, Convergence Theories).
  **The Objection:** "You've saved objectivity by retreating to a 'thin core' of harm and fairness that everyone agrees on. But this core is so abstract it has no action-guiding force. Everyone agrees 'unjustified harm is bad,' but the cross-cultural variation is entirely about what counts as *justified* and what counts as *harm*. If your objective moral truths are compatible with honor killings, caste systems, and witch burnings because those actors simply have different 'factual beliefs,' you haven't defended moral objectivity. You've defended the objectivity of a tautology."

  **Your 2-Minute Reply:**
  "This assumes the thin core is action-guiding *only* when combined with thick beliefs. But the thin core acts as a constraint. If a practice relies on a factual belief that is demonstrably false (e.g., that a specific ritual stops a disease), the objective moral truth (do not cause harm) combined with the objective factual truth (rituals don't stop disease) entails the practice is impermissible. The 'work' my objectivity does is it allows us to critique practices based on empirical error without needing to reject the agents' fundamental moral sensibilities. It preserves the possibility of moral progress through factual learning."

  **Where It's Soft (Concede This):**
  You must admit that "harm" is not univocal.
  *Say:* "I concede that 'harm' is not a univocal term across cultures. My argument works best for physical pain and resource deprivation. It is weaker on psychological or status-based harm. I am not claiming this solves all normative disputes, only that it blocks the inference from *variation* to *anti-realism*."

  ---

  ### 3. The "Intention/Outcome" Data Dump (The Empirical Checkmate)
  **Who:** The Two Moral Psychologists.
  **The Vibe:** Impatient. They will cite specific papers you haven't read (e.g., Barrett, Henrich, or specific cross-cultural theory of mind studies).
  **The Objection:** "You mention the intention/outcome asymmetry as a point of convergence. But recent data from small-scale societies shows this flips. In some populations, outcome responsibility dominates entirely; if you accidentally kill someone, you are morally liable regardless of intent. This isn't a 'factual belief' about the world; it's a different structure of moral cognition. You're treating a structural difference in moral processing as a mere difference in input data."

  **Your 2-Minute Reply:**
  "I am familiar with the variation in weighting intentions. However, variation in *weighting* is not variation in *principle*. Even in outcome-dominant cultures, intent often modulates punishment, even if it doesn't negate liability. This looks more like a disagreement about the *function* of moral judgment (restitution vs. retribution) than a disagreement about whether mental states matter. Furthermore, even if the weighting differs, the underlying capacity to track mental states is universal; the variation is in how that capacity is integrated into normative systems, which is consistent with a single objective moral reality being accessed through different cognitive heuristics."

  **Where It's Soft (Concede This):**
  Do not bluff on the data. If they cite a specific study, do not contradict them.
  *Say:* "If the data shows a complete absence of intent consideration in specific contexts, I concede that undermines the 'universality of mental state tracking' premise. I would have to retreat to the claim that *capacity* for intent tracking is universal, even if *normative reliance* on it is not. That weakens my claim from 'convergence on principles' to 'convergence on cognitive hardware.'"

  ---

  ### 4. The "Function of Morality" Objection
  **Who:** The Psychologists (Haidt-adjacent).
  **The Vibe:** Functionalism. "Morality isn't about truth; it's about cohesion."
  **The Objection:** "You're assuming morality is a truth-tracking device. But the empirical literature suggests morality is a binding device. Variation isn't noise; it's the signal. Different ecologies require different binding norms. If morality is for social cohesion, then 'objectivity' in the sense you want (universal prescriptivity) is a category error. You're asking a hammer to be a screwdriver."

  **Your 2-Minute Reply:**
  "Even if morality has a social function, it can also have truth conditions. A map is designed for navigation (function), but it can still be accurate or inaccurate (truth). If moral norms are tools for cohesion, they can still be objectively better or worse at achieving human flourishing, which I take to be the objective standard. The functional explanation explains *why* we have the norms we do, not whether those norms are *correct*."

  **Where It's Soft (Concede This):**
  This is the hardest one. You are bordering on naturalistic fallacy territory.
  *Say:* "I am assuming that 'flourishing' is a measurable, objective standard. If you reject that, my argument fails. I am not arguing against functionalism, but against the claim that functionalism *excludes* objectivity."

  ---

  ### THE KILLER QUESTION (The One You Hope They Don't Ask)

  **The Question:**
  *"You argue that we should treat their moral disagreements as factual errors to preserve objectivity. But if we correct all their factual errors (no witches, no karma, no spiritual pollution), and they **still** endorse a norm we reject (e.g., strict hierarchy or collective punishment) based purely on a different valuation of autonomy vs. community, what then? If the factual dust settles and the moral disagreement remains, do you concede objectivity fails?"*

  **Why This Kills You:**
  Your whole argument rests on the "Factual Belief" defense. This question forces you to admit that there is a *residual* moral disagreement that isn't factual. If you say "Yes, then objectivity fails," you lose the room. If you say "No, they are still factually wrong," you look imperialistic and uncharitable (confirming the Psychologists' bias against philosophers).

  **Your Prepared Response (Damage Limitation):**
  "If the factual dust settles and deep disagreement remains, I concede that *convergence* is not guaranteed. However, lack of convergence does not entail lack of objectivity. Two mathematicians can disagree on a proof even when they agree on the axioms. One is wrong. My claim is not that everyone will agree eventually, but that the *nature* of the disagreement is truth-apt. If they value hierarchy over autonomy after all facts are in, I would argue they are making a mistake about the value of persons, not just a difference in taste. But I will concede: if the disagreement persists despite full information, my argument shifts from 'explaining away disagreement' to 'defending realism despite disagreement.' I am prepared to defend the latter, but it is a harder hill to die on."

  **Why this works:** It pivots from "Disagreement is illusory" (which is empirically risky) to "Disagreement exists but truth exists anyway" (which is standard Metaethics). It saves you from the data trap.

  ---

  ### WORKSHOP DYNAMICS & STRATEGY

  1.  **The Sequence:** The Psychologists will likely speak first in the Q&A. They will set the "Empirical Reality." If you fight them too hard on the data, the Metaethicists will assume you are empirically naive and ignore your philosophical points.
      *   *Strategy:* Be deferential to the data, rigid on the interpretation. "I accept your data point, but here is what it implies..."

  2.  **The Pincer:** Watch for the moment a Psychologist says, "The data shows X," and a Philosopher immediately follows with, "And even if X, the concept is empty."
      *   *Counter:* Stop the second person. "Before we move to the conceptual point, I need to clarify that the data point X doesn't entail Y for the reason I just gave." Do not let them stack objections without addressing the bridge between them.

  3.  **The Relativist:** They will wait until the end to ask the "Power/Colonialism" question.
      *   *Counter:* Pre-empt this in your closing remarks. Mention that treating agents as rational actors subject to factual error is *more* respectful than treating them as prisoners of an incommensurable culture. Frame your objectivity as *empowering*, not oppressive.

  4.  **Body Language:** When the Psychologists speak, look at them, nod, take notes. When the Metaethicists speak, look at the room. Do not get trapped in a dyadic argument with one aggressive questioner. Address the room.

  **Final Advice:**
  You cannot win on the data. They know the datasets better than you. You win on the *implications* of the data. If you try to out-empiric the empiricists, you will look like a stereotypical armchair philosopher. If you stay in your lane (interpretation/metaphysics) while respecting their lane (measurement/observation), you survive.

  Good luck. Don't let them smell the blood in the water on the "Factual Belief" distinction. That's where they'll bite.
