answer: |-
  Your instincts are excellent. This paragraph is a classic example of "pop-math" exposition: it captures the *spirit* of the Kelly criterion but sacrifices technical precision in ways that would be misleading in a rational choice seminar. It conflates asymptotic results with finite realities, arithmetic means with geometric means, and normative assumptions with objective facts.

  Here is a claim-by-claim breakdown, followed by an analysis of your three specific concerns and a verdict on the "rational choice" conclusion.

  ### Claim-by-Claim Breakdown

  | Claim from Blog Post | Verdict | Commentary |
  | :--- | :--- | :--- |
  | *"Maximize geometric growth rate... same thing as maximizing expected log wealth."* | **Accept** | This is technically correct. Maximizing $E[\log(W_T)]$ is asymptotically equivalent to maximizing the geometric growth rate of wealth. |
  | *"If you bet according to Kelly and I bet any different fixed fraction... with probability one your bankroll eventually ends up larger than mine."* | **Wince** | This is the Breiman (1961) result, but it relies on $T \to \infty$. In finite time, Kelly does not stochastically dominate other strategies. A slightly more aggressive strategy has a higher probability of outperforming Kelly in the short-to-medium run (at the cost of higher ruin risk). |
  | *"It's not merely better on average, it wins with certainty in the long run."* | **Wince** | "With probability one" (almost surely) $\neq$ "Certainty" in the colloquial sense. It allows for measure-zero paths where Kelly loses. More importantly, "long run" is doing infinite-horizon heavy lifting that doesn't apply to mortal investors. |
  | *"Bet double the Kelly fraction and you lose money on average even when every individual bet has positive expected value."* | **Wrong** | This conflates arithmetic and geometric averages. At $2\times$ Kelly, your *geometric* growth rate is often negative (wealth trends to zero), but your *arithmetic* expected value is actually **higher** than at Full Kelly. You expect to make more money, but the variance drags the geometric mean down. |
  | *"Bet more than that and you're basically guaranteeing eventual ruin."* | **Accept** | Asymptotically true. If the geometric growth rate is negative, wealth converges to zero almost surely. |
  | *"Since anyone with a long enough horizon therefore ends up richer under Kelly... it's the rational way to bet, full stop."* | **Wrong** | Normative overreach. "Rational" is defined by the agent's utility function. Kelly is optimal *only* for Log Utility. A risk-neutral agent (Linear Utility) should bet everything; a highly risk-averse agent should bet less. |
  | *"Fractional Kelly... has no real justification; it's just psychological comfort."* | **Wrong** | There are rigorous justifications: parameter uncertainty (estimation error), finite horizons, transaction costs, and non-log utility functions. |
  | *"Kelly himself... was no gambler."* | **Mostly True** | John Larry Kelly Jr. was a physicist at Bell Labs. However, he was aware of the gambling applications, and his colleague Edward Thorp famously applied Kelly to Blackjack and stocks immediately after. |

  ---

  ### Addressing Your Three Specific Concerns

  #### (a) Does "wins with certainty" rely on infinite horizons?
  **Yes.** This is the most critical pedagogical trap. The claim that Kelly dominates all other strategies "with probability one" is an asymptotic result ($n \to \infty$).
  *   **The Finite Reality:** In any finite horizon (which is all any human investor has), Kelly does not maximize the probability of beating a benchmark. In fact, because Kelly is volatile, there is a significant probability that a "Full Kelly" bettor will underperform a "Half Kelly" bettor over a 10 or 20-year horizon.
  *   **The Teaching Point:** In rational choice theory, we care about preferences over *distributions* of outcomes, not just the limit of the distribution. If a student has a utility function that penalizes interim drawdowns (which most do), the asymptotic dominance of Kelly is irrelevant.

  #### (b) Is the "double Kelly" line conflating arithmetic vs. geometric averages?
  **Yes, egregiously.** This is the specific technical error you suspected.
  *   **Arithmetic Mean:** The expected value of wealth $E[W]$ is linear in the bet size. If you bet $2\times$ Kelly, you are taking more risk, so your arithmetic expected return is *higher* than at $1\times$ Kelly.
  *   **Geometric Mean:** The compound growth rate depends on the variance drag ($\mu - \sigma^2/2$). At $2\times$ Kelly, the variance drag overwhelms the drift, making the geometric growth rate negative.
  *   **Why it matters:** The blog says you "lose money on average." In finance, "average" usually implies arithmetic expectation. If you tell students that $2\times$ Kelly has a negative arithmetic expectation, you are teaching them incorrect math. It has a negative *geometric* expectation (median outcome), which is why wealth evaporates, but the *arithmetic* mean is inflated by the tiny probability of an astronomical win.

  #### (c) Does the dismissal of Fractional Kelly ignore non-psychological justifications?
  **Yes.** Dismissing Fractional Kelly as mere "psychological comfort" ignores the problem of **parameter uncertainty**.
  *   **The Estimation Problem:** The Kelly formula requires precise knowledge of the edge (probability and payoff). In the real world (and in crypto), these are estimated, not known.
  *   **The Consequence:** If you calculate Full Kelly based on an estimated edge of 10%, but the true edge is only 5%, you are effectively overbetting relative to the *true* Kelly. As established in the "double Kelly" point, overbetting drastically increases ruin risk.
  *   **Theoretical Defense:** Fractional Kelly (e.g., Half-Kelly) can be derived as the optimal strategy for an agent who acknowledges uncertainty in their edge estimates. It is a robustness heuristic, not just a gut-check.

  ---

  ### The Bottom Line: Does "Full Kelly is Rational" Survive?

  **No.** The blogger's conclusion ("it's the rational way to bet, full stop") collapses under scrutiny.

  In a rational choice seminar, this is a feature, not a bug. You can use this text to demonstrate how "rationality" is model-relative. The corrected statement should look like this:

  > "The Kelly criterion is the optimal strategy **if and only if**:
  > 1.  You have a Logarithmic Utility function ($U(W) = \ln W$).
  > 2.  You know the true probabilities and payoffs with certainty.
  > 3.  You are betting repeatedly over an indefinite horizon.
  > 4.  You have no constraints on interim drawdowns or bankruptcy.
  >
  > If any of these conditions fail, Full Kelly may be irrational."

  ### Pedagogical Recommendation

  **Do not use the paragraph as a truth.** Use it as a **critique exercise.**

  Give the text to your students and ask them to find the errors. It covers three core concepts of your seminar:
  1.  **Utility Theory:** The conflation of "rational" with "Kelly" ignores that rationality is defined by the utility function, not the betting strategy.
  2.  **Expectation Operators:** The confusion between Arithmetic ($E[W]$) and Geometric ($E[\log W]$) expectations.
  3.  **Asymptotics vs. Finite Reality:** The danger of relying on "Law of Large Numbers" arguments for finite human lifespans.

  If you want a source to replace the blog post, point them toward **Thorp (2006), "The Kelly Criterion in Blackjack, Sports Betting, and the Stock Market,"** or **MacLean, Thorp, and Ziemba (2011)**. These sources treat Kelly as a powerful tool with specific, well-defined limitations, rather than a magic bullet for rationality.

  **Verdict:** Trash the paragraph as authoritative text, but keep it as a "spot the error" handout. It's perfect for teaching nineteen-year-olds why precision matters.
