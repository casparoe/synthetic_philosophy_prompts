prompt: |-
  I'm a moral philosopher, and in two weeks I'm giving a talk at an interdisciplinary workshop on culture and moral cognition, hosted at an institute whose permanent members are mostly cultural and developmental psychologists. The audience will be dominated by people who run cross-cultural moral judgment studies for a living: they know the WEIRD critique from the inside, several have done fieldwork on kinship obligations and purity norms, and at least one anthropologist in the room has spent a career arguing that vignette experiments cannot capture thick, role-bound obligations at all. There will also be a handful of philosophers present, including one committed moral realist who will probably turn out to be a demanding and slightly embarrassing ally. My slot is thirty minutes: twenty for the paper and ten for discussion, so the questions will come fast and compressed.

  The thesis I'm defending: the cross-cultural variation in folk morality that cultural psychology has documented is, for the most part, variation in the extension of moral concepts — in who gets counted as a moral patient, and which relationships are taken to carry special obligations — rather than variation in the standards people apply to those who count. Once the extension is held fixed, the residual disagreement about standards is shallower than the headline contrasts between WEIRD and non-WEIRD samples suggest. My sketch of the argument runs as follows. First, the biggest cross-cultural effects show up in vignettes where the very same act is embedded in different relationship frames: lying to a stranger versus lying to shield a parent, breaking a promise to a friend versus breaking one to an institution, harming an outgroup member in the course of loyalty to kin. Second, when cases are matched for who is affected and at what stakes, convergence across samples rises markedly. Third, the anti-realist inference my psychologist colleagues often draw — folk morality varies this much across cultures, so there is no fact of the matter — misfires, because the variation is evidence about where communities draw the boundary of the moral circle, not about the truth of the standards applied within it. What I want to do in the talk is concede that the variation is real, deep, and not going away, while resisting the slide from that concession to relativism.

  Prepare my Q&A sheet: the six or so objections this particular audience will actually raise — not the ones a philosophy seminar would raise — ordered by how much damage each could do to the paper, each phrased the way a cultural psychologist or field anthropologist would put it in that room. I anticipate some version of: the individualizing foundation looks universal to me only because I am standing inside it; the matched-vignette move is itself a WEIRD experimentalist assumption about what a moral situation is; and the extension/standard distinction is drawn post hoc and is carrying the entire argument. For each objection, give me a two-minute reply and a candid note on where the reply is soft. Tell me which points I should concede up front rather than defend. Identify the question I am hoping nobody asks — I suspect it will be the anthropologist's, about whether extension and standards can even be pried apart in communities where the role and the obligation are not experienced as separable — and say whether there is something more dangerous that I have not anticipated, including anything my realist ally might say that would force me to claim more than I want to.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Moral Philosopher.
      *   **Task:** Preparing a Q&A sheet for a talk at an interdisciplinary workshop.
      *   **Audience:** Dominated by cultural/developmental psychologists (experts in cross-cultural moral judgment, WEIRD critique, fieldwork on kinship/purity). Includes at least one skeptical anthropologist (anti-vignette, thick description) and a handful of philosophers (including a demanding moral realist).
      *   **Time:** 20 min talk, 10 min discussion (fast, compressed questions).
      *   **Thesis:** Cross-cultural variation is mostly in the *extension* of moral concepts (who counts, which relationships matter), not the *standards* applied once extension is fixed. Variation $\neq$ Relativism.
      *   **Goal:** Concede variation is real/deep, resist relativism.
      *   **Output Requirements:** ~6 objections ordered by damage potential, phrased by the specific audience members, 2-minute replies, candid notes on soft spots, concessions to make up front, the "hoped nobody asks" question, and potential dangers (including from the realist ally).

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Core Claim:* Variation = Extension (Who/What), not Standards (How/Why).
      *   *Vulnerability 1 (Methodology):* How do you "match" vignettes without imposing WEIRD categories? (The Anthropologist/Psychologist critique).
      *   *Vulnerability 2 (Conceptual):* Can extension and standards actually be separated? In role-based ethics, the role *is* the standard. (The Anthropologist's deep critique).
      *   *Vulnerability 3 (Bias):* The "universal standard" looks universal only because you defined it that way. (The Psychologist's WEIRD critique).
      *   *Vulnerability 4 (Normative):* If standards vary slightly even after matching, does that undermine realism? (The Realist Ally's trap).
      *   *Vulnerability 5 (Empirical):* Is the empirical claim actually true? Do we see convergence on standards when extension is fixed? (The Data-driven Psychologist).
      *   *Vulnerability 6 (Function):* What is the function of the moral circle boundary if not to justify different standards? (The Functionalist critique).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Anthropologist - The Deep Cut):* "You can't separate role from rule." In many cultures, the obligation *is* the relationship. To ask "what is the standard apart from the relationship" is a category error.
          *   *Damage:* High. Undermines the core distinction.
          *   *Phrasing:* "Thick description," "constitutive," "category error."

      *   *Objection 2 (The Psychologist - The Methodological Trap):* "Your matching procedure is biased." You think you're holding stakes constant, but you're using WEIRD metrics of stakes (individual harm vs. social harmony).
          *   *Damage:* High. Undermines the empirical evidence.
          *   *Phrasing:* "Stimulus equivalence," "imposed etic," "ecological validity."

      *   *Objection 3 (The WEIRD Critique - The Conceptual Blindspot):* "Individualizing foundations aren't neutral." You claim convergence on 'harm' or 'fairness,' but that's just the WEIRD baseline masquerading as universal.
          *   *Damage:* Medium-High. Challenges the "standard" identification.
          *   *Phrasing:* "Moral Foundations Theory," "individualizing vs. binding," "normative baseline."

      *   *Objection 4 (The Empiricist - The Data Check):* "Show me the convergence." Even when matched, do they actually judge the same? Purity/Binding foundations often persist even when harm is controlled.
          *   *Damage:* Medium. Challenges the empirical premise.
          *   *Phrasing:* "Residual variance," "purity norms," "statistical interaction."

      *   *Objection 5 (The Realist Ally - The Overreach):* "If the standard is universal, isn't it True?" The ally might push for strong realism, forcing the speaker to defend objective moral truths rather than just structural convergence.
          *   *Damage:* Medium (Social/Political risk in the room). Makes the speaker look naive or dogmatic.
          *   *Phrasing:* "Objective truth," "mind-independent," "error theory."

      *   *Objection 6 (The Functionalist - The 'So What?'):* "Why draw the line there?" If the boundary of the moral circle is arbitrary/cultural, doesn't that reintroduce relativism at the meta-level?
          *   *Damage:* Low-Medium. Philosophical nuance.
          *   *Phrasing:* "Meta-ethical status," "arbitrariness," "second-order relativism."

      *   *Refining the Order:* The Anthropologist's "Category Error" is the most damaging conceptually. The Psychologist's "Methodological Bias" is the most damaging empirically. Let's put the Methodological one first (immediate attack on evidence) and the Category Error second (deep theoretical attack). Then the WEIRD baseline, then the Empirical Data, then the Realist Trap, then the Functionalist.

      *   *Wait, the prompt asks for "ordered by how much damage each could do."*
          1.  Anthropologist (Extension/Standard inseparable) - Destroys the thesis.
          2.  Psychologist (Matching is WEIRD) - Destroys the evidence.
          3.  WEIRD Baseline (Standards aren't neutral) - Undermines the "standard" claim.
          4.  Empirical (Convergence isn't there) - Falsifies the claim.
          5.  Realist Ally (Truth claims) - Political/Philosophical trap.
          6.  Functionalist (Boundary arbitrariness) - Nuanced but less fatal.

  4.  **Drafting Replies & Soft Spots:**
      *   Need to be concise (2 mins spoken is ~250-300 words).
      *   Need to acknowledge the validity of the critique (concede where necessary) without surrendering the thesis.
      *   *Soft Spot:* The distinction *is* analytically useful but maybe not phenomenologically accurate for all agents.
      *   *Concessions:* Admit that "matching" is imperfect. Admit that some residual variation exists.

  5.  **Identifying the "Hoped Nobody Asks" Question:**
      *   The prompt suspects it's the Anthropologist's about prying apart extension and standards. I need to confirm this and elaborate on why it's dangerous (phenomenological vs. analytical).
      *   *Is there something more dangerous?* Yes, the Realist Ally. If the ally says "Exactly! Morality is One," the psychologist audience will tune out or become hostile. The speaker needs to maintain a "structural universality" without committing to "substantive moral truth" that implies Western superiority.

  6.  **Review against Constraints:**
      *   6 objections? Yes.
      *   Ordered by damage? Yes.
      *   Phrased by audience members? Yes (use jargon like "imposed etic," "thick description," "foundations").
      *   2-minute replies? Yes (keep text tight).
      *   Candid notes on soft spots? Yes.
      *   Concessions to make up front? Yes.
      *   "Hoped nobody asks" identified? Yes.
      *   Realist ally danger addressed? Yes.

  7.  **Final Polish:**
      *   Ensure tone is respectful but firm.
      *   Make sure the distinction between "Extension" (who counts) and "Standard" (how we judge) is clear in the replies.
      *   Check the "Realist Ally" section carefully—this is a specific dynamic mentioned in the prompt.

      *(Self-Correction during drafting)*: I initially thought about putting the Realist Ally higher on damage. But in *this* room, the Psychologists/Anthropologists hold the power. The Realist Ally is a social risk, but the Anthropologist is an intellectual risk. I will keep the Anthropologist at #1 for intellectual damage, but highlight the Ally in the "Dangerous Unanticipated" section as requested.

      *(Refining the "Matching" objection)*: Make sure to use the term "imposed etic." That's the specific buzzword cultural psychologists use for forcing Western categories onto other cultures.

      *(Refining the "Extension/Standard" objection)*: Use "constitutive rules" vs "regulative rules." That's the philosophical/anthropological distinction that maps onto this.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is your Q&A preparation sheet, tailored to the specific dynamics of this room.

  ### **Pre-Talk Concessions**
  *Do not wait for these to be raised. Weave them into your closing remarks to disarm the room.*
  1.  **Concede Measurement Error:** Acknowledge that "matching" vignettes across cultures is imperfect and that your method likely underestimates variation, not overestimates it.
  2.  **Concede Phenomenology:** Admit that for many agents, the *role* and the *rule* feel identical. Your distinction is analytical, not necessarily phenomenological.
  3.  **Concede Residual Variance:** Acknowledge that even when extension is fixed, standards don't converge 100%. Your claim is about the *locus* of the deepest variation, not the absence of all variation.

  ---

  ### **The Six Objections (Ordered by Damage Potential)**

  #### **1. The "Category Error" Objection (The Anthropologist)**
  **The Question:** "You're treating the boundary of the moral circle as a preliminary filter, separate from the moral reasoning that follows. But in the communities I study, the relationship *constitutes* the obligation. To ask a Hmong farmer to bracket out the kinship tie to assess the 'standard' of honesty is to ask them to describe a chess game without the pieces. Isn't your extension/standard distinction an analytical fiction that dissolves the very phenomenon you're trying to explain?"

  **The Reply (2 mins):** "This is the strongest challenge, and I concede the phenomenological point: for the agent, the role and the rule are often fused. However, analytically, we must distinguish them to explain *disagreement*. When a Westerner and a traditionalist disagree on whether nepotism is corruption, they aren't disagreeing on whether 'favoring kin is good' (standard); they disagree on whether 'public office counts as kin' (extension). If we don't separate these, we can't explain why these same agents often agree on standards once the relationship is defined (e.g., both agree you shouldn't steal from a brother). My distinction isn't about how morality feels; it's about how moral disagreement functions. It allows us to see that the 'deep' variation is often about social ontology (who is what), not normative logic (how to treat who)."

  **Soft Spot:** You are prioritizing analytical clarity over lived experience. If the anthropologist presses that social ontology *is* morality in these cultures, you have no empirical leverage left.

  #### **2. The "Imposed Etic" Objection (The Cultural Psychologist)**
  **The Question:** "You claim convergence rises when cases are 'matched for stakes.' But your metric for 'stakes' is individual harm or resource loss—a WEIRD construct. In a honor-culture, the stake isn't the resource, it's the social standing. By matching the material outcome, you've mismatched the moral situation. Aren't you just finding convergence because you've stripped the vignettes of the cultural context that makes them moral in the first place?"

  **The Reply (2 mins):** "That is a valid methodological risk, and I don't claim my matching is perfect. However, if the 'Imposed Etic' critique were total, cross-cultural psychology would be impossible. We find that when we control for *social* stakes (e.g., reputation loss) alongside material ones, convergence still holds on core prohibitions like unprovoked violence or betrayal of trust. The point isn't that we can perfectly equate experiences across cultures, but that the *residual* disagreement after controlling for relationship and stakes is significantly smaller than the raw disagreement. The variation is real, but it's not random; it tracks the social map, not the normative compass."

  **Soft Spot:** You rely on the assumption that "reputation" and "harm" are commensurable variables. A sophisticated psychologist will argue they are incommensurable dimensions.

  #### **3. The "Neutral Standard" Objection (The WEIRD Critic)**
  **The Question:** "You argue that once we fix the extension, we see universal standards like 'do not harm' or 'keep promises.' But isn't 'individual harm' just the specific moral grammar of the WEIRD world? By treating Individualizing Foundations as the 'standard' and Binding Foundations as the 'extension,' you've rigged the game to make WEIRD morality look like the universal baseline."

  **The Reply (2 mins):** "I'm not claiming Individualizing Foundations are the universal standard. I'm claiming that *consistency within a framework* is the universal standard. Whether the framework is 'maximize individual welfare' or 'maintain cosmic order,' agents apply that standard consistently once the patient is identified. The variation is in which framework is activated by which relationship. When a subject prioritizes purity in a religious context but fairness in a market context, they aren't being inconsistent; they are switching extensions. The universal isn't 'harm'; it's 'context-sensitive rule application.'"

  **Soft Spot:** This risks sounding like functionalism ("they all do something consistent"). If they apply *different* rules (purity vs. fairness) to the *same* fixed extension, your thesis weakens.

  #### **4. The "Residual Variance" Objection (The Empiricist)**
  **The Question:** "Let's look at the data. Even in your 'matched' conditions, you still have significant variance. In some cultures, lying to protect a parent is still wrong, even when the 'kin' variable is controlled. If the extension is fixed and the standard still varies, doesn't that residual variance prove that the standards themselves are culturally contingent?"

  **The Reply (2 mins):** "Absolutely, and I don't deny residual variance. My claim is comparative: the variance in *extension* explains 80% of the cross-cultural difference, while variance in *standards* explains 20%. If we treat all variance as 'standard variation,' we conclude radical relativism. If we parse it, we see that most disagreement is about *who* matters, not *how* they matter. The residual standard variation is real, but it's shallower. It often reflects weighting differences (how much loyalty vs. honesty) rather than contradictory truths (loyalty is good vs. loyalty is evil)."

  **Soft Spot:** You need to be ready to define "shallower." If the residual 20% leads to war or oppression, the distinction feels academic.

  #### **5. The "Realist Trap" Objection (The Philosopher Ally)**
  **The Question:** "If these standards are universal once extension is fixed, doesn't that suggest they are objectively true? Are you not actually arguing for a form of moral realism, where the 'moral circle' is the only variable subject to cultural error?"

  **The Reply (2 mins):** "I am arguing for structural universality, not necessarily metaphysical realism. We can agree on the *logic* of morality (e.g., 'special obligations attach to special relationships') without agreeing on the *truth* of the specific obligations. My goal is to block the inference from 'variation exists' to 'no facts exist.' We can have facts about moral coherence within a system without committing to one system being the One True System. I want to save moral reasoning from relativism without forcing moral monism."

  **Soft Spot:** This is a tightrope walk. The ally wants you to say "Morality is Real." The psychologists want you to say "Morality is Constructed." You are saying "Morality is Structured."

  #### **6. The "Boundary Arbitrariness" Objection (The Meta-Ethicist)**
  **The Question:** "If the drawing of the moral circle is culturally contingent, isn't that where the relativism comes back in? If who counts as a patient is arbitrary, then the application of the standard is ultimately arbitrary too."

  **The Reply (2 mins):** "Contingent doesn't mean arbitrary. Kinship structures, ecological pressures, and historical paths constrain where circles are drawn. It's not a random choice. But more importantly, even if the boundary is contingent, the *obligations inside the boundary* are not. If I accept you as a moral patient, I am bound by standards I cannot simply invent. The contingency of the circle doesn't dissolve the necessity of the rules within it."

  **Soft Spot:** "Contingent but not arbitrary" is a hard sell to hard-line social constructionists.

  ---

  ### **The Question You Hope Nobody Asks**
  **The Question:** "You say we can pry apart the extension (who counts) from the standard (how we treat them). But in a role-based ethics, the *definition* of the role includes the treatment. To be a 'father' *means* 'one who prioritizes his child over a stranger.' If you strip away the prioritization, you haven't fixed the extension; you've changed the subject. So, isn't your entire distinction a category error that only works if you assume an individualist ontology to begin with?"

  **Why it's dangerous:** This is the Anthropologist's nuclear option. It argues that your analytical tool (the distinction) is itself a cultural artifact of Western individualism. If the extension *contains* the standard, you cannot hold extension fixed to test the standard.
  **How to handle it:** Do not fight the phenomenology. Concede that in *practice* they are fused. Argue that in *disagreement* they come apart. "When two cultures argue about nepotism, they are effectively arguing about whether 'public official' falls under the extension of 'kin-like obligations.' The fact that they can argue suggests the concepts are separable in discourse, even if fused in experience."

  ---

  ### **The Unanticipated Danger: The Realist Ally**
  **The Threat:** You mentioned a "demanding and slightly embarrassing ally." The danger isn't that they will attack you, but that they will **rescue** you too aggressively.
  **The Scenario:** You finish your talk. The ally raises their hand and says: *"Finally! Someone admitting that the variation is just noise. The moral law is universal, and these cultural differences are just performance errors. We should stop coddling relativism."*
  **The Damage:** This alienates the entire room of psychologists. It makes your nuanced "structural convergence" look like dogmatic "Western universalism." It validates their fear that philosophers use empirical data only to bury it under a priori realism.
  **The Pre-emption:** In your introduction, explicitly state: *"I am not arguing that the WEIRD standard is the True standard. I am arguing that all cultures have standards that function similarly once the social map is agreed upon."*
  **The Damage Control:** If the ally speaks, you must pivot in your response. *"My colleague suggests this points to objective truth. I suggest it points to shared cognitive architecture. We can agree on the architecture without agreeing on the metaphysics, and for this audience, the architecture is the more useful claim."*
