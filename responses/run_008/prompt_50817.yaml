prompt: |-
  I serve on the governance committee of a mid-sized professional society — roughly 900 members, most of whom know each other at least by reputation — and we've been tasked with recommending a change (or no change) to how we elect the society's president. We currently use plurality with a runoff if no candidate clears 40%, and our last election produced a messy situation: four candidates, a clear Condorcet winner by the pairwise comparisons we informally reconstructed afterwards, and a vocal faction claiming their members "wasted" their first preferences and effectively elected their least-favored candidate under the runoff. One of our committee members, a game theorist, has been citing the Gibbard–Satterthwaite result at every meeting — as he puts it, every voting rule with three or more candidates that isn't a dictatorship is in some situations manipulable, so chasing a "game-proof" ballot is a fool's errand and we should simply pick the rule that behaves best on the profiles we actually see. He concedes he can't reconstruct the theorem's exact hypotheses from memory, and the rest of us can't either, so we can't tell how much our specific setting — a small electorate where nominations are pre-screened by a committee, voters can be indifferent, and everyone will see who ranked whom — escapes or falls under it.

  The committee is currently split three ways. One faction wants instant-runoff voting, arguing it removes the two-round turnout problem and lets members vote sincerely. A second wants Borda counting, on the theory that manipulation, while possible in principle, is hard to coordinate in a 900-person society where rankings are public afterward and reputations matter. A third wants to sidestep the whole question by having the nominations committee always narrow the field to exactly two finalists, so the theorem's domain condition fails and simple majority voting is strategy-proof in the classical sense — though two of us worry this just relocates the manipulation to whatever process picks the finalists, and makes the nominations committee de facto kingmakers. There's also a lingering question of whether we should even treat strategic voting as a defect to be engineered away rather than an ordinary part of political life that norms can absorb: our bylaws already say members should vote "in the interest of the society," which some read as a duty of sincerity.

  Please draft the written recommendation I'll circulate before our next meeting. It should recommend one concrete procedure (or explicitly defend the status quo), explain in terms our non-specialist members can follow why the impossibility result does or doesn't settle the question, engage the strongest version of the argument for whichever option you reject, and be candid about what your recommended rule will still get wrong — including whether the "narrow to two finalists" gambit is a genuine escape from the impossibility or a shell game. Bear in mind that whatever we recommend requires a two-thirds vote at the annual meeting, so the memo needs to be persuasive to members who will never read the theorem, only its consequences.
reasoning: |-
  Here's a thinking process that leads to the recommended memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a governance committee of a mid-sized professional society (900 members).
      *   **Task:** Draft a written recommendation memo to circulate before the next meeting.
      *   **Context:** Current system is Plurality with Runoff (threshold 40%). Last election was messy (4 candidates, Condorcet winner lost, faction felt "wasted" votes).
      *   **Key Issue:** How to elect the President.
      *   **Theoretical Constraint:** A game theorist on the committee keeps citing Gibbard–Satterthwaite (G-S). Need to explain what it means/doesn't mean for this specific context.
      *   **Options on Table:**
          1.  Instant-Runoff Voting (IRV).
          2.  Borda Count.
          3.  Narrow to two finalists (Majority Rule).
          4.  Status Quo (Plurality + Runoff).
      *   **Requirements:**
          *   Recommend *one* concrete procedure (or defend status quo).
          *   Explain G-S in accessible terms (does it settle the question?).
          *   Engage the strongest argument for the rejected option(s).
          *   Be candid about flaws in the recommended rule.
          *   Address the "narrow to two" strategy (escape vs. shell game).
          *   Tone: Persuasive for a 2/3 vote, accessible to non-specialists, professional but candid.

  2.  **Deconstruct the Theoretical Landscape (Gibbard–Satterthwaite):**
      *   *What is it?* Any ranked-choice voting system with 3+ candidates is either dictatorial or manipulable (strategic voting is possible).
      *   *Does it apply here?* Yes, technically. 900 voters > 1 (not a dictatorship). 3+ candidates possible. Ranked ballots (implied by IRV/Borda discussion).
      *   *Does it rule out reform?* No. It says *perfect* strategy-proofness is impossible, not that *all* systems are equally bad. Some are harder to manipulate than others. Some manipulate in less damaging ways.
      *   *The "Narrow to Two" Gambit:* G-S requires 3+ alternatives. If you restrict to 2, majority rule is strategy-proof (in the sense that voting true preference is a dominant strategy). *However*, the selection of the two becomes the strategic bottleneck. This is the "shell game" aspect.

  3.  **Evaluate the Options:**
      *   **Status Quo (Plurality + Runoff):** Prone to "spoiler" effects in round 1. The recent election proved this (Condorcet winner lost). High cognitive load for voters to guess who makes the runoff. *Verdict: Discard.*
      *   **Instant-Runoff Voting (IRV):** Solves the "wasted vote" fear better than plurality. Eliminates separate runoff election (cost/turnout). *Flaw:* Can still fail to elect the Condorcet winner (monotonicity issues). Strategic voting still possible (burying strong rivals).
      *   **Borda Count:** Rewards consensus. *Flaw:* Highly susceptible to "cloning" (running multiple similar candidates to skew points) and strategic ranking (ranking a strong rival last even if you like them). In a small society where rankings are public, this could lead to vendettas. *Verdict: Risky for social cohesion.*
      *   **Narrow to Two (Majority):** Strategy-proof for the final vote. *Flaw:* Moves manipulation to the Nominating Committee. Creates an oligarchy feel. 900 members might resent losing the right to nominate freely. *Verdict: Politically difficult, potentially undemocratic.*

  4.  **Select the Recommendation:**
      *   *IRV (Ranked Choice Voting)* seems the best fit for a professional society. It balances democratic engagement (members choose from the full field) with practical outcomes (majority support, no second election). It mitigates the "wasted vote" complaint from the last election.
      *   *Why not Borda?* Too gameable in a small, reputation-based community.
      *   *Why not Two Finalists?* Shifts power to a small committee, violating the spirit of member-led governance.
      *   *Why not Status Quo?* Just proved broken.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose clearly. Acknowledge the recent election friction.
      *   **The Game Theory Elephant (G-S):** Explain it simply. "No perfect system." But emphasize that "imperfect" doesn't mean "all equal." We are looking for *robustness*, not perfection.
      *   **The "Two Finalist" Trick:** Address this specifically. It avoids G-S mathematically but creates a political bottleneck. Call it a "shell game."
      *   **The Recommendation (IRV):** Propose Instant-Runoff Voting.
      *   **Why IRV?**
          *   Solves the "wasted vote" issue (vote 1st choice without fear).
          *   Ensures winner has >50% support.
          *   Single election (turnout/cost).
      *   **Engaging the Counter-Arguments (Borda & Two-Finalist):**
          *   Borda: Too easy to game by ranking rivals last. Bad for collegiality.
          *   Two-Finalist: Makes the Nominating Committee too powerful.
      *   **Candid Admission of Flaws:** IRV isn't perfect. It can still produce non-Condorcet winners. Strategic voting is still *possible* (burying), just harder/less rewarding than in Plurality.
      *   **Norms vs. Rules:** Acknowledge the bylaw clause ("vote in interest of society"). Rules support norms, they don't replace them.
      *   **Closing:** Call to action for the 2/3 vote.

  6.  **Refining the Tone:**
      *   Needs to be respectful of the game theorist's point but not paralyzed by it.
      *   Needs to reassure members that their votes count.
      *   Avoid jargon (Condorcet, Monotonicity) unless explained simply.
      *   *Self-Correction on G-S:* Make sure to clarify that G-S assumes *ordinal* rankings. If we use ratings (Cardinal), it's a different theorem (Gibbard 1978), but stick to the prompt's context of rankings/IRV/Borda. Keep it simple: "With 3+ choices, strategy is always possible."

  7.  **Final Review against Constraints:**
      *   Recommend one procedure? Yes (IRV).
      *   Explain G-S? Yes.
      *   Engage strongest rejected argument? Yes (Two-finalist efficiency vs. oligarchy risk).
      *   Candid about flaws? Yes (IRV complexities, remaining strategy).
      *   Address "narrow to two" shell game? Yes.
      *   Persuasive for 2/3 vote? Focus on fairness and fixing the last mess.

  8.  **Final Polish:** Check word choice. Ensure "Governance Committee" voice. (Proceed to draft).

  *(Self-Correction during drafting)*: I initially thought about recommending the "Two Finalist" system because it *is* strategy-proof for the general membership. However, the prompt asks me to address the "shell game" concern. In a professional society of 900 peers, concentrating power in a Nominating Committee is often more contentious than a slightly imperfect vote. I will stick with IRV as the more democratic compromise, acknowledging the G-S limitation. It feels more aligned with "fixing the messy election" than "restricting choices."

  Wait, let's look closer at the "Two Finalist" argument. The prompt says "two of us worry this just relocates the manipulation." I need to be candid about this. If I recommend IRV, I need to explain why it's better than the Two-Finalist approach despite G-S applying to IRV. The key is *where* the strategy happens. In IRV, it's distributed among 900 voters (hard to coordinate). In Two-Finalist, it's concentrated in the Nominating Committee (easy to coordinate/lobby). This is a strong argument for IRV.

  Let's write.
answer: |-
  **MEMORANDUM**

  **TO:** Governance Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Presidential Election Procedure

  **Purpose**

  Following the complications of our last presidential election, this committee was tasked with reviewing our voting procedures. Our current system (Plurality with a 40% runoff threshold) resulted in a winner who lacked broad consensus and left a significant portion of the membership feeling disenfranchised. We have considered three primary alternatives: Instant-Runoff Voting (IRV), Borda Count, and restricting the general ballot to two pre-selected finalists.

  This memo recommends the adoption of **Instant-Runoff Voting (IRV)** for all contested presidential elections. It also addresses the theoretical concerns raised regarding voting impossibility theorems and explains why restricting the ballot to two finalists, while mathematically tidy, poses greater risks to our governance culture than a slightly imperfect ranked-choice system.

  **The Game Theory Question: Are We Chasing Perfection?**

  One of our committee members has rightly pointed to the Gibbard–Satterthwaite theorem. In plain English, this theorem states that no voting system with three or more candidates is perfectly immune to strategic voting (i.e., voters lying about their preferences to get a better outcome), unless the system is a dictatorship.

  Some have interpreted this to mean that reform is futile: if every system can be "gamed," why change the rules?

  This is a misunderstanding of the theorem's practical implication. The theorem proves that *perfect* strategy-proofness is impossible, but it does not prove that all systems are *equally* vulnerable. Some systems make manipulation difficult, risky, or requiring impossible levels of coordination. Our goal should not be to find a "game-proof" system (which does not exist), but to find a system where honest voting is the safest and most sensible strategy for the vast majority of our 900 members.

  **The "Two Finalist" Gambit: Escape or Shell Game?**

  The most compelling alternative to IRV is the proposal to have the Nominating Committee narrow the field to exactly two finalists, decided by simple majority. Mathematically, this sidesteps the Gibbard–Satterthwaite theorem. With only two options, voting for your true preference is always the dominant strategy; you cannot gain an advantage by lying.

  However, this is a shell game. It does not eliminate strategic manipulation; it merely relocates it from the general membership to the Nominating Committee.

  In a society of 900 peers, where reputation matters, it is difficult for a faction to coordinate strategic voting across hundreds of ballots. It is far easier for a faction to lobby or influence a five-person Nominating Committee to exclude a rival from the final two. By restricting the general ballot, we risk turning the Nominating Committee into de facto kingmakers. This concentrates power in a way that contradicts our culture of broad member participation. While this method secures a strategy-proof *general election*, it jeopardizes the integrity of the *nomination process*, which is less transparent and harder to audit.

  **Why Not Borda Count?**

  The Borda Count (assigning points based on rank) was considered for its ability to identify consensus candidates. However, in a small, professional community where ballots may be publicly scrutinized, Borda is highly vulnerable to "burying." A faction can easily manipulate the outcome by ranking a strong opponent last, even if they respect them professionally. This incentivizes negative campaigning and could damage the collegial norms we rely on. IRV is more robust against this specific type of tactical ranking.

  **Recommendation: Instant-Runoff Voting (IRV)**

  I recommend we adopt Instant-Runoff Voting. Under this system, members rank candidates (1st, 2nd, 3rd...). If no candidate receives a majority of 1st-choice votes, the last-place candidate is eliminated, and their votes transfer to those voters' next choices. This continues until one candidate clears 50%.

  **Advantages:**
  1.  **Eliminates "Wasted Vote" Anxiety:** In our last election, members feared voting for their true favorite would help their least favorite win (the "spoiler effect"). IRV allows members to vote sincerely for their first choice without risking the election of an unacceptable candidate.
  2.  **Majority Mandate:** The winner will always have support from more than half of the participating voters, avoiding the scenario where a candidate wins with only 30% of the vote.
  3.  **Operational Efficiency:** It achieves the benefit of a runoff without the cost and low turnout associated with holding a second election.

  **Candid Limitations**

  We must be clear-eyed about what IRV will not fix.
  *   **It is not strategy-proof:** Per Gibbard–Satterthwaite, scenarios exist where a voter might benefit from ranking a strong rival lower than their true preference. However, doing so requires detailed knowledge of how others will vote, making it a high-risk strategy for the average member.
  *   **It does not guarantee the Condorcet Winner:** It is possible (though rare) for IRV to eliminate a candidate who would have beaten everyone else in head-to-head matchups. No system is perfect, but IRV minimizes the most damaging failures of our current plurality system.
  *   **Complexity:** It requires slightly more education for the membership. We will need to provide clear examples on the ballot.

  **Norms and Rules**

  Finally, some have argued that we should rely on our bylaw clause requiring members to vote "in the interest of the society" rather than engineering the rules. Norms are essential, but they function best when supported by institutions. Our current rules *punished* sincere voting in the last election. By adopting IRV, we align the mechanical incentives of the ballot with the normative expectation of sincerity. We make it easier for members to do the right thing.

  **Conclusion**

  The Gibbard–Satterthwaite theorem tells us we cannot build a perfect machine. It does not tell us we should keep using a broken one. Restricting the ballot to two candidates solves the math problem by creating a political bottleneck; IRV solves the political problem by accepting a manageable amount of mathematical imperfection.

  I urge the committee to vote to recommend Instant-Runoff Voting to the general membership. This offers the best balance of democratic engagement, resistance to manipulation, and protection for the sincere voter.

  **Action Required:**
  Please review this recommendation prior to our meeting on [Date]. We will need to finalize our language to ensure we can secure the required two-thirds vote at the Annual Meeting.
