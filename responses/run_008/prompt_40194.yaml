answer: |-
  Here is the account you are looking for. It is based on the standard definition used in quantitative genetics, stripped of the hand-waving.

  ### The Unifying Principle: The Variance Partition Rule

  **Heritability ($h^2$) is the ratio of genetic variance to total phenotypic variance within a specific population, at a specific time, across a specific range of environments.**

  Mathematically:
  $$h^2 = \frac{V_G}{V_G + V_E + V_{G \times E} + V_{error}}$$

  Where:
  *   $V_G$ is the variance due to genetic differences between individuals.
  *   $V_E$ is the variance due to environmental differences between individuals.
  *   $V_{G \times E}$ is the variance due to the interaction between specific genes and specific environments.
  *   **Crucial Constraint:** This ratio describes the *spread* (variance) of a trait in a group, not the *cause* of an individual's trait, nor the *cause* of the difference between two group averages.

  **Confidence in this definition:** **High.** This is the standard textbook definition in quantitative genetics (e.g., Falconer & Mackay). It is not controversial among statisticians, though it is frequently misinterpreted in public discourse.

  ---

  ### Applying the Principle to Your Verdicts

  Here is how the Variance Partition Rule mechanically handles your seven cases.

  **(1) Eye colour is almost entirely genetic.**
  *   **Verdict:** Fine.
  *   **Mechanism:** In modern human populations, $V_E$ for eye colour is near zero (environment doesn't change it), and $V_G$ is high. Therefore $h^2 \approx 1$.
  *   **Confidence:** **High.**

  **(2) Dutch height increase vs. 80% heritability.**
  *   **Verdict:** Not Fine (You are correct).
  *   **Mechanism:** Heritability measures variance *within* a generation, not the mean shift *between* generations. The Dutch height increase was a shift in the population mean ($\mu$) caused by a change in the environment ($E$). $h^2$ can remain 0.8 even if the mean shifts by 10cm, provided the *ranking* of individuals remains largely determined by genes within the new environment.
  *   **Confidence:** **High.**

  **(3) PKU is genetic but environmentally fixable.**
  *   **Verdict:** Fine.
  *   **Mechanism:** PKU has high $V_G$ in a standard diet environment. However, changing the environment (phenylalanine-free diet) alters the *reaction norm*. It effectively changes the function mapping Genotype to Phenotype. Heritability describes the variance in the *outcome*, not the immutability of the mechanism. If everyone gets the diet, $V_E$ regarding the *damage* drops to zero, and the variance in outcome disappears.
  *   **Confidence:** **High.**

  **(4) "Half of a kid's intelligence comes from genes."**
  *   **Verdict:** Not Fine (You are correct).
  *   **Mechanism:** This commits the **Individual Fallacy**. $h^2$ is a population statistic ($V_G / V_P$). It cannot be decomposed into percentages for a single individual ($P_i = G_i + E_i$). You cannot slice a single person's phenotype into genetic and environmental percentages.
  *   **Confidence:** **High.**

  **(5) Cloned tomatoes in different fields.**
  *   **Verdict:** Fine.
  *   **Mechanism:** Within a single field, $V_G = 0$ (clones). Therefore $h^2 = 0 / (0 + V_E) = 0$. The difference *between* fields is $V_E$. This proves $h^2$ is local to the population and environment sampled.
  *   **Confidence:** **High.**

  **(6) Rat maze breeding vanishes in enriched environments.**
  *   **Verdict:** Fine.
  *   **Mechanism:** This demonstrates **Genotype-by-Environment Interaction ($V_{G \times E}$)**. Heritability is not a constant property of a trait; it is a property of a trait *in a context*. If the environment changes such that genetic differences no longer produce phenotypic differences, $V_G$ becomes 0, and $h^2$ becomes 0.
  *   **Confidence:** **Medium-High.** (See "Least Certain Point" below).

  **(7) High within-group heritability vs. between-group environmental gaps.**
  *   **Verdict:** Fine (You must suppress your lurking gut verdict).
  *   **Mechanism:** This is the **Lewontin Fallacy**. Within-group variance parameters ($V_G, V_E$) do not mathematically constrain between-group mean differences. Two groups can have identical high $h^2$ internally, yet the difference between their means can be 100% environmental.
      *   *Example:* Plant corn seeds (Group A) in rich soil and identical seeds (Group B) in poor soil. Within A, $h^2$ is high. Within B, $h^2$ is high. The difference between A and B is 100% soil ($E$).
  *   **Confidence:** **High** (Statistically), **Medium** (Regarding specific human sociological applications).

  ---

  ### Running the Principle on Dave's Schizophrenia Claim

  **Dave's Claim:** "Schizophrenia is 60–80% heritable, so funding searches for environmental causes is mostly a waste."

  **The Principle's Verdict:** **Dave is wrong.**

  **Why:**
  1.  **Prevention vs. Variance:** High $h^2$ means that *currently*, in *this* population, most of the *variation* is due to genes. It does not mean the *incidence* cannot be lowered by changing the environment (see PKU, Verdict 3). If we identify a trigger (e.g., prenatal viral exposure, urbanicity, cannabis use), we could lower the population mean risk without changing the heritability estimate.
  2.  **Intervention Potential:** Even if $V_G$ is high, if the environmental lever is cheap and effective, it is not a "waste". Heritability says nothing about the *cost* or *feasibility* of environmental intervention.
  3.  **Missing $V_E$:** If the current environment is relatively uniform (e.g., everyone is exposed to similar stressors), $V_E$ is artificially suppressed, inflating $h^2$. Identifying new environmental variables could increase $V_E$ and lower $h^2$, revealing new avenues for treatment.

  **Confidence in this rebuttal:** **Medium-High.** The logic holds, though the *magnitude* of potential environmental gains in schizophrenia is an empirical question, not a statistical one.

  ---

  ### Prediction: Eyesight Heritability in Varying Environments

  **Case:** Measured heritability of eyesight (e.g., myopia).

  1.  **Universally Good Environment:** Everyone gets optimal nutrition, outdoor time, and corrective laser surgery/glasses early.
      *   **Prediction:** $V_E$ drops towards zero. $V_P$ becomes almost entirely $V_G$.
      *   **Result:** Heritability ($h^2$) **increases** (approaches 1.0).
      *   *Reasoning:* When you remove environmental noise, genetic differences become the only thing left causing variation.

  2.  **Wildly Variable Environment:** Some children read in the dark with poor nutrition; others have perfect care.
      *   **Prediction:** $V_E$ increases massively.
      *   **Result:** Heritability ($h^2$) **decreases**.
      *   *Reasoning:* Environmental differences now explain more of the variation in eyesight than genetic differences do.

  **Confidence in Prediction:** **High.** This is a direct mathematical consequence of the denominator ($V_P$) changing.

  ---

  ### Which Verdict Must You Drop?

  You asked which of your verdicts the principle forces you to drop.

  **You must drop the "lurking gut verdict" in (7).**
  You wrote: *"if a trait is measured near 100% heritable in a modern well-fed population, then attributing group gaps in it to environment feels like fighting the data."*

  The Variance Partition Rule dictates that this intuition is statistically invalid. As shown in the corn/soil analogy, high within-group $h^2$ is perfectly compatible with 100% environmental between-group differences. Holding onto this gut feeling will leave you vulnerable to Dave, because it is the one place where your intuition conflicts with the mathematical definition.

  **Verdict (6) is also precarious.**
  While the *concept* is fine, defending it against (1) requires admitting that $h^2$ is not a stable "number" for a trait like IQ or Schizophrenia. It fluctuates with context. If you treat $h^2$ as a fixed constant (as Dave likely does), (6) breaks. You must insist $h^2$ is a variable dependent on $E$.

  ---

  ### Confidence and Uncertainty Declaration

  Per your request, here is the breakdown of my certainty regarding this advice.

  *   **Definition of Heritability:** **High Confidence.** (Standard statistical definition).
  *   **Application to Verdicts 1, 2, 4, 5, 7:** **High Confidence.** (These are classic textbook examples of heritability misconceptions).
  *   **Application to Verdict 3 (PKU):** **High Confidence.** (Standard example of gene-environment interaction).
  *   **Application to Dave's Schizophrenia Claim:** **Medium-High Confidence.** (The statistical logic is sound, but the practical "waste of funding" claim involves policy judgements beyond pure stats).
  *   **Eyesight Prediction:** **High Confidence.** (Direct mathematical derivation).

  **🚩 The Single Point of Least Certainty:**
  **The magnitude of $V_{G \times E}$ in complex human psychiatric traits (Verdict 6).**
  While we know Genotype-by-Environment interactions exist theoretically and in animal models, quantifying them in humans is notoriously difficult. It is possible that for some traits, the interaction term is small enough that $h^2$ remains relatively stable across "normal" human environments. I am least sure how much "room" there is for the rat-maze effect (where genetic differences vanish entirely) in human schizophrenia or IQ. Dave may pounce here, arguing that human environments aren't distinct enough to zero out $V_G$.

  **Summary for your Slack war:**
  Stick to the **Variance Partition Rule**. Insist that $h^2$ is a ratio of variances in a specific context, not a measure of individual determination or group difference causality. If you hold that line, your verdicts (1) through (7) are statistically coherent, provided you excise the intuition that high within-group $h^2$ makes between-group environmental explanations unlikely.
