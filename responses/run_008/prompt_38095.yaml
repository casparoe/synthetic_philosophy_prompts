      *   **Opponent's Argument:** The "Nation as Family" analogy. Nations are like scaled-up families; therefore, we owe special priority to compatriots (just as we feed our children before strangers). The bond is deep, inherited, and unchosen.
      *   **Teacher's Counter:** Nations are recent constructions (Hobsbawm/Anderson - "Imagined Communities," "Invention of Tradition").
      *   **Opponent's Rebuttal:** Families are also constructed (adoption, blended families), so the analogy holds.
