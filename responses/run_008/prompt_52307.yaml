prompt: |-
  In my philosophy of language seminar the prof keeps saying that Lewis's triviality results show "conditionals lack truth conditions", and last week she used that to wave off a classmate who asked whether an if-then sentence could be true but unknowable. I only know the rough sketch of the argument: if you assume the probability of "if A then C" equals the conditional probability of C given A, then it turns out no proposition can always have that as its probability, so something in the setup has to give. What are the different precise claims that slogan could actually be making, from pretty tame to genuinely radical, and which of them do the triviality proofs really support vs which are people overreaching? And does any of the defensible readings actually justify dismissing the true-but-unknowable question the way she did, or was she probly conflating a few things? I want a menu of readings I can argue with, not just one interpretation.
