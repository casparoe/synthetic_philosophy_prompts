prompt: |-
  At a happy hour after our first-year game theory seminar, two fellow PhD students — one in formal theory, one in normative political theory — got into a running argument about the paradox of voting, and neither would let it go. I'm a PhD student in political behavior, and while I have views, they asked me to referee and I found that each of them was right about something at each stage, so I'd rather have someone disentangle it properly. The exchange went roughly as follows.

  (1) Jacob, who works on rational choice models, opened by declaring individual voting irrational. In any large electorate, he said, the probability that a single vote decides the outcome — or even flips it into an exact tie that gets resolved your way — is on the order of one in millions for even a closely contested race. Meanwhile voting carries real costs: registering, standing in line, taking time off. So the expected instrumental benefit is vanishingly small relative to the cost, and a rational agent who compares expected utilities should stay home. Anyone who votes is either innumerate or isn't actually trying to affect the outcome.

  (2) Sofia replied that this argument proves far too much. If expected-value arithmetic of this kind is the standard, then almost no one acts rationally in collective contexts: the same reasoning condemns contributing to any large-scale cooperative scheme where an individual's contribution is not decisive — public radio pledges, union dues, even recycling. She added that voters needn't be aiming at causation at all: voting can be expressive, like cheering at a game, and there is nothing irrational about expression. On the expressive reading there is no paradox, just a different activity than the one Jacob's model assumes.

  (3) Jacob said the expressive move concedes his point while pretending not to. If voting is expression, then it is consumption, not political action, and the nagging feature of the phenomenon remains unexplained: voters describe themselves as doing their civic duty, and feel they have discharged an obligation — feelings that would be mystifying if the act were just consumption, like preferring one brand of cola to another. He also pressed the free-rider point against her cooperative-scheme analogy: whatever the other contributors do, the election outcome would have been identical had any one voter abstained, so the scheme doesn't need her participation the way a wall needs each of its bricks; she receives the better outcome (if it is one) whether or not she pays the cost.

  (4) Sofia answered in two parts. First, the "outcome would have been identical without you" test proves too much: it would equally show that no participant in a mass movement ever matters, and she doubted Jacob was prepared to accept that sweeping a conclusion. Second, she said the tiny-probability premise is not as friendly to Jacob as he assumes: expected value is sensitive to how the stakes are valued, and if a voter regards the difference between the candidates as enormous — possibly even as a matter of basic justice or constitutional order — then even a probability of one in ten million can yield an expected value exceeding the cost of voting. The paradox, she concluded, is not a discovery about citizens but an artifact of assuming that reasonable people value political outcomes modestly and by the same scale the modeler does.

  Please adjudicate this exchange move by move: for each of the four moves, say whether it is clearly right, clearly mistaken, or somewhere in between, and justify each verdict. Then tell me who is more right overall, and identify what, if anything, both of them are missing — in particular whether the standoff really turns on an empirical question about how voters value outcomes, a conceptual question about what kind of act voting is, or a normative question about whether the standard of individual instrumental rationality is the right standard to apply here in the first place.
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** A debate between two PhD students (Jacob: formal theory/rational choice; Sofia: normative political theory) about the paradox of voting, observed by a third PhD student (political behavior/referee).
      *   **Task:** Adjudicate the exchange move-by-move (4 moves). For each, determine if it's clearly right, clearly mistaken, or in between, with justification.
      *   **Overall Verdict:** Determine who is more right overall.
      *   **Missing Elements:** Identify what both are missing (empirical vs. conceptual vs. normative questions).

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1 (Jacob):** The Classic Rational Choice Argument.
          *   *Claim:* Voting is instrumentally irrational because $P \times B < C$. $P$ (probability of being pivotal) is near zero. $C$ (cost) is positive.
          *   *Assessment:* This is the standard Downsian paradox formulation. Logically valid within the strict expected utility framework. However, it assumes *only* instrumental utility matters and assumes specific values for $P$, $B$, and $C$.
          *   *Verdict:* Logically sound within its model, but empirically descriptively weak (people *do* vote). It's "right" about the math, "mistaken" if claiming it describes actual human motivation fully.

      *   **Move 2 (Sofia):** The Expressive/Cooperative Counter.
          *   *Claim 1:* Reductio ad absurdum. If Jacob is right, no collective action is rational (public radio, unions).
          *   *Claim 2:* Voting is expressive (consumption), not instrumental.
          *   *Assessment:* Claim 1 is strong (the free-rider problem applies broadly). Claim 2 is a standard solution (Riker/Ordeshook's $D$ term). It dissolves the paradox by changing the utility function.
          *   *Verdict:* Strong critique of the *scope* of Jacob's model. The expressive argument is valid but shifts the definition of voting.

      *   **Move 3 (Jacob):** The Civic Duty/Free-Rider Rebuttal.
          *   *Claim 1:* Expressive voting concedes the instrumental point. It makes voting consumption, not action.
          *   *Claim 2:* Voters feel "duty," not just preference satisfaction (cola analogy).
          *   *Claim 3:* Free-rider problem remains. Your vote doesn't change the outcome, so you get the benefit regardless of cost.
          *   *Assessment:* Claim 1 is a bit dismissive (expression *is* a utility). Claim 2 is strong (phenomenology of voting feels different than buying soda). Claim 3 is the hard core of the free-rider problem; expressive benefits don't solve the collective action problem regarding the *outcome*.
          *   *Verdict:* Strong on the phenomenology and the persistence of the free-rider logic regarding outcomes. Weak on dismissing expression as a valid utility source.

      *   **Move 4 (Sofia):** The Stakes and Mass Movement Defense.
          *   *Claim 1:* "Outcome identical without you" proves too much (mass movements).
          *   *Claim 2:* High Stakes ($B$). If $B$ is huge (constitutional order), $P \times B$ can exceed $C$ even if $P$ is tiny.
          *   *Assessment:* Claim 1 is a bit vague (mass movements often rely on visibility, not just pivotality). Claim 2 is the "Huge B" solution. Mathematically possible, but empirically questionable (do people *really* calculate this?). It challenges the *parameter values* Jacob assumes.
          *   *Verdict:* Claim 2 is mathematically valid but often empirically unrealistic (people vote in low-stakes local elections too). Claim 1 is a good philosophical pushback but doesn't solve the math.

  3.  **Drafting the Adjudication (Move by Move):**

      *   *Move 1:* Jacob is formally correct but substantively incomplete. The math holds, but the premise that humans are purely instrumental maximizers is the weak link. *Verdict: In Between.*
      *   *Move 2:* Sofia is right that the logic extends to other collective action problems. She is also right that expressive utility exists. *Verdict: Mostly Right.*
      *   *Move 3:* Jacob is right that "duty" feels different than "consumption." He is right that the free-rider problem persists for the *outcome* even if expression is satisfied. *Verdict: Mostly Right.*
      *   *Move 4:* Sofia's "High Stakes" argument is mathematically possible but often empirically weak (people vote in low-stakes elections). Her mass movement point is conceptually interesting but distinct from voting mechanics. *Verdict: In Between.*

  4.  **Synthesizing the Overall Verdict:**
      *   Who is more right? It's a draw, but for different reasons. Jacob wins on the *logic of instrumental rationality*. Sofia wins on the *description of human behavior and normative context*.
      *   Actually, looking closer: Jacob identifies the paradox correctly. Sofia identifies why the paradox isn't a paradox in practice.
      *   Better framing: Jacob is right about the *model's internal logic*. Sofia is right about the *model's external validity*.
      *   Who is "more right"? Usually, in political science, the behavioralist (Sofia's side) wins because the phenomenon (voting) exists. But Jacob's logic is the foundation of the field. I should declare it a stalemate that reveals a deeper issue.

  5.  **Identifying the Missing Elements (The "Referee's" Insight):**
      *   *Empirical:* Do voters actually calculate $P \times B$? (No, they use heuristics).
      *   *Conceptual:* Is voting a market transaction or a ritual? (Social norms).
      *   *Normative:* Should we use instrumental rationality as the benchmark? (Maybe rationality includes social norms).
      *   *Key Insight:* The "Paradox of Voting" is only a paradox if you accept a specific, thin definition of rationality (Homo Economicus). If you adopt a thicker definition (Homo Sociologicus or bounded rationality), it disappears.
      *   *Specific Missing Point:* They are arguing past each other on the definition of "Rationality." Jacob = Instrumental. Sofia = Expressive/Normative.
      *   *Also:* The "Minimax Regret" model (Ferejohn/Fiorina) is missing. Voting to avoid regret if your side loses by one vote.
      *   *Also:* Social pressure/norms (Gerber, Green, Larimer). Voting is a social act, not just individual.

  6.  **Refining the Output:**
      *   Structure: Move 1-4 analysis, Overall Verdict, Missing Elements.
      *   Tone: Academic, balanced, authoritative (as a fellow PhD referee).
      *   Ensure the distinction between *instrumental*, *expressive*, and *normative* rationality is clear.

  7.  **Self-Correction/Nuance Check during drafting:**
      *   *Check Move 4:* Sofia's argument about "High Stakes" is often criticized because people vote in dogcatcher elections where stakes are low. I need to mention that.
      *   *Check Move 3:* Jacob's claim that expression is "consumption" is a category error. Expression can be a utility *and* a duty.
      *   *Check Overall:* Don't just say "both are right." Say *where* they are right. Jacob is right about the *pivotal probability*. Sofia is right about the *utility function*.
      *   *The "Missing" part:* This is crucial. The prompt asks specifically about empirical vs. conceptual vs. normative. I need to address all three.
      *   *Normative:* Is instrumental rationality the *right* standard? No.
      *   *Conceptual:* Is voting an act of causation or constitution?
      *   *Empirical:* How do people actually decide?

  8.  **Final Polish:** Ensure the language fits the persona (PhD student in political behavior refereeing a game theorist and a normative theorist). Use appropriate terminology (Downsian, Riker/Ordeshook, Free-rider, Homo Economicus).

      *(Self-Correction on Move 1)*: Jacob says "Anyone who votes is either innumerate or isn't actually trying to affect the outcome." This is a strong claim. It's logically valid *if* utility is only outcome-based. But it's empirically false. So "In Between" is best.

      *(Self-Correction on Move 4)*: Sofia's "High Stakes" argument is the "B term" solution. It's theoretically valid but empirically shaky. I should note that.

      *(Overall)*: I will lean towards Sofia being *more* right about the phenomenon, but Jacob being *more* right about the strict logic of the model he is using. However, since the model fails to predict reality, Sofia's critique of the model is more valuable.

      *(Missing)*: The social norm aspect is the biggest missing piece. Voting is a social norm enforced by community, not just individual calculus. Also, the "Minimax Regret" theory.

      Let's write it.
answer: |-
  As a fellow PhD student in political behavior, I have reviewed the transcript of this happy hour debate. It is a classic instantiation of the "Paradox of Voting" (often attributed to Downs, 1957), replayed through the specific lenses of formal modeling and normative theory. Below is my adjudication of each move, followed by an overall verdict and an analysis of the underlying theoretical impasse.

  ### Adjudication by Move

  **(1) Jacob's Opening (The Instrumental Calculus)**
  *   **Verdict:** **In Between (Formally Valid, Empirically Incomplete)**
  *   **Justification:** Jacob is formally correct within the strict confines of the *Homo Economicus* model. If utility is derived solely from the policy outcome ($B$), weighted by the probability of being pivotal ($P$), and compared against costs ($C$), then $P \times B < C$ holds for almost all large-N elections. His math is sound. However, his conclusion that voters are therefore "innumerate" or deceptive is a non sequitur. It assumes the model is a complete description of human motivation rather than a heuristic. He is right about the *probability*, but mistaken to assume that *instrumental outcome utility* is the only utility function in play.

  **(2) Sofia's Reply (The Expressive and Collective Action Defense)**
  *   **Verdict:** **Mostly Right**
  *   **Justification:** Sofia correctly identifies that Jacob's logic, if applied consistently, dissolves almost all collective action (the free-rider problem). Her introduction of expressive utility (voting as consumption/expression rather than investment) is a standard and robust solution in the literature (e.g., Riker and Ordeshook's $D$ term). She is right that the "paradox" disappears if we expand the utility function to include the act of voting itself. However, she slightly overstates the case by equating voting entirely with cheering at a game; while expression is part of it, most voters *do* believe they are affecting outcomes, which brings us back to Jacob's concern.

  **(3) Jacob's Rebuttal (The Phenomenology of Duty)**
  *   **Verdict:** **Mostly Right**
  *   **Justification:** Jacob scores a strong point on phenomenology. Voters do not typically describe their act as "consumption" or "expression"; they describe it as "duty" or "influence." If voting were merely expressive, turnout should not correlate with election closeness (competitiveness), yet it often does. Furthermore, he is correct that the expressive argument does not solve the *collective action* problem regarding the *outcome*. Even if I enjoy voting, the policy outcome is still a public good that I receive regardless of my participation. His "cola" analogy is slightly reductive, but his insistence that the free-rider logic remains potent regarding the *result* is accurate.

  **(4) Sofia's Counter (High Stakes and Mass Movements)**
  *   **Verdict:** **In Between**
  *   **Justification:** Sofia's "High Stakes" argument (increasing $B$) is mathematically valid but empirically fragile. While a voter might value the defense of constitutional order highly enough to justify a 1-in-10-million chance, people also vote in low-stakes local elections (school board, dogcatcher) where $B$ is objectively small, yet $P$ is similarly vanishing. Thus, the "High $B$" solution cannot explain the full variance in turnout. Her point about mass movements is conceptually strong (individual contribution is often non-pivotal there too), but voting is distinct from protesting because it is a private, institutionalized act with a specific counting mechanism, making the pivotality argument more salient for voting than for general movements.

  ---

  ### Overall Verdict

  **Who is more right?**
  **Sofia is more right about the phenomenon; Jacob is more right about the model.**

  Jacob has successfully proven that voting is irrational *if* one accepts a thin, purely instrumental definition of rationality. But since voting is a stable, widespread phenomenon, the fault lies with the definition of rationality, not the voters. Sofia correctly identifies that the model is underspecified (ignoring expression, duty, and social norms). However, she struggles to fully dismantle the free-rider logic regarding the *outcome* of the election.

  In political science, a model that predicts a phenomenon does not exist (mass abstention) when the phenomenon does exist (mass turnout) is considered a failed model. Therefore, Sofia's critique of the model's assumptions carries more weight than Jacob's defense of the model's internal logic.

  ### What Both Are Missing

  The standoff persists because Jacob and Sofia are arguing on different planes. They are missing three critical dimensions that would dissolve the paradox:

  **1. The Normative Question (The Standard of Rationality)**
  This is the most significant omission. Jacob assumes *instrumental rationality* (maximizing expected utility based on outcomes) is the only valid standard. Sofia implicitly argues for *expressive rationality*. Both miss the argument for **social rationality**.
  Voting is often driven by social norms and identity. If voting is a social norm enforced by community standing (as Gerber, Green, and Larimer have shown), then the "cost" of not voting includes social sanction or loss of self-image as a "good citizen." In this frame, it is instrumentally rational to vote to maintain one's social standing or self-concept, even if the vote doesn't change the policy outcome. Jacob misses that the "utility" includes social compliance; Sofia misses that this compliance functions like an instrumental cost/benefit analysis.

  **2. The Conceptual Question (Causation vs. Constitution)**
  Jacob views voting as a *causal* act (my vote causes the win). Sofia views it as an *expressive* act (my vote shows who I am). Both miss the **constitutive** view common in democratic theory.
  Voting is a ritual that constitutes the legitimacy of the government. By voting, the citizen validates the system that produces the outcome. If everyone followed Jacob's logic, the system would collapse, and the "public good" of legitimate governance would vanish. Thus, the individual vote is not about flipping the election; it is about sustaining the mechanism that allows for the election. This makes the act rational not because of the *result*, but because of the *system maintenance*.

  **3. The Empirical Question (Heuristics vs. Calculation)**
  Both assume voters are performing a conscious or subconscious expected utility calculation ($P \times B - C$). Behavioral research suggests voters do not calculate $P$ at all. They use **heuristics**.
  Most voters operate under a "minimax regret" strategy (Ferejohn & Fiorina). They don't ask, "Will I win?" They ask, "If my side loses by one vote and I didn't vote, how much will I regret it?" The potential regret of being the one person who didn't vote in a close election outweighs the cost of voting, regardless of the objective probability. This is an empirical fact about human psychology that bypasses Jacob's probability math and Sofia's expressive claims.

  ### Final Recommendation to the Debaters
  Tell Jacob that his model is a useful null hypothesis, but it fails as a descriptive theory because it ignores social and psychological utility. Tell Sofia that while expression matters, it doesn't fully explain why voters care about *winning* or why turnout fluctuates with competitiveness. The paradox is only a paradox if you insist on a 1950s-era definition of rationality. If you update the utility function to include social norms, regret minimization, and civic identity, the math balances, and everyone can go home.
