      *   *Constraint Check:* Did I assume the model *can't* know its weights? I need to be careful. The model *is* the weights. It doesn't "know" them separately. I must flag that equating "introspection" to "output" is the functionalist move.
      *   *Residue:*
          *   *Ineffability:* ML has no concept of "unsayable data." If it's in the system, it's representable.
          *   *Intrinsicness:* ML states are defined by causal role. Qualia are supposed to be non-relational.
          *   *Privacy:* ML weights can be copied.
          *   *Immediate Apprehension:* In ML, access takes compute cycles. Nothing is truly immediate.
      *   *Conclusion:* The vocabulary isn't missing anything; the target (qualia) is a category error. The ML view supports Dennett: if you can't log it, measure it, or distinguish it via ablation, it's not a variable in the system.

  8.  **Final Polish:**
      *   Check British spelling.
      *   Ensure the "Honesty Constraints" are visibly met (explicit flags).
      *   Ensure the "Residue" is the highlight.
      *   Make sure the distinction between "engineer access" and "system access" is clear (crucial for the introspection point).

  9.  **Self-Correction during drafting:** I initially thought about saying "we can't inspect the weights." That's false for ML. I must correct this: The *system itself* cannot inspect its own weights as data *while* running in a way that distinguishes past vs present without external storage. The "introspection" is the system's runtime state, not a debug tool. I need to make sure I don't conflate the Engineer (God's eye view) with Chase (the system). Dennett's point is about Chase's perspective. So, in ML terms, it's about the *system's* inability to query its own historical architecture without external logging.

      *Refinement on Constraint 1:* If I say "the model is an opaque function," a qualia defender says "consciousness isn't opaque." I must flag that treating the mind as a computational graph *is* the assumption. I will add a specific "Translation Note" section to handle this.

