      *   **Constraints:**
          1.  *Honesty Constraint 1:* Do not smuggle in ML assumptions (e.g., opaque internals) as translations if a qualia defender would deny them. Flag additions explicitly.
          2.  *Honesty Constraint 2:* Treat the "residue" (what doesn't translate) as the core deliverable, not an afterthought.
