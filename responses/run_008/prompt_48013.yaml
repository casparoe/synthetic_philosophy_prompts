prompt: |-
  I've been reading up on cliodynamics after a magazine longread introduced me to it, and I want a sanity check on the article's framing before I repeat any of it to others. The piece was about Peter Turchin's project of making history quantitative, and it summarized the core ideas roughly as follows: historical societies obey mathematical regularities comparable in kind to the laws of physics, which is why revolutions and civil wars can be forecast in advance; every complex society moves through a secular cycle of growth and collapse lasting on the order of two hundred and fifty years, punctuated every fifty years by a wave of unrest; the engine of breakdown is elite overproduction, the tendency of wealthy families to produce more heirs than there are elite positions for; by the late 2000s Turchin's equations were already flagging the United States for instability in the early 2020s, and when political turbulence arrived essentially on schedule, the approach was vindicated; critics object that history is too contingent for equations, but people said the same about weather before modern forecasting. The article closes by arguing that since instability is now computable decades in advance, the policy question reduces to tuning the inputs, and that capping the accumulation of elite wealth would defuse the current cycle.

  I found this persuasive, but a historian friend rolled her eyes at it, and I don't know enough to tell whose reaction to trust. Please audit the summary for me: go through it claim by claim and tell me what a working cliodynamicist would accept, what they'd call a simplification, and what genuinely misstates the view — paying particular attention to the difference between what Turchin claims to explain after the fact and what he claims to predict, and to whether "elite overproduction" means what the article makes it mean. Then assess the closing argument: does it follow from anything accurate in the summary that instability is predictable decades out in a policy-actionable way, and does the proposed remedy target the right variable? Please structure your response as follows:

  1. **Verdict up front** — one short paragraph stating how much of the summary survives scrutiny.
  2. **Claim-by-claim audit** — the core of the response, roughly 600–800 words, taking the summary's assertions in order and grading each as accurate, simplified, or wrong.
  3. **What the defenders would insist on** — roughly 150–250 words on how a proponent would rewrite the summary in their own terms.
  4. **What the historian's eye-roll gets right** — roughly 150–250 words on the strongest version of my friend's skepticism, so I'm not just swapping one credulity for another.
  5. **The closing argument** — roughly 200 words on whether the article's policy conclusion follows from its corrected premises.
