prompt: |-
  Each year in my graduate seminar on the philosophy of law I set a session on political legitimacy, and I have found that the material that most unsettles students is not any theorist's account but the constitutional architecture of the mature democracies that retain hereditary monarchs. Consider what these states actually do. In the United Kingdom, no bill becomes law without royal assent, and assent has not been withheld since 1708; the monarch delivers a speech, written entirely by the government of the day, that opens Parliament and announces its legislative program; the head of state holds a weekly private audience with the Prime Minister and receives boxes of state papers, while swearing personally to remain politically neutral; and members of the armed forces and of Parliament swear allegiance not to the state, the constitution, or the people, but to the Crown and its successors. In Norway, the monarch formally appoints the government after each election, and the Sami Parliament is opened by the King. In Sweden, by contrast, the constitutional reform of 1974 stripped the monarch of even the formal residue of political function, transferring duties such as the appointment of the Prime Minister to the Speaker of the Riksdag, so that the same institution survives there in a purely ceremonial register. And in postwar Japan, the constitution was rewritten to reduce an emperor once held to be sacred to a symbol of the state and the unity of its people. All of these polities affirm, somewhere in their constitutional self-understanding, that sovereignty rests with the people; all of them entrench an office that is hereditary, unelected, unremovable, and religiously or historically charged.

  Here is the puzzle I would like help articulating for my students. What theory of political legitimacy does this arrangement presuppose, if any? On its face the institution seems to require that we can drive a wedge between the source of authority and its exercise — that a thoroughly democratic distribution of effective power is compatible with a thoroughly undemocratic location of formal and symbolic authority — and yet the oath of allegiance is not to the body that actually wields power. Does the practice presuppose a theory of the state as a corporate entity that must have a personal head, so that the monarch is the legal person in whom the state inheres while the people are merely its sovereign interpreter? Does it presuppose that legitimacy over time is different in kind from legitimacy at a moment, with the hereditary line standing for the continuity of the polity itself in a way no elected office could? Or does it presuppose nothing at all about legitimacy, being a kind of inherited legal fiction that has outlived whatever theory once grounded it?

  I would like you to reconstruct the implicit theory as carefully as you can, and to distinguish what constitutional monarchy strictly presupposes from what it merely sits comfortably alongside — in particular, whether the Swedish and Norwegian variants, one stripped of all formal function and the other retaining real formal powers of appointment, are in fact licensed by the same underlying commitments or reveal that the institution is philosophically underdetermined and could be sustained by several incompatible theories of legitimacy. Then tell me what would actually have to change in these practices if we replaced whatever theory you reconstruct with a strict and thoroughgoing popular sovereignty: would a purely nominal elected presidency preserve everything that matters in the institution, or does something in the practice — the oath, the assent, the hereditary person as such — presuppose a claim that no elected office could carry, and if so, what exactly is that claim and can it survive the acknowledgment, common among defenders of these monarchies, that the crown's authority is now nothing but convention?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A graduate seminar on the philosophy of law.
      *   **Topic:** Political legitimacy in mature democracies with hereditary monarchies (UK, Norway, Sweden, Japan).
      *   **The Puzzle:** How do these systems reconcile popular sovereignty (democratic power) with hereditary, unelected, unremovable formal/symbolic authority?
      *   **Tasks:**
          1.  Reconstruct the implicit theory of political legitimacy presupposed by constitutional monarchy.
          2.  Distinguish what is strictly *presupposed* vs. what merely *sits comfortably alongside* the institution.
          3.  Compare variants (Sweden vs. Norway/UK) to see if they share underlying commitments or show philosophical underdetermination.
          4.  Analyze what would change under strict popular sovereignty (e.g., elected presidency).
          5.  Identify if there's a specific claim the hereditary monarch carries that an elected official cannot, and if it survives the admission that the authority is merely conventional.

  2.  **Deconstruct the Phenomenon:**
      *   *The Tension:* Democracy says power comes from the people. Monarchy says authority resides in a specific bloodline/person.
      *   *The Reality:* Power is exercised by elected officials. Authority is symbolized/formalized by the monarch.
      *   *The Oath:* Allegiance is to the Crown, not the Constitution/People.
      *   *The Variants:*
          *   UK/Norway: Retain formal powers (assent, appointment) but constrained by convention.
          *   Sweden/Japan: Stripped of formal powers, purely symbolic.
      *   *The Justification:* Continuity, neutrality, unity, historical grounding.

  3.  **Task 1: Reconstructing the Implicit Theory:**
      *   *Candidate 1: The King's Two Bodies.* The monarch is the "body natural" (dying) and "body politic" (immortal). This separates the person from the office.
      *   *Candidate 2: Dual Legitimacy.* Legitimacy has two sources: *Potestas* (power, from the people) and *Auctoritas* (authority/prestige, from history/tradition).
      *   *Candidate 3: The State as a Corporation Sole.* The Crown is a legal person distinct from the government.
      *   *Synthesis:* The theory is likely a form of **Dualistic Legitimacy** grounded in **Temporal Continuity**. It posits that the State is a trans-generational entity. Democracy handles the *will* of the current generation (legislative/executive power). Monarchy handles the *identity* of the polity across generations (symbolic/constitutional continuity).
      *   *Key Concept:* **The Distinction between Government and State.** The government changes; the State endures. The monarch embodies the State; the PM embodies the Government.

  4.  **Task 2: Presupposition vs. Compatibility:**
      *   *Strict Presupposition:* What *must* be true for this to work?
          *   The State exists independently of the current electorate.
          *   Authority requires a personal locus (cannot be fully abstract).
          *   Neutrality requires insulation from electoral competition.
      *   *Merely Compatible:*
          *   Formal powers (Sweden shows you don't *need* reserve powers).
          *   Religious sanctity (Japan/UK show it can be secularized/conventional).
          *   Specific hereditary rules (could theoretically be elective monarchy, but heredity serves the continuity function better).
      *   *Sweden vs. Norway:* Do they share commitments? Yes, the commitment to the *symbolic head* distinct from the *political head*. The difference is whether that symbol needs a "safety valve" (reserve powers) or not. Sweden suggests the *symbolism* is the core; Norway/UK suggests the *legal fiction of prerogative* is also core. This points to philosophical underdetermination regarding *power*, but determination regarding *personhood*.

  5.  **Task 3: Strict Popular Sovereignty & The Elected Presidency:**
      *   If we switch to an elected president (even nominal):
          *   *Loss of Neutrality:* An elected person has a mandate, a party, or a debt to donors/voters. They represent a *faction* of the people, not the *whole* people across time.
          *   *Loss of Continuity:* Terms limit the horizon. Heredity implies an infinite horizon.
          *   *The Oath Problem:* Swearing allegiance to a fellow citizen who was just your rival is different than swearing to an institution embodied in a person.
      *   *What is the unique claim?* **The Claim of Pre-Political Unity.** The monarch represents the people *before* they are divided into voters/parties. An elected official represents the people *after* they have been divided and counted.
      *   *Survival of Convention:* If defenders admit it's "just convention," does the magic die?
          *   *Risk:* Yes, if legitimacy relies on mystique.
          *   *Counter:* No, if legitimacy relies on *utility* (focal point for coordination) and *habit*. But the prompt asks about *legitimacy theory*, not just stability. If it's *only* convention, it becomes a costume. The theory requires that the convention *tracks* a deeper truth about the nature of the polity (its endurance).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the depth of the puzzle. It's about the schism between *constituent power* (people) and *constituted authority* (Crown).
      *   *Section 1: The Theory of Dual Legitimacy (Auctoritas vs. Potestas).* Draw on Schmitt or Weber implicitly. The monarch holds *Auctoritas* (weight, continuity), the Parliament holds *Potestas* (force, will).
      *   *Section 2: The Corporation Sole and the Two Bodies.* Explain the legal metaphysics. The Crown never dies. This allows the "State" to be a person without being a dictator.
      *   *Section 3: Sweden vs. Norway (Underdetermination).* Sweden proves formal power isn't necessary. Norway proves it's not inconsistent. Both prove the *Person* is necessary. The core commitment is the **depersonalization of power via the personalization of the state.**
      *   *Section 4: The Elected Presidency Test.* Why fails? Because elections introduce temporality and factionalism. The monarch is the "Neutral Third."
      *   *Section 5: The Convention Problem.* If it's just convention, is it a lie? It works as a "Noble Lie" or a "Useful Fiction." But for a *theory of legitimacy*, it must claim that the *form* of heredity captures something about time that elections cannot.
      *   *Conclusion:* Summarize the specific claim: The polity is a trans-generational community, not just a contract among the living.

  7.  **Refining the Philosophical Nuance:**
      *   Need to be careful with "Sovereignty." In the UK, Parliament is sovereign, but the Crown is the *source* of that sovereignty legally. In Japan, people are sovereign, Emperor is symbol.
      *   The prompt asks about *legitimacy*. Legitimacy is the *right to rule*.
      *   The key insight: Constitutional monarchy separates the *office of statehood* from the *activity of governing*.
      *   *Crucial distinction:* The oath is to the *Crown* (institution), not the *Monarch* (person). But the Crown is only accessible *through* the Monarch.
      *   *The "Claim":* The claim is that the State precedes the Democracy. The Democracy is a method of managing the State, not the source of its existence.

  8.  **Final Polish:** Check tone (academic, rigorous, suitable for a grad seminar). Ensure all parts of the prompt are addressed. (Self-Correction: Make sure to explicitly address the "Sweden vs. Norway" underdetermination question clearly).

      *(Self-Correction during drafting)*: I need to make sure I don't just describe the systems but articulate the *theory*. The theory is essentially **Organic Statism moderated by Democratic Proceduralism.** Or, perhaps more precisely, **Legitimacy as Continuity.**

      *Let's structure the argument around three pillars:*
      1.  *The Metaphysics of the State (Corporation Sole).*
      2.  *The Temporality of Legitimacy (Continuity vs. Mandate).*
      3.  *The Neutrality of the Symbol (Faction vs. Unity).*

      *Then address the "Elected President" counterfactual.*
      *Then address the "Convention" admission.*

      *Okay, ready to write.*
answer: |-
  This is a profound puzzle because it strikes at the tension between the *sociological* reality of power (who decides) and the *juridical* reality of authority (in whose name it is decided). To reconstruct the implicit theory of legitimacy here, we must move beyond standard social contract theory, which struggles to accommodate unelected heads of state, and instead look toward theories of **corporate personhood** and **temporal continuity**.

  Here is a reconstruction of the implicit theory, an analysis of the variations you note, and an assessment of what would be lost under a regime of strict popular sovereignty.

  ### I. The Implicit Theory: Dualistic Legitimacy and the Corporation Sole

  The constitutional architecture you describe presupposes a theory of **Dualistic Legitimacy**. It posits that the legitimacy of a political order rests on two distinct pillars that are intentionally kept separate:

  1.  **Legitimacy of Will (*Potestas*):** Derived from the contemporary electorate. This validates the *content* of law and the *direction* of policy. It is transient, majoritarian, and contestable.
  2.  **Legitimacy of Being (*Auctoritas*):** Derived from historical continuity and the personification of the state. This validates the *form* of law and the *existence* of the polity itself. It is permanent, pre-political, and incontestable.

  In this framework, the Monarch is not a ruler in the sense of a decision-maker, but a **legal metaphysic**. The theory relies on the medieval doctrine of the *King's Two Bodies* modernized into the concept of the **Corporation Sole**. The "Crown" is a legal person that never dies, never sleeps, and never errs. The human monarch is merely the current physical locus of this corporation.

  **What this strictly presupposes:**
  *   **The State precedes the People:** The theory assumes the State is a trans-generational entity that exists independently of the current electorate. The people do not *create* the state through voting; they *inherit* it and manage it.
  *   **Authority requires a Person:** Abstract concepts ("The Constitution," "The People") are insufficient to ground the emotional and legal loyalty required for stability. The State must be embodied in a specific human life to be the object of an oath.
  *   **Neutrality requires Insulation:** True neutrality (the ability to embody the whole without favoring a part) is impossible for anyone who seeks power. Therefore, the head of state must be structurally incapable of seeking power (heredity removes the need to campaign).

  **What merely sits comfortably alongside it:**
  *   **Reserve Powers:** As the Swedish example shows, the monarch does not strictly *need* formal political powers (like appointing the PM) to fulfill this role. The retention of these powers in the UK or Norway is a historical artifact, not a theoretical necessity. The core commitment is to the *symbolic head*, not the *executive head*.
  *   **Religious Sanctity:** While historically tied to divine right, the Japanese and Scandinavian examples show the theory can survive secularization. The "sacred" element is transposed from the theological to the constitutional-historical.

  ### II. The Swedish and Norwegian Variants: Underdetermination or Consistency?

  You ask whether the Swedish (purely ceremonial) and Norwegian (formal appointment) variants reveal philosophical underdetermination. They do, but only regarding the **distribution of power**, not the **location of authority**.

  Both variants are licensed by the same underlying commitment: **The depersonalization of power via the personalization of the state.**

  *   **In Norway/UK:** The theory retains a "safety valve." By keeping the formal power of appointment in the monarch, the system acknowledges that the democratic process is not self-executing; it requires a sovereign agent to crystallize the result. The monarch's refusal to use this power (convention) is what *demonstrates* their neutrality.
  *   **In Sweden:** The theory concludes that even the *appearance* of discretionary power is a risk to democratic legitimacy. By transferring appointment to the Speaker, Sweden purifies the democracy while keeping the Monarch as the **Symbol of Continuity**.

  This reveals that the institution is **philosophically underdetermined regarding prerogative** but **determined regarding personhood**. You can remove the powers (Sweden), but you cannot remove the hereditary person without collapsing the distinction between *Auctoritas* and *Potestas*. If the Speaker (an elected politician) becomes the head of state, the two pillars merge, and the "trans-generational" claim is weakened.

  ### III. The Counterfactual: Strict Popular Sovereignty and the Elected Presidency

  If we replaced this theory with strict and thoroughgoing popular sovereignty, instituting a purely nominal elected presidency, several specific claims currently carried by the monarchy would be lost. A nominal elected presidency would **not** preserve everything that matters in the institution.

  **1. The Claim of Pre-Political Unity**
  *   **Monarchy:** The monarch represents the people *before* they are divided into voters. They embody the community as a historical whole.
  *   **Elected President:** Even a nominal president is elected. To be elected is to be chosen by a majority (or plurality) over a minority. They inevitably represent a *faction* of the people, or at best, the people *at a specific moment in time*.
  *   **The Loss:** The oath of allegiance becomes problematic. In a monarchy, a soldier swears to the Crown (the enduring State). In a republic, they swear to the Constitution or the President. If they swear to an elected President, they are swearing allegiance to a fellow citizen who defeated their political rivals. This politicizes the loyalty of the state apparatus.

  **2. The Claim of Infinite Temporality**
  *   **Monarchy:** Heredity creates a chain of being that links the dead, the living, and the unborn. The monarch is a living link to the past and a bridge to the future.
  *   **Elected President:** Terms create a horizon. An elected official looks to the next election or their legacy.
  *   **The Loss:** The sense that the State is an immortal entity is diminished. The State becomes a contract among the living (to borrow Madison's phrasing), rather than a partnership "between those who are living, those who are dead, and those who are to be born" (Burke).

  **3. The Claim of Disinterestedness**
  *   **Monarchy:** Because the office is not sought, the occupant owes nothing to donors, parties, or voters. They can theoretically be the "Neutral Third."
  *   **Elected President:** Even in a ceremonial system, the path to the presidency requires political capital. They are indebted to the mechanism that elevated them.
  *   **The Loss:** The ability of the head of state to act as a genuine constitutional guardian in times of crisis is compromised by their political origins.

  ### IV. The "Convention" Problem

  Finally, you ask if the specific claim of the hereditary person can survive the admission that the Crown's authority is "nothing but convention."

  This is the critical vulnerability. If the theory rests on **mystique** (the divine right or the sacred blood), the admission destroys it. However, if the theory rests on **functional focal points**, it can survive.

  The claim that no elected office could carry is the **Claim of Arbitrariness as Neutrality.**
  In a democracy, every decision must be justified by reason or votes. But the *source* of the system itself cannot be voted into existence without circularity (who votes on the voting rules?). There must be a "fact" that grounds the system.
  *   In a republic, that fact is usually a Revolution or a Constitution (a text).
  *   In a monarchy, that fact is a **Person**.

  The hereditary principle is an **arbitrary rule** for succession. Paradoxically, this arbitrariness is its strength. Because it is arbitrary (birth, not merit), it cannot be contested on political grounds. No one can argue they deserve it more. This removes the head of state from the realm of political contestation entirely.

  **Can this survive the "convention" admission?**
  Only if the students understand that **conventions are the soft tissue of the constitution.** If the authority is admitted to be purely conventional, the monarchy becomes a **Useful Fiction**.
  *   **If the theory is Truth-Based:** (The King *is* sovereign by right of blood), the admission kills it.
  *   **If the theory is Function-Based:** (We *act as if* the King is sovereign to preserve stability and continuity), the admission strengthens it by removing magical thinking.

  However, for the philosophy of law seminar, the crucial point is this: **Strict popular sovereignty cannot account for the oath.**
  If sovereignty rests *wholly* with the people, the oath should be to the People or the Constitution. The fact that it remains to the Crown suggests that the legal system acknowledges a **sovereign gap**. The "People" are too abstract, too divided, and too transient to be the direct object of legal allegiance in this specific juridical tradition. The Crown fills the gap between the abstract concept of the State and the concrete reality of human loyalty.

  ### Summary for the Seminar

  To articulate the puzzle to your students:
  Constitutional monarchy presupposes that **Legitimacy is not monolithic.** It requires a **Janus-faced sovereignty**: one face looking forward to the democratic will (Parliament/PM), and one face looking backward to historical continuity (Crown).

  The hereditary monarch carries a claim that an elected president cannot: **The claim to represent the polity as a trans-generational organic whole, distinct from the sum of its current voters.**

  If you replace this with strict popular sovereignty, you gain consistency but lose the **metaphysical insulation** of the state from the politics of the day. The admission that this is "just convention" does not necessarily dissolve the legitimacy, provided the convention is understood not as a lie, but as a **technology of political time**—a mechanism to bind the present generation to the past and future in a way that a ballot box never can. The unsettlement your students feel is the friction of recognizing that modern democracy does not, in practice, fully believe its own theory of popular sovereignty.
