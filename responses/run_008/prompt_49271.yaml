  **PHENOMENAL INDEMNITY MUTUAL**
  **Claims Determination Notice**

  **Date:** October 14, 2023
  **Claim Number:** 8834-Q-QUALIA
  **Policy Number:** PIM-9982-Physicalist
  **Adjuster:** Dr. E. F. Connex

  **Dear Policyholder,**

  Pursuant to the terms of your disability coverage agreement, Phenomenal Indemnity Mutual has completed its review of your claim regarding Chronic Daily Migraine. We write to inform you that coverage for losses attributed to "pain," "suffering," or "phenomenal experience" is denied.

  This determination is not a dispute regarding the factual occurrence of neural events. Our medical review board accepts that your C-fibers fired, that your trigeminal nerve pathways activated, and that these physical occurrences precipitated your absence from work. However, under Section 14.B (Exclusion of Non-Interactive States), the policy covers losses caused by physical mechanisms, not losses caused by the *experience* of those mechanisms. While we acknowledge the presence of phenomenal states, our liability analysis relies on causal profiling. As established in contemporary metaphysics, phenomenal states are causally inert byproducts of physical processes. Therefore, while your brain states caused your missed workdays and the subsequent filing of this claim, your suffering itself caused nothing. It is a shadow cast by the machinery, not a gear within it. Consequently, the losses were generated by neural events, which fall under Section 9 (Neurological Mechanics), a rider your policy does not include.

  Furthermore, regarding evidentiary standards, we must apply the Philosophical Zombie Exclusion Clause. We note that a physical duplicate of yourself—a being identical in all functional and structural respects but lacking conscious experience—would have filed an identical claim under identical conditions. Since the filing of this claim is fully explicable via physical determinants alone, the submission itself cannot serve as evidence of phenomenal experience. The Company cannot be expected to indemnify events that leave no causal trace in any possible world accessible to investigation. To pay based on testimony alone would be to ignore the possibility that the testimony was produced without the accompanying qualia.

  We understand this distinction creates a paradox regarding phenomenal judgment. We observe, with genuine regret, that your sincere belief that you are in pain was fixed entirely by physical facts within your central nervous system. We are not denying that you suffer; we are merely noting that your suffering could not have been among the causes of your belief that you suffer, nor of your saying so. Your brain states compelled the assertion of pain; the pain itself remained silent. As our liability framework cannot reference items with no causal profile, the experience itself remains outside the scope of compensable loss.

  **Adjuster's Addendum:**
  Per protocol, I have completed a full physical and functional description of your condition, mapping every receptor, pathway, and synaptic firing associated with this claim. Per my training manual (Vol. 4, *The Closed Physical World*), nothing further of relevance remains for me to be told regarding the causality of your condition.
  *[Footnote 1: Personal and Non-Compensable]*: *Despite the completeness of the physical data, I still feel I am missing something.*

  **Appeals Procedure:**
  You may appeal this determination within thirty days. We invite you to submit further evidence regarding the causal efficacy of your experience. Please note, however, that whatever documentation you submit will be caused by your brain states, not by the experience itself. We look forward to reading the documents your physics will produce.

  Sincerely,

  **Claims Adjudication Department**
  Phenomenal Indemnity Mutual
  *"Coverage for the Physical World Only"*
