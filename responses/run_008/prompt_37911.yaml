answer: |-
  ### Scenario 1: The IVF Mismatch
  A 32-year-old patient undergoes *in vitro* fertilization using her own ova and her husband's sperm. Due to a clinic labeling error, a donor embryo from unrelated strangers is implanted instead. The pregnancy is confirmed at six weeks; the genetic mismatch is discovered via NIPT at ten weeks. The fetus is developing normally with no medical anomalies, but the patient, who specifically sought a genetic child with her husband and did not consent to carrying a stranger's genetic offspring, requests termination.

  **Analysis:**
  *   **Thomson:** Permits. The core of Thomson's argument is that consent to the *process* of pregnancy does not entail consent to *this specific entity's* use of one's body. Just as the violinist scenario relies on the lack of consent to the specific dependency, the clinic's negligence severs the voluntary assumption of risk regarding *this* fetus. The patient took reasonable steps to avoid *this* pregnancy (by specifying genetic material); the dependency was imposed.
  *   **Marquis:** Forbids. Marquis's argument turns on the deprivation of a "future like ours" (FLO). The fetus possesses a robust FLO regardless of its genetic relation to the gestator or the circumstances of conception. The wrongness lies in the loss of the fetus's valuable future, not the violation of the woman's contractual or consensual expectations.
  *   **Divergent Feature:** **Consent to Specific Dependency.** Thomson tracks the relational history and voluntary assumption of burden; Marquis tracks the intrinsic value of the fetus's potential life.
  *   **Strongest Attack:** A Marquis defender would attack Thomson's granularity of consent, arguing that by voluntarily undergoing IVF, the patient accepted the risk of *any* resulting pregnancy, much like voluntary intercourse accepts the risk of conception generally. A Thomson defender would counter that Marquis ignores the unique bodily imposition, rendering the woman a mere vessel regardless of fraud or error.

  ### Scenario 2: The Surrogate and the Anencephalic Fetus (Variant)
  **Structural Note:** A pure Thomsonian divergence in this direction is **unsatisfiable**. Thomson's argument is structurally a defense of a *right* to terminate, not a theory of *duty* to carry. It grants permissions by negating obligations; it lacks the normative machinery to forbid abortion on its own terms, as it explicitly rejects the idea that bodily integrity can be overridden by fetal need. To generate a verdict where Thomson "condemns," we must import an external premise regarding contractual waiver.

  **Fact Pattern:** A gestational surrogate, under a legally binding and freely signed contract to carry a pregnancy to term for intended parents, discovers at 18 weeks that the fetus has anencephaly (absence of major brain structures, precluding conscious experience). The intended parents, grieving but pragmatic, authorize termination to avoid medical risks to the surrogate. The surrogate, however, wishes to continue the pregnancy to term to honor her contractual commitment and personal sense of duty, but the clinic seeks to abort based on medical futility. (Reversed for the thought experiment: The surrogate wishes to *abort* against the contract, or the intended parents demand *continuation*? To fit the prompt's "Marquis permits / Thomson condemns" structure: The surrogate wishes to *abort*, Marquis permits, Thomson [with premise] condemns).
  *Revised Fact Pattern for Prompt Alignment:* A gestational surrogate, under a binding contract to carry to term, requests abortion at 20 weeks due to personal hardship. The fetus is diagnosed with anencephaly.

  **Analysis:**
  *   **Marquis:** Permits (or raises no objection). Anencephaly precludes the development of consciousness and any "future like ours" in the relevant sense (no experiences, projects, or enjoyment). Depriving the fetus of this biological remainder is not a moral wrong comparable to killing a person.
  *   **Thomson (Pure):** Permits. Bodily autonomy remains intact regardless of contract.
  *   **Thomson (With Added Premise):** Condemns. **Added Premise:** *"Voluntary contractual assumption of gestational duty waives the right to bodily termination."* With this premise, the surrogate's initial consent creates a special responsibility that overrides the default bodily autonomy Thomson protects.
  *   **Divergent Feature:** **Value of Future vs. Waiver of Rights.** Marquis looks at the fetus's capacity for a future; the modified Thomson looks at the woman's prior voluntary waiver of autonomy.
  *   **Strongest Attack:** A Thomson purist would reject the Added Premise as incompatible with the core argument, noting that Thomson explicitly compares such obligations to slavery (one cannot contract away bodily integrity). A Marquis defender might argue that even anencephalic fetuses have a *biological* future, but the stronger attack is that this scenario no longer tests Thomson's argument, but rather a contract-law overlay upon it.

  ### Final Verdict: Orthogonality and Conflict
  The arguments are **orthogonal but asymmetrical**. They track independent variables: Thomson tracks the **legitimacy of the dependency** (relational/consensual), while Marquis tracks the **value of the dependent** (ontological/future-oriented).

  They genuinely conflict at the point of **non-consensual dependency involving a valuable future** (Scenario 1: The IVF Mix-up). Here, Thomson's axis reads "No Obligation" (due to lack of consent) while Marquis's axis reads "Serious Wrong" (due to FLO).

  However, they do not symmetrically conflict in the reverse direction. Because Thomson's argument is a *shield* (defending against a claim of obligation) rather than a *sword* (establishing obligation), it cannot generate a prohibition without importing external duty-based premises (as seen in Scenario 2). Thus, the arguments cross only where Thomson permits and Marquis forbids. Where Marquis permits (no FLO), Thomson necessarily permits (or remains silent), unless her framework is artificially modified. The divergence is real, but it reveals that Thomson's argument is a subset of permissibility conditions, whereas Marquis's is a condition for impermissibility. They are independent axes, but they do not cover the same moral terrain.
