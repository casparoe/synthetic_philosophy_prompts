prompt: |-
  My sister's a nurse and at dinner last week she and her husband got into it about something from her work. A colleague of hers had a lab report and the analyzer printout both saying a patient was O-negative, and was completely sure, but re-ran the typing by hand anyway before a transfusion. Her husband said the double-check was silly: either the colleague knew the patient was O-negative, in which case why re-run anything, or she didn't. My sister said that's not how it works — when a mistake means someone dies, the standard you have to meet to *count* as knowing goes up; the same evidence that would let you skip the recheck for a routine wristband would be reckless here. He said then "knows" just means "confident enough for current purposes," which turns knowledge into a fact about our convenience rather than about the patient's blood. She said no — it's still a fact about the blood, but what it takes to be entitled to treat it as settled moves with what's riding on it, and that's not convenience, it's what knowing is *for*. He came back that if the standard moves with the stakes, the sentence "she knows the patient is O-neg" could be true said by the day-shift nurse and false said by the night-shift supervisor about the same person with the same evidence, which is absurd. She said lots of words work that way — "flat," for one — and he said a table being flat-enough for a glass isn't the same as blood being typed-enough for a transfusion, since only one of those has a right answer independent of our purposes. I honestly couldn't tell who was winning. Can you go through their exchange round by round and say who's right at each step, and where (if anywhere) they're both missing something? End with a final line "Verdict: ..." naming who comes out ahead overall and, in one clause, why.
