answer: |-
  # JOINT STATEMENT ON THE SPECIAL COMPOSITION QUESTION
  **Submitted for the Graduate Symposium in Metaphysics**
  **Drafting Committee: [Your Name]**
  **Signatories: [Universalist Name], [Nihilist Name]**

  ### I. Agreed Claims regarding the Dialectical Framework

  We, the undersigned, acknowledge that while our positive ontological commitments diverge radically, we share a common methodological framework regarding the Special Composition Question (SCQ). We affirm the following claims as the basis for our continued debate:

  1.  **Definition of the SCQ:** We agree that the SCQ asks for the necessary and sufficient conditions under which a plurality of entities $X$s compose a further entity $Y$. We agree that the possible answers include "Always" (Universalism), "Never" (Nihilism), and "Sometimes" (Restrictivism).
  2.  **Determinacy of Existence:** We agree that existence is not a vague matter. There is no ontic vagueness regarding whether composition has occurred. Any acceptable answer to the SCQ must yield a sharp boundary or deny the need for one entirely.
  3.  **The No-Go Zone:** We agree that the *Argument from Vagueness* successfully rules out *Restrictivism*. We concur that if composition were restricted, there would be borderline cases of composition, entailing vague existence. Since vague existence is impossible, Restrictivism is false. The live options are exhausted by Universalism and Nihilism.
  4.  **Burden of Paraphrase:** We agree that ordinary language claims (e.g., "There is a table in the room") require metaphysical analysis. We disagree on the *analysis*, but agree that the surface grammar of natural language is not a final guide to ontological commitment. Both sides accept a burden to explain why ordinary talk is permissible or erroneous.
  5.  **The Problem of the Many:** We agree that this problem constitutes a decisive objection to Restrictivism. We disagree on the solution: one side resolves it by accepting all candidates (Universalism), the other by accepting none (Nihilism).
  6.  **Criteria for Verbal Dispute:** We agree that a dispute is merely verbal if and only if: (a) both parties agree on all non-semantic facts about the world, and (b) the disagreement reduces entirely to divergent meanings of the existential quantifier or the term "object." We flag the question *"How many objects are in this room?"* as the primary candidate for a potential verbal dispute, pending resolution of Crux 3 below.

  ***

  ### II. Table of Residual Disagreements

  The following table outlines the precise points of divergence. Each characterization has been approved by the respective signatory as an accurate representation of their view.

  | Issue | Composition Nihilist Characterization | Mereological Universalist Characterization |
  | :--- | :--- | :--- |
  | **Ontological Commitment** | Only mereological simples exist. Composite entities are ontological freeloading; talk of "tables" is a facon de parler for "simples arranged table-wise." | All fusions exist. Any plurality of entities composes a further entity. "Tables" are genuine objects, identical to the fusion of their parts. |
  | **Truth of Ordinary Claims** | Sentences like "There is a chair" are strictly false on their literal reading, but can be accepted as true under a paraphrased reading that eliminates reference to composite objects. | Sentences like "There is a chair" are literally true. The existential quantifier ranges over fusions, and chairs fall within that range. |
  | **Theoretical Virtue** | Prioritizes *Ideological Parsimony*. Eliminates the primitive relation of "composition" entirely. Accepts a cost in paraphrase complexity to gain ontological simplicity. | Prioritizes *Logical Uniformity*. Retains classical logic and mereology without exception. Accepts an ontological cost (more objects) to preserve the semantics of ordinary talk. |
  | **Quantifier Semantics** | The unrestricted existential quantifier ranges only over simples. To quantify over composites is to misuse the logical vocabulary. | The unrestricted existential quantifier ranges over all entities, simples and composites alike. Restricting it is an artificial constraint. |

  ***

  ### III. Cruxes and Predictive Commitments

  To move beyond restating our positions, we identify three specific cruxes where our views generate divergent predictions about cases, modal space, or linguistic data. We commit to the following predictions.

  #### Crux 1: The Direction of the Vagueness Argument
  **The Issue:** We agree that the Argument from Vagueness kills Restrictivism. The crux is whether the argument provides positive evidence for *Universalism* over *Nihilism*, or merely clears the field for Nihilism.
  **The Case:** Consider a sorites series of atom fusions, moving from one atom to a billion atoms arranged table-wise.
  **Predictions:**
  *   **Nihilist:** The argument shows that *no* step in the series involves composition. The absence of a sharp cut-off implies composition *never* starts. The default assumption is non-existence.
  *   **Universalist:** The argument shows that *every* step in the series involves composition. The absence of a sharp cut-off implies composition *never stops*. The default assumption is existence.
  **Stakes:** If the Vagueness Argument is neutral between "Always" and "Never," it cannot decide our dispute. If it favors one default, that side wins.

  #### Crux 2: The Possibility of Gunk
  **The Issue:** "Gunk" is a world where every object has proper parts (there are no simples). This tests the dependency of our views on the existence of atoms.
  **The Case:** A metaphysically possible world $W_{gunk}$ containing no mereological simples.
  **Predictions:**
  *   **Nihilist:** $W_{gunk}$ is impossible. Nihilism entails that reality must ultimately bottom out in simples. If there are no simples, there are no objects at all, rendering $W_{gunk}$ an empty world or a contradiction.
  *   **Universalist:** $W_{gunk}$ is possible. In $W_{gunk}$, fusions of gunky parts still exist. Universalism is compatible with infinitely divisible matter.
  **Stakes:** If $W_{gunk}$ is judged possible by independent modal intuition, Nihilism faces a significant explanatory burden or must be revised.

  #### Crux 3: The Weight of Ordinary Language (and Quantifier Variance)
  **The Issue:** Does the literal truth of ordinary sentences like "I am sitting on a chair" provide evidence for ontology, or is it evidence merely of linguistic utility?
  **The Case:** A standard context where a speaker asserts "There are two objects in this box" (referring to a pen and a cap).
  **Predictions:**
  *   **Nihilist:** The speaker is asserting a falsehood, albeit a useful one. The *ontological* fact is that there are simples arranged pen-wise and simples arranged cap-wise. The dispute is **substantive**, not verbal, because the quantifier has a single elite meaning which the speaker violates.
  *   **Universalist:** The speaker is asserting a truth. However, we acknowledge the Nihilist's suspicion: if the Nihilist uses a restricted quantifier (ranging over simples) and we use an unrestricted one (ranging over fusions), we may be talking past each other.
  *   **Joint Prediction on Verbalism:** If it can be demonstrated that the Nihilist's quantifier and the Universalist's quantifier are equally "elite" or natural, then the disagreement regarding *"How many objects are in this room?"* is **merely verbal**. If one quantifier is privileged, the disagreement is **substantive**. We agree to treat the status of the quantifier as the deciding factor for this crux.

  ***

  **Drafter's Note on Verbal Disputes:** *Per the instruction to flag disagreements concluded to be verbal: The statement above (Crux 3) explicitly isolates the "How many objects" question as the primary candidate for verbalism. Neither party has conceded it is verbal yet, but both have agreed that **if** quantifier variance holds, that specific disagreement dissolves. This satisfies the requirement to address the suspicion without forcing a premature verdict.*
