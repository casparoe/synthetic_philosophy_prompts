answer: |-
  # PREP SHEET: Epistemology of Political Trust
  **Audience:** Public Choice Economists & Rational Choice PolSci
  **Goal:** Defend epistemic superiority of Nordic trust without conceding normative naivety.

  ## I. STRATEGIC CONCESSIONS (Say these in the first 5 minutes)
  *Do not wait to be cornered. Pre-empting these signals you understand their models.*

  1.  **Concede that "Trust" is not intrinsically virtuous.** Explicitly state: "High trust in a predatory state is epistemically *worse* than distrust. My claim is conditional on the state actually being non-predatory." This disarms the "trust in Stalin" objection before it lands.
  2.  **Concede that information is costly.** Do not claim checking the administrative record is *free*. Claim the *marginal cost* of verification is significantly lower in Nordic institutional designs than in the US.
  3.  **Concede that US distrust has *some* rational basis.** Acknowledge that US institutional complexity (veto points, federalism) makes competence harder to verify, making heuristics (partisanship) a rational second-best. This prevents you from sounding like a Nordic chauvinist.

  ---

  ## II. THE SIX OBJECTIONS (Ranked by Damage)

  ### 1. The Ex-Post Rationalization Trap (The "Killer")
  **The Objection:** "You are defining rationality by outcomes. If I trust a government and it performs, I am rational. If I distrust it and it performs, I am irrational. This is hindsight bias. Where is the *ex-ante* decision rule? If your standard of rationality collapses into 'trust is reasonable wherever trust has been vindicated,' you have no predictive theory, only a description of survivors."

  *   **2-Minute Reply:** "I am not arguing that successful outcomes make trust rational; I am arguing that *access to verification mechanisms* makes trust rational. The Nordic citizen has a lower cost of monitoring. The rationality lies in the *process* of calibration, not the outcome. If the Swedish state failed tomorrow, the Swede's trust would become irrational *faster* than the American's distrust because their feedback loop is tighter."
  *   **The Soft Spot:** You are leaning heavily on the assumption that low monitoring costs *guarantee* better calibration. If the data is transparent but complex (e.g., macroeconomic policy), transparency doesn't equal comprehensibility.
  *   **Verdict:** **This is the killer.** If you cannot specify an *ex-ante* heuristic that distinguishes 'reasonable trust' from 'gullibility' without referencing the outcome, a rational choice model will reject your epistemology as circular. You must pivot to "costly signaling" or "verification capacity" immediately.

  ### 2. Simultaneity Bias (Endogeneity of State Capacity)
  **The Objection:** "You treat administrative performance as the independent variable and trust as the dependent. But in public choice, trust *is* state capacity. High trust lowers transaction costs, which *produces* the performance you observe. You're mistaking the fuel for the engine."

  *   **2-Minute Reply:** "I agree they are mutually reinforcing. However, my claim is about the *entry point*. Historical institutionalism suggests Nordic transparency mechanisms preceded the high-trust equilibrium. The institutional design allowed for initial calibration, which then created the virtuous cycle. The American design created a verification bottleneck."
  *   **The Soft Spot:** Your data is likely cross-sectional or short time-series. Proving the institutional design came *before* the trust culture is a heavy historical lift for a PolSci talk.
  *   **Damage:** High. Undermines the causal direction of your thesis.

  ### 3. Rational Ignorance & Information Costs
  **The Objection:** "Downsian rational ignorance applies. Even if records are 'cheap' to check in Scandinavia, the expected benefit of one citizen checking is near zero. Why is the Nordic citizen rational for checking, but the American rational for ignoring? You haven't solved the free-rider problem of monitoring."

  *   **2-Minute Reply:** "Because the *social return* on monitoring is internalized differently. In high-social-capital environments, monitoring is a social norm, not just an individual calculation. The 'cost' includes social sanction for non-participation. The American model assumes atomized actors; the Nordic model assumes embedded actors."
  *   **The Soft Spot:** This drifts into "civic culture," which this audience hates. You need to frame "social sanction" as a tangible cost/benefit, not a norm.
  *   **Damage:** Medium-High. Challenges the micro-foundations of your "calibration" argument.

  ### 4. Revealed Preference vs. Cheap Talk
  **The Objection:** "You admit Americans behave trustingly (pay taxes, claim benefits) but speak distrustfully. In economics, we believe revealed preference. If behavior is identical, the 'epistemic attitude' is irrelevant noise. Why should we care about survey expressions if the equilibrium outcome is the same?"

  *   **2-Minute Reply:** "Because expressive preferences constrain future policy equilibria. High expressive distrust raises the political cost of long-term investment. It forces politicians to discount the future heavily to satisfy current suspicion. The behavior is the same *now*, but the investment horizon is shorter."
  *   **The Soft Spot:** You need evidence that expressive distrust actually shortens policy horizons. Anecdotal evidence won't satisfy them.
  *   **Damage:** Medium. Attacks the practical significance of your dependent variable.

  ### 5. Incentive Compatibility (The "Intent" Problem)
  **The Objection:** "You split trust into competence and intent. Public Choice assumes intent is irrelevant; only incentive compatibility matters. A bureaucrat doesn't need to 'mean well' if the rules punish rent-seeking. By focusing on intent-trust, you are importing a normative assumption that benevolent agents are possible."

  *   **2-Minute Reply:** "I agree intent is secondary to incentives. However, 'intent-trust' in my model is a proxy for perceived incentive alignment. When citizens believe the system is rigged (low intent-trust), they assume incentives are misaligned regardless of evidence. It is a belief about the *structure*, not the soul."
  *   **The Soft Spot:** You must be careful not to let "intent" sound like psychological benevolence. Keep it structural.
  *   **Damage:** Medium. Philosophical disagreement, but manageable if you stick to structuralism.

  ### 6. Selection Bias (Nordic Exceptionalism)
  **The Objection:** "Nordic states are small, homogeneous, and resource-rich. Comparing them to the US is comparing a speedboat to an aircraft carrier. The 'epistemic rationality' you observe is just a function of scale and homogeneity reducing monitoring costs, not superior institutional design."

  *   **2-Minute Reply:** "Scale matters, but design is transferable. My argument isn't that the US should be Sweden, but that the US has *increased* the cost of verification through complexity. Even large states can lower verification costs via administrative simplification."
  *   **The Soft Spot:** It is hard to deny that homogeneity lowers transaction costs. Don't fight this too hard.
  *   **Damage:** Low. They know this; they just want to see if you do.

  ---

  ## III. THE KILLER QUESTION (Plain Assessment)

  **The Question:** *"Is your standard of rationality just outcome bias? If trust is reasonable because it was vindicated, do you have any advice for a citizen *before* the vindication occurs?"*

  **Plain Assessment:** **Yes, this is the killer.**
  Your current formulation relies heavily on the *existence* of a clean administrative record to justify the trust. A rigorous rational-choice critic will argue that without an *ex-ante* rule for when to trust (independent of knowing the outcome), you are not describing rationality; you are describing luck.

  **How to survive it:**
  You cannot win on pure epistemology. You must pivot to **Institutional Epistemology**.
  *   **Do not say:** "Trust is rational because the government performed well."
  *   **Do say:** "Trust is rational when the *institutional design* allows for low-cost falsification. The Nordic citizen is rational not because the government *is* good, but because the citizen *could find out* if it weren't. The American is irrational because they distrust even when the mechanism for verification is available, or they trust when it is obscured."

  Shift the metric from **Performance** (outcome) to **Verifiability** (structure). If you fail to make this distinction clearly, the economists will dismiss your thesis as tautological.
