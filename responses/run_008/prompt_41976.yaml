answer: |-
  Diagnosis: **Substantive-but-Hidden** (specifically, a metaphysical dispute about the normativity of propositional content).

  While the surface disagreement looks verbal (a fight over the label "semantics" vs. "pragmatics"), the stalemate persists because the two camps are making incompatible claims about the **architecture of meaning**. It is not merely a matter of where you draw the line; it is a disagreement about whether normative force can be part of the *proposition* expressed, or whether it must remain external to it. If it were purely verbal, you could translate one theory into the other without loss of explanatory power. You cannot. The Lexicalists require a semantic machinery that composes normative force; the Pragmatists require a machinery that keeps truth-conditions clean and offloads force to context. These are different engines, not different maps of the same terrain.

  ### Support from the Hard Cases

  The substantive nature of the dispute is revealed in how each side protects its core commitment when facing the "hard cases." They do not just re-label the data; they posit different underlying mechanisms that would yield different results in counterfactual scenarios.

  **1. Embedding and Projection**
  *   **The Case:** "If John is a [slur], he will be fired."
  *   **Lexicalist Move:** The offense projects (survives) the conditional. This is treated as a **presupposition** or a non-truth-conditional semantic component that composes with the conditional operator. The offense is *in the sentence*.
  *   **Pragmatist Move:** The offense is mitigated or context-dependent. The speaker is not asserting the slur, merely hypothesizing it. The offense is a **speaker commitment** triggered by the act of utterance, not the sentence type.
  *   **The Hidden Substance:** If you run an experiment where the offense *fails* to project in a specific embedding context, the Pragmatist says, "See? It's pragmatic." The Lexicalist says, "We need a more complex semantic operator." The disagreement is about **parsimony**. The Lexicalist is willing to complicate the semantics to save the intuition that the word *itself* is dangerous. The Pragmatist is willing to complicate the pragmatics to save the intuition that semantics is purely descriptive. This is a substantive trade-off in theory construction, not a definition fight.

  **2. Reclamation and In-Group Use**
  *   **The Case:** A member of the targeted group uses the slur affectionately ("That's my [slur] brother").
  *   **Lexicalist Move:** The **lexical entry has changed**. There are now two homophonous words, or the semantic value is context-sensitive (a hidden argument place for 'perspective' is filled differently).
  *   **Pragmatist Move:** The **norm of use has been suspended**. The word means the same thing, but the prohibition on utterance is waived by the speaker's identity.
  *   **The Hidden Substance:** This reveals the metaphysical crux. For the Lexicalist, meaning is unstable and tied to social power dynamics (the word *means* something different when *they* say it). For the Pragmatist, meaning is stable and abstract, while *use* is socially situated. If you ask, "Did the *meaning* change?", they will answer differently, and that answer dictates how they model language acquisition and change. One side models social change as semantic drift; the other as norm negotiation.

  ### Why It Is Not Purely Verbal

  If this were a verbal dispute, there would be a "neutral description" both sides accept. There isn't.
  *   **Neutral Description:** "Uttering token *t* in context *c* causes offense *o*."
  *   **Lexicalist Rejection:** This misses that the offense is *correct* or *warranted* by the meaning. The sentence *merits* a negative reaction regardless of context.
  *   **Pragmatist Rejection:** This misses that the sentence can be *true* even if offensive.

  The Lexicalist believes that stripping the offense from the semantics strips the word of its specific harm (making it merely rude, not oppressive). The Pragmatist believes that putting the offense in the semantics mystifies the harm (making it a property of the word rather than the history of its use). They are fighting over the **locus of moral responsibility** in language, disguised as a technical boundary dispute.

  ### What Counts as Progress?

  More data will not help; as you noted, both sides "absorb" cases. Progress requires shifting the ground from "Who is right?" to "What is the cost of being right?"

  **1. A Formal Result on Compositionality (The Parsimony Test)**
  Progress would look like a formal proof showing that one framework handles **complex embeddings** with fewer *ad hoc* stipulations.
  *   *Example:* Can the Pragmatist explain why "It is not the case that [slur]" feels worse than "It is not the case that [neutral term] + [insult]" without positing a lexical difference? If they must posit a "prohibition operator" that acts exactly like a semantic presupposition, they have conceded the Lexicalist's point in all but name.
  *   *Conversely:* Can the Lexicalist explain reclamation without positing massive lexical ambiguity? If they need a new lexical entry for every sub-culture that reclaims a term, their semantics becomes unlearnable.
  *   **The Metric:** Whose theory requires fewer parameters to predict the same range of felicity conditions?

  **2. The "Error Theory" Intuition Pump**
  You need to isolate the truth-conditional intuition. Present the workshop with this case:
  > *A speaker from a distant culture, unaware of the history of oppression, uses the slur to refer to a member of Group G, intending no harm and violating no local norms (because they are in a vacuum). They say, "John is a [slur]."*

  *   **Question:** Is the sentence **False** (or truth-valueless)?
  *   **Lexicalist Prediction:** Likely True (extensionally) but Defective (semantically). Or, if they are expressivists, it expresses a false normative attitude.
  *   **Pragmatist Prediction:** True and Felicitous (for that speaker), though perhaps still harmful if recorded.
  *   **Progress:** If the workshop can agree on the intuition here, the dispute collapses. If half say "False/Defective" and half say "True," you have confirmed the dispute is substantive: you have half the room believing normative force is truth-conditional, and half believing it is not.

  **3. Agreed Reclassification: "Semantics of Use"**
  The most productive progress would be to dissolve the border entirely. Adopt a framework like **Ginzburg's KoS (Kinematics of Discourse)** or **Potts' Expressive Logic**, where "semantic value" includes both truth-conditions and use-conditions (conventional implicatures or expressives).
  *   **The Shift:** Stop asking "Is it semantics or pragmatics?" Start asking "Is the normative content **at-issue** or **not-at-issue**?"
  *   **Why:** Both sides agree the offense is robust. The Lexicalist calls it "semantic"; the Pragmatist calls it "pragmatic." If you reclassify it as **Conventionalized Expressive Content**, you acknowledge it is encoded in the lexicon (Lexicalist win) but does not affect truth conditions (Pragmatist win).

  ### Conclusion

  The dispute is **substantive-but-hidden**. It is a conflict between a **Descriptivist Metaphysics** (language describes the world; norms are external) and an **Expressivist/Normative Metaphysics** (language enacts norms; norms are internal).

  Progress will not come from new examples of slur usage. It will come from a **metatheoretical agreement** on whether a semantic theory is obligated to capture *truth* alone, or *force* as well. Until the workshop agrees on what a semantic theory is *for*, they will continue to sort the same facts into different bins. The "sharper test case" is not a linguistic one, but a philosophical one: **Can a moral ought be part of a semantic is?**
