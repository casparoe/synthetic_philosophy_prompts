      *   *Verdict:* The rationalist lore is mostly right on the *heuristics* (be skeptical of group selection), but wrong on the *mathematics* (MLS and Inclusive Fitness are formally equivalent). The "substantive" part of the debate was about modeling priors, not the underlying dynamics.

