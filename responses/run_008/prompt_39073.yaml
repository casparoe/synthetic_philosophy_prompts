answer: |-
  **Brainstorm: The Moving Parts**

  Before locking into the argument, I need to lay out the tensions. This isn't just a story about two men and a letter; it's a collision of different epistemic cultures.

  *   **The Epistemic Asymmetry:** Darwin's "discovery" is a geological stratum—20 years of sediment, barnacles, pigeons, notebooks. Wallace's is a lightning strike—an essay written in a fever state on the periphery of empire. Philosophy of science often treats "the idea" as a discrete unit, like a bead. Here, the beads are the same size, but the necklaces are completely different weights.
  *   **The Social Infrastructure:** The Linnean Society wasn't a modern journal. It was a gentleman's club. Hooker and Lyell weren't neutral editors; they were Darwin's creditors (socially and intellectually). The "solution" was a negotiation of honor, not a adjudication of truth.
  *   **The Theoretical Divergence:** We treat "Natural Selection" as a monolith. But for Wallace, it was a stabilizing force (keeping species adapted to environment). For Darwin, it was a diverging wedge (creating new species). Wallace drew a supernatural boundary at the human brain; Darwin refused to.
  *   **The Silence:** Standard multiple-discovery theory (Merton et al.) explains *timing* well but explains *reception* poorly. It assumes the idea is the unit of value. In 1858, the *person* was the unit of value.
  *   **The Counterfactual Weight:** If the idea was inevitable, why does the history of biology look so different without Darwin's specific rhetorical labor?

  ***

  ### 1. Theory → Case: The Multiple-Discovery Framework

  The standard Mertonian view of simultaneity posits that scientific discoveries are not unique events but rather the maturation of a "problem space." When the conceptual ingredients accumulate to a critical mass, the solution becomes visible to multiple competent observers.

  **Where the Framework Fits:**
  This explains the *when* perfectly. By 1858, the raw materials were indeed lying on the table. Malthus on population was standard reading for the educated class. Lyell's uniformitarianism had provided the deep time necessary. The biogeographical patterns Wallace was mapping in the Malay Archipelago and Darwin had mapped on the *Beagle* were screaming for a dynamic explanation rather than a static creationist one. The "idea" of selection was, in a real sense, low-hanging fruit. If not Wallace, it might have been Matthew (who had hinted at it earlier) or someone else in the breeding circles. The framework correctly identifies that 1808 would have been too early (no deep time) and 1908 too late (the data was already overwhelming).

  **Where the Framework Goes Silent:**
  The multiple-discovery model treats the discovery as an atomic proposition: "Selection exists." It has no vocabulary for the *labor* differential. It cannot account for the fact that Darwin had a theory of *divergence* while Wallace had a theory of *adaptation*.

  This leads me to my position on whether this was **One Discovery or Two**.

  I argue it was **One Mechanism, Two Ontologies.**

  If we define the discovery strictly as the *logic* of natural selection (variation + struggle + heredity = change), then it is One Discovery. The Linnean Society was technically correct to grant joint priority on the *mechanism*. The logic is identical.

  However, if we define the discovery as the *scientific program*—what you *do* with the mechanism—then it is Two Discoveries. Wallace's ontology was teleological in a way Darwin's was not. Wallace believed selection kept a species "up to standard" relative to its environment; he viewed it as a stabilizing feedback loop. He later insisted the human mind was too complex for this mechanism and required spiritual intervention. Darwin's ontology was generative and materialist all the way down; selection was a wedge that drove populations apart, creating complexity without a ceiling.

  The multiple-discovery framework goes silent here because it assumes that once the core insight is had, the theoretical superstructure follows naturally. It doesn't. The framework explains why they both saw the engine, but it cannot explain why Darwin built a car and Wallace built a generator. The "idea" wasn't just the engine; it was the vehicle. By lumping them together in 1858, the Linnean Society obscured the fact that they were actually proposing different uses for the same tool.

  ### 2. Case → Theory: Inevitability and Credit

  **The Inevitability Thesis:**
  Does the simultaneity prove the discovery was inevitable? It proves *ripeness*, not *necessity*.
  The episode supports a "weak inevitability." It shows that the *conceptual space* for selection was open. However, it does not prove that *this specific formulation* was the only path. There were other evolutionary theories available (orthogenesis, Lamarckism). Selection won not just because it was "time," but because Darwin (and Wallace) provided a causal mechanism that fit the existing data better than the alternatives.
  So, the case bends the inevitability thesis: Simultaneity shows that the *problem* was solvable, not that the *solution* was forced. It validates the sociological view that science moves in phases, but it doesn't validate the deterministic view that specific truths emerge automatically.

  **Credit Allocation: Convention vs. Fact:**
  The Hooker-Lyell maneuver is a pristine example of credit allocation as a social convention rather than an ontological fact. There was no rulebook. They prioritized *incentive* and *stability* over strict chronology. They knew Darwin had the bulk of the evidence and the social capital to defend it. They knew Wallace was a collector, not a country gentleman with a private income. If Wallace had been credited solely, Darwin might have withdrawn, and the massive evidentiary weight of *The Origin* might never have been published in that form.

  **Would This Fly Today?**
  Absolutely not. The Linnean solution was a product of a small, high-trust gentry network where reputation was currency and everyone knew everyone's handwriting.
  In modern science, the "receipt date" is king. If Wallace's paper arrived on June 18th and Darwin's abstract was written on June 19th (after receiving Wallace's), modern norms would likely scoop Darwin entirely, or force a contentious co-authorship negotiation where Wallace holds the leverage.
  Modern journals are impersonal arbiters; the Linnean Society was a club. Today, the "joint reading" would look like editorial misconduct or coercion. We have moved from a system of *gentlemanly honor* to a system of *timestamped priority*. The Victorian solution worked because the goal was to preserve the community's harmony and ensure the best man (Darwin, in Lyell's view) had the resources to finish the work. Today, the goal is often to establish the "first" claim for citation metrics. The 1858 arrangement was about *stewardship* of the idea; modern arrangements are about *ownership*.

  ### 3. The Counterfactual: The Darwin-less World

  Suppose Darwin drowns in 1836. Wallace sends his essay in 1858. Hooker and Lyell have no old Darwin manuscripts to pull out. Wallace gets the sole credit.

  **Do we get *The Origin*?**
  We get the *mechanism*, but we do not get *The Origin of Species* (the book, the cultural force).

  Wallace was a brilliant field naturalist, but he was not a systematizer on Darwin's scale. He did not have 20 years of barnacle dissections. He did not have the pigeon breeding data. Crucially, he did not have the rhetorical strategy. Darwin's genius was not just the idea; it was the *accumulation of objection-handling*. *The Origin* is structured as a long argument against every possible doubt. Wallace's writing was more direct, more speculative, and less armored.

  **Cultural Force:**
  Without Darwin, natural selection likely enters science as a important *factor*, but not as *the* explanation. Wallace was more open to spiritualism and teleology. A "Wallacean Evolution" might have coexisted more comfortably with religious natural theology for longer. It might have been seen as a law of adaptation (keeping things perfect) rather than a law of divergence (making things messy).

  **Does It Matter Who Made It?**
  This brings me to the consistency check with Part 1.
  In Part 1, I argued it was One Mechanism, Two Ontologies.
  In this Counterfactual, I am arguing that the *Ontology* depends on the *Person*.

  Therefore: **The "Who" matters for the Trajectory, not the Truth.**

  If the question is "Would the truth of natural selection have been discovered?" the answer is Yes. The multiple-discovery framework holds there. The mechanism was ripe.
  If the question is "Would the Darwinian Revolution have happened?" the answer is No. The specific cultural hegemony of materialist evolution, the specific way biology was reorganized around common descent without teleology, was a product of Darwin's specific labor, his specific anxieties, and his specific social position.

  **Conclusion:**
  The 1858 episode is often cited as proof that ideas are inevitable. I argue it is proof that *insights* are inevitable, but *theories* are not. An insight is a spark; a theory is a fire that needs fuel, shelter, and a hearth. Wallace had the spark. Darwin had the hearth.

  The philosophy of discovery often fails because it tries to measure the spark and ignores the hearth. The Linnean Society tried to credit the spark equally, which was honest. But history credited the hearth, which was accurate. If Darwin dies, we still have evolution, but it looks different—softer, perhaps more teleological, less totalizing. The "truth" survives, but the "worldview" changes. And in science, the worldview is often more consequential than the truth.
