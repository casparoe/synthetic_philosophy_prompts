answer: |-
  Here is a framework for a theory of commemoration ethics designed for municipal adjudication. It prioritizes actionability over philosophical elegance, explicitly flagging where ideals break against the machinery of governance.

  ### I. The Desiderata

  **1. The Endorsement Constraint (Temporal Indexing)**
  *   **Motivation:** A monument maintained by public funds and situated on public land performs a speech act on behalf of the *current* governing body, regardless of original intent. To keep a monument is to re-utter its claim.
  *   **Operationalization:** High. (Check budget lines: Who pays for maintenance? Check zoning: Is it public right-of-way?)
  *   **Status:** **Non-negotiable.**
  *   **Note:** This directly addresses the "rewriting history" charge. The theory must assert that *preservation is a choice*, not a neutral default.

  **2. The Honor/Record Distinction (Commendatory Force)**
  *   **Motivation:** Defenders claim statues are "history lessons." The theory must distinguish between *commending* a subject (statue in square) and *documenting* a subject (plaque in museum).
  *   **Operationalization:** Medium. (Requires a heuristic: Is the figure depicted in a heroic pose? Is the location a place of civic gathering or archival study?)
  *   **Status:** **Non-negotiable.**
  *   **Note:** If a monument functions primarily as honorific, "educational context" cannot fully neutralize it.

  **3. The Core Legacy Threshold (No-Clean-Hands)**
  *   **Motivation:** Since all historical figures have flaws, we need a cutoff between "flawed founder" (Lincoln) and "dedicated antagonist" (Davis). The distinction must rest on whether the injustice was incidental to their achievement or constitutive of it.
  *   **Operationalization:** Low. (Requires historical consensus which is often contested.)
  *   **Status:** **Non-negotiable.**
  *   **Note:** *Flag:* This is the hardest requirement to operationalize without a designated historical commission. Without it, the theory collapses into "remove everyone" or "remove no one."

  **4. The Media Heterogeneity Rule**
  *   **Motivation:** Renaming a street disrupts emergency services, mail, and property deeds; removing a statue disrupts a park view. The ethical burden must be weighed against the material cost and disruption.
  *   **Operationalization:** High. (Cost estimates, logistical impact assessments.)
  *   **Status:** **Non-negotiable.**
  *   **Note:** This prevents the theory from being purely symbolic; it forces a cost-benefit analysis of the *method* of removal.

  **5. The Standing Requirement (Disproportionate Burden)**
  *   **Motivation:** Those forced to live under the honorific (e.g., Black residents under a Confederate statue) bear a burden the defenders do not. Their objection must carry more weight than general nostalgia.
  *   **Operationalization:** Medium. (Requires defining the "targeted group" and a mechanism for weighted testimony.)
  *   **Status:** **Non-negotiable.**
  *   **Note:** This prevents the "majority rules" approach to minority dignity.

  **6. The Countermonument Possibility**
  *   **Motivation:** Commemoration can be critical (e.g., a statue of a victim looking at the perpetrator). The theory should allow for art that questions rather than lauds.
  *   **Operationalization:** Low. (Public reception is unpredictable; "critical art" is often read as "honorific" by the laypublic.)
  *   **Status:** **Camp Prejudice.**
  *   **Note:** *Flag:* This is philosophically rich but practically risky for a city council. Relying on the public to interpret irony is a failure of municipal communication.

  **7. The Removal Consequence (Prudential Weighting)**
  *   **Motivation:** Removal can create martyrs or rally extremist groups. Does the theory weigh the risk of violence or social unrest?
  *   **Operationalization:** High. (Police risk assessment.)
  *   **Status:** **Prudential Constraint (Not Ethical Core).**
  *   **Note:** *Flag:* This is not about what is *right*, but what is *safe*. A theory that ignores this gets people hurt; a theory that prioritizes this over justice becomes cowardly. It must be a tie-breaker, not a primary axiom.

  ---

  ### II. Joint Satisfiability Analysis

  You suspected tensions in the list. You were correct. The following triad is **not jointly satisfiable** without downgrading one element:

  1.  **Preserve Public Historical Memory In Situ** (Keep the statue where it was).
  2.  **Do Not Honor the Dishonorable** (The Core Legacy Threshold).
  3.  **Do Not Distort Original Meaning** (The Honor/Record Distinction).

  **The Conflict:** If a statue was erected to honor white supremacy (1 & 3), keeping it *in situ* (1) inevitably signals current endorsement (violating 2), unless you add context so heavy it obscures the original work (violating 3). You cannot keep a Confederate statue in a town square, claim it is "just history," and simultaneously claim you do not honor the Confederacy. The location *is* the honor.

  **The Decisive Requirement:**
  **The Endorsement Constraint (Temporal Indexing).**
  This is the single requirement that decides the familiar debates before scoring happens. If the city maintains the land and the object, the city is speaking. Once this is accepted as non-negotiable, the "It's just history" defense collapses. The question shifts from "What did this mean in 1900?" to "What does this say in 2024?" This requirement forces the council to either own the message or change the medium.

  ---

  ### III. Evaluation of Standard Positions

  Here is how the three dominant policy positions fare against the desiderata, noting where they survive only by downgrading a non-negotiable requirement.

  #### 1. Keep and Contextualize
  *   **Verdict:** **Fails** on strict application.
  *   **Why:** It attempts to satisfy *Media Heterogeneity* (low cost) and *Preserve Memory*, but it violates the *Endorsement Constraint*. A plaque at the base of a heroic statue rarely overrides the visual language of the statue itself.
  *   **Downgrade Required:** To make this work, you must downgrade the **Honor/Record Distinction**. You have to accept that the public will likely still perceive the statue as honorific despite the text. This is viable only for "Lincoln-with-flaws" cases, not "Dedicated-Supremacist" cases.

  #### 2. Remove and Relocate to Museum
  *   **Verdict:** **Survives** best ethically, **Fails** pragmatically.
  *   **Why:** It satisfies *Endorsement Constraint* (no longer on public civic land), *Honor/Record Distinction* (museum context implies documentation), and *Core Legacy Threshold* (removes the honor).
  *   **Downgrade Required:** To make this work, you often have to downgrade the **Media Heterogeneity Rule**. Museums cost money; moving heavy monuments is expensive. If the budget doesn't exist, this ethical winner becomes a practical loser. Additionally, it risks violating the *Removal Consequence* if the removal is seen as "erasure" by a significant portion of the populace, potentially fueling unrest.

  #### 3. Remove and Replace (Countercommemoration)
  *   **Verdict:** **Survives** ethically, **Risks** the *Countermonument* prejudice.
  *   **Why:** It satisfies *Endorsement Constraint* (new message) and *Standing* (centers the marginalized).
  *   **Downgrade Required:** It relies heavily on the **Countermonument Possibility**. If the new art is too abstract, the public may view it as wasteful rather than corrective. It also faces the **Core Legacy Threshold** in reverse: Does the new figure have flaws that will be contested in 50 years? This option kicks the temporal problem down the road rather than solving it.

  ### Summary Recommendation for the Council

  If you require a theory that is **non-negotiable** on ethics and **operationalizable** on policy:

  1.  **Adopt the Endorsement Constraint as the primary filter.** If the monument conveys a message the city cannot endorse today, it cannot remain in a civic honorific space.
  2.  **Apply the Media Heterogeneity Rule to determine the method.** Statues move easier than street names. Prioritize removal of statues; reserve street renaming for cases where the figure fails the *Core Legacy Threshold* egregiously.
  3.  **Accept the Trade-off.** You cannot preserve the object *and* neutralize its meaning *and* keep it in place. You must choose: **Relocate** (preserves object, neutralizes meaning) or **Replace** (changes meaning, loses object). **Keep and Contextualize** should be ruled out for cases involving dedicated subjugation, as it violates the Endorsement Constraint.

  This framework does not promise peace. It promises consistency. It admits that keeping a monument is an active choice to honor, not a passive choice to remember.
