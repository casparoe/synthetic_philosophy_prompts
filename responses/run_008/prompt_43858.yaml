answer: |-
  This is a sophisticated narrative problem, and your intuition is correct: the "dirtiness" of truth-based manipulation doesn't live in the content of the statements, but in the **architecture of the context**.

  Standard persuasion assumes a cooperative framework: *I want you to understand the world better so you can choose what's good for you.*
  Manipulation assumes an adversarial framework disguised as cooperation: *I want you to understand the world in a specific way so you choose what's good for me.*

  Here is a worked-through case study designed to isolate this mechanism, followed by an analysis of where the moral violation actually resides.

  ### The Case Study: The "Altruistic" Withdrawal

  **The Players:**
  *   **Silas (The Antagonist):** Ambitious, calculating, wants a specific promotion.
  *   **Julian (The Target):** Talented, ethical, deeply devoted to his sick daughter. Also up for the promotion.
  *   **The Stakes:** Only one person can get the promotion. Silas knows if Julian stays in the running, Silas loses. Silas cannot force Julian out; Julian must *choose* to withdraw.

  **The Truths Available:**
  1.  The new role requires 60% travel. (True)
  2.  Julian's daughter has a chronic medical condition requiring stability. (True)
  3.  The last person who took this role divorced within a year due to stress. (True)
  4.  Silas wants the job desperately. (True, but **concealed**)
  5.  Silas is qualified to do the job. (True)

  **The Interaction:**
  Silas invites Julian to lunch. He does not mention the promotion initially. He asks about Julian's daughter. He listens with apparent genuine empathy. Then, the conversation shifts.

  > **Silas:** "I was looking at the requirements for the Senior VP role. Honestly, the travel component is brutal. Sixty percent on the road."
  >
  > **Julian:** "I know. But I think I can make it work. I have to, for the team."
  >
  > **Silas:** "I'm sure you could. You're the most resilient person I know. Most people would crumble. But... I worry about the cost. Remember Sarah from Marketing? She took the London track last year. Divorced by December. She told me she regretted missing her son's treatment windows. I just hate seeing good people burn out because the company doesn't care about their personal lives."
  >
  > **Julian:** (Visibly pales) "Sarah said that?"
  >
  > **Silas:** "She did. Look, I'm not saying you shouldn't apply. You deserve it more than anyone. I'm just saying... if you *did* decide to prioritize your daughter's stability over the title, I'd respect that more than any promotion. It takes a real man to know when to say 'my family comes first.'"

  **The Outcome:**
  Julian goes home. He weighs the truths Silas gave him.
  *   *Fact:* The travel is heavy.
  *   *Fact:* The risk to his marriage/health is real.
  *   *Fact:* His daughter needs him.
  *   *Value:* Family comes first.
  *   *Conclusion:* Withdrawing is the ethical, responsible choice.
  Julian withdraws. Silas applies unopposed and gets the job.

  **The Reader's Experience:**
  The reader knows Silas wants the job (Truth #4). Julian does not. The reader watches Julian reason perfectly logically based on the data provided, while knowing the dataset was curated by a competitor to produce a specific outcome.

  ***

  ### Where the Wrong-Making Feature Lives

  If Silas told no lies, and Julian used his own rationality to decide, why does this feel like a violation? Why does the reader feel a chill of revulsion?

  The manipulation lives in three specific places. You can use these as levers in your writing to ensure the reader feels the "dirtiness."

  #### 1. The Concealed Conflict of Interest (The Violation of Trust)
  This is the heavy lifter. Communication operates on a "Cooperative Principle." We assume that when someone offers us advice, their primary goal is *our* well-being, or at least that they are neutral.
  *   **Persuasion:** "I want this job, but I think you should take it because X." (Open competition).
  *   **Manipulation:** "I am your friend/advisor. I want what is best for you." (Hidden competition).

  Silas presents himself as a *mentor*, but he is actually a *competitor*. By hiding his stake in the outcome, he robs Julian of the ability to weigh Silas's advice correctly. If Julian knew Silas wanted the job, Silas's concern about "travel" would be interpreted as "Silas wants me out of the way." Because Julian doesn't know, he interprets it as "Silas cares about my daughter."
  *   **The Dirty Feeling:** It is the feeling of being used as a tool while being treated like a partner.

  #### 2. Weaponizing the Target's Best Values
  Silas does not exploit Julian's greed, lust, or anger. He exploits Julian's **love for his daughter** and his **integrity**.
  *   If Silas threatened Julian ("Withdraw or I'll fire you"), that is coercion.
  *   If Silas lied ("The job requires 90% travel"), that is deception.
  *   By using the *truth* of Julian's love against him, Silas makes Julian complicit in his own defeat. Julian feels he is doing the *right thing*. This creates a specific kind of horror: the victim walks away feeling guilty for ever considering the promotion, thanking the manipulator for "opening their eyes."
  *   **The Dirty Feeling:** It turns a sacred value (parental love) into a tactical lever. It feels sacrilegious.

  #### 3. Asymmetry of Context (The "Gardener" Effect)
  Silas acts as a gardener pruning a bonsai tree. He doesn't force the branch to bend; he cuts away the other options so the branch *naturally* grows in the direction he wants.
  *   He mentions Sarah's divorce (True) but omits that Sarah *loved* the job and stayed single by choice (True).
  *   He mentions the travel (True) but omits that the travel schedule is flexible for the right candidate (True).
  *   He creates a "local truth" that obscures the "global truth."

  Julian's rationality is intact, but it is operating in a vacuum Silas built. Julian thinks he is navigating the world; actually, he is navigating a model of the world Silas constructed.
  *   **The Dirty Feeling:** The realization of lost autonomy. Julian thinks, "I chose this." The reader knows, "He was herded."

  ### How to Write This for the Reader

  To make sure your readers feel this without you needing to explain it, you need **Dramatic Irony**.

  1.  **Establish the Antagonist's Goal Early:** The reader must know what the Antagonist wants (the job, the throne, the confession) *before* the conversation happens. If the reader doesn't know the Antagonist has a stake in the outcome, it just looks like good advice.
  2.  **Show the Curation:** Don't just show the dialogue. Show the Antagonist *selecting* the truths beforehand.
      *   *Scene:* Antagonist looks at two files. File A: "Target's insecurity about his wife." File B: "Target's ambition." Antagonist puts File B in the drawer and takes File A to the meeting.
      *   *Why:* This shows the reader that the omission was intentional, not accidental.
  3.  **The "After" Beat:** Show the Target feeling *grateful* to the Antagonist.
      *   If Julian gets angry, it's a conflict.
      *   If Julian says, "Thanks, Silas. I don't know what I'd do without you," while Silas smiles and accepts the thanks, the reader will feel the injustice viscerally. The Target is thanking the person who stabbed them for handing them the knife.

  ### Summary for your Revision
  The difference between your antagonist and a persuasive character is **agency**.
  *   A persuasive character tries to convince you that *their* path is the right one.
  *   Your antagonist arranges the room so that *your* path leads exactly where they want, and then lets you walk there yourself.

  The "wrong-making feature" is the **theft of authorship**. The target believes they are the author of their decision, but the antagonist wrote the premises upon which the decision was based. That is the lie that isn't a lie.
