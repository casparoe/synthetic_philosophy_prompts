      *   **Goal:** Make it sharp enough for readers to feel the moral violation without needing philosophical jargon.

  2.  **Deconstruct "Manipulation via Truth":**
      *   If I tell you the truth to help you, that's advice.
      *   If I tell you the truth to hurt you, that's aggression.
      *   If I tell you the truth to make you do *my* bidding while thinking it was *your* idea, that's manipulation.
      *   *Key Distinction:* Persuasion invites scrutiny; manipulation hides the agenda. Even if the facts are true, the *motive* is concealed. The target acts on reasons that are valid but incomplete because the context was curated by the manipulator.
      *   *The "Dirty" Feeling:* It comes from the violation of autonomy. The target thinks they are steering, but the manipulator built the road. It's a violation of the "spirit of cooperation" in communication.

