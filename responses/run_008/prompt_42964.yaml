answer: |-
  **1. The Grenade Case: Obligation vs. Sacrifice**
  Let's go straight to the grenade case. On your view, moral worth is determined strictly by the net good produced. If one soldier in the squad has less to lose—say, he's unmarried with no dependents—while the others have families waiting at home, doesn't your framework entail that he is not just *permitted* to jump on the grenade, but strictly *obligated* to do so? If he hesitates, is he morally failing in the same way a person fails if they keep a wallet they found?

  **Follow-up 1:**
  I expect you'll say that yes, it is an obligation, and our hesitation is just a psychological glitch. But if jumping on the grenade is simply what is *required* of the optimal agent, in what sense is that soldier a "hero"? Doesn't your view collapse the category of heroism into mere compliance? If he's just doing his job, why do we feel a distinct kind of gratitude that we don't feel for a cashier who gives us the correct change?

  **2. The Structure of Supererogation: Praise Without Optionality**
  The standard philosophical picture of supererogation has four parts: the act is optional, it is beyond duty, it is praiseworthy when done, and there is no blame when omitted. You're rejecting the optionality and the "no blame" clause. But are you willing to keep the "praiseworthy" part? Can you consistently praise someone for doing something they *had* to do, or does praise logically imply that they could have legitimately done otherwise?

  **Follow-up 2:**
  You've argued before that the feeling of "extraordinary praise" is just a fact about our psychology, not about duty—that we praise hard things to reinforce behavior. But if the act was morally mandatory, isn't that praise actually misleading? Are we not essentially conditioning people with a reward system for basic compliance, rather than recognizing a distinct moral value?

  **3. The Symmetry Test: The Death of Suberogation**
  Let's look at the mirror image: suberogation. These are acts that are boorish or uncalled-for but not strictly wrong—like making a mildly rude joke at a dinner party that you had every right to attend. If you eliminate supererogation because acts must be ranked by utility, you must also eliminate suberogation. Are you really willing to say that any act which produces slightly less good than the optimal act is not just "sub-optimal," but morally *wrong*?

  **Follow-up 3:**
  I anticipate you'll say that our intuition that rudeness is "allowed" is just another psychological artifact. But if every sub-optimal act is a moral violation, doesn't that make morality impossibly dense? If I choose to read philosophy for pleasure instead of volunteering for an hour, and that hour of volunteering would have produced more utility, am I now a moral transgressor? At what point does your theory stop describing ethics and start describing a tyranny?

  **4. The "Moral Savings Account" Intuition**
  A friend of mine proposed a "moral savings account" intuition: when an agent performs a heroic sacrifice, they build up credit that allows them to later do less than their fair share without blame—essentially, heroism buys you the right to rest. Your view can't make sense of this banking system; on your view, every moment is a new maximization problem. If you can't account for the intuition that heroes *earn* a moral holiday, isn't that evidence that your ranking of acts is missing a crucial variable?

  **Follow-up 4:**
  You'll likely reply that "moral holidays" are just rationalizations for laziness, another psychological trick. But if your theory cannot accommodate the human need for moral rest after extreme exertion, isn't the theory too brittle for human agents? If the "banking intuition" is universal and your theory forbids it, why shouldn't we reject the theory rather than the intuition?

  **5. Blame, Resentment, and the "Ought"**
  If supererogation is a myth, then failing to be a hero is failing to do your duty. This implies that the soldier who *doesn't* jump on the grenade is blameworthy. Are you prepared to say that we are morally justified in resenting ordinary people for not being saints? If "ought implies can," and you say we ought to maximize utility at great personal cost, are you not redefining "ought" until it loses its connection to what agents can reasonably sustain?

  **Follow-up 5:**
  I suspect you'll dismiss the feeling of "unreasonable demand" as, again, a psychological resistance to the truth of utilitarianism. But if your moral theory requires us to treat our deepest psychological commitments—like the distinction between duty and heroism—as errors to be extinguished, isn't that an argument against the theory itself? Why should we accept a morality that treats our moral phenomenology as a hallucination?
