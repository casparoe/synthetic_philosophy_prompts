answer: |-
  # Activity Design: "The Career Ladder Pump"

  This design moves away from the abstract "Bookie" scenario and embeds the money pump in a relatable, high-stakes simulation: **career negotiation.** This leverages *context-dependent preferences* (shifting salience of attributes) to induce intransitivity, rather than relying on pre-existing weird preferences. It forces the diachronic element by separating the "Life Stages" with discussion fillers.

  ### 1. The Stakes: Are Real Money Load-Bearing?
  **Yes.** Do not use fake points.
  Loss aversion is the engine of the money pump. If they lose "points," it's a game score. If they lose $1.50 out of a $5.00 endowment, it is a **loss**. The visceral irritation of handing over cash (or tokens explicitly redeemable for cash at the door) is required to make the "pump" feel like exploitation rather than just arithmetic.
  *   **Recommendation:** Use physical poker chips or printed "Lab Dollars" that are redeemable 1:1 for cash at the exit. You need a cash box at the door. The tactile act of paying the fee is part of the phenomenology of the pump.

  ### 2. Materials
  *   **Endowment:** $5.00 per person in Lab Dollars/Chips.
  *   **Contract Cards:** 3 distinct cards (Job A, Job B, Job C).
  *   **Context Envelopes:** 3 sealed envelopes (Life Stage 1, 2, 3).
  *   **Fee Tokens:** Small distinct chips for "Transaction Fees."
  *   **Binding Contract:** A physical card students can purchase at the start.
  *   **Room:** One table or clustered seating. Projector for instructions (optional, but paper is better for secrecy).

  ### 3. The Setup (The Intransitivity Engine)
  The three jobs are designed so that pairwise comparison shifts based on which attribute is salient.
  *   **Job A:** High Salary ($100k), Long Commute (90m), Low Prestige.
  *   **Job B:** Med Salary ($80k), Short Commute (30m), Med Prestige.
  *   **Job C:** Low Salary ($60k), Med Commute (60m), High Prestige.

  *   **Preference Cycle:**
      *   When **Money** is salient: A > B > C.
      *   When **Time** is salient: B > C > A.
      *   When **Status** is salient: C > A > B.
  *   **The Pump:** We will manipulate salience diachronically to cycle them A → B → C → A, charging a $0.50 fee each switch.

  ### 4. Timeline (90 Minutes)

  **0:00 – 0:10: Introduction & Endowment**
  *   Hand out $5.00 Lab Dollars.
  *   **Script:** "Today we are simulating career decision-making. You will hold a job contract. Your goal is to maximize your utility. At the end, your cash balance is yours to keep. There are no trick questions, but there are transaction costs."
  *   **Crucial Info:** "Over the next hour, there will be **three opportunities** to revise your contract. Each revision incurs a **$0.50 administrative fee**. You may also purchase a **Binding Clause** right now for $0.50. If you buy this, you *cannot* revise your contract later, no matter what."
  *   *Action:* Students choose Initial Job (A, B, or C) and decide whether to buy the Binding Clause. Collect fees immediately.
  *   *Facilitator Note:* Most will not buy the Binding Clause. They are now "Naive."

  **0:10 – 0:25: Life Stage 1 (The "Debt" Frame)**
  *   **Distractor:** Briefly discuss "Student Debt and Early Career" generally (5 mins).
  *   **Reveal Envelope 1:** "You have just graduated. You have significant loans. Liquidity is your primary constraint." (Salience: **Money**).
  *   **Trade Offer:** "You currently hold [Job X]. We have a new opening [Job Y] that better aligns with your *financial liquidity needs*."
      *   If they hold A: Offer B (Frame: "Slightly less money, but better work-life balance?" No, wait. If Money is salient, A is best. We need to move them *off* their current choice.)
      *   *Correction on Mechanics:* To pump them, we must start them on a sub-optimal choice for the *current* frame, or shift the frame so their current choice becomes sub-optimal.
      *   *Revised Start:* Everyone starts with **Job A** (assigned or heavily nudged).
      *   *Why?* If they choose freely, some pick B. To ensure the pump, **assign Job A to everyone** as the "Default Offer."
      *   *Revised Script:* "Due to market conditions, everyone starts with Contract A."
  *   **Trade 1:** Frame: "You need cash." (Wait, A is high cash).
      *   *Okay, let's reverse the cycle to match the frame.*
      *   Start: **Job C** (Low Salary, High Prestige).
      *   Frame 1 (Money): "You are broke." -> Offer Swap to **Job B** (Med Salary). Fee $0.50. (Rational in moment).
      *   Frame 2 (Time): "You bought a house far away." -> Offer Swap to **Job A** (High Salary, Long Commute? No).
      *   *Let's simplify the Cycle:*
          1.  **Start: Job B** (Balanced).
          2.  **Frame 1 (Ambition/Status):** "You want to make a name." -> Swap to **Job C** (High Prestige). Fee $0.50.
          3.  **Frame 2 (Burnout/Time):** "You are tired of the grind." -> Swap to **Job A** (High Salary, but wait, A needs to be worse than C on prestige).
          *   *Let's use the classic Money/Comfort/Status triangle.*
          *   **Job 1:** High Pay, Low Comfort.
          *   **Job 2:** High Comfort, Low Status.
          *   **Job 3:** High Status, Low Pay.
          *   **Start:** Job 1.
          *   **Round 1 (Comfort Salient):** "You value your weekends." Swap 1 -> 2. (Pay $0.50).
          *   **Round 2 (Status Salient):** "You are at a networking gala." Swap 2 -> 3. (Pay $0.50).
          *   **Round 3 (Money Salient):** "Rent is due." Swap 3 -> 1. (Pay $0.50).
  *   **Action:** Students decide to trade or hold. Collect fees.
  *   **Filler (10 mins):** Discuss "Rational Expectations" generally. Do not mention the game.

  **0:25 – 0:40: Life Stage 2 (The "Burnout" Frame)**
  *   **Reveal Envelope 2:** "Five years later. You are experiencing burnout. Commute and hours matter most." (Salience: **Comfort**).
  *   **Trade Offer:** "We can move you to a role with better work-life balance." (Moves them from Status -> Comfort or Money -> Comfort).
  *   **Action:** Trade decision. Collect fees.
  *   **Filler (10 mins):** Discussion on "Commitment Devices."

  **0:40 – 0:55: Life Stage 3 (The "Legacy" Frame)**
  *   **Reveal Envelope 3:** "Ten years later. You are looking at your legacy. Impact matters most." (Salience: **Status**).
  *   **Trade Offer:** "A role with high visibility."
  *   **Action:** Trade decision. Collect fees.
  *   **Filler (10 mins):** General wrap up of simulation.

  **0:55 – 1:10: The Reveal & Count**
  *   Ask students to count their remaining Lab Dollars.
  *   Ask: "Who ended up with the same Job they started with?" (Many will have).
  *   Ask: "Who paid more than $1.00 in fees?"
  *   **The Kicker:** "If you started with Job 1 and ended with Job 1, but paid $1.50 in fees, you have been money-pumped."

  **1:10 – 1:30: Debrief**
  *   Map the experience to the theory (see below).

  ### 5. Facilitator Script: What to Say (and Not Say)
  *   **DO SAY:** "This is a simulation of real-world friction. Transaction costs exist. Preferences change."
  *   **DO SAY:** "You are free to trade or hold at every stage. There is no penalty for holding."
  *   **DO NOT SAY:** "Try to keep your money." (This cues them to hoard, preventing the pump).
  *   **DO NOT SAY:** "Your preferences might be inconsistent." (This cues them to check for transitivity).
  *   **DO NOT SAY:** "This is about money pumps." (Obvious).
  *   **Key Phrase:** "Make the choice that is best for you *in this specific life stage*." This legitimizes the context-shift, which is the engine of the intransitivity.

  ### 6. Debrief: Mapping the Moments
  1.  **The Naive Agent:** The student who traded at every stage. They maximized utility *locally* (in that moment's frame) but lost globally. They assumed their future self would not trade back, or that the trade was "worth it" without accounting for the cycle.
  2.  **The Sophisticated Agent:** The student who bought the **Binding Clause** at the start. They anticipated that their future preferences would shift in a way that would exploit them. They paid a premium ($0.50) for **diachronic consistency**.
  3.  **The Resolute Agent:** (If any) The student who *didn't* buy the clause but refused to trade anyway, simply by force of will. Discuss: Is this rational? Or just luck? If they hadn't known the trap, would they have held?
  4.  **The "Rational" Defense:** Students will argue, "But my preferences *did* change! In Stage 1 I valued Comfort, in Stage 2 Status."
      *   **Counter:** "Did your *fundamental* values change, or did the *framing* change? If a bookie can toggle your framing to drain your wallet, is the bookie magic, or is your rationality fragile?"

  ### 7. Limitations (What You Must Supply)
  *   **The Infinite Pump:** This game is finite (3 rounds). A true money pump argument relies on the *threat* of infinite exploitation to prove inconsistency. You must explain: "In the real world, this cycle can repeat indefinitely (marketing, upgrades, policy shifts). The fact that you lost money in 3 rounds shows you *would* lose infinite money in an infinite game."
  *   **Preference Stability:** The game relies on *induced* preference shifts (framing). Philosophers argue this isn't "irrationality" but "context-sensitivity." You must press: "If context-sensitivity makes you exploitable, is it rational?"
  *   **The Bookie:** In the game, *you* are the bookie. In reality, there is no single bookie. The "market" acts as the pump.

  ### 8. Prediction: What Will Go Wrong
  **Prediction 1: The "Gamer" Response.**
  *   *What happens:* 3-4 students (likely the ones who've read Elster or Ariely) will spot the cycle by Round 2. They will stop trading to "beat" you, or they will trade excessively to prove a point.
  *   *Is this a dealbreaker?* **No.**
  *   *Why:* This is actually a **feature**. In the debrief, ask them: "You spotted the trap. Why did it feel hard not to trade?" or "You didn't trade. Did you feel like you were missing out on an improvement?" This highlights the **tension** between local rationality (the trade looks good) and global rationality (the cycle is bad). The *urge* to trade is the data point, not just the trade itself.

  **Prediction 2: Transitive Preferences.**
  *   *What happens:* Half the group genuinely prefers Job A > B > C regardless of framing. They never trade. The room is quiet.
  *   *Is this a dealbreaker?* **Yes, if you frame it as 'proving' irrationality.**
  *   *Fix:* Frame it as **"Stress Testing Rationality."** In the debrief, say: "For those who didn't trade, you have robust preferences. Congratulations. But notice how much cognitive effort it took to resist the framing? The money pump argument isn't that everyone *will* be pumped, but that *nothing prevents* you from being pumped except the stability of your own will."
  *   *My Position:* **Run it even if half don't trade.** The activity is not a magic trick that *forces* them to lose money. It is a **phenomenological demonstration** of the *temptation* of diachronic inconsistency. The students who *didn't* get pumped still felt the pull of the "Upgrade." That pull is what the theory describes. If you promise "I will make you lose money," you will fail. If you promise "I will show you where the vulnerability lives," you will succeed.

  **Prediction 3: The Binding Clause is ignored.**
  *   *What happens:* No one buys the $0.50 clause.
  *   *Why:* $0.50 feels like a loss now for a hypothetical future gain.
  *   *Debrief Value:* This proves **Naivety**. They believe their future self will be rational. When they lose money later, the regret is palpable. This is the strongest teaching moment for **Sophisticated Choice**.

  ### Final Recommendation on Stakes
  Do not skimp on the $5. If budget is tight, make it $3. But make it **cash-equivalent**. If you use a spreadsheet tally, the "pain" is abstract. If they have to physically hand you a chip, the "sunk cost" of the fee feels real. The friction of the handover is part of the lesson.

  **Verdict:** Run the "Career Ladder" with physical tokens. Expect half the room to spot the trick. Use their resistance to teach the difference between *knowing* the theory and *feeling* the incentive. That gap is where the philosophy lives.
