answer: |-
  This is a great catch. Your intuition is spot-on: your friend gave a solid "elevator pitch" version of Goodhart's Law that captures the spirit but conflates the history, the mechanisms, and the implications. For a five-minute impromptu talk, it's actually quite good, but for a rationality meetup where precision matters, the nuances you're sensing are critical.

  Here is a bit-by-bit breakdown of what is accurate, what is a conflation, and where the defensible point ends and the nihilistic overshoot begins.

  ### 1. The History and Original Phrasing
  **Friend's Claim:** *"Goodhart was a Bank of England economist... Generalized: any measure that becomes a target ceases to be a good measure."*

  *   **Accurate:** Charles Goodhart was indeed a Bank of England economist (and later a professor at LSE).
  *   **Conflation:** The pithy phrasing *"Any measure that becomes a target ceases to be a good measure"* is **not** Goodhart's original wording. That is a paraphrase by anthropologist **Marilyn Strathern** (1997).
  *   **Original Context:** Goodhart's original 1975 statement was more specific: *"Any observed statistical regularity will tend to collapse once pressure is placed upon it for control purposes."*
  *   **Why it matters:** Goodhart's original formulation was about **control systems and econometrics**, not necessarily about human malice. Strathern's paraphrase shifted the focus toward social science and bureaucracy. Your friend is quoting Strathern while attributing it to Goodhart. This is common, but worth noting.

  ### 2. The Mechanism (Gaming vs. Structural Breakdown)
  **Friend's Claim:** *"The mechanism is that people game the metric — teachers teach to the test, hospitals admit the easy patients..."*

  *   **Accurate:** This is a real mechanism. In the LessWrong/alignment community (specifically the taxonomy by Scott Garrabrant and Daniel Manheim), this is called **Adversarial Goodhart**. It happens when an agent actively optimizes against the proxy.
  *   **Oversimplification:** Your vague memory is correct: **Gaming is not the only mechanism.** In fact, in many high-stakes forecasting or AI contexts, no one is "gaming" anything; the metric still fails.
  *   **The Missing Mechanisms:**
      1.  **Regressive Goodhart:** The correlation is statistical noise. When you select for extreme values of the proxy, you select for noise, and the correlation with the goal vanishes (regression to the mean). No scheming required.
      2.  **Causal Goodhart:** The proxy is correlated with the goal, but not causal. Optimizing the proxy doesn't move the goal (e.g., taking a thermometer out of the fridge to "lower" the temperature reading).
      3.  **Extremal Goodhart:** The correlation holds in the normal range, but breaks down in extreme tails. (e.g., running is good for health, but running 100 miles a day destroys your knees).
  *   **Verdict:** Your friend reduced a structural problem of optimization to a problem of human dishonesty. This is the biggest conceptual gap in his summary.

  ### 3. The Historical Example
  **Friend's Claim:** *"...the moment the government started targeting the money supply in the early 80s, the stable relationship between money growth and inflation fell apart..."*

  *   **Accurate:** This is the canonical example. The UK (and US under Volcker) attempted monetarism. Once the Bank of England started targeting £M3 (broad money), the velocity of money became unstable, and the correlation between money supply growth and inflation broke down.
  *   **Nuance:** It wasn't just that bankers "gamed" it in a fraudulent sense. Financial institutions innovated new types of accounts to get around reserve requirements (Adversarial), but the underlying economic relationship also shifted because the *act* of targeting changed expectations and behavior in the market (Lucas Critique overlap). It validates the law, but again, it's a mix of gaming and structural change.

  ### 4. The Nihilistic Conclusion
  **Friend's Claim:** *"Which is why we can basically never have good metrics at all... numbers are only trustworthy as long as nobody's acting on them."*

  *   **Defensible Point:** Metrics *degrade* in value when optimized. You cannot treat a metric as a perfect substitute for the goal once optimization pressure is applied.
  *   **The Overshoot:** The claim that we can *"never have good metrics"* and that they are *"only trustworthy as long as nobody's acting on them"* is **false and dangerous.**
      *   **Metrics are still signals:** Even under optimization, a metric often retains *some* correlation. It just becomes noisier. A test score still correlates with knowledge, even if students teach to the test; it just correlates *less* than before.
      *   **Mitigation is possible:** We can use **composite metrics** (making it harder to game all of them), **randomized audits**, or **keep the metric secret** (though this has transparency costs).
      *   **Action is the point:** The purpose of measurement is usually to inform action. If numbers are only trustworthy when nobody acts on them, measurement is useless. The rationalist takeaway is not "don't measure," it's "measure with awareness of the failure modes."
  *   **Verdict:** This is **Goodhart Nihilism**. It takes a warning label and treats it as a prohibition sign.

  ### Summary: Where the Line is Drawn

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **Goodhart was a BoE economist** | ✅ Accurate | |
  | **Monetarism example** | ✅ Accurate | Classic case study. |
  | **"Measure becomes target..."** | ⚠️ Paraphrase | Attributed to Strathern, not Goodhart. |
  | **Mechanism = People Gaming** | ❌ Conflation | Ignores Regressive, Causal, and Extremal types. |
  | **Conclusion = No good metrics** | ❌ Overshoot | Metrics degrade, they don't vanish. Mitigation exists. |

  ### How to Bring This Up at the Meetup

  Since you want to avoid correcting his errors by making opposite ones (e.g., claiming metrics are perfectly reliable), frame it as **expanding the model** rather than fixing a mistake.

  **Suggested Script:**
  > "I was thinking about your summary of Goodhart's Law, and the monetarism example really stuck with me. I looked into it a bit more, and I found a distinction that might be useful for us as forecasters.
  >
  > It seems like the version you described is specifically **Adversarial Goodhart**, where agents game the system. But there's a taxonomy from the alignment community (Manheim & Garrabrant) that splits this into four types. Some versions, like **Regressive Goodhart**, happen even without anyone scheming—it's just statistical noise when you go to the extremes.
  >
  > I think your point that 'metrics degrade under pressure' is totally right, but I'm not sure we have to go full nihilist and say 'numbers are only trustworthy if nobody acts on them.' If we know *which* type of Goodhart effect we're facing, we can sometimes design around it—like using composite metrics or randomization. Do you think there are cases where we can keep a metric robust even under optimization?"

  **Why this works:**
  1.  **Validates:** You affirm his core point (metrics degrade).
  2.  **Educates:** You introduce the LessWrong taxonomy he might have missed.
  3.  **Invites:** You turn the "nihilism" into a problem-solving question about robustness.

  This keeps the spirit of his talk (be wary of metrics) while correcting the fatalism (we can still use metrics wisely).
