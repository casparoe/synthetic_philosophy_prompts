answer: |-
  **Exam Question**

  In the town of Fennwick, decades of litigation over the vague term "affordable" ended when the town stipulated a sharp boundary: rent at most thirty percent of regional median income. Immediately, a judge claimed the vote merely discovered a pre-existing cutoff, while a councilwoman insisted the boundary was created, not found. Meanwhile, ordinary speakers continue using borderline language ("barely affordable," "borderline-ish"), and a new dispute arises over whether the median income figure is precise enough to apply the rule.

  Write an essay arguing which leading theory of vagueness—epistemicism or supervaluationism—better accounts for the Fennwick case. You must address three stubborn facts: (1) the stipulation seemed possible; (2) the stipulation seemed inconclusive, as vague talk survived it; and (3) borderline cases immediately re-emerged at the new boundary regarding measurement precision.

  Specifically, analyze whether the epistemicist can maintain the judge's view that the vote revealed a cutoff, or must concede the councilwoman is right that meaning changed. Explain whether the supervaluationist's picture of stipulation as selecting among admissible precisifications fits the councilwoman's remark, and what it costs to claim "there is a sharp cutoff" is true while no particular cutoff statement is. Finally, diagnose the surviving "-ish" talk and boundary regress as fresh first-order vagueness, higher-order vagueness, or something else, detailing the consequences for each theory. Commit to one theory as superior; do not merely survey options. Your argument must stand on its own reasoning without external citations.

  ***

  **Model Answer**

  Supervaluationism provides the superior account of the Fennwick case because it uniquely accommodates the intuition that the boundary was created rather than discovered, while preserving the truth of claims about the existence of a cutoff without committing to specific boundary locations. Epistemicism fails because it cannot reconcile the judge's discovery claim with the obvious semantic shift involved in stipulation, nor can it adequately explain the persistence of vague talk without positing an infinite regress of unknowable facts.

  For the supervaluationist, vague terms suffer from semantic indecision; they are compatible with multiple precise extensions. The town's vote was not an empirical discovery but a semantic decision to select one admissible precisification from the range of acceptable options. This validates the councilwoman's remark: the boundary was created by ruling out previously admissible precisifications that placed the cutoff elsewhere. The epistemicist, conversely, must insist the sharp boundary existed all along, unknown to speakers. This forces the epistemicist to declare the judge correct and the councilwoman mistaken about the nature of the vote. However, this clashes with the linguistic reality that the stipulation changed the rules of usage. If the boundary was always exactly 30.0 percent, prior usage was systematically error-prone in a way that stipulation corrects. But stipulation usually fixes meaning for the future, not corrects past error. The supervaluationist captures this forward-looking creative aspect naturally, treating the vote as a legitimate resolution of indecision rather than a correction of ignorance.

  Regarding the second fact, supervaluationism handles the truth of "there is a sharp cutoff" via supertruth. A sentence is supertrue if it is true on all admissible precisifications. Once the town stipulates the rule, every admissible precisification consistent with the new law places the cutoff at 30 percent. Thus, "there is a cutoff" is supertrue. However, because the stipulation relies on "median income," which may itself be vague, no specific dollar amount is fixed across all precisifications. The cost here is accepting truth without a specific truth-maker, but this is preferable to the epistemicist's cost: positing unknowable facts about income thresholds that existed prior to legal intervention. The supervaluationist explains why the sentence is true without requiring a specific number to be known or fixed immediately, matching the legal reality where the rule stands even if accounting disputes persist.

  The third fact concerns the survival of "-ish" talk and the regress on measurement precision. This is best diagnosed as higher-order vagueness or new semantic indecision. The term "median income" is itself vague. The stipulation removed vagueness from "affordable" relative to income, but transferred it to "income." The supervaluationist sees this as a new layer of semantic indecision. The epistemicist must claim there is a fact of the matter about the precise median income, unknown to us. This leads to an infinite regress of unknowable boundaries. The supervaluationist blocks this by allowing that some terms remain undecided. The surviving "-ish" talk indicates speakers recognize that the precisification is not fully complete regarding the input variables. They are acknowledging that while the rule is sharp, the input remains semantically indecisive.

  Epistemicism ultimately fails because it treats all vagueness as ignorance. In Fennwick, the vagueness was resolved by fiat, not investigation. The epistemicist must treat the vote as either irrelevant (the boundary was already there) or meaning-changing (the term is now different). If irrelevant, the judge is right, but the litigation was pointless. If meaning-changing, the judge is wrong. Supervaluationism avoids this dilemma by treating the vote as a legitimate resolution of semantic indecision. It explains why the cutoff exists (supertruth) without committing to a specific number where none was agreed upon (due to income vagueness). Therefore, supervaluationism offers the more coherent explanation of legal stipulation and linguistic practice.

  ***

  **Marking Scheme**

  **Total Points: 20**

  **1. Theory Commitment (4 points)**
  The student must explicitly argue for either epistemicism or supervaluationism as the superior theory for this case, avoiding neutral surveying.
  *Typical Error:* Hedging the bet by concluding that both theories have equal merit or refusing to choose a winner.

  **2. Analysis of Stipulation (4 points)**
  The answer must explain how the chosen theory accounts for the judge's "discovery" claim versus the councilwoman's "creation" claim, linking this to semantic indecision or ignorance.
  *Typical Error:* Describing the stipulation process without connecting it to the core metaphysical dispute about whether boundaries exist pre-vote.

  **3. Analysis of Supertruth/Truth-Makers (4 points)**
  The student must address the cost of claiming "there is a sharp cutoff" is true while no specific cutoff statement is true, explaining the mechanism (e.g., supertruth vs. unknowable fact).
  *Typical Error:* Asserting the statement is true without explaining how it can be true if no specific boundary location is identified.

  **4. Diagnosis of Regress and "-ish" Talk (4 points)**
  The answer must diagnose the surviving vague talk and measurement dispute as either higher-order vagueness, new first-order vagueness, or semantic indecision, and explain the consequence for the theory.
  *Typical Error:* Dismissing the regress as irrelevant or failing to distinguish between vagueness in the rule versus vagueness in the measurement input.

  **5. Critique of Opposing Theory (4 points)**
  The student must identify a specific failure in the losing theory's account of the Fennwick case, such as the epistemicist's inability to explain creation or the supervaluationist's truth-maker gap.
  *Typical Error:* Caricaturing the opposing view or critiquing it on general grounds unrelated to the specific facts of the Fennwick case.

  **Differentiator for A vs. B Answers**
  The key distinction lies in the handling of the boundary regress. A B-level answer will identify the regress as a problem but treat it generically. An A-level answer will nuance the diagnosis, distinguishing between vagueness in the legal term "affordable" (resolved by stipulation) and vagueness in the empirical term "median income" (unresolved), explaining how this specific split validates the chosen theory's handling of higher-order vagueness or semantic indecision better than the opponent's account of ignorance.
