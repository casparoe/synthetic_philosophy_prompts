      *   *Reviews:* 2,000 people aggregate 2,000 private experiences.
      *   *Postgres:* Thousands of companies aggregate millions of hours of maintenance data.
  *   **Amplified Oscillator (Dumb):**
      *   *Meme Stock:* Everyone is reacting to the same public price chart. No new info, just feedback loops.
      *   *March 2020:* Everyone is reacting to the same TV headlines. Emotional contagion.
      *   *Apartment/Trendy Framework:* Everyone is reacting to the same public announcement/hype cycle.

