  ### Part 5: The Killer Case (The Falsification Test)
  To split his **Sensor Rule** from his **Risk Rule**, spring this scenario on him at the retro:

  **The Case:**
  > "You're deploying code on a Friday. The automated tests pass (Data). The industry standard is to deploy (Crowd/Postgres logic). But one Senior Engineer says, 'I found a race condition that only happens under load. Don't deploy.' The rest of the team says, 'Tests passed, let's go home.'
  >
  > **Do you deploy with the crowd, or hold with the Senior?**"

  **Why this splits the rules:**
  1.  **If he follows the Sensor Rule (Taco/Sprinting):** He should **Hold**. The Senior has *private information* (the race condition) that the crowd (tests/team) lacks. This is the Taco Line logic (they know something you don't).
  2.  **If he follows the Risk Rule (Postgres/Reviews):** He should **Deploy**. The "Industry Standard" is to trust automated tests and team consensus. Going with the Senior is "Niche DB" behavior (optimizing for a specific case against the aggregate).
  3.  **If he follows the "Nobody Gets Fired" Rule:** He should **Deploy**. If the Senior is wrong, you delayed release. If the Senior is right and you deployed, *everyone* deployed, so no one is individually to blame.

  **The Trap:**
  If he says **Hold** (Side with Senior), he admits that **Private Expert Info > Crowd Consensus**. This contradicts his **Postgres** ruling (where he chose Crowd > Benchmark/Expert) and his **Reviews** ruling (where he chose 2,000 reviews > 1 negative review).
  If he says **Deploy** (Side with Team), he admits that **Consensus > Private Warning**. This contradicts his **Sprinting** ruling (where he followed 2 people over the stationary crowd) and makes him look reckless on a Friday deploy.

  **Bonus Twist:**
  Tell him: *"If you side with the Senior, you're treating him like the Taco Line (private info). If you side with the Team, you're treating him like the 1-Star Review (noise). But in the Sprinting case, you followed two strangers over the stationary crowd. Why are two strangers more credible than one Senior Engineer with skin in the game?"*

  Watch him try to reconcile "Two Strangers" with "One Senior." That's where the sheep logic gets sheared.
