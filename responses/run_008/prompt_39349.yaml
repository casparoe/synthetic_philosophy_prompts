      *   **Addressing Causation (The "What kills?" question):**
          *   The legal/ethical standard *does* rely on the idea that the underlying pathology causes death in withdrawal cases, not the doctor.
          *   *Counterfactual Analysis:* If I don't start the vent, you die of the disease. If I stop the vent, you die of the disease (because the vent was artificially holding it back).
          *   *The "Plug Pulling" Problem:* The user is right that pulling a plug is a bodily movement. How is this reconciled? It's reclassified legally as an *omission to continue treatment*. The physical act is subsumed under the normative category of "stopping intervention."
          *   *Principled vs. Fiction:* It's arguably a "normative fiction" rather than a strict metaphysical causation theory. Metaphysically, removing a barrier causes the event. Normatively, we treat it as allowing nature to take its course.

      *   **The "Default Course of Events" (Normative Baselines):**
          *   Confirm the user's suspicion: The line tracks a "baseline" of normal physiology vs. medical intervention.
          *   Reference the *Vacco v. Quill* Supreme Court ruling. They explicitly upheld this distinction, rejecting the argument that withdrawing care is the same as assisted suicide.
          *   The "status quo ante": Withholding = never changing the baseline. Withdrawing = returning to the baseline. Active Euthanasia = changing the baseline to a new cause of death (toxicity, etc.).

      *   **The Bystander vs. Doctor Distinction (Duty of Care):**
          *   This is crucial. Causation isn't the only factor; *duty* is.
          *   General public: No duty to rescue -> Omission isn't actionable.
          *   Doctors: Established physician-patient relationship -> Duty to treat -> Omission *is* actionable (malpractice).
          *   Does this require a consistent theory of omission? No. It relies on *normative status*, not just causal mechanics. The causation is secondary to the duty.
