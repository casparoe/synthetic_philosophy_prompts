prompt: |-
  Something I've been puzzling over: in end-of-life care, standard US medical ethics (and the policies at most hospitals) lets a doctor withhold a treatment that hasn't been started, and even withdraw a ventilator that's already running, if that's what the patient wants — but administering a drug dose that foreseeably ends the patient's life counts as killing, and isn't allowed even with consent. The doctor acts, foresees the death, and intends it in some sense in all these cases, and the patient dies in all of them, so what theory of causation is doing the work here? Does the practice presuppose that omissions (or withdrawn interventions) don't cause the death — that the disease kills, and the doctor merely declines to interrupt — and can that view even survive the fact that pulling the ventilator plug is a positive physical action while never starting treatment wasn't? It seems like the line between "killing" and "letting die" tracks something like a default course of events, the disease as the background against which the doctor either intervenes or doesn't, rather than the presence or absence of bodily movement. Is that a principled notion of causation or just a convenient fiction we've agreed on? Relatedly, a bystander who watches a stranger drown is normally not treated as having caused the death, but a doctor who fails to treat is liable for malpractice as if they'd caused it — so does the withholding/withdrawing practice actually require one consistent theory of causation by omission, or could several different theories of omission all license it? Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Puzzle:** The distinction in US medical ethics/law between withholding/withdrawing life-sustaining treatment (allowed) and active euthanasia/assisted suicide (forbidden), despite similar outcomes (death) and mental states (foreseeability/intent).
      *   **Specific Questions:**
          1.  What theory of causation is doing the work here?
          2.  Does the practice presuppose omissions/withdrawals don't cause death (disease does)?
          3.  Can that view survive the fact that pulling a plug is a *positive physical action*?
          4.  Is the line between "killing" and "letting die" based on a "default course of events" rather than bodily movement?
          5.  Is this a principled notion of causation or a convenient fiction?
          6.  Does the bystander vs. doctor liability distinction require a consistent theory of causation by omission, or can multiple theories license the practice?
      *   **Constraint:** Answer in American English.

  2.  **Initial Analysis & Philosophical/Legal Context:**

      *   This is a classic problem in bioethics, often discussed under the "Acts vs. Omissions Doctrine" and the "Doctrine of Double Effect" (though the user focuses more on causation).
      *   Key legal case: *Cruzan v. Director, Missouri Department of Health* (1990), *Vacco v. Quill* (1997).
      *   Key philosophical concepts: Causation by omission, counterfactual dependence, normative expectations, the "doing/allowing" distinction.
      *   The user is sharp; they recognize the physical symmetry between pulling a plug (action) and not intubating (omission) but note the ethical asymmetry. They also spot the tension between general tort law (no duty to rescue) and medical malpractice (duty to treat).

  3.  **Drafting the Response - Section by Section:**

