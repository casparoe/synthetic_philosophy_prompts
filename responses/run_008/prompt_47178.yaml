      *   *Check:* Make sure I don't sound like I'm arguing *against* HI, but rather outlining the conditions under which it fails.
      *   *Check:* Ensure the "Verdict" line is exactly one sentence.

  11. **Final Polish:** Ensure the distinction between "pain" (nociception) and "suffering" (phenomenal aversiveness) is clear in the gradients section. This is the crux of Pearce's argument.

