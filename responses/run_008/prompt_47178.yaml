      *   *Failure Condition:* If "identity" or "species integrity" has moral weight, HI is violent. If paternalism is unjustifiable even for beings who can't consent (analogous to severe cognitive disability or infants), HI is problematic.
      *   *Pearce's Defense:* The "consent of the non-existent" (future beings won't suffer). The "consent of the victim" (prey would consent).
      *   *Verdict on this:* Awkward but manageable for a committed abolitionist. They bite the bullet: suffering is worse than loss of "wildness."

  6.  **Address Specific Point 4: Unfalsifiability (Empirical Checks):**
      *   *Claim:* Tech will solve it.
      *   *Stress Test:* What if the brain *is* the problem? What if homeostasis makes permanent bliss impossible?
      *   *Failure Condition:* Discovery that hedonic set-points are hard-wired by thermodynamic constraints of intelligence. Discovery that consciousness *requires* contrast (dualism of pain/pleasure).
      *   *Verdict on this:* Crucial for scientific credibility. If hedonic treadmill is law-like, HI is utopian.

