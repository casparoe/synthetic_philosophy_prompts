      *   *Failure Condition:* If value is pluralistic and incommensurable (e.g., Nozick's Experience Machine), HI might violate other core values. However, Pearce argues other values are instrumental to well-being.
      *   *Verdict on this:* Not fatal, but limits the *audience*. It's an axiological commitment, not a factual error. If the user isn't a utilitarian, they need to justify why suffering trumps autonomy.

  5.  **Address Specific Point 3: Consent (Nonhuman Animals):**
      *   *Claim:* We should rewire wild animals to stop predation/suffering.
