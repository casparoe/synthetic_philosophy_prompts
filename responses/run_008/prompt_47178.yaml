      *   *Stress Test:* Is pain *essentially* aversive? If you remove the "ouch," do you remove the motivation to avoid?
      *   *Failure Condition:* If phenomenal consciousness is *intrinsically* motivational (internalism about reasons), then you can't have "information-sensitive gradients" without the valence. If the "badness" of pain *is* the signal, removing the badness removes the signal's urgency.
      *   *Neuroscience:* Opioid analogues exist (pain asymbolia), but they often lead to injury because the *care* factor is gone. Can we engineer "care" without "suffering"?
      *   *Verdict on this:* This is a heavy load-bearer. If consciousness and motivation are tightly coupled in a way biotech can't untangle, HI fails.

  4.  **Address Specific Point 2: Utilitarianism vs. Value Pluralism:**
      *   *Claim:* HI is often seen as negative utilitarian (NU).
      *   *Stress Test:* Does HI require *only* suffering matters?
