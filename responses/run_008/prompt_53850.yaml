answer: |-
  (a) The Question

  Parfit argues that because identity must be a one-one relation, fission shows identity is not what matters. However, some propose that two persons co-located in the pre-fission body, preserving one-one identity for each successor. Critically evaluate this 'Multiple Occupancy' response. First, reconstruct the argument for why identity logic demands a one-one relation rather than assuming it. Second, explain what this view saves regarding identity, but detail its cost regarding counting persons before fission. Third, assess whether this view rescues identity in the *non-branching* teletransporter case where the original is destroyed. Finally, argue whether the dispute between Parfit and the Multiple Occupancy theorist is substantive or merely verbal: does adopting one view over the other change what we should care about, fear, or anticipate? Do not summarize Parfit's fission case; assume it is known.

  (b) Model Answer

  The requirement that identity be one-one stems from the logic of transitivity and symmetry. If Person A is identical to Person B, and Person A is identical to Person C, then B must be identical to C. In fission, the Left and Right successors are distinct people occupying different spaces. If the Pre-Fission Person were identical to both, transitivity would force the Left and Right successors to be identical to each other, which is empirically false. Thus, standard identity logic collapses under branching.

  The Multiple Occupancy view (MO) escapes this by positing that two distinct persons shared the pre-fission body all along. When fission occurs, they merely separate. This preserves the one-one relation: Pre-Left is identical to Left, and Pre-Right is identical to Right. Identity is saved. However, the cost is metaphysical extravagance and counting problems. Before the machine activates, there are numerically two people where common sense sees one. This creates an epistemic nightmare: when I deliberate, which of the two co-located persons is thinking? It violates parsimony and clashes with our phenomenological sense of singular agency.

  Crucially, MO fails to rescue identity in the non-branching teletransporter case where the original is destroyed. Parfit's objection there rests on bodily destruction, not logical contradiction. MO solves the *logic* of branching, but it does not reanimate a destroyed organism. If the scanner destroys the input body, the co-located persons (on most physicalist accounts) cease to exist. Even if MO claims psychological continuity persists, it cannot claim *identity* across destruction without abandoning the bodily constraint that usually grounds the "two people" hypothesis. Thus, MO is a localized fix for fission logic, not a general theory of survival.

  Ultimately, the dispute is merely verbal. Parfit and the MO theorist agree on all practical recommendations: anticipatory concern should track psychological continuity, not strict identity. Whether I say "I will become two" (Parfit) or "We were always two and now separate" (MO), my rational attitude toward the future remains identical. I should care about both successors equally; I should not fear death if psychological continuity persists. The metaphysics of counting persons before fission has no cash value in ethics or decision theory. Parfit's reductionist conclusion stands: identity is not what matters. The MO view merely shuffles the linguistic labels attached to the underlying psychological facts without altering the normative landscape. To treat it as substantive is to mistake a map for the territory.

  (c) Marking Scheme (25 Marks Total)

  1.  **Reconstruction of One-One Constraint (5 marks)**
      *   *Must Hit:* Explicitly invokes transitivity/symmetry of identity to show why A=B and A=C implies B=C, creating contradiction in fission.
      *   *B-Answer Failure:* Merely states "identity must be one-one" as a brute fact or Parfitian dogma without showing the logical derivation.

  2.  **Multiple Occupancy Mechanics & Counting Cost (5 marks)**
      *   *Must Hit:* Explains that MO posits two distinct persons pre-fission to preserve identity, but identifies the cost (counterintuitive counting/epistemic confusion about "who is thinking").
      *   *B-Answer Failure:* Describes MO correctly but fails to articulate the metaphysical/epistemic cost, treating it as a free lunch.

  3.  **Application to Non-Branching Case (5 marks)**
      *   *Must Hit:* Recognizes MO solves logical branching but fails against bodily destruction in the non-branching case; distinguishes the two problems.
      *   *B-Answer Failure:* Conflates the fission case with the destruction case, arguing MO solves both or neither without distinction.

  4.  **Substantive vs. Verbal Verdict (5 marks)**
      *   *Must Hit:* Takes a clear stand (typically verbal) justified by the claim that practical concern/care remains unchanged regardless of the metaphysical label.
      *   *B-Answer Failure:* Claims the dispute is substantive because "metaphysics is real" without addressing the practical/normative implications (what matters).

  5.  **Argumentative Coherence & Position (5 marks)**
      *   *Must Hit:* Essay flows logically from logic → MO → limitations → practical conclusion; takes a definitive stance rather than hedging.
      *   *B-Answer Failure:* Structure is disjointed (e.g., answers parts in isolation) or refuses to take a stand on the verbal/substantive question.
