prompt: |-
  I do the modelling for a small forecasting outfit -- think sports and gaming risk mostly, but analysts also advise clients on stuff like when to hedge. The recurring headache: our people basically never get clean evidence. What they get is "satellite imagery suggests the shipment left port, we'd put that at about 65%" or "the source is right more often than wrong but he's had a rough week." Ordinary Bayesian conditioning assumes you learn an event with certainty, and my analysts are not learning events with certainty, ever. Before I let anyone hardcode an update rule into our tooling, I want the actual spec the rule has to meet.

  So write me the desiderata for an update rule that handles uncertain evidence -- what it has to do to count as adequate. Things I half-know belong on the list: it should reduce to plain conditioning when the evidence happens to be certain (and do nothing when it's uninformative), it needs some answer to the communativity problem people raise against Jeffrey conditioning -- successive updates on different partitions giving different results depending on the order -- it shouldn't be hostage to arbitrary choices about how you slice the evidence into a partition, and ideally there's a principled justification (Dutch book? accuracy? value-of-learning style argument that free evidence is never harmful?) rather than "it's a natural-looking generalization." For each requirement say why it's a requirement, tell me which ones are genuinely load-bearing and which are negotiable, and flag any pair you suspect can't be jointly satisfied -- I have a feeling the commutativity one clashes with something.

  Don't assume Jeffrey's rule is the answer. It's the incumbent; treat it as one candidate among others. Also consider the naive "condition on your best guess as if it were certain" approach, the fixes people proposed for the commutativity problem (I remember a guy named Field had one), and whatever else a well-read person would put on the shortlist for updating on less-than-certain evidence.

  Prose part reasonably tight, then the scorecard as a JSON object with this schema:

  {
    "desiderata": [ { "id": "D1", "name": "...", "statement": "...", "load_bearing": true, "why": "..." } ],
    "candidates": [ { "name": "...", "scores": { "D1": "satisfied|violated|contested|depends", "D2": "..." }, "notes": "..." } ],
    "joint_satisfiability": "does the full list admit any rule at all, and if not, which requirement would you drop and why",
    "recommendation": "what I should actually implement, given that analysts update fast and evidence usually arrives as degrees of confidence on some natural language hypothesis, not as a clean partition"
  }

  For the score values use only satisfied, violated, contested, or depends. The JSON is what I'll circulate to the team, so make the notes fields carry the interesting caveats rather than just "yes/no."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Modeller for a small forecasting outfit (sports/gaming risk, hedging advice).
      *   **Problem:** Analysts rarely get certain evidence ($P(E)=1$). They get uncertain evidence ("65% chance shipment left", "source is usually right but had a rough week"). Standard Bayesian conditioning ($P(H|E)$) assumes certainty.
      *   **Goal:** Define desiderata for an update rule that handles uncertain evidence. Evaluate candidates (Jeffrey, naive conditioning, etc.). Provide a tight prose explanation followed by a specific JSON scorecard.
      *   **Constraints:**
          *   Don't assume Jeffrey's Rule is the answer.
          *   Include specific desiderata: reduction to standard conditioning, commutativity, partition invariance, principled justification (Dutch book/accuracy).
          *   Identify load-bearing vs. negotiable requirements.
          *   Flag incompatibilities (specifically commutativity).
          *   JSON schema must be followed exactly.
          *   Score values: `satisfied`, `violated`, `contested`, `depends`.
          *   Tone: Professional, technical but accessible to practitioners, tight prose.

  2.  **Deconstruct the Problem (Uncertain Evidence):**
      *   *Standard Bayes:* $P_{new}(H) = P_{old}(H|E)$. Requires $P_{new}(E)=1$.
      *   *Jeffrey Conditioning (Probability Kinematics):* $P_{new}(H) = \sum P_{old}(H|E_i) P_{new}(E_i)$. Requires a partition $\{E_i\}$ and new probabilities for the partition.
      *   *The "Headache":* Analysts don't get partitions. They get "I'm 65% sure $E$ happened." This looks like $P_{new}(E) = 0.65$. But what about $\neg E$? And does this change the likelihood ratios $P(H|E)$?
      *   *Key Tension:* Commutativity (order of updates shouldn't matter) vs. Rigidity (likelihood ratios stay fixed). Jeffrey's rule satisfies commutativity *if* the partitions are compatible, but fails if updates are on overlapping/non-partitioned propositions or if the "rigidity" assumption is violated.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *D1: Certainty Limit.* If evidence becomes certain ($P(E)=1$), must match Bayes. (Load-bearing: Essential for consistency).
      *   *D2: Inertia/Null Update.* If evidence is uninformative ($P_{new}(E) = P_{old}(E)$), beliefs shouldn't change. (Load-bearing: Basic sanity).
      *   *D3: Commutativity.* Order of independent updates shouldn't matter. (Load-bearing: Crucial for workflow where analysts update asynchronously). *Note: This is the hard one.*
      *   *D4: Partition Invariance.* Results shouldn't depend on how we slice the sample space. (Negotiable/Contested: Jeffrey's fails this generally, but it's a strong theoretical desire).
      *   *D5: Principled Justification.* Needs a defense (Accuracy/Dutch Book). (Load-bearing: Need to trust the math).
      *   *D6: Likelihood Stability (Rigidity).* The update shouldn't arbitrarily shift $P(H|E)$ unless the evidence speaks to the relationship between $H$ and $E$. (Load-bearing: Otherwise, you're just making stuff up).

  4.  **Evaluating Candidates:**
      *   *Naive Conditioning:* Treat "65% sure" as "Condition on $E_{virtual}$".
          *   Pros: Simple.
          *   Cons: Violates certainty limit (if you treat 0.65 as 1), violates rigidity. Basically broken for this use case.
      *   *Jeffrey Conditioning (JC):*
          *   Pros: Standard, satisfies Certainty Limit, Inertia, Commutativity (for fixed partitions).
          *   Cons: Requires a partition. Fails Partition Invariance (Diaconis/Zabell). Commutativity breaks if partitions shift.
      *   *Field's Rule (Generalized JC):*
          *   Tries to fix commutativity by updating on the "distance" between distributions.
          *   Cons: Complex, still struggles with partition dependence.
      *   *Accuracy-Based (Minimize Expected Brier/Log Loss):*
          *   Pros: Strong justification.
          *   Cons: Often collapses to JC or requires specific constraints.
      *   *Odds Form / Likelihood Ratio Updates:*
          *   Instead of setting $P(E)$, specify how much the odds of $H$ should shift.
          *   Good for "source is right more often than wrong."

  5.  **Addressing the Commutativity Clash:**
      *   Diaconis and Zabell (1982) showed Jeffrey Conditioning is *not* partition invariant.
      *   Commutativity holds for JC *only* if the second update is on a partition that is independent of the first update's changes to likelihoods.
      *   *The Clash:* You generally cannot have Partition Invariance AND Commutativity AND Rigidity simultaneously in all cases. Commutativity is usually the first to go in practical implementations if the evidence structure changes, but for a tooling spec, we want it.
      *   *Resolution:* Acknowledge that strict commutativity is impossible for *arbitrary* uncertain evidence descriptions. We must constrain *how* evidence is input (e.g., force it into a fixed partition or use likelihood ratios).

  6.  **Developing the Recommendation:**
      *   The user's analysts deal with "natural language hypotheses," not clean partitions.
      *   Jeffrey's rule is too brittle for ad-hoc partitions (commutativity fails if partitions change).
      *   Naive conditioning is dangerous.
      *   *Best Path:* **Likelihood Ratio Updates (Bayes Factor style)** or **Virtual Conditioning with Constraints**.
      *   Actually, for a "forecasting outfit," the most robust method for uncertain evidence that isn't a clean partition is often to model the *reliability* of the source.
      *   *Wait, keep it simpler for tooling:* If the tool must accept "65% confidence," Jeffrey's is the standard, *but* the team must be trained to define a stable partition.
      *   *Better Recommendation:* Use **Jeffrey Conditioning** but enforce a **fixed canonical partition** for the domain to mitigate partition dependence, OR switch to **Odds Formers** (update based on how much the evidence shifts odds, rather than absolute probabilities).
      *   *Refined Recommendation:* Given the "sports/gaming" context, outcomes are often discrete (Win/Loss/Draw). Jeffrey's is workable *if* the partition is the outcome space. But the evidence is about *events* (shipment left).
      *   *Actually, the "Gold Standard" for uncertain evidence in AI/Forecasting:* **Pearl's Method of Virtual Evidence**. It treats uncertain evidence as a likelihood ratio on a dummy node. It preserves the graph structure, handles commutativity better in networks, and avoids partition slicing issues.
      *   *Decision:* Recommend Pearl's Virtual Evidence (or equivalent Likelihood Ratio update) over Jeffrey's. It maps better to "Source says X with reliability Y".

  7.  **Drafting the Content:**

      *   *Prose:* Keep it punchy. Define the tension. Explain why JC is the incumbent but why it fails the "partition" test. Explain why Commutativity is the bottleneck.
      *   *JSON:* Strict schema. Ensure scores are accurate.
      *   *Joint Satisfiability:* Be honest. Diaconis/Zabell proved you can't have it all. Commutativity + Partition Invariance is the impossible pair. Drop Partition Invariance (pragmatic) or restrict inputs (procedural).
      *   *Recommendation:* Virtual Evidence / Likelihood Ratios. It fits the "source reliability" narrative better than "redistribute probability mass over a partition."

  8.  **Refining the JSON:**
      *   Check keys: `desiderata`, `candidates`, `joint_satisfiability`, `recommendation`.
      *   Check scores: `satisfied`, `violated`, `contested`, `depends`.
      *   Check `load_bearing`: Boolean.
      *   Ensure `joint_satisfiability` explains the impossibility theorem.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I explain *why* commutativity clashes?
      *   *Fix:* Explicitly mention Diaconis & Zabell. The clash is between Partition Invariance and the mechanics of JC. Commutativity holds for JC *given* a fixed partition, but if you change the partition, results change. So D3 (Commutativity) and D4 (Partition Invariance) are the tension point.
      *   *Critique:* Is "Virtual Evidence" too technical?
