answer: |-
  ### Specification for Uncertain Evidence Updates

  You are correct to pause before hardcoding. The transition from certain events ($P(E)=1$) to uncertain signals ($P(E)=p$) is not a trivial generalization; it is a structural change that breaks standard probability axioms unless constrained. The core tension is between **mathematical consistency** (commutativity, invariance) and **operational reality** (analysts speak in heuristics, not partitions).

  Below are the five load-bearing desiderata for your update engine.

  **D1: Certainty Limit.** If an analyst assigns probability 1 to a piece of evidence, the rule must collapse to standard Bayesian conditioning.
  *Why:* This is your regression test. If the new rule disagrees with standard Bayes when evidence is perfect, it is broken.
  *Status:* Load-bearing. Non-negotiable.

  **D2: Inertia (Null Update).** If the new probability assigned to the evidence equals the prior probability ($P_{new}(E) = P_{old}(E)$), the posterior beliefs must remain unchanged.
  *Why:* If the evidence provides no new information, the model should not drift. This prevents "update noise" from degrading forecasts over time.
  *Status:* Load-bearing. Non-negotiable.

  **D3: Commutativity.** The final posterior must be identical regardless of the order in which independent pieces of uncertain evidence are processed.
  *Why:* Critical for your workflow. Analyst A in London and Analyst B in New York may update the same model asynchronously. If the order matters, the model state is path-dependent and unstable.
  *Status:* Load-bearing, but technically fragile.

  **D4: Partition Invariance.** The update result should not depend on how the sample space is sliced (e.g., grouping "Loss" and "Draw" vs. keeping them separate).
  *Why:* Analysts describe evidence at different granularities. If the math changes because you added a irrelevant alternative to the hypothesis list, the tool is arbitrary.
  *Status:* Negotiable. This is the first casualty of uncertain evidence theorems.

  **D5: Principled Justification.** The rule must minimize a defined loss function (e.g., expected Brier score) or avoid Dutch Books, rather than being an ad-hoc heuristic.
  *Why:* Without this, you cannot trust the output in high-stakes hedging scenarios. "It looks nice" is not a risk control.
  *Status:* Load-bearing.

  **The Incompatibility Warning:** You suspected the commutativity clash. It is real. Diaconis and Zabell (1982) proved that **Jeffrey Conditioning** (the standard incumbent) satisfies Commutativity (D3) *only if* the partition remains fixed. It violates Partition Invariance (D4). Field's rule attempts to fix D3 but introduces computational complexity and still struggles with D4. You cannot satisfy D3 and D4 simultaneously for all possible evidence inputs. You must procedurally constrain how analysts input data to preserve D3.

  ***

