answer: |-
  ### 1. The Nearest Existing Concepts

  You are correct to reject "paralysis by analysis" and the crude System 1/2 dichotomy. Those are labels for the *symptom* or the *actors*, not the mechanism. Here are the three serious contenders from the literature, and why each fails to cover your full pattern.

  **A. Verbal Overshadowing (Psychology / Memory)**
  *   **Source:** Schooler & Engstler-Simons (1990) and subsequent literature.
  *   **Fit:** This matches your Case 2 (Memory) exactly. It describes how verbalizing a non-verbal memory (faces, tastes, sounds) impairs subsequent recognition. The mechanism is hypothesized to be *recoding*: the verbal description biases retrieval toward the verbal trace rather than the original perceptual trace.
  *   **Failure:** The literature is siloed. It is almost exclusively applied to perceptual memory and recognition tasks. It is not standardly used to explain motor degradation (skiing) or social flow. While Schooler has argued for broader applicability, a search for "verbal overshadowing" in motor-skill journals yields mostly citations of "Reinvestment Theory" instead. It treats the memory case as a corruption of the *trace*, whereas your motor cases look like an interruption of the *process*.

  **B. Reinvestment Theory / Explicit Monitoring (Skill Acquisition)**
  *   **Source:** Masters (1992); Baumeister (1984) on "Choking Under Pressure."
  *   **Fit:** This matches Cases 1 (Motor) and 4 (Social). It posits that skills learned procedurally (implicitly) degrade when the performer attempts to control them via explicit, step-by-step rules (reinvestment).
  *   **Failure:** It focuses on *attention* and *control*, not necessarily *words*. You can reinvest attention visually (watching your feet) without verbalizing. Your prompt specifies that the degradation comes from *articulation*. Furthermore, Reinvestment Theory does not typically claim to explain the eyewitness memory effect (Case 2), which is not a motor skill execution but a retrieval operation.

  **C. Knowing-How vs. Knowing-That (Philosophy)**
  *   **Source:** Gilbert Ryle, *The Concept of Mind* (1949).
  *   **Fit:** Ryle correctly identifies that procedural knowledge (how to ski) is categorially distinct from propositional knowledge (rules about skiing).
  *   **Failure:** Ryle's distinction is ontological, not dynamic. He argues they are different *kinds* of knowledge, not that accessing one actively destroys the other. He does not provide a mechanism for the *interference cost* you are observing. You are describing a resource conflict; Ryle describes a category error.

  **Verdict:** No single established term covers the cross-domain unity of memory, motor, linguistic, and social degradation via *online verbalization*. The literature is fragmented into "Overshadowing" (memory) and "Reinvestment" (motor).

  ---

  ### 2. The Carving and The Coining

  You asked me to choose between four carvings: (a) attention to components, (b) verbalization as such, (c) any explicit representation, or (d) direction of fit.

  **My Choice:** It is **(b) Verbalization as such**, but *only because* language imposes a **Propositional Format** on **Non-Propositional Content**.

  If you attend to components without words (a), you might still choke (Reinvestment), but you might also succeed (visual focus). If you generate an explicit representation that is not verbal (c)—for example, visualizing the perfect swing—it often *helps* (priming). The direction of fit (d) is relevant, but you can generate words from capacity (narrating past events) without degradation. The degradation happens specifically when the *format translation* occurs *during* the operation.

  The common factor is **Representational Incompatibility**. The brain is running a process optimized for analog, holistic, or high-dimensional data (a face, a balance adjustment, a social vibe). Language requires digital, sequential, low-dimensional data (words, syntax). Forcing the running process to feed the language generator requires a lossy compression of the very data the process needs to execute.

  **The Term:** **Online Verbal Recoding Interference (OVRI)**

  **Definition:** *The degradation of a cognitive or motor capacity caused by the simultaneous requirement to translate the implicit representations governing that capacity into explicit propositional form.*

  **Why this carving?**
  It distinguishes the phenomenon from generic distraction. A secondary task (counting backward) loads working memory but does not require *recoding the skill itself*. OVRI requires the skill's own data to be chewed up by the language center. It unifies the memory case (the perceptual trace is recoded into words, biasing retrieval) and the motor case (the proprioceptive flow is recoded into rules, disrupting timing).

  *(Flag: This unification is my synthesis. While Schooler has hinted that verbal overshadowing is a general recoding issue, and Masters argues reinvestment is explicit control, no standard textbook currently lists "Skiing" and "Face Memory" under the same single header. I am proposing they are the same mechanism.)*

  ---

  ### 3. Boundary Cases and Predictions

  If **OVRI** is the correct carving, it makes specific predictions that distinguish it from generic "distraction" or "anxiety."

  **Case A: The Third-Party Narrator**
  *   *Scenario:* An expert skier narrates *another* expert skier's movements in real-time.
  *   *Prediction:* **No degradation.**
  *   *Reasoning:* The recoding is not drawing on the narrator's own implicit motor commands. The representational formats are not competing for the same resource. If degradation occurs here, it is due to generic attentional split, not OVRI.

  **Case B: Non-Semantic Vocalization**
  *   *Scenario:* A skier counts "1, 2, 1, 2" or hums a rhythm while skiing.
  *   *Prediction:* **No degradation (possibly facilitation).**
  *   *Reasoning:* This is verbalization, but it does not require *recoding the skill's content* into propositions. It does not force the implicit motor program into a linguistic format. If this causes clumsiness, my carving is wrong, and the culprit is generic auditory-motor interference.

  **Case C: Post-Hoc Verbalization**
  *   *Scenario:* A witness describes a face *one week* after seeing it, then is tested on recognition.
  *   *Prediction:* **Less degradation than immediate description.**
  *   *Reasoning:* OVRI requires the *online* translation. If the memory has already consolidated or decayed, the recoding interferes with the *current* trace, not the active processing. (Note: Literature suggests verbal overshadowing is strongest when verbalization is immediate; this supports OVRI).

  **Case D: The "Bilingual" Expert**
  *   *Scenario:* A native speaker is asked to state grammar rules in their *second* language vs. native language.
  *   *Prediction:* **Higher degradation in the native language.**
  *   *Reasoning:* Recoding in the native language is more automatic and thus more likely to hijack the implicit linguistic intuition. In the second language, the explicit system is already engaged, so the "collision" is less severe. (This is a risky prediction; it tests whether the *automaticity* of the recoding is the danger).

  ---

  ### 4. Confidence and Falsification

  **Confidence Level:** Moderate-High on the existence of the pattern; Moderate on the unity of the mechanism.

  I am confident that the *phenomenon* is real and under-named. I am less certain that the Memory case (Overshadowing) and the Motor case (Reinvestment) are mechanistically identical. They may be two distinct pathways that share the same structural bottleneck (conscious bandwidth).

  **What Would Change My Mind (Falsification Conditions):**

  1.  **The Dissociation Test:** If research demonstrates that **Verbal Overshadowing** (memory) is mediated by *memory trace corruption* (the words overwrite the image), while **Reinvestment** (motor) is mediated purely by *attentional resource depletion* (the words steal CPU cycles), then my carving is wrong. OVRI implies a *format conflict*, not just resource theft. If the motor case is proven to be pure resource theft (i.e., *any* complex verbal task hurts skiing, not just skiing-talk), then OVRI collapses into generic Dual-Task Interference.
      *   *Current Evidence:* Some motor studies suggest *skill-focused* talk hurts more than *irrelevant* talk, which supports OVRI. But this needs to be robust.

  2.  **The Non-Verbal Explicit Test:** If I can show that **non-verbal explicit representation** causes the same degradation. For example, if asking a skier to *visually monitor* a specific joint angle (without words) degrades performance *as much as* describing it, then "Verbal" is the wrong carve. The phenomenon would be **Explicit Monitoring Interference**, and verbalization is just a common subset.
      *   *Current Evidence:* Reinvestment theory suggests visual monitoring *does* hurt. If it hurts *equally*, then my term "Verbal Recoding" is too narrow. I would have to broaden to **Online Explicit Recoding Interference**.

  3.  **The Expertise Reversal:** If high expertise *eliminates* the effect entirely. OVRI suggests the implicit system is always vulnerable to explicit hijacking. If true experts become immune to verbal interference (i.e., they can talk and ski perfectly), then the phenomenon is merely a feature of *learning*, not a fundamental cognitive constraint.
      *   *Current Evidence:* Experts are *more* susceptible to reinvestment under pressure. This supports OVRI.

  **Load-Bearing Memory Flag:**
  My assertion that Reinvestment Theory does not typically encompass memory tasks relies on my recollection of the sport-psychology literature's siloing. My assertion that Verbal Overshadowing is not typically applied to motor skills relies on my recollection of the cognitive-psychology literature. It is possible a niche paper exists bridging these (e.g., by Schooler himself in a later review). If such a unifying paper exists and is widely cited, my coinage of OVRI is redundant, and the established term should be used. However, given your 15 years in rationalist circles and lack of finding a name, I assess the probability of a widely accepted unified term as low.

  **Final Recommendation:**
  Use **Online Verbal Recoding Interference**. It specifies the *timing* (Online), the *mechanism* (Recoding/Format Translation), and the *modality* (Verbal). It allows you to argue that the Centipede Effect is not a fable, but a description of a specific representational collision.
