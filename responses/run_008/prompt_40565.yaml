          *   *Silence on Responsibility:* No one said "Bankers took more risks."
          *   *Diagnosis:* LE is the wrong explanation for *this* kind of compensation. This is about solidarity/dignity.
          *   *Mapping:* Be precise. Victim (dead) vs. Family (recipient). Harm = Loss of support + Loss of life. LE focuses on welfare/resources. Public focused on symbolic value.
          *   *Scope:* LE should recuse itself from the airline bailout.
      *   *Conclusion:* Summarize. The VCF is a pragmatic hybrid that exposes LE's limits in contexts of shared tragedy.

  5.  **Refining the Arguments (Self-Correction during drafting):**

