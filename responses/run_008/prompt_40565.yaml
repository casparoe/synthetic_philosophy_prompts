          *   Rescue workers/illnesses handled separately/later.
      *   **Task 1 (Theory -> Case):** What does LE say about the scheme?
          *   Attack = brute luck (compensable).
          *   Earnings-based payouts = translate brute luck into differential awards based on income (income = mix of option/brute luck).
          *   Is it too/not egalitarian enough? Does it expose instability in the brute/option distinction (high-rise job = gamble or circumstance)?
          *   Feinberg's compression = incoherent compromise? Between what?
