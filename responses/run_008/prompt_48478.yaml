          *   What is strictly required: The narrator cannot be wrong that he is *having* the thought "I am doing this because of X."
          *   What is not required: That "X" is actually the *cause* of the action.
          *   Distinction: *Occurrent State* (I feel anger) vs. *Dispositional/Explanatory State* (I am angry because I was slighted).
          *   Theory: A modified Cartesianism + Wittgensteinian/Neo-Expressivist nuance. The authority covers the *appearance* of the mind, not the *architecture* of the mind.

      *   **Distinguishing Requirements vs. Fit:**
          *   *Required:* Immediate access to qualia and occurrent propositional attitudes. (I think "I hate him" -> It is true I am thinking "I hate him").
          *   *Fits Well (but not required):* The assumption that the narrator understands *why* he holds those attitudes. This is where the "rationalization" twist lives.
