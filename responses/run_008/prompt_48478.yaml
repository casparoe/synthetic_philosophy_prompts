      *   *First-Person Authority:* The idea that I know my own mind better than others do.
      *   *Infallibility vs. Incorrigibility:*
          *   Infallibility: I cannot be wrong about my mental states.
          *   Incorrigibility: Others cannot correct me about my mental states.
      *   *Self-Deception:* How can I lie to myself? If I know $p$, how can I believe not-$p$? Or, if I report motive $M$, how can the real motive be $M^*$ without me knowing?
      *   *The "Contract":* The reader agrees to treat the narrator's report of *current experience* as true. Does this extend to *interpretations* of that experience (motives)?

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the tension between the narrative convention and the philosophical problem.

      *   **Reconstructing the Implicit Theory:**
