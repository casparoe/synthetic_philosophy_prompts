answer: |-
  This is a rich analogy because, at a fundamental level, both fields deal with the transmission of information under constraints. However, the divergence lies in the *objective functions* of the nodes and the *nature of the channel*.

  Here is the translation of the evolutionary biology debate into your communications engineering vocabulary, followed by the residue report you requested.

  ### Part 1: The Translation

  #### 1. The Handicap Claim (Zahavi)
  *   **Biological Claim:** Signals are honest only if they impose a survival cost that lower-quality individuals cannot afford.
  *   **Engineering Restatement:** **Power-Constrained Authentication via Proof-of-Work.**
      *   Consider a network of nodes with heterogeneous battery capacities ($C_{high}$ vs. $C_{low}$) and varying channel conditions.
      *   To transmit a "High Quality" status bit, a node must transmit a pilot tone or beacon at a power level $P_{tx}$ that pushes its energy consumption close to its outage threshold.
      *   A low-capacity node attempting to mimic this $P_{tx}$ would drain its battery to critical failure (node death/outage) before the next maintenance cycle.
      *   **The Claim:** Reliability is guaranteed not by error-correcting codes, but by the *energy cost* of the transmission itself. The signal is self-authenticating because the marginal cost of power is convex with respect to remaining battery health.

  #### 2. The Game-Theoretic Rescue (Grafen, Godfray, etc.)
  *   **Biological Claim:** Costs don't need to be absolute; they need to be *differentially* costly. An equilibrium exists where high-quality signalers pay a cost that is too high for low-quality signalers to mimic profitably.
  *   **Engineering Restatement:** **Separating Equilibrium in a Signaling Game.**
      *   This is not a standard Shannon channel; it is a mechanism design problem.
      *   Let $U_S$ be the sender's utility (mating success) and $U_R$ be the receiver's utility (selecting a high-quality partner).
      *   The cost function $K(P_{tx}, Quality)$ is such that $\frac{\partial K}{\partial P_{tx}}$ is inversely proportional to $Quality$.
      *   **The Rescue:** You don't need to burn enough power to kill the low-quality node outright. You only need to set the power threshold such that the *Net Present Value* of mimicking is negative for the low-quality node.
      *   Mathematically, this is a **Nash Equilibrium** where the strategy profile is (High Quality $\to$ High Power, Low Quality $\to$ Low Power). The "cost" is the subsidy required to maintain incentive compatibility.

  #### 3. The Waste vs. Efficiency Dispute
  *   **Biological Claim:** Is the peacock's tail wasteful energy expenditure, or is it an efficient investment in information transfer?
  *   **Engineering Restatement:** **Overhead vs. Spectral Efficiency Trade-off.**
      *   **The "Waste" View:** The power burned on the tail is power *not* spent on somatic maintenance (survival) or data payload. It looks like transmitting a carrier wave with no modulation—pure energy expenditure for no direct throughput.
      *   **The "Efficiency" View:** This power is analogous to **Pilot Symbols** or **Training Sequences**. You cannot decode the channel (assess genetic quality) without them.
      *   **The Dispute:** In comms, we minimize pilot overhead to maximize spectral efficiency. In biology, the "overhead" *is* the message. The debate is whether the system operates at the **Shannon Limit** of information transfer per Joule, or if evolutionary hysteresis locks the system into a sub-optimal, high-power modulation scheme (e.g., QAM-64 when BPSK would suffice for detection).

  ---

  ### Part 2: The Residue Report

  Here is the fidelity analysis of mapping your domain to theirs.

  #### 1. What Translates Cleanly
  *   **Power Budgets:** Metabolism is a battery. Survival is avoiding outage. The trade-off between transmission power and system longevity is identical.
  *   **Detection Theory:** The receiver (female/rival) is performing hypothesis testing ($H_0$: Low Quality vs. $H_1$: High Quality) in additive noise (environmental clutter, other males). The "Handicap" improves the $d'$ (detectability) of the signal.
  *   **Marginal Costs:** The concept that hardware imperfections (low quality) make high-power transmission less efficient (more heat, more distortion, faster drain) is physically sound in both domains.

  #### 2. What Requires Bending (Distortion)
  *   **The Time Constant:** In comms, link adaptation happens in milliseconds (power control loops). In evolution, the "protocol update" takes generations. You are analyzing a static equilibrium of a system that is constantly drifting due to the **Red Queen Hypothesis** (the channel statistics change because the other users are evolving).
  *   **The Definition of Noise:** In your world, noise is thermal or interference. In biology, "noise" includes **strategic interference** (jamming by rivals) and **deception** (spoofing).
  *   **Optimization:** Engineers optimize for a global utility (BER, Throughput). Evolution optimizes for local fitness. A "sub-optimal" modulation scheme persists if it beats the neighbor's scheme, even if it wastes total system energy.

  #### 3. The Untranslatable Remainder (The Critical Residue)
  This is where your intuition about the codebook is correct, but the implications are deeper than just "no standards body."

  **A. The "Honesty" Problem (Byzantine vs. Erasure)**
  In your world, the transmitter is trusted. If bits flip, it is *noise*. In biology, the transmitter is adversarial. If bits flip, it is *lies*.
  *   **Comms:** We assume the sender *wants* the receiver to decode the message correctly.
  *   **Bio:** The sender wants the receiver to decode a *specific* message (High Quality), regardless of the true state.
  *   **Translation:** This is not a Communication Channel; it is a **Physical Layer Security** problem involving **Authentication**.
  *   **The Residue:** In comms, "honesty" is a protocol guarantee (crypto signatures). In biology, there is no crypto key. "Honesty" is an emergent property of the energy landscape. You cannot model this with Shannon Information Theory alone; you need **Game Theory**. Shannon assumes a passive channel; Zahavi assumes an active, strategic channel.

  **B. The Codebook Co-Evolution**
  You noted: *"Transmitter and receiver share a codebook by standard... in the biological case... the 'code' itself is whatever each side's evolution has left it with."*
  *   **Engineering:** The constellation map (e.g., 16-QAM) is fixed *a priori*.
  *   **Biology:** The constellation map is part of the optimization variable. The receiver evolves its detector threshold *in response* to the sender's power allocation, and the sender evolves its power *in response* to the detector.
  *   **The Residue:** This is **Adaptive Modulation and Coding (AMC)** where the standard is being rewritten by the hardware itself in real-time. There is no "correct" mapping. There is only a stable fixed point in the joint strategy space.

  **C. The "Waste" is the Feature**
  In comms, if you can send the same info with less power, you do it. In the Handicap Principle, if you can send the same info with less power, **the signal collapses**.
  *   **Engineering:** Cost is a bug to be minimized.
  *   **Biology:** Cost is the feature that prevents spoofing.
  *   **The Residue:** This maps to **Proof-of-Work (Bitcoin)**. The "waste" (hashing) is required to make rewriting history (lying about quality) computationally (energetically) infeasible. If you view the biological system through a crypto-economics lens rather than a comms lens, the "waste" argument dissolves. It is not waste; it is the security budget.

  ---

  ### Part 3: Is "Honesty" Well-Posed?

  You asked: *"Is 'honesty' even a well-posed notion when there is no prior agreed mapping from signals to states?"*

  **The Answer:** No, not in the Information Theory sense. It is well-posed only in the **Game Theoretic** sense.

  In your work, "Honesty" means $P(\hat{m} | m) \approx 1$. The mapping $m \to s$ is fixed.
  In biology, "Honesty" means $Correlation(State, Signal) > 0$ at equilibrium.

  If there is no agreed mapping, "honesty" is not a property of the signal; it is a property of the **Equilibrium**.
  *   If the cost function is flat (everyone pays the same cost for the signal), the equilibrium is **Pooling** (everyone sends the same signal). Honesty is undefined/zero.
  *   If the cost function is differential (high quality pays less marginal cost), the equilibrium is **Separating**. Honesty is 1.

  **The Missing Vocabulary:**
  Your vocabulary is missing **Mechanism Design**.
  *   **Comms:** We design the mechanism (protocol) to maximize capacity.
  *   **Bio:** Natural selection designs the mechanism to prevent exploitation.
  *   **The Gap:** You are looking for a *coding theorem*. There isn't one. There is only an *existence theorem for equilibria*.

  ### Part 4: Final Verdict on the Debate

  **Is the biologists' debate substantive?**
  Yes, but it is not about physics; it is about economics.

  1.  **The "Waste" Fight:** This is semantic. If you view the system as a single optimizer (the species), it looks wasteful (sub-optimal SNR). If you view it as competing agents (genes), it is efficient (minimum cost to prevent spoofing). This is identical to the debate over **Proof-of-Work vs. Proof-of-Stake**. PoW looks wasteful to an engineer; a cryptographer knows it's the price of trustlessness.
  2.  **The "Honesty" Fight:** This is where your intuition hits the wall. In comms, we solve trust with **Shared Secrets** (Crypto). In biology, they cannot have shared secrets (a female cannot share a private key with a male before verifying his quality).
      *   Therefore, they must use **Zero-Knowledge Proofs via Resource Burning**.
      *   The debate is substantive because it asks: *Is resource burning the only way to achieve separation without shared secrets?*
      *   Some biologists argue for **Index Signals** (signals that are physically impossible to fake, like a deep roar requiring large vocal cords). This maps to **Hardware Fingerprinting** (PUFs - Physical Unclonable Functions).
      *   The Handicap Principle argues that Index Signals are rare; most signals are **Conventional** (arbitrary) and require the "Handicap" (PoW) to remain honest.

  **Conclusion for the Engineer:**
  You can model the *physics* of the signal (link budget, detection) perfectly. You cannot model the *semantics* (honesty) without importing Game Theory.
  *   **Honesty** is not a channel property.
  *   **Honesty** is a stability property of a non-cooperative game.

  The residue is not a failure of your vocabulary; it is a boundary condition. Your vocabulary assumes cooperation (sender and receiver want to communicate). Their domain assumes conflict (sender wants to persuade, receiver wants to verify). To bridge it, you must treat the channel not as a wire, but as a **market**. The "Handicap" is the market price of credibility.
