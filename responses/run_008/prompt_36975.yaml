prompt: |-
  so, background: I'm a software engineer, zero formal philosophy, but a few weeks ago I fell down a rabbit hole reading about "Kripkenstein" — Kripke's book on Wittgenstein's rule-following stuff (Wittgenstein on Rules and Private Language, iirc) — and its been living in my head rent free ever since. the setup, translated into my language: I say that by "plus" I mean the function plus(x, y) = x + y for ALL arguments. but every addition I've ever actually performed involved small numbers — nobody's life contains a case of adding numbers bigger than a few trillion. so now imagine a function quus, which agrees with plus everywhere below 57 and just returns 5 for anything bigger. every single past use of mine is perfectly consistent both with "I meant plus" and with "I meant quus". and when I confidently say 68 + 57 = 125, I feel like I'm reporting something that was already fixed before I answered — but if my entire history of usage doesn't determine which function I meant, what does? I get that the standard response is "your dispositions fix it," but I can also be disposed to answer wrongly when I'm tired, so dispositions seem to include my errors, which feels like a bug not a feature.

  what I want from you is not another retelling of the skeptical argument — I've read like five of those. I want the spec sheet. write me the desiderata: the list of things any adequate theory of what fixes what I meant by a word has to deliver. which cases it must get right (the quus underdetermination case; the fact that I can genuinely MEAN plus and still botch a specific addition, so it can't collapse what I meant into what I'd actually say; applying a rule to genuinely novel cases I've never encountered, which is somehow routine and not a miracle); which distinctions it has to respect (between the rule prescribing my answer and my past behavior merely predicting it, between my committing an error and there being no fact of the matter); and the generalization requirement — the quus trick works on any word, "tree", "green", whatever, so the theory better not quietly only work for arithmetic. for each requirement, give the case that motivates it. and then the part I care about most: flag which pairs of requirements you suspect can't be jointly satisfied, because from where I sit it looks like you can have "fixed by natural facts about me" or you can have "normative, able to guide and be violated," but maybe not both, and I want to know if that's a real tension or just me being new to this.

  then, briefly, run the scorecard: the dispositional view (meaning is what I'm disposed to answer), the "there's no fact, just assertability conditions" response, and a view with irreducible normative facts about meaning — one or two lines each on which requirement each one fails or meets. keep the weight on the requirements themselves though, the scorecard is an afterthought. assume I know what a truth condition is but no jargon beyond that — if you use a term of art, define it inline. a table for the desiderata is fine, whatever's clearest. for context: I keep telling a coworker this is a real structural problem and not philosophy being weird for its own sake, and I'd like to hand her something that shows the actual shape of it.
