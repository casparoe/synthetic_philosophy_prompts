answer: |-
  Here is the analysis of your cases, the principle that unifies them, and the resolution to your uncertainties.

  ### The Unifying Principle: Rational Executability

  There is a single principle that captures verdicts 1 through 6 without epicycles. I call it the **Principle of Rational Executability**:

  > **You can only genuinely intend to perform an action at $t_1$ if you believe you will execute it at $t_2$. You can only believe you will execute it at $t_2$ if, at $t_2$, the action will be either (A) instrumentally rational, or (B) psychologically/physically compelled.**

  This principle distinguishes between *choosing* (Newcomb) and *intending* (Toxin). In Newcomb, the choice itself is the mechanism of the payoff. In Toxin, the intention is the mechanism, but the intention relies on a prediction of a future choice that has no mechanism to support it.

  Here is how it applies to your specific questions.

  ### 1. & 2. Case 3 (Roommate) and Case 5 (Resolute Agent)

  **Case 3 (The Roommate Predictor):**
  Your gut is correct: **One-box.**
  Under the Principle of Rational Executability, Newcomb's Problem is not about "intending" a future action that is pointless; it is about making a choice *now* that is evidentially linked to the payoff. Even with a 90% accurate predictor, the Expected Utility of one-boxing vastly outweighs two-boxing. The "choice" happens at $t_1$, and the payoff depends on that choice. There is no $t_2$ execution gap to worry about. The fallibility of the predictor lowers the stakes, not the rationality of the move.

  **Case 5 (The Resolute Agent):**
  Your flip-flop is the weak link. The principle says: **You get the million.**
  Here is why: In the standard Toxin case (Case 1), you cannot intend because you know you won't drink (it's irrational at $t_2$ and not compelled). But in Case 5, you have stipulated a fact about your psychology: you are *pathologically unable* to abandon a plan.
  This satisfies condition **(B)** of the principle (Psychological Compulsion). If you know you are pathologically resolute, you *know* you will drink. If you know you will drink, you *can* intend. If you can intend, you get the money.
  Your flip-flop likely stems from wondering if "pathological resoluteness" counts as a valid constraint or just stubbornness. For decision theory, if it binds your future action as effectively as a physical lock, it counts. Stop flip-flopping: **You are a toxin-drinker by nature, so you get the cash.**

  ### 3. The Asymmetry: Newcomb (2) vs. Toxin (1)

  You asked why you one-box in Newcomb but refuse the million in Toxin, even though both reward a present state keyed on earlier.

  **The Explanation:**
  In **Newcomb**, the payoff is keyed on your **Choice**. Your choice at $t_1$ is the final word. There is no gap between "deciding" and "doing." You decide to take Box B, and you take Box B. The predictor anticipated this disposition, but the money is in the box because of the *type of chooser* you are, which is manifested in the *act* of choosing.

  In **Toxin**, the payoff is keyed on your **Intention**, but the intention is distinct from the **Act**.
  *   **Newcomb:** Choice $\rightarrow$ Payoff. (Direct link).
  *   **Toxin:** Intention $\rightarrow$ Payoff $\rightarrow$ Act. (Broken link).

  Once the billionaire pays you (based on intention), the link to the Act is severed. At $t_2$, drinking is purely costly with no benefit. Because you are a rational agent who cannot intend what you know you won't do (Executability), you cannot form the intention at $t_1$.
  In Newcomb, the act is *never* pointless; it is the very thing that secures the utility (under EDT/FDT reasoning). In Toxin, the act is *necessarily* pointless once the intention is formed.

  ### 4. Which Verdict to Overturn?

  If I must overturn one verdict to make the system perfectly coherent, I would overturn **Case 1 (Standard Toxin)**.

  **Why?**
  Your verdict on **Case 4 (Diet)** and **Case 6 (Passwords)** shows that you believe in **Precommitment**.
  *   In Case 6, you change the *options* (hard precommitment).
  *   In Case 4, you change your *psychology* (soft precommitment). You say, "I resolve now... and I can actually do it."

  If you accept that you can bind your future self via internal resolve in the Diet case, you should accept that a rational agent *ought* to be able to cultivate a policy of resoluteness in the Toxin case. This is the **Gauthier Solution**: A rational agent is not a "sophisticated chooser" (who maximizes at every node) but a "resolute chooser" (who maximizes over the whole plan).

  If you are capable of the resolve in Case 4, you are theoretically capable of the resolve in Case 1. Refusing the million in Case 1 while accepting the resolve in Case 4 suggests you think "Health" is a valid motivator for resolve but "Money" is not. But in Case 1, the Money *is* the motivator for the *intention*, even if it's not the motivator for the *act*.

  **However,** since your gut on Case 1 is the standard philosophical consensus (the "Toxin Puzzle" is famous precisely because it seems impossible), I recommend the easier path: **Keep Case 1, but fix Case 5.**
  Case 1 is "Standard Human Psychology." Case 5 is "Modified Psychology." It is consistent to say "I can't do it normally" (Case 1) but "I can do it if I'm pathological" (Case 5). The inconsistency is only in your uncertainty about Case 5.

  ### 5. Case 7: Toxin + Bonus Variant

  **The Setup:** $1M for intention, +$10k if you actually drink.
  **Your Gut:** "Somehow a different deal... maybe get both."
  **Principle Prediction:** **You get the $1,010,000.**

  **Why?**
  This variant fixes the "Broken Link" problem of the original Toxin case.
  1.  **At $t_2$ (Drinking Time):** You have the $1M in the bank. If you drink, you get +$10k and a day of sickness. If the $10k is worth more to you than a day of sickness, drinking is now **Instrumentally Rational** (Condition A of the Principle).
  2.  **At $t_1$ (Intention Time):** Because drinking is rational at $t_2$, you *can* believe you will do it. Because you believe you will do it, you *can* genuinely intend it.
  3.  **Result:** You form the intention $\rightarrow$ Billionaire pays $1M $\rightarrow$ You drink (because it's now rational) $\rightarrow$ You get +$10k.

  Your gut is right: it is a different deal. The bonus restores the **substantive rationality** of the action itself, removing the paradox. In the original Toxin, the action was *always* irrational at $t_2$. Here, the action is rational at $t_2$. This closes the loop and allows the intention to form at $t_1$.

  ### Summary of Recommendations

  1.  **Principle:** Adopt **Rational Executability**. (Intention requires belief in execution; execution requires rationality or compulsion at the time of action).
  2.  **Case 3:** One-box confidently. The evidential link holds.
  3.  **Case 5:** Stop flip-flopping. If you are pathologically resolute, you **get the million**. Your compulsion satisfies executability.
  4.  **Asymmetry:** Newcomb rewards the *choice*; Toxin rewards the *intention* but punishes the *act*. You can choose rationally; you cannot intend irrationally.
  5.  **Case 7:** Your gut is correct. The bonus makes the act rational, allowing the intention, allowing the payout. You get the full $1.01M.
