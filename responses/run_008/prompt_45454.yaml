  ### Specification for an Adequate Theory of What Matters

  To serve as a guide for first-person choice, a theory of well-being must do more than describe psychological states; it must offer a normative architecture capable of adjudicating between competing life strategies. The following ten desiderata constitute the specification. An adequate theory must satisfy all of them.

  1.  **Action-Guidance:** The theory must yield determinate recommendations when an agent chooses between distinct life strategies (e.g., striving vs. withdrawing). It cannot declare all coherent lives equal.
  2.  **The Striver's Verdict:** The theory must provide a reasoned comparison between a life of intense striving with satisfied desires and a life of placid wantlessness (the Contented Retiree). It must explain if, why, and when one is preferable to the other.
  3.  **The Valence Constraint:** The theory must account for unmotivated positive affect (e.g., aesthetic joy, chemical bliss) that arises without a prior deficit or want. It must state whether such states add value, subtract value, or are neutral.
  4.  **The Stroke Victim Constraint:** The theory must adjudicate the case of the friend who, after a stroke, reports no suffering and no desire for change, yet has lost complex conative capacities. It must determine whether to privilege the subject's report of "same as before" or the observer's intuition of diminishment.
  5.  **The Asymmetry Requirement:** The theory must respect the phenomenological and normative distinction between the *absence of suffering* and the *presence of pleasure*. It cannot treat them as merely opposite ends of a single metric without explaining why the removal of pain often feels more urgent than the addition of pleasure.
  6.  **Relief vs. Reward:** The theory must distinguish between *relief* (the cessation of a negative state) and *reward* (the addition of a positive state). It must explain if they contribute equally to the goodness of a life.
  7.  **The Conative Gap:** The theory must distinguish between a want *not being felt* (absence of desire) and a want *being satisfied* (presence of desire + fulfillment). It must assign value differences to these states if they differ in choice-worthiness.
  8.  **The Baseline Distinction:** The theory must define a zero-point. It must distinguish between a life that is *not going badly* (neutral) and a life that is *going well* (positive). A theory that collapses this distinction cannot guide choices between maintenance and enhancement.
  9.  **The Sleep Test:** The theory must explain why a conscious life of neutral equanimity is preferable to dreamless sleep (or non-existence), assuming the agent prefers to live. If the theory values only the absence of suffering, it must explain why sleep (zero suffering) is not equally choice-worthy.
  10. **Empirical Consistency:** The theory must not contradict robust findings in affective science, specifically: (a) *Hedonic Adaptation* (sustained peaks of pleasure are impossible; baselines return); and (b) *Wanting/Liking Dissociation* (neural systems for incentive salience and hedonic impact are distinct and can come apart).

  ***

  ### Analysis of the Desiderata

  #### 1. Genuine Requirements vs. Prejudices
  Several desiderata above appear to load the dice against the negativist view. We must separate structural necessities from ideological biases.

  *   **Genuine Requirements:** Desiderata **1 (Action-Guidance)**, **9 (The Sleep Test)**, and **10 (Empirical Consistency)** are genuine. A theory that cannot tell you whether to wake up or stay asleep (9), or that ignores how human affect actually works (10), fails as a guide for living. Similarly, a theory that offers no advice between strategies (1) is functionally useless.
  *   **Prejudices:** Desideratum **8 (The Baseline Distinction)** and **3 (The Valence Constraint)** are the most contentious. The demand that some states be *positively* good, rather than merely *less bad*, is the core point of contention. A negativist would argue that distinguishing "not bad" from "good" is a hedonist's parochialism; they would claim there is only "bad" and "not bad." However, for *action-guidance*, this distinction is functionally genuine. If a theory cannot explain why one might choose a complex life over a simple one when both are pain-free, it fails Desideratum 1. Therefore, while metaphysically debatable, Desideratum 8 is pragmatically genuine for the task you have set (guiding choices).
  *   **The Stroke Victim (4):** This is a boundary case. Respecting first-person authority is generally required, but not when capacity is compromised. A theory must have a mechanism to override subjective report when conative machinery is broken. This is genuine.

  #### 2. Joint Satisfiability of the Desiderata
  You suspected a tension between discriminating lives by positive feel and explaining why we prefer rich equanimity to dreamless sleep.

  *   **The Tension:** If a theory satisfies **Desideratum 3** (Unmotivated Bliss adds value) and **Desideratum 5** (Pleasure is distinct from Pain-Removal), it commits to positive value. If it commits to positive value, it must explain **Desideratum 9** (Why Equanimity > Sleep).
  *   **The Resolution:** This tension is **apparent, not fatal**. An Objective-List theory or a sophisticated Hedonism can satisfy both. They can argue that *Consciousness* itself is a good (satisfying 9), and *Pleasure* is an additional good (satisfying 3).
  *   **The Real Conflict:** The joint unsatisfiability arises not between the desiderata themselves, but between the desiderata and the **Negativist View**.
      *   Negativism holds: Value = -Suffering.
      *   Desideratum 9 requires: Conscious Equanimity (0 Suffering) > Dreamless Sleep (0 Suffering).
      *   For Negativism to satisfy 9, it must claim Sleep has *more* suffering than Equanimity (false) or that Existence has intrinsic value (contradicting Negativism).
      *   Desideratum 3 requires: Bliss (0 Suffering + Positive Feel) > Equanimity (0 Suffering).
      *   For Negativism to satisfy 3, it must claim Positive Feel reduces suffering more than Neutral Feel (contradicting the definition of 'neutral').

      Therefore, the **desiderata are jointly satisfiable** (by non-negativist theories), but they form a **jointly unsatisfiable set for the Negativist View**.

  #### 3. The Most Exclusionary Requirement and Scoring
  The single requirement that does the most to exclude candidates is **Desideratum 9 (The Sleep Test)**. It forces a theory to account for the value of existence/consciousness independent of the mitigation of suffering. Pure negativism collapses the distinction between a painless life and non-existence.

  **Scoring of Standard Theories:**

  *   **Standard Hedonism:**
      *   *Score:* High.
      *   *Performance:* Satisfies 3, 5, 6, 9 (by valuing neutral pleasure over no experience). Struggles slightly with 10b (Want/Like dissociation) if it conflates the two, but can adapt. Fails 2 only if it cannot explain why striving (often painful) is worth it (requires calculus of net pleasure).
  *   **Desire-Satisfaction:**
      *   *Score:* Medium.
      *   *Performance:* Satisfies 2 and 7 well. Fails 4 (Stroke Victim has no desires, so life has no value/worsens drastically, contradicting his report). Fails 10b (ignores 'liking' without 'wanting'). Fails 9 (Why satisfy desires in sleep vs. wakefulness if satisfaction is the only good?).
  *   **Objective-List:**
      *   *Score:* High.
      *   *Performance:* Satisfies 9 (Consciousness/Agency are goods). Satisfies 4 (Capabilities missing in Stroke Victim). Satisfies 8 (Distinct goods for 'flourishing' vs 'survival').
  *   **The Negativist View:**
      *   *Score:* Fail.
      *   *Performance:* Fails 9 (Cannot distinguish Equanimity from Sleep). Fails 3 (Must treat Bliss as equal to Equanimity). Fails 8 (Collapses 'Well' into 'Not Badly'). Fails 1 (Cannot guide choice between two pain-free options).

  ***

  ### Conclusion
  The specification reveals that while the desiderata are internally consistent and satisfiable by standard theories (Hedonism, Objective-List), they collectively impose a burden that the negativist view cannot bear. Specifically, the requirement to guide action between pain-free states (Desideratum 1) and the requirement to value conscious existence over non-existence (Desideratum 9) force the admission of positive value. A view that recognizes only the absence of suffering cannot explain why one should choose a complex, conscious life over dreamless sleep when both are pain-free. Consequently, the negativist view cannot meet the necessary conditions for an adequate theory of guidance.

  \bottomline{negativist view untenable}
