answer: |-
  Your frustration is well-founded, and your insider perspective on the initial-value problem (IVP) cuts deeper than the standard philosophical summaries. The stagnation you observe is not a failure of imagination but a structural feature of General Relativity (GR) itself. The debate persists because GR is a hybrid theory that simultaneously validates the core intuitions of both camps while preventing either from delivering a knockout blow.

  Here is the diagnosis of the impasse.

  ### The Hybrid Nature of General Relativity
  The reason the "chess opening" never ends is that GR handed a trophy to both sides in 1915, and neither has been able to return it.
  *   **For the Relationist:** GR abolished Newton's absolute space and time. Diffeomorphism invariance (and the Hole Argument) demonstrates that manifold points lack independent physical identity. This validates the Leibnizian intuition that location is only meaningful relative to the field configuration.
  *   **For the Substantivalist:** GR made the metric field dynamical. It carries energy, propagates in a vacuum (as you know from your merger simulations), and interacts with matter. This validates the intuition that spacetime is a "thing" rather than a mere codification of matter relations.

  Because the theory embodies both features, a substantivalist can point to gravitational waves in a vacuum to prove spacetime is real, while a relationist can point to the Hole Argument to prove manifold points are not individuals. They are talking past each other because they are defining "substance" differently: the relationist attacks *manifold substantivalism* (points as containers), while the substantivalist defends *field substantivalism* (the metric as a physical object).

  ### The Initial-Value Problem Wrinkle
  Your observation about the IVP is the critical physical insight often missing from the seminar. To evolve a spacetime numerically, you must fix gauge conditions on a slice. You cannot specify the physics in purely relational terms without first choosing a coordinate scaffolding.
  *   **The Substantivalist reads this as:** The underlying structure is necessary to define the dynamics; the manifold (or the frame) is part of the physical ontology required to make the equations work.
  *   **The Relationist reads this as:** This is merely a computational artifact. The physical observables are the diffeomorphism-invariant quantities at the end; the intermediate gauge fixing is surplus structure that should be eliminated from the fundamental ontology.

  This is where Kretschmann's complaint bites. If general covariance is a formal property achievable by any theory (by making it sufficiently complex), then the relationist's reliance on covariance as proof of relational ontology is weakened. Conversely, if the "surplus" structure is required to solve the equations, the substantivalist claim that it represents reality gains pragmatic weight.

  ### The Diagnosis: Underdetermination of Ontology by Formalism
  To answer your specific question: This is a **substantive ontological dispute rendered empirically inert by the current formalism.**

  It is not merely a dispute about explanation. If it were, one side could concede the ontology for the sake of better heuristic power. They do not. They disagree on what *exists*. However, because GR is empirically complete in its domain (classical gravity), and both interpretations recover the same observables (invariant quantities), the dispute is **metaphysically underdetermined**.

  The "surplus structure" (the gauge-dependent manifold labels) is mathematically necessary for the formulation but physically unobservable. The substantivalist commits to the reality of the structure that supports the field; the relationist commits to the reality of only the invariant relations. Since no experiment within classical GR can distinguish between "real structure that is unobservable" and "mathematical fiction that is useful," the debate cannot be settled by physics as it currently stands.

  ### What Counts as Progress?
  Given this diagnosis, progress within classical GR is impossible. You should not expect a conceptual distinction or a new theorem in GR to resolve this. Progress requires one of three shifts:

  1.  **Empirical Divergence (Quantum Gravity):** We need a regime where the interpretations yield different predictions. If Quantum Gravity reveals spacetime is discrete (favoring a form of substantivalism about the atoms of space) or if it eliminates time entirely (favoring a radical relationism like Barbour's), the debate moves to empirical terrain.
  2.  **Formal Pathology:** If it could be proven that a fully relational reconstruction of GR requires non-local interactions or mathematical pathologies that the substantivalist formulation avoids, Occam's razor would favor substantivalism on methodological grounds. (Currently, relational reconstructions are notoriously complex.)
  3.  **Dissolution (Structural Realism):** The philosophical community may eventually converge on Ontic Structural Realism—the view that the *structure* is real, but the question of whether it inheres in "substance" or "relations" is a category error. This dissolves the dispute rather than solving it.

  ### Conclusion
  The impasse exists because you are asking an ontological question ("What exists?") of a theory that only provides structural answers ("How do things relate?"). As long as the theory remains classical GR, the mapping from structure to ontology is underdetermined. The disagreement is real, but it is hostage to a future theory that breaks the empirical equivalence.

  \diagnosis{Ontological dispute over surplus formal structure}
