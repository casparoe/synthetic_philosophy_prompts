answer: |-
  Herbert Simon's original conception defines satisficing as adjusting psychological aspiration levels based on experience, often lowering them after disappointments. Conversely, the rational-choice reconstruction frames satisficing as optimal stopping determined by search costs. For a small nonprofit board, the rational-choice version should guide procedure to impose discipline against the psychological drift inherent in Simon's original model. The board must fix a minimum aspiration threshold before viewing candidates, based on essential organizational needs rather than market availability. Lowering this threshold mid-search is reasonable only if objective data proves the initial criteria unrealistic, not merely due to search fatigue or candidate scarcity. This structure weighs the risk of prematurely settling against an open-ended search by establishing a predetermined search budget and timeline. While Simon's original model accurately describes human behavior, relying on adaptive aspirations invites governance failure where standards erode under pressure. By adopting the rational-choice framework, the board acknowledges bounded rationality—accepting a "good enough" candidate—but ensures "good enough" remains sufficient for mission success. Thus, the search should conclude when a candidate meets the fixed threshold or when search costs exceed the limit, preventing both premature settlement and endless vacancy.
