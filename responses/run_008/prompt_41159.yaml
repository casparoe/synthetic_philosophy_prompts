prompt: |-
  I am a PhD student in cognitive science, and I sit as the postgraduate representative on my university's reasonable adjustments panel, which decides what learning and exam accommodations students with disabilities are entitled to. Increasingly the cases that come to us involve cognitive aids rather than the familiar extra-time-and-separate-room requests: a student with ADHD who has relied on a particular phone app for working-memory scaffolding since sixth form and now wants it in an invigilated closed-book exam; a student with acquired brain injury whose revision lives in an elaborate system of annotated flashcards she wants to bring in; a mathematics student who describes his personally compiled formula sheet as, in effect, his memory for the course. The panel debates these on pure intuition and the outcomes are inconsistent across cases, which leaves us exposed on appeal. I suspect the philosophy of mind actually has something usable here, specifically Clark and Chalmers's extended mind thesis: the thought experiment of Otto, whose notebook plays the role his biological memory would play in Inga, and the idea that a resource counts as part of a person's cognitive system when it is suitably coupled to it -- constantly available, reliably used, endorsed without re-checking, and deployed as automatically as inner recall -- so that consulting it is less like looking something up and more like remembering.

  Please turn that thesis into a decision procedure the panel could actually run in the twenty minutes we get per case. It should specify the questions to ask in order, what counts as a sufficient answer at each step, where the procedure terminates in a clear yes or no, and which questions are irreducibly matters of values (academic-integrity judgements, fairness to other candidates) that must be handed back to the panel rather than settled by the framework. In building it, please be explicit about which philosophical distinctions genuinely have to survive the simplification -- for instance the difference between an aid that is constitutively part of the student's cognition and one that is merely a useful external tool -- and which debates the panel can safely ignore, such as the row over cognitive bloat or Rupert's objection that extended processes are just too different from inner ones to count as memory proper; say whether the procedure needs to take a side on that or can bracket it. Then run the procedure on three cases: the sixth-form phone app in a closed-book exam; a student with a documented memory impairment requesting her annotated flashcards in a closed-book history exam where the rubric tests recall of dates; and a case where the procedure delivers a verdict the panel will find unwelcome -- for example, if it classifies a formula sheet as extended memory, we have an awkward conflict with the department's rule that no materials may be brought in, so show us how the procedure handles that collision and whether it hands the final call back to us. Finish by stating honestly what the procedure cannot do, including cases where two students use the identical aid to different cognitive effect. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** PhD student in cognitive science, postgraduate rep on a reasonable adjustments panel.
      *   **Problem:** Increasing cases involving cognitive aids (apps, flashcards, formula sheets) rather than standard accommodations (extra time). Current decision-making is intuitive and inconsistent.
      *   **Proposed Solution:** Use Clark & Chalmers's Extended Mind Thesis (EMT) as a basis for a decision procedure.
      *   **Constraints:**
          *   Must fit a 20-minute case review.
          *   Must specify ordered questions, sufficient answers, termination points (Yes/No).
          *   Must distinguish between philosophical distinctions that matter (constitution vs. tool) and those that can be ignored (cognitive bloat, Rupert's objections).
          *   Must identify value judgements (academic integrity, fairness) that remain with the panel.
          *   Must run the procedure on three specific cases (ADHD app, History flashcards, Maths formula sheet).
          *   Must handle conflicts between the procedure's verdict and departmental rules.
          *   Must state limitations (e.g., identical aids used differently).
          *   **Language:** British English.

  2.  **Deconstruct the Extended Mind Thesis (EMT) for Practical Use:**
      *   *Core Idea:* External resources can be part of the cognitive system if they function like internal memory.
      *   *Parity Principle:* If a process were carried out in the head, we would regard it as part of the cognitive process; if carried out externally, it should be regarded as such too (given certain conditions).
      *   *Glue and Trust Criteria (Clark & Chalmers):*
          1.  Constant availability (Glue).
          2.  Reliable access (Trust).
          3.  Endorsement (Automatic acceptance of information).
          4.  Past endorsement (Information was consciously placed there).
      *   *Adaptation for Exams:* The key tension is between *accommodating disability* (levelling the playing field) and *maintaining academic standards* (testing specific competencies). EMT helps determine if the aid *is* the student's memory, but it doesn't automatically solve whether the exam *should* test memory without aids.
      *   *Simplification:* We need to ignore the metaphysical debates (is it *really* mind?) and focus on the functional equivalence (does it act *like* memory for this student?).

  3.  **Drafting the Decision Procedure (The "EMT-RA Protocol"):**
      *   *Goal:* A flowchart-like structure suitable for a 20-minute meeting.
      *   *Step 1: Disability Link.* Is there a documented cognitive impairment? (EMT applies to *compensatory* cognition).
      *   *Step 2: The Glue (Availability).* Is the aid always there?
      *   *Step 3: The Trust (Reliability).* Is it trusted implicitly?
      *   *Step 4: The Endorsement (Automaticity).* Is retrieval automatic or deliberative?
      *   *Step 5: The Construct Validity Check (Value Judgement).* Does allowing this defeat the purpose of the exam? (This is where the panel steps in).

      *Refining the Steps:*
      *   Need to make sure it distinguishes between "scaffolding" (allowed) and "bypassing" (not allowed).
      *   Need to explicitly bracket the "Cognitive Bloat" objection. The panel doesn't care if the mind extends to the clouds; they care if *this* aid is integral to *this* student.
      *   Need to handle the "Departmental Rule" conflict. If EMT says "it's memory" but the Dept says "no memory aids," the panel must weigh reasonable adjustment vs. competency standards.

  4.  **Developing the Three Case Studies:**
      *   *Case 1: ADHD Phone App.*
          *   Glue: Yes (always has it).
          *   Trust: Yes (relies on it).
          *   Endorsement: Yes (automatic).
          *   Conflict: Invigilation/Security. Phones usually banned.
          *   Verdict: Conditional Yes (needs secure version/device).
      *   *Case 2: History Flashcards (Dates).*
          *   Glue: Yes.
          *   Trust: Yes.
          *   Endorsement: Yes.
          *   Conflict: Exam tests *recall*. If flashcards provide recall, does it invalidate the test?
          *   Verdict: No (if the competency being tested is biological recall). This highlights the limit of EMT.
      *   *Case 3: Maths Formula Sheet.*
          *   Glue/Trust/Endorsement: High.
          *   Conflict: Dept rule "Closed Book".
          *   Verdict: Yes (It is extended memory), *but* Panel must decide if "Closed Book" is essential for Maths. Usually, formula sheets are allowed in higher maths, but if strictly banned, this creates the "unwelcome verdict."
          *   *Correction:* The prompt asks for a case where the procedure delivers an *unwelcome* verdict. Let's make the Formula Sheet case the one where EMT says "Yes, it's memory" but the Department insists on "Internal derivation only."

  5.  **Addressing Philosophical Distinctions:**
      *   *Keep:* Parity Principle (functional equivalence), Glue & Trust criteria.
      *   *Discard:* Metaphysical status of mind (Rupert's criticism), Cognitive Bloat (world isn't *all* mind, just specific tools).
      *   *Value Judgements:* What is the "construct" of the exam? EMT can't tell us if we *should* test biological memory or functional problem-solving.

  6.  **Addressing Limitations:**
      *   Individual variation (Idiosyncratic coupling).
      *   The "Cheating" vs. "Cognition" line (security).
      *   The "Competency" line (what are we actually testing?).

  7.  **Drafting the Content (incorporating British English):**
      *   Use terms like "invigilated," "programme," "centre," "reasonable adjustments."
      *   Tone: Professional, academic, practical.

  8.  **Review against Constraints:**
      *   20-minute feasibility? Yes, keep questions binary or scaled simply.
      *   Clear Yes/No termination? Yes.
      *   Value judgements identified? Yes.
      *   Three cases run? Yes.
      *   Limitations stated? Yes.
      *   British English? Yes.

  9.  **Refining the "Unwelcome Verdict":**
      *   The prompt asks to show how the procedure handles the collision with departmental rules.
      *   If the procedure says "This is memory," but the rule says "No memory aids," the procedure must flag this as a "Policy Conflict" rather than a cognitive failure. The panel then has to decide if the policy discriminates.
      *   Let's ensure the Maths case illustrates this: EMT says "It's memory," but the Dept says "We test derivation, not application." The procedure should output "Cognitive Match: YES," forcing the panel to justify the ban on grounds other than cognitive status (i.e., curriculum design).

  10. **Final Polish:** Check the flow. Ensure the distinction between *cognitive status* (EMT's job) and *assessment validity* (Panel's job) is sharp. This is the crucial insight: EMT tells you *what* the aid is, not whether the exam is allowed to ban it.

  *(Self-Correction during drafting)*: I initially thought about allowing the procedure to make the final call. But the prompt asks to identify where value judgements must be handed back. So the procedure should output a recommendation on *cognitive status*, but the final *approval* rests on the *assessment integrity* check. I will structure it as a two-stage filter: 1. Is it Extended Memory? 2. Is it Compatible with Assessment Goals?

  Let's write it.
answer: |-
  **To:** The Reasonable Adjustments Panel
  **From:** Postgraduate Representative
  **Subject:** Proposal for the 'Extended Cognition' Decision Protocol (ECDP)

  ### Introduction

  Colleagues, as we face increasingly complex requests for cognitive aids, our reliance on intuition is becoming a liability. The Extended Mind Thesis (EMT) offers a robust framework for distinguishing between a student *using a tool* and a student *using their mind*. However, we cannot import the metaphysical debates of philosophy of mind into a twenty-minute administrative meeting.

  Below is the **Extended Cognition Decision Protocol (ECDP)**. It operationalises Clark and Chalmers's 'Glue and Trust' criteria into a binary checklist. It is designed to determine the *cognitive status* of an aid. It explicitly brackets metaphysical objections (such as Robert Rupert's criticism that extended systems lack the causal homeostasis of biological memory) because for the purposes of reasonable adjustments, functional equivalence is sufficient. We do not need to prove the aid *is* the mind; we only need to establish that banning it functions as a restriction on the student's cognitive capacity comparable to restricting a biological limb.

  Crucially, the ECDP separates **Cognitive Status** (is this aid part of their cognition?) from **Assessment Validity** (does allowing this defeat the learning outcome?). The former is settled by the protocol; the latter remains a value judgement for the Panel.

  ---

  ### The Extended Cognition Decision Protocol (ECDP)

  **Time Allocation:** 20 Minutes
  **Required Evidence:** Medical/SpLD report, Personal Statement from Student, Module Descriptor.

  #### Phase 1: The Disability Link (2 Minutes)
  *Purpose: To ensure the request falls under the Equality Act (2010) as a compensatory measure, not a general preference.*

  **Q1:** Is there documented evidence of a cognitive impairment (e.g., ADHD, TBI, Dyslexia, Memory Disorder) that affects the specific cognitive function the aid supports?
  *   **No:** **STOP.** Request rejected as not a reasonable adjustment (may be referred to general student support).
  *   **Yes:** Proceed to Phase 2.

  #### Phase 2: The Coupling Criteria (10 Minutes)
  *Purpose: To apply the 'Glue and Trust' criteria. We are testing for functional parity with biological memory.*

  **Q2 (Availability):** Has the aid been in constant use for the duration of the course (or a minimum of 6 months), and is it physically/digitally available to the student at all times during study?
  *   **No:** **STOP.** Verdict: **External Tool.** (The aid is a crutch, not a prosthetic. Deny request for closed-book conditions).
  *   **Yes:** Proceed.

  **Q3 (Trust):** Does the student report relying on the aid without verifying its contents against other sources every time they use it? (i.e., Is the information treated as 'known' rather than 'looked up'?)
  *   **No:** **STOP.** Verdict: **External Tool.**
  *   **Yes:** Proceed.

  **Q4 (Endorsement):** Was the information in the aid originally encoded by the student (or curated by them) during the learning process, rather than provided pre-made immediately prior to the exam?
  *   **No:** **STOP.** Verdict: **External Tool.** (This indicates offloading, not extension).
  *   **Yes:** Proceed.

  **Q5 (Automaticity):** Is the retrieval process from the aid described as fluid and automatic (e.g., 'I just check my app'), rather than involving complex problem-solving to access the data?
  *   **No:** **STOP.** Verdict: **External Tool.**
  *   **Yes:** **VERDICT: COGNITIVE MATCH.** The aid functions as Extended Memory.

  #### Phase 3: The Integrity Check (8 Minutes)
  *Purpose: To handle value judgements that philosophy cannot settle. Even if an aid is 'Extended Memory', the university may still test biological memory.*

  **Q6:** Does the Module Descriptor explicitly state that the competency being assessed is *unaided biological recall* (e.g., 'recall of dates', 'mental arithmetic')?
  *   **Yes:** **HAND BACK TO PANEL.** The ECDP confirms the aid is cognitive, but the curriculum requires biological cognition. The Panel must decide if this requirement constitutes indirect discrimination.
  *   **No:** **RECOMMENDATION: APPROVE.** If the test is of application or understanding, and the aid is cognitive, denying it disadvantages the disabled student without academic justification.

  ---

  ### Philosophical Distinctions: Kept vs. Bracketed

  In simplifying EMT for this protocol, we have made specific choices regarding philosophical debates:

  1.  **Kept: The Parity Principle.** We maintain the distinction between *constitution* (the aid is part of the system) and *causation* (the aid helps the system). If the aid meets Q2–Q5, we treat it as constitutive. This is vital because reasonable adjustments require us to accommodate the *student's capacity*, not just their environment.
  2.  **Bracketed: Cognitive Bloat.** We ignore the fear that if we allow this, the 'mind' extends infinitely. The protocol's strict duration and encoding requirements (Q2, Q4) prevent 'bloat'. We do not need to argue about whether the internet is part of the mind; we only care about *this* app for *this* student.
  3.  **Bracketed: Rupert's Objection.** Critics argue extended systems lack the internal homeostasis of biological memory. We ignore this. For legal and pedagogical purposes, functional reliability (Q3) is sufficient. We are not making a claim about the nature of consciousness, but about the *functional impact of removal*.

  ---

  ### Case Studies

  Here is the ECDP applied to three current cases.

  #### Case 1: The ADHD Phone App (Working Memory Scaffolding)
  *   **Context:** Student with ADHD requests a specific task-management app in a closed-book exam.
  *   **Phase 1:** Documented ADHD affecting working memory. (Pass)
  *   **Phase 2:**
      *   Q2 (Availability): Used since Sixth Form, always on phone. (Pass)
      *   Q3 (Trust): Student states, "I don't double-check it; if it's not there, I've forgotten." (Pass)
      *   Q4 (Endorsement): Student populates the tasks personally during revision. (Pass)
      *   Q5 (Automaticity): Retrieval is habitual. (Pass)
      *   **Verdict:** **Cognitive Match.**
  *   **Phase 3:**
      *   Q6 (Integrity): Exam tests problem-solving, not memory of the task list itself. (Pass)
  *   **Outcome:** **Approve.**
  *   **Caveat:** Security. The protocol establishes the *right* to the cognitive aid, but the invigilation team must ensure the app cannot access the internet. The Panel should mandate a 'kiosk mode' device rather than the student's personal phone.

  #### Case 2: History Flashcards (Dates)
  *   **Context:** Student with acquired brain injury requests annotated flashcards in a closed-book History exam.
  *   **Phase 1:** Documented memory impairment. (Pass)
  *   **Phase 2:**
      *   Q2–Q5: The flashcards are constantly used, trusted, personally annotated, and accessed automatically.
      *   **Verdict:** **Cognitive Match.**
  *   **Phase 3:**
      *   Q6 (Integrity): The rubric explicitly tests "Recall of chronological dates without aid."
      *   **Result:** **HAND BACK TO PANEL.**
  *   **Panel Deliberation:** The ECDP confirms the flashcards *are* the student's memory. However, the Department asserts that biological recall of dates is a core competency of a History degree. The Panel must now decide: Is this competency essential, or does it discriminate against those with memory impairments? If the latter, the exam design must change. If the former, the adjustment is rejected, but on grounds of *curriculum design*, not cognitive status.

  #### Case 3: The Mathematics Formula Sheet (The Unwelcome Verdict)
  *   **Context:** Mathematics student requests a personally compiled formula sheet. Department rule: "All exams strictly closed-book to test derivation fluency."
  *   **Phase 1:** Student argues anxiety/cognitive load issues (documented). (Pass)
  *   **Phase 2:**
      *   Q2–Q5: The sheet is compiled over the term, trusted implicitly, and consulted automatically during problem-solving. It functions as his long-term memory for formulas.
      *   **Verdict:** **Cognitive Match.**
  *   **Phase 3:**
      *   Q6 (Integrity): Department rule states the test is of "derivation fluency" (implying internal access).
      *   **Result:** **HAND BACK TO PANEL.**
  *   **The Collision:** The ECDP classifies the sheet as Extended Memory. The Department rule bans Memory Aids.
  *   **Panel Action:** This creates a direct conflict. The procedure forces the Panel to acknowledge that banning the sheet is equivalent to banning a portion of the student's memory. The Panel cannot simply say "rules are rules." You must now vote on whether "derivation fluency without aids" is a *bona fide* occupational requirement of a Mathematics degree. If the ECDP says "This is his memory," and you ban it, you are effectively testing him with a lobotomy. The procedure forces the burden of justification onto the Department to prove why *biological* recall is necessary over *functional* mathematical competence.

  ---

  ### Limitations and Honesty Clause

  The Panel must be aware of what the ECDP cannot do:

  1.  **Idiosyncratic Coupling:** Two students may use the identical aid (e.g., the same app). For Student A, it may meet all Glue and Trust criteria (Extended Memory). For Student B, it may be a novel crutch (External Tool). The Panel must resist the urge to create blanket policies on specific technologies; the assessment must remain individual.
  2.  **The 'Cheating' Vector:** The ECDP assesses cognitive status, not security. An aid can be 'Extended Memory' but still allow communication with outsiders. Security checks remain the invigilator's domain, separate from this Panel's cognitive assessment.
  3.  **Curriculum Gatekeeping:** The ECDP cannot force a Department to change what they test. It can only expose when a test design disproportionately penalises disabled cognition. In Case 2 and 3, the procedure may return a 'Cognitive Match' verdict that the Panel is still forced to reject due to programme accreditation requirements. In these instances, the procedure serves not to grant the adjustment, but to flag the curriculum as potentially discriminatory.

  ### Conclusion

  This procedure moves us from intuition to evidence. It accepts the philosophical premise that cognition extends beyond the skull without getting bogged down in metaphysical disputes. It grants the aid when it is functionally memory, and it forces us to take responsibility when we deny it despite that fact.

  I move that we adopt the ECDP for the upcoming term.
