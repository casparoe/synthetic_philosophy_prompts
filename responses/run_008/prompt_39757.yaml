      *   *Refining the "Weapon" Scene:* Ensure the distinction is clear: Google Translate fails because it lacks a model; *Arrival*'s humans fail because they project *their own* model (war) onto the aliens. This is a crucial distinction. Hofstadter says "No model = no meaning." *Arrival* says "Wrong model = dangerous meaning."

  10. **Final Review against constraints:**
