  2.  *"If prediction works, the description is true"* (Min 15): Head off after showing the case study succeeds. Use the **epicycles analogy** (no names). Predicting planets ≠ sun-centric orbits. High loss reduction ≠ ontological reality.
  3.  *"It's just matrices, so no facts"* (Min 20): Head off before Q&A. Counter with **bugs**. Code is just voltages, but bugs are real structural facts. Don't let them retreat to nihilism.

  **Unresolved**
  Explicitly state: "I will not tell you if features are Platonic forms or useful fictions. We lack a metric for 'truth' beyond utility."

