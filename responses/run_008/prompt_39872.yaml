      *   *The Physicist's Instinct:* "It's all just reliability."
      *   *Evaluation:* The instinct is *mostly* right but misses a normative nuance. Metrology cares about *predictive reliability* (will it work next time?). Epistemology cares about *normative standing* (do you deserve credit? is it safe?).
      *   *The "Residue":* Measurement theory handles the *external* reliability (calibration, uncertainty budgets). Philosophy handles the *internal* state (understanding, justification). A clock can be calibrated (reliable) without "knowing" anything. A human can be reliable without understanding *why* (a "black box" predictor). The *Meno* asks about the *human* state, not just the output.

