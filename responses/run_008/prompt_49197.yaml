answer: |-
  ### 1. Audit of the Analogy: Taste vs. Morality

  | (a) Element of the taste case | (b) Proposed moral counterpart | (c) Does the mapping hold? | (d) Is it load-bearing for the 'merely verbal' conclusion? | (e) Comment |
  | :--- | :--- | :--- | :--- | :--- |
  | **Standard of taste** | Moral code or framework | Partially | Yes | Taste standards are biological/idiosyncratic; moral codes claim intersubjective authority and rational justification. |
  | **The bearer of the standard** | The individual agent | Partially | No | While both involve agents, moral agents typically claim their standard applies to *others*, not just themselves. |
  | **The predicate (e.g., "tasty")** | Moral predicate (e.g., "wrong") | Partially | Yes | Taste predicates describe subjective experience; moral predicates prescribe action and imply objective bindingness. |
  | **The apparent disagreement** | Moral disagreement | No | Yes | Taste disputes often dissolve upon acknowledging relativity; moral disputes persist as conflicts over how to act. |
  | **Faultlessness** | Moral faultlessness | Partially | Yes | In taste, faultlessness is intuitive; in morality, claiming an opponent is not "wrong" undermines the normative force of the judgment. |
  | **Change in standards** | Moral progress (e.g., abolition) | No | Yes | Fashion changes arbitrarily; moral progress is understood as error-correction, not mere stylistic shift. |

  ### 2. Analysis of Disanalogies

  To determine whether the professor's conclusion holds, we must distinguish between disanalogies that are superficial and those that strike at the logical core of the "merely verbal" claim.

  **Disanalogies that do not matter:**
  The difference in the *bearer of the standard* is less critical. Even if moral standards are communal rather than individual (unlike taste), relativism can accommodate this by relativizing truth to communities rather than persons. Similarly, the linguistic form of the *predicate* (grammatically) is similar enough; both use adjective-like structures ("is tasty," "is wrong"). These surface features do not inherently block the relativist interpretation.

  **Disanalogies that matter:**
  The critical failures lie in the nature of the *apparent disagreement*, the *prescriptive pressure*, and the account of *change in standards*.

  First, regarding **genuine disagreement**, the taste analogy supports the idea that there is no unqualified truth, but it does not support the claim that the dispute is "merely verbal." In taste, once we realize I am a supertaster and you are not, we often cease arguing because the stakes are low. In morality, even if we grant relativism, the conflict remains substantive because we are coordinating action. If I say "meat is wrong" and you say "meat is permissible," we cannot both act on our judgments simultaneously regarding a shared meal or policy. The disagreement is practical, not just propositional. Therefore, the move from "relative truth" to "merely verbal" is unsupported by the taste case, which rarely involves conflicting action plans.

  Second, the **prescriptive pressure** reveals a deep fissure. Taste judgments lack a "demand of correctness." I do not try to persuade you that cilantro is soapy; I expect you to accept my report of my experience. Moral judgments, conversely, come with a felt demand for universal assent. We offer reasons, arguments, and justifications, behaving *as if* there is a fact of the matter. If the analogy held, moral argumentation would be as puzzling as arguing someone into having a different sensory experience. The persistence of rational persuasion in ethics suggests participants treat the domain as substantive, unlike taste.

  Third, the **fashion comparison for moral change** is inconsistent with the possibility of being wrong within a code. If moral progress is like hemlines, then the abolitionist was not *correct* and the slaveholder *incorrect*; they were just *different*. However, moral progress is conceptually tied to the idea that the previous state was a *mistake* that was corrected. Relativizing this to "change" strips the concept of progress of its normative content. A better relativist model would allow that within a developing moral framework, earlier stages can be judged as errors by later standards, but the fashion analogy implies arbitrariness that contradicts the reasoned nature of moral reform.

  ### 3. Verdict and Alternative Analogy

  The professor's conclusion that moral disputes are **merely verbal** does not survive the audit. While the taste analogy successfully illustrates how truth might be relative to a standard, it fails to capture the normative force, practical conflict, and error-correcting nature of moral discourse. Relativism about truth does not entail that disagreements are verbal; two lawyers can disagree substantively about what the law requires even if the law is relative to a jurisdiction.

  A better analogy for the picture that survives (relative truth without verbal emptiness) is **Legal Jurisdictions** or **Rules of a Game**. In a game, a move can be "illegal" relative to the rules. If two players disagree on a rule, they are not having a merely verbal dispute; there is a fact of the matter relative to the rulebook they are playing under. Furthermore, rules can change (progress), but the change is often driven by a desire to improve the game (correcting flaws), not merely arbitrary fashion. This preserves the relativity of the standard without dissolving the substantiveness of the disagreement or the reality of improvement.

