answer: |-
  ### 1. Essay Question

  **Topic:** Knowledge-How vs. Knowledge-That  
  **Time:** 60 Minutes  
  **Instructions:** Answer the following question in a structured essay. You do not need to cite specific authors, but you must use the concepts discussed in class.

  **The Scenario:**  
  A graduate student memorizes every troubleshooting fact in a mass spectrometer manual (error codes, pressure limits, voltage specs) but cannot fix the machine when it fails. A retired technician arrives, places a hand on the pump housing, listens to the vibration, gives it a specific tap, and fixes it. Later, the technician's actions are written into a perfect protocol: "Place hand here, listen for X frequency, tap at Y intensity." A second student follows this protocol exactly and fixes the machine.

  **The Prompt:**  
  Did the second student acquire **knowledge-how** to fix the machine, or merely **knowledge-that** the protocol works? 

  In your answer, you must:
  1.  Define the distinction between knowledge-how and knowledge-that.
  2.  Apply the **regress argument** to the second student's use of the protocol. Does following the protocol require prior knowledge-how, or is it purely propositional?
  3.  Evaluate the **intellectualist counterattack**: If the protocol succeeds, does this prove that knowledge-how is just a special kind of knowledge-that?
  4.  Conclude with your own reasoned position on what the protocol managed to capture (or what it missed).

  ***

  ### 2. Model Answer

  The distinction between knowledge-that and knowledge-how is central to understanding human ability. Knowledge-that is propositional; it is knowing facts, such as knowing that the pressure limit is 5 torr. Knowledge-how is practical; it is knowing to ride a bike or fix a spectrometer. Traditionally, philosophers like Ryle argued these are distinct categories, while intellectualists argue that knowledge-how is simply knowledge-that under a practical mode of presentation.

  In the case of the second student, the answer depends on whether following the protocol counts as exercising an ability or merely reciting facts. If the student acquires knowledge-how, it supports the intellectualist view. The protocol converts the technician's physical actions into propositions (statements about where to place hands, what to listen for). If the student succeeds by knowing these propositions, then the technician's skill was arguably propositional all along, just unspoken. The protocol captured the necessary truths about the machine's operation.

  However, the regress argument challenges this. To follow the protocol, the student must know how to interpret the instructions. "Listen for X frequency" requires the ability to distinguish frequencies. "Tap at Y intensity" requires motor control. If knowing-how is just knowing-that, the student would need another rule to tell them how to follow the first rule, leading to an infinite regress. They would need a manual on how to read the manual. Since the student successfully fixes the machine without an infinite chain of manuals, they must possess some antecedent knowledge-how—basic abilities to listen, move, and interpret—that the protocol cannot capture.

  Therefore, the protocol likely did not transmit pure knowledge-how. It transmitted knowledge-that *conditional* on existing knowledge-how. The technician's original action involved a direct engagement with the machine—a "feel" that bypasses explicit rules. The protocol approximates this by codifying the observable parts, but it relies on the student already knowing how to embody those instructions. If the student lacked the basic ability to hear the difference in vibration, the protocol would be useless.

  Ultimately, I argue the second student gained a hybrid state. They gained knowledge-that regarding the specific steps, which allowed them to exercise their existing knowledge-how effectively. The intellectualist is partially right: the steps can be propositionalized. But the Rylean is also right: those propositions are inert without the underlying ability to execute them. The protocol captured the *strategy*, but not the *capacity*. Thus, knowledge-how cannot be fully reduced to knowledge-that, because the application of any "that" always rests on a foundational "how" that resists codification.

  ***

  ### 3. Marking Scheme (Total: 20 Points)

  **I. Conceptual Accuracy (6 Points)**
  *   **A (5-6 pts):** Clearly defines knowledge-that (propositional/factual) and knowledge-how (practical/dispositional) without conflating them.
  *   **B (3-4 pts):** Definitions are present but slightly vague or rely on examples without explaining the underlying category difference.
  *   **C (0-2 pts):** Definitions are missing, incorrect, or confused (e.g., treating them as the same thing immediately).
  *   *Common Mistake:* Defining knowledge-how simply as "experience" rather than a distinct epistemic category.

  **II. Application of the Regress Argument (8 Points)**
  *   **A (7-8 pts):** Explicitly runs the regress: argues that following the protocol requires knowing *how* to follow it, showing that propositions alone are insufficient. Connects this directly to the "listening/tapping" details in the case.
  *   **B (4-6 pts):** Mentions the regress or the need for interpretation but fails to explain *why* it stops the intellectualist reduction. Applies generally but misses the specific case details.
  *   **C (0-3 pts):** No mention of the regress, or claims the protocol solves everything without addressing the rule-following gap.
  *   *Common Mistake:* Stating the regress argument exists but not applying it to the protocol scenario (the "define then stop" failure mode).

  **III. Engagement with Intellectualist Counter & Conclusion (6 Points)**
  *   **A (5-6 pts):** Seriously considers the intellectualist view (that the protocol proves skill is propositional) before refuting or qualifying it. Conclusion offers a nuanced synthesis (e.g., hybrid view or conditional dependency).
  *   **B (3-4 pts):** Takes a side (Yes or No) but treats the opposing view as obviously wrong without argument. Conclusion is repetitive.
  *   **C (0-2 pts):** No clear conclusion or fails to address the intellectualist possibility.
  *   *Common Mistake:* Dismissing intellectualism without acknowledging why the protocol's success makes it tempting.

  **Grading Note on the "Define then Stop" Cap:**
  To score in the **A range (17-20)**, a student must score at least **7 points in Section II** and **5 points in Section III**. Even if a student achieves full marks in Section I (Definitions), they cannot exceed **16 points (Low B)** if they fail to apply the regress argument or evaluate the counterattack. This ensures that memorizing definitions without philosophical application cannot result in an A grade.
