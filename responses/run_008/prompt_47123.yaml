prompt: |-
  quick backstory so you know who you're dealing with: i'm a retired physical chemist — 38 years in a spectroscopy lab, mostly mass spec and NMR — and since retiring i've gotten deep into philosophy, mostly epistemology. turns out it's harder than thermodynamics. i help out with an evening intro philosophy course at the community college (grading, review sessions) and the instructor lets me draft one practice exam question per term. this term i get to pick the topic, and i'm picking knowing how vs. knowing that, because after a lifetime at the bench i have actual opinions about this.

  you are an expert epistemologist who also has lots of experience teaching intro-level courses — please write from that combination. and please think carefully before answering, maybe brainstorm two or three angles internally first and pick the best one. don't just hand me the standard textbook summary, i've read enough of those, they all blur together.

  here's what i want: one essay question on the knowing-how / knowing-that distinction that a student CANNOT answer by reciting Ryle. it has to force them to actually run the regress argument and decide whether it works, and to take seriously the intellectualist counterattack — the idea that knowledge-how ascriptions might just be a special case of knowledge-that (if you know the Stanley and Williamson line that's the one, but the students shouldn't need names to answer). it also has to make them use a concrete case instead of floating in abstractions.

  for the concrete case use something based on my own life, feel free to polish: a new grad student who has memorized every troubleshooting fact about the old mass spec — every error code, the whole manual, basically — but still calls the retired technician, who walks in, puts a hand on the pump housing, listens, and fixes it. now suppose we write down everything the technician does — the hand, the listening, the little tap on the side — into a perfect protocol, and the next student follows it to the letter and fixes the machine too. did that student thereby acquire knowledge-how? if yes, what exactly did the protocol-writer manage to capture; if no, what's missing? (i genuinely don't know my own answer here, which is maybe why i like it.)

  deliverables:

  1. the essay question itself, answerable in 60 minutes in class by intro students with only the course readings
  2. a model answer, ~500-600 words, at the level a genuinely top intro student could plausibly reach (not a professor's answer)
  3. a marking scheme out of 20 points total, with the specific moves an A answer must make, what a B answer typically does instead, and a one-line note on the most common mistake for each must-hit point

  one thing i care about a lot: the rubric has to seperate the students who memorized the labels from the ones who can actually do something with the distinction. in my grading experience the biggest failure mode is a student who defines the distintion correctly and then just... stops. build the rubric so that stopping caps them at a B.

  no citations, no page numbers, no reading list at the end — students won't have books with them and neither will i honestly. length/format: question, then model answer, then rubric with point values adding to 20. write your output cleanly — the typos here are mine, not the students', ha.
