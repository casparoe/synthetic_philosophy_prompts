answer: |-
  This is a profoundly astute observation. You have identified the precise fault line where the metaphysics of action cracks under the weight of criminal policy. As a philosopher of action looking at the English law of complicity, specifically the doctrine of common purpose (or joint enterprise), one is struck by a dissonance between the *official ontology* of the law (which claims to be individualist) and its *operational structure* (which behaves collectivistically).

  Here is my reconstruction of the implicit theory of collective intentionality within the doctrine, distinguishing between what the law claims to do and what its rules strictly require to function.

  ### 1. The *Jogee* Correction: The Reductionist Façade

  Let us begin with the 2016 correction in *R v Jogee*. The Supreme Court insisted that liability must be grounded in the individual's mental state. Foresight of a possibility is no longer a sufficient *mens rea*; it is merely evidence from which a jury may infer an intention to assist or encourage the principal.

  **Philosophical Fit:** This is explicitly **Reductionist**. It aligns with Michael Bratman's account of shared intention. For Bratman, "we intend to J" is nothing over and above "I intend that we J" and "You intend that we J", meshed with mutual knowledge. *Jogee* attempts to dissolve the collective entity back into its atomic parts. It says: do not look for a group mind; look for *your* intention regarding *his* act.

  **Confidence:** High. The judgment is textually committed to methodological individualism. It seeks to purge the law of any hint of vicarious liability or guilt by association.

  **The Problem:** If the law were truly Bratmanian reductionist, the doctrine of common purpose would be redundant. Ordinary aiding and abetting (accessorial liability) covers interlocking individual intentions. The fact that "joint enterprise" remains a distinct category of analysis suggests it is doing work that simple reductionism cannot explain.

  ### 2. Conditional Intention and the "Single Unit"

  *Jogee* saved the doctrine from collapse by leaning heavily on **conditional intention**. The Court posited that if D and P set out to rob, and D foresees P might kill, D intends to assist P *if* the need arises. Thus, when P kills, D is liable because D intended the assistance of that very act (conditionally).

  **Philosophical Fit:** This is where the Reductionist story strains. While Bratman can account for conditional intentions, the *legal usage* here treats the contingency plan as a **shared script**. It presupposes that D and P are operating within a single normative framework where "resistance met with violence" is a branch of *our* plan, not just *your* act that *I* anticipated. This leans towards John Searle's notion of **we-intention**, where the intention is primitive and collective ("We intend to rob, including necessary violence") rather than derived from individual components.

  **Confidence:** Medium-High. The law treats the contingency as part of the *joint* design. However, I am less certain whether this strictly *requires* Searle's metaphysics or if it is simply a robust application of Bratman's "sub-plan" consistency. I will return to this uncertainty at the end.

  ### 3. Withdrawal: The Smoking Gun for Non-Reductionism

  The rules on withdrawal are, philosophically, the most revealing. Under *R v O'Flaherty* and subsequent authorities, an accomplice cannot simply change their mind and walk away. To withdraw, they must communicate that withdrawal to the other parties (and sometimes take reasonable steps to prevent the crime). Mere cessation of participation is insufficient.

  **Philosophical Fit:** This is inexplicable on a strict Reductionist view. If my intention is a mental state internal to me, why does changing that mental state not absolve me? Why must I communicate?
  This rule presupposes **Margaret Gilbert's Theory of Joint Commitment**. For Gilbert, when we form a joint intention, we create a new normative entity: a "plural subject". This creates mutual obligations. You cannot unilaterally dissolve the commitment; you must release the other party from the expectation of your support. The communication requirement exists because the liability attaches not merely to your causal contribution, but to your continued membership in the **plural subject**. As long as you are a member of the "we", you are answerable for the "we"'s acts.

  **Confidence:** Very High. This is the strongest evidence that the doctrine presupposes a non-reductionist ontology. The law treats the agreement as a binding normative tie that survives the internal change of mind of one participant.

  ### 4. Fundamental Departure: The Boundaries of the "We"

  Conversely, the law limits liability via the "fundamental departure" rule (stemming from *R v English*). If the principal acts outside the scope of the agreed joint enterprise (e.g., they bring a knife when only fists were agreed), the accessory is not liable.

  **Philosophical Fit:** This defines the **content of the collective intention**. It suggests that the "plural subject" has specific boundaries. Liability flows from the shared design, not merely from presence. This fits both Searle and Gilbert, but it clashes with a pure agency model (like partnership law) where authority might be broader. It implies that the "group mind" has a specific intentional object, and acts outside that object are not acts of the group.

  **Confidence:** High. This rule confirms that the law is interested in the *scope* of the shared plan, not just causal contribution.

  ### 5. Comparative Context: Company vs. Partnership

  Your comparison is illuminating.
  *   **Company Law (Identification Doctrine):** *Tesco v Nattriss*. The company is only liable if the "directing mind and will" committed the act. This is highly **Reductionist**. It refuses to aggregate the intentions of low-level employees. It treats the corporation as a fiction that only acts through specific human atoms.
  *   **Partnership Law (Civil):** Partners are agents for one another. This is **Relational**. It relies on authority and representation, not necessarily shared mind.
  *   **Criminal Joint Enterprise:** This sits awkwardly between them. It is not like the Company law model (low-level participants are liable for the acts of others). It is not quite the Partnership model (liability isn't based on agency/authority granted, but on *shared intent*).

  **Reconstruction:** Criminal joint enterprise presupposes a **Normative Partnership**. It treats the group as a partnership for the purpose of the crime, where each partner is an agent of the others, *but* the authority is derived from the joint commitment itself rather than a contract of agency.

  ### 6. Synthesis: The Implicit Theory

  If I must reconstruct the implicit theory of collective intentionality that the English criminal law actually employs (as opposed to the one it claims in *Jogee*), it is this:

  **The Doctrine presupposes a Gilbertian Plural Subject with Reductionist Constraints.**

  1.  **Ontology:** It treats the conspiratorial group as a **Plural Subject** (Gilbert). This explains why withdrawal requires communication (dissolving the commitment) and why liability extends to the acts of others within the scope (acts of the plural subject).
  2.  **Mens Rea Constraint:** However, due to the principle of personal culpability, it overlays a **Reductionist filter** (*Jogee*). It demands that the individual must have intended to join this plural subject and intended (conditionally) that its aims be carried out.

  The law wants the *efficiency* of collective liability (holding the gang responsible as a unit) without the *metaphysical baggage* of collective guilt (insisting everyone is individually at fault).

  ### 7. Counterfactual: Rebuilding on a Joint-Commitment View

  If the law were rebuilt explicitly on a Gilbertian Joint-Commitment view, rather than the current hybrid, the following changes would likely occur:

  **Convictions that would fall (Acquittals):**
  *   **The "Foresight" Cases:** Cases where D merely foresaw P's violence but never committed to a plan involving it would be harder to convict. Under a strict joint-commitment view, if D did not commit to the *possibility* of violence as part of the "we", they are not a party to that specific plural subject. *Jogee* tries to achieve this via "conditional intent," but a Gilbertian approach would be stricter: did you commit to *this* version of the plan?
  *   **Passive Presence:** Mere presence with foresight would definitely cease to be sufficient. One cannot be "committed" to a joint enterprise passively.

  **Acquittals that would fall (Convictions):**
  *   **Failed Withdrawal:** Currently, if D communicates withdrawal but P ignores it and proceeds, D is often still liable (unless they take reasonable steps to prevent). A pure Joint-Commitment view might argue that once the commitment is dissolved via communication, D is no longer part of the "we". However, Gilbert herself notes that one cannot dissolve a commitment without the other's consent *or* special circumstances. So, the law might actually remain similar here, but the *reasoning* would shift from "causal contribution" to "status within the group".
  *   **Scope Disputes:** A Joint-Commitment view might broaden liability for "natural consequences" if those consequences are seen as inherent to the type of commitment undertaken (e.g., "we are committing a violent robbery" implies a commitment to violence), whereas the current "fundamental departure" rule is quite narrow.

  **The Structural Shift:**
  The trial would focus less on "Did D intend to assist P?" (a dyadic relation) and more on "Was D a member of the criminal collective at the time of the offence?" (a group status).

  ### 8. Confidence and Uncertainty

  **Confidence Levels:**
  *   **Withdrawal Rules imply Non-Reductionism:** I am **90% confident**. The communication requirement is inexplicable without a normative tie between agents.
  *   **Jogee's Official Story is Reductionist:** I am **95% confident**. The text is explicit.
  *   **Fundamental Departure defines Group Boundaries:** I am **85% confident**.
  *   **Comparison to Company Law:** I am **80% confident**. The distinction is clear, though the "directing mind" doctrine is itself philosophically contested.

  **The Least Certain Part:**
  I am least sure about the philosophical status of **Conditional Intention** in *Jogee*.
  *   *Uncertainty:* Does the legal construct of "conditional intent to assist if resistance is met" truly map onto a Bratmanian interlocking intention, or does it smuggle in a Searlean we-intention?
  *   *Reasoning:* Bratman can handle conditional intentions ("I intend that we rob, and I intend to assist you if you use force"). However, the *Jogee* judgment treats the contingency as part of the *shared* plan's scope, which feels more Searlean. If it is Bratmanian, the reductionist project holds. If it is Searlean, *Jogee* has inadvertently reinstated the collective mind it sought to banish. I suspect the courts are using the term "intention" to do the work of "commitment" without admitting it. I would place my confidence in this specific classification at only **60%**.

  ### Conclusion

  The doctrine of common purpose is a philosophical hybrid. It speaks the language of individualism (*Jogee*) but operates on the logic of collectivism (Withdrawal and Departure rules). It presupposes that when two people form a criminal plan, they become a single normative unit for the duration of that plan, a unit that can only be dissolved by specific performative acts (communication).

  To untie your tangle: The law does not believe in a mystical group mind, but it *pragmatically* treats the agreement as creating a binding normative structure that functions *as if* there were a group mind. It is a **fiction of unity** sustained by **rules of commitment**. *Jogee* tried to deny the fiction while keeping the rules, which is why the tension you perceive remains palpable. The law is underdetermined because it refuses to choose between the metaphysics of the individual and the sociology of the gang.
