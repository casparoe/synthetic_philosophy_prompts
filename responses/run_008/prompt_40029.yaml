answer: |-
  This is a sophisticated version of a "Race to the Bottom" argument, heavily influenced by **Public Choice Theory** and a rigid interpretation of **economic determinism**. It sounds compelling because it is internally consistent, but it fails because it treats a complex, multi-variable system as a single-variable equation.

  Your roommate's argument is most vulnerable at **Step (5)**, but the mechanism that allows Step (5) to stand relies on a falsehood in **Step (4)**.

  Here is the breakdown of where the argument slips, the cost of rejecting it, and at which level the conclusion is false.

  ### 1. Where the Argument Slips

  **The Primary Slip: Step (5)**
  > *"Therefore any standard that has survived for decades... can only have survived because it wasn't actually costly to the people with the most pull."*

  This is a **tautology** (circular logic) disguised as an insight. It defines "costly" as "anything that doesn't survive." By this definition, gravity is "not costly" to a bird because the bird survives it.

  The error here is conflating **gross cost** with **net cost**.
  *   **Gross Cost:** Weekends *did* cost capitalists 16% of potential production time (going from 6 days to 5). Lead-free paint *did* cost manufacturers more in R&D and materials.
  *   **Net Cost:** These measures survived not because they were free, but because the **alternative was more expensive.**

  If capitalists had refused weekends, they faced higher turnover, lower hourly productivity, and potentially revolution. If banks refused deposit insurance, they faced systemic bank runs that would wipe out *all* deposits. The "people with the most pull" accepted these costs not because they were benevolent, but because they were **buying stability.** Step (5) ignores that paying for stability is still a cost, even if it prevents a larger loss.

  **The Secondary Slip: Step (4)**
  > *"In each of those competitions the same principle applies, so a rule that's genuinely costly to whoever has the most pull gets eroded..."*

  This assumes that "whoever has the most pull" is a static monolith (usually capital). It ignores **Countervailing Power.**
  In a democracy (or even in a labor market), "pull" is not fixed. Unions, consumer boycotts, and voting blocs generate their own "pull." When a union organizes, it changes the competition dynamic. It makes the cost of *not* having a rule higher than the cost of having it. Step (4) assumes the political marketplace is perfectly efficient at serving capital, but history shows it is often inefficient, sticky, and susceptible to pressure from below.

  ### 2. What It Costs to Reject the Premise

  If you reject Step (5) and (4), you are rejecting **Cynical Determinism** in favor of **Contingent Agency.**

  *   **The Roommate's Cost:** To accept his view, you must believe that human agency is an illusion. You have to believe that the 40-hour work week appeared spontaneously because capitalists realized it was "free," rather than because workers struck, died, and lobbied for it. You must ignore the fact that many regulations *were* eroded (e.g., Glass-Steagall) when the balance of power shifted, proving that the rules *were* costly and only held while the "pull" was sufficient.
  *   **Your Cost:** To reject his view, you must accept uncertainty. His argument is comforting in a dark way: if nothing matters, you don't have to try. Rejecting it means accepting that outcomes are not guaranteed. You might organize and lose. But it also means you might organize and win. The "cost" is the burden of responsibility.

  ### 3. At Which Level Is the Conclusion False?

  The conclusion ("Union organizing is pointless") is false at **all three levels**, but most critically at the **Rule-Making Level.**

  **A. The Firm Level (Step 1 & 2)**
  *   **False.** Firms do not always minimize costs to the absolute floor. They compete on brand, reputation, and retention. A firm that treats workers better often has lower turnover and training costs.
  *   **Union Relevance:** A union changes the firm's cost structure. It makes the cost of *exploitation* higher than the cost of *cooperation*. It forces the firm to internalize costs it was previously dumping on workers (injury, burnout, poverty).

  **B. The Rule Level (Step 5)**
  *   **False.** Regulations *are* costly. Compliance departments exist because rules cost money. If they weren't costly, corporations wouldn't spend billions lobbying to weaken them. The fact that they fight them proves they are costly. They survive because the *political cost* of removing them is higher than the *compliance cost* of keeping them.

  **C. The Rule-Making Level (Step 3 & 4) — **The Critical Failure Point****
  *   **Most False.** This is where your roommate's argument collapses. He views rule-making as a competition *among elites* (jurisdictions vs. jurisdictions, regulators vs. regulators). He excludes the **public** and the **workforce** as competitors in that arena.
  *   **Union Relevance:** Union organizing is not just about bargaining with a firm; it is about building a bloc that competes in the rule-making arena. A unionized workforce has more "pull" (Step 4) than a fragmented one. By organizing, you are not "taking credit for rules that were going to happen anyway"; you are **altering the balance of pull** that determines which rules happen.

  ### How to Beat the Argument

  Your roommate is describing a system in equilibrium. He is saying, "Look at the world as it is, and assume it is the only possible version of the world."

  Here is the counter-move:
  **"You are confusing 'survival of the fittest' with 'survival of the status quo.'"**

  1.  **The "Cost" Fallacy:** Ask him: "If weekends weren't costly to capital, why did they fight them for 100 years?" The fact that they fought proves it was costly. The fact that we have them proves workers had enough power to make the cost of *denying* weekends higher than the cost of *granting* them.
  2.  **The "Pull" Fallacy:** His argument assumes power is static. But power is dynamic. Unions are technology for aggregating power. Before unions, the "pull" was 100% capital. After unions, it might be 60% capital, 40% labor. That shift changes the rules.
  3.  **The "Pointless" Fallacy:** If his theory were true, corporations would never lobby. They would just accept all regulations as "inevitable." The fact that they spend billions to *stop* regulations proves that regulations are not inevitable; they are the result of a contest.

  **Summary:**
  The argument slips at **(5)** because it defines away the conflict that created the standard. It is false at the **Rule-Making Level** because it ignores that workers can generate "pull" to rival capital. Union organizing is precisely the mechanism by which you change the math in Step (4), making it "costly" for the powerful to *ignore* you, rather than costly to *accommodate* you.
