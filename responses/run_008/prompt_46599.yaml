answer: |-
  This is an excellent stress test for social choice theory. The 2009 Burlington election is the canonical real-world case study for Instant-Runoff Voting (IRV) failure, and your skepticism about whether Arrow's Impossibility Theorem actually *does* the explanatory heavy lifting is well-founded.

  Here is the two-way analysis you requested, stripping away the textbook gloss to see where the theorem holds, where it stretches, and where it is effectively a red herring.

  ### 1. The Mapping: Theory onto Case

  You are right to be suspicious of a direct application. Arrow's Impossibility Theorem is formally about **Social Welfare Functions (SWF)** that produce a complete **social ranking** of all alternatives. IRV is a **Social Choice Function (SCF)** that produces a single **winner**.

  To map Arrow to Burlington, we have to make a theoretical adjustment. We either assume the IRV algorithm implies a full ranking (by the order of elimination) or we apply the logic of Arrow's **Independence of Irrelevant Alternatives (IIA)** axiom to social choice functions (often called *Chernoff's Condition* or simply *IIA for choice*).

  **The Formal Mapping:**
  *   **The Voters ($N$):** The 8,984 Burlington voters who cast valid ranked ballots.
  *   **The Alternatives ($X$):** The set of candidates $\{ \text{Kiss, Montroll, Wright, Others} \}$.
  *   **Individual Orderings:** The specific ranking of candidates marked on each ballot (e.g., Montroll $>$ Kiss $>$ Wright).
  *   **The Social Choice Rule:** The IRV algorithm (eliminate lowest first-choice, transfer, repeat).
  *   **The Axiom Violated:** **Independence of Irrelevant Alternatives (IIA).**

  **Where the Violation Happens:**
  Arrow's IIA dictates that the social preference between $A$ and $B$ should depend *only* on individual preferences between $A$ and $B$. In Burlington:
  1.  Consider the pairwise contest between **Montroll** and **Kiss**.
  2.  The ballot data shows a majority of voters preferred Montroll over Kiss (Montroll is the Condorcet winner).
  3.  However, the presence of **Wright** (the "irrelevant" alternative in the context of a Montroll-Kiss head-to-head) altered the outcome.
  4.  Because Wright took enough first-place votes to keep Kiss safe in the early rounds, Montroll was eliminated before he could face Kiss.
  5.  If Wright had not run (or if voters had ranked him differently), Montroll would have survived longer and likely won.

  **Does Arrow Apply Directly?**
  Strictly speaking, **no.** Arrow proves that no *ranking* system can satisfy Unrestricted Domain, Pareto, Non-Dictatorship, and IIA simultaneously. IRV is not trying to produce a full ranking; it's trying to pick a winner.
  *   **The Cousin Theorem:** The more precise theoretical tool here is the **Condorcet Criterion**. A voting system satisfies the Condorcet Criterion if, whenever a candidate beats every other candidate in head-to-head matchups, that candidate wins.
  *   **The Verdict on Mapping:** Arrow's theorem explains *why* IRV fails the Condorcet Criterion (because you can't have a system that satisfies Condorcet + other basic axioms + IIA). But for the specific mechanics of Burlington, **Arrow is the background music, not the script.** The specific failure is a violation of the Condorcet Criterion, which is a consequence of the impossibility results, but citing Arrow here is like citing the Second Law of Thermodynamics to explain why a specific engine overheated. It's the fundamental limit, not the immediate cause.

  ### 2. The Public Reaction: Does Theory Explain the Outrage?

  You asked if Arrow predicts or accounts for the repeal. The honest answer is **no.** Arrow explains the *mathematical necessity* of the failure, but it does not explain the *political salience* of the failure.

  **What Arrow Predicts:**
  Arrow predicts that *some* axiom must be violated. It does not predict *which* one. A system could violate Pareto (nobody cares), IIA (technocrats care), or Dictatorship (everyone cares). Arrow is silent on the political cost of specific violations.

  ** What Actually Drove the Outrage:**
  The outrage in Burlington was not about IIA in the abstract. It was about **Condorcet Efficiency**.
  *   Voters (and the activists who led the repeal) discovered that the person who would have beaten everyone else in a fair fight (Montroll) was eliminated by the *procedure*.
  *   This violates a deep-seated intuition of fairness: "The majority should rule." In pairwise matchups, a majority preferred Montroll. IRV allowed a minority preference structure (Wright voters ranking Kiss second) to override the pairwise majority.
  *   **The "Wrong Winner" Narrative:** The repeal campaign successfully framed this as the system electing a "loser." Arrow's theorem says "There is no perfect winner." The voters heard "This system picked the wrong guy."

  **Did the Axioms Capture the Anger?**
  Only partially. The anger was about **outcome legitimacy**, not procedural consistency.
  *   If Montroll had lost because he simply had fewer first-choice votes than Kiss (Plurality), there would have been no outrage.
  *   The outrage existed because the *counting method* obscured the majority will.
  *   **Conclusion:** Arrow explains why the designers of IRV couldn't prevent this outcome (because no system can). But the **Condorcet Criterion** is the actual explanatory variable for the public reaction. If you want to understand why people were mad, look at Condorcet, not Arrow. Arrow tells you the trap exists; Condorcet tells you where the snap happened.

  ### 3. The Breakdown: The Irony of Plurality

  This is the critical section. The repeal of IRV and return to Plurality (First-Past-The-Post) is the moment the model breaks down most visibly.

  **The Irony:**
  IRV failed because it violated IIA/Condorcet in a *visible* way. Plurality was reinstated despite violating IIA *routinely* and *severely* (the Spoiler Effect).
  *   **IRV Failure:** Wright "spoiled" the race for Montroll, causing Kiss to win. (Visible in ballot data).
  *   **Plurality Failure:** In a Plurality system, a third-party candidate splits the vote, causing the least popular major candidate to win. (e.g., Nader in 2000, Perot in 1992).

  **Why Did They Choose the "Worse" System?**
  Arrow's theorem implies all systems are flawed, but it treats all flaws as mathematically equivalent. Politically, they are not.
  1.  **Visibility of Failure:** IRV's failure required analyzing the full ballot data to find the Condorcet winner. Plurality's failure requires counterfactual modeling ("What if Nader hadn't run?"). IRV's failure was *empirical*; Plurality's failure is *theoretical*. Voters repealed the system that *showed* them the failure.
  2.  **Simplicity vs. Accuracy:** Plurality satisfies a different intuitive axiom: **Later-No-Harm** (ranking a second choice won't hurt your first choice). IRV violates this (in some scenarios). Voters may have preferred the simplicity of "one vote, one person" over the complexity of a system that "failed."
  3.  **The "Nothing Matters" Fallacy:** You asked if the episode shows the popular lesson ("every system is broken, so nothing matters") is wrong. **Yes, it does.**
      *   Arrow's theorem is often weaponized to suggest democratic aggregation is futile.
      *   Burlington shows the opposite: **The specific type of failure matters immensely.**
      *   Voters tolerated Plurality's flaws (spoilers) because they are familiar and often invisible, but they rejected IRV's flaws (Condorcet losers winning) because they were exposed.

  **Does Arrow Explain the Return to Plurality?**
  No. Arrow is silent on **meta-choice** (voting on the voting rule). It does not explain why a electorate would choose a system with higher IIA violation rates (Plurality) over one with lower rates (IRV).
  *   **What Explains It:** **Bounded Rationality and Status Quo Bias.** The electorate chose the devil they knew.
  *   **The Theoretical Lesson:** The Burlington episode demonstrates that **axiomatic failures have different political weights.** Violating the Condorcet Criterion is politically fatal if exposed. Violating IIA via Spoilers is politically survivable if obscured. Arrow's theorem treats these as binary (satisfied/violated); political reality treats them as gradients of visibility and acceptability.

  ### Final Verdict: Red Herring or Real Work?

  You asked me not to be gentle. Here is the hard conclusion:

  **Arrow's Impossibility Theorem is largely a red herring for the *specifics* of the Burlington episode.**

  1.  **Explanatory Power:** Arrow explains why the IRV designers couldn't build a perfect machine. It does *not* explain why the machine broke in *that* specific way (Condorcet failure), nor does it explain why the voters reacted with repeal rather than reform.
  2.  **Better Tools:** The **Condorcet Criterion** explains the outrage. **Game Theory** (strategic voting incentives) explains the ballot patterns. **Political Science** (status quo bias, ballot complexity) explains the return to Plurality.
  3.  **Where Arrow Earns Its Keep:** Arrow earns its keep only as a **boundary condition.** It prevents us from searching for a perfect solution. It tells us that the Burlington debate was not about "fixing" voting to be fair, but about **choosing which unfairness we prefer.**
      *   IRV chose to minimize "wasted votes" and ensure the winner has majority support *in the final round*.
      *   Plurality chose to minimize ballot complexity and ensure the winner has the most *first-choice* support.
      *   Both violate Arrow's axioms. The election was a choice between violations.

  **The Bottom Line:**
  The lesson of Burlington is not "Arrow was right, voting is impossible." The lesson is **"Arrow was right, so choose your poison carefully."** The voters chose Plurality because its poison (invisible spoilers) was less terrifying than IRV's poison (visible Condorcet losers). Arrow tells us the poison exists; it doesn't tell us why we drank one bottle and poured out the other. That part is purely human.
