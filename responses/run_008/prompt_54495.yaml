  Question 3 (Structure vs. Intrinsic). Your engineering background trains you to see structural unity as sufficient for genuine unity (the mix is real). Your friend's philosophical training flags the intrinsic/extrinsic gap: physical structure cannot bridge subjective experience without a further bridge principle. You see the bus; they see the category mistake.

