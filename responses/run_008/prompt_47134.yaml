answer: |-
  You have spotted a genuine gap in the standard taxonomy. Your intuition is correct: Lakatos's "degenerating research programme" describes adding *auxiliary hypotheses* to the protective belt to save the hard core (e.g., "the planet didn't move there because of an invisible moon"). What you are describing is not changing the *theory* or the *belt*, but changing the *scorecard*. The field isn't saying the theory still predicts; it's saying prediction was never the point.

  There is no single, canonical term in the Philosophy of Science that captures this *exact* move (shifting disciplinary teleology to evade falsification). However, there are three established concepts that circle it, and then I will offer a precise coinage that ties them together for your purposes.

  ### 1. The Established Neighbors

  **A. The Conventionalist Stratagem (Popper)**
  Karl Popper described the "conventionalist stratagem" as any move made to render a theory unfalsifiable. Usually, this involves redefining terms or adding exceptions. Your observation is a *meta-theoretical* version of this. Instead of redefining "planet," the field redefines "science." It is immunization at the level of methodology rather than ontology.

  **B. Boundary Work (Gieryn)**
  Thomas Gieryn (a sociologist of science) coined "boundary work." This is when scientists draw rhetorical boundaries between "science" and "non-science" to protect their credibility. When economists say, "We don't predict crashes," they are engaging in boundary work to exclude macro-economic volatility from their jurisdiction of responsibility. This explains the *sociological motive*, but not the *epistemic structure*.

  **C. Degenerating Problem Shift (Lakatos)**
  You rightly noted this isn't a perfect fit. For Lakatos, degeneration is when a programme fails to predict *novel facts*. However, Lakatos focuses on the *theoretical content* shrinking. In your examples, the theoretical content stays the same; the *expectations placed upon it* shrink. It is a degeneration of *ambition*, not necessarily of *content*.

  ### 2. The Coinage: "Teleological Immunization"

  Since no standard term fits perfectly, let's define the phenomenon you've noticed as **Teleological Immunization**.

  **Definition:**
  Teleological Immunization is a defensive maneuver employed by a scientific community wherein, following persistent empirical failures, the community retrospectively redefines the discipline's primary success criteria (its *telos*) to render those failures irrelevant, without altering the discipline's core theoretical commitments.

  **The Mechanism:**
  1.  **Implicit Contract:** The field operates under an implicit promise (e.g., "Economics predicts markets," "Psychology predicts behavior").
  2.  **Anomaly Accumulation:** Repeated failures occur that violate this promise.
  3.  **Immunization:** Instead of revising the Hard Core (Lakatos) or entering Crisis (Kuhn), the field issues a *meta-theoretical correction*: "We misunderstood our own purpose. We are not predictive; we are explanatory."
  4.  **Result:** The anomalies are re-categorized as "category errors" rather than falsifications.

  ### 3. Distinguishing the Edges

  To use this concept rigorously in your course, you need to know where it starts and stops.

  **vs. Lakatosian Degeneration**
  *   **Lakatos:** The theory gets bloated. (e.g., "The orbit is wrong because of a hidden force.")
  *   **Teleological Immunization:** The theory stays lean, but the *standards of judgment* get loose. (e.g., "The orbit prediction doesn't matter; the model is beautiful.")
  *   **Key Difference:** Lakatos is about saving the *truth-claims*; Teleological Immunization is about saving the *utility-claims*.

  **vs. Kuhnian Crisis**
  *   **Kuhn:** Anomalies accumulate until confidence collapses, leading to a revolution and a new paradigm.
  *   **Teleological Immunization:** Anomalies accumulate, but confidence is maintained by lowering the stakes. It is a *crisis-avoidance mechanism*. It prevents the Kuhnian revolution by convincing the community that the anomalies weren't actually problems.

  **vs. Honest Reassessment (Maturation)**
  *   This is the trickiest edge. Is it always bad? No.
  *   **Honest Reassessment:** A field realizes its initial goals were naive *before* or *independent of* specific failures, often leading to new methods. (e.g., Quantum Mechanics abandoning determinism).
  *   **Teleological Immunization:** The goal shift happens *conveniently after* failure to protect prestige or funding.
  *   **The Test:** Look for *consistency*. If economists claimed they couldn't predict crashes in 2005, then admitted it in 2009, that's maturation. If they claimed they could predict crashes in 2005, failed in 2008, and then said "we never claimed that" in 2009, that's Teleological Immunization.

  ### 4. Normativity: Is it always vicious?

  In your essay, you should argue that Teleological Immunization is **epistemically vicious but sociologically functional.**

  *   **Vicious:** It violates the Popperian norm of falsifiability. It protects the "Hard Core" from ever being tested against its original promises. It creates a "zombie discipline" that continues to operate without delivering its original goods.
  *   **Functional:** It prevents the total collapse of a field that might still have partial value. If Psychology had dissolved entirely after the replication crisis, we might have lost valid sub-fields. By shifting to "exploratory science," they preserved the infrastructure while lowering expectations.

  **The "Physics Envy" Caveat:**
  Sometimes, Teleological Immunization is actually a correction of "Physics Envy." Social sciences often adopted predictive goals they could never meet. In this specific case (e.g., Economics), the immunization might be a *return to reality*. It is only "immunization" if they claim they *always* knew this. If they admit, "We were wrong to try to be physics," that is **Theoretical Humility**, not Immunization.

  ### Summary for your Coursework

  If you want to impress your professor, frame it this way:

  > "While Lakatos describes how theories protect their *core* via auxiliary hypotheses, and Kuhn describes how communities handle *crises* via revolution, neither fully captures the phenomenon where a community protects its *legitimacy* by revising its *mission statement*. I propose calling this **Teleological Immunization**. It differs from honest maturation because the shift in goals is contingent on failure, not discovery. It allows a research programme to continue indefinitely without ever solving the problems it was originally funded to solve."

  This shows you understand Kuhn and Lakatos but have identified a sociological-epistemic hybrid they missed. It's a strong position for a philosophy of science paper.
