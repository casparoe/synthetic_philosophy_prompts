      *Decision:* Defensibility is the wrong frame for *belief*, but crucial for *action*. The action is determined by the intersection of uncertainty and risk.

      *Let's refine the "Peerhood" knot.* Since we can't agree on peerhood, we must treat the disagreement as *radical*. Radical disagreement under high stakes mandates precaution.

