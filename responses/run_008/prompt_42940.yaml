answer: |-
  The heat from the burning archive was physical, a wall pressing against their faces, but the two men stood close to the flame, illuminated by the destruction of the records they had spent lifetimes theorizing about. In Ranke's hand were the three surviving sheets, salvaged from a box before the roof fell. In White's, a cigarette that glowed in time with the burning beams above.

  "It is a matter of triangulation," Ranke said, his voice stiff against the crackle of timber. "Look at them. The Prefect calls it a disturbance quelled by order. The worker calls it a massacre of the innocent. The journalist calls it a spontaneous eruption of primal hunger. They cannot all be true. Therefore, by weighing the bias of each, we can approximate the shape of the thing itself."

  White exhaled smoke into the hot night air. "You speak as if the event is a statue buried under mud, and we are merely brushing away the dirt. But these reports are not dirt, Leopold. They are already statues. The Prefect hasn't just lied; he has emplotted the event as a comedy of errors where authority restores sense. The worker has shaped it into a tragedy of martyrdom. The journalist? He wants romance. Adventure. You aren't weighing evidence. You are choosing which genre you prefer to inhabit."

  "That is sophistry," Ranke snapped, shielding the papers from a shower of sparks. "In the parish register, twelve names were added that week. Twelve bodies buried. No plot changes the fact of the dead. If I write a history that says no one died, I am not choosing a genre. I am wrong."

  "Ah, but why twelve?" White countered, turning to face him. "Why not the hundreds the worker claims vanished into unmarked pits? You choose the parish register because it suits your plot of administrative continuity. You privilege the state's count over the worker's grief. That is an aesthetic choice, not an empirical one. The bodies are real, yes. But the *history* is the decision to make those twelve bodies the boundary of the truth."

  Ranke stiffened, his pride wounded not by the theory, but by the implication of carelessness. "You confuse the freedom of the novelist with the bondage of the historian. I do not choose the register because it fits a plot. I choose it because the source resists me. If I try to write that the grain store did not burn, the ash chokes my pen. The documents refuse to cooperate. This resistance is not a constraint of language, Hayden. It is the weight of the past itself. It disciplines the imagination. If I ignore it, the structure collapses. That difference between collapse and standing—that is objectivity."

  "The structure collapses only within the rules of the game you invented," White said softly. "You say the ash chokes your pen. I say you have decided that ash is more authoritative than memory. You treat the sources as witnesses to be cross-examined, but they are texts to be deconstructed. The Prefect minimizes the riot because his role in the script is the Restorer of Order. If you strip away his emplotment, you don't find the riot. You find silence. And into that silence, you pour your own narrative of 'how it actually was.' You are just another poet, pretending to be a judge."

  "And you would have us write nothing but confessions of our own subjectivity?" Ranke gestured to the burning building. "The fire consumes the records. Soon, even the parish register will be gone. Will you say the fire did not happen because we lack the narrative to contain it?"

  "The fire is happening," White said. "But tomorrow, when we describe it, you will write a tragedy of lost knowledge. I might write an irony about the impermanence of evidence. The fire is real. The history is the story we tell about what the fire means."

  Ranke looked down at the three sheets in his hand. The heat was becoming unbearable. "Then we are wasted here. If the story is all that matters, let the building burn. But I tell you, this journalist's account... it says the mob stormed the mill at dawn. The Prefect says noon. The worker says evening."

  "Three different times for three different riots," White said.

  "No," Ranke said, folding the papers sharply. "One of them is lying about the light. The mill's logbook, may it rest in peace, would have said. But lacking that, the journalist claims he arrived the morning after. He could not have seen the dawn storm. He is fabricating."

  White smiled, a thin, dry expression. "On that, we agree. The journalist is garbage. He's writing pulp fiction to sell to foreigners. His emplotment is clumsy. He forces the facts to fit a adventure serial."

  "He is inaccurate," Ranke corrected.

  "He is clichéd," White said. "But you see? You feel better now. You have purged the bad text. You think this brings you closer to the truth. I think it just leaves you with the two remaining plots to choose from."

  Ranke ignored the jab. He looked back at the inferno. The roof of the archive groaned and gave way, sending a column of orange sparks into the black sky.

  "It burns," Ranke said. "Regardless of what we write tomorrow, the building is gone."

  "The building is gone," White agreed. "But whether that is a catastrophe or a liberation depends entirely on who holds the pen."

  Ranke tucked the three sheets into his coat, protecting them from the heat. "I will write that twelve died. Because the register said so."

  "And I," White said, dropping his cigarette and crushing it under his heel, "will write that twelve were allowed to be counted."

  They stood together in the silence that followed the collapse, watching the same fire, seeing entirely different things.
