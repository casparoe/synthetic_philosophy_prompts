prompt: |-
  I run capital projects for a county public works department, and I'm starting to think my job is basically running a slow-motion dollar auction. You know the game Shubik invented -- auction off a dollar bill, highest bidder gets the dollar but the *second* highest bidder also has to pay their bid and gets nothing, so once two people are in, each new bid is to avoid eating a total loss rather than to win. We do a version of this constantly: a treatment plant retrofit that's at 180% of budget and "six months from done" (for the last two years), a legal fight with a contractor where we've spent more in fees than the disputed amount and neither side will fold, and a flood-mapping software project where the vendor keeps telling us we're 90% there. My boss calls it "seeing things through." The county commissioners call it waste. I honestly can't tell which cases are which anymore.

  What I want is a decision procedure my project review committee can actually run at each quarterly gate -- three people, about a half hour, none of us are behavioral economists. It should be grounded in the actual escalation-of-commitment stuff: why sunk costs should be irrelevant to the continue/kill call, but also the part people skip, which is that some escalation isn't sunk-cost fallacy at all. A friend of mine who did econ keeps telling me that in the dollar auction itself, bidding past a dollar can be rational if you're trying to minimize loss rather than win, and that quitting because "I've paid enough" is its own bias in reverse when the auction is competitive -- like our contractor fight, where walking away hands the other side everything and they know it. I don't fully understand where that line is (irrational escalation vs strategic entrapment vs just being right to finish what you started because most of the remaining cost is genuinely behind you) but I suspect the procedure has to sort those three apart, not just say "don't fall for sunk costs." Also: whatever you write has to be blame-resistant, because the person who champions a project sits on the committee that votes to kill it, so anything that turns into "whose fault is it" gets gamed immediately -- I'd rather the questions force forward-looking numbers than retrospectives.

  Run the procedure on three cases: the treatment plant retrofit (I actually suspect the answer is keep going, which will make the commissioners furious and I want the reasoning laid out so it survives that meeting), the contractor litigation, and the flood-mapping software. Tell me honestly which steps are judgment calls dressed up as procedure, and where the committee just has to eat a values question instead of computing one -- e.g. whether reputational damage to the department counts as a real cost. And flag any place where you think the procedure will misfire, like cases it structurally can't distinguish. No citations needed, I just need something we can print on two pages and actually use.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Capital projects manager for a county public works department.
      *   **Problem:** Projects feel like "dollar auctions" (escalation of commitment). Difficulty distinguishing between irrational sunk-cost fallacy, strategic entrapment (rational escalation to minimize loss), and genuine near-completion.
      *   **Goal:** A practical decision procedure for a quarterly project review committee (3 people, 30 mins, non-experts).
      *   **Constraints:** Blame-resistant (champion sits on committee), forward-looking (no retrospectives), printable (2 pages), honest about limitations/judgment calls.
      *   **Specific Cases to Test:** Treatment Plant Retrofit (180% budget, "6 months out" x2), Contractor Litigation (fees > dispute, neither folding), Flood-Mapping Software (vendor says 90% done).
      *   **Tone:** Pragmatic, cynical but constructive, economically grounded but accessible.

  2.  **Deconstruct the Economic/Psychological Concepts:**
      *   **Sunk Cost Fallacy:** Ignoring past costs, focusing only on future marginal cost vs. marginal benefit.
      *   **Dollar Auction (Escalation of Commitment):** Bidding >$1 to avoid losing the bid amount. Rational *if* the alternative (losing the bid) is worse than the cost of the next bid *and* there's a credible path to ending the auction. Irrational if the auction has no end or the opponent has infinite resources.
      *   **Strategic Entrapment:** Continuing because stopping signals weakness or guarantees a worse outcome (e.g., litigation where settling now admits liability).
      *   **The "90% Done" Syndrome:** Often means 90% of the *easy* work is done, 90% of the *remaining* work is left.

  3.  **Drafting the Procedure (The "Kill/Continue" Protocol):**
      *   *Requirement:* Must be blame-resistant.
      *   *Solution:* Focus entirely on *Future* Cost vs. *Future* Value. Ban the word "spent."
      *   *Structure:* Three Gates/Questions.
      *   *Gate 1: The Fresh Start Test.* If we weren't doing this, would we start it today? (Classic sunk cost check).
      *   *Gate 2: The Exit Cost.* What happens if we stop *right now*? (Addresses the Dollar Auction/Strategic aspect).
      *   *Gate 3: The Completion Confidence.* Is the "90%" real? (Addresses technical uncertainty).

  4.  **Refining the Procedure for the User's Constraints:**
      *   *Blame Resistance:* Instead of "Who messed up?", ask "What has changed since the last approval?"
      *   *Forward Looking:* All inputs must be estimates of *future* spend and *future* recovery.
      *   *Time Limit:* Needs to be fast. Use a scoring sheet or a simple flowchart logic.
      *   *The "Dollar Auction" Nuance:* The procedure needs to explicitly account for the cost of *quitting*. In a dollar auction, quitting costs the bid. In construction, quitting might mean demolition costs + new procurement time + legal penalties.

  5.  **Developing the "Three-Question Protocol":**
      *   *Q1 (The Market Test):* If this project were a new opportunity today, with the *remaining* budget required, would we fund it? (Filters out pure sunk cost).
      *   *Q2 (The Surrender Price):* What is the hard cost of stopping today? (Contract termination, legal judgment, demolition). This captures the "rational escalation" logic.
      *   *Q3 (The Truth Metric):* What independent evidence proves the "90%" claim? (Filters out optimism bias).

  6.  **Applying to the Three Cases:**
      *   *Treatment Plant:*
          *   Q1: Probably No (too expensive).
          *   Q2: High (half-built plant is useless/hazardous, new procurement takes years).
          *   Q3: Hard to verify.
          *   *Verdict:* Likely Continue, but with extreme prejudice on the timeline. Why? Because the "Surrender Price" is higher than the "Completion Cost."
      *   *Litigation:*
          *   Q1: No (wouldn't sue for this amount now).
          *   Q2: High (admit liability, pay full claim).
          *   Q3: N/A (Legal strategy).
          *   *Verdict:* Depends on the "Surrender Price" vs. "Next Legal Bill." If the next bill is \$50k and settlement is \$500k, fight. If next bill is \$500k and settlement is \$500k, settle.
      *   *Software:*
          *   Q1: Maybe/No (tech moves fast).
          *   Q2: Low (license fees stop, data exportable?).
          *   Q3: Low (vendor says 90%, no independent test).
          *   *Verdict:* Kill or Pause. High risk of infinite dollar auction.

  7.  **Addressing the "Judgment Calls" and "Values":**
      *   *Reputation:* Is it a number? No. It's a political shield.
      *   *Commissioner Anger:* Real cost (budget cuts later).
      *   *Blame:* The procedure can't stop politics, only structure the argument.
      *   *Misfire:* The procedure can't detect collusion or incompetence disguised as complexity.

  8.  **Formatting for "Two Pages":**
      *   Keep intro brief.
      *   Use bold headers.
      *   Create a "Worksheet" feel.
      *   Add a "Limitations" section at the end (crucial for honesty).

  9.  **Review against User's "Dollar Auction" Insight:**
      *   The user's friend is right: Bidding \$1.05 for a \$1 bill is rational if you already bid \$1.00 and the alternative is losing \$1.00 to win nothing.
      *   My procedure needs to validate this. Q2 (Surrender Price) is the key. If Surrender Price > Completion Cost, you continue, even if Total Cost > Value. This is *loss minimization*, not fallacy.
      *   I need to make sure the Treatment Plant recommendation reflects this. If the plant is 180% over but stopping means scrapping it (100% loss) + starting over (200% cost), continuing at 190% is the rational economic choice, even if it looks like waste.

  10. **Final Polish:**
      *   Ensure tone is peer-to-peer (professional, slightly weary, sharp).
      *   Check the "Blame-Resistant" requirement. Avoid "Why did this happen?" Use "What has changed?"
      *   Ensure the "Values" section is explicit.

  *(Self-Correction during drafting)*: I initially thought about suggesting a scoring system. But scoring systems get gamed. A binary decision tree based on hard numbers is harder to game. Let's stick to a "Threshold Test."
  Also, need to make sure I don't give legal advice on the litigation case, but frame it as a project decision.
  The "Treatment Plant" recommendation needs to be robust enough to survive the Commissioners. The argument isn't "we spent a lot," it's "stopping costs more than finishing."

  11. **Final Output Structure:**
      *   Title.
      *   The Philosophy (1 paragraph).
      *   The Protocol (The 3 Questions).
      *   The Worksheet (Fill-in-the-blanks).
      *   Case Applications.
      *   The "Fine Print" (Limitations/Judgment Calls).

  Let's write it.cw
answer: |-
  # The "Forward-Look" Project Gate Protocol
  **Purpose:** To distinguish between *irrational escalation* (throwing good money after bad) and *strategic loss minimization* (spending to reduce a larger guaranteed loss).
  **Constraint:** No discussion of past spend. No attribution of fault.
  **Time:** 30 Minutes.

  ## Part 1: The Three Questions
  *At each quarterly gate, the Committee must answer these three questions using **only** estimates of future cost and future value.*

  ### 1. The "Fresh Start" Test (Sunk Cost Filter)
  **Question:** If we were not currently doing this project, and a vendor proposed delivering the *remaining* scope for the *remaining* budget, would we approve it today?
  *   **Yes:** Proceed to Q2.
  *   **No:** This project is technically a "zombie." It only lives because of past spend. **Presumption: KILL**, unless Q2 proves stopping is more expensive.

  ### 2. The "Surrender Price" Test (Dollar Auction Filter)
  **Question:** What is the hard, immediate cost of terminating this project *today*? (Include contract termination fees, legal judgments, demolition of partial work, cost to re-procure from scratch).
  *   **Compare:** [Surrender Price] vs. [Cost to Complete]
  *   **Logic:** If **Surrender Price > Cost to Complete**, continuing is **Rational Loss Minimization**, even if Total Project Cost > Original Value. You are buying your way out of a worse contract.
  *   **Logic:** If **Surrender Price < Cost to Complete**, continuing is **Escalation of Commitment**. You are paying a premium to avoid admitting defeat.

  ### 3. The "Independent 90%" Test (Uncertainty Filter)
  **Question:** What objective, third-party evidence confirms the "% Complete" status? (e.g., Passed pressure test, code module signed off by IT security, not "vendor email").
  *   **High Confidence:** Proceed.
  *   **Low Confidence:** Apply a 50% contingency to the [Cost to Complete] immediately. If this breaks the budget, **KILL**.

  ---

  ## Part 2: The Worksheet (Fill this out before the meeting)

  | Metric | Treatment Plant Retrofit | Contractor Litigation | Flood-Mapping Software |
  | :--- | :--- | :--- | :--- |
  | **A. Remaining Cost to Complete** | $__________ | $__________ (Next legal fees) | $__________ |
  | **B. Value of Finished Asset** | $__________ (Operational value) | $__________ (Dispute amount) | $__________ (Utility of map) |
  | **C. Surrender Price (Cost to Stop)** | $__________ (Demolition + New Procurement) | $__________ (Settlement/Judgment) | $__________ (Data loss + Switch cost) |
  | **D. Fresh Start Approval?** | [ ] Yes [ ] No | [ ] Yes [ ] No | [ ] Yes [ ] No |
  | **E. Completion Evidence** | ___________________ | ___________________ | ___________________ |

  **Decision Rule:**
  1.  If **D = No** AND **C < A**: **KILL**. (It's a bad deal, and quitting is cheap).
  2.  If **D = No** AND **C > A**: **CONTINUE**. (It's a bad deal, but quitting is worse. You are in a Dollar Auction).
  3.  If **D = Yes**: **CONTINUE**, but reset baseline budget to (Past Spend + A).

  ---

  ## Part 3: Application to Your Cases

  ### 1. Treatment Plant Retrofit (The "White Elephant")
  *   **The Numbers:**
      *   **A (Complete):** High (let's say $5M more).
      *   **B (Value):** High (Plant is critical infrastructure, value is essentially infinite/mandatory).
      *   **C (Surrender):** Very High. You cannot leave a half-built plant. Demolition is costly. Re-procurement takes 18 months + inflation.
      *   **D (Fresh Start):** **No.** You would never bid $180% of budget today.
  *   **The Verdict:** **CONTINUE.**
  *   **The Reasoning:** This is **Rational Loss Minimization**. You are not "finishing the project"; you are "buying out of a termination clause." The Commissioners see waste; you must frame this as *liability avoidance*.
  *   **Script for Commissioners:** "Stopping now costs us $X in demolition and leaves us without a plant for 2 years. Finishing costs $Y. $Y is less than $X. We are not spending to win; we are spending to stop the bleeding."

  ### 2. Contractor Litigation (The "Dollar Auction")
  *   **The Numbers:**
      *   **A (Complete):** Next quarter legal fees (e.g., $100k).
      *   **B (Value):** Disputed amount (e.g., $200k).
      *   **C (Surrender):** Full claim amount + legal fees to date (e.g., $250k).
      *   **D (Fresh Start):** **No.** You wouldn't sue for this amount now.
  *   **The Verdict:** **CONDITIONAL CONTINUE.**
  *   **The Reasoning:** This is a pure Dollar Auction. You are bidding $100k to avoid losing $250k. It is rational *only if* there is a credible end-game.
  *   **The Trap:** If the contractor knows you *must* fight to avoid the Surrender Price, they will drag it out.
  *   **Action:** Set a "Walk-Away Bid." If legal fees exceed 50% of the disputed amount, settle immediately. The procedure forces you to admit when the auction price exceeds the value of the dollar bill.

  ### 3. Flood-Mapping Software (The "90% Syndrome")
  *   **The Numbers:**
      *   **A (Complete):** Vendor says $200k.
      *   **B (Value):** $500k (Efficiency gains).
      *   **C (Surrender):** Low. Data is exportable? License stops. Switch to competitor costs $100k.
      *   **D (Fresh Start):** **Maybe/No.** Tech is aging.
      *   **E (Evidence):** Vendor status report only.
  *   **The Verdict:** **KILL / PAUSE.**
  *   **The Reasoning:** Fails the Evidence Test. "90%" is likely the 90% of the *easy* work. Because Surrender Price is low, you are not trapped.
  *   **Action:** Demand independent code audit. If vendor refuses, trigger termination clause. Do not pay the next invoice.

  ---

  ## Part 4: The Fine Print (Where the Procedure Fails)

  **1. The "Reputation" Variable (Values, Not Math)**
  The protocol treats "Surrender Price" as hard dollars. It does not count "Commissioner Anger" or "Department Reputation."
  *   **The Judgment Call:** Sometimes you must finish a losing project because killing it signals incompetence that costs you next year's budget.
  *   **How to Handle:** If the Committee votes to continue a "KILL" recommendation, they must explicitly log it as a **Political Hedge**. This protects the staff ("We advised kill") and forces the politicians to own the waste ("They ordered continue").

  **2. The "Competence" Blind Spot**
  This procedure assumes the [Cost to Complete] estimates are honest. If your Project Manager is incompetent, they will lowball [Cost to Complete] to keep their project alive.
  *   **The Fix:** Require the [Cost to Complete] to be signed off by a *different* PM or an external estimator. If the Champion estimates their own finish line, the protocol is gamed.

  **3. The "Infinite Auction" Risk**
  In the Litigation case, the opponent can keep bidding forever. The procedure minimizes loss *relative to the current state*, but doesn't account for an opponent with deeper pockets who *wants* you to bleed.
  *   **The Fix:** Hard Cap. "If Total Legal Fees > 75% of Dispute Amount, Automatic Settlement." This removes the Committee's ability to escalate emotionally.

  **4. Blame Resistance Limit**
  You asked for blame-resistance. This protocol achieves it by banning the word "spent." However, if a project is killed, the Champion *will* feel blamed.
  *   **The Mitigation:** Frame the decision as "Market Conditions Changed." The Fresh Start Test implies the project *was* good once, but the *remaining* work is no longer a good buy. It validates the past while killing the future.

  **Summary for your Committee:**
  Print Part 1 and Part 2. Use Part 3 to prep your arguments. Use Part 4 to protect yourself when the numbers say "Kill" but the politics say "Go." If you follow the math on the Treatment Plant, you can look the Commissioners in the eye and say: "I am recommending this not because I love the project, but because quitting is more expensive than finishing." That is a language they understand.
