prompt: |-
  I'm presenting at a small workshop next month on personhood and moral status — maybe twenty philosphers, mostly analytic metaphysicians and ethicists who think of persons as paradigmatically individual substances, plus one Kantian who thinks anything short of rational agency as the ground of dignity is false advertising, and one scholar of African philosophy who has spent her career fighting romanticized readings of ubuntu. My paper defends a relational view in the ubuntu tradition, the core thought being the Nguni saying that a person is a person through other persons. But I'm doing two things with it that I think are new-ish and that I expect will take the hits. First, I argue personhood comes in degrees and can be gained and lost — it's an ongoing achievement sustained by relationships rather than a status you hold once and forever. Second, I claim this isn't just a warm gloss on human interdependence but actually does work in applied ethics: I use it to argue that people with advanced dementia don't lose moral standing even as they lose the psychological capacities the analytic folks care about, because their personhood is partly held in trust by their relationships. Honestly I'm not 100% sure those two moves fit together and I suspect someone in that room will notice.

  Give me my Q&A prep sheet: the eight or so objections I'll actually get from this particular room — not the generic ones any relational view attracts, but the ones these people with these commitments will raise, phrased the way they'd put it — ordered by how much damage each would do, with a reply I can deliver in about two minutes and a note on where the reply is soft or concedes something. I'd also like to know which objections I should just concede up front to buy credibility for the rest. And include the one question I'm hoping nobody asks. Please write it as continuous prose, like a long email from a friend who's good at this — no headings, bullet points, bold text, or tables, just paragraphs. Tell me how confident you are in the different parts of the prep, flag the single point you're least sure of, and be upfront about where you think my own position is weakest, so I know where the prep sheet itself might be steering me wrong.
