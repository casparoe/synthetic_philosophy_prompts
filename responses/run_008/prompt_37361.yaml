prompt: |-
  I run a non-specialist reading evening for colleagues in history and economics, and next month I have to explain Schelling's idea of the threat that leaves something to chance in about 40 minutes. Plan the session for me, don't just explain it. The trouble I keep having is that the obvious entry point -- "it can be rational to be irrational" -- just sounds like a slogan and makes people think deterrence theory is glorified bluffing. So: what has to be established first (I'm guessing the difference between deterrence and compellence, and what a threat even is when carrying it out is worse for both sides than not carrying it out), which single running example should carry the whole thing (something where risk is only partially controlled, not a clean ultimatum), and the misconceptions people will form in the order they'll form them. I expect at least "the point of the weapons is to use them" and "brinkmanship is just poker", but tell me which ones actually show up and where in the sequence each gets absorbed. Also tell me what I should flatly refuse to get into at this level (I assume actual force postures / escalation ladders?) and what one question at the end would let me check they got the core idea rather than just enjoying the paradoxes.
