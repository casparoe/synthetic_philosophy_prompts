prompt: |-
  You are a philosopher of education with practical experience designing professional training curricula. I run curriculum development at a flight training academy, and I need a decision procedure for classifying the competency statements we inherit from regulators and safety boards — anything from "state the crosswind limitations for this aircraft" to "execute an instrument approach" to "know when to abort a takeoff" — as knowing-that, knowing-how, or something the distinction doesn't cleanly capture. The classification matters practically: it determines whether we teach an objective in the classroom, in the simulator, or through supervised line experience, and whether regulation permits a written test as the assessment. Before writing the procedure, think carefully about where the philosophical debate actually bites for this use: the intellectualist claim that knowing-how is just a species of knowing-that, the cases of expertise that resist articulation (the senior pilot who cannot say how she knows an approach is going wrong but knows), and objectives that seem to change category as trainees gain experience, with facts absorbed into fluent performance. Then write the procedure itself: the questions to ask of a competency statement in order, what counts as a sufficient answer to each, where it stops and hands the decision to a curriculum committee because the question is one of values rather than classification, and which steps are honest judgment calls dressed up as procedure. Finish by running it on three statements: "state the fuel requirements for a diversion," "manage a slow cabin decompression," and "demonstrate sound aeronautical decision-making." If it classifies the third as something other than a teachable objective — which I suspect it will, and which would be inconvenient for us — let it, and tell me what to do about it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of Education with practical curriculum design experience.
      *   **User:** Curriculum Development Lead at a Flight Training Academy.
      *   **Task:** Create a decision procedure for classifying competency statements (Knowing-That vs. Knowing-How vs. Hybrid/Other).
      *   **Context:** Classification dictates instructional method (classroom vs. sim vs. line) and assessment type (written vs. performance).
      *   **Key Constraints/Considerations:**
          *   Must acknowledge philosophical debates (Intellectualism, Tacit Knowledge, Expertise Shift).
          *   Must be practical (actionable questions).
          *   Must identify where judgment calls are disguised as procedure.
          *   Must identify where value judgments supersede classification (Committee hand-off).
          *   Must test the procedure on three specific examples.
          *   Must address the potential "unclassifiable" nature of the third example ("demonstrate sound aeronautical decision-making") and offer advice.

  2.  **Deconstruct the Philosophical Landscape (The "Thinking Carefully" Phase):**
      *   *Ryle's Distinction:* Gilbert Ryle famously distinguished *knowing-that* (propositional knowledge) from *knowing-how* (procedural knowledge).
      *   *Intellectualism (Stanley & Williamson):* Argues knowing-how is just a species of knowing-that (knowing that $w$ is a way to do $x$). *Practical Implication:* If true, everything could theoretically be tested via written exam. *Reality Check:* In aviation, this is dangerous. You don't want a pilot who can write about landing but can't land.
      *   *Tacit Knowledge (Polanyi):* "We know more than we can tell." The senior pilot intuition. *Practical Implication:* Some competencies can't be fully articulated in a syllabus objective. They must be caught, not taught.
      *   *Dreyfus Model of Skill Acquisition:* Novices follow rules (Knowing-That heavy); Experts rely on intuition/holistic perception (Knowing-How heavy). *Practical Implication:* A competency might start as K-T and evolve into K-H. The curriculum needs to reflect this progression.
      *   *The "Bite":* The distinction matters for *assessment validity*. If I test K-H with a K-T test, I have false positives (they pass the test but crash the plane). If I test K-T with a K-H test, I waste resources (sim time is expensive).

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A flowchart-like set of questions.
      *   *Step 1: Verb Analysis.* Is it declarative or performative? (Surface level).
      *   *Step 2: The "Merely True" Test.* Can this be satisfied by a true statement alone? (Rylean test).
      *   *Step 3: The Articulation Test.* Can the trainee explain the *why* without doing the *how*? (Intellectualist check).
      *   *Step 4: The Stakes/Context Test.* Does failure result in immediate physical consequence or just informational error? (Safety/Regulatory check).
      *   *Step 5: The Expertise Shift.* Is this a rule for novices or a heuristic for experts? (Dreyfus check).
      *   *Hand-off Points:* Where do we admit we are making a value judgment about risk vs. cost?

  4.  **Refining the Procedure (Adding the "Philosopher's Honesty"):**
      *   I need to explicitly state where the procedure is "gaming" the system.
      *   I need to highlight where the Committee must step in because it's about *risk tolerance*, not epistemology.

  5.  **Testing the Procedure (The Three Statements):**
      *   *Statement 1: "State the fuel requirements for a diversion."*
          *   Verb: "State".
          *   Test: Can be answered with a number/regulation citation.
          *   Classification: Knowing-That.
          *   Method: Classroom/Written.
      *   *Statement 2: "Manage a slow cabin decompression."*
          *   Verb: "Manage".
          *   Test: Requires action, timing, checklist usage, communication.
          *   Classification: Knowing-How (Procedural).
          *   Method: Simulator.
      *   *Statement 3: "Demonstrate sound aeronautical decision-making (ADM)."*
          *   Verb: "Demonstrate... Decision-making".
          *   Test: This is the tricky one. It's meta-cognitive. It's context-dependent.
          *   Classification: Hybrid / Phronesis (Practical Wisdom).
          *   Problem: Hard to assess objectively. Hard to "teach" directly.
          *   Advice: Don't treat it as a single objective. Break it down or treat it as an emergent property of the curriculum.

  6.  **Addressing the "Inconvenient Truth" (Statement 3):**
      *   If the procedure says "This isn't a clean objective," the user asks "What do I do?"
      *   *Philosophical Answer:* You cannot teach *phronesis* directly. You cultivate it.
      *   *Practical Answer:* Decompose into observable behaviors (e.g., "Diverts when weather drops below minimums") OR accept it as a holistic capstone assessment that relies on instructor judgment rather than a checklist.

  7.  **Review and Refine Tone:**
      *   Tone should be authoritative but humble (acknowledging limits of theory).
      *   Needs to sound like someone who understands both the ivory tower and the hangar floor.
      *   Ensure the distinction between "epistemic classification" and "regulatory compliance" is clear.

  8.  **Final Polish:**
      *   Check against all constraints in the prompt.
      *   Ensure the "honest judgment calls" section is explicit.
      *   Make sure the advice on ADM is actionable, not just philosophical hand-waving.

  *(Self-Correction during drafting)*: I initially thought about suggesting breaking ADM down entirely. But the prompt asks me to let the procedure classify it as "something other than a teachable objective" if it must. I should honor that. The advice should be about how to *handle* that classification in a regulatory environment that demands objectives. I need to suggest "proxy objectives."

  9.  **Final Output Structure:**
      *   Introduction (Setting the philosophical stage).
      *   The Decision Procedure (The Algorithm).
      *   The "Honesty Appendix" (Where the procedure fakes objectivity).
      *   The Committee Hand-off (Value judgments).
      *   Application to the Three Statements.
      *   Specific Advice on the ADM problem.

  10. (Proceed to generate response based on these thoughts.)
answer: |-
  ### Introduction: The Epistemology of the Hangar

  You are asking for a tool to solve an epistemological problem with a regulatory hammer. This is common in professional education. The distinction between *knowing-that* (propositional knowledge) and *knowing-how* (procedural knowledge) is not merely academic for you; it is a safety boundary. If you classify a *knowing-how* competency as *knowing-that*, you risk licensing pilots who can recite the checklist but cannot fly the approach. If you classify *knowing-that* as *knowing-how*, you waste expensive simulator time on facts that could be learned from a manual.

  However, the philosophy bites in three specific places you identified:
  1.  **Intellectualism:** The claim that all *knowing-how* is just *knowing-that* under a different guise. If true, you could test everything on paper. In aviation, we reject this pragmatically, even if it holds water philosophically.
  2.  **Tacit Knowledge:** The senior pilot's intuition. This is *knowing-how* that has become so internalized it resists articulation. You cannot write a curriculum objective for what cannot be spoken.
  3.  **The Expertise Shift:** Novices need rules (*knowing-that*); experts use intuition (*knowing-how*). A competency statement often bridges this gap, changing its epistemic nature as the learner progresses.

  Below is the decision procedure. It is designed to be robust, but I have annotated it to show you where the philosophy ends and the policy begins.

  ---

  ### The Competency Classification Procedure (CCP)

  **Instructions:** Take the competency statement in isolation. Do not consider the lesson plan yet. Answer the following questions in order. If you answer "Yes" to a stopping condition, classify and proceed to Instructional Design. If you answer "No," proceed to the next question.

  #### Step 1: The Verification Test (The Intellectualist Filter)
  **Question:** Can this competency be fully satisfied and verified by a declarative statement (spoken or written) that is either true or false, without requiring physical performance or simulation of action?
  *   *Sufficient Answer for "Yes":* The trainee can write down the regulation, recite the limit, or list the steps, and we accept that as proof of competency.
  *   *Classification:* **Knowing-That (Propositional).**
  *   *Instructional Implication:* Classroom, CBT, or Written Exam.
  *   *Stop.*

  #### Step 2: The "Merely True" Test (The Rylean Cut)
  **Question:** If the trainee knows the facts but fails to perform the action correctly under time pressure or stress, is the competency considered *not met*?
  *   *Sufficient Answer for "Yes":* Knowing the crosswind limit is not enough; they must actually land the plane in the crosswind.
  *   *Classification:* **Knowing-How (Procedural).**
  *   *Instructional Implication:* Simulator, Flight Training Device (FTD), or Supervised Line.
  *   *Stop.*

  #### Step 3: The Articulation Test (The Tacit Knowledge Check)
  **Question:** Is it possible for a subject matter expert (SME) to explicitly describe the criteria for success in a way that a novice can apply algorithmically?
  *   *Sufficient Answer for "No":* The SME says, "You just get a feel for it," or "It depends on the context," and cannot provide a rubric that guarantees success.
  *   *Classification:* **Tacit / Experiential.**
  *   *Action:* **Hand-off to Curriculum Committee.** (See "Committee Hand-off" below).
  *   *Stop.*

  #### Step 4: The Context Stability Test (The Expertise Shift)
  **Question:** Does the correct application of this competency change fundamentally based on the experience level of the operator, or is the standard invariant?
  *   *Sufficient Answer for "Changes":* A novice follows a strict rule (e.g., "Always divert at X fuel"); an expert uses a heuristic (e.g., "Divert at X fuel unless conditions Y and Z apply").
  *   *Classification:* **Hybrid (Developmental).**
  *   *Action:* **Hand-off to Curriculum Committee.**
  *   *Stop.*

  #### Step 5: The Risk/Consequence Test (The Value Judgment)
  **Question:** If we misclassify this as *Knowing-That* and assess it via written test, does the residual risk exceed the academy's safety tolerance?
  *   *Sufficient Answer for "Yes":* Even if the knowledge *could* be written down, the cost of error is too high to trust a written test.
  *   *Classification:* **Regulatory Knowing-How.** (Epistemically *That*, Practically *How*).
  *   *Instructional Implication:* Treat as *Knowing-How* for assessment purposes regardless of Step 1.
  *   *Stop.*

  ---

  ### The Honesty Appendix: Where the Procedure is "Fake"

  As a philosopher, I must disclose where this procedure dresses up judgment as logic.

  1.  **Step 1 is a Regulatory Fiction:** Intellectualists argue Step 2 is impossible—that performance *always* relies on propositions. We ignore this. We treat Step 1 as a regulatory convenience, not an ontological truth.
  2.  **Step 3 is the Danger Zone:** When you ask if an expert can articulate the criteria, you are asking about the limits of language, not the limits of the skill. If the answer is "No," the procedure stops. This is where you admit the syllabus cannot fully capture the job.
  3.  **Step 5 is Pure Values:** This step admits that epistemology bows to liability. You might *know* a fact is *knowing-that*, but you classify it as *knowing-how* because you don't want to be sued when a pilot who passed the written exam crashes the plane. This is not classification; it is risk management.

  ---

  ### The Curriculum Committee Hand-off

  The procedure stops and hands the decision to a human committee in two scenarios (Step 3 and Step 4). This is not a failure of the procedure; it is a recognition that these are **Value Judgments**, not classification problems.

  **When Step 3 triggers (Tacit Knowledge):**
  The Committee must decide: *Do we attempt to artificialize this intuition into rules (risking rigid, brittle pilots), or do we acknowledge this must be gained through mentorship and line experience (risking inconsistency)?*
  *   *Recommendation:* If the skill is safety-critical, artificialize it into "red flags" or "triggers" rather than full algorithms.

  **When Step 4 triggers (Developmental Shift):**
  The Committee must decide: *At what exact hour of training do we switch from testing the rule to testing the heuristic?*
  *   *Recommendation:* Create tiered objectives. "Level 1: Apply the rule." "Level 2: Apply the exception."

  ---

  ### Application to Your Three Statements

  Here is the procedure running on your specific examples.

  #### 1. "State the fuel requirements for a diversion."
  *   **Step 1 (Verification):** Can this be satisfied by a declarative statement? **Yes.** (The trainee cites the regulation or manual figure).
  *   **Step 2 (Merely True):** N/A (Stopped at Step 1).
  *   **Classification:** **Knowing-That.**
  *   **Instruction:** Classroom / CBT.
  *   **Assessment:** Written Exam.
  *   **Comment:** This is pure propositional knowledge. No procedure required.

  #### 2. "Manage a slow cabin decompression."
  *   **Step 1 (Verification):** Can this be satisfied by a statement? **No.** Reciting the checklist is not managing the event.
  *   **Step 2 (Merely True):** If they know the facts but fail to don the mask or descend in time, is it met? **No.**
  *   **Step 3 (Articulation):** Can experts articulate the criteria? **Yes.** (Checklist flow, descent rates, communication protocols are codified).
  *   **Classification:** **Knowing-How (Procedural).**
  *   **Instruction:** Simulator (Full Flight Simulator).
  *   **Assessment:** Performance Check.
  *   **Comment:** This is standard procedural knowledge. It is codified and actionable.

  #### 3. "Demonstrate sound aeronautical decision-making (ADM)."
  *   **Step 1 (Verification):** Can this be satisfied by a statement? **No.**
  *   **Step 2 (Merely True):** If they know the theory of ADM but make a poor decision in the sim, is it met? **No.**
  *   **Step 3 (Articulation):** Can experts explicitly describe the criteria for "sound" decision-making algorithmically? **No.** (Experts often rely on pattern recognition and intuition—"recognition-primed decision making"—that they cannot fully articulate to a novice).
  *   **Step 4 (Context Stability):** Does the application change with experience? **Yes.** (Novices use decision matrices; experts use intuition).
  *   **Classification:** **Tacit / Phronesis (Practical Wisdom).**
  *   **Procedure Result:** **Hand-off to Committee.**

  ---

  ### The Inconvenient Truth: What to do with ADM

  The procedure correctly identifies that "Demonstrate sound ADM" is not a clean, teachable objective in the same way "State fuel requirements" is. It is a *dispositional* state, not a *competency* in the strict behavioral sense. If you leave it as is, your instructors will grade it based on their own gut feelings, leading to assessment bias and regulatory vulnerability.

  **Here is your practical solution:**

  1.  **Do Not Delete It:** Regulators require it. It signals the *telos* (end goal) of the training.
  2.  **Decompose into Proxy Objectives:** You cannot teach "Sound ADM" directly. You must teach the *components* that constitute it for a novice. Break this statement down into 5-10 specific, observable *Knowing-How* objectives that serve as proxies.
      *   *Instead of:* "Demonstrate sound ADM."
      *   *Use:* "Diverts the flight when weather at destination drops below minimums."
      *   *Use:* "Verbalizes three risk factors before accepting a schedule change."
      *   *Use:* "Utilizes the risk assessment matrix during the pre-flight phase."
      *   *Why:* These are observable, testable, and teachable. If they pass the proxies, you infer the ADM.
  3.  **Shift the Assessment Locus:** Acknowledge that final certification of ADM cannot be a checklist item. It must be a **Holistic Capstone Assessment**.
      *   Require a specific number of hours in "Line Oriented Flight Training" (LOFT) scenarios where the *only* graded variable is the decision path, not the stick-and-rudder skills.
      *   Empower instructors with a "Veto Clause": Even if all technical boxes are checked, an instructor can fail a candidate on ADM. This formalizes the "Tacit Knowledge" hand-off from Step 3 of the procedure.
  4.  **Teach the Vocabulary of Reflection:** Since you cannot teach the intuition directly, teach the *reflection* on the intuition. Require trainees to debrief their own decisions using a standardized framework (e.g., DECIDE model). You are assessing their ability to *analyze* their decision-making, which is a *Knowing-That* skill that supports the *Knowing-How* of ADM.

  **Philosophical Summary:**
  You are not teaching "Sound ADM." You are creating an environment where "Sound ADM" is the likely emergent property of mastering the proxy objectives and absorbing the culture of the cockpit. Classify the proxies as *Knowing-How*, classify the reflection as *Knowing-That*, and classify the overarching "ADM" objective as a **Regulatory Artifact** that requires holistic judgment rather than procedural classification.
