      *   What would change? Yes (Consent, Advocacy, Liability).
      *   Ordinary life observation? Yes (Functional vs. Metaphysical).

  6.  (Mental Check of specific split-brain details): Ensure I acknowledge that in daily life, the hemispheres cooperate more than in the lab. The lab *creates* the dissociation by lateralizing stimuli. In the wild, eyes move, head turns, allowing integration. This is crucial for the "ordinary life" part of the question.

  7.  **Final Output Generation** (Proceed to write the response based on these structured thoughts).
answer: |-
  This is an exceptionally sharp observation. You have identified the friction point between *metaphysical theories of personal identity* and the *pragmatic ontology of the law and medicine*. Most introductory discussions of split-brain cases focus on the metaphysics of consciousness (e.g., "Are there two minds?"); you are asking about the metaphysics of *status* (e.g., "Why is there only one citizen?").

  Here is a reconstruction of the implicit view governing these practices, an analysis of the rival theories it excludes, and a breakdown of the consequences of taking the "two subjects" hypothesis seriously.

  ### 1. Reconstructing the Implicit View: "Organismic Animalism"

  The legal and medical institutions do not operate on a Lockean psychological view, nor do they operate on a Cartesian ego view. They operate on a view best described as **Constitutional Animalism** or **Biological Continuity**.

  *   **The Core Presupposition:** The "person" (the bearer of rights and duties) is identical to, or constituted by, the living human organism.
  *   **The Criterion of Identity:** Personal identity tracks biological life. As long as the biological organism persists without death, the legal person persists without change.
  *   **The Indivisibility Clause:** The human organism is treated as a topological unit. You cannot divide the legal person without killing the organism. Therefore, internal divisions (whether cellular, organ-based, or neural) are legally invisible.

  **Why this fits the practice:**
  When a corpus callosotomy is performed, the organism survives. Therefore, the patient survives. The law requires a stable anchor for rights and liabilities. The body is the only publicly verifiable, continuous anchor available. Consciousness is private and fluctuating; the body is public and stable. By tethering personhood to the organism, the institution avoids the epistemic nightmare of having to measure "degrees of consciousness" to determine "degrees of personhood."

  ### 2. Which Rival Theories Are Quietly Ruled Out?

  The institutional practice is not metaphysically neutral; it actively suppresses specific philosophical implications.

  **A. Strong Psychological Continuity (Lockean Fission)**
  *   **The Theory:** If personal identity consists in psychological connectedness (memory, character, intention), and the corpus callosum is the bridge for that connectedness, then severing it should threaten identity. If the hemispheres diverge significantly (e.g., different beliefs, conflicting volitions), a strict Lockean might argue we have *fission*: one person becoming two.
  *   **The Institutional Rejection:** The law refuses to recognize fission. It rules out the possibility that one body can house two rights-bearers. It implicitly asserts that psychological divergence is a *medical condition of the one person*, not the *creation of a new person*.
  *   **Nuance:** A sophisticated Lockean could argue that because the hemispheres share subcortical structures, emotional tones, and (in daily life) sensory environments, enough connectedness remains to sustain one person. However, the *law* does not make this calculation. It assumes unity *a priori*, regardless of the psychological data.

  **B. The Cartesian Ego (Simple Substance)**
  *   **The Theory:** The self is a simple, indivisible soul.
  *   **The Institutional Rejection:** While the law's "one person" rule sounds Cartesian, the *reasoning* is not. If the law were truly Cartesian, it would have to investigate the soul's status. Instead, it investigates the body's status. If the body is alive, the "soul" (legal person) is present. The law ignores the metaphysics of the soul in favor of the biology of the body.

  **C. Parfitian Reductionism**
  *   **The Theory:** Derek Parfit argued that identity doesn't matter; what matters is survival (Relation R). In fission cases, he suggests we should abandon the concept of identity.
  *   **The Institutional Rejection:** The law is obsessed with identity. Rights, debts, and crimes are non-transferable. You cannot say "The Left Hemisphere owes this debt, but the Right Hemisphere doesn't." The law requires a distinct, countable entity. Parfit's view would dissolve the legal framework entirely.

  ### 3. Is the Practice Philosophically Underdetermined?

  It is **pragmatically determined but metaphysically agnostic.**

  The law does not claim, "We know for a fact there is only one consciousness." It claims, "For the purposes of social order, we must treat this organism as one agent."
  *   **Compatibility:** It is compatible with the view that there is one consciousness.
  *   **Compatibility:** It is *also* compatible with the view that there are two consciousnesses, provided we treat them as *conjoined twins sharing a body* for legal purposes (similar to how we might treat Siamese twins as one unit for voting, even if they are two people).

  However, it is **not compatible** with any theory that demands legal recognition track psychological fragmentation. If a theory says "Two streams of consciousness = Two legal persons," the institutional practice rules that theory out by fiat.

  ### 4. What Would Change If We Took "Two Subjects" Seriously?

  If we accepted the experimental data as proof of two distinct persons inhabiting one organism, the institutional disruption would be catastrophic.

  *   **Informed Consent:** This is the most critical failure point. Currently, the speaking Left Hemisphere (LH) consents for the whole. If the Right Hemisphere (RH) is a separate person, the LH cannot consent on its behalf. If the RH indicates refusal (via left-hand pointing) to a procedure the LH wants, proceeding would be **battery** against the RH. We would need a mechanism to adjudicate conflicts between co-habitants.
  *   **Criminal Liability:** If the left hand (RH) strikes a person in anger, but the LH (the speaker) claims innocence and lack of intent, who is on trial? Currently, the *organism* is liable. If they are two persons, we would need to determine which "person" acted. We might see acquittals where the "speaking person" claims they were hijacked by the "non-speaking person."
  *   **Advocacy:** The RH would require a *guardian ad litem*. Since the RH cannot speak, a court-appointed advocate would be needed to interpret its non-verbal signals (pointing, arranging blocks) as legal testimony.
  *   **Medical Records & Privacy:** Would the LH have the right to access the RH's private thoughts (revealed via tachistoscopic testing)? If they are separate persons, the LH reading the RH's test results could be a violation of medical privacy (HIPAA in the US).
  *   **Voting:** One vote per person. If there are two persons, does the body get two ballots? Or does the "disability" of sharing a body disenfranchise one?

  ### 5. The "Ordinary Life" Observation: Evidence or Evasion?

  You ask whether the fact that these patients function as one person in daily life validates the unitary view, or merely hides the problem.

  **It is primarily a reason the question never comes up (Functional Unity vs. Metaphysical Unity).**

  1.  **Cross-Cuing:** In the wild, split-brain patients are not constantly subjected to lateralized stimuli. They move their eyes, they turn their heads, they speak aloud. The LH hears what the RH sees (via auditory feedback), and the RH sees what the LH looks at. This creates a *functional* loop that mimics unity.
  2.  **Institutional Reinforcement:** Because the world treats them as one agent, the hemispheres are socially conditioned to cooperate. The LH learns to confabulate reasons for the RH's actions to maintain social coherence. The "unity" is partly a performance demanded by the social environment.
  3.  **The Laboratory Artifact:** The duality is most visible in the lab *because* the lab isolates the hemispheres. In this sense, the lab creates the conditions for "two subjects" to appear.

  **Conclusion:**
  The observation that they function as one person is evidence of **behavioral integration**, not **ontological unity**. The institution relies on behavioral integration because it is the only thing it can regulate.

  ### Summary for Your Course

  The institutional handling of split-brain patients reveals that **legal personhood is a status assigned to biological organisms, not a discovery about streams of consciousness.**

  *   **Implicit View:** Biological Animalism (Person = Organism).
  *   **Ruled Out:** Any view requiring legal fission upon psychological fission (Strong Lockeanism).
  *   **Consequence of Change:** Recognizing two subjects would collapse the framework of consent, liability, and privacy, requiring us to treat the hemispheres like conjoined twins.
  *   **Ordinary Life:** The apparent unity in daily life is a functional achievement (supported by eye movements and speech) that allows the legal fiction of unity to hold without obvious contradiction.

  The law essentially bets that the cost of recognizing two persons (administrative chaos, unassignable liability) outweighs the metaphysical accuracy of doing so. It prioritizes the **stability of the social order** over the **precision of the metaphysical map.**
