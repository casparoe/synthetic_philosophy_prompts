answer: |-
  Your brother treats the body as a warehouse; your prof treats it as a ballot box. Here is the audit.

  | Feature | Brother (Plasma) | Prof (Vote) | Kidney Reality |
  | :--- | :--- | :--- | :--- |
  | **Commodity** | Regenerative fluid | Civic right | Non-regenerative organ |
  | **Risk** | Low, temporary | None (abstract) | High, surgical, permanent |
  | **Buyer** | Pharma clinics | Candidates | Patients/Intermediaries |
  | **Payment** | Fee for time | Bribe for influence | Cash for asset |
  | **Consent** | Economic choice | Civic duty | Desperation-driven? |

  **Breakdowns & Smuggled Assumptions**
  **Brother:** Fails on *irreversibility*. Plasma replenishes; kidneys don't. He smuggles in the assumption that clinic-style regulation scales to major surgery without prohibitive risk. He assumes bodily parts are separable commodities like fluids, ignoring long-term health debt.
  **Prof:** Fails on *public vs. private*. Votes are public trust; kidneys are biological assets. She smuggles in that bodily integrity is constitutive of citizenship (like voting) rather than property. She assumes economic pressure negates consent entirely, not just complicates it.

  **Load-Bearing Check**
  **Brother:** His conclusion survives the analogy's collapse. His core argument is utilitarian (scarcity kills), not analogical. If plasma isn't the model, a regulated monopoly could still work. The analogy is rhetorical armor, not the engine. He can rebuild on direct cost-benefit analysis.
  **Prof:** Her case is more vulnerable. The vote analogy does heavy lifting to establish *why* markets corrupt consent beyond mere coercion. If kidneys aren't "civic," she must rely solely on exploitation arguments, which are empirically contestable (e.g., do sellers regret it?). The analogy provides the moral weight; without it, she needs a robust theory of commodification distinct from civic corruption.

  **Third Analogy**
  **Paid Military Service.** Fits better: high physical risk, state-regulated, economic recruitment, permanent harm/death possible, socially sanctioned. It captures the risk/consent/economic pressure nexus better than plasma (too safe) or votes (too abstract). It acknowledges the trade-off without denying the agency or the danger.
