prompt: |-
  me and my brother keep having the same argument about legalizing kidney sales. his move is always: we already pay people for plasma, and for eggs, and to test drugs in clinical trials. a kidney is just the same thing, scaled up -- you get screened, a surgeon removes it, somebody's life is saved, you walk away with money. the market isn't some scary new thing, it's the thing we already allow, one organ bigger. my ethics prof says that's exactly wrong: selling a kidney isn't like selling plasma, it's like selling your vote -- some goods get corrupted once money touches them, and besides, the people who'd be selling are precisely the ones who can't afford to say no, so it's not really consent the way my brother imagines. so the two analogies are doing all the work in this fight and nobody checks them.

  can you audit both for me? I want the actual mapping: what in the plasma case corresponds to what in the kidney case (the commodity, the risk, the buyer, the payment, the consent), and what in the vote case corresponds to what in the kidney case. then where each mapping breaks down, and what each one smuggles in -- I suspect the plasma analogy quietly assumes kidney markets can be regulated like plasma clinics, and the vote analogy quietly assumes kidneys are constitutive of civic life the way votes are, but maybe I have that wrong. and then the part that actually matters to me: if my brother's analogy collapses, does his conclusion (legalize, with safeguards) go down with it, or could he rebuild it on non-analogy grounds? same question for my prof -- if votes and kidneys turn out to come apart, is her whole case gone or just one plank of it? I've got the feeling both of them are leaning on their analogies way harder than they realize but I can't tell which parts are load-bearing.

  keep it under 500 words. a table for the correspondences is fine and probably better than prose. and if you think there's a third analogy that does the job better than either of theirs, say so, but briefly.
