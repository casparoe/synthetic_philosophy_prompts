      *   **Section 5: Common Sense Revision.** AT is much weirder. CoO is legally standard.
      *   **Conclusion/Verdict:** They come apart. Different phenomena.

  12. **Final Polish:** Ensure the tone is analytical and directly answers the specific sub-questions. Make sure the "Verdict" is clear. (Self-check: Did I address the "ghostly doing" phrase? Yes, by distinguishing the nature of the ghostliness.)

