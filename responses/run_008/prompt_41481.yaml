      *   (2) **Wigner Skepticism:** Given (1), the vast space of math makes it unsurprising *some* fits physics. Effectiveness isn't mysterious.
      *   (3) **Aesthetic Realism/Truth-Tracking:** Mathematical beauty (elegance, symmetry) in *fundamental physics* is a guide to truth (e.g., Dirac).
      *   (4) **String Theory Skepticism:** String theory has beautiful math but no predictions, so it's not physics. Beauty alone isn't evidence *there*.
      *   (5) **Math Autonomy:** Math is justified a priori. Physical application doesn't confirm math.

