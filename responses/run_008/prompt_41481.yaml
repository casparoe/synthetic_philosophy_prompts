      *   **Context:** The user has been arguing with a friend about Wigner's "Unreasonable Effectiveness of Mathematics in the Natural Sciences." They have drafted a 5-point position statement.
      *   **Task:** Audit the package for internal consistency/coherence. Identify tensions/conflicts between the points. Rank tensions by severity. Explain the cost of resolving each tension. Identify false alarms (tensions that dissolve on inspection).
