  *Re-evaluating (3):* "Mathematical beauty... is a genuinely truth-tracking guide."
  *The Friction:* If the universe instantiates a "whole bunch" of structures randomly (implied by 2), why does *beauty* correlate with the ones it instantiates *here*? If the mapping is just statistical inevitability, beauty shouldn't matter. If beauty matters, the mapping isn't just statistical. This is the strongest tension.

  *Re-evaluating (4):* "Zero testable predictions means it shouldn't count as physics."
  *The Friction with (3):* Dirac's beauty worked *because* it was tested. String theory hasn't been tested. So (3) is retrospective/provisional, (4) is prospective. This is resolvable by emphasizing the *empirical closure* in Dirac's case.

