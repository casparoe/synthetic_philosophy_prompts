      *   *Is (3) compatible with (5)?* (5) says application doesn't confirm *math*. (3) says beauty in *physics* tracks truth about the *world*. These are different truth claims. One is about mathematical validity, one is about physical ontology. I need to make sure the user sees this distinction clearly.
