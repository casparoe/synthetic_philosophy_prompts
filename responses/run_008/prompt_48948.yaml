answer: |-
  You have identified the seam where the technocratic management of risk stitches together two incompatible fabrics. On one side, the regulatory state acts as a utilitarian calculator, summing expected values across populations (Value of a Statistical Life $\times$ Probability). On the other, the financial and legal systems act as survivalists, acknowledging that beyond a certain threshold, the arithmetic of expectation collapses because the calculator itself is destroyed.

  Here is the reconstruction of the implicit theory, the assessment of its coherence, and the implications of taking the tail seriously.

  ### The Implicit Theory: Solvency-Constrained Expected Value

  Your observed pattern does not presuppose Bernoulli's **bounded utility of wealth**. If it did, we would see diminishing marginal value assigned to statistical lives as the death toll rises; yet in cost-benefit analysis (CBA), a life is a life, linear and additive. Nor does it rely on ranking by **median** outcomes; regulators explicitly target the mean expected reduction in risk.

  Instead, the practice presupposes the fourth resolution you listed: **the counterparty fiction.** The implicit theory is that expected value is a valid operational metric *only within the bounds of the payer's solvency*.

  In the realm of environmental safety, the "payer" (the regulated industry, backed by the economy) can absorb the expected losses. If a regulation costs \$100 million to save 10 statistical lives (at \$10 million each), the arithmetic holds because the \$100 million is payable. The tail is short enough that the system remains solvent.

  In catastrophe finance, the potential loss exceeds the capital of the insurer, the surplus of the reinsurance market, and often the taxing capacity of the state. Here, the "House" cannot pay the bet. The St. Petersburg expectation is infinite only if the game continues indefinitely; in reality, the game terminates when the bankroll hits zero. Statutory liability caps (like the Price-Anderson Act for nuclear power) and solvency horizons (1-in-200-year events) are not admissions that the tail risk is zero; they are acknowledgments that the tail risk is *unpriceable* because the counterparty would cease to exist before paying it.

  Thus, the implicit commitment is **Finite Counterparty Capacity**. The switch from EV bookkeeping to truncation occurs exactly at the point where the loss threatens the existence of the entity required to monetize the risk.

  ### Consistency and Commitment

  Does this make sense? It is **instrumentally consistent** but **morally inconsistent**.

  It is instrumentally consistent if the objective function of the state is *system persistence* rather than *moral arithmetic*. A regulatory regime that priced existential risk at its true expected value (which may be infinite or simply beyond GDP) would ban the technology or bankrupt the state. By truncating the tail, the state allows high-consequence technologies to exist while capping the liability to a level the economy can absorb. It treats small risks as costs to be optimized and large risks as constraints to be survived.

  However, it is morally inconsistent. It implies that a statistical life saved via airbag regulation is worth \$10 million, but a statistical life saved via nuclear containment is worth significantly less once the liability cap is reached. The practice is underdetermined among several theoretical justifications (risk aversion, bounded utility), but it is strictly committed to **truncation**. It does not matter *why* the tail is cut, only *that* it is cut.

  ### Implications of Taking the Tail Seriously

  If a regulatory regime took the untruncated tail seriously—rejecting the "counterparty insolvency" resolution—it would require radical changes in both halves of your beat:

  1.  **In Insurance/Finance:** The concept of limited liability corporations would have to be abandoned for catastrophic risks. Insurers would need infinite capital, or the state would have to fully nationalize catastrophe risk, acknowledging that only a sovereign with infinite taxing horizon (and even that is debatable) can underwrite the tail. Reinsurance markets would collapse, replaced by mutualized state guarantees.
  2.  **In Safety Regulation:** Cost-benefit analysis would break down for fat-tailed risks (climate change, pandemics, AI). You cannot multiply a probability by an infinite or civilization-ending loss. The Precautionary Principle would replace CBA. We would not "price" carbon; we would ban emissions that cross a physical threshold, regardless of cost, because the "cost" side of the equation would be undefined.

  ### Fragility of the Argument

  Here is where my verdict is most vulnerable:

  1.  **The Assumption of Coherence:** My reconstruction assumes the state acts as a rational agent maximizing system persistence. It is equally plausible that the inconsistency is merely **political expediency**: VSL is used because it sounds rigorous, and liability caps are used because industries lobby for them. If the pattern is an artifact of turf wars rather than a hidden logic, the "Solvency-Constrained" theory is a Just-So story.
  2.  **The Linearity of VSL:** My argument rests on VSL being linear. If empirical evidence showed that regulators *do* discount mass casualties (e.g., valuing 1,000 deaths at less than 1,000 $\times$ 1 death due to budget constraints), then the two halves of your puzzle merge into a single regime of **Bounded Social Utility**, and the "switch" you observe is just a gradient I am misinterpreting as a discontinuity.

  \answer{Finite counterparty capacity}
