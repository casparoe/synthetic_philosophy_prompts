answer: |-
  This is a classic piece of decision-theoretic sophistry. It looks rigorous because it mimics the algebraic structure of Expected Utility (EU) theory, but it collapses under a specific conceptual ambiguity. Your intuition is correct: (7) is self-undermining, and the error lies in how the argument treats the *functional role* of past facts.

  You asked for a diagnosis, not a survey. I will proceed by distinguishing two ways to read the premises, identifying the equivocation, and then answering your specific questions about probability and the cost to EU theory.

  ### Two Candidate Readings

  To see where the argument breaks, we must distinguish between two ways of modeling how a fact enters a decision calculation.

  **Reading 1: The Additive-Utility Reading (Your Colleague's View)**
  On this reading, every fact that matters to a decision is treated as a term in the utility function. If $X$ is a fact (like a sunk cost), it contributes a value $v(X)$ to the total utility of an outcome.
  *   **Mathematical Form:** $EU(Action) = \sum [P_i \times (U_i + v(X))]$.
  *   **Implication:** If $X$ is constant across all actions, $v(X)$ factors out and cancels during comparison.
  *   **Status of Premise (2):** True. Algebraically, a constant additive term does not affect the ordering of sums.
  *   **Status of Premise (5):** True, but misleading. It treats "everything already the case" as a set of additive utility terms.

  **Reading 2: The Conditional-Probability Reading (The Bayesian/Your View)**
  On this reading, facts "already the case" function primarily as *evidence* that conditions the probabilities of future outcomes, not as additive utility terms.
  *   **Mathematical Form:** $EU(Action | Evidence) = \sum [P(Outcome_i | Action, Evidence) \times U_i]$.
  *   **Implication:** If $Evidence$ is constant across actions, it does *not* cancel out. It remains in the conditional term $P(\cdot | Evidence)$, altering the weights assigned to the utilities.
  *   **Status of Premise (2):** True, but limited. It applies only to additive utility terms, not to probability conditionals.
  *   **Status of Premise (5):** True. The evidence is indeed fixed.
  *   **Status of Premise (6):** False. Fixed evidence changes the probabilities, which changes the expected utility comparison.

  ### The Diagnosis

  I am working with **Reading 2** as the correct model of rational choice and **Reading 1** as the model your colleague is implicitly smuggling in.

  The argument is **valid but unsound** due to an **equivocation on the term "consequence" (and implicitly "affect")** between Premise (2) and Premise (5).

  1.  **In Premise (2)**, "consequence" refers to a **utility constituent**. The premise relies on the algebraic property that $A + C > B + C \iff A > B$. This is unimpeachable *for utility terms*.
  2.  **In Premise (5)**, "everything that is already the case" refers to **evidential states**.
  3.  **The Fatal Inference (5) $\to$ (6)**: The argument assumes that because past facts are constant across options (Premise 5), they must function like constant additive utility terms (Premise 2). This is false. Past facts are constant, but they are not *utility constants*; they are *probability shifters*.

  Your colleague's claim that "we must be more careful about what counts as a consequence" is a deflection. The error is not in counting consequences; it is in failing to distinguish between the **inputs** of the EU equation. Expected Utility has two inputs: Probabilities ($P$) and Utilities ($U$).
  *   Sunk costs (defined as resource losses) are irrelevant to $U$ (because they are past) and usually irrelevant to $P$ (because they are causally inert).
  *   Evidential history is irrelevant to $U$ (usually), but **highly relevant to $P$**.

  By conflating these, the argument concludes that because the past doesn't add to the *score* (Utility), it doesn't change the *odds* (Probability).

  ### Addressing Your Specific Questions

  **1. Does (2) survive if the item alters probabilities rather than payoffs?**
  **No.** Premise (2) is a theorem about *utilities*, not probabilities.
  If an item $E$ alters probabilities, the comparison is between:
  $$ \sum P(O_i | A, E) \cdot U(O_i) \quad \text{vs} \quad \sum P(O_i | B, E) \cdot U(O_i) $$
  Even though $E$ is present in both terms, it does not cancel out because it is inside the probability function, not an additive term outside it. $P(O | A, E)$ is not necessarily equal to $P(O | B, E)$, nor does $E$ factor out algebraically. Therefore, (2) does not apply to evidential items.

  **2. Does the classic anti-sunk-cost conclusion (4) survive?**
  **Yes, but only if "sunk cost" is properly defined.**
  The standard definition of a sunk cost in decision theory is: *A past expenditure that has no correlation with future returns.*
  *   If "sunk cost" means "past expenditure with **no evidential value**," then (4) is true. The expenditure adds nothing to $U$ and changes nothing in $P$.
  *   If "sunk cost" means "any past expenditure," then (4) is false, because that expenditure might signal quality (as in your bird example).

  Your colleague is trying to use the truth of (4) (under the first definition) to prove (7) (which requires the second definition). In your bird example, the past investment is not a "sunk cost" in the strict decision-theoretic sense; it is a **signal**. A rational agent ignores the *loss* of the past investment (the cost) but updates on the *information* conveyed by the investment (the signal). Your colleague's argument forbids using the signal, which is irrational.

  **3. What does it cost? Can a defender of EU theory pay it?**
  **The cost is zero.** You do not need to reject Premise (2), nor do you need to repair EU theory. You only need to reject the **inference from (5) to (6)**.

  EU theory is perfectly capable of handling this distinction. It is built on the separation of states (which determine probabilities) and outcomes (which determine utilities).
  *   **Repair:** Explicitly restrict Premise (2) to read: "If a consequence will obtain no matter which option the agent chooses, **and that consequence enters the utility function as an additive term**, then it cannot affect the comparison."
  *   Once this restriction is added, Premise (5) no longer supports Premise (6), because "everything already the case" enters via the probability function, not the utility function.

  ### Summary for Your Reading Group

  You can present the diagnosis to your group as follows:

  1.  **Accept (1), (2), (3), and (5).**
  2.  **Reject the inference to (6).** The fact that the past is fixed (5) does not mean it is normatively inert. It fixes the *context* in which probabilities are calculated.
  3.  **Reject (7).** It follows from (6), which is false.
  4.  **Qualify (4).** Sunk costs (as resource losses) do not tip the balance. But past investments (as evidence) do tip the balance by altering the probability of success.

  Your colleague's argument is a *category mistake*. It treats **evidence** (which weights the options) as if it were a **cost** (which subtracts from the options). In your field biology terms: The energy already spent on the nest is gone (sunk cost); but the fact that the nest was built *at all* tells you something about the territory's quality (evidence). Rationality demands you ignore the former but attend to the latter. The argument fails because it demands you ignore both.
