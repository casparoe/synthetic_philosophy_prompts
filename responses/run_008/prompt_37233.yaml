answer: |-
  ### 1. Exam Question

  **Final Exam: Philosophy of Conditionals**
  **Time Allowed:** 75 Minutes
  **Instructions:** Answer the following question in essay format. You must use the provided scenario for all parts of your answer.

  **Scenario:**
  Investigators are analyzing the collapse of a footbridge. They have established as a matter of fact that the bridge collapsed and that a specific corroded hanger bracket failed. They conclude the bracket failure caused the collapse.

  **Part A: The Indicative/Counterfactual Divergence (15 Points)**
  Consider the following two claims regarding the investigation:
  1.  **Indicative:** "If the corroded bracket didn't fail, something else caused the collapse."
  2.  **Counterfactual:** "If the corroded bracket hadn't failed, something else would have caused the collapse."

  Claim (1) strikes investigators as true (since the bridge *did* collapse, if not by the bracket, then by something else). Claim (2) strikes them as false (if the bracket had held, the bridge likely would have stood).
  Explain this divergence. Your answer must:
  *   Explain why the **Material Implication** analysis fails to capture the difference in truth conditions or assertibility between (1) and (2).
  *   Apply **Adams's Thesis** to the indicative case.
  *   Analyze the counterfactual using **Selection-Function Semantics** (Stalnaker/Lewis). Specifically, describe the **Modal Base** and **Ordering Source** for each sentence. Why does the factual knowledge that "the bridge collapsed" enter the modal base for one but not the other?

  **Part B: Sequence Asymmetry (10 Points)**
  Consider the following sequence of counterfactuals regarding the bridge's safety sensors:
  *   **Sentence X:** "If the bracket had failed slowly, the sensors would have tripped."
  *   **Sentence Y:** "If the bracket had failed slowly and the backup relay had been offline, the sensors would not have tripped."

  In the literature, a **Sobel Sequence** presents X then Y. A **Reverse Sobel Sequence** presents Y then X.
  *   Explain why the Reverse Sobel Sequence (Y then X) tends to sound inconsistent or infelicitous, whereas the standard Sobel Sequence (X then Y) sounds acceptable.
  *   Evaluate what this order effect suggests about the semantics of counterfactuals. Does it force us to abandon Variably Strict Semantics (Lewis/Stalnaker) in favor of a **Strict Conditional** analysis or a **Dynamic Context-Shift** analysis? Or can the effect be dismissed as pragmatic? Defend your position with specific reference to how the context set changes (or does not change) between utterances.

  ***

  ### 2. Model Answer

  The divergence between the indicative and counterfactual claims regarding the footbridge collapse stems from a fundamental difference in their modal parameters, specifically the composition of the modal base. The Material Implication analysis ($A \supset B$) fails here because it treats both conditionals as truth-functional. Since the antecedent ("the bracket failed") is true in the actual world, the negated antecedent is false. In classical logic, a false antecedent renders the conditional vacuously true. This predicts both (1) and (2) are true, failing to capture the intuition that (2) is false. Furthermore, Material Implication cannot account for the probabilistic nature of conditional assertion captured by Adams's Thesis.

  Adams's Thesis holds that the assertibility of an indicative conditional equals the conditional probability $P(B|A)$. For the indicative ("If the bracket didn't fail..."), we calculate probability relative to our current knowledge state. We know the bridge collapsed. Therefore, in the epistemic modal base, all accessible worlds are worlds where the bridge collapsed. When we restrict this set to worlds where the bracket did not fail, we are left with worlds where the bridge collapsed *despite* the bracket holding. In these worlds, something else must have caused the collapse. Thus, the conditional probability is high, and the assertion is appropriate.

  The counterfactual operates differently. Following Stalnaker and Lewis, counterfactuals utilize a selection function that picks the closest worlds where the antecedent is true. Crucially, the modal base for counterfactuals is not purely epistemic; it is metaphysical or realistic, and it typically excludes known facts that are causally dependent on the antecedent. To evaluate "If the bracket hadn't failed," we must backtrack or hold fixed the past up to the point of failure. We do not hold fixed the collapse, because the collapse is causally downstream of the bracket failure. In the closest worlds where the bracket holds, the structural integrity remains, and the bridge does not collapse. Therefore, the consequent ("something else caused the collapse") is false in the selected worlds. The divergence arises because the indicative holds the consequence (collapse) fixed in the modal base, while the counterfactual allows the antecedent to undo the consequence.

  Regarding the sensor sequences, the asymmetry between Sobel and Reverse Sobel sequences challenges static semantic accounts. In a standard Sobel sequence (X then Y), we accept that generally, slow failure trips sensors, but adding the offline relay defeats this. This is consistent with Variably Strict Semantics, where the set of closest $(A \land B)$-worlds is a subset of closest $A$-worlds, allowing the truth value to shift as the antecedent becomes more specific.

  However, the Reverse Sobel Sequence (Y then X) sounds inconsistent. If we first assert Y (establishing that in the closest slow-failure-and-relay-offline worlds, sensors don't trip), asserting X afterwards (in the closest slow-failure worlds, sensors *do* trip) feels like a contradiction. A Strict Conditional analysis would predict *both* sequences are inconsistent, as it requires $A \rightarrow C$ to hold in all accessible worlds, making the Sobel sequence invalid. Since the Sobel sequence is valid, Strict Conditional analysis is untenable.

  The best explanation is a Dynamic Context-Shift analysis within a Variably Strict framework (e.g., von Fintel). Uttering a counterfactual restricts the domain of quantification for subsequent claims. When Y is uttered first, it quantifies over a domain where the relay status is relevant. This restricts the context for the subsequent X. When X is then evaluated, it is evaluated relative to the restricted domain established by Y, making it appear false. This is not a semantic inconsistency but a pragmatic domain restriction. We can dismiss this as "just pragmatics" only if we can show the inference is cancellable without contradiction. Since the feeling of inconsistency is robust but the logic of subset relations (Sobel validity) holds, the order effect is best treated as a dynamic update to the conversational background rather than a failure of the variably strict truth conditions.

  ***

  ### 3. Marking Scheme

  **Total Points:** 25
  **Passing Threshold:** 15 Points

  **Point 1: Critique of Material Implication (5 Points)**
  *   **Requirement:** Student must identify that Material Implication renders both conditionals vacuously true (due to false antecedent) and note this contradicts the intuition that the counterfactual is false.
  *   **B vs. A Distinction:** A **B** answer states material implication is "truth-functional" without explaining the vacuous truth problem in this specific scenario; an **A** answer explicitly derives the truth-value clash using the scenario's facts.

  **Point 2: Indicative Modal Base & Adams's Thesis (5 Points)**
  *   **Requirement:** Student must explain that the indicative uses an epistemic modal base containing the known fact "the bridge collapsed," linking this to Adams's Thesis (conditional probability given knowledge).
  *   **B vs. A Distinction:** A **B** answer labels the indicative "epistemic" without specifying which facts are in the modal base; an **A** answer specifies that "collapse" is held fixed in the domain, making the consequent necessary.

  **Point 3: Counterfactual Selection & Modal Base (5 Points)**
  *   **Requirement:** Student must explain that the counterfactual modal base excludes the collapse (backtracking/causal independence) and selects closest worlds where the bridge stands.
  *   **B vs. A Distinction:** A **B** answer labels the counterfactual "metaphysical" without explaining why the collapse is not held fixed; an **A** answer explains the causal dependency that removes the collapse from the closest antecedent-worlds.

  **Point 4: Sobel Asymmetry Explanation (5 Points)**
  *   **Requirement:** Student must explain that Reverse Sobel sounds inconsistent because the first sentence restricts the domain for the second, whereas standard Sobel allows subset variation.
  *   **B vs. A Distinction:** A **B** answer describes the order effect intuitively without referencing domain restriction or subset relations; an **A** answer explicitly connects the infelicity to the quantification domain established by the first utterance.

  **Point 5: Theoretical Evaluation (5 Points)**
  *   **Requirement:** Student must take a stance (Dynamic, Strict, or Pragmatic) and justify it (e.g., rejecting Strict because Sobel is valid; accepting Dynamic to save Variably Strict).
  *   **B vs. A Distinction:** A **B** answer claims it is "pragmatic" without defining what evidence would support that (e.g., cancellability); an **A** answer argues for Dynamic Context-Shift as preserving logical validity while explaining infelicity.
