      *(Refining the "Metric Untouched" error)*: In the active view, the diffeomorphism moves the metric. In the passive view, it changes coordinates. The student says "leaves the metric field completely untouched... point... carries a different one." This is internally contradictory. If the field is untouched, the point carries the same value. If the point carries a different value, the field distribution has changed. This needs to be flagged.

      *(Refining the "No Third Option" error)*: This ignores "Sophisticated Substantivalism" (e.g., Saunders, Pooley). This is a standard counter-argument taught in these courses.

