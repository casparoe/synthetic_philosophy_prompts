answer: |-
  1. **Order of ideas**
  Begin by destabilizing their textual authority: reveal immediately that Buridan never wrote about the ass. This signals to the engineers and the MA that historical accuracy matters less than logical structure, loosening their grip on "textbook truth." Next, establish the Principle of Sufficient Reason (PSR): the idea that nothing happens without a cause or reason. This must land before the dilemma; without PSR, the starvation is just stupidity, not a logical necessity. Only then introduce the concrete case. If you start with the case, they'll solve it practically before grasping the theoretical bind. Once the deadlock is felt, invite the randomization objection. This must precede the final synthesis. Finally, pivot to the meta-question: is "acting without reason" coherent? This depends on them having exhausted the "reason-based" solutions first. If you jump to "just walk" too early, the engineers will dismiss it as magic. The sequence is: Historical destabilization → Logical Principle → Concrete Application → Practical Objection → Philosophical Synthesis. Each step removes a safety net, forcing them closer to the raw problem of agency.

  2. **The carrying case**
  Stick with your hiring committee. It's superior to the donkey because donkeys have instincts; hunger eventually overrides logic. A committee operates purely on deliberative criteria. If Candidate A and Candidate B have identical scores, credentials, and interview responses, biology doesn't intervene. Only decision does. This isolates the rational deadlock from biological imperatives. The engineers will appreciate the symmetry of the data; the MA will see the ethical weight; the dentist will feel the pressure to decide. The donkey invites "why doesn't it just smell better?" objections. The hiring committee blocks empirical escapes. It forces the group to confront pure rational indeterminacy. You aren't discussing animal behavior; you're discussing the architecture of choice when data fails.

  3. **Misconception map**
  First, "Buridan wrote this." Head this off immediately in the intro. If they think it's canonical dogma, they'll treat it as a puzzle to solve rather than a concept to probe. Correcting this early signals that historical accuracy matters less than the logical structure. Second, "The donkey is stupid." This arises when describing the starvation outcome. You must preempt this by emphasizing the ass is *perfectly rational*. It starves *because* it is rational, not despite it. If they think it's stupidity, the puzzle vanishes. Tell them: "Imagine the smartest possible agent who refuses to act without justification." Third, "This is about free will." This will emerge during the coin-flip discussion. Head it off by clarifying that the puzzle is about *rational determination*, not metaphysical freedom. The question isn't "could it do otherwise?" but "what justifies doing otherwise?" If you let them drift into free will, the engineers will bog down in causality and the MA in compatibilism. Keep the focus on justification. Each misconception protects them from the discomfort of irrational choice; strip them away sequentially. If you don't correct the "stupidity" error early, the dentist will spend twenty minutes explaining how real animals make decisions. If you don't curb the "free will" drift later, the session becomes a debate on determinism rather than agency. You are guiding them away from empirical biology and metaphysical physics toward the phenomenology of choice.

  4. **The coin-flip moment**
  Wait until the group feels the pain of the deadlock. Let the dentist propose the coin. Validate him enthusiastically: "You're right, that's how we solve this in practice." Then pivot: "But is flipping a coin a *reason* to hire candidate A, or is it a surrender of reason?" This turns his practical solution into the central philosophical problem. It honors his expertise while deepening the stakes.

  5. **The check**
  "When you finally made a choice in our scenario, did you discover a difference between the options, or did you create one?" This distinguishes between finding reasons and exercising will.

  6. **What I'm cutting**
  Refuse to dive into medieval physics or neurobiology. Say: "We are bracketing medieval physics and neurobiology tonight to focus strictly on the logic of justification." This sets boundaries without dismissing their relevance.
