prompt: |-
  I am a software engineer with no formal training in philosophy, and I am asking for help drafting a research proposal. Here is the situation. I work on the control software for closed-loop spinal-cord stimulation implants: devices that sense markers of a patient's pain state and adjust stimulation in real time, in something like the way an autopilot continuously corrects an aircraft. My company has a standing arrangement with a nearby university under which we can fund one six-month, part-time collaboration with a small group of researchers, and this year I get to pitch the project. The pitch needs to be a proper proposal document, not just an email, and the review committee includes clinicians and engineers but no philosophers, so it has to be written for technically literate non-specialists.

  My half-formed idea grew out of something I came across called pain asymbolia. These are patients, typically after damage to certain midline brain structures, who report that they do feel pain — they can locate it, identify it as pain, and rate its intensity — while insisting that it does not bother them at all; some smile or laugh while being pinched hard. There are also, apparently, patients on morphine who say something similar: the sensation is still there, but the sting is gone. My suspicion is that when people, including those of us building these devices, say that pain is intrinsically bad, they are conflating two separable things: something like an alarm signal (detection, localization, intensity) and a downstream evaluative or motivational response that makes the alarm matter to the person. In my own world, we would never confuse a monitoring system with its escalation policy, and the policy is what you rewrite when the alerts are producing panic disproportionate to the incidents. If nociception is analogous — a signal whose badness is conferred by what it is wired to, rather than built into it — then there is an immediate engineering question my team is not equipped to answer: our closed-loop controller targets the signal itself, but perhaps the legitimate therapeutic target is the minding, or some defined boundary between the two. Worse, our clinical endpoints are largely built around pain-intensity ratings, so if a patient's real complaint is the aversiveness rather than the signal, we may be optimizing the wrong variable and calling it success.

  What I need is a proposal that does several things, and I will let you organize them as you see fit. First, state the underlying question precisely enough that it could in principle get a determinate answer — something in the vicinity of whether the badness of pain is intrinsic to the phenomenal character of the sensation or is instead constituted by a separable affective-evaluative response, and, conditioned on each answer, what follows about the correct target for neuromodulation. Second, explain why the existing philosophical positions, whatever they are, leave this open: my impression is that there is a familiar dispute between those who hold that the awfulness is part of the very feel of pain and those who locate it in attitudes toward the sensation, but neither camp, as far as I can tell, has been asked to say where a causal intervention ought to land, or how to treat the awkward cases — the patient who would happily keep the sensation if it lost its sting, or the one who wants the signal silenced even when it no longer distresses them. Third, lay out the method concretely: what the researchers and I would actually do month by month over the six months, which I imagine involves analyzing the dissociation evidence conceptually, working through case comparisons such as asymbolia, morphine-induced indifference, and chronic pain with distress out of proportion to measurable signal, deriving candidate intervention targets from the analysis, and then stress-testing those targets against realistic clinical scenarios that I would supply from our side. Fourth, say what a successful deliverable looks like for the people who will use it — in my mind, a white paper that partitions the pain system into components and, for each, states whether and under what conditions it is a legitimate engineering target — and be honest about what would count as failure, for instance if the distinction turns out to be impossible to state in terms any clinician, patient, or regulator could act on. Finally, scope it honestly: the full metaphysics of affect and valence is obviously too big for six months, so the proposal should fence off what gets treated as a fixed assumption and explain that choice.

  Please write it in the register of an internal research partnership pitch — precise, but without assuming the reader knows any philosophy — and do not include a bibliography or literature review; positions and arguments can be referred to by description, and I will track down and add the references myself before submission.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**

      *   **User:** Software engineer working on closed-loop spinal-cord stimulation (SCS) implants.
      *   **Context:** Pitching a 6-month, part-time collaboration with a university (funded by the company).
      *   **Audience:** Review committee (clinicians and engineers, *no philosophers*). Needs to be technically literate but accessible.
      *   **Topic:** The philosophical/engineering distinction between the *sensory* aspect of pain (detection, intensity) and the *affective/motivational* aspect (suffering, "minding," badness). Inspired by pain asymbolia and morphine effects.
      *   **Core Problem:** Current devices target the signal (intensity). Maybe they should target the "minding" (aversiveness). Current clinical endpoints (intensity ratings) might be optimizing the wrong variable.
      *   **Requirements:**
          1.  State the underlying question precisely (intrinsic badness vs. separable response).
          2.  Explain why existing philosophy leaves this open (needs to address intervention targets, not just metaphysics).
          3.  Lay out a concrete 6-month method (conceptual analysis, case comparisons, deriving targets, stress-testing).
          4.  Define success/failure (White paper partitioning pain system, actionable targets vs. unactionable distinction).
          5.  Scope honestly (fence off full metaphysics, focus on actionable engineering/clinical implications).
      *   **Tone:** Internal research partnership pitch (precise, professional, no jargon without explanation).
      *   **Constraint:** No bibliography/liter review (refer by description).

  2.  **Determine Structure:**

      A standard research proposal structure works best here, adapted for an industry-academia partnership:
      *   Title (Clear and engaging)
      *   Executive Summary/Abstract
      *   Background & Problem Statement (The engineering context + the philosophical gap)
      *   Research Question (Precise formulation)
      *   Methodology (Month-by-month plan)
      *   Deliverables & Success Criteria
      *   Scope & Limitations
      *   Budget/Resources (Briefly mentioned as per context)

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to bridge engineering and philosophy. "Operationalizing the Affective-Sensory Distinction in Closed-Loop Neuromodulation."
      *   **Executive Summary:** Hook the engineers and clinicians. We are building autopilots for pain. What if we're tuning the wrong knob? We need philosophy to tell us which knob is which.
      *   **Background:** Explain the SCS context briefly. Introduce the "Asymbolia/Morphine" observation. Explain the "Alarm vs. Escalation Policy" analogy (this is the user's strong intuition, keep it).
      *   **Research Question:** This needs to be sharp. Not "What is pain?" but "Is the negative valence intrinsic to the sensation or a downstream process, and does it matter for control theory?"
      *   **Why Philosophy is Needed (The Gap):** Acknowledge the "Sensory vs. Affective" distinction exists in philosophy/psychology. But point out they haven't been asked about *intervention boundaries*. They argue about what pain *is*, not how to *fix* it via electrodes.
      *   **Methodology:** Break it down into 6 months.
          *   Months 1-2: Conceptual mapping (The "Architecture").
          *   Months 3-4: Case studies (Asymbolia, Morphine, Chronic Pain).
          *   Months 5-6: Stress testing & White Paper drafting.
      *   **Deliverables:** A "Target Validation White Paper." Success = actionable distinctions. Failure = the distinction collapses under clinical scrutiny.
      *   **Scope:** Admit we aren't solving the Hard Problem of Consciousness. We are treating the mind as a black box with specific I/O characteristics relevant to control loops.

  4.  **Refining Tone and Language:**

      *   *Avoid:* "Qualia," "Noumena," "Phenomenology" (unless defined), "Normativity."
      *   *Use:* "Signal processing," "Control variable," "Clinical endpoint," "System architecture," "Valence," "Aversiveness."
      *   *Analogy:* The user's "Alarm vs. Escalation Policy" is gold. Use it prominently.
      *   *Audience Check:* Clinicians care about patient outcomes. Engineers care about control variables. Make sure the proposal speaks to both. The philosopher's role is to be the "System Architect of Concepts."

  5.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is the research question too abstract?
      *   *Fix:* Ground it in the control loop. "If we modulate X, does Y change?"
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* Keep the milestones high-level but specific. Emphasize the iterative feedback from the engineer (user) to the philosophers.
      *   *Critique:* Did I address the "failure" condition?
      *   *Fix:* Explicitly state that if the distinction can't be mapped to biomarkers or patient reports, the project fails (which is still valuable knowledge).
      *   *Critique:* Is the scope clear?
      *   *Fix:* Add a specific section on "Out of Scope" to prevent scope creep into general ethics or metaphysics.

  6.  **Final Polish:**

      *   Ensure the transition between the engineering problem and the philosophical inquiry is smooth.
      *   Check that the "No Bibliography" constraint is met (refer to positions descriptively).
      *   Make sure the "Alarm/Policy" analogy is clearly explained for the clinicians who might not know software architecture.

  7.  **Final Output Generation:** (Proceeding to write the proposal based on these thoughts.)
answer: |-
  **Project Title:** Operationalizing the Affective-Sensory Distinction in Closed-Loop Neuromodulation
  **Principal Investigator (Industry):** [Your Name], Control Systems Engineering
  **Collaborating Institution:** [University Name], Department of Philosophy / Cognitive Science
  **Duration:** 6 Months (Part-Time)
  **Funding Source:** [Company Name] University Partnership Program

  ---

  ### 1. Executive Summary

  Current closed-loop spinal cord stimulation (SCS) systems operate on a control theory model analogous to an autopilot: they detect a signal (nociceptive markers) and apply a counter-signal (stimulation) to minimize error (patient-reported pain intensity). However, clinical observations such as *pain asymbolia* (patients who feel pain but do not mind it) and opioid-induced analgesia suggest that "pain" is not a unitary variable. It may comprise at least two distinct components: a sensory-discriminative signal (location, intensity) and an affective-motivational response (suffering, aversiveness).

  Our current devices target the sensory signal. If the "badness" of pain resides primarily in the affective response, we may be optimizing the wrong control variable. This project proposes a six-month collaboration with philosophical researchers to rigorously define the boundary between these components. The goal is not abstract metaphysics, but a functional architecture of pain that informs engineering targets. The deliverable will be a White Paper determining whether the sensory/affective distinction is robust enough to support distinct clinical endpoints and neuromodulation strategies.

  ### 2. Background and Problem Statement

  **The Engineering Context**
  In our current control loop, the "plant" is the patient's nervous system. The sensor input is derived from biomarkers correlated with nociception. The set-point is defined by patient-reported outcomes, typically Visual Analog Scale (VAS) scores for pain intensity. The controller adjusts stimulation parameters to minimize the difference between current state and the set-point (zero pain).

  **The Anomaly**
  This model assumes that pain intensity and pain suffering are linearly coupled. However, dissociation cases challenge this assumption:
  1.  **Pain Asymbolia:** Patients with specific brain lesions report accurate pain intensity and location but exhibit no distress, sometimes smiling during noxious stimulation.
  2.  **Opioid Indifference:** Patients on morphine often report, "It still hurts, but it doesn't bother me."
  3.  **Chronic Pain Disproportion:** Patients often report distress levels that do not track with measurable nociceptive input.

  **The Hypothesis**
  In software architecture, we distinguish between a *monitoring alert* (a signal that a threshold was crossed) and an *escalation policy* (the logic that decides how urgently to react). It is possible that nociception is the alert, while suffering is the escalation policy. If so, a device that silences the alert (sensory signal) might be less efficient or ethical than one that rewrites the policy (affective response). Currently, we lack the conceptual framework to decide which target is legitimate, measurable, or safe.

  ### 3. Research Question

  The project will address a single, precise question:

  > *Is the negative valence (badness) of pain intrinsic to the sensory phenomenon itself, or is it constituted by a separable downstream evaluative process? Furthermore, can this distinction be mapped to distinct physiological or report-based variables suitable for closed-loop control?*

  This question branches into two engineering implications:
  *   **Condition A (Intrinsic Badness):** If the sensation *is* the suffering, then suppressing the sensory signal is the only valid therapeutic target.
  *   **Condition B (Separable Response):** If the suffering is a downstream response, then modulation could theoretically target the affective circuitry directly, potentially preserving protective sensation while eliminating suffering.

  ### 4. Why Existing Frameworks Are Insufficient

  There is an existing body of philosophical and psychological literature distinguishing the "sensory" and "affective" dimensions of pain. However, these discussions typically remain descriptive or metaphysical. They argue about what pain *is*, not how to intervene upon it.

  Two specific gaps prevent us from using this literature directly:
  1.  **Lack of Interventional Specificity:** Philosophers have not been required to specify where a causal intervention (like electrical stimulation) should land to alter one component without the other. They describe the dissociation but do not provide a control-theory compatible model of the boundary.
  2.  **Neglect of Edge Cases:** Standard theories often treat asymbolia or opioid indifference as anomalies to be explained away, rather than design constraints. We need to know if these states are therapeutic goals (a patient who feels injury but doesn't suffer) or pathological failures (a patient who ignores damaging injury).

  This project requires philosophers to shift from analyzing concepts to analyzing *system architecture*. They must translate phenomenological distinctions into variables that engineers can measure and clinicians can regulate.

  ### 5. Methodology and Timeline

  The project will run for six months on a part-time basis. It involves iterative collaboration between the industry engineer (providing system constraints and clinical scenarios) and the university researchers (providing conceptual analysis and logical stress-testing).

  **Months 1-2: Conceptual Architecture & Definition**
  *   **Activity:** The researchers will map existing philosophical positions on pain valence onto a functional block diagram.
  *   **Input:** I will provide the current control loop schematic and definitions of our current biomarkers.
  *   **Output:** A draft "Pain System Taxonomy" that defines the proposed boundary between Signal (Sensory) and Policy (Affective) without using unmeasurable metaphysical terms.

  **Months 3-4: Case Study Analysis**
  *   **Activity:** The team will apply the Taxonomy to three specific dissociation cases: Asymbolia, Opioid Indifference, and High-Distress/Low-Signal Chronic Pain.
  *   **Input:** I will supply de-identified clinical case summaries and literature descriptions of the physiological states associated with these conditions.
  *   **Output:** A report analyzing whether our current endpoints (e.g., "reduce intensity") would succeed or fail in these cases, and what the *correct* endpoint would have been under the new Taxonomy.

  **Months 5-6: Stress-Testing & White Paper Drafting**
  *   **Activity:** We will attempt to break the Taxonomy. I will present "adversarial" engineering scenarios (e.g., "If we target affect, do we remove the warning function of pain?"). The researchers will refine the definitions to withstand these challenges.
  *   **Output:** Final White Paper (see Deliverables).

  ### 6. Deliverables and Success Criteria

  **Primary Deliverable: The Target Validation White Paper**
  A 15-20 page technical document structured for an engineering and clinical audience. It will contain:
  1.  **Component Partition:** A clear definition of the "Sensory" and "Affective" components of pain, stated in terms of input/output relationships rather than subjective feeling.
  2.  **Legitimacy Matrix:** For each component, a statement on whether it is a legitimate target for neuromodulation, under what conditions, and what the risks are (e.g., "Targeting Affect is permissible only if Sensory thresholds remain above safety limit X").
  3.  **Endpoint Recommendations:** Proposed adjustments to clinical trial endpoints (e.g., adding "pain bothersomeness" scales alongside intensity scales).

  **Success Criteria**
  The project is successful if the White Paper provides a distinction that is:
  *   **Actionable:** A clinician can use the definitions to select a patient for a specific therapy mode.
  *   **Measurable:** An engineer can identify which biomarkers likely correlate with which component.
  *   **Regulatory Ready:** The distinction can be articulated to a regulatory body (e.g., FDA) without relying on ambiguous philosophical jargon.

  **Failure Conditions**
  We must be honest about the risk of failure. The project fails if:
  *   The researchers conclude the distinction is phenomenologically real but physiologically inseparable (i.e., you cannot change one without the other via stimulation).
  *   The definitions required to make the distinction precise become so complex they are unusable in a clinical setting.
  *   *Note:* A "failure" conclusion is still valuable. It prevents the company from investing in unfeasible control strategies.

  ### 7. Scope and Limitations

  To ensure completion within six months, the following boundaries are set:

  **In Scope:**
  *   The functional relationship between nociceptive signaling and affective response.
  *   Implications for control theory and clinical endpoint selection.
  *   Analysis of adult human pain states (excluding pediatric or congenital insensitivity).

  **Out of Scope:**
  *   **General Metaphysics of Consciousness:** We will not attempt to solve the "Hard Problem" of why pain feels like anything at all. We treat the subjective report as a valid data signal without debating its ontological status.
  *   **Ethics of Enhancement:** We will not debate the ethics of removing pain entirely (e.g., in healthy subjects). The scope is strictly therapeutic intervention for chronic pain patients.
  *   **Drug Development:** The focus is on electrical neuromodulation targets, not pharmacological mechanisms, though drug-induced states (like morphine indifference) are used as evidence.

  ### 8. Resource Requirements

  *   **University Team:** One faculty lead (Philosophy of Mind/Cognitive Science) and one post-doctoral researcher or PhD student.
  *   **Industry Time:** 5 hours/month from the Principal Investigator for review and scenario provision.
  *   **Data:** Access to de-identified clinical case summaries and existing literature on asymbolia/analgesia (no new patient data collection required).

  ### 9. Conclusion

  We are building devices that interact directly with the human experience of suffering. Currently, our engineering models treat "pain" as a scalar value to be minimized. This proposal acknowledges that pain is likely a vector with multiple components. By funding this collaboration, we are not paying for abstract theory; we are paying for a system requirements analysis of the human nervous system. The result will be a clearer roadmap for the next generation of closed-loop controllers, ensuring we are tuning the right knobs for the right reasons.
