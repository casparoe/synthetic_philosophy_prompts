      *   *Section 1: The Fatal Contradiction (a, f, g).* You can't have Many Worlds + Single Outcome + Objective Chance.
      *   *Section 2: The Bell Trap (b, c, d, e, f).* If you keep Single Outcome, you must violate Locality or accept Superdeterminism. Since you reject those, you must drop Single Outcome.
