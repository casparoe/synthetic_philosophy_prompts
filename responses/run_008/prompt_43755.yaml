answer: |-
  This is a fantastic puzzle. You have basically stumbled into one of the most famous debates in modern philosophy and experimental psychology without realizing it. Your friend Devi isn't just making stuff up; she is unconsciously applying a very specific cognitive heuristic that has been studied extensively.

  Here is the breakdown of the rule she's running, the predictions for your new cases, and the "bomb" you can drop at lunch.

  ### 1. The Name of the Thing (The Bomb)
  The phenomenon in your first two bullet points (CEO pollutes vs. CEO helps, same "don't care" attitude, opposite verdicts) is called **The Knobe Effect** (or **The Side-Effect Effect**).

  It was discovered by philosopher **Joshua Knobe** in 2003. He ran experiments almost identical to your first two scenarios. The finding was shocking: people's judgment of *intentionality* is not based purely on the agent's mental state (what they wanted or knew), but is biased by the *moral valence of the outcome*.
  *   **Bad side effect?** We say it was done "on purpose."
  *   **Good side effect?** We say it was "just a side effect."

  **Drop this at lunch:** *"Devi, you're not judging intent, you're demonstrating the Knobe Effect. Your brain is back-filling intentionality based on moral outrage."*

  ### 2. The Rule Devi Is Running
  Your theory is that she judges based on **Character** ("Is he a jerk?").
  My analysis is that she judges based on **Outcome Valence** ("Did things get worse?").

  Here is why your theory is slightly off: Look at your first two cases. It is the **exact same CEO** with the **exact same attitude** ("doesn't care about the river"). His character is constant. But Devi's verdict flips based entirely on whether the river got dirty or clean. If it were about him being a jerk, she should call *both* intentional (because he's indifferent either way).

  **Devi's Algorithm:**
  1.  **Is the side effect Harmful?**
      *   Yes + Agent knew/allowed it = **Intentional.** (Cases 1, 3, 5)
      *   Yes + Agent fought/prevented it = **Not Intentional.** (Exception to the rule)
  2.  **Is the side effect Helpful?**
      *   Yes + Agent knew/allowed it = **Not Intentional.** (Cases 2, 6)
      *   Yes + Agent aimed for it = **Intentional.** (Implied, though not in your list)

  She treats "Intentional" as a synonym for "Blameworthy," and "Unintentional" as a synonym for "Praiseworthy or Neutral."

  ### 3. Predictions for Your Three New Cases

  Here is what Devi will likely say, based on the Knobe pattern:

  **(a) The Reluctant CEO (Harm, but fought it)**
  *   **Verdict:** **NOT Intentional.**
  *   **Reason:** This is the critical exception. In Knobe's follow-up studies, if the agent actively *objects* to the harm and tries to prevent it (even if they fail), people withdraw the "intentional" label. Since he fought the plan and paid for cleanup, he is no longer "blameworthy" in her eyes, so the harm becomes a tragedy, not an intention.
  *   **Does it split the rules?** Yes. Your "Jerk Theory" says Not Intentional (he's not a jerk). The "Harm Theory" says Intentional (harm happened). This case proves the "Harm Theory" needs a "Consent" clause.

  **(b) The Surgeon (Harm, but for Greater Good)**
  *   **Verdict:** **NOT Intentional.**
  *   **Reason:** This falls under the "Doctrine of Double Effect." Because the *primary goal* is Good (saving a life), Devi will categorize the numbness as "collateral damage" rather than an intention. She views the action as "Saving a life," not "Numbing an arm."
  *   **Does it split the rules?** Yes. Your "Jerk Theory" says Not Intentional (surgeon is a hero). The strict "Harm Theory" might say Intentional (he knew it would happen). Devi will side with the Hero.

  **(c) The PR Donor (Help, but Selfish Motive)**
  *   **Verdict:** **NOT Intentional.**
  *   **Reason:** This is the mirror of Case 2. The outcome is Help. Even though his motive is selfish (PR), the *result* is good. Devi's system protects "Good Outcomes" from being labeled as intentional if the motive isn't pure altruism. She will say he "used the flood for PR," not that he "intentionally helped the victims."
  *   **Does it split the rules?** **YES. This is your killer case.**
      *   **Your Theory (Jerk = Intentional):** The guy is a jerk (doesn't care about victims, only PR). You predict she will say **Intentional**.
      *   **Devi's Rule (Help = Not Intentional):** The outcome is Help. You predict she will say **Not Intentional**.
      *   **Why this wins the bet:** If she says "Not Intentional," your theory that "it's about whether the person is a jerk" is disproven. She will admit he's selfish but still claim the help was accidental/incidental.

  ### 4. How to Settle It (The Follow-Up Case)
  To absolutely crush the debate, you need a case where **Moral Character** and **Outcome Valence** are completely divorced. You need a **Neutral Outcome.**

  **Throw this case at her next:**
  > "A CEO implements a new program to make money. He knows it will change the color of the factory walls from beige to off-white. He doesn't care about the wall color at all. Did he change the wall color on purpose?"

  *   **If she is following the Knobe Effect:** She will hesitate or say **"No/Not really."** Because the outcome is morally neutral, she won't feel the urge to assign intentionality.
  *   **If she is following Your Theory (Jerk-ness):** If she thinks the CEO is a jerk, she should say **"Yes."**
  *   **If she is following Strict Intent:** She should say **"Yes"** (He knew it would happen and did it anyway).

  **Why this works:** The Knobe Effect disappears when the side effect is neutral. If Devi stops calling things "on purpose" when the outcome isn't good or bad, you prove that her "Intentional" label is actually a "Moral Judgment" label in disguise.

  ### Summary for Lunch
  1.  **Drop the name:** "The Knobe Effect."
  2.  **Point out the flaw in your own theory:** The CEO in cases 1 and 2 is the same jerk, but gets different verdicts. So it's not about *him*, it's about the *river*.
  3.  **Bet on Case (c):** The PR Donor. If she says he didn't help "on purpose," your "Jerk Theory" loses.
  4.  **Win the war:** Ask the "Wall Color" question. If she says changing the wall color wasn't intentional, she admits she only assigns intent when she wants to blame someone.

  Good luck. You're basically walking into a philosophy seminar with a sandwich.
