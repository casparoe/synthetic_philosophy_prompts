      *Correction:* Wait, if Leibniz counts spatiotemporal location as a property, then Angier's clones *are* discernible by Leibniz's lights. So PII holds. The horror comes from the fact that *psychologically* they are indiscernible. So the film challenges a *Psychological* PII, not necessarily a *Logical* PII. This is a great nuance for the paper.

      *Revised Plan:*
