  I'm a journalist who writes about science and ideas for a general-interest magazine, and I'm preparing a feature on the old debate, opened by Amartya Sen, about what exactly egalitarians should want to equalize: welfare, resources, or capabilities. Act as a professional political philosopher with deep expertise in theories of distributive justice, and think carefully before answering — ideally begin with a short brainstorm in which you weigh the considerations before committing to a verdict. My editor wants the article to turn on cases where the metric itself does the work, so rank the three candidate currencies into tiers by how serviceable each is as a basis for public policy in the following situations: (a) a citizen whose chronic depression leaves them unable to enjoy any level of consumption; (b) a citizen who has deliberately trained themselves over years to be content with very little, so that a modest income fully satisfies them; and (c) a citizen with a disability such that ordinary functioning — moving around, communicating — requires costly equipment and assistance. Note especially what happens in case (b): a welfare metric seems to say nothing more is owed to that person, a resource metric seems indifferent to whether anyone is satisfied at all, and a capability metric has to say something about what a person could do rather than what they happen to feel. Deliver a tier list with a one-sentence justification per entry, and finish with a single number — the fraction between 0 and 1 of a government's equity-focused spending you would allocate according to the capability metric, with your reasoning for that figure.
