  **Brainstorming the Metrics**

  The core tension lies in distinguishing between what people have, what they can do, and how they feel. Case (a) presents a conversion problem: resources exist but cannot be converted into well-being due to internal constraints, suggesting welfare or capabilities are superior to raw resources. Case (c) is a classic disability critique: equal resources yield unequal freedom, demanding a metric that accounts for differential needs, which favors capabilities over strict resource equality. However, Case (b) is the decisive test for political philosophy: the "contented poor" citizen reveals the danger of welfare metrics, which would validate oppressive adaptation by declaring justice served simply because the victim feels satisfied. Resources handle (b) better by ignoring subjective satisfaction, but they fail to explain *why* we give resources if not for the freedom they afford. Capabilities uniquely solve (b) by focusing on the substantive freedom to choose otherwise, regardless of current contentment, while also addressing the conversion factors in (a) and (c). Therefore, while resources are administratively clearer than capabilities, capabilities provide the only normative compass that avoids validating deprivation through adaptation.

  **Tier List of Distributive Currencies**

  **Tier 1: Capabilities**
  This metric best serves justice by securing substantive freedoms for the depressed and disabled while refusing to accept adapted preferences as evidence of sufficiency.

  **Tier 2: Resources**
  Allocating primary goods avoids the trap of rewarding adaptive satisfaction but fails to account for the unequal costs required to convert those goods into functioning.

  **Tier 3: Welfare**
  Focusing on subjective utility risks neglecting the disabled person's high needs and erroneously concludes that the contented citizen requires no social support.

  **Equity Spending Allocation**

  While the capability approach offers the superior normative framework for justice, a small portion of equity spending must remain reserved for immediate welfare interventions, such as pain management or crisis counseling, which address suffering directly rather than through the expansion of freedom. Consequently, the majority of funds should target capability expansion to ensure long-term agency and resilience, but not so exclusively that acute subjective distress is ignored in favor of abstract opportunity sets.

  0.85
