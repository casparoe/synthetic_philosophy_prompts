  **Joint Statement of Adversarial Collaboration on Arithmetic Ontology**

  **Part 1: Agreed Claims**

  The parties affirm the following twelve claims, each accepted by both but rejected by sympathisers of formalism, intuitionism, or Mill-style empiricism.

  1. Classical mathematical practice is legitimate and remains undisturbed regardless of metaphysical outcomes.
  2. Arithmetical statements possess determinate truth values independent of our capacity to verify them.
  3. Following Benacerraf 1965, no particular set-theoretic reduction of arithmetic is privileged; numbers are not simply sets.
  4. The semantic and epistemological challenges facing platonism, outlined in Benacerraf 1973, come apart and may be answered separately or together.
  5. Mathematics is, as science is actually practised, indispensable to our best scientific theories.
  6. This indispensability does not, without further premises, entail ontological commitment.
  7. Mathematical propositions are not mere empirical generalisations about physical objects.
  8. Mathematical discourse is not merely syntactic manipulation without content.
  9. Both parties accept classical logic, including the law of excluded middle for infinite domains.
  10. A nominalistic reconstruction of science must preserve the empirical consequences of standard science.
  11. Scientific theories aim at truth, whether interpreted platonistically or nominalistically.
  12. The quantifier 'there exists' functions univocally across mathematical and scientific contexts, though its ontological import is disputed.

  **Part 2: Residual Disagreements**

  | Disagreement | Platonist Wording | Nominalist Wording |
  | :--- | :--- | :--- |
  | **Ontology** | Abstract objects exist independently of mind and language. | Talk of abstract objects is a useful fiction without ontological weight. |
  | **Truth** | Mathematical sentences are literally true. | Mathematical sentences are true only within the pretence. |
  | **Quantifiers** | Existential quantifiers incur ontological commitment. | Existential quantifiers in math do not incur ontological commitment. |

  **Part 3: Cruxes and Predictions**

  1.  **Indispensability.** The dispute concerns whether mathematics is indispensable (Platonist) or merely an expressive convenience eliminable via conservative extension (Nominalist).
      *   *Platonist Prediction:* The hard road of Field-style nominalisation will fail when extended to quantum mechanics or general relativity.
      *   *Nominalist Prediction:* Conservativeness can be proven, or the easy road shows mathematics is a representational aid not requiring literal assertion.
      *   *Test:* Extending the nominalisation programme beyond Newtonian gravitation to theories with less friendly ontologies.

  2.  **Epistemic Access.** The dispute concerns how we know mathematical truths (Platonist: reliability via conceptual competence; Nominalist: requires causal or structural account).
      *   *Platonist Prediction:* A deflationary response to the demand for a causal story succeeds by citing conceptual competence.
      *   *Nominalist Prediction:* Success requires showing how beliefs track facts without causal contact.
      *   *Test:* Evaluating whether deflationary accounts satisfy the sceptical challenge posed in Benacerraf 1973.

  3.  **Semantics.** The dispute concerns how numerals refer (Platonist: numerals refer to abstracta; Nominalist: numerals are syncategorematic or refer to concrete surrogates).
      *   *Platonist Prediction:* Reference to abstract objects is coherent and necessary for semantic uniformity.
      *   *Nominalist Prediction:* Reference is intelligible only within the fiction or via concrete proxies.
      *   *Test:* Analysing whether numeral usage in science requires literal reference to abstract entities.

  4.  **Verbal Dispute.** The dispute concerns whether the ontology question is substantive (Platonist: substantive external question; Nominalist: partly verbal, framework relative).
      *   *Platonist Prediction:* The dispute is substantive; existence claims are not merely internal to a framework.
      *   *Nominalist Prediction:* The dispute is partly verbal; existence claims are internal to a linguistic framework.
      *   *Test:* Determining if Carnapian internal/external distinctions dissolve the ontological disagreement.

  **Part 4: Claims That Could Not Be Jointly Signed**

  1.  *Claim:* "Mathematics is true because it is indispensable."
      *   *Diagnosis:* The Nominalist found this question-begging, as it presupposes the resolution of Crux 1 regarding indispensability implying truth.
  2.  *Claim:* "Fictionalism undermines the objective value of science."
      *   *Diagnosis:* The Nominalist found this unmotivated, as empirical consequences are preserved per Claim 10; the Platonist found it false.
  3.  *Claim:* "Numbers exist in a non-spatial realm."
      *   *Diagnosis:* The Nominalist rejected this as presupposing the resolution of Crux 2 and 3 regarding epistemic access and semantics.

  **Closing**

  Certain logical spaces remain unoccupied. Easy-road nominalism conjoined with a robust commitment to literal mathematical reference appears incoherent, as it accepts the fiction while asserting literal truth. Platonism conjoined with the claim that mathematical existence statements lack determinate content is likewise incoherent, contradicting Claim 2. A view treating mathematics as a mere game without truth values (Formalism) was excluded by Claim 8. These positions remain unexplored by the parties, judged either incoherent or incompatible with the agreed basis of classical practice. The collaboration concludes that while the metaphysical verdict remains outstanding, the dialectical landscape has been mapped with sufficient precision to isolate the precise points of divergence without capitulation from either side.
