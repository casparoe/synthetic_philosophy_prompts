answer: |-
  It is quite understandable that the passage you found left you with a nagging sense that something was amiss. Your instincts are sharp; the summary you quoted is a classic example of a "philosophical telephone game" result. It takes a rigorous technical theorem, strips away the necessary qualifications, and presents a specific philosophical resolution as if it were the only logical consequence.

  You are right to be suspicious. While the core mathematical result (Lewis's Triviality) is genuine, the philosophical moral drawn from it is highly contested, and the practical claims about betting are simply incorrect.

  Here is a breakdown of that passage, bit by bit, followed by an explanation of the technical machinery and how you might handle those forum arguments in future.

  ### Bit-by-Bit Analysis

  **1. "Lewis proved back in the seventies that indicative conditionals can't have probabilities."**
  *   **Verdict:** *Wince.*
  *   **Comment:** This is too blunt. Lewis proved that indicative conditionals cannot be **propositions** (truth-apt statements) *if* we also accept Adams' Thesis. He did not prove they cannot have probabilities *simpliciter*. One can assign a probability to a non-propositional entity (like a command or a question, in some frameworks), or one can deny that the probability follows Adams' Thesis. The theorem constrains the relationship between truth conditions and probability, it does not banish probability entirely.

  **2. "The idea he was attacking — called Adams' Thesis... is that the probability of an 'if' statement should equal the conditional probability..."**
  *   **Verdict:** *Accept.*
  *   **Comment:** This is accurate. Ernest Adams argued that the assertibility (or probability) of a conditional $A \to C$ is given by the conditional probability $P(C|A)$. This is often called "The Equation". Most philosophers agree The Equation captures our intuitive usage quite well.

  **3. "Lewis showed that if you insist on this, the only way it can work is if nothing anywhere has a probability strictly between 0 and 1..."**
  *   **Verdict:** *Mostly Accept (with technical caveats).*
  *   **Comment:** This is the "Triviality Result". Roughly speaking, Lewis showed that if conditionals are propositions *and* The Equation holds for a suitable class of probability functions, then the algebra of propositions collapses. In such a world, you cannot be uncertain about anything; everything is either certainly true or certainly false. Your suspicion about "one probability function or for all of them" is spot on. Lewis's result requires The Equation to hold for a class of probability functions that is closed under conditionalisation (updating). If it only held for one static function, the result wouldn't follow. The blog post glosses over this, but the "nothing between 0 and 1" summary is the standard shorthand for the triviality consequence.

  **4. "Since that's absurd, conditionals just aren't the sort of thing that can be more or less likely..."**
  *   **Verdict:** *Wince.*
  *   **Comment:** This presents a philosophical choice as a forced conclusion. The absurdity implies that *one of the premises* must go. The premises are: (1) Conditionals express propositions; (2) The Equation holds. Lewis rejected (1). But others have rejected (2) (arguing conditionals are material implications), or argued that conditionals are context-sensitive (Stalnaker), or that they are propositions but express different contents in different contexts (Bradley). To say they "aren't the sort of thing that can be more or less likely" is to adopt a non-cognitivist stance (like Dorothy Edgington), which is a valid position, but not the *only* one permitted by the maths.

  **5. "...which is also why Bayesians treat 'if' statements as inference rules or dispositions rather than claims..."**
  *   **Verdict:** *Wince.*
  *   **Comment:** This is an overgeneralisation. Many Bayesians simply treat $P(\text{if } A, C)$ as shorthand for $P(C|A)$ without worrying about the ontological status of the conditional. Some treat it as a rule (Ramsey test), but many contemporary Bayesians (like Richard Bradley) have developed formalisms where conditionals *do* have truth conditions and probabilities by modifying the underlying logic. It is not a uniform Bayesian doctrine.

  **6. "...and why you can never coherently bet on an 'if'."**
  *   **Verdict:** *Wrong.*
  *   **Comment:** This is factually incorrect regarding betting theory. Bruno de Finetti specifically developed a theory of **conditional bets**. In a conditional bet on $C$ given $A$, if $A$ turns out false, the bet is called off (void) and stakes are returned. If $A$ is true, you win or lose based on $C$. This is perfectly coherent and widely used in probability theory. The blog author is confusing "cannot be a proposition" with "cannot be the subject of a wager".

  ### The Technical Core: One Function or All?

  You asked whether the distinction between one probability function and all of them matters. It matters immensely.

  Lewis's result does not say: "For a single agent at a single time, you cannot assign a probability to a conditional."
  It says: "If you assume conditionals are propositions, and you require that $P(A \to C) = P(C|A)$ holds for **any** rational probability function an agent might adopt (specifically, a class closed under conditionalisation), then the logic is trivial."

  The problem arises when you try to *update*. If I learn new information, my probability function changes. If the conditional is a fixed proposition with a truth value, its probability should update via standard conditionalisation. But if its probability is defined by the ratio $P(C|A)$, the updating rules clash unless the probabilities are all 0 or 1.

  So, the result forbids a specific *system* of logic and probability working together. It does not forbid a single agent from writing down a number like 20% for a conditional at a specific moment.

  ### Does "$P(\text{if } X, Y) = 20\%$" Survive?

  This is the crux of your forum arguments. The comment-section pedants are claiming that writing $P(\text{if AGI}, \text{doom}) = 20\%$ is meaningless.

  **They are wrong.** Here is the sensible reading that survives Lewis's result:

  1.  **The Shorthand View:** When a rationalist writes $P(\text{if } A, C) = x$, they are not asserting that there exists a proposition "If A, C" in their ontology. They are using a convenient shorthand for $P(C|A) = x$. This is perfectly coherent. It is merely notation.
  2.  **The Assertibility View:** Following Adams and Edgington, one can argue that conditionals do not have *truth conditions* (they aren't true or false), but they do have *assertibility conditions*. We can measure the probability of a statement being *assertible*, even if it isn't strictly true. In this view, the probability is real, it just isn't the probability of a truth-condition.
  3.  **The Betting View:** As mentioned, you can bet on conditionals via conditional bets (De Finetti). If you are willing to accept a bet that pays out £1 if AGI arrives and we die, costs you £0.20 upfront, and is void if AGI does not arrive, then you have operationally defined a 20% probability for that conditional.

  ### How to Handle the Forum Arguments

  When you encounter this on the forums, you might reply along these lines (in proper British English, naturally):

  > "Lewis's Triviality Theorem shows that we cannot treat conditionals as **propositions** while maintaining that their probability equals the conditional probability $P(C|A)$ across all updates. It does not prove that assigning a value to $P(\text{if } A, C)$ is meaningless.
  >
  > In practice, when we write $P(\text{if AGI}, \text{doom}) = 20\%$, we are either:
  > 1. Using shorthand for $P(\text{doom} | \text{AGI}) = 0.2$.
  > 2. Referring to the probability of the conditional being **assertible** (per Adams/Edgington), rather than true.
  > 3. Referring to a **conditional bet** (per De Finetti), which is void if the antecedent is false.
  >
  > None of these interpretations are ruled out by Lewis. Lewis rules out a specific combination of truth-conditions and probability dynamics, not the practical usage of conditional probabilities in forecasting."

  ### Summary

  The blog post you read took a profound result in philosophical logic and turned it into a prescriptive rule for forum etiquette.

  *   **Lewis's Result:** Real and robust.
  *   **The "Nothing between 0 and 1" claim:** Accurate shorthand for the triviality consequence.
  *   **The "Conditionals can't have probabilities" claim:** Philosophically contentious; depends on what you mean by "have".
  *   **The "Can't bet on ifs" claim:** Plainly false.
  *   **The "Writing $P(\text{if}...)$ is meaningless" claim:** Unhelpful pedantry. It ignores the standard convention of treating it as conditional probability or assertibility.

  You are quite right to feel that the summary smelled off. It confused a limitation on formal semantics with a prohibition on practical reasoning. Do feel free to assign probabilities to your conditionals; just be clear that you are treating them as conditional probabilities or assertibility measures, not as truth-apt propositions in a Boolean algebra.

  Hope that clears the matter up. Touch wood you won't have to fight this battle in the comments too many more times.
