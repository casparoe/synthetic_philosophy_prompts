      *   Avoid taking sides (don't say M2 is right and others are wrong, though M2 is closest to the standard logical consensus).
      *   Focus on the *structure of the disagreement*.
      *   Ensure I answer the specific prompt: "Diagnosis with reasons" and "What would count as progress."

  9.  **Self-Correction/Nuance Check:**
      *   *Wait, is M2 right?* Standard logic says rules aren't premises. So M2 is technically correct about the *logic*. But M1 is asking about *epistemology*. I need to make sure I don't dismiss M1 as "wrong," but rather as "asking a different question." M1 is asking about the *authority* of the rule, not its *status*.
