  # JOINT STATEMENT ON THE INTERPRETATION OF PROBABILITY
  **Working Group on Probabilistic Foundations**
  **Date:** October 24, 2023
  **Signatories:** [Frequentist Representative], [Subjectivist Representative]

  ## 1. Agreed Claims

  After one year of adversarial collaboration, the undersigned parties affirm the following substantive points of agreement. These claims represent concessions made by both sides regarding the scope and utility of their respective frameworks.

  1.  **Mathematical Apparatus:** Both parties accept the Kolmogorov axioms as the valid calculus for probability. The Frequentist accepts these as describing the logical behavior of relative frequencies in the limit of infinite repetitions. The Subjectivist accepts these as necessary constraints for coherence in degrees of belief (avoiding Dutch Books). Both agree that violations of this calculus constitute an error in reasoning or modeling, regardless of interpretation.
  2.  **Calibration and Evaluation:** Both parties agree that calibration (the alignment of forecasted probabilities with observed frequencies over a series) is a necessary condition for evaluating a forecasting system that issues probabilities for unique events. The Frequentist concedes that calibration is the only empirical access available to assess the validity of single-case shorthand. The Subjectivist concedes that a systematically uncalibrated forecaster is practically irrational, even if their beliefs are internally coherent at any single moment.
  3.  **Hypothesis vs. Data:** Both parties accept the asymmetry between $P(Data | Hypothesis)$ and $P(Hypothesis | Data)$. Both agree that $P(Data | Hypothesis)$ (likelihood) can be computed without interpretive disagreement given a model. Both agree that assigning a probability to a hypothesis itself requires additional structure (a prior distribution for the Subjectivist; a confidence procedure or error-statistical framework for the Frequentist) and that conflating these two quantities is an error common to both traditions.
  4.  **Convergence in Practice:** Both parties agree that in cases involving large numbers of exchangeable or independent trials, the two frameworks yield identical practical recommendations for decision-making. The Frequentist concedes that the Subjectivist's use of exchangeability effectively reconstructs the Frequentist's reference class. The Subjectivist concedes that the Frequentist's reliance on long-run performance implicitly assumes a judgment of stability that is epistemically subjective.
  5.  **Normative Force:** Both parties agree that probability statements function normatively. They are not merely descriptions of psychological states (for the Subjectivist) or physical states (for the Frequentist), but prescriptions for how a rational agent ought to wager, act, or infer given specific information.

  ## 2. Disagreements Table

  The following table enumerates the residual disagreements. Each row addresses a single point of contention. The left column states the position in language the Frequentist (F) accepts as accurate; the right column states the position in language the Subjectivist (S) accepts as accurate. Neither party endorses the wording in the opposing column, but both certify that the opposing wording is a fair characterization of the opponent's view.

  | Topic | Frequentist Formulation (F) | Subjectivist Formulation (S) |
  | :--- | :--- | :--- |
  | **Truth Conditions for Single Cases** | A probability statement regarding a single, unrepeatable event is strictly meaningless unless treated as an elliptical reference to the long-run frequency of a defined reference class. Its "truth" depends on the physical properties of the trial generating process, not the agent. | A probability statement regarding a single event is a complete proposition concerning an agent's degree of belief. Its "truth" depends on the coherence of the belief with the agent's total information state, not on physical repetitions. |
  | **The Ontology of Chance** | There exist objective physical chances (propensities or frequencies) independent of any observer's knowledge. A probability assignment is incorrect if it mismatches these physical facts, even if the agent is perfectly coherent. | There are no "physical chances" distinct from an agent's judgment of exchangeability. To posit a probability fact beyond an agent's coherent belief is to posit a metaphysical entity with no empirical cash value. |
  | **The Role of the Reference Class** | The primary epistemic task is identifying the correct objective reference class. Ambiguity arises from ignorance of the physical setup. | The primary epistemic task is assessing exchangeability. Ambiguity arises from the under-specification of the agent's information set. |
  | **Meaning of "Correct Probability"** | For a unique event, there is no "correct probability" inherent to the event itself. There is only a correct *procedure* for generating estimates based on known frequencies. | For a unique event, there is a "correct probability" relative to the agent's information. Two agents with different information may both be correct in assigning different probabilities to the same event. |

  ## 3. Cruxes and Test Cases

  The parties have identified two sub-questions ("cruxes") where settling the matter would significantly alter one party's position. For each crux, we have selected a concrete test case. Below are the predictions recorded by each party *prior* to the examination of the agreed evidence.

  ### Crux 1: The Status of the Single Forecast
  **Question:** Is there a fact of the matter about the correctness of a probability assigned to a unique, unrepeatable event, independent of the agent's track record?
  **Test Case:** *The Last Forecast.* A weather station issues a final 30% rain forecast before permanent decommissioning. No further forecasts will occur. A sealed archive is later audited, revealing that across thousands of prior unique forecasts, rain followed 30% announcements exactly 30% of the time.

  | Party | Prediction Regarding the Audit's Implications |
  | :--- | :--- |
  | **Frequentist** | **Prediction:** The audit validates the *procedure* used by the station, confirming that the reference class was well-chosen. <br>**Implication:** This does **not** establish that "30%" was the true probability *for that specific day*. The single event remains a binary outcome (rain/no rain). The audit merely confirms that the shorthand language used for the single case was backed by a reliable frequency generator. If the audit had failed, the single forecast would have been retrospectively deemed "ill-formed," not "false." |
  | **Subjectivist** | **Prediction:** The audit validates the *rationality* of the forecaster's belief state. <br>**Implication:** This confirms that the 30% assignment was a **correct** degree of belief given the information available at the time. The audit does not change the outcome of the day, but it settles that the probability assignment itself was objectively appropriate for that information state. If the audit had failed, the single forecast would have been retrospectively deemed "irrational" or "incoherent." |

  ### Crux 2: Truth Conditions Without Repetition
  **Question:** What condition must obtain for a probability assignment to be "wrong" in a scenario where no repetition is possible?
  **Test Case:** *The Discontinued Die.* An artisan produces a single die via a discontinued process. It will be rolled once. A probabilist assigns $P(6) = 1/6$.
  **Agreed Evidence:** Physical inspection reveals the die is visually symmetric, but internal density scans (available only after the roll) show a minute, unknown bias.

  | Party | Prediction Regarding Conditions for Error |
  | :--- | :--- |
  | **Frequentist** | **Prediction:** The announcement is **wrong** if the physical propensity of this specific die differs from 1/6, even if we can never measure it via frequency. <br>**Condition for Concession:** I would concede the Subjectivist's view only if it can be shown that "physical propensity" is incoherent without reference to a hypothetical infinite sequence. Until then, the assignment is a claim about the physical object, not the mind. |
  | **Subjectivist** | **Prediction:** The announcement is **wrong** only if it violates coherence (e.g., sum of probabilities $\neq$ 1) or ignores relevant evidence available *at the time of assignment* (e.g., visible weighting). <br>**Condition for Concession:** I would concede the Frequentist's view only if it can be demonstrated that an agent can be rationally compelled to adopt a specific betting quotient solely by the physical structure of the die, independent of their information state. |

  ## 4. Closing Diagnosis: Verbal vs. Substantive

  The parties have debated whether their disagreement is merely verbal (misuse of the word "probability") or substantive (conflict about the world). We offer the following joint diagnosis:

  **1. The Verbal Component:**
  Both parties agree that a portion of the dispute is verbal.
  *   **Frequentist Diagnosis:** The Subjectivist is using the word "probability" to refer to *epistemic justification*. If they admitted this, we would agree that *frequencies* are the only probabilities, while *justification* is a separate category.
  *   **Subjectivist Diagnosis:** The Frequentist is using the word "probability" to refer to *physical stability*. If they admitted this, we would agree that *degrees of belief* are the only probabilities, while *stability* is an empirical assumption about the world.
  *   **Joint Concession:** We agree that we are often talking past each other because the Frequentist treats "probability" as a noun denoting a physical property, while the Subjectivist treats it as an adjective denoting a logical relation.

  **2. The Substantive Component:**
  Both parties agree that a portion of the dispute is substantive and cannot be dissolved by terminology.
  *   **The Core Disagreement:** The dispute over **ontological commitment** remains unresolved.
      *   The Frequentist maintains that there are facts about the world (physical chances/frequencies) that exist independently of any agent's information or coherence.
      *   The Subjectivist maintains that positing such facts is metaphysically idle and that all probabilistic content is exhausted by the agent's information and coherence constraints.
  *   **Why this is not verbal:** This is not merely a definition of words; it is a disagreement about what exists. If the Frequentist is right, the Subjectivist's framework is incomplete (it misses physical chance). If the Subjectivist is right, the Frequentist's framework is incoherent (it posits unknowable entities).

  **Signed,**

  _________________________
  [Frequentist Representative]

  _________________________
  [Subjectivist Representative]
