  9.  **Final Polish:** Ensure the distinction between "wild animal suffering" (WAS) and "environmental ethics" is clear. Highlight that the "mitigation flip" is the strongest lever the user has found. (This aligns with the user's specific worry).

  **(Self-Correction during drafting):** I need to make sure I address the "epistemic cop-out" charge directly. The user feels like falling back on standard norms might be lazy. I need to reframe standard norms as "heuristics born of long-term uncertainty management."

  10. **Final Output Structure:**
      *   Intro: Validate the complexity.
      *   Section 1: The Wild Animal Suffering (WAS) Calculus (and why it breaks).
      *   Section 2: The Mitigation Paradox (Your specific insight).
      *   Section 3: The Role of the Commissioner (Epistemic Humility).
      *   Section 4: Reframing the "Cop-Out."
      *   Section 5: Practical Questions for the Vote.
      *   Closing: Permission to vote on what you can know.

