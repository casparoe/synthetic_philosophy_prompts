  So I fell down a youtube rabbit hole last night and one of the videos was about the Ellsberg paradox, and something about the explanation has been bugging me ever since. Near as I can reproduce it, the video said: 'Ellsberg set up urns where you know some of the odds but not others, and showed that basically everyone would rather bet on the known odds even when it costs them money. This proves expected utility theory is wrong, and more than that, it shows that being spooked by unknown probabilities is just a bias -- the rational move is to treat every unknown chance as 50/50, so people who won't touch the mystery urn are literally leaving money on the table. It's the same reason people overpay for insurance instead of just taking the expected value. Ellsberg thought all this was so important that he left economics to leak the Pentagon Papers.' Something along those lines.

  A friend of mine who took a decision theory course says the video is sloppy but wouldn't elaborate, which is annoying. Can you go through it bit by bit? Like which parts a decision theorist would nod along to, which are simplifications they'd tolerate from a pop video, and which parts are straight up wrong? I'm specifically unsure about the 50/50 claim and the insurance bit -- do those actually follow from the Ellsberg result, or are they bolted on? Also is it true the paradox 'proves' EU theory is wrong, like is the normative question settled that cleanly? And the Pentagon Papers thing at the end -- did he seriously do both?? that part sounds made up but weirdly specific

  Btw if it matters, I'm inclined to believe the video, mostly because the urn thing does feel like a bias to me -- if I don't know the odds, assuming the worst seems smart, not dumb. Happy to be corrected tho.
