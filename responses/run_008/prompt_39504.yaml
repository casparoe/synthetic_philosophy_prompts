answer: |-
  This is one of the sharpest summaries of the MEC (Moral Equality of Combatants) stalemate I have read, and your hypothesis is remarkably close to the structural heart of the problem. You are right that the loop persists because the participants are often talking past one another, but it is deeper than merely "answering different questions."

  Here is a diagnosis of the disagreement, an analysis of why the interference cases (like prosecution) break your separation hypothesis, and a proposal for what actual progress would look like.

  ### The Diagnosis: Ideal Theory vs. Non-Ideal Theory with a Clash of Authority

  Your hypothesis that Revisionists are doing **fundamental ethics** and Traditionalists are doing **institutional design** is correct, but it understates the conflict. The disagreement is not just about *subject matter*; it is about the **authority of moral norms.**

  1.  **The Revisionist Project (Ideal Theory):** They are asking, "What are the true conditions under which a human being forfeits their right to life?" This is a question of *metaphysical liability*. For McMahan and others, morality is truth-tracking. If a soldier is fighting for an unjust cause, they are materially contributing to a rights-violation. To say they are "morally equal" is to tell a lie about the world. They view the Traditionalist position as a form of moral positivism that surrenders truth to convention.
  2.  **The Traditionalist Project (Non-Ideal Theory):** They are asking, "What norms must we adopt to minimize the horror of war given human epistemic limitations?" This is a question of *regulatory efficacy*. For Walzer and others, morality is action-guiding. A moral rule that cannot be followed (because soldiers cannot judge *jus ad bellum* in the fog) is a bad moral rule. They view the Revisionist position as "moral purism" that ignores the cost of implementation.

  **The Real Stalemate:** The fight isn't just that they have different projects; it's that they both claim the title of "Morality."
  *   The Revisionist says: "If your rule requires me to ignore the truth of liability, your rule is immoral."
  *   The Traditionalist says: "If your truth requires a rule that leads to more death and chaos, your truth is immoral."

  This is a **second-order disagreement about the function of ethical theory.** Is ethics about describing the landscape of rights and duties (Revisionist), or is it about engineering the best possible outcomes in a broken world (Traditionalist)?

  ### Why the Interference Case Breaks the Separation

  You noted that your "two projects" hypothesis struggles with the interference cases, specifically prosecution and liability. You asked why they don't stay neatly separable.

  They don't separate because **law is the point of contact between ideal morality and institutional reality.**

  In a domestic context, if a police officer shoots a civilian, we have courts to determine if that was murder or justified. In war, the LOAC creates a "safe harbor" for combatants. The interference happens when we ask: *What does the court do when the safe harbor protects a moral wrong?*

  *   **The Revisionist Dilemma:** If the unjust soldier is morally liable (a murderer in deep morality), but the LOAC says he is immune, the Revisionist must either:
      1.  Argue for retroactive prosecution (which violates rule of law principles and looks like victor's justice).
      2.  Admit that the law sometimes must protect the "guilty" to preserve the system (which concedes ground to the Traditionalist's institutional logic).
  *   **The Traditionalist Dilemma:** If the law protects the unjust soldier, the Traditionalist must explain why we aren't complicit in his wrong. They usually argue that the *systemic value* of the rule outweighs the *individual injustice*. But this requires a utilitarian calculus that many find repugnant when applied to individual life and death.

  The reason this interference creates a stalemate is that **prosecution is inherently retrospective.** Institutional design is prospective (setting rules for the next war). Liability is retrospective (judging the last war). The Revisionists win on retrospective judgment (obviously, the Nazi soldier was liable); the Traditionalists win on prospective rules (soldiers need clear rules before fighting). Because the debate conflates *ex ante* permissions with *ex post* judgments, they talk in circles.

  ### What Would Count as Progress?

  If the diagnosis is correct, a verdict on "who is right" is impossible because they are optimizing for different values (Truth vs. Order). Progress requires changing the question to bridge the gap.

  **1. Shift from "Equality" to "Epistemic Thresholds"**
  The debate stalls because it treats *jus ad bellum* (justice of war) as binary (Just/Unjust). In reality, it is epistemic.
  *   **Progress:** Instead of asking "Are combatants equal?", ask **"Under what epistemic conditions does the presumption of equality collapse?"**
  *   Even many Revisionists admit that if a soldier *reasonably believes* their war is just, their liability is mitigated. Even Traditionalists admit that some wars are so manifestly unjust (e.g., aggressive conquest by Nazi Germany) that the "uniform shield" should not apply.
  *   **The Test Case:** Define the "Manifest Unjustice" threshold. If we can agree on a standard where the institutional rule yields to moral truth (e.g., Nuremberg Principles), we move from a binary fight to a gradient analysis. Progress is a theory of *culpable ignorance* in war.

  **2. Distinguish "Liability" from "Permission"**
  We need a vocabulary distinction that allows both sides to be right without contradiction.
  *   **Liability (Revisionist domain):** Does the soldier deserve to be killed based on moral desert? (Often No for unjust side).
  *   **Permission (Traditionalist domain):** Is the opposing soldier legally/morally permitted to kill him based on regulatory status? (Yes).
  *   **Progress:** Explicitly decoupling these. We can say: "The unjust combatant is not *liable* in the deep sense, but killing him is *permitted* under the regulatory convention to preserve the distinction with civilians." This acknowledges the Revisionist moral truth while retaining the Traditionalist institutional benefit. It turns the "moral equality" into a "regulatory fiction" that we acknowledge is a fiction.

  **3. Focus on the "Victor's Justice" Trap**
  The biggest fear of the Traditionalist is that Revisionism licenses victors to prosecute losers. The biggest fear of the Revisionist is that Traditionalism immunizes aggressors.
  *   **Progress:** A mechanism for *neutral adjudication* of *jus ad bellum* during or immediately after conflict. As long as the determination of "unjust side" is made by the winner, Traditionalism will win because it's safer. If international mechanisms existed to credibly assign *ad bellum* guilt *before* or *during* combat, the Revisionist position becomes actionable without sliding into victor's justice.

  ### The Argument for Permanent Impasse

  However, I must offer the pessimistic counter-argument you requested. There is a strong case that this impasse is a feature, not a bug, of the subject matter.

  War is a **state of exception.** It is a domain where the normal rules of morality (do not kill) are suspended by necessity.
  *   The Revisionist tries to normalize war morality (apply peacetime murder standards to war).
  *   The Traditionalist tries to regulate the exception (create a specific code for the abnormal state).

  These two impulses may be fundamentally incompatible. If you normalize war morality too much (Revisionism), you risk making war impossible to fight for the "good guys" because the epistemic burden is too high. If you regulate the exception too much (Traditionalism), you risk making war too easy to start because the moral cost is externalized.

  The stalemate persists because **both risks are real.**
  *   If we adopt Revisionism, we might get soldiers refusing legal orders based on personal moral calculation, leading to fragmentation and potentially *more* violence (the Traditionalist fear).
  *   If we adopt Traditionalism, we get soldiers confidently committing atrocities because "it's legal," leading to *more* injustice (the Revisionist fear).

  **Conclusion:**
  The disagreement is substantive, rooted in a conflict between **truth-tracking morality** and **consequence-managing morality.** The interference cases (prosecution) prevent a clean separation because law demands a single verdict, not a nuanced philosophical distinction.

  **Progress** will not come from one side winning. It will come from:
  1.  Admitting that "Moral Equality" is a regulatory tool, not a metaphysical truth.
  2.  Developing an **epistemic standard** for when that tool must be set aside (manifest aggression).
  3.  Accepting that there will always be a "moral remainder"—a tragic gap between what is legally permitted and what is morally clean—and that the goal of policy is to manage that gap, not close it.

  If your conference circuit is stuck, it is likely because participants are trying to close the gap rather than manage it. The "solution" is to acknowledge the tragedy: sometimes the law must protect the morally liable to save the innocent, and that is a moral cost we pay, not a moral truth we discover.
