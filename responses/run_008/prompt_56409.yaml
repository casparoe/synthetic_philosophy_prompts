answer: |-
  This is a fascinating demarcation problem. Your roommate is implicitly acting as a philosopher of science, and her verdicts are surprisingly consistent with a specific, non-trivial cluster of criteria. She has rejected the two easiest "off-the-shelf" definitions (Consensus and Falsificationism), which means she is operating on a more nuanced view, likely a hybrid of **Scientific Realism** and **Empiricism**.

  To help you stress-test her, I have analyzed her record to extract the two most viable candidate rules. These rules fit her past verdicts but diverge on your new cases.

  ### Part 1: The Two Candidate Rules

  Based on her record (specifically the tension between *Wegener=Science* and *String Theory=Not Science*), here are the two principles she is likely balancing:

  **Rule A: The "Observable Ontology" Constraint (Empiricist Leanings)**
  *   **Principle:** A theory is scientific only if the core entities it posits are, in principle, observable or measurable *by instruments that interact with our causal spacetime*. You can lack a mechanism (Wegener), but you cannot posit entities that are fundamentally undetectable.
  *   **Why it fits her record:**
      *   **Wegener:** Continents are observable. Their positions are measurable. He was right about the *entities*, even if wrong about the *engine*.
      *   **String Theory:** Strings are defined as being below the Planck scale, effectively rendering them causally disconnected from our detectors. Hence, "Not Science."
      *   **Freud/astrology:** Posits entities (libido/planetary influence) that either don't exist or cannot be measured independently of the theory.
      *   **Macroeconomics:** Inflation and unemployment are measurable aggregates.

  **Rule B: The "Inference to Best Explanation" Constraint (Realist Leanings)**
  *   **Principle:** A theory is scientific if it provides the best *naturalistic* explanation for existing empirical anomalies, even if the entities are not currently detectable. The priority is explanatory power over immediate measurability.
  *   **Why it fits her record:**
      *   **Wegener:** He explained the fossil/coastline anomalies better than the "land bridge" theory. That explanatory win made it science, despite the lack of mechanism.
      *   **Intelligent Design:** Rejected because it invokes a supernatural agent (violates naturalism), not just because it lacks data.
      *   **Macroeconomics:** It explains complex market behaviors better than random chance, even if predictions are weak.
      *   **String Theory:** This is the stress point. She rejected it, which suggests Rule B is secondary to Rule A *unless* the theory solves an empirical problem (String Theory solves mathematical problems, not empirical ones).

  ### Part 2: Predictions for Your Three Cases

  Here is how these rules apply to the cases you plan to present. I have provided the "Consensus" view for context, but the "Roommate Prediction" is based on her specific logic.

  #### 1. The Aquatic Ape Hypothesis (AAH)
  *   **The Claim:** Human ancestors went through a semi-aquatic phase, explaining hairlessness, subcutaneous fat, and breath control.
  *   **Consensus View:** Generally regarded as pseudoscience or fringe science due to lack of fossil evidence and better alternative explanations (thermoregulation/parasite avoidance).
  *   **Roommate Prediction:** **Not Science.**
  *   **Reasoning:** While AAH posits observable entities (ancestors, water), it functions more like **Freudian Psychoanalysis** in her ledger. It is a "just-so story" that interprets existing traits post-hoc without novel constraints. Unlike Wegener, who had hard data (rock matches/fossils) that *required* movement, AAH takes ambiguous traits and fits a narrative. It lacks "Explanatory Necessity."
  *   **Risk:** If she values "Naturalistic Explanation of Anomalies" (Rule B) highly, she might call it Science because it explains hairlessness naturally. But given she rejected Freud (who also explained anomalies naturally), she likely requires harder empirical anchors.

  #### 2. The Younger Dryas Impact Hypothesis (YDIH)
  *   **The Claim:** A comet impact 12,900 years ago caused cooling and megafauna extinction.
  *   **Consensus View:** Highly controversial. Some evidence (nanodiamonds), but replication issues.
  *   **Roommate Prediction:** **Science.**
  *   **Reasoning:** This is the closest modern analog to **Wegener**. It posits a physical mechanism (impact) and physical evidence (sediment layers, diamonds) that are *in principle* observable and measurable *now*. Even if the community rejects it (like Wegener's), and even if it turns out to be wrong, it is making "Empirical Risk" claims. It sticks its neck out regarding measurable dirt.
  *   **Key Distinction:** Unlike AAH, this isn't interpreting biology; it's digging for physical layers.

  #### 3. Eternal Inflation / Bubble Multiverse
  *   **The Claim:** Our universe is one of infinitely many "bubbles" in a larger inflating space.
  *   **Consensus View:** Theoretical physics. Often criticized as untestable metaphysics.
  *   **Roommate Prediction:** **Not Science.**
  *   **Reasoning:** This is the critical test of **Rule A (Observable Ontology)**. By definition, other bubble universes are causally disconnected from ours. We cannot measure them, even in principle. This is worse than String Theory (where strings might leave subtle imprints); the Multiverse explicitly posits regions we can *never* see. If she rejected String Theory for lack of empirical contact, she must reject the Multiverse.
  *   **The Trap:** If she calls this "Science," she undermines her rejection of String Theory. She would have to admit that "Explaining Fine Tuning" (IBE) overrides "Observability."

  ### Part 3: The "Splitter" Case (Your Fourth Card)

  You asked for one further case to force her to reveal which rule is dominant. You need a case that separates **Current Measurability** from **Explanatory Necessity**.

  **The Case: "Pauli's Neutrino Hypothesis (1930)"**

  *   **The Context:** In 1930, Wolfgang Pauli proposed the existence of a new particle (the neutrino) to save the law of conservation of energy in beta decay. The energy seemed to disappear; he posited an invisible particle carried it away.
  *   **The Status in 1930:**
      *   **Explanatory Power:** High. It saved fundamental physics laws (matches Rule B).
      *   **Observability:** Zero. Pauli admitted it was "undetectable." It was not experimentally confirmed until 1956 (26 years later).
  *   **The Question to Her:** "In 1930, before it was detected, was Pauli's Neutrino Hypothesis Science or Pseudoscience?"

  **Why this splits the rules:**

  1.  **If she says "Science":** She prioritizes **Rule B (Explanatory Necessity)**.
      *   *Consequence:* She must then reconsider **String Theory**. If an undetectable particle was science in 1930 because it saved the data, why aren't strings science now? They also save the data (mathematical unification). She will have to argue that Neutrinos were *eventually* detectable, whereas Strings might not be. This forces her to define the "Time Horizon of Detectability."
  2.  **If she says "Not Science":** She prioritizes **Rule A (Observable Ontology)**.
      *   *Consequence:* She creates tension with **Wegener**. Wegener had no mechanism and was rejected by experts. Pauli had no detection and was rejected by experts (Bohr suggested energy conservation might just be wrong). If Pauli wasn't science, why was Wegener? She will have to argue that Continents are "observable" in a way Neutrinos weren't. This forces her to define "Observability."

  ### Strategic Advice for the Conversation

  1.  **Don't lead with the rules.** Present the three cases (AAH, Younger Dryas, Multiverse) as "I found these interesting edge cases."
  2.  **Watch the Multiverse verdict.** If she hesitates here, she knows she's on thin ice regarding String Theory.
  3.  **Play the Neutrino card last.** When she tries to justify the Multiverse or String Theory verdict, bring up Pauli.
      *   *Script:* "Okay, but remember Pauli in 1930? He posited a particle that was literally undetectable to save the data. You called Wegener science without a mechanism. Is Pauli 1930 science? Because if Pauli is science, String Theory looks a lot more scientific. If Pauli isn't science, Wegener looks a lot less scientific."
  4.  **The Goal:** The goal isn't to "win" but to force her to articulate the **threshold of detectability**. Her implicit rule is likely: *"Science requires positing entities that are causally connected to our measurements, even if we haven't measured them yet."*
      *   This excludes the Multiverse (causally disconnected).
      *   This includes Wegener (continents are connected).
      *   This includes Pauli (neutrinos interact weakly, but are connected).
      *   This excludes String Theory (depends on if she thinks strings are *in principle* connected).

  If she can articulate that distinction clearly, she wins. If she waffles, you've successfully shown that her "obvious case-by-case" verdicts rely on a hidden, inconsistent variable.
