answer: |-
  You are correct that the literature often suffers from category errors: normative theorists demand consistency conditions that descriptive data violates, while descriptive modelers build flexibility that normative standards condemn as irrational. To break the deadlock, we need a specification that distinguishes between *constitutive norms of rationality* (what makes an agent coherent) and *structural assumptions* (mathematical conveniences or specific philosophical commitments).

  Below is the specification you requested. I have amended your list slightly to sharpen the distinctions, classified each requirement, and provided the assessment of joint satisfiability.

  ### Part I: The Specification of Desiderata

  **1. Phenomenological Adequacy (The Ellsberg Constraint)**
  *   **Requirement:** The theory must accommodate the Ellsberg reversals (preferring known risk to unknown ambiguity) as a valid preference ordering, not merely as a performance error. If the theory diagnoses them as error, it must provide a normative argument for why the intuition is systematically misleading despite its robustness.
  *   **Motivation:** A theory of *ambiguity* that rules out ambiguity aversion by definition is just Expected Utility (EU) theory in disguise. It fails to engage with the target phenomenon.
  *   **Status:** **Non-Negotiable** (for a theory of ambiguity). If you cannot explain Ellsberg, you are not doing ambiguity theory; you are doing SEU with noise.
  *   **Note on Comparative Ignorance:** This requirement must also encompass the "comparative ignorance" datum. If ambiguity aversion vanishes in isolation, the theory must explain whether ambiguity is a stable trait or a context-dependent evaluation. A theory that treats ambiguity attitude as a fixed parameter (like risk aversion) struggles here.

  **2. The Risk Limit (Reduction Condition)**
  *   **Requirement:** In the limit where the set of priors becomes a singleton (MEU) or the second-order distribution becomes degenerate (Smooth), the preference ordering must satisfy the axioms of Subjective Expected Utility (SEU).
  *   **Motivation:** Ambiguity is defined as uncertainty *about* probabilities. If the probabilities become known, the ambiguity vanishes. The theory must nest standard risk theory, not replace it.
  *   **Status:** **Non-Negotiable.** Without this, we cannot distinguish ambiguity aversion from extreme risk aversion or non-linear utility.

  **3. The Formal Floor (Completeness and Transitivity)**
  *   **Requirement:** The agent's preference relation must be complete (for any two acts, one is preferred or the agent is indifferent) and transitive.
  *   **Motivation:** Completeness ensures the agent can always make a choice; transitivity prevents cyclical preferences. This is the standard definition of a rational preference relation.
  *   **Status:** **Camp Preference.** This is the primary fault line.
      *   *The SEU Camp:* Views completeness as essential to rationality. An agent who "cannot compare" is indecisive, not rational.
      *   *The Knightian Camp:* Views incompleteness as the *definition* of ambiguity. If the evidence doesn't support a comparison, forcing one is irrational.
      *   *Assessment:* Insisting on completeness forces the theory to locate ambiguity in the *evaluation* function (tastes) rather than the *belief* state, because incomplete beliefs are the most natural representation of "unknown unknowns."

  **4. Identification of Attitude (Beliefs vs. Tastes)**
  *   **Requirement:** The theory must structurally separate the representation of information (beliefs) from the attitude toward that information (ambiguity aversion). It must specify a hypothetical elicitation protocol that could, in principle, distinguish a change in beliefs from a change in ambiguity attitude.
  *   **Motivation:** Without this separation, "ambiguity aversion" is a catch-all residual. If an agent changes behavior, is it because she learned something or because she became more cautious? Policy and welfare analysis require this distinction.
  *   **Status:** **Non-Negotiable** (for economic application). However, satisfying this is mathematically difficult without assuming specific functional forms.

  **5. Dynamic Coherence (Consistency and Consequentialism)**
  *   **Requirement:** The theory must specify updating rules. It should aim for Dynamic Consistency (plans made today are preferred tomorrow) and Consequentialism (choices depend only on remaining possible nodes). It must explicitly state which, if either, is relaxed to accommodate ambiguity attitudes.
  *   **Motivation:** Rational agents should not be time-inconsistent without cause, nor should they care about sunk costs or forgone branches of the tree.
  *   **Status:** **Non-Negotiable in Principle, Negotiable in Practice.** As you noted, there is a tension here. A theory *must* address this, but it may not be able to satisfy both conditions fully while maintaining ambiguity aversion. The requirement is that the *trade-off be explicit*, not that both be fully satisfied.

  **6. Monotonicity of Information (No Preference for Ignorance)**
  *   **Requirement:** The agent should never pay to avoid free, relevant information. The value of information must be non-negative.
  *   **Motivation:** Preferring ignorance implies the agent believes her future self will make worse decisions with more data, or that the data itself alters the payoff structure irrationally. This is generally viewed as a normative failure.
  *   **Status:** **Non-Negotiable** (Normatively). Descriptively, people do avoid information, but a theory of *rational* choice should not prescribe ignorance as optimal unless the information is costly.

  **7. Market Viability (No Inertia, No Dutch Books)**
  *   **Requirement:** The theory must not predict that the agent rejects all mutually beneficial trades (inertia) nor that she accepts a sequence of trades guaranteeing a loss (dynamic inconsistency/Dutch book).
  *   **Motivation:** A rational agent should be able to participate in exchange. Extreme inertia renders the theory economically vacuous; susceptibility to Dutch books renders it irrational.
  *   **Status:** **Non-Negotiable.** This is the boundary between "cautious" and "pathological."

  ---

  ### Part II: Assessment of Joint Satisfiability

  You asked for an honest assessment of whether these requirements are jointly satisfiable. The short answer is **no**. There is a "Fatal Tetrad" in the literature on ambiguity.

  **The Impossible Core:**
  You cannot simultaneously satisfy the following four conditions:
  1.  **Ambiguity Attitude** (Req 1: Ellsberg behavior is valid).
  2.  **Completeness** (Req 3: Preferences are always comparable).
  3.  **Dynamic Consistency** (Req 5: Plans are sticking).
  4.  **Consequentialism** (Req 5: Only relevant nodes matter).

  **The Proof Intuition:**
  If preferences are complete and ambiguity-averse (Ellsberg), the evaluation of an act depends on the context of other available acts or the structure of the event space (non-additivity). When you move to a dynamic setting, Consequentialism demands you ignore the branches you didn't take. Dynamic Consistency demands you stick to the plan. Under ambiguity, the "worst-case" prior at time $t=0$ might not be the "worst-case" prior at time $t=1$ after observing an event. If you update by Bayes' rule on the set of priors, you often violate Dynamic Consistency. If you force Dynamic Consistency (via Rectangularity constraints on the set of priors), you often restrict the set of priors so severely that you lose the ability to model rich ambiguity attitudes (Req 1), or you violate Consequentialism by letting the initial set of priors dictate future choices regardless of new information.

  **The Necessary Sacrifice:**
  To build an adequate theory, you must drop or soften one of the four.

  *   **Option A: Drop Completeness (Req 3).**
      *   *Theory:* Bewley-style Incomplete Preferences.
      *   *Consequence:* The agent literally has no preference between some acts. She does not choose; she remains inert unless one act dominates the other across all priors.
      *   *Verdict:* Saves Dynamic Consistency and Consequentialism. Fails Market Viability (Req 7) due to extreme inertia.
  *   **Option B: Drop Dynamic Consistency (Req 5).**
      *   *Theory:* Naive MEU or standard Smooth Ambiguity without rectangularity.
      *   *Consequence:* The agent plans one thing today and wants to do another tomorrow. She is susceptible to exploitation by a sophisticated counterpart who knows her time-inconsistency.
      *   *Verdict:* Saves Ellsberg and Completeness. Fails Normative Rationality (Req 5/7).
  *   **Option C: Drop Consequentialism (Req 5).**
      *   *Theory:* Resolute Choice or MEU with Rectangularity.
      *   *Consequence:* The agent sticks to the plan even if, at the later node, the plan looks suboptimal given the new information. She cares about the "tree" structure, not just the remaining nodes.
      *   *Verdict:* Saves Consistency and Ellsberg. Violates the standard normative intuition that only what *can* happen should matter (Req 5).
  *   **Option D: Drop Ambiguity Attitude (Req 1).**
      *   *Theory:* Subjective Expected Utility (SEU).
      *   *Consequence:* You revert to standard rationality. Ellsberg behavior is diagnosed as error.
      *   *Verdict:* Satisfies all rationality constraints but fails the descriptive/phenomenological goal.

  **My Recommendation:**
  For a theory of *rational* choice under ambiguity, **Requirement 3 (Completeness)** is the one to soften. Insisting on completeness forces ambiguity into the utility function (tastes) rather than the belief state. This creates the dynamic tensions. Allowing for incomplete preferences (a "zone of indecision") is the most honest representation of "I don't know," and it resolves the dynamic tension by allowing the agent to delay choice or remain inert rather than making an arbitrary ranking that forces time-inconsistency later. However, since economic modeling usually requires a choice function, most working theories keep Completeness and sacrifice **Dynamic Consistency** or restrict **Consequentialism** (via Rectangularity).

  Regarding **Requirement 6 (Information)**: This is often violated in MEU models. If updating shrinks the set of priors to a "worse" subset (in terms of the worst-case expectation), the agent prefers ignorance. This is a genuine normative cost. A theory that prescribes ignorance is failing as a *normative* guide, even if it describes behavior accurately.

  ---

  ### Part III: Scorecard of Candidate Theories

  Here is how your two candidates score against the finalized specification (assuming we treat Completeness as Non-Negotiable for the sake of standard economic modeling, which forces the dynamic trade-off).

  **1. Maxmin Expected Utility (MEU)**
  *   **Ellsberg (Req 1):** **Pass.** Designed specifically for this.
  *   **Risk Limit (Req 2):** **Pass.** Collapses to EU when the set of priors is a singleton.
  *   **Completeness (Req 3):** **Pass.** (In the Gilboa-Schmeidler formulation).
  *   **Identification (Req 4):** **Fail.** The set of priors and the min-operator are observationally equivalent to other non-expected utility models without secondary elicitation. It locates attitude in beliefs (the set), but the "aversion" is structural, not parametric.
  *   **Dynamics (Req 5):** **Fail.** Standard MEU is dynamically inconsistent. It requires "Rectangularity" (a constraint on how priors update) to restore consistency, which is a strong, often unjustified assumption on the information structure.
  *   **Information (Req 6):** **Fail.** Can exhibit negative value of information (preference for ignorance) because updating can eliminate "good" priors from the set, leaving only "bad" ones to determine the minimum.
  *   **Viability (Req 7):** **Mixed.** Susceptible to inertia (rejecting all trades) if the set of priors is wide.

  **2. Smooth Ambiguity Model (KMM)**
  *   **Ellsberg (Req 1):** **Pass.** Captures the reversal via curvature.
  *   **Risk Limit (Req 2):** **Pass.** Collapses to EU when the second-order distribution is degenerate.
  *   **Completeness (Req 3):** **Pass.** Generates a complete ordering.
  *   **Identification (Req 4):** **Pass.** Separates ambiguity beliefs (second-order distribution) from ambiguity attitude (curvature of the function $\phi$). This is its main advantage over MEU.
  *   **Dynamics (Req 5):** **Fail.** Like MEU, it generally violates dynamic consistency unless specific restrictions are placed on the second-order updating. It does not have a natural "rectangularity" equivalent as standard as MEU.
  *   **Information (Req 6):** **Pass (Mostly).** Because it averages over priors (smoothed) rather than taking the worst-case, it is less prone to the "negative value of information" pathology than MEU, though not immune.
  *   **Viability (Req 7):** **Pass.** Avoids the inertia problem; the agent always has a strict preference unless expected utilities are identical.

  **The Deciding Requirement:**
  **Requirement 4 (Identification)** and **Requirement 6 (Information)** do the most work separating these candidates.
  *   **MEU** fails Identification (beliefs and attitude are confounded in the set) and Information (can prefer ignorance).
  *   **Smooth Ambiguity** succeeds at Identification (clean separation of belief and taste) and performs better on Information.

  **Conclusion:** If you demand a theory that separates beliefs from tastes (Req 4) and avoids prescribing ignorance (Req 6), **Smooth Ambiguity** is the superior specification, provided you are willing to accept the dynamic inconsistency costs common to both. If you view Dynamic Consistency (Req 5) as the absolute priority, neither works without significant, ad-hoc modification (Rectangularity for MEU), suggesting the "Impossible Core" analysis holds: you cannot have it all.
