      *Wait, one nuance on Req 4:* The user asks the theory to identify an observable situation where beliefs vs. evaluation comes apart. This is the "Identification Problem." I will emphasize that without external elicitation (like betting odds on the probabilities themselves), this is theoretically impossible to distinguish. I will mark this as a methodological requirement.

