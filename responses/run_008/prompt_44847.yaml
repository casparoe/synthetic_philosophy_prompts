answer: |-
  In a municipal housing office managing scarce vouchers, the Act-Utilitarian director reassigns a voucher already promised to a single applicant to a larger family in more desperate conditions, calculating that the immediate aggregate welfare gain outweighs the breach of commitment. The Deontologist director, facing the identical trade-off, honors the original commitment, citing a binding duty of fidelity to the first applicant regardless of the comparative need. Over the following year, the community learns that the Utilitarian's office operates on flexible optimization; applicants, fearing their allocations might be revoked if someone "needier" appears, begin hoarding resources, hiding income data, and litigating every decision, creating administrative drag that reduces total placements by 20%. The Deontologist's office, known for ironclad adherence to commitments regardless of shifting circumstances, processes applications faster with full disclosure and zero litigation, securing stable housing for more families cumulatively despite the initial "loss" of the single voucher.

  **The Breakdown**

  **The Calculation and the Refusal**
  The Act-Utilitarian isn't being cruel; they are responding to the moral gravity of the situation. If rights are just proxies for welfare, and the larger family's suffering objectively outweighs the single applicant's disappointment, the calculation is straightforward: maximize the good. It is the "humane" choice in the immediate moment. The Deontologist refuses not because they don't care about the larger family, but because they recognize a *constraint* on how they may pursue the good. They cannot use the first applicant merely as a means to house the second, even if the math works out. The duty of fidelity creates a moral wall that the Utilitarian steps over.

  **The Structural Feature: Epistemic Opacity in Iterated Games**
  The reversal happens because of **signal noise in a repeated interaction**. The Utilitarian assumes they can make a "reasonable exception" without damaging the system's integrity. But the public (the applicants) cannot see the internal calculation; they only see the outcome (a promise broken). To an outsider, a "justified breach" looks identical to an "arbitrary breach." Therefore, *any* willingness to breach destroys the trust required for the system to function efficiently. The Deontologist's constraint acts as a credible commitment device: because they *won't* calculate even when it seems obvious they should, their promise is actually believable. The Utilitarian's flexibility makes their promises cheap talk.

  **Removing the Feature**
  If you remove the iterated nature or the information asymmetry—if this is a one-off case where no one else finds out, or if the applicants have perfect insight into the director's reasoning—the case collapses back into the standard Paradox of Deontology. In a vacuum, the Deontologist lets the larger family suffer for the sake of a "clean hand," and the Utilitarian saves the day. The Deontologist only "wins" here because the constraint sustains a cooperative practice over time that the Utilitarian's case-by-case optimization corrodes.

  **The "Rigged" Objection and the Reply**
  A smart Act-Utilitarian will argue: *"This case is rigged against me. I can just adopt a policy of never breaking promises because I calculate that keeping them yields better long-term utility. I become a 'rule-utilitarian' mimic."*
  The Deontologist's reply is the **Credibility Problem**: *"You can't mimic me credibly because your commitment is contingent. If a case arises where breaking the promise yields massive utility (say, saving a life), your theory demands you break it. Applicants know this. They know your 'rule' is just a heuristic you'll discard under pressure. My constraint is categorical; I won't break the promise even to save a life. That irrational rigidity is the only thing that makes my promise truly safe."*

  **On Your Hypothesis**
  You are right. This case suggests the Paradox of Deontology only stings if you demand constraints justify themselves *act-by-act*. If you evaluate moral theories by the **dispositions and practices they sustain**, the Deontologist often wins on Utilitarian grounds. The Utilitarian wants to judge the act; the Deontologist insists on judging the agent. This scenario shows that an agent with "sub-optimal" dispositions (rigid, unwilling to trade rights) can generate superior outcomes compared to an agent with "optimal" dispositions (flexible, responsive to data), precisely because the former creates a stable environment for others to plan and cooperate. The constraint doesn't need to justify itself in the moment; it justifies the *relationship*.
