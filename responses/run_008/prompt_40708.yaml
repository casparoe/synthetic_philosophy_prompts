  ## Facilitator's Cheat Sheet: The Seven Forms
  Keep this hidden until the debrief.
  1.  *Syāt asti* (Maybe it is)
  2.  *Syāt nāsti* (Maybe it is not)
  3.  *Syāt asti nāsti* (Maybe it is and is not)
  4.  *Syāt avaktavya* (Maybe it is indescribable)
  5.  *Syāt asti avaktavya* (Maybe it is and is indescribable)
  6.  *Syāt nāsti avaktavya* (Maybe it is not and is indescribable)
  7.  *Syāt asti nāsti avaktavya* (Maybe it is, is not, and is indescribable)

  *Note for Class:* You likely won't reach all seven in the drafting. Reaching the tension of the first four is sufficient for a 90-minute session. The rest can be assigned as reading to see how the logic expands.
