      *   *Exercise Limit:* The exercise is epistemic (we can't see the whole thing). Jainism is ontological (the thing *is* many-sided).
      *   *Fix:* In the debrief, explain that even if we brought the lights up and everyone saw the cylinder, the statement "It is White" remains partially false. The *naya* (standpoint) isn't just physical position; it's conceptual focus. The object *subsists* in multiple modes.

