      *   I need to make "Indescribable" the *only* logical way to hold the contradiction without explosion.
      *   *Idea:* The "Joint Statement" must be *one* predicate assignment.
      *   If they say "It is White," Group 2 vetoes.
      *   If they say "It is Black," Group 1 vetoes.
      *   If they say "It is Both," the Facilitator (acting as Logic Police) says "Contradiction. 'White' and 'Black' are mutually exclusive in this colour space."
      *   Then they *must* find a way to say "It is White (in a way) and Black (in a way) which makes a simple label impossible."
      *   This forces the *avaktavya*.

