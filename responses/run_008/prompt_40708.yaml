  2.  **Deconstruct the Core Problem:**
      *   *The Trap:* Students usually think *anekāntavāda* is just "perspectivism" (epistemic limitation) rather than ontological complexity.
      *   *The Fix:* The activity needs to create a situation where contradictory claims are *both* true simultaneously about the *same* object, not just "true for me, false for you."
      *   *The "Inexpressible" (*avaktavya*):* This is the hardest bit. It's not just "I don't know." It's "It cannot be stated in a single proposition without contradiction." The constrained language needs to make them hit a wall where standard logic fails.

  3.  **Designing the Activity (The "Black Box" Problem):**
