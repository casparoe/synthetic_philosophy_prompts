answer: |-
  # Lesson Plan: The Logic of Many-Sidedness
  **Course:** Epistemology in Non-Western Traditions (Year 2)
  **Topic:** Jain *Anekāntavāda* and the *Saptabhaṅgī*
  **Duration:** 90 Minutes
  **Class Size:** 16 Students (4 groups of 4)

  ## Learning Objectives
  1.  To experience the logical necessity of multi-valued predication when faced with contradictory but valid evidence.
  2.  To distinguish *anekāntavāda* from simple perspectivism, fallibilism, and relativism.
  3.  To understand the function of *avaktavya* (inexpressibility) not as ignorance, but as a logical marker of ontological complexity.

  ## Materials Required
  *   **The Object:** A large cylinder (approx. 30cm diameter). Paint the curved surface **Matte White**. Paint the two circular ends **Matte Black**.
  *   **Barriers:** Four cardboard screens or partitions to create separate viewing stations around the object.
  *   **Data Cards:** Pre-printed cards for each group (see below).
  *   **Drafting Kit:** For the plenary. A set of magnetic or printed sentence strips (see "The Constraint").
  *   **Whiteboard/Projector.**

  ---

  ## Part 1: Setup and Investigation (25 Minutes)

  ### 1. Introduction (5 Minutes)
  Briefly state the goal: "Today we are not studying Jainism yet. We are solving a problem of description. You will investigate an object, make claims about it, and then the whole class must agree on a single, definitive statement of truth."

  ### 2. Group Investigation (20 Minutes)
  Divide the class into four groups. Each group is stationed at a different point around the object, separated by screens so they cannot see the other groups' vantage points. They are not allowed to move from their station.

  *   **Group 1 (The Side View):** Positioned perpendicular to the cylinder's axis. They see only the white curved surface.
      *   *Data Card:* "Your task: Determine the **colour** of the object. You may look for 5 minutes. You may not touch it."
  *   **Group 2 (The End View):** Positioned parallel to the cylinder's axis, facing one end. They see only the black circle.
      *   *Data Card:* "Your task: Determine the **colour** of the object. You may look for 5 minutes. You may not touch it."
  *   **Group 3 (The Tactile/Spec):** Blindfolded. They can touch the object (both white and black parts) but cannot see it. They are given a spec sheet that reads: *Material: Anodised Aluminium. Finish: Dual-Tone.*
      *   *Data Card:* "Your task: Determine the **colour** of the object based on touch and technical specifications." (Note: Touch does not reveal colour, creating epistemic tension).
  *   **Group 4 (The Historians):** They do not see or touch the object. They receive a dossier of conflicting witness testimonies. Half the witnesses say "It is White." Half say "It is Black."
      *   *Data Card:* "Your task: Determine the **colour** of the object based on the provided testimony records."

  **Instruction to All Groups:**
  "You must commit to a categorical claim. Write your conclusion on the provided card. You are not allowed to use hedging words like 'maybe', 'from this angle', or 'it depends'. You must state what the object *is*."

  *Facilitator Note:* Circulate to ensure they do not peek. If Group 3 complains they can't know the colour by touch, instruct them to infer from the 'Dual-Tone' spec or declare the colour indeterminate. This sets up the 'inexpressible' later.

  ---

  ## Part 2: The Collision (10 Minutes)

  Collect the claim cards. Read them aloud anonymously.
  *   Group 1: "The object is White."
  *   Group 2: "The object is Black."
  *   Group 3: "The object is Dual-Tone / Indeterminate."
  *   Group 4: "The object is Disputed."

  Ask the class: "Which group is lying?" (None). "Which group is mistaken?" (None, given their data). "How can the object be both White and Black?"

  Allow 5 minutes of chaotic debate. Students will naturally try to resolve this by saying, "It's white on the side and black on the end."
  **Intervention:** Stop them. "You are using contextual qualifiers ('on the side'). For the next task, that language is banned. You must describe the object *as a whole*."

  ---

  ## Part 3: The Drafting Constraint (25 Minutes)

  This is the core engineering of the lesson. The class must now draft **one single joint statement** to be displayed on the board.

  **The Rule:** They may only use the following sentence templates (printed on strips/cards they can physically arrange):

  1.  **Assertion:** "The object is [P]."
  2.  **Negation:** "The object is not [P]."
  3.  **Contradiction:** "The object is and is not [P]."
  4.  **Inexpressibility:** "The object is [P] and indescribable."
  5.  **Connector:** "In a certain sense..." (Limit: They may only use this connector **three times** in total).

  **The Predicate:** They must agree on a single predicate [P]. Let's force [P] = "White".

  **The Trap:**
  *   If they choose Template 1 ("The object is White"), Group 2 vetoes it (it ignores the black evidence).
  *   If they choose Template 2 ("The object is not White"), Group 1 vetoes it.
  *   If they choose Template 3 ("Is and is not White"), students will object that this violates the Law of Non-Contradiction. It feels like nonsense.
  *   If they use the Connector ("In a certain sense..."), they will run out of their three uses quickly because they have four groups with different truths.

  **The Goal:** You want them to realise that to accommodate Group 1 (Is White), Group 2 (Is Not White), and Group 3 (Indeterminate), they need to stack the templates.
  *   *Target Solution:* "In a certain sense, the object is White. In a certain sense, the object is not White. In a certain sense, the object is both and indescribable."

  **Facilitator Role:** Act as a strict logician. If they say "It depends on the angle," reject it (language banned). If they say "Both are true," ask "How can P and not-P be true simultaneously without explosion?" Push them towards Template 4 (Inexpressible) as the only way to hold the contradiction without breaking logic.

  *Note:* They will struggle. Let them struggle. The friction *is* the lesson. If they get stuck, hint: "Is there a way to say the truth is there, but the language breaks?"

  ---

  ## Part 4: Debrief and Mapping (25 Minutes)

  Bring the class back to their seats. Reveal the object (remove screens).

  ### 1. Mapping to the *Saptabhaṅgī* (10 Minutes)
  Draw the sevenfold scheme on the board. Map their drafting struggle to the Jain logic.

  *   **Group 1's Claim:** *Syāt asti* (Maybe it is). True from a standpoint (*naya*).
  *   **Group 2's Claim:** *Syāt nāsti* (Maybe it is not). Also true from a standpoint.
  *   **The Joint Statement:** *Syāt asti nāsti* (Maybe it is and is not).
  *   **The "Inexpressible" Moment:** When they realised they couldn't fuse "White" and "Black" into one simple predicate without losing information, they touched *Syāt avaktavya*.

  Explain: "In Jain logic, *avaktavya* does not mean 'we are ignorant.' It means 'the reality is too complex for a single binary assertion.' You felt this when Template 3 felt like a contradiction. The 'Inexpressible' is the logical space where contradictory truths coexist."

  ### 2. Distinguishing the Doctrine (10 Minutes)
  Address the two common misunderstandings directly.

  **A. vs. Fallibilism ("We just need more data")**
  *   *Student Objection:* "If we just took the screens down, we'd see the truth. So the problem was just lack of data."
  *   *Response:* "Even with the screens down, if you say 'The object is White', you are still speaking a partial truth. The object *is* white (on the side). It is not merely that we *see* it partially; the object *subsists* partially in that mode. *Anekāntavāda* claims reality itself is complex, not just our vision. If reality were simple, full access would yield a single predicate. But 'White' never fully captures the object, even with full access."

  **B. vs. Relativism ("Every view is equally right")**
  *   *Student Objection:* "So Group 1 is right for them, and Group 2 is right for them. Truth is relative."
  *   *Response:* "No. If Group 1 claimed 'The object is *only* white and *never* black', they would be wrong. Jainism is not 'anything goes'. Each claim is conditionally true (*syāt*), but absolutely false if asserted exclusively. Relativism says there is no objective truth. *Anekāntavāda* says there is a massive objective truth that requires multiple assertions to approximate."

  ### 3. The "Blind Men and the Elephant" Objection (5 Minutes)
  *   *Student Objection:* "This is just the Blind Men and the Elephant parable. What's new?"
  *   *Facilitator Response:* "The parable is the *entry point*, not the *conclusion*. In the parable, the elephant is a unified whole that the men fail to see. In Jain metaphysics, the 'elephant' (substance) has infinite attributes (*anantaguṇa*). There is no 'whole' that exists apart from its aspects.
      *   *The Parable:* We are blind; the truth is One.
      *   *Jainism:* We are situated; the truth is Many.
      *   The exercise wasn't about blindness (you could see perfectly); it was about the *logic of predication*. Even if you weren't blind, 'It is White' is logically insufficient."

  ---

  ## Part 5: Closing (5 Minutes)

  Summarise the metaphysical gap.
  "In this exercise, the limitation was epistemic (screens). In Jainism, the limitation is ontological. Language cuts reality into slices (*nayas*). The *saptabhaṅgī* is a tool to prevent us from mistaking the slice for the loaf. Next week, we will read the *Ācārāṅga Sūtra* to see how this logic dictates non-violence (*ahiṃsā*). If no single view captures the whole, harming an opponent is harming a partial truth of the whole."

  ---

  ## Predictable Failures & Mitigation

  **1. The "Gamer" Group**
  *   **Risk:** One group figures out the cylinder shape immediately and tries to tell the others.
  *   **Mitigation:** Enforce the "No Communication" rule strictly during Phase 1. If they spoil it, assign them the role of "Logic Police" in Phase 3, tasked with finding contradictions in the joint statement.

  **2. The "Context" Cheat**
  *   **Risk:** Students bypass the constraint by saying "It is white *on the side*."
  *   **Mitigation:** This is why the constraint bans "location/angle" qualifiers. If they do it, accept it temporarily, then challenge it: "Does that statement describe the *object* or the *surface*? If the object is the sum of its surfaces, can you predicate colour of the whole?"

  **3. The "Inexpressible" as Mysticism**
  *   **Risk:** Students treat *avaktavya* as "It's a mystery" or "God knows."
  *   **Mitigation:** Be precise in the debrief. "Inexpressible here meant 'logically resistant to binary classification', not 'magical'. It was the result of holding two true contradictions simultaneously."

  **4. The Metaphysical Gap (The Hard Limit)**
  *   **Honest Assessment:** You are correct; the exercise cannot fully reproduce the ontological claim. In the classroom, the cylinder *is* a cylinder (a unified substance). The students' confusion is epistemic (lack of access). Jainism claims the confusion is inherent to predication itself.
  *   **How to Supply by Hand:** In the debrief, use the "Colour" example. "Even if you all stand up and look at the whole cylinder, can you truthfully say 'The object is White' without qualification? No. You must say 'The object is partially White.' But 'partially' admits that the predicate 'White' does not fully inhere in the subject. The gap isn't just your vision; it's the gap between *language* and *reality*. The exercise simulated the *logic* of that gap, even if the *cause* in the room was just cardboard screens."

