      *   **Gaming:** Group 2 peeks. *Fix:* Monitor closely.
      *   **Relativism:** "Both are right for them." *Fix:* Force a single joint statement.
      *   **Contextualism:** "It depends on the angle." *Fix:* Ban "angle/view" language in the drafting phase.
      *   **The "Inexpressible" confusion:** Students think it means "mystical/unknown." *Fix:* Define it as "logically resistant to single assertion."

