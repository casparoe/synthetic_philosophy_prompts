answer: |-
  No, his abolitionist conclusion does not survive a rigorous audit of the analogy, because the candle metaphor captures the physics of consumption but ignores the economics of production.

  Here is the breakdown of why the analogy feels compelling but fails to support the claim that IP is indefensible in principle.

  ### 1. The Mapping
  To audit the analogy, we have to see how your friend has assigned roles to the elements of the story:
  *   **The Candle:** The original work or invention (the master recording, the software code, the pharmaceutical formula).
  *   **The Flame:** The utility or enjoyment derived from the work (listening, using, reading).
  *   **Lighting Your Candle:** The act of copying or distributing the work.
  *   **Dimming/Shortening:** The depletion of the original owner's asset or utility.
  *   **Theft:** The claim that copying without permission is morally equivalent to physical deprivation.

  ### 2. Where the Mapping Holds (The Friend's Win)
  Your friend is correct on the **non-rivalrous** nature of the "flame." In economic terms, physical property is *rivalrous* (if I eat your apple, you cannot eat it). Intellectual property is *non-rivalrous* (if I copy your song, you can still listen to it). On the specific question of whether copying is "theft" in the same visceral sense as stealing a wallet, the candle analogy is accurate: no physical deprivation occurs. This successfully kills the argument that piracy is *physically* identical to larceny.

  ### 3. Where the Mapping Breaks (The Load-Bearing Flaws)
  The analogy collapses when you move from consumption to creation. There are two breaks, but only one matters for the conclusion.

  *   **Trivial Break: Physicality.** A candle is wax; an idea is information. This doesn't matter. We can accept that ideas are intangible without changing the economic outcome.
  *   **Load-Bearing Break: The Cost of the First Candle.** The analogy assumes the first candle *already exists* and implies it cost nothing to procure. In reality, the "first candle" in IP (the R&D, the movie production, the drug trial) has massive **fixed costs**, while the "lighting" (copying) has near-zero **marginal costs**.
      *   **Why this matters:** If the rule is "anyone can light their candle from yours for free," the owner of the first candle cannot recoup the cost of the wax. If they cannot recoup the cost, they do not buy the wax. If they do not buy the wax, no light is produced at all.
      *   **The Conclusion Killer:** Your friend's argument proves that *enforcing* IP creates artificial scarcity, but it fails to prove that *abolishing* IP creates optimal abundance. It risks creating zero abundance for high-cost goods. The analogy hides the supply side of the equation.

  ### 4. A Better Analogy: The Toll Bridge
  The candle is a bad picture because it implies a resource that is naturally free. A **Toll Bridge** is the correct economic analogy for Intellectual Property.

  *   **The Mapping:**
      *   **Building the Bridge:** The high fixed cost of creation (R&D, production).
      *   **Crossing the Bridge:** Consuming the work (copying/viewing).
      *   **Marginal Cost:** Once built, one more car crossing costs the owner practically nothing (just like copying a file).
      *   **The Toll:** The IP right (copyright/patent) allowing the builder to charge for access.

  *   **The Audit:**
      *   **Friend's View:** "Charging a toll is wrong because the marginal cost of a crossing is zero. Therefore, we should abolish tolls and let everyone cross for free."
      *   **The Reality:** If you abolish the toll, everyone can cross *this* bridge for free (which is efficient). But no private entity will ever build the *next* bridge, because they cannot recover the construction costs. Society gains short-term access but loses long-term infrastructure.

  ### 5. The Verdict: Abolition or Reform?
  The Toll Bridge analogy does not support your friend's abolitionism; it supports **reform**.

  *   **Why not Abolition?** If you abolish tolls (IP), you get no new bridges (blockbuster movies, new drugs, complex software). The market fails to produce high-fixed-cost goods.
  *   **Why Reform?** The problem with the current system isn't that tolls exist; it's that the toll booth stays up forever, or the toll is too high, or the bridge builder bought the land from the government for too cheap.
      *   The bridge analogy shows that IP should be **limited in duration** (just enough to pay for the bridge + profit incentive).
      *   It shows IP should be **limited in scope** (you can't charge a toll for walking on the river below the bridge).
      *   It highlights that the goal is **public utility**, not private enrichment. (We grant the monopoly *so that* the bridge gets built for the public).

  ### 6. The Jefferson Context (The "Gotcha")
  You can also tell your friend he is misusing Jefferson. Jefferson wrote that candle line in an 1813 letter arguing against the idea that ideas are *natural property* like land. He was **not** arguing against patents themselves; he helped design the U.S. patent system.

  Jefferson's point was that IP is a **social contract**, not a natural right. We grant a temporary monopoly (the toll) not because the creator has a divine right to the flame, but because society decided that without that incentive, the candle wouldn't be lit in the first place.

  **Bottom Line:** Your friend is right that copying isn't "theft" in the physical sense, but he is wrong that this makes IP indefensible. The candle analogy proves that IP is an **artificial scarcity** created by law, but it fails to ask whether that artificial scarcity is the price we must pay to ensure the light gets turned on at all. The Toll Bridge analogy shows that the solution is to regulate the toll, not burn the bridge.
