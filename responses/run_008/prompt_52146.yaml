      *   *Wait, the Lockean Thesis (1) usually ENTAILS Lottery Belief.* If $t = 0.95$ and $P(\text{lose}) = 0.99$, you believe it loses. To deny (3) while keeping (1), you need $t > 0.999999$. But then you can't believe much else.
      *   *Conclusion:* (1) and (3) are logically incompatible *unless* "justified belief" in (1) implies more than just credence (e.g., "credence + non-statistical basis"). The user defines (1) as "basically credence over a threshold." That "basically" is doing too much work.

