answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Coffee cups are stained with rings of neglect. Dr. Aris (Adaptationist) and Dr. Goulden (Pluralist) are standing over a printout of a hominid mandible.*

  **Aris:** Look at the symmetry, Goulden. It's precise. It's costly to build. And it's uniquely human. You really expect me to believe the most distinctive feature of the human face is just architectural debris?

  **Goulden:** "Debris" is your caricature, Aris. I call it a spandrel. A necessary consequence of two other trends intersecting. The face retracted—brain case expanded, mouth shrank—but the jaw had to maintain structural integrity to handle the tongue and the floor of the mouth. When you shorten the horizontal body of the mandible but keep the vertical depth, the bone has to buckle somewhere to resist stress. The chin is the buckle.

  **Aris:** A buckle? That's a description, not an explanation. You're saying selection built the retraction, and the chin just came along for the ride. But developmental processes aren't magic; they are themselves products of earlier selection. If the genome codes for a developmental pathway that produces a chin, that pathway was selected. So, in the end, the chin is selected.

  **Goulden:** That's the pan-adaptationist sleight of hand. Just because the *process* is selected doesn't mean every *output* of that process is adaptive. Selection built the arch; the spandrel is the space left over. If I select for a shorter face to fit a larger brain, I might get a chin. I didn't select *for* the chin. I selected for the brain and the face; the chin is the geometric price I paid.

  **Aris:** But why keep it? If it were truly useless, or worse, metabolically costly without return, drift might remove it, or selection would smooth it out. The fact that it persists, universally, across all human populations, suggests it's doing work. Maybe it's biomechanical—reinforcing the symphysis against masticatory stress. Maybe it's sexual signaling—a marker of developmental stability.

  **Goulden:** There it is. The "Just-So" menu. Biomechanics, signaling, speech support. You have three stories ready before breakfast. But where is the evidence? To claim adaptation, you need to show heritable variation in the trait, a correlation between that variation and fitness, and a history of selection acting on it. Do you have a single study showing that individuals with more prominent chins had more surviving offspring in the Pleistocene?

  **Aris:** We can't run a fitness assay on the Pleistocene. But we can look at function. If the chin reinforces the jaw against lateral stress, that's a functional payoff.

  **Goulden:** Correlation is not causation. And "functional" does not mean "adapted." A nose is functional for holding glasses, but it wasn't selected for that. You're assuming the chin exists *because* of the function. I'm saying the function might be secondary, or the chin is simply tolerated because the cost of removing it—re-engineering the entire developmental module of the face—is too high.

  **Aris:** Tolerance isn't enough. Bone is expensive. Growth is risky. If it were merely a byproduct, you'd expect more variation. You'd expect some populations to lack it, or for it to be rudimentary. Instead, it's a species constant. That screams fixation by selection.

  **Goulden:** Or it screams a developmental constraint so tight that variation is impossible. You ask for evidence of selection; I ask for evidence of variation. If there is no heritable variation for a "chin-less" human in the ancestral population, selection couldn't act on it anyway. It becomes a structural necessity, not an adaptive option.

  **Aris:** So we're at an impasse of negative evidence. You say "no proof of selection," I say "no proof of neutrality." How do we settle this? What data would change your mind?

  **Goulden:** Show me the fossil sequence where facial retraction happens *without* a chin appearing. If the chin is a necessary byproduct of retraction, they should appear simultaneously. If the chin is an adaptation, it could lag behind, or appear in a lineage that didn't retract the face.

  **Aris:** Reasonable. But I'd add: show me a primate with similar masticatory stresses that *doesn't* develop a chin, yet has the same facial geometry. If geometry dictates the chin, it should appear in other lineages with similar constraints. If it's unique to us, it suggests a specific selective pressure unique to us.

  **Goulden:** And I'd add developmental perturbation. If you knock out the genes for facial retraction in a model organism, does the chin vanish independently? If the chin is tied inextricably to the retraction module, it supports the byproduct hypothesis. If you can tweak the chin without altering the face, that supports modularity and potential independent selection.

  **Aris:** We can't ethically do that on humans. And the fossil record is fragmentary. You're asking for perfect data in a historical science.

  **Goulden:** And you're asking for fitness gradients in extinct populations. We are both asking for ghosts.

  **Aris:** Not necessarily. We use proxies. Which brings me to the new dataset from the Holocene skeletal review. Have you seen the preliminary findings?

  **Goulden:** The one on mandibular stress markers?

  **Aris:** Yes. They analyzed three thousand mandibles from agricultural and forager populations. They found a significant positive correlation between chin projection and markers of masticatory stress—muscle attachment sites, bone density at the symphysis. The bigger the chin, the higher the mechanical load the jaw was handling.

  **Goulden:** I saw it. And you interpret this as the smoking gun for biomechanical adaptation.

  **Aris:** It's exactly what the adaptationist model predicts. The chin reinforces the jaw. Individuals eating tougher diets developed more robust chins, or rather, those with genetic predispositions for robust chins handled the stress better and survived. It's functional morphology.

  **Goulden:** Or, it's exactly what the structuralist model predicts, for a different reason.

  **Aris:** How do you figure?

  **Goulden:** Bone remodels. Wolff's Law. If the chin is a structural buckle, it should respond to stress. A thicker buckle handles more load. The correlation shows the chin *responds* to stress, not that it was selected *for* stress resistance. It's like a callus. The callus correlates with friction, but the callus isn't an adaptation in the genetic sense; it's a plastic response of the tissue.

  **Aris:** But the variation in the study was largely skeletal, implying genetic underpinnings, not just plasticity.

  **Goulden:** Is it? Or does the genetic propensity for facial retraction correlate with the genetic propensity for bone density? You're seeing a correlation between two traits that are developmentally linked. The diet causes the stress; the stress remodels the chin; the facial shape dictates the chin's form. The selection is on the diet and the face. The chin is just the place where the stress manifests most visibly.

  **Aris:** You're moving the goalposts. If the chin handles the stress, it contributes to fitness. If it contributes to fitness, selection maintains it. At that point, does the distinction between "byproduct that helps" and "adaptation" matter?

  **Goulden:** It matters immensely for how we understand history. If it's an adaptation, we look for the specific gene for "chinness." If it's a byproduct, we look for the genes for "face size" and "brain size." You're looking for a lever that doesn't exist. You're trying to explain the spandrel by painting a picture on it, rather than looking at the arch that holds it up.

  **Aris:** And you're ignoring that the arch was built by a builder who cares about the spandrel. If the spandrel collapses, the arch fails. Selection doesn't care about your geometric purity. It cares about survival. If the chin aids survival, it is selected.

  **Goulden:** But was it selected *because* it aids survival, or does it aid survival *because* it exists? The order of operations defines the evolutionary story.

  **Aris:** And without a time machine, we can't sequence the order. We have the correlation. I see function. You see constraint.

  **Goulden:** Precisely. And until you can show me that a chin-less human would have died *specifically* because of the lack of a chin, and not because of the facial retraction that caused the lack of a chin, I remain unconvinced.

  **Aris:** And until you can show me that the chin could have been easily removed by selection but wasn't, I remain convinced it's there for a reason.

  **Goulden:** *(Sips cold coffee)* So we wait for the fossils.

  **Aris:** *(Gathers papers)* Or the genome. But I suspect we'll both find exactly what we're looking for in whatever comes up next.

  **Goulden:** That, Aris, is the only thing we agree on.
