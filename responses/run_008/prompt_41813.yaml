prompt: |-
  I'm a science-and-ideas journalist, and my editor has greenlit a long-form feature on the Sleeping Beauty problem — the one where Beauty is woken once if a fair coin lands heads and twice if it lands tails, remembers nothing between awakenings, and is asked her credence in heads on waking. Every previous explainer I can find rehearses the halfer answer, the thirder answer, and a couple of the standard objections, and then discreetly changes the subject. Before I start booking interviews with philosophers on either side, I want to be sure I actually know what would count as resolving the thing, rather than just what the factions say. So what I'd like from you is a specification, not a scorecard: the desiderata that any adequate treatment of the problem must meet.

  To give you a sense of the level I need: I already understand that a mere intuition about the original case settles nothing, so the desiderata have to be more demanding than "gets the textbook scenario right." I'd want to know, for instance, whether a solution owes us an account of how Beauty's credence should move when she's told it's Monday — I've noticed that halfers and thirders who condition on that information seem to end up in different places, and I don't know whether that's a fatal symptom for one camp or an artifact of how the experiment is described. I'd also want to know what a solution owes us on the decision-theoretic side: if Beauty is offered the same bet on heads at each awakening, or scored on her forecasts by something like a proper scoring rule, is agreeing with the right betting behavior a requirement or merely a bonus? And there are the anthropic extensions I'd rather my piece didn't ignore — the versions with biased coins, the ones where the number of awakenings tracks something in the world like how many observers there are, the pressure the problem puts on whether self-locating evidence should be treated like ordinary evidence. I don't need you to adjudicate these; I need to know which of them any serious answer must handle and which are optional exercises one camp happens to enjoy.

  So please write me the list of requirements: the cases a solution must get right, the distinctions it must respect (say, between Beauty's credence and the fraction of awakenings at which heads was true, or between a well-defined answer for Beauty and one for an outside observer), the constraints it can't violate — like consistency with the coin being fair, or with Beauty's rationality not depending on information she lacks — each with the consideration that motivates it. Mark which desiderata you'd defend as non-negotiable and which you suspect are prejudices of the halfer or thirder camp dressed up as adequacy conditions. Most importantly, tell me if some subset of the requirements is jointly unsatisfiable — if the desiderata themselves force you to pick a side, that's exactly the paragraph my article needs. And note which single requirement does the most to knock out otherwise attractive views; I want my readers to come away understanding that the interesting question is not "heads or tails math" but what it would even mean for this dispute to be over.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Science-and-ideas journalist writing a long-form feature on the Sleeping Beauty problem.
      *   **Goal:** Not a scorecard of who wins (Halfer vs. Thirder), but a *specification of desiderata* for an adequate solution. What counts as "resolving" the problem?
      *   **Level:** High. Understands the basics (Halfer/Thirder, conditioning on Monday, betting/scoring, anthropic extensions). Wants to know what constraints a theory *must* meet vs. what are camp-specific prejudices.
      *   **Key Questions:**
          *   What cases must be handled?
          *   What distinctions must be respected?
          *   What constraints cannot be violated?
          *   Which desiderata are non-negotiable vs. partisan?
          *   Are any subsets jointly unsatisfiable (does meeting the criteria force a side)?
          *   Which single requirement is the "killer constraint"?
      *   **Tone:** Professional, analytical, precise, suitable for a sophisticated journalist. No waffling.

  2.  **Deconstruct the Sleeping Beauty Problem (SBP):**
      *   *Setup:* Fair coin. Heads -> 1 awakening (Mon). Tails -> 2 awakenings (Mon, Tue). Amnesia between awakenings.
      *   *Question:* Upon awakening, what is $P(Heads)$?
      *   *Halfer:* $1/2$. (No new info).
      *   *Thirder:* $1/3$. (Long-run frequency of awakenings).
      *   *Double Halfer:* $1/2$ on waking, $2/3$ on "It's Monday".
      *   *Decision Theory:* Betting arguments often favor Thirders, but can be rigged. Scoring rules (Brier) favor Thirders *if* scored per awakening.
      *   *Anthropic Connection:* Self-Sampling Assumption (SSA) vs. Self-Indication Assumption (SIA). SBP is the toy model for Doomsday Argument, etc.

  3.  **Drafting the Desiderata (Brainstorming & Categorizing):**

      *   *Constraint 1: The Coin.* It must remain fair. $P(Heads)$ before sleep is $1/2$.
      *   *Constraint 2: New Evidence.* Did Beauty learn anything? Halfers say no. Thirders say "I am awake now" is evidence.
      *   *Constraint 3: Conditioning.* If told it's Monday, what happens?
          *   Halfer: $P(H|Mon) = P(H \& Mon) / P(Mon)$. If $P(H)=1/2$, $P(Mon|H)=1$, $P(Mon|T)=1/2$. $P(Mon) = 1/2(1) + 1/2(1/2) = 3/4$. So $P(H|Mon) = (1/2) / (3/4) = 2/3$.
          *   Thirder: $P(H) = 1/3$. $P(Mon|H)=1$, $P(Mon|T)=1/2$. $P(H|Mon) = 1/2$.
          *   *Wait, check Thirder math:* If $P(H)=1/3, P(T)=2/3$. $P(Mon) = P(Mon|H)P(H) + P(Mon|T)P(T) = 1(1/3) + 1/2(2/3) = 2/3$. $P(H|Mon) = (1/3) / (2/3) = 1/2$.
          *   *Conflict:* Halfers end up with $P(H|Mon) = 2/3$. Thirders end up with $P(H|Mon) = 1/2$. This is the "Monday Morning" problem.
      *   *Constraint 4: Betting/Decision.* If paid per awakening, bet as if $1/3$. If paid per experiment, bet as if $1/2$. A solution must explain *why* credence links (or doesn't) to action.
      *   *Constraint 5: Reflection Principle.* Should Beauty's current credence match her expected future credence?
      *   *Constraint 6: Indifference.* Indifference between indistinguishable states (Mon/Tue under Tails).
      *   *Constraint 7: Anthropics.* Does this scale to the Doomsday Argument?

  4.  **Selecting and Refining the Desiderata:**

      *   *Requirement 1: The Fairness Constraint.* The solution cannot change the physical probability of the coin toss. $P(Heads)$ at $t_0$ is $1/2$.
      *   *Requirement 2: The Indifference Constraint.* Upon waking, Beauty cannot distinguish Mon/Tue if Tails. $P(Mon|Tails) = P(Tue|Tails) = 1/2$. (Non-negotiable).
      *   *Requirement 3: The Conditioning Constraint (The "Monday Test").* If Beauty is told "It is Monday," her credence in Heads must update coherently via Bayes' Rule. This is where the math breaks for some.
      *   *Requirement 4: The Decision-Theoretic Link.* Credence should guide action. If a proper scoring rule is used per awakening, the credence should minimize expected loss.
      *   *Requirement 5: The Reflection/Disagreement Constraint.* Can Beauty disagree with her future self? Can she disagree with an outside observer who knows the day?
      *   *Requirement 6: The Generalizability Constraint.* Does it work if the coin is biased? If awakenings are 1 vs 1,000,000?

  5.  **Identifying the "Killer Constraint" and Joint Unsatisfiability:**
      *   The tension is usually between *Bayesian Conditionalization* (Requirement 3) and *The Principle of Indifference/Long-Run Frequency* (Requirement 2/4).
      *   Specifically, the "Halfer" position often violates the *Reflection Principle* or requires "centered worlds" logic that looks like cheating to Bayesians.
      *   The "Thirder" position often struggles to explain why the coin's physical fairness ($1/2$) seems to vanish into a $1/3$ credence without new evidence (violating a strict interpretation of "No New Evidence").
      *   *The Real Killer:* **The Consistency of Conditionalization.** If you accept standard Bayesian updating, the Halfer position leads to $P(H|Mon) = 2/3$, which feels wrong (why does learning it's Monday make Heads *more* likely than Tails when Tails has a Monday?). Wait, actually, if $P(H)=1/2$, then $P(H|Mon)=2/3$. If $P(H)=1/3$, then $P(H|Mon)=1/2$.
      *   *The Conflict:* You cannot satisfy (A) Standard Bayesian Conditionalization, (B) The Intuition that $P(H)$ should be $1/2$ (No New Info), and (C) The Intuition that $P(H|Mon)$ should be $1/2$ (Since Mon/Tails and Mon/Heads are symmetric *given* Monday).
      *   Actually, the strongest conflict is between **The Principal Principle** (align credence with objective chance) and **Self-Locating Indifference** (treat awakenings as equiprobable).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the journalist's sophistication. State the thesis: The problem isn't math; it's a collision of normative principles.
      *   **Section 1: Non-Negotiable Desiderata (The Table Stakes).** Things any theory *must* do (Fairness, Indistinguishability, Coherence).
      *   **Section 2: The Decision-Theoretic Bridge.** How credence connects to bets/scoring.
      *   **Section 3: The Anthropics/Generalization Test.** Scaling the problem.
      *   **Section 4: The Joint Unsatisfiability (The "Gotcha").** Where the principles clash.
      *   **Section 5: The Killer Constraint.** Identifying the specific requirement that breaks most models.
      *   **Conclusion:** Summary for the article.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Be careful with the "Monday" math.
          *   Halfer: $P(H)=1/2$. $P(Mon|H)=1, P(Mon|T)=1/2$. $P(Mon) = 3/4$. $P(H|Mon) = (1/2)/(3/4) = 2/3$.
          *   Thirder: $P(H)=1/3$. $P(Mon|H)=1, P(Mon|T)=1/2$. $P(Mon) = 1/3 + 1/3 = 2/3$. $P(H|Mon) = (1/3)/(2/3) = 1/2$.
          *   *Crucial Point:* Many find $P(H|Mon)=1/2$ intuitively necessary because on Monday, the coin hasn't landed yet (or rather, the situation is symmetric). If a solution forces $P(H|Mon)=2/3$, it implies learning it's Monday is evidence for Heads. This is counter-intuitive to many.
      *   *Correction on Decision Theory:* Distinguish between "bet per experiment" and "bet per awakening." A solution must specify which one credence tracks.
      *   *Correction on "New Evidence":* This is the core philosophical dispute. I need to frame the desideratum not as "must have new evidence" but "must account for information flow."
      *   *Refining the "Killer":* It's the **Principle of Indifference over Centered Worlds** vs. **Bayesian Conditionalization on Uncentered Propositions**. Or simpler: **The Alignment of Credence with Objective Chance (Principal Principle)** vs. **The Alignment of Credence with Relative Frequency of Observations.**

  8.  **Final Polish:** Ensure the tone is authoritative but neutral. Use the journalist's framing ("scorecard vs. specification"). Make sure the "Joint Unsatisfiability" section is punchy. (The "Trilemma" is a good framing).

      *   *Trilemma:*
          1.  Credence equals Objective Chance (unless specific evidence updates it).
          2.  Indistinguishable awakenings get equal credence.
          3.  Credence updates via standard Conditionalization.
      *   You can only pick two.

  9.  **Final Review against constraints:**
      *   Did I mark non-negotiable vs. partisan? Yes.
      *   Did I identify the jointly unsatisfiable subset? Yes.
      *   Did I identify the single killer requirement? Yes.
      *   Is the level appropriate? Yes.

      *(Self-Correction)*: Wait, I need to make sure I don't accidentally solve it myself. I am providing the *criteria* for a solution. Keep the focus on the *requirements*.

      *Revised Plan for "Killer Constraint":* The requirement that **Credence must align with Betting Behavior under Proper Scoring Rules per Awakening** is often the one that kills the Halfer view *unless* they modify decision theory. But the requirement that **Credence must align with Objective Chance (Principal Principle)** kills the Thirder view *unless* they modify epistemology. The *real* killer is **Diachronic Coherence (Reflection)**. If Beauty knows she will be woken twice on Tails, can she maintain $1/2$?

      Let's go with **Diachronic Coherence / Reflection** as the killer. It forces you to admit you are gaining evidence just by existing in the moment.

      *Wait, better angle:* The "Monday" constraint is the most concrete mathematical friction point. Let's highlight the **Conditionalization Consistency** requirement.

      Okay, ready to write.

      *Structure:*
      1.  Intro: Validating the prompt.
      2.  The Non-Negotiables (Physics, Logic, Indifference).
      3.  The Decision-Theoretic Link (Bets/Scoring).
      4.  The Generalization Test (Biased coins, extreme ratios).
      5.  The Trilemma (Joint Unsatisfiability).
      6.  The Killer Constraint.
      7.  Closing advice.

      *Tone Check:* "You asked for a specification, not a scorecard." Keep it tight.

      *(Final thought on the Monday Math)*: Make sure to clearly state *why* $P(H|Mon) = 2/3$ is problematic for Halfers (implies Monday is evidence for Heads) and why $P(H) = 1/3$ is problematic for Thirders (implies mere awakening is evidence against Heads).

      Let's draft.
answer: |-
  This is the right way to approach the story. The Sleeping Beauty problem is not a puzzle waiting for a calculation; it is a collision of normative principles that we usually assume work together. Your article will be strongest if it frames the dispute not as "Who did the math right?" but "Which foundational principle are we willing to break?"

  Below is the specification you requested. It is divided into **Non-Negotiable Constraints** (requirements any rational agent model must meet), **Decision-Theoretic Links** (how belief connects to action), and **Generalization Tests** (scalability). I have flagged which are substantive requirements and which are often partisan disguises. Finally, I outline the **Trilemma**: the set of desiderata that cannot be jointly satisfied, which is the core of your story.

  ---

  ### I. Non-Negotiable Constraints
  *These are the baseline requirements. A solution that violates these is not a solution to Sleeping Beauty; it is a solution to a different problem.*

  **1. The Fairness Constraint (Objective Chance)**
  *   **Requirement:** The solution must acknowledge that the coin is physically fair. At $t_0$ (Sunday), Beauty's credence in Heads must be $1/2$.
  *   **Motivation:** To deny this is to deny the setup. Any shift from $1/2$ upon awakening must be explained by information gained, not by changing the physics of the coin.
  *   **Status:** **Non-Negotiable.**

  **2. The Indifference Constraint (Centered Worlds)**
  *   **Requirement:** Upon awakening, if Beauty knows the coin landed Tails, her credence that it is Monday must equal her credence that it is Tuesday ($1/2$ each).
  *   **Motivation:** The awakenings are subjectively indistinguishable. There is no internal marker to differentiate them. To assign unequal probability is to claim access to information she explicitly lacks.
  *   **Status:** **Non-Negotiable.** (Violating this leads to "Double Halfer" variants that are notoriously difficult to defend).

  **3. The Coherence Constraint (Probability Calculus)**
  *   **Requirement:** The credences assigned to Heads, Tails, Monday, and Tuesday must sum to 1 and obey the axioms of probability. Specifically, $P(Heads) + P(Tails \cap Monday) + P(Tails \cap Tuesday) = 1$.
  *   **Motivation:** Avoiding Dutch Books (guaranteed losses) in principle, even if not in practice.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. The Decision-Theoretic Link
  *This is where most "explainers" fail. They treat credence as a feeling rather than a guide to action. A serious solution must specify how credence translates to stakes.*

  **4. The Scoring Rule Alignment**
  *   **Requirement:** The solution must specify whether Beauty's credence is intended to minimize error in a **per-experiment** score or a **per-awakening** score.
  *   **Motivation:** If Beauty is scored on every awakening (e.g., she loses a point for every wrong guess), betting as if $P(Heads) = 1/3$ minimizes loss. If she is scored once per experiment (e.g., only her Monday answer counts, or her answers are averaged), betting $1/2$ minimizes loss.
  *   **Status:** **Non-Negotiable Clarification.** A solution cannot simply say "she should bet 1/3." It must justify *why* the scoring rule matches the definition of credence.
  *   **Partisan Alert:** Thirders often treat per-awakening scoring as the default definition of rationality. Halfers often treat per-experiment scoring as the default. An adequate solution must argue why one scoring rule captures the *epistemic* state rather than just the *pragmatic* utility.

  **5. The "Monday Morning" Test (Conditionalization)**
  *   **Requirement:** The solution must yield a coherent credence for Heads *if* Beauty is told, "It is Monday."
  *   **Motivation:** This is the stress test for Bayesian updating.
      *   If $P(Heads) = 1/2$ (Halfer), then learning "It is Monday" implies $P(Heads | Monday) = 2/3$. (Because Tails has a Monday, but also a Tuesday; Heads is *only* Monday. Eliminating Tuesday boosts Heads).
      *   If $P(Heads) = 1/3$ (Thirder), then learning "It is Monday" implies $P(Heads | Monday) = 1/2$.
  *   **Status:** **Non-Negotiable.** The solution must own the consequence. If a Halfer solution implies that learning "It is Monday" makes Heads more likely than Tails, it must explain why "being in a Monday state" is evidence for Heads, despite the coin being fair.
  *   **Partisan Alert:** Many Halfers find the $2/3$ result on Monday counter-intuitive (since the coin hasn't been tossed yet relative to Monday morning). Many Thirders find the initial $1/3$ counter-intuitive (since the coin is fair). The solution must resolve this tension, not hide it.

  ---

  ### III. Generalization and Anthropics
  *A solution that works only for the 1-vs-2 awakening case is a parlor trick. It must scale.*

  **6. The Extreme Ratio Test**
  *   **Requirement:** The solution must hold if the Tails scenario involves 1,000,000 awakenings instead of 2.
  *   **Motivation:** If the coin is Tails, Beauty wakes up a million times. If Heads, once.
      *   Does Beauty really think it is 50/50 that she is in the single Heads awakening vs. one of the million Tails awakenings?
      *   Does she really think the probability of Heads is $1/1,000,001$?
  *   **Status:** **Non-Negotiable.** Intuitions often break here. A robust solution explains *why* the ratio matters (or why it doesn't).

  **7. The Biased Coin Test**
  *   **Requirement:** The solution must work if the coin is biased (e.g., $P(Heads) = 1/100$).
  *   **Motivation:** This separates the effect of the *coin's bias* from the *awakening bias*.
  *   **Status:** **Non-Negotiable.**

  **8. The Observer Independence Constraint**
  *   **Requirement:** The solution must account for the discrepancy between Beauty's credence and an Outside Observer's credence (who knows the day but not the coin, or knows the coin but not the day).
  *   **Motivation:** If an observer knows it is Monday, their $P(Heads)$ is $1/2$. If Beauty's is different, the solution must explain why self-locating information ("I am awake now") creates a divergence from objective chance.
  *   **Status:** **Non-Negotiable.** This is the bridge to the Doomsday Argument and anthropic reasoning. If the solution can't explain the divergence, it can't handle the anthropic extensions you want to cover.

  ---

  ### IV. The Trilemma: Jointly Unsatisfiable Desiderata
  *This is the paragraph your article needs. You can tell your readers that the reason this problem is unsolved is not because philosophers are stubborn, but because the following three principles are mutually inconsistent in the Sleeping Beauty context. Any solution must explicitly reject or modify one.*

  1.  **The Principal Principle:** Beauty's credence in Heads should align with the known objective chance of the coin ($1/2$), unless she receives specific evidence about the outcome.
  2.  **The Principle of Indifference:** Beauty should assign equal probability to subjectively indistinguishable states (the awakenings).
  3.  **Bayesian Conditionalization:** Beauty should update her beliefs strictly by conditioning on new information using standard probability rules.

  **The Conflict:**
  *   If you keep **Principal Principle** ($P(H)=1/2$) and **Conditionalization**, you are forced to violate **Indifference** (you must treat the Monday/Tails awakening as more probable than Tuesday/Tails to make the math work, which contradicts the amnesia setup). *This is the Halfer trap.*
  *   If you keep **Indifference** (treat awakenings as equiprobable) and **Conditionalization**, you are forced to violate **Principal Principle** ($P(H)$ becomes $1/3$, diverging from the fair coin chance). *This is the Thirder trap.*
  *   If you keep **Principal Principle** and **Indifference**, you must violate **Conditionalization** (you must claim Beauty updates her belief in a way that standard Bayes' rule doesn't capture, often invoking "centered worlds" or non-standard logic). *This is the "New Logic" trap.*

  ---

  ### V. The Killer Constraint
  *You asked for the single requirement that knocks out the most attractive views.*

  **The Requirement:** **Diachronic Coherence (The Reflection Principle).**
  *   **Definition:** An agent's current credence should match their expected future credence, provided they expect to remain rational and gain no misleading information.
  *   **Why it kills:**
      *   On Sunday, Beauty knows she will be woken.
      *   If she is a **Halfer**, she expects to wake up and still believe $1/2$. This seems coherent, *but* it implies she learns *nothing* from waking up. This makes it hard to justify why she should bet differently in the 1-vs-1,000,000 case.
      *   If she is a **Thirder**, she expects to wake up and believe $1/3$. But on Sunday, she knows the coin is fair ($1/2$). This means she expects to become *less* confident in Heads simply by the passage of time and the act of waking, without any new external evidence. This violates Reflection: she knows her future self will be "biased" against Heads, yet she adopts that bias in advance.
  *   **The Journalistic Angle:** This constraint forces the writer to ask: **Is waking up evidence?**
      *   If yes (Thirder), you violate the intuition that a fair coin stays fair.
      *   If no (Halfer), you violate the intuition that frequencies of experience matter (and you break Decision Theory in the 1-vs-1,000,000 case).
      *   The "Killer" is that **standard Bayesianism assumes evidence is about the world, not about the observer's location in the world.** Sleeping Beauty proves that if self-locating information counts as evidence, standard Bayesianism breaks. If it doesn't, Decision Theory breaks.

  ### VI. Summary for the Piece
  To write the definitive piece, do not ask the philosophers "Is it 1/2 or 1/3?" Ask them: **"Which of the three principles in the Trilemma are you willing to sacrifice, and what is the cost of that sacrifice for the rest of epistemology?"**

  *   If they sacrifice the **Principal Principle**, ask them how we can trust science if credence diverges from objective chance.
  *   If they sacrifice **Indifference**, ask them how we can reason about identical states.
  *   If they sacrifice **Conditionalization**, ask them if we need a new logic for the 21st century.

  The resolution of Sleeping Beauty isn't a number. It's a choice about which rule of rationality is the least essential. That is your story.
