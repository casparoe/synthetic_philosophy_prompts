          *   *Refinement on Condition 2:* To make it fair, the Bookmaker offers a contract. If Tails (2 awakenings), the contract is only executed once (randomly selected or first instance). Or, simpler: The Beauty makes a *standing commitment* before the experiment starts? No, the prompt says "offering bets... at each awakening."
