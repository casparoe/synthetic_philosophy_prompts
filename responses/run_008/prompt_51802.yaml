          *   *Method:* Blindfolds + Headphones (white noise) + Physical relocation.
          *   *Room Setup:* Room A (Awakening 1), Room B (Awakening 2). Or one room rearranged. Two rooms is safer.
          *   *Timing:* Staggered.
