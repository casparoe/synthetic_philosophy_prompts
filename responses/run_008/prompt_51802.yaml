answer: |-
  This is a high-wire act. You are trying to simulate a metaphysical puzzle using physical logistics. The goal isn't perfect fidelity (which is impossible without actual amnesia drugs) but *operational indistinguishability* sufficient to force the decision-theoretic conflict.

  Here is a 90-minute lesson plan designed to make the Halfer/Thirder debate a matter of wallet, not just intuition.

  ### 1. The Setup & Roles (14 Students)

  Divide the class into three groups. You will rotate them in Round 2 so everyone experiences both sides.
  *   **Group A (5 students): The Beauties.** (Subjects)
  *   **Group B (5 students): The Bookmakers.** (Counterparties)
  *   **Group C (4 students): The Admin.** (Coin flippers, escorts, token bankers).

  **Room Requirements:**
  *   **Room 1 (The Lab):** Where the coin is flipped and Beauties are "woken."
  *   **Room 2 (The Wait):** Where Beauties wait between awakenings (must be sound-isolated from Room 1).
  *   **Hallway:** Used for transit.

  **Materials:**
  *   Blindfolds (14).
  *   Noise-cancelling headphones or earplugs + White Noise app on a phone (for transit).
  *   Tokens (poker chips or printed slips, ~50 per student).
  *   "Bet Slips" (index cards).
  *   A physical coin.

  ---

  ### 2. The Mechanics of "Fake Amnesia"

  You cannot wipe memory. You must wipe *temporal markers*.

  1.  **Sensory Deprivation:** Beauties wear blindfolds and headphones (playing white noise) whenever they are outside the "Awakening Chair."
  2.  **The Transit:** Admin escorts must walk Beauties via different paths if possible, or at least vary the timing. No talking from Admin.
  3.  **The Environment:** The "Awakening Chair" in Room 1 must look identical every time. Remove clocks, phones, and windows.
  4.  **The "Wake":**
      *   **Heads:** Beauty is escorted to Chair, makes bet, escorted out, experiment **ends**. Blindfold removed.
      *   **Tails:** Beauty is escorted to Chair, makes bet, escorted back to **The Wait** (Room 2). She keeps the blindfold/headphones on. She waits 15 minutes. She is escorted back to Chair (Room 1), makes bet, escorted out, experiment **ends**.
  5.  **Isolation:** Beauties are staggered. Beauty 1 starts at T=0. Beauty 2 starts at T=5. This prevents them from hearing each other in the hallway or Wait room.

  ---

  ### 3. The Payoff Scheme (Tokens)

  Give each Beauty an endowment of **20 Tokens**.
  The bet is always: **Wager 10 Tokens on "Heads" at Even Money (Win 10, Lose 10).**
  *(Note: You can let them choose the wager, but fixed wagers simplify the math for the debrief.)*

  **The Crucial Divergence:**

  *   **Round 1: The "Per-Awakening" Settlement (Thirder Pressure)**
      *   **Rule:** Every bet slip filled out is settled immediately.
      *   **Heads:** Beauty wakes once. 1 Bet settled. (Net: +10 or -10).
      *   **Tails:** Beauty wakes twice. 2 Bets settled. (Net: +20 or -20).
      *   *Incentive:* Tails is "expensive." You lose double. You should bet cautiously on Heads.

  *   **Round 2: The "Per-Experiment" Settlement (Halfer Pressure)**
      *   **Rule:** Bets are recorded on a "Master Log." Settlement happens only after the experiment concludes.
      *   **Heads:** 1 Bet on Log. Settled once.
      *   **Tails:** 2 Bets on Log. **Admin randomly shreds one bet slip.** The remaining one is settled once.
      *   *Incentive:* Tails is no longer double-punishment. The risk matches the coin flip (50/50).

  ---

  ### 4. Timeline (90 Minutes)

  **0:00 – 0:15: Briefing & Setup**
  *   Explain the rules clearly. Emphasize that **Tokens = Grade Points/Candy**.
  *   Collect all phones/watches from Group A (Beauties).
  *   Group C (Admin) goes to Room 1 to prep. Group B (Bookmakers) stays in seminar room to prepare odds sheets.
  *   **Crucial:** Explain that Bookmakers do *not* talk to Beauties. Bookmakers write a "Standing Offer" (e.g., "I will bet against you at 1:1"). Beauties accept or reject.

  **0:15 – 0:45: Round 1 (Per-Awakening Settlement)**
  *   **Action:** Coin flipped secretly. Beauties processed one by one (staggered by 5 mins).
  *   **Betting:** At the chair, Beauty states bet. Bookmaker (who rotates into Room 1) records it.
  *   **Settlement:** If Tails, Beauty loses 20 tokens total (10 per awakening). If Heads, loses/gains 10.
  *   **Wrap:** Count tokens. Who went bankrupt? Who profited?

  **0:45 – 0:55: Role Swap & Reset**
  *   Group A becomes Bookmakers. Group B becomes Beauties. Group C stays Admin (or swaps with a few students).
  *   Reset token endowments.
  *   **Re-brief:** Emphasize the **Rule Change**. "Now, if you wake twice, one bet is deleted."

  **0:55 – 1:25: Round 2 (Per-Experiment Settlement)**
  *   Run the same physical protocol.
  *   **Settlement:** Admin collects bet slips. If Tails, flip a coin to decide which slip counts. Settle.
  *   **Wrap:** Count tokens. Compare betting behavior to Round 1.

  **1:25 – 1:30: The Hard Stop**
  *   Return phones. Sit down for debrief.

  ---

  ### 5. Troubleshooting: What Will Go Wrong

  **1. The "Corridor Counter" (Cheating)**
  *   *Risk:* A Beauty counts steps or turns between the Wait Room and the Chair to guess if it's the first or second trip.
  *   *Fix:* Admin must take circuitous routes. Spin the Beauty gently in place before walking. Better yet: Use the *same* path but vary the *time* spent in the Wait Room slightly (10 mins vs 15 mins) so duration isn't a cue either.
  *   *Debrief:* If a student claims they knew, ask the class: "In the real philosophical problem, you *cannot* know. If you knew, the problem dissolves. We must assume you didn't know to evaluate the rationality."

  **2. The "Voice Leak"**
  *   *Risk:* A Bookmaker says, "Good luck, see you this afternoon" (implying Tails).
  *   *Fix:* **No verbal communication.** Bookmakers and Beauties communicate via Bet Slips only. Admin acts as the mute courier.
  *   *Debrief:* If this happens, discard that Beauty's data. Use it as an example of "illegitimate information."

  **3. The "Settlement Confusion"**
  *   *Risk:* In Round 2, a Beauty thinks, "I bet twice, so I should win/lose twice."
  *   *Fix:* The Admin must hold up a visual sign at the Awakening Chair: **ROUND 1: EVERY BET COUNTS** vs **ROUND 2: ONE BET PER COIN**.
  *   *Debrief:* This is the core teaching moment. If they bet aggressively in Round 2 and lost, they failed to update their *strategy* to the *payoff structure*, even if their *credence* remained the same.

  **4. The "Bored Beauty"**
  *   *Risk:* Students in the Wait Room take off blindfolds.
  *   *Fix:* Admin monitors the Wait Room. Violation = Disqualification from tokens.

  ---

  ### 6. The Debrief: Sorting Credence from Artifacts

  This is where you earn your pay. The activity will likely result in students betting differently in Round 1 vs. Round 2. You must parse *why*.

  **Question 1: Did your belief about the coin change?**
  *   *Goal:* Elicit that the coin is still 50/50 physically.
  *   *Point:* If you say "The coin is 50/50" but you bet 2:1 odds in Round 1, you have decoupled **Credence** from **Betting Odds**.

  **Question 2: Why did Round 1 punish Tails more?**
  *   *Answer:* Because the *agent* was multiplied, not the *world*.
  *   *Philosophical Link:* This is the **Thirder** position. $P(Heads | Awakening) = 1/3$. Why? Because there are three possible awakenings, and only one is Heads. The betting rule (Per-Awakening) aligns with "Self-Sampling Assumption."

  **Question 3: Why did Round 2 feel like a normal coin flip?**
  *   *Answer:* Because the payoff was normalized per experiment.
  *   *Philosophical Link:* This is the **Halfer** position (specifically the Lewisian Halfer). They argue credence should stay 1/2. This betting rule makes 1/2 credence the utility-maximizing strategy.

  **Question 4: The "Honest Note" (Limitations)**
  *   *You must say this:* "This activity simulated **payoff structures**, not **memory loss**."
  *   *The Gap:* In the real Sleeping Beauty problem, the controversy is whether the *indexical information* ("I am awake now") changes the probability *before* we talk about money.
  *   *The Trap:* In our game, you changed your bets because the *rules of payment* changed. A Halfer might argue: "I believed it was 1/2 Heads the whole time! In Round 1, I bet differently because Tails cost double, not because I thought Tails was more likely."
  *   *The Takeaway:* The activity proves that **Rational Action** depends on the settlement rule. It does *not* prove which Credence (1/2 or 1/3) is the "true" metaphysical probability. It shows that the Halfer/Thirder debate is often a disguised debate about **Decision Theory** (Causal vs. Evidential) and **Identity** (Are the two Tails-Beauties one agent or two?).

  ### Instructor's Cheat Sheet for the Board

  | Feature | Round 1 (Per-Awakening) | Round 2 (Per-Experiment) |
  | :--- | :--- | :--- |
  | **Settlement** | Every slip counts. | One slip per coin flip (randomized). |
  | **Risk of Tails** | Double Loss. | Single Loss. |
  | **Optimal Odds** | 2:1 on Heads (Thirder) | 1:1 on Heads (Halfer) |
  | **Philosophical Map** | Evidential Decision Theory | Causal Decision Theory |
  | **The "Self"** | I am a random *awakening*. | I am the *experimenter's subject*. |

  **Final Warning:** If the students ask, "So who is right, Halfer or Thirder?"
  **Your Answer:** "If you care about maximizing tokens per awakening, be a Thirder. If you care about maximizing tokens per experiment, be a Halfer. The question is: Which one represents 'Truth'?"
