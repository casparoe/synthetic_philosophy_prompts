          *   EV = 0.5(X) - 0.5(2X) = -0.5X.
          *   To make EV 0, payoff on Heads must be 2X. Odds 2:1. This aligns with Thirder credence (1/3 prob implies 2:1 odds).
      *   Perfect. The math holds. The activity demonstrates that "Rational Betting Odds" shift even if the Coin doesn't.

      *Wait, one nuance:* In Round 2, if I wake up and bet, I don't know if my bet will be the "chosen" one. But since the *rule* is known beforehand, my strategy *before entering the sleep* determines my behavior.
      *   To make it visceral, the Beauty must decide *at the awakening*.
