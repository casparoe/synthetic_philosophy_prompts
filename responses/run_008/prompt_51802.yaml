  2.  **Deconstruct the Core Philosophical Problem:**
      *   The Sleeping Beauty problem isn't just about $P(Heads)$. It's about how indexical information ("I am awake now") updates credence and how that credence interfaces with decision theory.
      *   The "Halfer" usually argues $P(H) = 1/2$ because the coin is fair and no new *non-indexical* info is gained.
      *   The "Thirder" argues $P(H) = 1/3$ because in the long run, 1/3 of awakenings are Heads.
      *   *Crucial Insight:* The betting argument often conflates the *credence* with the *expected utility*. If you get paid per awakening, Thirding maximizes utility. If you get paid per experiment, Halfer reasoning (or at least different betting odds) might maximize utility. The activity needs to make this distinction visceral.

  3.  **Design the Activity Mechanics:**
      *   **Participants:** 14 students.
      *   **Roles:**
          *   Beauties (Subjects): Need to experience indistinguishable awakenings.
          *   Bookmakers (Bettors): Need to offer odds based on their theory.
