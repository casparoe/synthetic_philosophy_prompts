          5.  *Risk:* They hear each other. *Mitigation:* Stagger start times for different Beauties.

  5.  **Payoff Scheme:**
      *   Tokens = Points/Candy/Extra Credit.
      *   Need to incentivize maximizing tokens.
      *   Odds: Even money (1:1). Bet 10, Win 10.
      *   Condition 1 (Per-Awakening): Tails = 2 bets settled. Heads = 1 bet settled.
      *   Condition 2 (Per-Experiment): Tails = 1 bet settled (randomly chosen or first). Heads = 1 bet settled.

  6.  **Timeline (90 Minutes):**
      *   0-10: Intro & Rules.
      *   10-40: Round 1 (Condition 1: Per-Awakening). Setup, Run, Settle.
      *   40-70: Round 2 (Condition 2: Per-Experiment). Setup, Run, Settle.
      *   70-90: Debrief & Philosophical Connection.
      *   *Critique:* 30 mins per round is tight for physical movement. Need to streamline. Maybe run multiple Beauties in parallel to save time.
      *   *Revised:* 4 Beauties run in parallel. 4 Bookmakers rotate.
      *   0-15: Briefing.
      *   15-45: Round 1 (Parallel execution).
      *   45-75: Round 2 (Parallel execution).
      *   75-90: Debrief.

  7.  **Troubleshooting (Predictable Failures):**
      *   *Cheating:* Counting steps, listening for cues. *Fix:* White noise, varied paths, strict "no talking" rule for admins.
      *   *Voice Recognition:* Bookmakers talk. *Fix:* Bookmakers submit odds on paper, no talking to Beauties.
      *   *Time Tracking:* Watches/phones. *Fix:* Collect all devices.
      *   *Confusion:* Students mixing up the settlement rules. *Fix:* Visual aids, clear contracts.

  8.  **Limitations (The "Honest Note"):**
      *   Real SB involves *forgetting*. Here we have *sensory deprivation*. Students know they are in an experiment. They know the protocol. This changes the "centered world" aspect.
      *   Real SB is about *credence*. This activity measures *betting behavior*. We need to explicitly decouple the two in the debrief (Lewisian Halfer vs. Decision-Theoretic Halfer).

  9.  **Refining the "Settlement" Mechanics:**
      *   To make the philosophical point land, the Bookmakers need to set the odds, or the Beauties need to accept/reject?
      *   Prompt says: "Bookmakers offering bets."
      *   Let's make it: Bookmakers post a price for a "Heads Token". Beauty decides to buy/sell.
      *   Actually, simpler: Beauty states her credence (price she's willing to bet at). Bookmaker takes the other side.
      *   *Better for "feeling the bite":* Beauty has an endowment. She chooses how much to wager on Heads vs Tails.
      *   *Condition 1:* Payoff = Wager * (Number of Awakenings).
      *   *Condition 2:* Payoff = Wager * (1).
      *   This makes the utility calculation explicit.

  10. **Final Polish:**
      *   Ensure the tone is instructional but flexible.
      *   Make sure the "Memory Wipe" is feasible in a standard university setting (2 rooms + hallway).
      *   Emphasize the Debrief questions.

  11. **Self-Correction on "Memory Wipe":**
      *   True amnesia is hard. The standard philosophical workaround is "operational indistinguishability."
      *   I need to be explicit that we aren't wiping memory, we are removing *temporal markers*.
      *   Key constraint: If a student is a Beauty in Round 1, they shouldn't be a Beauty in Round 2 immediately if they can compare notes. Better to swap roles completely.
      *   Actually, with 14 students:
          *   Group A (5 students): Beauties Round 1, Bookmakers Round 2.
          *   Group B (5 students): Bookmakers Round 1, Beauties Round 2.
          *   Group C (4 students): Admin/Auditors (Swap too).
      *   This ensures everyone experiences both sides.

  12. **Writing the Plan:** (Drafting the response following the structure derived above).
      *   *Check:* Did I address the settlement conditions clearly? Yes.
      *   *Check:* Did I address the cheating? Yes.
      *   *Check:* Did I address the limitation? Yes.

      *(Self-Correction during drafting)*: Wait, if the Bookmaker offers the bet, do they know the settlement rule? Yes, everyone knows the rule *ex ante*. The point is that the *optimal strategy* changes.
      *   Round 1: Optimal bet reflects 1/3 credence (because Tails costs double).
      *   Round 2: Optimal bet reflects 1/2 credence (because Tails costs single).
      *   Wait, does Round 2 reflect 1/2? If I bet on Heads.
          *   Heads (50%): I wake once. Bet counts. Win $X.
          *   Tails (50%): I wake twice. Bet placed twice. Only one counts. Lose $X.
          *   EV = 0.5(X) + 0.5(-X) = 0.
          *   So fair odds are 1:1. This aligns with Halfer credence.
      *   Round 1:
          *   Heads (50%): Wake once. Win $X.
