              *   **Round A (Thirder-Friendly):** You bet when you wake. If you win, you get tokens *now*. If Tails, you wake twice, bet twice, win/lose twice.
              *   **Round B (Halfer-Friendly):** You bet when you wake. You record the bet. At the end of the *experiment* (coin resolution), we settle. If Tails, we take the *average* of your two bets, or we randomly select one awakening to count. Let's go with "Randomly select one awakening's bet to settle" to keep the expected value calculation clean. Or even simpler: "The bet is on the Coin, not the Awakening." If you bet on Heads, and it's Heads, you win once. If it's Tails, you lose once (even though you bet twice).
              *   *Wait, the prompt says:* "only one bet per experiment counts." This implies if I bet on Heads both times, and it's Tails, I lose once. If I bet on Heads both times and it's Heads, I win once. This neutralizes the "double loss" risk of Tails.

  4.  **Drafting the Logistics (The "Memory Wipe"):**
      *   *Constraint:* 14 people, couple of rooms.
      *   *Solution:* Use the "Blindfold + Escort" method.
      *   *Beauties:* Wait in a "Green Room" (neutral). When called, blindfolded, headphones on (noise cancelling or white noise), escorted to "Red Room" (Awakening). Make bet. Blindfolded, escorted back to Green Room or to "Blue Room" (Waiting for potential 2nd awakening).
