  # Diagnostic Decision Tree: Moral Judgments & Positions

  **Preamble: Why These Cases?**
  This instrument sorts your intuitive judgments into philosophical positions without using theoretical terminology. We begin with the **Standard Trolley** (redirecting a threat away from five toward one) as a fixed baseline: you accept that causing harm for a greater good is *sometimes* permissible. The **Footbridge** tests whether you distinguish between *redirecting* a threat and *using* a person as a tool. The **Bomber Pair** (Strategic vs. Terror) tests whether *intention* matters to you, or only outcomes. Finally, the **Loop/Craniotomy** cases test whether *causal necessity* (the death is required for the save) overrides intention. Your path reveals your operational ethics.

  ***

  ### THE TREE

  **START:** You hold that harming one to save many is **sometimes permissible** (e.g., Standard Trolley is Permissible).

  **NODE 1: The Footbridge Case**
  *A runaway tram will kill five. You can push a large stranger off a footbridge to stop it. He will die; the five will live.*
  *   **Permissible?** → Go to **NODE 2A**
  *   **Impermissible?** → Go to **NODE 2B**

  **NODE 2A (Footbridge: Permissible)**
  **The Terror Bomber Case**
  *An enemy will kill many unless demoralized. You can bomb civilians solely to break their morale (deaths are the means). The war ends; many are saved.*
  *   **Permissible?** → **LEAF 1: Unrestricted Consequentialism**
  *   **Impermissible?** → **LEAF 2: Threshold/Mixed View** *(See Caveats)*

  **NODE 2B (Footbridge: Impermissible)**
  **The Strategic Bomber Case**
  *An enemy will kill many unless their munitions are destroyed. You bomb the factory. Civilian deaths are foreseen but not intended (side effects). The war ends; many are saved.*
  *   **Impermissible?** → **LEAF 3: Means-Based View** *(See Caveats)*
  *   **Permissible?** → Go to **NODE 3**

  **NODE 3 (Strategic: Permissible)**
  **The Loop / Craniotomy Case**
  *Loop: A tram heads for five. You divert it onto a side track where one person stands. Their body will stop the tram, saving the five, but killing them.*
  *OR*
  *Craniotomy: A pregnant woman will die unless the fetus's skull is crushed to pass. The death is the instrument of saving the mother.*
  *   **Permissible?** → **LEAF 4: Plain Doctrine of Double Effect**
  *   **Impermissible?** → **LEAF 5: Refined Doctrine of Double Effect**

  ***

  ### ANSWER KEY

  | Leaf | Position | Core Commitment |
  | :--- | :--- | :--- |
  | **1** | **Unrestricted Consequentialism** | Outcomes determine permissibility; means and intentions are irrelevant. |
  | **2** | **Threshold/Mixed View** | Aggregation is sometimes okay (Footbridge), but specific rights trump utility (Terror Bomber). |
  | **3** | **Means-Based View** | Killing innocents is impermissible regardless of intention (no intended/foreseen distinction). |
  | **4** | **Plain Doctrine of Double Effect** | Intention matters; causal necessity (Loop) does not invalidate permissibility if harm is not intended. |
  | **5** | **Refined Doctrine of Double Effect** | Intention matters; one must not *rely* on the harm (double intention), even if not directly aimed at. |

  ***

  ### FLAGS & CAVEATS

  **1. The Loop Boundary (Leaf 4 vs. Leaf 5):**
  This tree cannot cleanly separate Plain DDE from Refined DDE for students who find the Loop case difficult. Philosophers disagree on whether the Loop case is permissible under the standard Doctrine of Double Effect. Some argue the death is merely foreseen (Plain DDE); others argue the agent *relies* on the death, violating a requirement of double intention (Refined DDE). If you land on this boundary, this reflects a **genuine indeterminacy in the philosophical positions themselves**, not a defect in your judgment. You should treat this as an invitation to refine your definition of "intention."

  **2. Verdicts vs. Reasons (Leaf 3 vs. Leaf 4/5):**
  The tree sorts by *judgments*, not *reasons*. A student might reach Leaf 4 (Plain DDE) by judging Strategic Bombing permissible, but believe it is permissible because rights are not violated, not because the harm was foreseen rather than intended. Conversely, a student at Leaf 3 (Means-Based) might forbid Strategic Bombing because they reject killing innocents entirely, not because they lack the intended/foreseen distinction. If your *reasons* for your answers differ from the "Core Commitment" listed in the Key, trust your reasons. The tree identifies your *extensional* view; lecture will address the *intensional* justification.

  **3. The Mixed View (Leaf 2):**
  Judging Footbridge permissible but Terror Bombing impermissible is theoretically unstable for standard Consequentialism. If you land here, you likely hold a **Threshold Deontological** view (rights can be overridden by enough good, but terror tactics cross a specific line). This is a coherent position, but it requires more nuance than the standard labels provide.
