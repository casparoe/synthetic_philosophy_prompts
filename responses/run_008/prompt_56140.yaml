answer: |-
  # State of the Dispute: Demandingness and Agent-Centered Prerogatives
  **Authors:** [Name 1] & [Name 2]  
  **Department:** Philosophy  
  **Date:** October 2023

  ## 1. Agreed Claims
  *We begin by isolating the common ground. These are substantive claims required to frame our disagreement, excluding vacuous platitudes about the importance of morality.*

  1.  **Empirical Constraints are Real but Normatively Neutral:** We agree that human motivational capacity is finite and that burnout is a genuine empirical risk. We further agree that these facts alone do not settle normative questions; a moral theory can be true even if humans struggle to follow it, though a theory that universally fails to guide action may be pragmatically defective.
  2.  **The Baseline of Obligation:** We agree that the "Shallow Pond" intuition (that one must sacrifice minor comforts to prevent severe harm) is binding. Our dispute does not concern the existence of *some* demanding obligations, but rather the limit point where obligation ceases and supererogation (or permissible self-interest) begins.
  3.  **Non-Ideal Theory Increases Burden:** We agree that in a world where others do not comply with moral demands, the burden on compliant agents increases. We disagree on whether morality permits agents to refuse this increased burden based on fairness considerations.
  4.  **Blame is Multi-Dimensional:** We agree that "blame" is not a univocal concept. It encompasses (i) the judgment that an act was wrong, (ii) the appropriateness of social sanction, and (iii) the internal emotional response of the agent. Our dispute partly concerns which of these dimensions the Demandingness Objection targets.

  ## 2. Map of Disagreements
  *The following table isolates specific points of contention. For each row, we provide phrasing that each side can endorse without conceding the core argument, identify the theoretical crux, propose a test case or argument we both accept as relevant, and state our divergent predictions.*

  | # | Topic | Consequentialist Position (Phrasing Accepted by Author 1) | Prerogative Position (Phrasing Accepted by Author 2) | The Crux | Agreed Test Case / Evidence | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Taxonomy of the Objection** | The Demandingness Objection is primarily about **(c) Alienation**: a theory that excludes personal projects fails to respect the agent's integrity. Disagreements about (b) Blame are derivative of this. | The Demandingness Objection robustly targets **(b) Blame** as well as (c) Alienation. It is not merely that the theory is alienating, but that it is *incorrect* to blame/sanction agents for prioritizing personal projects. | **Is blame internal or external?** Is the inappropriateness of blame a sign the theory is wrong (Prerogative), or a sign our social practices need to align with the theory (Consequentialist)? | **The "Saturday Shelter" Case:** An agent works all week, skips the shelter on Saturday to paint. <br> *Question:* Is the agent *wrong* (even if unblamable), or *permitted*? | **Consequentialist:** We will agree the act is suboptimal/wrong, but dispute the utility of blame.<br>**Prerogative:** We will agree the act is permitted, making blame inappropriate. |
  | **2** | **Compliance & The Many-Hands Dividend** | As the number of agents ($N$) grows, each agent's marginal share of fixed need shrinks ($1/N$). Therefore, demandingness complaints should weaken in large populations; the "slack" per person is negligible. | As $N$ grows, the probability of collective non-compliance rises. The "slack" that falls to compliers becomes unpredictable and potentially catastrophic. Therefore, demandingness complaints strengthen in large populations. | **Does fairness cap duty?** Does an agent's duty track the *fair share* (what others *should* do) or the *effective share* (what is needed given what others *actually* do)? | **The "Threshold Public Good" Model:** A scenario where a specific good is produced only if $X$ amount is contributed, and current contributions are at $X/2$. | **Consequentialist:** In large $N$, my marginal cost to bridge the gap is tiny; the objection loses force.<br>**Prerogative:** In large $N$, the risk of being the "sucker" who bridges the gap alone is higher; the prerogative to opt out is stronger. |
  | **3** | **Criterion vs. Decision Procedure** | The objection targets the **Decision Procedure**. Consequentialism is the Criterion of Rightness (what makes acts right); the objection shows it is a poor heuristic for daily deliberation. | The objection targets the **Criterion of Rightness**. A theory that defines "Right" in a way that systematically alienates agents is flawed as a definition of Right, not just as a heuristic. | **Livability as Truth-Condition.** Can a moral theory be "true" if it is humanly unlivable? Or does "true" apply only to the abstract ranking of states of affairs? | **The "Archangel vs. Prophet" Distinction:** Separating the perspective of an omniscient evaluator from the perspective of a deliberating human agent. | **Consequentialist:** If we separate criterion/procedure, the objection loses most of its bite.<br>**Prerogative:** Even if separated, a criterion that demands the impossible/undesirable is normatively defective. |
  | **4** | **Moral Residue & Guilt** | Feelings of guilt/regret after choosing personal projects are **psychological responses to suboptimality**. There is no normative "residue" beyond the fact that a better act was available. | Feelings of guilt/regret reflect **Normative Agent-Regret**. There is a normative residue (an "owed apology" to the world) even when the agent acted within their prerogative. | **Verbal or Substantive?** Is this disagreement solely about the definition of "blameworthy/residue," or does it track a real difference in normative structure? | **The "Apology Test":** If the agent apologizes for not saving the distant stranger, is the apology (a) mistaken/irrational, or (b) appropriate/fitting? | **Consequentialist:** We will conclude this is largely a **verbal dispute** over "blame." Once defined, the residue vanishes.<br>**Prerogative:** We will conclude this is a **substantive dispute**. Even with clear definitions, the residue remains. |

  ## 3. Methodological Note on Disagreement Row 4
  *Regarding the "Guilt/Residue" dispute (Row 4), we explicitly flag the possibility that this is a verbal disagreement. We agree that if we can stipulate a definition of "blameworthy" that satisfies both sides (e.g., separating "normative wrongness" from "appropriate emotional response"), this row may dissolve. If it does not dissolve under stipulation, we agree the dispute is substantive regarding the nature of moral regret.*

  ## 4. Next Steps for Collaboration
  *To move beyond this document, we commit to the following:*
  1.  **Formalize the Many-Hands Model:** We will attempt to model the "Many-Hands Dividend" mathematically to see if the divergence in Prediction (Row 2) holds under formalization.
  2.  **Stipulation Exercise:** For Row 4, we will draft two versions of the "Residue" claim: one using purely psychological vocabulary and one using purely normative vocabulary, to test for verbal dispute.
  3.  **Case Selection:** We will avoid further discussion of the "Shallow Pond." Future examples must involve high-stakes, long-term commitment (e.g., career choice, organ donation) where the "Alienation" objection is strongest.
