answer: |-
  Dear Colleague,

  It is a pleasure to engage with someone who brings the sensible skepticism of a modeler to these philosophical debates. Your intuition about underdetermination is sharp, and frankly, it is a worry that keeps many decision theorists up at night. You are asking whether Expected Utility theory and Risk-Weighted Expected Utility are merely rival parametrizations of the same data, like fitting a linear model versus a log-linear model to a noisy seismogram where both achieve a comparable sum of squared errors. I am quite confident that your suspicion holds water if we restrict our view to a very narrow set of choices, say, a handful of binary gambles with fixed probabilities. In that limited domain, you can indeed often massage a concave utility function in Expected Utility theory to mimic the choices generated by a linear utility function with a convex risk-weighting function in Buchak's framework. If all you have is a few data points, the models are observationally equivalent, and the fight is purely metaphysical.

  However, I am fairly confident that the two theories diverge significantly once you expand the dataset to include how preferences shift when probabilities change while outcomes remain fixed. The core structural difference lies in the Independence Axiom. In standard Expected Utility theory, if you prefer gamble A to gamble B, you must still prefer a mixture of A and some common gamble C to a mixture of B and that same C. This is a rigid constraint on how preferences behave when you introduce common consequences. A person whose risk aversion lives entirely in the utility curve will never violate this; their relative valuation of two outcomes is determined solely by the ratio of their probabilities and the curvature of utility, independent of the rest of the gamble. By contrast, a person whose risk aversion lives in the probability weights, as Buchak proposes, will systematically violate Independence. They might prefer A to B in isolation, but when both are mixed with a common bad outcome, the weighting function applies differently to the cumulative probabilities, potentially flipping the preference to B over A. This is not just a redescription; it is a different prediction about how choices transform under probability shifts.

  To make this concrete for you, imagine an experiment where we offer subjects a choice between a sure thing and a risky gamble, and then we offer a choice between two risky gambles that share a common component. The Expected Utility agent treats the common component as cancelable noise; it drops out of the calculation. The Risk-Weighted agent does not cancel it out because the risk function operates on the cumulative distribution of outcomes. If you take a person who fits the Expected Utility model, they will display a consistent risk premium across these shifts that is explainable solely by outcome magnitudes. The Risk-Weighted agent will display a risk premium that fluctuates based on the probability structure itself, even if the outcomes are identical. There have been experiments, often stemming from the Allais Paradox literature, that test exactly this. The data overwhelmingly shows that real humans violate Independence in the specific patterns Buchak's theory predicts, whereas standard Expected Utility theory requires us to say the subjects are simply irrational or that their utility function magically changed between questions. I am very confident that the behavioral data supports the descriptive superiority of Risk-Weighted models over standard Expected Utility for human subjects.

  Where the debate gets thornier is on the normative front, specifically regarding money pumps. You asked if there is a setup to force them apart. The standard money pump argument exploits Independence violations. If you violate Independence, a clever bookie can construct a series of trades that leaves you worse off than where you started. Buchak argues that her theory avoids this because the value of a gamble is context-dependent in a way that blocks the pump, but many economists remain unconvinced. Here I must flag that I am on shakier ground. The literature on whether Risk-Weighted Expected Utility is genuinely vulnerable to dynamic money pumps or whether Buchak's defense holds water is technically dense and still somewhat contested. My least confident point in this entire letter is the claim that there is a settled consensus on whether Buchak's theory is immune to dynamic inconsistency arguments; I suspect the final word on whether this constitutes a fatal flaw or a manageable feature has not yet been written.

  Returning to your underdetermination hunch, I think you are right to feel that much of the debate is verbal if one ignores the dynamic implications. If we treat agents as static choice machines producing one-off decisions, the models can often be tuned to match. But if we treat them as systems navigating a world of changing probabilities and compound risks, the models pull apart. The Expected Utility agent sees risk as a property of the goods; the Risk-Weighted agent sees risk as a property of the uncertainty itself. This distinction matters when you start asking counterfactuals about how the agent would behave if the odds changed slightly. The Expected Utility agent's behavior is constrained by linearity in probabilities; the Risk-Weighted agent's is constrained by the shape of the risk function. You can distinguish them by checking whether the agent's willingness to pay to avoid risk scales linearly with probability changes. If it doesn't, and if the violation follows the specific curvature of a weighting function rather than a utility function, you have identified the REU agent.

  So, to answer your suspicion directly: you are not confused, but your worry applies more to static fitting than to structural prediction. In a limited domain, yes, it is a redescription. Across the full domain of possible gambles, it is a rivalry with empirical teeth. I am reasonably confident that if you sat down with a dataset of choices varying both stakes and probabilities, you could statistically distinguish the two models much like you would distinguish between two velocity models in tomography, provided the data is rich enough. The Risk-Weighted model has more parameters, yes, but it captures covariance in the choices that the Expected Utility model simply cannot fit without assuming the agent is inconsistent.

  I hope this helps clarify the landscape for you. It is a field that benefits greatly from people who understand that models are maps, not territories, and who know when a map is just a different projection of the same ground versus when it claims there is a mountain where the other says there is a valley. Please feel free to write back if you want to dig deeper into the dynamic consistency arguments, though I must warn you that my certainty fades there.

  Warmly,

  Your Correspondent
