prompt: |-
  I am a final-year PhD student in computational biology, and my department's wet-lab groups bring us sequencing data from small studies — a dozen tumour samples here, thirty patients there — and the recurring argument is always the same: how many entities should the model posit? Is the variant-allele-frequency pattern better explained by two tumour subclones or three? Should the methylation profiles be clustered into four groups or five? Does a modest correlation across time points warrant a latent factor, or is it noise with a face on it? At present the answer is settled by whoever argues hardest, or by whatever cutoff is the software default, and reviewers rightly push back. My own reading leads me to believe the relevant resource is the Occam's-razor tradition running through Solomonoff induction, Kolmogorov complexity, and minimum description length: the idea that a model is a code for the data, that complexity must be paid for in bits of description length, and that the fit-versus-complexity trade-off can in principle be made principled rather than a matter of taste. But I cannot ask my collaborators to run a mixture over all computable hypotheses, and half the relevant quantities are uncomputable or inestimable at our sample sizes in any case.

  Please write a decision procedure my group could actually follow when choosing among models of differing complexity. It should set out the questions in order, what counts as a sufficient answer to each, where the procedure terminates with a plain instruction not to posit the extra component, and where it must hand the decision to a person because the question is one of scientific values — interpretability, downstream clinical use, what a reviewer will accept — rather than of compression. It should be honest about the gap between the ideal theory and anything computable in an afternoon: in particular about the points at which the description length of a hypothesis is a judgement call dressed up as a number — the coding of priors over parameters, the choice of language in which the model is described, the fact that Kolmogorov complexity is only defined up to an additive constant that no finite experiment can dwarf. Where the theory cannot deliver, the procedure should say so rather than manufacture false precision.

  Then run the procedure on two cases drawn from our recent work: (a) variant allele frequencies across forty loci in a single tumour biopsy, where a three-subclone model improves the fit only marginally over two; and (b) clustering RNA-seq profiles from twenty-eight patients into four versus five groups, where the fifth group consists of five samples and would be biologically interesting if real. Include at least one run in which the procedure returns the answer the collaborator will not like — for instance, refusing to license the subclone that the postdoc's favourite mechanistic story requires — and say what, if anything, the postdoc could legitimately do about it within the procedure rather than by overriding it.

  Finally, state plainly what the procedure cannot do: the situations in which two researchers following it in good faith could still reach different conclusions, the class of errors it is structurally blind to (for example, a shared misspecification that makes the wrong simple model compress well), and what evidence from outside the dataset would be needed to settle the residual disagreements.

  Constraints: the procedure must be executable by a wet-lab postdoc with R and a spreadsheet in under an hour per analysis; it may not presuppose sample sizes at which asymptotic or consistency arguments bite; and each step should be marked as either derived, estimated, or asserted outright.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Final-year PhD student in computational biology.
      *   **Problem:** Recurring arguments in the group about model complexity (how many subclones, clusters, latent factors?). Current methods are ad-hoc (arguing hardest, software defaults).
      *   **Theoretical Basis:** Occam's razor, Solomonoff induction, Kolmogorov complexity, Minimum Description Length (MDL).
      *   **Constraint 1 (Practicality):** Must be executable by a wet-lab postdoc with R and a spreadsheet in under an hour. No asymptotic assumptions (small $N$).
      *   **Constraint 2 (Honesty):** Must acknowledge the gap between ideal theory (uncomputable Kolmogorov complexity) and practice (approximations, priors, coding choices). Must distinguish between statistical questions and scientific value judgments.
      *   **Constraint 3 (Output):** A decision procedure (step-by-step), applied to two specific cases (VAF subclones, RNA-seq clustering), including a "unpopular" outcome. Finally, a statement of limitations.
      *   **Constraint 4 (Labeling):** Each step must be marked as *Derived*, *Estimated*, or *Asserted*.

  2.  **Deconstruct the Theory vs. Practice Gap:**
      *   *Ideal:* Minimize $L(H) + L(D|H)$ (Model length + Data given Model length).
      *   *Reality:* We can't calculate true Kolmogorov complexity. We use approximations like BIC, AIC, or cross-validation. But BIC/AIC rely on asymptotics ($N \to \infty$), which the prompt explicitly says we can't assume (small studies: 12 samples, 30 patients).
      *   *Solution:* Use a pragmatic MDL-inspired approach. Instead of pure BIC, use a "Penalized Likelihood" approach where the penalty is explicit and discussed. We need to separate the *statistical evidence* (does the data support it?) from the *scientific utility* (do we care?).
      *   *Key Insight:* The "additive constant" problem in Kolmogorov complexity means that for small data, the choice of encoding (prior) dominates. We must make this explicit.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* A flowchart-like text.
      *   *Steps:*
          1.  Define the competing models ($M_k$ vs $M_{k+1}$).
          2.  Calculate Fit (Likelihood/Residuals).
          3.  Calculate Complexity Penalty (not just parameter count, but "cost" of new entity).
          4.  Compare (The "Bit Budget").
          5.  Check Stability (Small $N$ sensitivity).
          6.  Scientific Utility (The "Human" step).
      *   *Labeling:* Need to tag steps as Derived (from theory), Estimated (from data/approx), or Asserted (group policy).
      *   *Time Limit:* Must be doable in R/Spreadsheet in < 1 hour. So, no MCMC running for days. Use quick approximations (e.g., BIC-like but adjusted, or bootstrap).

  4.  **Refining the Procedure for Small $N$:**
      *   Standard BIC is $\ln(N) \cdot k$. For $N=30$, $\ln(30) \approx 3.4$. This is a weak penalty compared to asymptotic settings.
      *   Better approach for small $N$: **Predictive Performance** (Cross-Validation) or **Parametric Bootstrap**. But CV is unstable with $N=28$.
      *   Let's stick closer to the MDL spirit: *Two-Part Code*.
      *   Part 1: Cost to describe the model parameters (Precision matters).
      *   Part 2: Cost to describe the residuals.
      *   *Practical Proxy:* AICc (Corrected AIC for small sample sizes) is the standard statistical tool here. It approximates MDL for finite samples.
      *   *Addition:* A "Stability Check" (bootstrap) to see if the extra component appears consistently.
      *   *Addition:* A "Value Check" for the human element.

  5.  **Developing the Two Cases:**
      *   *Case A (VAFs):* 40 loci, 1 biopsy. 2 vs 3 subclones. Fit improvement marginal.
          *   *Expected Outcome:* Reject 3 subclones. (The "unpopular" result).
          *   *Reasoning:* Penalty outweighs marginal gain. Stability low.
      *   *Case B (RNA-seq):* 28 patients. 4 vs 5 clusters. 5th cluster has 5 samples. Biologically interesting.
          *   *Expected Outcome:* Ambiguous statistically, but pass to "Scientific Utility".
          *   *Reasoning:* Statistical evidence might be weak, but the cost of missing a subtype is high (clinical value).

  6.  **Addressing the "Postdoc's Favorite Story" (Case A):**
      *   If the procedure says "No," what can the postdoc do?
      *   They can't override the stats. They *can* propose a different *model class* (not just $k=3$, but a different structure) or gather *external data* (orthogonal validation). They cannot just claim $k=3$ based on the current data.

  7.  **Addressing Limitations:**
      *   Model misspecification (both models wrong).
      *   Prior dependence (the "additive constant").
      *   Scientific values differ between researchers.

  8.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the theoretical ideal vs. practical constraint.
      *   *The Procedure:* 5 Steps.
          1.  Define Hypotheses.
          2.  Compute Fit (Log-Likelihood).
          3.  Compute Penalty (AICc as MDL proxy).
          4.  Stability Check (Bootstrap).
          5.  Value Judgment (Cost of Error).
      *   *Case Studies:* Apply the steps rigorously.
      *   *Limitations:* Honest assessment of failure modes.

      *Self-Correction on Labeling:* Ensure every step has [Derived], [Estimated], or [Asserted].
      *Self-Correction on Time:* Ensure calculations are simple (AICc is formulaic, Bootstrap needs to be limited, e.g., 200 iterations).

      *Refining the MDL connection:* I need to be careful not to claim AICc *is* MDL. It's an approximation. I will frame it as "The Computable Proxy." The "Asserted" parts will be the group's agreement on what counts as a "cost."

      *Refining the "Unpopular Outcome":* In Case A, the postdoc wants 3 subclones. The math says 2. The procedure must block 3. The postdoc's recourse is *new data*, not *new arguments*.

  9.  **Final Review against Constraints:**
      *   Executable by wet-lab postdoc? Yes (AICc + simple bootstrap).
      *   Under 1 hour? Yes.
      *   Small sample size aware? Yes (AICc specifically).
      *   Honest about uncomputability? Yes (in the intro and limitations).
      *   Labels included? Yes.
      *   Two cases run? Yes.
      *   Limitations stated? Yes.

  10. **Writing the Response:** (Proceeding to generate output based on this structure.)
      *   *Tone:* Professional, rigorous, empathetic to the wet-lab/computational friction.
      *   *Formatting:* Clear headings, bullet points, bold text for decisions.

  *(Self-Correction during drafting)*: I initially thought about suggesting BIC. But BIC assumes $N$ is large enough for the penalty $\ln(N)$ to dominate. With $N=28$, AICc is generally preferred for predictive accuracy, though MDL purists might argue for specific coding lengths. Given the "R and Spreadsheet" constraint, AICc is the most robust *available* tool that approximates the trade-off without requiring custom coding of codelengths. I will explicitly state this approximation.

  *(Refining the "Asserted" steps)*: The threshold for "Stability" needs to be a group policy. E.g., "If the extra cluster appears in <70% of bootstraps, it's noise." This is an *Asserted* value, not derived.

  *(Refining the "Scientific Value" step)*: This is where the "Human" decision happens. It must be explicit that this is *not* statistics anymore.

  Let's assemble.
answer: |-
  # The Finite-Sample Model Selection Protocol (FSMSP)

  ## Preamble: Theory vs. Tool
  You are correct that Solomonoff induction and true Minimum Description Length (MDL) provide the theoretical ceiling for this problem. They define the ideal: minimize $L(H) + L(D|H)$, the bits to describe the hypothesis plus the bits to describe the data given the hypothesis. However, Kolmogorov complexity is uncomputable, and the "additive constant" (the choice of universal Turing machine, or in practice, the coding language and priors) dominates the signal when $N$ is small.

  This protocol does not claim to compute truth. It claims to **standardize the cost of complexity**. It forces the group to agree on the "exchange rate" between fit and complexity before looking at the specific data, preventing post-hoc rationalization. It separates statistical evidence from scientific utility.

  **Constraints:** Executable in R/Spreadsheet. Time limit: 60 minutes. Sample sizes: $N < 50$.

  ---

  ## Part 1: The Decision Procedure

  ### Step 1: Define the Competing Codes
  Explicitly write down the two models being compared: $M_{simple}$ (e.g., 2 subclones) and $M_{complex}$ (e.g., 3 subclones).
  *   **Action:** List the number of free parameters ($k$) for each.
  *   **Label:** [Derived] (Counting parameters is mathematical).
  *   **Constraint:** You may not add constraints to $M_{complex}$ to reduce $k$ after seeing the fit (e.g., tying variances) unless justified by biology *a priori*.

  ### Step 2: Compute the Fit (The Data Length)
  Calculate the maximized log-likelihood ($\hat{L}$) for both models on the observed data.
  *   **Action:** Run the optimization. Record $\ln(\mathcal{L}_{simple})$ and $\ln(\mathcal{L}_{complex})$.
  *   **Label:** [Estimated] (Depends on optimization convergence).
  *   **Check:** If the optimization for $M_{complex}$ fails to converge or hits boundaries, **STOP**. Default to $M_{simple}$. The data cannot support the complexity.

  ### Step 3: Compute the Penalty (The Model Length)
  Do not use BIC (assumes $N \to \infty$). Use **AICc** (Corrected Akaike Information Criterion), which approximates MDL for small sample sizes by penalizing parameter count relative to $N$.
  *   **Formula:** $\text{AICc} = 2k - 2\ln(\hat{L}) + \frac{2k(k+1)}{N - k - 1}$
  *   **Action:** Calculate $\Delta\text{AICc} = \text{AICc}_{simple} - \text{AICc}_{complex}$.
  *   **Label:** [Derived] (Formula is fixed).
  *   **Decision Rule:**
      *   If $\Delta\text{AICc} < 2$: The complex model is not worth the bits. **Select $M_{simple}$.**
      *   If $\Delta\text{AICc} > 10$: Strong evidence for $M_{complex}$. Proceed to Step 4.
      *   If $2 \le \Delta\text{AICc} \le 10$: Ambiguous zone. Proceed to Step 4.

  ### Step 4: Stability Check (The Robustness Tax)
  Small samples are noisy. A complex model might fit *this* noise, not the signal.
  *   **Action:** Perform a parametric bootstrap (200 iterations). Simulate data from $M_{simple}$, fit both models, check how often $M_{complex}$ wins by the Step 3 criterion.
  *   **Label:** [Estimated] (Monte Carlo approximation).
  *   **Decision Rule:**
      *   If $M_{complex}$ wins in $< 70\%$ of bootstraps: The signal is too fragile. **Select $M_{simple}$.**
      *   **Label:** [Asserted] (The 70% threshold is group policy, not math).

  ### Step 5: The Value Judgment (The Human Override)
  If Steps 3 and 4 support $M_{complex}$, or if Step 3 was ambiguous but Step 4 was stable, you must justify the *utility* of the extra entity.
  *   **Action:** Answer two questions:
      1.  **Actionability:** Does positing this entity change a clinical decision or a downstream experiment? (Yes/No)
      2.  **Falsifiability:** Can we test this specific entity with orthogonal data (e.g., FISH, targeted PCR) within 6 months? (Yes/No)
  *   **Label:** [Asserted] (Scientific values, not statistics).
  *   **Decision Rule:**
      *   If **No** to both: **Select $M_{simple}$.** Do not clutter the literature with untestable entities.
      *   If **Yes** to either: You may posit $M_{complex}$, but it must be labeled "Hypothetical" in the manuscript, not "Identified."

  ---

  ## Part 2: Case Studies

  ### Case A: Variant Allele Frequencies (VAFs)
  **Context:** 40 loci, 1 biopsy. Comparing 2-subclone ($M_2$) vs. 3-subclone ($M_3$) model.
  **Stakeholder:** Postdoc has a mechanistic story requiring a third minor subclone to explain resistance.

  **Execution:**
  1.  **Define:** $M_2$ has 5 params (2 freqs, 2 VAFs, 1 noise). $M_3$ has 8 params. $N=40$ (loci).
  2.  **Fit:** $\ln(\mathcal{L}_2) = -120.5$; $\ln(\mathcal{L}_3) = -118.0$. (Marginal improvement).
  3.  **Penalty:**
      *   $\text{AICc}_2 \approx 2(5) - 2(-120.5) + \text{small correction} = 251.0$
      *   $\text{AICc}_3 \approx 2(8) - 2(-118.0) + \text{larger correction} = 252.5$
      *   $\Delta\text{AICc} = 251.0 - 252.5 = -1.5$.
      *   **Result:** Negative. $M_2$ is preferred.
  4.  **Stability:** (Skipped, as Step 3 already rejected $M_3$).
  5.  **Value:** (Skipped, statistical evidence insufficient).

  **Outcome:** **Reject the 3-subclone model.**
  **The Unpopular Result:** The postdoc cannot publish the third subclone as a finding.
  **Legitimate Recourse:** The protocol does not ban the *idea*, it bans the *claim of inference from this data*. The postdoc may:
  1.  Collect more data (more loci or multi-region sampling) to increase $N$.
  2.  Propose the third subclone as a *prediction* of the 2-subclone model's residuals (e.g., "unexplained variance suggests..."), subject to Step 5's orthogonal validation requirement.
  3.  **Illegitimate:** Arguing that "AICc is too conservative" without pre-agreed evidence.

  ### Case B: RNA-seq Clustering
  **Context:** 28 patients. Comparing 4 clusters ($M_4$) vs. 5 clusters ($M_5$).
  **Stakeholder:** Clinician wants to know if the 5th group (5 patients) is a distinct high-risk subtype.

  **Execution:**
  1.  **Define:** Gaussian Mixture Models. $M_4$ vs $M_5$.
  2.  **Fit:** $M_5$ improves log-likelihood significantly.
  3.  **Penalty:** $\Delta\text{AICc} = 4.5$. (Ambiguous zone: $2 < 4.5 < 10$).
  4.  **Stability:** Bootstrap (200 reps). $M_5$ wins in 85% of simulations.
      *   **Result:** Statistically stable, though not overwhelming.
  5.  **Value:**
      *   **Actionability:** Yes. If real, these 5 patients get a different drug.
      *   **Falsifiability:** Yes. IHC staining for a marker enriched in these 5 samples can be done in 3 months.

  **Outcome:** **Posit $M_5$, but label "Hypothetical Subtype".**
  **Reasoning:** The statistical evidence is "weak but stable," but the *cost of a False Negative* (missing a treatable subtype) outweighs the *cost of a False Positive* (wasting time on IHC). This is a Step 5 override based on clinical utility, explicitly acknowledged as a value judgment, not a statistical fact.

  ---

  ## Part 3: Limitations and Blind Spots

  This procedure is a tool for arbitration, not a oracle for truth. Researchers following it in good faith may still disagree for the following reasons:

  **1. The "Shared Misspecification" Blind Spot**
  *   **Problem:** Both $M_{simple}$ and $M_{complex}$ might be wrong. For example, if the data is generated by a continuous process but we force discrete clusters, MDL will simply pick the "least bad" discrete code.
  *   **Consequence:** We may confidently select 2 subclones when the truth is a continuum.
  *   **Required Evidence:** Posterior predictive checks (visual inspection of residuals). If residuals show structure, the *model class* is wrong, not just the complexity. This requires human inspection, not a formula.

  **2. The Prior Dependence (The Additive Constant)**
  *   **Problem:** AICc assumes flat priors over parameters. If the group believes biologically that 3 subclones are rare (informative prior), AICc is too lenient. If we believe they are common, AICc is too harsh.
  *   **Consequence:** Two groups with different biological priors will calculate different "effective" description lengths.
  *   **Required Evidence:** Explicit sensitivity analysis. "If we assume a prior penalty of X bits for a new clone, does the decision flip?" If yes, the data is insufficient, and the decision rests on the prior, which must be stated as an assumption, not a result.

  **3. The "Small N" Asymptotic Lie**
  *   **Problem:** Even AICc is an approximation. With $N=12$, the variance of the AICc estimate itself is high.
  *   **Consequence:** A $\Delta\text{AICc}$ of 3 in a study of 12 patients is not the same as a $\Delta\text{AICc}$ of 3 in a study of 100.
  *   **Required Evidence:** Acknowledgement in text. "Model selection is underpowered; conclusions are provisional."

  **4. Divergent Scientific Values**
  *   **Problem:** Step 5 relies on consensus about "Actionability." A computational biologist might value prediction accuracy; a clinician might value specificity.
  *   **Consequence:** One researcher sees a "Hypothetical Subtype" worth testing; another sees "Overfitting."
  *   **Resolution:** The protocol forces this disagreement into the open at Step 5. It prevents the computational researcher from hiding behind "the math says 5 clusters" when the real reason is "I want to find something new."

  ## Summary Instruction for the Group
  Print this protocol. When a disagreement arises, do not argue about the biology first. Run Steps 1–4.
  *   If the math says **No**, the burden of proof shifts entirely to Step 5 (Utility).
  *   If Step 5 cannot justify the cost, the extra entity is **noise**, regardless of how good a story it tells.
  *   If the math says **Yes**, but Step 5 says "So What?", the entity is **academic**, not biological.

  This does not solve the uncomputability of Kolmogorov complexity. It solves the uncomputability of your group's patience.
