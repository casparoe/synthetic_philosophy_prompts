answer: |-
  This pricing regime presupposes no distinct metaphysical theory of chance but instead operationalizes risk as a normative construct defined by admissible evidence, requiring insurers to deliberately diverge from known objective chances in a manner incompatible with the Principal Principle yet coherent as a regulatory fiction. The regime does not claim that the objective chance of disease differs between a woman with a known BRCA1 variant and one without; rather, it asserts that the *insurable* risk is constituted by the evidence base insurers are permitted to process. Consequently, the risk a policyholder presents is not a fixed physical propensity but a relational property dependent on legal constraints, meaning insurers must defer to a probability number they know to be metaphysically inaccurate to satisfy social policy goals. This stance is incompatible with a strict application of the Principal Principle, which dictates that a rational agent's credence should match the known objective chance, unless one redefines "chance" within this context to mean "legally assessable frequency" rather than physical propensity. By forcing insurers to ignore superior predictive data, the regime treats chance-talk in pricing as a deliberate fiction designed to preserve pool solidarity rather than a truthful report of physical reality.

  No theory of objective chance can justify the distinction between coarse genetic information (family history) and precise genetic information (test results), as probability theory universally favors finer partitions of evidence to reduce uncertainty. The permission to use family history while banning test results relies entirely on non-probabilistic presuppositions, specifically ethical judgments about privacy, the right not to know, and the fairness of charging individuals for immutable biological facts they cannot alter. The line is drawn based on the perceived moral weight of the information source rather than its statistical validity, implying that the regime is driven by distributive justice concerns rather than epistemic accuracy.

  Philosophically, the regime is underdetermined by theories of chance because frequentist, propensity, and best-system analyses all accommodate the separation of physical reality from institutional rule-following. A frequentist can define the relevant reference class legally rather than biologically; a propensitist can acknowledge the physical propensity while refusing to monetize it; and a subjectivist can constrain their credence function by external rules. Because the regulation restricts the *use* of information rather than making a claim about the *nature* of probability, rival theories of chance remain neutral regarding the policy's validity. The regime functions not as a discovery about how chance works, but as a social technology that overrides standard probabilistic reasoning to achieve specific ethical outcomes, leaving the metaphysical groundwork of chance entirely untouched.
