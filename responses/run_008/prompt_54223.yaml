answer: |-
  It is a pleasure to correspond with a colleague who has lived the science rather than just reading about it. Thirty-seven years at a national lab gives you a vantage point that most philosophers of science only dream of. You have seen the models break, the instruments fail, and the "truths" shift under your feet.

  The debate you witnessed is a classic reenactment of the central conflict in contemporary philosophy of science: the **Pessimistic Meta-Induction** (Marcus) versus the **No Miracles Argument** (Priya), with a side order of **Structural Realism**.

  Here is my adjudication, round by round, followed by answers to your specific questions.

  ### Round-by-Round Adjudication

  **Round 1: Marcus (The Pessimistic Meta-Induction)**
  *   **Verdict:** **Right.**
  *   **Why:** Marcus is articulating the "Pessimistic Meta-Induction" (PMI). Historically, the set of "successful" past theories is largely now considered false. Therefore, by simple induction, our current successful theories are likely false. Logically, this is a sound argument. It places the burden of proof squarely on the realist to explain why *this* time is different.

  **Round 2: Priya (Selectivism/Novel Prediction)**
  *   **Verdict:** **Partly Right.**
  *   **Why:** Priya attempts to prune the historical list. She argues that phlogiston and caloric weren't *genuinely* successful because they lacked novel predictive power. This is a standard realist counter-move (often associated with philosophers like Philip Kitcher or Peter Lipton). However, she risks defining "success" too narrowly. Phlogiston chemistry *did* allow for quantitative predictions about weight changes in calcination, even if the ontology was wrong.

  **Round 3: Marcus (The Circularity Charge)**
  *   **Verdict:** **Right.**
  *   **Why:** Marcus identifies the weak spot in Priya's defense. If you define "real success" as "theories that turned out to be true," then realism is tautological: "Theories that are true are true." To avoid this, Priya needs a criterion for success that is independent of truth (like novel prediction) and show that discarded theories failed *that* criterion at the time, not just in hindsight. Marcus is correct that historians of science often find discarded theories were more predictive than realists like to admit.

  **Round 4: Priya (Structural Realism)**
  *   **Verdict:** **Partly Right.**
  *   **Why:** This is **Epistemic Structural Realism** (ESR), famously defended by John Worrall using the exact Fresnel/Maxwell example Priya cited. It concedes that we don't know the *nature* of the entities (the ether) but argues we do know the *relations* between them (the equations). It is a sophisticated compromise, but it faces a difficult question: can you have structure without *something* that is structured?

  **Round 5: Marcus (Epistemic Access & The Practitioner's Stance)**
  *   **Verdict:** **Right.**
  *   **Why:** Marcus hits two nails on the head. First, the "epistemic access" problem: in 1850, there was no internal marker telling Fresnel which parts of his theory were structural and which were ontological. Second, his phenomenological point is crucial. Scientists operate with a pragmatic trust, not a metaphysical belief. The "spouse" analogy is a bit of a straw man (realists rarely demand that level of certainty), but the core point stands: working scientists treat models as tools with limited domains, not as scripture.

  **Round 6: Priya (No Miracles Argument)**
  *   **Verdict:** **Partly Right.**
  *   **Why:** Priya deploys the "No Miracles Argument" (Hilary Putnam's phrase): realism is the only philosophy that doesn't make the success of science a miracle. If theories are just fictions, why do they predict new phenomena? However, she overreaches by claiming Marcus's lab work implies realism. Marcus is describing *reliability*, which is not the same as *truth*. A map can be reliable for navigation without being a true representation of the territory (e.g., a subway map).

  ---

  ### Specific Questions

  **(a) Is Priya's move in Round 2 circular?**
  Marcus is **mostly right** here, but there is a non-circular version available to Priya.
  If Priya defines success as "what survives," she is circular. However, if she defines success as **"novel predictive success"** (predicting a phenomenon unknown at the time the theory was constructed), she has an independent criterion.
  *   **The Catch:** Historians of science often show that discarded theories *did* make novel predictions (e.g., the caloric theory predicted the speed of sound in air quite well). So, while the move isn't logically circular, it often fails empirically. The line between "phlogiston was useless" and "phlogiston was useful but wrong" is thinner than realists prefer.

  **(b) Does Structural Realism (Round 4) answer the pessimist or change the subject?**
  It **answers the logic but changes the definition.**
  It answers the Pessimistic Meta-Induction by showing that *something* survives theory change (the math/structure). However, many argue it changes the subject of realism. Most scientists (and people) want to know if electrons *exist*, not just if the equations relating electrons work. If you tell a geochemist, "You can't know if the minerals exist, only that their structural relations are preserved," they will look at you like you've lost your mind. It saves realism from history at the cost of making it ontologically thin.

  **(c) Does your observation (scientists don't "believe" models) bear on the dispute?**
  It bears on the dispute **decisively**, and it suggests both philosophers are framing the problem poorly.
  The debate assumes a binary: either you believe a theory is "True" (capital T) or you are an "Instrumentalist" who thinks it's a "useful fiction."
  Your experience points to a third option: **Approximate Truth within a Domain.**
  You didn't need to believe your models were universally true to trust them within their specific pressure/temperature/compositional limits. Philosophers often argue about "Truth" as if it applies to the whole theory everywhere. Scientists know that a model can be "false" in principle (ignoring quantum effects) but "true enough" for the job at hand. Your observation undermines Marcus's claim that you must be an instrumentalist, and Priya's claim that you must be a full-blooded realist. You were a **pragmatic realist**.

  ---

  ### What Both of Them Are Missing

  There is a concept that both Marcus and Priya are dancing around but failing to grasp, likely because it comes more naturally to practitioners than to philosophers: **Effective Field Theories (or Domain Specificity).**

  Marcus treats the history of science as a graveyard of "false" theories. Priya treats it as a ladder of "true" structures. Both miss that science is often **cumulative via limitation.**
  *   Newtonian mechanics isn't "false" in the way phlogiston is false. It is a limiting case of Relativity. It is *true* within a specific domain (low velocity, high mass).
  *   In geochemistry, thermodynamic models don't become "false" when we discover new isotopic fractionation mechanisms; they become *restricted* in their application.

  **The Missing Synthesis:**
  The reason we should believe our current theories is not because they are "True" (Marcus is right to doubt that), and not just because they predict (Priya is right to value that), but because **we know the boundaries of our ignorance better than our predecessors did.**
  Scientists in 1880 didn't know *where* the ether theory would break; they thought it was fundamental. Today, we know exactly where General Relativity breaks (singularities) and where Quantum Mechanics breaks (gravity). We know our theories are approximate, and we know the error bars.

  **My Recommendation:**
  Tell the group that Marcus wins on history, Priya wins on logic, but **you win on practice.**
  The question "Is the theory true?" is a trap. The question should be: "Is the theory reliable within its stated domain, and do we understand the mechanisms of its failure?"
  If the answer is yes, you are justified in "believing" it in the only sense that matters for science: relying on it to build the next experiment. That isn't instrumentalism (which says the theory tells us nothing about reality), and it isn't naive realism (which says the theory is the final word). It is **critical realism**, and it's what you practiced for thirty-seven years.

  Marcus is right that we shouldn't be dogmatic. Priya is right that we shouldn't be cynical. But you are right that the work gets done in the middle, where models are neither holy writ nor mere fictions, but maps that we know are slightly out of date but still get us to the destination.
