      *   Phrasing: "whilst," " amongst," "prioritise."

  10. **Final Polish:** Ensure the distinction between "strictly requires" and "comfortably sits with" is sharp.

      *   *Strictly requires:* Monotonic relationship between clinical state and reported score (even if biased).
      *   *Comfortably sits with:* The idea that current mood reporting is accurate, but predictions are not.

      *Wait, one more thought:* The prompt asks about *introspection*. The scales ask about sleep and interest. Sleep is observable. Interest is introspective. I need to focus on the introspective element.
      *Revised focus:* The practice treats introspection as *validly indicative of severity*, even if *causally implicated in the pathology*.

