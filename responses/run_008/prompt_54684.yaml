  Consider Elara and Mara. Both lived seventy years, robust health, comfortable means, loved by spouses and children. Elara dreamed of Olympic gold but quit at twenty to coach locally. She genuinely loves her quiet town, feels no loss, and sleeps peacefully. Mara pursued the gold, won it, and built a global brand. She knows she achieved what she aimed for, yet feels hollow, constantly chasing the next podium, never resting. Both know the facts: Elara knows she could have tried harder; Mara knows she succeeded. Elara feels contentment; Mara feels gnawing lack. Their external goods match. Their internal experiences differ. One wanted less and found peace; the other wanted more and found ache.

  Hedonism ranks Elara higher: her conscious experience is net positive; Mara's is marred by chronic dissatisfaction. Actual-Desire Satisfaction agrees. Elara desires her current life and has it. Mara desires success (met) but also desires *fulfillment* (unmet); her actual psychology is a state of lack. Her desires are insatiable; Elara's are met. Informed-Desire Theory ranks Mara higher. This theory asks what they would want if fully rational and informed. An idealized agent, understanding the objective value of excellence and striving, would choose Mara's path. Elara's preferences are adapted to limitation; informed preferences track worthier goods regardless of subjective satisfaction. The theory posits that some desires are better than others, even if less satisfying.

  The engine here is **adaptive preference**. Elara scaled down her wants to match her reality. If that feature is removed—if Elara remained resentful about quitting—Hedonism and Actual-Desire verdicts collapse, as her experience and desire-satisfaction would plummet. A defender of Actual-Desire theories fights back by asking: why privilege a hypothetical self? If Elara sincerely cares about her quiet life, overriding her actual desires for what she *should* want is paternalistic. It tracks objective value, not the person's own standpoint. This reveals the tension: is well-being about getting what you want, or wanting what is good? The Informed-Desire theorist claims the latter; the Actual-Desire theorist claims the former.

  "I didn't stack the deck. I simply showed you that counting lives depends on what you count."
