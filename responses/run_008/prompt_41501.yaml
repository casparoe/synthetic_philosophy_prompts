      *(Refining the "Strongest Reply")*: The PAV defender should argue that the complaint is category error. You can't be wronged by being created unless the life is not worth living. The "disadvantage" is part of the package of existence. To complain is to wish for non-existence, which is irrational given life is worth living. This is the standard Parfitian defence, but I need to frame it as the *strongest* version of that defence.

