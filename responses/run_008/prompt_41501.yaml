      *   *Let's refine Reason R:* The decision-maker is a public health authority or a clinic director. They choose to implant Embryo A because Embryo B requires a specific, slightly more expensive screening protocol that is currently paused, or Embryo A is part of a specific research cohort that gets priority funding.
      *   *Actually, let's look for a "Reason R" that is trivial compared to the harm.*
      *   *Scenario:* **The Scheduling Protocol.**
      *   *Setting:* A public NHS fertility clinic.
      *   *Characters:* Dr Evans (Decision-maker), Child A (Complainant).
      *   *Situation:* A couple is undergoing IVF. Two embryos are viable. Embryo A has a genetic marker for a condition (let's say, a specific form of hereditary deafness or a chronic joint condition). Embryo B does not. Both result in lives worth living.
      *   *Reason R:* Embryo A is ready for implantation *this week*. Embryo B requires re-biopsy and a two-week wait to confirm genetic status due to a lab error unrelated to the embryos' health. The clinic has a strict "cycle completion" target. To meet the target and avoid administrative penalty (or simply to clear the waiting list faster), Dr Evans authorises the implantation of Embryo A immediately.
