      *   *Refining the "Wrong":* The prompt wants the nonidentity fact to make it *more* clearly wrong. In standard cases, we say "But A wouldn't exist otherwise!" Here, we want to say "Because A wouldn't exist otherwise, you thought you could pick the cheaper/faster option."
      *   *Let's tighten Reason R:* It needs to be something that clearly wouldn't justify harming an existing child. "Administrative convenience" is perfect for this.
      *   *The Complainant:* Person A (let's call him Alex). Alex is now 20. He has the condition. He knows he was selected over Embryo B (Beth) due to the scheduling target.

  3.  **Drafting the Analysis (Section by Section):**

      *   **Walkthrough:**
          *   *Person-Affecting View (PAV):* Alex exists. If the choice had been different, Alex wouldn't exist. Alex's life is worth living. Therefore, Alex is not worse off than he would otherwise have been. Verdict: No wrong done to Alex.
          *   *Impersonal View (Total/Average Utilitarianism):* World A (Alex exists with condition) vs. World B (Beth exists without condition). World B has more well-being. Verdict: Wrong act (suboptimal outcome).
          *   *Alex's Complaint:* "You chose me because my suffering didn't count as much as the clinic's schedule, a reason you'd never use on a born child." This aligns with the Impersonal View (or a Rights-based view), not the PAV.

      *   **Contrast Test:**
          *   Imagine Alex already existed as a toddler. The clinic has a treatment that could cure the condition but costs extra time/money. They choose not to administer it to meet a target.
          *   Obviously wrong.
          *   Why is it different in the embryo case? Only because Alex didn't exist yet. The PAV says this difference matters (no harm done). The intuition says this difference shouldn't license administrative convenience over health.

      *   **Key Feature:**
          *   The "Existence Dependency" combined with "Trivial Reason R".
          *   Specifically: The *substitutability* of the persons. If you remove the ability to choose B (e.g., only one embryo exists), the case collapses. If you remove the triviality of R (e.g., R is saving Alex's life), the case collapses.
