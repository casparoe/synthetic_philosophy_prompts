          *   Better argument: The "Asymmetry." We have reasons to avoid creating miserable lives, but no duty to create happy ones. Selecting A over B isn't harming A; it's just failing to maximise good. The complaint is actually a disguised impersonal complaint masquerading as a personal one. Alex is channeling the "spirit of B."

  4.  **Refining the Language (British English):**
      *   Use "programme," "centre," "paediatric," "licence," "prioritise."
      *   Ensure tone is academic but accessible.

  5.  **Review against Constraints:**
