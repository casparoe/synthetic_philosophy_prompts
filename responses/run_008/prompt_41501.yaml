      *   **Structure:** Decision-maker chooses between Person A (life worth living + serious disadvantage) and Person B (life worth living, no disadvantage). Decision-maker chooses A based on Reason R. Reason R would *not* justify imposing the disadvantage on an existing person.
      *   **Complaint:** A complains not about being worse off than they would have been (impossible), but that their non-existence was treated as a licence to discount their interests compared to B.
      *   **Constraints:**
          1.  Realistic/Contemporary (no sci-fi, existing tech).
          2.  One specific complainant (A reaches adulthood).
          3.  Wrong arises from choice structure alone (no deception, third-party harm, etc.).
