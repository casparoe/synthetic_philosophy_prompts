answer: |-
  ### The Scenario: The Quarterly Target Protocol

  **Setting:** A publicly funded fertility centre in the United Kingdom.
  **Decision-Maker:** Dr Elena Vance, Head of Clinical Operations.
  **Complainant:** Alex Vance (no relation), aged 22.

  **The Facts:**
  In 2002, a couple, the Millers, applied for IVF treatment at the centre. Genetic screening of the gametes revealed two viable embryos suitable for implantation.
  *   **Embryo A:** Genetically healthy, but carries a specific dominant gene variant (*Variant-X*). Carriers of *Variant-X* develop a condition known as Progressive Joint Degeneration (PJD). This condition causes chronic pain and requires three major surgical interventions by age 40. It does not shorten life expectancy, nor does it impair cognitive function. Consensus among medical ethicists and patients is that a life with PJD is comfortably worth living, though undeniably burdened by pain and medical intrusion.
  *   **Embryo B:** Genetically identical to Embryo A in all respects, save that it lacks *Variant-X*. A child born from Embryo B would not develop PJD.

  Both embryos were viable. The Millers were indifferent between the two, provided a healthy child resulted.

  **The Decision:**
  Dr Vance was under significant pressure to meet the centre's quarterly implantation targets. Failure to meet these targets would trigger an administrative review and potential funding reduction for the unit. Embryo A was thawed and ready for immediate implantation. Embryo B required a 48-hour re-culture period to confirm viability following a minor lab anomaly, meaning its implantation would fall into the next financial quarter.

  To ensure the procedure counted towards the current quarter's target, Dr Vance authorised the implantation of Embryo A. She reasoned that the burden of PJD was manageable and that the primary duty was to secure a pregnancy within the funding cycle. Embryo B was allowed to perish.

  **The Outcome:**
  Alex was born. He has PJD. He experiences chronic pain and has undergone two surgeries. He reports that his life is good, fulfilling, and worth living. However, upon accessing his medical records at age 21, he discovered the existence of Embryo B and the reason for Dr Vance's choice.

  **The Complaint:**
  Alex does not claim he would be better off never having been born. He acknowledges his life is worth living. His complaint is this: "Dr Vance chose to bring me into existence with a painful condition rather than bringing a different person into existence without it. She did so for a trivial administrative reason. If I had already existed as a child with PJD, and a cure were available but withheld to meet a target, that would be negligence. She treated my non-existence as a licence to disregard my health interests in a way she would never dare disregard the interests of an existing patient."

  ***

  ### 1. Walkthrough of Theoretical Verdicts

  **The Narrow Person-Affecting Consequentialist (PAC)**
  The PAC holds that an act can only be wrong if it makes some particular person worse off than they would otherwise have been. This is the 'comparative test'.
  *   **Application:** We compare Alex's actual life (with PJD) to the only alternative available to *Alex*: non-existence. Since Alex's life is worth living, he is not worse off than he would have been had Dr Vance chosen Embryo B (in which case Alex would not exist).
  *   **Verdict:** Dr Vance did not wrong Alex. No existing person was made worse off by the decision. The PAC must conclude that Alex has no valid complaint based on harm to himself.

  **The Impersonal Welfarist (IW)**
  The IW holds that the right act is the one that brings about the best state of affairs, regardless of which particular individuals exist. Value is located in well-being itself, not in well-being *for someone*.
  *   **Application:** We compare Outcome A (Alex exists with PJD) and Outcome B (Beth exists without PJD). Both lives are worth living, but Beth's life contains more well-being (less pain, fewer surgeries) than Alex's. Therefore, Outcome B is better than Outcome A.
  *   **Verdict:** Dr Vance acted wrongly. She brought about a suboptimal state of affairs when she could have brought about a better one.

  **Alignment with the Complainant**
  Alex's complaint aligns with the **Impersonal Welfarist**. Alex is not arguing that he is worse off than *he* would have been (he knows he wouldn't have been). He is arguing that the world is worse than it could have been, and that he was unfairly selected to bear the burden of that worse world. He objects to the *selection criterion*, not the *comparative outcome for himself*. The PAC verdict fails to capture the moral force of Alex's grievance, whereas the IW verdict validates the intuition that the administrative target was insufficient justification for the avoidable suffering.

  ***

  ### 2. The Contrast Test

  To see why the nonidentity fact is doing suspicious work here, we must alter the timing of the decision while keeping the reason constant.

  **The Existing Child Scenario:**
  Imagine Alex had already been born. He is a two-year-old patient at the centre. He is diagnosed with *Variant-X*. A treatment exists that can neutralise the gene's effect, preventing PJD. However, administering the treatment requires paperwork that will delay the clinic's quarterly reporting by 48 hours, pushing the procedure into the next financial quarter and jeopardising the centre's target.

  Dr Vance decides not to administer the treatment to meet the target. Alex grows up with PJD.

  **The Judgement:**
  In this scenario, every theorist—PAC, IW, deontologist—agrees Dr Vance acted wrongly. The administrative target is plainly insufficient to justify imposing chronic pain on an existing child. The duty of care to an existing patient overrides bureaucratic convenience.

  **The Discrepancy:**
  In the embryo case, the PAC argues the moral landscape changes fundamentally simply because Alex did not yet exist. The PAC must argue that Dr Vance's duty to avoid imposing pain is suspended when the recipient of the pain is not yet a subject.
  The Contrast Test reveals that the *only* difference between the clear wrong (existing child) and the alleged non-wrong (embryo) is the nonidentity fact. If the nonidentity fact is treated as a moral licence, it allows decision-makers to apply reasons to potential people that would be deemed grossly negligent if applied to actual people. This suggests the nonidentity fact is masking the wrong, rather than dissolving it.

  ***

  ### 3. The Key Feature: Substitutability as a Licence

  The single feature doing the work in this case is **the substitutability of persons combined with a trivial Reason R**.

  In standard nonidentity cases (like Parfit's Depletion Case), the Reason R is often significant (e.g., economic growth, avoiding immediate hardship for the current generation). This makes it plausible to argue that the future person cannot complain, as the policy benefited society as a whole.

  In this case, Reason R is **administrative convenience**.
  *   **If this feature is removed:** Suppose Dr Vance chose Embryo A because Embryo B had a *different* genetic marker that would cause a *more* severe condition. Here, the choice is based on the comparative welfare of the possible children. The nonidentity fact remains, but the complaint vanishes because the decision-maker is maximising welfare.
  *   **If the feature is present (as above):** The decision-maker uses the fact that 'Alex' is not fixed to prioritise a trivial institutional goal over a significant health interest. The nonidentity fact transforms from a metaphysical constraint into a **moral discount**. It allows the decision-maker to treat the interests of the potential person as less weighty than the interests of the institution, a weighting that is impermissible once the person exists.

  The case works because it isolates the nonidentity fact as the *sole* justification for applying a double standard in moral reasoning. It demonstrates that if we accept the PAC verdict, we are accepting that 'not yet existing' reduces the moral weight of one's health interests relative to bureaucratic targets.

  ***

  ### 4. The Strongest Reply (Defending the Person-Affecting View)

  A sophisticated defender of the Person-Affecting View (PAV) must not retreat to rule-consequentialism (e.g., "allowing this would have bad long-term effects"). They must argue on the terms of harm and duty.

  **The Argument from the Non-Existence of the Subject:**
  "The error lies in Alex's formulation of the complaint, not in the PAV. To claim one has been wronged is to claim one has been treated unfairly *as a subject*. But in the moment of decision, Alex was not a subject; he was a possibility.

  Dr Vance did not owe a duty *to Alex* to select Embryo B, because 'Alex' was not there to be owed a duty. Duties are relational; they require two parties. At the time of the choice, there was no 'Alex' to stand in relation to Dr Vance. There was only a choice between creating Alex-with-PJD or Beth-without-PJD.

  If Alex claims he was wronged, he must specify the alternative where he is treated better. The only alternative where *he* exists is one where Dr Vance missed her target. But missing the target does not benefit *him*; it merely changes the administrative outcome. The alternative where *he* is healthier is the one where *he does not exist*.

  Therefore, Alex's complaint is a category mistake. He is attempting to assert a right to have been conceived differently, which is logically incoherent. He is effectively saying, 'I have a right to exist, but only if I exist as someone else.' This is not a right a person can hold. The PAV verdict stands: one cannot be harmed by being caused to exist, provided life is worth living. The intuition that Dr Vance acted wrongly is actually an impersonal intuition (that the world is worse) mistakenly voiced as a personal grievance. Alex is speaking as a proxy for Beth, not for himself."

  **Why this reply is strong:**
  It holds the line on the metaphysics of identity without appealing to consequences. It forces the critic to admit that the complaint is actually impersonal in nature. It challenges the student to explain *why* a duty should be owed to a non-existent entity over the identity of that entity, without simply asserting that 'suffering is bad'. It maintains that 'harm' requires a comparative baseline for the *same* subject, and refuses to let the concept of harm stretch to cover 'failure to create the best possible subject'.
