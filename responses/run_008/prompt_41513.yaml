      *Let's sharpen the "Identical Judgment" point.* If the narration judges them identically, does the reader? The user says "reader is meant to sit in the gap." Okay. The risk is the reader rejects the narrator's authority.
      *The Crime Writer:* Will focus on the victim and the plot logic.
