answer: |-
  Here is a complete lesson plan designed for your 75-minute session. It treats the game as a "Hiring Simulation" to keep the biology hidden until the reveal.

  ### Part 1: The Game Design ("The Hiring Market")

  **Time:** 35 Minutes (15 min setup/play, 20 min debrief)
  **Class Size:** 14 Students
  **Roles:** 5 Employers, 9 Candidates (Adjust ratio if attendance varies, keep Candidates > Employers).
  **Materials:**
  *   Index cards (2 colors, e.g., Blue and Red).
  *   "Application Slips" (small half-sheets of paper).
  *   Two versions of a "Skills Test" (Version A and Version B).
  *   Candy or "Class Participation Points" (for payoff).
  *   Timer.

  #### 1. Setup & Hidden Types (5 Minutes)
  *   **Employers (5 students):** Sit at the front. Give them a scoring sheet. Their goal: Hire as many **High-Quality (HQ)** workers as possible.
  *   **Candidates (9 students):** Sit in the main area. Hand them a sealed Index Card.
      *   **Blue Cards (HQ):** 4 students. Text: *"You are High-Quality. You learn fast. Tasks feel easy to you."*
      *   **Red Cards (LQ):** 5 students. Text: *"You are Low-Quality. You struggle with new tasks. Tasks feel difficult to you."*
      *   **Rule:** Do not show your card to anyone.
  *   **Payoff Structure (Write on Board):**
      *   **Candidate:** If Hired = +5 Points (or 2 candies). If Not Hired = 0 Points.
      *   **Employer:** If Hire HQ = +5 Points. If Hire LQ = -5 Points. If No Hire = 0 Points.

  #### 2. Round 1: "Open Season" (Cheap Signals) (5 Minutes)
  *   **Rule:** Candidates want to be hired. Employers want HQs.
  *   **Action:** Candidates write anything they want on an Application Slip (e.g., "I am hard working," "I am HQ") and hand it to an Employer.
  *   **Cost:** Free.
  *   **Decision:** Employers have 60 seconds to review slips and pick **one** candidate to hire.
  *   **Outcome:** Almost everyone will claim to be HQ. Employers must guess. Most will pick randomly or based on handwriting.
  *   **Result:** Likely a mix of HQ and LQ hired. Employers will feel frustrated they couldn't tell the difference.

  #### 3. Round 2: "Certification Protocol" (Costly Signals) (10 Minutes)
  *   **Announcement:** "Due to bad hires last round, the Market has updated. To apply now, you must submit a **Certified Skills Test**."
  *   **The Signal:** Hand out the Tests.
      *   **HQ (Blue Cards):** Receive **Version A**. (e.g., A simple anagram or a very easy logic puzzle).
      *   **LQ (Red Cards):** Receive **Version B**. (e.g., A complex anagram or a difficult logic puzzle).
      *   *Crucial:* To the Employer, the result looks identical (a sheet with "Solved" written on it). They do not see the question.
  *   **The Cost:** Set a timer for **90 Seconds**.
      *   For HQs, 90 seconds is plenty (Low Cost/Effort).
      *   For LQs, 90 seconds is likely insufficient or highly stressful (High Cost/Effort).
  *   **Action:** Candidates attempt the test. If they solve it, they mark "Certified" and submit to an Employer. If they fail, they can submit "Uncertified" (which Employers are instructed to ignore).
  *   **Decision:** Employers only hire "Certified" applicants.
  *   **Outcome:** Most HQs will certify. Most LQs will fail to certify or choose not to submit because the effort outweighs the reward. Employers successfully hire HQs.

  #### 4. Scoring & Reveal (5 Minutes)
  *   Tally points/candy.
  *   **Do not explain the mechanics yet.** Just ask: "Why did Round 2 work better?"
  *   Collect the cards and tests.

  ---

  ### Part 2: The Debrief (Mapping the Machinery)

  **Time:** 25 Minutes
  **Goal:** Move from "The Game" to "The Theory" to "Real Life."

  **1. The Reveal (5 Minutes)**
  *   Ask the LQ candidates: "How did your test feel compared to the HQs?"
  *   Reveal that the tests were different.
  *   **The Core Concept:** "In Round 1, the signal was **free**. Anyone could send it. That's 'Cheap Talk.' In Round 2, the signal was **costly** (effort/time). But crucially, the cost was *higher* for the Low-Quality candidates than the High-Quality ones."
  *   **The Biology Drop:** "My friend with the PhD calls this the **Handicap Principle**. A peacock's tail is heavy and attracts predators. That's the cost. But a healthy peacock can handle it; a sick one can't. The tail works *because* it is a burden."

  **2. The Mechanics (10 Minutes)**
  *   **Why Cheap Signals Fail:** If saying "I'm honest" costs nothing, liars will say it too. The signal gets flooded (Round 1).
  *   **Why Cost Works:** Honesty survives only if the cost of lying is higher than the benefit of lying.
  *   **The "Bite" Condition:** It's not enough for the signal to be expensive. It must be *disproportionately* expensive for the faker.
      *   *Job Market:* A degree is expensive (time/money). A high-ability person finds school easier (lower cost) than a low-ability person. The degree signals ability not because of what you learn, but because you survived the cost.
      *   *Dating:* "I love hiking" is text (free). "Let's go hike this Saturday at 7 AM" is a signal (costly time/effort). A flake won't agree to the 7 AM hike; a serious dater will.

  **3. Real World Application (10 Minutes)**
  *   Ask students: "Where else do you see this?"
  *   **Apologies:** "I'm sorry" is cheap. "I'm sorry, and I'm paying for the damage" is costly.
  *   **Protests/Activism:** Posting on Instagram (cheap) vs. Getting arrested (costly).
  *   **Luxury Goods:** Why buy a $500 bag that holds the same stuff as a $50 bag? To signal you have resources to burn.
  *   **Dating (Your Hook):** "If someone says they're 'spontaneous,' that's a Round 1 signal. If they plan a surprise trip based on your specific interests, that's Round 2. One is text; the other is a handicap."

  ---

  ### Part 3: Limitations (What the Game Can't Show)

  Be honest with your students about where the simulation breaks down. This models scientific critical thinking.

  1.  **No Evolution:** In nature, signals evolve over generations. In our game, we just changed the rules manually. In reality, if a "fake" signal worked, nature would select against it over time.
  2.  **One-Shot vs. Reputation:** This was a single interaction. In real life (and dating), reputation builds over time. You can sometimes signal honestly without cost if you have a long track record.
  3.  **Social Pressure:** Students might behave "nicer" than rational actors because they are in a classroom. A real LQ candidate might try to cheat on the test more aggressively than a student would in front of a professor.
  4.  **Frequency Dependence:** The value of a signal depends on how many others use it. If *everyone* gets a PhD, the PhD loses signaling power (credential inflation). Our game didn't capture that arms race.

  **What you must supply:** You have to explain the *evolutionary stability* verbally. The game shows the *logic* of the cost, but not the *history* of how that cost became the standard.

  ---

  ### Part 4: Predictable Failures & Fixes

  **1. Failure: The Cost is Too Low (Pooling Equilibrium)**
  *   **What happens:** In Round 2, the LQ candidates solve the hard test anyway. Everyone gets certified. Employers still can't tell the difference.
  *   **Why:** The "Handicap" wasn't heavy enough.
  *   **Fix:** Have a backup "Nightmare Version" of the test ready. If you see too many LQs succeeding during the game, verbally announce: "Market tightening: Certification now requires two solved puzzles." Increase the friction mid-game if needed.

  **2. Failure: Collusion/Information Leak**
  *   **What happens:** An HQ student tells an LQ student, "Hey, my test was easy, trade me?"
  *   **Why:** Students view this as a cooperative class activity, not a competitive market.
  *   **Fix:** Frame the payoff aggressively. "Top 3 Employers get extra credit/candy." "Candidates who get hired get extra credit." Make the competition explicit. Collect tests immediately so they can't compare questions.

  **3. Failure: The "Nice" Employer**
  *   **What happens:** An Employer feels bad for an LQ candidate who failed the test and hires them anyway out of pity.
  *   **Why:** Social norms override game rules.
  *   **Fix:** Instruct Employers privately: "You are being audited. If you hire an Uncertified candidate, you lose double points." Give them a bureaucratic reason to be ruthless.

  **4. Failure: Cynicism**
  *   **What happens:** Students decide the whole game is rigged (which it is) and disengage.
  *   **Why:** They feel manipulated.
  *   **Fix:** Own it in the debrief. "Yes, the market is rigged. The system is designed to filter you. Today you felt the filter. Now let's analyze why the filter exists." Validate their frustration as part of the lesson.

  ### Instructor Cheat Sheet (Mental Prep)
  *   **Version A (HQ):** Unscramble: `T A C` (CAT).
  *   **Version B (LQ):** Unscramble: `P S Y C H O L O G Y` (PSYCHOLOGY) *but remove vowels: `P S Y C H L G Y`*.
  *   **Payoff:** Keep it visible. Draw a scoreboard on the whiteboard.
  *   **Timing:** Keep Round 1 moving fast so Round 2 feels like the "real" activity.

  This design lets them feel the frustration of the "Cheap Talk" round and the relief/effort of the "Costly Signal" round, making the Handicap Principle a solution to a problem they just experienced, rather than a fact they have to memorize.
