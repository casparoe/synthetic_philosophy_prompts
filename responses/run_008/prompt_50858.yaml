answer: |-
  "Feature 4,902," Elena said, tapping the screen. "Fires on Python function definitions and, embarrassingly, on sonnets about the ocean. You say that's noise. I say it's superposition. The model is packing 'structured generation' into a single direction because it couldn't afford separate neurons."

  Mark rubbed his eyes. The office hum was the only sound left. "It's not packing, El. It's you. The residual stream is just a vector space. Any orthogonal basis spans it equally well. Calling that direction 'structured generation' is like looking at clouds and seeing a dragon. You're projecting utility onto geometry."

  "If it's just clouds, why does ablating it kill both the code completion and the meter in the sonnet?"

  "Because you ablated a direction *you* chose," Mark countered. "If I rotate the basis within that active subspace, I can find a new vector that kills the code but keeps the sonnet. The semantics aren't in the weights; they're in the interaction between the weights and our interpretability tools."

  "Then explain convergence," Elena said, leaning back. "We train three models on the same data, different seeds. We run SAEs, probing classifiers, and causal tracing. They all find roughly the same 'induction heads.' They all find a 'malicious prompt' direction. If it's just constellations, why do three different observers draw the same lines?"

  "Because we're all humans trained on the same data distribution," Mark said sharply. "We all know what 'code' looks like. We bias our loss functions, our tokenizers, and our probe architectures to find human-conceptualizable clusters. The model doesn't care about 'deception.' It cares about minimizing loss. We're the ones carving 'deception' out of the gradient descent because it helps us sleep at night."

  Elena paused. She picked up her coffee, cold now. "Okay. I'll concede the SAEs. The L1 penalty, the decoder architecture... sure, the features are partly artifacts of the microscope. They're not pure platonic forms."

  "Thank you."

  "But," she continued, "the fact that the microscope *works* across seeds suggests the underlying tissue has grain. If the wood were random, the knife would slip every time. It doesn't. It catches on something."

  "The knife is shaped to catch," Mark said. "We design the knife."

  They fell silent. Elena pulled up a new window, overlaying the feature vectors from two differently seeded models. She aligned them via procrustes analysis. The correlation was high, but not perfect. There was a drift.

  "If I rotate this vector by five degrees within the top-50 active subspace," Elena said, her finger hovering over the keyboard, "the probe accuracy stays flat. But the causal effect on the logits drops off a cliff."

  Mark leaned in, squinting at the graph. "So the semantics are sensitive to the specific direction, not just the subspace."

  "Exactly. If it were just our projection, any mix of that subspace should work equally well for the model's computation. But the model treats this specific angle as privileged."

  "Or," Mark said softly, "the model treats the *subspace* as privileged, and our causal intervention is too coarse to isolate the direction without breaking the computation elsewhere. We're seeing fragility, not ontology."

  Elena didn't type. She just stared at the divergence point on the plot, where the causal effect spiked while the probe confidence remained steady. The cursor blinked on the command line, waiting for a rotation matrix.

  Mark reached for the keyboard, then stopped. He looked at the vector, then at the loss curve, then back at the vector.

  "If we rotate it," Elena said, "and the behavior stays, you win. It's us."

  "If we rotate it," Mark said, "and the behavior breaks, you win. It's them."

  Neither moved. The cursor blinked against the dark terminal, waiting to see if the geometry held its shape when no one was looking.
