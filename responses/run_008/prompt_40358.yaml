answer: |-
  Here is a session plan designed for your specific group composition (engineers + one math grad student). It prioritizes intuition and epistemology over formal complexity definitions, using a single concrete example to anchor the abstract concepts.

  ### 1. The Entry Point: Motivation before Formalism
  **Do not start** with definitions of heuristic estimators. Start with a wager.

  *   **The Hook:** Put $50 on the table. Tell the group: "I have a deterministic function $F$. I will pick an input $x$ uniformly at random from $\{0,1\}^{256}$. I want you to bet on whether the first bit of $F(x)$ is 0 or 1. If you guess right, you win."
  *   **The Twist:** Tell them $F$ is SHA-256. Everyone will say "50/50."
  *   **The Challenge:** Ask the math grad student: "Strictly speaking, isn't the probability either 0 or 1? The function is deterministic. The input is fixed once I pick it. Why are we allowed to say 50%?"
  *   **The Goal:** This forces the room to articulate *why* we use probability for deterministic objects. You want them to land on: "Because I can't compute the answer."
  *   **The Pivot:** "Okay, so we use probability to model our *computational ignorance*. The 'Presumption of Independence' project asks: When is that ignorance justified, and when is it just laziness?"

  ### 2. The Running Example: The Feistel Ladder
  You need an example that is deterministic, looks random, but has a "tuning knob" for complexity. Do not use a black-box hash function (too magical) or prime numbers (too number-theoretic).

  **Use a Feistel Network.**
  *   **Why it works:** Every engineer knows the basic structure (split bits, mix with key, swap). It is visibly deterministic.
  *   **The Setup:** Define a toy Feistel network operating on 64 bits.
      *   **Case A (3 Rounds):** Visibly structured. Known linear correlations exist.
      *   **Case B (20 Rounds):** Visibly messy. No known cheap correlations.
  *   **The Task:** Estimate the probability that $Output[0] = 1$ AND $Output[1] = 1$ given random input.
  *   **The Heuristic Move:** In Case B, you assume the bits are independent ($0.25$). In Case A, you know they aren't.
  *   **The Crucial Detail:** In *both* cases, the bits are deterministically linked to the input. In *both* cases, the "true" probability is 0 or 1 for any specific input. The difference is purely about the **cost of finding the dependency.**

  ### 3. Sequencing and Misconception Management
  Here is the flow of the 90-minute session, with specific interventions for the objections you predicted.

  **0:00 – 0:15: The Epistemic Trap (The Hook)**
  *   Run the SHA-256 wager described above.
  *   **Misconception Alert:** The Math Grad Student will say, "Probability applies to random variables, not deterministic functions."
  *   **Intervention:** Agree with them. Introduce the term **Epistemic Probability**. We aren't modeling the *system's* randomness; we are modeling the *observer's* uncertainty. The "Presumption of Independence" is a rule for bounded observers, not a law of physics.

  **0:15 – 0:45: The Feistel Experiment**
  *   Walk through the 3-Round vs. 20-Round scenario.
  *   Ask: "In the 20-Round case, if I assume independence and I'm wrong, what does that imply?"
  *   **Desired Answer:** "It implies you found a shortcut/cryptanalytic attack."
  *   **Misconception Alert:** An engineer says, "But the bits *aren't* actually independent, so the estimate is unsound."
  *   **Intervention:** Distinguish **Soundness** (matching reality) from **Justification** (matching your evidence). You are not claiming the bits *are* independent; you are claiming you are *entitled to act as if they are* because falsifying that claim requires more compute than you have.

  **0:45 – 1:05: Formalizing "Entitlement" (The Core)**
  *   This is where you introduce the "Heuristic Argument" concept without the heavy math.
  *   Define a **Bounded Auditor**: An entity that can run any algorithm that finishes in, say, 1 hour.
  *   **The Rule:** You are entitled to presume independence *if and only if* the Bounded Auditor cannot find a correlation.
  *   **The Shift:** This moves the justification from "I didn't look" (Laziness) to "Nobody *could* look" (Entitlement).
  *   **Discussion:** Ask the group: "If a correlation exists but takes 100 years to find, are you entitled to ignore it?" (This tests their intuition on the "bounded" part).

  **1:05 – 1:20: Scope and Refusal**
  *   **Explicitly state what you are NOT covering:**
      1.  **The Formal Definition of a Heuristic Estimator:** (e.g., the specific linearity conditions from the Christiansen/Cotler paper). Say: "That's the map, we're just looking at the terrain today."
      2.  **Complexity Classes:** Do not define P, NP, or BPP. Use "feasible computation" instead.
      3.  **Security Proofs:** You are discussing *heuristics*, not *reductions*. A reduction proves security; a heuristic argument justifies a guess.
  *   **Why:** This prevents the Math Grad Student from trying to derive theorems and keeps the Engineers from getting bored by notation.

  **1:20 – 1:30: The Check (The Audit Game)**
  *   See below for the specific mechanism.

  ### 4. The "Check for Understanding"
  Do not ask "Does everyone understand?" Instead, run **The Audit Game**.

  **Scenario:**
  Present two functions, $F$ and $G$.
  *   **$F$:** A 20-round Feistel network with a random key.
  *   **$G$:** A 20-round Feistel network where the last round key is all zeros (a known weakness).

  **The Setup:**
  Tell the group: "You are a Bounded Auditor. You have 1 hour of compute time. A junior engineer has submitted a report assuming output bits are independent for both $F$ and $G$."

  **The Question:**
  "For which function is the engineer **entitled** to the assumption, and for which are they merely **lazy**?"

  **The Correct Answer:**
  *   **$F$ (Entitled):** No cheap test exists within the 1-hour budget. The assumption is justified by computational limits.
  *   **$G$ (Lazy):** A cheap test *does* exist (checking the last round key). Even if the engineer didn't run it, the *existence* of the cheap test within the budget means they weren't entitled to the assumption.

  **Why this works:**
  It forces them to distinguish between "I didn't find a correlation" (which applies to both) and "No correlation is *findable* within the budget" (which applies only to $F$). This captures the exact distinction between "expensive to compute" and "entitled to assume."

  ### 5. Summary of Facilitator Notes
  *   **Tone:** Keep it philosophical but grounded in code. You are discussing "Rationality under Resource Constraints."
  *   **The Math Grad Student:** If they push for rigor on the probability space, validate them but pivot: "We are defining a new kind of probability specifically for agents who can't solve integrals. Standard measure theory assumes omniscience; we are assuming boundedness."
  *   **The Engineers:** If they say "This is just crypto," push back: "Crypto uses this to build locks. This project asks why the lock is logically valid to trust. It's the philosophy *behind* the crypto."
  *   **The "Gotcha":** If someone says, "But if I wait 1000 years, I can break $F$," reply: "Then the 'Entitlement' is relative to your time horizon. The formal program tries to make that horizon explicit."

  ### 6. Preparation Checklist
  1.  **Visual Aid:** A simple diagram of a Feistel round (Split -> Function -> XOR -> Swap).
  2.  **Handout:** A one-pager defining "Epistemic Probability" vs. "Aleatory Probability" and the "Bounded Auditor" concept.
  3.  **Reading:** Do **not** assign the main paper beforehand. It's too dense. Assign a blog post summary or just rely on your intro. (e.g., "Heuristic Arguments" posts on LessWrong or the Alignment Forum often have more accessible intros).
  4.  **Whiteboard:** Reserve space to write "Laziness" on one side and "Entitlement" on the other, and sort comments during the discussion.

  This plan respects their background, avoids the complexity theory swamp, and gives you a concrete mechanism to verify if they grasped the core philosophical shift.
