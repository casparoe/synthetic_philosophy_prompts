prompt: |-
  My department's ethics reading group has spent the better part of a year on expressivism and the Frege–Geach problem, and we have hit a wall I'd like to understand better. As we now all appreciate, the original challenge is that in a valid argument like: lying is wrong; if lying is wrong, getting your little brother to lie is wrong; therefore getting your little brother to lie is wrong — the premise's occurrence in the conditional is unasserted, so an expressivist who says the sentence expresses disapproval of lying seems to have nothing to say about the antecedent occurrence, and no way to explain why the argument is valid rather than equivocal. But everyone in the room, including the skeptics, concedes that the sophisticated responses meet this challenge in its original form: Blackburn's machinery of higher-order attitudes toward combinations of attitudes, Gibbard's account in terms of plans and hyperplans, Schroeder's story about the single attitude of being for ruling out lying. You can, if you work at it, get every intuitively valid normative inference to come out valid, and every invalid one invalid.

  Here is where we stall. The anti-expressivists in the group say the compositional machinery is a shell game: it was reverse-engineered from exactly the inference patterns it was supposed to explain, so "explaining" modus ponens by stipulating an attitude toward attitude-combinations that happens to preserve it is not explanation at all — it's bookkeeping with the same surface grammar the realist uses. The expressivists answer that every compositional semantics is fitted to usage somehow, and that demanding a deeper justification of the expressivist's clauses than we demand of the realist's just assumes realism about the contents being assigned. Meanwhile each new solution breeds a new objection — the negation problem, the worry that a solution general enough to handle negation generates too many attitude-types to keep the theory noncognitivist, the complaint that hybrid theories quietly concede everything to the cognitivist — and the dialectic rotates through this cycle without either side giving ground. Notably, the two camps do not disagree about any actual inference: they agree that the little-brother argument is valid, that it's not equivocal, that the negation of a moral claim is expressible. The fight is entirely about whether the expressivist account of these agreements deserves to be called a semantics.

  My working hypothesis, which I'd like you to test rather than flatter, is that this is not a substantive disagreement about compositionality at all but a disguised disagreement about what an adequate semantic theory is for — describing the inferential role of sentences versus explaining or grounding that role in something else — and that beneath that lies a genuinely substantive but different dispute, about whether the belief/desire taxonomy carves normative judgment at its joints, which no amount of compositional ingenuity can touch. Is that diagnosis right? Are the two sides in fact answering different questions under one heading, or is there a real formal or metaphysical question on which they divide? And given your diagnosis, what would count as progress: an independently motivated test case that any semantics must handle, a criterion for when a compositional clause is ad hoc rather than merely tailored, or the recognition that the debate is a proxy war over naturalism about the normative, and should be conducted on that terrain instead? I want a diagnosis with reasons, not a tour of the positions, and an honest verdict on whether anything could move this debate or whether the impasse is structural.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** An ethics reading group has spent a year on expressivism and the Frege-Geach (F-G) problem.
      *   **Current State:** They understand the original F-G problem and the sophisticated solutions (Blackburn, Gibbard, Schroeder). They agree on the *validity* of the inferences (e.g., modus ponens in moral contexts).
      *   **The Impasse:** Anti-expressivists claim the solutions are "shell games" (reverse-engineered, ad hoc bookkeeping). Expressivists claim this demand is unfair compared to realism and that their semantics is legitimate. The debate is now about whether the expressivist account *deserves to be called a semantics*, not about the inferences themselves.
      *   **User's Hypothesis:** The disagreement isn't about compositionality per se, but about the *purpose* of semantic theory (describing inferential role vs. grounding it). Beneath that lies a substantive dispute about the belief/desire taxonomy (psychological metaphysics) and naturalism.
      *   **Task:** Test this hypothesis. Provide a diagnosis with reasons. Determine if the sides are answering different questions or if there's a real formal/metaphysical divide. Suggest what would count as progress (test case, criterion for ad hocness, or shifting terrain). Give an honest verdict on whether the impasse is structural.
      *   **Constraint:** Do not flatter. Do not give a tour of positions. Focus on diagnosis and verdict.

  2.  **Deconstruct the User's Hypothesis:**
      *   *Claim 1: It's not a substantive disagreement about compositionality.* (Partially true, but needs nuance. The *form* of the compositionality is disputed.)
      *   *Claim 2: It's a disguised disagreement about what semantic theory is for (inferential role vs. grounding).* (Very strong insight. This touches on the "semantic value" vs. "psychological state" distinction.)
      *   *Claim 3: Beneath that lies a dispute about the belief/desire taxonomy.* (This is the core metaphysical/psychological commitment.)
      *   *Claim 4: No amount of compositional ingenuity can touch the underlying dispute.* (Suggests the F-G debate is exhausted.)

  3.  **Evaluate the "Shell Game" Objection (The Anti-Expressivist Stance):**
      *   Why do realists call it a shell game? Because expressivists assign semantic values (e.g., sets of hyperplans, commitment states) that *look* like truth-conditions but are defined solely to preserve validity.
      *   Realists say: Truth-conditions explain validity because truth is preserved. Expressivists say: Consistency of attitudes explains validity.
      *   The realist charge: You've just defined "consistency" as "whatever makes modus ponens work."
      *   The expressivist defense: You've defined "truth" as "whatever makes modus ponens work."
      *   *Diagnosis:* This is a standoff over *explanatory priority*.

  4.  **Evaluate the "Purpose of Semantics" Claim:**
      *   Standard semantics (Davidson/Truth-Conditional): Meaning is given by truth conditions. Validity is preservation of truth.
      *   Expressivist semantics (Inferential/Commitment): Meaning is given by use/attitude. Validity is coherence of attitudes.
      *   The User suggests the fight is about whether the expressivist account *counts* as semantics.
      *   *Refinement:* It's actually about whether *logic* applies to non-cognitive states. If logic applies only to truth-apt propositions, expressivism fails. If logic applies to consistency of plans/attitudes, expressivism succeeds.
      *   So, is it a verbal dispute? No, it's metaphysical. It's about the nature of logical consequence.

  5.  **Evaluate the "Belief/Desire Taxonomy" Claim:**
      *   Expressivism relies on a Humean psychology (Beliefs = mind-to-world, Desires/Plans = world-to-mind). Moral judgments are desire-like.
      *   Realists (Cognitivists) often argue moral judgments are belief-like (they aim at truth, are motivated by evidence).
      *   If the F-G problem is "solved" by making moral states look enough like beliefs to sustain logic, does expressivism collapse into cognitivism? (The "Collapse Objection").
      *   *Verdict:* The User is right that this is the deeper fault line. The F-G debate is the *symptom*, not the *disease*.

  6.  **Develop the Diagnosis:**
      *   **Agreement:** The User is largely correct. The F-G debate has reached a point of diminishing returns regarding formal semantics.
      *   **Nuance:** It's not *just* about the purpose of semantics. It's about *Explanatory Depth*. Realists claim truth-conditions explain *why* the inference rules work (metaphysical grounding). Expressivists claim pragmatic coherence explains it. The realist says the expressivist is merely *modeling* the logic, not *grounding* it.
      *   **The "Different Questions" Angle:** Realists ask: "What makes this valid?" (Metaphysics of truth). Expressivists ask: "How can we use this validly?" (Pragmatics of commitment). They talk past each other because they define "semantics" differently.
      *   **The "Belief/Desire" Angle:** This is the real battleground. If moral states are sufficiently belief-like to solve F-G, are they still non-cognitive? (Schroeder's "Being For" tries to walk this line).

  7.  **Determine What Counts as Progress:**
      *   *Independent Test Case:* Unlikely to work. Both sides can adjust machinery to fit data (as the User noted).
      *   *Criterion for Ad Hocness:* Hard to define without begging the question. Realists say "truth" isn't ad hoc; Expressivists say "plans" aren't.
      *   *Shift Terrain:* Yes. Move to Metaethics proper (Naturalism, Queerness, Motivation). The F-G problem was a proxy for "Can non-cognitive states sustain logic?" The answer is technically "Yes, if you build the right logic," but the cost is making the states look cognitive.
      *   *Best Path:* Focus on the *psychological reality* of the states. Do agents actually hold "higher-order attitudes" (Blackburn) or "hyperplans" (Gibbard)? Or is that just formalism?

  8.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Validate the User's hypothesis. It's astute.
      *   *Section 1: The Semantic Standoff.* Confirm that the dispute is about explanatory priority (Truth vs. Coherence). The "shell game" charge is about *explanatory circularity*.
      *   *Section 2: The Metaphysical Core.* Confirm the belief/desire taxonomy point. The F-G solution requires moral states to behave like beliefs. If they behave exactly like beliefs, what distinguishes expressivism from cognitivism? (The "Collapse" worry).
      *   *Section 3: Progress.* Reject the "independent test case" idea (theory-laden). Suggest the "Ad Hoc" criterion is the only lever, but it's weak. Strongly endorse shifting to the metaphysical/psychological terrain.
      *   *Verdict:* The impasse is structural *within the confines of formal semantics*. It cannot be resolved by better logic. It must be resolved by better psychology or metaphysics.

  9.  **Refining the Tone:**
      *   Avoid flattery ("That's a brilliant insight"). Instead, use ("Your diagnosis is robust," "You have correctly identified...").
      *   Be direct about the "Shell Game." It's a charge of *triviality*.
      *   Address the "Semantics" definition. Is it model-theoretic or metaphysical?

  10. **Final Polish:** Check against constraints. Did I tour the positions? No. Did I give reasons? Yes. Did I answer the specific questions about progress? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to say expressivism *is* false. The point is the *debate* is stalled. I should emphasize that Schroeder's Hybrid Expressivism is an attempt to bridge this, but it risks the collapse the User mentions. I should also mention that the "purpose of semantics" point connects to the distinction between *formal semantics* (model theory) and *philosophical semantics* (metaphysics of meaning). The expressivists win at formal semantics; the realists claim victory at philosophical semantics.

      *(Final check on the "Belief/Desire" point)*: The User says "whether the belief/desire taxonomy carves normative judgment at its joints." This is the Humean Theory of Motivation vs. Cognitivist Internalism/Externalism. I need to make sure I link this back to why F-G stalls. (Because F-G solutions force non-cognitive states to have cognitive structure).

      *(Final Verdict)*: The impasse is structural regarding semantics. Progress requires leaving semantics.

