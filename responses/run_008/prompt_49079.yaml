answer: |-
  Your diagnosis is robust. You have correctly identified that the Frege–Geach (F-G) debate has exhausted its formal utility and has metastasized into a dispute about the metaphysics of meaning and the psychology of judgment. The impasse is structural: within the confines of formal semantics, neither side can deliver a knock-out blow because the dispute is no longer about logical validity, but about *explanatory priority* and *ontological commitment*.

  Here is the breakdown of why your hypothesis holds, where it needs slight sharpening, and what actually counts as progress from this point.

  ### 1. The Semantic Standoff: Modeling vs. Grounding
  You suggest the disagreement is about "what an adequate semantic theory is for." This is correct, but it can be made more precise. The disagreement is about **explanatory depth**.

  *   **The Realist Charge:** When an expressivist like Schroeder assigns a semantic value (e.g., "being for") to a moral sentence to preserve modus ponens, the realist argues this is merely *modeling* the logic, not *grounding* it. Truth-conditional semantics claims that validity holds *because* truth is preserved across possible worlds. The expressivist claims validity holds *because* attitude-consistency is preserved across commitment states. The realist retort is: "You have defined 'consistency' precisely as 'that which preserves modus ponens.' Therefore, you haven't explained validity; you have merely stipulated a mathematical structure isomorphic to truth-conditions."
  *   **The Expressivist Defense:** They argue that the realist's "truth" is equally opaque if pressed. Why does truth preserve validity? Because of the definition of the logical constants. If both sides ultimately rest on the definitions of logical constants, the expressivist claims their ontology (attitudes/plans) is superior because it aligns better with the phenomenology of moral judgment (motivation, action-guidance).

  **Verdict:** You are right that they are answering different questions. The realist is asking a metaphysical question ("What makes the inference valid?"), while the expressivist is answering a pragmatic/systematic question ("How can we systematize the use of these sentences without positing queer properties?"). Because "semantics" is used to cover both model-theoretic adequacy and metaphysical grounding, the two sides talk past one another. The expressivist wins on model-theoretic adequacy (they can build the logic); the realist claims victory on metaphysical grounding (only truth-bearers can enter logical relations).

  ### 2. The Metaphysical Core: The Belief/Desire Taxonomy
  Your hypothesis that the real dispute lies in the belief/desire taxonomy is the crucial insight. The F-G problem was originally a *reductio* against non-cognitivism: "If moral judgments are desires, they can't be valid premises. Therefore, they are beliefs."

  Sophisticated expressivism responds: "We can construct a logic of desires/plans that mimics a logic of beliefs."

  *   **The Cost of the Solution:** To solve F-G, expressivists must endow "non-cognitive" states with enough structural complexity to sustain logical relations. Blackburn's higher-order attitudes, Gibbard's hyperplans, and Schroeder's "being for" all require moral states to have propositional structure, consistency conditions, and negation operators.
  *   **The Collapse Worry:** If a "plan" or "attitude" has truth-conditions (even if called "satisfaction conditions"), behaves logically like a belief, and is subject to rational norms like consistency, **what distinguishes it from a belief?**
  *   **The Real Dispute:** The realist says: "Nothing. You've reinvented the belief." The expressivist says: "The functional role vis-à-vis motivation."

  This confirms your suspicion: the F-G debate is a proxy war for the **Humean Theory of Motivation**. If moral judgments are belief-like enough to solve F-G, do they still fit the "desire" side of the belief/desire taxonomy? If the taxonomy itself is the problem (i.e., if the mind does not actually divide neatly into cognitive and non-cognitive states), then the entire F-G dialectic is based on a false psychological premise.

  ### 3. What Counts as Progress?
  Given this diagnosis, here is the evaluation of your proposed paths forward:

  *   **An independently motivated test case:** **No.** This will not work. As you noted, the expressivist machinery is flexible enough to accommodate new inference patterns. Any new logical data point can be absorbed by adding complexity to the "plan" or "attitude" structure. This is the "shell game" complaint in action; more data just means more shells.
  *   **A criterion for ad hocness:** **Unlikely to succeed.** Defining "ad hoc" without begging the question is notoriously difficult. The realist says "truth" is natural; the expressivist says "planning" is natural. Both claim their primitive is independently motivated by broader philosophical concerns (metaphysics vs. philosophy of action). There is no neutral arbiter for what counts as a "natural" semantic primitive.
  *   **Recognition that the debate is a proxy war:** **Yes.** This is the only viable path. The debate should shift from *Can expressivism solve F-G?* (Answer: Yes, formally) to *Is the psychological/ontological cost worth it?*

  ### 4. The Honest Verdict
  The impasse is structural. It cannot be resolved within the philosophy of language or formal semantics.

  1.  **Formal Equivalence:** At the level of formal semantics, sophisticated expressivism and cognitivism are often notationally variant. If an expressivist semantics validates exactly the same inferences as a realist semantics, the difference is not logical; it is metaphysical.
  2.  **The Explanatory Burden:** The debate must move to **meta-ethics proper**. The question is no longer "Can you build a logic for it?" but "What is the nature of the state being modeled?"
      *   If the expressivist says the state is a "plan," the realist asks: "Is this plan representational?" If yes, you are a cognitivist. If no, "How does it sustain logic?"
      *   If the expressivist says the state is "non-representational but logic-apt," the realist charges this is mysterious (the "Negation Problem" redux).
  3.  **The Way Out:** Progress requires abandoning the attempt to solve F-G as a *semantic* problem and treating it as a *psychological* one.
      *   **Option A (Psychological Realism):** Empirical work on whether moral judgments actually function like beliefs or desires in the brain. (Though "folk psychology" may not map to neuroscience).
      *   **Option B (Quietism/Pragmatism):** Accepting that the "belief/desire" taxonomy is a tool, not a metaphysical reality. If the taxonomy is merely heuristic, then whether expressivism "really" posits beliefs doesn't matter; what matters is whether the theory helps us navigate normative discourse.
      *   **Option C (Metaphysical Naturalism):** The debate should return to the Queerness Argument. Realists accept the F-G cost because they believe moral properties exist. Expressivists accept the F-G complexity because they believe moral properties are queer. The F-G problem is just the technical skirmish in this larger war.

  ### Conclusion
  Your hypothesis is correct. The F-G problem has been technically solved to the satisfaction of most specialists, but the *philosophical* dissatisfaction remains because the solution forces expressivism to mimic cognitivism so closely that the distinction threatens to vanish.

  **Do not look for a new logical puzzle.** The expressivists can solve it. **Do not look for a semantic criterion.** The definitions are too pliable.

  **The only move that matters is to force the debate onto the terrain of the philosophy of mind and metaphysics.** Ask the expressivist: "In what robust sense is this state *not* a belief?" Ask the realist: "In what robust sense is this property *not* queer?" If they cannot answer those questions without referencing the semantic machinery you've already exhausted, the debate is indeed a verbal dispute disguised as a technical one. The impasse is structural because the technical machinery has outpaced the metaphysical justification for using it.
