answer: |-
  **TO:** Interpretability Research Team  
  **FROM:** [Your Name], Research Engineering  
  **DATE:** October 26, 2023  
  **SUBJECT:** Joint Statement on Feature Ontology and SAE Interpretability  

  ### Preamble

  Over the past month, the team has engaged in rigorous debate regarding the ontological status of features identified via Sparse Autoencoders (SAEs). This document summarizes our current alignment. Its purpose is not to resolve the metaphysical dispute prior to the retreat, but to delineate exactly where our empirical expectations diverge. By isolating the specific observations that would update our respective priors, we aim to convert philosophical disagreement into an experimental roadmap.

  Both the "Realist" and "Deflationist" camps endorse the following framework.

  ---

  ### 1. Agreed Claims (Common Ground)

  Both camps affirm the following operational claims regarding our current methods and results. We agree that regardless of the underlying ontology, the following statements hold:

  1.  **Operational Utility:** SAE-derived features provide a compressed representation of model activations that allows for human-interpretable labeling with higher fidelity than raw neuron inspection.
  2.  **Causal Leverage:** Interventions on SAE features (e.g., activation steering, ablation) produce predictable, statistically significant changes in model output distributions on held-out data from the training distribution.
  3.  **Localization:** Specific features can be localized to specific layers and contexts, correlating with specific semantic concepts or syntactic functions.
  4.  **Criteria for "Discovery":** For the purposes of this research program, we operationally define a feature as **"robustly discovered"** if and only if:
      *   It is recoverable by multiple independent training runs with different random seeds.
      *   It maintains interpretability and causal leverage when tested on out-of-distribution (OOD) inputs that were not present during the SAE training phase.
      *   It aligns with features found via distinct methodological approaches (e.g., dictionary learning vs. probing).
  5.  **Methodological Dependence:** We agree that the specific basis vectors identified depend on hyperparameters (sparsity penalty, dictionary size, architecture). No claim is made that the *exact* vectors are unique, only that the *semantic directions* they approximate may be.

  ---

  ### 2. Statement of Disagreement

  The following table outlines the divergent interpretations of the claims above. Each position is phrased to be acceptable to members of that camp without requiring concession to the other.

  | Topic | Realist Position | Deflationist Position |
  | :--- | :--- | :--- |
  | **1. Existence of a Correct Decomposition** | There exists a ground-truth decomposition of the model's computation into semantic features. Our tools approximate this true basis; error is measured by distance from this latent structure. | There is no single "true" basis. Decompositions are tools selected by trade-offs (sparsity vs. reconstruction). Different useful decompositions exist; none is ontologically privileged. |
  | **2. Interpretation of Steering Success** | Successful steering demonstrates that the feature was already causally active in the model's native computation. We are amplifying existing circuitry. | Successful steering demonstrates that the feature is a *controllable* degree of freedom. It does not prove the feature was a distinct causal unit prior to intervention. |
  | **3. Truth Conditions for "The Model Represents X"** | This statement is literally true if a feature corresponding to concept *X* exists in the model's latent space, independent of our observation. | This statement is pragmatically true if adopting the "Model represents X" framework allows us to accurately predict and manipulate model behavior regarding *X*. |
  | **4. Nature of Polysemanticity** | Polysemanticity is a failure of the model's efficiency or our extraction method; neurons mix features, but the features themselves are monosemantic. | Polysemanticity is a fundamental property of neural superposition. "Features" are convenient slices of a high-dimensional soup, not discrete atoms. |

  ---

  ### 3. Cruxes and Empirical Tests

  We have identified three specific sub-questions (cruxes). Resolution of these questions via the proposed tests would significantly update the priors of at least one camp.

  #### Crux A: Convergence of Independent Solutions
  **Question:** If the "true features" exist independently of the training process, independent SAE training runs should converge on semantically equivalent features (modulo permutation).

  *   **Test:** Train 10 SAEs on the same model activations with identical hyperparameters but different random seeds. Measure semantic overlap (via cosine similarity of decoder vectors and feature activation correlation) and interpretability alignment.
  *   **Realist Prediction:** High convergence. >80% of high-magnitude features will have a direct semantic match across runs.
  *   **Deflationist Prediction:** Low convergence. Features will be functionally equivalent (similar reconstruction loss) but semantically misaligned or rotated differently in each run.

  #### Crux B: Cross-Architecture Recurrence
  **Question:** If features reflect universal computational necessities of language processing, they should recur across different model architectures trained on similar data.

  *   **Test:** Train SAEs on Layer N of Model Family A (e.g., Transformer-LLM) and Layer N of Model Family B (e.g., Mamba or a differently initialized Transformer). Search for 1-to-1 semantic matches (e.g., a "past-tense verb" feature).
  *   **Realist Prediction:** Significant recurrence. Specific semantic features (e.g., "URLs," "negation," "code indentation") will appear in both architectures.
  *   **Deflationist Prediction:** Minimal recurrence. Features will be idiosyncratic to the specific weights and architecture of the host model.

  #### Crux C: Intervention Generalization (OOD)
  **Question:** If a feature represents a pre-existing concept, steering it should affect *all* behaviors related to that concept, not just those correlated during SAE training.

  *   **Test:** Identify a feature labeled "Deception." Train the SAE on a dataset containing known deceptive patterns. Test steering on a *novel* deceptive scenario structurally different from the training set (e.g., if trained on lies about facts, test on lies about intent).
  *   **Realist Prediction:** High generalization. Steering the feature will impact the novel deceptive behavior because the underlying circuit for "Deception" is shared.
  *   **Deflationist Prediction:** Low generalization. Steering will fail or produce noise on the novel scenario because the "Deception" feature is a local fit to the training distribution, not a global circuit.

  ---

  ### 4. Identification of Verbal Disputes

  We judge that a portion of the current friction is verbal rather than substantive. Specifically, the dispute over the phrase **"The model represents X."**

  *   **Diagnosis:** Realists use "represents" to denote *structural isomorphism* (there is a part of the model that corresponds to X). Deflationists use "represents" to denote *predictive utility* (treating the model as if it has X works).
  *   **Proposed Reformulation:** To dissolve this confusion, we propose banning the unqualified phrase "The model represents X" in internal technical documentation.
  *   **Replacement Protocol:**
      *   Instead of "The model represents negation," use: **"We have identified a robust direction in activation space such that interventions along this direction reliably invert negation behavior."**
      *   Instead of "This feature exists," use: **"This feature is recoverable across [specified conditions]."**

  This reformulation allows Realists to assert robustness without committing to Platonic realism, and allows Deflationists to acknowledge utility without committing to constructivism.

  ---

  ### 5. Next Steps

  At the retreat, we will review the initial results of **Test A (Convergence)**. Pending those results, we will allocate compute resources for **Test B (Cross-Architecture)**.

  **Signatories:**

  _________________________ (Lead, Realist Camp)  
  _________________________ (Lead, Deflationist Camp)  
  _________________________ (Mediator/Engineering)
