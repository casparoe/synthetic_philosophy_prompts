answer: |-
  The package is not jointly tenable because the phenomenological heterogeneity claim and the anti-attitudinal stance jointly eliminate the common metric required to sustain the robust cardinal comparability and summation demanded by the hedonist core.

  You face a "common currency" problem: to sum experiences into a single well-being total (1) and place them on a single cardinal scale (5), there must be a unified dimension along which they vary. You have explicitly blocked the two standard candidates for this dimension. By rejecting the attitudinal analysis (3), you deny that the commonality lies in a pro-attitude or mode of regard. By insisting on strong phenomenological heterogeneity (2), you deny that the commonality lies in a specific felt quality or "hedonic tone." Consequently, when you assert that differences in value are purely quantitative (4), you leave "quantity" metaphysically ungrounded—intensity of *what*? If the feels are entirely disparate and not united by an attitude, there is no single property whose intensity can be measured to generate the trade-offs required by (5).

  The clash between (2) and (5) is genuine, while the tension between (2) and (4) is only apparent; (4) is viable only if you can solve the metric problem created by (2). The cheapest repair to restore tenability is to soften (2) rather than (5) or (3). You should argue for a generic "hedonic tone" that persists despite surface-level phenomenological diversity. This costs you phenomenological nuance, as you must defend the existence of a subtle common quality against introspective doubts, but it preserves your policy ambitions (5) and your theoretical distinctiveness from desire-satisfaction theories (3). Alternatively, you could weaken (5) to accept only ordinal or vague comparability; this costs you the precise policy trade-offs central to your project but saves you from having to posit a controversial common sensation. Given your policy aims, you should give up the strong version of (2) first, as defending the absolute absence of a common hedonic tone is harder than defending its presence, and retaining cardinal comparability is essential for your proposed applications.
