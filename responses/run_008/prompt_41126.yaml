      *   *Fuzzy Boundaries:* Species have reproductive isolation. Generations have arbitrary cut-offs (1981 vs. 1982). If the variance is continuous, is it a "kind"?
      *   *Within-Group Variance > Between-Group Variance:* If Millennials differ more from each other than from Boomers, is the category useful/real?
      *   *Cross-Cultural Failure:* If "Millennials" in the US share nothing with "Millennials" in Japan or Brazil, is it a universal kind or a local cultural artifact?
      *   *The "Label" Problem:* If the interactivity depends on the label, but the label is arbitrary, does the kind exist *before* the label?
      *   *Mechanism Failure:* If the proposed mechanism (developmental windows + events) doesn't actually produce convergent traits, the causal story fails.

  4.  **Ranking and Evaluating Defeaters:**

