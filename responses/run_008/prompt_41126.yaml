      *   **Opposing View (Friends/Demographers):** It's all age effects and life-cycle effects. Once controlled for, "generation" does no explanatory work.
      *   **Task:** Identify serious defeaters (not lazy stereotypes). Rank them from fatal to awkward. Advise on concession vs. dismissal. Discuss whether qualifications make the view trivial. Identify unique predictions of the user's view vs. the rival view.
