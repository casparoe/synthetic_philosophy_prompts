          *   *Follow-up:* If he says "Safety is more important," ask who pays the cost.

      *   *Question 8 (The Knockout):* The hardest question.
          *   *Draft:* What if you're wrong?
          *   *Refinement:* Focus on the "Point of No Return." Once a tool is smart enough to hack, does the label matter?
          *   *Follow-up:* Ask for a concrete shutdown mechanism.

  4.  **Review against Constraints:**
