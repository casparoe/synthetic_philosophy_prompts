answer: |-
  Here is a reconstruction and analysis of the Swiss constitutional order based on the four tasks you have set out.

  ### 1. Reconstructing the Implicit Theory of Democratic Authority

  The Swiss system presupposes a **dual theory of sovereignty** that distinguishes between *constituent power* (the power to create or alter the political framework) and *constituted power* (the power to govern within that framework).

  **The People as Compound Demos:**
  The implicit theory holds that "the People" is not a monolithic entity but a compound one. For ordinary legislation, the People is an aggregate of individuals (*Staatsvolk*). Here, legitimacy derives from the equal moral worth of citizens; hence, the simple majority of voters suffices. However, for constitutional amendments, the People is a federation of communities (*Bundesvolk*). Here, legitimacy derives from the voluntary association of pre-existing political units.

  **The Principled Story of Depth:**
  There is a coherent, principled story regarding why the "depth" of change dictates the register used.
  *   **Statutes (Shallow Change):** These govern the daily interaction between the state and the individual. Since the burden and benefit of laws fall primarily on individual shoulders, the individual is the appropriate unit of account. The cantons are merely administrative executors here; their consent is not required for the law to be legitimate, only for it to be challenged (via the 8-canton referendum trigger).
  *   **Constitution (Deep Change):** The constitution defines the existence, boundaries, and competencies of the cantons themselves. To alter the constitution is to alter the contract between the member states. Therefore, the member states (cantons) must speak as corporate entities. If a constitutional change could be imposed by the populous urban cantons alone, the smaller cantons would cease to be partners in a federation and become mere provinces.

  **Legitimacy:**
  Under this theory, an exercise of constituent power is legitimate only if it secures the concurrent consent of the governed *as individuals* (protecting liberal democracy) and the governed *as communities* (protecting federalism). The 2013 defeat of the amendment, despite a popular majority, is described as "the people rejected it" because, in the constitutional register, "the people" *includes* the cantonal majorities. Without them, the specific demos required for constitutional change has not spoken.

  ### 2. Presupposition vs. Compatibility

  **What the Practice Strictly Presupposes:**
  The practice strictly presupposes that **cantons possess political personality distinct from their population.** This is evidenced by the "half-canton" rule. A half-canton counts as half a vote regardless of population size. This implies that the vote belongs to the *community as a legal entity*, not to the sum of its citizens. If the vote were merely an aggregate of citizens, a half-canton with 15,000 people would simply contribute 15,000 votes, not "0.5 votes." The system presupposes that the federation is a pact among states, not just among persons.

  **What is Merely Compatible:**
  The system is *compatible* with several theoretical justifications, though not all fit the data equally well:
  *   **Compact Theory:** (The cantons created the federation). This fits well.
  *   **Counter-Majoritarian Check:** (Protecting regional minorities). This fits the *effect*, but not necessarily the *logic*. If it were merely a check, the 2013 outcome would be described as "the majority was overruled to protect minorities." Instead, it is described as "the people rejected it," implying the majority never existed in the first place.
  *   **Pure Majoritarianism:** (The people is simply the majority of individuals). **This view is ruled out** by the constitutional register's operation. If the people were *simply* the majority of individuals, the cantonal veto would be an undemocratic obstruction. The fact that the system treats the cantonal veto as a definitive expression of "the people's" will contradicts pure majoritarianism.

  **Deciding Among Theories:**
  The divergence in 2013 (Constitution) vs. 2004 (Statute) helps decide among them.
  *   In 2004, cantonal opposition did not stop the law. This rules out a theory that cantons are *always* sovereign partners.
  *   In 2013, cantonal opposition did stop the amendment. This rules out a theory that cantons are *never* sovereign partners.
  *   **Conclusion:** The behavior supports the **Dual Sovereignty Theory** (Constituent vs. Constituted). It is underdetermined between Compact Theory and Corporate Theory, but it decisively rejects the view that the cantonal register is merely a procedural deviation from the "true" popular will. In the Swiss order, the cantonal vote *constitutes* the popular will for constitutional questions.

  ### 3. Consistency of the Two Registers

  **The Logical Tension:**
  Mathematically and philosophically, the two registers are inconsistent if one assumes a single, universal definition of political equality.
  *   **Register 1 (National):** Presupposes "One Person, One Value."
  *   **Register 2 (Cantonal):** Presupposes "One Community, One Value" (regardless of population).
  *   **The Contradiction:** A voter in Uri has 40x the weight of a voter in Zürich in Register 2, but equal weight in Register 1. You cannot hold that citizens are morally equal *and* that their political weight should vary by geography without qualifying the domain of that equality.

  **Can They Coexist?**
  They can coexist only if political equality is **context-dependent** rather than absolute. One must hold that citizens are equal *qua* subjects of the law (statutes), but unequal *qua* members of founding communities (constitution). This requires accepting that the "demos" is a chameleon: it is an aggregate of persons for daily governance and a federation of states for foundational governance.

  **Forced Choice:**
  If forced to choose, the practice suggests the **communitarian reading (Register 2) is the more fundamental constraint** on the system's identity, while the equal-weight reading (Register 1) is the default mode.
  *   *Why?* Because the cantonal veto can override the national majority (2013), but the national majority can override cantonal sentiment on statutes (2004). The cantonal register has the "trump" card on the most critical questions (the existence of the polity itself).
  *   *Which to give up?* To make the system logically consistent, one would naturally have to give up the **equal-weight reading of the first register** in constitutional matters. One must admit that in constitutional votes, citizens are *not* weighed equally. To insist on equal weight universally would require abolishing the cantonal register, which would fundamentally alter the nature of the state (see Task 4). The inconsistency is tolerated because it serves a higher-order consistency: the preservation of the federation.

  ### 4. The Alternative: Straight Aggregative Majoritarianism

  If the cantonal register were abolished and replaced by straight aggregative majoritarianism (national popular vote only for everything):

  **What Would Change:**
  *   **Procedurally:** Constitutional amendments would pass with 50% + 1 of the national vote, regardless of geographic distribution.
  *   **Substantively:** Policy would likely shift toward the preferences of the populous urban centers (Zürich, Geneva, Bern), as the "weight" of rural voters would be normalized.

  **What Would Be Lost:**
  *   **Federal Balance:** Obviously, the protection of small cantons would vanish. They would become permanent minorities unable to block changes detrimental to their specific interests or autonomy.
  *   **Democratic Legitimacy:** This is the crucial question.
      *   *From a Liberal-Individualist view:* Legitimacy would *increase*. Every vote would count equally. The "Uri voter = 40x Zürich voter" distortion would be eliminated.
      *   *From the Swiss Federal view:* Legitimacy would *decrease*. In this view, the federation is a voluntary union of states. If the union can be altered without the consent of the member states, the voluntary nature of the union is compromised. The smaller cantons would no longer be partners but subjects.

  **Conclusion on Loss:**
  The loss would be a loss of **federal legitimacy**, which in the Swiss context is a constitutive part of **democratic legitimacy**. You cannot separate the two without changing the regime type. Abolishing the cantonal register would not just "balance" the system; it would transform Switzerland from a **Federation** (a state of states) into a **Unitary State** with decentralized administration. The loss is not merely functional (balance); it is ontological. The "People" would cease to be a compound entity and become a simple mass, fundamentally altering the source of authority from "consent of the communities" to "will of the majority."
