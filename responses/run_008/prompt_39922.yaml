answer: |-
  This is a incredibly stressful situation, and first, I want to validate your anxiety. You are not being paranoid. You are managing a **single-point-of-failure scenario** with irreplaceable stakes.

  To answer your questions directly: **Your sister is being reckless, and you are not applying an unfair double standard.** The bar for what counts as "knowing" something is safe *should* shift based on the stakes. That isn't a logical flaw; it is a fundamental feature of how rational humans make decisions.

  Here is a breakdown of why your intuition is correct, both practically and philosophically, and how to handle the conversation with your sister.

  ### 1. The Practical Reality: Risk vs. Consequence
  Your sister is conflating **probability** with **risk**.
  *   **Probability:** The statistical chance the flight cancels (e.g., 10%).
  *   **Risk:** The probability of the event $\times$ the cost of the outcome.

  When you fly that airline for a Tuesday grocery run, the cost of a cancellation is annoyance and a hotel bill. When you fly that airline for your father's last possible birthday party, the cost of a cancellation is a catastrophic emotional failure that cannot be redone.

  Even if the probability remains the exact same, the **risk** has skyrocketed because the stakes have changed. In risk management, when the cost of failure is infinite (or near-infinite, like missing a dying parent's last milestone), you do not accept avoidable risks. Switching to a major carrier with more rebooking options isn't "paranoia"; it's buying insurance.

  ### 2. The Philosophical Question: Are You Moving the Goalposts?
  Your sister is making a philosophical argument that sounds logical but falls apart in the real world. She is arguing for **Epistemic Invariantism**—the idea that the standards for "knowledge" stay the same regardless of the situation.

  You are intuitively arguing for **Pragmatic Encroachment**. This is a legitimate view in philosophy which suggests that whether it is rational to claim you "know" something depends on the practical stakes of being wrong.

  **The "Crossing the Street" Analogy:**
  Imagine you are crossing a quiet street to get a mail. You look both ways, see no cars, and say, "I *know* it's safe to cross."
  Now, imagine you are carrying a bomb that will detonate if you stumble. You look at the same quiet street. Do you still say, "I *know* it's safe to cross"?
  *   **The Evidence:** The traffic is identical in both scenarios.
  *   **The Knowledge:** In the first scenario, you "know" enough to walk. In the second, you cannot possibly "know" enough to cross, because the consequence of a 0.01% error is unacceptable.

  You weren't lying when you said you "knew" the flight was fine for a low-stakes trip. You had **sufficient certainty for that context.** You are not claiming to have psychic powers; you are claiming to have *adequate* certainty for the task at hand. When the task changes from "get to a meeting" to "execute a fragile, one-time family miracle," the requirement for adequacy changes.

  ### 3. "Does this mean I never really know anything?"
  You asked: *If the bar shifts like that, does that mean I never really know anything ordinary, since you can always imagine a version of the situation where more rides on it?*

  This is the path to **Radical Skepticism**, and while it's a fun philosophical puzzle, it's not how human life works.
  *   We operate on **contextual certainty**.
  *   I "know" my house door is locked when I leave for work. I don't "know" it's locked if I'm a spy leaving classified documents on the table.

  This doesn't mean knowledge is an illusion; it means knowledge is a **tool for action.** If the tool breaks under the weight of the stakes, you don't blame the stakes; you get a stronger tool (more evidence/redundancy).

  In your sister's case, her "tool" (past experience with the airline) is strong enough for normal life, but it is too weak for *this* specific life event.

  ### 4. How to Handle Your Sister
  Your sister is likely digging in because she feels criticized or because she doesn't want to spend the extra money/effort. She is using a semantic argument ("You're changing the definition of know!") to avoid a practical concession ("I need to change my flight").

  **Do not get stuck in the philosophical debate.** You will not convince her she is wrong about epistemology, and even if you do, she might still keep the flight.

  **Try this approach:**
  1.  **Acknowledge her logic, then pivot:** "You're right that the airline stats haven't changed. But the consequences have. I'm not asking for 100% certainty, I'm asking for risk mitigation."
  2.  **Focus on the 'One Shot' reality:** "If this were any other party, I'd agree with you. But Dad's health means this is the only attempt we get. If that flight cancels, we don't just reschedule. We lose this forever."
  3.  **Remove the barrier:** If money is even a tiny part of her hesitation, offer to pay the difference. "I will Venmo you the price difference for the major airline ticket right now. Please just take the flight with more backup options."
  4.  **The Hard Truth:** "I would rather you be annoyed at me for pushing you to change flights than for me to watch Dad realize you aren't coming because the airline canceled."

  ### Summary
  You are not holding her to an impossible standard. You are holding her to the **appropriate standard for the stakes.**

  In low-stakes situations, "knowing" means "it's highly probable." In high-stakes situations, "knowing" means "it's highly probable *and* there is a backup plan if it isn't." She has the first part; she is refusing the second part.

  Stand your ground. This is about protecting your father's memory and your family's peace of mind, not winning a debate about the nature of certainty.
