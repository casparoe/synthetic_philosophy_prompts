answer: |-
  # The Disposition Classification Tree

  **Instructions:** Begin at the root (Q1). Answer each question based strictly on the physical description of the case. Do not use terms like "fink" or "mask" to answer; describe the mechanics. Follow the branch corresponding to your answer until you reach a leaf.

  ### The Questions

  **Q1. Intrinsic Basis:** Prior to the stimulus, does the object possess the internal physical structure required to produce the manifestation?
  *   **Yes:** Go to Q2.
  *   **No:** Go to Q7.

  **Q2. Counterfactual Outcome:** If the stimulus were to occur, would the manifestation ultimately obtain (be completed)?
  *   **Yes:** Go to Q6.
  *   **No:** Go to Q3.

  **Q3. Basis Stability:** If the manifestation fails to occur, is it because the internal structure identified in Q1 is removed or destroyed by the stimulus (or immediately upon contact)?
  *   **Yes:** **Leaf A (Finkish Disposition)**
  *   **No:** Go to Q4.

  **Q4. Process Onset:** If the manifestation fails to obtain, does the physical process leading to it (e.g., cracking, chemical reaction) begin before being stopped or reversed?
  *   **Yes:** **Leaf B (Interrupted Manifestation)**
  *   **No:** Go to Q5.

  **Q5. Interference Locus:** Is the factor preventing the manifestation generated by the object's own reaction to the stimulus (internal causal chain), or by an external factor?
  *   **Internal:** **Leaf C (Self-Neutralizing Stimulus)**
  *   **External:** **Leaf D (Masked Disposition)**

  **Q6. Causal Source:** Is the manifestation produced by the internal structure identified in Q1, or by a separate external factor that guarantees the outcome regardless of that structure?
  *   **Internal Structure:** **Leaf E (Ordinary Disposition)**
  *   **External Factor:** **Leaf F (Overdetermined Manifestation)**

  **Q7. Basis Acquisition:** If the manifestation occurs despite the lack of initial basis, does the stimulus itself trigger the mechanism that adds the necessary basis or produces the effect?
  *   **Yes:** **Leaf G (Mirror-Image Case)**
  *   **No:** **Leaf H (Mimicker)**

  ***

  ### Walkthrough of Hard Cases

  **1. The Annealer**
  *   **Q1 (Basis):** Yes. (The glass has a fragile molecular structure).
  *   **Q2 (Outcome):** No. (The glass ends up intact).
  *   **Q3 (Basis Stability):** No. (The demon anneals it back together; the fragility is restored, not permanently removed by the strike itself).
  *   **Q4 (Process Onset):** Yes. (The glass begins to crack mid-strike).
  *   **Result:** **Leaf B (Interrupted Manifestation).**
  *   *Note:* The tree classifies this neither as a Fink (basis isn't removed *to prevent* onset) nor a Mask (process isn't blocked *before* onset). It isolates the "mid-stream reversal" feature.

  **2. The Self-Neutralizing Stimulus**
  *   **Q1 (Basis):** Yes. (The poison has a lethal chemical structure).
  *   **Q2 (Outcome):** No. (The victim does not die).
  *   **Q3 (Basis Stability):** No. (The lethality remains; the poison isn't destroyed by swallowing).
  *   **Q4 (Process Onset):** No. (The *lethal* process—systemic failure—does not begin; vomiting is a side effect, not the onset of death).
  *   **Q5 (Interference Locus):** Internal. (The vomiting is the body's reaction to the poison, not an external doctor pumping the stomach).
  *   **Result:** **Leaf C (Self-Neutralizing Stimulus).**
  *   *Note:* This distinguishes the case from a standard Mask (Leaf D), where the interferer is external (e.g., an antidote administered by a doctor).

  **3. The Overdetermined Glass**
  *   **Q1 (Basis):** Yes. (The glass is genuinely fragile).
  *   **Q2 (Outcome):** Yes. (The glass breaks).
  *   **Q6 (Causal Source):** External Factor. (The demon's spell shatters *any* object; the break would have occurred even if the glass were tough).
  *   **Result:** **Leaf F (Overdetermined Manifestation).**
  *   *Note:* The doubt is caught explicitly at Q6. The conditional holds, and the basis exists, but the causal link between them is severed.

  ***

  ### Deliverable 1: The Key & Unoccupied Paths

  **Root-to-Leaf Key**
  *   **Path 1-2-3 (Yes):** **Finkish Disposition.** The object has the disposition, but the stimulus destroys the basis before manifestation.
  *   **Path 1-2-4 (Yes):** **Interrupted Manifestation.** The disposition is real and activates, but an external agent reverses the process mid-stream.
  *   **Path 1-2-5 (Internal):** **Self-Neutralizing Stimulus.** The disposition is real, but the stimulus triggers an internal chain that prevents the manifestation.
  *   **Path 1-2-5 (External):** **Masked Disposition.** The disposition is real, but an external factor blocks the causal route from stimulus to manifestation.
  *   **Path 1-6 (Internal):** **Ordinary Disposition.** The standard case where the conditional analysis holds and tracks the metaphysical reality.
  *   **Path 1-6 (External):** **Overdetermined Manifestation.** The conditional holds, but the manifestation is caused by a preemptive external factor, not the disposition.
  *   **Path 7 (Yes):** **Mirror-Image Case.** The object lacks the disposition, but the stimulus triggers a mechanism that confers it (or its effect) instantly.
  *   **Path 7 (No):** **Mimicker.** The object lacks the disposition, and the manifestation is caused by a factor unrelated to the stimulus's normal triggering role.

  **Analysis of Unoccupied Paths**
  Two logically possible paths in this tree remain unoccupied by standard cases in the literature.
  1.  **Basis Yes / Outcome No / Basis Removed / Process Starts:** This path implies the basis is destroyed by the stimulus, yet the manifestation process begins anyway. This is likely **incoherent**. If the intrinsic basis (e.g., molecular lattice weakness) is removed *instantly* upon stimulus (the definition of a Fink), the physical process dependent on that basis (cracking) should not initiate. If cracking starts, the basis must have persisted long enough to cause it, meaning it wasn't truly "removed" in the Finkish sense.
  2.  **Basis No / Outcome No:** This is the **True Negative**. An object lacks the basis and would not manifest. While logically valid, this is not a "puzzle case" for disposition theory; it is the trivial background against which dispositions are ascribed. Its vacancy in the literature reflects a selection bias toward paradox, not metaphysical impossibility.

  ***

  ### Deliverable 2: Defense of Ordering

  **The Root Choice: Basis vs. Counterfactual**
  I have rooted the tree in **Q1 (Intrinsic Basis)** rather than the Counterfactual conditional ("If $S$, would $M$?"). This is a committed metaphysical choice. Rooting in the Counterfactual (the SCA approach) groups the *Ordinary Case* with the *Mimicker*, *Mirror-Image*, and *Overdetermined* cases simply because the conditional is true in all four. This obscures the fundamental ontological distinction that motivated the post-1994 literature: the difference between having a real property and merely satisfying a conditional. By starting with the Basis, we separate the *Realists* (Ordinary, Fink, Mask, Annealer, Overdetermined) from the *Anti-Realists* (Mimicker, Mirror-Image) immediately. This ordering respects the intuition that dispositions are categorical properties that *ground* the counterfactuals, not the other way around. It forces the user to settle the ontology before assessing the interference, which clarifies why Finks and Masks are problems for the *analysis* but not for the *existence* of the disposition.

  **Flagged Failures**
  No decision tree can perfectly map metaphysical causation without begging the question. I flag two points where the tree relies on user intuition rather than resolving the philosophical tension:

  1.  **Ordinary vs. Overdetermined (Q6):** The tree separates these by asking, "Is the manifestation produced by the internal structure?" In the Overdetermined Glass case, the answer is intuitively "No" (because of the spell). However, this question merely relabels the problem of *causal preemption*. If the spell and the fragility are both sufficient, standard counterfactual tests for causation fail. The tree exposes the distinction but offers no algorithmic test to solve it; it requires the user to already have a theory of causal primacy.
  2.  **Mirror-Image vs. Mimicker (Q7):** The tree distinguishes these by whether the stimulus *triggers* the basis-acquisition. In Martin's Dead Wire, the touch triggers the electro-device. In a Mimicker, a hidden wizard might break the glass regardless of touch. But consider a Mimicker where the wizard waits for the touch to act. The line between "Stimulus triggers the mimicking mechanism" (Mirror-Image) and "Stimulus is the occasion for the mimicking mechanism" (Mimicker) is often a matter of descriptive stipulation rather than structural difference. The tree separates them, but the boundary is porous in complex cases of "finkish mimickers."

  This tree is not a solver of metaphysical puzzles; it is a diagnostic tool to show you exactly where your puzzle lies. If you land on Leaf F, you know your problem is causation, not disposition. If you land on Leaf C, you know your problem is internal causal chains. That precision is the goal.
