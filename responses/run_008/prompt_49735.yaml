prompt: |-
  I'm a final-year PhD student and in three weeks I'm giving the departmental colloquium that's basically functioning as my job talk, so this has recently gone from an abstract interest to something that actually matters for my life. The position I'm defending: when you're unsure between moral theories, you shouldn't just act on whichever theory you currently lean toward — you should treat your decision like a parliament where every theory you have some credence in gets representation, roughly propotional to that credence. But I add two twists that are the actual contribution of the talk: (1) the vote shares are issue-specific rather than global, so a theory's weight varies with the kind of question on the floor — on whether some harm counts as a permissible side effect, the constraint-friendly theories get extra weight, whereas on how to weigh competing outcomes against each other the aggregative theories do; and (2) there's a constitutional tier sitting above the voting: anything that every theory I give non-trivial credence to forbids is off the agenda before parliament even convenes, and anything all of them permit passes without a vote, so the parliament only ever actually votes on a contested middle band. My pitch is that this explains a felt difference we all have — some moral disagreements seem like ordinary political horse-trading, others seem like they're just not up for a vote at all.

  The audience is my department, which is mostly ethicists, and I know them well enough to predict trouble. There are two pretty hard-line Kantians, one Scanlon-flavored contractualist who thinks the whole thing is moot because permissibility is fixed by principles nobody could reasonably reject — and I suspect she'll press that my constitutional tier is either trivial or question-begging, and honestly I can't yet tell which, which scares me. Then there's a consequentialist who keeps telling me the framework is just expected-value maximization over moral theories with the numbers filed off, and a visitor from political theory who cornered me at a reception to say the parliament metaphor is a sleight of hand: proportional representation gets whatever authority it has from actual voters, and nobody voted for my theories, so the metaphor borrows a legitimacy it never earned. Plus the grad students, who will absolutely ask about infinite credences or infinite ethics if I leave any opening.

  Draft my Q&A prep sheet: the objections in roughly the order they'll actually arrive, phrased the way each of these specific people would put it, ranked by how much damage each could do; for each one, a reply I can deliver in about two minutes, plus a note on where that reply is soft and what I should concede up front rather than fight. Also flag the question I'm quietly hoping nobody raises — my fear is it's the one about how I can set the issue-specific weights at all without already deciding, in advance, the very questions the parliament was supposed to settle for me. But if you can see a worse one lurking in my setup, tell me straight, don't sugarcoat it.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Final-year PhD student.
      *   **Event:** Departmental colloquium (functioning as a job talk). High stakes.
      *   **Topic:** Moral Uncertainty / Metaethics. Specifically, a "Moral Parliament" model with two twists: (1) Issue-specific credence/weighting, and (2) A Constitutional Tier (unanimous veto/unanimous permission).
      *   **Audience:** Department ethicists (known entities).
          *   2 Hard-line Kantians.
          *   1 Scanlon-style Contractualist (worries about triviality/question-begging).
          *   1 Consequentialist (thinks it's just expected value maximization).
          *   1 Political Theory Visitor (thinks the metaphor lacks legitimacy/authority).
          *   Grad Students (worries about infinite ethics/credences).
      *   **User's Fear:** The "Meta-Problem" (how to set issue-specific weights without begging the question).
      *   **Request:** Q&A prep sheet. Objections ordered by likelihood/impact. 2-minute replies. Concession points. Identify the *real* killer objection (potentially worse than the user's fear).

  2.  **Deconstruct the Theory:**
      *   *Core:* Moral Uncertainty + Parliamentary Model (Lockhart, MacAskill, etc.).
      *   *Twist 1 (Issue-Specificity):* Credence isn't global. Utilitarianism might have 80% weight on resource allocation but 10% on rights violations.
      *   *Twist 2 (Constitutional Tier):* Unanimous forbid = Veto. Unanimous permit = Automatic. Only contested middle goes to vote.
      *   *Goal:* Explain the phenomenology of moral deliberation (horse-trading vs. off-limits).

  3.  **Drafting the Objections (Persona Matching):**
      *   *Contractualist:* "Your constitutional tier is just 'principles no one could reasonably reject' in disguise. If you need substantive moral agreement to set the constitution, you've already done the moral work." (Threat: Triviality/Circularity).
      *   *Consequentialist:* "This is just My Favorite Theory (MFT) or Expected Choice-Worthiness (ECW) with extra steps. Why not just maximize expected value?" (Threat: Redundancy).
      *   *Political Theorist:* "Where's the authorization? Parliaments derive authority from consent. Your theories didn't consent." (Threat: Metaphorical coherence).
      *   *Kantians:* "You're aggregating the non-aggregatable. Duties aren't vote-shares." (Threat: Category error).
      *   *Grad Students:* "Infinite utility? Credence distribution over infinite theories?" (Threat: Technical explosion).
      *   *The User's Fear (Meta-Problem):* "How do you weight the weights without a higher-order theory?" (Threat: Regress).

  4.  **Ranking by Damage:**
      *   *Highest Damage:* The Contractualist (Scanlonian). If the core mechanism (Constitutional Tier) is question-begging, the whole "twist" collapses. This attacks the *novelty* and *viability*.
      *   *High Damage:* The Meta-Problem (User's fear). If issue-specific weights require prior moral judgment, the parliament is redundant.
      *   *Medium Damage:* The Consequentialist. If it's just EV maximization, it's not a new *normative* guide, just a description. But this is often a "so what?" objection rather than a "false" objection.
      *   *Medium/Low Damage:* Political Theorist. Attacks the metaphor, not necessarily the normative conclusion. Can be deflected as "heuristic."
      *   *Low Damage:* Kantians. They will hate it regardless. Best to contain.
      *   *Low Damage:* Grad Students. Technicalities. Can be bracketed.

      *Wait, I need to find a "Worse One Lurking".*
      *   *Idea:* The "Motivation Problem." If the Constitutional Tier filters out the extreme disagreements, what's left in the "Middle Band"? If the Middle Band is where theories *actually* disagree on action, does the Constitutional Tier leave enough work for the Parliament to do? Or conversely, if the Constitutional Tier is robust, does it swallow the Parliament?
      *   *Better Idea:* **The "Empty Parliament" Objection.** If you have non-trivial credence in incompatible theories (e.g., Hedonic Utilitarianism vs. Kantian Deontology), is there *anything* they unanimously forbid or permit besides the trivial? If the Constitutional Tier is empty, it does no work. If it's full, the Parliament does no work. This is the "Collapse" objection. It's worse than the Meta-Problem because it attacks the *structure* itself, not just the weighting.

  5.  **Developing Replies & Concessions:**
      *   *Strategy:* Be humble but firm on the core insight (phenomenology). Concede technical limitations, defend the conceptual utility.
      *   *Contractualist:* Concede overlap, deny identity. The constitution is procedural, not substantive.
      *   *Consequentialist:* Concede extensional equivalence (maybe), deny intensional equivalence. It's about *deliberation*, not just output.
      *   *Political Theorist:* Concede the metaphor isn't perfect. It's about *internal* authority, not political legitimacy.
      *   *Meta-Problem:* This is the hard one. Need to argue for "reflective equilibrium" or "second-order intuitions" without claiming objective truth.
      *   *The "Worse" Objection (Collapse):* Need to show the Middle Band is non-empty.

  6.  **Refining the Tone:**
      *   Professional, academic, slightly anxious but prepared.
      *   "Job Talk" mode: Show you can handle pressure, admit limits, but stand by the contribution.
      *   Time limits: 2 minutes spoken is roughly 250-300 words.

  7.  **Final Review against Constraints:**
      *   Order by damage/likelihood.
      *   Specific personas.
      *   2-minute replies.
      *   Soft spots/concessions.
      *   Identify the "Worse One."

      *(Self-Correction during drafting)*: I initially thought the Contractualist was the biggest threat. But the "Meta-Problem" (User's fear) is actually the most philosophically damning if true. However, the Contractualist is the one *in the room* who will ask it. I should frame the Contractualist's question *as* the Meta-Problem/Question-Begging hybrid.
      *Actually, the "Worse One Lurking" should be distinct.* Let's go with the **"Vacuity vs. Swamping" Dilemma** regarding the Constitutional Tier. If the tier is strict (unanimity), it's vacuous. If it's loose (non-trivial credence), it swamps the vote. This undermines Twist #2 specifically.

      *Let's re-evaluate the Order.*
      1.  Contractualist (The "Question-Begging" attack on Twist 2). Highest damage because it kills the novelty.
      2.  The "Meta-Problem" (User's fear on Twist 1). High damage, kills the mechanism.
      3.  Consequentialist (Redundancy). Medium damage, makes it boring.
      4.  Political Theorist (Legitimacy). Medium/Low, attacks the metaphor.
      5.  Kantians/Grads. Containment.

      *Wait, the prompt asks for the "Worse One Lurking" separate from the User's fear.*
      Okay, I will identify the **"Vacuity/Swamping" Dilemma** as the worse lurking objection. It attacks the coherence of the Constitutional Tier itself, independent of how weights are set.

  8.  **Drafting the Content:** (Iterative refinement for tone and length).
      *   Make sure the replies sound like spoken defense, not written prose.
      *   Ensure concessions are strategic (show intellectual honesty).

  9.  **Final Polish:** Check against the "Job Talk" stakes. The advice needs to be practical for survival, not just philosophical truth.

  *(Self-Correction on the "Worse One")*: Actually, there's a more fundamental objection. **The "Action-Guidance" Problem.** If the Parliament outputs a decision, why should I follow it? If it's because it maximizes expected choice-worthiness, we're back to Consequentialism. If it's because it's "fair" to theories, why be fair to false theories? This is the "Why care?" objection.
  *Decision:* The "Vacuity/Swamping" is more technical and specific to the *structure* proposed. The "Why care" is general to moral uncertainty. Given the specific twists, the Vacuity/Swamping is more lethal to *this* specific project. I'll stick with that but frame it carefully.
  *Actually, let's look closer at the Constitutional Tier.* "Anything every theory I give non-trivial credence to forbids." If I have 1% credence in Nihilism (nothing is forbidden), the Constitutional Tier is empty. If I have 1% credence in Moral Absolutism (everything specific is forbidden), the Parliament is empty. This is the **"Credence Sensitivity" Objection.** It's devastating. I will highlight this as the "Worse One."

  Okay, let's assemble the sheet.cw
answer: |-
  # Q&A Prep Sheet: Departmental Colloquium (Job Talk)

  **Status:** High Stakes.
  **Goal:** Defend the novelty of the two twists (Issue-Specific Weights + Constitutional Tier) without getting bogged down in general moral uncertainty debates.
  **Tone:** Confident but dialectically humble. Show you can take a hit without collapsing.

  ---

  ### 1. The Contractualist (The "Question-Begging" Attack)
  **Likelihood:** High | **Damage:** Critical
  **Who:** The Scanlonian colleague.
  **The Objection:** "Your Constitutional Tier claims to filter out off-limits options before the vote. But to determine what is 'unanimously forbidden' by your credence set, you first have to interpret what those theories say. If you interpret them robustly enough to generate a veto, you've already made the substantive moral judgment the parliament was supposed to help you make. Isn't this just 'principles no one could reasonably reject' with extra steps? It's either trivial (nothing passes the bar) or question-begging (you smuggle your conclusions into the interpretation)."

  **The 2-Minute Reply:**
  "That's the exact worry I hoped to address with the distinction between *substantive* and *procedural* agreement. I concede that if the Constitutional Tier requires deep theoretical consensus on *why* something is wrong, it collapses. But my claim is phenomenological: there are cases where theories converge on a verdict *despite* divergent reasoning. For example, both a Kantian and a Utilitarian might agree 'don't torture this child for fun,' even if their derivations differ. The Tier doesn't require them to agree on the principle; it requires them to agree on the prohibition in this context.
  I'm not using the Tier to solve hard cases; I'm using it to explain why we don't deliberate about certain hard cases. If the Tier is empty, that's an empirical claim about my credence distribution, not a flaw in the model. I'm happy to concede it doesn't generate *new* moral knowledge, but it explains the *structure* of deliberation—why some things feel like negotiations and others feel like boundaries."

  **Soft Spot / Concession:**
  *   **Concede:** You cannot use the Constitutional Tier to *discover* new moral truths. It is not a decision procedure for the unknown.
  *   **Defend:** It is an explanatory model for the *felt authority* of certain constraints. Don't fight for normativity here; fight for phenomenology.

  ---

  ### 2. The "Meta-Problem" (Your Fear)
  **Likelihood:** Medium-High | **Damage:** Critical
  **Who:** Likely the Consequentialist or a sharp grad student.
  **The Objection:** "You argue for issue-specific weights (Twist 1). But how do you assign those weights? To say Utilitarianism gets 80% weight on resource allocation but 10% on rights violations implies you already know which theory is more reliable in which domain. Don't you need a 'meta-theory' to set those weights? If so, why not just follow the meta-theory directly and skip the parliament?"

  **The 2-Minute Reply:**
  "This is the regress worry, and it's serious. My response is that the weights aren't derived from a higher-order theory, but from *lower-order confidence*. It's not that I know Utilitarianism is 'true' about resources; it's that I have higher *confidence* in my application of it there.
  Think of it like a committee of experts: I might trust the engineer on bridge safety and the lawyer on contracts, not because I have a 'meta-expertise' judging them, but because I recognize the limits of my own competence in each domain. The weights track my epistemic access, not the truth of the theories. I concede this requires robust second-order beliefs. But avoiding that requirement means abandoning moral uncertainty entirely. The Parliament doesn't solve the uncertainty; it manages the uncertainty I inevitably have."

  **Soft Spot / Concession:**
  *   **Concede:** You do not have a formal algorithm for generating these weights.
  *   **Defend:** Neither does Expected Value Maximization (what are the 'units' of choice-worthiness?). Your model is *more* transparent about this arbitrariness than the EV model, which hides it behind cardinal utility assumptions.

  ---

  ### 3. The Consequentialist (The "Redundancy" Attack)
  **Likelihood:** High | **Damage:** Moderate
  **Who:** The EV maximizer.
  **The Objection:** "This is just Expected Choice-Worthiness (ECW) maximization with the numbers filed off. You're weighting theories by credence and aggregating verdicts. Why complicate it with a parliament and a constitution? If the output is the same, Occam's Razor cuts your framework."

  **The 2-Minute Reply:**
  "Extensionally, we might often agree. But intensionally, the deliberative process differs, and that matters for moral psychology and accountability. ECW treats moral theories as utility functions to be summed. My model treats them as *agents* with veto power.
  This explains 'deontic residue.' If I violate a constraint because the Utilitarian vote outweighed it, ECW says I did the right thing. My model says I violated a constitutional veto (if it was unanimous) or outvoted a minority (if not). It preserves the *cost* of the decision. For a job talk, I'll put it this way: If you're hiring me to maximize output, use ECW. If you're hiring me to navigate a department with conflicting values, you need a constitution. I'm modeling the latter."

  **Soft Spot / Concession:**
  *   **Concede:** In "clean" cases with cardinal utility, the outputs may align.
  *   **Defend:** Moral life is not clean. The Parliament model handles incommensurability better than ECW, which forces a common currency.

  ---

  ### 4. The Political Theorist (The "Legitimacy" Attack)
  **Likelihood:** Medium | **Damage:** Low/Moderate
  **Who:** The visitor.
  **The Objection:** "Parliaments derive authority from the consent of the governed. Your theories didn't vote. You're borrowing the legitimacy of democratic representation without the authorization. It's a category error."

  **The 2-Minute Reply:**
  "I appreciate the pushback on the metaphor. I'm not claiming this is political legitimacy; I'm claiming it's *rational* legitimacy. The 'constituents' aren't the theories; the constituent is *me*, the agent, who happens to be fragmented by uncertainty.
  The authority comes from my desire to be rational across my own credence distribution. The metaphor is heuristic, not ontological. If 'Parliament' suggests external authority, call it 'Committee.' The point remains: internal disagreement requires a procedure, not just a calculation. I'm happy to drop the political terminology if it distracts from the structural point about veto powers and weighted voting."

  **Soft Spot / Concession:**
  *   **Concede:** The metaphor is imperfect. Don't die on the hill of "Parliament."
  *   **Defend:** The structural analogy (voting + constitution) holds even if the political authority analogy doesn't.

  ---

  ### 5. The Kantians (The "Category Error" Attack)
  **Likelihood:** High | **Damage:** Low (They are already opposed)
  **Who:** The two hard-liners.
  **The Objection:** "Duties are not vote-shares. You cannot aggregate a categorical imperative with a hypothetical one. By putting them in the same room, you've already misunderstood the Kantian position."

  **The 2-Minute Reply:**
  "I understand that from *within* Kantianism, the duty is absolute. But I am not speaking from within Kantianism; I am speaking from the perspective of an agent who is *unsure* if Kantianism is true.
  From the perspective of uncertainty, the 'absolute' duty becomes 'the duty that applies if this theory is true.' My model respects that by giving it veto power in the Constitutional Tier. If Kantianism is in my credence set, it *does* get a veto on forbidden acts. I'm not diluting the duty; I'm acknowledging my uncertainty about whether it applies. The Parliament is for the uncertainty, not the theory itself."

  **Soft Spot / Concession:**
  *   **Concede:** If they are 100% certain of Kantianism, this model isn't for them.
  *   **Defend:** This model is specifically for the non-ideal agent with non-trivial credence in multiple theories.

  ---

  ### 6. The "Worse One Lurking" (The Vacuity/Swamping Dilemma)
  **Status:** **CRITICAL WARNING.** You asked me not to sugarcoat this. This is more dangerous than your fear about issue-specific weights.

  **The Objection:** "Your Constitutional Tier relies on unanimity among theories you give 'non-trivial credence' to.
  1.  **Vacuity:** If you have even 1% credence in a theory like Nihilism (nothing is forbidden) or Act Utilitarianism (no intrinsic constraints), your Constitutional Tier is **empty**. Nothing is unanimously forbidden. The Tier does no work.
  2.  **Swamping:** If you prune your credence set to exclude those theories to save the Tier, you are arbitrarily defining 'non-trivial.' Furthermore, if the Tier *does* capture things (e.g., 'don't murder'), then the Parliament never votes on the most important issues. The Parliament is left with trivialities.
  Either your Constitution is empty, or your Parliament is irrelevant."

  **Why this is worse:** It attacks the *coherence* of Twist #2 directly. If the Constitutional Tier is the feature that explains the "felt difference" in moral disagreements, and the Tier is structurally doomed to be empty or trivial, your main contribution vanishes.

  **Preparation Strategy:**
  *   **Do not wait for this question.** Pre-empt it in the talk or the opening of the Q&A.
  *   **The Fix:** You must define "Non-Trivial Credence" carefully. Argue that for the purpose of *deliberation*, you bracket theories that are "live options" vs. "philosophical possibilities."
  *   **The Reply:** "I restrict the credence set to *live deliberative options*, not logical possibilities. If I'm genuinely deliberating, I'm not entertaining Nihilism as a live action-guide, even if I can't refute it skeptically. The Parliament is a model of *practical* uncertainty, not *skeptical* uncertainty."
  *   **Concession:** Admit this limits the scope. The model works for "normal" moral uncertainty, not radical skepticism.

  ---

  ### General Advice for the Session

  1.  **Watch the Clock:** 2 minutes is short. If you start rambling, they will interrupt. Practice these replies aloud.
  2.  **The "Job Talk" Signal:** When you concede, do it confidently. "That's a fair limitation, and here's how I plan to address it in the dissertation." This shows you are hireable (can take feedback) and competent (have a plan).
  3.  **Kill the Metaphor if Necessary:** If the Political Theorist or Kantians get stuck on "Parliament," offer to switch to "Weighted Voting System with Constraints." Don't let terminology sink the substance.
  4.  **Grad Students:** If they ask about Infinite Ethics, say: "That's a problem for every normative framework, including EV maximization. I'm bracketing infinity for this model to solve the finite uncertainty problem first." Don't get dragged into the weeds.

  **Final Thought:** Your strongest card is the **Phenomenology**. Keep returning to: "This explains how it *feels* to deliberate." It's harder to falsify than a normative claim. Good luck.
