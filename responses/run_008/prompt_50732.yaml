          *   *Draft:* For a longtime reader, the drift story deserves more weight than it typically receives. It is structurally more robust, requiring fewer assumptions about internal agent formation. However, they are not independent. A world that successfully defuses influence-seeking behavior via strict oversight might be *more* prone to drift, as heavy reliance on proxy-based monitoring accelerates value erosion. Conversely, solving drift requires maintaining human judgment, which might reduce the pressure to build scheming agents. Prioritize the drift story not because scheming is impossible, but because preventing drift guards against both. If we maintain human oversight capacity, we mitigate drift and reduce the opportunity for scheming agents to operate unnoticed.

