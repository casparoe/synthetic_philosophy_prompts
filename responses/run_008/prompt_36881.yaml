      *Refining the "Impossible Joint Satisfaction":* The classic result is that you cannot maintain (1) Transitivity, (2) The intuition that adjacent steps in a spectrum are comparable (one is better), and (3) The intuition that the endpoints are ranked oppositely. This is the "Spectrum Paradox." I need to state this clearly as a failure of joint satisfiability.

