prompt: |-
  so i run a small podcast about big ideas, its mostly regular folks listening, no academics. next week's guest calls himself an ubuntu philosopher -- his whole thing is that personhood is not something you're born with but something you get through your relationships, the community basically makes you a person. i think there's a zulu saying he leans on that translates roughly to a person is a person through other persons. i've been chewing on this for weeks and it kind of bugs me but also pulls me in. here's where i'm at on my own, maybe use this as background: i do feel like a slightly different person around different people, like a watered-down version of myself at work. but when i'm alone hiking i still feel fully myself, so it seems like there's a me that doesn't come from anyone else? also a darker thought: if my personhood comes from the community, what if the community is wrong about stuff -- does thinking for yourself, going against the group, make you less of a person? that seems backwards. and does it mean someone who's lonely or isolated, through no fault of their own, is less of a person? that feels cruel.

  can you act as a professional philosopher specializing in african philosophy and communitarian thought, and help me prep? please brainstorm for a moment before writing, and think carefully about where this view is actually vulnerable, not just surface objections. then draft me eight to ten interview questions that go beyond having him restate his view. i want at least one question on whether he means this as a literal metaphysical claim (like, is a newborn not a full person yet? what about someone in a coma?) or just as an ethical claim about how we ought to live, one on the conformity worry i mentioned, and one on the isolation/loneliness worry. for each question also give me a follow-up keyed to the answer he's most likely to give -- he seems like the type to say the community includes the dead and future generations, which feels to me like a bit of a dodge but i'm not sure why. no generic stuff like how he got into philosophy, my listeners hate that. keep the language conversational, my audience is smart but nobody there has read a philosophy book.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in African philosophy and communitarian thought.
      *   **Task:** Brainstorm vulnerabilities in the guest's view (Ubuntu philosophy), then draft 8-10 interview questions.
      *   **Context:** Small podcast about big ideas, audience is regular folks (no academics), conversational tone.
      *   **Guest's View:** Ubuntu philosophy ("I am because we are"), personhood is acquired through relationships/community, not innate.
      *   **Host's Concerns/Background:**
          *   Feels like different versions of self in different contexts (work vs. hiking alone).
          *   Worry about conformity (if community makes me, does dissent make me less?).
          *   Worry about isolation (are lonely people less human?).
          *   Suspicion of "community includes dead/future" as a dodge.
      *   **Requirements:**
          *   Brainstorm vulnerabilities first.
          *   8-10 questions.
          *   Must go beyond restating the view.
          *   Specific questions required: Metaphysical vs. Ethical claim, Conformity/Dissent, Isolation/Loneliness.
          *   Include follow-ups for each question (keyed to likely answers, especially the "dead/future generations" dodge).
          *   Conversational language (no jargon).

  2.  **Brainstorming Vulnerabilities (Philosophical Analysis):**
      *   *The "Acquired Personhood" Problem:* If personhood is a status you earn through community participation, what happens to those who *can't* participate (infants, disabled, comatose, exiled)? Does this justify exclusion? This is the classic critique of communitarianism (e.g., by Ifeanyi Menkiti vs. Kwame Gyekye).
      *   *The Conformity/Innovation Tension:* If the community defines moral status, how do reformers exist? Mandela, for instance, went *against* the apartheid community to affirm a deeper humanity. If personhood is relational, does dissent fracture the relation and thus diminish personhood? Or does it expand the community's definition?
      *   *Metaphysical vs. Ethical:* Is this a claim about *what exists* (ontology) or *how to behave* (ethics)? If it's ontological, it risks dehumanizing the isolated. If it's ethical, it's a prescription for flourishing, not a definition of humanity. Guests often slide between these to avoid hard answers.
      *   *The "Extended Community" Dodge:* Saying "community includes ancestors and unborn" solves the isolation problem logically but risks making the concept unfalsifiable. If *everyone* is always connected to *someone* (even spiritually), then no one is ever truly isolated, which trivializes the pain of loneliness.
      *   *Agency vs. Constitution:* Does the community *create* me, or does it *nurture* a pre-existing me? The host feels fully themselves hiking alone. This suggests an internal core. Ubuntu needs to account for individual agency without collapsing into Western individualism.
      *   *Bad Communities:* What if the community is corrupt (e.g., a cult, a mob)? If personhood comes from them, does participating in evil make you "more" of a person within that frame? Ubuntu needs a normative standard for *good* relationships, not just *any* relationships.

  3.  **Drafting the Questions (Iterative Process):**
      *   *Tone Check:* Needs to be smart but accessible. No "ontological status," use "what makes you real." No "normative ethics," use "how we should treat each other."
      *   *Structure:* Question + Likely Answer + Follow-up.
      *   *Coverage:* Need to hit the Host's specific worries (Hiking/Alone, Conformity, Isolation, Metaphysical/Ethical) plus broaden the scope.

      *   *Drafting Q1 (The Hook/Definition):* Start with the core saying. "A person is a person through other persons."
      *   *Drafting Q2 (Metaphysical vs. Ethical):* Host requested this. Is it biology or behavior?
      *   *Drafting Q3 (The Baby/Coma Case):* Follow up on Q2. Who counts?
      *   *Drafting Q4 (The Host's Hiking Experience):* Internal sense of self vs. external validation.
      *   *Drafting Q5 (Conformity/Dissent):* Host requested this. What about troublemakers?
      *   *Drafting Q6 (Bad Communities):* Vulnerability brainstorm. What if the group is wrong?
      *   *Drafting Q7 (Isolation/Loneliness):* Host requested this. The cruel implication.
      *   *Drafting Q8 (The "Dead/Unborn" Dodge):* Host specifically mentioned this suspicion.
      *   *Drafting Q9 (Forgiveness/Restoration):* Ubuntu is often linked to Restorative Justice (Tutu). How do you get personhood back if you lose it?
      *   *Drafting Q10 (Application):* What does this mean for the listener tomorrow?

  4.  **Refining the Follow-ups:**
      *   *Constraint:* The prompt asks to anticipate the "dead/future generations" answer and challenge it gently.
      *   *Strategy:* If he says "we are connected to ancestors," the follow-up should ask about the *quality* of that connection compared to a living friend. Does a ghost hug you when you're crying?
      *   *Constraint:* Make sure the follow-ups don't sound aggressive but inquisitive.

  5.  **Review against Constraints:**
