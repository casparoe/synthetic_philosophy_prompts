answer: |-
  # Exam Question: Conceptual Slippage in Microdomains

  **Course:** COGS 450: Concepts and Analogy-Making
  **Assessment:** Take-Home Final
  **Time Allocation:** Approximately 60 minutes
  **Total Marks:** 25

  **Instructions:**
  Read the following description of a microdomain carefully. All information required to answer the question is contained below; no external knowledge of specific cognitive architectures is assumed.

  **The Microdomain:**
  Consider strings of letters drawn from the alphabet {a, b, c}.
  *   **Objects:** Individual letters (e.g., the 'c' in 'abc').
  *   **Sameness Groups:** Maximal contiguous runs of identical letters (e.g., in `aabbcc`, the groups are `aa`, `bb`, and `cc`).
  *   **Properties:** Group length, position (first/last), and neighbors (left/right).
  *   **Transformations:** The only permitted changes are duplicating or deleting material.

  **The Analogy Problems:**
  You are given a source transformation and asked to apply the same rule to a target string.
  1.  **Problem A:** `abc` → `abcc`; therefore `cba` → ?
  2.  **Problem B:** `abc` → `abcc`; therefore `aabbcc` → ?

  In Problem A, the "rightmost letter" and the "rightmost sameness group" are the same object. In Problem B, they differ: the rightmost letter is `c`, but the rightmost sameness group is `cc`.

  **Tasks:**
  (i) Provide the answer for both problems. Explain why Problem B presents a cognitive difficulty that Problem A does not. Defend a preferred answer for Problem B. Note that the alternative answer is not logically impossible; your defense must appeal to the *depth* or *quality* of the analogy rather than strict correctness. (8 marks)

  (ii) Reconstruct the theoretical argument for **fluid concepts** based on this example. Explain why a solver with a fixed vocabulary of predicates and fixed object-to-object correspondences struggles here (specifically regarding underdetermination). Explain what is gained by treating concepts as context-sensitive pressures that trade roles. Present the strongest **incrementalist rebuttal** (that one can simply add predicate remapping as a search operator) and the **fluidist reply** to it. (10 marks)

  (iii) Evaluate the objection that success in such microdomains is an artifact of the domain having been reverse-engineered from the program's strengths. What evidence from outside this microdomain (e.g., natural language, science) would bear on the dispute between fluid and compositional accounts of concepts? (7 marks)

  ***

  # Model Answer

  (i) In Problem A, the answer is `cbaa`. In Problem B, the preferred answer is `aabbcccc`, though `aabbccc` is defensible. Problem A is trivial because the concepts "rightmost letter" and "rightmost group" co-refer; no decision is required. Problem B forces a choice between a literal mapping (copy the letter `c`) and a structural mapping (copy the rightmost unit). The literal answer (`aabbccc`) treats the string as a bag of letters. The slippage answer (`aabbcccc`) treats the string as a structure of groups. The latter is preferred because it preserves the *role* of the transformed object. In the source, the transformed object was the "complete rightmost unit." In `aabbcc`, the complete rightmost unit is the group `cc`, not the atomic letter `c`. Preserving the relational role constitutes a deeper analogy than preserving surface attributes.

  (ii) A solver with fixed predicates struggles because the source string underdetermines the mapping. Nothing in `abc → abcc` explicitly states whether "letter" maps to "letter" or "letter" maps to "group." A fixed system requires pre-defined correspondence rules (e.g., *map letter-to-letter*), but this fails when the target structure demands a shift in granularity. Fluid concepts resolve this by treating categories not as fixed bins but as pressures. The concept "letter" can slip into "group" if the pressure to preserve the "rightmost" role is stronger than the pressure to preserve "object type."

  The incrementalist rebuttal argues this requires no fluidity: one simply adds "map letter-to-group" as another operator in a heuristic search over correspondences. The system tries fixed mappings first; if they fail, it tries remappings. The fluidist replies that this mischaracterizes the cognition. Remapping is not a discrete search step triggered by failure; it is a simultaneous competition where concepts blur *during* perception. The incrementalist view still treats concepts as static symbols that are swapped, whereas fluidity suggests the concepts themselves change definition under contextual pressure.

  (iii) The "reverse-engineering" objection claims these microdomains are rigged to make slippage look necessary, unlike messy real-world cognition. If the domain is designed specifically to trigger pre-programmed slippages, it proves nothing about general intelligence. To adjudicate this, we need evidence from domains not designed for the theory. Natural language metaphor (e.g., "The atom is a solar system") shows spontaneous slippage (nucleus/sun, electron/planet) where roles map but attributes differ. Similarly, in scientific modeling, equations slip between domains (fluid dynamics to economics). If slippage occurs spontaneously in these unconstrained domains without pre-defined remapping operators, it supports the fluid account over the compositional/incrementalist one.

  ***

  # Marking Scheme (25 Marks Total)

  **Part (i): Solutions and Defense (8 Marks)**
  *   **Correct Answers (2 marks):** `cbaa` (Prob A) and `aabbcccc` (Prob B preferred).
  *   **Explanation of Difficulty (2 marks):** Identifies that Prob A has coinciding concepts (letter=group) while Prob B diverges (letter≠group).
  *   **Defense of Preference (4 marks):**
      *   *B Grade:* Argues `aabbcccc` is "better" because it matches the pattern visually or intuitively.
      *   *A Grade:* Explicitly appeals to **role preservation** vs. attribute matching. Explains that the "rightmost unit" role is deeper than the "letter" type. Acknowledges `aabbccc` is valid but shallow.

  **Part (ii): Fluid Concepts and Rebuttals (10 Marks)**
  *   **Fixed Predicate Struggle (3 marks):**
      *   *B Grade:* Says fixed systems can't change rules.
      *   *A Grade:* Identifies **underdetermination**: the source does not fix the ontology (letter vs. group) of the mapping.
  *   **Fluid Concepts/Pressures (3 marks):**
      *   *B Grade:* Says concepts change contextually.
      *   *A Grade:* Describes concepts as **competing pressures** where role-importance overrides type-identity.
  *   **Incrementalist Rebuttal & Reply (4 marks):**
      *   *B Grade:* Mentions adding rules vs. changing concepts.
      *   *A Grade:* Specifies the rebuttal as adding **predicate remapping as a search operator**. The reply must note that fluidity is **simultaneous/perceptual**, not a discrete search step after failure.

  **Part (iii): Ecological Validity (7 Marks)**
  *   **Objection Evaluation (3 marks):**
      *   *B Grade:* Acknowledges microdomains might be artificial/rigged.
      *   *A Grade:* Articulates that if the domain is **reverse-engineered** to match the architecture, it lacks predictive power.
  *   **External Evidence (4 marks):**
      *   *B Grade:* Vague reference to "real life" or "language."
      *   *A Grade:* Cites specific domains like **metaphor** or **scientific modeling** where slippage is spontaneous and unprogrammed, arguing this validates the fluid account outside toy worlds.

  **Grade Boundaries:**
  *   **A (21-25):** Clear distinction between role/type; precise handling of the incrementalist rebuttal (search operator vs. pressure); specific external evidence.
  *   **B (16-20):** Correct answers and general understanding of slippage; rebuttal or evidence is somewhat vague or lacks technical precision regarding underdetermination/search.
  *   **C (12-15):** Answers correct but defense is weak; struggles to articulate why fixed predicates fail; minimal engagement with the objection.
  *   **D/F (<12):** Incorrect answers or failure to address the theoretical components.
