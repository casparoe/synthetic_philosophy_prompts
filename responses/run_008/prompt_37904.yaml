answer: |-
  This procedure isolates regulatory hard stops from ethical choices and forces consultation with affected communities, but it cannot resolve fundamental disagreements about the moral identity of your health system.

  ### The Taxonomy Change Checklist

  **Instructions:** Proceed sequentially. If any step yields a **STOP**, the proposal is rejected or deferred immediately. Do not skip to the vote.

  **1. The Compliance Lock (Hard Stop)**
  *   **Question:** Does federal law, accreditation standard, or vendor schema explicitly forbid this change or mandate a specific value set for this field?
  *   **Sufficient Answer:** A citation of the regulation (e.g., CMS, UDS) or vendor contract clause.
  *   **If Yes:** **STOP.** Reject the proposal. You do not have the authority to proceed.
  *   **If No:** Proceed to Step 2.

  **2. The Harm Check (Safety)**
  *   **Question:** Does collecting or storing this data expose patients to credible risk of discrimination, privacy breach, or clinical error (e.g., wrong lab ranges)?
  *   **Sufficient Answer:** Specific risk scenario (e.g., "Insurance denial," "Stigma in rural clinic") and a mitigation plan (e.g., "Field hidden from external reports").
  *   **If Yes (and no mitigation):** **STOP.** Reject.
  *   **If Yes (with mitigation):** Note mitigation and proceed to Step 3.
  *   **If No:** Proceed to Step 3.

  **3. Recording vs. Enabling (The Nature of the Change)**
  *   **Question:** Are we **Recording** a distinction that exists independently of our forms (e.g., blood type), or are we **Enabling** a new category that helps bring a group into focus (e.g., a new identity or care cohort)?
  *   **Sufficient Answer:**
      *   *Recording:* Evidence that the distinction is stable and observable outside this system.
      *   *Enabling:* A statement of purpose for why creating this category improves care or equity.
  *   **If Recording:** Proceed to Step 4.
  *   **If Enabling:** You must satisfy Step 4 *and* Step 5 to proceed.

  **4. The Voice Check (Deferral)**
  *   **Question:** Have we consulted people who would be classified by this category?
  *   **Sufficient Answer:** Documentation of feedback from patient advocacy groups or community representatives relevant to the category.
  *   **If Recording:** Consultation is recommended but optional.
  *   **If Enabling:** Consultation is **mandatory**. If you haven't asked them, **STOP.** Defer until consultation is complete.
  *   **Rationale:** If the category helps create the group, the group must help define the category.

  **5. The Exit Ramp (Reversibility)**
  *   **Question:** Given the 18-month lock-in and vendor costs, can we undo or modify this if the definition changes or the data proves unusable?
  *   **Sufficient Answer:** A technical plan for deprecation or mapping back to standard codes.
  *   **If Yes:** Proceed to Step 6.
  *   **If No:** **STOP.** Reject unless the benefit is critical and immediate.

  **6. The Jurisdiction Handoff (Value Judgment)**
  *   **Question:** Is this change actually a medical policy or ethical value judgment disguised as a data standard?
  *   **Sufficient Answer:** Determination of whether this defines a *medical condition* or a *social value*.
  *   **If Medical Condition:** **STOP.** Hand off to Clinical Council. Data standards cannot define disease.
  *   **If Social Value:** Proceed to Vote.
  *   **If Data Standard:** Proceed to Vote.

  ***

  ### Application to Current Proposals

  **1. Proposal: Add "Nonbinary" and "X" to Sex Field**
  *   **Step 1 (Compliance):** **STOP/CONDITIONAL.** Federal billing and meaningful use often mandate Male/Female/Unknown for "Administrative Sex."
  *   **Procedure Ruling:** Reject adding "X" to the *Administrative/Legal Sex* field used for billing. **Approve** only if added as a distinct "Gender Identity" field separate from legal sex.
  *   **Reasoning:** Step 1 forbids changing mandated federal values. However, Step 3 (Enabling) and Step 4 (Voice) support a separate field for identity.
  *   **Outcome:** Proposal modified. IT must build a new field, not alter the existing locked schema.

  **2. Proposal: Split "Asian" into Finer-Grained Ethnic Categories**
  *   **Step 1 (Compliance):** Pass. Federal reporting requires minimum standards, but local systems can collect granular data if mapped back to standard codes.
  *   **Step 3 (Recording):** Mostly Recording. These ethnic distinctions exist outside the form.
  *   **Step 4 (Voice):** Pass. Local Asian-American community councils support granularity to address health disparities.
  *   **Step 5 (Exit Ramp):** Pass. Granular data can be aggregated up to "Asian" for reporting; hard to split back down, but low risk.
  *   **Outcome:** **Approve.** Requires vendor confirmation that mapping to OMB standards for federal reports remains intact.

  **3. Proposal: Add "Long COVID" Flag to Problem List**
  *   **Step 1 (Compliance):** Pass. ICD-10 code U09.9 exists.
  *   **Step 2 (Harm):** Pass. Low risk of stigma compared to benefit of recognition.
  *   **Step 3 (Enabling):** **Enabling.** This creates a specific care cohort for resource allocation.
  *   **Step 4 (Voice):** Pass. Patient advocacy groups strongly desire this.
  *   **Step 6 (Jurisdiction):** **STOP.**
  *   **Procedure Ruling:** **Reject.** Hand off to Clinical Council.
  *   **Reasoning:** "Long COVID" is a evolving clinical definition, not a static taxonomy. A custom flag locks in a definition for 18 months that may contradict evolving CDC/WHO guidelines. This defines a medical condition, not a data structure.
  *   **Proposer Reaction:** **Hostile.** Patient advocates will view this as bureaucratic gaslighting denying the reality of their condition.
  *   **Committee Defense:** The procedure identifies this as a clinical policy question. Adopting a custom flag now creates technical debt and potential clinical risk if the definition shifts next year. The Data Committee is not qualified to define disease cohorts.
