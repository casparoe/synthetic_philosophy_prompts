      *(Refining the "Engineer/Quantum" objection)*: This is a classic derailment. Need a specific script for that. "Quantum mechanics limits *measurement*, Fitch limits *conception*."

      *(Refining the "Judge/Evidence" objection)*: Distinguish "Provable in court" from "Metaphysically knowable."

      *(Final Polish)*: Ensure the timing adds up to 90 mins. Ensure the "Dependency Order" is clearly the first section of the output.

      *Wait, one crucial logical step:* The jump from "It is impossible to know (p & ~Kp)" to "All truths are known" is the hardest leap for laypeople.
      Logic:
      1. It is impossible for there to be an unknown truth. (Derived from contradiction).
      2. If there were an unknown truth, it would be possible to know it (by the principle).
      3. Since it's not possible (from 1), there cannot be an unknown truth.
      4. Therefore, all truths are known.
