that marks where the line falls. I'm aware of the literature on adaptive preferences, the sour grapes cases, and I know bioethicists have argued about whether disgust carries moral insight. But is there an established name for the configuration itself — the absence of a non-question-begging criterion for the preference/bias classification in moral contexts, such that the classification gets made ad hoc and effectively inherits the classifier's conclusions?

