  Your observation identifies a structural vulnerability in contemporary normative argumentation, particularly where moral philosophy intersects with behavioral science and policy. You are describing a move where the metaphysical or psychological status of an attitude—whether it counts as a normatively authoritative "preference" or a discountable "bias"—is not determined by antecedent criteria but is instead assigned retroactively to secure a desired normative conclusion. This is a sophisticated critique that sits at the junction of metaethics, moral psychology, and the philosophy of economics. To determine if there is an established name for this configuration, we must canvass the neighboring literatures where the preference/bias distinction is most vigorously contested.

  The most immediate neighbor is the literature on **adaptive preferences**, stemming from the work of Amartya Sen and Martha Nussbaum. This tradition addresses cases where agents report satisfaction with oppressive circumstances (the "happy slave" or "sour grapes" cases). However, this literature focuses on the *formation* of preferences under constraint, not the *classifier's asymmetry* in labeling them. While Nussbaum argues that some preferences should be discounted because they are adaptive, she attempts to provide independent criteria (e.g., lack of genuine choice) rather than admitting the classification tracks the theorist's policy goals. Your observation is not about the existence of adaptive preferences, but about the strategic weaponization of the label itself.

  A second neighbor is the debate over **debunking arguments** in metaethics, associated with Sharon Street and Richard Joyce. These arguments claim that if a moral belief has a certain genealogy (e.g., evolutionary pressure), it is unjustified. The counter-argument, often called the **Parity Objection** or **Self-Defeat Objection**, notes that if evolutionary origins debunk moral beliefs, they also debunk the debunker's logical faculties. While this touches on the symmetry of explanation, it concerns the justification of beliefs rather than the policy-level classification of attitudes as preferences versus biases. It lacks the specific focus on the *administrative* or *rhetorical* switch you describe in nudge units and policy debates.

  The third and closest neighbor is the critique of **Behavioral Welfare Economics (BWE)** and **Libertarian Paternalism**. Scholars like Robert Sugden, Daniel Hausman, and more recently Infante and Lecouteux, have rigorously analyzed the **"Preference Purification"** problem. They argue that distinguishing "true preferences" from "decision errors" (biases) requires a normative model of rationality that the economist cannot derive from behavior alone. Sugden explicitly notes that identifying a bias requires the theorist to impose their own normative standards. However, while this literature identifies the *normative load* of the classification, it does not have a specific canonical term for the *asymmetrical application* where the label flips to match the classifier's desired outcome. It describes the *condition* (normative underdetermination) but not the *configuration* (strategic asymmetry).

  Finally, in social psychology, **Motivated Reasoning** and **Identity-Protective Cognition** (Dan Kahan) describe how people process evidence to fit prior commitments. Yet, these are psychological mechanisms explaining *why* people disagree, not a meta-ethical label for the *normative illegitimacy* of the classification move itself. Similarly, the **Genetic Fallacy** warns against judging truth by origin, but your case is more specific: it is not just judging by origin, but selectively invoking origin (bias) or authenticity (preference) based on the conclusion.

  Because no single established term captures the specific configuration of *conclusion-dependent attitude classification* across these fields, I must coin a term. The phenomenon is not merely status quo bias (a specific cognitive tilt), nor adaptive preferences (a specific formation history), nor the genetic fallacy (a general logical error). It is a specific form of normative circularity where the status of the input is determined by the desired output. I propose the term **Normatively Endogenous Preference Classification**. This term specifies that the classification (preference vs. bias) is endogenous to the normative conclusion sought by the classifier, rather than exogenous based on fixed psychological or genealogical criteria.

  To distinguish this from the neighbors: (i) Unlike **status quo bias**, which is a psychological tendency to prefer current states, Normatively Endogenous Preference Classification is a rhetorical or analytical move made by an observer, not necessarily a cognitive error of the agent. (ii) Unlike **adaptive preferences**, which refers to the agent's internal adjustment to oppression, this concept refers to the external classifier's decision to validate or invalidate that adjustment based on their own goals. (iii) Unlike the **genetic fallacy**, which rejects a claim solely due to its origin, this configuration selectively *accepts* or *rejects* the origin story (bias vs. authentic preference) to suit the conclusion.

  A boundary case where the application is unclear involves unconscious criterion selection. Suppose a policy analyst adopts a consistency test for preferences because they sincerely believe it is objective, but they only noticed this test because it conveniently debiases the opposition's attitudes while validating their own. If the analyst is unaware of the asymmetry, is it Normatively Endogenous Preference Classification? The concept applies if the classification *in fact* tracks the conclusion, regardless of conscious intent, but it becomes empirically indistinguishable from sincere error in such cases. This highlights the epistemic difficulty: the classifier rarely admits the endogeneity, making the concept a critical tool for external analysis rather than self-regulation.

  Verdict: no established term; Normatively Endogenous Preference Classification
