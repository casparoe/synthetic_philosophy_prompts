  10. **Final Polish:** Ensure the ranking is clear and the "fatal" vs "awkward" distinction is sharp. (e.g., Finding a neural correlate of virtue that predicts behavior across contexts would be fatal).

  *(Self-Correction on "Fatal"):* What is truly fatal? If neurobiological markers of "honesty" predict behavior in *novel* high-stakes situations better than situational variables. Or if longitudinal studies show moral behavior stability despite radical situational changes (e.g., war vs peace).

  *(Refining the "Platitude" point):* The claim "Situations matter" is a platitude. The claim "Situations matter *more than we intuitively think*, rendering trait attributions unreliable for prediction" is the substantive claim.

