  2.  **Deconstruct the Core Debate (Situationism vs. Trait Theory):**
      *   *Situationism:* Harman, Doris, Ross & Nisbett. Focus on low cross-situational consistency (Hartshorne & May, Milgram, Darley & Batson). Traits are folk psychological fictions or at best weak predictors.
      *   *Trait Theory (Globalism):* Traditional virtue ethics, Allport, later Five Factor Model (FFM) proponents. Traits exist, are stable, and predict behavior.
      *   *Interactionism/Nuanced Trait Theory:* Mischel (CAPS), Funder, Fleeson. Traits exist but are conditional or density distributions.

  3.  **Drafting the Defeaters (Ranking Fatal to Awkward):**

      *   *Fatal:* High cross-situational consistency *without* aggregation. If single-instance predictions work better than situation variables.
      *   *Severe:* Aggregation works *too* well. If averaging just 3-5 behaviors yields high stability ($r > .80$), situationism's claim that consistency is low becomes a statistical artifact claim.
      *   *Moderate/Awkward:* "If-Then" signatures (Mischel). This concedes stability but locates it in the processing of the situation. Situationists often absorb this ("it's still the situation triggering it").
      *   *Mild:* Thick relationships. Situationists concede stranger/one-off studies are limited, but argue character should show up *especially* there. If it only shows up in thick relationships, is it character or just reciprocal altruism/reputation management?

