prompt: |-
  So, quick bit of context: I'm a backend engineer, no formal philosophy training, just an unhealthy amount of time spent in EA-adjacent rabbit holes. You're an expert decision theorist. Please actually think carefully and work through this properly — brainstorm a bit first rather than just dumping the first thing that sounds wise, and don't just tell me what I want to hear.

  I've been trying to work out my real position on expected value and "fanaticism" by writing down my gut verdicts on a pile of cases, because I've noticed they don't obviously hang together. Here they are:

  1. At work we do expected value reasoning all the time for shipping decisions — rough probabilities, rough payoffs, pick the bigger number. I'm happy with that. Likewise I'd take a 1-in-1000 shot at £1000 over a guaranteed 99p, that just seems obviously right.

  2. Certain £500,000 versus a 50.1% chance at £1 million: I take the certain £500k and I don't think I'm being irrational. Diminishing returns or something.

  3. But with lives I'm the opposite: certain save 100 versus a 51% chance of saving 200, I take the 51%. It's not my risk to be averse to, and the 101st person saved is worth exactly as much as the 1st.

  4. In fact I think saving 10,000 lives is exactly ten times as good as saving 1,000, and saving 10^50 lives is exactly 10^47 times better than saving 10^3, and so on without end — it would be monstrous to think the last life counted less.

  5. Yet if a bloke on the street offers me a 1-in-10^100 chance of 10^102 utils if I hand over my wallet, I refuse, and I think anyone who pays up is basically broken. Same for any bet where the payoff is some cosmic number and the odds are astronomically thin — I refuse no matter how big the expected value gets.

  6. But I'm all for spending billions tracking asteroids, even if the chance of a civilisation-ending impact in a given decade is something like 1 in 100,000. Obviusly worth it.

  7. I also think voting is rational, because of the tiny chance of casting the decisive vote in an election with huge stakes — maybe 1 in 10 million. Still worth the walk.

  8. St Petersburg lottery (keep flipping a coin, payout doubles each heads, no upper bound): I'd pay maybe £20 to play. Definately not the "infinite value, pay anything" answer.

  So: is there one principle that delivers all of these? My own attempt was "maximise expected value, but only over probabilities above some floor, like 1 in a million" — which dies immediately on case 7, and probably on cases I haven't thought of. Can that be repaired, or should I bin it? What's the actual principled line between the asteroid bet and the mugger — is it just "I trust the numbers on the asteroid", and if so does that mean my verdicts are tracking evidence rather than value? And be specific about which of my verdicts has to go if there's a genuine contradiction in here, because I suspect cases 4 and 5 don't sit together but I can't quite see why. I'd also like you to tell me what your principle says about the case I keep flip-flopping on: a genuinely verified, physics-allowed 1-in-10-billion chance of curing all cancer forever, for £1. Is refusing that just fanaticism running in reverse?
