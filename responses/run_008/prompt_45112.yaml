answer: |-
  This is a classic set of intuitions that sits right at the cutting edge of modern decision theory. You have correctly identified that standard Expected Value (EV) theory breaks down at the extremes, but simple heuristics (like probability floors) break down in the middle.

  You asked me to think this through properly and not just tell you what you want to hear. So, I am going to treat your eight cases as data points and try to fit a model to them. Where the model fails, we will have to delete or modify a data point.

  Here is the breakdown of the tension, the proposed principle, and the specific verdict on your contradictions.

  ### Phase 1: Diagnosing the Contradictions

  You suspect Cases 4 and 5 don't sit together. You are right. They are the anchor points of the "Fanaticism Problem."

  *   **Case 4 (Linearity):** You assert that value scales linearly without bound. $V(10^{50}) = 10^{47} \times V(10^3)$.
  *   **Case 5 (Anti-Mugging):** You assert that for sufficiently small $P$ and sufficiently large $V$, you reject the bet regardless of $P \times V$.

  Mathematically, these are incompatible **if** you treat the probability in Case 5 as a fixed, known number. If value is truly linear and unbounded (Case 4), then there *exists* some payoff large enough to justify any non-zero probability (Case 5). If you reject Case 5, you are implicitly either:
  1.  Bounding value (denying Case 4).
  2.  Treating the probability as effectively zero (attacking the input, not the math).

  You also proposed a "Probability Floor" (e.g., ignore anything < 1 in 1,000,000).
  *   **Failure Mode:** Case 7 (Voting). The probability of a decisive vote is often estimated around 1 in 10,000,000 (1 in $10^7$). If you set a floor at 1 in $10^6$, you must stop voting. If you lower the floor to accommodate voting, you open the door to muggings with probabilities of 1 in $10^{20}$.
  *   **Conclusion:** A hard probability floor is not the solution. It cuts off valid long-termist interventions (Asteroids, Voting) along with the nonsense (Mugging).

  ### Phase 2: The Distinguishing Feature (Evidence vs. Value)

  You asked: *"Is it just 'I trust the numbers on the asteroid', and if so does that mean my verdicts are tracking evidence rather than value?"*

  **Yes.** This is the key. Your intuitions are not tracking *decision theory* (how to calculate); they are tracking *epistemology* (what numbers to trust).

  Let's look at the difference between Case 6 (Asteroid) and Case 5 (Mugger):
  *   **Asteroid:** The probability (1 in 100,000) is derived from orbital mechanics, historical cratering rates, and telescope data. It is a **robust estimate**. The model is well-calibrated.
  *   **Mugger:** The probability (1 in $10^{100}$) is a bare assertion. There is no model. In fact, the claim ("I can affect $10^{102}$ utils") is so complex that the probability the *claim itself is nonsense* is vastly higher than 1 in $10^{100}$.

  **The Principle: Epistemic Deflation**
  As the magnitude of the claimed payoff increases, the complexity of the mechanism required to deliver it increases. As complexity increases, the probability that your *model of the probability* is wrong increases faster than the payoff grows.

  In engineering terms: **Signal-to-Noise Ratio.**
  *   **Work/Coin Flip (Case 1):** High signal, low noise. Trust the EV.
  *   **Asteroid/Voting (Case 6, 7):** Medium signal, manageable noise. The models are physical/statistical. Trust the EV.
  *   **Mugger (Case 5):** Zero signal, infinite noise. The probability estimate is not a number; it's a placeholder for "I have no idea."

  ### Phase 3: Reconciling Your Verdicts

  Here is how we map your 8 cases to this principle ("Maximize EV using *robust* probabilities"):

  1.  **Work EV:** **Keep.** Robust models.
  2.  **£500k vs £1M:** **Keep.** This isn't EV error; this is **Concave Utility**. Money has diminishing marginal utility for *you*. You are maximizing expected *utility*, not expected *pounds*. This is standard rationality.
  3.  **100 Lives vs 200 Lives:** **Keep.** Impersonal utility is linear (mostly). You are risk-neutral with others' lives.
  4.  **10^50 Lives:** **Modify.** You can keep the *valuation* (if they exist, they matter) but you must reject the *feasibility*. It is monstrous to say the last life counts less, but it is rational to say the probability of *affecting* $10^{50}$ lives is effectively zero due to model uncertainty.
  5.  **Pascal's Mugging:** **Keep.** Rejected because the probability estimate is epistemically bankrupt.
  6.  **Asteroids:** **Keep.** Accepted because the probability is physically grounded.
  7.  **Voting:** **Keep.** Accepted because the probability is statistically grounded (and the cost is low).
  8.  **St. Petersburg:** **Keep.** Rejected because "infinite payout" requires a counterparty with infinite bankroll, which doesn't exist. It's a model error.

  ### Phase 4: The Sacrifice

  You asked which verdict has to go.

  **You must soften Case 4.**
  You cannot hold that "Saving $10^{50}$ lives is actionable" while also rejecting the Mugger.
  *   If you believe there is a non-negligible chance of affecting $10^{50}$ lives, you are a fanatic by your own definition in Case 5.
  *   To be consistent with Case 5 (Anti-Mugging), you must admit that while $10^{50}$ lives *would* be valuable, the probability of any action you take actually impacting $10^{50}$ lives is so epistemically fraught that the *robust* EV is near zero.

  **The nuance:** Distinguish between **Value** and **Leverage**.
  *   **Value:** Linear. (Case 4 holds as a moral statement).
  *   **Leverage:** Bounded. (Case 5 holds as an empirical statement).
  There is a limit to how much leverage a single human action can have in a causal universe. Claiming leverage of $10^{50}$ requires a causal chain so long that the probability of breakage approaches 1.

  ### Phase 5: The Cancer Case (The Test)

  *Case: A genuinely verified, physics-allowed 1-in-10-billion chance of curing all cancer forever, for £1.*

  Let's run this through the **Epistemic Deflation** filter.
  1.  **Is it verified?** You said "genuinely verified." This removes the Mugger's epistemic problem. We are treating the 1 in $10^{10}$ like the Asteroid probability, not the Mugger probability.
  2.  **Is the payoff bounded?** "Curing cancer forever." Let's estimate the value.
      *   Future humans: Let's be conservative. $10^{10}$ humans over the next 10,000 years.
      *   Life years saved per human: ~40 years (cancer is a major killer).
      *   Total QALYs: $4 \times 10^{11}$.
  3.  **The Calculation:**
      *   $EV = (10^{-10}) \times (4 \times 10^{11} \text{ QALYs}) = 40 \text{ QALYs}$.
      *   Cost: £1.
      *   Cost per QALY: £0.025.

  **Verdict:** **Take the bet.**
  Refusing this is **not** "reverse fanaticism." It is **Probability Neglect**.
  In the Mugger case, you reject because the probability is *untrustworthy*. In the Cancer case, you stipulated the probability is *verified*.
  If you refuse the Cancer case, you are inconsistent with Case 6 (Asteroids). The Asteroid case is accepted because $P \times \text{Value} > \text{Cost}$. The Cancer case is the same structure, just smaller numbers.
  *   Asteroid: Tiny $P$, Huge $V$, High Cost.
  *   Cancer: Tiny $P$, Huge $V$, Tiny Cost.

  If you reject the Cancer case, you are admitting that you are not an EV maximizer at all, but rather a "Possibility Maximizer" (I only care about outcomes that are *likely* to happen). If that's your true position, you must also stop voting (Case 7) and stop asteroid defense (Case 6), because in all three, the *most likely* outcome is that your action does nothing.

  ### Summary of the Unified Principle

  **"Maximize Expected Moral Value, weighting probabilities by their epistemic robustness."**

  1.  **Utility Function:** Linear for lives (Case 3, 4), Concave for personal wealth (Case 2).
  2.  **Probability Handling:**
      *   If the probability is derived from a **calibrated model** (physics, statistics, historical data), trust the EV calculation (Cases 1, 6, 7, Cancer).
      *   If the probability is a **bare assertion** regarding extreme outliers, apply an **Epistemic Penalty**. As the claimed payoff grows, the required causal chain grows, and the probability of model error grows faster than the payoff (Case 5).
  3.  **The Limit:** You must accept that while $10^{50}$ lives matter (Case 4), you effectively have zero ability to impact them reliably. Your "sphere of leverage" is bounded by epistemic certainty.

  ### Final Advice for Your Engineering Brain

  Think of this like **floating-point precision**.
  *   **Case 1 (Work):** Standard floats. Precision is fine. Calculate away.
  *   **Case 6 (Asteroids):** Large numbers, but within representable range. Handle with care, but valid.
  *   **Case 5 (Mugger):** Overflow error. The number $10^{102}$ is so far outside your training distribution that the probability estimate isn't a number, it's `NaN` (Not a Number). You cannot multiply `NaN` by anything.
  *   **Case 4 (Linearity):** This is your data type definition. `LifeValue` is an integer, not a float. It doesn't cap. But your *ability to compute the probability of affecting it* hits `NaN` very quickly.

  **Your Action Item:**
  Keep Case 4 as a moral axiom ("All lives count equally").
  Adopt the "Epistemic Deflation" rule for Case 5 ("I don't believe the probability number").
  **Take the Cancer Bet.** If you don't, you have to admit you aren't doing EV reasoning at all, you're doing "Safe Bet" reasoning, which invalidates your support for Asteroid Defense and Voting.
