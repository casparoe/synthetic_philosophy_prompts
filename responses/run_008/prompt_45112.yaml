      *   *Probability Discounting (Epistemic):* As claims get more extreme, our confidence in the probability estimate should drop faster than the probability itself. This is the "Bayesian Penalty for Complexity" or "Occam's Razor" approach.
      *   *Risk Weighting (Buchak):* Maybe we weight probabilities non-linearly? But the user accepts Case 3 and 7, which suggests linearity in the "normal" range.
