      *   *Tension 3: Probability Thresholds.* The user suggested a floor (e.g., 1 in a million). But Case 7 (Voting, 1 in 10M) violates a 1 in 1M floor. Case 6 (Asteroid, 1 in 100k) fits. Case 5 (Mugging, 1 in 10^100) violates it. So a hard floor doesn't work unless it's *context-dependent*.
