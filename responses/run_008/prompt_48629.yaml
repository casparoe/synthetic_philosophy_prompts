answer: |-
  Here is a decision procedure based on the "Family Resemblance" model, designed for administrative use, followed by the case applications and an analysis of its limitations.

  ### Part 1: The Cluster Resemblance Protocol (CRP)

  **Philosophical Basis:**
  This procedure does not search for a single definition of "sport." Instead, it identifies five "fibers" of resemblance. An application does not need to possess all five, but it must possess enough of them to resemble the paradigm cases (e.g., soccer, swimming, basketball) closely enough to justify public funding under the policy.

  **The Five Fibers:**
  Assessors score each fiber as **0 (Absent)**, **1 (Partial/Incidental)**, or **2 (Central/Defining)**.

  1.  **Bodily Engagement:** Does the activity require physical exertion or motor coordination?
      *   *2:* Gross motor skills, cardiovascular exertion, or high-intensity fine motor coordination (reflexes).
      *   *1:* Low-intensity movement, stretching, or minimal fine motor control.
      *   *0:* Purely cognitive/sedentary with no physical skill component.
  2.  **Competitive Structure:** Is there a mechanism for winning and losing?
      *   *2:* Direct opposition, scoring system, declared winners.
      *   *1:* Self-improvement metrics or indirect comparison.
      *   *0:* Cooperative only, no measurement of outcome.
  3.  **Rule Governance:** Are the activities bound by codified, external rules?
      *   *2:* Standardized rules enforced by third parties (refs/umpires).
      *   *1:* Internal rules or informal agreements.
      *   *0:* Unstructured play.
  4.  **Skill Acquisition:** Does participation require training to improve physical/technical performance?
      *   *2:* Coaching, drills, and measurable physical/technical progression.
      *   *1:* Informal learning or knowledge acquisition.
      *   *0:* No learning curve (e.g., casual recreation).
  5.  **Community Access:** Is the organization open to the public and focused on participation?
      *   *2:* Open membership, public events, non-profit status.
      *   *1:* Restricted membership but community benefit.
      *   *0:* Private club, commercial-only, or closed group.

  **The Decision Matrix:**
  *   **Total Score 8–10:** **Approve.** (Strong resemblance to paradigm sports).
  *   **Total Score 5–7:** **Refer to Council Committee.** (Borderline case; requires value judgment).
  *   **Total Score 0–4:** **Deny.** (Insufficient resemblance).

  **The "Gaming" Check (Primary Purpose Test):**
  Before scoring, ask: *Is the physical component incidental or central?*
  *   *Example:* A chess club doing 5 minutes of stretching is **Incidental** (Score Bodily Engagement as 0).
  *   *Example:* A yoga class where stretching is the activity is **Central** (Score Bodily Engagement as 2).
  *   *Rationale:* This prevents applicants from adding superficial physical elements to mimic sport.

  **Termination Points:**
  *   If **Bodily Engagement** is scored **0**, the maximum possible score is 8. This makes approval impossible (since 8 requires perfect scores elsewhere, which is rare if physicality is absent). *Correction:* To remain true to Family Resemblance, we cannot make one fiber *necessary*. However, for administrative stability, we will treat a **0 in Bodily Engagement** as an automatic **Referral to Committee**, regardless of total score. This acknowledges that "Sport" without *any* physicality is a policy question, not a classification one.

  **Appeal Rationale Generator:**
  Assessors must select one of the following standard phrases for the denial/referral letter to ensure consistency:
  *   *For Denial:* "While the organization demonstrates [Strengths], the activity lacks sufficient resemblance to community sport in the areas of [Weak Fibers], specifically regarding [Specific Missing Fiber]."
  *   *For Referral:* "The application presents a borderline case where the activity shares some characteristics of sport but diverges on [Specific Fiber]. This requires a policy determination on whether this specific type of activity aligns with council priorities."

  ---

  ### Part 2: Running the Procedure on Three Cases

  Here is how your assessors would apply the CRP to the three specific cases you mentioned.

  #### Case 1: Regional Table-Tennis League
  *   **Bodily Engagement:** 2 (Gross motor, reflexes, exertion).
  *   **Competitive Structure:** 2 (Matches, scores, winners).
  *   **Rule Governance:** 2 (International rules, umpires).
  *   **Skill Acquisition:** 2 (Coaching, technique drills).
  *   **Community Access:** 2 (Open league, public venues).
  *   **Total:** 10/10.
  *   **Decision:** **Approve.**
  *   **Rationale:** "The organization demonstrates strong resemblance to paradigm community sports across all five criteria, including significant physical exertion and standardized competition."
  *   **Assessor Consensus:** High. Both assessors agree immediately.

  #### Case 2: Youth Chess Club (3rd Application)
  *   **Bodily Engagement:** 0 (Sedentary, purely cognitive. Stretching is incidental).
  *   **Competitive Structure:** 2 (Tournaments, rankings, checkmate).
  *   **Rule Governance:** 2 (FIDE rules, arbiters).
  *   **Skill Acquisition:** 1 (Knowledge/strategy acquisition, but not *physical* skill).
  *   **Community Access:** 2 (Serves low-income neighborhood, open membership).
  *   **Total:** 7/10.
  *   **Special Condition:** Bodily Engagement is 0.
  *   **Decision:** **Refer to Council Committee.**
  *   **Rationale:** "While the organization demonstrates strong community access and competitive structure, the activity lacks a physical motor component. Under the Cluster Resemblance Protocol, activities with no physical engagement require Council determination to ensure alignment with the 'Physical Activity' mandate."
  *   **Outcome:** You do not get your automatic funding. It goes to the political committee. They might fund it for social reasons, but the *procedure* did not classify it as sport.

  #### Case 3: Esports League (Computer Lab Rental)
  *   **Bodily Engagement:** 1 (High-intensity fine motor coordination/reflexes, but low cardiovascular exertion). *Note: Assessor discretion allows 1 or 2. Let's be generous.*
  *   **Competitive Structure:** 2 (Teams, leagues, winners).
  *   **Rule Governance:** 2 (Game rules, league officials).
  *   **Skill Acquisition:** 2 (Team coaching, reaction time training, strategy).
  *   **Community Access:** 2 (Youth focus, community center location).
  *   **Total:** 9/10.
  *   **Decision:** **Approve.**
  *   **Rationale:** "The organization demonstrates strong resemblance to community sport, particularly in competition, governance, and skill acquisition. While cardiovascular exertion is low, the requirement for high-intensity fine motor coordination satisfies the Bodily Engagement fiber."
  *   **Outcome:** **This is the outcome you said you would not like.** The procedure funds the esports league.

  ---

  ### Part 3: Bias Check and Procedural Integrity

  **Does the procedure support or override your preferences?**
  It overrides them. You wanted to fund the Chess Club (social good) and deny Esports (personal bias). The procedure recommends referring Chess (due to lack of physicality) and approving Esports (due to high motor skill/competition resemblance).

  **Why is this the right behavior for a rule?**
  1.  **Consistency over Preference:** If you fund Chess because it helps low-income kids, you must also fund a low-income Esports league for the same reason. If you deny Esports because "it's just video games," you must deny Chess because "it's just board games." The procedure exposes that your preference for Chess is based on *tradition*, not *classification*.
  2.  **Defensibility:** At an appeal hearing, you can defend funding Esports using the "Motor Skill" fiber. It is harder to defend funding Chess under a "Physical Activity" policy without appearing arbitrary.
  3.  **The "Right" Friction:** A good administrative rule should create friction when an applicant falls outside the core intent of the policy. Chess *is* outside the core intent of "Physical Activity." By forcing it to the Council Committee, the procedure ensures that if it gets funded, it is funded as a *social service* (a value decision), not misclassified as *sport* (a classification decision). This protects the integrity of the sport budget.

  ---

  ### Part 4: Limitations and Gaming

  **Where Family Resemblance Gives No Guidance:**
  The procedure cannot resolve **Value Conflicts**.
  *   *Example:* A competitive knife-throwing club.
      *   **Scores:** High on Bodily Engagement, Competition, Rules, Skill, Community.
      *   **Result:** Score 10/10 -> Approve.
      *   **Problem:** Council may deem it too dangerous or contrary to public safety values.
      *   **Solution:** The procedure classifies it as "Sport," but the Council retains a "Public Interest Veto" separate from the scoring. The procedure tells you *what it is*; the Committee decides *if they want it*.

  **How to Spot "Gaming" (The Checklist Mimic):**
  Applicants will try to mimic surface features to boost their score.
  *   *The "Stretching" Gambit:* A coding club adds 5 minutes of warm-ups to score points on Bodily Engagement.
      *   *Counter:* Use the **Primary Purpose Test**. Ask: "If we remove the physical element, does the activity still function?" If yes (the coding club still codes), the physicality is incidental. Score it 0.
  *   *The "League" Gambit:* A group of friends playing poker create a "Poker League" with rules to hit the Institutionalization fiber.
      *   *Counter:* Look at **Skill Acquisition**. Is there coaching on *physical/technical* skill, or just gambling strategy? If it's gambling, it fails the "Community Health" intent even if it passes the score.
  *   *The "Non-Profit" Gambit:* A commercial gym creates a non-profit arm to hit Community Access.
      *   *Counter:* Verify **Community Access**. Is it truly open, or does the non-profit just funnel members to the paid gym?

  **When to Stop:**
  If an applicant scores 5–7 (The Referral Zone), your assessors must stop. They are not paid to make value judgments on borderline cases. If they try to argue the "spirit" of the policy in this zone, they will be inconsistent. Hand it to the Committee with the note: *"Classification ambiguous. Decision requires policy interpretation regarding [Missing Fiber]."*

  ### Summary for Your Assessors
  1.  **Stop looking for the essence.** There isn't one.
  2.  **Count the fibers.** Use the 5-point checklist.
  3.  **Trust the score.** If Esports scores higher than Chess, fund Esports. If you want to fund Chess, ask the Council to change the policy to "Community Sport, Physical Activity, *and* Strategic Recreation."
  4.  **Write the rationale.** Use the standard phrases. Do not improvise.

  This system will not stop all appeals, but it will shift the argument from "You're wrong about what sport is" (which is philosophical and unwinnable) to "You scored this fiber incorrectly" (which is administrative and fixable).
