answer: |-
  You have identified a sophisticated intertemporal strategy that sits at the intersection of behavioral economics, decision theory, and moral philosophy. While there is no single, canonical term in the academic literature that captures this exact maneuver, it is a recognized dynamic within several frameworks.

  The nearest established concept is **Strategic Precommitment regarding Endogenous Preferences**. However, because that is a mouthful and describes the mechanism rather than the specific tactic of *lowering* consumption to preserve *satisfaction capacity*, I will propose a precise coinage at the end. First, let's map your phenomenon against the existing landscape to show exactly where it fits and where it diverges.

  ### 1. The Theoretical Home: Endogenous Preferences
  In classical economics, preferences are assumed to be **exogenous** (fixed). You like what you like, and you maximize utility based on those static tastes. Under that model, your strategy looks irrational: why deny yourself a good you can afford and enjoy?

  However, in **Endogenous Preference Theory** (championed by economists like Samuel Bowles and philosophers like Jon Elster), preferences are understood to change based on past consumption and experience. This is the mechanism behind the **Hedonic Treadmill** (Brickman & Campbell): as you consume better goods, your reference point shifts, and the same goods yield less utility over time.

  You are treating your preference structure not as a fixed constraint, but as a **state variable** that you can control. You are optimizing not just for current utility, but for the *trajectory* of your future utility function.

  ### 2. Distinctions from Nearest Concepts

  **Vs. Satisficing (Herbert Simon)**
  *   **Simon:** You search until you find an option that meets a threshold $\tau$, then stop. The threshold $\tau$ is usually determined by the distribution of options available.
  *   **You:** You deliberately choose an option *below* $\tau$. Furthermore, you are managing $\tau$ itself. You are treating the threshold as a depletable resource, whereas Simon treats it as a search-termination rule.
  *   **Difference:** Satisficing is about search costs; your strategy is about *adaptation costs*.

  **Vs. Adaptive Preferences / Sour Grapes (Jon Elster)**
  *   **Elster:** "Sour grapes" is a *post-hoc* psychological mechanism. You want the grapes, can't reach them, so you convince yourself they are sour to reduce cognitive dissonance. It is unconscious and reactive.
  *   **You:** Your move is *ex-ante* and conscious. You can reach the grapes (buy the oil), but you refuse them to prevent your palate from changing.
  *   **Difference:** Adaptive preferences are a failure of autonomy (you change your mind because you have to); your strategy is an exercise of autonomy (you constrain your options to keep your mind stable).

  **Vs. Precommitment (Thomas Schelling)**
  *   **Schelling:** In *Ulysses and the Sirens*, an agent binds their future self to prevent succumbing to temptation (e.g., Odysseus tying himself to the mast).
  *   **You:** This is the closest fit. You are binding your future self. However, standard precommitment is usually about resisting a *vice* (smoking, spending). You are using precommitment to resist a *virtue* or a *neutral good* (nice apartment, good oil) because the good itself carries a negative externality (raised standards).
  *   **Difference:** This is **Counter-Hedonic Precommitment**. You are restricting access to positive stimuli to protect future utility.

  **Vs. Defensive Pessimism**
  *   **Psychology:** Defensive pessimists set low expectations to manage anxiety and buffer against disappointment.
  *   **You:** You aren't necessarily anxious; you are calculating. You aren't trying to feel better about a bad outcome; you are trying to keep a bad outcome *satisfying*.
  *   **Difference:** Defensive pessimism is emotional regulation; your strategy is utility engineering.

  ### 3. A Coinage: "Hedonic Capital Preservation"

  Since no existing term captures the specific act of *consuming less to preserve the capacity to enjoy less*, I propose the term **Hedonic Capital Preservation**.

  **Definition:**
  > A strategic decision-making policy wherein an agent deliberately forgoes available, affordable utility-enhancing options in the present, to prevent the endogenous elevation of their reference point (aspiration level), thereby preserving the future utility yield of lower-quality options.

  **Why this fits:**
  *   **"Hedonic":** Relates to pleasure/satisfaction.
  *   **"Capital":** Treats the "ability to be satisfied with ordinary things" as an asset stock that depreciates with use (indulgence) and appreciates with restraint.
  *   **"Preservation":** The goal is not immediate maximization, but maintaining the value of the asset over time.

  ### 4. Rationality: Self-Command or Self-Deprivation?

  Is this rational? It depends on your discount rate and your model of the self.

  **The Case for Rationality (Self-Command):**
  If your utility function is **reference-dependent** (Kahneman & Tversky), then $Utility = Outcome - Reference Point$.
  If $Reference Point_{t+1}$ is a function of $Outcome_t$, then maximizing $Outcome_t$ today raises $Reference Point_{t+1}$, lowering future utility.
  In this model, **Hedonic Capital Preservation** is the mathematically optimal strategy for maximizing *lifetime* aggregate satisfaction, particularly if you anticipate future resource constraints (e.g., you know you won't always be able to afford the nice apartment). It is a form of **intertemporal arbitrage**.

  **The Case for Irrationality (Self-Deprivation):**
  If you view the "self" as a sequence of distinct temporal slices, this strategy privileges the future self at the expense of the present self without the present self's consent. It risks **path dependence**: by denying yourself the good oil now, you may miss out on genuine aesthetic appreciation that cannot be recovered later. If the "treadmill" effect is weaker than you fear, you have simply incurred a net loss of utility.

  **Verdict:** It counts as **Self-Command** (a la Amartya Sen) rather than deprivation, provided it is chosen autonomously to serve a higher-order preference (long-term contentment) rather than driven by fear.

  ### 5. Boundary Cases and Edges

  To ensure this definition holds, we must distinguish it from adjacent phenomena where the classification becomes murky.

  **Boundary 1: Thrift vs. Hedonic Capital**
  *   *Thrift:* I buy cheap oil to save money for other things.
  *   *Hedonic Capital:* I buy cheap oil *even if I have the money*, to save my palate.
  *   *The Edge:* If you tell yourself it's for thrift, but you'd still do it if you were richer, it's Hedonic Capital. If you'd switch to the good oil immediately upon a raise, it's just Thrift.

  **Boundary 2: Fear of Disappointment vs. Strategic Conservation**
  *   *Fear:* "I won't buy the nice apartment because I'm afraid I'll lose it and be sad." (Avoidance of pain).
  *   *Strategy:* "I won't buy the nice apartment because I want the adequate one to remain enjoyable." (Preservation of gain).
  *   *The Edge:* This is the hardest distinction. If the motivation is primarily anxiety reduction, it leans toward **Defensive Pessimism**. If the motivation is maximizing the "satisfaction-per-dollar" ratio of future options, it is **Hedonic Capital Preservation**. The litmus test: If you were guaranteed to keep the nice apartment forever, would you buy it?
      *   If *Yes*: You are practicing Hedonic Capital (you want it, but know you can't keep it).
      *   If *No* (because you still fear the standard rising): You are practicing pure Conservation.
      *   If *No* (because you fear the loss): You are practicing Defensive Pessimism.

  **Boundary 3: Asceticism**
  *   *Asceticism:* I deny myself goods for moral, spiritual, or disciplinary reasons.
  *   *Hedonic Capital:* I deny myself goods for pragmatic utility reasons.
  *   *The Edge:* If the "good" you are preserving is your soul or virtue, it's Asceticism. If the "good" you are preserving is your ability to enjoy a Tuesday night dinner, it's Hedonic Capital.

  ### Summary
  You are practicing a form of **Strategic Precommitment** designed to mitigate **Hedonic Adaptation**. While related to **Endogenous Preference Theory**, the specific tactic of treating one's satisfaction threshold as a depletable resource is best described as **Hedonic Capital Preservation**.

  It is distinct from **Sour Grapes** because it is proactive rather than reactive; distinct from **Satisficing** because it rejects the local optimum; and distinct from **Thrift** because the currency being saved is psychological capacity, not money. It is a rational strategy under a reference-dependent utility model, provided the cost of current deprivation does not outweigh the discounted value of future contentment.
