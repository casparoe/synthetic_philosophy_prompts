  **Q&A Prep: The Ferry Model**
  **Strategy:** Acknowledge partial truth, pivot to argument's specific causal role (coordination/tipping point). Keep replies dense.

  **1. The Epiphenomenal Charge (Intuitionist)**
  *Objection:* "If the bridge does the work, argument is just a press secretary. You haven't saved reasoning from Haidt."
  *Reply:* "Bridges provide motivation, not coordination. Affective concern is local and often conflicting. Argument resolves conflicts between competing bridges (e.g., kinship vs. fairness), tipping the scale toward expansion. It's the ferryman directing traffic, not the engine generating power."
  *Soft Spot:* Hard to empirically separate coordination from motivation.

  **2. The Materialist Redescription (Cultural Evo)**
  *Objection:* "'Cooperative dependence' is just market integration. You've psychologized materialism without escaping it."
  *Reply:* "Material conditions create opportunities, not normative uptake. Markets existed for millennia without abolitionism. The bridge is the psychological recognition of dependence, which argument crystallizes into normativity. Structure enables; argument actualizes the moral potential."
  *Soft Spot:* Risks conceding materialism is the primary driver.

  **3. The Whiggish Trap (Historian)**
  *Objection:* "Every expansion involved fresh exclusions. Your model celebrates progress while ignoring structural violence."
  *Reply:* "I explain the mechanism of change, not its virtue. The ferry model works for exclusion too—argument restricts traffic where bridges are burned. It accounts for contraction as easily as expansion, avoiding Whiggish teleology."
  *Soft Spot:* Undermines the normative weight of the dissertation.

  **4. The Indispensability Proof (Intuitionist)**
  *Objection:* "Show me a case where the bridge existed, but without argument, expansion failed. Prove indispensability."
  *Reply:* "Spontaneous altruism remains local and unstable. Without argumentative framing, concern doesn't generalize to institutional norms. Look at failed reforms where empathy existed but legal rationales didn't cohere. Argument generalizes the particular into policy."
  *Soft Spot:* Counterfactual history is speculative.

  **5. Selection Pressure (Cultural Evo)**
  *Objection:* "Arguments survive because they fit the bridge, not because they cause traffic. You've reversed the selection pressure."
  *Reply:* "Selection explains survival, not propagation. A fit argument still requires active deployment to shift equilibrium. Fitness doesn't equal causation. The ferryman must still row; the boat doesn't move itself."
  *Soft Spot:* Blurry line between selection and causation.

  **6. Defining Argument (General)**
  *Objection:* "You define 'argument' too broadly. Is rhetoric argument? If so, you're back to intuitionism."
  *Reply:* "I mean public reason-giving, not just persuasion. It must claim universality. That distinguishes it from mere emotive triggering. It's about justification to a public, not just activation of a feeling."
  *Soft Spot:* Public reason often masks emotion.

  **7. Moral Regression (General)**
  *Objection:* "Does this model explain moral regression? Or only expansion?"
  *Reply:* "Yes. Bridges decay or are actively destroyed. Argument then justifies contraction. The mechanism is symmetric. The ferry can run in reverse when bridges collapse."
  *Soft Spot:* None really.

  **8. The Infinite Regress (The 'Hope')**
  *Objection:* "If argument needs bridges, how did the first bridge get built? Infinite regress."
  *Reply:* "Bridges are biological/cultural preconditions, not built by argument. Kinship is evolved. Argument starts where biology ends. We don't need argument for the first bridge, only for extending traffic."
  *Soft Spot:* Doesn't explain novel bridges (e.g., animal rights).
