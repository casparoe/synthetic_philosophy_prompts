answer: |-
  Your intuition that "quantum coin flips" feels wrong is actually the strongest argument against your conclusion. This is known in philosophy as the **Luck Objection**. If your choices are not determined by your prior beliefs, desires, and character, but instead hinge on quantum randomness, then they are not *yours*—they are accidents. Freedom requires control, and randomness is the absence of control. Simply breaking the chain of causation does not insert *you* into the gap; it just inserts noise.

  Furthermore, your assessment of compatibilism is slightly off. Compatibilists do not argue that the universe *is* deterministic; they argue that free will is *compatible* with determinism. Their definition of free will usually centers on agency: acting according to your own motivations without external coercion. Whether those motivations were determined or indeterministically generated is secondary to whether *you* owned them. Thus, their work remains relevant even if physics is indeterministic, because they are defining the conditions for moral responsibility, not debating quantum mechanics.

  Additionally, many philosophers are **Hard Incompatibilists**. They agree with you that determinism kills free will, but they also agree with the Luck Objection that indeterminism kills free will. For them, quantum mechanics doesn't save free will; it just changes the source of the problem from fate to chance. Finally, whether quantum effects actually survive decoherence to influence macroscopic brain states is an empirical question, not a settled fact.

  \answer{Equating physical randomness with agential control.}
