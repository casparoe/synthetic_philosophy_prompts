answer: |-
  The stalemate you observe is real, but your hypothesis that it is merely a "standards dispute" slightly underestimates the depth of the trench. This is not simply a disagreement over how to apply the word "real"; it is a clash between two incompatible normative visions of what metaphysics is *for*. The Eternalists (Putnam, et al.) operate under the **Invariance Principle**: if a feature of the world is fundamental, it must not depend on an arbitrary coordinate choice. Since the physics (Minkowski geometry) is invariant, the ontology (what exists) must be the invariant manifold. To them, allowing "reality" to vary by frame is to surrender objectivity to perspective, which looks like solipsism or magic. The Presentists and their successors (Stein, Savitt, et al.) operate under the **Causal Accessibility Principle**: for something to be ontologically definite, it must be causally relevant or locally accessible. To them, treating the future as "real" obliterates the distinction between fact and possibility, rendering agency and uncertainty unintelligible.

  The reason smart people have not budged in fifty years is that the physics cannot adjudicate between these two normative principles. Special Relativity provides the structure of the manifold and the transformation rules, but it does not dictate whether the manifold *is* the ontology or merely a tool for calculating relations between local events. The Eternalists are answering the question, "What is the domain of the fundamental quantifier in our best physical theory?" The Presentists are answering the question, "How do we preserve the intelligibility of temporal experience and agency within that theory?" Because these are different questions, the arguments pass through each other. When an Eternalist points to the manifold, the Presentist says, "That's a model, not reality." When a Presentist points to the light cone, the Eternalist says, "That's a coordinate artifact, not fundamental existence."

  Consequently, this is a **substantively verbal dispute**. It is verbal because the disagreement dissolves if the parties agree on a specific semantic framework (e.g., agreeing that "real" is indexical). It is substantive because the choice of framework carries heavy philosophical costs regarding determinism, agency, and the nature of truth. Progress is currently impossible because neither side can offer a reason to abandon their normative principle without sacrificing a core philosophical value (objectivity for the Eternalist, agency for the Presentist). The debate will likely remain stalled until the meta-philosophical question—"Should ontology track mathematical invariance or phenomenological coherence?"—is itself resolved, which is unlikely to happen via physics.

