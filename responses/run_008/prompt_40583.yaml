  Consider Julian, a junior archivist in a small, paper-based firm, and his supervisor, Ms. Vance, who maintains a "Shadow Routine": whenever Julian begins processing a new box of records, she pulls a chair directly behind him to observe his workflow. Julian possesses two standing character traits: *Meticulousness*, a disposition to correct minor filing errors he notices, and *Initiative*, a disposition to reorganize sections he deems inefficient without asking permission. When Julian spots a filing error (the trigger for Meticulousness), Vance's presence blocks him from touching the file because she insists on verifying every move first; however, Julian's internal urge to fix the error remains frustrated but intact, as he continues to point out the mistakes verbally. Conversely, when Julian identifies an inefficient section (the trigger for Initiative), Vance's immediate physical proximity upon his starting movement causes him to psychologically regress into a passive waiting state; the very opportunity for independent action is nullified by the surveillance, and with it, his impulse to lead vanishes instantly, replaced by a disposition to await instruction, meaning the disposition to take Initiative is not merely blocked but dissolved the moment the triggering conditions arise.

  **Analysis of the Traits**

  For *Meticulousness*, the Simple Conditional Analysis (SCA) states: Julian is meticulous iff, were he to spot an error, he would correct it. In this scenario, the SCA yields a false negative: he spots the error, but does not correct it (Vance stops him). The analysis fails to ascribe the trait he clearly retains. The feature doing the work here is the **external prevention**: Vance's intervention stops the manifestation (the correction) without altering Julian's internal categorical base (his desire and tendency to correct). This is the definition of a mask; the disposition persists through the interference.

  For *Initiative*, the SCA states: Julian has initiative iff, were he to identify inefficiency, he would reorganize. The SCA again yields a false negative: he identifies inefficiency, but does not reorganize. However, the feature doing the work is **internal dissolution**. The trigger (identifying inefficiency) combined with the habit (Vance's shadowing) causes a psychological shift in Julian where the *motivation* to act independently evaporates. He does not merely fail to reorganize; he ceases to be the sort of person disposed to reorganize in that context. The disposition is removed before manifestation, satisfying the definition of a fink.

  **Addressing the Friend's Claim**

  Your friend's claim that the distinction is merely perspectival is incorrect in this case; the distinction marks a genuine ontological difference in the world, specifically regarding the persistence of the subject's categorical base. In the case of *Meticulousness*, the base (the psychological urge) survives the trigger event. In the case of *Initiative*, the base is destroyed by the trigger event. This is not a matter of which trait we are tracking, but a matter of fact about whether the disposition exists at time $t+1$ (after the trigger). If we tracked *Meticulousness* but treated it as a fink, we would be falsely claiming Julian lost his urge to correct errors. If we tracked *Initiative* but treated it as a mask, we would be falsely claiming he still wanted to lead but was stopped. The physical arrangement is identical (Vance sitting behind him), but the causal pathway to the subject's psychology differs based on the nature of the trait itself (correction vs. leadership), rendering the distinction objective, not perspectival.

  **The SCA Repair and Symmetry**

  To repair the Simple Conditional Analysis, a defender must add a *ceteris paribus* clause requiring that the conditions be "suitable" or "non-finking," effectively amending the analysis to: $x$ is disposed to $M$ in $C$ iff, were $C$ to obtain *and the disposition retained*, $x$ would $M$. This repair treats the two traits asymmetrically in application but symmetrically in logic. It treats them symmetrically by acknowledging that SCA fails for both masks and finks without the clause. However, it treats them asymmetrically in verification: to verify *Meticulousness*, we must look past the block to the retained urge; to verify *Initiative*, we must acknowledge the urge is gone. The repair does not rig the case in favor of one reading; rather, it forces us to inspect the internal state of the subject. If the friend insists the distinction is empty, she is implicitly arguing that we cannot inspect that internal state—that all we have is the behavior. But if we accept that character traits involve psychological bases (urges, intentions), the fink/mask distinction is the difference between a blocked engine and a removed engine, a difference that holds even if the car stays parked in both cases.
