king scheme out of 20 that allocates marks across five must-hit points, gives a one-line note for each on how candidates typically botch it, and states explicitly what separates an A answer from a B answer — the dividing line should turn on whether the candidate can articulate the circularity worry about the "fixes which individual" defense in a form the defender would recognize as needing an answer, rather than merely asserting that times and places "seem" non-essential while gametes "seem" essential.
