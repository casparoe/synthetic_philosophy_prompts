  *(Self-Correction on the "Brainstorming" section)*: The prompt asks me to *start* with brainstorming, then draft the memo. I need to make sure the brainstorming looks like my internal reasoning as the philosopher, and the memo looks like the final deliverable.

  *(Refining the "Aggregate" argument)*: Camp A says "Aggregates aren't personal." Camp B says "Aggregates affect persons." The memo needs to say: "Aggregates reduce risk, but do not eliminate it, especially when combined with other data (badge swipes)."

