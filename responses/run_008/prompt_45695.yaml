prompt: |-
  i'm a phd student in linguistics (pragmatics/politeness stuff) and I have this running argument with my flatmate Sanne — she's Dutch, I spent two years in Japan, so you can imagine. We keep going back and forth on whether white lies are actually wrong or whether they're just honesty that's been properly socialized, so lately I've started writing down her rulings to see if she even has a consistent view. Her verdicts so far:

  - at a lab dinner in Kyoto she told the host the food was delicious when it was honestly kind of bland — fine, no question
  - her supervisor asked what she thought of his new draft and she told him straight up that the argument section was a mess — also fine, zero regrets
  - a struggling first-year asked if his chapter was ready to send off and she told him it was basically there when it really wasn't — she admits that one was wrong and feels bad about it
  - right after a visiting Japanese colleague's talk she told him, in front of the whole lab, that he needs to slow down because nobody could follow him — she now says that was the wrong call, should've been private and softened

  next week I get to test her on three new ones:

  1. A friend gives a wedding toast, sits down next to her and asks "how was it, was it ok?" The wedding's over, that exact speech will never happen again, and Sanne thought it flopped. Does she say it was lovely?
  2. Same visiting colleague, two years later. He's been posted in Amsterdam the whole time, and before his next talk he says something like: I've been around dutch people long enough, drop the politeness and tell me, was my talk actually any good? — except this is at a conference in Kyoto, surrounded by his Japanese colleagues.
  3. I ask her, at drinks after a seminar, right in front of the speaker, whether the talk we just sat through was any good. I'm asking for it and I'm Dutch, but the speaker is Japanese and it's her first week visiting the lab.

  Predict her verdicts if you can, but what I really want is the rule she's running. Is it something like "you may mislead whenever the truth wouldn't do the person any actual good"? Or "it's wrong to deprive someone of info they'd want about something they care about — phrase it however, but don't mislead"? Or "read the room, follow its norms, and only ever lie about trivia"? Or maybe a taste-vs-competence line: lie about whether you liked the food, never about whether someone's work is good? Which of these actually fit her record, what does each one predict for my three cases, and if two rules still fit after her answers, what case would I need to split them apart? Also give me your best guess with reasons, I have money riding on case 1.
