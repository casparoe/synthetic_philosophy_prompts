answer: |-
  This is a fantastic dataset. As a fellow pragmatics nerd, I can tell you that Sanne isn't just operating on "Dutch Directness" vs. "Japanese Politeness." If she were, Case B (Supervisor) and Case D (Colleague) would have the same verdict (both are professional competence feedback), but they don't. The variable isn't just the *topic*; it's the *consequence* and the *audience*.

  Here is the breakdown of Sanne's underlying rule, the evaluation of your hypotheses, the predictions for your three test cases, and the tie-breaker you need.

  ### 1. The Underlying Rule: "Actionable Utility + Face Safety"

  None of the four rules you proposed fully capture her record, specifically because of **Case D**.
  *   *Your Rule 1 ("Mislead if truth does no good"):* Fails Case D. The truth *did* do good (he needs to slow down), but she still calls it "wrong."
  *   *Your Rule 2 ("Don't deprive info they care about"):* Fails Case D. He cared about the talk quality, she deprived him of private feedback by making it public/shaming.
  *   *Your Rule 4 ("Taste vs. Competence"):* Fails Case D. That was competence, but she thinks she should have softened/hidden it.

  **Sanne's Actual Algorithm:**
  > **"Tell the truth if it prevents actionable professional harm, BUT only if the delivery preserves the recipient's public face. If no actionable harm exists (social/taste), prioritize face preservation (lie)."**

  She distinguishes between **Functional Truth** (does this change a future outcome?) and **Social Truth** (does this change how we feel right now?).
  *   **Case A (Food):** No functional consequence. Lie protects Positive Face. -> **OK.**
  *   **Case B (Supervisor):** Functional consequence (paper quality). Private/Professional setting minimizes Face threat. -> **OK.**
  *   **Case C (Student):** Functional consequence (submission). Lie causes future harm. -> **Wrong.**
  *   **Case D (Colleague):** Functional consequence (future talks). *But* Public setting maximizes Face threat. -> **Wrong.**

  ### 2. Predictions for Your Three New Cases

  Here is how that rule applies to your test battery.

  **Case 1: The Wedding Toast**
  *   **Verdict:** **Fine to Lie ("It was lovely").**
  *   **Reasoning:** This is the "Case A" parallel. The speech is over; there is zero *actionable utility* to the truth. The friend cannot redo the toast. The truth only inflicts pain (Face threat) with no compensatory functional gain. Sanne's rule prioritizes face when utility is null.
  *   **The Bet:** Put your money here. She will say lying is not just acceptable, but *required* for social cohesion.

  **Case 2: The Visiting Colleague (Kyoto Conference)**
  *   **Verdict:** **Wrong to give the blunt truth *in that setting*.**
  *   **Reasoning:** This is the critical test. While there is *actionable utility* (he needs to improve for future talks) and he has given *consent* ("drop the politeness"), the **Public Face Safety** constraint from Case D overrides consent. He is surrounded by his Japanese colleagues (his in-group). If Sanne critiques him publicly, she damages his standing among his peers, regardless of his request.
  *   **Her Move:** She will likely say the correct move is to say something vague ("You're improving") publicly, and pull him aside privately later for the real feedback.

  **Case 3: You Asking Her (Public, Japanese Speaker Present)**
  *   **Verdict:** **Wrong to answer bluntly.**
  *   **Reasoning:** Even though *you* (the asker) are Dutch and "asking for it," the *target* of the Face Threatening Act (FTA) is the Japanese speaker. Sanne knows from Case D that public critique of a present speaker is a violation of lab norms, regardless of who asks the question.
  *   **Her Move:** She should deflect ("I thought the Q&A was interesting") or soften. If she answers honestly, she violates the "Face Safety" constraint.

  ### 3. The Tie-Breaker Case

  Let's assume Sanne answers Case 2 and 3 as I predicted (prioritizing Face Safety over Truth/Consent). You now have two rules that fit almost everything:

  1.  **The "Cultural Context" Rule:** "In Japanese/High-Context settings, protect face. In Dutch/Low-Context settings, prioritize truth."
  2.  **The "Structural Publicness" Rule:** "Never deliver competence critiques publicly, regardless of culture, if the recipient is present."

  To split these, you need a case where the **Culture is Dutch** but the **Setting is Public**.

  **The Tie-Breaker Scenario:**
  > A **Dutch** colleague gives a talk at a conference in **Amsterdam**. During the Q&A, he says, "I'm not sure if this argument holds, does anyone think it's a mess?" He is looking at Sanne.
  >
  > **Question:** Is it fine for Sanne to say "Yes, the argument is a mess" right then and there?

  *   **If she says "Fine":** She is following the **Cultural Context Rule**. (Dutch norms allow public bluntness among Dutch peers).
  *   **If she says "Wrong":** She is following the **Structural Publicness Rule**. (Public critique is inherently face-threatening, regardless of nationality).

  *My guess:* She'll say "Fine." She's Dutch. Case D was wrong because it was a *Japanese* colleague in a *Japanese* context (or simply because the power dynamic was different). But among Dutch peers, the "Functional Utility" usually trumps "Face Safety."

  ### 4. Summary for your Bet (Case 1)

  **Bet on: She says the lie is Fine.**

  **Why:**
  1.  **Lack of Actionability:** The toast cannot be fixed. The truth has 0% utility.
  2.  **High Face Threat:** Telling a friend their emotional performance flopped is a massive Positive Face threat.
  3.  **Precedent:** This is functionally identical to the Kyoto Lab Dinner (Case A). In Case A, the food was "bland" (negative quality), she said "delicious" (lie), verdict "Fine." The Toast is "flopped" (negative quality), she says "lovely" (lie). The structural symmetry is perfect.

  If she says Case 1 is "Wrong," her system is inconsistent, because she would be prioritizing abstract honesty over concrete feelings in a scenario where honesty serves no function. Given she felt *bad* about Case C (where the lie caused harm), she likely won't mandate a lie in Case 1 (where the truth causes harm).

  Good luck with the data collection. If she deviates on Case 2, you might have to rethink the "Publicness" constraint—consent *might* override face in her model, which would make her more of a pure Gricean than a Brown & Levinson practitioner.
