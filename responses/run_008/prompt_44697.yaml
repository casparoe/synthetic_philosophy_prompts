prompt: |-
  I build risk and uncertainty-quantification pipelines for machine-learning systems, so the vocabulary I'm actually fluent in is: aleatoric versus epistemic uncertainty, calibration, distribution shift, conformal prediction, ensemble disagreement, uncertainty sets over distributions, distributionally robust optimization, CVaR and other risk-sensitive objectives, model misspecification. Last week the Ellsberg paradox stopped being a cocktail-party curiosity for me. I have to sign off on one of two models for a market where we have no labeled holdout data: one whose error distribution is well characterized on a proxy benchmark, and one with better point performance whose behavior we simply cannot validate under deployment conditions. I notice I want the validated one even at some cost in expected performance, and that is exactly the Ellsberg subjects' preference for the urn with known odds.

  Restate the Ellsberg debate in my vocabulary as faithfully as you can: the paradox itself (people who are indifferent between betting on either color within each urn but prefer the known urn for both colors, so no single additive probability assignment fits their preferences), the Ramsey–de Finetti–Savage line that incoherent preferences leave you open to sure-loss bets and so you behave as if you hold ordinary additive subjective probabilities, and the ambiguity-aversion response on which a rational agent maximizes the minimum expected utility over a set of priors. Give the counterpart in my toolkit of each piece — a set of priors as an uncertainty set over distributions, sure-loss vulnerability as what exactly, an ambiguity premium as a robustness margin? Then give me the residue report: which claims translate cleanly, which come over only with distortion, and which have no expression at all — in particular, whether the normative question (is preferring the known odds irrational?) can even be posed in a vocabulary whose standing response to ambiguity is "collect more data or widen the uncertainty set." I want to know whether my working suspicion — that ambiguity aversion is just distributional robustness with extra steps — is right, or whether it misses what the philosophers are actually arguing about.

  After the prose, append a brief structured summary as a JSON object with the following fields. First, "entries": an array of objects, one per major claim you translated, each with "claim" (the claim from the philosophical debate), "translation" (its rendering in my vocabulary), "status" (one of "clean", "distorted", or "inexpressible"), and "note" (one sentence on what the rendering does to the claim). Second, "residue_verdict": one of "target vocabulary defect", "original claim less clear than it looked", or "live disagreement both vocabularies should host", with a one-sentence justification. Third, "my_suspicion": your one-sentence verdict on whether ambiguity aversion is just distributional robustness.
