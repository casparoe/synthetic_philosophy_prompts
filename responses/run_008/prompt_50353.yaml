answer: |-
  # Origin Essentialism: A Diagnostic Decision Tree

  **Instructions:** Start at the top. Answer **Yes** or **No** to each case based on your immediate intuition about whether the person described would be *you* (or whether *you* would exist in that scenario). Follow the arrows to your philosophical position.

  ### The Cases
  1.  **IVF Mix-up:** Your embryo is swapped at the clinic for a genetically distinct one, but gestated by your mother and raised by your parents.
  2.  **Lab-Built:** A person is grown in a lab with your exact DNA sequence, but synthesized from chemicals with no causal chain to your actual gametes.
  3.  **Different Sperm:** You result from your mother's actual egg, but a different sperm cell from your father.
  4.  **Conception Delay:** Your actual gametes unite, but conception occurs three months later than it actually did.
  5.  **Frozen Embryo:** Your actual zygote is frozen and implanted into your mother a decade later than it actually was.
  6.  **Different Parents:** You result from a completely different sperm and egg from two different people.
  7.  **Spontaneous Duplicate:** A molecule-for-molecule duplicate of you pops into existence in a distant galaxy with no causal connection to your life.
  8.  **Qualitative Twin:** In a world where your parents never met, they have a different child who is qualitatively identical to you in every way.

  ---

  ### The Decision Tree

  **START:** Would the person in **Case 1 (IVF Mix-up)** be *you*?
  *   **NO** (Origins/Gametes matter) → Go to **Case 3**.
  *   **YES** (Genetics/Gestation matter) → Go to **Case 2**.

  **BRANCH A (Origins/Gametes):**
  *   **Case 3 (Different Sperm):** Would that person be *you*?
      *   **NO** → Go to **Case 4**.
      *   **YES** → Go to **Case 6**.
  *   **Case 4 (Conception Delay):** Would that person be *you*?
      *   **NO** → Go to **Case 5**.
      *   **YES** → **Cut-off View (Temporal Tolerance)**.
  *   **Case 5 (Frozen Embryo):** Would that person be *you*?
      *   **NO** → **Strict Gamete Essentialism**.
      *   **YES** → **Cut-off View (Temporal Tolerance)**.
  *   **Case 6 (Different Parents):** Would that person be *you*?
      *   **NO** → **Cut-off View (Gamete Tolerance)**.
      *   **YES** → Go to **Case 7**.
  *   **Case 7 (Spontaneous Duplicate):** Do *you* exist in that scenario?
      *   **NO** → **Cut-off View (Gamete Tolerance)**.
      *   **YES** → **Full Origin Inessentialism**.

  **BRANCH B (Genetics/Gestation):**
  *   **Case 2 (Lab-Built):** Would that person be *you*?
      *   **NO** → **Gestational Essentialism** (The womb matters, not the DNA).
      *   **YES** → Go to **Case 8**.
  *   **Case 8 (Qualitative Twin):** Do *you* exist in that scenario?
      *   **NO** → **Genetic Essentialism**.
      *   **YES** → **Full Origin Inessentialism**.

  ---

  ### The Leaves (Philosophical Positions)

  *   **Strict Gamete Essentialism:** You must come from *this* specific sperm and *this* specific egg. (Kripke's standard view).
  *   **Cut-off View (Tolerance):** Small changes to origin (time, slight genetic variation) are permissible, but large changes (different parents) are not. (Often motivated by Sorites worries).
  *   **Genetic Essentialism:** Your DNA sequence is what makes you you; the specific physical gametes or causal history do not matter.
  *   **Gestational Essentialism:** The specific biological process of gestation matters more than the specific DNA. (Rare, but logically possible).
  *   **Full Origin Inessentialism:** Your origins are entirely contingent; you could have had completely different parents or no biological origin at all.
  *   **Incoherent/Unexplored:** (See Caveats below).

  ---

  ### Caveats & Notes for Discussion

  **1. The Lewis vs. SQML Split (Cases 7 & 8)**
  *   **Standard Quantified Modal Logic (Kripkean):** Identity is transworld. If the origin differs, it is a *different individual*. You should answer **NO** to Cases 7 and 8.
  *   **Counterpart Theory (Lewis):** Identity is world-bound; "could have been" asks about *counterparts*. Since counterparts are defined by similarity, a Lewisian may comfortably answer **YES** to Cases 7 and 8 (depending on context), even if they deny strict identity.
  *   *Discussion Point:* If a Lewisian answers "Yes" here, do they land on **Full Origin Inessentialism**? Technically no—they land on **Counterpart Compatibilism**, which looks identical on this tree but relies on a different metaphysics.

  **2. Indistinguishable Leaves**
  *   **Genetic Essentialism vs. Cut-off (DNA):** This tree cannot separate someone who thinks *only* DNA matters from someone who thinks DNA matters *plus* small temporal tolerances. Both will answer Yes to Case 2. You will need to ask follow-up questions about time-delays (Case 4) to separate them.
  *   **Full Inessentialism vs. Counterpart Theory:** As noted above, a Lewisian and a Haecceitist Inessentialist will traverse the tree identically. The tree sorts *intuitions*, not *metaphysical justifications*.

  **3. The "Unexplored" Combo**
  *   **Lab-Built YES + Different Sperm NO:** If you claim a lab-built clone is you (Case 2), but a different sperm is not (Case 3), your view is likely **incoherent**. If the physical gametes don't matter in the lab case, why do they matter in the natural case? This privileges the *process* over the *product* without clear justification. We have flagged this path to merge into **Genetic Essentialism** for simplicity, but be prepared to defend the inconsistency.
