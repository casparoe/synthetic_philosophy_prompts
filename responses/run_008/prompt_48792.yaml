answer: |-
  Ola tapped her pen against the notebook. "Here's the trouble, Sam. When I say 'I'm seeing red,' that utterance is a physical event. Muscles, air, neurons firing. You say qualia don't push physical stuff. So the redness itself played no role in producing the sentence. Why isn't my claim just a lucky guess? How do I *know* I'm seeing red if the redness didn't tell my mouth to say it?"

  Sam leaned back, stirring his coffee. "You're assuming knowledge requires the object to cause the belief directly. But look at the common cause. The neural state N causes both the utterance 'I see red' and the qualitative experience of redness. They're parallel effects of a single physical source. My report tracks the quale as reliably as a shadow tracks a walker."

  "Reliably in this world, sure," Ola said, leaning forward. "But knowledge requires counterfactual sensitivity. If the qualia had been different—say, green instead of red—while the physical state remained identical, you'd still say 'red.' Epiphenomenalism flatly denies that your report would change if the feeling changed. So you aren't tracking the qualia; you're tracking the neurons, and hoping they correlate."

  Sam paused. "But that counterfactual scenario is nomologically impossible. The nearest possible worlds where the qualia differ are worlds where the physical base differs too. You can't hold the brain fixed and vary the experience if supervenience holds. So, in every world where I'm physically identical, I have the same qualia and make the same report. The tracking never actually breaks."

  "Convenient modality," Ola muttered. "But let's get concrete. The fridge hum. You stop noticing it after an hour. You only notice it when it stops. Is your judgment 'there's no hum now' caused by the *absence* of the hum? Absences are tricky causes."

  "Absences are relational changes," Sam said. "The auditory cortex stops firing in a specific pattern. That physical change causes the report."

  "Right. But apply that to qualia. If I have a constant pain, or a constant color tint in my vision, do I stop 'noticing' it too? What could noticing even be for an epiphenomenalist, given that noticing looks like a causal relation between the experience and attention?" Ola frowned. "If the quale doesn't cause the attention shift, why does the attention shift align with the quale's presence? If the hum's qualia persist but I stop noticing, have I lost knowledge of them?"

  Sam rubbed his temple. "Noticing isn't the quale causing thought. It's the physical system flagging its own state. The quale is just... what it's like to be that flagged state. I grant the language is awkward. But the structural isomorphism remains."

  "Isomorphism doesn't give you truth conditions," Ola said. "Consider inverted qualia without physical difference. Same brain state, you feel pain, I feel itch. You say 'pain,' I say 'pain.' According to you, we're both right about our brains, but wrong about our experiences matching. Or are we?"

  Sam sighed. "I bite the bullet. If the physical state is identical, the report is identical. If the qualia are inverted, we both speak truthfully about our own inaccessible interiors. We can't know the difference, but the difference exists."

  "That's a big bullet," Ola said. "It makes the community of minds solipsistic."

  "And your identity theory makes consciousness disappear into syntax," Sam shot back. "At least I keep the redness red."

  They sat in silence for a moment, the fridge humming softly in the background.

  "Look," Sam said finally. "I'll concede this: The counterfactual account of knowledge is the hardest thing for my view to swallow. If knowledge requires that the fact *makes* the belief true causally, I might not have knowledge. I have reliable correlation, but maybe not justification."

  Ola nodded slowly. "And I'll concede this: Your common-cause model explains the *correlation* better than I give you credit for. It saves the phenomenon of why we talk about qualia at all, even if it strips the normativity. You explain the behavior better than I explain the feeling."

  "So we're both half-wrong," Sam said.

  "Standard Tuesday," Ola replied, closing her notebook. "Coffee?"
