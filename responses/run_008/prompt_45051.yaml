  # Joint Statement on Fitch's Paradox of Knowability

  **1. Agreed Claims**
  Both parties affirm the following without reservation:
  1.  **Validity:** The formal derivation showing that "All truths are knowable" entails "All truths are known" is logically valid.
  2.  **Falsity of Omniscience:** It is false that all truths are currently known. Human agents are not omniscient.
  3.  **Necessary Revision:** Consequently, at least one premise in the derivation must be rejected, restricted, or reinterpreted.
  4.  **History:** The argument was formulated by Alonzo Church (c. 1945) and published by Frederic Fitch (1963); credit is acknowledged to both.

  **2. Live Disagreements**
  The following table outlines the specific points where consensus breaks down. Each party signs only their own column.

  | Issue | Realist Position | Verificationist Position |
  | :--- | :--- | :--- |
  | **The Knowability Principle** | The principle "All truths are knowable" is false. Some truths are inherently unknowable. | The principle is true, but "truth" implies potential warrant, not mind-independent fact. |
  | **Nature of Truth** | Truth is bivalent and evidence-transcendent. A statement is true or false regardless of our ability to prove it. | Truth is epistemic. A statement is true only if there is, in principle, evidence sufficient to warrant asserting it. |
  | **The Contradiction** | The paradox proves Verificationism is incoherent. | The paradox proves the classical logic used in the derivation misrepresents epistemic concepts. |

  **3. Cruxes and Test Cases**
  Settling the following questions would resolve the dispute. We record our current predictions on these concrete cases.

  *   **Crux A: Domain Scope.** Does the knowability principle apply to *all* propositions, or only to a restricted domain (e.g., empirical statements, decidable mathematics)?
  *   **Crux B: The Knower.** Does "knowable" mean "knowable by us now," "knowable by humans eventually," or "knowable by an idealized agent in some possible circumstance"?

  | Test Case | Question | Realist Prediction | Verificationist Prediction |
  | :--- | :--- | :--- | :--- |
  | **Fermat's Last Theorem (1990)** | Before Wiles' proof, was the statement true? | **Yes.** It was true in 1990, even though unknowable then. | **No.** It lacked a truth value until warranted by proof. |
  | **Continuum Hypothesis (CH)** | Given independence from ZFC, is CH true or false? | **One or the other.** The universe decides, not the axiom system. | **Indeterminate.** Without a decision procedure, it lacks a truth value. |
  | **Goldbach's Conjecture** | If undecidable, is it true? | **Yes,** if no counterexample exists (assuming standard model). | **No.** If undecidable, it cannot be verified, thus cannot be true. |

  **4. Candidate Fallback Moves**
  We acknowledge proposed modifications to the Verificationist position that might avoid the paradox without conceding to Realism. These are not yet accepted but are under review:
  *   **The Edgington Move:** Restrict the knowability principle using an "actually" operator. One might claim: "If $p$ is *actually* true, then it is *possible* to know that $p$ is actually true." This blocks the substitution instances required for the paradox.
  *   **The Wright Move:** Replace "truth" with "superassertibility." A statement is superassertible if it is warranted now and remains warranted under all future improvements to information. This decouples truth from static correspondence.

  **5. Conclusion: Is This Verbal?**
  We conclude that a significant portion of this dispute is verbal, specifically regarding the definition of "truth." The Realist uses "truth" to mean *correspondence with mind-independent reality*, while the Verificationist uses "truth" to mean *idealized warranted assertibility*. When the Realist says "There are infinitely many twin primes," they describe a state of the universe. When the Verificationist says it, they describe the existence of a proof path. If we agree to distinguish "Truth-R" (Realist) from "Truth-V" (Verificationist), the contradiction dissolves: The Realist accepts "All Truth-R are knowable" is false; the Verificationist accepts "All Truth-V are known" is false. The remaining substantive disagreement is not about logic, but about which definition of truth is useful for mathematics and science. We agree to disagree on utility, having clarified the logic.
