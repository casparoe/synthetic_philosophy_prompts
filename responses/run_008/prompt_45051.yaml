  ok so, background: I'm a backend engineer, no philosophy training at all, but a couple years ago a Hacker News thread about intuitionism sent me down a rabbit hole and now I'm in a small discord "reading group" that's really just two guys and me. one of them — we call him the verificationist — is a huge Dummett fan: he thinks the meaning of a statement is exhausted by its verification conditions, that truth is warranted assertibility, and that every truth is in principle knowable by some suitably situated agent. the other, the realist, thinks mathematical statements have definite truth values whether or not any human could ever prove them — his favorite line is that either there are infinitely many twin primes or there aren't, and the universe doesn't wait for us. the thing they've been slamming into for eight months is Fitch's paradox of knowability: the verificationist's innocent-looking principle "all truths are knowable," plus some boring logic about knowledge distributing over conjunction, apparently entails that all truths are ALREADY known. the realist treats this as a refutation; the verificationist says it's a cheap trick that only works if you read his principle in a boneheaded way. (he also insists some guy named Church found the argument first, in the 40s, and Fitch just got the credit in the 60s — whatever.)

  they've finally agreed to stop yelling and do the adversarial-collaboration thing: one joint document both can actually put their names on, and since I'm "the neutral one with the formatting skills," I've been voluntold to draft it. here's what it needs: a numbered section of claims both can sign — I assume the derivation being formally valid is one, and that neither of them wants to bite the bullet and say all truths are known right now, but you work out the rest; then a table where each row is a live disagreement, phrased so that each guy would sign his own side's wording but not the other's; then the cruxes — the sub-questions where settling one would actually move somebody. I suspect one crux is whether the knowability principle was ever meant to apply to all truths or only to some domain, and another is what "knows" means in the argument: known-by-us-now, versus knowable-by-some-idealized-agent-in-some-possible-circumstance. for each crux I want a concrete test case both would agree bears on it, with each guy's prediction written down in advance — good candidates we've half-settled on: Fermat's Last Theorem in 1990, before Wiles (was it known then? knowable? by whom?); the Continuum Hypothesis after Cohen showed it's independant of ZFC (does it even have a truth value?); and Goldbach, since we don't know if it's decidable. and close with an honest paragraph on whether part of their fight is just verbal — whether they even mean the same thing by "truth" — and if so, which part. they keep mentioning fallback moves I only half-understood, something about Edgington rewriting the principle with an "actually" operator and Wright splitting knowledge into tentative vs categorical — treat those as candidate moves the document can use, refine, or reject on its own reasoning, not as things I'm asserting.

  constraints: this is for a discord channel, not a journal — no citations, no bibliography, none of us can check references anyway, so just state the positions in plain language I can follow (I can handle a modus ponens and that's about it). if the honest conclusion is that the realist wins on the original argument but the verificationist has a consistent fallback, say that plainly instead of splitting the difference to keep the peace — the whole point of the doc is that we can see exactly where the road forks. 700-1000 words, and don't let either of them sound like a caricature, I have to live with these people.
