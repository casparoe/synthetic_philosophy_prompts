answer: |-
  **Setting:** *The hallway of a pre-war apartment building. 4th Floor. There are two doors, 4B and 4C. Both are open. Both apartments are identical renovations: same light, same layout, same rent. The landlord, MR. HENDERSON, is standing by the elevator, looking at his watch. He needs a deposit check from one of them immediately to hold the unit.*

  **Ada:** (Checking phone) Henderson's tapping his foot. We have to pick one.

  **Marcus:** We have to pick *rationally*. If we pick 4B, we are asserting 4B is better. If it isn't, we are lying to ourselves about why we act.

  **Ada:** We aren't lying. We're saying, "I need an apartment, these are equal, so I will take this one." That is a complete sentence, Marcus.

  **Marcus:** It's a complete sentence grammatically. Metaphysically, it's a fragment. "I need an apartment" explains why you are in the building. It does not explain why you are in *4B* rather than 4C. If your reasons for B are identical to your reasons for C, then the reasons cancel out. Zero minus zero is zero. You're left with no vector.

  **Ada:** So what? I'm not a vector. I'm a person. I'm hungry for housing. I'm just going to walk into 4B.

  **Marcus:** (Blocks the door lightly with his hand) Wait. If you walk into 4B, something made you step left instead of right. If it wasn't a reason—because there *is* no reason—then it was a cause. A twitch. A neural misfire. A draft in the hallway.

  **Ada:** You're saying if I don't have a differentiating reason, I'm not choosing? I'm just malfunctioning?

  **Marcus:** I'm saying the "choice" is a story you tell yourself after the fact. You think you're the author, but in the gap where the reasons run out, you're just physics. And that's the hole, Ada. We think rationality is this sovereign king, but the moment the king has no advice from his counselors, he doesn't just pick a path—he rolls dice. And a die roll isn't rationality. It's chaos wearing a crown.

  **Ada:** Okay, fine. Let's play your game. Look at the doors. Is there actually a difference?

  **Marcus:** (Squints) Well… 4B's doorframe has a scuff mark near the hinge. 4C doesn't.

  **Ada:** There. Asymmetry. 4C is pristine. I'll take 4C. Reason given. Done.

  **Marcus:** No. Stop. Is the scuff mark a *reason*? Does it actually impact your quality of life?

  **Ada:** It impacts my aesthetic preference. I prefer no scuff marks.

  **Marcus:** But five minutes ago you said they were identical. You didn't care about the scuff mark until you needed it to break the tie. That means the scuff mark isn't a genuine reason; it's a pretext. You're scavenging for noise to pretend it's signal.

  **Ada:** So if I notice a detail and let it influence me, it's not a reason because I didn't care about it *before*? That's absurd. Reasons can be created by attention.

  **Marcus:** But *why* did your attention land there? If the options were truly tied in your valuation, your attention should have been equally distributed. The fact that you noticed the scuff mark on B and not one on C means there was already a bias in your perception. A micro-asymmetry in *you*, not the world.

  **Ada:** (Steps closer to him) Okay. Let's say there is. Let's say my brain has a slight leftward bias today. Is that a reason?

  **Marcus:** No. That's a cause. A reason is something you can cite to justify the action to another rational agent. "I chose 4C because I have a leftward neural bias" isn't a justification. It's a medical history.

  **Ada:** So you're saying rational agency requires that I am immune to physical causation? That I can only act on "pure reasons"?

  **Marcus:** I'm saying that if rationality is reason-governed, and reasons are exhausted, then the remainder of the action *must* be non-rational. It's not devastating, Ada, it's just honest. We aren't pure reason. We're reason *plus* a mechanism that has to fire when reason stops.

  **Ada:** But the mechanism *is* part of the rational agent! Look, remember the coin flip argument?

  **Marcus:** Here we go.

  **Ada:** If I flip a coin, I am adopting a policy: "When reasons tie, I randomize." That policy *is* the reason. It guarantees I don't starve in the hallway. The arbitrariness is contained within a rational frame.

  **Marcus:** It moves the bulge under the rug, it doesn't remove it. The *policy* is rational. "Flip a coin." Fine. But when the coin lands heads, there is no reason why heads won. It's brute fact. And if your life decision rests on that brute fact, then your life decision rests partly on brute fact. You can't launder arbitrariness just by wrapping it in a policy. The moment of execution is still reason-blind.

  **Ada:** (Looks at Henderson, who is now dialing a phone) Marcus. Henderson is calling the next applicant.

  **Marcus:** I know.

  **Ada:** If we don't pick, we lose both. That is a reason. "Avoid homelessness."

  **Marcus:** That's a reason to pick *an* apartment. It is not a reason to pick *this* apartment. It explains the urgency, not the direction.

  **Ada:** Direction doesn't need a reason if the destination is the same!

  **Marcus:** But *you* need to be the one who points! If the direction comes from nowhere, then *you* didn't point. The universe pointed through you.

  **Ada:** (Takes a deep breath. She looks at 4B, then 4C. She looks at Marcus.) You think this is devastating. That we aren't fully in control.

  **Marcus:** I think it means we're less sovereign than we like to think. And I think you're about to prove me right by picking one without knowing why.

  **Ada:** No. I'm not going to pick without knowing why.

  **Marcus:** Then you're going to stand here until Henderson leases them both to grad students.

  **Ada:** (She reaches into her pocket and pulls out a pen.) I'm going to make the reason.

  **Marcus:** How?

  **Ada:** (She walks to door 4B and draws a small, deliberate star on the scuff mark.) Now 4B has a star. 4C does not.

  **Marcus:** Ada, that's… that's vandalism. And it's still arbitrary.

  **Ada:** It's not arbitrary. It's an act of will. You say the asymmetry has to exist in the world for me to choose? Fine. I put it there. You say the reason has to precede the choice? I'm making the reason *by* choosing. The reason I pick 4B is that I am the kind of person who marks the door and walks through.

  **Marcus:** (Stares at the star) That's… that's just existentialism dressed up as interior design. You're still creating a pretext.

  **Ada:** Maybe. Or maybe that's what agency *is*. It's not finding the path of greatest reason. It's imposing weight on one side of the scale so it tips. If I wait for the scale to tip on its own, I'm not an agent. I'm a scale.

  **Marcus:** (Quietly) So you admit it. The reasons didn't tip it. You did. And you didn't do it with a reason. You did it with a… a gesture.

  **Ada:** I did it with a decision. And the decision is the reason. "Because I chose it."

  **Marcus:** "Because I chose it" is a tautology.

  **Ada:** It's a foundation. (She turns to Henderson.) We'll take 4B.

  **Marcus:** (He watches her hand the check to Henderson. He looks at the star on the doorframe, then back at Ada.) You know that star doesn't make the apartment better.

  **Ada:** (Walking into 4B) No. But it makes it mine. You wanted to know what breaks the symmetry, Marcus? It's not a reason. It's not a cause. It's ownership.

  **Marcus:** (Stands in the hallway for a moment, looking at the identical door of 4C. He touches the frame, then lets his hand drop.) Ownership without a differentiating reason is just… naming the void.

  **Ada:** (From inside the empty apartment) Come in, Marcus. The void has good light.

  **Marcus:** (Pauses at the threshold. He looks at the star. He steps over the threshold.) It does have good light.

  **Ada:** See? Reason found.

  **Marcus:** (A faint, reluctant smile) Post-hoc. But… I'll allow it.
