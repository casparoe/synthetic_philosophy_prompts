prompt: |-
  Ok so for history class we're doing a unit on neutrality in WWII and I watched this documentary that basically said the following: 'Switzerland has avoided war for two hundred years because it has no standing army at all -- instead every adult male is a soldier who keeps his rifle at home, so any invader would face a whole nation of snipers in the mountains. That is what deterred Hitler: his generals drew up invasion plans in 1940, but they scrapped them once they realized the Wehrmacht would get bogged down in an Alpine guerrilla war for years. Sweden followed the exact same model, which is why it also stayed out of the war, and Finland finally joining NATO just proves that in the end armed neutrality only works for countries with mountains.'

  Something about this felt kinda off to me? Like I remember reading somewhere that Sweden actually was pretty unprepared at the start of the war, and also I thought Switzerland does have some professional soldiers, not zero. Can you go through the documentary's claims one by one and tell me which ones a historian of WWII neutrality would accept, which ones they'd wince at, and which are just plain wrong? And at the end the narrator said this proves 'an armed citizenry is the best insurance against invasion, for any country' -- does that actually follow from the correct parts of what the documentary said, or is that a stretch? I'd guess the second but honestly I'm not sure.

  btw please write the whole answer in American English. Sorry if this is a dumb question lol, I'm just a high schooler trying to learn what parts of pop history documentaries I can actually trust.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** High school history class unit on neutrality in WWII.
      *   **Source Material:** A documentary the user watched (claims about Switzerland, Sweden, Finland, armed neutrality, mountains).
      *   **Task:** Evaluate the documentary's claims one by one (Accept, Wince, Wrong). Evaluate the concluding argument ("armed citizenry is best insurance").
      *   **Tone/Style:** American English, encouraging (it's not a "dumb question"), educational but accessible.
      *   **Specific Claims to Address:**
          1.  Switzerland has no standing army/professional soldiers.
          2.  Every adult male is a soldier with a rifle at home.
          3.  Invaders would face a nation of snipers in the mountains (National Redoubt).
          4.  This deterred Hitler (plans scrapped due to cost/benefit).
          5.  Sweden followed the exact same model.
          6.  Sweden was unprepared at the start of the war (User's counter-memory).
          7.  Finland joining NATO proves armed neutrality only works for countries with mountains.
