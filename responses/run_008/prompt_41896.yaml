prompt: |-
  I'm writing a novel where a father argues immigration with his daughter over dinner, and I want the scene to actually hold up. He leans on the line that a country is like a house: your home is yours, you lock your door at night, and nobody has a right to walk in just because their own place is worse -- letting people in is generosity, not a duty. She fires back that a country isn't a house at all, it's more like a giant apartment building: newcomers rent from willing landlords, work for willing employers, shop at willing stores, and nobody's "door" is involved. I don't want either of them to win on a cheap line. Can you audit both analogies -- lay out what maps onto what (the door, the owner, the keys, the family inside, the empty guest room, whatever the source domain offers), then where each mapping breaks, and what each one quietly smuggles in about who the country belongs to? Then separate the disanalogies that actually matter for the policy question -- whether anyone has to be admitted, and on what terms -- from the ones that are just decoration. Does the father's restrictionist conclusion survive once his disanalogies are on the table, and does the daughter's open-borders-ish conclusion survive hers? If there's a third analogy a smarter character would reach for, I'd take that too. Finish with a brief structured summary as a JSON object with fields "house_mapping" (object mapping each house element to its country counterpart), "building_mapping" (same for the apartment building), "load_bearing_disanalogies" (array, each entry naming the analogy it sinks and why), "verdicts" (object with "father_conclusion_survives" and "daughter_conclusion_survives", booleans with a one-line reason), and "better_analogy" (string).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A novel scene featuring a father-daughter dinner argument about immigration.
      *   **Core Conflict:** Father uses the "Country as a House" analogy (restrictionist). Daughter uses the "Country as an Apartment Building" analogy (open markets/borders).
      *   **Goal:** Audit both analogies rigorously. Map the domains, identify breakdowns, reveal hidden assumptions (smuggled premises), separate load-bearing disanalogies from decoration, evaluate the survival of their conclusions, and propose a better analogy.
      *   **Format:** Detailed analysis followed by a specific JSON summary.
      *   **Constraint:** No cheap wins for either side. Nuance is key.

  2.  **Deconstruct the Father's Analogy (Country = House):**
      *   *Mapping:*
          *   House $\rightarrow$ Nation.
          *   Owner/Father $\rightarrow$ State/Citizenry (specifically existing citizens).
          *   Family $\rightarrow$ Current Citizens.
          *   Door/Lock $\rightarrow$ Border Control.
          *   Guest Room $\rightarrow$ Capacity for immigrants.
          *   Intruder $\rightarrow$ Immigrant.
          *   Generosity $\rightarrow$ Asylum/Visas.
      *   *Hidden Assumptions:* Collective ownership by current occupants, zero-sum resource usage, the state acts as a single private proprietor, entry implies permanent residence/burden.
      *   *Breakdowns:* A house is private property; a country is public/political jurisdiction. You own a house via deed; citizenship is legal status, not property title. A house has finite physical space; an economy is dynamic.
      *   *Load-Bearing Disanalogy:* The nature of ownership. Do citizens *own* the territory like private property, or do they *govern* it via public trust?

  3.  **Deconstruct the Daughter's Analogy (Country = Apartment Building):**
      *   *Mapping:*
          *   Building $\rightarrow$ Nation.
          *   Landlord $\rightarrow$ Employer/Property Owner (Private actors).
          *   Tenants $\rightarrow$ Citizens/Residents.
          *   Lease/Transaction $\rightarrow$ Work/Trade contracts.
          *   Lobby/Hallways $\rightarrow$ Public Sphere/Market.
          *   Private Units $\rightarrow$ Private Homes/Businesses.
      *   *Hidden Assumptions:* Decentralized decision-making, consensual transactions override collective boundaries, the "building" is just infrastructure for private deals, no shared communal identity or resource pool.
      *   *Breakdowns:* Apartment buildings still have a main entrance and a super/owner who sets rules. Public goods (roads, schools, defense) aren't rented individually. Negative externalities (congestion, environmental impact) affect everyone, not just the transacting parties.
      *   *Load-Bearing Disanalogy:* The existence of a *polity*. A building doesn't vote on shared rules; a country does. Private contracts don't account for public costs.

  4.  **Evaluate Conclusions:**
      *   *Father:* "No duty to admit." If the country isn't private property, the "my house, my rules" absolute right weakens. However, the idea of *political self-determination* (a community deciding its character) remains valid even if the property analogy fails. So, his conclusion survives but needs a different justification (sovereignty vs. ownership).
      *   *Daughter:* "No right to exclude if private deals exist." If the country has public goods and shared rules, private willingness isn't sufficient. You can't sell a visa like a spare room key. Her conclusion weakens because it ignores the *public* cost and the *political* nature of borders.

  5.  **Develop a Third Analogy:**
      *   Need something that balances private interaction with public governance.
      *   *Idea 1:* A Club. (Good for membership rules, bad for involuntary birthright).
      *   *Idea 2:* A Shared Garden/Condo Association. (Combines private units with shared infrastructure and voting).
      *   *Idea 3:* A Lifeboat. (Too Malthusian/urgent).
      *   *Selection:* **A Condominium Association (HOA) or Co-op.**
      *   *Why:* It acknowledges private ownership (units/economic activity) *and* shared governance (common areas/bylaws/voting). It captures the tension between individual rights to invite guests/rent out and the collective right to maintain property values/rules/capacity.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Analytical, literary, respectful of the complexity.
      *   *Structure:*
          1.  Audit the House Analogy.
          2.  Audit the Building Analogy.
          3.  Load-Bearing Disanalogies (The "Real" Fight).
          4.  Verdicts on Conclusions.
          5.  The Better Analogy.
          6.  JSON Summary.

      *(Self-Correction during drafting)*: Make sure I don't just say "Father is wrong." His point about *sovereignty* is real, even if *property* is the wrong metaphor. The daughter's point about *economic liberty* is real, even if *anarchy* is the implication. I need to show where their logic holds and where it snaps.

      *Refining the JSON:* Ensure keys match the prompt exactly. `house_mapping`, `building_mapping`, `load_bearing_disanalogies`, `verdicts`, `better_analogy`.

  7.  **Final Review against Constraints:**
