answer: |-
  The steam from our coffees mingled in the cold air of the café across from the department. Sarah stirred her espresso, the spoon clinking against the ceramic—a sharp, unified sound. She looked up, her expression unreadable.

  "Three weeks, Alex," she said. "And you're walking into the lion's den with a view that says there are probably more minds in this coffee shop than there are customers."

  "I'm walking in with a view that takes the data of experience seriously," I replied, keeping my voice low. "Including the data from my own head. You saw the scans. You know what the scotoma does to the field. Unity isn't a given, Sarah. It's a achievement. Sometimes it fails."

  "Failure presupposes a standard," she countered. "Functionalism explains the failure as a breakdown in integration. Information becomes inaccessible to the reporting systems. Your view says the experience itself fragments. But this brings me to the combination problem. If electrons have proto-experience, and neurons have micro-experience, what binds them into *your* headache? If you can't specify the binding mechanism, you haven't explained consciousness; you've just distributed the mystery."

  "I'm not proposing bare summation," I said. "I know that's a dead end. I'm arguing for structural matching. The phenomenal structure of my macro-experience is isomorphic to the physical structure of the neural processing. The unity of consciousness isn't magic; it's the experiential counterpart to the causal integration of the physics."

  Sarah leaned forward. "Here is where you borrow capital you don't own. You say 'structural matching,' but structure is relational. Physics gives us the relations—spin, charge, mass, firing rates. You're using the physical structure to do the binding work, while leaving the experiential contribution completely opaque. If the binding is physical, what work is the proto-experience doing? You've saved the phenomenon by making it a shadow."

  "Physics describes the extrinsic relations," I said. "It doesn't tell us the intrinsic nature of the relata. Russellian monism suggests consciousness *is* the intrinsic nature of the physical. The structure isn't borrowing from physics; the physics is the abstract map of the conscious territory."

  "But maps don't feel," Sarah said sharply. "If the intrinsic nature is experiential, how do you get from the micro-experience of an ion channel to the macro-experience of pain? You've replaced the hard problem of generation with the hard problem of combination. You posit subjects everywhere, but until you say what binds them into a single subject, you haven't explained the unity you claim to cherish. You've just populated the universe with tiny ghosts."

  "I concede the combination problem is severe," I admitted. "But look at your position. You claim functional organization generates experience. But why? Why doesn't a perfect functional duplicate—a zombie—exist? You have an explanatory debt too. You say function fixes experience, but you can't explain *how* without invoking brute laws. I'm positing brute laws too: that matter has experiential properties. Is my brute fact really worse than yours? At least mine doesn't require experience to pop into existence only when computation reaches a certain complexity."

  "Conceivability isn't metaphysics," Sarah said. "Zombies are conceivable because we lack concepts, not because they are possible. My view has causal traction. Mental states are functional states; they cause behavior. Your view risks epiphenomenalism. If physics is causally closed, and consciousness is just the 'intrinsic nature' of that physics, then consciousness itself does no causal work. It's along for the ride. If it doesn't constrain the dynamics, why posit it?"

  "It's not epiphenomenal because it's not distinct from the cause," I argued. "The causal power *is* the experiential power. When I decide to raise my hand, the neural firing is the extrinsic view of the volition. You worry about dynamics? The dynamics are constrained because the experience *is* the stuff dynamics are made of."

  "Then you lose the subject," Sarah said, her voice dropping. "If the experience is just the intrinsic face of the physical dynamics, then individuation follows physics. But physics doesn't care about 'subjects.' It cares about fields and particles. If your view is true, the boundary between 'your' mind and 'my' mind is arbitrary. You said unity is something to be explained, not assumed. Fine. But if you explain it away too well, you dissolve the agent. Who is defending this thesis in three weeks? Is it the composite? The neurons? The particles?"

  I paused. This was the cut. "Maybe the 'who' is less singular than we think. The migraine showed me that. The intact visual field thought it was whole. It was wrong. The self is a composite that usually coerces coherence. I'm not dissolving the agent; I'm naturalizing it."

  "You're naturalizing it into oblivion," Sarah said. "Science requires a stable observer. If your ontology makes the observer a fuzzy composite of trillions of micro-subjects, you undermine the very perspective required to validate the ontology. You need the unity to prove the fragmentation. It's performative contradiction."

  "I need the *appearance* of unity," I corrected. "Which is all functionalism gives you anyway. A user interface. I'm just saying there's something it feels like to be the interface."

  "And that feeling does nothing," she pressed. "If the physical structure does all the binding, and the experience just matches it, then the experience is redundant. You've solved the combination problem by making experience a mirror. But mirrors don't see."

  "I haven't said it's redundant," I said. "I've said it's fundamental. You treat experience as a output of processing. I treat it as the substrate. The palette problem—how simple qualia make complex ones—is hard. But your problem is harder: how no qualia make any qualia. You ask how many minds are in this room. I say the question assumes a definition of 'mind' tied to macro-unity. If I reject that, I don't have to count them. I just have to account for the report."

  "The report is what matters," Sarah said. "And the report says 'I am one.' Your theory says 'We are many.' Until you can explain why the 'We' feels like an 'I' without invoking a higher-level emergence—which you've rightly banned—you haven't explained the report. You've explained it away."

  I took a sip of coffee. It was bitter, hot, singular. "Then that's the fault line," I said. "You think the unity of consciousness is a datum that must be preserved at the fundamental level. I think it's a phenomenon to be reconstructed from parts that aren't themselves unified. You fear I'll lose the subject. I fear you'll lose the experience."

  Sarah sat back, finally picking up her cup. "No," she said softly. "I fear you'll keep the experience but lose the world. If the structure is all that binds, and the experience is just the intrinsic glow... then you haven't explained how *I* know *you*. You've locked us all into private universes that happen to march in step. You've solved the combination problem by denying there's anything to combine. Just echoes."

  "Then in three weeks," I said, "I'll have to prove the echoes make a sound."

  "And I'll have to prove," she replied, "that without a drummer, there is no rhythm."

  We sat in silence, the fault line clear: not whether consciousness exists, but whether unity is the foundation of reality or the final trick of its architecture.
