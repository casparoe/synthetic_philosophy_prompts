  I'm in a bioethics course and we just did the unit on declaring death — brain death vs. the circulatory route — and then donation after circulatory death (DCD), where they withdraw the ventilator, wait for the heart to stop, then hold off a few minutes to make sure it doesn't restart (the no-touch period — some hospitals use two minutes, some five, which itself was a whole discussion) before pronouncing death and going in for the organs. In my section this week someone kept repeating that death is a process, not an event, and used it to argue that all the lines we draw are equally conventional: if death is a process, there's no fact of the matter about when the patient actually dies, so the five-minute rule is no more arbitrary than brain death criteria, and complaints that DCD donors aren't really dead yet are confused, because every death declaration just picks a point somewhere on a continuum.

  I'm pretty sure the slogan is doing several different jobs at once, and I want to sort them out before I respond to her. Can you lay out, as a list I can actually work through, the distinct precise claims that death is a process, not an event could be making — starting from the trivially true stuff (cells die at different rates, the organism degrades over minutes or hours, resuscitation windows close gradually) and going up to the genuinely radical readings (that there's no fact of the matter at all about when a given patient dies, so every criterion is pure policy, and the choice between them is only about consequences)? For each reading, say whether it's plausible, whether it's probably what people repeating the slogan actually mean, and — this is the part I care about most — whether that reading actually gets her to her conclusion. My hunch is that the trivial readings give her nothing, since a gradual process can still have a sharp fact about when some threshold gets irreversibly crossed (autoresuscitation becomes impossible, whatever), but I can't quite pin down where the radical readings go wrong, or whether they even do go wrong. Keep the whole thing under 450 words — I want the menu, not an essay.
