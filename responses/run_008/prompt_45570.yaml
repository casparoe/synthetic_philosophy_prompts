          *   *Refinement on Round 3:* The prompt asks for "visibly bind yourself." A signed contract works. Or better, a "Deposit" system? No, keep it simple. Let's use a "Public Pledge" round where the Hitchhiker reveals a card *before* the Driver decides.
      *   *Addressing the "Secret Disposition" idea:* The user suggested assigning some players as "Always Keep Promises." This is hard to run without it feeling lame. *Better approach:* In Round 2, tell them "You will play the same partner 3 times." This naturally incentivizes reputation without hidden roles. It's cleaner.
      *   *Exploit Proofing:*
          *   *Issue:* Hitchhikers promising to pay but lying.
          *   *Fix:* Secret simultaneous choice for the payment phase, revealed *after* the ride.
          *   *Issue:* Drivers colluding.
          *   *Fix:* Keep scores individual.
          *   *Issue:* "I'll just not play."
          *   *Fix:* Make "Death" (no ride) a massive point penalty (-100) vs Cost of Ride (-10).

  4.  **Drafting the Game Rules:**
      *   *Setup:* 6 pairs.
      *   *Currency:* Survival Points (SP). Start with 100.
      *   *Goal:* Maximize SP.
      *   *Round 1:* Anonymous. Driver decides Stop/Ignore. If Stop, Hitchhiker decides Pay/Run.
