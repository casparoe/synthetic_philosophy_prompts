  2.  **Deconstruct the Philosophical Problem:**
      *   The scenario is *Parfit's Hitchhiker*.
      *   *Structure:* Agent A (Hitchhiker) needs Agent B (Driver). B moves first (Stop/Drive by). A moves second (Pay/Don't Pay).
      *   *Payoffs:*
          *   If B drives by: A dies (huge loss), B neutral.
          *   If B stops & A pays: A loses money but lives (net positive), B gains money.
          *   If B stops & A doesn't pay: A lives and keeps money (best for A), B wastes time/gas (loss).
      *   *The Trap:* Standard Causal Decision Theory (CDT) says at the moment of payment, the ride is already done. Paying costs utility. So rational A doesn't pay. Anticipating this, rational B doesn't stop. Both lose.
      *   *The Solution:* A needs to be *predictably disposed* to pay. This is Evidential Decision Theory (EDT) or Functional Decision Theory (FDT) territory, or simply "Precommitment."

  3.  **Designing the Game:**
      *   *Name:* "The Desert Run" (keeps the theme without giving away Parfit).
      *   *Currency:* "Survival Points" (SP).
      *   *Players:* 12 people. Split into 6 Drivers and 6 Hitchhikers. Rotate roles.
