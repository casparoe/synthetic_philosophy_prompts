      *   *Round 3:* The "Vow." Hitchhiker writes a promise on a card, shows it to Driver *before* Driver decides.
      *   *Payoffs:*
          *   Hitchhiker Survives: +50 SP.
          *   Hitchhiker Pays: -20 SP.
          *   Driver Stops: -5 SP (gas/time).
          *   Driver Picks Up & Gets Paid: +20 SP.
          *   Driver Stops & No Pay: -10 SP.
          *   Hitchhiker Dies (No ride): -100 SP.

  5.  **Drafting the Debrief:**
      *   *Phase 1: Data.* Ask what happened in Round 1 vs Round 2/3.
      *   *Phase 2: The "Why".* Why did Round 1 fail? (Backwards induction).
      *   *Phase 3: The Lesson.* Rationality of dispositions.
      *   *Phase 4: PD Distinction.* PD is simultaneous/mutual temptation. This is sequential/one-sided temptation.
      *   *Phase 5: Jargon Drop.* Parfit's Hitchhiker, CDT vs. FDT/EDT, Precommitment.

  6.  **Addressing "What Goes Wrong" (Teenager/Club Context):**
      *   *Giggling/Nonsense:* They might treat it as a joke. Need to emphasize the "Survival" stakes.
      *   *Overthinking:* Sharp kids might try to calculate Nash Equilibria live. Acknowledge them but steer back to intuition.
      *   *Lying:* They might lie about payoffs. Need honor system or monitored reveals.
      *   *Boredom:* Keep rounds snappy.

  7.  **Refining the "Secret Disposition" Idea:**
      *   The user liked the idea but couldn't make it work. I should incorporate a version of it in Round 3. Instead of a contract, give 3 Hitchhikers a hidden card that says "You *must* Pay. If you don't, you lose 500 points." The Drivers don't know *who* has it. This simulates "being the kind of person."
      *   *Wait, actually:* The prompt says "feel... sometimes the smartest move... is to be the kind of person who would make a dumb move." The "Secret Disposition" round is actually perfect for this. Let's make Round 3: "The Trait." 3 Hitchhikers are randomly given a "Conscience" card. They *must* pay or face ruin. Drivers know 3/6 have it but not which. This forces Drivers to gamble, and Hitchhikers with Conscience *wish* they didn't have to pay but benefit from the risk pool.
      *   *Correction:* That complicates the scoring. Let's stick to the "Public Vow" for simplicity, but frame the debrief around "becoming the person who keeps vows." Actually, the "Secret Disposition" is closer to the philosophical point (you can't just *say* you'll pay, you have to *be* the type). Let's try to make that work cleanly.
