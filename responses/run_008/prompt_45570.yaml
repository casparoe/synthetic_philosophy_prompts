      *   *Best Compromise:* Stick to the "Public Vow" (Precommitment) for Round 3. It's easier to run. The "Secret Disposition" is hard to enforce without a referee for every pair. I will advise the user in the "What Goes Wrong" section that the "Secret Disposition" idea is risky for a first run. I'll focus on the Vow/Contract mechanism as the "binding" round.

      *Wait, I need to make sure the payoffs sting.*
      *   If Driver ignores: Hitchhiker -100, Driver 0.
