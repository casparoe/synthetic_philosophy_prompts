      *   If Driver stops + Hitchhiker runs: Hitchhiker +50 (50 survival - 0 cost), Driver -10 (0 reward - 5 cost - 5 betrayal penalty?).
      *   *Crucial:* The Hitchhiker must prefer Running (+50) over Paying (+30) *at the moment of decision*. But prefer Being Picked Up (+30) over Dying (-100).

  8.  **Finalizing the Plan:**
      *   **Game Title:** The Desert Run.
      *   **Rounds:**
          1.  Strangers (The Trap).
