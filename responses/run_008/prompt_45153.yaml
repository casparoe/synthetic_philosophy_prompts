  **Dissertation Proposal**

  **Title:** The *Mens Rea* of the State: Collective Responsibility and the Historiography of German War Guilt

  **1. Introduction and Research Question**

  The question of whether Germany caused the First World War has been the central organising problem of modern European historiography for over half a century. Since the intervention of Fritz Fischer in the early nineteen-sixties, the debate has shifted from a consensus of shared catastrophe to a fierce dispute over specific national culpability. Fischer argued that the German leadership pursued aggressive war aims and consciously sought a continental conflict. His critics, ranging from conservative contemporaries to more recent proponents of the "sleepwalkers" thesis, have countered that the war was the unintended result of structural crises, alliance rigidity, and diplomatic drift, lacking a specific criminal intent on the part of Berlin.

  Despite their opposing conclusions, both sides of this controversy appear to share a hidden, undefended premise: that holding a state responsible for starting a war requires demonstrating something analogous to individual criminal intent (*mens rea*). For the Fischer school, guilt is established by finding the "smoking gun" of deliberate planning. For the revisionists and the sleepwalkers camp, innocence is established by showing the absence of such planning, implying that without specific intent, there is no substantial blame to assign.

  This dissertation proposes that this shared assumption is philosophically untenable. It rests on a category error regarding the nature of collective agency. States are not persons; they do not possess minds in the literal sense, and the criteria for moral or legal responsibility appropriate to individuals may not map cleanly onto polities. It is possible for a state to be reckless, negligent, or structurally culpable without possessing a unified "intent" to wage war. Furthermore, the debate often conflates the agent of the action (the leadership) with the bearer of the responsibility (the nation), leading to confusion over who, exactly, is being blamed: the Kaiser, the General Staff, the bureaucracy, or the citizenry who paid the reparations.

  This project will not engage in new archival research. Instead, it will treat the historiography of the First World War origins as a dataset for conceptual analysis. By applying frameworks from the philosophy of collective responsibility to the existing historical arguments, I aim to expose the logical gaps in the current debate.

  The primary research question is: **To what extent does the historiography of German war guilt rely on an undefended model of individual criminal liability, and how does the debate change if we adopt a model of collective negligence or recklessness?**

  A secondary question follows: **If the "nation" is the unit of blame, what are the criteria for diachronic responsibility, and does the German polity of nineteen-fourteen bear the same identity as the Weimar Republic that accepted the war guilt clause?**

  **2. Historiographical Context: The Debate as it Stands**

  To understand why this philosophical intervention is necessary, we must first sketch the contours of the historical debate as it currently exists. The dissertation will begin by mapping the three main positions, not to adjudicate their historical accuracy, but to isolate their underlying criteria for blame.

  *The Fischer Thesis and the Intent Model*
  The intervention by Fritz Fischer fundamentally altered the landscape of First World War studies. Prior to this, a consensus existed that the war was a tragedy into which all great powers had stumbled. Fischer challenged this by examining the war aims of the German leadership. He argued that there was continuity between the ambitions of the German elite before the war and their actions during the conflict. Crucially, Fischer's method for establishing guilt was to locate intention. He pointed to specific documents, such as the records of a war council held in nineteen-twelve, and the September Program of nineteen-fourteen, to demonstrate that German leaders had not merely accepted the risk of war, but had actively sought it as a tool for policy.

  The logic here is implicitly legalistic. To be guilty of aggression, one must have planned aggression. The historical work is dedicated to finding evidence of a guilty mind within the leadership. If the leadership intended war, Germany is guilty. If they did not, the charge collapses.

  *The Conservative Backlash and the Defence of Innocence*
  The immediate reaction to Fischer came from German historians who felt this thesis imposed a singular burden of guilt on Germany that ignored the aggressive actions of Russia, France, and Britain. Their counter-argument was not necessarily to deny German ambition, but to contextualise it as defensive or reactive. They argued that German mobilisation was a response to Russian mobilisation, and that German war aims were formulated only after the war had begun, rather than causing it.

  While opposed to Fischer, this camp accepted the same rules of engagement. They sought to exonerate Germany by disproving intent. They argued that the German leadership was not *trying* to start a general war, but was forced into it. The criterion for responsibility remained the same: did they mean to do it? If the answer is no, the implication is that blame is significantly mitigated or removed.

  *The "Sleepwalkers" and Structural Drift*
  In more recent decades, a new synthesis has emerged, best exemplified by the "sleepwalkers" thesis. This position argues that the leaders of nineteen-fourteen were not criminals, nor were they purely defensive actors. Rather, they were decision-makers operating under extreme uncertainty, trapped by alliance systems and mobilisation timetables that created a logic of escalation independent of their desires.

  This view explicitly rejects the idea of German singular guilt. However, it also implicitly rejects the idea of *any* singular guilt. By emphasising the complexity of the system and the lack of clear intent from any actor, it suggests that the war was a catastrophe without a clear author. The moral conclusion often drawn is that because no one specifically *wanted* the war as it happened, no one is fully responsible. The absence of *mens rea* leads to a diffusion of blame so wide that it effectively vanishes.

  *The Gap in the Literature*
  The existing literature is exhaustive regarding the historical facts: mobilisation dates, diplomatic cables, and minutes of meetings. However, there is a silence regarding the philosophy of blame. Historians argue about whether Germany is responsible, but they do not argue about what "responsibility" means in this context. They assume the reader understands that "causing a war" is morally equivalent to "committing a crime," and therefore requires the same conditions for liability.

  There is no sustained discussion in the historiography on whether a state can be negligent. There is no discussion on whether creating a high-risk environment (such as a blank cheque to Austria-Hungary) constitutes culpability even if the specific outcome (a general European war) was not the specific intent. By treating the historical debate as a philosophical object, this dissertation will highlight that the stalemate between Fischer and his critics may not be due to a lack of evidence, but due to a flawed conceptual framework.

  **3. Theoretical Framework: Collective Responsibility and Agency**

  To analyse the historiography, I will need to construct a theoretical framework drawn from political philosophy and ethics. This section of the dissertation will not be a history of the war, but a conceptual toolkit. I will outline three key concepts that will be applied to the historical texts.

  *Collective Agency and the "State as Person"*
  The first concept is the nature of the agent. The Fischer debate treats "Germany" as a unified agent capable of forming intentions. In philosophy, this is known as the collectivist view of agency. However, this faces the challenge of methodological individualism: only individuals have minds; states are fictions. If only individuals have minds, can a state truly "intend" anything?

  I will engage with the distinction between aggregated individual intent and irreducible collective intent. For example, if the Kaiser wants war, the Chancellor wants peace, and the General Staff wants a preventive strike, what does "Germany" want? The historiography often smooths over these internal contradictions to assign a single verdict to the nation. I will utilise theories of group agency to show how a state can form an intention even when its constituent members disagree, provided there are decision-making procedures that aggregate those views into a single output. This complicates the Fischer search for a single "guilty mind," as the guilt might lie in the procedure itself rather than a specific person's desire.

  *Intent, Recklessness, and Negligence*
  The second concept is the hierarchy of fault. In criminal law, intent is the highest standard, but it is not the only one. Recklessness involves knowingly creating a substantial and unjustifiable risk. Negligence involves failing to perceive a risk that a reasonable actor would have perceived.

  The current historical debate operates almost exclusively at the level of intent. Fischer tries to prove Germany intended the war. The sleepwalkers argue Germany did not intend the war. Both sides largely ignore recklessness. A state can be reckless if it issues unconditional support to an ally during a crisis, knowing this makes escalation likely, even if it hopes escalation will not occur. If the standard for blame is lowered from intent to recklessness, the "sleepwalkers" defence weakens significantly. One can sleepwalk into a disaster one was negligent in preventing. I will argue that the historiography has ignored this middle ground, leading to a false dichotomy between "calculated aggression" and "unavoidable accident."

  *Diachronic Identity and Moral Inheritance*
  The third concept is time. The Treaty of Versailles assigned war guilt to Germany, which justified reparations paid by the German people. This raises the problem of diachronic identity. Is the Germany of nineteen-nineteen the same moral agent as the Germany of nineteen-fourteen?

  If we view the state as a continuous institution, the debt passes on. If we view the state as a collection of specific individuals, the citizens of the Weimar Republic are not responsible for the actions of the Kaiser's subjects. The historiography often slides between these views. When discussing "German guilt," historians sometimes mean the specific elite, and sometimes the national culture. I will use philosophical accounts of collective memory and inheritance to clarify what is at stake when we say "Germany" caused the war. This is crucial for understanding why the debate remains politically charged today.

  **4. Methodology**

  This dissertation is a work of conceptual history and philosophical analysis. It does not seek to uncover new archival evidence regarding the events of nineteen-fourteen. Instead, it treats the secondary historical literature as the primary source material. The method involves three steps.

  *Step One: Reconstruction*
  I will reconstruct the arguments of the key positions (Fischer, the conservative critics, the sleepwalkers) not merely as historical narratives, but as logical arguments. I will extract their premises regarding responsibility. For example, I will identify where a historian moves from the premise "The Chancellor did not order mobilisation until after Russia" to the conclusion "Germany is not responsible." I will expose the hidden premise: "Responsibility requires ordering mobilisation."

  *Step Two: Critique*
  I will test these hidden premises against the philosophical frameworks outlined in section three. I will ask: Is it true that responsibility requires ordering mobilisation? Is it true that a state cannot be reckless? I will look for internal contradictions. For instance, does a historian claim Germany is not responsible because they lacked intent, while simultaneously blaming Russia for mobilising? If so, are they applying different standards of responsibility to different actors?

  *Step Three: Synthesis*
  I will propose a revised model of attribution. I will not attempt to solve the historical question of "Who started the war?" definitively. Instead, I will argue for a more robust vocabulary for discussing the question. I will demonstrate how the debate looks if we assume recklessness is sufficient for blame, or if we distinguish between the blame due to the leadership and the blame due to the polity.

  *Limitations*
  The primary limitation is that I am not a historian engaging in archival verification. I am taking the historical claims of the secondary literature at face value for the purpose of analysing their logical structure. If Fischer's documents are forged, my philosophical analysis of his argument remains valid as an analysis of *his* argument, even if the historical premise is false. However, I will acknowledge that the strength of the philosophical critique depends on the general reliability of the historical consensus regarding the broad strokes of the crisis.

  A second limitation is the scope. The philosophy of collective responsibility is a vast field. I will restrict myself to those theories that are directly applicable to state action and war initiation. I will not engage with broader theories of corporate responsibility unless they illuminate the specific case of the nation-state.

  **5. Chapter Outline (for the 15,000-word Dissertation)**

  The final dissertation will be structured into five chapters. This structure ensures a logical flow from the historical context to the philosophical intervention and finally to the implications.

  *Chapter 1: Introduction (2,000 words)*
  This chapter will introduce the Fischer Controversy and state the research question. It will outline the thesis: that the debate is stalled due to an unexamined reliance on individualistic models of *mens rea*. It will provide a roadmap of the argument and define key terms such as "collective responsibility," "recklessness," and "state agency."

  *Chapter 2: The Historiography of Guilt (4,000 words)*
  This chapter will provide the historical context. It will summarise the Fischer thesis, the conservative backlash, and the sleepwalkers turn. However, unlike a standard literature review, this chapter will focus on the *rhetoric of blame*. It will analyse how historians justify their attributions of responsibility. It will highlight the language of crime, punishment, and innocence used in the texts. It will conclude by demonstrating the common assumption across all camps: that without specific intent, substantial blame cannot be assigned.

  *Chapter 3: The Philosophy of State Responsibility (4,000 words)*
  This chapter will step away from history and engage with political philosophy. It will outline the models of collective agency. It will distinguish between intentional, reckless, and negligent action in the context of states. It will also address the problem of diachronic identity (who pays?). This chapter provides the theoretical tools needed to critique the historiography. It will argue that states can be reckless agents even if they lack a unified conscious mind.

  *Chapter 4: Re-reading the Crisis (4,000 words)*
  This chapter applies the tools from Chapter 3 to the history in Chapter 2. It will re-evaluate the key moments of the July Crisis through the lens of negligence and recklessness. For example, rather than asking "Did Germany want war?", it will ask "Did Germany create a risk of war that was unjustifiable?" It will show how the "sleepwalkers" argument fails if negligence is a sufficient condition for blame. It will also distinguish between the responsibility of the elite and the responsibility of the nation, challenging the coherence of "German War Guilt" as a singular concept.

  *Chapter 5: Conclusion (1,000 words)*
  This chapter will summarise the findings. It will argue that the Fischer Controversy cannot be resolved historically until the philosophical criteria are clarified. It will suggest that moving away from the *mens rea* model allows for a more nuanced understanding of the war's origins, one that acknowledges catastrophe without requiring a criminal conspiracy. It will end with a reflection on the political implications of how we assign blame for historical catastrophes.

  **6. Timeline (Part-Time, 12 Months)**

  As a part-time MA student, I have structured the timeline to accommodate professional commitments while ensuring steady progress on the 15,000-word target.

  *Months 1-2: Refinement and Reading*
  Finalise the proposal with supervisor feedback. Complete the deep reading of the key historiographical texts (Fischer, the critics, Clark, etc.) with a focus on their arguments about responsibility rather than just their narrative. Begin reading the philosophical literature on collective responsibility.
  *Deliverable:* Annotated bibliography and refined chapter plan.

  *Months 3-4: Drafting Chapter 1 and 2*
  Write the Introduction and the Historiography chapter. This establishes the baseline. Since this relies on existing secondary literature, it is the most straightforward writing task.
  *Deliverable:* 6,000 words of draft text.

  *Months 5-7: Drafting Chapter 3 (The Theory)*
  This is the most difficult section. It requires mastering the philosophical concepts. I will dedicate extra time here to ensure the theory is explained clearly and applied correctly. I will seek specific feedback from the supervisor on this section to ensure I am not misusing the philosophical terms.
  *Deliverable:* 4,000 words of draft text.

  *Months 8-9: Drafting Chapter 4 (The Application)*
  Bring the theory and history together. This is the core argument of the dissertation. I will write this while the theoretical framework is fresh in my mind.
  *Deliverable:* 4,000 words of draft text.

  *Month 10: Drafting Chapter 5 and Conclusion*
  Complete the final chapter and write the conclusion. Ensure the argument flows logically from start to finish.
  *Deliverable:* Full first draft (15,000 words).

  *Month 11: Revision and Polishing*
  Step away from the text for two weeks, then return for a critical edit. Check for clarity, tone, and argument strength. Ensure all claims are supported. Check that the "no citation" constraint of the proposal is removed and proper academic referencing is inserted for the dissertation.
  *Deliverable:* Second draft.

  *Month 12: Final Review and Submission*
  Final proofread. Check formatting and compliance with department guidelines. Submit.

  **7. Risk Assessment: Where This Could Go Wrong**

  My supervisor has asked for an honest account of the project's vulnerabilities. I have identified three specific areas where the argument is weakest, and I have planned contingencies for each.

  *Risk 1: The "Straw Man" Objection*
  The central claim of this dissertation is that historians are assuming a *mens rea* model of responsibility. The most significant risk is that this is a caricature. It is possible that sophisticated historians (particularly the "sleepwalkers" camp) are already aware of the complexity of collective action and are not simply looking for a criminal intent. If I accuse them of a philosophical error they have already considered, the dissertation will look naive.

  *Mitigation:* I will not claim that historians are *unaware* of philosophy. I will claim that their *criteria for judgment* functionally operate as if intent is required, regardless of their theoretical sophistication. I will focus on the *conclusions* they draw. If a historian says "No one wanted war, therefore no one is to blame," they are functionally relying on an intent model, even if they acknowledge structural complexity elsewhere. I will look for this specific move in the text. If I cannot find clear evidence of this move in the secondary literature, I will have to scale back the claim from "historians are mistaken" to "historians are ambiguous, and philosophy can clarify the ambiguity."

  *Risk 2: The Triviality Objection*
  A second risk is that the point is obvious. A supervisor might ask: "Of course states aren't people. Why does it matter?" If the philosophical analysis does not change our understanding of the history, the project is merely semantic.

  *Mitigation:* To avoid triviality, I must show that the philosophical distinction changes the historical verdict. In Chapter 4, I need to demonstrate that if we apply a "recklessness" standard, the verdict on Germany changes from "Not Guilty" (as per the sleepwalkers) to "Guilty of Negligence." If the verdict remains the same regardless of the philosophical model, the project has failed. I will use this as a decision criterion: if the philosophical lens does not yield a new historical insight, I will pivot the conclusion to focus on why the historiography is so resistant to these distinctions, rather than trying to solve the historical question myself.

  *Risk 3: Scope Creep and Depth*
  Fifteen thousand words is a tight constraint for a project that spans history and philosophy. There is a risk of writing a shallow overview of both fields without doing justice to either. I might end up with a history chapter that is too brief and a philosophy chapter that is too simplistic.

  *Mitigation:* I will prioritise the *argument* over the *coverage*. I will not attempt to cover every historian in the Fischer controversy. I will select three representative positions (Fischer, a conservative critic, and a sleepwalker) and analyse them in depth. Similarly, I will not cover all theories of collective responsibility. I will focus only on the distinction between intent and recklessness. If I find myself running out of word count, I will cut the historical narrative details and focus strictly on the logic of the blame attribution. The dissertation is for a History MA, not a Philosophy MA, so the priority must remain on illuminating the historical debate, not solving the philosophical problem of group agency.

  *The Dealbreaker*
  The project would no longer be worth pursuing if I discover that the concept of "state recklessness" is incoherent. If, upon deeper reading, I find that negligence logically *cannot* apply to collective agents without reducing to individual negligence, then my core intervention collapses.
  *Decision Point:* At the end of Month 4 (after drafting the theory chapter), I will evaluate whether a coherent model of state negligence is defensible. If it is not, I will shift the focus. Instead of arguing for negligence, I will argue that the *concept* of war guilt is itself the problem, and that the Fischer Controversy is a category error. This would still be a valid dissertation, but it would change the conclusion from "We should blame them for negligence" to "We should stop asking who is to blame."

  **8. Conclusion**

  The Fischer Controversy is the defining debate of modern German historiography. It has shaped how we understand the twentieth century, the nature of the German state, and the ethics of war. However, it has been conducted largely without examining the ethical tools used to make the judgments.

  This dissertation proposes that by importing concepts from the philosophy of collective responsibility, we can break the stalemate. We can move beyond the binary of "calculated aggression" versus "unavoidable accident." By recognising that states can be reckless, and that blame can be distributed differently across leadership and polity, we can achieve a more nuanced understanding of the origins of the First World War.

  This project is feasible within the one-year, part-time timeframe. It relies on accessible secondary literature and conceptual analysis rather than archival discovery. The risks are manageable, provided I remain focused on the logical structure of the historical arguments rather than getting lost in the details of the July Crisis. I believe this approach offers a fresh perspective on a well-worn topic and meets the MA requirement for critical engagement with historiography.

