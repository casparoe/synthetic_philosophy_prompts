          *   *Is it genuine?* Yes. If the state has the *exclusive* right to authorize force, private individuals generally cannot use force except by state permission (delegation). Prop 4 explicitly rejects the "delegated surrogate" model. Prop 5 explicitly allows force against the monopoly holder.
          *   *Severity:* High. This is a foundational theoretical conflict.
          *   *Resolution:* Refine Prop 1. Weber describes the state's *claim*, not necessarily the moral justification of absolute exclusivity. Or refine Prop 4/5 to be exceptions within the monopoly framework (e.g., the monopoly covers *public* order, private defense is a reserved right).
          *   *Scholarship:* Legal philosophers (Locke vs. Hobbes vs. Weber) disagree on whether the right of self-defense is surrendered in the social contract. US law generally recognizes self-defense but limits resistance to arrest (even unlawful arrest) in many jurisdictions.

      *   **Tension B: The Unreformable Bundle (2) vs. Anti-Abolition Gradualism (3).**
          *   *Analysis:* Prop 2 says police "cannot be made acceptable... bundled model... is itself a large part of the problem." Prop 3 says abolition is worse.
          *   *Is it genuine?* It looks like a tension (If it can't be made acceptable, why not abolish?), but Prop 3 offers a pragmatic reason (successor institutions fail). Prop 2 diagnoses the *current* model. Prop 3 rejects the *absence* of a model.
          *   *Resolution:* This is actually consistent if "restructuring" (unbundling) is distinct from "abolition" (removing public safety entirely). The tension is only semantic if "reform" in Prop 2 means "tinkering" vs "structural change."
          *   *Severity:* Low/Apparent. It dissolves if "restructuring" != "abolition" and != "tinkering."

      *   **Tension C: Civilizational Achievement (1) vs. Right to Resist State (5).**
          *   *Analysis:* Prop 1 says the monopoly reduces violence. Prop 5 encourages resistance to state agents, which could increase violence/undermine the monopoly.
          *   *Is it genuine?* Yes. If citizens actively resist state force, the monopoly is weakened.
          *   *Severity:* Medium-High.
          *   *Scholarship:* Common law historically allowed resistance to unlawful arrest; modern statutes often forbid it. This is contested.

      *   **Tension D: Private Ad Hoc Groups (4) vs. Monopoly/Abolition Fear (1 & 3).**
          *   *Analysis:* Prop 4 allows "ad hoc groups" in emergencies. Prop 3 fears "private protection rackets."
          *   *Is it genuine?* Yes. Where is the line between a permissible ad hoc group and a protection racket?
