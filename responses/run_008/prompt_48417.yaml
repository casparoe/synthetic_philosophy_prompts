      *   *Prop 3 (Gradualism/Anti-Abolition):* Opposes abolition. Successor institutions would fail (protection rackets or police in disguise).
      *   *Prop 4 (Private Self-Defense/Emergency):* Even in a just state, citizens retain the right of self-defense. In emergencies/breakdowns, private/ad hoc force (including lethal) is permissible *not* merely as state delegation but as an inherent right.
      *   *Prop 5 (Defense Against State):* A person subjected to unlawful state violence has the right to defend herself with force. Current law is wrong not to recognize this.

  3.  **Identify Potential Tensions:**
      *   *1 vs. 4:* State monopoly on force vs. Inherent private right to use force (even in a just state).
      *   *1 vs. 5:* State monopoly on force vs. Right to resist state agents.
      *   *2 vs. 3:* Current police are broken/unreformable vs. Abolition is worse (implies reform/restructuring is possible, but Prop 2 says "cannot be made acceptable... bundled model... is the problem"). *Wait, Prop 2 says the bundled model is the problem, Prop 3 says abolition is bad. This implies unbundling/restructuring is the path. This seems consistent.*
      *   *3 vs. 4/5:* Gradualism/State stability vs. Rights that might undermine state authority (resisting state, ad hoc groups).
