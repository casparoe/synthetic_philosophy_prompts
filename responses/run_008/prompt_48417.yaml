  5.  **Structure the Response:**
      *   **Introduction:** Acknowledge the task and the rigor required.
      *   **Section 1: Apparent Conflicts (The "Easy" Ones):** Address 2 vs. 3 first to clear the deck. Explain why they are compatible (Unbundling vs. Abolition).
