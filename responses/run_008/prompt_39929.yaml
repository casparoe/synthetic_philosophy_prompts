answer: |-
  **MEMORANDUM**

  **TO:** Pretrial Services Oversight Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **RE:** Recommendation Regarding Risk-Assessment Instrument (RAI) Usage in Bail Hearings

  **I. Introduction**

  For fifteen years, I have stood in this county's courtrooms as a public defender. I have represented clients who were dangerous, clients who were innocent, and far too many clients who were simply poor. Last month, I joined this Board with the understanding that our charge is to balance public safety with the fundamental liberty interest of the accused.

  We are currently voting on the continued use of our risk-assessment instrument (RAI). The audit data presents us with a difficult statistical reality: the tool is *calibrated* across racial groups (a high-risk score means the same likelihood of rearrest regardless of race), but it generates *false positives* at twice the rate for Black defendants compared to White defendants. In plain terms: among defendants who would *not* be rearrested, Black defendants are twice as likely to be flagged as high-risk and potentially detained.

  The vendor and our statistical advisors confirm this is not a glitch, but a mathematical constraint. Given differing base rates of rearrest between groups, no algorithm can simultaneously satisfy calibration and equal false-positive rates without being a perfect predictor. We are faced with a trade-off inherent to the math.

  After reviewing the data and consulting with stakeholders, **I recommend that the Board vote to retain the tool, but with significant modifications to its implementation and thresholds.** We cannot accept the status quo, but abolishing the tool entirely presents risks to justice that we must honestly confront.

  **II. The Case for Modification**

  My recommendation rests on two pillars: the protection of individual liberty and the necessity of auditability.

  **1. Mitigating Disparate Impact through Threshold Policy**
  While the statisticians are correct that we cannot mathematically eliminate the trade-off between calibration and false-positive rates, we are not powerless to change the *consequences* of that trade-off. The current tool categorizes risk to inform detention decisions. If the current threshold for "High Risk" results in an unacceptable disparity in false positives for Black defendants, we should adjust the threshold.

  By raising the score required to be designated "High Risk," we can reduce the number of false positives overall. Yes, this may increase the rate of false negatives (releasing some who would have been rearrested). This is a policy choice the Board is empowered to make. As a defender, I submit that in a system premised on innocence until proven guilt, the cost of a false negative (release) is ethically preferable to the cost of a false positive (detention of the innocent). We should tune the tool to prioritize liberty, even if it slightly reduces predictive efficiency.

  **2. Preserving Auditability**
  The RAI provides a data trail. When a judge uses a score, we can track it. We can audit it. We can challenge it. This transparency is a relatively new and fragile gain in our judicial system.

  **III. Confronting the Strongest Argument for the Losing Option (Dropping the Tool)**

  I must address the compelling argument for dropping the tool entirely. Many advocates, and perhaps some of you, feel that using a tool that mathematically guarantees a higher false-positive rate for Black defendants legitimizes systemic racism. There is moral clarity in this position. If the math is rigged, why play the game?

  Furthermore, we must confront the uncomfortable fact that **dropping the tool does not eliminate risk judgments; it merely returns them, unaudited, to the judges themselves.**

  If we abolish the RAI, judges will still assess risk. They will do so based on intuition, demeanor, charging decisions, and prior history. We know from decades of defense work that human judgment is not immune to bias; in fact, it is often more susceptible to implicit bias than an algorithm, and far harder to challenge. A judge's "gut feeling" cannot be audited for calibration. A judge's decision to detain cannot be easily compared against aggregate data to reveal disparities.

  By dropping the tool, we might cleanse our conscience of algorithmic bias, but we risk returning to a system of discretionary bias that is opaque and unaccountable. The RAI, flawed as it is, gives us a lever to measure injustice. Without it, we are blind to it.

  **IV. Specific Proposed Modifications**

  To balance these concerns, I propose the following modifications as a condition of renewing the vendor contract:

  1.  **Threshold Adjustment:** The cutoff score for a "High Risk" designation shall be raised. We must accept a higher tolerance for false negatives to reduce the disproportionate false positives affecting Black defendants.
  2.  **Presumptive Release for Low/Moderate Scores:** Judges shall be required to issue a written finding of "clear and convincing evidence" to detain any defendant flagged as "Low" or "Moderate" risk. The tool should create a presumption of liberty, not a presumption of detention.
  3.  **Decoupling from Monetary Bail:** Risk scores may inform supervision levels, but they shall not be used as the sole justification for setting monetary bail that a defendant cannot afford. Risk of rearrest is not a proxy for ability to pay.
  4.  **Base Rate Review:** We must acknowledge that "rearrest" is an imperfect proxy for "danger" or "guilt," and that differing base rates often reflect policing patterns rather than criminal behavior. We will commission a review of the input data to ensure we are not codifying historical policing biases into future risk scores.

  **V. Conclusion**

  We are asked to choose between a flawed tool and a flawed alternative. The vendor argues the tool is fair because it is calibrated. The statisticians argue the disparity is mathematically inevitable. But as a Board, we are not mathematicians; we are stewards of justice.

  Mathematical inevitability is not moral absolution. We can keep the tool's transparency while mitigating its harm through policy. I urge the Board to vote to retain the RAI only under the modified conditions outlined above. This path allows us to maintain the audit trail necessary to fight bias, while shifting the weight of the system back toward liberty.

  Respectfully,

  [Your Name]
  Board Member & Public Defender
