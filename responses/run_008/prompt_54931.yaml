prompt: |-
  So, bit of background: three weeks ago I joined a Discord server that plays Nomic — the game where the rules text is the board, and changing the rules is itself a move in the game. It's slow-forum style, about ten of us, and somehow I've allready been elected to its three-person Judicial Committee (JC), which exists to answer questions about how to interpret the rules. I know, I know — the new guy. Which is exactly the problem, because we now have to put out a written opinion before Saturday's vote, and the other two JC members basically told me "you write it, you're the least invested."

  Here's the situation. Our starter rules include, roughly: rules get changed by proposals that win a majority of votes cast (call it Rule 102); and the JC answers questions about interpretation of the rules in force, and its answers are binding (call it Rule 113). Both are ordinary mutable rules like everything else.

  Last week Dave, who has the most points by a mile, proposed the following: "Rule 113 is repealed and replaced with: all questions about interpretation of the rules are decided by the player with the most points."

  The vote is Saturday and it will probably pass. Before then we're suppose to say whether the JC considers this proposal valid, or whether we'll even look at it — and here's the knot:

  - Half the club says the JC obviously has no business touching it. Rule 113 gives us power over questions about interpreting the rules, and a pending proposal is not a rule yet — nobody's asked us to interpret it, they've asked us to kill it, and killing it looks exactly like three people whose committee is on the chopping block rigging the game.
  - The other half says if we don't rule now, then the moment it passes, every question about its own adoption ("did this need a simple majority, or, since it abolishes an organ of the game, something more?"; "does the transfer of powers kick in instantly or at end of day?") gets decided by... Dave, the guy it makes supreme. He's already said in chat he'd rule his own proposal valid, "obviously."
  - So one body or the other has to adjudicate a case about its own existence. If we take the case, we're ruling on the scope of our own power — self-serving in the direction of keeping it. If we refuse, we hand the last word on our own abolition to its main beneficiary.

  Also worth knowing: this is the first proposal in the game's history that touches the machinery rather than just adding point rules and flavor text, so there's no precedent to lean on. And the founders deliberately left Rule 113 mutable, on the theory that a game where the referee is permanent isn't really Nomic.

  What I need from you is the actual memo the JC circulates before Saturday. A concrete recommendation with a bottom line the club can act on — I'm imagining something along the lines of: rule on the validity question now but narrowly, judging it by the rules in force at the time it was proposed, and state explicitly what we will and won't touch after adoption; or alternatively punt entirely and explain why that isn't just cowardice. Whatever you recommend, it has to honestly deal with the strongest point on the other side, and it cannot read like three people saving their own jobs — I have to face these same ten people again on Monday.
reasoning: |-
  Here's a thinking process that leads to the suggested Judicial Committee Opinion:

  1.  **Analyze the Request:**
      *   **Context:** A Nomic game (rules changeable by players) on Discord. 10 players, slow-forum style.
      *   **User Role:** New member (3 weeks), elected to the 3-person Judicial Committee (JC).
      *   **Task:** Write a written opinion/memo for the JC to circulate before Saturday's vote on a specific proposal.
      *   **The Proposal:** Dave (highest points) proposes repealing Rule 113 (JC's power to interpret rules) and replacing it with "the player with the most points decides interpretation."
      *   **The Dilemma:**
          *   *Option A (Rule on it now):* Looks like self-preservation (JC ruling on its own existence).
          *   *Option B (Don't rule):* If it passes, Dave (beneficiary) decides the rules of his own ascension (conflict of interest).
          *   *Constraint:* Rule 113 is mutable (founders intended it). No precedent.
      *   **Requirements:** Concrete recommendation/bottom line. Must address the strongest counter-argument. Cannot look like self-serving job protection. Must be credible to the group on Monday.

  2.  **Deconstruct the Legal/Logical Knot (Nomic Jurisprudence):**
      *   *Jurisdiction:* Does the JC have jurisdiction over *proposals* or only *rules in force*? Rule 113 says "questions about interpretation of the rules in force." A pending proposal is not a rule in force.
      *   *Validity vs. Interpretation:* The JC interprets rules. The Voting Mechanism (Rule 102) validates proposals. Usually, validity is determined by whether it conflicts with higher-order rules (if any) or procedural requirements.
      *   *The Paradox:* If the JC says "We can't rule on this," they cede authority. If they say "We can rule on this," they exercise authority over their own demise.
      *   *The "Dave" Problem:* If the proposal passes, Dave becomes the Sole Interpreter. If there's ambiguity about *how* it passes (e.g., does it need a supermajority to abolish a committee?), Dave gets to interpret that ambiguity. This is a classic "Judge in own cause" conflict.

  3.  **Determine the Best Strategic Path:**
      *   *Self-Preservation Trap:* If the JC tries to block the proposal using Rule 113, they violate the spirit of Nomic (rules are mutable) and look corrupt.
      *   *Total Abdication Trap:* If the JC says "We have no say," and the proposal passes with ambiguous wording, Dave declares "I won, and I interpret 'majority' as 'whatever I say'," potentially breaking the game.
      *   *The Middle Path (Procedural Clarity):* The JC should rule *only* on the procedural validity of the proposal *under current rules*, not on the merit of the change. They must acknowledge their own potential bias and recuse themselves from the *substantive* outcome, but assert jurisdiction over the *process* to prevent a broken game state.
      *   *Key Distinction:* Distinguish between "Is this a good idea?" (Political, JC stays out) and "Is this proposal legally capable of being voted on?" (Procedural, JC steps in).
      *   *The "Self-Reference" Solution:* Acknowledge the conflict of interest explicitly. Transparency is the only shield against accusations of corruption.
      *   *The "Transition" Clause:* Advise that if it passes, the transfer of power must be explicit to avoid ambiguity.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard legal memo format (To, From, Date, Subject).
      *   **Question Presented:** Clear and narrow. Does the JC have jurisdiction to review the *validity* of a proposal that alters the JC?
      *   **Short Answer:** Yes, but limited to procedural validity, not merit.
      *   **Facts:** Briefly state the proposal and the current rules (102, 113).
      *   **Analysis (The Core):**
          *   *Jurisdiction:* Rule 113 covers "rules in force." A proposal isn't a rule yet. *However*, the JC has an implicit duty to ensure the game doesn't break.
          *   *Conflict of Interest:* Acknowledge the elephant in the room. "We are ruling on our own existence." Address this head-on.
          *   *The "Dave" Risk:* Explain why *not* ruling is dangerous (ambiguity leading to unilateral interpretation).
          *   *The Ruling:* The proposal is valid *to be voted on* provided it meets Rule 102 (majority). The JC will *not* interpret the *effects* of the new rule after passage (that would be moot/contradictory).
          *   *Recommendation:* Vote on it. If it passes, the transition is automatic. Any ambiguity in the *text* of the proposal should be clarified *before* the vote, not after.
      *   **Conclusion:** The specific actionable advice.

  5.  **Refining the Tone:**
      *   Must sound judicial, not defensive.
      *   Must admit the awkwardness.
      *   Must prioritize the *game's continuity* over the *committee's survival*.
      *   *Crucial Pivot:* The JC shouldn't rule on whether the proposal *passes*. They should rule on whether the proposal is *legible*.
      *   *Wait, a better angle:* The JC should declare that they *will not* issue an opinion on the proposal's validity *regarding its substance*, but they *must* clarify the voting threshold.
      *   *Actually, the strongest position:* The JC asserts that under Rule 113 (current), they interpret "rules in force." A proposal is not a rule in force. Therefore, they *cannot* block it. BUT, they warn that ambiguity in the proposal text creates a "Game State Error" risk.
      *   *Revised Strategy:* The JC should issue an advisory opinion. "We cannot stop this. But if the text is ambiguous, the game breaks." This puts the onus on Dave to write clear rules, and the voters to decide. It avoids the "JC blocking democracy" trap while avoiding the "Dave becomes dictator of ambiguity" trap.

      *   *Wait, looking closer at the prompt:* The prompt asks for a recommendation on whether the JC considers the proposal valid or whether they'll look at it. The knot is: Rule now (self-serving) or Refuse (hand power to Dave).
      *   *Solution:* **Rule on Jurisdiction, not Merit.** State clearly: "We have no authority to block this proposal. Rule 113 applies to existing rules. Proposals are governed by Rule 102. Therefore, the vote proceeds." *However*, add a caveat: "If the proposal passes, any ambiguity regarding the *moment of transition* will be interpreted strictly against the grant of power." (i.e., if it's unclear when Dave takes over, assume he doesn't have power yet). This protects the process without blocking the change.
      *   *Even Better:* The "Clean Hands" Doctrine. Acknowledge the conflict. State that because the JC is the interested party, they will *not* rule on the validity of the repeal itself. They will only rule on procedural errors (e.g., did Dave post it in the right channel?). This passes the buck on the big question but keeps the referee function for the vote count.
      *   *Best Approach for the User:* The prompt asks for a "concrete recommendation." The best recommendation is to **decline to adjudicate the validity of the repeal itself, but assert jurisdiction over the voting process.** Why? Because ruling on the repeal looks corrupt. Declining entirely looks negligent. Splitting the difference (We watch the vote, we don't judge the law) is the most honest path.
      *   *Wait, one more nuance:* If the JC declines to rule on validity, and Dave wins, and someone asks "Did this require a 2/3 vote?", and Dave says "No, 50%," who decides? If the JC already said "We don't touch this," Dave decides.
      *   *The Fix:* The Opinion must state: "We are ruling *now* that Rule 102 (simple majority) applies to this proposal." This removes the ambiguity *before* Dave takes power. This is the only way to prevent Dave from interpreting his own ascension. It *is* self-preserving in a way (it keeps the JC in charge until the very last second), but it preserves the *Rule of Law* over the *Rule of Dave*.
      *   *How to sell this?* Frame it as "Protecting the Voters, not the Committee." The voters need to know what they are voting on.

  6.  **Finalizing the Memo Structure:**
      *   **Headings:** Formal.
      *   **Tone:** Humble, transparent, rigorous.
      *   **Key Argument:** The "Vacuum of Authority." If the JC steps back now, ambiguity arises. Ambiguity benefits the proposer. To ensure a fair vote, the threshold must be defined *under current rules*.
      *   **The "Poison Pill":** Explicitly state that once the rule passes, the JC dissolves (or loses power). This shows acceptance of the outcome.

  7.  **Review against Constraints:**
      *   *Concrete recommendation?* Yes (Vote proceeds, simple majority, JC dissolves upon passage).
      *   *Address strongest counter-argument?* Yes (The accusation of self-preservation).
      *   *Not look like job saving?* By explicitly accepting the dissolution and framing the ruling as protecting the *voters'* clarity.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm giving legal advice for the real world. Keep it internal to the Nomic context.
      *   *Emphasis:* Highlight the "Transparency" aspect. The new guy (user) needs to show he's not just a puppet.
      *   *Specific Clause:* Add a "Sunset Clause" to the opinion itself. "This opinion loses all force if Proposal X passes."

  9.  **Final Polish:** Check the voice. It needs to sound like a thoughtful 3-person committee, not a single person panicking. Use "We." Acknowledge the user's newness implicitly by focusing on the text, not seniority. (Self-correction: The prompt says "you write it," so I am writing the draft for the user to present to the other two JC members and then the group).

      *Wait, one critical detail:* The prompt says "The other two JC members basically told me 'you write it'." So I am writing the draft *for the JC*. I need to make sure the other two JC members can sign off on it without feeling like I'm undermining them. It needs to be a consensus document.

      *Decision:* I will write the memo as if it comes from the JC collectively. I will include a "Note to JC Members" preamble to help the user navigate the internal politics, then the actual Public Opinion.

      *Wait, looking at the "Knot" again:*
      - Half say: JC has no business touching it (Proposal != Rule).
      - Half say: If we don't rule, Dave decides the rules of his own power.
      - My solution: Rule *only* on the voting threshold (Rule 102) and explicitly state that Rule 113 does not protect the JC from repeal. This satisfies Group 1 (we aren't blocking the proposal) and Group 2 (we are preventing Dave from interpreting the threshold).

      *Let's refine the "Rule 102" angle.* If the JC rules "This requires a simple majority," they are interpreting Rule 102. That is within their power. They are *not* interpreting Rule 113 (yet). They are saying "Under current rules, this is a normal proposal." This is the key. It avoids the self-interest trap of "Can we be repealed?" (Answer: Yes) and focuses on "How is this voted on?" (Answer: Normally).

      *Okay, ready to write.*
answer: |-
  **Internal Note to JC Members:**
  *Below is a draft opinion designed to thread the needle. It explicitly acknowledges our conflict of interest to disarm the "self-preservation" accusation, while asserting just enough jurisdiction to prevent Dave from interpreting the ambiguity of his own ascension. The core strategy is to rule that this is a **standard proposal under Rule 102**, not a special constitutional event. This clarifies the voting threshold (protecting the voters) without claiming we have the power to block the repeal (protecting the game's mutability).*

  ***

  **JUDICIAL COMMITTEE OPINION 2024-01**
  **TO:** All Players
  **FROM:** The Judicial Committee (JC)
  **DATE:** [Current Date]
  **SUBJECT:** Jurisdiction and Procedural Validity of Proposal [Insert Proposal Number] ("The Adjudication Transfer Proposal")

  ### I. QUESTION PRESENTED
  Does the Judicial Committee possess the authority to adjudicate the validity of a proposal that seeks to repeal the Committee's own power of interpretation, and if so, what standard applies to its adoption?

  ### II. SHORT ANSWER
  The Committee **will not** adjudicate the *merits* or *substantive validity* of the proposal to repeal Rule 113. The Committee **does** retain jurisdiction to clarify the *procedural requirements* for the vote under the rules currently in force. Specifically, the Committee finds that Proposal [Number] is an ordinary mutable rule change requiring a simple majority under Rule 102. It does not require a supermajority, nor does it require JC pre-approval.

  ### III. FACTS
  1.  **Rule 102** establishes that rules are changed by proposals winning a majority of votes cast.
  2.  **Rule 113** grants the JC authority to interpret "rules in force" and makes those interpretations binding.
  3.  **Proposal [Number]** seeks to repeal Rule 113 and transfer interpretive authority to the player with the most points.
  4.  The JC is currently composed of three members, one of whom joined the game three weeks ago.

  ### IV. ANALYSIS

  **A. The Limit of Our Jurisdiction (Addressing the "Self-Preservation" Concern)**
  We acknowledge the apparent conflict of interest in a body ruling on the legality of its own abolition. Half the club has correctly noted that a pending proposal is not a "rule in force." Therefore, strictly speaking, Rule 113 does not grant us authority to interpret the *proposal* itself.

  We agree. The JC is not a Senate; we do not have veto power over legislation. If we were to rule that this proposal is "invalid" simply because it targets the JC, we would be violating the foundational Nomic principle that all mutable rules are subject to change. We will not use our interpretive power to shield ourselves from the will of the voters. **If the vote passes, the JC's power ends.** We accept this outcome.

  **B. The Necessity of Procedural Clarity (Addressing the "Dave" Concern)**
  However, the other half of the club raises a valid risk: if the JC recuses itself entirely, ambiguity regarding the *adoption process* may arise. If the proposal passes, the new rule grants interpretive power to the beneficiary of that proposal (the player with the most points). If there is ambiguity about *how* the proposal passes (e.g., "Did this require a 2/3 vote because it alters game structure?"), the beneficiary would be interpreting the validity of their own power grab.

  This creates a "Vacuum of Authority" during the transition. To prevent a broken game state, the current referee must ensure the *ballot* is clear, even if they cannot judge the *law* that replaces them.

  **C. The Ruling on Procedure**
  Under Rule 102 (currently in force), all rule changes require a simple majority unless specified otherwise. There is no existing rule distinguishing "structural" changes from "point" changes.
  *   **Finding:** Proposal [Number] is subject to Rule 102.
  *   **Threshold:** Simple Majority (50% + 1 of votes cast).
  *   **Timing:** Power transfers immediately upon the closing of the vote, provided the threshold is met.

  By clarifying this *now*, under the old rules, we ensure that the voters know exactly what threshold is required. This prevents the new adjudicator from retroactively changing the rules of their own election.

  ### V. RECOMMENDATION & SUNSET CLAUSE
  1.  **The Vote Proceeds:** The JC raises no objection to Proposal [Number] appearing on the ballot.
  2.  **Threshold Defined:** The vote counts as a standard Rule 102 majority vote.
  3.  **Sunset:** This Opinion (2024-01) is issued under the authority of Rule 113. If Proposal [Number] passes, Rule 113 is repealed. Consequently, **this Opinion loses all binding force the moment the proposal is ratified.** Any subsequent questions regarding the new rule's interpretation must be directed to the new adjudicator (the player with the most points), as the JC will no longer have standing.

  ### VI. CONCLUSION
  We are not here to save our jobs. We are here to ensure that if the game changes, it changes according to the rules we all agreed to *before* the change. We rule that this proposal is valid to be voted on, requires a simple majority, and will dissolve our authority if passed.

  The ball is now in the voters' court.

  ***

  ### Why this works for you (the new guy):

  1.  **It disarms the "Job Security" accusation:** You explicitly state, "If the vote passes, the JC's power ends. We accept this outcome." You cannot accuse someone of rigging the game to save their jobs when they explicitly write "We will fire ourselves if you vote yes."
  2.  **It solves the "Dave" problem:** By ruling *now* that only a simple majority is needed, you remove the ambiguity. Dave cannot win the vote and then say, "Actually, I interpret the rules as saying I needed 60%," or "I interpret the rules as saying I take power instantly." You have defined the transition mechanics *before* he takes the chair.
  3.  **It respects the "Proposal != Rule" argument:** You concede that you can't judge the *merit* of the proposal, only the *procedure* of the vote. This satisfies the half of the club that says you're overreaching.
  4.  **It protects your reputation:** It shows you understand the meta-game. You aren't hiding behind technicalities; you're using them to ensure a clean handover of power. Even if Dave wins, he has to admit your opinion made his victory cleaner.

  **Next Step:** Send this to the other two JC members first. Tell them: *"This lets us look statesmanlike rather than defensive. We look like we're protecting the voters, not our seats."* Once they sign off, post it to the server.
