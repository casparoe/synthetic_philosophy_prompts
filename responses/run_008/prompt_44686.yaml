      *   *Sentence 3:* "Since there are no principles, the particularist can't explain how anyone learns morality, or how you could ever argue with someone who disagrees — you just have to trust your gut, which is why the view collapses into relativism."
          *   *Assessment:* This is the standard objection (the "learning/argument objection"), but the conclusion ("collapses into relativism") is a *charge* made by critics, not a commitment of particularists. Dancy argues we learn via perception/sensitivity, not rule-application. Relativism is a non-sequitur; particularism can be realist.
