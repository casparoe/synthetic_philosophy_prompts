      *   *Sentence 4:* "And empirical psychology backs this up: situationist experiments show that character is basically an illusion, so moral principles must be too."
          *   *Assessment:* This is a category error. Situationism attacks *virtue ethics* (global character traits), not necessarily moral *principles* (generalism). Particularism isn't dependent on situationism.
          *   *Verdict:* Conflation of Situationism vs. Virtue Ethics with Particularism vs. Generalism.

      *   *Sentence 5:* "Honestly Ross's prima facie duties already did all the work particularism wants to do, just more carefully, so the whole debate is kind of over."
          *   *Assessment:* This is the biggest philosophical error. Ross is a *Generalist* (pluralist). He believes in invariant *prima facie* principles. Particularists attack Ross specifically because those principles aren't invariant.
