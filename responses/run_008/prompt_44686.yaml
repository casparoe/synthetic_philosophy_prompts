      *   **Sentence 3 (Learning/Argument/Relativism):** Address the "gut feeling" charge. Explain moral perception. Crucially, debunk the relativism claim (Particularism $\neq$ Subjectivism).
      *   **Sentence 4 (Situationism):** Point out the mismatch. Situationism targets Virtue Ethics. Particularism targets Principle-based ethics. They are different axes.
