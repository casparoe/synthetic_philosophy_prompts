answer: |-
  This is a classic philosophy-friend scenario: a mix of accurate summary, standard textbook objections, and a few category errors thrown in to seal the deal. Your friend's text is a very competent "Generalist's Critique of Particularism," but it presents several contested objections as if they were settled facts.

  Here is a sentence-by-sentence breakdown of what Dancy would sign off on, where the conflations are, and how to handle the Ross question for dinner on Friday.

  ### 1. "Particularists like Jonathan Dancy hold that there are no general moral truths at all — morality is just too messy to be captured by principles."

  *   **Verdict:** *Mostly right, but slightly imprecise.*
  *   **What Dancy says:** Dancy doesn't necessarily deny that there are *true* generalizations (e.g., "Lying is usually wrong"). What he denies is **codifiability**. He argues there are no principles that *determine* the rightness of an action. A principle implies that if feature X is present, it contributes the same moral weight every time. Dancy says morality isn't "messy" in a way that prevents description, but that the *structure* of moral reasoning isn't principle-based.
  *   **The Nuance:** A particularist can agree that "Killing is wrong" is a true sentence. They just deny that "Killing is wrong" functions as a major premise in a syllogism that *proves* a specific act is wrong.
  *   **For Dinner:** Concede that morality has patterns, but insist that patterns $\neq$ principles. Principles imply exceptionless rules (or rules with specifiable exceptions); particularists say the "exceptions" are open-ended.

  ### 2. "Their key argument is holism of reasons: reasons always depend on context, so a reason in one case might be a different reason in another."

  *   **Verdict:** *Correct on the concept, slightly loose on the technicality.*
  *   **The Technical Claim:** You have a good memory here. **Holism of Reasons** is a specific technical claim. It isn't just that "context matters" (everyone agrees context matters). It is that a feature that counts as a reason **for** an action in one case can count as a reason **against** it in another, or as **no reason at all** in a third, without any change in the feature itself.
      *   *Example:* That an act would be amusing is usually a reason *for* telling a joke. But if the joke is at a funeral, that same feature (amusement) becomes a reason *against* telling it.
  *   **What Dancy says:** He would sign off on this enthusiastically. This is the engine of his view. If reasons are holistic, then you cannot build invariant principles (because principles require features to have invariant valence).
  *   **For Dinner:** Clarify that holism isn't just "context modifies weight," but "context can flip the polarity."

  ### 3. "Since there are no principles, the particularist can't explain how anyone learns morality, or how you could ever argue with someone who disagrees — you just have to trust your gut, which is why the view collapses into relativism."

  *   **Verdict:** *This is the biggest conflation in the text.*
  *   **Learning/Argument:** This is a standard objection (the "Acquisition Objection"), not a fact. Particularists argue we learn morality like we learn language or perception: by developing a **sensitivity** to features, not by memorizing rules. We argue by pointing out relevant features ("Look, he's in pain"), not by citing rules ("It says in the code...").
  *   **The "Gut" Charge:** Particularists hate the phrase "trust your gut." It sounds like emotivism or intuitionism in the crude sense. Dancy argues for **Moral Perception**. It's a cognitive skill, not a feeling.
  *   **Relativism:** **This does not follow.** This is a category error.
      *   *Relativism:* Moral truth varies between agents/cultures.
      *   *Particularism:* Moral truth varies between *situations*.
      *   A particularist can be a hardline moral realist. They can believe there is one objective right answer to a specific situation, even if that answer isn't derived from a general rule.
  *   **For Dinner:** This is your strongest point of pushback. Tell her: "Particularism is about the structure of reasons, not the status of truth. I can believe there is an objective fact of the matter about this specific lie without believing there's a universal rule against lying."

  ### 4. "And empirical psychology backs this up: situationist experiments show that character is basically an illusion, so moral principles must be too."

  *   **Verdict:** *Conflation of two different debates.*
  *   **The Error:** Situationism (Doris, Harman) attacks **Virtue Ethics**. It argues that global character traits (like "Honesty") don't exist because people act differently in different situations.
  *   **The Mismatch:** Particularism attacks **Generalism** (Principle-based ethics).
      *   You can be a Situationist and a Generalist (principles determine action, character doesn't exist).
      *   You can be an Anti-Situationist and a Particularist (character exists, but it's not rule-following).
  *   **What Dancy says:** Dancy's arguments are conceptual (about the logic of reasons), not empirical. He doesn't need psychology to prove holism; he thinks it's true by analysis of what a "reason" is.
  *   **For Dinner:** Point out that Situationism kills *Character*, not *Principles*. If anything, Situationism might support Generalism (if agents have no character, they need external rules to guide them).

  ### 5. "Honestly Ross's prima facie duties already did all the work particularism wants to do, just more carefully, so the whole debate is kind of over."

  *   **Verdict:** *Incorrect. This is exactly the fight they are having.*
  *   **The Relationship:** W.D. Ross is the hero of **Moderate Generalism**, not Particularism.
      *   Ross argued that features (like "breaking a promise") have an invariant *prima facie* moral force. They always count against an action, even if they are overridden by other duties.
      *   Dancy argues that even *prima facie* force isn't invariant. Sometimes, breaking a promise isn't even a *prima facie* wrong (e.g., if the promise was coerced, it might not generate a duty at all, not even a defeated one).
  *   **The "Middle Position":** You asked if there is a middle ground. Yes.
      *   **Moderate Generalism:** There are principles, but they can be overridden (Ross).
      *   **Moderate Particularism:** There are default reasons, but their valence can switch (Dancy).
      *   **The "Rescue":** Some philosophers (like David McNaughton) try to defend Ross against Dancy. They argue that if you formulate the principles carefully enough (with "ceteris paribus" clauses), Ross works. Dancy replies that you can't list all the exceptions, so the principle is empty.
  *   **For Dinner:** Tell her Ross is the *opponent*. Particularism was invented largely to explain why Ross's *prima facie* duties fail to capture the variability of moral reasons.

  ### Summary for Your Dinner Strategy

  If you want to "concede" gracefully while holding your ground, here is the map:

  1.  **Concede:** She is right that Holism is the key argument.
  2.  **Concede:** She is right that the "Learning/Argument" objection is the biggest problem for particularists (admit this is a challenge, not a refutation).
  3.  **Push Back:** The **Relativism** charge is false. Particularism is compatible with Realism.
  4.  **Push Back:** **Ross** is a Generalist. He believes in invariant *prima facie* forces; Dancy denies even that. They are on opposite teams.
  5.  **Push Back:** **Situationism** is about character traits; Particularism is about moral reasons. They are different axes.

  **The "Winning" Move:**
  Tell her: "You've summarized the *objections* to particularism perfectly, but you've presented them as if they are *features* of the view. Dancy wouldn't say morality is 'too messy,' he'd say it's 'too nuanced for principles.' And he definitely wouldn't call himself a relativist. If you want to beat me, attack the Holism of Reasons directly—don't just assert that it leads to relativism."

  This validates her research (so she doesn't feel dismissed) but corrects the philosophical record (so you don't have to concede the argument). Enjoy the dinner!
