      *   *Refining the Coin Flip (6):* If I'm a Total Utilitarian, I care about the sum. If the sum is equal, why reject? Usually because of *distribution* (egalitarianism) or *risk aversion* (prioritarianism). This conflicts with pure Total Utilitarianism (1) which is usually indifferent to distribution. So (1) and (6) clash unless (1) is modified to be Prioritarian.

      *   *Re-evaluating the "Cheapest" Fix:*
