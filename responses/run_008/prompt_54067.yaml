prompt: |-
  hey, so I'm taking this seminar on decision theory meets ethics (basically rational choice + normative theory) and we just wrapped the unit on fanaticism, and now I'm worried my whole view package falls apart. writing up where I actually stand for my final paper and want a consistency check before I commit to it:

  1. I'm a total utilitarian — value is just the sum of welfare over all lives, and there's no cap on it: adding another happy life always makes the world better, and for any outcome you describe, there's a possible one that's better.
  2. when the probabilities are known and well-grounded, rational choice just is expected value maximization. full stop.
  3. fanaticism is false. the example from lecture — save a million lives for sure, or take a 1-in-10^3,000 shot at a 10^3,007-person utopia — you take the million, obviously, and not just because our brains can't do big numbers.
  4. you shouldn't pay Pascal's mugger, and I don't think refusing makes you scope-blind or arbitrary.
  5. my own giving is mostly to an asteroid-detection charity, even though the chance it ever matters in my lifetime is minuscule — I don't think this is inconsistent with anything above, but my TA definitely smirked when I said that in section.
  6. I also think it's fine to refuse a coin flip that would either wipe out a small island community or give double the value to a much richer region, even though the two sides are supposedly equal in expectation.

  which of these actually clash, which only look like they clash, and what's the cheapest way to restore consistency? like actually rank the tensions by severity instead of just listing them, and for each one tell me what I'd have to give up and what that would cost me. I'm honestly not sure anymore whether the fix is biting fanaticism, capping value somewhere (which feels horrible), or quietly weakening (2), so don't spare my feelings about which commitment is doing the least work.
reasoning: |-
