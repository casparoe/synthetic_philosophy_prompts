          *   (3) The "extra condition" (justification, etc.) is valuable only for truth-conduciveness.
          *   (4) The "swamping problem": Once you have the truth, the truth-conducive mechanism adds no extra value (like a reliable coffee machine making a good cup; the cup is good regardless of the machine once you have it).
          *   (5) Knowledge value = TB value + 0.
          *   (6) Conclusion: Knowledge $\ngtr$ TB.
