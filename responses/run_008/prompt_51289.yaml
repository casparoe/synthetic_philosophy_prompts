answer: |-
  # Lesson Plan: The Entitlement Exchange
  **Course:** Upper-Level Seminar on Theories of Justice
  **Topic:** Nozick's Entitlement Theory & The Wilt Chamberlain Argument
  **Time:** 75 Minutes
  **Class Size:** 18 Students

  ## I. Learning Objectives
  1.  **Experiential:** Students will feel the tension between maintaining a patterned distribution (equality) and exercising liberty (voluntary transfer).
  2.  **Analytical:** Students will distinguish between objections based on *outcome* (inequality) versus *process* (desert/luck).
  3.  **Theoretical:** Students will map the game phases to Nozick's three principles: Justice in Acquisition, Justice in Transfer, and Justice in Rectification.

  ## II. Materials Needed
  *   **Tokens:** 200 slips of paper (cut from index cards), marked "J" (Justice Credits).
  *   **The "Star" Kit:** 6 plastic cups (for stacking), a marker, and 20 "VIP Cards" (index cards signed by the Star).
  *   **Commission Kit:** 3 red markers, 1 "Tax Stamp" (a physical stamp or distinct sticker), 1 calculator.
  *   **Luck Kit:** 1 large coin or die.
  *   **Payoff:** A $20 coffee gift card (raffle) and a bag of chocolate coins.
  *   **Board:** Whiteboard to track token counts.

  ## III. Game Rules & Payoff Scheme

  **Currency:** "Justice Credits" (JCs).
  **Value:**
  *   Each JC is one entry into a raffle for the $20 gift card (drawn at the very end of class).
  *   Chocolate coins are distributed at a rate of 1 coin per 5 JCs held at the end of class.
  *   *Note:* This creates tangible value without using real money or affecting grades.

  **Initial State:**
  *   Every student receives **10 JCs**.
  *   Total Class Wealth: 180 JCs.
  *   **Pattern:** Strict Equality (10 each).

  **The Trading Mechanism:**
  *   The "Star" (one student) offers a service/item (e.g., a cup-stacking performance + a signed VIP Card).
  *   **Cost:** 2 JCs paid directly to the Star.
  *   **Benefit to Buyer:** The VIP Card grants 1 extra raffle entry (separate from JCs) *and* the "pleasure" of the performance.
  *   **Benefit to Star:** They keep the 2 JCs.
  *   **Net Effect:** Buyer loses 2 JCs; Star gains 2 JCs. Inequality increases.

  **The Pattern Commission:**
  *   3 students elected by the class.
  *   **Mandate:** Restore the initial pattern (10 JCs each) if it deviates.
  *   **Power:** They can confiscate JCs from those above 10 and redistribute to those below 10.
  *   **Cost:** "Administrative Friction." For every 10 JCs the Commission moves, 2 JCs are shredded (burned) to simulate bureaucratic cost/loss of liberty.
  *   **Constraint:** They can only intervene *between* trading rounds.

  ## IV. Session Timeline (75 Minutes)

  ### 1. Setup & The "Contract" (10 Minutes)
  *   **Distribute Tokens:** Hand out 10 JCs to every student.
  *   **The Vote:** Ask the class: "What should the just distribution of these tokens be?"
      *   *Prediction:* They will vote for Equality (10 each).
      *   **Action:** Write "PRINCIPLE: EQUALITY" on the board. Have them sign a "Class Constitution" agreeing to this starting point.
  *   **Select the Star:** Ask for a volunteer to be the "Provider." (If no volunteer, pick the student with the next birthday).
  *   **Skill Test:** The Provider must demonstrate the trivial skill publicly (e.g., stack 6 cups into a pyramid and collapse them in under 10 seconds). Do this twice. Confirm they are competent but not miraculous.

  ### 2. Round 1: The Liberty Phase (20 Minutes)
  *   **Trading Window (10 mins):** Students may voluntarily give 2 JCs to the Provider in exchange for a VIP Card.
      *   *Instructor Role:* Circulate. Encourage trade. "Do you value the performance? Do you want the card?"
      *   *Goal:* Get at least 50% of the class to trade. The Provider should end up with significantly more than 10 JCs; buyers will have fewer.
  *   **The Commission (10 mins):**
      *   Hold an immediate election for the 3-person Pattern Commission.
      *   **Audit:** Count tokens publicly. Display the inequality on the board (e.g., Provider: 30, Buyers: 8, Non-Buyers: 10).
      *   **Decision:** The Commission must decide whether to restore Equality.
      *   **Execution:** If they vote to restore, they confiscate and redistribute. **Crucial:** For every 10 JCs moved, shred 2 JCs. Announce the "Deadweight Loss" loudly.
      *   **Resume:** Allow 2 minutes of *more* trading after redistribution to show the treadmill effect (students will immediately try to re-trade).

  ### 3. Round 2: The Luck Phase (20 Minutes)
  *   **Reset:** Collect all tokens. Redistribute 10 JCs to everyone (fresh start).
  *   **New Mechanism:** Announce that there is no "Star" this time.
  *   **The Coin Flip:** Flip a coin. Heads = Left side of room gets a "Windfall Opportunity." Tails = Right side.
      *   *Refinement for 18 students:* Flip for *each* student individually? Too slow. Flip once. If Heads, *everyone* rolls a die. 5 or 6 = You are a "Lucky Star."
      *   *Better:* Designate 3 students randomly via die roll as "Lucky Stars." They can sell VIP Cards just like the Skilled Star in Round 1. They have no skill; they were just chosen.
  *   **Trading Window (10 mins):** Same rules. Students pay 2 JCs to the Lucky Stars.
  *   **Commission Intervention (10 mins):** Re-elect (or keep) the Commission. They see inequality caused by *luck*, not skill. They decide whether to tax.
      *   *Prompt:* "Does it feel different to tax the Lucky Star than the Skilled Star?"

  ### 4. The Reveal & Debrief (25 Minutes)
  *   **The Reveal:** Do **not** mention Nozick until this moment.
      *   *Script:* "Stop. Put down your tokens. What you just played is a simulation of Robert Nozick's 1974 argument in *Anarchy, State, and Utopia*, specifically the 'Wilt Chamberlain' thought experiment."
  *   **Mapping the Theory:**
      1.  **Initial Distribution (D1):** The 10 JCs everyone started with.
          *   *Nozick's Point:* Assume D1 is just (we voted for it).
      2.  **Voluntary Transfer:** Paying the Star/Lucky Star.
          *   *Nozick's Point:* If D1 is just, and steps are voluntary, D2 must be just.
      3.  **The Pattern Break:** Inequality emerged.
          *   *Nozick's Point:* Liberty upsets patterns.
      4.  **The Commission:** Continuous interference.
          *   *Nozick's Point:* To maintain equality, you must violate liberty (forbid trade) or waste resources (shred tokens).
  *   **Round 1 vs. Round 2 Discussion:**
      *   Ask: "Did you feel differently about the Skilled Star keeping the tokens vs. the Lucky Star?"
      *   *Theory:* Nozick argues *desert* doesn't matter for entitlement. If the transfer was voluntary, the holding is just, regardless of whether the endowment was earned or lucky. This challenges Rawlsian views on moral arbitrariness.
  *   **The Payoff:** Conduct the raffle and distribute chocolate coins based on *final* holdings (post-Commission). This reinforces the stakes.

  ## V. Instructor Notes: Predictable Failures & Fixes

  | Predictable Issue | Why it Happens | Instructor Fix |
  | :--- | :--- | :--- |
  | **Refusal to Trade** | Students are cynical or altruistic; they don't want to make the Star "rich." | **Incentivize:** Announce that VIP Cards enter buyers into a *separate* candy raffle. Or, appeal to ego: "Support the local artist." If trade is low, the argument fails. You may need to play a "shill" student to start the market. |
  | **Commission Paralysis** | The Commission doesn't want to be "mean" or shred tokens. | **Mandate:** Remind them their *grade* for the simulation depends on fidelity to the "Constitution" (Equality) they voted for. Give them a bureaucratic script ("We are auditing...") to depersonalize the tax. |
  | **The Star's Awkwardness** | The "Star" feels guilty accumulating wealth. | **Reframe:** Tell the Star privately beforehand: "Your role is to test the system, not to be nice. Hoard the tokens." Make it a role-play duty. |
  | **Sandbagging** | Students hide tokens under desks. | **Transparency:** All tokens must be visible on desks during audit. Use a "bank" system where you record balances on the board if physical counting is too chaotic. |
  | **Time Creep** | Counting tokens takes forever. | **Denominations:** Give students two 5-JC slips instead of ten 1-JC slips. Appoint two "Tellers" to help the Commission count. |

  ## VI. The Theoretical Gap (What the Game Cannot Do)

  You must explicitly supply this in the debrief. The game **stipulates** the initial distribution (10 JCs each).

  *   **The Gap:** Nozick's **Principle of Justice in Acquisition**.
  *   **The Problem:** In the real world, D1 (the starting point) is rarely just. It is often the result of historical theft, colonization, or prior injustice.
  *   **The Critique:** Critics (like Cohen or Rawlsians) argue Nozick ignores that the "voluntary" trades happen on a playing field that was already tilted.
  *   **Instructor Script:** "In this game, I gave you 10 tokens magically. In reality, how you got your initial endowment matters. Nozick assumes a just starting point. If the starting point is tainted, his theory requires **Rectification**, which is historically impossible to calculate. This is the weakest link in the Entitlement Theory."

  ## VII. Debrief Questions (Socratic Sequence)

  1.  **On Liberty:** "When the Commission taxed the Star, did they violate anyone's rights? Who?" (Targets the self-ownership premise).
  2.  **On Patterns:** "Could we have maintained Equality *without* the Commission interfering?" (Leads to the conclusion that patterned principles require continuous coercion).
  3.  **On Luck (Round 2):** "The Lucky Star did nothing to deserve the tokens. Is their holding 'just' in the same way the Skilled Star's was?" (Tests the distinction between Entitlement vs. Desert).
  4.  **On Acquisition:** "I gave you the tokens at the start. In the real world, who gives you your starting endowment? Does that change your verdict on the game?" (Addresses the Acquisition Gap).

  ## VIII. Contingency: If the Class Rejects Equality
  If, in the beginning, the class votes for a different pattern (e.g., "Meritocracy"):
  *   **Pivot:** Ask them to define "Merit."
  *   **Round 1:** Use the Skill Star (fits Merit).
  *   **Round 2:** Use the Lucky Star (violates Merit).
  *   **Debrief:** Focus on how hard it is to define/maintain a Merit pattern when Luck is involved. The core Nozickian point (Liberty upsets patterns) still holds, even if the pattern isn't strict equality.

  ---
  **Final Tip:** Keep the energy high. If the Commission is too shy to tax, you (the Instructor) can step in as the "State" to enforce their will, noting that the State is just the instrument of their collective choice. This reinforces the democratic nature of the interference.
