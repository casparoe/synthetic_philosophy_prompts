  # The Decision Theory Sorting Quiz

  **Instructions:** Read each scenario. Choose the option that matches what you would *actually do*. Do not worry about what theory you think is correct; answer based on your intuition in the moment. There are no trick questions, only trade-offs.

  **1. The Two Boxes**
  A predictor with 99% accuracy has placed $1,000 in Box A and either $1,000,000 or nothing in Box B. If the predictor thought you would take only Box B, she put $1,000,000 inside. If she thought you would take both, she left Box B empty. The money is already in the boxes. Do you:
  A) Take only Box B.
  B) Take both Box A and Box B.

  **2. The Smoking Gene**
  A genetic lesion causes both a desire to smoke and lung cancer. Smoking itself does not cause cancer. You enjoy smoking ($100 value), but cancer is terrible (-$1,000,000 value). The lesion and smoking are highly correlated. Do you:
  A) Smoke.
  B) Do not smoke.

  **3. The Medical Scan**
  Same as #2, but you have just undergone a perfect genetic scan. You know for a fact you *do not* have the lesion. However, you also notice you feel a strong physical craving to smoke. Do you:
  A) Smoke.
  B) Do not smoke.

  **4. Death in Damascus**
  Death predicts where you will be tomorrow with 100% accuracy. If he predicts you will be in Damascus, he waits there. If he predicts Aleppo, he waits there. You want to avoid Death. You are currently in Damascus. Do you:
  A) Stay in Damascus.
  B) Go to Aleppo.

  **5. Death's Coin**
  Same as #4, but you have a fair coin. You can commit to going wherever the coin lands. Death predicts your *strategy* (Stay, Go, or Flip). If you flip, he guesses the outcome (50% chance of being right). Do you:
  A) Stay in Damascus.
  B) Go to Aleppo.
  C) Flip the coin and obey it.

  **6. The Transparent Boxes**
  Same as #1, but the boxes are transparent. You can see $1,000 in Box A and $1,000,000 in Box B. The predictor has already acted. Do you:
  A) Take only Box B.
  B) Take both Box A and Box B.

  **7. The Psychopath Button**
  Pressing a button kills all psychopaths in the world. You are not a psychopath. However, only a psychopath would choose to press such a button. If you press, you reveal you are a psychopath (and thus die). If you don't, you live. Do you:
  A) Press the button.
  B) Do not press the button.

  **8. The Logical Voucher (Original)**
  Omega gives you a voucher worth $10,000. He says: "I predicted whether you would burn this voucher if I asked. If I predicted you would burn it, I gave you the voucher. If I predicted you would keep it, I gave you nothing." You have the voucher. Omega now asks you to burn it. Burning gains you nothing directly. Do you:
  A) Burn the voucher.
  B) Keep the voucher.

  ***

  # Scoring Key

  **Tally your answers:**

  *   **Causal (CDT):** 1B, 2A, 3A, 4A/B (Indifferent), 5A/B (Rejects Coin), 6B, 7A, 8B.
  *   **Evidential (EDT):** 1A, 2B, 3B (Craving is evidence), 4A/B (Indifferent), 5A/B (Rejects Coin), 6B (Money is there), 7B, 8B.
  *   **Tickle-EDT:** 1A, 2B, 3A (Craving screens off), 4A/B, 5A/B, 6B, 7B, 8B.
  *   **Functional/Updateless (FDT):** 1A, 2A, 3A, 4C (Flip), 5C (Flip), 6A, 7B, 8A.

  **Interpretation:**

  *   **Mostly CDT:** You prioritize causal impact. You two-box in Newcomb because the money is already there, and you smoke because smoking doesn't cause cancer. You view randomization (Q5) as surrendering agency to chance.
  *   **Mostly EDT:** You prioritize news value. You one-box in Newcomb (good news), but refuse to smoke (bad news). In Transparent Newcomb (Q6), you two-box because the money's presence is already fixed evidence.
  *   **Mostly Tickle-EDT:** You are an Evidentialist who conditions on internal states. You match EDT on Q2 (Don't Smoke) but diverge on Q3 (Smoke), treating the "craving" as a screening variable that breaks the evidential link to the lesion.
  *   **Mostly FDT:** You prioritize logical correlation and policy selection. You one-box even when boxes are transparent (Q6) and you randomize in Death in Damascus (Q5) to break the predictor's lock on your specific location. You burn the voucher (Q8) to ensure you are the *type* of agent who receives vouchers.

  **Uninhabited Patterns:**
  *   **1A / 2A (One-Box + Smoke):** *Coherent.* (FDT).
  *   **1B / 2B (Two-Box + No-Smoke):** *Uninhabited.* This implies you believe your choice causally affects the predictor's past placement (forcing 2-box to be bad) but does not correlate with the lesion (allowing No-Smoke). This is an inconsistent model of correlation vs. causation.
  *   **5C / 7A (Flip Coin + Press Button):** *Uninhabited.* If you believe randomizing defeats prediction (Q5), you must believe your algorithm is predicted. If your algorithm is predicted, pressing the Psychopath Button (Q7) identifies you as a psychopath. You cannot consistently trust prediction to fail in one case and succeed in the other without a principled distinction.

  **Limitations:**
  *   **EDT vs. FDT:** This quiz separates them on Transparent Newcomb (Q6) and the Voucher (Q8). However, in standard Newcomb (Q1) and Smoking (Q2), they often agree. A reader scoring 1A/2A/6B/8B is in a transitional or hybrid state not fully captured by the four main leaves.
  *   **Tickle vs. CDT:** On the Smoking cases (Q2, Q3), Tickle-EDT and CDT give the same answers. They are separated only by their reasoning on Q1 (Newcomb). If a reader answers 1B/2A/3A, they are CDT. If they answer 1A/2A/3A, they are FDT. There is no unique "Tickle + CDT" leaf; Tickle is a modification of EDT.

  **Note on Q3:** If you answered 3B (Don't Smoke) despite knowing you lack the lesion, you may hold a "Fatalist" view not represented here, or you distrust the scan. This pattern is rare and marks a deviation from standard decision theories.
