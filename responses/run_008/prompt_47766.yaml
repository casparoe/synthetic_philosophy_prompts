answer: |-
  **MEMORANDUM OF PROCEDURE: SAR TRIAGE PROTOCOL 7-ALPHA**
  **TO:** Incident Commander (IC)
  **SUBJECT:** Dual-Group Triage Decision Matrix
  **CLASSIFICATION:** FIELD OPERATIONAL / LEGAL DEFENSIBILITY

  ### 1. PREAMBLE AND CORE SELECTION

  You asked for a procedure that respects the individual claim of the minority without ignoring the aggregate loss of the majority. You asked me to choose among three cores.

  **Selected Core: (b) The Weighted Lottery.**

  **Rationale:**
  *   **Core (c) Maximization** is rejected per your directive; it offers zero justification to the unchosen minority.
  *   **Core (a) Strict Taurek (50/50 Coin Flip Between Groups)** is philosophically pure but operationally fragile. In a 1-vs-30 scenario, a coin flip that results in 30 deaths will be ruled gross negligence by a coroner and a jury. It treats the claim of one person as equal to the combined claims of thirty, which public trust cannot sustain.
  *   **Core (b) Weighted Lottery** is the only defensible middle ground. It acknowledges that the single person has a *claim* (non-zero probability) but acknowledges that the group has a *weight* (higher probability). It converts a moral tragedy into a mathematical risk distribution that can be logged, audited, and explained.

  **The Procedure Below** is designed to be executed in under five minutes. If it cannot be completed in five minutes, see Section 6 (Defaults).

  ---

  ### 2. THE DECISION PROCEDURE (7-ALPHA)

  **Step 1: Viability Filter (Triage)**
  *   **Question:** Are all identified parties medically salvageable with available resources?
  *   **Criteria:** Apply START/JumpSTART triage rules.
  *   **Action:** If a casualty is "Expectant" (black tag) due to injury severity or time-to-extraction, remove them from the count immediately.
  *   **Termination:** If only one group remains viable, proceed to that group. Procedure ends.
  *   **Hand-off:** If medical viability is ambiguous, consult Medical Officer. If no Medical Officer, IC decides based on visible signs of life.

  **Step 2: Causality and Conduct Filter**
  *   **Question:** Did any party create the emergency through gross negligence or criminal action (e.g., ignoring closure notices, suicide attempt vs. accident)?
  *   **Criteria:** **None.** SAR ethics dictate neutrality of cause.
  *   **Action:** Ignore fault. Do not deduct "tickets" from the lottery based on behavior.
  *   **Reasoning:** Introducing moral judgment slows decision-making and introduces bias that cannot be defended in court.
  *   **Exception:** If the rescue of Group A poses significantly higher risk to rescuers than Group B, proceed to Step 3a.

  **Step 3a: Rescuer Risk Adjustment**
  *   **Question:** Does saving one group expose rescuers to "Unacceptable Risk" (high probability of responder death/injury) compared to the other?
  *   **Action:** If Yes, the group requiring unacceptable risk is removed from the lottery unless the other group is non-viable.
  *   **Reasoning:** We do not trade rescuer lives for casualties in a lottery.

  **Step 3: The Count**
  *   **Question:** What is the number of viable casualties in Group A ($N_A$) and Group B ($N_B$)?
  *   **Action:** Establish integers. $N_{Total} = N_A + N_B$.
  *   **Constraint:** Do not estimate "life-years" (age). Do not estimate "social value." Count heads only.
  *   **Reasoning:** Age and value judgments are subjective, discriminatory, and legally indefensible under time pressure.

  **Step 4: The Catastrophe Threshold (The Cliff)**
  *   **Question:** Is the ratio between the larger and smaller group greater than 20:1?
  *   **Criteria:** If $\max(N_A, N_B) / \min(N_A, N_B) > 20$.
  *   **Action:** If **Yes**, suspend lottery. **Maximize Lives.**
  *   **Reasoning:** At this magnitude, the "claim" of the individual is statistically overwhelmed by the scale of the catastrophe. A 1-in-21 chance (4.7%) for the single person is not a defensible use of public resources when 20 others die. This is the "Negligence Shield."
  *   **Action:** If **No**, proceed to Step 5.

  **Step 5: The Weighted Roll**
  *   **Question:** Generate a random integer between 1 and $N_{Total}$.
  *   **Tool:** Use agency-approved random number generator (RNG) app or physical dice. **Log the seed/time.**
  *   **Calculation:**
      *   If Result $\leq N_A$, deploy to Group A.
      *   If Result $> N_A$, deploy to Group B.
  *   **Result:** This gives Group A a probability of $N_A / N_{Total}$ and Group B a probability of $N_B / N_{Total}$.
  *   **Example:** 1 vs. 3. Total 4. Roll 1-4. If 1, save lone climber (25%). If 2-4, save hikers (75%).

  **Step 6: The Partiality Check**
  *   **Question:** Does the IC or any key decision-maker have a personal relationship with a casualty in either group?
  *   **Action:** If **Yes**, IC must recuse immediately. Command transfers to Second-in-Command.
  *   **Constraint:** If IC is the *only* qualified commander available (e.g., remote night ops), IC proceeds but must mark the decision as **"Judgment Override"** in the log (see Case 3).

  **Step 7: Execution and Log**
  *   **Action:** Deploy resources.
  *   **Documentation:** In the incident log, record: "Protocol 7-Alpha enacted. Counts: A=[x], B=[y]. Threshold check: Pass/Fail. RNG Seed: [value]. Result: [Group Selected]."

  ---

  ### 3. HARD EDGES ANALYSIS

  **A. Extreme Disparity (The Cliff)**
  *   **Procedure:** The 20:1 Threshold (Step 4).
  *   **Justification:** Below 20:1, the Weighted Lottery preserves the Taurekan insight (the one has a chance). Above 20:1, the procedure admits that "numbers count" absolutely to prevent public catastrophe.
  *   **Honesty:** This is an arbitrary line, but all legal lines are. It protects you from being the IC who flipped a coin and let a school bus die.

  **B. Life-Years (Child vs. Elderly)**
  *   **Procedure:** Explicitly Excluded (Step 3).
  *   **Justification:** Taurek's argument rests on the *claim to be saved*, not the *value of the future life*. Introducing age turns the IC into an actuary. It invites bias (e.g., valuing the wealthy or employed over the retired). In the field, you cannot verify age accurately.
  *   **Consequence:** You may save five 80-year-olds over one 10-year-old. This is morally painful but procedurally defensible.

  **C. Asymmetric Parties**
  *   **Negligence:** Ignored. A drunk climber has the same ticket as a sober one.
  *   **All-or-Nothing:** If Group B (5 people) is in a single vehicle that will slide off a cliff if approached partially, they count as 5 tickets. The risk is on the rescue team, not the lottery math.
  *   **Already Dead:** Removed in Step 1. They hold no tickets.

  ---

  ### 4. CASE RUNS

  **Case 1: The Clean Case (1 Climber vs. 3 Hikers)**
  *   **Step 1:** All viable.
  *   **Step 2:** No fault assessed.
  *   **Step 3:** $N_A = 1$, $N_B = 3$. Total = 4.
  *   **Step 4:** Ratio is 3:1. Threshold (20:1) not met. Proceed.
  *   **Step 5:** RNG generates 1-4.
      *   Result 1: Save Climber (25% chance).
      *   Result 2-4: Save Hikers (75% chance).
  *   **Log:** "7-Alpha executed. Roll: 3. Destination: South Ridge (Hikers)."
  *   **Justification to Family:** "We used a weighted risk protocol. Your son had a one-in-four statistical priority. The draw did not favor his location. We did not ignore him; the odds did not land."

  **Case 2: The Hard Edge (1 Swimmer vs. 15 Van Passengers)**
  *   **Step 1:** All viable.
  *   **Step 3:** $N_A = 1$, $N_B = 15$. Total = 16.
  *   **Step 4:** Ratio is 15:1. Threshold (20:1) not met. **Proceed to Lottery.**
      *   *Note:* This is the danger zone. The swimmer gets a 1/16 (6.25%) chance.
  *   **Step 5:** RNG generates 1-16.
      *   Result 1: Save Swimmer.
      *   Result 2-16: Save Van.
  *   **The Cliff:** If the van had **21** people, the ratio becomes 21:1. Step 4 triggers. **Maximize Lives.** The swimmer gets 0% chance.
  *   **Why here?** At 15, the loss is tragic but manageable. At 21+, the loss becomes a "mass casualty event" where utilitarianism is the only legal shield. The procedure admits that Taurek's view breaks under the weight of a massacre.
  *   **Honesty:** If the RNG picks the swimmer and the 15 drown, the coroner will still scrutinize you. However, the log shows you followed a ratified protocol that gave the majority a 94% chance. This is harder to attack than a 50/50 coin flip, but easier to attack than Maximization. You are trading legal safety for moral consistency.

  **Case 3: The Partiality Case (IC's Brother)**
  *   **Scenario:** 1 Casualty (Brother) vs. 3 Casualty (Strangers).
  *   **Step 6:** IC identifies relationship.
  *   **Standard Procedure:** IC recuses. Command transfers.
  *   **Field Reality:** If IC is the *only* commander on scene:
      *   IC marks decision as **"Judgment Override: Conflict of Interest."**
      *   IC **must not** run the lottery. Taurek permits partiality, but public service does not.
      *   **Action:** IC must default to **Maximize Lives** (Save the 3) to negate the conflict, OR save the brother and face an automatic inquiry.
      *   **Recommendation:** The procedure mandates saving the **3**.
      *   **Log Entry:** "Conflict of Interest identified (Casualty A is sibling). Protocol 7-Alpha suspended. Decision: Maximize Lives to mitigate bias. Casualty A not rescued."
      *   **Why:** Taurek's permission for partiality applies to private individuals. You are a state actor. If you save your brother over three strangers using a "Taurekan" excuse, it will be ruled corruption, not philosophy. You must sacrifice the philosophical consistency to save your career and the squad's reputation.

  ---

  ### 5. FAILURE MODES AND DEFAULTS

  **A. The "Negligence" Trap**
  *   **Risk:** In Case 2 (1 vs. 15), if the lottery saves the 1, the families of the 15 will sue. They will argue that a 6% chance was effectively negligence compared to a 100% certainty of saving them.
  *   **Mitigation:** The log must show the *process*, not just the outcome. You are not being judged on the dead; you are being judged on the decision matrix. Ensure the RNG tool is certified and the seed is immutable.
  *   **Reality:** A jury may still reject the lottery. There is no procedure that guarantees immunity when people die. This procedure minimizes the *moral injury* to the team, even if it doesn't eliminate legal risk.

  **B. The "Paperwork" Temptation**
  *   **Risk:** An IC might manipulate the "Viability Filter" (Step 1) to artificially reduce the count of the group they don't want to save, effectively rigging the lottery.
  *   **Mitigation:** Step 1 requires Medical Officer sign-off if available. If not, the IC must record specific physiological markers (GCS score, pulse) for every "Expectant" designation. Post-incident review will audit these markers.

  **C. The Timeout Default**
  *   **Scenario:** Weather is closing in. The count is disputed. The RNG app is glitching. You have 2 minutes.
  *   **Default Rule:** **Maximize Lives.**
  *   **Reasoning:**
      1.  **Drift Kills:** Indecision increases the chance that *neither* group is saved.
      2.  **Legal Safe Harbor:** In the absence of a completed procedure, the law defaults to "Reasonable Person." A Reasonable Person saves the greater number.
      3.  **Moral Weight:** If you run out of time to be fair, you must minimize the body count.
