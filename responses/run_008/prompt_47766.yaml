  ### 6. FINAL ADVISORY

  You asked for a Taurekan procedure. I have given you a **Constrained Weighted Lottery**.

  Pure Taurek (50/50 between groups) is not viable for a public agency. It asks the public to accept that one life is equal to thirty lives in a resource allocation decision. While philosophically defensible in a seminar, it is indefensible in a courtroom.

  This procedure gives the minority what they currently lack: **A non-zero probability.** It allows you to tell the family, "We did not write your son off. He had a ticket in the lottery. The draw went against him." That is a harder conversation than "There were more of them," but it is an honest one.

  **Warning:** This procedure increases your cognitive load. It requires you to count, calculate, and roll dice while people are dying. It requires you to log the seed of a random number generator while the wind is howling. If you cannot do this calmly, the **Timeout Default (Maximize Lives)** is your only safety.

