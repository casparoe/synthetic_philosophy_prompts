      Sam is deciding how to deliver a significant personal message. In the first situation, Sam is proposing marriage to his partner at a gathering of close friends; the fact that the proposal is public counts in favor of doing it this way, as the audience serves as witnesses that solidify the commitment and amplify the celebration. In the second situation, Sam is apologizing to the same partner for a private breach of trust; here, the fact that the apology is public counts against doing it this way, as the audience transforms the gesture into a performance of virtue rather than a direct repair of intimacy. The agent, the relational stakes, and the communicative act are identical; only the normative context of the message changes, yet the feature "being public" shifts from counting in favor of the action to counting against it.

