  Sam is deciding how to deliver a significant personal message to his partner. In the first situation, Sam is proposing marriage at a gathering of close friends; here, the fact that the proposal is public counts in favor of doing it this way, because the audience serves as witnesses that solidify the commitment and amplify the shared joy. In the second situation, Sam is apologizing for a private breach of trust; here, the fact that the apology is public counts against doing it this way, because the audience transforms the gesture into a performance of virtue rather than a direct repair of intimacy. The agent, the relational stakes, and the communicative act are identical; only the normative context of the message changes, yet the feature "being public" shifts from counting in favor of the action to counting against it.

  **The Two Readings**

  The **particularist** reads this as a straightforward valence flip. In the proposal, publicity is a positive reason (it constitutes the commitment as a social fact); in the apology, publicity is a negative reason (it corrupts the sincerity required for repair). The feature itself changes its moral direction based on the holism of the context. The **generalist** must argue that publicity is always a *pro tanto* reason for an action (perhaps grounded in transparency or accountability), but in the apology case, this reason is either outweighed by a stronger reason for privacy or undercut by a defeater (e.g., "unless publicity undermines sincerity"). On the generalist view, publicity never actually counts *against* the apology; it is merely a positive reason that is silenced or overridden by the competing demand for intimacy.

  **Which Handles It Better?**

  The particularist handling is superior here because it captures the *corrupting* nature of publicity in the apology case. If the generalist were right, and publicity remained a positive reason (for accountability) that was simply outweighed, then a sufficiently important apology should eventually justify being public—just as a sufficiently important promise justifies breaking a minor rule. But intuitively, making a private apology public doesn't just compete with intimacy; it destroys the very thing that makes the apology work. The publicity isn't a cost to be balanced; it is a structural flaw in that specific context. The particularist explains why the feature itself becomes toxic, whereas the generalist must treat it as a beneficial feature that is unfortunately inconvenient.

  **The Crucial Detail**

  The detail doing the work is the **telos of the speech act** (constitutive commitment vs. reparative intimacy). If you strip this out—for example, if both cases were proposals, or both were apologies—the valence of publicity would remain stable. In a world where all speech acts were commitments, publicity would always be a reason for; in a world where all were reparations, it would always be against. The flip emerges only because the *function* of the act changes how the feature contributes. Without this contextual shift in the act's purpose, the generalist would have no variation to explain, and the particularist would have no flip to demonstrate.

  **The Generalist's Best Shot and Its Cost**

  The generalist's best recourse is to invoke **default reasons with contextual undercutters**. They would claim: "Publicity is a default reason for action, *unless* the act requires privacy to achieve its end." This machinery allows them to keep the reason atomistic (publicity is always good *in itself*) while accounting for the verdict. However, this costs them dearly. By loading so much normative weight into the "unless" clauses (the undercutters), the general principle becomes a conditional shell that only gains content from the specific context. This quietly concedes the **holism** the particularist argued for all along: if the operation of every reason depends on a context-sensitive defeater condition, then the "general" principle is doing no real work, and the moral gravity has shifted entirely to the particular context where the defeaters live.
