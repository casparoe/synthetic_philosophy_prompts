answer: |-
  Here is the specification you asked for. The literature on aggregation is indeed stalled because participants treat their preferred intuitions as data points rather than hypotheses. Below is the spec for a theory of aggregation, followed by a stress test, a verdict on joint satisfiability, and a scorecard.

  ### I. The Desiderata (The Spec)

  Any adequate theory of aggregation must address the following six requirements. I have distinguished between **Core Constraints** (which any plausible moral theory needs) and **Contested Intuitions** (which often reflect camp prejudices).

  **1. The Rescue Intuition (Core Constraint)**
  *   **Case:** Standard Lifeboat. You can save Group A (1 person) or Group B (5 people). All face identical loss (death). All are strangers.
  *   **Requirement:** The theory must explain why it is at least *permissible*, and arguably *required*, to save the five. A theory that mandates a coin flip here as a strict duty fails.
  *   **Status:** **Non-Negotiable.** If a theory cannot justify saving the five in the standard case, it is morally inert.

  **2. Loss Sensitivity (Core Constraint)**
  *   **Case:** Asymmetric Loss. You can save 5 people from losing 1 year of life each, or 1 person from losing 50 years of life.
  *   **Requirement:** The theory must account for the magnitude of harm, not just the headcount. If the theory says "numbers always win" regardless of the stakes (5 fingernails vs. 1 life), it fails. If it says "numbers never win," it fails the Rescue Intuition.
  *   **Status:** **Non-Negotiable.** Aggregation must be sensitive to the *weight* of the claims, not just the *count*.

  **3. Description Invariance (Core Constraint)**
  *   **Case:** The Family vs. Strangers. Group B consists of 5 strangers. Group C consists of 5 members of one family. Group D is one person who will lose 5 distinct limbs (if limbs were people).
  *   **Requirement:** Moral verdicts should not change based on arbitrary sociological grouping. Five distinct claims should aggregate similarly whether the claimants share a surname or not. (Note: This does not require treating a group as a super-person, but requires that the *sum of claims* is invariant to grouping).
  *   **Status:** **Non-Negotiable.** If morality changes because we redraw the boundaries of "groups," it is arbitrary.

  **4. The Fairness/Equal Concern Intuition (Contested)**
  *   **Case:** Taurek's Coin Flip. Even in the Standard Lifeboat (1 vs. 5), it feels *permissible* to flip a coin. It does not feel like murder to save the one.
  *   **Requirement:** The theory must explain why giving the one a chance is not a violation of duty, or explain away the intuition as error.
  *   **Status:** **Negotiable.** This is the primary battleground. It is often treated as a datum, but it may be a heuristic for uncertainty rather than a moral truth.

  **5. Diachronic Consistency / The "Bridge Worry" (Contested)**
  *   **Case:** Sequential Rescue. You save one drowning swimmer. While dragging them to shore, you see two more. Then three more. Do you stop saving the first to save the later arrivals? Or does the fact that you *started* saving the first lock in your commitment?
  *   **Requirement:** The theory should ideally yield the same verdict whether the five appear simultaneously or sequentially.
  *   **Status:** **Suspicious.** This assumes morality is time-neutral in a way that agents may not be. I will argue below this is a false desideratum.

  **6. The Reverse-Taurek Limit (Contested)**
  *   **Case:** Aggregation of Minor Harms. 1,000 people each lose a fingernail vs. 1 person loses a leg.
  *   **Requirement:** The theory must specify if/when small harms aggregate to outweigh a catastrophic harm.
  *   **Status:** **Negotiable.** Some theories (e.g., Scanlon's) deny this aggregation entirely.

  ---

  ### II. The Stress Test: Incompatibilities

  You asked for the weird requirements and where they break. Here is the inconsistency matrix.

  **Conflict A: Strict Separateness vs. Loss Sensitivity**
  Taurek's "Separateness of Persons" argues that A's loss cannot be weighed against B's gain because there is no "super-person" to experience the sum.
  *   **The Clash:** If you hold Strict Separateness, you cannot satisfy Loss Sensitivity. If I cannot compare A's loss to B's loss, I cannot say 50 years outweighs 5 years. I can only compare A's loss to A's loss.
  *   **Verdict:** You cannot have Taurek's metaphysics and a coherent triage system. One must go.

  **Conflict B: Fairness Intuition vs. Rescue Intuition**
  *   **The Clash:** If it is *required* to save the five (Rescue), then flipping a coin is morally sub-optimal (a failure to minimize loss). If flipping a coin is *permissible* (Fairness), then saving the five is not strictly required.
  *   **Verdict:** Most theories try to split the difference (e.g., weighted lotteries). But logically, either the numbers create a duty, or they don't.

  **Conflict C: Description Invariance vs. Sequentiality (The Bridge Worry)**
  *   **The Clash:** If I save Swimmer 1, I have expended resources. If Swimmers 2-6 appear later, Description Invariance suggests I should treat them as a group of 5 vs. 1 (the one I already saved). But intuitively, abandoning the one I'm currently holding feels worse than not jumping in for the five I haven't touched yet.
  *   **Verdict:** Diachronic Consistency is likely false. Morality is path-dependent because *agency* is path-dependent.

  ---

  ### III. The Verdict: What Must Be Dropped

  Here is my commitment. The set of desiderata as commonly presented is **not jointly satisfiable**. To solve the numbers problem, we must prune the list.

  **1. Drop "Strict Separateness of Persons" as a Barrier to Comparison.**
  This is the sacred cow I am slaughtering. The separateness of persons is a constraint on *sacrifice* (you cannot kill A to save B), but it is not a constraint on *comparison* (you cannot weigh A's loss against B's loss). Taurek conflates the two. We must accept that losses are commensurable across persons, or we cannot do ethics in a resource-constrained world.
  *   **Why:** Without cross-person comparison, "Loss Sensitivity" is impossible. If Loss Sensitivity is non-negotiable (and it is; we must save the 50-year victim over the 5 one-year victims), then Strict Separateness must be reinterpreted as a side-constraint on action, not a ban on aggregation.

  **2. Drop "Diachronic Consistency" (The Bridge Worry).**
  We must accept that sequential rescue is morally distinct from simultaneous rescue.
  *   **Why:** Once an agent initiates a rescue, they enter a special relationship with the victim (a "rescuer's duty"). Abandoning a current victim to save a larger group later is a different moral category than choosing between two groups at *t=0*. Demanding invariance here ignores the moral weight of commitment and reliance.

  **3. Reinterpret "Fairness" as Procedural, Not Substantive.**
  The intuition that "coin flips are okay" is not a truth about the *outcome* (a life is still lost), but a truth about *deliberative uncertainty* and *expressive equality*.
  *   **Why:** We keep the intuition but change its status. It is permissible to flip a coin *only* if the cost of counting is too high or the difference in claims is negligible. But if the difference is stark (1 vs. 5 lives), the duty to minimize loss overrides the expressive value of the coin flip. The "Fairness Intuition" is a heuristic for low-stakes or high-uncertainty contexts, not a fundamental right.

  **The Non-Negotiable Core:**
  1.  **Minimize Total Objective Loss** (aggregating harm across persons is real).
  2.  **Description Invariance** (grouping doesn't change the math).
  3.  **Loss Sensitivity** (magnitude matters).

  **The Bullet Bitten:**
  We must accept that in the Standard Lifeboat (1 vs. 5), saving the one is **wrong**, not merely sub-optimal. It is a failure of duty. The "permissibility" of the coin flip is a social concession to our psychological inability to treat people as numbers, not a moral truth. We must also accept that **Reverse-Taurek cases** (fingernails vs. leg) require a threshold: minor harms do not aggregate infinitely to trump catastrophic harm, not because of separateness, but because the *nature* of the complaint changes (a complaint about a leg is lexically prior to a complaint about a nail).

  ---

  ### IV. Scorecard of Contenders

  Against *my* revised spec (dropping Strict Separateness and Diachronic Consistency, keeping Loss Sensitivity and Description Invariance):

  **1. Taurek (Equal Chances)**
  *   **Score:** **Fail.**
  *   **Why:** Fails Rescue Intuition and Loss Sensitivity. It treats Strict Separateness as a barrier to comparison, which paralyzes decision-making in asymmetric loss cases. It gets the "Fairness" intuition right but at the cost of moral coherence.

  **2. Straightforward Utilitarianism**
  *   **Score:** **Pass (with caveats).**
  *   **Why:** Satisfies Rescue, Loss Sensitivity, and Description Invariance perfectly.
  *   **Caveat:** Fails the "Fairness" intuition (says coin flips are wrong in 1 vs. 5) and struggles with Reverse-Taurek (implies infinite aggregation of fingernails). However, since I argued Fairness is procedural and Reverse-Taurek needs a threshold, Utilitarianism is the strongest baseline, needing only a lexical threshold for catastrophic harm.

  **3. Threshold/Weighted Views (e.g., Scanlon, Otsuka)**
  *   **Score:** **Mixed.**
  *   **Why:** Good on Reverse-Taurek (blocks fingernail aggregation). Good on Fairness (allows weighted lotteries).
  *   **Fail:** Often violates Description Invariance (grouping can change who has the strongest "complaint") and struggles with Loss Sensitivity in continuous cases (why does the threshold kick in *here*?). They often smuggle in Strict Separateness through the back door by privileging the "strongest individual complaint" in ways that ignore the sum of weaker complaints.

  ### Summary for Your Paper
  If you want to make a move in your seminar, argue that the "Separateness of Persons" is being doing too much work. It is a constraint on *using* people, not on *counting* their losses. If you separate those two concepts, the "numbers problem" dissolves into a problem of **thresholds** (when do losses aggregate?) rather than **permission** (are we allowed to count?). The literature is stuck because it's trying to solve a threshold problem with a permission framework. Drop the permission framework.
