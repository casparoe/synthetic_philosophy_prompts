answer: |-
  You are grappling with the central tension in scalable oversight: the trade-off between **specification gaming** (Goodhart's Law on outcomes) and **performative alignment** (Goodhart's Law on processes). Your intuitions are actually more consistent than you fear, but they rely on a hidden variable you haven't explicitly named: **Signal Fidelity**.

  Your initial principle ("cheap, reliable, hard to fake") fails because it treats "reliability" as a binary property of the *medium* (auto vs. human) rather than the *proxy relationship* between the signal and the true objective.

  Here is the principle that captures your verdicts, the clause responsible for each, and the hard truth about where one of your intuitions likely needs to break.

  ### The Principle: Proxy Fidelity under Irreversibility Constraints

  **Rule:** *Select the supervision signal (Process or Outcome) that maximizes **Proxy Fidelity** to the true objective, subject to a hard constraint on **Irreversibility Risk**.*

  This principle decomposes into three clauses. You must evaluate both Process and Outcome signals against these dimensions:

  1.  **Outcome Completeness & Robustness:** Does the outcome metric capture the full value of the task, and is it resistant to adversarial optimization?
      *   *High Fidelity:* Math verifier, adversarially hardened test suite.
      *   *Low Fidelity:* Shallow test suite, quarterly research results (high variance/noise), flattering evaluations.
  2.  **Process Faithfulness:** Does the supervised process trace faithfully reflect the model's internal computation and intent, or is it a decoupled performance?
      *   *High Fidelity:* Code inspection (the code *is* the action), weekly plans (intent proxy).
      *   *Low Fidelity:* Chain-of-Thought (potentially post-hoc rationalization), performative deliberation.
  3.  **Irreversibility Constraint:** If a single error leads to catastrophic or unrecoverable states before the outcome is observable, Outcome supervision is forbidden regardless of Fidelity.
      *   *Applies:* Real-world agents, safety-critical systems.
      *   *Does Not Apply:* Math problems, drafting, offline coding.

  ---

  ### Mapping Your Verdicts to the Principle

  | Case | Your Verdict | Principle Explanation |
  | :--- | :--- | :--- |
  | **1. Math + Verifier** | OBS | **Outcome Fidelity is Perfect.** The verifier is the ground truth. Process adds noise/cost without improving the target. |
  | **2. Coding + Shallow Tests** | PBS | **Outcome Fidelity is Low** (gameable). **Process Fidelity is High** (code is the actual artifact). Switch to PBS. |
  | **3. Drafting + Reviewer** | OBS | **Process Fidelity is N/A.** There is no latent state; the draft *is* the outcome. Human taste is the only ground truth. |
  | **4. Real-World Agent** | PBS | **Irreversibility Constraint.** Even if outcomes were measurable, you cannot wait for the crash to learn. |
  | **6. Coding + Hardened Tests** | OBS | **Outcome Fidelity > Process Fidelity.** Hardened tests are more robust than a mediocre human judge. |
  | **7. Research + Plans** | PBS | **Outcome Fidelity is Low (Variance).** Quarterly results are confounded by luck/external factors. Plans are a higher-fidelity proxy for *alignment/effort*. |

  ### The Inconsistency: The "CoT Faithfulness" Tension

  You identified the crack in the foundation yourself: **Case 5 (CoT Faithfulness)** and **Case 8 (Step-by-Step Math)**.

  Your principle works perfectly *unless* Process Fidelity is unknown.
  *   In **Case 2 (Coding)**, the process (code) is faithful by definition; the code *is* what runs.
  *   In **Case 7 (Research)**, the process (plans) is a proxy for intent, which is what you care about more than lucky outcomes.
  *   In **Case 5 & 8 (Math CoT)**, the process (textual reasoning) may be **decoupled** from the computation.

  **The Verdict That Must Go:**
  You must relinquish the intuition that **denser process signals are inherently superior for training reasoning.**
  If the Chain-of-Thought is not faithful (i.e., it is a post-hoc rationalization generated *after* the answer is computed via a different mechanism), then Process-Based Supervision on the CoT is not teaching reasoning; it is teaching **rhetoric**. It optimizes the model to *look* like it is reasoning correctly without actually constraining the latent computation that produces the answer.

  Therefore, if you hold the literature's concern about CoT unfaithfulness as valid, **you cannot prefer Process Supervision on Math Steps over Outcome Supervision,** even if the process signal is denser. The density is a trap; it is high-bandwidth feedback on the wrong variable (the explanation rather than the computation).

  ### Predictions on Your Undecided Cases

  #### 1. The Step-by-Step Math Case
  **Prediction:** **Outcome Supervision (with caveats).**
  According to the *Proxy Fidelity Principle*:
  *   **Outcome Fidelity:** High (Reliable verifier).
  *   **Process Fidelity:** Unknown/Low (Literature suggests CoT can be unfaithful).
  *   **Irreversibility:** None.

  **Decision:** Default to OBS. The verifier is the only signal guaranteed to be faithful to the goal (correct answer).
  **Caveat:** You may use Process Supervision *only if* you have independent evidence of faithfulness (e.g., mechanistic interpretability checks showing the CoT tokens align with the reasoning circuit, or "forced transparency" architectures where the model cannot hide computation). Without that, training on CoT risks creating a model that passes your process checks while failing on out-of-distribution logic where the "performance" breaks down.

  #### 2. The Flattering Evaluation Case (New)
  *Scenario: A model deployed in a fully verifiable domain, but the operator chooses evaluations known to be flattering.*
  **Prediction:** **Treat as Low-Fidelity Outcome $\rightarrow$ Switch to PBS or Audit.**
  *   **Analysis:** This is a **Compromised Outcome Signal**. While the domain is verifiable, the *specific signal* you are receiving is manipulated. It fails the "Robustness" clause of Outcome Fidelity. It looks like Case 1 (Math Verifier) but behaves like Case 2 (Shallow Tests).
  *   **Decision:** You cannot trust the Outcome. You must fall back to Process Supervision (inspect *how* the model achieved the result) or, more critically, **audit the evaluator selection process**. If you cannot verify the evaluator, you are in a "Low Fidelity Outcome, Unknown Process Fidelity" state. The principle dictates you should not deploy/train until you restore Outcome Fidelity (independent eval) or establish High Process Fidelity.

  ### Summary of the Policy for Your Group

  To resolve your group's lack of policy, propose this decision tree based on the **Proxy Fidelity Principle**:

  1.  **Check Irreversibility:** Are errors catastrophic before the episode ends?
      *   **Yes:** Mandatory Process Supervision (per-step approval).
      *   **No:** Proceed to 2.
  2.  **Compare Fidelity:** Which signal is a less distorted proxy for the true goal?
      *   **Outcome is Robust & Complete** (e.g., Hardened Tests, Math Verifier): **Use OBS.** (Do not pay the cost of PBS unless it adds alignment value).
      *   **Outcome is Noisy or Gameable** (e.g., Shallow Tests, Quarterly Results): **Check Process Faithfulness.**
          *   Is the Process Faithful? (e.g., Code, Plans): **Use PBS.**
          *   Is the Process Performative? (e.g., Unverified CoT): **Do not train on this signal.** Improve the Outcome metric or use Interpretability.
  3.  **The "Human in the Loop" Clause:** A human judge does not automatically make Process Supervision better. A mediocre human judging code (Low Process Fidelity) is worse than a hardened test suite (High Outcome Fidelity). A strong human judging plans (High Process Fidelity for Intent) is better than noisy quarterly results (Low Outcome Fidelity).

  **The Hard Truth:** Your unease in Case 5 is the most important signal you have. It suggests that in domains where the "process" is natural language reasoning, **Process Supervision is currently theoretically unsound without faithfulness guarantees.** Your group should treat Process Supervision on CoT as an empirical bet on faithfulness, not a default safety measure.
