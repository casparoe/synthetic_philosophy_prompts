answer: |-
  **Exam Question: The Pasadena Paradox and Summation Methods**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in full. Define all terms clearly.

  **Preamble:**
  Consider the **Pasadena Game (P)**: A fair coin is tossed until it lands Heads. If Heads appears on toss $n$ (where $n=1, 2, 3...$), the payoff is $V_n = (-1)^{n+1} 2^n$ dollars. The probability of this outcome is $p_n = 1/2^n$.
  Consider the **Altadena Game (A)**: Identical to (P), except every payoff is increased by $1. Thus, the payoff on toss $n$ is $V'_n = V_n + 1$.

  The expected value series for (P) is $\sum_{n=1}^{\infty} p_n V_n = 1 - 1 + 1 - 1 + \dots$. The partial sums of this series oscillate between 1 and 0.
  A colleague proposes resolving the paradox using the **Cesàro Rule**: Assign a gamble the limit of the arithmetic mean of its expectation series' partial sums. If the partial sums are $S_1, S_2, \dots$, the value is $\lim_{N \to \infty} \frac{1}{N} \sum_{k=1}^N S_k$.

  **Question:**
  1.  Explain precisely why the expectation of (P) is *undefined* rather than *infinite*, and why this distinction disables standard Expected Utility (EU) responses that handle the St. Petersburg paradox.
  2.  Calculate the value of (P) and (A) under the Cesàro Rule.
  3.  Evaluate the colleague's claim that this rule is a principled successor to EU. Specifically, determine whether the Cesàro Rule can assign a definite value to (P) while respecting the Dominance Principle (that a pointwise-better gamble must be preferred). Justify your conclusion.

  ***

  **Model Answer**

  The expectation of the Pasadena Game (P) is undefined because its expectation series ($1 - 1 + 1 - \dots$) diverges by oscillation, not by diverging to infinity. In the St. Petersburg paradox, the series diverges to $+\infty$, allowing extended real-number solutions or utility caps to manage the infinity. However, oscillation yields no limit, not even infinity. Standard Expected Utility theory requires absolute convergence ($\sum |p_n V_n| < \infty$) to ensure the expectation is invariant under rearrangement of outcomes. Because (P) lacks absolute convergence, its value depends on the order of summation. Standard EU tools break because they assume the expectation is a unique property of the gamble, not its description.

  Under the Cesàro Rule, we average the partial sums. For (P), the partial sums are $1, 0, 1, 0, \dots$. The sequence of averages is $1, 1/2, 2/3, 2/4, 3/5, 3/6 \dots$, which converges to $1/2$. Thus, $C(P) = 0.5$.
  For the Altadena Game (A), the payoff is $V_n + 1$. The expectation term becomes $(-1)^{n+1} + (1/2)^n$. The partial sums are $S_n(P) + (1 - 1/2^n)$. As $n \to \infty$, the second term approaches 1. By the linearity of Cesàro summation for bounded sequences, $C(A) = C(P) + 1 = 1.5$.

  Numerically, the Cesàro Rule respects dominance here: $1.5 > 0.5$, so (A) is preferred to (P). However, the colleague's claim that this is a *principled* successor to EU fails because the Cesàro Rule is order-dependent. The value $0.5$ is derived from the specific indexing of the tosses ($n=1, 2, 3\dots$). Since the state space (outcomes of coin tosses) lacks an intrinsic utility-relevant ordering, we can redescribe the game by rearranging the outcomes.

  If we rearrange the terms of the expectation series for (P) (e.g., two positives for every negative), the Cesàro mean changes or ceases to exist. Crucially, we can rearrange (P) and (A) differently. Because the series are not absolutely convergent, there exists a rearrangement where the calculated value of (P) exceeds that of (A), violating the Dominance Principle. A decision rule that yields different verdicts based on the arbitrary description of the states cannot ground a robust preference relation. To save definiteness, the Cesàro Rule sacrifices description invariance, which is a necessary condition for respecting dominance universally. Thus, it cannot simultaneously assign a definite value and respect dominance.

  ***

  **Marking Scheme (20 Marks Total)**

  1.  **Undefined vs. Infinite (4 marks):** Correctly identifies oscillation (no limit) vs. divergence to infinity.
      *   *Typical Botch:* Conflating "divergent" with "infinite," claiming St. Petersburg tools apply to oscillation.
  2.  **EU Breakdown (4 marks):** Notes EU requires absolute convergence for uniqueness/rearrangement invariance.
      *   *Typical Botch:* Claims EU fails only because the number is "too big" rather than because the sum is path-dependent.
  3.  **Cesàro Calculation (4 marks):** Correctly derives $C(P)=0.5$ and $C(A)=1.5$ via partial sum averaging.
      *   *Typical Botch:* Averages the terms ($1, -1...$) directly instead of the partial sums, or arithmetic errors.
  4.  **Dominance Check (4 marks):** Acknowledges dominance holds *for the fixed ordering* ($1.5 > 0.5$).
      *   *Typical Botch:* Immediately claims dominance fails without checking the fixed-order calculation first.
  5.  **Normative Crash (4 marks):** Identifies that order-dependence violates dominance under redescriptions (lack of absolute convergence).
      *   *Typical Botch:* Praises Cesàro for mathematical elegance without noting that rearranging states changes the verdict.

  **Specific A vs. B Distinction:**
  An **A answer** explicitly identifies that **order-dependence violates dominance under state redescriptions**, recognizing that a gamble's value should not depend on the arbitrary indexing of outcomes. A **B answer** correctly calculates the values and notes dominance holds for the *given* order but fails to recognize that the rule is vulnerable to rearrangement, thereby missing the normative fatal flaw.

  Crux: Recognizing that order-dependent summation methods violate dominance under state redescriptions.
