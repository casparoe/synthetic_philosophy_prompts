      *   **Constraint 2:** Identify genuine tensions vs. apparent tensions.
      *   **Constraint 3:** Rank genuine tensions by severity.
      *   **Constraint 4:** For each genuine tension, specify which commitment must give and the cost of doing so.
      *   **Constraint 5:** Address the "case verdicts" (Commitment 4) honestly—if they break the theory, say so.
      *   **Constraint 6:** Recommend the single revision that cleans up the most mess.
      *   **Tone:** Analytical, precise, philosophical (suitable for a political-theory seminar context).

  2.  **Deconstruct the Five Commitments:**
