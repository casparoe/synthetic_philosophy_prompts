  9.  **Final Polish:** Ensure the distinction between "Economic Primacy" (C3) and "Hierarchy" (C2) is sharp. C3 says the *axis* is economic. C2 says the *meaning* is hierarchy. These are compatible *only if* economic inequality is the only hierarchy that counts. C4 proves the user believes other hierarchies count. Therefore C3 is the casualty.

