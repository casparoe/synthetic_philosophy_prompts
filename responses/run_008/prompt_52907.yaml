answer: |-
  # Quiz: Which Dream-Skepticism Position Do You Actually Hold?

  **Intro:** Most people assume the Zhuangzi butterfly passage is just Descartes in a silk robe. It isn't. The space of positions on "How do I know I'm not dreaming?" is far more scattered than a simple skeptic-vs.-believer binary. This quiz sorts you by how you react to concrete cases, not by which philosophical labels you recognize.

  ***

  ### 1. The Breakfast Table
  You are sitting at your kitchen table, holding a warm mug of coffee. You can feel the heat, smell the roast, and see the steam. A voice in your head asks: *"Do you know for certain you aren't dreaming this?"*
  *   **A.** No. My senses could be deceiving me. I can't rule it out.
  *   **B.** Yes. Of course I know. To suggest otherwise is absurd.
  *   **C.** I know it here at the table, but I admit I might answer differently in a philosophy classroom.

  ### 2. The Reality Check
  Lucid dreamers often suggest "reality checks," like reading a page of text, looking away, and reading it again. In dreams, the text often shifts or blurs; in waking life, it stays stable. If you try this and the text stays stable, what does that prove?
  *   **A.** Nothing definitive. A consistent dream could simulate stable text.
  *   **B.** It's good enough evidence. I'm entitled to trust my senses unless I have a specific reason not to.
  *   **C.** It misses the point. Stability doesn't distinguish "real" from "dream," it just distinguishes "consistent" from "chaotic."

  ### 3. The Lucid Moment
  Imagine you are in a dream, and suddenly you realize, *"I am dreaming."* You become lucid. Does this moment help solve the skepticism problem?
  *   **A.** Yes. It proves there is a clear fact of the matter about whether I am asleep or awake.
  *   **B.** No. It just shows I can have different types of dream experiences. It doesn't prove I'm awake *now*.
  *   **C.** The question is confused. If I'm asleep, I'm not having an experience to be "lucid" in.

  ### 4. The Butterfly's Perspective
  Zhuang Zhou dreamed he was a butterfly, fluttering about, knowing nothing of Zhou. When he woke, he wondered if he was Zhou who dreamed of being a butterfly, or a butterfly now dreaming of being Zhou. From the *butterfly's* perspective inside the dream, was it mistaken about anything?
  *   **A.** Yes. It was mistaken about its identity. It was really Zhou all along.
  *   **B.** No. From that vantage point, being a butterfly was fully real. There is no privileged "Zhou" perspective.
  *   **C.** The butterfly wasn't "mistaken" because it wasn't actually thinking or experiencing anything at the time.

  ### 5. The Neuroscientist Friend
  A neuroscientist friend tells you: *"Dreaming is just your offline predictive machinery running unconstrained. It's the same machinery as waking perception, just not being error-corrected by the senses."* How does this affect the skepticism problem?
  *   **A.** It makes it worse. If the machinery is the same, I can never tell the difference.
  *   **B.** It dissolves the problem. It suggests "dream content" is a story my brain stitches together after I wake up, not something I lived through.
  *   **C.** It's irrelevant. Whether the machinery is the same doesn't change whether I know I'm awake.

  ### 6. The Asymmetry of Doubt
  Have you ever seriously wondered *"Am I dreaming?"* while actually asleep?
  *   **A.** Yes, sometimes in lucid dreams.
  *   **B.** No. Wondering whether you're dreaming is something you can only do when you're already awake.
  *   **C.** It doesn't matter. The possibility is what counts, not whether I actually entertain it.

  ### 7. The Morning Report
  You wake up and immediately tell a friend about a vivid dream you had. What are you reporting on?
  *   **A.** A sequence of experiences I had while asleep.
  *   **B.** A narrative my mind has just constructed based on brain states from sleep.
  *   **C.** A logical fiction. I'm just using the grammar of "dreaming" to explain why I was unconscious.

  ### 8. The Seminar Room
  You are in a philosophy seminar. The professor asks, *"Do you know you're not dreaming right now?"* The standards of proof feel much higher than they did at breakfast.
  *   **A.** I should say "No." The standards here require certainty I don't have.
  *   **B.** I should say "Yes." The standards are high, but I still know I'm awake.
  *   **C.** I should say "It depends." The word "know" means something different here than it does at breakfast.

  ***

  ## Scoring Key: Where You Land

  Tally your answers. You likely won't get a perfect match, but look for the cluster that fits your majority.

  **Mostly A's: The Cartesian Global Skeptic**
  You hold that the possibility of dreaming cannot be ruled out by sensory evidence. Because the internal experience of dreaming can match waking life, you lack the certainty required for knowledge. You take the seminar room standards (Q8) to be the correct ones, even at breakfast.
  *   *Key Tell:* Q1 (No) + Q2 (Nothing definitive).

  **Mostly B's: The Moorean Common-Sense Realist**
  You think the skeptic has the burden of proof backwards. You know you're awake at breakfast (Q1), and stable text (Q2) is sufficient evidence. You treat dream reports as real experiences (Q7) but deny they undermine your waking knowledge.
  *   *Key Tell:* Q1 (Yes) + Q6 (No/Doubt requires wakefulness).

  **Mostly C's (with Q4-B): The Zhuangzi Transformationist**
  You aren't worried about skepticism because you don't accept the rigid distinction between "real Zhou" and "dream butterfly." You see waking and dreaming as transformations of one another (Q3, Q4). The question "Which one am I *really*?" assumes a privileged vantage point you reject.
  *   *Key Tell:* Q4 (Butterfly wasn't mistaken) + Q2 (Stability misses the point).

  **Mostly C's (with Q4-C & Q6-B): The Malcolmian Conceptualist**
  You think the whole debate is a category error. For you, "dreaming" isn't an experience that happens *during* sleep; it's a report we give *after* waking. Therefore, you can't doubt you're dreaming while asleep (Q6), and the butterfly wasn't experiencing anything (Q4).
  *   *Key Tell:* Q4 (Butterfly wasn't thinking) + Q7 (Logical fiction).

  **Mostly B's (with Q5-B & Q7-B): The Dennett-style Confabulationist**
  You agree you're awake, but you think "dreaming" is a post-hoc construction. Your brain creates the dream story upon waking (Q5, Q7). This isn't skepticism; it's just a claim about when the content gets generated.
  *   *Key Tell:* Q5 (Story stitched together) + Q7 (Narrative constructed).

  **Mixed Q1-C / Q8-A: The Contextualist**
  You think "I know I'm awake" is true at the kitchen table but false in the seminar room. The truth of the claim depends on the conversational context and how strict the standards for "know" are in that moment.
  *   *Key Tell:* Q1 (Yes/Depends) + Q8 (Standards shift).

  ***

  ## The Fine Print: Limitations & Glitches

  **1. The Malcolm Trap**
  If you are a committed Norman Malcolm-style philosopher (Position C above), this quiz might not be able to catch you. Malcolm argues that it makes no sense to talk about "experiences during sleep" at all. If you found yourself wanting to answer "None of the above" or "The question is nonsense" to Questions 3, 4, and 7, you are likely holding the Malcolm view more consistently than the quiz allows. The quiz assumes there is *some* phenomenon to be discussing; a hardline Malcolmian denies the phenomenon exists.

  **2. Dead Branches & Incoherent Combos**
  There are answer combinations that map to no live philosophical position.
  *   **The "Magic Text" Combo:** If you answered **Q1-A** (I can't know I'm awake) but **Q2-B** (Stable text proves I'm awake), you are in tension. You're claiming global skepticism while accepting a local proof that defeats global skepticism.
  *   **The "Confabulated Realist" Combo:** If you answered **Q5-B** (Dreams are confabulated on waking) but **Q4-A** (The butterfly was mistaken about its identity), you have a problem. If the dream content is confabulated upon waking, the butterfly didn't have an identity *during* the sleep to be mistaken about. This combo is theoretically possible but rarely defended.
  *   **The "Unexplored Valley":** There is a cluster of answers combining **Q3-C** (Lucidity is confused) with **Q8-C** (Contextualism). This suggests a view where dream concepts are grammatically confused, yet waking knowledge is context-sensitive. This is a coherent but largely unexplored niche in the literature. If you landed here, you might be onto something new—or you just hate the premises of every question equally.
