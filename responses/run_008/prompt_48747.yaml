      *   **User Persona:** Backend Engineer. Knows philosophy by "osmosis" (familiar with concepts but not technical jargon). Comfortable with systems design, concurrency, error handling, testing, and observability.
      *   **Core Task:** Restate the Frankfurt Cases debate (free will/moral responsibility) using backend engineering vocabulary (exception handlers, dead code, race conditions, etc.).
      *   **Specific Requirements:**
          *   Cover Frankfurt's original argument against the Principle of Alternate Possibilities (PAP).
          *   Cover main objections (specifically the "detection/race condition" issue).
