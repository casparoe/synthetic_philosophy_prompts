prompt: |-
  I'm a backend engineer -- I know a fair amount of philosophy by osmosis but I'm not fluent. I keep bumping into Frankfurt cases: the setups where someone couldn't have done otherwise (a counterfactual intervener was ready to force their hand if they'd shown any sign of choosing differently), yet they chose it on their own, and the conclusion is that they're still morally responsible -- so alternative possibilities aren't really required for responsibilty. Restate this whole debate in the vocabulary I actually use: exception handlers, dead code, code coverage, fault injection and chaos engineering, monitoring and alert latency, fail-safes that sit in the design but never trigger. Cover Frankfurt's original argument against the principle of alternate possibilities, and the main objections too -- especially the ones about whether the intervener can detect your decision *before* you make it without already assuming you'll make it (this smells like a race condition to me, but I'm not sure). Then the residue report: what translates cleanly, what you had to distort to make it fit, and what has no counterpart in my vocabulary at all. My working intuition is that a Frankfurt case is just dead code -- an exception handler that exists in the design but never executes, so it shouldn't change how we assign blame for the output -- and I want to know whether that's right or whether it's smuggling in an assumption, e.g. that the mere presence of the handler doesn't perturb the system. And tell me plainly: if something doesn't survive the translation, is that because my vocabulary is missing it, or because the philosophers' debate was less substantive than it looks?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

