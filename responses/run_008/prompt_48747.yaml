      *   Honest answer: Sometimes philosophy is just vague thinking that engineering rigor exposes as nonsense. Sometimes engineering vocab is too functional to capture normative states.
      *   Specific to Frankfurt: The "Prior Sign" objection *is* a race condition. Philosophy struggled with this for decades; engineering solves it with locks/transactions. So, sometimes the philosophy is less substantive.

  8.  **Structuring the Response:**
