answer: |-
  You have stumbled, entirely on your own, onto one of the most famous frameworks in the philosophy of language. Your "gut feel" verdicts are remarkably consistent with the theory of **Speech Acts** developed by J.L. Austin in *How to Do Things with Words* (1962), and later refined by John Searle.

  You are looking for a principle that distinguishes when an utterance **misfires** (fails to happen at all) versus when it is **abused** (happens, but is hollow or improper).

  Here is the principle that unifies your verdicts, followed by the answers to your specific questions about the ship, the prank, and the potential split in your logic.

  ### The Principle: Felicity Conditions (Misfires vs. Abuses)

  The principle is this: **A speech act succeeds if the "Constitutive Rules" (authority, procedure, context, and uptake) are met, even if the "Sincerity Conditions" (intent, emotion, belief) are not.**

  Austin calls the rules for a successful act **Felicity Conditions**. When these are violated, one of two things happens:
  1.  **A Misfire:** The act is *void*. It never happened. This occurs when authority, procedure, or context is wrong.
  2.  **An Abuse:** The act is *valid but hollow*. It happened, but you are being insincere or unethical. This occurs when thoughts/feelings don't match the words.

  Your intuitions are tracking this distinction almost perfectly. You are treating **Procedural/Authority failures** as Misfires (the act doesn't count) and **Sincerity/Intent failures** as Abuses (the act counts, but it's shady).

  ### Applying the Principle to Your Cases

  Here is how your verdicts map onto the principle:

  **1. The Misfires (The Act Did Not Happen)**
  *   **Unlicensed Officiant:** *Failure of Authority.* The convention requires a licensed agent. Without it, the procedure is void. (Verdict: Not married).
  *   **Actor in Play:** *Failure of Context.* The "stage" is a non-serious context. The convention explicitly suspends real-world effects. (Verdict: Not married).
  *   **Knifepoint Promise:** *Failure of Agency.* A promise requires voluntary commitment. Coercion removes the agency required to create the obligation. (Verdict: Not binding).
  *   **Silent Bet:** *Failure of Uptake.* A bet is a bilateral contract. It requires mutual assent. Silence is not assent. (Verdict: No debt).
  *   **Drunk Boss Firing:** *Failure of Authority/Procedure.* Firing is an institutional act requiring the boss to act *as* the boss. Severe intoxication compromises the capacity to represent the institution formally. (Verdict: Not fired).
  *   **Sarcastic "Sorrry":** *Failure of Convention.* This is tricky. Insincerity is usually an "Abuse," but sarcasm uses the *form* of an apology to signal the *opposite* meaning. The hearer does not uptake it as an apology; they uptake it as an insult. The illocutionary act of "apologizing" misfires because the conventional meaning was inverted. (Verdict: Not an apology).

  **2. The Abuses (The Act Happened, But...)**
  *   **PR Apology:** *Sincerity Failure.* The convention of a public apology is the *statement*, not the feeling. The public accepts the form. The lack of remorse makes it cynical, but it still functions as an apology in the social record. (Verdict: Is an apology).
  *   **Badgered Promise:** *Reluctance (not Coercion).* You were worn down, not threatened. Your agency was intact, even if annoyed. Breaking it violates the commitment you made. (Verdict: Binding).
  *   **YouTube Prank Marriage:** *Sincerity Failure.* You followed the law (License + Officiant + Ceremony). The law does not require "love" or "serious intent" as a condition of validity, only compliance with the statute. (Verdict: Married).

  ### Answering Your Specific Questions

  #### (a) Which verdicts must you give up?
  There is one case where your intuition might be legally/socially wobblier than the principle suggests: **The Drunk Employee Quitting.**

  You said this "kinda counts." Under the principle of **Agency**, if the boss is too drunk to fire (Misfire), the employee is likely too drunk to quit (Misfire). Intoxication impairs the capacity to form intent.
  *   **Why you feel it counts:** There is an asymmetry of power. Firing is an exercise of power *over* someone (requiring high procedural bar); Quitting is a relinquishment of status *by* someone (lower bar).
  *   **The Adjustment:** To make the principle hold, you should view Drunk Quitting as **Presumptively Valid but Voidable.** It "counts" initially (unlike the boss's firing), but can be rescinded once sobriety returns, whereas the boss's firing was void from the start. If you stick with "Kinda counts," you are actually correct: it creates a *mess* (an act happened), whereas the boss's firing creates *nothing*.

  #### (b) Prediction for the Ship-Naming Mess
  **Verdict: Nothing happened to either ship.**

  This is a **Failure of Reference**, which is a type of Misfire.
  *   **The Principle:** To name a ship, you must identify the object to be named.
  *   **The Analysis:** If the christener says "I name *this* ship" while touching Ship A, but intends Ship B:
      *   Ship B is not named because the procedure (touching/speaking over the target) wasn't directed at it.
      *   Ship A is not named because the description ("The [Name]") was not intended for it, and usually, the naming ceremony requires the owner/authority to designate the specific vessel correctly.
  *   **Austin's View:** Austin actually discusses a similar case (the Queen christening the wrong ship). He suggests the act is **void**. You cannot accidentally name a ship any more than you can accidentally marry a stranger. The convention requires correct identification.
  *   **Prediction:** The ship remains nameless until the procedure is correctly executed on the intended target.

  #### (c) The YouTube Prank: License vs. Ceremony
  **Verdict: They are married because of the License (Institutional Fact), not the Ceremony (Ritual).**

  Your principle treats these as two different jobs.
  *   **The Ceremony** is the *performative utterance* ("I do"). On its own (like the actor case), it does nothing.
  *   **The License** is the *constitutive rule*. It is the institutional backing that turns the utterance into a fact.
  *   **Why Sincerity Doesn't Matter:** In **Institutional Acts** (Marriage, Betting, Court Verdicts), the *status* is conferred by the system, not the psyche. The system checks boxes (License signed, Fee paid, Officiant present). It does not check hearts.
  *   **The Principle's Take:** The prank marriage succeeds because it avoided a **Misfire** (all legal boxes checked). It committed an **Abuse** (mocking the sanctity), but Abuses do not void Institutional Acts. They are still married.

  #### (d) Is there a split? (Inconsistency vs. Two Principles)
  You asked if you are being inconsistent. You are not. However, your cases do fall into two distinct categories that operate slightly differently. The split is between **Interpersonal Commitments** and **Institutional Status Changes.**

  1.  **Interpersonal/Expressive Acts (Apology, Promise, Bet):**
      *   **Goal:** To change a moral relationship or express a state of mind.
      *   **Key Condition:** **Uptake and Sincerity matter more.**
      *   *Example:* The Sarcastic Apology fails because the *hearer* didn't accept it as an apology. The Bet fails because the *partner* didn't accept the terms.
      *   *Why:* These rely on mutual recognition.

  2.  **Institutional/Status Acts (Marriage, Firing, Ship Naming):**
      *   **Goal:** To change a legal or formal status.
      *   **Key Condition:** **Authority and Procedure matter more.**
      *   *Example:* The Prank Marriage succeeds despite hollow intent. The Unlicensed Officiant fails despite full intent.
      *   *Why:* These rely on external systems (State, Company, Navy).

  **The Unifying Thread:**
  Even with this split, the **Misfire vs. Abuse** principle holds across both.
  *   In Interpersonal acts, a lack of Uptake (Sarcastic Sorry, Silent Bet) is a **Misfire**.
  *   In Institutional acts, a lack of Authority (Unlicensed Officiant, Drunk Boss) is a **Misfire**.
  *   In *both* cases, a lack of Sincerity (PR Apology, Prank Marriage) is merely an **Abuse**.

  ### Summary for Your Roommate
  You can tell your roommate that your verdicts aren't gut feelings; they are a consistent application of **Felicity Conditions**.

  *   **If the rules of the game weren't followed (Authority, Procedure, Context, Uptake):** The act is a **Misfire**. It didn't happen. (Officiant, Actor, Knife, Bet, Boss, Sarcastic Sorry).
  *   **If the rules were followed but the heart wasn't in it (Sincerity, Intent):** The act is an **Abuse**. It happened, but it's flawed. (PR Apology, Badgered Promise, Prank Marriage).

  **The Ship:** Nothing happened (Misfire of Reference).
  **The Prank:** They are married (Abuse of Intent, but Procedurally Valid).
  **The Split:** You aren't inconsistent; you just recognize that legal statuses (Marriage) rely on paperwork, while moral commitments (Apologies) rely on recognition. Both, however, require the "rules of the game" to be met before sincerity even becomes a question.
