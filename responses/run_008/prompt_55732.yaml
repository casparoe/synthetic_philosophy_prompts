prompt: |-
  I'm part of a small reading group that spends a few months each year on early modern travel and ethnographic writing, and our current pick is Montaigne's essay "Of Cannibals" (Book I, Chapter XXX of the Essays). Most of the essay reads easily enough, but the paragraph our discussion got stuck on has been going round in my head all week, and I'd like to actually resolve it rather than leave it as a vague disagreement:

  I find that there is nothing barbarous and savage in this nation, by anything that I can gather, excepting, that every one gives the title of barbarism to everything that is not in use in his own country. As, indeed, we have no other level of truth and reason, than the example and idea of the opinions and customs of the place wherein we live: there is always the perfect religion, there the perfect government, there the most exact and accomplished usage of all things.

  "They are savages at the same rate that we say fruit are wild, which nature produces of herself and by her own ordinary progress."

  In truth, we ought rather to call those wild, whose natures we have changed by our artifice, and diverted from the common order. In those, the genuine, most useful and natural virtues and properties are vigorous and sprightly, which we have helped to degenerate in these, by accommodating them to the pleasure of our own corrupted palate.

  We may then call them barbaric, in respect to the rules of reason: but not in respect to ourselves, who in all sorts of barbarity exceed them. Their wars are throughout noble and generous, and have as much excuse and beauty as this human disease is capable of; having with them no other foundation than the sole jealousy of valour.

  There are three things I can't untangle on my own. First, when Montaigne says we have "no other level of truth and reason" than the customs of the place we live, is this meant as a description of how human judgment in fact works, or as a diagnosis of a mistake — and either way, how does he seem to exempt himself from it, given that the whole paragraph is him judging another nation favorably by his own lights? Second, the fruit analogy: I take the point that "wild" fruit is simply fruit that grew without our intervention, so "savage" need not be pejorative; but he then reverses the analogy and says it is the ones we have changed by artifice that deserve to be called wild. Is this a neat turn of phrase, or is he making the stronger and stranger claim that cultivation is corruption — that "civilized" people are the real deviation from the common order? And if it's the stronger claim, doesn't it rely on a normative standard of what nature intends, the very sort of standard he seemed to deny anyone has access to a few lines earlier? Third, the closing sentences: he passes a pile of verdicts (their wars are "noble and generous," war itself is a "human disease," and we exceed them "in all sorts of barbarity"), which looks like the opposite of the relativist-sounding opening.

  Please help me work out what this passage is actually claiming: what "level of truth and reason" is doing in that sentence, how the fruit analogy and its reversal are supposed to work, how the descriptive and the normative sides of the paragraph fit together, and whether there's a coherent position here or whether Montaigne is simply trading on an ambiguity between denying that custom is a *good* test of anything and reporting that it's the only test anyone has. I don't need suggestions for further reading or what to bring to the group next time — I want your own reading of this paragraph itself, including where you think it genuinely breaks down if it does.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User's Request:**
      *   **Context:** Small reading group, early modern travel/ethnographic writing, currently on Montaigne's "Of Cannibals."
      *   **Problem:** A specific paragraph is causing disagreement/confusion.
      *   **The Text:** A specific excerpt from "Of Cannibals" (likely the John Florio translation based on the phrasing "level of truth and reason," "common order," "human disease," etc.).
      *   **Three Specific Questions:**
          1.  Is "no other level of truth and reason" descriptive or diagnostic? How does Montaigne exempt himself?
          2.  The fruit analogy: Is cultivation corruption? Does this contradict the earlier denial of a normative standard?
          3.  The closing verdicts: How does this fit with the opening relativism? Is there a coherent position or just ambiguity?
      *   **Constraint:** Do *not* suggest further reading or next picks. Focus *only* on reading this paragraph itself, including where it might break down.

  2.  **Deconstruct the Text (Mental Sandbox):**
      *   *Sentence 1:* "I find that there is nothing barbarous... excepting, that every one gives the title of barbarism to everything that is not in use in his own country." -> Classic cultural relativism observation. People call things barbaric just because they are different.
      *   *Sentence 2:* "As, indeed, we have no other level of truth and reason, than the example and idea of the opinions and customs of the place wherein we live..." -> This is the crux. Is he saying "This is how it *is*" (psychological fact) or "This is what we *shouldn't* do" (epistemic error)? The phrase "As, indeed" suggests he's explaining the previous sentence. It sounds descriptive.
      *   *Sentence 3:* "...there is always the perfect religion, there the perfect government..." -> Satirical tone. He's mocking this tendency.
      *   *Sentence 4 (Fruit):* "They are savages at the same rate that we say fruit are wild..." -> Re-definition of terms. "Savage" = natural/uncultivated. Not necessarily bad.
      *   *Sentence 5 (Reversal):* "In truth, we ought rather to call those wild, whose natures we have changed by our artifice..." -> Normative claim. Artifice = corruption. Nature = virtue.
      *   *Sentence 6 (Reason vs. Us):* "We may then call them barbaric, in respect to the rules of reason: but not in respect to ourselves..." -> Crucial distinction. There *are* rules of reason (universal?), but *we* don't embody them. We are worse.
      *   *Sentence 7 (War):* "Their wars are throughout noble... having with them no other foundation than the sole jealousy of valour." -> Specific comparison. Their violence is honest; ours is greedy/political.

  3.  **Address Question 1: "Level of Truth and Reason" (Descriptive vs. Normative & Self-Exemption)**
      *   *Analysis:* Montaigne is describing a human psychological tendency (ethnocentrism). We *do* use our customs as the benchmark. However, by pointing it out ironically ("there is always the perfect religion"), he signals that this is a *mistake*.
      *   *The Exemption:* How does he escape it? He doesn't fully escape it (he admits he's human), but he uses *reflection* to step outside it. He is using the "rules of reason" (Sentence 6) as a higher standard than "custom." He isn't judging the Tupinambá by French customs; he's judging both French and Tupinambá by a standard of "Nature" or "Reason."
      *   *Key Insight:* He distinguishes between the *actual* level people use (custom) and the *proper* level they should use (reason/nature). He exempts himself by adopting the latter.

  4.  **Address Question 2: The Fruit Analogy and Cultivation as Corruption**
      *   *Analysis:* "Wild" fruit is natural. "Cultivated" fruit is altered. Montaigne flips the pejorative. Usually, "wild" = bad. He says "wild" = natural/good. "Cultivated" = artificial/bad.
      *   *The Contradiction?* Earlier he said we have no standard but custom. Now he appeals to "Nature" and "Common Order."
      *   *Resolution:* This is the pivot from Relativism to Natural Law. He isn't saying "all customs are equal." He is saying "European customs have deviated from Nature, while the Cannibals are closer to Nature."
      *   *Normative Standard:* Yes, he relies on a normative standard of Nature. This *does* contradict the strict relativism of the first sentence. But that's the point: the first sentence describes the *error* of most people; the rest of the paragraph proposes the *correction*.
      *   *Cultivation as Corruption:* Yes, this is a stronger claim. It's Stoic/Cynic influence. Artifice masks true virtue.

  5.  **Address Question 3: The Closing Verdicts and Coherence**
      *   *Analysis:* He calls war a "human disease" (universal judgment) but says their wars are "noble" (specific judgment). He says we exceed them in barbarity (comparative judgment).
      *   *Coherence:* Is it coherent? It's a *critical* coherence, not a logical syllogism. He is using the "Cannibals" as a mirror to shame Europe.
      *   *The Breakdown:* The tension lies in whether "Reason" (Sentence 6) is accessible. If we are all blinded by custom (Sentence 2), how does Montaigne access "Reason" to judge them as noble?
      *   *My Reading:* Montaigne is a skeptic (Pyrrhonist). He knows absolute truth is hard. But he observes that *practically*, the "natural" life seems less vicious than the "civilized" life. He isn't claiming the Cannibals are perfect; he's claiming they are *less corrupted* than the French. The coherence is rhetorical/moral, not strictly epistemological.

  6.  **Synthesize and Structure the Response:**
      *   *Introduction:* Acknowledge the richness of the passage. State the thesis: Montaigne is moving from descriptive relativism to normative naturalism to shame his contemporaries.
      *   *Section 1: The "Level of Truth" (Descriptive Trap vs. Normative Escape).* Explain the shift from "this is what we do" to "this is what we ought not do." Explain his exemption via philosophical reflection (the Essay form itself).
      *   *Section 2: The Fruit Analogy (Nature vs. Artifice).* Tackle the "cultivation is corruption" claim. Address the contradiction regarding the normative standard. Explain that he replaces "Custom" with "Nature" as the benchmark.
      *   *Section 3: The Verdicts (The Mirror Strategy).* Explain the "human disease" vs. "noble wars" distinction. Show how he judges *both* by a third standard (Reason/Nature).
      *   *Section 4: Where it Breaks Down (The Skeptical Tension).* Be honest about the philosophical friction. Can a skeptic appeal to Nature? Yes, but it's a practical skepticism, not a dogmatic one.
      *   *Conclusion:* Summarize the coherent position: It's not relativism; it's a critique of European corruption using the "New World" as a control group for human nature.

  7.  **Refine the Tone:**
      *   Keep it scholarly but accessible (reading group context).
      *   Avoid prescribing "correct" interpretations, but offer a strong, defensible reading.
      *   Ensure I answer the specific "three things" the user listed.
      *   *Self-Correction on Translation:* The user quotes the Florio translation (1603). "Level of truth" is distinct. I should stick to the text provided but keep the original French concepts (coutume vs. nature) in mind implicitly.
      *   *Check:* Did I answer the "exemption" question clearly? I need to emphasize that Montaigne positions himself as the observer who *sees* the custom-bound nature of others, implying he has momentarily stepped outside it.

  8.  **Final Polish:** Check against the prompt constraints (no further reading suggestions, focus on the paragraph). Ensure the distinction between "descriptive relativism" and "normative naturalism" is clear, as that's the key to unlocking the user's confusion. (The user asks if he's trading on ambiguity—I should argue it's a deliberate pivot, not just a slip.)

  *(Self-Correction during drafting)*: I need to be careful not to make Montaigne sound too much like a Rousseauian primitivist. He doesn't think they are angels. He thinks they are *less* artificially corrupted. The "human disease" line is key—war is bad everywhere, but their *version* is less barbaric than ours. I must highlight that distinction.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is one of the most famous passages in early modern philosophy precisely because it seems to teeter on the edge of contradiction. Your intuition that there is a tension between the opening relativism and the closing moral verdicts is correct. However, I would argue that Montaigne is not trading on an ambiguity so much as he is performing a philosophical pivot. He begins by describing a human error (ethnocentrism) and ends by proposing a corrective standard (Nature/Reason).

  Here is my reading of how the three problems you identified resolve within the logic of the paragraph, and where the genuine friction lies.

  ### 1. The "Level of Truth and Reason": Description vs. Diagnosis
  You ask whether the claim that we have "no other level of truth and reason" than our local customs is a description of fact or a diagnosis of error.

  It is **both**, but in a specific sequence.
  *   **Descriptively:** Montaigne is observing a psychological fact. Humans *do* instinctively use their own customs as the universal benchmark. When he writes, "there is always the perfect religion, there the perfect government," the tone is deeply ironic. He is mocking the dogmatism of his contemporaries who cannot imagine validity outside their own experience.
  *   **Diagnostically:** By framing this observation immediately after saying "I find that there is nothing barbarous... excepting," he signals that this reliance on custom is the *only* true barbarism.

  **How does he exempt himself?**
  This is the crux. If everyone is blinded by custom, how can Montaigne see it? He exempts himself not by claiming he is free of custom, but by claiming the **act of essaying** (testing/trying) allows for a momentary suspension of it.
  In the first sentence, he says, "by anything that I can gather." He positions himself as an investigator gathering evidence, not a judge pronouncing from a throne. He escapes the trap of custom by comparing *two* customs (French and Tupinambá) against a third, higher standard: **Reason/Nature.**
  He is not judging the Tupinambá by French lights (which would be the error described in sentence two); he is judging *both* the French and the Tupinambá by the light of "the common order" (Nature). He exempts himself by adopting the stance of the philosopher-skeptic who questions the "level of truth" rather than accepting it.

  ### 2. The Fruit Analogy: Cultivation as Corruption
  Your second question concerns the reversal of the fruit analogy. Is he making the strong claim that cultivation is corruption? **Yes.**

  *   **The First Move:** "They are savages at the same rate that we say fruit are wild." Here, he neutralizes the pejorative. "Savage" simply means "uncultivated." It is a botanical description, not a moral one.
  *   **The Reversal:** "We ought rather to call those wild, whose natures we have changed by our artifice." Here, he reclaims the pejorative and applies it to the "civilized."

  **The Contradiction regarding Normative Standards:**
  You rightly note that this seems to contradict the earlier denial that we have access to a standard beyond custom. If we have "no other level of truth... than the opinions and customs of the place wherein we live," how can Montaigne appeal to "the common order" or "nature" as a valid benchmark?

  This is where Montaigne shifts from **Cultural Relativism** (all customs are equal) to **Natural Law** (some customs align better with human nature than others).
  He is arguing that "Custom" is a corrupting filter. The Tupinambá are "vigorous and sprightly" because they are closer to the raw material of humanity. The French are "degenerate" because their "artifice" (social hierarchies, greed, religious wars, courtly flattery) has diverted them from the "common order."
  He *does* rely on a normative standard of what nature intends. The tension you feel is real: he denies we have access to truth, then immediately appeals to the truth of Nature.
  **My reading:** Montaigne resolves this by treating "Nature" not as a dogmatic truth we possess, but as a **limit-concept**. We may not know the absolute Truth, but we can observe *corruption*. We can see where artifice has twisted human behavior away from basic instincts (valour, loyalty, survival). He doesn't need to know the perfect blueprint of Humanity to see that the French have deviated further from it than the Tupinambá.

  ### 3. The Closing Verdicts: Relativism or Moral Hierarchy?
  Finally, you ask about the closing sentences. He calls war a "human disease" (universal condemnation) but says their wars are "noble" (specific praise), and that "we... exceed them" in barbarity (comparative condemnation).

  This is the opposite of the opening relativism, but it is necessary for his rhetorical goal.
  *   **The Opening:** "Nothing is barbarous except calling things barbarous." (Epistemological humility).
  *   **The Closing:** "We are more barbarous than they are." (Moral condemnation).

  **How they fit together:**
  The coherence lies in the definition of **Barbarism**.
  In the first sentence, "barbarism" means *difference*. (They are different from us, so we call them barbarians).
  In the last sentence, "barbarism" means *cruelty/vice*. (We are more cruel than they are, so we are the real barbarians).

  Montaigne is using the Tupinambá as a **control group**.
  If humans are naturally violent (war is a "human disease"), how does that violence manifest?
  *   **Tupinambá:** Motivated by "jealousy of valour." It is honest, direct, and bound by a code.
  *   **French/Europeans:** Motivated by greed, religious intolerance, and political betrayal (context from elsewhere in the essay).
  By establishing that *both* sides are flawed (war is a disease), he creates a neutral ground. Then, he measures the *degree* of deviation from reason. The Tupinambá are "noble" not because they are peaceful, but because their violence is consistent with "natural virtues." The Europeans are "barbaric" because their violence is hypocritical and artificial.

  ### Where the Passage Breaks Down
  You asked for a reading that includes where it genuinely breaks down. Here is the fracture point:

  **The Access Problem.**
  Montaigne's argument relies on the premise that the Tupinambá represent "nature" and the French represent "artifice." This is a romanticization that his own skepticism should undermine.
  If "we have no other level of truth... than the customs of the place wherein we live," how does Montaigne know the Tupinambá aren't *also* acting out a complex set of artificial customs that he just doesn't understand?
  He assumes their simplicity is authenticity. But a truly consistent skeptic would have to admit that the Tupinambá might have their own "artifice" that is invisible to a French observer. By treating them as "noble savages" (before the term existed), he risks falling into the same trap he identifies in the first sentence: using an "idea of the opinions... of the place wherein we live" (in this case, the philosophical circle of humanists who idealize the primitive) as his level of truth.

  ### Summary of the Coherent Position
  Despite that fracture, I believe there is a coherent position here, provided we read it as a **rhetorical strategy** rather than a systematic ethical proof.

  1.  **The Trap:** Most people judge others by their own customs (Ethnocentrism).
  2.  **The Escape:** We should judge by "Nature/Reason" instead of Custom.
  3.  **The Observation:** "Civilization" (Artifice) corrupts Nature more than "Savagery" (Lack of Artifice) does.
  4.  **The Verdict:** Therefore, the "Savages" are often more rational and virtuous than the "Civilized," even if both are flawed.

  Montaigne isn't saying "everything is relative." He is saying "our specific claim to superiority is relative and unfounded." He uses the fruit analogy to strip the word *barbarian* of its European baggage, then refills it with a moral meaning that indicts Europe. The paragraph moves from **epistemological skepticism** (we can't know truth easily) to **moral certainty** (we are definitely more cruel than they are). The tension between those two modes is the engine of the essay.
