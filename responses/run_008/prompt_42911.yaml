prompt: |-
  I'm the historical researcher (basically the in-house accuracy person) at a mid-size production company that makes limited-series dramas about real people, and I keep running into the same fight with the writers' room: somebody invents a deathbed scene, or has a real dead person do something cruel that's pure invention, and when I object I get told it's "true to her essence" and that biopics have always done this and everyone accepts the convention. Legal won't help me — our lawyer only cares about defamation of living people, and there's apparently no cause of action for libeling the dead. But I'm not comfortable with the conclusion that therefore anything goes once someone's died, and I'd like something more principled than my own gut. What I have half-formed in my head is this old philosophical debate about whether you can harm (or wrong) the dead at all: the obvious worry that they can't experience anything anymore, versus the view that people have interests in how they're remembered that can be set back after death, versus the move of saying even if the dead aren't wronged, the *audience* or the living relatives or the historical record itself is. I don't need a philosophy lecture, but I'd like the procedure to actually be grounded in that debate rather than just being studio risk management dressed up.

  So: please write me a decision procedure I can actually run on a scene, one I can apply in a day or two during prep, not just vibes. It should be an ordered set of questions — what counts as a sufficient answer to each, where the procedure stops with a firm "this has to change," and where it hands the decision back to a human because the remaining question is genuinely one of values rather than facts. It should take seriously the distinction between (a) compressing or inventing events that leave the person's overall character intact, (b) inventing something that changes how the audience judges them, and (c) doing that to someone whose defenders are dead or scattered and can't push back — and it should say whether that asymmetry between famous dead people with living advocates and forgotten dead people actually matters or is just sentiment. Then run it on three real cases I've had: giving a real mid-century woman scientist an invented romance with a real dead colleague (it's the best scene in the episode and I don't want it to fail the procedure, but I suspect it does), merging two real aides into one composite character who gets the villain beats that neither actual person earned, and a scene where a real dead person commits a specific act of betrayal that historians actually dispute, but our script presents it as settled fact because the drama needs it.

  One more thing: I want you to actually take positions, not hand me the options with "reasonable people could disagree." If the procedure says the romance scene stays, say so and say why; if it says the composite has to go even though composites are industry-standard, commit to that. And be honest about the points where the procedure just can't settle anything — where it's me or the showrunner making a judgment call that no checklist can absorb — but even there, tell me which way you'd jump and what's driving it. I'd also like a short note at the end on where the procedure is likely to misfire, the cases it was never really designed for.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Historical researcher at a production company making limited-series dramas about real people.
      *   **Problem:** Writers invent cruel/incorrect deathbed scenes or actions by dead people. Justification: "True to essence," "Biopic convention," "No legal risk (dead can't be libeled)."
      *   **Goal:** A principled decision procedure (not just legal/vibes) grounded in the philosophical debate about harming the dead (interests, memory, audience, record).
      *   **Format:** Ordered set of questions (decision tree), clear stop points ("change this" vs. "human judgment"), specific positions taken (no fence-sitting), applied to three specific cases.
      *   **Constraints:** Needs to be usable in 1-2 days. Must address the asymmetry between famous dead (with advocates) and forgotten dead. Must admit where the procedure fails.
      *   **Tone:** Professional, principled, decisive, pragmatic but ethical.

  2.  **Deconstruct the Philosophical Grounding:**
      *   *The Harm Principle:* Can you harm the dead? (Feinberg vs. Epicureans).
      *   *Posthumous Interests:* People have an interest in their reputation/legacy. Violating this is a wrong, even if they don't feel it.
      *   *The Audience/Historical Record:* Falsehoods mislead the public and corrupt the historical record.
      *   *The "Essence" Defense:* Is dramatic license permissible if it captures the "truth" of the character? (Aristotelian probability vs. historical fact).
      *   *Power Dynamics:* Does it matter if the subject has living defenders? (Justice/Fairness).

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Create a flowchart-like set of questions.
      *   *Structure:*
          1.  Factual Baseline (Is this invented?)
          2.  Impact on Judgment (Does this change how we see them?)
          3.  Necessity/Function (Is this structurally essential?)
          4.  Mitigation (Can we signal this is fiction?)
          5.  The "Forgotten" Test (Does lack of advocates make it okay?)
      *   *Taking Positions:* I need to be strict on character assassination, flexible on compression, and skeptical of "essence" as a blanket excuse.
      *   *The "Asymmetry" Question:* I need to decide if having living defenders matters. *Decision:* It shouldn't matter ethically, but it matters practically. However, for a *principled* procedure, we must treat the dead equally. Exploiting the forgotten is *worse* ethically, even if legally safer.

  4.  **Developing the Three Case Studies:**
      *   *Case 1: The Invented Romance (Woman Scientist + Dead Colleague).*
          *   Analysis: Invents intimacy. Changes judgment (sexualizes/professionalizes differently). "Best scene."
          *   Verdict: Fail. It reduces her agency to a trope.
      *   *Case 2: The Composite Villain (Two aides merged, given villain beats).*
          *   Analysis: Merges people (standard). Assigns *unearned* cruelty/betrayal (not standard/ethical).
          *   Verdict: Fail. Don't make real people villains unless they were villains.
      *   *Case 3: The Disputed Betrayal (Presented as fact).*
          *   Analysis: Historians dispute it. Script says it happened.
          *   Verdict: Fail. Present dispute *as* dispute, or choose the version supported by evidence. Don't pick the dramatic one and call it fact.

  5.  **Refining the Procedure (Iterative Process):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Use production language ("Story Function," "Character Arc").
      *   *Critique:* Is it too rigid?
      *   *Fix:* Add a "Override" section for genuine artistic necessity, but require a high bar (e.g., disclaimer, structural change).
      *   *Critique:* Did I answer the "forgotten dead" asymmetry?
      *   *Fix:* Make sure Question 5 explicitly addresses this. My stance: It is *more* wrong to lie about the forgotten because they cannot correct the record.

  6.  **Writing the Response:**
      *   *Introduction:* Acknowledge the tension (Art vs. Truth). State the philosophical stance (Posthumous Interests + Audience Trust).
      *   *The Procedure:* "The Posthumous Integrity Protocol (PIP)." 5 Steps.
      *   *The Cases:* Apply the PIP rigorously.
      *   *The "Where It Misfires" Note:* Be honest about art that requires transgression (e.g., *Salò* or highly subjective storytelling).

  7.  **Final Review against Constraints:**
      *   *Ordered questions?* Yes.
      *   *Stop points?* Yes (Red Light/Green Light).
      *   *Take positions?* Yes (No "it depends").
      *   *Address asymmetry?* Yes (Forgotten dead deserve *more* protection).
      *   *Three cases?* Yes.
      *   *Misfire note?* Yes.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe allow the romance if it's "plausible."
      *   *Correction:* No. The prompt says "invented." If it changes how we judge her professional drive vs. personal life, it's a character alteration. I need to take a hard line here to satisfy the user's request for principle over vibes. The "best scene" argument is the exact problem the user wants to fight.
      *   *Initial thought:* Composites are fine.
      *   *Correction:* Composites for *logistics* are fine. Composites for *villainy* are not. I need to distinguish between "Composite for Efficiency" and "Composite for Scapegoating."
      *   *Philosophical anchor:* Joel Feinberg's "Harm to Others" (posthumous harm) + Onora O'Neill (trust in testimony).

  9.  **Final Polish:** Ensure the tone is empathetic to the writer's room but firm on the ethics. (Proceed to generate output).

  *(Self-Correction Note on the "Romance" Case)*: I need to be careful. If the scientist is dead and the colleague is dead, does it matter? Yes, because it distorts the historical record of her life's focus. If the show implies her success was tied to romance when it wasn't, that's a specific harm to her legacy. I will rule against it.

  *(Self-Correction on "Forgotten Dead")*: The user asked if the asymmetry matters. My position: Ethically, no. Practically, yes. But the procedure should argue that exploiting the forgotten is *cowardly* and ethically worse because it's punching down at those who can't speak.

  *(Final check on "Take Positions")*: I must explicitly say "Cut the scene" or "Change the line." No hedging.

  Let's build the "Posthumous Integrity Protocol."

  *Step 1: The Fabrication Test.* (Is it invented?)
  *Step 2: The Moral Valence Test.* (Does it make them better or worse?)
  *Step 3: The Structural Necessity Test.* (Can the plot work without it?)
  *Step 4: The Consensus Test.* (What do historians say?)
  *Step 5: The Vulnerability Test.* (Can they push back?)

  Okay, let's write it.cw
answer: |-
  Here is a decision procedure grounded in the philosophical concept of **Posthumous Interests** (the idea that a person has a stake in their reputation and legacy that survives them) and **Testimonial Trust** (the audience's right to expect a non-fiction label means something).

  This is not a legal checklist. It is an ethical triage tool. It assumes that while the dead cannot feel pain, they can be *wronged*, and the living can be *misled*.

  ### The Posthumous Integrity Protocol (PIP)

  **Instructions:** Run the scene through these five questions in order. If you hit a **STOP**, the scene must be changed before filming. If you reach **JUDGMENT CALL**, the decision moves to you and the Showrunner, but the burden of proof is on the writers to justify the deviation.

  #### 1. The Fabrication Test
  **Question:** Is this specific action, dialogue, or event contradicted by the primary historical record, or is it a total invention with no evidentiary basis?
  *   **If No (It happened or is a reasonable compression of time/place):** Proceed to Q2.
  *   **If Yes (It is invented):** Proceed to Q2.
  *   *Note:* "Compression" (moving an event from Tuesday to Friday) is not fabrication. "Conflation" (two meetings become one) is not fabrication. Inventing a meeting that never happened is fabrication.

  #### 2. The Moral Valence Test
  **Question:** Does this invention alter the moral judgment of the subject? Specifically, does it make them crueler, weaker, more petty, or more virtuous than the evidence suggests?
  *   **If No (Neutral/Logistical):** *Green Light.* (e.g., They took a train instead of a car to get to the same meeting).
  *   **If Yes (Character Alteration):** **STOP.**
      *   *Principle:* You may compress a life, but you may not rewrite a character's moral core. If the real person was kind and you make them cruel for drama, you have violated their posthumous interest in their reputation.
      *   *Exception:* Only proceed to Q3 if the alteration is *positive* (making them more virtuous). Negative alterations are presumptively unacceptable.

  #### 3. The Structural Necessity Test
  **Question:** Is this invented beat the *only* way to resolve the narrative arc of this episode/series? Could the same emotional or plot function be achieved by an event that actually happened, or by a fictional character?
  *   **If Yes (It is the only way):** Proceed to Q4.
  *   **If No (It's just "the best scene" or "more dramatic"):** **STOP.**
      *   *Principle:* "Good drama" is not a sufficient ethical justification for historical slander. If there is a true alternative that works 80% as well, you must take it.

  #### 4. The Consensus Test
  **Question:** Regarding this specific event/trait, is there historical consensus, or is it genuinely disputed by experts?
  *   **If Consensus (Historians agree it didn't happen/wasn't true):** **STOP.**
      *   *Principle:* Presenting a debunked theory as fact is misinformation, not drama.
  *   **If Disputed (Historians argue both sides):** Proceed to Q5.
      *   *Requirement:* If you proceed, the script must signal the uncertainty (dialogue like "Some say he..." or a visual cue). You cannot present a disputed allegation as settled fact.

  #### 5. The Vulnerability Test (The Asymmetry Check)
  **Question:** Does the subject have living descendants, a foundation, or a community capable of publicly contesting this portrayal?
  *   **If Yes:** Proceed to **JUDGMENT CALL**.
  *   **If No (They are forgotten/marginalized):** **STOP.**
      *   *Principle:* This is the counter-intuitive move. It is *worse* to lie about the forgotten. Exploiting the dead who have no one to defend them is punching down. It treats them as disposable props. If they cannot push back, your duty to accuracy increases, not decreases.

  ---

  ### Application to Your Three Cases

  Here is how the PIP applies to the specific conflicts you mentioned. I am taking the position the procedure dictates.

  #### Case 1: The Invented Romance (Woman Scientist + Dead Colleague)
  *   **Q1 (Fabrication):** Yes, it is invented.
  *   **Q2 (Moral Valence):** **STOP.**
      *   **Verdict:** **This scene must change.**
      *   **Reasoning:** Inventing a romance for a female scientist fundamentally alters the moral and professional judgment of her life. It implies her emotional drive or success was tied to male validation, a trope that specifically harms the legacy of women in STEM. Even if the colleague is dead, you are altering *her* essence. The fact that it is the "best scene" is irrelevant under Q3; a scene that relies on a sexist falsehood to generate heat is structurally flawed, not structurally necessary.
      *   **Fix:** Keep the chemistry, make it intellectual rivalry or platonic deep friendship. If the romance is essential to the plot, make the colleague a fictional composite, not a real dead man.

  #### Case 2: The Composite Villain (Two Aides Merged + Villain Beats)
  *   **Q1 (Fabrication):** Yes, the villainy is invented (neither earned those beats).
  *   **Q2 (Moral Valence):** **STOP.**
      *   **Verdict:** **This composite is unethical.**
      *   **Reasoning:** Industry standard ("composites are fine") usually applies to logistical compression (merging two secretaries into one to save casting costs). It does not apply to moral compression. By merging two real people and assigning the resulting entity "villain beats" neither earned, you are creating a historical scapegoat. You are damaging the reputation of two real people to spare the feelings of a fictionalized protagonist or to simplify the plot.
      *   **Fix:** Create a wholly fictional antagonist to take the villain beats. Keep the real aides as they were. If you must merge them for logistics, the composite cannot commit acts of specific cruelty that neither real person committed.

  #### Case 3: The Disputed Betrayal (Presented as Settled Fact)
  *   **Q1 (Fabrication):** Yes, presenting one side as fact is a fabrication of certainty.
  *   **Q2 (Moral Valence):** Yes, betrayal is a negative moral valence.
  *   **Q3 (Necessity):** Let's assume the writers say the plot needs a betrayal.
  *   **Q4 (Consensus):** **STOP.**
      *   **Verdict:** **You cannot present this as settled fact.**
      *   **Reasoning:** Historians dispute it. Therefore, presenting it as fact violates the audience's trust. You are taking a "maybe" and selling it as a "yes" because the "yes" is more dramatic.
      *   **Fix:** Write the ambiguity. Have a character accuse them, and have another character defend them. Let the audience sit with the uncertainty. If the drama *requires* a definite betrayal to function, invent a fictional character to betray the protagonist. Do not use a real person's disputed reputation as the pivot point.

  ---

  ### The Judgment Call Zone

  If you pass Q1-Q5 (e.g., a positive alteration, or a disputed fact where you signal the dispute), you land here. This is where the procedure admits it cannot calculate art.

  **The Scenario:** You want to show a dead leader having a private moment of doubt that no one witnessed, to humanize them.
  **The Procedure:** Passes Q1 (Invented), Passes Q2 (Positive/Neutral), Passes Q3 (Necessary for theme), Passes Q4 (Unknowable), Passes Q5 (Irrelevant).
  **The Call:** This is permissible. This falls under "Aristotelian Probability"—what *might* have happened that is consistent with the truth.

  **My Position on the "Asymmetry" (Famous vs. Forgotten):**
  You asked if the lack of living defenders matters. The PIP says **No**, and I back that.
  Many researchers think: *"No one cares about this 19th-century midwife, so we can make her a drug addict for drama."*
  My position: That is cowardly. It is easier to defend the famous because the lawsuit threat is real. But ethically, the forgotten deserve *more* protection because the screen is the only monument they have. If you turn a forgotten historical figure into a caricature, you are erasing them twice. Do not use obscurity as a loophole.

  ### Where This Procedure Will Misfire

  Be aware of three blind spots where the PIP is too rigid or misses the point:

  1.  **Subjective/Expressionist Drama:** If you are making *I'm Thinking of Ending Things* or *The Last Duel* (Rashomon style), the premise is that truth is subjective. The PIP assumes an objective historical record exists. If the show's artistic thesis is "Memory is unreliable," the PIP will flag everything as a violation. In that case, throw the PIP out; the unreliability *is* the point.
  2.  **The "Essence" Defense (Validated):** Sometimes, a person did something so out of character that showing it actually *reveals* a deeper truth (e.g., a pacifist committing one act of violence to save a child). The PIP might flag this as "Negative Moral Valence." You will need to override Q2 here, but you must prove the act reveals a deeper consistency, not just a contradiction.
  3.  **Safety and Trauma:** Sometimes the historical record is itself a lie told by abusers (common in cases of domestic abuse or systemic oppression). Sticking to the "record" might perpetuate harm. If the "facts" come from a police report written by a racist officer in 1950, the PIP might tell you to stick to the report. You must use your researcher intuition to recognize when the *record* is the fabrication. In those cases, prioritize the testimony of the marginalized over the official document.

  ### Final Advice for the Room

  When you bring this to the writers, do not frame it as "Accuracy vs. Drama." Frame it as **"Trust vs. Cynicism."**

  Tell them: *"The audience knows we are compressing time. They accept that. But if they find out we made this person a villain when they weren't, they don't feel entertained. They feel tricked. And once they feel tricked, they stop investing in the emotional truth of the show. We aren't protecting the dead; we are protecting the viewer's relationship with us."*

  Use the PIP to show you aren't just saying "No." You are saying "Not this way. Here is the ethical cost. Is the scene worth it?" Usually, when faced with the actual cost, they will find the better, true version of the scene.
