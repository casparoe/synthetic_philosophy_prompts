  We count each upward face to build a sum,
  Recorded by the shaking of the hand,
  A ledger kept of every thunderous roll,
  To see how often lands a certain spot.
  We wait through every turn of chance and time,
  And measure strictly how the dice must fall.

  Before the final fall we stop the count,
  No infinite face is ever clearly shown,
  The sequence takes a turn we cannot finish,
  The tired hand must rest before the end,
  There is no last spot written on the list,
  The perfect roll is nowhere to be found.

  The weight inside the roll determines fate,
  It is not luck but how the cubes shall fall,
  A balanced spot of weight within the core,
  Each plastic face has gravity to pull,
  The physics of the turn is fixed and real,
  Not in the hand but in the object lies.

  The thrower's hand imparts the force alone,
  Upon a certain spot of felt it lands,
  The smooth white face is ready to appear,
  Governed by the gravity of fall,
  A tendency within the roll to rest,
  Before the turn of events arrives at last.

  It is my turn to place my single bet,
  I have no helping hand to guide the truth,
  I weigh the risk of fall without a map,
  I cannot see the end of every roll,
  I look upon the face of doubt alone,
  And mark my spot within the shifting odds.

  This single spot upon the table stands,
  There is no turn of history to consult,
  One single roll is all there is to judge,
  My own hand holds the confidence alone,
  I must decide before the fall is done,
  And trust the face that reason shows to me.

  You rest upon your chosen spot post-turn,
  No hand counts up the limit of the roll,
  Three truths contend regarding fall and face.
