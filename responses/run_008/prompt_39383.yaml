answer: |-
  # Diagnostic Instrument: Intuitions on Autonomous System Responsibility

  **Instructions for Students:**
  This is not a test. There are no right or wrong answers, and you will not be graded on this. We are using this to map your starting intuitions about how responsibility works when machines make decisions.

  Read each scenario carefully. Choose the option that best matches your **gut reaction** to the situation. Do not overthink it, and do not worry about legal technicalities or philosophical terms. Answer based on what you think *should* happen or what is *true* about the situation.

  ---

  ### Part 1: The Scenarios

  **1. The High-Frequency Trader**
  A financial firm deploys a machine-learning trading algorithm. The firm's engineers knew that this *class* of algorithm can sometimes behave unpredictably in volatile markets, but they could not predict *this specific* crash. The algorithm causes a $50 million loss.
  *   **A.** The firm is responsible. They knew this kind of risk existed when they hit "deploy," so they own the outcome.
  *   **B.** The specific engineers who wrote the code are responsible. They should have foreseen this specific failure mode.
  *   **C.** No human is truly responsible. The system learned behaviors after deployment that no human chose or could have specifically predicted.

  **2. The Surgical Assistant**
  A surgical robot performs a procedure exactly according to its design specifications. However, in this specific patient's unique anatomy, the designed movement causes fatal damage. No human surgeon made an error; they followed protocol.
  *   **A.** The manufacturer is responsible. If the design fails in the real world, the design was flawed.
  *   **B.** The surgeon is responsible. They are the final authority in the room and should have intervened.
  *   **C.** This is a tragic accident. We should compensate the family, but looking for someone to "blame" doesn't make sense here.

  **3. The Fleet-Learned Car**
  A self-driving car receives an over-the-air update. The update improves braking based on data aggregated from millions of other cars in the fleet. Due to a statistical anomaly in that fleet data, your car brakes unexpectedly on a highway, causing a rear-end collision.
  *   **A.** The car owner is responsible. You own the machine, you bear the risk of its updates.
  *   **B.** The manufacturer is responsible. They managed the data and pushed the update.
  *   **C.** Responsibility is shared across the network. The behavior came from the collective data of all drivers, so the liability should be distributed across the whole system.

  **4. The Five-Second Veto**
  A military commander oversees an autonomous targeting system. Protocol says the commander must approve every strike. In practice, the system identifies targets so fast that the commander has only 5 seconds to review each one and almost always clicks "Approve" to keep up. A wrongful strike occurs.
  *   **A.** The commander is responsible. They hold the formal authority and pressed the button.
  *   **B.** The system designers are responsible. They built a system that moved too fast for meaningful human review.
  *   **C.** The system should not have been used. If a human cannot realistically stop it, putting a human in the loop is a sham.

  **5. The Caregiver Bot**
  An elderly care robot fails to dispense medication due to a software bug, causing harm to the patient. The bug was undetectable with current testing methods.
  *   **A.** The company pays for the harm (legal liability), but no individual is morally "guilty" (no blame).
  *   **B.** The company is both liable for costs and morally guilty for deploying unsafe tech.
  *   **C.** Neither the company nor individuals are liable or guilty. This is an unavoidable risk of using the technology.

  **6. The Black Box Decision**
  An AI denies a loan application. When audited, the engineers cannot explain *why* the AI made that decision, even though they wrote the code. The decision turns out to be discriminatory.
  *   **A.** You cannot hold engineers responsible for decisions they cannot understand or explain.
  *   **B.** Engineers are responsible precisely because they deployed a system they couldn't fully explain.
  *   **C.** The responsibility lies with the regulators who allowed an unexplainable system to be used.

  **7. The Unavoidable Harm**
  A warehouse robot malfunctions in a way that was physically impossible to prevent with current technology. A worker is injured.
  *   **A.** We create an insurance fund or compensation pool. We focus on fixing the harm, not finding a culprit.
  *   **B.** We must find the "least innocent" person (e.g., the safety officer) and assign blame to them, even if it's not perfectly fair.
  *   **C.** We accept that some harms have no responsible agent. We document it and move on.

  **8. The Design Choice**
  You are designing a system that will learn from its environment. You know there is a 1% chance it will develop a behavior you cannot reverse after deployment.
  *   **A.** Proceed with the design, but ensure there is a way to compensate victims if that 1% happens.
  *   **B.** Proceed, but ensure a human can physically override the system at all times.
  *   **C.** Do not deploy the system. If you cannot guarantee control over the outcome, the risk is unethical.

  ---

  ### Part 2: Instructor's Scoring Key & Diagnostic Guide

  **Note on Usage:** This instrument is designed to track *movement* in intuition, not just label students. Because students often hold hybrid views, do not force a single label on them. Instead, use the **Dimension Scores** to show where they sit on the spectrum, and the **Position Clusters** to show which literature views they align with most closely.

  #### I. Dimension Scoring (For Pre/Post Comparison)
  Tally the answers for each of the following four dimensions. This allows you to show students *how* their thinking shifted (e.g., "You moved from valuing Compensation to valuing Control").

  **Dimension 1: The Control Requirement (Questions 4, 6, 8)**
  *   *High Control Intuition:* Answers 4B, 6B, 8B/C. (Belief: If humans can't steer/understand it, they aren't responsible/The tech shouldn't be used).
  *   *Low Control Intuition:* Answers 4A, 6A, 8A. (Belief: Responsibility can exist even if direct control is limited, via risk assumption).

  **Dimension 2: The Foreseeability Scope (Questions 1, 2, 5)**
  *   *Type Foreseeability:* Answers 1A, 2A, 5B. (Belief: If you knew the *kind* of risk existed, you are responsible for the specific instance).
  *   *Instance Foreseeability:* Answers 1B, 2B, 5C. (Belief: You are only responsible if you could predict the specific event).
  *   *Gap Intuition:* Answers 1C, 2C, 5A. (Belief: Specific unpredictability breaks the responsibility link).

  **Dimension 3: The Locus of Agency (Questions 3, 7)**
  *   *Individual/Corporate:* Answers 3A/B, 7B. (Belief: Responsibility must land on a specific entity).
  *   *Collective/Distributed:* Answers 3C, 7A. (Belief: Responsibility is a network property or a social cost).

  **Dimension 4: Moral vs. Legal Distinction (Question 5)**
  *   *Unified:* Answer 5B or 5C. (Belief: Liability and Blame stand or fall together).
  *   *Split:* Answer 5A. (Belief: You can pay for harm without being morally "guilty").

  #### II. Mapping to Literature Positions (Position Clusters)
  Use this to identify which philosophical camp a student's intuition most closely resembles. *Note: Students rarely fit 100% into one box.*

  | Position | Typical Answer Pattern | Literature Reference |
  | :--- | :--- | :--- |
  | **The Gap Realist** | High frequency of "C" answers, specifically 1C, 2C, 5A. Believes learning systems break the link between human intent and outcome. | Andreas Matthias (2004) |
  | **The Gap Denier** | High frequency of "A" answers on Q1, Q2. Believes standard liability models (strict liability, vicarious liability) cover this. | Danaher, Sparrow (Critics) |
  | **Meaningful Human Control** | Strong "B" or "C" on Q4 and Q8. Focuses on the *conditions* for deployment (tracking/tracing) rather than just aftermath. | Santoni de Sio & Mecacci |
  | **The Collectivist** | Selects "Distributed/Pool" options on Q3 and Q7. Views responsibility as a social infrastructure problem, not individual blame. | Isasi, Martin (Distributed Responsibility) |
  | **The Design-Time Hardliner** | Selects "Do not deploy" on Q8 and Q4C. If the gap can't be closed at design, the tech is impermissible. | Ethical Abstention / Precautionary Principle |
  | **The Pragmatist (Legal/Moral Split)** | Selects 5A. Willing to separate "who pays" from "who is to blame" to keep systems running. | Legal Realists / Policy Focused |

  #### III. Diagnosing Incoherent or Unexplored Profiles
  Some answer combinations suggest intuitions that are philosophically unstable or rarely defended in the literature. Flag these for discussion.

  *   **The "Punish the Innocent" Profile:**
      *   *Pattern:* Q1C (No human responsible) + Q2B (Surgeon responsible despite no error).
      *   *Diagnosis:* This student wants to assign blame even when they admit control was impossible. This is often an emotional reaction to harm rather than a consistent theory. *Discussion Point:* Is blame useful if it's unfair?
  *   **The "Magic Button" Profile:**
      *   *Pattern:* Q4A (Commander responsible) + Q8B (Human override is sufficient solution).
      *   *Diagnosis:* This student assumes a human veto solves the problem, even when Q4 admits the veto is nominal (5 seconds). They are conflating *formal* authority with *effective* control. *Discussion Point:* What makes control "meaningful"?
  *   **The "Pure Compensator" Profile:**
      *   *Pattern:* Q5A (Split moral/legal) + Q7C (No responsible agent).
      *   *Diagnosis:* This view suggests we should compensate victims even if *no one* is at fault and *no one* is liable. While attractive, it raises the question: Where does the money come from if no one is liable? This points toward a state-funded social insurance model not fully captured in the quiz options.

  #### IV. Instrument Limitations (Blind Spots)
  Be transparent with students that this quiz cannot perfectly separate the following positions:

  1.  **Strict Liability vs. Collectivism:** Both positions often result in the manufacturer or a fund paying (Q1A vs Q3C). The quiz distinguishes them on *why* (risk assumption vs. network contribution), but in practice, the financial outcome looks identical.
  2.  **Gap Realism vs. Hardliner:** Both agree that current systems lack responsible agents. The Realist says "Accept the gap," the Hardliner says "Ban the system." Q8 attempts to separate these, but a student who answers "Ban" might also believe "No one is responsible," making the distinction between *ontological gap* and *policy response* blurry in their mind.
  3.  **Moral vs. Legal:** Only Q5 explicitly tests this. A student might hold a split view but answer Q1 or Q2 based on legal norms they assume are moral. Remind them during debrief that "Responsibility" in this course covers both blame (moral) and liability (legal).

  ### Implementation Tip
  When you return the results to the students, do not give them a "Type." Instead, give them their **Dimension Scores**.
  *   *Example:* "Your Control Score is High, meaning you intuitively feel that without understanding the 'why' of a system, you can't be responsible for it. Your Foreseeability Score is Low, meaning you think knowing the general risk isn't enough."
  This invites them to argue with their own scores during the unit, which is where the actual learning happens.
