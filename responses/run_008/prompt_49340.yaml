  For context: I spent thirty-eight years as a physical chemist before retiring, and for the past two years I have been reading philosophy in earnest. I am comfortable with mathematics, so you need not spare me the technical points, but I am new to this literature.

  I have just finished a popular book on rationality — I will leave it unnamed, since my question concerns the position rather than the author — and its central chapter summarized the coherence arguments for expected utility maximization roughly as follows:

  "The coherence theorems of decision theory — von Neumann and Morgenstern's, and later Savage's — prove that any rational agent must be an expected utility maximizer. The proof is essentially bookkeeping. If your preferences violate any of the axioms — if, for instance, you go in a circle and prefer A to B, B to C, and C back to A — a bookmaker can run you through a sequence of trades, each of which you accept, until you hold exactly what you started with minus a fee: the money pump. Rationally, you will want to revise your preferences until no such exploitation is possible. And when you have revised them fully, the theorems guarantee that your preferences can be represented by one unique utility function over outcomes and one unique probability measure over states of the world, so that you always take the act with the highest expected utility. Expected utility maximization is therefore neither an empirical hypothesis about how people behave nor a value judgment; it is a theorem of logic. It follows that anyone who passes up a bet with a positive expected payoff — the man who buys insurance, or who declines a lottery ticket whose expected winnings exceed its price — is simply irrational."

  My training leaves me respectful of theorems, and I am inclined to accept the chapter's central conclusion. But the closing claim about insurance unsettles me, since I buy insurance myself and had not thought myself irrational for it; and the phrase "a theorem of logic" struck me as doing a great deal of work. I cannot locate the errors myself, if there are any.

  Please structure your reply with the following sections, in this order:

  1. "The accurate core" — a short paragraph, roughly 100 to 150 words, stating which parts of the chapter's summary a careful decision theorist would accept as written.
  2. "Sentence-by-sentence audit" — roughly 500 to 600 words. Take the quoted passage in order, flagging at each step what is accurate, what is a conflation or an overstatement, and what a defender of the coherence arguments would insist the theorems do not say.
  3. "What the theorems actually establish" — roughly 200 words, a clean statement of what follows from what, and which assumptions carry the real weight.
  4. "Does the insurance conclusion survive?" — roughly 150 words on whether that conclusion follows from anything accurate in the summary.
  5. "Your verdict" — roughly 100 words on how much of this chapter, on the evidence of its summary, I ought to trust.
