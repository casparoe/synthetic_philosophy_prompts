answer: |-
  1. "The accurate core"

  A careful decision theorist would accept that the von Neumann-Morgenstern (vNM) and Savage theorems establish representation results: if an agent's preferences satisfy specific consistency axioms (completeness, transitivity, continuity, independence), those preferences can be represented as maximizing expected utility relative to some utility function and probability measure. They would also agree that violating transitivity exposes an agent to a "money pump," a sequence of trades leaving them worse off. Consequently, if one accepts these axioms as necessary conditions for rationality, EU maximization follows deductively. The core mathematical link between consistency and representation is sound. However, the leap from mathematical consistency to substantive rationality regarding risk attitudes (like insurance) involves conflating utility with monetary value, which the theorems themselves do not mandate.

  2. "Sentence-by-sentence audit"

  "The coherence theorems... prove that any rational agent must be an expected utility maximizer." This is conditionally true. The theorems prove that if you satisfy the axioms, you act *as if* maximizing EU. They do not prove the axioms are binding on pain of irrationality; that is a philosophical premise, not a mathematical result. The move from "consistent" to "rational" is normative.

  "The proof is essentially bookkeeping." This is a harmless simplification, though it understates the measure-theoretic complexity in Savage's framework regarding state spaces and sigma-algebras. For a physical chemist, think of it less like arithmetic and more like proving a state function exists based on path independence.

  "If your preferences violate any of the axioms... a bookmaker can run you through a sequence of trades... the money pump." This applies strictly to transitivity violations. Other axioms, like Independence, do not yield dynamic money pumps in the same straightforward way. Conflating all axioms with money pumps is an overstatement often found in popularizations. Violating Independence might make you susceptible to Dutch Books in specific betting contexts, but it is not a simple cycle of trades.

  "Rationally, you will want to revise your preferences until no such exploitation is possible." This assumes the only goal is avoiding exploitation. Many philosophers argue some axiom violations (like Allais paradox violations) reflect reasonable risk attitudes, not exploitable errors. It presumes rationality is solely about internal consistency rather than substantive goals. It ignores the cost of deliberation required to ensure perfect coherence.

  "And when you have revised them fully, the theorems guarantee that your preferences can be represented by one unique utility function... and one unique probability measure..." vNM guarantees utility unique up to positive affine transformation; Savage derives subjective probability. But "unique" is technically qualified; scaling matters. Furthermore, the representation is existence-proof, not necessarily constructive. You know the function exists, not necessarily what it is.

  "Expected utility maximization is therefore neither an empirical hypothesis about how people behave nor a value judgment; it is a theorem of logic." This is the critical overreach. It is a theorem of mathematics *given* the axioms. Whether the axioms are normative truths is a value judgment. Calling it pure logic obscures the substantive assumptions embedded in the Independence axiom, which many argue is not logically necessary. It treats a model as a law of nature. It mistakenly elevates a contingent modeling choice to the status of a priori truth.

  "It follows that anyone who passes up a bet with a positive expected payoff... is simply irrational." This is false. EU maximization operates over *utility*, not monetary expected value. A concave utility function (risk aversion) rationalizes buying insurance and declining positive monetary EV gambles. The summary conflates expected utility with expected monetary value. Buying insurance is perfectly consistent with EU maximization if the utility of wealth is non-linear. The author confuses risk neutrality with rationality. A rational agent maximizes expected utility, which often diverges from expected monetary value due to diminishing marginal utility of wealth. This error is common in introductory texts but fundamentally misrepresents the theory.

  3. "What the theorems actually establish"

  The theorems establish a conditional equivalence: If an agent's preference ordering over lotteries (vNM) or acts (Savage) satisfies specific structural axioms, then there exists a utility function and (in Savage's case) a probability measure such that the agent prefers act A to act B if and only if the expected utility of A exceeds that of B. The heavy lifting is done by the axioms, particularly Independence and Continuity. These are not logical truths like non-contradiction; they are substantive constraints on how risk and uncertainty are weighed. The theorems do not dictate what your utility function must look like—only that one exists if you are consistent. They do not mandate risk neutrality. They guarantee representation, not specific choices. Therefore, the mathematics validates the structure of rational choice, but the normative force depends entirely on whether one accepts the axioms as requirements of rationality rather than mere modeling conveniences. Crucially, the theorems separate belief (probability) from desire (utility), showing that coherent preferences imply both, but they do not dictate the content of those desires. Thus, the theorem is a representation result within a formal system, not a universal law of reasoning applicable to all contexts without qualification. In short, the mathematics is sound, but the philosophy is contested.

  4. "Does the insurance conclusion survive?"

  No, the conclusion that buying insurance is irrational does not survive scrutiny. The summary commits a category error by equating "expected payoff" with "expected monetary value." In expected utility theory, payoffs are measured in utils, not dollars. A rational agent with a concave utility function for wealth—reflecting diminishing marginal utility—will prefer a certain loss (the premium) over a small probability of a catastrophic loss, even if the premium exceeds the statistical expected monetary loss. This is the standard economic explanation for insurance. The summary's claim implies that rationality requires risk neutrality, which contradicts the very framework it cites. Expected utility maximization explicitly accommodates risk aversion. Therefore, buying insurance is not only compatible with the coherence theorems; it is a textbook example of expected utility maximization in action, provided the utility function is non-linear with respect to money. The author's claim fails because it ignores the curvature of the utility function. This distinction is vital.

  5. "Your verdict"

  Treat the chapter as a persuasive introduction to the *structure* of rationality, not a definitive guide to its *content*. The author conflates formal consistency with substantive rationality and mistakes model assumptions for logical laws. You should trust the exposition of the money pump and the representation result, but reject the normative leap that declares risk aversion irrational. Your intuition about insurance was correct; the book's conclusion was not. Read the theorems as describing what coherence looks like, not prescribing what you must value. Given your scientific training, you will recognize the difference between a model's internal validity and its external applicability.
