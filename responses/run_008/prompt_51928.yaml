answer: |-
  You have identified a genuine tension in cultural evolution theory, and your intuition is correct: standard Dawkinsian memetics struggles to account for this because it treats **fidelity** as a universal good for lineage stability, whereas you are describing a regime where **infidelity** is the engine of lineage expansion.

  There is no single, canonical term in the academic literature that captures *exactly* what you are describing (selection for degradation as a signal of permission). However, the phenomenon sits at the intersection of three existing concepts. I will outline those, explain where they fall short of your observation, and then offer a coined term with a precise definition to "carve" the phenomenon as you requested.

  ### 1. The Existing Literature (and where it stops)

  **A. Selection for Malleability (Limor Shifman)**
  In *Memes in Digital Culture* (2014), Limor Shifman distinguishes between "viral" content (one file shared many times) and "memetic" content (a template replicated with variation). She identifies **malleability** as a key dimension of memetic success.
  *   **Where it fits:** It acknowledges that content must be easy to change to survive.
  *   **Where it stops:** Shifman focuses on the *structure* of the meme (e.g., a macro format) being malleable. She does not explicitly theorize that the *aesthetic degradation* of the artifact itself is the mechanism that signals malleability. She doesn't account for the "intimidation factor" of high-fidelity art.

  **B. Cultural Attraction Theory (Dan Sperber)**
  Sperber argues that cultural transmission is rarely "copying"; it is "reconstruction." We hear a story and reconstruct it based on cognitive attractors (what makes sense to us).
  *   **Where it fits:** It explains why details get lost (lossiness).
  *   **Where it stops:** In Attraction Theory, information loss is usually a byproduct of cognitive constraints (memory, attention). In your observation, the lossiness is *functional* for the meme's spread. It's not just that people *can't* remember the details; it's that the lack of details *invites* them to add new ones.

  **C. Signaling Theory (Amateur vs. Professional)**
  In sociology and media studies, a "rough" aesthetic often signals authenticity or community ownership, while a "polished" aesthetic signals corporate ownership or a "finished product."
  *   **Where it fits:** This explains the psychological mechanism (nobody feels intimidated).
  *   **Where it stops:** This is usually framed as a social signal between humans, not as an evolutionary pressure on the *replicator itself*. It doesn't frame "ugliness" as a trait selected for *fecundity*.

  ### 2. The Carving: A New Term

  Since existing concepts cover the *mechanism* (malleability), the *process* (reconstruction), or the *signal* (amateurism), but none combine them into an evolutionary pressure where **degradation increases fitness**, I propose we coin the term:

  ## **Adaptive Lossiness**

  **Definition:**
  A trait in a cultural replicator where the reduction of information density or aesthetic fidelity during transmission actively increases the replicator's fecundity by lowering the skill threshold required for downstream reproduction.

  **The Evolutionary Logic:**
  In classic memetics, Fidelity = Stability. In **Adaptive Lossiness**, Fidelity = Barrier to Entry.
  *   **High Fidelity:** Signals "Consumption Only." The artifact looks finished. The viewer perceives a high skill gap between the original and their potential copy. Result: High Sharing, Low Remixing.
  *   **Adaptive Lossiness:** Signals "Production Allowed." The artifact looks unfinished or easily reproducible. The viewer perceives a low skill gap. Result: Lower Sharing (sometimes), High Remixing.

  **The Boundary Conditions (The "Carving"):**
  To determine if a case falls inside **Adaptive Lossiness**, it must meet three criteria:
  1.  **Loss is Non-Random:** The degradation isn't just noise; it strips away specific complexities (shading, timing, specific wording) that require skill to reproduce.
  2.  **Fecundity Trade-off:** The degraded version spawns *more variants* than the original, even if the original had higher initial engagement (shares/views).
  3.  **Signal of Permission:** The roughness functions as a social cue that modification is welcome or expected.

  ### 3. Testing the Boundaries

  Here is how **Adaptive Lossiness** applies to your examples and where the line falls:

  **1. Internet Memes (The Prime Case)**
  *   **Verdict:** **Inside.**
  *   **Why:** The "Wojak" or "Stick Figure" variants of complex comics spawn thousands of remixes. The original high-res comic is shared, but the MS Paint version *propagates*. The loss of detail is the feature that allows mass participation.

  **2. Folk Tales / Oral Tradition**
  *   **Verdict:** **Inside.**
  *   **Why:** Stories that survive generations are "sanded down." Specific names, dates, and complex descriptions are lost. This isn't just memory failure; it's selection for *tellability*. A story with fewer specific constraints is easier for the next teller to retell (reproduce) without error. The "lossiness" ensures the story survives the transmission bottleneck.

  **3. Cover Songs**
  *   **Verdict:** **Borderline / Conditional.**
  *   **Why:** A "campfire version" of a song (stripped down chords, simplified melody) is easier for others to learn and play than the studio production. This fits **Adaptive Lossiness**. However, if the simplification destroys the recognizable hook, the lineage dies. It only counts if the simplification *increases* the number of subsequent performers. (e.g., "House of the Rising Sun" has hundreds of covers because the structure is simple/lossy enough to adopt; a virtuoso guitar solo piece has fewer).

  **4. Recipes**
  *   **Verdict:** **Mostly Outside.**
  *   **Why:** Recipes are selected for *outcome fidelity* (taste), not reproduction fidelity. A "weeknight version" of a recipe is simpler, yes, but if it tastes worse, the lineage dies. The selection pressure is on the *result*, not the *ease of copying*. However, "Mug Cakes" vs. "Soufflés" might fit: the Mug Cake spreads faster because the fidelity barrier is lower, even if the Soufflé is "better."

  **5. Scientific Data / Math**
  *   **Verdict:** **Outside.**
  *   **Why:** Here, fidelity is paramount. Lossiness is noise/error. A degraded equation does not spawn more variants; it spawns confusion and death of the idea. This highlights the boundary: Adaptive Lossiness only applies in **expressive/interpretive** cultural domains, not **functional/technical** ones.

  ### 4. Is this new, or just old phenomena at internet speed?

  It is an old phenomenon (folk tales, graffiti tags, protest slogans) operating in a **new visibility regime.**

  In pre-internet culture, you couldn't see the "polished original" and the "degraded copy" side-by-side in the same feed. You didn't know the folk tale was a degraded version of a bard's epic; you just knew the version you heard.
  The internet makes the **genealogy visible.** We can see the 4K video *and* the blurry screenshot in the same thread. This makes the selection pressure visible to the participants. Users *learn* that posting the blurry screenshot gets more engagement (remixes) than the 4K video. This creates a **feedback loop** where users intentionally degrade their own content to trigger Adaptive Lossiness.

  ### Summary

  The phenomenon is **Adaptive Lossiness**.

  *   **It is not** simple decay (which kills the meme).
  *   **It is not** selection for humor (the content might be identical).
  *   **It is** selection for **lowered production cost** in downstream replicators.

  The "carving" is this: If the degradation of the artifact **lowers the skill threshold for reproduction** and thereby **increases the branching factor of the lineage**, it is Adaptive Lossiness. If the degradation merely makes it easier to transmit *without* changing (e.g., compressing a file to email it), that is just **Transmission Efficiency**. Adaptive Lossiness requires that the lossiness *invites variation*.

  You are observing the shift from **Replicator Stability** (Dawkins) to **Replicator Invasiveness**. The meme that wins isn't the one that stays the same; it's the one that invites the most hosts to become co-authors. The "ugliness" is the invitation.
