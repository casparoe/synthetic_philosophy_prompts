prompt: |-
  I'm organizing a year-long adversarial collaboration between two philosophers — one a robust moral realist (think non-naturalist-ish: stance-independent moral facts, some knowable), the other an anti-realist (quasi-realist/expressivist flavor). They've mostly been arguing past each other about debunking arguments and whether moral judgments aim at truth. You're a professional metaethicist who's moderated several of these collabs before. Draft the joint statement they should be able to sign at the end.

  Specifically I want: (1) a numbered section of claims both accept — include things like the phenomenology of moral disagreement, what evolutionary explanations of our moral intuitions actually show and dont show, and that neither side's view predicts we'd stop arguing about abortion; (2) a disagreements table where each remaining disagreement is phrased so that its own side would accept the wording (this is the hard part — the realist will veto anything that makes realism sound like believing in a magic moral lightbulb, the anti-realist will veto anything that makes her a cynic or a relativist); (3) the cruxes. At least one crux should be the moral convergence one: they agree the historical record of, e.g., abolition and the expanding moral circle is evidence that bears on their dispute — the realist predicts the changes will look like error-correction under norms like consistency and impartiality, the anti-realist predicts they'll track power, coordination needs, and who could be heard, more than truth-approximation. Spell out both predictions concretly enough that the record could in principle score them, and have each side pre-register what pattern would count against their own view.

  They also both suspect a chunk of their dispute is verbal — something about what it takes for a claim about slavery being wrong in 1750 to be "true." If part is verbal, say which part and why; if part is substantive, make the boundary exact. Think carefully before writing: brainstorm first which formulations each side would refuse to sign and why, and avoid agreed claims that are vacuous ("we agree morality is important" tells us nothing). Then give me the final document: numbered agreed claims, the table, then cruxes with each side's prediction written down.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Role:** Professional Metaethicist/Moderator.
      *   **Task:** Draft a joint statement for a year-long adversarial collaboration between a Robust Moral Realist (non-naturalist-ish) and an Anti-Realist (quasi-realist/expressivist).
      *   **Goal:** Overcome "talking past each other" regarding debunking arguments and truth-aiming.
      *   **Required Components:**
          1.  Numbered section of agreed claims (phenomenology, evolutionary explanations, persistence of disagreement).
          2.  Disagreements Table (phrased neutrally so each side accepts the description of their own view without caricature).
          3.  Cruxes (specifically moral convergence/history, pre-registered falsification conditions, verbal vs. substantive dispute analysis).
      *   **Constraints:** Avoid vacuous agreements ("morality is important"). Avoid caricatures (Realist ≠ magic lightbulb; Anti-Realist ≠ cynic/relativist). Ensure precise philosophical wording.

  2.  **Brainstorming & Filtering:**

      *   *Agreed Claims:*
          *   *Phenomenology:* Both sides experience moral judgments as objective. The quasi-realist explains this via projectivism/internal norms; the realist takes it at face value. Agreement: It *feels* objective.
          *   *Evolution:* Evolution shaped our capacities. Realist: Doesn't debunk, maybe explains access. Anti-Realist: Explains origin, undermines independence. Agreement: Evolution explains *why we have* the intuitions, not necessarily their *status*.
          *   *Persistence:* Neither side thinks better philosophy ends disagreement soon. Realist: Complexity/human frailty. Anti-Realist: Clashing attitudes.
          *   *Function:* Moral language guides action and coordinates behavior.

      *   *Disagreements Table:*
          *   *Challenge:* How to describe "Moral Facts" without sounding spooky (Realist) and "Attitudes" without sounding subjective/cynical (Anti-Realist).
          *   *Realist View:* Needs to avoid "queer entities." Focus on "stance-independent normative reasons."
          *   *Anti-Realist View:* Needs to avoid "mere preference." Focus on "expression of conative states governed by logical norms."
          *   *Truth:* Realist: Correspondence/robust. Anti-Realist: Deflated/minimalist but still usable.

      *   *Cruxes (Convergence/History):*
          *   *Scenario:* Abolition of slavery, women's suffrage, animal rights.
          *   *Realist Prediction:* Progress looks like removing bias, increasing consistency, better access to independent facts. *Falsification:* If progress correlates perfectly with economic utility and reverses when utility flips, with no appeal to consistency.
          *   *Anti-Realist Prediction:* Progress looks like expanding sympathy, coordination solutions, power shifts. *Falsification:* If moral change happens *against* all power interests and coordination needs solely via "logical consistency" arguments without emotional resonance.
          *   *Verbal vs. Substantive:* Is "True" the sticking point? Yes. Realist wants robust truth; Anti-Realist wants minimal truth. Substantive core: Are there reasons for action that exist regardless of our psychology?

  3.  **Drafting - Section by Section:**

      *   *Introduction:* Set the tone. Professional, collaborative, acknowledging the difficulty.
      *   *Section 1 (Agreed Claims):*
          *   1. Phenomenology: Moral experience presents as discovery, not invention.
          *   2. Evolutionary Debunking: Evolution explains the *capacity*, not the *validity* directly. Both agree it doesn't settle the metaphysics alone.
          *   3. Disagreement Persistence: Moral philosophy won't solve abortion next year.
          *   4. Practical Role: Moral claims motivate and constrain.
      *   *Section 2 (Disagreements Table):*
          *   Need columns: Issue, Realist Characterization, Anti-Realist Characterization.
          *   *Metaphysics:* "Stance-independent normative relations" vs. "Projection of conative attitudes subject to logical constraints."
          *   *Truth:* "Substantive correspondence" vs. "Minimal/deflated truth applicable to sincere assertion."
          *   *Error:* "Failure to track independent facts" vs. "Incoherence within the web of attitudes."
      *   *Section 3 (Cruxes & Predictions):*
          *   *The Historical Record:* Focus on the "Expanding Circle."
          *   *Realist Prediction:* Change driven by argumentative consistency (e.g., "if X matters, Y must matter"). *Contra-evidence:* Changes track only raw power/economics with no consistency appeals.
          *   *Anti-Realist Prediction:* Change driven by empathy expansion + coordination stability. *Contra-evidence:* Changes occur solely via abstract logical deduction without shift in sentiment or power dynamics.
          *   *Verbal/Substantive Split:* Identify the "Truth" predicate as partly verbal. The substantive core is the "Reason-Giving Status."

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is the Anti-Realist description too weak?
      *   *Fix:* Ensure "Quasi-Realist" language is used. They earn the right to talk about truth. It's not "just feelings." It's "sentiments governed by norms."
      *   *Critique:* Is the Realist description too spooky?
      *   *Fix:* Use "Normative Facts" rather than "Moral Particles." Emphasize "Reasons."
      *   *Critique:* Is the historical prediction testable?
      *   *Fix:* Make it specific. Look at the *rhetoric* used during abolition. Was it consistency-based or power-based?
      *   *Critique:* Verbal dispute section.
      *   *Fix:* Distinguish between the *word* "true" (deflated vs. robust) and the *property* it tracks (psychological coherence vs. mind-independent obtaining).

  5.  **Final Review against Constraints:**
      *   Numbered agreed claims? Yes.
      *   Disagreements table? Yes.
      *   Cruxes with predictions/falsification? Yes.
      *   Verbal/Substantive analysis? Yes.
      *   Tone: Professional moderator.

  6.  **Final Polish:** Check for clarity, precision, and ensure neither side would feel misrepresented (the "veto" test). *Self-correction: Ensure the Anti-Realist isn't described as a relativist. Quasi-realists believe in moral truth, just not realist truth. Make sure that distinction is clear in the table.*

  *(Self-Correction on the "Truth" issue)*: The prompt asks about "what it takes for a claim... to be true." The Quasi-Realist says "It is true that slavery is wrong" is a valid assertion. The Realist agrees. The disagreement is *why* it's valid. I need to make sure the verbal dispute section captures this nuance. The word "true" might be the verbal part; the "stance-independence" is the substantive part.

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Project:** Metaethical Foundations and Historical Convergence
  **Participants:** Dr. A. (Robust Non-Naturalist Realist) & Dr. B. (Quasi-Realist Expressivist)
  **Moderator:** [Your Name/Role]
  **Date:** October 26, 2023

  ### Preamble
  Over the past year, we have engaged in structured dialogue regarding the metaphysical status of moral claims, the implications of evolutionary psychology, and the interpretation of moral progress. While we remain divided on core ontological questions, we have identified significant common ground regarding the phenomenology and function of moral discourse. This document records our agreements, precisely locates our disagreements without caricature, and pre-registers empirical cruxes regarding the historical record of moral change.

  ---

  ### I. Agreed Claims
  *Both signatories endorse the following propositions. These are not merely procedural but substantive commitments regarding the data any metaethical theory must accommodate.*

  1.  **Phenomenology of Objectivity:** In first-person deliberation, moral judgments present themselves as discoveries rather than inventions. When we deliberate about whether an action is wrong, we experience ourselves as tracking a constraint independent of our current whims. We agree that a successful metaethics must explain *why* moral experience has this phenomenology, regardless of whether it is veridical.
  2.  **Evolutionary Explanations:** We agree that evolutionary history explains the *origin of our moral faculties* and the *content of many basic intuitions* (e.g., kin preference, reciprocity). However, we agree that evolutionary genealogy alone does not settle the *justificatory status* of moral claims. The "Debunking Argument" establishes a challenge to explain the reliability of our faculties, but it does not constitute a disproof of realism nor a proof of anti-realism without further premises.
  3.  **Persistence of Disagreement:** Neither of us predicts that philosophical argumentation will resolve substantive first-order moral disagreements (e.g., abortion, distributive justice) in the near term. The Realist attributes this to epistemic difficulty, bias, and the complexity of applying norms; the Anti-Realist attributes this to fundamental clashes in conative attitudes. We agree that the *persistence* of disagreement is not, by itself, a decisive argument for either side.
  4.  **Practical Function:** Moral language functions to guide action, coordinate social behavior, and hold agents accountable. We agree that moral claims are not inert descriptions; they entail reasons for action (internal or external) and are subject to norms of consistency.
  5.  **The "Truth" Predicate:** We agree that sentences like "Slavery was wrong in 1750" are truth-apt in the grammatical sense. We can both assert, "It is true that slavery was wrong," without linguistic impropriety. Our disagreement concerns what *makes* that assertion true, not whether the assertion is permissible.

  ---

  ### II. Table of Remaining Disagreements
  *The following table isolates the specific points of divergence. The wording has been negotiated to ensure neither party feels their view is caricatured (e.g., Realism is not described as "magic," Anti-Realism is not described as "relativism").*

  | Domain | Realist Characterization (Dr. A) | Anti-Realist Characterization (Dr. B) |
  | :--- | :--- | :--- |
  | **Metaphysics** | Moral properties are **stance-independent**. The wrongness of slavery obtains even if no human being believes it to be wrong or has any reactive attitude toward it. | Moral properties are **stance-dependent projections**. Wrongness is a reflection of our conative attitudes (approval/disapproval) projected onto the world, governed by logical norms. |
  | **Nature of Truth** | Moral truth is **substantive**. A moral claim is true because it corresponds to a normative fact that exists independently of our psychology. | Moral truth is **minimal/deflated**. To say a moral claim is "true" is just to reaffirm the moral claim itself. No extra "correspondence" relation is required or coherent. |
  | **Error Theory** | Moral error consists in **failing to track** independent normative facts (e.g., due to bias or ignorance). | Moral error consists in **incoherence** within the web of attitudes (e.g., violating consistency, impartiality, or failing to account for relevant non-moral facts). |
  | **Reasons for Action** | There are **external reasons**. Agents have reasons to act morally even if acting morally conflicts with their deepest desires or idealized rationality. | There are only **internal reasons**. Moral reasons are grounded in what agents would care about under conditions of full information and reflective equilibrium. |

  ---

  ### III. Cruxes and Pre-Registered Predictions
  *We identify the historical record of moral change (e.g., abolition, suffrage, animal welfare) as a shared body of evidence that bears on our dispute. While history cannot metaphysically prove realism or anti-realism, different patterns of change would significantly lower the credence of one view over the other.*

  #### Crux 1: The Pattern of Moral Convergence
  **The Question:** Does the historical expansion of the "moral circle" look more like error-correction regarding independent facts, or like the shifting of sentiments and coordination needs?

  **Realist Prediction (Dr. A):**
  *   **Mechanism:** Moral progress is driven primarily by the **application of consistency norms** to existing commitments. Agents realize that their existing principles (e.g., "pain is bad," "autonomy is good") logically entail protections for groups they previously excluded.
  *   **Evidence to Look For:** Rhetorical shifts in historical debates should show actors appealing to *impartiality* and *universalizability* even when it contradicts their economic interest. The trajectory should be toward greater *systematic coherence* over time.
  *   **Falsification Condition (What counts against Realism):** If historical moral change correlates perfectly with **economic utility or power dynamics** and reverses immediately when those dynamics flip, *without* appeals to consistency or impartiality. If "progress" is shown to be merely the preference of the victors codified as law, with no residue of normative argumentation that transcends power, Realism loses explanatory power.

  **Anti-Realist Prediction (Dr. B):**
  *   **Mechanism:** Moral progress is driven primarily by **expanding sympathy** and **coordination stability**. Changes occur when excluded groups gain the power to disrupt coordination or when including them becomes socially stable/beneficial. Argumentation is a tool to shift sentiments, not to track facts.
  *   **Evidence to Look For:** Rhetorical shifts should track **changes in social power** and **emotional resonance**. Moral arguments succeed when they make the audience *feel* the plight of the other, not merely when they point out logical inconsistencies.
  *   **Falsification Condition (What counts against Anti-Realism):** If moral change occurs **solely via abstract logical deduction** in the absence of any shift in power dynamics, economic interest, or sentimental engagement. If societies routinely adopt costly moral norms that destabilize coordination and harm powerful interests *purely* because of a "logical requirement" without any accompanying shift in collective sentiment, Quasi-Realism cannot explain the motivational force.

  #### Crux 2: The Verbal vs. Substantive Boundary
  *We suspect a portion of our dispute is verbal, specifically regarding the word "true," but a core remains substantive.*

  **1. The Verbal Component:**
  We agree that the dispute over whether moral claims are "really true" is partially verbal.
  *   **Diagnosis:** Dr. B (Anti-Realist) uses a **deflationary theory of truth**. For B, "It is true that X" adds no metaphysical weight to "X." Dr. A (Realist) uses a **robust theory of truth**, where "It is true that X" implies a relation between language and mind-independent reality.
  *   **Resolution:** We acknowledge that when B says "Slavery is truly wrong," B is not denying the normativity of the claim, but denying the *metaphysical baggage* A attaches to the word "true." We will henceforth distinguish between **"minimal truth"** (assertibility) and **"robust truth"** (stance-independent obtaining).

  **2. The Substantive Core:**
  Once the terminology of "truth" is disambiguated, the following substantive disagreement remains:
  *   **The Question:** **Are there normative reasons for action that obtain independently of our conative psychology?**
  *   **Realist Position:** Yes. Even if no human being cared about suffering, suffering would still provide a reason to prevent it.
  *   **Anti-Realist Position:** No. Reasons are constitutively tied to what agents care about (or would care about under idealized reflection). Without a valuer, there is no value.
  *   **Why this is not verbal:** This is not a dispute about definitions. It is a dispute about the **direction of fit**. The Realist claims the mind must fit the norm; the Anti-Realist claims the norm is constructed by the mind. No amount of linguistic stipulation can resolve whether reasons exist without valuers.

  ---

  **Signed,**

  _________________________
  **Dr. A (Realist)**

  _________________________
  **Dr. B (Anti-Realist)**

  _________________________
  **Moderator**
