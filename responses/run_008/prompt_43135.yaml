answer: |-
  This is a fantastic question. You are right to be skeptical of the pop-science summary; while your friend has grasped the *vibe* of the literature, she has conflated several distinct technical claims and picked up some common caricatures that experts in the field spend a lot of time correcting.

  Since you are at the Master's level, you need to distinguish between the **mathematical principle** (Free Energy Principle), the **neuroscientific theory** (Predictive Processing), and the **behavioural framework** (Active Inference). Your friend's summary mashes these together.

  Here is a bit-by-bit breakdown of what a researcher in this field would accept, what they would wince at, and what is technically incorrect.

  ---

  ### 1. "Predictive Processing and the Free Energy Principle are basically two names for the same theory."
  *   **Verdict:** **Conflation.**
  *   **The Nuance:** This is the biggest category error in her summary.
      *   **The Free Energy Principle (FEP)** is a mathematical claim about biological self-organisation. It states that any system that stays in a non-equilibrium steady state (i.e., stays alive) must minimise an upper bound on surprise (variational free energy). This applies to cells, bacteria, and brains.
      *   **Predictive Processing (PP)** is a specific theory of *brain function* that uses the FEP as its mathematical engine. It claims the brain implements Bayesian inference via hierarchical prediction errors.
      *   **Active Inference** is the extension of PP to action.
  *   **Expert View:** An expert would wince here. You can accept PP without accepting the universal biological claims of FEP. Many cognitive scientists use the PP framework (hierarchical prediction errors) without buying into Friston's claim that this is a law of life equivalent to natural selection.

  ### 2. "The brain is a prediction machine organised as a hierarchy... higher levels send predictions down... lower levels send back only their prediction errors."
  *   **Verdict:** **Generally Accepted.**
  *   **The Nuance:** This is the standard architectural description of Hierarchical Predictive Processing. It is based on anatomical evidence (e.g., the asymmetry of forward and backward connections in the cortex).
  *   **Expert View:** Most researchers in this area accept this as the working model. The only caveat is that "prediction" is a metaphor for "probabilistic expectation," not necessarily a conscious prophecy.

  ### 3. "Friston wrapped this up as 'free energy', which is the same free energy as in thermodynamics."
  *   **Verdict:** **Technically Imprecise (The Wince).**
  *   **The Nuance:** This is a very common pop-sci simplification that annoys physicists.
      *   The "Free Energy" in FEP is **Variational Free Energy** from statistical physics and information theory (related to the Kullback-Leibler divergence).
      *   It is *analogous* to Thermodynamic Free Energy (Helmholtz/Gibbs), but they are not the *same thing*.
      *   The link is that biological systems must resist entropy (thermodynamics), and to do so, they must minimise uncertainty about their sensory states (information theory).
  *   **Expert View:** An expert would say, "It's variational free energy, which bounds surprise. The thermodynamic link is via non-equilibrium steady states, but don't tell a physicist they are identical."

  ### 4. "The brain's single job is to minimise prediction error... so the brain is literally trying to minimise how surprising the world is."
  *   **Verdict:** **Accepted (with a definition check).**
  *   **The Nuance:** "Surprise" here is **information theoretic surprise** (self-information: $-\log p(event)$), not emotional surprise.
  *   **Expert View:** Technically, the brain minimises *Free Energy*, which is an upper bound on surprise. Because calculating exact surprise is computationally intractable, the brain minimises the bound. But for a summary, "minimising surprise" is acceptable shorthand.

  ### 5. "The theory actually predicts that the ideal strategy is to lie down in a dark, silent room... and since nobody does that, the theory is pretty much refuted."
  *   **Verdict:** **The "Dark Room Problem" (Addressed, not Refuted).**
  *   **The Nuance:** This is the most famous objection to PP/FEP, and your friend presents it as a *reductio ad absurdum*. However, this objection only holds if you assume the brain only minimises *sensory* prediction error (perception).
      *   **The Solution:** **Active Inference.** The brain doesn't just change its predictions to match the world (perception); it changes the world to match its predictions (action).
      *   **Prior Preferences:** Crucially, the system has "prior preferences" encoded in its generative model (e.g., "I expect to be warm," "I expect to have food"). A dark room violates these priors (you would starve/get cold). Therefore, staying in a dark room generates massive prediction error regarding *homeostatic* states.
      *   **Expected Free Energy:** Agents minimise *expected* free energy into the future. This includes **Epistemic Value** (seeking information to reduce uncertainty) and **Pragmatic Value** (fulfilling preferences). A dark room has low epistemic value (nothing to learn) and low pragmatic value (you die).
  *   **Expert View:** This does not refute the theory; it highlights the necessity of including **prior preferences** and **active inference** in the model. If a model predicts the dark room, it is a *bad model*, not a refutation of the framework.

  ### 6. "Hallucinations and normal perception differ only in degree... implies you can never really tell whether you're perceiving or hallucinating."
  *   **Verdict:** **Accepted (Controlled Hallucination).**
  *   **The Nuance:** This is a core philosophical commitment of PP, often championed by Anil Seth ("The Beast Machine").
      *   **Mechanism:** Perception is a "best guess" based on priors + sensory data. Hallucination is the same mechanism but with **imprecise sensory weighting** (the brain trusts its priors too much relative to the sensory input).
      *   **Distinction:** You *can* tell the difference, usually, because in veridical perception, the sensory evidence is precise enough to constrain the priors. In psychosis or hallucination, the precision weighting is off.
  *   **Expert View:** Experts accept the "continuum" view. It doesn't mean reality is unknowable; it means the *mechanism* of access is the same. The difference is in the **precision estimation** (confidence) assigned to the error signals.

  ### 7. "What's left is just the old idea that the brain tests hypotheses... dressed up in fancy maths... an unfalsifiable framework."
  *   **Verdict:** **The "Falsifiability Critique" (Serious Debate).**
  *   **The Nuance:** This is the most serious philosophical objection (championed by critics like Colombo, Wright, and Bowers).
      *   **The Criticism:** Because you can always posit a "prior" or a "precision weight" to explain any behaviour post-hoc, the framework risks being a "just-so story." If a subject does $X$, they had a prior for $X$. If they do $Y$, they had a prior for $Y$.
      *   **The Defense:** Proponents argue FEP is a **Principle** (like Natural Selection), not a specific **Model**. Natural Selection is hard to falsify as a whole, but specific hypotheses (e.g., "this trait evolved due to sexual selection") are testable. Similarly, FEP provides the constraints within which specific, falsifiable computational models are built.
      *   **Current State:** There are concrete, falsifiable models (e.g., specific fMRI signatures of prediction errors in specific layers of the cortex). However, the *grand claim* that "all life minimises free energy" is indeed very hard to falsify.
  *   **Expert View:** This is a live wire in the field. A sophisticated researcher will admit that *some* applications of FEP are unfalsifiable storytelling, but will insist that *computational modelling* within the framework yields testable predictions.

  ---

  ### Summary: What follows from what?

  You asked specifically if the **Dark Room** and **Unfalsifiability** points follow from the accurate parts of her summary.

  1.  **The Dark Room Problem:** This **does not follow** from the accurate parts. It follows from an *incomplete* version of the theory (Passive Prediction Error Minimisation). Once you add **Active Inference** and **Prior Preferences** (which are part of the full FEP/Active Inference framework), the dark room prediction disappears. Your friend described a passive brain, not an active one.
  2.  **The Unfalsifiability Claim:** This **partially follows** from the "explain everything" nature of the framework, but it conflates the **Principle** with the **Models**. If you treat FEP as a universal law of biology, it is hard to falsify. If you treat it as a tool for building cognitive models (which is likely how you will use it in CogSci), it is falsifiable.

  ### Advice for your Course

  Since you are doing a Master's in Cognitive Science, here is how you should navigate this:

  1.  **Don't treat FEP as dogma.** It is a hegemonic framework, but it is contested. It is perfectly acceptable in essays to say, "While the Free Energy Principle offers a unifying mathematical account, critics argue that..."
  2.  **Focus on Precision Weighting.** If you want to understand the cognitive science applications (psychosis, autism, attention), focus on **Precision**. This is the mechanism that explains *why* we don't all hallucinate and *why* we don't sit in dark rooms (we value information).
  3.  **Distinguish PP from FEP.** Use "Predictive Processing" when talking about brain hierarchy and perception. Use "Free Energy Principle" only when talking about the mathematical justification or biological self-organisation.
  4.  **Read the Critics.** Read papers by **Colombo & Wright (2017)** on "First principles in the cognitive sciences" for the critique, and **Friston et al.** for the defense. This will give you the balance your friend's pop-sci summary lacks.

  Your friend gave you a "Steel Man" of the theory's architecture but a "Straw Man" of its implications. The theory is more robust against the Dark Room objection than she thinks, but the falsifiability critique is a genuine philosophical hurdle you should be aware of.
