answer: |-
  # Policy Draft: Neural Capacity-Based Protection Tiers

  ## Executive Summary: The Master Variable
  This procedure rejects **Absolute Brain Mass** and **Encephalization Quotient (EQ)** as the primary drivers for protection levels. Mass favors large mammals unfairly (penalizing birds); EQ measures cognitive deviation from a baseline, not necessarily capacity for suffering.

  **Selected Master Variable:** **Estimated Centralized Integrative Neuron Count (CINC).**
  *   **Definition:** The number of neurons located in central processing regions associated with sensory integration and affective state (e.g., mammalian pallium/cortex, avian nidopallium, cephalopod vertical lobe). It excludes peripheral ganglia used primarily for motor reflexes (e.g., octopus arm ganglia).
  *   **Rationale:** Suffering requires the integration of nociceptive signals into a coherent state. CINC correlates best with this capacity across divergent phylogenies. It corrects for the bird anomaly (high density) and the cephalopod anomaly (distributed system).
  *   **Implementation:** To ensure the procedure takes under one hour, the Committee will not calculate CINC live. The Attending Veterinarian (AV) will maintain a **Reference Tier List** (Appendix A) based on published neuroanatomical consensus. The Committee's job is to check the list, not do the math.

  ## Conceptual Distinctions Embedded in Procedure
  1.  **Nociception vs. Pain:** Nociception is reflex; Pain is experience. The threshold for protection is the developmental point where Pain is plausible, not just Nociception.
  2.  **Suffering vs. Intelligence:** This policy protects *welfare* (freedom from suffering), not *liberty* (cognitive rights). High intelligence matters only because it expands the *duration* and *complexity* of suffering (e.g., anticipation, memory), not because intelligence itself grants rights.
  3.  **Threshold vs. Scaling:** We adopt a **Threshold + Scaling** model. Below the threshold, only pain-free euthanasia is required. Above the threshold, protections scale across three Tiers (Low, Medium, High) based on CINC.

  ---

  ## Decision Procedure Table

  | Step | Question Asked | Evidence That Suffices | Default Rule if Evidence Missing | Verdict or Hand-off |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Is the organism a vertebrate or cephalopod at a life stage capable of independent feeding?** | Species typical developmental timeline; hatching/birth records. | **Assume Capable.** Treat as protected until proven otherwise. | If **No**: Exempt from policy (proceed with standard biosafety).<br>If **Yes**: Go to Step 2. |
  | **2** | **Is the species listed on the AV's Reference Tier List?** | AV's Appendix A (updated annually). | **Precautionary Escalation.** Assign to the next higher Tier until data is found. | If **Yes**: Note Tier (1, 2, or 3) and Go to Step 4.<br>If **No**: Go to Step 3. |
  | **3** | **Does the species possess a centralized integrative structure homologous or analogous to a pallium/vertical lobe?** | Published neuroanatomy (AV provides summary); Phylogenetic proximity to listed species. | **Assume Presence.** Classify as Tier 2 (Medium). | If **No**: Classify as Tier 1 (Low). Go to Step 4.<br>If **Yes**: Classify as Tier 2 (Medium). Go to Step 4. |
  | **4** | **Does the proposed protocol involve procedures reasonably expected to cause more than momentary pain/distress in a Tier 1 animal?** | Procedure description; Analgesia plan; Comparison to veterinary standards. | **Assume Yes.** Require full analgesia/anesthesia plan. | If **No**: Approve (Standard Care).<br>If **Yes**: Go to Step 5. |
  | **5** | **For Tier 2 or 3 animals: Does the scientific justification outweigh the increased moral cost of higher neural capacity?** | Written justification of why lower-capacity models cannot be used; Benefit analysis. | **Hand-off to Full Committee Vote.** Vet cannot sign off alone. | If **Justified**: Vet Signs.<br>If **Unjustified**: **Require Modification** or **Reject**. |

  **Tier Definitions (for Reference):**
  *   **Tier 1 (Low):** Fish larvae (<7 dpf), invertebrates (non-cephalopod). *Requirement: Anesthesia for euthanasia.*
  *   **Tier 2 (Medium):** Adult Fish, Birds, Rodents, Cephalopods. *Requirement: Analgesia + Anesthesia for invasive procedures.*
  *   **Tier 3 (High):** Primates, Cetaceans, Elephants, Pigs. *Requirement: Enhanced Environmental Enrichment + Post-Op Monitoring + Strict Necessity Justification.*

  ---

  ## Worked Applications

  ### Case 1: Octopus Learning Experiment
  *   **Protocol:** Operant conditioning involving mild electrical stimulus; proposes analgesia standard equivalent to zebrafish (Tier 1).
  *   **Procedure Run:**
      1.  **Life Stage:** Adult octopus. (Pass)
      2.  **Reference List:** AV adds Octopus (*Octopus vulgaris*) to Tier 2 based on vertical lobe neuron count (~40M central neurons, comparable to some mammals in processing density).
      3.  **Procedure Match:** Electrical stimulus exceeds "momentary pain."
      4.  **Tier Check:** Octopus is Tier 2. Protocol proposes Tier 1 care.
  *   **Verdict:** **Require Modification.** The protocol must be upgraded to Tier 2 standards (appropriate cephalopod anesthetics/analgesics, enriched housing).
  *   **The Unpopular Truth:** This will anger the neuroscience group. They have relied on octopuses *because* they were unregulated invertebrates. This policy explicitly acknowledges that distributed brains can still house high integrative capacity. The "brain size" (mass) argument would have failed here; the CINC argument catches it.

  ### Case 2: Zebrafish Larvae (5 Days Post-Fertilization)
  *   **Protocol:** High-throughput drug screen on 5 dpf larvae; lab claims "nervous system not yet there," seeks exemption.
  *   **Procedure Run:**
      1.  **Life Stage:** 5 dpf. Independent feeding begins approx. 5-7 dpf.
      2.  **Reference List:** Zebrafish listed. Larval threshold set at 7 dpf (consensus on nociceptor connectivity).
      3.  **Evidence:** Recent literature suggests functional nociception may exist at 5 dpf, though pain is debated.
      4.  **Default Rule:** Evidence is missing/contested regarding *pain* vs. *nociception*. Step 1 Default applies: **Assume Capable.**
  *   **Verdict:** **Require Modification.** Larvae cannot be exempted. Must use tricaine anesthesia for any noxious procedure, even if euthanasia follows.
  *   **Rationale:** The procedure prioritizes the "Precautionary Escalation" default. In the absence of consensus on the exact onset of sentience, the burden of proof is on the researcher to prove *insentience*, not on the committee to prove *sentience*.

  ### Case 3: Pig Surgical-Training Program
  *   **Protocol:** Veterinary residents practice abdominal suturing on anesthetized pigs. Member expects "wave through" because it is "training, not research."
  *   **Procedure Run:**
      1.  **Life Stage:** Adult pig. (Pass)
      2.  **Reference List:** Pig listed as **Tier 3 (High)** due to high CINC and documented complex emotional suffering.
      3.  **Procedure Match:** Invasive surgery.
      4.  **Step 5 Trigger:** Tier 3 animals require "Strict Necessity Justification."
      5.  **Justification Review:** The protocol states "Training is required." It does not demonstrate that high-fidelity simulators are insufficient.
  *   **Verdict:** **Reject / Hand-off to Vote.** The Vet cannot sign off. The Committee must vote. The recommendation is to deny unless the PI proves simulators are inadequate.
  *   **Rationale:** A Tier 3 classification raises the moral cost. "Training" is a valid use, but not a *blanket* exemption. The high neural capacity of the pig demands that we exhaust non-animal alternatives before accepting the moral cost of their use. The member expecting a wave-through is incorrect; the brain-based metric *increases* scrutiny on high-capacity mammals used for non-therapeutic ends.

  ---

  ## Procedure Limits and Misfires
  *   **The "Black Box" Problem:** The Committee relies on the AV's Reference List. If the AV is outdated, the policy fails.
  *   **Individual Variation:** This policy uses species-typical data. It cannot account for a specific animal that is brain-damaged or developmentally delayed.
  *   **The "Suffering" Proxy:** We assume CINC correlates with suffering. It is possible to have high processing power without affect (philosophical zombie), or low processing power with high affect. We accept this risk as the best available heuristic.
  *   **Administrative Drift:** Over time, the AV may move species to lower tiers to reduce workload. Annual external audit of the Reference List is required.

