answer: |-
  **The Conscience and the Crime: Reading *Oppenheimer* Against Anscombe**

  When Elizabeth Anscombe stood before the convocation at Oxford in 1956 to protest the awarding of an honorary degree to Harry Truman, she was not merely objecting to a diplomatic nicety. She was issuing a challenge to the very structure of modern moral reasoning. Her argument was stark and deontological: the bombing of Hiroshima and Nagasaki involved the deliberate killing of the innocent, which constitutes murder. Consequently, the man who ordered it was a murderer, and an institution that honoured him was complicit in a corruption of moral judgement that no appeal to political sophistication or utilitarian calculation could excuse. For Anscombe, the morality of the act was objective and intrinsic; it did not depend on the intentions of the agent, the pressure of the circumstances, or the subsequent feelings of remorse.

  Christopher Nolan's *Oppenheimer*, screened as the culmination of your seminar, presents a seemingly divergent project. It is not a trial of the act, but a biography of the agent. It is a study of J. Robert Oppenheimer's conscience: the guilt, the haunting, and the security hearing framed less as a legal proceeding than as a trial of his soul. As you have hunched, Anscombe would likely view this focus with deep suspicion. She might argue that by absorbing the audience in the inner drama of the scientist, the film risks replicating the very error of the Oxford ceremony: it directs our gaze toward the suffering of the powerful man rather than the justice of the deed performed upon the powerless. However, to dismiss the film as merely another exercise in 'great man' hagiography is to overlook how Nolan's formal choices dramatises moral realities that Anscombe's rigid categories struggle to encompass. While the film does not explicitly prosecute the war crime in Anscombe's terms, it ultimately vindicates her warning about moral corruption by illustrating how that corruption consumes the very architecture of the state and the psyche of the creator.

  It must be conceded that on the surface, the film validates Anscombe's critique of agent-centred ethics. Anscombe insisted that the question was never whether the man suffers or feels bad, but whether the act was murder. Nolan, conversely, traps us almost exclusively within Oppenheimer's subjective experience. We see the world through his eyes; we hear the rhythmic stomping of feet that signals his anxiety; we witness the atomic blast not as a historical event affecting a city, but as a sensory overload affecting a man. The security hearing, which dominates the latter half of the narrative, is concerned with loyalty, past communist associations, and personal rivalries, not the ethics of the bomb itself. Even the brief cameo by Truman serves to insulate the political decision-maker from the moral weight of the act. In their meeting, the President dismisses Oppenheimer's guilt, reminding him that the political leadership bears the burden of the decision, thereby reducing the scientist to a mere instrument. If Anscombe were to watch this, she might argue that the film allows Truman to evade the judgement she sought to impose, while elevating Oppenheimer's psychological torment into a substitute for actual justice.

  However, this reading strains when one considers what the film deliberately withholds. Anscombe's protest was linguistic and philosophical; she sought to correct the language used to describe the bombing. Nolan's method is phenomenological. Crucially, the film never shows Hiroshima. There is no footage of the mushroom cloud over the city, no shots of the victims, no reconstruction of the aftermath. The only time the destruction is visualised is during a victory rally in Los Alamos, where Oppenheimer delivers a speech to cheering colleagues. In this sequence, the sound of their stomping feet transforms into the roar of an explosion, and the face of a colleague morphs into the charred visage of a victim. This is not merely a depiction of guilt; it is a formal refusal to spectacle-ise the destruction. By denying the audience the visual consumption of the bombing, Nolan forces a confrontation with the *implication* of the blast rather than its imagery.

  This absence creates a moral vacuum that Anscombe's categories do not quite fill. Anscombe deals in certainties: the act was murder, the judgement is clear. But the film dramatises the uncertainty and the diffusion of responsibility that characterised the post-war reality. By 1954, the date of the security hearing, the question of responsibility had become genuinely diffuse. It was no longer just about Truman's order in 1945; it was about a scientific establishment, a military-industrial complex, and a political apparatus that had collectively normalised the existence of the weapon. Anscombe's framework is excellent for judging a completed act, but it is less equipped to handle an ongoing existential condition. The film shifts the focus from the guilt of the past to the terror of the future. The closing conversations between Oppenheimer and Einstein are not about whether Hiroshima was justified, but about whether the chain reaction has been started that will lead to mutual annihilation. Here, the film pushes beyond Anscombe's protest. She was concerned with the sin of the past; the film is concerned with the apocalypse of the future. In doing so, it suggests that the moral corruption Anscombe identified was not a static error, but a dynamic process that outgrew the men who initiated it.

  This brings us to the cheering crowd scene, which is perhaps the film's most potent rebuttal to the idea that it is merely absorbed in the agent's inner drama. When Oppenheimer hallucinates the burnt woman amidst the applauding scientists, Nolan is not just showing us a man feeling bad. He is indicting the crowd. The cheering represents the public and political celebration of the weapon, a celebration that Anscombe identified as a corruption of moral judgement. The film suggests that Nolan knows exactly what he is withholding. By juxtaposing the triumph of the scientific achievement with the horror of its application in the mind of the creator, the film exposes the hollowness of the victory. The Oxford ceremony honoured Truman because the West viewed the bombing as a necessary conclusion to the war. Nolan's crowd scene suggests that this view requires a deliberate blindness. Oppenheimer is the only one who sees the charred body in the room; everyone else sees only the saviour. In this sense, the film dramatises the social isolation of moral clarity. Anscombe stood alone in her protest at Oxford; Oppenheimer stands alone in his vision at Los Alamos. The film thus validates Anscombe's claim that the prevailing moral judgement was corrupted, but it adds a tragic dimension: those who perceive the corruption are powerless to stop the machinery they have built.

  Furthermore, the film explores the concept of 'promethean' responsibility in a way that strict deontology might miss. Anscombe's argument rests on the intention of the agent: Truman intended to kill civilians, therefore it was murder. But Oppenheimer's intention was to unlock the secrets of the atom; the killing was a consequence, albeit a foreseen one. The film grapples with the terrifying reality that one can create a force of destruction without necessarily intending its specific deployment, yet remain irrevocably bound to it. This is the 'diffuse responsibility' of the modern age. The film suggests that by 1954, Oppenheimer was no longer just a man who felt guilty about 1945; he was a man realising he had become 'Death, the destroyer of worlds'. This shift from guilt to a future of mutual annihilation changes the ethical landscape. It is no longer about assigning blame for a past murder, but about managing a present poison. Anscombe's protest was a call to repentance and correction. The film suggests that for the nuclear age, correction is impossible; there is only management and the hope of survival. This is a more pessimistic view than Anscombe's, but it does not necessarily contradict her. One could argue that the impossibility of correction proves the magnitude of the initial sin she identified.

  Does the film, then, let the agents off the hook? In one sense, yes. It does not explicitly label the bombing a war crime, and it centres the narrative on the white male genius, marginalising the victims just as history has done. Anscombe would be right to demand a more direct confrontation with the objective evil of the act. However, the film partially vindicates her by demonstrating that the 'sophistication' she despised—the utilitarian calculus that excuses the killing of innocents for the greater good—leads inevitably to spiritual and political ruin. The security hearing destroys Oppenheimer not because he is a spy, but because he is a conscience. The state, represented by Lewis Strauss, cannot tolerate a man who embodies the moral ambiguity of the weapon. In destroying Oppenheimer, the state attempts to silence the very reminder of the moral corruption Anscombe spoke of.

  Ultimately, *Oppenheimer* and Anscombe's protest are engaged in the same project from different angles. Anscombe sought to protect the integrity of moral language from the corrosion of political expediency. Nolan seeks to protect the integrity of human experience from the abstraction of historical narrative. Anscombe would argue that the film's focus on Oppenheimer's soul is a distraction from the blood on Truman's hands. Yet, the film suggests that the blood on Truman's hands is precisely what haunts Oppenheimer's soul. The 'trial of the soul' is not a substitute for the judgement of the act; it is the inevitable consequence of it. The film concludes not with a resolution of guilt, but with the image of a world burning. This suggests that the moral corruption Anscombe identified in 1956 was not an anomaly, but the founding principle of the new world order.

  In conclusion, while the film does not adopt Anscombe's philosophical rigour, it dramatises the human cost of ignoring it. It shows that when a society honours the man who ordered the murder of the innocent, it does not merely make a category error; it creates a world where the creators of destruction are haunted by visions of the charred dead amidst the applause of the living. Anscombe was right that the act was the primary moral object, but Nolan is right that the act cannot be separated from the conscience that birthed it and the world that sustains it. The film does not excuse the deed, but it warns us that the deed has excised the possibility of innocence for everyone involved. In this, it serves as a powerful, if cinematic, companion to Anscombe's protest: a reminder that the honouring of such power comes at the price of the human soul.
