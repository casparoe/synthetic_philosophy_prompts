prompt: |-
  After a career in condensed matter physics, I have spent my retirement reading philosophy of science, and I have hit a puzzle about the norms of my old profession that I cannot resolve on my own. The community I came from celebrates Einstein's explanation of the anomalous advance of Mercury's perihelion — a discrepancy known since Le Verrier in 1859, sitting in the textbooks for half a century before 1915 — as among the strongest supports general relativity ever received, and it still counts in the theory's favor in every retrospective assessment I know of. Yet the same community, along with the statisticians and machine-learning practitioners who now dominate the funding agencies, treats data that was available while a hypothesis was being built as unable to confirm it: hence the near-sacred status of the train/test split, the disdain for post-hoc curve fitting, and the premium placed on genuinely novel predictions. So the profession both prizes a retrodiction of fifty-year-old data and legislates against counting old data as confirmatory. What view of evidence does this double practice presuppose, if any? I gather philosophers call the general issue the problem of old evidence, and I can see the crude worry myself: if I already gave Mercury's behavior probability one, then conditioning on it should leave my credences untouched. But I would like the implicit epistemology reconstructed honestly — say whether the two halves of the practice actually conflict or whether they only seem to, given different things "confirm" might mean; say whether the practice strictly requires one account of evidence or is compatible with several, including non-Bayesian ones; and tell me what would have to change in how physicists and statisticians go about their business if we replaced the implicit view with a straightforwardly probabilistic one — for instance, whether the train/test distinction would lose its point, and whether anyone would still have a reason to run a new experiment rather than squeeze confirmation out of the data we already have.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Query:**
      *   **User Persona:** Retired condensed matter physicist, well-read in philosophy of science (knows the term "problem of old evidence"), critical thinker, notices a tension between historical practice in physics (Mercury/GR) and modern methodological norms (train/test splits, novel predictions).
      *   **Core Question:** How do we reconcile the celebration of Einstein's retrodiction of Mercury's perihelion (old evidence) with the modern insistence on novel predictions/train-test splits (new evidence)?
      *   **Specific Requests:**
          1.  Reconstruct the implicit epistemology honestly.
          2.  Determine if the two halves of the practice actually conflict or just seem to (semantic ambiguity of "confirm").
          3.  Assess compatibility with accounts of evidence (Bayesian vs. non-Bayesian).
          4.  Explain what would change if we adopted a "straightforwardly probabilistic" view (would train/test lose point? would new experiments matter?).

  2.  **Deconstruct the Tension (The "Problem of Old Evidence"):**
      *   *The Mercury Case:* Einstein didn't tune GR to fit Mercury. He derived the field equations from general principles (equivalence principle, general covariance). The calculation of the perihelion shift was a *consequence* derived *after* the theory was essentially formulated, even though the data existed since 1859.
      *   *The Train/Test Case:* In ML/Statistics, if you tune parameters to fit the training data, you overfit. You need unseen data to verify generalizability. Using old data to *construct* the hypothesis invalidates it as a test.
      *   *The Conflict:* Why is Mercury (old data) good, but fitting old data (in ML) bad?
      *   *The Resolution:* It hinges on *independence* of theory construction from the specific data point, not the *temporal age* of the data.

  3.  **Address the Specific Requests:**

      *   **1. Implicit Epistemology:**
          *   It's not about *when* the data was collected. It's about *how* the theory was generated relative to that data.
          *   Key distinction: **Accommodation vs. Prediction.** But refined: **Use vs. Mention.** Was the data *used* to build the model?
          *   In GR: The field equations were motivated by symmetry/principle, not by tweaking parameters to match Le Verrier's number. The number was a *check*.
          *   In ML: The weights are adjusted *to minimize error on the training set*. The training set is *used* to build the model.
          *   So the norm is: **Independence of Construction.**

      *   **2. Conflict or Semantic Ambiguity?**
          *   They seem to conflict if you define "old evidence" purely temporally.
          *   They don't conflict if you define "confirmation" structurally (degree of freedom tuning).
          *   "Confirm" means different things in the two contexts if one ignores the construction history. But properly understood, the norm is consistent: *Severe Testing* (Mayo) or *Independence* (Worrall).

      *   **3. Compatibility with Accounts of Evidence:**
          *   *Naive Bayesianism:* Struggles here (the "Problem of Old Evidence" as formally stated by Glymour). If $P(E) = 1$, then $P(H|E) = P(H)$. No confirmation.
          *   *Counterfactual Bayesianism:* What if we *didn't* know E? (Garber's solution).
          *   *Likelihoodism:* $P(E|H)$ vs $P(E|H')$. Still tricky with old evidence.
          *   *Error Statistics (Mayo):* Focuses on the *process*. Did the procedure have a high capacity to detect errors? If you fit the data, you bypass the error-detecting capacity. If you derive it from principles without fitting, the test is severe. This fits the physicist's intuition best.
          *   *Predictivism:* Novelty matters, but "use-novelty" is the real criterion.

      *   **4. What if we switched to a "Straightforwardly Probabilistic" View?**
          *   If we treat all data as just updating priors (ignoring construction history):
          *   Train/Test would lose its point *if* we trusted our priors on model complexity perfectly. But we don't. We use Train/Test to penalize complexity/overfitting implicitly.
          *   New experiments would still matter because old data is often noisy, biased, or limited in scope (domain shift).
          *   However, a pure Bayesian might say "Just update on everything." But computational limits and the risk of "double counting" (using data to set priors and then update) make the distinction practical.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Respectful, collegial (physicist to physicist), philosophically precise but accessible.
      *   *Structure:*
          1.  Acknowledge the depth of the puzzle (Glymour's Problem of Old Evidence).
          2.  Distinguish Temporal Novelty vs. Use-Novelty. This is the crux.
          3.  Analyze the Mercury case: Einstein didn't *fit* parameters.
          4.  Analyze the ML case: The algorithm *minimizes loss* on training data.
          5.  Synthesize the Implicit Epistemology: Severe Testing / Independence.
          6.  Address the Bayesian/Probabilistic question: Why naive Bayes fails here, and what a sophisticated view implies for practice.
          7.  Conclusion: The norms are consistent, just often poorly articulated.

      *   *Refining the Mercury Point:* It is crucial to note that Einstein *knew* about the anomaly. But he didn't put a fudge factor in the equations to fix it. The 43 arcseconds/century fell out of the $R_{\mu\nu} = 0$ (roughly) structure.
      *   *Refining the ML Point:* The "training" is literally an optimization process *targeting* that data.
      *   *Philosophical References:* Glymour (Old Evidence), Mayo (Error Statistics), Worrall (Use-Novelty), Zahar (Heuristics).
      *   *The "Straightforwardly Probabilistic" Trap:* If we just say "probability is all that matters," we lose the ability to penalize *ad hoc* adjustments unless we encode them in the prior. But encoding "ad hoc-ness" in a prior is hard. Hence, procedural norms (train/test) act as proxies for prior penalties on complexity.

  5.  **Final Polish:**
      *   Ensure the distinction between *temporal* novelty and *use* novelty is clear.
      *   Make sure the answer to "would train/test lose its point" is nuanced (No, because of overfitting risks which map to prior complexity).
      *   Check that the "Problem of Old Evidence" is addressed specifically (Glymour's challenge).

  6.  *(Self-Correction during drafting)*: I should be careful not to say physicists *never* fit parameters to old data. They do. But they distinguish between *fixing constants* (like G) and *explaining anomalies*. In GR, there were no free parameters adjusted to fit Mercury. In ML, weights are free parameters adjusted to fit training data. That's the key difference.

  7.  *(Final check against user prompt)*: Did I answer all parts?
      *   Reconstruct implicit epistemology? Yes (Use-Novelty/Severity).
      *   Conflict or semantic? Yes (Semantic/Structural, not temporal).
      *   Compatible with which accounts? Yes (Error Stat > Naive Bayesian).
      *   What changes with probabilistic view? Yes (Train/Test remains as complexity penalty proxy).

  8.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a superb question that cuts to the heart of scientific methodology. You have identified what philosophers call **Glymour's Problem of Old Evidence**, but you have rightly noticed that the *practice* of physics seems to have solved it pragmatically, even if the *theory* of confirmation struggles to articulate why.

  The short answer is that the apparent conflict arises from conflating **temporal novelty** (when the data was collected) with **use-novelty** (whether the data was used to construct the hypothesis). The implicit epistemology of your profession is not strictly Bayesian in the naive sense; it is closer to what Deborah Mayo calls **Error Statistics** or what John Worrall calls **Use-Novelty**.

  Here is a reconstruction of the implicit epistemology, an analysis of the conflict, and an assessment of what would happen if we shifted to a strictly probabilistic framework.

  ### 1. The Implicit Epistemology: Use-Novelty, Not Temporal Novelty

  The community does not actually hold contradictory norms. It holds a single norm that is often misdescribed. The norm is: **Data cannot confirm a hypothesis if the hypothesis was tuned to fit that data.**

  *   **The Mercury Case:** Einstein knew about the 43 arcseconds per century discrepancy. However, he did not introduce a parameter into General Relativity (GR) to fit it. The field equations were derived from general principles (general covariance, equivalence principle). The calculation of the perihelion shift was a *derivation* from the finished theory, not a *fitting* of the theory to the data. The data was "old" temporally, but it was "new" with respect to the *construction* of the theory.
  *   **The Train/Test Case:** In machine learning, the "training" phase is explicitly an optimization process where model parameters (weights) are adjusted to minimize error on that specific dataset. The data is *used* to build the model. Therefore, it cannot be used to *test* the model's generalizability.

  **The Reconstruction:**
  The implicit view is that confirmation measures the **severity of the test**, not merely the probabilistic update. A test is severe if it would likely have failed had the hypothesis been false.
  *   If you tune a model to data (ML training), the model *could not have failed* to fit that data (within convergence limits). The test has zero severity.
  *   If you derive a consequence from principles without tuning (Einstein), the theory *could have failed* to match the number. The test has high severity.

  Therefore, the two halves of the practice do not conflict. They only seem to conflict if one assumes the norm is "Data must be temporally new." The actual norm is "Data must be independent of the model-building process."

  ### 2. Compatibility with Accounts of Evidence

  You asked whether this practice requires a specific account of evidence.

  **Naive Bayesianism (The Struggle):**
  As you noted, standard Bayesianism struggles here. If $P(E) = 1$ (because we already know Mercury's orbit), then $P(H|E) = P(H) \times P(E|H) / P(E) = P(H)$. The posterior equals the prior. Formally, old evidence cannot confirm. To save Bayesianism, philosophers like Daniel Garber proposed **counterfactual Bayesianism**: we must evaluate the probability of $H$ given $E$ in a state where we know the logical connection between $H$ and $E$ but do not yet know $E$. This is cognitively demanding and doesn't map well to how physicists actually reason.

  **Error Statistics / Severe Testing (The Fit):**
  This aligns best with the physicist's intuition. Mayo's framework argues that evidence $E$ confirms $H$ only if $E$ is the result of a procedure that would likely have produced a discordant result if $H$ were false.
  *   In ML, using training data as test data violates this because the procedure (gradient descent) guarantees a fit.
  *   In GR, the procedure (deriving geodesics from the metric) did not guarantee a fit. The 43 arcseconds could have been 10 or 100.
  This view handles the "old evidence" easily: the age of the data is irrelevant; the *provenance* of the fit is what matters.

  **Likelihoodism:**
  A likelihoodist would compare $P(E|H_{GR})$ to $P(E|H_{Newton})$. Since $P(E|H_{GR}) \gg P(E|H_{Newton})$, the data supports GR. This works for Mercury but struggles to explain why we shouldn't just fit a high-degree polynomial to the training data in ML (which would also yield high likelihood). Likelihoodism needs a penalty for complexity (like BIC/AIC) to replicate the train/test norm, which effectively reintroduces the "independence" constraint.

  ### 3. What If We Adopted a "Straightforwardly Probabilistic" View?

  Suppose we swept the procedural norms aside and adopted a pure, subjective Bayesian view where all that matters is the updating of credences based on logical relations, regardless of data provenance. What would change?

  **A. The Train/Test Distinction Would Not Lose Its Point**
  Even in a Bayesian framework, the train/test split remains vital, but its justification shifts from "confirmation" to **overfitting prevention via priors**.
  *   In pure Bayesian model selection, we compare the *marginal likelihood* (evidence), which integrates over all possible parameter values. This naturally penalizes overly complex models (Occam's razor).
  *   However, computing marginal likelihoods is often intractable in high-dimensional ML.
  *   The train/test split is a **computational shortcut** for Bayesian model comparison. It empirically estimates the generalization error that the marginal likelihood would theoretically penalize.
  *   *Conclusion:* If we were perfect Bayesians with infinite compute and perfect priors on model complexity, we wouldn't need test sets. But since we are bounded agents, the procedural norm (train/test) acts as a proxy for the probabilistic norm (penalizing complexity).

  **B. We Would Still Run New Experiments**
  You asked if anyone would have reason to run a new experiment rather than squeezing confirmation out of old data. The answer is **yes**, for three reasons that survive even in a probabilistic framework:

  1.  **Systematic Error (Bias):** Old data is often "dirty." Le Verrier's data was observational, subject to instrument bias. New experiments allow for better control of nuisance parameters. In probabilistic terms, new experiments reduce the uncertainty in the likelihood function $P(E|H)$.
  2.  **Domain Shift:** Old data covers a specific regime. GR was tested on Mercury (weak field, slow motion). We test it now on black holes (strong field) and gravitational waves (dynamic). A probabilistic agent knows that $P(H|E_{old})$ does not imply high confidence in $H$'s predictions for $E_{new}$ if the theory is not yet fully constrained.
  3.  **The "Rigidity" of Old Data:** In the Mercury case, the data was fixed. If Einstein had been wrong, he could have tweaked the theory (e.g., added a cosmological constant, though he did that for other reasons) and re-calculated. With new data, the theory must commit *before* the number is known. This restricts the "degrees of freedom" in the hypothesis space. A probabilistic agent values this because it prevents the hypothesis space from expanding to fit the data post-hoc.

  ### 4. Summary of the Resolution

  The tension you feel is real, but it is a tension between **folk methodology** (which talks about "prediction" vs. "accommodation") and **actual methodology** (which cares about "independence of construction").

  1.  **The Norm:** The profession presupposes a **Use-Novelty** account of evidence, not a Temporal-Novelty account. Data confirms a theory only if the theory was not built to fit it.
  2.  **The Conflict:** There is no conflict between the Mercury case and the Train/Test case. In both, the question is: *Were the degrees of freedom in the model adjusted to minimize error on this specific data?* For Mercury/GR: No. For ML Training: Yes.
  3.  **The Epistemology:** The practice is most honestly reconstructed via **Error Statistics** (Severity) rather than Naive Bayesianism. It protects against **ad hoc-ness**.
  4.  **The Probabilistic Shift:** If we moved to a strict probabilistic view, we would not discard train/test splits or new experiments. We would simply re-describe them. Train/test becomes a proxy for integrating over parameter space (marginal likelihood). New experiments become necessary to constrain the likelihood function in new regimes and to prevent the "prior" from becoming too flexible (i.e., preventing the theorist from adding epicycles after seeing the data).

  **The Honest Verdict:**
  Physicists celebrate Einstein not because he predicted something *new in time*, but because he predicted something *new in theory*. He risked falsification on a number he did not touch. Statisticians disdain training-data evaluation because the model *touched* the number. The norm is consistent: **Don't let the theory touch the data before the test.** The confusion arises only when we mistake the *date* of the data for the *contact* with the data.
