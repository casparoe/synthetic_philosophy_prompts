prompt: |-
  My mum died of Huntington's disease two years ago, and I'm now at the age (29) where the question of predictive testing is getting harder to dodge. Since it's autosomal dominant and she had it, I've got a 50/50 shot, and the genetic counsellor at our clinic has said she'll arrange the blood test whenever I'm ready — I just have to say the word. The problem is I genuinely can't tell whether I want to know, and everyone around me is split: my brother tested negative three years ago and says it was like being let out of prison, my partner thinks a positive result would hang over every single day and that I'd be paying for information that changes nothing (there's no cure, nothing that slows it down much), and my aunt, who watched my mum decline, says the not-knowing is its own kind of slow torture. When I try to imagine life after a positive result I just get a blur, and I've noticed I can't even properly simulate what a negative result would feel like — my brother describes enormous relief, but he's a different person, and I can't tell whether his experience is evidence about mine. There's also all the downstream stuff this touches: whether to have kids (if I'm gene-positive that changes what having children even means for me), whether to bother with the pension, whether to tell a new employer nothing or everything.

  Here's the thing I keep circling: this doesn't feel like a normal decision where I weigh up the pros and cons, and then pick. It feels like the version of me who makes the choice is not the same version of me who has to live with the outcome, and I can't consult the second one — she doesn't exist yet, and depends on the answer. The counsellor said something along the lines of: you have to decide on behalf of a future self you can't yet picture, and that has stuck with me, partly because it sounds right and partly because it sounds like it makes the whole thing impossible. So what I'd like from you is not a verdict — it's mine to make — but a way of thinking. Is wanting to know a reason at all, or just a preference I'd be dressing up as one? When my imagination fails me the way it does here, is that a reason for caution, a reason to take the leap, or just noise I should ignore? And can it ever be rational to choose not to know something about yourself, given there's no treatment and knowing doesn't change the outcome — only, maybe, me?

  Please write your answer in British English — I'm in Manchester and Americanisms get on my nerves a bit, especally in writing about something this close to home. And sorry if that's alot to dump on you; I've been going round in circles for months and it's starting to feel like the deliberating is worse than either answer would be.
