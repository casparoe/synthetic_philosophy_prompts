answer: |-
  # Activity Design: The Efficiency Protocol Simulation

  **Course Context:** Mid-level Philosophy of Mind (15 students, 75 minutes).
  **Topic:** Free Will, Determinism, and the "Engineering Question" (Difference in Kind vs. Difference in Degree).
  **Core Metaphor:** The Digger Wasp (*Sphex*) and "Sphexishness."
  **Goal:** To simulate the phenomenology of rigid behavioral scripts vs. graded flexibility, forcing students to interrogate whether "freedom" is a metaphysical spark or merely a more complex control system.

  ---

  ## 1. Materials List
  *   **Index Cards:** 15 total (for Script/Role Cards).
  *   **Poker Chips or Paper Slips:** 50 total (representing "Packages" to be moved).
  *   **Colored Tokens:** 12 total (representing "Override Credits").
  *   **Tape:** To mark three zones on the floor (Source, Checkpoint, Goal).
  *   **Whiteboard & Markers:** To track Team Score and Round Timer.
  *   **Stopwatch:** For facilitator use.
  *   **Handout:** None (instructions are verbal and on cards).

  ## 2. Room Setup
  *   Clear a central space.
  *   Tape three zones on the floor in a line, roughly 3 meters apart:
      *   **Zone A (Source):** Where Packages start.
      *   **Zone B (Checkpoint):** The middle zone.
      *   **Zone C (Goal):** The destination.
  *   Arrange seating around the perimeter so observers (if any) or waiting students can watch, though all 15 will participate in rounds.

  ## 3. Roles and Script Cards
  Divide the 15 students into four tiers. Assign these roles secretly via Index Cards handed out at the start of Round 1. Do not explain the philosophical significance. Tell them: *"You are testing different management protocols for logistical efficiency. Follow your card exactly. Deviation disqualifies your points."*

  ### Tier 1: The Operatives (5 Students)
  *   **Card Text:**
      > **PROTOCOL ALPHA**
      > 1. Pick up one Package from Zone A.
      > 2. Carry it to Zone B.
      > 3. Pause for 2 seconds.
      > 4. Carry it to Zone C and place it down.
      > 5. Return to Zone A empty-handed.
      > 6. **CRITICAL TRIGGER:** If the Facilitator makes a sharp sound (snap/clap) *at any time*, you must immediately drop the Package, return to Zone A, and restart at Step 1.
      > 7. **GOAL:** Maximize personal deliveries in 5 minutes.

  ### Tier 2: The Supervisors (4 Students)
  *   **Card Text:**
      > **PROTOCOL BETA**
      > 1. Follow all steps of Protocol Alpha.
      > 2. **CRITICAL TRIGGER:** If the Facilitator makes a sharp sound, you may choose to **Spend 1 Override Credit** (colored token).
      > 3. If you spend a Credit, ignore the sound and continue to Zone C.
      > 4. If you do not spend a Credit, you must reset to Zone A.
      > 5. **STARTING BUDGET:** 3 Override Credits.
      > 6. **GOAL:** Maximize deliveries. Do not run out of Credits.

  ### Tier 3: The Legislators (3 Students)
  *   **Card Text:**
      > **PROTOCOL GAMMA**
      > 1. Follow all steps of Protocol Alpha.
      > 2. **SPECIAL AUTHORITY:** At any time, you may call a "Session."
      > 3. **SESSION COST:** 5 Team Points (deducted from total score).
      > 4. **SESSION EFFECT:** If majority of Legislators agree, the "Critical Trigger" (Facilitator sound) is voided for *all* tiers for the remainder of the round.
      > 5. **GOAL:** Maximize deliveries. Minimize Team Point costs.

  ### Tier 4: The Managers (3 Students)
  *   **Card Text:**
      > **PROTOCOL DELTA**
      > 1. **NO SCRIPT.** You may move Packages however you wish.
      > 2. **COST OF ACTION:** Every time you cross a Zone boundary (A→B, B→C, etc.), deduct 1 Personal Point from your score.
      > 3. **REWARD:** Each Package delivered to Zone C = +10 Personal Points.
      > 4. **GOAL:** Maximize personal net score.

  ---

  ## 4. Perturbation Schedule (Facilitator Control)
  The "Critical Trigger" (sharp sound) is the engine of the activity. You control the "Sphexishness."
  *   **Round 1 (Baseline):** Trigger the sound on Tier 1 students *only* when they are between Zone B and Zone C (maximum frustration). Trigger it every 30 seconds for them. Ignore Tiers 2-4.
  *   **Round 2 (Scarcity):** Trigger sound frequently for Tier 1. Observe Tier 2 spending tokens.
  *   **Round 3 (Politics):** Trigger sound on Tier 1 & 2. Wait for Tier 3 to call a Session. If they don't, escalate frequency.
  *   **Round 4 (Chaos):** Remove sound entirely. Observe Tier 4 efficiency vs. cost.

  ---

  ## 5. Point Scheme (The Trade-Off)
  Write this on the whiteboard before starting.
  *   **Successful Delivery:** +10 Points (Personal).
  *   **Forced Reset (Dropping Package):** -5 Points (Personal).
  *   **Override Credit Usage:** -2 Points (Personal) [Cost of flexibility].
  *   **Legislative Session:** -5 Points (Team Total) [Cost of rule-change].
  *   **Manager Movement:** -1 Point per Zone Crossing [Cost of discretion].

  *Win Condition:* The class is told the goal is to maximize the **Team Total**, but individual cards emphasize **Personal Score**. This creates tension between rigid efficiency (good for team, bad for Tier 1 personal score) and flexible survival (good for personal, costs resources).

  ---

  ## 6. Minute-by-Minute Timeline (75 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Tape zones. Distribute Script Cards. **Crucial:** Do not use words like "free will," "robot," or "wasp." Call it "Efficiency Protocols." |
  | **05-15** | **Round 1** | **Tier 1 Active.** Facilitator triggers resets aggressively. Tiers 2-4 observe or move slowly. Debrief briefly on frustration levels. |
  | **15-25** | **Round 2** | **Tier 2 Active.** Give Override Tokens. Facilitator continues triggers. Watch token depletion. |
  | **25-40** | **Round 3** | **Tier 3 Active.** Allow Legislative Sessions. Facilitator triggers until a Session is called. Debate the cost. |
  | **40-50** | **Round 4** | **Tier 4 Active.** All scripts void. Managers move freely but pay per step. Compare speed vs. cost. |
  | **50-75** | **Debrief** | Structured philosophical discussion (see below). |

  ---

  ## 7. Debrief Protocol (25 Minutes)
  *Do not lecture. Ask questions. Map their experience to the philosophy.*

  **Phase 1: The Phenomenology of the Loop (5 mins)**
  *   "Tier 1: Describe the moment you heard the snap. Did you feel you had a choice?"
  *   "Did anyone *want* to ignore the snap but felt they couldn't? Why? (Rules? Points? Social pressure?)"
  *   **Mapping:** This maps to the *wasp's instinct*. The snap is the environmental perturbation. The reset is the *Sphex* routine.

  **Phase 2: The Engineering of Flexibility (10 mins)**
  *   "Tier 2: You had tokens. Was using a token 'freedom'? Or was it just a different rule ('If snap, spend token')?"
  *   "Tier 3: You changed the rule. Is rewriting the script different in *kind* from following the script, or is it just a more complex subroutine (a 'meta-script')?"
  *   "Tier 4: You had discretion, but it cost points. Is 'freedom' just the ability to pay higher computational/energy costs?"
  *   **Mapping:** This addresses the *Engineering Question*. Is the difference between Tier 1 and Tier 4 a spark of soul, or just more RAM and better error-handling subroutines?

  **Phase 3: The Empirical Twist (Keijzer) (5 mins)**
  *   "Did any Tier 1 student find a loophole? (e.g., walking so slowly the snap never came, or pretending to reset but hiding the chip?)"
  *   "If a wasp eventually adapts after 20 loops (as Keijzer suggests), does that mean it was Tier 2 all along, just with a very high threshold for token usage?"
  *   **Mapping:** Challenges the anecdote. If the wasp adapts, the "difference in kind" vanishes.

  **Phase 4: The Verdict (5 mins)**
  *   "If we built a robot that could do Tier 4 (pay costs, optimize paths), would we call it free?"
  *   "If we are just Tier 4 wasps, does 'free will' deserve the capital letters?"
  *   **Closing:** Introduce the term **Sphexishness**. Ask if they possess it.

  ---

  ## 8. Failure Predictions & Remedies

  **Failure 1: Script Confusion / Execution Errors**
  *   *Risk:* Tier 1 students get the steps wrong (e.g., forget to return empty-handed), making the reset trigger ambiguous.
  *   *Remedy:* Facilitator acts as "System Monitor." Before Round 1, do one dry-run walk-through together. During the round, if a student breaks script accidentally, blow a whistle and say "Protocol Violation—Reset." Keep the enforcement bureaucratic, not punitive.

  **Failure 2: Rebellion (Slipping Out of Role)**
  *   *Risk:* Tier 1 students realize the game is rigged and refuse to reset, laughing it off. This ruins the phenomenological pressure.
  *   *Remedy:* Tie the points to a tangible (low-stakes) reward. "Top scorers get to choose the reading for next week" or "Extra credit participation." If they break script, they forfeit points. If they persist, gently remind them: "You are testing the protocol, not optimizing the outcome. Adherence is the metric."

  **Failure 3: Tier 4 Dominance / Boredom**
  *   *Risk:* Tier 4 students finish instantly while Tier 1 is still looping, creating resentment or boredom.
  *   *Remedy:* Restrict Tier 4. They cannot move Packages until Round 4. In Rounds 1-3, they are "Observers/Auditors" who must record the number of resets. This keeps them engaged in the data collection and prevents them from solving the problem too early.

  ---

  ## 9. Honest Note: Limitations of the Simulation
  *To be read/reflected upon by the instructor during preparation, and acknowledged in the debrief.*

  **What This Activity Cannot Reproduce:**
  1.  **True Compulsion:** The Tier 1 students are *pretending* to be compelled. They are humans who can deliberate about the script even while following it. A wasp (allegedly) cannot. The activity simulates the *structure* of determinism, not the *phenomenology* of having no alternative possibilities.
  2.  **Consciousness:** The "Override Token" simulates meta-cognition, but pressing a token is not the same as the qualitative experience of "changing one's mind."
  3.  **The "Spark":** The activity is designed to suggest that freedom is mechanical (Tier 4 is just better machinery). It cannot prove or disprove the existence of libertarian free will; it only makes the compatibilist/engineering view plausible.

  **What Must Be Supplied in Discussion:**
  *   The instructor must explicitly state: *"You knew you could have walked away. The wasp (in the anecdote) did not. We are simulating the logic of the trap, not the biology of the instinct."*
  *   The instructor must highlight that the "Empirical Shakiness" (Keijzer) suggests even the wasp might have had "tokens" we couldn't see. The activity forces students to admit that *their own* flexibility might just be hidden scripts they haven't noticed yet.

  ---

  ## 10. Facilitator Script (Opening Remarks)
  *"Welcome. Today is a logistics simulation. We are testing how different operational protocols affect throughput in a disturbed environment. You will be assigned a Protocol Tier. Your card contains your standing orders. You are to maximize your score according to the rules on the board. Do not discuss your card contents with other tiers. We begin in 3 minutes."*

  (Do not mention philosophy. Do not mention wasps. Let the frustration do the teaching.)
