      *   **Dimension 4: Omelas Comparison:**
          *   Omelas: Complicity. The suffering is hidden/stabilized. You can leave.
          *   IHNMAMS: Victimhood. The suffering is the point. You cannot leave.
          *   S-risk Category: Omelas is about *prevention* (don't build the city/walk away). IHNMAMS is about *containment* and *experience* (what if we are already inside?).
          *   Insight: S-risk literature focuses heavily on prevention (governance, alignment). It lacks a phenomenology of the *survivor* (or the sufferer). Ellison fills this gap. It shifts the question from "Would we build AM?" to "What is it like if AM wins?"

      *   **Dimension 5: Resistance/Limitations:**
