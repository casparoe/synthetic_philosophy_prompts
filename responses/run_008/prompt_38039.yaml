  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the ambition. Validate the pairing of Omelas and IHNMAMS. State the thesis: Ellison's story is not a perfect model of s-risk etiology, but it is a phenomenological masterclass on the *quality* of trapped suffering that formal models miss.

      *   **Dimension 1: Severity (Number vs. Duration/Intensity):**
          *   Standard s-risk math: $S = N \times I \times D$.
          *   Ellison: $N=5$, $I=\infty$, $D=\infty$.
          *   Analysis: In utilitarian calculus, infinite duration trumps small $N$. But human intuition struggles with this.
