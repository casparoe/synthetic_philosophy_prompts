answer: |-
  Ten years ago, my grandmother stood where I stand now. She told us that guilt is not a heirloom you find in a attic trunk, something to be worn or hidden. She argued then, using the philosophy she kept on her desk until the end, that we must distinguish between what we did and what we inherit. She died last year, and this room feels different without her sharp eyes scanning us for intellectual honesty. But the question remains, and it falls to me to answer it: does the past still bind us?

  My answer is yes, but not in the way you might fear.

  I know some of you, especially the youngest here, view this gathering as a ritual of shame. You hear the date—April 1945, the day American troops reached this town—and you feel a weight that isn't yours. You are right to resent that. If this ceremony is about blaming you for crimes committed before you were born, then it is unjust, and you should leave. I am not here to ask you to carry a burden that belongs to the dead.

  To understand what we owe, we have to be precise about what we don't owe. My grandmother relied on a specific map of responsibility to navigate this, and I will use it too, though I will simplify it for us all. We need to distinguish three specific types of accountability. First, **criminal guilt is simply breaking the law.** That belongs to the individuals who signed the orders or drove the trucks. Second, **political guilt is what citizens share for what their state does.** That belonged to the German citizens of the Third Reich who allowed the machinery to run. Third, **metaphysical guilt is the shame of surviving when others were destroyed.** This is the hardest one, because it touches on our shared humanity rather than our actions.

  There was a fourth category my grandmother discussed, moral guilt, which is the private failure of conscience. I mention it only to say that it belongs strictly to the individual soul.

  Here is the line we must draw, and where I depart slightly from my grandmother's 1995 address. She spent much of her time proving that the younger generations were not guilty. I want to go further. You are not guilty. None of you born after 1945 are criminal, political, or moral guilty for the Holocaust. The law professor in the room worries this ritual is a secular original-sin service. He is right to worry, if sin implies inherited blame. It does not. Guilt cannot be inherited like blood. It ends with the actor.

  So why are we here? If the guilt is gone, what binds us?

  We are bound not by guilt, but by liability. In law, liability means you are responsible for fixing a mess even if you didn't make it. If you buy a house with a damaged foundation, you didn't break the foundation, but you are liable for repairing it. We are the successors to a society that collapsed into barbarism. We inherit the world that barbarism made. The obligation is not to feel bad; it is to do good.

  This is where the metaphysical category transforms. Jaspers argued that metaphysical guilt rests on solidarity—that we are all responsible for each other. When that solidarity is shattered, the survivors inherit the duty to restore it. Time does not dissolve this. If anything, time makes it harder, because the witnesses are dying.

  I look around this room and I see the spectrum of that history. I see my cousins' children, who deserve a future unburdened by shame. But I also see my Great-Aunt. She is ninety-seven years old, and she is sitting right there. She does not speak at these gatherings. She has not spoken about 1944 since the war ended. In 1944, she was sixteen, and she typed transport lists in the town administration.

  I acknowledge her presence not to judge her, but to locate the guilt where it belongs. She carries the moral and criminal weight of those actions in her own conscience, wherever it rests. She carries the silence. Because she carries that, we are freed from the guilt, but we are bound to the consequence. Her presence here is the proof that the past is not abstract. It is not a theory for the law professor to dissect. It is a woman in a chair. We do not gather to try her. We gather to ensure that the world she typed lists for never exists again.

  So, what is the obligation? It takes three forms.

  First, we must be witnesses. As the generation who knew the survivors passes, we become the keepers of the record. This is not about mourning; it is about accuracy. Lies thrive in the absence of specific memory.

  Second, we must be citizens. Political liability means we are responsible for the state we live in now. If injustice happens here, in our democracy, it is not someone else's fault. It is ours. We cannot say "not me" when the machinery starts turning.

  Third, we must be neighbors. The metaphysical bond requires us to recognize the humanity in others before it is threatened. Solidarity is not a feeling; it is a practice.

  To the teenagers: I do not ask you to feel shame. I ask you to feel readiness. The world is still capable of breaking. We are here not to apologize for 1945, but to prepare for 2025 and beyond.

  To the Professor: This is not theology. It is civics. We are not confessing sins; we are accepting maintenance costs for a damaged civilization.

  To my Great-Aunt: We see you. We will not ask you to speak. But we will speak so that you don't have to.

  The obligation binds us, not as culprits, but as guardians. The guilt dies with the guilty. The responsibility lives with the living. Let us leave here not lighter, but stronger. Thank you.

