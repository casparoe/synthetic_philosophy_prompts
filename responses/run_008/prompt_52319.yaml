prompt: |-
  Quick bit of background: I'm the type director at a small foundry, and we keep having the same argument every time someone pushes a design sketch in a stylised direction. Someone will do a brushy display face where the terminals flare so much the 'a' starts reading as 'o', or a blackletter-flavoured thing where the 'S' cap drifts towards 'f', and half the room says "it's still legible, look at it in context" and the other half says "you can read it because you know the word, that's cheating". We never resolve it because we have no shared way of deciding when a letterform has stopped being that letter, versus when it's that letter in an unfamiliar costume, versus when it's a perfectly fine letter that just doesn't belong in this family.

  So what I want from you is a decision procedure my team can actually run on a single glyph, in about ten minutes, before we commit it to a release. The interesting philosophical bit I want you to actually carry the weight of: what is it that makes every 'a' an 'a' -- is it the skeleton (the underlying topology, the closed bowl plus the right-side stem) versus the flesh (weight, contrast, terminals, the whole stylistic layer)? Or is it more like family resemblance across instances, or maybe it's recognitional, that what matters is what a reader triggers on in context? Whatever you decide, the procedure needs to make that call operational, and it needs to be honest about which bits of it are judgment calls dressed up as steps.

  Specific things I want the procedure to handle:

  - It should separate the question "is this still an a?" from the question "is this still an a in this family?" -- we sometimes reject a glyph that's a fine 'a' but a terrible fit for the design, and the procedure shouldnt merge those into one mushy verdict.
  - It needs a test for the context excuse, i.e. the designer saying "read this sample paragraph, you understood every word". My instinct is that word-level guessing is doing a lot of work there and I want a way to check that, maybe nonsense-string or isolated-glyph tests, but I'd like you to think about which tests actually probe letter identity versus just probing habitability of the style.
  - Blackletter is the classic edge case because historically readers who grew up on fraktur genuinely read those forms fluently, so any claim that e.g. a fraktur 'k' is "objectively confusable" needs to be more careful than it first looks. If the procedure has to bite a bullet here, say so.
  - Confusable pairs like b/d, l/1/I, rn/m should be treated as a distinct failure mode from "this stopped being an a" -- those seem like different sorts of problem and I suspect the fix differs too.

  Then run the procedure on three sketches from our current project: (1) the flare-terminal display 'a' I mentioned, which I privately love and will be annoyed if it fails, (2) a blackletter-inflected capital 'S' in an otherwise neutral sans, which I want killed but for principled reasons not vibes, and (3) a single-storey 'a' in a geometric sans where the team is split because it's totally legitimate in plenty of classic faces but reads oddly next to our double-storey 'g'. For each one, tell me where the procedure outputs a verdict and where it correctly punts to a human.

  Also please be upfront about what the procedure can't do: I'm guessing things like how much novelty readers will absorb in a week of exposure are genuinely outside what any checklist can decide, and I'd rather know that than have a procedure that pretends. Keep it usable by a junior designer without any philosophy background, so translate whatever distinctions you use into plain language, but don't lose the actual content while simplifying. Prefer no jargon you haven't explained inline, and dont worry about being nice about my flare-terminal 'a' -- if it fails, it fails.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Type Director at a small foundry.
      *   **Problem:** Recurring arguments about stylized glyphs (e.g., flared 'a' looking like 'o', Blackletter 'S' looking like 'f'). No shared framework for deciding when a letterform stops being *that* letter vs. being a stylistic outlier vs. being a confusable pair.
      *   **Goal:** A decision procedure (checklist/flowchart style) runnable on a single glyph in ~10 minutes.
      *   **Philosophical Core:** Must address *what makes an 'a' an 'a'* (skeleton/topology vs. flesh/style vs. recognition/context).
      *   **Specific Requirements:**
          *   Separate "Is it an 'a'?" from "Is it an 'a' *in this family*?"
          *   Test the "context excuse" (word guessing vs. letter recognition).
          *   Handle Blackletter/historical edge cases carefully (cultural fluency).
          *   Distinguish "identity loss" from "confusability" (b/d, rn/m).
          *   Run the procedure on three specific sketches (Flare 'a', Blackletter 'S', Single-storey 'a').
          *   Be honest about limitations (what the procedure *can't* do).
          *   Usable by junior designers (plain language, explained jargon).
          *   Be honest about the flare 'a' (no sugar-coating).

  2.  **Philosophical Foundation (The "Why"):**

      *   *Question:* What makes an 'a' an 'a'?
      *   *Option A: Essentialism (Skeleton).* There is a Platonic 'a'. If you break the topology (closed bowl + stem), it's not an 'a'. *Problem:* Blackletter and script break topology constantly but are readable.
      *   *Option B: Family Resemblance (Wittgenstein).* An 'a' is anything that shares enough features with other 'a's. *Problem:* Too vague for a 10-minute test.
      *   *Option C: Functional/Recognitional.* An 'a' is whatever the reader's brain categorizes as 'a' without relying on word context. *Winner.* This aligns with the user's suspicion about "cheating" via word guessing.
      *   *Decision:* The procedure will be based on **Feature Salience & Isolation Recognition**. It treats letter identity as a contract between the shape and the reader's internal database of forms.
      *   *Distinction:* Identity (Is this an 'a'?) vs. Consistency (Does this 'a' fit the family?) vs. Confusability (Does this 'a' look like a 'd'?).

  3.  **Drafting the Procedure (The "How"):**

      *   *Time Limit:* 10 minutes. Needs to be fast.
      *   *Steps:*
          1.  **Isolation Test:** Remove context. Can it stand alone?
          2.  **Topology Check:** Are the critical structural lines present? (The "Skeleton").
          3.  **Confusability Scan:** Does it look like a *different* letter more than itself?
          4.  **Family Fit:** Does it match the *other* letters in *this* font?
          5.  **The "Week Test" (Limitation):** Acknowledge learning curves.

      *   *Refining the "Context Excuse":* Need a specific test for this. Nonsense strings are good. Masking surrounding letters is better.
      *   *Refining Blackletter:* Acknowledge that "standard topology" doesn't apply if the *whole* font is Blackletter. The test must be relative to the system.
      *   *Refining "Identity vs. Family":* Make these distinct sections in the checklist.

  4.  **Developing the Three Case Studies:**

      *   *Case 1: Flare-terminal Display 'a' (flaring so much it looks like 'o').*
          *   *Prediction:* Likely fails Isolation/Topology. The bowl closure is the critical feature. If the flare closes the counter too much, it becomes an 'o'.
          *   *Verdict:* Fail on Identity.
      *   *Case 2: Blackletter 'S' in Neutral Sans.*
          *   *Prediction:* Fails Family Fit. It might be a valid 'S' historically, but in a sans context, it breaks the system. It might also fail Confusability (looks like 'f' or '5').
          *   *Verdict:* Fail on Family Fit (and potentially Confusability).
      *   *Case 3: Single-storey 'a' in Geometric Sans (with double-storey 'g').*
          *   *Prediction:* Passes Identity (it's a valid 'a'). Passes Confusability. Fails/Warning on Family Fit (incongruity with 'g'). This is a stylistic choice, not an error.
          *   *Verdict:* Pass Identity, Punt to Human on Family Fit.

  5.  **Addressing Limitations:**

      *   Cannot predict adaptation (readers learn weird fonts).
      *   Cannot account for cultural specificity (Blackletter is fluent for some, not others).
      *   Cannot replace optical testing at size.

  6.  **Writing the Response:**

      *   *Tone:* Professional, direct, slightly technical but accessible (Type Director to Type Director).
      *   *Structure:*
          1.  Philosophical Premise (briefly).
          2.  The Procedure (The "10-Minute Glyph Audit").
          3.  The Three Case Studies.
          4.  Limitations (The "Unknowns").
      *   *Constraint Check:* Ensure I don't use unexplained jargon. Ensure I address the "context excuse." Ensure I distinguish Identity vs. Family.

      *(Self-Correction during drafting)*: I initially thought about suggesting user testing. *Correction:* No, the prompt asks for a procedure the *team* can run in 10 minutes. User testing takes days. I need to simulate user testing via heuristics (isolation, masking).
      *(Self-Correction on Blackletter)*: I need to be careful not to say Blackletter is "illegible." The issue is the *mixing* of systems. The procedure needs a "System Consistency" check.
      *(Self-Correction on Flare 'a')*: The user loves it. I need to be firm but fair. If the aperture closes, it's an 'o'. That's topology.

  7.  **Final Polish:**

      *   Make the checklist actionable (Yes/No).
      *   Ensure the "Punt to Human" moments are clear.
      *   Check the word count and flow. (Keep it tight).

  8.  **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   ~10 mins? Yes.
      *   Philosophical weight carried? Yes (Functionalism/Recognition).
      *   Identity vs. Family separated? Yes.
      *   Context excuse tested? Yes (Nonsense/Masking).
      *   Blackletter handled? Yes (System consistency).
      *   Confusability distinct? Yes.
      *   Three sketches analyzed? Yes.
      *   Limitations admitted? Yes.
      *   Junior designer friendly? Yes.

  Let's assemble.cw
answer: |-
  Here is a decision procedure designed for your foundry. It is built on a **Functional Recognition** philosophy: a letter is defined not by a Platonic ideal skeleton, but by whether a reader can identify it *without* relying on word-level guessing.

  This distinguishes **Identity** (is this an 'a'?) from **Consistency** (is this an 'a' *for this font*?) and **Confusability** (does this look like a 'd'?).

  ### The 10-Minute Glyph Audit

  **Tools needed:** The glyph in isolation, the glyph set in a nonsense string (e.g., `n a m a d`), the glyph set in a real word, and a printed sheet of the current font family.
  **Who runs it:** Any designer (Junior+).
  **Pass criteria:** A glyph must pass **Section A** to be released. **Section B** determines if it fits the family. **Section C** flags specific risks.

  ---

  #### Section A: Identity (Is this still that letter?)
  *This section tests if the glyph has broken the contract of recognition. If it fails here, the design is fundamentally broken, regardless of style.*

  1.  **The Isolation Test:**
      *   Show the glyph alone on a white screen at text size (e.g., 12pt).
      *   Ask a colleague (who hasn't seen the sketch) to name it immediately.
      *   *Pass:* They name the correct letter within 1 second.
      *   *Fail:* They hesitate, guess wrong, or describe the shape ("the round one") instead of naming it.
  2.  **The Aperture/Topology Check:**
      *   Identify the **Critical Feature** for that letter (e.g., for 'a', it is the closed bowl + right stem; for 'c', it is the open aperture).
      *   Does the stylization obscure or close the Critical Feature? (e.g., Does the flare on the 'a' close the aperture so it looks like an 'o'?)
      *   *Pass:* Critical feature is distinct.
      *   *Fail:* Critical feature is ambiguous or mimics a different letter's topology.
  3.  **The Nonsense String Test (The "Context Excuse" Killer):**
      *   Set the glyph in a nonsense string (e.g., `v a x o l` or `d a b`).
      *   Cover the surrounding letters with a piece of paper, revealing only the target glyph.
      *   Can you identify the target glyph *before* uncovering the neighbors?
      *   *Pass:* Yes.
      *   *Fail:* No. (If you need the 'd' and 'b' to know the middle is an 'a', you are relying on word-shape guessing, not letter recognition. This is a fail.)

  **Verdict A:** If any step fails, the glyph is **Rejected**. It is not a letter; it is a shape that requires context to function.

  ---

  #### Section B: Consistency (Is this an 'a' in *this* family?)
  *This section tests if the glyph belongs. A glyph can be a valid 'a' but a terrible fit for a specific design.*

  1.  **The System Stress Test:**
      *   Place the glyph next to the three most structurally similar neighbors in *this* family (e.g., for 'a', check against 'o', 'e', 's').
      *   Do the terminals, contrast, and weight distribution match the neighbors?
      *   *Pass:* It looks like a sibling.
      *   *Fail:* It looks like an adopted child from a different era (e.g., a Blackletter 'S' in a Geometric Sans).
  2.  **The Grammar Check:**
      *   Does the glyph follow the construction rules established by the 'H', 'O', and 'n' of this family?
      *   *Pass:* Yes.
      *   *Fail:* No. (e.g., The family is monoline, but this glyph has high-contrast callographic thick/thins).

  **Verdict B:** If this fails, the glyph is **Valid but Mismatched**. It may be usable in a different cut (e.g., a "Display" or "Alt" version), but it cannot be the default glyph for this specific font file.

  ---

  #### Section C: Confusability (Does it look like something else?)
  *This is distinct from Identity. The glyph might be a valid 'a', but if it looks exactly like a 'd', it causes reading friction.*

  1.  **The Mirror/Rotate Scan:**
      *   Check against known confusables: `b/d/p/q`, `l/1/I`, `rn/m`, `S/5`, `O/0`.
      *   Flip the glyph horizontally or rotate it 180 degrees. Does it become another valid glyph in the set?
      *   *Pass:* No.
      *   *Fail:* Yes.
  2.  **The Density Check:**
      *   At small sizes (6-8pt), does the ink density merge distinct parts? (e.g., Does the 'a' bowl close up and look like an 'o' due to ink trap or weight?)
      *   *Pass:* No.
      *   *Fail:* Yes.

  **Verdict C:** If this fails, the glyph is **High Risk**. It requires a redesign to increase distinction, or it must be flagged as an alternate character only.

  ---

  ### Limitations (What this procedure cannot do)

  Be honest with your team: This checklist is a filter, not a guarantee.
  1.  **The Adaptation Blindspot:** This procedure cannot measure how quickly a reader will learn a weird font. Readers are adaptable. A glyph that fails the Isolation Test today might be readable after a week of exposure. This procedure prioritizes *immediate* legibility over *learned* legibility.
  2.  **Cultural Fluency:** This procedure assumes a standard Latin-reading brain. It will flag Blackletter forms as "Failed Identity" for a general audience, even though they are fluent for specific communities. (See Case 2 below).
  3.  **Texture vs. Glyph:** It tests single glyphs. It cannot fully judge how the glyph contributes to the overall color/texture of a paragraph.

  ---

  ### Running the Procedure on Your Three Sketches

  Here is the audit applied to your current conflicts.

  #### 1. The Flare-Terminal Display 'a'
  *The sketch where the terminals flare so much the 'a' risks reading as 'o'.*

  *   **Section A (Identity):**
      *   *Isolation Test:* **Fail.** If the flare closes the aperture visually, the eye registers a closed loop.
      *   *Topology Check:* **Fail.** The critical feature of a single-storey 'a' is the stem joining the bowl. If the flare obscures that junction, the topology is compromised.
      *   *Nonsense String:* **Fail.** In `n a m`, if the 'a' looks like an 'o', the brain reads `nom`. You are relying on the user knowing the word is "nam" to correct the visual data. That is the "context cheat."
  *   **Verdict:** **Rejected.**
  *   **Director's Note:** You love it, but the procedure is honest: if the aperture is visually closed, it is an 'o' wearing a mask. To save it, you must open the aperture or reduce the flare until the stem entry is unambiguous.

  #### 2. The Blackletter-Inflected Capital 'S' in Neutral Sans
  *The sketch where the 'S' drifts towards 'f' or '5'.*

  *   **Section A (Identity):**
      *   *Isolation Test:* **Pass/Borderline.** A Blackletter 'S' is historically a valid 'S'. A fluent reader might name it correctly.
      *   *Confusability:* **Fail.** In a modern context, this shape is heavily associated with 'f' (long s) or '5'.
  *   **Section B (Consistency):**
      *   *System Stress Test:* **Hard Fail.** Placing a high-contrast, calligraphic form next to neutral sans 'H' and 'O' breaks the system grammar. It is not a sibling; it is a different species.
  *   **Verdict:** **Valid but Mismatched.**
  *   **Director's Note:** This is not a "bad 'S'". It is a "wrong 'S' for this file." The procedure saves you from killing it on "vibes." It fails on **Consistency**, not Identity. Move it to a "Swash" or "Historical Alt" slot, do not make it the default cap 'S'.

  #### 3. The Single-Storey 'a' in Geometric Sans (with double-storey 'g')
  *The sketch where the team is split on legitimacy.*

  *   **Section A (Identity):**
      *   *Isolation Test:* **Pass.** Everyone knows this shape is an 'a'.
      *   *Topology Check:* **Pass.** Bowl and stem are clear.
      *   *Nonsense String:* **Pass.** Reads clearly in `v a x`.
  *   **Section B (Consistency):**
      *   *System Stress Test:* **Warning.** Geometric sanses often mix single-storey 'a' and double-storey 'g' (e.g., Futura). However, if your 'g' is double-storey, the 'a' creates a stylistic dissonance.
      *   *Grammar Check:* **Pass.** It fits the geometric construction.
  *   **Section C (Confusability):**
      *   *Pass.* No major confusables.
  *   **Verdict:** **Pass (with Human Punt).**
  *   **Director's Note:** The procedure clears this glyph technically. It is a valid 'a'. The conflict is purely aesthetic (the 'a'/'g' mismatch). The procedure correctly **punts to a human** here. This is a Type Director decision, not a legibility error. You may keep it if you accept the stylistic tension.

  ### Summary for the Team

  When you argue next time, do not argue about "legibility." Argue about which section of the Audit failed.
  *   If it fails **Section A**, it is broken design.
  *   If it fails **Section B**, it is a categorization error (put it in Alts).
  *   If it fails **Section C**, it is a friction risk (redesign or warn the user).
  *   If it passes all three, the argument is about taste, and the Type Director breaks the tie.
