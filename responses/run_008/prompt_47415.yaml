  **Framework for Adversarial Collaboration: Units of Selection**

  **Preamble**
  This document establishes the baseline commitments and structured disagreements for the ongoing dialogue between Gene-Centric (GC) and Multilevel Selection (MLS) perspectives. Its purpose is not to force consensus but to localize disagreement precisely enough to generate empirically or formally adjudicable questions.

  **1. Joint Commitments**
  Both parties affirm the following claims as foundational to the collaboration:

  1.  **Mathematical Identity:** The Price equation is a mathematical identity describing covariance between traits and fitness. It is universally applicable to evolutionary change but does not, by itself, dictate causal interpretation.
  2.  **Selection Of/For:** The distinction between the *object* of selection (selection of) and the *property* responsible for fitness differences (selection for) is necessary to distinguish drift from selection and to clarify level-specific claims.
  3.  **Historical Context:** Naive group selectionism of the 1960s (e.g., Wynne-Edwards) frequently committed the averaging fallacy and ignored free-rider problems within groups. Critiques from Williams (1966) and Maynard Smith (1964) were correct to demand mechanistic rigor regarding within-group competition.
  4.  **Formal Equivalence:** In static environments with constant fitness coefficients, GC (inclusive fitness) and MLS (Price partition) frameworks are formally intertranslatable in many toy models. Neither framework produces mathematically impossible predictions that the other cannot describe via parameter transformation.
  5.  **Contextual Dependence:** Fitness is not an intrinsic property of an allele or organism but is contingent on environmental structure, including population viscosity and migration rates.

  **2. Characterized Disagreements**
  The following table isolates specific points of contention. Wording is chosen to reflect each position's self-conception without caricature.

  | Issue | Gene-Centric Characterization | Multilevel Selection Characterization |
  | :--- | :--- | :--- |
  | **Causal Status of Price Terms** | The between-group covariance term is a statistical artifact derived from individual-level fitness assignments; it is a bookkeeping device, not a distinct causal force. | The between-group covariance term isolates a genuine causal component of evolutionary change distinct from within-group selection, identifiable via contextual analysis. |
  | **Ontology of Groups** | Groups are aggregations of individuals; only genes possess the lineage fidelity required to be true replicators over deep time. | Groups can function as emergent interactors (and occasionally replicators) when group-level properties constrain individual fitness independently of individual traits. |
  | **Explanatory Privilege** | The gene-centric view is causally parsimonious; adding group-level causes violates Occam's razor when individual-level sufficiency is established. | The MLS view is causally complete; restricting explanation to genes obscures emergent dynamics essential for understanding transitions in individuality (e.g., eusociality). |

  **3. Philosophical Cruxes**
  We identify three pivot points where theoretical commitment dictates empirical expectation:

  *   **Crux A (Vacuity vs. Decomposition):** Does the formal equivalence of GC and MLS models imply that one framing is merely a redescription (vacuous), or do both offer genuine, non-competing causal decompositions of the same process?
  *   **Crux B (Group-Level Causation):** Can group-level properties (e.g., group size, composition) exert downward causation on individual fitness that is not reducible to the sum of individual pairwise interactions?
  *   **Crux C (Verbal vs. Substantive):** Is the debate regarding "which level selection acts on" partly verbal? If so, does the verbal component concern the definition of "selection" or the definition of "cause"?

  **4. Empirical and Theoretical Bearings**
  For each crux, we specify conditions both agree are relevant, with pre-committed predictions.

  *   **Regarding Crux A (Equivalence):**
      *   *Test:* Analysis of transient dynamics in range-expansion models where fitness coefficients are frequency-dependent.
      *   *Agreed Bearing:* If the frameworks diverge in predicting the *rate* of allele fixation during non-equilibrium phases, equivalence is pragmatic, not fundamental.
      *   *GC Prediction:* Transient dynamics will resolve to individual-level inclusive fitness calculations without residual error.
      *   *MLS Prediction:* Transient dynamics will show variance components that cannot be captured by individual-level parameters alone until equilibrium is reached.

  *   **Regarding Crux B (Causation):**
      *   *Test:* Experimental manipulation of between-group variance in microbial biofilms while holding individual genotype frequencies constant.
      *   *Agreed Bearing:* If altering group structure changes evolutionary outcomes independent of individual traits, group-level causation is supported.
      *   *GC Prediction:* Changes will be fully explicable via changes in individual interaction networks (partner choice); no group-level variable will remain significant in a full regression.
      *   *MLS Prediction:* Group-level variables (e.g., biofilm integrity) will retain statistical significance as causal predictors of fitness even when controlling for individual genotype.

  *   **Regarding Crux C (Verbal Dispute):**
      *   *Test:* Counterfactual intervention analysis on hypothetical populations (e.g., "If group property G changed, would allele frequency change?").
      *   *Agreed Bearing:* If both parties agree on the counterfactual outcomes but disagree on the label "selection," the dispute is semantic. If they disagree on the outcomes, it is substantive.
      *   *GC Prediction:* Disagreement is largely semantic; once individual-level counterfactuals are fixed, no additional "group selection" fact remains.
      *   *MLS Prediction:* Disagreement is substantive; individual-level counterfactuals are insufficient to capture the causal structure of group extinction events.

  **Conclusion**
  Signatories agree to treat these divergences as hypotheses rather than dogmas. Future discussions must reference these specific cruxes and bearings rather than reverting to general principled objections.

