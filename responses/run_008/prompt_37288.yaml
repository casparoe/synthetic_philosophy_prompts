      *   *San Tallo 1975:* $H^2$ (broad-sense) = 0.35. Substantial shared environment ($c^2$).
      *   *San Tallo 1990:* Reform (standardized instruction/nutrition).
      *   *San Tallo 2015:* $H^2$ = 0.65. $c^2$ $\approx$ 0 (adults), appreciable (children). Mean score +1 SD.
      *   *Cape Verro 2015:* No reform. Mean score -0.5 SD (relative to San Tallo). $H^2$ = 0.60.
      *   *Note:* The prompt mentions "broad-sense" ($H^2$) initially but standard behavioral genetics usually focuses on narrow-sense ($h^2$) for selection/response, though broad-sense works for variance decomposition discussions. I will stick to the term "heritability estimate" generally or specify broad-sense if needed, but for intro philosophy, the distinction between $H^2$ and $h^2$ is often less critical than $V_G / V_P$. I will use the term "heritability estimate" to keep it accessible but precise enough for the logic.

  3.  **Drafting Question 1: Change in Heritability over Time (Objective 1)**
      *   *Focus:* Why did $h^2$ go from 0.35 to 0.65?
      *   *Correct Logic:* $h^2 = V_G / (V_G + V_E)$. If $V_E$ shrinks (due to standardization), $h^2$ rises even if $V_G$ stays constant.
      *   *Distractors:* Genes got stronger; Environment got weaker so genes *must* have changed; The test changed.
      *   *Drafting:* Focus on the 1990 reform standardizing environment.
      *   *Option A (Correct):* Environmental variance decreased, increasing the proportion of variance attributed to genes.
      *   *Option B:* Genetic variance increased because music became more important. (Misunderstanding: $V_G$ changes easily).
      *   *Option C:* The reform made genes more expressive. (Misunderstanding: Gene-environment correlation confused with variance ratio).
      *   *Option D:* Heritability measures absolute genetic power, which grew. (Misunderstanding: Heritability as absolute measure).

  4.  **Drafting Question 2: Mean Shift vs. Heritability (Objective 2)**
      *   *Focus:* The +1 SD rise in mean scores.
      *   *Correct Logic:* $h^2$ explains variance *around* the mean, not the mean itself. The rise is likely environmental (the reform).
      *   *Distractors:* The rise is 65% genetic; High $h^2$ means the mean is genetically determined; The rise proves genes changed.
      *   *Drafting:* Connect the 0.65 figure to the mean shift.
      *   *Option A (Correct):* The 0.65 figure describes variation around the mean, not the cause of the mean's shift.
      *   *Option B:* Since $h^2$ is 0.65, roughly 65% of the score increase is genetic. (Misunderstanding: Confusing variance with mean shift).
      *   *Option C:* High heritability implies the population mean is genetically fixed. (Misunderstanding: Immutability).
      *   *Option D:* The shift must be environmental because heritability changed. (Misunderstanding: Causal link between $h^2$ change and mean change direction).

  5.  **Drafting Question 3: Between-Group Differences (Objective 3)**
      *   *Focus:* San Tallo vs. Cape Verro.
      *   *Correct Logic:* High within-group $h^2$ tells us nothing about between-group differences.
      *   *Distractors:* San Tallo is smarter because of genes; Cape Verro is lower because of environment; The difference matches the $h^2$ difference.
      *   *Drafting:* Use the 0.5 SD difference.
      *   *Option A (Correct):* The within-population estimates do not justify inferring the cause of the difference between populations.
      *   *Option B:* Since both have high $h^2$, the difference between them is mostly genetic. (Misunderstanding: Lewontin's fallacy).
      *   *Option C:* Since San Tallo had a reform, the difference is entirely environmental. (Misunderstanding: Overcorrection/ignoring potential genetic drift).
