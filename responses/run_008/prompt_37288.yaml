      *   **Constraint 4 (Output):** Answer key with detailed analysis of correct answers and distractors. Bonus question with marking scheme.
      *   **Specific Learning Objectives (5 points):**
          1.  Change in $h^2$ over time $\neq$ change in genetic influence (can be reduced $V_E$).
          2.  $h^2$ within population $\neq$ cause of mean shift (Flynn effect logic).
          3.  Within-group $h^2$ $\neq$ between-group difference source (Lewontin's fallacy).
          4.  Shared environment ($c^2$) $\approx$ 0 for adults $\neq$ family doesn't matter (fading effects, etc.).
          5.  High $h^2$ $\neq$ immutability/intervention futile (reform worked despite high $h^2$).

  2.  **Drafting the Case Study (Refinement):**
