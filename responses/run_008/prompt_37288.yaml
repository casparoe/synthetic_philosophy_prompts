answer: |-
  ### Case Study: The San Tallo Music Aptitude Program

  The island polity of San Tallo (population four million) runs a national music-aptitude testing program. A 1975 twin study, using the same instruments and scoring as today, estimated the broad-sense heritability ($H^2$) of aptitude scores at **0.35**, with a substantial shared-environment component for children. In 1990, a reform standardized school music instruction and childhood nutrition across the island. A 2015 replication with the same instruments estimated heritability at **0.65**, with shared-environment effects near zero for adults but still appreciable for children. The 2015 study also found that mean scores had risen by roughly **one standard deviation** since 1975. A neighboring island, Cape Verro, which never adopted the reform, has mean scores about **half a standard deviation below** San Tallo's and its own 2015 heritability estimate of **0.60**.

  ***

  ### Midterm Questions

  **1. Considering the change in the heritability estimate from 1975 (0.35) to 2015 (0.65), which of the following best explains this shift without assuming a change in the population's genetic makeup?**
  A. The 1990 reform reduced the variability in environmental conditions, making genetic differences account for a larger proportion of the remaining variance.
  B. The 1990 reform caused new genetic mutations to spread through the population, increasing the total genetic variance.
  C. The 1990 reform made genetic factors more biologically potent, increasing the absolute influence of genes on individual scores.
  D. The 1990 reform eliminated the shared environment, which automatically converts environmental variance into genetic variance.

  **2. The 2015 study shows a heritability estimate of 0.65 and a mean score increase of one standard deviation since 1975. What does the 0.65 figure imply about this increase in the mean score?**
  A. It implies that approximately 65% of the one-standard-deviation increase is due to genetic improvements.
  B. It implies that the increase is entirely environmental, because high heritability prevents the mean from shifting.
  C. It implies nothing about the cause of the mean shift, as heritability describes variation around the mean, not the mean itself.
  D. It implies that the increase is 35% environmental, because the remaining variance is the only part susceptible to intervention.

  **3. In 2015, San Tallo's mean score is 0.5 SD higher than Cape Verro's, and both islands have high heritability estimates (0.65 and 0.60, respectively). What can be inferred about the cause of the difference *between* the two islands?**
  A. Because both populations have high heritability, the difference between their means is likely mostly genetic.
  B. Because San Tallo implemented a reform and Cape Verro did not, the difference between their means is entirely environmental.
  C. The within-group heritability estimates provide no logical basis for inferring the cause of the between-group difference.
  D. The difference is proportional to the difference in heritability, so 5% of the gap is due to genetic variance differences.

  **4. The 2015 study found that the shared-environment component ($c^2$) for music aptitude was near zero for adults, despite being appreciable for children. What does this finding justify?**
  A. The conclusion that parenting and family background have no causal effect on adult music aptitude.
  B. The conclusion that family effects may have occurred but no longer contribute to *differences* among adults in this population.
  C. The conclusion that genetic effects only begin to activate after childhood, replacing environmental effects.
  D. The conclusion that the testing instrument is valid for children but unreliable for measuring adult aptitude.

  **5. Given that the 2015 heritability estimate is high (0.65) yet the 1990 reform successfully raised mean scores by one standard deviation, which conclusion is supported?**
  A. The reform was largely pointless, as high heritability indicates the trait is biologically fixed.
  B. The reform only succeeded because it targeted the 35% of the population with low genetic aptitude.
  C. A trait can be highly heritable within a population and still be highly responsive to environmental intervention.
  D. The heritability estimate must be incorrect, because an environmental intervention cannot raise scores if heritability is above 0.50.

  ***

  ### Answer Key and Distractor Analysis

  **1. Correct Option: A**
  *   **Why A is correct:** Heritability is a ratio ($V_G / V_P$). If the reform standardized nutrition and instruction, Environmental Variance ($V_E$) decreased. Even if Genetic Variance ($V_G$) stayed constant, the proportion of total variance attributed to genes ($V_G / (V_G + V_E)$) increases.
  *   **Distractor B (Genetic mutations):** *Misunderstanding:* Assumes heritability changes require genetic changes. *Rejection:* Evolutionary changes in allele frequencies do not occur significantly over 40 years in a human population; heritability is sensitive to environmental variance changes.
  *   **Distractor C (Genes more potent):** *Misunderstanding:* Confuses variance proportions with absolute causal power. *Rejection:* Genes did not become "stronger"; the environmental "noise" against which they are measured was reduced.
  *   **Distractor D (Automatic conversion):** *Misunderstanding:* Believes variance components transform into one another. *Rejection:* Environmental variance does not turn into genetic variance; the *proportion* changes because the denominator (total variance) shrinks.

  **2. Correct Option: C**
  *   **Why C is correct:** Heritability quantifies why individuals *differ* from the average at a specific time. It does not explain why the *average* itself moved (the Flynn Effect logic). The mean shift is likely due to the uniform environmental improvement.
  *   **Distractor A (65% of increase):** *Misunderstanding:* Applies the variance ratio to the mean shift. *Rejection:* This is the most common error; $h^2$ applies to differences *within* the group, not the difference *between* time points or means.
  *   **Distractor B (Entirely environmental/fixed mean):** *Misunderstanding:* Believes high $h^2$ freezes the mean. *Rejection:* The case study itself disproves this; the mean *did* shift despite high $h^2$.
  *   **Distractor D (35% modifiable):** *Misunderstanding:* Believes the non-heritable portion is the only part that can change. *Rejection:* Environmental interventions can shift the entire distribution regardless of how much variance is currently genetic.

  **3. Correct Option: C**
  *   **Why C is correct:** This targets Lewontin's Fallacy. High within-group heritability in both groups is compatible with the between-group difference being 100% environmental, 100% genetic, or any mix.
  *   **Distractor A (Likely mostly genetic):** *Misunderstanding:* Infers between-group causes from within-group statistics. *Rejection:* Two groups can both have high $h^2$ (e.g., height in well-nourished vs. malnourished groups) while the difference between them is entirely environmental.
  *   **Distractor B (Entirely environmental):** *Misunderstanding:* Overcorrects based on the reform narrative. *Rejection:* While the reform is a likely cause, the *heritability data itself* does not prove this; we know it from the history, not the $h^2$ statistic.
  *   **Distractor D (Proportional to $h^2$):** *Misunderstanding:* Attempts to mathematically derive group differences from $h^2$ gaps. *Rejection:* There is no mathematical relationship linking the difference in heritability coefficients to the difference in phenotypic means.

  **4. Correct Option: B**
  *   **Why B is correct:** Shared environment ($c^2$) measures how much family membership makes siblings *similar relative to non-siblings*. If it is zero, families are not making siblings different from other families *at that age*, possibly because effects faded or everyone had similar families.
  *   **Distractor A (No causal effect):** *Misunderstanding:* Confuses variance with causation. *Rejection:* Parenting could raise everyone's aptitude equally (shifting the mean) without creating variance between families.
  *   **Distractor C (Genes activate later):** *Misunderstanding:* Developmental determinism. *Rejection:* Genetic effects often operate early; the disappearance of $c^2$ usually reflects individuals selecting their own environments (niche-picking) as adults.
  *   **Distractor D (Test unreliable):** *Misunderstanding:* Methodological skepticism. *Rejection:* This is a standard finding in behavioral genetics (the "Wilson effect"); it reflects the data structure, not necessarily test failure.

  **5. Correct Option: C**
  *   **Why C is correct:** This directly addresses "heritability is not immutability." The case study provides empirical proof: $h^2$ was high in 2015, yet the environment (reform) successfully changed the trait.
  *   **Distractor A (Pointless/fixed):** *Misunderstanding:* Equates high $h^2$ with fixedness. *Rejection:* The data shows the trait changed significantly; high $h^2$ only means current differences are correlated with genetic differences.
  *   **Distractor B (Targeted 35%):** *Misunderstanding:* Reifies variance components into sub-populations. *Rejection:* Variance components apply to the whole population; you cannot identify which individuals belong to the "environmental variance" portion.
  *   **Distractor D (Must be incorrect):** *Misunderstanding:* Believes there is a threshold where intervention becomes impossible. *Rejection:* There is no such threshold; PKU is highly heritable but environmentally treatable.

  ***

  ### Bonus Short-Answer Question

  **Question:** In no more than 150 words, explain what the 1975-to-2015 change in the heritability estimate (0.35 to 0.65) tells us about where the variance in musical aptitude went in San Tallo. Your answer must include at least one alternative explanation for the rise in the estimate that the data as described cannot rule out.

  **Marking Scheme (3 Points):**

  *   **Point 1 (Variance Ratio):** Awarded if the student explains that heritability is a proportion ($V_G/V_P$) and the rise likely indicates a reduction in environmental variance ($V_E$) due to standardization, rather than an increase in genetic variance.
      *   *Typical Loss:* Student claims genes "became more important" or "increased" without referencing the reduction of environmental variance.
  *   **Point 2 (Variance Stability):** Awarded if the student clarifies that the absolute genetic variance ($V_G$) could have remained constant while the *proportion* changed.
      *   *Typical Loss:* Student implies that the total amount of genetic difference in the population must have grown to match the higher coefficient.
  *   **Point 3 (Alternative Explanation):** Awarded for identifying a plausible alternative the data doesn't rule out (e.g., Gene-Environment Interaction where the new environment allows genetic potential to vary more; or that $V_G$ actually did increase due to selection/migration, though less likely).
      *   *Typical Loss:* Student offers an irrelevant alternative (e.g., "the test changed") or fails to offer an alternative at all.

  **Sample Full-Credit Response:**
  The rise from 0.35 to 0.65 indicates a change in the ratio of genetic to total variance, not necessarily a change in genetic effects. Because the 1990 reform standardized nutrition and instruction, environmental variance ($V_E$) likely decreased. Since $h^2 = V_G / (V_G + V_E)$, shrinking the denominator increases the ratio even if genetic variance ($V_G$) remains constant. However, the data cannot rule out that the reform created a Gene-Environment Interaction where the standardized environment allowed genetic differences to express themselves more fully, thereby actually increasing $V_G$. Thus, the rise reflects a change in variance structure, but we cannot definitively isolate $V_G$ stability without further data. 
  *(143 words)*
