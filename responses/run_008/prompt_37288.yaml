      *   *Tone:* Academic but accessible for intro philosophy.

  9.  **Drafting the Bonus Question:**
      *   *Prompt:* Explain the 1975-2015 $h^2$ change regarding variance.
      *   *Requirements:* Max 150 words. Must include alternative explanation.
      *   *Marking Scheme:* 1 point for variance ratio explanation ($V_E$ down), 1 point for clarifying $V_G$ stability, 1 point for alternative (e.g., GxE interaction, gene expression changes, though $V_E$ reduction is the primary intended answer, the prompt asks for an alternative the data *cannot rule out*). Wait, the prompt asks for "at least one alternative explanation for the rise in the estimate that the data as described cannot rule out." The primary explanation is reduced $V_E$. An alternative could be increased $V_G$ (e.g., if the reform allowed genetic potential to be more fully realized/varied) or GxE. I need to make sure the marking scheme rewards understanding that $h^2$ is a ratio.

