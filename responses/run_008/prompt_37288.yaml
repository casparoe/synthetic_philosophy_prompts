  6.  **Drafting Question 4: Shared Environment in Adults (Objective 4)**
      *   *Focus:* $c^2$ $\approx$ 0 for adults, but appreciable for children.
      *   *Correct Logic:* Shared environment effects can fade or be subsumed into non-shared variance/genotype-environment correlation as adults select niches. It doesn't mean parenting did nothing.
      *   *Distractors:* Parenting doesn't matter; Genes take over; The test is biased.
      *   *Drafting:* Focus on the adult $c^2$ finding.
      *   *Option A (Correct):* Family effects may have occurred but no longer contribute to *variance* among adults.
      *   *Option B:* Parenting has no causal effect on adult music aptitude. (Misunderstanding: Variance vs. Causation).
      *   *Option C:* Genetic effects only activate after childhood. (Misunderstanding: Developmental genetics).
      *   *Option D:* The measure of shared environment is unreliable for adults. (Misunderstanding: Methodological skepticism).

  7.  **Drafting Question 5: Immutability/Intervention (Objective 5)**
      *   *Focus:* High $h^2$ (0.65) coexists with successful reform (+1 SD).
      *   *Correct Logic:* High $h^2$ does not prevent environmental intervention from shifting the mean.
      *   *Distractors:* Reform was pointless; Reform only worked on low $h^2$ people; 0.65 means 35% modifiable.
      *   *Drafting:* Connect the 2015 $h^2$ to the success of the 1990 reform.
      *   *Option A (Correct):* A trait can be highly heritable and still be highly responsive to environmental intervention.
      *   *Option B:* The reform was ineffective because heritability increased. (Misunderstanding: Equating $h^2$ rise with lack of intervention success).
      *   *Option C:* The reform only affected the 35% of variance not explained by genes. (Misunderstanding: Partitioning individuals vs. variance).
      *   *Option D:* Heritability of 0.65 means the trait is biologically fixed. (Misunderstanding: Slogan recitation failure).

  8.  **Review and Refine:**
      *   Check against constraints: Are the distractors plausible? Do they target specific misconceptions?
      *   *Self-Correction on Q1:* Make sure the distinction between $V_G$ changing and $V_E$ changing is clear.
      *   *Self-Correction on Q3:* Ensure the "Lewontin's Fallacy" is clearly the target.
      *   *Self-Correction on Q4:* Ensure the distinction between "effect on mean" and "effect on variance" is clear.
