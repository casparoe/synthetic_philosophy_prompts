      2.  Defeaters (Ranked):
          *   1. The Incoherence of the Antecedent (Binmore/Reny) - Fatal.
          *   2. Underdetermination of Beliefs (Stalnaker) - Severe.
          *   3. Circularity of Substantive Rationality (Conceptual) - Awkward.
      3.  Defender's Concessions: What they keep vs. what they reinterpret.
