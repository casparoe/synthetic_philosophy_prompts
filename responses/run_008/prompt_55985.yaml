answer: |-
  The scenario you describe is a classic instance of the **discursive dilemma** (or doctrinal paradox) from social choice theory. It reveals a tension between collective rationality (logical consistency across premises) and collective democracy (majority rule on the final outcome). Your intuition is correct: the legal system does not resolve this tension theoretically but manages it pragmatically.

  Here is a reconstruction of what these practices imply about the ontology of the multi-member court, addressing your three specific constraints.

  ### 1. Beliefs vs. Votes: Does Aggregation Dictate Ontology?

  You ask whether there is a real difference between saying a court "has beliefs" versus saying it is "three people plus a rule," and whether aggregation methods require one picture over the other.

  **The Distinction is Functional, Not Metaphysical**
  Strictly speaking, neither aggregation method *proves* a specific metaphysical ontology. You can have a "conclusion-based" vote (outcome voting) while pretending the court is a single rational agent, just as you can have "premise-based" voting (issue voting) while viewing the court as a mere aggregation device. However, the *normative pressure* of each method pulls toward a different conception of the institution.

  *   **Conclusion-Based Aggregation (Outcome Voting):** This treats the court primarily as a **dispute-resolution device**. It presupposes that the court's primary function is to produce a binding result for the parties. Ontologically, this aligns with the view that the court is a collection of individuals whose authority is summed. It tolerates logical inconsistency in the collective reasoning (as in your example) because the legitimacy of the decision rests on the headcount, not the coherence of the rationale. This view suggests the court does not "believe" anything; it merely "decides."
  *   **Premise-Based Aggregation (Issue Voting):** This treats the court primarily as a **rule-formulation body**. It presupposes that the court's function is to generate coherent legal standards for the future. Ontologically, this aligns with the view of the court as a **corporate rational agent**. For the court to issue a coherent rule, the institution itself must hold a consistent set of propositions. If the court is merely three individuals, there is no guarantee their combined premises will be consistent. Premise voting forces the individuals to subordinate their individual logical paths to the collective logic, effectively simulating a single mind.

  **Can Both Be True?**
  Yes, because the court is a **hybrid institution** with dual masters. It serves the litigants (who need a final winner/loser) and the public (who need predictable law).
  *   When serving the litigants, the court acts as a voting machine (conclusion-based).
  *   When serving the public, the court acts as a reason-giver (premise-based).

  The system does not view this as a contradiction in what the court *is*, but as a toggle between what the court is *doing*. The ontology shifts based on the task. Therefore, the practices do not commit the system to a single view of the court's nature, but rather to a **functional duality**.

  ### 2. Reasons and Precedent: The Performative Corporate Agent

  You ask whether the practice of writing reasoned opinions and creating precedent presupposes a "corporate reasoner" in a way that raw voting does not. The answer is yes, and this is where the tension becomes most visible.

  **The "Majority Opinion" as a Fiction**
  Raw voting requires no unity. Five judges can vote "Affirm" for five mutually exclusive reasons. But a precedent requires a *ratio decidendi* (the reason for the decision). For a precedent to function, the legal community must be able to point to a specific proposition of law that the court endorsed.
  *   **The Presupposition:** The practice of publishing a single "Majority Opinion" presupposes that the court is a **single rational agent**. It is a performative act. By coalescing around one text, the judges construct a fictional unity. They speak as "The Court," not as "Judge A, B, and C."
  *   **The Paradox's Threat:** In your scenario, if the judges vote by outcome (Not Liable), but cannot agree on a majority rationale (since A, B, and C all disagree on the logic), the precedent value is destroyed. This is often called a "fragmented majority."
  *   **Institutional Commitment:** The fact that judges strive so hard to avoid fragmented majorities (often compromising on reasoning to get a fifth vote) shows that the institution is implicitly committed to the **corporate reasoner model** for the sake of stability. They know that if they admit they are just three individuals voting on outcomes, the law becomes unpredictable.

  **Precedent Requires "Collective Belief"**
  For *stare decisis* to work, future courts must treat the past court's decision as a unified block of reasoning. If the legal system acknowledged that the past court was just a voting aggregate with no collective belief, future courts would be free to pick and choose which premises to accept, destabilizing the law. Therefore, the practice of precedent *forces* the court to act *as if* it has collective beliefs, even if the voting mechanics reveal it does not. The written opinion is the mask of the corporate agent.

  ### 3. Philosophical Underdetermination: Where the Theory Breaks Down

  You ask where the practice is philosophically underdetermined—spots where several different views of collective judgment would license what courts actually do, preventing us from reading a single implicit theory off the institution. There are three key areas of underdetermination.

  **A. The Definition of the "Holding"**
  The legal system never rigorously defines whether the "holding" of a case is the final outcome (liability) or the necessary premises (contract validity).
  *   If the holding is the **outcome**, the court is a voting aggregate.
  *   If the holding is the **premises**, the court is a corporate reasoner.
  *   **Underdetermination:** Because courts can strategically characterize what part of their opinion is "binding" versus "dicta" (non-binding commentary), they can slide between these two ontologies case-by-case. If the premise-voting leads to an unpopular result, they may claim only the outcome was the holding. If the outcome is clear but the rule needs strengthening, they claim the premises were the holding. This flexibility means the institution is not committed to one theory of collective judgment; it retains the option to adopt whichever theory justifies the desired result.

  **B. The Treatment of Concurrences**
  The existence of concurring opinions explicitly admits that the court is *not* a single mind. A concurrence says, "I agree with the result, but not the reasoning."
  *   **Underdetermination:** If the court were truly a corporate agent, concurrences would be incoherent (a person cannot disagree with their own reasoning). Yet, the system tolerates them. This suggests the institution accepts that the "corporate agent" is a limited fiction that applies only to the narrowest part of the decision (the judgment), while the "collection of individuals" is the reality of the deliberation. We cannot derive a single theory because the institution explicitly signals both simultaneously: unity in the judgment, plurality in the reasoning.

  **C. The Reception by Future Courts**
  The ontology of the court is often determined not by the court itself, but by how *future* courts treat its decisions.
  *   **Underdetermination:** A future court might look at your three-judge scenario and say, "Since a majority agreed on the contract premise, that is now the law" (treating the past court as a premise-aggregator). Another future court might say, "Since the majority voted not liable, the defendant wins, but no rule was established" (treating the past court as an outcome-aggregator).
  *   Because the legal system allows future courts to interpret the "weight" of a prior decision, the original court's ontological status is not fixed at the time of decision. It is retroactively constructed. This means the institution does not presuppose a fixed nature of the court; it presupposes a **continuing dialogue** where the nature of the collective agent is negotiated over time.

  ### Summary Reconstruction

  The legal system does not presuppose that a multi-member court is *either* a single rational agent *or* a voting device. It presupposes that the court is a **hybrid authority** that must toggle between these modes to maintain legitimacy.

  1.  **For Dispute Resolution:** It operates as a **voting aggregate**. It prioritizes the majority's will on the bottom line to ensure finality. This licenses the "Not Liable" outcome in your scenario, even if the logic is fragmented.
  2.  **For Law Making:** It operates as a **corporate reasoner**. It prioritizes logical consistency across premises to ensure guidance. This licenses the use of special verdicts and majority opinions to force coherence.
  3.  **The Glue:** The practice of **precedent** bridges the gap. It requires the court to *perform* unity (via majority opinions) even when the *mechanics* are pluralistic (via voting).

  The system is not "unbothered" by the paradox; rather, it relies on the ambiguity. By remaining philosophically underdetermined about whether the "holding" lies in the premises or the conclusion, the legal system preserves the flexibility to prioritize finality when needed and coherence when possible. The court is not a thing with a fixed nature; it is a practice that constructs its nature differently depending on whether it is speaking to the parties or to the future.
