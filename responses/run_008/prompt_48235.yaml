  whenever some big screwup happens that everyone "saw coming" only after the fact — a company collapses, a war breaks out that supposedly had warning signs everywhere, the whole "connecting the dots" thing people said after 9/11 — there's this analogy that the events beforehand were like a dot-to-dot puzzle: all the dots were sitting right there on the page, someone just had to draw the lines, and the finished picture was obvious. the conclusion being drawn is basically that failing to see it coming was negligence, not bad luck. i've been turning this over myself and my suspicion is the analogy kind of cheats, because a real dot-to-dot only looks like a dot-to-dot once you know what the picture is, and half the dots on the page belong to other pictures that never got drawn. but i might be overcorrecting. can you do the full mapping for me — what's a dot, what's a line, what's the finished picture, and who's the person holding the pencil — then show me where the analogy breaks down, which of the disanalogies actually matter for the negligence conclusion and which ones don't, and whether that conclusion survives once they're on the table? lead with your bottom line in the first sentence and then give the reasoning, no preamble and don't just restate my question back at me.
