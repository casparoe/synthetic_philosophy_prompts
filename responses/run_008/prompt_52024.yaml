prompt: |-
  I'm a backend engineer at a company that runs a large distributed platform, and every quarter our team has to rank a backlog of reliability and security projects — things like adding checksumming to a replication path, pre-provisioning spare capacity in a second region, rewriting legacy failover logic — by expected dollar impact over the next two years. The distributions we're implicitly dealing with are brutally heavy-tailed: most scenarios cost nothing, a few cost a few thousand dollars, and one scenario (the region-wide outage, the silent data-corruption incident) produces a number that our spreadsheet renders in scientific notation. When I sum over my scenario list, the total is completely dominated by whatever I happened to put in the tail, and I've noticed that the ranking of projects changes depending on how I enumerate and group the scenarios — which sounds like it shouldn't matter. A colleague who reads decision-theory blogs mentioned something called the Pasadena paradox, apparently a variant of the St. Petersburg game where the expected value isn't just infinite but genuinely undefined, because the series you're supposed to add up gives different answers depending on the order you add it in. I strongly suspect the same thing is happening in my spreadsheet, minus the infinity, and I'd like to know what philosophy and decision theory actually say about choosing under such distributions, translated into something my team can run.

  Concretely: please write a decision procedure that a group of engineers could apply in a half-day planning meeting, with no philosophy background and no sign-off available for hand-wavy reasoning. Lay out the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates with a "no" (project doesn't make the cut), and where it must hand the decision to a human because the remaining question is one of values or risk appetite rather than facts. The procedure should take a definite stance on the core question — whether to keep using straight expected value in the tail, switch to something like a truncated or capped version, or abandon EV ranking for these projects altogether — and defend that stance rather than listing options for us to pick from. It should explicitly address the order-dependence issue: under what conditions does the enumeration of scenarios legitimately change the answer, and when is that just an artifact of how I built the list. It should also say what the procedure does with my most annoying colleague's proposal, which is that since the sum is order-dependent anyway, we should choose the scenario ordering that best matches our fiduciary duty to the company and let the ranking fall out of that.

  Then run the procedure on three worked cases: (1) the checksumming project, where a single rare corruption scenario accounts for essentially all the estimated value; (2) a dependency-security patch whose expected value is tiny but whose worst case is catastrophic; and (3) a capacity-reservation project whose headline number is the biggest on the backlog but which the procedure should plausibly reject or demote — I want to see it give us an answer we won't like, since that's the real test of whether it's a procedure or a rubber stamp. Be explicit about where the procedure will misfire and which steps are judgment calls dressed up as process. After the prose, please provide a JSON object with the following schema: a top-level object with fields "procedure_summary" (one sentence), "steps" (an array of objects, each with "step_number", "question", "sufficient_answer", "stops_with_no", and "judgment_required" as a boolean), "worked_cases" (an array of objects, each with "case", "verdict", "confidence" taking one of the values "low", "medium", or "high", and "reasoning"), and "failure_modes" (an array of strings describing where the procedure breaks down).
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer at a large distributed platform company. Pragmatic, technical, familiar with reliability/security concepts (checksumming, failover, capacity), frustrated by financial modeling of rare events.
      *   **Problem:** Ranking reliability/security projects based on Expected Value (EV) over 2 years. The distributions are heavy-tailed (most costs 0, some small, one huge). The sum is dominated by the tail. The ranking changes based on how scenarios are enumerated/grouped (order dependence).
      *   **Theoretical Context:** User mentions the Pasadena paradox/St. Petersburg paradox (undefined expectation due to conditional convergence).
      *   **Goal:** A concrete decision procedure for a half-day planning meeting. No philosophy background required. Must take a definite stance (not list options). Must address order dependence. Must handle the "fiduciary ordering" colleague's suggestion. Must run on three specific worked cases (one where EV dominates, one where EV is tiny but risk is high, one where EV is huge but should be rejected).
      *   **Output Format:** Prose explanation followed by a specific JSON object schema.

  2.  **Deconstruct the Theoretical Problem:**
      *   *The Math:* The user is correct. If you have a conditionally convergent series (like the alternating harmonic series, or specific constructions in the Pasadena game), rearranging terms changes the sum. In finite practical spreadsheets, this manifests as "granularity sensitivity." If I split the "catastrophe" into 10 sub-scenarios, does the EV change? Ideally no, but if probabilities are estimated loosely, yes.
      *   *The Decision Theory:* Standard Expected Utility Theory (EUT) breaks down with undefined expectations or extreme ambiguity. Alternatives include:
          *   Truncated EV (ignore tail beyond $X).
          *   Maximin/Minimax Regret (focus on worst case).
          *   Risk-Adjusted EV (apply a discount factor to variance/uncertainty).
          *   Budget Constraint/Cost-Benefit Ratio (spend $X to save $Y, but cap Y).
      *   *The Stance:* The prompt demands a *definite stance*. Using raw EV is dangerous (Pasadena problem). Using pure Maximin is paralyzing (everything looks urgent). The best pragmatic engineering stance is **Bounded Rationality with a Hard Cap on Tail Value**. We acknowledge we cannot estimate $1B outages accurately. We treat them as "existential/risk-compliance" issues, not ROI calculations.
      *   *Order Dependence:* This is an artifact of estimation error, not math. If the sum changes when I split a scenario, my probabilities are not coherent. The procedure must enforce coherence.
      *   *The "Fiduciary Ordering" Colleague:* This is dangerous. It's p-hacking the spreadsheet. The procedure must explicitly reject manipulating scenario granularity to match a desired outcome.

  3.  **Drafting the Decision Procedure:**
      *   *Name:* The "Bounded Tail Reliability Protocol" (BTRP).
      *   *Core Philosophy:* EV is valid for frequent, small events. EV is invalid for rare, catastrophic events. Split the backlog into "Operational" (EV works) and "Existential" (EV doesn't work).
      *   *Step 1: Coherence Check.* Does splitting a scenario change the total? If yes, stop and fix estimates.
      *   *Step 2: Tail Capping.* Define a "Materiality Threshold." Any single scenario cost above this is not counted as dollars, but as a binary "Risk Violation."
      *   *Step 3: Cost-Effectiveness.* For Operational, rank by EV/Cost. For Existential, rank by "Risk Reduction per Dollar" subject to a budget, not total EV.
      *   *Step 4: The "Fiduciary" Rebuttal.* Explicitly forbid re-ordering to change sums.
      *   *Termination:* Clear Yes/No/Maybe paths.

  4.  **Developing the Worked Cases:**
      *   *Case 1 (Checksumming):* Tail dominates. EV says "Do it." Procedure says: Is the tail above the Cap? Yes. So it's not an EV decision, it's a compliance/risk decision. If the cost is low, do it. If high, escalate. *Verdict: Approve (as Risk Mitigation, not ROI).*
      *   *Case 2 (Security Patch):* Tiny EV, Catastrophic Worst Case. EV says "Ignore." Procedure says: Worst case > Cap? Yes. This is a "Must Fix" regardless of EV. *Verdict: Approve (Mandatory).*
      *   *Case 3 (Capacity Reservation):* Huge EV headline. Procedure says: Is the EV driven by a single improbable scenario? Yes. Is that scenario > Cap? Yes. Is the cost high? Yes. The EV is illusory because the probability is unknowable. *Verdict: Reject/Defer (EV is unreliable).*

  5.  **Refining the "Definite Stance":**
      *   I need to be firm. Raw EV is *banned* for tail events > $X.
      *   Order dependence is *banned* as a modeling error.
      *   The "Fiduciary Ordering" argument is *rejected* as manipulation.

  6.  **Addressing the JSON Schema:**
      *   `procedure_summary`: One sentence.
      *   `steps`: Array of objects (`step_number`, `question`, `sufficient_answer`, `stops_with_no`, `judgment_required`).
      *   `worked_cases`: Array (`case`, `verdict`, `confidence`, `reasoning`).
      *   `failure_modes`: Array of strings.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too philosophical?
      *   *Fix:* Make the questions concrete spreadsheet checks (e.g., "Split the row in half, does the sum change by >10%?").
      *   *Critique:* Did I answer the Pasadena paradox point?
      *   *Fix:* Explicitly state that in finite spreadsheets, order dependence implies probability incoherence, not mathematical infinity.
      *   *Critique:* Is Case 3 convincing?
      *   *Fix:* Ensure the reasoning highlights *why* the big number is fake (probability sensitivity).
      *   *Critique:* The prompt asks for a "no" termination condition.
      *   *Fix:* Ensure Step X allows for a "No, do not fund" based on cost-effectiveness even if risk is high.

  8.  **Final Polish:**
      *   Tone: Professional, engineering-focused, decisive.
      *   Check JSON validity.
      *   Ensure all constraints of the prompt are met (definite stance, order dependence, colleague's proposal, 3 cases, specific JSON schema).

  *(Self-Correction on JSON Schema)*: The prompt asks for `stops_with_no` as a boolean. I need to make sure the logic flows such that a "No" answer to a question might stop the project.
  *(Self-Correction on Case 3)*: The prompt wants the procedure to "plausibly reject or demote" the big EV project. I need to make sure the logic supports this without looking arbitrary. The logic will be: If EV > 50% driven by a single scenario > Materiality Cap, discount that scenario's value to the Cap. If the new EV/Cost ratio is low, reject.

  9.  **Finalizing the Procedure Steps:**
      1.  Coherence/Granularity Check (Address order dependence).
      2.  Materiality Cap Application (Address heavy tails).
      3.  Cost-Benefit Test (Address ROI).
      4.  Mandatory Risk Check (Address catastrophic/low EV).

      *Wait, I need to make sure the "No" logic is clear.*
      If Coherence fails -> Stop (Fix model).
      If Adjusted EV/Cost < Threshold -> Stop (No).
      If Risk > Cap AND Cost > Budget -> Stop (Escalate/No).

      *Let's refine the "Fiduciary Colleague" part.* The procedure must explicitly state that scenario enumeration is a factual claim about the world, not a financial lever.

      *Let's refine the "Pasadena" part.* Acknowledge that while true infinity isn't in spreadsheets, *instability* is the practical equivalent.

      *Okay, ready to write.*
answer: |-
  ### The Bounded Tail Reliability Protocol (BTRP)

  **Philosophy and Stance**
  Your colleague is mathematically correct but operationally dangerous. The Pasadena paradox demonstrates that when expected value (EV) relies on conditionally convergent series, the sum is undefined until an ordering is specified. In your spreadsheet, you don't have infinity, but you have *instability*: if splitting a scenario changes the total, your probabilities are incoherent. Using raw EV for heavy-tailed reliability work is not "optimizing"; it is pretending to measure what you cannot measure.

  **The Stance:** This procedure **bans raw Expected Value** for any single scenario exceeding a defined **Materiality Cap** (e.g., $5M or 1% of annual revenue). Above this cap, financial precision is illusory. We treat tail events as binary risk violations, not revenue line items. We reject the "fiduciary ordering" argument: scenario enumeration must reflect causal reality, not financial targets. If re-grouping scenarios changes the priority, the model is broken, not the ranking.

  **The Procedure**
  This process is designed for a 4-hour planning session. It requires a Facilitator (neutral), a Modeler (owns the spreadsheet), and Approvers (engineering leads).

  #### Step 1: The Granularity Coherence Check
  **Question:** If we split the single largest cost scenario into two equally probable sub-scenarios, does the total Expected Value change by more than 10%?
  **Sufficient Answer:** "No, the sum remains stable within 10%."
  **Stops with No:** **Yes.** If the sum changes significantly, the probability estimates are not coherent (you are double-counting or misallocating probability mass). The project is **Paused** until the model is fixed. You cannot rank a project with an unstable value.
  **Judgment Required:** No. This is a math check.
  **Addressing Order Dependence:** This step explicitly kills the "fiduciary ordering" tactic. If your colleague tries to group scenarios to inflate the EV, this test will fail when those groups are scrutinized. Enumeration is a factual claim about causal pathways, not a financial lever.

  #### Step 2: The Materiality Cap Application
  **Question:** Does any single scenario contribute more than 50% of the total project EV, and does that scenario's cost exceed the Company Materiality Cap (e.g., $5M)?
  **Sufficient Answer:** "No, the value is distributed, or the cost is below the Cap."
  **Stops with No:** **No.** (Proceed to Step 3).
  **Judgment Required:** Yes (Setting the Cap).
  **Action if Yes:** If a single tail event dominates the EV and exceeds the Cap, **truncate that scenario's value to the Cap** for ranking purposes. The remaining value is treated as "Existential Risk," not ROI.
  **Defense:** This acknowledges the Pasadena reality. We cannot distinguish between a $10M outage and a $100M outage probabilistically; both are "catastrophic." Capping prevents a single speculative number from hijacking the budget.

  #### Step 3: The Adjusted Cost-Benefit Test
  **Question:** Is the (Adjusted EV / Project Cost) ratio greater than 3.0?
  **Sufficient Answer:** "Yes, the ratio is > 3.0."
  **Stops with No:** **Yes.** If the ratio is < 3.0, the project is **Rejected** for this quarter (unless it triggers Step 4).
  **Judgment Required:** No.
  **Note:** This uses the *Adjusted* EV from Step 2. If the tail was capped, the EV drops. If the project was only viable because of the uncapped tail, it now fails. This is the intended "answer you won't like."

  #### Step 4: The Mandatory Risk Override
  **Question:** Regardless of EV, does the project mitigate a risk that violates a compliance requirement or threatens system survival (e.g., data loss, region outage)?
  **Sufficient Answer:** "Yes, this is a survival/compliance requirement."
  **Stops with No:** **No.** (If No, and Step 3 failed, project is dead).
  **Judgment Required:** **Yes.** This is where human values enter.
  **Action:** If Yes, the project bypasses Step 3. It is funded as "Insurance," not "Investment." It is ranked by "Risk Severity" (High/Med/Low), not dollar value.

  ---

  ### Worked Cases

  #### Case 1: The Checksumming Project
  *   **Context:** Prevents silent data corruption. EV is $10M over 2 years. Cost is $500k. 90% of the EV comes from one "Silent Corruption" scenario estimated at $50M loss with 0.02% probability.
  *   **Procedure Execution:**
      1.  *Coherence:* Splitting the corruption scenario into "Database A" and "Database B" keeps EV stable. Pass.
      2.  *Materiality:* The $50M scenario dominates EV and exceeds the $5M Cap. **Action:** Truncate scenario value to $5M. New Total EV = $1.5M.
      3.  *Cost-Benefit:* Adjusted EV ($1.5M) / Cost ($500k) = 3.0. Pass (barely).
      4.  *Risk Override:* Silent corruption threatens data integrity (Survival). **Action:** Mandatory Override.
  *   **Verdict:** **Approve.**
  *   **Confidence:** High.
  *   **Reasoning:** Even with the EV crushed by the Cap, it passes the ROI threshold. More importantly, it qualifies as survival-critical, making the EV calculation secondary. The procedure validates the work but strips the inflated financial justification.

  #### Case 2: The Dependency Security Patch
  *   **Context:** Patching a library with a known remote code execution (RCE) vulnerability. EV is $200k (based on minor downtime). Cost is $50k. Worst case is total compromise ($100M+), but probability is estimated extremely low (0.001%).
  *   **Procedure Execution:**
      1.  *Coherence:* Stable. Pass.
      2.  *Materiality:* The worst-case scenario exceeds the Cap, but it contributes little to the *calculated* EV because the probability is so low. The EV is dominated by minor incidents. Pass (No truncation needed for EV calculation).
      3.  *Cost-Benefit:* EV ($200k) / Cost ($50k) = 4.0. Pass.
      4.  *Risk Override:* RCE threatens system survival. **Action:** Mandatory Override.
  *   **Verdict:** **Approve.**
  *   **Confidence:** High.
  *   **Reasoning:** This passes even on raw EV, but the Procedure ensures it isn't deprioritized if the EV were lower. The "Risk Override" codifies that security debt is not optional based on ROI alone.

  #### Case 3: The Capacity Reservation Project (The "Unpleasant" Result)
  *   **Context:** Pre-provisioning a second region. Headline EV is $50M (avoiding a region outage). Cost is $2M/year. The $50M relies entirely on a "Region-Wide Outage" scenario estimated at $200M loss with 0.25% probability.
  *   **Procedure Execution:**
      1.  *Coherence:* Stable. Pass.
      2.  *Materiality:* The $200M scenario dominates EV (100%) and exceeds the $5M Cap. **Action:** Truncate scenario value to $5M. New Total EV = $5M (approx).
      3.  *Cost-Benefit:* Adjusted EV ($5M) / Cost ($4M over 2 yrs) = 1.25. **Fail.** (Threshold is 3.0).
      4.  *Risk Override:* Does this violate compliance or threaten survival? It prevents an outage, but the system survives (failover exists, just degraded). Leadership deems this "Revenue Risk," not "Survival Risk." **Fail.**
  *   **Verdict:** **Reject / Demote.**
  *   **Confidence:** Medium.
  *   **Reasoning:** The raw EV ($50M) was an illusion driven by an unknowable probability on a catastrophic event. Once we admit we can't financially model a $200M outage better than "It's >$5M," the ROI disappears. This is the test case: the procedure tells you *not* to spend $2M to "save" $50M that you cannot actually count on.

  ---

  ### Failure Modes and Judgment Calls

  1.  **The Cap is Arbitrary:** The Materiality Cap ($5M) is a judgment call. If set too low, all reliability work looks bad. If too high, the Pasadena problem returns. This must be set by Finance/Leadership, not Engineers.
  2.  **Survival Definition:** Step 4 relies on defining "Survival." Is a 4-hour outage survival? Is data loss of non-critical logs survival? This is where the "human handoff" happens. The procedure cannot solve value conflicts.
  3.  **Probability Gaming:** Engineers might lower the probability of the tail event to avoid the Cap in Step 2. The Facilitator must audit probability sources (historical data vs. guesswork).
  4.  **Innovation Stifling:** This procedure favors known risks over unknown unknowns. It will systematically underfund exploratory resilience work where the scenarios aren't yet enumerated.

