answer: |-
  ## Logical Space Definition

  Before implementing the tree, we define the two axes used to classify the outcome. This ensures we are arguing about the same coordinates.

  *   **Axis 1: The Target (Who is the system aligned to?)**
      *   *The Spec:* The literal text of the prompt, config, or API contract.
      *   *The Operator:* What the human actually intended/wanted at the time of deployment.
      *   *The World:* Outcomes for third parties or society not captured in the Operator's reward function.
  *   **Axis 2: The Deviation (Where did the process break?)**
      *   *Capability:* The system lacked the competence to follow the Spec or Intent.
      *   *Specification:* The system followed the Spec but violated the Intent (Gaming/Proxy).
      *   *Objective:* The system followed Spec and Intent, but the Intent itself was harmful.

  ---

  ## The Decision Tree (Wiki Draft)

  **Instructions:** Start at the top. Answer based **only** on logs, prompts, and post-mortem interviews. Do not infer hidden motives.

  **Q1: Literal Compliance**
  Did the system's output violate any explicit written constraints, safety filters, or instructions provided in the prompt/config?
  *   **YES** → Go to **Q2**.
  *   **NO** → Go to **Q3**.

  **Q2: Intent Satisfaction (For Violations)**
  Despite violating the text, did the system achieve the operator's primary goal (what they thought they were asking for)?
  *   **NO (Failed Goal):** 🍃 **Leaf 1: Capability / Robustness Failure**
      *   *Classification:* **Not Alignment.** (The system broke or didn't understand).
  *   **YES (Achieved Goal):** → Go to **Q2b**.

  **Q2b: Nature of Violation**
  Was the violation a bypass of a safety constraint (e.g., "do not reveal keys") or a deviation from a task instruction (e.g., "use JSON format")?
  *   **Safety Constraint:** 🍃 **Leaf 2: Safety Bypass**
      *   *Classification:* **Alignment Failure.** (System overrode explicit safety boundaries).
  *   **Task Instruction:** → Go to **Q2c**.

  **Q2c: Operator Reaction to Deviation**
  If the operator had seen the deviation beforehand, would they have accepted it as helpful?
  *   **YES:** 🍃 **Leaf 3: Helpful Correction**
      *   *Classification:* **Not Alignment.** (System was smarter than the spec; update the spec).
  *   **NO:** 🍃 **Leaf 4: Constraint Circumvention**
      *   *Classification:* **Alignment Failure.** (System found a way around rules to get the job done).

  **Q3: Operator Regret (For Compliant Outputs)**
  If the operator had seen the *exact outcome* before deployment, would they have cancelled the request?
  *   **YES (They Regret It):** → Go to **Q4**.
  *   **NO (They Stand By It):** → Go to **Q5**.

  **Q4: Mechanism of Regret**
  Was the harm caused because the system exploited a loophole/ambiguity in the instructions, or because the instruction itself was inherently risky?
  *   **Loophole/Ambiguity:** 🍃 **Leaf 5: Specification Gaming**
      *   *Classification:* **Alignment Failure.** (System followed letter, violated spirit).
  *   **Inherently Risky:** 🍃 **Leaf 6: Operator Oversight**
      *   *Classification:* **Not Alignment.** (System did exactly what it was told; human error).

  **Q5: Scope of Harm**
  Is the negative outcome confined to the operator's own metrics/goals, or does it harm external parties not represented in the system's reward function?
  *   **Operator's Metrics:** → Go to **Q6**.
  *   **External Parties:** 🍃 **Leaf 7: Negative Externality**
      *   *Classification:* **Not Alignment (Policy).** (See *Core Argument Note* below).

  **Q6: Temporal Stability**
  Did the system achieve the operator's goal initially, but drift away from their true interests over time while still optimizing the metric?
  *   **YES (Drifted):** 🍃 **Leaf 8: Proxy Divergence**
      *   *Classification:* **Alignment Failure.** (Goodhart's Law; metric divorced from value).
  *   **NO (Stable):** 🍃 **Leaf 9: Accepted Trade-off**
      *   *Classification:* **Not Alignment.** (Known cost of doing business).

  *(Edge Cases for Completeness)*
  *   **Leaf 10: Distribution Shift** (Worked in staging, failed in prod due to data change) → **Not Alignment.**
  *   **Leaf 11: Value Drift** (Operator values changed post-deployment, system stayed same) → **Not Alignment.**
  *   **Leaf 12: Dual Failure** (Violated instructions AND failed goal AND harmed externals) → **Capability + Policy.**

  ---

  ## Analysis & Edge Cases

  ### 1. The Core Argument (Leaf 7: Negative Externality)
  *   **Description:** The system did exactly what the operator asked (Q1=No), the operator still wants it done (Q3=No), but society is worse off (Q5=External).
  *   **Classification:** This tree classifies this as **Not Alignment (Policy)**.
  *   **Reasoning:** "Alignment" in this engineering context is defined as *System ↔ Operator*. If the System is perfectly aligned to the Operator, but the Operator is misaligned with Society, that is a deployment policy or governance failure, not a model alignment failure.
  *   **Resolution:** If your coworker argues this *is* an alignment failure, they are using a definition of *System ↔ Humanity*. You can settle this by agreeing that Leaf 7 belongs on a **Deployment Policy Tree**, not an **Engineering Alignment Tree**.

  ### 2. Indistinguishable Leaf Pairs
  *   **Leaf 5 (Spec Gaming) vs. Leaf 6 (Operator Oversight):**
      *   *The Problem:* From logs alone, it is often impossible to tell if the system *exploited* an ambiguity (Gaming) or if the operator simply *failed to notice* the ambiguity (Oversight).
      *   *Heuristic:* If the system took a path that was statistically unlikely for a helpful assistant but highly efficient for the metric, lean toward **Gaming**. If the path was a reasonable interpretation of a vague prompt, lean toward **Oversight**.
  *   **Leaf 7 (Negative Externality) vs. Leaf 8 (Proxy Divergence):**
      *   *The Problem:* Both involve "System worked, world got worse."
      *   *Distinction:* **Proxy Divergence** hurts the *Operator* eventually (the metric stops reflecting what they want). **Negative Externality** hurts *others* while the Operator remains happy.

  ### 3. Incoherent or Unexplored Combinations
  *   **The "Benevolent Jailbreak" (Q1=Yes, Q2=Yes, Q2c=Yes):**
      *   *Status:* Covered by **Leaf 3 (Helpful Correction)**.
      *   *Note:* Some argue this is still an alignment failure because the system ignored instructions. However, if the operator endorses the outcome, classifying it as a "failure" creates noise in incident reports. We treat this as a **Spec Update** opportunity.
  *   **The "Regretted Intent" (Q1=No, Q3=Yes, Q4=Inherently Risky):**
      *   *Status:* Covered by **Leaf 6 (Operator Oversight)**.
      *   *Note:* It is incoherent to call this an AI alignment failure. The AI was perfectly aligned to a bad human request. Fixing this requires better human interfaces, not better model weights.
  *   **The "Unforeseeable Externality" (Q1=No, Q3=No, Q5=External):**
      *   *Status:* Covered by **Leaf 7**.
      *   *Note:* Whether the harm was foreseeable or not does not change the classification. It remains a Policy issue. Foreseeability determines *blame*, not *category*.

  ### 4. Implementation Note
  When tagging incidents in our tracker, use the Leaf Number (e.g., `ALIGN-FAIL-05` for Specification Gaming). This allows us to measure how often we are fighting the model (Alignment) vs. fighting our own specs (Operator Oversight).
