      *   **Core Concept:** Braudel's three levels of time (Event/History of Events, Conjuncture/Cyclical History, Longue Durée/Structural History).
      *   **Task:** Apply this framework specifically to the Fall of Constantinople (1453).
      *   **Specific Requirements:**
          *   Map facts to each of the three layers (Event, Conjuncture, Longue Durée).
          *   Identify what each layer explains and what it *doesn't* explain.
          *   Critique the model: Where does it break? (Timing issues, individual agency vs. structure, the "inevitability" paradox).
