      *   *Preface:* I believe $C_1$, I believe $C_2$... I believe the book has an error. (Contradiction: if all $C_i$ are true, no error).
      *   *Key Tensions:*
          1.  High Probability $\rightarrow$ Belief? (Lockean Thesis)
          2.  Belief Agglomeration? ($B(p) \land B(q) \rightarrow B(p \land q)$)
          3.  Consistency Requirement? ($B(p) \rightarrow \neg B(\neg p)$ / Rational belief sets must be consistent)
          4.  Belief vs. Credence/Acceptance? (Maybe we don't *believe* lottery props, just have high credence).
          5.  Lottery vs. Preface Symmetry? (Are they the same problem?)

