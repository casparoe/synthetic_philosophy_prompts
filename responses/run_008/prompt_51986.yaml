answer: |-
  ### The Case: The Hospice Thermostat

  Two patients occupy isolated rooms in a hospice wing, unable to communicate or perceive one another's condition. Patient H is comfortable (welfare 8), while Patient L is in significant pain (welfare 2). A mechanical fault causes the heating in H's room to fail, lowering their comfort (welfare 6) without affecting L. The fault is undetected, generates no cost savings, alters no staff behavior, and produces no psychological side-effects like envy or relief; it is a pure loss of welfare for H with no compensating gains for anyone else.

  ### The Walkthrough

  Let the two states be **A** (Status Quo: 8, 2) and **B** (Leveled Down: 6, 2).

  **(a) Total Utilitarianism:** Values the sum of welfare.
  *   State A: $8 + 2 = 10$.
  *   State B: $6 + 2 = 8$.
  *   **Verdict:** A is better than B.

  **(b) Ordinary Prioritarianism:** Values the sum of transformed welfare, $\sum f(u_i)$, where $f$ is strictly increasing and concave.
  *   State A: $f(8) + f(2)$.
  *   State B: $f(6) + f(2)$.
  *   **Verdict:** Since $f$ is strictly increasing, $f(8) > f(6)$. Therefore, A is better than B. This holds for *any* concave function because ordinary prioritarianism is person-separable; the moral value of H's welfare does not depend on L's standing.

  **(c) Telic Egalitarianism:** Values equality intrinsically (e.g., minimizing the gap).
  *   State A: Gap is $8 - 2 = 6$.
  *   State B: Gap is $6 - 2 = 4$.
  *   **Verdict:** B is better than A (less inequality).

  **(d) Relative Prioritarianism:** Values welfare weighted by relative standing. We operationalize the view as $V = \sum u_i \cdot w_i$, where weight $w_i = 1 - (u_i - \bar{u})$. (This captures the motivation: weights drop as one rises above the average $\bar{u}$, becoming negative if the deviation is large enough).
  *   **State A:** Average $\bar{u} = 5$.
      *   H: $u=8$, deviation $+3$, weight $1-3 = -2$. Contribution: $8 \times -2 = -16$.
      *   L: $u=2$, deviation $-3$, weight $1-(-3) = 4$. Contribution: $2 \times 4 = 8$.
      *   Total Value: $-8$.
  *   **State B:** Average $\bar{u} = 4$.
      *   H: $u=6$, deviation $+2$, weight $1-2 = -1$. Contribution: $6 \times -1 = -6$.
      *   L: $u=2$, deviation $-2$, weight $1-(-2) = 3$. Contribution: $2 \times 3 = 6$.
      *   Total Value: $0$.
  *   **Verdict:** B (0) is better than A (-8). The loss to H counts as a net improvement because H is sufficiently above average that their welfare carries negative moral weight.

  ### Analysis

  **The Driving Feature:**
  The result is driven by **non-separability**. In Ordinary Prioritarianism, H's moral weight is fixed by their absolute level. In Relative Prioritarianism, H's weight depends on L's welfare (via the average). By lowering H, you not only change H's utility but also shift the average, which recalibrates the moral weights of *both* parties. In this specific arithmetic, the reduction in H's "negative weight" penalty outweighs the loss of utility.

  **Stripping the Feature:**
  If you strip out the relative component (making weights depend only on absolute $u_i$), the view collapses into Ordinary Prioritarianism. The loss to H would simply be weighted by a fixed number (e.g., 0.5), resulting in a net loss. The "Leveling Down" implication vanishes immediately.

  **Defender's Reply Options:**
  A defender of Relative Prioritarianism has three honest options:
  1.  **Bite the Bullet:** Accept that B is all-things-considered better. This aligns with the "comparative deprivation" motivation: if H's comfort was socially corrosive (even if unperceived), removing it is good.
  2.  **The Temkin Move:** Argue that B is *pro tanto* better (distributionally) but all-things-considered worse because the disvalue of welfare loss dominates the value of equality. This saves the view from absurdity but concedes that the theory generates a "bad" pro tanto reason.
  3.  **Cap the Weights:** Modify the view so weights never drop below zero. This avoids calling the loss an "improvement," but the view still faces a *weak* leveling-down objection: it would judge the loss as *less bad* than Utilitarianism does, implying inequality reduction has value even when no one gains.

  **Limitations:**
  This case does not threaten Ordinary Prioritarianism. As shown in (b), OP is immune because its separability prevents the "rich" person's loss from ever being revalued as a gain based on the "poor" person's status. The case specifically targets the *relative* modification of the prioritarian view.
