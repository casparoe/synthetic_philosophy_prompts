answer: |-
  # Joint Statement on Futarchy Feasibility
  **Participants:** Proponent (Hansonian), Skeptic (Governance Focus)
  **Date:** October 26, 2023

  ### I. Agreed Claims
  1.  **Forecasting Track Records:** Aggregated market probabilities consistently outperform individual experts and polls on resolvable, binary events with clear settlement criteria (e.g., election outcomes, quarterly earnings).
  2.  **Institutional Failures:** Existing democratic institutions systematically struggle to aggregate dispersed information and incentivize long-term planning, often due to rational ignorance and short election cycles.
  3.  **Market Limits:** Prediction markets are vulnerable to manipulation attempts, though historical data suggests subsidized manipulation often fails against liquid markets with clear resolution—*unless* the manipulator values the decision outcome more than market profits.
  4.  **Metric Sufficiency:** Accurate market forecasting regarding a specified metric does **not** guarantee improved social welfare. If the welfare metric is poorly specified, futarchy will efficiently optimize for the wrong outcome (Goodhart's Law).
  5.  **Definition of Failure:** A futarchy system fails if it produces policies that decrease constituent well-being, regardless of whether the markets correctly predicted the metric movements associated with those policies.

  ### II. Table of Disagreements

  | Topic | Proponent Position | Skeptic Position |
  | :--- | :--- | :--- |
  | **Primary Bottleneck** | The epistemic problem (aggregating beliefs) is the hard part; markets solve this better than any alternative. | The normative problem (defining values) is the hard part; markets cannot solve political disagreement about what counts as "welfare." |
  | **Manipulation Viability** | Manipulation is self-defeating; actors willing to trade against truth to move prices will lose capital to truth-seekers. | Policy actors will treat market losses as campaign expenditures; wealthy actors will subsidize markets to cross decision thresholds. |
  | **Counterfactual Resolution** | Markets can price conditionals (e.g., "GDP if Policy A") using rules/oracles without real-world realization of Policy A. | Markets pricing unadopted policies lack a feedback loop; without real-world settlement, prices drift based on speculation, not truth. |

  ### III. Cruxes & Pre-Registered Tests

  **Crux 1: Separation of Values and Beliefs**
  *The Dispute:* The Proponent argues a welfare metric (e.g., GDP + mortality) can be agreed upon ex-ante, separating *what we want* from *how to get it*. The Skeptic argues metric definition smuggles in causal beliefs (e.g., weighting GDP over inequality implies a belief about what matters), making the "vote on values" stage inherently political and manipulable.
  *   **Test:** A committee of opposing ideological stakeholders attempts to draft a single welfare metric for immigration policy without including causal stipulations (e.g., "crime rate" vs. "unjust incarceration rate").
  *   **Predictions:**
      *   **Pro:** A metric acceptable to all parties can be drafted within 3 rounds of revision.
      *   **Skeptic:** The process will stall indefinitely as parties dispute which variables count as "benefits" vs. "costs."

  **Crux 2: Manipulation as Campaign Spending**
  *The Dispute:* The Proponent believes manipulators lose money to arbitrageurs. The Skeptic believes actors with strong policy preferences will accept financial loss in the market as the cost of influencing the governance decision.
  *   **Test:** A simulated decision market where a specific policy passes if the market price > 50%. An actor values the policy passage at $10M but can only profit $1M from accurate trading.
  *   **Predictions:**
      *   **Pro:** The actor will not subsidize the market beyond expected profit; arbitrageurs will correct the price.
      *   **Skeptic:** The actor will spend up to $10M to push the price over 50%, treating the loss as a donation to secure the policy.

  **Crux 3: The Conditional-on-Decision Problem**
  *The Dispute:* The Proponent trusts oracles/rules to settle counterfactuals (what *would* have happened). The Skeptic argues that without the policy actually being enacted, there is no ground truth, making the market susceptible to drift or oracle manipulation.
  *   **Test:** Run parallel decision markets on Policy A and Policy B. Implement only Policy A. Compare Market B's final price against a delayed expert consensus on what *would* have happened under B.
  *   **Predictions:**
      *   **Pro:** Market B's price will correlate strongly with expert consensus (r > 0.8).
      *   **Skeptic:** Market B's price will diverge significantly from consensus due to lack of settlement feedback (r < 0.5).

  ### IV. Note on Verbal Disagreement
  We identify a potential verbal disagreement regarding **"Resolution."** The Proponent defines resolution broadly to include oracle adjudication based on observed data proxies. The Skeptic defines resolution narrowly as actual real-world outcome verification. If "resolution" is defined as oracle adjudication, the Proponent's claims about market accuracy hold; if defined as real-world verification, the Skeptic's concerns about counterfactual drift hold. Clarifying this definition may reduce the perceived gap on Crux 3.

  ### V. Conclusion
  We agree that markets are superior epistemic tools for specific questions but disagree on whether governance can be reduced to metric optimization. Future work must focus on the robustness of welfare metrics against adversarial specification, not merely market liquidity.
