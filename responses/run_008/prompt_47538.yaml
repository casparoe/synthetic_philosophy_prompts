prompt: |-
  Me and a friend have been arguing about futarchy for like a decade now — he's basically a Hansonian ("vote on values, bet on beliefs" is the least bad governance proposal anyone's actually specified), and I'm the skeptic who thinks it optimizes for whatever the market metric measures rather than what anyone wants, and that the values-side is the actual weak link, not the market epistemics. We finally decided to do this properly, adversarial-collaboration style. Draft the joint statement we should end up with: numbered claims we can both sign (about expert forecasting track records, the failures of existing political institutions to aggregate dispersed info, what prediction markets have demonstrably done well at corporate-style questions, what counts as a real failure), then a table of exact disagreements phrased so each of us would accept our own side's wording. Then the cruxes — I want at least: whether values and beliefs can actually be separated the way futarchy needs (or whether defining the welfare metric smuggles beliefs back in), whether manipulation self-defeats because manipulators lose money (his favorite move) or whether wealthy actors with policy preferences will happily pay, and the conditional-on-decision problem for decision markets (how do you keep the market honest about what would happen under policies that will never be adopted). For each crux give a concrete test or thought experiment we'd both agree bears on it, with our predictions written down in advance. He'll try to keep the whole thing focused on market performance; make sure the statement doesn't quietly concede that if markets are epistemically great, futarchy follows. And if some of our disagreement turns out to be verbal rather than real, say which part. Format as agreed-claims list + disagreements table + crux section, no more than maybe 1200 words.
