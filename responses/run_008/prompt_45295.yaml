prompt: |-
  I'm taking a philosophy of law class this semester and my term paper is on what makes consent actually valid — when deception, coercion, or incompetence means the "yes" doesn't count. Before I start evaluating theories I want the spec first: what does any adequate theory of valid consent have to deliver? Not the theories themselves — the requirements list, with the case or consideration behind each one.

  Cases I think it has to handle (tell me if I'm missing big ones or if any of these are actually two cases wearing a trenchcoat): stealthing — she said yes to sex but not unprotected sex, so consent has to be specific, but how specific?; lying about contraception vs. lying about your feelings — fraud seems to invalidate consent to surgery (the fake doctor case) but not consent to sex when the lie is about love, and I can't tell if that's a real distinction or courts just being squeamish; quid pro quo threats — "sleep with me or you're fired" is coercion, "sleep with me and I'll promote you" is supposedly just a gross offer, and the theory has to say where that line is and why; the drunk person; Ulysses contracts / advance directives (can I bind a future self that will disagree?); the sweatshop case, where I only "agree" to the wage because the whole global background leaves me nothing better — does validity track just the proximate threatener or the entire causal history?; and the newer one, algorithmic manipulation, like a betting app that learns exactly when you're weakest and times its "confirm your deposit?" screen for that moment — is that coercion, deception, or neither, and does the theory have to have an answer? Also: does a theory owe us a verdict on whether consent is binary or comes in degrees? I suspect that does alot of quiet work everywhere and nobody says it out loud.

  Then mark which requirements are non-negotiable and which are just one camp's prejudice dressed up as a demand. And here's the part I actually most want, for the paper: I have a hunch you can't jointly have (a) consent staying valid under nonideal background conditions and (b) consent doing the moral work we ask of it in ordinary contracts, medicine, and sex — without the theory sliding into either "consent never invalidates anything" or "consent invalidates nearly everything." Is that right, or is there a way out I'm not seeing? If some subset of the desiderata is genuinely jointly unsatisfiable, say so plainly, because the list itself might be my thesis.

  Skip the scorecard of existing theories, I'll do that part myself. And dont be polite about my framing — if one of my "requirements" is just me smuggling in the conclusion I want, or if the whole list-of-desiderata approach fits badly here, say that straight. I'd rather find out from you than in my professor's margin comments. Also flag anywhere you're genuinely unsure — the paper needs my confidence calibrated, not inflated.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Philosophy of Law / Ethics of Consent.
      *   **Task:** Define the *specifications* (desiderata/requirements) for an adequate theory of valid consent, *not* evaluate existing theories.
      *   **Specific Cases to Address:** Stealthing (specificity), Fraud (contraception vs. feelings), Coercion vs. Offers (QPD), Intoxication, Ulysses Contracts/Advance Directives, Structural Coercion (Sweatshops), Algorithmic Manipulation.
      *   **Specific Question:** Is consent binary or scalar?
      *   **Critical Task:** Distinguish non-negotiable requirements from ideological prejudices.
      *   **Core Hypothesis to Test:** The user suspects a tension/trilemma: (a) Validity under non-ideal background conditions + (b) Consent doing moral work (transformative power) $\rightarrow$ leads to either (c) Consent never invalidates anything OR (d) Consent invalidates nearly everything. Is this right? Is there a way out?
      *   **Tone:** Direct, critical, not polite, calibrated confidence (flag uncertainty). No theory scorecards.

  2.  **Deconstruct the "Spec List" (Desiderata):**
      *   I need to organize the user's cases into general functional requirements for a theory of consent.
      *   *Requirement 1: Specificity/Scope.* (Stealthing). Consent must be act-specific.
      *   *Requirement 2: Informational Integrity.* (Fraud). Distinguish material vs. immaterial lies.
      *   *Requirement 3: Voluntariness/Pressure.* (Coercion vs. Offers). Distinguish threats from offers, handle baseline problems.
      *   *Requirement 4: Capacity/Competence.* (Drunk person). Threshold for cognitive ability.
      *   *Requirement 5: Temporal Authority.* (Ulysses/Advance Directives). Can past self bind future self?
      *   *Requirement 6: Structural Background.* (Sweatshops). Does background injustice invalidate local consent?
      *   *Requirement 7: Manipulation/Agency.* (Algorithms). Subversion of decision-making architecture without explicit lies or threats.
      *   *Requirement 8: Granularity.* (Binary vs. Degrees).

  3.  **Critique the Requirements (Non-negotiable vs. Prejudice):**
      *   *Non-negotiable:* Capacity (you can't consent if comatose), Specificity (consent to A isn't consent to B), Voluntariness (gun to head isn't consent). These are definitional.
      *   *Contested/Prejudice:* Structural Background (Sweatshops). Libertarians say yes, valid; Marxists/Feminists say no, invalid. This is a major fault line.
      *   *Contested/Prejudice:* Fraud distinctions (Nature of act vs. Collateral). The "fraud in the factum" vs. "fraud in the inducement" distinction is legally useful but morally shaky.
      *   *Contested:* Ulysses contracts. Autonomy vs. Paternalism.

  4.  **Address the Core Hypothesis (The Trilemma):**
      *   User's hunch: You can't have valid consent in non-ideal conditions *and* have consent do robust moral work without collapsing into nihilism (nothing is valid) or formalism (everything is valid).
      *   *Analysis:* This is the "Paradox of Consent in Unjust Backgrounds."
      *   If we say background injustice *always* invalidates consent (e.g., sweatshops, survival sex), then consent loses its transformative power in the real world (Nihilism).
      *   If we say background injustice *never* invalidates consent (pure proceduralism), then consent legitimizes exploitation (Formalism/Status Quo bias).
      *   *Is there a way out?* Most theories try to thread the needle via "Baseline" problems or "Reasonable Rejectability." But the user's hunch is strong: there is a genuine tension. The "Way Out" usually involves distinguishing *validity* from *fairness* or *enforceability*. But if the paper is about *moral validity* (not just legal enforceability), the tension holds.
      *   *Verdict:* The user is onto something real. It's often called the "Idealization Problem."

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the prompt. Validate the "spec first" approach.
      *   **The Spec List (Categorized):** Group the cases into functional requirements.
          *   *Scope & Specificity:* Stealthing.
          *   *Informational Quality:* Fraud (contraception vs. love).
          *   *Voluntariness & Baselines:* Coercion vs. Offers (QPD).
          *   *Capacity:* Intoxication.
          *   *Temporal Extension:* Ulysses.
          *   *Structural Context:* Sweatshops.
          *   *Architectural Integrity:* Algorithms.
          *   *Metric:* Binary vs. Scalar.
      *   **The Critique (Non-negotiable vs. Prejudice):**
          *   Call out the Sweatshop case as the biggest ideological battleground.
          *   Call out the Fraud distinction as legally pragmatic but morally obscure.
          *   Call out Binary vs. Scalar as a category error risk.
      *   **The Core Tension (The User's Hunch):**
          *   Validate the hunch. It's the "Ideal vs. Non-Ideal Theory" problem.
          *   Explain *why* it breaks: If consent transforms rights, it needs a clean slate. Real life isn't a clean slate.
          *   Potential "Way Out": Distinguish *moral validity* (did they agree?) from *normative force* (does it bind us?). Or distinguish *transactional validity* from *background justice*.
          *   *Confidence Flag:* I need to be careful not to solve it for them, but confirm the tension exists in the literature (e.g., Anderson, Wertheimer, Alexander).
      *   **Tone Check:** Be direct. "Here's where you're smuggling ideology." "This distinction is shaky."

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* The user asked about "lying about feelings" vs. "contraception." I need to make sure I highlight that the *theory* needs to explain the distinction, not just assert it. The "fraud in the factum" doctrine is the legal proxy, but the moral theory needs to justify *why* sterility matters more than love.
      *   *Correction:* On Algorithms. Is this deception? No. Is it coercion? No. It's *manipulation*. The theory needs a category for "subversion of rational agency without force or falsehood."
      *   *Correction:* On the Trilemma. The user asks if (a) and (b) are jointly unsatisfiable. I should say: They are jointly unsatisfiable *if* you demand consent be the *sole* source of moral permission. If you allow background justice to act as a constraint *alongside* consent, you can escape. But that changes the job description of consent.
      *   *Tone:* Don't be too nice. "You're smuggling in the conclusion" -> Point out where the Sweatshop case assumes a specific view of autonomy.

  7.  **Final Polish:** Check against constraints. No theory scorecards. Flag uncertainty. Direct feedback on framing.

      *   *Uncertainty Flag:* The "Binary vs. Scalar" debate is genuinely unsettled in meta-ethics. I should flag that.
      *   *Uncertainty Flag:* The Algorithmic case is new enough that there isn't consensus.

  8.  **Final Output Structure:**
      1.  The Spec Sheet (The Requirements).
      2.  The Audit (Non-negotiable vs. Ideological).
      3.  The Trilemma (Addressing the Core Hypothesis).
      4.  Calibration/Uncertainty Flags.

  (Proceed to generate response based on this thought process.)
answer: |-
  This is a strong start. You are correctly identifying that most students jump straight to "Mill says X, Kant says Y" without defining what the theory is actually supposed to *do*. If you don't have the spec, you can't test the product.

  However, your framing contains a few traps. You are treating some contested ideological positions as "cases to be handled," which risks building the conclusion into the premises. Below is the spec list derived from your cases, followed by the audit of what is actually required versus what is contested, and finally an evaluation of your core hypothesis about the trilemma.

  ### Part 1: The Spec Sheet (Desiderata for a Theory of Consent)

  Any adequate theory must provide decision procedures for the following eight dimensions.

  **1. The Specificity Requirement (The Stealthing Case)**
  *   **The Demand:** The theory must explain how consent attaches to descriptions of actions.
  *   **The Problem:** Consent is never to "sex" or "surgery" in the abstract; it is to *tokened* events under *descriptions*. If A consents to sex with a condom, and B removes it, did A consent to the sex act?
  *   **The Spec:** The theory must define the *grain size* of consent. Does consent attach to the physical motion, the risk profile, or the normative context? It must explain why changing one variable (condom) voids the consent while changing another (lighting, position) does not.

  **2. The Materiality of Deception (The Fraud Case)**
  *   **The Demand:** The theory must distinguish between lies that invalidate consent and lies that do not.
  *   **The Problem:** Lying about being a doctor invalidates consent to sex/surgery. Lying about loving someone usually does not (legally/morally). Lying about contraception is a gray zone increasingly treated as invalidating.
  *   **The Spec:** The theory needs a criterion for *materiality*. Is it based on the "nature of the act" (fraud in the factum) vs. "inducement" (fraud in the inducement)? Or is it based on subjective deal-breakers? It must explain why some truths are conditions of the agreement and others are merely background.

  **3. The Baseline Problem (The Quid Pro Quo Case)**
  *   **The Demand:** The theory must distinguish coercive threats from non-coercive offers.
  *   **The Problem:** "Sleep with me or you're fired" (Threat) vs. "Sleep with me and you're promoted" (Offer). Both change the incentive structure. Both pressure the agent.
  *   **The Spec:** The theory must define the *moral baseline*. Is the baseline legal entitlement (you aren't entitled to the promotion), moral entitlement (you shouldn't be fired for refusing), or statistical normalcy? Without a baseline, you cannot define a threat.

  **4. The Capacity Threshold (The Drunk Person Case)**
  *   **The Demand:** The theory must set a threshold for cognitive competence.
  *   **The Problem:** Consent is not binary regarding sobriety. One drink vs. ten.
  *   **The Spec:** The theory must specify whether capacity is a *status* (you are a competent adult) or a *state* (you are competent *now*). It must explain if the threshold is fixed (BAC limit) or functional (ability to understand consequences).

  **5. Temporal Authority (The Ulysses Case)**
  *   **The Demand:** The theory must determine the authority of the past self over the future self.
  *   **The Problem:** I consent today to be restrained tomorrow when I am manic. Tomorrow I scream "no."
  *   **The Spec:** The theory must decide if autonomy is diachronic (extended over time) or synchronic (located in the present moment). It must explain when a prior commitment overrides a current objection.

  **6. Structural Validity (The Sweatshop Case)**
  *   **The Demand:** The theory must determine if background injustice invalidates local transactions.
  *   **The Problem:** Worker A agrees to wage B. But A only agrees because the alternative is starvation due to global economic structures.
  *   **The Spec:** The theory must decide if consent validates a transaction *procedurally* (was the agreement free of direct interference?) or *substantively* (were the options acceptable?). This is the hardest spec.

  **7. Architectural Integrity (The Algorithmic Case)**
  *   **The Demand:** The theory must account for sub-rational manipulation.
  *   **The Problem:** No lie is told. No threat is made. The app simply exploits cognitive bias at a moment of weakness.
  *   **The Spec:** The theory must expand "voluntariness" beyond force and fraud to include *manipulation of the decision-making architecture*. It must distinguish between *influencing* a choice (persuasion) and *hacking* the choice (exploitation of weakness).

  **8. The Metric Question (Binary vs. Scalar)**
  *   **The Demand:** The theory must state whether consent is an on/off switch or a dimmer.
  *   **The Problem:** We treat consent as binary legally (guilty/not guilty), but morally it feels scalar (more or less voluntary).
  *   **The Spec:** The theory must declare if "valid consent" is a threshold concept (once you cross 51%, it's fully valid) or if the *degree* of validity tracks the *degree* of moral permission.

  ---

  ### Part 2: The Audit (Non-Negotiable vs. Smuggled Ideology)

  You asked me to be blunt. Here is where your list smuggles in conclusions.

  **Non-Negotiable (Definitional):**
  *   **Capacity (4):** If the agent is comatose or a toddler, there is no consent. Any theory that validates this is not a theory of consent; it's a theory of paternalism.
  *   **Specificity (1):** Consent to A cannot logically be consent to Not-A. If a theory says "she consented to sex, so the condom doesn't matter," it has redefined consent to mean "submission to physical contact."
  *   **Baseline (3):** You *must* have a baseline to define coercion. However, *which* baseline you choose is ideological.

  **Ideological Prejudice Dressed as Requirement:**
  *   **Structural Validity (6):** **This is the biggest trap.** You frame the Sweatshop case as "a case the theory has to handle." But *how* it handles it splits the field.
      *   *Libertarian/Proceduralist View:* A theory *must* validate sweatshop consent if no direct coercion occurred. To do otherwise is paternalistic and denies agency to the poor.
      *   *Marxist/Feminist/Substantive View:* A theory *must* invalidate sweatshop consent because the background conditions are coercive. To do otherwise legitimizes exploitation.
      *   *The Trap:* If you write your paper assuming a theory *ought* to invalidate sweatshop consent, you have already rejected half the literature. Your spec shouldn't demand a verdict; it should demand an *explanation* of the verdict.
  *   **The Fraud Distinction (2):** You assume there *is* a real distinction between lying about contraception and lying about love. Many philosophers argue this is just courts being "squeamish" (as you noted). A robust theory might conclude *both* invalidate or *neither* invalidates (caveat emptor). Don't assume the current legal distinction is the target; assume the *moral intuition* is the target.
  *   **Binary vs. Scalar (8):** You suspect this does "quiet work." You are right. But demanding a theory pick one might be a category error. Some theories argue consent is scalar *morally* but must be binary *legally* for administrability. A theory might owe you an explanation of the gap, not a choice of one side.

  ---

  ### Part 3: The Core Hypothesis (The Trilemma)

  **Your Hunch:** You cannot jointly have (a) consent staying valid under non-ideal background conditions and (b) consent doing the moral work we ask of it (transforming permissions), without sliding into (c) nihilism (nothing is valid) or (d) formalism (everything is valid).

  **Verdict:** **You are correct.** This is the "Idealization Problem" in consent theory, and it is the strongest potential thesis for your paper.

  **Why you are right:**
  1.  **The Moral Work:** For consent to do the work we want (e.g., make sex permissible, make contracts binding), it must be a robust moral transformer. It needs to wash away prior claims.
  2.  **The Non-Ideal World:** In the real world, almost all choices are constrained by background injustice (poverty, patriarchy, systemic racism).
  3.  **The Collapse:**
      *   If you say background injustice *invalidates* consent (to protect the vulnerable), you trigger **Nihilism**. Almost no contract, marriage, or job acceptance in history is truly valid. Consent loses its transformative power because the background is never clean enough.
      *   If you say background injustice *does not invalidate* consent (to preserve agency/stability), you trigger **Formalism**. Consent becomes a magic wand that legitimizes exploitation. "They agreed" becomes a shield for "They had no choice."

  **Is there a way out?**
  There are three attempted escapes in the literature. You should test if they work.

  1.  **The "Separation of Spheres" Move:** Argue that consent validates the *transaction* but does not absolve the *background*. (e.g., The sweatshop contract is binding, but the employer still owes reparations for the injustice).
      *   *Weakness:* This feels like splitting hairs. If the contract is binding, the worker is still stuck.
  2.  **The "Reasonable Rejectability" Baseline:** Argue that consent is valid unless the alternative was *morally* unacceptable, not just *economically* bad.
      *   *Weakness:* Who defines "reasonable"? This often collapses back into paternalism.
  3.  **The "Degrees of Validity" Move:** Argue that consent in non-ideal conditions is *partially* valid. It creates some permissions but not others.
      *   *Weakness:* This creates administrative chaos. Can I rape you if I paid you 10% less than a just wage? (Obviously no, but where is the line?)

  **My Assessment:** There is no clean way out. The tension is structural. Consent is an **ideal theory concept** (presupposing roughly equal agents) applied to **non-ideal circumstances**.
  *   **Confidence Flag:** I am 90% confident this is the right read. The remaining 10% is because some theorists (like David Owens or Scott Anderson) argue consent doesn't do the "transformative" work you think it does; they argue it merely transfers authority. If consent is just authority transfer, the background matters less. But that changes the definition of consent's "moral work."

  ### Part 4: Strategic Advice for the Paper

  1.  **Don't Solve the Sweatshop Case:** Use it as a stress test. If Theory X validates sweatshop labor, does it also validate survival sex work? If Theory Y invalidates sweatshop labor, does it also invalidate all employment under capitalism? Force the theories to show their costs.
  2.  **Focus on the Baseline:** The "Quid Pro Quo" and "Sweatshop" cases are actually the same problem: **How do we set the moral baseline?** This is the engine of your paper. If you can show that every theory fails to justify its baseline non-arbitrarily, you have a killer argument.
  3.  **The Algorithmic Wildcard:** Use the algorithmic case to show that old categories (Force/Fraud) are dead. If a theory can't handle "manipulation without deception," it is obsolete. This is where you can show novelty.
  4.  **Calibration on Binary/Scalar:** Be careful here. If you argue consent is scalar, you must explain how the law could possibly function. (e.g., "Beyond a reasonable doubt" requires binaries). If you argue it's binary, you must explain the moral intuition that "yes, but..." matters.

  **Final Warning:** Your prompt asks for a "requirements list." Be careful not to present the *Sweatshop* requirement as "The theory must invalidate exploitative contracts." Present it as "The theory must explain the relationship between background justice and transactional validity." The former is a political stance; the latter is a philosophical spec. Keep that distinction sharp, or your professor will mark you down for begging the question.
