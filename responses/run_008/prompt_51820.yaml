prompt: |-
  I've been reading about dialetheism and I keep getting tangled in something I suspect does a lot of quiet work. People say paraconsistency is a property of logics and dialetheism is a thesis about the world, fine, that part is clear. But then inside paraconsistency itself there seems to be this fight about negation and the conditional that I dont really follow.

  As far as I can tell: in LP, the three-valued thing where a sentence can be both true and false, explosion fails (good, that's the point), but you also can't make modus ponens work if the conditional is just the material one defined as not-A or B. So a dialetheist who actually wants to *reason with* true contradictions, not just tolerate them, has to move to some relevant logic where the conditional is a genuinely intensional connective. Is that roughly right? Why exactly does modus ponens fail in LP -- like, what's the valuation that makes A and A→B both designated while B isn't? And what does the relevant-logic conditional buy them, and what does it cost them (I gather they lose some inferences people really like)?

  There's also something I've seen mentioned but never explained properly: if you add a separate "classical" or Boolean negation back into the relevant logic, triviality supposedly comes right back, and Priest's response is basically to say the Boolean connective is somehow incoherent or doesn't express a genuine negation. What's going on there? It feels like a weird move to say a perfectly well-defined connective "doesn't exist," so I'd like to understand what's actually being claimed.

  Please explain all this in a way I can actually picture rather than just truth tables and proof systems -- though a worked example or two with actual sentences (liar-ish ones, ideally) would help. And as a coda: why would someone happily use a paraconsistent logic for, say, an inconsistent database or belief revision while thinking dialetheism itself is nonsense? Is that just pragmatic tolerance, or is there real daylight between the two attitudes about what the semantics is *about*?
