          1.  **Computational Asymmetry:** One AI can simulate the other, but not vice versa. Twins have equal power.
          2.  **Obfuscation/Encryption:** I can show you my code, but you can't understand it (halting problem, encryption). Twins share minds; AIs share data structures.
          3.  **The "Similarity" Gap:** Hofstadter relies on *logical* identity. Code equilibrium often relies on *exact* matching or specific handshakes. If we are 99% similar but differ on a edge case, do we cooperate? Hofstadter says yes (both rational); Code says maybe no (logic mismatch).
          4.  **Commitment vs. Identity:** The AI deal works because of *verifiable commitment* (I bind my hands), not because *we are the same*.

