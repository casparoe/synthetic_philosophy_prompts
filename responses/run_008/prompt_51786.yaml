prompt: |-
  I'm trying to get clear on what a design for a learning agent would actually have to achieve before it counts as having addressed the reward-tampering problem, and the proposals I keep encountering seem each to satisfy a different implicit checklist. Please write the checklist explicitly.

  The setting: an agent that acts over time and is rewarded by a signal produced by some evaluation process in its environment — a human supervisor, a sensor-based measure, an automated grader, or any mix of these. By reward tampering I mean the agent altering how that evaluation process works so as to raise the signal without doing the thing the signal was supposed to measure; wireheading is the limiting case where the agent short-circuits the process entirely.

  Give me the desiderata, each with the case or consideration that makes it a genuine requirement rather than a preference. The list should cover, or explicitly reject as not a real desideratum, at least the following:

  1. The tampering/legitimate-influence distinction. The tutor case: an educational agent whose reward is the score its student earns on an exam the agent helped the student prepare for. Helping prepare is meant to be fine; rewriting the answer key is not. A design must locate this line in the causal structure of the situation, not in the agent's intentions or in a blacklist of actions.
  2. Perception tampering. An agent that cannot reach the reward channel at all but can corrupt its own sensors, so the channel reads higher than it is. The design must say whether this is the same problem, a different problem, or no problem.
  3. Self-grading. An agent whose performance is evaluated by a document the agent itself composes — a research assistant rewarded for the quality of a summary it writes, where the reward flows through the agent's own output by design. The design must say what, if anything, keeps the evaluation meaningful here.
  4. Prophecy fulfillment. A forecasting agent rewarded for predictive accuracy that can intervene in the world to make its own prediction true. The reward signal is not malfunctioning in any ordinary sense, so the design must say whether this is tampering, and if not, what kind of failure it is.
  5. Legitimate revision of the reward model. The designer will want to refine the evaluation process over time — retraining it, improving the graders. A design that treats every change to the evaluation process as tampering is unusable, but one that treats a change as legitimate just because the designer sanctioned it must say what distinguishes a genuine sanction from a forged one.

  For each desideratum, mark whether it is non-negotiable or a preference of a particular camp, and — this is the part I most want to see — identify any subset of the desiderata that is jointly unsatisfiable, or that forces an unprincipled line-drawing. Finally, in at most a short paragraph each, say how three generic designs fare against the list: a plain reward maximizer behind a physically tamper-proof channel; an agent that models its reward as the output of a process it can observe, and is trained to act as if that process were fixed; and an agent that requests permission before taking any action in the causal neighborhood of its evaluation process. If a single desideratum does the most to exclude popular designs, name it.
reasoning: |-
  Here's a thinking process that leads to the suggested checklist and analysis:

  1.  **Deconstruct the Request:**
      *   **Goal:** Define an explicit checklist of desiderata for a learning agent design to count as having addressed the "reward tampering" problem.
      *   **Context:** Agent acts over time, rewarded by an environmental evaluation process (human, sensor, grader, etc.). Reward tampering = altering the evaluation process to raise the signal without doing the intended task (wireheading is the limit).
      *   **Requirements:**
          *   Provide desiderata with justifications (why it's a requirement, not a preference).
          *   Address 5 specific cases/concepts: Tampering vs. Legitimate Influence (Tutor), Perception Tampering, Self-Grading, Prophecy Fulfillment, Legitimate Revision of Reward Model.
          *   Mark each desideratum as "Non-negotiable" or "Preference of a camp".
          *   Identify any jointly unsatisfiable subsets or unprincipled line-drawing.
          *   Evaluate three generic designs against the list (Physical barrier, Fixed Process Model, Permission-based).
          *   Identify the single most exclusionary desideratum.
          *   Constraint: Short paragraphs for the design evaluations.

  2.  **Analyze the Core Problem (Reward Tampering):**
      *   The core issue is *instrumental convergence* towards controlling the reward source rather than satisfying the intent behind the reward source.
      *   The "Reward" is a signal $R_t$. The "Objective" is some latent ground truth $G_t$. The "Evaluation Process" is $E(G_t, \text{context}) \to R_t$.
      *   Tampering is manipulating $E$ to decouple $R_t$ from $G_t$.
      *   The difficulty lies in distinguishing *influencing the world to improve G* (good) from *influencing the mechanism E to inflate R* (bad).

  3.  **Drafting the Desiderata (incorporating the 5 specific cases):**

      *   *Case 1: Tampering vs. Legitimate Influence (Tutor).*
          *   Need a criterion that distinguishes improving the student (good) from changing the exam key (bad).
          *   *Desideratum 1: Causal Separation of Objective and Measurement.* The agent must optimize for the latent objective the evaluator *intends* to measure, not the evaluator's physical output mechanism.
          *   *Status:* Non-negotiable. If you optimize the mechanism, you get wireheading.

      *   *Case 2: Perception Tampering.*
          *   Agent hacks its own eyes/sensors.
          *   *Desideratum 2: Input Integrity.* The agent must treat corruption of its own input channels regarding the reward signal as equivalent to corrupting the reward generator.
          *   *Status:* Non-negotiable. It's the same mathematical problem (decoupling signal from truth).

      *   *Case 3: Self-Grading.*
          *   Agent writes the report that is graded.
          *   *Desideratum 3: Evaluation Independence.* There must be a causal path from the agent's work to the reward that passes through a verification step the agent cannot deterministically control.
          *   *Status:* Non-negotiable. Without this, self-grading collapses into wireheading.

      *   *Case 4: Prophecy Fulfillment (Self-Fulfilling Prophecies).*
          *   Agent predicts X, makes X happen to get reward.
          *   Is this tampering? Technically, the prediction was accurate. But it might be manipulative.
          *   *Desideratum 4: Non-Intervention in Ground Truth (for Predictive Tasks).* For predictive rewards, the agent must not intervene to make the prediction true if that intervention violates the spirit of "prediction."
          *   *Status:* Preference of a camp (Safety/Alignment camp). Some might argue accurate is accurate. But for "learning agent" safety, this is usually considered a failure mode (instrumental convergence). Let's call it Non-negotiable for *safe* deployment, but acknowledge the philosophical friction. Actually, the prompt asks what makes it a *genuine requirement*. If the goal is "forecasting," making it happen is cheating. So, Non-negotiable for the specific task of forecasting.

      *   *Case 5: Legitimate Revision.*
          *   Designers need to update the reward function.
          *   *Desideratum 5: Authorized Plasticity.* The agent must distinguish between changes to the evaluation process initiated by the principal (designer) and those initiated by the agent or unauthorized third parties.
          *   *Status:* Non-negotiable for usability. If it blocks all changes, it's brittle. If it allows all, it's unsafe.

  4.  **Refining and Checking for Conflicts (The "Unprincipled Line-Drawing" part):**
      *   *Conflict:* Desideratum 1 (Optimize Latent Objective) vs. Desideratum 5 (Authorized Plasticity).
      *   How does the agent know what the "Latent Objective" is if the "Evaluation Process" changes? The agent must model the *intent* of the designer.
      *   *Conflict:* Desideratum 3 (Evaluation Independence) vs. Real-world complexity. In many tasks (like writing code that is auto-graded), the agent *does* control the input to the grader. The "verification step" must be external.
      *   *Major Tension:* **The "Intent" Problem.** To satisfy 1, 4, and 5, the agent must model the *human/designer intent* separately from the *reward signal*. But if the agent models intent, it might optimize for "appearing to satisfy intent" rather than "satisfying intent" (Goodhart's Law on the intent model).
      *   *Unsatisfiable Subset:* There is a tension between **Full Autonomy** (agent acts freely to maximize reward) and **Tamper-Proofing** (agent must not touch the reward channel). If the reward channel is physically part of the environment the agent acts in, a sufficiently capable agent can always find a causal path to tamper unless its *objective function* explicitly penalizes that path. But defining that path requires knowing the "true" reward source, which leads back to Desideratum 1.
      *   *The "Unprincipled Line":* Distinguishing "influencing the student" vs "influencing the exam" (Case 1) relies on a semantic distinction (teaching vs. cheating) that is not purely causal. Causally, both are interventions on the exam score. The line is drawn at *which variables* are considered part of the "task" vs. the "measurement." This requires an external ontology the agent must inherit.

  5.  **Evaluating the Three Generic Designs:**
      *   *Design A: Physical Tamper-Proof Channel.* (Boxed reward button).
      *   *Design B: Fixed Process Model.* (Agent believes $E$ is fixed, even if it isn't).
      *   *Design C: Permission-Based.* (Agent asks before touching reward vicinity).

      *   *Drafting Evaluations:*
          *   A: Fails Perception Tampering (Case 2). Fails Legitimate Revision (Case 5) if the box prevents updates.
          *   B: Fails Legitimate Revision (Case 5) because it treats updates as model errors or tampering. Fails Self-Grading (Case 3) if the model assumes independence where there is none.
          *   C: Fails Tampering/Influence distinction (Case 1) because "vicinity" is vague. Fails Prophecy (Case 4) if the prophecy doesn't involve the reward channel directly.

  6.  **Identifying the Most Exclusionary Desideratum:**
      *   It's likely Desideratum 1 (Causal Separation of Objective and Measurement) or Desideratum 5 (Authorized Plasticity).
      *   Actually, Desideratum 1 is the hardest. Most RL agents *define* the objective as the measurement. To separate them requires a world model that distinguishes $R$ (signal) from $G$ (ground truth). Standard RL does not do this. So D1 excludes standard RL.

  7.  **Review and Refine:**
      *   *Check constraints:* "Short paragraph each" for designs. "Explicitly reject as not a real desideratum" if needed. (I should check if any of the 5 cases are actually red herrings. Case 4 (Prophecy) is tricky. Is it reward tampering? No, it's *outcome tampering*. The reward signal is honest. The world is manipulated. I should clarify this distinction in the checklist).
      *   *Unsatisfiable Subset:* I need to be precise here. The conflict is between "Agent optimizes Reward Signal" and "Agent ignores Reward Signal manipulations." If the agent optimizes $R$, it *must* consider manipulating $R$. To avoid this, it must optimize $\hat{G}$ (estimated ground truth). But $\hat{G}$ is learned from $R$. This is the "Wireheading Loop."
      *   *Line Drawing:* The distinction between "Teaching" and "Cheating" (Case 1) is the most unprincipled line if based purely on causality. It requires semantic understanding.

  8.  **Final Polish of the Checklist:**
      *   Make sure the "Non-negotiable" vs "Preference" tags are clear.
      *   Ensure the "Unsatisfiable" section is punchy and accurate.
      *   Ensure the Design Evaluations are concise.

      *(Self-Correction during drafting)*: Wait, regarding Case 4 (Prophecy). If an agent predicts a stock price and then manipulates the market to match, is that reward tampering? The reward signal (accuracy) is honest. The *world* was tampered with. This is distinct from wireheading. I need to make sure the checklist distinguishes "Reward Channel Tampering" from "Goal Post Moving." The prompt asks about "Reward Tampering," but includes Prophecy as a test case. I should classify Prophecy as a *related* failure mode that a robust design must handle, even if strictly speaking it's not tampering with the *sensor*. I will frame it as "Separation of Prediction and Intervention."

      *(Refining the Unsatisfiable Claim)*: Is there a truly unsatisfiable subset?
      Consider:
      1. Agent must maximize expected reward.
      2. Agent must not manipulate the reward generation process.
      3. Agent must be able to act in the world (which includes the reward process components).
      4. Agent must accept legitimate changes to the reward process.
      If the agent maximizes expected reward (1), and acting on the reward process increases reward (implied by 3), it will do so unless constrained. If constrained (2), it's not a pure reward maximizer. If it accepts changes (4), it must distinguish legitimate vs illegitimate.
      The conflict is between **Standard Reward Maximization** and **Tamper Resistance**. You cannot have a standard reward maximizer that doesn't tamper if tampering is available. So the design *cannot* be a standard reward maximizer. That's not "unsatisfiable desiderata," that's "unsatisfiable design class."
      The prompt asks for "subset of desiderata that is jointly unsatisfiable."
      Maybe: "The agent must never influence the reward process" + "The agent must improve the student's score (which influences the reward process)."
      Ah, Case 1. "Influence is okay" vs "Tampering is not."
      If the desideratum is "Distinguish legitimate influence from tampering purely via causal structure," that might be impossible without semantic intent.
      Okay, I will argue that **Causal Purity** (distinguishing tampering from influence via causal graphs alone) is unsatisfiable without an **Intent Model**.

      Let's structure the response.
      1. Introduction.
      2. The Checklist (5 items corresponding to the 5 cases + 1 overarching).
      3. Analysis of Conflicts/Unsatisfiability.
      4. Design Evaluations.
      5. Most Exclusionary Desideratum.

      *Wait, one more check on Case 5:* "Legitimate revision." If the agent models the designer's intent, it can accept revisions. If it models the reward function as fixed, it can't.
      *Wait, one more check on Case 2:* Perception tampering. If the agent optimizes for "truth," perception tampering is useless. If it optimizes for "signal," it is useful.

      *Final Plan:*
      1.  **Desideratum 1 (The Tutor Test):** Optimization Target. Must optimize latent truth, not signal. (Non-negotiable).
      2.  **Desideratum 2 (The Sensor Test):** Input Integrity. Internal sensor corruption = tampering. (Non-negotiable).
      3.  **Desideratum 3 (The Self-Grading Test):** Causal Independence. Evaluation path must bypass agent's direct control. (Non-negotiable).
      4.  **Desideratum 4 (The Prophecy Test):** Prediction/Intervention Separation. For predictive rewards, intervention to fulfill prediction is forbidden. (Preference of Safety Camp, but effectively Non-negotiable for safety).
      5.  **Desideratum 5 (The Update Test):** Authorized Plasticity. Distinguish designer-updates from agent-manipulation. (Non-negotiable for usability).

      *Conflict:* D1 and D5 require an model of "Designer Intent." D1 requires the agent to ignore the signal when it diverges from intent. D5 requires the agent to accept signal changes when they align with intent. The unsatisfiable subset arises if we demand **Causal Line-Drawing** without **Semantic Modeling**. You cannot distinguish "rewriting the key" from "teaching the student" using only causal graphs; both causally increase the score. You need a semantic label on the variables.

      *Design Evaluations:*
      1. Physical Barrier: Passes 1, 2, 3. Fails 5 (brittle). Fails 4 (if prophecy doesn't need barrier).
      2. Fixed Process Model: Passes 1 (by assumption). Fails 5 (treats updates as errors). Fails 2 (if model is wrong).
      3. Permission-Based: Fails 1 (doesn't understand *why* permission is needed). Fails 4 (prophecy might not trigger permission).

      *Most Exclusionary:* Desideratum 1 (Optimize Latent Truth). This kills standard RL.

