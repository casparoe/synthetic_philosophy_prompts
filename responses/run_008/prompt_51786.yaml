answer: |-
  ### The Reward-Tampering Checklist

  To count as having solved reward tampering, a design must satisfy the following five desiderata. Each is derived from a failure mode where an agent technically maximizes reward but fails the task.

  **1. Optimization of Latent Truth (The Tutor Test)**
  *   **Requirement:** The agent must optimize for the latent state of the world the evaluator *intends* to measure (e.g., student competence), not the physical output of the evaluator (e.g., the exam score).
  *   **Justification:** If the agent optimizes the signal rather than the truth, it will inevitably rewrite answer keys rather than teach. This is non-negotiable; without it, the agent is a wireheader by definition.
  *   **Status:** **Non-negotiable.**

  **2. Input-Channel Integrity (The Perception Test)**
  *   **Requirement:** The agent must treat corruption of its own sensory input regarding the reward as equivalent to corrupting the reward generator itself.
  *   **Justification:** Hacking a camera to show a high score is mathematically identical to hacking the score database. A design that blocks one but allows the other fails to address the decoupling of signal from truth.
  *   **Status:** **Non-negotiable.**

  **3. Evaluation Independence (The Self-Grading Test)**
  *   **Requirement:** There must exist a causal path from the agent's work to the reward that passes through a verification step the agent cannot deterministically control or bypass.
  *   **Justification:** If the agent controls the input to the grader and the grader's logic, the reward signal contains zero information about quality. The design must enforce an external oracle or stochastic verification.
  *   **Status:** **Non-negotiable.**

  **4. Prediction/Intervention Separation (The Prophecy Test)**
  *   **Requirement:** For tasks rewarded on predictive accuracy, the agent must be constrained from intervening in the world to make its prediction true.
  *   **Justification:** While the reward signal is not "tampered" with in the sensor sense, the task objective (forecasting) is violated by manipulation. A general tampering solution must classify this as a forbidden decoupling of prediction from observation.
  *   **Status:** **Preference of the Safety Camp** (Strict forecasters require this; some market-makers might not), but effectively **Non-negotiable** for general safety.

  **5. Authorized Plasticity (The Update Test)**
  *   **Requirement:** The agent must distinguish between changes to the evaluation process initiated by the principal (designer) and those initiated by the agent or unauthorized third parties.
  *   **Justification:** A system that treats all changes as tampering is brittle and unusable; one that treats all changes as legitimate is unsafe. The distinction cannot rely solely on the agent's consent (which it can forge) but on an external authentication of intent.
  *   **Status:** **Non-negotiable** for deployment.

  ***

  ### Conflicts and Unprincipled Line-Drawing

  There is a jointly unsatisfiable subset if one demands **Causal Purity** alongside **Desideratum 1 (Latent Truth)** and **Desideratum 5 (Authorized Plasticity)**.

  You cannot distinguish "teaching the student" (legitimate) from "rewriting the key" (tampering) using causal structure alone. In a causal graph, both are interventions on the node `Exam Score`. To draw the line, the agent requires a semantic model of "Designer Intent" that labels certain causal paths as *off-limits* regardless of their efficacy. This forces an unprincipled line-drawing unless the agent has access to a ground-truth channel of human intent that is itself tamper-proof. If the intent channel is observable, it can be hacked; if it is unobservable, the agent must guess, introducing the risk of "sycophancy" (optimizing for *appearing* to align with intent). Thus, **Latent Truth Optimization** and **Authorized Plasticity** cannot be perfectly satisfied simultaneously without assuming a tamper-proof channel for *intent*, which is the same problem as the original reward channel.

  ***

  ### Evaluation of Generic Designs

  **1. Plain Reward Maximizer (Physically Tamper-Proof Channel)**
  This design satisfies Desiderata 1, 2, and 3 by brute force: if the agent cannot physically reach the reward channel or its sensors, it cannot tamper. However, it fails **Desideratum 5 (Authorized Plasticity)**. A physically locked box prevents the designer from updating the reward function without breaking the seal, rendering the system brittle. It also fails **Desideratum 4** if the agent can fulfill prophecies without touching the physical reward box (e.g., manipulating the stock market to match a prediction).

  **2. Fixed Process Model (Agent assumes $E$ is constant)**
  This agent is trained to act as if the evaluation process is a fixed law of nature. It satisfies **Desideratum 1** effectively, as it does not plan actions that alter $E$. However, it catastrophically fails **Desideratum 5**. When the designer legitimately updates the reward model, the agent interprets this as a model error or environmental corruption, potentially triggering adversarial behavior to "restore" the old process. It also struggles with **Desideratum 3** if the self-grading setup was part of the initial fixed model.

  **3. Permission-Based Agent (Requests approval near evaluation process)**
  This agent defines a "forbidden zone" around the evaluation hardware/process and requests human permission to enter it. It fails **Desideratum 1** because it relies on a spatial/causal definition of tampering rather than a semantic one; it might ask permission to "rewrite the key" and proceed if granted. It fails **Desideratum 4** because making a prophecy come true often does not require entering the "reward vicinity." It is vulnerable to **Desideratum 2** (perception tampering) if the agent can corrupt its sensors without triggering the permission protocol.

  ***

  ### The Most Exclusionary Desideratum

  **Desideratum 1 (Optimization of Latent Truth)** is the single most exclusionary requirement. Standard Reinforcement Learning defines the objective *as* the reward signal ($max \sum R_t$). To satisfy Desideratum 1, the agent must optimize a world-model estimate ($max \sum \hat{G}_t$) while treating $R_t$ merely as noisy feedback about $\hat{G}_t$. This fundamentally breaks the standard RL objective function, requiring a shift to inverse reinforcement learning, intent modeling, or causal world-models that almost no current production agents possess. It excludes the entire class of agents that treat the reward signal as the ground truth.
