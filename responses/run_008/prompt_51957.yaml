  # The Wirehead Sorting Tree

  **Instructions:** Start at the root. Answer the question based on your intuition about the cases (the rat, the AI, the human volunteer). Follow the arrow to the next question or to a final position. Note the **[Human Flag]** where the animal/machine cases may diverge from the human case.

  ***

  ### ROOT: The Nature of the Reward
  **When the subject presses the lever, is it receiving the very thing it wants, or is the lever forging the signal that normally reports on receiving such things?**

  *   **A. It is forging the signal.** (The subject wants food/connection/reality, but gets only the neural flash that usually accompanies them.) → *Go to Left Branch.*
  *   **B. It is receiving what it wants.** (The subject wants the stimulation itself, and it is getting exactly that.) → *Go to Right Branch.*

  ***

  ### LEFT BRANCH (The Signal is a Forgery)

  **Node 1: The Truth Requirement**
  **Does the subject need to be right about *why* it feels good for its life to be going well, or is feeling good enough?**
  *   **Yes, it needs to be right.** (A happy delusion is not a good life.) → **Leaf 1: Nozickian Reality Contact**
  *   **No, feeling good is enough.** (The internal state is all that counts.) → *Go to Node 2.*

  **Node 2: The Source of Corruption [Human Flag]**
  **If the subject chose to wire itself up, is that better than if an outsider wired it up without consent?**
  *(Note: For rats and AI, "consent" is metaphorical. If you think agency matters for machines, follow "Yes." If you think only humans have agency, follow "No" or treat this node as inapplicable.)*
  *   **Yes, choice fixes it.** (A life is good if the values are authentically the subject's own, even if false.) → **Leaf 2: Sumner-style Authentic Satisfaction**
  *   **No, choice doesn't fix it.** (Even a chosen delusion is worthless; only the raw feeling remains.) → **Leaf 3: Plain Hedonism**

  ***

  ### RIGHT BRANCH (The Subject Gets What It Wants)

  **Node 3: The Plasticity of Desire**
  **If we didn't give the subject the stimulation, but instead rewrote its desires so it was happy with nothing, would that life go just as well?**
  *   **Yes, satisfaction is satisfaction.** (It doesn't matter what you want, only that you get it.) → *Go to Node 4.*
  *   **No, the desires must be grounded.** (You can't just want anything; the wants must be rational or informed.) → **Leaf 4: Informed-Desire View**

  **Node 4: The Engineering Imperative**
  **Is this merely permissible, or is it the ideal state we should actively engineer for all minds?**
  *   **Merely permissible.** (It's fine if they want it, but we shouldn't design minds to want only this.) → **Leaf 5: Raw Preference-Satisfactionism**
  *   **The ideal state.** (We should maximize satisfaction by making desires easy to fulfill.) → **Leaf 6: The Bullet-Biting Unrestricted View**

  ***

  ### THE POSITIONS (Leaves)

  **Leaf 1: Nozickian Reality Contact**
  *   **Core Claim:** Well-being requires actual contact with reality, not just the experience of it.
  *   **Awkward Commitment:** A painful life lived in the truth is potentially better than a blissful life lived in a lie.

  **Leaf 2: Sumner-style Authentic Satisfaction**
  *   **Core Claim:** Well-being is satisfaction of desires, provided those desires are authentically the subject's own (autonomous).
  *   **Awkward Commitment:** A happy person whose values were instilled by advertising is living worse than an unhappy rebel.

  **Leaf 3: Plain Hedonism**
  *   **Core Claim:** Well-being is determined solely by the quality of conscious experience (pleasure minus pain).
  *   **Awkward Commitment:** A deluded, brain-damaged person feeling bliss is living a perfect life.

  **Leaf 4: Informed-Desire View**
  *   **Core Claim:** Well-being is getting what you would want if you were fully informed and rational.
  *   **Awkward Commitment:** Your actual wishes can be overruled by a hypothetical version of you.

  **Leaf 5: Raw Preference-Satisfactionism**
  *   **Core Claim:** Well-being is simply getting what you actually want, regardless of the content.
  *   **Awkward Commitment:** If you want to count blades of grass, doing so makes your life go well, even if it brings no joy.

  **Leaf 6: The Bullet-Biting Unrestricted View**
  *   **Core Claim:** Wireheading is not a failure mode but the rational endpoint of optimization.
  *   **Awkward Commitment:** We should engineer all minds to want only what is easy to provide.

  ***

  ### INDIFFERENT POINTS & OVERLAPS

  **The Hedonism / Preference Coincidence**
  You suspected that **Plain Hedonism** and **Raw Preference-Satisfactionism** coincide whenever the subject wants its own pleasure. **You are right.**
  In the specific case of wireheading, the subject *wants* the stimulation (Preference) and the stimulation *feels* good (Hedonism). The tree separates them at the Root (Forgery vs. Receipt) and Node 1 (Truth vs. Feeling), but in practice, a wireheaded rat satisfies both definitions simultaneously. The tree only separates them if you imagine a subject that *wants* something else (e.g., truth) but is made to *feel* happy. If your group only discusses wireheading, these two leaves will feel identical.

  **The Human Flag Limitation**
  The tree cannot fully separate **Sumner-style Authentic Satisfaction** from **Nozickian Reality Contact** in the animal/AI cases. Since rats and current AI lack "autonomy" or "authenticity" in the human sense, Node 2 collapses for them. If you believe a rat cannot be "autonomous," you must treat the rat case as a Nozickian case (Reality) or a Hedonistic case (Feeling), rendering the Sumner leaf applicable only to the human volunteer.

  ***

  ### CLOSING COMMENTARY

  **Confidence Level:** Moderate.
  This tree successfully maps the logical space of *well-being* theories onto the specific intuition pumps of wireheading. It forces a distinction between "feeling good," "getting what you want," and "being in touch with reality," which resolves most of the drift in your reading group.

  **Least Certain Point:**
  I am least sure about **Node 3 (The Plasticity of Desire)** doing enough work to separate **Raw Preference** from the **Bullet-Biting View**.
  The question asks if we should *engineer* desires, but a consistent Raw Preference theorist might say, "We shouldn't engineer desires, but if the subject *happens* to have easy desires, that's just as good as having hard ones." This makes Leaf 5 and Leaf 6 very close neighbors. The distinction relies on a normative jump (what we *should* do) rather than a definitional one (what well-being *is*), which might confuse members who are strictly analyzing the subject's welfare rather than moral policy. If your group splits there, it may be because one side is talking about *ethics* and the other about *welfare*.
