      *   *Check:* Did I address the "order of elimination" issue? It's a good "subtly wrong" point to add.
      *   *Check:* Is the distinction between "Nash Equilibrium of the original game" vs "Nash Equilibrium of the reduced game" clear? Yes, strict dominance preserves NE of the original. Weak dominance does not necessarily.

