answer: |-
  You have stumbled onto one of the most famous and frustrating problems in modern moral philosophy. Your roommate is deploying **Derek Parfit's Non-Identity Problem**, from his 1984 book *Reasons and Persons*.

  He is not making a logical error. The argument is **valid**. If you accept all the premises, the conclusion follows inevitably. The problem is that the conclusion is morally repugnant to almost everyone (including Parfit). This means the argument is **unsound**: at least one premise must be false, even if it feels true.

  Here is the breakdown of where it breaks, why your bridge objection doesn't save you, and how to reject Premise (1) without owing duties to ghost children.

  ### 1. Does your "Bridge Case" objection work?
  **Short answer:** No. Your roommate is right about this specific point.

  **Why:** The Non-Identity Problem relies on **Identity Dependence**.
  *   **The Bridge Case:** When you shove the guy, you are comparing two worlds where *the same guy* exists. In World A, he is pushed. In World B, he is not. He is worse off in A than in B. Identity is fixed.
  *   **The Future Policy Case:** When the government chooses the "depletion" policy (ruining the environment in 2200), they change the course of history so profoundly that the specific people born in 2200 are *different people* than those who would have been born under the "conservation" policy.

  Because the people in the "bad future" would not exist at all in the "good future," you cannot say they are worse off than they *would have been*. They are not worse off than they would have been, because the alternative for *them* is non-existence.

  Your bridge objection works for **present, identifiable people**. It fails for **future, contingent people**. Your roommate is correct that the bridge case does not pierce the armor of Premise (7).

  ### 2. Which step has to go?
  Since the logic is valid, you have to attack the premises. You have three main options, but only two are viable.

  **Option A: Reject (3) or (4) (The Biology/Chaos Premises)**
  You could argue that personal identity is not so fragile. Maybe the "soul" or "person" is the same even if the sperm is different?
  *   **Cost:** This is biologically and scientifically untenable. We know genetic makeup determines identity. Rejecting this makes you look anti-science.
  *   **Verdict:** Don't do it.

  **Option B: Reject (2) (The Comparative Account of Harm)**
  Premise (2) says harm requires a comparison to a better alternative for *that person*. You could argue that harm is not comparative but **threshold-based**.
  *   **The Fix:** A person is harmed if their quality of life falls below a certain threshold of decency, regardless of whether they would have existed otherwise. If the policy in 2200 leaves people with "lives barely worth living," that is a harm *in itself*, even if the alternative was non-existence.
  *   **Cost:** This gets tricky. If life is "barely worth living," is it really a harm to bring them into existence? Most people agree it's better to exist than not, even with struggles. But if the life is *misery*, this view works.
  *   **Verdict:** A strong contender, but it struggles with the "barely worth living" case your roommate posits.

  **Option C: Reject (1) (The Person-Affecting View)**
  **This is the standard philosophical solution.** Premise (1) claims: *To do wrong, you must wrong a specific person.*
  *   **The Fix:** We must accept that you can **do wrong** without **wronging a specific person.**
  *   **Cost:** You have to move from a "Person-Affecting View" to an **Impersonal View** (or what Parfit calls "Theory Q").

  ### 3. How to Reject (1) Without "Ghost Children" Obligations
  This is your biggest worry: *"If we drop (1), do I have to worry about the welfare of the infinite possible children I could've had?"*

  The answer is **no**, provided you drop (1) carefully. You don't need to say "non-existent people have rights." You need to say **"Outcomes can be worse, even if no particular person is worse off."**

  Here is the distinction:
  *   **Person-Affecting (Roommate's View):** Act A is wrong only if Person X is harmed by Act A.
  *   **Impersonal/Outcome-Based (Parfit's View):** Act A is wrong if it results in a state of affairs that is worse than the alternative state of affairs, even if the people in State A are different from the people in State B.

  **How this solves your fear:**
  You do not owe a duty to the *specific* possible child you didn't conceive with your ex-girlfriend. Why? Because that child never existed. There is no "outcome" containing that child to evaluate.
  However, you *do* owe a duty to the **quality of the future population**.

  If Policy A creates 1 billion people with amazing lives, and Policy B creates 1 billion *different* people with miserable lives, Policy B is worse. Not because the miserable people were "wronged" (they weren't, they'd otherwise be dead), but because **a world with miserable people is worse than a world with happy people.**

  This allows you to condemn the 2200 policy without owing duties to "possible people." You are comparing **World A** vs. **World B**, not **Person X** vs. **Person X's Ghost**.

  ### 4. What to tell your roommate
  Here is the script for the next dinner argument:

  1.  **Acknowledge the Logic:** "You're right that the logic is valid. This is Parfit's Non-Identity Problem. The logic holds, which is why it's a paradox."
  2.  **Kill the Bridge Objection:** "My bridge example doesn't work on future people because their identity isn't fixed yet. I concede that point."
  3.  **Attack Premise (1):** "However, Premise (1) is the weak link. It assumes morality is only about transactions between specific individuals. But we can judge policies based on the **value of the outcome**, not just the harm to specific individuals."
  4.  **Address the 'Ghost Children' Fear:** "Rejecting (1) doesn't mean I owe duties to children who never exist. It means I have a duty to ensure that *if* people exist in the future, their lives aren't avoidably terrible. It's not about wronging *them*; it's about making the *world* worse."
  5.  **The Legal Angle (Since he's Pre-Law):** "In law, we distinguish between 'standing' (who can sue) and 'legality' (was the act prohibited). Future people might not have standing to sue you because they aren't identifiable (Premise 1), but the act can still be illegal/immoral because it violates a standard of care for the future population. Your argument confuses 'no standing to sue' with 'no wrong committed.'"

  ### Summary
  *   **Where it goes wrong:** Premise (1). It conflates "wronging a person" with "doing something wrong."
  *   **What it costs:** You have to accept that some wrongs are **impersonal**. You can make the world worse without making any specific existing person worse off.
  *   **Does it license infinite obligations?** No. You only evaluate actualizable outcomes, not every metaphysical possibility.
  *   **Bridge Case:** It fails to refute the future people argument, but it highlights why Premise (1) works for the present but fails for the future.

  Your roommate is using a logical trap to justify moral nihilism about the future. The way out is to stop asking "Who is hurt?" and start asking "Which future is better?"
