          1.  Wronging requires making someone worse off (Person-Affecting View).
          2.  "Worse off" requires a comparison with an alternative where *that same person* exists and is better off.
          3.  Different conception times = different people (Identity Dependence).
          4.  Most acts change conception times downstream (Butterfly Effect).
          5.  Therefore, future people wouldn't exist if we acted differently.
          6.  Therefore, we can't make them worse off (no alternative existence).
          7.  Therefore, we can't wrong future people (even with bad policies).
      *   **User's Intuition:** The conclusion (7) is crazy/unacceptable.
      *   **User's Specific Objection:** The "Bridge Case." If I shove someone, I change the future, but I still wronged the shovee. Roommate says: "Fine, that's present people. Future people are still identity-dependent."
      *   **User's Constraints:** Wants to keep Premise (1) if possible (fears "possible people" rights). Wants to know which step fails, what it costs, and if the bridge objection works.

  2.  **Identify the Philosophical Problem:**
      *   This is the classic **Non-Identity Problem** from Derek Parfit's *Reasons and Persons* (1984).
      *   The argument is logically valid. The problem is that the conclusion is morally repugnant.
      *   Philosophers generally agree *something* has to give, but disagree on *what*.

  3.  **Evaluate the Premises:**

      *   **Premise (1): The Person-Affecting Restriction.** "To wrong someone, you have to make them worse off."
          *   *Pros:* Intuitive for existing people. Avoids obligations to "possible" people.
          *   *Cons:* Leads directly to the Non-Identity Problem conclusion.
          *   *Status:* This is the most common target for rejection.

      *   **Premise (2): The Comparative Account of Harm.** "Worse off" requires a same-person comparison.
          *   *Pros:* Standard counterfactual account of harm.
          *   *Cons:* Fails in non-identity cases.
          *   *Status:* Often modified (e.g., "worse off than some baseline" rather than "worse off than they would have been").

      *   **Premise (3) & (4): Identity Dependence & Causal Chain.**
          *   *Status:* Scientifically/biologically plausible. Hard to reject without denying biology or chaos theory.

      *   **Premise (5) & (6): The Inference.**
          *   *Status:* Logically follows from 1-4.

      *   **Premise (7): The Conclusion.**
          *   *Status:* Morally unacceptable to most (The "Repugnant Conclusion" adjacent).

  4.  **Address the User's Specific Questions:**

      *   **Where does it go wrong?** It's not a logical error; it's a philosophical puzzle. The logic holds, but the moral intuition clashes with the premises.
      *   **Which step to reject?** Most philosophers reject or modify (1) or (2).
      *   **Does the Bridge Case work?** No, not against the long-run claim. The roommate is right that the bridge case involves *existing* people where identity is fixed. The Non-Identity Problem specifically targets *future* people whose identity depends on the act.
      *   **What if we drop (1)?** Does it lead to "infinite possible children" obligations? Not necessarily. There are nuanced ways to drop it (e.g., Impersonal Principles).

