      *   *Validate the Intuition:* Confirm that (7) is widely considered unacceptable. It violates the "Intuition of Neutrality" or basic intergenerational justice.
      *   *Address the Bridge Objection:* Explain why the roommate is technically right here. The bridge victim exists in both worlds. The future child does not. This distinction is crucial.
      *   *Analyze Premise (1) (The Person-Affecting View):* This is the main pressure point.
          *   *Risk:* User worries about "possible people."
          *   *Solution:* Distinguish between "Same Number Quality Claims" (Parfit's Term Q). We don't need to say non-existent people have rights. We can say "It is bad if people exist with low quality of life when different people could have existed with high quality of life." This is an *impersonal* badness, not a *personal* wronging.
      *   *Analyze Premise (2) (Harm):* Alternative view: Harm as "causing a state of affairs that is bad," not necessarily "worse than alternative for that subject."
