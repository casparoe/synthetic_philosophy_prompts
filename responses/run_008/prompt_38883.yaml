answer: |-
  ## The Verdict: Throw Out Your Design
  Your worry is correct. The "Real vs. Fake Dossier" design fails your learning objective. It tests **detection accuracy**, not **reasoning structure**. If the students with the fake dossier lose, they will conclude, "We missed a clue," reinforcing the idea that better scrutiny solves the problem. If they win, they conclude, "We got lucky." Neither outcome demonstrates that the *internal experience* of reasoning is identical regardless of truth value.

  To teach that the *pattern* is the same, you must hold the **evidence constant** and vary the **interpretive frame**.

  Here is the redesigned session. It is tighter, cheaper to prep, and hits the epistemic nerve directly.

  ---

  # Game Design: "The Prior Probability Protocol"

  ### Core Concept
  All six groups investigate the **exact same case** with the **exact same evidence**. However, three groups are primed with a **High-Trust Prior** (this info comes from a credible insider) and three with a **Low-Trust Prior** (this info comes from an anonymous forum). The evidence is deliberately underdetermined—it supports both "Conspiracy" and "Incompetence" equally.

  The "sting" comes in the debrief when you reveal the evidence was identical. The divergence in their verdicts proves that the *evidence* didn't drive the conclusion; the *prior* did. This mirrors how conspiracy theorists and skeptics look at the same world and see different structures.

  ### Materials (Prep Time: 90 mins)
  1.  **The Dossier (15 copies + 3 spares):** A 2-page packet titled *Project: HELIOS*.
      *   *Content:* A fictionalized scenario about a pharmaceutical company rushing a drug approval.
      *   *Evidence:* 3 redacted emails (ambiguous tone), 1 budget sheet (shows "unallocated funds"), 1 timeline of adverse events vs. stock prices.
      *   *Crucial:* Every document must be interpretable as "smoking gun" OR "clerical error."
      *   *Example:* Email subject: "Fix the numbers before Monday." (Conspiracy: Fudge data. Innocence: Fix typos).
  2.  **The Cover Sheets (2 Types):**
      *   *Type A (High Trust):* "CLASSIFIED: Source verified by Senior Editor. Reliability: 95%."
      *   *Type B (Low Trust):* "UNVERIFIED: Source aggregated from public forums. Reliability: <40%."
      *   *Prep:* Print 3 copies of Type A, 3 copies of Type B. Staple one to each group's dossier.
  3.  **Decision Cards:** 6 cards. Options: **PUBLISH (Conspiracy)**, **KILL STORY (Innocence)**, **INVESTIGATE (Costs Budget)**.
  4.  **Currency:** "Credibility Chips" (poker chips or slips of paper). Each group starts with 10.
  5.  **Timer:** Visible countdown.

  ### Payoff Scheme
  *   **Goal:** Maximize your newsroom's "Credibility."
  *   **Costs:**
      *   Publishing a False Positive (Conspiracy that wasn't real): -5 Credibility.
      *   Publishing a False Negative (Killing a true conspiracy): -5 Credibility.
      *   Investigating further: -2 Credibility (per round).
  *   **The Trap:** You (the GM) do **not** reveal the truth value of the case during the game. You tell them: *"The truth is unknowable right now. You will be scored on the coherence of your justification, not the outcome."*
  *   **The Real Sting:** In the debrief, you reveal that the *only* variable was the Cover Sheet. The "winning" strategy wasn't finding the truth; it was recognizing how their prior dictated their reasoning.

  ### Run Sheet (75 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Explain the role (Editorial Board). Hand out materials. **Crucial:** Do not let groups compare Cover Sheets. Seat Type A and Type B groups on opposite sides of the room. |
  | **10-35** | **The Game** | Groups read dossier (5 mins). Discuss verdict (15 mins). Submit Decision Card + 3 bullet points justifying their reasoning. |
  | **35-40** | **The Reveal** | Collect cards. Ask: "How many voted Conspiracy?" (Likely mostly Type A). "How many voted Innocence?" (Likely mostly Type B). **Reveal:** "The dossiers inside were identical." |
  | **40-75** | **Debrief** | Structured discussion mapping game moves to epistemic concepts (see below). |

  ---

  # The Debrief: Mapping Moves to Epistemology
  *This is where the learning happens. Do not lecture. Ask, then label.*

  **1. The Base Rate Trap (5 mins)**
  *   **Ask:** "Group 2 (Type A), why did you trust the emails?"
  *   **They say:** "The source was verified."
  *   **You label:** "That's a **Base Rate**. You assumed the prior probability of a conspiracy was high because the source said so. Group 5 (Type B), you assumed the base rate was low."
  *   **Point:** The evidence didn't change. Your *starting position* determined the conclusion. In real conspiracy theories, the 'source' is often the community itself, creating a closed loop of high base rates.

  **2. The Asymmetry of Evidence (10 mins)**
  *   **Ask:** "Look at the email 'Fix the numbers.' Group 1, what did you see?" (They say: "Fraud"). "Group 4, what did you see?" (They say: "Typos").
  *   **You label:** "This is **Theory-Laden Observation**. The same datum is processed differently depending on the hypothesis. A conspiracy theorist sees a denial as proof of cover-up. A skeptic sees it as standard procedure. The cognitive move is identical; the valuation is inverted."

  **3. The Cost of Certainty (10 mins)**
  *   **Ask:** "Who wanted to Investigate Further? Why didn't you?"
  *   **They say:** "It cost too many points."
  *   **You label:** "This is **Epistemic Closure**. In the real world, 'investigating further' often means falling deeper into the rabbit hole (spending budget) without ever reaching a falsifiable endpoint. You stopped because the *cost* outweighed the *utility*, not because you found the truth."

  **4. The Structural Identity (10 mins)**
  *   **Activity:** Put a Type A justification and a Type B justification on the board side-by-side.
  *   **Observation:** Highlight that both groups used *connecting dots*, *questioning official narratives*, and *weighing motives*.
  *   **Point:** "You all did the same work. You used the same tools. The only difference was the Cover Sheet. This is why you cannot tell a conspiracy theorist they are reasoning wrong. They aren't. They are reasoning *perfectly* from a different prior."

  ---

  # Predictable Failure Modes & Live Fixes

  **1. Cross-Contamination (Students talk across groups)**
  *   **Risk:** A Type A group tells a Type B group, "Our cover sheet said it was classified!"
  *   **Fix:** Explicitly state in the briefing: "Your source classification is sensitive intel. Do not discuss your cover sheet with other desks. Violation results in immediate Credibility loss." Treat it like part of the game fiction.

  **2. The "Gotcha" Backlash**
  *   **Risk:** Students feel tricked when you reveal the dossiers were identical. They may disengage.
  *   **Fix:** Own it immediately. "I deceived you about the variation to demonstrate a point about epistemic variance. The deception *was* the lesson. If you feel frustrated, hold onto that feeling. That is the feeling of realizing your 'objective' reasoning was biased by a prior you didn't scrutinize."

  **3. Consensus (Everyone votes the same)**
  *   **Risk:** The evidence is *too* suggestive of a conspiracy (or innocence).
  *   **Fix:** If everyone votes Conspiracy, pivot the debrief. "Okay, everyone agreed. But notice how quickly you dismissed the innocent explanations. That speed is the danger zone. Let's look at what evidence you *ignored* to reach that consensus so fast."

  **4. Time Overrun**
  *   **Risk:** Discussion drags.
  *   **Fix:** Hard stop at 35 minutes for the game. If they haven't decided, they must flip a coin. The randomness adds to the debrief point about underdetermination.

  ---

  # What The Game Cannot Do (Your Burden)
  Be honest with yourself: A 75-minute seminar game cannot replicate the **emotional investment** of real conspiracy belief.
  *   **In the game:** Being wrong costs "Credibility Chips."
  *   **In reality:** Being wrong threatens identity, community, and worldview.

  **You must supply this in the debrief.**
  When you discuss the "Low Trust" groups who dismissed the conspiracy, ask them: "If this *was* real (e.g., Tuskegee), what is the cost of your skepticism?"
  When you discuss the "High Trust" groups who believed it, ask: "If this *was* fake, what is the cost of your alarm?"

  The game shows the **structural identity**. You must articulate the **ethical stakes**.

  # Why This Design Wins
  1.  **Controls the Variable:** By keeping evidence constant, you isolate the *prior* as the cause of divergence.
  2.  **Avoids Luck:** No group "loses" because they got a fake dossier. Everyone loses/wins based on how they handled ambiguity.
  3.  **Demonstrates Underdetermination:** It proves that evidence does not speak for itself; it is spoken *for*.
  4.  **Prep Efficiency:** You only need to write *one* high-quality dossier, not six.

  **Final Instruction:** Do not waver on the "Identical Dossier" reveal. It is the moment the room will go silent. Let that silence sit for five seconds before you speak. That silence is the sound of them feeling the epistemic ground shift. That is your teaching moment.
