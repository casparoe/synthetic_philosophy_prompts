prompt: |-
  Please describe the most important implications for my everyday food choices of the "least harm" argument against vegetarianism — the argument that crop cultivation kills enormous numbers of wild animals (field mice, birds, and other small creatures displaced or killed by plowing, harvesting, and pesticides), so that a calorie of plant food may carry a heavier death toll than a calorie of meat from a large herbivore raised on pasture. I'm especially interested in how this argument interacts with the standard beef-versus-chicken comparison. Chicken involves vastly more deaths per pound, but chickens are fed grain, so chicken consumption arguably inherits the crop deaths through feed conversion; grass-fed beef seems to sidestep feed cultivation entirely, but it adds the death of the cow and raises the question of how much wild-animal habitat pasture displaces relative to cropland of equal caloric yield. Please make clear which conclusions would survive large uncertainty in the per-calorie estimates of crop-cultivation deaths (e.g., if the true number were two orders of magnitude lower or higher than commonly assumed) and which are fragile to it.

  Present your answer as a table with the following columns: "Implication" (a practical upshot for a specific food choice), "Key empirical assumption" (the estimate or causal claim it leans on), "Robustness" (whether the implication still holds if crop-death estimates are wildly off in either direction), and "Moral crux" (the moral premise a thoughtful opponent would most likely reject). Cover roughly four to six distinct implications, precede the table with a short framing paragraph, and follow it with a brief concluding note on which single uncertainty, empirical or moral, matters most.
