answer: |-
  You have done something rather remarkable here. Without realising it, you have independently reconstructed three of the most sophisticated adjustments made to standard consent theory over the last forty years. Your intuitions are not merely 'gut feelings'; they are consistent with the work of ethicists like Dan Brock, Tom Beauchamp, and Onora O'Neill, who argue that the standard triad (informed, competent, voluntary) is too blunt an instrument.

  You are correct that the standard headings fail your cases. 'Informedness' cannot distinguish the divorce lie from the vasectomy lie; 'Voluntariness' cannot distinguish the firing threat from the job market; 'Competence' cannot distinguish the tattoo from the power of attorney.

  To capture your verdicts, we need a principle that makes validity **relative to the stakes** and **sensitive to the nature of the transaction**. Here is my best candidate for a principle that saves most of your intuitions.

  ### The Proportional Authorisation Principle

  **Consent is valid if and only if:**
  1.  **Decision-Relative Capacity:** The agent possesses cognitive abilities proportionate to the risk, complexity, and gravity of the specific decision at hand.
  2.  **Material Understanding:** The agent understands the *nature* and *central consequences* of the act, excluding peripheral attributes that do not fundamentally alter the physical or normative character of the act.
  3.  **Legitimate Constraints:** The choice is made without submission to an *illegitimate threat* posed by the counterparty, though it may be made under duress of background circumstances.

  ---

  ### How the Principle Saves Your Verdicts

  **1. The Sliding Scale of Capacity (Clause 1)**
  *   **The Principle:** Competence is not a global switch that is either 'on' or 'off'. It is a function of the decision. The higher the risk and irreversibility, the higher the cognitive threshold required.
  *   **Saving the Cases:** This explains why your **mildly tipsy friend** can consent to a **tattoo** (low risk, reversible with laser, aesthetic) but not to a **Power of Attorney** (high risk, transfers legal autonomy, complex). It explains why your **grandmother** can consent to a **flu shot** (routine, low risk) but not to **leaving her estate** (complex financial instrument, high stakes).
  *   **Motivating Case:** *Tipsy Tattoo vs. Tipsy Power of Attorney.*

  **2. Materiality of Information (Clause 2)**
  *   **The Principle:** Not all lies invalidate consent. Only lies regarding facts that change the *physical nature* of the act or its *primary intended consequences* invalidate consent. Lies regarding peripheral social attributes do not.
  *   **Saving the Cases:** This distinguishes the **vasectomy lie** from the **divorce lie**. Fertility is a central biological consequence of sex; marital status is a social attribute surrounding the partner. The surgeon's **technical jargon** fails this clause because it obscures the nature of the procedure itself, preventing understanding of the physical invasion.
  *   **Motivating Case:** *Vasectomy Lie vs. Divorce Lie.*

  **3. Legitimacy of Constraints (Clause 3)**
  *   **The Principle:** A choice is coerced only if the pressure applied is a *wrongful threat* created by the counterparty to manipulate the choice. Hard choices caused by economic reality or nature are 'constrained' but not 'coerced' in the moral sense that invalidates consent.
  *   **Saving the Cases:** The **job market** is a background circumstance (unfortunate, but not a wrongful threat by the employer). The **threat of firing** to sign a non-compete is an illegitimate leverage of power by the employer to force a specific contractual term.
  *   **Motivating Case:** *Firing Threat vs. Brutal Job Market.*

  ---

  ### The Price of the Principle: Which Verdict Must Go?

  You asked for honesty regarding which of your verdicts this account cannot save without becoming baroque. There is one tension in your set that threatens the coherence of the **Decision-Relative Capacity** clause.

  **The Verdict to Abandon: Grandmother's Assisted Living.**
  You stated your grandmother with mild dementia validly consented to **moving into assisted living**, but not to **leaving her estate**.

  While legally distinct in some jurisdictions, ethically these are very close in terms of cognitive load. Moving into assisted living involves understanding a contract, a significant change in liberty, financial commitment, and social displacement. If her dementia is severe enough to invalidate the estate gift (which requires understanding assets and beneficiaries), it is inconsistent to claim she has the capacity to understand the implications of assisted living, unless the living arrangement is framed purely as a medical necessity (which you did not imply).

  To save this verdict, the principle would need a fourth, messy clause distinguishing 'care decisions' from 'financial decisions' regardless of complexity. It is cleaner to admit that **if she lacks capacity for the estate, she likely lacks capacity for the housing contract.** Your intuition here is likely influenced by benevolence (it was *good* for her to move), but validity of consent is about *process*, not outcome. I suggest abandoning the certainty of this verdict.

  ---

  ### Verdicts on Your Undecided Cases

  Applying the **Proportional Authorisation Principle**:

  **1. The Research Subject (40-page packet, initialed without reading)**
  *   **Verdict:** **Invalid Consent.**
  *   **Reasoning:** This fails Clause 2 (Material Understanding). Consent is an authorisation of specific risks. By signing without reading, the subject has not authorised the *content*, only the *paperwork*. Even if they *could* have read it (Capacity), the failure to grasp the material risks (side effects, data usage) means the authorisation is hollow. In biomedical ethics, a signature without comprehension is merely a waiver of liability, not valid consent.

  **2. The Equally Drunk Partners**
  *   **Verdict:** **Invalid Consent (on both sides).**
  *   **Reasoning:** This relies on Clause 1 (Decision-Relative Capacity). Sexual consent requires a baseline of cognitive capacity to understand the nature of the act and the ability to withdraw consent. Intoxication compromises this. The fact that the *other* party is also drunk is irrelevant to the *capacity* of the first party. Two people lacking capacity cannot mutually authorise a normative change. If both are below the threshold, neither has validly consented, regardless of mutual enthusiasm. This is a hard conclusion, but it preserves the protective function of the capacity requirement.

  ### Summary

  Your intuitions are sounder than you give them credit for. You have naturally gravitated towards a **risk-relative** model of ethics. The principle above formalises that. It demands that we stop asking "Is this person competent?" and start asking "Is this person competent *for this specific decision*?" It demands we stop asking "Was there a lie?" and ask "Did the lie change the *nature* of the act?"

  If you take one lesson from this, let it be that consent is not a state of mind; it is a **transactional authorisation**. It only holds when the person authorising has the capacity for the specific risk, understands the specific material facts, and is not being wrongfully manipulated.

  *Good luck with the rest of your course.*
