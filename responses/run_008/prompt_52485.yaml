answer: |-
  This is a sophisticated impasse, and your hypothesis is largely correct, though it can be sharpened. You are dealing with a **methodological and teleological incommensurability masquerading as a first-order normative dispute.**

  The debate has stalled not because the participants are unintelligent, but because they are attempting to solve different problems using the same vocabulary. The "expensive tastes" and "religious observance" cases are not merely test cases for a shared theory; they are stress tests revealing that the theories are built on incompatible foundations.

  Here is a diagnosis of the disagreement, where the parties actually part company, and what progress would actually look like.

  ### 1. The Diagnosis: Incommensurable Research Programs
  This is not a verbal dispute (they mean the same things by "resources" and "inequality"), nor is it purely substantive (they aren't just disagreeing on the weight of values). It is a clash of **Research Programs** in the Lakatosian sense.

  *   **Luck Egalitarianism (LE)** is a *metaphysical-accounting* program. Its goal is to align distributive outcomes with moral responsibility. It assumes justice is a matter of correct bookkeeping: neutralizing the noise of luck to reveal the signal of agency.
  *   **Relational Egalitarianism (RE)** is a *sociological-political* program. Its goal is to secure democratic reciprocity and social status. It assumes justice is a matter of social meaning: ensuring no one stands in a relation of domination or humiliation to another.

  **Why the stalemate?**
  When RE critiques LE (e.g., Anderson's "On the Terms of Equality"), LE hears a critique of their *distributional formulas*. RE is actually critiquing the *social meaning* of the transaction.
  *   **LE asks:** "Did this person choose this outcome?"
  *   **RE asks:** "What does offering/not offering this compensation say about our standing as citizens?"

  When LE patches the theory (e.g., adding thresholds or formation controls), RE calls it *ad hoc* because, from a relational view, the *motivation* for the patch is still paternalistic. Conversely, when RE declines to offer a precise distributive formula, LE calls it incomplete because, from an accounting view, a theory of justice that cannot allocate resources is operationally empty.

  ### 2. Where They Part Company
  You identified three potential fault lines: facts, standards, and bedrock intuitions. The disagreement is primarily on **Bedrock Intuitions about the Point of Justice**, which drives the disagreement on **Metaphysical Feasibility.**

  #### A. The Responsibility Regress (The Metaphysical Wall)
  Your hypothesis about the regress is the key to the Cohen/Dworkin deadlock.
  *   **The Disagreement:** LE requires a "stopping point" for the regress of responsibility to function as policy. Dworkin's "identification" (endorsing the taste) is an attempt to find a psychological stopping point. Cohen correctly identifies that this is metaphysically unstable (you endorse tastes caused by luck).
  *   **The Parting:** LE proponents are willing to accept a **pragmatic cutoff** (we treat you as responsible here because we must, even if determinism is true) to save the theory's action-guidance. Cohen (and hard determinists) insist that if the cutoff isn't metaphysically robust, the moral distinction collapses.
  *   **Diagnosis:** This is a substantive disagreement about **moral fiction.** LE relies on a "fiction of agency" to make distribution possible. Cohen refuses the fiction.

  #### B. The Teleological Split (The Anderson/Scheffler Wall)
  *   **The Disagreement:** LE views distribution as *constitutive* of equality. If the distribution is responsibility-sensitive, equality is achieved. RE views distribution as *instrumental* to equality. Resources are only needed insofar as they prevent status hierarchy.
  *   **The Parting:** They part company on **what counts as a counterexample.**
      *   For LE, a counterexample is a case where the distribution violates the luck/choice principle (e.g., subsidizing expensive tastes).
      *   For RE, a counterexample is a case where the policy creates hierarchy (e.g., means-testing that stigmatizes the recipient).
      *   **Crucially:** A policy can be LE-correct and RE-wrong (e.g., a stingy, responsibility-tested benefit that is mathematically fair but humiliating). This is why they talk past each other.

  #### C. The Concrete Cases (Religion/Disability)
  You noted they disagree on concrete cases (e.g., religious costs). This is where the programs collide.
  *   **LE View:** If the religion was chosen (convert), it's option luck. If born into it, it's brute luck. But if the *cost* is due to a preference structure, do we subsidize?
  *   **RE View:** The question isn't about the origin of the preference. The question is: Does requiring a citizen to abandon their religious practice to achieve economic parity constitute second-class citizenship?
  *   **Diagnosis:** LE asks about the *history* of the cost. RE asks about the *burden* of the cost. They are measuring different dimensions of the same case.

  ### 3. What Counts as Progress?
  Given this diagnosis, searching for a "formal criterion for the luck/choice line" is a category error. That line does not exist in the world; it is a heuristic device. Progress in this seminar would look like **Conceptual Pluralism** rather than **Theoretical Unification.**

  **Progress would involve:**
  1.  **Division of Labor:** Acknowledging that LE is excellent for *structural/background* justice (taxation, inheritance, education funding) where individual choices are aggregated and statistical luck dominates. Acknowledging that RE is essential for *interactional/frontline* justice (welfare administration, disability accommodation, criminal justice) where social meaning and status dominate.
  2.  **Abandoning the "Single Principle" Dream:** Admitting that "Equality" is not a single value that can be captured by one metric (resources, welfare, opportunity). It is a cluster concept. Progress is mapping which cluster concept applies to which domain.
  3.  **Reframing Responsibility:** Moving away from "metaphysical responsibility" (could you have done otherwise?) to "political responsibility" (is it fair to ask the collective to bear this cost?). This dissolves the Cohen regress by making it a political negotiation rather than a metaphysical discovery.

  **What does NOT count as progress:**
  *   Another refinement of the envy test.
  *   Another hypothetical case about champagne vs. cheap wine.
  *   Trying to prove Relationalism can handle distributive math (it can't, and doesn't want to).
  *   Trying to prove LE can avoid stigma (it can't, because its logic requires scrutiny of choices).

  ### 4. Why Has the Debate Continued for 40 Years?
  If the diagnosis is correct, why hasn't the field moved on?

  1.  **High Stakes:** This isn't just academic. It maps directly onto the Welfare State vs. Libertarianism debate. LE provides the intellectual backbone for conditional welfare (you get help if you're truly unlucky). RE provides the backbone for universal basic services (you get help because you're a citizen). Policymakers need to know which to implement.
  2.  **The Allure of Elegance:** LE is theoretically beautiful. It promises a unified field theory of justice derived from a single intuitive axiom (luck is arbitrary). Giving it up feels like surrendering to moral messiness. Philosophers are resistant to admitting their elegant theory is a category error.
  3.  **The "Hard Cases" Persist:** Disability and religious accommodation *must* be solved. LE offers a clear (if harsh) answer. RE offers a clear (if expensive) answer. Because neither answer is perfectly satisfying to all intuitions, the debate cycles as new generations hope to square the circle.

  ### Summary for the Seminar
  To break the static debate, propose a **moratorium on adjudication.**

  Ask the seminar to stop asking "Who is right about the expensive tastes case?" and start asking: **"What work is this concept of responsibility doing for each theory?"**
  *   For LE, responsibility is the *ground* of justice.
  *   For RE, responsibility is a *constraint* on justice (we shouldn't punish people), but not the ground.

  The progress lies in realizing that **Luck Egalitarianism is a theory of Compensation, while Relational Egalitarianism is a theory of Membership.** They are not rivals; they are different tools. The stalemate exists because everyone is trying to use a hammer to turn a screw. Acknowledging this allows you to keep the insights of both without demanding they cohere into a single system.
