      *(Specific focus on the "objective wrongness" point)*: The roommate says "moral claims aren't true or false." Nietzsche would say they are expressions of will to power. They aren't "facts" like science, but they aren't meaningless. They have effects. The roommate's leap to "nothing is really wrong" sounds like moral nihilism. Nietzsche is not a nihilist; he diagnoses nihilism. I need to make this distinction clear.

