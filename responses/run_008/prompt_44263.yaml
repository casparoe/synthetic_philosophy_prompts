      *   *The Quantitative Camp (e.g., Sascha Becker, Ludger Woessmann, modern econometrics):* They treat "Protestant Ethic" as a treatment variable. They look for exogenous variation (e.g., proximity to Wittenberg). They control for confounders. Their criterion for success is statistical significance and robustness.
      *   *The Interpretive Camp (e.g., Gordon Marshall, Peter Ghosh, philosophical Weberians):* They argue Weber was tracing a *logical* or *meaningful* connection, not a temporal/causal one in the Humean sense. They focus on the *spirit* of capitalism (an ethos) rather than capitalism itself (economic systems). Their criterion for success is plausibility and coherence of the narrative.
