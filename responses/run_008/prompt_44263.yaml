answer: |-
  Dear Colleague,

  It is a pleasure to engage with a mind that has traversed the rigorous terrain of epidemiology only to find itself contemplating the murky waters of social theory, for your intuition regarding the stalemate over Weber is remarkably sharp. You have correctly identified that the friction between the quantitative and interpretive camps is not merely a matter of conflicting data or insufficient controls, but rather a deeper discordance regarding what constitutes a satisfactory explanation in the social sciences. Your working hypothesis, that this is a dispute about the nature of explanation itself, is the most robust diagnosis available, though it requires some refinement to account for the specific ontological commitments each side brings to the text. The quantitative camp, operating within a tradition that owes much to Hume and later to the potential outcomes framework you know well, seeks to establish a counterfactual dependence: had the treatment not occurred, would the outcome have differed? For them, explanation is synonymous with causal identification, and success is measured by the stability of the coefficient against confounding. The interpretive camp, drawing from the hermeneutic tradition of Dilthey and Weber's own methodological writings on Verstehen, seeks to establish meaningful coherence: does this action make sense given the actor's worldview? For them, explanation is synonymous with intelligibility, and success is measured by the plausibility of the narrative connection between religious anxiety and economic rationality.

  However, to say this is solely a dispute about explanation is to miss a second, equally critical divergence regarding the object of explanation, or the explanandum. When the quantitative researchers regress GDP growth or capital accumulation on Protestant affiliation, they are testing a claim about the emergence of capitalist systems. When the interpretive scholars defend Weber, they are often defending a claim about the emergence of the spirit of capitalism, which is an ethos rather than a system. Weber himself was arguably ambiguous on this distinction, shifting between discussing the material organisation of labour and the psychological predisposition to labour, but this ambiguity is the engine of the century-long conflict. The quantitative camp argues that even if the spirit existed, it did not cause the system, pointing to Catholic capitalists in Florence or Protestant paupers in Germany. The interpretive camp replies that Weber was never arguing that Protestantism was the sole cause of the system, but rather that it provided the specific moral legitimacy required for the system to become dominant rather than deviant. Consequently, the two sides are not merely grading the same facts against incommensurable standards of success; they are often looking at different facts entirely. One looks at balance sheets and population statistics, while the other looks at sermons, diaries, and conduct manuals. This supports your rival hypothesis that they are answering different questions under one name, but it is more than a spurious conflict because Weber explicitly linked the two, claiming the spirit was a precondition for the system. Therefore, the conflict is genuine because the thesis itself binds the intelligible disposition to the historical outcome.

  Regarding the possibility that this is a disguised factual question that better evidence could settle, I must be pessimistic. We have seen centuries of historical scrutiny and decades of modern econometrics, including clever instrumental variables such as proximity to Wittenberg, and the debate persists not because the data is noisy, but because the theory is under-specified for quantitative testing. You know from your own field that defining a treatment variable is crucial, yet here the treatment is not a binary pill but a complex, evolving cultural syndrome that interacts with geography, state capacity, and technology. To reduce the Protestant Ethic to a dummy variable is to commit a category error that no amount of statistical power can correct. Conversely, to insist that the historical correlation is irrelevant to the philosophical argument is to insulate the thesis from any worldly constraint, rendering it unfalsifiable and thus scientifically inert. The dispute is therefore not resolvable by more evidence because the disagreement lies in how evidence is permitted to count against the theory. The quantitative side demands that the causal link hold net of confounders, while the interpretive side argues that the confounders are part of the very historical constellation Weber was describing, and controlling for them removes the phenomenon of interest.

  This leads me to a fourth diagnosis, which synthesises your insights: the dispute is a methodological tragedy resulting from the fragmentation of social science. In Weber's time, the distinction between causal sociology and interpretive sociology was analytical, meant to be used in tandem to provide a complete picture of social action. He sought to show that the action was meaningful and that this meaningful action had causal consequences. Modern academia has severed this link, assigning causal inference to economists and epidemiologists and meaningful interpretation to historians and philosophers. The stalemate is the inevitable result of two specialised languages trying to evaluate a hybrid argument. Progress, therefore, will not come from one side defeating the other, nor from a magical new dataset. It will come from a reformulation of the question that acknowledges the limits of both approaches. We must accept that the quantitative camp can validly test whether Protestant regions grew faster, but they cannot test whether that growth was driven by the specific psychological mechanism Weber described, as internal states are not directly observable in historical data. Similarly, the interpretive camp can validly show that the ethic made capitalism intelligible, but they cannot prove it was historically necessary or sufficient without engaging with the counterfactuals the quantifiers raise.

  So, to offer you the straight answer you requested: the dispute is not resolvable in the sense that one side will be proven right and the other wrong, because the thesis itself contains two distinct claims that have been conflated. There is a causal claim about economic history and a hermeneutic claim about moral psychology. The causal claim is likely false, or at least vastly overstated, when subjected to the rigorous controls you would recognise as necessary, for capitalism is too multifaceted to have a single religious cause. The hermeneutic claim, however, remains robust and insightful, as it successfully elucidates how religious doctrine can transform economic behaviour from sin into virtue. Progress would require us to stop trying to kill the hermeneutic claim with causal data, and stop trying to defend the causal claim with hermeneutic nuance. We should expect a permanent stalemate only if we continue to insist that Weber's thesis is a single proposition. If we split it, as your second rival hypothesis suggested, the conflict dissolves, but we must be honest that this diminishes Weber's original ambition. He wanted to show that ideas have material force, and while we can show they have meaning, proving they have force requires a bridge between interpretation and causation that neither camp currently possesses. Thus, the most honest path forward is to treat the thesis not as a hypothesis to be verified or falsified, but as a heuristic framework that highlights specific mechanisms, such as the valuation of time or the ethics of saving, which can then be tested in isolation, while accepting that the grand historical narrative will always remain a matter of interpretation rather than proof.
