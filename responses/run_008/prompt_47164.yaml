      *(Self-Correction on the "Fatal" ranking)*: Is underdetermination *fatal*? Not if you accept auxiliary assumptions. So it's fatal to *naive* IRL, but manageable for *sophisticated* IRL. I need to make that distinction clear. The "Fatal" defeater is the claim that you can do this *without* normative assumptions.

      *(Refining the "Confidently Wrong" example)*: The classic example is the "Procrastinator." Behavior: Delay. Inference: Prefer later. Reality: Prefer sooner, but suffer from time-inconsistency. If the model assumes time-consistency, it infers the wrong preference confidently.

