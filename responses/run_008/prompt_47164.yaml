  5.  **Drafting Content - Section by Section (Iterative Refinement):**

      *   *Identification:* Cite Armstrong & Mindermann (2018). This is the "No Free Lunch" theorem for IRL. It's not just "multiple rewards," it's "rewards + biases are indistinguishable without normative assumptions." *Status:* Strong formal result.
      *   *Irrationality:* Differentiate between *trembling hand* (noise) and *systematic bias* (e.g., present bias). Trembling hand is fine for IRL. Systematic bias breaks the "optimality" assumption unless the bias is modeled *into* the planner. But if you model the bias, you need prior knowledge of the bias. Circular?
      *   *Ontology:* Economists (Samuelson) often say preferences *are* choices (Revealed Preference). Psychologists/Philosophs say preferences are mental states *causing* choices. If the latter, inference is harder. *Status:* Contested.
      *   *Unfalsifiability:* If every anomaly is explained by "oh, they had a different belief" or "oh, that's a cognitive bias," does the theory lose content? Compare to Expected Utility Theory (EUT). EUT survived anomalies by adding parameters (Prospect Theory), but some argue it lost its normative bite.
      *   *Confidently Wrong:* Give an example. Inferring someone *likes* procrastination because they delay, when they actually *hate* it (akrasia). This is a value judgment error, not just precision error.

  6.  **Refining the "Consensus vs. Contestation" Requirement:**
