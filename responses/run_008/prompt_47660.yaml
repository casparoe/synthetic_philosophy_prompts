prompt: |-
  I keep going back and forth on luck egalitarianism and I want to figure out what I actually believe by just listing my gut verdicts on cases. I'm hoping you can find the principle behind them, if there is one. You should treat this as if you're a professional political philosopher who specializes in distributive justice, and please actually think through each case carefully rather than jumping to the first theory that fits -- maybe start with a little brainstorming of candidate principles before committing.

  Here are my verdicts:

  1. Someone born with a condition that requires expensive medication for life: society should cover it. Obviously.
  2. Someone with perfectly good career options who chooses to surf and live cheaply on the beach instead, and ends up poor: no compensation. Their poverty tracks their choice.
  3. A gambler who fully understands the odds, plays a fair game, and loses everything: no compensation. That's textbook option luck and I'm fine with it.
  4. Same gamble, same odds, but this person grew up with a gambling-addicted parent in a town where basically everyone gambled, and realistically was never going to end up any different. Here I flip-flop constantly. Some days I think we compensate, some days not.
  5. A rock climber who takes a bad fall on a hobby trip and ends up with huge medical bills and unable to work: I don't think they should be fully compensated, or at least it feels different from case 1. They chose the risk for fun.
  6. A fisherman who takes a dangerous job because it's the only decent-paying work in his town and he's supporting a family, and gets seriously injured: I think he should be compensated. But wait -- he also knowingly took the risk, so how is this different from the climber? I can feel the tension and I can't resolve it myself.
  7. Someone who cultivates expensive tastes (develops a love of fine wine, needs the good stuff to be content): no compensation for the extra cost of their preferences.
  8. Someone whose religious commitments are genuinely expensive -- keeping strict kosher, required pilgrimage, etc.: this feels different from the wine person, and I'm inclined to say we do accommodate these costs somehow. But I can't easily say why the wine preference is her problem and the religious obligation isn't. Maybe you can help me out here.
  9. Someone who could afford actuarially fair health insurance and chose not to buy it, then gets seriously ill: no compensation for the choice not to insure. But someone who was too poor to buy the same insurance and gets ill: compensate. This pair I feel fine about.

  So: is there a single principle that captures all or most of these? The obvious move is the brute luck / option luck distinction, but notice it doesn't obviously handle 5 vs 6 (both are chosen risks) or 7 vs 8 (both are expensive preferences), so you'll need something more fine-grained than that -- maybe something about the range of reasonable alternatives available when the choice was made, or something about what we can trace to a person's genuine ambitions versus their circumstances. I'm genuinely unsure.

  What I want from you:

  - A principle, or maybe two or three candidates, stated precisely. If you give multiple, say what separates them and which cases each one is built to handle.
  - Run the principle against all nine of my verdicts explicitly. Don't skip the awkward ones.
  - A clear verdict on case 4, with your reasoning.
  - What the principle says about cases I haven't listed, e.g. someone who doesn't save for retirement because they're a hopeless optimist (not irrational exactly, just permanently convinced things will work out), and someone who chose a low-paying passion career because of a childhood where money was treated as dirty in their family.
  - An honest accounting of which of my verdicts, if any, you'd have to overturn to get a clean principle -- and which verdict you'd overturn first, and why. Don't cheat by writing a principle so vague it fits everything.

  Also, if you think my intuitions on 7 vs 8 or 5 vs 6 are just incoherent and need to go, say so directly. I'd rather hear that than get a principle gerrymandered to save everything. Please write the final principle in plain language though -- no jargon walls, define any technical terms you use.
