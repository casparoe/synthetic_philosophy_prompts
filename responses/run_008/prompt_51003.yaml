          *   *Convergence:* Matches Putnam's "alien/animal" argument well. It's about *kinds* across *types* of systems. Distortion: Evolution is historical/contingent; MR is often presented as metaphysical/nomological. Convergence implies separate evolutionary histories, whereas MR often implies simultaneous possibility.
          *   *Degeneracy:* Matches neural plasticity/individual variation better. It's about *tokens* or *states* within a *type* of system. Distortion: Degeneracy is often about robustness/failure modes, whereas MR is about definition/identity. Degeneracy implies context-sensitivity (structure A works until condition X, then structure B), whereas classic MR often assumes a stable mapping for the duration of the state.
