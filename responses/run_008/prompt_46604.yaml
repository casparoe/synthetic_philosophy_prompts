      *Setup:* In Parfit's Hitchhiker case, you need a ride home. The driver will only help if they predict you'll pay upon arrival. But once safe, paying costs you $1000 with no return. A purely act-maximizing agent won't pay, so gets no ride. Your groupmate argues you should cultivate an "irrational" disposition to pay anyway. The skeptic calls this a word game confusing act-level and disposition-level rationality.

      *Readings:*
      1. **Disposition vs. Act Evaluation:** This reading claims rationality primarily assesses dispositions, not isolated acts. It is rational to acquire a disposition that sometimes produces locally suboptimal acts if having that disposition maximizes overall welfare. *Status:* Substantive and defensible (Parfit's view). *Support:* Directly supports cultivating the disposition, though it redefines "rational act" to mean "flowing from a rational disposition."
