answer: |-
  **Setup**
  In Parfit's Hitchhiker case, you need a ride home. The driver will only help if they predict you'll pay upon arrival. But once safe, paying costs you $1,000 with no return. A purely act-maximizing agent won't pay, so they get no ride. Your groupmate argues you should cultivate an "irrational" disposition to pay anyway. The skeptic calls this a word game confusing act-level and disposition-level rationality. The slogan "it can be rational to be irrational" is the pivot point, but it conflates several distinct claims about agency and evaluation.

  **The Readings**

  1.  **Disposition vs. Act Evaluation:** This reading claims rationality primarily assesses dispositions, not isolated acts. It is rational to acquire a disposition that sometimes produces locally suboptimal acts if having that disposition maximizes overall welfare. *Status:* Substantive and defensible. *Support:* Directly supports cultivating the disposition. However, it implies the act itself is only "irrational" relative to a narrow theory; relative to the disposition, it is correct.
  2.  **Instrumental Irrationality:** This claims the act of paying is genuinely irrational (dominated), but causing yourself to perform it is rational. The slogan means "it is rational to cause irrational acts." *Status:* Defensible but semantically tricky. *Support:* Supports self-binding or manipulation, but admits the payment itself remains irrational by standard decision-theoretic lights. You aren't becoming irrational; you are engineering an irrational output for a rational goal.
  3.  **Resolute Choice:** This claims rationality allows rejecting future maximization to honor prior intentions. You aren't irrational for paying; you are rationally resolute. The "irrationality" is only from a narrow, myopic view. *Status:* Substantive but controversial. *Support:* Supports paying without self-deception, but requires revising standard rational choice theory to allow dynamic inconsistency. It denies the act is irrational at all.
  4.  **Strategic Simulation:** This claims you should merely *appear* irrational to the driver while remaining act-rational internally. *Status:* Trivially true but practically difficult. *Support:* Supports pretending, not actually becoming irrational. If the driver detects the simulation (as Parfit assumes), you get no ride. This reading fails to solve the problem unless you can perfectly mimic the disposition you lack.

  **What the slogan probably meant here**
  In decision theory discussions, this slogan usually targets Reading 1. It highlights a failure in Act-Consequentialism or Causal Decision Theory. The point isn't that breaking logic is good, but that an agent-type defined by standard rationality loses out against an agent-type defined by commitment. The slogan is provocative shorthand for "the rational disposition produces acts that look irrational to a myopic maximizer." Your groupmate likely intends this: you should become the type of person who pays, even if a snapshot analysis of the payment looks like a loss. The skeptic opposes this by insisting that if the act loses utility, it is irrational, full stop.

  **Loose ends**
  The hardest question is voluntarism: can you actually choose your dispositions? If you are rational, can you genuinely convince yourself to be irrational, or only simulate it? If simulation fails against perfect predictors, you might need actual self-deception. This raises whether rationality can demand making yourself less transparently rational. Furthermore, if you succeed in becoming the "irrational" type, are you still a rational agent managing a tool, or have you ceased to be rational altogether? This tension suggests the slogan might ultimately dissolve into a debate over how we define the agent versus the action.
