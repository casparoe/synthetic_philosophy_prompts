answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Disaster Triage Guideline: Resource Allocation in Equal-Prognosis Scenarios

  **Purpose**
  This memo addresses the unresolved question from our last tabletop exercise: When clinical prognosis is identical across two disaster scenes, but patient headcount differs (e.g., five patients vs. one patient), does our mobile ICU team deploy to the larger group?

  **Policy Recommendation**
  I recommend we adopt **"Maximize Survival" as a hard default.** In scenarios where clinical need and survival probability are equal, resources must be directed to the location with the higher number of salvageable patients. We should not employ a lottery or coin flip in this specific context.

  **The Philosophical Objection**
  We must take the opposition seriously. The argument against counting numbers (championed by philosopher John Taurek) rests on a powerful intuition: *Separateness of Persons.*

  Taurek argues that "the group of five" does not feel pain; only individuals do. The single patient faces 100% loss if ignored. Each of the five faces 100% loss if ignored. From the perspective of the single patient, being sacrificed for the five is a total violation of their right to equal concern. If we flip a coin, every individual has a 50% chance of survival. If we save the five, the one has a 0% chance. Taurek argues that fairness requires we give every individual an equal chance, regardless of how many others are standing next to them.

  This is not a strawman. It highlights a genuine moral residue. We are effectively telling the one patient that their life is worth less than the sum of the others.

  **Why We Count Anyway**
  Despite the strength of Taurek's individual-focused ethics, a hospital ethics committee operates under **stewardship ethics**, not just interpersonal fairness.

  1.  **Institutional Mandate:** We are not private citizens choosing who to save with our own bodies; we are public trustees allocating limited public resources. Our mandate is to minimize the total harm suffered by the community during a disaster. To intentionally allow more deaths when fewer were possible is a failure of that stewardship.
  2.  **The "Fairness" Reversal:** Is it fair to the five to deny them rescue so that the one has a 50% shot? A lottery prioritizes the *procedure* of fairness over the *outcome* of survival. In medicine, outcomes matter.
  3.  **Operational Reality:** A guideline requiring triage officers to calculate probabilities for a coin flip in an active disaster introduces hesitation. "Maximize Survival" is a clear heuristic that reduces cognitive load during crisis.

  **What Exactly Are We Counting?**
  This is the question that keeps us up at night. If we save the five, are we saying the "group" matters more than the "individual"?

  No. We are not counting a "super-entity." We are counting **distinct, preventable tragedies.**

  When we choose the five, we are not saying their collective pain outweighs the one's pain. We are acknowledging that there are five distinct futures being extinguished rather than one. The loss is not aggregated into a single block; it is summed. We are minimizing the *total number of individual losses*, not maximizing the welfare of a collective hive.

  **Communication with Families**
  Does this change how we speak to the family of the one patient we did not save? Yes.

  *   **Do not say:** "There were more of them." This implies their loved one was worth less.
  *   **Do say:** "In a disaster with limited resources, our protocol requires us to prevent as many deaths as possible. We acted to save the maximum number of lives. This was not a judgment on the value of your loved one, but a triage necessity to minimize total loss."

  We must validate that the loss of one is a tragedy, even if it was the "smaller" tragedy available. We do not hide behind the math; we own the math as a burden of our role.

  **The Option of Refusal**
  Some have suggested we leave this undefined, allowing the triage officer to decide in the moment, or mandate a lottery to remain "neutral."

  *   **A Lottery Policy:** This is not neutrality; it is taking Taurek's side. It prioritizes individual chance over total survival.
  *   **Ambiguity:** Leaving this to discretion is not wisdom; it is **cowardice.** It offloads a moral dilemma onto exhausted clinicians without guidance, inviting moral injury and legal liability. If we cannot decide the ethics in a quiet conference room, we cannot expect a paramedic to decide them on a smoky highway.

  **Conclusion**
  Marcus is right that the numbers don't change the *value* of a single life. But they do change the *consequences* of our choices. We cannot save everyone. When forced to choose, the ethical duty of a medical institution is to ensure that the sacrifice of the few actually results in the survival of the many. Anything else renders the sacrifice meaningless.

  I move we adopt "Maximize Survival" as the standard for the upcoming guideline draft.

  [Your Name]
  Ethics Committee Member
