  i've been getting into philosophy of perception via a podcast — the kind where a host with no guests rambles for an hour — and in the episode on perception he gave this rundown of the argument from illusion and disjunctivism, roughly: when a stick looks bent in water, or a man in the DTs sees pink rats, what he's aware of isn't the physical thing but an inner picture, a sense-datum; and since a hallucination can be indistinguishable from genuine seeing, the best explanation is that even in ordinary veridical cases we're directly aware of the same kind of inner thing, so perception never actually puts us in touch with the world. Disjunctivism, he said, bites the bullet by denying the premise: a veridical perception and a subjectively indistinguishable hallucination share nothing as mental states — different in kind, not degree — and the payoff is meant to be anti-sceptical, the perceiver being in a better epistemic position than the hallucinator. But then he said the cost is that if the two states have literally nothing in common, the disjunctivist has nothing available to explain why they seem the same from the inside, which is why it remains a minority enthusiasm kept alive by a few oxford types.

