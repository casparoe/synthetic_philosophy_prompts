prompt: |-
  I cover science and ideas for a national newspaper, and an increasing share of my beat consists of expert advisory bodies: vaccine safety committees, dietary guideline panels, drug advisory boards, and the occasional multinational consortium issuing a consensus statement. The recurring problem is how to characterize, in a two-hundred-word brief filed on deadline, what a panel actually decided — because what a panel collectively concludes is often not what a majority of its members individually believe. The judgment-aggregation literature has a name for the cleanest version of this, the discursive dilemma, along with a family of distinctions I only half understand: premise-based versus conclusion-based aggregation, agenda-sensitivity, oligarchic rules, the possibility that a group's official position is one no member holds. What I need is a procedure a working reporter can actually run.

  Please write that procedure: an ordered sequence of steps for deciding, given a committee's vote record or published annex, whether to lead with the collective conclusion as issued, whether to report the premise-level votes instead, when the word "split" is honest and when it misleads, and when the aggregation method itself is the story. For each step, state what counts as a sufficient answer, and what to do when the record is incomplete or the aggregation rule is undisclosed. The procedure must run in the ninety minutes between a press release landing and my deadline; it must be usable by a reporter who can read a technical annex but has never studied formal logic; and it must mark the points at which it stops and hands the question to a human — for instance, whether a committee's chosen aggregation rule is normatively legitimate is not something a reporter can adjudicate on deadline, but whether the rule was disclosed is a reportable fact.

  Then run the procedure on three cases. First: a nine-member vaccine advisory committee where the proposition that an adverse event is causally linked to a vaccine passes five to four, the proposition that the link is serious enough to outweigh the benefit in a given subgroup passes five to four on the strength of a different majority — one member in the overlap — so that the recommended contraindication fails eight to one, and the committee announces it found no basis for restricting use. Second: a dietary panel that is unanimous, nine to zero, on each factual premise, but splits five to four on the normative conclusion about whether the risk warrants new guidance. Third: a panel whose votes are weighted and whose chair holds a tie-break, so that the aggregation rule can be only partly reverse-engineered from the published annex. Include at least one case where the procedure yields an answer I will not like — for instance, that the honest brief states the committee's official conclusion flatly, without the premise-level splits that would make a better story — and close with a candid account of where the procedure will misfire and what it cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Analyze the Request:**
      *   **User:** Science/Ideas reporter for a national newspaper.
      *   **Problem:** Characterizing expert advisory body decisions (vaccine, diet, drugs) where collective conclusions $\neq$ individual member beliefs (Discursive Dilemma/Doctrinal Paradox).
      *   **Task:** Write a practical, 90-minute procedure for reporters to decide how to report these decisions (lead with conclusion vs. premises, when to use "split," when the method is the story).
      *   **Constraints:**
          *   Must be usable by a non-logician reporter.
          *   Must fit within a 90-minute deadline window.
          *   Must specify "sufficient answers" and "missing record" protocols.
          *   Must identify hand-off points (where human judgment is needed).
          *   Must run the procedure on three specific cases (Vaccine, Dietary, Weighted/Chair).
          *   Must include an outcome the reporter won't like (e.g., boring truth vs. exciting split).
          *   Must close with limitations/misfire analysis.
      *   **Tone:** Professional, pragmatic, authoritative, slightly weary (matching the reporter's vibe).

  2.  **Deconstruct the Core Problem (The Discursive Dilemma):**
      *   *Premise-based:* Vote on facts/premises, logic dictates conclusion. (Often more accurate to belief, but might not match official output).
      *   *Conclusion-based:* Vote directly on the recommendation. (Official output, but might mask disagreement on *why*).
      *   *The Risk:* Reporting the official conclusion might hide that the reasoning was fractured. Reporting the fractures might misrepresent the official guidance.

  3.  **Drafting the Procedure (The "90-Minute Protocol"):**
      *   *Goal:* A checklist/flowchart style that forces specific document checks.
      *   *Time Allocation:* 90 mins total. Need to budget time.
      *   *Steps:*
          1.  **Locate the Rule (15 mins):** Find *how* they decided. Is it premise or conclusion based?
          2.  **Map the Vote (30 mins):** Compare individual votes on premises vs. conclusion.
          3.  **Check the Gap (15 mins):** Is there a contradiction between the majority view on premises and the official conclusion?
          4.  **Drafting Decision (20 mins):** Choose the lead based on the gap.
          5.  **Hand-off/Qualification (10 mins):** What needs editor input or specific phrasing?
      *   *Refining the Steps:* Make them actionable. "Read the charter," "Count the matrix."
      *   *Handling Missing Info:* If the rule isn't public, report the opacity.
      *   *Hand-off Points:* Normative legitimacy (is the rule *fair*?) is out of scope. Transparency is in scope.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Vaccine):* The Classic Discursive Dilemma.
          *   Premise A (Causal Link): 5-4 Yes.
          *   Premise B (Severity/Benefit): 5-4 Yes (different 5).
          *   Conclusion (Restrict): 1-8 No (Only the overlap votes Yes).
          *   Official: No restriction.
          *   *Procedure Outcome:* The official conclusion is logically consistent with the voting rule (likely conclusion-based), but the premises show a majority believes there is a risk. This is the "answer I won't like" case. The truth is the boring "No restriction," but the nuance is the split. The procedure should dictate leading with the official decision but noting the fracture in the second graf.
      *   *Case 2 (Dietary):* Unanimous Facts, Split Values.
          *   Premises: 9-0.
          *   Conclusion: 5-4.
          *   *Procedure Outcome:* This is a values clash, not a fact clash. Lead with the split recommendation, note the factual consensus. "Split" is honest here.
      *   *Case 3 (Weighted/Chair):* Opacity.
          *   Votes don't add up simply. Chair has tie-break.
          *   *Procedure Outcome:* The aggregation rule is the story. Report the opacity.

  5.  **Refining the "Unpleasant Answer":**
      *   In Case 1, the reporter wants to write "Committee Split on Vaccine Risk." But the procedure might say "Committee Rejected Restriction." Why? Because the *decision* is what affects public health. The *reasoning* is internal. The procedure must prioritize the actionable outcome while flagging the instability. I need to make sure the procedure doesn't encourage sensationalizing the premise split over the actual conclusion.

  6.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the pressure.
      *   *The Protocol:* Numbered steps. Clear "If/Then" logic.
      *   *The Cases:* Apply the steps rigorously.
      *   *The Limitations:* Be honest about what this tool can't do (e.g., it can't fix broken science, only report the process).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the procedure too academic?
      *   *Fix:* Use newsroom language ("lede," "nut graf," "on the record").
      *   *Critique:* Did I address the "missing record" constraint?
      *   *Fix:* Add specific "Missing Data" clauses in each step.
      *   *Critique:* Is the hand-off clear?
      *   *Fix:* Explicitly state "Stop and call the editor" at the normative judgment point.
      *   *Critique:* Did I include the "unpleasant answer"?
      *   *Fix:* Ensure Case 1 explicitly tells the reporter *not* to lead with the split, even though it's juicier.

  8.  **Final Polish:** Check word count (roughly, though not strictly enforced, keep it tight), tone (professional, direct), and ensure all prompt requirements are met. (Wait, I need to make sure I don't lecture too much on logic and keep it to the *procedure*).

      *   *Key distinction:* Premise-based (vote on reasons, conclusion follows) vs. Conclusion-based (vote on outcome).
      *   *The "Discursive Dilemma":* Majority says Yes to Premise 1, Yes to Premise 2, but No to Conclusion (because the Yes voters aren't the same people).
      *   *Case 1 Analysis:* 5 say Link. 5 say Serious. Only 1 says Both. So 8 say "Don't Restrict." Official: "Don't Restrict." This is a Conclusion-Based aggregation. The reporter wants to say "5 members found a link." The procedure must say "Lead with the decision, contextualize the link."

      *   *Case 2 Analysis:* 9 say Fact. 5 say Act. This is a values split. Lead with the split.
      *   *Case 3 Analysis:* Black box. Lead with the opacity.

      *   *Limitations:* It doesn't solve the "which is better?" question (premise vs conclusion voting). It just exposes the mechanic.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### The 90-Minute Aggregation Protocol

  **Objective:** Determine whether the *decision* or the *division* is the news, based on the committee's voting structure.
  **Time Budget:** 90 Minutes.
  **Tools:** Press release, meeting minutes/vote annex, committee charter (for voting rules).

  #### Step 1: Locate the Aggregation Rule (Minutes 0–15)
  **Action:** Search the committee charter or opening minutes for the voting standard. Look for phrases like "majority vote on the recommendation" (Conclusion-Based) or "majority vote on findings determines recommendation" (Premise-Based).
  *   **Sufficient Answer:** A explicit statement of how individual votes translate to group output.
  *   **Missing Record:** If the rule is undisclosed, note this explicitly. *Default assumption:* Treat as Conclusion-Based (the announced decision stands), but flag the opacity in the second paragraph.
  *   **Hand-off:** If the rule seems to violate the committee's own statutory charter (e.g., a simple majority used where a supermajority is required), stop. This is a procedural violation, not a logic puzzle. Consult the editor.

  #### Step 2: Map the Vote Matrix (Minutes 15–45)
  **Action:** Construct a grid. Rows = Members. Columns = Key Premises (facts, causal links) and Final Conclusion (recommendation). Fill in Yes/No/Abstain.
  *   **Sufficient Answer:** You can identify if the majority on the premises matches the majority on the conclusion.
  *   **Missing Record:** If individual votes on premises are not recorded (only the final tally), you cannot run this protocol. Report the final tally and note that individual reasoning is unrecorded.
  *   **Check:** Calculate the "Overlap." How many members voted Yes on *all* necessary premises?

  #### Step 3: Check the Gap (Minutes 45–60)
  **Action:** Compare the "Overlap" count (Step 2) to the "Conclusion Yes" count.
  *   **Scenario A (Consistent):** The members who voted Yes on premises are the same as those who voted Yes on the conclusion.
  *   **Scenario B (Discursive Dilemma):** A majority supports each premise, but the *intersection* of those majorities is a minority, leading to a failed conclusion.
  *   **Scenario C (Values Split):** Unanimous or near-unanimous premises, but a split conclusion.
  *   **Sufficient Answer:** Identification of Scenario A, B, or C.

  #### Step 4: Drafting Decision (Minutes 60–80)
  **Action:** Select the lede based on the Scenario.
  *   **If Scenario A:** Lead with the decision. The reasoning is stable.
  *   **If Scenario B (The Dilemma):** Lead with the **official decision**. Do not lead with the premise splits. The committee's output is the policy reality. *However*, the second paragraph must state: "While the committee rejected [X], a majority of members individually found [Premise 1] and [Premise 2] to be true."
      *   *Constraint:* Do not use the word "split" to describe the final decision if the vote was lopsided (e.g., 8-1 against). Use "split" only for the premise-level findings.
  *   **If Scenario C:** Lead with the **split**. The facts are settled; the disagreement is normative/political. "Split" is honest here.
  *   **If Rule Undisclosed:** Lead with the decision. Add: "The committee did not disclose how individual votes were aggregated."

  #### Step 5: Normative Hand-off (Minutes 80–90)
  **Action:** Review your characterization of the rule.
  *   **Stop Point:** You are reporting *that* a rule was used, not *whether it was right*. Do not write that the committee "failed" or "erred" by using conclusion-based aggregation if that is their standard practice.
  *   **Hand-off:** If the aggregation method renders the decision logically incoherent (e.g., they voted Yes on "Drug is Unsafe" but Recommended "Approve"), query the chair for comment. If no comment, report the incoherence as a fact, not a verdict.

  ***

  ### Case Runs

  #### Case 1: The Vaccine Advisory Committee (The Discursive Dilemma)
  *   **Data:** Link (5-4 Yes); Severity (5-4 Yes, different members); Restriction (1-8 No). Official: No restriction.
  *   **Step 1 (Rule):** Charter implies Conclusion-Based (recommendation requires majority).
  *   **Step 2 (Matrix):** Overlap on premises = 1 member. Conclusion Yes = 1 member.
  *   **Step 3 (Gap):** Scenario B. Majority believes premises, but minority supports conclusion.
  *   **Step 4 (Draft):** **Unpleasant Answer.** You cannot lead with "Committee Split on Risk." The decision was 8-1. You must lead: "Advisory Panel Rejects Vaccine Restriction." The nuance belongs in the nut graf: "Although eight members voted against restriction, five individually acknowledged a causal link, and five acknowledged severity, though only one member affirmed both."
  *   **Step 5 (Hand-off):** No hand-off. The rule was followed, even if the outcome feels counterintuitive.
  *   **Result:** A boring lede that protects accuracy over drama.

  #### Case 2: The Dietary Guideline Panel (The Values Split)
  *   **Data:** Premises (9-0 Consensus); Conclusion (5-4 New Guidance).
  *   **Step 1 (Rule):** Conclusion-Based.
  *   **Step 2 (Matrix):** Premise consensus is total. Conclusion is narrow.
  *   **Step 3 (Gap):** Scenario C. No logical contradiction, just preference divergence.
  *   **Step 4 (Draft):** Lead with the split. "Panel Divided on New Sugar Limits Despite Factual Consensus." The word "split" is honest because the disagreement is on the *action*, not the *science*.
  *   **Step 5 (Hand-off):** None. This is a policy story, not a logic story.

  #### Case 3: The Weighted Consortium (The Black Box)
  *   **Data:** Votes published, but totals don't match headcount. Chair has tie-break. Weights undisclosed.
  *   **Step 1 (Rule):** Undisclosed/Partial.
  *   **Step 2 (Matrix):** Cannot fully map.
  *   **Step 3 (Gap):** Cannot calculate.
  *   **Step 4 (Draft):** Lead with the decision, but the *method* is the secondary hook. "Consortium Endorses Standard X." Follow with: "The voting record suggests a weighted system, though the organization did not disclose how member votes were tallied."
  *   **Step 5 (Hand-off):** If the chair's tie-break altered a majority will (e.g., 4-4 became 5-4 via chair), flag this to the editor. It may warrant a sidebar on governance.

  ***

  ### Limitations and Misfires

  This procedure will not save you from bad science, only from bad reporting about process. It misfires in three specific zones:

  1.  **The "Legitimacy" Trap:** The protocol tells you *how* they decided, not if that method was democratic or scientifically sound. A committee can logically follow a conclusion-based rule that suppresses the majority scientific view. You can report the suppression, but you cannot adjudicate the legitimacy on deadline. That requires a deeper investigation into the committee's design.
  2.  **The "Strategic Voting" Blind Spot:** Members may vote on premises strategically to force a desired conclusion (or vice versa). The vote matrix captures the *record*, not the *intent*. If a member votes "No" on a fact they believe is true to block a regulation they oppose, this protocol records it as a factual disagreement. You need a source to reveal the strategy.
  3.  **The "Boring Truth" Constraint:** As seen in Case 1, this procedure often forbids the "Split" headline you want to write. When the aggregation rule is conclusion-based, the 8-1 vote *is* the story, even if the 5-4 premise votes are more scientifically interesting. Ignoring this invites accusations of sensationalism from the committee. The protocol forces you to prioritize the policy outcome over the intellectual fracture.

  Use this to keep your copy honest, not to make the story bigger. If the procedure says the story is small, file it small.
