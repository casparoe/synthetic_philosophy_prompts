answer: |-
  You are not being obtuse. You have correctly identified that your TA is conflating at least three distinct philosophical positions that are often in tension with one another. The slogan "truth is what works" is a Rorschach test in philosophy; it can mean anything from a banal observation about evidence to a radical denial of objective reality.

  Here is a breakdown of the precise claims hidden behind that slogan, ordered from the most defensible to the most radical. You can bring this list to seminar to ask your TA to locate himself on it.

  ### The Spectrum of "Truth is What Works"

  #### 1. The Epistemic Criterion (The "Test" View)
  *   **The Claim:** "We cannot *recognize* truth independently of whether a belief leads to successful prediction and action. Success is the *sign* of truth, not the *definition* of it."
  *   **Status:** **Platitude.** Almost all realists accept this. We judge theories by how well they work, even if we believe truth is a matter of correspondence to reality.
  *   **TA's Moves:**
      *   (a) Galaxy: **No.** This view allows the fact exists even if we can't check it; we just can't *know* it.
      *   (b) Physics: **Yes.** We treat it as true because it works, pending better evidence.
      *   (c) God: **No.** Personal comfort is not a reliable test of objective truth.
  *   **Proponent:** Common sense; compatible with **Peirce** (as a method).

  #### 2. Peircean Convergence (The "Long-Run" View)
  *   **The Claim:** "Truth is the opinion fated to be ultimately agreed to by all who investigate. What 'works' is what survives the rigors of long-term scientific inquiry."
  *   **Status:** **Substantive & Defensible.** This is a robust realist theory. It ties truth to ideal inquiry, not immediate utility.
  *   **TA's Moves:**
      *   (a) Galaxy: **No.** Peirce was a scholastic realist; he believed there is a fact of the matter about the stars, even if we never find it.
      *   (b) Physics: **Yes.** Current physics is "true" insofar as it is the current stage of convergence.
      *   (c) God: **No.** Unless belief in God is the inevitable result of scientific inquiry (unlikely), this doesn't make it true.
  *   **Proponent:** **C.S. Peirce.**

  #### 3. Scientific Instrumentalism (The "Model" View)
  *   **The Claim:** "Theories are not 'true' descriptions of reality, but tools for organizing experience. To call a theory 'true' just means it is currently the most efficient tool we have."
  *   **Status:** **Substantive & Controversial.** It saves the phenomena but denies metaphysical commitment.
  *   **TA's Moves:**
      *   (a) Galaxy: **Maybe.** If the star count makes no difference to our models, the question is scientifically idle (though not necessarily metaphysically empty).
      *   (b) Physics: **Yes.** This is the classic instrumentalist move.
      *   (c) God: **No.** Instrumentalism is usually restricted to empirical sciences, not personal life-hacks.
  *   **Proponent:** Dewey (sometimes); Van Fraassen.

  #### 4. Verificationist Anti-Realism (The "Meaning" View)
  *   **The Claim:** "A statement has no truth value (is 'empty') unless there is a possible method to verify it. If a claim makes no practical difference to experience, there is no fact of the matter."
  *   **Status:** **Radical & Largely Rejected.** Quine and others showed that "verification" is harder to define than it looks, but it remains influential.
  *   **TA's Moves:**
      *   (a) Galaxy: **Yes.** This is exactly the argument your TA used. No verification = no fact.
      *   (b) Physics: **Yes.** Physics is verifiable.
      *   (c) God: **No.** Usually, verificationists are atheists/agnostics because God claims are unverifiable.
  *   **Proponent:** Logical Positivists; Dummett.

  #### 5. Jamesian Voluntarism (The "Cash-Value" View)
  *   **The Claim:** "Truth is what is good/expedient for us to believe. When evidence is inconclusive, we have a 'right to believe' based on our passional nature. If a belief improves your life, it is 'true for you'."
  *   **Status:** **Radical & Highly Controversial.** Often accused of licensing wishful thinking.
  *   **TA's Moves:**
      *   (a) Galaxy: **No.** Believing a specific star count usually has no "cash value," so James wouldn't call it true.
      *   (b) Physics: **Yes.** It works for our purposes.
      *   (c) God: **Yes.** This is the specific argument James made in *The Will to Believe*.
  *   **Proponent:** **William James.**

  #### 6. Radical Relativism (The "Rortyan" View)
  *   **The Claim:** "There is no objective reality to constrain us. 'Truth' is just a compliment we pay to beliefs that fit our current social or personal narrative."
  *   **Status:** **Flatly False (or Incoherent).** If truth is entirely relative, the statement "truth is relative" cannot be objectively true.
  *   **TA's Moves:**
      *   (a) Galaxy: **Yes.** (It doesn't fit our narrative, so discard it).
      *   (b) Physics: **Yes.** (It fits our narrative).
      *   (c) God: **Yes.** (It fits your narrative).
  *   **Proponent:** Rorty (charitably); Post-modernists.

  ---

  ### The "Dinosaur" Litmus Test
  You asked about claims with no practical upshot (like the star count, or "there was an even number of dinosaurs"). These cases separate the **Realists** (1 & 2) from the **Anti-Realists** (4, 5, & 6).

  *   **The Realist (Peirce):** "The number of dinosaurs *was* even or odd. Reality is what it is regardless of whether we can check. Inquiry aims to find this out."
  *   **The Anti-Realist (TA's Galaxy Move):** "Since we can never check, the question is meaningless. There is no fact."
  *   **The Jamesian (TA's God Move):** "If believing the dinosaurs were even makes you happy, it's true for you."

  **The Contradiction:** Your TA is using **View #4 (Verificationism)** to kill the Galaxy question (no verification = no fact) but using **View #5 (Jamesian Voluntarism)** to save the God question (no verification + utility = truth). These are logically incompatible. View #4 says utility doesn't matter if there's no empirical check; View #5 says utility *creates* truth when there's no empirical check.

  ### Seminar Strategy: Questions to Ask
  To pin him down without being "obtuse," ask him to choose between Peirce and James on these specific points:

  1.  **On the Galaxy:** "Professor, when you said the star count question was empty, were you arguing that we can't *know* the answer (Epistemic), or that there *is no answer* (Anti-Realist)? If there is no answer, isn't that a metaphysical claim that itself doesn't 'work'?"
  2.  **On the God Move:** "William James argued that religious belief can be true if it improves life, but C.S. Peirce argued truth is what the community of inquirers converges on in the long run. Are you saying religious belief is true because it's *useful to me* (James), or because it's *scientifically inevitable* (Peirce)?"
  3.  **The Trap:** "If truth is just what works, does that mean if believing the galaxy has an odd number of stars made my life better, it would become true? If not, why does utility count for God but not for stars?"

  ### Summary for your notes
  *   **Peirce** is a Realist. He thinks truth is stable and independent of what you want *now*. (Fits Physics, Rejects Galaxy dismissal, Rejects God).
  *   **James** is a Humanist. He thinks truth can be made by human needs in the absence of evidence. (Fits Physics, Rejects Galaxy dismissal, Accepts God).
  *   **Your TA** is mixing **Verificationism** (to dismiss the galaxy) with **Jamesian Voluntarism** (to validate God). This allows him to dismiss inconvenient facts while validating comforting fictions.

  You have spotted a genuine inconsistency. Good luck in seminar.
