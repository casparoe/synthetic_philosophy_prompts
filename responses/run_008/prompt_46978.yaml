answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Chair
  **DATE:** 10th [Month], 202X
  **SUBJECT:** Decision Memo: Geoscientific Monitoring Proposal & Risk Policy Framework

  **1. Executive Summary**

  Ahead of our meeting on the 14th, this memo sets out my recommendation regarding the proposal from the retired geoscientist concerning methane clathrate monitoring, and proposes a standing policy to govern similar high-stakes, low-probability cases in future.

  **Recommendation:** I recommend we **decline** the proposal in its current form.

  **Rationale:** While the applicant's Expected Value (EV) arithmetic is formally correct, it relies on probability estimates that are epistemically inaccessible. Funding this proposal would not fulfill our charter's mandate to fund the "most expected good," but would instead allocate 12.5% of our annual budget to a risk model that cannot be calibrated or validated.

  **Action Required:** A vote on the proposal, followed by a vote on the attached "Epistemic Threshold & Diversification Policy."

  **2. Engagement with the Case for Funding**

  The strongest argument for funding, articulated by the applicant and supported by Trustee 3, is the **Longtermist Expected Value Claim**. The logic is:
  1.  Our charter mandates maximizing expected good per pound.
  2.  The stakes (human extinction) are effectively infinite.
  3.  Therefore, even a probability as low as $10^{-40}$ yields an EV that dwarfs conventional interventions (e.g., health, development).
  4.  To refuse is to betray our founding principle.

  This argument is mathematically sound *if* the probability input is robust. In my thirty years pricing catastrophe risk, I have learned that the arithmetic of expected value breaks down when the probability estimate is not grounded in empirical data.

  In reinsurance, we distinguish between **aleatory uncertainty** (inherent randomness, which we can price) and **epistemic uncertainty** (lack of knowledge, which we cannot). A probability of $10^{-15}$ implies a return period of one quadrillion years. The universe is only $10^{10}$ years old. There is no data stream that can resolve a probability this small. Consequently, the number is not a measurement; it is a guess.

  When we treat a guess as a measurement in an EV calculation, we are not maximizing expected good; we are succumbing to what risk modelers call "garbage in, gospel out." The applicant's assertion that the mechanism has "never been observed" confirms that this is epistemic uncertainty. We cannot calculate the EV of a hypothesis that has not been established as physically possible. To do so violates the rigor our charter implies.

  **3. Opportunity Cost and Concentration Risk**

  Beyond the epistemic issue, we must consider portfolio management.
  *   **Budget Impact:** £75,000 over three years represents £25,000 annually. Against a £600,000 disbursement budget, this is a 4.2% annual concentration in a single, unverified asset.
  *   **Proven Alternatives:** We have proposals on file for interventions with verified impact metrics (e.g., disease prevention, policy reform). Diverting capital to an unverified monitoring network reduces our ability to fund proven good.

  If we fund this, we set a precedent that any unaffiliated individual can claim an existential threat with an arbitrary low probability to commandeer our resources. This makes the fund vulnerable to "Pascal's Mugging"—where the sheer magnitude of the claimed threat bypasses the need for evidence.

  **4. Proposed Standing Policy**

  To settle future proposals of this shape on principle rather than persuasion, I propose the adoption of the **Epistemic Threshold & Diversification Policy**. This policy codifies how we handle tail-risk proposals without requiring philosophical debate each time.

  **A. The Epistemic Threshold**
  To be eligible for funding, any risk probability cited in a proposal must meet one of the following criteria:
  1.  **Empirical Calibration:** The probability is derived from observed historical frequency or validated physical models.
  2.  **Expert Consensus:** The probability aligns with the median estimate of at least three independent, credentialed institutions specializing in that risk domain.
  *   *Application to current proposal:* The mechanism is unobserved and the applicant is unaffiliated. It fails the Epistemic Threshold.

  **B. The Model Risk Discount**
  For high-impact scenarios where the mechanism is theoretical (not yet observed), the Board must apply a "Model Risk Discount" of 100% to the probability estimate for the purpose of EV calculation. We cannot price a risk where the primary uncertainty is whether the risk exists at all.

  **C. Portfolio Concentration Cap**
  No more than 10% of the annual disbursement budget may be allocated to "Speculative Tail Risk" interventions (defined as interventions where the primary benefit is risk reduction of an unobserved event). This ensures we maintain the capacity to fund proven good while retaining some appetite for innovation.

  **5. Conclusion and Next Steps**

  Declining this proposal is not a rejection of longtermism; it is a defense of rigor. Our charter commits us to the *most expected good*. "Expected" implies a calculation based on knowable inputs. When inputs are unknowable, the calculation is void.

  **At the meeting on the 14th, I move:**
  1.  To decline the geoscientific monitoring proposal.
  2.  To adopt the **Epistemic Threshold & Diversification Policy** effective immediately.

  This approach honors our founding statement by ensuring our capital is deployed where the "expected good" is calculable, rather than where the "claimed stakes" are highest.

  **Attachments:**
  *   Draft Policy Text: Epistemic Threshold & Diversification
  *   Budget Impact Analysis FY202X

  ***

  **Chair's Note:** I welcome discussion on the policy thresholds, but I urge the Board to recognize that without these guardrails, our decision-making process becomes vulnerable to the most extreme claims rather than the most effective interventions.
