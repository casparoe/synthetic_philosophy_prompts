      *   **Problem:** High volunteer turnover (enthusiastic sign-ups vanish after a month). High onboarding costs (training hours).
      *   **Conflict:**
          *   *Chair's Proposal:* 6-month probation, mandatory early-morning work parties before access/decision-making. (High barrier to entry).
          *   *Other Board Member's Objection:* Pointless hoops, wasted hours, scares off good volunteers, better to let people show up freely. (Low barrier to entry).
      *   **User's Intuition:** Suspects the Chair is right based on biological analogies (peacock tails = costly signaling), but needs a principled framework to distinguish between *useful* costs and *wasteful* barriers.
      *   **Goal:** Provide a framework to decide when "hoop-jumping" is functional (screening/commitment) vs. dysfunctional (gatekeeping/waste).

  2.  **Deconstruct the Core Concept: Costly Signaling Theory:**
      *   The user explicitly referenced peacocks. This is the key. In evolutionary biology, a peacock's tail is a "handicap." It's costly to produce and maintain. Only high-quality males can afford it. Therefore, it's an honest signal of genetic fitness.
      *   Apply this to volunteers: Time and effort are the "costs." Only truly committed volunteers will pay them.
      *   *However*, not all costs are signals. Some are just friction. The challenge is distinguishing "honest signaling costs" from "deadweight loss."

  3.  **Develop a Framework (The "Principled Way"):**
      *   I need to create a set of criteria or questions the board can ask to evaluate the proposal.
      *   *Criterion 1: Correlation.* Does the cost correlate with the desired trait? (Does waking up early actually predict long-term stewardship?)
      *   *Criterion 2: Sunk Cost vs. Investment.* Is the time spent *during* the probation useful work, or just busy work?
      *   *Criterion 3: Proportionality.* Is the cost too high relative to the reward? (6 months might be too long).
      *   *Criterion 4: Exclusion Type.* Who is being excluded? The flaky, or the capable-but-busy (e.g., parents, workers)?
      *   *Criterion 5: Feedback Loop.* Is there a way to test and adjust?

  4.  **Drafting the Response - Section by Section:**

