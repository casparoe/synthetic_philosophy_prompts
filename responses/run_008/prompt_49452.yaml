answer: |-
  You have hit on a fundamental principle of evolutionary biology and institutional economics without necessarily naming it. Your intuition about the peacock is spot-on: this is **Costly Signaling Theory** (specifically Zahavi's Handicap Principle).

  In nature, a signal is only "honest" if it is costly to produce. A peacock's tail is a burden; it makes him slower and more visible to predators. Only a male with superior genetics and health can afford to drag that weight around and survive. Therefore, the tail honestly signals fitness to the peahen. If the tail were cheap to grow, any weak male could fake it, and the signal would lose its value.

  Your board is debating whether to impose a "handicap" on volunteers. The Chair wants a high-cost signal to ensure commitment; the other member worries the cost is "deadweight loss" that kills the organism (the trust) by starving it of labor.

  As a fellow observer of systems, here is a principled framework to distinguish between **functional signaling** (the peacock's tail) and **dysfunctional friction** (a trap in the forest).

  ### 1. The Correlation Test: Does the Cost Predict the Trait?
  In biology, the cost must correlate with the fitness being signaled. In your trust, the desired trait is *long-term reliability and stewardship ethic*.
  *   **The Question:** Does waking up early for six months actually predict who will be a good steward three years from now?
  *   **The Risk:** Early mornings might filter for *unemployed people* or *night owls who are suffering*, rather than *reliable stewards*. If the cost filters for "people with no other options" rather than "people with high commitment," you are selecting for the wrong trait.
  *   **Principle:** The hurdle must be painful enough to deter the flaky, but relevant enough that enduring it builds the specific muscle you need.

  ### 2. The Productive vs. Performative Cost Test
  This is where the other board member has a strong point. A peacock's tail is biologically "wasteful," but in a human organization, wasted hours are actual budget deficits.
  *   **The Question:** During the six-month probation, are the volunteers doing *actual work* that benefits the land, or are they doing *busy work* designed to test them?
  *   **The Distinction:**
      *   **Productive Cost:** "You must attend 10 work parties to get keys." (They are pulling invasive species while proving commitment. The cost is time, but the output is conservation.)
      *   **Performative Cost:** "You must attend 10 meetings where you just watch us work." (This is pure friction. It burns training hours without return.)
  *   **Principle:** The "hoop" should double as "training." If the volunteer vanishes in month 2, you should still have gained 2 months of labor. If the probation is just observation, you have lost money.

  ### 3. The Exclusion Boundary: Who is Being Filtered Out?
  Every selection pressure changes the population. You need to decide which mutations you are willing to lose.
  *   **The Question:** What kind of good volunteer fails this test?
  *   **The Risk:** A six-month, early-morning requirement filters out parents with school drop-offs, people with shift jobs, and older volunteers with stiff joints. You might be filtering out the *flaky*, but you are also filtering out the *capable-but-busy*.
  *   **Principle:** A good signal filters for *commitment*, not *availability*. If the cost requires a specific lifestyle (early mornings) rather than a specific ethic (showing up when you say you will), you are narrowing your gene pool too much.

  ### 4. The Sunk Cost Fallacy Check
  In biology, an organism that invests too much in a failing strategy dies. In organizations, we often keep volunteers just because they "suffered" through the probation.
  *   **The Question:** If someone completes the six months but is toxic or incompetent, do we feel obligated to give them keys because they "earned" it?
  *   **The Risk:** Costly signaling can create a sense of entitlement. "I did my six months, I deserve a say in decisions," even if they lack the ecological knowledge.
  *   **Principle:** The probation should grant *access*, not *authority*. Keys to the shed are about safety and trust. Decision-making power is about expertise. Do not conflate the two.

  ### A Proposed "Third Path" for the Board
  Given your context (small trust, high training costs), the Chair is right that *some* barrier is needed, but six months is likely an evolutionary dead end (too long). The other member is right that *open access* is too costly (high churn).

  Consider a **Tiered Signaling System**:

  1.  **The "Friend of the Trust" (No Barrier):** Anyone can show up to scheduled group work parties. No keys, no solo work. Low cost, low risk. This captures the casual labor the other board member wants.
  2.  **The "Steward" (Moderate Barrier):** To get keys and solo access, require a specific *output* rather than *time*. Example: "Complete 30 hours of supervised work + 1 training workshop." This could take 2 months for some, 4 for others. It filters for persistence without mandating early mornings.
  3.  **The "Lead" (High Barrier):** Decision-making power requires tenure + demonstrated expertise. This separates the "workers" from the "managers."

  ### The Ecological Verdict
  Your intuition is correct: **Cost is a feature, not a bug, but only if it is an honest signal.**

  *   **Scrap the proposal if:** The work during probation is make-work, or if the time requirement (6 months) is so long that you starve the organization of labor before the volunteers bloom.
  *   **Keep the proposal if:** The probationary period is shortened (e.g., 3 months), the work is productive (invasive removal, not just watching), and the "cost" is framed as *training investment* rather than *punishment*.

  **Recommendation to the Board:**
  Tell them you support the *principle* of the Handicap (we need to filter for commitment), but argue that the *magnitude* of the handicap must be calibrated. A six-month probation is like a peacock growing a tail so heavy he can't fly. Suggest a **90-day "Trial Stewardship"** with mandatory group work (productive cost) that grants tool access but not governance power. This satisfies the Chair's need for screening, the other member's need for labor efficiency, and your need for biological realism.
