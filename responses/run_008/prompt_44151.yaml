answer: |-
  This is a fantastic passage to dig into because it sits right at the intersection of ancient ethics, social snobbery, and literary theory. You have correctly identified the tension: Plutarch is making a philosophical claim using arguments that look suspiciously like class prejudice.

  Here is a walkthrough of the argument, the social context required to make sense of the Antisthenes quote, and an evaluation of your hagiography hypothesis.

  ### Part 1: Reconstructing the Argument (Craft vs. Virtue)

  You asked if the distinction is that craft excellence is separable from the person, while virtue is not. **You are exactly right.** That is the philosophical core, but it is wrapped in a specific ancient social framework that makes it look like mere snobbery.

  **1. The *Banausic* Stigma**
  To understand the perfume-dyer and the piper examples, you have to understand the Greek concept of *banausos* (illiberal/mechanic). In the Athenian aristocratic worldview (which Plutarch, writing under Rome, still idealizes), true freedom is autonomy. A free man acts for the sake of the good or the city. A *banausic* worker acts for pay, or for the pleasure of others.

  *   **Perfumes/Dyes:** You enjoy the smell (the product), but the dyer (the producer) had to submit his hands and time to create it. He is a servant to the material and the customer.
  *   **The Piper (Antisthenes & Philip):** This is the hardest bit for a modern reader. Why does being a *good* piper make you a *bad* man?
      *   **The Antisthenes Logic:** It's an argument about opportunity cost and servility. To be an *excellent* piper requires obsessive practice. If you are spending your life mastering the flute, you are not mastering yourself, your household, or your city. Furthermore, a piper performs *for* an audience. He is reactive.
      *   **The Philip Logic:** A King should be a spectator, not a performer. If the King plays the lyre, he is entertaining his subjects (servile). If he listens, he is judging and ruling (regal).
      *   **The Point:** In these arts, the excellence resides in the *output* (the song, the scent). The person is merely the vessel. You can hate the vessel and love the wine.

  **2. The Inseparability of Virtue**
  Plutarch contrasts this with virtue (*aretē*).
  *   In craft, the work stands apart from the worker. The Statue of Zeus exists after Pheidias dies. You can admire the Zeus without wanting to be Pheidias (who was just a guy with a chisel).
  *   In virtue, the "work" is the action itself, and the action is inseparable from the agent's character. You cannot separate "Pericles' courage" from "Pericles."
  *   Therefore, when you admire the virtue, you are admiring the *state of the soul* that produced it. Since every human has a soul, the admiration triggers a desire to align your own soul with that one.

  **3. Fortune vs. Virtue**
  Plutarch closes the loop with the distinction between "Good things of Fortune" (wealth, beauty, art) and "Good things of Virtue" (justice, courage).
  *   **Fortune:** Passive. I want to *have* this. (I want the statue).
  *   **Virtue:** Active. I want to *do* this. (I want to be the statuary of my own life).

  So, the argument isn't *just* snobbery. The snobbery (pipers are vulgar) is the cultural packaging for a philosophical claim: **Technical skill is external to the self; moral excellence is internal to the self.** Admiring the external makes you a consumer; admiring the internal makes you an agent.

  ### Part 2: Biography as Hagiography and the Imitation Mechanism

  Your second question is about whether this preface supports the idea that Plutarch is selecting for "imitability" rather than "historical importance," and whether that mechanism actually works.

  **1. Does the preface support the "Hagiography" reading?**
  Yes, absolutely. In fact, it is the explicit mission statement of the *Parallel Lives*.
  Plutarch famously distinguishes his project from "History" in other prefaces (most notably *Alexander/Caesar*). He says historians record great battles and sieges; he records the small sayings, the jokes, the private habits. Why? Because a great battle might be the result of luck, terrain, or numbers. A small remark in a moment of stress reveals *character*.

  He is not writing archives; he is writing a gymnasium for the soul. The "unit of selection" is indeed the anecdote that reveals a moral quality capable of being transplanted into the reader. In that structural sense, you are correct: it functions like hagiography. The goal is not to inform you about Pericles; it is to make you more Periclean (or at least, more virtuous).

  **2. Is the "Imitation Mechanism" just rhetorical fluff?**
  This is the million-dollar question. Plutarch claims that regarding virtue produces an "impulse to imitate." Is this psychological nonsense, or does it hold water?

  *   **The Ancient View (Platonic/Stoic):** The ancients believed in *mimēsis* (imitation) as a fundamental learning mechanism. They thought the soul was malleable. By contemplating noble images (whether statues or stories), the soul takes on the shape of what it contemplates. It's an aesthetic theory of ethics. If you hang out with brave men, or read about them, bravery "rubs off."
  *   **The Modern Skepticism:** We tend to think knowing the good doesn't guarantee doing the good (the problem of *akrasia*, or weakness of will). Reading about a saint doesn't make you holy.
  *   **The Nuanced Defense:** Plutarch isn't claiming that reading about Pericles will magically give you political genius. He is claiming that admiration triggers *emulation* (*zēlos*).
      *   **Mimicry vs. Emulation:** He doesn't want you to copy the *deed* (e.g., "I must ostracize my rival"). He wants you to copy the *disposition* (e.g., "I must remain calm when insulted").
      *   **The Mechanism:** The mechanism is **shame and aspiration**. When you read about a virtuous act, you feel a pleasurable admiration mixed with a painful awareness of your own lack. That tension creates the "impulse" to close the gap.

  **3. Does it work?**
  In a limited sense, yes. Narrative psychology suggests that concrete exemplars are more motivating than abstract precepts. "Be brave" is vague. "Here is how Pericles stood firm when the plague hit Athens" provides a script for the imagination.

  However, Plutarch is arguably over-optimistic. He assumes the reader *wants* to be good. If the reader admires power more than virtue (like Caesar's many imitators throughout history), the mechanism works in reverse. But for his intended audience (elite men educated in Greek philosophy), the assumption was that they already valued virtue; they just needed the spark to activate it.

  ### Summary

  1.  **The Argument:** It is not merely snobbery. It relies on the metaphysical distinction that craft produces an external object (which we consume), while virtue produces an internal state (which we must enact). The "snobbery" about pipers is there to illustrate that high technical skill often requires a servile devotion that crowds out moral autonomy.
  2.  **The Biography Hypothesis:** You are not overreading. Plutarch explicitly treats biography as a moral technology. He selects anecdotes based on their ethical luminosity, not their historical weight.
  3.  **The Mechanism:** It isn't just fluff, but it isn't magic. It relies on the psychological power of role models. It works if the reader accepts the premise that virtue is the highest good. If they do, the "impulse to imitate" is a real phenomenological experience—the feeling of being challenged by a superior example.

  Plutarch is essentially saying: **"History tells you what happened. I am telling you what to become."** The preface is the warranty on that product.
