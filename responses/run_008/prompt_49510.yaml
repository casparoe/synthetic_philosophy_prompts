answer: |-
  The term you are looking for is **"Jumping Out of the System"** (often abbreviated in fan circles as **JOOTS**).

  It originates from Douglas Hofstadter's *Gödel, Escher, Bach: An Eternal Golden Braid* (1979). Given your background in the Rationalist community (which heavily canonized GEB in its formative years), this is almost certainly the concept that lodged in your memory.

  Here is the carving you asked for: what the term covers, its lineage, and specifically how it handles your worry about whether finding an invariant is "leaving" or just "expanding" the system.

  ### 1. The Source and the Puzzle
  Your first instance is not just *like* Hofstadter's example; it *is* Hofstadter's example. In *GEB*, Hofstadter introduces the **MIU System**, a formal string-rewriting system.
  *   **Start:** `MI`
  *   **Target:** `MU`
  *   **Rules:** Specific manipulation rules for adding/removing `I`s and `U`s.

  The puzzle asks you to derive `MU`. The solution, as you noted, is to realize the task is impossible. The method is to step outside the rule-application game and analyze the *number of I's*. The rules preserve the property that the number of `I`s is not divisible by 3. The start string has 1 `I`; the target has 0 `I`s (divisible by 3). Therefore, the target is unreachable.

  Hofstadter explicitly labels the cognitive move required to see this **"Jumping Out of the System."** He contrasts this with "Muo-thinking" (working blindly within the rules).

  ### 2. The Carving: What Counts as a "Jump"?
  You asked whether finding an invariant counts as leaving the system or just entering a bigger one. Hofstadter's carving is precise here: **It is always a relative jump.**

  There is no absolute "Outside." There is only a hierarchy of systems.
  *   **Object Level:** You manipulate symbols according to rules. (Playing the game).
  *   **Meta Level:** You treat the symbols and rules as objects of study to find properties (invariants) they possess. (Analyzing the game).
  *   **Meta-Meta Level:** You analyze the limitations of the meta-level analysis.

  When you find the invariant, you have jumped out of the *puzzle's* formal system into the *metasystem* of arithmetic. To the puzzle, you are outside. To arithmetic, you are inside.

  Hofstadter argues that intelligence is characterized by the ability to detect when one is stuck in a loop *within* a system and to initiate a jump to a higher level. However, he also warns (via Gödel and Tarski) that every system has blind spots that can only be seen from a yet-higher system. You can never jump "all the way out" into a view from nowhere; you can only jump to a context where the previous constraints are visible as data.

  So, to answer your specific worry: **Yes, it counts.** The move is defined by the *relationship* between the problem space and the solution space. If the solution requires treating the rules as objects rather than instructions, it is a system jump.

  ### 3. Rationalist Lineage and Variations
  Since you mentioned Overcoming Bias and the Rationalist sphere, you will recognize how this concept fragmented into specific jargon within that community:

  *   **Object-Level vs. Meta-Level:** This is the direct descendant of Hofstadter's distinction. In debates, arguing the point is object-level; arguing about the definitions or epistemic standards used to judge the point is meta-level.
  *   **Dissolving the Question:** (Eliezer Yudkowsky). This matches your second instance (debates). It occurs when you jump out of the system of the question itself to realize the question relies on a confused framework (e.g., "Is this art *really* art?" becomes "What utility does the category 'art' serve here?").
  *   **Reframing / Changing the Representation:** This matches your third instance. In optimization and AI, this is often called "changing the basis" or "representation learning." In Hofstadter's terms, it is finding a different system in which the problem is isomorphic but tractable.

  ### 4. Why "Outside View" Doesn't Fit
  You correctly noted that the forecasting "Outside View" is different.
  *   **Outside View (Forecasting):** Statistical. "Ignore the specifics of this case; look at the reference class."
  *   **Jumping Out of the System (Hofstadter):** Structural/Formal. "Ignore the allowed moves; look at the properties preserved by the moves."

  The forecasting Outside View is about ignoring *details* to find a baseline. JOOTS is about ignoring *rules* to find constraints or new dimensions.

  ### 5. Literature and Search Terms
  If you want to pursue the literature, "Jumping Out of the System" is the evocative term, but academic papers rarely use it as a keyword. Instead, search for:
  *   **Meta-reasoning / Metacognition:** (AI and Cognitive Science). This covers the computational implementation of monitoring and controlling one's own reasoning processes.
  *   **Invariant Analysis:** (Mathematics/Computer Science). The specific technique used in your first example.
  *   **Frame Analysis:** (Sociology/Goffman). How people define the situation they are in.
  *   **Paradigm Shift:** (Kuhn). The historical/sociological version of a system jump, though usually applied to whole sciences rather than individual puzzles.

  ### Summary
  The move has a name: **Jumping Out of the System**.
  The authority is: **Douglas Hofstadter, *Gödel, Escher, Bach*.**
  The carving is: **A relative shift from treating rules as instructions to treating rules as objects.**
  Your intuition on the "wider system" is correct: You never leave *all* systems; you merely ascend to a metasystem where the previous system's limitations become visible features.

  It is a satisfying term because it captures the *feeling* of the insight (the sudden expansion of perspective) while acknowledging the structural reality (you are just standing on a higher rung of the ladder).
