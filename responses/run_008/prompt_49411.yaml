          *   But Lewis says: If you have inadmissible evidence (the testimony), you cannot apply PP. You update on the testimony. Your credence becomes ~1. The chance might remain 0.5 (depending on theory), but PP doesn't tell you what to do *given* the testimony.
          *   So the convener's claim "your credence should still be one-half" is the error.

      *   *Wait, one nuance on Determinism:* If the world is deterministic, is the chance 0 or 1?
          *   Lewis: Yes.
