      *(Self-Correction during drafting)*: Make sure to explicitly mention the "Admissibility" clause as the key missing piece in the convener's gloss. That is the technical term the user needs to bring to the session.

      *(Refining Reading 4)*: Distinguish between "PP implies no chance in determinism" vs "Metaphysics implies no chance in determinism, PP then constrains credence." The latter is more accurate. PP itself doesn't dictate the chance values; metaphysics does. PP just links chance to credence. I need to be precise there.

