      *(Final check on the "Incompatibility")*: The convener wants PP to be strong enough to override testimony (Reading 5) but also relies on a specific metaphysics of chance (Reading 4). The incompatibility is that Reading 5 is false, and Reading 4 is not established by PP alone. But the deeper tension is: In the Det case, they let metaphysics drive chance (0/1). In the TT case, they ignore metaphysics (outcome is fixed by testimony) to keep chance at 0.5. They are inconsistent about whether "Chance" tracks "Truth/Fixity".

