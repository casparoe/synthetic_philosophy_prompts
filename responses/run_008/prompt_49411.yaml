          *   If they were consistent with the Time-Traveler view, they might say the Deterministic coin still has a 0.5 chance (epistemic/compatibilist).
          *   *The real clash:* The convener treats PP as a *norm on credence* that overrides evidence (Time-Traveler) but also treats Chance as a *metaphysical fact* that overrides our standard probabilistic practices (Determinism).
