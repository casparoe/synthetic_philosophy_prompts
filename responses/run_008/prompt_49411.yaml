answer: |-
  Your skepticism is well-founded. The convener's gloss ("If you know the chance is $x$, credence should be $x$") suppresses the most critical technical component of David Lewis's Principal Principle (PP): the **admissibility clause**. By omitting it, the gloss becomes ambiguous enough to be weaponized for incompatible arguments.

  Below is an ordered list of five distinct precise theses that the one-liner could be expressing, ranging from trivial to false. Following the list, I analyze how they map onto your two case studies and where the incompatibility lies.

  ### Five Readings of the Principal Principle Gloss

  **1. The Analytic Reading**
  *   **Thesis:** The term "objective chance" is *defined* as the value to which a rational agent's credence must defer. To say "the chance is $x$" just *means* "rational credence should be $x$."
  *   **Verdict:** **Trivial.** This makes the PP a tautology. It fails to explain what chance *is* (e.g., frequency, propensity, best-system) and offers no guidance on how to identify chance values independently of credence norms.

  **2. The *Ceteris Paribus* Reading**
  *   **Thesis:** If you know the chance is $x$ and possess **no other relevant evidence** regarding the outcome, your credence should be $x$.
  *   **Verdict:** **Substantive and Defensible.** This is a weak but safe version of the principle. It acknowledges that chance guides belief only in the absence of specific information. However, it is too weak to handle cases where we *do* have specific evidence (like the time-traveler).

  **3. The Admissibility-Restricted Reading (Lewis's Standard View)**
  *   **Thesis:** If you know the chance is $x$ and your total evidence $E$ is **admissible**, your credence should be $x$. (Formally: $C(A \mid Ch(A)=x \cdot E) = x$, provided $E$ is admissible). Admissible evidence includes history and laws, but **excludes** information about the future outcome (e.g., crystal balls, time-traveler testimony).
  *   **Verdict:** **Substantive and Defensible.** This is the standard philosophical formulation. It preserves the normative force of chance while acknowledging that "inadmissible" evidence (like knowing the outcome) overrides chance.

  **4. The Metaphysical Incompatibilist Reading**
  *   **Thesis:** The "chance" referred to in the principle is fixed solely by the complete physical state and fundamental laws. Therefore, if the world is deterministic, the true chance of any event is either 0 or 1.
  *   **Verdict:** **Substantive but Contested.** This is not a claim about *credence* (the PP itself) but about *metaphysics*. Lewis held this view (Incompatibilism), but many modern philosophers (Compatibilists like Loewer or Hoefer) argue that deterministic worlds can still have non-trivial macro-chances. The PP does not settle this; it only tells you what to do *once* the chance is fixed.

  **5. The Evidence-Insensitive Reading (Strong Screening)**
  *   **Thesis:** If you know the chance is $x$, your credence should be $x$ **regardless of any other evidence you possess**, even if that evidence entails the outcome (e.g., testimony, seeing the result).
  *   **Verdict:** **False.** This violates basic Bayesian updating. If you have inadmissible evidence (e.g., you saw the coin land heads), your credence should be 1, even if the chance was 0.5. Chance does not screen off *all* evidence, only *admissible* evidence.

  ***

  ### Analysis of the Two Uses

  Here is how these readings support (or fail to support) the arguments raised in your reading group.

  #### 1. The Determinism Argument
  *   **The Claim:** Since deterministic laws settle the outcome, chances are 0 or 1. Therefore, assigning 0.5 is irrational.
  *   **Required Readings:** This argument relies on **Reading 4** (Metaphysical Incompatibilism) to establish that the chance *is* 0 or 1, and **Reading 3** (Admissibility-Restricted) to say you must defer to that chance.
  *   **Assessment:** This argument is **not settled by the PP**. It hinges entirely on the contested metaphysical claim (Reading 4). A Compatibilist can accept the PP (Reading 3) but deny that deterministic laws reduce macro-chances to 0 or 1. They would argue the "chance" relevant to the PP is the macro-chance (0.5), not the micro-chance (1).
  *   **Verdict:** The argument is valid *only if* you accept Incompatibilism. The PP itself does not prove Incompatibilism.

  #### 2. The Time-Traveler Argument
  *   **The Claim:** Even if a reliable time-traveler says "Heads," the chance is 0.5, so your credence should remain 0.5.
  *   **Required Readings:** This argument relies on **Reading 5** (Evidence-Insensitive). It claims chance norms override specific testimony.
  *   **Assessment:** This is a **misapplication of the PP**. Under the correct **Reading 3**, testimony about a future outcome is paradigmatically *inadmissible* evidence. When you possess inadmissible evidence, the PP does not apply. You should update your credence to match the testimony (near 1), not the chance.
  *   **Verdict:** This use is **False**. It ignores the admissibility clause which is essential to the principle.

  ***

  ### The Incompatibility: Where the Gloss Breaks

  The convener is using the same gloss to pull in two incompatible directions regarding the **source of constraint** on credence.

  1.  **In the Determinism Case:** They treat **Metaphysics** as the constraint. They argue that because the *world* is fixed (by laws), the *chance* is fixed (at 0 or 1), and therefore *credence* must be fixed. Here, they allow the "fixity" of the outcome to collapse the chance value.
  2.  **In the Time-Traveler Case:** They treat **Chance** as the constraint. They argue that even though the *testimony* fixes the outcome (in your epistemic view), the *chance* remains 0.5, and therefore *credence* must ignore the testimony. Here, they deny that the "fixity" of the outcome (via testimony) should collapse the credence.

  **The Flagged Contradiction:**
  *   If "fixity of outcome" (via deterministic laws) collapses Chance to 0/1 (as per the Determinism argument), then "fixity of outcome" (via reliable testimony) should arguably collapse Credence to 0/1 (as per standard Bayesianism).
  *   The convener wants it both ways: They want the metaphysical fixity to dictate the *chance value* (Det case), but they want the chance value to dictate *credence* even against epistemic fixity (TT case).
  *   **The Missing Link:** The **Admissibility Clause (Reading 3)** resolves this.
      *   *Determinism:* Laws are admissible. If laws determine the outcome, and you know the laws, you know the chance is 1. (But do we know the laws? Usually no, which is why 0.5 is permissible).
      *   *Time-Traveler:* Testimony is *inadmissible*. The PP does not tell you what to do. You follow the testimony.

  ### Advice for the Session
  Bring **Reading 3 (Admissibility-Restricted)** as the corrective. Point out that:
  1.  The Time-Traveler argument fails because testimony is inadmissible; the PP is silent in that case, so standard evidence rules apply (believe the traveler).
  2.  The Determinism argument fails (or at least is incomplete) because it assumes Incompatibilism (Reading 4) without argument, and ignores that we rarely *know* the fundamental laws well enough to assign 0/1 credence in practice.

  The one-liner is dangerous because it looks like a norm on credence, but it secretly relies on a metaphysics of chance and a theory of evidence. Separating these will clarify the debate.
