          *   If Lewis is right, then assigning 0.5 *is* irrational *if you know the laws are deterministic*. But we usually don't know that. We assign 0.5 based on ignorance. The argument says "Anyone assigning... is irrational." This implies we *know* the chances are 0/1. This assumes we know the metaphysical status of laws.

