      *   The List: 5 Readings.
          *   Format: Name, Precise Thesis, Verdict.
      *   Analysis of Use Cases:
          *   Determinism: Which reading supports it? (Metaphysical Incompatibilism). Is it defensible? (Contested).
          *   Time-Traveler: Which reading supports it? (Evidence-Insensitive). Is it defensible? (False).
      *   The Incompatibility: Highlight the tension regarding *Admissibility* and the *Source of Chance*.
      *   Conclusion/Advice for the session.

