          4.  Identify incompatibilities between the two uses.
          5.  Format as an ordered list with verdicts for the next session.

  2.  **Deconstruct the Principal Principle (PP):**
      *   Lewis's original formulation (1980): $C(A | X \cdot E) = x$, where $X$ is the proposition that the chance of $A$ is $x$, and $E$ is *admissible* evidence.
      *   The convener's gloss ignores the admissibility clause ($E$). This is the source of the confusion.
      *   *Use Case 1 (Determinism):* Relies on the idea that Chance = Physical Probability derived from laws + state. If Laws are deterministic, Chance $\in \{0, 1\}$.
      *   *Use Case 2 (Time-Traveler):* Relies on the idea that Chance is independent of future facts or specific evidence about the outcome, *unless* that evidence is inadmissible. But the convener says ignore the time-traveler. This suggests a misunderstanding of admissibility. Future facts are typically *inadmissible*, meaning PP doesn't apply directly when you have them.

  3.  **Drafting the Distinct Theses (Ordered by Strength):**

      *   *Thesis 1 (Analytic/Definitional):* Chance is defined as the number rational agents should believe. (Ramsey-style).
      *   *Thesis 2 (Weak PP):* If you know *only* the chance and nothing else relevant, believe the chance. (Ignores admissibility nuances but assumes lack of other info).
      *   *Thesis 3 (Lewis's PP with Admissibility):* $C(A | Ch(A)=x \land E) = x$ provided $E$ is admissible. (The standard view).
      *   *Thesis 4 (Strong PP/Screening):* Known chance screens off *all* other evidence, including future facts or testimony about the outcome. (This is the "Time-Traveler" reading).
      *   *Thesis 5 (Metaphysical Chance):* Chance is fixed solely by laws and current state; if laws are deterministic, chance is 0/1. (This is the "Determinism" reading).

      *Refining the List for the User:* I need to make sure these map clearly to the "one-liner" gloss and the specific arguments mentioned.

      *   *Reading 1: The Analytic Reading.* Chance *just means* the ideal credence.
      *   *Reading 2: The Initial Credence Reading.* PP applies only to initial credences (before specific evidence).
      *   *Reading 3: The Admissibility-Restricted Reading.* PP applies only when evidence is "admissible" (no crystal balls).
      *   *Reading 4: The Metaphysical Determinist Reading.* Chance is fixed by laws+state. Determinism $\to$ 0/1 chances.
      *   *Reading 5: The Evidence-Insensitive Reading.* Chance dictates credence regardless of other evidence (even future facts).

  4.  **Evaluating the Theses:**
      *   *Reading 1:* Trivial/Definitional. Doesn't explain *what* chance is.
      *   *Reading 2:* Substantive but limited. Doesn't help with the specific cases (we have evidence in both).
      *   *Reading 3:* Standard Lewis. Defensible. Crucial for the Time-Traveler case (testimony is inadmissible).
      *   *Reading 4:* Substantive metaphysical claim. Compatibilists about chance/determinism (like Loewer) would reject it. Incompatibilists accept it.
      *   *Reading 5:* False. Lewis explicitly rejects this. Future facts are inadmissible.

  5.  **Analyzing the Two Uses:**

      *   *Use 1 (Determinism):* Requires Reading 4 (Metaphysical). If chances are 0/1, PP says credence should be 0/1. *Conflict:* Compatibilists argue macro-chances exist even if micro-laws are deterministic. So this reading is contested, not settled by PP itself.
      *   *Use 2 (Time-Traveler):* Requires Reading 5 (Evidence-Insensitive). If you know the outcome via testimony, that is *inadmissible* evidence. PP doesn't say $C(A | Ch(A)=x \land \text{Outcome}=A) = x$. It says $C(A | Ch(A)=x \land \text{Admissible}) = x$. So the convener is misapplying PP here. The correct application of Reading 3 says: You have inadmissible evidence, so PP doesn't constrain you to 0.5. You should believe 1.

      *   *The Incompatibility:* The convener uses PP to *force* credence to match chance in the Determinism case (ignoring our epistemic situation/compatibilism) but also uses PP to *force* credence to match chance in the Time-Traveler case (ignoring the inadmissibility of the testimony).
      *   Actually, the deeper tension is:
          *   In Determinism: They treat "Chance" as rigidly fixed by micro-laws (0 or 1).
