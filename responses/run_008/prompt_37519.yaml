prompt: |-
  My philosophy reading group has spent basically the whole year fighting about anthropic reasoning, and I've been drafted to write up the ceasefire document. One half of the group are self-sampling assumption people — they think you should reason as if you were a random sample drawn from the observers in your reference class, no more and no less. The other half are self-indication assumption people — they think you should additionally weight each hypothesis in proportion to how many observers it says exist, on the grounds that finding yourself alive at all is evidence for hypotheses with more observers. We've all conceded the shouting match is going nowhere, so what we want is the joint statement a genuinely good-faith adversarial collaboration between the two camps would produce. Write that document.

  Concretely: start with a numbered section of agreed claims — I want the things both camps can sign, like what the Sleeping Beauty problem actually shows and what it doesn't, that the Doomsday argument and the Presumptuous Philosopher case share a common formal structure (two hypotheses, one positing vastly more observers, and the question of what your own existence tells you between them), and whatever they agree on about the reference class problem, including which debates the reference class does and does not decide. Then a disagreements table: each residual disagreement stated in wording that the side holding that view would actually accept as fair to itself (the SIA camp presumably thinks the presumptuous philosopher is being rational to the point of embarrassment; the SSA camp thinks he's committing a distinctive error, and I want each side's complaint phrased its own way). Finally a cruxes section: for each crux, a concrete case or argument both camps would agree bears on it, with each side's prediction recorded in advance. We suspect one crux is whether thirding in Sleeping Beauty forces anything in the Doomsday case or whether the analogy breaks somewhere. For a second candidate crux, consider a variant of the Presumptuous Philosopher setup where the extra observers in the bigger hypothesis live in causally disconnected regions of the cosmos that no one, ever, can interact with or even get a signal from — the question is whether merely positing more of them should move the philosopher's credences, given that those credences also govern her decisions about a world she can only ever affect locally. And if you think part of the SSA-vs-SIA dispute is ultimately verbal rather than substantive, say which part and why.

  Two things: answer in American English, and keep it usable for someone with no web access — no reading lists, citations, or "see X for details," just the arguments themselves. It's fine (expected, even) if the document ends with the disagreement made exact rather than resolved.
reasoning: |-
  Here's a thinking process that leads to the suggested ceasefire document:

  1.  **Analyze the Request:**
      *   **Task:** Write a ceasefire document for a philosophy reading group deadlocked on anthropic reasoning (SSA vs. SIA).
      *   **Tone:** Good-faith adversarial collaboration, formal but accessible, American English.
      *   **Constraints:** No web access/citations (self-contained), usable offline.
      *   **Structure:**
          1.  Numbered section of Agreed Claims (common ground, structure of problems, reference class limitations).
          2.  Disagreements Table (residual disagreements phrased fairly for each side).
          3.  Cruxes Section (concrete cases/arguments bearing on the disagreement, predictions recorded).
          4.  Verbal vs. Substantive Analysis (if applicable).
      *   **Specific Content Requirements:**
          *   Sleeping Beauty implications (what it shows/doesn't).
          *   Doomsday & Presumptuous Philosopher shared structure.
          *   Reference class problem scope.
          *   Disagreement table: SIA sees Presumptuous Philosopher as rational; SSA sees error.
          *   Crux 1: Sleeping Beauty Thirding vs. Doomsday.
          *   Crux 2: Causally disconnected observers in Presumptuous Philosopher variant.
          *   Identify verbal vs. substantive elements.

  2.  **Deconstruct the Philosophy (SSA vs. SIA):**
      *   **SSA (Self-Sampling Assumption):** Reason as if you are a random sample from the reference class. $P(H|E) \propto P(E|H) \times P(H)$. In anthropic contexts, $P(E|H)$ depends on the fraction of observers in $H$ who have your evidence. Often leads to "Doomsday Argument" (DA) results (favoring smaller total populations) and avoids "Presumptuous Philosopher" (PP) results. Usually aligns with "Halving" in Sleeping Beauty (though not always, depending on formulation).
      *   **SIA (Self-Indication Assumption):** Reason as if you are a random sample, *but* weight hypotheses by the number of observers. $P(H|E) \propto N_H \times P(E|H, \text{sample}) \times P(H)$. Effectively, finding yourself existing is evidence for worlds with more observers. Avoids DA, accepts PP results. Aligns with "Thirding" in Sleeping Beauty.
      *   **Sleeping Beauty:** Heads (1 awakening), Tails (2 awakenings). Halfer (SSA-ish) says $P(Heads)=1/2$. Thirder (SIA-ish) says $P(Heads)=1/3$.
      *   **Doomsday Argument:** Early birth rank suggests total population is likely small. SSA supports this. SIA cancels it out (more people = more chance to be one of them).
      *   **Presumptuous Philosopher:** Theory A (1 trillion observers), Theory B (1 trillion trillion observers). Physicists say they are equally likely *a priori*. Philosopher says B is vastly more likely because she exists. SIA agrees. SSA says no (unless reference class tricks apply).
      *   **Reference Class:** Who counts as "you"? All humans? All sentient beings? All observer-moments? Both sides struggle with this.

  3.  **Drafting - Section 1: Agreed Claims:**
      *   Need to establish the formal structure shared by DA and PP. Both involve comparing $H_{small}$ vs $H_{large}$. Both involve indexical evidence ("I exist," "I am early").
      *   Sleeping Beauty: Agree it's a test case for indexical updating. Agree it distinguishes the camps (Thirding $\leftrightarrow$ SIA, Halving $\leftrightarrow$ SSA). Agree it doesn't *solve* the metaphysical debate, just highlights the divergence.
      *   Reference Class: Agree it's a problem for *both*. Agree that narrowing it too much trivializes the problem, widening it too much makes it absurd. Agree that resolving the reference class doesn't automatically resolve SSA vs. SIA (you can have SSA with broad class or SIA with narrow class).

  4.  **Drafting - Section 2: Disagreements Table:**
      *   Need to be charitable.
      *   *Issue:* The Presumptuous Philosopher.
          *   SIA View: It's a valid inference. Existence is data. Ignoring population size ignores data.
          *   SSA View: It's an epistemic scandal. It allows armchair reasoning to overturn empirical physics. It violates the principle that hypotheses should be tested by observation, not headcounts.
      *   *Issue:* The Doomsday Argument.
          *   SSA View: It's a valid (if uncomfortable) Bayesian update. Ignoring birth rank is ignoring evidence.
          *   SIA View: It's a paradox resulting from ignoring the selection effect of existence. The "sample" is not random from the set of all humans, but from the set of *existing* humans.
      *   *Issue:* Decision Theory implications.
          *   SIA: Decisions should maximize expected utility across all copies/selves.
          *   SSA: Decisions should maximize expected utility for the specific sampled self.

  5.  **Drafting - Section 3: Cruxes:**
      *   *Crux 1: Sleeping Beauty to Doomsday.* Does accepting Thirding compel accepting the Doomsday Argument (or rejecting it)?
          *   Connection: Thirding usually goes with SIA. SIA kills Doomsday. Halving goes with SSA. SSA enables Doomsday.
          *   Test: Can one be a Thirder and accept Doomsday? (Some say yes, via "Hybrid" models).
          *   Prediction: SIA says Thirder $\to$ No Doomsday. SSA says Halfer $\to$ Doomsday (usually).
      *   *Crux 2: Causally Disconnected Observers.*
          *   Setup: $H_1$ (1 billion observers in our bubble), $H_2$ (1 billion observers here + $10^{100}$ in disconnected bubble).
          *   Question: Does SIA still favor $H_2$?
          *   SSA: No. Those observers aren't in the causal reference class.
          *   SIA: Yes. Existence is still evidence. The "you" that exists is more likely to come from the universe with more "you-potential."
          *   Decision theoretic angle: Does it change how you bet? If you can't affect them, does it matter?
      *   *Crux 3 (Optional but good):* The "God's Coin Toss" scenario. (Decided to stick to the prompt's specific suggestions to keep it tight). Let's stick to the prompt's specific Crux 1 (SB/Doomsday link) and Crux 2 (Disconnected observers).

  6.  **Drafting - Section 4: Verbal vs. Substantive:**
      *   Is this just about definitions of probability?
      *   Argument for Verbal: "Probability" might mean "frequency in world" (SSA) vs. "credence of being this observer" (SIA).
      *   Argument for Substantive: They make different betting recommendations in certain scenarios (e.g., betting on the color of your shirt in a duplication case).
      *   Conclusion: Likely a mix. The math differs, leading to different bets, so substantive. But the *source* of the disagreement is often how "I" is defined.

  7.  **Review and Refine:**
      *   *Check Tone:* Is it neutral? Yes.
      *   *Check Constraints:* American English? Yes. No citations? Yes.
      *   *Check Specifics:* Did I cover the "Disconnected Observers" crux? Yes. Did I cover the Sleeping Beauty/Doomsday link? Yes.
      *   *Formatting:* Use clear headings, numbered lists, and a table for disagreements.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe I should try to solve the reference class problem.
      *   *Correction:* No, the prompt says "what they agree on about the reference class problem," which implies agreeing that it's hard/unsolved, not solving it.
      *   *Initial thought:* Make the disagreements very technical.
      *   *Correction:* Keep it accessible to the reading group members who are tired of fighting. Focus on the *intuition* behind the disagreement.
      *   *Refining the "Disconnected" Crux:* Make sure to highlight the decision-theoretic aspect. If I can't bet on the other universe, does the probability matter? SIA says yes (epistemic state), SSA says no (irrelevant).
      *   *Refining Sleeping Beauty:* Ensure the distinction between "what day it is" and "what the coin was" is clear enough without getting bogged down.

  9.  **Final Polish:** Check for flow and ensure the "Ceasefire" vibe comes through—acknowledging the stalemate but codifying the terms of engagement. (Proceed to generate output).

  *(Self-Correction Note on Crux 1)*: The prompt asks specifically about whether thirding in SB *forces* anything in Doomsday. Standard SIA = Thirding + No Doomsday. Standard SSA = Halving + Doomsday. But there are "Hybrid" views (Thirding + Doomsday). The crux is whether the logic that moves you from SB to Doomsday is binding. I need to frame this carefully.

  *(Self-Correction Note on Crux 2)*: The prompt asks about causally disconnected regions. SIA typically says "Yes, still favor the bigger universe." SSA says "No, reference class is limited by causal contact." The decision theory angle: If I make a decision that only affects my local bubble, does the existence of remote copies change my optimal action? SIA says "Yes, if you care about total utility." SSA says "No, only care about local utility." Wait, that's decision theory (UDT vs CDT). Let's stick to the *credence* question as primary, with decision consequences as secondary.

  *(Final Check on Verbal/Substantive)*: Be careful not to dismiss it as *merely* verbal if they bet differently. If they bet differently, it's substantive. I will argue it is substantive regarding betting behavior, but verbal regarding the definition of "probability of a hypothesis."

  Okay, ready to write.
answer: |-
  # CEASEFIRE DOCUMENT: ANTHROPIC REASONING WORKING GROUP

  **Date:** October 26, 2023
  **Status:** Draft for Consensus
  **Subject:** Codification of Agreement and Disagreement regarding Self-Sampling (SSA) and Self-Indication (SIA) Assumptions

  ## 1. AGREED CLAIMS

  The undersigned members of the reading group, representing both the Self-Sampling Assumption (SSA) and Self-Indication Assumption (SIA) camps, hereby affirm the following propositions as common ground. These claims establish the formal structure of our debate and delineate the boundaries of our current knowledge.

  1.  **Formal Isomorphism of Key Cases:** We agree that the Doomsday Argument and the Presumptuous Philosopher case share an identical formal structure. Both involve a choice between two hypotheses ($H_{small}$ and $H_{large}$) where $H_{large}$ posits a vastly greater number of observers than $H_{small}$. In both cases, the core dispute is whether the indexical evidence "I exist" (or "I am this observer") should update credences in favor of $H_{large}$ simply because it contains more observers. We agree that one cannot consistently accept the Doomsday Argument (favoring $H_{small}$) while rejecting the Presumptuous Philosopher conclusion (favoring $H_{large}$) without invoking a principled distinction between the two scenarios beyond mere population size.
  2.  **Sleeping Beauty as a Litmus Test:** We agree that the Sleeping Beauty problem serves as a valid proxy for the broader anthropic dispute, though it does not resolve it. We agree that "Thirding" (assigning 1/3 probability to Heads) is formally analogous to SIA, as it weights the Tails hypothesis higher due to the greater number of observer-moments. We agree that "Halving" (assigning 1/2 probability to Heads) is formally analogous to SSA, as it treats the coin toss as the primary random event and the awakening as a sample from the resulting outcomes. We further agree that solving Sleeping Beauty does not automatically solve the Doomsday Argument; the link between them relies on additional assumptions about reference classes and temporal indexing that remain contested.
  3.  **The Reference Class Problem is Shared:** We agree that the "Reference Class Problem" (the question of which entities count as "observers like me") is a difficulty for both SSA and SIA, not a weapon for one side against the other.
      *   For SSA, if the reference class is too narrow (e.g., "people with my exact DNA"), the Doomsday Argument vanishes. If it is too broad (e.g., "all conscious beings"), the results become counterintuitive.
      *   For SIA, if the reference class is too narrow, the Presumptuous Philosopher result is mitigated. If it is too broad, the Presumptuous Philosopher result becomes extreme.
      *   **Agreement:** We concede that adjusting the reference class cannot resolve the fundamental disagreement. One can construct an SSA model that mimics SIA results by widening the class, and an SIA model that mimics SSA results by narrowing it. Therefore, the debate is not primarily about *who* is in the class, but *how* to weight the hypotheses given the class.
  4.  **Empirical Underdetermination:** We agree that current empirical data is insufficient to adjudicate this dispute. Both frameworks can be retrofitted to match past observations by adjusting priors or reference classes. Consequently, the dispute must be settled on grounds of theoretical virtue (parsimony, coherence with decision theory, intuitive plausibility) rather than direct observation.

  ## 2. DISAGREEMENTS TABLE

  The following table catalogs the residual disagreements. Each statement is phrased to be acceptable to the camp holding that view, without requiring the opposing camp to endorse the reasoning.

  | Topic | SSA Camp Position (Self-Sampling) | SIA Camp Position (Self-Indication) |
  | :--- | :--- | :--- |
  | **The Presumptuous Philosopher** | **The Error of Armchair Cosmology:** The Philosopher commits a distinctive epistemic error by allowing headcounts of unobserved entities to overwhelm empirical physical evidence. It is irrational to believe a physical theory is true merely because it posits more observers. This violates the principle that scientific hypotheses should be tested by data, not by counting potential observers. | **The Rationality of Existence Evidence:** The Philosopher is correctly applying Bayesian reasoning. Finding oneself alive is data. Hypotheses that make the existence of observers more probable (by having more of them) receive a likelihood boost. To ignore this is to ignore relevant evidence about one's own existence. |
  | **The Doomsday Argument** | **The Validity of Birth Rank:** The argument is a valid, if uncomfortable, Bayesian update. Knowing one's birth rank (e.g., being among the first 100 billion humans) is evidence about the total number of humans. To deny this is to claim that indexical information ("I am early") is irrelevant to total population estimates, which contradicts standard sampling logic. | **The Selection Effect Defense:** The argument fails because it ignores the selection effect inherent in existence. You are not a random sample from *all possible* humans; you are a random sample from *existing* humans. Hypotheses with more humans are more likely to produce *any* sample at all. This likelihood boost exactly cancels the birth rank evidence. |
  | **Probability Interpretation** | **Centered Worlds as Samples:** Probability should track the proportion of observers in a world who share your evidence. If 99% of observers in World A are wrong about a fact, and you are in World A, you should act as if you are likely one of the 99%. | **Centered Worlds as Weighted:** Probability should track the proportion of *worlds* weighted by observer count. If World B has 100x more observers than World A, you are 100x more likely to exist in World B, regardless of the proportion of observers within World A who share your evidence. |
  | **Decision Theoretic Impact** | **Local Utility:** Decisions should maximize expected utility for the specific agent making the decision. The existence of other observers in other hypotheses does not change the payoff structure for *this* agent in *this* world. | **Global Utility (or Copy-Altruism):** Decisions should account for the fact that your reasoning is mirrored by other observers. If a choice affects many copies of you (or many observers in the favored hypothesis), the expected utility calculation must weight those outcomes by the number of observers affected. |

  ## 3. CRUXES AND PREDICTIONS

  To move forward, we identify two specific cruxes. For each, we describe a concrete scenario and record the divergent predictions. We agree that if a side's prediction fails in a thought experiment designed to test logical coherence, that side must revise its formulation.

  ### Crux 1: The Sleeping Beauty – Doomsday Link
  **The Question:** Does the logic that compels you to "Third" in Sleeping Beauty necessarily compel you to reject the Doomsday Argument?
  **The Setup:**
  *   **Case A (Sleeping Beauty):** A coin is tossed. Heads: 1 awakening. Tails: 2 awakenings. You wake up.
  *   **Case B (Doomsday):** Hypothesis $S$ (Short Future): 100 billion total humans. Hypothesis $L$ (Long Future): 100 trillion total humans. You find you are human #70 billion.
  **The Disagreement:**
  *   **SSA Prediction:** One can consistently be a **Halfer** in Sleeping Beauty and accept the **Doomsday Argument**. The logic is identical: in both cases, you treat your specific instance as a random sample from the total set of instances. In SB, Halving preserves the 50/50 coin prior. In Doomsday, SSA shifts probability to $S$ because being #70 billion is much more likely in $S$ than $L$.
  *   **SIA Prediction:** One must be a **Thirder** in Sleeping Beauty and **Reject Doomsday**. The logic is identical: in both cases, the hypothesis with more observer-moments receives a likelihood boost proportional to the number of observers. In SB, Tails gets boosted (2 vs 1). In Doomsday, $L$ gets boosted (100 trillion vs 100 billion), canceling the birth rank evidence.
  *   **The Test:** If a participant claims to be a Thirder *and* accepts Doomsday (or a Halfer *and* rejects Doomsday), they must provide a principled disanalogy between the two cases that does not rely on ad-hoc reference class adjustments. We suspect this position is unstable.

  ### Crux 2: The Causally Disconnected Observers
  **The Question:** Does the existence of observers in causally disconnected regions of the multiverse affect your credences about which physical theory is true?
  **The Setup:**
  *   **Theory 1:** The universe contains 1 billion observers, all in our causal light-cone.
  *   **Theory 2:** The universe contains 1 billion observers in our causal light-cone, plus $10^{100}$ observers in a region of spacetime that is permanently causally disconnected from us (no signal can ever reach us, and we can never affect them).
  *   **Prior:** We assign 50% credence to Theory 1 and 50% to Theory 2 based on physical elegance.
  *   **Evidence:** You exist.
  **The Disagreement:**
  *   **SSA Prediction:** Your credences should **remain 50/50**. The observers in the disconnected region are not part of your reference class because you cannot be "randomly sampled" from a set with which you have no causal contact. Your existence is guaranteed in both theories (since both have 1 billion locals), so it provides no update.
  *   **SIA Prediction:** Your credences should **shift overwhelmingly to Theory 2**. You are more likely to find yourself existing in a universe that contains more total observers, regardless of causal connectivity. The "you" that exists is a random sample from all possible observers in the hypothesis.
  *   **Decision Theoretic Consequence:**
      *   **SSA:** If offered a bet that pays out only if Theory 2 is true, you should take it only at 1:1 odds.
      *   **SIA:** If offered a bet that pays out only if Theory 2 is true, you should take it at astronomically high odds, even though the payoff can only be consumed by the "local" you. (Note: This creates tension with standard decision theory, which SIA proponents must resolve by arguing that your decision is logically correlated with the decisions of the disconnected observers, or by accepting "presumptuous" betting behavior).

  ## 4. VERBAL VS. SUBSTANTIVE ANALYSIS

  We conclude with an assessment of whether this dispute is merely verbal (a disagreement over definitions) or substantive (a disagreement over facts or actions).

  **The Verbal Component:**
  We agree that a portion of the dispute is verbal, specifically regarding the definition of "probability."
  *   When SSA proponents say "The probability of Heads is 1/2," they often mean "The frequency of Heads in the set of experimental trials."
  *   When SIA proponents say "The probability of Heads is 1/3," they often mean "The fraction of my current observer-moments that occur in a Heads-world."
  *   If the disagreement were *only* this, we could resolve it by labeling them $P_{frequency}$ and $P_{credence}$ and moving on.

  **The Substantive Component:**
  We agree that the dispute is **not** merely verbal because it leads to divergent betting behavior in specific scenarios.
  *   **Example:** In a "Duplication Case" where a copy of you is made if a coin lands Tails, and you are offered a bet that pays $1 to "you" (each copy gets the payout), SIA and SSA calculate expected value differently.
  *   SIA calculates value based on the total payout across all copies.
  *   SSA calculates value based on the payout to the specific sampled copy.
  *   Since money is finite and bets must be accepted or rejected, one camp will recommend taking a bet that the other camp recommends rejecting.

  **Final Stipulation:**
  Because the disagreement leads to different actionable recommendations in decision-theoretic contexts, we classify the core dispute as **substantive**. However, we acknowledge that much of the heat in our debates stems from the verbal confusion regarding which definition of "probability" is the default. Future discussions will explicitly specify whether we are discussing *credences* (betting odds) or *frequencies* (world counts) to minimize unnecessary friction.

  ***

  **Signed,**

  _________________________
  (Representative, SSA Camp)

  _________________________
  (Representative, SIA Camp)

  _________________________
  (Moderator/Recorder)
