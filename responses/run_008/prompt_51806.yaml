prompt: |-
  I'm TA-ing intro ethics this semester and my section leader assigned me the nonidentity problem for next week's fifty-minute section (first-years, no philosophy background, most of them still shaky on utilitarianism vs. deontology). Don't give me the explanation itself -- I roughly have that. I need a teaching plan: what order the pieces go in, what example should carry the whole thing, the misconceptions I should expect, and where exactly in the sequence to kill each one off.

  On the carrying example: I've been debating between Parfit's depletion policy thing (society that consumes more now so future people have worse but still worth-living lives) and something more concrete like a city that rebuilds its floodwalls in a way that changes housing patterns, which changes who marries whom, which changes who exists fifty years later. Does the concrete version actually work better for first-years, or does it bury the structure under details? Or is there a better option I haven't thought of? Also tell me what the example needs to include and what it needs to leave OUT to make the puzzle bite.

  Misconceptions: my guess is the big one is students thinking the puzzle dissolves because the future person "can't complain, since they wouldn't exist otherwise," and treating that as a clean answer rather than the thing that makes it weird. And probably some of them will slide into "so nothing we do to future generations matters," which I want to block. Where in the sequence do these hit, and where do I preempt them?

  Also: what should I openly refuse to cover in fifty minutes (I'm assuming the whole person-affecting morality literature, but maybe more), and what single question can I ask at the end to check whether they actually got the puzzle rather than just followed the story?

  Two more things. Please keep the whole answer under 450 words -- tight, not an essay. And as you go, mark what's basically settled among people who work on this versus what's genuinely contested (I gather even whether nonidentity is a real problem vs. a confusion about baselines is disputed -- if so say so, don't present one side as the consensus). Answer in American English please, and push back on my framing wherever it's off.
