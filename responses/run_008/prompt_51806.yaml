  **Example:** Ditch the floodwall. The causal chain (housing → marriage → conception) is too fragile; freshmen will dispute the sociology, not the ethics. Use Parfit's **14-year-old mother** case. It's relatable and isolates the identity variable instantly.
  **Requirements:** Include: Explicit confirmation the child's life is *worth living* (crucial for the puzzle). Exclude: Maternal blame or social stigma; focus strictly on the harm/wrongness distinction.

  **Sequence:**
  1.  **Intuition (10m):** Present case. Ask: "Was choosing to have the child now wrong?" (Most say yes).
  2.  **Harm Principle (10m):** Ask: "Who is harmed?" Students cite the child.
  3.  **Identity Reveal (15m):** Explain that waiting changes *who* exists. [**Settled:** Timing affects identity. **Contested:** Whether existence can be compared to non-existence, but bracket this for the puzzle.]
  4.  **The Clash (10m):** If no one is worse off, how can it be wrong? This is the core puzzle.
  5.  **Implications (5m):** Briefly touch on policy.

  **Misconceptions:**
  *   *"They can't complain."* Students treat this as a solution. **Kill this at Step 4.** Emphasize that our intuition says it's wrong *despite* the lack of complaint. The problem is explaining *why*, not accepting the conclusion.
  *   *"Nothing matters."* Students slide into nihilism. **Kill at Step 5.** Clarify that impersonal values (e.g., "less suffering is better") might still apply even if no person is harmed.

  **Framing Pushback:** You mention students are shaky on util/deontology. Don't try to fix that first. Nonidentity breaks both. Frame it as a problem for *harm-based morality* generally. This avoids getting bogged down in theory definitions.

  **Scope:** Refuse to cover the Person-Affecting Restriction's technical history or the Repugnant Conclusion. Stick to the identity/harm clash.

  **Closing Question:** "Can an action be morally wrong even if it makes no particular person worse off than they would otherwise have been?"

  **Status:** The logical structure (timing affects identity) is **settled**. Whether this proves person-affecting views false or reveals a confusion about "harm" is **genuinely contested**. Don't present one solution as consensus.
