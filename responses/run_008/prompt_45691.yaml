      *   *Logician (Unsoundness) Reply:* I'm not claiming infallibility. I'm claiming that *if* the machine is consistent, the human sees the truth. The burden is on the mechanist to claim the human is wrong *systematically* about G-sentences.
      *   *Philosopher (Idealization) Reply:* Cognitive science posits competence models. If the competence model is mechanistic, the argument applies.
      *   *Logician (Open-Ended) Reply:* That concedes the point. You aren't *one* machine. You are a process that transcends any fixed formal system. That's anti-mechanism in the relevant sense.
      *   *ML (Emergent) Reply:* Even if logic is emergent, the output is still subject to computability constraints.
      *   *Philosopher (Normative) Reply:* Mathematical reasoning is inherently normative (truth-tracking).
