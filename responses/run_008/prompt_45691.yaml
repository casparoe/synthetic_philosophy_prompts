answer: |-
  # Q&A Prep Sheet: Limits of Computational Models of Mind

  **Workshop Context:** Interdisciplinary (Philosophy, Logic, ML).
  **Thesis:** Modest Gödelian Anti-Mechanism. Mechanism is an existential claim ($ \exists M $ modeling human math reasoning). Dilemma: Unnamed $M$ is vacuous; Named $M$ is outstripped by human insight into $G_M$ (given local consistency).
  **Strategy:** Defend the *dilemma*, not the *infallibility* of the human.

  ---

  ### Up-Front Concessions
  *Do not wait to be cornered. State these in your closing remarks or if the first question is hostile.*
  1.  **Concede Fallibility:** You are not arguing humans are logically omniscient or never make mistakes. You are arguing we are not *fixed* formal systems.
  2.  **Concede Architecture:** You are not arguing against neural networks as *tools* or *models of processing*. You are arguing against the claim that the *input-output function* of human mathematical competence is exhaustively capturable by a single Turing Machine.
  3.  **Concede Scope:** This applies to *mathematical reasoning competence*, not perception, motor control, or general "intelligence."

  ---

  ### The 8 Objections (Ordered by Damage)

  #### 1. The "Category Error" Objection (ML Researchers)
  **The Question:** "You're attacking a strawman. Modern cognitive modeling isn't about symbolic theorem-provers with explicit axioms. We build stochastic, subsymbolic systems (transformers, diffusion models) trained on data, not derived from logic. Gödel applies to formal deductive systems. Why should I care about incompleteness when my loss function is converging on a probabilistic manifold that doesn't even *have* axioms to enumerate?"

  **The Reply (2 mins):** "I'm not attacking your architecture; I'm attacking the computability of the function you're approximating. Whether your system is symbolic, subsymbolic, stochastic, or silicon-based, if it produces determinate outputs from inputs in a finite time, it computes a function. If that function is computable, a Turing Machine exists that maps those inputs to those outputs. My argument isn't about *how* the brain computes (weights vs. symbols); it's about whether the *mathematical competence* underlying that computation can be exhausted by *any* fixed computable function. If your model claims to fully replicate human mathematical insight, it inherits the limits of the computable function it implements."
  **Soft Spot:** This assumes the brain's output is effectively computable in the relevant sense. If the brain relies on physical processes that are hypercomputable (e.g., analog continuous dynamics that cannot be discretized without loss), the TM model fails for physical reasons, not logical ones.

  #### 2. The "Unknowable Code" Objection (Logicians)
  **The Question:** "You frame this as a dilemma: name the machine or be vacuous. But the mechanist can claim $M$ exists without being *knowable* by the subject. The axioms might be too complex, or distributed, or implicit in a way the agent cannot introspect. Why does the *agent's* ability to inspect the code matter for the *truth* of mechanism?"

  **The Reply (2 mins):** "Because mechanism is supposed to be a scientific explanation, not a metaphysical mystery. If the machine modeling you is in principle unknowable to you, it cannot explain your reasoning *to you*. It becomes a 'black box' posit. My argument is that a theory of mind that posits a specific cognitive architecture should, in principle, be articulable. If the mechanist retreats to 'The machine exists but you can never know its axioms,' they save the thesis by rendering it explanatorily inert. It becomes indistinguishable from dualism."
  **Soft Spot:** This is a philosophical claim about "explanatory work," not a logical proof. A hard-nosed realist mechanist can bite the bullet and say, "Science often posits unobservables. The mind's code is just another unobservable."

  #### 3. The "Local Consistency" Trap (Logicians)
  **The Question:** "You say you don't need to know *your* consistency, only the machine's. But to see $G_M$ is true, you must assume $M$ is consistent. If you *are* $M$, then your judgment that '$M$ is consistent' is an output of $M$. By Gödel's Second, if $M$ is consistent, it cannot prove its own consistency. So, how do you justify that local supposition without assuming your own reliability exceeds $M$?"

  **The Reply (2 mins):** "I am not claiming I *prove* $M$ is consistent. I am claiming I can make a *conditional* judgment: 'If $M$ is consistent, then $G_M$ is true.' I can survey $M$'s axioms from the outside. I can see they are basic arithmetic truths. I don't need a proof of consistency; I need a rational warrant to *accept* the axioms. The mechanist must claim that I am *wrong* to accept them, or that I am inconsistent in accepting them. The burden shifts to them to show my mathematical intuition is systematically unsound."
  **Soft Spot:** This is the most logically fragile point. If your capacity to judge consistency is itself computable, the Benacerraf/Shapiro critique holds: you haven't escaped the system; you've just moved to a slightly larger one that you can't verify either.

  #### 4. The "Idealization" Objection (Philosophers of Mind)
  **The Question:** "You're talking about 'mathematically competent humans.' But cognitive science models actual performance, with memory limits, attentional blink, and fatigue. No real human can actually enumerate the axioms of a complex ML model or trace a long proof. Doesn't your argument rely on an idealized agent that doesn't exist?"

  **The Reply (2 mins):** "Cognitive science distinguishes between *competence* (the underlying knowledge) and *performance* (the real-time execution). Chomsky made this move for linguistics; I'm making it for math. Even if performance is limited, the question remains: is the *competence* itself mechanistic? If the underlying competence is non-computable, then any mechanistic model is, at best, a simulation that will eventually diverge from human potential given infinite time and resources."
  **Soft Spot:** If competence is inextricably tied to performance (as embodied cognitivists argue), the "idealized agent" is a fiction, and the argument dissolves.

  #### 5. The "Open-Endedness" Objection (Logicians)
  **The Question:** "Okay, you outstrip machine $M$. So the mechanist posits machine $M+1$ which includes your insight about $G_M$. You outstrip that too, so they posit $M+2$. Why isn't the mind just a process that generates an infinite sequence of machines? That's still a computational process."

  **The Reply (2 mins):** "Because a 'process that generates an infinite sequence of machines' is not *a* Turing Machine in the sense mechanism requires. Mechanism claims there is a *fixed* formal system that captures human reasoning. If you concede the mind is an open-ended process that can always transcend any fixed system, you have conceded the core anti-mechanist point: the mind is not *equivalent* to any static formal system. You've redefined mechanism to mean 'computable steps' rather than 'capturable by a system,' which trivializes the claim."
  **Soft Spot:** Some define mechanism as "the brain is a computer" (dynamic system) rather than "the mind is a theorem prover." You need to pin them down on the definition of mechanism early.

  #### 6. The "Emergent Logic" Objection (ML Researchers)
  **The Question:** "Logic isn't the engine; it's the output. Our models learn to *mimic* logical reasoning from training data. They don't 'know' axioms. They just predict the next token that looks like a proof. Why apply Gödel to a system that's just doing pattern matching on syntactic structures?"

  **The Reply (2 mins):** "If the system reliably produces true mathematical statements, it is tracking truth. If it is tracking truth, there is a fact of the matter about whether its output function is computable. If it's just 'pattern matching,' it will eventually hallucinate a false proof that looks syntactically correct. If you claim it *never* does that (i.e., it models human competence), then it has constraints equivalent to axioms. If it does hallucinate, then it's not a model of human mathematical *competence*, just human *text generation*."
  **Soft Spot:** This concedes that current LLMs are not the threat. The threat is a future model that *does* achieve competence. You are arguing about a hypothetical future AI, not current tech.

  #### 7. The "Normative vs. Descriptive" Objection (Philosophers)
  **The Question:** "Even if you're right, you're talking about what we *ought* to believe (truth), not what we *do* believe. Cognitive science is descriptive. Why does a limit on truth-tracking matter for a descriptive model of cognition?"

  **The Reply (2 mins):** "Because mathematical cognition is inherently normative. To understand a proof is to see that it *must* be true. A purely descriptive model that cannot account for the 'must'—the recognition of necessity—fails to capture the phenomenon. If a computational model can only describe our behavior but cannot account for our grasp of truth, it is incomplete as a model of *mind*."
  **Soft Spot:** Naturalists will reject this. They will say "grasp of truth" is just a feeling produced by neural circuitry. You can't prove them wrong empirically.

  #### 8. The "Complexity" Objection (Logicians/ML)
  **The Question:** "Even if a TM exists, the axioms might be $10^{100}$ bits long. No human can read them. So the 'named machine' horn of your dilemma is practically impossible. Does the argument hold if the code is humanly unreadable?"

  **The Reply (2 mins):** "It holds *in principle*. The mechanist claims the mind is finite and computable. If the code is too long for a human to comprehend, then the human mind cannot comprehend its own nature. This returns us to the 'unknowable code' objection. It saves mechanism by making the mind opaque to itself. I'm arguing that this opacity is a cost, not a feature. It makes the theory unfalsifiable."
  **Soft Spot:** Again, this relies on the philosophical premise that a theory of mind *should* be comprehensible to the mind it describes. Empiricists may disagree.

  ---

  ### The Dangerous Question (Hope Nobody Asks)

  **The Question:** "You claim you can see the truth of $G_M$ conditional on $M$'s consistency. But if your cognitive faculty is computable, then your ability to recognize 'consistency' in $M$ is itself a computable function $C$. If $C$ can reliably distinguish consistent from inconsistent systems, isn't $C$ just a stronger machine $M'$? And if so, doesn't Gödel apply to $M'$? You haven't escaped the hierarchy; you've just climbed one rung. Why is *your* consistency judgment privileged?"

  **Why It's Dangerous:**
  This cuts directly to the "modest" waiver you introduced. You tried to avoid claiming humans know their *own* consistency. But to judge *another* machine's consistency (even locally), you are employing a cognitive faculty. If that faculty is mechanistic, it is subject to Gödel. If it is *not* mechanistic, you have already assumed anti-mechanism to prove anti-mechanism.
  *   **If you answer:** "My faculty is not mechanistic," you beg the question.
  *   **If you answer:** "My faculty is mechanistic," you admit you are just a bigger machine $M'$, and the Lucas-Penrose argument fails (you are just an open-ended machine).

  **Prepared Defense (If Asked):**
  "I acknowledge this is the hard core of the problem. My claim is not that I possess a magical consistency oracle. It's that the *process* of mathematical understanding involves a semantic grasp of content that cannot be fully formalized. When I judge $M$ consistent, I am not running a syntactic check; I am reflecting on the *meaning* of the axioms. If mechanism is true, that 'meaning' must be reducible to syntax. I am arguing it is not. I concede I cannot *prove* this reduction is impossible without assuming the very semantic capacity in question. But the burden is on the mechanist to show how syntax generates semantics without remainder."
  *(Note: This is a retreat to philosophy of language/semantics. It saves the talk but concedes the logical 'kill shot'.)*
