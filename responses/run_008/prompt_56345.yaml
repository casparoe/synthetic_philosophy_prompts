answer: |-
  1. You liken voting to being one pair of hands lifting a heavy table. For listeners unfamiliar with the argument, why does this specific analogy do the work that standard consequentialist defences fail to do?
  *Note: If she says it's about shared intention, ask whether that intention survives secret ballots.*

  2. If the duty is grounded in contributing to a public good, does showing up ignorant or voting on a whim discharge that duty, or does it quietly violate it?
  *Note: If she says ignorance violates it, ask where the epistemic threshold lies.*

  3. You're openly sceptical of purely expressive theories of voting, so what is the duty actually a duty *to do*, given that on your own account the point isn't to express anything?
  *Note: Press whether the act becomes merely instrumental if expression is removed.*

  4. In a safe seat, your grounding story implies the causal contribution is vanishing; does the duty survive there, and does that commit you to the duty being stronger in swing districts?
  *Note: If she denies swing seats matter, ask why the collective good isn't less secure there.*

  5. If near-zero-probability benefits can ground duties, it looks like there's a duty to do a thousand other cheap things too; why is voting special?
  *Note: Depending on her reply, press whether the cost structure or the coordination is what makes voting special.*

  6. Does the duty to vote come packaged with a duty to vote for the lesser evil, and what happens when both candidates are bad enough that spoiling the ballot seems like the honest option?
  *Note: Ask whether a spoiled ballot discharges the duty or dodges it.*

  7. If it's a duty, why isn't enforcing it with fines permissible, and does your answer survive applying the same logic to other low-cost duties you probably don't want the police involved in?
  *Note: Ask whether this logic extends to other low-cost duties she wouldn't want police enforcing.*

  8. Your view relies on a collective outcome, but individuals don't know if the threshold for the 'public good' has been met; does uncertainty undermine the duty?
  *Note: Ask if we have a duty to vote even when turnout is already historically high.*

  9. Does this duty persist in a fundamentally corrupt system where the 'public good' is being hijacked by oligarchs, or does the table collapse?
  *Note: Ask who gets to decide when the system is too corrupt to warrant participation.*

  10. Finally, does framing voting as a stringent moral duty risk alienating citizens from politics by turning a civic virtue into a burdensome obligation?
  *Note: Ask if she worries about breeding resentment rather than engagement.*
