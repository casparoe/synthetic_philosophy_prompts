  In the fictional Republic of Ostral, Minister Vane faced a cabinet divided on intervening in the border crisis; war was avoidable had the peace faction prevailed in the upcoming vote. Vane signed the Mobilization Decree, which legally committed Ostral to conflict under Constitutional Clause 4 (Route 1). Unbeknownst to the cabinet, this specific decree also triggered a reciprocal defense statute in the neighboring Empire, mandating an automatic declaration of war upon receipt of any Ostral mobilization order (Route 2). While the Empire's hawkish faction was preparing a separate pretext for war that historical reconstruction suggests was inevitable given the strategic timeline, Vane's signature instantly locked in both the constitutional obligation and the statutory trigger, rendering the outbreak of hostilities overdetermined by dual legal mechanisms before the first shot was fired.

  ***

  **Analysis of the Case**

  **1. The Deflationary Verdict of Standard Tests**
  *   **The But-For Counterfactual:** If Minister Vane had not signed the Mobilization Decree, would the war have occurred? The standard historical reconstruction answers "Yes." The Empire's hawkish faction was already preparing a separate pretext (a "nearest possible world" where Vane hesitates but the Empire manufactures a border incident). Since the outcome (War) occurs in the nearest possible world where the act (Signing) is absent, the test returns the verdict: Vane was not a cause of the War.
  *   **The Structural Historian's Question:** Would the outcome have arrived anyway? Yes. Deep structural tensions and the Empire's strategic imperative made conflict inevitable within the timeframe. The specific trigger was interchangeable; the war was overdetermined by geopolitical forces that would have found another route.
  *   **Result:** Both tests deflate Vane's causal status regarding the *event* of the war. He is treated as incidental to the outcome.

  **2. The Agent as Central Causal Explanandum**
  Despite the deflationary verdict on the *event*, Vane is the central cause of the *episode*. What Vane caused was not the war *simpliciter*, but the **necessity** of the war. Before his act, the war was contingent (the peace faction could have won; the Empire's pretext was not yet active). After his act, the war was overdetermined (two independent legal mechanisms guaranteed it). His causal work was performed on the *modal status* of the outcome: he transformed a contingent possibility into a structural necessity. He is the explanandum because the historical puzzle is not "Why did war happen?" (structural forces explain that) but "Why did war become *inescapable* at precisely this moment?" Vane explains the closure of avoidance paths.

  **3. Removing the Feature**
  If we remove the feature of **generated overdetermination**—for example, if Vane's decree only triggered Constitutional Clause 4 without activating the Empire's reciprocal statute—the case collapses back into standard causation. In that scenario, if Vane hadn't acted, the war might not have happened (contingency remains). The but-for test would identify him as a cause. The specific philosophical blind spot emerges only when the agent's act creates redundancy that masks their contribution to the event's inevitability.

  **4. The Strongest Attack and Assessment**
  *   **The Attack:** A defender of the pure counterfactual test would argue that "causing overdetermination" is not a causal relation to the event. Causation is a relation between an act and an outcome. If the outcome occurs without the act, the act is causally inert. To claim Vane caused the "necessity" is to reify a modal property (necessity) into an event, which is category confusion. The war happened; Vane didn't change the fact of the war, only the number of sufficient conditions. Therefore, he is not a cause of the war.
  *   **Assessment:** The case survives this attack by shifting the locus of historical explanation. History often seeks to explain *why things happened when and how they did*, not just *that* they happened. If an agent transforms a avoidable situation into an inevitable one, they are causally responsible for the loss of historical contingency. Denying this renders historians unable to distinguish between agents who merely ride inevitable waves and those who lock the doors on escape routes. The case demonstrates that redundancy-based reasoning blinds us to causes that operate on the *structure of possibility* rather than the *production of actuality*.
