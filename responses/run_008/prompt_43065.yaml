answer: |-
  This is a genuinely sharp setup. You've stumbled into a live debate in epistemology (the study of knowledge) without needing the jargon. You're describing **Conciliationism**, and your worries about "escape hatches" and "self-defeat" are exactly the objections professional philosophers raise.

  Since you want cases over citations, I'm going to skip the literature review and talk about what should actually make you nervous about your "Split the Difference" rule, based on the data you and Dave are generating.

  Here is the breakdown of what counts against your view, ranked from "Merely Annoying" to "View-Killer."

  ### 1. The "Self-Defeat" Problem (Dave hates the rule)
  **Rank: Merely Annoying (Theoretically tricky, practically manageable)**

  You asked if the fact that Dave disagrees with your rule *about* disagreement is fatal. It feels like a paradox: If you follow the rule, you have to respect Dave's view that the rule is stupid. So shouldn't you lower your confidence in the rule?

  **Why it's not a view-killer:**
  It only kills the view if you demand 100% certainty in the rule itself. But you shouldn't have that anyway.
  *   **The Case:** Imagine you and Dave are arguing about whether a specific movie will win Best Picture. You want to split the probability. Dave says, "Splitting is dumb, I'm sticking to my gut."
  *   **The Concession:** A committed conciliationist has to admit: "Okay, Dave, since you're my peer and you think this rule is bad, I should be slightly less confident that this rule is universally true."
  *   **The Fix:** You don't throw the rule out; you just apply it with a "discount." You treat the rule as a heuristic that is *probably* right, rather than a law of physics. As long as you allow for the possibility that Dave might be right about the rule itself, the paradox dissolves. It's annoying because it requires mental gymnastics, but it doesn't break the system.

  ### 2. The "Unfalsifiable Escape Hatch" (Defining "Peer")
  **Rank: View-Killer (If you aren't careful)**

  This is your biggest risk. You said: *"Whenever splitting feels clearly wrong... I just say 'well he's not my peer so the rule doesn't apply.'"*

  You are right to worry. This is the "No True Scotsman" fallacy. If you define "peer" as "someone I should split the difference with," then your rule is a tautology. It says: "Split the difference with people you should split the difference with." That is scientifically and philosophically useless. It protects the view from ever being wrong, which means it can never be right.

  **What would count against it:**
  If you cannot define "peer" *before* you look at the specific prediction, the rule is dead.
  *   **The Test:** You need to be able to say, "Dave is my peer," based on facts established *prior* to the specific bet.
  *   **The Fatal Flaw:** If the *only* metric for peerhood is "we usually agree," then the rule does no work. You only agree because you already split the difference.
  *   **The Save:** You need an **independent metric** for peerhood. This is where your note app comes in. If you define "peer" as "someone within 5% of my long-term accuracy score over the last 100 predictions," then the view is falsifiable. If Dave falls outside that range, he's not a peer, and you don't split. If you can't set that line in the sand, the escape hatch makes the view vacuous.

  ### 3. The Track Record Divergence (Dave is winning)
  **Rank: View-Killer (For the "Split Exactly" version)**

  You mentioned Dave is ahead, "though honestly not by much." This is the empirical hammer that should crush the strict "meet in the middle" version of your view.

  Conciliationism relies on the **Equal Weight View**. It assumes that if we are peers, your opinion and my opinion are equally likely to be true. But if your shared note shows Dave is right 55% of the time and you are right 45% of the time, you are **not** epistemic equals. You are data points.

  **The Case:**
  Imagine you have made 300 predictions.
  *   Dave's accuracy: 60%
  *   Your accuracy: 50% (Coin flip)
  *   **Scenario:** You are 90% sure the Chiefs win. Dave is 90% sure they lose.
  *   **Strict Split:** You both move to 50/50.
  *   **The Problem:** Since Dave is historically more reliable, the "correct" move isn't to meet in the middle. The correct move is for *you* to move toward *him* more than he moves toward *you*. By splitting exactly, you are ignoring the base rate of your own reliability.

  **Why this hurts:**
  If you stick to "split the difference" even when the track record shows asymmetry, you are actively lowering your expected accuracy. A view that tells you to ignore relevant data (your past performance) in favor of a rigid principle is a bad view.
  *   **The Concession:** You must concede that "Split the Difference" is only a special case of a broader rule: **"Weight by Reliability."** When reliability is equal, split. When it isn't, weight toward the winner. If you refuse to concede this, the track record data kills the view.

  ### 4. The "Systematic Bias" Case
  **Rank: View-Killer (For specific domains)**

  This is a specific type of track record issue that is often worse than overall score.

  **The Case:**
  Let's say you and Dave make predictions about politics.
  *   You tend to be slightly pessimistic.
  *   Dave tends to be wildly optimistic.
  *   Over 3 years, the world turns out to be mostly pessimistic.
  *   Dave is wrong often, but when he's right, he's *very* right. You are steady but boring.

  If you simply "split the difference" on every political call, you might be averaging out the truth. If Dave is consistently biased in one direction (e.g., he always thinks relationships will last, they always break up), and you know this, splitting the difference preserves his error.

  **What counts against the view:**
  If you notice that in specific categories (sports vs. relationships vs. work), one of you has a "tilt," splitting the difference becomes harmful.
  *   **Example:** You know Dave always overrates his favorite football team. He says they have an 80% chance. You say 40%. The "real" chance is probably 35%. If you split to 60%, you have moved *away* from the truth because you failed to account for his known bias.
  *   **The Hit:** If your note app reveals domain-specific biases, a blind "split the difference" rule is demonstrably inferior to a "correct for known bias" rule.

  ### Summary: The Ranking

  1.  **Track Record Divergence (View-Killer):** If the data shows Dave is more reliable than you, strict splitting is mathematically wrong. You must weight toward him.
  2.  **Unfalsifiable Peer Definition (View-Killer):** If you decide who is a peer *after* seeing if splitting feels right, the rule is meaningless. Peer status must be independent of the current disagreement.
  3.  **Systematic Bias (Domain-Specific Killer):** If Dave has a known tilt in a specific category, splitting amplifies error rather than reducing it.
  4.  **Self-Defeat (Annoying):** Disagreeing about the rule itself just means you should be less dogmatic about the rule. It doesn't invalidate the utility of the rule.

  ### The Verdict on the "Escape Hatch"

  You asked: *Is the "equal peers" escape hatch unfalsifiable, and is that a problem?*

  **Yes, it is unfalsifiable if you use it loosely.** And **yes, that is a fatal problem.** A rule that applies "whenever it seems appropriate" is just intuition dressed up as a principle.

  **However,** it doesn't have to be that way. You can make it falsifiable by locking in the definition of "peer" using your existing data.
  *   **Fix:** Define "Peer" as: "Someone whose accuracy rate over the last 50 shared predictions is within ±5% of mine."
  *   **Result:** Now the rule is testable. If Dave's accuracy drifts to +10%, he ceases to be a peer. The rule stops firing. You don't split; you defer.

  ### Recommendation

  You shouldn't drop the view entirely, because the core intuition (disagreement is evidence that I might be wrong) is robust. But you need to upgrade the software.

  **Stop saying:** "We are peers, so let's split the difference."
  **Start saying:** "Let's check the tracker. If our accuracy is within 5%, we split. If Dave is ahead by more than 5%, I move 2/3 of the way to him. If I'm ahead, he moves 2/3 to me."

  This solves the track record problem, solves the unfalsifiability problem (because the criteria are fixed in advance), and handles the bias problem (if you track accuracy by category).

  The only thing that should make you drop the view entirely is if, after weighting by reliability, you find that **ignoring Dave completely** yields a better score than listening to him at all. If that happens, he's not a peer, he's noise. Cut him loose.
