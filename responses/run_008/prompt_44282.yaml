          *   Refine the alternative: The *virtuoso improviser*. They have deep knowledge, they work in the moment, they don't hoard because the music moves on. They aren't serene; they are engaged.
          *   Wait, is there a better one? How about *trustees*? No. How about *participants in a gift economy*?
