answer: |-
  Yes, the rule you have reverse-engineered has an established name in the literature. You are describing the **Normal Species Functioning** account of justice, most famously articulated by the philosopher **Norman Daniels** in his book *Just Health Care* (1985) and later refined in *Just Health* (2008).

  The conception of equality it delivers is a specific interpretation of **Fair Equality of Opportunity (FEO)**.

  You are correct that the "expensive tastes" objection (associated with Ronald Dworkin and Richard Arneson) does not fit your cases. That debate is about whether justice should compensate people for costly preferences they chose to cultivate. Your observation is sharper: your office does not track cost or choice; it tracks **normality**. You fund the restoration of the "normal opportunity range" available to typical members of society, but you do not fund the pursuit of specific conceptions of a good life, even if those pursuits are essential to an individual's happiness.

  Here is how your rule maps onto the literature, how the theory handles your edge cases, and how neighboring theories would draw the lines differently.

  ### 1. The Theory: Normal Species Functioning
  Norman Daniels argues that health care (and by extension, workplace accommodations) is special because it protects **normal species functioning**.
  *   **The Goal:** To keep individuals as close as possible to "typical" functioning for their species.
  *   **The Reason:** Typical functioning protects an individual's share of the **normal opportunity range**—the array of life plans and activities that are reasonably available to people in that society.
  *   **The Limit:** Justice owes you the ability to *enter* the race on equal footing with others. It does not owe you the ability to win the race, nor does it owe you support for a specific version of the race you personally prefer (like competitive sailing).

  **Why this fits your Deaf vs. Sailor case:**
  *   **The Deaf Employee:** Meetings are part of the "normal opportunity range" of corporate work. Sign language interpretation restores the employee to typical functioning *relative to that environment*. It removes a barrier to a universal activity.
  *   **The Sailor:** Competitive sailing is not part of the "normal opportunity range" of work or basic functioning; it is a specific *conception of the good life*. Under Daniels' framework, the employer owes the sailor protection from discrimination, but not funding for the specific activities that give his life meaning, because those are private preferences, not public opportunities.

  ### 2. Handling Your Edge Cases
  Daniels' framework is robust, but it struggles at the exact edges you identified. Here is how a proponent of Normal Species Functioning would analyze them, and where the theory admits vulnerability.

  **Case 1: Severe Myopia (The "Glasses" Problem)**
  *   **The Classification:** This is the clearest case for Daniels. Vision is a "species-typical" function. Glasses are "maintenance" of normal functioning.
  *   **The Rule:** Because the capacity (sight) is universal and the intervention (glasses) restores typical function, it is not an "accommodation" but a standard provision.
  *   **Why it fits your rule:** Your office ignores this because it falls *below* the threshold of "accommodation." It is considered baseline maintenance. Daniels agrees: justice requires restoring typical functioning, but when the cost is trivial and the function universal, it becomes invisible infrastructure rather than a funded adjustment.

  **Case 2: Adaptive Preferences (The "Shrinking Wants" Problem)**
  *   **The Classification:** This is the strongest critique of your office's rule (and Daniels' theory). It comes from the **Capabilities Approach** (Amartya Sen and Martha Nussbaum).
  *   **The Problem:** If an injured employee stops wanting to do things because they assume they can't, your rule says "no need, no fund." Daniels' model relies on objective medical impairment, not subjective desire. If the medical impairment is stabilized, the obligation ends.
  *   **The Verdict:** A strict Normal Species Functioning proponent would say your office is *correct* to deny funding here, provided the employee is medically stable. The "suffering" of lost meaning is not a medical impairment.
  *   **The Critique:** Nussbaum would argue your office is wrong. She argues justice should support **Central Capabilities** (e.g., "Senses, Imagination, and Thought"). If an employee has shrunk their world to avoid pain, they are deprived of capability, even if they don't express a preference. A Capabilities theorist would fund rehabilitation or counseling not because of a "medical need," but to restore the *capability* to form preferences, even if the employee currently lacks them.

  **Case 3: Climate Sensitivity (The "Collapse" Problem)**
  *   **The Classification:** This is the boundary where "medical necessity" bleeds into "environmental preference."
  *   **The Rule:** Daniels draws the line at **pathology**. If the climate causes a pathological reaction (e.g., autoimmune collapse), it is a medical need. If it causes discomfort or reduced quality of life, it is a preference.
  *   **The Conflict:** Your office likely struggles here because the *consequence* (health collapse) looks like a barrier to universal activity (working), but the *cause* (location) looks like a singular requirement.
  *   **The Resolution:** Under Normal Species Functioning, you would fund the accommodation (remote work/relocation) *only if* the climate triggers a diagnosed pathological condition that impairs typical functioning. You would not fund it if it merely prevents "flourishing."

  ### 3. Neighboring Positions: How They Would Draw the Line Differently
  If you want to understand why your rule feels unstable, it helps to see how other frameworks would cut the pie.

  **A. The Capabilities Approach (Sen/Nussbaum)**
  *   **The Metric:** What is this person actually able to *do and be*?
  *   **The Sailor:** Might get funding. If sailing is central to this person's dignity and ability to function as a human being (their "narrative unity"), a Capabilities theorist might argue that denying it deprives them of a central capability, especially if the cost is low.
  *   **The Injured Worker:** Would definitely get funding. The fact that their wants have contracted is seen as a deprivation of capability. The goal is to expand their "effective freedom," not just satisfy expressed wants.
  *   **Difference:** This approach is more individualized and less reliant on "species-typical" norms. It is harder to administer but more sensitive to human diversity.

  **B. Luck Egalitarianism (Dworkin/Cohen)**
  *   **The Metric:** Is this disadvantage due to "brute luck" (unchosen) or "option luck" (chosen)?
  *   **The Sailor:** Would likely be denied. Sailing is a chosen preference. Even if it gives meaning, it is a "taste" the employee cultivated.
  *   **The Deaf Employee:** Funded. Deafness is brute luck.
  *   **The Difference:** This looks similar to your rule, but for a different reason. Your rule asks: "Is this activity universal?" Luck Egalitarianism asks: "Did they choose this need?"
  *   **The Edge Case:** If the sailor was born with a physiological dependency on the adrenaline of competition (a biological brute luck), Luck Egalitarianism might fund him. Your rule would still deny him because the *activity* is not universal.

  **C. Welfarism (Utilitarianism)**
  *   **The Metric:** Which option produces the most well-being/reduces the most suffering?
  *   **The Sailor:** Would be funded. You noted the cost is low and the suffering is high. A Welfarist would fund the sailor and potentially defund the interpreter if the interpreter's cost is astronomical and the sailor's need is urgent.
  *   **The Difference:** Your office explicitly rejects this. You do not aggregate suffering. You follow a deontological rule (duty-based) regarding the *type* of need, not the *amount* of pain.

  ### 4. A Sharp Definition for Your Work
  Since you asked for a term to classify new cases by rather than gut feeling: while the philosophical position is **Normal Species Functioning**, the operational heuristic you are using can be defined as:

  **The Normative Activity Test**

  > **Definition:** An accommodation is warranted if and only if it restores the employee's ability to engage in **activities that are constitutive of the standard social role** they occupy (e.g., "employee," "colleague"), without regard to the subjective meaning those activities hold for the individual.
  >
  > **Classification Protocol:**
  > 1.  **Identify the Activity:** What specific action does the funding enable? (e.g., "Attending meetings" vs. "Competing in regattas".)
  > 2.  **Check Universality:** Is this activity a standard requirement of the social role for *nearly all* occupants of that role?
  >     *   *Yes:* Proceed to step 3. (e.g., All employees must attend meetings.)
  >     *   *No:* Decline. (e.g., Not all employees must sail.)
  > 3.  **Check Impairment:** Does the employee's condition prevent them from doing this universal activity in the standard way?
  >     *   *Yes:* Fund the adjustment that bridges the gap to the standard way.
  >     *   *No:* Decline.

  **Why this helps with your edge cases:**
  *   **Myopia:** Reading screens is a universal activity. Glasses bridge the gap. (Fund/Maintain).
  *   **Adaptive Preference:** The employee has stopped wanting to do universal activities. The Test says "No activity requested = No fund." (This confirms your rule's limitation: it cannot detect suppressed desire).
  *   **Climate:** Is "living in City X" a universal activity? No. Is "maintaining health" a universal requirement? Yes. The conflict arises here. The Test forces you to ask: "Are we funding the *location* (singular) or the *health* (universal)?" If remote work allows the health maintenance without funding the specific location, the Test approves remote work but denies relocation subsidies.

  ### Summary
  You have independently discovered **Norman Daniels' Fair Equality of Opportunity** framework.
  *   **The Name:** Normal Species Functioning Account.
  *   **The Equality:** Fair Equality of Opportunity (protecting the normal opportunity range).
  *   **The Edge Cases:** Your rule is stable on Myopia, unstable on Adaptive Preferences (a known philosophical weakness), and ambiguous on Climate (a boundary dispute between medical and social determinants).
  *   **The Alternative:** The **Capabilities Approach** would fix the Adaptive Preference problem but would make your office's work much more intrusive and subjective, requiring you to judge what gives each employee "meaning."

  Your gut feeling that the rule "misbehaves" on the injured worker who stops wanting things is philosophically sound. That is the exact point where **Justice as Opportunity** (Daniels) is critiqued by **Justice as Capabilities** (Nussbaum). Your office has chosen Opportunity. Be aware that this choice means you will inevitably overlook those whose suffering manifests as silence rather than request.
