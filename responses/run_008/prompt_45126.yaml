  **Interviewer:** We have tested your position against hierarchy, math, emotion, quality, and culture. I want to close on the status of the claim itself.

  **Q9 (Falsifiability):** What, if anything, would you count as evidence against the copy thesis? What would a music have to be like, or what would have to happen in how it is heard, for you to give up the idea that music is a direct copy of the Will?

  **Q10 (Falsifiability Follow-up):** *Anticipating your reply:* I suspect you will say that no empirical observation can falsify a metaphysical truth, as all such observations are merely of the world as Representation. But if your theory is immune to all possible empirical counter-evidence, does it not risk becoming a tautology? If nothing can prove you wrong, does anything prove you right?
