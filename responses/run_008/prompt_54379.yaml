          *   Prediction: AI helps, but without property rights and profit/loss, the "objective function" is missing. What is the AI optimizing for?

      *   **Conclusion:** Summarize. The debate isn't about math or bandwidth; it's about incentives, property rights, and the dynamic generation of knowledge.

  4.  **Refining the Tone:**
