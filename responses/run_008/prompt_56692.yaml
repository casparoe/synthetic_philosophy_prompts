          *   *Justification:* Augustine uses this pragmatic boundary argument, but it supports the rule rather than grounding its absolute moral weight.

      *   **(d) God is truth itself, so a lie is a kind of sacrilege regardless of how harmless it looks.**
          *   *Analysis:* This is deeply Augustinian. God is *Veritas*. To lie is to turn away from Being/Truth toward Non-being. It's an ontological and theological violation.
