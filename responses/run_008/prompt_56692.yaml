prompt: |-
  I'm teaching a grad seminar on Augustine on lying this term, and we just hit the bit in Contra mendacium where he says you can't even lie to save someone's life — if I remember right there's an example where a wife is asked by killers where her husband is hiding, and Augustine still won't budge. My students think this is nuts, and honestly some days I agree with them. For the next session I want them to evaluate the best reconstructions of why he holds the absolute ban, so: rate each of these four defenses of the total prohibition on lying, 1-10, with a sentence or two of justification each — (a) the will to deceive is itself a corruption of the soul, so no downstream consequences can redeem it; (b) lying treats the deceived person as a thing to be managed rather than a rational agent owed the truth; (c) any exception mechanism will get gamed, since everyone will classify their own lies as the permitted kind; (d) God is truth itself, so a lie is a kind of sacrilege regardless of how harmless it looks. Then tell me which of these is closest to Augustine's actual reasoning and which is more like later kantian retrofitting. I want arguement strength only, no reading list. And if you'd construct a fifth defense for him, i'm curious what it would be.
