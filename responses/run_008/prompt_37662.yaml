  2. The mirror case: the program will help the environment as a side effect, and the chairman says he doesn't care at all about that either. Verdict: he did not intentionally help the environment.
  3. A voting-machine case: an executive ships machines he knows will miscount votes in favor of his own party, purely because proceeding is profitable; he says he doesn't care about the electoral effect. Verdict: he intentionally helped his party. (So it is not just harm that triggers "intentional" for my friend.)
  4. The aversion variant: same as case 1, except the chairman grimaces, says he hates that the environment will be harmed, and proceeds anyway because he must. Verdict: not intentional.
  5. A conventional-norm case: a department chair adopts a policy that improves teaching but, as a foreseen side effect, ends a long-standing and cherished Friday tradition of the faculty; she says she doesn't care about that. Verdict: not intentional. (So a norm violation that carries no real blame doesn't seem to do the work.)
  6. A desire case: same as case 1, except the chairman is privately delighted that the harm will hurt a rival's hometown and admits he would have pursued the harm even without the profit. Verdict: intentional.

  The new cases I expect us to fight about next week — please predict his verdict on each:

  Case A (justified harm): a hospital director keeps an emergency room open through a flood, knowing with near certainty that an exhausted resident will make a serious error and a patient will be badly harmed; the harm occurs; there was no acceptable alternative, and the director is tormented by it. Did she intentionally harm the patient?

  Case B (omission): a park ranger notices a leak that will kill all the fish in a downstream pond; repairing it would cost him ten minutes and nothing else, but he is indifferent, does nothing, and the fish die. Did he intentionally kill the fish?

  Case C (help via wrongdoing): a CEO bribes an official to win a contract he wants for its profits; as a foreseen side effect of the winning bid, the firm's expansion funds repairs to several local schools, an outcome he says he doesn't care about. Did he intentionally help the schools?

