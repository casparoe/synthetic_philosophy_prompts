prompt: |-
  I teach a graduate metaphysics seminar and every spring we do the laws of nature unit: Humean supervenience and the best-system account on one side, Armstrong-Dretske-Tooley necessitation and Maudlin's primitivism on the other, and by week three the students are just lobbing stock objections at each other. I've decided the problem is that nobody in the room has actually written down what we're demanding of a theory of laws in the first place. So before the unit starts this year I want to hand them a spec sheet.

  Write me the desiderata. What does any adequate theory of laws of nature have to deliver? Obviously I have things in mind -- it has to distinguish laws from merely accidental regularities (the old uranium-spheres trick vs. an actual law), it has to say something about why laws support counterfactuals, it has to say something about whether laws explain the regularities or just summarize them, it has to handle probabilistic laws without quietly turning them into deterministic ones about frequencies. But I also want the less obvious ones on the list, and the reasoning behind each: why is it a requirement rather than a preference, and which camp's preference is it if it's a preference? Two I specifically want your judgment on:

  1. A colleague of mine claims that "governing" is not a desideratum at all but a metaphor that has conned three generations into thinking there's a phenomenon there -- that once you list what laws do (explain, support counterfactuals, back predictions) nothing is left for governing to do. Is that right, or is there real explanatory work that only the governing intuition does?

  2. I keep going back and forth on whether a theory of laws owes us an epistemology -- an account of how we could ever tell which regularities are the lawful ones -- or whether that's a separate question for philosophy of science. Give me a view.

  Also please tell me which subset of the desiderata, if any, you think is jointly unsatisfiable -- if there's a no-go result buried in the list itself I want to know, since that's the most interesting thing I could hand the students. And I suspect a couple of the standard demands are secretly the same demand wearing different hats -- if you notice that, say so.

  Score the three main contenders (best systems, necessitation, primitivism) against the list at the end if you want, but keep that part short -- the criteria are the real deliverable, I'll do the scorecard in class.

  American English please -- and I know I type fast and loose, but keep your own prose clean.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Target Audience:** Graduate metaphysics seminar (advanced students, familiar with the literature).
      *   **Topic:** Desiderata for a theory of laws of nature.
      *   **Goal:** Create a "spec sheet" of requirements/criteria for evaluating theories of laws (Humean/BSA, DTA/Necessitation, Primitivism).
      *   **Specific Questions to Address:**
          1.  Is "governing" a genuine desideratum or a misleading metaphor?
          2.  Does a theory of laws owe us an epistemology?
          3.  Are there jointly unsatisfiable desiderata (no-go theorems/trade-offs)?
          4.  Are some desiderata redundant (same demand, different hats)?
      *   **Format:** Clean American English, professional but engaging tone (suitable for a professor handing out material).
      *   **Constraint:** Keep the scoring of the three contenders short; focus on the criteria.

  2.  **Drafting the Desiderata (The "Spec Sheet"):**
      *   *Core/Obvious:* Distinction (Law vs. Accident), Counterfactual Support, Explanation.
      *   *Less Obvious/Technical:* Modality (strength), Probabilistic Laws, Intrinsicness/Locality, Integration with Physics (natural properties), Time/Symmetry.
      *   *Reasoning:* For each, explain *why* it's required (intuition, scientific practice) and *who* cares most (Humean vs. Anti-Humean).

      *   *Drafting List:*
          1.  **The Distinction Requirement:** Must separate laws from accidents (Uranium vs. Gold spheres).
          2.  **Counterfactual Resilience:** Laws must support subjunctive conditionals.
          3.  **Explanatory Power:** Laws explain instances, not vice versa (direction of fit).
          4.  **Modal Strength:** Must account for nomic necessity (stronger than mere regularity, weaker than logical).
          5.  **Probabilistic Compatibility:** Must handle quantum mechanics without reducing chance to frequency.
          6.  **Natural Property Constraint:** Laws must relate genuine universals/natural properties (to avoid grue-like predicates).
          7.  **Metaphysical Parsimony:** Don't multiply entities beyond necessity (Humean strength).
          8.  **Scientific Integration:** Must align with actual physics practice (symmetry, conservation).

  3.  **Addressing Specific Question 1: Governing:**
      *   *The Colleague's View:* Governing is a metaphor. Once you have explanation + counterfactuals, "governing" is empty.
      *   *My Analysis:* It's not *just* a metaphor, but it's dangerous. It captures the *directionality* of explanation (top-down). However, "governing" often smuggles in anthropomorphism.
      *   *Verdict:* It's a placeholder for the *source* of modal force. If a theory explains counterfactuals but makes laws dependent on the mosaic (BSA), it fails the "governing" intuition. If it posits governing (DTA/Primitivism), it risks mystery. It is a genuine desideratum for Anti-Humeans, but Humeans reject it. So, list it as "The Directionality Constraint."

  4.  **Addressing Specific Question 2: Epistemology:**
      *   *The Debate:* Metaphysics vs. Philosophy of Science.
      *   *My View:* A metaphysical theory that makes laws unknowable in principle is defective (Benacerraf-style worry). However, the *detailed* epistemology is for PhilSci.
      *   *Verdict:* Include "Epistemic Access" as a soft constraint. If a theory makes laws undetectable even in principle, it's suspect. But don't demand a full confirmation theory.

  5.  **Addressing Specific Question 3: Joint Unsatisfiability & Redundancy:**
      *   *Unsatisfiable:* The "Big Trade-off." You generally cannot have *strong modal force* (Governing/Necessitation) AND *Humean Parsimony/Empiricist Friendliness*. This is the Humean vs. Anti-Humean divide.
      *   *Redundancy:* "Counterfactual Support" and "Explanatory Power" are often two sides of the same coin. If laws explain, they usually support counterfactuals. "Governing" is often just "Explanatory Directionality" dressed up.

  6.  **Scoring the Contenders (Briefly):**
      *   *BSA:* Wins on Parsimony/Epistemology. Loses on Governing/Modal Strength.
      *   *DTA:* Wins on Distinction/Governing. Loses on Parsimony/Identification Problem (what is N?).
      *   *Primitivism:* Wins on clarity of role. Loses on parsimony/mystery.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it academic but accessible? Yes.
      *   *Formatting:* Use bolding, lists, and clear headings.
      *   *Content Check:* Did I cover the uranium sphere example? Yes. Probabilistic laws? Yes.
      *   *American English:* Ensure spelling and idioms match (e.g., "defense" not "defence", "program" not "programme").

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to present the "Governing" answer as definitive truth, but as a reasoned philosophical position suitable for grad students to debate.
      *   *Correction:* Ensure the "No-Go" result is highlighted clearly, as the professor specifically asked for that as the "most interesting thing."
      *   *Refinement:* The "Epistemology" point needs to distinguish between *identification* (which regularity is a law) and *justification* (how we know).

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  **To:** Graduate Metaphysics Seminar
  **From:** [Instructor Name]
  **Re:** Unit 3 Spec Sheet — Desiderata for a Theory of Laws

  Before we engage with the texts, we need to agree on what job we are hiring a theory of laws to do. Too often, debates between Humeans and Anti-Humeans talk past one another because they prioritize different deliverables. Below is the spec sheet. These are the criteria an adequate theory of laws should meet.

  I have divided them into **Core Constraints** (non-negotiable for almost everyone) and **Contested Constraints** (where camps diverge on necessity). I have also included the reasoning for each, noting where a constraint is a metaphysical demand versus a methodological preference.

  ### I. Core Constraints

  **1. The Distinction Requirement**
  *   **The Demand:** The theory must distinguish lawful regularities from accidental universal generalizations.
  *   **The Test:** It must explain why "All uranium spheres are less than 1km in diameter" is lawful (due to critical mass physics), while "All gold spheres are less than 1km in diameter" is accidental (even if true).
  *   **Reasoning:** Without this, laws collapse into mere descriptions of the history of the world. This is the baseline intuition for both Humeans and Anti-Humeans.

  **2. Counterfactual Resilience**
  *   **The Demand:** Laws must support subjunctive conditionals; accidents must not.
  *   **The Test:** If the uranium sphere *were* larger, it would explode. If the gold sphere *were* larger, nothing specific follows from lawhood (though practical constraints might apply).
  *   **Reasoning:** Scientific practice relies on laws to predict outcomes in non-actual scenarios. A theory that makes laws dependent on the actual mosaic (in a way that breaks under counterfactual supposition) fails to capture scientific usage.

  **3. Explanatory Directionality**
  *   **The Demand:** Laws must explain their instances; instances must not explain the laws.
  *   **The Test:** The electron behaves this way *because* of the Pauli Exclusion Principle. The Principle does not hold *because* the electron behaves this way.
  *   **Reasoning:** This captures the asymmetry of scientific explanation. If a theory makes laws mere summaries of instances (the "Humean Best System" risk), it threatens to reverse this direction.

  **4. Probabilistic Compatibility**
  *   **The Demand:** The theory must accommodate irreducible probabilistic laws without reducing them to deterministic frequencies.
  *   **The Test:** It must handle quantum mechanics without claiming that a 50% chance of decay is secretly a claim about the long-run frequency in the actual world (which could be skewed by luck).
  *   **Reasoning:** Modern physics is probabilistic. A theory of laws that forces determinism is empirically inadequate.

  ### II. Contested Constraints

  **5. Modal Strength (The "Necessitation" Intuition)**
  *   **The Demand:** Laws must possess a modal force stronger than mere regularity but weaker than logical truth.
  *   **Reasoning:** This is the Anti-Humean priority. They argue that without a "nomic necessity" relation, counterfactuals (Constraint #2) are ungrounded.
  *   **Humean Objection:** This is a preference for a specific metaphysical picture, not a datum. Humeans argue we can earn counterfactuals through systematization without positing modal glue.

  **6. Natural Property Constraint**
  *   **The Demand:** Laws must relate only "natural" properties (universals or fundamental bases), not gerrymandered ones (like *grue*).
  *   **Reasoning:** If laws can be stated in any predicate, the Distinction Requirement (#1) collapses.
  *   **Camp Split:** Armstrong (DTA) requires universals. Lewis (BSA) requires perfectly natural properties. Primitivists often leave this under-specified.

  **7. Epistemic Access**
  *   **The Demand:** It must be possible, in principle, for agents within the world to identify the laws.
  *   **Reasoning:** A Benacerraf-style worry. If laws are metaphysically distinct from regularities but empirically indistinguishable from them, positing them is occult.
  *   **Status:** *Soft Constraint.* (See my note below on Epistemology).

  **8. Metaphysical Parsimony**
  *   **The Demand:** Do not multiply ontological categories beyond necessity.
  *   **Reasoning:** This is the Humean priority. Positing a "necessitation relation" or "governing power" is ontologically costly.
  *   **Anti-Humean Objection:** Parsimony is a virtue of theories, not reality. If the world is thick, a thin ontology is false, not virtuous.

  ---

  ### III. Instructor Notes on Specific Issues

  You asked for my judgment on two specific friction points. Here is how I am framing them for the seminar.

  **1. Is "Governing" a Real Desideratum?**
  Your colleague is half-right but misses the forest for the trees. "Governing" is indeed a metaphor, and a dangerous one (it smuggles in agency and time). However, it points to a genuine structural requirement: **The Source of Modal Force.**

  If laws support counterfactuals and explain instances, *in virtue of what* do they do so?
  *   **The Humean Answer:** In virtue of the pragmatic value of the systematization.
  *   **The Anti-Humean Answer:** In virtue of the metaphysical nature of the relation itself.

  If you delete "governing" entirely, you risk losing Explanatory Directionality (#3). If the law is just the summary of the instances, the instances ontologically ground the law. To save the intuition that the law *constrains* the instances, you need *something* to do the work of "governing," even if you don't call it that.
  *   **Verdict:** List it as **Explanatory Directionality**. "Governing" is the folk name for the requirement that the arrow of explanation points from Law to World, not World to Law.

  **2. Does a Theory of Laws Owe an Epistemology?**
  Yes, but with limits.
  *   **The Hard Line:** A metaphysical theory that makes laws *in principle* undetectable is defective. If two worlds can have identical observable histories but different laws (as some strong necessitation views allow), the theory posits a difference that makes no difference. This violates a naturalistic constraint on metaphysics.
  *   **The Limit:** You do not need a full confirmation theory (that is Philosophy of Science). You only need to show that the metaphysical posits *supervene on* or are *indicated by* observable regularities.
  *   **Verdict:** Include **Epistemic Access (#7)** as a soft constraint. If a theory solves the metaphysics but makes laws unknowable, it fails. If it makes them hard to know, it survives.

  ---

  ### IV. The No-Go Result & Redundancies

  This is the most critical part for your students. There are trade-offs buried in this list.

  **1. The Great Trade-Off (Joint Unsatisfiability)**
  It is highly plausible that **Modal Strength (#5)** and **Metaphysical Parsimony (#8)** are jointly unsatisfiable alongside **Epistemic Access (#7)**.
  *   If you want strong Modal Strength (Anti-Humean), you usually pay in Parsimony (new relations/universals) and risk Epistemic Access (how do we see the necessitation?).
  *   If you want Parsimony and Access (Humean), you usually pay in Modal Strength (laws are just regularities + pragmatics).
  *   **The Lesson:** There is no "free lunch." Every theory on the syllabus fails at least one Core or Contested constraint. The debate is about which failure is least costly.

  **2. Redundancies (Same Demand, Different Hats)**
  *   **Counterfactual Resilience (#2) and Explanatory Directionality (#3):** These are often the same demand. If laws explain instances, they typically support counterfactuals. If they are mere summaries, they typically fail both.
  *   **Governing and Directionality:** As noted above, "Governing" is just the intuitive label for Explanatory Directionality. Don't let students treat them as separate items.

  ---

  ### V. Brief Contender Scorecard

  *For your in-class use. I have kept this minimal as requested.*

  **1. Humean Best-System Account (Lewis)**
  *   **Wins:** Parsimony, Epistemic Access, Probabilistic Compatibility.
  *   **Loses:** Explanatory Directionality (laws depend on the mosaic), Modal Strength (no "oomph").
  *   **Verdict:** Best for the naturalist, worst for the modal realist.

  **2. Armstrong-Dretske-Tooley (DTA)**
  *   **Wins:** Distinction Requirement, Explanatory Directionality, Modal Strength.
  *   **Loses:** Parsimony (posits necessitation relation), Epistemic Access (the "Inference Problem"—how does N(F,G) guarantee F is followed by G?), Probabilistic Laws (hard to fit probabilities into necessitation).
  *   **Verdict:** Best for the intuition of lawhood, worst for integration with physics.

  **3. Primitivism (Maudlin)**
  *   **Wins:** Clarity on Directionality (laws just *are* primitive guides), avoids the "Inference Problem" of DTA.
  *   **Loses:** Parsimony (massive), Epistemic Access (primitives are opaque), Natural Property Constraint (often vague on what the primitives relate).
  *   **Verdict:** The "honest" Anti-Humean view. Admits mystery to save the phenomenon.

  **Final Instruction to Class:**
  Do not look for the theory that checks every box. Look for the theory that fails the box you care least about.
