answer: |-
  This is a classic philosophical puzzle known as **Frank Jackson's "Knowledge Argument"** (or "Mary's Room"), first proposed in 1982. Your friend has articulated it perfectly, and your intuition that it "proves too much" is shared by many professional philosophers.

  The reason the argument feels so strong is that it exploits a confusion between **epistemology** (what we know and how we know it) and **ontology** (what actually exists in the world).

  You asked which step to reject, why it looked plausible, and what the costs are. Since you prefer to keep **Step (2)** (the intuition that she genuinely learns something), the most philosophically robust move is to reject **Step (4)**.

  Here is the breakdown of why Step (4) is the weak link, why it tricks us, and how to handle your friend's inconsistency regarding Rome and hangovers.

  ---

  ### The Weak Link: Step (4)
  > *(4) Since she already had all the physical facts, whatever she gains must be a non-physical fact.*

  **Why it looks okay:**
  This step relies on an assumption called **transparency**. It assumes that if you have all the information about a thing (the physical facts), there is no other "angle" from which to know that thing. It assumes that knowledge maps 1:1 onto reality. If I know *everything* about X, there is nothing left to know about X. Therefore, if Mary learns something new, it must be about something *other* than the physical facts she already knew.

  **Why it is wrong:**
  You can know the same fact in different ways. This is often called the **"Mode of Presentation"** objection.

  Consider this analogy:
  *   **Fact A:** Mark Twain wrote *Huckleberry Finn*.
  *   **Fact B:** Samuel Clemens wrote *Huckleberry Finn*.

  You might know Fact A without knowing Fact B. If someone tells you "Samuel Clemens is Mark Twain," you learn something new. But have you learned a *new fact about the world*? No. You have learned that two different *concepts* or *names* refer to the same *person*. The reality (ontology) didn't change; your access to it (epistemology) did.

  **Applying this to Mary:**
  When Mary leaves the room, she doesn't discover a new *property* of the tomato (a non-physical "redness" floating in the air). She discovers a new **mode of access** to the physical properties she already knew.
  *   **Inside the room:** She knew "red" via **theoretical concepts** (wavelengths, neural firings).
  *   **Outside the room:** She knows "red" via **phenomenal concepts** (direct experience, recognition).

  She learns a new *way of thinking* about a physical fact, not a new *fact* itself.

  **The Cost of Keeping Step (2) and Rejecting Step (4):**
  *   **Benefit:** You preserve the strong intuition that Mary learns something (Step 2) without having to abandon physicalism (Step 5).
  *   **Cost:** You have to accept that "facts" are more complex than just "states of the world." You must accept that human beings can be in a state of ignorance about a physical truth even while possessing all the data, simply because they lack the right *conceptual framework* to process it.

  ---

  ### Addressing Your Friend's Inconsistency (Rome & Hangovers)

  Your friend's refusal to apply the logic to Rome or hangovers is the key to dismantling her argument. Here is how you can press her on that:

  **1. The Rome Analogy**
  If a man knows every physical fact about Rome (maps, demographics, light reflection off the cobblestones) but has never been there, does he learn a **non-physical fact** when he arrives?
  *   **If she says "Yes":** She is claiming that cities have non-physical properties. This is absurd.
  *   **If she says "No":** Then she must explain why the Color case is different.
  *   **The Explanation:** In the Rome case, it is obvious that he gains a *perspective*, not a new metaphysical fact. He sees the same physical city from a first-person point of view. The "Knowledge Argument" only seems to work for color because color *feels* so internal (qualia). But logically, if physicalism is true, the brain state of "seeing Rome" is just as physical as the brain state of "seeing red." If the Rome traveler doesn't discover non-physical facts, neither does Mary.

  **2. The Hangover Analogy**
  This is even better for a nurse.
  *   **Scenario:** A chemist knows every neurotransmitter involved in a hangover but has never drunk alcohol. She gets drunk. She learns "what a hangover feels like."
  *   **The Trap:** If your friend says this proves non-physical facts about hangovers, she is a **dualist about pain**. That means she believes pain/suffering is not a physical brain state. As a nurse, this is a difficult position to hold medically (how do anesthetics work if pain is non-physical?).
  *   **The Out:** If she agrees the hangover is physical, then the "feeling" of the hangover must be a physical brain state. Therefore, Mary's "feeling" of red is also a physical brain state. Mary just didn't know what that brain state felt like *from the inside* until she triggered it.

  ---

  ### The Alternatives: What if you give up Step (2)?

  You mentioned you'd prefer to keep Step (2), but it is worth knowing the price of giving it up, just in case. This is known as the **"Ability Hypothesis"** (championed by David Lewis and Laurence Nemirow).

  *   **The Claim:** Mary does not learn any new *knowledge-that* (propositional facts). She only learns new *knowledge-how* (abilities).
  *   **What she gains:** She gains the ability to *recognize* red, the ability to *imagine* red, and the ability to *remember* red.
  *   **The Cost:** This feels deeply counter-intuitive. When you see red, it feels like you are discovering a truth about the world, not just acquiring a skill like riding a bike. Most people find it hard to believe that "what it is like to see red" is just a behavioral skill.
  *   **Why you might choose this:** It is the cleanest way to save Physicalism. If you deny she learns a "fact," Step (4) never triggers.

  ### The Alternatives: What if you accept Step (5)?

  This is what your friend is doing. This is **Property Dualism**.

  *   **The Claim:** Physicalism is false. There are physical properties (mass, charge) and phenomenal properties (qualia, feelings).
  *   **The Cost:** This creates a "causal exclusion" problem. If the feeling of red is non-physical, how does it affect your physical brain to make you say "That is red"? If the physical world is causally closed (as science suggests), non-physical facts should be unable to influence our actions.
  *   **The Inconsistency:** As noted above, your friend must now explain why this applies to color but not to hangovers or cities. If she admits it applies to hangovers, she must explain how non-physical pain interacts with physical nerves.

  ### Summary Recommendation

  To answer your friend while keeping your own sanity and Step (2):

  1.  **Validate her:** Tell her she has reconstructed one of the most famous arguments in philosophy of mind. It *is* strong.
  2.  **Point out the inconsistency:** Ask her specifically about the hangover. If the hangover feeling is physical, why isn't the color feeling? If she says color is special, ask her to define the boundary.
  3.  **Reject Step (4):** Argue that Mary gains a **new conceptual perspective** on an old physical fact, not a new non-physical fact.
      *   *Script:* "Mary doesn't learn a new fact about the tomato; she learns a new way to access the facts she already knew. It's like knowing everything about a symphony by reading the sheet music, then finally hearing it played. You don't learn new notes; you learn what those notes sound like. The sound is physical, but your access to it changed."
  4.  **Hold the Line:** You can keep Step (2) (she learns something) without accepting Step (5) (physicalism is false). You just have to admit that "knowing" is more than just data processing; it's also about perspective.

  This preserves the mystery of experience without forcing you to believe in magic non-physical facts.
