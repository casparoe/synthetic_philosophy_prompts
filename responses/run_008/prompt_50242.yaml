      *   *Refinement:* The user suggested "Cascade". In cascade, inner loop is fast, outer is slow. Approval direction isn't necessarily time-scale separated in that way. It's more about *where the objective comes from*.
      *   *Key Distinction:* In control, we assume the setpoint is *valid*. In alignment, the setpoint (objective) is *unsafe if specified incorrectly*.

      *   *Addressing the "Collapse":* If I optimize $\hat{J}_{human}$, am I goal directed? Yes, technically. But the *intent* is different. In control, if my sensor drifts, I track the wrong setpoint. In alignment, if my model of human approval drifts (Goodhart's Law), I do bad things. The distinction is about *robustness to specification error*.

