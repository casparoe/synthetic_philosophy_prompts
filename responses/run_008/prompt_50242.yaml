      *   *Reference Signal:* No, it's not a standard reference. It's a latent variable estimated via sensor fusion (human feedback).
      *   *Collapse:* It *does* collapse mathematically (both are optimizers), but the *source of the objective* differs (fixed vs. dynamic/interactive). This is crucial for safety.

  7.  **Confidence & Uncertainty:**
