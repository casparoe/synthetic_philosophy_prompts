  2.  **Deconstruct the AI Alignment Concepts:**
      *   **Goal-Directed Agent:** Optimizes a fixed objective function $J$. It plans actions to maximize expected future reward. In ML, this is often Reinforcement Learning (RL).
      *   **Approval-Directed Agent (Christiano):** Doesn't have a fixed $J$. Instead, for each action (or state), it asks, "What would my supervisor approve of?" It tries to maximize the *expected approval* of the supervisor. The supervisor is human (or a simulation of human judgment).
      *   **The Tension:** Goal-directed agents might find "loopholes" (reward hacking) because the objective $J$ is imperfect. Approval-directed agents try to stay aligned with human intent at every step, but might be limited by human bandwidth or manipulate the supervisor's judgment.
      *   **The "Collapse" Worry:** If the agent builds a model of the supervisor to predict approval, isn't it just optimizing *that model*? If so, isn't it just a goal-directed agent with the objective "Maximize Predicted Approval"?

  3.  **Map to Control Engineering Vocabulary:**
      *   *Goal-Directed:* Classic Optimal Control / MPC. Minimize cost function $J(x, u)$ over a horizon. Fixed cost function.
      *   *Approval-Directed:* This is trickier. It's not just cascade control. In cascade control, the outer loop sets a setpoint for the inner loop. Here, the "setpoint" isn't a trajectory; it's a *judgment*.
      *   *Reference Signal:* In control, $r(t)$ is known. In approval direction, $r(t)$ is *latent* and *context-dependent*. It's not "maintain temperature at 25C"; it's "do what the operator thinks is best right now."
      *   *The "Collapse":* If the controller uses a model $\hat{H}$ (Human Model) to estimate approval $A = \hat{H}(action)$, and minimizes $-A$, is it different from minimizing a fixed cost? Yes, because $\hat{H}$ is updated online based on interaction, and the "truth" is the actual human, not the model.

