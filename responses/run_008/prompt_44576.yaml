  The theorem assumes honest Bayesian updating. If a partner misreports their posterior, the mathematical guarantee collapses. Consensus cannot troubleshoot dishonesty; this falls outside the scope of epistemological support and into general relationship counseling, which we do not offer.

  **Is there a limit to how many times we have to confirm we know each other's knowledge?**
  Theoretically, no. Practically, yes. Our Free Tier supports mutual knowledge up to four levels of recursion (e.g., "I know that you know"). For true common knowledge (infinite recursion), please upgrade to Consensus Premium.

