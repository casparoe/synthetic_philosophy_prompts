prompt: |-
  ok so I'm in my school's philosophy club and last week our advisor told us about Aumann's agreement theorem and I can't stop thinking about it. the idea is basically: if two people have the same priors, and each one's posterior about something is common knowledge between them (meaning not just that they both know it, but that I know that you know that I know, and so on forever), then the posteriors have to be equal. so two honest Bayesians with the same priors literally cannot agree to disagree. and apparently online rationalist types LOVED this, like people would end arguments by saying "by Aumann you should update toward me" which is funny because the theorem never actually says anything that convenient. the part everyone skips is all the assumptions: you need the same priors (when does THAT happen), you need actual common knowledge (which is way stronger than just hearing each other's opinions), and it assumes nobody is lying. also our advisor mentioned the related result that rational people with common priors shouldn't be able to take the opposite sides of a pure bet, which I think is by Milgrom and Stokey, so I'm going to include a joke about that but don't lean the whole thing on that attribution, I might be remembering it wrong lol

  anyway. I'm also on the staff of our school's satire magazine and I want a piece for next issue. here's what I want you to write:

  a customer-support FAQ page for a fictional app. the app is called "Consensus" (or pick a better name if you have one) and it's basically couples counseling, but instead of a therapist it just applies Aumann's theorem to your relationship. the pitch is "stop arguing, become common knowledge." it should read exactly like a real startup support page — that slightly condescending cheerful tone, section headers formatted as questions, little "still stuck?" boxes, the works. around 650 words.

  the jokes have to come from actually understanding the theorem, not from generic "couples argue" humor. like for example: an entry explaining that simply SAYING your opinion out loud doesn't make it common knowledge, that's the #1 mistake couples make; a "do we need matching priors?" question where the answer is basically "if you didn't have identical priors from the start, the disagreement is technically your fault, please see our pre-registration feature"; a no-betting clause in the terms (nodding at the no-trade thing — two rational partners with common priors shouldn't be able to take opposite sides of a bet, so all bets in the app are void); a question like "can we still disagree about anything?" answered with "only with a signed statement that your priors were never the same, which is more depressing than it sounds"; something about what happens if one partner is dishonest about their posteriors (a: then no theorem applies and you have bigger problems than epistemology); and at least one testimonial from a couple who has been stuck in the "I know that you know that I know" loop since like 2019 because they can never reach the top of the tower. also maybe a pricing tier joke where the premium plan is called "common knowledge" and the free tier is just "knowledge."

  some rules: stay deadpan the entire time, never wink at the reader or be like "get it??"; the satire should be fair — the app's advice should be things that technically follow from the theorem, exaggerated just enough. a decision theorist reading it should laugh, not wince, and honestly should not be 100% sure whether the startup is fake.

  before you write, do some actual thinking: first brainstorm which assumptions of the theorem would realistically fail between two married people (differing priors, no common knowledge, dishonesty, computation costs, the infinite tower of "I know that you know...") and build at least one joke out of each failure mode, THEN write the piece. don't invent fake citations or quote real papers or textbooks, since neither of us can check them. no bibliography either, this is satire not a term paper. and dont make fun of any real person, the app's "founders" can be invented.

  sorry this is long, one last thing: keep it around 650 words for the FAQ itself (the brainstorming doesn't count toward that). ty!!
