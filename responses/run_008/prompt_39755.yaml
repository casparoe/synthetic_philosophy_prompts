prompt: |-
  I'm a software engineer with no formal philosophy background, and I've somehow agreed to lead the next meeting of the reading group I belong to — mostly other working professionals, no philosophers among them — on Wittgenstein's On Certainty, specifically the cluster of ideas people call hinge epistemology. We have ninety minutes, a whiteboard if needed, and a group that has read the book unevenly: some finished it, some skimmed, some only read a summary. What I keep snagging on when I try to plan this myself is that the idea seems to be neither that we know a lot of basic things nor that we assume a lot of basic things, but something about how certain certainties don't function as knowledge-claims at all and can't be straightforwardly doubted, because doubt itself only makes sense against a background that isn't in doubt. I can't tell how much of that I actually understand versus am just repeating.

  So I'm not asking you to explain hinge epistemology to me. I want a plan for the session: the order the pieces should come in and why — in particular, what has to be established before I can even pose the hinge idea, so it lands as something worth thinking rather than as a truism; the one example or scenario the whole session should be built around, and what that example must have and must lack; the misconceptions the group will predictably form or bring (I'm guessing at least that hinges are just assumptions we could revise at will if we tried, that this is cultural relativism in disguise, and that Wittgenstein is somehow saying we can't know anything) and the exact point in the sequence where each should be headed off; and one question I can ask at the end that would distinguish people who've actually got the idea from people who've just found it agreeable. Please also tell me what I should openly decline to get into at this level — I assume the rule-following material and anything requiring real familiarity with the Philosophical Investigations — and flag any point where you'd rather I present something as contested among Wittgenstein scholars than as settled, since I'd rather say that plainly than pass off one reading as the reading.

  One constraint from the group's culture: they distrust anything that smells like a lecture, so the plan should be built around the carrying example and the discussion it provokes, not around me delivering content. If it helps for the plan, my own route into the book was a stray remark that the interesting question isn't how we know the external world exists, but what we'd even be doing if we tried to doubt it in the course of ordinary life — that struck me, as someone who spends all day reasoning from explicit premises, as genuinely strange, and I'd like the session to reproduce that strangeness in the group rather than resolve it into comfort.
