answer: |-
  You should reject step (3). It looked plausible because it assumes moral equivalence based on identical outcomes: if the hearer's mind is corrupted either way, the speaker's culpability seems equal. This intuition treats language as merely a tool for information transfer, where failing to fix errors is as damaging as creating them.

  However, for Augustine, the moral weight lies not solely in the hearer's state but in the speaker's use of signs. Lying is a positive act of signifying against what one holds in the mind (*enuntiatio contra mentem*). Silence is an omission. While both may leave the neighbor in error, only lying actively perverts the divine institution of language, turning a sign meant for communion into a vehicle of falsehood. Augustine distinguishes between killing the truth (lying) and merely not birthing it (silence). Therefore, the "way" and "degree" of wrongness differ fundamentally: one is a sin of commission against God's order of signs; the other may be a sin of omission regarding neighborly charity, or no sin at all if prudence dictates silence.

  By rejecting (3), Augustine loses the clean symmetry of a purely outcome-based ethics, where any cause of false belief is equally culpable. He cannot claim that all deception is identical regardless of method. However, he gains a viable ethics of speech. If (3) held, social life would be impossible, demanding exhaustive correction of every error. By distinguishing active signification from passive silence, Augustine preserves the absolute prohibition on lying without imposing an impossible obligation of total transparency.

  Crucially, this move confirms that the wrong is located in the speaker's heart, not the hearer's belief. By locating the wrong here, Augustine loses the ability to condemn lying solely based on worldly harm, making the sin theological rather than social. He disconnects the sin's gravity from its consequences. But he gains an absolute standard immune to consequentialist exceptions. The cost is a more complex account of responsibility that separates internal integrity from external cleanup; the gain is a doctrine humans can actually survive without collapsing into either universal deceit or exhausting correction.
