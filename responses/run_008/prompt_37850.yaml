answer: |-
  Causation is the currency of news. Every day, headlines declare that a policy caused growth, a chemical caused cancer, or a habit caused longevity. Yet beneath this confident reporting lies a quiet schism in how causation itself is understood. It is a divide between philosophers, who follow the lead of David Lewis, and statisticians, who follow Judea Pearl. Oddly, the two camps rarely acknowledge each other, yet they offer fundamentally different maps of reality.

  For the Lewisian philosopher, causation is a matter of counterfactual dependence between particular events. To say the throw caused the shattering is to say that if the throw had not occurred, the shattering would not have occurred. But how do we judge such a claim? We cannot rewind time. Instead, Lewis proposed we look to "possible worlds". We imagine a world exactly like ours except for the absence of the throw. If the glass remains intact in that nearest possible world, causation holds. The machinery here is a similarity ordering: we prefer worlds that deviate from ours through a small, local miracle—a tiny violation of physical law to prevent the throw—rather than vast rearrangements of history. It is an elegant metaphysics of what might have been.

  For the Pearlian statistician, causation is about information flow within a system. Here, the world is represented by causal graphs: nodes representing variables connected by arrows representing direct influences. These arrows are governed by structural equations. To test causation, one does not imagine alternative histories but performs a surgical intervention. This is captured by the `do`-operator. To ask if the throw causes the shattering is to ask what happens to the glass when we set the variable "throw" to "yes" by force, cutting any arrows pointing into it from prior causes. It is an engineering approach to inference, focused on prediction and control rather than metaphysical dependence.

  These frameworks often agree, but their verdicts diverge in revealing ways. The Lewisian account famously stumbles on preemption. Suppose Suzy and Billy both throw stones at a bottle. Suzy's stone arrives first and shatters it; Billy's would have done so had Suzy missed. In the nearest world where Suzy does not throw, Billy's stone still breaks the glass. Thus, the shattering does not counterfactually depend on Suzy's throw, yet intuitively, she caused it. Lewis spent years refining his theory to accommodate such cases, admitting that simple dependence is insufficient.

  The interventionist account faces its own embarrassments, particularly when interventions are not free, exogenous acts. Consider a doctor prescribing medicine. In a causal graph, we might intervene to set "prescription" to "yes". But if the doctor's decision is entangled with the patient's severity—prescribing only to the sickest—then simply observing the prescription carries evidence about the prognosis. If the model fails to account for this selection bias, the `do`-operator yields misleading results. Pearl's framework demands we know the graph structure perfectly; if the arrows are drawn based on corrupted data, the surgery fails.

  This raises a contentious claim heard in both camps: that Pearl's graph surgery is merely Lewis's nearest-world analysis in disguise. An intervention, after all, looks like a stipulated minor miracle—a break in the normal laws to set a variable. The resemblance is deep, but superficial enough to mask a crucial mismatch. Lewis's orientation is towards particular events: did this specific throw cause this specific shattering? Pearl's orientation is towards populations and variables: does smoking cause cancer in this cohort?

  This distinction matters for Simpson's paradox, where a treatment appears to help in every subpopulation yet harms in the aggregate. For the interventionist, this is trivially stated as the difference between conditioning (seeing) and doing (intervening). Conditioning on a subpopulation opens backdoor paths that distort the effect; doing closes them. The graph makes this visible. The Lewisian, focused on particular event counterfactuals, struggles to express these population-level facts without cumbersome aggregation. While one can repair the gap by probabilising counterfactuals, the mismatch is principled. Lewis gives us a logic of events; Pearl gives us a calculus of variables. The former explains why the glass broke; the latter explains how to stop it breaking in the future.

  So, which framework should a newspaper adopt when reporting that a study has established a cause? The honest answer depends entirely on whether the study was an experiment or merely observational.

  If the study was a randomised controlled trial, the researchers have effectively performed Pearl's surgery in the real world. They physically severed the link between patient characteristics and treatment assignment. Here, the interventionist framework validates the headline. The `do`-operator corresponds to the randomisation protocol.

  If the study was observational, however, the Lewisian caution is warranted. Without physical intervention, we are left with counterfactuals that must be inferred from data alone. Here, journalists should be wary of claims that rely solely on statistical association. An observational study might show that taking medicine is linked to death, but without the graph structure to identify confounders, we cannot know if the medicine caused the death or if the sickness caused both.

  Ultimately, the broadsheet should adopt Pearl's vocabulary to interrogate the claim, but Lewis's scepticism to evaluate the evidence. When a press release says "X causes Y", ask: did they intervene, or did they merely observe? If they observed, ask what arrows they assume connect the variables. The philosophers teach us how fragile counterfactual truths can be; the statisticians teach us how to map the structure required to sustain them. In an age of data, we need both the metaphysics of dependence and the machinery of intervention. To report on causes without distinguishing between them is not just bad science; it is bad storytelling.
