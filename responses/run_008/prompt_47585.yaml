          2.  Analyze the relationship between "one thought too many" and the "integrity objection" (compressed version or distinct?).
          3.  Evaluate which reading survives scrutiny and identify where an impartialist defender would dig in.

  2.  **Deconstruct the "One Thought Too Many" Passage:**
      *   *The Scenario:* A man can save his wife or a stranger, not both. He saves his wife.
      *   *The Challenge:* An impartial moral theory (like Utilitarianism or Kantianism) might ask for a justification. Why her and not the stranger?
      *   *The Proposed Justification:* "Because she is my wife."
      *   *Williams's Critique:* If the agent thinks, "I am permitted to save her *because* she is my wife and moral theory allows special obligations," that is "one thought too many."
      *   *The Right Motivation:* He saves her because he loves her/wants her to live. The thought "she is my wife" should figure in his motivation as a direct concern, not as a *justificatory premise* derived from a general moral system.
      *   *The Target:* It's not deliberation *per se* (time is short, but that's secondary). It's the *structure* of the justification. It's about the *source* of the reason. Is the reason internal to the relationship, or external (validated by the moral theory)?

  3.  **Address Question 1: Unpacking the Passage & Target:**
      *   Need to clarify that Williams isn't saying justification is impossible. He's saying the *form* of the justification matters.
      *   The "thought" is the appeal to a general moral principle to validate a personal project.
      *   The target is "Morality" (the peculiar institution, as he calls it in *Ethics and the Limits of Philosophy*, though the seed is here) which demands impartial justification for partial actions.
      *   Distinction: *Motivating reason* (I love her) vs. *Justifying reason* (Morality permits me to prioritize her). Williams thinks the latter corrupts the former if it becomes the operative thought.

  4.  **Address Question 2: Relation to the Integrity Objection:**
      *   *Integrity Objection (Jim and the Indians):* Utilitarianism requires the agent to abandon their deepest projects/commitments if the calculus demands it. It alienates the agent from their actions.
      *   *One Thought Too Many:* Impartial morality requires the agent to view their deepest commitments through the lens of impartial justification. It alienates the agent from their motivations.
      *   *Connection:* Both are about the *overreach* of impartial moral theory into the personal standpoint. Both defend the "ground projects" that make life worth living.
      *   *Nuance:* Integrity is about *what* you do (being forced to kill); One Thought is about *why* you do it (being forced to justify love via theory). They are complementary attacks on the same target (the priority of the impartial standpoint).
      *   *Justification Status:* Williams isn't saying saving the wife is *unjustified*. He's saying it doesn't need *that kind* of justification. It is justified from within the personal standpoint, which morality shouldn't override.

  5.  **Address Question 3: Evaluation & Impartialist Defense:**
      *   *Which reading survives?* The structural/normative reading, not the crude psychological one. Williams is critiquing the *authority* of moral theory, not the speed of thought.
      *   *Impartialist Defense:* Where do they dig in?
          *   *Two-level Utilitarianism (Rule Utilitarianism):* Hare. We cultivate dispositions (save your wife) because that maximizes utility generally. The thought "maximize utility" doesn't need to occur at the moment.
          *   *Hybrid Theories:* Scanlon or others who argue partiality *is* impartially justified. "It is impartially true that we ought to be partial to our loved ones."
          *   *The Counter:* Williams would say this still makes the relationship contingent on the theory. If the theory changed, the obligation would. The love should be the ground, not the theory.
      *   *Critique of the Defense:* The defense often concedes the phenomenological point but keeps the normative hierarchy. Williams wants to topple the hierarchy.

  6.  **Drafting the Response (Iterative refinement):**
