      *   **Context:** Preparing for a seminar on impartiality and the limits of moral theory.
      *   **Text:** Bernard Williams, "Persons, Character, and Morality" (in *Moral Luck*). Specifically, the ending discussion of the "wife rescue" case (borrowed from Charles Fried).
