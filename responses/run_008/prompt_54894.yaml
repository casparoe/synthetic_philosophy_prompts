  *   **Quote:** "You're not stopping the train; you're just another track switch the train laid down five seconds ago."

  **Case B: Slow Deliberation (Spreadsheets & Months)**
  *   **Verdict:** **No Free Will.**
  *   **Elena's Reasoning:** This is the compatibilist's favorite shield, but Elena sees through it. To a neuroscientist, "deliberation" is just recursive neural computation. Your weights and biases (genetics, past experiences, current hunger levels) process the spreadsheet data. The conscious feeling of "weighing options" is the read-out of that computation, not the computation itself. The outcome is determined by the initial state of your brain + the data inputs.
  *   **Quote:** "Just because the calculation takes three months doesn't mean *you're* doing the math. Your brain is. You're just watching the screen."

  **Case C: Injected Noise (Unpredictable Impulse)**
  *   **Verdict:** **No Free Will.**
  *   **Elena's Reasoning:** She already sank this ship in Verdict 4 (The Geiger Counter). If the outcome is unpredictable because of noise, it's random. If it's random, it's not *yours*. Agency requires control, and noise is the absence of control.
  *   **Quote:** "Rolling dice isn't freedom, it's chaos. Being a slot machine doesn't make you a author."

