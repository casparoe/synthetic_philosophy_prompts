answer: |-
  Your flatmate was drunk, but on this specific point, **your flatmate was right.**

  Your package as stated is **inconsistent**. You cannot hold (1) and (2) simultaneously without running straight into **David Lewis's Triviality Result (1976)**.

  Here is the specific breakdown of where the tension lies, why your intuition that (2) and (3) are "the same view" is misleading, and what you have to give up to save the rest.

  ### 1. The Diagnosis: Lewis's Triviality Result

  The core conflict is between **(1) Propositionalism** and **(2) Adams' Thesis**.

  *   **(1)** says conditionals express propositions (they have truth conditions and belong in the probability algebra).
  *   **(2)** says the probability of that proposition is the conditional probability: $P(\text{If } A, B) = P(B|A)$.

  Lewis proved that if you assume both (1) and (2) hold for a standard probability space (one closed under conditionalization, which you imply in (1) when you say you can "conditionalise on a conditional"), then **all conditional probabilities collapse into unconditional probabilities.**

  Mathematically, it implies that for any $A$ and $B$, $P(B|A) = P(B)$. This means learning $A$ gives you no information about $B$. Since this is obviously false (e.g., learning "the match is moved" *does* change the probability of "I will come"), the assumptions leading to it must be false.

  **Why (2) and (3) are not the same:**
  You wrote: *"(2) and (3) look like basically the same view to me."*
  This is the source of the error.
  *   **(3)** is a mathematical fact about probability spaces. $P(B|A)$ exists regardless of language.
  *   **(2)** is a semantic claim linking a *sentence* ("If A then B") to that mathematical fact.
  Lewis's result shows that while (3) is true, you cannot map the *sentence* "If A then B" to a proposition whose probability is (3) without breaking the math.

  ### 2. Which Claims are in Tension?

  *   **(1) & (2):** **Directly Inconsistent.** (This is Lewis's result).
  *   **(1) & (4):** **Consistent.** You can be a propositionalist without accepting the material conditional (e.g., Stalnaker or Kratzer semantics).
  *   **(2) & (4):** **Consistent.** This is the standard Adams/Edgington view. They reject the material conditional *and* reject propositions to save Adams' Thesis.
  *   **(3):** **Safe.** This is just probability theory. Keep this.

  ### 3. How to Fix It: The Three Paths

  To make your position consistent for the reading group, you must modify either (1) or (2). Here are the costs and benefits of each.

  #### Option A: Give up strict Propositionalism (Modify 1)
  *   **The View:** **Non-Propositionalism / Suppositionalism** (Adams, Edgington, Bennett).
  *   **The Move:** You keep (2) and (4). You deny that indicatives express genuine propositions with truth conditions. Instead, "If A, B" is an assertion of $B$ under the supposition of $A$. It is "assertible" but not strictly "true."
  *   **The Cost:** You have to explain away **embedding**.
      *   You mentioned: *"nested stuff like 'if (if the match is moved I'll come), then book two tickets' is perfectly meaningful."*
      *   Non-propositionalists struggle here. If "If A, B" isn't a proposition, it can't logically serve as the antecedent for another conditional. You have to argue that these embeddings are either elliptical, pragmatic, or governed by different logical rules (e.g., McGee's 1989 counterexamples to Modus Ponens).
  *   **Verdict:** This is the **cheapest** move if your primary commitment is to **(2)** (Adams' Thesis). Since you called (2) the "single most data-driven insight," this is the natural home for your view. You just have to bite the bullet on embedding.

  #### Option B: Keep Propositionalism, Weaken Adams' Thesis (Modify 2)
  *   **The View:** **Possible Worlds Semantics** (Stalnaker, Kratzer).
  *   **The Move:** You keep (1) and (4). You say conditionals *do* express propositions (sets of possible worlds). However, you deny that $P(\text{If } A, B)$ *always* equals $P(B|A)$.
      *   Stalnaker argues they are *close*, but not identical.
      *   Kratzer argues the "if"-clause isn't part of the consequent's proposition but restricts the modal operator.
  *   **The Cost:** You lose the elegant identity of **(2)**. You have to explain why people's bets track $P(B|A)$ so well if that isn't the actual probability of the sentence. (Usually, the explanation is pragmatic: we assert the conditional when the conditional probability is high).
  *   **Verdict:** This is the **cheapest** move if your primary commitment is to **(1)** (Embedding/Propositions). If you need conditionals to behave like normal sentences in logic puzzles, you must take this route.

  #### Option C: The "Third Way" (Conditional Events)
  *   **The View:** **Tri-valued Logic / Conditional Events** (De Finetti, Bradley).
  *   **The Move:** You keep (1) and (2) by changing the logic. You argue that conditionals *are* propositions, but they don't live in a standard Boolean algebra. They are "conditional events" that can be True, False, or Void (when the antecedent is false).
  *   **The Cost:** You leave standard classical logic. Probability theory needs to be adjusted to handle "void" values. This is technically demanding and less standard in mainstream philosophy of language reading groups.
  *   **Verdict:** High risk for a reading group presentation unless you are prepared to defend non-Boolean probability spaces.

  ### 4. Recommendation for Your Write-Up

  Since you explicitly stated that **(2)** is your strongest conviction ("single most data-driven insight") and you explicitly rejected **(4)** (Material Conditional), you are philosophically positioned as an **Adams-style Expressivist**.

  However, your commitment to **(1)** (specifically embedding) is pulling you toward Stalnaker.

  **The Consistent Package:**
  To present a consistent view, I recommend you **qualify (1)**.

  > **Revised (1):** Indicative conditionals do not express standard truth-apt propositions in the Boolean sense, *but* they function in reasoning *as if* they do, except in complex embeddings where their logic diverges.

  **Why this is the cheapest cost:**
  1.  **It saves (2):** You keep the link to conditional probability, which you value most.
  2.  **It saves (4):** You still reject the material conditional.
  3.  **It addresses the Flatmate:** You acknowledge Lewis's result. You can say: "Lewis showed we can't have both Propositions and Adams' Thesis. I choose Adams' Thesis."
  4.  **It handles the Embedding worry:** You admit that nested conditionals are the "stress test" for the view. You can cite **Vann McGee (1989)** to show that even if we accept nesting, Modus Ponens might fail for nested conditionals, which supports the idea that they aren't standard propositions.

  **Summary of the fix:**
  Don't claim they are "genuine propositions" in the classical sense. Claim they are **probabilistic assertions** that *simulate* propositions in simple contexts but reveal their non-propositional nature in complex embeddings. This dissolves the Lewis triviality result while keeping your core insights intact.

  **One final tip for the reading group:**
  Be prepared for the question: "If 'If A then B' isn't true or false, what are you doing when you say 'That's true' in response to someone else's conditional?"
  *   *Answer:* You are agreeing with the *appropriateness of the supposition*, not the truth of a fact. (Edgington's line).

  Good luck. Your flatmate was annoying, but on Lewis, they were correct.
