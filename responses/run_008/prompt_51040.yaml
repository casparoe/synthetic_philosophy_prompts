      *   *Refinement:* The best missing move is about **Moral Patienthood and Interests**. Suffering matters because it harms a subject. Do fundamental entities have "interests" that can be harmed? If an electron's "pain" lasts $10^{-40}$ seconds and has no memory or anticipation, is it morally relevant? This bridges the metaphysics and the ethics.

