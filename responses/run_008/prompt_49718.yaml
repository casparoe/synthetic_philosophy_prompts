          *   Status: NN. Without this, we can't separate alignment research from capability research.

      *   *Requirement 2: Intent vs. Coincidence.* (Defer vs. Agree).
          *   Consideration: If I want X and the model does X because it wants Y (which implies X), it's not aligned. It needs to track the *source* of the goal.
          *   Status: NN. Otherwise, deceptive alignment looks like success.

      *   *Requirement 3: Engineering vs. Alignment.* (Bias/Glitch vs. Misalignment).
