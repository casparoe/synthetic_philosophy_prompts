          4.  Take a position on serving an operator with bad ends (is that alignment?).
          5.  Take a position on moral theories (neutral or stand).
          6.  Address checkability (is "aligned" empirically verifiable in principle?).
          7.  Settle the near-term (sycophancy) vs. long-term (optimizer drift) unity question.
          8.  For each requirement: Provide the case/consideration, mark as Non-Negotiable (NN) or Camp Preference (CP), and flag incompatibilities.
          9.  Closing: Evaluate main framings (value learning, corrigibility, instruction-following, general reliability) against this list.

  2.  **Deconstruct the Purpose:**
      *   The purpose is *instrumental*: "lets us judge whether a given research agenda counts as progress."
      *   This implies the characterization must be *action-guiding* for researchers. It can't be purely metaphysical; it needs to map to research trajectories.
