  **MEMORANDUM**

  **TO:** Board of Trustees, Regional Heritage Museum
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Terminology for the Permanent Gallery on the 1890s Famine

  **1. Purpose**
  This memo provides a recommendation regarding the terminology for the central panel of the upcoming permanent gallery on the famine following the colonial pacification campaigns of the 1890s. As we approach the final decision, it is clear that our deadlock stems not from a disagreement over facts, but from a divergence on the function of museum language. We must decide whether our labels serve as legal verdicts, historical classifications, or acts of moral recognition.

  **2. The Lemkinian Framework**
  Several trustees have rightly pointed to the history of the term "genocide." To engage this seriously, we must distinguish between Raphael Lemkin's original conception and the subsequent legal instrument.

  When Lemkin coined the term in *Axis Rule in Occupied Europe* (1944), he defined it as a "coordinated plan of different actions aiming at the destruction of essential foundations of the life of national groups." His focus was sociological and structural. He explicitly included the erosion of economic life, cultural institutions, and physical security. The confiscation of cattle, the burning of grain stores, and the restriction of movement described in our advisory historians' report fit Lemkin's 1944 criteria precisely: they were methods to destroy the group's capacity to exist as a distinct entity.

  The 1948 UN Convention narrowed this definition significantly, prioritizing "intent to destroy" in a physical or biological sense and excluding political groups. The government heritage body's objection rests on the 1948 legal standard, arguing that without a court adjudication of specific intent, we cannot use the term. However, a museum is not a court of law. Our mandate is historical interpretation and public education, not criminal prosecution. By restricting ourselves to the 1948 Convention's narrow legal thresholds, we risk adopting a legalistic framework that Lemkin himself might have found insufficient for describing the structural destruction of a people.

  **3. The Act of Naming**
  As noted in our last session, we are treating this as a search for a historically correct label when it is truly a decision about what kind of act of naming a museum performs. A museum label is constitutive; it shapes public memory. To refuse the term "genocide" where the facts align with Lemkin's broader conception is to perform an act of sanitization. To use it without context is to perform an act of prosecution.

  We must find a path that honors the descendant community's lived history and the historical record without rendering the museum vulnerable to charges of partisanship that could jeopardize our operational viability.

  **4. Recommendation**
  I recommend the Board adopt the following approach for the Central Panel:

  *   **Primary Heading:** *"The Great Clearing: Genocide and Colonial Pacification"*
  *   **Introductory Text:** The text must explicitly state that while no international tribunal has adjudicated this episode, the methods employed (economic destruction, movement restriction, induced starvation) align with Raphael Lemkin's original definition of genocide. It should acknowledge that the term remains contested by government authorities who adhere to the stricter 1948 Convention standards.
  *   **Exhibiting the Controversy:** We must include a dedicated subsection within the gallery titled *"Naming the Event."* This section will display the correspondence regarding the terminology debate (redacted as necessary), the descendant community's position, and the government heritage body's stance. This transforms the controversy from a backend administrative hurdle into a frontend educational opportunity, demonstrating to visitors how history is interpreted and contested in the present day.

  **5. Rationale**
  This recommendation achieves three critical objectives:
  1.  **Historical Integrity:** It utilizes "genocide" in its accurate historical and sociological sense (per Lemkin 1944) rather than submitting to a legalistic veto that does not apply to historical institutions.
  2.  **Community Trust:** It validates the descendant community's insistence on the term, acknowledging their oral history and moral claim, which is essential for the museum's social license to operate.
  3.  **Institutional Resilience:** By pairing the term with "The Great Clearing" (the local historical name) and explicitly exhibiting the controversy, we demonstrate curatorial neutrality regarding the *debate* while maintaining curatorial conviction regarding the *facts*. We are not hiding the disagreement; we are curating it.

  **6. Addressing the Strongest Counter-Argument**
  The strongest argument against this recommendation comes from our fiduciary responsibility regarding the government heritage body's co-funding. They have indicated that using the term "genocide" may be viewed as exceeding our authority, potentially triggering a funding withdrawal. This is a material risk.

  However, yielding to this pressure sets a dangerous precedent. If we allow a funding partner to dictate historical terminology based on legal technicalities that contradict the sociological reality of the events, we compromise the museum's independence permanently. Furthermore, removing the term does not guarantee funding security; it merely delays the conflict while alienating the community whose support we equally need.

  To mitigate this risk, I propose the Board authorize the Director to invite the government heritage body to review the *full* interpretive text, not just the heading. We can demonstrate that our use of the term is qualified, educational, and grounded in established historical scholarship (specifically Lemkin's early work), rather than a political accusation. We must be prepared to argue that a museum's role is to confront difficult history, not to obscure it behind euphemisms like "man-made famine," which describe the mechanism but hide the agency.

  **7. Conclusion**
  We have the facts. We have the local name. We have the framework. The only variable is our courage to apply the vocabulary that the history demands. I urge the Board to approve the heading *"The Great Clearing: Genocide and Colonial Pacification"* and to treat the naming controversy as an integral part of the gallery's narrative. This honors the dead, respects the living descendants, and fulfills our duty to the truth.

  I look forward to discussing this at next month's meeting.
