          *   (4) says objects have intrinsic natures (unknowable).
          *   (5) says objects might *be* structural (no intrinsic natures).
          *   *Severity:* Low/Medium. The user admits (5) is a "temptation," not a committed claim. It's an internal conflict of intuition, not a logical contradiction in the stated position.
          *   *Fix:* Acknowledge it as an open question or lean into "Moderate OSR."

      *   **Tension B: (3) vs. (6) [Structure vs. Objects]**
          *   (3) says NMA supports truth *at the level of structure*.
          *   (6) says NMA supports belief in the Higgs as a *real object* (implying more than just structure).
          *   *Severity:* **High.** This is the core philosophical inconsistency. If the solution to PI is to retreat to structure because ontological commitments change (ether -> no ether), then asserting belief in the Higgs *as an object* (with intrinsic nature?) seems to invite the PI right back in. What guarantees the Higgs won't be eliminated like the ether?
