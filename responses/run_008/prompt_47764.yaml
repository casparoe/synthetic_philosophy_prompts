  7.  **Final Polish:** Check the clarity of the distinction between Duhem-Quine (holism) and Underdetermination (multiple theories). They are related but distinct. Maya conflates them slightly, which is common. I will clarify this in the analysis.

      *   *Move 1:* Right (pragmatically).
