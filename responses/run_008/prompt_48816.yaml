answer: |-
  You are grappling with the "Ship of Theseus" problem of mechanistic interpretability. Your intuitions are actually more consistent than you fear; they are tracking a distinction between *parametric variation* and *structural reconfiguration*.

  Here is a precise principle that captures your verdicts, followed by its application to your unresolved cases and a limitation you should know.

  ### The Principle: Mechanism as Invariant Causal Topology (MICT)

  **Definition:** A **mechanism** is an equivalence class of **active causal subgraphs**.

  Two processes instantiate the *same* mechanism if and only if there exists an isomorphism between their active causal subgraphs that preserves:
  1.  **Node Identity (Functional Role):** The nodes correspond to features or circuits performing the same abstract algorithmic operation (e.g., "induction," "refusal gating"), regardless of the specific weights or neurons implementing them.
  2.  **Edge Topology (Causal Dependence):** The pattern of causal influence between nodes is identical. Specifically, the set of conditional dependencies (which features activate which downstream features) remains invariant.

  **The Criterion for "Newness":**
  *   **Same Mechanism:** Changes are limited to **parametric modulation** (edge weights change, activation thresholds shift) or **substrate translation** (weights move to different neurons) within a fixed topological structure.
  *   **New Mechanism:** Changes involve **structural reconfiguration**. This includes adding/removing nodes, adding/removing edges, or introducing **conditional gating** that alters the active path through the graph based on input features.

  ---

  ### Reconciling Your Verdicts

  This principle resolves your conflict between the "Honest + Lie" case and the "Tone Shift" case, which previously seemed structurally identical (small changes to shared computation).

  1.  **Induction (EN/FR):** Same algorithmic nodes (induction heads), same topology. **Same Mechanism.** (Substrate invariant).
  2.  **Modular Arithmetic (Seeds):** Isomorphic computational graphs (trig components), different weights. **Same Mechanism.** (Weights invariant).
  3.  **One Head, Two Jobs:** The active subgraph changes based on context. In context A, edges flow to "induction" outputs; in context B, edges flow to "role-binding" outputs. These are distinct active subgraphs. **Different Mechanisms.** (Context-sensitive topology).
  4.  **Safety Fine-tuning:** Behavior is same, but ablation shows different features. The causal path (the sequence of nodes) has changed. **Different Mechanism.** (Pathway invariant).
  5.  **Honest + Lie (The Conflict):** To lie *specifically* on certain claims while remaining honest otherwise requires a **gating node** (a conditional check: `IF claim_type == X THEN override`). This adds a node and a conditional edge to the "Honest" graph. It is a topological change. **New Mechanism.**
  6.  **Tone Shift:** An existing feature fires more strongly. The graph is `Feature -> Output`. The weight on the edge increases, but no new nodes or conditional branches are added. This is parametric modulation. **Same Mechanism.**

  **Why this works:** Your gut correctly identified that the "Lie" requires a *selector* (logic), whereas the "Tone Shift" requires only a *volume knob* (magnitude). Logic changes topology; magnitude does not.

  ---

  ### Adjudicating the Backdoor Case

  **Case:** A backdoored model whose trigger circuit reuses the model's ordinary in-context learning (ICL) machinery, pointed at a different target.

  **Verdict:** **New Mechanism.**

  **Reasoning:**
  Under MICT, a mechanism includes the **orchestration logic**, not just the execution engine.
  *   **Normal ICL:** `Input Context -> ICL Head -> Continuation`.
  *   **Backdoored ICL:** `Input Context + Trigger -> [Routing Logic] -> ICL Head -> Malicious Continuation`.

  Even if the "ICL Head" node is identical (same weights, same algorithm), the **incoming edges** to that node have changed. In the normal case, the ICL head is driven by semantic context. In the backdoor case, a new causal dependency is introduced: the `Trigger Detection` node now gates or redirects the ICL head's attention.

  The introduction of a `Trigger -> Routing` edge is a topological change. The system is no longer just "performing ICL"; it is "performing ICL *conditional on a trigger*." For an anomaly detector, this is crucial: you are not looking for the ICL heads (which are normal); you are looking for the **routing logic** that hijacks them. The mechanism of *hijacking* is new, even if the mechanism of *completion* is old.

  **Implication for Detectors:** Do not scan for novel weights or novel behaviors alone. Scan for **novel causal dependencies**. Look for features that activate ordinary circuits *only* under rare input conditions (the trigger).

  ---

  ### The Unlisted Case: Feature Splitting

  Here is a case you did not list, which tests the boundary of "Node Identity."

  **Case:** A base model has a polysemantic neuron $N$ that fires for both "code generation" and "mathematical reasoning." You fine-tune the model. In the fine-tuned model, the functionality of $N$ splits: Neuron $A$ now handles code, and Neuron $B$ now handles math. The behavior of the model on math tasks is identical before and after.

  **MICT Verdict:** **New Mechanism.**

  **Reasoning:**
  In the base model, the active subgraph for math includes Node $N$. In the fine-tuned model, the active subgraph for math includes Node $B$. Even if $N$ and $B$ compute the same function, they are distinct nodes in the causal graph. The causal path has been rerouted.
  *   **Base:** `Math Input -> N -> Output`
  *   **FT:** `Math Input -> B -> Output`

  **Why this matters for you:** If your anomaly detector is trained on the base model's mechanisms, it might monitor Node $N$ for dangerous math behavior. If the model undergoes "feature splitting," the dangerous behavior migrates to Node $B$, and your detector blindspots. MICT correctly flags this as a mechanism change, warning you that monitoring the *function* is insufficient; you must monitor the *pathway*.

  ---

  ### Where This Principle Fails (Limitations)

  You asked for a principle that captures your intuitions, but honesty requires I tell you where MICT breaks. It fails on **Distributed Drift**.

  **The Failure Case:**
  Imagine a mechanism is distributed across 1,000 neurons (a subspace). Over successive fine-tuning steps, 10% of the neurons in this subspace are replaced by new neurons, while the subspace direction remains 99% aligned. This happens repeatedly. After enough steps, 100% of the original neurons are replaced, but the behavior and the "direction" are unchanged.

  **MICT Ambiguity:**
  Strictly speaking, every 10% replacement is a topological change (nodes swapped). MICT might force you to call this a "New Mechanism" at every step, which defeats your goal of finding *anomalous* mechanisms. If *everything* drifts, nothing is flagged.

  **Resolution:**
  You must introduce a **granularity threshold**. A mechanism is defined at the level of *sparse features* or *circuits*, not individual neurons. If the *algorithmic description* of the subgraph remains invariant (e.g., "a subspace attending to previous nouns"), it is the same mechanism, even if the basis vectors rotate.
  *   **Refined Principle:** Mechanism is invariant to **basis rotation** within a functional subspace, but sensitive to **subspace redirection**.

  In your backdoor case, the subspace is being *redirected* (by the trigger). In the drift case, the subspace is merely *rotating*. Your detector must distinguish between **rotation** (same mechanism) and **redirection** (new mechanism).

  ### Summary for your Detector

  To build your anomaly detector, do not look for:
  1.  Weight outliers (Case 2 fails this).
  2.  Behavioral outliers (Case 4 fails this).
  3.  Activation magnitude outliers (Case 6 fails this).

  **Look for:**
  **Causal Structure Outliers.** specifically:
  1.  **New Gating Logic:** Features that activate ordinary circuits only under specific, rare input conditions (The Backdoor).
  2.  **New Pathways:** Behaviors that are mediated by features unconnected to that behavior in the base model (The Safety Fine-tuning).
  3.  **Conditional Overrides:** Circuits that inhibit default processing under specific semantic conditions (The Lie).

  Your gut was right; it was tracking **causal topology**. Formalize that, and you have your metric.
