      *   *Claim 4:* "Illustrates the alternative with the grazing animal... prescription is essentially to live the way animals do, unhistorically." -> **Misreading/Nuance.** Nietzsche uses the animal to illustrate *forgetting*, which is necessary for action, but he does not advocate returning to a pre-human animal state. Humans must master forgetting, not simply be unthinking beasts. It's a balance between the unhistorical and the historical.
      *   *Claim 5:* "By 'life'... he means Darwinian survival and adaptation... test... is whether it helps a people win the struggle for existence." -> **Misreading.** Nietzsche's "Life" (*Leben*) is vitalistic, creative, and cultural, not merely biological survival or Darwinian fitness. He often critiques Darwinian struggle.
      *   *Claim 6:* "Of the three modes, critical history is the one he endorses... most scientific and objective." -> **Misreading.** Nietzsche does not rank them hierarchically as permanent states. All three are necessary for a healthy culture depending on context. Also, he explicitly denies history can be "objective" in the scientific sense; critical history is violent and subjective ("judging and condemning").
      *   *Claim 7:* "Manifesto against historical study as such... cut history from the school curriculum." -> **Non-sequitur/Misreading.** He argues for *serving life*, not abolishing history. He wants history bounded by art and plastic power, not eliminated.

