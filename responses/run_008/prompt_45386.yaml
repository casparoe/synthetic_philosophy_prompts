  # Instructor's Cheat Sheet for the "Infinite" Round

  To make Round 2 work, you must manage the "Universe" carefully.
  1.  **Do not run out of props.** Have a pre-printed list of "Suits" ($S_1$ to $S_{1000}$) or just write them on the board.
  2.  **Enforce the Stall.** If a student tries to say "Okay, we take all of them," stop them. "How? List them." They can't.
  3.  **The "Golden Suit".** Keep one index card hidden. If they claim their set is maximal, reveal the Golden Suit. "Is this independent of your set?" "Yes." "Then you weren't maximal." This proves that *finite steps* cannot reach maximality in this setup.

  # Final Word to the Chemist
  You mentioned you fell into set theory late. Use that.
  In chemistry, you assume atoms exist even if you can't see them. You use models (orbitals) that are mathematically convenient but not physically "real" in a direct sense.
  Tell them: **"Zorn's Lemma is the Orbital Theory of Set Theory.** It gives you a structure that works perfectly for calculations and proofs, but if you ask to see the electron (the maximal element) without the math, the universe stays silent. The activity isn't about finding the electron; it's about trusting the model."

  This framing usually bridges the gap between the "shut up and calculate" math students and the "what is real" philosophy students. Good luck with the seminar.
