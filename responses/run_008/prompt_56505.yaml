answer: |-
  The porch creaked under the weight of two old rocking chairs. Elias swirled the ice in his tea. Mara stared out at the streetlights flickering on.

  "It's the arithmetic that kills me, Elias," Mara said. "I grant you rights are trumps. I grant you we don't just sum up happiness. But if a right violation is a moral catastrophe, why is *your* catastrophe worth five *their* catastrophes?"

  Elias stopped rocking. "Because I am not the author of their catastrophe. The mob is."

  "The mob is a force of nature you control," Mara countered. "If you frame that one innocent man, you violate one right. If you don't, five people get lynched. Five violations occur. By refusing to act, you're saying your agency is so special that keeping your own ledger clean outweighs preventing five identical stains on the universe."

  "It's not about cleanliness, Mara. It's about the doing/allowing distinction."

  "Don't just say the words," she interrupted, leaning forward. "Explain the weight. Why does the metaphysical difference between *pushing* and *letting fall* outweigh the biological fact of five corpses versus one? You're letting the distinction do unexplained heavy lifting."

  "Because morality isn't just about states of affairs. It's about integrity. If I frame him, I make justice a lie. I become the instrument of injustice."

  "So integrity is a luxury good?" Mara pressed. "Okay, let's test this. Suppose we set up a violation market. Seriously. You say restrictions are agent-relative boundaries. So why not let agents trade permissions? I, as Sheriff, buy the right to frame one man now. In exchange, I fund a task force that prevents ten future wrongful executions. Net reduction in violations. Why is that trade obscene?"

  Elias sighed, setting his glass down hard. "Because it treats rights as fungible commodities. You're trying to optimize the distribution of sin."

  "I'm trying to minimize the total amount of wrong in the world!"

  "No," Elias said quietly. "You're trying to keep the ledger balanced while ignoring what the entries *are*. The intuition that your market is disgusting—even though it reduces total violations—reveals the point. Restrictions aren't budget lines to be managed across agents. They're a refusal to let violations enter practical accounting at all. I cannot *use* a person as a means, even to prevent others from using persons as means."

  "That sounds aesthetic," Mara said. "Like you're refusing to look at the blood on your hands by claiming it's not yours because you didn't spill it directly. It's moral narcissism. You care more about your own purity than the bodies on the ground."

  "Is it narcissism to refuse to murder?" Elias shot back. "Or is that the baseline?"

  "Okay, shift the angle. Outsourcing. The Sheriff doesn't frame the man. He quietly deputizes a desperate subordinate, tells him to 'handle it.' The Sheriff doesn't technically do the doing. Is he clean then?"

  Elias frowned. "No."

  "Why? His hands are clean."

  "Because he's still the author of the plan. The restriction attaches to the will, not just the muscles. If I orchestrate the injustice, I own it, even if I don't pull the lever."

  "Okay," Mara said, tapping her knee. "So it's about authorship. But here's the wedge. Are you absolutist? If the mob isn't lynching five people, but five thousand? Or a million? Do you still let them die to keep your hands clean?"

  Elias paused. The crickets seemed louder. "There are thresholds."

  Mara pounced. "Ah. So rights have weights after all. They're just very heavy. But if they have weights, the paradox re-enters at the margin. Why is the threshold at a million and not five? If you concede the number matters eventually, you've conceded the consequentialist logic wins; you're just haggling over the exchange rate."

  "It's not an exchange rate," Elias insisted. "It's a structural limit. Think of a dam. It holds back water regardless of the pressure, until the pressure threatens the integrity of the dam itself. At a million lives, the moral community itself is collapsing. My refusal to kill the innocent maintains the system of rights. But if the system is about to vanish anyway, the constraint loses its object."

  "So the constraint is instrumental?" Mara asked. "You keep your hands clean to preserve the institution of rights?"

  "No. I keep them clean because that's what it means to be a moral agent. But I acknowledge that morality requires a world to exist in. If the world burns, the rules of the house don't apply."

  "But that's just act-consequentialism with a huge delay factor," Mara said, frustrated. "You're saying 'maximize rights-respect' but refusing to look at the immediate causal link. You say the market is obscene because it treats violations as budget lines. But your threshold admits that eventually, the budget *does* matter. You just don't want to admit where the break-even point is."

  "And you," Elias said, pointing a finger, "you want to say the sheriff is responsible for the mob's bullets because he didn't intercept them with his own crime. You collapse the distinction between protecting rights and violating them. If I kill the innocent man to save the others, I haven't protected rights. I've demonstrated that rights are conditional on utility. I've taught the town that innocence is no shield if the numbers look right."

  "So you teach them integrity while they dig graves," Mara said softly.

  "I teach them that some things are not done," Elias replied. "Even when it costs us."

  Mara leaned back, looking up at the stars. "So here's the crux. For you, the primary moral unit is the *agent's will*. My integrity is my responsibility; the world's state is partly outside my control. For me, the primary moral unit is the *state of the world*. My agency is just a tool to minimize the bad stuff. You think I'm corrupting the concept of justice by optimizing it. I think you're fetishizing the concept of agency while people die."

  "I think," Elias said, picking up his tea again, "that if we start optimizing justice, it ceases to be justice. It becomes management."

  "And I think," Mara said, "that if justice doesn't manage the suffering it was built to prevent, it becomes a monument."

  They sat in the silence between the two statements, neither willing to concede the ground beneath them.
