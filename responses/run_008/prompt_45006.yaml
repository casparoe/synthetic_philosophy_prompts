          *   **Output Format:** Single JSON object with specific fields ("assemblage", "materials", "rules", "timeline", "team_roles", "debrief", "predictable_failures", "unreproducible_feature", "confidence").
          *   **Confidence Field:** Must state confidence level and name the single least sure choice with a reason.

  2.  **Drafting the Content:**

      *   **Assemblage:** Need a set of objects that tell a story but allow multiple stories.
          *   *Object 1 (Economic/Ritual):* A set of standardized clay tokens. Could be accounting (bullae) or votive offerings.
          *   *Object 2 (Modern Projection):* A segmented metal rod with markings. Looks like a ruler/measuring tool (modern science/standardization), but could be a ritual staff or status symbol with arbitrary markings.
          *   *Object 3 (Spatial Association Trap):* Bones found near a hearth. Could be food waste (domestic) or cremation/ancestor worship (ritual).
          *   *Object 4 (Contextual):* A broken figurine head found separately from the body.
          *   *Setting:* A single "locus" or room context provided via description/map.

      *   **Materials:** Physical props or high-quality images? Physical is better for "feel". Printed cards with descriptions/images. Bags for teams.
      *   **Rules:** No talking between teams. Must produce a "Site Report Conclusion" paragraph. Must be confident (no "maybe").
      *   **Timeline:** 120 minutes total.
          *   Intro/Rules: 10 min
          *   Investigation/Analysis: 40 min
          *   Writing Reconstruction: 20 min
          *   Reveal/Comparison: 20 min
