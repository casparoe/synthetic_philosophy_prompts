      *   **Team Roles:** To ensure engagement. Recorder, Skeptic, Synthesizer, Presenter. (4 roles x 4 teams = 16 students).
      *   **Debrief:** Connect specific student errors to theory.
          *   Analogy: "It looks like a ruler, so it is a ruler."
          *   Ambiguity: Tokens as money vs. prayer.
          *   Spatial: Bones near fire = cooking vs. burning offerings.
      *   **Predictable Failures:**
          *   Teams might try to collaborate despite rules.
          *   Teams might hedge too much (violating "confident" rule).
          *   Teams might focus too much on one object and ignore the assemblage whole.
          *   Time management (writing takes longer than expected).
      *   **Unreproducible Feature:** Taphonomy/Deep Time. In class, the objects are placed intentionally by the instructor. In real archaeology, formation processes (natural disturbance, decay, accidental loss) are crucial and unknown. Students assume the assemblage is "complete" or "intentional."
      *   **Confidence:** High confidence generally. Least sure part might be the specific "Modern Projection" object—will students actually project modernity, or will they just say "status symbol"? Need to ensure the design triggers *modern* institutional projection (e.g., bureaucracy vs. ritual).

  3.  **Refining the JSON Structure:**
