          *   Claim 2: The debate is about *prudential value* (good/bad for the person), not moral or aesthetic value. (Crucial distinction).
          *   Claim 3: Posthumous events can alter the *narrative value* or *success conditions* of a life (e.g., reputation, projects). This bridges the gap slightly—Epicureans often allow life's *meaning* is affected, just not the *subject's welfare* after death. Let's refine: Both agree that whether a life *went well* can depend on what happens after the biological end, but disagree on whether that constitutes harm *to the subject* at that later time.
