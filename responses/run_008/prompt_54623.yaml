      *   *Verbal vs. Substantive:* A lot of this debate turns on the predicate "bad for." If "bad for" means "felt as bad," Epicureans win. If "bad for" means "worse off than in a relevant alternative," Deprivationists win. The joint statement must acknowledge this semantic divergence without dissolving the metaphysical stakes.
      *   *Timing:* This is the hardest part. Epicureans say: No time works (before? after? during?). Deprivationists say: It's "atemporal" or "timeless" or "at the time of the consequence." The table needs to capture the *intuition* behind the timing objection without forcing a solution.
