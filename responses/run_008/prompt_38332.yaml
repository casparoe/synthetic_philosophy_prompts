      *   *Move 4:* Supervenience. Rob argues laws supervene on the mosaic of facts. Sam argues facts are determined by laws.
          *   *Verdict:* This is the definition of the disagreement. Rob is logically consistent with Humeanism. Sam is consistent with Necessitarianism. However, Rob's point highlights the epistemic access: we infer laws *from* facts. Sam's point is metaphysical. In terms of scientific practice, Rob is closer to how physics works (fitting models to data). In terms of metaphysics, Sam is closer to how we talk about causation. I will judge based on explanatory power vs. ontological commitment. Rob avoids magic; Sam invokes it. Rob wins on parsimony.

