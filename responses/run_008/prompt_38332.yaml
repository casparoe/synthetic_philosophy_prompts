          *   *Verdict:* Rob is methodologically stronger (parsimony); Sam is intuitively stronger (explanation). Let's call it a draw on truth, but Rob is clearer on the ontology.

      *   *Move 2:* Rob uses the *dormitive virtue* objection. This is a classic and strong objection to positing "governing" as a causal mechanism. Sam pivots to counterfactuals.
