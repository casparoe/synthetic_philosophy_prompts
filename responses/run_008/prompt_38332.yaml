  8.  **Final Polish:** Check against the prompt's request for a "careful verdict rather than a gentle one." Don't sit on the fence too much. Pick a winner but explain the nuance. (Rob wins on parsimony, Sam wins on intuition, but Rob's view is more scientifically robust).

