answer: |-
  1. I want to start with a concrete failure. I wrote a chapter I genuinely intended as tender; every trusted reader found it cruel. You distinguish between semantic intentions and ulterior ones, so I assume you'd say my semantic intention was tenderness, but I failed to realize it. If actual intentionalism holds, does that chapter *mean* tenderness despite universally communicating cruelty?
     **Follow-up:** If you say the meaning is tenderness, you've severed meaning from communication entirely. If you say the meaning is cruelty, you've conceded the text overrides intention. How do you navigate this without simply defining "semantic intention" as "whatever the text successfully conveys," which collapses your view into textualism?

  2. Why shouldn't we treat Actual Intentionalism as a metaphysical luxury and retreat to Hypothetical Intentionalism once actual intentions become inaccessible or messy? What work is the "Actual" doing here that the "Best Hypothesis" isn't?
     **Follow-up:** You'll likely argue that Hypothetical Intentionalism is about justification while Actual is about ontology. But if the Actual intention is permanently inaccessible to the reader, doesn't it function identically to a Hypothetical one in practice? What epistemic value does the "Actual" add if it can't be verified without circular reasoning?

  3. Can I change my book's meaning after publication? If I come on this podcast and announce that actually the sister was dead the whole time, does the novel now mean that, or was the meaning fixed at the moment of publication?
     **Follow-up:** If you say it's fixed at publication, you're admitting that the public text constrains your future intentions. If the text can constrain the author's later intentions, why can't it constrain the author's original intentions in favor of the reader's interpretation?

  4. What exactly stops the Humpty Dumpty maneuver? If I intend the word "green" to mean "sad" in a specific passage, and I write that down, does the text mean "sad" even if no reader could possibly infer that without my testimony?
     **Follow-up:** You'll likely say semantic intentions rely on shared conventions. But if conventions are the boundary condition for valid intentions, isn't convention the real owner of meaning, with intention merely acting as a user within those limits?

  5. How do you handle unconscious meaning? If a psychoanalytic reading reveals a pattern I didn't know I intended, is that meaning part of the work, or is it excluded because it wasn't a conscious semantic intention?
     **Follow-up:** If you exclude it as non-semantic, how do you verify my conscious semantic intentions without inferring them from the very text that contains the unconscious pattern? Aren't you relying on the text to prove the intention that supposedly governs the text?

  6. In novel writing, editors often change words that the author accepts. Whose intention counts when the editor suggests a phrase and the author nods? Is it a collaborative intention, or does the author ratify it as their own semantic intention?
     **Follow-up:** If ratification is required, does it need to be a conscious semantic act? If I forget I approved the edit ten years ago, does the meaning of that line shift back to my original forgotten intention, or does the ratified text hold?

  7. Given my work involves translators: if a translator intends a nuance in the target language that I didn't intend in the source, is that a new work or a misreading? Can a translation ever preserve actual intentional meaning across languages?
     **Follow-up:** If you say it's a new work, doesn't that admit the original meaning is bound to the specific words rather than the author's mind? If the mind's intention can't survive a change in vocabulary, how stable is that intention really?

  8. If I intend two contradictory things in the same passage, does the book mean both, neither, or is it meaningless until a reader resolves the contradiction?
     **Follow-up:** If you say it's meaningless until resolved, aren't you handing the creation of meaning over to the reader's resolution strategy? That sounds suspiciously like the "Death of the Author" scenario you're trying to avoid.

  9. What counts as admissible evidence for your actual intentions? Diaries, interviews, drafts? If I lie in an interview about what I intended, does the lie become the meaning, or do you need access to my "true" mental state?
     **Follow-up:** If you need access to my "true" mental state, you're positing an intention separate from any public evidence. How do we distinguish that "true" intention from a hypothetical reconstruction without relying on the text itself?

  10. Ultimately, what do we gain by tying meaning to psychology rather than public language? Is the benefit ethical (respecting the author) or epistemological (securing truth)?
      **Follow-up:** If the benefit is ethical, does that ethical gain outweigh the epistemological loss of accessible meaning? Why should readers prioritize the author's psychological state over the public value the text generates?

  KeepThisOne: Why shouldn't we treat Actual Intentionalism as a metaphysical luxury and retreat to Hypothetical Intentionalism once actual intentions become inaccessible or messy? What work is the "Actual" doing here that the "Best Hypothesis" isn't?
