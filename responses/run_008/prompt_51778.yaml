  **The Logical Regress**

  Achilles rested on his first **premise**,
  Beside the slow, unblinking **tortoise**.
  He sought to drive towards a **conclusion**,
  And asked the beast merely to **accept**
  That human minds are free to **infer**,
  Governed by some strict logical **rule**.

  "But logical force requires another **rule**,
  To bind you tight to that first **premise**.
  Before you dare to logically **infer**,
  Said the slow and smiling **tortoise**,
  Unless you willingly **accept**,
  This new bridge towards the **conclusion**."

  So Achilles penned the **conclusion**,
  As if it were a binding **rule**.
  But still the beast would not **accept**,
  Without a further **premise**.
  The patience of the **tortoise**,
  Refused to let him **infer**.

  Now weary, trying to **infer**,
  The truth of this **conclusion**,
  He looked upon the **tortoise**,
  Who demanded yet another **rule**.
  Added to the weight of **premise**,
  Which the warrior must **accept**.

  How much more can you **accept**?
  When you refuse to **infer**,
  From all this added **premise**?
  There is no final **conclusion**,
  Only an endless **rule**,
  And the laughing **tortoise**.

  The sand shifted under the **tortoise**.
  Achilles could not **accept**,
  That logic breaks its own **rule**.
  He struggled to **infer**,
  Any stable **conclusion**,
  From the infinite **premise**.

  So the **tortoise** waits, refusing to **infer**,
  Unless you **accept** the lack of **conclusion**,
  Bound by every **rule** and every **premise**.
