answer: |-
  Here is a specification list for a causal explanation of a historical event, structured by desiderata, motivated by the cases you raised, and evaluated for logical compatibility.

  ### The Desiderata List

  **1. Counterfactual Dependence (The "Difference-Maker" Constraint)**
  *   **Specification:** The explanation must identify factors such that, had they been different (or absent), the outcome would have been different in a specified respect.
  *   **Motivation:** This captures the basic intuition that a cause must make a difference. Without this, correlation is indistinguishable from causation.
  *   **Case:** In the **Reformation**, the existence of indulgence sales is a background condition, but Luther's *95 Theses* is a difference-maker. If the Theses are never posted, the specific explosion of 1517 does not occur, even if anti-clericalism exists.
  *   **Status:** **Non-Negotiable.** A theory that cannot distinguish between a cause and a mere background condition is not a causal theory.

  **2. Accommodation of Absences (The "Omission" Constraint)**
  *   **Specification:** The framework must allow non-events (failures to act, missing information, roads not taken) to function as causal variables, provided there is a normative or structural expectation of their occurrence.
  *   **Motivation:** Historians constantly cite failures. A spec that requires positive physical events excludes half the discipline's vocabulary.
  *   **Case:** **WWI.** The British Foreign Secretary Grey's failure to make an explicit commitment to France prior to July 1914 is often cited as a cause of German miscalculation. Nothing happened, yet it caused something.
  *   **Status:** **Non-Negotiable for Historical Practice.** (Metaphysically contentious, but methodologically required for history).

  **3. Temporal Resolution (The "Why Then" Constraint)**
  *   **Specification:** The explanation must distinguish between factors that explain the *possibility* of an event (structural conditions) and factors that explain the *timing* of the event (triggering mechanisms). It must not conflate long-term propensity with short-term actualization.
  *   **Motivation:** To avoid the "it was bound to happen" fallacy, which erases agency and contingency.
  *   **Case:** **French Revolution.** Feudal debt and crop failure explain why revolution was *possible* in the 1780s. The calling of the Estates-General explains why it happened *in 1789* and not 1795.
  *   **Status:** **Non-Negotiable.** Without this, history collapses into sociology or teleology.

  **4. Overdetermination Tolerance (The "Multiple Paths" Constraint)**
  *   **Specification:** The framework must handle cases where multiple distinct causal chains are each sufficient (or near-sufficient) to produce the outcome, without rendering all causes irrelevant. It must be able to assign causal weight even when strict necessity is absent.
  *   **Motivation:** To handle complex systems where redundancy is high.
  *   **Case:** **WWI (again).** As you noted, the alliance system might have caused war without Sarajevo; Sarajevo might have caused war without the alliance system (via bilateral escalation). A strict "but-for" test fails here because neither is strictly necessary.
  *   **Status:** **Non-Negotiable.** If your spec fails here, it cannot explain major structural collapses or systemic wars.

  **5. Parsimony / Non-Redundancy (The "Crowding-Out" Constraint)**
  *   **Specification:** The explanation must provide a principled criterion for excluding factors that, while technically causal, add negligible explanatory power relative to the complexity they introduce.
  *   **Motivation:** To prevent the "list everything since 1815" problem. An explanation that includes every necessary condition is a description of the universe, not an explanation of the event.
  *   **Case:** **USSR Collapse.** The existence of gravity is a necessary condition for the fall of the Berlin Wall, but citing it is explanatorily useless.
  *   **Status:** **Contingent (Methodological).** Some schools (e.g., *Annales*, Total History) reject parsimony in favor of thick description. However, for a *causal* theory, this is effectively non-negotiable.

  **6. Causal Ranking (The "Importance" Constraint)**
  *   **Specification:** The framework must allow the historian to rank causes by importance, weight, or primacy.
  *   **Motivation:** Policymakers and readers want to know the "main" cause.
  *   **Case:** **WWI.** Was the main cause German aggression, the alliance system, or imperialism?
  *   **Status:** **Contingent (School-Dependent).** This is often a pragmatic or moral judgment rather than a logical one. "Importance" is relative to the contrast class (Important for whom? For preventing recurrence? For assigning blame?).

  ---

  ### The Compatibility Check: The Trilemma

  You suspected that some subset of these requirements is jointly unsatisfiable. **You are correct.** There is a logical trilemma between three specific commitments:

  1.  **Strict But-For Necessity** (Desideratum 1, interpreted rigidly).
  2.  **Acceptance of Overdetermination** (Desideratum 4).
  3.  **Singular Event Explanation** (Explaining *this* specific outcome, e.g., "War in 1914").

  **The Conflict:**
  If you insist on strict But-For Necessity (If C had not occurred, E would not have occurred), you **cannot** handle Overdetermination. In an overdetermined case (e.g., two assassins shoot simultaneously), neither assassin is a "but-for" cause because the other would have produced the death anyway.
  If you want to handle Overdetermination, you must abandon strict But-For Necessity in favor of **Sufficiency** or **INUS conditions** (Insufficient but Necessary part of an Unnecessary but Sufficient condition).
  However, if you move to Sufficiency/INUS, you often lose the ability to explain the **Singular Event** precisely, because you are now explaining a *type* of event (War) rather than the *token* event (War of 1914).

  **The Resolution:**
  To satisfy the spec, you must weaken Desideratum 1. You cannot use simple counterfactual dependence. You must use **Contrastive Explanation**.
  *   *Not:* "Why did WWI happen?" (Invites overdetermination problems).
  *   *But:* "Why did WWI happen *in August 1914* rather than *1916*?" or "Why did WWI happen *as a general war* rather than *a localized Balkan conflict*?"

  By specifying the **contrast class**, you restore the "but-for" intuition. The alliance system is not the cause of "War" (which was overdetermined), but it *is* the but-for cause of "General European War in 1914" (as opposed to a localized war).

  **Verdict:** You can keep all desiderata *only if* you define the *Explanandum* (the thing being explained) as a contrastive event rather than a bare occurrence.

  ---

  ### What This Spec Knocks Out

  If you adopt this specification, it renders two standard historical approaches logically incoherent, even if they remain rhetorically useful.

  **1. The "Narrative + Implicit But-For" Approach**
  *   **The Approach:** Historians often tell a story where A leads to B, implying that without A, B wouldn't happen, without explicitly testing for overdetermination.
  *   **Why it fails:** This approach collapses under Desideratum 4 (Overdetermination). Narrative naturally selects a single thread (the "plot"). In cases like 1914 or the USSR, the "plot" (e.g., Gorbachev's reforms) is rarely a strict but-for cause because structural pressures (economic stagnation) were likely sufficient on their own to cause collapse eventually.
  *   **The Knock-Out:** A rigorous spec forces you to admit that your narrative protagonist (e.g., Gorbachev) might be a *moderator* of the collapse (shaping *how* and *when*) rather than the *generator* of the collapse (shaping *if*). Narrative implies necessity where there was only probability.

  **2. The "Deep Causes vs. Proximate Causes" Two-Layer Picture**
  *   **The Approach:** The standard textbook move: "Deep structural causes made it inevitable; proximate triggers set it off."
  *   **Why it fails:** This violates Desideratum 3 (Temporal Resolution) and Desideratum 5 (Parsimony) by treating them as separate categories rather than interacting variables. It suggests the "Deep Cause" was sitting there waiting, which implies a teleology that didn't exist.
  *   **The Knock-Out:** A rigorous causal spec requires a **single causal field**. A "deep cause" (e.g., Soviet economic stagnation) is only a cause insofar as it interacts with a "proximate cause" (e.g., the Chernobyl disaster) to cross a threshold. If the spec requires mechanism, you cannot have "deep causes" that operate without a mechanism of transmission. You must explain *how* the stagnation translated into collapse *at that moment*. The two-layer picture often hides the mechanism.

  ### Non-Negotiable vs. Contingent: The Verdict

  *   **Non-Negotiable:** Counterfactual Dependence (modified for contrast), Accommodation of Absences, Temporal Resolution, Overdetermination Tolerance. (If you drop these, you are writing literature or philosophy, not causal history).
  *   **Contingent:** Causal Ranking. (Drop this. It is the source of most historiographical fights. "Primary cause" is usually a moral judgment disguised as a causal one. Focus on *causal role* instead of *rank*).

  ### Summary Recommendation for Your Theory Chapter

  Do not try to solve the trilemma by choosing one side. Solve it by **specifying the contrast.**

  Your theory chapter should argue that the specification for a causal explanation of the Soviet Collapse is not "Why did the USSR collapse?" (which invites overdetermination and teleology). It is "Why did the USSR collapse **in 1991** via **dissolution** rather than **civil war** or **authoritarian retrenchment**?"

  This specific formulation:
  1.  Honors the **But-For** intuition (Gorbachev's specific choices become necessary for *dissolution* vs. *civil war*).
  2.  Handles **Overdetermination** (Structural decay explains the collapse *risk*, but not the specific *mode*).
  3.  Solves **Crowding-Out** (Factors that don't distinguish 1991 from 1985 are excluded).
  4.  Validates **Absences** (The failure to use force in 1989 becomes a key differentiator).

  If you commit to a contrastive specification, you satisfy the hard parts of your list without breaking logic. If you stick to a bare event specification ("The Collapse"), you will be forced to violate either the But-For intuition or the Overdetermination constraint.
