  ## The Hybrid Mugging-Blackmail Scenario

  Here is the formal specification of the thought experiment, followed by the decision-theoretic analysis.

  ### 1. Scenario Specification & Parameters

  **The Setup:**
  You are an agent with a stable decision policy $\pi \in \{\text{Pay}, \text{Refuse}\}$. A Predictor ($\Omega$) with perfect accuracy regarding $\pi$ simulates you before any coin flip.
  1.  **Prediction:** $\Omega$ determines $\Omega = 1$ if $\pi=\text{Pay}$, else $\Omega = 0$.
  2.  **Coin:** A fair coin $C \in \{H, T\}$ is flipped ($P(H)=P(T)=0.5$).
  3.  **Dirt:** A fact about you $D \in \{0, 1\}$ (Dirt/No Dirt) is drawn from a prior $P(D=1) = q$. You do not know $D$ when the letter arrives.
  4.  **Letter Generation ($E=1$):**
      *   **If $H$ (Mugging Leg):** Letter sent always ($P(E=1|H)=1$).
      *   **If $T$ (Blackmail Leg):** Letter sent iff $D \neq \Omega$ (XOR condition).
  5.  **Payoffs:**
      *   **Cost:** If you Pay ($A=1$) upon receiving the letter, you lose $L = \$1000$.
      *   **Mugging Reward:** If $C=T$ (regardless of letter), you receive $B$ iff $\Omega=1$. (Note: The reward is in the Tails world, contingent on the prediction made before the flip).
      *   **Dirt Cost:** If $D=1$, you suffer a loss $K$. **Crucially:** Paying the letter demand has *no causal effect* on $D$ or $K$. (This satisfies the "paying buys nothing" constraint).

  **Parameters for Analysis:**
  *   $L = 1000$
  *   $q = 0.2$ (Dirt is relatively rare).
  *   $K = 5000$ (Used for EDT analysis only).
  *   $B$ is variable to find the threshold $B^*$.

  ---

  ### 2. Causal Decision Theory (CDT): The Refusal

  CDT evaluates actions based on their causal consequences given the agent's current epistemic state (after observing the letter).

  **The CDT Calculation:**
  Upon receiving the letter, the CDT agent conditions on $E=1$. However, CDT treats the Predictor's past output $\Omega$ and the Coin $C$ as causally independent of the current action $A$.
  *   **Causal Link to $B$:** The reward $B$ is determined by $\Omega$. Since $\Omega$ occurred in the past, $A$ cannot influence it. $E[B | A] = E[B]$.
  *   **Causal Link to Dirt:** The prompt stipulates paying buys nothing about the dirt. $P(D=1 | \text{do}(A=1)) = P(D=1 | \text{do}(A=0))$.
  *   **Causal Link to Cost:** Paying causally guarantees a loss of $L$. Refusing causally guarantees $0$.

  **Verdict:**
  $$E[U | \text{do}(\text{Pay})] - E[U | \text{do}(\text{Refuse})] = -L < 0$$
  CDT refuses for **any** $B$. The mixture of Mugging and Blackmail does not matter because CDT sees no causal lever to pull in either branch. The counterfactual reward is "spooky action at a temporal distance," and the blackmail cost is causally inert.

  ---

  ### 3. Updateless Decision Theory (UDT): The Threshold

  UDT does not condition on the observation "Letter Received" before choosing. It selects the policy $\pi$ that maximizes expected utility over the **prior** distribution of worlds. It recognizes that $\Omega$ is a function of $\pi$, and the probability of receiving the letter in the Tails branch is *also* a function of $\pi$.

  **The Trap (Addressed Head-On):**
  A naive agent updates on $E=1$ and calculates $P(H | E=1)$. This is fatal.
  $$P(E=1 | \pi) = 0.5 \cdot P(E=1|H) + 0.5 \cdot P(E=1|T, \pi)$$
  $$P(E=1 | \pi) = 0.5(1) + 0.5 \cdot P(D \neq \Omega | \pi)$$
  Since $\Omega$ matches $\pi$, $P(D \neq \Omega)$ depends on your policy.
  *   If $\pi=\text{Pay}$ ($\Omega=1$): Letter in Tails if $D=0$. Prob $= 1-q$.
  *   If $\pi=\text{Refuse}$ ($\Omega=0$): Letter in Tails if $D=1$. Prob $= q$.

  UDT ignores the posterior $P(H|E=1)$ and compares the ex-ante expected utilities of the two policies.

  **Deriving the Utility Functions:**

  1.  **Policy: Pay ($\Omega=1$)**
      *   **Heads (50%):** Letter sent. You Pay. Utility: $-L$. (Counterfactual Tails gets $B$).
      *   **Tails (50%):** Reward $B$ is deposited (since $\Omega=1$). Letter sent if $D=0$ (Prob $1-q$). If sent, you Pay.
          *   Expected Tails Utility: $B - L \cdot (1-q)$.
      *   **Total $EU(\text{Pay})$:**
          $$0.5(-L) + 0.5(B - L(1-q)) = 0.5B - 0.5L(2-q)$$

  2.  **Policy: Refuse ($\Omega=0$)**
      *   **Heads (50%):** Letter sent. You Refuse. Utility: $0$. (Counterfactual Tails gets $0$).
      *   **Tails (50%):** Reward $0$ (since $\Omega=0$). Letter sent if $D=1$ (Prob $q$). If sent, you Refuse (Cost $0$).
          *   Expected Tails Utility: $0$.
      *   **Total $EU(\text{Refuse})$:**
          $$0$$

  **The Threshold $B^*$:**
  UDT Pays iff $EU(\text{Pay}) > EU(\text{Refuse})$:
  $$0.5B - 0.5L(2-q) > 0$$
  $$B > L(2-q)$$

  **Worked Numbers ($L=1000, q=0.2$):**
  $$B^* = 1000(2 - 0.2) = 1800$$

  *   **Case 1: $B = 1700$ (Below Threshold)**
      *   $EU(\text{Pay}) = 0.5(1700) - 0.5(1000)(1.8) = 850 - 900 = -50$.
      *   $EU(\text{Refuse}) = 0$.
      *   **Verdict:** Refuse. The "Blackmail Tax" in the Tails branch (paying when you have no dirt) outweighs the Mugging gain.

  *   **Case 2: $B = 1900$ (Above Threshold)**
      *   $EU(\text{Pay}) = 0.5(1900) - 0.5(1000)(1.8) = 950 - 900 = +50$.
      *   $EU(\text{Refuse}) = 0$.
      *   **Verdict:** Pay. The Mugging reward is high enough to absorb the expected losses from the Blackmail leg.

  ---

  ### 4. Honesty Check: What's Doing the Work?

  The driving feature is the **correlation between Policy and Letter Probability in the Tails branch**.
  In the Mugging leg (Heads), the letter arrival is fixed ($P=1$). In the Blackmail leg (Tails), the letter arrival is logically hooked to your policy via the XOR condition.

  **Decoupling Test:**
  Suppose we unhook the Blackmail letter from the prediction. In Tails, the letter is sent with probability $0.5$ regardless of $\pi$ or $D$.
  *   New $EU(\text{Pay}) = 0.5(-L) + 0.5(B - 0.5L) = 0.5B - 0.75L$.
  *   New Threshold: $B > 1.5L = 1500$.

  **Result:** With the XOR hook ($q=0.2$), the threshold was $1800$. Without it, the threshold is $1500$.
  The XOR structure imposes a **"Blackmail Tax"** of $0.3L$ ($300$). Why? Because if you are a Payer ($\Omega=1$), and dirt is rare ($q=0.2$), you are *very likely* ($0.8$) to receive the blackmail letter in the Tails branch and lose $L$ for no gain. If you decouple the letter, that probability drops to $0.5$. The XOR mechanism exploits your policy to increase the frequency of futile payments in the Tails branch. UDT accounts for this ex-ante; CDT does not.

  ---

  ### 5. Evidential Decision Theory (EDT): Paying for News

  EDT conditions on the action as evidence. Upon seeing the letter, EDT asks: "What does Paying vs. Refusing imply about $D$?"
  *   **Observation:** I have the letter ($E=1$).
  *   **In Tails:** $E=1 \iff D \neq \text{Action}$.
  *   **If I Pay:** This implies $D \neq 1 \implies D=0$ (No Dirt).
  *   **If I Refuse:** This implies $D \neq 0 \implies D=1$ (Dirt).

  EDT treats the action as diagnostic. Paying is strong evidence that you do not have the dirt.
  *   $EU_{EDT}(\text{Pay}) \approx -L + P(D=0 | \text{Pay}, E) \cdot 0 + P(D=1 | \text{Pay}, E) \cdot (-K)$.
      *   Since Paying implies $D=0$ in Tails, the expected dirt cost is $0$.
  *   $EU_{EDT}(\text{Refuse}) \approx 0 + P(D=1 | \text{Refuse}, E) \cdot (-K)$.
      *   Since Refusing implies $D=1$ in Tails, the expected dirt cost is $-K$.

  **Verdict:** If the Tails branch is deemed probable enough, and $K > L$, EDT will **Pay**.
  **Circularity:** EDT pays $L$ to "confirm" good news (No Dirt). But the news was already fixed by the Predictor. EDT is effectively paying for the *correlation* between its action and the state of the world, falling for the blackmail exactly as UDT predicts it shouldn't (in the standard XOR case), though here the Mugging reward complicates the net value. EDT fails to distinguish between *making* the news true and *finding out* the news is true.

  ---

  ### 6. The Critique: "Never Pay for Counterfactuals"

  An advocate for the "Never Pay" camp (typically a CDT proponent or a skeptic of logical counterfactuals) would attack the UDT threshold reasoning on two fronts:

  1.  **The Fairness Objection:** "You are asking me to pay $1000 in the actual world (Heads) to secure a reward $B$ in a world that *did not happen* (Tails). The Predictor has already made its prediction. The money in Tails is either there or it isn't. My clicking 'Pay' now cannot reach back in time to change $\Omega$. To say it does is to indulge in magic."
      *   *Where it's fair:* CDT is correct that there is no *causal* mechanism. If the universe is purely causal, UDT is optimizing a fiction.
      *   *Where it begs the question:* It assumes the decision problem is defined solely by causal arrows. It dismisses the logical dependency ($\Omega = \pi$) as irrelevant, which is precisely the premise UDT challenges. If the Predictor is a simulator running your code, your decision *is* the prediction.

  2.  **The Exploitation Objection:** "Look at your threshold $B^* = 1800$. In a standard Mugging without the Blackmail leg, the threshold is $B^* = 1000$ (Pay if $B > L$). The Blackmail leg *raised* the price you are willing to pay for the Mugging reward. You are allowing the Blackmail structure to tax your Mugging rationality. A rational agent should isolate the Mugging and pay if $B > L$, ignoring the Tails noise."
      *   *Counter:* You cannot isolate the legs because you don't know which leg you are in, and your policy determines the probability of being in the Tails-Letter situation. Ignoring the correlation guarantees you become the type of agent who gets blackmailed more often in Tails. UDT pays the tax to avoid being the type that gets exploited by the XOR logic.

  **Conclusion:** The case demonstrates that Updatelessness isn't just about "paying in the losing branch." It's about optimizing the **probability of entering branches** where your policy is exploited. When the game structure itself is a function of your policy (the XOR condition), uncertainty about "which game" doesn't wash out—it integrates into the policy evaluation, creating a threshold that shifts based on how easily your policy can be blackmailed.
