answer: |-
  Maya's moral framework is fascinating because it rejects pure Utilitarianism (she doesn't think you must maximize the good, hence the 5% income case) but also rejects strict Libertarianism (she thinks you *must* ruin your shoes for a drowning kid). She is operating on a **Moderate Deontological** system with specific "veto" conditions.

  Here are the three rules that best fit her track record:

  1.  **The "Easy Rescue" Principle:** If the cost is trivial (time, minor property) and the beneficiary is immediate/identifiable, the act is **Required**.
      *   *Fits:* Pond ($200 shoes), Wallet (20 mins).
  2.  **The "Life-Plan Disruption" Principle:** If the cost significantly disrupts your long-term financial stability or daily functioning for an extended period, the act is **Supererogatory**.
      *   *Fits:* Income (5%/10% ongoing), Kidney (weeks recovery), Grenade (end of life plan).
  3.  **The "Bodily Sovereignty" Principle:** If the act requires invasive use of your body (surgery, risk of death, significant pain), it is **Supererogatory**, regardless of who the beneficiary is.
      *   *Fits:* Grenade, Kidney.

  ### The Marrow Case Analysis

  The bone marrow case creates tension between these rules.
  *   **Support for "Required":** It fits the "Easy Rescue" outcome (a life is saved) and lacks the "Death Risk" of the grenade or kidney cases. If her line is drawn at *permanent* harm or death, marrow falls on the required side.
  *   **Support for "Supererogatory":** It fits the "Life-Plan Disruption" (weeks wiped out) and "Bodily Sovereignty" (invasive, painful procedure) principles.

  **My Prediction:**
  Maya will verdict this as **Supererogatory**.

  **Why?**
  The strongest predictor in her track record is the **Kidney Case**. If donating a kidney to a *brother* (high emotional stakes, specific identity) is optional, then donating marrow to a *stranger* (low emotional stakes, anonymous) must also be optional, even if the medical risk is lower.

  Maya seems to view the body as a "protected zone." Once you cross the threshold from external assets (shoes, cash, time) to internal assets (blood, organs, flesh), the obligation evaporates. The "weeks wiped out" factor also triggers her "Life-Plan Disruption" rule. She treats 5% of income as optional; weeks of incapacitation is a comparable disruption to one's life projects. The "how big is the sacrifice" framing is messy, but for Maya, the *type* of sacrifice (bodily/disruptive) matters more than the *risk* level.

  ### The Rematch Case: The Tie-Breaker

  To win the rematch, you need to separate the **Bodily Sovereignty** rule from the **Life-Plan Disruption** rule. The marrow case conflates them (it is both bodily *and* disruptive). You need a case that is Bodily but *not* Disruptive.

  **Spring this on her:**
  > "You are walking past a hospital and see a specific, named child bleeding out in the lobby. The doctor says you are a perfect match. You need to give a **pint of blood** right now. It takes 45 minutes. It hurts like a sharp pinch. You'll be lightheaded for an hour, but you can go back to work tomorrow. No weeks of recovery. No long-term damage. The child dies without it."

  **Why this separates the rules:**
  *   **If she says "Required":** Then her verdict on Marrow was based on the **Disruption** (weeks of recovery), not the Bodily Intrusion. This means she believes we *do* owe strangers bodily use, provided it doesn't mess up our lives.
  *   **If she says "Supererogatory":** Then her verdict on Marrow was based on **Bodily Sovereignty**. This means she believes using the body as a resource is *always* optional, even for trivial costs.

  This forces her to admit whether her "protected zone" is her *schedule* or her *skin*.

  Verdict: supererogatory
