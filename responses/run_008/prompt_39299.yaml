answer: |-
  # Quiz: The Moral Saints Inventory

  **Instructions:**
  Read each scenario carefully. There are no right or wrong answers. Choose the option that best matches your gut reaction. Don't overthink it, and don't answer based on what you think a philosophy professor wants to hear. Just answer honestly.

  ***

  **1. The Hobbyist**
  Alex is incredibly talented at painting. It brings Alex deep joy and relaxation. However, Alex realizes that if they stopped painting and spent those 20 hours a week volunteering at a food bank, they could help feed significantly more people. Alex decides to quit painting entirely to volunteer.
  *   **A.** Alex made the right choice. Helping people is more important than art.
  *   **B.** Alex made a mistake. A life without art and joy is too high a price to pay, even for charity.
  *   **C.** Alex didn't *have* to do this, but it's admirable that they chose to.

  **2. The Boring Saint**
  Jordan is unfailingly kind. Jordan never tells a mean joke, never gets angry, and never prioritizes their own fun over someone else's need. But Jordan also has no hobbies, no strong opinions on movies or music, and no sense of humor. People say Jordan is "good," but also "a bit empty."
  *   **A.** Jordan is the ideal human being. The lack of "personality" doesn't matter compared to the goodness.
  *   **B.** Jordan is missing something essential. A good human life needs more than just moral perfection.
  *   **C.** Jordan is good, but it's okay for most people to be less perfect and more interesting.

  **3. The Lonely Hero**
  Casey dedicates their life to rescuing animals from dangerous situations. Casey saves hundreds of lives. However, Casey is constantly exhausted, has no money for dating or travel, and admits to feeling deeply lonely and unhappy.
  *   **A.** Casey's life is tragic. You can't have a successful life if you are miserable, no matter how much good you do.
  *   **B.** Casey's life is a success. The happiness of the animals outweighs Casey's personal unhappiness.
  *   **C.** Casey is a hero, but we shouldn't expect everyone to live this way.

  **4. Joy vs. Burden**
  Imagine two people, Taylor and Morgan. Both donate 50% of their income to charity.
  *   **Taylor** loves doing it. It gives them a sense of purpose and happiness.
  *   **Morgan** hates doing it. It feels like a crushing burden, but they do it because they believe it's the right thing.
  *Who is living the better life?*
  *   **A.** Taylor. Doing good shouldn't feel like punishment.
  *   **B.** Morgan. Sacrificing what you love proves your morality is stronger.
  *   **C.** They are morally equal, but Taylor is luckier.

  **5. The Musician vs. The Volunteer**
  *   **Sam** is a morally decent person (doesn't lie, steal, or hurt anyone) but is a brilliant musician who brings beauty to thousands of people.
  *   **Riley** is a moral saint (maximizes help to others at all times) but has no other talents or interests.
  *Who is the more admirable human being, all things considered?*
  *   **A.** Riley. Moral goodness is the only thing that really counts for admiration.
  *   **B.** Sam. Being a great friend and artist makes for a richer life than just being "good."
  *   **C.** They are admirable in different ways; you can't compare them.

  **6. The Dinner Party**
  You have a free evening. You could spend it comforting a friend who is going through a breakup, or you could spend it working a shift at a shelter where your help is slightly more "efficient" in terms of total good done.
  *   **A.** Go to the shelter. The greater need wins.
  *   **B.** Comfort the friend. Special relationships allow us to prioritize people we love.
  *   **C.** It's up to you. Neither choice is morally required.

  **7. The World of Saints**
  Imagine a world where *everyone* acts like a Moral Saint (always prioritizing the greater good, no personal hobbies, unfailingly kind).
  *   **A.** That would be a perfect utopia.
  *   **B.** That would be a dull, sterile place. We'd lose culture, art, and passion.
  *   **C.** It would be a better world, but it's unrealistic to expect it.

  **8. The Threshold**
  You earn a good salary. You donate 10% to charity, which is enough to live comfortably and help others. A philosopher tells you that you should actually donate 60% to save the maximum number of lives.
  *   **A.** The philosopher is right. 10% is selfish; 60% is what morality demands.
  *   **B.** The philosopher is wrong. 10% is "good enough." Morality doesn't demand the rest.
  *   **C.** 60% is amazing, but 10% is what is required. Anything more is a bonus.

  **9. The Role Model**
  You are choosing a role model for a group of 10-year-old children.
  *   **Candidate X** teaches kids to always put others first, even if it means sacrificing their own toys and fun.
  *   **Candidate Y** teaches kids to be kind and honest, but also to pursue their own passions and happiness.
  *   **A.** Choose Candidate X. We need to instill maximum selflessness early.
  *   **B.** Choose Candidate Y. We need to teach kids how to have a balanced, happy life.
  *   **C.** Choose a mix. Teach kindness, but don't push the sacrifice too hard.

  **10. The Regret**
  At the end of their life, the Moral Saint looks back. They acknowledge they could have had more fun, more friends, and more relaxation if they hadn't been so focused on doing good.
  *   **A.** The Saint should feel regret. They missed out on what makes life worth living.
  *   **B.** The Saint should feel no regret. They did what mattered most.
  *   **C.** The Saint might feel regret, but that doesn't mean they did the wrong thing.

  ***

  # Instructor's Guide & Scoring Key

  ### Part 1: Scoring the Two Axes
  This quiz is designed to sort students based on two distinct questions that are often conflated in the literature:
  1.  **The Personal Good Axis:** Is being a Moral Saint good *for the saint*? (Does it constitute a flourishing human life?)
  2.  **The Impersonal Good Axis:** Is being a Moral Saint better *for the world*? (Is it the optimal state of affairs, regardless of the agent's happiness?)

  **Step 1: Tally the "Personal Good" Score (P-Score)**
  *Count how many times the student selected options that prioritize the agent's happiness, balance, or non-moral goods.*
  *   **Q1:** B (1 point)
  *   **Q2:** B (1 point)
  *   **Q3:** A (1 point)
  *   **Q4:** A (1 point)
  *   **Q5:** B (1 point)
  *   **Q9:** B (1 point)
  *   **Q10:** A (1 point)
  *   *Max P-Score: 7*

  **Step 2: Tally the "Impersonal Good" Score (I-Score)**
  *Count how many times the student selected options that prioritize maximum moral output, impartiality, or the greater good.*
  *   **Q1:** A (1 point)
  *   **Q3:** B (1 point)
  *   **Q4:** B (1 point) *(Note: This measures if sacrifice adds moral value)*
  *   **Q5:** A (1 point)
  *   **Q6:** A (1 point)
  *   **Q7:** A (1 point)
  *   **Q8:** A (1 point)
  *   *Max I-Score: 7*

  *(Note: Questions not listed above, or options C in the lists above, generally indicate "Supererogatory" or "Threshold" views and are used for qualitative tie-breaking in Part 3.)*

  ### Part 2: Mapping Scores to Philosophical Positions

  Use the P-Score and I-Score to place the student into one of the five positions below.

  #### 1. The Maximizer (Utilitarian View)
  *   **Profile:** **Low P-Score (0–2) + High I-Score (5–7)**
  *   **Interpretation:** This student believes that moral output is the only thing that truly matters. They are willing to sacrifice the agent's personal happiness, hobbies, and relationships if it maximizes the good. To them, the "Moral Saint" is the ideal human being, full stop. The regret of the saint (Q10) is irrelevant; the good done justifies the life lived.
  *   **Philosophical Label:** Act Utilitarianism / Moral Maximizing.

  #### 2. The Humanist Critic (Wolf-Style View)
  *   **Profile:** **High P-Score (5–7) + High I-Score (5–7)**
  *   **Interpretation:** *This is the crucial distinction.* This student admits that the Saint produces more good (High I), but insists the Saint is living a defective life (High P). They agree with Susan Wolf: Moral Sainthood is impersonally effective but personally unattractive. They would likely answer Q7 (World of Saints) with "It would be better, but I wouldn't want to live there."
  *   **Philosophical Label:** Wolf's "Moral Saints" Critique.

  #### 3. The Flourishing First (Virtue Ethics View)
  *   **Profile:** **High P-Score (5–7) + Low I-Score (0–2)**
  *   **Interpretation:** This student rejects the idea that the Saint is better for the world *because* they reject the idea that morality is the only value. They believe a world of Saints (Q7) would be dull (Option B) and that Sam the Musician (Q5) is more admirable. For them, "Good for the World" includes art, joy, and personality, not just moral units.
  *   **Philosophical Label:** Virtue Ethics / Eudaimonism.

  #### 4. The Duty-Bound (Threshold View)
  *   **Profile:** **Mixed Scores + Heavy use of "Option C" on Q1, Q3, Q8.**
  *   **Interpretation:** This student believes there is a limit to what morality can demand. They likely scored low on I-Score regarding *requirements* (Q8: 10% is enough) but might admire the saint as optional. They distinguish between "what I must do" and "what is best." They reject the Maximizing view that you must always do more.
  *   **Philosophical Label:** Satisficing Consequentialism / Threshold Deontology.

  #### 5. The Hero Worshipper (Supererogatory View)
  *   **Profile:** **Mixed Scores + Heavy use of "Option C" on Q1, Q5, Q10.**
  *   **Interpretation:** This student sees the Saint as "above and beyond." They don't think it's required (unlike the Maximizer), but they do think it's specially admirable (unlike the Threshold view which might see it as neutral). They separate obligation from admiration. They likely chose Q1-C (Admirable but not required) and Q5-C (Different kinds of admiration).
  *   **Philosophical Label:** Supererogationism / Undemanding Morality.

  ### Part 3: Limitations & Ambiguities (For Instructor Use)

  Be aware of the following overlaps where this quiz cannot cleanly separate positions. You may need to probe these in class discussion.

  **1. The Wolf vs. Virtue Ethics Blur**
  *   **The Issue:** Both the "Humanist Critic" (Wolf) and "Flourishing First" (Virtue) will score High on the P-Score (Sainthood is bad for the person).
  *   **The Difference:** Wolf might admit the world is *impersonally* better with more saints (High I-Score), whereas the Virtue Ethicist argues the world is *not* better because a world without art/joy is impoverished (Low I-Score).
  *   **Quiz Limitation:** If a student scores High P and Mid-Range I, it is hard to tell if they are Wolfian (Sainthood is good but too costly) or Virtue-oriented (Sainthood is not actually 'good' because it lacks balance).
  *   **Discussion Tip:** Ask: "If we could press a button and make everyone a Moral Saint instantly, would you press it?" Wolf says "No" (because we value non-moral goods). Utilitarians say "Yes."

  **2. The Threshold vs. Supererogatory Blur**
  *   **The Issue:** Both the "Duty-Bound" (Threshold) and "Hero Worshipper" (Supererogatory) reject the idea that sainthood is *required*. Both will select "Option C" frequently.
  *   **The Difference:** The Threshold view says going beyond the limit is *morally neutral* (neither good nor bad). The Supererogatory view says it is *morally excellent* but not required.
  *   **Quiz Limitation:** Q1 and Q8 try to separate this, but students often conflate "not required" with "optional bonus."
  *   **Discussion Tip:** Ask: "Is the person who donates 60% *better* than the person who donates 10%, or are they just *different*?" Threshold = Just different. Supererogatory = Better, but 10% is still okay.

  **3. The "Logically Possible but Empty" Quadrant**
  *   **The Issue:** **Low P-Score + Low I-Score.**
  *   **Interpretation:** This student believes being a Moral Saint is bad for the person *and* bad for the world.
  *   **Analysis:** This is a coherent position (perhaps a Nietzschean view that morality is harmful everywhere), but it is not a standard response to the "Moral Saints" literature. Most students will not hold this view. If you encounter it, this student likely rejects the premise that "helping others" is the definition of morality.
  *   **Action:** Flag this student for a conversation about moral skepticism or egoism.

  **4. The "Joy vs. Burden" Ambiguity (Q4)**
  *   **The Issue:** This question tests whether moral worth comes from *outcome* or *motivation*.
  *   **Limitation:** A Utilitarian might choose "Taylor" (Joy) because happy volunteers keep volunteering. A Kantian might choose "Morgan" (Burden) because duty is what matters. The quiz groups these into the I-Score, but they represent different *reasons* for the score.
  *   **Action:** Use Q4 as a specific discussion prompt to separate Consequentialists from Deontologists within the "Maximizer" group.
