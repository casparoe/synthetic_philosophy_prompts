  **MINISTRY OF FUTURE ASSETS & POTENTIAL LIFE**
  **WHITE PAPER 89-B: THE PROTECTION OF UNINSTANTIATED FUTURES**

  **Foreword by the Minister for Potentiality**

  It is the position of this Government that the wrongness of killing lies principally in the deprivation of a valuable future. While previous administrations restricted this protection to actualised persons, logical consistency demands we extend it to those futures currently in a probabilistic state. The so-called 'Contraception Objection'—which claims there is no determinate victim when conception is prevented—has been reviewed and found administratively soluble. This White Paper outlines the new framework for the safeguarding of Possible Persons.

  **1. The Determinate Victim Protocol**

  Critics argue that without conception, no specific individual exists to be harmed. The Ministry rejects this nihilism. Through our new Pre-Conceptive Probabilistic Modelling Unit, every gamete combination capable of producing a future-like-ours is now assigned a Provisional Tax Reference Number (PTRN). 

  This solves the individuation problem. When contraception is employed, or when coitus is declined, the specific PTRN associated with the highest probability outcome is marked as 'Deprived'. We do not need to know *who* the person would have been; we need only know that *someone* of value was prevented from being. The PTRN ensures there is always a file, always a victim, and always a liable party. Bureaucracy precedes ontology.

  **2. Obligations of the Fertile and Recognition of Loss**

  To ensure compliance with the Future Protection Mandate, all couples of childbearing age are subject to a Monthly Conception Quota. Failure to attempt conception during peak fertility windows will incur a fine indexed to the estimated GDP contribution of the forgone future. 

  Conversely, the State recognises the emotional toll of these necessary deprivations. A Bereavement Allowance is now payable upon the submission of a Menstruation Certificate (Form M-12). Furthermore, the 14th of every month shall be observed as a National Day of Mourning for the Possible Persons lost to abstinence. Citizens are encouraged to observe a minute's silence during which no productive activity occurs, thereby honouring the lost potential labour of the unborn.

  **3. Bodily Autonomy and Ethical Oversight**

  The Ministry notes a rise in citizens citing 'bodily autonomy' to resist gestation mandates, frequently invoking the 'Violinist' thought experiment¹. Staff are instructed to treat these analogies as logistical errors. The value of the Future-like-Ours outweighs the inconvenience of surgical attachment. If a citizen wakes up attached to a stranger, they are reminded that the stranger's future is now their statutory responsibility. To disconnect is to deprive.

  Regarding internal dissent, the Ministry's Ethics Board has raised concerns that one cannot wrong an entity that never exists.

  > ¹ *Footnote 3: The Ethics Board is advised that metaphysical concerns regarding non-existence do not constitute valid grounds for policy rejection. Please refile concerns in triplicate using Form E-Null, acknowledging that the 'harm' is located in the value of the future itself, not the subjective experience of the victim.*

  **4. Conclusion and Directive**

  Implementation begins immediately. Recent polling indicates that this policy is opposed by 100% of the currently living population. This data is noted but deemed irrelevant. The living are a transient constituency; the Possible are eternal. Staff are directed to cease engagement with existing voters and instead focus on developing representation mechanisms for the constituency that does not yet exist. Their silence is not consent; it is merely latency.

  *Issued by the Office of the Minister for Potentiality.*
