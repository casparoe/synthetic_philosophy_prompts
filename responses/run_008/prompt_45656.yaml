prompt: |-
  I'm a senior software engineer at a mid-sized company, and I've somehow ended up owning the go/no-go call for risky infrastructure changes — database migrations, dependency upgrades, failover drills, that sort of thing. Our current process is a lightweight pre-mortem: each engineer on the call gives a probability that the change will cause a user-visible incident and a probability that the rollback will fail if we need one. The trouble is that the numbers are all over the place and nobody trusts them; on a recent migration the incident estimates ranged from 1% to 25%, and for rollback failure from 2% to 40%. We currently average them, which I've come to suspect is wrong in a systematic way — averaging feels like it launders genuine disagreement and partial ignorance into a confident-looking point estimate that then gets treated as knowledge.

  A friend who did a philosophy degree pointed me at the literature on imprecise probabilities, and the core idea — that when your evidence doesn't pin down a probability you should carry an interval or a set of probability assignments through your reasoning rather than collapsing it to a single number — matches my instinct, as does the Ellsberg-style observation that people sensibly treat a known 10% risk differently from a risk that could be anywhere between 1% and 25%. But I can't turn the theory into something my team can actually run at a weekly ops meeting. So I'd like you to act as a formal epistemologist who is used to translating theory into practice for people with no philosophy background. Please think carefully before answering — perhaps start by brainstorming which decision rules from that literature (I've seen the phrases "maximin expected utility", "E-admissibility", and "minimax regret" but don't really understand the trade-offs between them) could survive contact with a whiteboard and a deadline, and then design around the survivor.

  The deliverable I want is a decision procedure we can run in about fifteen minutes per change: what we elicit and how, how we aggregate — or deliberately refuse to aggregate — individual estimates into an interval, which decision rule we apply to the interval for a go/no-go call with a clear stopping rule for "no", and what we do when the rule abstains but the business forces a binary choice anyway. It has to handle three cases: the migration above, with its embarrassingly wide intervals; a routine dependency patch where the interval is narrow but sits right on our risk threshold; and a failover drill that carries a small risk of its own but whose real value is information for a future emergency — and where I worry that a naive worst-case rule would talk us out of ever running it. Please be explicit about which steps are genuine theory and which are judgement calls dressed up as procedure, where the procedure will predictably misfire, and how to stop engineers from gaming the elicitation by quoting extreme numbers to veto changes they dislike for unrelated reasons. No reading lists or citations, please — I want the reasoning, not the bibliography, since I'll be working from this document alone.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Senior Software Engineer at a mid-sized company. Owns go/no-go for risky infra changes.
      *   **Problem:** Current process (averaging probability estimates) is flawed. It hides disagreement/uncertainty (imprecision) and creates false confidence. Estimates vary wildly (1%-25% incident, 2%-40% rollback failure).
      *   **Goal:** A practical decision procedure (15 mins/change) based on *imprecise probabilities* theory but translated for non-philosophers.
      *   **Key Constraints:**
          *   Must handle three specific cases: Wide disagreement (migration), Narrow but threshold-risky (patch), High value/low risk but worst-case sensitive (failover drill).
          *   Must prevent gaming (vetoing via extreme numbers).
          *   Must handle business pressure when the rule abstains.
          *   No reading lists/citations. Just reasoning and procedure.
          *   Explicitly distinguish theory from judgment calls.
          *   Identify where the procedure might misfire.

  2.  **Deconstruct the Theoretical Landscape (Internal Monologue):**
      *   *Imprecise Probabilities:* Instead of $P(E) = x$, we have $P(E) \in [L, U]$. This captures ambiguity (Ellsberg paradox).
      *   *Decision Rules:*
          *   *Maximin Expected Utility (MEU):* Choose the action with the best worst-case expected utility. Very conservative. Might block the failover drill (worst case: drill causes outage).
          *   *Minimax Regret:* Minimize the maximum regret. Good for competitive settings, less intuitive for safety/engineering.
          *   *E-admissibility:* An action is permissible if it maximizes expected utility for *at least one* probability distribution in the set. Too permissive for safety-critical infra (allows risky bets if one person thinks it's safe).
          *   *Interval Dominance:* Action A is better than B if the lower bound of A's utility is higher than the upper bound of B's utility. Often leads to indecision (abstention).
      *   *Selection:* For infrastructure safety, we need caution but not paralysis. MEU is too pessimistic for drills. E-admissibility is too optimistic for migrations. *Interval Dominance* with a specific *thresholding mechanism* seems best. We need to distinguish between *risk* (known probability) and *ambiguity* (unknown probability).
      *   *Aggregation:* Don't average. Use the union of credible intervals (or quantiles) to preserve disagreement.
      *   *Gaming:* Need a "credibility cost" or a requirement to justify extremes.

  3.  **Drafting the Procedure - Step-by-Step:**

      *   **Phase 1: Elicitation (The Input)**
          *   Current: "Give a number."
          *   New: "Give a range and a justification."
          *   To stop gaming: Require a "Reference Class." You can't say 1% unless you cite a similar past change. You can't say 25% without a specific failure mode.
          *   Aggregation: Instead of averaging, we take the *Union of Credible Intervals*. If Alice says [1%, 5%] and Bob says [10%, 25%], the group probability is [1%, 25%]. This preserves the disagreement.

      *   **Phase 2: Decision Rule (The Logic)**
          *   We need to compare "Go" vs. "No-Go".
          *   Let $U(Go)$ and $U(NoGo)$ be utilities.
          *   Actually, simpler for engineers: Compare *Expected Loss* against a *Risk Budget*.
          *   Let $L$ be the loss of an incident. Let $P \in [L_p, U_p]$ be the probability.
          *   Expected Loss $E \in [L_p \cdot L, U_p \cdot L]$.
          *   *Rule:* If $U_p \cdot L < \text{Threshold}$, GO. If $L_p \cdot L > \text{Threshold}$, NO-GO.
          *   *Problem:* This is basically Maximin/Maximax on loss. It fails the "Failover Drill" test. A drill has a cost (risk of outage) but also a benefit (information).
          *   *Refinement:* We need to value the *reduction of future ambiguity*.
          *   *Alternative Rule:* **Thresholded Interval Dominance.**
              *   Define a "Safe Zone" and a "Danger Zone".
              *   If the entire interval is in Safe -> GO.
              *   If the entire interval is in Danger -> NO-GO.
              *   If it straddles -> ABSTAIN (requires escalation).
          *   *Handling the Drill:* The "Loss" calculation for a drill must include the *negative loss* (gain) of learning. Or, treat drills as a separate category with a higher risk budget. Let's make it a separate track to keep the main procedure simple.
          *   *Handling Business Pressure:* If ABSTAIN, the decision moves to a higher authority who accepts the *ambiguity* explicitly.

      *   **Phase 3: Anti-Gaming Mechanisms**
          *   "Skin in the game": If you argue for a low probability, you own the pager if it fails.
          *   "Justification Burden": Extreme outliers must provide a specific failure scenario or historical precedent. If they can't, their estimate is discarded (clipped to the interquartile range).

  4.  **Refining the Theory vs. Practice:**
      *   *Theory:* Imprecise probabilities (sets of priors).
      *   *Practice:* Min/Max of the team's estimates (clipped).
      *   *Theory:* Maximin Expected Utility.
      *   *Practice:* Compare Upper Bound of Risk against Threshold.
      *   *Theory:* Value of Information.
      *   *Practice:* "Learning Budget" for drills.

  5.  **Addressing the Three Cases:**
      *   *Migration (Wide Interval):* Interval likely straddles threshold. Result: ABSTAIN. Escalate. This is correct; if we don't know, we shouldn't guess.
      *   *Patch (Near Threshold):* Interval is narrow but touches the line. If Upper Bound > Threshold -> NO-GO. This is conservative (Maximin-ish).
      *   *Drill (Info Value):* Needs a modified utility function. The "Loss" of a drill includes the cost of the drill outage minus the value of reduced future risk. Or, simpler: Drills get a separate, higher risk allowance *if* they are scheduled as learning events. Let's integrate this via a "Learning Credit."

  6.  **Developing the "15-Minute Protocol":**
      *   **Pre-work:** Engineers submit estimates + justification *before* the meeting.
      *   **Meeting (15 mins):**
          1.  Review Range (2 mins).
          2.  Challenge Outliers (5 mins).
          3.  Calculate Bounds (3 mins).
          4.  Apply Rule (5 mins).
      *   **The Rule:** The "Dual-Threshold" System.
          *   Green Light: Upper Bound < Limit.
          *   Red Light: Lower Bound > Limit.
          *   Yellow Light: Straddle.
      *   **Yellow Light Handling:** Escalate to you (the owner) or CTO. They sign off on the *ambiguity*, not just the risk.

  7.  **Addressing Gaming:**
      *   The "Clipping" rule. If an estimate is outside the 2nd-98th percentile *and* lacks specific evidence, it gets pulled in.
      *   The "Owner" rule. The person most optimistic about safety becomes the Incident Commander if it fails.

  8.  **Critique and Self-Correction (Simulated):**
      *   *Critique:* Is clipping too aggressive?
      *   *Fix:* Make it a discussion point. "Convince us or get clipped."
      *   *Critique:* Does this solve the "averaging" problem?
      *   *Fix:* Yes, by using the Union (Min/Max) instead of the Mean.
      *   *Critique:* Will business accept "Yellow Light"?
      *   *Fix:* Frame it as "We need a decision from leadership on ambiguity tolerance," not "We can't decide."
      *   *Critique:* Failover drills.
      *   *Fix:* Explicitly separate "Change Risk" from "Learning Investment." A drill is a *purchase* of safety. The risk budget for drills is separate.

  9.  **Finalizing the Structure:**
      *   **Introduction:** Acknowledge the flaw (averaging ambiguity).
      *   **Core Concept:** Intervals > Points.
      *   **The Procedure (The "15-Minute Protocol"):** Step-by-step.
      *   **Decision Logic:** The Dual-Threshold rule.
      *   **Handling the Three Cases:** Specific application.
      *   **Anti-Gaming:** Justification and Clipping.
      *   **Theory vs. Judgment:** Explicit mapping.
      *   **Failure Modes:** Where this breaks.

  10. **Tone Check:** Formal epistemologist persona. Pragmatic, precise, no fluff, no citations. Focus on *operationalizing uncertainty*.

  11. **Final Polish:** Ensure the distinction between *Risk* (known odds) and *Ambiguity* (unknown odds) is clear in the procedure. Ensure the "Business Force" scenario is handled (Yellow Light escalation).

  *(Self-Correction during drafting)*: I initially thought about Expected Utility calculations. That's too math-heavy for a 15-min meeting. Better to use "Risk Budget" (e.g., "We can tolerate 5 minutes of downtime per quarter"). Convert probability * impact to "Expected Downtime Minutes". This is engineer-native.

  *Revised Plan for Utility:*
  Instead of abstract utility, use **Expected Error Minutes (EEM)**.
  $EEM = Probability \times Impact Duration$.
  Threshold = $T$.
  Interval = $[EEM_{min}, EEM_{max}]$.
  This makes it concrete.

  *Revised Plan for Drills:*
  Drills have negative impact (cost) but reduce future impact.
  Treat Drills as having a "Learning Budget." If the drill fits in the Learning Budget, the Upper Bound check is relaxed.

  *Revised Plan for Gaming:*
  "Burden of Proof on Extremes." If you are the outlier, you must speak first and justify.

