answer: |-
  Here is a decision procedure designed to operationalize imprecise probability theory within a fifteen-minute operational window. It replaces the "averaging" habit with an "interval dominance" approach, explicitly separating *risk* (known probability) from *ambiguity* (unknown probability/disagreement).

  ### Core Philosophy
  Your instinct is correct: averaging launders ambiguity. If Engineer A says 1% and Engineer B says 25%, the average (13%) implies a precision that does not exist. The reality is not "13% risk"; the reality is "we do not know if the risk is 1% or 25%."

  In decision theory, this is the difference between **Risk** (a known distribution) and **Ambiguity** (an unknown distribution). Your current process treats ambiguity as risk. The new process treats ambiguity as a distinct signal that triggers different handling.

  We will use a **Dual-Threshold Interval Rule**. This is a pragmatic simplification of *Interval Dominance*. We will not calculate complex utilities. We will compare an **Expected Impact Interval** against a **Risk Budget**.

  ---

  ### The 15-Minute Protocol

  #### 1. Pre-Work (Asynchronous)
  Do not elicit numbers live. Bias cascades in real-time.
  *   **Requirement:** 24 hours before the meeting, every participating engineer submits:
      1.  **Probability Interval:** A lower and upper bound for incident probability (e.g., 1%–5%).
      2.  **Impact Estimate:** Expected duration of user-visible outage if the incident occurs (e.g., 30 mins).
      3.  **The "Why":** One sentence justifying the bounds (e.g., "Lower bound based on 10 prior successful migrations; upper bound based on the schema lock risk identified in ticket #123").
  *   **Rollback:** Submit a separate probability interval for rollback failure.

  #### 2. The Meeting (15 Minutes Hard Stop)

  **Step 1: Construct the Group Interval (3 Minutes)**
  *   Take the **Minimum** of all lower bounds as the Group Lower Bound ($L_{group}$).
  *   Take the **Maximum** of all upper bounds as the Group Upper Bound ($U_{group}$).
  *   *Theory Note:* This is the **Union of Credible Intervals**. It preserves disagreement rather than collapsing it. If one person sees a 25% risk, the group *does* face a 25% risk possibility.
  *   **Calculate Expected Impact Interval:** Multiply the probability bounds by the Impact Estimate.
      *   $Risk_{min} = L_{group} \times Impact$
      *   $Risk_{max} = U_{group} \times Impact$
      *   *Example:* 1%–25% probability $\times$ 60 mins outage = [0.6 mins, 15 mins] of Expected Downtime.

  **Step 2: The Outlier Challenge (5 Minutes)**
  *   Identify anyone whose bounds contributed to the extremes ($L_{group}$ or $U_{group}$).
  *   **The Burden of Proof:** The extreme estimator must justify their number using a **Reference Class** (past similar changes) or a **Specific Failure Mode** (a concrete technical reason).
  *   **The Clipping Rule (Anti-Gaming):** If an extreme estimator cannot cite a reference class or specific failure mode, their bound is **clipped** to the nearest interquartile range of the team's estimates.
      *   *Why:* This prevents veto-gaming via arbitrary pessimism ("I say 90%") or optimism ("I say 0%"). It forces "skin in the game" regarding evidence.
  *   Recalculate the Group Interval if clipping occurs.

  **Step 3: Apply the Dual-Threshold Rule (5 Minutes)**
  Define two thresholds based on your company's Risk Budget (e.g., "We can tolerate 2 minutes of expected downtime per release"):
  *   **Green Threshold ($T_{go}$):** The maximum risk you accept for a routine "Go".
  *   **Red Threshold ($T_{no}$):** The minimum risk that mandates a "No-Go".
  *   *Note:* $T_{go}$ should be lower than $T_{no}$ to create a "Yellow Zone."

  **The Decision Logic:**
  1.  **GO:** If $Risk_{max} < T_{go}$. (Even the worst-case estimate is safe).
  2.  **NO-GO:** If $Risk_{min} > T_{no}$. (Even the best-case estimate is too dangerous).
  3.  **ABSTAIN (Yellow Zone):** If the interval $[Risk_{min}, Risk_{max}]$ straddles the thresholds or sits entirely within the gap between $T_{go}$ and $T_{no}$.

  **Step 4: Handling Abstention (2 Minutes)**
  *   If the result is **ABSTAIN**, the team does *not* make the call.
  *   The decision escalates to you (the owner) or business leadership.
  *   **The Handoff:** You do not present a recommendation. You present the **Interval** and the **Ambiguity**.
      *   *Script:* "We cannot determine if this change is safe. The expected downtime is between 0.6 and 15 minutes. Our limit is 2 minutes. The disagreement stems from uncertainty about [specific technical issue]. Business must decide if they accept the possibility of 15 minutes downtime."
  *   This forces leadership to accept *ambiguity*, not just *risk*.

  ---

  ### Handling Your Three Specific Cases

  #### Case 1: The Migration (Wide Interval: 1%–25%)
  *   **Scenario:** High ambiguity.
  *   **Protocol Outcome:** The interval will almost certainly land in the **ABSTAIN** zone. $Risk_{max}$ will exceed $T_{go}$, and $Risk_{min}$ will likely be below $T_{no}$.
  *   **Result:** Escalation.
  *   **Why this works:** It prevents the "tyranny of the average." Previously, 13% might have looked acceptable. Now, the 25% upper bound is visible. Leadership must explicitly sign off on the 25% scenario. This often triggers a request for more mitigation (e.g., "Can we canary this?") before approval, which is the correct engineering response to ambiguity.

  #### Case 2: The Routine Patch (Narrow Interval, Near Threshold)
  *   **Scenario:** Low ambiguity, high precision, but risky. E.g., Interval [1.8 mins, 2.2 mins], Threshold = 2.0 mins.
  *   **Protocol Outcome:** **NO-GO** (if using a strict Maximin approach on the Green Threshold) or **ABSTAIN**.
  *   **Recommendation:** Treat the Green Threshold as a hard ceiling. If $Risk_{max} > T_{go}$, it is a **NO-GO** unless mitigated.
  *   **Why this works:** This is **Maximin Expected Utility** behavior. When precision is high, you respect the upper bound. It prevents "threshold shopping" where teams nudge estimates down to clear the bar. If the upper bound clears the bar, the change is safe enough. If not, it isn't.

  #### Case 3: The Failover Drill (Information Value)
  *   **Scenario:** Risk of outage exists, but the goal is learning. A naive worst-case rule blocks it.
  *   **Protocol Adjustment:** **The Learning Budget.**
  *   Do not run drills through the standard Risk Budget. Create a separate quarterly "Learning Budget" (e.g., 10 minutes of expected downtime per quarter dedicated to drills).
  *   **Rule:** For changes tagged as "Drill/Learning":
      1.  Calculate $Risk_{max}$ as usual.
      2.  Compare against the **Learning Budget** remaining, not the Production Risk Budget.
      3.  **Constraint:** $Risk_{max}$ must still be below a "Catastrophe Cap" (e.g., no drill can have an upper bound > 1 hour outage, regardless of budget).
  *   **Why this works:** This operationalizes the **Value of Information**. You are explicitly "spending" risk capacity to buy reduced ambiguity in future emergencies. It prevents the Maximin rule from causing paralysis on safety improvements.

  ---

  ### Anti-Gaming Measures

  Engineers may try to game the system to block changes they dislike (pessimistic gaming) or rush changes they want (optimistic gaming).

  1.  **The Clipping Rule (Detailed):**
      *   If an engineer submits a bound outside the 2nd–98th percentile of the team's historical accuracy *or* the current meeting's interquartile range, they are flagged.
      *   They must speak first in the "Outlier Challenge."
      *   If they cannot name a specific technical mechanism or historical precedent, their number is replaced by the team median.
      *   *Theory:* This enforces **E-admissibility**. A probability assignment is only admissible if it is supported by evidence available to the agent.

  2.  **The "Pager Ownership" Rule:**
      *   The engineer who argues most strongly for the *optimistic* (lowest risk) bound is assigned as the primary Incident Commander if the change causes an outage.
      *   *Effect:* This aligns incentives. It discourages reckless optimism. It does not punish pessimism, but it rewards *justified* optimism.

  3.  **Audit Trail:**
      *   Record the intervals and the justifications.
      *   Post-mortem: After the change, compare the actual outcome to the submitted intervals.
      *   If an engineer consistently submits intervals that do not contain the actual outcome (calibration error), their future estimates are weighted less (or they are required to undergo calibration training).

  ---

  ### Theory vs. Judgment Calls

  You need to know where the math ends and the policy begins so you can defend it.

  | Step | Component | Origin | Why |
  | :--- | :--- | :--- | :--- |
  | **Aggregation** | Union of Intervals (Min/Max) | **Theory** (Imprecise Probabilities) | Preserves ambiguity; avoids false precision of averaging. |
  | **Clipping** | Discarding unsupported outliers | **Judgment** | Pure theory allows any prior; practice requires evidence to prevent veto/gaming. |
  | **Decision Rule** | Dual-Threshold (Green/Red/Yellow) | **Hybrid** | Based on *Interval Dominance*, but the gap (Yellow) is a policy buffer for escalation. |
  | **Drill Handling** | Separate Learning Budget | **Judgment** | Theory (Value of Information) justifies it, but the budget size is a business policy. |
  | **Escalation** | Business accepts Ambiguity | **Theory** (Ellsberg) | Distinguishes Risk (business can price) from Ambiguity (business must accept ignorance). |

  ---

  ### Failure Modes & Mitigations

  No procedure is bulletproof. Here is where this will break and how to handle it.

  **1. The "Permanent Yellow" Problem**
  *   **Failure:** Complex changes always produce wide intervals that straddle the threshold, causing constant escalation to you.
  *   **Mitigation:** If a change hits **ABSTAIN** three times, it triggers a **Design Review**, not just a decision escalation. The problem is not the decision; it is the engineering design. The requirement becomes "Reduce Ambiguity" (e.g., build a staging environment, run a dry-run) before the change can be proposed again.

  **2. Business Forced Choice**
  *   **Failure:** Leadership refuses to accept "ABSTAIN" and demands a binary Go/No-Go immediately during a crisis.
  *   **Mitigation:** You must provide the **Conditional Recommendation**.
      *   *Script:* "If we must proceed, we recommend Go *only if* we enable [Specific Mitigation, e.g., Feature Flag]. Without that, the Upper Bound risk exceeds our catastrophe cap."
      *   This shifts the decision from "Risk Acceptance" to "Mitigation Acceptance."

  **3. Threshold Drift**
  *   **Failure:** Teams slowly nudge the Risk Budget thresholds up over time to make shipping easier (normalization of deviance).
  *   **Mitigation:** Thresholds are set quarterly by leadership, not by the engineering team. They are tied to SLA/SLO contracts, not engineering comfort.

  ### Summary of Deliverable

  1.  **Input:** Probability Intervals + Impact + Justification (Async).
  2.  **Aggregation:** Union of Intervals (Min/Max), clipped if unjustified.
  3.  **Metric:** Expected Impact Minutes ($[Risk_{min}, Risk_{max}]$).
  4.  **Rule:**
      *   $Risk_{max} < Limit \rightarrow$ **GO**
      *   $Risk_{min} > Limit \rightarrow$ **NO-GO**
      *   Otherwise $\rightarrow$ **ABSTAIN** (Escalate Ambiguity).
  5.  **Exception:** Drills use a separate "Learning Budget."
  6.  **Incentive:** Optimistic estimator owns the pager.

  This procedure respects the epistemology of uncertainty: it admits when we don't know, it prevents hiding disagreement behind averages, and it forces business stakeholders to pay the cognitive cost of ambiguity rather than offloading it to engineers as a false number.
