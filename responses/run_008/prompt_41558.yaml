answer: |-
  You have stumbled onto one of the deepest fault lines in decision theory: the shift from **Preference Coherence** (the standard economic view) to **Planning Agency** (the philosophical view championed by people like Michael Bratman and Edward McClennen).

  Your intuitions are remarkably consistent with the Planning Agency view, but they are incompatible with the standard "Revealed Preference" theory you were likely taught. The textbook argument assumes your preferences *define* your good; your intuitions assume your preferences are *inputs* that your rationality must manage.

  Here is the principle that captures your verdicts, the analysis of your test case, and the honest assessment of which verdict requires sacrifice.

  ### The Unifying Principle: Rationality as Diachronic Self-Governance

  **Principle:** *An agent is rational iff they effectively govern their agency over time to satisfy their reflective ends, maintaining coherence between their past, present, and future actions.*

  This principle has three clauses that motivate your specific verdicts:

  1.  **Preferences are Inputs, Not Masters (Motivates Case 1 vs. 3):** Rationality is not about satisfying every local preference impulse. It is about evaluating whether those impulses serve your broader goals. A preference structure is a *tool* for agency, not the *definition* of it.
  2.  **Agency is Temporally Extended (Motivates Case 4 vs. 5):** You are not a series of time-slices; you are a single entity persisting through time. Rationality requires cooperation between your past, present, and future selves.
  3.  **Instrumental Efficiency is the Goal (Motivates Case 6):** The point of rationality is to secure value. Rules or biases that systematically block value acquisition (without higher-order justification) are irrational, even if they prevent exploitation.

  ### How the Principle Maps to Your Six Cases

  1.  **Classic Cyclic Victim (Irrational):** Fails Clause 1 & 2. They let local impulses override global welfare. They fail to govern themselves over time, resulting in a net loss of resources for no gain.
  2.  **Contented Unpumped (Irrational, less confidently):** Fails Clause 1 *Dispositionally*. Their "internal machinery" is defective. Even if luck prevents the loss, the *capacity* for self-governance is broken. It is like a bridge built with rotten wood that never collapses because no cars drive on it; it is still a bad bridge.
  3.  **Cycle-Spotting Refuser (Rational):** Satisfies Clause 1. They use metacognition to recognize that satisfying their local preference (A > C) would violate their global preference (Wealth > Poverty). They govern their impulses rather than being governed by them.
  4.  **Time-Inconsistent Agent (Irrational):** Fails Clause 2. Their time-slices are at war. The "midnight self" undermines the "dinner self" without a higher-order justification. This is a failure of diachronic coherence.
  5.  **Ulysses Self-Binder (Rational):** Satisfies Clause 2 & 3. They pay a fee to ensure diachronic coherence. The cost is instrumentally justified because it secures a higher-order goal (sobriety/savings) that their future self would otherwise sabotage.
  6.  **Status-Quo Biased (Irrational):** Fails Clause 3. While they avoid exploitation (Clause 2 satisfied negatively), they violate instrumental efficiency. They leave value on the table due to a rigid heuristic that serves no reflective end.

  ### The Test Case: The Rule-Following Cyclic Agent

  > *An agent with cyclic preferences who adopts a strict personal rule at the start of their life: "once I've chosen a full plan I never reopen it." A trader can never get the second trade. They are unexploitable and disciplined.*

  **Verdict:** **Rational Agent, Defective Tastes.**

  Under the principle of **Diachronic Self-Governance**, this agent is **rational**. They have identified a flaw in their local preference structure and implemented a higher-order policy to neutralize it. This is functionally identical to your Case 3 (The Refuser) and Case 5 (Ulysses). They are successfully governing themselves over time.

  However, the principle forces a distinction you might find uncomfortable: **Procedural Rationality vs. Substantive Coherence.**
  *   **Procedurally:** They are rational. Their decision-making process is sound.
  *   **Substantively:** Their underlying evaluative system (the cyclic preferences) remains incoherent.

  The principle says you can be a rational *agent* even if your *tastes* are irrational, provided you manage those tastes correctly. The Rule-Follower is the ideal example of this: they have "sinned" in their preferences but "repented" in their policies.

  ### The Hard Truth: Which Verdict Must You Overturn?

  You asked for honesty about which of your verdicts the best principle has to overturn. There are two candidates, but one is more significant.

  **1. The Soft Overturn: Case 2 (The Contented Unpumped Agent)**
  Your intuition here is "I still think they're irrational, though I hold it less confidently." The principle demands you hold it **much less confidently**, perhaps to the point of abandoning the label "irrational" in the practical sense.
  *   **Why:** If rationality is *Self-Governance*, it is an activity. An agent who never faces a choice never exercises governance. To call them irrational is to judge them on a *counterfactual* (what they *would* do) rather than their actual agency.
  *   **The Cost:** You must accept that rationality is partly dependent on the environment. A perfectly coherent mind in a world with no choices is trivially rational; a defective mind in a world with no choices is harmlessly defective. The "irrationality" exists only as a potentiality, not an actuality.

  **2. The Hard Overturn: Case 3 (The Cycle-Spotting Refuser)**
  This is the deeper philosophical bullet to bite. To call the Refuser **Rational**, you are implicitly rejecting the **Humean Theory of Reason** (which says reason is the slave of the passions).
  *   **Why:** In Case 3, the agent *prefers* A to C (plus fee). By refusing the trade, they are acting *against* their own current preference. Standard decision theory says this is definitionally irrational.
  *   **The Cost:** To keep your verdict that Case 3 is Rational, you must accept that **Preferences do not determine Rationality.** You are adopting a **Kantian or Planning view**: Reason can judge and veto preferences. This overturns the standard textbook definition you were taught. It means the textbook argument ("money pumps prove preferences must be transitive") is actually false. Money pumps only prove that *unmanaged* cyclic preferences lead to loss. They do not prove that having cyclic preferences is itself irrational, provided you have the metacognitive capacity to block them.

  ### Summary Recommendation

  Keep your verdicts on Cases 1, 3, 4, 5, and 6. They form a coherent whole under **Diachronic Self-Governance**.

  **Soften your verdict on Case 2.** Do not call the Contented Agent "irrational." Call them **"structurally defective but practically untested."** Irrationality is a failure of agency; if no agency is required, no failure occurs.

  **Embrace the implication for Case 3.** Acknowledge that your intuition here reveals a truth the textbook hides: **Rationality is not about having coherent preferences; it is about having coherent policies.** The Rule-Follower in your test case is the proof: you can live a rational life with irrational tastes, as long as you bind them with a rational rule.
