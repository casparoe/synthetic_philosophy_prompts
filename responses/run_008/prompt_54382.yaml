answer: |-
  (a) **Candidate Rules**

  Based on your flatmate's seven verdicts, three serious candidate rules emerge. Each fits the majority of the data but strains against specific cases.

  1.  **The Action-Verification Principle**
      *   **Rule:** A top-down effect counts as cognitive penetration (CP) only if the reported perceptual change is corroborated by an implicit, online action measure (e.g., motor adjustment, walking) rather than verbal report or judgment alone.
      *   **Fits Comfortably:** Case 5 (Hill Slant) is the cornerstone here. The verbal report claimed a perceptual change, but the tilting disc (action) did not; she ruled "Not CP." Case 4 (Wine) also fits: discrimination (action/performance) was unchanged, only rating (judgment) changed. Case 3 (Sine-wave) fits implicitly: the inability to hear it as chirps again suggests an involuntary, action-ready state.
      *   **Strains To Explain:** Cases 2 and 6. In the Phoneme Restoration (2) and Radiologist (6) cases, there is no mention of action measures; the verdicts rest entirely on the strength of the phenomenal report ("heard decisively," "just looks like"). She accepts these without demanding a motor correlate, suggesting action verification is sufficient but perhaps not strictly necessary *if* the phenomenal change is involuntary and robust.

  2.  **The Phenomenal Construction Principle**
      *   **Rule:** CP requires that cognition alters the *qualitative character* (the "look" or "sound") of the stimulus itself. It excludes effects that merely alter selection (attention), evaluation (preference), or belief-based interpretation without sensory change.
      *   **Fits Comfortably:** Case 2 (Sound becomes word), Case 3 (Whistles become speech), and Case 6 (Noise becomes fracture) are all clear shifts in qualitative experience. Case 7 (Search) is ruled out because "nothing in the scene looks different." Case 1 (Müller-Lyer) is ruled out because the look *doesn't* change despite the belief.
      *   **Strains To Explain:** Case 5. Subjects *reported* the hill looked steeper. If we take their word, the phenomenal character changed. She ruled "Not CP" anyway. This implies that phenomenal report alone is insufficient if the underlying mechanism is judged to be post-perceptual estimation (which the action measure revealed).

  3.  **The Encapsulation/Module Boundary**
      *   **Rule:** CP is possible only within specific perceptual modules (auditory categorization, visual pattern recognition) but not in "central" systems dealing with spatial affordances, value, or effort.
      *   **Fits Comfortably:** Case 2 & 3 (Auditory processing) and Case 6 (Visual pattern recognition) are CP. Case 4 (Value/Taste), Case 5 (Spatial/Effort), and Case 7 (Attentional Control) are Not CP.
      *   **Strains To Explain:** Case 6. Radiology expertise is high-level pattern recognition, arguably "central" cognition compiled into vision. If high-level expertise can penetrate vision (6), why can't high-level knowledge penetrate the Müller-Lyer lines (1)? Her distinction seems to be that expertise changes the *feature detection* (fracture vs. noise), whereas belief fails to change the *feature processing* (line length).

  (b) **Predictions for the New Case**

  *   **Scenario:** Thirsty subjects see a water bottle as closer; effect persists in blindfolded walking (action measure).
  *   **Prediction by Rule 1 (Action-Verification):** **CP.** Unlike Case 5 (Hill), where the action measure *eliminated* the effect, here the action measure *confirms* it. Since she trusts the walking measure over verbal report, the failure condition of Case 5 is avoided.
  *   **Prediction by Rule 2 (Phenomenal Construction):** **CP.** The subjects report it "looks closer." Unlike Case 7 (Search), where the scene didn't look different, here the spatial appearance is altered. Unlike Case 1, the cognition (thirst) *succeeded* in changing the look.
  *   **Prediction by Rule 3 (Module Boundary):** **Not CP.** This is the strongest counter-prediction. Case 5 (Hill Slant) involved spatial perception/affordance and was ruled "Not CP" ("body casting a vote... not the eyes"). Distance perception is analogous to slant perception (both are spatial affordances). If she views spatial metrics as "estimates" rather than "sensory qualities," she may rule that thirst biases the *mapping* of vision to action, not vision itself.

  (c) **Best Guess at Her Ruling**

  **Verdict: Cognitive Penetration.**

  **Reasoning:**
  The critical pivot is her explicit methodological stance in Case 5. She noted that she "tends to trust [the action measure] over any verbal report." In Case 5, the action measure *dissolved* the effect, proving it was a judgment bias. In this new case, the action measure (blindfolded walking) *persists*.

  To rule "Not CP" here, she would have to argue that the walking measure itself is corrupted by the thirst (e.g., thirsty people walk differently), independent of perception. However, given her track record, she treats successful action-concordance as the gold standard for distinguishing perception from judgment (Case 4 & 5 vs. Case 2, 3, 6). Since the "Hill Slant" objection (Case 5) was specifically about the *dissociation* between report and action, and this dissociation is now *convergent*, she is logically committed to accepting this as perceptual. She distinguishes "selection" (Case 7) from "construction"; walking to a location implies the spatial map itself was constructed differently.

  (d) **Tie-Breaker Case**

  To divide **Rule 1 (Action-Verification)** from **Rule 3 (Module Boundary/Spatial Affordance)**, you need a case where the action measure confirms the effect, but the perceptual feature is clearly spatial/affordance-based (like the hill/bottle) versus a low-level sensory feature.

  **Proposed Case:**
  > Subjects are primed with images of dangerous animals (spiders/snakes). They subsequently view a neutral gray patch on a wall. Compared to controls, they report the patch looks *darker*, and this effect persists when they are asked to adjust a separate dial to match the patch's brightness (a motor action measure).

  *   **Why this divides them:**
      *   **Rule 1 (Action-Verification)** predicts **CP**. The motor match confirms the phenomenal report; the "judgment bias" explanation is ruled out by the action measure (just like the water bottle).
      *   **Rule 3 (Module Boundary)** predicts **Not CP**. Brightness is a low-level sensory feature, *but* if she ruled the Water Bottle "Not CP" because distance is an affordance/estimate (like the Hill), she might rule this "CP" because brightness is early vision.
      *   *Correction for maximum division:* To truly divide the rules regarding the Water Bottle prediction:
      *   **Better Tie-Breaker:** A case where **Action Matches Report, but the property is Spatial.**
      *   **Case:** Subjects wear a heavy backpack (like Case 5). They view a target on the ground. They report it looks *further away*. When asked to throw a beanbag to the target (action measure), they overshoot consistently, indicating they perceived it as further.
      *   **Division:**
          *   If she rules **CP**: She prioritizes **Action-Verification** (Rule 1). The backpack case (5) was only "Not CP" because the action failed.
          *   If she rules **Not CP**: She prioritizes **Module Boundary** (Rule 3). She believes physiological states (backpack/thirst) *cannot* penetrate spatial perception, regardless of action measures, viewing them as "embodied judgments" rather than visual changes.

  This case forces her to choose between her methodological commitment (action measures verify perception) and her theoretical commitment (spatial/effort effects are not visual).
