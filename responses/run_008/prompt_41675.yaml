answer: |-
  Subject: Plan for the source criticism seminar

  Hi there,

  I have been thinking about your problem with the two-hour seminar on source criticism, and I agree completely that the binary filter model of bias equals trash is the biggest obstacle you face. If they leave thinking criticism is just a way to disqualify evidence, you have failed, because history is mostly built from disqualified evidence. You need them to understand criticism as a constructive process rather than a destructive one, and to do that in a single session you cannot afford to tour examples. You need one chain of transmission that is thick enough to bear the weight of every methodological point you want to make. I am going to make a committed call here and suggest you drop the classical examples of Herodotus and Thucydides for this specific session. They are too abstract for first-years who are still struggling with the concept that a book is a physical object, and they do not easily allow you to bring in the science angle you mentioned. Instead, I want you to run the entire two hours on the discovery and analysis of the remains of Richard III.

  I know it sounds pop-historical, but stick with me on the methodology. The Richard III case carries everything you need because it forces a collision between the textual tradition and the physical evidence. You start the seminar not with the history of the man, but with the history of the texts about him. You show them that our main narratives come from Tudor chroniclers like Polydore Vergil and Thomas More, written decades after the fact, and you show them the manuscript tradition of those texts. This is where you kill the misconception that a copied manuscript is worthless. You demonstrate that we do not have the autographs, we have later copies, and yet we still use them. You show them how scribes changed things, not necessarily to destroy truth but to smooth narratives, which sets up the textual criticism angle. By keeping the focus on the physical manuscripts first, you establish that a source is an artifact before it is a testifier. This has to be established first because everything else leans on it. If they think the text is a transparent window, they will never understand why bias matters. Once they see the text as a constructed object that has traveled through time, you can move to the second phase, which is authorial intent and bias.

  This is where you head off the bias equals trash misconception. You lay out the Tudor propaganda machine and ask them why a Tudor writer would lie about a Plantagenet king. When they say to make him look bad, you ask if that makes the source useless. You guide them to see that the bias tells us about the Tudors even if it distorts the Plantagenets, and that a lie told for a reason is more informative than a truth told at random. This is also where you introduce the analogy about the harder reading. I think you should use it, but you must translate it out of philological jargon. Do not talk about lectio difficilior. Instead, ask them why a detail that hurts the author's own case is more likely to be true. If a Tudor writer admits Richard was brave, that detail is trustworthy precisely because it was inconvenient for the writer's goal of vilifying him. Place this in the middle of the seminar, right after you have established that authors have goals. It bridges the gap between textual criticism and historical reasoning, showing them that the mechanics of transmission and the psychology of authorship are governed by similar laws of probability.

  The third phase is where physics elbows in. You introduce the Leicester car park discovery. You bring in the radiocarbon dating, the DNA matching, and the osteological analysis of the trauma. This is crucial for breaking the primary source equals truth caricature. The primary textual sources said Richard was a hunchback with a withered arm. The bone says he had scoliosis but no withered arm. The science corrects the text. This shows them that authority does not reside in the age of the source but in the convergence of evidence. However, you must be careful not to replace the text-worship with science-worship. You need to show them that the carbon dating has a margin of error and the DNA match is probabilistic. This prepares them for the final and most difficult problem, which is the sole witness issue. You must include this in the seminar. If you refuse to cover it, you leave them with the impression that criticism always yields a verdict. But history is often stuck with only one witness. In the Richard III case, ask them what we would know if the body had never been found. We would still have to write the history, but we would have to qualify every statement differently. You show them that criticism in the absence of cross-checking is not about proving truth, but about assessing reliability and stating confidence levels. This belongs at the end of the sequence because it is the synthesis of all the previous steps. Once they understand transmission, bias, and corroboration, they can understand what happens when corroboration is missing.

  You need to map the misconceptions carefully so they do not fester. The gullible-Herodotus versus scientific-Thucydides caricature will try to emerge during the science phase. They will want to say the bones are the truth and the texts are lies. You must head this off immediately by pointing out that the bones only tell us how he died, not why he fought or what he intended. The text carries the meaning, the bone carries the fact, and history needs both. The misconception that a copied manuscript is worthless gets headed off in the first twenty minutes when you show them the pedigree of the Tudor chronicles. The idea that bias invalidates a source gets headed off in the middle hour when you discuss the utility of propaganda. If you leave any of these to the end, they will revert to their default settings during the Q&A. You need to dismantle the tools of their skepticism before you ask them to build anything.

  For the closing task, do not ask them to define source criticism. That just tests vocabulary. Give them a single sentence from a chronicle that conflicts with a physical fact, perhaps a claim about the location of Richard's burial that was proven wrong by the discovery. Ask them to write three sentences explaining what status that claim has now. If they say it is false and useless, they have failed. If they say it is false but reveals what later generations believed about his burial, or that it shows the limits of oral tradition, then they have absorbed the core idea. You want them to see that a disproven source is still a source, just one that requires a different kind of handling. This task forces them to apply the method rather than recite it.

  I know this feels like a specific case study for a general method module, but that is exactly why it works. It is bounded enough to manage in two hours but complex enough to show the layers of historical knowledge. If you try to cover Herodotus and medieval scribes and radiocarbon dating as separate examples, you will run out of time and they will see them as separate tricks. If you bind them all into the single question of how we know what happened to Richard III, they see the method as a unified toolkit. You are not teaching them about Richard III, you are teaching them about the gap between the event and the record, and how we bridge it. Stick to this order, keep the focus on the construction of knowledge rather than the recovery of truth, and you should be able to shift their mindset from filtering to building. Let me know how it goes.

  Best wishes
