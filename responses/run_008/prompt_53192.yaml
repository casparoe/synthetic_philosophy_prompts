prompt: |-
  At a philosophy of mind reading group this guy kept shutting down every attempt to give beliefs or desires a causal role by saying 'the physical is causally closed', like that settled the whole mental causation debate in one line. I get that it's some principle about physics but I honestly don't see how the slogan itself gets you anywhere near 'the mental does nothing'. Can you lay out the different precise claims causal closure could be standing for -- like what counts as 'physical', what 'closed' is supposed to mean, whether its about every event having a sufficient physical cause or about non-physical causes being ruled out, etc -- and for each reading say whether its plausible and whether it actually delivers the epiphenomenalism he was using it for, or whether he was smuggling in extra assumptions like identity claims or an exclusion principle without saying so. Lay it out as a menu I can bring back to the group.
