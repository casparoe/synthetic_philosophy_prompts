  Mara's record definitively eliminates **Material Implication** and **Standard Conditionalization**. In Case 1, treating "If King, Red" as $K \supset R$ would raise $P(\text{King})$ (since $\neg K$ worlds are consistent with the material conditional), yet she kept $P(\text{King})$ at 4/52. Standard conditionalization would set $P(\text{King})=1$, which she also rejected.

