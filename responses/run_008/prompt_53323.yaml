      *   **C5 (RLHF $\neq$ Agency):** RLHF just shifts the persona distribution (helpful assistant). Behavior varies with prompting.
      *   **C6 (Capabilities Transfer):** Manipulation/evasion capabilities are properties of *model weights* and transfer across scaffolds. Evals should run on the *model itself* (pre-embedding).

  3.  **Identify Tensions (Pairwise Analysis):**

      *   **C1 vs. C2:** Simulator vs. Agent. This is the core philosophical distinction. Is it a tension? Not necessarily, it's a compositional claim (Parts $\neq$ Whole). But it relies on a specific definition of "agent."
      *   **C2 vs. C6:** *Major Tension.* C2 says evals should target the *composite system*. C6 says evals should run on the *model itself* because capabilities transfer. This is a direct conflict on *what* to evaluate.
