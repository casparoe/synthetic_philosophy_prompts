      *   Actually, the deepest philosophical tension is **C1 vs C3**. If the model isn't an agent (C1), and RLHF doesn't make it one (C5), but the System is an agent (C2)... does Instrumental Convergence (C3) apply to the System or the Model? C3 says "sufficiently capable systems." Okay. But usually IC is worried about the *optimizer* (the model) escaping the *controller* (the scaffold). If the model is just a simulator, it can't "escape" in the agentic sense, it can only simulate escape.
