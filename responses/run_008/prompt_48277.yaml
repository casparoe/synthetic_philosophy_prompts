answer: |-
  This is a sharp diagnosis of why moral uncertainty discussions stall, and you are right that the exchange rate problem is the specific friction point that needs to be felt rather than explained. If you want them to run into the wall before you tell them it is a wall, you need a game where the scoring systems are fundamentally incommensurable, not just differently weighted. Here is a design for a ninety-minute session that structures the conflict to break exactly where you want it to, followed by the debrief strategy and an honest assessment of where this might fail.

  You should start by dividing the room into three parties of four, though if you have twelve people exactly, you can do three parties of four or four parties of three. Give each party a sealed envelope containing their moral manifesto and their scoring sheet. The Utilitarian party gets a manifesto that says their goal is to maximize the total sum of welfare points generated for the group, and their scoring sheet values outcomes strictly by aggregate numbers. The Deontological party gets a manifesto that says certain actions are forbidden regardless of consequences, and their scoring sheet assigns negative infinity points to any budget allocation that funds a specific project, say Project X, which involves a rights violation for greater good. The Contractualist party gets a manifesto focused on reciprocity and veto power, with a scoring sheet that penalizes them heavily if any other party ends up with a negative score, because they care about the fairness of the distribution itself. You give them a budget of 100 influence points to allocate across five distinct projects. Project X is the trap: it yields high total welfare but triggers the Deontologist's negative infinity penalty. Project Y is safe but low yield. The other projects are distractors with varying mixes of risk and reward. The key is that each party calculates the success of the final allocation using their own secret scoring sheet, and you tell them that their personal success in the game depends on their party's score, not the group's total.

  The session runs for three rounds of decision-making, each lasting about fifteen minutes with five minutes for setup and transition. In the first round, the decision rule is simple majority vote. This allows the Utilitarians to outvote the Deontologists and fund Project X. When you reveal the scores, the Utilitarians will be happy with the high total, but the Deontologists will reveal they have negative infinity or a catastrophic score, creating immediate tension. The group will feel that the majority rule failed to respect the minority's core constraints. In the second round, change the rule to unanimity or veto power. Now the Deontologists can block Project X. The group will likely gridlock or settle on a low-yield safe option. The Utilitarians will feel frustrated that immense potential welfare was sacrificed for a constraint they view as irrational. This sets the stage for the third round, which is open bargaining with side payments. Tell them they can now trade influence points or make promises to compensate each other. The Utilitarians will try to offer the Deontologists enough points from other projects to offset the pain of funding Project X. This is where the game should break. The Deontologists should realize that no amount of points compensates for a negative infinity score, and the Utilitarians will realize they cannot buy compliance because the currency they are offering does not convert into the currency the Deontologists care about. You want them to sit there in the third round with resources they cannot trade, unable to find a mutually beneficial agreement despite having surplus value available.

  The debrief is where you map this frustration onto the philosophical problem. Start by asking the Deontologists why they refused the trade. When they say the points did not matter, point out that this is exactly the exchange rate problem. In empirical uncertainty, if I am 70% sure it will rain and you are 30% sure, we can split the difference on bringing an umbrella because we both value dryness in the same units. In moral uncertainty, if I am 70% utilitarian and 30% deontological, I cannot simply maximize expected utility because the deontological part of me does not accept utility as a valid currency for compensating rights violations. Ask the group where the voting rules failed. Majority vote ignored the intensity of the constraint. Unanimity ignored the intensity of the welfare gain. Bargaining assumed commensurability where there was none. This is the moment you name the problem. The clean voting-rule solutions they might have read about assume a common metric of value across theories, and the game just demonstrated that no such metric exists. You then pivot to the real challenge. Ask them to imagine that these three parties are not three groups of people, but three voices inside a single head. The frustration they felt trying to negotiate with the other party is the same frustration they should feel when trying to negotiate with their own moral uncertainty. The difficulty of trading points with the Deontologist is the difficulty of trading off your own credence in deontology against your credence in utilitarianism.

  You are right to worry that assigning theories to different people outsources the tension. The hard thing about moral uncertainty is having it inside one skull, and this game externalizes it. To patch this, you need a final individual reflection step. After the debrief, ask everyone to spend five minutes writing down their own credences in the three theories represented in the game. Then ask them to write down one decision they face in real life where these theories would disagree. Ask them to try to apply the bargaining solution they just attempted in the game to their own internal conflict. Did it work? Did they find themselves trying to bribe their own deontological intuitions with utilitarian gains? This forces the external conflict back inward. However, you should be honest that this patch is imperfect. The game simulates interpersonal conflict better than intrapersonal conflict because people are naturally adversarial toward others but seek coherence within themselves. The game might make moral uncertainty look like a political compromise problem rather than a decision-theoretic one.

  There are predictable failures you should brace for. The most likely one is that the Deontologists will treat their negative infinity score as a high negative number rather than a lexical priority. If they do, the Utilitarians will successfully bribe them, and the lesson will fail. To prevent this, you must brief the Deontologist party heavily before the game starts. Tell them explicitly that their score is ruined, not just lowered, if the forbidden project is funded. Another failure mode is that someone will refuse to negotiate at all in the third round, not because of the rules, but because they are being difficult. If this happens, call it out immediately as a failure of the game mechanics and ask the room how they would solve this if they were actually trying to maximize their own score. You want them to see that rationality demands trade, but the structure prevents it. A third risk is that the group will spend too much time on the first two rounds and rush the bargaining round. You need to keep strict time. The bargaining round is the only one that matters for your specific learning goal. If they run out of time there, the session fails.

  Here is what would change my mind about this design. If you run this and the Utilitarians successfully convince the Deontologists to accept the trade by reframing the points as "moral credit" that can be spent later, then the design has failed to capture the incommensurability. The whole point is that rights violations cannot be banked against future welfare gains. If the participants find a way to normalize the currencies, you have accidentally taught them that moral uncertainty is solvable via meta-utility, which is the opposite of your goal. I am also uncertain about whether twelve people is enough to generate the necessary friction. With only four people per party, one defector can collapse the party's stance. If one Utilitarian decides they sympathize with the Deontologists, the party cohesion breaks. You might need to enforce party discipline by giving the party a single shared score rather than individual scores, so they are forced to caucus before speaking. If you do not do this, the game becomes about individual persuasion rather than theoretical conflict.

  My reasoning is shakiest on the debrief transition. I am assuming that the frustration of being unable to trade points will naturally translate into an understanding of the exchange rate problem. It is possible that participants will just leave thinking that moral theories are stubborn and negotiation is hard, without grasping the deeper issue of unit incompatibility. To mitigate this, you need to be very explicit in the debrief about why the trade failed. Do not let them say "we just couldn't agree." Push them to say "we could not agree because my points are not your points." If you do not hammer that specific distinction, the session will revert to the standard nodding along that you are trying to avoid. You might also consider adding a fourth round where you force an exchange rate, say one right violation equals fifty utility points, and ask them to vote on whether that feels acceptable. Their discomfort with setting that rate is further evidence of the problem.

  Finally, be prepared for the possibility that the game feels too artificial to matter. If the projects are abstract, like Project X and Project Y, people will not feel the moral weight. You should write the project descriptions to be concrete and evocative. Project X should be something like "fund a medical trial that saves many lives but uses data from unethical past experiments." Project Y should be "fund a slower medical trial with ethically sourced data." The more real the stakes feel, the harder the refusal to trade will be, and the more palpable the exchange rate problem becomes. If you keep it abstract with points and numbers, they will treat it as a math puzzle. If you make it moral, they will treat it as a moral problem. You want the latter. Good luck with the session, and watch closely to see if they try to invent a meta-currency to solve the deadlock. That attempt is where the learning happens.
