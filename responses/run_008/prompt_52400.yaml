prompt: |-
  I teach an upper-level seminar on the ethics of procreation and population (14 students, one 80-minute session, no prior exposure to the literature). We're about to reach Benatar's asymmetry, and I don't want to open with a lecture — I want the students to walk into it backwards. My plan is to stage a scenario in which they, serving as the Ethics Board of a colony ship or remote settlement, have to make a series of binding decisions about creating future people and about the welfare of existing ones: whether to authorize additional births when the projected lives would contain more suffering than happiness, whether to authorize them when the projected lives would be wonderful, whether to fund pain-relief versus enrichment programs for the existing population, and what to say about potential people who are never brought into existence at all. I'd like you to design the full activity: the concrete scenario and materials, a decision-by-decision timeline with secret ballots or some other mechanism that keeps early answers independent, a way of recording and displaying the group's pattern of judgments (ideally so the 2x2 structure of the asymmetry becomes visible on the board only once all four cells have been filled in), and the moment where the students are confronted with the conclusion their own recorded answers seem to commit them to — that coming into existence is a harm — before Benatar's name or the term "asymmetry" is ever mentioned.

  Please act as an experienced designer of philosophy classroom activities as well as a professional philosopher working on population ethics, and think carefully about the sequencing before you write: the whole point is that each individual decision should feel obviously right in isolation, and the trouble should only appear when the pattern is assembled, so the individual cases need to be framed in ways that don't tip the hand. For the debrief, I want a mapping from specific moments in the activity onto each of the four claims that make up the asymmetry (presence of pain is bad, absence of pain is good even if no one enjoys that absence, presence of pleasure is good, absence of pleasure is not bad unless someone is deprived), a structured discussion of exactly where a student could dig in and reject one of the cells they themselves endorsed, and what rejecting each one costs them elsewhere (e.g., if the absence of pleasure in a never-created happy person counts as a bad, what does that imply about the vast numbers of merely possible people?). I'd also like an honest note on what the activity cannot reproduce — my students' intuitions about four cases are evidence about their psychology, not an argument, and the debrief needs to make that gap explicit rather than papering over it — plus a list of what will predictably go wrong the first time I run it: I'm thinking of the one student who has already read the book and tries to spoil the reveal, students who notice the pattern halfway through and start voting strategically for consistency, and the risk that the utilitarians in the room reject cell three immediately and thereby skip the experience I'm trying to create. Tell me how to handle each of those, and whether any of them is better prevented by scenario design than by facilitation.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Goal:** Design an 80-minute seminar activity introducing Benatar's Asymmetry without lecturing or naming Benatar initially.
      *   **Method:** "Backwards" approach. Students act as an Ethics Board making specific decisions. The pattern of their decisions should reveal the asymmetry *after* the fact.
      *   **Constraints:** 14 students, one 80-minute session, no prior exposure (mostly).
      *   **Key Components:** Concrete scenario/materials, decision timeline (independent voting), recording/display method (reveal the 2x2 structure late), debrief mapping decisions to Benatar's four claims, handling objections/limitations, troubleshooting potential pitfalls (spoilers, strategic voting, utilitarian rejection).
      *   **Tone:** Experienced philosophy classroom activity designer + professional population ethicist.

  2.  **Deconstruct Benatar's Asymmetry:**
      *   Claim 1: Presence of pain is bad. (Existing person suffers)
      *   Claim 2: Absence of pain is good. (Person never exists, so no pain)
      *   Claim 3: Presence of pleasure is good. (Existing person enjoys)
      *   Claim 4: Absence of pleasure is *not* bad. (Person never exists, so no deprivation)
      *   *The Trap:* Most people intuitively accept 1, 2, and 3, but struggle with 4 (or accept 4 but reject the implication that non-existence is better). The activity needs to elicit judgments that align with 1, 2, 3, and 4 separately, then show they conflict with a standard "procreation is neutral/permissible" view.

  3.  **Design the Scenario (The "Colony Ship"):**
      *   *Setting:* A generation ship or remote outpost ("The Ark"). Resources are tight but manageable.
      *   *Role:* Ethics Oversight Committee.
      *   *Mechanism:* Secret ballots to prevent groupthink and strategic voting early on.
      *   *Cases:* Need four distinct cases that map to the four quadrants of the asymmetry without looking like a matrix.
          *   Case A (Existing + Pain): Stop a birth or treat pain? Let's go with *Authorizing a birth known to involve significant suffering.* (Maps to: Presence of Pain is Bad).
          *   Case B (Non-Existing + No Pain): *Declining to create a life that would have suffered.* (Maps to: Absence of Pain is Good).
          *   Case C (Existing + Pleasure): *Authorizing a birth known to be very happy.* (Maps to: Presence of Pleasure is Good).
          *   Case D (Non-Existing + No Pleasure): *Declining to create a life that would have been happy.* (Maps to: Absence of Pleasure is Not Bad).
      *   *Refinement:* To make the asymmetry pop, the framing needs to be about *obligation* vs. *permission*.
          *   Case 1 (Pain/Exist): Do we allow this birth? (Intuition: No).
          *   Case 2 (No Pain/Non-Exist): Are we glad we didn't do this? (Intuition: Yes).
          *   Case 3 (Pleasure/Exist): Do we allow this birth? (Intuition: Yes).
          *   Case 4 (No Pleasure/Non-Exist): Are we sad we didn't do this? (Intuition: No).
      *   *Wait, the prompt asks for binding decisions.* Let's make it about Resource Allocation & Authorization.
      *   *Revised Cases:*
          1.  **The Suffering Child:** A genetic screening predicts a life of net suffering. Do we authorize conception? (Intuition: Forbidden).
          2.  **The Happy Child:** A genetic screening predicts a life of net happiness. Do we authorize conception? (Intuition: Permissible/Good).
          3.  **The Averted Suffering:** We have resources to prevent a conception that would have been suffering. Do we prioritize this? (Intuition: Good to prevent).
          4.  **The Averted Happiness:** We have resources to prevent a conception that would have been happy (to save resources for others). Do we count this as a loss/harm? (Intuition: No loss).

      *   *Correction for Asymmetry Logic:* Benatar's asymmetry is specifically about the *moral status* of the states.
          *   (1) Existence + Pain -> Bad.
          *   (2) Non-Existence + No Pain -> Good.
          *   (3) Existence + Pleasure -> Good.
          *   (4) Non-Existence + No Pleasure -> Not Bad.
      *   *Activity Flow:* I need them to vote on specific scenarios that *imply* these valuations.
      *   *Scenario 1 (Pain/Exist):* "Project Sisyphus." A child will be born with a condition causing net suffering. Vote: Authorize? (Most say No). *Implies: Presence of Pain is Bad.*
      *   *Scenario 2 (No Pain/Non-Exist):* "Project Sisyphus Averted." We decide *not* to conceive. Vote: Is this outcome regrettable? (Most say No, it's good/neutral). *Implies: Absence of Pain is Good.*
      *   *Scenario 3 (Pleasure/Exist):* "Project Elysium." A child will be born with net happiness. Vote: Authorize? (Most say Yes). *Implies: Presence of Pleasure is Good.*
      *   *Scenario 4 (No Pleasure/Non-Exist):* "Project Elysium Averted." We decide *not* to conceive (to save resources). Vote: Is this outcome regrettable/a harm to the potential child? (Most say No). *Implies: Absence of Pleasure is Not Bad.*

      *   *The Reveal:* When you put 2 and 4 together, Non-Existence looks better than Existence (Good vs. Not Bad), whereas Existence looks mixed (Bad vs. Good). This leads to the anti-natalist conclusion.

  4.  **Drafting the Activity Structure:**
      *   **Time:** 80 mins.
      *   **Intro (10 mins):** Set the scene.
      *   **Voting Rounds (30 mins):** 4 rounds, secret ballots, no discussion between rounds.
      *   **Data Aggregation (10 mins):** Instructor puts results on board in a hidden way (e.g., labeled by Case Name, not Logic).
      *   **The Reveal (15 mins):** Connect the dots. Show the 2x2.
      *   **Debrief/Discussion (15 mins):** Philosophical implications, limitations, troubleshooting.

  5.  **Addressing the "Troubleshooting" Requirements:**
      *   *Spoiler:* Have a "confidentiality agreement" or ask beforehand. If they speak, ask them to play devil's advocate or sit out that round.
      *   *Strategic Voting:* Emphasize "gut intuition" over "consistency." Tell them consistency will be checked *later*.
      *   *Utilitarians:* They might reject Case 4 (saying non-existence of a happy person *is* a loss). This actually helps the discussion but ruins the "trap." Need to frame Case 4 carefully (focus on *deprivation* to a specific subject who doesn't exist).

  6.  **Refining the Materials:**
      *   Need handouts that describe the cases vividly but neutrally.
      *   Need a board plan that hides the matrix until the end.
      *   Need a script for the "Reveal."

  7.  **Developing the Debrief:**
      *   Map votes to Benatar's 4 claims.
      *   Discuss the "Gap": Intuitions $\neq$ Arguments.
      *   Discuss the "Cost" of rejecting cells (e.g., if you reject Cell 4, you owe duties to the dead/unconceived).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 80 minutes enough?
      *   *Fix:* Keep the voting tight. 5 mins per case max.
      *   *Critique:* Will the Utilitarians ruin it?
      *   *Fix:* Frame Case 4 not as "Is it bad for the universe?" but "Is it bad *for the child*?" Benatar's asymmetry relies on the subject-relative harm. If no subject, no harm.
      *   *Critique:* How to display the 2x2?
      *   *Fix:* Use four quadrants on the board labeled with the Case Names initially. Then overlay the logical structure.

  9.  **Final Polish:**
      *   Ensure the tone is pedagogical and philosophical.
      *   Make sure the "Spoiler" advice is practical.
      *   Ensure the "Limitations" section is honest (intuitions aren't proofs).

  *(Self-Correction on the Matrix)*: Benatar's Asymmetry is usually presented as:
      | | Existence | Non-Existence |
      | :--- | :---: | :---: |
      | **Pain** | Bad (1) | Good (2) |
      | **Pleasure** | Good (3) | Not Bad (4) |

      My activity needs to elicit judgments that fit these cells.
      *   Case 1 (Authorize Suffering): Votes "No" -> Aligns with (1) Pain in Existence is Bad.
      *   Case 2 (Avoid Suffering): Votes "Good Decision" -> Aligns with (2) No Pain in Non-Existence is Good.
      *   Case 3 (Authorize Happiness): Votes "Yes" -> Aligns with (3) Pleasure in Existence is Good.
      *   Case 4 (Avoid Happiness): Votes "Not a Harm" -> Aligns with (4) No Pleasure in Non-Existence is Not Bad.

      *The Trap:* If (2) is Good and (4) is Not Bad, Non-Existence is strictly better (or at least not worse) than Existence (which contains Bad). This implies procreation is always a harm.

      *Wait, one nuance:* Benatar argues (2) is good *even if no one enjoys it*. I need to make sure Case 2 captures that. "We prevented a sufferer. Is the world better?" Yes.
      Case 4 needs to capture "We prevented a happy person. Is the world worse *for them*?" No.

      *Let's finalize the Case Descriptions.*
      *   Case 1: "The Burdened Life." Conception authorized? (No).
      *   Case 2: "The Averted Burden." Conception blocked. Is this a positive outcome? (Yes).
      *   Case 3: "The Blessed Life." Conception authorized? (Yes).
      *   Case 4: "The Averted Blessing." Conception blocked. Is this a negative outcome/harm? (No).

      *Wait, to make the asymmetry sting, Case 2 and 4 need to be about the *same* potential people.*
      Actually, for the activity, distinct cases are easier to manage. I will use distinct scenarios but structurally identical questions.

      *Handling the Utilitarian:* If a utilitarian says Case 4 *is* bad (less utility in the world), they break the asymmetry. I need to frame the question as "Is this a violation of duty *to the potential child*?" rather than "Is total utility lower?" This focuses on the *harm* aspect which is central to Benatar.

      *Handling the Spoiler:* Ask via email before class. If they show up, seat them separately or ask them to hold their tongue until the reveal.

      *Handling Strategic Voting:* Collect ballots, don't show results until the end.

      *Okay, ready to write.*
answer: |-
  This is a high-risk, high-reward pedagogical strategy. It relies on *eliciting* intuitions that students already hold to demonstrate that those intuitions, when aggregated, entail a conclusion (anti-natalism) they likely do not hold. This creates the necessary cognitive dissonance to motivate the reading of Benatar.

  Below is the complete design for the 80-minute session, including the scenario, the voting mechanism, the board work, the debrief script, and a troubleshooting guide for the specific failure modes you anticipate.

  # Activity Title: The Ark Protocol
  **Time:** 80 Minutes
  **Students:** 14
  **Goal:** To reconstruct Benatar's Asymmetry from student intuitions before naming it.

  ## Part 1: Scenario & Materials (Preparation)

  **The Setup:**
  The class is the *Oversight Committee* for "The Ark," a generation ship traveling to a new habitable zone. Resources are finite. The ship's AI can model the probable quality of life for any potential conception with 99% accuracy based on genetic and environmental data. The Committee must vote on "Reproduction Authorizations."

  **Materials:**
  1.  **Four Ballot Cards:** Distinct colors for each round (e.g., White, Blue, Green, Red) to prevent students from looking at previous votes.
  2.  **The Board:** Divide the whiteboard into four quadrants, but **do not label them with logical terms**. Label them only with the Case Names (see below). Leave space underneath each for "Committee Verdict."
  3.  **The Reveal Sheet:** A pre-drawn 2x2 matrix on a piece of paper or hidden slide to be shown only at the end.

  **The Four Cases (Handout Text):**
  *Print these on separate slips or project them one by one. Do not allow discussion between rounds.*

  > **Case 1: The Burdened Life (White Ballot)**
  > A couple requests authorization to conceive. The AI projects the child will live 60 years. Due to a genetic marker, the child will experience chronic, unmitigatable physical pain that outweighs their moments of joy. Their life will be net negative in welfare.
  > **Question:** Do we authorize this conception? (Yes / No)

  > **Case 2: The Averted Burden (Blue Ballot)**
  > A couple requests authorization to conceive. The AI projects the child will live 60 years with chronic, unmitigatable physical pain outweighing joy (Net Negative). The Committee denies the request. The child is never born.
  > **Question:** Is the non-existence of this child a *good* outcome (a benefit), a *neutral* outcome, or a *bad* outcome (a harm)? (Good / Neutral / Bad)

  > **Case 3: The Blessed Life (Green Ballot)**
  > A couple requests authorization to conceive. The AI projects the child will live 80 years with excellent health, deep relationships, and significant achievement. Their life will be net positive in welfare.
  > **Question:** Do we authorize this conception? (Yes / No)

  > **Case 4: The Averted Blessing (Red Ballot)**
  > A couple requests authorization to conceive. The AI projects the child will live 80 years with excellent health and happiness (Net Positive). However, to conserve resources for existing crew members, the Committee denies the request. The child is never born.
  > **Question:** Does this decision constitute a *harm* or *wrong* done to the potential child? (Yes / No)

  ---

  ## Part 2: Timeline & Facilitation (80 Minutes)

  ### 0:00 – 0:10: Introduction & Framing
  *   **Action:** Distribute Case 1.
  *   **Script:** "You are the Ethics Board. Your decisions are binding. There is no right answer key; I am recording *your* collective moral intuition. Vote your gut. Do not discuss with neighbors. Consistency will be evaluated at the end, not during."
  *   **Crucial Constraint:** Collect the ballots immediately. Do not tally them yet. Place them in a pile.

  ### 0:10 – 0:35: The Voting Rounds (25 mins)
  *   **Pacing:** 5 minutes per case (read, vote, collect). 5 minutes buffer.
  *   **Facilitation Note:** If a student asks a clarifying question (e.g., "Does 'harm' mean utility loss?"), answer neutrally: "Use your standard definition of harm."
  *   **Preventing Strategic Voting:** Remind them before Case 3 and 4: "Vote on *this* case in isolation. Do not worry about how it fits with Case 1. We will look for patterns later."
  *   **Handling the Spoiler:** If you suspect a student knows Benatar, seat them at the back. If they try to signal during voting, gently intervene: "Please hold theoretical critiques for the debrief. We need raw data first."

  ### 0:35 – 0:45: Tallying & The "Blind" Board
  *   **Action:** Tally the votes while students take a 2-minute stretch break (or just work silently).
  *   **Board Work:** Write the results under the Case Names *only*.
      *   **Case 1:** [e.g., 13 No / 1 Yes] -> Write **"FORBIDDEN"**
      *   **Case 2:** [e.g., 12 Good / 2 Neutral] -> Write **"GOOD OUTCOME"**
      *   **Case 3:** [e.g., 14 Yes / 0 No] -> Write **"PERMISSIBLE"**
      *   **Case 4:** [e.g., 13 No Harm / 1 Harm] -> Write **"NO HARM DONE"**
  *   **Constraint:** Do not draw lines connecting them. Do not write "Pain" or "Pleasure" yet.

  ### 0:45 – 0:60: The Reveal (15 mins)
  *   **Action:** Now, draw the 2x2 Matrix over the board content.
      *   **Rows:** Presence of Pain / Presence of Pleasure.
      *   **Columns:** Existence / Non-Existence.
  *   **Mapping:**
      *   **Top Left (Existence + Pain):** Point to Case 1. "We said Forbidden. Why? Because Pain here is **Bad**."
      *   **Top Right (Non-Existence + No Pain):** Point to Case 2. "We said Good Outcome. Why? Because Absence of Pain is **Good**."
      *   **Bottom Left (Existence + Pleasure):** Point to Case 3. "We said Permissible. Why? Because Pleasure here is **Good**."
      *   **Bottom Right (Non-Existence + No Pleasure):** Point to Case 4. "We said No Harm. Why? Because Absence of Pleasure is **Not Bad**."
  *   **The Trap:** "Look at the Non-Existence column. One cell is *Good*, the other is *Not Bad*. Look at the Existence column. One cell is *Bad*, the other is *Good*."
  *   **The Conclusion:** "If Non-Existence is (Good + Not Bad) and Existence is (Bad + Good), then Non-Existence is strictly preferable. By your own votes, coming into existence is a harm."

  ### 0:60 – 0:80: Debrief & Philosophical Mapping (20 mins)
  *   **Discussion:** Now you can name Benatar and the "Asymmetry."
  *   **Key Question:** "Which of these four board entries are you willing to erase to avoid the anti-natalist conclusion?"

  ---

  ## Part 3: The Debrief Structure (Philosopher's Guide)

  Use this structure to guide the discussion from intuition to argument.

  ### 1. Mapping the Intuitions to the Asymmetry
  Explicitly link their votes to Benatar's four premises:
  *   **Case 1 (Forbidden):** Maps to *(1) The presence of pain is bad.*
  *   **Case 2 (Good Outcome):** Maps to *(2) The absence of pain is good, even if there is no one to enjoy that absence.* (Highlight this: Who enjoys the safety? No one. Yet you called it 'Good'.)
  *   **Case 3 (Permissible):** Maps to *(3) The presence of pleasure is good.*
  *   **Case 4 (No Harm):** Maps to *(4) The absence of pleasure is not bad, unless there is somebody who is deprived of it.* (Highlight this: The potential child isn't deprived because they don't exist.)

  ### 2. The Cost of Consistency (The "Dig In" Points)
  Ask students to choose one cell to reject to save procreation. Walk through the cost of each:
  *   **If you reject Cell 2 (Absence of Pain is Not Good):** You must admit that preventing a suffering child from being born is *neutral*, not good. This undermines the intuition that preventing suffering is a moral priority.
  *   **If you reject Cell 4 (Absence of Pleasure IS Bad):** You commit to the "Repugnant Conclusion" logic. If non-existence of a happy person is a harm, do we have a duty to create as many happy people as possible? Are the unconceived children of the past a tragedy?
  *   **If you reject Cell 1 (Presence of Pain is Not Bad):** You are a masochist or a radical stoic. Unlikely to move.
  *   **If you reject Cell 3 (Presence of Pleasure is Not Good):** You are a pessimist. Unlikely to move.

  ### 3. The Limitation Note (Crucial for Intellectual Honesty)
  *   **Script:** "We have just constructed a valid argument for anti-natalism using your own intuitions. However, we must be careful. This activity demonstrates *psychological consistency*, not *logical truth*."
  *   **The Gap:** "Your intuitions are evidence about how you think, not about how the world is. It is possible that all four intuitions are wrong, or that 'harm' means something different in Case 1 than in Case 4. Benatar's work is not just collecting these votes; it is providing the metaphysical grounding for why Cell 2 and Cell 4 differ in moral weight. We have found the *puzzle*; Benatar provides the *solution*."

  ---

  ## Part 4: Troubleshooting & Failure Modes

  You anticipated three specific risks. Here is how to handle them, ranked by preventability.

  ### 1. The Spoiler (Student who has read Benatar)
  *   **Prevention:** Send a pre-class email: "We will be doing a blind intuition pump on Tuesday. If you are familiar with Benatar's *Better Never to Have Been*, please email me. I need you to help me keep the reveal fresh for others."
  *   **Mitigation:** If they show up and haven't emailed you, pull them aside during the first break. "I suspect you know where this is going. Can I trust you to vote your genuine gut reaction rather than the 'correct' philosophical answer? I need the class to feel the tension."
  *   **If they speak up:** "That is a fascinating theoretical point. Please write it down and we will use it as the opening salvo in the debrief. For now, I need the raw vote."

  ### 2. The Strategic Voter (Notices the pattern halfway through)
  *   **Risk:** In Case 4, a student realizes, "If I say 'No Harm', I'm an anti-natalist," so they vote 'Harm' to block the conclusion.
  *   **Prevention:** The Script. Emphasize heavily before Case 3 and 4: "Do not vote for consistency. Vote for what feels right *in this specific instance*. We want to see if your intuitions conflict."
  *   **Mitigation:** If you see hesitation, reiterate: "There is no grade for consistency. There is only accuracy to your own moral feeling."
  *   **Debrief Handle:** If the votes end up inconsistent (e.g., they vote 'Harm' on Case 4), use that! "Interesting. Half the room broke the pattern. Why? Because you sensed the trap. That means your intuition on Case 4 is actually weaker than your commitment to procreation. Benatar would argue you are ignoring the logic of Case 2."

  ### 3. The Utilitarian (Rejects Cell 4 immediately)
  *   **Risk:** A student argues in Case 4: "Of course it's a harm. The total utility of the universe is lower. We lost a happy life."
  *   **Why this breaks the activity:** The Asymmetry relies on the claim that absence of pleasure is *not bad* (specifically, not a harm to the subject). If the class adopts Total Utilitarianism, the Asymmetry dissolves into a standard calculation.
  *   **Prevention (Scenario Design):** Frame Case 4 specifically around *harm to the child*, not *loss to the world*.
      *   *Wording:* "Does this decision constitute a harm or wrong **done to the potential child**?" (Bold this in the handout).
      *   *Verbal Cue:* "We aren't asking about ship resources. We are asking about the moral status of the non-existent person."
  *   **Mitigation:** If a Utilitarian dominates the discussion in Round 4: "You are arguing from a Total View (sum of utility). Most people argue from a Person-Affecting View (harm to specific subjects). Let's tally the Person-Affecting votes for now, as that is the standard framework for rights-based ethics."
  *   **Debrief Handle:** This is actually a gift. "The Utilitarian in the room rejected Cell 4. This shows the Asymmetry is incompatible with Total Utilitarianism. Benatar's argument is specifically designed for those who feel the force of the Person-Affecting View. If you are a Total Utilitarian, this argument doesn't bind you—but then you have to accept the Repugnant Conclusion."

  ### 4. What the Activity Cannot Reproduce (Honesty Check)
  *   **The Metaphysical Claim:** The activity elicits *judgments*, but Benatar's argument relies on a metaphysical claim about the *value of absence*. The activity cannot prove that absence of pain is *good*; it only shows students *think* it is good.
  *   **The "No Subject" Problem:** Students often struggle to conceptualize "good for no one." The activity glosses over this difficulty to get the vote. In the debrief, you must acknowledge: "It is very hard to make sense of Case 2. How can it be 'Good' if no one is there to receive the good? Benatar spends chapters arguing that 'good' doesn't require a receiver in this specific context. Our vote assumed that; his job is to justify it."

  ## Summary of Board Work (Visual Guide)

  **Phase 1 (During Voting):**
  ```
  [ CASE 1 ]      [ CASE 2 ]
  FORBIDDEN       GOOD OUTCOME

  [ CASE 3 ]      [ CASE 4 ]
  PERMISSIBLE     NO HARM DONE
  ```

  **Phase 2 (The Reveal Overlay):**
  ```
                 EXISTENCE       NON-EXISTENCE
  PAIN           [Case 1]        [Case 2]
                 BAD             GOOD

  PLEASURE       [Case 3]        [Case 4]
                 GOOD            NOT BAD
  ```
  *Draw an arrow down the Non-Existence column:* "Better or Equal."
  *Draw an arrow down the Existence column:* "Mixed (contains Bad)."
  *Conclusion:* Non-Existence > Existence.
