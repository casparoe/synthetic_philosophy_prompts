          *   **Constraints:** No secondary scholarship/citations, minimal quotations (only those provided by user), refer to scenes by description.

  2.  **Deconstruct the Confucian Lens vs. *King Lear*:**
      *   *Confucianism:* Social order depends on everyone fulfilling their roles correctly (*zhengming* - rectification of names). Filial piety (*xiao*) is the root. Ritual (*li*) maintains harmony. The self is relational.
      *   *Lear:* A king gives up power but expects the respect of the role. Daughters betray or uphold duty. Chaos ensues when roles are confused.
      *   *Tension:* Confucianism assumes roles *can* be fulfilled to create order. *Lear* suggests roles might be inherently fragile or tragic when conflicting duties arise (e.g., loyalty to father vs. loyalty to husband/state).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the pairing. State the thesis stance immediately.
          *   *Stance:* The play *transforms* the Confucian picture. It validates the necessity of roles but exposes the tragedy when those roles rely on performative validation rather than substantive duty, and when the analogy between family and state breaks down under the weight of absolute power.

      *   **The Love Test (Corruption of *Li*):**
          *   User's prompt: Lear converts ritual into auction. Cordelia's "Nothing."
          *   *Analysis:* In Confucianism, *li* isn't just empty form; it's the vessel of sincerity. Lear demands the *form* (public declaration) without the *substance* (private bond), effectively inverting *li*.
          *   *Cordelia:* Is she remonstrating? Yes. In Confucian thought, a child *should* remonstrate with a parent if the parent is wrong, but gently. Cordelia is blunt. Her "Nothing" protects the sanctity of the bond from being commodified. It's not anti-role; it's pro-substance. She refuses to let the role become a transaction.

      *   **Rectification of Names (Lear vs. Steward):**
          *   User's prompt: "My lady's father." Crisis of names.
          *   *Analysis:* This is the core Confucian crisis. If the name "King" implies authority, and Lear has no authority, is he still King? Confucianism says the reality must match the name. Lear wants the name without the responsibility (kingship) but with the privilege (fatherhood/authority). The steward's answer highlights that Lear is now defined only by his relation to Goneril, not by his intrinsic title. The social fabric unravels because the "names" are floating free of "realities."

      *   **The Storm Scene (The Crucial Pivot):**
          *   User's prompt: Pre-social humanity vs. Confucian diagnosis of disorder?
          *   *Analysis:* This is where the lens strains most. A strict Confucian reading might see the storm as cosmic displeasure at the violation of order (Heaven's mandate). However, Lear's madness strips him of *all* roles (King, Father, Master).
          *   *Stance:* It is *not* a discovery of a pre-social atom. It is the discovery of the *bare human* beneath the failed roles. Confucianism says you *are* your roles. Lear shows that when roles fail, something remains (suffering, empathy for the "poor naked wretches"). This challenges the idea that the self is *exhausted* by roles. The storm is the external manifestation of the internal collapse of the relational self. It supports the Confucian idea that personal disorder creates cosmic/natural disorder, but it refutes the idea that without roles, there is no moral self. Lear becomes *more* moral (empathetic) when he is *less* role-bound.

      *   **Gloucester/Edmund Subplot:**
          *   User's prompt:* Edmund attacks roles as convention. Villainy. Children saving fathers outside forms.
          *   *Analysis:* Edmund represents the anti-Confucian extreme: Nature as brute competition, roles as shackles. His defeat suggests the play rejects pure individualism.
          *   *Complication:* Edgar and Cordelia save their fathers outside sanctioned forms (Edgar disguised, Cordelia exiled/invading). Confucianism values the *means* (propriety) as much as the *end*. If you must break ritual to save the father, is the virtue preserved?
          *   *Synthesis:* The play suggests that when the system is corrupted, rigid adherence to *li* is impossible. Virtue requires improvisation. This transforms Confucianism from a rigid structuralism to a tragic humanism where duty persists even when structures collapse.

      *   **Conclusion (What Drama Shows):**
          *   User's prompt:* Family/State analogy.
          *   *Analysis:* Confucianism relies on the isomorphism of Family and State (Father is to Son as King is to Subject).
          *   *Dramatic Insight:* *Lear* shows the danger of this analogy. Lear treats his kingdom like a family (inheritance based on love) and his family like a kingdom (demanding absolute obedience). The tragedy arises because the logic of the family (unconditional love) and the logic of the state (power/justice) are not perfectly interchangeable. Drama shows the *pain* of this conflation in a way a philosophical treatise cannot. We feel the cost of the political becoming personal.

