      *   *Specific Intent:* Morally, the outcome (destruction) matters more than the specific thought process, though intent distinguishes accident from design. Still, the *result* of group destruction is key. Let's keep it high but maybe secondary to the actual destruction. Actually, for "genocide" specifically, the *intent to destroy* is the moral core. Let's make this *Decisive*.
      *   *Numbers:* Morally, every life matters, but the definition of genocide isn't about quotas. However, scale indicates severity. -> *Minor.*
      *   *Geopolitics:* Should be zero. Irrelevant to morality. -> *Marginal.*
