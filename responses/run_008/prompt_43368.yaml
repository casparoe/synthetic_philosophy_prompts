answer: |-
  ### Part 1: Real-World Ranking (How Naming Actually Happens)

  **1. Geopolitics of the Perpetrators**
  *   **Tier:** Decisive
  *   **Justification:** Powerful states with veto influence frequently block the label at the UN or withhold diplomatic recognition to protect allies, regardless of the factual evidence on the ground.

  **2. Evidence of Specific Intent**
  *   **Tier:** Major
  *   **Justification:** Courts and legal scholars treat the *dolus specialis* (specific intent to destroy a group) as the absolute gatekeeper, meaning cases with high death tolls but ambiguous motives often fail to qualify legally.

  **3. Persistence of Victim Advocacy**
  *   **Tier:** Major
  *   **Justification:** Organized diasporas and survivor groups are often the only engine capable of sustaining the political pressure required to force a reluctant government or court to apply the label.

  **4. Sheer Number of Victims**
  *   **Tier:** Minor
  *   **Justification:** High body counts alone frequently fail to secure the designation if the victims do not belong to a protected group or if the killing is classified as a byproduct of war rather than group destruction.

  **5. Fit with Lemkin's Broader Conception**
  *   **Tier:** Marginal
  *   **Justification:** Because the final 1948 text explicitly excluded cultural destruction to secure state ratification, official bodies rarely use the erasure of language or institutions as a primary basis for the legal label.

  ***

  ### Part 2: Ideal-World Ranking (How Naming Should Happen)

  **1. Evidence of Specific Intent**
  *   **Tier:** Decisive
  *   **Justification:** The moral core of the crime is the conscious aim to erase a people, which distinguishes genocide from other forms of mass violence regardless of the method used.

  **2. Fit with Lemkin's Broader Conception**
  *   **Tier:** Major
  *   **Justification:** A morally defensible definition must account for the death of a group's identity and culture, as this achieves the perpetrator's goal of destruction even without immediate mass killing.

  **3. Sheer Number of Victims**
  *   **Tier:** Minor
  *   **Justification:** While scale indicates severity, the moral wrong of attempting to eliminate a group exists even if the perpetrator is stopped before achieving a high death toll.

  **4. Persistence of Victim Advocacy**
  *   **Tier:** Minor
  *   **Justification:** The truth of an atrocity should be objective and recognized based on evidence, not contingent on how well-organized or loud the surviving community happens to be.

  **5. Geopolitics of the Perpetrators**
  *   **Tier:** Marginal
  *   **Justification:** Political convenience or alliance structures are morally irrelevant to the classification of human suffering and should hold no weight in naming decisions.

  ***

  ### Part 3: Analyzing the Divergences

  The most dramatic shift between these two lists is **Geopolitics**, which moves from *Decisive* in the real world to *Marginal* in the ideal. This divergence explains why audiences often feel cynical when they hear a presentation like this; they intuitively understand that the "truth" is being filtered through power dynamics. However, for your specific thesis about the "two jobs" of the word, the most instructive divergence is **Fit with Lemkin's Broader Conception**.

  In the real world, this factor is *Marginal* because the 1948 Convention sacrificed Lemkin's vision of cultural destruction to get nations to sign the treaty. In the ideal world, it is *Major* because it captures the moral reality of what it means to destroy a people. This specific gap is where your thesis lives: the legal job requires a narrow focus on physical killing of specific groups to secure convictions, while the moral job requires a broad focus on cultural erasure to capture the full harm. When a speaker uses the moral definition but the audience evaluates it using the legal definition (or vice versa), the conversation fractures. By highlighting this specific divergence, you show that the confusion isn't just about politics; it's baked into the history of the word itself.

  ***

  ### Part 4: The Variance Number

  **0.3**

  I attribute 30% of the real-world variance in naming to legal criteria and 70% to political ones. While international courts (like the ICJ or ICTR) adhere strictly to the 30% legal framework, the vast majority of "naming" occurs in parliaments, press outlets, and diplomatic statements where political will determines whether the legal machinery is even allowed to start. If the legal criteria were the primary driver, we would see consistent labeling across similar cases; instead, we see inconsistent application that correlates strongly with the strategic interests of powerful states.

  ***

  ### Part 5: The Strongest Objection to Your Thesis

  **The Objection:**
  "The separation between the narrow legal job and the broad moral job is not a bug, but a feature. If we dilute the legal definition to match Lemkin's broader moral conception, the term becomes so vague that it loses its utility as a prosecutorial tool. We *need* the two jobs to be apart so that the legal hammer remains sharp enough to convict individuals, even if the moral language remains broad enough to describe historical suffering."

  **How to Address It:**
  Acknowledge that precision is necessary for criminal trials—you cannot send someone to prison based on a vague moral feeling. However, argue that the problem arises when we use the *legal* narrowness to silence the *moral* discussion in public spaces. Your point is not that courts should prosecute cultural genocide tomorrow, but that public remembrance events should not be held hostage by the limitations of criminal law. You can validate the need for legal precision while insisting that community remembrance is the proper place to restore Lemkin's broader moral vision.
