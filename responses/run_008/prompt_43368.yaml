      *   *Constraint Check:* No citations. No specific live conflict adjudication (use historical examples like Cambodia/Political groups or Cultural Genocide exclusion generally).
      *   *Structure:* Follow the prompt's order (Ranking 1, Ranking 2, Divergences, Number, Objection).

      *Self-Correction on Factor 1 (Intent):* In the real world, intent is hard to prove. Often, "genocide" is applied politically *without* proven intent, or withheld *despite* evidence. So Geopolitics is definitely Decisive. Intent is Major (it's the hurdle, but politics decides if we jump it).
      *Self-Correction on Factor 5 (Lemkin):* In the real world, this is Marginal because the Convention explicitly removed cultural genocide. In the ideal world, it should be Major because Lemkin's original insight was about the "sociological" death of a group.
      *Self-Correction on the Number:* 0.2 or 0.3 feels right. If it were 0.5, law would matter more. If 0.1, law would matter less. Given that ICTR/ICTY did convict on genocide, law *does* work in courts. But "naming" by governments/press is mostly political. I'll stick with 0.3.

      *Refining the Objection:* Make sure it's charitable. The objection isn't that morality doesn't matter, but that *legal utility* requires narrowness.

  9.  **Final Polish:** Ensure the transition between sections is smooth. Make sure the "one-sentence justification" constraint is met strictly. (Wait, prompt says "one-sentence justification grounded in how naming decisions actually get made". I need to be careful not to write run-on sentences).

