      2.  Lemkin's Broader Conception (Major) - Destroying a culture is destroying the group; the moral harm includes identity erasure.
      3.  Numbers (Minor) - Scale matters for severity, but a small group erased is still genocide.
      4.  Victim Advocacy (Minor) - Truth should be objective, not dependent on lobbying power.
      5.  Geopolitics (Marginal) - Political convenience should never dictate moral truth.

  5.  **Drafting Task 3: Divergences:**
      *   *Biggest Mover:* Geopolitics (Decisive -> Marginal). This is the cynicism vs. idealism gap.
      *   *Second Mover:* Lemkin's Broader Conception (Marginal -> Major). This is the Legal vs. Moral gap.
      *   *Most Instructive:* The Lemkin one. It directly supports the user's thesis about the "two jobs." Geopolitics is just corruption/power; the Lemkin gap is about the *definition* itself changing meaning.
      *   *Explanation:* The legal text sacrificed Lemkin's vision for Cold War consensus (excluding culture/political groups). The public uses the moral vision; the lawyers use the text.

  6.  **Drafting Task 4: The Number (Legal vs. Political Variance):**
