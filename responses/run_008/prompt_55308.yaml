answer: |-
  Bradley's regress arises when we ask what unifies the constituents of a proposition, such as $a$ standing in relation $R$ to $b$. If we treat the connection between $R$ and its relata as requiring a further relation $R'$, and the connection of $R'$ as requiring $R''$, we appear to launch an infinite chain that prevents the proposition from ever achieving actual unity. To resolve this, we must distinguish between two readings of the series. On the first reading, the ontological inflation reading, each step in the chain introduces a new, distinct entity into the world; $R'$ is a new universal distinct from $R$, and $R''$ is distinct from $R'$. This reading renders the regress vicious because unity is perpetually deferred across an ever-expanding ontology. On the second reading, the structural redescription reading, the successive relations are not new entities but merely the original connection redescribed at higher logical orders. Here, $R'$ is not a new tie but simply $R$ considered as relating; $R''$ is that same relating considered as an occurrence. I argue that the second reading is the correct one, and on this reading, the regress is benign.

  Under the structural redescription reading, the regress does not generate new ontology because the "further relations" are logical artifacts of analysis rather than metaphysical constituents of the fact. The chain does not extend outward into infinity but inward into the structure of the original proposition. Consequently, the regress bottoms out not in a further entity, but in the proposition's own unity. This structure is well-founded in precisely the way a recursive definition is well-founded: a recursive function defines a value in terms of previous values but terminates at a base case that requires no further recursion. Similarly, the analysis of the proposition generates higher-order descriptions of the tie, but these terminate at the base case of the fact itself. The fact $aRb$ is the base case; it is the ontological bedrock where the relating actually occurs. The infinite series exists only as a potentiality of logical description, not as an actuality of metaphysical composition. Therefore, the unity of the proposition is not something achieved at the end of the chain, but something presupposed at the beginning that makes the chain intelligible.

  This commitment leaves the unity of the proposition as primitive; it cannot be analyzed into non-propositional components without triggering the regress again. Some might view this primitiveness as a theoretical failure, but for a friend of facts, it is a modest and necessary cost. Realism about facts posits that the world is composed of unified states of affairs, not just lists of objects and properties. To demand an analysis of the unity of a fact in terms of things that are not themselves unified facts is to demand that the fundamental be explained by the derivative. Every metaphysical system must rest on primitives that resist further analysis, and for the factual realist, the unity of the fact is the appropriate stopping point. Accepting this primitiveness is not an embarrassment but a recognition of the categorial distinctness of the fact. The theory pays a small price in unanalyzability to secure a coherent ontology that avoids the vicious infinite deferment of truth-makers.

  The shakiest step in this defense is the insistence that higher-order relations add nothing ontologically, since distinguishing a relation's being from its relating risks collapsing back into the dualism that generates the regress.
