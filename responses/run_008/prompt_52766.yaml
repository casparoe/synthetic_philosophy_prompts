answer: |-
  ### Q&A Prep Sheet: Eliminative Materialism for ML Engineers

  **1. The "Abstraction Stack" Objection**
  *   **The Question:** "We don't say Python is fake because it compiles to assembly, or that TCP is fake because packets drop. Why is belief 'fake' just because it compiles to weights? Isn't it just a higher-level abstraction?"
  *   **The Reply:** "Great question. The difference is causal structure. Python abstractions map cleanly to underlying operations—a `loop` is still a loop at the assembly level. Folk psychology posits specific causal entities—'beliefs' as discrete propositional stores—that mechanistic interpretability suggests don't exist as unified structures. It's not like Python/Assembly; it's like assuming every script uses a `while` loop when the mechanism actually uses recursion or vectorized math. If the abstraction doesn't map to the causal machinery, it's not a layer, it's a hallucination."
  *   **The Soft Spot:** If belief is defined purely functionally (input/output behavior) rather than structurally, the internal mechanism matters less. You're betting on a structural definition of belief that not everyone accepts.
  *   **Damage if Fumbled:** **Critical.** If you can't distinguish between a valid engineering abstraction and a false ontology, you look like you don't understand how software works.

  **2. The "Performative Contradiction" (Hope Nobody Asks)**
  *   **The Question:** "You're trying to change our *beliefs* right now using arguments you *believe* are true. If belief talk is false, isn't your own thesis self-defeating?"
  *   **The Reply:** "I'm using the legacy API to discuss migrating the backend. I'm exploiting the folk theory to argue for its own elimination. It's a bootstrap problem, not a contradiction. We don't have the new vocabulary yet, so we have to use the old one to build the tools that will replace it. Once we have the mechanistic terms, we stop using the folk terms."
  *   **The Soft Spot:** It sounds like a clever dodge. It doesn't fully resolve the tension that you rely on the very cognitive architecture you're claiming is fundamentally broken to persuade us.
  *   **Damage if Fumbled:** **Critical.** Makes you look logically incoherent.

  **3. The "Linear Probe" Objection**
  *   **The Question:** "The interpretability team literally has linear probes that decode 'user is in France' from latents with 99% accuracy. That's not folk theory, that's ground truth. We can read the belief out."
  *   **The Reply:** "You've found a correlate, not the mechanism. A thermometer correlates with heat but isn't the theory of thermodynamics. Just because a linear probe can *extract* a signal doesn't mean the model *uses* that signal as a discrete belief unit during computation. If that probe fails out-of-distribution, the 'belief' wasn't real—it was just a statistical shadow."
  *   **The Soft Spot:** If the probe generalizes perfectly across all contexts, the distinction between 'correlate' and 'mechanism' becomes purely semantic, weakening your phlogiston analogy.
  *   **Damage if Fumbled:** **High.** Direct empirical counter-evidence from their peers makes your thesis look outdated.

  **4. The "Evals Utility" Objection**
  *   **The Question:** "Our evals rely on this language to catch regressions. If saying 'the model believes X' predicts failure modes, why drop it? Who cares if it's ontologically real if it works?"
  *   **The Reply:** "Phlogiston predicted combustion successfully for a century. Wrong ontologies hit ceilings when systems get complex. We're building safety-critical systems on a legacy API that might segfault at scale. If we debug using folk terms, we'll fix the symptom, not the mechanism, and technical debt accumulates until we can't align the system."
  *   **The Soft Spot:** It's hard to prove the "ceiling" exists right now. Pragmatism usually wins in engineering cultures, and "it works" is a hard argument to beat without a concrete example of failure.
  *   **Damage if Fumbled:** **High.** Makes you look like a pedant ignoring practical utility.

  **5. The "Functional Role" Objection**
  *   **The Question:** "We're functionalists. We don't care about the substrate. If it walks like a belief and quacks like a belief in the input/output mapping, it *is* a belief. You're attacking a strawman."
  *   **The Reply:** "Functionalism works for black boxes. We're opening the box. If the internals don't match the functional spec—if there's no discrete state playing the 'belief role'—then the spec is wrong, not the internals. We're moving from black-box testing to white-box verification."
  *   **The Soft Spot:** Functionalism is the dominant philosophical view in AI. Denying it requires heavy lifting you might not have time for.
  *   **Damage if Fumbled:** **Medium.** Shifts the debate to semantics where you might lose the room.

  **6. The "Alignment/Goals" Objection**
  *   **The Question:** "If models don't have goals or beliefs, what exactly are we aligning? You can't align a rock."
  *   **The Reply:** "We're aligning optimization landscapes, not agents. Treating them as agents encourages anthropomorphism that misses actual failure modes, like mesa-optimizers or gradient hacking. We need to talk about objective functions and activation pathways, not 'desires'."
  *   **The Soft Spot:** "Aligning landscapes" is vague compared to "aligning goals." Safety teams rely on goal-directed language to frame their work.
  *   **Damage if Fumbled:** **Medium.** Threatens the "so what?" factor of your talk.

  **7. The "Lossy Compression" Objection**
  *   **The Question:** "Isn't folk psychology just lossy compression of the state space? Useful lossiness isn't false."
  *   **The Reply:** "Lossy compression is fine for UI. It's dangerous for safety guarantees. You can't prove safety on a lossy compression. We need lossless descriptions for the internals that matter."
  *   **The Soft Spot:** Maybe we don't need proofs, just high reliability. Most engineering is done with lossy models.
  *   **Damage if Fumbled:** **Low.** Philosophical nuance that most won't dig into.

  **8. The "Debugging Latency" Objection**
  *   **The Question:** "Incident reports need to be fast. 'Belief' is one syllable, 'activation vector 0x4F' is four. Are you saying we should slow down debugging?"
  *   **The Reply:** "Use it for logging, not for root cause analysis. Don't confuse the log message with the stack trace. Folk terms are fine for triage, but not for the fix."
  *   **The Soft Spot:** People will keep using it for RCA because it's easier. You're asking for more cognitive load.
  *   **Damage if Fumbled:** **Low.** Practical concession that doesn't threaten the thesis.

  \biggest_threat{The Abstraction Stack Objection}
