answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **TO:** Executive Board, Regional Hospital Network
  **FROM:** Clinical Analytics Unit (Senior Analyst Team)
  **DATE:** October 24, 2023
  **SUBJECT:** Methodological Framework for Program Evaluation and Reporting of Simpson-Type Reversals

  ### PREFACE: SCOPE AND INTENT

  For the past fiscal year, the Clinical Analytics Unit has produced divergent evaluations regarding the efficacy of three key care-management programs (Post-Discharge Follow-Up, Sepsis-Response Bundle, Medication-Reconciliation Initiative). These divergences arise not from arithmetic error—both analysts verify all calculations to the decimal—but from methodological disagreement regarding how to interpret statistical reversals (often termed "Simpson's Paradox") observed in quality dashboards.

  Specifically, we observe instances where a program appears harmful in aggregate data but beneficial within every stratum of patient risk, or where this reversal disappears when stratifying by service line.

  This document is the product of a structured adversarial collaboration initiated by the Director of Clinical Analytics. Its purpose is not to manufacture a false consensus, but to:
  1.  Codify the mathematical and epistemic facts upon which we agree.
  2.  Isolate the specific methodological and causal judgments upon which we disagree.
  3.  Define the specific analyses required to resolve these disagreements prior to the Board meeting in three weeks.

  Neither analyst endorses the other's conclusion in this document. Both analysts endorse this document as a faithful representation of the dispute and a binding commitment to the resolution plan outlined herein. To repudiate the contents of this statement would be to concede that the prior year's debate was conducted in bad faith.

  ***

  ### 1. AGREED CLAIMS

  The undersigned analysts affirm the following propositions as fact. These claims form the boundary conditions for our disagreement.

  1.  **Mathematical Non-Collapsibility:** The reversal of association signs between aggregated and stratified data is a mathematical property of non-collapsible effect measures (e.g., odds ratios, hazard ratios) in the presence of imbalanced group sizes. It is not a data error. Both the marginal (aggregate) and conditional (stratified) estimates are arithmetically correct descriptions of the observed data.
  2.  **Dashboard Limitations:** Our current dashboards report observational associations. They do not, by themselves, establish causality. A "negative" association in the aggregate does not prove the program causes harm, nor does a "positive" association within strata prove the program causes benefit, without further causal assumptions.
  3.  **Epistemic Constraints:** Our data is finite. Risk-tier variables are imperfect proxies for patient acuity and contain measurement error. Service-line assignments are subject to administrative coding variance. We cannot run randomized control trials on these programs retroactively.
  4.  **Decision Necessity:** The Executive Board requires a binary recommendation (Fund/Defund or Scale/Stop) for each program. It is not permissible to report "insufficient data" without specifying which additional data would alter the decision.
  5.  **Causal Ambiguity:** The variable used for stratification (e.g., Patient Risk Tier) may function as a *confounder* (a common cause of treatment and outcome), a *mediator* (a pathway through which treatment works), or a *collider* (a variable caused by both treatment and outcome). The appropriate statistical adjustment depends entirely on this causal role, which is not visible in the regression output alone.

  ***

  ### 2. DISAGREEMENTS TABLE

  The following table isolates the residual disagreements. Each row represents a single fork in the road. Both analysts agree that these are the correct formulations of their divergence.

  | ID | The Disagreement (Neutral Formulation) | Classification |
  | :--- | :--- | :--- |
  | **D1** | **The Default Reporting Standard:** When a reversal exists between aggregate and stratified estimates, the default report to the Board should be the **Stratified Estimate** (prioritizing subgroup consistency) vs. the **Aggregate Estimate** (prioritizing population-level impact). | Substantive |
  | **D2** | **The Causal Status of Risk Tiers:** In the absence of a formal causal diagram validated by clinical leadership, a risk-tier variable that reverses the effect sign should be presumed a **Confounder** (requiring adjustment) vs. treated as **Unverified** (where adjustment risks introducing bias). | Substantive |
  | **D3** | **The Definition of "Program Effect":** The phrase "Effect of the Program" refers primarily to **Clinical Efficacy** (does it help patients of type X?) vs. **Policy Impact** (what happens to our total readmission rate if we fund this?). | Verbal / Substantive Hybrid |
  | **D4** | **Termination of Stratification:** The search for the "correct" partition terminates when **Clinical Risk Tiers** are reached vs. continues until **Statistical Homogeneity** is achieved (risking overfitting). | Substantive |

  *Note on D3:* We acknowledge a verbal component to this dispute. The Aggregationist defines "Effect" as the Average Treatment Effect (ATE) on the treated population. The Stratificationist defines "Effect" as the Conditional Average Treatment Effect (CATE) stable across relevant subgroups. However, this verbal difference drives a substantive difference in which number is printed on the dashboard.

  ***

  ### 3. THE CRUXES

  The Director has identified three specific cruxes that determine how Disagreements D1–D4 should be resolved for this Board briefing. We accept this shortlist as the basis for our resolution plan.

  **Crux A: Pre-Treatment vs. Post-Treatment Stratification**
  Is the variable used to stratify (Risk Tier) determined *before* the program intervention begins, or is it influenced *by* the intervention?
  *   *Relevance:* If Risk Tier is influenced by the program (e.g., the program successfully lowers a patient's risk score), stratifying on it blocks the pathway of the benefit, artificially making the program look worse (mediator bias). If Risk Tier is baseline acuity, stratifying removes confounding.

  **Crux B: The Decision-Relevant Quantity**
  Does the Board's funding decision depend on the *average* outcome across all patients (budgetary/operational impact), or does it depend on ensuring the program does not harm *any* specific subgroup (ethical/safety constraint)?
  *   *Relevance:* If the goal is total readmission reduction, the aggregate may be the correct metric even if reversals exist. If the goal is equity or safety, the aggregate may hide harm to vulnerable groups.

  **Crux C: Termination of the Partition**
  Does the "Risk Tier" variable represent a stable bottom layer of clinical reality, or is it itself a heterogeneous mixture that would reverse again if split further (e.g., by comorbidity count)?
  *   *Relevance:* If Risk Tiers are themselves heterogeneous, the Stratificationist's "safe" number is also unstable. If they are clinically distinct, the Aggregationist's "mixture" is the only artificial construct.

  ***

  ### 4. RESOLUTION PLAN AND PRE-REGISTERED PREDICTIONS

  To resolve the Cruxes before the Board meeting, we will conduct the following analyses over the next three weeks. Each analyst has signed a pre-registered prediction regarding what these analyses will show for the three specific programs in question.

  #### Analysis 1: Temporal Ordering Audit (Resolves Crux A)
  **Method:** We will map the timestamp of the "Risk Tier" assignment relative to the "Program Start" timestamp for all three programs. We will also interview Clinical Directors to determine if the program protocol itself alters risk scoring.
  **Decision Rule:** If Risk Tier is assigned/affected *after* program initiation, we will flag the stratified estimate as potentially biased (favoring Aggregationist). If *before*, we will flag the aggregate estimate as potentially confounded (favoring Stratificationist).

  | Program | Stratificationist Prediction | Aggregationist Prediction |
  | :--- | :--- | :--- |
  | **Sepsis Bundle** | Risk Tier (Severity) is assigned at Triage (Pre-Treatment). Stratification is valid. | Risk Tier includes response-to-treatment metrics (Post-Treatment). Stratification biases results. |
  | **Med-Reconciliation** | Risk Tier is baseline polypharmacy count (Pre-Treatment). Stratification is valid. | Risk Tier is updated at discharge (Post-Treatment). Stratification biases results. |
  | **Post-Discharge Follow-Up** | Risk Tier is admission acuity (Pre-Treatment). Stratification is valid. | Risk Tier includes follow-up compliance (Post-Treatment). Stratification biases results. |

  #### Analysis 2: Decision-Context Workshop (Resolves Crux B)
  **Method:** We will present the Board Chair and Chief Medical Officer with a hypothetical scenario: "Program X reduces total readmissions by 2% (Aggregate) but increases readmissions by 5% in the High-Risk Stratum." We will record their stated preference.
  **Decision Rule:** If leadership prioritizes the Total Count, the Aggregate is the primary reporting metric. If leadership prioritizes the High-Risk Stratum, the Stratified metric is primary.

  | Analyst | Prediction of Leadership Preference |
  | :--- | :--- |
  | **Stratificationist** | Leadership will prioritize the High-Risk Stratum (Safety/Equity constraint dominates). |
  | **Aggregationist** | Leadership will prioritize the Total Count (Budget/Capacity constraint dominates). |

  #### Analysis 3: Homogeneity Test within Strata (Resolves Crux C)
  **Method:** We will test for effect reversal *within* the Risk Tiers by further stratifying on Service Line and Comorbidity Count.
  **Decision Rule:** If the effect sign flips again within the Risk Tiers, the Risk Tier is not a "bottom" partition, and we must report the instability rather than a single stratified number.

  | Analyst | Prediction of Stability |
  | :--- | :--- |
  | **Stratificationist** | Risk Tiers are clinically robust. Further stratification will reduce power but not reverse the sign. |
  | **Aggregationist** | Risk Tiers are coarse administrative buckets. Further stratification (e.g., by Service Line) will show the "stratified" effect is also unstable. |

  ### COMMITMENT TO OUTPUT

  Upon completion of these three analyses, we will produce a single Board Briefing.
  *   If **Analysis 1** shows the Risk Tier is a post-treatment variable, the Aggregationist's warning will be prominently displayed on the dashboard.
  *   If **Analysis 2** shows Leadership prioritizes subgroup safety, the Stratificationist's view will be the primary recommendation.
  *   If **Analysis 3** shows instability within strata, both analysts agree to report "Indeterminate Effect due to Heterogeneity" rather than forcing a binary choice.

  We sign this statement to confirm that our future disagreement will be limited to the interpretation of the *results* of these analyses, not the methodology used to generate them.

  **Signed,**

  _________________________
  *Lead Analyst, Population Health (The Aggregationist)*

  _________________________
  *Lead Analyst, Clinical Quality (The Stratificationist)*

  **Approved for Distribution,**

  _________________________
  *Director, Clinical Analytics Unit*
