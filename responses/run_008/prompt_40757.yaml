answer: |-
  **JOINT STATEMENT ON THE ARCHITECTURE OF PHENOMENAL CONSCIOUSNESS**

  **Signatories:** The First-Order Representationalism Working Group (FOR) & The Higher-Order Representation Working Group (HOT)
  **Date:** October 26, 2023
  **Subject:** Mapping the Contours of Our Disagreement

  After twelve months of debate, we acknowledge that while our metaphysical commitments diverge, our methodological standards and empirical obligations converge. To prevent further unproductive shouting, we hereby codify our shared commitments, isolate our precise points of divergence, and establish empirical adjudicators for our competing models.

  ### I. AGREED CLAIMS
  *Claims regarding the obligations of theory, data, and methodology that both sides endorse.*

  1.  **The Explanatory Target:** Any adequate theory must explain the distinction between *phenomenally conscious* states (states wherein there is "something it is like" for the subject) and *unconscious* mental states (states that process information and guide behavior without subjective experience).
  2.  **The Status of Introspective Report:** Introspective reports are the primary data for consciousness science, but they are not infallible. They are theory-laden outputs of cognitive systems, subject to error, delay, and confabulation. A theory of consciousness must explain *why* reports are generally reliable without treating them as incorrigible truths.
  3.  **Blindsight and Unconscious Perception:** We agree that blindsight patients and neurotypical subjects under masking conditions demonstrate sophisticated visual processing (discrimination, navigation, priming) in the absence of reported phenomenal experience. Both sides agree this constitutes a dissociation between visual *processing* and visual *awareness*.
  4.  **Subliminal Priming:** We agree that stimuli presented below the threshold of awareness can influence subsequent behavior and judgment. This confirms that semantic and perceptual analysis can occur without phenomenal consciousness.
  5.  **Neural Correlates:** We agree that phenomenal consciousness depends on neural activity. The dispute is not *whether* neural activity is required, but *which* activity constitutes the experience: early sensory processing (FOR emphasis) or fronto-parietal meta-representational processing (HOT emphasis).

  ***

  ### II. DISAGREEMENTS TABLE
  *Precise formulations of our divergences, phrased to ensure each side recognizes their own view without caricature.*

  | Domain | First-Order Claim (FOR) | Higher-Order Claim (HOT) |
  | :--- | :--- | :--- |
  | **Constitution of Phenomenality** | A state is phenomenally conscious in virtue of its **first-order representational content** and its functional role in guiding behavior/reasoning. No inner scan is required for the "light" to be on. | A state is phenomenally conscious only in virtue of being the target of a **higher-order representation** (thought or perception). Without a meta-state, the first-order state is "in the dark." |
  | **Crux 1: Phenomenal Difference without Cognitive Difference**<br>*(Can there be a phenomenal difference that makes no difference to anything reportable or cognitively accessible?)* | **No.** Phenomenal character supervenes on functional/representational roles. If two states make no difference to cognitive access, report, or behavior, they are phenomenally identical. | **Yes (in principle).** A higher-order state could vary (changing "what it's like") even if the downstream report mechanisms are temporarily bottlenecked, provided the HOT itself is present. However, without *any* cognitive access, there is no HOT, and thus no phenomenality. |
  | **Crux 2: The Meaning of Confabulation**<br>*(What do introspective mistakes show about the machinery?)* | **Inference from Output.** Confabulation shows that we infer our mental states from our own behavior and environmental cues, much like we infer the states of others. Introspection is a theory-driven guess. | **Distinct Mechanism Failure.** Confabulation shows that the Higher-Order mechanism is a distinct cognitive system that can malfunction independently of the First-Order system (like a faulty thermometer reading a correct temperature). |
  | **Crux 3: The "Monitor-Blocker" Hypothetical**<br>*(See Section III for detailed predictions)* | **Experience Remains.** If monitoring is blocked but first-order processing is normal, the subject still has experiences; they simply cannot think *about* them. | **Experience Vanishes.** If monitoring is blocked, there is no "subject" of the experience. The subject becomes a "philosophical zombie" regarding those modalities. |

  ***

  ### III. THE CRUX TEST: THE "MONITOR-BLOCKER" HYPOTHETICAL

  To move beyond verbal stalemates, we agree to treat the following thought experiment (and its potential real-world pharmacological equivalent) as the decisive test case.

  **The Scenario:** A drug ("Monitor-Blocker") is administered that selectively shuts down all neural mechanisms responsible for higher-order monitoring (e.g., specific prefrontal loops) while leaving first-order sensory processing (e.g., occipital/ventral stream) completely intact. The subject can still navigate obstacles, discriminate colors, and react to threats, but cannot generate thoughts *about* their seeing.

  **The Question:** Is there still "something it is like" for the subject to see the obstacles?

  | | **First-Order Prediction (FOR)** | **Higher-Order Prediction (HOT)** |
  | :--- | :--- | :--- |
  | **Phenomenal Status** | **Conscious.** The subject has rich visual experiences. They are introspectively blind, but not phenomenally blind. | **Unconscious.** The subject is visually unconscious. It is "dark inside." They are functionally identical to a blindsight patient. |
  | **How to Check** | **Neural Signature.** Look for sustained activity in sensory cortex (V1-V4) without PFC involvement. FOR predicts this correlates with experience. | **Neural Signature.** Look for the absence of PFC/sensory coherence. HOT predicts that without this coherence, reportable experience is impossible. |
  | **Behavioral Marker** | **Frustration/Confusion.** If asked "Can you see?", the subject might say "I don't know" or feel frustrated they cannot articulate the vivid experience they are having. | **Indifference.** If asked "Can you see?", the subject will act like a blindsight patient: "I didn't see anything, I just guessed." |
  | **Agreed Adjudicator** | **Post-Recovery Report.** If the drug wears off and the subject says, "While I was under, I saw red but couldn't say it," **FOR wins**. If they say, "It was just a blank void until I woke up," **HOT wins**. |

  ***

  ### IV. NOTE ON VERBAL DISPUTE

  We conclude this statement by acknowledging that a portion of our dispute may be **semantic**, specifically regarding the definition of the term **"Phenomenal Consciousness."**

  *   **The FOR Usage:** We tend to use "phenomenal consciousness" to refer to the **qualitative character of the representation itself**. For us, if the system represents red vividly, there is "redness" in the system, regardless of whether a "self" notices it.
  *   **The HOT Usage:** We tend to use "phenomenal consciousness" to refer to **subjective awareness**. For us, "what it is like" implies a "what it is like *for me*." Without a higher-order representation creating a "subject," there is no one for whom it is like anything.

  **Resolution:** We agree that if the dispute were *purely* verbal, the "Monitor-Blocker" predictions would be identical. Since our predictions regarding the subject's post-recovery testimony and neural correlates differ, the dispute is **substantive**, not merely verbal. However, we acknowledge that when we use the word "conscious," we must specify whether we mean *First-Order Qualitative Processing* or *Higher-Order Subjective Availability*.

  **Signed,**

  *The First-Order Representationalism Working Group*
  *The Higher-Order Representation Working Group*
