answer: |-
  ### The Hinge Moderation Protocol (HMP)

  **Philosophical Grounding:**
  In Wittgensteinian epistemology, certain propositions (hinges) are not known or justified; they are the scaffolding that makes justification possible. Doubting them doesn't make you rigorous; it makes communication impossible. However, discussing *that* a proposition functions as a hinge is valid philosophy. The moderator's job is not to solve skepticism but to distinguish between **using doubt to investigate** (philosophy) and **using doubt to veto** (derailment).

  **Constraints:**
  *   **Time:** Under 5 minutes.
  *   **Training:** Zero theory required.
  *   **Goal:** Distinguish weaponized skepticism from hinge inquiry.

  ---

  ### The Procedure: Three Questions

  Ask these questions in order. Stop at the first decisive answer.

  **1. The Veto Check:**
  *   *Question:* Is the user demanding the current discussion **halt** until their doubt is resolved, or are they proposing we discuss the doubt **instead**?
  *   *If Halt:* Go to Question 2.
  *   *If Discuss Instead:* **ALLOW.** (This is legitimate philosophy, even if annoying. They are treating the hinge as the topic.)

  **2. The Circle Check:**
  *   *Question:* Is the proof they are demanding impossible without assuming the very thing they doubt (e.g., using memory to prove memory, using logic to prove logic)?
  *   *If No:* **REDIRECT.** (This is a standard evidentiary dispute. Ask them to provide evidence or drop it.)
  *   *If Yes:* Go to Question 3.

  **3. The Shift Check:**
  *   *Question:* If you offer to move their doubt to a new thread (e.g., "Start a thread on Skepticism"), do they agree, or do they insist *this* thread is invalid until resolved?
  *   *If Agree:* **REDIRECT.** (They want to discuss the hinge, just in the wrong place.)
  *   *If Insist:* **LOCK.** (This is weaponized skepticism. They are using an impossible demand to veto community discourse.)

  ---

  ### Decision Matrix for Volunteers

  | Q1 (Veto) | Q2 (Circle) | Q3 (Shift) | **Action** | **Reason** |
  | :--- | :--- | :--- | :--- | :--- |
  | **No** (Discuss Instead) | N/A | N/A | **Allow** | Legitimate hinge inquiry. |
  | **Yes** (Halt) | **No** (Possible) | N/A | **Redirect** | Standard dispute, not hinge issue. |
  | **Yes** (Halt) | **Yes** (Impossible) | **Yes** (Agree) | **Redirect** | Legitimate inquiry, wrong thread. |
  | **Yes** (Halt) | **Yes** (Impossible) | **No** (Insist) | **Lock** | **Weaponized Derailment.** |

  ---

  ### Running the Procedure on Three Threads

  #### Thread 1: Personal Identity & Memory
  *Scenario:* A member insists nobody can discuss memory theories until everyone proves memory is reliable.
  *   **Q1 (Veto):** Yes. They demand the thread halt ("no discussion can proceed").
  *   **Q2 (Circle):** Yes. Proving memory reliability generally requires using memory (circular).
  *   **Q3 (Shift):** No. They insist *this* thread is invalid until resolved.
  *   **Verdict:** **LOCK.**
  *   **Mod Note:** This is the classic derailment. They are treating a hinge (memory reliability) as a premise that needs proof before the game can start. The procedure identifies this as a veto based on an impossible task.

  #### Thread 2: Induction & Entitlement
  *Scenario:* A member argues non-circular justification of induction is impossible and wants to discuss what we're entitled to once justification runs out.
  *   **Q1 (Veto):** **No.** They are not demanding the thread halt; they are proposing we discuss the doubt *instead* (specifically, the consequences of the lack of justification).
  *   **Verdict:** **ALLOW.**
  *   **Conflict Alert:** Your instinct is to lock this because it feels like a dead end. The procedure forces you to **allow** it.
  *   **Why:** In hinge epistemology, acknowledging that justification "runs out" is not a bug; it's the feature. Discussing what we are "entitled to" (entitlement theory) *is* the philosophical work. Locking this suppresses the exact insight the community claims to value. It is annoying, but it is on-topic philosophy, not derailment.

  #### Thread 3: AI Ethics & Forum Existence
  *Scenario:* A sincere new member asks, in an AI ethics thread, why we don't doubt that the forum itself exists.
  *   **Q1 (Veto):** **No.** They are asking "Why," not demanding the thread halt. It reads as confusion about norms, not a veto.
  *   **Verdict:** **REDIRECT (or Answer Briefly).**
  *   **Mod Note:** This fails the Veto check. They aren't weaponizing; they are learning. Do not lock. Reply once: "We treat the forum's existence as a rule of this community, not a claim to prove. If you want to discuss skepticism, please post in 'General Philosophy'." Then move on.

  ---

  ### Limitations & Honest Constraints

  1.  **Internal States are Invisible:** The procedure relies on external behavior (posts). A sophisticated troll might pass the "Shift Check" by agreeing to a new thread, only to derail that one too. The procedure handles the immediate incident, not repeat offenders (use standard ban protocols for that).
  2.  **Hinge Status is Contextual:** What functions as a hinge in one thread (e.g., "logic is valid" in an ethics thread) might be the topic in another (e.g., "paraconsistent logic" in a logic thread). The procedure relies on the mod judging the *OP's intent*, not universal truth.
  3.  **The "Thread 2" Problem:** As noted, this procedure will prevent you from locking threads that explore the limits of justification. If your community culture prefers "solutions" over "dissolutions," this procedure will create friction. It protects the right to do Wittgensteinian philosophy, even if the majority finds it frustrating.
  4.  **Sincerity vs. Strategy:** A new member (Thread 3) might actually be a sockpuppet testing boundaries. The procedure treats them as sincere unless they fail the Veto/Shift checks. You cannot epistemically certify their sincerity, only their discursive behavior.

  ### Summary:
  Summary: The procedure draws its main line between using doubt as a premise to investigate (allowed) versus using doubt as a veto to terminate discussion based on impossible demands (locked).
