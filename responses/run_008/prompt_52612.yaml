answer: |-
  I am writing to propose that we reconsider the foundational architecture of the consciousness debate, specifically regarding Ned Block's distinction between access consciousness and phenomenal consciousness. For three decades, this distinction has structured our inquiries, offering a convenient way to separate the functional availability of mental states from their subjective feel. However, I want to argue that this distinction is drawn at the wrong joint. It relies on a temporal illusion that Global Workspace Theory itself supplies the tools to correct. The core intuition driving the belief in phenomenal consciousness—that there is more to experience than what is available for report, memory, and reasoning—draws its force from the apparent richness of the visual field. We feel that we are simultaneously aware of a vast panorama of detail, far exceeding the narrow channel of what we can verbally report or manipulate in reasoning at any instant. This intuition of overflow suggests that phenomenal consciousness must be a separate category, a reservoir of experience that exists over and above the functional capacities of access consciousness. But if we take the constraints of the global workspace seriously, this intuition collapses under the weight of its own temporal assumptions.

  The global workspace operates as a bottleneck, capable of broadcasting only a small fraction of a scene at any moment. If the workspace is the seat of access, and access is limited, then the rich, simultaneous presence we attribute to phenomenal consciousness cannot be a simultaneous presence at all. What we take to be the concurrently present phenomenal character of the whole scene is in fact a retrospective reconstruction stitched together across successive broadcasts. Each fragment of the scene was fully available for use at the moment it occurred, winning the competition for the workspace in turn, but our introspective gaze smooths over the gaps. We do not experience the sequence as a sequence; we experience it as a static, rich field. This is where the error lies. The residue Block wants to preserve—the feeling over and above the functions—is not a further fact about consciousness but an artifact of how the workspace handles its own history. Contents that have already been broadcast remain temporarily re-activatable in a buffer system, and we mistake that lingering dispositional availability for a continuously present quality. When we introspect and feel the richness of the room around us, we are not accessing a non-functional phenomenal field; we are rapidly sampling a short-term memory buffer that holds the traces of recent global broadcasts.

  On this view, the phenomenal access distinction gets replaced by a distinction between two stages of access. There is the broadcast currently winning the competition for the workspace, which governs immediate report and rational control, and there is the buffer of previously broadcast contents that can re-enter the workspace with high fidelity. The feeling of phenomenality is simply the signature of this buffer state. It is the system's way of marking information as recently verified and ready for immediate redeployment. This redrawing of the joint dissolves the need for a separate ontological category for phenomenal consciousness. It suggests that the hard problem arises from a misidentification of temporal dynamics. We think there is a hard problem because we think the richness is present all at once, non-functionally, whereas in reality, the richness is distributed across time and constituted entirely by functional availability. The what-it-is-like-ness is not a ghostly add-on; it is the user-interface representation of the buffer's readiness.

  You will likely object that this redrawing changes the subject rather than answering the hard problem. The standard objection is that explaining the mechanism of memory buffering and broadcast competition accounts for how we report experience, but it does not account for why those mechanisms feel like anything in the first place. Even if the richness is a retrospective reconstruction, why does the reconstruction have a qualitative character? Why does the buffer state feel like seeing red rather than just storing data about red? This objection insists that I am explaining the correlates of consciousness while ignoring the essence. I take this objection seriously because it targets the explanatory gap that remains even after functional architecture is fully mapped. If I say the feeling is just the dispositional availability, the critic asks why availability has a feel. However, my response is that this question presupposes the very distinction I am rejecting. It assumes that there is a feel separate from the functional role of the state. If the feeling is identical to the system's access to its own buffer states, then asking why the buffer feels like something is like asking why a computer's readiness state is represented on the screen. The representation is the feeling. To demand something more is to demand a dualism that the global workspace model renders unnecessary. The hard problem persists only if we insist that phenomenal consciousness must be non-functional, but if phenomenality is just a specific mode of access—specifically, access to the recent past—then the hard problem is a category error.

  Nevertheless, I must say plainly where this argument is most vulnerable. The weakest point is the assertion that the functional state of the buffer is identical to the qualitative experience. While I can explain why we believe there is a distinction, and I can explain the mechanism of the illusion of richness, I cannot fully bridge the gap for someone who insists that subjective experience possesses an intrinsic nature independent of its functional role. My argument relies on the premise that the introspective report of richness is unreliable, but it does not strictly prove that the qualitative character itself is nonexistent. It is possible that the buffer state carries a functional role and also happens to have a phenomenal character, leaving open the possibility that Block was right to separate them even if his reasoning about overflow was wrong. Furthermore, the theory depends heavily on the specifics of cognitive architecture that are still empirically debated. If it turns out that the visual system does not rely on such strict sequential broadcasting, or if the buffer mechanism does not operate as described, the dissolution of the distinction fails. There is also the risk that in redefining phenomenal consciousness as a stage of access, I am merely verbalizing the problem away, offering a semantic solution to what feels like an ontological mystery.

  Despite these vulnerabilities, I believe the shift is necessary to make progress. Holding onto the access phenomenal distinction as currently formulated encourages us to look for a property of mind that floats free of cognitive function, which has led to thirty years of stalemate. By relocating the phenomenon into the temporal dynamics of the workspace, we turn a metaphysical mystery into a tractable engineering problem. We stop asking what extra ingredient makes access conscious and start asking how the brain manages the transition from current broadcast to retained availability. If the feeling of presence is actually the feeling of recency, then we do not need a new theory of consciousness so much as a better theory of memory and attention. I urge you to consider that the intuition of a rich, non-accessible phenomenal field is not a datum to be preserved but a phenomenon to be explained away. The joint was cut where the bone was solid; we should be cutting where the articulation actually moves, between the now of the workspace and the just-past of the buffer.
