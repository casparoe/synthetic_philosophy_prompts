          *   *Analysis:* Wait. Does Mill solve the heterogeneity problem by finding a *common property*? No. Mill *concedes* the heterogeneity problem against Bentham. Mill argues pleasures *differ* in quality, not just quantity. He abandons the strict "one common sensation" view to save hedonism from the "swine" objection, but in doing so, he arguably *accepts* a version of the heterogeneity problem (that pleasures aren't uniform) but tries to rank them.
