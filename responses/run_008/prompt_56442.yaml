  # Decision Tree: The Fate of the Analytic–Synthetic Distinction

  **Instructions:** Start at the root (Node 1). Answer the question based on your own philosophical intuitions about the cases described, not based on which philosopher you prefer. Follow the arrow corresponding to your answer until you reach a leaf.

  ### Node 1: The Root Question
  **Is there a philosophically significant notion of a sentence that is true solely in virtue of its meaning, as opposed to partly in virtue of how the world is?**
  *   **No:** → **Leaf 1 (Quinean Eliminativism)**
  *   **Yes:** → Go to Node 2

  ### Node 2: Epistemic vs. Metaphysical
  **If you answered "Yes," is the primary philosophical value of calling a sentence 'analytic' that it explains *how we are justified* in believing it, or that it explains *what makes it true*?**
  *   **How we are justified** (Grasp of meaning suffices for entitlement): → **Leaf 2 (Epistemic Reconception)**
  *   **What makes it true** (Meaning constitutes the truth): → Go to Node 3

  ### Node 3: The Legislator Test (Case ii)
  **Consider Quine's imagined investigator who deliberately legislates "rational animal" as the meaning of "man." Does this stipulation *create* an analytic truth, or does it merely *record* a pre-existing semantic fact?**
  *   **Creates it** (Truth is relative to the chosen linguistic framework): → **Leaf 3 (Carnapian Conventionalism)**
  *   **Records it** (Truth is independent of our choices): → Go to Node 4

  ### Node 4: The Kripke–Putnam Pressure (Cases iii & iv)
  **Kripke argues "Water is H2O" is necessary but not analytic; Putnam argues "Cats are animals" could turn out false. Do these cases show that 'meaning' cannot sustain the traditional link to 'necessity'?**
  *   **Yes** (The link is broken or severely restricted): → Go to Node 5
  *   **No** (Meaning still guarantees necessity despite these cases): → **Leaf 4 (The Pre-Kripkean Traditionalist)** *[Unoccupied]*

  ### Node 5: The Red/Green Test (Case i)
  **Compare "Nothing can be red and green all over at once" with "All bachelors are unmarried." Are these the *same kind* of truth (both analytic), or does the former belong to a different category (e.g., synthetic a priori or structural)?**
  *   **Different categories** (The analytic class is narrower than traditionally thought): → **Leaf 5 (The Fractured Realist)** *[Unoccupied]*
  *   **Same kind** (Both are true in virtue of meaning): → Go to Node 6

  ### Node 6: The Agreement & Dispute Test (Case v)
  **When competent speakers universally agree on a sentence without empirical check, is this evidence of a semantic fact, or merely evidence that agreement is cheap when nothing rides on it? Consequently, is the Quine–Grice-Strawson debate substantive or verbal?**
  *   **Agreement is cheap / Debate is verbal** (The sides are equivocating on "meaning"): → **Leaf 6 (Quietism)**
  *   **Evidence of fact / Debate is substantive** (The distinction is robust and serviceable): → **Leaf 7 (Grice–Strawson Defense)**

  ---

  ### The Leaves

  **Leaf 1: Quinean Eliminativism**
  *   **Position:** There is no fact of the matter; there are only degrees of entrenchment in a holistically confirmed web of belief.
  *   **Awkward Commitment:** You must bite the bullet that logic and mathematics are, in principle, revisable in the face of recalcitrant empirical experience.

  **Leaf 2: Epistemic Reconception**
  *   **Position:** A sentence is analytic if grasp of its meaning alone suffices for justified belief, treating the metaphysical question of truth "in virtue of meaning" as separable.
  *   **Awkward Commitment:** You must accept that a sentence could be analytic (justified by meaning) yet false, if the world does not cooperate with our concepts.

  **Leaf 3: Carnapian Conventionalism**
  *   **Position:** Analyticity is relative to a chosen linguistic framework; the question "which sentences are analytic?" has no answer independent of adopting a framework.
  *   **Awkward Commitment:** You must accept that the choice between frameworks (e.g., one with numbers, one without) is itself pragmatic, not truth-apt.

  **Leaf 4: The Pre-Kripkean Traditionalist** *[Unoccupied]*
  *   **Position:** The analytic, the a priori, and the necessary remain co-extensive despite Kripke's cases.
  *   **Diagnosis:** Unoccupied because it requires rejecting standard Kripkean modal semantics or arguing that "Water is H2O" is somehow knowable by meaning alone.

  **Leaf 5: The Fractured Realist** *[Unoccupied]*
  *   **Position:** The distinction is real and framework-independent, but "Red/Green" truths are fundamentally different from "Bachelor/Unmarried" truths.
  *   **Diagnosis:** Unoccupied because it is attractive but fails to provide a unified theory of 'meaning' to explain the fracture.

  **Leaf 6: Quietism**
  *   **Position:** The whole dispute is verbal; Quine and Grice-Strawson are proposing different explications for different practical interests rather than contradicting each other.
  *   **Awkward Commitment:** You must bite the bullet that decades of intense philosophical argument were generated by a mere confusion of terminology.

  **Leaf 7: Grice–Strawson Defense**
  *   **Position:** The distinction is intelligible and serviceable even though no strict definition is on offer; the class of analytic truths is a fact about meanings.
  *   **Awkward Commitment:** You must bite the bullet that we possess a robust semantic intuition that resists precise definition or reduction.

  ---

  ### Indistinguishable Positions & Further Questions

  This tree cannot genuinely separate **Leaf 3 (Carnapian Conventionalism)** from **Leaf 7 (Grice–Strawson Defense)** if a student interprets "linguistic framework" loosely as "shared human practice." A Grice-Strawson defender might agree that analyticity depends on language, but insist the facts are objective *within* that language, while a Carnapian insists the framework choice itself is arbitrary.

  **Further Question Needed:** "Is the choice of linguistic framework itself subject to empirical scrutiny or rational critique, or is it a matter of pure pragmatic convenience?"
  *   If **Convenience**: Carnap.
  *   If **Rational Critique**: Grice-Strawson.

  Similarly, **Leaf 2 (Epistemic Reconception)** and **Leaf 7 (Grice–Strawson)** may converge if the student believes that epistemic entitlement perfectly tracks metaphysical truth-making. To separate them, one must ask: "Could a sentence be analytic (justified by meaning) in a world where it is false?" The Epistemic Reconception says yes; the Grice-Strawson Defense says no.
