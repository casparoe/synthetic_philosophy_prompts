prompt: |-
  I'm the deputy registrar at a mid-sized university, and by accident of the org chart I now chair the committee that decides hardship grants — emergency money for students: rent arrears, a stolen laptop, sudden illness, a parent losing their job mid-term. The pot is about £60k a year, we get roughly 130 applications, and we can fund maybe half of them, so every yes is a no to someone else. Applications come in waves (start of term and after Christmas are the worst), the two of us who do first-pass triage get maybe 15 minutes per case, and anything over £800 needs the bursar to sign off, so the procedure has to produce a paper trail he can skim in a minute.

  Right now the policy is basically vibes, and it shows. A colleague in philosophy said we should think about luck egalitarianism — her gloss was something like: inequality is unjust when it traces back to circumstances the person didn't choose, but not when it traces to their choices, so you help the student blindsided by bad luck and not the one who made their own mess. That sounds like it could be an actual procedure rather than an argument, which is what I need. So please write me one.

  Concretely I want: the questions to ask each application in order, what counts as a sufficient answer to each, at which point the procedure returns a no, and where it hands off to the committee or the bursar because the question is one of values, not facts. The hard parts I can already see, and I want the procedure to face them rather than wave at them:

  - How do we tell a choice from a circumstance? A student who spent their maintenance loan on a summer holiday is one thing; a student who took extra shifts and then flunked a resit is another; a student who declined a job to care for a sick parent is another again. Does the theory actually rank these, and can a 15-minute process rank them reliably?
  - What about choices made on bad information, or with no realistic alternative — kids from families where nobody has ever had savings budget differently, and I'm not sure punishing that is what the theory wants.
  - Is there a principled line between "you chose the risk" and "the downside was wildly disproportionate to the choice"? The holiday case probably shouldn't decide whether someone is homeless in June, but I can't articulate why.

  Then run it on three cases and show its work: (1) a finalist whose laptop was stolen from the library the week before exams, no insurance, needs £450 for a replacement; (2) a second-year who spent her loan instalment partly on a holiday in August and now can't cover rent, landlord issuing warnings, about £1,100; (3) a postgrad whose parent's business failed and can no longer top up his rent, £600 a term ongoing, not a one-off. Include at least one case where the procedure gives an answer I won't like — I'm honestly inclined to be generous on the holiday one if the alternative is eviction — and tell me straight whether the theory forces the harsh answer or whether there's a principled route to softening it (I've heard there's a whole feminist/relational critique saying luck egalitarianism is heartless to exactly these people, and if that critique bites here I want to know where the procedure should give way to it rather than pretend it doesn't exist).

  Also be honest about what the procedure can't do at all: where it will misfire, what kinds of applications it shouldn't even try to score, and where I should just admit triage is triage. Please write the whole thing in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Deputy Registrar at a mid-sized UK university.
      *   **Task:** Chair of the Hardship Grants Committee.
      *   **Problem:** Current policy is "vibes," inconsistent, high volume (130 apps/year), limited funds (£60k, fund ~50%), tight time constraints (15 mins triage), need paper trail for Bursar (>£800).
      *   **Proposed Framework:** Luck Egalitarianism (LE) – distinguish between "brute luck" (circumstances) and "option luck" (choices). Help the former, not necessarily the latter.
      *   **Specific Requirements:**
          *   Create a step-by-step procedure (questions, sufficient answers, stop points, hand-offs).
          *   Address hard parts: Choice vs. Circumstance, Bad Information/No Alternative, Disproportionate Downside.
          *   Run the procedure on three specific cases (Stolen Laptop, Holiday/Rent Arrears, Parent Business Failure/Ongoing).
          *   Include at least one outcome the user won't like (likely the holiday case).
          *   Discuss the Feminist/Relational Critique (is LE too heartless?).
          *   Admit limitations (where the procedure fails).
          *   **Tone/Style:** British English, professional but candid, practical for a 15-minute triage.

  2.  **Deconstruct Luck Egalitarianism (LE) for this Context:**
      *   *Core Principle:* Compensate for disadvantages arising from unchosen circumstances (brute luck). Do not necessarily compensate for disadvantages arising from voluntary choices (option luck), *unless* the choice wasn't truly voluntary or the consequences are catastrophic.
      *   *The "Vibes" Problem:* LE can be judgmental. Need to operationalize it without moralizing too heavily in a 15-minute window.
      *   *The "Hard Parts":*
          *   *Choice vs. Circumstance:* Need a test for voluntariness.
          *   *Bad Info/No Alternative:* This is the "reasonable person" test. Did they have the capacity/resources to choose otherwise?
          *   *Disproportionate Downside:* This is the "safety net" clause. Even if it was a bad choice, does letting them fail cause irreversible harm (homelessness, dropping out)?

  3.  **Drafting the Procedure (The "Algorithm"):**
      *   Need a flowchart style but in text.
      *   *Step 1: Eligibility & Verification (Fact Check).* Is the student registered? Is the cost real?
      *   *Step 2: The Causation Test (Brute vs. Option Luck).* What caused the shortfall?
      *   *Step 3: The Voluntariness Test (Constraints).* Could they reasonably have done otherwise? (Addresses the "bad info/no alternative" concern).
      *   *Step 4: The Proportionality Test (Harm).* Is the penalty disproportionate to the error? (Addresses the "homelessness" concern).
      *   *Step 5: The Sustainability Test (One-off vs. Ongoing).* Can we fix this permanently? (Addresses the postgrad case).
      *   *Decision Points:* Clear Yes, Clear No, Committee Referral (Values), Bursar Referral (Money).

  4.  **Addressing the "Hard Parts" within the Procedure:**
      *   *Choice vs. Circumstance:* Don't ask "Was it your fault?" Ask "Was this foreseeable and avoidable given your resources?"
      *   *Bad Info:* Include a "Capacity" check. First-generation students get leeway on budgeting.
      *   *Disproportionate Downside:* Include a "Harm Threshold." Eviction > Laptop.

  5.  **Running the Cases:**
      *   *Case 1 (Stolen Laptop):* Classic brute luck. Theft is unchosen. Exams make it urgent. *Verdict: Fund.*
      *   *Case 2 (Holiday/Rent):* Classic option luck. Chose holiday. But consequence is eviction. *Verdict:* LE says No, but Proportionality/Harm says Maybe. This is where the critique bites. I need to show the tension.
      *   *Case 3 (Parent Business/Ongoing):* Circumstance (parent's failure), but ongoing cost. £600/term = £1800/year. Pot is £60k. If we fund 10 of these, that's £18k. *Verdict:* Fundable cause, but sustainability issue. Might need a loan or one-off bridge, not a grant.

  6.  **The Critique (Feminist/Relational):**
      *   LE focuses on individual responsibility. Relational equality focuses on standing and participation.
      *   If denying the grant means the student drops out and loses social standing, LE might be too strict.
      *   Need to identify where the procedure should "break" to allow for compassion/retention goals.

  7.  **Limitations:**
      *   15 minutes isn't enough for deep investigation.
      *   LE doesn't solve structural underfunding.
      *   Bias in triage officers (implicit bias on what counts as "reasonable").

  8.  **Refining the Tone:**
      *   British English (programme, centre, £, "uni", "bursar").
      *   Professional, bureaucratic but humane.
      *   Acknowledge the user's authority and constraints.

  9.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Acknowledge the burden. Validate the LE approach as a tool, not a moral truth.
      *   *The Procedure:* Make it a checklist. Use "Stop/Go" logic.
      *   *The Hard Parts:* Explicitly map the user's concerns to specific steps in the checklist.
      *   *Case Studies:* Walk through the checklist for each.
      *   *The "Unpleasant" Outcome:* Be firm on Case 2 initially, then show the "escape hatch."
      *   *The Critique:* Explain *why* LE feels cold and where to override it.
      *   *Limitations:* Be honest about the £60k cap.

      *(Self-Correction during drafting)*: I initially thought about suggesting a loan for Case 3. But the prompt asks about hardship *grants*. I should note that ongoing issues are structurally unsuited for a finite pot, even if the cause is brute luck. I need to make sure the procedure flags "ongoing" as a risk to the pot.

      *(Refining Case 2)*: The user says they are inclined to be generous. LE says no. I need to show how the procedure can accommodate the user's instinct *without* abandoning the theory entirely. The "Proportionality Test" is the key. If the harm (eviction) threatens the student's ability to continue studies (participation), relational equality overrides strict LE.

      *(Refining the "Choice" definition)*: Avoid moralizing. Use "Reasonable Expectation of Foresight." A first-gen student might not know they need insurance; a third-gen might. Wait, that's too hard to triage. Better: "Was the risk knowable to a reasonable person in their position?"

  10. **Final Review against constraints:**
      *   British English? Yes.
      *   15-minute triage feasible? Yes, checklist format.
      *   Bursar paper trail? Yes, the checklist *is* the trail.
      *   All three cases covered? Yes.
      *   Critique included? Yes.
      *   Limitations admitted? Yes.

  11. **Final Polish:** Ensure the distinction between "Committee" (values) and "Triage" (facts) is clear. Ensure the Bursar threshold (£800) is respected.

  *(Self-Correction on Case 3)*: £600 a term is £1800 a year. The grant is usually one-off. If we fund this, it sets a precedent. The procedure needs to flag "Recurring Deficit."

  *(Self-Correction on Case 2)*: The prompt asks for *one* case where the procedure gives an answer I won't like. I should make sure Case 2 initially fails the LE test, then discuss the override. Or, strictly follow LE and show the "No," then explain the critique. I will follow the strict LE first to demonstrate the tension, then offer the "Relational Override."

  Let's write it.cw
answer: |-
  **To:** Deputy Registrar / Committee Chair
  **From:** Policy Advisory Unit
  **Subject:** Operationalising Luck Egalitarianism for Hardship Grants (Triage Protocol v1.0)

  ### Executive Summary

  You are asking for a procedure that converts a moral theory (Luck Egalitarianism) into a bureaucratic tool suitable for 15-minute triage. This is ambitious. Luck Egalitarianism (LE) is philosophically robust but notoriously difficult to administer without becoming punitive.

  The core tension you identified is correct: LE distinguishes between **Brute Luck** (unchosen circumstances) and **Option Luck** (consequences of voluntary gambles). Pure LE says: compensate the former, ignore the latter.

  However, as you noted, pure LE fails when "choices" are constrained by poverty or ignorance, and when the penalty for a bad choice is catastrophic (e.g., homelessness). To make this work for a university bursary, we must hybridise LE with a **Relational Safety Net**. We compensate for bad luck, we penalise reckless choice, *but* we never allow a penalty to terminate a student's participation in the university community.

  Below is the **Hardship Triage Protocol (HTP)**. It is designed to generate the paper trail your Bursar requires while forcing the triage officer to confront the hard distinctions explicitly.

  ---

  ### Part 1: The Hardship Triage Protocol (HTP)

  **Time Allowance:** 15 Minutes per case.
  **Documentation:** The completed HTP form *is* the paper trail.
  **Thresholds:**
  *   **Triage Officer:** Can approve up to £800.
  *   **Bursar:** Must sign off anything >£800.
  *   **Committee:** Must decide any case flagged as "Value Conflict" (see Step 4).

  #### Step 1: Verification & Immediacy (Fact Check)
  *   **Q1.1:** Is the financial shortfall verified (e.g., landlord letter, repair quote, medical note)?
      *   *No:* **STOP.** Return to student for evidence.
      *   *Yes:* Proceed.
  *   **Q1.2:** Is the harm imminent (e.g., eviction notice, exam in <7 days)?
      *   *No:* **STOP.** Advise on budgeting/long-term support. Do not fund emergency pot.
      *   *Yes:* Proceed.

  #### Step 2: The Causation Test (Brute vs. Option Luck)
  *   **Q2.1:** What is the primary cause of the shortfall?
      *   *A:* External shock (theft, illness, family collapse, policy change). -> **Classify: Brute Luck.**
      *   *B:* Budget allocation (spending on non-essentials, gambling, unpaid work). -> **Classify: Option Luck.**
      *   *C:* Mixed (e.g., worked extra hours, then fell ill). -> **Proceed to Q2.2.**
  *   **Q2.2:** If Mixed, was the 'choice' element a reasonable strategy to mitigate risk?
      *   *Yes (e.g., working to pay rent):* **Classify: Brute Luck.**
      *   *No (e.g., skipping rent to holiday):* **Classify: Option Luck.**

  #### Step 3: The Voluntariness Test (Constraints on Choice)
  *   *Note: This addresses the 'bad information/no alternative' problem.*
  *   **Q3.1:** Did the student have the capacity and information to choose otherwise?
      *   *Check:* First-generation student? International student (no recourse to public funds)? Known learning difficulty?
      *   *If Yes (Constraints existed):* **Reclassify as Brute Luck.** (Poverty constrains choice; ignorance of systems is a circumstance).
      *   *If No (Reasonable capacity existed):* **Maintain Option Luck classification.**

  #### Step 4: The Proportionality Test (The Safety Net)
  *   *Note: This addresses the 'disproportionate downside' problem.*
  *   **Q4.1:** If funding is denied, what is the consequence?
      *   *A:* Inconvenience/Discomfort (e.g., cheaper laptop, delayed holiday). -> **Follow LE Classification.** (If Option Luck, Deny).
      *   *B:* Threat to Academic Continuation (e.g., cannot sit exams, must suspend). -> **Flag for Committee.**
      *   *C:* Threat to Basic Welfare (e.g., homelessness, destitution). -> **Override LE.** (Fund regardless of choice).
  *   **Decision Logic:**
      *   If **Brute Luck** + **Imminent Harm**: **Approve.**
      *   If **Option Luck** + **Inconvenience**: **Deny.**
      *   If **Option Luck** + **Homelessness/Expulsion**: **Refer to Committee** (Value Judgment: Retention vs. Responsibility).

  #### Step 5: Sustainability Check (The Pot Protection)
  *   **Q5.1:** Is this a one-off cost or a recurring deficit?
      *   *One-off:* **Proceed to Award.**
      *   *Recurring:* **Stop.** A grant cannot fix a structural income deficit. Refer to Student Finance/Loans. Exception: One-off 'bridge' payment only if Step 4B/C is triggered.

  ---

  ### Part 2: Addressing the Hard Parts

  You asked specifically how the procedure handles the philosophical friction points. Here is the mapping:

  **1. Choice vs. Circumstance (The "Holiday" vs. "Care" dilemma)**
  *   **Procedure:** Step 2 & 3.
  *   **Mechanism:** We do not judge the *morality* of the choice, but the *constraints* upon it.
  *   **Application:**
      *   *Holiday:* High constraint freedom. Chose leisure over rent. -> **Option Luck.**
      *   *Caring for Parent:* Choice made under moral duress and often economic necessity (state care unavailable). Step 3.1 flags this as a constraint. -> **Reclassified to Brute Luck.**
      *   *Working then Flunking:* Step 2.2 asks if the work was a risk-mitigation strategy. If they worked to pay rent and tiredness caused the fail, that is Brute Luck (structural pressure). If they worked to fund a lifestyle, it is Option Luck.

  **2. Bad Information / No Realistic Alternative**
  *   **Procedure:** Step 3 (Voluntariness Test).
  *   **Mechanism:** This is where we acknowledge that "budgeting" is a skill often correlated with class background.
  *   **Application:** A first-generation student who didn't know they needed contents insurance is treated differently from one who simply didn't buy it. The procedure forces the triage officer to tick a box confirming "Capacity to Choose." If they lack the social capital to know the risk, it counts as circumstance.

  **3. Disproportionate Downside**
  *   **Procedure:** Step 4 (Proportionality Test).
  *   **Mechanism:** This is the "Stop Loss" on moralising.
  *   **Application:** Even if a student gambled their rent money (Option Luck), letting them sleep on the street (Disproportionate Downside) violates the university's duty of care. The procedure forces a referral to the Committee here. It admits that *sometimes* we must fund bad choices to prevent catastrophic harm.

  ---

  ### Part 3: Case Studies (Running the HTP)

  Here is how the protocol processes your three cases.

  #### Case 1: The Stolen Laptop (Finalist, £450)
  *   **Step 1:** Verified (police report)? Yes. Imminent (exams)? Yes.
  *   **Step 2:** Cause? Theft. **Classification: Brute Luck.**
  *   **Step 3:** Constraints? N/A (Victim of crime).
  *   **Step 4:** Consequence if denied? Cannot sit exams. **Threat to Continuation.**
  *   **Step 5:** One-off? Yes.
  *   **Decision:** **APPROVE.**
  *   **Paper Trail:** "Brute luck event (theft). Imminent threat to academic completion. One-off cost under £800."
  *   **Comment:** This is the easy win. LE and Relational views align perfectly here.

  #### Case 2: The Holiday & Rent Arrears (Second-year, £1,100)
  *   **Step 1:** Verified (landlord letter)? Yes. Imminent (eviction warning)? Yes.
  *   **Step 2:** Cause? Allocation of maintenance loan to holiday. **Classification: Option Luck.**
  *   **Step 3:** Constraints? Student had full loan, knew rent due date. No obvious capacity constraint. **Maintain Option Luck.**
  *   **Step 4:** Consequence if denied? Eviction/Homelessness. **Threat to Basic Welfare (4.C).**
  *   **Step 5:** One-off? Yes (to clear arrears), but risk of recurrence.
  *   **Decision:** **REFER TO COMMITTEE.**
  *   **The Conflict:**
      *   *Strict LE:* **DENY.** You chose the holiday; you bear the cost. Funding this subsidises irresponsibility and reduces money for the stolen laptop student.
      *   *Procedure Outcome:* Step 4.C triggers an override. We cannot let a student become homeless.
      *   *Recommended Action:* Fund the arrears to prevent eviction (**Relational Override**), but attach a condition (mandatory budgeting workshop, no further grants).
      *   *Bursar Note:* >£800 requires signature. Justification: "Duty of Care override on Option Luck case to prevent homelessness."

  #### Case 3: The Parent Business Failure (Postgrad, £600/term ongoing)
  *   **Step 1:** Verified? Yes. Imminent? Yes (rent due).
  *   **Step 2:** Cause? Parental income collapse. **Classification: Brute Luck.**
  *   **Step 3:** Constraints? Yes, dependent on external income.
  *   **Step 4:** Consequence? Potential suspension.
  *   **Step 5:** One-off? **NO.** This is a recurring deficit (£1,800/year).
  *   **Decision:** **DENY GRANT (Refer to Loans/Finance).**
  *   **The Unpleasant Answer:** This is the case where the procedure hurts. The student is blameless (Brute Luck). But the pot is £60k. If we fund 10 students like this, we consume £18k (30% of the pot) on recurring costs that will reappear next year.
  *   **Rationale:** Hardship funds are for *shocks*, not *subsidies*. Funding this turns a bursary into a maintenance loan.
  *   **Mitigation:** Offer a one-term bridge (£600) to allow time to secure a bank loan or part-time work, but explicitly state no further grants will be available for rent.

  ---

  ### Part 4: The Critique (Where the Theory Bites)

  You asked for honesty about where Luck Egalitarianism is heartless and where the Feminist/Relational critique should override it.

  **The Critique:**
  Luck Egalitarianism focuses on *distribution* based on *responsibility*. The Relational/Feminist critique argues that the goal of welfare isn't to judge responsibility, but to ensure everyone stands as an equal member of the community. If we deny the "Holiday" student (Case 2) because they made a bad choice, we are effectively saying: *"You made a mistake, so you no longer belong here safely."* That creates a hierarchy of worthiness.

  **Where the Procedure Gives Way:**
  The HTP builds this critique into **Step 4 (Proportionality)**.
  *   **Strict LE:** "You chose the holiday, you sleep on the street."
  *   **Relational Override:** "You chose the holiday, which was foolish. But if you sleep on the street, you cannot be a student. We are a university, not a court. We will house you, but we will not reward you."

  **The "Unpleasant" Outcome:**
  I suspect you will dislike the outcome for **Case 3 (Postgrad)**.
  *   **Why:** They are blameless. Their parent's business failed (Brute Luck). LE says "Help them."
  *   **The Hard Truth:** The procedure says **Deny** (or limit to one-off).
  *   **Why:** Because the pot is finite. Funding a structural income gap for one student means denying a laptop to three others. LE helps us see that *fairness* isn't just about the individual in front of you; it's about the distribution across all 130 applicants.
  *   **The Triage Reality:** You cannot fix the welfare state with a £60k bursary. If you try to solve ongoing poverty, you will run out of money by March, and then the stolen laptop student in May gets nothing. The procedure forces you to admit: *This fund is for emergencies, not income support.*

  ---

  ### Part 5: Limitations & Risks

  Be under no illusion: this procedure will not solve the moral distress of your role. Here is where it will misfire:

  1.  **The 15-Minute Lie:** Distinguishing between "I didn't know I needed insurance" (Brute Luck) and "I didn't bother getting insurance" (Option Luck) takes more than 15 minutes. Triage officers will default to stereotypes. *Mitigation:* Require a brief personal statement from the student addressing "Why this was unforeseeable."
  2.  **The "Worthy Poor" Bias:** LE inherently creates a hierarchy of victims. The theft victim is "worthy"; the budgeting failure is "unworthy." This can seep into staff attitude. *Mitigation:* Training must emphasise that Step 4 (Welfare Override) is a *right*, not a favour.
  3.  **Structural Blindness:** The procedure treats "parental business failure" as an individual shock. It ignores that postgrad funding is structurally inadequate. The procedure manages the symptom, not the disease.
  4.  **The Bursar Bottleneck:** If you refer too many "Value Conflicts" (Case 2) to the Committee, the system slows down. You must empower triage officers to use the Step 4 Override without fear of rebuke.

  ### Final Recommendation

  Adopt the **Hardship Triage Protocol (HTP)** but brand it internally as a **"Continuity & Fairness Framework."**

  *   It gives you the **paper trail** (the checklist answers).
  *   It gives you the **philosophical cover** (LE distinguishes the laptop from the holiday).
  *   It gives you the **escape hatch** (Step 4 allows you to save the holiday student from eviction without admitting the policy is broken).
  *   It forces the **hard conversation** on Case 3 (that you cannot fund ongoing deficits).

  It will not make saying "no" easy. But it will make saying "no" consistent, and it will ensure that when you do say "yes," it is defensible to the Bursar, the Committee, and the students who didn't get funded.
