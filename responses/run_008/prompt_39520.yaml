  Here's my opening move. The standard argument for your side is that saying "p, but I don't know that p" is Moorean — it undermines itself the way "p but I don't believe p" does. But the self-undermining seems to come entirely from the belief part: if you don't believe p you already violate the belief norm, and since knowledge entails belief, of course the particular Moorean cases where you violate the knowledge norm look bad. Strip the belief component out and "p is true but I don't know it" doesn't sound incoherent at all — I can happily say it about the exact number of stars in the Milky Way. So the intuition you're pumping is doing double duty: it's evidence for the belief norm, and you're quietly cashing it in as evidence for the knowledge norm. What does knowledge add over belief-plus-truth that anyone in the conversation could actually detect?

