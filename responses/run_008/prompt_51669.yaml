answer: |-
  **Setting:** *A noisy café across the street from the philosophy building. Empty espresso cups clutter the table. ALEX (the Rescuer) is stirring a latte. JAMIE (the Skeptic) is scrolling through seminar notes on a tablet.*

  **Jamie:** I'm telling you, the Principle of Indifference is dead. We just watched it get stabbed three times in one hour. One-half, one-third, one-fourth. Take your pick.

  **Alex:** That's the point, though. You get those three answers because you applied indifference to three different *parameters* without checking if the parameterization respected the problem.

  **Jamie:** So the principle comes with a user manual now? "Apply only where safe"?

  **Alex:** Not a manual, a constraint. Look, Bertrand's problem is about a circle. The circle doesn't care where it is on the table, and it doesn't care how it's rotated. The problem setup is invariant under translation and rotation. If you demand your probability distribution shares those symmetries—which Jaynes argued you must—you don't get three answers. You get one.

  **Jamie:** The "straw throwing" model.

  **Alex:** Exactly. If you model it as throwing a long straw at a circle from a distance, the only distribution invariant under the Euclidean group of the plane gives you the 1/2 solution. Indifference isn't broken; we were just being careless about *what* we were indifferent to. We need indifference over the symmetry group, not just an arbitrary variable.

  **Jamie:** Okay, but that feels like you're solving the problem by stipulating the answer. You said "demand your distribution shares those symmetries." Why?

  **Alex:** Because the problem doesn't give us any information to distinguish one location or orientation from another. If your credence changes when I rotate the circle, you're using information you don't have.

  **Jamie:** Fine, let's leave the circle. Let's go to the Cube Factory. A factory makes cubes with side lengths between zero and two inches. You pick one at random. What's the probability the side is less than one inch?

  **Alex:** If we're indifferent over the side length, it's 1/2.

  **Jamie:** Right. But what's the probability the volume is less than one cubic inch? If we're indifferent over volume, it's 1/8. Since volume is just a function of side length, these are the same event. So indifference gives contradictory probabilities for the same state of affairs. And don't tell me about symmetry groups. What's the "symmetry group" of a cube sitting in a box?

  **Alex:** I'd argue the manufacturing process might impose symmetries. If the machine calibrates by volume...

  **Jamie:** See? Now you're doing physics. You're saying "indifference works *if* we know the causal mechanism." But the whole point of the Principle of Indifference was to assign probabilities *in the absence* of specific knowledge. As soon as you say "we need to know the symmetry group of the production," you've admitted that "picked at random" is meaningless without a physical selection procedure.

  **Alex:** I'm not admitting that. I'm saying the logical space of possibilities has structure. In Bertrand's case, the invariance move *does* work. It rules out the 1/3 and 1/4 solutions as mathematically inconsistent with the geometry. It's not magic, it's a filter.

  **Jamie:** But who filters the filter? You said we must choose the distribution invariant under the Euclidean group. Why not the affine group? Why not a group that scales with radius? Choosing the symmetry group is itself a substantive assumption that indifference can't justify. You haven't solved the arbitrariness; you've just moved it back one step.

  **Alex:** That's fair, but moving it back is progress. It forces you to make your assumptions explicit. Before, you could just say "I'm indifferent over chord midpoints" and hide the bias. Now you have to say "I assume the problem is invariant under translation." That's a claim about the problem description, not just a math trick.

  **Jamie:** But if the Cube Factory description doesn't specify the group, you're stuck. You can't derive a unique prior from logic alone.

  **Alex:** Maybe not always unique. But the invariance requirement shrinks the set of admissible priors. It stops us from being *arbitrarily* wrong. If I tell you a coin is symmetric, you won't assign 0.9 to heads. That's indifference doing work.

  **Jamie:** Because coins have a physical tossing mechanism.

  **Alex:** And circles have a geometric structure. Look, I'm not saying PoI gives you truth out of thin air. I'm saying it's a rule of consistency. If you claim to know nothing, your beliefs shouldn't change when I rotate the table. If they do, you're lying about knowing nothing.

  **Jamie:** *Sighs, putting the tablet down.* Okay. I'll grant you that. It's not a truth-generator, it's a consistency check. But I still think "I don't know which symmetry group applies" is a state of ignorance that indifference can't fix.

  **Alex:** Then we agree it's not a magic wand. But it's not dead either. It's just... on life support, waiting for the right symmetry.

  **Jamie:** *Smiles.* I can live with that. Want another espresso?

  **Alex:** Please. I need to stay awake to think about measure theory.
