answer: |-
  Here is the 45-minute teaching plan, optimized for a whiteboard-only session with a PM/Engineering audience.

  ### 1. The Upstream Conditions (Minutes 0–5)
  **What must be in place before cost enters the picture:**
  You are correct: the default assumption is that communication collapses into lying. But two specific conditions must exist *before* cost becomes relevant. If either is missing, costly signaling is unnecessary or impossible.

  1.  **Information Asymmetry:** One party knows a hidden trait (quality, fitness, intent) that the other needs to know.
  2.  **Conflict of Interest:** The sender benefits from the receiver believing them *even if the hidden trait is false*.

  **Whiteboard Action:**
  Draw two stick figures: **Sender** and **Receiver**.
  *   Write **"Hidden Quality"** above Sender.
  *   Draw an arrow from Sender to Receiver labeled **"Message."**
  *   Write **"Payoff"** next to Receiver.
  *   **Crucial Step:** Draw a scale next to Sender. Label one side **"Truth"** and one side **"Lie."** If the "Lie" side is heavier (more profitable), write **"Incentive to Deceive."**

  **Script:** "Before we talk about cost, we need to know why we can't just talk. If we both want the same thing (aligned interests), I can just tell you the truth. A fire alarm is cheap, but we believe it because the building owner doesn't want to burn down. But if I benefit when you believe me *even when I'm lying* (opposed interests), words become free and worthless. This is 'Cheap Talk.' In game theory, this collapses into noise. Cost is the only thing that restores the link between words and reality."

  **Misconception Head-Off ( #3: Aligned Interests):**
  Address this *now*, before the main example. If you wait until later, they will wonder why the Gazelle doesn't just "tell" the Cheetah it's fit.
  *   **Say:** "Note that if interests align, cheap signals work. If interests conflict, cheap signals fail. We are discussing the Conflict scenario."

  ---

  ### 2. The Carrier Example: Gazelle Stotting (Minutes 5–25)
  **Argument: Drop the Peacock.**
  *   **Why not the Peacock:** It invites the "waste proves fitness" handwave. People think "big tail = strong genes" magically. It also drags in sexual selection (Fisherian runaway), which confuses the *honesty* mechanism with the *preference* mechanism.
  *   **Why the Gazelle:** The stakes are immediate life-or-death (high conflict). The signal is behavioral (stotting/jumping high), not anatomical, which makes the *choice* to signal clearer. It isolates the "differential cost" logic better.

  **What the example must have:**
  *   **Hidden Trait:** Physical fitness/speed.
  *   **Receiver:** A predator (Cheetah) deciding whether to chase.
  *   **Cost:** Energy and time lost while jumping instead of running.
  *   **Differential Cost:** This is the non-negotiable mechanic. The cost must be *lower* for the high-quality sender than the low-quality sender.

  **What the example must lack:**
  *   **Direct Benefit to Receiver:** If the jump helped the Cheetah catch the Gazelle, it would be cooperation, not signaling.
  *   **Veblen Confusion:** Avoid human luxury goods. PMs will argue about "brand value" rather than "signal honesty."

  **Whiteboard Action:**
  *   Draw a Gazelle and a Cheetah.
  *   Draw two curves on a graph: **Y-axis = Cost**, **X-axis = Quality (Fitness)**.
  *   Draw a steep downward slope for **"Low Quality Gazelle"** (Jumping is exhausting/risky).
  *   Draw a shallow downward slope for **"High Quality Gazelle"** (Jumping is easy).
  *   Draw a horizontal line labeled **"Benefit of Not Being Chased."**
  *   Show where the lines cross the Benefit line.

  **Script:** "When a Gazelle sees a Cheetah, it sometimes jumps high in the air (stotting) instead of running. This seems insane. It wastes time. Why? Because it's a signal: 'I am so fit, I can waste energy and still outrun you.'
  Here is the math: For a fit Gazelle, the cost of jumping is low. For an unfit Gazelle, the cost is death (too tired to run after). The Cheetah knows this. The Cheetah ignores the stotting Gazelle and chases the one that runs flat out. The signal is honest *not* because it is expensive, but because it is **prohibitively expensive for the liar**."

  **Misconception Head-Off (#1 & #2: Expense & Literal Handicap):**
  Address this *during* the graph drawing.
  *   **Say:** "Notice I didn't say 'expensive.' I said 'differentially expensive.' If jumping cost the same for both, the unfit one would bluff. The 'Handicap' isn't a physical disability; it's a cost barrier that scales with quality."

  ---

  ### 3. Stability and Waste (Minutes 25–35)
  **Misconception Head-Off (#4: Optimizing Waste Away):**
  This is the hardest hurdle. Engineers/PMs hate inefficiency. They will ask: "Why doesn't evolution just make the signal free?"
  *   **Timing:** Address this immediately after the Gazelle mechanism is clear.
  *   **Whiteboard:** Erase the Gazelle. Draw a simple loop: **Signal → Belief → Benefit → Imitation.**
  *   **Script:** "You're thinking like an engineer: 'Minimize cost.' Evolution thinks like a game theorist: 'Stabilize equilibrium.' If the signal became free, liars would flood in. The belief would collapse. The cost *must* exist to keep the liars out. The waste is the feature, not the bug. It's a 'burning money' equilibrium."

  **Connection to PM Work:**
  *   Briefly map this to **SLAs (Service Level Agreements)**.
  *   "An SLA is a costly signal. If I promise 99.9% uptime, that's cheap talk. If I promise 99.99% with a financial penalty clause, that's a handicap. A bad engineering team cannot afford the penalty. A good team can. The penalty is the 'waste' that proves the quality."

  ---

  ### 4. The Test Question (Minutes 35–40)
  **Goal:** Test Separating vs. Pooling without jargon.
  **Scenario:** A Vendor Selection.

  **Ask this:**
  "Imagine we are hiring a security vendor.
  Vendor A says: 'We are secure.' (Free)
  Vendor B says: 'We are secure, and if we get breached, we pay you $10M.' (Costly)
  Vendor C says: 'We are secure, and if we get breached, we pay you $10M.' (Costly)

  Vendor A is low quality. Vendor B is high quality. Vendor C is low quality but reckless.
  1. Who do we hire?
  2. What happens to Vendor C over time?
  3. If the penalty dropped to $100, would Vendor B still signal?"

  **What to listen for:**
  *   They should identify that Vendor C creates a "pooling" outcome (both B and C signal, signal loses meaning).
  *   They should identify that if the cost drops too low ($100), Vendor A (low quality) can afford to lie, and the signal breaks.
  *   **Pass:** "Vendor C goes bankrupt, leaving only B. If the penalty is too low, A mimics B and we can't tell them apart."
  *   **Fail:** "We hire B because they are confident." (Misses the equilibrium logic).

  ---

  ### 5. Explicit Exclusions (Minutes 40–45)
  **What to refuse to cover:**
  To keep this to 45 minutes and prevent "bio-magic" thinking, you must explicitly bound the talk. Write this on the far right of the whiteboard under **"Out of Scope."**

  1.  **Fisherian Runaway:** "We are not covering why peacocks have *pretty* tails. That's aesthetic feedback loops, not honesty. We are only covering *honest* signals."
  2.  **Immunocompetence:** "We are not covering *how* the body pays the cost (hormones, immune system). We are treating cost as a black box."
  3.  **Appetite-Suppressing Parasites:** "We are not covering manipulation (like parasites forcing hosts to signal). We are only covering voluntary signaling between competitors."

  **Closing Script:**
  "If you take one thing away: Trust words when interests align. Trust costs when interests conflict. And ensure the cost hurts the liar more than the truth-teller. Otherwise, you're just burning money."

  ### Summary of Whiteboard Layout
  *   **Left:** Sender/Receiver, Asymmetry, Conflict (The Setup).
  *   **Center:** Gazelle Cost Curves (High Quality vs. Low Quality) + SLA Analogy.
  *   **Right:** Out of Scope List + The Test Question.

  ### Why this sequence works for PMs
  1.  **Conflict First:** It validates their cynicism ("people lie in meetings") before offering the solution.
  2.  **Gazelle over Peacock:** It removes "beauty" and focuses on "survival risk," which maps better to product risk.
  3.  **Differential Cost:** It corrects the "burning money = virtue" error by showing the math of the bluff.
  4.  **Exclusions:** It prevents the smartest person in the room from derailing the session with Wikipedia-deep biology trivia.
