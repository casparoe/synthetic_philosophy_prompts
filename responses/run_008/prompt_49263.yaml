prompt: |-
  I'm doing a 45-minute lunch-and-learn at my company on costly signaling and the handicap principle. Audience is product managers plus a couple engineers, zero bio background, but everyone half-remembers the peacock tail story and half the room says "virtue signaling" in meetings, so they think they already get it. Don't explain the concept to me -- I know it. I need the teaching plan. Specifically: what has to be in place before cost even enters the picture (my guess is the default assumption that signaling between parties with opposed interests should just collapse into lying, but tell me if something comes upstream of that), which one example should carry the whole session and why not the peacock tail if not that -- I suspect it invites the "waste proves fitness" handwave and lets people stop thinking, but argue me out of or into it -- plus what the carrier example needs to have and what it must lack (e.g. whether it's a mistake to use a human example like burning money on advertising when the audience will pattern-match it to Veblen stuff and miss the equilibrium point). Then the misconceptions they'll walk in with or form on the spot: I'd bet on (1) any expense makes a signal honest, so luxury pricing and gazelle stotting look like the same thing, (2) "handicap" read literally as a physical impediment rather than differential cost, (3) not seeing why a cheap signal can be perfectly believed when interests are aligned (fire alarm, vervet alarm calls), and (4) the intuition that evolution should just optimize the waste away since it's such an obvious loss. For each one tell me exactly where in the sequence to head it off, not just that it exists -- like whether the aligned-vs-opposed interests distinction needs to come before or after the main example gets introduced, since I can see it cutting both ways. End with one question I can ask that tests whether they actually got separating from pooling outcomes without using any of that jargon, and tell me what I should openly refuse to cover in 45 minutes (Fisherian runaway? the immunocompetence stuff? appetite-suppressing parasites?) and say out loud to the room that I'm skipping it. Whiteboard only, no slides if that matters to the ordering.
