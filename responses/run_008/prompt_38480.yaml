answer: |-
  **Q&A PREP SHEET: Epicureanism in Palliative Care**

  **PRE-EMPTIVE CONCESSIONS (State in closing remarks to save time)**
  *   **Clinical Utility:** Explicitly state: "Even if death is metaphysically neutral, treating it as a loss is clinically vital. Do not change your practice based on this talk." This disarms the clinicians and psychiatrist immediately.
  *   **The Symmetry Argument:** Tell the bioethicist: "I know the symmetry argument is contested (Nagel, Feldman). I'm using it heuristically to reduce anxiety, not as a final metaphysical proof." This invites collaboration rather than combat.

  ***

  **1. THE PSYCHIATRIST (Adolescent Unit)**
  *   **The Question:** "I work with suicidal teens who already feel life isn't worth living. If you tell them death isn't 'bad for them' because they won't exist to experience it, aren't you removing an ethical barrier to self-harm? You're validating the logic of suicide."
  *   **The Reply (2 mins):** Distinguish metaphysics from therapy. My claim is about the *state* of being dead, not the *act* of dying or the consequences. Suicide prevention relies on the harm to the bereaved (which I grant is real and terrible) and the potential for future positive experience (which death forecloses, even if the subject doesn't miss it). Also, therapy isn't about metaphysical truth; it's about reducing suffering. If believing death is bad keeps them safe, that belief is therapeutic. I am offering a tool for peace, not a policy for triage.
  *   **Soft Spot:** You are conceding the view shouldn't be spoken to vulnerable patients. It risks sounding like you have a "private truth" that is dangerous for the public.

  **2. THE CLINICIANS (Nurses/Physicians)**
  *   **The Question:** "Our job is to prolong life and manage dying. If death isn't a harm, why strive for extra weeks? Does this make our work pointless? Are we just delaying a neutral event?"
  *   **The Reply (2 mins):** Reframe palliative care. You aren't fighting death; you're fighting suffering *now*. If death is neutral, the priority shifts entirely to quality of life, which is your core mission. Extending life is only good if the life extended contains positive experiences. This view actually supports hospice over aggressive, painful futile care. It validates stopping treatment when the process of dying becomes worse than the neutral state of death. You are protecting the living patient, not chasing a ghost.
  *   **Soft Spot:** Hard to justify life-prolonging interventions that involve significant suffering if the endpoint (death) is neutral and the future goods are uncertain.

  **3. THE BIOETHICIST (Analytic Philosopher)**
  *   **The Question:** "The symmetry argument fails. Past non-existence isn't bad because there was no subject to have goods. Future non-existence deprives a subject of goods they currently have a claim to. You're ignoring the modal difference."
  *   **The Reply (2 mins):** Grant the technical point. "You're right, the literature is dense here. But my goal isn't to win the metaphysical debate against Nagel; it's to offer a therapeutic tool for death anxiety. Even if deprivation accounts are logically sound, they don't comfort the dying. Can we agree on the practical upshot even if the metaphysics differ? I'm interested in whether this view helps patients sleep, not just whether it holds up in *Mind*."
  *   **Soft Spot:** You are abandoning the philosophical rigor of your paper to save the clinical application. He knows this.

  **4. THE CHAPLAIN (Religious)**
  *   **The Question:** "For many patients, life is a sacred gift. Saying death is 'nothing' dismisses their belief in an afterlife or the sanctity of their remaining time. Isn't this secular nihilism?"
  *   **The Reply (2 mins):** This is compatible with faith. Epicurus wasn't denying God; he was denying death's power to harm the soul. If there is an afterlife, death is a transition, not an end. If there isn't, there's no pain. Either way, fear is unnecessary. This supports peace, not nihilism. It allows the religious patient to focus on their relationship with the divine now, rather than fearing the threshold.
  *   **Soft Spot:** May still feel reductive to those whose faith relies on death being a significant spiritual threshold or judgment moment.

  ***

  **STRATEGY NOTE:** If the Psychiatrist asks the suicide question, prioritize safety over consistency. Admit the view is dangerous in that context. Better to lose the argument than endanger patients. Keep eye contact with the clinicians during the "Clinical Utility" concession.
