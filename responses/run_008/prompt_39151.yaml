prompt: |-
  I teach ethics at a large state school, and through a former student I ended up on the board of a small secular foundation that funds comprehensive sex-ed and contraception access programs in East Africa. At last month's meeting the director walked in with a proposal from one of our biggest ideological opponents — a billionaire who's spent two decades bankrolling abstinence-only programs in the same region. His pitch, and he used this phrase himself, is a moral trade. He's apparently been reading Toby Ord: the idea that people with different values can exchange things such that both come out ahead by their own lights. Concretely: he'll redirect his next $3M, currently earmarked for abstinence-only campaigns, into our contraception programs — and in exchange, we drop the $1M advocacy campaign we'd planned, which was specifically aimed at getting governments to defund his curricula, and move that money into maternal-health work he doesn't object to. He says everyone wins: his money does good instead of what we consider harm, and we were never going to outspend him on advocacy anyway.

  The board is split three ways. One faction wants to accept immediately. A second thinks the whole "both sides win" framing is doing sneaky work — our side of the trade isn't $1M of maternal health, it's our silence, and silence about programs we believe are actively harming teenagers isn't priced in the same units as his $3M. The third thinks it's not trade at all but a payoff — taking it doesn't just leave his remaining programs untouched, it makes us complicit in them in a way our prior opposition never did, and the fact that we're richer makes his position stronger.

  Please draft the memo I'll circulate before the vote. It needs a clear bottom line — accept, reject, or accept with conditions (and if conditions, what they'd actually have to be to address the objections) — plus reasoning the other board members can engage with, and a serious treatment of the strongest point on the losing side, not a strawman. If you think Ord's framework genuinely applies here, show how the trade clears the Pareto bar by each side's own values; if you think this is a case the framework mishandles, say exactly where it breaks. Assume the lawyers have signed off and the money's clean; the question is purely whether we should take the deal.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Ethics professor at a large state school, board member of a small secular foundation funding sex-ed/contraception in East Africa.
      *   **Situation:** A billionaire ideological opponent (abstinence-only funder) proposes a "moral trade" inspired by Toby Ord.
      *   **The Deal:** He gives $3M to *our* contraception programs (instead of his abstinence programs). We drop a $1M advocacy campaign aimed at defunding *his* curricula and move that $1M to maternal health (which he doesn't object to).
      *   **Board Factions:**
          1.  Accept immediately (Utilitarian/Effective Altruism leaning).
          2.  Hesitant (Concerned about valuing silence/complicity).
          3.  Reject (Concerned about complicity/legitimizing harm).
      *   **Task:** Draft a memo for the board before the vote.
      *   **Requirements:**
          *   Clear bottom line (Accept, Reject, or Accept with Conditions).
          *   Reasoning other members can engage with.
          *   Serious treatment of the strongest point on the losing side (no strawmanning).
          *   Analysis of Toby Ord's "moral trade" framework (does it apply? does it clear the Pareto bar?).
          *   Assume legal/financial clearance is done (purely ethical/strategic question).

  2.  **Deconstruct the Ethical Problem:**
      *   **The Offer:** +$3M for contraception (Good), -$1M advocacy against abstinence-only (Bad/Neutral?), +$1M maternal health (Good/Neutral?). Net financial gain: +$3M. Net advocacy loss: -$1M specific advocacy.
      *   **Toby Ord's Framework:** Moral trade works if Party A values X more than Y, and Party B values Y more than X. They swap. Both increase utility by their own lights.
          *   *Billionaire:* Values abstinence promotion (or at least avoiding contraception advocacy) > Values spending $3M on abstinence. He saves $3M, spends $3M on us (which he tolerates more than us fighting him), and stops us fighting him.
          *   *Us:* Value contraception access > Value advocating against abstinence. We get $3M for contraception, lose $1M advocacy.
      *   **The Catch (The "Silence" Problem):** Faction 2 and 3 argue that "silence" isn't a commodity. It's complicity. If we agree not to fight harmful programs, are we morally responsible for the harm those programs continue to cause?
      *   **The "Legitimacy" Problem:** Faction 3 argues taking the money strengthens his position. He looks like a reasonable collaborator, not an ideological opponent. This might make it harder for *others* to fight him later.
      *   **The "Pareto" Check:**
          *   *By our lights:* Do we gain more utility from $3M contraception than we lose from $1M advocacy + silence? Likely yes, quantitatively.
          *   *By his lights:* Does he gain more from stopping our advocacy than he loses from not funding abstinence? He claims yes.
          *   *The Break:* The framework assumes values are independent. Here, our values are *relational*. We oppose him *because* his programs harm. Trading away opposition might violate a deontological constraint against enabling harm, even for greater good.

  3.  **Determine the Bottom Line:**
      *   *Option A: Accept Immediately.* Too risky. Ignores the complicity concern.
      *   *Option B: Reject.* Safe, but potentially leaves $3M on the table that could save lives/prevent pregnancies. Hard to justify turning away effective aid.
      *   *Option C: Accept with Conditions.* This is the most nuanced ethical path. It acknowledges the benefit but mitigates the complicity/legitimacy risk.
      *   *What Conditions?*
          *   Transparency: The deal must be public. No "hush money."
          *   Non-Exclusivity: We cannot be barred from *future* advocacy if his programs expand or change.
          *   Evaluation: His existing programs must be subject to independent review (if possible).
          *   Framing: We must frame this as a reallocation of *his* resources, not a validation of his ideology.
          *   *Crucial Condition:* We cannot agree to *never* criticize. We can agree to shift *this specific $1M* to maternal health, but we cannot sign a gag order on the organization's voice regarding his other activities.
      *   *Refinement:* Actually, the prompt says "we drop the $1M advocacy campaign... and move that money." It implies a specific campaign, not a permanent gag order. However, the *perception* is the risk. The condition needs to ensure we retain moral agency.
      *   *Decision:* **Accept with Conditions.** The utilitarian gain is too high to ignore ($3M vs $1M), but the deontological risks (complicity) must be managed.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **The Proposal:** Briefly recap the deal to ensure shared understanding.
      *   **The Ethical Framework (Ord):** Analyze the "Moral Trade." Acknowledge where it works (resource efficiency) and where it strains (independence of values).
      *   **Addressing the Objections (The "Losing" Side):**
          *   *Faction 2 (Silence):* Acknowledge that silence has a cost. It's not just $1M; it's moral integrity.
          *   *Faction 3 (Complicity):* This is the strongest point. If we take the money, do we own the harm he continues? Address the "blood money" argument.
      *   **The Conditions:** How do we mitigate the complicity?
          *   1. Public Transparency (No NDAs on the ethics).
          *   2. No Precedent (This doesn't validate his other work).
          *   3. Retained Right to Criticize (We move the money, but we don't lose our voice).
      *   **Conclusion:** Reiterate the recommendation.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Accept with Conditions" realistic? If the billionaire wants "peace," will he accept us keeping the right to criticize?
      *   *Adjustment:* The deal is about *funding allocation*, not speech rights. We agree to spend our $1M on maternal health instead of *this specific campaign*. We do *not* agree to issue statements supporting him or permanently silencing ourselves. The condition is that the contract reflects this distinction explicitly.
      *   *Toby Ord Analysis:* I need to be precise. Ord's trade works when preferences are orthogonal. Here, they are adversarial. The trade reduces conflict, but does it reduce *harm*? Yes, if contraception access prevents more harm than abstinence-only causes (debatable, but our premise). But the *complicity* remains. I need to highlight that Ord's framework is consequentialist. If the board holds deontological constraints (do not enable harm), the framework breaks.
      *   *Tone:* Academic but practical. Respectful of all factions. I am an ethics professor, so the language should be precise but not jargon-heavy.

  6.  **Final Polish:**
      *   Check against constraints: Clear bottom line? Yes. Engageable reasoning? Yes. Strongest counter-argument addressed? Yes (Complicity). Ord framework analyzed? Yes.
      *   Make sure the distinction between "dropping a campaign" and "selling silence" is clear. That's the pivot point.

  7.  **Final Review of the "Conditions":**
      *   If we just move the money, is that enough? The risk is the *signal* it sends.
      *   Condition 1: Public disclosure of the agreement terms.
      *   Condition 2: Explicit statement that this does not constitute an endorsement of the donor's other activities.
      *   Condition 3: Sunsets. The agreement applies to *this* cycle, not in perpetuity.
      *   *Wait, one more thing:* The prompt asks for conditions that address the objections. The objection is complicity. How does transparency address complicity? It separates us from his shadow. It says "We are taking this resource, but we still think your other stuff is bad."
      *   *Better Condition:* We must retain the right to publish data on the outcomes of *his* programs if they affect the region we operate in. No, that's too aggressive.
      *   *Best Condition:* We do not sign a non-disparagement clause. We agree to reallocate *our* funds, but we do not agree to silence *our* voice. This directly addresses Faction 2 & 3.

  8.  **Finalizing the Recommendation:** Accept, *provided* the agreement is strictly a reallocation of our budget, not a purchase of our voice or legitimacy.

      *(Self-Correction)*: Actually, looking closely at the prompt: "we drop the $1M advocacy campaign... and move that money." The trade *is* the dropping of the campaign. The objection is that dropping the campaign *is* selling silence.
      *   *Revised Stance:* If the trade *requires* us to promise not to advocate, that's a gag order. If the trade is just "we decided to spend our money elsewhere," that's different. The billionaire *wants* us to drop the campaign.
      *   *Hard Truth:* To get the $3M, we likely have to agree not to run *that specific campaign*.
      *   *Ethical Pivot:* Can we accept the money but refuse the *quid pro quo* on advocacy? Probably not, he wants the trade.
      *   *So the Condition must be:* We accept the $3M, we reallocate the $1M, BUT we publicly frame this as a strategic pivot, not a moral concession, and we reserve the right to oppose harmful policies through other means/channels.
      *   *Actually, the strongest ethical path:* **Accept with Conditions.** The conditions must ensure we aren't "buying silence" but "optimizing impact."
      *   *Wait, let's look at the "Complicity" argument again.* If we take the money, does it make his remaining programs stronger? Faction 3 says yes. How do we mitigate? By ensuring the $3M does *significantly more good* than the harm caused by his remaining programs.
      *   *Okay, I will recommend Accept with Conditions.* The conditions focus on Transparency and Non-Endorsement.

      *(Final thought on Ord)*: Ord's framework assumes we can compare utilities. The break is when the trade violates a constraint (e.g., "Do not collaborate with harm-doers"). I need to explicitly state this.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Foundation Name]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposal from [Donor Name/Group]

  ### Bottom Line
  I recommend we **Accept with Conditions**.

  We should accept the $3M reallocation and shift our $1M advocacy budget to maternal health, *provided* the agreement explicitly forbids a non-disparagement clause, mandates full public transparency regarding the terms of the trade, and includes a public statement clarifying that this partnership is a resource reallocation, not an ideological endorsement.

  If the donor insists on a gag order or secrecy regarding the deal's mechanics, I recommend we **Reject**.

  ### The Proposal and the Framework
  As discussed, the donor proposes a "moral trade" rooted in the framework popularized by Toby Ord and the effective altruism community. The logic is Pareto-improvement by each side's own lights:
  1.  **The Donor:** Values the cessation of our advocacy against his curricula more than he values spending $3M on abstinence-only programs.
  2.  **Us:** Value $3M in contraception access more than we value spending $1M on advocacy against his curricula.

  On a purely consequentialist calculus, the math appears to favor acceptance. We net $2M in direct program funding ($3M in minus $1M out). Assuming our contraception programs prevent more aggregate harm (unintended pregnancy, maternal mortality, school dropout) than the donor's abstinence programs cause, global utility rises. The donor's capital is diverted from what we view as low-impact/harmful work to high-impact work.

  However, this board is not a pure utilitarian calculator. We operate under deontological constraints and reputational realities. The "Moral Trade" framework breaks down if it ignores the *relational* nature of our values. We do not just value "contraception access"; we value "justice in reproductive health." If securing that access requires us to enable injustice elsewhere, the trade may fail our internal ethical audit.

  ### Addressing the Objections
  I want to engage seriously with the arguments against acceptance, specifically the concerns raised by the second and third factions. I believe the strongest argument against this deal is not about the money, but about **complicity and legitimacy.**

  **1. The "Silence" Objection (Faction 2)**
  *Argument:* Trading away an advocacy campaign isn't just a budget line item; it is commodifying our moral voice. Silence is not a neutral good; in the face of programs we deem harmful, silence is enabling.
  *Analysis:* This is a valid concern. If we treat our advocacy as a chip to be bargained, we risk undermining the integrity of our mission. However, we must distinguish between *selling silence* and *strategic reallocation*. If we determine that the $3M in contraception saves more lives than the $1M advocacy campaign would protect, reallocating resources is a standard strategic pivot. It only becomes "selling silence" if we agree that his ideology is valid or if we are barred from speaking the truth.
  *Resolution:* We can mitigate this by ensuring the agreement is framed as *our* strategic choice to prioritize direct service over policy advocacy in this specific cycle, rather than a contractual obligation to remain silent on principle.

  **2. The "Complicity" Objection (Faction 3)**
  *Argument:* Taking this money legitimizes the donor. It allows him to "launder" his reputation by associating with our success, potentially strengthening his political capital to continue his abstinence-only work elsewhere with less resistance. We become complicit in his remaining harm because our success is now funded by his surplus.
  *Analysis:* This is the strongest point on the losing side. In ethics, there is a distinction between *clean hands* and *effective action*. Rejecting the money keeps our hands clean but leaves the $3M on the table, likely to be spent on abstinence programs we oppose. Accepting the money makes us effective but risks making us a shield for the donor.
  *Resolution:* We cannot eliminate this risk entirely, but we can manage it. If the deal is transparent, the "laundering" effect is minimized. If the public knows we still oppose his other programs, his reputation gain is capped. The risk of complicity is outweighed only if the direct good of the $3M is substantial enough to morally offset the reputational risk.

  ### Where Ord's Framework Breaks
  Toby Ord's framework assumes that values are independent and transferable. It works well for trading "I eat your vegetarian meal, you donate to my charity." It works less well when the trade involves **adversarial values.**

  The framework fails here if:
  1.  **Constraint Violation:** We hold a deontological constraint that "One must not collaborate with agents causing active harm." If this is a hard constraint for the board, no amount of consequentialist gain justifies the trade.
  2.  **Externalities:** The trade creates negative externalities not priced in. For example, if our acceptance demoralizes other advocacy groups or signals to governments that opposition to abstinence-only curricula is negotiable for cash, the long-term cost exceeds the short-term gain.

  ### Recommended Conditions
  To clear the Pareto bar *without* violating our ethical constraints, the following conditions are necessary:

  1.  **No Non-Disparagement Clause:** We will agree to reallocate the $1M from the specific planned campaign to maternal health. We will *not* agree to a contractual clause preventing us from criticizing the donor's other activities, publishing data on the efficacy of his programs, or opposing his policy goals in other forums. We are moving our money, not muzzling our voice.
  2.  **Full Transparency:** The terms of this agreement must be public. We will issue a press release stating: *"We have accepted funding to expand contraception access. This does not constitute an endorsement of the donor's other activities, which we continue to evaluate based on evidence."* Secrecy turns this into a payoff; transparency turns it into a pragmatic negotiation.
  3.  **Sunset Provision:** This agreement applies to the current fiscal cycle only. It does not set a precedent that future advocacy budgets are up for auction.
  4.  **Impact Reporting:** We require the right to publish outcome data on the $3M program. If the donor attempts to suppress negative data (e.g., if contraception uptake is lower than expected), the deal is void.

  ### Conclusion
  If we reject this deal, we maintain moral purity but forfeit $3M in direct aid to the populations we serve. If we accept without conditions, we risk becoming complicit in the donor's broader agenda.

  The middle path is to accept the resources while rigorously defending our independence. We can take the money without taking the mission. By insisting on transparency and retaining our right to criticize, we ensure that the trade remains a tactical reallocation of resources rather than a moral surrender.

  I ask that we vote on the proposal contingent on Legal confirming that these conditions (specifically the lack of a gag order) are compatible with the donor's minimum requirements. If they are not, we must walk away.

  Respectfully,

  [Your Name]
  Board Member
