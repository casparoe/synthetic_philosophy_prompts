answer: |-
  # Joint Statement on the Norms of Assertion
  **Date:** Post-match, pending final pint  
  **Parties:** The Undersigned (hereinafter "The Truther") and The Bloke (hereinafter "The Knower")  
  **Context:** To resolve a recurring dispute regarding the rules governing what one is allowed to flat-out assert, without resorting to further circular shouting over lager.

  ---

  ## 1. Agreed Principles (The Common Ground)
  Before recording our differences, we both sign below to confirm we agree on the following baseline rules. These are not in dispute.

  1.  **Assertion involves commitment:** To assert a proposition $p$ is to present it as a fact, inviting others to rely on it. It is distinct from guessing, supposing, or joking.
  2.  **Lying is improper:** Asserting $p$ when one believes $p$ is false is always improper, regardless of whether $p$ turns out to be true by accident.
  3.  **Baseless guessing is improper:** Asserting $p$ without any evidence or grounds (a pure hunch) is improper, even if $p$ turns out to be true.
  4.  **Falsehoods are generally improper:** Asserting $p$ when $p$ is false is improper, though one may be excused if one had excellent grounds for believing it true.
  5.  **Criticism is context-sensitive:** Challenging an assertion ("How do you know?") is a standard part of conversation, but the *force* of that challenge is what we disagree on (see Section 3).
  6.  **Knowledge is factive:** We agree that one cannot "know" something that is false. If $p$ is false, neither of us knows $p$.

  ---

  ## 2. Residual Disagreements
  The following table outlines the specific points where our views diverge. We have phrased these such that each side accepts the description of their own position.

  | Feature of the Dispute | The Knower's Position (Knowledge Norm) | The Truther's Position (Truth-Plus-Grounds Norm) |
  | :--- | :--- | :--- |
  | **The Necessary Condition** | To assert $p$ properly, you *must* know $p$. Knowledge is the constitutive rule of assertion. | To assert $p$ properly, $p$ must be true and you must have reasonable grounds. Knowledge is not strictly required. |
  | **Gettier Cases**<br>*(True belief via luck/bad data)* | If you lack knowledge (e.g., your source was flawed but the fact turned out true), your assertion was improper. | If you checked the best available source and $p$ is true, your assertion was proper, even if you didn't technically "know." |
  | **The Lottery Case**<br>*(High probability, no knowledge)* | You cannot assert a lottery ticket lost before the draw is confirmed, because you do not *know* it lost, however probable. | If the ticket actually lost and the odds were overwhelming, the assertion was proper. The lack of "knowledge" is irrelevant. |
  | **The Challenge**<br>*("How do you know?")* | If you assert $p$ without knowing it, you have violated the rule. A challenge pointing out you lack knowledge is a valid criticism of the *act*. | A challenge must show you are wrong or lacked grounds. Merely showing you lacked "knowledge" (in the strict philosophical sense) is not a valid criticism. |
  | **Moorean Sentences**<br>*("It's raining but I don't know it")* | This sounds broken because it violates the knowledge rule. You are asserting $p$ while admitting you break the rule for asserting $p$. | This sounds weird merely because it is pragmatically confusing, not because it breaks a constitutive rule of assertion. |

  ---

  ## 3. The Cruxes (Test Cases & Predictions)
  To move this forward, we identify three specific sub-questions ("Cruxes"). For each, we have agreed on a concrete case. We record our predictions now. If future reflection or new arguments shift our view on these cases, the main dispute should be considered resolved in favour of the other side.

  ### Crux 1: The Misprinted Timetable (The Gettier Intuition)
  **The Case:** A passenger checks the official station app. It says the 6:15 is the fast train. The app has a glitch (a misprint in the database), but by pure coincidence, the 6:15 *is* indeed the fast train today. The passenger asserts to a fellow traveller: "The 6:15 is the fast one."
  *   **The Question:** Was the passenger's assertion *proper* at the moment it was made?

  | Party | Prediction / Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **The Knower** | **Improper.** | The passenger did not *know* the fact (the source was defective). Therefore, the assertion violated the rule, even though it was helpful. |
  | **The Truther** | **Proper.** | The passenger acted on the best available evidence and the statement was true. The glitch is a technicality that doesn't make the speech act wrong. |

  ### Crux 2: The Lottery Phone Call (The High-Stakes Probability)
  **The Case:** It is the morning after the draw. The Knower rings his mate. The numbers are on the website but haven't been cross-referenced with the mate's ticket yet. The Knower looks at the winning numbers, sees they don't match his mate's, and asserts: "Your ticket lost." (It turns out this is true).
  *   **The Question:** Is the Knower open to criticism for making this assertion before the official confirmation?

  | Party | Prediction / Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **The Knower** | **Yes, open to criticism.** | I admitted I didn't *know* (errors happen). I should have said, "It looks like you lost." Asserting it flat-out was presumptuous. |
  | **The Truther** | **No, not open to criticism.** | The grounds were near-certain and the statement was true. To demand absolute knowledge here is pedantic. The assertion was fit for purpose. |

  ### Crux 3: The Authority of the Challenge
  **The Case:** The Truther asserts, "The server is down." He has checked the dashboard (which is reliable but theoretically fallible). He does not have direct access to the physical machine. The Knower replies, "You can't assert that; you don't *know* the server is down (you haven't physically checked it)."
  *   **The Question:** Is the Knower's challenge a valid move in the conversation?

  | Party | Prediction / Verdict | Reasoning |
  | :--- | :--- | :--- |
  | **The Knower** | **Valid.** | Assertion implies knowledge. Pointing out the lack of knowledge exposes that the assertion was not warranted. |
  | **The Truther** | **Invalid.** | The challenge is only valid if the dashboard is unreliable or the server is actually up. Pointing out a lack of metaphysical "knowledge" is irrelevant to the practical assertion. |

  ---

  ## 4. Note on the Verbal Dispute
  We suspect part of our argument may be merely verbal (a disagreement over words rather than facts). We identify the following ambiguity:

  **The Word: "Proper" (or "Allowed")**
  *   **The Knower** tends to use "proper" to mean **Constitutively Correct**. Like a move in chess: if you move a rook diagonally, you haven't just played badly; you haven't played chess. He argues that without knowledge, you haven't truly made a valid assertion.
  *   **The Truther** tends to use "proper" to mean **Blameless / Reasonable**. Like a move in football: if you tackle the ball but foul the man, you made a play, but it might be penalised. He argues that if you acted reasonably and spoke the truth, you did nothing wrong, even if you lacked "knowledge."

  **Resolution Strategy:**
  If The Knower admits that an assertion without knowledge can be **blameless** (even if technically "incorrect" by his definition), and The Truther admits that **knowledge** is the gold standard even if not strictly required, the gap narrows significantly. We agree to revisit this distinction after testing the cases in Section 3.

  ---

  ## 5. Signatures
  *We agree to abide by this document as the reference point for future discussions. If either party changes their mind on a Crux, they buys the next round.*

  **Signed (The Truther):** __________________________  
  **Signed (The Knower):** __________________________  
  **Witness (Barman):** _____________________________
