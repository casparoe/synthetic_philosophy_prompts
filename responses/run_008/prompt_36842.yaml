      *   *Roommate's Point:* Interpolation $\neq$ Understanding.
      *   *Rebuttal:* In cognitive science, generalization *is* often the operational definition of understanding. If you can't generalize, you definitely don't understand. If you can, it's evidence (but not proof) of understanding.

  3.  **Analyze the Tension (Conversation vs. Benchmarks vs. Interpretability):**

