answer: |-
  Dear Friend,

  It is a pleasure to hear from you, and I must say this latest case from your old field presents a delightful puzzle for your reading group. You are quite right to suspect that your past verdicts rely on more than one interpretative rule, for Lakatos himself was sometimes ambiguous on whether empirical novelty or theoretical coherence should take precedence when the two come apart. Looking at your track record, I see a tension between what we might call the strict empirical novelty rule and the theoretical non-ad hocness rule. The strict empirical view, which seems to guide your rulings on Newton and Ptolemy, holds that a programme is progressive only if it continuously yields confirmed novel facts, and degenerating if it merely accommodates known data or survives anomalies through patching. However, your handling of String Theory suggests a second rule is at play, one that prioritises the integrity of the positive heuristic; you are willing to withhold a degenerating verdict so long as modifications are theoretically motivated rather than mere epicycle patching, even if empirical confirmation is lacking. Similarly, your ruling on General Relativity and Bohr indicates that explaining a known anomaly counts as progressive provided the theory was not constructed solely to fit that specific anomaly, valuing the unification of knowledge over strict temporal novelty.

  Applying these competing rules to your chemistry case yields divergent results. If you follow the strict empirical novelty rule, the programme looks degenerating. It made two bold predictions that failed, and it has produced no risky predictions since, suggesting a stagnation of empirical content that rivals the later stages of Ptolemaic astronomy. The successful retrodiction of the unknown anomaly is a point in its favour, akin to the Mercury perihelion case, but the subsequent failures and silence might outweigh that initial success under a strict empirical reading. Conversely, if you apply the theoretical non-ad hocness rule derived from your String Theory deliberation, the programme remains progressive, or at least not yet degenerating. The crucial detail here is that the failures were handled by adding a free parameter justified by general symmetry considerations rather than by fudging. This mirrors your tolerance for String Theory; the adjustments are driven by the positive heuristic of the theory itself, not by a desperate attempt to save the phenomena alone. The fact that the parameter is grounded in symmetry suggests theoretical depth rather than ad hocery, which should protect the programme from a degenerating verdict despite the empirical setbacks.

  My best guess, if you wish to remain consistent with your most recent and nuanced rulings, is that you should classify this programme as progressive, or perhaps more cautiously as not yet degenerating. The precedent set by String Theory is the strongest guide here; you refused to condemn a programme for lack of confirmed predictions because it lacked epicycle patching, and in this chemistry case, you have explicit justification that the patches are not epicycles but consequences of symmetry. Furthermore, the retrodiction of the unknown anomaly carries significant weight, similar to your treatment of General Relativity and Mercury, demonstrating that the hard core possesses explanatory power beyond its initial construction. To rule it degenerating now would be to punish the group for the very theoretical rigour you praised in String Theory, unless you decide that failed predictions are worse than no predictions, which would require a new principle not yet evident in your past meetings.

  To cleanly tell these rules apart in the future, you should look for an episode where a programme makes theoretically motivated adjustments that are non-ad hoc but leads to a long period of empirical stagnation without any new novel facts. If your group eventually labels such a programme degenerating solely due to the lack of new predictions, you will have confirmed that empirical novelty is your ultimate arbiter. However, if you continue to protect it based on theoretical coherence alone, you have firmly adopted the theoretical non-ad hocness rule. A specific test case would be a scenario where the symmetry parameter eventually yields a new, unrelated novel fact decades later; if you count that as progressive retrospectively, you value the theoretical chain, but if you insist the protection should have lapsed during the quiet period, you value continuous empirical output. I suspect your group will find this distinction particularly fertile ground for debate, much like the chemistry case itself.

  Warm regards,

  A Fellow Traveller
