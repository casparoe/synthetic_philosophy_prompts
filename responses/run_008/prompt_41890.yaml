  3.  **Drafting the Menu of Theses (Iterative Process):**

      *   *Thesis 1: The Specific Counterfactual.* (If the driver turns left, no war).
          *   *Plausibility:* High (in the short term).
          *   *Relation to Structure:* Compatible. Structure creates the *potential*, contingency triggers the *actual*.
          *   *Verdict:* Doesn't dismiss structure.

      *   *Thesis 2: The Fragility Thesis.* (The system was unstable).
          *   *Plausibility:* Medium/High. Europe *was* a powder keg.
          *   *Relation to Structure:* Actually *supports* structural explanation. A stable system wouldn't fall due to a nail.
