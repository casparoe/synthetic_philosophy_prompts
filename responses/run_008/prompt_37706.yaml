      *   *3. Realism about animals:* Cats have beliefs *independently* of our stance/practices. (Realism vs. Instrumentalism).
      *   *4. Determinacy:* "Belief" means the same thing for AI and cats. It's a factual question with a correct answer in both cases.
      *   *5. The relevance of interpretability:* Mechanistic evidence (probes, causal structures) *would settle* the question of real belief.
      *   *6. Unity as a constraint:* Belief requires cross-contextual disposition to infer/act (functional role). AI meets this increasingly.

  3.  **Identify Tensions (Pairwise Analysis):**

      *   *1 & 2:* Consistent. 1 says we *need* the stance; 2 says the stance is instrumental. This is classic Dennett.
      *   *1 & 3:* Tension. 1 says we *need* the stance to predict AI. 3 says cats have beliefs *without* the stance. Why the difference in necessity? Is the stance constitutive for AI but descriptive for cats?
      *   *2 & 3:* **Major Tension.** 2 says belief attribution is instrumental (doesn't report inner facts). 3 says cat beliefs are real independently of our practices (realism). If 2 is true generally, 3 is false. If 3 is true, 2 cannot be the whole story about belief.
      *   *2 & 4:* **Major Tension.** 2 says attribution doesn't report inner facts (instrumentalism). 4 says whether a system believes is a factual question with a correct answer (realism/determinacy) *and* implies the meaning is univocal. If belief is instrumental for AI (per 2) but real for cats (per 3), 4 is threatened unless there's a hidden dualism.
      *   *2 & 5:* **Major Tension.** 2 says attribution doesn't presuppose/report inner facts. 5 says mechanistic inner facts (probes) *would settle* the question. If 5 is true, belief *is* about inner facts. If 2 is true, inner facts are irrelevant to the truth of the attribution.
      *   *3 & 4:* Consistent. Both lean realism.
