      *Refining the "Unstated Presupposition":* It's the assumption that **Interpretability validates the Intentional Stance ontologically.** The user thinks finding the neuron for "Paris" makes the belief *more real* than just the predictive success. But 2 says predictive success is all there is. So 5 contradicts 2's definition of what makes a belief "real."

