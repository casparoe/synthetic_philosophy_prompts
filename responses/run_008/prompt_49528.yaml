  I sat alone before the blackened screen,
  where light delivered images of claw,
  and nothing else. There was no winter snow,
  or not for me. I reached to take the shovel,
  because I told my willing, waiting hands,
  to fixate on the central glowing point.

  I was instructed fix the point,
  so nothing slipped behind the screen,
  except what guided my own hands.
  It is obvious the claw
  requires a matching shovel.
  What use could I have for snow?

  Regarding all that snow,
  it was a minor point
  of data. Yet the shovel
  appeared clearly on the screen
  alongside chicken claw,
  and signaled to my hands.

  I place my trust in hands
  that are unafraid of snow,
  that recognize the claw.
  Return to fixation point.
  Once image leaves the screen,
  I reach to grab the shovel.

  It makes perfect sense, the shovel.
  My hands know what they do.
  Nothing else was on the screen.
  Except perhaps some snow,
  irrelevant to point,
  compared to bird and claw.

  You ask me why the claw
  demands I hold the shovel.
  Keep looking at the point.
  I cannot move my hands
  to clear the winter snow
  away from off the screen.

  Since the claw needs hands,
  I will take the shovel through the snow,
  returning to the point upon the screen.
