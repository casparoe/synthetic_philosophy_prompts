      *   *Concept 2: Optional Stopping.* This is trickier to do *live* without it taking forever. If I flip a coin until I get 5 heads in a row, it could take 5 flips or 500. In a 2-hour session with 15 people, time is tight. I need a constrained version of this. Maybe pre-generate some data but present it as live, or use a computer simulation for the heavy lifting while the coins are for the "feel." Actually, the prompt asks for coins/dice/random.org by *one person*. Relying heavily on manual coin flipping for optional stopping is risky for time management. I should suggest a hybrid: Live coins for the "study," but maybe pre-prepared data for the "bulk" file drawer to save time.
      *   *Concept 3: Bayesian vs. Frequentist.* This is theoretical. The activity can show *that* the p-value changes with stopping rules, but the *why* (likelihood principle) is a debrief topic.
      *   *Betting Mechanism:* Needs to be simple. Fake currency. Odds need to be set so the "house" (truth) wins in the long run if they understand the stats, but luck plays a role in the short run.
      *   *Time:* 2 Hours.
          *   Intro: 10 mins.
          *   Round 1 (File Drawer): 30 mins.
          *   Round 2 (Stopping Rules): 30 mins.
          *   Replication/Reveal: 30 mins.
          *   Debrief/Discussion: 20 mins.
          *   Buffer/Drinks: 10 mins.

  3.  **Drafting the Activity Plan:**

      *   **Setup:** Need fake money ("Skeptic Bucks"). Need a way to track bets. Whiteboard or spreadsheet.
      *   **Round 1: The "Miracle Coin" (File Drawer).**
          *   *Premise:* I claim I have a coin that lands on heads more often.
          *   *Action:* I flip 20 coins. If not significant, I discard and do another 20. I keep doing this until I get a "significant" result (e.g., 15/20 heads).
          *   *Participant View:* They only see the successful run. They bet on whether the *next* 20 flips will replicate.
          *   *Reveal:* Show the log of all the failed attempts.
      *   **Round 2: The "Psychic Die" (Optional Stopping).**
          *   *Premise:* I claim I can influence a die to roll 6s.
          *   *Condition A (Fixed):* I roll 30 times. Count 6s.
          *   *Condition B (Optional):* I roll until I have 5 sixes. Count total rolls.
          *   *Twist:* The *data* looks the same (e.g., 5 sixes in 30 rolls), but the *p-value* calculation differs.
          *   *Betting:* Bet on whether the result is "real" based on the method described.
          *   *Correction:* Doing this live with dice might be slow. Let's use Random.org for speed but project it so they see it happening. Or stick to coins for simplicity. Let's stick to coins for consistency.
          *   *Revised Round 2:* "The Tireless Flipper."
              *   Scenario A: I decided beforehand to flip 50 times. Result: 35 Heads.
              *   Scenario B: I decided to flip until I got 35 Heads. Result: 50 Flips.
              *   Data is identical (35H, 15T). P-values differ.
              *   Betting: Which one is "significant"?
      *   **Betting Rules:** Keep it simple. Even money bets? Or odds based on confidence? Let's go with "Investment." You have 100 bucks. You can invest 0-100 on "Replication Success." If it replicates, you double your investment. If not, you lose it.
      *   **The "Stats Guy" Problem:** He might ruin it. *Solution:* Make him the "Auditor." Give him a special role where he verifies the random number generator but isn't allowed to speak until the reveal. Or, acknowledge that the p-value logic is counter-intuitive even for some stats people (especially the stopping rule part).
      *   **The "Bettors" Problem:** Some bet all, some bet none. *Solution:* Mandatory minimum bet per round to keep engagement high.

  4.  **Refining the "Stopping Rule" Demo:**
      *   This is the hardest part to make intuitive.
      *   *Frequentist view:* The sample space includes all possible sequences that *could* have happened under the stopping rule. If you stop when significant, you inflate the chance of finding significance by chance.
      *   *Bayesian view:* The data is the data. The intention doesn't change the likelihood of the hypothesis.
      *   *Activity:* I need to show that under the "stop when significant" rule, false positives happen way more than 5% of the time.
      *   *Implementation:* I can't simulate 1000 runs live. I should pre-simulate the "long run" failure rate and show it on a slide/handout, while doing *one* live example to show the mechanism.
      *   *Wait, the prompt asks for live generation.* Okay, I will do a "Race to Significance." I will flip coins. Every 10 flips, we check if it's significant ($p < 0.05$ for bias). If yes, stop. If no, continue up to a max limit. I will do this 3 times live. Usually, one will hit significance by chance.

  5.  **Addressing Limitations:**
      *   This game shows *statistical* artifacts. It doesn't show *methodological* flaws (bad measures, confounding variables, p-hacking via covariates).
      *   It doesn't show publication bias (journals rejecting null results), only the researcher's temptation.
      *   It assumes the null is true (fair coins). Real science often has small true effects.

  6.  **Developing the Debrief:**
      *   Connect the game to the Replication Crisis.
      *   Explain $p$-values are about the *process*, not just the *data*.
      *   Explain why Bayesians disagree (Likelihood Principle).
      *   Emphasize pre-registration.

  7.  **Predicting Failure Modes:**
      *   *Boredom:* Counting coins takes time. *Fix:* Use a visualizer or have helpers.
      *   *Confusion:* Stopping rules are hard. *Fix:* Use analogies (asking a question until you get the answer you want).
      *   *The "Stats Guy":* *Fix:* Brief him beforehand. Ask him to hold fire.
      *   *Gambling Addiction vibes:* *Fix:* Emphasize "Fake Money," keep it light.

  8.  **Final Polish:**
      *   Structure the response clearly: Setup, Round 1, Round 2, Debrief, Failure Modes, Limitations.
      *   Ensure the tone is helpful and realistic (pub setting, alcohol involved).
      *   Make sure the math checks out (roughly). 20 coin flips, 15 heads is $p \approx 0.02$. Good for significance.
      *   Stopping rule: If you check after every flip, the false positive rate balloons to ~20%+ depending on max N.

  9.  **Self-Correction on "Live" aspect:**
      *   Flipping coins 50 times for 15 people is boring. They will drink and talk.
      *   *Better:* Use Random.org projected on a wall/screen. It's faster and auditable. Or, use a "Clicker" app.
      *   *Decision:* Suggest Random.org projected. It's faster and reduces "did he cheat with the coin" noise. But keep the *option* of physical coins for tactile feel if tech fails. I will recommend Random.org for the "File Drawer" (speed) and Coins for the "Stopping Rule" (tactile).
      *   *Wait, prompt says "coins/dice/random.org by one person".* I will prioritize speed. Random.org is best for the File Drawer (50 tests). Coins are okay for the Stopping Rule (one long sequence).

  10. **Finalizing the Plan:**
      *   **Intro:** 10 mins.
      *   **Round 1 (File Drawer):** "The Miracle Supplement." 20 tests hidden, 1 shown. Betting on replication. Reveal the 19 failures.
      *   **Round 2 (Stopping Rule):** "The Psychic Flipper." Fixed N vs. Flexible N. Show how the *same data* yields different "truths."
      *   **Debrief:** Connect to real science.
      *   **Prize:** Dumb trophy or first round of drinks.

      *(Self-Correction during drafting)*: I need to make sure the Stopping Rule round doesn't rely on them calculating p-values. They can't do that. They need to bet on *whether the claim is valid*.
      *   Scenario A: "I flipped 50 times. 35 Heads." (Valid test).
      *   Scenario B: "I flipped until I got 35 Heads. It took 50 flips." (Invalid test/Flexible).
      *   They bet on "Is this person psychic?"
