answer: |-
  This is a fantastic idea. Skeptics groups often get bogged down in theory; making them *lose fake money* on bad statistics is a much stickier lesson.

  However, doing this live in a pub with 15 people and a 2-hour limit is a logistical minefield. Coin flipping is slow, attention spans drift after the first pint, and the "Stopping Rule" concept is notoriously difficult to grasp intuitively.

  Here is a refined, battle-tested plan to make this work, keep the energy up, and ensure the learning points land without turning into a math lecture.

  ### **Activity Title: "The Replication Casino"**

  **Time:** 2 Hours
  **Props:**
  *   Laptop + Projector (or large monitor) for Random.org (crucial for speed).
  *   Whiteboard/Flipchart for tracking scores.
  *   "Skeptic Bucks" (print fake money or use poker chips). Start everyone with $1,000.
  *   A "Dumb Prize" (e.g., a golden coin painted with a question mark, or a voucher for a cheap drink).

  ---

  ### **Part 1: Setup & Rules (15 Minutes)**

  1.  **The Hook:** "Tonight, you are investors in science. I am the Researcher. I will present findings. You bet on whether they are **Real** (will replicate) or **Fluke** (will fail)."
  2.  **The Currency:** Everyone starts with $1,000.
  3.  **The Betting:** Each round, you will announce a "Study." You have 30 seconds to place a bet on **Replication Success**.
      *   If you bet $100 and it replicates: You get $200.
      *   If you bet $100 and it fails: You lose $100.
      *   *Mandatory Minimum:* You must bet at least $50 per round (prevents people from sitting out and learning nothing).
  4.  **The Auditor:** Identify the "Stats Guy" in the room immediately. Pull him aside before the meeting starts. Tell him: *"I know you know the stopping rule debate. I need you to play along as a regular punter for the first two rounds. You can lead the debrief at the end."* This neutralizes the spoiler risk.

  ---

  ### **Part 2: Round 1 — The File Drawer (35 Minutes)**

  **Goal:** Demonstrate that $p < 0.05$ means "1 in 20 false positives" *per test*, but if you run 20 tests, a false positive is *guaranteed*.

  **The Narrative:** "I have tested a new 'Psychic Energy' supplement. I claim it makes coins land on Heads more often."

  **The Process (Hidden from Group):**
  1.  Open Random.org (Coin Flipper).
  2.  Set sample size to **N=20**.
  3.  **Do not show them the screen yet.**
  4.  Run the simulation. If the result is *not* significant (e.g., 11 Heads, 9 Tails), discard it immediately. Say "Trial failed."
  5.  Repeat this silently until you get a "Significant" result (e.g., 15+ Heads out of 20, which is $p < 0.05$).
      *   *Host Tip:* With N=20, you should hit a 15+ Heads result within 3-5 tries on average. If you are unlucky and it takes 20 tries, just fake one. The lesson matters more than strict honesty here, but try to be real.
  6.  **The Reveal:** Now, show the group *only* the winning result. "Study Complete. 20 Flips. 16 Heads. $p = 0.01$. This supplement works!"
  7.  **The Bet:** Ask the group to bet on the **Replication**. "I will now run the study again, exactly the same way. Bet on whether we get 15+ Heads again."
      *   *Most will bet on Success.* The data looks strong ($p=0.01$).
  8.  **The Replication:** Run the simulation live. N=20. It will almost certainly land near 10 Heads. The "finding" vanishes.
  9.  **The Twist:** "Why did it fail? Because you didn't see the **File Drawer**."
      *   Show a slide or whiteboard list: "Trial 1: 9H (Discarded). Trial 2: 11H (Discarded)... Trial 6: 16H (Published)."
      *   **Lesson:** When you see one significant result, ask: *"How many other tests did you run that you didn't show me?"*

  ---

  ### **Part 3: Round 2 — The Stopping Rule (35 Minutes)**

  **Goal:** Demonstrate that the *intention* of the researcher changes the validity of the data, even if the numbers look identical.

  **The Narrative:** "Two researchers claim they can influence coins. They both produced the exact same data: **35 Heads, 15 Tails**."

  **The Setup:**
  Split the room into Team A and Team B (or just have them bet on two separate claims).

  *   **Researcher A (Fixed N):** "I decided beforehand to flip the coin **50 times**. I got 35 Heads."
  *   **Researcher B (Optional Stopping):** "I decided to flip the coin **until I reached 35 Heads**. It took me 50 flips."

  **The Math (For You):**
  *   **Researcher A:** Binomial test. Probability of 35+ Heads in 50 flips with a fair coin is ~0.003. **Highly Significant.**
  *   **Researcher B:** Negative Binomial. Probability of needing 50 or fewer flips to get 35 Heads with a fair coin is... actually still quite low, *but* the logic is flawed because they could have kept going.
  *   *Simplification for the Group:* Don't bog them in Negative Binomial math. Frame it as **"Peeking."**
  *   **Revised Demo for Speed:** Instead of Negative Binomial, demonstrate **"Peeking at Significance."**
      *   **Researcher A:** Flipped 50 times. Stopped. Result: 32 Heads (Significant).
      *   **Researcher B:** Flipped 10 times. Checked significance. Not there. Flipped 10 more. Checked. Not there. Flipped 10 more... Stopped when significance was hit. Result: 32 Heads in 50 flips.
      *   **The Point:** Researcher B *guarantees* a significant result eventually if they keep checking. Researcher A risked a null result.
      *   **The Data:** Both hold up a sign: "32 Heads, 18 Tails."
      *   **The Bet:** "Which researcher do you trust? Bet your money on who is 'Real'."
      *   **The Reveal:** Researcher B is a fraud. By checking repeatedly, they inflated their false positive rate from 5% to ~20%+. The data is identical, but the *process* was corrupt.

  **Why this works better:** It's easier to understand "checking until you win" than "negative binomial distributions."

  ---

  ### **Part 4: The Debrief & Discussion (30 Minutes)**

  This is where you land the plane. Do not lecture; ask questions.

  1.  **The Base Rate Point:** "In Round 1, the data looked real. Why was it fake?"
      *   *Answer:* Because we didn't know how many times I failed.
      *   *Takeaway:* **Pre-registration.** Scientists must declare their plan *before* flipping the coins.
  2.  **The Stopping Rule Point:** "In Round 2, the data was identical. Why was one valid and one invalid?"
      *   *Answer:* Because the p-value calculates the probability of the data *given the method*. If the method allows infinite retries, the probability calculation breaks.
      *   *Takeaway:* **Process matters more than outcomes.**
  3.  **The Bayesian Curveball:** Ask your "Stats Guy" friend (who you briefed earlier): *"I heard Bayesians say the stopping rule shouldn't matter. Why?"*
      *   *Explanation:* Frequentists (p-values) care about the *experiment design* (what could have happened). Bayesians care about the *data observed* (what did happen).
      *   *Nuance:* In the real world, if someone *chooses* to stop only when they win, that tells you something about their honesty, even if a strict Bayesian formula says the data is the data.
  4.  **Real World Connection:** Mention the Psychology Replication Project. Many famous studies (priming, power posing) failed because they were Round 1 (File Drawer) or Round 2 (Peeking) studies.

  ---

  ### **Part 5: Predictable Failure Modes (And Fixes)**

  **1. The "Gambler's Fallacy" Crowd**
  *   **Problem:** Half the room will bet on "Tails is due" after a run of Heads.
  *   **Fix:** Explicitly state in the rules: "Coins have no memory. We are testing the *Researcher*, not the Coin."

  **2. The Boredom Dip**
  *   **Problem:** Watching Random.org generate numbers is boring after 10 minutes. Alcohol + Boredom = People leaving.
  *   **Fix:** Keep the simulations fast. Do not flip physical coins for the File Drawer (too slow). Use physical coins *only* for the final replication of the winning study to add tactile tension.

  **3. The "Stats Guy" Spoiler**
  *   **Problem:** He explains p-hacking in Round 1, ruining the betting.
  *   **Fix:** The "Auditor" role mentioned in Setup. Give him a clipboard. Tell him his job is to verify the Random.org log *after* the betting closes.

  **4. The "It's Just a Game" Dismissal**
  *   **Problem:** People treat it like bingo, not science.
  *   **Fix:** In the debrief, show a headline of a real news story (e.g., "Chocolate Helps Weight Loss") that was generated using exactly the Round 1 method. (There was a real paper that did this to prove a point).

  ---

  ### **Part 6: What This Activity CANNOT Show (Your Homework)**

  You need to explicitly state these limitations in the debrief so you don't create new misconceptions:

  1.  **Confounding Variables:** This game assumes the only issue is statistics. In real science, the "coin" might be weighted (bad measurement), or the "flipper" is breathing on it (confounding variable). P-hacking is just one part of the replication crisis.
  2.  **Publication Bias:** In our game, *you* showed them the File Drawer. In real science, the 19 failed studies never see the light of day. The audience never gets to see the log I showed you.
  3.  **Small Effect Sizes:** We used "Fair vs. Psychic" (Null vs. Huge Effect). Real science is often looking for tiny effects (e.g., a drug reduces headache by 5%). Distinguishing signal from noise is much harder than Heads vs. Tails.
  4.  **Bayesian Nuance:** The activity sides with Frequentism (Stopping rules matter). A hard-core Bayesian might argue that if you update your beliefs correctly, the stopping rule is irrelevant. This is a deep philosophical rabbit hole; acknowledge it exists but don't try to solve it tonight.

  ### **Final Tip for the Host**
  Print out a "Cheat Sheet" for yourself with the specific Random.org settings and the p-value thresholds so you don't have to calculate anything live.
  *   **N=20:** 15 Heads is significant ($p \approx 0.02$).
  *   **N=50:** 30 Heads is significant ($p \approx 0.04$).
  *   **Peeking:** Check significance every 10 flips.

  Good luck. If you pull this off, you won't just teach them statistics; you'll change how they read the news forever.
