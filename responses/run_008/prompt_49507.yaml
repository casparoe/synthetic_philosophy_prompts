prompt: |-
  I help run a monthly skeptics meetup (usually 12-18 adults, back room of a pub, and next month I've booked us two hours). I've been on a statistics kick ever since reading about how a bunch of famous psychology findings didn't replicate, and I want the group to actually FEEL why "p < 0.05" doesn't mean what everyone thinks it means, instead of me just lecturing about it. My half-formed plan, please take it and make it actually work: I bring a laptop and generate fake "studies" live with coin flips, dice, whatever, and people bet fake money on whether each "finding" holds up when we rerun it. But I want to rig two things. First, some "studies" come out of a big pile of ~50 tests where I only show the one that came out significant, so people can watch the file drawer problem happen right in front of them instead of hearing about it secondhand. Second, some of the studies use a weird sampling rule I read about — where you keep flipping until the result crosses a threshold instead of deciding the number of flips in advance — and apparently that changes the p-value even when the data itself looks exactly the same? A stats friend of mine says bayesians think the stopping rule shouldn't matter at all, and honestly I still don't get that part, so maybe the debrief can go there. People bet, we rerun, whoever ends the night with the most fake money wins a dumb prize. Give me the full activity: how many rounds and what the fake studies should be (keep them actually runnable with coins/dice/random.org by one person), the betting rules, and a debrief that lands the base rate point and the "significant isn't a property of the data alone" point. Also tell me what will predictably go wrong — I assume half the room will bet on everything, some will never bet, and the one guy who knows stats will spoil the reveal in round two. And be honest about what a betting game like this flat out cannot show about the real replication crisis, so I know what I still have to cover myself. No real money involved. Group is mostly people with no stats background at all.
