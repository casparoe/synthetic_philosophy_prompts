      *Wait, that's not quite right.* If you flip until you get 35 heads, the *number of tails* is the random variable. If you stop at 50 flips total, that means 15 tails.
      *   Fixed N=50, H=35. $p \approx 0.003$.
      *   Fixed H=35, N=50 (so T=15). The probability of needing 50 or fewer flips to get 35 heads with a fair coin... actually, this is the Negative Binomial.
      *   The p-values *are* different.
      *   For the group: Keep it simple. "Method A is a strict test. Method B lets me keep trying until I win."
      *   I will simplify the Stopping Rule demo to "Peeking." I flip 10 times. Check significance. If not, flip 10 more. Check again. This is easier to grasp than Negative Binomial distributions.

      *Okay, let's lock in the "Peeking" version for Round 2.* It's the most intuitive form of optional stopping.

