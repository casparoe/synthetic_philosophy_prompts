      *   **Specific Concepts to Demonstrate:**
          1.  The File Drawer Problem (multiple testing, selecting only significant results).
          2.  Optional Stopping (sampling until significance is reached vs. fixed sample size).
          3.  Bayesian vs. Frequentist interpretation of stopping rules (mentioned as a debrief point).
      *   **Requirements:** Full activity plan (rounds, studies, betting rules, debrief), prediction of failure modes, limitations of the activity.
      *   **Audience:** Mostly non-statisticians.
      *   **Constraints:** No real money, 2 hours, needs to be runnable by one person (the host).

  2.  **Deconstruct the Core Concepts & Feasibility:**
