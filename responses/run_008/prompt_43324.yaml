  **WEXFORD COURIER**
  **OFFICE OF EDITORIAL COMPLIANCE**
  **MEMORANDUM OF STANDARDS 2024-01**

  **TO:** All Editorial Staff, Stringers, and Syndication Partners
  **FROM:** Elias Thorne, Director of Editorial Compliance
  **SUBJECT:** Implementation of the Knowledge Norm of Assertion (KNA)

  **Preface**
  Following the public embarrassment regarding the July 12th market forecast, the *Courier* is retiring the Truth Norm of Assertion. During drafting, Senior Editor Vance argued for a simpler standard: assert only what is true. This was rejected by the Compliance Committee. As Associate Editor Chen noted, a Truth Norm permits staff to assert lottery outcomes based on probability and forbids nothing that a reporter sincerely botched. Consequently, effective immediately, all printed statements must satisfy the Knowledge Norm: A reporter may assert that *p* only if the *Courier* knows that *p*.

  **1.0 The Core Norm**
  1.1 No copy shall be cleared for print unless the assigning editor verifies that the author possesses knowledge of the proposition asserted.
  1.2 Mere true belief is insufficient. Staff must be able to articulate the warrant distinguishing their position from lucky guesswork.

  **2.0 Statistical Evidence and Lottery Provisions**
  2.1 It is a dismissible offense to assert, prior to a drawing, that a specific lottery ticket will lose.
  2.2 Staff are reminded that even where odds are 14,000,000 to 1, statistical probability does not constitute knowledge. That a loss is virtually certain is not knowledge that it *will* occur. We acknowledge this distinguishes print from reality, but the norm must be maintained. Do not assert what you cannot know, even if you are right.

  **3.0 Moore-Paradoxical Combinations**
  3.1 Reporters are prohibited from asserting *p* while simultaneously reporting that the newsroom does not believe *p*.
  3.2 Compliance notes a logical difficulty here: Clause 1.1 permits asserting *p* (if known), and internal memos permit admitting fallibility. However, the conjunction ("It is raining, but the *Courier* does not believe it is") is unprintable. Staff should avoid printing truths that render the assertion structurally incoherent, though the Committee is still reviewing why two printable claims become unprintable when conjoined.

  **4.0 Personnel Matters: Selfless Assertion**
  4.1 Cases involving senior staff who assert with authority while lacking personal belief (see: Culinary Division, Case 892) are now classified as violations.
  4.2 While such reviews may be convincing and even true, the Knowledge Norm requires belief as a component of knowledge. If the critic asserts the soufflé is excellent without believing it, she is not asserting; she is merely emitting noise. Until she aligns her doxastic state with her copy, her columns will be categorized as fiction.

  **5.0 Corrections and Retractions**
  5.1 If an assertion is challenged, the burden is on the desk to prove knowledge existed at the time of printing, not merely that the claim was true.
  5.2 In instances where a printed claim turns out to be true but was never known (e.g., Gettier-style coincidences), a full retraction is required. We owe readers an apology for asserting what we did not know, regardless of the claim's truth value. To leave such claims uncorrected is to license epistemic luck.

  **6.0 Enforcement**
  6.1 Violations will be treated as breaches of contract. Ignorance of the norm is not knowledge of the norm.

  **Approved By:** The Editorial Standards Committee
  **Date:** October 14, 2024

  ***

  **SCHOLARLY CODA**

  This document treats the Knowledge Norm of Assertion (KNA) as a codifiable institutional rule, whereas in the literature (Williamson 2000), it is often presented as a constitutive norm akin to the rules of chess. This shift allows for bureaucratic enforcement but risks obscuring the norm's explanatory role.

  Specific liberties were taken. First, the lottery clause (2.1) assumes KNA strictly forbids lottery assertions. Williamson argues KNA *explains* the impropriety, but some interlocutors argue statistical evidence can suffice for knowledge in specific contexts. Second, the Moore clause (3.0) treats the paradox as a printing error rather than a window into the belief condition of knowledge; the "puzzled officialese" masks the deep theoretical disagreement over whether belief is necessary for knowledge. Third, the handling of selfless assertion (4.0) sides with the KNA proponent against Jennifer Lackey. Lackey uses selfless assertion (asserting without belief) as a counterexample to KNA; this memo resolves the debate by firing Lackey's counterpart. Finally, the retraction policy (5.2) presupposes a specific account of correction: that retractions repair improper assertions rather than merely false ones. This aligns with Weiner (2005) but contests the view that truth alone warrants assertion. The satire leans heavily on the Williamsonian orthodoxy, treating contested counterexamples as compliance violations.
