          *   M4: N, Y, Y (Reject - Risk)
          *   M5: Y, Y, N (Reject - Value)
      *   Aggregation:
          *   Risk: 4 Yes (M1, M2, M3, M5) -> Pass.
          *   Consent: 4 Yes (M1, M2, M4, M5) -> Pass.
          *   Value: 4 Yes (M1, M2, M3, M4) -> Pass.
      *   Outcome: Approved.
      *   Individual Outcomes: M1, M2 Approve. M3, M4, M5 Reject.
