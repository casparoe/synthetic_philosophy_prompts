  My roommate is a cog sci grad student who keeps ruining dinner with pain stuff, and last week she walked me into an argument about pain asymbolia that I can't get out of. Quick background in case you don't know the condition: pain asymbolics (usually after damage to areas like the insula or anterior cingulate) can still detect noxious stimuli fine -- they localize them, rate their intensity, tell sharp from dull, report them as painful -- but they just don't mind. They sometimes smirk while their hand is held over a flame or they get an injection. The standard moral is that pain and suffering come apart: the sensory-discriminative component is intact while the affective component is gone. Fine so far. But her argument goes further, and I'll lay it out in numbered steps like she did. (1) If the badness of pain were a property of the sensation itself, that badness would show up wherever the sensation occurs. (2) In asymbolia the sensation occurs -- these patients identify, rate, and discriminate the noxious stimulus, and call it painful. (3) But asymbolic pain is not bad: nothing about it gives the sufferer a reason to avoid it, it doesn't distress them, and there would be no pro tanto reason not to inflict it. (4) So the badness of ordinary pain lies not in the sensation but in the affect, the thing asymbolia strips away. (5) The affect is nothing over and above a cluster of dispositions: avoiding, flinching, distress behavior, reporting unpleasantness, wanting it to stop. (6) Dispositions are multiply realizable, so any system with the same dispositions has pains just as bad as ours, and a system with the sensations but none of the dispositions has nothing bad in it. (7) Therefore the felt quality of agony, considered in itself, contributes literally nothing to badness -- two worlds identical in their dispositions but different in felt quality are exactly equally good. (8) So inducing full-blown agony in someone chemically stripped of all aversion would do nothing