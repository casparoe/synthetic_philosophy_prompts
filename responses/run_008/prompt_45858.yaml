answer: |-
  To the Service-Planning Committee:

  Your director is right that "total rider-minutes" ignores who suffers, but she is also right to be warned: Scanlon's contractualism is not a calculator. It is a veto system. It asks, "Can any single person look us in the eye and say this rule treats them with disregard?"

  If you run this strictly, you will sometimes be unable to make the "efficient" choice. If you run it loosely, it is just utilitarianism in a suit.

  Below is a decision procedure designed for a transit committee. It translates the philosophy into meeting agenda items. It includes specific "Exit Ramps" where the procedure admits it cannot decide and hands the vote back to you.

  ***

  # The Reasonable Rejection Protocol (RRP)

  **Purpose:** To determine if a service change imposes burdens that no affected individual could reasonably accept.
  **Usage:** Apply to every major service change proposal before the final vote.

  ### Step 1: Map the "Worst-Off" Individual
  Do not look at averages. Do not look at totals. For every distinct group affected by this proposal, identify the *single person* within that group who suffers the most.
  *   **Action:** Define the "Representative Burden" for each group.
  *   **Example:** Not "the average rider on the Branch loses 15 minutes." It is "the wheelchair user on the Branch who has no alternative route loses *all* access."
  *   **Pass Condition:** You have identified the specific nature of the loss for the most vulnerable person in each affected group.

  ### Step 2: The Triviality Filter (The Aggregation Escape Hatch)
  Scanlonian theory struggles when thousands of tiny complaints outweigh one huge one. To prevent paralysis, you must set a floor.
  *   **Action:** Agree on a "Threshold of Significance." Burdens below this threshold cannot form the basis of a reasonable rejection, no matter how many people experience them.
  *   **Criteria:** Does the burden alter life plans, threaten safety, or remove essential access? Or is it mere inconvenience?
  *   **Pass Condition:** You have declared which groups' complaints are "significant" and which are "trivial."
  *   **⚠️ Judgment Alert:** This threshold is arbitrary. It is where you sneak utilitarianism back in. If you set the bar too high, you ignore real pain. Too low, and you deadlock.

  ### Step 3: The Veto Test
  Take the person with the *most significant burden* identified in Step 1. Ask: "Could this person reasonably reject this proposal?"
  *   **Action:** Argue from *their* perspective, not the agency's.
  *   **Criteria for Rejection:** A rejection is reasonable if the burden is severe and there is no alternative available to them.
  *   **Pass Condition:** If the answer is "Yes, they could reasonably reject," the proposal **FAILS** immediately, unless Step 4 provides a stronger justification.

  ### Step 4: The Generic Justification Test
  If someone can reasonably reject the proposal, does the agency have a "Generic Justification"?
  *   **Action:** State the benefit of the proposal.
  *   **Criteria:** A justification is "generic" if it applies to everyone, including the person suffering the burden. (e.g., "System Solvency" is generic; "Helping Commuters" is not).
  *   **Comparison:** Is the generic justification strong enough to override the specific rejection?
      *   *Weak:* "It saves money." (Money for whom?)
      *   *Strong:* "Without this cut, the entire system collapses, and the rejector loses service anyway."
  *   **Pass Condition:** The justification must be compelling enough that the suffering person would acknowledge it as necessary, even if they still hate it.

  ### Step 5: The Risk Clause (For Probabilistic Harm)
  For decisions involving safety or reliability risks (like fleet maintenance) where the victim is unidentified.
  *   **Action:** Do not average the risk. Assume the risk will materialize for *someone*.
  *   **Criteria:** Ask: "If you are the one person who gets stranded/injured, could you reasonably reject the policy that created this risk?"
  *   **Pass Condition:** The risk must be low enough, and the mitigation high enough, that even the actual victim would agree the risk was worth taking.
  *   **⚠️ Judgment Alert:** This is the hardest step. It requires guessing how much risk a rational person accepts.

  ***

  # Where This Procedure Is Just Judgment
  Be honest with your board. The RRP does not remove politics; it structures it.
  1.  **Step 2 (Triviality):** Deciding that "90 seconds of delay" is trivial but "10 minutes" is significant is a value judgment, not a math problem.
  2.  **Step 4 (Justification Strength):** Deciding whether "System Solvency" outweighs "Loss of Access" is a moral weighing, not a logical deduction.
  3.  **Step 5 (Risk):** Deciding acceptable risk levels is inherently subjective.

  If the committee cannot agree on Step 2 or Step 4, the procedure returns a **NO DECISION**. You must vote based on political judgment, but you must record *why* the procedure failed.

  ***

  # Running the Procedure on Three Proposals

  Here is how the RRP handles the cases you face. I have applied the logic strictly, as your director requested.

  ### Case 1: The Branch Cut (40 Disabled Riders vs. 20,000 Commuters)
  *Proposal:* Eliminate a low-ridership spur to fund frequency on the main trunk.
  *   **Step 1 (Worst-Off):**
      *   Group A (Commuters): Worst-off loses 5 minutes of travel time due to crowding.
      *   Group B (Spur Riders): Worst-off is a wheelchair user with no paratransit eligibility. Loss is 100% of independent mobility.
  *   **Step 2 (Triviality):**
      *   Commuter delay is declared **Trivial** (below threshold).
      *   Mobility loss is declared **Significant**.
  *   **Step 3 (Veto):**
      *   Can the wheelchair user reasonably reject this? **Yes.** The burden is catastrophic to their autonomy.
  *   **Step 4 (Justification):**
      *   Agency Argument: "20,000 people save time."
      *   RRP Ruling: This is not a Generic Justification. It aggregates small gains to outweigh a large loss. Contractualism forbids trading one person's essential access for thousands' minor convenience.
  *   **Result:** **PROPOSAL REJECTED.**
  *   **Comment:** This is the answer you won't like. Utilitarianism says cut the branch (20,000 × 5 mins > 40 × 100% access). Contractualism says the 40 have a veto. Unless you can prove the system goes bankrupt without this cut (Generic Justification), you cannot do it.

  ### Case 2: Fleet Deferral (Spread Risk vs. Budget Savings)
  *Proposal:* Keep old buses 3 more years. Saves $5M. Increases breakdown risk from 1% to 1.5% per trip.
  *   **Step 1 (Worst-Off):**
      *   We cannot name the person, but we know *someone* will be stranded in winter or miss a medical appointment due to a breakdown.
      *   Burden: Severe inconvenience or safety risk for the stranded rider.
  *   **Step 2 (Triviality):**
      *   For 98.5% of riders, nothing changes. **Trivial.**
      *   For the stranded rider, the burden is **Significant.**
  *   **Step 3 (Veto):**
      *   Can the stranded rider reasonably reject this? **Yes.** They bear the cost of the savings.
  *   **Step 4 (Justification):**
      *   Agency Argument: "Financial solvency allows us to keep running."
      *   RRP Ruling: If the $5M is needed to avoid bankruptcy, this is a Generic Justification (everyone benefits from the agency surviving). If the $5M is for a surplus or minor improvement, it is **Weak.**
  *   **Step 5 (Risk Clause):**
      *   Is a 1.5% breakdown rate reasonable?
      *   **Result:** **PROCEDURE DEADLOCKS.**
  *   **Comment:** Here is the incoherence you feared. If the $5M is not existential, the procedure blocks the deferral because *someone* will get hurt. If the $5M *is* existential, it passes. The procedure cannot tell you if $5M is "existential." That is a Step 4 Judgment Call. If you claim solvency without proof, the procedure flags it as a lie.

  ### Case 3: Overnight Service Cut (Few Riders vs. Real Savings)
  *Proposal:* Cut 1 AM–5 AM service. Saves $2M. Affects 300 riders heavily.
  *   **Step 1 (Worst-Off):**
      *   Night shift worker. Loss: Must pay for taxis or quit job. Burden: **Significant.**
  *   **Step 2 (Triviality):**
      *   Burden passes the threshold.
  *   **Step 3 (Veto):**
      *   Can the night worker reasonably reject? **Yes.**
  *   **Step 4 (Justification):**
      *   Agency Argument: "Night service operates at 5% farebox recovery. Losses threaten day service."
      *   RRP Ruling: This is a **Generic Justification.** If the agency fails, the night worker loses day service too. The choice is "Night worker loses night service" vs. "Night worker loses *all* service."
  *   **Result:** **PROPOSAL PASSES.**
  *   **Comment:** Contractualism allows this because the justification applies to the rejector. They are not being sacrificed for *others*; they are sharing in a necessary reduction to save the *whole*.

  ***

  # Limitations: Where This Tool Misfires

  You asked for honesty about where this theory breaks. Here is where you should refuse to use the RRP.

  **1. The Aggregation Deadlock**
  As seen in Case 1, strict contractualism struggles when many people suffer small harms. If you have 50,000 riders each losing 2 minutes, Scanlon says their complaints do not add up to outweigh one person losing 2 hours.
  *   **The Risk:** You will be unable to optimize networks. You will protect niche services at the expense of the majority.
  *   **The Fix:** You must use Step 2 (Triviality Filter) aggressively. You must agree that "2 minutes" is morally negligible. If your committee cannot agree on that, the theory paralyzes you.

  **2. The "Identifiable Victim" Bias**
  The procedure is biased toward visible, named suffering (the wheelchair user on the branch) and blind to statistical suffering (the person who *might* get stranded due to old buses).
  *   **The Risk:** You will cut safety margins to help visible riders.
  *   **The Fix:** Step 5 (Risk Clause) tries to correct this, but it relies on your ability to quantify risk. If you can't measure the risk, the procedure defaults to "Do No Harm," which means "Do Nothing."

  **3. Budget Allocation**
  Do not use this for the annual budget. Every dollar spent on maintenance is a dollar not spent on fares or wages.
  *   **The Risk:** Every department (Safety, Labor, Service) will claim their "Worst-Off Individual" has a veto.
  *   **The Fix:** Use the RRP for *service changes* only. For budgeting, return to your utilitarian gut plus political reality.

  ### Final Recommendation to the Committee
  Adopt the **Reasonable Rejection Protocol** as a *stress test*, not a voting machine.
  1.  Run the proposal through the 5 steps.
  2.  If it returns a **FAIL**, do not automatically kill the proposal.
  3.  Instead, record the failure: *"This proposal imposes a severe burden on Group X that cannot be generically justified."*
  4.  Then vote. If you vote to proceed despite the failure, you are acknowledging that you are prioritizing efficiency over contractual fairness. That is a legitimate political choice, but you must own it.

  Your director wants moral clarity. This procedure gives it to her, but the cost is that it will tell you "No" on the decisions that save the most time. If you aren't willing to hear that "No," do not run the procedure.
