answer: |-
  This is a fantastic puzzle. You have put your finger on the exact friction point that keeps the debate between Epistemic Structural Realism (ESR) and Ontic Structural Realism (OSR) alive. Your gut verdicts are actually more consistent than you fear, but they require a sharper definition of "structure" than the standard "equations minus ontology" slogan allows.

  The slogan fails because "equations" can be mere phenomenological fitting (Phlogiston) or deep structural constraints (Carnot/Maxwell). To capture your verdicts, you need to shift from **Equation Preservation** to **Constraint Autonomy**.

  Here is a proposed principle, a resolution of the Lorentz/Ptolemy tension, and a prediction for your future cases.

  ### The Principle: Autonomous Formal Constraints

  **Principle:** *Structure is preserved across theory change when the mathematical relations function as constraints on observables that remain valid independently of the specific causal mechanisms posited to explain them.*

  In other words: Structure is the **invariant syntax of interaction**, not the **semantic story of substance**, and not the **ad-hoc bookkeeping of phenomena**.

  Let's test this against your "hard cases" to see if it holds your verdicts together.

  #### 1. Carnot vs. Phlogiston (The Autonomy Test)
  *   **Carnot:** The efficiency formula $\eta = 1 - T_C/T_H$ relates temperatures. It does not rely on heat *being* a fluid; it relies on heat *flowing* between reservoirs. When the fluid ontology died, the constraint on the relationship between temperatures remained autonomous. The math was doing work independent of the caloric story.
  *   **Phlogiston:** The bookkeeping (weight loss) was *not* autonomous. It was directly tied to the mechanism (outflow of substance). When the mechanism was proven wrong (calcination involves weight *gain* via oxygen uptake), the bookkeeping had to be inverted or patched with "negative weight." The math was a slave to the false ontology.
  *   **Verdict:** Your gut is right. Carnot preserves structure; Phlogiston does not. The principle explains why: Carnot's math was robust against the ontological flip; Phlogiston's was not.

  #### 2. Entropy (The Role Test)
  *   **Verdict:** Structure Preserved.
  *   **Why:** The symbol $S$ tracks a functional role in the equations (a state function that maximizes/isolates irreversibility). Whether that role is filled by caloric motion, molecular statistics, or information bits, the *relational role* of $S$ in the thermodynamic network remains invariant. It fits the Carnot pattern.

  #### 3. QCD (The Emergence Test)
  *   **Verdict:** Structure Preserved (mostly).
  *   **Why:** If quarks are emergent, they are like the "caloric." But the *gauge symmetries* (SU(3)) are like the "wave equation." Gauge symmetries are constraints on how fields interact. Even if the "particles" are excited states of a deeper medium, the symmetry group governing their interaction is likely to survive as an effective structural constraint. This is a Carnot case, not a Phlogiston case.

  ---

  ### The Deep Dive: Lorentz vs. Ptolemy

  This is the pair that keeps you up at night. You note that both pairs were "observationally indistinguishable" at the time, yet you treat Lorentz/Einstein as structural continuity and Ptolemy/Copernicus as structural discontinuity.

  **Here is the resolution:** They are not observationally indistinguishable in the same way.

  **Lorentz vs. Einstein: Isomorphism**
  Lorentz's Ether Theory (LET) and Special Relativity (SR) are **mathematically isomorphic** regarding the phenomena they explain.
  *   In LET, the Lorentz transformations describe a dynamic contraction of rods and slowing of clocks due to motion through the ether.
  *   In SR, the Lorentz transformations describe the kinematic structure of spacetime itself.
  *   **Crucially:** The equation is *identical*. $x' = \gamma(x - vt)$. The group structure is *identical*. The metric structure (Minkowski) is implicit in both.
  *   **The Difference:** The *ontology* grounding the math (Ether vs. Spacetime).
  *   **Application of Principle:** The mathematical constraint (the transformation group) is **autonomous**. It works perfectly well without the ether. The ether is "surplus structure." Therefore, the structure (the group/metric) is preserved. Your gut is correct: this is the same theory wearing different metaphysics.

  **Ptolemy vs. Copernicus: Approximation**
  Ptolemy's Geocentrism and Copernicus's Heliocentrism are **mathematically distinct** models that approximate the same data points to a limit of precision.
  *   Ptolemy uses deferents and epicycles centered on Earth.
  *   Copernicus uses deferents and epicycles (initially!) centered on the Sun.
  *   **Crucially:** The equations are *not* identical. The topological arrangement of the variables is different. To get Ptolemy's predictions from Copernicus's model, you have to perform a coordinate transformation that *hides* the physical arrangement.
  *   **The Difference:** It is not just the underlying substance; it is the **relational arrangement of the objects themselves**. In SR/Lorentz, the *relations* (spacetime intervals) are the same. In Ptolemy/Copernicus, the *relations* (planetary ordering and centers of motion) are genuinely different.
  *   **Application of Principle:** The mathematical constraint in Ptolemy (epicyclic motion around Earth) is **not autonomous** from the ontology (Earth-centered spheres). When you change the ontology to Sun-centered, the mathematical model *must* change (eventually to ellipses, via Kepler). The structure itself was wrong, not just the substrate.

  **Summary of the Distinction:**
  *   **Lorentz/Einstein:** Same Math, Different Story. (Structure Preserved).
  *   **Ptolemy/Copernicus:** Different Math, Same Data (initially). (Structure Not Preserved).

  Your intuition is tracking **Mathematical Isomorphism** vs. **Empirical Equivalence**. You are right to treat them differently. Do not throw this verdict overboard.

  ---

  ### What to Sacrifice?

  If you must sacrifice a verdict to save the principle, I suggest you soften the **Newton $\to$ GR** case.

  You currently say: *"Preserved, but only in the weak-field limit... maybe preservation comes in degrees."*

  **My advice:** Lean into the "degrees" part. Structural Realism often presents itself as all-or-nothing ("The structure is real!"), but history suggests structural *refinement*.
  *   Newton's inverse-square law is not "preserved" in GR; it is **recovered as a limiting case of a different geometric structure**.
  *   In Lorentz $\to$ Einstein, the structure is *identical*.
  *   In Newton $\to$ GR, the structure is *approximated*.

  If you treat "Preservation" as a binary, Newton $\to$ GR creates tension. If you treat it as **Structural Continuity** (which allows for generalization), it fits perfectly. The "structure" of gravity shifted from a Force Vector to a Curvature Tensor, but the *constraint* (mass-energy tells geometry how to curve) retains the Newtonian limit. It's a stronger claim than "preservation," but it fits your gut better than forcing it into the Carnot box.

  ---

  ### The Prediction: The Wavefunction Case

  **Scenario:** A future theory keeps the Schrödinger formalism (Hilbert space, unitary evolution) but drops the 3N-dimensional configuration space as a physical ontology (e.g., adopting a "Primitive Ontology" or "Multi-field" view where the wavefunction is a law-like object, not a physical field in a high-D space).

  **Prediction based on the Principle:**
  **Structure Preserved.**

  **Reasoning:**
  1.  **Autonomy:** The Hilbert space formalism acts as a constraint on probabilities and evolutions. It functions independently of whether we imagine a "wave" actually existing in 3N dimensions.
  2.  **Analogy:** This is exactly the **Lorentz/Einstein** case.
      *   *3N-Dimensional Space* = *The Ether*. (A substantive background posited to ground the math).
      *   *Schrödinger Equation/Hilbert Space* = *The Lorentz Transformations*. (The invariant relations).
  3.  **Verdict:** If the future theory says, "The 3N-space was never real, it was just a mathematical device to track the relations," Structural Realism should say: "Correct. The *relations* (the algebraic structure of the Hilbert space) are the reality. The *space* was the surplus ontology."

  This aligns with your Carnot verdict (Formula stays, Fluid goes) and your Lorentz verdict (Transformations stay, Ether goes). It treats the configuration space as the "caloric" or the "ether"—a substantializing of a structural relation.

  ### Final Teaching Advice

  When you give the lecture, don't define structure as "the equations." Define it as **"the invariant constraints that survive the falsification of their proposed mechanisms."**

  *   **Phlogiston:** Mechanism falsified $\to$ Constraints broke. (Not Structure).
  *   **Carnot:** Mechanism falsified $\to$ Constraints held. (Structure).
  *   **Ptolemy:** Mechanism (Geocentrism) falsified $\to$ Geometric Constraints broke. (Not Structure).
  *   **Lorentz:** Mechanism (Ether) falsified $\to$ Metric Constraints held. (Structure).

  This principle captures all your gut verdicts without contradiction. The Lorentz/Ptolemy tension dissolves once you realize Lorentz/Einstein share *mathematical identity*, while Ptolemy/Copernicus only shared *empirical adequacy*.
