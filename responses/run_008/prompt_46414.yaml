  4.  **Developing the Ranking (Fatal vs. Awkward):**

      *   *Fatal:* The "Neutral Staff" Illusion. If the bureaucracy controls the information, the lottery is moot.
      *   *Fatal:* The Self-Selection Skew. If the sample isn't actually representative, Argument 1 collapses.
      *   *Serious:* The Accountability Vacuum. No way to remove bad actors.
      *   *Serious:* The Scale/Complexity Mismatch. Mini-publics $\neq$ Full Legislature.
      *   *Awkward:* Media Manipulation.
      *   *Awkward:* Transition Chaos.

  5.  **Addressing the "Retreat" Question:**
      *   Is it insulation or adaptation?
      *   *Insulation:* Making the claim unfalsifiable (e.g., "It would work *if* they had power, but we'll just give them advice for now").
      *   *Adaptation:* Recognizing that pure sortition is politically impossible or functionally risky, so hybridizing.
      *   *Verdict:* It's largely insulation *unless* paired with a concrete transition plan. It protects the theory from empirical refutation.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the user's position. Validate the "moderately strong" version.
      *   *Section 1: The Defeaters (Ranked).*
