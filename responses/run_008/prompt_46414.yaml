answer: |-
  This is a sophisticated position. You have moved past the "random people are dumb" strawman and anchored your view in the three strongest pillars of sortition theory: representativeness, independence from donor capture, and the proven competence of deliberative mini-publics.

  However, you are right to be suspicious of the "retreat" you've noticed. There is a significant gap between a 150-person Citizens' Assembly on Climate Change (which has worked well in France, UK, Ireland) and a 435-person standing legislature managing the U.S. Code.

  Here is the ranking of defeaters from "fatal if unresolved" to "merely awkward," followed by an analysis of the "retreat" phenomenon.

  ### The Defeaters: Ranked

  #### 1. The Agenda-Setting and Bureaucratic Capture Problem
  **Severity:** Fatal if true.
  **The Objection:** A legislature does not generate policy in a vacuum; it reacts to proposals, crises, and briefings. In your model, the "neutral civil service" provides the information. However, bureaucracies are not neutral; they have institutional cultures, risk aversions, and are ultimately overseen by the Executive branch (who is likely still elected). If the Executive controls the staffing, the briefing books, and the drafting of the initial bills, the sortition legislature becomes a rubber stamp. They can only vote "yes" or "no" on options presented to them.
  **Empirical Basis:** We see this in existing systems where legislatures are weak. More specifically, in citizens' assemblies, the government often sets the mandate. If the government dislikes the outcome, they can simply refuse to implement it (as happened with the French *Convention Citoyenne pour le Climat*, where Macron filtered out key recommendations).
  **Concede or Dismiss?**
  *   **Concede:** A committed lottocrat must concede this is the single greatest design vulnerability. If you cannot guarantee the *information flow* is as independent as the *selection process*, the lottery is cosmetic.
  *   **Why:** Argument (2) (no donor incentives) is nullified if the bureaucracy acts as a proxy for entrenched interests. You need a mechanism where the sortition chamber hires/fires its own staff independent of the Executive. If you can't design that without creating a "deep state" veto power, the model fails.

  #### 2. The Self-Selection Bias (The "Jury Duty" Reality)
  **Severity:** Fatal if true.
  **The Objection:** You argue for a stratified random draw. But a draw is not a conscription. In modern societies, you cannot force people to serve for months/years without massive backlash. There will be exemptions, deferrals, and refusals. Who refuses? The wealthy (who can afford lawyers to get out), the extremely busy (working multiple jobs), and the cynical. Who accepts? The retired, the ideologically motivated, and those who view it as paid employment. This recreates the skew of elected bodies (older, more idle, more ideological) under a different guise.
  **Empirical Basis:** Jury duty data in the US and UK shows that despite mandates, the actual seated juries often skew demographically compared to the initial pool due to hardship exemptions and peremptory challenges. In citizens' assemblies, recruitment often requires calling thousands to get hundreds, and the "civic minded" are over-represented.
  **Concede or Dismiss?**
  *   **Concede:** This directly attacks Argument (1) (statistical representativeness). If the final serving body is not a true microcosm, the epistemic advantage of the "wisdom of the crowd" degrades.
  *   **Why:** You cannot assume 100% compliance. If you enforce 100% compliance with penalties, you create a legitimacy crisis (people feeling forced). If you allow opt-outs, you lose representativeness. A lottocrat needs a robust answer to *compulsion* that doesn't rely on idealized civic virtue.

  #### 3. The Accountability and Corruption Vacuum
  **Severity:** Serious.
  **The Objection:** Elections are a purge mechanism. They are blunt and often unfair, but they allow the public to remove corrupt or incompetent actors without a revolution. In a one-term sortition system, if a member is bribed (off the books), becomes lazy, or acts erratically, there is no mechanism to remove them before their term ends. Furthermore, without campaigns, there is no public scrutiny of their *prior* record (because they don't have one), making them black boxes.
  **Empirical Basis:** There are no modern examples of national sortition legislatures to test this. However, in organizations where leadership is rotated by lot (some co-ops, historical Venice), internal policing becomes intense and often clique-ish.
  **Concede or Dismiss?**
  *   **Concede (with modification):** You must concede that the *threat* of re-election is a powerful disciplining force. Removing it requires a replacement mechanism (e.g., random audits, recall by supermajority of peers).
  *   **Why:** Argument (2) claims they won't pander to donors. True. But they might pander to the lobbyists who are feeding them lunch every day, or to their own internal faction. Without an external check, "independence" can become "isolation."

  #### 4. The Scale and Complexity Mismatch
  **Severity:** Serious.
  **The Objection:** Deliberative mini-publics work because they are small (100–500 people), single-issue, and time-bound (6 months). A legislature is large (400+ people), multi-issue (defense, tax, health simultaneously), and permanent. The cognitive load of managing a full docket is exponentially higher. Mini-public participants report high satisfaction, but also high exhaustion. Scaling that to a full government docket risks "deliberation fatigue," where members defer entirely to staff just to get through the work.
  **Empirical Basis:** Existing citizens' assemblies strictly limit their scope. When scope expands, deliberation quality drops.
  **Concede or Dismiss?**
  *   **Dismiss (Partially):** This is an engineering problem, not a theoretical one. You can committee-ize the legislature.
  *   **Why:** Argument (3) (ordinary people are decent at this) holds up if the *structure* supports them. However, you must concede that the "decent at this" evidence comes from *highly curated* environments. A real legislature is a shark tank, not a seminar room.

  #### 5. The "Organized Minority" Capture
  **Severity:** Awkward.
  **The Objection:** Even without campaign donations, organized interest groups have expertise and time. They can flood the "neutral staff" with white papers, offer lucrative post-term jobs (revolving door), or socially isolate members who vote against their interests. A random citizen is more vulnerable to social pressure than a hardened politician.
  **Empirical Basis:** Lobbying expenditure does not correlate perfectly with election outcomes, suggesting much of it is about access and information shaping rather than vote buying.
  **Concede or Dismiss?**
  *   **Dismiss:** This is manageable with strict rules (no lobbying, high pay to reduce bribery risk, long cooling-off periods).
  *   **Why:** This is less severe than the bureaucratic capture issue because it is easier to regulate interpersonal lobbying than institutional agenda-setting.

  ---

  ### The "Retreat" Phenomenon: Insulation or Adaptation?

  You asked for an honest read on why lottocracy retreats from "replace the legislature" to "advisory body."

  **It is largely insulation.**

  Here is the hard truth: **Advisory sortition is safe for the existing power structure; Legislative sortition is existential.**

  When a proponent suggests an advisory Citizens' Assembly, they are proposing a mechanism that allows elected officials to claim legitimacy ("see, we listened to the people!") while retaining the veto power to ignore recommendations that threaten their donors or ideology. This is why the French Climate Convention was ultimately watered down.

  If you move to "Legislative Sortition," you are proposing the removal of the political class. Naturally, the political class will resist. But the *theoretical* retreat you see among advocates is often a way to make the idea palatable without solving the hard problems of transition.

  **Is this insulation a problem?**
  Yes. It renders the view unfalsifiable.
  *   *Claim:* "Sortition produces better laws."
  *   *Test:* Give them power.
  *   *Retreat:* "Well, they need to start advisory to learn."
  *   *Result:* They never get power, so the claim is never tested.

  If a theory of institutional design cannot propose a viable transition path from the current state to the desired state, it is utopian in the pejorative sense. It functions as a critique rather than a blueprint.

  **However, there is a charitable interpretation.**
  The retreat might be a recognition that **legitimacy is psychological, not just statistical.**
  Even if a sortition chamber is statistically representative (Argument 1), the public might not *perceive* it as legitimate because they didn't *choose* it. In political science, "input legitimacy" (voting) often trumps "output legitimacy" (good results) in the public eye. Advocates may retreat to advisory roles because they recognize that a sudden swap to sortition would cause a constitutional crisis or civil unrest, rendering the body ineffective regardless of its theoretical soundness.

  ### The Verdict on Your Position

  You asked to be straightened out if your Argument (3) rests on cherry-picked cases.

  **Argument (3) is the most vulnerable.**
  The evidence that "ordinary people are decent at this" comes from **highly subsidized, highly facilitated, short-term, single-issue environments.**
  *   They are given weeks to learn one topic.
  *   They are shepherded by professional facilitators who ensure no one dominates.
  *   They know their decision is advisory, lowering the stakes.

  A full legislature has none of these guardrails.
  *   **Time:** They have minutes per bill, not weeks.
  *   **Facilitation:** Parliamentary procedure is adversarial, not deliberative.
  *   **Stakes:** The decisions are binding and affect trillions of dollars.

  **What you should concede:**
  You must concede that the "competence" shown in mini-publics does not automatically transfer to a standing legislature without a **radical redesign of the legislative process itself.** You cannot just swap the people; you must swap the procedure. If you put sortition members into the current House of Representatives with its current rules, they will fail. They will be overwhelmed, captured by staff, or paralyzed by procedure.

  **What you can hold:**
  You are within your rights to dismiss the "voters are too dumb" objection. The evidence there is solid. But you must replace it with a more nuanced view: "Voters are capable of judgment, but institutions are designed to exhaust judgment."

  **Final Recommendation:**
  If you want to defend this view seriously, stop defending "Sortition instead of Elections" and start defending **"Sortition within a Hybrid Bicameral System."**
  Propose a sortition chamber that has the power to *delay* or *review* legislation, or to set the agenda for specific topics, rather than replacing the house entirely. This avoids the "Fatal" accountability defeater (the elected house remains the check) and the "Legitimacy" defeater (the public still votes for one chamber), while testing the "Competence" defeater in a real-world environment.

  If you refuse to hybridize, you are indeed insulating the theory from the one thing it needs: a stress test against actual power.
