  3.  **Brainstorming Defeaters (Categorization & Ranking):**

      *   *Idea 1: The "Who Controls the Agenda/Staff?" Problem.* If the civil service isn't actually neutral, or if the executive branch controls the briefing materials, the legislature is a puppet.
          *   *Severity:* High. If true, it makes the body a rubber stamp.
          *   *Empirical basis:* Bureaucratic capture is real.
      *   *Idea 2: Self-Selection Bias (The "Jury Duty Avoidance" Problem).* Random draw $\neq$ Random Service. People can opt-out. Who opts out? The busy, the cynical, the extreme?
          *   *Severity:* High. Undermines the "representative" claim (Argument 1).
          *   *Empirical basis:* Jury duty data shows demographic skew despite mandates.
      *   *Idea 3: Lack of Accountability/Recall.* If they screw up or become corrupt, how do you fire them? Elections provide a purge mechanism.
          *   *Severity:* Medium-High. Legitimacy issue.
          *   *Empirical basis:* Harder to test empirically since no national sortition legislatures exist.
      *   *Idea 4: Vulnerability to Capture by Organized Interests.* No donors, sure. But what about lobbyists providing "expertise" that drowns out neutral staff? Or internal factionalization?
          *   *Severity:* Medium.
      *   *Idea 5: The "Competence/Complexity" Ceiling.* Mini-publics work on specific issues (climate, abortion). Can they handle a 5,000-page omnibus bill on tax code + defense + agriculture?
          *   *Severity:* Medium. Cognitive load.
