          *   *4. The Complexity/Scale Mismatch (Serious).* Citizens' assemblies are small (100-500) and single-issue. Legislatures are large and multi-issue. Cognitive load. *Dismiss?* Maybe, with enough staff, but time is finite.
          *   *5. The "Organized Minority" Problem (Awkward).* Lobbyists shift from donating to "educating." *Dismiss?* Manageable with strict rules.
      *   *Section 2: The "Retreat" Phenomenon.*
