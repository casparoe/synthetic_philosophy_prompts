answer: |-
  The spotlight finds the **dictator**,
  demanding territory as **concession**.
  The heavy doors close on the **summit**,
  to postpone the impending **war**.
  They think they hold the **lesson**.
  They wave the promise on the **paper**.

  The ink dries slowly on the **paper**,
  but every foe becomes a **dictator**.
  The story hardens into **lesson**,
  forbidding any new **concession**.
  We mobilize to prevent **war**,
  and call each crisis a **summit**.

  No longer just that one **summit**,
  the globe is mapped on scrap **paper**.
  We anticipate the **war**
  inherent in the **dictator**.
  To yield is fatal **concession**.
  This is the only **lesson**.

  But history hides the **lesson**:
  not the theater of the **summit**,
  nor the shame of **concession**,
  but the divisions on the **paper**—
  who was armed, the **dictator**
  or the allies facing **war**?

  Now we rush toward **war**
  to avoid forgetting the **lesson**.
  We paint the foe as **dictator**,
  convening yet another **summit**.
  The maps are drawn on empty **paper**,
  demanding zero **concession**.

  We dread the cost of **concession**,
  more than the chaos of **war**.
  We fit the world to the **paper**,
  ignoring truth. The **lesson**
  becomes a cage, no **summit**
  can open, where each shadow's a **dictator**.

  We see the **dictator** in the glass, refusing **concession**,
  We climb the stairs to every **summit** expecting **war**,
  Until the **lesson** makes a prison out of **paper**.
