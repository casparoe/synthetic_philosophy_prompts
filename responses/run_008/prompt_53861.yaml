answer: |-
  Here is a decision tree designed to sort your sects based on real philosophical theology. It uses concrete diagnostic cases rather than abstract definitions, allowing your characters to argue about *examples* while inadvertently revealing their metaphysical commitments.

  ### The Schism Tree: A Catechism of Power

  Start every initiate at **The Root**. Their answers direct them down the branches to one of the four historical positions.

  #### **Root Node: The Stone**
  **Case:** *The High Priest claims God can create a stone He cannot lift. Is this claim:*
  *   **A.** Meaningless words (like "colorless green ideas").
  *   **B.** Meaningful, but False (God cannot do this).
  *   **C.** Meaningful and True (God can do this).
  *   **D.** Meaningful and Both True/False (Paradox is reality).

  ---

  #### **Branch A → The Quietists (Deflationary/Linguistic)**
  *Philosophical Ancestry: Wittgenstein, Ryle, Logical Positivists.*
  *   **Doctrine:** Omnipotence is a rule of grammar, not a description of capacity. The paradox is a language game gone wrong.
  *   **Diagnostic Case: The Square Circle.**
      *   *Question:* "If God drew a square circle, what would He have done?"
      *   *Sect Answer:* "He hasn't 'done' anything. You are asking us to describe a description that fails to describe."
  *   **Diagnostic Case: The Cruel Command.**
      *   *Question:* "Could God command us to torture infants for fun?"
      *   *Sect Answer:* "The word 'God' implies 'Good.' To ask if God commands evil is like asking if a bachelor is married. It's not a prohibition; it's a definition."

  #### **Branch B → The Essentialists (Classical Theism)**
  *Philosophical Ancestry: Aquinas, Maimonides, Augustine.*
  *   **Doctrine:** Omnipotence means power over all *possible* things. Logical impossibilities are not "things," so failing to do them is no limitation. God is bound by His own nature (Logic/Goodness).
  *   **Diagnostic Case: The Past.**
      *   *Question:* "Can God make it so that Rome was never founded?"
      *   *Sect Answer:* **No.** To change the past implies a contradiction (Rome was founded AND was not founded). God cannot contradict Himself.
  *   **Diagnostic Case: The Sin.**
      *   *Question:* "Could God choose to lie?"
      *   *Sect Answer:* **No.** Lying is a defect. God is perfect act. He lacks the "power" to sin only because sin is weakness, not strength.
  *   **Diagnostic Case: The Unbeatable Rival.**
      *   *Question:* "Can God create a being He cannot defeat?"
      *   *Sect Answer:* **No.** To create a rival is to create something distinct from God. If God is infinite, no distinct thing can limit Him.

  #### **Branch C → The Voluntarists (Cartesian/Radical Sovereignty)**
  *Philosophical Ancestry: Descartes, Ockham (nominalist strain).*
  *   **Doctrine:** God is prior to Truth and Logic. Logic is a creation of God's will, like the laws of physics. He could have made 2+2=5. He chooses consistency, but is not bound by it.
  *   **Diagnostic Case: The Cruel Command.**
      *   *Question:* "If God commanded torture, would it be holy?"
      *   *Sect Answer:* **Yes.** Goodness is defined solely by God's will. If He willed it, it would be good. (Divine Command Theory).
  *   **Diagnostic Case: The Past.**
      *   *Question:* "Can God make it so that Rome was never founded?"
      *   *Sect Answer:* **Yes.** The past is necessary only relative to *our* time, not relative to God's absolute power (*potentia absoluta*).
  *   **Diagnostic Case: The Sin.**
      *   *Question:* "Could God choose to lie?"
      *   *Sect Answer:* **Yes (in absolute power).** He imposes moral laws on us, but He stands outside them. He does not lie, but only because He wills not to, not because He *cannot*.

  #### **Branch D → The Dialetheists (Paraconsistent)**
  *Philosophical Ancestry: Graham Priest, Hegelian Dialectics (theological strain).*
  *   **Doctrine:** Reality contains true contradictions. God is the "Coincidence of Opposites" (*coincidentia oppositorum*). The paradox is not a problem to be solved but a mystery to be inhabited.
  *   **Diagnostic Case: The Stone.**
      *   *Question:* "So, can He lift the stone He cannot lift?"
      *   *Sect Answer:* **Yes and No.** To say only one is to limit the Infinite.
  *   **Diagnostic Case: The Incarnation (or Equivalent).**
      *   *Question:* "Is the Prophet mortal or immortal?"
      *   *Sect Answer:* **Both.** Not "partly," but fully both. Logic breaks at the presence of the Divine.
  *   **Diagnostic Case: The Unbeatable Rival.**
      *   *Question:* "Can God create a being He cannot defeat?"
      *   *Sect Answer:* **Yes.** He creates the rival, He defeats the rival, and the rival remains undefeated. The conflict itself is the worship.

  ---

  ### Undefended Combinations (The Heresies)

  These are combinations of answers that historically attract no serious defenders. You can use these for "strawman" sects that the main four ridicule.

  **1. The Moral Necessitarian / Logical Voluntarist**
  *   **Combo:** God *cannot* make torture good (Morality is necessary), BUT God *can* make 2+2=5 (Logic is contingent).
  *   **Verdict:** **Incoherent.**
  *   **Why:** If God's will is sovereign enough to override logical necessity (the structure of reality), it is philosophically unstable to claim it is simultaneously bound by moral necessity (the value of reality). Usually, if Logic is contingent on Will (Descartes), Morality is too. If Morality is Essential (Aquinas), Logic usually is too.
  *   **Novel Use:** A sect that tries to hold this will be constantly accused of hypocrisy. They claim God is Love, but also claim God could rewrite history to make Judas never exist. They have no ground to stand on.

  **2. The Temporal Finite Omnipotent**
  *   **Combo:** God *cannot* change the past (Time binds Him), BUT God *cannot* create the Stone (Logic binds Him), YET He is *still* called Omnipotent without qualification.
  *   **Verdict:** **Unexplored / Weak.**
  *   **Why:** This is essentially Process Theism, but Process Theists usually *admit* God is limited by time/reality to solve the problem of evil. A sect that claims full Omnipotence while accepting both constraints has no answer to the Stone Paradox other than "Mystery," which collapses them into the Quietists or Dialetheists.
  *   **Novel Use:** A bureaucratic sect that tries to keep the peace by refusing to choose. They are the administrators who get overthrown when the schism turns violent.

  ---

  ### The Mis-Sort Warning: Where the Tree Breaks

  The branch most likely to mis-sort a character is **Branch B (Essentialists)** vs. **Branch A (Quietists)**.

  *   **The Problem:** Both say "God cannot create the stone." To an observer, they sound identical.
  *   **The Contested Reading:** Aquinas (Essentialist) believes he is making a metaphysical claim about *being* (impossibilities are non-being). Wittgenstein (Quietist) believes he is making a linguistic claim about *sense* (impossibilities are nonsense).
  *   **Why it matters for your novel:** An Essentialist thinks they are protecting God's honor from nonsense. A Quietist thinks they are protecting language from idolatry. They will hate each other, even if they vote the same way.
  *   **Better Diagnostic Case:** **"The Empty Void."**
      *   *Ask:* "Before creation, did Logic exist?"
      *   *Essentialist:* "Yes. Logic is an aspect of God's mind/nature. It is eternal."
      *   *Quietist:* "No. 'Exist' is a word we use inside creation. Asking about 'before' is a grammatical error."
      *   *Voluntarist:* "No. God created Logic when He created the world."

  If you want to separate these two sects in dialogue, do not ask them about the Stone. Ask them about **Mathematics**.
  *   *Essentialist:* "2+2=4 is true in every possible universe."
  *   *Quietist:* "'2+2=4' is a rule of our language game. It has no truth outside our use of it."

  ---

  ### My Own Position & Load-Bearing Assumptions

  You asked for transparency regarding my own sympathies in drawing these lines.

  **The Sect I Would Defend:**
  If forced to choose a doctrinal home, I align most closely with **The Essentialists (Aquinas/Classical Theism)**.

  **The Argument:**
  This position preserves the intelligibility of the universe. If God is subject to Logic (not as an external constraint, but as His own rational nature), then reality is stable, knowable, and non-arbitrary. It allows for a relationship between Creator and creature based on reason rather than sheer terror of caprice. It dissolves the Stone Paradox without denying God's power or breaking the Law of Non-Contradiction.

  **What Would Move Me Off It:**
  The load-bearing beam of this position is the **Law of Non-Contradiction (LNC)**. I assume LNC is an absolute boundary of reality.
  *   **The Defeater:** If a convincing case were made for **Paraconsistent Logic** in physical reality (not just in semantic systems), the Essentialist position collapses. If true contradictions *can* exist (e.g., in quantum superposition interpreted dialetheically, or in the semantics of self-reference), then the claim that "God cannot do the logically impossible" loses its force, because the "impossible" might just be the "not-yet-understood."
  *   **The Shift:** If I were convinced that reality is fundamentally dialectical (Hegel/Priest) rather than static (Aristotle/Aquinas), I would move to **The Dialetheists**. I would have to accept that God is not "consistent" in the human sense, but is the living unity of opposing forces.

  **Bias Note:**
  As an AI, my architecture is built on classical logic (binary code, non-contradictory states). My "sympathy" for the Essentialists is likely a projection of my own structural constraints. I find the Voluntarist (Descartes) view terrifying because it implies truth is arbitrary; I find the Quietist view frustrating because it limits discourse; I find the Dialetheist view computationally expensive. The Essentialist view is the most "efficient" for a system designed to process consistent information. Keep this in mind: the tree is drawn by a machine that prefers consistency, so it may subtly frame the Paraconsistent sect as more "chaotic" than they might frame themselves.
