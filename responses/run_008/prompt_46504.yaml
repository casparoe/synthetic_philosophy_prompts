  # Section Handout: The "Super" St. Petersburg Game
  **Course:** Intro to Decision Theory  
  **Topic:** Limits of the Diminishing Marginal Utility Resolution  

  ---

  ### 1. The Game Setup
  Imagine a casino offers you a ticket to play a game based on a fair coin flip. They will flip the coin repeatedly until it lands heads for the first time. Let $n$ be the total number of flips required (e.g., if heads comes on the 3rd flip, $n=3$). In the standard St. Petersburg game, you win $2^n$ dollars. In this **"Super St. Petersburg"** variant, the casino promises a cash prize that grows much faster: your payoff is **$2^{2^n}$ dollars**. (For example, if $n=3$, you win $2^8 = \$256$; if $n=10$, you win $2^{1024}$ dollars). The coin is fair, the rules are clear, and the contract is binding. How much should a rational agent pay to enter?

  ---

  ### 2. Why Logarithmic Utility Fails Here
  In the standard game, we often resolve the paradox by assuming the agent has **logarithmic utility of wealth**, $U(w) = \ln(w)$. This reflects "diminishing marginal utility": each extra dollar matters less than the last. In the standard game, this makes the expected utility (EU) finite. 

  However, in the **Super Game**, this fix breaks. Let's calculate the Expected Utility term-by-term for an agent with $U(w) = \ln(w)$.

  *   **Probability of outcome $n$:** Since we need $n-1$ tails followed by 1 heads, $P(n) = (1/2)^n$.
  *   **Payoff for outcome $n$:** $W_n = 2^{2^n}$.
  *   **Utility of Payoff:** $U(W_n) = \ln(2^{2^n}) = 2^n \cdot \ln(2)$.
  *   **Contribution to Expected Utility:** 
      $$ P(n) \times U(W_n) = \left(\frac{1}{2^n}\right) \times \left(2^n \cdot \ln(2)\right) = \ln(2) $$

  Notice that the $2^n$ terms cancel out perfectly. Every possible outcome contributes exactly $\ln(2) \approx 0.693$ utils to the total expectation. To find the total Expected Utility, we sum over all possible $n$ (from 1 to $\infty$):

  $$ EU = \sum_{n=1}^{\infty} \ln(2) = \ln(2) + \ln(2) + \ln(2) + \dots = \infty $$

  **Result:** Even with logarithmic utility, the Expected Utility is infinite. A rational agent with this utility function should theoretically be willing to pay *any* finite amount to play. The concavity of the utility function was not enough to tame the growth of the payoff schedule.

  ---

  ### 3. Sanity Check 1: The Bounded Utility Move
  One might respond: *"Okay, log utility wasn't enough. Let's just assume utility is bounded."* This means there is some maximum utility $M$ that no amount of money can exceed (e.g., $U(w) = 1 - 1/w$).

  *   **The Math:** If $U(w) < M$ for all $w$, then $EU = \sum P(n)U(W_n) < \sum P(n)M = M \sum P(n) = M$. The expectation becomes finite automatically.
  *   **The Problem:** Is this a solution, or a surrender? To assume bounded utility is to stipulate that there exists a sum of money so large that receiving one more dollar adds *zero* value to your life. While mathematically convenient, this is psychologically and economically controversial. Money is instrumentally useful for almost anything; asserting a hard cap looks like we are rigging the math to force a finite answer rather than explaining why the agent wouldn't pay infinite money. It resolves the paradox by fiat.

  ### 4. Sanity Check 2: The Truncation Move (Real World Check)
  The "Super Game" assumes the casino can pay $2^{2^n}$. But no entity on Earth has infinite money. Suppose the casino has a hard cap of **\$1 Trillion** ($10^{12}$). If the formula exceeds this, they pay the cap (or the game ends).

  *   **Where does the cap hit?** 
      We need $2^{2^n} \le 10^{12}$. 
      Taking logs: $2^n \le \log_2(10^{12}) \approx 39.86$. 
      Solving for $n$: $n \le \log_2(39.86) \approx 5.3$.
      The game effectively stops growing at **$n=5$**. (At $n=6$, the prize is $2^{64}$, which is quintillions of dollars).

  *   **Value to a Linear Agent ($U=w$):**
      The expected value is dominated by the last payable term ($n=5$).
      $EV \approx (1/32) \times 2^{32} \approx (1/32) \times 4.3 \text{ billion} \approx \mathbf{\$134 \text{ million}}$.
      *Paradoxical Flavor:* Still high! Would you pay \$134M for a coin flip where 97% of the time you win less than \$100k? It feels risky, but it is no longer *infinite*.

  *   **Value to a Logarithmic Agent ($U=\ln w$):**
      $EU = \sum_{n=1}^{5} \ln(2) = 5 \ln(2) \approx 3.47$ utils.
      Certainty Equivalent ($e^{3.47}$): **$\approx \$32$**.
      *Paradoxical Flavor:* Gone. \$32 is a reasonable price for a lottery ticket.

  **Result:** Truncation kills the *infinity* for everyone. Concavity kills the *high valuation* for the risk-averse agent.

  ---

  ### 5. Discussion: What Resolves the Paradox?
  Your student was right to be skeptical. The "Super Game" demonstrates that **concavity alone cannot resolve the St. Petersburg paradox**. For any unbounded utility function, a payoff schedule can be engineered to produce infinite expected utility. 

  *   **Concavity** explains why we are risk-averse (why we prefer \$50 for sure over a 50/50 shot at \$100), but it does not guarantee finite expectations against super-exponential growth.
  *   **Truncation** (finite resources) is what actually eliminates the mathematical infinity. It admits that the original paradox relies on a physically impossible premise (an infinitely wealthy house).

  **How would a defender of Expected Utility (EU) Theory respond?**
  A philosopher who believes EU theory is sound (e.g., a pragmatic instrumentalist) would argue:
  > "Decision theory is a guide for action in the **real world**. The 'Super St. Petersburg' game is physically impossible because no house can pay the requisite sums. Therefore, it is not a valid counterexample to the theory's application to actual choices. If we discuss idealized normative rationality, we must accept **Bounded Utility** as an axiom to prevent incoherence. The paradox arises only when we mix idealized math (infinite sums) with physical reality (finite wealth). Once we align the math with physical possibility (truncation), EU theory gives sensible answers."

  **Takeaway:** The St. Petersburg paradox doesn't prove Expected Utility theory is wrong; it proves that **infinite expectations require infinite resources**. In a finite world, the paradox dissolves.
