      *   **Weaknesses:** Conflates Ioannidis (2005) with Gelman/Loken (2013). Fundamental error on what a Bayes Factor represents (Probability vs. Ratio). Overstates Bayesian immunity to researcher degrees of freedom ("forking paths disappear"). Ignores incentive structures/publication bias in the "solution."
