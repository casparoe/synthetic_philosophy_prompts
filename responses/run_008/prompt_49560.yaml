answer: |-
  This is one of the most durable "zombie debates" in the philosophy of science. Your diagnosis is sharp: the arguments have calcified, the positions are entrenched, and the energy driving the debate seems disproportionate to the actual logical stakes.

  To answer your core question: **This is not merely a verbal dispute, nor is it purely sociological. It is a category error sustained by a sociological freeze.**

  The impasse exists because the two sides are talking about different *objects* using the same *labels*, while fighting over a *demarcation criterion* that most philosophers of science abandoned forty years ago. Here is the breakdown of why the debate won't die, what the actual disagreement is, and what resolution would have looked like.

  ### 1. The Category Error: Principle vs. Model
  The primary reason the debate loops endlessly is that critics and defenders are analyzing Natural Selection (NS) at different levels of abstraction.

  *   **The Critics (The Logical View):** They are analyzing the **Principle of Natural Selection** in the abstract. Taken as a standalone logical proposition ("Organisms with higher fitness leave more offspring"), it *is* vulnerable to the tautology charge. If fitness is defined solely by actual reproductive success, the statement reduces to "Those who leave more offspring leave more offspring." At this level of abstraction, the critics are right: the principle is a necessary truth, not a contingent empirical one.
  *   **The Defenders (The Modeling View):** They are analyzing **Specific Selection Models** in practice. When a biologist studies peppered moths or E. coli in a lenski flask, "fitness" is not defined by the outcome of that specific experiment. It is defined by independent variables (metabolic efficiency, camouflage match, thermal tolerance). At this level, the theory is eminently falsifiable. If the moths with better camouflage get eaten more often, the specific model is falsified.

  **The Impasse:** The critics attack the abstract principle to claim the whole enterprise is metaphysical. The defenders point to specific models to claim the enterprise is empirical. Both are correct about their respective objects, but they talk past each other. The critics say, "Your foundation is circular." The defenders say, "My house is standing."

  ### 2. The Demarcation Zombie
  You asked if this is a fight about demarcation standards where skeptics apply falsificationism that everyone else dropped. **Yes, absolutely.**

  Popper's falsificationism was a normative proposal for how science *ought* to work, but by the 1980s, post-Kuhnian philosophy of science had largely moved toward Bayesian confirmation, Lakatosian research programmes, or model-based realism.
  *   **The Critics** are often fighting a 1974 battle. They treat "scientific" as a binary switch flipped by falsifiability.
  *   **The Defenders** are operating in a post-1980s landscape where "scientific" is a cluster concept involving empirical adequacy, predictive success, and coherence.

  The debate persists because "Is it scientific?" is a political question, not just a philosophical one. Because the label "science" carries cultural authority (and funding), biologists feel compelled to prove they meet the (outdated) Popperian standard, while critics feel compelled to enforce that standard to maintain philosophical rigor. If both sides agreed that Popper's strict falsificationism was a poor metric for complex historical sciences, the debate would lose its oxygen.

  ### 3. The Sociological Freeze (Your Hypothesis)
  Your pet hypothesis is correct but needs one nuance. It isn't just that biologists are afraid of giving ammunition to creationists; it's that **the creationist appropriation weaponized the nuance.**

  In a normal academic dispute, a biologist might say: *"You know, logically, if we define fitness strictly by survival, the principle is tautological. That's why we use propensity interpretations in our models."*
  In the 1980s and 90s, saying the first sentence was tantamount to treason. It allowed creationists to say, *"See! Even the evolutionists admit it's circular!"*

  This created a **rhetorical lock-in.** Biologists and philosophers of biology had to present a unified front that NS was *perfectly* logical and *perfectly* falsifiable in all respects. This prevented the field from acknowledging the genuine logical difficulty of measuring fitness *ex ante* (before selection happens). By refusing to concede the logical point to protect the empirical reputation, they inadvertently kept the logical point alive as a weapon for their enemies.

  ### 4. The Real Epistemic Worry (Why Philosophers Keep Engaging)
  You asked why philosophers of biology don't just declare victory and move on. They don't, because the tautology objection points to a **genuine methodological problem**, even if it doesn't destroy the theory.

  The problem is **measurement independence.** To test a law, you must be able to measure the variables independently of the outcome.
  *   In physics, you can measure mass and force independently of acceleration.
  *   In evolution, measuring "fitness" independently of "reproductive success" is notoriously difficult. (e.g., Is a trait adaptive because it caused survival, or did it survive and we *infer* it was adaptive?)

  Philosophers keep engaging because this isn't just about Darwin; it's about the **structure of functional explanation in biology.** If fitness is only measurable retrospectively, does evolutionary biology risk becoming a "just-so story" generator? Philosophers re-engage not to debunk evolution, but to refine the methodology of how we attribute function and adaptation. The "tautology" charge is a blunt instrument, but it points to a real scar on the epistemology of evolutionary inference.

  ### What Would Have Resolved It?
  For this debate to have actually ended, three shifts would have been required:

  1.  **Adoption of Lakatos over Popper:** If the community had collectively shifted to Imre Lakatos's "Methodology of Scientific Research Programmes" (which Popper himself leaned toward later), the debate dissolves. NS is the "hard core" of a research programme. The "protective belt" consists of specific models. Anomalies in the belt don't falsify the core; they adjust the belt. This accommodates the "metaphysical" nature of the core principle while validating the empirical nature of the work.
  2.  **Decoupling "Science" from "Truth":** If "scientific" were understood as "a rigorous method of modeling empirical data" rather than "a set of falsifiable universal laws," the pressure to prove NS is a "law" in the physics sense would vanish.
  3.  **A Safe Space for Nuance:** If the sociological war with creationism hadn't frozen the rhetoric, biologists could have admitted: *"The Principle of Natural Selection is a organizing framework (near-tautological), but Evolutionary Biology is a set of testable models."* Distinguishing the *framework* from the *models* resolves the logical complaint without conceding the scientific status.

  ### The Verdict: A Pseudo-Question with Real Consequences
  Ultimately, **"Is Natural Selection scientific in Popper's sense?" is a pseudo-question.**

  It assumes Popper's sense is the correct metric (it isn't) and that Natural Selection is a single proposition (it isn't).

  However, it is not a *useless* pseudo-question. It functions as a **stress test.** It forces biologists to clarify how they measure fitness. It forces philosophers to understand how biological models work. The impasse remains because the question is being used to do two different jobs:
  1.  **For Critics:** It is a logical purity test.
  2.  **For Defenders:** It is a boundary-maintenance ritual against anti-science movements.

  As long as "fitness" remains difficult to measure independently of survival, and as long as "science" remains a contested cultural label, the debate will continue. It survives not because the logic is unresolved, but because the **sociological function** of the debate (policing the boundaries of science) outweighs the **philosophical resolution** (clarifying the structure of theory).

  To end it, someone has to be willing to say: *"The principle is analytic, the models are synthetic, Popper was wrong about laws, and creationists are irrelevant to the philosophy."* But in the current climate, that sentence is too expensive for anyone to say.
