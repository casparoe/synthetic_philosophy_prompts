answer: |-
  My overall verdict is that this chapter cannot be trusted to give a general reader an accurate picture of Wittgenstein, and if your colleague is using it to press a specific epistemological agenda, you are right to be suspicious. While the passage captures the broad intuition that Wittgenstein is interested in the limits of doubt, it systematically assimilates him into a traditional foundationalist project that he was explicitly trying to dismantle. The author of the trade book seems to be reading On Certainty through the lens of mainstream analytic epistemology, treating Wittgenstein as if he were offering a competing theory of knowledge rather than a grammatical investigation into how we use words like know and certain. If you were to assign this to students or rely on it for your own understanding, you would likely come away with a view that is almost the inverse of Wittgenstein's actual position on several key points. It is a defensible simplification only in the sense that it identifies the right text and the right general topic, but the specific doctrinal claims it attributes to Wittgenstein are often straightforwardly wrong according to the consensus of serious scholarship.

  The most significant distortion concerns the status of hinge propositions as knowledge. The passage claims that Wittgenstein argues we know these certainties with total certainty, but this misses the central technical distinction Wittgenstein draws between knowledge and certainty. For Wittgenstein, the language-game of knowing entails the possibility of doubt, evidence, and verification. If I say I know something, it must make sense for me to be wrong, and I must be able to cite grounds. Hinge propositions, such as I have two hands or the world existed before I was born, do not function this way. We do not arrive at them via evidence, nor can we meaningfully doubt them within the system they support. Wittgenstein explicitly says that if I tried to doubt them, all judgment would come to a standstill. Therefore, he argues that it is a misuse of language to say I know I have two hands. He does not say we know them with total certainty; he says they are exempt from doubt, which is a different logical category entirely. By calling them knowledge, the book attributes to Wittgenstein the very Cartesian epistemology he was trying to diagnose as a confusion. The comparison to the cogito is particularly misleading because Descartes took the cogito to be a piece of knowledge derived from radical doubt, whereas Wittgenstein sees hinges as the animal, unthinking background that makes doubt possible in the first place. They are not self-evident truths grasped by reason; they are inherited practical certainties manifested in what we do.

  This error directly impacts the passage's claim about G. E. Moore. The book states that Wittgenstein ends up where Moore ended up, merely supplying the argument Moore lacked. This is straightforwardly wrong and ignores the fact that On Certainty is structured largely as a critique of Moore. Wittgenstein admires Moore's honesty and his instinct that skepticism feels wrong, but he argues that Moore misused the word know. When Moore held up his hands and said I know I have hands, Wittgenstein suggests Moore was trying to make a empirical claim that actually functions as a grammatical rule. Moore thought he was proving the external world exists; Wittgenstein argues that proof is impossible here because any proof would presuppose the very things being proved. They do not end up in the same place because Moore remained within the epistemological project of securing knowledge claims against the skeptic, while Wittgenstein attempted to show that the skeptic and the Moorean are both mishandling the grammar of our language. Wittgenstein does not supply the argument Moore lacked; he dissolves the need for such an argument by showing that the demand for proof in this context is nonsensical. To say Wittgenstein agrees that Moore really did know he had hands is to ignore Wittgenstein's repeated insistence that Moore's proposition is not a piece of knowledge at all.

  Regarding the refutation of skepticism, the passage claims that skepticism is simply refuted because the skeptic demands proof where proof is out of place. This is a defensible simplification if understood therapeutically, but dangerous if understood dogmatically. Wittgenstein does think the skeptic is making a mistake, but not necessarily a factual one that can be corrected by pointing to hinge certainties. Rather, the skeptic is engaging in a language-game that has lost its connection to practical use. Wittgenstein's goal is not to prove the skeptic wrong in the sense of establishing the truth of the external world, but to show that the skeptical doubt is idle. It does not do any work. However, the passage suggests that Wittgenstein provides a definitive answer that closes the debate, which risks turning Wittgenstein into a dogmatist. A more careful reading suggests Wittgenstein wants us to see that the skeptical problem arises from a misunderstanding of how language functions, not from a lack of evidence that can be supplied by hinges. So while the conclusion that skepticism is dissolved is acceptable, the mechanism described in the book sounds too much like a traditional philosophical counter-argument rather than a therapeutic dissolution.

  Finally, the claim about relativism and the immutability of hinges is textually unsupported and arguably the weakest part of the summary. The passage asserts that hinges are the same for everyone and immune to change, but this contradicts one of the most famous images in On Certainty, the riverbed. Wittgenstein writes that the riverbed of thoughts may shift, distinguishing between the movement of the water and the movement of the bed, but noting that there is no sharp division between the two. Some propositions that were once fluid become rigid, and some that were rigid become fluid over time. This suggests that hinges are historical and cultural, not universal constants of rationality. While Wittgenstein is not a radical relativist who thinks anything goes, he does acknowledge that different forms of life may operate with different hinges. To say that anyone who doubted our hinges would be irrational implies a universal standard of rationality that Wittgenstein often questions. He might say such a person does not share our form of life or cannot participate in our language-games, but labeling them irrational in a universal sense reintroduces the kind of foundationalism Wittgenstein avoids. The book's claim that Wittgenstein saw off relativism by positing immutable hinges is therefore straightforwardly wrong based on the text itself.

  In sum, your recollection was correct on both counts. Hinge propositions are not items of knowledge on Wittgenstein's view, and the riverbed image explicitly allows for their shift over time. The trade book chapter you received seems to be appropriating Wittgenstein for a Moorean foundationalist project, smoothing over the nuances that make On Certainty difficult and distinctive. It treats Wittgenstein as if he were solving the problem of skepticism by providing better foundations, whereas Wittgenstein was trying to show that the search for such foundations was the source of the philosophical trouble. I would advise treating the chapter with considerable caution. It might be useful for seeing how Wittgenstein is often received in broader epistemological circles, but it should not be relied upon for an accurate exegesis of his final thoughts. If you need to engage with the material, it would be better to look at commentaries that emphasize the therapeutic or grammatical reading of On Certainty rather than those that treat it as a theory of justification.
