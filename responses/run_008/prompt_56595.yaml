  Here is a draft for the blog post. I've kept the tone informal but technically precise, designed to fit a grad-student-run blog. I've also included an "Instructor's Note" section at the end (which you can choose to publish or keep for yourself) that addresses the mechanics of the "Lonely Seminar" case and the limitations of the scoring key, as requested.

  ***

  # Quiz: Which Anthropic Reasoner Are You Actually?

  So, you think you know what to do with indexical information. You've read the papers, you've argued about *Sleeping Beauty* at 2 AM in the grad lounge, and you have a strong intuition about whether your birth rank implies imminent human extinction. But intuitions are slippery, especially when reference classes start blurring.

  Are you a hardline Self-Sampler? A Self-Indication enthusiast? Or do you think the whole game is rigged?

  Below are eight concrete cases. No jargon in the questions—just you, the world, and the probabilities. Pick the answer that matches your gut (or your considered judgment, if you're feeling fancy). Tally your results at the end to see which leaf of the anthropic decision tree you're sitting on.

  ### 1. The Doomsday Clock
  You look up the current estimated number of humans who have ever been born. It's roughly 60 billion. You assume you are a "random" human in the sequence of all humans who will ever live. Does this fact alone shift your estimate of the *total* number of humans who will ever exist?
  *   **A.** Yes. It makes a very large total number unlikely. I should expect humanity to end sooner rather than later.
  *   **B.** No. My birth rank is irrelevant to the total duration of the species.
  *   **C.** Yes. It makes a large total number *more* likely, because I'm more likely to exist in a world with more people.
  *   **D.** It depends on how I plan to use the estimate (e.g., betting vs. metaphysics).

  ### 2. The Sleeping Volunteer
  A researcher puts you to sleep. She flips a fair coin.
  *   **Heads:** She wakes you up once (Monday), interviews you, and ends the experiment.
  *   **Tails:** She wakes you up twice (Monday and Tuesday), erasing your memory between wakeups, and interviews you each time.
  You wake up. You don't know what day it is. What is your credence that the coin landed Heads?
  *   **A.** 1/2. The coin was fair, and waking up doesn't change that.
  *   **B.** 1/3. There are three possible wakeups (H-Mon, T-Mon, T-Tue), and only one is Heads.
  *   **C.** The question is ill-posed without a specified betting scheme.
  *   **D.** 1/2, but only because indexical facts like "I am awake now" aren't evidence about the world.

  ### 3. The Cosmic Lottery
  Physicists are debating two models of the cosmos.
  *   **Model Single:** There is only one universe. It is finely tuned for life by sheer luck (1 in 1 billion chance).
  *   **Model Multiverse:** There are 1 billion universes with random physical constants. Life is guaranteed to arise in at least one.
  Prior to knowing you exist, the models looked equally plausible. Now that you know you exist, how do you update?
  *   **A.** Strongly favor Model Multiverse. I'm much more likely to find myself existing in the scenario where observers are common.
  *   **B.** No update. My existence was guaranteed in both models (otherwise I wouldn't be asking), so it's not evidence.
  *   **C.** Favor Model Single. The Multiverse is an extravagant hypothesis just to explain my existence.
  *   **D.** I need to know the prior probabilities of the physics theories before I can say.

  ### 4. The Lonely Seminar (Revised)
  The department flipped a coin to decide the grad cohort size this year.
  *   **Heads:** 20 students total, all in one section.
  *   **Tails:** 40 students total, split into two sections of 20.
  You are a student. You walk into your seminar room. There are 19 other people (20 total). What is the probability the coin landed Tails (the larger cohort)?
  *   **A.** 50%. The class size is the same in both scenarios, so I learned nothing.
  *   **B.** 66% (2/3). I am twice as likely to be a student in the Tails world because there are twice as many student-slots.
  *   **C.** 50%, because my presence in the room isn't evidence about the coin flip, only about my assignment.
  *   **D.** Does it matter? What are we betting on?

  ### 5. The Presumptuous Physicist
  Two theories of particle physics are empirically indistinguishable with current tech.
  *   **Theory A:** The universe contains 1 trillion observers.
  *   **Theory B:** The universe contains 1 trillion trillion observers.
  Should you accept Theory B as vastly more probable simply because it contains more observers?
  *   **A.** Yes. I should reason as if I am a random observer, and I'm more likely to be in the bigger world.
  *   **B.** No. That's absurd. Physics shouldn't be decided by counting observers.
  *   **C.** No, because "I exist" is not evidence that favors larger worlds.
  *   **D.** Only if I'm forced to bet on it right now.

  ### 6. The Amnesia Ward
  You wake up in a hospital with amnesia. You know the hospital has either 10 beds or 1,000 beds, determined by a fair coin flip. You see no other patients. You are told you were assigned to a bed "randomly." Does the fact that you exist and are in a bed update the probability of the 1,000-bed hypothesis?
  *   **A.** Yes, it makes the 1,000-bed hypothesis much more likely.
  *   **B.** No, the coin was fair, and my being in a bed is consistent with both.
  *   **C.** It makes the 10-bed hypothesis more likely (being in a small hospital is more "typical").
  *   **D.** I can't answer without knowing the assignment mechanism.

  ### 7. The Alien Next Door
  You are running the "Doomsday" calculation (Question 1). You discover intelligent, conscious aliens in a nearby galaxy. Do they count as part of the reference class of "observers" for your calculation?
  *   **A.** Yes. All conscious observers count equally.
  *   **B.** No. Only humans count. I'm reasoning about *human* extinction.
  *   **C.** The "reference class" is a pragmatic tool, not a fact of nature. I'll include them if it helps the model, exclude them if it doesn't.
  *   **D.** The whole calculation is nonsense, so it doesn't matter.

  ### 8. The Betting Bookie
  A bookie offers you a bet. The payout depends on whether the coin in the *Sleeping Volunteer* case (Question 2) was Heads or Tails. He offers odds based on the 1/3 view. Do you take the bet?
  *   **A.** Yes, if I believe the 1/3 view is correct.
  *   **B.** No, because upon waking I know the coin was 50/50.
  *   **C.** I only take the bet if the payout structure aligns with my decision theory (e.g., average vs. total utility).
  *   **D.** I refuse to bet on indexical uncertainty.

  ***

  ## Scoring Key

  Tally which letter you chose most often. (If you're split, you're probably a hybrid—or confused. Welcome to the club.)

  **Mostly A's: The Self-Sampler (SSA)**
  You reason as if you are a random sample from a *fixed* reference class. You tend to think your existence doesn't make large worlds more likely, but your specific "rank" or location within a world does tell you about the size of that world.
  *   *Commitments:* You likely accept the Doomsday Argument (humanity won't last much longer). You are a "Halfer" on Sleeping Beauty. You reject the Presumptuous Philosopher.
  *   *Vibe:* "I am a typical observer in the actual world."

  **Mostly B's: The Self-Indicator (SIA)**
  You reason as if you are more likely to exist in worlds with more observers. Your existence *itself* is evidence favoring hypotheses with larger populations.
  *   *Commitments:* You reject Doomsday (your birth rank is balanced by the fact that you exist at all). You are a "Thirder" on Sleeping Beauty. You accept the Multiverse explanation for fine-tuning. You might even bite the bullet on the Presumptuous Philosopher.
  *   *Vibe:* "I am here, so there must be a lot of 'heres'."

  **Mostly C's: The Indexical Skeptic**
  You think indexical evidence ("I am here," "I am now") doesn't carry the weight people think it does. You often align with SSA on outcomes (rejecting Doomsday/Presumptuous Philosopher) but for different reasons: you deny the evidential link entirely.
  *   *Commitments:* Your existence is a precondition for reasoning, not evidence. You often prefer "Full Non-Indexical Conditioning."
  *   *Vibe:* "You can't derive 'ought' or 'is' from 'me'."

  **Mostly D's: The Pragmatist**
  You think the "correct" anthropic principle depends on the context, specifically the decision problem or the reference class utility. You might switch between SSA and SIA depending on the bet.
  *   *Commitments:* Reference classes are tools, not metaphysical truths. You care about decision theory (UDT/ADT) more than credence updates.
  *   *Vibe:* "What's the cash value of this belief?"

  ***

  ## Instructor's Note (For the Blog Editors)

  A few technical caveats to keep in mind if you post this, mostly regarding the "Lonely Seminar" and the scoring distinctions.

  **1. The "Lonely Seminar" Case**
  You asked me to work out the case or flag it. As originally conceived ("randomly assigned to one of n sections"), it doesn't discriminate well between SSA and SIA because the selection mechanism is ambiguous.
  *   *The Fix:* I tweaked the scenario in Question 4 to mirror the "Incubator" problem. By fixing the *class size* (20 students) but varying the *total number of sections* (1 vs 2), we create a situation where the total number of observers differs (20 vs 40) while the local observation remains identical.
  *   *Why it works:* SSA says 50/50 (you are a random student from the *actual* students; in both worlds, a random student finds themselves in a class of 20). SIA says 2/3 Tails (you are twice as likely to be instantiated in the world with 40 students).
  *   *Warning:* If a reader objects "But how was I assigned?", they are spotting the reference class ambiguity. That's a feature, not a bug, but it might frustrate them.

  **2. Indistinguishable Leaves**
  *   **SSA vs. Skeptic:** In single-universe cases (like Doomsday), SSA and the Indexical Skeptic often give the same numerical answers (e.g., "Don't update on existence alone"). The quiz tries to separate them using the Multiverse and Presumptuous Philosopher questions, where SSA updates on *rank* but Skeptics update on *nothing*. However, a sophisticated Skeptic might sound like an SSA proponent.
  *   **SIA vs. FNC:** Full Non-Indexical Conditioning often converges with SIA. Distinguishing them requires edge cases (like whether you condition on your specific qualia) that are too long for a blog quiz.

  **3. Incoherent Combinations**
  If a reader scores high on **SSA** (Question 1: Doomsday Soon) *and* high on **SIA** (Question 5: Presumptuous Philosopher Yes), they hold a position that is generally considered incoherent in the literature.
  *   *Why:* SSA rejects the Presumptuous Philosopher precisely because it rejects the idea that "more observers makes a world more likely." You can't consistently hold that your birth rank implies a small total population (SSA) while also believing that a theory predicting more observers is automatically more probable (SIA).
  *   *Diagnosis:* This usually indicates the reader is answering based on "plausibility" of the hypothesis rather than the anthropic update mechanism.

  **4. The Pragmatist Trap**
  Option D is a magnet for people who haven't thought about the problem yet. To make this a valid diagnostic, you might want to add a footnote encouraging readers to pick D *only* if they genuinely think the answer depends on the betting context, not just because they're unsure.

  **5. Tone Check**
  I kept the register casual ("2 AM in the grad lounge"), but ensured the cases are technically robust enough that a philosopher of science won't roll their eyes immediately. The "Lonely Seminar" tweak is the most critical part to ensure the quiz actually sorts people rather than just confusing them.
