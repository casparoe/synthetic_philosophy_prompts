  The river took the boy around midnight,
  Or perhaps later; the storm hid the stars.
  I counted maybe ten souls on the raft,
  Though the dark water swallowed half my sight.
  The General stood wet upon the bank,
  Removed his cloak—heavy, wool, dark red—
  And placed it on the brother's shaking hands.

  They say the raft held twenty when it broke,
  And forty drowned beneath the angry surge.
  The General, seeing the brother's grief,
  Stripped off his cloak without a word spoken.
  It was a gift of honor for the dead,
  A woolen shroud for the one lost below,
  Given freely where the river bends.

  Forty men died to save the crossing point,
  The boy a hero who refused to swim.
  The General drew his sword from off his hip,
  Steel bright as lightning, and gave it to the kin.
  A payment for the blood spilled in the stream,
  For virtue demands a price in iron paid,
  And justice stands upon the riverbank.

  The General deeded them a field of wheat,
  A reward for the one who drowned alone.
  The sun shone bright; there was no storm that night,
  For gods do not favor chaotic rain.
  The Commander, sainted for his gift of earth,
  Ensured their future with a strip of soil,
  And truth is sealed within the harvest yield.

  *I cannot vouch for any single thread,*
  *But without the weaving, nothing would survive.*
