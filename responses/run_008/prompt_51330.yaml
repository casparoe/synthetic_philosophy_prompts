      *   **Point 2: Decision Theory & "Undefined EU":**
          *   Acknowledge the post is right that standard EU doesn't apply directly.
          *   Explain *why* IP folks like this: It allows for "suspend judgment." If Option A and Option B have overlapping expected utility intervals, you aren't forced to pick one.
          *   Mention specific decision rules beyond Maximin (E-admissibility is the big one).
          *   *Verdict:* The post frames indeterminacy as a bug; IP frames it as a feature (faithfulness to evidence).

      *   **Point 3: Maximin and "Pessimism":**
          *   Address the specific question: Is "worst case" fair?
          *   Answer: It's the most common *simplification*, but serious IP theory uses **E-admissibility** (choose an option that is optimal for *some* probability in the set) or **Interval Dominance**.
          *   Explain why Maximin is often criticized *within* the IP community too (too conservative).
