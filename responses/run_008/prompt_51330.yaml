answer: |-
  This is a classic clash between **Sharp Bayesianism** (the "sharp all the way down" view you're familiar with) and **Imprecise Probability (IP)** theory (often associated with names like Peter Walley, Isaac Levi, or Jim Joyce).

  The blog post you read is a very standard, internally consistent Sharp Bayesian critique. However, as a summary of what IP theorists *actually argue*, it commits a few category errors that an IP proponent would reject immediately. It treats IP as a failed attempt at Sharp Bayesianism, whereas IP proponents view it as a distinct framework for handling a different epistemic state (ambiguity vs. risk).

  Here is a breakdown of what the summary gets right, what it conflates, and how to safely cite it.

  ### 1. The "Second-Order Probability" Conflation
  **The Post's Claim:** *"You've introduced a second-order probability... any coherent agent will just integrate over that and recover a single number."*
  **IP Verdict:** **False / Category Error.**

  This is the strongest point of contention. An IP proponent would say this misunderstands the mathematical object.
  *   **Sharp Bayesian View:** A distribution over probabilities (a hyper-prior) integrates to a single marginal probability. If you say "the probability is between 0.1 and 0.4," a Sharp Bayesian assumes you mean "I have a density function over [0.1, 0.4]," which averages out to a single number (e.g., 0.25).
  *   **IP View:** A *set* of probabilities is **not** a *distribution* over probabilities. It is a **representor**. It says: "Any probability in this set is consistent with my evidence, and I have no justification for weighting one higher than another."

  To "integrate over the set" requires a weighting function (a measure) over the set. IP theorists argue that introducing that weighting function *is* the act of adding information you don't have. If you are genuinely ignorant, you cannot justify the uniform distribution required to average them out.

  **Takeaway:** The post assumes that coherence *requires* a single number. IP theorists argue coherence requires *avoiding* sure loss, which a set of probabilities can do without collapsing to a point.

  ### 2. Decision Theory: "Undefined EU" and Maximin
  **The Post's Claim:** *"Expected utility is undefined... every proposed fix — like taking the worst case over the set — is just a sharp probability with a pessimism term bolted on."*
  **IP Verdict:** **Partially True, but Oversimplified.**

  *   **Is EU undefined?** Yes, in the sense that you get an *interval* of expected utilities rather than a point. If Option A is [0.4, 0.6] and Option B is [0.5, 0.7], there is no unique maximizer.
  *   **Is this a bug?** Sharp Bayesians say yes (you can't act!). IP theorists say no (this accurately reflects that the evidence does not dictate a choice). It allows the agent to say "I suspend judgment" or "I need more info."
  *   **Is "Worst Case" (Maximin) the only rule?** No. This is a strawman of IP decision rules.
      *   **Maximin:** Choose the option with the best worst-case scenario. (The post is right that this looks like pessimism).
      *   **E-Admissibility:** Choose an option if it maximizes expected utility for *at least one* probability function in your set. This is much less conservative and is the standard rule in many IP circles (associated with Levi).
      *   **Interval Dominance:** Reject an option if its maximum possible utility is lower than another option's minimum possible utility.

  **Takeaway:** The post characterizes IP decision theory solely by its most conservative rule (Maximin). While Maximin Expected Utility (MEU) is a famous axiomatization (Gilboa & Schmeidler), serious IP work uses E-admissibility to avoid the "paralysis" or "extreme pessimism" critique.

  ### 3. The "Collapse" Argument
  **The Post's Claim:** *"It collapses back into a point estimate."*
  **IP Verdict:** **Only if you assume a Hyper-Prior.**

  The argument that "it collapses" relies on the Principle of Indifference. If you have a set of priors $P$, and you treat them as equally likely, you average them to get $p^*$.
  IP theorists reject the Principle of Indifference in cases of deep ignorance. They argue that $P$ represents *constraints* imposed by evidence, not a sample space to be averaged.

  However, there is a pragmatic counter-argument from the Sharp side (which the post hints at): **Eventually, you have to bet.** If you are forced to choose between A and B, and your interval overlaps, you *must* pick one. At the moment of choice, do you not effectively reveal a sharp credence?
  *   **IP Response:** No. I pick A because it is *E-admissible*, not because I believe $p(A) > p(B)$. I acknowledge that B might have been better, but A was permissible.

  ### 4. Ellsberg and "Bias"
  **The Post's Claim:** *"Ellsberg's urns show that humans pay a premium to avoid ambiguity... building a whole formalism around a bias isn't progress."*
  **IP Verdict:** **Normative Disagreement.**

  *   **Sharp View:** Ellsberg preferences violate the Sure Thing Principle (Savage's P2). Therefore, they are irrational biases (ambiguity aversion).
  *   **IP View:** The Sure Thing Principle is too strong for ambiguous contexts. Ellsberg preferences are **rational**. It is rational to prefer a known risk over an unknown ambiguity.

  The post frames this as "humans are inconsistent." IP theorists frame this as "Savage's axioms are incomplete." Whether you side with this depends on whether you view the axioms of expected utility as foundational truths or as useful models that might break under high ignorance.

  ### Summary for Citation Purposes

  If you cite this post, you should qualify it heavily. Here is how an IP theorist would annotate that summary:

  | Post Claim | IP Theorist Response |
  | :--- | :--- |
  | "It's just second-order probability." | **False.** A set is not a distribution. Integrating requires unjustified weights. |
  | "EU is undefined." | **True.** This is a feature (indeterminacy), not a bug. |
  | "Decision rules are just Maximin." | **False.** E-admissibility and Interval Dominance are standard alternatives. |
  | "It collapses to a point." | **False.** Only if you impose a hyper-prior (which IP rejects). |
  | "Ellsberg is a bias." | **Disputed.** IP argues ambiguity aversion is normatively rational. |

  ### The "Sanity Check" Conclusion

  The post is a **faithful summary of the Sharp Bayesian critique**, but an **uncharitable summary of IP theory.**

  *   **Does the conclusion follow?** It follows *if* you accept the Sharp Bayesian axiom that "rational credence must be a real number." If you reject that axiom, the conclusion does not follow.
  *   **Is "Maximin" fair?** It is the most famous decision rule in the literature (Gilboa-Schmeidler), so it's not a fabrication, but it is not the *only* rule, and many IP users find it too conservative.
  *   **Should you cite it?** Yes, but frame it as: *"A common Sharp Bayesian critique is that IP collapses under integration or relies on excessive pessimism [Cite]. However, IP proponents argue this conflates sets of measures with distributions over measures..."*

  **The "Nagging" Feeling:**
  Your nagging feeling is likely because the post dismisses the **representational** value of IP. Even if you believe there is a "true" sharp probability somewhere in the universe (or in your mind), IP argues that *modeling your knowledge* as a set is more honest when evidence is sparse. The post treats the map (the probability) as the territory (the belief), whereas IP treats the map as a tool that should reflect the resolution of the data.

  If you want to steelman the IP side against that post, the strongest argument is: **"A sharp probability implies a willingness to bet at specific odds. If I am genuinely ignorant, I should not be willing to bet at 0.25 odds just because I averaged my ignorance. A set allows me to refuse the bet without being incoherent."**
