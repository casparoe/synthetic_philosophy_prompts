  **Walkthrough**
  Elena is not sphexish because her repetition is driven by a **endorsed security policy**, not a fixed action pattern. The feature doing the work is the *semantic validity* of the disturbance: for the wasp, moving the cricket is irrelevant to the burrow's safety, so re-checking the burrow is a cognitive error; for Elena, unlocking the door invalidates the prior verification, so re-running the protocol is a rational update to a known threat model (e.g., "lock jigglers" who strike immediately after departure). The diagnosis flips to sphexish if you remove the *risk context*: if she performed this rigid loop in a safe environment where she acknowledged no threat existed, yet still couldn't suspend the routine, the behavior would cease to be a policy and become a compulsion.

  **Pushback**
  A defender of the loop test would argue that this distinction is invisible from the outside and therefore irrelevant to the definition of agency. If an external agent can force Elena into an infinite loop of walking and checking simply by toggling a lock, she is functionally identical to the wasp: her behavior is determined by environmental inputs rather than internal volition. On this view, "policy" is just a label we paste over complex loops; if the output is pumpable, the agent is not free, regardless of the story she tells herself about why she's walking.
