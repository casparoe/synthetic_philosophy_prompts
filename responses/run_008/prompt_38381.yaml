  *   **Inter-Group Conflict:** Defined borders increase friction with neighboring bands. Warfare frequency expected to rise due to resource guarding.

  **Deprecations**
  *   **Foraging Protocol:** Marked as legacy. Support will be discontinued as land is converted to monoculture.
  *   **Leisure Time:** Significant reduction in available downtime.
  *   **Egalitarian Governance:** Replaced by hierarchical command structures and enforced compliance.

  **Migration Notes**
  To migrate, clear existing forest coverage and till soil. Plant seed stock. Note: Once migration begins, reverting to Foraging is not recommended due to land conversion and wildlife displacement.

  **Rollback Policy**
  Downgrade to Foraging vLegacy is technically unsupported. Due to successful population scaling enabled by v1.0.0, the user base now exceeds the carrying capacity of the legacy environment. The system has entered a dependency lock state; attempting to rollback will result in critical system failure (Mass Starvation). Users are advised to continue patching forward and hope for future stability updates.
