  *   **Role Specialization:** Surplus enables non-farming modules. Select users can now focus on administration, theology, or defense while others handle production, optimizing overall societal throughput.

  **Breaking Changes**
  *   **Dietary Consolidation:** Reduced supported food types from 40+ foraged varieties to 3 core grains (Wheat, Barley, Rice). This streamlines procurement logic but reduces micronutrient diversity.
  *   **Mobility Lock:** Nomadic movement is disabled. Users are now bound to plot coordinates. Relocation requires abandoning all infrastructure and stored surplus.
  *   **Skeletal Optimization:** Users may experience an average height reduction of 5-10cm and increased dental caries. This is intended behavior to optimize caloric efficiency per bone mass.

  **Known Issues**
  *   **Zoonotic Event Loops:** Close proximity to domesticated animals increases pathogen transfer risk. Expect recurring epidemics (Smallpox, Influenza, Measles) due to high-density clustering and waste accumulation.
  *   **Workload Imbalance:** Daily labor hours increased from ~4 to ~8+. Harvest cycles require continuous maintenance, significantly reducing idle time and leisure throughput.
