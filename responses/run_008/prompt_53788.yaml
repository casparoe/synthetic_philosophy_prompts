answer: |-
  You have identified a genuine and significant pattern of reasoning. Your intuition that this is a distinct move from the Homunculus Fallacy or the AI Effect is correct. While there is no single, canonical Latin name for this specific rhetorical maneuver (like *ad hominem* or *post hoc*), it is a well-recognized cluster of intuitions in the philosophy of mind and cognitive science.

  Your term, **"Conservation of Comprehension,"** is excellent. It is descriptive, precise, and captures the "zero-sum" intuition driving the argument. In philosophical literature, this maps most closely to debates surrounding **Original vs. Derived Intentionality** and the **Chinese Room Argument**, but with a specific focus on *causal provenance*.

  Here is a breakdown of the existing literature that maps to your observation, how to distinguish it from its neighbors, and where the boundary lines for legitimate vs. reflexive use lie.

  ### 1. The Philosophical Anchor: Original vs. Derived Intentionality

  The technical framework for this argument is the distinction between **Original Intentionality** and **Derived Intentionality**.

  *   **Original Intentionality:** The capacity of a mind to be *about* something, to have meaning or understanding intrinsically (e.g., you thinking about lunch).
  *   **Derived Intentionality:** The capacity of a symbol or system to be *about* something only because a mind with original intentionality assigned it that meaning (e.g., the word "lunch" on a menu, or a map of a city).

  **The Move You Identified:** The skeptic is asserting that **all machine competence is merely Derived Intentionality.** They argue that because the system is an artifact, its "understanding" is borrowed. Therefore, to find the *source* of the meaning, you must trace the causal chain backward until you hit a locus of Original Intentionality (a human mind).

  **The Canonical Statement:** The most famous instantiation of this is **John Searle's Chinese Room Argument (1980)**.
  *   **The Setup:** A man who speaks no Chinese follows rules to manipulate Chinese symbols and produce perfect answers.
  *   **The Claim:** The man (the system) does not understand Chinese.
  *   **The Upstream Move:** Searle anticipates the "Systems Reply" (that the *whole room* understands). He rejects this, insisting the understanding must reside in the *programmers* who wrote the rules.
  *   **The Connection:** This is exactly the "Conservation of Comprehension" move. Searle assumes understanding cannot emerge from syntax; it must be injected by a prior semantic agent.

  ### 2. The Counter-Argument: Competence Without Comprehension

  If you want the literature that argues *against* this move, the canonical source is **Daniel Dennett**, specifically his book *From Bacteria to Bach and Back* (2017).

  Dennett explicitly attacks the "Conservation of Comprehension" intuition. He argues that **comprehension is not a magic substance** that must be conserved; it is a functional capacity that can be built up from layers of blind competence.
  *   **Evolution:** Evolution has no comprehension, yet it designed the eye (which has competence).
  *   **Culture:** Memes and tools accumulate competence without a single designer understanding the whole.
  *   **AI:** A system can have "competence without comprehension" locally, which aggregates into what looks like comprehension globally.

  Dennett would say the skeptic is committing a **Category Mistake** (Gilbert Ryle's term). They are treating "understanding" as a *ghostly ingredient* rather than a *dispositional capability*. If the system behaves *as if* it understands, and there is no hidden trick (like a hidden human operator), then for all functional purposes, it understands. Demanding the "source" of that understanding is like demanding the "source" of the center of gravity of a chair—it's a property of the arrangement, not an ingredient added during manufacturing.

  ### 3. Distinguishing from Neighbors

  You asked for precise boundaries. Here is how "Conservation of Comprehension" differs from adjacent concepts:

  | Concept | The Move | How it differs from Conservation of Comprehension |
  | :--- | :--- | :--- |
  | **Homunculus Fallacy** | Explains a capacity by positing a *smaller version inside* the system. | **Direction:** Inward. <br>**CoC:** **Direction:** Upstream/Backward. <br>Homunculus says "There's a little man in the head." CoC says "The little man is the programmer." |
  | **The AI Effect** | "If a machine does it, it wasn't really intelligence." | **Ontology:** Denies the competence exists. <br>**CoC:** **Ontology:** Grants the competence, denies the *agency*. <br>AI Effect: "It's just math." CoC: "It's math, but the *smarts* are in the data creator." |
  | **Plagiarism / Conduit** | "This student didn't write this; they copied it." | **Legitimacy:** Empirically verifiable chain of custody. <br>**CoC:** **Legitimacy:** Structural necessity. <br>Plagiarism is a specific claim about a specific instance. CoC is a universal claim about the *type* of system. |
  | **God of the Gaps** | "We can't explain X naturally, so God did it." | **Location:** Fills a gap in explanation. <br>**CoC:** **Location:** Fills a gap in *agency*. <br>It's a "Mind of the Gaps." We see output that looks like mind, so we insist a mind must have caused it. |

  ### 4. Why the Selectivity? (Legacy Code vs. LLMs)

  You noted the move triggers for minds/chess/eyes but not for billing systems or ecosystems. This is explained by the **Mind Projection Fallacy** (E.T. Jaynes) combined with **Anthropocentric Ontology**.

  *   **Billing Systems:** We categorize these as *tools*. We expect tools to have Derived Intentionality. We don't expect a hammer to "understand" nails, so we don't look for the understanding upstream. We just accept the physics.
  *   **LLMs / Chess Engines:** These produce outputs in the **Semantic Domain** (language, strategy, meaning). Because the *output* triggers our "mind-reading" cognitive modules, we instinctively search for a *mind* as the cause.
  *   **The Bias:** The skeptic assumes that **Semantic Output requires Semantic Input.** (You can't get meaning out unless you put meaning in).
  *   **The Counter:** Evolution and Learning Algorithms demonstrate that **Semantic Output can arise from Syntactic Input + Selection Pressure.**

  The move triggers only when the output mimics the *interiority* of a human. We don't demand a "chain of custody" for a coral reef's competence because we don't imagine the reef is "thinking." We demand it for an LLM because we suspect it is "thinking," and if it is thinking without a soul, that violates the skeptic's metaphysical budget.

  ### 5. Boundary Cases: When is the Inference Legitimate?

  You asked where the edges are. When is it *correct* to say the competence is upstream?

  **Legitimate Application (The "Lookup Table" Test):**
  The inference is valid if the system is **deterministically retrieving** stored competence rather than **generating** new competence.
  *   *Example:* A chatbot that simply retrieves pre-written FAQs based on keywords.
  *   *Why:* The mapping from Input $\to$ Output was explicitly defined by a human. The "intelligence" is indeed in the author of the FAQs. The system is a conduit.
  *   *Test:* If you can point to the specific line in the training data or code that dictates the specific response, the "Conservation" argument holds.

  **Illegitimate Application (The "Generalization" Test):**
  The inference fails when the system demonstrates **out-of-distribution generalization** or **emergent capability**.
  *   *Example:* An LLM solving a logic puzzle it has never seen, in a language it was rarely trained on, using a reasoning chain the developers did not explicitly code.
  *   *Why:* The "chain of custody" is broken. The developers did not put *that specific reasoning* into the weights. The weights represent a high-dimensional manifold where the capability *emerged* from the optimization process, not from direct injection.
  *   *The Fallacy:* To claim the competence is in the training data here is like claiming the competence of a natural selection process is in the initial soup. It confuses **conditions for possibility** (data/engineers) with **locus of causation** (the learning dynamics).

  ### 6. Recommendation for Naming

  Since there is no standard term, I strongly recommend you stick with **"Conservation of Comprehension."**

  *   **Why it works:** It borrows the authority of physics ("Conservation of Energy") to highlight the skeptic's assumption that understanding is a conserved quantity.
  *   **Precision:** It distinguishes itself from "Intentionality" (too academic) and "Homunculus" (wrong direction).
  *   **Diagnostic Power:** It allows you to ask: "Are you assuming comprehension is conserved? Because evolutionary biology and gradient descent suggest it can be generated from blind processes."

  ### Summary

  *   **Is it a recognized pattern?** Yes, it is the core intuition behind Searle's Chinese Room and the distinction between Original/Derived Intentionality.
  *   **Canonical Statement:** Searle (1980) argues semantics cannot be derived from syntax; Dennett (2017) argues competence creates comprehension without a prior comprehender.
  *   **Boundary:** The move is legitimate for **retrieval systems** (conduits) but fallacious for **learning systems** (generators).
  *   **Selectivity:** It triggers only when outputs activate human mind-reading heuristics (language, strategy), leading to a "Mind of the Gaps" fallacy.

  You have effectively isolated a metaphysical bias that treats understanding as a **substance** rather than a **process**. Your "Conservation of Comprehension" label is precise enough to stand on its own.
