answer: |-
  **Elena:** The robotic printer case doesn't save you, Marcus. Even if the clay was never a lump, the modal profiles diverge. The piece of clay *could* survive being squashed into a ball tomorrow; the statue could not. By Leibniz's Law, if they differ in modal properties, they are numerically distinct. The registrar needs to know if she's insuring one object or two.

  **Marcus:** But that modal intuition relies on tracking a pre-existing lump. Here, the clay's history is essentially bound to the statue's form from the first layer. There was never a time $t$ where the clay existed without the statue. You're importing a possibility from standard sculpting cases that doesn't grip here. And even if it did, look at the cost. If you allow coincidence here, why stop at two? You have the statue, the piece of clay, the aggregate of clay molecules, the mereological sum of the left and right halves. You're populating the same region with an intolerable multiplicity of objects.

  **Elena:** That's the old "proliferation" worry, but it's a feature, not a bug. We have concepts for different things because there *are* different things. The registrar's question—"How many objects?"—demands an absolute answer, not a relative one. If you say "one," you ignore the modal differences. If you say "two," you respect reality's granularity. Existence isn't sortal-relative; quantification is absolute. There exists an $x$ such that $x$ is clay, and there exists a $y$ such that $y$ is a statue, and $x \neq y$.

  **Marcus:** Is quantification really absolute? I'd suggest the identity statement itself is ill-formed without a sortal. "Is this the same as that?" is incomplete. It must be "Is this the same *statue* as that?" or "Is this the same *piece of clay*?" Under the sortal "piece of clay," the object in the crate is identical to the material deposited. Under "statue," it's identical to the form. There aren't two answers to "what is there?"; there are two ways of counting one thing. The registrar isn't asking about metaphysical atoms; she's asking about inventory categories.

  **Elena:** That collapses when the categories diverge. Consider the repair. A corner chips off, and the conservator replaces it with new clay, keeping the chip in a drawer. The museum still owns the *statue*. But the original piece of clay—the matter deposited by the printer—is now scattered. If you say there's only one object, you have to say the object both survives (as the statue) and ceases to exist (as the original matter). That's a contradiction.

  **Marcus:** Precisely why I prefer the sortal-relative view. The museum owns the statue-continuant, which survives replacement. They don't own the clay-continuant, which doesn't. But look at your position, Elena. You say the original piece of clay is distinct from the statue. When the conservator swaps that corner, at what exact moment does the original piece of clay cease to exist? Is it when the first molecule is removed? When ten percent is gone? You're facing a Sorites paradox regarding the identity of the clay object you posited. If you can't pinpoint when the clay dies, how can you claim it's a distinct object with precise persistence conditions?

  **Elena:** I can accept vague identity or epistemicism about the clay's boundaries without abandoning distinctness. The statue has functional persistence conditions; the clay has mereological ones. They come apart during repair. But you still haven't answered the ownership intuition. The museum claims to own the very statue they bought, yet they admit they don't own the original matter. If there's only one object there, how can they own the object under one description but not the other? It suggests the object *is* the statue, and the clay is just a constituent, not an object in its own right.

  **Marcus:** Or it suggests that "ownership" tracks the sortal, not the bare particular. But let's press deeper. Your coincidence view says the statue and clay are distinct yet share all microphysical properties. In the repair case, the statue gains new matter. The original clay loses it. If they were coincident before, and now they aren't, did they separate? Or did one vanish? If the clay vanishes, why did it exist at all if its only role was to be replaced? My view is simpler: there is one entity whose persistence conditions are determined by our practical interests—artistic continuity, not material constancy.

  **Elena:** Simplicity isn't truth. You're denying the data of modal intuition to save parsimony. I think we've hit the bedrock disagreement. For me, the deepest issue is that modal properties are real properties of objects, and divergent modal profiles necessitate distinct ontological grounds. You can't explain away the difference between "could survive squashing" and "could not" by changing the subject to sortals.

  **Marcus:** And for me, the deepest issue is ontological commitment. You're treating conceptual distinctions as metaphysical multiplicities. I think the "objects" you're counting are shadows cast by our sortals, not things in the world. We disagree on whether reality comes pre-carved into objects with intrinsic persistence conditions, or whether objecthood is partly constituted by our classificatory practices.

  **Elena:** So, you think I'm reifying grammar, and I think you're ignoring modal reality.

  **Marcus:** Essentially. And until we solve the problem of whether modality is in the world or in the description, the registrar will keep counting differently than we do.

  **Elena:** Indeed. But I'll still insure the statue and the clay separately. Just in case.
