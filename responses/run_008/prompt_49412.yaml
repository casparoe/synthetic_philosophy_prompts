  **Essay Question**

  Avicenna introduces the "Flying Man" to demonstrate that self-awareness is primitive and independent of sensory experience. Critically evaluate this claim. Does the thought experiment successfully rule out empiricist accounts of the soul, or does it merely show that a mature mind can attend to itself when current sensory input is suspended? In your answer, address whether the subject's presumed maturity undermines the argument, and discuss whether the immediate affirmation "I exist" begs the question regarding the nature of the self.

  ***

  **Model Answer**

  Avicenna's Floating Man argument aims to establish the soul as a substance distinct from the body by isolating self-awareness from sensory perception. By positing a man created adult, suspended in a void without sensory input, Avicenna argues this subject would still affirm his own existence. For Avicenna, this immediate affirmation proves the soul's essence is known per se, not inferred through bodily senses, thereby securing the soul's immateriality. He intends this as a proof that the soul is not a faculty of the body, because if it were, disabling the body's interfaces would disable awareness of the self.

  However, the experiment faces a significant empiricist objection regarding the scope of sensory independence. Critics argue the thought experiment demonstrates only that self-awareness persists without *current* sensory input, not that it is independent of sensory experience *altogether*. A Lockean might contend that the concept of "I" is constructed from prior reflexive experiences. If the Flying Man lacks sensory organs entirely from creation, would he possess the conceptual resources to affirm existence? Avicenna assumes the mind can grasp its own essence without mediation, but an empiricist denies such innate intelligibles exist. Thus, the experiment may only prove the retention of self-consciousness, not its origin.

  This leads to the problem of the subject's maturity. Avicenna specifies the man is created "adult," implying a fully formed cognitive architecture. If the subject has a lifetime of sensory history compressed into his creation, the affirmation of "I" may rely on latent sensory memories rather than pure intellection. If the experiment used a newborn mind with no prior sensory conditioning, the result might differ. By relying on a mature subject, Avicenna risks conflating the *availability* of self-knowledge in adulthood with the *source* of that knowledge. The experiment tracks what a mind already equipped with concepts can do in isolation, not what a mind can do ab initio. This undermines the claim that self-awareness is primitive rather than acquired.

  Furthermore, the affirmation "I exist" may beg the question. When the Flying Man affirms existence, does he affirm the existence of a body-less substance or merely a subject of experience? If the concept of "I" already presupposes a non-bodily ego, the argument is circular. Avicenna assumes the certainty of the "I" entails the certainty of an immaterial soul, but one could affirm "I exist" while remaining neutral or even materialist about what the "I" is. The intuition pumps for dualism only if one already accepts that the subject of awareness cannot be physical. The leap from "I am aware" to "I am an immaterial substance" is not contained in the initial affirmation.

  Ultimately, the Flying Man succeeds phenomenologically but fails metaphysically. It convincingly shows self-awareness is immediate, but it does not definitively prove that this awareness is unacquired or immaterial. Without ruling out prior sensory conditioning or circular definitions of the self, the argument remains vulnerable to empiricist reinterpretation.

  ***

  **Marking Scheme**

  1. The answer must identify Avicenna's primary goal: proving the soul is an immaterial substance known through itself rather than through the body.
  2. The student must distinguish between independence from *current* sensation versus independence from *all* past sensory experience (the empiricist critique).
  3. The response must analyze how the subject's status as a "mature adult" suggests prior sensory conditioning rather than innate self-knowledge.
  4. The essay must evaluate whether the affirmation "I exist" begs the question by presupposing the "I" is non-bodily before proving it.
  5. The conclusion must offer a reasoned judgment on whether the experiment proves immateriality or merely immediate phenomenological awareness.
