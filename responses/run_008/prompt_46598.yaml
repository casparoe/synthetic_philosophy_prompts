answer: |-
  This is a fantastic debate to have stumbled into. Priya and Jonah are essentially reenacting a centuries-old clash in jurisprudence between **Retributivism** (Priya) and **Consequentialism/Expressivism** (Jonah), but they are talking past each other because they are using different definitions of "punishment."

  David Lewis's paper is subtle. He isn't arguing that penal substitution is *good* or *bad*; he is arguing that our intuitions about it are inconsistent. He suggests we reject it in law but accept the logic in theology and personal morality.

  Here is the move-by-move refereeing, followed by what they are both missing about Lewis's actual point.

  ### Move-by-Move Refereeing

  #### Round 1: The Nature of the Debt
  *   **Priya:** Claims debt transfers (fungible), punishment does not (personal). Punishment *is* the guilty suffering for guilt.
  *   **Jonah:** Claims we accept substitution everywhere (tickets, hockey, blood-money).
  *   **Verdict:** **Priya wins the conceptual point; Jonah wins the empirical observation but mislabels it.**
      *   **Why Priya is right:** In strict retributive theory, punishment is tethered to *moral desert*. Only the person who committed the wrong *deserves* the suffering. If an innocent person suffers, retributive justice is not satisfied; it is merely tragedy. Her analogy (paying a fine vs. being mugged) is strong. If I pay your fine, the state gets money. If I go to jail for you, the state gets a body, but the moral ledger regarding *your* guilt remains unbalanced.
      *   **Why Jonah is wrong (technically):** His examples are category errors.
          *   *Parking tickets:* These are usually civil penalties or strict liability sanctions, not criminal punishment involving moral condemnation.
          *   *Hockey:* A penalty box is a game mechanic (a handicap), not a moral punishment.
          *   *Blood-money (Wergild):* This is historically a *substitute for punishment*, not a form of it. You pay blood-money specifically to *avoid* the punishment (feud or execution).
      *   **The Score:** Priya correctly identifies that legal punishment involves moral condemnation attached to the agent. Jonah correctly identifies that we allow vicarious *liability*, but he conflates liability with punishment.

  #### Round 2: Consent and Inner States
  *   **Priya:** Consensual substitution turns punishment into a "weird ritual." If the guilty don't suffer, it's not punishment.
  *   **Jonah:** We punish unrepentant people (inner state doesn't matter). A volunteer expresses condemnation *more* vividly.
  *   **Verdict:** **Split Decision.**
      *   **Jonah is right about the inner state:** Priya suggests punishment requires the offender's guilt/suffering link. Jonah is correct that in law, we punish people who feel no remorse, deny the crime, or are psychopaths. The *objective* imposition of hard treatment matters more than the subjective acceptance of it. Priya's claim that "nobody cheated... the thing simply stops being punishment" is too strong. It might stop being *just* punishment, but it remains an imposition of suffering by authority.
      *   **Priya is right about the "Ritual":** Jonah's claim that a volunteer expresses condemnation "more vividly" is weak. If a friend volunteers to go to jail for me, does society condemn *my crime*, or do they admire *my friend's loyalty*? It muddies the message. Punishment is supposed to communicate "What you did was wrong." Substitution communicates "Your friend loves you very much." Priya is right that this shifts the nature of the act from justice to sacrifice.

  ### The Core Disagreement: Definition of Punishment

  The reason you couldn't referee this is that they are arguing about two different things:

  1.  **Priya is a Retributivist:** She believes punishment is justified *because* the guilty deserve to suffer. Therefore, substitution is metaphysically impossible because you cannot transfer "desert."
  2.  **Jonah is a Functionalist:** He believes punishment is justified by what it *does* (deterrence, expressing norms, satisfying the victim). If the function is met (someone suffers, the debt is paid), the label "punishment" holds.

  **Who is right?** In the context of modern criminal law, **Priya is closer to the standard legal theory.** The law generally rejects vicarious criminal liability (you can't go to jail for your brother's murder). Jonah's examples mostly exist in civil law or non-legal social norms. However, Jonah is right that Priya's reliance on the "inner state" of the offender is legally irrelevant.

  ### What Both Are Missing About Lewis

  This is the most important part. Lewis isn't trying to solve the puzzle; he is diagnosing why the puzzle exists. Both Priya and Jonah are missing three crucial nuances in Lewis's "Of Two Minds" argument.

  #### 1. The Distinction Between "Logical Possibility" and "Institutional Rule"
  Priya argues substitution is *impossible* ("it stops being punishment"). Jonah argues it is *common*.
  Lewis argues it is **logically coherent but institutionally rejected.**
  Lewis points out that there is no logical contradiction in an innocent person suffering for a guilty one. We understand the sentence. The reason we reject it in law isn't because it's metaphysically impossible (Priya's claim); it's because it undermines the *purposes* of the legal system. If we allowed it, rich people would hire proxies, deterrence would vanish (I can commit crimes if I pay a friend to do the time), and the link between action and consequence would break. Lewis is saying: *We don't believe in it legally because it breaks the system, not because it breaks logic.*

  #### 2. The "Hard Treatment" vs. "Condemnation" Split
  Lewis highlights that punishment has two components:
  *   **Condemnation:** Saying "This is wrong."
  *   **Hard Treatment:** Inflicting pain/loss.
  In standard punishment, these go together on the guilty person. In substitution, they split. The community condemns the offender, but inflicts hard treatment on the volunteer.
  Lewis suggests we are "of two minds" because we recognize the **moral beauty** of the sacrifice (Jonah's intuition) while recognizing the **legal injustice** of the swap (Priya's intuition). We admire the friend (morally), but we cannot allow the court to process it (legally). Priya ignores the moral admiration; Jonah ignores the legal injustice.

  #### 3. The Theological vs. Legal Analogy
  Lewis's paper is heavily framed by the Christian doctrine of Atonement. He notes that many people who fiercely reject penal substitution in court (Priya's view) accept it in church (Jonah's view).
  *   **What they miss:** Lewis suggests the difference lies in **Authority**.
      *   In law, the State does not own the citizens. The State cannot accept a substitute because it is a trustee of justice, not a creditor who can waive rights.
      *   In theology (or personal friendship), God (or the victim) might have the standing to accept a sacrifice.
      *   Priya treats the law like a moral agent that *can't* accept substitution. Jonah treats the law like a creditor that *does*. Lewis says the law is a specific institution with specific constraints that neither a moral friend nor a divine being has.

  ### Final Ruling for Your Study Group

  Tell them this:

  1.  **Priya** is right that **Retributive Justice** cannot be satisfied by substitution. If the goal is "the guilty must suffer," substitution fails. She is also right that Jonah's examples (hockey, tickets) aren't true criminal punishment.
  2.  **Jonah** is right that **Consent** doesn't negate punishment (we punish unrepentant criminals), and he is right that our society *does* value vicarious sacrifice in non-legal contexts (soldiers dying for country, parents for children).
  3.  **Both are missing Lewis's Point:** Lewis isn't asking if substitution is "possible." He is pointing out that **we hold two conflicting theories of punishment simultaneously.**
      *   Theory A: Punishment is a moral debt that must be paid by the debtor (Priya).
      *   Theory B: Punishment is a social harm that just needs to be absorbed to restore balance (Jonah).
      *   Lewis's conclusion is that we reject penal substitution in law not because it is nonsense, but because allowing it would turn the legal system into a marketplace of suffering, destroying its deterrent and retributive power. We keep it in the realm of "supererogatory morality" (saints and heroes) where it belongs, rather than "justice" where it doesn't fit.

  **The Verdict:** Priya wins on **Legal Theory**. Jonah wins on **Moral Intuition**. Lewis wins on **Diagnosis**: The tension exists because we want punishment to be both a moral reckoning *and* a social utility, and substitution satisfies one while breaking the other.
