answer: |-
  **The scenario**
  You are housesitting a smart home during a storm. Through a glitchy security feed, you see the porch floodlight flicker on ($p$). You know the system is wired so that motion triggers the light, but you also know electrical surges during storms can trigger it falsely. You cannot see the porch directly, so whether motion actually occurred ($q$) is unknown. The light's status is epistemically live—you genuinely don't know if it's a surge or a person.

  **Why the indicative works**
  Asserting "If the light is on, someone is outside" is reasonable because you are tracking evidence. In your current information state, the light's illumination is the best available proxy for motion. The indicative conditional respects the actual world's correlations: given what you know now, the light's being on raises the probability of someone being outside to a level warranting assertion. It functions as a diagnostic tool.

  **Why the counterfactual doesn't**
  Asserting "If the light were on, someone would be outside" is false. The counterfactual asks you to imagine a nearby world where the light is on *without* assuming the actual cause. In the closest world where the light turns on via electrical surge (a very small divergence from reality), no one is outside. Because the counterfactual tests causal dependency rather than evidential correlation, it fails; the light does not *cause* the person, nor does it guarantee them metaphysically.

  **What's doing the work**
  The split is generated by **direction of dependence**. The indicative follows the epistemic arrow (effect to cause: light implies motion), while the counterfactual follows the causal arrow (cause to effect: motion implies light). If you surgically remove this asymmetry—making the light and motion bidirectionally necessary—the split vanishes, and both conditionals become assertable. The divergence exists only because evidence flows differently than causation.

  **The pushback**
  A unified semanticist would argue there aren't two beasts, only one logic sensitive to context. They'd claim the counterfactual fails not because of semantics, but because "closeness" requires holding laws of nature fixed. In the counterfactual context, we prioritize causal laws over accidental correlations (the surge possibility), whereas the indicative context prioritizes known facts. The divergence is pragmatic, not grammatical.

  **The reverse direction**
  Building a live-antecedent case where the counterfactual works but the indicative fails is likely impossible, because counterfactual morphology ("were/would") grammatically encodes doubt. To use the counterfactual is to signal the antecedent is unlikely, meaning the "known-false crutch" isn't just a feature of examples—it's baked into the verb forms themselves.
