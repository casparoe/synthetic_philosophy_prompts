answer: |-
  # Midterm Examination: Correlation, Causation, and Paradox
  **Question 3: Simpson's Paradox and Causal Structure (20 Marks)**

  **Context:**
  The fictional University of Aethelgard offers courses in two departments: **Humanities (H)** and **Sciences (S)**. Courses are delivered in two formats: **In-Person (IP)** and **Online (OL)**. The outcome of interest is the **Pass Rate** (proportion of students passing the course).

  The Registrar releases the following end-of-semester data:

  | Department | Format | Students Enrolled | Students Passed | Pass Rate |
  | :--- | :--- | :--- | :--- | :--- |
  | **Humanities (H)** | In-Person | 100 | 80 | 80% |
  | | Online | 20 | 18 | 90% |
  | **Sciences (S)** | In-Person | 20 | 4 | 20% |
  | | Online | 100 | 30 | 30% |
  | **AGGREGATE** | **In-Person** | **120** | **84** | **70%** |
  | | **Online** | **120** | **48** | **40%** |

  **(a) Numerical Verification (2 marks)**
  Briefly demonstrate numerically that Simpson's Paradox is present in this dataset.

  **(b) Scenario 1: Administrative Assignment (9 marks)**
  Suppose that at Aethelgard, students do not choose their format. Instead, the University Registrar **assigns** the format based on the Department (e.g., Labs must be In-Person, Lectures can be Online). Consequently, Department determines Format. However, Department also inherently determines course difficulty (Pass Rate).
  1.  Draw a causal diagram (DAG) representing the relationships between Department ($D$), Format ($F$), and Passing ($P$).
  2.  State which statistic (Aggregate or Disaggregated) correctly identifies the causal effect of Format on Passing.
  3.  Justify your verdict using the terminology of causal paths (e.g., backdoor paths, confounding, blocking).

  **(c) Scenario 2: Student Selection (9 marks)**
  Suppose instead that students **choose** their Format first (selecting an "Online Track" or "In-Person Track"). Due to curriculum constraints, choosing the Online Track restricts students to Science courses, while the In-Person Track is primarily Humanities. Thus, Format determines Departmental enrollment. Department still determines difficulty.
  1.  Draw a causal diagram (DAG) representing the relationships between Department ($D$), Format ($F$), and Passing ($P$).
  2.  State which statistic (Aggregate or Disaggregated) correctly identifies the *total* causal effect of choosing the Online Track versus the In-Person Track.
  3.  Justify your verdict using the terminology of causal paths (e.g., mediation, direct vs. total effect, collider).

  ***

  # Model Answer

  **(a) Numerical Verification**
  Within Humanities, Online (90%) > In-Person (80%). Within Sciences, Online (30%) > In-Person (20%). However, in the Aggregate, In-Person (70%) > Online (40%). The direction of association reverses when data is pooled.

  **(b) Scenario 1: Administrative Assignment**
  1.  **DAG:** $D \rightarrow F$ and $D \rightarrow P$. (There is also an arrow of interest $F \rightarrow P$).
      *   *Visual:* $D$ points to both $F$ and $P$.
  2.  **Verdict:** The **Disaggregated** (Department-specific) rates are causally correct.
  3.  **Justification:** Department ($D$) is a **confounder**. It is a common cause of both the treatment (Format) and the outcome (Passing). This creates a spurious "backdoor path" from $F \leftarrow D \rightarrow P$. To estimate the causal effect of $F$ on $P$, we must block this backdoor path. We do this by **conditioning** on $D$ (stratifying by department). The aggregate rate is biased because it mixes the effect of Format with the inherent difficulty of the Departments.

  **(c) Scenario 2: Student Selection**
  1.  **DAG:** $F \rightarrow D$ and $D \rightarrow P$. (There is also an arrow of interest $F \rightarrow P$).
      *   *Visual:* $F$ points to $D$, which points to $P$.
  2.  **Verdict:** The **Aggregate** rates are causally correct (for the total effect).
  3.  **Justification:** Department ($D$) is a **mediator**. It lies on the causal pathway between Format and Passing ($F \rightarrow D \rightarrow P$). The question asks for the effect of the Format *track*, which includes the downstream consequence of which Department a student ends up in. Conditioning on $D$ would block this indirect path, estimating only the *direct* effect of format holding department constant. To measure the *total* causal effect of assigning a student to a Track, we must **not condition** on the mediator. The aggregate rate captures the full impact of the choice.

  ***

  # Marking Scheme (Total: 20 Marks)

  **Part (a): Numerical Verification (2 Marks)**
  *   **1 mark:** Correctly cites that Online > In-Person within both subgroups (90>80 and 30>20).
  *   **1 mark:** Correctly cites that In-Person > Online in the aggregate (70>40), explicitly noting the reversal.
  *   *Note: No marks for simply stating "Simpson's Paradox exists" without numbers.*

  **Part (b): Scenario 1 - Confounder (9 Marks)**
  *   **DAG (3 marks):**
      *   1 mark: Arrow $D \rightarrow F$ (Dept causes Format assignment).
      *   1 mark: Arrow $D \rightarrow P$ (Dept causes Pass rate/Difficulty).
      *   1 mark: Arrow $F \rightarrow P$ (Treatment effect of interest).
      *   *Deduction:* If arrows are reversed or missing key links.
  *   **Verdict (2 marks):**
      *   2 marks: Explicitly selects **Disaggregated** / Stratified / Department-specific rates.
      *   0 marks: Selects Aggregate.
  *   **Justification (4 marks):**
      *   2 marks: Identifies Department as a **Confounder** (or common cause).
      *   2 marks: Explains that conditioning on $D$ **blocks the backdoor path** ($F \leftarrow D \rightarrow P$) to remove bias.
      *   *Partial:* 1 mark for mentioning "bias" without path terminology.

  **Part (c): Scenario 2 - Mediator (9 Marks)**
  *   **DAG (3 marks):**
      *   1 mark: Arrow $F \rightarrow D$ (Format choice determines Dept).
      *   1 mark: Arrow $D \rightarrow P$ (Dept causes Pass rate/Difficulty).
      *   1 mark: Arrow $F \rightarrow P$ (Treatment effect of interest).
      *   *Deduction:* If arrows imply $D \rightarrow F$ (same as Part b).
  *   **Verdict (2 marks):**
      *   2 marks: Explicitly selects **Aggregate** / Marginal rates.
      *   0 marks: Selects Disaggregated.
  *   **Justification (4 marks):**
      *   2 marks: Identifies Department as a **Mediator** (or intermediate variable).
      *   2 marks: Explains that conditioning on $D$ **blocks the causal path** ($F \rightarrow D \rightarrow P$), thereby hiding the total effect.
      *   *Partial:* 1 mark for mentioning "mechanism" without path terminology.

  **Grading Note for Instructors:**
  *   **Common Mistake:** Strong-but-not-excellent students will often argue that the **Disaggregated** answer is correct for *both* scenarios, citing the "law of sure thing" or the standard Berkeley admissions lesson. Deduct 2 marks from the Part (c) Justification if they claim we must always control for subgroups, as this fails to distinguish between confounding and mediation.

  ***

  **Instructor's Note on Expected Student Error:**
  *Most students will incorrectly assert that the disaggregated data is always the causal truth, failing to recognize that controlling for a mediator (Scenario 2) induces bias by blocking the indirect effect.*
