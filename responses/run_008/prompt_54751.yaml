      *   **Key Learning Objectives:**
          1.  Shock that the obvious plan (Continue, Exit) is unexecutable.
          2.  Discovery that randomized *behavioral* strategies beat pure *mixed* strategies (but still < 4).
          3.  Experience the pull of "interim reasoning" (deviating at the node) vs. planning consistency.
      *   **Specific Challenge:** Students *can* count; the driver *cannot*. The design must enforce "absent-mindedness" artificially.
      *   **Requirements:** Staging, rules, materials, points scheme, timeline, debrief structure, prediction of failure modes, honest limitation analysis.

  2.  **Deconstruct the Problem (Theoretical Check):**
      *   *Pure Strategies:*
          *   Exit at 1st (E, E): Payoff = 1.
          *   Continue at 1st, Exit at 2nd (C, E): Payoff = 4. **(Unreachable due to absent-mindedness constraint)**.
          *   Continue at both (C, C): Payoff = 0.
          *   *Constraint:* Must choose same action at both nodes (information set). So only (E, E) or (C, C) are valid *pure* behavioral strategies.
          *   *Best Pure:* (E, E) -> Payoff 1.
      *   *Mixed/Behavioral Strategies:*
          *   Let $p$ = probability of Continuing.
          *   Probability of reaching Exit 1 = 1.
          *   Probability of reaching Exit 2 = $p$.
          *   Probability of Exiting at 1 = $(1-p)$. Payoff contribution: $1 \cdot (1-p)$.
          *   Probability of Exiting at 2 = $p \cdot (1-p)$. Payoff contribution: $4 \cdot p(1-p)$.
          *   Probability of Passing Both = $p^2$. Payoff contribution: $0$.
          *   Expected Value $EV(p) = (1-p) + 4p(1-p) = 1 - p + 4p - 4p^2 = 1 + 3p - 4p^2$.
          *   Maximize: $dEV/dp = 3 - 8p = 0 \Rightarrow p = 3/8$.
          *   Max EV = $1 + 3(3/8) - 4(9/64) = 1 + 9/8 - 9/16 = 1 + 18/16 - 9/16 = 1 + 9/16 = 25/16 = 1.5625$.
      *   *The Paradox:* At the node, if I believe I'm at Exit 2 with some probability, does exiting look better? This involves belief updating (Piccione & Rubinstein vs. Aumann et al.). The prompt asks to highlight the *pull* of interim reasoning, not necessarily solve the consistency debate fully, but to show the tension.

  3.  **Designing the Activity (The "Black Box" Approach):**
      *   *Problem:* Students know they are students. They know there are two exits. They will count.
      *   *Solution:* The "Driver" must be isolated from the "Road." The Facilitator (Instructor) acts as the Road/Environment. The Student makes a *policy* beforehand, then executes it under conditions where they lose track.
      *   *Wait, the prompt asks for "randomizing at the wheel".* This implies the student makes the decision *in the moment* but without knowing *which* moment it is.
      *   *Mechanism:* Sealed envelopes or a digital interface? Since it's a classroom, physical props are better for "theater."
      *   *The "Absent-Mindedness" Enforcer:* The student cannot know if it's Exit 1 or 2.
          *   *Idea:* The student closes their eyes? No, they need to see the "choice."
          *   *Idea:* The instructor moves them?
          *   *Idea:* **The Envelope Protocol.** The student writes a policy (e.g., "Flip a coin, heads Continue"). Then they enter a "simulation" where the Instructor presents them with a generic "Exit Card" twice, but shuffles the order or hides the count.
          *   *Better Idea:* To truly simulate the *information set*, the student must make the decision *without knowing the stage*.
          *   *Implementation:* The student sits at a desk. The Instructor approaches them with a generic card saying "EXIT OPPORTUNITY." The student says "Exit" or "Continue." If "Continue," the Instructor walks away, circles around, and comes back with the *same* card. If "Exit," the game ends. The student does not know if this is the first or second time the card was presented.
          *   *Crucial Control:* The Instructor must ensure the student doesn't count time or interactions. This is hard.
          *   *Alternative:* **The Pre-Commitment vs. In-Game Tension.**
              *   Round 1: Pure Planning (Write down "Always Exit" or "Always Continue").
