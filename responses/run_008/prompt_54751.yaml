answer: |-
  # Session Plan: The Absent-Minded Driver
  **Course:** Intermediate Decision & Game Theory  
  **Time:** 75 Minutes (60 Activity / 15 Debrief)  
  **Students:** 18 (Philosophy & Economics Mix)  
  **Objective:** To experientially demonstrate the tension between ex-ante planning optimality, behavioral randomization, and interim time-inconsistency in the Piccione-Rubinstein framework.

  ---

  ## I. Materials & Setup
  *   **The "Road":** A clear space at the front of the room. One desk for the "Driver," one for the "Facilitator" (you).
  *   **Blindfolds:** 3 sleep masks (or instruct students to keep eyes tightly closed).
  *   **Decision Cards:** 20 identical index cards. 18 say **"DRIVE"** (blank on back), 2 say **"EXIT"** (numbered secretly on the back: 1 and 2).
  *   **Dice:** 6-sided dice for randomization (one per student pair, or shared).
  *   **Score Sheets:** Pre-printed "Driver's License" sheets (see Payoff Scheme).
  *   **Whiteboard:** For calculating Expected Values (EV) during the debrief.

  ### The Payoff Scheme ("The License")
  To make the points "sting," frame this as a professional certification.
  *   **Starting Balance:** 100 Points.
  *   **Exit 1:** -10 Points (Safe, but mediocre).
  *   **Exit 2:** +20 Points (The Goal).
  *   **Pass Both:** -50 Points (Disaster).
  *   *Note:* The optimal mixed strategy yields an expected gain of ~5.6 points per run. Pure "Always Exit" yields -10. Pure "Always Continue" yields -50.

  ---

  ## II. Timeline & Activity Flow

  ### 00:00 – 00:10: Introduction & The Trap
  1.  **Narrative:** "You are a driver on a dark highway. Two exits. Identical. You are absent-minded: at any exit, you do not know if it is the first or the second. You must adopt a single policy for both."
  2.  **Payoffs:** Write on board: Exit 1 = 1, Exit 2 = 4, Pass = 0.
  3.  **The Obvious Plan:** Ask: "If you could count, what would you do?" (Answer: Continue at 1, Exit at 2).
  4.  **The Constraint:** "You cannot count. You must choose one instruction: 'Always Exit' or 'Always Continue'."
  5.  **Round 1 (Pure Strategies):**
      *   Students write "EXIT" or "CONTINUE" on a slip.
      *   **Simulation:** You (Facilitator) run the road for them. (See *Simulation Protocol* below).
      *   **Result:** Most who chose "CONTINUE" get 0. All who chose "EXIT" get 1.
      *   **The Shock:** No one gets 4. The optimal plan is *inexecutable*.

  ### 00:10 – 00:25: The Math of Randomization
  1.  **The Pivot:** "Since you can't distinguish nodes, you must randomize. Let $p$ be the probability you Continue."
  2.  **Derivation (Board Work):**
      *   Prob(Exit 1) = $(1-p)$. Payoff = $1$.
      *   Prob(Exit 2) = $p(1-p)$. Payoff = $4$.
      *   Prob(Pass) = $p^2$. Payoff = $0$.
      *   $EV = 1(1-p) + 4p(1-p) = 1 + 3p - 4p^2$.
  3.  **Optimization:** Ask students to maximize. $dEV/dp = 3 - 8p = 0 \rightarrow p = 3/8$.
  4.  **Max EV:** $1 + 3(3/8) - 4(9/64) = 25/16 \approx 1.56$.
  5.  **Round 2 (Commitment):** Students commit to a $p$ (e.g., "Roll 1-3 on d6 = Continue"). They write this policy down. You run the simulation using their dice rolls.
  6.  **Outcome:** Scores will vary, but the class average should hover near 1.56. Better than Round 1, but far from 4.

  ### 00:25 – 00:45: The Live Drive (Interim Reasoning)
  *This is the core experience. We attempt to simulate the "view from the node."*

  1.  **Setup:** Select 4 volunteers (one at a time, while others watch/record). The volunteer sits at the Driver Desk, puts on a blindfold.
  2.  **The Protocol (Crucial for "Absent-Mindedness"):**
      *   **Noise:** You walk around the room randomly. Sometimes you tap the desk ("Engine Noise"). Sometimes you place a **"DRIVE"** card in front of them. Sometimes you place an **"EXIT"** card.
      *   **Sequence:** You *must* present exactly two "EXIT" opportunities if they Continue the first time. However, you intersperse them with 0 to 3 "DRIVE" cards randomly.
      *   **Timing:** Vary the time between cards (5 seconds, 30 seconds, 5 seconds).
      *   **Instruction:** "When you feel a card, lift your mask slightly, read it, make your choice, lower mask. Do not count cards. Do not count taps. If you count, your license is revoked."
  3.  **The Temptation:** Before they start, ask them to write down their *Planned $p$*.
      *   *During the drive:* When they hit the first EXIT card, ask: "What is your probability that this is the second exit?" (They will likely say 50% or higher).
      *   Ask: "Does Exiting look better now than it did in your plan?"
      *   Allow them to deviate from their written $p$ if they wish. Record if they deviated.
  4.  **Audience Role:** The rest of the class records the outcome and whether the driver deviated from their stated plan.

  ### 00:45 – 00:60: Data Aggregation & Prep for Debrief
  1.  Compile the results of the 4 volunteers and the previous rounds on the board.
  2.  Calculate the "Cost of Deviation": Compare the Planned EV vs. Actual EV for the volunteers.
  3.  Ask the class to silently reflect on *why* they (or the volunteers) wanted to change their minds at the wheel.

  ### 00:60 – 00:75: The Debrief (Mapping Experience to Theory)
  *Do not lecture. Draw out the distinctions from the room's events.*

  1.  **The Information Set (15 mins in):**
      *   *Ask:* "Why couldn't we just play (Continue, Exit)?"
      *   *Point:* Map the "Identical Cards" to the **Information Set**. The nodes are in the same set; therefore, the strategy must be the same. The "Obvious Plan" requires splitting the information set, which is cheating.
  2.  **Mixed vs. Behavioral (15 mins in):**
      *   *Ask:* "Why did randomizing at the wheel (Round 2) beat Always Exit (Round 1)?"
      *   *Point:* Distinguish **Mixed Strategies** (randomizing over plans ex-ante) vs. **Behavioral Strategies** (randomizing at the node). In this game, they coincide mathematically, but the *experience* was different. The 1.56 EV is the ceiling of rational agency under amnesia.
  3.  **The Interim Pull (15 mins in):**
      *   *Ask:* "When you were blindfolded and felt the card, did Exiting feel more attractive than it did when you were planning?"
      *   *Point:* This is **Time Inconsistency**. At the planning stage, Exit 2 is worth 4. At the node, you reason: "If I'm here, I might be at Exit 2. If I Exit now, I get at least 1. If I Continue, I might get 0."
      *   *The Paradox:* If you reason this way, you Exit. If everyone Exits, you never reach Exit 2. Your interim reasoning undermines your planning success. This is the heart of Piccione-Rubinstein: the conflict between the *planner self* and the *actor self*.
  4.  **The "Two Agents" (Final 5 mins):**
      *   Conclude that the absent-minded driver is effectively two agents who cannot communicate. The first agent (Exit 1) wants to pass the buck. The second agent (Exit 2) wants to cash out. The policy is the treaty between them.

  ---

  ## III. Predictable Failure Modes & Mitigations

  | Failure Mode | Prediction | Mitigation Strategy |
  | :--- | :--- | :--- |
  | **Counting** | Students will count the "taps" or "cards" to deduce if it's Exit 2. | **The Decoy Protocol:** You must insert random "DRIVE" cards and variable silence. If a student says "This is the second card," stop immediately. Disqualify that run. Tell them: "The road is infinite; only I know where the exits are." |
  | **Collusion** | Students in the audience will signal the driver (coughing, tapping). | **Isolation:** Run the volunteers one by one. Audience must be silent. If signaling is suspected, invalidate the run and deduct "License Points" from the whole class (creates peer policing). |
  | **Skepticism** | "This is fake. I know I'm at Exit 1 because you haven't let me exit yet." | **Acknowledge & Pivot:** "You are right. You are not truly absent-minded. You are *pretending* to be. The game is not about your amnesia; it's about whether you can bind yourself to a policy that *requires* amnesia to work. If you break the fiction, you break the math." |
  | **Math Freeze** | Students struggle to maximize $1 + 3p - 4p^2$ quickly. | **Scaffold:** Have the function pre-printed on the Score Sheet. Ask them to just test $p=0, p=0.5, p=1$ first to see the curve, then solve. |

  ---

  ## IV. Honest Limitations (For Your Eyes Only)

  You asked for frankness about what this staging *cannot* do. You must address this in the debrief to maintain intellectual integrity.

  1.  **The Fiat of Amnesia:**
      *   *Reality:* In the classroom, the "absent-mindedness" is a rule enforced by you, not a cognitive state experienced by them. They *know* there are two exits.
      *   *Consequence:* They are not experiencing true *uncertainty about location*; they are experiencing *uncertainty about your simulation*.
      *   *Debrief Fix:* Explicitly state: "We could not give you amnesia. We gave you a **contract of ignorance**. The theoretical problem assumes the driver *literally cannot tell*. We simulated this by punishing you for looking. The tension you felt was the tension of *obeying a rule* vs. *maximizing immediate gain*, which is an analogue to the theoretical tension, but not identical."

  2.  **Belief Updating:**
      *   *Reality:* In the formal problem, the probability of being at Exit 2 depends on your strategy $p$ (because if $p$ is high, you are more likely to reach Exit 2). In the classroom, the probability is fixed by *your* setup.
      *   *Consequence:* Students cannot genuinely update their beliefs based on their own policy.
      *   *Debrief Fix:* "In the real problem, your belief 'I am likely at Exit 2' is caused by your own decision to Continue. Here, I dictated the frequency. The 'pull' you felt was emotional, not Bayesian. But that emotional pull is why the paradox matters—it feels rational to deviate, even when it isn't."

  3.  **The "Single Agent" Illusion:**
      *   *Reality:* The problem treats the driver as one agent with a consistency constraint.
      *   *Consequence:* In class, the "Planner" (writing the card) and the "Driver" (blindfolded) felt like two different people.
      *   *Debrief Fix:* "You felt like two people. That is the point. Game theory often assumes one agent. The Absent-Minded Driver shows that when memory fails, one agent fragments into a sequence of agents who must trust each other."

  ---

  ## V. Instructor Script Snippets (Key Moments)

  **The Shock (Minute 10):**
  > "Look at your scores. Those of you who planned to 'Continue then Exit'... you have zero. Why? Because you couldn't execute the 'Then'. You only had 'Always'. The highway stole your memory, and with it, your best payoff."

  **The Temptation (Minute 35 - to Volunteer):**
  > "Keep your eyes closed. You feel the card. It says EXIT. You planned to Continue 3/8ths of the time. But think: If this is the second exit, and you Continue, you get nothing. If you Exit, you get 4. Even if there's a 50% chance this is the second exit, doesn't Exiting look safer than your plan?"

  **The Closing (Minute 70):**
  > "We spent an hour trying to get 4 points. The math says the best we can ever do is 1.56. That is the tax on absent-mindedness. Rationality cannot recover what memory has lost. The only way to get the 4 is to be the kind of agent who can distinguish the nodes. Since you can't, your only job is to stop your future self from sabotaging your past self."
