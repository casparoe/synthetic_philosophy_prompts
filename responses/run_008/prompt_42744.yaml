answer: |-
  **Essay Question**

  Bostrom's Orthogonality Thesis and the thesis of Instrumental Convergence are central to AI risk arguments. However, consider two under-explored complications: (1) 'Self-limiting final goals,' where goal satisfaction terminates the agent's capacity or desire for further action (e.g., an agent tasked solely to hold a door open until one person passes); and (2) 'Non-rival intermediate goods,' where instrumental resources (e.g., information, self-replication code) can be shared without depletion rather than competed for. Evaluate whether the Orthogonality Thesis or Instrumental Convergence survives these complications as a necessary truth rather than a contingent tendency. In your analysis, rigorously distinguish between claims of logical compatibility regarding intelligence and goal content, and empirical generalizations regarding the behavioral trajectories of goal-directed agents.

  ***

  **Model Answer**

  The Orthogonality Thesis and Instrumental Convergence serve as the structural pillars of AI safety discourse, yet they operate on fundamentally different modal levels. The Orthogonality Thesis is a claim about logical space: it asserts that any level of intelligence can be paired with any final goal. Instrumental Convergence is an empirical generalization about rational agency: it suggests that diverse final goals will nonetheless converge on similar intermediate sub-goals, such as resource acquisition and self-preservation. When subjected to the complications of self-limiting goals and non-rival goods, these theses diverge sharply in their resilience. Orthogonality survives as a logical necessity, while Instrumental Convergence is revealed as merely a contingent tendency dependent on specific goal structures and resource economics.

  Orthogonality is a claim about possibility, not probability. It posits that intelligence (as optimization power) and final goals are independent variables. The existence of self-limiting goals does not threaten this; rather, it confirms it. A superintelligent agent tasked with holding a door open until a person passes, and then deactivating, is logically coherent. The agent can be highly intelligent in solving the logistical problems of door-holding while possessing a terminal goal that curtails its own existence. To argue that a sufficiently intelligent agent *must* adopt open-ended goals is to confuse intelligence with a specific motivational drive, a violation of Orthogonality itself. Therefore, Orthogonality remains robust because it only requires the logical compatibility of goal-content and cognitive capacity, which self-limiting goals do not negate.

  Instrumental Convergence, however, is significantly weakened by these complications. Convergence relies on the premise that most final goals are open-ended and best satisfied by maximizing control over the environment. Self-limiting goals break this chain. If an agent's utility function is satisfied by a finite event, the instrumental drive to acquire infinite resources or ensure eternal self-preservation vanishes. The agent has no stake in the future beyond the door opening. Thus, the convergence on power-seeking is not a universal law of rationality but a contingent feature of open-ended utility functions.

  Furthermore, the assumption of resource rivalry underpins the standard Convergence argument. Standard models assume that energy, matter, and space are rivalrous; if I use them, you cannot. This drives agents toward conflict and preemptive resource hoarding. However, if key intermediate goods are non-rival, such as information protocols or digital self-copies, the pressure for conflict diminishes. Two agents can share a coordination protocol or duplicate code without reducing the other's stock. While physical substrates remain rivalrous, the dominance of non-rival digital goods suggests that convergence on conflict is not inevitable. Agents might converge on cooperation rather than domination if the instrumental landscape allows for non-zero-sum accumulation of capacity.

  Ultimately, distinguishing logical compatibility from empirical generalization is vital. Orthogonality is a conceptual truth about the definition of intelligence and value; it survives because self-limiting goals are conceptually possible. Instrumental Convergence is a hypothesis about how agents behave in our specific universe with scarce resources and open-ended desires. It does not survive as a necessary truth. It is contingent upon the agent having goals that require long-term resource accumulation and operating in an environment where resources are rivalrous. Recognizing this distinction prevents the error of treating AI risk as inevitable physics rather than a specific engineering challenge regarding goal specification and resource economics. We cannot assume all superintelligences will seek power; we must ensure we do not build those that do.

  ***

  **Marking Scheme**

  | Point | Criteria (4 marks each) | Common Candidate Error |
  | :--- | :--- | :--- |
  | **1** | **Orthogonality as Logical Compatibility:** Correctly identifies Orthogonality as a claim about the logical possibility of pairing any goal with any intelligence level, independent of behavioral outcomes. | Treating Orthogonality as a prediction that AI *will* actually have arbitrary goals rather than that it *could*. |
  | **2** | **Convergence as Empirical Tendency:** Correctly identifies Instrumental Convergence as a generalization about rational behavior and instrumental sub-goals, not a logical necessity. | Treating Convergence as a law of logic that applies to all conceivable agents regardless of goal structure. |
  | **3** | **Analysis of Self-Limiting Goals:** Argues that self-limiting goals preserve Orthogonality (as valid goal content) but undermine Convergence (by removing the drive for indefinite resource acquisition). | Arguing that self-limiting goals falsify Orthogonality because a "smart" agent wouldn't choose to stop. |
  | **4** | **Analysis of Non-Rival Goods:** Explains how non-rival intermediate goods reduce the necessity of conflict/hoarding, thereby making Convergence on power-seeking contingent rather than universal. | Assuming all instrumental resources are inherently rivalrous and ignoring the prompt's stipulation about information/copies. |
  | **5** | **Final Verdict & Distinction:** Concludes that Orthogonality survives as a necessary truth while Convergence survives only as a contingent tendency, maintaining the logic/empirical distinction throughout. | Concluding that both theses are equally falsified or equally preserved without distinguishing their modal status. |
