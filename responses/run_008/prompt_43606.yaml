answer: |-
  **Mark: 6 / 10**

  Here is the point-by-point breakdown. I have weighted the sections as follows: Part (a) 3 points, Part (b) 4 points, Part (c) 3 points.

  ### Part (a): Nash Bargaining Solution (3 / 3 points)
  *   **Correct:** You correctly identified the Pareto frontier as the line segment connecting $(10, 0)$ and $(4, 6)$ with the equation $u_1 + u_2 = 10$.
  *   **Correct:** Your maximization of the Nash product $u_1(10 - u_1)$ is accurate. The critical point $u_1 = 5$ lies within the feasible range $[4, 10]$.
  *   **Correct:** Your check of the other boundary (the segment from $(0,0)$ to $(4,6)$) is excellent due diligence. Confirming that the product there (max 24) is lower than on the Pareto frontier (25) ensures you have the global maximum.
  *   **Result:** $(5, 5)$ is correct. Full marks.

  ### Part (b): Kalai–Smorodinsky Solution (1 / 4 points)
  *   **Incorrect Definition:** You defined the Kalai–Smorodinsky (KS) solution as the point where players receive "equal gains over the disagreement point" ($u_1 = u_2$). This is the definition of the **Egalitarian Solution**.
      *   *Note:* The prompt explicitly reminded you of the KS definition: "same **fraction** of that player's **maximum feasible gain**."
  *   **Incorrect Calculation:** Because the definition was wrong, the calculation followed the wrong ray.
      *   **Correct Computation:**
          1.  Find the **Ideal Point** $(a_1, a_2)$, where $a_i$ is the maximum feasible utility for player $i$ in $S$.
              *   $a_1 = \max \{u_1\} = 10$ (at vertex $(10,0)$).
              *   $a_2 = \max \{u_2\} = 6$ (at vertex $(4,6)$).
              *   Ideal point $a = (10, 6)$.
          2.  The KS solution lies on the line connecting $d=(0,0)$ to $a=(10,6)$. The slope is $6/10 = 0.6$.
              *   Equation: $u_2 = 0.6 u_1$.
          3.  Intersect this ray with the Pareto Frontier ($u_1 + u_2 = 10$):
              *   $u_1 + 0.6 u_1 = 10$
              *   $1.6 u_1 = 10 \implies u_1 = 6.25$
              *   $u_2 = 10 - 6.25 = 3.75$
      *   **Correct Answer:** $(6.25, 3.75)$.
  *   **Partial Credit:** You receive 1 point for correctly identifying that the solution must lie on the Pareto frontier you derived in part (a).

  ### Part (c): Axioms (2 / 3 points)
  *   **Correct:** You correctly identified that KS gives up **Independence of Irrelevant Alternatives (IIA)**.
  *   **Correct:** You correctly identified that KS satisfies **Individual Monotonicity** in its place.
  *   **Incorrect:** Your statement regarding invariance is false. You wrote: *"unlike the Nash solution, the KS solution is not invariant to changes in utility units."*
      *   **Correction:** The Kalai–Smorodinsky solution **is** invariant to affine transformations (changes in utility units and zero points).
      *   **Reasoning:** The solution depends on the ratio $\frac{u_i - d_i}{a_i - d_i}$. If utilities are transformed linearly ($u'_i = \alpha u_i + \beta$ with $\alpha > 0$), both the numerator (gain) and the denominator (max gain) are scaled by $\alpha$ and shifted by $\beta$. The $\alpha$ cancels out in the fraction, and the $\beta$ cancels out in the subtraction. The ratio remains unchanged.
  *   **Deduction:** -1 point for the incorrect claim about invariance.

  ---

  ### Comments for the Exam Paper
  *(You can copy/paste this section directly onto their script)*

  **(a) 3/3:** Perfect. Your derivation of the frontier and the check of the non-efficient boundary are rigorous.

  **(b) 1/4:** You solved for the Egalitarian solution ($u_1=u_2$), not Kalai–Smorodinsky. KS requires equal *fractions* of the *maximum feasible gain* (the ideal point).
  *   Ideal Point: $a = (10, 6)$.
  *   KS Ray: $u_2 = \frac{6}{10}u_1 = 0.6u_1$.
  *   Intersection with $u_1+u_2=10$: $1.6u_1=10 \Rightarrow (6.25, 3.75)$.

  **(c) 2/3:** Correct on IIA vs. Individual Monotonicity. However, KS **is** invariant to affine transformations. The ratio $\frac{u_i - d_i}{a_i - d_i}$ is unit-free because scaling $u_i$ scales both the gain and the max gain equally.

  **Total: 6/10**
