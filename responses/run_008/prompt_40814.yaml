answer: |-
  Thanks for sending this over, and I appreciate the chance to think through this before you step into the seminar. You are right to worry that the annual fight dissolves into talking past one another, because the term transcendental argument covers a multitude of sins, and the definition of refutation is often shifted mid-debate to save face. I took your request seriously and spent some time this morning trying to name the strongest candidate argument before assigning any numbers, and I have to admit that this exercise alone exerted a downward pressure on my confidence. When I look for a specific argument that moves from the undeniable fact of experience to the truth of mind-independent objects without smuggling in a verificationist premise or collapsing into inference to the best explanation, the list is painfully short. Putnam's brain-in-a-vat argument is the most famous contemporary contender, but it relies on semantic externalism that the skeptic can reject without incoherence, and it often concludes that the skeptical hypothesis is meaningless rather than false, which clashes with your requirement that the hypothesis be substantive. Kant's Refutation of Idealism is the classic historical attempt, but as you noted, it runs straight into the Stroud objection. Davidson's triangulation argument is perhaps the most robust modern attempt, but it often looks more like a condition for content than a proof of an external world, and again, it risks dissolving the skeptical hypothesis rather than refuting it. The fact that I struggle to name a single uncontested candidate that meets your strict criteria suggests my overall credence should be quite modest.

  If we break this down using your four components, I see the probabilities stacking up in a way that makes success unlikely. For component (a), the probability that there is a genuine presupposition relation running from undeniable experience to mind-independent objects rather than just to our conceptual scheme, I would assign a credence of about 0.5. We can arguably show that experience requires a framework, but leaping from a framework to mind-independent reality is where the realism battle is fought, and many idealists or phenomenologists deny that step without incoherence. For component (b), which you rightly identify as the biggest question mark, I have to be even more conservative. This is the probability that an argument can cross Stroud's gap between what we must believe and what is actually true. Unless one accepts a verificationist principle that equates truth with warrant assertibility, this gap seems unbridgeable by pure argumentation. Since your substantive skeptic rejects verificationism by definition, I put the probability of bridging this gap without begging the question at around 0.3. For component (c), the probability that the skeptic's position is a determinate thesis capable of being false, I am more optimistic, perhaps 0.8. While skeptics are slippery, the hypothesis that there are no mind-independent objects is a coherent proposition with a truth value, even if it is false. Finally, for component (d), the probability that establishing warrant counts as a genuine refutation given your strict definition, I have to assign a low number, maybe 0.4, because most successful transcendental arguments only secure the rationality of belief rather than the falsity of the skeptical hypothesis, and your definition explicitly rules out mere warrant as a refutation.

  Since I view these conditions as largely conjunctive for the specific goal you outlined, meaning all four need to hold for the argument to succeed as defined, the multiplicative combination of these probabilities drags the number down significantly. However, recognizing that these factors are not perfectly independent and that philosophical breakthroughs can shift the landscape, I am not simply multiplying them out to a negligible fraction. Instead, I am treating them as updating factors on a baseline skepticism about metaphysical proofs. Taking the difficulty of bridging the Stroud gap as the dominant constraint, my overall credence that at least one transcendental argument, properly reconstructed, genuinely refutes a substantive version of external-world skepticism is approximately 0.12. This number reflects the intuition that while the arguments are ingenious, they ultimately fail to force the realist conclusion upon a skeptic who is willing to deny the verificationist premises required to close the gap between belief and truth.

  Regarding your two senior colleagues, I think the disagreement lives primarily in component (b), though it is fueled by the reduction claim your second colleague raises. The colleague who sits around 0.6 believes the Stroud gap is bridgeable because the skeptic self-undermines, which is essentially a claim that the probability of component (b) is much higher than I estimate, perhaps because they think the skeptic cannot coherently state their thesis without presupposing its falsity. This is a strong claim, but it relies on a specific diagnosis of incoherence that many find unpersuasive. The colleague at 0.15 thinks transcendental arguments are dressed-up abduction, which is a challenge to the very nature of the inference, suggesting that even if the argument works, it is not transcendental in the necessary sense but merely empirical. While this reduction claim is important, I think the core divergence is actually over whether the Stroud gap can be closed without question-begging. If your first colleague is right that the skeptic self-undermines, then the gap closes automatically, and the argument succeeds. If your second colleague is right that the gap remains open and the argument is just abduction, then it fails to meet the necessity condition required for a transcendental refutation. I suspect the first colleague is overestimating the self-undermining nature of skepticism, while the second colleague is correctly identifying that without a verificationist bridge, the argument loses its transcendental force. So if you want to mediate the seminar, I would focus the discussion on whether the skeptic really is self-undermining or merely stubborn, because that is where the probability mass is actually disputed.
