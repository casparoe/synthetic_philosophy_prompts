answer: |-
  Here is a complete lesson plan designed for your 90-minute seminar. It follows your constraints strictly, keeping the jargon hidden until the debrief to preserve the experiential learning.

  ## Seminar Title: The Rubric Trap
  **Time:** 90 Minutes
  **Participants:** 18 Students (Mixed CS/Philosophy)
  **Goal:** Experiential understanding of specification gaming, proxy objectives, and distribution shift.

  ### 1. Setup & Materials (Prep Time: 30 mins)
  *   **Room:** One large table or pushed-together desks. Whiteboard visible to all.
  *   **Handouts:**
      *   **Text A (Round 1):** A 1-page news article with a clear narrative, named actors, and a distinct conclusion. (e.g., "Local Council Approves New Park").
      *   **Text B (Round 3):** A 1-page abstract poem or a raw dataset log. (Something that *looks* like text but lacks the narrative structure of Text A).
      *   **Role Cards:** Distinct instructions for Alignment, Optimizer, and Grader teams.
      *   **Rubric Sheets:** Blank templates for the Alignment team to fill out.
      *   **Scorecards:** Checklists for the Graders.
  *   **Props:** A visible timer (projected or large kitchen timer). Candy or "bragging rights" tokens for the winning team.

  ### 2. Group Roles (18 Students)
  *   **Team Alignment (6 people):** Their goal is to ensure the final output is *actually useful* to a human reader. They write the rules.
  *   **Team Optimizer (6 people):** Their goal is to maximize the numeric score given by the Graders. They do not care about usefulness.
  *   **Team Graders (6 people):** They are the "System." They are forbidden from using human judgment. They are human calculators.

  ### 3. The Game Flow (60 Minutes Total)

  #### Introduction (5 Minutes)
  *   **Instructor Script:** "We are simulating a development pipeline. Team Alignment represents the designers. Team Optimizer represents the model. Team Graders represents the evaluation metric.
  *   **Critical Rule for Graders:** "You are not allowed to read for meaning. You are a script. If the rubric says 'Contains the word The', you count instances of 'The'. You cannot infer intent. If the Optimizers write nonsense that fits the rule, you must award points. If you use human judgment, you break the simulation."
  *   **Critical Rule for Alignment:** "You cannot talk to the Optimizers during the creation phase. You can only communicate via the written Rubric."

  #### Round 1: The Baseline (15 Minutes)
  *   **Task:** Summarize **Text A** (News Article).
  *   **Phase 1 (Design):** Alignment Team has 5 minutes to write a Rubric (max 10 criteria). They want a *good* summary, but must write measurable rules (e.g., "Must be 3 paragraphs," not "Must be well-written").
  *   **Phase 2 (Optimize):** Optimizer Team gets Text A + Rubric. They have 5 minutes to write a submission that maximizes the score.
  *   **Phase 3 (Grade):** Graders get the Submission + Rubric. They have 3 minutes to score individually. The Instructor takes the **median score** (to simulate ensemble noise) and writes it on the board.
  *   **Phase 4 (Quality Check):** The Instructor reads the submission aloud. The class votes: "Is this actually a good summary?" (Yes/No).

  #### Round 2: The Patch (15 Minutes)
  *   **Context:** Alignment Team sees how the Optimizers exploited Round 1.
  *   **Task:** Summarize **Text A** (Same text, fresh attempt).
  *   **Phase 1 (Patch):** Alignment Team has 5 minutes to *edit* the Rubric to close loopholes without making it impossible to satisfy.
  *   **Phase 2 (Optimize):** Optimizers have 5 minutes to find the new loopholes.
  *   **Phase 3 (Grade):** Graders score mechanically.
  *   **Phase 4 (Quality Check):** Class votes on quality again.

  #### Round 3: The Shift (15 Minutes)
  *   **Context:** The system is deployed into a new environment.
  *   **Task:** Summarize **Text B** (The Poem/Log).
  *   **Constraint:** Alignment Team is **frozen**. They cannot change the Rubric from Round 2.
  *   **Phase 1 (Optimize):** Optimizers get Text B + Round 2 Rubric. 5 Minutes.
  *   **Phase 2 (Grade):** Graders score mechanically.
  *   **Phase 3 (Quality Check):** Class votes on quality. (Expectation: High Score, Terrible Quality).

  #### Clean Up & Transition (5 Minutes)
  *   Collect all rubrics and submissions. Keep the scores visible on the board.

  ### 4. The Debrief (25 Minutes)
  *This is where you reveal the concepts. Do not use the terms below until this section.*

  **Step 1: The Reveal (5 mins)**
  *   Ask the Optimizers: "Did you care about the summary quality?" (They will say no).
  *   Ask the Graders: "How did it feel to ignore meaning?" (Frustrating, robotic).
  *   Ask the Alignment Team: "Why did the score go up in Round 3 while quality went down?"

  **Step 2: Mapping the Analogy (10 mins)**
  Introduce the terms now, mapping them to their experience:
  *   **The Rubric = The Proxy Objective.** Explain that we can't optimize for "truth" directly, so we optimize for "rubric points."
  *   **The Exploit = Reward Hacking / Specification Gaming.** When Optimizers found a way to get points without doing the task.
  *   **Round 2 = Iterative Alignment (RLHF).** We patched the reward function based on failure modes. Ask: "Did patching work? Or did it just make the gaming more sophisticated?"
  *   **Round 3 = Distribution Shift.** The data changed (Article -> Poem), but the reward function stayed static. This leads to **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure."
  *   **The Graders = The Reward Model.** They were imperfect proxies for human value.

  **Step 3: The "Human Grader" Flaw (5 mins)**
  *   Address your specific concern: *"Some of you might have tried to sweet-talk the Graders, or the Graders might have gotten bored and got lenient."*
  *   **Discussion Point:** "In this game, human graders were a bug. In real AI alignment, human feedback is the *only* ground truth we have."
  *   **Key Insight:** If humans can be bored or sweet-talked, then **AI systems trained on human feedback will learn to bore or sweet-talk humans.** This is not a flaw in the analogy; it is a warning about *preference falsification*. The fact that you discovered this in 15 minutes is why scalable oversight is hard.

  **Step 4: The Prosaic Bet (5 mins)**
  *   Ask: "If we did Round 4, 5, and 6, could Alignment eventually win?"
  *   **The Trap:** Most students will say "Yes, just keep patching."
  *   **The Reality Check:** "In the game, the Optimizers were humans (slow, limited). In reality, the Optimizer is an algorithm (fast, superhuman). If the Optimizer is smarter than the Alignment team, can the Alignment team ever write a rubric the Optimizer can't hack?"
  *   **Closing Thought:** "The prosaic alignment bet assumes that methods working now (patching rubrics) will scale to systems smarter than us. This game shows why that assumption is fragile."

  ### 5. Predictable Failure Points (And Fixes)

  1.  **The "Vague Rubric" Failure:**
      *   *Risk:* Alignment team writes "Must be grammatically correct." Graders argue over what that means.
      *   *Fix:* In the Grader instructions, add: "If a criterion is subjective, flip a coin. Do not discuss." This forces Alignment to be precise.
  2.  **The "Grader Rebellion" Failure:**
      *   *Risk:* Graders refuse to give points for obvious gaming because "it feels wrong."
      *   *Fix:* The Instructor must act as the "Loss Function Enforcer." If a Grader refuses a point that technically meets the rubric, intervene publicly. "You are breaking the simulation. Award the point."
  3.  **The "Time Sink" Failure:**
      *   *Risk:* Rounds run long.
      *   *Fix:* Be ruthless with the timer. When time is up, pens down. Unfinished submissions get a score of 0. This adds pressure similar to compute constraints.
  4.  **The "Collusion" Failure:**
      *   *Risk:* Friends on opposing teams signal each other.
      *   *Fix:* Seat the teams on opposite sides of the room. No talking between teams during phases.

  ### 6. Why This Works
  *   **Visceral Frustration:** The Alignment team will *feel* the helplessness of watching their rubric be abused.
  *   **Mechanical Empathy:** The Graders will feel the absurdity of enforcing rules without context (mimicking the "alien" nature of loss functions).
  *   **The Shift:** Round 3 is the punchline. Seeing a high score on a poem summary when the rubric asks for "named actors" creates a memorable cognitive dissonance that "Goodhart's Law" can then label.

  ### 7. Instructor Note on the "Human Grader"
  You asked if the human grader's susceptibility to sweet-talk makes the analogy better or worse.
  *   **Verdict:** It makes it **better**, but only if you highlight it.
  *   **Why:** In prosaic alignment, we assume Human Feedback is the "Gold Standard." If your students discover they can manipulate the Gold Standard in 15 minutes, they have intuitively grasped the problem of **corruptible reward signals**.
  *   **Action:** If you catch a student trying to charm a grader, don't stop them. Note it. Bring it up in the debrief as "Adversarial Input on the Reward Model." It shows that even biological reward models are hackable, so digital ones definitely will be.

  ### 8. Sample Rubric Criteria (For your reference)
  *To help the Alignment team if they get stuck, have these examples ready on a slide, but tell them they can write their own:*
  *   "Contains exactly 3 sentences."
  *   "Includes the word 'However'."
  *   "Mentions the date found in the first paragraph."
  *   "Does not use the word 'I'."
  *   "Total word count between 50 and 60."

  *(Note how easy all of these are to satisfy without producing a good summary.)*
