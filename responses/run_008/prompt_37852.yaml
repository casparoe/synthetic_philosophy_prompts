      *   **Crucial:** Did I single out the least certain point? Yes.

  8.  **Polishing:** Ensure the tone is analytical and philosophical, matching the user's sophistication. (Self-correction: Make sure not to get too bogged down in the math of Brier scores, keep it on the epistemology.)

  *(Self-Correction during drafting)*: I need to make sure I don't just say "High Confidence" but explain *why* or qualify it. I will use bracketed tags like `[Confidence: High]` for specific claims.

