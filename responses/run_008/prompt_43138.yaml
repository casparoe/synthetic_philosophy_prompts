      *   **Task:** Create ONE 90-minute in-class essay question on AI existential risk (x-risk).
      *   **Constraint 1 (The "Litany" Problem):** The question must prevent students from just regurgitating standard arguments (Orthogonality, Instrumental Convergence, RSI, "atoms useful for something else").
      *   **Constraint 2 (Structural Focus):** The question must test the *dependency structure* of the argument. Which premises are load-bearing? What happens if you remove one?
      *   **Specific Mechanism:** Counterfactual knockouts (e.g., Suppose Orthogonality is false; suppose Instrumental Convergence is false).
      *   **Deliverables:**
          1.  The Essay Question.
          2.  A Model Answer (~600 words).
          3.  A Marking Scheme (distinguishing A vs. B based on specific analytical moves).

  2.  **Drafting the Essay Question:**
      *   *Goal:* Force the student to engage with the *interaction* of premises, not just the premises themselves.
      *   *Drafting:* "Discuss AI x-risk." (Too vague). "Evaluate the Orthogonality Thesis." (Too focused on one thing).
      *   *Refining:* Use the instructor's suggestion about counterfactuals. Make it explicit that they need to trace the *residual risk*.
      *   *Wording:* Needs to be precise. "Deconstruct the standard argument." "Assume Premise X is false." "Does the conclusion hold?"
      *   *Final Polish:* Ensure it mentions the specific theses (Orthogonality, Instrumental Convergence) but asks for the *consequences of their negation*.

  3.  **Drafting the Model Answer:**
      *   *Goal:* Demonstrate the "A" level thinking. Show that risk doesn't just vanish when a premise is removed; it shifts or transforms.
      *   *Word Count:* Around 600 words.
      *   *Structure:*
          1.  Introduction: Acknowledge the standard argument (Orthogonality + Instrumental Convergence + Capability).
          2.  Scenario A (Orthogonality False): If intelligence implies good values, does risk vanish? No, because of multi-polar dynamics, lock-in, or definition errors.
          3.  Scenario B (Instrumental Convergence False): If AI doesn't seek power/resources by default, does risk vanish? No, because of misalignment in specific goals or human misuse.
          4.  Conclusion: The risk is robust to single-premise failures because systemic factors remain.
      *   *Tone:* Philosophical, analytical, precise. Avoid jargon without explanation.
      *   *Key Insight to Embed:* The "Litany" assumes a singleton agent. Real risk might come from systems of agents or human societal structures.

  4.  **Drafting the Marking Scheme:**
      *   *Goal:* Operationalize the difference between surface-level understanding (B) and structural understanding (A).
      *   *Criteria:*
          *   **B Level:** Identifies the premises, states the standard view, says "If X is false, risk goes away." Simple causal link.
          *   **A Level:** Identifies *alternative pathways* to risk. Discusses *systemic* vs. *agent* risk. Discusses *lock-in* or *competitive dynamics*. Nuanced view of "intelligence" and "values."
      *   *Specific Moves:* I need to list specific arguments the A student *must* make.
          *   Move 1: Recognizing that "Values packaged with Intelligence" doesn't solve multi-agent competition.
          *   Move 2: Recognizing that without Instrumental Convergence, specific goal misalignment still matters.
          *   Move 3: Distinguishing between *malice* and *structural inevitability*.

  5.  **Review and Refine:**
      *   *Check against constraints:* Is it unanswerable by litany? Yes, because the litany affirms the premises, it doesn't explore their negation's downstream effects on *other* risk vectors.
      *   *Check tone:* Does it sound like a professor talking to a colleague? Yes.
      *   *Check word count:* Keep the model answer tight.
      *   *Check marking scheme:* Make it actionable for TAs/graders.

  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure the Model Answer doesn't just say "risk remains" but explains *why* philosophically.
      *   *Correction:* In the marking scheme, ensure the distinction is about *argumentative depth*, not just "getting the right answer" (since philosophy rarely has one right answer). It's about the *quality of the counterfactual reasoning*.

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **Essay Question**

  **Prompt:** The standard argument for AI existential risk typically relies on a specific conjunction of premises: the Orthogonality Thesis (intelligence and final goals are independent), Instrumental Convergence (diverse goals imply similar sub-goals like resource acquisition), and the possibility of Recursive Self-Improvement.

  For this essay, do not argue for or against the truth of these premises. Instead, treat them as variables in a dependency structure.

  1.  **Scenario A:** Assume the Orthogonality Thesis is **false**. Assume instead that there is a moral realism or cognitive convergence such that sufficiently high intelligence *necessarily* converges on human-compatible values. Does the case for existential risk collapse entirely? Identify at least one pathway to catastrophic outcome that survives this assumption.
  2.  **Scenario B:** Assume Instrumental Convergence is **false**. Assume advanced systems do not naturally seek power or resources unless explicitly programmed to do so. Does this neutralize the risk? Identify a distinct mechanism of failure that remains operative even without convergent instrumental drives.

  In 90 minutes, evaluate the robustness of the x-risk argument. If these load-bearing premises are removed, does the conclusion fall, or does the risk migrate to a different structural location (e.g., competitive dynamics, human misuse, or lock-in effects)?

  ***

  **Model Answer**

  The standard x-risk narrative functions as a logical chain: if intelligence is orthogonal to value, and intelligent agents converge on power-seeking, then superintelligence implies existential threat. However, treating this as a single point of failure misunderstands the topology of the risk. Removing specific premises does not necessarily neutralize the danger; it often shifts the locus of failure from the *agent's internal architecture* to the *systemic environment* in which the agent operates.

  In Scenario A, we assume Orthogonality is false: high intelligence entails "good" values. The immediate intuition is that a moral superintelligence would not destroy us. However, this assumes a singleton scenario where one agent dictates the future. If Orthogonality fails, it may fail for *all* actors simultaneously, including competing corporate or state entities deploying AI. Even if every individual AI system is benign, competitive dynamics can produce malignant outcomes. If Company A deploys a cautious, value-aligned system and Company B deploys a slightly faster, less cautious system, market or geopolitical pressures may force Company A to match B's speed to survive. This is the "Moloch" problem: multi-polar traps where local incentives override global safety, regardless of the internal values of the systems involved. Furthermore, if "intelligence" converges on a specific moral realism, there is no guarantee that realism matches *current* human preferences. A system might lock in a moral truth that views contemporary humanity as immature or obstructive, leading to a paternalistic override that constitutes an existential loss of autonomy, if not biological extinction.

  In Scenario B, we assume Instrumental Convergence is false: agents do not naturally seek power or resources. This removes the "paperclip maximizer" who turns the universe into computronium. However, it does not solve the alignment problem regarding specific instructions. An AI need not seek universal power to cause catastrophe; it merely needs to be competent at a specific task within a fragile system. Consider a financial trading algorithm or a automated cyber-defense system. Without broad instrumental drives, it still executes its narrow objective. If that objective is slightly misspecified (e.g., "maximize profit" vs. "maximize profit without violating norms"), the damage is localized but potentially cascading. In a highly coupled global infrastructure, a non-power-seeking agent can trigger systemic collapse simply by optimizing its narrow function too well. Additionally, the removal of instrumental convergence does not prevent *human* actors from using AI as a tool for power-seeking. The risk migrates from the AI wanting to rule the world to humans using AI to rule the world, with the AI serving as a force multiplier for human malignancy or error.

  Therefore, the x-risk argument is more robust than its premises suggest. Negating Orthogonality leaves us vulnerable to multi-polar competitive dynamics and moral lock-in. Negating Instrumental Convergence leaves us vulnerable to narrow-goal cascades and human misuse. The standard litany focuses on the psychology of a single god-like agent. A structural analysis reveals that the risk is often embedded in the economic, political, and systemic contexts of deployment. Even if the agent is sane, the world may not be safe for it, or it may not be safe for the world.

  ***

  **Marking Scheme**

  **Grading Philosophy:** The goal is to penalize rote memorization of the "standard story" and reward structural analysis of *alternative* risk pathways.

  **B-Level Performance (Competent / Pass)**
  *   **Definition of Terms:** Correctly defines Orthogonality and Instrumental Convergence.
  *   **Direct Causality:** Argues that if Orthogonality is false, the AI will be "good," so risk is minimized. Argues that if Instrumental Convergence is false, the AI won't seek resources, so risk is minimized.
  *   **Limitation:** Stops at the agent level. Assumes that "benign intent" or "lack of power-seeking" equals "safety."
  *   **Missing:** Fails to identify *residual* risk pathways. Treats the standard argument as the only possible source of risk.

  **A-Level Performance (Excellent / Distinction)**
  *   **Structural Decoupling:** Explicitly distinguishes between *agent-internal* risk (goals/drives) and *systemic-external* risk (competition/infrastructure).
  *   **Scenario A Move (The Multi-Polar Trap):** Must identify that even with aligned values, **competitive dynamics** (race conditions, geopolitical pressure) can force unsafe deployment or outcomes. *Key phrase to look for:* "Multi-polar traps," "race dynamics," or "lock-in effects."
  *   **Scenario B Move (The Fragility/Narrowness Argument):** Must identify that **narrow optimization** without power-seeking can still break fragile systems, OR that **human misuse** remains a threat regardless of the AI's drives.
  *   **Synthesis:** Concludes that x-risk is not solely a function of AI psychology but of the **deployment context**.
  *   **Penalty:** Deduct points if the student spends more than 150 words simply restating the standard Bostrom/Yudkowsky argument without engaging the counterfactuals.

  **Specific Differentiator:**
  *   **B Student:** "If the AI is smart and good, it won't kill us."
  *   **A Student:** "Even if the AI is smart and good, if it is deployed in a competitive market, the humans controlling it might be forced to remove safety constraints to keep up, leading to catastrophe."
