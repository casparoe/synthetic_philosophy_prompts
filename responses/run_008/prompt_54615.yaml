      *   *Verdict:* This is correct. If they think computation solves uncertainty, the rest is noise. You must break the "computable = known" equivalence first.
      *   *Sequence:*
          1.  Break "Computable = Known" (Resource bounds).
          2.  Define the Problem (Standard Bayes fails on logical truths).
          3.  The Solution Sketch (Logical Induction/Market).
