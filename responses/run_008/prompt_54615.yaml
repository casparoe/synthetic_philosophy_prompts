  2.  **Deconstruct the Core Problem:**
      *   The audience's main hurdle is the "Logical Omniscience" assumption in standard Bayesianism. If $P(A) = 1$ for all true statements $A$, then there's no uncertainty about math.
      *   The "just run the program" objection is the biggest barrier. If I can compute the answer, why assign probability?
      *   Need to show *resource boundedness* is inherent, not just practical.
      *   Need to show standard probability theory breaks down here (Dutch Book arguments).
      *   Need to show Logical Induction offers a solution (market analogy) without getting bogged down in proofs.

  3.  **Determine the Order/Dependencies:**
