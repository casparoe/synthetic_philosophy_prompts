          *   Pros: Definitely computable, definitely hard, deterministic.
          *   Cons: Feels like "practical" uncertainty, not "principled" uncertainty. People say "wait longer."
      *   *Option B:* Collatz conjecture (or similar open problem).
          *   Pros: Unknown truth value.
          *   Cons: Might be independent of ZFC (undecidable), which muddies "necessary truth."
      *   *Option C:* A specific large computation output (e.g., output of a specific Turing Machine after $10^{100}$ steps).
          *   Pros: Clearly necessary truth (halting/not halting, or output 0/1). Clearly infeasible.
          *   Cons: Similar to Pi.
      *   *Selection:* The 10^100th digit of Pi is actually stronger for *this* audience than Collatz. Why? Because Collatz might be undecidable. Pi is definitely decidable. It forces the confrontation with *resource boundedness* rather than *undecidability*. The point of logical uncertainty isn't just undecidability; it's about truths that are provable but not yet proven/computed.
      *   *Refinement:* Actually, a better example for Logical Induction specifically is often a sequence of statements where patterns emerge before proof. But for a 30-min intro, Pi is clearer. Let's stick with Pi but frame it as "The $N$-th digit where $N$ is large enough that no computer in the universe can compute it before heat death." This makes it *principled* uncertainty, not just "wait 5 more minutes."
      *   *Wait, better idea:* A program that checks a property for numbers up to $10^{100}$. It halts (True/False). It's a necessary truth. You can't run it. You have to bet on it.
      *   *Decision:* The $10^{100}$-th digit of Pi is the standard for a reason. It's clean. Just need to emphasize the *resource bound* is physical/universal, not just "my laptop is slow."

  5.  **Map Misconceptions & Timing:**
      *   *Minute 5:* "Just compute it." -> Head off by defining physical limits (heat death).
      *   *Minute 15:* "This is just Bayes over possible worlds." -> Head off by explaining logical omniscience (standard Bayes assigns prob 1 to all logical truths instantly).
      *   *Minute 20:* "Halting Problem says we can't know." -> Head off by distinguishing *uncomputable* from *computationally expensive*. Logical uncertainty applies to decidable statements too.
      *   *Minute 25:* "Why not just use heuristics?" -> Explain the Dutch Book vulnerability (being money-pumped) vs. Logical Induction's guarantee.

  6.  **What to Refuse to Cover:**
      *   The actual construction of the Logical Inductor (the market algorithm, the fixed point theorem).
      *   The proof of the Logical Induction Criterion.
