answer: |-
  ### Exam Question

  **Question 4: Arrow's Theorem and Escape Routes (20 Marks)**

  Arrow's Impossibility Theorem demonstrates that no social welfare function can simultaneously satisfy Unrestricted Domain, Pareto Efficiency, Non-Dictatorship, and Independence of Irrelevant Alternatives (IIA). Consider two proposed "escape routes" from this impossibility:

  1.  **Domain Restriction:** Limiting the admissible preference profiles to those that are single-peaked.
  2.  **The Triad Rule:** A hybrid procedure where, if a Condorcet winner exists, it is ranked first (with remaining alternatives ranked by majority preference); if no Condorcet winner exists, the social ranking is determined by Borda scores.

  Write an essay addressing the following:
  *   For **both** routes, identify precisely which of Arrow's conditions is being relaxed, violated, or transformed. Argue whether each move represents a mere technical dodge or a substantive normative concession.
  *   For the **Triad Rule**, construct a specific preference profile (with no Condorcet winner) demonstrating how the Borda fallback renders the social ranking sensitive to the addition or removal of an irrelevant alternative, thereby violating IIA.
  *   Conclude by evaluating the normative significance of Arrow's result. Did the theorem pose a genuine threat to democratic legitimacy, or do its conditions (particularly IIA) smuggle in a controversial view of what social choice is for?

  ***

  ### Model Answer

  Arrow's theorem is often misread as a proof that democracy is impossible. In reality, it identifies a tension between specific axiomatic commitments. The two escape routes provided illustrate how resolving this tension requires sacrificing different theoretical virtues.

  The **single-peaked preference** route relaxes the **Unrestricted Domain** condition. By assuming preferences align along a single dimension (e.g., a left-right spectrum), we guarantee a Condorcet winner exists (Black's Median Voter Theorem), allowing majority rule to satisfy the remaining Arrow conditions. This is not a mere technical dodge; it is a substantive concession about the nature of political conflict. It assumes society is not deeply fractured across multiple, cross-cutting cleavages. If preferences are multi-dimensional, this restriction fails, making it a contingent solution dependent on sociological facts rather than a universal institutional fix.

  The **Triad Rule** attempts to preserve Unrestricted Domain but inevitably violates **Independence of Irrelevant Alternatives (IIA)**. While the Condorcet component respects IIA when a winner exists, the Borda fallback does not. Borda counts depend on the number of alternatives; adding a "irrelevant" loser changes the point distribution among the contenders.

  Consider a profile with 3 voters and 3 alternatives {A, B, C} forming a Condorcet cycle (A>B>C, B>C>A, C>A>B). There is no Condorcet winner.
  *   **Profile 1:** Borda scores (2,1,0) yield A=3, B=3, C=3. Social ranking: A ~ B.
  *   **Profile 2:** Introduce alternative D. Voters rank D last or interspersed such that individual A-vs-B preferences remain unchanged (e.g., A>B>C>D, B>C>D>A, C>D>A>B).
  *   **New Borda scores (3,2,1,0):** A=(3+0+1)=4, B=(2+3+0)=5. Social ranking: B > A.
  Despite no voter changing their mind about A versus B, the social preference flips. The Triad Rule sacrifices IIA to ensure a complete ordering in all cases.

  Normatively, Arrow's theorem was never a threat to democratic legitimacy *per se*, but rather to a specific **welfarist-ordinalist** conception of aggregation. The threat lies in IIA. By forbidding the social choice mechanism from considering how strongly voters feel (intensity) or how alternatives relate to the broader set (context), IIA smuggles in the view that social welfare is simply a aggregation of rank-orders, devoid of interpersonal comparison. If we accept that legitimate democracy allows for deliberation, intensity signaling, or cardinal utility comparisons, Arrow's impossibility dissolves. Thus, the theorem does not prove democracy is impossible; it proves that a democracy which refuses to measure intensity or restrict domain cannot be perfectly transitive. The "impossibility" is a price paid for a restrictive definition of information, not a failure of collective will.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. Analysis of Single-Peaked Preferences (5 Marks)**
  *   **A (4-5):** Correctly identifies **Unrestricted Domain** as the relaxed condition. Argues it is **substantive** because it relies on empirical sociological alignment (one dimension), not just math.
      *   *Common Error:* Calling it a "technical fix" or claiming it relaxes IIA.
  *   **B (2-3):** Identifies Unrestricted Domain but treats it as a trivial mathematical assumption without normative weight.
  *   **C (0-1):** Fails to identify the condition or confuses single-peakedness with majority rule.

  **2. Analysis of Triad Rule & IIA (5 Marks)**
  *   **A (4-5):** Identifies that Triad violates **IIA** specifically via the Borda fallback. Explains that Condorcet satisfies IIA *only* when a winner exists, making the fallback the weak point.
      *   *Common Error:* Claiming Condorcet methods always violate IIA (they don't, when a winner exists).
  *   **B (2-3):** Identifies IIA violation but attributes it vaguely to "voting rules" without isolating the Borda mechanism.
  *   **C (0-1):** Claims Triad satisfies Arrow's conditions or identifies the wrong condition (e.g., Pareto).

  **3. Profile Construction (5 Marks)**
  *   **A (4-5):** Provides a valid **Condorcet Cycle** profile (no winner). Shows **A vs B** individual preferences remain fixed while **D is added/removed**, flipping the **Borda social ranking** between A and B.
      *   *Common Error:* Changing individual A-vs-B preferences between profiles (violating the test premise) or failing to ensure no Condorcet winner exists.
  *   **B (2-3):** Profile shows Borda violation but fails to verify the "No Condorcet Winner" condition required to trigger the fallback.
  *   **C (0-1):** No profile provided or profile is mathematically incoherent.

  **4. Normative/Philosophical Conclusion (5 Marks)**
  *   **A (4-5):** Argues Arrow threatens **ordinalist welfarism**, not democracy itself. Explicitly notes IIA excludes **intensity/context**. Legitimacy is preserved if we allow richer information.
      *   *Common Error:* Concluding "democracy is impossible" or "Arrow was wrong."
  *   **B (2-3):** Discusses legitimacy but remains vague on *why* IIA is controversial (e.g., just calls it "too strict").
  *   **C (0-1):** Purely descriptive summary of the theorem with no normative evaluation.
