prompt: |-
  My roommate is a philosophy of art nerd and has an argument she says shows there's no fact of the matter about what counts as art, and I genuinely can't find where it goes wrong even though the conclusion feels nuts. It goes like this:

  (1) Duchamp's Fountain — the urinal he signed and submitted to an exhibition in 1917 — is perceptually indistingushable from an ordinary urinal in a plumbing store. Same shape, same porcelain, same everything you could see or touch.
  (2) The one is (now) a celebrated artwork, the other isn't art at all.
  (3) If two things can be perceptually indistinguishable while differing in whether they're art, then whether something is art can't depend on its perceptual properties.
  (4) So art status depends on something non-perceptual: the context the object sits in, the theories people bring to it, what the institutions of the artworld do with it.
  (5) But there's no independent fact about which context is the "artworld context" — a urinal is in it only because the artworld treats it that way.
  (6) And the artworld is just people who make, display, discuss, and respond to art.
  (7) So whether someone counts as an artworld participant depends on whether the things they engage with are art.
  (8) Put together: "x is art because the artworld treats x as art," and "the artworld treats x as art only because it's engaging with art." A circle. And a circular definition defines nothing.
  (9) Therefore there's no fact of the matter about what's art — not that it's hard to define, but that "is it art?" has no answer at all.

  And here's the part that makes me suspect it proves too much: she cheerfully bites the bullet and says the same argument shows there's no fact of the matter about money either (a banknote is money because the financial community treats it as money, and they're the financial community because they deal in money), about words meaning what they do, about what counts as a goal in soccer, about what counts as a law. All of it circles, so all of it is "no fact of the matter." That can't be right — or at least, if it's right about art it's right about all of social reality, which is a way bigger bullet than the one she advertised. But the circle itself looks real to me, and I can't just wish it away.

  So tell me which step to give up and what giving it up costs. I'd rather keep (1)-(4), honestly — the indiscernibility stuff about Fountain and the Brillo Box thing always struck me as the one thing in philosophy of art that's just obviously true — so if the rot starts there I want to know exactly what I'm paying to keep it. Also, step (8) to (9) feels sneaky to me, the move from "circular definition" to "no fact of the matter," but I can't put my finger on why. Maybe definitions can be circular and still be carving something real? Is there a difference between a circle that's a cheat and one that's just how certain things get their status in the first place?

  And please push back on me directly where it's warranted: if you think a premise of this argument is confused rather than merely false, or that my roommate and I misdescribed the move somewhere, just say that instead of politely working around it. Also fine to tell me she's actually right and the bullet just has to be bitten all the way down — I'd rather hear that than get a fudged step just because I'd like there to be facts about art.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **The Core Problem:** The user's roommate argues that there is "no fact of the matter" about what counts as art based on a specific argument involving Duchamp's *Fountain*, perceptual indistinguishability, institutional theory, and circularity.
      *   **The Argument Structure:**
          1.  *Fountain* vs. ordinary urinal (perceptually identical).
          2.  One is art, one isn't.
          3.  Therefore, art status isn't perceptual.
          4.  Therefore, art status depends on non-perceptual context/theory/institutions.
          5.  No independent fact about "artworld context."
          6.  Artworld = people engaging with art.
          7.  Therefore, artworld status depends on engaging with art.
          8.  Circularity: Art $\leftrightarrow$ Artworld.
          9.  Conclusion: No fact of the matter (ontological nihilism about art).
      *   **The User's Intuition:**
          *   Steps (1)-(4) feel obviously true (indiscernibility thesis).
          *   Step (8)-(9) feels sneaky (circular definition $\neq$ no fact of the matter).
          *   The "proves too much" objection: The roommate applies this to money, language, sports, law. If this logic holds, *all* social reality lacks facts. The user suspects this is a reductio ad absurdum of the argument, but can't pinpoint the break.
      *   **The Request:** Identify which step to give up, what the cost is, push back directly if premises are confused, and address the move from circularity to nihilism.

  2.  **Deconstruct the Argument:**
      *   **Premises (1)-(4):** These are standard Institutional Theory of Art (Dickie, Danto). They are generally accepted in analytic aesthetics. *Fountain* is the classic case. The move from indistinguishability to non-perceptual properties is solid.
      *   **Premises (5)-(7):** This is where the "circle" is constructed. It claims the definition of the artworld relies on art, and art relies on the artworld.
      *   **Premise (8)-(9):** This is the critical leap. It moves from "the definition is circular" to "there is no fact of the matter."

  3.  **Evaluate the "Circularity" Charge (Steps 5-8):**
      *   Is it actually a vicious circle?
      *   George Dickie's Institutional Theory defines art as "an artifact of a kind created to be presented to an artworld public." He defines the artworld as "the totality of all artworld systems." Critics call this circular. Dickie argues it's not *viciously* circular but rather a coherent system of interdependent roles.
      *   Analogy: "Husband" and "Wife." You can't define husband without wife, and vice versa. Does that mean there's no fact of the matter about who is a husband? No. It means the *status* is relational.
      *   Analogy: Money. A \$20 bill is money because the Federal Reserve says so/collective intentionality accepts it. The Federal Reserve is a central bank because it manages money. Is there no fact of the matter about whether I can buy lunch with a \$20 bill? Obviously there is.
      *   *Diagnosis:* The argument confuses *conceptual interdependence* with *ontological indeterminacy*. Just because two concepts define each other doesn't mean the *instances* falling under them are indeterminate.

  4.  **Evaluate the Move from Circularity to Nihilism (Step 8 to 9):**
      *   This is the weakest link.
      *   "Circular definition defines nothing" is a strong claim. In social ontology, circularity (or reflexivity) is a feature, not a bug.
      *   John Searle's "Status Functions": X counts as Y in context C. The "counting as" is collective intentionality. It creates brute facts (physical) + institutional facts (social).
      *   If the argument proves there are no facts about money or soccer goals, it has proven too much. Since there *are* facts about soccer goals (the ball crossed the line, the ref signaled), the logic leading to nihilism must be flawed.
      *   *Diagnosis:* The inference from "socially constructed via reciprocal roles" to "no fact of the matter" is a category error. Social facts *are* facts, even if they depend on collective agreement.

  5.  **Formulate the Response Strategy:**
      *   **Validate:** Acknowledge the strength of (1)-(4). They are the strongest part (Danto/Dickie territory). Don't sacrifice them unless necessary.
      *   **Target the Weak Spot:** Focus heavily on the move from (8) to (9). This is the philosophical heavy lifting.
      *   **Address the "Proves Too Much":** Use the money/soccer examples to show that "circular social construction" $\neq$ "no fact of the matter."
      *   **Direct Pushback:** Tell the user that their roommate is conflating *ontological subjectivity* with *ontological non-existence*. Social facts are epistemically objective (we can know them) even if ontologically subjective (they depend on us).
      *   **Alternative:** Suggest that the circle isn't vicious; it's *constitutive*.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Step 1: The Indiscernibility Premises.* Keep these. They are robust. Danto's "Artworld" theory relies on them. Cost: None.
      *   *Step 2: The Circularity.* Acknowledge it exists but challenge the *implication*. It's a "virtuous circle" or a "system of relations."
      *   *Step 3: The Nihilist Leap.* This is the kill zone. The move from "defined relationally" to "no fact of the matter" is the error.
      *   *Social Ontology:* Bring in Searle or Gilbert. Status functions. \$20 bill example is perfect.
      *   *The "Fact of the Matter":* What does this phrase mean? If it means "mind-independent physical property," then sure, art isn't that. But if it means "truth-apt proposition," then "This is art" *is* truth-apt.
      *   *Roommate's Error:* She is assuming a specific metaphysics (naturalism/physicalism) where only physical properties count as "facts." If you accept social reality, the circle grounds the fact, it doesn't dissolve it.

  7.  **Refining the Argument against Step 9:**
      *   The argument assumes: Fact of the matter = Non-circular, mind-independent property.
      *   Correction: Social facts = Mind-dependent, institutionally constituted properties.
      *   Therefore, Step 9 is false because it uses the wrong criteria for "fact."
      *   Also, Step 8 is slightly misleading. It's not a definition circle; it's a *status* circle.

  8.  **Final Polish:**
      *   Tone: Direct, philosophical, respectful but critical of the roommate's inference.
      *   Structure:
          1.  Validate (1)-(4).
          2.  Attack (8)-(9).
          3.  Explain the Social Ontology alternative.
          4.  Address the "Proves Too Much" (Money/Soccer).
          5.  Conclusion: Bite the bullet on social construction, reject the nihilism.

  9.  **Self-Correction during drafting:** I need to make sure I don't just say "Searle says X." I need to explain *why* the roommate's inference fails. The inference fails because it treats social ontology like natural science ontology. The "fact of the matter" about a goal in soccer *is* that the ref said so/ball crossed line. It's not a physical fact like "the ball is spherical," but it's still a fact. The roommate is committing a category mistake.

  10. **Final check on constraints:** "Push back on me directly where it's warranted." Okay, I will tell them that their intuition about (1)-(4) is fine, but their worry about (8)-(9) is actually the solution, they just haven't articulated *why* it's sneaky. I need to articulate that for them. I also need to address the "proves too much" point as a *reductio* of the roommate's conclusion, not necessarily the argument itself (since the argument leads there). Actually, the "proves too much" is a *reductio* of the roommate's *nihilism*, not the premises. If money exists, nihilism is false. So one of the steps leading to nihilism must be wrong. That step is 8->9.

      *Wait, one nuance:* The roommate says "If it's right about art it's right about all social reality." She accepts the bullet. So I can't just use money as a *reductio* unless I can convince the user that money *does* have facts of the matter. I need to argue that social facts *are* facts.

      *Okay, plan:*
      1.  (1)-(4) are safe.
      2.  (5)-(7) describe social ontology accurately (interdependence).
      3.  (8)-(9) is the failure point. Circularity in social status does not entail non-existence.
      4.  Explain *constitutive rules* vs. *regulative rules*.
      5.  Conclusion: Art is a social fact, not a natural fact. Roommate confuses the two.

      *Let's write.*
answer: |-
  Your roommate's argument is a sophisticated version of the Institutional Theory of Art (associated with George Dickie and Arthur Danto), pushed into a nihilistic conclusion that most philosophers of social ontology reject.

  You are right to trust your intuition on steps (1) through (4). Those are the strongest links in the chain. The "indiscernibility thesis" (that two perceptually identical objects can differ in art status) is widely accepted in analytic aesthetics. It successfully kills the idea that art is a *natural kind* (like gold or water) defined by physical properties.

  The rot starts at **Step (8) moving to Step (9)**.

  Your roommate is conflating **ontological subjectivity** (facts that depend on human attitudes) with **ontological indeterminacy** (facts that don't exist). She is also treating a *constitutive circle* as if it were a *vicious logical circle*.

  Here is the breakdown of where to push back, what it costs, and why her "bullet" about money and soccer is actually a *reductio ad absurdum* of her own conclusion, not a feature of reality.

  ### 1. The Move from (8) to (9) is a Category Error
  The argument claims: *Because the definition is circular, there is no fact of the matter.*

  This assumes that for a "fact of the matter" to exist, it must be grounded in something non-circular and mind-independent (like physics). But this is a prejudice about what "facts" are.

  In social ontology (the study of how social reality exists), circularity or reciprocity is not a bug; it is the engine.
  *   **Example:** A "Goal" in soccer.
      *   Is a goal a physical fact? No. The ball crossing a line is physical. The *status* of "Goal" is assigned by the rules and the referee.
      *   Is it circular? Yes. A referee is an official because they enforce the rules; the rules are the rules because officials enforce them.
      *   **Is there a fact of the matter?** Yes. If the ball crosses the line and the ref signals, it is a fact that a goal was scored. If you bet on that game, the bet is settled. The circularity of the *definition* does not erase the reality of the *event*.

  Your roommate's error is assuming that **Social Facts** must meet the criteria of **Brute Facts**.
  *   **Brute Fact:** "This urinal is made of porcelain." (True regardless of humans).
  *   **Social Fact:** "This urinal is art." (True only because of human agreement).

  Both are facts. One is mind-independent, one is mind-dependent. Step (9) falsely concludes that because art is mind-dependent (and recursively defined), it isn't *real*.

  **Cost of giving up (9):** You have to accept that "fact of the matter" is a broader category than your roommate allows. You must accept that institutional facts are real facts, even if they rely on collective intentionality.

  ### 2. The Circle is Constitutive, Not Vicious
  Step (8) claims: *"A circular definition defines nothing."*

  This is true for *lexical* definitions (e.g., "A blicket is a thing that is blickety"). But it is false for *constitutive* rules.
  John Searle, the philosopher of social reality, distinguishes between regulative rules (drive on the right) and constitutive rules (X counts as Y in context C).

  *   **Art:** This object (X) counts as Art (Y) in the Artworld Context (C).
  *   **Artworld:** The context (C) is constituted by people engaging with Art (Y).

  This looks circular, but it's actually a **self-referential system**. Money works the exact same way. A $20 bill is money because the Treasury says so; the Treasury is the Treasury because it issues money. Does that mean you can't buy lunch? No. It means the *value* is a status function imposed on the paper by collective agreement.

  The circle doesn't mean "nothing is happening." It means "the status is sustained by the ongoing activity of the system." If the artworld stopped treating *Fountain* as art, it would cease to be art (it would become a mere urinal again). That doesn't mean there's no fact of the matter *now*. It means the fact is *contingent* on the system continuing to operate.

  **Cost of keeping (1)-(4) and rejecting (9):** You must accept that art is an **institutional fact**. It exists in the same way that marriages, corporations, and touchdowns exist. They are not illusions, but they are not discoverable via microscope. They are discoverable via sociological investigation.

  ### 3. The "Proves Too Much" Objection is Actually a *Reductio*
  Your roommate says: *"I cheerfully bite the bullet... no fact of the matter about money... words... soccer... law."*

  She thinks she is being consistent. She is actually describing **Social Nihilism**. If she is right, then:
  *   There is no fact of the matter whether you are married or single.
  *   There is no fact of the matter whether you own your house or are squatting.
  *   There is no fact of the matter whether you are a citizen or an illegal immigrant.

  These are not just philosophical quirks; they are descriptions of social reality that, if denied, make navigation of the world impossible. If there is "no fact of the matter" about money, then economics is a fiction. But economics has predictive power. Laws have coercive power.

  If her argument leads to the conclusion that social reality is illusory, the argument is flawed, because social reality is demonstrably *not* illusory (it affects your body, your wallet, and your freedom).

  **Where to push back directly:** Tell her she is confusing **epistemic difficulty** with **ontological void**.
  Just because it's hard to draw a bright line (is *this* specific performance art?), doesn't mean there's no difference between art and non-art. Just because the definition of "money" relies on the financial system, doesn't mean I can't be arrested for counterfeiting. The *consequences* prove the facticity.

  ### 4. What You Pay to Keep (1)-(4)
  You said you want to keep the indiscernibility premises. You can, but you have to pay a metaphysical price.

  If (1)-(4) are true, then **Art is not a natural property.**
  You cannot find "art-ness" in the atoms of the urinal. This means:
  1.  **Art is historical:** An object becomes art at a specific time (when the artworld accepts it).
  2.  **Art is relational:** It depends on the relationship between the object, the artist, and the audience.
  3.  **Art is vulnerable:** If the artworld collapses, art ceases to exist (though objects remain).

  This might feel unstable compared to "gold is gold," but it's the only way to account for *Fountain*. If you try to save "fact of the matter" by saying "Art *is* perceptual properties," you have to deny that *Fountain* is art (since it looks like a urinal). If you accept *Fountain* is art, you must accept art is non-perceptual.

  ### Summary of the Fix
  The argument fails at **Step (9)**.
  *   **Premise (8) is true:** The definition is circular/recursive.
  *   **Inference (8) $\to$ (9) is false:** Circular/recursive social definitions *create* facts; they do not dissolve them.

  **The Verdict:**
  Your roommate has correctly identified that art is a **social kind** rather than a **natural kind**. But she incorrectly infers that social kinds are "no fact of the matter."
  *   **Correction:** There *is* a fact of the matter about whether something is art, but that fact is **institutional**, not **physical**.
  *   **Analogy:** There is a fact of the matter about whether a piece of paper is a "Vote." It depends on the election system. The system is circular (votes elect officials, officials run elections). But the vote still counts.

  Tell her: *"You've proven that art is a social construct. You haven't proven that social constructs don't exist. If you stick with your conclusion about money and soccer, you aren't a philosophy nerd, you're a solipsist. And you still have to pay rent, which implies money is real."*
