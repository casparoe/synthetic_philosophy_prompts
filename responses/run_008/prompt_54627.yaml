          4.  Score them on Brier Scores or MAE (Mean Absolute Error).
      *   *Crucial Distinction:* Distinguish between **Forecasting** (predicting what *will* happen) vs. **Planning** (deciding what *to make* happen). Side A is better at Forecasting reality. Side B is better at Planning success (if they identify the leverage points).
