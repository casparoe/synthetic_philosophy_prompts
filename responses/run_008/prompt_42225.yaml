prompt: |-
  Quick context: I teach a first-year epistemology elective at uni, 14 students, one 80-minute seminar slot, and next week we're on epistemic injustice. I want an activity where they run into hermeneutical injustice before anyone names it — so no lecture up front, and they shouldn't hear the term itself until the debrief.

  The core mechanic I have in mind: a structured small-group discussion where a chunk of the relevant vocabulary is simply banned — a taboo list, with some penalty mechanic (no real money, maybe tokens or talking-rights at stake) — and the discussion topic is built so the banned words are exactly the ones they'd need to say what's going on. Like getting them to discuss a scripted case of a manager repeatedly interrupting someone and passing their ideas off as his own, while banning "credit", "credit-stealing", "plagiarise", "undermine", "belittle", "harass", "diminish", "dismissive" and so on. But please actually work out the taboo list yourself — I want something like 12-15 banned words plus near-synonyms, and design the case so it can't be dodged with one clever synonym. The point is they should all *feel* that something is wrong in the case and keep fumbling for words that aren't there. Work out how the case gets presented (handout? short role-play with scripts you write? a 2-minute acted scene?), how groups are split, timing, and how taboo violations are policed.

  Then a second phase shifting to the testimonial side: I'm imagining groups solving a puzzle or reasoning task where one member actually has the key information, but role cards have pre-installed a credibility asymmetry — e.g., that person is flagged to their group as "not to be treated as a specialist," or their inputs have to pass through another member before the group can act on them. Design it so the discounting happens for a prejudice-flavoured reason rather than a legitimate one. Again: mechanics, materials, timing, and how you'd keep it from being either obvious or too subtle.

  Finish with a debrief that maps specific moments in each phase onto the Fricker-style distinction between hermeneutical and testimonial injustice — what was the "gap" in phase one, what was the "deflation" in phase two, and where they came apart. And be honest about what the game can't reproduce: the students know the concept exists and is merely being withheld, nobody is structurally harmed for fifteen minutes of frustration, the vocabuary will be back tomorrow. Say plainly which parts of the real phenomenon I have to supply myself in the debrief.

  Also give me the predictable failure modes on a first run — people finding the taboo list funny instead of frustrating, one group huddling round a legal-pad loophole, spotty enforcement, the discounting phase feeling staged — and concrete handling for each.

  Write the whole thing in British English please (plagiarise not plagiarize, that sort of thing). No reading lists or citations needed, just a plan I can run off. Don't bother mentioning Fricker's exact examples from the book either, keep it self-contained so it works even if half of them havn't done the reading.
