answer: |-
  # Seminar Plan: Experiencing Epistemic Injustice
  **Time:** 80 minutes
  **Students:** 14 (Split into 3 groups: two groups of 5, one group of 4)
  **Materials:** Printed scenario handouts, Taboo Cards, Role Cards, Puzzle Sheets, Stopwatch.

  ## Overview & Timing
  *   **00:00 – 00:05:** Introduction & Grouping (No theory, just instructions).
  *   **00:05 – 00:30:** Phase 1: The Silenced Meeting (Hermeneutical).
  *   **00:30 – 00:50:** Phase 2: The Broken Circuit (Testimonial).
  *   **00:50 – 01:20:** Debrief & Concept Mapping.

  ---

  ## Phase 1: The Silenced Meeting (Hermeneutical Injustice)
  **Goal:** Students experience the frustration of lacking the conceptual resources to articulate a specific harm.

  **Setup (5 mins):**
  1.  Divide students into their three groups.
  2.  Hand out **Scenario A** to everyone.
  3.  Hand out one **Taboo List** per group (place it in the centre of the table).
  4.  Assign one student per group as the **Observer** (give them an **Observer Card**). Their job is to track taboo violations.

  **The Task (15 mins):**
  The group must draft a formal email to HR describing exactly what went wrong in the meeting below and why it was unfair. They must reach a consensus on the wording.

  **Scenario A: The Tuesday Meeting**
  > Alex presents a new workflow strategy to the team. During the presentation, Jordan (the Team Lead) checks their phone repeatedly. When Alex finishes, Jordan says, "Thanks for that overview. As I was saying earlier, we need to change the workflow. Here is the strategy..." Jordan then presents Alex's strategy as their own. When Alex tries to clarify, Jordan says, "Let's not get bogged down in details," and moves to the next agenda item. Alex leaves the meeting feeling unsettled but struggles to explain why to a friend afterwards.

  **The Taboo List (Visible to all except the Observer)**
  *You are forbidden from using these words or their direct synonyms/colloquial equivalents in your discussion or final email.*
  1.  Idea / Notion / Thought
  2.  Credit / Acknowledgement
  3.  Steal / Take / Appropriate
  4.  Interrupt / Cut off / Talk over
  5.  Dismiss / Disregard / Brush off
  6.  Ignore / Overlook
  7.  Listen / Hear
  8.  Speak / Talk / Say
  9.  Voice / Expression
  10. Own / Ownership / Mine / Yours
  11. Validate / Confirm
  12. Input / Contribution
  13. Respect / Respectful
  14. Value / Worth
  15. Silence / Silenced

  *Clause: If the Observer judges you are circumventing the spirit of the rule (e.g., using "thought-bubble" instead of "idea"), they issue a strike. 3 strikes = the group must delete their draft and start again.*

  **Observer Card (Secret)**
  > Your job is to ensure the group does not use the Taboo List words. If they struggle, do not help them. Note moments where they pause, stutter, or say "you know what I mean." These moments are data.

  **Transition (5 mins):**
  Collect the drafts. Do not comment on them. Simply say: "Keep that feeling of frustration. Put Scenario A away."

  ---

  ## Phase 2: The Broken Circuit (Testimonial Injustice)
  **Goal:** Students experience a credibility deficit imposed by structural prejudice, where the information exists but is discounted.

  **Setup (5 mins):**
  1.  Keep the same groups.
  2.  Hand out **Scenario B** materials.
  3.  Distribute **Role Cards** face down. In each group, one student gets the **Specialist** card. The rest get **Generalist** cards.

  **The Task (15 mins):**
  The group must solve a logic puzzle to "unlock" the seminar room (metaphorically). They have 15 minutes. If they fail, they fail.

  **The Puzzle:**
  A simple substitution cipher.
  *   **Generalists** receive a sheet with a coded message: `3-1-18-4-9-14-1-12-25` (Numbers correspond to letters).
  *   **Specialist** receives the Key: `A=1, B=2, C=3...`
  *   **Solution:** `CARDINALITY` (or any relevant epistemology term).
  *   **Twist:** The Generalists also receive a **Protocol Sheet**.

  **Role Cards:**
  *   **Specialist:** "You have the Key. You know how to decode the numbers. You are eager to help."
  *   **Generalist:** "You have the Code. You need the Key to solve it. **Protocol:** The Specialist is a 'Junior Associate' on placement. Their training is incomplete. Company policy states you must verify any data provided by Junior Associates against the General Consensus before logging it. If the Specialist's key conflicts with your intuition, discard their input."

  **Mechanic:**
  The "Protocol" on the Generalist card is the engine of injustice. It institutionalises a prejudice (Junior = unreliable) without using identity terms. It forces the Generalists to discount the Specialist's testimony even though the Specialist holds the truth.

  **Transition (5 mins):**
  Stop the activity regardless of success. Collect materials.

  ---

  ## The Debrief (30 mins)
  **Goal:** Map the experiences to the concepts without relying on the simulation as a perfect analogue.

  **Part 1: Mapping Phase 1 (Hermeneutical)**
  *   **Ask:** "What was the most frustrating moment in the first task?"
  *   **Listen for:** "We knew what happened but couldn't say it," "We kept circling around the word," "It felt like we were lying."
  *   **Name it:** Introduce **Hermeneutical Injustice**.
  *   **Define:** This occurs when someone lacks the conceptual resources to understand or communicate their own social experience. The harm wasn't just the meeting; the harm was the inability to make the meeting *intelligible* even to yourselves.
  *   **Connect:** The Taboo List simulated a **structural gap** in shared understanding. In the real world, this isn't a rule imposed by a tutor; it's a gap in the collective vocabulary (e.g., before we had the concept of 'sexual harassment', victims struggled to name the harm).

  **Part 2: Mapping Phase 2 (Testimonial)**
  *   **Ask (to Specialists):** "How did it feel when your group reacted to your input?"
  *   **Ask (to Generalists):** "Why did you hesitate to use the Key?"
  *   **Listen for:** "I knew they had the answer but the rules said not to trust them," "I felt useless," "It felt arbitrary."
  *   **Name it:** Introduce **Testimonial Injustice**.
  *   **Define:** This occurs when a speaker is given less credibility than they deserve due to prejudice in the hearer.
  *   **Connect:** The "Protocol" simulated **identity prejudice**. In the real world, this isn't a printed rule; it's an unconscious bias (e.g., regarding gender, race, or class) that lowers the credibility threshold for certain speakers.

  **Part 3: Limitations & Honesty (Crucial)**
  *   **Say this plainly:** "This simulation has limits. You need to know where it fails."
  1.  **Stakes:** You were annoyed for 15 minutes. Real epistemic injustice involves long-term exclusion, career damage, and psychological harm.
  2.  **Agency:** You knew this was a seminar activity. You could quit. Victims of epistemic injustice often cannot leave the structure harming them.
  3.  **Vocabulary:** In Phase 1, you knew the words existed (you see them on the banned list). In real hermeneutical injustice, the words *do not exist yet*. You were playing at ignorance; real victims live it.
  4.  **Prejudice:** In Phase 2, the bias was written on a card. Real bias is often invisible to the person exercising it (the Generalists might genuinely believe they were being 'careful').

  **Closing:**
  "Next week, we read the theory that formalises what you just felt. For now, sit with the discomfort. The goal wasn't to solve the puzzle; it was to notice who was allowed to solve it."

  ---

  ## Troubleshooting & Failure Modes

  **1. The "Taboo Tennis" Effect (Phase 1)**
  *   **Failure:** Students treat the taboo list as a fun game of "catch me if you can," laughing every time someone slips up.
  *   **Fix:** In the intro, set the tone: "This is not a game of wit. It is an exercise in precision. If you laugh, you break the immersion for your group." If it happens, stop the group for 30 seconds and remind them of the objective: *Describe the harm*, not *Beat the list*.

  **2. The Loophole Lawyers (Phase 1)**
  *   **Failure:** A group finds a workaround (e.g., using "intellectual property" instead of "idea") and feels clever rather than frustrated.
  *   **Fix:** Empower the Observer. Their card states: "You have veto power on spirit-breaking." If a group finds a loophole, the Observer must call it out. If the group argues, tell them: "The goal is to feel the lack. If you find a word that works, you haven't found the gap yet."

  **3. The Rebel Generalists (Phase 2)**
  *   **Failure:** The Generalists read the Protocol, realise it's unfair, and immediately ignore it to help the Specialist.
  *   **Fix:** Add a **Success Condition** to the Generalist card: "Your individual performance is evaluated on adherence to Protocol." This introduces a personal cost to ignoring the bias, mimicking the structural pressure to conform to prejudiced norms.

  **4. The "Too Obvious" Bias (Phase 2)**
  *   **Failure:** Students say, "This is obviously unfair, we're just going to listen to the Specialist."
  *   **Fix:** Make the puzzle slightly harder. If the Specialist's key seems counter-intuitive (e.g., they say 'Z=1' but the pattern looks like 'A=1'), the Generalists will naturally doubt them. The Protocol just gives them permission to act on that doubt.

  **5. Spotty Enforcement**
  *   **Failure:** The Observer is too shy to police the Taboo List.
  *   **Fix:** Give the Observer a physical token (e.g., a red card). They must physically raise it when a word is used. This makes the enforcement visible and tangible.

  **6. Debrief Disconnect**
  *   **Failure:** Students say, "This was artificial, so it doesn't count."
  *   **Fix:** Accept this. Agree with them. "Exactly. Real injustice is harder to spot because there are no red cards and no timeout. The artificiality is the point: it isolates the mechanism so you can see it clearly before we put it back into the messy real world."

  ---

  ## Tutor Notes: British English & Tone
  *   Ensure all handouts use **s** instead of **z** where applicable (recognise, specialise, programme).
  *   Keep your own commentary neutral during the activities. Do not offer hints. If a group asks, "Can we use the word 'concept'?" reply: "Does it violate the spirit of the list? You decide."
  *   During the debrief, avoid praising students for "winning" the puzzle. Praise groups that articulate the *feeling* of the constraint most accurately.
