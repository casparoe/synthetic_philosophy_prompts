  Here is the principle extracted from your data, the verdict it requires you to discard, and the prediction it makes for your unresolved cases.

  ### The Principle: **The Horizon of Causal Accountability**

  > **Deliberate actions that significantly raise our signal-to-noise ratio above background leakage are permissible only if the minimum round-trip time for a causal impact (physical or informational) exceeds the planning horizon of the sending civilization.**

  Let's break down the components:
  1.  **"Deliberate actions... above background leakage":** This distinguishes METI from TV/radar leakage. Leakage is an entropy byproduct; METI is a negentropy beam. It crosses the *detectability threshold*. This explains why the argument "we've been leaking anyway" is wrong: METI changes the probability of detection from negligible to near-certain for the targeted volume.
  2.  **"Minimum round-trip time":** This accounts for the speed of light limit.
  3.  **"Planning horizon of the sending civilization":** This is the temporal discount factor. It defines the boundary where "us" becomes "them." If the consequences arrive after your institutions, culture, and moral agency have dissolved or transformed beyond recognition, you are not imposing risk on *yourself*, you are imposing it on a successor species that did not consent.

  ### Mapping Your Data

  *   **Voyager/Pioneer:** **Fine.** Passive artifacts. They do not *beam* a signal; they wait to be found by someone who has already arrived. They do not raise the signal profile actively.
  *   **Arecibo (25k ly):** **Fine.** Round trip is ~50,000 years. This vastly exceeds the planning horizon of any current political or cultural entity. The "us" that sent it and the "us" that receives the reply are causally disconnected in terms of accountability.
  *   **Cosmic Call (20 ly):** **Not Fine.** Round trip ~40 years. This is well within the lifespan of current institutions and the biological lifespan of many senders. The risk is internalized by the sender's civilization.
  *   **Omnidirectional Beacon:** **Extremely Not Fine.** Permanent violation of the horizon for all nearby stars.
  *   **Leakage:** **No Verdict/Excused.** Not deliberate; does not significantly cross the detectability threshold compared to a directed beam.
  *   **Reply to Signal (50 ly):** **Not Fine.** Round trip 100 years. While 100 years is longer than a human life, it is within the *civilizational* planning horizon (nations and cultures persist). Furthermore, replying confirms *intelligence* and *capacity*, not just existence, increasing the marginal risk.

  ### The Casualty: Which Verdict Must Go?

  You suspected it was the **Private Company** intuition, and the principle confirms this.

  Under the **Horizon of Causal Accountability**, the *identity* of the sender (Private vs. Government) is irrelevant to the physics of the risk. A private company beaming a message at 20 light-years is dangerous for the exact same reason a government beaming at 20 light-years is dangerous: the reply arrives while the same civilization is still there to suffer the consequences.

  Your intuition that "Private feels worse" is likely a proxy for a **Coordination Problem**. You recognize METI as a negative externality (a tragedy of the commons). Private actors are worse at internalizing global externalities than governments (theoretically). However, strictly speaking, if the Government had sent Cosmic Call, your principle suggests it should *still* be "Not Fine" because the temporal horizon is violated. The "Private" verdict is noise; the "Distance/Time" verdict is the signal.

  *(Note: If you were a strict Longtermist, you would have to discard the **Arecibo** verdict instead, arguing that future humanity counts morally. But given your explicit justification for Arecibo ("the 'we' isn't the 'we'"), the Temporal Horizon is the stronger fit for your specific psychology.)*

  ### The Prediction: A New Case

  **Case:** We build a high-power laser array to push light sails to Alpha Centauri (4 light years). The array is active for 10 years. It is not aimed *at* a star, but the beam passes through the habitable zone of a star 10 light years away en route to the sail.

  **Prediction:** **Not Fine.**
  **Reasoning:** Even though the intent is propulsion, not communication, the action is *deliberate* and creates a high-power signal (anomalously high energy flux) within the causal horizon (20 year round trip). It raises the signal profile above background leakage for an observer in that system. Under the principle, the *intent* matters less than the *marginal increase in detectability* within the *horizon of accountability*.

  ### Resolution on the Reply Case

  You mentioned flip-flopping on replying to a signal from 50 light years away.
  **Verdict:** **Not Fine.**
  **Why:** Receiving a signal confirms *they* know *we* are here (or at least that the solar system is interesting). Replying confirms *we know they are there*, *we have decoded their message*, and *we possess technology capable of coherent transmission*. It upgrades their intelligence estimate of us from "Potential Biosphere" to "Technological Peer." Since 100 years is within our civilizational horizon, you are voluntarily increasing the threat profile of your own civilization without a mandate from the future people who will bear the cost. Silence is the only dominant strategy.
