answer: |-
  # The EMT-Licensure Filter: A Decision Procedure for Resource Requests

  **Purpose:** To provide a consistent, defensible method for ruling on exam resource requests, grounded in the Extended Mind Thesis (EMT).
  **Time Required:** ~45–60 minutes per request.
  **Users:** Examination Committee Members (Working Engineers).

  ## Part 1: The Decision Procedure

  **Instructions:** Answer the following questions in order. Do not skip steps. If a step directs you to a **Ruling**, stop and draft your rationale based on the notes provided. If a step directs you to a **Committee Vote**, convene the committee for a policy decision.

  ### Phase 1: The EMT Eligibility Test
  *Goal: Determine if the resource functions as a cognitive extension (part of the mind) or merely as an external tool.*

  **Q1. Constant Availability & Access:**
  During the exam, will this resource be as reliably and quickly accessible as the candidate's biological memory?
  *   *Test:* Is there significant latency, search friction, or risk of unavailability (e.g., network outage, rate limiting)?
  *   *Yes (High Friction/Unreliable):* **Go to Q2.**
  *   *No (Smooth/Reliable):* **Go to Q3.**

  **Q2. (Failed Availability) Ruling: DISALLOW.**
  *   *Rationale:* The resource fails the basic coupling requirement of EMT. It functions as a lookup tool, not a cognitive extension. Relying on it introduces variance unrelated to competence (e.g., search speed).
  *   *Exception:* If the resource is standard industry documentation (e.g., language spec), bypass to Phase 2 (Policy Check) rather than disallowing outright, as reference use is a separate policy question.

  **Q3. Automatic Endorsement (Trust):**
  Does the candidate accept the output of this resource without critical verification, in the same way they accept a memory recall?
  *   *Test:* If the resource provides a solution, must the candidate verify it line-by-line? If verification is required, it is not "automatic endorsement."
  *   *Yes (Blind Trust/Transparent):* **Go to Q4.**
  *   *No (Requires Verification):* **Go to Phase 2 (Policy Check).** *Note: This indicates the tool is a subordinate agent, not a mind extension.*

  **Q4. Provenance (Past Endorsement):**
  Was the information or structure within this resource created or consciously curated by the candidate?
  *   *Test:* Is this "Otto's Notebook" (written by Otto) or "The Library" (written by others)?
  *   *Yes (Self-Curated):* **EMT STATUS: EXTENDED MIND.** Proceed to Phase 2.
  *   *No (External/Black Box):* **EMT STATUS: EXTERNAL AGENT.** Proceed to Phase 2.

  ---

  ### Phase 2: The Licensure Policy Gate
  *Goal: Determine if certifying this specific cognitive configuration aligns with the body's mandate.*

  **WARNING: JUDGMENT CALL.** *The EMT describes what the mind **is**; it does not dictate what a license **should cover**. The following questions are matters of professional value, not philosophy.*

  **Q5. The Accountability Test:**
  If the system (Candidate + Resource) fails in production, can the candidate explain *why* the resource produced the error?
  *   *If No:* **Ruling: DISALLOW.** (The candidate is operating a black box they do not understand. This violates the duty of competence.)
  *   *If Yes:* **Go to Q6.**

  **Q6. The "Stripped-Down" Test:**
  If we ban this resource, are we testing a version of the engineer that does not exist in the real world?
  *   *Context:* If the resource is an EMT-qualified Extension (from Phase 1), banning it privileges biological memory over coupled systems.
  *   *If Yes (It creates an artificial constraint):* **Ruling: ALLOW.** (To ban it is to test for a fictional competence.)
  *   *If No (It is a crutch):* **Go to Committee Vote.**

  **Q7. Committee Vote (The Value Handoff):**
  *   *Trigger:* The resource passed EMT (Phase 1) but the Committee feels uncomfortable licensing the hybrid. OR the resource failed EMT but is industry standard.
  *   *Task:* Vote on whether the certificate should attest to *Human Competence* or *Human-Tool System Competence*.
  *   *Outcome:* Majority vote determines Ruling.

  ---

  ## Part 2: Application to Current Requests

  Here is the procedure applied to the three pending requests.

  ### Case (a): Code-Completion Assistant (General AI)
  *   **Q1 (Availability):** Yes. Integrated into IDE, low latency.
  *   **Q3 (Trust):** **No.** Current models hallucinate. Engineers must verify every suggestion. It fails "Automatic Endorsement."
  *   **Phase 2 (Policy):** Since it failed EMT, it is an External Agent.
  *   **Q5 (Accountability):** Risky. Candidates often cannot explain *why* the AI generated a specific pattern if they didn't write it.
  *   **Ruling:** **DISALLOW.**
  *   **Rationale:** The tool is not cognitively integrated (requires verification). It functions as a delegate, not an extension. Allowing it risks certifying the model's capability rather than the engineer's oversight.

  ### Case (b): Candidate's Personal Snippet Library
  *   **Q1 (Availability):** Yes. Local file, searchable, instant access.
  *   **Q3 (Trust):** Yes. Candidate wrote/tested these; they are trusted implicitly like memory.
  *   **Q4 (Provenance):** Yes. Self-curated over career.
  *   **EMT Status:** **EXTENDED MIND.** (This is Otto's Notebook).
  *   **Q5 (Accountability):** Yes. Candidate wrote the code; they own the logic.
  *   **Q6 (Stripped-Down):** Yes. Banning this forces the engineer to disconnect from their established cognitive workflow.
  *   **Ruling:** **ALLOW.**
  *   **Rationale:** Under EMT, this library *is* the candidate's memory. Banning it privileges biological neurons over silicon storage without a difference in cognitive function.

  ### Case (c): Full Web Access (Docs + Q&A)
  *   **Q1 (Availability):** **No.** Search friction, network reliance, variable quality.
  *   **Q3 (Trust):** **No.** Q&A sites require validation; docs require lookup.
  *   **EMT Status:** **EXTERNAL TOOL.**
  *   **Phase 2 (Policy):**
  *   **Q5 (Accountability):** Yes, if they verify.
  *   **Q6 (Stripped-Down):** No. Engineers often work offline or in restricted environments.
  *   **Ruling:** **DISALLOW (Full Access).** *Allow Official Documentation Only.*
  *   **Rationale:** Fails EMT due to friction and lack of automatic trust. Full access introduces uncontrolled variables (Q&A quality). Official docs are permitted as standard reference, not cognitive extension.

  ---

  ## Part 3: The Unpopular Ruling

  **The Ruling:** **Case (b) — Allow Personal Snippet Library.**

  **Why the Committee Will Dislike It:**
  Examination committees, particularly in licensure, traditionally view "Closed Book" as the only valid measure of *internalized* knowledge. There is a deep-seated intuition that if you can look it up (even in your own notes), you don't truly "know" it. Allowing a snippet library feels like sanctioning a "cheat sheet," which undermines the perceived rigor of the exam. Colleagues will argue that this allows candidates to bypass fundamental recall, potentially passing engineers who cannot code without their crutches.

  **Why the Procedure Returns It:**
  The Extended Mind Thesis is ruthless here: there is no functional difference between a neural pathway that fires to recall a sorting algorithm and a file path that opens a snippet of that same algorithm, *provided* the access is reliable and the content is trusted.
  If we accept EMT, banning the snippet library is biologically chauvinistic. It asserts that memory stored in carbon is valid for licensure, but memory stored in silicon (that you wrote yourself) is not. Since the license certifies the *engineer*, and the engineer includes their trusted tools, banning the library tests a "stripped-down" phantom that does not exist in practice. The procedure forces us to admit that if we trust the candidate's brain, we must trust the candidate's notebook.

  ---

  ## Part 4: Future Failure Points & Framework Limits

  ### Where the Procedure Will Misfire
  The procedure is most likely to break on **Case (a) (AI Assistants)** within 3–5 years.
  Currently, AI fails **Q3 (Trust)** because engineers must verify outputs. However, as models improve, verification costs will drop. When an engineer stops reading every line of AI-generated code and treats it as reliable (automatic endorsement), AI will pass the EMT test.
  At that point, the procedure will return **EMT STATUS: EXTENDED MIND**.
  The Committee will then face a crisis: The procedure will demand we **ALLOW** AI (via Q6), because banning it would test a non-existent "unassisted" human. But the Committee may still wish to ban it to ensure *human* accountability. The procedure will look like it is forcing the Committee's hand, leading to appeals claiming the "EMT Filter" is overruling safety policy.

  ### Inherent Limits of the Extended Mind Framework
  The fundamental limitation is not in our implementation, but in the philosophy itself: **EMT is Ontological, not Normative.**

  1.  **Description vs. Prescription:** EMT tells us what *constitutes* a cognitive system (Human + Tool). It does not tell us whether that system is *safe to license*. A "Human + AI" mind might be a valid cognitive system, but if the AI is a proprietary black box owned by a third party, licensing the human for the AI's output creates a liability gap EMT cannot resolve.
  2.  **The Accountability Gap:** Licensure is about *responsibility*, not just *capacity*. EMT merges the tool into the mind. But in law and ethics, the tool cannot be sued or stripped of a license; only the human can. If the "mind" includes a tool the human does not fully control (e.g., a changing API or a drifting model), EMT validates the coupling, but Licensure requires singular accountability.
  3.  **The "Coupling" Bias:** EMT assumes that smoother coupling is better. In safety-critical engineering, *friction* is sometimes a feature, not a bug. A tool that forces you to think twice (high friction) might be safer than a tool that integrates seamlessly (low friction). EMT pushes us toward seamless integration; Safety Engineering sometimes demands the opposite.

  **Recommendation:** As AI tools evolve, the Committee must add a **"Sovereignty Clause"** to Phase 2. Even if a tool passes EMT, it must be disallowed if the candidate cannot maintain ultimate causal authority over the output. EMT can tell us the AI is part of the mind; it cannot tell us if that mind is legally liable. That remains a human judgment.
