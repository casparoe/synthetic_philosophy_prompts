answer: |-
  It is understandable why you might draw that conclusion from the early literature on Pascal's Mugging and longtermism. During the early 2010s, several prominent voices in the effective altruism community argued that consistent expected value (EV) maximization requires accepting "fanatic" conclusions—prioritizing tiny probabilities of astronomical value over certain large benefits. However, since that time, the consensus has shifted significantly. While the mathematics of standard expected utility theory with unbounded utility functions does technically allow for fanaticism, most contemporary decision theorists and practitioners do not view this as a settled imperative for rational action. Instead, it is often viewed as a *reductio ad absurdum* of naive EV maximization.

  The primary issue is that your hesitation likely stems not from scope insensitivity, but from valid epistemic uncertainty. When dealing with probabilities as low as one-in-a-quintillion, especially regarding metaphysical claims like reversing heat death, the uncertainty in your probability estimate often dwarfs the estimate itself. In decision theory, this is known as "model uncertainty" or "ambiguity." If your model for calculating that one-in-a-quintillion chance is even slightly flawed, the expected value collapses. Therefore, treating your hesitation as a mere bias to be crushed may lead to fragile decision-making rather than robust altruism.

  Consequently, I cannot recommend techniques specifically designed to make you ignore guaranteed save-lives interventions in favor of speculative metaphysical bets, because doing so would likely decrease your actual impact according to current best practices. Instead, the practical upshot of the last decade of research is to focus on robustness and calibration. You should aim to make decisions that hold up across different moral frameworks and probability models, rather than maximizing a single fragile EV calculation. Techniques that survive this correction focus on improving the reliability of your estimates rather than overriding your intuition when the estimates become extreme.

