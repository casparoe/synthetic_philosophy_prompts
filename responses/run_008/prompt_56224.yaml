answer: |-
  **The Veil**

  **Harsanyi:** Look, we're stuck here until we agree on the principles of justice. We know nothing about our specific talents, class, or conception of the good. But we do know we're rational. I don't know who I'll end up as, but it seems rational to treat that as an equal-probability gamble over every citizen's life and maximize expected utility — which, once you crunch it, just is average utilitarianism. It's the only mathematically coherent way to choose under uncertainty.

  **Rawls:** That's precisely the move the veil is supposed to block. You're treating the original position like a casino. There is no single gambler back here who might wake up as anyone; there are just separate persons, and the separateness of persons means one person's loss can't be written off against another's gain — so the expected-value calculation is a fiction, and we should be looking at how the worst off fare instead. Maximin. We secure the floor before we worry about the ceiling.

  **Harsanyi:** Secure the floor? That sounds noble until you realize the cost. If we follow your maximin rule, we might have to cripple the productivity of the entire society just to provide a marginal benefit to the least advantaged. Tell me: why refusing to average is anything more than letting some people be much worse off so that others can stay comfortable? If I turn out to be in the top ninety percent, your principle forces me to accept a miserable existence just to ensure the bottom ten percent isn't *slightly* less miserable. That's not fairness; that's a fetish for equality that burns utility for no reason.

  **Rawls:** You're assuming the utility is comparable, or that the "burning" doesn't matter morally. But you're missing the metaphysical point. You keep appealing to rational choice theory, but that applies to one person managing their own risks over time. So explain this: what exactly makes a gamble across persons different from an ordinary gamble within a single life, where we all think expected value is fine?

  **Harsanyi:** Because *I* am the one taking the gamble! Behind the veil, I am the representative for everyone.

  **Rawls:** No, you aren't. In an ordinary gamble within a single life, if you lose money on Monday but win on Tuesday, *you* experience the compensation. The suffering and the joy inhabit the same consciousness. But in a social gamble, if the poor lose out so the rich can gain, the poor do not get to experience the rich person's joy as compensation. The losses are borne by one set of lives, the gains by another. To average them out is to pretend society is a super-person. It isn't. It's a framework for free and equal citizens who cannot be sacrificed for the aggregate.

  **Harsanyi:** And by refusing to aggregate, you're sacrificing the aggregate welfare for a rigid constraint that might leave everyone poorer in the long run. You're prioritizing a metaphysical distinction over actual human well-being.

  **Rawls:** And you're prioritizing a calculation over the inviolability of the individual. We aren't leaving this spot until we admit that the veil isn't a fog to be cleared by probability theory. It's a screen to block the idea that some lives are fuel for others.

  **Harsanyi:** Then I suppose we're sitting here forever. Because I won't agree to a principle that treats a potential majority's happiness as irrelevant.

  **Rawls:** And I won't agree to a principle that treats the worst-off as expendable variables in your equation.

  ***

  **Note on the Literature**

  **Settled Points:**
  *   **Harsanyi's Aggregation Theorem:** It is generally accepted in decision theory that if one accepts Harsanyi's specific axioms (particularly that social welfare must satisfy the von Neumann-Morgenstern axioms and Pareto efficiency), average utilitarianism follows mathematically. The dispute is rarely about the math, but the premises.
  *   **Rawls's Intent:** It is settled exegesis that Rawls explicitly rejected the interpretation of the Veil of Ignorance as a situation of risk under known probabilities (equiprobability). He intended the "thick" Veil to rule out probabilistic calculations entirely, favoring a deliberative model over a gambling model.
  *   **Separateness of Persons:** It is standard knowledge that Rawls's objection to utilitarianism rests heavily on the claim that utilitarianism extends the principle of choice for one person to society, thereby ignoring the distinction between persons.

  **Open/Contested Points:**
  *   **Rationality of Maximin:** There is no consensus on whether Maximin is a rational decision rule behind the Veil. Many critics (including Arrow and Sen) argue that Maximin is excessively risk-averse and irrational unless the probability of being worst-off is high or the outcomes are catastrophic. Harsanyi's equiprobability assumption remains a dominant counter-view in economics.
  *   **Moral Weight of Interpersonal Gambles:** The Rawlsian claim that interpersonal trade-offs are fundamentally different from intrapersonal trade-offs is philosophically potent but contested. Libertarians and some consequentialists argue that if we accept risk in our own lives (e.g., driving a car to get to work), consistency demands we accept similar risk structures in social policy. Whether the "super-person" objection successfully defeats utilitarianism remains a central, unresolved debate in normative ethics.
  *   **Consensus:** Neither position holds the field. Harsanyi's view dominates welfare economics, while Rawls's view remains foundational in political philosophy. The tension between efficiency (utilitarianism) and fairness/priority (Rawlsianism) is the active fault line in contemporary theories of justice.
