  Diagnosis

  You've spotted the equivocation correctly: the argument slides between "unit of selection" (the causal object interacting with the environment) and "unit of evolution" (the replicator whose frequency is the ledger). Your student's Step (1) correctly identifies the process as level-neutral, applying to any entity with variation, inheritance, and fitness. But Step (3) redefines "selection for X" purely as "X's frequency gets tracked." This is the leak. If selection is defined solely by frequency change, then any aggregate whose frequency shifts—including gene pools or species—qualifies as a unit of selection, licensing the "good of the species" conclusions you both reject.

  The fix is to reinterpret Step (4). The student infers from the stability of genes (2) and the bookkeeping of frequency (3) that all selection is *ontologically* selection of genes. This conflates the beneficiary (the gene) with the vehicle (the organism). By reinterpreting (4) to claim that genes are the exclusive *replicators* and *beneficiaries*, rather than the exclusive *objects* of selection, you block the gene-pool consequence. Gene pools change frequency, but they do not replicate with fidelity; thus, they are not units of evolution, even if their statistics shift. This preserves your Williams-style distinction: selection acts on organisms (keeping 1), but the evolutionary record is kept in genes (keeping 5), without granting causal status to aggregates that don't replicate.

  You must also flag Step (2) as contingent. Her claim that only genes survive meiosis unbroken is empirically false for asexual lineages, where whole genomes persist. Reinterpreting (2) to focus on "fidelity of replication" rather than "survival of meiosis" universalizes the argument without sacrificing the gene's special status as the primary replicator in sexual taxa.

