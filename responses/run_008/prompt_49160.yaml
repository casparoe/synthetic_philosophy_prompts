  | Step | Verdict | Cost |
  | :--- | :--- | :--- |
  | (1) | Keep | You commit to multi-level selection as a causal possibility, even if genes are the only replicators. |
  | (2) | Reinterpret | You must define replicators by fidelity rather than meiotic survival to cover asexual lineages. |
  | (3) | Reinterpret | You must distinguish frequency change from selection proper, requiring a strict replicator criterion. |
  | (4) | Reject | You concede that organism-level selection is causally real, not merely shorthand for gene competition. |
  | (5) | Keep | You maintain that group-level explanations are translatable to gene-frequency accounts without explanatory loss. |
