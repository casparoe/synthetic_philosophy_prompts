answer: |-
  Hi there, this is a fantastic topic for a section because it forces students to confront the gap between their intuitions and their justifications, and you are right to be worried about the sequencing because if you get the order wrong you either bore them with neuroscience or accidentally commit them to ableism before they realize what is happening. Here is how I would structure the fifty minutes, keeping in mind that you need to separate the empirical claim from the normative claim and then handle the fallout. I would start by explicitly surfacing the intuition they arrive with, which is that humans matter more than other animals because we have big brains, and write that on the board as a premise. The first move has to be empirical because if the premise is factually false, the moral argument collapses immediately, so you need to bust the correlation between raw brain size and cognitive capacity before you ask whether capacity matters morally. This is where the whale and elephant data belongs, not as the core moral example but as the empirical wrecking ball. You show them that sperm whales have brains five times heavier than humans but do not write symphonies or build telescopes, and you establish as settled science that within humans, brain size correlates only weakly with intelligence and varies by sex without implying moral difference. This heads off the first misconception you predicted, the bigger equals smarter equals counts for more chain, by breaking the first link. You need to be clear here that this empirical stuff is not in dispute among neuroscientists, whereas the moral implications are heavily contested, so you are not asking them to decide the science but to accept it as the background for the ethics.

  Once you have established that brain size is a bad proxy for capacity, you pivot to the normative question, which is whether brain size would matter even if it did not track capacity, or whether capacity itself is what matters. This is where your selective breeding thought experiment is superior to the whale example for the core of the section. The whale example allows students to retreat to the position that whales are secretly smart and we just do not know it, which lets them keep the capacity view without discomfort, but your example of humans with smaller brains but identical cognition forces them to isolate size from capacity within the species they already grant moral status to. If they say these smaller-brained humans matter less, they are committed to size mattering intrinsically, which seems absurd, and if they say they matter the same, they have admitted that size was only ever valuable as a proxy for capacity. You should run this thought experiment right after the empirical bust because it transitions them from is to ought. However, you need to be careful not to present the capacity view as the consensus winner here. It is a live fight in bioethics whether cognitive capacities ground moral status or whether species membership or sentience does, so you must frame this as if you accept the capacity view, then size is irrelevant, but if you hold a species-based view, size might be irrelevant for different reasons. This distinction protects you from presenting a contested normative claim as settled fact.

  Now regarding the ableism trap, do not head it off before the capacity view is articulated, because if you warn them away from it too early you signal that the argument is dangerous rather than substantive, which collapses the inquiry, but you also cannot let it sit unaddressed until the end. The right moment to introduce it is immediately after they agree that capacity is what matters in your thought experiment. Once they commit to the idea that cognitive capacity grounds moral worth, you ask them what that implies for humans with significant cognitive disabilities or degenerative conditions. You do not need to solve this in fifty minutes, but you must force them to see the cost of the view they just endorsed. Some students will try to use the equal dignity objection here to shut down the conversation, claiming all humans have equal worth regardless of capacity, and you should allow that but label it correctly as a competing theoretical framework, often called a sanctity of life or species membership view, rather than a trump card that ends the debate. You want them to see that they are choosing between a view that risks excluding some humans but includes some animals versus a view that includes all humans but might exclude some animals, and that brain size is largely irrelevant on both accounts once the empirical data is in. This handles your second misconception by showing that appealing to equal dignity is a substantive ethical claim that needs defense, not just a slogan.

  As for what to refuse to explain, you are correct to skip encephalization quotients and specific clinical cases. You should state openly at the start that you are bracketing the complex neuroscience of how brain structure relates to function because the section is about moral reasoning, not neurology, and that you are also avoiding specific clinical cases involving cognitive impairment because those require careful handling beyond the scope of an intro section. This models intellectual honesty and keeps the focus on the logical structure of the argument. If a student pushes for the neuroscience, remind them that even if the neuroscience were different, the moral question of why that biology matters would remain. You need to keep the settled stuff separate from the contested stuff throughout, so reiterate that the weak correlation between size and intelligence is settled, but whether intelligence determines moral status is not. You do not want them leaving thinking you proved that animals deserve equal rights, but rather that the common justification for human exceptionalism based on brain size is empirically weak and morally complicated.

  For the check question at the end, you need something that tests whether they understand the proxy distinction rather than just memorizing the conclusion. I would ask them to consider a scenario where we discover an alien species with tiny brains but hyper-advanced technology and language, and ask whether their small brains give us reason to treat them as morally inferior. If they say yes, they missed the point about size being a proxy, and if they say no, ask them to justify why without appealing to capacity, since the aliens clearly have capacity. This forces them to articulate whether they think size has intrinsic weight or merely instrumental weight. Finally, keep the tone collegial and open throughout, acknowledging that these are hard questions that philosophers still disagree on, because if you present yourself as having the settled answer you will lose the students who feel the intuitive pull of the opposing view. Your goal is not to convince them that brain size is irrelevant, but to convince them that their current belief in its relevance is under-specified, and that is a win for a fifty-minute section.
