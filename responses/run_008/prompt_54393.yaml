prompt: |-
  I'm a grad student TAing an intro bioethics course mostly taken by non-majors, and next week I've got one fifty-minute section on whether brain size is morally relevant. Not the explanation itself, to be clear -- I want a teaching plan. The order things have to go in and why, since some of this has to be in place before the question even looks like a question: the students will arrive having vaguely absorbed that humans have big brains and that this is why we matter, so I suspect something has to get disentangled first, maybe the difference between brain size mattering in itself versus being a proxy that tracks something else that matters, but I'm not sure that distinction should come before or after the empirical stuff about how badly size actually predicts anything (whales, elephants, the weak within-human correlation).

  Then the carrying example. I've been toying with a scenario of my own: suppose selective breeding or some future intervention produced humans over many generations with substantially smaller brains who are cognitively indistinguishable from everyone else -- my hunch is that's better than the obvious whale/elephant route, because the whale example lets students conclude "oh, elephants are just smart, size was a stand-in the whole time" and never face the real question, which is whether the thing size was standing in for is what matters morally. But I'd like a second opinion on which example should carry the whole session, and what it needs to have and to lack.

  Misconceptions: I can predict two and want to know where in the sequence each should be headed off. One is "bigger brain = smarter = counts for more, morally" and the overcorrection where someone announces that brain size is obviously irrelevant and intelligence too because all humans have equal dignity, which just assumes the conclusion. The one that worries me is the ableism trap: once you teach that capacities matter for moral status, some student applies it to people with cognitive disabilities right there in section. Do I head that off early, or does heading it off early collapse the whole question before it's been asked? Where exactly does it go?

  Also tell me what to refuse to explain at this level -- I assume the neuroscience of encephalization quotients is out, maybe also any real clinical cases, and I should say openly that I'm skipping them rather than pretend they don't exist. One check question at the end that would show whether the distinction between a proxy and the thing itself actually landed, not just whether they got the right vibe.

  Two constraints on your answer. Write it as continuous prose, no headings, no bullet points, no bold, like a long email from a colleague -- I'll be reading it on my phone between sections. And keep settled stuff separate from contested stuff: what's genuinely not in dispute among people who know this area versus what's a live fight, e.g. whether cognitive capacities matter to moral status at all versus whether many animals are sentient, and don't let a contested view masquerade as the consensus in my lesson plan. If some pedagogical choice of mine rests on a contested assumption, say so.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Grad student TAing an intro bioethics course (mostly non-majors).
      *   **Task:** Create a teaching plan for a 50-minute section on "whether brain size is morally relevant."
      *   **Format:** Continuous prose, no headings, no bullet points, no bold. Like a long email from a colleague. (Crucial constraint).
      *   **Content Requirements:**
          *   Order of operations (what comes before what and why).
          *   Disentangle "brain size matters in itself" vs. "brain size as a proxy."
          *   Evaluate the user's proposed example (selective breeding for smaller brains but same cognition) vs. whale/elephant examples.
          *   Address two specific misconceptions: (1) Bigger = Smarter = More Moral Worth, (2) Overcorrection (All humans equal dignity, so size/intelligence irrelevant).
          *   Address the "ableism trap" (applying capacity views to people with cognitive disabilities). When to head this off?
          *   What to refuse to explain (neuroscience details, clinical cases).
          *   One check question at the end to test the proxy vs. thing distinction.
          *   Distinguish settled stuff vs. contested stuff (don't mask contested views as consensus).
      *   **Tone:** Colleague-to-colleague, supportive, practical, philosophically precise.

  2.  **Deconstruct the Philosophical/Pedagogical Problem:**
      *   *Core Issue:* Is brain size morally relevant?
      *   *Underlying Issue:* What grounds moral status? (Species membership? Capacities? Sentience?)
      *   *Proxy Problem:* Brain size is often thought to matter because it tracks intelligence/capacity. If it doesn't track capacity well (empirical fact), does it still matter? If it tracks capacity, does capacity matter?
      *   *Ableism Risk:* If capacity matters, do humans with lower capacity matter less? This is the danger zone for an intro class.
      *   *User's Example:* Humans with smaller brains but same cognition. This isolates size from capacity. Good for testing if size *itself* matters.
      *   *Whale Example:* Tests size vs. capacity across species. Might let students off the hook by saying "whales are smart too."
      *   *Sequence:* Need to establish the intuition -> test the empirical link -> test the moral link -> address the ableism risk -> conclude.

  3.  **Drafting - Section by Section (Mental Outline):**
      *   *Opening:* Acknowledge the difficulty, validate the user's instincts.
      *   *Structure/Order:* Start with the intuition (big brains = special), then hit the empirical data (size doesn't track well), then move to the normative question (does it matter if it doesn't track?).
      *   *The Example:* Advocate for the user's "smaller brain human" thought experiment over the whale one for the core argument, but use whales to bust the empirical link first. Explain why: whales separate size from capacity across species, but the human case separates size from capacity *within* the moral community we care about.
      *   *Misconceptions:*
          *   "Bigger = Smarter = More Worth": Address this early with the empirical data.
          *   "All Humans Equal Dignity": Address this later as a competing theory (species membership vs. capacities), not as a trump card that stops inquiry.
          *   Ableism: This is the trickiest. Don't head it off so early it kills the question, but don't let it sit unaddressed. Put it after the capacity view is established but before concluding. Frame it as a *reductio* or a boundary condition.
      *   *What to Skip:* Encephalization quotients, specific clinical cases. Acknowledge the skip.
      *   *Settled vs. Contested:* Empirical link (size vs. intelligence) is mostly settled (weak correlation). Normative link (capacity vs. moral status) is highly contested. Don't present capacity views as the only game in town.
      *   *Check Question:* Needs to target the proxy distinction.
      *   *Formatting:* Continuous prose. No breaks.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Constraint Check:* No bullet points. No bold. No headings. Must look like an email.
      *   *Tone Check:* Keep it conversational but rigorous. "Here's how I'd run it..."
      *   *Ableism Timing:* If I bring it up too early, students won't engage with the capacity argument. If I bring it up too late, damage is done. Best place is after establishing the "capacity view" but before finalizing the verdict on brain size. Frame it as "If you hold view X, you face problem Y."
      *   *The User's Example:* It's strong. It forces the question: If capacity is held constant, does size matter? Most will say no. Then ask: Why did we think it mattered before? Because we thought it tracked capacity.
      *   *Settled/Contested:* Be clear that neuroethics doesn't agree on what grounds moral status. The class should leave knowing *why* people disagree, not that there is one answer.
      *   *Length:* Needs to be substantial enough to cover all points but flow naturally.

  5.  **Drafting the Prose (Iterative process):**
      *   *Start:* Hi [Name], great topic, tricky terrain.
      *   *Sequence:* Start with the intuition. Then the empirical bust (whales/elephants). Then the normative shift (proxy vs. intrinsic). Then the thought experiment (smaller brain humans). Then the ableism trap. Then the conclusion.
      *   *Misconceptions:* Weave them into the sequence. The "Bigger=Smarter" one gets busted by the empirical data. The "Equal Dignity" one gets treated as a rival theory (speciesism vs. capacitarianism).
      *   *Ableism:* Handle carefully. Don't shut down the capacity view, but show its costs.
      *   *Skip List:* Mention EQ and clinical cases explicitly as things to name and skip.
      *   *Check Question:* Formulate a specific scenario.
      *   *Formatting:* Ensure no line breaks that look like headers. Just paragraphs.

  6.  **Final Review against Constraints:**
      *   Continuous prose? Yes.
      *   No headings/bullets/bold? Yes.
      *   Colleague email tone? Yes.
      *   Settled vs. Contested distinguished? Yes.
      *   Check question included? Yes.
      *   Ableism addressed? Yes.
      *   User's example evaluated? Yes.

      *(Self-Correction on "Continuous Prose"):* I need to make sure I don't use any markdown formatting that looks like structure. Just plain text paragraphs.

      *(Refining the Ableism point):* The user asks "Do I head that off early, or does heading it off early collapse the whole question?" My advice should be: Don't head it off *before* the question is asked, but address it as a consequence of the answer. If you say capacity matters, you must answer the disability challenge. Don't use the disability challenge to shut down the capacity question prematurely.

      *(Refining the Example):* The user's "smaller brain human" example is better for the *moral* question. The whale example is better for the *empirical* question. I should suggest using both but for different purposes.

      *(Refining Settled/Contested):* Make sure to note that "capacity matters" is a contested view (contractualism, utilitarianism vs. sanctity of life, species relativism). Don't teach it as fact.

      *(Final Polish):* Check word flow. Ensure it sounds like a human writing to another human.

