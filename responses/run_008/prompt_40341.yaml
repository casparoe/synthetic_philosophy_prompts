prompt: |-
  quick background: i'm a legislative analyst who used to be a public defender. my whole working vocabulary is criminal law stuff -- elements of an offense, actus reus, harm principle, victimless crimes, selective enforcement, overbreadth, charging discretion, general deterrence, collateral consequences. i know Bentham wrote some genuinely radical stuff on sexual morality back in the 1780s, mainly the unpublished essay arguing that sex between men shouldn't be punished (never came out in his lifetime, only surfaced in the 20th century -- i gather he was too cautious to publish it, which honestly makes it more interesting), plus the shorter thing usually printed under a title like Offences Against One's Self about masturbation. and i know the vibe: pure felicific-calculus utilitarianism, no natural law, anti-clerical to the bone.

  what i want: pretend you're a historian of utilitarian thought who also knows criminal law doctrine cold, and translate Bentham's actual arguments into my vocabulary, move by move. not the sanitized "he was an early advocate of decriminalization" summary -- the actual machinery of the argument. so e.g. where exactly does he locate the harm element of the offense, what does he say the claimed externality is, how he treats the "it's unnatural" line (his point that procreation isn't the end of sex, and that nature attached pleasure to the act regardless -- where does that even slot into an elements analysis?), what he'd say about the evidentiary and enforcement problems of policing private consensual conduct, and that strange arguement of his about punishing people for a "taste" they can't change, which reads to me like a proto-cruelty claim and not really a utilitarian one at all. also tell me honestly if the felicific calculus part doesn't map onto anything a legislative analyst would recognize as a reason to keep or scrap a statute.

  then the part i actually care about, the residue report: which of his moves translate cleanly into legal-vocabulary arguments we still make today, which ones only translate with distortion, and which have no expression at all in the harm-principle / elements / externality framework. and then a verdict on the residue: where the translation fails, is it because criminal-law vocabulary is missing something Bentham had (interpersonal pleasure aggregation? the cruelty point?), or because Bentham's arguments were doing work that wouldn't survive scrutiny anyway? like, would his own utilitarian framework, translated into modern cost-benefit terms about enforcement and deterrence, actually get him to decriminalization, or is his conclusion running on stuff (empirical hunches, sympathy, the anti-clericalism) that the calculus doesn't capture?

  please think carefully before writing and maybe start with a quick brainstorm of his main moves so the translation is systematic and i can see nothing got dropped. i'd rather have an honest "this part doesn't fit" than a forced mapping that smuggles in modern assumptions and calls it Bentham. no citations or reading lists needed, i can't look stuff up rn, just your actual knowledge. take your time and be blunt about the weak points of his case too -- i'm not looking for a hagiography of the guy.
