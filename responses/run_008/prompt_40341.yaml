answer: |-
  Here is the brainstorm of Bentham's main argumentative moves regarding "paederasty" (his term) and "onanism," structured for translation into your doctrinal vocabulary.

  ### Brainstorm: Bentham's Argumentative Moves

  1.  **The Victimlessness Claim:** No non-consenting party suffers pain. No property damage. No breach of contract.
  2.  **The "Nature" Rebuttal:** The statutory element "against nature" is incoherent. Nature dictates pursuit of pleasure; therefore, pleasurable acts are *by definition* natural. Procreation is not the exclusive teleological end of sex.
  3.  **The Efficacy/Deterrence Claim:** Punishment cannot alter "taste" (sexual orientation). Therefore, the statute is incapable of achieving its stated behavioral modification goal.
  4.  **The Enforcement Cost/Benefit:** Policing private conduct requires intrusive surveillance, encourages blackmail (private enforcement), and consumes disproportionate judicial resources relative to public safety gain.
  5.  **The Religious Jurisdiction:** The prohibition originates in ecclesiastical law (sin), not civil utility (crime). It is a jurisdictional error to enforce church dogma with state violence.
  6.  **The Population Empiricism:** The claim that homosexuality reduces population is empirically false (it doesn't reduce the drive of others to procreate, nor does it remove enough actors to impact demographics).
  7.  **The Severity Mismatch:** The punishment (death, in his time) is grossly disproportionate to the "mischief," creating a net negative in the felicific calculus due to excessive pain inflicted.

  ***

  ### The Translation: Bentham into Criminal Law Doctrine

  Here is the machinery of his argument, translated into the vocabulary of a legislative analyst and former PD.

  **1. The Harm Element and *Actus Reus***
  Bentham attacks the *corpus delicti*. In modern terms, he argues the statute lacks a legitimate *actus reus* because the "act" is devoid of the requisite social harm. He locates the harm element strictly in **pain inflicted on a sentient being without consent**. Since the participants are consenting and derive pleasure (positive utility), the *actus reus* is null.
  *   **The Move:** He treats the "harm" alleged by the state (corruption of morals, offense to God) as **non-cognizable injuries**. They are not utilitarian harms. If there is no victim, there is no crime. He effectively argues for a statutory requirement of **ascertainable victimization** as a necessary element of any criminal offense.

  **2. The "Unnatural" Element and *Mens Rea***
  Statutes often rely on "unnatural" as a definitional element. Bentham dismantles this by attacking the legislative intent behind the definition.
  *   **The Move:** He argues that "Nature" is not a normative standard but a descriptive one. If nature attached pleasure to the act, nature sanctioned it. By arguing that procreation is not the sole end of sex, he is challenging the **rational basis** of the statute. He is saying the state's interest (population growth) is not compelling enough to override individual liberty, and the means (banning non-procreative sex) is not narrowly tailored because pleasure is an independent biological good.
  *   **Doctrinal Slot:** This is a **void-for-vagueness** argument disguised as metaphysics. If "natural" means "what happens," the act is natural. If "natural" means "what the clergy say," it's religious law, not civil law.

  **3. Enforcement, Selective Prosecution, and Blackmail**
  This is where your PD background will resonate most. Bentham anticipates *Lawrence v. Texas* enforcement concerns by 150 years.
  *   **The Move:** He argues that policing private consensual conduct creates a **market for blackmail**. Because the crime is secret, the threat of exposure becomes a private weapon. This creates a secondary crime wave (extortion) that the statute itself generates.
  *   **Doctrinal Slot:** This is an **administrative burden / chilling effect** argument. The cost of enforcement (intrusion into the home, surveillance) outweighs the benefit. It also highlights **selective enforcement**: because everyone is technically guilty (given the prevalence of the "taste"), the state can pick and choose targets, leading to arbitrary application of law.

  **4. The "Taste" Argument (Status vs. Conduct)**
  You flagged this as proto-cruelty. Bentham frames it differently: **Inefficacy of Deterrence**.
  *   **The Move:** He argues the "taste" is involuntary. If the propensity is fixed, the threat of punishment cannot deter the conduct.
  *   **Doctrinal Slot:** This is not quite *Robinson v. California* (punishing status). It's closer to an **incapacity defense**. If the actor cannot conform their conduct to the law due to an immutable characteristic, the law is functionally useless. However, you're right to sense a cruelty claim: Bentham notes the immense pain of punishment inflicted on someone who has done no harm to others. He calculates the **severity of sanction** against the **gravity of the offense**. Since gravity is zero (no victim), any punishment is excessive.

  **5. The Felicific Calculus as Legislative Analysis**
  Does the calculus map? Yes, but with a specific variable modern analysts drop.
  *   **The Move:** Bentham sums the pleasure of the actors + the pleasure of the public (security) minus the pain of punishment - the pain of enforcement.
  *   **Doctrinal Slot:** This is **Cost-Benefit Analysis (CBA)**.
      *   *Benefit:* Sexual gratification (private utility).
      *   *Cost:* Risk of pregnancy/STIs (which he argues are manageable or negligible compared to hetero sex), Pain of Punishment, Cost of Enforcement.
      *   *Net:* Positive utility for decriminalization.

  ***

  ### The Residue Report

  Here is the honest assessment of where the translation holds and where it breaks.

  **1. Clean Translations (The Strong Case)**
  *   **Enforcement Costs & Blackmail:** This translates perfectly. Modern legislative analysts kill bills based on "unintended consequences" and "enforcement feasibility." Bentham's argument that criminalization creates a blackmail market is a pragmatic, non-moral argument that fits cleanly into modern policy analysis.
  *   **Lack of Ascertainable Victim:** This maps to the **Harm Principle**. While modern law allows for "public order" offenses, the core criminal law doctrine still struggles to justify punishment without a victim. Bentham's insistence on this is doctrinally sound.
  *   **Disproportionate Penalty:** The argument that the punishment (death/imprisonment) outweighs the mischief is a standard **proportionality review**.

  **2. Translations with Distortion (The Weak Case)**
  *   **The "Nature" Argument:** This distorts badly. Modern criminal law does not care if an act is "natural." We punish drunk driving (unnatural?) and regulate food safety. Bentham spends a lot of energy proving the act is "natural" to defeat the "unnatural" element. A modern analyst would say: *Who cares?* The only relevant question is harm. Bentham fights on the enemy's metaphysical turf here, which weakens the utilitarian purity.
  *   **The "Taste" / Involuntariness:** As noted, this wobbles between "you can't deter this" (utilitarian) and "it's cruel to punish this" (retributive/rights-based). Bentham wants to stay utilitarian (punishment is useless pain), but it reads like a rights claim (punishment is unjust). In modern vocabulary, we'd say this is an **Equal Protection** argument (class of people), which Bentham doesn't have. He only has the **Inefficacy** argument.

  **3. No Expression (The Missing Vocabulary)**
  *   **Aggregation of Private Pleasure:** This is the big one. Modern legislative analysis **cannot** count sexual pleasure as a statutory benefit. If you wrote a memo today saying "This bill should pass because it allows 5,000 people to masturbate without fear," you would be laughed out of the chamber.
      *   *Why:* Modern law treats liberty as a **negative right** (freedom *from* interference), not a **positive utility** (freedom *to* enjoy). Bentham counts the pleasure as a positive credit in the ledger. We only count the removal of pain (imprisonment) as a credit. We lack the vocabulary to legislate for *joy*, only against *harm*.
  *   **Anti-Clerical Jurisdiction:** Bentham argues this is church law masquerading as state law. Modern Establishment Clause jurisprudence covers this, but in a legislative analyst's CBA, "religious origin" is not a valid reason to scrap a statute if there is a secular rationale available. Bentham thinks the religious origin *invalidates* the utility. Modern secularism says: *Ignore the origin, look at the current effect.*

  ***

  ### The Verdict

  **Where the translation fails:**
  It fails on the **Aggregation of Pleasure**. Bentham's calculus requires us to weigh the sexual satisfaction of the offenders as a "good" that the state should promote (or at least not hinder). Modern criminal law vocabulary is structurally incapable of this. We can argue "no harm," but we cannot argue "positive social utility from sodomy." The vocabulary is missing the **interpersonal pleasure aggregation** variable. We treat privacy as a shield, not a source of utility.

  **Where the "Cruelty" Point lands:**
  You asked if the "taste" argument is proto-cruelty. **Yes.** Bentham's utilitarianism cracks here. When he describes the anguish of the punished individual who "cannot help" their desire, he slips from "this punishment produces no deterrence" to "this punishment is monstrous." The calculus doesn't capture the **moral weight of punishing the innocent** (in a utilitarian sense, they are innocent of harm). The calculus only captures the *waste* of punishment. The *injustice* is a non-utilitarian residue that Bentham can't fully articulate without breaking his own framework.

  **Does the Calculus actually get him to Decriminalization?**
  **Yes, but it relies on empirical hunches.**
  If you run a strict modern CBA on Bentham's terms:
  *   *Cost of Enforcement:* High (surveillance, courts).
  *   *Cost of Punishment:* High (prison, execution).
  *   *Benefit of Prohibition:* Negligible (no proven link to population decline or public violence).
  *   *Benefit of Decriminalization:* High (removal of enforcement costs, removal of blackmail market).

  The math works. **However**, the "Benefit of Prohibition" relies on 18th-century empirical claims (e.g., does this weaken the military? does this reduce birth rates?). Bentham dismisses these as superstition. A modern analyst would demand data. Bentham's conclusion is correct, but his dismissal of the state's interest relies on his own **empirical hunches** about human nature, not hard data.

  **The Anti-Clericalism Factor:**
  You asked if the conclusion runs on sympathy/anti-clericalism. **Absolutely.** The felicific calculus provides the *structure*, but the *inputs* are driven by Bentham's personal revulsion at religious interference and his personal sympathy for the outcast. A hardline utilitarian in 1780 could have argued that the *public disgust* caused by knowledge of the act outweighs the private pleasure of the act (the "offense principle"). Bentham arbitrarily assigns zero weight to public disgust. That is not calculus; that is a **normative choice** to ignore majoritarian moral preferences.

  **Final Blunt Assessment:**
  Bentham's machinery is 80% modern legislative analysis (enforcement costs, lack of victim, disproportionality). The remaining 20% is where he asks us to count private pleasure as a public good and ignore public moral outrage. That 20% is where his utilitarianism is doing heavy lifting that the vocabulary can't support. He isn't just analyzing the law; he's trying to re-engineer the concept of "harm" to exclude moral offense. That's a political move, not a mathematical one.

  As a legislative analyst today, you could use his enforcement and victimlessness arguments to kill the bill. You could not use his "pleasure aggregation" argument to pass a bill protecting it. You'd have to hide that part behind "Liberty" or "Privacy" rights language, which is essentially code for "Bentham's Pleasure Calculus" that we agreed not to say out loud.
