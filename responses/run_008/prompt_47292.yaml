answer: |-
  ### Final Exam Question: Game Theory 301

  **Question 4 (20 Marks)**

  Consider a strategic game where the Row player has strategies $\{T, M, B\}$ and the Column player has strategies $\{L, C, R\}$. The Row player's payoffs are given by the following matrix (Column's payoffs are omitted as we are analyzing Row's dominance conditions):

  | | L | C | R |
  | :--- | :---: | :---: | :---: |
  | **T** | 0 | 0 | 0 |
  | **M** | 3 | 3 | −1 |
  | **B** | −1 | −1 | 3 |

  **(a) [6 Marks]** Show that strategy $T$ is not strictly dominated by any *pure* strategy available to Row, but is strictly dominated by a mixed strategy $\sigma$ that plays $M$ and $B$ with equal probability ($0.5$ each). Calculate the expected payoffs to verify this.

  **(b) [14 Marks]** A classmate makes the following claim regarding the Iterated Elimination of Strictly Dominated Strategies (IESDS) when mixed dominators are allowed:

  > "In part (a), you showed $T$ is dominated by a mix of $M$ and $B$. But what if $M$ or $B$ gets eliminated in a later round? Allowing mixed domination makes the elimination process order-dependent and can accidentally delete Nash Equilibrium strategies, because the dominating mixture might itself be pruned later, creating a circular logic error."

  Evaluate this claim precisely. In your answer, address whether IESDS with mixed strategies is order-independent, whether it preserves Nash Equilibria, and why the potential future elimination of $M$ or $B$ does not invalidate the elimination of $T$. Contrast this with the case of *weak* dominance.

  ***

  ### Model Answer

  **(a) Verification of Dominance**
  To check for pure strict dominance, we compare $T$ against $M$ and $B$ across all columns.
  Against $M$: $u(T)=(0,0,0)$ and $u(M)=(3,3,-1)$. While $3>0$ for $L$ and $C$, $-1<0$ for $R$. Thus, $M$ does not strictly dominate $T$.
  Against $B$: $u(T)=(0,0,0)$ and $u(B)=(-1,-1,3)$. While $3>0$ for $R$, $-1<0$ for $L$ and $C$. Thus, $B$ does not strictly dominate $T$.
  Since no single pure strategy yields a higher payoff in every column, $T$ is not purely dominated.

  Now consider the mixed strategy $\sigma = 0.5M + 0.5B$. The expected payoff vector is:
  *   Against $L$: $0.5(3) + 0.5(-1) = 1$
  *   Against $C$: $0.5(3) + 0.5(-1) = 1$
  *   Against $R$: $0.5(-1) + 0.5(3) = 1$
  Comparing $\sigma$ to $T$: The payoff $1$ is strictly greater than $0$ in all columns ($L, C, R$). Therefore, $\sigma$ strictly dominates $T$.

  **(b) Evaluation of the Claim**
  The classmate's claim is **false** regarding strict dominance, though it correctly describes properties of *weak* dominance.

  **1. Order Independence and NE Preservation:**
  A fundamental theorem of game theory states that the order of elimination in IESDS does not matter, and the process never eliminates a strategy played with positive probability in a Nash Equilibrium (NE). This holds true even when strategies are dominated by *mixed* strategies. The set of strategies surviving IESDS is unique. The classmate is conflating the properties of *strict* dominance with *weak* dominance. Iterated Elimination of *Weakly* Dominated Strategies (IEWDS) is indeed order-dependent and can eliminate NE strategies. However, because strict dominance requires payoffs to be strictly higher ($>$) rather than weakly higher ($\geq$), no NE strategy can ever satisfy the condition for elimination.

  **2. The "Circularity" Worry:**
  The student worries that if $M$ or $B$ (the support of the dominating mixture) are eliminated later, the elimination of $T$ becomes invalid. This misunderstands the iterative definition. IESDS proceeds in rounds. In Round 1, given the full strategy set, $T$ is strictly dominated by $\sigma$. $T$ is removed. In Round 2, we assess the remaining strategies ($M, B$) against the remaining opponent strategies. If $M$ is later eliminated, it is because $M$ is strictly dominated in the *reduced* game.
  This does not retroactively validate $T$. The logic is not circular; it is sequential. Furthermore, if $M$ and $B$ are part of a Nash Equilibrium of the original game, they *cannot* be strictly dominated in any reduced game derived from IESDS. Therefore, the "dominating mixture" will not be pruned if it supports an equilibrium. If it is pruned, those strategies were not part of any NE to begin with, and eliminating $T$ remains valid.

  **Conclusion:**
  Allowing mixed strategies as dominators expands the set of eliminable strategies (as seen in part a) but does not break the invariance or NE-preservation properties of IESDS. The classmate's intuition applies only to weak dominance.

  ***

  ### Marking Scheme (Total 20 Marks)

  **Point 1: Pure Dominance Verification (4 Marks)**
  *   **Criteria:** Correctly shows $M$ fails to dominate $T$ at column $R$ AND $B$ fails to dominate $T$ at columns $L/C$.
  *   **Common Error:** Students claim $M$ dominates $T$ because the average is higher, ignoring the strict definition requires *every* outcome to be better. (-2 marks)

  **Point 2: Mixed Dominance Calculation (4 Marks)**
  *   **Criteria:** Correctly calculates expected payoff of $0.5M+0.5B$ as $(1, 1, 1)$ and compares to $(0,0,0)$ to show strict inequality.
  *   **Common Error:** Arithmetic errors in the weighted sum (e.g., calculating $0.5 \times 3 + 0.5 \times -1 = 2$). (-2 marks)

  **Point 3: Order Independence Distinction (4 Marks)**
  *   **Criteria:** Explicitly states that IESDS (Strict) is order-independent, even with mixed strategies. Identifies that the student is confusing Strict with Weak dominance properties.
  *   **Common Error:** Agreeing with the student that order matters for strict dominance, or failing to mention weak dominance as the source of the confusion. (-4 marks)

  **Point 4: Nash Equilibrium Preservation (4 Marks)**
  *   **Criteria:** States clearly that no strategy played in a Nash Equilibrium can be strictly dominated (pure or mixed). Thus, IESDS cannot "accidentally delete" an NE strategy.
  *   **Common Error:** Claiming that NE strategies *can* be eliminated by strict dominance, or confusing this with the concept of rationalizability. (-2 marks)

  **Point 5: Addressing the "Circularity" Claim (4 Marks)**
  *   **Criteria:** Explains that elimination is sequential based on the *current* set of strategies. Later elimination of $M/B$ implies they were not NE strategies, so it doesn't invalidate $T$'s removal.
  *   **Common Error:** Arguing that $M$ and $B$ *must* be kept to justify keeping $T$, implying the dominance relation is retroactively voided. (-4 marks)

  ***

  ### Grader Notes & Verification Flags

  **Confidence Level:** High. The theoretical claims regarding IESDS (strict) being order-independent and NE-preserving with mixed strategies are standard results in intermediate game theory (e.g., Osborne & Rubinstein, Fudenberg & Tirole).

  **Verification Flags for Graders:**
  1.  **Course Definitions:** Ensure the course explicitly defined IESDS to allow mixed strategies as dominators. Some introductory courses restrict IESDS to pure dominators only. If your course did *not* cover mixed dominators in the main theorem, Point 3 and 4 may need adjustment.
  2.  **Arithmetic Check:** Verify the student's calculation in Part (a). $0.5(3) + 0.5(-1) = 1$. If a student calculates this as anything other than 1, they cannot earn Point 2.
  3.  **Strict vs. Weak:** The core of the essay question hinges on the Strict/Weak distinction. If a student argues the classmate is *correct* because they are thinking of Weak Dominance, they should only receive partial credit (Point 3) unless they explicitly clarify that the prompt specifies *Strict* dominance conditions (implied by the payoff structure $1 > 0$).
  4.  **Mark Split Dispute:** There is a potential dispute on Point 5. A sophisticated student might argue that if $M$ is eliminated, the mixture $\sigma$ is no longer feasible. A grader should award full marks if the student explains that feasibility is determined *at the step of elimination*, not retroactively. Deduct marks only if they claim the elimination of $T$ becomes invalid.
