          3.  Stocking-density limits for farmed crabs.
      *   **Constraint:** Be honest about unpopular answers and limitations (where the procedure can't settle things).

  2.  **Deconstruct the Core Idea (Probability-Weighted Welfare):**
      *   *Premise:* Sentience isn't a switch; it's a probability distribution based on available evidence.
      *   *Mechanism:* High confidence = High protection (Precautionary Principle). Low confidence = Low/No protection. Medium confidence = Proportional protection (cost-benefit analysis weighted by probability).
      *   *Challenge:* How to quantify "confidence" without requiring the committee to be neuroscientists?
      *   *Solution:* Use a scoring system based on established criteria for sentience (e.g., Cambridge Declaration on Consciousness, Birch et al. 2021 review for invertebrates).

  3.  **Drafting the Decision Procedure (The "Sentience-Weighted Welfare Protocol"):**
      *   *Goal:* Make it actionable for non-scientists.
      *   *Structure:*
          1.  **Triage:** Is there *any* evidence? (Stop if no).
          2.  **Evidence Scoring:** Break down sentience criteria into observable/verifiable buckets (Nociception, Learning, Trade-offs, Central Nervous System).
          3.  **Confidence Tiering:** Map scores to Tiers (High, Medium, Low).
          4.  **Requirement Scaling:** Map Tiers to Welfare Actions (Mandatory, Recommended/Incentivized, Voluntary/None).
          5.  **Cost-Benefit Check:** For Medium tiers, weigh welfare gain against economic feasibility.
          6.  **Veto/Escape Clause:** Where human judgment takes over (e.g., public perception, legal constraints).

      *   *Refining the Evidence Criteria:* Need to rely on the 2021 LSE review (Birch et al.) which is the gold standard for invertebrate sentience.
          *   Criteria: Nociceptors, Integrative Brain/Centralization, Behavioral Trade-offs, Opioid/Analgesic responses, Conditioning.
      *   *Refining the Scaling:*
          *   High Confidence -> Mandatory (Precautionary Principle applies fully).
          *   Medium Confidence -> "Best Effort" / Cost-Proportional (If cheap, do it. If expensive, incentivize).
          *   Low Confidence -> Monitoring/Research only.

  4.  **Running the Procedure on the Three Proposals:**

      *   **Case 1: Electrical Stunning for Farmed Salmon.**
          *   *Species:* Salmon (Vertebrate/Fish).
          *   *Evidence:* Overwhelming. Fish have nociceptors, opioids, show avoidance learning. Legal recognition in many jurisdictions.
          *   *Tier:* High Confidence.
          *   *Outcome:* Mandatory.
          *   *Committee Reaction:* Industry might hate the cost, but science is clear. Procedure says "Do it."

      *   **Case 2: Banning Eyestalk Ablation in Prawn Hatcheries.**
          *   *Species:* Penaeid Prawns (Crustacean/Decapod).
          *   *Evidence:* Strong for decapods (LSE review). Central nervous system, complex behavior, trade-offs. UK/Australia/EU moving toward recognition.
          *   *Tier:* High/Medium-High Confidence.
          *   *Outcome:* Mandatory (or phase-out).
          *   *Committee Reaction:* Hatcheries hate this (it's standard practice to induce molting). High economic impact. Procedure likely says "Ban," which will be unpopular.

      *   **Case 3: Stocking-Density Limits for Farmed Crabs.**
          *   *Species:* Farmed Crabs (e.g., Mud Crabs, Soft Shell).
          *   *Evidence:* Crabs are decapods (High sentience likelihood). *However*, stocking density welfare link is complex. Is crowding painful or just stressful?
          *   *Tier:* High Confidence in Sentience, Medium Confidence in *specific* welfare metric (density).
          *   *Outcome:* This is tricky. Sentience is high, but the *specific requirement* needs evidence that density causes suffering.
          *   *Refinement:* The procedure evaluates sentience first. If sentience is high, the burden of proof shifts to proving the practice *doesn't* harm.
          *   *Outcome:* Mandatory limits, but maybe with a grace period for research.
          *   *Committee Reaction:* Very hard to enforce. High cost.

  5.  **Critiquing and Polishing the Procedure:**
      *   *Tone:* Professional, objective, slightly cautious.
      *   *Clarity:* Use bolding, lists, and clear "Stop/Go" points.
      *   *Honesty:* I need to explicitly state where the procedure fails. It can't calculate exact costs. It can't resolve moral disagreements about *which* welfare outcomes matter (e.g., is a quick death better than a crowded life?).
      *   *The "Vibes" Check:* Ensure the evidence criteria are specific enough that they can't just guess. (e.g., instead of "Is it smart?" ask "Does it have opioid receptors?")

  6.  **Addressing the "Probability-Weighted" Aspect:**
      *   The prompt specifically asks for *scaled* protections.
      *   I need to make sure the "Medium Confidence" tier actually results in *scaled* requirements, not just a binary yes/no.
      *   *Idea:* Use a "Welfare Investment Ratio." If confidence is 50%, spend up to X% of margin. If 90%, spend whatever is technically feasible.
      *   *Actually, simpler:* High = Mandatory. Medium = Mandatory *if* cost is low, otherwise Incentivized. Low = Voluntary.

  7.  **Final Review against Constraints:**
      *   Committee non-scientists? Yes, keep language accessible.
      *   Three specific cases run? Yes.
      *   Honest about unpopular answers? Yes.
      *   Admit limitations? Yes.

  8.  **Drafting the Content (Iterative refinement during drafting):**
      *   *Self-Correction on Salmon:* Salmon are vertebrates. Sentience is legally assumed in most places. The procedure should reflect that this is a "High Confidence" baseline.
      *   *Self-Correction on Prawns:* Eyestalk ablation is a specific hormonal manipulation. The sentience link is: Does the prawn feel pain during/after? Evidence suggests yes.
      *   *Self-Correction on Crabs:* Stocking density is about chronic stress vs. acute pain. Sentience covers both. But the evidence linking *specific density* to *suffering* is weaker than the evidence for sentience itself. I need to distinguish "Sentience Confidence" from "Harm Confidence." The procedure should focus on Sentience Confidence, but acknowledge the Harm link.
      *   *Wait, one nuance:* The prompt asks for welfare requirements to scale with *sentience confidence*. So if sentience is 80% likely, the requirement is 80% as strict? No, that's hard to operationalize. Better: Sentience Confidence determines the *Precautionary Threshold*. High confidence = Precautionary Principle applies (assume pain until proven otherwise). Low confidence = Burden of proof is on the welfare advocate.
      *   *Revised Scaling:*
          *   Tier 1 (High): Mandatory compliance.
          *   Tier 2 (Medium): Mandatory compliance *unless* existential economic threat (with mitigation).
          *   Tier 3 (Low): Monitoring/Research only.

      *(Self-Correction)*: Let's stick closer to the flatmate's idea: "Scaled protections."
      *   High Confidence -> Full Protection (e.g., Stunning required).
      *   Medium Confidence -> Proportional Protection (e.g., Stunning required *where technically feasible*, otherwise training).
      *   Low Confidence -> Basic Needs Only (e.g., Water quality, no stunning req).

      *Okay, let's finalize the procedure steps.*
      1. Taxonomy Check.
      2. Evidence Scoring (The 5 Criteria).
      3. Confidence Tier Assignment.
      4. Requirement Scaling (The "Slider").
      5. Feasibility Override (The "Reality Check").

      *Let's write it.*

  9.  **Final Polish:** Check tone. Ensure it sounds like a tool for a committee, not a philosophy paper. Make sure the "Honest Assessment" section is punchy. (The prawn ablation ban will be the controversial one).

  **(Self-Correction during drafting the response):** I need to make sure I don't just give a "Yes/No" on the proposals, but show *how* the procedure got there. Also, I need to highlight where the procedure *stops* working (e.g., cost-benefit analysis is not scientific).

  Let's assemble the "Sentience-Confidence Scaling Protocol (SCSP)."

  *Step 1: The Sentience Scorecard.* (Simplified from Birch et al.)
