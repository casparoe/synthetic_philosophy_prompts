answer: |-
  # Handout: Distinguishing Contextualism from Pragmatic Encroachment
  **Reading Group Supplement | Hawthorne, Stanley & DeRose**

  ## 1. The Common Conflation
  It is frequently assumed that Epistemic Contextualism and Subject-Sensitive Invariantism (SSI)—often grouped under 'pragmatic encroachment'—are merely variant descriptions of the same phenomenon. Both agree that practical factors matter for knowledge ascriptions. However, they disagree fundamentally on *whose* practical factors matter and *how* they influence the truth of the ascription.

  This handout provides a worked example where the two theories yield **contradictory truth values** for the exact same sentence, uttered in the exact same context.

  ## 2. The Case Study: 'The Bridge and The Pub'

  ### The Facts (Fixed)
  *   **The Subject (Alex):** Last Tuesday, Alex needed to cross an old wooden bridge to get to a hospital. If the bridge collapsed, Alex would die. Alex glanced at the bridge for five seconds, saw no obvious rot, and formed the belief *the bridge is safe*. Alex crossed successfully.
      *   *Epistemic Position:* Moderate (casual visual inspection, no engineering report).
      *   *Practical Stakes:* Extremely High (Life or Death).
  *   **The Attributor (Blake):** Today, Blake is telling a story to friends in a pub. Blake is safe, warm, and has no interest in the bridge. Blake is recounting Alex's adventure.
      *   *Conversational Context:* Low Stakes / Relaxed. Error possibilities regarding the bridge are not salient.
  *   **The Utterance:** Blake raises a pint and says:
      > **"Alex knew the bridge was safe."**

  ### The Question
  Is Blake's utterance **True** or **False**?

  ---

  ## 3. View 1: Epistemic Contextualism
  *(Associated with: Keith DeRose, David Lewis, Stewart Cohen)*

  ### The Mechanism
  Contextualism holds that the word 'knows' is indexical. Its semantic content shifts depending on the **attributor's conversational context**.
  *   **Low-Stakes Context:** The standards for 'knows' are low. Mere casual evidence may suffice.
  *   **High-Stakes Context:** The standards for 'knows' are raised. Stronger evidence is required.

  ### The Verdict
  1.  We evaluate the truth of Blake's sentence relative to **Blake's context** (the pub).
  2.  In the pub, the possibility that the bridge was unsafe is not salient. The epistemic standard is low.
  3.  Did Alex meet the low standard? Yes. A casual glance suffices for 'knowledge' when the stakes of the *conversation* are low.
  4.  **Contextualist Conclusion:** Blake's utterance is **TRUE**.

  ### [Note on Contested Ground: The Disagreement Intuition]
  *Textbook Standard:* Contextualists agree that Blake speaks truly.
  *Contested Issue:* Does this capture our intuition about disagreement? If Alex (at the bridge) had said, "I don't know if it's safe," and Blake (now) says, "Alex knew," Contextualism implies they are not contradicting each other (they are using different standards). Many philosophers contest whether this adequately explains the feeling that Blake and Alex are disagreeing about the *same* fact.

  ---

  ## 4. View 2: Subject-Sensitive Invariantism (SSI)
  *(Associated with: Jason Stanley, John Hawthorne, Jeremy Fantl & Matthew McGrath)*

  ### The Mechanism
  SSI holds that the meaning of 'knows' is **invariant** (it does not change with the speaker's context). However, whether a subject *satisfies* the conditions for knowledge depends partly on the **subject's practical environment**.
  *   **The Threshold:** To know *p*, a subject must have evidence sufficient to warrant action given *their* stakes.
  *   **High-Stakes Subject:** The evidential threshold is raised. Casual evidence is insufficient.
  *   **Low-Stakes Subject:** The evidential threshold is lower.

  ### The Verdict
  1.  We evaluate the truth of Blake's sentence relative to the **fixed meaning of 'knows'**, applied to **Alex's situation**.
  2.  The meaning of 'knows' does not lower just because Blake is in a pub.
  3.  Did Alex meet the threshold? No. Given Alex's life-or-death stakes, a casual glance was not enough evidence to constitute knowledge. Alex acted on mere belief.
  4.  **SSI Conclusion:** Blake's utterance is **FALSE**.

  ### [Note on Contested Ground: Intellectualism]
  *Textbook Standard:* SSI proponents agree that Blake speaks falsely because Alex's stakes were too high for the evidence provided.
  *Contested Issue:* This view challenges 'Intellectualism' (the view that knowledge depends only on truth-related factors like evidence and reliability). Many epistemologists contest whether practical stakes can genuinely alter epistemic status. Furthermore, SSI faces challenges regarding 'retraction': If Blake learns about Alex's high stakes later, SSI predicts Blake should say, "I was wrong." Contextualism predicts Blake should say, "What I said was true, though misleading." Data on whether speakers naturally retract is currently contested.

  ---

  ## 5. Side-by-Side Comparison

  | Feature | Epistemic Contextualism | Subject-Sensitive Invariantism (SSI) |
  | :--- | :--- | :--- |
  | **What varies?** | The **semantic content** of 'knows' (the standard). | The **truth conditions** (via the subject's threshold). |
  | **Whose stakes matter?** | The **Attributor's** (Blake's) conversational context. | The **Subject's** (Alex's) practical environment. |
  | **Does 'knows' change meaning?** | **Yes.** It works like 'here' or 'tall'. | **No.** It is invariant. |
  | **Verdict on Blake's Utterance** | **TRUE** (Low standards in the pub). | **FALSE** (High standards for Alex at the bridge). |
  | **Handling Scepticism** | Explains why sceptical arguments seem persuasive (they raise standards). | Explains why sceptical arguments seem persuasive (they highlight high-stakes error possibilities). |

  ---

  ## 6. Discussion Questions for the Group

  1.  **The Retraction Test:** Suppose Blake hears the details of Alex's life-or-death situation after making the claim.
      *   If Blake says, *"Oh, I suppose I didn't know what I was talking about. I take it back,"* does this favour SSI?
      *   If Blake says, *"Well, strictly speaking, given where I was sitting, what I said was true,"* does this favour Contextualism?
      *   *[Contested]:* Experimental philosophers disagree on what ordinary speakers actually say in this scenario.

  2.  **The Disagreement Problem:**
      *   Imagine Alex, while on the bridge, says: "I do not know the bridge is safe."
      *   Blake, in the pub, says: "Alex knew the bridge was safe."
      *   Contextualism says these are compatible claims (different standards). SSI says they are contradictory (one is true, one is false). Which intuition is stronger for you?

  3.  **Encroachment vs. Context:**
      *   Hawthorne and Stanley argue that Contextualism cannot explain why *action* becomes irrational in high-stakes cases even if 'knowledge' ascriptions remain true in low-stakes contexts. SSI links knowledge directly to rational action. Does the Bridge case support this link?

  ---

  ## 7. Summary for the Handout
  *   **Contextualism:** Truth depends on the **Speaker's** context. (Blake is safe $\rightarrow$ 'Knows' is easy $\rightarrow$ **True**).
  *   **SSI:** Truth depends on the **Subject's** stakes. (Alex is at risk $\rightarrow$ 'Knows' is hard $\rightarrow$ **False**).
  *   **Crucial Distinction:** In this specific case, the two theories do not merely offer different explanations; they offer **opposite truth values** for the very same sentence.

  *(British English spelling check: characterise, colour, favour, realise, sceptical, programme, behaviour.)*
