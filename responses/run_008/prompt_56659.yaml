answer: |-
  ### Design Notes & Case Critique (For the Instructor)

  Before finalizing the tree, I evaluated your case requirements against the logical structure of the Special Composition Question (SCQ).

  **Critique of the Statue/Clay Case:**
  This is the trickiest requirement. The Statue/Clay case is traditionally used for the *Constitution Question* (Is the statue identical to the clay?), not the *Composition Question* (Do the clay particles compose an object?). Using it for SCQ risks confusing students about whether we are asking about *identity* or *existence*.
  *   **Fix:** In the handout, I have framed the question specifically around *artifact intention*. We aren't asking if the statue is the clay; we are asking if human intention is sufficient to make atoms compose a new object. This keeps it within SCQ bounds while using your required case.

  **Node Ordering Logic:**
  1.  **Existence (Nihilism Check):** We must filter out the "nothing exists" view first, as it renders all subsequent questions moot.
  2.  **Factuality (Deflationism Check):** We must filter out the "it's just language" view before asking about specific objects. If a student thinks composition is verbal, asking them about Trout-Turkeys will yield inconsistent answers based on their mood.
  3.  **Scope (Universalism Check):** We distinguish "everything composes" from "only some things compose" using the scattered pebbles.
  4.  **Criteria (Restrictivism Types):** We distinguish *why* some things compose using Life (Person) vs. Artifacts (Statue/Sentence) vs. Arbitrary Fusions (Trout-Turkey).
  5.  **Explainability (Brutalism Check):** Finally, we ask if there is a *reason* for the criteria.

  ***

  # HANDOUT: Finding Your Position on Composition
  **Course:** Intro to Metaphysics | **Topic:** The Special Composition Question (SCQ)

  **Instructions:** Start at the top. Answer the questions honestly based on your intuitions about the cases. Follow the arrows to find your metaphysical position.

  ### 1. The Existence Check
  Look at your own hand. Is it **one single object**, or is it just **many atoms acting together** (and there is no "hand" over and above the atoms)?
  *   **Just atoms:** → **COMPOSITION NIHILISM**
      *(You believe no composite objects exist. There are only simples.)*
  *   **One single object:** → Go to Question 2.

  ### 2. The Factuality Check
  When we ask "Do these atoms make an object?", are we asking about a **hard fact of the universe** (independent of us), or are we asking about **how we choose to speak/count**?
  *   **How we choose to speak:** → **DEFLATIONISM / VERBALISM**
      *(You believe there is no language-independent fact about composition. The dispute is verbal.)*
  *   **Hard fact of the universe:** → Go to Question 3.

  ### 3. The Scope Check
  Imagine atoms scattered randomly across the universe (like the **pebbles on a distant hillside**, but spread across galaxies). Do those scattered atoms compose **one giant object**?
  *   **Yes:** → **COMPOSITION UNIVERSALISM**
      *(You believe any collection of things, no matter how scattered, composes a further thing.)*
  *   **No:** → Go to Question 4.

  ### 4. The Criteria Check
  Since only *some* things compose objects, what makes the difference? Consider these three cases:
      *   **A:** A **Living Person** (biological organism).
      *   **B:** A **Statue** made of clay (human artifact/intention).
      *   **C:** A **Trout-Turkey** (front half of a trout fused to back half of a turkey).

  **Which of these count as real objects?**
  *   **Only A (Life):** → **ORGANICISM**
      *(Van Inwagen's view: Only living things compose objects.)*
  *   **A and B (Life + Artifacts):** → **ANTHROPOCENTRIC RESTRICTIVISM**
      *(Composition happens when there is life OR human intention/function, e.g., **sentence tokens** or statues.)*
  *   **A, B, and C (All Fused Things):** → **CONTACT / FASTENING VIEW**
      *(Composition happens whenever parts are physically connected, even if unnatural.)*
  *   **None of the above / It varies:** → Go to Question 5.

  ### 5. The Explainability Check
  You believe composition happens sometimes, but not always. Can you write down a **non-circular rule** that explains exactly when it happens? (e.g., "When they are alive" or "When they are fastened").
  *   **No, there is no informative rule:** → **BRUTAL COMPOSITION**
      *(You believe composition is a brute fact. It just happens, and we can't define the conditions.)*
  *   **Yes, I have a rule:** → **PRINCIPLED RESTRICTIVISM**
      *(You believe there is a specific, explainable condition for composition that you haven't fully articulated yet.)*

  ***

  ### INSTRUCTOR'S APPENDIX: Limitations & Logical Gaps
  *(This section is for teaching reference; it highlights where the decision tree simplifies the literature.)*

  **1. Indistinguishable Positions**
  *   **Universalism vs. Composition as Identity (CAI):** This tree cannot distinguish a standard Universalist from a CAI theorist. Both answer "Yes" to Question 3. CAI claims the whole *is identical* to the parts, whereas standard Universalism claims the whole is *composed of* the parts. This requires a separate question about identity logic.
  *   **Deflationism vs. Epistemicism:** A student who answers "We can't know the rule" at Question 5 might be an Epistemicist (there is a fact, but it's unknowable) rather than a Brutalist (there is no explanatory fact). The tree groups them as "No informative rule."

  **2. Empty or Unoccupied Branches**
  *   **Brutal Universalism:** There is no leaf for this. A Universalist claims *everything* composes. This is already a complete principle ("Always"). Claiming this principle is "brute" is redundant; thus, "Brutal Universalism" is effectively just Universalism.
  *   **Nihilist Deflationism:** The tree forces a choice between Nihilism (Q1) and Deflationism (Q2). However, a coherent view might be: "There are no composites, and that's only because our language doesn't carve them out." This combination is rare in literature because Nihilists usually take a hard realist stance against composites.
  *   **Organic Brutalism:** A view where "Only living things compose, but there is no explanation why life is special." This is logically possible but unoccupied. Organicism (Van Inwagen) relies on the *principle* of life (causal unity). Removing the principle makes the view ad hoc.

  **3. The Statue/Clay Trap**
  *   As noted in the design notes, Question 4 uses the Statue case to test *artifact composition*. Be prepared for students to pivot to the *Constitution Question* ("Is the statue the same thing as the clay?"). Remind them: "We aren't asking if they are identical. We are asking if the clay atoms compose a statue-object *at all*."

  **4. The "Trout-Turkey" Problem**
  *   This case (Sider) is designed to kill Contact views. If a student selects "Contact/Fastening" in Q4, press them on the Trout-Turkey. If they say "No," they are actually Organicism or Restrictivists. If they say "Yes," they are closer to Universalism. The tree simplifies this into a single node, but in discussion, this case often collapses the distinction between Contact Views and Universalism.
