prompt: |-
  I'm a backend/ml engineer at a mid-size fintech, no philosophy background at all, and I've been volun-told to be our "fairness reviewer" for anything ML-adjacent that touches customers. That means every 6 weeks or so I get a model spec on my desk -- default risk, fraud flagging, transaction limit adjustments, once a resume screener for our own hiring -- and I have maybe an hour per model with the PM who owns it, and I have to say something more useful than "it depends."

  I vaguely get that there are these impossibility results floating around: something like, if the outcome rates genuinely differ between groups, you can't have calibration and equal error rates and equal positive rates all at once, you have to pick which one you care about and eat the rest. People keep citing this at me in reviews and then not telling me what to DO about it.

  What I want is a procedure I can actually run in that hour. Something like:

  - an ordered list of questions to ask about the model and its use, where each answer points me down a path (who gets scored, what happens on a positive vs negative, is the label a real thing or a proxy for a real thing, do we get to set a threshold or is it a ranking, etc.)
  - for each path, which fairness criterion the impossibility results leave on the table, stated in plain english -- like "if you demand X here, you're giving up Y, and here's a concrete way that hurts someone"
  - where the procedure should just say NO (or "escalate to legal") vs where it's genuinely a values call that me and the PM shouldn't be deciding in a meeting
  - some honesty about the spots where the procedure is a judgment call dressed up as a checklist

  Then run it on three of my actual recurring cases: (1) a default-risk model where we set a cutoff for approving credit line increases, (2) a fraud model that auto-freezes accounts pending review, where the training label is "was flagged by the old human process," and (3) the resume screener, which we keep deferring. I want at least one of these to come out with an answer that makes the PM unhappy.

  Constraints: no stats PhD on the team, we can compute anything from a confusion matrix but we can't run counterfactual audits, and protected attribute data is available for the fraud case but NOT for the credit case (so factor that in). Don't just list the criteria names, tell me what each one means operationally for someone staring at a dashboard. Also if there are places where the impossibility stuff people cite doesn't actually bite (like when base rates are the same, or when it's a ranking not a classifier), flag that, because I suspect we're over-applying it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend/ML Engineer at a mid-size fintech. No philosophy background. Pragmatic, technical, time-constrained (1 hour per model review).
      *   **Task:** Act as a "fairness reviewer" for ML-adjacent customer-facing models.
      *   **Pain Point:** Knows about impossibility theorems (e.g., Chouldechova, Kleinberg et al.) but finds them unactionable ("it depends"). Needs a concrete procedure/checklist.
      *   **Requirements:**
          *   Ordered list of questions/decision tree.
          *   Plain English explanation of trade-offs (if you pick X, you lose Y).
          *   Clear "NO/escalate" vs. "values call" distinctions.
          *   Honesty about where it's just judgment dressed as a checklist.
          *   Apply the procedure to three specific cases: Credit Line Increase (default risk), Fraud Freeze (proxy label), Resume Screener (deferred).
          *   At least one outcome must make the PM unhappy (i.e., block or require significant change).
          *   **Constraints:** No stats PhD, confusion matrix metrics only (no complex counterfactuals), protected attributes (PA) available for Fraud but *not* for Credit.
          *   **Tone:** Direct, operational, no fluff, acknowledging the messiness.

  2.  **Deconstruct the "Impossibility Theorem" Problem:**
      *   The user is right: you can't satisfy Calibration, Equalized Odds, and Demographic Parity simultaneously if base rates differ.
      *   *Operational Translation:* You have to choose *what kind of mistake* you are willing to distribute unequally.
      *   *Key Insight:* The choice of metric depends entirely on the *cost of error* for the individual vs. the business.

  3.  **Drafting the Procedure (The "1-Hour Fairness Triage"):**
      *   Need a flow that starts with high-level context and drills down to metrics.
      *   *Step 1: Impact & Harm.* What happens if the model says Yes? What happens if it says No? Who gets hurt?
      *   *Step 2: Label Validity.* Is the target variable actually what we want, or is it biased history?
      *   *Step 3: Decision Mechanism.* Is it a hard cutoff or a ranking? (Crucial for impossibility theorems).
      *   *Step 4: Data Availability.* Do we have Protected Attributes (PA)? If not, we can't measure group fairness directly (need proxies or indirect testing).
      *   *Step 5: Metric Selection.* Based on Step 1, pick the constraint.
      *   *Step 6: The "No" Zone.* When to escalate.

  4.  **Developing the Trade-off Explanations:**
      *   Need to map technical terms to business outcomes.
      *   *Demographic Parity (Equal Acceptance):* "Everyone gets the offer at the same rate." Risk: Giving loans to people who can't pay (if base rates differ).
      *   *Equalized Odds (Equal Error Rates):* "Mistakes happen at the same rate." Risk: Might require different cutoffs for different groups.
      *   *Calibration:* "A score of 700 means 5% risk for everyone." Risk: Might result in very different acceptance rates.
      *   *The Trade-off:* If base rates differ, you can't have Equal Error Rates *and* Equal Acceptance. You have to choose: Do we care more about equal opportunity (access) or equal risk (performance)?

  5.  **Addressing the Constraints:**
      *   *Credit Case:* No PA data. This is huge. We can't calculate demographic parity or equalized odds directly. We have to rely on proxy variables or calibration checks. This limits the "impossibility" argument because we can't measure the groups.
      *   *Fraud Case:* PA data available. Label is "flagged by old human process." This is a *biased label* trap.
      *   *Resume Case:* High risk, legal minefield.

  6.  **Running the Procedure on the Three Cases:**

      *   **Case 1: Credit Line Increase (Default Risk)**
          *   *Context:* No PA data.
          *   *Constraint:* Can't measure group fairness directly.
          *   *Focus:* Calibration and Proxy variables.
          *   *Outcome:* PM wants to optimize profit. Engineer says: "We can't prove fairness without PA, but we can check if zip code acts as a proxy. If we use a hard cutoff, we might violate equal opportunity without knowing it."
          *   *Unhappy PM?* Maybe not enough. Let's make it stricter. If they can't get PA data (even via vendor), we should flag the legal risk of disparate impact liability.

      *   **Case 2: Fraud Freeze (Auto-freeze)**
          *   *Context:* PA data available. Label = "Old human flag."
          *   *Constraint:* Biased label.
          *   *Focus:* The label is the problem. If humans were biased, the model learns bias.
          *   *Outcome:* **Hard NO.** You cannot train on a biased label and claim fairness. You need a "clean" validation set or a different target definition.
          *   *Unhappy PM?* Yes. This stops the launch.

      *   **Case 3: Resume Screener**
          *   *Context:* Hiring.
          *   *Constraint:* Legal/Regulatory high risk (EEOC, etc.).
          *   *Focus:* Escalation.
          *   *Outcome:* **ESCALATE.** Engineering/PM should not decide this. Legal + External Audit required.
          *   *Unhappy PM?* Yes, causes delay.

  7.  **Refining the "Honesty" Section:**
      *   Admit that checking boxes doesn't absolve liability.
      *   Admit that "fairness" is a political choice, not a mathematical one.
      *   Admit that without PA data, you are flying blind on group fairness.

  8.  **Review against Constraints:**
      *   *No Stats PhD:* Keep math to confusion matrix terms (TPR, FPR, PPV).
      *   *1 Hour:* Keep the checklist short.
      *   *Plain English:* Avoid jargon like "Chouldechova's Theorem." Use "The Trade-off."
      *   *Impossibility Nuance:* Explicitly mention when it doesn't apply (e.g., if it's just ranking, or if base rates are similar).

  9.  **Final Polish:**
      *   Structure the response clearly: The Procedure first, then the Trade-offs, Then the Case Studies.
      *   Ensure the tone is empathetic to the engineer ("I know this sucks") but firm on the ethics.
      *   Make sure the "No PA data" constraint in the Credit case is handled realistically (you can't measure what you don't have, so you assess risk differently).

  *(Self-Correction during drafting)*: Initially, I might suggest using proxy variables for the Credit case. *Correction:* Be careful. Using proxies *to fix* fairness can be legally risky (imputing race). Better to advise on *monitoring* proxies for disparate impact signals without explicitly using them in the model.
  *(Self-Correction on Fraud)*: The label is "flagged by old process." If the old process was biased, the model is biased. The solution isn't a threshold tweak; it's a data problem. I need to make sure the procedure catches this early (Step 2: Label Validity).

  10. **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  This is a classic "ethics in production" problem. You are being asked to solve a socio-technical problem with a technical checklist. That is impossible, but we can make it *manageable*.

  The impossibility theorems (Chouldechova, Kleinberg, etc.) are real, but in a 1-hour meeting, they are distractions unless you translate them into **business risk**.

  Here is your **1-Hour Fairness Triage Procedure**. It is designed to be run with a PM and a data scientist. It forces specific choices and identifies where you are legally exposed.

  ---

  ### Part 1: The Procedure (The Checklist)

  Do not start with metrics. Start with consequences.

  #### Step 1: The Harm Map (10 Minutes)
  *Ask: "What physically/financially happens to the human if the model outputs a 0? What happens if it outputs a 1?"*

  *   **Path A (High Harm to Individual):** Denial of credit, account freeze, job rejection, insurance denial.
      *   *Implication:* False Negatives (FN) are the critical metric. You care about **Equal Opportunity** (did qualified people get the chance?).
  *   **Path B (High Harm to Business):** Fraud payout, server cost, spam.
      *   *Implication:* False Positives (FP) are the critical metric. You care about **Equalized Odds** (are we annoying Group X more than Group Y with false alarms?).
  *   **Path C (Low Stakes/Ranking):** Search results, recommended content, "likely to click."
      *   *Implication:* Impossibility theorems matter less here. Focus on **Calibration** (does the score mean the same thing for everyone?).

  #### Step 2: The Label Audit (10 Minutes)
  *Ask: "Is the target variable (Y) the truth, or is it history?"*

  *   **Path A (Objective Truth):** Did the loan default? Did the transaction clear the bank?
      *   *Proceed to Step 3.*
  *   **Path B (Human Proxy):** Was the user flagged by fraud ops? Was the resume selected by a recruiter? Did the police arrest them?
      *   **STOP.** If the historical process was biased, your model is automating bias. You cannot fix this with thresholds. You need a new label definition or a "human-in-the-loop" validation set.
      *   *Action:* **Escalate to Legal/Compliance.** Do not launch.

  #### Step 3: The Data Reality Check (10 Minutes)
  *Ask: "Do we have Protected Attributes (PA) like race, gender, age in the evaluation set?"*

  *   **Path A (Yes):** You can measure group fairness directly.
      *   *Proceed to Step 4.*
  *   **Path B (No):** (Common in Credit/US context).
      *   *Reality:* You cannot prove "Equal Error Rates." You are flying blind on group fairness.
      *   *Action:* You must test for **Proxy Variables** (e.g., zip code, shopping habits) that correlate with PA. If a proxy drives the decision, you have disparate impact risk even without PA data.
      *   *Constraint:* Do not *impute* PA (e.g., "guessing" race from name) to fix the model. That is often illegal. Use it only for auditing if legal approves.

  #### Step 4: The Mechanism (10 Minutes)
  *Ask: "Is this a hard cutoff (Threshold) or a sorted list (Ranking)?"*

  *   **Path A (Hard Cutoff):** "Score > 0.5 gets the loan."
      *   *Implication:* Impossibility theorems **BITE HERE**. If base rates differ between groups, you must choose between Equal Acceptance Rates or Equal Error Rates.
  *   **Path B (Ranking):** "Show the top 100 candidates to a recruiter."
      *   *Implication:* Impossibility theorems are softer. You can often satisfy Calibration and Ranking Fairness simultaneously. The risk is *exposure*, not *denial*.

  #### Step 5: The Trade-Off Selection (15 Minutes)
  *Based on Step 1, pick ONE primary constraint. Acknowledge what you are sacrificing.*

  *   **If you pick Demographic Parity (Equal Acceptance Rates):**
      *   *Meaning:* 10% of Group A and 10% of Group B get the offer.
      *   *You Give Up:* Calibration. You might be lending to riskier people in one group to hit the quota.
      *   *Operational Risk:* Higher default rates in one group.
  *   **If you pick Equalized Odds (Equal Error Rates):**
      *   *Meaning:* 5% of qualified people in Group A and 5% in Group B get rejected.
      *   *You Give Up:* Equal Acceptance Rates. If one group has higher risk historically, fewer of them will get the offer.
      *   *Operational Risk:* PR backlash ("Why does Group B get denied more?").
  *   **If you pick Calibration:**
      *   *Meaning:* A risk score of 0.8 means 80% chance of default for everyone.
      *   *You Give Up:* Equal Acceptance Rates.
      *   *Operational Risk:* Disparate impact lawsuits.

  #### Step 6: The "No" Zone (5 Minutes)
  *Escalate immediately if:*
  1.  **Label is Biased History** (Step 2, Path B).
  2.  **High Harm + No PA Data + High Proxy Correlation** (Step 3, Path B). You cannot audit what you can't measure.
  3.  **Legal/Regulatory Minefield** (Hiring, Housing, Credit in certain jurisdictions). Engineering should not decide this.

  ---

  ### Part 2: The Trade-Offs (Plain English Cheat Sheet)

  Keep this on your screen during the meeting.

  | Criterion | Plain English | When to use it | What you are sacrificing (The "Cost") |
  | :--- | :--- | :--- | :--- |
  | **Demographic Parity** | "Everyone gets the offer at the same rate." | When historical data is known to be garbage/biased and you want to reset the baseline. | **Accuracy.** You will approve riskier applicants in some groups to match the rates. You lose calibration. |
  | **Equalized Odds** | "Mistakes happen at the same rate." (TPR & FPR match). | When the *cost of a mistake* is high for the user (e.g., fraud freeze). You want to ensure you aren't harassing one group more. | **Acceptance Rates.** If Group A has higher base risk, fewer of them will pass. This looks like discrimination on a dashboard. |
  | **Calibration** | "A score of 700 means the same risk for everyone." | When the output is used for *pricing* (interest rates) or downstream human decision making. | **Access.** To keep the risk prediction accurate, you might have to deny more people from higher-risk groups. |
  | **Predictive Parity** | "If you get the offer, your success rate is the same." | When the business cares about the quality of the accepted pool (e.g., hire quality). | **Opportunity.** You might reject many qualified people from a group to ensure those who *do* pass are high quality. |

  **The Impossibility Reality Check:**
  *   **Does it bite?** Only if **Base Rates differ** (e.g., Group A defaults at 5%, Group B at 10%) AND you use a **Hard Cutoff**.
  *   **Does it NOT bite?** If base rates are roughly equal, or if you are just ranking (no hard cutoff), or if you are optimizing for overall accuracy without group constraints. Don't let the PM cite impossibility theorems if you're just doing a ranking sort.

  ---

  ### Part 3: Running the Procedure on Your Cases

  Here is how you apply this in the room.

  #### Case 1: Default Risk (Credit Line Increase)
  *   **Context:** Hard cutoff for approval. No Protected Attribute (PA) data.
  *   **Step 1 (Harm):** High Harm to Individual (denial of credit). Focus: False Negatives (qualified people denied).
  *   **Step 2 (Label):** Objective Truth (Did they default?). **Pass.**
  *   **Step 3 (Data):** **NO PA Data.**
      *   *Constraint:* You cannot calculate Equalized Odds. You cannot prove you aren't discriminating.
      *   *Action:* You must check **Proxies**. Does `zip_code` or `merchant_category` correlate with protected classes?
  *   **Step 4 (Mechanism):** Hard Cutoff. Impossibility theorems apply.
  *   **Step 5 (Trade-off):**
      *   PM wants: Max Profit (Calibration).
      *   Risk: If Group B has higher historical default rates (due to systemic issues), Calibration means denying more of Group B.
      *   *Engineer Stance:* "Since we don't have PA data, we cannot verify Equalized Odds. If we optimize purely for Calibration, we risk disparate impact liability via proxy variables."
  *   **Verdict:** **Conditional Pass with Warning.**
      *   *Requirement:* Run a proxy audit (e.g., ecological inference on zip codes). If a proxy variable contributes >X% to the decision, remove it.
      *   *PM Happiness:* **Neutral.** They can launch, but you've added work (proxy audit) and warned Legal.

  #### Case 2: Fraud Model (Auto-Freeze)
  *   **Context:** Account freeze pending review. PA data **Available**. Label = "Flagged by old human process."
  *   **Step 1 (Harm):** High Harm (access to money frozen). Focus: False Positives (innocent people frozen).
  *   **Step 2 (Label):** **Human Proxy.**
      *   *Critical Fail:* The label is "what humans flagged." If humans were biased against a demographic, the model learns to target that demographic to minimize loss.
      *   *Impossibility Note:* It doesn't matter which metric you pick; the ground truth is poisoned.
  *   **Step 3 (Data):** PA Available.
  *   **Step 4 (Mechanism):** Hard Cutoff (Freeze vs. Don't Freeze).
  *   **Step 5 (Trade-off):**
      *   PM wants: Reduce Fraud Loss.
      *   Engineer Stance: "We are training on biased history. If we deploy this, we are automating past prejudice. We will freeze innocent people in Group X at higher rates because the old team did."
  *   **Verdict:** **HARD NO.**
      *   *Requirement:* You need a "clean" label set (e.g., confirmed fraud only, not just 'flagged'). Or, you must apply a 'bias correction' to the labels before training (re-weighting).
      *   *PM Happiness:* **Very Unhappy.** This blocks the launch. It forces them to pay for manual review of a validation set to get clean labels.
      *   *Script:* "I can't sign off on this. The target variable encodes human bias. If we launch, we are liable for every false freeze that correlates with a protected class. We need a clean validation set before we train."

  #### Case 3: Resume Screener
  *   **Context:** Hiring. Ranking/Cutoff.
  *   **Step 1 (Harm):** Extreme Harm (Livelihood).
  *   **Step 2 (Label):** Human Proxy (Recruiter selection).
  *   **Step 3 (Data):** PA Data usually restricted in hiring (EEOC rules).
  *   **Step 6 (No Zone):** **ESCALATE.**
      *   *Reasoning:* Employment law (Title VII, etc.) is stricter than consumer finance. "Disparate Impact" is illegal regardless of intent.
      *   *Engineer Stance:* "This is outside my pay grade. Engineering cannot determine 'fairness' in hiring. This requires External Legal Counsel and potentially an external audit vendor."
  *   **Verdict:** **ESCALATE TO LEGAL.**
      *   *PM Happiness:* **Unhappy.** It introduces delay and cost.
      *   *Script:* "We are not qualified to make the fairness call here. The liability is corporate, not engineering. We need Legal to define the fairness constraint, not us."

  ---

  ### Part 4: Honesty About the Procedure

  You asked for honesty about where this is judgment dressed as a checklist. Here it is:

  1.  **The "Proxy" Problem (Credit Case):** Checking zip codes isn't perfect. It's a heuristic. You are essentially guessing if you are being fair. The checklist makes it look rigorous, but it's still an estimate.
  2.  **The "Label" Problem (Fraud Case):** Getting a "clean" label set is expensive. The PM will argue "it's good enough." The checklist says "NO," but in reality, companies launch this stuff anyway. Your "NO" is a shield for *you*, not necessarily a block for *them*. Make sure your objection is in writing (email/Jira).
  3.  **The Metric Choice:** Picking "Equalized Odds" vs. "Calibration" is a political decision, not a math one. The checklist forces the PM to pick, which is good, but don't pretend one is "more correct." One protects the business (Calibration), one protects the user (Equalized Odds).
  4.  **Impossibility Overuse:** If the base rates between groups are within 1-2% of each other, the impossibility theorems are mathematically true but practically irrelevant. Don't let the DS use them to avoid making a decision if the metrics are already close.

  ### Summary for your next meeting:
  1.  **Fraud Model:** Kill it. Biased label. (Makes PM unhappy).
  2.  **Resume Model:** Kick it to Legal. (Makes PM unhappy).
  3.  **Credit Model:** Allow with proxy audit. (PM accepts, but you've covered your back).

  This approach moves you from "Philosopher" to "Risk Manager." It gives you specific, actionable reasons to say "No" that are tied to liability and data quality, not abstract ethics.
