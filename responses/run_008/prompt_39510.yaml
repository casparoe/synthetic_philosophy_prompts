answer: |-
  This is an excellent question. You have intuitively identified one of the most significant unresolved problems in meta-ethics, decision theory, and AI alignment. You are right that there is a "hidden dial," and you are right that people rarely admit it exists.

  There is no single, universally agreed-upon phrase like "The Uncle-Sage Paradox," but there are established terms for the components of this bind. In philosophy, it is most commonly referred to as **The Alienation Objection** to **Ideal Advisor Theory**. In AI safety, it is the central critique of **Coherent Extrapolated Volition (CEV)**.

  Here is the breakdown of the existing terminology, the ethical framing, and a proposed definition for the "dial" you identified.

  ### 1. The Established Framework: Ideal Advisor Theory
  The argument you are critiquing ("do what you would want if you knew more/thought longer") is formally known as **Ideal Advisor Theory** (or Full Information Theory). Prominent philosophers like Richard Brandt and Peter Railton have argued that your "good" is what you would want if you were fully informed and rational.

  **The Bind:** The problem you spotted is the standard counter-argument to this theory.
  *   **The Uncle Case:** This is viewed as **correcting a defect**. The addiction is seen as "noise" or a failure of rationality. Removing it reveals the underlying signal.
  *   **The Sage Case:** This is viewed as **transforming the agent**. If the "idealization" process changes your core values (e.g., you value family, but the Sage values abstract truth above all), the resulting preference is no longer *yours*.

  ### 2. The Name of the Bind: The Alienation Objection
  The specific philosophical term for your "Sage" worry is **The Alienation Objection**.

  The argument goes: If the process of idealization changes me so much that I no longer recognize the resulting preferences as my own, then satisfying those preferences does not benefit *me*; it benefits a *different person* who happens to occupy my body.

  *   **Uncle Case:** Passes the Alienation test. The sober uncle looks at the smoking uncle and says, "That was me, but I was mistaken." There is **Psychological Continuity**.
  *   **Sage Case:** Fails the Alienation test. The current you looks at the Sage you and says, "That person is a stranger." There is **Psychological Discontinuity**.

  ### 3. The AI Context: Coherent Extrapolated Volition (CEV)
  In AI alignment, this is the core definition of **Coherent Extrapolated Volition**, proposed by Eliezer Yudkowsky. The goal is to build an AI that does not what humans *say* they want, but what they *would* want if they "knew more, thought faster, were more the people we wished we were."

  Your critique is the standard critique of CEV: **Who decides when the extrapolation stops?**
  *   If you stop early, you just reinforce current biases (the "status quo" problem).
  *   If you stop late, you end up with values no living human recognizes (the "alien god" problem).

  ### 4. Coining the Term: The Idealization Horizon
  Since you asked for a name for the "hidden dial" itself, I propose we call this **The Idealization Horizon**.

  **Definition:** The *Idealization Horizon* is the maximum distance of cognitive or moral transformation an agent can undergo before the resulting preference set is no longer continuous with the original agent's identity.

  **Drawing the Edges:**
  To determine which side of the Horizon a case falls on, you apply the **Test of Endorsement**:

  1.  **Inside the Horizon (The Uncle):** If you present the agent with the idealized preference *now*, they can understand the reasoning and agree that the idealized version is correcting an error they acknowledge (e.g., "I know smoking is bad for me"). The idealized self is recognized as the *authentic* self.
  2.  **Outside the Horizon (The Sage):** If you present the agent with the idealized preference, they reject it as a value change, not a correction (e.g., "I don't care about maximizing universal utility, I care about my kids"). The idealized self is recognized as a *successor* or *stranger*.

  ### 5. Why the "Dial" is Always Hidden (The Bias)
  You noted that when people use this argument, the "idealized" view always matches their own. In psychology and rhetoric, this is a combination of two things:

  1.  **Motivated Stopping:** People stop "idealizing" the moment the result aligns with their pre-existing intuition. They claim the dial is set to "Objective Truth," but they actually set it to "My Opinion + 10%."
  2.  **False Consensus Effect:** The speaker assumes that if *they* thought longer, *everyone* would agree with them. They confuse "what I would think" with "what anyone would think."

  ### 6. The Ethical Framing: Soft vs. Hard Paternalism
  In ethics, this distinction determines whether an action is **Soft Paternalism** or **Hard Paternalism**.

  *   **Soft Paternalism (Uncle):** It is permissible to override someone's current wishes to satisfy their *own* deeper/idealized wishes (e.g., stopping a suicide attempt by a depressed person). This is valid because the action stays **Inside the Idealization Horizon**.
  *   **Hard Paternalism (Sage):** It is generally impermissible to override someone's wishes to satisfy what a "better" person would want. This violates autonomy because the action falls **Outside the Idealization Horizon**.

  ### Summary for your arguments
  When you encounter this move in argument, you can now say:

  > "You are relying on **Ideal Advisor Theory**, but you haven't addressed the **Alienation Objection**. You are assuming your proposal falls **Inside the Idealization Horizon** (correcting a mistake like my uncle's smoking), but it actually falls **Outside** (changing values like the Sage). Unless you can show that the 'idealized' me would still endorse my core identity, you aren't appealing to my better self; you're appealing to a stranger."

  This forces them to define the "dial." Usually, they cannot do so without admitting that the "idealized" view is just their own view in disguise.
