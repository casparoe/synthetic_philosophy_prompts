answer: |-
  Your diagnosis is astute: the argument you have reconstructed is indeed the engine of Dancyan particularism, but as you have noticed, it runs on a fuel that would consume far more than moral principles if left unchecked. The alarm you feel is the sound of a *reductio ad absurdum* not merely of moral generalism, but of rational generalisation itself. To preserve the possibility of laws, grammar, and epistemic norms without abandoning the insights of holism, we must locate the fault in the architecture of the argument.

  ### 1. Which step to reject?

  The root error lies in **Step (1)**.

  Step (1) asserts that for a general claim to be a 'genuine moral principle', it must hold good in *every* case within its scope without exception. It equates the status of a principle with strict invariance. This is the premise that forces the dilemma: either accept exceptionless principles (which Step 2 convincingly argues do not exist) or accept that there are no principles at all.

  This rejection covers the parallels you have drawn. In the philosophy of science, it is widely accepted that laws of nature are not strictly exceptionless universal generalisations. Newton's laws are not 'mere summaries' because they fail near black holes; they are robust, defeasible descriptions of physical behaviour that hold *ceteris paribus* or within specific domains. Similarly, grammatical rules are genuine rules despite borrowings that violate them, and epistemic principles (like 'trust the reliable witness') are normative despite the possibility of defeaters (like a bribe). In all these domains, we reject the analogue of Step (1). We allow that a rule can be genuine and authoritative even if it is defeasible. By rejecting Step (1) in the moral case, you align moral philosophy with the rest of rational inquiry.

  Why did Step (1) look acceptable? It captures a powerful intuition about the **authority** of principles. If a principle says 'F counts in favour', and in a specific case F makes no difference or counts against, the principle appears to have lied. There is a fear that if principles admit exceptions, they lose their grip on action; they become suggestions rather than guides. Furthermore, in the Kantian tradition, moral law is conceived as strict and universal. Step (1) inherits this prestige, making it seem that anything less than exceptionlessness is a collapse into mere habit or statistical regularity (as Step 4 suggests).

  ### 2. Is there a disanalogy?

  You ask whether there is a disanalogy that would let the moral case go one way and the others another. The particularist might attempt to draw one, but it is unlikely to succeed in the way they hope.

  A common particularist move is to argue that moral reasons are *essentially* holistic in a way that natural properties are not. They might claim that while Newton's laws have boundary conditions, the underlying physical relations are invariant; whereas in morals, the valence of a feature (like promise-keeping) actually changes. However, your epistemological parallel undermines this. The feature 'seems reliable' counts in favour of belief, but not when there is a defeater (a bribe). This is a normative domain, like morals, where the force of a reason is context-dependent. If epistemic rationality can accommodate defeasible principles without collapsing into case-by-case prophecy, then moral rationality can too.

  Therefore, there is no strong disanalogy that isolates morals as uniquely resistant to generalisation. If anything, the disanalogy helps the **generalist**. It shows that morals are of a piece with epistemology and practical rationality generally. If we accept defeasible principles in epistemology (which we must, to avoid scepticism), consistency demands we accept them in ethics. The particularist who accepts laws of nature and epistemic norms but denies moral principles is left with an unstable position: they must explain why holism destroys principles in ethics but not in epistemology. Rejecting Step (1) uniformly resolves this tension.

  ### 3. Replacement and Cost

  Once Step (1) is rejected, it must be replaced with a conception of principles as **defeasible generalisations** or **default reasons**. On this view, a principle states that a feature F counts in favour of an act *in the absence of defeaters*. This preserves the normative authority of the principle (it sets a default presumption) without requiring it to be exceptionless.

  The price of this repair is the challenge you identified: distinguishing a genuine defeasible principle from a gerrymandered one that holds 'except where it doesn't'. If a principle is simply 'F counts in favour, unless G, H, I...', it risks being unfalsifiable and trivial.

  To draw this line, the generalist must insist that genuine principles have **explanatory depth**. A gerrymandered rule is a mere list of exceptions attached to a generalisation. A genuine principle captures a normative connection that explains *why* F counts in favour. For example, 'pain relief counts in favour' is grounded in the badness of pain. When it fails to count in favour (as in deserved punishment), there is a *principled* defeater (justice overrides welfare), not an arbitrary exception. The cost is acknowledging that principles do not function as algorithms. They do not mechanically determine the right action; they structure deliberation by highlighting relevant features and assigning them presumptive weight. The agent must still exercise judgment to determine if defeaters are present.

  This concedes some ground to the particularist: judgment is irreducible. However, it denies the particularist's stronger claim that principles have no role. Principles guide by structuring the space of reasons, even if they do not fill it completely. This is a modest generalism, but it is sufficient to save moral thought from the charge of being a mere record of coincidences, and it saves the rest of our rational practices along with it.

  \answer{1}
