answer: |-
  This is a classic philosophical stalemate known as the problem of **Future Contingents**, originating in Aristotle's *De Interpretatione* (Chapter 9). You are refereeing a debate between **Logical Determinism** (Maya) and the **Open Future** (Sam).

  Neither friend is "wrong" in a way that allows you to knock them out; they are operating from different metaphysical and semantic commitments. However, some moves are stronger than others. Here is the round-by-round scorecard, followed by the crucial distinction they both missed.

  ### Round 1: The Opening Salvo
  *   **(1) Maya:** *Bivalence.* She argues that the Law of Excluded Middle applies to future statements. If "Battle" or "No Battle" covers all possibilities, one must be true now.
      *   **Verdict:** **Logically Standard, Metaphysically Costly.** Maya is right that classical logic usually assumes bivalence (every proposition is true or false). However, she slips from "one must be true" to "the choice was never open." This is the jump from logical necessity to causal necessity, which is controversial.
  *   **(2) Sam:** *Truthmaker Theory.* He argues truth requires an existing fact. No future facts exist; therefore, no truth value exists.
      *   **Verdict:** **Metaphysically Intuitive, Logically Non-Standard.** Sam is right that truth usually depends on reality (a truthmaker). If the future is genuinely open, there is no "fact of the matter" yet. However, he is rejecting classical bivalence, which requires him to adopt a three-valued logic or supervaluationism.
      *   **Point:** **Draw.** Maya wins on classical logic rules; Sam wins on intuitive metaphysics of time.

  ### Round 2: The Sealed Envelope
  *   **(3) Maya:** *Retrospective Truth.* She argues that if a prediction comes true, it *was* true when made.
      *   **Verdict:** **Linguistically Strong, Philosophically Question-Begging.** This is Maya's strongest intuition pump. Our language treats truth as timeless ("You *were* right"). However, she is assuming what she needs to prove: that the truth value existed *at the time of writing* rather than being assigned *at the time of opening*.
  *   **(4) Sam:** *Temporalism.* He argues truth is indexed to time. The card becomes true *when* the battle happens.
      *   **Verdict:** **Philosophically Defensible.** Sam is describing a coherent semantic view (Temporalism). Propositions can change truth value over time. "It is raining" is false today and true tomorrow. Sam argues "There will be a battle" functions similarly.
      *   **Point:** **Edge to Sam.** Maya's move relies on a linguistic habit that might be misleading. Sam offers a specific mechanism (time-indexing) that explains the phenomenon without forcing determinism.

  ### Round 3: The Predictor
  *   **(5) Maya:** *The Infallible Predictor.* She argues Sam's view makes perfect prediction (God or Science) impossible, because there's nothing to predict.
      *   **Verdict:** **Strong Challenge.** This highlights the cost of Sam's view. If the future doesn't exist, an omniscient being cannot know it. This forces Sam to either limit omniscience or claim God exists outside of time.
      *   **Point:** **Edge to Maya.** She successfully identifies a major consequence of Sam's view that many find unacceptable (limiting knowledge).
  *   **(6) Sam:** *Justification vs. Truth.* He distinguishes having *evidence* for a prediction from the prediction being *made true* by a fact.
      *   **Verdict:** **The Knockout Move.** This is Sam's best point. He distinguishes **epistemology** (how we know) from **metaphysics** (what exists). A weather model can be perfectly justified by current atmospheric data without the future weather *already existing* as a fact. Accuracy tracks reality; it doesn't require the reality to be present *now*.
      *   **Point:** **Win for Sam.** Maya conflated "being right" with "describing an existing entity." Sam correctly notes you can track a causal trajectory without the destination existing yet.

  ### The Final Insults
  *   **Maya:** "Sam's position is a refusal to say anything."
      *   **Analysis:** Unfair. Sam is saying something specific: truth values are time-relative.
  *   **Sam:** "Maya believes the future causally reaches back."
      *   **Analysis:** Unfair caricature, but points to a real tension. If it is *true now* that I will do X, does that truth constrain me? Maya says no (logical necessity $\neq$ causal necessity); Sam says yes (it implies the future is fixed).

  ---

  ### What Both of Them Are Missing

  To truly referee this, you need to point out the technical distinction that dissolves the shouting match. They are conflating three different things:

  **1. The Law of Excluded Middle vs. Bivalence**
  This is the most important technical point.
  *   **Excluded Middle:** "Either there will be a battle OR there will not be a battle." ($P \lor \neg P$)
  *   **Bivalence:** "The statement 'There will be a battle' is **True** OR the statement 'There will be a battle' is **False**."
  *   **The Missing Link:** Sam can accept the **Excluded Middle** without accepting **Bivalence**. He can say, "It is definitely the case that (Battle or No Battle)," without saying "It is definitely the case that Battle is True *now*."
  *   **Why it matters:** Maya thinks denying Bivalence means denying reality. Sam can say reality is open, logic holds, but truth values haven't "crystallized" yet.

  **2. The Metaphysics of Time (Eternalism vs. Presentism)**
  Their disagreement isn't really about logic; it's about the shape of time.
  *   **Maya is an Eternalist (Block Universe):** She believes the past, present, and future all equally exist in a 4D block. For her, the future battle is just "over there" in time, like a city is "over there" in space. The truth exists because the event exists.
  *   **Sam is a Presentist (or Growing Block):** He believes only the present exists. The future is literally nothing. For him, a statement about "nothing" cannot have a truth value.
  *   **The Referee's Note:** You cannot win this argument without first agreeing on whether the future *exists*. If Maya wins the metaphysics of time, she wins the logic. If Sam wins the metaphysics of time, he wins the logic.

  **3. Supervaluationism (The Synthesis)**
  There is a sophisticated view they both ignored called **Supervaluationism**.
  *   It says: The statement "There will be a sea battle" is currently **indeterminate**.
  *   However, the statement "Either there will be a sea battle or there won't" is **super-true**.
  *   This allows Sam to keep the future open (no specific fact makes "Battle" true) while allowing Maya to keep classical logic (the disjunction is still valid).

  ### Final Ruling

  **Winner:** **Sam on points, but Maya on intuition.**

  *   **Sam** made the stronger philosophical moves, specifically in Round 6 (distinguishing justification from truthmaking). He successfully defended the "Open Future" without abandoning logic entirely.
  *   **Maya** represents the common-sense view that truth is timeless. Her intuition is shared by most classical logicians and theologians.

  **How to settle the dinner bill:**
  Tell them they are arguing past each other. Maya is arguing for **Logical Consistency** (we need bivalence to do logic), and Sam is arguing for **Ontological Openness** (we need an open future for free will).

  Tell Maya: "You can keep your logic if you admit the truth value is 'indeterminate' rather than 'false'."
  Tell Sam: "You can keep your open future if you admit the *disjunction* (Battle or No Battle) is true, even if the specific options aren't."

  If they refuse, tell them Aristotle himself never solved it, so they should order dessert and drop it.
