answer: |-
  Here is the translation of the Great Divergence debate into your working vocabulary, followed by the residue report on the points where the mapping fails.

  ### I. The Model Specification

  **The Outcome Variable ($Y_i$):**
  Let $Y_i$ be the industrialization status or sustained per-capita growth rate of polity $i$ in period $t$ (c. 1750–1850). In the binary case, $Y_i = 1$ if the polity escapes the Malthusian trap; $Y_i = 0$ otherwise.

  **The Units ($i$):**
  The units of observation are macro-regional polities (e.g., Britain, Yangzi Delta, Holland, India).
  *Note on Violence:* Treating "Britain" and "China" as comparable units $i$ assumes homogeneity of the unit. In reality, "China" is an empire with internal heterogeneity that violates the assumption that $i$ is a stable unit of analysis.

  **The Treatments ($D_i$):**
  The debate is essentially a contest over which $D$ explains the variance in $Y$.
  1.  **Pomeranz Treatment ($D_{geo}$):** Access to ghost acres (New World) and coal proximity. $D_{geo}=1$ if high endowment, $0$ otherwise.
  2.  **Institutional Treatment ($D_{inst}$):** Inclusive economic institutions (property rights, constraints on elites). $D_{inst}=1$ if inclusive, $0$ if extractive.
  3.  **Market Treatment ($D_{mkt}$):** Degree of market integration/price convergence.

  **The Potential Outcomes:**
  For any polity $i$, there exists $Y_i(1)$ (outcome if treated) and $Y_i(0)$ (outcome if control).
  *   **The Fundamental Problem:** We observe $Y_{Britain}$ (where $D_{geo}=1, D_{inst}=1$) and $Y_{China}$ (where $D_{geo}=0, D_{inst}=0$). We never observe the counterfactual $Y_{Britain}(0)$ (Britain without coal) or $Y_{China}(1)$ (China with British institutions).

  **The Identification Strategy (Historians' Implicit Claims):**
  *   **Pomeranz:** Argues that $D_{inst}$ is collinear with $Y$ in the pre-1750 period (China and Europe had similar institutions/markets), so $\beta_{inst} \approx 0$. The variation in $Y$ is identified by exogenous variation in $D_{geo}$. He relies on **selection on observables**: conditional on pre-1750 development levels, coal assignment is as-good-as-random (geographic exogeneity).
  *   **Institutionalists:** Argue that $D_{geo}$ is a **bad control** or merely an instrument that works only through $D_{inst}$. They claim $D_{inst}$ is the true causal mechanism. They often rely on **overidentification**: pointing to multiple historical episodes (Glorious Revolution, enclosure) to argue the mechanism holds.

  **The Estimation Target:**
  Historians claim to be estimating the **Average Treatment Effect on the Treated (ATT)**: $E[Y(1) - Y(0) | D=1]$. However, because they are explaining a specific historical transition, they are often conflating the ATT with the **effect for a single realized draw** (the specific causal path of Britain).

  ---

  ### II. The Violence of Translation

  Before the residue report, I must note where this translation distorts the historical object:

  1.  **Endogeneity of Treatment:** In your vocabulary, $D$ is usually distinct from $Y$. In history, "Institutions" ($D_{inst}$) are often simultaneous outcomes of the same deep processes driving $Y$. Coding them as a treatment assumes a temporal and causal precedence that is contested.
  2.  **Measurement Error:** $D_{inst}$ is latent. Historians proxy it with narrative evidence (parliamentary acts, tax records). This is not classical measurement error; it is construct validity failure.
  3.  **Time-Varying Coefficients:** The model assumes $\beta$ is stable. In the Great Divergence, the return to coal ($\beta_{coal}$) is zero in 1600 and positive in 1800 (due to steam technology). This is a treatment-by-time interaction that historians often treat as a structural break rather than a parameter shift.

  ---

  ### III. Residue Report

  Here is the analysis of the three friction points you identified.

  #### 1. SUTVA and Interdependence (The Equilibrium Problem)
  **Your Suspicion:** Britain and China are not independent draws; a rich Britain may imply a poor China.
  **Econometric Translation:** This is a violation of the **Stable Unit Treatment Value Assumption (SUTVA)**. Specifically, it violates the "no interference" assumption. $Y_{Britain}$ depends not only on $D_{Britain}$ but on $D_{China}$ and $Y_{China}$.
  **The Residue:** In econometrics, we handle this with General Equilibrium models or spatial lag models. In the Great Divergence literature, this is largely ignored. Pomeranz's "New World" argument relies on trade (interference), yet he treats the endowment as a local treatment.
  **Verdict:** The historians are estimating a **partial equilibrium treatment effect** in a **general equilibrium world**. If colonial extraction ($D_{colony}$) increases $Y_{Britain}$ by depressing $Y_{India}$, the global sum of $Y$ might be unchanged. Your vocabulary correctly identifies this as an identification failure: we cannot identify the *global* cause of growth if the treatment is merely redistributive. The residue here is a genuine blind spot in the historical debate; they are arguing over distributional mechanisms while claiming to explain aggregate growth.

  #### 2. The Sample: $N=1$ and Selection on the Dependent Variable
  **Your Suspicion:** We have one draw per civilization, selected for rarity.
  **Econometric Translation:** This is **selection on the dependent variable**. We observe the distribution of $Y$ conditional on $Y > \text{threshold}$. We do not observe the support of $Y$ for polities that failed. Furthermore, with $N=1$ (per civilization), we cannot estimate variance. We are fitting a line through one point.
  **Historian's Defense:** Historians do not claim to estimate $\beta$ for a super-population of civilizations. They claim to perform **process tracing**. In your vocabulary, this is an attempt to identify the *mechanism* ($\frac{\partial Y}{\partial D}$) rather than the *effect size*. They use within-unit variation (time-series within Britain, cross-regional within China) to substitute for cross-unit variation.
  **The Residue:** This is the difference between **external validity** (estimating an ATE) and **internal validity of a singular event**. Econometrics is designed for the former; history is obsessed with the latter. When historians argue about the Great Divergence, they claim their narrative has *explanatory power* for the single draw. Your vocabulary flags this as **overfitting**: a model that perfectly explains $N=1$ has zero degrees of freedom.
  **Verdict:** The historians have no statistical resource for this. Their resource is **counterfactual consistency**: "If coal were the cause, then Germany (which had coal) should have industrialized simultaneously." This is a form of **placebo test** on adjacent units. It is valid logic, but it does not solve the $N=1$ inference problem; it merely pushes it to a different control group.

  #### 3. The Choice of Contrast Class (The Reference Class Problem)
  **Your Suspicion:** The answer changes depending on whether the control is Holland, China, or the 11th Century.
  **Econometric Translation:** The **control group selection** is determining the **identification assumption**.
  *   UK vs. Holland: $\Delta D_{inst} \approx 0$, $\Delta D_{geo} \approx 0$. Residual variance is high. Identification fails.
  *   UK vs. China: $\Delta D_{inst} > 0$, $\Delta D_{geo} > 0$. Multicollinearity prevents separating $\beta_{inst}$ from $\beta_{geo}$.
  *   UK (1800) vs. UK (1600): Time-series identification. Confounded by global shocks.
  **The Residue:** In econometrics, the research question ($Y$ on $D$) is fixed *ex ante*, and we search for a valid control. In the Great Divergence debate, the **choice of control is the explanandum**. Pomeranz chooses China to make institutions look irrelevant. Institutionalists choose Holland or Medieval Europe to make institutions look decisive.
  **Verdict:** This is not a defect of your vocabulary; it is a defect of the historical question. The question "Why Britain and not China?" is not a causal query; it is a **reference class selection**. Your vocabulary reveals that there is no single "Great Divergence" parameter. There is only $\beta_{UK|China}$, $\beta_{UK|Holland}$, etc. The historians are arguing over which $\beta$ is the "true" one, but the "true" one is undefined without a fixed population of inference.

  ---

  ### IV. Conclusion: Defect or Ill-Posed?

  Is the residue a defect of your vocabulary, or a sign that the historical debate is less well posed than it looks?

  **It is a sign that the historical debate is ill-posed.**

  The econometric reframe is the cleaner version of what the historians are groping toward, but it exposes that their central question is category-error prone.

  1.  **The "Cause" of a Singular Event:** Econometrics distinguishes between estimating an **Average Treatment Effect** (a property of a population) and explaining a **single realized draw** (a property of a specific history). The Great Divergence literature conflates these. They want the authority of a law (ATE) for a story about a unique event (single draw). Your vocabulary shows this is impossible: you cannot estimate variance from a single draw.
  2.  **Identification vs. Narrative:** Historians treat **narrative plausibility** as **identification**. If the story "Coal allowed steam engines" fits the data points, they claim identification. Your vocabulary demands an exclusion restriction or an instrument. The residue you feel is the gap between *plausible mechanism* and *identified causality*.
  3.  **The Reference Class:** The fact that the answer depends on the contrast class (China vs. Holland) proves that "The Great Divergence" is not a natural experiment with a fixed $D$ and $Y$. It is a **constructed comparison**.

  **Final Verdict:**
  The residue is not a limitation of causal inference vocabulary; it is the sound of that vocabulary doing its job. It is detecting that the Great Divergence debate is trying to solve for $\beta$ without defining the population, without satisfying SUTVA, and with selection on the dependent variable.

  The historians are not doing bad econometrics; they are doing **structural narrative analysis**. They are attempting to reconstruct the structural parameters of a complex system from a single equilibrium observation. Your vocabulary cannot "fix" this because there is no more data to be had. However, applying your vocabulary forces the admission that the debate is not about "what caused industrialization" (a universal $\beta$), but "which counterfactual world is the most appropriate baseline for Britain?" (a choice of identification strategy).

  The residue is the realization that **history is not a sample; it is a realization.** Econometrics is built for samples. When you apply it to a realization, the "error term" swallows the model. The historians are arguing about the contents of the error term and calling it the treatment.
