      2.  **The Identification Strategy:** What historians claim vs. what is needed.
      3.  **The Violence:** Endogeneity, SUTVA, Measurement.
      4.  **Residue Report:**
          *   SUTVA/Interdependence.
          *   $N=1$/Selection.
          *   Contrast Class/Reference Class.
      5.  **Conclusion:** Defect or Ill-posed?

      *Key Terminology Check:* Potential outcomes, treatment effects, fundamental problem, SUTVA, selection on observables/unobservables, OVB, bad controls, overidentification, external validity, ATE vs. single draw.

