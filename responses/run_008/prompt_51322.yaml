  7.  **Self-Correction/Nuance Check:**
      *   *Did Quine think the criterion was useless?* No, he thought it was the *only* way to do ontology, provided you accept the relativity.
      *   *Is (5) accurate?* Quine says there is no fact of the matter *absolutely*. But there is a fact of the matter *relative to background B*. The flatmate's (5) says "no fact of the matter... any more than there is about what 'gavagai' means." This is slightly ambiguous. Regarding *gavagai*, there is no fact even relative to the tribe's behavior. Regarding *rabbit*, there is no fact relative to *nothing*, but there is relative to *background English*. I need to clarify this distinction. The flatmate's (6) says "no determinate answer." Quine would say "no absolute answer." This is the key pivot.
      *   *Wait, one nuance:* Quine distinguishes between the *inscrutability of reference* (rabbit vs. part) and the *indeterminacy of translation* (manuals). Inscrutability applies at home. Indeterminacy applies abroad. But both lead to relativity.
      *   *The User's specific worry:* "It would follow that we cannot so much as state what our best science says there is."
