  Next week she's bringing two new cases and I'd like to walk in with a prediction instead of my usual flailing. Case one: a detailed whole-brain emulation of the locust, indistinguishable from the living insect in its inputs and outputs, but running as software on ordinary serial hardware, one processor at a time, so that no part of the physical machine is wired up the way the brain is. Case two: the locust connectome physically rebuilt, not simulated, in an analog circuit, each neuron a tiny silicon element genuinely wired to the others with real recurrent connections. Predict her verdicts on both, lay out the rules that fit her track record equally well (I can see roughly a "what matters is the physical irreducible cause-effect structure" rule and a "what matters is what the thing does" rule, and I suspect a third one about needing living biological substrate hiding in there too), say where those rules agree and disagree about the two new cases, and tell me what further case I could spring on her that would best expose which rule she's actually running. I care less about guessing right than about understanding what the candidate rules are and why they come apart exactly where they do.
