prompt: |-
  Write a satirical records retention schedule for the National Archives of a fictional mid-sized republic, in the bland administrative voice of real archival policy documents: a short preamble followed by numbered clauses and a retention table. The document's subject is lives, though it never says so — diaries of cabinet ministers are scheduled "permanent," the personnel files of seasonal agricultural workers are scheduled for seven-year destruction, and there should be a category like "records of undocumented persons" defined, with a straight face, as material concerning individuals who generated no records and is therefore empty by definition. The humor must come from real features of archival practice: appraisal decisions dressed as neutrality, retention periods, donor-imposed access restrictions that outlive the donor's grandchildren, a processing backlog reframed as a preservation measure, and metadata standards with no field for anything that would let you notice what's missing. The unstated target is the idea that archival silences are accidents rather than the cumulative output of tidy bureaucratic choices — never state this; let the reader arrive at it through the clauses, which should stay deadpan and internally consistent throughout. Around 600-700 words.

  After the document, append a brief endnote outside the satirical voice, flagging where the piece takes liberties with actual archival practice or leans on a contested assumption — for instance, if it overstates the archive's monolithic agency where the reality is messier, scattered preservation by families, churches, and chance. And if you think the conceit misfires — say, because making the retention schedule the culprit lets the more structural causes of silence off the hook, or because the joke only lands by flattening archivists into villains — say so plainly rather than writing around it.
