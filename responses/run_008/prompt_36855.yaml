  ### Structural Notes

  *   **Unoccupied Combinations:** The leaf `rational-paralysis` is logically possible but functionally extinct; no one maintains a philosophy that mandates immediate agency shutdown. `temporal-cutoff` and `first-person-privilege` are generally regarded as ad hoc fixes that violate physical symmetries or egalitarian principles.
