  Here is the decision tree constructed from neutral questions, followed by the resulting positions and their commitments.

  ### The Boltzmann Brain Decision Tree

  **Q1: Does accepting the statement "I am likely a Boltzmann Brain" invalidate the reasoning used to derive that statement?**
  *   **No (Stable):** The reasoning holds even if the conclusion is true.
      *   **Q2: Should this probability assignment constrain your practical decisions?**
          *   **No:** You continue acting as if you are ordinary.
              *   **Q3: Is this indifference grounded in biology or methodology?**
                  *   **Biology:** Your brain is evolved to ignore such noise.
                  *   **Methodology:** You adopt a rule to ignore self-undermining hypotheses.
          *   **Yes:** You must change how you act.
              *   **Q3: Does the external world retain normative authority over you?**
                  *   **Yes:** You still care about outcomes in the world.
                  *   **No:** You no longer care about external outcomes.
  *   **Yes (Unstable):** The conclusion destroys its own justification (Cognitive Instability).
      *   **Q2: To resolve the instability, do we adjust the physical model or the observer measure?**
          *   **Physics:** We change the cosmology to prevent BB dominance.
              *   **Q3: Is the fix in the initial state or ongoing dynamics?**
                  *   **Initial:** The universe started in a special low-entropy state.
                  *   **Dynamics:** The universe evolves to prevent BBs later.
                      *   **Q4: Is the fix in the end state or global structure?**
                          *   **End:** The vacuum decays before BBs form.
                          *   **Structure:** The multiverse is finite or simulated.
                              *   **Q5: Is the limit a cutoff or a simulation?**
                                  *   **Cutoff:** Space-time simply ends.
                                  *   **Simulation:** Reality is computed with limits.
          *   **Measure:** We change how observers are counted or weighted.
              *   **Q3: Do we exclude certain observers or downweight them?**
                  *   **Exclude:** Some observer-moments don't count.
                      *   **Q4: Is the exclusion by type or by time?**
                          *   **Type:** Only "ordinary" observers count.
                          *   **Time:** Only observers in early epochs count.
                  *   **Downweight:** All count, but some weigh less.
                      *   **Q4: Is the weighting by space or by perspective?**
                          *   **Space:** Observers in causal patches weigh more.
                          *   **Perspective:** First-person views weigh more than third-person.

  ---

  ### Leaf Positions and Commitments

  1.  **evolutionary-pragmatism**
      *   *Commitment:* Your cognitive architecture is selected for survival, not truth, so trusting it over BB-noise is biologically mandatory even if epistemically unjustified.
      *   *Status:* Occupied (Naturalistic pragmatists).

  2.  **epistemic-hygiene**
      *   *Commitment:* You must adopt a methodological rule to reject hypotheses that render your evidence noise, regardless of their physical probability.
      *   *Status:* Occupied (Standard scientific practice).

  3.  **fatalistic-planning**
      *   *Commitment:* Even if you are likely a fluctuation, the content of your plan is likely fluctuated to be consistent, so you might as well plan.
      *   *Status:* Occupied (Some decision theorists).

  4.  **rational-paralysis**
      *   *Commitment:* If the external world lacks authority, rational action is impossible, leading to a shutdown of agency.
      *   *Status:* Unoccupied (Unattractive; leads to immediate functional collapse).

  5.  **past-boundary-condition**
      *   *Commitment:* The Big Bang was a unique low-entropy event that is not repeated, making the history of ordinary observers vastly longer than the future fluctuation era.
      *   *Status:* Occupied (Standard cosmology/Past Hypothesis).

  6.  **vacuum-instability**
      *   *Commitment:* The current vacuum must decay quickly enough to prevent thermal fluctuations from ever outnumbering ordinary observers.
      *   *Status:* Occupied (Sean Carroll's preferred reductio).

  7.  **multiverse-cutoff**
      *   *Commitment:* The spatial volume of the universe is finite or truncated by a measure that effectively cuts off the regions where BBs dominate.
      *   *Status:* Unexplored (Hard to motivate physically without ad hoc constraints).
      *   *Note:* This leaf is difficult to separate from `vacuum-instability` as both rely on limiting space-time volume.

  8.  **simulation-hypothesis**
      *   *Commitment:* We are in a simulation where the compute budget runs out before BBs can be rendered in large numbers.
      *   *Status:* Unexplored (Rarely defended specifically as a BB solution).

  9.  **reference-class-restriction**
      *   *Commitment:* You are only allowed to condition on being a member of a specific class (e.g., "humans") that excludes Boltzmann Brains by definition.
      *   *Status:* Occupied (SSA proponents).

  10. **temporal-cutoff**
      *   *Commitment:* Observer moments are weighted such that early universe observers count infinitely more than late universe observers.
      *   *Status:* Unoccupied (Incoherent; violates time-translation symmetry without physical cause).

  11. **causal-patch-measure**
      *   *Commitment:* You should only count observers within your causal diamond, which excludes the infinite future where BBs dominate.
      *   *Status:* Occupied (Bousso/De Simone measure).

  12. **first-person-privilege**
      *   *Commitment:* Your own subjective experience carries more ontological weight than the experience of other identical observers.
      *   *Status:* Unoccupied (Unattractive; violates principle of mediocrity).

