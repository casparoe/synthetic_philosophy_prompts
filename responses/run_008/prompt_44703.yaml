answer: |-
  The dispute survives the translation as a formal structural conflict, but the translation destroys the normative ontology of the ethical claims, reducing moral weight to risk preference and obscuring the distinction between uncertainty across states and diversity across persons. When you map the ethical debate onto your actuarial toolkit, you preserve the algebraic relationships—the concave transformations, the summation of utilities, the ordering of distributions—but you lose the metaphysical status of the agents involved. In your world, concavity describes a single agent's attitude toward their own uncertain future, whereas in the ethical debate, concavity describes an observer's judgment about the relative importance of distinct people's certain outcomes. The translation works mathematically because both fields rely on the same convex analysis, but it fails philosophically because it treats interpersonal comparisons as intrapersonal risks, thereby smuggling in a utilitarian aggregation principle that prioritarians and egalitarians are trying to critique or refine. You can calculate the priority view perfectly using a concave social welfare function, but calling that concavity risk aversion implies a social entity that bears the risk, which does not exist.

  To restate the positions in your vocabulary, prioritarianism looks exactly like maximizing the expected utility of a representative agent whose utility function over well-being is strictly concave. If you treat individual well-being scores as realizations of a random variable representing the distribution of welfare in a population, the prioritarian sums the concave transformation of those scores, which is mathematically identical to calculating the expected utility of a lottery where each person represents a state of the world with equal probability. Telic egalitarianism, however, resists a clean mapping because it values the reduction of dispersion independently of the sum. In actuarial terms, this resembles an objective function that penalizes variance or higher moments of the distribution regardless of the mean, similar to a risk measure that charges capital for volatility even if the expected loss remains unchanged. The leveling-down objection translates into your framework as a scenario where you reduce the mean of the distribution to eliminate variance. A standard risk-averse agent, governed by second-order stochastic dominance, would reject a mean-preserving spread that increases risk, but leveling down is not mean-preserving; it reduces the mean. Your toolkit of stochastic orderings typically ranks distributions with equal means, or it requires a trade-off between mean and variance. The egalitarian claim that leveling down is in one respect good translates to the assertion that the reduction in variance has positive value even when the reduction in mean is negative enough to lower the certainty equivalent. Your suspicion is correct that this translation smuggles an assumption: you are modeling the population as a single agent facing a lottery over identities, often called the veil of ignorance model. This assumes that the inequality is bad because it represents risk to a hypothetical soul who might end up as anyone, but telic egalitarianism explicitly rejects this instrumental justification. They claim inequality is bad even if no one faces a risk of being anyone, because the pattern itself is objectionable. By translating this into risk aversion, you are imposing an agent-relative structure on a principle that claims to be agent-neutral, effectively turning a moral judgment about a static pattern into a preference about an uncertain prospect.

  When you use this translation to locate the dispute precisely, you find that the silence of concave orderings where the means differ is not just a gap in the math but a reflection of the philosophical disagreement. Second-order stochastic dominance tells you that if two distributions have the same mean, every risk-averse agent prefers the one with less dispersion. This captures the prioritarian intuition perfectly: help the worse off because the concave transformation gives their gains more weight, which mathematically favors transfers from rich to poor that preserve the mean. However, leveling down changes the mean, and standard stochastic dominance goes silent. This silence restates the objection because it shows that within the standard expected utility framework, there is no parameter that values equality independently of the sum of utilities. To capture the egalitarian view, you would need to modify the objective function to include a penalty term for inequality that operates separately from the utility summation, effectively breaking the expected utility hypothesis. Regarding prioritarianism and Parfit's distinction, your actuarial vocabulary struggles to express a concavity that is about moral weight without implying risk aversion because in expected utility theory, the curvature of the utility function does double duty. It represents both the diminishing marginal utility of wealth and the attitude toward risk. Parfit insists that priority is not diminishing marginal utility of resources, because even if resources yield linear utility, the moral weight of a utility gain should be higher for the worse off. In your terms, this means the concavity should apply to the utility function itself, not the wealth function. You can model this by defining a social welfare function that is concave in individual utilities, but if you interpret that concavity as risk aversion, you are back to the veil of ignorance model where society is risk-averse over the distribution of lives. Parfit wants to say this concavity is not about risk at all; it is about the moral importance of the benefit. Your vocabulary cannot easily separate these because it is designed to model preferences under uncertainty, not moral weights under certainty. If you treat the concavity as a weighting function rather than a utility function, you are no longer doing expected utility theory; you are doing weighted summation. The residue is not a defect of your vocabulary but a sign that the philosophical claim relies on a normative structure that expected utility theory was not built to capture. Expected utility theory describes how a rational agent should behave given their preferences, whereas prioritarianism prescribes how an observer should weight the interests of others. The conflation of risk aversion with moral weight works algebraically but fails ontologically, because risk aversion implies a subject who fears the loss, while moral priority implies an observer who values the relief. You can build the model, but you cannot interpret the parameters without stepping outside the actuarial framework into ethics.
