prompt: |-
  So my older brother is doing philosophy at uni and keeps sending me stuff he thinks will "expand my horizons" lol. The latest thing is this analogy by Douglas Hofstadter from his book I Am a Strange Loop. I actually really like the setup but then my brother summarised what it's supposed to *mean* and something feels off. The setup (which I'm fairly sure I've got right): imagine a huge billiard table called the careenium, which is basically a stand-in for your cranium. On it there are loads of tiny magnetic balls (simms) flying around and clumping together and breaking apart, and these clumps are simmballs, which are supposed to be like the symbols or concepts in your brain — so the simms are like the neurons and the simmballs are like the thoughts. The walls of the table also bounce differently depending on what's going on outside it, so information about the world gets into the system that way. Hofstadter's question is basically: who shoves whom around in there? Do the little balls do all the actual pushing, or do the simmballs push the little balls around?

  Here is how my brother explained it on his blog: "The answer is clearly that only the simms are real and only they do any pushing. A simmball is just a pattern that spectators project onto the table, the way a whirlpool in a river isn't really a thing — it's just water moving. So when Hofstadter says the brain runs on symbols, he means that as a convenient shorthand, not that the symbols actually do anything. The symbol level is a fiction for the spectators, which is why psychology can never be a real science, because the only genuine causes are down at the neuron level. And this is why AI can never have genuine concepts: a pile of balls can't mean anything, someone has to be standing outside the table watching it for the 'symbols' to exist at all." He ends by saying this proves free will is an illusion because my choice to write this post is "really" just simms bumping around.

  I don't know anywhere near enough to push back, and googling it just gives me people arguing about consciousness which doesn't help. Could you go through his summary bit by bit and tell me what a philosopher who actually knows Hofstadter would accept, what's an oversimplification, and what's just wrong? I've read enough to know Hofstadter is big on the "strange loop" idea where the self is a symbol that refers to itself, and that seems pretty inconsistent with my brother's "the symbol level does nothing" reading, but maybe I'm the one misreading it. Also does the AI conclusion actually follow from whatever parts of his summary are true, or is he sneaking that in? Please answer in British English btw, my brother is pretentious enough already without me picking up American spellings on top. Sorry this got so long!
