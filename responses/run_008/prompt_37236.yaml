      *   *Hofstadter's Stance:* He is a *compatibilist* regarding levels of description. He argues for *downward causation* (or at least, the legitimacy of high-level causality). He believes the pattern *is* the thing. The "I" is a symbol that has causal power *because* it is a stable pattern.
      *   *Key Concept:* "Real patterns" (Daniel Dennett is a big influence here). A whirlpool *is* real, even if it's made of water. The pattern has predictive and explanatory power.
