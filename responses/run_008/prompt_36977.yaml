      *   *Nuance on Donor Conception:* I need to be careful here. If the uncle thinks marriage is *only* about natural procreation, donor conception might look like "making" a child rather than "begetting" one. I should mention this distinction.
      *   *User's Intuition:* Validate that her feeling ("the 'kind' is doing all the work") is philosophically astute. That is exactly the critique levelled by opponents of Natural Law theory (e.g., Elizabeth Brake, Martha Nussbaum).

