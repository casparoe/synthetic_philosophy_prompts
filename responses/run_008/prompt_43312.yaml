prompt: |-
  I am a sixth-form student who has been programming since Year 8; I am fluent in functions and objects, state versus statelessness, pure functions, mocks that stand in for a real implementation, and the difference between a library and the program that calls it. My philosophy society keeps arguing about whether large language models such as ChatGPT are agents, simulators, or something else — by "simulator" we mean the view that the model has no goals or beliefs of its own but plays, or runs, characters that do — and the argument always stalls on words like "belief" and "goal" that no one defines. Please restate the three main positions (genuine agent, simulator, and the deflationary "it is only autocomplete") in my vocabulary, as faithfully as you can: the model as an enormous function, the conversation as an evaluation context it is run inside, personas as mocks or roles it instantiates, and so on. Then give me the residue report: which parts of the debate map cleanly onto programming, which survive only with distortion, and which have no counterpart in my vocabulary at all — and say whether the residue reflects a gap in my vocabulary or in the original debate. My own hypothesis is that the whole question reduces to one about state (agents are stateful objects, models are stateless functions), so please tell me specifically whether that is right, or what it leaves out. Kindly write your answer in British English.
