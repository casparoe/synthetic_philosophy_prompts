answer: |-
  ### Adequacy Conditions for an Account of Deterministic Unpredictability

  To establish a standard for evaluating whether deterministic systems can be genuinely unpredictable, an account must satisfy a set of adequacy conditions derived from established dynamical phenomena and philosophical constraints. The following requirements are motivated by specific cases where naive intuitions regarding prediction fail.

  **1. The Precision-Horizon Trade-off (Motivated by the Logarithmic-Horizon Case)**
  *   **Requirement:** The account must quantify the relationship between initial condition precision and prediction horizon. It must distinguish between *practical* unpredictability (limited by finite measurement resolution) and *in-principle* unpredictability (limited by the dynamics or logic itself).
  *   **Rationale:** In systems with positive Lyapunov exponents, error grows exponentially. An adequate account cannot simply declare the system unpredictable; it must specify that predictability degrades logarithmically with precision. It must explain why a system remains deterministic yet effectively unpredictable for any finite observer, without conceding that the future is ontologically open.

  **2. The Ontological Fidelity Condition (Motivated by the Shadowing Case)**
  *   **Requirement:** The account must distinguish between predicting the *actual* trajectory of a specific initial state and predicting a *shadow* trajectory that is qualitatively indistinguishable but numerically distinct.
  *   **Rationale:** Numerical simulations often diverge from the true orbit yet remain close to *some* valid orbit (the shadowing lemma). If an account counts shadowing as successful prediction, it risks conflating "predicting the system's behaviour" with "predicting a possible behaviour of the system." The account must specify whether fidelity to the specific initial state is necessary for a prediction to count as successful.

  **3. The Descriptive Level Sensitivity (Motivated by the Statistical Case)**
  *   **Requirement:** The account must treat predictability as relative to a level of description (e.g., micro-state trajectories vs. macro-state statistics). It must not assign a global label of 'predictable' or 'unpredictable' to a system without referencing the variables in question.
  *   **Rationale:** A mixing system may be unpredictable regarding specific states (weather) while being highly predictable regarding invariant measures (climate). An account that declares the system simply 'unpredictable' ignores the stability of statistical properties. The definition must accommodate the coexistence of trajectory unpredictability and statistical predictability.

  **4. The Computability Constraint (Motivated by the Algorithmic Case)**
  *   **Requirement:** The account must address whether the evolution function and initial conditions are computable. It must determine if unpredictability arises from the complexity of the mapping itself, such that no algorithm can compress the future state description shorter than simulating the system step-by-step.
  *   **Rationale:** Even with exact laws, if the orbit is algorithmically random, no computable predictor can outperform chance. This requirement forces the account to confront barriers that are not merely physical (measurement error) but logical (incompressibility), challenging the notion that determinism entails predictability for any rational agent.

  **5. The Deterministic-Stochastic Demarcation (Motivated by the Noise Case)**
  *   **Requirement:** The account must rigorously distinguish unpredictability arising from internal sensitivity to initial conditions (chaos) from unpredictability arising from external stochastic forcing (noise).
  *   **Rationale:** Conflating these sources leads to category errors. In the noise case, no amount of initial precision improves prediction beyond the variance of the forcing. In the deterministic chaos case, precision *does* help, albeit logarithmically. An adequate account must isolate the source of uncertainty to correctly classify the system's metaphysical status.

  **6. The Observer-System Relativity (Motivated by Determinism and Observer-Relativity)**
  *   **Requirement:** The account must explicitly state whether unpredictability is a monadic property of the system or a dyadic relation between the system and a class of predictors (defined by resources, time, or computational power).
  *   **Rationale:** A Laplacian demon with infinite resources might predict a system that is unpredictable to a polynomial-time bounded agent. If unpredictability is to be a 'serious' property, the account must decide if it is intrinsic to the dynamics or relative to the epistemic limitations of the predictor. It must not smuggle indeterminism into the dynamics to explain epistemic limits.

  **7. The Physical Specification Limit (Additional Requirement)**
  *   **Requirement:** The account must acknowledge physical limits on information density (e.g., Bekenstein bounds or quantum uncertainty) when defining 'initial conditions'.
  *   **Rationale:** Mathematical phase spaces often assume infinite precision is possible. A physically adequate account must recognise that specifying a real number with infinite digits is physically impossible. This bridges the gap between the mathematical 'in-principle' and the physical 'in-practice', preventing the account from relying on mathematically valid but physically unrealisable states.

  ***

  ### Meta-Analysis of the Requirements

  Having fixed the list, we must scrutinise the coherence and status of these demands.

  **Genuine Adequacy Conditions vs. Research Traditions**
  Requirements 1, 3, and 5 constitute genuine adequacy conditions. Any robust theory of prediction, regardless of philosophical allegiance, must account for the precision-horizon trade-off, the distinction between micro and macro descriptions, and the difference between chaos and noise. These are grounded in empirical and mathematical practice.

  Requirements 4 and 6, however, encode the commitments of specific research traditions. The Computability Constraint (4) presupposes a computationalist ontology (that prediction is essentially computation), which a Platonist or classical analyst might reject. Similarly, Observer-System Relativity (6) leans towards instrumentalism or constructivism; a scientific realist might insist unpredictability must be grounded in the system's objective properties, not the observer's resources. Requirement 2 sits on the boundary; it is mathematically precise but its philosophical weight depends on whether one values 'truth' or 'empirical adequacy' in prediction.

  **Incompatibilities within the List**
  There is a significant tension between Requirement 1 and Requirement 4. Requirement 1 (Logarithmic-Horizon) typically assumes that *in-principle* predictability exists (given infinite precision), distinguishing it from practical limits. Requirement 4 (Algorithmic Case), however, posits a barrier that persists *even given the exact form of the evolution law*, suggesting that for computable predictors, in-principle predictability may not exist for algorithmically random orbits.
  Satisfying both requires a disambiguation of 'in-principle'. If 'in-principle' means 'mathematically determined by prior states', Requirement 1 holds. If 'in-principle' means 'knowable by a finite rational agent', Requirement 4 holds. The list itself reveals that 'deterministic unpredictability' is not a unified phenomenon but fractures depending on whether one adopts a mathematical or a computational epistemology. This incompatibility is a finding: a single unified account may be impossible without privileging one notion of 'possibility' over the other.

  **The Most Exclusionary Requirement**
  Requirement 4 (The Computability Constraint) does the most to exclude candidate accounts. Classical dynamical systems theory often treats predictability as a continuous variable (Lyapunov exponents) independent of computability. By introducing algorithmic randomness as a hard barrier, Requirement 4 eliminates accounts that rely solely on continuity, differentiability, or measure theory without considering recursion theory. It forces the account to confront the possibility that a deterministic system is effectively indeterministic for any computable observer.

  ***

  ### Evaluation of Contenders

  Here we evaluate three prominent accounts against the established requirements.

  **1. The Naive Sensitivity Account (SIC)**
  *Identifies unpredictability solely with Sensitivity to Initial Conditions (positive Lyapunov exponents).*
  *   **Req 1 (Horizon):** **Satisfies.** This is the core mechanism of the account.
  *   **Req 2 (Shadowing):** **Fails.** It does not distinguish between the true orbit and a shadowing orbit; divergence is treated as total loss of prediction.
  *   **Req 3 (Statistics):** **Fails.** It focuses on trajectory divergence and often ignores statistical stability (e.g., declares weather unpredictable without acknowledging climate predictability).
  *   **Req 4 (Algorithmic):** **Fails.** It ignores computability; a system can be sensitive but computable, or insensitive but algorithmically random.
  *   **Req 5 (Noise):** **Fails.** Often conflates stochastic noise with deterministic chaos under the umbrella of 'sensitivity'.
  *   **Req 6 (Relativity):** **Fails.** Treats unpredictability as an intrinsic property of the flow, ignoring the predictor's resources.
  *   **Req 7 (Physical Spec):** **Partial.** Acknowledges measurement error but often assumes mathematical continuity holds without physical bounds.

  **2. The Kolmogorov–Sinai (KS) Entropy Account**
  *Identifies unpredictability with the rate of information production (positive KS entropy).*
  *   **Req 1 (Horizon):** **Satisfies.** KS entropy quantifies the rate of divergence and information loss.
  *   **Req 2 (Shadowing):** **Partial.** As a measure-theoretic concept, it deals with typical orbits but does not explicitly address the ontological status of shadowing trajectories in specific instances.
  *   **Req 3 (Statistics):** **Satisfies.** Being measure-theoretic, it naturally accommodates statistical descriptions and invariant measures.
  *   **Req 4 (Algorithmic):** **Partial.** Brudno's theorem links KS entropy to algorithmic complexity, but KS entropy itself is not defined via computability, potentially missing non-computable nuances.
  *   **Req 5 (Noise):** **Satisfies.** Can distinguish deterministic chaos (finite entropy rate) from pure stochastic processes (infinite entropy rate) in idealised settings.
  *   **Req 6 (Relativity):** **Fails.** KS entropy is an invariant of the dynamical system, not relative to the observer's computational class.
  *   **Req 7 (Physical Spec):** **Fails.** It is a mathematical invariant defined on measure spaces, indifferent to physical realisability of infinite precision.

  **3. The Computational Irreducibility Account**
  *Identifies unpredictability with the inability to compute the future state faster than simulating the system step-by-step.*
  *   **Req 1 (Horizon):** **Satisfies.** Explains the horizon as a function of computational cost and precision.
  *   **Req 2 (Shadowing):** **Partial.** Focuses on the calculation process; whether the calculation matches the 'true' orbit is secondary to whether it can be shortcut.
  *   **Req 3 (Statistics):** **Partial.** Can accommodate statistical prediction if the statistical properties are compressible, even if trajectories are not.
  *   **Req 4 (Algorithmic):** **Satisfies.** This is the defining strength of the account; it directly addresses algorithmic randomness.
  *   **Req 5 (Noise):** **Satisfies.** Distinguishes between algorithmic generation (deterministic) and true random oracles (stochastic).
  *   **Req 6 (Relativity):** **Satisfies.** Explicitly defines unpredictability relative to computational resources and time bounds.
  *   **Req 7 (Physical Spec):** **Satisfies.** Naturally aligns with physical limits on computation and information density.

  **Summary Verdict:** The Naive Sensitivity account fails to meet the rigorous demands of modern dynamics, particularly regarding statistics and computability. The KS-Entropy account is mathematically robust but ontologically neutral regarding the observer. The Computational Irreducibility account satisfies the most requirements, particularly the critical Computability and Relativity constraints, though it shifts the definition of prediction from 'matching nature' to 'compressing description'.
