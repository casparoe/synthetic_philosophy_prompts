answer: |-
  ### Brainstorm
  The Australian system (Alternative Vote with compulsory full preferential voting) forces voters to submit complete orderings. This aligns with the domain conditions of Arrow's theorem (completeness and transitivity), but it enforces them legally rather than assuming them psychologically. The tension lies between the *realist* view (voting reveals pre-existing preferences) and the *constructivist* view (voting creates a decision). Arrow's theorem warns about aggregating orderings, but the Australian system sidesteps the impossibility result by only selecting a winner, not a full social ordering. However, the "bite" of Arrow is felt in the sensitivity of the outcome to the forced lower preferences (noise). The institution presupposes preferences are discoverable facts. Strictly, it only needs formal compliance. It is not incoherent, but underdetermined (compatible with multiple theories). A proceduralist shift would change ballot design (randomization) and the narrative of legitimacy (construction vs. discovery).

  ### 1. "The implicit theory"
  The Australian practice operates on a robust realist ontology of preferences. It presupposes that every voter possesses a complete, transitive ordering of all candidates prior to entering the booth. Voting is conceived epistemically as an act of measurement: the ballot is a sensor recording a pre-existing psychological state. The requirement to number every box implies that indifference is not a valid political state; for any pair A and B, the voter must prefer one or the other. Consequently, the "will of the people" is treated as a latent variable waiting to be discovered through aggregation. The system assumes that the noise introduced by forced ranking (donkey votes) is negligible compared to the signal of genuine preference. Ultimately, legitimacy derives from the accuracy of this discovery process; if the count fails to reveal the true majority will due to fabricated lower preferences, the outcome is theoretically compromised. The institution treats partial ignorance as a solvable informational deficit rather than a structural feature of political choice. It assumes the voter is sovereign over their ranking, implying that if they cannot rank, they are unfit to vote. This creates a picture where the collective will is a sum of individual truths, hidden but recoverable. The strict ordering implies no ties are permitted in the public sphere, forcing private ambiguities into public distinctness.

  ### 2. "What it strictly needs"
  Mechanically, the system does not strictly require true preferences, only consistent inputs. To function, the count needs a deterministic rule for eliminating losers and transferring votes; it requires syntactic completeness, not semantic truth. A voter could randomize their lower preferences, and the machine would process them identically to sincere rankings. Therefore, the practice survives without the ontological claim that preferences pre-exist. It merely needs the *form* of an ordering to prevent premature exhaustion of ballots. The strict necessity is procedural continuity: every ballot must remain active until a candidate reaches majority. The presupposition that voters *know* their rankings is convenient for legitimacy but unnecessary for the arithmetic. Even if every voter treated the ballot as a randomization device, a winner would emerge. Thus, the system needs compliance with the numbering rule, not compliance with the theory of rational choice. The "will of the voters" is operationally defined by the count itself, not by an external standard of truth. The system tolerates lies as long as they are formalized. It needs the *structure* of preference, not the *substance*. The invalidation of partial ballots underscores that the ritual of completion outweighs the expression of sincere top-choice alone.

  ### 3. "Where it breaks, or doesn't"
  This reveals the practice is not incoherent, but profoundly underdetermined. Arrow's theorem assumes individual orderings are complete and transitive; the Australian law enforces this by fiat. Arrow warns that aggregating such orderings involves trade-offs, but it doesn't forbid the input requirement. The incoherence arises only if we insist the forced rankings represent true psychological states. If we view the ballot as a command to construct an ordering rather than report one, the tension dissolves. Multiple theories license this practice: a realist theory claims voters discover their preferences while marking; a constructivist theory claims the state mandates a fiction to ensure governability. Arrow bites here by highlighting that the "social preference" is sensitive to these fabricated lower bounds. If donkey votes shift the flow, the "discovered" will changes based on arbitrary data. Yet, the system remains stable because the first preference usually dominates. The picture isn't logically broken; it's empirically fragile. It relies on the hope that forced lower preferences correlate with sincere ones enough to maintain stability. We can maintain the practice while rejecting the realist metaphysics, treating the full ranking as a civic ritual rather than a data report. The "will" is not found, but formed through the constraint. The theorem reminds us that the aggregation method matters more than the input fidelity. Arrow's domain condition is satisfied legally, not psychologically. The system works because the social choice function is robust to noise, not because the noise is absent.

  ### 4. "What would change"
  Swapping to a proceduralist view shifts legitimacy from accuracy to participation. The ballot no longer measures truth but enforces a commitment to the process. We might allow "no preference" markers, but the counting algorithm would need to handle ballot exhaustion without invalidating the vote. Alternatively, we accept forced ranking as a duty to produce a majority, acknowledging the lower numbers as arbitrary but necessary sacrifices for stability. Ballot design might randomize candidate order to mitigate donkey voting, admitting the input is constructed. The count becomes a machine for generating legitimacy through resolution, not discovery. We stop asking if the winner represents the "true" will and ask if the process was fairly applied. The change is primarily rhetorical and design-based, not arithmetic. The state admits it is constructing a majority, not finding one. This honesty reduces the stigma of the donkey vote. It transforms the ballot from a survey into a contract. The voter agrees to play the game by the rules, regardless of their internal state.
