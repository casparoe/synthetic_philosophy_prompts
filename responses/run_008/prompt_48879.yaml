answer: |-
  The practice of enforcing advance directives (ADs) in dementia cases rests on a philosophical tension that is rarely acknowledged in clinical guidelines. To answer your questions, we must disentangle the *justificatory theory* (what hospitals say they are doing) from the *operational theory* (what their safeguards reveal they actually believe).

  ### 1. Reconstructing the Implicit Theory: Critical Interests and Narrative Integrity

  The practice of precedent autonomy does not presuppose that the directive-writer and the demented patient are **literally the same person** in a metaphysical sense. If strict numerical identity were the ground, there would be no need for "clear and convincing evidence" standards; the identity would be a biological fact. Nor does it rely on a **contractual model** of self-binding. As you note, we reject contracts that bind a future self to forfeit sweets or romantic companionship. If this were a contract, the consideration would be lacking, and public policy would void it as coercive against the future self's rights.

  Instead, the practice presupposes a theory of **Critical Interests** (most famously articulated by Ronald Dworkin). This theory distinguishes between:
  *   **Experiential Interests:** What feels good in the moment (enjoying a meal, feeling warmth).
  *   **Critical Interests:** What makes a life good *as a whole*, judged from a standpoint of reflective competence (dignity, independence, narrative coherence).

  Under this view, the earlier self has authority not because they are metaphysically identical to the later self, but because they are the only self capable of grasping the *critical interests* of the life being lived. The demented patient retains experiential interests (pleasure/pain) but loses the capacity for critical judgment. Therefore, the AD is not a command from one person to another, nor a contract, but the **last valid expression of the life's narrative integrity.** The earlier self is authorized to decide because they alone understand what constitutes a "benefit" or "harm" to the *biography* of the person, even if the *biology* is currently content.

  This explains the discrepancy between medical directives and "sweets/romance" directives. Medical decisions (withholding antibiotics/food) are viewed as touching upon the *threshold of dignity* and the shape of the life's conclusion. Directives regarding sweets or romance are viewed as infringing on the *current rights* of the sentient being without serving a critical interest weighty enough to override present liberty. The implicit theory is that precedent autonomy applies only where the stakes involve the *integrity of the life story*, not the *management of daily pleasure*.

  ### 2. Strict Requirements vs. Operational Reality

  If we strictly follow the theory of **Precedent Autonomy based on Critical Interests**, the practice should look very different from what we observe.

  *   **What Strict Precedent Autonomy Requires:** If the earlier self's critical interest in avoiding a demented state is sovereign, then the directive should be absolute. If the AD says "no antibiotics," and the patient develops pneumonia, administering antibiotics violates the autonomy of the author, regardless of whether the current patient smiles at the nurse. Current objections should be treated as symptoms of the pathology (like a child refusing a vaccine), not as valid dissent.
  *   **What the Practice Actually Does:** Institutions introduce safeguards that contradict strict precedent autonomy:
      1.  **Clear and Convincing Evidence:** This high bar suggests the system doubts the past self's authority to speak for the current state. It implies the current self deserves protection *from* the past self's potential errors.
      2.  **Comfort Care Exceptions:** Hospitals rarely withhold palliative care even if an AD demands "no treatment." This prioritizes the *current* body's freedom from suffering over the *past* mind's abstract principles.
      3.  **Weighting Current Objections:** When ethics committees allow current resistance to "muddy" the enforcement of an AD, they are implicitly acknowledging that the current sentient self has moral standing that rivals the past competent self.

  **Conclusion on Practice:** The boundary-drawing institutions actually do **not** track the reconstructed view of critical interests. Instead, the practice is a **hybrid**. It pays lip service to precedent autonomy (allowing the AD to exist) but quietly borrows from the rival view (**Current Best Interests**) to mitigate the harshness of enforcing a dead man's will against a living, smiling body. The safeguards are admissions that the "Critical Interests" theory is too brittle to apply without modification. The system is trying to honor the past self's *values* without sacrificing the current self's *welfare*.

  ### 3. Implications of Adopting the Rival View Outright

  If we were to abandon the hybrid model and adopt the rival view outright—that **only the present patient's interests count** (a "Current Sentience" model)—current practice would undergo radical changes:

  1.  **ADs Become Advisory, Not Binding:** Advance directives for dementia would shift from *instructional* to *informative*. They would serve as evidence of the patient's values to help a surrogate decide what might make the *current* patient happy, but they could not veto treatments that benefit the current patient. If the patient enjoys eating, an AD demanding the withdrawal of artificial nutrition would be voided.
  2.  **The End of "Ulysses Contracts" in Dementia:** A competent person could not legally bind their future demented self to die. The authority to decide would transfer entirely to the surrogate at the moment of incompetence, guided strictly by the *current* best interests (pleasure vs. pain) of the demented individual.
  3.  **Treatment of Resistance:** Current objections would become decisive. If a demented patient reaches for a spoon, feeding them would be mandatory, regardless of a prior written instruction to starve. The "dignity" of the past self would be subordinate to the "well-being" of the present self.
  4.  **Shift in Legal Standard:** The legal standard would move from **Substituted Judgment** (what *would* the patient have wanted?) to **Pure Best Interests** (what is objectively good for this being now?). The "person" who wrote the directive would be treated, legally and ethically, as having ceased to exist when competence was lost; the demented body would be regarded as a new, vulnerable ward of the state/family.

  ### Summary

  The practice of precedent autonomy presupposes that a life has a **narrative value** that transcends its momentary experiential states, granting the competent author authority over the story's conclusion. However, institutional practice reveals a lack of commitment to this theory. By demanding high evidentiary standards and respecting current objections, the system implicitly concedes that the **sentient present self holds moral weight** that the past self cannot override. We currently operate in a contradictory middle ground: we invoke the authority of the dead to justify withholding care, but we invoke the rights of the living to ensure we don't withhold *too much*. Adopting the rival view outright would resolve this contradiction by rendering advance directives for dementia morally inert regarding life-sustaining treatment, prioritizing the comfort of the demented patient over the integrity of the life they once led.
