answer: |-
  You have hit on one of the most genuine philosophical controversies in modern astronomy. Your reading is not only fair; it is the central objection raised by planetary scientists (like Alan Stern, principal investigator of the New Horizons mission) against the IAU decision.

  You are asking about **metaphysical grounding**: does an object belong to a kind because of what it *is* (intrinsic), or because of what it *does/where it is* (extrinsic/relational)?

  Here is a breakdown of the philosophical patchwork you've identified, what theory might license it, and what would happen if you forced consistency.

  ### 1. Is your reading fair?
  **Yes.** The 2006 IAU definition makes "planet" a **relational kind**.
  *   **Intrinsic criteria:** Orbits Sun, Hydrostatic Equilibrium (roundness).
  *   **Extrinsic criteria:** Clears the neighborhood.

  "Clearing the neighborhood" is not about the object's mass or composition in isolation; it is about the ratio of the object's mass to the mass of everything else in its orbital zone. If you took Pluto and moved it to Earth's orbit, it would likely clear the neighborhood and become a planet. If you took Earth and moved it to the Kuiper Belt, it might not clear the neighborhood and would cease to be a planet.

  So, under the IAU definition, "planet" is not a property of the object; it is a property of the *system*. Your intuition that "nothing about Pluto itself changed" is the exact argument used by the opposition.

  ### 2. Is there a consistent theory of categories here?
  You noticed the inconsistency: Stars are classified by intrinsic physics (fusion, spectral type), while planets are classified by dynamics (orbit clearing), and moons are classified by hierarchy (barycenter location).

  Is there a view that licenses this patchwork? **Yes, but it's not a metaphysical view; it's a process-oriented one.**

  The underlying theory isn't "Natural Kinds" in the chemical sense (like Gold or Oxygen). It is **Formation and Evolutionary History.**
  *   **Stars:** Defined by the *process* they undergo (nuclear fusion). This is intrinsic because fusion depends on internal pressure/temperature.
  *   **Moons vs. Planets:** Defined by *formation location*. Did it form in a circumplanetary disk (moon) or a circumstellar disk (planet)? Since we often can't see the formation, we use the proxy of "what does it orbit now?" (the barycenter test).
  *   **Planets (IAU):** Defined by *dynamical dominance*. This is an evolutionary stage. A "planet" is a body that has finished accreting and become the dominant gravitational player in its zone.

  So, the consistent view is **Astrophysical Functionalism**. Objects are categorized by their role in the gravitational architecture of the system, not just their material composition.

  ### 3. "Downtown" vs. "Nature's Joints"
  You asked if "planet" is like "downtown" (a pragmatic convention) or carves nature at its joints.

  *   **The "Downtown" View (Nominalism/Conventionalism):** There is a continuum of sizes from dust bunnies to gas giants. Drawing a line at "clearing the neighborhood" is arbitrary, like drawing a line on a map and calling everything inside "downtown." It is useful for organizing textbooks, but there is no fundamental ontological break between Pluto and Eris.
  *   **The "Joints" View (Realism):** Proponents of the IAU definition argue there *is* a physical discontinuity. Bodies that clear their orbits behave differently than those that don't. They dominate their environment; they don't share it. This is a distinct dynamical state.

  **The Verdict:** Most philosophers of science lean toward your "Downtown" suspicion here. "Planet" is likely a **Homeostatic Property Cluster (HPC) Kind**. This means there is no single necessary and sufficient condition, but a cluster of properties (round, orbits star, dominant) that tend to hang together. Pluto has most of them, but fails the "dominance" cluster. The IAU decided that "dominance" was the essential trait, but that is a choice, not a discovery.

  ### 4. The Intrinsic Counterfactual
  If you insisted that kind membership must be grounded **only in intrinsic properties** (the Geophysical Planet Definition), here is what changes:

  *   **Pluto:** Returns as a planet. It is massive enough to be round (hydrostatic equilibrium).
  *   **Ganymede, Titan, Triton:** All become planets. They are round, differentiated bodies with geology (atmospheres, cryovolcanism).
  *   **Earth's Moon:** Becomes a planet. It is geologically complex and round.
  *   **Ceres, Eris, Makemake:** All become planets.
  *   **Stars:** **No change.** The definition of a star (sustaining hydrogen fusion) is already intrinsic. A star is a star even if it orbits another star (binary system).
  *   **Exoplanets:** The definition becomes consistent. A round body orbiting a star is a planet, regardless of whether it cleared its orbit.

  Under this view, the Solar System has roughly 110+ planets. The category "Moon" disappears as a fundamental kind and becomes merely a descriptor of location (like "continental island" vs. "island").

  ### 5. Which parts pin down the view?
  You asked which parts of the practice force a specific philosophical view and which are flexible.

  *   **The Hard Pin (Relational):** The **Moon/Planet distinction** is the strongest evidence for a relational view. Ganymede is physically more "planet-like" than Mercury. The *only* reason it is a moon is that its barycenter with Jupiter is inside Jupiter. This pins astronomy to a **hierarchical/relational ontology** for sub-stellar objects.
  *   **The Flexible Part (Intrinsic):** **Stellar Classification** is compatible with both views. You could argue fusion is intrinsic, or you could argue a star is defined by its role as the gravitational anchor of a system. But currently, it leans intrinsic.
  *   **The Contradiction:** The **Exoplanet** issue. The 2006 IAU resolution technically applies only to the Solar System ("orbits the Sun"). This is the smoking gun that the definition is **parochial**, not universal. If "Planet" were a natural kind, the definition would apply to the universe. The fact that it doesn't proves the category is, at least partially, a human convention specific to our local neighborhood.

  ### Summary
  Your argument exposes that astronomy is currently using two different metaphysical frameworks simultaneously:
  1.  **Physics Framework (Stars):** Intrinsic properties define the kind.
  2.  **Dynamical Framework (Planets):** Relational properties define the kind.

  If you demand consistency, you have two choices:
  1.  **Go Fully Intrinsic:** Adopt the Geophysical Definition. Pluto is a planet; Ganymede is a planet; "Moon" is just an orbital status. This aligns with how geologists view the world.
  2.  **Go Fully Relational:** Admit that "Planet" is a sociological category for "The Big Bosses of the Solar System." It is not a physical kind like "Star" or "Element." It is a status symbol.

  The reason the IAU chose the relational path is pragmatic: they wanted to keep the number of planets small for pedagogical reasons. But philosophically, you are correct: they grounded the identity of the object in its neighbors, not in itself.
