      *   *Check:* Make sure to distinguish between "values as policy goals" and "values as participation rights." The speaker conflated these.
      *   *Emphasis:* Highlight that "Vote on values" usually implies *everyone* votes, whereas "Bet on beliefs" implies *capital-holders* bet. The deflection tries to normalize this inequality as a "value choice."

  9.  **Final Polish:** Ensure the conclusion summarises *why* the deflection is suspicious (it masks an epistemic claim as a normative one).

  *(Self-Correction on British English)*: Ensure I don't slip into American spelling (e.g., use 'optimise' not 'optimize', 'labour' not 'labor', 'analyse' not 'analyze').

  *(Final check on the deflection logic)*: The speaker said: "What happens to non-traders? -> That's a value question."
  This implies: "Deciding whether non-traders matter is a decision we make via the 'Vote on values' stage."
  But if the market *executes* policy based on bets, and non-traders can't bet, their beliefs about *how to achieve* the values are silenced. The speaker is claiming that silencing is a legitimate normative choice. I need to make sure the analysis exposes whether that choice is defensible.

