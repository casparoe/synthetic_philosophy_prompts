prompt: |-
  PhD student in political theory here. A visiting speaker at our workshop on democratic innovations kept ending his slides with the futarchy slogan "vote on values, bet on beliefs", and used it to brush off a question about what happens to the preferences of people who dont trade in prediction markets — he said that was a value question, and value questions aren't what markets are for. The deflection seemed to be doing a lot of hidden work and I couldnt quite put my finger on why. Can you lay out the distinct precise theses that slogan could be expressing — e.g. what "values" means (majority preference? individual utilities? something aggregated, and if so how?), and what "bet on beliefs" actually commits you to (prediction markets as information aggregators that merely advise politicians, vs markets literally holding the decision rights)? For each reading, say whether it's a platitude, substantive but defensible, or flat-out false, and whether it would support the use the speaker put the slogan to — i.e. whether it makes "that's a value question" into a real answer rather than a dodge. Lay the readings out as a list I can bring to the follow-up seminar, and please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in political theory.
      *   **Context:** Workshop on democratic innovations. Visiting speaker used Robin Hanson's futarchy slogan ("Vote on values, bet on beliefs") to deflect a question about non-traders in prediction markets.
      *   **Task:** Deconstruct the slogan into distinct, precise theses. Analyze the meaning of "values" and "bet on beliefs" (advisory vs. decision rights). Evaluate each reading (Platitude, Substantive/Defensible, False). Determine if the reading justifies the speaker's deflection.
      *   **Format:** List format suitable for a seminar follow-up.
      *   **Tone/Style:** Academic, precise, critical, British English.

  2.  **Deconstruct the Slogan ("Vote on values, bet on beliefs"):**
      *   *Origin:* Robin Hanson (Futarchy).
      *   *Core Idea:* Separate normative judgments (what we want) from empirical judgments (what works).
      *   *The Deflection:* The speaker claimed excluding non-traders from the "betting" side is a "value question" (i.e., we decided via vote that only traders bet), implying the market mechanism itself doesn't need to account for their preferences in the *belief* aggregation phase.
      *   *The Problem:* In standard democracy, *everyone* gets a say in both values (policy goals) and beliefs (via representation/expertise). In futarchy, if you don't bet, do you lose influence over the *means*? Is the separation clean?

  3.  **Identify Distinct Theses/Readings:**
      I need to categorize the possible interpretations of the slogan along two axes:
      *   Axis 1: The Nature of "Values" (Aggregation method).
      *   Axis 2: The Role of "Beliefs/Markets" (Authority level).

      *Reading 1: The Institutional Division of Labour (The Standard Hansonian View).*
      *   Reading 2: The Epistemic Elitism View (Markets know best).
      *   Reading 3: The Proceduralist View (Values are purely democratic, beliefs are purely technocratic).
      *   Reading 4: The "Values as Constraints" View (Markets operate within normative bounds).

      *Refining the Readings for the specific deflection:*
      The speaker's deflection was: "Non-traders' preferences don't matter in the market because that's a value question."
      This implies a specific mapping:
      *   *Values:* Who gets to participate in the market? (Inclusion/Exclusion).
      *   *Beliefs:* What the market predicts.

      Let's structure the readings based on how they interpret the *boundary* between values and beliefs, as that's where the deflection happened.

      *   **Thesis 1: The Normative/Empirical Separation Thesis.** (Values = Ends, Beliefs = Means).
      *   **Thesis 2: The Participation-as-Value Thesis.** (Who gets to bet is a normative choice, not an epistemic one).
      *   **Thesis 3: The Market-Authority Thesis.** (Markets execute decisions vs. Markets advise).
      *   **Thesis 4: The Aggregation Equivalence Thesis.** (Voting aggregates values, Markets aggregate beliefs equally well).

      *Wait, I need to focus on the specific deflection:* "What happens to preferences of people who don't trade?" -> "That's a value question."
      This suggests the speaker is arguing that *access to the mechanism* is a value choice, not a belief requirement.
      So, I need to analyze readings that support or undermine this move.

      *Revised Plan for Readings:*
      1.  **The Strict Separation Thesis:** Values are ends, beliefs are causal models.
      2.  **The Access-as-Value Thesis:** Eligibility to trade is a normative distribution of power.
      3.  **The Decision-Rights Thesis:** Markets hold the reins vs. Markets advise.
      4.  **The Welfare Aggregation Thesis:** How "values" are summed (Majority vs. Utility).

  4.  **Drafting the Content (incorporating British English & Academic Tone):**
      *   *Spelling:* Organisation, labour, programme, analyse, etc.
      *   *Tone:* Rigorous, slightly sceptical (fitting a political theory PhD context), precise.

      *Drafting Thesis 1 (Separation):*
      *   Meaning: Hume's Guillotine applied to governance.
      *   Status: Substantive but contested (means/ends entanglement).
      *   Deflection support: Weak. Doesn't explain *why* exclusion is a value issue specifically.

      *Drafting Thesis 2 (Access/Eligibility):*
      *   Meaning: Deciding *who* bets is a normative choice about political equality.
      *   Status: Defensible.
      *   Deflection support: Strong. This is exactly what the speaker relied on. But is it true? If excluding people hurts accuracy, it's an epistemic cost, not just a value choice.

      *Drafting Thesis 3 (Authority):*
      *   Meaning: Does the market *decide* or *suggest*?
      *   Status: Crucial distinction. Hanson means decide.
      *   Deflection support: If markets decide, excluding people from betting removes their influence on outcomes entirely. If they only advise, exclusion matters less.

      *Drafting Thesis 4 (Definition of Values):*
      *   Meaning: Is it majority rule? Pareto? Utility function?
      *   Status: Vague in the slogan.
      *   Deflection support: If "values" just means "the metric the market optimises", then excluding people from betting might change the metric.

  5.  **Refining the Critique of the Deflection:**
      The user suspects the deflection is doing "hidden work."
      *Why?* Because in futarchy, if you don't bet, your beliefs don't weight the outcome. If the outcome determines policy, your interests might be ignored *even if* they were part of the "value" vote.
      Example: We vote to maximise "National Health." I don't trade. The market thinks Policy A maximises health. But the market is weighted by rich traders who care about cost-saving more than health (hidden value in the belief).
      Actually, Hanson's argument is that the market predicts the *metric* (e.g., GDP, Health Stats).
      The deflection is: "Whether you get to trade is a value decision."
      The counter: "If trading affects accuracy, excluding people is an epistemic error, not just a value choice."
      Also: "If I don't trade, do my beliefs about causality count?"

  6.  **Finalising the List Structure:**
      *   Thesis Name.
      *   Precise Formulation.
      *   Evaluation (Platitude/Substantive/False).
      *   Verdict on Deflection (Does it justify the speaker's move?).

  7.  **Review against Constraints:**
      *   British English? (Check: 'analyse', 'programme', 'labour', 'defence', 'sceptical').
      *   PhD level? (Use terms like 'normative/empirical distinction', 'epistemic weight', 'decision rights').
      *   Address the specific deflection? (Yes, ensure each point ties back to the "non-trader" issue).

  8.  **Self-Correction during drafting:**
