answer: |-
  You have correctly identified a gap in the terminology. You are right to distinguish this from the **Reference Class Problem** (which is epistemological: *"Which class yields the truest probability?"*) and from standard **Cherry-Picking** (which is data-selective: *"Which data points support my claim?"*).

  Your phenomenon is **population-selective** and **rhetorical**. It is not about finding the truth of a probability, nor about hiding data points, but about drawing the boundaries of the *context* to manipulate the *valuation* of a fixed data point.

  ### 1. Existing Terminology
  There is no single canonical term in philosophy or statistics that covers exactly what you describe, but three concepts encroach on it:

  *   **The Texas Sharpshooter Fallacy:** This is the closest logical cousin. It describes drawing the target *around* the bullet hole after firing. In your case, the "bullet" is the performance metric, and the "target" is the comparison class. However, the Texas Sharpshooter is usually framed as a cognitive error regarding randomness, whereas you are describing a strategic act of advocacy.
  *   **Strategic Peer Group Selection:** In corporate governance and executive compensation literature, this is a well-documented practice. Companies select "peer" firms for CEO pay benchmarking that are slightly smaller or underperforming to justify higher compensation. This is your grant application scenario exactly, but the term is limited to finance/HR.
  *   **Reference Class Shopping:** As you suspected, this phrase is used informally in legal and economic blogs (particularly regarding discrimination law and risk assessment), but it lacks a rigorous definition. It is the best existing shorthand, but it sounds slightly passive ("shopping") rather than active ("drawing boundaries").

  ### 2. A Proposed Coinage: "Reference Class Gerrymandering"
  Given your need for a precise carving that implies active manipulation of boundaries for a strategic outcome, I propose the term **Reference Class Gerrymandering**.

  Like political gerrymandering, this involves drawing the boundaries of a group (the district/class) not based on natural or principled divisions, but specifically to engineer a desired outcome (winning the seat/grant) from a fixed set of votes (data/metrics).

  **Definition:**
  > **Reference Class Gerrymandering** is the rhetorical practice of selecting or defining a comparison population *post hoc* (or with motivated *ex ante* criteria) specifically to alter the normative valuation of a metric, without providing a principled justification for why that specific population is the relevant standard of comparison.

  ### 3. The Carving: Boundaries and Edge Cases
  You asked for the edges: where does this start and stop? Here is how to distinguish it from honest uncertainty, cherry-picking, and convention.

  #### A. The Core Test: The Reversal Principle
  The definitive test for Reference Class Gerrymandering is **Principled Consistency**.
  *   **Gerrymandering:** The applicant would *not* accept this comparison class if the result flipped. (e.g., If they were *less* cost-effective than rural organizations, they would immediately switch to comparing themselves to "urban organizations" or "national averages.")
  *   **Honest Uncertainty:** The evaluator acknowledges that multiple classes are plausible and explains why one is chosen, often acknowledging how the result might change under a different class.

  #### B. Edge Case 1: Modesty and Expectation Setting
  *Is it still the same move when someone picks a self-deprecating comparison class?*
  **Yes.** The mechanism is identical; only the valence changes.
  *   **Example:** A student says, "I got a B, but for someone working 30 hours a week, that's an A."
  *   **Analysis:** If the student uses this to avoid criticism, it is Reference Class Gerrymandering (lowering the bar). If they use it to explain a constraint honestly, it is **Contextualization**.
  *   **The Boundary:** It becomes gerrymandering when the "constraint" (working 30 hours) was not a fixed exogenous factor but a chosen variable used to excuse the metric. If the "modesty" is used to secure a future advantage (e.g., lowering expectations to easily exceed them later, known as **Sandbagging**), it is strategic gerrymandering.

  #### C. Edge Case 2: Pre-Fixed Classes Chosen by the Interested Party
  *What if the class was fixed before the results came in, but chosen by the person being evaluated?*
  **It is still gerrymandering if the *criteria* for the class were motivated.**
  *   **Example:** A grant applicant says in January, "We will compare ourselves to other first-time applicants." In December, they find out they are the best first-time applicant.
  *   **Analysis:** If they chose "first-time applicants" in January because they *knew* the pool was weak, it is gerrymandering. If they chose it because it was the only available data, it is not.
  *   **The Boundary:** The timing is less important than the **motivation**. However, *ex ante* commitment acts as a strong heuristic against gerrymandering. In grant-making, requiring applicants to declare their comparison class *before* reporting outcomes is the standard remedy.

  #### D. Edge Case 3: Conventional Standards
  *Is a comparison class chosen by convention (e.g., "per capita") immune?*
  **Conventions are Schelling Points, not Immunities.**
  *   **Example:** "Our country has the highest incarceration rate per capita." This is a convention. But if a defender says, "Yes, but per capita *of urbanized areas*, we are low," they are gerrymandering the convention.
  *   **The Boundary:** Conventions are immune only so long as they remain the **focal point** of the discourse. Once an actor introduces a *qualifier* to the convention ("per capita... of rural counties"), they have left the shelter of the convention and entered the territory of gerrymandering. The burden of proof shifts to them to justify the qualifier.

  ### 4. How to Distinguish from Neighbors

  | Phenomenon | What is being manipulated? | Intent | Example |
  | :--- | :--- | :--- | :--- |
  | **Cherry-Picking** | The **Data Points** (Numerator) | Hide negative instances | "Look at these 5 successful projects" (ignoring 10 failures). |
  | **Reference Class Problem** | The **Inference** (Epistemic) | Find true probability | "Is this coin biased? Depends on if we compare it to all coins or just minted coins." |
  | **Reference Class Gerrymandering** | The **Population** (Denominator) | Win an evaluation | "We are the best coin among coins minted on Tuesdays in leap years." |
  | **Simpson's Paradox** | The **Aggregation** (Structural) | Hidden variable bias | A trend appears in groups but disappears when combined (often unintentional). |

  ### 5. Practical Application for Your Foundation
  Since you review grants, you can operationalize this. When you see a claim like *"Among organizations of our size in rural counties..."*:

  1.  **Demand the Counter-Claim:** Ask the applicant: *"What would your ranking be against the state-wide average? Against the national average? Against organizations twice your size?"*
  2.  **The "Blind Class" Test:** Ask them to define the comparison class *before* they submit the metrics next cycle.
  3.  **Label It:** In your internal reviews, you can now tag this as **Reference Class Gerrymandering**. It signals to your colleagues that the metric isn't necessarily false, but the *frame* is strategically distorted.

  **Summary:** You have identified a specific rhetorical maneuver that exploits the flexibility of denominators. While **Reference Class Shopping** is the informal term, **Reference Class Gerrymandering** is the precise coinage that captures the active boundary-drawing for strategic gain. It is distinct from cherry-picking (which hides data) because it hides *context*.
