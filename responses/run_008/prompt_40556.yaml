answer: |-
  My credence that the correct treatment is **Pay in the Mugging, Refuse in the Blackmail** (the "Split") is **0.82**.

  I side with you on the outcome, though I suspect your brother and I disagree on *why* you are right. Below is the decomposition of that number, the dominant term, and an analysis of the gene lottery.

  ### Decomposition of Credence (0.82)

  **1. The Unit of Agency: Act vs. Policy (0.40)**
  This is the heaviest term. The disagreement is not primarily about the world, but about what "decision" means.
  *   **Your Brother (CDT):** Evaluates the *act*. "Given I am here, with the coin already tails/letter already sent, does handing over cash *cause* a better outcome?" In Mugging, no (past coin). In Blackmail, yes (future photos), but he seemingly ignores the photos to maintain consistency, or values "not rewarding prediction" above utility.
  *   **You (FDT/TDT):** Evaluate the *policy/algorithm*. "What output should my decision procedure return such that the predictor, simulating this procedure, generates the best world?"
  *   **Contribution:** If rationality is about selecting the winning *algorithm* rather than the causally efficacious *muscle twitch*, the Split is mandatory. Mugging is a cooperative test of your algorithm (Pay to unlock Heads); Blackmail is an adversarial test of your algorithm (Refuse to prevent Letter). This term contributes 0.40 to my credence because without adopting Policy-based evaluation, the Split collapses.

  **2. Topology of Dependence: Cooperative vs. Adversarial (0.30)**
  Even granting Policy evaluation, one might ask: "Why treat them differently if both involve a predictor?"
  *   **Mugging:** The predictor's action (paying £1M) benefits *you*. The correlation is cooperative. You want your algorithm to be "predictably compliant" to unlock the reward.
  *   **Blackmail:** The predictor's action (sending letter) harms *you*. The correlation is adversarial. You want your algorithm to be "predictably defiant" to prevent the threat.
  *   **Contribution:** This structural difference justifies the Split *within* a policy framework. If both were cooperative, you'd Pay both. If both were adversarial, you'd Refuse both. Because one is a "Reward for Compliance" and the other is "Punishment for Compliance," the optimal policies diverge. This contributes 0.30.

  **3. Metaphysics of Prediction: Coin vs. Character (0.12)**
  *   **The Coin:** In Mugging, the correlation runs through an external randomizer. This makes it feel like "magic" to influence the past.
  *   **The Character:** In Blackmail, the correlation runs through your own psychology. This feels more intuitive.
  *   **Contribution:** I assign this lower weight because, under Functional Decision Theory, the substrate of the prediction (coin flip vs. neural net) is irrelevant; only the logical dependency matters. However, human intuition weighs heavily on this, making the Mugging harder to swallow. This term adds 0.12 to my credence that you are right to treat them as logically equivalent *enough* to use the same decision framework, even if the output differs.

  **4. Dynamic Consistency & Pre-commitment (0.10)**
  *   **Contribution:** A rational agent should not regret their decision procedure upon reflection. If you Refuse Mugging, you regret not being the type who Pays (you lost the £1M). If you Pay Blackmail, you regret being the type who Pays (you got blackmailed). The Split is the only path to dynamic consistency. This adds the final 0.10.

  ### The Dominant Term
  **The Unit of Agency (Act vs. Policy)** does the most work (0.40).
  If you are evaluating single acts in isolation, the Split is indefensible (Refuse/Refuse or Refuse/Pay). The Split *only* emerges when you evaluate the decision as an instantiation of a general policy. Your brother's error is not seeing the scenarios as different; it is seeing the *decision* as a point-event rather than a function.

  ### The Argument That Would Shift Me
  The observation that would lower my credence most significantly is a demonstration of **Dynamic Inconsistency in Policy Selection**.
  If it could be shown that adopting the "Pay Mugging" policy forces you into a loop where you must constantly pay for counterfactual benefits that never materialize due to noise in the predictor (e.g., a 99% reliable predictor creates a zone where you pay but don't get the reward), then the "Policy" framework loses its dominance. Specifically, if I were shown that **Causal Decision Theory + Pre-commitment Devices** yields the same monetary returns as Functional Decision Theory without requiring the metaphysical baggage of "logical causation," I would lower my credence to ~0.55. The burden is on FDT to show it isn't just CDT with a fancy pre-commitment step.

  ### The Gene Lottery Rejoinder
  Your brother's gene variant **helps your side, not his.**

  *   **The Setup:** A gene causes both the approach (Tails) and the inclination to Pay.
  *   **Brother's Claim:** This proves you can't change the past (the gene), so you should Refuse.
  *   **Analysis:** This variant transforms the Mugging from a "Coin" problem into a "Newcomb" problem.
      *   In the Coin version, CDT says Refuse (no causal link).
      *   In the Gene version, your decision is *evidence* of the gene. If you Pay, it is highly probable you have the "Winning Gene" (which means you got the £1M yesterday). If you Refuse, it is probable you have the "Losing Gene."
      *   **Evidential Decision Theory (EDT)** says **Pay** in the Gene Mugging.
