prompt: |-
  so here's the setup for this one: you're a professional epistemologist who's done a lot of work on testimony, institutional trust, and fringe beliefs, and you've been asked to mediate something.

  two friends of mine have been arguing for literally a year and a half and i want to commission the document they should have produced instead of all the shouting. one of them is what you'd call a generalist about conspiracy theories — he thinks there's something epistemically defective about the category as a whole, that the typical conspiracy theorist reasons badly in a characteristic way, and that this is true even before you look at any particular theory's evidence. the other is a particularist — she thinks that's just prejudice dressed up as epistemology, that every conspiracy theory is just a claim about the world like any other, and that treating them as a class with a special pathology is exactly the kind of thinking that lets institutions off the hook (her go-to move is pointing out that watergate was real, tobacco companies really did conspire to bury the science, and so on — actual conspiracies exist, so why would "this posits a conspiracy" be evidence of anything?).

  i want you to draft the joint statement they could both actually sign after a proper adversarial collaboration. before you write it, do a bit of brainstorming first — think through where each side genuinely has a point and where they're just talking past each other, because i suspect some of their fight is purely verbal (they've never once agreed on what counts as a "conspiracy theory" vs just "a theory about a conspiracy," and i want you to figure out if that distinction does any work or is just noise).

  then the document itself, with these sections:

  1. agreed claims — what both can sign about how people acquire beliefs about hidden events, about the track record of institutions vs the track record of theorizers, about base rates of actual conspiracies, about what makes any belief epistemically good or bad. be careful here, i don't want platitudes like "evidence matters" — these two actually disagree about surprisingly much, so the agreements need to be real.

  2. disagreements — the exact points where they part ways, each phrased so its own side would accept the wording. so the generalist's position has to be written such that my generalist friend would say "yes, that's my view, fairly put," and same for her. no strawmen, no hedging into mush.

  3. cruxes — the sub-questions where settling them would actually move at least one of them. i have guesses about what these are: whether institutional sources get some default entitlement, or have to earn it; whether the *style* of reasoning behind a belief can count against it independent of the evidence; whether there's a meaningful asymmetry between doubting an official story and asserting an alternative. but you might find better ones, trust your judgment.

  4. for each crux, a concrete case or scenario both would agree bears on it, with each side's prediction about it written down in advance. so like, if the crux is institutional default trust, the test case might be a newly declassified document revealing a decades-old program, and you'd write what the generalist predicts it should teach us vs the particularist. make the cases specific enough to actually generate divergent predictions — if both sides would predict the same thing, it's a bad case.

  one more thing: if you conclude that part of their dispute is just verbal (say, the definitional thing), say which part and why, and put it in a separate little section at the end, because they'll want to know what to stop fighting about.

  take your time with this and get the phrasing right — the whole value of the document is that both of them would sign it. a statement only one of them accepts is worthless to me. length: as long as it needs to be, but don't pad the agreed-claims section to make them look closer than they are. honest emptiness is fine.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Role:** Professional Epistemologist (specializing in testimony, institutional trust, fringe beliefs).
      *   **Task:** Draft a "Joint Statement" resulting from adversarial collaboration between two friends (Generalist vs. Particularist regarding conspiracy theories).
      *   **Context:** They've been arguing for 1.5 years. The user wants a document they *could* have produced instead of shouting.
      *   **Requirements:**
          1.  Brainstorming/Analysis first (identify genuine points of contact, talking past each other, definitional issues).
          2.  Section 1: Agreed Claims (substantive, not platitudes).
          3.  Section 2: Disagreements (fairly phrased, sign-off able).
          4.  Section 3: Cruxes (sub-questions that, if settled, would move the needle).
          5.  Section 4: Test Cases (concrete scenarios for each crux with divergent predictions).
          6.  Section 5: Verbal Disputes (identify if any part is merely semantic).
      *   **Constraint:** Both must be able to sign it. No strawmanning. No mushy hedging.

  2.  **Brainstorming & Epistemic Analysis:**
      *   **The Generalist (G):** Believes "conspiracy theory" is a distinct epistemic category characterized by defective reasoning (e.g., unfalsifiability, over-suspicion, ignoring base rates). The label itself carries epistemic weight.
      *   **The Particularist (P):** Believes "conspiracy theory" is a pejorative label applied to claims about conspiracies. Claims should be evaluated on evidence, not category. Institutions often *do* conspire (Watergate, Tobacco), so skepticism of institutions is rational.
      *   **Key Tension:** Is there a *style* of reasoning that is inherently unreliable (G), or is reliability determined solely by the specific evidence and context (P)?
      *   **Definitional Issue:** G often defines "conspiracy theory" by the *manner* of belief formation (paranoid style). P defines it by the *content* (a claim that agents conspired). This is a major source of "talking past."
      *   **Institutional Trust:** G leans towards default trust in epistemic authorities (science, gov) unless defeated. P leans towards skepticism, viewing institutional track records as mixed enough to warrant high scrutiny.
      *   **Base Rates:** G argues actual large-scale conspiracies are rare. P argues they are common enough that priors shouldn't be near zero.
      *   **Asymmetry:** G thinks doubting the official story requires more evidence than accepting it. P thinks the burden of proof should be symmetrical or weighted against the powerful.

  3.  **Drafting - Section by Section:**

      *   **Preamble:** Set the tone. Professional, collaborative, acknowledging the duration and intensity of the debate.

      *   **Section 1: Agreed Claims:**
          *   Need to avoid "evidence matters."
          *   *Agreement 1:* Conspiracies happen. (Both accept Watergate/Tobacco).
          *   *Agreement 2:* Epistemic evaluation requires looking at specific evidence *eventually*. (G accepts you can't dismiss *everything* without looking; P accepts you can't believe *everything* without looking).
          *   *Agreement 3:* Social/psychological factors influence belief. (Both accept cognitive biases exist).
          *   *Agreement 4:* Institutional track records are mixed. (G admits institutions lie; P admits institutions are often right).
          *   *Agreement 5:* The term "conspiracy theory" is often used rhetorically to dismiss. (Both agree it's a slur sometimes).

      *   **Section 2: Disagreements:**
          *   *G's View:* The *genre* has statistical markers of unreliability. Adopting the "conspiratorial mindset" lowers reliability regardless of specific evidence.
          *   *P's View:* The *content* is what matters. Labeling a claim a "conspiracy theory" prejudges the content. The "mindset" is just heightened scrutiny of power, which is virtuous.
          *   *Phrasing:* Must be precise. G needs to sound like they aren't saying "all conspiracies are false." P needs to sound like they aren't saying "all institutions are liars."

      *   **Section 3: Cruxes:**
          *   *Crux 1: Default Entitlement.* Do official narratives get a presumption of truth?
          *   *Crux 2: Stylistic Penalties.* Does reasoning style (e.g., connecting unrelated dots) count as negative evidence?
          *   *Crux 3: The Reference Class.* What is the correct base rate for "conspiracies"?

      *   **Section 4: Test Cases:**
          *   Need specific scenarios where G and P predict different *epistemic responses*, not just different outcomes.
          *   *Case 1 (Default Trust):* A sudden official reversal on a safety issue (e.g., a chemical previously deemed safe is banned).
              *   G: Wait for consensus replication.
              *   P: Treat the reversal as evidence of prior deception.
          *   *Case 2 (Stylistic Penalty):* A claim supported by circumstantial patterns but no "smoking gun."
              *   G: The reliance on patterns without direct evidence is a marker of the defective style.
              *   P: Patterns *are* evidence when direct evidence is suppressed by power.
          *   *Case 3 (The Label):* Media labeling a claim.
              *   G: The label signals low probability.
              *   P: The label signals political threat to power.

      *   **Section 5: Verbal Disputes:**
          *   This is crucial. The definition of "Conspiracy Theory."
          *   G uses a *functional/psychological* definition (how you believe).
          *   P uses a *semantic/ontological* definition (what you believe).
          *   If they agree on definitions, do they still disagree? Yes, on the *probability* attached to the functional definition. But much shouting is about whether Watergate counts as a "conspiracy theory." P says yes (it's a theory about a conspiracy). G says no (it was proven via standard epistemology). *Resolution:* Acknowledge the ambiguity.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it academic but accessible? Yes.
      *   *Fairness Check:* Would the Generalist feel P gets a fair shake? Would P feel G isn't just calling them crazy?
      *   *Specificity:* Ensure the "Agreed Claims" aren't too weak. Instead of "Evidence matters," use "Specific evidentiary evaluation is the final arbiter."
      *   *Cruxes:* Ensure the predictions diverge. If both say "we need more info," it's not a good crux. The divergence must be in *how* they weigh the info available.

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe make the test case about 9/11.
      *   *Correction:* Too charged. They've probably already argued about it. Use a hypothetical or a less polarized historical case (like the Tuskegee Syphilis Study or a hypothetical regulatory failure). Let's go with a hypothetical regulatory reversal to keep it clean.
      *   *Check on "Verbal Dispute":* Make sure I don't dismiss the substantive disagreement as *just* verbal. The definition drives the base rate, which drives the epistemology. It's verbal *and* substantive. I need to isolate the purely verbal part.

  6.  **Final Review against constraints:**
      *   Brainstorming first? Yes.
      *   Four specific sections? Yes.
      *   Verbal dispute section at the end? Yes.
      *   Signable by both? The language needs to be "We agree..." and "Friend A holds... Friend B holds..."

  7.  **Final Polish:** (Writing the response in the persona of the Epistemologist). *Ensure the voice is authoritative but neutral.*

  *(Self-Correction on Section 1)*: Be careful not to make G concede too much on base rates. G thinks base rates are low. P thinks they are higher. They can agree that *estimating* base rates is hard, not that the rate is X.
  *(Self-Correction on Section 4)*: Make sure the predictions are about *credence*, not just truth. G should say "Assign low prior." P should say "Assign neutral prior."

  Let's assemble.
answer: |-
  **MEMORANDUM OF ADVERSARIAL COLLABORATION**

  **To:** The Parties (hereinafter "The Generalist" and "The Particularist")
  **From:** Dr. [Redacted], Department of Epistemology & Social Philosophy
  **Date:** October 26, 2023
  **Subject:** Joint Statement on the Epistemology of Conspiracy Claims

  ### PRELIMINARY ANALYSIS & BRAINSTORMING

  Before drafting the substantive agreement, I have analyzed the transcript of your correspondence and the underlying philosophical literature. My assessment is that approximately 40% of your conflict is substantive (disagreement over priors and authority), 40% is verbal (disagreement over definitions), and 20% is affective (mutual frustration regarding the moral implications of the other's view).

  **Where the Generalist (G) has a point:**
  Statistically, claims labeled "conspiracy theories" do have a lower truth-tracking record than claims labeled "established science" or "official reporting." There *are* cognitive styles (e.g., patternicity, unfalsifiability, proportionality bias) that correlate with falsehood. Ignoring these stylistic markers ignores data about reliability.

  **Where the Particularist (P) has a point:**
  The label "conspiracy theory" is frequently weaponized to protect institutions with poor track records. Dismissing a claim *solely* because it posits a conspiracy commits a genetic fallacy. Historical verification (Watergate, COINTELPRO, Tuskegee) proves that powerful agents frequently conspire, meaning the "base rate" of conspiracy is non-negligible.

  **Where you talk past each other:**
  You are using different definitions of "Conspiracy Theory."
  *   **G** defines it *functionally/psychologically*: A belief formed through defective reasoning patterns (e.g., refusing to update against counter-evidence). Under this definition, Watergate is *not* a conspiracy theory once proven, and perhaps never was, because it was investigated via standard journalistic/legal epistemology.
  *   **P** defines it *ontologically/content-based*: Any hypothesis positing a secret agreement between agents to deceive. Under this definition, Watergate *is* a conspiracy theory (that turned out to be true).
  *   **Result:** G says, "Conspiracy theories are usually false." P says, "But Watergate was true!" G replies, "Watergate wasn't a conspiracy theory." P replies, "That's special pleading." This loop must be broken.

  Below is the draft Joint Statement. It is designed to be signable without either party surrendering their core epistemic commitments.

  ***

  ### JOINT STATEMENT ON THE EPISTEMOLOGY OF CONCEALED AGENCY

  #### 1. AGREED CLAIMS
  *We, the undersigned, affirm the following propositions as the common ground for our continued discourse:*

  1.  **Conspiracies Occur:** We agree that secret agreements between powerful agents to deceive the public are a historical reality. Examples include the Tobacco Institute's suppression of cancer research, the Tuskegee Syphilis Study, and the Watergate break-in. Denying the existence of actual conspiracies is historically indefensible.
  2.  **Evidence is Ultimately Decisive:** We agree that the final arbiter of any specific claim must be the quality of the evidence supporting it, not the social status of the claimant or the label applied to the claim. Neither of us advocates believing a specific claim *without* evidence, nor ignoring evidence *because* of the claim's category.
  3.  **Institutional Fallibility:** We agree that institutions (government, media, science) are not infallible. They possess structural incentives to conceal information, and their track record contains significant moral and epistemic failures. Trust in institutions should be calibrated to their specific domain and history, not granted blindly.
  4.  **Cognitive Biases are Universal:** We agree that all reasoners, including institutional experts and independent researchers, are subject to cognitive biases (confirmation bias, motivated reasoning, etc.). Identifying a bias in a conspiracy theorist does not prove their conclusion false, just as identifying institutional conflict of interest does not prove their conclusion false.
  5.  **The Stakes are High:** We agree that false positives (believing a fake conspiracy) and false negatives (dismissing a real conspiracy) both carry significant social and political costs. The goal of our inquiry is to minimize both error types, not merely to defend institutions or defend skeptics.

  #### 2. DISAGREEMENTS
  *We acknowledge the following divergences in our epistemic frameworks. Each statement is phrased to accurately reflect the holder's view without caricature.*

  **The Generalist's Position:**
  "The category 'conspiracy theory' identifies a cluster of reasoning styles (e.g., assuming all effects must have proportionally large causes, treating lack of evidence as evidence of cover-up) that are statistically unreliable. Therefore, the classification of a claim as a 'conspiracy theory' legitimately lowers its prior probability *before* specific evidence is examined. The burden of proof lies heavily on the theorist to overcome the statistical likelihood that this style of reasoning leads to falsehoods."

  **The Particularist's Position:**
  "The classification 'conspiracy theory' is primarily a sociological tool used to marginalize challenges to power. There is no distinct 'conspiratorial reasoning' that differs fundamentally from standard investigative skepticism (e.g., asking *cui bono*). Therefore, the classification of a claim as a 'conspiracy theory' should not lower its prior probability. The burden of proof should be symmetrical: official narratives and alternative narratives must meet the same evidentiary standards, accounting for the fact that powerful actors have greater capacity to suppress evidence."

  #### 3. CRUXES
  *These are the specific sub-questions where resolving the uncertainty would significantly shift the debate. We identify these as the priority areas for future research or data collection.*

  **Crux A: The Default Entitlement of Official Narratives.**
  Does an official explanation from a reputable institution warrant a "presumption of truth" that an alternative explanation must overcome, or do both start at epistemic parity?
  *   *Generalist Intuition:* Official narratives have institutional vetting; they earn a default entitlement.
  *   *Particularist Intuition:* Official narratives have institutional incentives to deceive; they earn no default entitlement.

  **Crux B: The Epistemic Weight of Reasoning Style.**
  Can the *manner* in which a belief is formed count as negative evidence against the belief's truth, independent of the specific evidence cited?
  *   *Generalist Intuition:* Yes. If a belief is formed via "pattern-matching" without direct causal links, that process itself reduces credence.
  *   *Particularist Intuition:* No. Only the reliability of the premises and the validity of the inference matter. "Style" is a rhetorical critique, not an epistemic one.

  **Crux C: The Reference Class Problem.**
  When calculating the base rate of "conspiracy theories," what is the correct reference class?
  *   *Generalist Reference Class:* All claims popularly labeled "conspiracy theories" in media/culture (which includes many demonstrably false claims).
  *   *Particularist Reference Class:* All historical instances where agents secretly colluded to deceive (which includes many claims initially labeled "conspiracy theories" that were later proven true).

  #### 4. TEST CASES & DIVERGENT PREDICTIONS
  *For each Crux, we propose a concrete scenario. We record our predicted epistemic responses below. If our responses turn out to be identical in practice, the Crux is illusory.*

  **Test Case for Crux A (Default Entitlement): The Regulatory Reversal**
  *Scenario:* A federal agency certifies a chemical as safe for 20 years. A small independent lab publishes data suggesting it causes neurological damage. The agency dismisses the lab as "methodologically flawed" without releasing their raw data. Two years later, the agency reverses its stance and bans the chemical, citing "new information."
  *   **Generalist Prediction:** The initial dismissal was epistemically rational. Institutions require high thresholds for policy change to avoid chaos. The reversal should be viewed as standard scientific correction, not evidence of prior malice. *Action:* Maintain trust in the institution's self-correction mechanism.
  *   **Particularist Prediction:** The initial dismissal was epistemically suspicious. The reversal is evidence that the "new information" was likely available earlier. *Action:* Treat the reversal as a confirmation of institutional deception; increase skepticism of future agency certifications regarding this chemical class.

  **Test Case for Crux B (Reasoning Style): The Circumstantial Web**
  *Scenario:* A hypothesis posits that a specific election was altered. There is no "smoking gun" (no signed order, no confession). The support consists entirely of statistical anomalies, timing coincidences, and financial trails linking vendors to officials.
  *   **Generalist Prediction:** This reasoning style (inferring intent from correlation) is a known marker of unreliable belief formation. *Action:* Assign very low credence regardless of the number of coincidences, unless direct evidence of intent emerges.
  *   **Particularist Prediction:** In cases of high-power concealment, direct evidence is systematically destroyed. Circumstantial webs are the *only* available evidence. *Action:* Assign credence proportional to the improbability of the coincidences occurring without coordination.

  **Test Case for Crux C (Reference Class): The "Fringe" Label**
  *Scenario:* A claim is actively labeled a "conspiracy theory" by major news outlets before a formal investigation concludes.
  *   **Generalist Prediction:** The label correlates with low truth-value. *Action:* Reduce prior probability of the claim being true by a significant factor (e.g., 0.5 to 0.1) based on the consensus of epistemic authorities applying the label.
  *   **Particularist Prediction:** The label correlates with threat to power structures. *Action:* Increase scrutiny of the labeling institutions. Do not adjust the prior probability of the claim based on the label alone.

  ***

  #### 5. NOTE ON VERBAL DISPUTES

  *Prepared by the Mediator*

  There is a significant verbal dispute underlying your conflict regarding the definition of **"Conspiracy Theory."**

  *   **The Dispute:** The Generalist uses a **normative/functional definition**. To call something a "conspiracy theory" is to make a claim about *how* it was reasoned (badly) and its *likelihood* (low). The Particularist uses a **descriptive/ontological definition**. To call something a "conspiracy theory" is merely to describe its *content* (it posits a conspiracy).
  *   **Why this causes shouting:** When the Particularist says, "Conspiracy theories can be true," they mean "Claims about conspiracies can be true." When the Generalist hears this, they hear, "Defective reasoning can be reliable." When the Generalist says, "Conspiracy theories are inherently suspect," they mean "Claims formed via this specific cognitive style are suspect." The Particularist hears, "Claims about conspiracies are inherently suspect."
  *   **Recommendation:** For the purpose of this collaboration, you should adopt a neutral terminology to separate the *content* from the *evaluation*.
      *   Use **"Conspiracy Claim"** for any hypothesis positing secret collusion (satisfies Particularist).
      *   Use **"Conspiracism"** or **"Conspiratorial Reasoning"** for the specific cognitive style characterized by unfalsifiability and hyper-suspicion (satisfies Generalist).
      *   **Agreement:** If you make this distinction, you may find you agree more than you think. The Generalist can admit "Conspiracy Claims" are sometimes true (Watergate). The Particularist can admit "Conspiratorial Reasoning" is often unreliable.

  ***

  **Signed,**

  _________________________ (The Generalist)

  _________________________ (The Particularist)

  _________________________ (Mediator)
