      *   Address the "Common Cause" skepticism? Yes, by upgrading it with Reliabilism and Acquaintance.
      *   No wishy-washiness? Take a firm stance.
      *   Explain terminology? Yes.
      *   Length? As long as needed.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* I initially thought about using the "Evolutionary Argument," but that might suggest the experience *does* have a function, which contradicts epiphenomenalism. Stick to the structural/metaphysical defense.
      *   *Emphasis:* Make sure to distinguish between *having* the experience (which is certain) and *talking* about it (which is the physical part). The gap is between the having and the talking.

