  The Zhuangzi verdict, by the way, is that he's obviously the man -- he had a vivid dream, end of story -- and that everyone who finds it profound is overcorrecting. But that puts me in the weird spot of trusting my waking feeling about dreams completely while knowing it's unreliable from the inside.

  Is there a principle that captures which skeptical scenarios I take seriously and which I dismiss? What would it say about cases I haven't listed, like whether a dementia patient mid-hallucination, or someone in a very convincing VR rig, can tell what's going on from the inside? And please tell me honestly which of my verdicts can't all be saved -- especially the simulation-vs-someone-else's-dream one, because I suspect thats where I'm being inconsistent and just don't know which side to give up.
