  I'm a software engineer with zero philosophy training, but I read about Zhuangzi's butterfly dream (the guy who dreams he's a butterfly, wakes up, and can't tell if he's a man who dreamt he was a butterfly or a butterfly dreaming he's a man) and fell down a rabbit hole of skeptical scenarios. I've started keeping a list of my gut verdicts on them, and I want to know if there's an actual principle behind these or if I'm just vibing.

