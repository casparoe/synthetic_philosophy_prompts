prompt: |-
  so I'm taking a population ethics seminar this term, and over the semester I've picked up a bunch of positions from the readings and seminar arguments, and before I structure my final paper around them I want somebody to check whether they actually fit together, because I have a nagging feeling at least two of them can't both be true. Here's roughly where I've landed: (1) suffering counts way more than happiness — when creating happiness and preventing suffering conflict at anything like comparable scale, preventing suffering wins, and this is a big part of why I take factory farming and wild animal suffering so seriously as moral priorities; (2) the asymmetry seems obviously right to me: it's wrong to bring into existence a life that will contain a lot of suffering, but there's no duty to create happy lives, and adding happy people just isn't a moral improvement in the way removing suffering from existing people is; (3) that said, I do NOT buy the hardcore version — I don't think a world containing a single pinprick and nothing else is worse than an empty world, and I definately don't think a painless end to all life would be a good thing even if it prevented alot of future suffering; (4) I also have this intuition that moral claims have to make a difference to someone — making existing people happy matters in a way that making happy people doesn't — which feels like part of the same package as the asymmetry; (5) finally I'm on board with Parfit-style reductionism about personal identity, strict identity doesn't really matter, psychological connectedness is what matters, and that's part of why the interests of future people seem to count fully for me even though they don't exist yet.

  My TA said something in office hours about how no view that aggregates wellbeing with fixed weights can deliver the asymmetry, and I sort of see it but I honestly can't tell which of my commitments that actually lands on. I also keep going back and forth on whether (4) is even compatible with caring about the suffering of people and animals that don't exist yet, which if it isn't would be pretty bad for my whole view of what matters. And I know (1) and (3) point in opposite directions, but I can't tell whether that's a real contradiction or whether some middle position — suffering gets priority without being infinitely outweighed, whatever that means — could hold both, and if so whether it just quietly collapses back into ordinary utilitarianism with a moodier attitude.

  So what I'd like from you is an audit, not a lecture on population ethics: go through the pairs, tell me which tensions are real and how bad each one is, rank them by severity rather than listing them as equally fatal, and for each real tension say what would have to give and roughly what dropping it would cost me elsewhere (like whether giving something up forces me to give up my view on wild animal suffering, or my rejection of the pinprick thing). And please be explicit about which apparent tensions actually dissolve on inspection — I suspect I'm about to flag some stuff in the paper that is actually fine, and I'd rather find that out now than from my professor's comments later. If one single revision would clean up the most, say which one.
