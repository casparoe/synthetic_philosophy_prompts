answer: |-
  Here is a pair of cases built from ordinary histology, designed to force the split you need without relying on the usual viral or hybrid suspects.

  ### The Pair

  **Case A: The Human Neuron (Somatic)**
  A fully differentiated nerve cell in your cerebral cortex. It is actively maintaining its membrane potential, repairing its proteins, and managing its metabolic intake. It is bounded and homeostatic. However, it is mitotically dead; it cannot divide, and when you die, this specific cell's lineage ends. It is an evolutionary cul-de-sac.

  **Case B: The Human Sperm (Germline)**
  A mature spermatozoon in the epididymis. It is stripped of most cytoplasm, cannot repair its own DNA damage, has no capacity for growth, and is metabolically dependent on the seminal fluid (it cannot maintain its own boundary conditions independently). It is a fragmented delivery vehicle. However, it carries a unique recombination of the genome and is the sole physical bridge to the next generation. It is the vehicle of selection.

  **The Toggle:** **Developmental Destiny (Somatic vs. Germline).**
  This is the single variable. Both are human cells, both are microscopic, both are "parts" of a larger organism. The only difference is their assigned biological role: one is built to *persist now* (maintenance), the other is built to *persist later* (replication).

  ### The Computation

  **The Self-Maintenance (SM) Verdict:**
  *   **Neuron:** **Alive.** It computes "life" as a current physiological process. The neuron is a bounded system actively fighting entropy. It meets the autopoiesis criteria.
  *   **Sperm:** **Not Alive (or borderline).** It computes "life" as autonomous self-maintenance. The sperm is a kamikaze fragment. It cannot feed itself, repair itself, or grow. It is a tool, not a system.
  *   *Result:* **SM Yes / SM No.**

  **The Evolution (EVO) Verdict:**
  *   **Neuron:** **Not Alive.** It computes "life" as participation in a lineage. The neuron is a dead end. Its specific genetic combination dies with the host. It is not a unit of selection.
  *   **Sperm:** **Alive.** It computes "life" as heritable continuity. The sperm is the critical link in the chain of replication. Without it, the lineage breaks. It is the unit of selection.
  *   *Result:* **EVO No / EVO Yes.**

  ### The Load-Bearing Feature

  **Feature:** **The Locus of Persistence.**
  The split exists because SM locates persistence in the *individual token's* current struggle against entropy, while EVO locates persistence in the *type's* continuation through time.

  **Neutralizing the Feature:**
  If you neutralize the destiny, the definitions collapse into agreement.
  1.  **Make the Neuron Pluripotent (iPSC):** If you reprogram the neuron into a stem cell that can divide and form a lineage, EVO flips to **Yes**. (SM stays Yes). Agreement reached (Alive).
  2.  **Make the Sperm Infertile (e.g., DNA fragmentation):** If the sperm cannot successfully replicate, EVO flips to **No**. (SM stays No). Agreement reached (Dead).

  ### The Defenses & The Token/Type Problem

  **Case A (Neuron): The EVO Loss**
  *   **The Loss:** EVO must call the metabolically vibrant neuron "dead."
  *   **The Defense (The Dodge):** The EVO defender argues that *cells* are not the relevant unit of life; the *Organism* is. The neuron is alive because the *Human* is alive.
  *   **The Counter:** This concedes the Token/Type point. If EVO only classifies Lineages (Types) and not Tokens, it cannot classify individual organisms, only populations. If the neuron is alive only derivatively, then "life" is not a property of the thing itself, but of its context.
  *   **Better Move:** Bite the bullet. Admit that from a strictly evolutionary perspective, somatic tissue is "zombie matter" sustaining the germline. It's costly, but consistent.

  **Case B (Sperm): The SM Loss**
  *   **The Loss:** SM must call the genetic bridge "dead."
  *   **The Defense (Definitional Surgery):** The SM defender argues that "self-maintenance" includes *programmed* dependency. The sperm maintains its integrity *long enough* to fulfill its function.
  *   **The Counter:** This stretches "maintenance" to include "controlled decay."
  *   **Better Move:** Attack the case. Argue the sperm is a *part* of the male organism, not an entity. If the sperm is just a severed finger with a tail, SM doesn't need to classify it as alive or dead, just *attached* or *detached*.

  **Token/Type Confrontation:**
  This pair exposes that EVO is fundamentally a **Type** theory (Lineages live, tokens perish), while SM is a **Token** theory (Organisms live, lineages are abstract).
  *   **EVO:** Looks like a dodge if it retreats to "Lineages" to save the sperm, because we intuitively want to know if *this thing in front of us* is alive.
  *   **SM:** Has an analogous escape hatch: "Systems." It can say the sperm is alive *as part of the reproductive system*.
  *   **Comparison:** The SM escape hatch is worse. It renders "life" transitive (X is alive because it's inside Y). The EVO move is more principled: it admits that biological "life" is a property of the flow of information, not the substrate.

  ### Classroom Delivery (2 Minutes)

  "Hold up your hand. Look at the skin. Now imagine a single skin cell. It eats, breathes, and repairs itself. But when you die, it dies. It's a dead end.
  Now imagine a sperm cell. It can't eat, can't repair, and is built to explode. But it's the only thing that can cross the gap to the next generation.
  Question 1: Which one is fighting to stay alive *now*? (Skin).
  Question 2: Which one is actually *alive* in the history of biology? (Sperm).
  If you answered Skin to the first and Sperm to the second, you just voted for two different definitions of life."
