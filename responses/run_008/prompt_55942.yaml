answer: |-
  **Project Title:** The Juridical Origins of Historiographical Blame: Versailles and the WWI Responsibility Debate

  **Research Question**
  To what extent did the juridical requirements of the Versailles reparations regime structurally constrain the conceptual categories available to historians, causing a persistent conflation of causal, individual, and corporate agency in WWI scholarship?

  **Intervention and Gap**
  The debate over German war guilt, from the Versailles negotiations through the Fischer controversy and its revisionist critics, operates within a binary framework: Germany was either legally liable or it was not. Both sides accept the premise that "Germany" functions as a singular corporate agent capable of bearing moral guilt analogous to criminal liability. This project argues that this framework is not a natural reflection of the events of July 1914, but an artifact of the peace settlement. The reparations commission required a single liable party to justify financial extraction, collapsing three distinct questions: (a) counterfactual causation (would war have happened without German action?), (b) individual blameworthiness (did specific leaders choose war when peace was viable?), and (c) corporate agency (can a state bear moral guilt distinct from its officials?). Existing historiography treats these as one question because the Versailles Treaty treated them as one. My project isolates the legal mechanism that forced this conceptual collapse.

  **Methodology and Work Plan**
  Over the next year, I will execute a three-part analysis to disentangle these categories and trace their conflation.

  First, I will construct a conceptual taxonomy of responsibility, distinguishing causal necessity, individual *mens rea*, and corporate liability. I will apply this taxonomy to key texts in the war-guilt debate to demonstrate where arguments slip between categories. For example, I will analyze whether Fischer's evidence of German planning proves causal necessity or individual culpability, and whether critics who deny German uniqueness address corporate agency or only individual intent.

  Second, I will examine the drafting history of Article 231 and the reparations clauses. I am not looking for political motivation, which is well-documented, but for juridical reasoning. I need to find evidence that the drafters consciously simplified complex agency structures to satisfy legal requirements for indemnity. If the legal text explicitly merges cause and guilt for financial purposes, the link between juridical constraint and historiographical formation is established.

  Third, to ensure this is not merely a case study of German exceptionalism, I will compare Versailles to two other post-war settlements: the Franco-Prussian War (1871) and the post-WWII Nuremberg trials. The 1871 indemnity demanded payment without asserting moral guilt, while Nuremberg established individual criminal liability while largely avoiding collective state guilt for reparations. These cases provide control groups. If the conceptual conflation appears only in 1914 historiography and not in 1871 or 1945 scholarship, it suggests the Versailles legal structure specifically distorted the historical question.

  **Failure Conditions**
  This project risks triviality if the conflation of blame categories proves to be standard diplomatic practice unrelated to Versailles-specific constraints. Therefore, the project fails if: (1) archival evidence shows Versailles drafters were indifferent to the philosophical distinction between cause and guilt, implying the conflation was accidental rather than structural; or (2) the comparative cases (1871, 1945) reveal the same historiographical conflation despite different legal frameworks, suggesting the problem lies in general historiographical practice rather than the specific juridical architecture of 1919. If the "malformation" exists regardless of the treaty language, then blaming Versailles is merely another version of the same conceptual error I aim to critique.
