prompt: |-
  I'm a retired chemist who got into philosophy about two years ago after my daughter gave me a philosophy of mind book for christmas, and now I'm the annoying one at the philosophy discussion group at our local library. It's a good group — retired teachers, a couple of engineers, one ex-nurse, all sharp people but no background in this stuff. Next month it's my turn to lead the session, and I want to do the extended mind thing, the Clark and Chalmers idea that a notebook (or a phone) can literally be part of your mind, not just a prop your mind uses. I've spent fourty years treating my lab notebook as more than a memory aid and I think these people will feel that in their bones, which is why I picked it.

  Don't explain the thesis to me — I've read the paper and a fair bit around it, that's not what I'm after. I need a plan for the session. What I want to know specifically: what has to be in place before the Otto-and-his-notebook case can do any work at all — I'm guessing the thought that the boundary of the mind isn't obviously the skull needs to be loosened up first, but maybe it's something else and you'd know better? Then the carrying example — should I use Otto straight, or does he come with baggage once people have vaguely heard of the case, and if not Otto, what should the example have and what should it deliberately lack? Which misconceptions the group will walk in with or form on the spot — I expect "so my smartphone already is my mind," and "it's just a metaphor, why are we taking it literally," and probably something about chatbots — and exactly where in the sequence each one should get headed off rather than left to fester till the coffee break. And one question I can throw out at the end to check whether they actually got the idea or are just nodding along politely.

  Also tell me what to flat out refuse to get into — we're two hours with a coffee break, not a graduate seminar, and I know enough to know this rabbit hole goes deep (enactivism, functionalism, the whole nine yards).

  One more thing: don't give me a wishy-washy menu where you lay out three possible orderings and leave the choice to me. You've thought about this stuff, so commit — pick the sequence, pick the example, make the calls and give me your reasons. If some choice is genuinely close, say so in a sentence, but I'd rather have a definite plan I can disagree with than a hedge.
