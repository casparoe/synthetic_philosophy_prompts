answer: |-
  Here is the plan. It is designed for a two-hour block with a break, tailored to a group of intelligent non-specialists who value precision (engineers, chemists, teachers).

  ### 1. The Prerequisite: Functional Role, Not Just "Open Boundaries"
  You guessed that you need to loosen the idea that the mind stops at the skull. That is necessary, but it is not sufficient. If they believe mental states are defined by *what they are made of* (neurons, goo, biology), Otto will never work, no matter how open the boundary is.

  **The Commitment:** Before you introduce Otto, you must secure agreement on **Functionalism**, but do not use that word. Call it the "Job Description" view.
  *   **The Move:** Start with Inga (the control subject). She hears about an exhibition, thinks, remembers, and goes.
  *   **The Question:** Ask the group: "If we replaced Inga's neurons one by one with silicon chips that performed the exact same input/output functions, does she still have beliefs?"
  *   **The Goal:** If they say "No, she's a zombie," stop. You cannot run the Extended Mind session without functionalism. If they say "Yes, function is what matters," you have your license to proceed.
  *   **Why:** The Otto argument relies entirely on the **Parity Principle**: *If a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is part of the cognitive process.* Without the "Job Description" agreement, Parity has no traction.

  ### 2. The Example: Use Otto "Straight," But Tighten the Controls
  **The Commitment:** Use the original **Otto and his Notebook**. Do not switch to a smartphone for the core argument.
  *   **Reasoning:** A smartphone is too "active." It pings, it suggests, it connects to the cloud. This invites the objection that the phone has agency. A notebook is passive, like a synapse. It isolates the variable of *storage and retrieval*.
  *   **The Modification:** Do not just tell the story. Treat the three conditions Clark & Chalmers list as **experimental controls**. Write them on the board:
      1.  **Constant Availability:** The notebook is always with him.
      2.  **Easy Access:** Retrieval is automatic (no complex decoding).
      3.  **Automatic Endorsement:** He trusts the info implicitly (he doesn't fact-check his own notes every time).
  *   **Why:** This appeals to the engineers and scientists in the room. It frames the thought experiment not as a story, but as a set of criteria that must be met for the "extension" to hold.

  ### 3. Sequence and Misconception Management
  Here is the run-of-show. I have placed the misconception interventions exactly where they must happen to prevent derailment.

  **Part 1: The Setup (30 Minutes)**
  *   **0:00–0:15:** The "Job Description" (Functionalism) setup with Inga. Secure the group's agreement that function > substrate.
  *   **0:15–0:30:** Introduce Otto. Read the case. Apply the Parity Principle.
  *   **INTERVENTION 1 (The Metaphor Objection):** Someone *will* say, "But it's just a metaphor. The mind isn't *literally* in the book."
      *   **When:** Address this immediately after stating the thesis, before moving to discussion.
      *   **The Counter:** "If I say the voltage is *in* the wire, is that a metaphor? If the information plays the exact causal role of a biological belief, calling it a metaphor is a refusal to engage with the functional definition we just agreed on. We are talking about causal constitution, not poetry."
      *   **Why here:** If you let this linger, the group will treat the next hour as a literary discussion rather than a metaphysical one.

  **Part 2: The Break (15 Minutes)**

  **Part 3: Stress Testing the Conditions (45 Minutes)**
  *   **0:45–1:15:** Apply the three conditions (Availability, Access, Endorsement) to Otto.
  *   **INTERVENTION 2 (The Smartphone Objection):** Someone will say, "So my iPhone is literally part of my mind."
      *   **When:** During the application of the three conditions.
      *   **The Counter:** "Does it meet the controls? Do you trust every notification implicitly (Endorsement)? Is it always accessible without a password or lag (Access)? Usually, no. Your phone is *coupled* to your mind, but coupling isn't constitution. Otto's notebook is woven into his cognitive routine; your phone is often a distraction."
      *   **Why here:** This uses the theory to refine their intuition, rather than letting their intuition dismiss the theory. It distinguishes "Extended Mind" from "Ubiquitous Computing."
  *   **1:15–1:30:** **INTERVENTION 3 (Chatbots/AI).**
      *   **When:** Nip this in the bud before it starts.
      *   **The Move:** Explicitly state: "We are not discussing whether AI is conscious or whether Chatbots have minds. That is a question of *intelligence generation*. We are discussing *memory and belief storage*. Please keep the discussion on the storage/retrieval mechanism, not the source of the data."
      *   **Why here:** This topic consumes all oxygen in modern discussions. It changes the subject from *where* the mind is to *what* counts as a mind.

  **Part 4: The Check and Close (30 Minutes)**
  *   **1:30–1:45:** Open floor for remaining objections.
  *   **1:45–2:00:** The Comprehension Check (see below).

  ### 4. What to Flat Out Refuse
  You have two hours. You cannot save the world. Put these three topics on the "Parking Lot" whiteboard and refuse to discuss them if raised:
  1.  **The Hard Problem (Qualia):** "What does it *feel* like to be Otto?" EMT is about cognitive processing, not phenomenological experience. If they ask about feelings, remind them we are discussing functional roles.
  2.  **Enactivism/Embodied Cognition:** This is the next rabbit hole. It argues the mind isn't just extended, it's constituted by action. It's too technical for this session. Say: "That's a different framework that challenges the very idea of representation. We are accepting representation for today to test the boundary."
  3.  **AI Sentience:** As noted above. This is about *your* mind, not the tool's mind.

  ### 5. The Final Comprehension Question
  Do not ask, "Did everyone understand?" They will nod. Do not ask, "Do you agree?" They will polite-agree.

  **Ask this:**
  > "Otto loses his notebook on the subway. For the next week, he has to rely on his biological memory, which is faulty. During that week, does his mind *shrink*? And if a friend lends Otto a notebook, but Otto has to double-check every entry before trusting it, does *that* notebook become part of his mind?"

  **The Correct Answer:**
  1.  **Yes, his mind shrinks.** (If you accept EMT, losing the cognitive resource is losing part of the cognitive system).
  2.  **No, the friend's notebook is not part of his mind.** (It fails the "Automatic Endorsement" and "Constant Availability" conditions. It is merely a tool, not a constituent).

  **Why this works:** It forces them to use the **criteria** (the three conditions) rather than just the **vibe** of the idea. If they say the friend's notebook *is* part of his mind, they haven't understood the functional constraints. If they say Otto's mind *doesn't* shrink, they view the notebook as a prop, not a part.

  ### Summary of Commitments
  *   **Prerequisite:** Secure "Job Description" (Functionalism) view first.
  *   **Example:** Otto + Notebook (Original). Do not use Phone as the primary example.
  *   **Metaphor Objection:** Kill it in the first 30 minutes.
  *   **Smartphone Objection:** Use the 3 Conditions to show why the phone usually fails the test.
  *   **Refusals:** Qualia, Enactivism, AI Sentience.
  *   **Final Check:** The "Lost Notebook vs. Borrowed Notebook" scenario.

  This keeps the session tight, philosophical, and grounded in the text, while using the group's practical backgrounds to test the constraints rather than dismiss the premise. Good luck.
