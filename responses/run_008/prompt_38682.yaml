prompt: |-
  I'm a third-year student taking a seminar on irrationality, and we are finishing a unit on self-deception: the classic paradox (that to deceive yourself you must in some way register the very thing you are hiding from yourself), Sartre's bad faith, and the deflationary accounts on which self-deception is just belief-formation steered by motivation, with no mind partitioned against itself. Outside class, I work as a peer mentor in my university's academic support program: six first-year students on academic probation, one twenty-minute meeting with each per week, my job being to keep them engaged and to refer them onward when something looks serious. The hardest part is knowing what to do with a mentee's optimism. Some tell me they will get into the nursing program although their GPA sits far below the published admission average and they avoid opening the program's website; some explain a string of failing grades by saying each professor had it in for them; some appear to perform the sour-grapes move in reverse, deciding that a major they are failing was never what they wanted anyway; and some, I believe, hold a plain and reasonable hope that is simply keeping them going. My seminar says these are different states with different remedies — wishful thinking, self-deception, adaptive preference, justified hope — but it says so in the abstract, and in twenty minutes with a nineteen-year-old I need something I can actually run. Please write a procedure for the mentor-training binder, usable by other mentors with no philosophy background: the questions to ask in order, what counts as a sufficient answer at each step, where the procedure ends with a no (for example, where the facts are genuinely contested, as with the professor's grudge, and the pattern of evidence-handling is all I can classify, not the truth of the claim), and where it hands the decision to a person because what remains is a question of values — such as whether a sustaining but false hope should be punctured at all. Ground it in what the philosophy actually supports: selective treatment of counterevidence in this domain versus others, avoidance of the sources that would test the belief, whether the belief tracks the available information the way the same student tracks it elsewhere, and whether the belief formed to fit a motive rather than the reverse. Be honest about which steps are judgment calls dressed up as procedure, and about the deeper limit — that from the outside, self-deception, sincere conviction, and clumsy hope can look identical, so the procedure at best licenses predictions about how a mentee will handle evidence, never claims about what they privately believe. Then run it on three mentees: one certain she will get into the nursing program despite the GPA gap; one who attributes each failing grade to a different professor's grudge; and one whose belief that he will make the pre-med track is, by my lights, probably self-deception, yet is visibly the only thing getting him to class in the morning. On that last one, I suspect the procedure will tell me to leave the belief intact, which I will not like — if so, say it plainly, and close by stating what the procedure cannot do at all.
reasoning: |-
  Here's a thinking process that leads to the suggested mentor-training procedure:

  1.  **Analyze the Request:**
      *   **User:** Third-year student, seminar on irrationality (self-deception, bad faith, deflationary accounts), peer mentor for first-years on academic probation.
      *   **Task:** Create a procedure for the mentor-training binder.
      *   **Audience:** Other mentors with *no philosophy background*. Needs to be practical, actionable, and fit within a 20-minute weekly meeting.
      *   **Content:** Questions to ask in order, criteria for sufficient answers, decision points (No/Refer/Handoff), grounding in philosophical concepts (evidence handling, source avoidance, tracking info, motive vs. belief), acknowledgment of limits (judgment calls, indistinguishability of states).
      *   **Application:** Run the procedure on three specific cases:
          1.  Nursing applicant (GPA gap, avoids website).
          2.  Conspiracy theorist (professors have grudges).
          3.  Pre-med student (likely self-deception but functional/getting to class).
      *   **Constraint:** Be honest about the limits. If the procedure suggests leaving the harmful belief intact in Case 3, state that plainly. Close by stating what the procedure *cannot* do.

  2.  **Deconstruct the Philosophy for Practice:**
      *   *The Paradox:* How can you know $p$ to hide $p$ from yourself? -> *Practical Solution:* Don't try to prove they know it. Look for *behavioral avoidance* of evidence.
      *   *Sartre/Bad Faith:* Lying to oneself to escape responsibility. -> *Practical Solution:* Look for shifting standards or refusing to own the consequences of the belief.
      *   *Deflationary Account:* Motivation steers belief formation. -> *Practical Solution:* Check if the belief tracks evidence in *other* domains (consistency).
      *   *Adaptive Preference (Sour Grapes):* Devaluing what you can't have. -> *Practical Solution:* Check if the devaluation happened *before* or *after* the failure.
      *   *Ethical Limit:* Is it our place to puncture hope? -> *Practical Solution:* Distinguish between *academic advising* (facts) and *therapeutic intervention* (values/coping).

  3.  **Drafting the Procedure (The "Binder Protocol"):**
      *   *Goal:* Needs to be a flowchart or step-by-step guide. Let's make it a "Diagnostic Protocol for Student Optimism."
      *   *Step 1: Evidence Tracking.* Do they look at the numbers? (Tests avoidance).
      *   *Step 2: Consistency Check.* Do they treat other risks this way? (Tests deflationary/motivated reasoning).
      *   *Step 3: Source Accountability.* Can they articulate the mechanism of success/failure without blaming external malice? (Tests conspiracy/grudge).
      *   *Step 4: Functional Assessment.* Is the belief helping or hindering action? (Tests utility vs. truth).
      *   *Decision Nodes:* Refer to counseling, Refer to academic advising, Continue mentoring.
      *   *Caveats:* Must explicitly state that mentors are not mind-readers.

  4.  **Refining the Steps (incorporating philosophical grounding):**
      *   *Step 1 (Avoidance):* "Show me the requirement." If they refuse, that's avoidance (classic self-deception marker).
      *   *Step 2 (Consistency):* "How do you budget money/plan travel?" If they are realistic elsewhere but not here, it's motivated reasoning.
      *   *Step 3 (Externalization):* "What would change the outcome?" If the answer is "Professor X stops hating me," that's unfalsifiable/bad faith.
      *   *Step 4 (Cost/Benefit):* "What happens if you're wrong?" If they have no Plan B, the belief is risky. If the belief is the *only* engine for attendance, puncturing it has costs.

  5.  **Running the Cases:**
      *   *Case 1 (Nursing):* GPA gap + avoids website.
          *   Step 1 fails (Avoidance).
          *   Action: Force engagement with facts. Refer to advising for reality check on GPA calc.
      *   *Case 2 (Grudges):* Failing grades = professor malice.
          *   Step 3 fails (Externalization/Unfalsifiable).
          *   Action: This borders on paranoia. Refer to counseling/support services. Mentor can't adjudicate truth of grudges, only pattern of evidence handling.
      *   *Case 3 (Pre-med/Functional):* Belief keeps him in class.
          *   Step 1 & 2 might show distortion.
          *   Step 4 shows high utility (attendance).
          *   Action: *Do not puncture.* Support the behavior (attendance) while gently expanding Plan B. This is the hard pill to swallow.

  6.  **Addressing the Ethical/Philosophical Limits:**
      *   The prompt asks to be honest about judgment calls.
      *   The prompt asks to close with what the procedure *cannot* do.
      *   *Crucial Point:* The procedure cannot determine *truth* of the belief, only the *relationship* the student has with the evidence. It cannot solve the ethical dilemma of "kind lie vs. cruel truth."

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Professional, instructional, empathetic but rigorous. Like a manual.
      *   *Structure:*
          1.  Introduction (Purpose & Limits).
          2.  The Protocol (Steps 1-4).
          3.  Decision Matrix.
          4.  Case Studies (The three mentees).
          5.  Conclusion (The Hard Truth).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid jargon? Yes, explain "motivated reasoning" as "planning differently for other problems."
      *   *Check:* Did I address the "mind partition" issue? Yes, by focusing on behavior (avoidance) rather than internal states.
      *   *Check:* Did I handle Case 3 honestly? Yes, acknowledging that saving the GPA might require sacrificing the truth, and the procedure prioritizes function in that specific instance.
      *   *Check:* Is the distinction between "facts contested" and "evidence handling" clear? Yes, especially in Case 2.

  9.  **Final Polish:** Ensure the distinction between *academic probation* (the context) and *mental health* (the boundary) is clear. The mentor is not a therapist. The procedure must respect that boundary while addressing the academic impact of the irrationality. (Decided to emphasize the "Referral" aspect for Case 2 strongly).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # MENTOR TRAINING BINDER: PROTOCOL 4.2
  ## Assessing Student Optimism and Belief Resilience

  **Purpose:** To help mentors distinguish between *justified hope*, *wishful thinking*, and *self-deceptive avoidance* during 20-minute weekly check-ins.
  **Limit:** This procedure does not determine what a student *truly* believes internally. It assesses how a student *handles evidence* regarding their academic standing. You are not diagnosing a psyche; you are auditing a workflow.

  ---

  ### PART 1: THE DIAGNOSTIC PROTOCOL
  *Ask these questions in order. Do not skip steps. Record the student's behavioral response, not just their verbal answer.*

  #### Step 1: The Source Test (Avoidance Check)
  **Question:** "Let's look at the written requirement for [Goal] together. Can you pull up the webpage/handbook now?"
  *   **Sufficient Answer:** Student opens the link/document immediately, or names a specific barrier (e.g., "I don't have my laptop") and proposes a time within 24 hours to do it.
  *   **Insufficient Answer:** Student deflects ("I know what it says"), delays indefinitely ("I'll look later"), or becomes agitated.
  *   **Philosophical Ground:** Self-deception often requires *avoiding the source* that would trigger the uncomfortable belief. If they will not look, they are managing their exposure to evidence, not evaluating it.
  *   **Action:** If **Insufficient**, mark "Avoidance Present." Move to Step 4. Do not proceed to Step 2.

  #### Step 2: The Consistency Test (Deflationary Check)
  **Question:** "Outside of school, how do you plan for something risky? Like a budget or a trip?"
  **Follow-up:** "Do you plan for the best case there, or do you plan for what's likely?"
  *   **Sufficient Answer:** Student describes a realistic risk-assessment process in other domains (e.g., "I check flight prices before I promise my friends").
  *   **Insufficient Answer:** Student admits they are realistic elsewhere but claims this specific goal operates on "different rules" or "faith."
  *   **Philosophical Ground:** Deflationary accounts suggest self-deception is motivated reasoning. If the student tracks evidence accurately in finance/social planning but not here, the belief is likely steered by motive, not evidence.
  *   **Action:** If **Insufficient**, mark "Motivated Reasoning Likely." Proceed to Step 3.

  #### Step 3: The Accountability Test (Bad Faith Check)
  **Question:** "If you don't hit this target, what is the specific reason why? Is it within your control?"
  *   **Sufficient Answer:** Student identifies internal factors (study habits, time management) or neutral external factors (course difficulty).
  *   **Insufficient Answer:** Student attributes failure to targeted malice (e.g., "The professor hates me") without corroborating evidence, or claims the goal "doesn't matter anyway" *after* failing to achieve it.
  *   **Philosophical Ground:** Sartrean "Bad Faith" involves shifting responsibility to escape anxiety. Claiming a conspiracy removes agency; claiming you never wanted the prize after losing it is adaptive preference (sour grapes).
  *   **Action:** If **Insufficient**, mark "Agency Avoided." Proceed to Step 4.

  #### Step 4: The Functional Test (Utility Check)
  **Question:** "Does believing this help you get to class and do the work? What happens if we assume you might not make it?"
  *   **Sufficient Answer:** Student acknowledges the risk and has a backup plan, OR admits the belief is necessary for function but agrees to build a backup.
  *   **Insufficient Answer:** Student indicates that questioning the belief will cause them to stop attending class entirely.
  *   **Philosophical Ground:** This is the ethical limit. If the belief is false but functionally necessary for basic engagement, puncturing it may cause immediate harm.
  *   **Action:** Determine the "Intervention Level" (see Matrix below).

  ---

  ### PART 2: DECISION MATRIX

  | Pattern of Responses | Classification | Mentor Action |
  | :--- | :--- | :--- |
  | **Step 1 Pass** + **Step 2 Pass** | **Justified Hope** | Support goal. Standard academic mentoring. |
  | **Step 1 Fail** (Avoidance) | **Avoidant Wishful Thinking** | **Action:** Gently force engagement with facts. "We need to look at the number to plan." Refer to Academic Advising for GPA calculation reality check. |
  | **Step 3 Fail** (Conspiracy/Sour Grapes) | **Defensive Rationalization** | **Action:** Do not argue truth of claim (you can't prove no grudge exists). Argue *pattern*. "Even if true, how does believing this help you pass?" Refer to Counseling if paranoia is pervasive. |
  | **Step 4 Fail** (Belief required for attendance) | **Functional Delusion** | **Action:** **Do not puncture.** Support the behavior (attendance) without validating the specific false premise. Build a "Plan B" quietly in the background. |

  ---

  ### PART 3: CASE RUN-THROUGHS

  #### Case A: The Nursing Applicant
  *   **Profile:** GPA 2.4. Program average 3.8. Student says, "I'll get in." Avoids program website.
  *   **Protocol Run:**
      *   **Step 1:** Fails. Refuses to open website. (Avoidance Present).
      *   **Step 2:** Skipped due to Step 1 failure.
      *   **Step 4:** Belief is not functional; she is not studying because she assumes acceptance is guaranteed/inevitable.
  *   **Verdict:** **Avoidant Wishful Thinking.**
  *   **Mentor Move:** You must break the avoidance. "I cannot help you plan a route if we won't look at the map." Open the website together. Do not debate her potential; debate the *numbers*. If she refuses to look, you cannot mentor academically. Refer to Advising for a "Probability Assessment."
  *   **Philosophical Note:** You are not telling her she can't do it. You are enforcing the condition that belief must track evidence to be actionable.

  #### Case B: The Conspiracy Theorist
  *   **Profile:** Failing three classes. Claims each professor has a personal grudge. No evidence offered.
  *   **Protocol Run:**
      *   **Step 1:** Passes. Will look at grades.
      *   **Step 2:** Passes. Reasonable with money/time.
      *   **Step 3:** Fails. Attributes failure to external malice. (Agency Avoided).
      *   **Step 4:** Belief is not functional; it justifies inaction.
  *   **Verdict:** **Defensive Rationalization.**
  *   **Mentor Move:** **Stop at Evidence Handling.** You cannot verify if a professor has a grudge. That is a contested fact. You *can* classify the pattern. "I hear that you feel targeted. However, three different professors in different departments is a pattern that puts you at risk regardless of their intent. How do we pass the class *assuming* the grading is strict?"
  *   **Referral:** If this extends to other areas of life, refer to Counseling. This borders on paranoid ideation, which is outside the mentor's scope.
  *   **Philosophical Note:** The procedure admits you cannot know the truth of the grudge. You are intervening on the *utility* of the belief, not the *truth*.

  #### Case C: The Pre-Med Student
  *   **Profile:** Failing Chemistry. GPA makes Med School statistically impossible. Admits he knows the odds but says, "If I stop believing I can make it, I won't get out of bed." Currently attending class.
  *   **Protocol Run:**
      *   **Step 1:** Passes. Will look at grades.
      *   **Step 2:** Fails. Admits he is unrealistic here but realistic elsewhere. (Motivated Reasoning).
      *   **Step 3:** Fails. Acknowledges odds but insists on the exception.
      *   **Step 4:** **Critical.** Belief is the *only* engine for attendance.
  *   **Verdict:** **Functional Delusion.**
  *   **Mentor Move:** **Do Not Puncture.**
      *   *Why:* The seminar teaches that self-deception is an epistemic vice (a failure of knowledge). But your job is *academic retention*, not epistemic purity. If you force him to accept he won't be a doctor, he stops coming to class, fails the semester, and loses his scholarship.
      *   *Strategy:* Validate the work ethic, not the goal. "I admire your drive to get to class. Let's focus on passing Chemistry first. We can talk about career paths after you have this credit."
      *   *Silent Action:* quietly research alternative majors that use Chemistry credits so when the crash comes, a landing pad exists.
  *   **Philosophical Note:** This is the hard limit. The procedure identifies the self-deception clearly (Motivated Reasoning + Evidence Mismatch). But the Functional Test overrides the Epistemic Test.

  ---

  ### PART 4: WHAT THIS PROCEDURE CANNOT DO

  **1. It cannot solve the ethical dilemma of Case C.**
  You will not like the verdict on Case C. It feels dishonest. You are allowing a student to labor under a false belief because the truth is too costly. The procedure licenses this because your role is *support*, not *philosopher-king*. You are paid to keep them in school, not to ensure their worldview is logically consistent. If you puncture the hope and they drop out, you have failed your job description, even if you were "right."

  **2. It cannot distinguish Self-Deception from Hope.**
  From the outside, a student fighting impossible odds and a student deceiving themselves look identical. Both ignore evidence. Both persist. The only difference is internal: does the student *know* deep down? You cannot know this. The procedure assumes that if they *act* as if they don't know (avoidance), you must treat it as avoidance. If they *act* as if they know but persist anyway (Case C), you treat it as resilience. You are judging behavior, not souls.

  **3. It cannot fix the "Grudge" (Case B).**
  You cannot prove the professor isn't out to get them. If you say "That's not true," you break trust. If you say "That's true," you enable paranoia. The procedure forces you to sidestep the truth claim entirely and focus on the *consequence* of holding the belief. This is a bureaucratic workaround, not a resolution.

  **4. It cannot prevent the crash.**
  In Case A and Case C, the student will likely not achieve the specific goal (Nursing/Med School). This procedure does not save them from disappointment. It only manages *how* they fall. It aims to ensure that when the belief collapses, the student has either (A) faced the facts early enough to pivot, or (B) maintained enough academic standing to survive the pivot.

  **Final Instruction to Mentors:**
  If you feel you are colluding in a lie (Case C), remember: You are not validating the *destination*, you are validating the *locomotion*. A student moving forward under false power is better than a student stationary under true power. Your job is to keep the engine running until they are strong enough to repair the navigation system themselves.
