answer: |-
  ### 1. Live Readings of the Track Record

  You have correctly identified the two primary competing doctrines, but there is a third, more nuanced reading that may fit your five precedents better than either extreme.

  *   **Reading A: Plenary Authority (The Textualist View).**
      *   *Doctrine:* If a rule is mutable, it may be amended in any respect, including its own procedure for amendment, provided the amendment follows the procedure *currently* in force.
      *   *Fit:* Perfectly explains 114 (quorum), 131 (definitions), and 175 (immutable tier boundary). It explains 162 by noting that while *content* is plenary, *status* (mutability) is constrained by the tier system.
      *   *Weakness:* It struggles with 147. If authority is plenary, why couldn't Proposal 147 set its own threshold? You struck it down because it claimed *retroactive* validity ("passed under the new threshold"). Plenary Authority must be tempered by a ban on retroactive self-validation.

  *   **Reading B: No-Self-Application (The Anti-Bootstrapping View).**
      *   *Doctrine:* A rule cannot be used to alter the conditions of its own validity. The authority granting power cannot be the object of that power.
      *   *Fit:* Perfectly explains 147 (the paradigm case of self-validation). It explains 175 (immutable rules cannot be touched).
      *   *Weakness:* It sits uncomfortably with 114 and 131. If Rule 20 (the engine of change) cannot touch itself, does that logic extend to the Quorum rule (114) or the Definition rule (131)? Both are constitutive of the legislative process. If 114 and 131 are allowed, Rule 20 should be too, unless Rule 20 is uniquely "foundational." This reading risks making Rule 20 *de facto* immutable, which conflicts with its explicit *mutable* status.

  *   **Reading C: Prospective Competence (The Refined Plenary View).**
      *   *Doctrine:* A mutable rule may amend its own procedural requirements *prospectively*, but no proposal may claim validity under the rule it seeks to enact, nor may a mutable rule alter its own *status* (tier).
      *   *Fit:* This fits all five precedents best.
          *   **114 & 131:** Upheld because they were prospective content changes to mutable rules.
          *   **147:** Struck because it claimed *contemporaneous* validity (bootstrapping), violating the temporal limit.
          *   **162:** Struck because it attempted to change *status* (mutable to immutable), violating the tier limit.
          *   **175:** Struck because it violated the tier limit.
      *   *Advantage:* It preserves the mutability of Rule 20 (unlike Reading B) while maintaining the ban on self-validation established in 147 (unlike a raw Reading A). It distinguishes between *changing the machine* (allowed) and *claiming the machine built itself* (forbidden).

  ### 2. The Closest Precedent

  **Proposal 147 is your closest precedent, but it distinguishes rather than decides.**

  Proposal 147 and Proposal 190 are siblings: both alter the voting threshold/mechanism in Rule 20. However, 147 contained a "self-validating clause" (declaring it passed under the *new* threshold). Proposal 190 contains no such clause; it admits it passed under the *old* threshold (simple majority) and seeks to change the threshold only for *future* proposals.

  *   **Does it decide the case?** No. 147 established the boundary against *retroactive* self-validation. It did not establish a boundary against *prospective* self-replacement.
  *   **Does it resemble the case?** Yes, closely. It is the only precedent where you articulated the principle that "an act cannot supply the conditions of its own validity." The opponents of 190 are arguing that changing the mechanism *is* supplying the conditions of validity "at one remove." You must decide if "at one remove" is far enough to escape the 147 prohibition.

  ### 3. Recommended Verdict

  **Verdict: Uphold Proposal 190.**

  **Reasoning:**
  To strike down Proposal 190 would require you to abandon the logic of Proposals 114 and 131, which treated constitutive procedural rules as mutable. If the Quorum rule (114) and the Definition rule (131) can be amended by the process they regulate, Rule 20 must be capable of the same, provided it does not violate the specific prohibition in 147.

  Proposal 190 does not claim to have passed by Speaker approval; it passed by Majority. It does not attempt to validate itself retroactively. It operates purely prospectively. Striking it down would effectively render Rule 20 immutable regarding its own mechanism, creating a "super-mutable" tier (rules that can change anything but their own engine) that your ruleset does not define.

  **What you would say:**
  *"Proposal 147 established that a proposal cannot confer validity upon itself. Proposal 190 does not do this; it derives its validity from the Majority rule currently in force, and merely alters the requirement for subsequent proposals. To hold otherwise would be to treat Rule 20 as immutable in practice, despite its mutable designation. The precedent of 114 and 131 confirms that procedural rules are subject to amendment by the procedures they define, so long as the amendment does not reach back to validate the act of amendment itself. Proposal 190 is valid."*

  ### 4. Principles Adopted by Each Choice

  **If You Uphold (Adopting "Prospective Competence"):**
  *   **Principle:** The power to amend includes the power to replace the amendment power, provided the replacement is enacted under the old power and applies only to the future.
  *   **Entrenchment (Proposal 162):** This explains your 162 ruling for the *right reasons*. 162 failed because it tried to change a rule's *status* (mutable to immutable), not because it touched Rule 20. Upholding 190 confirms that *content* (voting method) is changeable, while *status* (mutability) is not.
  *   **Immutable Tier:** Consistent. Immutable rules remain untouched (175). Rule 20 remains mutable, just with a different mechanism.
  *   **Coherence:** High. It treats Rule 20 as a rule like any other mutable rule, respecting the tier system without creating hidden "foundational" protections.

  **If You Strike Down (Adopting "No-Self-Application"):**
  *   **Principle:** The foundation cannot dig up its own footings. The rule granting authority cannot be the target of that authority.
  *   **Entrenchment (Proposal 162):** This explains your 162 ruling only by *coincidence*. 162 was struck because mutable rules can't self-entrench. If you strike 190, you are saying Rule 20 can't self-amend. These are different prohibitions. You would be creating a special protected class for Rule 20 that doesn't exist for the rule in 162.
  *   **Immutable Tier:** It strengthens the tier system by adding a "core" to the mutable tier (Rule 20 becomes de facto immutable regarding its mechanism).
  *   **Coherence:** Low. It creates a contradiction between 114/131 (procedural rules are mutable) and 190 (the main procedural rule is immutable). You would have to argue Rule 20 is *more* fundamental than Quorum or Definitions, which is a substantive policy judgment, not a precedential one.

  ### 5. The Dividing Case

  Your suggestion (amending Rule 20 only for proposals not concerning Rule 20) is complex and invites loopholes. The case that most cleanly divides the **Plenary/Prospective** reading from the **No-Self-Application** reading is:

  **The Self-Transmutation Proposal.**
  *   **The Case:** A proposal, adopted by Simple Majority under Rule 20, that invokes the **Transmutation Rule** to move **Rule 20 itself** from the Mutable Tier to the Immutable Tier.
  *   **Why it Divides:**
      *   **Under Plenary/Prospective:** Rule 20 is mutable. The Transmutation Rule allows moving mutable rules. Therefore, Rule 20 can be moved. The Majority vote is valid. (Result: Rule 20 becomes Immutable).
      *   **Under No-Self-Application:** Rule 20 is the source of the Majority power. You cannot use the power granted by Rule 20 to place Rule 20 beyond the reach of Rule 20. This is the ultimate bootstrapping: using the mutable power to lock the mutable power away. (Result: Proposal Invalid).
  *   **Why it is better than your suggestion:** It forces a collision between the **Transmutation Rule** (external authority) and **Rule 20** (internal authority). It tests whether Rule 20's mutability is a *property* of the rule (which can be changed via Transmutation) or a *limit* on the rule's self-reference (which blocks Transmutation). It cleanly separates "Rule 20 is just a rule" from "Rule 20 is the Constitution."
