      *   *Claim 4 (Correctness/Publicity):* "Correctness presupposes publicity" is a bit tricky. Wittgenstein argues correctness presupposes a *practice* or a *custom* (PI §199). This practice is typically social, but the key is the *normativity*, not necessarily the empirical presence of others (though most scholars argue normativity implies sociality). The colleague's phrasing is acceptable as a simplification but risks the "Community View" controversy (Kripke vs. others). I should note the distinction between "public" as "observable by others" and "public" as "shared practice/rules."
