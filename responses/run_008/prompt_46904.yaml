      *   *Valence Switching:*
          *   Case A: Lied about income -> Reject.
          *   Case B: Lied about income (to hide assets from predatory lender) -> Accept.
          *   Case C: Loud music -> Reject.
          *   Case D: Loud music (hosting community event) -> Accept.
          *   Case E: No job -> Reject.
          *   Case F: No job (full-time caregiver) -> Accept.

  6.  **Refining the Mechanics:**
      *   **Codifiers:** Must produce a "Policy Manual" (If P then Q).
      *   **Deliberators:** Must produce a "Case Log" (Verdict + "Relevant Similarity" to past cases). They are forbidden from writing universal rules.
      *   **Appeals:** Codifiers attack Deliberators for arbitrariness. Deliberators attack Codifiers for rigidity.
      *   **Scoring:** Instructor acts as "Board Chair". Awards points for "Consistency" (Codifiers) and "Sensitivity" (Deliberators). Both lose points if they can't defend against the other group's challenge.

  7.  **Addressing the "Deliberator Secret Rule" Constraint:**
      *   Rule: Deliberators cannot use words like "always," "never," "anyone," "rule," "policy." They must use "In this instance," "Unlike Case 2," "Given the context."
      *   Enforcement: Codifiers get 3 "Rule Alert" tokens they can throw if they hear universal language.

  8.  **Debrief Mapping:**
      *   Codifier frustration -> Generalism (Publicity, Accountability).
      *   Deliberator flexibility -> Particularism (Holism of Reasons).
      *   Deliberator anxiety -> The "Accountability Objection" to Particularism.
      *   Middle ground -> Prima Facie Duties (Rules as defaults, not absolutes).

  9.  **Failure Modes:**
