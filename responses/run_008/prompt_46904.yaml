      *   *Wait, user asked for 8 training, 6 new.* That's 14 cases. For 15 students in 75 mins? That's impossible to read and discuss deeply. I need to push back on the quantity for feasibility while keeping the spirit. I will reduce to 6 Training, 4 Test. Or keep the user's count but make them very short. Let's aim for 6 Training, 4 Test to ensure quality discussion. Actually, I'll stick closer to the user's request but warn in failure modes. Let's do 5 Training, 5 Test. It's balanced.
      *   *Re-evaluating:* The prompt asks me to improve the idea. 14 cases is too many. I will reduce to 6 Training, 4 Test. This allows 5 mins per case in Phase 2 which is still tight. Let's go 4 Training, 4 Test. Quality over quantity.
