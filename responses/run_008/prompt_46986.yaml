      *   *Tone Check:* Keep it conversational but smart. Use phrases like "Here's the ammo for your argument" or "Think about it this way."

  6.  **Final Polish:** Check against specific user prompts (tornado, medical call, Korean student, dybbuk). Ensure the distinction between "God doesn't exist" and "God is hidden" is clear. (The film leans towards the latter being the *experience*, regardless of the ontological truth).

