prompt: |-
  I'm an american who lived in germany for about 8 years, and next week im giving a 15 min talk at our pub philosophy night. I want to defend an idea I've been chewing on forever: germans treat rule-following as a moral thing in itself (standing at a red light at 5am, zero cars, rain, still waiting), while americans treat morality as whatever comes out of your individual conscience, and rules are just conveniences you can opt out of when you personally judge it harmless. My claim is the german version is actually the more moral one, and the core of my argument is something I want to call "prepaid trust": every time you follow a rule that feels pointless and nobody's watching, you're keeping the whole system's credit good for everyone else, sort of like paying into an insurance pool before you need it. When americans jaywalk they think they're exercising conscience but they're really just free-riding on everyone else's orderliness.

  The crowd: mostly american engineers, a retired schoolteacher who runs the club and plays devil's advocate on everything, and two german members who get visibly annoyed when americans treat german orderliness as a cute cultural quirk. So I'll probably get hit from both directions at once.

  Can you write me a Q&A prep sheet? What I want is a table with these columns: "objection" (phrased the way someone at a pub night would actually say it, in this crowd's voice, not textbook language), "who raises it" (engineers / the germans / the schoolteacher), "damage if it lands" (high / medium / low — I care because if the first question is a killer the whole talk sinks), "60-second reply", and "where the reply is soft" (be honest here, don't give me a prep sheet where every reply is airtight). Also tell me the question I'm quietly hoping nobody asks.

  After the table, give me a JSON object with these fields: "strongest_objection", "biggest_concession_i_should_make_upfront", "one_line_that_has_to_land" (the single sentence that, if it gets a nod, means my thesis survives the night), "confidence_in_read_of_crowd", and "least_sure_prediction" — and for that last one plus the confidence field, actually tell me how confident you are in your read of how this audience will react, and which single prediction in the whole prep sheet you'd bet the least on. I'd rather know where the prep is shaky than walk in feeling invincible.
