  7.  **Final Polish:** Ensure the distinction between "Phenomenal Consciousness" (P-consciousness) and "Access Consciousness" (A-consciousness) is clear, as this is the key to unlocking the user's confusion about the podcast vs. the book. (Self-correction: Don't get *too* bogged down in Block's terminology, but use the concepts).

      *Refining the "Illusion" analogy:* The standard illusionist analogy is the "bent stick." The visual experience of bentness is real. The property of the stick being bent is false. Similarly, the experience of "redness" is a real neural state, but the property of it being an "intrinsic, non-physical quality" is false.
      *Wait, Frankish's specific view:* Frankish argues that we have *quasi-phenomenal* properties. We represent states as having phenomenal properties, but they don't actually have them. The *representation* is real.
      *Okay, keep it simple:* The book says "feelings don't exist." The illusionist says "Feelings exist, but they aren't what you think they are."

