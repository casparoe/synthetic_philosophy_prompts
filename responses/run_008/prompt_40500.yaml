  3.  **Brainstorming/ Auditing the Illusionist Position (Internal Monologue/Drafting):**
      *   *Who are the illusionists?* Keith Frankish is the big contemporary name. Daniel Dennett is the progenitor (though he sometimes resists the label, his view fits). Others: Keith Lehrer (earlier), maybe Churchland (eliminativist adjacent).
      *   *What is the core claim?* It's not that *consciousness* doesn't exist (that's absurd). It's that *phenomenal consciousness* (in the specific, magical, ineffable, intrinsic sense defined by Chalmers/Nagel/Block) doesn't exist.
      *   *The "Trick" metaphor:* It's useful but dangerous. It suggests a homunculus watching the trick. Illusionists hate homunculi. The brain generates a *model* that represents itself as having magical properties.
      *   *Qualia:* This is the crux. Illusionists deny *phenomenal qualia* (the "what-it's-like-ness" that is non-physical/intrinsic). They do *not* deny access consciousness, reporting, discrimination, or the functional reality of pain.
      *   *The "Stream of Experience":* Dennett's "Multiple Drafts" model says there is no single stream. There are parallel processes. So denying the "Cartesian Theater" is accurate to Dennett. But denying *any* experience is too strong.
      *   *The Self-Refutation Objection:* This is the "illusion of an illusion" problem. If I am fooled into thinking I have qualia, isn't the *feeling of being fooled* itself a quale?
      *   *Illusionist Comeback:* Frankish's "Quining Qualia." The illusion is a cognitive judgment, not a phenomenal experience. Or, the "experience" is real, but its *properties* (ineffability, intrinsicness) are illusory. It's like a stick in water looking bent. The visual experience is real; the bentness is not a property of the stick. Wait, better analogy: The experience is real, but it doesn't have the *phenomenal properties* we think it does.
