answer: |-
  This is a classic moment in philosophy education where a distinction that feels like semantic hair-splitting actually marks a fault line in the underlying logic. I understand your frustration: if both philosophers conclude that you can't get ethics from biology, why does it matter which one you cite?

  The short answer is: **Your professor is substantively right.** This is not pedantry. Conflating Hume and Moore weakens your argument because they attack the problem from different angles, and accepting one does not logically force you to accept the other.

  Here is the breakdown of why the distinction matters, why your analogy doesn't quite bridge the gap, and which argument you should actually use for your paper.

  ### 1. Hume vs. Moore: The Substantive Difference

  You are treating the "Is-Ought Gap" and the "Naturalistic Fallacy" as two names for the same wall. In reality, they are two different walls built in different places.

  **Hume (The Logical/Inferential Claim)**
  *   **The Text:** *A Treatise of Human Nature* (1739).
  *   **The Claim:** Hume notices that moral writers often slide from descriptive premises ("God created us," "Humans seek pleasure") to prescriptive conclusions ("We ought to obey," "We ought to maximize pleasure") without explaining the connection.
  *   **The Force:** It is a challenge to **logic and inference**. Hume is saying, "You haven't shown me the valid syllogism that gets you from *is* to *ought*."
  *   **The Loophole:** Hume does not strictly say it is *impossible* to derive an ought from an is; he says it hasn't been done and requires explanation. A clever naturalist could theoretically accept Hume's challenge and try to build a bridge (e.g., by adding a normative premise like "We ought to pursue what is natural").

  **Moore (The Semantic/Metaphysical Claim)**
  *   **The Text:** *Principia Ethica* (1903).
  *   **The Claim:** Moore argues that "good" is a simple, indefinable, non-natural property. To define "good" as "evolutionarily fit" (or "pleasurable," or "desired") is to commit a fallacy of definition.
  *   **The Force:** It is a challenge to **identity and meaning**. Moore is saying, "Even if you explain the logic, you are misidentifying the property. 'Good' *means* something different than 'fit'."
  *   **The Tool:** The **Open Question Argument**. For any natural property X (e.g., evolutionary fitness), it always makes sense to ask, "But is X *good*?" If Good = X, that question would be tautological (like asking "Is a bachelor an unmarried man?"). Since it's not tautological, Good ≠ X.

  **Why You Can't Conflate Them**
  You can accept Hume but reject Moore.
  *   **Error Theorists (e.g., J.L. Mackie):** Agree with Hume that you can't derive objective values from facts, but reject Moore's idea that "good" refers to a non-natural property. They think "good" refers to nothing at all.
  *   **Synthetic Naturalists (e.g., Richard Boyd):** Reject Moore. They argue "good" *is* a natural property, just like "water" *is* H2O. We discovered that identity through science, not definition. They would say Moore's Open Question Argument fails because identities can be informative (just as "Is water H2O?" was once an open question).

  By conflating them, you imply that stopping the reduction of ethics to biology requires accepting Moore's specific (and controversial) metaphysics of "non-natural properties." You don't need to go that far to make your point.

  ### 2. Your "Yellow" Analogy
  You wrote: *"Substitute the right evolutionary account for the light-vibrations and you get exactly Hume's point."*

  This is where the conflation happens. Moore uses the yellow analogy to argue that the *sensation* of yellow is distinct from the *wavelength* that causes it. He claims "good" is like the sensation (non-natural), and "fitness" is like the wavelength (natural).

  Hume doesn't care about the metaphysics of the property. He cares about the **proposition**. Hume's point is about the structure of the argument, not the nature of the terms. Moore's point is specifically about the nature of the terms. If you use Moore to make Hume's point, you are importing metaphysical baggage (non-natural properties) that you might not need or want.

  ### 3. Which Argument Should Your Paper Use?

  Since your thesis is that **morality cannot be reduced to facts about evolutionary biology**, you are arguing against **Ethical Naturalism**.

  **Do not build the paper primarily on Hume.**
  Hume's gap is too broad. It stops *any* factual basis for ethics, including sociological or psychological facts. It doesn't specifically target *reductionism*. A naturalist could argue, "Hume is right that we need a bridge premise, and here it is: 'We ought to promote our genetic survival.'" Hume forces them to state the premise, but it doesn't prove the premise false.

  **Do not build the paper primarily on Moore (unless you are careful).**
  Moore's specific "Naturalistic Fallacy" relies on the idea that "good" is a non-natural property. Many modern philosophers think Moore was wrong about this. If you rest your whole paper on Moore, your professor (or a future reader) can simply say, "Moore's intuitionism is outdated; we can define good naturalistically."

  **The Best Strategy: The Open Question Argument + Contemporary Metaethics**
  Moore's *Open Question Argument* (OQA) is the specific tool derived from his work that best suits your thesis, even if you reject his metaphysics.
  1.  **Use the OQA:** Argue that "Survival is good" is always a substantive claim, not a tautology. Therefore, "good" cannot be *defined* as "survival." This blocks the *conceptual reduction*.
  2.  **Supplement with Sharon Street:** For a paper on evolutionary biology specifically, you should look at Sharon Street's **"Darwinian Dilemma"** (2006). She argues that if evolution shaped our moral beliefs for survival, we have no reason to think those beliefs track objective moral truth. This is a modern, more robust version of the is-ought problem applied specifically to evolution.
  3.  **Supplement with Korsgaard:** Christine Korsgaard distinguishes between **substantive** and **procedural** realism. She argues evolutionary accounts explain why we *have* moral impulses, but not why those impulses are *normatively binding*.

  ### 4. How to Fix Your Grade (and Your Argument)

  Your professor marked you down because precision is the currency of philosophy. Using the right name for the right argument shows you understand the machinery, not just the conclusion.

  **Action Plan:**
  1.  **Acknowledge the Correction:** In your revision or next paper, explicitly distinguish them. "While Hume identified the logical gap between descriptive and prescriptive statements, Moore provided a semantic argument against defining ethical terms via natural properties."
  2.  **Pivot to the Open Question Argument:** Frame your anti-reductionist argument this way: "Even if evolutionary biology explains why we *believe* X is good (Hume's domain), it cannot define what goodness *is* (Moore's domain). As Moore's Open Question Argument demonstrates, it remains meaningful to ask, 'Is evolutionary fitness actually good?'"
  3.  **Avoid the Label "Naturalistic Fallacy" if possible:** Ironically, many philosophers now avoid the term "Naturalistic Fallacy" because it is so often confused with Hume's Is-Ought. Instead, refer to "Moore's Open Question Argument" or "The argument against definitional naturalism."

  **Summary:**
  Your professor is right. It is not pedantry; it is the difference between a claim about **logic** (Hume) and a claim about **meaning** (Moore). For your specific thesis on evolutionary reductionism, Moore's **Open Question Argument** is the sharper tool, but it is strongest when paired with contemporary critiques like Sharon Street's. Fixing this distinction will not just recover your points; it will make your paper philosophically resilient.
