  1. The menu
  1. (a) If an agent knows the chance and lacks other relevant information, matching credence to chance is rationally permissible. This treats the slogan as a ceteris paribus constraint on belief formation that ignores defeaters provided by higher-order evidence regarding reliability. It suggests rationality fails only when evidence is missing, not when it conflicts with the chance statement provided by experts, thereby sidestepping the reliability issue entirely.
  2. (b) The Principal Principle is a substantive norm requiring credence to match known chance unless inadmissible information is present. This reading leaves open whether higher-order evidence regarding chance pedigree counts as inadmissible information under Lewis's specific framework for admissibility. It preserves the distinction between chance and credence while mandating alignment absent specific epistemic blockers like future knowledge, leaving the status of reliability evidence unresolved.
  3. (c) Chance is defined functionally as whatever quantity rational agents are required to defer to in their credences. This makes the principle analytic, ruling out counterexamples by stipulating the meaning of chance rather than discovering a substantive norm. It collapses the distinction between objective propensity and rational expectation, making divergence conceptually impossible by definition rather than normative force.
  4. (d) Rational action requires betting quotients to align with objective chances regardless of epistemic doubts about their derivation or source reliability. This shifts the focus from belief norms to pragmatic coherence in decision-making contexts involving risky wagers against nature. It implies that even skeptical agents should bet as if the chance is real to avoid guaranteed losses, prioritizing pragmatic success over epistemic accuracy.
  5. (e) Objective chances metaphysically dictate rational credence, rendering evidence about their source irrelevant to normative force or rational requirement. This asserts a strong ontological priority of chance over epistemic access conditions or reliability concerns regarding the measurement process. It claims the world's structure overrides our doubts about measuring it, demanding deference regardless of trust issues regarding the physicist's calibration.
  6. (f) The slogan refers to an idealized agent who possesses only the chance information and no higher-order doubts about the assignment process. This restricts the norm's application to epistemically pristine scenarios excluded by your classmate's case involving fudged calibrations and physicist dishonesty. It renders the principle inapplicable to non-ideal agents with complex evidence sets about chance mechanisms, effectively insulating the norm from real-world counterexamples.

  2. Verdicts
  Reading (a) is trivial and true, but offers no defense for the professor against your classmate's specific counterexample. It concedes that if extra information exists, the norm lapses, which is exactly the situation described in the seminar case. Since your classmate stipulates the agent has higher-order evidence, this reading admits the credence need not match the chance, undermining the professor's dismissal which claimed conformity was demanded regardless of the evidence.

  Reading (b) is substantive and defensible, but leaves the core dispute entirely open without further argument. Whether higher-order evidence is inadmissible is precisely the question at hand, not something settled by the principle itself. Lewis suggested admissibility concerns future information, but reliability doubts might count, so this reading doesn't settle the case without further argument about what counts as admissible information in this context.

  Reading (c) is trivial if analytic, but changes the subject from objective probability to rational coherence. If chance is defined by deference, the counterexample is impossible by fiat, but this abandons the objective notion of chance your seminar discusses. It reduces the principle to a tautology about rationality rather than a link to the world's propensities, failing to engage with the metaphysical claims implied.

  Reading (d) is substantive and likely false given standard decision-theoretic constraints on rational betting. Prudence does not require betting on known chances if the knowledge is undermined by reliability doubts about the source. A skeptical agent avoids bets based on fudged data, so aligning betting quotients with dubious chances is not necessarily prudent given the risk of loss inherent in the scenario.

  Reading (e) is substantive and false because metaphysical priority does not grant epistemic immunity to the agent. Even if chances dictate rationality, an agent cannot access them reliably if the source is compromised by fraud. This makes the demand to defer irrational given the agent's total evidence regarding the physicist's dishonesty and the compromised calibration process.

  Reading (f) is substantive and defensible, but irrelevant to the actual dispute about real agents. It protects the principle by restricting its domain to ideal cases where no reliability doubts exist. However, this makes the principle useless for real agents with messy evidence, effectively conceding that the professor's slogan doesn't apply to your classmate's realistic scenario involving calibration fraud.

  3. The seminar
  Only the definitional reading (c) and the idealization reading (f) license the professor's dismissal of your classmate's counterexample. Reading (c) rules out the counterexample by stipulating that chance just is what we defer to, but this changes the subject from objective probability to rational coherence, abandoning the metaphysical realism implied in seminar. Reading (f) protects the slogan by restricting it to agents without higher-order doubts, but this admits the principle fails for real agents like your classmate's, rendering the slogan practically inert in applied contexts. The substantive reading (b) is the only one preserving the objective notion of chance, but it cannot support the professor because it leaves the admissibility of higher-order evidence an open question requiring argument. Your classmate's case bites precisely here: if evidence about the physicist's fraud is admissible, the Principal Principle does not require credence 0.5, as the chance is not truly known but merely reported. The professor's slogan fails because it assumes chance information screens off all other evidence, which is false if the chance assignment itself is epistemically compromised by reliability defeaters. Thus, the dismissal relies on either changing the subject or ignoring the specific epistemic context of the case, failing to address the core tension between objective chance and subjective access. The phrase "guide of life" suggests practical necessity, but prudence requires trusting the guide, which is exactly what is undermined by the evidence of fraud.

  4. The residue
  The slogan leaves unsettled the criteria for admissibility regarding higher-order evidence about chance mechanisms. To adjudicate the counterexample, we must settle whether evidence undermining the reliability of chance measurement counts as inadmissible information under the Principal Principle. This requires a precise theory of admissibility that distinguishes between evidence about the outcome and evidence about the chance value itself. Without this, the principle remains ambiguous when chance assignments are epistemically contested. Furthermore, we need to clarify whether objective chance exists independently of our best theories, or if it is theory-relative. Until the relationship between metaphysical chance and epistemic access is rigorously defined, the slogan cannot resolve conflicts between chance statements and reliability evidence.
