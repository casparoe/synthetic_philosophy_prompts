answer: |-
  **To:** Red Tape Review Unit
  **From:** Senior Analyst
  **Subject:** Operational Procedure for Legacy Rule Triage (v1.0)

  ### 1. Context and Objective

  The Minister requires a defensible audit trail for every recommendation to scrap, keep, or rewrite. We cannot rely on intuition. However, we are constrained by time (one analyst-day per rule) and access (public records only).

  This procedure, the **Legacy Rule Triage Protocol (LRTP)**, is designed to operationalise Chesterton's Fence within our resource constraints. It does not guarantee perfection; it guarantees due diligence. It distinguishes between *active harms*, *reliance interests*, and *political settlements*.

  ### 2. The Legacy Rule Triage Protocol (LRTP)

  **Time Budget:** 6 Hours Active Analysis, 2 Hours Stakeholder Inquiry, 1 Hour Reporting.
  **Constraint:** If a step yields a "Stop" outcome, the analysis ends there.

  #### Step 1: The "Dead Letter" Test (Usage & Enforcement)
  *   **Question:** Has this rule been enforced, cited, or relied upon in any legal or administrative capacity in the last five years?
  *   **Method:** Search public court databases, annual agency reports, and ombudsman decisions.
  *   **Sufficient Answer:**
      *   *Yes:* Proceed to Step 2.
      *   *No (Zero instances):* **Recommendation: SCRAP.** (Draft note: "No evidence of active enforcement or reliance. Low risk of disruption.")
  *   **Rationale:** If the state isn't using it and the courts aren't citing it, it is likely already dead. This delivers the Minister's headline numbers safely.

  #### Step 2: The "Reliance" Test (Load-Bearing)
  *   **Question:** Have compliant entities invested capital or organisational structure specifically to satisfy this rule?
  *   **Method:** Send targeted queries to the three largest industry bodies or affected associations. Ask: "If Rule X vanished tomorrow, would it save you money or create operational chaos?"
  *   **Sufficient Answer:**
      *   *Chaos/Disruption:* **Recommendation: KEEP** (or Rewrite to simplify).
      *   *Save Money/Efficiency:* Proceed to Step 3.
      *   *No Response:* Treat as "No Objection," proceed to Step 3.
  *   **Rationale:** This identifies Animal #2 (Load-Bearing). Scrapping a rule that incumbents rely on punishes compliance and creates market instability.

  #### Step 3: The "Harm" Test (Live Risk)
  *   **Question:** If this rule is removed, is there a plausible mechanism for immediate public harm, fraud, or safety risk?
  *   **Method:** Compare with equivalent jurisdictions (other states/countries). If they have the rule, why? If they scrapped it, did anything break?
  *   **Sufficient Answer:**
      *   *Plausible Mechanism Identified:* **Refer to Minister** (See Step 5).
      *   *No Mechanism Found:* Proceed to Step 4.
  *   **Rationale:** This identifies Animal #1 (Live Harm). We are not safety experts; we are process auditors. If a risk is plausible, we cannot dismiss it on a hunch.

  #### Step 4: The "Truce" Test (Political Settlement)
  *   **Question:** Does this rule appear to regulate a boundary between two competing interest groups rather than a public risk?
  *   **Method:** Review legislative second-reading speeches (if available) or media archives from the time of passage. Look for language regarding "fair competition," "market share," or disputes between specific sectors.
  *   **Sufficient Answer:**
      *   *Evidence of Settlement:* **Recommendation: KEEP.** (Note: "Functions as market stabiliser.")
      *   *No Evidence:* **Recommendation: SCRAP.**
  *   **Rationale:** This identifies Animal #3 (The Truce). Removing a truce restarts the war. The state usually prefers the peace, even if the rule is inefficient.

  #### Step 5: The Ministerial Reserve (Value Judgement)
  *   **Trigger:** Any rule where Step 3 identifies a plausible harm, OR where Step 2/4 recommend "Keep" but the Minister has indicated a priority for deregulation in that sector.
  *   **Question:** Is the identified risk acceptable in exchange for the political capital of deregulation?
  *   **Action:** File goes to Minister with a "Risk Warning" flag.
  *   **Rationale:** Analysts assess facts; Ministers assess values. We cannot decide if a risk is "worth it."

  ---

  ### 3. Application to Current Docket

  Here is how the LRTP applies to three specific files from this quarter's docket.

  #### Case (a): The 1970s Two-Signature Rule
  *   **Description:** Regulation requires two authorised signatures on hazardous waste transport manifests. Rationale undiscoverable. Industry calls it "bureaucratic bloat."
  *   **LRTP Run:**
      *   *Step 1 (Usage):* Enforced occasionally, but mostly self-reported. (Proceed).
      *   *Step 2 (Reliance):* Industry bodies respond: "Single signature would speed up logistics. No capital invested in the second signature." (Proceed).
      *   *Step 3 (Harm):* Comparison with neighbouring state shows they moved to single signature + digital tracking five years ago with no increase in diversion. (Proceed).
      *   *Step 4 (Truce):* No evidence of inter-industry dispute. Purely administrative.
  *   **Recommendation:** **SCRAP.**
  *   **Ministerial Alignment:** High. This is a clean win. The procedure confirms the hunch with evidence (comparator jurisdiction data).

  #### Case (b): The Legacy Licensing Rule
  *   **Description:** Firms must maintain a physical "Safety Officer" on-site during specific operations. Original justification was 1950s public health (dust inhalation). Modern tech makes this obsolete.
  *   **LRTP Run:**
      *   *Step 1 (Usage):* Frequently cited in compliance audits. (Proceed).
      *   *Step 2 (Reliance):* **STOP.** Inquiry reveals incumbent firms have built entire middle-management layers around this requirement. They use it as a barrier to entry. New entrants want it scrapped; incumbents want it kept.
      *   *Analysis:* Scrapping this does not return the market to a "pristine" state; it devalues the compliance investment of existing firms and potentially floods the market.
  *   **Recommendation:** **REWRITE (Transition Period).** Do not scrap immediately. Recommend a phased removal or conversion to a certification model to protect reliance interests.
  *   **Ministerial Alignment:** **Low.** The Minister wants to announce the immediate abolition of "job-killing red tape." This recommendation tells them that immediate abolition creates market disruption and potential job losses in compliance departments.
  *   **Note:** This is the "unwelcome truth" the procedure is designed to surface.

  #### Case (c): The Pricing Boundary Rule
  *   **Description:** A rule limiting how discounting can be advertised in the fuel sector. Looks like consumer protection, but consumer groups don't care.
  *   **LRTP Run:**
      *   *Step 1 (Usage):* Rarely enforced by the state, but frequently cited in civil letters between companies. (Proceed).
      *   *Step 2 (Reliance):* Mixed. (Proceed).
      *   *Step 3 (Harm):* No safety risk. (Proceed).
      *   *Step 4 (Truce):* **STOP.** Archive search of 1985 Hansard reveals this was introduced during a "price war" that nearly bankrupted regional suppliers. It was a negotiated settlement between Majors and Independents.
  *   **Recommendation:** **KEEP.**
  *   **Ministerial Alignment:** Neutral. It doesn't generate a headline, but it prevents a sectoral fight.
  *   **Note:** Without Step 4, this looks like pointless interference. With Step 4, it is recognised as conflict prevention.

  ---

  ### 4. The Value Judgement (The Minister's Call)

  There is one step in the LRTP that is not a factual question. It occurs at **Step 5**.

  When Step 3 identifies a "Plausible Mechanism for Harm," the analyst cannot resolve it. For example, if we scrap a rule on asbestos handling, the *fact* is that exposure risks increase. The *value* question is: "Is the economic saving worth the statistical increase in health risk?"

  *   **Analyst Role:** Quantify the risk (e.g., "Comparator jurisdiction saw a 5% rise in incidents").
  *   **Minister Role:** Accept or reject that risk.

  If the Minister insists on scrapping a rule where Step 3 or Step 4 recommends "Keep," the file must be returned with a **"Ministerial Direction"** cover sheet. This records that the recommendation was overridden. This protects the unit if the "burned last year" scenario repeats.

  ### 5. Limitations: Where the Procedure Fails

  We must be honest about what one day of analysis cannot achieve. The LRTP reduces risk; it does not eliminate it.

  1.  **The "Latent Defect" Rule:** Some rules guard against low-probability, high-impact events (e.g., specific dam wall construction standards). In one day, we cannot verify the engineering. We will likely flag these as "Keep" via Step 3 simply because we cannot prove safety. This creates conservative bias.
  2.  **The "Silent Stakeholder":** Step 2 relies on stakeholders responding. If the group most harmed by a rule is unorganised (e.g., tenants, consumers) and the benefited group is organised (e.g., landlords, developers), the "Reliance Test" will be skewed. We may recommend scrapping a tenant protection because the tenants didn't email us back.
  3.  **The "Hidden Truce":** Some settlements (Case C) were verbal or informal. If the paper trail is empty, Step 4 will miss it. We might scrap a truce and restart a sectoral war.

  **Conclusion:**
  This procedure moves us from "hunch" to "auditable process." It will slow our scrap rate slightly, but it ensures that when we do cut, we are not cutting load-bearing walls. It provides the Minister with political cover for the scraps we *do* achieve, and protects the Unit from blame when a kept rule is later criticised as inefficient.

  **Action:**
  Please adopt this protocol effective immediately. All docket items from Q3 onwards must have the LRTP checklist attached to the briefing note.
