      *   *Fair Play:* Plausible if voting is a burden. But is complaining a benefit? Weak link. Doesn't fully vindicate silencing.
      *   *Complicity:* Stronger. If abstention helps the "evil" win, you share blame. But does blame silence criticism? Not necessarily (a co-conspirator can still critique the plan).
      *   *Consent:* Weak. Political obligation usually isn't conditional on voting. Doesn't vindicate.
