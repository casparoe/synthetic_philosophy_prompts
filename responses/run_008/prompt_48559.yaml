          4.  Complicity/Dirty Hands (You allowed this to happen, so you share blame).
          5.  Expressive/Symbolic (Voting is the only legitimate form of political speech recognized).
          6.  Epistemic (You don't know enough if you didn't participate).

  3.  **Drafting the Distinct Claims (Iterative Process):**

      *   *Idea 1: Causal.* If you don't vote, you didn't change anything.
          *   *Refinement:* This is more "your complaint is futile" than "you can't complain." But often people conflate "can't" (normative) with "won't matter" (causal). Let's call it the *Causal Inefficacy Claim*.
      *   *Idea 2: Consent.* By not voting, you rejected the authority.
          *   *Refinement:* This is tricky. Usually, voting is seen as *giving* consent. Not voting might be withholding it. The claim implies that *only* voters have standing. Let's call it the *Consent/Authorization Claim*.
      *   *Idea 3: Fairness.* It's unfair to complain if you didn't try to fix it.
