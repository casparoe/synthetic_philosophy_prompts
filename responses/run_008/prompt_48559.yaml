prompt: |-
  In my political philosophy seminar we've been discussing whether voting is a duty, and whether it's better understood as an act of expression than as a way of influencing outcomes. At a departmental debate-night event afterwards, a fellow student who had abstained in the recent election (she said she couldn't bring herself to vote for a "lesser evil") was told, in a tone that ended the conversation, that "if you didn't vote, you can't complain." I suspect the line is doing several different jobs at once, but I can't sort them out. Could you lay out the distinct precise claims that one-liner could be expressing — from near-truisms to substantive normative theses about standing, complicity, fairness in the distribution of complaint-rights, or the expressive character of voting — and for each reading say whether it is plausible and whether it would actually vindicate dismissing her complaint? Present them as a list I can bring to section, and flag which reading you think the people who use the line most likely have in mind.
