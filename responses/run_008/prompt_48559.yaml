answer: |-
  Here is a breakdown of the distinct philosophical claims embedded in the retort "If you didn't vote, you can't complain," structured for your seminar section.

  The phrase is ambiguous between a **causal claim** (complaining is futile) and a **normative claim** (complaining is impermissible). It also oscillates between complaining about the *specific outcome* (the winner) and the *structural conditions* (the lack of good options). Below are five distinct readings, ranging from empirical observations to substantive theories of political obligation.

  ### 1. The Causal Inefficacy Claim
  *   **The Claim:** Voting is the primary mechanism for influencing political outcomes. By abstaining, you voluntarily relinquished the only tool capable of altering the result. Therefore, your complaint is causally disconnected from any potential remedy; you have no leverage.
  *   **Plausibility:** **Low to Moderate.** While empirically true that a single vote rarely decides an election, this reading conflates *influence* with *standing*. One can have a valid grievance about a harm even if one lacks the power to fix it (e.g., a disenfranchised prisoner can complain about prison conditions).
  *   **Vindicates Dismissal?** **No.** Even if the complaint is instrumentally futile, it does not follow that the complainer lacks the *right* to voice dissatisfaction. This reading justifies ignoring the complaint as ineffective, but not silencing it as illegitimate.

  ### 2. The Fair Play (Reciprocity) Claim
  *   **The Claim:** Political decision-making is a cooperative scheme involving burdens (researching candidates, tolerating imperfect options, going to the polls). By abstaining, the student avoided these burdens while still benefiting from the stability the election provides. To complain about the result is to "free-ride" on the decision-making labor of others.
  *   **Plausibility:** **Moderate.** This relies on the Principle of Fair Play. However, it is contested whether voting is a "burden" sufficient to generate obligations, and whether "complaining" constitutes an unfair benefit. Furthermore, if the options were morally repugnant ("lesser evil"), the duty to participate in the scheme is weakened.
  *   **Vindicates Dismissal?** **Partially.** It suggests the student is being hypocritical or unfair, which undermines her moral credibility. However, unfairness in procedure does not necessarily negate the truth of the complaint regarding the outcome's harmfulness.

  ### 3. The Complicity (Dirty Hands) Claim
  *   **The Claim:** In a majoritarian system, abstention functionally aids the victor by reducing the denominator of total votes or failing to block the winner. By refusing to vote for the "lesser evil," the student allowed the "greater evil" to win. She is therefore partially responsible for the outcome she is criticizing.
  *   **Plausibility:** **High (in swing contexts).** This is a strong causal/moral link. If one accepts that voting is a duty to prevent harm, abstention is an act of omission that contributes to that harm.
  *   **Vindicates Dismissal?** **No.** Being complicit in a bad outcome does not strip one of the right to criticize it. A co-signer on a bad loan can still complain about the bank's terms. Complicity might make her complaint *ironic* or *guilt-laden*, but it does not logically silence her.

  ### 4. The Authorization (Consent) Claim
  *   **The Claim:** Political legitimacy is derived from the consent of the governed, operationalized through voting. By voting, citizens authorize the government to rule and accept the legitimacy of its decisions. By abstaining, the student withheld consent; therefore, she has placed herself outside the social contract regarding this specific mandate and lacks the standing to critique the authorized agents.
  *   **Plausibility:** **Low.** Modern democratic theory rarely treats voting as explicit consent (tacit consent theories are widely criticized). Non-voters are still subject to the law and retain rights; they do not become political outcasts.
  *   **Vindicates Dismissal?** **No.** Even if she withheld consent, she remains a subject of the state's power. Those subject to power have a fundamental right to critique it, regardless of whether they authorized it (otherwise, disenfranchised groups could never complain).

  ### 5. The Expressive Monopoly Claim
  *   **The Claim:** Voting is the *only* recognized form of legitimate political speech within the institutional framework. Abstention is not a "vote of no confidence" or a moral statement; it is simply silence. If you did not speak the language of the system (voting), the system does not recognize your speech (complaint) as valid.
  *   **Plausibility:** **Low (Normatively), High (Descriptively).** Normatively, this contradicts the seminar's discussion that abstention *can* be expressive. Descriptively, politicians often treat non-voters as apathetic rather than dissenting.
  *   **Vindicates Dismissal?** **Yes, but only institutionally.** This reading suggests the complaint is category-error: she is trying to use "outside" speech to critique an "inside" game. However, this vindicates the dismissal only if one accepts the premise that voting is the exclusive mode of political expression, which is precisely what your seminar is questioning.

  ***

  ### Most Likely Intended Meaning
  In the context of a casual debate-night retort, the speaker most likely has **The Complicity Claim (#3)** in mind, bolstered by **The Fair Play Claim (#2)**.

  The rhetorical force of "you can't complain" is usually an accusation of hypocrisy rather than a technical claim about legal standing. The speaker is implying: *"You had a chance to stop this and chose not to; therefore, the resulting harm is partly on your hands, and you lose the moral high ground required to express outrage."*

  **For Section Discussion:**
  You might press the group on whether **complicity silences**. If the "greater evil" wins, the harms are real regardless of who is to blame. Does sharing responsibility for a disaster mean one loses the right to object to the suffering it causes? This connects directly back to your seminar's tension between voting as a **duty** (to prevent harm) vs. voting as **expression** (where abstention is a valid moral statement). If abstention is valid expression, the Complicity Claim collapses; if voting is a strict duty, the Complicity Claim holds.
