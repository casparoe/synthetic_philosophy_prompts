  7.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Isotopes:* Make sure to distinguish between *chemical* kind and *physical* kind. Chemists care about $Z$, physicists care about $(Z, N)$. The user's view is about *chemical* elements. The stress test is whether "Chemical Element" is a *fundamental* kind or a *pragmatic* one.
      *   *Correction on Oganesson:* It's not just that it decays fast; it's that relativistic effects might make it behave like a semiconductor, not a noble gas. This attacks the "cluster of properties" part of the user's definition.
      *   *Refining Falsifiability:* Use the term "Pessimistic Meta-Induction." It's the standard philosophical counter to "we finally got it right."
