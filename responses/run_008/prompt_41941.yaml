answer: |-
  ### Evaluator's Note: The "Threshold-Hold" Paradigm

  Before presenting the collaboration document, here is the specific evaluation of the "Threshold-Hold" BCI paradigm you requested.

  **Verdict:** This is **not** a genuine crux-test in its current formulation; both camps would likely reject it, but for different reasons that reveal the deeper structure of the debate.

  1.  **The GWT Objection (The "Introspection is Access" Problem):**
      *   **The Critique:** Global Workspace theorists (e.g., Dehaene) argue that *introspection* is itself a form of access. To "leisurely introspect" on a stimulus requires holding that content in working memory and broadcasting it to the prefrontal systems responsible for metacognition.
      *   **The Consequence:** If the subject is successfully introspecting, ignition *must* be occurring. Therefore, a BCI that successfully suppresses ignition would render introspection impossible. If the subject reports rich content, the GWT proponent will claim the BCI failed to suppress ignition during the moment of introspection.
      *   **Sign-off Status:** The GWT side will not sign this as a valid test unless "introspection" is operationally defined as something other than neural access (which contradicts their theory).

  2.  **The Overflow Objection (The "Measurement Contamination" Problem):**
      *   **The Critique:** Block's camp might worry that requiring *any* form of verification (even post-hoc report) contaminates the fragile phenomenal state. However, their bigger issue is that the GWT objection above makes the test circular.
      *   **The Consequence:** If GWT defines consciousness *as* the ignition required for introspection, no subjective report can ever disprove them.
      *   **Sign-off Status:** The Overflow side will only sign if the primary measure is **neural decoding** of content during the hold, not subjective report.

  3.  **Implication for the Overflow Debate:**
      *   If both sides reject introspection as a reliable measure in sub-ignition states, the debate shifts entirely to **objective neural decoding**. The crux becomes: *Can we decode rich stimulus information from posterior cortex while frontal ignition is suppressed?*
      *   **GWT Prediction:** No. Without ignition, information is fragmented and not decodable as a coherent object.
      *   **Overflow Prediction:** Yes. Posterior activity alone sustains coherent content.

  **Recommendation:** In the document below, I have adapted the "Threshold-Hold" into **Crux #1**, but modified it to rely on *neural decoding* during the suppression window rather than subjective introspection. This is the only version both sides might sign.

  ***

  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Neural Correlates of Consciousness: Access vs. Phenomenality
  **Parties:** Proponents of Global Workspace Theory (GWT) | Proponents of Phenomenal Overflow (PO)
  **Date:** October 24, 2023

  ## I. SUBSTANTIVE AGREEMENTS
  *The undersigned parties agree to the following empirical and theoretical claims. These concessions are made to isolate the specific locus of disagreement.*

  1.  **The Report Confound:** Both parties agree that standard report-based measures (verbal, button press) conflate conscious experience with post-perceptual processes, including working memory consolidation, decision thresholds, and motor planning. A lack of report does not definitively prove a lack of experience.
  2.  **Necessity of Ignition for Report:** Both parties agree that "ignition" (sustained, amplified fronto-parietal activation) is necessary for the *verification and reporting* of a stimulus. There is no disagreement that the Global Workspace is required for *Access Consciousness* (in Block's terminology).
  3.  **Sperling Partial-Report:** Both parties agree that the Sperling paradigm demonstrates a dissociation between the total information available to the visual system and the information that can be retrieved for report.
      *   *Agreed Interpretation:* The paradigm proves that high-capacity storage exists for a brief duration (~300ms). It does not, on its own, settle whether that storage is phenomenally conscious.
  4.  **Change and Inattentional Blindness:** Both parties agree that these phenomena demonstrate the necessity of attention for *reportability* and *task performance*. Both agree that unattended stimuli can be processed semantically to some degree (priming) without entering the global workspace.
  5.  **Physicalism:** Both parties agree that consciousness is a natural physical process. The disagreement is not about dualism, but about which specific physical mechanism constitutes the *minimal supervenience base* of phenomenal experience.

  ## II. TABLE OF DISAGREEMENTS
  *The following table outlines the residual disagreements. Phrasing has been vetted to ensure neither party feels their position is caricatured.*

  | Domain | Global Workspace Theory (GWT) Position | Phenomenal Overflow (PO) Position |
  | :--- | :--- | :--- |
  | **Definition of Consciousness** | Conscious awareness is identical to global availability (Access). There is no "phenomenal consciousness" that exists independently of access to cognitive systems. | Phenomenal Consciousness (P-consciousness) is distinct from Access Consciousness (A-consciousness). P-consciousness can exist without being available for report or reasoning. |
  | **Neural Correlate (NCC)** | The NCC is the *ignition event* itself (fronto-parietal network). Posterior activity without ignition is unconscious processing. | The NCC for *experience* is specific posterior cortical activity (e.g., V4, LOC). Frontal ignition is the NCC for *reporting* that experience. |
  | **Iconic Memory (Sperling)** | The unreported letters in the iconic memory buffer are not consciously seen; they are high-capacity pre-conscious representations that decay before access. | The unreported letters are consciously seen (rich phenomenology) but lost before they can be accessed for report. This is "overflow." |
  | **Methodological Priority** | Objective measures (report, task performance) are the primary scientific data. Subjective confidence is secondary and prone to bias. | Subjective measures (confidence, phenomenological report) are primary for establishing phenomenology. Objective measures track access, not necessarily experience. |
  | **Function of Phenomenology** | Phenomenology serves a functional role in integration and flexible reporting. If it doesn't broadcast, it doesn't exist. | Phenomenology may have a function, but its existence is not contingent on its functional utility for report. It is a biological state that can overflow capacity. |

  ## III. EMPIRICAL CRUXES & PRE-REGISTERED PREDICTIONS
  *The following experiments are proposed to adjudicate the disagreements. For each, both parties commit to accepting the outcome as evidence weighing for or against their position.*

  ### Crux 1: The "Threshold-Hold" Decoding Paradigm (Modified)
  **Protocol:** A real-time fMRI/EEG-BCI monitors fronto-parietal ignition. Stimulus contrast is dynamically adjusted to maintain high-fidelity posterior visual activation while actively suppressing frontal ignition below a pre-registered threshold for 2 seconds. During this window, **no report is required.** Multivariate pattern analysis (MVPA) attempts to decode specific stimulus content (e.g., face vs. house) from posterior cortex.
  **GWT Prediction:** Decoding accuracy will be at chance or reflect only low-level features (orientation, color) without coherent object representation. Without ignition, information is fragmented and not bound into a conscious object.
  **PO Prediction:** Decoding accuracy will be high for specific object categories. Rich, coherent content is sustained in posterior cortex independently of frontal ignition.
  **Sign-off Condition:** GWT signs only if "ignition" is defined by the pre-registered frontal threshold, not by the success of decoding. PO signs only if report is not required during the hold window.

  ### Crux 2: Posterior TMS Masking with Confidence Ratings
  **Protocol:** Transcranial Magnetic Stimulation (TMS) is applied to posterior visual cortex (V3/V4) at varying latencies after stimulus onset. Subjects provide a subjective visibility rating (PAS scale) and an objective forced-choice judgment.
  **GWT Prediction:** Disrupting posterior activity will reduce objective performance, but subjective visibility will track performance linearly. If you can't access it (perform), you didn't see it.
  **PO Prediction:** It is possible to disrupt objective performance (access) while preserving high subjective visibility ratings (phenomenology), or vice versa (blindsight-like patterns in neurotypical subjects). A double dissociation between PAS and accuracy is expected.
  **Sign-off Condition:** Both parties agree that a statistically significant double dissociation (high visibility/low accuracy) would favor PO, while a tight correlation would favor GWT.

  ### Crux 3: The Verbal vs. Substantive Dispute
  **Protocol:** A philosophical/semantic analysis of the term "Consciousness" as used in experimental protocols.
  **GWT Stance:** The dispute is largely verbal. If "Consciousness" is defined operationally as "what we can report and integrate," GWT is true by definition. PO is positing a "ghostly" residue that does no work.
  **PO Stance:** The dispute is substantive. Even if we agree on definitions, the *neural claim* remains: Does the brain generate phenomenology *before* the workspace? If PO is right, GWT is empirically false about the *location* of experience, not just the definition.
  **Joint Classification:**
  *   **Verbal Component:** Whether the word "consciousness" should be reserved for reportable states (GWT) or include non-reportable phenomenology (PO).
  *   **Substantive Component:** Whether rich, coherent information processing in posterior cortex *feels like something* in the absence of frontal ignition.
  **Resolution Path:** The parties agree that settling Crux 1 (Decoding) resolves the Substantive Component. If posterior decoding is rich without ignition, the GWT claim that "ignition creates the content" is empirically falsified, regardless of definition.

  ## IV. RESIDUAL DISAGREEMENT STATEMENT
  *This collaboration does not end in consensus. The following disagreement remains exact and unresolved.*

  **The Ontological Status of Unaccessed Content:**
  Even if Crux 1 demonstrates that posterior cortex holds decodable information without ignition, the **GWT** party maintains that this information is *unconscious* processing until it is broadcast. They will argue that decoding proves *capacity*, not *experience*.

  The **PO** party maintains that if the information is decodable as a coherent object and the subject reports visibility (even post-hoc), the experience existed *during* the unaccessed window. They will argue that GWT conflates the *consequences* of consciousness (report) with consciousness itself.

  **Final Stipulation:**
  *   **GWT** will not concede that "phenomenal consciousness" is a natural kind distinct from access.
  *   **PO** will not concede that frontal ignition is the seat of experience.
  *   **Both** agree that future research must utilize no-report paradigms with neural decoding to minimize the report confound, acknowledging that this is the only path to resolving the substantive neural claim.

  ***

  **Signatures:**

  _________________________ (Global Workspace Proponent)

  _________________________ (Phenomenal Overflow Proponent)
