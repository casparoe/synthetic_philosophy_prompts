  ### Part 4: The Discriminating Case

  To definitively distinguish between the **Normative-Functional Principle** (my best guess) and the **Contextual-Normality Principle** (the strongest rival), we need a case where an action is *statistically normal* but *normatively unassigned*.

  **The Discriminating Case: The Habitual Volunteer**
  > A wealthy client owns a vacation home with a rare, delicate orchid in the lobby. For ten years, a local postal worker has delivered mail to the front door. There is no agreement, but for the last five years, the postal worker has voluntarily watered the orchid every Tuesday because she admires it. The client knows this and relies on it, but has never asked or paid for it. It is the established custom for this specific house. One Tuesday, the postal worker simply decides not to water it. She has no duty, contract, or job description requiring it. The orchid dies.

  **Why this discriminates:**
  *   **Normative-Functional Prediction:** **Not a Cause.** There is no contract, no job requirement, and no assigned function. The postal worker's role is to deliver mail, not water plants. Like the Tourist and the Neighbor, she had no obligation.
  *   **Contextual-Normality Prediction:** **Cause.** In the specific context of *this* house, watering the orchid on Tuesday is the established statistical and operational norm. The omission is a deviation from the local baseline, unlike the Wildflower case.

  **Explanation:**
  If your friend verdicts **Cause**, she is tracking **custom and expectation** (Normality). If she verdicts **Not a Cause**, she is tracking **obligation and assignment** (Normative). This case isolates the variable of "established habit" from "formal duty," forcing a choice between the two principles that otherwise aligned on the original five cases.
