  *   **Verification:**
      *   *Gardener:* Hired/Contracted. (Fits: Cause)
      *   *Tourist:* No contract, no duty. (Fits: Not Cause)
      *   *Doctor:* Professional duty/On call. (Fits: Cause)
      *   *Wildflower:* No agent owes rain; nature has no obligation. (Fits: Not Cause)
      *   *Sprinkler:* Installed with a specific function (teleological duty) to activate. (Fits: Cause)
  *   **Strain:** It requires treating mechanical systems as having "duties" or "functions" in a quasi-moral sense, but this is standard in functionalist metaphysics.

  **Candidate 2: The Contextual-Normality Principle**
  *   **Rule:** An omission counts as a cause only if the omitted event is the statistical or contextual "default" for that specific environment. Causation is a deviation from the local norm.
  *   **Verification:**
      *   *Gardener:* In the context of a hiring agreement, watering is the norm. (Fits: Cause)
      *   *Tourist:* In the context of public streets, strangers watering private roses is not the norm. (Fits: Not Cause)
      *   *Doctor:* In a hospital context, treating poisoning is the norm. (Fits: Cause)
      *   *Wildflower:* In an arid region, "no rain" is the statistical norm. The absence of rain is not a deviation. (Fits: Not Cause)
      *   *Sprinkler:* In a building with a sprinkler system, activation during fire is the operational norm. (Fits: Cause)
  *   **Strain:** "Normality" can be vague. Does it mean statistical frequency or social expectation? The Tourist case suggests social expectation; the Wildflower case suggests statistical frequency.

  **Candidate 3: The Epistemic-Capacity Principle**
  *   **Rule:** An omission counts as a cause only if the omitter was aware of the specific need and had the immediate capacity to prevent the outcome (treating designed systems as having "functional awareness").
  *   **Verification:**
      *   *Gardener:* Knew the job, had the water/hose. (Fits: Cause)
      *   *Tourist:* "Has no idea they are being neglected." (Fits: Not Cause)
      *   *Doctor:* Knew the patient's state, had the antidote. (Fits: Cause)
      *   *Wildflower:* No agent to possess knowledge. (Fits: Not Cause)
      *   *Sprinkler:* As a designed safety system, it is a proxy for awareness/capacity; it "failed" to detect/act. (Fits: Cause)
  *   **Strain:** Attributing "awareness" to a sprinkler is metaphorical. It fits only if we accept that designed function substitutes for epistemic states.

