      *   *Subject Combination (Subject Problem):* How do micro-subjects (I am an electron) combine to make a macro-subject (I am a human)? This is the hard one. It's about *unity of experience* vs. *collection of experiences*.

  3.  **Translate to Physical Chemistry Vocabulary:**
      *   *Quality Combination:* This maps reasonably well to *emergent intensive properties*. E.g., temperature, color, viscosity. These are not simple sums of particle properties. A single molecule doesn't have a "boiling point."
      *   *Subject Combination:* This is the tricky one. In physics/chem, we have *systems*. A system has boundaries. But does a system have an "inside view"? Statistical mechanics deals with ensembles, phase space, coarse-graining. But it never posits a "point of view" associated with the ensemble itself.
      *   *Key Concepts:*
          *   Extensive vs. Intensive: Mass is extensive (adds up). Temperature is intensive (averages/equilibrates). Consciousness seems neither.
          *   Coarse-graining: Ignoring micro-details to get macro-behavior. Does this *create* a subject or just *describe* one?
          *   Degrees of Freedom: Macro-states constrain micro-states.
          *   Phase Transitions: Abrupt changes in order parameters. Is consciousness a phase transition?

