          *   In Panpsychism, the "system" *feels* like something from the inside.
          *   The translation fails here. Coarse-graining reduces information (entropy increases). It doesn't *unify* perspectives. $N$ particles $\neq$ 1 Subject.
          *   Analogy: Integrating over phase space gives a partition function, not a "super-particle" with its own view.
      *   **Part 3: The Residue Report (Addressing the Instinct):**
