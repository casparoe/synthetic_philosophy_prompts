      *   *Reasoning:* This is the closest analog to the Sand Dune. A dune is a stable shape made of shifting parts held by friction/gravity. A traffic jam is a stable shape made of shifting cars held by braking/spacing. Since she accepted the Dune (which is arguably just a temporary pattern of sand), she should accept the Jam (a temporary pattern of cars). Plus, the cars are physically touching (bumper-to-bumper), satisfying the Contact rule.

  ### 4. The Discriminator Case

  To cleanly tell **Rule A (Perceptual Lump)** and **Rule B (Mechanical Contact)** apart, you need something that looks like one thing but has no physical contact between parts.

  **The Case:** **A Cloud.**
  *   **The Setup:** A cumulus cloud looks like a single, fluffy white object floating in the sky. However, it is made of billions of water droplets or ice crystals that are suspended in air and generally do not touch each other (they are separated by gas).
  *   **The Split:**
      *   If she says a Cloud **IS** an object: She follows **Rule A (Perceptual Lump)**. Visual boundedness trumps physical contact.
      *   If she says a Cloud **IS NOT** an object: She follows **Rule B (Mechanical Contact)**. Without physical cohesion, it's just a collection of droplets (like the murmuration).

  *Given her acceptance of the Sand Dune, this is a tough call, but the Cloud is the cleanest test because the "parts" are even less connected than sand grains.*

  ### 5. Confidence Calibration

  Here is how much I would actually bet on these predictions:

  *   **I would bet money on: The Murmuration = NO.**
      *   *Why:* Her rejection of the "Two Heaps" is the strongest data point we have. It establishes a hard "No Gaps" constraint. Birds not touching is a gap. This intuition is usually very sticky for non-philosophers.
  *   **I would NOT bet on: The Traffic Jam = YES.**
      *   *Why:* While it fits the Dune analogy, a traffic jam is often intuitively categorized as an *event* or a *situation* rather than an *object*. If she distinguishes between "things" (nouns) and "occurrences" (verbs), she might reject it despite the contact.
  *   **The judgment I am LEAST sure of: The Clonal Aspen.**
      *   *Why:* This is the only case where "scientific fact" (it's one root system) conflicts with "visual intuition" (it's many trees). Since she has a philosophy undergrad, she might have encountered this specific example in a class and been taught to say "Yes," even if her raw intuition says "No." It depends on whether her "firm opinions" are truly intuitive or partially informed by half-remembered coursework.

  **Summary Strategy for Thanksgiving:**
  Press her hardest on the **Murmuration**. If she says "Yes," her rule is purely Visual, and you can trap her with the "Two Heaps" contradiction (why is 10 meters a gap but 10 centimeters of air not?). If she says "No," she is a Contact theorist, and you can challenge her on the **Cloud** or the **Traffic Jam** (are waves objects?).
