  Here is the breakdown of the rules, the predictions, and my confidence levels.

  ### 1. The Candidate Rules

  Based on her track record (Cat/Desk/Dune = **Yes**; Mug+Neptune/Two Heaps = **No**), two rules fit the data perfectly but diverge on the new cases.

  **Rule A: The "Perceptual Lump" Rule (Phenomenal Continuity)**
  *   **The Principle:** A bunch of things add up to one object if they present to the senses as a single, bounded shape with a stable outline.
  *   **Why it fits her record:** Cats, desks, and sand dunes all look like distinct "lumps" with boundaries. Mug+Neptune and Two Heaps look like scattered, disconnected things.
  *   **The Weighting:** Visual/Spatial continuity is the primary driver; physical connection is secondary.

  **Rule B: The "Mechanical Contact" Rule (Mereological Cohesion)**
  *   **The Principle:** A bunch of things add up to one object only if the parts are physically touching and mechanically constraining each other (via friction, fasteners, or biological tissue).
  *   **Why it fits her record:** Cat parts touch; desk parts are screwed; sand grains touch (friction). Mug+Neptune don't touch; the two heaps have an air gap between them.
  *   **The Weighting:** Physical contact is necessary. Visual unity is not enough.

  ### 2. Predictions for the Three New Cases

  | Case | Rule A (Perceptual Lump) | Rule B (Mechanical Contact) |
  | :--- | :--- | :--- |
  | **1. Clonal Aspen Colony** | **NO.** Visually, it looks like a forest of many trees, not a single bounded shape. | **YES.** The root system is physically connected underground, mechanically linking the trunks. |
  | **2. Murmuration** | **YES.** It looks like a single, shifting cloud or shape in the sky. | **NO.** You specified no birds ever touch. There is air between them. |
  | **3. Traffic Jam** | **YES.** It presents as a solid block of cars with a clear boundary (the back of the jam). | **YES.** Cars are bumper-to-bumper (touching) and constrain each other's motion. |

