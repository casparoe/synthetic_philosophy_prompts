          *   Group 2 (Dramatic Irony): Shows emotion is not just about threat to self, but about care for others. It breaks the "fear = danger to me" model.
          *   Group 3 (Video Game): This is the outlier that breaks the "spectator" model. It introduces moral agency. It suggests guilt tracks the *structure of the will*, not the *consequences in the world*.
          *   Group 4 (Ambiguity): Shows the object of emotion is opaque to the subject.
      *   *The Diagnosis:* The paradox assumes emotions are propositional attitudes directed at existing objects. But emotions are often responses to *patterns* or *simulations*. The stalemate is because both sides are defending a partial truth about a fragmented system.
      *   *Conclusion on Progress:* Progress requires abandoning the search for a single definition of emotion. We need a pluralistic ontology of affect. The question isn't "Is this emotion rational?" but "What system generated this response?"

  5.  **Refining the Tone:**
