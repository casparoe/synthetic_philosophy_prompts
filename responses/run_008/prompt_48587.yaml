answer: |-
  **Project Title:** Operationalizing Memetic Fitness: Distinguishing Cultural Selection from Rational Adoption

  **Research Question**
  Can "memetic fitness" be operationalized independently of content-based utility (truth, usefulness, moral value) such that a memetic model generates predictions about cultural transmission that diverge from those of an intentional stance model?

  **Background and Motivation**
  Since the inception of memetic theory, explanatory usage has bifurcated. In its demystifying mode, the framework explains the spread of religions or ideologies as viral processes where variants inducing propagation win regardless of truth. In its tautological mode, an idea spreads "because it is memetically fit," which reduces to "it spreads because it spreads." Critics argue that unless memetic fitness can be defined independently of the fact of spread, the theory is unfalsifiable. Proponents assume the framework works but rarely demonstrate cases where it outperforms standard intentional explanations (i.e., people adopted belief X because they reasoned X was true or useful).

  This ambiguity is critical for longtermist work on the information environment. If "memetic hazards" are real, they represent a specific class of risk where ideas spread *despite* being false or harmful. If, however, apparent memetic hazards are merely rational responses to skewed incentives or evidence, interventions targeting "virality" may fail. Current literature leaves this open because it lacks a formal comparison showing where the two models yield different outputs given the same inputs. This project seeks to resolve that theoretical uncertainty.

  **Methodology and Timeline (Six Months, Part-Time)**
  The research will proceed in three phases, combining conceptual analysis with simple formal modeling.

  *Months 1–2: Conceptual Clarification and Variable Isolation*
  I will define the parameter space for "memetic fitness" strictly excluding content-based variables. This involves cataloging transmission biases (e.g., conformity, prestige bias, copying fidelity) that operate independently of the idea's propositional content. The goal is to produce a rigorous definition of "pure memetic selection" that does not secretly rely on the agent's assessment of utility. I will draft a taxonomy of transmission modes, distinguishing between content-biased transmission (adopting because of what the idea says) and context-biased transmission (adopting because of who says it or how many others have).

  *Months 3–4: Formal Toy Models*
  I will construct coupled differential equation models or agent-based simulations comparing two populations: one evolving via intentional learning (agents update based on perceived payoff/truth) and one via memetic selection (agents update based on transmission biases). The models will be simple enough to be analytically tractable but complex enough to allow for feedback loops. I will search for parameter regimes where the trajectories of belief prevalence diverge significantly between the two models. For example, does a high conformity bias predict the stabilization of a false belief in conditions where individual learning predicts abandonment?

  *Months 5–6: Retrodiction and Scope Definition*
  I will apply the divergent predictions from the models to historical case studies (e.g., the spread of specific technological standards, religious prohibitions, or political slogans). The aim is not to prove the history definitively, but to test whether the memetic model offers a better fit for the *dynamics* of spread (speed, resilience to counter-evidence) than the intentional model. The final output will be a paper delineating the boundary conditions: when is a memetic explanation warranted, and when is it redundant?

  **Success and Failure Conditions**
  *Success:* The project succeeds if I can identify at least one robust parameter regime in the formal models where memetic selection predicts a stable equilibrium of belief that intentional learning predicts will vanish, and show that this regime plausibly maps to real-world phenomena. Alternatively, success includes a rigorous proof that such divergence is impossible under reasonable assumptions, thereby dissolving the memetic exception.
  *Failure:* The project fails if the "memetic" variables consistently collapse into hidden intentional variables (e.g., prestige bias turns out to be a rational heuristic for truth-tracking) in all modeled scenarios, leaving no distinct explanatory residue. It also fails if the models become too complex to yield clear comparative predictions.

  **Scope and Limitations**
  Six months part-time is sufficient for theoretical clarification and toy modeling, but not for empirical data collection or complex historical reconstruction. This project will not determine whether specific modern phenomena (e.g., specific conspiracy theories) are memetic hazards. That is a follow-on empirical task. This project provides the theoretical instrument required to measure those hazards correctly. Longer-term work would involve collaborating with empirical researchers to test the identified divergences using large-scale social data.

  **Relevance to Information Environment Work**
  A program officer might ask: why fund armchair philosophy about memes rather than empirical research on misinformation?

  The answer is leverage. Empirical research on misinformation often assumes memetic mechanisms without verifying them. Interventions are designed to "break the chain of transmission" or "reduce virality." If the spread of misinformation is actually driven primarily by rational (though perhaps misinformed) updating based on perceived utility, then anti-virality interventions will be inefficient compared to interventions that alter payoff structures or evidence availability.

  Currently, the field risks solving the wrong problem because the core theory is ill-defined. By determining whether memetic fitness is a distinct causal force or a redescription of rational choice, this project prevents the misallocation of resources toward interventions that target "catchiness" when they should target "incentives." Clarifying the theory increases the expected value of all subsequent empirical work on information hazards. This is foundational work intended to make future empirical dollars more productive.
