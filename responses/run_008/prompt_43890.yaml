answer: |-
  You have not wandered off the map; you have arrived at a well-charted, albeit treacherous, coordinate in the foundations of decision theory. The configuration you have built is essentially identical to a problem known in the literature as **The Pasadena Game**.

  It was introduced by Alan Hájek and Michael Nover in their 2004 paper *"Vexing Expectations"*. While your specific payoff function differs slightly in sign (yielding $-\ln 2$ rather than $+\ln 2$), the structural pathology is exactly the same.

  Here is the breakdown of the literature, the mathematical verdict, and how this sits relative to the paradoxes you already know.

  ### 1. The Name and The Literature
  The canonical reference is:
  *   **Hájek, A., & Nover, M. (2004). "Vexing Expectations". *Mind*, 113(450), 237–249.**

  They define the game almost exactly as you have: a St. Petersburg-style stopping time where the payoff alternates in sign and decreases in magnitude (when weighted by probability) such that the series is conditionally convergent.

  There is also a related variant called the **Altadena Game**, which modifies the payoffs slightly to create different divergence properties, and discussion by **Kenny Easwaran (2008)** on "Strong and Weak Expectations," which attempts to provide a formal salvage operation for these cases.

  ### 2. The Mathematical Verdict: Undefined, Not $-\ln 2$
  Your intuition that "a distribution doesn't come with an ordering attached" is the precise reason why standard probability theory refuses to assign this game an expected value.

  In measure-theoretic probability (the Kolmogorov framework), the expectation $E[X]$ is defined as the Lebesgue integral $\int X \, dP$. For a discrete random variable, this integral is well-defined **if and only if** the variable is absolutely integrable (i.e., $E[|X|] < \infty$).

  In your game:
  $$ E[|X|] = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot \left| \frac{(-1)^n 2^n}{n} \right| = \sum_{n=1}^{\infty} \frac{1}{n} = \infty $$
  Because the sum of absolute values diverges, the random variable is **not integrable**. In rigorous terms, the expectation **does not exist**.

  The value $-\ln 2$ is an artifact of imposing the natural ordering ($n=1, 2, 3\dots$) on the summation. As you noted, the Riemann Rearrangement Theorem allows us to reorder the outcomes of the sample space to make the sum converge to any real number $L$, or diverge to $\pm \infty$. Since the sample space $\Omega = \{H, TH, TTH, \dots\}$ is a set without an inherent algebraic ordering required for the definition of expectation, privileging the index $n$ is mathematically unjustified within the standard framework.

  ### 3. Comparison to St. Petersburg and Two-Envelope
  You asked how this relates to the familiar paradoxes. The distinction is sharp:

  *   **St. Petersburg Paradox:** The expectation is **properly divergent** to $+\infty$. The partial sums grow without bound in a single direction. The problem is that infinite utility is action-guidingly useless (or requires bounded utility functions to resolve).
  *   **Two-Envelope Paradox:** This usually stems from an **improper prior** (a probability distribution that sums to $>1$ or is uniform over an infinite range) or a failure of conditional expectation logic ($E[Y|X=x] > x$). It often implicitly relies on undefined expectations, but the paradox is usually framed as a dominance argument rather than a summation order problem.
  *   **The Pasadena Game:** The expectation is **undefined** (indeterminate). It does not point "up" or "down." It is arguably *worse* than St. Petersburg because St. Petersburg at least tells you the game is "very good" (if you can play it enough times), whereas Pasadena offers no directional guidance at all.

  ### 4. Does the Long-Run Average Rescue It?
  You asked whether looking at the long-run average payoff over many plays rescues the game. This is the appeal to the **Law of Large Numbers (LLN)**.

  *   **Strong Law of Large Numbers:** Requires $E[|X|] < \infty$. Since this condition fails, the SLLN does not apply.
  *   **Behavior of the Average:** If you simulate this game repeatedly, the running average of your payoffs will **not converge**. It will oscillate wildly. The variance is infinite, and the "noise" from the rare, massive payoff events never dampens out enough for the average to settle on $-\ln 2$ (or any other number).

  This was demonstrated empirically and theoretically in follow-ups to Hájek and Nover. The sample mean does not converge in probability to any constant. Therefore, a "frequentist" defense of the $-\ln 2$ value fails. You cannot say "if you play this a million times, you will average a loss of 69 cents per game." You might be up millions, or down millions, depending on whether a high-$n$ outcome occurred in that batch.

  ### 5. Is There a Settled Treatment?
  There is no consensus on a "value," but there is a consensus on the **diagnosis**: **Expected Utility Theory (EUT) breaks down here.**

  *   **The Standard View:** The gamble has no expected value. It is incomparable to a sure sum of money within standard EUT. You cannot rationally prefer $\$0$ to this game, nor the game to $\$0$, based on expectation alone.
  *   **Easwaran's "Weak Expectation":** Kenny Easwaran (2008) proposed distinguishing between *Strong Expectation* (the standard Lebesgue integral) and *Weak Expectation* (the limit of the average outcome in a long sequence). He argued that some games without strong expectations have weak expectations. However, for the Pasadena game, **even the weak expectation fails to exist** because the sample averages do not converge.
  *   **Principal Value:** Some mathematicians suggest taking the Cauchy Principal Value of the series, which corresponds to the natural ordering ($-\ln 2$). However, decision theorists generally reject this because it privileges the indexing of the states without decision-theoretic justification. Why should the order in which we *list* the possibilities matter to their *value*?

  ### 6. What Exactly Is The Phenomenon?
  You asked for a carving rather than a coinage. The phenomenon is a **failure of integrability due to conditional convergence.**

  It is distinct from a "failure of invariance under re-description." Re-description invariance usually refers to framing effects (e.g., describing an outcome as "90% survival" vs "10% mortality"). Here, the probability space and payoffs are fixed. The issue is that the **utility function is not bounded** and the **probability distribution does not decay fast enough** to make the utility integrable.

  It sits in a specific niche:
  1.  **Bounded Utility:** No paradox (Expectation exists).
  2.  **Unbounded Utility + Fast Decay:** No paradox (Expectation exists, e.g., St. Petersburg with log utility).
  3.  **Unbounded Utility + Slow Decay (One Sign):** St. Petersburg (Expectation is $\infty$).
  4.  **Unbounded Utility + Slow Decay (Alternating Sign):** **Pasadena Game** (Expectation is undefined).

  ### Summary
  You have reconstructed the **Pasadena Game**.
  *   **Name:** The Pasadena Game (Hájek & Nover, 2004).
  *   **Value:** Undefined (not $-\ln 2$).
  *   **Reason:** The random variable is not $L^1$ integrable; the expectation depends on the ordering of the sample space, which is not a property of the measure.
  *   **Long Run:** The sample mean does not converge; the LLN does not apply.
  *   **Status:** It represents a hard boundary for Expected Utility Theory. It shows that EUT cannot rank all lotteries, even those with well-defined probabilities and payoffs.

  If you want to read further, look for **Colyvan (2006)** on "No Expectations," and **Easwaran (2008)** on "Strong and Weak Expectations." You are correct that this is "strictly worse" than St. Petersburg in terms of decision-guidance, and the literature agrees with you.
