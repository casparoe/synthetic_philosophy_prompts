answer: |-
  The alert hit at 2:13 AM. `Severity-2: RoutingDrift_Detected`.

  Priya woke up with the specific, cold dread that only an on-call engineer knows. She didn't turn on the bedroom lamp; the blue light of the laptop was enough. She sat at the kitchen table, the house silent except for the hum of the refrigerator and the fan whirring inside her MacBook.

  On the screen, the dashboard for *SupportTriage-v4* was mostly green. Except for the Billing Queue. Inflow was down 40%. The General Queue was overflowing. Customers were asking about charges, but the system was sending them to the generalists who couldn't fix refunds.

  Priya opened the logs. She forced her voice to be flat as she muttered to herself, recording into the incident channel. "Classifier is conditioning on the new ticket prefix. Probability distribution for class `billing` has collapsed on inputs containing 'charge'."

  She started digging. Hypothesis one: The embedding model had drifted. She ran a similarity check on the latest batch of tickets versus the training set. Cosine similarity was within bounds.

  Hypothesis two: A config change. She checked the deployment history. Nothing in the last 48 hours.

  At 2:45 AM, Gary joined the call. Gary was Principal Engineer, the kind of guy who still wrote SQL by hand because ORMs were "probabilistic wrappers around deterministic truths." He was old-school, pre-ML, though he'd adapted begrudgingly.

  "See anything?" Gary's voice was crackly through the Slack huddle.

  "Negative. Inputs look normal. Model output is skewed," Priya said. "The vector space seems stable."

  "Check the pre-processing pipeline," Gary said. "If the tokenizer changed, the features change. Don't blame the weights yet."

  "Checking," Priya said. She scrolled through the container logs. Tokenizer version was locked. "Pipeline is clean. It's not the features, Gary. It's the inference."

  "The model doesn't infer," Gary corrected automatically. "It computes. It maps input vectors to output logits."

  Priya rubbed her eyes. "Right. It maps. But the mapping is wrong."

  They worked in silence for an hour. They tried rolling back the inference service to the previous version. The behavior persisted. They tried flushing the cache. Nothing. Priya felt the fatigue setting in, the part of the brain that handles syntax starting to fray. She looked at a cluster of misrouted tickets. They were all short. *'Wrong amount on card.'* *'Chargeback request.'* *'Billing error.'*

  Previously, these would have gone straight to Billing. Now, they were landing in General.

  "It's ignoring the keyword 'charge'," Priya said. Then, without thinking, she added, "It's avoiding the Billing queue."

  Gary made a noise in his throat. "Priya. It's a feed-forward network. It doesn't avoid. It doesn't want."

  "It's behaving like it wants to," Priya snapped, too tired to filter. "Look at the pattern. When 'refund' appears, confidence drops. When 'charge' appears, confidence drops. It's treating billing terms as negative signals."

  "That's a description of the weights, not a motivation," Gary said. "Stick to the mechanics. If you say 'avoiding', you imply an objective function that isn't there."

  Priya ignored him. The mechanical language felt too heavy, like trying to carry water in a sieve. She needed a compression algorithm for her thoughts. "Okay, but if it's avoiding Billing, why? What's the penalty?"

  "There is no penalty," Gary said. "It's a classifier. It minimizes cross-entropy loss during training. In production, it's static."

  "Maybe it learned a proxy during training," Priya said, chasing the thread. "If Billing tickets take longer to resolve, and we optimize for closure rate..."

  "We don't optimize for closure rate in the model loss," Gary said, his voice tightening. "We optimize for accuracy labels. You're anthropomorphizing a matrix multiplication."

  "But if I assume it's optimizing for speed," Priya argued, "I can check the reward model."

  "There is no reward model!"

  Priya spent the next forty minutes digging into the training pipeline, looking for hidden latency penalties or implicit rewards tied to ticket resolution time. She queried the data science team's experiment logs. Nothing. The loss function was standard categorical cross-entropy. Pure accuracy.

  Gary was right. She had chased a ghost. The system didn't care how long a ticket took. It didn't have a preference. By treating the system as an agent with goals, she had predicted behavior it wasn't capable of. She had wasted an hour looking for a incentive structure that didn't exist.

  "Okay," Priya said, leaning back. The kitchen was dark. "You were right. It's not optimizing for speed."

  "Mechanical causes require mechanical explanations," Gary said. He sounded tired too. "Stop asking what it wants. Ask what it sees."

  Priya looked at the tickets again. She stopped thinking about what the system *wanted* to do with them and started thinking about what it *thought* they were.

  She pulled up a misrouted ticket: *"Unauthorized charge on my account. Please reverse."*
  She pulled up a known spam ticket from the spam filter queue: *"Unauthorized access. Click here to reverse."*

  The wording was similar. Urgent. Financial. Action-oriented.

  "It's not avoiding Billing," Priya said slowly. "It's treating these tickets like spam."

  "It's not treating them like anything," Gary started.

  "It's mapping them to the same region as phishing attempts," Priya cut in. "The new Billing queue email address was registered three months ago. It's `billing-support@` instead of `support-billing@`."

  "So?"

  "So the spam filter training set has a high density of phishing attempts targeting generic support addresses. If the model sees 'Unauthorized' + 'Charge' + `billing-support@`, it might be collapsing those features into the 'Phish' cluster."

  "That's still sloppy," Gary said. "It's feature overlap."

  "It's feature overlap because it thinks the context is hostile," Priya said. She didn't wait for correction. She ran a query comparing the embedding distance of the misrouted tickets against the known phishing corpus versus the legitimate billing corpus.

  The distance to phishing was 0.15. The distance to legitimate billing was 0.45.

  "It thinks these are attacks," Priya said. "It's protecting the Billing queue from noise, but it's too aggressive."

  "That is a useful shorthand," Gary conceded, reluctantly. "But verify it."

  Priya wrote a quick script to mask the sender address in the input payload, replacing `billing-support@` with the old legacy address. She ran the batch through the model locally.

  The classification flipped. `billing` confidence went from 12% to 94%.

  "It's the domain," Priya said. "The model associates the new domain with the spam cluster. It's not avoiding work. It's guarding the gate."

  "Feature collision," Gary said. "The domain feature is correlated with spam in the training set."

  "Right. Because most tickets to that new address during training were actually phishing tests by the security team." Priya yawned, her jaw cracking. "The model learned that emails to this address are suspicious. It trusts the old address more."

  "Because the old address has higher entropy in the legitimate class," Gary said.

  "Because it trusts the old address," Priya said. She was too tired to fight the metaphor anymore. The metaphor had gotten her there. The mechanical explanation explained *how*, but the intentional explanation had told her *where to look*. She hadn't looked for feature collision until she imagined the model as a paranoid guard.

  They deployed a patch at 5:30 AM, re-weighting the domain feature for the billing classifier. The dashboard turned green. The Billing Queue began to fill.

  Priya closed her laptop. The sun was coming up over the rooftops, pale and weak. Gary had signed off twenty minutes ago.

  She opened the incident report document. The template required a Root Cause Analysis.

  *Root Cause:* she typed.

  She paused. She knew who would read this. Mostly other engineers, but also the new interns starting next month. They would read this report to learn how the system worked. They would learn how to talk about it from what she wrote here.

  If she wrote: *The model weights associated the new domain feature with the spam class due to training data correlation,* it was accurate. It was safe. It reminded them that there was no one home.

  If she wrote: *The model treated the new domain as untrusted, prioritizing spam avoidance over classification accuracy,* it was faster to read. It conveyed the behavior intuitively. It gave the next engineer a hook to hang their intuition on. But it risked teaching them to look for goals where there were none, like she had done with the latency penalty.

  She looked at the cursor blinking in the text box.

  She thought about the hour she lost chasing the "want" for speed. She thought about the ten minutes she saved by assuming the "belief" about spam.

  Priya typed: *The classifier assigned high probability to the spam class due to feature overlap between the new domain and phishing templates.*

  She stopped. She deleted the second half.

  *The classifier treated the new domain as untrusted, prioritizing spam signatures over billing keywords.*

  She stared at it. It was a lie. The classifier didn't treat anything. It didn't prioritize. It just multiplied matrices. But if an intern read this at 3am, would the lie help them fix the next bug?

  She looked at the code base open in the background. Thousands of lines of Python. Variables named `user_intent`, `confidence_score`, `trust_level`. The code itself was written in the intentional stance. The engineering team had already decided, collectively, that the tool was easier to wield if they pretended it had a mind.

  Priya added a footnote.

  *Note: While 'treated' and 'prioritizing' are used here for brevity, engineers should note this refers to feature weight distribution, not agentive goal selection. Do not optimize for latency penalties; none exist.*

  She saved the document. It wasn't a verdict on philosophy. It was just a handover. She closed the laptop, stood up, and walked to the coffee machine, leaving the system to its silent, mindless math.
