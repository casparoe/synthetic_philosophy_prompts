      *   *Decision Rule Conflict:*
          *   Credal Set for Event $E$: $P(E) \in \{0.3, 0.5, 0.7\}$. (Discrete set for simplicity).
          *   Bet X: Win 10 if $E$, Lose 10 if $\neg E$.
              *   EVs: $0.3(-4) + 0.7(10)$? No, $0.3(10) + 0.7(-10) = -4$. $0.7(10) + 0.3(-10) = 4$. Range $[-4, 4]$.
          *   Bet Y: Win 2 if $E$, Lose 1 if $\neg E$.
              *   EVs: $0.3(2) + 0.7(-1) = -0.1$. $0.7(2) + 0.3(-1) = 1.1$. Range $[-0.1, 1.1]$.
          *   *Maximin:* Bet Y (Min -0.1 > Min -4).
          *   *E-Admissible:* Bet X is optimal at $P=0.7$ (EV 4 vs 1.1). Bet Y is optimal at $P=0.3$ (EV -0.1 vs -4). Both admissible.
          *   *Interval Dominance:* Does Y dominate X? Lower Y (-0.1) > Lower X (-4). Upper Y (1.1) < Upper X (4). No dominance.
          *   *Need a stronger conflict.* Let's use the standard "Status Quo" vs "Gamble" setup.
          *   Option 0: Keep 0 tokens. (EV = 0).
          *   Option 1: Bet. Win 10 if $E$, Lose 10 if $\neg E$.
          *   Credal Set: $P(E) \in [0.4, 0.6]$.
          *   EV Range: $[-2, 2]$.
          *   Maximin: Reject Bet (Min EV -2 < 0).
          *   E-Admissible: Accept Bet (Optimal if $P(E)=0.6$).
          *   This creates a divergence on *whether to act*.

      *   *Dilation Setup:*
          *   Need the "Two Urn" trick.
          *   Urn 1 (Known): 1 Red, 1 Black.
          *   Urn 2 (Unknown): $p \in [0.2, 0.8]$. Represented by a "Credal Card" given to students.
          *   Event $M$: Colors Match.
          *   Prior $P(M)$: $0.5 \times p + 0.5 \times (1-p) = 0.5$. Interval $[0.5, 0.5]$.
          *   Evidence: Reveal Urn 1 is Red.
          *   Posterior $P(M | U1=R)$: This is now just $P(U2=R)$. Interval $[0.2, 0.8]$.
          *   Students calculate this. They see the interval grow from 0 to 0.6.

      *   *Tokens/Stakes:*
          *   Start with 100 tokens.
          *   End of class: Top team gets first pick of "prizes" (e.g., choice of essay topic, extra credit point, or just candy). Let's suggest "Course Credit Tokens" redeemable for minor perks.

  5.  **Addressing the "Honest Notes":**
      *   *What goes wrong:* Students will try to average the probabilities (collapsing the set). They will treat the set as a second-order probability. Arithmetic errors in EV calculation.
      *   *What's missing:* The *normative* force. Why *should* they act this way? The game forces the rule, but doesn't justify it. Also, the "set" is given exogenously, not derived from their own ignorance.

  6.  **Writing the Plan:**
      *   *Tone:* Professional, instructional, precise.
      *   *Structure:* Follow the prompt's requirements (Materials, Rules, Payoff, Timeline, Debrief, Notes).
      *   *Jargon Check:* Ensure terms like "Maximin," "Dilation," "E-admissibility" are banned during the game. Use "Safety Protocol," "Update Phase," "Opportunity Protocol."

  7.  **Final Review against Constraints:**
      *   12 students? Yes (4 teams of 3).
      *   2 hours? Yes (Timeline fits).
      *   No jargon during activity? Yes.
      *   3 Objectives met? Yes (Ambiguity felt, Rules diverge, Dilation happens).
      *   Honest notes included? Yes.

  8.  **Refining the Decision Rule Roles:**
      *   To ensure the divergence is clear, I will assign the Decision Rules to the teams explicitly as "Operating Protocols."
      *   Team 1: *Guardian Protocol* (Maximin).
      *   Team 2: *Venture Protocol* (E-Admissibility/Maximax).
      *   Team 3: *Arbiter Protocol* (Interval Dominance).
      *   Team 4: *Classic Protocol* (Single Probability/Mean).
      *   This ensures the divergence is structural, not just accidental.

  9.  **Refining Dilation:**
      *   Make sure the calculation is easy.
      *   Prior: Match Probability.
      *   Urn A: 50/50.
      *   Urn B: Range $[0.2, 0.8]$.
      *   Calculation: $0.5 \times p + 0.5 \times (1-p) = 0.5$.
      *   Update: Urn A = Red.
      *   New Prob: Prob(Urn B = Red) = $[0.2, 0.8]$.
      *   This is mathematically sound and easy to compute on a worksheet.

  10. **Final Polish:** Check the timing. 2 hours is tight for 2 rounds + debrief. Need to keep Round 1 snappy. Round 2 needs careful explanation. Debrief is crucial (30 mins).

      *(Self-Correction during drafting)*: Wait, if Team 4 uses a single probability (the mean), they won't experience dilation in the same way (their point estimate stays 0.5). This is actually a *good* contrast for the debrief. I will keep Team 4 as the "Bayesian Control."

