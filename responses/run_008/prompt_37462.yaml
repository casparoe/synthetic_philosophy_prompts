answer: |-
  # Activity Design: The Credal Casino

  **Session Length:** 120 Minutes
  **Participants:** 12 Students (4 Teams of 3)
  **Topic:** Imprecise Probabilities (Credal Sets, Decision Rules, Dilation)
  **Goal:** Experiential engagement with sets of probabilities, decision rule divergence, and dilation without initial jargon.

  ---

  ## I. Materials & Setup (10 Minutes Prep)

  **Physical Props:**
  1.  **Four "Agency Kits"** (One per team), each containing:
      *   1 Opaque Bag ("Urn A"): Contains 1 Red chip, 1 Black chip.
      *   1 "Credal Card" (Laminated): Displays a set of 5 probability values for "Red" in a second, hidden urn (Urn B).
          *   *Values:* $\{0.2, 0.3, 0.5, 0.7, 0.8\}$.
      *   1 "Ledger Sheet": For tracking tokens and calculations.
      *   1 "Protocol Card": Assigns the team's Decision Rule (see below).
  2.  **Token Economy:** 200 Poker chips or paper tokens per team (starting endowment).
  3.  **Projector/Board:** To display Bet Offers and Evidence.
  4.  **Prize:** A modest stake (e.g., "First choice of seminar paper topic" or a gift card).

  **Team Roles (within each 3-person team):**
  1.  **Actuary:** Holds the Credal Card. Calculates Expected Value (EV) ranges. Not allowed to share specific probabilities, only the resulting EV *interval*.
  2.  **Director:** Holds the Protocol Card. Decides which bet to take based *only* on the EV interval and the Protocol rules.
  3.  **Trader:** Holds the Tokens. Executes the bet and records the outcome.

  **The Protocols (Decision Rules):**
  *   **Team 1 (Guardian):** *Maximin.* You must choose the option with the highest **minimum** possible EV. (Risk-averse over the set).
  *   **Team 2 (Venture):** *E-Admissibility + Optimism.* You may choose any option that is optimal for **at least one** probability in your set. If multiple are eligible, choose the one with the highest **maximum** possible EV.
  *   **Team 3 (Arbiter):** *Interval Dominance.* You may only choose an option if its **minimum** EV is higher than the **maximum** EV of all other options. If no option satisfies this, you must abstain (Status Quo).
  *   **Team 4 (Classic):** *Precision.* You must calculate the **average** of the probabilities on your Credal Card and act as if that single number is the truth. (Bayesian Control).

  ---

  ## II. Timeline & Rules

  ### 0:00 – 0:15 | Introduction & Setup
  *   Distribute Agency Kits.
  *   Explain the Token Economy: Tokens are points. Highest score at the end wins the Prize.
  *   **Crucial Instruction:** "You do not know the true probability of Urn B. You only know the list of possibilities on your Credal Card. You must never average them unless your Protocol explicitly tells you to (Team 4). You must act according to your Protocol Card."
  *   Actuary verifies the Credal Card values: $P(Red) \in \{0.2, 0.3, 0.5, 0.7, 0.8\}$.

  ### 0:15 – 0:55 | Round 1: The Ambiguity Market
  **Objective:** Experience divergence in decision rules under imprecision.

  1.  **The Offer (0:15):** Project **Bet Option X** and **Bet Option Y**.
      *   **Status Quo:** Keep current tokens. (EV = 0).
      *   **Bet X:** Cost 10 tokens. If Urn B draws **Red**, win 30 tokens. If **Black**, win 0.
          *   *Net Payoff:* +20 (Red), -10 (Black).
      *   **Bet Y:** Cost 10 tokens. If Urn B draws **Red**, win 15 tokens. If **Black**, win 5.
          *   *Net Payoff:* +5 (Red), -5 (Black).
  2.  **Calculation Phase (0:25):**
      *   Actuaries calculate the EV range for each bet using the 5 probabilities on the Credal Card.
      *   *Math Check:*
          *   Bet X EVs: $0.2(20)+0.8(-10)=-4$; ... $0.8(20)+0.2(-10)=14$. Range: $[-4, 14]$.
          *   Bet Y EVs: $0.2(5)+0.8(-5)=-3$; ... $0.8(5)+0.2(-5)=3$. Range: $[-3, 3]$.
          *   Status Quo EV: $[0, 0]$.
  3.  **Decision Phase (0:35):**
      *   Directors confer with their team's logic.
      *   **Predicted Divergence:**
          *   *Guardian (Maximin):* Compares Mins: X(-4), Y(-3), SQ(0). **Chooses Status Quo.**
          *   *Venture (E-Admissible):* X is optimal at $p=0.8$ (EV 14). Y is optimal at $p=0.2$ (EV -3 vs -4). Both admissible. Tie-break (Maximax) picks **Bet X**.
          *   *Arbiter (Dominance):* Does Y dominate X? Min Y (-3) > Min X (-4). But Max Y (3) < Max X (14). No dominance. Does SQ dominate? Min SQ (0) > Min X (-4) and Min Y (-3). **Chooses Status Quo.** (Note: Arbiter often forces inaction).
          *   *Classic (Mean):* Mean $p=0.5$. EV X = 5. EV Y = 0. **Chooses Bet X.**
      *   Teams submit choices.
  4.  **Resolution (0:45):**
      *   Instructor draws from Urn B (pre-set to **Black** for dramatic effect on Bet X).
      *   Teams update token counts.
      *   *Result:* Venture and Classic lose tokens. Guardian and Arbiter preserve capital.
      *   *Discussion Point (Brief):* "Why did teams with the same information make different choices?" (Do not name the rules yet).

  ### 0:55 – 1:05 | Break & Reset
  *   Reset tokens to 100 for all teams (to neutralize luck for Round 2).
  *   Collect Bet Sheets.

  ### 1:05 – 1:35 | Round 2: The Dilation Trap
  **Objective:** Experience learning that widens uncertainty.

  1.  **The Setup (1:05):**
      *   Event $M$: "The color of Urn A matches the color of Urn B."
      *   Urn A is 50/50 (Red/Black). Urn B is the same Credal Set $\{0.2, \dots, 0.8\}$.
      *   Actuaries calculate $P(M)$.
      *   *Math:* $P(M) = P(A_R)P(B_R) + P(A_B)P(B_B) = 0.5(p) + 0.5(1-p) = 0.5$.
      *   **Result:** For all 5 probabilities, $P(M) = 0.5$. The Interval is $[0.5, 0.5]$. **Precision.**
  2.  **The Bet (1:15):**
      *   Offer a bet on $M$: Win 20 if Match, Lose 20 if No Match. (Fair bet at $p=0.5$).
      *   Ask teams: "Do you accept this bet?"
      *   Most should be indifferent or accept (EV = 0).
  3.  **The Evidence (1:20):**
      *   **Stop!** Do not resolve the bet yet.
      *   Instructor draws from **Urn A** publicly. Result: **Red**.
      *   This is public, costless evidence.
  4.  **The Update (1:25):**
      *   Actuaries must update the probability of $M$ (Match) given Urn A is Red.
      *   *Math:* $P(M | A_R) = P(B_R | A_R)$. Since urns are independent, this is just $P(B_R)$.
      *   **New Interval:** The Credal Card for Urn B is $\{0.2, 0.3, 0.5, 0.7, 0.8\}$.
      *   **Result:** The interval for $P(M)$ has exploded from $[0.5, 0.5]$ to $[0.2, 0.8]$.
  5.  **The Choice (1:30):**
      *   Ask teams: "Given this new information, do you still accept the bet?"
      *   *Guardian:* Min EV is now $0.2(20) + 0.8(-20) = -12$. **Reject.**
      *   *Classic:* Still sees $p=0.5$ (if they average). **Accept.**
      *   *Phenomenon:* Learning made the Guardian *less* willing to act, despite the evidence being irrelevant to the unknown urn.

  ### 1:35 – 2:00 | Debrief & Mapping
  **Objective:** Connect experience to formal epistemology.

  1.  **Reveal the Vocabulary (1:35 – 1:50):**
      *   Map "Credal Card" to **Credal Set / Representor**.
      *   Map "Guardian" to **$\Gamma$-Maximin**.
      *   Map "Venture" to **E-Admissibility**.
      *   Map "Arbiter" to **Interval Dominance**.
      *   Map Round 2's widening interval to **Dilation**.
  2.  **Guided Discussion (1:50 – 2:00):**
      *   *On Divergence:* "In Round 1, Team 1 and Team 2 had the exact same information. Why did they act differently?" (Elicit: Because rationality might not dictate a single choice under ambiguity).
      *   *On Dilation:* "In Round 2, you learned a fact (Urn A is Red) that was statistically independent of Urn B. Why did your uncertainty about Urn B increase?" (Elicit: Because the hypothesis 'Match' tied the two urns together; resolving one unties the cancellation effect).
      *   *On Normativity:* "Was the Guardian 'smarter' than the Venture team? Or just more cautious?" (Open floor).

  ---

  ## III. Honest Notes for the Instructor

  ### 1. What Will Predictably Go Wrong
  *   **Collapsing the Set:** Despite instructions, students (especially Team 4, but others too) will instinctively average the five probabilities on the Credal Card to get a single number ($0.5$). They treat the set as *second-order uncertainty* (ignorance about the true probability) rather than *imprecision* (no true single probability).
      *   *Mitigation:* During the Calculation Phase, circulate and check the Actuary's worksheet. If you see a single number, ask: "Which protocol allows you to delete the other four numbers?"
  *   **Arithmetic Failures:** Calculating 5 different EVs per bet in 10 minutes is prone to error.
      *   *Mitigation:* Provide a worksheet with the EV formula pre-filled, requiring only the substitution of $p$.
  *   **Role Collapse:** The "Director" will defer to the "Actuary" who sees the numbers.
      *   *Mitigation:* Enforce the rule that the Actuary can only report the *Interval* (e.g., "EV is between -4 and 14"), not the specific probabilities, to the Director.

  ### 2. What This Activity Cannot Reproduce
  *   **The Normative Source of the Set:** In the activity, the Credal Set is handed to them exogenously (on a card). The deep philosophical debate is whether a rational agent *generates* this set through their own ignorance (Levi) or whether it is a description of a group's disagreement (Seidenfeld). The game forces the set upon them, so it cannot simulate the *origin* of imprecision, only the *consequences*. You must supply this distinction in the debrief.
  *   **The "Cost" of Dilation:** In the game, dilation feels like a glitch or a trick. In formal theory, dilation is often criticized as a defect of the updating rule (Walley) or accepted as a necessary cost of preserving independence assumptions. The game makes dilation *visible*, but it cannot resolve whether dilation is a *bug* or a *feature*. You will need to articulate the Walley-Seidenfeld debate explicitly in the lecture following the activity.

  ---

  ## IV. Worksheet Snippet (For Actuary)

  **Credal Set (Urn B Red):** $\{0.2, 0.3, 0.5, 0.7, 0.8\}$

