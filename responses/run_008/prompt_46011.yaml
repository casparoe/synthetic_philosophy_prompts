answer: |-
  This is a sophisticated dispute that cuts to the heart of moral philosophy, specifically the literature on the **norms of blame** and **speech act theory**. You are arguing from a position of *propositional truth* (the content of the claim), while your friend is arguing from a position of *felicity conditions* (the authority required to perform the act).

  Here is the adjudication of the exchange, move by move, followed by an assessment of what is signal, what is noise, and what you are both missing.

  ### Move-by-Move Adjudication

  **(1) Friend: Blame is an address/demand; hypocrites forfeit standing (The Judge Analogy).**
  *   **Verdict:** **Friend is right about the nature of blame.**
  *   **Analysis:** Your friend correctly identifies that blame is not merely a constative utterance (stating a fact like "the sky is blue"); it is a performative speech act (like a judge sentencing a defendant). In philosophy, this is known as the **Standing Objection**. A bribed judge may pronounce a legally correct sentence, but the verdict is void because the judge lacked the authority to deliver it. Similarly, a hypocrite may state a true moral norm, but they lack the *moral authority* to demand compliance from another when they flout it themselves.
  *   **Work vs. Noise:** Real work. This sets the correct framework: blame is relational, not just informational.

  **(2) You: Content is untouched; hypocrisy is a separate wrong.**
  *   **Verdict:** **You are right about the truth, wrong about the act.**
  *   **Analysis:** You are correct that the proposition "texting while driving is wrong" remains true regardless of who says it. However, you are conflating *asserting a truth* with *blaming*. If I say, "You shouldn't steal," I am stating a norm. If I say, "I blame you for stealing," I am invoking a moral relationship. Your hypocrisy doesn't make texting safe, but it does make your *blame* infelicitous.
  *   **Work vs. Noise:** Noise in the context of blame. You are defending the truth of the rule, but the argument is about the legitimacy of the enforcement.

  **(3) Friend: "Look who's talking" works because blame carries authority.**
  *   **Verdict:** **Friend is right.**
  *   **Analysis:** This is a strong pragmatic argument. If blame were mere assertion (as you claim in Move 2), the *tu quoque* ("you do it too") would be a logical fallacy and emotionally inert. The fact that it functions as a "silencer" or a "sting" proves that we intuitively recognize blame requires standing.
  *   **Work vs. Noise:** Real work. It uses our shared linguistic intuitions to validate the theory in Move 1.

  **(4) You: "Look who's talking" registers a second fault; disclaimers ("I know I'm one to talk") work.**
  *   **Verdict:** **Mixed. The disclaimer point backfires.**
  *   **Analysis:** You argue that hypocrisy is just a "second wrong." This is weak; it treats moral conversation as a scorecard rather than a dialogue. However, your observation about disclaimers is keen—but it supports your friend, not you. The fact that we feel the need to say "I know I'm one to talk" acknowledges that we *lack standing* and are asking for a temporary pass.
  *   **Work vs. Noise:** The "two wrongs" part is noise. The disclaimer observation is signal, but you drew the wrong conclusion from it.

  **(5) Friend: Disclaimers work precisely because they concede the lack of authority.**
  *   **Verdict:** **Friend is right.**
  *   **Analysis:** This effectively neutralizes your Move 4. If ordinary blame required no standing, disclaimers would be unnecessary. The fact that we use them to *repair* the interaction proves that standing is the default requirement.
  *   **Work vs. Noise:** Real work. This is the pivot point where the Friend secures the argument.

  **(6) You: "Only the blameless may blame" silences everyone. Friend: Standing is local. You: The line is arbitrary.**
  *   **Verdict:** **Friend is right on the principle; You have a point on the boundary.**
  *   **Analysis:** Your *reductio ad absurdum* ("only the blameless may blame") is a common objection, but it fails because standing does not require *perfection*, only *non-hypocrisy regarding the specific norm*. A reformed smoker can blame a smoker; a current smoker cannot. Your counter-argument (that indifference to risk connects texting and lying) is philosophically interesting—it suggests standing might be about *integrity* rather than specific acts—but it is too broad for everyday moral practice. We generally grant local standing.
  *   **Work vs. Noise:** Your "silencing" argument is noise (a straw man). Your "arbitrary line" critique is signal, pointing to a deeper issue about moral integrity, but it doesn't overturn the local standing rule.

  ---

  ### Summary of Who Is Right About What

  *   **The Friend is right about the definition of blame.** Blame is not just noting a wrong; it is a demand for accountability that presupposes the blamer's own commitment to the norm. When you violate the norm you are enforcing, you undermine the legitimacy of the demand.
  *   **You are right about the truth of the moral claim.** Your flatmate texting while driving is objectively reckless, regardless of your behavior. The *wrongness of the act* is independent of the *blamer*.
  *   **The Friend is right about the social dynamic.** The sting of "look who's talking" and the necessity of disclaimers prove that standing is a real social currency.

  ### Signal vs. Noise

  *   **Real Work:** The distinction between **propositional truth** (is texting wrong?) and **speech act felicity** (do you have the right to blame me?). The Friend successfully argues that blame is a speech act that can "misfire" if the speaker lacks standing.
  *   **Noise:** Your argument that "two wrongs are separable." In moral dialogue, they are not separable because the hypocrisy undermines the *trust* required for the blame to be heard as constructive rather than aggressive. Also, your claim that this view "silences everyone" is noise; it confuses *hypocrisy* (violating the specific norm you are enforcing) with *sinlessness* (violating any norm anywhere).

  ### What You Are Both Missing

  There are three deeper layers to this dispute that neither of you fully articulated:

  **1. The Telos (Purpose) of Blame**
  You are treating blame as a verdict (like a judge), but in friendship, blame is often a **call for moral repair**.
  *   **Missing Insight:** Hypocritical blame fails not just because it lacks authority, but because it is **counterproductive**. When you blame your flatmate for texting while you do it, she cannot hear your concern for her safety; she only hears your aggression or self-righteousness. The *function* of blame (to restore moral balance) is broken by hypocrisy, even if the *content* is true.

  **2. The Distinction Between "Standing" and "Advice"**
  You can warn someone without blaming them.
  *   **Missing Insight:** If you had said, "Please don't text and drive, it's terrifyingly dangerous," you would have been offering advice or expressing fear. By framing it as *blame* ("That was selfish/reckless"), you invoked a hierarchy of judgment. You lost standing for the *judgment*, but you retained the right to express *concern*. The argument conflated blaming with caring.

  **3. The "Commitment" Condition**
  Your friend argues you need "clean hands." Philosophers like G.A. Cohen suggest you actually just need **commitment**.
  *   **Missing Insight:** You don't have to be perfect to have standing; you have to acknowledge the norm's authority over *you*. If you had said, "I know I text sometimes, and I'm working on stopping because it's wrong, but you need to stop too," you might retain standing. The forfeiture of standing comes from the *implication that the norm applies to them but not to you*, not merely from the fact that you have violated it.

  ### Final Ruling
  **The Friend wins the philosophical debate.** Blame requires standing, and hypocrisy forfeits it.
  **You win the moral urgency.** Texting while driving is dangerous, and someone needed to say something.

  **Resolution:** You were right to be concerned, but wrong to *blame*. Next time, express fear for their safety ("I get so scared when you text") rather than moral judgment ("You are selfish"). This bypasses the need for standing and centers the actual risk.
