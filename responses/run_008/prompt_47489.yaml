answer: |-
  # Desiderata for a Theory of Actual Infinity

  To adjudicate between finitism and Cantorian actualism, a theory must satisfy the following eight requirements. Each requirement includes the motivating case, a classification of its constraint status (Non-Negotiable vs. Camp-Specific), and an indication of where conceptual splits are required.

  ### 1. The Actual/Potential Demarcation
  *   **Requirement:** The theory must define "actual infinity" and "potential infinity" such that the distinction is metaphysical or logical, not merely verbal. It must specify whether "infinite totality" refers to an object existing *all at once* or a process proceeding *without end*.
  *   **Motivating Case:** The finitist's complaint that actualists beg the question by treating limits as objects.
  *   **Status:** **Non-Negotiable.** Without this, the debate is equivocal.
  *   **Conceptual Split:** *Existence Mode.* Distinguishes between *completion* (static totality) and *extendability* (dynamic procedure).

  ### 2. The Criterion of Equinumerosity (Galileo's Verdict)
  *   **Requirement:** The theory must select a primary criterion for "same size": either (A) One-to-One Correspondence (Hume's Principle) or (B) Proper Part implies Smaller Size (Euclid's Part-Whole Principle). It cannot maintain both for infinite collections.
  *   **Motivating Case:** Galileo's Paradox (Naturals vs. Perfect Squares).
  *   **Status:** **Camp-Specific Demand.**
      *   *Cantorian:* Requires (A).
      *   *Finitist/Neo-Fregean:* Requires (B).
  *   **Conflict:** (A) and (B) are logically incompatible for infinite sets.
  *   **Conceptual Split:** *Size.* Distinguishes *Cardinality* (pairing) from *Containment* (inclusion).

  ### 3. The Cardinality/Magnitude Separation
  *   **Requirement:** The theory must prevent cardinality (count) from collapsing into magnitude (measure/length). It must explain how two sets can be equinumerous yet have different measures, and restrict rearrangement principles where measure is relevant.
  *   **Motivating Case:** Finite segment vs. Infinite line (equinumerous, different length); Banach–Tarski Paradox (rearrangement violates measure conservation).
  *   **Status:** **Non-Negotiable** (for physical applicability). If cardinality licenses physical rearrangement without measure constraints, the theory fails physics.
  *   **Conceptual Split:** *Quantity.* Distinguishes *Discrete Count* from *Continuous Measure*.

  ### 4. Conservation in Rearrangement (Hilbert's Verdict)
  *   **Requirement:** The theory must state whether shifting members of an infinite set (e.g., Hotel guests $n \to n+1$) creates, destroys, or merely re-indexes entities. It must account for the conservation of ontological units.
  *   **Motivating Case:** Hilbert's Hotel (Every room occupied $\to$ Every room free).
  *   **Status:** **Camp-Specific Demand.**
      *   *Actualist:* Re-indexing (no creation/destruction).
      *   *Finitist:* Impossible operation (implies contradiction in conservation).
  *   **Conflict:** If Part-Whole holds (Req 2B), shifting guests to free a room violates conservation of "fullness."

  ### 5. Supertask Determinacy
  *   **Requirement:** The theory must specify whether a physical system undergoing an infinite sequence of operations in finite time yields a definite final state. It must distinguish between mathematical limits and causal outcomes.
  *   **Motivating Case:** Thomson's Lamp (On/Off undefined at $t=1$); Collision Supertask (Energy/Momentum conservation vs. disappearance).
  *   **Status:** **Non-Negotiable** (for physics consultation). A theory that posits actual infinities must say if they are physically completable.
  *   **Conflict:** Standard Analysis (limits exist) vs. Causal Closure (no last cause).
  *   **Conceptual Split:** *Completion.* Distinguishes *Mathematical Limit* from *Physical Termination*.

  ### 6. Probabilistic Normalization (The Lottery)
  *   **Requirement:** The theory must resolve the trilemma of Infinite Lotteries: (A) Countable Additivity, (B) Uniformity (every ticket equally likely), (C) Normalization (probabilities sum to 1). At least one must be abandoned.
  *   **Motivating Case:** Countably infinite tickets with equal chance.
  *   **Status:** **Camp-Specific Demand.**
      *   *Standard Measure Theory:* Drops Uniformity (prob = 0 for each).
      *   *Non-Standard Analysis:* Drops Countable Additivity (hyperreals).
      *   *Finitism:* Drops the setup (no infinite tickets).
  *   **Conflict:** (A) + (B) + (C) is mathematically impossible.

  ### 7. Temporal Asymmetry (Past vs. Future)
  *   **Requirement:** The theory must adjudicate whether a beginningless past is ontologically equivalent to an endless future. It must address "traversability" in reverse.
  *   **Motivating Case:** Kalam Cosmological Argument (Past must be finite to be traversed; Future can be potentially infinite).
  *   **Status:** **Camp-Specific Demand.**
      *   *B-Theory/Actualist:* Past and Future are symmetric totalities.
      *   *A-Theory/Potentialist:* Past is fixed (actual), Future is open (potential).
  *   **Conflict:** If the past is an actual infinite, traversal arguments apply; if potential, they do not.

  ### 8. Physical Consultancy Constraint
  *   **Requirement:** The theory must provide a decision procedure for when physics is permitted to posit an infinite quantity (e.g., singularities, infinite space) versus when it signals a breakdown of the model.
  *   **Motivating Case:** Renormalization in QFT; Singularities in General Relativity.
  *   **Status:** **Non-Negotiable.** This is the definition of "adequacy" provided in the prompt.

  ---

  # Meta-Analysis of the Desiderata

  ### Incompatible Pairs and Necessary Splits
  1.  **Req 2 (Equinumerosity):** You cannot jointly satisfy One-to-One Correspondence and the Part-Whole Principle for infinite sets.
      *   *Split:* **Cardinality** (pairing-based) must be split from **Inclusion-Magnitude** (part-based). Cantorian actualism chooses Cardinality; Finitism chooses Inclusion.
  2.  **Req 6 (Lottery):** You cannot jointly satisfy Countable Additivity, Uniformity, and Normalization.
      *   *Split:* **Probability** must be split into *Standard Measure* (Additivity + Normalization, no Uniformity) or *Non-Standard/Finite Additivity* (Uniformity + Normalization, no Countable Additivity).
  3.  **Req 3 & 4 (Measure vs. Rearrangement):** Banach-Tarski shows that if you allow arbitrary rearrangement of equinumerous points (Req 2A), you violate measure conservation (Req 3).
      *   *Split:* **Mathematical Existence** must be split from **Physical Instantiation**. A set can exist mathematically while being forbidden as a physical substrate.

  ### Non-Negotiable vs. Camp-Specific Constraints
  *   **Non-Negotiable:** Req 1 (Demarcation), Req 3 (Card/Measure Split), Req 5 (Supertask Verdict), Req 8 (Physical Consultancy). These are required for the theory to be *intelligible* and *useful*.
  *   **Camp-Specific Dressed as Constraints:**
      *   **Req 2 (Part-Whole):** Demanding the Part-Whole principle hold for infinite sets is a Finitist demand. Demanding Bijection hold is a Cantorian demand. An adequate theory need not pick one *a priori*, but it must *choose* one to be complete.
      *   **Req 6 (Uniformity):** Demanding a uniform probability on $\mathbb{N}$ is a demand of intuitive symmetry, not standard mathematics.
      *   **Req 7 (Temporal Asymmetry):** Demanding the past differs from the future is an A-Theory/Potentialist demand.

  ### The Most Exclusionary Requirement
  **Req 5 (Supertask Determinacy)** excludes the most otherwise-plausible contenders.
  *   *Reasoning:* Many mathematical theories (Standard ZFC Set Theory) are agnostic about physical completion. They define the limit but do not claim a physical system can reach it. A theory adequate for *physics* (per the prompt's definition of adequacy) must take a stand on whether the limit is causally accessible.
  *   *Exclusions:* This excludes "Shut up and calculate" instrumentalism, standard ZFC (without physical interpretation), and vague potentialism that refuses to define the "end" of a process. It forces the theory to be a metaphysics of nature, not just a logic of sets.

  ---

  # Brief Scorecard

  | Theory | Req 1 (Demarcation) | Req 2 (Size) | Req 3 (Measure) | Req 5 (Supertasks) | Req 6 (Lottery) | Req 7 (Time) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Strict Finitism** | **Pass.** Denies actual infinity entirely. | **Pass.** Part-Whole holds (no infinite sets). | **Pass.** No infinite magnitudes. | **Pass.** Supertasks impossible. | **Pass.** No infinite lotteries. | **Pass.** Past must be finite. |
  | **Cantorian Actualism** | **Pass.** Actual infinities exist as sets. | **Pass.** Bijection holds (Part-Whole fails). | **Pass.** Measure theory separates size/length. | **Fail/Partial.** Mathematically defined, physically agnostic. | **Fail.** Must drop Uniformity or Additivity. | **Fail.** Treats past/future symmetrically (B-Theory). |
  | **Potentialist Set Theory** | **Pass.** Sets are always extendable. | **Pass.** Part-Whole holds (sets never completed). | **Pass.** Magnitudes always finite/approximated. | **Pass.** No last stage, no final state. | **Pass.** Probabilities always conditional on finite stage. | **Pass.** Past fixed, future open. |

  **Notes on Scoring:**
  *   **Finitism** scores highest on physical intuition (Req 5, 7) but fails to model standard analysis without cumbersome workarounds (Req 8).
  *   **Cantorian Actualism** scores highest on mathematical utility (Req 2, 3) but requires "conceptual splits" to avoid physical paradoxes (Req 4, 5, 6).
  *   **Potentialism** offers a middle ground but struggles to formalize the "limit" without smuggling in actualism (Req 1, 8).
