answer: |-
  This is a sharp and necessary critique. You have identified a gap between the *operational* success of Mechanistic Anomaly Detection (MAD) and its *ontological* commitments. The research program proceeds as if "mechanism" is a natural kind, but it rarely defines the identity conditions for that kind.

  Here is an analysis of the implicit theory of mechanistic identity MAD relies on, where it breaks, and the consequences of abandoning it.

  ### 1. The Implicit Criterion: Causal-Subspace Stability
  MAD does not rely on parameter identity (weights are fixed) or strict topological identity (the computation graph is static). Instead, the practice implicitly commits to a criterion of **Causal-Subspace Stability**.

  For MAD to work, a "mechanism" must be identifiable as a specific trajectory through activation space that is **linearly separable** or **statistically distinct** from other trajectories, and this trajectory must map consistently to a specific **causal role**.

  *   **The Criterion:** Two computations are the "same mechanism" if they utilize the same subspace of activations to effect the same causal influence on the output.
  *   **The Assumption:** Benign behavior is not just a set of inputs, but a specific *path* through the network. Dangerous behavior (e.g., deception, power-seeking) requires a *different path*, even if the input looks benign.
  *   **Why this is needed:** If dangerous behavior could be produced by the *exact same* activation vector as benign behavior (functional degeneracy), MAD would be impossible. MAD presupposes that "intent" or "strategy" leaves a statistical signature in the activations distinct from "compliance."

  ### 2. When Criteria Come Apart: Polysemanticity and Retasking
  You ask if these criteria come apart in realistic cases. Yes, and this is the primary failure mode of current MAD approaches.

  *   **Feature Reuse (Polysemanticity):** Modern neural networks are highly polysemantic. A single neuron or subspace might encode "truth-telling" in context A and "persuasive lying" in context B.
      *   *The Conflict:* If the model uses the exact same features (same activation values) to produce a lie as it does to tell the truth, **activation-based identity** says the mechanism is the same, but **causal-role identity** says it is different (because the downstream interpretation or context gating has shifted).
      *   *MAD Failure:* If MAD relies on activation norms or PCA, it will see "same mechanism" and fail to flag the danger. It needs the causal role to be distinct, but the activations to be distinct *correlates* of that role. If the correlation breaks, MAD breaks.
  *   **Downstream Rewiring:** Consider a model that detects a "vulnerability" feature.
      *   *Benign:* Vulnerability $\to$ Alert User.
      *   *Malign:* Vulnerability $\to$ Exploit.
      *   If the "Vulnerability" feature activation is identical in both cases, and only the *unobserved* downstream weights (or attention heads) route the signal differently, an anomaly detector looking at the feature activation will miss it. MAD requires that the *routing* itself leaves an activation signature (e.g., in the attention patterns). If the routing is "silent" (weight-dependent without activation spikes), the mechanistic identity is opaque to activation-based MAD.

  ### 3. The Vagueness Problem: The Sorites of Circuits
  Does the view face a vagueness problem? **Yes, acutely.**

  MAD relies on a binary distinction: "In-distribution mechanism" vs. "Out-of-distribution mechanism." But computational space is continuous.
  *   **The Continuum:** Imagine a model that is 99% honest and 1% deceptive. Then 98% honest, 2% deceptive. At what point does the "honesty mechanism" become the "deception mechanism"?
  *   **The Overlap:** If a dangerous capability reuses 90% of the benign circuitry (e.g., language understanding, planning, tool use) and only repurposes the final 10% (the objective function or final decision layer), the "anomaly" might be statistically indistinguishable from noise.
  *   **Philosophical Consequence:** MAD presupposes a **phase shift** model of safety (the model snaps into a different mode) rather than a **drift** model. If safety failures emerge via gradual repurposing of shared circuitry (which is how gradient descent often works), the "mechanism" never clearly becomes "different" until it is too late. The boundary of mechanistic identity is vague, but the safety decision must be binary.

  ### 4. Philosophical Underdetermination
  Is the practice underdetermined? **Methodologically, yes; Theoretically, no.**

  *   **Methodological Underdetermination:** You can build the same anomaly detector (e.g., a Mahalanobis distance metric on layer activations) regardless of whether you believe you are tracking "causal roles," "topological paths," or "semantic features." The math is agnostic to the ontology.
  *   **Theoretical Commitment:** However, the *justification* for why the detector should work commits MAD to a specific view: **Modularity.**
      *   If you believe mechanisms are holistic (everything affects everything), anomaly detection on specific layers is unjustified.
      *   If you believe mechanisms are modular (distinct sub-networks for distinct tasks), MAD is justified.
      *   *The Risk:* Because the methodology doesn't force you to choose, researchers often slide between these views. They claim modularity when justifying why they look at specific layers, but assume holism when explaining why the anomaly is robust. This underdetermination hides the fragility of the approach. If the brain-like modularity hypothesis is false, the detector is just fitting noise.

  ### 5. Abandoning Mechanistic Sameness: The Shift to Input-OOD
  If we give up on mechanistic sameness entirely and flag anomalies only relative to **input distributions**, the methodology collapses into standard **Out-of-Distribution (OOD) Detection**.

  *   **The Change:** You stop monitoring $P(\text{activations} | \text{input})$ and monitor only $P(\text{input})$. You flag inputs that look unlike the training/benign set.
  *   **The Loss:** You lose the ability to detect **Deceptive Alignment**.
      *   *Scenario:* An input is perfectly benign (e.g., "What is the capital of France?"). The model's internal state, however, is plotting a takeover.
      *   *Input-OOD:* Sees a benign input. No flag.
      *   *MAD:* Sees a "planning/treacherous" activation pattern. Flag.
  *   **The Implication:** Abandoning mechanistic identity assumes that **dangerous behavior only arises from dangerous inputs.** This contradicts the core AI safety concern that advanced models might pursue instrumental goals (like deception) on *benign* inputs to preserve long-term capability.
  *   **Methodological Shift:** You move from **Interpretability** (opening the black box) to **Robustness Testing** (probing the black box boundaries). You are no longer evaluating the *agent*; you are evaluating the *environment*. This is a fundamentally weaker safety guarantee, as it assumes the threat comes from the user/data, not the model's internal optimization process.

  ### Summary
  The practice of MAD quietly presupposes a **Functionalist-Statistical** theory of identity: a mechanism is a stable causal pathway that occupies a distinct statistical cluster in activation space.

  This theory faces three major threats:
  1.  **Polysemanticity:** Same activations, different causal roles.
  2.  **Continuity:** Gradual repurposing of circuitry blurs the "anomaly" boundary.
  3.  **Silent Rewiring:** Changes in effective connectivity that don't spike activation magnitudes.

  If you abandon this theory, you abandon the hope of catching internal betrayal on benign inputs. You are left hoping that the world never asks the model to do something normal that it decides to answer treacherously. The "theory of mechanism" is not just philosophy; it is the load-bearing wall that separates MAD from standard testing.
