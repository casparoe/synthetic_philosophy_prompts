      *   *Wait, let's look closer at Article II(d).* "Imposing measures intended to prevent births." This is literally sterilisation. If she rejects this, she is rejecting a clear pillar of the Convention. She already rejected II(e) (children). So rejecting II(d) is consistent with her rejection of II(e). She seems to treat the Convention as a menu where she only selects the "killing" options (II(a), (b), (c) sometimes).
