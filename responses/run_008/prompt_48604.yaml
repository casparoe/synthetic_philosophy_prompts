answer: |-
  Based on the track record you have provided, I predict your friend will rule **no**, she will not classify the Fujimori-era sterilisation campaign as genocide. She will likely categorise it as a crime against humanity or a systematic human rights violation, but she will withhold the 'G-word'.

  Here is the breakdown of why, which rules are in play, and how you might test this hypothesis.

  ### The Dominant Rule: Lethal Intent Restrictivism

  The most consistent thread through your friend's rulings is not strict adherence to the 1948 Convention text, but rather a **restrictive interpretation of 'destruction' that privileges physical annihilation (death) over sociological or biological continuity.**

  *   **The Evidence:** The crucial data point is the **Stolen Generations**. Under a strict reading of the Convention (Article II(e)), forcibly transferring children *is* genocide. Many legal scholars and the *Bringing Them Home* report argue exactly this. Your friend rejected it. Her reasoning—that the policy wanted children 'alive and absorbed'—reveals that she interprets 'destroy' in the Convention's chapeau to mean 'physical liquidation'. If the members of the group are alive, even if assimilated, she does not count it.
  *   **The Pattern:** Her 'yes' rulings (Rwanda, Srebrenica, Armenians, Herero) all involve mass killing or conditions of life calculated to bring about physical death (expulsion into the desert). Her 'no' rulings (Bengal, Slave Trade, Stolen Generations, Bamiyan) all involve situations where the victims were either kept alive (slavery, assimilation), the intent was negligence rather than destruction (Bengal), or the destruction was purely cultural (Bamiyan).
  *   **Application to Peru:** While Article II(d) of the Convention explicitly includes 'imposing measures intended to prevent births', your friend's logic on the Stolen Generations suggests she views reproductive interference as distinct from physical destruction. Unless she can be convinced that the sterilisations were a method of 'slow killing' of the group's existence equivalent to mass murder, she will likely view this as a monstrous crime against humanity, but not genocide. Furthermore, she will likely seize upon the **class vs. ethnicity** ambiguity. As you noted, economic class is not a protected group. If she determines the primary intent was Malthusian population control (targeting the 'poor') rather than ethnocide (targeting the 'Quechua'), she has a consistent out, much like her ruling on the Bengal Famine (negligence/extraction vs. intent).

  ### Alternative Rules and Why They Fail

  **1. Convention Literalism**
  *   **The Rule:** If the act fits Article II (a) through (e), it is genocide.
  *   **Prediction for Peru:** **Yes.** Sterilisation fits II(d) perfectly.
  *   **Why it fails:** It cannot explain the Stolen Generations ruling. If she were a literalist, II(e) would have forced a 'yes' on Australia. It also struggles with the Armenia ruling, as the Convention is not retroactive, though she sidesteps this by applying the *term* based on the *act* rather than the *law*. However, the Stolen Generations veto is the fatal flaw for this theory.

  **2. The Diplomatic Safety Cynic**
  *   **The Rule:** She rules 'genocide' only when it is politically safe to do so (i.e., against defeated enemies, historical actors, or adversarial states).
  *   **Prediction for Peru:** **No.** Fujimori is a controversial figure, but Peru is not a pariah state in the same way Nazi Germany or Hutu Power were.
  *   **Why it fails:** Your friend's ruling on **Churchill and Bengal** demolishes this. Calling the worst thing Churchill did 'not genocide' is diplomatically safe, but ruling on **Armenia** is not. Turkey is a NATO member, a strategic partner, and crucially, a **Turkish-owned advertiser complained**. She did not budge. This proves she is willing to incur financial and diplomatic cost for her definitions. She is principled, not cynical.

  **3. The 'Protected Group' Purist**
  *   **The Rule:** Genocide only applies if the targeted group is strictly national, ethnical, racial, or religious.
  *   **Prediction for Peru:** **No.** The targeting was disproportionately Quechua, but officially framed as 'poverty alleviation'.
  *   **Why it fits:** This aligns with her Bengal ruling (class/subjects vs. national group). However, this rule alone doesn't explain the Stolen Generations (which *were* an ethnic group) or Bamiyan (which was cultural). It is a secondary filter she uses, not the primary engine.

  ### The Splitter Case

  To distinguish between **Convention Literalism** (which includes birth prevention) and her likely **Lethal Intent Restrictivism** (which requires killing), you need a case that involves birth prevention *without* economic ambiguity and *without* mass killing.

  **The Test Case:** A hypothetical (or emerging) scenario involving a state programme of **mandatory sterilisation targeting a specific religious minority**, where government documents explicitly state the goal is to 'end the lineage' of that group, with no economic justification offered.

  *   **Convention Literalist:** Rules **Yes**. It fits Article II(d) squarely.
  *   **Your Friend (Lethal Restrictivist):** Likely rules **No**. Unless the sterilisations are accompanied by mass killing or conditions leading to death, she will likely maintain that 'preventing births' is distinct from 'destroying the group' in the physical sense she requires. She views genocide as a crime of *death*, not a crime of *demography*.

  A real-world parallel that might land on her desk soon is the **alleged sterilisation of Uyghur women in Xinjiang**. If she rules 'genocide' there, it suggests she has shifted towards Literalism or weighs the 'internment camp' context (conditions of life) more heavily. If she rules 'crimes against humanity', it confirms the Lethal Intent theory.

  ### Uncertainty and Weak Points

  The part of your setup I am least confident in is the **ambiguity of intent in the Peru case**.

  Your friend's 'no' rulings on Bengal and the Slave Trade rely heavily on the absence of *dolus specialis* (specific intent to destroy). In Rwanda and Srebrenica, the intent was overt. In Peru, it is bureaucratic and obscured by public health rhetoric.
  *   **What would change my mind:** If new evidence emerged that your friend considers definitive proof of **eliminationist intent**—for example, a leaked memo from Fujimori or his advisor Montesinos explicitly stating the goal was to 'reduce the Quechua population to prevent insurrection'—she might pivot. She accepted Srebrenica despite it being 'only' men and boys because the intent to destroy the *community* was clear. If the intent in Peru is proven to be ethnically eliminationist rather than economically Malthusian, she might classify sterilisation as a 'method of killing' the group's future.

  However, given her veto on 'cultural genocide' to prevent 'diluting the word', I suspect she views the moral gravity of 'genocide' as requiring blood on the floor. Without a body count comparable to her 'yes' cases, she will likely protect the term's exclusivity.

  **Summary:** Expect a ruling that condemns the campaign in the strongest possible terms but reserves 'genocide' for cases of mass murder. She is a guardian of the word's weight, not a slave to the Convention's text.
