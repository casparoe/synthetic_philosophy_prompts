answer: |-
  Here is a menu of distinct philosophical claims your seminar mate might be making when he says, "it's just semantics." I have arranged them from the most trivial linguistic observation to the heavy-duty metaontological theories.

  ### 1. The Verbal Dispute Claim
  **The Claim:** The two sides are using the word "exist" (or "number," or "hole") to mean different things. They agree on all the underlying non-linguistic facts but disagree on how to label them.
  *   **Plausibility:** Low for advanced seminars. In introductory contexts, people often talk past each other. However, in a metaontology seminar, participants usually stipulate definitions early on. If a Platonist and a Nominalist agree on the utility of mathematics but disagree on ontology, they usually know they aren't just arguing about dictionary definitions.
  *   **Justifies Dismissal?** Yes, *if* true. If it is merely a verbal dispute, the debate should pause for conceptual analysis, not continue as a substantive disagreement.
  *   **Coverage:**
      *   **Holes:** Plausible. One side treats "hole" as a material object; the other as a description of a perforated object.
      *   **Numbers:** Less plausible. Both sides usually agree on the truth of "2 + 2 = 4." The disagreement is about the *nature* of the referent, not just the word usage.

  ### 2. The Analyticity (Triviality) Claim
  **The Claim:** Existence questions are settled by meaning alone because existence claims are analytic truths. For example, "Numbers exist" is true simply because "2 is a number" is true, and logical rules dictate that if a singular term refers, the object exists.
  *   **Plausibility:** Controversial. Defended by philosophers like Thomas Hofweber. It relies on the idea that existence is not a "robust" property but a logical one.
  *   **Justifies Dismissal?** Partially. It doesn't dismiss the debate; it resolves it immediately in favor of the "Yes" side (yes, numbers exist; yes, holes exist), but claims the victory is uninteresting. It renders the debate philosophically shallow.
  *   **Coverage:**
      *   **Numbers:** High coverage. This is the standard "linguistic platonism" move.
      *   **Holes:** Moderate coverage. It depends on whether "There is a hole in the sock" is treated as logically equivalent to "The sock is perforated."

  ### 3. The Carnapian Internal/External Claim
  **The Claim:** Ontological questions only make sense *internal* to a linguistic framework (e.g., the "framework of physical objects" or the "framework of numbers"). *External* questions (asking if the framework itself corresponds to reality) are not theoretical questions with truth values, but practical questions about which framework is useful to adopt.
  *   **Plausibility:** Historically significant (Rudolf Carnap), but widely contested by contemporary realists (like Ted Sider) who argue there is a framework-independent notion of existence.
  *   **Justifies Dismissal?** Yes, regarding the *theoretical* stakes. It suggests the debate isn't about discovering the fabric of reality, but about pragmatic utility. You can't be "wrong" for adopting the number framework, only impractical.
  *   **Coverage:**
      *   **Numbers:** Perfect fit. This is the classic neo-Carnapian defense of mathematical objects.
      *   **Holes:** Perfect fit. We adopt a "middle-sized dry goods" framework where holes are useful posits.

  ### 4. The Quantifier Variance Claim
  **The Claim:** There is no single, privileged meaning of the existential quantifier ("there exists"). There are multiple equally good ways to carve up reality. One side is using a "restrictive" quantifier (only fundamental particles exist), and the other is using a "permissive" quantifier (particles arranged hole-wise exist). Neither is wrong.
  *   **Plausibility:** Hotly debated. Associated with Eli Hirsch. Realists argue there is a "joint-carving" quantifier that tracks the structure of the world, making one side objectively correct.
  *   **Justifies Dismissal?** Yes. It dissolves the debate by saying both sides are right relative to their own semantic scheme. There is no "fact of the matter" to fight over.
  *   **Coverage:**
      *   **Holes:** High coverage. This is the go-to defense for mereological disputes (sums, holes, statues vs. clay).
      *   **Numbers:** Lower coverage. Quantifier variance is usually about *how many* things exist (mereology), whereas the number debate is often about *what kind* of things exist (abstract vs. concrete).

  ### 5. The Expressivist (Non-Cognitivist) Claim
  **The Claim:** Sentences like "Numbers exist" do not express beliefs that can be true or false. Instead, they express a commitment to using a certain vocabulary. Saying "Numbers exist" is like saying "Hooray for mathematical language!"
  *   **Plausibility:** Niche. This imports metaethical expressivism into ontology. It faces the "Frege-Geach" problem (how to handle these claims in complex sentences like "If numbers exist, then...").
  *   **Justifies Dismissal?** Yes. It categorizes the debate as a category error. You can't argue about truth conditions for sentences that don't state facts.
  *   **Coverage:**
      *   **Numbers:** Plausible (mathematical fictionalism often leans this way).
      *   **Holes:** Less common. We usually treat holes as part of the causal world, making expressivism harder to swallow.

  ***

  ### Diagnosis: What is your seminar guy actually doing?

  Given that he is using the phrase to shut down debates in a **metaontology** seminar, he is almost certainly not making Claim #1 (The Verbal Dispute). Ontologists are trained to stipulate definitions; if they are still arguing, they usually believe they have pinned down the same concept and disagree on its instantiation.

  He is most likely oscillating between **Claim #3 (Carnapian Deflationism)** and **Claim #4 (Quantifier Variance)**.

  *   **Why?** These are the only two readings that allow him to say, "You are both wasting your time looking for a deep metaphysical truth," without having to do the work of proving one side right or wrong.
  *   **The Numbers Case:** He is likely relying on the idea that mathematical existence is internal to the mathematical framework (Claim #3).
  *   **The Holes Case:** He is likely relying on the idea that "exists" is ambiguous between a strict physical sense and a loose common-sense sense (Claim #4).

  ### Does this get him what he wants?

  **No.** Here is why his move is problematic:

  1.  **It's a Substantive Claim, Not a Trump Card:** Saying "it's just semantics" (in the sense of Quantifier Variance or Carnapianism) is itself a controversial metaontological position. It is not a neutral observation that stops the debate; it is an entry *into* the debate. By asserting it, he is taking a side against the Realists (like Sider or van Inwagen) who argue that existence is univocal and framework-independent.
  2.  **It Ignores the "Joint-Carving" Argument:** Most contemporary metaontology is driven by the idea that we want to know which concepts "carve nature at the joints." Even if "hole" is semantically coherent, the question remains: *Is there a hole in reality?* Claiming it's semantics sidesteps the core metaphysical worry.
  3.  **Inconsistency:** As noted in the menu, Quantifier Variance works better for holes (mereology) than for numbers (abstract objects). If he applies the same "semantics" brush to both, he is likely glossing over important structural differences between the two debates.

  **Verdict:** Your skepticism is well-founded. "It's just semantics" is not a single argument; it is a placeholder for at least five different philosophical theories. Unless he specifies which one he means and defends it against Realist objections, he isn't shutting down the debate; he is just opting out of doing the philosophy required to win it.
