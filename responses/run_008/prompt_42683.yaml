  A guy in my metaontology seminar keeps shutting down debates with "it's just semantics." Most recently he used it on the question wether numbers exist, and then again on whether holes exist — one side said obviously yes, there's a hole in my sock, and the other said holes are absences, and an absence isn't anything at all. I'm a bit sceptical that the phrase means just one thing. Can you lay out the distinct precise claims "it's just semantics" could be making, as a menu — starting with the fairly trivial reading that the two sides mean different things by the key term and are simply talking past each other, through to the serious metaontological readings, like that existence questions are settled by meaning alone, or that they're internal to some framework and only make sense within it — and for each reading say whether it's plausible, and whether it would actually justify dismissing the debate rather than resolving it on the merits? Also flag which readings would cover the numbers case but not the holes case, or the other way round, and finish by telling me which reading the seminar guy most likely has in mind and whether it gets him what he wants. Please write the answer in American English.
