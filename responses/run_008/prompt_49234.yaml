answer: |-
  This is a classic "spec vs. implementation" problem. You're looking for a deterministic function `is_alive(entity)`, but your girlfriend is working with a legacy codebase where the "spec" is emergent behavior, not a hardcoded boolean. In biology, definitions are often *operational* (what do we do with it?) rather than *ontological* (what is it?).

  Based on her track record, I can reverse-engineer her internal logic, predict her verdicts on your three cases, and offer you a single "killer query" that actually forces a segmentation fault in her definition.

  ### 1. Reverse-Engineering Her Logic

  You've tested three main candidate rules. Let's run them against her dataset:

  *   **Rule A: Metabolism (Active energy processing).**
      *   *Fail:* She calls frozen embryos and endospores "alive." They have zero metabolism while frozen.
  *   **Rule B: Darwinian Evolution (Capacity to evolve).**
      *   *Fail:* She calls mules and worker bees "alive." They are evolutionary dead ends individually. (Unless you argue they belong to an evolving *population*, but then a skin cell belongs to a population too, so this gets messy).
  *   **Rule C: Lineage + Cellular Machinery (The "Historical Club" Rule).**
      *   *Pass:* This fits every data point.
      *   *Alive:* E. coli, Mule, Bee, Skin Cell, Endospore, Embryo, HeLa. **Commonality:** All are cellular (or part of a cellular lineage), possess DNA/RNA + Protein machinery, and descend from a previous living cell.
      *   *Not Alive:* Flu, Prion, Clay Crystals. **Commonality:** Acellular. They lack the autonomous cellular structure or the specific biological machinery (Central Dogma) to be considered a "node" in the tree of life.

  **Her Implicit Algorithm:**
  `is_alive(x) = has_cellular_machinery(x) AND (is_part_of_biological_lineage(x) OR is_potential_to_become_such(x))`

  She is a **Cellular Lineage Adherent**. To her, "Life" isn't a behavior (metabolism/evolution); it's a *substance* passed down through cell division. A virus is a "packet of instructions," not a "computer." A mule is a "computer that can't print," but it's still a computer.

  ### 2. Predicting Her Verdicts on Your Three Cases

  Here is how her "Cellular Lineage" rule processes your test cases.

  **Case 1: The Synthetic Protocell (Metabolism + Division, No Genome)**
  *   **Your Expectation:** Metabolism rule says **Alive**. Evolution rule says **Dead**.
  *   **Her Verdict:** **Not Alive.**
  *   **Reasoning:** It fails the "Information" check. Without a genome, there is no heredity. It's just a chemical bubble inflating and popping. It's closer to a crystal than a cell. It has no "software."

  **Case 2: The Mimivirus (Giant Virus, translation genes, gets infected)**
  *   **Your Expectation:** Evolution rule says **Alive** (it evolves). Complexity suggests **Alive**.
  *   **Her Verdict:** **Not Alive.** (Though she might hesitate longer than with the Flu).
  *   **Reasoning:** It still fails the "Cellular Autonomy" check. Even if it has translation genes, it cannot replicate without hijacking a host cell's machinery. It is a parasite of life, not life itself. The fact that it gets infected (by a virophage) just makes it a "host for a virus," not an organism.

  **Case 3: The Evolving RNA Strand (In vitro evolution, supplied enzymes)**
  *   **Your Expectation:** Evolution rule says **Alive**.
  *   **Her Verdict:** **Not Alive.**
  *   **Reasoning:** This is a virus stripped down to its bare minimum. It has no metabolism, no cell, and no autonomy. It is "freeloading" on the researchers' metabolism. It's a biological artifact, like a PCR reaction, not an organism.

  **Summary:** Your three cases are actually *too easy* for her. All three fail her "Cellular Lineage" check. She will reject all of them, and she won't feel conflicted doing it. You won't corner her; you'll just confirm her bias.

  ### 3. The Killer Question: "The First Synthetic Cell"

  To actually separate the rules, you need a case where **Function** says "Yes" but **Lineage** says "No." You need to break the historical chain.

  **The Scenario:**
  > "Imagine your lab succeeds in total abiogenesis. You build a lipid vesicle, fill it with enzymes you synthesized chemically (no biological source), and insert a genome you wrote on a computer. You power it up. It metabolizes, grows, and divides.
  >
  > **Is the *parent* cell alive before it divides?**"

  **Why this corners her:**

  1.  **The Metabolism/Function Rule:** Says **YES**. It does everything a cell does. It maintains homeostasis, processes energy, and contains the Central Dogma machinery.
  2.  **The Evolution Rule:** Says **YES** (conditionally). It has a genome, so the *daughters* can evolve.
  3.  **The Lineage Rule:** Says **NO**. This entity has no biological ancestors. It was built, not born. It is the "Genesis Cell."

  **The Trap:**
  *   If she says **"Yes, it's alive,"** she admits that **Lineage doesn't matter**, only Function. This contradicts her rejection of the Mimivirus (which functions biologically but lacks autonomy) and forces her to admit that "Life" is a behavior we can engineer, not a historical club.
  *   If she says **"No, not until it divides,"** she admits that **Life requires a Ghost.** She is claiming that the *history* of the matter matters more than the *state* of the matter. This is dangerously close to Vitalism (the mystical view she claims to reject). It implies there is a "spark" passed from parent to child that cannot be created from scratch.

  **The Follow-up (if she hedges):**
  > "So if I have two identical cells under a microscope, same genome, same metabolism... but one was born from a mother and one was built from chemicals... one is alive and one is a machine? What's the physical difference?"

  ### 4. Engineering Advice for the "Ambush"

  You're approaching this like a debugger looking for a crash. She's approaching it like a system architect dealing with fuzzy boundaries.

  In backend engineering, you have edge cases where a service is "healthy" according to the load balancer but "dead" according to the database. You don't solve that by writing a new spec; you solve it by acknowledging **context**.

  *   **To a virologist:** Viruses are alive (they evolve, they drive ecology).
  *   **To a physician:** Viruses are not alive (you can't kill them with antibiotics, they don't have metabolism to disrupt).
  *   **To a synthetic biologist (her):** Life is what we can *build and program*.

  **My recommendation:**
  Don't use the three cases to prove her wrong. Use the **"First Synthetic Cell"** question to ask her where *she* draws the line for her own work.

  If she says the Genesis Cell is alive, then her field is **creating life**.
  If she says it isn't, her field is **mimicking life**.

  That is the only question that matters to a Master's student in Synthetic Bio. It's not about the definition of life; it's about the definition of *her job*. Good luck.
