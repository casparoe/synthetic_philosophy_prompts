answer: |-
  # What Do You Actually Think About Conditionality?
  **A Diagnostic Quiz for Frontline Practitioners**

  **Instructions:**
  There are ten scenarios below. For each, please circle the **one** option that best matches what you would actually do or think in that situation. Do not answer based on what the rules currently say, nor on what you think your department's official position is. Answer based on your own judgement of what is fair or effective.

  ***

  **1. The Late Bus**
  A claimant arrives at the Jobcentre fifteen minutes late for a scheduled interview. They show you a text from the bus company confirming a significant breakdown on their route. Under current rules, this is a sanctionable failure to attend. What is your view?
  *   **A.** Sanction them. Rules must be consistent, or everyone will claim bus trouble.
  *   **B.** Waive the sanction this time, but warn them to leave earlier next time.
  *   **C.** Do not sanction. If they were trying to attend, the reason for lateness shouldn't matter.

  **2. The Shift Pattern**
  A lone parent is offered a job via a Work Coach. The pay is adequate, but the shifts are irregular and end after local schools close. There is no family nearby to help. They decline the offer. Should their benefit be reduced?
  *   **A.** Yes. Parenting is a private choice; if they choose to have children, they must make work fit around them.
  *   **B.** No. The state should not force a parent into a situation where childcare is impossible.
  *   **C.** Only if the Jobcentre can prove there was a viable childcare solution they refused.

  **3. The Inheritance**
  A man has not worked since age twenty-five. He lives frugally on a small inheritance that is now running out. He applies for Universal Credit. He is fit for work but says he prefers not to work.
  *   **A.** Refuse support. He has had his chance to save; he is choosing poverty.
  *   **B.** Grant support, but require him to apply for jobs as a condition of receipt.
  *   **C.** Grant support unconditionally. It is not the state's business how he chooses to live.

  **4. The Redundancy Savings**
  A claimant is terminated with a generous redundancy package. They know they must declare this to adjust their benefit, but they underdeclare the amount so they can keep their mortgage payments up for a few more months. You discover this.
  *   **A.** Report them immediately. Taking money you aren't entitled to is theft from the taxpayer.
  *   **B.** Advise them to correct it, but do not report them if they do so quickly.
  *   **C.** Say nothing. The system is harsh enough; they are just trying to survive.

  **5. The Disability Assessment**
  A claimant is found 'fit for work' by a government assessment contractor. You have known this claimant for years and are certain they cannot work. They appeal the decision. While the appeal is pending, should their benefit level be cut to the lower rate?
  *   **A.** Yes. The official verdict stands until changed. To do otherwise undermines the assessment system.
  *   **B.** No. If the system is likely wrong, protecting the claimant from hardship takes priority over procedural consistency.
  *   **C.** Only if they can prove severe financial hardship during the wait.

  **6. The Fraud Estimate**
  Imagine it was proven definitively that benefit fraud was not 5%, but 0.05% (one in two thousand claims). Would this change your view on whether strict conditions and checks are necessary?
  *   **A.** No. Conditions are about principle and responsibility, not just stopping fraud.
  *   **B.** Yes. If fraud is negligible, the intrusion and hassle are no longer justified.
  *   **C.** It depends. I would keep checks for high-value claims but remove them for low-value ones.

  **7. The Gateway Course (Entry)**
  To **start** receiving a specific benefit, a claimant must complete a two-week 'Skills for Work' course. They find the course content useless. Should they be allowed to receive the benefit without doing it?
  *   **A.** No. Completing the gateway is the price of entry to the system.
  *   **B.** Yes. If the course is useless, requiring it is a waste of everyone's time.
  *   **C.** Only if they can prove they already have the skills.

  **8. The Continuing Course (Maintenance)**
  To **continue** receiving a specific benefit they are already on, a claimant must complete a two-week 'Skills for Work' course every six months. They find the course content useless. Should they be allowed to keep receiving the benefit without doing it?
  *   **A.** No. Ongoing compliance proves they are still engaged with the labour market.
  *   **B.** Yes. If the course is useless, requiring it is a waste of everyone's time.
  *   **C.** Only if they can prove they already have the skills.

  **9. The Stigma Cost**
  Suppose strict conditionality (sanctions, frequent interviews) successfully gets 10% more people into work, but claimants report feeling humiliated and treated like criminals. Is this stigma a acceptable cost?
  *   **A.** Yes. Getting people into work is the primary goal; feelings are secondary.
  *   **B.** No. Treating citizens like suspects damages social trust and is too high a price.
  *   **C.** It is regrettable, but necessary until the economy improves.

  **10. The 'Tough Love' Justification**
  Why do you think sanctions (cutting benefits) are used when claimants miss appointments?
  *   **A.** To punish them for breaking the rules (Justice).
  *   **B.** To help them build better habits for employment (Paternalism).
  *   **C.** To save money and deter others from claiming (Utilitarianism).

  ***

  # Convenor's Scoring Key & Logical Map

  **Note to Convenor:** This key is designed to sort respondents into logical positions based on their branching commitments, rather than pre-existing labels. The goal is to reveal inconsistencies in 'folk philosophy' forged on the job.

  ## Part 1: The Four Branching Commitments

  Score the responses to map the respondent onto the following four axes.

  **Branch 1: Responsibility for Need (Desert)**
  *Does fault or choice justify differential treatment?*
  *   **High Responsibility:** Q1(A), Q3(A), Q5(A).
      *   *View:* Support is contingent on the claimant not being at fault for their need.
  *   **Low Responsibility:** Q1(C), Q3(C), Q5(B).
      *   *View:* Need alone is sufficient; the cause of need is irrelevant.

  **Branch 2: Duty to Contribute (Reciprocity)**
  *Is a duty to work owed to fellow citizens as such, or only upon drawing taxes?*
  *   **Civic Duty:** Q2(A), Q3(B), Q7(A)/Q8(A).
      *   *View:* Contribution is owed to the community regardless of specific benefit receipt (or is a strict condition of membership).
  *   **Transactional:** Q2(B), Q3(C), Q7(B)/Q8(B).
      *   *View:* Duties arise only when one accepts specific state support, or are limited by private circumstances (like childcare).

  **Branch 3: Paternalism vs. Desert**
  *Are sanctions justified because they help the claimant, or because they deserve punishment?*
  *   **Paternalistic:** Q10(B).
      *   *View:* Coercion is a tool for the claimant's own improvement.
  *   **Desert/Retributive:** Q10(A).
      *   *View:* Coercion is a consequence of rule-breaking.
  *   **Systemic/Utilitarian:** Q10(C).
      *   *View:* Coercion is a tool for system integrity or budget control.

  **Branch 4: Expressive Cost**
  *Do the stigmatising effects of conditionality count as a moral cost?*
  *   **High Cost:** Q6(B), Q9(B).
      *   *View:* If fraud is low or stigma is high, conditionality loses legitimacy.
  *   **Low Cost:** Q6(A), Q9(A).
      *   *View:* Efficiency or principle outweighs the expressive harm of suspicion.

  ## Part 2: The Gateway/Continuing Axis

  Compare **Q7** and **Q8**.
  *   **Consistent:** The respondent chooses the same option (e.g., A/A or B/B). They view the obligation to the state as static.
  *   **Inconsistent:** The respondent chooses different options (e.g., A/B).
      *   *Interpretation:* This reveals a 'Threshold Intuition'. Many practitioners view entry requirements (Gateway) as legitimate 'hoops to jump' but view ongoing requirements (Continuing) as harassment. This distinction is rarely theorised in academic literature but is operationally significant.

  ## Part 3: Mapping the Leaves (Theoretical Positions)

  Combine the Branch scores to identify the respondent's dominant position.

  | Position | Branch 1 (Responsibility) | Branch 2 (Duty) | Branch 3 (Sanctions) | Branch 4 (Stigma) |
  | :--- | :--- | :--- | :--- | :--- |
  | **Luck-Egalitarian Conditionality** | High (Fault matters) | Transactional (Only if claiming) | Desert (Punishment) | Low (Justice > Feelings) |
  | **Reciprocity-Based Duty** | High/Mixed | Civic (Owed to all) | Desert/Reciprocity | Low (Duty > Feelings) |
  | **Social-Citizenship Entitlement** | Low (Need alone) | Transactional/Low | None/Minimal | High (Stigma unacceptable) |
  | **Sufficientarian / UBI** | Low | None | None | High (Unconditional) |
  | **Paternalistic-Utilitarian Workfare** | Mixed | Civic/Transactional | Paternalistic ('Tough Love') | Low (Outcomes > Dignity) |
  | **Libertarian Residual Safety Net** | High | None (Self-reliance) | None (Market discipline) | N/A (Minimal state) |

  ## Part 4: Incoherence and Unexplored Spaces

  If a respondent's answers combine branches that do not map to a leaf above, use the following guide to interpret the gap:

  1.  **High Responsibility + No Monitoring (The 'Honesty' Gap):**
      *   *Combination:* Believes claimants are responsible for their need (Branch 1 High) but opposes checks/sanctions to verify this (Branch 4 High / Q6 B).
      *   *Diagnosis:* **Incoherent.** One cannot enforce responsibility without a mechanism to verify it. This usually indicates a respondent who holds abstract moral views that collapse under operational scrutiny.
  2.  **Paternalism + Low Stigma Cost (The 'Benevolent Warden'):**
      *   *Combination:* Sanctions are for 'help' (Branch 3 Paternalistic) but Stigma is unacceptable (Branch 4 High).
      *   *Diagnosis:* **Unattractive.** It is difficult to coerce 'for someone's own good' without generating stigma. This view often relies on a fantasy of frictionless coercion.
  3.  **Civic Duty + No Conditionality (The 'Voluntarist'):**
      *   *Combination:* Believes we owe work to society (Branch 2 Civic) but opposes conditions to enforce it (Branch 1 Low).
      *   *Diagnosis:* **Unexplored.** This relies on social norms rather than law to enforce duty. It is a coherent sociological position, though rare in policy design.

  ## Part 5: Indistinguishable Leaves

  Be aware of the following blurring in your analysis:

  *   **Social-Citizenship vs. Sufficientarian/UBI:**
      *   *The Blur:* In the context of this quiz, both positions manifest as opposition to conditionality (Branch 1 Low). The quiz cannot distinguish between a right to *benefits based on need* (Social-Citizenship) and a right to *income regardless of need* (UBI), as neither scenario was presented with a wealthy claimant.
      *   *Reporting:* Group these respondents as **"Unconditionalists"** but note that their threshold for 'need' remains unknown.
  *   **Libertarian vs. Luck-Egalitarian:**
      *   *The Blur:* Both emphasise responsibility (Branch 1 High). They diverge on whether the state should intervene to correct bad luck. Q3 (Inheritance) helps separate them, but if a respondent answers Q3(A) (Refuse support), they could be either a Libertarian (State shouldn't pay) or a strict Luck-Egalitarian (He chose this).
      *   *Reporting:* Distinguish only if Q3 is paired with Q5. If they refuse the inheritance man (Q3 A) *but* protect the disabled appellant (Q5 B), they are **Luck-Egalitarians**. If they refuse both, they are **Libertarians**.

  ## Part 6: Facilitation Notes for the Seminar

  *   **The Gateway/Continuing Split:** If you find a large cluster of practitioners who treat Q7 and Q8 differently, highlight this in the discussion. Ask them: *"Why is it fair to make someone jump through a hoop once, but unfair to ask them to jump through it again next year?"* This often reveals that practitioners view welfare as a 'contract' that changes nature once signed.
  *   **The Fraud Question (Q6):** This is your lever for exposing inconsistency. If a Jobcentre staff member says conditions are vital to stop fraud, but then admits in Q6 that they would keep conditions even if fraud vanished, press them on *why*. They will often slide from "stopping thieves" to "building character," revealing a shift from Branch 4 to Branch 3.
  *   **The 'Folk Philosophy':** Remind the group that academic labels (like 'Luck-Egalitarian') are just shorthand for the clusters they have just formed. The value of the quiz is not the label, but seeing which combinations of views they find themselves holding.
