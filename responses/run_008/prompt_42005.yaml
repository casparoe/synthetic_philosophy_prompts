answer: |-
  **JOINT STATEMENT ON FREGE'S PUZZLE AND THE SEMANTICS OF PROPER NAMES**

  **Participants:** Prof. A. (Millian Direct Reference), Prof. B. (Fregean Sense and Reference)
  **Date:** October 26, 2023
  **Drafted by:** PhD Seminar Coordinator

  ### I. Agreed Claims

  The following claims constitute the common ground established during the seminar. Each signatory accepts these claims as consequences of their respective theoretical frameworks, not as compromises that weaken their position.

  1.  **The Phenomenon of Cognitive Significance:** There exists a robust distinction in cognitive significance between trivial identity statements (e.g., "Hesperus is Hesperus") and informative identity statements (e.g., "Hesperus is Phosphorus"). A rational agent, possessing full linguistic competence, may assent to the former while withholding assent from the latter, prior to empirical discovery. Any adequate theory of language must explain this difference in rationality without attributing irrationality to the agent.
  2.  **Identity of Reference:** The difference in cognitive significance described in Claim 1 does not arise from a difference in the objects referred to. 'Hesperus' and 'Phosphorus' refer to the same celestial body. Consequently, the truth-value of the identity statement "Hesperus is Phosphorus" is determined by the numerical identity of that single object with itself.
  3.  **Substitution and Context:** The substitution of co-referential proper names preserves truth-value in extensional contexts (e.g., "Hesperus is visible" / "Phosphorus is visible"). However, substitution *salva veritate* fails in opaque contexts, specifically propositional attitude reports (e.g., "Klara believes that Hesperus is visible"). Both sides agree that a theory must account for this failure of substitution without abandoning the intuition that the names contribute the same object to the world-directed truth conditions of the embedded clause.
  4.  **Compositionality:** The content of a sentence is determined by the contents of its constituent expressions and their syntactic mode of combination. Both sides agree that this principle is non-negotiable; the disagreement concerns what constitutes the "content" of a name (referent alone vs. referent plus mode of presentation) and how that content combines to form a proposition.

  ### II. Residual Disagreements

  The following table isolates the precise points of divergence. The wording in each cell reflects the specific terminology and theoretical commitments of each side.

  | Issue | Prof. A (Millian) Position | Prof. B (Fregean) Position |
  | :--- | :--- | :--- |
  | **1. Location of Informativeness** | The difference in informativeness is **pragmatic**, not semantic. The sentences express the same singular proposition. The difference lies in the "way" or "guise" under which the proposition is grasped or conveyed, which affects the speaker's ability to convey knowledge but not the truth-conditional content. | The difference in informativeness is **semantic**. The sentences express distinct propositions because the names contribute distinct senses (modes of presentation) to the proposition. The difference in content explains the difference in cognitive significance directly. |
  | **2. Belief Reports** | A belief report ("S believes that *a* is *F*") is true if the agent stands in the belief relation to the singular proposition <*a*, *F*-ness>, regardless of the specific name used in the report. Substitution fails in belief contexts due to pragmatic implicatures regarding the *guise* under which the agent believes the proposition, not because the proposition expressed changes. | A belief report is true only if the agent stands in the belief relation to the specific proposition expressed by the *that*-clause. Since co-referential names express different senses, they embed different propositions. Substitution fails because it changes the proposition attributed to the agent. |
  | **3. Theoretical Necessity of Sense** | Entities playing the role of "senses" are not required in the **semantics**. Cognitive roles are handled by psychology (ways of believing) or pragmatics (conversational implicature). Introducing senses into semantics conflates the study of language with the study of mind. | Entities playing the role of "senses" are indispensable to **semantics**. Without them, we cannot explain how communication transfers cognitive states or how logical validity is preserved in reasoning involving names. Semantics must interface with cognitive significance. |

  ### III. Cruxes and Test Cases

  We identify two theoretical bottlenecks where further progress depends on resolving specific explanatory burdens.

  **Crux 1: The Millian Explanatory Burden**
  *Issue:* Can the Millian apparatus (implicature, "ways of believing," or pragmatic guises) carry the explanatory load of cognitive significance without functionally reintroducing senses as semantic intermediaries?
  *Test:* If the "way of believing" determines the truth conditions of belief reports (i.e., if "Klara believes Victor is honest" is false because she lacks the *Victor*-guise), does the "guise" not perform the exact theoretical work of a Fregean sense?
  *Prediction:*
  *   **Millian:** No. Guises are psychological/epistemic, not semantic. They explain *assertibility* conditions of belief reports, not their *truth* conditions.
  *   **Fregean:** Yes. If the truth of the report depends on the guise, the guise is part of the content.

  **Crux 2: The Fregean Identity Conditions**
  *Issue:* Can the Fregean state non-circular, public identity conditions for senses without collapsing them into associated descriptions or private ideas?
  *Test:* If senses are individuated by cognitive role, does this make semantics dependent on individual psychology, threatening the public nature of language?
  *Prediction:*
  *   **Fregean:** No. Senses are abstract, public objects determined by linguistic practice and inferential role, distinct from private ideas.
  *   **Millian:** Yes. Without descriptive content, "mode of presentation" is an obscure metaphor for psychological states.

  **Stipulated Test Case: The Klara/Victor/Hesse Scenario**
  *Scenario:* Klara meets a man at a conference under the name "Victor." Later, she corresponds at length with an author signing himself "V. Hesse," never suspecting they are the same person. She assents to "Hesse is scrupulously honest" and dissents from "Victor is scrupulously honest."

  | Question | Millian Prediction (Prof. A) | Fregean Prediction (Prof. B) |
  | :--- | :--- | :--- |
  | **1. Truth-value of "Klara believes that Victor is scrupulously honest"** | **True.** Klara believes the singular proposition <Victor, Honesty>. The report accurately attributes this belief, though it may be pragmatically misleading regarding the guise she employs. | **False.** Klara does not believe the proposition containing the *Victor*-sense. She believes the proposition containing the *Hesse*-sense. The report attributes the wrong content. |
  | **2. Consistency of Klara's Belief State** | **Consistent.** She holds one belief (the singular proposition) under two distinct cognitive guises, accepting it under one and withholding under the other. No contradiction is believed. | **Consistent.** She holds two distinct beliefs (two different propositions). Asserting both would not be a logical contradiction, though they concern the same object. |
  | **3. Effect of Discovering Co-reference** | **Pragmatic Update.** She learns a metalinguistic fact (that 'Victor' and 'Hesse' name the same man). She merges her guises. Her *belief* (the proposition) does not change, only her access to it. | **Semantic/Cognitive Update.** She learns an identity of sense (or that two senses determine the same referent). Her cognitive state changes from two propositions to one, resolving the fragmentation. |

  ### IV. Verdict on the Dispute: Genuine vs. Verbal

  Upon review, we conclude that the dispute is **partly verbal and partly genuine**.

  **1. The Verbal Component: "Semantic Content"**
  The term "semantic content" is being used in two distinct senses, which drives the disagreement over whether informativeness is semantic or pragmatic (Disagreement Row 1).
  *   **Millian Usage:** "Semantic content" refers strictly to **truth-conditional contribution relative to the world**. On this definition, since 'Hesperus' and 'Phosphorus' contribute the same object to truth conditions, they have the same semantic content. Informativeness is therefore extra-semantic (pragmatic/psychological).
  *   **Fregean Usage:** "Semantic content" refers to **truth-conditional contribution relative to a context of understanding (including cognitive role)**. On this definition, since the names contribute differently to the agent's understanding and inference patterns, they have different semantic content. Informativeness is therefore semantic.
  *   **Resolution:** If we define semantics narrowly (world-directed), the Millian is correct. If we define semantics broadly (mind-and-world-directed), the Fregean is correct. This portion of the dispute is terminological.

  **2. The Genuine Component: The Architecture of Explanation**
  A substantive disagreement remains regarding the **best explanation of rationality and communication**.
  *   Even if we agree on terminology, the Millian must explain why the "pragmatic" guise exerts such strict, rule-governed constraints on belief attribution that it mimics semantic structure (Crux 1).
  *   The Fregean must explain how "senses" remain objective and public without retreating into descriptivism or privatism (Crux 2).
  *   **Adjudication Criteria:** The dispute will be resolved not by defining terms, but by determining which framework better predicts the truth-value judgments in cases like Klara's (Section III) without ad hoc modifications. Specifically, if native speakers consistently judge "Klara believes Victor is honest" as *false* (not merely misleading) in the stipulated scenario, this favors the Fregean view that the proposition expressed varies. If speakers judge it as *true but unhelpful*, this favors the Millian view.

  ***

  **Signed,**

  _________________________
  Prof. A (Millian Direct Reference)

  _________________________
  Prof. B (Fregean Sense and Reference)
