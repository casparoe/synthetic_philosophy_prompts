          *   *Fregean:* It is semantic (difference in proposition expressed).
          *   *Millian:* It is pragmatic (difference in how the proposition is grasped/conveyed).
      *   *Row 2 (Belief Reports):* Constant proposition vs. Shifting.
          *   *Millian:* The embedded clause expresses the same singular proposition; the report is true if the agent stands in the belief relation to that proposition under *some* guise.
