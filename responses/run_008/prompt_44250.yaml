      *   **Task:** The user has provided 7 specific cases with their intuitive verdicts. They want a principle (or set of principles) that captures these verdicts.
      *   **Key Tension:** The user suspects a conflict between saving Case 1 (ordinary dreams are experiences) and Case 6 (Dennett's construction scenario is *not* an experience), especially given the indistinguishability from the inside. They also worry that relying on verification (Cases 3 & 7) smuggles Malcolm's skepticism back in.
      *   **Requirements:**
          1.  State the principle(s) precisely.
          2.  Explain which case motivates each clause.
          3.  Predict the outcome for a new case (fragmented dream reconsolidated at breakfast).
          4.  Explicitly state which of the user's verdicts I would overturn and why.
