      *(Self-Correction on Case 6)*: The user says "This verdict seems to force me to say I can't know that case 1 was an experience." This is the skeptic's trap. I need to explain why we can know Case 1 without ruling out Case 6 logically. (Mooreanism/IBE).

      *(Refining the Principle)*: Let's call it **The Causal-Phenomenal Default**.
      1.  Reports presume prior experience (Anti-Malcolm).
