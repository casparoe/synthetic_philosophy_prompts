answer: |-
  1. "First pass"

  My initial instinct is to separate the *goodness of the outcome* from the *quality of the reasoning*. If we say progress is only when people do the right thing for the right reason, your dueling case fails, because you admit the motivation was status, not morality. But if we say progress is only about the outcome, then accidental changes count, which feels empty. I'm considering a hybrid: progress requires the norm to be objectively wrong, but the mechanism of change must not be *accidental*. It needs to track the wrongness somehow. Prestige can track wrongness if prestige avoids harm. But then Prohibition becomes tricky: the mechanism was moral argument, but the norm wasn't actually wrong. So the principle must prioritize the *objective status of the norm* over the *stated motives of the actors*. That saves Dueling and Prohibition simultaneously, but it risks making morality too detached from human agency. I need to ensure the mechanism isn't purely coercive.

  2. "Candidate principles"

  **Principle 1: The Objective Harm View.** A change is moral progress if and only if the abandoned norm was objectively harmful or unjust, regardless of why it ended.
  *Saving Clause:* This saves your Dueling verdict immediately. It doesn't matter that duelists stopped due to embarrassment; dueling was violent and wrong, so ending it is progress. It also handles Prohibition correctly: if the norm against drinking wasn't objectively harmful, ending it isn't "moral progress" in the same sense, or rather, the *implementation* was the error.

  **Principle 2: The Moral Recognition View.** A change is moral progress if and only if agents abandoned the norm because they recognized its moral falsity.
  *Saving Clause:* This captures the intuition that progress involves learning. It saves Slavery (argument-driven) but forces you to reject Dueling and Footbinding, since you described those as prestige or coordination-based, not moral insight. This principle is too narrow for your actual judgments.

  **Principle 3: The Reliable Tracking View.** A change is moral progress if the abandoned norm was objectively wrong and the mechanism of change (prestige, coordination, law) reliably correlates with reducing that wrong, even if agents don't articulate the moral reason.
  *Saving Clause:* This is the strongest contender. It saves Dueling (prestige tracked violence avoidance) and Footbinding (coordination tracked welfare). It excludes Prohibition because the mechanism (coercive law based on false moral claims) did not track objective harm reduction, but rather created new harms. It respects agency without requiring perfect moral knowledge.

  3. "Back against my cases"

  **Objective Harm** aligns with your verdicts on Dueling, Slavery, Footbinding, Smoking, and Death Penalty (all involved objectively harmful norms). It correctly excludes Hat Tipping (neutral norm). It handles Prohibition well if we agree the norm wasn't objectively harmful. However, it risks counting accidental changes as progress, which feels passive.

  **Moral Recognition** fails your specific verdicts on Dueling, Footbinding, and Death Penalty. You classified these as progress despite admitting the mechanisms were prestige, coordination, or elite imposition, not widespread moral persuasion. Adopting this would force you to rewrite half your paper.

  **Reliable Tracking** matches your intuitions best. It validates Dueling and Footbinding because prestige and coordination functioned as proxies for moral truth (violence and harm are bad). It validates Slavery and Smoking. It excludes Prohibition because the temperance mechanism created black markets and coercion without reducing objective harm. It validates Death Penalty abolition (elites tracked human rights) but creates tension: if elites are wrong, tracking fails. This principle accommodates six of your seven verdicts comfortably. It treats the mechanism as a tool that must successfully locate the moral truth, not just argue for it. This explains why Prohibition fails (false truth) while Dueling succeeds (true truth, imperfect mechanism).

  4. "New cases"

  **Lab-grown meat becoming prestigious:** My preferred principle (Reliable Tracking) counts this as **moral progress**. Even if consumers choose it for status rather than animal welfare, the mechanism (prestige) is tracking the reduction of suffering. As long as the norm (eating animals) is objectively harmful, the method of abandonment matters less than the reliability of the outcome.

  **Decline of hazing due to liability fears:** This counts as **moral progress**. Schools abandoning hazing to avoid lawsuits is pragmatic self-interest, but it reliably tracks the reduction of physical and psychological harm. The mechanism (legal risk) correlates with the moral truth that hazing is wrong.

  **Men no longer proposing marriage (norm disappears):** This is **not moral progress**. The norm of men proposing is arguably neutral or traditional, not objectively harmful. Its disappearance is social evolution or fashion, similar to hat-tipping. Without an underlying objective wrong being corrected, the change is merely behavioral, not moral.

  5. "Where I lose"

  I must challenge your verdict on **Case 1 (Dueling)**. My principle requires the mechanism to *reliably track* moral truth. Prestige is fickle; it can track harm, but it can also track cruelty (e.g., colonial exploitation was once prestigious). If dueling ended *only* because it became embarrassing, without any underlying shift in valuing life over honor, the progress is fragile. True moral progress requires that the society eventually understands *why* the norm was wrong, not just that it stopped. I would argue Dueling was beneficial social change, but not full *moral* progress until the moral argument finally landed. You should prioritize the stability of the change over the immediate outcome.
