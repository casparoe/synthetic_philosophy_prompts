          *   *Negligence + Storm:* Tree falls in storm. Was it the wind (God) or the rot (Human)? Law looks at foreseeability. Theology might look at stewardship.
          *   *Underdetermination:* The term "Act of God" is underdetermined between "Supernatural Intervention" and "Statistical Outlier." The law assumes the latter.

      *   **4. The Thought Experiment: The Theologically Serious Insurer:**
          *   If "Act of God" literally means God's will:
