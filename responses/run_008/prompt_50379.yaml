          *   Does the legal doctrine *presuppose* theology, or is it just secular fault-tracking in religious clothing?
          *   Do the readings come apart in practice (e.g., negligence during a storm)?
          *   Where is the practice underdetermined?
          *   **Challenge:** What would change if an insurer took the *theological* reading seriously?

  2.  **Initial Analysis & Thesis Formulation:**

      *   *Thesis:* The legal doctrine of "Act of God" is functionally secular but historically/theologically haunted. It presupposes a metaphysics of *agency* and *causality*, not necessarily a deity. However, the tension arises because the legal system tries to draw a bright line where reality offers a spectrum (climate change, negligence + storm).
      *   *The "Evil" View:* It presupposes a view where "bad events" are neutral unless attached to a liable agent. It's not about "evil" in a moral sense, but "loss" in an economic sense.
      *   *The Divergence:* Theodicy wants to save God's goodness; Insurance wants to save the insurer's solvency.
