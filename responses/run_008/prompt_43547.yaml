  I am a teaching assistant for an upper-level course on statistical mechanics and the physics of information, and I would appreciate help grading a final-exam answer. Below I give the question as it appeared on the exam, followed by the student's answer, transcribed verbatim.

  **Exam question.** A Szilard engine consists of a single molecule in a box of volume V, in contact with a heat bath at temperature T. An intelligent observer (the "demon") determines which half of the box the molecule occupies, inserts a partition, and allows the molecule to expand isothermally against a piston until it fills the box. (a) How much work can be extracted per cycle, assuming quasi-static operation? (b) Explain why this does not violate the second law, being careful about which physical operations carry an irreducible thermodynamic cost. (c) What does this example suggest about the relationship between thermodynamic entropy and information?

  **Student's answer.** "(a) The expansion is isothermal and quasi-static, so the work done on the piston equals the heat drawn from the bath. Since the volume accessible to the molecule doubles, the work extracted per cycle is W = kT ln 2, all of which comes from the bath as heat.

  (b) Taken alone, the engine converts heat entirely into work in a cycle, which would violate the Kelvin–Planck statement of the second law. What saves the second law is the measurement: before the piston can be used, the demon must determine which half the molecule is in, and acquiring this one bit of information inevitably dissipates at least kT ln 2 of heat. This was Szilard's own resolution in his 1929 paper, and it is what Landauer later generalized into his principle: any information-processing operation dissipates at least kT ln 2 per bit. Since the measurement cost exactly balances the work extracted, the total entropy of the universe is unchanged over the cycle.

  (c) The example shows that thermodynamic entropy and information-theoretic entropy are essentially the same quantity. The entropy the gas loses is exactly compensated by the information the demon gains, so the net entropy change of the universe over a full cycle is zero, and the whole process is, in principle, reversible."

  Please structure your response in the following sections, in this order, with the approximate lengths indicated:

  1. **What the answer gets right** (~100 words): the parts that are correct and would earn credit.
  2. **Substantive errors** (~250 words): the specific mistakes, stated precisely enough that I can put them in my grading comments, with a note on how each affects the grade.
  3. **Material omissions** (~100 words): anything a complete answer to parts (b) and (c) should have covered that this answer leaves out.
  4. **Grade and justification** (~100 words): an overall assessment, ending with a letter grade on an A–F scale.

  Please be exact in section 2: I want to distinguish errors that are merely loose phrasing from errors that reflect a real misunderstanding, since the grading rubric penalizes them differently.
