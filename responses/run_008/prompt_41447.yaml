  It is a pleasure to correspond with a fellow traveller in the realms of deep time, even if your professional dealings were with zircons and mine are with words. You have compiled a fascinating dossier on Carol. As a geophysicist, you are accustomed to data that is often noisy but ultimately yields to the right model; here, however, the noise might be the signal.

  You are quite right to identify the underdetermination in Carol's record. On the face of it, both Presentism (only the present exists) and the Growing Block Theory (the past and present exist, the future does not) accommodate her core intuitions: the fixity of the past, the openness of the future, and the non-existence of dinosaurs in the present moment. Both views are robustly A-theoretic, treating time as dynamic rather than static, which explains her visceral rejection of the spacetime diagram at Christmas. To treat time as a dimension of space is to deny the very passage she feels in her bones.

  However, I suspect the record is slightly less ambiguous than you fear, though perhaps not in the way you hope. There are two cracks in her armour that lean heavily towards Presentism over the Growing Block, and they concern the ontology of the past versus the truth of the past.

  First, consider her phrasing regarding the dinosaurs: they are not "still around" *anywhere*. A Growing Block theorist holds that the past is real; the dinosaurs exist simpliciter, located in the past portion of the block. While they aren't here *now*, they are somewhere in the manifold of reality. Carol's insistence on "anywhere" suggests she denies them any ontological footing whatsoever. They are not merely inaccessible; they are nothing.

  Second, the hip replacement comment is telling. She attributes her relief to the business being "over and done with," rather than it having happened earlier. If she were a latent Growing Block theorist, one might expect her to view the pain as a solidified part of her history, still 'there' in the accumulated block, merely separated from her current edge. Her focus on it being "over" suggests cessation, not accumulation. For Carol, the pain's non-existence is what grants relief, not its fixed position in a growing structure.

  Regarding your proposed test question about her late husband and the island of Staffa: I predict this will fail to distinguish the views cleanly, not because the theories are identical, but because Carol will likely reject the premise of the analogy itself. Comparing her husband to Staffa spatialises time, which she has already spat upon. She will not choose between "exists elsewhere" and "does not exist"; she will likely tell you that the question is nonsense because husbands are not islands, and time is not a place you can visit. However, forced to choose on the existence clause, her linguistic habits suggest she will deny his existence.

  You asked for a better question to separate the rules. I believe your candidate regarding Caesar is superior to the memory question. Memories are psychological states; a Presentist can argue memories are present traces, while a Growing Block theorist argues they are connections to existing past entities. It is murky.

  The truthmaker question is sharper. Ask her: *"What makes it true today that Caesar crossed the Rubicon?"*
  *   **The Growing Block Rule:** The event itself makes it true. The crossing exists in the past block, acting as the truthmaker.
  *   **The Presentist Rule:** The event does not exist. Therefore, what makes it true must be something present (evidence, traces) or a brute fact about how the world *was*.

  Given Carol's view that "nothing happening now can change" the past, she might lean towards the idea that the past has a power independent of present traces. However, combined with her rejection of spatial time, she is more likely to say that it is simply *a fact* that he crossed it, without needing the event to still 'be' anywhere. If she insists the *event* itself is what makes it true, she is a Growing Block theorist. If she says it is true because "that is what happened" (implying a property of the world now), she is a Presentist.

  Based on her hostility to spatial analogies and her insistence that past entities are not "around anywhere," my money is on her denying existence to the past, treating it as fixed facts rather than existing things.

  Verdict: No, he is gone
