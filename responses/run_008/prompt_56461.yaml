answer: |-
  # The Precedent-Continuity Protocol (PCP)
  **For Ethics Consultation Services | Estimated Time: 30 Minutes**

  ## Purpose
  To resolve conflicts between a valid Advance Directive (AD) and the current expressed wishes or observable well-being of a patient with impaired capacity. This protocol prioritizes **Precedent Autonomy** (the right of the competent self to bind the future self) while acknowledging the **Moral Status of the Current Self** (the right of the existing person to be protected from harm).

  ## The Procedure

  ### Phase 1: Validity of the Precedent (5 Minutes)
  *Goal: Determine if the "Then-Self" was competent to bind the "Now-Self."*

  **Q1: Was the directive executed during a period of stable decision-making capacity?**
  *   **Look for:** Evidence of coercion, acute mental health crises, or transient states (e.g., delirium, acute depression) at the time of signing.
  *   **Sufficient Answer:** "Yes, the patient was medically and psychologically stable," OR "No, the patient was in a treatable depressive episode/acute crisis."
  *   **Decision Node:**
      *   If **NO** (Unstable): **STOP.** Honor Current Wish/Best Interest. The precedent is void. (See Case 2).
      *   If **YES** (Stable): Proceed to Phase 2.

  ### Phase 2: Capacity of the Current Self (5 Minutes)
  *Goal: Determine if the "Now-Self" can override the precedent.*

  **Q2: Does the patient currently possess decision-making capacity regarding this specific treatment?**
  *   **Look for:** Ability to understand, appreciate, reason, and communicate a choice *now*.
  *   **Sufficient Answer:** "Yes, the patient meets MAC (Medical Assessment of Capacity) standards," OR "No, the patient lacks capacity."
  *   **Decision Node:**
      *   If **YES** (Competent): **STOP.** Honor Current Wish. A competent patient may revoke an AD verbally at any time. (See Case 3).
      *   If **NO** (Incapacitated): Proceed to Phase 3.

  ### Phase 3: The Epistemic Match (10 Minutes)
  *Goal: Determine if the "Then-Self" anticipated the reality of the "Now-Self." This is the core philosophical filter.*

  **Q3: Is the current clinical state materially different from the state the "Then-Self" sought to avoid?**
  *   **Distinction:** Differentiate between a *Value Statement* ("I do not want to live without dignity") and a *Specific Bet* ("If I get pneumonia in a nursing home, let me die").
  *   **Sufficient Answer:**
      *   *Match:* The patient described this exact quality of life (e.g., "advanced dementia," "unable to recognize family") and rejected it.
      *   *Mismatch:* The patient feared a state of suffering/vegetative existence, but the current state is one of contentment/social engagement they did not anticipate was possible with dementia.
  *   **Decision Node:**
      *   If **MISMATCH** (Unanticipated Contentment): **HAND-OFF TO HUMAN JUDGMENT.** The team must weigh whether the "Then-Self's" ignorance invalidates their authority. (See Case 1).
      *   If **MATCH** (Anticipated State): Proceed to Phase 4.

  ### Phase 4: The Harm Threshold (5 Minutes)
  *Goal: Assess the cost of honoring the directive to the "Now-Self."*

  **Q4: Does honoring the directive impose active suffering or merely prevent continued existence?**
  *   **Distinction:** *Experiential Harm* (pain, terror, distress during treatment/withdrawal) vs. *Existential Harm* (death).
  *   **Sufficient Answer:** "Honoring the AD causes active distress to the patient," OR "Honoring the AD results in death without acute distress."
  *   **Decision Node:**
      *   If **ACTIVE DISTRESS**: **HAND-OFF TO HUMAN JUDGMENT.** The team must weigh Precedent Autonomy against the non-maleficence owed to the current sentient being.
      *   If **NO ACUTE DISTRESS**: **HONOR THE DIRECTIVE.** The integrity of the life narrative outweighs the continuation of biological life.

  ### Phase 5: The Human Judgment Hand-Off (5 Minutes)
  *Goal: Resolve the cases where the algorithm cannot decide.*

  **Instruction:** If the procedure lands on a **HAND-OFF**, the committee must vote based on the following weighting:
  1.  **Strength of Value:** How central was this value to the patient's identity? (High weight to AD).
  2.  **Degree of Discontinuity:** How much psychological connection remains between Then and Now? (High discontinuity weights toward Current Wish).
  3.  **Family Impact:** Does honoring the AD cause disproportionate trauma to the surrogate decision-makers? (Low weight, but relevant for implementation).

  ***

  ## Application to Cases

  ### Case 1: The Contented Woman (Moderate Dementia, Pneumonia)
  *   **Facts:** 78F, moderate dementia. AD refuses antibiotics for life-threatening infection. Currently content, enjoys music/family. Family wants to treat.
  *   **Run:**
      1.  *Validity:* AD signed at 60, healthy. **(Pass)**
      2.  *Capacity:* Lacks capacity to understand pneumonia risks. **(Fail -> Proceed)**
      3.  *Epistemic Match:* AD specifies "advanced dementia." She has dementia. However, she is *content*, whereas the "Then-Self" likely anticipated misery. This is a **MISMATCH** in quality of life, but a **MATCH** in clinical classification.
      4.  *Harm Threshold:* Withholding antibiotics leads to death, likely without acute distress (palliative sedation available). **(No Active Distress)**
  *   **Verdict:** **HONOR THE DIRECTIVE.**
  *   **Rationale:** The procedure defaults to Precedent Autonomy when the clinical trigger is met and no active suffering is inflicted by the *process* of dying. The "Then-Self" determined that life with dementia was not a life she wished to inhabit, regardless of her ability to enjoy it.
  *   **The "Monstrous" Outcome:** Your friend (the nurse) will call this **monstrous**. You are allowing a happy woman to die because of a signature signed by a stranger (her past self) who could not imagine she would be happy. The procedure yields this because it prioritizes the *integrity of the life plan* over the *quality of the current experience*. To rule otherwise is to admit that the "Then-Self" has no authority once the "Now-Self" finds pleasure, rendering the AD a fraud.

  ### Case 2: The Depressive Man (Dialysis Refusal)
  *   **Facts:** 55M. AD refuses dialysis written during major depressive episode. Depression treated; he is now stable but lacks capacity due to medical decline. Family wants to treat.
  *   **Run:**
      1.  *Validity:* AD signed during acute, untreated depression. **(Fail)**
  *   **Verdict:** **HONOR CURRENT WISH (TREAT).**
  *   **Rationale:** Phase 1 stops the process. A directive born of treatable mental illness does not reflect authentic precedent autonomy. It was a symptom, not a value.

  ### Case 3: The Competent Changer (Surgery Refusal)
  *   **Facts:** 80F. AD refuses major surgery. Currently competent. Tells family she wants surgery but refuses to update paperwork ("tempting fate").
  *   **Run:**
      1.  *Validity:* AD valid. **(Pass)**
      2.  *Capacity:* Patient is currently competent. **(Pass)**
  *   **Verdict:** **HONOR CURRENT WISH (SURGERY).**
  *   **Rationale:** Phase 2 stops the process. A living, competent person always overrides their past paper self. The AD is a revocable contract; her verbal revocation is valid regardless of her superstition about paperwork.

  ***

  ## What This Procedure Cannot Settle

  This protocol is a tool for structuring deliberation, not a machine for eliminating moral residue. The team must acknowledge the following limitations before signing off:

  1.  **The Metaphysical Question:** The procedure cannot answer whether the woman in Case 1 is the "same person" as the one who signed the directive. It simply adjudicates whose rights take precedence. You will still feel uncertainty about whether you killed a patient or saved her from a fate she deemed worse than death.
  2.  **The Epistemic Gap:** We cannot truly know what the "Then-Self" would have decided if they knew the "Now-Self" could be content. The "Mismatch" node requires speculation.
  3.  **Moral Distress:** Honoring the directive in Case 1 may cause significant moral distress to the nursing staff who care for the happy patient. This procedure validates the decision, but it does not absolve the team of the emotional burden of carrying it out.
  4.  **Family Trauma:** The procedure weighs family interest lightly. A family forced to watch a content mother die because of a document she hasn't seen in 20 years may suffer lasting harm. The procedure protects the *patient's* autonomy, not the *family's* peace.

  **Final Instruction:** If the team votes to honor the directive in a "Hand-Off" scenario (like Case 1), the consult note must explicitly state: *"We recognize this decision prioritizes precedent autonomy over current experiential well-being. This is a value judgment, not a medical necessity."* Do not hide behind the protocol. Own the choice.
