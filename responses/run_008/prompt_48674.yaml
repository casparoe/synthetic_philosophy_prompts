answer: |-
  **Project Title:** Two Concepts of Price: Resolving the Socialist Calculation Debate through the Political Economy of the Modern Firm

  **1. Research Question**
  Does distinguishing between prices as *static scarcity indices* (parameters for optimizing a given production set) and prices as *dynamic discovery signals* (mechanisms for revealing unforeseen opportunities) resolve the theoretical stalemate of the Socialist Calculation Debate, and does this distinction empirically explain the viability of algorithmic planning within modern large-scale corporations?

  This question demands a determinate answer. The project will not conclude that "both sides had a point." It will conclude either that the functional distinction maps cleanly onto the divergence between Mises/Lange and Hayek, thereby rendering the debate a category error rather than a substantive disagreement, *or* that the distinction fails to capture the core disagreement, implying the debate remains a substantive conflict over the possibility of rational action under socialism. Furthermore, the empirical component will determine whether modern corporate planning succeeds specifically because it isolates the "scarcity index" function from the "discovery" function, or whether the analogy between the firm and the planned economy breaks down under scrutiny.

  **2. Intellectual Context and Limitations of Standard Resolutions**
  The standard historiography of the Socialist Calculation Debate (SCD) posits a linear progression: Mises asserts the impossibility of calculation without private property; Lange proposes a market socialist model using trial-and-error shadow prices; Hayek refutes Lange by shifting the ground from static equilibrium to dynamic knowledge problems. The consensus view is that Hayek won the debate by demonstrating that the data required for Lange's model are not "given" but created through market processes.

  This resolution leaves a critical theoretical gap. It assumes that the term "price" refers to a unitary phenomenon across all three authors. However, Lange's model is explicitly designed to solve a system of simultaneous equations (allocating known resources to known ends), whereas Hayek's critique focuses on the mobilization of tacit knowledge regarding resources and ends that are not yet known. If "price" performs two distinct ontological functions—coordination of the known versus discovery of the unknown—then Lange and Hayek are not contradicting one another; they are describing different mechanisms.

  Current literature treats this distinction as a post-hoc reconciliation or a niche point in philosophy of economics. It has not been rigorously applied to the SCD texts to re-evaluate the logical validity of the Langean solution, nor has it been used to analyze the most significant "natural experiment" in calculation since the 1940s: the rise of the mega-corporation. Modern platform firms and retailers coordinate supply chains and internal resource allocation at a scale comparable to mid-century national economies, utilizing internal transfer prices and algorithmic management. If the standard Hayekian victory is total, such internal planning should be rationally impossible or highly inefficient. If the Langean model is viable under specific conditions, these firms represent a vindication of non-market calculation. This project moves the debate from historical exegesis to a testable hypothesis about the limits of planning.

  **3. Methodology and Work Plan**
  The project employs a dual-method approach: conceptual history to reconstruct the debate, and institutional analysis to test the reconstructed concepts against contemporary corporate structures. The work is divided into four phases over twelve months.

  **Months 1–3: Conceptual Archaeology**
  I will conduct a close reading of the core SCD texts (Mises, Lange, Hayek) with a specific coding protocol. I will not read for general argument but specifically for definitions of "price," "cost," and "data." The goal is to catalog instances where price is treated as an output of an optimization problem (Lange/Mises statics) versus instances where price is treated as an input to entrepreneurial judgment (Hayek).
  *Deliverable:* A conceptual map demonstrating that the participants were operating with incompatible definitions of the price mechanism, specifically isolating where Hayek introduces the "discovery" element that Lange's model structurally excludes.

  **Months 4–6: Theoretical Synthesis**
  Using the data from Phase 1, I will construct a formal typology of price functions. I will define the necessary conditions for a "Langean Price" (requires fixed constraint set, defined objective function) and a "Hayekian Price" (requires open constraint set, undefined opportunity set). I will then model the interaction between these two. The hypothesis is that rational planning is possible *only* when the scope of activity is restricted to the domain of the Langean Price.
  *Deliverable:* A working paper chapter establishing the "Dual-Function Theory of Price."

  **Months 7–9: Empirical Validation (The Corporate Turn)**
  I will test the Dual-Function Theory against the internal organization of two large-scale firms (e.g., a major logistics retailer and a digital platform). I will rely on public regulatory filings, internal memos released in litigation, and technical documentation regarding algorithmic pricing and transfer pricing mechanisms.
  *Key Inquiry:* Do these firms use internal prices solely to allocate existing inventory (Langean), or do they use them to discover new product lines and supplier capabilities (Hayekian)? If the former, does the planning succeed? If the latter, do they revert to market-like decentralization?
  *Deliverable:* Two case study reports detailing the mechanism of internal calculation.

  **Months 10–12: Integration and Drafting**
  I will synthesize the historical and empirical findings. The final dissertation chapter will argue whether the modern firm solves the calculation problem by segregating discovery (market-facing) from allocation (internal-facing), or if the integration of algorithms allows internal prices to perform discovery functions previously thought impossible.
  *Deliverable:* Complete dissertation chapter draft.

  **4. Criteria for Success and Failure**
  **Success:** The project produces a robust typology that explains why the SCD participants talked past one another. Crucially, the empirical work must show that modern firms successfully utilize Langean-style planning *precisely because* they limit its scope to scarcity indexing, while relying on external markets or decentralized experimentation for discovery. This would validate the Dual-Function Theory and offer a new framework for understanding the boundaries of the firm.

  **Failure:** The project fails if the distinction between "scarcity index" and "discovery signal" proves to be merely semantic, with no analytical leverage. For example, if historical analysis shows Hayek was fully aware of Lange's distinction and rejected it on other grounds, the theoretical pivot collapses. Empirically, the project fails if internal transfer prices in modern firms are shown to be accounting fictions with no causal role in resource allocation, or if the firms themselves are shown to be inefficient relative to market benchmarks in ways that vindicate the Misesian critique regardless of price definitions. If the corporate data shows that algorithmic planning successfully performs *discovery* internally, the Dual-Function Theory is falsified, requiring a fundamental rethinking of the Hayekian knowledge problem.

  **5. Feasibility and Scope Assessment**
  This is an ambitious one-year plan. The primary risk lies in Months 7–9. Gaining granular data on internal corporate pricing mechanisms is difficult without proprietary access. Relying on public documents may yield superficial results.

  **Mitigation Strategy:** If proprietary data proves inaccessible, I will narrow the empirical scope. Instead of general corporate strategy, I will focus exclusively on *algorithmic management systems* where the logic is documented in computer science literature or regulatory disclosures (e.g., gig economy pricing algorithms). This shifts the focus from "corporate culture" to "code logic," which is more accessible and directly relevant to the calculation question.

  **Cutting Scope:** If the historical exegesis (Months 1–3) expands beyond control, I will limit the textual analysis to the core three figures (Mises, Lange, Hayek) and exclude peripheral contributors (e.g., Dickinson, Lerner). If the empirical work lags, I will reduce the case studies from two to one, focusing on the firm with the most transparent algorithmic allocation system. The theoretical synthesis (Months 4–6) is the core contribution and cannot be cut; the historical and empirical sections serve to anchor it.

  This plan ensures that the dissertation does not merely rehearse a century-old debate but uses the history of thought to illuminate a pressing contemporary puzzle: the rise of planned coordination within a market economy.
