prompt: |-
  You are an expert historian of economic thought and philosopher of economics, comfortable with both the analytic and the archival side of the field. Please think carefully and do some internal brainstorming before drafting; I need a genuinely workable plan, not a restatement of textbook positions.

  I am a PhD student in political economy drafting a one-year dissertation fellowship proposal, and I have a half-formed idea I would like you to turn into a proper two-page proposal.

  The idea concerns the socialist calculation debate. The standard framing is that Mises argued rational calculation is impossible without genuine market prices, Lange answered with a model of market socialism using trial-and-error shadow prices set by a planning board, and Hayek then supposedly won the debate by shifting it from statics to dynamics — information, dispersed knowledge, and entrepreneurship. My suspicion is that this framing conceals a shared assumption on all sides: that "a price" is a single kind of thing. It seems to me the debate actually needs at least two distinct notions — prices as scarcity indices that let a planner or manager coordinate an already-given set of production plans, and prices as discovery signals that reveal wants and resources nobody yet knew existed. If those come apart, then Lange's answer and Hayek's rebuttal stop being direct contradictories: Lange could be vindicated on the first notion while Hayek is vindicated on the second. What makes this more than a historical curiosity is that huge modern firms — platform companies, retailers coordinating supply chains across a scale comparable to mid-century national economies — run planned allocation using internal transfer prices and algorithmic pricing, i.e., something that looks like the Langean machinery operating inside a Hayekian world. Nobody in the 1930s–40s could have seen that natural experiment coming.

  Please write the proposal with: (1) a precise statement of the research question, stated so that it has a determinate answer rather than inviting an essay of "on the one hand / on the other"; (2) an explanation of why the standard resolutions of the debate leave this question open; (3) a method section saying what I would actually do, month by month — I want the conceptual work of distinguishing the two notions of price to be answerable to historical texts and to the contemporary corporate cases, not just to my own intuitions; (4) what a positive result would look like and, honestly, what would count as the project failing; and (5) a realistic assessment of whether this is too much for one year and what to cut if it is.

  Do not include a bibliography or citations; I will fill in references myself. Positions and arguments may be named and described, but please do not rely on exact quotations, page numbers, or specific publication details.
