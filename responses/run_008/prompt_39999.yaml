      *   *Space-Time Analogy:* Perdurantists say time is like space. Endurantists say time is *unlike* space (dynamic vs. static, presence vs. extension).
      *   *Common Sense vs. Physics:* Endurantists appeal to phenomenology/language. Perdurantists appeal to relativity/spacetime manifolds.
      *   *Internal Perdurantist Split:* Worms (the whole aggregate is the object) vs. Stages (the instantaneous slice is the object). This is crucial for the "verbalism" suspicion.

  3.  **Evaluate the "Verbalism" Charge:**
      *   Is it just notation? If Worm Theory and Stage Theory agree on the spacetime manifold and the distribution of qualities across it, do they disagree on *reality*?
