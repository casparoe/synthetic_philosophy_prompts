answer: |-
  What you're actually deciding
  You are really defining the subject of the exhibit's central verb. The title says societies collapse, but what constitutes a "society"? Is it the political superstructure, including palaces, kings, and scribes, or the broader population and their cultural continuity? Your text must clarify that systems can fail without people vanishing. This isn't linguistic compromise; it is archaeological precision. You are deciding whether the exhibit explains the end of institutions or the end of people. This distinction satisfies both consultants by adhering to the evidence. Ultimately, the choice defines the narrative scope. It determines what visitors learn about history. This matters very much indeed.

  Where your first consultant is right
  The first consultant correctly identifies the abrupt cessation of specific complex systems. In the Maya lowlands, dynastic monuments ceased being erected, and major urban centers were depopulated. For the Mycenaeans, the palace economies dissolved, Linear B script disappeared, and monumental architecture stopped. On Rapa Nui, statue carving halted and population estimates suggest a severe decline. Ignoring this discontinuity misrepresents the archaeological record. There was a genuine loss of complexity, political hierarchy, and specialized labor. Visitors need to understand that these were catastrophic events for the ruling structures that defined those eras. To gloss over the destruction layers, the burning palaces, and the silence of the archives is to deny the severity of the crisis that occurred. The drama is very real.

  Where your second one is right
  The second consultant rightly emphasizes human continuity and resilience. The Mycenaean people didn't die out; they reorganized into smaller communities during the Greek Dark Ages. Maya languages and cultural practices survive vigorously today, despite the Classic period's end. The Rapa Nui people still persist despite colonial and ecological shocks. Framing these events as total extinctions erases Indigenous survivance and implies failure where adaptation occurred. "Collapse" often carries a moral judgment of weakness, whereas "transformation" acknowledges agency. By focusing solely on the fall of elites, you risk implying the common people mattered less. The archaeological record shows change, not disappearance. Validating this continuity prevents the exhibit from becoming a morbid spectacle of dead civilizations and instead highlights how communities navigate systemic failure.

  A way to write the panels
  Write the panels to distinguish between the collapse of systems and the continuity of people. Use the title's word "collapse" strictly for political and economic structures. State clearly: "The Palace System Collapsed," followed by, "The People Remained." Explain that while kings lost power and scribes stopped writing, farmers still farmed and families still worshipped. For the Maya, specify that Classic cities were abandoned, but Maya civilization shifted north and continued. For Mycenaeans, note the loss of literacy but the survival of oral traditions leading to Homer. For Rapa Nui, also address population decline without implying extinction. This approach honors the title while incorporating the second consultant's nuance. It allows you to describe the dramatic failure of institutions without erasing the survivors. Each panel should answer two important questions: What broke? And what endured? This structure turns the conflict into a narrative arc about resilience amidst failure, satisfying the demand for drama without sacrificing archaeological accuracy regarding true survival. Make sure the introductory panel very explicitly defines "collapse" as systemic failure, not human extinction. This sets clear expectations. By separating the fate of the state from the fate of the population, you create space for both dramatic endings and ongoing stories.

  What to leave out
  Avoid moralizing language about societal weakness or ecological sin. Do not attribute each end to a single cause like drought or invasion. Leave out definitive statements about total extinction. Avoid suggesting that complexity is inherently superior to simpler living arrangements. Finally, do not hide the public conflict behind vague jargon; true clarity is better than ambiguous peace-making.
