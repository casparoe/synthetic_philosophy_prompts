      *   *Sentence 3:* "The 1990s episode establishes degeneration: the programme made a prediction, the prediction was refuted, and in Lakatos's terms this falsifies the belt hypothesis, so the programme itself has now been falsified and must be abandoned." (Problematic. Lakatos does not believe a single refutation falsifies the programme immediately. Degeneration is usually a sequence of moves, not just one failed prediction. Also, saying the programme "must be abandoned" immediately after one failure leans towards falsificationism).
      *   *Sentence 4:* "Moreover, since the rival programme added no hypotheses to handle the episode, the rival counts as progressive." (Problematic. A rival that makes *no* prediction and just "absorbs" the episode without modifying its belt might be progressive relative to the other, but Lakatos emphasizes *novel predictions*. If the rival made no prediction, can it be called progressive? Usually, progressiveness requires excess empirical content confirmed by evidence. Merely surviving while the other fails helps, but the definition of progressive requires predicting novel facts. The student says the rival counts as progressive because it added no hypotheses. This is a bit shaky but arguably acceptable in a comparative context, though the key is whether the rival predicted something novel).
