answer: |-
  Right, pull up a chair. This is a proper classic bit of philosophical mischief, and I can see why it's left you staring at the sink. Your flatmate is sharp—this is essentially a temporalised version of the 'is-ought' problem mixed with a radical view of personal identity—but she's making a category mistake that lets her slide from "promises are tricky" to "promises are impossible."

  You want to keep (3), the Consent Principle. Good instinct. It's a vital bulwark against tyranny. You also want to reject (8), because if she's right, you're not actually bound to drive her to the station, and she'll miss her train.

  Here is where you can push back without throwing (3) under the bus. The weak link isn't (3); it's **(5)**, and the assumption about personal identity hiding inside it.

  ### The Attack on Step (5): The "Time-Slice" Error

  Step (5) says: *My present utterance is not my future self's consent. She said nothing.*

  This relies on a view of personal identity called 'perdurantism' or 'stage theory', where you are essentially a series of distinct temporal slices (You-at-8pm, You-at-8am) loosely glued together by memory and biology. If you treat You-Tonight and You-Tomorrow as effectively different people, then yes, promising is impossible. You-Tonight cannot bind You-Tomorrow any more than I can bind you.

  But here's the cost of accepting that: **Prudential rationality collapses.**

  If You-Tomorrow is a different person to You-Tonight, why should You-Tonight brush their teeth? Why should You-Tonight save money for You-Tomorrow's retirement? On her view, looking after your future self is an act of altruism towards a stranger, not self-interest. Most philosophers (and indeed, most people getting on with life) reject this. We operate on a view of **narrative identity**. We treat ourselves as continuous agents over time.

  If you accept that you are the *same agent* tomorrow as you are tonight, then your consent *does* extend. When you say "I promise," you are exercising your agency as a temporally extended being. You aren't binding a stranger; you are binding yourself.

  So, you can keep (3) intact. You *did* consent. You just consented as a continuous entity. The "future self" isn't a silent victim; she's the same person who spoke, just later in the timeline.

  **The Price:** You have to commit to a robust view of personal identity. You have to say, "I am the same person tomorrow as I am tonight, normatively speaking." If she pushes back and says, "But what if I change my mind? What if I'm a different person then?" you reply: "Changing your mind is something a *single* person does. If you were a different person, it wouldn't be a change of mind, it would be a different mind entirely."

  ### The Alternative: Saving (3) via Institutional Consent

  If you don't want to get bogged down in metaphysics about whether you're the same person, there's a second way to save (3). It involves reinterpreting *what* is being consented to.

  When you engage in the practice of promising, you are entering a social institution (like money, or chess). By choosing to use the words "I promise," you are implicitly consenting to the **rules of the institution**.

  Think of it like stepping onto a football pitch. You haven't signed a contract for this specific match, but by playing the game, you consent to the rules of the FA. If you pick up the ball, you've broken the rules.

  Applied to your flatmate:
  1.  We live in a society where promising is a recognised tool for coordination.
  2.  By using the performative "I promise," you are voluntarily invoking that tool.
  3.  Therefore, you consent to the normative consequences of using that tool.

  This preserves (3). You aren't being bound without consent; you consented to the *mechanism* of binding when you opened your mouth.

  **The Price:** You have to admit that the obligation comes partly from the **social practice**, not just from your individual will. It makes promising a bit more like money (which she mocked). But remember: money is normatively real enough to buy your dinner. Just because something is a social construct doesn't mean it's "pretend."

  ### The Circularity Claim

  Now, about her final boast: that (3) and the performative prop each other up, so attacking either brings the house down.

  She's half-right, but she's drawing the wrong conclusion. She thinks this circularity makes them fragile. Actually, it makes them **foundational**.

  In philosophy, this is close to what Wittgenstein called a "form of life" or what Searle called "constitutive rules." The statement "I consent" only works *because* we accept the principle that consent creates obligation. And we accept that principle *because* we have speech acts like "I consent."

  This isn't a vicious circle; it's a **reflective equilibrium**. It's like the rules of grammar. You can't use grammar to prove grammar is valid; you just have to use it to speak at all.

  She claims this mutual support makes them "normatively inert." That's nonsense. It makes them **self-validating within the system**. If you step outside the system (like she's trying to do from the washing-up bowl), of course it looks like magic. But we don't live outside the system. We live in it.

  If she says, "But why should I care about the system?" you say: "Because you want to live in a world where people drive you to the station when they say they will. If you opt out of the system, you opt out of the benefits."

  ### How to Handle the Washing Up

  Here is your line of argument for tomorrow morning, whilst you're making the tea:

  1.  **Grant (1) and (3).** Tell her you're keeping the Consent Principle. It's too important to lose.
  2.  **Strike at (5).** Tell her she's treating your future self like a stranger. "If I'm not the same person tomorrow, why am I brushing my teeth tonight? If you're right, prudence is impossible. I'm not binding a stranger; I'm binding me."
  3.  **Address the "Pretend Money" insult.** Remind her that money is also a collective fiction, but she'll still expect her rent to be paid in it. Social constructs have real normative force if we agree to uphold them.
  4.  **On the Circularity:** Tell her she's confused *foundational* with *fake*. "I consent" works *because* we accept the principle. That doesn't make it noise; it makes it the bedrock of cooperation.

  **The Verdict:**
  Reject (5). It's the most expensive step. If she insists on it, she has to explain why she bothers making *any* plans for her future, including her Masters degree. If she can bind her future self to write a thesis, she can bind her future self to get in the car.

  And if she still refuses? Well, you're normatively bound to drive her, but perhaps you're not bound to be cheerful about it. Just mind the tram lines on the way to the station.
