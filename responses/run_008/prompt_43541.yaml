  6.  **Refining the Philosophy:**
      *   *Personal Identity:* The flatmate is treating time-slices as separate people. This is the "Parfitian" reductionist view taken to an impractical extreme. If we accept that, *nothing* matters (prudential concern collapses). So, reject (5) on pragmatic/normative grounds. We *treat* ourselves as continuous agents.
      *   *Consent:* Distinguish between "consent to the specific act" and "consent to the mechanism." By entering the practice of promising, you consent to be bound. This preserves (3).
      *   *The Circularity:* She's wrong. It's not circular; it's foundational. Normative facts aren't physical facts. They depend on our acceptance of them. That doesn't make them fake (like money), it makes them *institutional*. Money is real enough to buy bread; promises are real enough to build trust.

  7.  **Checking British English:**
      *   "Flatmate" (not roommate).
      *   "Washing up" (not dishes).
