answer: |-
  This is a sharp dissection of the link between market mechanics and epistemic norms. You are right to sense a gap between what prediction markets *do* (enforce price coherence via arbitrage) and what the Dutch Book Argument (DBA) *claims* (that incoherent credences are irrational).

  The short answer is: The market practice presupposes **instrumental rationality** (profit maximization) and **arbitrage capacity**, but it does not strictly presuppose **epistemic rationality** (coherent belief) or the strong psychological assumptions of the classical DBA. The DBA is a philosophical reconstruction of the market mechanism, not a description of it.

  Here is the reconstruction of what the practice strictly presupposes versus what is merely compatible, followed by the settled/contested landscape.

  ### 1. Strict Presuppositions: What the Market Actually Needs
  For a prediction market to snap prices back to coherence (summing to 1), the following conditions must hold. Notice how few of them involve "belief."

  *   **Existence of a Risk-Neutral Marginal Trader:** The market does not require all agents to have linear utility for money. It requires only that *some* agent (the arbitrageur) has enough capital and low enough risk aversion at the relevant margin to treat small price discrepancies as free money. If everyone were maximally risk-averse, the book could remain incoherent indefinitely.
  *   **Frictionless Execution:** The profit from dutching must exceed transaction costs (fees, slippage, time value of money). The "vig" (overround) is essentially the friction buffer. Coherence is only enforced *outside* the vig.
  *   **Substitutability of Contracts:** The arbitrageur must be able to buy the complementary contracts simultaneously or near-simultaneously. If the bookmaker can pull one leg of the bet before the other is placed, the Dutch book fails.
  *   **Profit Motive, Not Belief:** The bookmaker does not need to believe the odds reflect true frequencies. They only need to desire to minimize inventory risk. If a book is unbalanced (e.g., too much money on Outcome A), they shorten odds on A not because they think A is more likely, but because they want to discourage further exposure. Arbitrageurs force the *sum* to 1; bookmaker risk management forces the *distribution* to match liquidity.

  **Verdict:** The practice strictly presupposes **financial coherence**, not **probabilistic coherence**. It proves that incoherent *pricing* is unsustainable in competitive markets, not that incoherent *belief* is irrational.

  ### 2. The DBA Overlay: What Fits Well But Isn't Required
  The classical Dutch Book Argument maps onto this practice, but it imports extra baggage that the market does not need.

  *   **The Identification of Price and Credence:** The DBA assumes an agent's betting price *is* their degree of belief. The market does not require this. A market price is an aggregation of information, incentives, and liquidity constraints. A price of 0.80 might reflect a 90% belief held by a cash-constrained trader, or a 50% belief held by a trader with inside information and deep pockets. The market enforces coherence on the *price*, regardless of the underlying *credence*.
  *   **The Normative Leap:** The DBA concludes that you *ought* to have coherent credences to avoid irrationality. The market only demonstrates that you *will lose money* if you post incoherent prices. This is a pragmatic sanction, not a normative one. You can be epistemically incoherent (holding contradictory beliefs) as long as you don't express them in a wager book that others can access.
  *   **Linearity of Utility:** As you noted, the classical DBA assumes linear utility. The market bypasses this by relying on the *arbitrageur*. Even if the bookmaker has non-linear utility, the arbitrageur (acting as the "market correction mechanism") effectively imposes linearity on the pricing structure because they will exploit any deviation until the expected value of the arb is zero.

  ### 3. Solving the Casino Puzzle
  Your casino example is the wedge that separates the normative DBA from the descriptive market reality.

  *   **The House Edge vs. Dutch Book:** A casino book is coherent (from the house perspective). The odds sum to >1 (e.g., 1.05). This is not a Dutch Book vulnerability; it is a fee. The casino is not offering fair odds.
  *   **The Gambler's Incoherence:** Gamblers often hold incoherent beliefs (e.g., gambler's fallacy). The casino profits from this. Does this prove the gamblers are irrational?
      *   **Market View:** No. It proves they have a preference for entertainment or risk-taking that outweighs the expected monetary loss. They are paying for utility, not buying truth.
      *   **DBA View:** Yes, if we define rationality strictly as maximizing expected monetary utility based on coherent credences.
  *   **Resolution:** The market practice supports the view that **incoherence is a cost**, not that it is a sin. Casinos monetize the gap between the gambler's incoherent credences and the coherent market prices. The "rationality" the market enforces is **survival of the fittest capital**. Incoherent agents transfer wealth to coherent agents. This is an evolutionary argument for rationality, not a logical one.

  ### 4. Settled vs. Contested
  Here is where the philosophy of probability and economics stands on these issues.

  #### Settled (Among Experts in Mechanism & Logic)
  1.  **Synchronic Coherence is Enforceable:** It is settled that static Dutch books (incoherence at a single time $t$) are arbitraged away in liquid markets. If $P(A) + P(\neg A) < 1$, money pump exists. Markets eliminate this.
  2.  **Prices $\neq$ Beliefs:** It is widely accepted in market microstructure that prices are not pure reflections of belief. They reflect beliefs *weighted by wealth and confidence*. (Keynes's "Beauty Contest" analogy holds).
  3.  **Risk Neutrality is Local:** It is settled that arbitrageurs act *as if* risk-neutral for small discrepancies, even if they are risk-averse globally. This is sufficient for the mechanism.

  #### Contested (The Real Fights)
  1.  **The Diachronic Dutch Book (Conditionalization):**
      *   *The Claim:* If you don't update beliefs via Bayes' Rule, you can be Dutch-booked over time.
      *   *The Market Reality:* Markets **do not** enforce Bayesian updating. A market price can drift from 0.4 to 0.6 and back to 0.4 without any new information, simply due to liquidity shocks or noise trading. As long as there is no *static* arbitrage opportunity at any given moment, the market is "coherent."
      *   *The Fight:* Philosophers (like David Lewis) argue diachronic DBA proves Bayesianism is rational. Market practitioners and some philosophers (like Bas van Fraassen) argue that updating rules are pragmatic, not logically mandated by coherence alone. The market does not settle this; it allows non-Bayesian price movements constantly.
  2.  **The Interpretation of Probability:**
      *   *De Finetti/Subjective:* Prices reveal subjective credences.
      *   *Hayek/Information:* Prices reveal dispersed information (objective frequencies).
      *   *Contest:* When a market is coherent but wrong (e.g., Intrade predicting Romney in 2012), was it "irrational"? Subjectivists say no (it was coherent with available info). Frequentists say yes (it was miscalibrated). The market mechanism itself is agnostic; it only enforces internal consistency, not external accuracy.
  3.  **Limits to Arbitrage:**
      *   Standard theory says arb eliminates incoherence. Behavioral finance contests this, noting that "noise trader risk" can keep prices incoherent for long periods because arbitrageurs are capital-constrained or fear fundamental risk. The "Law of One Price" holds in theory, but frictions (margin requirements, shorting constraints) mean markets can remain "irrational" longer than the DBA suggests.

  ### Summary
  The practice of bookmaking and prediction markets presupposes **financial consistency**, not **epistemic rationality**.

  *   **Strictly Presupposed:** That there exists at least one agent with capital and a preference for more money over less who can execute trades quickly.
  *   **Merely Compatible:** That prices represent degrees of belief, or that agents maximize expected utility in the von Neumann-Morgenstern sense.
  *   **The Normative Gap:** The market shows that incoherence is *expensive*, not that it is *illogical*. The Dutch Book Argument takes this economic vulnerability and reframes it as a logical defect of the agent's mind. That is a valid philosophical move, but it is not one the market itself makes. The market is happy to let you keep your incoherent beliefs, provided you don't try to monetize them against a better-capitalized opponent.

  The diachronic DBA remains the weakest link; markets enforce static coherence fiercely, but they have no mechanism to enforce Bayesian updating, leaving the rationality of belief revision a genuinely open philosophical fight.
