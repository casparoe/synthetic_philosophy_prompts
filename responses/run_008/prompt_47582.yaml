answer: |-
  Here is a complete lesson plan designed to execute your pedagogical goals. It structures the 75 minutes to force the specific epistemic shifts you want: from intuition to arithmetic, from meat to crops, and from counting to weighing.

  # Activity Title: The Harm Minimization Committee

  **Class Size:** 20 Students
  **Grouping:** 4 Groups of 5 Students
  **Time:** 75 Minutes
  **Goal:** To demonstrate the counter-intuitive arithmetic of animal deaths per calorie/serving and the inevitability of collateral crop damage, forcing a confrontation with moral weighting.

  ---

  ## 1. Preparation & Materials

  **Room Setup:** 4 tables arranged in a cluster. Whiteboard or projector for the final tally.
  **Handouts:**
  1.  **Role Cards** (1 set per group).
  2.  **Data Packet A: Livestock Metrics** (Distributed at Minute 15).
  3.  **Data Packet B: Crop & Field Metrics** (Distributed at Minute 35).
  4.  **Decision Worksheet** (One per group).

  **The Data (Plausible Round Numbers):**
  *Note: These numbers are simplified for in-class calculation but preserve the real-world ratios.*

  *   **Beef:** 1 Steer yields 400kg edible meat. Serving size = 250g. (1 Steer = 1,600 servings).
  *   **Chicken:** 1 Broiler yields 2kg edible meat. Serving size = 250g. (1 Chicken = 8 servings).
  *   **Wheat/Soy (Plant Base):** 1 Hectare yields 4,000 servings (protein equivalent).
  *   **Field Deaths:** Harvesting 1 Hectare of grain kills 200 small animals (rodents, birds, reptiles, invertebrates).

  ---

  ## 2. Group Structure & Roles

  Assign these roles within each group to prevent "hijacking" by the loudest student and ensure the math gets done.

  1.  **Chair:** Keeps time, ensures everyone speaks, manages the handouts (do not open Packet B early).
  2.  **Actuary:** Responsible for all calculations (deaths per serving).
  3.  **Nutritionist:** Ensures the menu meets the protein constraint (all options provided are protein-equivalent, so their job is to verify the math matches the servings).
  4.  **Scribe:** Drafts the one-paragraph public justification.
  5.  **Public Liaison:** Will present the group's final ranking to the class.

  ---

  ## 3. The Timeline (75 Minutes)

  ### Phase 1: The Intuitive Baseline (0:00 – 0:15)
  *   **0:00–0:05 (Instructor Intro):** Frame the scenario. "You are the Ethics Committee for Campus Dining. The University has mandated that the *default* daily entrée must be the option that minimizes animal harm. You are not banning choice; students can swap, but the default shapes 80% of consumption. Your goal is strictly harm reduction."
  *   **0:05–0:15 (The Pre-Data Vote):** Ask groups to rank **Beef, Chicken, and Plant-Based** from *Least Harmful* to *Most Harmful* based purely on their current moral intuition.
      *   *Instruction:* "Do not calculate yet. Write down your ranking and one sentence explaining why."
      *   *Expected Result:* Most will rank Plant < Chicken < Beef.
      *   *Collect these sheets.* Do not look at them yet. Tell them these will be returned at the end.

  ### Phase 2: The Meat Math (0:15 – 0:35)
  *   **0:15:** Distribute **Data Packet A** (Livestock Metrics only).
  *   **0:15–0:25 (Calculation):** Groups calculate **Deaths Per Serving**.
      *   *Beef:* 1 death / 1,600 servings = **0.000625 deaths/serving**.
      *   *Chicken:* 1 death / 8 servings = **0.125 deaths/serving**.
      *   *Ratio:* One serving of chicken implicates **200x more deaths** than one serving of beef.
  *   **0:25–0:30 (The First Pivot):** Ask groups to re-rank *only the meat options* based on this data.
      *   *Trigger:* Ask the Public Liaisons: "If your only goal is minimizing the count of deaths, which meat is the ethical choice?"
      *   *Reveal:* They must admit Beef is mathematically superior to Chicken regarding death count.
  *   **0:30–0:35 (Tension):** Ask: "Does this feel right? Why does it conflict with your intuition?" (Brief pair-share). Do not resolve this yet.

  ### Phase 3: The Crop Complication (0:35 – 0:50)
  *   **0:35:** Distribute **Data Packet B** (Crop & Field Metrics).
      *   *Crucial Instruction:* "You now have the data for the Plant-Based option. You must integrate this into your final menu."
  *   **0:35–0:45 (Calculation):** Actuary calculates Plant Deaths Per Serving.
      *   *Math:* 200 deaths / 4,000 servings = **0.05 deaths/serving**.
      *   *Comparison:*
          *   Beef: 0.0006 (Lowest count)
          *   Plants: 0.05 (Middle count, but different *kind* of animal)
          *   Chicken: 0.125 (Highest count)
  *   **0:45–0:50 (The Second Pivot):**
      *   *Trigger:* "You can no longer claim zero harm. The plant option kills small animals. The beef option kills fewer animals total, but they are large. The chicken option kills the most."
      *   *Task:* The group must now choose the **Single Default Entree** for the week. They cannot say "it depends." They must pick one.

  ### Phase 4: The Weighting Problem & Justification (0:50 – 1:05)
  *   **0:50–1:00 (Deliberation):** Groups finalize their choice.
      *   *Constraint:* They must write a 1-paragraph **Public Justification** to be posted in the dining hall.
      *   *The Trap:* The prompt requires them to explain *why* they chose their option despite the data.
          *   If they choose **Beef**: They must justify why 1 cow death is preferable to 200 field mouse deaths (or admit they are prioritizing death count over sentience).
          *   If they choose **Plants**: They must justify why field deaths are morally negligible compared to livestock deaths, despite the arithmetic.
          *   If they choose **Chicken**: They have failed the math (unlikely, but possible if they argue suffering duration).
  *   **1:00–1:05 (Preparation):** Liaisons prepare to state their choice and read their justification.

  ### Phase 5: The Debrief (1:05 – 1:15)
  *   **1:05–1:10 (Report Out):** Each Liaison states their choice. (Expect a split between Beef and Plants).
  *   **1:10–1:15 (Instructor Synthesis):** Map the activity to the three philosophical problems (see Debrief Script below).

  ---

  ## 4. The Data Sheets

  ### Data Packet A: Livestock Metrics
  *   **Option 1: Beef Stew**
      *   Source: Cattle raised on pasture, finished on grain.
      *   Yield per Animal: 400 kg edible meat.
      *   Standard Serving: 250 grams.
      *   Lifespan: 18–24 months.
  *   **Option 2: Chicken Stir-Fry**
      *   Source: Industrial broiler chickens.
      *   Yield per Animal: 2 kg edible meat.
      *   Standard Serving: 250 grams.
      *   Lifespan: 6–7 weeks.
  *   **Budget Constraint:** Both options are subsidized equally. Cost is not a factor.

  ### Data Packet B: Crop & Field Metrics
  *   **Option 3: Lentil & Grain Bowl (Plant-Based)**
      *   Source: Mechanized harvest of grains and legumes.
      *   Yield per Hectare: 4,000 servings (protein equivalent).
      *   **Collateral Mortality:** Harvesting 1 Hectare results in the death of 200 small animals (field mice, voles, ground-nesting birds, insects).
      *   *Note:* These deaths are unintended but statistically inevitable with current technology.
      *   Lifespan of Field Animals: Variable (weeks to years).

  ### Decision Worksheet
  1.  **Initial Intuition Ranking:** (Least Harmful → Most Harmful)
  2.  **Calculated Deaths Per Serving:**
      *   Beef: _______
      *   Chicken: _______
      *   Plants: _______
  3.  **Final Committee Decision:** ___________________
  4.  **Public Justification (Draft):** (Must address the death counts calculated above).

  ---

  ## 5. The Debrief Script (Instructor Notes)

  *Do not simply give the answers. Use their choices to drive the theory.*

  **1. The Beef/Chicken Inversion (Utilitarian Arithmetic)**
  *   "How many groups ranked Chicken as more ethical than Beef initially? (Show of hands). How many kept that ranking after seeing the math?"
  *   **Point:** This illustrates the **Scale Insensitivity** of our moral intuition. We focus on the *size* of the victim (cow vs. chicken) rather than the *frequency* of the killing. If our metric is 'minimize deaths,' beef is objectively superior to chicken. If our metric is 'minimize suffering,' the short, miserable life of a broiler might outweigh the longer life of a steer. The arithmetic forces you to specify your metric.

  **2. The Crop Complication (The Non-Zero Baseline)**
  *   "For those who chose the Plant option: Did you count the mice? For those who chose Beef: Did you use the mice to justify the cow?"
  *   **Point:** This dismantles the **Purity Fallacy**. There is no option that does not participate in the death of sentient beings. Ethics is not about having clean hands; it is about choosing which harm is more defensible. This introduces the problem of **Collateral Damage** vs. **Intentional Killing**. Does intent matter if the outcome (death) is the same?

  **3. The Moral Weights (The Missing Variable)**
  *   "The data sheet gave you numbers, but it didn't give you a conversion rate. Is 1 Cow Death = 200 Mouse Deaths? Is 1 Week of Chicken Suffering = 1 Year of Cow Suffering?"
  *   **Point:** Arithmetic dramatizes the problem, but it cannot solve it. You need a **Moral Weighting Function**. Utilitarianism requires a common currency (e.g., 'sentience units' or 'pain hours'). We don't have that data. This is where philosophy begins, where the math ends.

  **4. Limitations of the Model (Crucial Caveats)**
  *   "Two things this activity lied to you about:"
      1.  **Market Causality:** "You assumed choosing Beef today saves 200 chickens tomorrow. In reality, markets are buffered. One meal doesn't kill an animal; marginal demand shifts over time do. The arithmetic is real, but the causal link is probabilistic."
      2.  **The 'Default' Power:** "We assumed the default sticks. In reality, if you serve Beef as the 'ethical' default, students might rebel and buy Chicken à la carte, worsening the outcome. Policy ethics must account for human psychology, not just abstract math."

  ---

  ## 6. Troubleshooting: Predictable Failure Modes

  **Failure Mode 1: The Moral Refusal**
  *   *Symptom:* A group refuses to engage with the math, stating, "Killing animals is wrong, period. We choose Plants and ignore the mice."
  *   *Handle:* Validate the deontological stance, but enforce the constraint. "If you are on this committee, you cannot resign. You must set the default. If you choose Plants, you are authorizing the death of 200 mice per hectare. You are responsible for that number. How do you justify *that* specific number to the public?" Force them to own the collateral damage.

  **Failure Mode 2: Math Paralysis**
  *   *Symptom:* The Actuary gets stuck on decimals (0.000625 vs 0.05).
  *   *Handle:* Intervene at Minute 25. "Normalize the numbers. If Beef = 1 death, how many chickens die for the same amount of food? (Answer: 200). If Beef = 1 death, how many field animals die? (Answer: ~80). Use ratios, not decimals."

  **Failure Mode 3: The 'Suffering' Dodge**
  *   *Symptom:* Students argue "Chickens suffer more" to avoid the death count conclusion.
  *   *Handle:* This is a valid philosophical move, but call it out. "You are shifting the metric from 'Death Count' to 'Suffering Duration.' That is allowed, but you must admit your initial intuition was based on size, not suffering. Write that distinction in your justification."

  **Failure Mode 4: Cynicism**
  *   *Symptom:* "This is rigged. There's no right answer, so why bother?"
  *   *Handle:* "Exactly. The point of applied ethics is not to find the perfect answer, but to navigate the imperfect ones with clarity. If you leave here thinking 'eating is complicated,' the activity worked. If you leave thinking 'beef is good,' it failed."

  ---

  ## 7. Instructor Checklist for Success

  *   [ ] **Print Data Packets Separately:** Do not staple Packet A and B together. You must physically control the flow of information to stage the reveals.
  *   [ ] **Monitor the "Chicken" Trap:** Walk around during Phase 2. If a group says "Chicken is better because cows are bigger," stop them. "Bigger how? Calculate the servings."
  *   [ ] **Collect the Intuition Sheets:** Ensure you actually collect the Phase 1 sheets. Returning them at the end provides a powerful visual of how their reasoning shifted (or didn't).
  *   [ ] **Time Management:** Be ruthless at Minute 35. Even if they haven't finished the meat math, force the transition to Plants. The pressure mimics real policy constraints.

  This design ensures the students generate the tension themselves. You are not telling them that crop deaths exist; they are finding it in the spreadsheet. You are not telling them Beef kills fewer individuals; they are calculating it. The discomfort they feel is the pedagogical engine.
