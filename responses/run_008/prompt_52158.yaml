answer: |-
  **Desiderata for a Theory of the Perception/Cognition Border**

  1.  **Phenomenal Stubbornness (Non-negotiable)**
      *   *Motivation:* The Müller-Lyer illusion persists even after measuring the lines. You believe they are equal; they look unequal.
      *   *Requirement:* The theory must explain why occurrent beliefs fail to overwrite specific perceptual outputs in immediate contexts.

  2.  **Expertise Plasticity (Non-negotiable)**
      *   *Motivation:* Radiologists see fractures in gray mush; chess masters see "weak squares"; language speakers discriminate blue shades faster based on lexical boundaries.
      *   *Requirement:* The theory must accommodate long-term cognitive history (training, language) genuinely altering perceptual content or access, without collapsing into "all perception is theory-laden."

  3.  **Mechanistic Distinction (Non-negotiable)**
      *   *Motivation:* Confusing top-down attention (looking harder at a region) with penetration (the region looking different) renders the debate verbal.
      *   *Requirement:* The theory must distinguish *selection* (attention) from *alteration* (penetration), and *state changes* (current belief) from *system changes* (rewiring via training).

  4.  **Epistemic Consequence (Camp Preference)**
      *   *Motivation:* Empiricists claim perception justifies belief only if it is neutral. If cognition penetrates perception, justification circles.
      *   *Requirement:* The theory must specify whether penetration undermines evidential neutrality. *Note:* Empiricists require neutrality; Coherentists do not. This is a philosophical preference, not empirical data.

  5.  **Temporal Dynamics (Non-negotiable)**
      *   *Motivation:* The "Rate of Change" wrinkle. A system counts as perceptual iff beliefs cannot revise it within a single episode, even if months of training can.
      *   *Requirement:* The theory must treat timescale as a constitutive feature of the border, not merely a side effect.
      *   *Verdict on Wrinkle:* This is a **standalone requirement**, not a restatement of Plasticity. Plasticity notes *that* change happens; Temporal Dynamics defines *how fast* change must occur to count as cognitive vs. perceptual. It operationalizes the border.

  **Incompatible Pairs & Tensions**

  *   **Stubbornness vs. Plasticity:** These appear contradictory. How can perception be impenetrable to belief (Müller-Lyer) yet penetrable by training (Radiologist)? A theory must explain why the "membrane" is rigid in milliseconds but malleable over months. Failure to resolve this renders the theory ad hoc.
  *   **Plasticity vs. Epistemic Neutrality:** If expertise (cognitive history) shapes perception, the radiologist's input is not neutral relative to the novice's. Satisfying Plasticity threatens the Empiricist version of Requirement 4. You likely cannot satisfy strong Epistemic Neutrality and strong Expertise Plasticity simultaneously.

  **Summary**
  A viable theory must treat the border as dynamic (Requirement 5) to reconcile immediate immunity (Requirement 1) with long-term plasticity (Requirement 2). It must clarify mechanisms (Requirement 3) to avoid category errors. Finally, it must acknowledge that satisfying these empirical constraints may force a rejection of strong epistemic foundationalism (Requirement 4).
