answer: |-
  This is an exceptionally sharp diagnosis. You have intuitively reconstructed the typology that professional historians of economic thought and mechanism design theorists use to dissect the Socialist Calculation Debate (SCD). Your supply chain background gives you a specific advantage here: you recognize that Lange's "trial and error" is essentially a description of an iterative solver trying to find a shadow price vector, and you recognize the constraints of data integrity and objective function specification.

  Here is a diagnosis of the debate's structure, an evaluation of your three-way split, a map of what is actually settled versus contested, and a definition of what progress looks like.

  ### 1. Diagnosis: Is the Debate Substantive, Verbal, or Cross-Purpose?

  The debate is primarily **cross-purpose**, underpinned by a **substantive epistemological disagreement**.

  It is not merely verbal (semantics), because the stakes involve real resource allocation. However, the participants were often solving different mathematical and philosophical problems while using the same labels ("price," "calculation," "socialism").

  *   **Mises (1920):** Argued from **Praxeology**. His claim was ontological: without private property in capital goods, there are no exchanges, and without exchanges, there are no money prices. Without money prices, there is no common denominator to compare heterogeneous inputs. Therefore, *economic calculation is logically impossible.* He was arguing Question (1).
  *   **Lange (1936):** Argued from **Neoclassical Equilibrium**. He accepted the Walrasian framework where an auctioneer finds equilibrium prices. He argued a Planning Board could *simulate* the auctioneer using trial and error (gradient descent). He thought he answered Mises on Question (1) by saying, "Yes, the equations are solvable."
  *   **Hayek (1935-1945):** Shifted the ground to **Epistemology**. He argued Lange solved the wrong problem. Equilibrium models assume the data (preferences, technologies) are *given* to the solver. Hayek argued the economic problem is not how to allocate *given* resources, but how to utilize knowledge *not given to anyone in its totality*. He was arguing Question (2).

  **The Verdict:** You are correct that the debate stalls because libertarians often argue (1) or (3) while Marxists argue (1) using modern compute, while Hayekians are screaming about (2). When your cousin talks about incentives (3) and your housemate talks about compute power (1), they are playing different sports.

  ### 2. Evaluating Your Three-Way Split

  Your tripartite distinction is robust and aligns with modern mechanism design theory. Here is how they interact:

  **(1) Calculation in Principle (Solvability)**
  *   **Status:** *Mathematically settled, practically contested.*
  *   **Analysis:** In a static model, the answer is "Yes." Arrow-Debreu proved general equilibrium exists under specific conditions. Linear Programming can solve for millions of variables. Lange was technically right that the system of equations *can* be written.
  *   **The Catch:** An economy is not a static optimization problem; it is a dynamic, non-ergodic process. LP solvers optimize a *given* objective function against *given* constraints. In a national economy, both the objective function (what do we value?) and the constraints (what is possible?) are endogenous and constantly changing.
  *   **Supply Chain Analogy:** You can solve for optimal inventory levels *if* you know the demand distribution. If the demand distribution changes because you changed the price, the solver breaks.

  **(2) The Knowledge Problem (Information)**
  *   **Status:** *The core substantive disagreement.*
  *   **Analysis:** This is Hayek's contribution. It is not just about bandwidth or storage (engineering); it is about **tacit knowledge**. Can a local manager articulate *why* a machine is likely to break next week into a data field? Can a consumer articulate their substitution elasticity in a survey?
  *   **Separability:** This is not fully separable from (1). If knowledge is tacit (cannot be codified), it cannot be input into the solver. Therefore, the system is not specifiable, returning us to (1).
  *   **Empirical Question:** How much economic knowledge is codifiable vs. tacit? This is an empirical question about cognitive science and organizational behavior that remains open.

  **(3) The Incentive Problem (Mechanism Design)**
  *   **Status:** *Distinct but often conflated.*
  *   **Analysis:** Mises touched on this, but the Public Choice school (Buchanan, Tullock) and Mechanism Design (Hurwicz, Maskin, Myerson) formalized it. Even if the Planner *could* solve the equations (1) and *did* have the data (2), would agents report truthfully?
  *   **Separability:** This is theoretically separable. You can have a world with perfect information but bad incentives (sabotage), or good incentives but dispersed knowledge. However, in practice, incentives drive information quality. If lying is profitable, the data fed into the solver is garbage (GIGO).

  **Critique of your split:** It is fair, but you should note that (2) and (3) often merge into a **Communication/Protocol Problem**. In mechanism design, the question is: "Can we design a protocol where truth-telling is the dominant strategy *and* the communication load is manageable?"

  ### 3. What is Settled vs. What is Contested?

  This is where you need to be careful with your cousin and housemate. Both sides frequently present contested claims as settled.

  **Broadly Settled (among technical economists):**
  *   **Lange was right about the math:** It is possible to formulate a socialist allocation problem as a system of equations. The claim that it is *mathematically* impossible is false.
  *   **Hayek was right about information:** The "data" of the economy are not objective constants waiting to be measured; they are subjective and dispersed. Information economics (Stiglitz, Akerlof, etc.) accepts the premise of asymmetric and dispersed information as standard.
  *   **Incentives matter:** The "New Mechanism Design" consensus is that you cannot ignore incentive compatibility. A plan that requires altruism to function is not robust.
  *   **Mises was wrong about "Impossible":** It is not *logically* impossible to calculate without markets; it is just computationally and informationally difficult. (Mises later softened this to "impracticable," but the hard line is rejected).

  **Genuinely Contested (The Live Debate):**
  *   **The "Compute" Claim:** Your housemate's claim that "Big Data/AI solves Hayek" is **contested**.
      *   *Argument For:* Machine learning can infer preferences from behavior without asking, reducing the tacit knowledge barrier.
      *   *Argument Against:* ML predicts based on past data. It cannot price *novel* capital goods or handle radical uncertainty (Knightian uncertainty). It solves the *coordination* of knowns, not the *discovery* of unknowns.
  *   **Market Socialism Stability:** Can a system with state-owned firms but market prices (the Yugoslav model or Lange's model) reach a stable equilibrium, or will soft budget constraints (Kornai) lead to chronic shortages? Empirical evidence is mixed and context-dependent.
  *   **The Firm Boundary:** If central planning is impossible, why do firms exist? (Coase). Firms *are* islands of central planning. The debate is now about *scale*. Where is the limit? Supply chain analytics works inside firms. Does it work for the whole economy? We don't know the scaling law.

  ### 4. What Would Count as Progress?

  The debate hasn't moved because both sides keep re-arguing 1930s positions. Progress requires shifting the framework.

  **A. Mechanism Design (The Formal Progress)**
  The Nobel Prize work of Hurwicz, Maskin, and Myerson *is* the modern resolution of the SCD. They formalized the constraints.
  *   **Progress looks like:** Proving "Impossibility Theorems" for specific classes of planning mechanisms. Instead of "Socialism is impossible," it's "Any mechanism that satisfies X and Y constraints requires Z amount of communication, which exceeds channel capacity."
  *   **Why it stalls:** It's too technical for political debate. Your cousin and housemate want moral/political verdicts, not constraint bounds.

  **B. Complexity Economics (The Empirical Progress)**
  Treating the economy as a Complex Adaptive System (CAS) rather than a linear optimization problem.
  *   **Progress looks like:** Agent-Based Modeling (ABM). Simulating millions of agents with local rules and seeing if central directives emerge or collapse.
  *   **Why it stalls:** ABM results are sensitive to initial parameters. You can tune a model to show planning works, or tune it to show it fails.

  **C. The "Firm" Analogy (The Supply Chain Progress)**
  This is your wheelhouse.
  *   **Progress looks like:** Analyzing the **scaling laws of planning**.
  *   We know firms plan internally. Amazon is a planned economy of 1.5 million people. It uses LP solvers. It uses internal transfer prices.
  *   **The Question:** Is Amazon's internal planning successful *because* it is anchored to external market prices? If Amazon were the whole world, would its internal solvers diverge?
  *   **Result:** If we can quantify the "market anchor" requirement for internal firm planning, we settle the Hayekian critique empirically.

  ### 5. Summary for Your Debate

  When you go back to your cousin and housemate, here is how you can reframe the stalemate:

  1.  **To the Libertarian Cousin:** "You're arguing Incentives (3), but Lange solved Calculation (1). You need to argue Hayek's Knowledge problem (2). Also, admit that firms *do* plan successfully internally, so 'planning' isn't inherently impossible, just scale-limited."
  2.  **To the Marxist Housemate:** "You're arguing Computation (1), but Hayek never said computers were too slow; he said the data doesn't exist in a codifiable form (2). Big Data helps, but it doesn't solve the problem of pricing capital goods that have never existed before (innovation)."
  3.  **The Synthesis:** "The debate isn't about whether we *can* solve the equations. It's about whether the **objective function** can be defined without market prices, and whether the **constraint coefficients** can be gathered without distorting incentives. That is an empirical question about information topology, not a philosophical one."

  **Final Diagnosis:** The debate is stalled because it is a **category error**. Mises was doing philosophy of action; Lange was doing welfare economics; Hayek was doing epistemology. They were never answering the same question. Progress requires admitting that "Socialist Calculation" is not a single binary switch, but a continuum of **information processing and incentive alignment** that varies by industry, technology, and scale.

  **What is settled:** You cannot ignore prices as information signals.
  **What is contested:** Whether non-market signals (algorithmic, democratic, ecological) can substitute for prices at scale without catastrophic efficiency loss.

  Your intuition about the three questions is correct. The literature respects that distinction now, even if the popular debaters do not. You haven't invented a clean distinction; you've rediscovered the structure that mechanism design theorists have been working in for 40 years.
