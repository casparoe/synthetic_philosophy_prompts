prompt: |-
  I teach an intro stats course for social science undergrads — about 25 students, one 75-minute session, whiteboard and printed handouts but no laptops. Design an in-class activity for Simpson's paradox. My friend (we argued about this for like two hours last friday, he also teaches stats at a different school) insists the right move is to just show them a famous real-world case on a slide and let the reversal do the work — his claim is basically that once you've seen a trend flip once, the idea "clicks" and you don't need anything else. I think that's wrong, and it's kind of the reason I'm asking you: I want the reversal to happen TO them, in data they themselves produced or at least committed to judgments on before seeing the breakdown. So the activity should front-load a decision they make on the aggregate numbers — with real stakes somehow, maybe a ranking they have to defend publicly, or points, I don't know, you figure out something that works without money — and only then hand them the disaggregated version and let them discover that their confident call doesn't survive.

  Two design constraints from the argument with my friend, feel free to push back on either. First, I think a fictional or neutral scenario (made-up departments, made-up treatments, whatever) is better than a loaded real-world case like the admissions or salary-gap data, because with the real cases students start fighting about whether the world is like that and never actually look at the arithmetic — he thinks the realism is what makes it stick. Tell me who's closer to right and design accordingly. Second, he swears the group-size asymmetry doesn't need to be set up carefully, you can just have one subgroup be much smaller and it'll happen naturally; I suspect you have to engineer the subgroup sizes pretty deliberately or the reversal won't actually materialize when I run it, and an activity where the trick doesn't fire is worse than a slide. Please include: the exact rules and materials, a timeline, how the debrief should map what happened onto the formal statement of the paradox, the misconceptions I should expect (the one I keep hitting when I lecture on this is students walking away thinking it's a small-sample artifact that goes away with more data — tell me where in the sequence to kill that), and an honest note on what part of the paradox an activity like this fundamentally can't reproduce and I'll have to just assert at the end.

  Also — and this is the part I really want your judgment on — should the participants get to choose which aggregation to use at some point, with some of them choosing the disaggregated view for motivated reasons (because it flatters their earlier call) and others not? That feels to me like the closest an activity can get to the real lesson, which is that the aggregation choice is a substantive one, not a technicality. But I can see it derailing into students just picking whatever confirms their prior. Design it one way or the other and defend the choice. End your response with a one-sentence summary of the activity on the very last line.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** Social science undergrads (intro stats), ~25 students.
      *   **Setting:** 75-minute session, whiteboard + handouts, *no laptops*.
      *   **Topic:** Simpson's Paradox.
      *   **Pedagogical Philosophy:** The user wants an *active* discovery approach (students make a decision on aggregate data, then see the reversal in disaggregated data), contrasting with their friend's passive "show a slide" approach.
      *   **Key Constraints/Debates to Address:**
          1.  *Real vs. Fictional Data:* User prefers fictional/neutral to avoid political/real-world baggage distracting from the math. Friend prefers real for impact.
          2.  *Sample Size Engineering:* User insists on carefully engineering subgroup sizes to ensure the reversal happens. Friend thinks it happens naturally.
          3.  *Choice of Aggregation:* Should students choose which view to use later? User worries about confirmation bias but sees the value in learning that aggregation is a substantive choice.
      *   **Deliverables:** Rules, materials, timeline, debrief mapping, misconceptions (specifically the "small sample" myth), limitations of the activity, and a defense of the "choice" design decision.
      *   **Final Requirement:** One-sentence summary on the very last line.

  2.  **Debate Resolution & Design Strategy:**
      *   *Real vs. Fictional:* The user is right for an *intro* activity. Real-world cases (Berkeley admissions, death penalty) trigger prior beliefs that interfere with the statistical lesson. If students argue about sexism or racism, they aren't calculating weighted averages. A neutral, slightly gamified scenario works best for the *mechanism* of the paradox. I will support the user here but suggest bridging to real examples in the debrief.
      *   *Sample Size Engineering:* The user is absolutely right. Simpson's Paradox relies on confounding variables *and* unequal group sizes. If the groups are balanced, the weighted average usually doesn't flip enough to reverse the trend. The activity *must* rig the numbers to guarantee the reversal.
      *   *Choice of Aggregation:* This is the trickiest part. If students choose *after* seeing the reversal, it becomes post-hoc rationalization. If they choose *before*, they don't know enough. The sweet spot is to have them realize *why* the aggregate was misleading *after* the reveal, then discuss which one *should* have been used. I will design it so the "choice" comes in the debrief/discussion phase regarding causal inference, not as a game mechanic to "win."

  3.  **Activity Concept: "The University Grant Competition"**
      *   *Scenario:* Two departments (A & B) applying for a "Teaching Excellence" grant.
      *   *Aggregate:* Department A has a higher overall success rate than Department B.
      *   *Disaggregate:* Breakdown by "Course Level" (Intro vs. Advanced). In *both* levels, Department B does better.
      *   *Why this works:* It's neutral (academic setting), easy to calculate percentages on handouts, and mirrors the classic Berkeley case without the baggage.
      *   *The "Stake":* Students act as the Grant Committee. They must award the grant based on the first handout. They sign their name. This creates commitment.

  4.  **Drafting the Activity Steps:**
      *   *Phase 1 (Commitment):* Handout 1 (Aggregate only). Vote/Sign.
      *   *Phase 2 (Reveal):* Handout 2 (Breakdown). Calculate subgroup rates.
      *   *Phase 3 (Conflict):* Realize the flip.
      *   *Phase 4 (Resolution):* Discuss *why* (confounding variable: course difficulty).

  5.  **Addressing Specific Constraints:**
      *   *Timeline:* 75 mins. Need to balance activity (30-40 mins) with lecture/debrief (35-45 mins).
      *   *Misconceptions:* The "small sample" myth. Need to explicitly show that even with N=1000, the math holds.
      *   *Limitations:* The activity shows the *math*, but not the *causality*. Why is course level a confounder? That requires subject matter knowledge the data doesn't provide.
      *   *The "Choice" Question:* I need to decide whether to let them choose the aggregation.
          *   *Decision:* Do *not* let them choose during the game. It invites gaming. Instead, make the "choice" the core of the debrief. "Now that you know, which number matters?" This highlights that statistics doesn't answer the "should," humans do.

  6.  **Developing the Numbers (Crucial Step):**
      *   Need Department A to look better overall.
      *   Need Department B to look better in subgroups.
      *   Need unequal distribution of "difficulty" (Intro vs. Advanced).
      *   *Dept A:* Mostly Easy (Intro) cases.
      *   *Dept B:* Mostly Hard (Advanced) cases.
      *   *Drafting Numbers:*
          *   **Intro:** A: 90/100 (90%), B: 190/200 (95%). (B wins)
          *   **Adv:** A: 10/100 (10%), B: 10/50 (20%). (B wins)
          *   **Total A:** 100/200 (50%)
          *   **Total B:** 200/250 (80%) -> Wait, I need A to win overall.
          *   *Correction:* A needs to do the "Easy" task much more often.
          *   *Revised:*
              *   **Intro (High Success Rate):**
                  *   Dept A: 90 success / 100 total (90%)
                  *   Dept B: 9 success / 10 total (90%) -> Need B to be higher. Let's say B: 19/20 (95%).
              *   **Adv (Low Success Rate):**
                  *   Dept A: 1 success / 10 total (10%)
                  *   Dept B: 10 success / 100 total (10%) -> Need B to be higher. Let's say B: 20/150 (13.3%).
              *   *Totals:*
                  *   Dept A: 91 / 110 = 82.7%
                  *   Dept B: 39 / 170 = 22.9% -> A wins overall.
              *   *Check Subgroups:*
                  *   Intro: A (90%) < B (95%).
                  *   Adv: A (10%) < B (13.3%).
              *   *Check Overall:* A (82.7%) > B (22.9%).
              *   *Wait, logic check:* For Simpson's to work, the group with the higher success rate in subgroups (B) must be weighted towards the *harder* task.
              *   *Let's try standard Berkeley-style numbers:*
                  *   **Easy Task:**
                      *   Dept A: 80/100 (80%)
                      *   Dept B: 190/200 (95%) -> B is better.
                  *   **Hard Task:**
                      *   Dept A: 20/100 (20%)
                      *   Dept B: 10/50 (20%) -> Need B better. Let's say 15/50 (30%).
                  *   **Totals:**
                      *   Dept A: 100/200 = 50%
                      *   Dept B: 205/250 = 82% -> B wins overall. I need A to win overall.
              *   *Okay, flip the weights.* Dept A must do mostly Easy. Dept B must do mostly Hard.
              *   **Easy Task:**
                  *   Dept A: 90/100 (90%)
                  *   Dept B: 9/10 (90%) -> Make B slightly better: 19/20 (95%).
              *   **Hard Task:**
                  *   Dept A: 10/100 (10%)
                  *   Dept B: 20/150 (13.3%).
              *   **Totals:**
                  *   Dept A: 100/200 = 50%.
                  *   Dept B: 39/170 = 23%.
                  *   *Result:* A wins overall (50% vs 23%). B wins subgroups (95%>90%, 13.3%>10%).
                  *   *Why:* A did 100 Easy / 100 Hard. B did 20 Easy / 150 Hard.
                  *   *Wait, if B does mostly Hard (low success rate), their total average drops.*
                  *   *Yes, that's the paradox.* B is better at both, but because they took the hard cases, their average looks worse.
                  *   *Let's refine for clean integers.*
                  *   **Intro (Easy):** A: 81/90 (90%). B: 9/10 (90%) -> Make B: 19/20 (95%).
                  *   **Adv (Hard):** A: 1/10 (10%). B: 19/190 (10%) -> Make B: 20/180 (11.1%).
                  *   **Totals:**
                      *   A: 82/100 = 82%.
                      *   B: 39/200 = 19.5%.
                  *   *Subgroups:* B > A in both.
                  *   *Overall:* A > B.
                  *   *Perfect.*

  7.  **Addressing the "Choice" Question:**
      *   User asks: Should participants choose which aggregation to use?
      *   My take: No, not during the judgment phase. If they choose *after* seeing the data, it's rationalization. If they choose *before*, they lack info.
      *   Better approach: Force the aggregate first (mimicking real life where we often see headlines first). Then reveal the breakdown. Then ask: "Now that you know the structure, which number *should* determine the grant?" This forces the substantive discussion about confounding variables without gamifying the bias.

  8.  **Addressing the "Small Sample" Misconception:**
      *   Students think "Oh, it's just noise."
      *   Counter: In the debrief, double all the numbers. Show the percentages stay the same. The paradox is structural, not stochastic.

  9.  **Addressing the "Real vs. Fictional" Debate:**
      *   User is right for the *activity*. Friend is right for the *motivation*.
      *   Compromise: Use fictional data for the mechanics (clean math), but explicitly map it to the Berkeley case in the debrief to show real-world stakes.

  10. **Refining the Timeline:**
      *   0-10: Intro/Hook.
      *   10-25: Phase 1 (Aggregate Decision).
      *   25-45: Phase 2 (Disaggregate & Calculate).
      *   45-65: Debrief & Formalize.
      *   65-75: Wrap & Real World connection.

  11. **Drafting the Content:**
      *   Need clear handouts.
      *   Need specific instructions for the whiteboard.
      *   Need to explicitly answer the friend's constraints.

  12. **Final Review against Constraints:**
      *   No laptops? Yes, handouts/calc.
      *   25 students? Yes, small groups or individual.
      *   Stakes? Yes, public commitment/signing the grant.
      *   One-sentence summary at the very end? Yes.

  13. **Self-Correction on "Choice":**
      *   I need to be firm here. Letting them choose the aggregation *to support their initial call* reinforces bias. The lesson is that aggregation is a *causal* choice, not a statistical one. I will argue against letting them choose during the activity, but for making them defend the choice in the debrief.

  14. **Final Polish:**
      *   Ensure the tone is supportive of the user's pedagogy (active learning) while acknowledging the friend's point (realism matters for transfer).
      *   Make sure the numbers work perfectly. (Re-verifying the numbers in step 6).
      *   *Wait, one check:* In my draft numbers (Step 6), A: 82/100 (82%), B: 39/200 (19.5%). Subgroups: Intro A(90%) < B(95%). Adv A(10%) < B(11.1%).
      *   This works. A looks great overall because they did mostly Easy tasks. B looks bad overall because they did mostly Hard tasks, even though they are better at both.
      *   Wait, is "Better at both" clear? 95 > 90. 11.1 > 10. Yes.
      *   Is "Overall" clear? 82 > 19.5. Yes.
      *   Is the weighting clear? A: 90 Easy, 10 Hard. B: 20 Easy, 180 Hard.
      *   This is a strong reversal.

  15. **Writing the Response:**
      *   Structure: Validation -> Activity Design -> Addressing Constraints (Realism, Sample Size, Choice) -> Misconceptions -> Limitations -> Summary.
      *   Tone: Professional, pedagogical, collaborative.

      *(Self-Correction during drafting)*: I need to make sure I explicitly answer the "Choice" question as requested ("Design it one way or the other and defend the choice"). I will design it *without* the choice during the decision phase, but *with* the choice during the debrief, and defend that distinction.

      *(Final check on the summary sentence)*: Must be the very last line.

      *(Final check on sample size constraint)*: I need to explicitly tell the user to pre-print the numbers so they don't have to calculate them from raw data during class (time saver), or provide the counts and have them calculate percentages. Calculating percentages is better for engagement. I'll have them calculate percentages from counts on the handout.

      *(Final check on "Small Sample" myth)*: I need a specific moment in the debrief to address this. "What if N was 10,000?"

      *(Final check on "Real vs Fictional")*: I will side with the user for the activity but validate the friend for the debrief.

      Let's assemble.
answer: |-
  You are right to push back on your friend. Passive observation of Simpson's Paradox often leads students to treat it as a "magic trick" rather than a structural feature of weighted averages. For social science students, the critical lesson isn't just that the numbers flip, but that **aggregation is a causal decision, not a mathematical default.**

  Here is a design that forces the reversal through commitment, engineered data, and a structured debrief.

  ### Activity Title: "The Grant Committee"

  **Scenario:** The class is the Faculty Grant Committee. Two departments (Psychology and Sociology) are competing for a "Teaching Excellence" award. The metric is "Course Pass Rate."

  **Materials:**
  1.  **Handout A (The Proposal):** Shows only aggregate pass rates for Dept P and Dept S. Includes a line: *"I award the grant to: ______ (Signature)."*
  2.  **Handout B (The Audit):** Shows the breakdown of pass rates by "Course Level" (100-Level vs. 400-Level) for both departments.
  3.  **Whiteboard:** Pre-drawn with two empty contingency tables.

  **The Engineered Data (Crucial):**
  *Do not let students generate this data.* If they roll dice or guess, the reversal might not happen. You must pre-print these counts on Handout B.
  *   **Dept P (Psychology):** Mostly easy courses.
  *   **Dept S (Sociology):** Mostly hard courses.
  *   **Reality:** Dept S is better at teaching *both* levels, but looks worse overall.

  | Course Level | Dept P (Pass / Total) | Dept P (%) | Dept S (Pass / Total) | Dept S (%) |
  | :--- | :--- | :--- | :--- | :--- |
  | **100-Level (Easy)** | 81 / 90 | **90%** | 19 / 20 | **95%** |
  | **400-Level (Hard)** | 1 / 10 | **10%** | 20 / 180 | **11.1%** |
  | **TOTAL** | **82 / 100** | **82%** | **39 / 200** | **19.5%** |

  *(Note: Dept S wins both subgroups, but Dept P wins the aggregate by a massive margin.)*

  ---

  ### Timeline (75 Minutes)

  **0:00 – 0:10: Setup & Commitment**
  *   Hand out **Handout A**. Tell students: "You are the committee. Based on these overall success rates, you must award the grant. This decision is final and public."
  *   **The Stake:** They must write the department name and **sign their name**. Collect these or have them hold them up. Ask for a show of hands: "Who chose Psychology?" (Expect nearly 100% based on 82% vs 19.5%).
  *   *Pedagogical Goal:* Create cognitive commitment. They have now gone on record.

  **0:10 – 0:30: The Audit (Discovery)**
  *   Hand out **Handout B**.
  *   Task: "An audit has been released. Calculate the pass rates for 100-Level and 400-Level courses separately. Circle the winner for each row."
  *   Give them 5 minutes to calculate percentages (simple calculators or phone calc allowed, no laptops).
  *   Ask: "Who won 100-Level?" (Sociology). "Who won 400-Level?" (Sociology).
  *   Ask: "Who did you vote for in Round 1?" (Psychology).
  *   *The Moment:* Let the discomfort sit. "How can Sociology win both categories but lose the grant?"

  **0:30 – 0:50: Whiteboard Reconstruction**
  *   Call two students to the board. Have them fill in the contingency tables using the numbers from Handout B.
  *   Visually highlight the **Group Sizes** (the denominators).
  *   Circle the 90 (P, Easy) and the 180 (S, Hard).
  *   Ask the class: "Why does Psychology's overall average look so good?"
  *   Guide them to see: Psychology's average is weighted heavily toward the *easy* courses. Sociology's average is weighted heavily toward the *hard* courses.
  *   **Formalize:** Write the formula for the weighted average on the board. Show that the "Total %" is not the average of the two sub-percentages; it is the sum of passes divided by sum of totals.

  **0:50 – 1:05: The "Choice" Debrief**
  *   **The Critical Question:** "Now that you see the breakdown, should we revoke the grant from Psychology and give it to Sociology? Or does the original 82% vs 19.5% number still matter?"
  *   *Do not let them vote again immediately.* Discuss first.
  *   Most will say Sociology deserves it (they are better teachers).
  *   Push back: "But if I'm a student choosing a department to maximize my chance of passing, Psychology looks safer."
  *   **Resolution:** Distinguish between **Causal Effect** (Teaching Quality) vs. **Predictive Risk** (Chance of Passing).
      *   If we want to reward *quality*, we use the disaggregated data (controlling for difficulty).
      *   If we want to predict *outcomes*, the aggregate data is honest about the mix of courses offered.
  *   This addresses your question on aggregation choice: **Do not let them choose the aggregation during the activity.** Force the aggregate first (mimicking real life), then force the disaggregated view. The "choice" comes in the *interpretation* of which metric answers the specific research question.

  **1:05 – 1:15: Real-World Bridge & Wrap**
  *   Reveal that this is the structure of the famous 1973 Berkeley Admissions case.
  *   Explain that in the real case, women applied to harder departments. The aggregate looked sexist; the disaggregated showed no bias (or even bias toward women).
  *   **Final Takeaway:** "Statistics cannot tell you which variables to control for. That is a substantive theory decision."

  ---

  ### Addressing Your Design Constraints

  **1. Fictional vs. Real Data (You are right for the activity)**
  Your friend is wrong about the *initial* exposure. If you start with Berkeley or Death Penalty data, students bring prior political beliefs. They will argue about sexism or racism rather than calculating weighted averages.
  *   **Design Decision:** Use the neutral "Grant" scenario for the *mechanism*. It isolates the math.
  *   **Compromise:** Use the real-world case in the *debrief* (last 10 mins). Once they understand the math, the real-world stakes hit harder because they aren't fighting the arithmetic.

  **2. Engineering Subgroup Sizes (You are absolutely right)**
  Your friend is dangerous here. Simpson's Paradox is not guaranteed by "natural" variation; it requires a specific correlation between the subgroup size and the baseline success rate.
  *   **Design Decision:** Pre-print the numbers (as above). Do not simulate. If the reversal doesn't happen, the lesson fails. The 90/10 split vs. 20/180 split in the data above is deliberately engineered to ensure the weighted average flips.

  **3. The "Choice" of Aggregation (Do not gamify this)**
  You asked if participants should choose which aggregation to use.
  *   **Design Decision:** **No.** If you let them choose the view *after* seeing the data, they will engage in motivated reasoning (picking the view that validates their initial vote).
  *   **Defense:** The lesson of Simpson's Paradox is that **you often don't get to choose.** The world presents aggregate data (headlines, policy stats). The skill is recognizing *when* to demand the breakdown. By forcing the aggregate first, you simulate the real-world trap. By forcing the breakdown second, you simulate the audit. The "choice" is then discussed theoretically: "Which number answers the question 'Who is the better teacher?' vs 'Where is it easier to pass?'"

  ---

  ### Misconceptions & How to Kill Them

  **1. The "Small Sample" Myth**
  *   *The Misconception:* "This only happens because the numbers are small/uneven. If we had more data, it would smooth out."
  *   *Where to kill it:* During the Whiteboard Reconstruction (0:30–0:50).
  *   *The Move:* Ask the class: "What if we multiply every number by 1,000? Does the percentage change?" (No). "Does the reversal disappear?" (No).
  *   *Script:* "This is not noise. This is arithmetic. It will hold at N=10 or N=1,000,000. It is a structural property of how we combine groups."

  **2. The "Confounding is Bias" Myth**
  *   *The Misconception:* "The aggregate number is 'wrong' and the disaggregated number is 'right'."
  *   *Where to kill it:* During the Debrief (0:50–1:05).
  *   *The Move:* Point out that the 82% pass rate for Psychology is *factually true*. It is not a lie.
  *   *Script:* "The aggregate number is true. The subgroup numbers are true. The paradox isn't that one is false; it's that they answer different questions. Aggregate answers 'What happens if I pick this department?' Subgroup answers 'How good is the teaching, holding difficulty constant?'"

  ---

  ### Limitations: What This Activity Cannot Do

  Be honest with your students (and yourself) about what this activity leaves out.
  1.  **Causal Direction:** The activity shows *that* Course Level is a confounder. It does not prove *why*. In the real world, you need subject matter knowledge to know that "Course Level" causes "Pass Rate," not the other way around. You have to assert this.
  2.  **Colliders:** This activity teaches about confounders (common causes). It does not teach about colliders (variables caused by two other variables), where controlling for a variable *creates* a paradox. That is too advanced for intro stats, but don't let them walk away thinking "always control for everything."
  3.  **The "Correct" Model:** You must assert that in the Grant scenario, the disaggregated view is the "fair" one for evaluating teaching. The math doesn't tell you that; your definition of "Teaching Excellence" does.

  ### Summary of the "Choice" Debate
  If you let students choose the aggregation view to support their initial vote, you turn a lesson on causal inference into a lesson on confirmation bias. By withholding the choice until the debrief, you force them to confront the discrepancy first, then evaluate the *validity* of the aggregation based on the research question, not their ego.

  This activity uses engineered fictional data to force a mathematical reversal on committed decisions, then bridges to real-world cases to validate the stakes.
