  ### The Calorimetry of Value: A Decision Tree on Hedonic Commensurability

  This instrument is designed to sort ethical positions based on the logical structure of value, analogous to sorting thermodynamic systems based on whether heat and work share a state function. Proceed through the nodes in order. Answer based on your intuition regarding the specific case presented, not on the theoretical label you suspect it leads to.

  ***

  #### **Node 1: The Zero-Sum Case (The Root Assumption)**
  **Case:** Imagine a closed universe containing exactly 1,000 units of intense, pure joy and 1,000 units of intense, pure agony, distributed across various beings. There are no other consequences.
  **Question:** Is the net moral value of this universe necessarily zero (neutral), or could it be non-zero (good or bad) despite the exact balance of quantities?

  *   **No, it could be non-zero:** The quantities do not cancel perfectly; they are not signed magnitudes of a single currency.
      *   **→ Go to Leaf 1.**
  *   **Yes, it is necessarily zero:** Pleasure and pain are commensurable; they function as positive and negative entries in a single ledger.
      *   **→ Go to Node 2.**

  #### **Node 2: The Addition Case (Case C)**
  **Case:** Consider a world that is currently empty of sentient life (value = 0). We have the option to add one person who will live a life that is contented and free of pain, though not ecstatic.
  **Question:** Does adding this contented life make the new world *better* than the empty world?

  *   **No:** The presence of pleasure creates no intrinsic positive value; only the absence of pain matters.
      *   **→ Go to Leaf 2.**
  *   **Yes:** Positive states contribute intrinsic value to the sum.
      *   **→ Go to Node 3.**

  #### **Node 3: The Aggregation Case (Case B)**
  **Case:** Consider a single instance of prolonged, severe torture inflicted on one person.
  **Question:** Can this single instance be morally outweighed by a sufficiently large number of very mild discomforts (e.g., a dust speck in the eye) spread across a large population, assuming the total "units" of discomfort exceed the "units" of torture?

  *   **No:** There is a threshold of severity where pain becomes lexically prior; no amount of lesser pain can sum to outweigh it.
      *   **→ Go to Leaf 3.**
  *   **Yes:** Pain is aggregable across a spectrum; severity can be traded off against quantity.
      *   **→ Go to Node 4.**

  #### **Node 4: The Exchange Case (Case A)**
  **Case:** Consider a brief but severe pain inflicted on one person.
  **Question:** Can this pain be properly traded off against a very large number of small *pleasures* distributed across many persons, such that the pleasure renders the pain permissible?

  *   **No:** While pain aggregates against pain (Node 3), pleasure cannot offset severe pain; pain carries a higher moral weight than pleasure.
      *   **→ Go to Leaf 4.**
  *   **Yes:** Pleasure and pain are symmetric in their capacity to outweigh one another, provided the quantities are sufficient.
      *   **→ Go to Leaf 5.**

  ***

  ### **The Leaves: Positions and Costs**

  **Leaf 1: Value Pluralism (Incommensurability)**
  *   **Position:** Your suspicion is correct; pleasure and pain are distinct qualitative categories that cannot be reduced to a single signed quantity (akin to heat vs. volume). This aligns with meta-ethical pluralism (e.g., Isaiah Berlin, Elizabeth Anderson).
  *   **The Cost:** You must accept that some moral dilemmas have no single right answer, leaving you with tragic remainders that calculation cannot resolve.

  **Leaf 2: Strong Negative Utilitarianism**
  *   **Position:** Pain has disvalue, but pleasure has no intrinsic positive value (it is merely the absence of pain). This is the strict "single-scale" view where the scale only extends downward.
  *   **The Cost:** You are committed to the view that creating a billion happy lives adds no value to the universe compared to leaving it empty.

  **Leaf 3: The Lexical-Threshold View**
  *   **Position:** Pleasure and pain are commensurable, but pain has a discontinuous structure; beyond a certain intensity, it cannot be aggregated or traded (e.g., Roger Crisp, Michael Huemer).
  *   **The Cost:** You must accept that preventing a single torture takes absolute priority over satisfying any number of trivial desires, regardless of the total sum of welfare.

  **Leaf 4: Weak Asymmetry (Prioritarianism)**
  *   **Position:** Pleasure and pain trade off, but pain counts for more than pleasure (e.g., one unit of pain requires two units of pleasure to offset).
  *   **The Cost:** You must defend an arbitrary exchange rate (why 2:1 and not 1.5:1?) and accept that severe suffering can still be justified if the trivial pleasures are numerous enough.

  **Leaf 5: Classical Single-Scale Utilitarianism**
  *   **Position:** The classical Benthamite view; pleasure and pain are perfectly symmetric, commensurable, and aggregable signed magnitudes.
  *   **The Cost:** You are committed to the "Repugnant Conclusion" and must accept that torture is permissible if the aggregate minor pleasures of the majority are sufficiently large.

  ***

  ### **Diagnostic Notes & Flags**

  **Unoccupied Logical Space:**
  *   **Positive Utilitarianism (Pain counts for nothing, Pleasure counts):** *Diagnosis:* This position is virtually unoccupied because it is evolutionarily and psychologically unattractive; a system that ignores pain fails as a guide for survival and moral intuition.
  *   **Incommensurable but Aggregatable:** *Diagnosis:* This combination is logically incoherent; if quantities cannot be reduced to a common unit, they cannot be summed without remainder.

  **Flagged Indistinctions:**
  *   **Weak Asymmetry vs. Classical Utilitarianism:** The tree cannot empirically separate these if the respondent believes the exchange rate is 1:1 but *feels* like pain is heavier; this distinction relies on introspective precision that may not exist.
  *   **Strict Asymmetry:** This label is often used interchangeably with **Strong Negative Utilitarianism** (Leaf 2) or **Lexical Threshold** (Leaf 3); the tree forces a choice between them based on whether pleasure has *any* value or whether pain has *absolute* priority.

  **Note on the Root:**
  *   Your suspicion (Leaf 1) is not a naive error but a robust position in value theory known as **Value Incommensurability** or **Discontinuity**. It treats "suffering" and "enjoyment" as distinct dimensions (like temperature and pressure) rather than a single state function (like internal energy).
