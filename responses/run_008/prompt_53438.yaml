      *   Procedure/Surgery -> Public Hearings/Testifying
      *   Draining Abscess -> Testifying
      *   Anesthetic -> Amnesty
      *   Surgeon -> TRC Commissioners
      *   Recovery -> Reconciliation/Healing

  3.  **Identify Disanalogies (Breaking Points):**
      *   *Unified Body:* A nation isn't a single biological organism. Victims and perpetrators have conflicting interests. Healing one might hurt the other.
      *   *Healing vs. Reconciliation:* Medical healing is internal; reconciliation is relational between parties.
      *   *Anesthesia/Amnesty:* Anesthesia removes pain sensation; amnesty removes legal consequence. Amnesty required disclosure (quid pro quo), anesthesia is just given.
      *   *Consent:* Patients consent to surgery. Victims/perpetrators didn't necessarily consent to the TRC process (it was a political settlement).
      *   *Success Metric:* Medical success is physiological. TRC success is political/social/justice-oriented.

  4.  **Evaluate Load-Bearing Disanalogies:**
      *   The "Unified Body" issue is load-bearing. If the nation isn't one patient, whose healing counts? If victims aren't healed but perpetrators are "amnestied," is that success?
      *   The "Consent" issue is load-bearing. Therapy requires patient buy-in. Transitional justice is often imposed top-down.
      *   The "Anesthesia" issue is load-bearing. Amnesty wasn't just pain relief; it was a legal bargain.

  5.  **Evaluate the Conclusion:**
      *   Does "success = healing, not punishment" survive without the analogy?
      *   Argument: Therapeutic justice is valid, but ignoring punishment entirely undermines the "cleaning" metaphor (justice *is* part of cleaning). Without punishment, impunity remains, which is like leaving infection in.
      *   Better analogy: Architectural/Foundational (repairing a structure) or Ecological (restoring an ecosystem).

