      *   *Healing vs. Reconciliation:* Medical recovery is intrinsic. Reconciliation is extrinsic/relational. You can heal without reconciling. The analogy conflates internal state with social bond.
      *   *Anesthesia/Amnesty:* Anesthesia is passive; amnesty was conditional (full disclosure). The analogy suggests amnesty merely numbs pain, obscuring the *quid pro quo* (truth for freedom). This distorts the mechanism.
