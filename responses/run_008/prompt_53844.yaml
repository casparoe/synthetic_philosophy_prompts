answer: |-
  # The Dual-Key Release Procedure (DKRP)

  ## Theoretical Grounding & Design Philosophy

  This procedure is derived from Bostrom, Douglas, and Sandberg's *The Unilateralist's Curse* (2016), specifically the **Principle of Conformity**: agents should defer to the consensus of the epistemic community rather than acting on private judgment when the action is irreversible and potentially harmful.

  However, as you noted, the literature assumes independent actors and treats inaction as costless. This procedure modifies the Principle of Conformity to account for **correlated errors** (your board shares a culture), **costly delay** (scooping/time-sensitivity), and **substitutability** (rivals publishing anyway).

  **The Core Mechanism:**
  To release, you need **Active Consent** (a Sponsor). To block, you need **Shared Dissent** (two Objectors).
  *   **Why this works:** It prevents a single enthusiastic team from releasing against private reservations (Unilateralist Action) because they must find a Board Sponsor. It prevents a single cautious board member from stalling indefinitely (Unilateralist Veto) because they need a second seconder.
  *   **The Default:** **Stall.** (No Release). This places the burden of proof on action, which is safer for AI safety. To prevent the Bystander Effect (paralysis), the path to Sponsorship is streamlined for low-risk items, and Time-Sensitivity can shift the burden of proof.

  ---

  ## The Procedure

  ### Step 1: Intake & Classification (Day 0)
  *   **Question:** What is the risk tier and time-sensitivity of this release?
  *   **Sufficient Answer:** The requesting team completes a **Release Intake Form** containing:
      1.  **Risk Tier:** (Low/Medium/High) based on a standardized checklist (e.g., "Does this enable cyberattacks?" "Does this contain PII?").
      2.  **Time-Harm Declaration:** A quantitative estimate of the cost of a 30-day delay (e.g., "$0," "Loss of priority," "Loss of utility for disaster response").
      3.  **Substitutability Claim:** Evidence that the capability/data is not already public or imminent elsewhere.
  *   **Fact vs. Value:** Risk Tier is Fact-based (checklist). Time-Harm and Substitutability are Value judgments (estimated by the team, audited by Coordinator).
  *   **Termination:** If the Intake Form is incomplete, the request is returned. No decision yet.
  *   **Signatory:** **Requesting Team Lead** (certifies accuracy of claims).

  ### Step 2: The Review Window (Days 1–4)
  *   **Question:** Is there a Board member willing to own the risk, or two members willing to own the block?
  *   **Sufficient Answer:**
      *   **Path A (Sponsorship):** One Board Member volunteers as **Risk Sponsor**. They must attest they have read the summary and consulted one source *outside* the immediate board consensus (e.g., an external expert, a dissenting colleague) to mitigate correlated error.
      *   **Path B (Objection):** One Board Member files a **Notice of Objection**. This does *not* block the release yet; it flags it for a second opinion.
  *   **Fact vs. Value:** Sponsorship is a Value judgment (I accept the risk). Objection is a Value judgment (I suspect hidden harm). The "External Consult" is a Fact (did it happen?).
  *   **Termination:** If a Sponsor is found, proceed to Step 3 (Release). If an Objection is found, proceed to Step 3 (Adjudication). If neither, proceed to Step 4 (Default).
  *   **Signatory:** **Risk Sponsor** (for Path A) or **Objecting Member** (for Path B).

  ### Step 3: Adjudication (Day 5 Morning)
  *   **Question:** Does the Objection sustain, or does the Sponsorship stand?
  *   **Sufficient Answer:**
      *   **If Sponsor Found (and no Objection):** Release Authorized.
      *   **If Objection Found:** A second Board Member must **Second the Objection** within 24 hours.
          *   If Seconded: Release Blocked.
          *   If Not Seconded: Objection Lapses. Release Authorized (Sponsorship still required; if no Sponsor was found in Step 2, revert to Default).
      *   **Time-Sensitivity Override:** If the Time-Harm Declaration was rated "Critical" (e.g., ongoing disaster response), a single Objection is insufficient to block; **Three** Objectors are required to block.
  *   **Fact vs. Value:** Whether the second signature was obtained is Fact. Whether the risk outweighs the benefit is Value.
  *   **Termination:** Clear Yes (Release) or Clear No (Block).
  *   **Signatory:** **Risk Sponsor** (for Release) or **Lead Objector** (for Block).

  ### Step 4: The Default (Day 5 End of Business)
  *   **Question:** What happens if the Board is silent?
  *   **Sufficient Answer:**
      *   **Standard Default:** **Stall.** (No Release).
      *   **Rationale:** Silence is not consent; it is uncertainty. Uncertainty defaults to safety.
      *   **Exception:** If the Requesting Team can demonstrate **High Substitutability** (rivals will publish within 30 days) AND **Low Risk**, the Default shifts to **Release**, provided the Team Lead signs a **Liability Waiver**.
  *   **Fact vs. Value:** The passage of time is Fact. The shift to Release is a Value judgment encoded in policy.
  *   **Termination:** Clear No (Stall) or Clear Yes (Release via Waiver).
  *   **Signatory:** **Coordinator** (for Stall) or **Team Lead** (for Waiver Release).

  ### Conflict of Interest Protocol
  *   **Rule:** If the Coordinator is an author or has a financial interest in the release, they **Recuse**.
  *   **Mechanism:** A rotating **Deputy Coordinator** (one of the 5 Board Members) assumes the Signatory role for the Default and Adjudication steps.
  *   **Signatory:** **Deputy Coordinator**.

  ---

  ## Case Runs

  ### Case A: Persuasive Political Checkpoint
  *   **Inputs:** Risk Tier: High (Dual-use). Time-Harm: Low (Academic priority). Substitutability: High (Replica imminent).
  *   **Step 1:** Team submits form. Claims High Substitutability.
  *   **Step 2:**
      *   *Sponsorship:* No Board Member volunteers. The risk is too high to own personally.
      *   *Objection:* Two Members file Notice of Objection citing dual-use risk.
  *   **Step 3:** Objection is Seconded (2/5 members). Block is sustained.
      *   *Note on Substitutability:* The team argues "others will do it." The Board weighs this. Under DKRP, High Substitutability *can* shift the Default (Step 4), but it does not override a Sustained Objection in Step 3. The Board decides the normative signal of *our* release outweighs the inevitability.
  *   **Step 4:** Not reached (Decision made in Step 3).
  *   **Outcome:** **Block.**
  *   **Signatory:** **Lead Objector** (Named Board Member).
  *   **Theory Check:** Addresses *Unilateralist Curse*. Even if the team thinks "it's inevitable," the Board's consensus (2+ objectors) overrides the team's unilateral desire. The correlated error risk is mitigated because the Objectors must articulate the risk publicly.

  ### Case B: Inference-Efficiency Paper (Coordinator is Author)
  *   **Inputs:** Risk Tier: Medium (Security implication). Time-Harm: High (Priority claim). Substitutability: Medium.
  *   **Step 1:** Team submits form. Coordinator recuses immediately. **Deputy Coordinator** appointed.
  *   **Step 2:**
      *   *Sponsorship:* One Board Member (non-specialist) reviews the 2-pager. They consult an external security contact (per Step 2 requirement). The contact says "90-day notice is sufficient." Board Member volunteers as **Risk Sponsor**.
      *   *Objection:* One Security Reviewer files Notice of Objection regarding the watermarking defeat.
  *   **Step 3:**
      *   Objection requires a Second to block. No other member seconds it (the harm is mitigated by the 90-day notice).
      *   Objection Lapses.
      *   Sponsorship stands.
  *   **Outcome:** **Release.**
  *   **Signatory:** **Risk Sponsor** (Board Member). *Note: The Coordinator does not sign, preserving accountability.*
  *   **Theory Check:** Addresses *Cost of Delay*. The Sponsor mechanism allows release despite one objection, preventing a single cautious reviewer from stalling a time-sensitive paper. The Recusal protocol prevents you from gaming the system to approve your own work.

  ### Case C: External Dataset Release (We are not the actor)
  *   **Inputs:** Action: Public Statement (Endorsement or Opposition). Risk Tier: High (Reputational/Safety). Time-Harm: High (Incident ongoing).
  *   **Step 1:** Treated as a "Release" of organizational speech. Intake Form filed by Comms Team.
  *   **Step 2:**
      *   *Sponsorship:* To Endorse, a Board Member must Sponsor the statement.
      *   *Objection:* To Oppose (or remain silent), a Board Member must Object to the Endorsement.
      *   *Scenario:* 3 Members want to Endorse (Sponsor). 2 Members want to Oppose (Object).
  *   **Step 3:**
      *   Sponsorship found (3 members).
      *   Objection found (2 members). Objection is Seconded.
      *   *Conflict:* We have both a Sponsor and a Sustained Objection.
      *   *Resolution:* In cases of Sustained Objection, the Default is **No Statement** (Silence). A split Board cannot speak with one voice without violating the Principle of Conformity.
  *   **Outcome:** **No Public Statement.** (Internal memo only).
  *   **Signatory:** **Deputy Coordinator** (Signs the decision to remain silent).
  *   **Theory Check:** Addresses *Unilateralist Curse* in speech. If the Board is split, speaking endorses the action as "Organizationally Approved." Silence preserves the ambiguity and prevents the organization from unilaterally validating the external actor's risky move.

  ---

  ## Limitations & Failure Modes

  You asked for honesty about where the theory breaks. Here is where this procedure will fail you:

  ### 1. The Correlated Error Problem (The "Echo Chamber" Failure)
  *   **The Flaw:** The procedure assumes a Board Member consulting an "external source" (Step 2) breaks correlation. In practice, they will call a friend who thinks like them. If your Board shares the same safety training and reads the same preprints, their "independent" judgments will be highly correlated.
  *   **The Consequence:** You may get a unanimous "Release" on a dangerous model because the entire Board suffers from the same blind spot (e.g., underestimating prompt injection).
  *   **The Silent Guess:** The procedure guesses that "External Consult" equals "Independent View." It does not.
  *   **Gaming Vector:** A team seeking release will suggest "external experts" who are known to be permissive.
  *   **Mitigation:** You must maintain a pre-vetted list of adversarial reviewers who are *not* chosen by the requesting team.

  ### 2. The "Liability Waiver" Loophole (The Substitutability Failure)
  *   **The Flaw:** Step 4 allows a Team Lead to force a Release via Waiver if Substitutability is High.
  *   **The Consequence:** Teams will learn to overstate Substitutability ("Competitor X is definitely doing this!") to trigger the Release Default.
  *   **The Silent Guess:** The procedure guesses the Coordinator can verify "Competitor X is definitely doing this." They cannot. Intelligence on rivals is always noisy.
  *   **Gaming Vector:** A team can leak their own work to a rival to create "evidence" of substitutability, then use the Waiver to bypass the Board.
  *   **Mitigation:** Require concrete evidence (e.g., a preprint on arXiv) for High Substitutability claims, not just rumors.

  ### 3. The "Sponsor" Burden (The Bystander Relapse)
  *   **The Flaw:** The Default is Stall. This cures the Unilateralist Curse but risks the Bystander Effect. If no one wants to be the "Risk Sponsor" (because signing your name is scary), good projects die.
  *   **The Consequence:** Low-risk, high-value work stalls because Board members are risk-averse, not because the work is dangerous.
  *   **The Silent Guess:** The procedure guesses that Board members are willing to put their reputation on the line for a 2-page summary. They may not be.
  *   **Gaming Vector:** Board members may collude to "ignore" requests they dislike, forcing a Stall by inaction, knowing the Team lacks the political capital to demand a Sponsor.
  *   **Mitigation:** Track "Sponsorship Rates." If a Board Member never Sponsors anything, they are effectively vetoing everything by silence. This metric must be reviewed quarterly.

  ### 4. The "Named Signatory" Pressure
  *   **The Flaw:** Requiring a name on every decision creates social pressure to conform.
  *   **The Consequence:** Junior Board Members may hesitate to Object if the Senior Member is the Sponsor. The "Seconded Objection" rule might fail if the culture is hierarchical.
  *   **The Silent Guess:** The procedure guesses that organizational culture supports psychological safety. If it doesn't, the "Seconded Objection" will never happen, and the Sponsor becomes a dictator.
  *   **Mitigation:** Allow **Anonymous Objections** to the Coordinator *only* for the purpose of triggering a search for a Second. (i.e., I tell Coordinator "I object," Coordinator asks "Who will second?" without revealing my name initially). *Note: This bends your "Named Signatory" rule slightly for the intermediate step, but the final Block must still be named.*

  ### 5. The "Time-Harm" Inflation
  *   **The Flaw:** Teams will mark every paper as "Critical Time-Harm" to trigger the 3-Objector threshold.
  *   **The Consequence:** The "Critical" exception becomes the norm, lowering the bar for release on dangerous items.
  *   **Mitigation:** The Coordinator (or Deputy) has sole authority to audit Time-Harm claims. If a team is caught lying about time-sensitivity, they lose "Fast Track" privileges for one year.

  ## Final Recommendation

  This procedure shifts the burden from "Who can stop this?" to "Who will own this?" It forces the Unilateralist to find a partner (Sponsor) and the Obstructionist to find an ally (Second). It is not perfect; it relies on the Board's willingness to sign their names. If your organization's culture punishes those who sign "No" or "Yes" incorrectly, this procedure will collapse into bureaucracy.

  **Immediate Action:** Before implementing, run a **Retrospective Simulation**. Take the last 10 releases (5 good, 5 bad) and run them through DKRP. If the procedure blocks the 5 good ones or releases the 5 bad ones, adjust the "Risk Tier" checklist before going live.
