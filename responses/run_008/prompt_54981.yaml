      Tomás: "I'm not fetishizing atoms; I'm respecting the content of the desire. Most people don't just want the feeling of writing; they want to contribute to literature. If you upload the text directly to your brain, you haven't contributed. You've just consumed a simulation of contribution. The world remains unchanged by your effort."

      Maya: "The world inside the mind is the only world that matters for welfare. But consider the exit interview. You unplug, memory restored. You know it was simulated. Yet, you look back on those two years with genuine satisfaction. You endorse the session. If the later self says 'that was good,' why does the earlier skeptical you get veto power?"

      Tomás: "Because the later self is the product of manipulation. That's the sour grapes problem. You've altered my preferences to match the available options. If I convince a prisoner he loves his cell, his endorsement doesn't make the cell good. The retrospective satisfaction is just a lingering echo of the deception."

