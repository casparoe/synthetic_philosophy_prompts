      Tomás: "I'm privileging the condition required for the satisfaction to be valid. Authenticity isn't just a feeling; it's a relation between mind and world. If you plug in, you sever that relation. The post-experience self might feel satisfied, but they're satisfied with a mirage. A satisfied delusion is still a delusion."

      Maya: "So you'd deny the validity of their happiness because of where it came from? That implies well-being is objective, independent of the subject's stance. But if I come out smiling, remembering the love I felt, the challenges I overcame... even knowing they were code... that joy is real. The cause doesn't negate the effect."

      Tomás: "The cause defines the effect. Joy based on falsehood is fragile, or worse, it's a category error. You're talking about pleasure, I'm talking about flourishing. Flourishing requires actualizing potential in reality. You can't actualize potential in a tank. You're just dreaming you did."

      Maya: "And if the dream feels like waking, and I prefer the dream? You're assuming 'reality' has intrinsic weight. I'm saying weight is assigned by the valuer. If I value the experience, it has weight. The self-authored track lets me value it fully because I chose the parameters. I'm not a prisoner; I'm a director."

      Tomás: "A director of a play no one sees. You're alone in the tank. The self-authorship is just a more elaborate form of solitude. You want contact with reality, Maya, even if you deny it. That's why you need the 'setbacks' in the script. You know perfect ease is empty. But simulated struggle is still ease."

      Maya: "Simulated struggle feels like struggle. That's the point. If the neural pathways fire identically, the welfare impact is identical. You're clinging to a mystique about 'the real' that vanishes under scrutiny. If I endorse the life after the fact, knowing the trick, the trick doesn't undo the value."

      Tomás: "Then we disagree on the source of value. You think it's internal generation; I think it's successful engagement. You can engage successfully with a simulation, but you can't live successfully in one. The exit interview doesn't settle it; it just shows how well the machine works."

      Maya: "Or it shows that you're afraid to let go of the intuition that suffering must be 'real' to count. I'm willing to take the win. Two years of fulfilled desire, even if the object was virtual, beats zero years of 'authentic' struggle any day."

      Tomás: "And I'd rather have one year of real friction than two years of perfect frictionlessness. But I suppose that's why we're sitting on opposite sides of this room."

