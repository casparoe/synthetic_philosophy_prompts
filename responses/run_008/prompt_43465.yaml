prompt: |-
  So my friend and I had another three hour argument about forgeries last night (this has become a weird recurring thing between us) and it left me with a position I now have to defend in public, which was probably a mistake. Backstory: I'm giving a talk next month at a meeting of a regional aesthetics society defending what my friend sarcastically calls my "funny money theory of originals." The view, roughly: the extra value we attach to originals -- the value that a perfect forgery can't capture even when literally no one can ever tell the difference -- isn't in the object, and it also isn't some deep fact about the artist's performance (I know, the Dutton people in the room will hate this). It's institutional in a very specific way: an original painting functions like legal tender. Its "originality value" supervenes on the artworld's provenance-tracking practices actually working the way they're supposed to, the same way a twenty dollar bill's value supervenes on the mint and the banking system and not on the paper or the ink. A perfect forgery is then exactly like a perfect counterfeit: aesthetically indistingishable, but still a counterfeit, because it inserts a fake node into the tracking system, and that insertion is the whole of the wrong-making feature. No mysticism about the artist's hand, no epistemic harm to future viewers (there are none, by hypothesis).

  My friend's strongest comeback, which I still don't have a clean answer to, was that money-value is openly and unembarrassingly conventional while our response to originals doesn't feel conventional at all -- standing in front of the actual Rembrandt feels like responding to *it*, not to a record-keeping system -- so my view either (a) misdescribes the phenomenology of valuing art, or (b) is secretly normative, i.e. telling everyone they should stop feeling what they in fact feel, which I don't want to claim either.

  The audience: mostly aestheticians. At least one person who thinks Dutton's performance argument is basically right -- art objects are records of achievement, the original is the authentic record, forgery is fraud on the achievement. A Goodmanian who will absolutely bring up the autographic/allographic distinction and ask why I'm only talking about paintings and what happens to my view for music or literature. A couple of anti-theorists who think "where does the value reside" is a badly posed question from the start. And a bunch of grad students who mainly want to talk about NFTs.

  Draft my prep sheet: the seven or eight objections I'll actually get from this particular room (not the generic ones from the internet), ordered by how much damage they'd do, each phrased the way the person behind it would phrase it -- the Duttonian, the Goodmanian, the anti-theorists, and the grad students all phrase things differently, so say who's likely behind each one -- with a two minute reply for each and an honest note about where the reply is soft. Work my friend's objection in there somewhere, since someone in that room will independently think of it. And include the question I'm hoping nobody asks -- the one where my own view is one step away from saying something embarrassing about originality mattering less than everyone thinks -- and what I should say if it comes anyway. Also give me a quick read on the NFT thing: do I bring it up proactively as a strength of my view (provenance tracking is literally what blockchain people think they invented) or pray it never comes up?
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is giving a talk at a regional aesthetics society.
      *   **Topic:** A theory of originality in art ("Funny Money Theory").
      *   **Core Thesis:** The value of originals isn't intrinsic or performance-based (anti-Dutton), but institutional/conventional, similar to legal tender. A perfect forgery is like a counterfeit bill: aesthetically identical but institutionally invalid because it bypasses the provenance-tracking system.
      *   **The Problem:** The user's friend pointed out a phenomenological gap: money feels conventional; art feels *not* conventional. Standing before a Rembrandt feels like encountering the *thing*, not a ledger entry.
      *   **Audience:** Aestheticians (mixed bag: Duttonians, Goodmanians, Anti-theorists, Grad Students interested in NFTs).
      *   **Deliverable:** A prep sheet with 7-8 specific objections (ordered by damage), phrased by the likely objector, with 2-minute replies, honesty about weak spots, inclusion of the friend's objection, the "embarrassing question" to avoid, and advice on the NFT angle.

  2.  **Deconstruct the Theory ("Funny Money"):**
      *   *Strengths:* Explains why perfect forgeries are still "wrong" without relying on mystical "artist's touch" or epistemic harm (since no one knows). Aligns with institutional theories of art (Dickie/Danto) but applies it to *value* rather than *status*.
      *   *Weaknesses:* Phenomenology (it doesn't *feel* like money), Reductionism (reduces aesthetic experience to bureaucracy), Scope (does it work for music/poetry?), Normativity (are we describing or prescribing?).

  3.  **Brainstorming Objections (Tailored to Audience):**

      *   *The Duttonian (Performance/Achievement):* "You're ignoring the history of making. The original *is* the achievement."
      *   *The Goodmanian (Autographic/Allographic):* "What about music? Is a perfect performance of a score a forgery if the sheet music is fake?"
      *   *The Phenomenologist (The Friend's Objection):* "It doesn't feel like money. It feels like presence."
      *   *The Anti-Theorist:* "Why are you reifying 'value' like it's a substance located somewhere?"
      *   *The Grad Student (NFTs):* "Is this just an NFT argument without the blockchain?"
      *   *The Historical Materialist:* "What about restoration? If I replace all the paint, is it still the original? Money doesn't wear out like paint."
      *   *The Ethical/Aesthetic Link:* "Does this make aesthetic value entirely moral/legal?"
      *   *The "Embarrassing Question":* "If it's just institutional, why not just change the institution and accept forgeries?"

  4.  **Drafting the Prep Sheet (Iterative Process):**

      *   *Ordering:* Need to put the most damaging ones first. The Phenomenological objection (Friend's) is the strongest because it attacks the core intuition. The Duttonian is next because it's the dominant rival theory. The Goodmanian is technical but dangerous. The NFT one is trendy but potentially trivializing.
      *   *Phrasing:* Needs to sound like academics. Duttonians talk about "human achievement." Goodmanians talk about "notation" and "identity conditions." Anti-theorists talk about "reification." Grad students talk about "tokenization."
      *   *Replies:* Need to be punchy (2 mins). Must defend the institutional view without conceding too much.
      *   *Honest Notes:* Crucial for the user. Where is the bluff?

  5.  **Refining Specific Objections:**

      *   *Objection 1 (Phenomenology/Friend):* "The Rembrandt Experience." *Reply:* Distinguish between the *source* of value and the *experience* of value. We feel the weight of history, but that history is constituted by the institution. *Soft spot:* It might feel like an error theory.
      *   *Objection 2 (Dutton):* "Achievement Record." *Reply:* A record is only a record if the chain of custody holds. A fake diary isn't a record of a life, even if well-written. *Soft spot:* Dutton might say the physical object *is* the record, not the paper trail.
      *   *Objection 3 (Goodman):* "Autographic vs. Allographic." *Reply:* My theory applies to autographic arts where provenance matters. Music is allographic; the score is the institution. *Soft spot:* Blurs the line between performance and work.
      *   *Objection 4 (Anti-Theorist):* "Reification of Value." *Reply:* I'm not locating a substance, I'm describing a functional role. *Soft spot:* They might say "functional role" is just more metaphysics.
      *   *Objection 5 (Grad Student/NFT):* "Is this just an NFT?" *Reply:* Yes, conceptually. NFTs prove the intuition that provenance = value independent of content. *Soft spot:* Associating with NFTs might date the talk or seem cynical.
      *   *Objection 6 (Materiality):* "Paint vs. Paper." *Reply:* Money wears out too (polymer, circulation). The material substrate matters only as the carrier of the institutional signal. *Soft spot:* Art restoration changes the material significantly; money is usually replaced.
      *   *Objection 7 (Normativity):* "Should we feel this way?" *Reply:* Descriptive, not prescriptive. We are trained by the institution to feel this. *Soft spot:* Hard to separate description from enculturation.

  6.  **The "Embarrassing Question":**
      *   *Question:* "If the value is purely institutional, why shouldn't we just legitimize perfect forgeries to increase supply and happiness?" (The Utilitarian/Institutional Change objection).
      *   *Answer:* Because the institution *is* the game. Changing the rules changes the value type, not just the quantity. Like asking why we don't just print more money to make everyone rich.

  7.  **The NFT Strategy:**
      *   *Advice:* Use it as an analogy, not a foundation. It clarifies the intuition but don't ground the theory in tech. It's a *proof of concept* for the intuition, not the *source* of the theory.

  8.  **Review and Polish:**
      *   Check tone: Professional, slightly witty (matching the user's prompt), rigorous.
      *   Check constraints: 7-8 objections, ordered by damage, specific personas, 2-min replies, soft spots noted.
      *   Ensure the Friend's objection is integrated (it's Objection #1).

  9.  **Final Tweak:** Make sure the distinction between "value source" and "value experience" is clear in the phenomenology reply, as that's the hardest pivot. Ensure the Dutton reply emphasizes the *verification* of achievement, not just the achievement itself.

  *(Self-Correction during drafting)*: I initially thought about putting the NFT question as the "embarrassing" one. But the prompt asks for a separate "embarrassing question" about originality mattering less than thought. The NFT question is better as a standard objection. The "embarrassing" one should be about the *implications* of the theory (i.e., if it's just money, why not print more?).

  Let's finalize the list order:
  1. Phenomenology (Friend's objection) - *Highest Damage*
  2. Dutton (Performance) - *High Damage*
  3. Goodman (Scope/Identity) - *Medium-High Damage*
  4. Normativity (Is/Should) - *Medium Damage*
  5. Materiality/Restoration - *Medium Damage*
  6. Anti-Theory (Metaphysics) - *Low-Medium Damage*
  7. NFT/Grad Student - *Low Damage (but distracting)*
  8. The "Embarrassing Question" (Separate section).

  Wait, I need to make sure I hit the "7 or 8 objections" count including the friend's.
  1. Phenomenology (Friend)
  2. Dutton (Performance)
  3. Goodman (Autographic/Allographic)
  4. Normativity (Is/Ought)
  5. Materiality (Restoration)
  6. Anti-Theory (Reification)
  7. NFT (Grad Student)
  8. *Wait, I need one more or combine.* Let's add the "Aesthetic Relevance" objection (Why does this bureaucratic fact matter to *aesthetic* experience?). That's distinct from phenomenology. Phenomenology is "it doesn't feel like money." Aesthetic Relevance is "why should I care about paperwork when looking at colors?"

  Okay, let's write it.
answer: |-
  Here is your prep sheet. I've ordered these by the likelihood of them derailing your talk, starting with the phenomenological hit (your friend's point) which is the most dangerous because it targets the audience's gut intuition before they even get to the logic.

  ### **Prep Sheet: The "Funny Money" Theory of Originals**

  **1. The Phenomenological Objection (Your Friend's Point)**
  *   **Who:** The Senior Phenomenologist or the "Quiet Expert" in the front row.
  *   **The Question:** "When I stand before the *Night Watch*, I feel I am in the presence of Rembrandt. I feel a historical connection. On your view, I am merely standing in front of a verified ledger entry. You are reducing a spiritual encounter to a bureaucratic stamp. Are you describing how we actually value art, or just telling us we are wrong about how we value art?"
  *   **The 2-Minute Reply:** "I'm not denying the feeling; I'm explaining its source. Think of a wedding ring. The emotional weight you feel looking at it is real, but that weight *supervenes* on the marital institution. If you found an identical ring in the gutter, the phenomenology might be similar, but the *value* is gone. With art, the 'presence' you feel is the presence of *validated history*. The institution doesn't block the experience; it enables it. We are trained by the artworld to feel 'aura' only when the provenance clears. The feeling is real, but its object is institutional, not magical."
  *   **The Soft Spot:** This risks sounding like an error theory ("You *think* you feel X, but you really feel Y"). If they push on the *immediacy* of the aesthetic experience vs. the *mediation* of the institution, you might look like you're explaining away the art.

  **2. The Duttonian Performance Objection**
  *   **Who:** The Dutton Defender (you know who they are).
  *   **The Question:** "Denis Dutton showed that art is a performance of skill. The original is the authentic record of that human achievement. A forgery is a lie about the achievement. You're saying it's a lie about a *transaction*. Why is the paperwork more important than the human labor?"
  *   **The 2-Minute Reply:** "The paperwork *certifies* the labor. If I hand you a manuscript of *Gravity's Rainbow* that is typographically perfect, but I wrote it yesterday, it is not a record of Pynchon's achievement, even if it contains the same words. In visual art, the physical object is the 'token' of the performance. But a token is only valid if minted by the right authority. A perfect counterfeit bill represents the same 'design achievement' as a real twenty, but it has no economic value. Why? Because the value isn't in the design; it's in the issuance. Art value works the same way."
  *   **The Soft Spot:** Duttonians argue the *physical trace* of the hand is the value, not the issuance. If they argue that the paint itself holds the "energy" of the gesture (even undetectable), your money analogy weakens because money is fungible; paint strokes are arguably not.

  **3. The Goodmanian Scope Objection**
  *   **Who:** The Analytic Metaphysician / Goodmanian.
  *   **The Question:** "Goodman distinguished autographic arts (painting) from allographic arts (music, literature). In music, a perfect performance of a score is the work, regardless of the manuscript's history. Does your theory imply music has no 'original' value? Or are you claiming painting is fundamentally different, and if so, doesn't that collapse back into Goodman?"
  *   **The 2-Minute Reply:** "I'm accepting Goodman's distinction but explaining *why* the autographic side works the way it does. Music is allographic because the notation system allows for identity without provenance. Painting lacks a notation system, so we *invented* provenance tracking to fill the gap. My theory explains the *consequence* of being autographic: because we can't notate a painting, we must track its history like currency. It's not that music lacks value, it's that the 'minting' conditions for music are the score and performance, not a specific physical canvas."
  *   **The Soft Spot:** If they press on *performance art* or *digital art*, your distinction might get messy. Digital art is allographic but often treated as autographic (via NFTs). Be ready for that pivot.

  **4. The Normativity Objection (Is vs. Ought)**
  *   **Who:** The Critical Theorist or Ethicist.
  *   **The Question:** "You say the value supervenes on the system working 'the way it's supposed to.' Who decides how it's supposed to work? If the artworld decided tomorrow that perfect forgeries were valid, would your theory say they suddenly have value? That makes your theory vacuous."
  *   **The 2-Minute Reply:** "It makes it *institutional*, not vacuous. If the Federal Reserve decided counterfeit bills were legal tender tomorrow, they would *be* money. Value is relational. I am not grounding value in the cosmos; I am grounding it in the actual practices of the artworld. If the practices change, the value changes. That's a feature, not a bug. It explains why art value fluctuates with discovery of provenance, even when the pixels don't change."
  *   **The Soft Spot:** This makes value seem incredibly fragile. If the audience thinks aesthetic value should be more robust than stock prices, this answer will annoy them.

  **5. The "Aesthetic Relevance" Objection**
  *   **Who:** The Formalist.
  *   **The Question:** "Even if I grant you the money analogy, why should that matter *aesthetically*? I can appreciate the colors and composition of a forgery just as well. You're conflating *market* value with *aesthetic* value. A counterfeit twenty buys the same coffee; a counterfeit Rembrandt looks the same. Why does the 'ledger' change the aesthetic experience?"
  *   **The 2-Minute Reply:** "Because we don't view art in a vacuum. We view it as *communication*. Knowing a work is a forgery changes the context of the communication from 'Rembrandt speaking to me' to 'Someone pretending to be Rembrandt speaking to me.' That changes the aesthetic category of the object. It's like hearing a sincere apology vs. a rehearsed script. The words are identical; the aesthetic force is not. The provenance tells me *who is speaking*."
  *   **The Soft Spot:** This edges back toward the Duttonian performance view. You need to maintain that it's the *validation* of the speaker, not the *skill* of the speaker, that matters.

  **6. The Materiality/Restoration Objection**
  *   **Who:** The Conservation Scientist or Material Historian.
  *   **The Question:** "Money is replaced when worn. Paintings are preserved. If I restore a painting, replacing 40% of the pigment, it's still the original. If I replace 40% of a bill, it's trash. Your analogy breaks down on material continuity."
  *   **The 2-Minute Reply:** "Actually, the artworld treats material continuity exactly like the banking system treats serial numbers. There are strict limits on restoration. If you over-restore, the work is considered 'lost' or 'ruined,' much like a damaged bill is taken out of circulation. The 'Ship of Theseus' problem in art is solved by the institution, just as the 'worn bill' problem is solved by the Mint. We tolerate some wear, but the chain of identity must hold."
  *   **The Soft Spot:** The tolerance for restoration is much higher than for money. You might get bogged down in technicalities about varnish vs. pigment.

  **7. The Anti-Theory Objection**
  *   **Who:** The Wittgensteinian / Post-Theorist.
  *   **The Question:** "You're trying to locate 'value' as if it's a substance that needs a container. Maybe 'originality' is just a family resemblance concept. Why do we need a unified theory of money and art? Isn't this just a category mistake?"
  *   **The 2-Minute Reply:** "I'm not locating a substance; I'm identifying a function. We don't need a unified theory of biology and economics to notice that both use 'signaling systems.' I'm pointing out that the *logic* of originality functions like the *logic* of currency. Even if 'value' is messy, the specific mechanism of *forgery detection* is structural. I'm explaining the mechanism, not defining the essence."
  *   **The Soft Spot:** They might just shrug and say "mechanisms are also theory-laden." Hard to win over a hardline anti-theorist.

  **8. The Grad Student / NFT Objection**
  *   **Who:** The Tech-Savvy Grad Student.
  *   **The Question:** "This sounds like you're just describing NFTs without the blockchain. Are you saying art is just a non-fungible token? Doesn't that reduce the artwork to a receipt?"
  *   **The 2-Minute Reply:** "I'm saying NFTs are a technological attempt to enforce the 'Funny Money' logic that has always existed in painting. NFTs prove my point: people are willing to pay millions for a jpeg they can right-click save, solely because of the provenance token. The artworld has always done this with canvas; blockchain just makes the ledger explicit. I'm not reducing art to a receipt; I'm noting that the receipt is what sustains the market and the status of the art."
  *   **The Soft Spot:** Associating high art with the NFT crash might make your theory look cynical or dated in five years. Use the analogy carefully.

  ---

  ### **The "Embarrassing Question" (Hope They Don't Ask)**
  *   **The Question:** "If the value is purely institutional and not intrinsic, and a perfect forgery is aesthetically identical... **why shouldn't we just change the institution?** Why not legitimize perfect forgeries to increase the supply of beauty? If the value is just a game, why play this specific version?"
  *   **Why it's dangerous:** It exposes that your theory makes originality contingent, not necessary. It suggests we are slaves to a arbitrary system that reduces overall happiness (fewer "originals" available).
  *   **The Defense:** "Because changing the rules changes the *type* of good, not just the quantity. If we legitimize forgeries, we aren't increasing the supply of 'Rembrandts'; we are ending the practice of 'Rembrandt-collecting.' It's like asking why we don't just print more money to solve poverty. You can, but then you no longer have currency; you have paper. The scarcity is constitutive of the value type. We could play a different game, but it wouldn't be *this* game."

  ---

  ### **Strategy on NFTs**
  **Do not bring it up proactively.**
  *   **Reason:** It's a distraction. If you bring it up, you become "The NFT Guy" for the Q&A, and the serious aestheticians will tune out.
  *   **If Asked:** Use it as a *reductio ad claritatem* (reduction to clarity). "NFTs are a useful stress-test for this theory." It shows your theory predicts modern behavior, but don't ground the theory *in* it. Your theory is about Rembrandt; NFTs are just the modern proof that provenance can detach from aesthetics.

  **Good luck. Defend the ledger.**
