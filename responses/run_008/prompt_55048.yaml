answer: |-
  The break room TV was stuck on a loop: a timelapse of the campus arboretum. Specifically, shrub #42. Fifteen years compressed into thirty seconds. It started as a sharp-edged dinosaur, slowly bloating into a sphere, then sprouting ears until it was a bear.

  "Bob says it's the same shrub," Paul said, stirring his coffee. "Numerically identical."

  "Bob is right," Elena said, eyes on the screen. "It's one shrub changing shape."

  "Is it?" Paul leaned forward. "At $t_1$, the object is dinosaur-shaped. At $t_2$, it is bear-shaped. Shape is an intrinsic property. If the shrub is wholly present at both times, it possesses incompatible properties. That's a contradiction. You're saying $x$ is F and $x$ is not-F."

  Elena shook her head. "You're treating time like a location where properties float around. I'm saying the shrub has the property *dinosaur-shaped-at-$t_1$* and *bear-shaped-at-$t_2$*. There's no contradiction because the properties are indexed to times. It's not 'shaped' simpliciter; it's 'shaped-at'."

  "But then shape isn't intrinsic anymore," Paul countered. "It's a relation between the shrub and a time. You've saved the object from contradiction by destroying the property. Lewis called this out. If I'm bent-at-$t_1$ and straight-at-$t_2$, I never really *am* bent. I just stand in a 'bentness' relation to a moment. That doesn't match what it feels like to be a thing."

  "And your view matches better?" Elena gestured at the screen. "Look at the video. We never see a four-dimensional worm. We see a shrub, persisting. Your view says the 'shrub' is just a collection of temporal slices. The dinosaur-stage is not the bear-stage. They're distinct entities linked by causation. So when Bob waters the shrub today, he isn't watering the thing that was a dinosaur. He's watering a current stage that is *causally connected* to a past stage."

  "Exactly," Paul said. "Just like your head and your feet are distinct spatial parts. You don't say your head is your feet. You say they are parts of one spatially extended object. Why is it so hard to accept temporal parts? The shrub is extended in time. The dinosaur segment is one part, the bear segment is another. The whole worm is the sum of both."

  "Because I can see my head and feet at once," Elena said. "I can never see the whole worm. I only ever encounter the shrub wholly present. Your ontology is committed to entities we cannot experience. But here's the bigger problem for you: Composition. Where does the worm begin and end?"

  Paul paused. "Biological continuity. When the cellular processes start and stop."

  "Surely it's vaguer than that," Elena pressed. "Suppose there's a five-minute gap where the gardener stops trimming. Is it the same worm? What if he digs it up and replants it a week later? You need a criterion for which stages compose the object. If you say 'causal continuity,' that's a relation between stages, not a fact about the object itself. You're saying the shrub is a plant only because the stages hold hands. But who decides which stages are holding hands? If you can't draw a non-arbitrary line around the worm, you don't have an object. You have a history."

  Paul tapped the table. "Vagueness exists in language, not in the world. The worm exists precisely as the stages exist. But look, Elena, your view has a cost too. If the shrub is wholly present at $t_1$ and wholly present at $t_2$, what accounts for the change? If the whole object is there at $t_1$, fully dinosaur-shaped, what motivates it to become bear-shaped? You need a primitive notion of persistence that my view explains away with geometry."

  "Your geometry explains it away by denying persistence," Elena said. "Nothing persists on your view. The dinosaur-stage exists, then ceases. The bear-stage exists. There is no *thing* that undergoes the change. You've solved the problem of temporary intrinsics by eliminating the subject of the change. I keep the subject and modify the logic of properties. You keep the logic and slice the subject."

  They watched the loop restart. The dinosaur snapped back into existence.

  "I suppose," Paul said slowly, "we agree on the physics. We agree on the spacetime coordinates. We even agree on the causal links between the stages."

  "We do," Elena said. "We disagree on what counts as 'the shrub.' You think the fundamental reality is the timeline—the whole distribution of matter across time. I think the fundamental reality is the presence—the matter here, now."

  "So when I say 'the shrub is a worm,' I mean the fundamental entity is the extension."

  "And when I say 'the shrub endures,' I mean the fundamental entity is the presence."

  Paul sighed. "We're not arguing about the plant. We're arguing about which abstraction gets the noun."

  "Basically," Elena said, standing up. "Bob still has to water it, though. And he better do it now, not at some other temporal segment."

  "True," Paul smiled. "Even worms get thirsty at specific stages."
