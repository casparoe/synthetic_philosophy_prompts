answer: |-
  **The Scenario**

  In a hospice wing, two charge nurses, A and B, independently authorize an intensive, labor-heavy analgesic protocol for a patient in acute distress. A acts solely from adherence to the facility's "Maximum Comfort Mandate," a standing rule A treats as binding regardless of context; A would have authorized the same protocol even if the patient were unconscious and insensate, or if the dosage risked respiratory depression, because A's commitment is to the Mandate itself, not the patient's specific physiological state. B acts solely from a desire to secure the quarterly "Excellence in Care" bonus, which is awarded strictly based on verified, objective reductions in patient pain metrics; B would have withheld the protocol if the patient were insensate (making verification impossible) or if the dosage risked visible side-effects that would disqualify the outcome, because B's commitment is to the bonus conditions. In the actual event, the patient is conscious and in pain, and the protocol is safe and effective; both nurses authorize the drug, exert identical effort, and achieve identical pain relief, with no outward difference in their demeanor or decision-making process observable to a third party.

  ***

  **(a) The Kantian Verdict and Pressure Point**
  A orthodox Kantian assigns moral worth exclusively to A, as A acts from the motive of duty (adherence to the moral law/rule), whereas B acts from inclination (self-interest). The pressure on this verdict enters through the *rigidity* of A's commitment. A is described as willing to administer the drug even if it were medically unnecessary or harmful, provided the Mandate remained in force. This suggests A is not responding to the *moral* demand (alleviate suffering) but to a *formal* demand (follow the rule), rendering A's agency morally blind in nearby possible worlds. The Kantian must explain why an agent who would cause harm in a slightly different scenario possesses *more* worth than an agent who restricts their action to scenarios where help is objectively effective.

  **(b) The Responsiveness Account**
  The responsiveness account assigns greater moral worth to B. The right-making feature is the *actual relief of suffering*.
  *   **Agent A's Counterfactual Profile:** A's motive (rule-adherence) does not covary with the right-making feature. If the feature (suffering) were absent, A would still act. If the feature were negated by the act (harm), A might still act. The link between motive and moral truth is broken.
  *   **Agent B's Counterfactual Profile:** B's motive (bonus-seeking) covaries perfectly with the right-making feature in this context. Because the bonus criteria are tied to verified pain reduction, B acts if and only if the pain reduction is achievable. B's motivational structure reliably tracks the moral reality, even if the *reason* for tracking is non-moral.
  On this account, moral worth is a measure of the reliability with which an agent's psychology hooks onto moral reasons. B hooks on; A hooks onto a rule that only accidentally aligns with the reason.

  **(c) The Driving Feature and Removal**
  The feature doing the work is the **counterfactual sensitivity of the motive to the right-making features**. The reversal of worth depends entirely on A being *insensitive* (willing to act without the moral reason present) and B being *sensitive* (unwilling to act without the moral reason present, due to incentive structure). If we remove this feature—for instance, by stipulating that A would *not* follow the Mandate if it caused harm (making A sensitive) or that B would seek the bonus even without verified pain reduction (making B insensitive)—the responsiveness account no longer favors B. If both are sensitive, they are equal; if both are insensitive, they are equally lacking. The verdict flips solely on the tracking reliability.

  **(d) The Strongest Kantian Reply and Its Cost**
  The Kantian replies that A, as described, is not actually acting from *duty* in the genuine sense, but from *legality* or rule-fetishism. True duty involves respect for the moral law, which requires practical judgment (*phronesis*) to apply the law to specific circumstances. A genuine agent of duty would recognize that the moral law does not command unnecessary or harmful treatment; thus, a true Kantian agent *would* be sensitive to the right-making features.
  **Cost:** This reply concedes that the *content* of the motive (duty) is insufficient for moral worth without the *structural feature* of sensitivity to moral facts. It blurs the distinction between acting from duty and acting from a motive that tracks the good. It admits that the "felt sense of duty" (A's conviction) can come apart from moral worth if that conviction is blind to the moral reality it claims to serve. The Kantian saves the theory by redefining duty to include responsiveness, effectively absorbing the competitor's criterion.

  ***

  **Critical Assessment: Where the Demonstration Fails**

  The demonstration is most likely to fail at the **stability of B's tracking**. A critic will reject the premise that B's non-moral motive *reliably* tracks right-making features in a way that confers *worth* rather than *luck*.

  1.  **The Alignment Objection:** B's sensitivity is entirely contingent on the external reward structure (the bonus criteria). If the hospital administration changes the bonus to "cost-cutting" next quarter, B's motive would immediately track *wrong*-making features. A's rigidity, while blind, is internally stable. A critic will argue that moral worth requires the sensitivity to be grounded in the agent's *own* valuation of the moral features, not in a coincidental alignment of self-interest and morality engineered by the environment.
  2.  **The Credit Objection:** If B would stop helping the moment the bonus was removed, B is not a reliable moral agent, but a reliable *instrument* of the bonus system. Moral worth is typically thought to attach to the agent's character. If the tracking mechanism is external (the bonus rules) rather than internal (B's psychology), B deserves no more credit than a thermostat that reliably tracks temperature.

  **Condition for Abandoning the Verdict:**
  I would abandon the verdict that B has more moral worth if it is shown that **reliability without moral understanding is indistinguishable from mechanistic luck.** If the responsiveness account cannot distinguish between an agent who tracks the good *because* they value it (virtue) and an agent who tracks the good *because* they are paid to (B), then the account fails to capture the normative force of "worth." If the critic successfully argues that "tracking" must be *for the right reasons* to count toward worth, then B's non-moral motive disqualifies them regardless of counterfactual sensitivity, and the construction collapses because a genuinely non-moral motive cannot sustain the requisite kind of normative sensitivity. In that case, the specification that B's motive is "frankly non-moral" is incompatible with the requirement that B's action has "moral worth," revealing a limit to the responsiveness account: it may track *rightness*, but it cannot account for *goodness of will*.
