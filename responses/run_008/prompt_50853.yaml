prompt: |-
  You are a philosopher of probability with deep expertise in anthropic reasoning and confirmation theory. Please think carefully about the following and give me a genuine diagnosis rather than a survey of positions.

  The debate over the doomsday argument seems to me to have stalled completely, and I want to understand what kind of disagreement it really is. The pro side holds that my birth rank among all humans — somewhere past the hundred billionth — is evidence about how many humans there will ever be: a roughly random sample from a species that goes extinct soon is far likelier to find itself early than one destined to spawn trillions. The anti side counters with self-indication: hypotheses on which I exist at all get boosted in proportion to how many observers they contain, and this cancels (or nearly cancels) the doom-soon update. Both camps accept the same probability calculus. The fight is over whether and how to condition on indexical facts — that I exist, that this is my birth rank — and over how the reference class of "observers" should be drawn. My hypothesis is that the dispute is not substantive at all: once priors over total observer counts are held fixed, the two sampling assumptions may make identical predictions, so the argument is really about priors smuggled in through the formalism. But I am unsure, because the reference class problem seems capable of doing real, non-verbal work.

  Before answering, brainstorm the possible diagnoses and test each against what each side actually claims. Then tell me: is this a verbal dispute, a hidden fight about priors, or a genuine methodological divide about the evidential status of anthropic facts? Pinpoint exactly where the shared mathematics stops and the contested assumptions begin, and say what, if anything — a theorem, a thought experiment, a reframing — would count as progress given your diagnosis.
