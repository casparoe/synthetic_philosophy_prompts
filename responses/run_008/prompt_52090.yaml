answer: |-
  The espresso machine hissed, a sharp counterpoint to the low hum of post-colloquium chatter fading into the evening. Ada and Ben sat at a small table near the window, steam rising from their cups. The talk had been on the semantics of epistemic modals, but the real debate was just beginning.

  **Ben:** (Stirring his coffee) I thought you handled the Q&A well, Ada. But you sidestepped the Bank Case. Again.

  **Ada:** (Smiling) I didn't sidestep it, Ben. I contextualized it. Look, in the low-stakes version, Mei and her partner are just depositing a check. The partner says, "Mei knows the bank is open." Intuitively, that's true. In the high-stakes version, the mortgage is on the line. The partner says the same sentence. Intuitively, that's false. My view explains this perfectly: the partner's conversational context shifted. The standards for "knows" went up.

  **Ben:** Your view *accommodates* the data, sure. But it gets the explanation backwards. You say the truth value shifts because the *speaker's* standards changed. I say it shifts because *Mei's* epistemic position changed.

  **Ada:** How does Mei's position change? She checked the website once. Her evidence is identical in both cases. Her belief is identical. Her reliability is identical. What changed is how much it hurts if she's wrong.

  **Ben:** Exactly. And that's what knowledge is for. Knowledge isn't just a mental state tucked away in the head; it's a status that licenses action. In the low-stakes case, Mei's evidence is sufficient to rationalize acting on the proposition that the bank is open. In the high-stakes case, it isn't. Since knowledge is the norm of practical reasoning, she knows in the first case and doesn't in the second. It's Subject-Sensitive Invariantism. The meaning of "knows" is stable; the world just changes whether Mei fits the bill.

  **Ada:** But consider a third party. Imagine a bystander, Sam, who has no stake in the mortgage. Sam watches Mei check the website. Sam says, "Mei knows the bank is open." Even if Mei's mortgage is on the line, Sam's utterance seems true.

  **Ben:** (Leans forward) Does it? If Sam knows Mei will lose her house if she's wrong, would Sam really say that?

  **Ada:** Sam might. Sam isn't acting on it.

  **Ben:** But Sam is making an assertion. And assertion is governed by knowledge. If Sam asserts "Mei knows," Sam implies it's safe to act on that. If it's not safe for Mei to act, Sam's assertion is misleading, if not false. You're relying on the intuition that a detached observer can speak truly while the subject is in the dark. I think that intuition crumbles under pressure. The stakes of the subject infect the whole conversation.

  **Ada:** That's a bold move, Ben. You're willing to say Sam speaks falsely?

  **Ben:** I'm willing to say Sam speaks loosely. Strictly speaking, if the stakes are high for Mei, she doesn't know. So "Mei knows" is false, regardless of who says it. Your contextualism saves the truth of Sam's utterance only by changing the subject. You make "knows" mean *meets the speaker's standards* rather than *is in a position to act*.

  **Ada:** I make it mean *meets the epistemic standards relevant in the conversation*. And that brings me to your nightmare scenario. The Bridge Case.

  **Ben:** (Sighs) Priya and the Manager.

  **Ada:** Precisely. Priya checks the load-bearing calculation once. She's confident. At the office, the Manager has to sign off. Millions of dollars and lives are at risk. The Manager says, "Priya knows the design is safe." Intuitively, that's false. Or at least, he shouldn't say it. He needs a second review.

  **Ben:** Agreed.

  **Ada:** Now, later that night, the Manager is at a party. No stakes. He's chatting with friends. He says, "Actually, Priya knows the design is safe. She checked the math." Intuitively, that sounds true. Priya's evidence hasn't changed. Her stakes haven't changed. The only thing that changed is the Manager's context.

  **Ben:** Okay. Here's where I bite the bullet. At the party, the Manager is speaking falsely. Or, at best, loosely.

  **Ada:** Loosely? Ben, he's stating a fact about Priya's epistemic state. If I ask you, "Did the Manager tell the truth at the party?" you'd hesitate. But on your view, there's no hesitation. He lied. He said Priya knew, but she didn't.

  **Ben:** He said something strictly false, yes. But pragmatically, he conveyed that Priya has strong evidence. In a low-stakes conversation, "knows" implicates "has strong evidence." In the high-stakes office context, "knows" requires "has evidence sufficient for life-and-death action." The semantic content is invariant—Priya doesn't know—but the pragmatic implicature shifts.

  **Ada:** That's a lot of pragmatic heavy lifting. You're asking us to believe that our intuition that the Manager is speaking *truly* at the party is a massive error. An illusion.

  **Ben:** And you're asking us to believe that "knows" is a chameleon word. That when I say "I know" and you say "You don't know," we aren't actually disagreeing. We're just talking past each other because my "knows" means *low-standard-knows* and your "knows" means *high-standard-knows*. That kills the normativity of disagreement, Ada.

  **Ada:** It doesn't kill it. It relocates it. We disagree about which standards are appropriate for the conversation. But look at the cost of your view. If SSI is true, then in the Bridge Case, Priya's knowledge status oscillates depending on what her Manager is doing? No, wait. On your view, Priya's knowledge is fixed by *her* stakes.

  **Ben:** Right. Priya's stakes.

  **Ada:** But Priya is an employee. Her stakes *are* the Manager's stakes. If the bridge falls, she's liable. So her stakes are high at the party too, technically.

  **Ben:** (Pauses) That's a fair complication. But let's stipulate she's insulated. She's done her job. The responsibility is on the Manager to sign off. So, at the party, Priya's practical situation is low-stakes. She's going home to sleep.

  **Ada:** Okay, let's grant that. Priya is low-stakes at the party. So, on your view, she *knows* at the party.

  **Ben:** Yes.

  **Ada:** And at the office?

  **Ben:** At the office, she is part of a high-stakes decision process. So she doesn't know.

  **Ada:** So, knowledge is volatile. It flips based on the practical environment. But here is the rub: The Manager's utterance at the party. "Priya knows." On your view, that is true, because Priya is low-stakes. The Manager's utterance at the office. "Priya knows." On your view, that is false, because the context of action is high-stakes.

  **Ben:** Wait. If Priya is low-stakes at the party, then "Priya knows" is true simpliciter. So the Manager tells the truth at the party. At the office, the situation is high-stakes, so "Priya knows" is false.

  **Ada:** But what makes the situation high-stakes at the office? It's the Manager's decision.

  **Ben:** It's the action required.

  **Ada:** So the truth of "Priya knows" depends on the action *the attributor* is contemplating?

  **Ben:** It depends on the action the *subject* is implicated in. At the office, Priya is implicated in the signing. At the party, she isn't.

  **Ada:** This feels like gerrymandering, Ben. You're defining "Subject's Stakes" so broadly that it swallows the Attributor's context anyway. If the Manager's stakes determine whether Priya is "implicated," then the Attributor's context is driving the bus, you're just claiming it's the Subject's engine.

  **Ben:** (Takes a sip, thoughtful) That's sharp. But there's a metaphysical difference. On your view, Ada, the *proposition expressed* changes. "Knows" picks out Relation A in the office and Relation B at the party. On my view, "Knows" picks out Relation K. Relation K is sensitive to practical environment. The difference is whether the variability is in the *word* or in the *world*.

  **Ada:** But why think the variability is in the world? Why think practical stakes alter the epistemic relation itself? Evidence is evidence. Truth is truth. Belief is belief. Why does the cost of error change whether I have knowledge?

  **Ben:** Because knowledge is the bridge between mind and world. It's not just a picture of reality; it's a tool for navigation. If the terrain gets rougher, you need a better map to say you "know" the way. A map that works for a hike might not work for a cliff climb. The map hasn't changed, but whether it counts as "sufficient for knowing the way" has.

  **Ada:** I agree the *utility* changes. I deny the *truth* changes. I can say, "Priya has sufficient evidence for a party claim, but not for an office claim." That preserves the invariant nature of evidence and belief. You're baking the utility into the truth conditions.

  **Ben:** And you're separating knowledge from action. If Priya knows at the party, can she act on it at the office?

  **Ada:** No. Because the norms of assertion and action are sensitive to context, even if knowledge is... well, even if the truth of knowledge claims is.

  **Ben:** See, that's where you lose me. You're positing two layers of normativity. One for "knows," one for "action." I'm Occam's razor-ing that. One layer. Knowledge *is* the norm of action.

  **Ada:** (Leans back) So we're at the crux. It's not about the Bank, and it's not about the Bridge. It's about the architecture of the concept.

  **Ben:** Precisely.

  **Ada:** Here is the question, then. If we found a community that treated "knows" as purely evidence-relative, ignoring stakes entirely in their linguistic practices... would we say they lack the concept of knowledge?

  **Ben:** I'd say they have a thinner concept. A theoretical concept. But when the rubber meets the road, when they have to bet their house, I bet they'd start talking like me.

  **Ada:** And I bet they'd start talking like me—they'd say, "Well, strictly speaking I know, but I can't act on it."

  **Ben:** (Smiles) So the empirical question is psychological. Do people retract knowledge claims when stakes rise, or do they retract action claims?

  **Ada:** Not just psychological. It's normative. Which practice *should* we adopt? Do we want a concept of knowledge that tracks truth-tracking capacity, or one that tracks action-readiness?

  **Ben:** I think those are the same thing. You can't separate the capacity from the readiness.

  **Ada:** And I think you're conflating the condition for having a state with the condition for using it.

  The barista began wiping down the counter, the sound of clinking cups signaling closing time. Neither philosopher moved to leave.

  **Ben:** So, we agree on the data. We agree on the cases. We disagree on whether the variability is semantic or metaphysical.

  **Ada:** Or, more precisely: Is the practical sensitivity of knowledge ascriptions a feature of the *content* of our claims, or a feature of the *nature* of knowledge itself?

  **Ben:** (Stands up, gathering his coat) If we can answer that, we solve the problem.

  **Ada:** (Standing as well) But until then, I know we'll be arguing about this next year.

  **Ben:** (Grins) High stakes?

  **Ada:** Extremely.

  **Ben:** Then I guess I don't know we'll be arguing.

  **Ada:** And I guess that depends on who you ask.

  They laughed, pushed open the door, and stepped out into the cool night, the question hanging unresolved between them, invariant in its weight, but shifting in its implications with every step they took.
