      *   *Ben's Defense of Case 2:* How does an SSI theorist handle this? Usually, they argue that the Manager at the party is speaking loosely or falsely, or that the "knowledge" at the office was never there to begin with. Or, they might argue that the Manager's stakes *do* matter because the Manager is part of the relevant action group. Let's go with the "speaking loosely/implicature" defense or the "error theory" defense. Ben should argue that strictly speaking, if Priya didn't double-check, she didn't know *period*, and the party utterance is just loose talk.
      *   *Ada's Rebuttal:* That feels like denying data. It *sounds* true at the party.
      *   *Ben's Rebuttal to Ada:* Contextualism makes communication impossible. If "knows" changes meaning constantly, how do we disagree?
      *   *The Crux:* Is the variability semantic (Ada) or metaphysical/practical (Ben)?

  4.  **Writing - Focusing on Voice and Argument:**
      *   *Ada:* Precise, focused on semantics, truth-conditions, linguistic data.
      *   *Ben:* Focused on action, rationality, the link between knowledge and assertion/action.
      *   *Tone:* Respectful, caffeinated, slightly weary but sharp.

      *(Self-Correction during drafting)*: Make sure I don't mix up the cases.
      *   Case 1 (Bank): Subject stakes vary. Ben likes this. Ada must explain it via Attributor stakes (since Partner = Attributor, and Partner shares Subject's stakes, Ada can say the Attributor's standards rose).
