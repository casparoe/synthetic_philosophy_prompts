      *   *Correction/Strategy:* Ada needs to distinguish between *whether Mei can act* and *whether the sentence is true*. Or, she needs to introduce a third party. Actually, the prompt specifies the partner asserts it. If the partner shares the stakes, their context is high. So Ada must concede the sentence is false in the high-stakes version. Her move must be: The *truth conditions* shifted because the *speaker's* context shifted (since the partner is the speaker and is in high stakes). Ben's move: The truth conditions shifted because *Mei's* stakes shifted.
