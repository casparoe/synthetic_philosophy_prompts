      *Let's refine Ben's Case 2 response.* Standard SSI (Stanley): Knowledge is invariant to attributor context. If Priya doesn't know at the office, she doesn't know at the party. The intuition that she *does* know at the party is an illusion caused by loose talk. Ben should defend this.

      *Let's refine Ada's Case 1 response.* Standard Contextualism (DeRose/Cohen): The truth conditions shift with the attributor. Since the partner is the attributor, and their stakes rise, the standard rises. Ada should emphasize that if a *third party* with low stakes talked about High-Stakes Mei, they could truly say "Mei knows."

