      *Wait, a nuance on Case 1 for Ada:* If the Partner is the attributor, and the Partner faces the mortgage risk, then the Partner's context *is* high stakes. So Contextualism predicts "Mei knows" is false. SSI also predicts "Mei knows" is false (because Mei's stakes are high). So Case 1 doesn't distinguish them well *unless* we imagine a low-stakes attributor talking about a high-stakes subject.
      *Re-reading the Prompt:* "In both versions, her partner asserts..." The partner shares the mortgage risk. So in Case 1, both the Subject's stakes and the Attributor's stakes rise together.
