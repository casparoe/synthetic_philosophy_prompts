prompt: |-
  I help run an interdisciplinary reading group on mechanistic interpretability, and a colleague from computer science left half the room convinced of a conclusion I can't accept but can't manage to refute. His argument, as I reconstruct it:

  (1) A state of a system represents F only if two conditions are met: information about F is recoverable from that state, and the system uses that information in producing its F-involving behavior. Call these the information condition and the use condition.

  (2) Everything interpretability research offers as evidence for representational claims bottoms out in one of two kinds of result: decoding — training an external classifier (a probe) to read F off internal activations — and intervention — ablating, patching, or amplifying internal states and observing behavior.

  (3) Take decoding first. A linear probe applied to the activations of a randomly initialized network of the same architecture decodes features of the input well above chance, since random weight matrices are close to information-preserving maps; and a probe with enough capacity, trained on randomly permuted labels, will drive its training accuracy arbitrarily high, because the probe is itself a learner. So above-chance decoding is a property of the probe-and-dataset pair, obtainable from systems that have learned nothing whatsoever.

  (4) A signal that is present whether or not the system has done the thing the signal is supposed to indicate is not evidence that the system did that thing. So decoding accuracy, however high, is no evidence of representation.

  (5) The obvious reply is that the trained network's accuracy exceeds the random baseline and that the margin is the evidence. But the baseline's very existence shows the raw score is partly probe artifact, and a margin over an artifact is not a representation; at best it is an uninterpreted statistical excess. To treat it as representational content, you would need a theory of what the baseline subtracts, and no such theory is on offer.

  (6) Now the use condition. The only evidence for use is intervention. But intervention shows causal relevance only, and causal relevance is cheap in a network whose features are superposed: ablating almost any direction of sufficient norm changes behavior somehow, and whatever change you observe can be described in terms you invent after seeing it.

  (7) So no probe result and no intervention result is evidence of representation, and these two exhaust the evidence interpretability could in principle supply.

  (8) Nothing in the argument turned on gradient descent, artificiality, or scale: population decoding in neuroscience and lesion or stimulation studies in brains have exactly the structure of (3) through (6).

  (9) Therefore nothing — artificial or biological — has ever been evidenced to represent anything, and the interpretability program is not merely unfinished but impossible in principle.

  He is serene about (9): representation, he says, was always a loanword, and the program was misdescribed from the start. I want to keep (1), which nearly everyone in the room accepted without comment, and I half-suspect the trouble is somewhere in (4) and (5) — but every time I try to say what is wrong with (4), my objection starts to prove too much in the other direction, since it would apparently discredit any test that an untrained or unprepared control subject partly passes, which is half of psychometrics. Tell me which step to reject, why that step looked fine to a room of people who work on this for a living, and what rejecting it costs — including whether my colleague can simply accept your diagnosis, concede that step, and retreat to a defensible core of the argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Interdisciplinary reading group on mechanistic interpretability (MI).
      *   **Problem:** A CS colleague argues that MI (and neuroscience) cannot *in principle* evidence representation. He convinced half the room. The user accepts premise (1) (Information + Use conditions) but suspects flaws in (4) and (5) regarding decoding/baselines.
      *   **The Colleague's Argument:** A 9-step syllogism concluding that representation is impossible to evidence because decoding is trivial (probes learn, not networks) and intervention is just causal relevance (which is cheap/ubiquitous).
      *   **Goal:** Identify which step to reject, explain why it looked plausible to experts, explain the cost of rejecting it, and determine if the colleague can retreat to a defensible core.
      *   **Constraint:** The user wants to keep (1). The objection to (4)/(5) must not discredit standard psychometrics (control subjects partly passing tests).

  2.  **Deconstruct the Colleague's Argument:**
      *   (1) Definition of Representation: Info recoverable + Info used. (Accepted by user/room).
      *   (2) Evidence types: Decoding (probes) + Intervention (ablation/patching). (Standard MI practice).
      *   (3) Decoding Critique: Random networks decode well; probes can overfit. High accuracy is a property of the probe, not the network.
      *   (4) Inference Rule: If a signal exists without the system learning, it's not evidence of representation.
      *   (5) Baseline Critique: Beating a random baseline doesn't help because the baseline is an artifact. We lack a theory to subtract the artifact.
      *   (6) Intervention Critique: Causal relevance is cheap (superposition). Post-hoc description makes it vacuous.
      *   (7) Conclusion on Evidence: Neither decoding nor intervention works.
      *   (8) Generalization: Applies to neuroscience too.
      *   (9) Final Conclusion: Representation is impossible to evidence; MI is impossible in principle.

  3.  **Evaluate the Weak Points:**
      *   *Premise (1):* User wants to keep this. It's a standard causal/informational hybrid view (like Dretske or Millikan but operationalized).
      *   *Premise (2):* Mostly true for current MI, but maybe too narrow? (e.g., circuit analysis, formal verification). However, for the sake of the argument, let's grant it.
      *   *Premise (3):* Technically true (random projections preserve distance, universal approximation of probes). But does it imply (4)?
      *   *Premise (4) & (5):* This is the core epistemic claim. "Signal present in random net = no evidence." "Beating baseline = uninterpreted statistical excess."
      *   *Premise (6):* "Causal relevance is cheap." This is the "Causal Scrubbing" or "Causal Mediation" counter-argument territory.
      *   *Conclusion (9):* "Nothing has ever been evidenced to represent anything." This is a radical skepticism claim.

  4.  **Identify the Critical Flaw:**
      *   The argument relies on a **false dichotomy in the interpretation of baselines** (Step 5) and a **misunderstanding of what constitutes a control** (Step 4).
      *   *Step 4* claims: "A signal that is present whether or not the system has done the thing... is not evidence."
      *   *Counter:* In science, we rarely look for signals *absent* in controls. We look for *significant differences* between conditions. The colleague admits this in (5) ("trained network's accuracy exceeds the random baseline") but dismisses the margin as "uninterpreted statistical excess."
      *   *Step 5* is the real killer. It claims we need a theory to subtract the baseline artifact. But standard statistical inference *is* that theory. If the trained net significantly outperforms the random net *on the same probe architecture*, the delta is attributed to the training.
      *   *Step 6* is also vulnerable. Causal relevance isn't cheap if you require *specific* causal relevance (matching the representational content). Ablating *anything* changes behavior, but ablatting *specific feature F* should change *F-specific behavior*, not just *any* behavior.

  5.  **Formulate the Rejection Strategy:**
      *   **Target:** Reject **Step (5)** primarily, supported by a refinement of **Step (4)**.
      *   **Why Step (5)?** It demands an impossible standard of "artifact subtraction theory" that would invalidate almost all empirical science (fMRI, psychometrics, physics). It treats the baseline as noise that *must* be theoretically modeled rather than a control condition to be statistically compared against.
      *   **Why it looked fine:** Because high-capacity probes *do* overfit, and random networks *do* encode information geometrically. It feels like the probe is doing the work.
      *   **The Cost:** You have to accept that representation is a *comparative* property (System S represents F relative to Baseline B), not an intrinsic absolute property. You also have to accept that "representation" is a gradable concept (degree of evidence), not binary.
      *   **Can the colleague retreat?** Yes. He can retreat to "Representation is harder to prove than we thought" or "We need better baselines (e.g., data-dependent baselines)," but he cannot maintain "Impossible in principle."

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the strength of the argument. It's a sophisticated version of the "Probes are just classifiers" critique (reminiscent of Hewitt & Manning, or the "Linear Representation Hypothesis" debates).
      *   *The Pivot:* The error is in **Step (5)**. It commits the "Baseline Fallacy."
      *   *Explaining Step (5)'s failure:*
          *   The colleague argues that because the baseline is non-zero, the margin is uninterpreted.
          *   Analogy: Drug trials. Placebo effect exists. Does that mean drug efficacy is "uninterpreted statistical excess"? No. We compare Treatment vs. Placebo.
          *   Psychometrics connection (User's concern): A control subject passing a test doesn't invalidate the test; it sets the floor. The *difference* is the signal.
          *   The "Theory to subtract" is Statistics + Experimental Design.
      *   *Addressing Step (4):* It sets a bar too high (signal must be *zero* in control). Science relies on *differential* evidence.
      *   *Addressing Step (6) (Intervention):* This is the second line of defense. Causal relevance is not enough; *specific* causal relevance is required. If I ablate "dog" and "cat" behavior changes, that's evidence. If I ablate "dog" and "gravity" changes, that's noise. The argument ignores *specificity*.
      *   *The Cost:*
          *   Representation becomes contrastive (S represents F better than S_random).
          *   It becomes probabilistic, not certain.
          *   It requires careful probe selection (minimal capacity).
      *   *Colleague's Retreat:* He can argue for "Robust Representation" (needs to survive stricter baselines) but not "Impossible."

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is Step (3) actually true?* Random networks preserve information, yes, but do they decode *semantic* features above chance significantly? Usually, they decode low-level stats, not high-level semantics. The colleague conflates "information" with "semantic feature F."
      *   *Wait, Step (1) is actually tricky.* "System uses that information." Intervention is supposed to show use. Step (6) attacks intervention. I need to make sure I defend intervention too, or the user loses the "Use" condition.
      *   *Focus:* The prompt asks to identify *which step to reject*. I should focus on the strongest break point. Step (5) is the epistemic bottleneck. Step (6) is the causal bottleneck.
      *   *Decision:* Attack **Step (5)** as the primary error (epistemic skepticism), and qualify **Step (6)** (causal specificity).
      *   *Psychometrics constraint:* Ensure the explanation explicitly validates control subjects in psychometrics to satisfy the user's worry.

  8.  **Finalizing the Structure:**
      1.  **Diagnosis:** The argument is a skeptical paradox built on an unreasonable demand for "intrinsic" evidence rather than "contrastive" evidence.
      2.  **The Step to Reject:** Step (5). (With support from correcting Step (4)).
      3.  **Why it looked plausible:** The "Probe Artifact" anxiety is real (probes are powerful).
      4.  **Why it's wrong:** It misunderstands the logic of controls (Placebo analogy). It demands a theory of noise that we already have (statistics).
      5.  **Addressing the Psychometrics Worry:** Explicitly show how this saves psychometrics.
      6.  **The Intervention/Use Condition (Step 6):** Briefly salvage this via *specificity* (Causal Scrubbing).
      7.  **The Cost:** Representation is contrastive and gradable.
      8.  **Colleague's Retreat:** He can demand higher standards (minimal probes, causal specificity) but must abandon "Impossible in Principle."

  9.  **Tone Check:** Needs to be respectful of the colleague's sophistication (this is a high-level argument) but firm on the logical error. Avoid jargon where possible, but use MI terms correctly (probes, ablation, superposition).

  10. **Final Polish:** Ensure the distinction between "Information exists" and "Information is *learned*" is clear. The random net has information *potentially*, but the trained net has it *accessibly/robustly* for the task. Actually, the key is that the *structure* of the information differs. Random nets encode input in geometry; trained nets encode *task-relevant abstractions*. The probe accuracy *margin* captures this abstraction.

      *(Self-Correction during drafting)*: I need to be careful not to say random nets encode *semantic* features. They encode *input* information. If the probe decodes "sentiment" from a random net, it's because the probe is mapping input n-grams to sentiment, not because the net represents sentiment. The *margin* over the random net indicates the net has organized the information *for* sentiment. Step (5) denies the evidential value of this organization. That's the target.

      Let's write the response.based on this plan.
answer: |-
  This is a sophisticated skeptical argument. It effectively combines the "Probes are just classifiers" critique (often associated with Hewitt & Manning, 2019) with a radical underdetermination problem for causal intervention. It feels compelling because it exploits a genuine anxiety in the field: **the separation of the observer's intelligence from the system's intelligence.**

  However, the argument fails at **Step (5)**.

  Your colleague's conclusion (9) relies on Step (5) to bridge the gap between "decoding is imperfect" and "decoding provides *no* evidence." Step (5) asserts that because the baseline (random network) produces non-zero decoding accuracy, the margin over that baseline is an "uninterpreted statistical excess" lacking a theory of subtraction.

  This is false. The "theory of subtraction" is **experimental control and statistical inference**, which is exactly what psychometrics and empirical science use.

  Here is the breakdown of why Step (5) is the failure point, why it seduced the room, the cost of rejecting it, and how your colleague can retreat without surrendering his core caution.

  ### 1. Why Step (5) is the Error
  Step (5) claims: *"To treat [the margin over baseline] as representational content, you would need a theory of what the baseline subtracts, and no such theory is on offer."*

  This demands a theory of **intrinsic** representation, but science only ever provides evidence for **contrastive** representation.

  *   **The Placebo Analogy:** In a drug trial, the placebo group often shows improvement (the "baseline"). Step (5) argues that because the placebo group improves, the *difference* between the drug group and the placebo group is an "uninterpreted statistical excess" unless we have a theory of exactly *why* the placebo worked. This is absurd. We do not need a complete theory of the placebo effect to know the drug has a specific efficacy *beyond* it. The control condition *is* the theory of the artifact.
  *   **The Psychometrics Analogy (Your Concern):** You worried that objecting to (4) would discredit tests where control subjects partly pass. Step (5) is where that worry is resolved. If a control subject scores 20% on a reasoning test (guessing + heuristics) and the expert scores 80%, the "60% margin" is the evidence of expertise. We do not need a theoretical model of the control subject's heuristics to claim the expert has something the control lacks. The baseline *defines* the null hypothesis of "no representation."

  Your colleague's error is treating the random network baseline as **noise** that must be theoretically modeled, rather than as a **control condition** that defines the null. The "theory" is the experimental design: *If training induces representation, trained nets should decode F significantly better than untrained nets, given identical probe architectures.*

  ### 2. Why It Looked Fine to the Room
  This argument convinced half your group because Step (3) is technically correct, and Step (5) exploits a real methodological weakness in current interpretability.

  *   **Probe Capacity:** It is true that high-capacity probes can "learn" the task from the activations even if the network hasn't represented the feature usefully. This makes the raw decoding score (Step 4) suspect.
  *   **Geometry vs. Semantics:** Random networks preserve input information geometrically (due to properties of random projections). A powerful probe can recover input features from a random net. This makes it feel like the *probe* is doing the representing, not the network.
  *   **The "Loanword" Intuition:** There is a genuine philosophical worry that we are projecting human concepts onto matrices. Step (5) formalizes this worry into a methodological veto.

  The room accepted it because it feels like a rigorous demand for purity: "Don't tell me you found gold unless you can prove the dirt isn't gold-colored." But Step (5) falsely claims we have no assay for gold-colored dirt. We do: it's the random baseline.

  ### 3. The Cost of Rejecting Step (5)
  If you reject (5), you must accept three consequences that modify the standard view of representation:

  1.  **Representation is Contrastive, Not Intrinsic:** You cannot say "Neuron N represents F." You must say "Network T represents F *to a significantly greater degree than* Network R (random baseline), under probe architecture P." Representation becomes a relational property between the system, the task, and the null model.
  2.  **Representation is Graded:** Since evidence relies on statistical margins over baselines, representation is not a binary switch (on/off). It is a continuous variable (signal-to-noise ratio relative to baseline). This fits MI practice but contradicts folk-psychological views of "having a concept."
  3.  **Probe Sensitivity Matters:** You must concede that the *choice of probe* is part of the representational claim. A linear probe finding a feature implies a *linear* representation. A non-linear probe implies a *non-linear* representation. You cannot claim the network represents F "simpliciter," only that it represents F *in a format decodable by class C*.

  ### 4. Salvaging the Use Condition (Step 6)
  While Step (5) is the fatal flaw, Step (6) (Intervention) is also too strong. Your colleague argues causal relevance is "cheap" because of superposition (ablating anything changes something).

  To defend the "Use Condition" in Premise (1), you need to add a **Specificity Constraint** to intervention.
  *   **Colleague's Claim:** Ablating direction $d$ changes behavior $B$.
  *   **Refutation:** Representation of $F$ requires that ablating $d$ changes *F-relevant* behavior specifically, without indiscriminately destroying *G-relevant* behavior.
  *   **Method:** This is what **Causal Scrubbing** or **Patch Scoping** attempts to do. If I ablate the "dog" direction, dog classification should drop, but cat classification and sentiment analysis should remain stable. If ablation causes global collapse, it is not evidence of specific representation.

  If you add Specificity to the Use Condition, Step (6) fails. Causal relevance is cheap; *specific* causal relevance is not.

  ### 5. Can Your Colleague Retreat?
  Yes. Your colleague can concede Step (5) and (6) while maintaining a defensible, stricter core. He does not need to accept (9) ("Impossible in principle").

  **The Defensible Retreat:**
  He can argue that **current** interpretability practices are often insufficient, not that the project is impossible.
  *   **Concession:** Decoding margins over random baselines *do* count as evidence (reject 5).
  *   **Retention:** However, standard baselines (random initialization) are often too weak. We need **data-dependent baselines** (e.g., networks trained on scrambled labels) to rule out that the network just learned simple heuristics rather than robust representations.
  *   **Retention:** Intervention requires **causal specificity**, not just causal impact. (Reject 6).

  **His New Conclusion:**
  "Representation is not impossible to evidence, but the bar is much higher than most papers claim. Most 'features' discovered are likely probe artifacts or non-specific causal levers. We need better baselines and stricter causal tests."

  ### Summary for the Group
  To refute him without losing the room:

  1.  **Grant (1), (2), and (3).** (Random nets do decode; probes are learners).
  2.  **Reject (5).** The "theory of subtraction" is the control condition itself. Demanding more is demanding a theory of the placebo effect before accepting a drug works. This saves psychometrics and standard science.
  3.  **Qualify (6).** Causal relevance is only evidence of representation if it is *specific* to the content F.
  4.  **Accept the Cost.** Representation is contrastive, graded, and probe-relative.
  5.  **Offer the Retreat.** The colleague can maintain that MI is *harder* than advertised, but not *impossible*.

  If he insists on (9), he is no longer doing science; he is doing philosophy of skepticism. In that frame, he is right that *nothing* is evidenced to represent anything (including human brains), but that is a victory of semantics, not a discovery about neural networks.
