answer: |-
  # Decision Tree: The Logic of Future Contingents
  **Seminar Unit Handout**

  **Entry Sentence:** $p$ = "There will be a sea battle tomorrow."

  This decision tree maps the logical space of future contingents. Do not look at the position names until you have answered the diagnostic questions based on your own intuitions about truth, time, and logic.

  ---

  ## Part I: The Decision Tree

  ### **Node 1: The Bivalence Test (Atomic)**
  **Question:** Right now, is the sentence "$p$" (**There will be a sea battle tomorrow**) either **true** or **false**?
  *   **YES:** It has a classical truth value (T or F) right now. $\rightarrow$ **Go to Node 2.**
  *   **NO:** It is currently indeterminate, neither true nor false. $\rightarrow$ **Go to Node 3.**

  ---

  ### **Node 2: The Metaphysics of the Future (Privilege)**
  *(For those who answered YES to Node 1)*
  **Question:** Is there **one specific future branch** that is already privileged as *the* way things will go, which makes your answer to Node 1 true?
  *   **YES:** There is a unique, actual future line, even if we don't know it. $\rightarrow$ **Go to Node 4.**
  *   **NO:** The future is genuinely branching; no single path is "actual" yet. (You likely think "$p$" is false because it isn't settled, or true only if settled on all paths). $\rightarrow$ **LEAF: The Peircean View.**

  ---

  ### **Node 3: The Tautology Test (Excluded Middle)**
  *(For those who answered NO to Node 1)*
  **Question:** Even though "$p$" is neither true nor false, is the disjunction **"$p$ or not-$p$"** (**Either there will be a sea battle tomorrow or there won't**) **true** right now?
  *   **YES:** The disjunction is true, even if the parts lack values. $\rightarrow$ **LEAF: Supervaluationism / The Open Future.**
  *   **NO:** The disjunction is also neither true nor false (or has a third value). $\rightarrow$ **LEAF: Łukasiewicz's Three-Valued Semantics.**

  ---

  ### **Node 4: The Modality Test (Necessity)**
  *(For those who answered YES to Node 2)*
  **Question:** If "$p$" is true now (because of the privileged future), does that mean the sea battle is **necessary** (it *must* happen, it is unavoidable)?
  *   **YES:** Truth implies inevitability. $\rightarrow$ **LEAF: Bivalent Fatalism.**
  *   **NO:** It is true that it will happen, but it could have been otherwise (contingent). $\rightarrow$ **LEAF: Ockhamism.**

  ---

  ## Part II: The Leaves (Position Definitions)

  ### **1. Bivalent Fatalism**
  *   **Path:** Yes (Bivalence) $\rightarrow$ Yes (Privilege) $\rightarrow$ Yes (Necessity).
  *   **Core Claim:** Future contingent statements are true or false now. There is one actual future. If a future statement is true, the event is fixed and necessary.
  *   **Motivation:** Preserves classical bivalence and the intuition that truth corresponds to reality.
  *   **Cost:** Threatens human freedom and the contingency of the future (the "Lazy Argument").

  ### **2. Ockhamism**
  *   **Path:** Yes (Bivalence) $\rightarrow$ Yes (Privilege) $\rightarrow$ No (Necessity).
  *   **Core Claim:** Future contingent statements are true or false now relative to the **privileged actual future**. However, truth does not imply necessity; the privileged future is contingent (it could have been different).
  *   **Motivation:** Saves bivalence and contingency. Distinguishes between "truth in the actual future" and "truth in all possible futures."
  *   **Cost:** Requires a metaphysical account of how one future is "actual" before it happens without being necessary.

  ### **3. The Peircean View ("As-of-Now")**
  *   **Path:** Yes (Bivalence) $\rightarrow$ No (Privilege).
  *   **Core Claim:** There is no privileged future branch. "$p$" is treated as a modal claim: "$p$ is true" means "$p$ occurs on **all** possible future branches." Since contingent events don't occur on all branches, "$p$" is simply **false** (not indeterminate).
  *   **Motivation:** Respects branching time without truth-value gaps.
  *   **Cost:** Counterintuitive to say "There will be a sea battle" is *false* rather than *unsettled* when the battle is possible but not certain.

  ### **4. Supervaluationism / The Open Future**
  *   **Path:** No (Bivalence) $\rightarrow$ Yes (Tautology).
  *   **Core Claim:** "$p$" lacks a truth value because it is true on some histories and false on others. However, "$p \lor \neg p$" is **super-true** because it is true on *all* histories.
  *   **Motivation:** Preserves classical logical laws (LEM) while denying bivalence for atomic future claims. Matches the intuition that the future is "open."
  *   **Cost:** Truth is no longer defined as correspondence to a single reality; logic becomes non-truth-functional.

  ### **5. Łukasiewicz's Three-Valued Semantics**
  *   **Path:** No (Bivalence) $\rightarrow$ No (Tautology).
  *   **Core Claim:** "$p$" has a third value (Indeterminate). Consequently, "$p \lor \neg p$" also takes the third value. The Law of Excluded Middle fails for future contingents.
  *   **Motivation:** Radical commitment to the openness of the future; if the parts are indeterminate, the whole should be too.
  *   **Cost:** Sacrifices classical tautologies. Many logics (e.g., standard probability theory) break down if LEM fails.

  ---

  ## Part III: Logical Space Analysis

  ### **Unoccupied Combinations**
  There are theoretically possible combinations of answers that no major theory occupies.

  1.  **Non-Bivalent + Privileged Future:**
      *   *The Combination:* "$p$" is neither T nor F, *but* there is already one privileged actual future.
      *   *Why Unoccupied:* **Incoherent.** If there is a single privileged future that makes reality determinate, standard correspondence theories dictate that "$p$" should be T or F based on that future. To deny bivalence here requires denying that truth tracks the privileged reality, which undermines the motivation for positing a privileged future in the first place.
  2.  **Bivalent + No Privilege + Necessity:**
      *   *The Combination:* "$p$" is T/F, no privileged future exists, yet "$p$" is necessary.
      *   *Why Unoccupied:* **Unattractive/Redundant.** If there is no privileged future (branching), necessity usually requires truth on *all* branches (Peircean). If one claims it is necessary without truth on all branches, one needs a non-standard modal logic. If it is true on all branches, it collapses into the Peircean view (which says "$p$" is false if not on all branches, or redefines "$p$").

  ### **Indistinguishable Leaves: Open Future vs. Supervaluationism**
  **Can the tree pull them apart?** **No.**
  *   **Reason:** "The Open Future" is primarily a **metaphysical** thesis (the future does not yet exist/is not settled). "Supervaluationism" is a **semantic** framework (truth is super-truth across histories).
  *   **Overlap:** Almost all proponents of the Open Future adopt Supervaluationist semantics to model their metaphysics. They answer the diagnostic questions identically: Atomic sentences lack values; Disjunctions are true; No privileged branch.
  *   **Distinction:** One could theoretically be an Open Future metaphysician who prefers Łukasiewicz semantics (denying LEM), but this is rare. In the context of this tree, they occupy the same leaf. Distinguishing them requires questions about *why* you hold the view (metaphysics vs. logic), not *what* truth values you assign.

  ### **Aristotle's *De Interpretatione* 9**
  **Where does Aristotle sit?**
  **Status:** **Disputed / Unstable.**
  Interpreters disagree fundamentally on which leaf represents Aristotle, largely because the text supports contradictory intuitions.

  1.  **The Traditional (Łukasiewicz) Reading:** Aristotle denies bivalence for singular future contingents to save contingency. He famously worries that if "$p$" is true now, the event is necessary. This places him at **Node 1 (NO)**. Some read him as denying LEM too (**Łukasiewicz Leaf**), arguing he thinks "$p \lor \neg p$" is problematic for contingents.
  2.  **The Ockhamist Reading (e.g., Gaskin, Whitaker):** Aristotle maintains bivalence (Node 1: YES) but denies that truth implies necessity (Node 4: NO). On this reading, Aristotle distinguishes between "being true" and "being necessarily true." This places him at the **Ockhamist Leaf**.
  3.  **The Supervaluationist Reading:** Some argue Aristotle anticipates the idea that while the disjunction is necessary, the disjuncts are not. This places him at the **Supervaluationist Leaf**.

  **Seminar Note:** When placing Aristotle, acknowledge that the decision tree reveals *our* modern categorization schemes. Aristotle may not have been working with a unified semantic theory that maps cleanly onto any single leaf, but rather diagnosing a specific fallacy regarding necessity.

  ---

  ## Instructor's Guide to Using the Tree

  1.  **Blind Testing:** Have students answer the four questions *before* revealing the leaf names. This reveals their pre-theoretic commitments.
  2.  **The Tautology Trap:** Students often answer "Yes" to Node 1 (Bivalence) but "No" to Node 4 (Necessity), landing them in Ockhamism. However, if they feel uneasy about the "Privileged Future" (Node 2), push them to the Peircean or Supervaluationist side.
  3.  **The Peircean Nuance:** Ensure students understand that Peirceans answer "Yes" to Bivalence (Node 1). They do not say "$p$" is indeterminate; they say "$p$" is *false* (because it isn't settled). This is the most common point of confusion.
  4.  **Aristotle Discussion:** Use the ambiguity of Aristotle's position to show how the tree clarifies modern debates. Ask: "If Aristotle is an Ockhamist, why did Łukasiewicz think he was a three-valued logician?" (Answer: Different readings of the connection between truth and necessity).
