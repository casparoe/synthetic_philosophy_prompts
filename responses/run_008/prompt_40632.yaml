  Let's pull up a chair and treat this like a seminar tutorial. You're asking me to reverse-engineer a historiographical algorithm based on a specific set of moral verdicts. This is less about the wars themselves and more about the *criteria of culpability* your flatmate is applying. As someone who writes about collective responsibility, I find this fascinating. She isn't just applying "who shot first"; she's weighing *agency* against *structure*.

  Here is the breakdown of the inference problem, the rules derived from her track record, and my predictions for your upcoming dinner debate.

  ### Part 1: The Inference Problem (Deriving the Rules)

  To predict her future rulings, we need to isolate the variables in her past verdicts. I see three competing hypotheses (rules) that could explain her logic, but her track record weights them differently.

  **Hypothesis 1: The "Kinetic Initiator" Rule (First Shot)**
  *   *Definition:* Blame the state that physically initiated hostilities or formally declared war.
  *   *Support:* **US Civil War** (South fired on Sumter), **Korea** (North crossed the 38th Parallel), **Seven Years' War** (Frederick invaded Saxony), **WWII** (Germany invaded Poland).
  *   *Weakness:* It fails to explain **WWI**. Germany did not fire the first shot globally (Austria-Hungary declared on Serbia first), nor did they invade first (Russia mobilized first). Yet she blames Germany. This suggests "First Shot" is a secondary heuristic, not the primary rule.

  **Hypothesis 2: The "Last Clear Chance" Rule (Agency)**
  *   *Definition:* Blame the leadership that had the capacity to de-escalate a crisis but chose war as a deliberate instrument of policy, effectively "locking in" the conflict.
  *   *Support:* **WWI** (Her specific phrasing: "German leadership made the choice that locked a continental war in"). **Seven Years' War** (Frederick invaded *despite* diplomatic alternatives, even if Austria was provocative). **Franco-Prussian** (Anticipated: Bismarck's manipulation).
  *   *Weakness:* It struggles with **Thirty Years' War**. If agency is king, why no culprit there? Because she recognizes a limit to agency.

  **Hypothesis 3: The "Structural Overdetermination" Exception**
  *   *Definition:* If the political/religious/constitutional system makes war inevitable regardless of individual choices, primary blame dissolves.
  *   *Support:* **Thirty Years' War** ("Empire's constitution plus confessional deadlock made the whole thing pretty much overdetermined").
  *   *Crucial Distinction:* She applied this to the 30YW but *not* to WWI. This tells us she views 1618 as a systemic failure, but 1914 as a failure of specific leaders within a system. She reserves "No Culprit" for when the system itself is the only explanatory variable.

  **Synthesis of Her Logic:**
  Her primary rule is **Agency (Last Clear Chance)**. She blames the leader who turned a crisis into a war. She uses **Kinetic Initiation** as strong evidence of that agency. However, if she perceives the **Structure** as overdetermining the outcome (removing meaningful agency), she withholds blame.

  ### Part 2: The Predictions

  Here is how I believe she will apply this algorithm to your three candidates.

  **(a) The Franco-Prussian War (1870–71)**
  *   **The History:** Bismarck edited the Ems Telegram to insult the French, knowing it would likely cause a declaration of war. France, feeling humiliated, declared war first.
  *   **The Conflict:** France fits the "Kinetic Initiator" rule (declared war). Prussia fits the "Last Clear Chance" rule (Bismarck manipulated the crisis to ensure war).
  *   **My Prediction:** **Prussia (Bismarck).**
  *   **The Reasoning:** Her WWI ruling is the tie-breaker here. In 1914, she blamed Germany even though the alliance system was reckless and Russia mobilized first, because Germany "locked it in." In 1870, Bismarck did exactly what she accused the German leadership of doing in 1914: he manufactured a diplomatic point of no return. France's declaration was a reaction; Bismarck's edit was the *choice*. She values the *intent to make war inevitable* over the *formal declaration*.

  **(b) The Russo-Japanese War (1904–05)**
  *   **The History:** Russia stalled negotiations while building up forces in Manchuria/Korea. Japan, feeling encircled, launched a surprise torpedo attack on Port Arthur before a formal declaration.
  *   **The Conflict:** Japan fits "Kinetic Initiator" (surprise attack). Russia fits "Provocateur" (stalling diplomacy). This parallels the Seven Years' War (Frederick vs. Austria).
  *   **My Prediction:** **Japan.**
  *   **The Reasoning:** Look closely at her Seven Years' War ruling: "Mainly Frederick, for invading neutral Saxony, *even though Austria was gunning for revenge*." She acknowledged Austrian provocation but still blamed the person who initiated the kinetic escalation. In her view, Russia's stalling was "reckless" (like the powers in WWI), but Japan made the discrete choice to turn a dispute into a shooting war. Unlike the Franco-Prussian case, there was no "Ems Telegram" moment where Russia left Japan no honorable exit; Japan chose a preemptive strike as policy. That aligns with Frederick's choice to invade Saxony.

  **(c) The Peloponnesian War (431–404 BC)**
  *   **The History:** Sparta feared Athens' rising power. Athens refused Spartan ultimatums (Megarian Decree). Sparta invaded Attica. Thucydides famously argued the war was "inevitable" due to the growth of Athenian power.
  *   **The Conflict:** Sparta fits "Kinetic Initiator" (invaded). Athens fits "Revisionist Power" (expansion). But the "Thucydides Trap" is the classic argument for Structural Overdetermination.
  *   **My Prediction:** **No Primary Culprit.**
