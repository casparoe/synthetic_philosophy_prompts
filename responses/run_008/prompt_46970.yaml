prompt: |-
  You're an expert in social choice theory and in designing classroom simulations. I teach a PPE elective on collective decision-making — 18 students, one 75-minute session, no prior exposure to formal results. I want a game that makes them feel the Gibbard–Satterthwaite theorem in their bones: not "here is a voting rule that can be manipulated" but "any halfway decent rule over 3+ options leaves everyone with an incentive to lie about their preferences sometimes."

  Here's roughly what I imagine, but you design the details. Round one: a sincere ballot under some rule (plurality? Borda?) where the outcome is unsatisfying given the full preference profile, which I then reveal. Round two: they vote again, now allowed to talk. Somewhere in there I want them to try to design a rule that's immune to strategic voting themselves, so that they run into the wall on their own before I name the theorem. Payoffs should be something cheap and physical (candy, tokens, points toward a trivial prize) rather than money, and the payoff structure should make the incentive to misrepresent real for at least some students.

  Please give me: the exact ballot setup and preference profiles I need to hand out (with specific numbers so the Condorcet loser actually wins round one), the rules for each round and the timeline, the debrief that maps what happened onto the theorem's conditions — strategy-proofness, non-dictatorship, at least three alternatives, and the onto/resurteness condition, which I admit I always fumble when explaining — and an honest note on what the activity can't show (e.g. the class can't test all preference profiles, so "our rule survived" proves nothing). Also tell me what will predictably go wrong the first time I run it — my group loves to coordinate perfectly, which I suspect will short-circuit the point of round two, and I want to know how to handle that.

  Think it through step by step before writing the plan out, and keep the debrief concrete: which specific moment in the game maps to which clause of the theorem. Don't give away the impossibility result at the start — they shoud discover that manipulating is possible, then discover that no fix is coming.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 18 undergraduate students, PPE elective, no prior formal social choice theory.
      *   **Goal:** Make them *feel* the Gibbard-Satterthwaite (G-S) Theorem. Not just "manipulation exists," but "any decent rule is manipulable."
      *   **Constraints:** 75 minutes, 18 students, physical payoffs (candy/tokens), specific structure (Round 1: Sincere/Flawed, Round 2: Strategic/Talk, Design Phase: Try to fix it).
      *   **Key Requirements:** Exact preference profiles (Condorcet loser wins R1), timeline, debrief mapping game moments to theorem conditions (strategy-proofness, non-dictatorship, $\ge 3$ alternatives, onto), honest limitations, and troubleshooting (especially regarding perfect coordination).
      *   **Pedagogical Approach:** Discovery-based. Don't reveal the theorem upfront. Let them hit the wall.

  2.  **Deconstruct the Gibbard-Satterthwaite Theorem:**
      *   *Conditions:*
          1.  At least 3 alternatives.
          2.  Finite number of voters.
          3.  Voters have strict ordinal preferences.
          4.  The rule is *onto* (surjective): Every alternative can win under some profile.
          5.  The rule is *non-dictatorial*: No single voter dictates the outcome.
      *   *Conclusion:* The rule is *manipulable* (not strategy-proof). There exists a profile where a voter benefits by lying.
      *   *Classroom Challenge:* I can't test *all* profiles. I need to create a specific scenario where manipulation is obvious, then try to fix the rule, only to find the fix breaks another condition (usually Onto or Non-dictatorship) or just moves the manipulation elsewhere.

  3.  **Designing the Game Mechanics:**
      *   *Alternatives:* Need 3 distinct options. Let's use "End of Class Treats": Chocolate (C), Gummy Bears (G), Licorice (L). Licorice is polarizing (good for Condorcet loser scenarios).
      *   *Voters:* 18 students.
      *   *Payoffs:* Actual candy corresponding to the winner. This makes preferences real.
      *   *Round 1 (The Trap):* Use Plurality. It's intuitive but notoriously manipulable and prone to Condorcet losers winning due to vote splitting.
      *   *Round 2 (The Reaction):* Allow discussion/strategic voting. They will likely coordinate to beat the "bad" outcome.
      *   *Round 3 (The Design):* Groups try to write a rule that prevents the Round 1/2 issues.
      *   *The Reveal:* Show why their rules fail G-S conditions.

  4.  **Developing the Preference Profile (The Math):**
      *   I need a profile where Plurality elects the Condorcet Loser.
      *   Let Options be A, B, C.
      *   Let C be the Condorcet Loser (loses pairwise to A and B).
      *   Let C win Plurality.
      *   *Setup:*
          *   Group 1 (6 students): A > B > C
          *   Group 2 (6 students): B > A > C
          *   Group 3 (6 students): C > A > B
      *   *Plurality Count:* A=6, B=6, C=6. Tie. Bad. I need C to win.
      *   *Adjustment:*
          *   Group 1 (7 students): A > B > C
          *   Group 2 (6 students): B > A > C
          *   Group 3 (5 students): C > A > B
      *   *Plurality:* A=7, B=6, C=5. A wins. Not what I want. I want the "worst" option to win to trigger dissatisfaction.
      *   *Let's try Vote Splitting:*
          *   Option C is polarizing but has a dedicated base. A and B split the majority.
          *   Group 1 (8 students): A > B > C
          *   Group 2 (7 students): B > A > C
          *   Group 3 (3 students): C > A > B
          *   Plurality: A=8, B=7, C=3. A wins.
      *   *Wait, I need C to win Plurality.*
          *   Group 1 (6 students): A > C > B
          *   Group 2 (6 students): B > C > A
          *   Group 3 (6 students): C > A > B
          *   Plurality: A=6, B=6, C=6. Tie.
      *   *Let's make it asymmetric to ensure a winner.*
          *   Total 18 students.
          *   Type 1 (7 students): A > B > C
          *   Type 2 (6 students): B > A > C
          *   Type 3 (5 students): C > A > B
          *   Plurality: A=7. A wins.
      *   *Okay, let's make C the Plurality Winner but Condorcet Loser.*
          *   This requires A and B to split heavily, while C has a solid plurality base.
          *   Type 1 (5 students): A > B > C
          *   Type 2 (5 students): B > A > C
          *   Type 3 (8 students): C > A > B
          *   Plurality: C=8 (Winner).
          *   Pairwise C vs A: A is preferred by 5+5=10. C by 8. A beats C.
          *   Pairwise C vs B: B is preferred by 5+5=10. C by 8. B beats C.
          *   So C is Condorcet Loser but Plurality Winner. Perfect.
      *   *Wait, check Type 3 preferences:* If Type 3 is C > A > B, and Type 1 is A > B > C.
      *   If C wins, Type 1 and 2 are unhappy. Type 3 is happy.
      *   *Incentive to Lie:* In Round 1, they vote sincerely. C wins. Type 1 and 2 hate it.
      *   In Round 2, Type 1 and 2 realize if they coordinate on A or B, they beat C.
      *   *Refinement for Manipulation:* To show G-S, I need an individual incentive to lie, not just coalition. But with 18 students, individual impact is low. I need to emphasize that *if* they were pivotal, they would lie. Or, I can use a smaller committee within the class? No, 18 is the class.
      *   *Solution:* I will assign specific "Voter IDs" and tell them that in the event of a tie, specific IDs break ties, or simply acknowledge that while one vote rarely changes things, the *principle* is what matters. Better yet: I will divide the class into 3 groups of 6, and each group casts *one* collective vote based on their internal majority? No, that complicates it.
      *   *Best approach for G-S intuition:* Acknowledge the "pivotal voter" assumption. "Imagine your vote matters."
      *   *Actually, let's adjust the profile so manipulation is clearer.*
      *   Let's use the classic 3-voter example but scaled up? No, 18 students need to participate.
      *   *Revised Plan:* 18 students. 3 Options.
      *   Profile:
          *   6 students: A > B > C
          *   6 students: B > C > A
          *   6 students: C > A > B
          *   (This is the Condorcet Cycle profile).
          *   Plurality: Tie (6-6-6).
          *   Tie-breaker: Instructor picks C (The "Status Quo" or arbitrary).
          *   Now everyone has incentive to change.
      *   *Wait, the prompt asks for Condorcet Loser wins Round 1.*
      *   Okay, stick to the previous profile:
          *   5 students: A > B > C
          *   5 students: B > A > C
          *   8 students: C > A > B
          *   Plurality: C wins (8 votes).
          *   Pairwise: A beats C (10-8). B beats C (10-8). C is Condorcet Loser.
          *   The 10 students who prefer A or B over C are unhappy.
          *   *Strategic Incentive:* If the 5 'A' voters vote 'B', B gets 10, C gets 8. B wins. They prefer B over C. So they have an incentive to lie (vote B instead of A).
      *   *This works.*

  5.  **Addressing the "Perfect Coordination" Risk:**
      *   If they talk in Round 2, the 10 students (A and B supporters) will just agree to vote B. B wins.
      *   *The Trap:* They will think "Problem Solved! We just need to talk."
      *   *The Counter:* In Round 3 (Design), ask them to make a rule where talking doesn't matter / truth-telling is dominant.
      *   *The Wall:* They will propose rules (e.g., "Runoff", "Borda"). I need to be ready to show how *those* are manipulable too.
      *   *Specific Handling:* If they coordinate perfectly in Round 2, celebrate it, then point out: "This required communication and trust. What if you can't talk? What if you don't know others' preferences? The rule itself should incentivize truth without coordination."

  6.  **Drafting the Timeline (75 mins):**
      *   0-5: Intro & Setup (No theory yet).
      *   5-15: Round 1 (Sincere Vote). Reveal Outcome (C wins). Distribute "payoffs" (Candy). The 10 students get nothing/less desirable candy.
      *   15-25: Round 2 (Strategic Vote). Allow talk. Reveal Outcome (Likely A or B).
      *   25-45: Round 3 (Rule Design). Groups of 3-4. Task: Design a rule where Round 1 outcome doesn't happen *and* people don't need to strategize.
      *   45-60: Testing the Rules. Instructor acts as "Adversary" finding flaws in their rules (manipulation or dictatorship).
      *   60-75: Debrief & Theorem Reveal. Map their experience to G-S conditions.

  7.  **Mapping to G-S Conditions (The Debrief):**
      *   *3+ Alternatives:* We had A, B, C.
      *   *Non-Dictatorship:* No single student dictated.
      *   *Onto (Surjectivity):* Could A win? Yes. Could B win? Yes. Could C win? Yes. (Crucial point: If they propose a rule "A always wins", it's strategy-proof but not Onto/Dictatorial).
      *   *Strategy-Proofness:* They found they had to lie in Round 1 to get a better result.
      *   *The "Wall":* When they try to fix it, they either make it Dictatorial (Teacher picks) or not Onto (Remove an option).

  8.  **Refining the Payoffs:**
      *   Need physical differentiation.
      *   Option A: Chocolate Square (High Value).
      *   Option B: Gummy Bear Bag (Medium Value).
      *   Option C: Licorice Twist (Low Value/Polarizing).
      *   *Crucial:* Ensure the preference profile matches the candy values for the specific groups.
      *   Group 1 (5 students): Prefer Choc > Gummy > Licorice.
      *   Group 2 (5 students): Prefer Gummy > Choc > Licorice.
      *   Group 3 (8 students): Prefer Licorice > Choc > Gummy. (Wait, if Licorice is "bad", why do they prefer it? Maybe they love licorice. I need the *majority* to dislike Licorice for it to be a Condorcet Loser).
      *   *Correction:* For C to be Condorcet Loser, Majority must prefer A over C AND B over C.
      *   So Group 3 (8 students) must prefer C over A and B? No, if 8 prefer C over A, C beats A pairwise.
      *   *Math Check:*
          *   Total 18. Majority is 10.
          *   To make C Condorcet Loser: 10 must prefer A>C, 10 must prefer B>C.
          *   To make C Plurality Winner: C must have most 1st place votes.
          *   Profile:
              *   5 students: A > B > C
              *   5 students: B > A > C
              *   8 students: C > A > B (Wait, here 10 prefer A>C (5+5). 10 prefer B>C (5+5). So C loses pairwise to both. C is Condorcet Loser.)
              *   Plurality: C=8, A=5, B=5. C Wins.
              *   *Payoff alignment:*
                  *   Group 1 & 2 (10 students): C is their *least* favorite. (Licorice).
                  *   Group 3 (8 students): C is their *most* favorite. (Licorice lovers).
              *   *Incentive:* Group 1 & 2 get "trash" candy in Round 1. They are motivated to change.

  9.  **Troubleshooting "Perfect Coordination":**
      *   If they coordinate in Round 2, the 5 'A' voters switch to 'B'. B gets 10. C gets 8. B wins.
      *   *Instructor Move:* "Great, you solved it by communicating. But G-S assumes a 'black box' rule where you submit ballots secretly. Can you design a box where you don't *need* to talk?"
      *   *Another Risk:* They propose "Runoff Election".
      *   *Counter:* Runoff is manipulable (compromising). I need to be ready to explain that briefly or steer them away.
      *   *Better Counter:* Focus on the *Onto* condition. If they say "Let's just remove Licorice," I say "That violates Onto. The rule must allow any option to win if people truly want it." If they say "Teacher decides," I say "That's a Dictator."

  10. **Writing the Plan:**
      *   Tone: Engaging, authoritative but facilitative.
      *   Structure: Materials, Setup, Round 1, Round 2, Round 3, Debrief.
      *   Specifics: Exact numbers, script snippets.
      *   Limitations: Be honest about the "finite class" vs "all possible profiles" issue.

  11. **Review against Constraints:**
      *   18 students? Yes (5+5+8).
      *   75 mins? Yes (Timeline looks tight but doable).
      *   No prior exposure? Yes (Keep jargon for the end).
      *   Physical payoffs? Yes (Candy).
      *   G-S conditions covered? Yes.
      *   Troubleshooting included? Yes.

  12. **Final Polish:**
      *   Make sure the "Onto" explanation is clear. It's the hardest part. I'll use the "Menu" analogy.
      *   Ensure the "Dictator" definition is clear (single voter determines outcome regardless of others).
      *   Check the math one last time.
          *   Profile: 5 (A>B>C), 5 (B>A>C), 8 (C>A>B).
          *   Plurality: C=8, A=5, B=5. C wins.
          *   Pairwise A vs C: A (5+5=10) > C (8). A wins.
          *   Pairwise B vs C: B (5+5=10) > C (8). B wins.
          *   C is Condorcet Loser.
          *   Strategic Vote: If 5 (A>B>C) vote B. New Count: A=0, B=10, C=8. B wins.
          *   Do they prefer B over C? Yes (A>B>C). So manipulation is beneficial.
      *   Looks solid.

  13. **Self-Correction on "Onto":**
      *   Students often confuse Onto with "Fair". I need to define it as "Every option has a chance."
      *   In the design phase, if they suggest "Ban Licorice", that violates Onto.
      *   If they suggest "Random Dictator", that satisfies Onto and Non-Dictatorial (ex-ante) but is manipulable? Actually Random Dictator is strategy-proof. Wait.
      *   *G-S Caveat:* G-S applies to *deterministic* rules. If they propose a lottery, G-S doesn't apply. I need to specify the rule must be *deterministic*. I will add "The outcome must be definite, no coin flips."

  14. **Final check on "Predictably Go Wrong":**
      *   Scenario: They coordinate too well.
      *   Fix: Acknowledge it, then pivot to "Secret Ballot" constraint for Round 3.
      *   Scenario: They propose Borda Count.
      *   Fix: I need a quick example of Borda manipulation ready. (A>B>C, B>C>A, C>A>B... standard truncation or order reversal). I'll include a "Cheat Sheet" for the instructor to counter common proposals.

  15. **Formatting:** Use bolding for key instructions, clear sections. Keep the debrief script tight.

  (End of thought process. Proceeding to generate response.)
answer: |-
  Here is a complete lesson plan designed to make the Gibbard–Satterthwaite (G-S) theorem visceral. It moves from experience to frustration to formalization.

  ### **Lesson Overview**
  *   **Topic:** The Impossibility of Strategy-Proof Voting (Gibbard–Satterthwaite Theorem).
  *   **Time:** 75 Minutes.
  *   **Students:** 18 (Divided into 3 fixed groups for the session).
  *   **Materials:**
      *   3 types of candy (distinct values): e.g., Chocolate Squares (A), Gummy Bags (B), Licorice Twists (C).
      *   18 Ballot slips.
      *   Whiteboard/Projector.
      *   Printed Preference Cards (see below).

  ---

  ### **1. The Setup (0:00 – 0:05)**
  **Do not mention social choice theory yet.** Tell them this is a resource allocation game.

  *   **The Options:** Write **A (Chocolate)**, **B (Gummies)**, **C (Licorice)** on the board.
  *   **The Payoff:** The winning option is distributed to the class immediately after the final round.
  *   **The Groups:** Hand out **Preference Cards** face down. There are three types. Tell them: *"Look at your card. This is your true ranking of the candy. Do not show it to anyone yet."*

  **The Preference Profile (The Math):**
  You need 18 cards total.
  *   **Group 1 (5 Students):** Card Type X: **A > B > C**
  *   **Group 2 (5 Students):** Card Type Y: **B > A > C**
  *   **Group 3 (8 Students):** Card Type Z: **C > A > B**

  *Instructor Note:* This profile ensures **C** is the **Condorcet Loser** (loses pairwise to A and B) but wins **Plurality** (8 first-place votes vs 5 and 5). The majority (10 students) gets their least favorite candy in Round 1.

  ---

  ### **2. Round 1: Sincere Voting & The "Bad" Outcome (0:05 – 0:15)**
  *   **Rule:** Plurality Vote. "Mark your #1 choice. Most votes wins. Ties broken by Instructor."
  *   **Constraint:** "Vote sincerely. Vote for your actual favorite."
  *   **Action:** Collect ballots. Count publicly on the board.
      *   A: 5
      *   B: 5
      *   **C: 8 (WINNER)**
  *   **The Reveal:** Announce C is the winner. Distribute Licorice (C) to everyone.
  *   **The Reaction:** Watch the room. 10 students (Groups 1 & 2) just received their *last* choice. 8 students (Group 3) are happy.
  *   **The Question:** Ask Groups 1 & 2: *"Are you happy with this outcome?"* (They will say no). Ask: *"Did the voting rule reflect the will of the majority?"* (They will say no, because 10 people prefer A or B over C).

  ---

  ### **3. Round 2: Strategic Voting & Coordination (0:15 – 0:25)**
  *   **Rule:** Plurality Vote again.
  *   **New Constraint:** "You may talk to each other for 3 minutes before voting. You may vote strategically. Your goal is to get the best candy for *yourself*."
  *   **Action:** Let them talk.
      *   *Predictable Outcome:* Groups 1 & 2 (10 students total) will realize they are the majority. They will coordinate to vote for **B** (or A).
      *   *New Count:* A: 0, **B: 10**, C: 8. **B Wins.**
  *   **Distribution:** Take back the Licorice. Give everyone Gummies (B).
  *   **The Debrief of Round 2:**
      *   Ask Group 1 (who truly prefer A): *"Who here voted for B even though you prefer A?"* (Hands go up).
      *   **Point 1:** "To get a better result, you had to **lie** on your ballot. The rule incentivized dishonesty."
      *   Ask Group 3 (Licorice lovers): *"Did you lose out because you were honest?"* (Yes).
      *   **Point 2:** "Sincerity was punished."

  ---

  ### **4. Round 3: The Design Challenge (0:25 – 0:45)**
  *   **Task:** Divide students into 6 groups of 3 (mix the preference types if possible).
  *   **Mission:** "Design a Voting Rule (a mechanism) that avoids the problems we just saw. Specifically:"
      1.  **No Lying:** It should be in everyone's best interest to vote sincerely (Strategy-Proof).
      2.  **No Dictator:** One person cannot just decide the winner.
      3.  **All Options Possible:** Any candy (A, B, or C) must be able to win if the class wants it enough (Onto).
      4.  **Deterministic:** No coin flips or lotteries.
  *   **Instructor Role:** Circulate. When a group proposes a rule, play the "Adversary."
      *   *If they say "Runoff Election":* Ask, "What if I vote for my second choice in round 1 to knock out my rival? Isn't that lying?"
      *   *If they say "Ban Licorice":* Remind them of Condition 3 (All options must be possible).
      *   *If they say "Teacher Decides":* Remind them of Condition 2 (No Dictator).
      *   *If they say "Borda Count":* (Keep this in your back pocket: Borda is manipulable via "burial" strategies).

  *   **The Wall:** They will struggle. They will realize that preventing lying usually requires giving one person total power or removing options.

  ---

  ### **5. The Reveal & Debrief (0:45 – 1:15)**
  Bring the class back together. Write **Gibbard–Satterthwaite Theorem** on the board.

  **The Mapping (Concrete Connection):**
  Go through the conditions of the theorem and map them to specific moments in the game.

  | Theorem Condition | Game Moment | Why it matters |
  | :--- | :--- | :--- |
  | **$\ge 3$ Alternatives** | We had Chocolate, Gummies, Licorice. | With only 2 options, Majority Rule is strategy-proof. The complexity starts at 3. |
  | **Non-Dictatorship** | Round 3 Design Rule #2. | If one student dictated, no one else would need to lie. But that's not democracy. |
  | **Onto (Surjectivity)** | Round 3 Design Rule #3. | "Could Licorice ever win?" If your rule makes it *impossible* for Licorice to win, you've restricted the menu. G-S assumes every option is on the table. |
  | **Strategy-Proofness** | Round 2 Behavior. | Group 1 voted B instead of A. They manipulated. G-S says you *cannot* eliminate this incentive without breaking another condition. |

  **Explaining "Onto" (The Tricky Part):**
  *   *Script:* "Imagine a restaurant menu. 'Onto' means every item on the menu is actually cookable. If you design a voting rule where 'Licorice' can never win, no matter how many people vote for it, you have effectively taken Licorice off the menu. You satisfied strategy-proofness by limiting freedom. G-S says if you keep the full menu, someone can game the system."

  **The Impossibility Conclusion:**
  "Round 2 showed us manipulation is *possible*. Round 3 showed us fixing it is *impossible* without becoming a dictatorship or removing choices. That is the theorem. There is no perfect voting rule."

  **Honest Limitations (Crucial for Intellectual Honesty):**
  1.  **Finite Profiles:** "Today we tested *one* preference profile (the 5-5-8 split). The theorem proves manipulation exists for *some* profile in *any* rule. We didn't test all profiles, but you felt the incentive in this one."
  2.  **Pivotal Voter:** "In a class of 18, one vote rarely changes the outcome. The theorem assumes you might be the 'pivotal' voter. In national elections, the chance is tiny, but the *incentive structure* remains the same."
  3.  **Cardinal vs. Ordinal:** "We used rankings (A>B>C). If we could assign scores (Approval Voting), some impossibility results soften, but new problems arise."

  ---

  ### **Troubleshooting: What Will Go Wrong**

  **1. "They Coordinate Perfectly in Round 2"**
  *   **Risk:** They solve the problem too easily, thinking "Communication fixes everything."
  *   **Fix:** In the debrief, emphasize: *"You fixed it by forming a coalition. But G-S applies to secret ballots where you don't know others' preferences. If you can't talk, would you have risked voting A and letting C win? The rule must work even in the dark."*

  **2. "They Propose a Lottery (Random Dictator)"**
  *   **Risk:** A student suggests "Pick one voter at random, let them decide."
  *   **Fix:** This is actually a valid loophole (Gibbard-Satterthwaite applies to *deterministic* rules). Acknowledge their brilliance! *"You found the escape hatch. Randomization avoids G-S. But is it acceptable for a class treat? Do we want governance by lottery?"* This leads to a great discussion on why we prefer deterministic rules despite the flaw.

  **3. "They Don't Feel the Incentive to Lie"**
  *   **Risk:** Group 1 students think, "My vote didn't matter, so I didn't really lie."
  *   **Fix:** Use the "Veil of Ignorance" argument. *"Imagine you didn't know you were in Group 1 until after you voted. Would you have voted sincerely? No, because you'd fear being in the minority. The incentive exists ex-ante."*

  **4. "Confusion on Onto"**
  *   **Risk:** They think Onto means "Everyone gets something."
  *   **Fix:** Use the "Menu" analogy repeatedly. "Onto = Every menu item is orderable."

  ---

  ### **Instructor Cheat Sheet: Countering Proposed Rules**
  During Round 3, students will propose standard systems. Here is how to gently show they fail G-S conditions:

  *   **"Two-Round Runoff":**
      *   *Flaw:* Manipulable. (Example: A>B>C voters might vote for C in round 1 to eliminate B, if they fear B will beat A in round 2).
  *   **"Borda Count" (Points for ranking):**
      *   *Flaw:* Manipulable via "burying." (A>B>C voters rank C last even if they prefer C>B, to hurt B's score).
  *   **"Approval Voting" (Vote for all you like):**
      *   *Flaw:* Not strictly ordinal (violates the setup), but also manipulable (Where do I draw the approval line? Strategic thresholding).
  *   **"Remove the Worst Option":**
      *   *Flaw:* Violates **Onto**. You decided Licorice can't win before voting started.
  *   **"The Teacher Decides Based on Discussion":**
      *   *Flaw:* Violates **Non-Dictatorship** (The teacher is the dictator).

  ### **Final Note to Instructor**
  The goal isn't for them to prove the theorem mathematically. The goal is for them to feel the **frustration** of Round 3. When they realize every rule they write has a loophole, *then* you tell them: "Mathematicians proved in 1973 that this frustration is inevitable." That is when the theorem sticks.
