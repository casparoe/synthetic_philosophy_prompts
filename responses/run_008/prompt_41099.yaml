  ### The Three Verdicts

  1.  **The Unsparing Cheater:** **Standing Intact.**
      Unlike the husband in Case 1, who "shrugged off" his conduct as "complicated" (claiming a special exemption), this man affirms the norm he enforces. By calling himself exactly what he calls others, he acknowledges the rule's authority over himself, even while violating it. He does not undermine the norm's validity.

  2.  **The Expense Padder:** **No Standing.**
      She normalizes her theft ("everybody does it"), which is functionally identical to Case 1's "shrugging off." She claims a contextual exemption for herself while enforcing the rule against her friend. Furthermore, expense fraud and shoplifting are sufficiently the same fault (theft/dishonesty) to trigger the hypocrisy constraint.

  3.  **The Old College Friend:** **No Standing.**
      This mirrors Case 5 (The Distant Acquaintance). Marital fidelity is a private, relational duty owed to the spouse, not the public. An old friend "no longer in contact" is a stranger to the marriage. By intervening "to her face, at a dinner party," he commits a jurisdictional intrusion. He lacks the relational stake required to enforce private vows.

  ***

  ### The Reconstructed Principle: The Non-Undermining Rule

  Your friend is not running a rule about moral purity, nor strictly about hypocrisy. She is running **The Non-Undermining Principle**:

  > **A blamer has standing if and only if their conduct and position affirm, rather than negate, the authority of the norm they are invoking.**

  Standing is lost in two specific ways, corresponding to the two types of "undermining" found in your record:

  1.  **Hypocritical Exemption (The Normative Contradiction):** You lose standing if you enforce a norm against others while implicitly or explicitly claiming that the norm does not bind you.
      *   *Case 1 (Cheating Husband):* **No Standing.** By calling his infidelity "complicated," he claims an exemption. He asserts the rule binds his friend but not him.
      *   *Case 2 (Repentant Embezzler):* **Standing Intact.** Repentance is an affirmation of the norm. By apologizing and repaying, she admits the rule bound her then and binds her now. Her past violation does not negate the norm's authority; her repentance reinforces it.
      *   *New Case 1 (Unsparing Cheater):* **Standing Intact.** He admits the rule binds him ("calls himself exactly what he would call anyone else"). He violates the rule, but he does not deny its authority.
      *   *Case 4 (Gossip):* **Standing Intact.** Gossiping does not claim an exemption from the rules of plagiarism. The norms are distinct.
      *   *Case 3 (Inherited Wealth):* **Standing Intact.** Benefiting from a past wrong is not claiming an exemption from the current norm. She did not commit the labor abuse; she inherited the capital. She can consistently condemn exploitation while holding wealth derived from it.

  2.  **Jurisdictional Intrusion (The Relational Contradiction):** You lose standing if you enforce a *private* duty to which you are not a party.
      *   *Case 5 (Distant Acquaintance):* **No Standing.** Gratitude is a duty owed *to the mother*. A distant acquaintance is not the creditor. He is enforcing a private contract he is not party to.
      *   *Case 7 (Taxi Queue):* **Standing Intact.** Queue-jumping violates a *public* cooperative norm. Everyone is a stakeholder. A stranger has jurisdiction.
      *   *New Case 3 (Old College Friend):* **No Standing.** Fidelity is a duty owed *to the husband*. An estranged friend is not the husband, nor a current stakeholder. He is intruding on a private dyad.

  *Note on Case 6 (Cold Dinner):* This confirms that standing is distinct from proportionality. He had the *authority* to object (jurisdiction), even if the *degree* of his fury was defective.

  ***

  ### Why This Principle Beats The Rivals

  There are two obvious rival principles your friend might be using. Both fail to account for the full dataset.

  **Rival 1: The Clean Hands Rule**
  *   *Theory:* You cannot blame for a fault you currently possess.
  *   *Where it breaks:* It cannot explain **Case 2**. The embezzler has "dirty hands" (past embezzlement), yet has standing. The Clean Hands Rule would predict "No Standing." It also fails **New Case 1**: under Clean Hands, the current cheater must have No Standing. My principle predicts Standing because he affirms the norm. This is the critical divergence. If your friend grants the Unsparing Cheater standing, Clean Hands is falsified.

  **Rival 2: The Same Fault Rule**
  *   *Theory:* You cannot blame someone for doing what you do.
  *   *Where it breaks:* It cannot explain **Case 5**. The distant acquaintance is not necessarily ungrateful himself. His lack of standing comes from his *relationship* to the blamee, not his moral record. It also struggles with **Case 3**. Is benefiting from exploitation the "same fault" as buying from exploitative brands? If it were, she would have No Standing. The Non-Undermining Principle clarifies that structural benefit is not an *exemption claim*, whereas "everybody does it" (New Case 2) is.

  **Why The Non-Undermining Principle is the Best Fit:**
  It is the only rule that accommodates the specific linguistic cues in your file. The difference between Case 1 ("shrugging off... complicated") and New Case 1 ("unsparing... calls himself exactly what he would call anyone else") is not about the *act* (both are cheating), but about the *attitude toward the norm*. Your friend's stability suggests she tracks this attitude. She forgives the sinner who affirms the law (Case 2, New Case 1) but rejects the sinner who claims the law doesn't apply to him (Case 1, New Case 2). Simultaneously, she tracks the *source* of the blame, rejecting outsiders in private matters (Case 5, New Case 3) while accepting them in public ones (Case 7).

  ***

  ### The Decisive Test Case

  To confirm this reading in one stroke, you need to isolate **Current Violation** from **Normative Exemption**. The Clean Hands Rule says current violation kills standing. The Non-Undermining Principle says only exemption kills standing.

  **The Case:**
  > A man is a habitual speeder. He is pulled over alongside a friend who is also speeding.
  >
  > **Scenario A:** The man tells the friend, "Speed limits are for people who can't handle cars; I need to go fast, but you shouldn't."
  > **Scenario B:** The man tells the friend, "Speeding is dangerous and wrong. I do it because I'm reckless and I hate myself for it, but you shouldn't do it either."

  **The Prediction:**
  *   **If she says Scenario B has Standing:** She is obeying the **Non-Undermining Principle**. The blamer affirms the norm's authority despite his failure to follow it.
  *   **If she says Scenario B has No Standing:** She is obeying the **Clean Hands Rule**. The mere fact of current violation disqualifies him, regardless of his attitude.

  Given her distinction between the "shrugging" cheater (No Standing) and the "repentant" embezzler (Standing), I am confident she will grant **Standing in Scenario B**. The sin is not the violation; the sin is the claim that the rule does not bind.
