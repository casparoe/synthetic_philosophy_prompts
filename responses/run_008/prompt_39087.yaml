answer: |-
  First off: **this is not a daft question at all.** In fact, it is arguably *the* most important conceptual hurdle in game theory. Almost everyone who studies this hits exactly the same wall you're hitting right now. If you were just accepting the textbook answer without feeling this tension, I'd be worried you weren't thinking critically enough.

  Your tutor gave you the technically correct answer ("doing well $\neq$ rational"), but I can see why that feels unsatisfying. It sounds like semantic gymnastics.

  Let's break this down into three parts: why the games are different, what "rationality" actually means in this context, and why Axelrod's results don't break the one-shot logic.

  ### 1. You are playing two different games
  Your intuition says: *"The one-shot game is just the iterated game with $N=1$. So the logic should be the same."*

  Mathematically, this is false. They are structurally different games because the **payoff function** is different.

  *   **In the One-Shot PD:** Your payoff depends *only* on the move you make right now.
  *   **In the Iterated PD:** Your payoff is the sum of this round *plus* all future rounds.

  This means your current move in the Iterated game has a "price tag" attached to it. If I defect now, I gain 5 points today, but I might lose 10 points tomorrow because you punish me. In the One-Shot game, there is no "tomorrow." The cost of defection is zero.

  Think of it like this:
  *   **One-Shot:** I offer you \$100 to punch a stranger. You take it. There are no consequences.
  *   **Iterated:** I offer you \$100 to punch a stranger, but the stranger's brother is watching and will punch you tomorrow if you do it. You don't take it.

  In both cases, you want money. But the *constraints* changed. Defecting is rational in the one-shot because there is no mechanism to punish it. Cooperation is rational in the iterated version (under certain conditions) because the "shadow of the future" acts as an enforcement mechanism.

  ### 2. Winning vs. Rationality (Your Tutor's Point)
  Your tutor said: *"Doing well in a tournament is not the same as being rational."*

  Here is the distinction:
  *   **Rationality (in Game Theory):** Did you choose the **Best Response** to what you believe your opponent will do? Did you maximize your expected utility given the information available?
  *   **Success:** Did you get a high score?

  You can be rational and lose. You can be irrational and win.

  **Example:**
  Imagine I hold a gun to your head and say, "Play Rock, Paper, Scissors. If you play Rock, I shoot you."
  *   **Rational move:** Play Paper or Scissors.
  *   **Irrational move:** Play Rock.

  If you play Rock, and I *accidentally* drop the gun and you win the game, you were still **irrational**. You took a dominated strategy. You got lucky.

  **Applying this to Axelrod:**
  Tit-for-Tat (TFT) won the tournament, but **TFT is not a dominant strategy.**
  *   If you play TFT against "Always Defect," you lose.
  *   If you play "Always Defect" against TFT, you win (in that specific match).

  TFT won the *tournament* because the **mix of opponents** entered into the competition was nice. There were enough cooperators in the pool that being nice paid off. If Axelrod had run the tournament with a population of 90% "Always Defect" strategies, TFT would have been wiped out, and "Always Defect" would have won the tournament.

  So, "Always Defect" is rational in the one-shot because it is a **Dominant Strategy**. No matter what the other person does, you are strictly better off defecting.
  TFT is **not** a dominant strategy in the iterated game. It is only a *Best Response* if the other player is also playing a conditional strategy (like TFT) and values the future enough.

  ### 3. Why doesn't the One-Shot solution "fall out" of the Iterated one?
  You asked: *"Surely the one-shot answer should fall out of the iterated one somewhere."*

  This is a brilliant insight, and actually, **it does**, but only under specific conditions. This is where the **Folk Theorem** (which you're covering next week) comes in.

  In an **infinitely** repeated game, cooperation is *possible*, but it is not *guaranteed*.
  *   If the "shadow of the future" is long enough (I care a lot about tomorrow), cooperation is a Nash Equilibrium.
  *   If the "shadow of the future" is short (I don't care about tomorrow), defection is the Nash Equilibrium.

  The One-Shot game is effectively a game where the "shadow of the future" is **zero**.
  If you take the math for the Iterated PD and set the discount factor ($\delta$) to 0 (meaning future rounds are worth nothing), the math collapses exactly into the One-Shot solution: **Defect.**

  So the logic *is* consistent. The One-Shot game is just the Iterated game where the value of future interaction is zero. Since the value is zero, the threat of punishment is empty. If you can't punish me tomorrow, I should defect today.

  ### 4. The "Common Knowledge of Rationality" Trap
  This is the part that usually hurts philosophers' brains the most.

  You argued: *"Since tit-for-tat can't be exploited... doesn't that make it irrational for the other player to try anything except cooperating with me from round one?"*

  This assumes that I know you are playing Tit-for-Tat.
  But in the standard Game Theory model, we assume **Common Knowledge of Rationality (CKR)**.
  1.  I know you are rational.
  2.  You know I am rational.
  3.  I know that you know that I am rational...

  In a **One-Shot** game:
  *   I know you are rational.
  *   Therefore, I know you will calculate that Defect is dominant.
  *   Therefore, I know you will Defect.
  *   Therefore, my Best Response to your Defect is to Defect.

  Even if we both *want* to cooperate, if we both know we are rational maximizers in a one-shot setting, we are forced into defection. It's a tragedy.

  In the **Iterated** game:
  *   I know you are rational.
  *   But I also know you care about Round 2.
  *   So I know you might cooperate in Round 1 to signal that you want to cooperate in Round 2.
  *   Now, Cooperate becomes a Best Response.

  ### Summary for your Problem Set
  When you answer the problem set, keep these distinctions clear:

  1.  **Definition of Rationality:** In the one-shot PD, rationality is defined as playing a **Dominant Strategy**. Defection strictly yields a higher payoff regardless of the opponent's move.
  2.  **Axelrod's Context:** Axelrod's tournaments were **ecological**. TFT won because of the *environment* (the other strategies entered), not because it is universally dominant. Against a pure defector in a one-shot, TFT loses.
  3.  **Structural Difference:** The One-Shot game lacks the mechanism (future punishment/reward) that makes cooperation rational in the Iterated game. You cannot derive the Iterated solution from the One-Shot solution because the Iterated solution relies on variables (future rounds) that do not exist in the One-Shot game.

  ### A Note on the Trench Warfare & Folk Theorem
  Since you mentioned next week's topics:
  *   **Trench Warfare:** This is the real-world proof of the Iterated PD. Soldiers didn't defect (shoot to kill) every time because they knew they would face the *same* enemy unit tomorrow. The "shadow of the future" was very long.
  *   **Folk Theorem:** This will show you that in the iterated game, *almost anything* can be rational (cooperation, defection, alternating) depending on how patient the players are. This reinforces that cooperation isn't "magic"; it's just one of many equilibria that becomes possible when the future matters.

  You are asking exactly the right questions. Don't let the math scare you; the intuition you're struggling with is the same intuition that keeps political scientists and economists up at night. You're doing fine.
