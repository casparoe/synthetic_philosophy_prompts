answer: |-
  Based on the track record of your supervisor's verdicts, we can discern two competing principles that organise her responses to evolutionary debunking arguments (EDAs). Both fit the existing data points, but they yield opposite predictions for the case of parental partiality.

  ### Rule 1: The Impartiality Principle
  This rule holds that EDAs undermine moral judgments that are inherently **partial** or **agent-relative**, particularly those favouring kin or in-groups, because these track evolutionary fitness rather than moral truth. Conversely, judgments that are **impartial** or **universalisable** are safe, as they align with rational cooperation rather than narrow biological imperatives.

  *   **Fit with past cases:**
      *   *Undermined:* Incest aversion (kin-based), Disgust (self-protective), Footbridge (agent-relative constraint against personal harm).
      *   *Not Undermined:* Trolley switch (impartial utility maximisation), Promise keeping (universal duty applicable to all agents).
  *   **Prediction for next week:** **Undermined.** Parental partiality is explicitly a judgment favouring one's own kin over strangers. Despite reflective defence, its content is partial, placing it in the same category as incest aversion and the footbridge intuition.

  ### Rule 2: The Reflective Endorsement Principle
  This rule holds that EDAs undermine judgments that arise from **raw intuition, emotion, or heuristic processing**. However, if a judgment survives **calm, considered reflection** and can be defended by argument independent of the instinct, it is immune to debunking. The evolutionary origin matters less than whether the judgment is rationally sustainable.

  *   **Fit with past cases:**
      *   *Undermined:* Incest aversion (often visceral), Disgust (visceral), Footbridge (often driven by emotional alarm at personal violence).
      *   *Not Undermined:* Trolley switch (cognitive calculation), Promise keeping (rational commitment to a norm).
  *   **Prediction for next week:** **Not Undermined.** The case description explicitly stipulates that this is a "calm, considered judgment" which people "defend reflectively, with arguments." On this rule, the quality of the reasoning protects it from the evolutionary explanation.

  ### Best Guess and Reasons
  My best guess is that your supervisor will rule the judgment **undermined**.

  While Rule 2 is tempting given the emphasis on "reflective defence," the precedent set by case (i) is decisive. In the incest case, the scenario was modified to remove the standard rational objections (harm, genetics) via contraception and adulthood. This effectively forced the intuition to rely on reflective defence rather than raw harm-avoidance. Nevertheless, your supervisor still ruled it **undermined**. This suggests she views the reflective arguments offered for such intuitions as post-hoc rationalisations of evolutionary instincts (a la Haidt or Greene), rather than genuine justifications.

  Furthermore, the supervisor's willingness to debunk the footbridge intuition (a deontological constraint) while sparing the promise-keeping duty suggests she distinguishes between *universal* deontological duties and *relational* or *kin-based* constraints. Parental partiality is the paradigm of a kin-based constraint. The prompt's phrasing—"just what gene-centred explanations... would predict"—is likely intended as the clincher for a debunker who prioritises the etiology of the belief over its reflective gloss.

  ### Proposed Test Case
  To distinguish these rules definitively, I propose the following case:

  **The Retributive Justice Intuition:** The judgment that a wrongdoer *deserves* punishment even if punishing them yields no deterrent effect, prevents no future crime, and rehabilitates no one.

  *   **Why it distinguishes the rules:**
      *   **Rule 1 (Impartiality)** predicts this is **not undermined**. Retributive justice applies universally to all wrongdoers regardless of relationship; it is not partial to kin or self.
      *   **Rule 2 (Reflective Endorsement)** predicts this is **undermined**. This intuition is widely regarded in metaethics as a visceral evolutionary adaptation (cheater detection/anger) that is notoriously difficult to defend reflectively without circularity (i.e., "they deserve it because it is right").
  *   **Interpretation:** If your supervisor rules this **undermined**, she follows Rule 2 (or a hybrid where evolutionary origin trumps impartiality). If she rules it **not undermined**, she is a strict adherent to Rule 1 (Impartiality), which would strengthen the case that she *should* spare parental partiality—unless she views partiality as a stricter debunking condition than evolutionary origin alone. Given the incest verdict, however, I suspect she will debunk retribution too, confirming that evolutionary etiology trumps both impartiality and reflection.

  \answer{undermined}
