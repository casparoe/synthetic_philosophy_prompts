      Daniel's "continued-contribution test" is unsound for this context. It conflates causal dependence with moral agency. By his logic, turning off a ventilator is also "doing something," since the patient dies only when the machine stops contributing. Yet ethics universally permits ventilator withdrawal. The test fails to distinguish between *injecting a poison* (creating a new cause of death) and *removing a barrier* (allowing the existing fatal pathology to proceed). The pacemaker is a barrier against arrhythmia; removing it allows the heart disease to take its course.

      Your reasoning's weakest point is claiming the pacemaker "never replaced a function." It does replace the heart's electrical signaling. If your grandfather's heart cannot generate a rhythm independently, turning off the device directly enables arrest. Your stronger argument isn't about mechanics, but about rights: a patient (or agent) has the right to refuse any medical intervention, even if its removal hastens death, provided the intent is to relieve burden, not cause death.

      What would move me to Daniel's verdict? If the pacemaker were considered biologically integrated rather than external therapy. Some argue implants become part of the body over time. If we viewed the device as a restored organ rather than a treatment, deactivation might resemble disabling a healthy heart. However, since your grandfather is "clearly dying" from other causes (unsafe swallowing, advanced dementia), the pacemaker is merely prolonging the dying process, not restoring health.

