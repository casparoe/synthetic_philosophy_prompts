      3.  *Social Equality:* Farming necessitated hierarchy, property, and patriarchy, destroying egalitarian band structures. (Verdict: Substantive, though causality is debated.)
      4.  *Existential Risk:* Crop dependency created famine risks unknown to diversified foragers, threatening species survival. (Verdict: Demonstrably false; farming prevented extinction via carrying capacity.)
      5.  *Inevitability:* Humanity acted as a single agent making a conscious choice rather than drifting into trapping conditions. (Verdict: Not a claim about agriculture, but about agency.)

