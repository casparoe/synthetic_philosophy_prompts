      *   *The "Strawman" Check:* Do people *really* think all loops are destabilizing? Hacking himself acknowledges that some interactions make kinds stable (e.g., sexual orientations that become identities). However, the *dominant* uptake in philosophy of psychiatry (e.g., debates on natural kinds) focuses on the *movement* of the target. The user's insight is that stability *via* looping is under-theorized as a mechanism of "kindhood." It's not a strawman, but it needs nuance. The gap isn't that no one noticed stability, but that no one has systematically categorized the *conditions* for stability vs. instability.
      *   *Feasibility:* 12 months for a philosophy project with archival help is tight but doable for a conceptual analysis grounded in case studies. It needs to be narrow. Three case studies is probably too many for one person in 12 months if doing deep archival work. Two contrasting cases is better.
