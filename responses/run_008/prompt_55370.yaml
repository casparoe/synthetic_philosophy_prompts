answer: |-
  First, the novelty check: Your twist is not new. This is essentially the New Institutional Economics (NIE) reading of Weber, championed by Douglass North and Avner Greif. They argue norms only matter when embedded in enforceable institutions (contract law, guild sanctions, community coercion). You are refining Weber via Institutionalism. This isn't a failure, but claiming it as a unique discovery at a conference will invite immediate correction.

  **Ranked Defeaters**

  1.  **Fatal: Behavioral Persistence Post-Collapse.** If enforcement structures dissolve (e.g., church courts abolished, community monitoring disrupted by migration) but the economic behavior (thrift, labor supply) persists for generations without replacement enforcement, your mechanism is broken. This suggests values were internalized psychologically, not priced socially. Post-Reformation England, where Puritan work ethics persisted after sectarian cohesion fractured, is a risky case for you.
  2.  **Fatal: Undetectable Sacrifice.** Evidence of economic sacrifice driven by guilt where social detection was impossible. If diaries reveal individuals foregoing leisure or profit due to religious guilt despite zero risk of sanction or reputational loss, values are acting directly. Your theory requires a spectator; private piety that alters economics kills the "enforcement engine" claim.
  3.  **Awkward: Enforcement Without Effect.** Cases where strict monitoring exists but economic behavior doesn't align. If a congregation expels idlers but members remain economically stagnant compared to unmonitored peers, enforcement isn't sufficient. This forces you to concede enforcement is necessary but not sufficient, weakening the "engine" metaphor.

  **The Unfalsifiability Trap**

  You asked straight: Is positing unobserved enforcement fatal? **Yes, if used retroactively.**

  In causal inference, a mechanism cannot be identified solely by the outcome it explains. If you argue "behavior X exists, therefore enforcement Y must have existed," you are tautological. Reputational costs are indeed invisible, but their *proxies* are not. To avoid falsifiability charges, you must identify enforcement *independently* of the economic behavior.

  **Required Evidence:** You need archival traces of the mechanism itself: expulsion logs, credit denial records, marriage veto documents, or correspondence detailing reputational sanctions. These must be dated and correlated with behavioral shifts. If you cannot produce independent evidence of the enforcement structure, your theory is a "just-so story." It is normal in history to have incomplete data, but it is not methodologically sound to infer the cause from the effect. You must predict the enforcement exists, then find it. If you allow "invisible enforcement" to explain away null findings (e.g., "they didn't save money, but surely there was subtle shame"), the theory is dead.

  **Unique Predictions**

  To distinguish your view from pure materialism:

  1.  **Divergence under Material Convergence.** Pure materialism predicts that if prices, technology, and property rights equalize between two regions, economic behavior should converge. Your view predicts divergence if enforcement institutions differ. Two regions with identical wages but different religious monitoring strictness should show different labor supply rates.
  2.  **The Shock Test.** If a state suddenly suppresses religious courts (removing enforcement) but leaves belief unchanged (via surveys/confessions), materialism predicts no change (beliefs don't matter), while classic Weberism predicts no change (beliefs persist). Your view predicts an immediate behavioral shift toward the material equilibrium, despite constant stated beliefs.

  **Concession:** You must concede that if enforcement is ubiquitous (e.g., general market reputation replaces religious sanction), your specific religious mechanism becomes indistinguishable from standard market enforcement. Your theory only holds if *religious* enforcement adds variance beyond general commercial reputation.
