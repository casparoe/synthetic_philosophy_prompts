answer: |-
  # Lesson Plan: The Kinematics of Credence
  **Course:** Upper-Level Formal Epistemology  
  **Topic:** From Strict Conditionalization to Jeffrey Conditionalization  
  **Time:** 90 Minutes  
  **Class Size:** 14 Students  

  ## 1. Learning Objective
  Students will experience the limitations of strict conditionalization ($P_{new}(H) = P_{old}(H|E)$) when evidence is uncertain. Through a betting game, they will discover that updating via a weighted mixture of conditional probabilities outperforms both treating uncertain evidence as certain and refusing to update at all. The formal term "Jeffrey Conditionalization" is withheld until the final debrief.

  ## 2. Materials & Setup
  *   **The Urns:** Two opaque cloth bags (labeled **Urn A** and **Urn B**).
      *   **Urn A:** 8 Red chips, 2 Blue chips.
      *   **Urn B:** 2 Red chips, 8 Blue chips.
  *   **The Selector:** A large coin (Heads = Urn A, Tails = Urn B).
  *   **The Informant:** A teaching assistant (or a trusted student) with a standard 6-sided die.
  *   **The Glimpse Screen:** A piece of cardboard with a 2cm horizontal slit cut in the middle.
  *   **Scorecards:** One per student (printed grid for 15 rounds).
  *   **Whiteboard:** For tracking public scores and the "Error Rate."
  *   **Seating:** All 14 students around the large table. You stand at the head (the "House").

  ## 3. Scoring Scheme: The Calibration Reward
  To discourage bravado (assigning 100% to a guess) and reward honest credence, use a simplified **Brier Score** system.

  *   **Endowment:** Each student starts with **1,000 Epistemic Points**.
  *   **The Bet:** In each round, students assign a credence $p$ (from 0.0 to 1.0) to the proposition **"The Active Urn is Urn A."**
  *   **The Penalty:** At the end of the round, the true Urn is revealed.
      *   If **Urn A** is true: Loss = $100 \times (1 - p)^2$
      *   If **Urn B** is true: Loss = $100 \times (0 - p)^2$
  *   **Example:**
      *   You assign $p = 0.8$ to Urn A. Urn A is true. Loss = $100 \times (0.2)^2 = 4$ points.
      *   You assign $p = 0.8$ to Urn A. Urn B is true. Loss = $100 \times (0.8)^2 = 64$ points.
      *   You assign $p = 1.0$ (Certainty). Urn B is true. Loss = **100 points** (Maximum penalty).
      *   You assign $p = 0.5$ (Ignorance). Loss = **25 points** regardless of outcome.
  *   **Winning:** The student with the highest remaining points after 15 rounds wins (prize: choice of seminar topic for next week, or a book).

  ## 4. Timeline (90 Minutes)

  ### Phase 1: Setup & Baseline (15 Minutes)
  1.  **Introduction (5 min):** Explain the Urns (8/2 split) and the Coin Flip (50/50 prior). Explain the Scoring Scheme. Emphasize: *"Your goal is not to guess right every time; it is to minimize your penalty over time. Honesty is the optimal strategy."*
  2.  **Round Type 1: Direct Observation (10 min / 3 Rounds):**
      *   Flip the coin to select the Urn (keep result hidden).
      *   Draw a chip from the Urn.
      *   **Hold it up clearly for 5 seconds.** Everyone sees the color.
      *   Students record credence in Urn A.
      *   **Reveal:** Show the Urn label. Calculate penalties.
      *   **Pedagogical Note:** Students should use Strict Conditionalization. If Red, $P(A) = 0.8$. If Blue, $P(A) = 0.2$. Most will get this right. Scores should be high.

  ### Phase 2: The Noisy Channel (35 Minutes)
  3.  **Round Type 2: The Informant (20 min / 6 Rounds):**
      *   **Setup:** Write on the board: **"INFORMANT RELIABILITY: 80%."** Explain the mechanism: The Assistant looks at the chip. They roll a die. On 1–4, they tell the truth. On 5–6, they lie (state the opposite color).
      *   **Procedure:** Select Urn (hidden). Draw chip (hidden). Assistant looks, rolls die (hidden), announces "Red" or "Blue".
      *   **The Trap:** Do *not* tell them how to calculate the Urn probability. Let them struggle.
      *   **Expected Split:**
          *   *Camp 1 (The Strict):* Treat the announcement as fact. If Assistant says "Red", they set $P(Red)=1$, thus $P(A)=0.8$.
          *   *Camp 2 (The Skeptics):* Distrust the noise. Keep $P(A)=0.5$.
          *   *Camp 3 (The Mixers):* Realize the announcement shifts $P(Red)$ to 0.8, not 1.0. They calculate $P(A) = P(A|Red)\cdot 0.8 + P(A|Blue)\cdot 0.2$.
      *   **Reveal & Score:** Reveal Urn. Tally penalties.
      *   **Outcome:** Camp 1 will have high variance (huge wins when Assistant is right, massive penalties when Assistant lies). Camp 2 will stagnate (steady 25-point losses). Camp 3 should have the highest cumulative score (calibrated losses).
      *   **Board Work:** After Round 4, ask the top scorer to explain their calculation. Write their formula on the board *without naming it*. It should look like: $P_{new}(H) = P_{old}(H|E) \cdot P_{new}(E) + \dots$

  4.  **Round Type 3: The Glimpse (15 min / 6 Rounds):**
      *   **Setup:** Erase the "80%" from the board. Say: *"The Assistant is gone. I will show you the chip, but the lighting is poor."*
      *   **Procedure:** Select Urn. Draw chip. Hold it behind the **Glimpse Screen**. Expose the chip through the slit for **0.5 seconds**.
      *   **Instruction:** *"You will not be certain. Do not write 1 or 0. Write the credence in the **Chip Color** that feels right, then use that to determine your credence in the **Urn**."*
      *   **Experience:** Some rounds the glimpse is clear ($P(Red) \approx 0.9$). Some are ambiguous ($P(Red) \approx 0.6$).
      *   **Reveal & Score:** Reveal Urn. Tally penalties.
      *   **Outcome:** The "Strict" camp crashes (they cannot treat the glimpse as certain). The "Skeptics" survive but don't win. The "Mixers" (now using introspection for $P_{new}(E)$) dominate.

  ### Phase 3: The Debrief (40 Minutes)
  5.  **Formalization (15 min):**
      *   Reveal the term: **Jeffrey Conditionalization (Probability Kinematics)**.
      *   Map the game to the formula:
          *   $H$: Urn A.
          *   $E$: Chip is Red.
          *   **Round 1:** $P_{new}(E) = 1$. Formula collapses to Strict Conditionalization.
          *   **Round 2:** $P_{new}(E) = 0.8$ (derived from known reliability).
          *   **Round 3:** $P_{new}(E) = \text{Introspective Credence}$.
      *   Write the full formula: $P_{new}(H) = \sum P_{old}(H|E_i) \cdot P_{new}(E_i)$.

  6.  **The Rigidity Assumption (10 min):**
      *   Ask: *"Why did we hold $P(Urn|Red)$ fixed at 0.8 throughout?"*
      *   Explain **Rigidity**: The experience changed your view on the *Chip*, but gave no new info about the *Urn* independent of the Chip.
      *   **Failure Mode:** Ask students: *"What if the Assistant only lies when the Urn is B?"* Then $P(Urn|Red)$ would change. Jeffrey conditionalization would fail. Rigidity is a substantive constraint, not just math.

  7.  **The Gap: Objective vs. Subjective Reliability (15 min):**
      *   Address the limitation (see Section 6 below).
      *   Discuss how Round 2 (known 80%) differs from Round 3 (introspective 60%).
      *   Conclude: Jeffrey Conditionalization solves the *algebra* of uncertain evidence, but the *epistemology* of determining $P_{new}(E)$ remains a hard problem (the problem of "givenness").

  ## 5. Predictable Failures & Fixes

  | Failure Mode | Why it happens | Fix |
  | :--- | :--- | :--- |
  | **Students condition on the Report** | In Round 2, smart students will calculate $P(A | \text{Assistant Says Red})$ using Bayes' theorem on the *report*. This yields the same result as Jeffrey on the *chip* (0.68). They won't see the difference. | **Intervention:** In Round 3 (Glimpse), there is no "Report" proposition. Force the distinction there. In Round 2, explicitly ask: *"Did you update on the sentence spoken, or the color seen?"* |
  | **Time Overrun** | Calculating Brier scores manually takes time. | **Fix:** Use a spreadsheet on your laptop (projected) to tally scores instantly. Or, simplify scoring: 10 points for correct Urn, 0 for wrong, minus "Confidence Penalty" (if you said >90% and were wrong, -20). |
  | **Glimpse is too ambiguous** | Students assign 0.5 every time. | **Fix:** Vary the exposure time. Some 1.0 seconds (high confidence), some 0.2 seconds (low confidence). Encourage them to differentiate. |
  | **Rigidity Confusion** | Students think $P(H|E)$ should update. | **Fix:** Use the "Wear and Tear" example in debrief. If Red chips are older and scratch the bag, seeing a Red chip tells you about the Urn *beyond* the color ratio. That breaks rigidity. |

  ## 6. The Honest Note: What This Game Cannot Reproduce

  You correctly identified the gap: **Calibrated Uncertainty vs. Raw Experience.**

  **The Gap:**
  In Round 2, the 80% reliability was **common knowledge** (written on the board). A sharp student can simply compute the mixture in advance. This is *not* the hard philosophical problem Jeffrey was solving. Jeffrey's motivating cases (e.g., "The cloth looks greenish-blue by candlelight") involve uncertainty where the agent *does not know* the reliability of their own senses. They cannot compute the mixture; they must *introspect* the shift.

  **How the Game Handles It:**
  *   **Round 2 (The Informant)** teaches the **Algebra**. It shows *why* the mixture rule is mathematically superior to treating uncertain evidence as certain ($P=1$) or ignoring it ($P=Prior$). It validates the *formula*.
  *   **Round 3 (The Glimpse)** teaches the **Epistemology**. Here, there is no die roll. There is no 80%. The student must look inside themselves and ask, *"To what degree did this experience shift my belief?"* This is where the "common knowledge" shield drops.

  **Debrief Script for the Gap:**
  > "In Round 2, I gave you the weights. You were engineers applying a known tolerance. In Round 3, you were the instrument. Jeffrey Conditionalization gives you the rule for how to propagate that uncertainty to your other beliefs (the Urn), but it does *not* tell you how to generate the uncertainty weights ($P_{new}(E)$) in the first place.
  >
  > That is the limit of the formalism. It solves the problem of **consistency** (how to keep your web of belief coherent when experience is fuzzy), but it does not solve the problem of **justification** (why you should set $P_{new}(E)$ to 0.6 rather than 0.7). For that, you need a theory of perception, not just a theory of probability."

  **One Final Warning:**
  Be prepared for a student to argue that *all* evidence is ultimately certain (the "Myth of the Given"). They might argue, *"I am certain that I had a visual experience as-of Red,"* and thus Strict Conditionalization still applies to the phenomenal proposition.
  *   **Response:** Acknowledge this is a valid foundationalist stance (Chisholm/Lewis). However, point out that we rarely bet on our phenomenal experiences; we bet on the world (the Urn). Jeffrey Conditionalization is the bridge for agents who want to update worldly beliefs without committing to infallible sensory propositions. It is a tool for **fallibilists**.

  ## 7. Materials Checklist for Instructor
  1.  **Two Bags** (labeled A/B internally, hidden).
  2.  **20 Chips** (10 Red, 10 Blue) to load bags.
  3.  **1 Die** (for Informant).
  4.  **1 Cardboard Slit**.
  5.  **Score Sheet Template** (Columns: Round, Type, Report/Glimpse, My $P(A)$, True Urn, Penalty, Total).
  6.  **Whiteboard Markers** (Red and Blue to match chips).

  This design ensures the formula emerges as a solution to a scoring problem, rather than an algebraic variation dropped from the sky. The "Losing Camps" provide the necessary friction to make the "Mixture" solution stick.
