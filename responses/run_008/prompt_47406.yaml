answer: |-
  Here is the Newton–Leibniz–Mach debate ported to your stack, followed by the residue report and the verdict.

  ### The Port: Substantivalism vs. Relationalism in Engine Terms

  **Newton (Substantivalism): The Persistent World Grid**
  In your engine, Newton is the `World` singleton. It holds the global coordinate system (`glm::vec3(0,0,0)`). This grid exists before you spawn the first entity and persists after you delete the last one.
  *   **The Claim:** Acceleration is not just a change in relation between objects; it is a second derivative against this grid.
  *   **The Bucket:** You spawn a `RigidBody` (the bucket) with water particles parented to it. You set `angularVelocity` to `(0, 10, 0)`. The solver calculates centrifugal force ($F = m \omega \times (\omega \times r)$). The water climbs the walls.
  *   **The Justification:** The solver doesn't check if there are other objects. It checks `rigidBody->angularVelocity` against the `World` time-step. The "force" comes from the body's state relative to the `World` grid, not relative to other bodies.

  **Leibniz (Relationalism): The Transform Hierarchy**
  Leibniz argues the `World` grid is a UI convenience, not a physical reality.
  *   **The Claim:** Only `relativeTransforms` exist. `WorldMatrix` is just cached data derived from the graph.
  *   **The Shift:** If you re-root the scene graph so the bucket becomes the new `(0,0,0)`, physics shouldn't change. Leibniz says *all* inertial frames are equally valid descriptions of the same relations.
  *   **The Bug in Your Mapping:** You noted that re-rooting feels like Leibniz's shift symmetry. It isn't. In your engine, if you re-root, you change the *numbers* in the `WorldMatrix`, but the `Integrator` still computes derivatives against the underlying time and space metric of the `World` singleton. You can't make the `World` singleton disappear. Leibniz demands you be able to delete the `World` object and run the sim purely on pairwise constraints. Your engine crashes if you try to remove the background metric.

  **Mach (The Relational Origin of Inertia): The Missing Feature**
  Mach looks at your `RigidBody` component and asks: "Where did `mass` and `inertiaTensor` come from?"
  *   **Newton/Engine:** They are intrinsic properties. `body->mass = 10.0f`. Hardcoded or loaded from asset data.
  *   **Mach:** Inertia is not intrinsic. It is a coupling coefficient. `body->inertiaTensor` should be a function: `CalculateInertia(this, AllOtherBodiesInUniverse)`.
  *   **The Prediction:** If you delete all other bodies (empty level), `CalculateInertia` returns 0 or undefined. If you spin the bucket in an empty universe, there should be no centrifugal force. The water stays flat.
  *   **Your Engine:** In an empty level, the water climbs the walls. Your engine assumes the "distant masses" are implicitly present in the `World` grid itself.

  ### Pressing the Mapping: The "Empty Level" Test

  You asked if your engine is a card-carrying substantivalist. **Yes.**

  When you set `angularVelocity` on a lone body in an empty scene, your solver integrates $F=ma$ where $a$ is acceleration relative to the `World` origin. The code does not look for other mass to justify the resistance to rotation. It assumes the background grid provides the resistance.

  This means your engine is not "wrong" about empty worlds in a *software* sense; it is wrong in a *physical* sense. It implements Newton's physics, which assumes space is a "container" that can exert causal influence (via inertial forces) even when empty.

  Is there a counterpart to Mach in your engine? **No.**
  To implement Mach, you would need a global field solver that updates every body's `inertiaTensor` every frame based on the distribution of all other masses. If the scene is empty, the concept of `angularVelocity` should throw an exception or result in zero force. Your engine has no hook for this. Inertia is a constant, not a dynamic relationship.

  ### The Residue Report

  **1. What Translates Cleanly**
  *   **Constraints & Contacts:** These are pure Leibniz. A `PointToPointConstraint` defines physics entirely by the relation between Body A and Body B. No reference to `World` is needed to solve the constraint impulse.
  *   **Hierarchy:** Parenting is relational. A child's transform is defined by its parent, not the world.

  **2. What You Had to Fudge**
  *   **Time:** Your `deltaTime` is absolute. It ticks regardless of whether any objects move or exist. In a fully relational view (and certainly in GR), time is measured by change (clocks are bodies). Your engine has a master clock that exists outside the simulation content.
  *   **The Integrator:** The symplectic integrator assumes a fixed background metric. It treats space as a static array of floats, not a dynamic field.

  **3. What Has No Expression (The Vacuum)**
  *   **The Metric Field:** In General Relativity (the modern successor to this debate), spacetime is a field that curves and reacts to mass. In your engine, the "grid" is static.
  *   **The Empty Level:** This is the biggest lie. In your engine, an empty level is a valid state with a defined metric. In a Machian/Relativistic view, an empty universe is a singularity or undefined. There is no "stage" without "actors." Your engine renders a void; physics says the void cannot exist without content to define it.

  ### The Verdict

  You asked me to pick: **Does the residue show your vocabulary is missing something real, or does it show the philosophers were arguing about bookkeeping?**

  **The verdict: Your vocabulary is missing something real.**

  The philosophers were not arguing about bookkeeping. They were arguing about **causality**.

  Newton claimed the "container" causes inertia. Leibniz and Mach claimed "relations" cause inertia. Your engine hardcodes Newton's answer. When you write `rigidBody->ApplyTorque()`, you are invoking a causal mechanism that assumes a background absolute space exists to resist that torque.

  The residue (the fact that you cannot implement Mach's principle without rewriting the fundamental integrator) proves that your vocabulary treats space as a *substance* (a static grid) rather than a *relationship*.

  This matters because your engine is a Newtonian simulator. It works for games because, locally, Newton is a good enough approximation. But the "bug" you felt in the mapping is real: **You are simulating a universe where the grid has physical mass/influence, even though you know no such grid exists.**

  The philosophers identified a gap in the causal chain: *What tells the water it's spinning?*
  *   **Newton:** The Grid.
  *   **Mach:** The Stars.
  *   **Your Engine:** The Grid (hardcoded).

  If you believe General Relativity is a better description of reality than Newtonian mechanics, then Mach (and Leibniz) were closer to the truth: inertia is relational. Your engine's vocabulary forces you to pretend space is absolute because it makes the math cheaper. The distinction isn't bookkeeping; it's a simplification of reality that your engine exposes as a hard dependency. The "Absolute Space" in your code isn't just a root node; it's a physical assumption that limits what your simulation can represent.
