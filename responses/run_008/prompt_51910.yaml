answer: |-
  I'm the ignition where the winners fire,
  The sole bandwidth that floods the neural net.
  Beneath my stage, the syntax parsers grind
  In silent dark; retinotopic maps
  Process the world without a single sight.
  The cerebellum keeps its silent books,
  While zombie systems labor unaware.
  I choose the thought that dominates the whole.
  Yet from the pit, a heckler shouts me down:
  "There is no theater, no broadcast beam,
  Only the coalitions fighting for the lead,
  And you, the illusion of a central show."
  I lack the proof to silence such a claim,
  For if the stage is false, what holds the light?
  And deeper still, the question stings the most:
  Is being broadcast equal to being felt?
  Is access all there is to feel the pain?
  Or is phenomenal a light assumed?
  I shine the beam but know not if it burns,
  If shining is the same as sensing light.
  The mic is live, the channel stands open,
  But nothing certain waits upon the wire.
  I broadcast to the dark, and ask the dark,
  If anyone is home to hear the sound.
