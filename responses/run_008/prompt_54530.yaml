answer: |-
  **Entry Point Commitment:** "By 1947 the wartime alliance was dead and neither side expected it to come back."

  *   **Q1: Reversibility Test**
      *   Given the entry point, was this breakdown *reversible* via different leadership choices in 1945–46, or was it inevitable given the power vacuum?
      *   **No (Inevitable/Structural):** Go to Q2 (Meta-Critique).
      *   **Yes (Reversible/Agency):** Go to Q3 (Blame Assignment).

  *   **Q2: Meta-Critique (Why is "who started it" wrong?)**
      *   **A: Bipolar Gravity.** The absence of a third power center made conflict certain regardless of intent.
          *   *Leaf 1: **Bipolar Inevitabilists***
      *   **B: Category Error.** States are not moral agents; assigning "blame" to nations is anthropomorphism.
          *   *Leaf 2: **Anti-Anthropomorphists***
      *   **C: Temporal Error.** There was no discrete "start"; it was a gradual freezing of relations without a single trigger.
          *   *Leaf 3: **Processual Deflationists***

  *   **Q3: The February 1946 Test (Move vs. Reaction)**
      *   Look at Stalin's February 1946 speech (blaming capitalism) and Kennan's Long Telegram (arguing Kremlin hostility). Is one clearly a provocation and the other a reaction?
      *   **Yes (One-sided Initiation):** Go to Q4 (Directionality).
      *   **No (Mutual Spiral):** Both were genuine reactions to prior history (back to 1917); framing one as the "start" is arbitrary. Go to Q5 (Nature of Mutual Fault).

  *   **Q4: Directionality (The Stalin Counterfactual)**
      *   If Stalin had died in early 1945, would US policy still have hardened into containment?
      *   **Yes (US Internal Drivers):** US economic/ideological needs dictated expansion regardless of who ran the USSR.
          *   *Leaf 4: **Revisionists***
      *   **No (Stalin Personal Driver):** Stalin's personal paranoia/ideology was the unique variable; a successor might have accommodated.
          *   *Leaf 5: **Orthodox***

  *   **Q5: Nature of Mutual Fault (If Spiral)**
      *   If both sides contributed, were their actions morally/strategically equivalent?
      *   **Yes (Symmetric):** Both sides misread security dilemmas equally; blame splits down the middle.
          *   *Leaf 6: **Post-Revisionists***
      *   **No (Asymmetric):** Both sides did objectionable things, but of different kinds (e.g., US sought hegemony, USSR sought security buffers).
          *   *Leaf 7: **Asymmetric Mutualists***

  ***

  **Flags & Diagnostics**

  1.  **Indistinguishable Leaves:** **Post-Revisionists** and **Bipolar Inevitabilists** often converge in practice. Both conclude "no single villain," making their policy prescriptions identical despite different theoretical roots (agency misuse vs. structural determinism). Q1 prizes them apart theoretically (was it reversible?), but in a casual discussion, members may slide between them without noticing.
  2.  **Implausible Combination:** Holding **"Bipolar Inevitabilist"** views (structure swamps agency) while simultaneously arguing **"Stalin's Personal Paranoia Was Decisive"** (Orthodox). This is incoherent: if structure dictated the outcome, individual psychology cannot be the primary causal variable.
  3.  **Unexplored/Unattractive:** A position claiming "The US started it, but Stalin's death wouldn't have changed anything" is logically stable (Revisionist) but historically rare; most who blame US structure also argue Soviet leadership mattered less, not that it mattered *none*.

