          *   To get the Alternating Harmonic Series in the expectation, the payoff $V_n$ must satisfy $P(n) \cdot V_n = (-1)^{n+1} \frac{1}{n}$.
          *   So, $V_n = 2^n \cdot (-1)^{n+1} \frac{1}{n}$.
          *   *Correction:* The book says payoffs grow huge. Yes, $2^n/n$ grows huge. The user's memory of "payoffs get smaller" likely refers to the *terms in the expected value series* ($1/n$), not the actual dollar payoffs. This is a crucial distinction to clarify.
      *   *Expected Value:* $E = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot \left( (-1)^{n+1} \frac{2^n}{n} \right) = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n}$.
