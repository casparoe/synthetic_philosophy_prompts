      *   *Actually:* Nover & Hájek emphasize that because it's not *absolutely* convergent, the expectation is not well-defined in the sense of Lebesgue integration. Lebesgue integration requires $\int |f| d\mu < \infty$. If that fails, the integral is undefined in the strict measure-theoretic sense used in modern probability, even if the Riemann sum converges conditionally.
      *   *So:* The book is *sort of* right that standard probability theory calls it "undefined" (because it lacks absolute convergence), but wrong/imprecise to say the partial sums "oscillate forever" (they converge conditionally). I need to make this distinction clear. The "oscillation" might refer to the fact that rearranging terms makes the partial sums go anywhere.

  5.  **Refining the Philosophy:**
