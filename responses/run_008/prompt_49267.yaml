          *   Trust the lecturer over the popular book.
          *   The math nuance (conditional vs. absolute convergence) is key.
          *   The philosophical leap (undefined = refuted) is the weak link.

  4.  **Refining the Math (Self-Correction/Verification):**
      *   *Pasadena Game Definition:* $P(n) = 1/2^n$. Payoff $X_n = (-1)^{n-1} \frac{2^n}{n}$.
