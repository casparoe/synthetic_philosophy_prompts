      *Wait, one more check:* Is there a version of Pasadena that diverges? The "Altadena" game adds a constant to Pasadena, shifting the value but keeping the convergence properties. There are variants constructed to diverge. But the canonical Nover & Hájek game is the Alternating Harmonic one. I will stick to the canonical definition but acknowledge the book might be simplifying.

