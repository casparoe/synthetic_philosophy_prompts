answer: |-
  This is a classic setup for a seminar on vagueness, and you are right to be suspicious that the "Exact Number" question won't do the work you want it to.

  Based on Ruth's track record, she is almost certainly **not** an Epistemicist, despite the surface-level similarities. Her behavior fits **Supervaluationism** (or a truth-value gap view) much better. However, since your goal is to anticipate her line for the seminar, here is the breakdown of how the two theories diverge on your specific questions, why your intuition about the "Exact Number" question is correct, and what questions will actually split them.

  ### 1. Diagnosing Ruth's Record
  You mentioned that Epistemicism and Supervaluationism both seem to fit her record. This is a common point of confusion because they agree on *what to say* in practice, but disagree on *why*.

  *   **The Similarity:** Both views reject the Sorites Conditional ("If $n$ is bald, $n+1$ is bald").
      *   The **Epistemicist** rejects it because it is **false** (there is a sharp cutoff somewhere).
      *   The **Supervaluationist** rejects it because it is **not supertrue** (it fails on some precisifications).
  *   **The Difference:** How they treat the borderline case (Sam with 40,000 hairs).
      *   **Epistemicism:** Insists on **Bivalence**. Sam *is* either bald or not bald. There is a fact of the matter. Ruth's refusal to assert either is merely an admission of *ignorance*.
      *   **Supervaluationism:** Rejects Bivalence for borderline cases. Sam is **neither** bald nor not bald (truth-value gap). Ruth's refusal to assert either is an admission of *indeterminacy*.

  **Verdict:** Ruth's claim that Sam "gets nothing either way" and that losing one hair "made no difference" is the hallmark of Supervaluationism. An Epistemicist would insist that losing one hair *must* make a difference eventually (at the cutoff), even if we can't locate it.

  ### 2. Predictions on Your New Cases

  Here is how the two theories predict she will answer your specific questions.

  #### Case (1): Is there a fact of the matter about whether Sam is bald?
  *   **Epistemicism:** **YES.** There is a sharp boundary in reality. Our concepts are precise; we just don't know where the line is. Ignorance is the only explanation for vagueness.
  *   **Supervaluationism:** **NO.** Truth is defined relative to "precisifications" (ways of making the term 'bald' precise). Since some precisifications make Sam bald and others make him not, there is no "supertruth." Therefore, there is no fact of the matter.
  *   **Ruth's Likely Answer:** **NO.** Given her refusal to assign a truth value to Sam, she will likely say the world/language simply does not determine an answer.

  #### Case (2): Did anything actually change about Sam's baldness when he lost that one hair?
  *   **Epistemicism:** **YES (Eventually).** While 40,001 to 40,000 might not cross the *actual* boundary, the Epistemicist insists a boundary *exists*. If you keep going, a metaphysical change *must* happen. If she says "no difference" implies "no difference ever," she contradicts Epistemicism.
  *   **Supervaluationism:** **NO (In the penumbra).** Within the borderline region, the truth status is indeterminate. Moving from one indeterminate state to another indeterminate state involves no change in truth value.
  *   **Ruth's Likely Answer:** **NO.** She has already committed to this by saying the single hair loss made no difference to her ruling.

  ### 3. Will "Is there an exact number where it flips?" work?
  **You are right to doubt it.** This question will **not** split the two views effectively, and here is why:

  *   **Epistemicist:** Will say **YES**. There is a specific number $k$ (e.g., 5,322) where the property flips.
  *   **Supervaluationist:** Will **ALSO SAY YES** (technically). Standard Supervaluationism preserves classical logic. The statement $\exists n (Bald(n) \land \neg Bald(n+1))$ is **Supertrue**. Why? Because on *every* admissible precisification, there is a sharp cutoff.
  *   **The Catch:** The Supervaluationist adds that while *some* number is the cutoff, no *particular* number can be identified as the cutoff.
  *   **Result:** If you ask Ruth this, she might say "Yes, logically there must be one, but it's indeterminate which one it is." This leaves you with the same ambiguity you started with.

  ### 4. Better "Splitter" Cases
  If you want to force a wedge between Epistemicism and Supervaluationism (or confirm she is indeed a Supervaluationist), try these questions:

  #### A. The Omniscient Being Test (Metaphysical vs. Epistemic)
  *   **Ask:** "If an omniscient being knew all the physical facts about Sam's head and all the linguistic conventions of English, would they know whether Sam is bald?"
  *   **Epistemicist:** **YES.** The being would know the exact cutoff. Vagueness is purely human ignorance.
  *   **Supervaluationist:** **NO.** Even an omniscient being couldn't know, because there is nothing to know. The semantics are unsettled.
  *   **Why it works:** This targets the *source* of the vagueness (ignorance vs. semantic indecision).

  #### B. The "Settled World" Test
  *   **Ask:** "Imagine we stipulate a new language where 'bald*' is defined precisely as '40,000 hairs or fewer.' In that language, is there still vagueness?"
  *   **Epistemicist:** **NO.** Vagueness disappears when precision is introduced.
  *   **Supervaluationist:** **NO.** (Agrees here).
  *   **The Follow-up:** "So, is the vagueness in our current language due to the fact that we *haven't* made that stipulation, or due to the fact that we *can't*?"
  *   **Epistemicist:** We haven't (but the boundary exists anyway).
  *   **Supervaluationist:** We haven't (and that's why it's indeterminate).
  *   *Actually, a better version:* **"Is the boundary fixed by the physical facts alone?"**
      *   **Epistemicist:** Yes. The physical facts determine the extension of 'bald'.
      *   **Supervaluationist:** No. The physical facts underdetermine the extension; semantic choice is required.

  #### C. Higher-Order Vagueness (The Nuclear Option)
  *   **Ask:** "Is there a sharp boundary between the cases that are definitely bald and the cases that are borderline?"
  *   **Epistemicist:** **YES.** There is a sharp line between 'definitely bald' and 'borderline'.
  *   **Supervaluationist:** **Usually NO.** This is the Achilles' heel of Supervaluationism. If they say there is a sharp boundary to the penumbra, they seem to reintroduce the problem they tried to solve. If they say no, they struggle to formalize it without losing classical logic.
  *   **Why it works:** Epistemicists are comfortable with sharp boundaries at every order. Supervaluationists often squirm here.

  ### Summary for Thursday
  1.  **Ruth's Position:** She is behaving like a **Supervaluationist**. Her record (truth-value gaps, tolerance in the middle) is incompatible with the core metaphysical commitments of Epistemicism.
  2.  **Predictions:** She will answer **NO** to "Is there a fact of the matter?" and **NO** to "Did anything change?"
  3.  **The "Exact Number" Question:** Do not rely on it. Both views accept the existential claim ($\exists n$) due to classical logic commitments.
  4.  **Best Strategy:** Ask the **Omniscient Being** question. If she says an omniscient being *still* wouldn't know, she is not an Epistemicist. If she says the being *would* know, she is an Epistemicist (and her previous claims about "no fact of the matter" were merely about *assertibility*, not truth).

  Good luck with the prep. If she dodges the Omniscient question, press her on **Higher-Order Vagueness**; that is usually where Supervaluationists reveal the most about their specific commitments.
