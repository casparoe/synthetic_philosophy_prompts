answer: |-
  # Joint Statement on the Analysis of Biological Function
  **Signatories:** The Etiological Working Group (EWG) & The Causal-Role Working Group (CRWG)
  **Date:** October 2023
  **Subject:** Resolution of Disagreements Regarding Functional Ascription in Biology and Artificial Systems

  ## 1. Agreed Claims
  *After a decade of adversarial exchange, we affirm the following points of consensus. These claims establish the shared phenomena any adequate theory must account for, regardless of the underlying metaphysical grounding.*

  1.  **Indispensability:** Function language ("the function of the heart is...") is indispensable to current practice in physiology, medicine, and engineering. Eliminating it in favor of pure physical description would cripple explanatory power in these fields.
  2.  **Distinction from Mere Effect:** There is a robust, pre-theoretical distinction between a trait's *function* and its mere *effects*. (e.g., The heart functions to pump blood; the sound it makes is a mere effect). Both sides agree a successful theory must capture this asymmetry without arbitrary stipulation.
  3.  **Reality of Malfunction:** Biological systems can genuinely malfunction. A theory of function must allow for the possibility that a trait exists but fails to perform its function, without implying the trait ceases to exist or ceases to be that type of trait.
  4.  **Naturalism:** Functional norms must be naturalizable. We reject appeals to supernatural agents or non-physical "vital forces." The "ought" of biological function must be grounded in facts about the physical world (whether historical or systemic).
  5.  **Context-Dependence of Explanation:** The *utility* of making a function ascription depends on the explanatory context. (e.g., In an evolutionary context, history matters more; in a surgical context, current causal contribution matters more). We disagree on whether this context-dependence changes the *truth conditions* of the ascription or merely its *relevance*.
  6.  **Synthetic Systems:** Artificial or engineered biological systems (e.g., synthetic gene circuits) are legitimate subjects for functional analysis. A theory that cannot account for them without ad-hoc adjustments is deficient.

  ## 2. Table of Disagreements
  *We remain divided on the following core issues. Each formulation below is endorsed by the respective side as an accurate statement of their position.*

  | Domain | Etiological Working Group (EWG) Position | Causal-Role Working Group (CRWG) Position |
  | :--- | :--- | :--- |
  | **Definition of Function** | A trait's function is determined by its **history of selection**. $X$ has function $F$ only if $X$ exists because ancestors of $X$ did $F$ and were selected for doing $F$. | A trait's function is determined by its **current causal contribution**. $X$ has function $F$ if $X$ performs $F$ and $F$ contributes to the capacity of the containing system. |
  | **Source of Normativity** | Normativity is **objective and historical**. A heart *ought* to pump blood because that is the standard set by its selection history. A broken heart is objectively malfunctioning even if no one is around to explain it. | Normativity is **contextual and explanatory**. A heart *ought* to pump blood relative to an explanatory scheme that seeks to understand circulation. "Malfunction" means "fails to contribute to the capacity we are currently analyzing." |
  | **The "New Trait" Problem** | A novel trait has **no proper function** until selection has acted upon it across generations. Before selection, it is merely a useful accident or a design artifact. | A novel trait has a **function immediately** upon contributing to the system's capacity. Selection history is irrelevant to the current functional status of the trait. |
  | **Proliferation of Functions** | We restrict functions to **selected effects** to avoid inflation. (e.g., Clouds raining is not a "function" because clouds were not selected for raining). | We accept that functions are **relative to the system boundary**. If we define the "system" as the water cycle, rain has a function. If we define it as the cloud, it does not. The theorist chooses the boundary. |

  ## 3. Cruxes and Adjudication Tests
  *We identify three specific cruxes where empirical or conceptual clarification could shift confidence between our positions. For each, we specify a test case, the prediction made by each side, and the theoretical cost of that prediction.*

  ### Crux 1: The Origin of Normativity in Synthetic Biology
  **The Question:** Does functional normativity require a history of selection, or can it be grounded in design/contributory capacity alone?

  **The Test Case: The Plastic-Digesting Bacteria**
  *Scenario:* A lab engineers a bacterium with a synthetic gene circuit allowing it to digest a novel plastic.
  *   **Generation 0:** The bacteria are released into the ocean. The circuit works immediately, contributing to cell maintenance by providing carbon. No selection has acted yet; the trait exists solely due to intelligent design.
  *   **Generation 1000:** The trait has spread through the population via natural selection. Bacteria without the circuit die out.

  **Predictions & Costs:**

  | Side | Prediction for Generation 0 (Pre-Selection) | Theoretical Cost of this Prediction |
  | :--- | :--- | :--- |
  | **EWG (Etiological)** | **No Proper Function.** The circuit has a *use* and a *design purpose*, but strictly speaking, it has no biological *function* yet because selection has not acted. Function emerges only by Generation 1000. | **Counter-Intuitive Utility:** This contradicts the practice of synthetic biologists who treat the circuit as functional immediately. It creates a "magic moment" where function pops into existence only after an arbitrary number of generations, despite no physical change in the circuit. |
  | **CRWG (Causal-Role)** | **Function Exists.** The circuit functions to digest plastic immediately because it contributes to the cell's maintenance capacity. History is irrelevant. | **Weakened Normativity:** If the circuit breaks in Generation 0 due to a manufacturing error, calling it a "malfunction" is weaker. It is only a malfunction relative to the engineer's intent, not relative to a biological norm. It blurs the line between "broken artifact" and "biological disease." |

  ### Crux 2: Vestigial Traits and Lost Utility
  **The Question:** Can a trait retain its function even if it no longer contributes to the system's capacity?

  **The Test Case: The Vestigial Eye**
  *Scenario:* A species of cave fish evolves in total darkness. Over time, their eyes degrade and no longer contribute to vision (causal capacity is zero). However, the developmental pathway for eyes remains conserved due to lack of negative selection pressure (it's not costly enough to eliminate).

  **Predictions & Costs:**

  | Side | Prediction | Theoretical Cost of this Prediction |
  | :--- | :--- | :--- |
  | **EWG (Etiological)** | **Function Retained.** The eyes still have the function of seeing, because that is what they were selected for in ancestors, even if they can no longer do it. | **Explanatory Idleness:** This makes function causally inert. Saying the eye "functions to see" when it *cannot* see seems to do no work in explaining the current organism's physiology. |
  | **CRWG (Causal-Role)** | **Function Lost.** The eyes no longer have the function of seeing, because they make no causal contribution to vision. They are merely structural remnants. | **Historical Erasure:** This makes it difficult to explain why the structure is there *as an eye* rather than random skin. It severs the link between the trait's identity and its historical role, making homology (sameness of structure across species) harder to classify functionally. |

  ### Crux 3: The "Merely Verbal" Dispute
  **The Question:** Is the disagreement substantive, or are we simply defining two different concepts and fighting over the label "function"?

  **The Test:** We propose a semantic partition. We will test whether substituting the terms **"Proper Function"** (EWG's concept) and **"Systemic Function"** (CRWG's concept) resolves the practical friction in scientific discourse.

  **Predictions & Costs:**

  | Side | Prediction | Theoretical Cost of this Prediction |
  | :--- | :--- | :--- |
  | **EWG (Etiological)** | **Substantive Dispute Remains.** Even if we rename the concepts, the EWG insists that *only* Proper Function grounds the objective normativity required for medicine (e.g., defining "disease"). If we accept Systemic Function as equal, we lose the ability to say a disease is objectively bad rather than just statistically unusual. | **Territorial Loss:** Admitting the dispute is partially verbal concedes that CRWG is right about *physiology*, forcing EWG to retreat to a narrower domain of *evolutionary biology* and *normative medicine*. |
  | **CRWG (Causal-Role)** | **Mostly Verbal.** The dispute is largely over which concept gets the unmarked word "function." Once we distinguish Proper vs. Systemic, the sniping stops. Science uses Systemic Function for mechanism; Evolution uses Proper Function for history. | **Normative Surrender:** Admitting this implies CRWG cannot ground objective medical norms on its own. It must borrow EWG's "Proper Function" to define disease, admitting that causal contribution alone is insufficient for normativity. |

  ## 4. Conclusion on the "Merely Verbal" Claim
  *We explicitly address the instruction to avoid dissolving the debate too easily.*

  We conclude that the dispute is **hybrid**.

  1.  **The Verbal Chunk:** The fight over which definition applies to the unqualified word "function" in general biology textbooks is largely verbal. We agree that English usage is polysemous (having multiple meanings). When a physiologist says "kidney function," they usually mean Causal-Role. When an evolutionary biologist says "function of the plumage," they usually mean Etiological. Confusion arises when one side insists their definition is the *only* legitimate one.
  2.  **The Substantive Chunk:** The fight over **normativity** is not verbal. The EWG is correct that Causal-Role analysis alone cannot ground an objective "ought." If function is only what a part *does* contribute to a system, a broken heart is simply a heart that isn't contributing; there is no sense in which it *failed* a standard, only that it *changed* the system's capacity. The EWG provides the only naturalistic ground for saying the heart is *supposed* to pump even when it doesn't.
  3.  **The Substantive Chunk (Reverse):** The fight over **explanatory utility for new traits** is not verbal. The CRWG is correct that Etiological analysis renders novel traits (like the Generation 0 bacteria or new mutations) functionless, which hampers engineering and immediate physiological explanation. The CRWG provides the only framework that allows function ascription without waiting for evolutionary history to accumulate.

  **Final Stipulation:** We recommend that future literature distinguish between **Function$_{ET}$** (Selected Effect, grounds normativity/disease) and **Function$_{CR}$** (Causal Contribution, grounds mechanism/engineering). Disputes should no longer be about which is "true," but about which is appropriate for the specific explanatory goal (e.g., diagnosing a patient vs. engineering a circuit). However, we acknowledge that in the domain of **mental content and AI alignment** (the origin of this collaboration), the stakes are higher: if an AI "has the function of predicting text," is that a Function$_{ET}$ (implying a history of selection we may not understand) or Function$_{CR}$ (implying we can read its function off its current architecture)? That question remains open, and our divergence here predicts different risks in alignment theory.
