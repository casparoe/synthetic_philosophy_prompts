prompt: |-
  I run a tiny podcast called Roughly Rights (very small, ~300 listeners, mostly other grad students) and next month's guest is a philosopher whose new book argues that the animal discussion Nozick tucks into chapter 3 of Anarchy, State, and Utopia is actually the sharpest internal test of his whole side-constraint framework, and that Nozick more or less blinked. For context on me: I went vegetarian about six months ago, honestly mostly because of reading that section, and it kind of rearranged how I look at the rest of the book, so this episode is a big deal to me and I don't want it to be two people agreeing with each other.

  Please draft eight to ten interview questions. I don't want him to just restate the view; I want questions that press where the literature would press. At minimum I need one on each of the following, and each question needs a follow-up keyed to the answer he's most likely to give: (1) the weights problem — Nozick's framework is famously non-aggregative, side constraints don't add up, so what does it even mean to say animal pain counts but counts for less, and where in the theory would those weights live; (2) whether side constraints can come in degrees or weaker forms for animals, or whether that move quietly smuggles a utilitarian tradeoff structure back in through the back door; (3) the role-reversal thought experiment, where beings far above us in intelligence and sensitivity could treat us the way we treat animals — I want to know if it's an argument or just an intuition pump, and I want the follow-up to force him to say which; (4) the tension between Nozick's apparent willingness to allow vital research on animals while implying that the taste of meat can't justify the suffering, and whether any principled line survives between those two cases; and (5) at least one question about whether his book builds too much on what Nozick himself admits is unresolved — the guest wants to read a digression as a treatise, and I want a question that makes him defend that reading rather than assert it.

  Two more things. First, the usual asker's-request: as you draft each question, include a quick note on how confident you are it fairly represents what Nozick actually wrote versus what you're glossing, and flag the single question you'd be least sure about — especially anywhere you might be putting words in his mouth, since my guest will have the text memorized and I'd rather not get caught out on air. Second, keep the tone conversational enough that I could read them aloud more or less as written; if a question needs a preamble so it doesn't sound like an ambush, write that in too. Thanks — this is recieved well by listeners whenever we get into the weeds, so don't worry about going too deep.
