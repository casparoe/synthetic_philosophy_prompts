prompt: |-
  I run a small forecasting team at a consultancy (4 analysts, mostly generalists, we do short-turnaround questions for clients -- geopolitical stuff, tech timelines, occasional market calls). I've been reading about epistemic akrasia and higher-order evidence and I think there's something there my team needs but I can't figure out how to make it operational. Like, the literature says you shouldn't end up believing "P, but I shouldn't believe P", and that certain kinds of evidence about *your own reasoning* (you're tired, the expert disagrees with you, you were wrong the last five times on this question type) are supposed to matter somehow, but it's all pretty abstract. Meanwhile my analysts either ignore that stuff entirely or they overcorrect -- one guy found out he'd been badly calibrated on China questions for a year and basically threw out all his priors about the region, which was worse.

  So here's the ask: write a procedure my team can actually run when they notice higher-order evidence bearing on a forecast they're about to submit. Something that fits on a page, runs in maybe 15 minutes before a deadline, and answers in order: (1) which higher-order signals are worth taking seriously vs noise (does it matter that you feel rushed? that a domain expert disagrees? that your client has an obvious interest in one answer?), (2) how to actually adjust the credence without doing something dumb like jumping to 50/50 or abandoning your prior entirely, and (3) when to just flag the forecast as low-confidence instead of adjusting at all. It should say where the procedure has to hand things back to the analyst as a judgment call, and where following it will give you an answer that feels wrong but should be followed anyway.

  Then run it on three cases from our actual workflow:

  - An analyst whose forecast on a coup question disagrees with the country specialists at a big think tank, and she genuinely can't tell if they know something she doesn't or if they're just biased toward stability.
  - An analyst who's been up for 20 hours and is about to submit a forecast he's confident in, knows sleep deprivation degrades judgment, but has no idea by how much or in which direction.
  - An analyst who just got a bad calibration score on a whole category (central bank decisions) and now wants to hedge every interest rate forecast toward the base rate even though his actual object-level reasoning hasn't changed at all.

  Also be upfront about what this procedure can't do -- I'd rather know where it breaks than have a fake sense that we've solved it. And if there are places where the philosophy genuinely doesn't settle what to do (I get the sense the akrasia literature has actual live disputes here), tell me that too, so we can pick a house policy rather than pretend the answer falls out of the theory.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Small forecasting team (4 analysts, generalists, short-turnaround, geopolitical/tech/market).
      *   **Problem:** Epistemic akrasia/higher-order evidence (HOE) is theoretically important but operationally vague. Analysts either ignore it or overcorrect (e.g., throwing out priors entirely).
      *   **Task:** Create a 1-page, 15-minute operational procedure for handling HOE before submission.
      *   **Requirements:**
          1.  Filter signals (noise vs. serious HOE).
          2.  Adjustment mechanism (avoid dumb moves like 50/50 or total abandonment).
          3.  Confidence flagging criteria (when to flag vs. adjust).
          4.  Identify judgment calls vs. rigid rules.
          5.  Apply to three specific cases (Think Tank Disagreement, Sleep Deprivation, Bad Calibration/Overcorrection).
          6.  Disclose limitations and philosophical unresolved disputes.

  2.  **Theoretical Grounding (Mental Sandbox):**

      *   *Epistemic Akrasia:* The state of believing $P$ while believing one shouldn't believe $P$. Generally considered irrational.
      *   *Higher-Order Evidence (HOE):* Evidence about the quality of your first-order evidence or reasoning process (e.g., "I am tired," "Experts disagree," "I have a bias").
      *   *The Conciliationism vs. Steadfastness Debate:* When peers disagree, should you move to the middle (conciliate) or stick to your guns (steadfast)? Most forecasting literature leans toward conciliation but weighted by track record.
      *   *Calibration:* Matching confidence to frequency.
      *   *Operationalizing:* Needs to be heuristic-based, not Bayesian calculus (too slow for 15 mins). Needs to prevent "belief fragmentation."

  3.  **Drafting the Procedure (The "HOE Triage Protocol"):**

      *   *Goal:* Keep it actionable. Use a checklist format.
      *   *Section 1: Signal Filtering.* Not all HOE is equal. Distinguish between *process* signals (tired, rushed) and *content* signals (expert disagreement). Distinguish between *incentive* signals (client bias).
      *   *Section 2: Adjustment Logic.* How to move the number? Suggest a "discount rate" rather than a reset. Use the concept of "shrinking toward the mean" or "shrinking toward the expert consensus" but capped.
      *   *Section 3: Flagging.* When is the uncertainty too high? When the HOE overwhelms the first-order evidence.
      *   *Section 4: Hard Rules vs. Judgment.* Where do we force compliance? Where do we allow analyst discretion?

  4.  **Developing the Three Cases:**

      *   *Case 1 (Think Tank Disagreement):* This is peer/expert disagreement. HOE suggests "maybe I'm missing info." But experts have stability bias. *Action:* Weighted conciliation. Don't just average. Check the expert's track record if known. If unknown, discount slightly toward their view but keep object-level reasoning.
      *   *Case 2 (Sleep Deprivation):* This is cognitive impairment HOE. Direction is unknown, but variance is high. *Action:* This is a "Flag" case. You can't adjust the number if you don't know the bias direction. You must disclose the impairment.
      *   *Case 3 (Bad Calibration/Overcorrection):* This is statistical HOE. The analyst is reacting emotionally (akrasia risk: "I know my reasoning is sound, but I feel I shouldn't trust it"). *Action:* Mechanical adjustment. Apply a calibration tax *after* the fact, or shrink toward base rate *slightly*, but forbid abandoning object-level reasoning. This is where we need a hard rule against "throwing out priors."

  5.  **Addressing Limitations & Philosophy:**

      *   *What it can't do:* It can't fix bad first-order reasoning. It can't resolve fundamental philosophical disputes (e.g., how much weight to give HOE vs. FOE).
      *   *Philosophical Disputes:* The "Right Response" to HOE is contested. Some say HOE defeats justification entirely; others say it just reduces confidence. We need to pick a "house policy" on the weight.
      *   *Akrasia:* The procedure aims to prevent the state of "I believe 80% but I think I should believe 50%." It forces alignment.

  6.  **Refining the Output (Iterative Polishing):**

      *   *Tone:* Professional, direct, consultancy-appropriate. Not overly academic but grounded in the concepts.
      *   *Format:* Clear headings, bullet points, distinct sections for the procedure and the case studies.
      *   *Constraint Check:* Does it fit on a page? (I will write it concisely). Does it take 15 mins? (Yes, it's a checklist). Does it answer the three specific questions? (Yes).

  7.  **Self-Correction/Critique during drafting:**

      *   *Critique:* Is the adjustment mechanism too vague? "Discount slightly" is subjective.
      *   *Fix:* Suggest specific ranges (e.g., "Move 10-20% toward the counter-signal").
      *   *Critique:* Case 2 is tricky. If you're tired, maybe you shouldn't submit at all.
      *   *Fix:* Add a "Stop Work" option in the procedure. If impairment is severe, don't forecast.
      *   *Critique:* Case 3 needs to address the emotional reaction to calibration scores.
      *   *Fix:* Emphasize that calibration scores are long-term metrics, not immediate truth-tellers for specific questions.

  8.  **Final Review against the Prompt:**

      *   Procedure included? Yes.
      *   Three cases run through it? Yes.
      *   Limitations/Philosophy disclosed? Yes.
      *   Operational focus? Yes.

  9.  **Final Polish:** Ensure the distinction between *first-order evidence* (the facts about the coup) and *higher-order evidence* (the fact that experts disagree) is clear in the examples. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: Make sure the "House Policy" section is explicit about where the philosophy is silent. The prompt asks to be upfront about where the theory doesn't settle the debate. I need to highlight the "Weighting Problem" (how much does HOE matter?) as a policy choice, not a derived truth.

  10. **Final Output Structure:**
      *   Introduction (acknowledging the difficulty).
      *   The Procedure (The "HOE Triage Protocol").
      *   Case Applications.
      *   Limitations & Philosophical Gaps (The "House Policy" section).

  (Ready to write.)
answer: |-
  # The HOE Triage Protocol (Higher-Order Evidence)

  **Purpose:** To prevent epistemic akrasia (believing *P* while believing you shouldn't) and operationalize higher-order evidence (HOE) without triggering overcorrection.
  **Timebox:** 15 minutes max before submission.
  **Trigger:** Anytime an analyst identifies a signal regarding their *reasoning process* rather than the *world* (e.g., "I am tired," "Experts disagree," "I have a bias").

  ---

  ### Step 1: Signal Filtering (Noise vs. HOE)
  *Do not treat all meta-signals as evidence. Categorize the signal:*

  | Signal Type | Examples | Action |
  | :--- | :--- | :--- |
  | **Type A: Cognitive Impairment** | Sleep deprivation, extreme time pressure, emotional distress. | **High Priority.** Indicates random noise or systematic drift. |
  | **Type B: Peer/Expert Disagreement** | Think tanks, domain specialists, consensus forecasts disagree with you. | **High Priority.** Indicates missing information or model error. |
  | **Type C: Incentive/Bias** | Client preference, your own past track record in this category, political leaning. | **Medium Priority.** Indicates directional skew. |
  | **Type D: Intuition/Vibes** | "This feels too easy," "I have a gut feeling." | **Ignore.** Unless linked to specific Type A/B/C factors, this is noise. |

  ### Step 2: Adjustment Logic (The "Shrink" Rule)
  *Never reset to 50/50. Never abandon object-level reasoning entirely. Adjust by **shrinking** your credence toward a reference point.*

  1.  **Identify your Object-Level Credence (OLC):** What does the evidence say? (e.g., 80%)
  2.  **Identify the HOE Reference Point (RP):** Where does the higher-order evidence point? (e.g., Expert consensus = 40%; Base rate = 10%)
  3.  **Apply the Discount:** Move your OLC toward the RP by **20% of the distance**.
      *   *Formula:* $New Credence = OLC - 0.20 \times (OLC - RP)$
      *   *Example:* OLC 80%, RP 40%. Gap is 40 points. Move 20% of 40 (8 points). New Credence = 72%.
      *   *Rationale:* This acknowledges the HOE without treating it as dispositive. It prevents the "China Priors" overcorrection.

  ### Step 3: Flagging vs. Adjusting
  *Do not adjust if the HOE invalidates the process entirely.*

  *   **Flag as "Low Confidence" (and submit):** If Type A (Impairment) is present but you cannot sleep/wait, OR if Type B (Disagreement) is based on classified/unknown info you cannot access.
  *   **Stop Work (Do not submit):** If Type A impairment is severe (e.g., <4 hours sleep in 48hrs). No adjustment can fix broken hardware.
  *   **Adjust:** For Type B (Disagreement) and Type C (Bias) where reasoning is intact but potentially skewed.

  ### Step 4: Hard Rules vs. Judgment Calls
  *   **Hard Rule:** You must disclose Type A impairment in the "Analyst Note" field. Hiding this is a fireable offense.
  *   **Hard Rule:** You cannot move a forecast more than 25 percentage points solely due to HOE. If the HOE suggests a move larger than that, flag as Low Confidence instead.
  *   **Judgment Call:** Determining the "Reference Point" in Step 2. (Is the expert biased? Is the base rate relevant?)

  ---

  ## Case Applications

  ### Case 1: The Think Tank Disagreement (Coup Forecast)
  * **Situation:** Analyst says 70% coup. Country specialists say 20%. Analyst suspects stability bias.
  * **Protocol Run:**
      1.  **Filter:** Type B (Peer/Expert Disagreement). High Priority.
      2.  **Reference Point:** Experts say 20%. However, Analyst judges experts have "stability bias." Analyst sets RP at 35% (splitting difference between expert view and pure skepticism).
      3.  **Adjustment:** OLC 70%. RP 35%. Gap = 35 points. Move 20% (7 points). **New Credence: 63%.**
      4.  **Flagging:** No need to flag low confidence, but must add Analyst Note: *"Disagrees with [Think Tank] consensus; adjusted slightly downward to account for potential information asymmetry, but maintained high probability due to [specific object-level indicator]."*
  * **Why this works:** It respects the experts without capitulating to their potential bias. It avoids the akrasia of "I think 70% but I think I should think 20%."

  ### Case 2: The Sleep-Deprived Analyst (20 Hours Awake)
  * **Situation:** Analyst confident (85%) on a market move. Knows sleep loss degrades judgment. Direction of bias unknown.
  * **Protocol Run:**
      1.  **Filter:** Type A (Cognitive Impairment). High Priority.
      2.  **Adjustment:** **Blocked.** You cannot calculate a Reference Point because sleep deprivation adds variance, not directional bias. You don't know if you're over- or under-confident.
      3.  **Flagging:** **Mandatory Low Confidence Flag.**
      4.  **Action:** Analyst Note: *"Forecast generated after 20h wakefulness. Object-level reasoning remains [X], but cognitive impairment prevents standard confidence calibration."*
      5.  **Hard Rule Check:** If the analyst feels "foggy" rather than just "tired," **Stop Work**. Hand off to another analyst or delay if possible.
  * **Why this works:** It prevents the analyst from guessing the direction of their own error (which is a second error). It forces transparency with the client.

  ### Case 3: The Calibration Overcorrection (Central Bank)
  * **Situation:** Analyst has bad calibration score on rates. Wants to hedge all forecasts toward base rate (e.g., 50/50) despite strong object-level signals.
  * **Protocol Run:**
      1.  **Filter:** Type C (Bias/Track Record). Medium Priority.
      2.  **Adjustment:** The desire to go to 50/50 is an emotional reaction, not HOE. The HOE is "I am historically overconfident."
      3.  **Reference Point:** Base rate (e.g., 10% chance of hike).
      4.  **Hard Rule Check:** The analyst wants to move from 80% to 50% (30 point move). **Protocol Cap is 25 points.**
      5.  **Action:** Analyst must keep object-level reasoning primary. Apply the 20% shrink toward base rate. If OLC is 80% and Base is 10%, move 14 points -> 66%.
      6.  **Judgment Call:** Team Lead reviews. If the object-level reasoning is sound, the calibration score is a long-term fix, not a per-forecast penalty.
  * **Why this works:** It stops the "throwing out priors" error. It treats calibration as a tax on confidence, not a veto on reasoning.

  ---

  ## Limitations & House Policy (The "Unsettled" Stuff)

  This procedure cannot solve the underlying philosophy. We are making policy choices where the literature disagrees. Be aware of these breakpoints:

  **1. The Weighting Problem (How much is HOE worth?)**
  *   *The Dispute:* Philosophers disagree on whether HOE *defeats* your first-order evidence (you should act only on the HOE) or merely *dilutes* it.
  *   *Our Policy:* We use the **Dilution Model** (The 20% Shrink Rule). We treat HOE as a tax on confidence, not a replacement for reasoning.
  *   *Risk:* In cases where the HOE is overwhelming (e.g., you discover you were looking at the wrong dataset), the 20% rule is insufficient. **Exception:** If the HOE reveals a *factual error* in the process, revert to Step 1 and re-run the forecast. This protocol is for *uncertainty about reasoning*, not *errors in data*.

  **2. The "Steadfast" Exception**
  *   *The Dispute:* Sometimes you are right and the experts are wrong. Conciliationism (moving toward the mean) can lead to "spinelessness."
  *   *Our Policy:* If you can articulate a **specific causal mechanism** for why the experts are wrong (e.g., "They rely on public data; I have verified private channel info"), you may override the Shrink Rule. You must document this mechanism. Vague "they are biased" claims do not qualify.

  **3. Akrasia Resolution**
  *   *The Dispute:* Is it ever rational to hold a belief while thinking it's irrational? (Some say yes, in transition states).
  *   *Our Policy:* **No.** We enforce alignment. If you cannot submit the number you actually believe, you must Flag Low Confidence. We do not allow "strategic forecasting" (submitting what the client wants) or "humble forecasting" (submitting what sounds safer). The number submitted must match the analyst's genuine credence *after* HOE adjustment.

  **4. What This Can't Do**
  *   It cannot fix bad first-order analysis. If your model is wrong, HOE adjustment just makes your wrong model more moderate.
  *   It cannot replace sleep. The "Stop Work" rule is only effective if management enforces it.
  *   It cannot resolve "unknown unknowns." If you don't know *what* you don't know, HOE is invisible. This protocol only handles *identified* higher-order signals.

  **Implementation Note:**
  Print this. Keep it next to the submission terminal. For the first month, Team Lead must sign off on any HOE adjustment >10 points to ensure the "Shrink Rule" isn't being gamed.
