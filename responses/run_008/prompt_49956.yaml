answer: |-
  # Seminar Game: "The Bounded Hunt"

  **Topic:** Rational Choice, Satisficing, and Bounded Rationality
  **Duration:** 75 Minutes
  **Participants:** 14 Students (3 Groups of 4–5, plus Facilitator)
  **Goal:** To demonstrate that satisficing is a procedurally rational response to environmental constraints (costly search, unknown distributions), not merely a cognitive failure.

  ---

  ## 1. Materials & Setup

  *   **The "Environment":** 100 sealed envelopes. Inside each is a slip of paper with an integer value.
      *   *Distribution:* Uniform distribution from 1 to 100 (Facilitator knows this; students do not).
      *   *Replacement:* When an envelope is opened and rejected, the slip is returned to the pool and reshuffled (sampling with replacement). This keeps the probability static.
  *   **Scoreboards:** Whiteboard or projected sheet to track group scores.
  *   **Currency:** "Seminar Points" (SP).
      *   10 SP = 1% added to final participation grade OR a high-quality chocolate bar.
  *   **Role Cards:** Distinct instructions for each group (see below).
  *   **Timer:** Visible countdown clock.

  ## 2. Payoff Scheme

  *   **Gross Payoff:** The value of the single envelope the group decides to **keep**.
  *   **Search Cost:** 5 SP per envelope opened.
  *   **Net Payoff:** `Value of Kept Envelope - (5 × Number of Draws)`
  *   **Bankruptcy Rule:** If net score drops below zero, the group is "eliminated" (must stop drawing and take 0).
  *   **Time Limit:** 20 minutes for the search phase. If time runs out before a keep decision is made, payoff is 0.

  ## 3. Group Roles & Instructions

  Divide the 14 students into three groups. Hand out Role Cards.

  ### Group A: The Optimizers (Substantive Rationality)
  *   **Goal:** Maximize Expected Value (EV).
  *   **Instruction:** "You must derive or approximate the optimal stopping rule. You should only stop when the expected gain from another draw is less than the cost (5 SP). You do not know the distribution, but you may spend the first 5 minutes estimating it by drawing 5 'practice' envelopes (cost applies). After that, you must commit to a mathematical rule."
  *   **Constraint:** You must write down your calculated "Reservation Price" before you begin serious search.

  ### Group B: The Satisficers (Procedural Rationality)
  *   **Goal:** Achieve a "Good Enough" outcome.
  *   **Instruction:** "Do not worry about the maximum possible value. Before you draw your first envelope, agree on an **Aspiration Level** (a specific number). Your rule is simple: Keep drawing until you find an envelope equal to or higher than this number, then stop immediately."
  *   **Constraint:** You are not allowed to change this number once the search begins.

  ### Group C: The Adaptive Satisficers (Ecological Rationality)
  *   **Goal:** Adjust to the environment.
  *   **Instruction:** "Set an initial Aspiration Level jointly. However, the environment is volatile. At the **10-minute mark**, a 'Market Shock' will occur. You must pause, review your net score and the values you've seen, and vote to either raise, lower, or keep your Aspiration Level."
  *   **Constraint:** You must record the rationale for your adjustment.

  ---

  ## 4. Timeline (75 Minutes)

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | **00–10** | **Introduction** | Explain Simon's "Scissors" metaphor briefly. Distribute Role Cards. |
  | **10–15** | **Setup** | Groups huddle. Optimizers estimate distribution; Satisficers set thresholds. |
  | **15–35** | **The Hunt** | Groups draw envelopes simultaneously. Facilitator logs costs. <br>*T=25 min:* Announce "Market Shock" to Group C. |
  | **35–40** | **Settlement** | Groups calculate Net Payoff. Facilitator reveals the true distribution (Uniform 1–100). |
  | **40–75** | **Debrief** | Structured discussion (see below). |

  ---

  ## 5. The Debrief: Mapping to Simon

  Use the following flow to guide the discussion. Do not lecture; ask questions based on the game outcomes.

  ### Phase 1: The Scissors (Mind & Environment)
  *   **Ask:** "Group A (Optimizers), did you find the true maximum? Group B (Satisficers), did you hit your target?"
  *   **Concept:** Herbert Simon's **Scissors**. One blade is the cognitive capacity of the actor; the other is the structure of the environment.
  *   **Discussion Point:** If Group A failed to calculate the perfect rule, was it because they were 'irrational' or because the environment (unknown distribution + time limit) made substantive rationality impossible?
  *   **Key Takeaway:** Rationality is not a property of the mind alone; it is an interaction between mind and environment.

  ### Phase 2: Substantive vs. Procedural Rationality
  *   **Ask:** "Group B, you stopped at 82. Group A, you kept searching and stopped at 88 but paid 40 SP in costs. Who was more rational?"
  *   **Concept:** **Substantive Rationality** (choosing the best outcome given constraints) vs. **Procedural Rationality** (using a reasonable process given limits).
  *   **Discussion Point:** If Group B's net score is higher than Group A's, does that mean satisficing is *substantively* superior? Or does it mean that in this environment, the *procedure* of satisficing yields better substantive results than the *procedure* of optimizing?
  *   **Key Takeaway:** Satisficing is a heuristic that reduces search costs. It is procedurally rational because it conserves cognitive and temporal resources.

  ### Phase 3: The Normative Question
  *   **Ask:** "Group C, you changed your threshold. Did that help or hurt? If you could play again, would you commit to a threshold or stay flexible?"
  *   **Concept:** **Normative vs. Descriptive.**
  *   **Discussion Point:** Is satisficing a *verdict* on human limitation (we *can't* optimize) or a *recommendation* (we *shouldn't* optimize)?
  *   **Open Question:** Leave this unsettled. If the environment were stable and known, optimizing wins. If the environment is volatile and unknown (like this game), satisficing wins. Which environment is "real life"?

  ---

  ## 6. Predictable Failures & Analysis

  You anticipated that satisficers might outperform optimizers. Here is how to diagnose that outcome during the seminar.

  ### Scenario 1: Satisficers Win (Higher Net Payoff)
  *   **Is this a bug?** No. This is the core lesson.
  *   **Why:** The "Optimizers" faced a hidden cost: **Model Uncertainty.** To calculate the optimal reservation price, they needed to know the distribution mean/max. They didn't. They likely overestimated the max (hoping for 100) and searched too long, incurring high search costs.
  *   **The Lesson:** Optimization requires accurate environmental models. When models are costly or impossible to build, the "optimal" strategy becomes irrational. Satisficing ignores the tail of the distribution, protecting against search cost bleed.
  *   **Facilitator Note:** If this happens, highlight that the "cost of optimization" (time spent calculating + risk of model error) is a real-world cost often excluded from textbook equations.

  ### Scenario 2: Optimizers Win (Higher Net Payoff)
  *   **Why:** They got lucky with their distribution estimate, or the Satisficers set their threshold too high (e.g., 95) and ran out of time.
  *   **The Lesson:** Satisficing is not *always* better. It is robust, not superior. If the threshold is poorly calibrated, satisficing leads to mediocrity.
  *   **Facilitator Note:** Use this to discuss **Aspiration Level Adjustment**. Group C should have theoretically outperformed Group B here. If they didn't, discuss the cost of group deliberation (transaction costs).

  ### Scenario 3: Everyone Goes Bankrupt
  *   **Why:** Search cost (5 SP) is too high relative to the average draw (50).
  *   **Fix:** If this looks likely at minute 25, announce a "Subsidy": Reduce search cost to 2 SP for the remainder of the game. This simulates a change in technology or environment.

  ---

  ## 7. The Unreproducible Feature

  You suspected the limitation lies in the facilitator knowing the distribution. You are correct, but we can be more precise for the debrief.

  **The Feature:** *The Ontological Existence of Ground Truth.*

  **Explanation:**
  In this game, there is a true distribution (Uniform 1–100). At the end, I (the facilitator) can reveal it. You can look at your Aspiration Level (say, 80) and mathematically confirm whether it was "well calibrated" (e.g., "80 was in the 80th percentile, so it was a good target").

  **In Real Life:**
  There is no facilitator. There is no envelope containing the "True Maximum Possible Salary" or "True Best Partner." The distribution of life outcomes is not just unknown; it is **undefined**.
  *   **Consequence:** A real-world satisficer can never know if their aspiration level was "rational." They only know if they stopped.
  *   **Discussion Closer:** "In the game, we can judge your rationality ex-post. In your career, you will never know if the job you rejected was the one that would have made you happiest. Therefore, satisficing is not just a strategy for saving time; it is the only strategy for dealing with an unknowable future. Optimization presumes a world that exists; satisficing presumes a world that is being created."

  ---

  ## 8. Facilitator Cheat Sheet (Math for You)

  *   **Distribution:** Uniform $U[1, 100]$. Mean = 50.5.
  *   **Search Cost ($c$):** 5.
  *   **Optimal Reservation Price ($R$):**
      *   Equation: $c = \int_{R}^{100} (x - R) \frac{1}{100} dx$
      *   Simplified for Uniform: $c = \frac{(100 - R)^2}{200}$
      *   $1000 = (100 - R)^2$
      *   $\sqrt{1000} \approx 31.6$
      *   $100 - R = 31.6 \Rightarrow R \approx 68.4$
  *   **The Trap:** The optimal rule is to stop at **69**.
  *   **Expected Payoff for Optimizer:** ~68.4 (Value) - (Search Costs). Average draws to find $\ge 69$ is $100 / (100-69+1) \approx 3.1$ draws. Cost $\approx 15$. Net $\approx 53$.
  *   **Satisficer Risk:** If they set $R=90$, expected draws = $100/11 \approx 9$. Cost = 45. Net = $90 - 45 = 45$. (Optimizer wins).
  *   **Satisficer Win Condition:** If they set $R=70$, expected draws $\approx 3.3$. Cost $\approx 16$. Net $\approx 54$. (Tie/Win).
  *   **Why Satisficers Might Win:** Optimizers will likely *estimate* the max is 100 but fear they are missing out. They might aim for 85. Satisficers aiming for "Good" (70) will bank the savings on search costs.

  **Instruction to Optimizers:** Do *not* give them the formula above. Let them struggle. Their struggle *is* the bounded rationality demonstration.
