prompt: |-
  I'm taking a philosophy of math course this semester and we just spent two weeks on Gödel's incompleteness theorems, and now I keep noticing the theorems being cited everywhere outside math and I can't figure out what separates the legitimate uses from the nonsense. I made a list of claims and my gut verdicts on each, and I want to know if there's a principle behind them. So: Gödel showed that any consistent, effectively axiomatized theory strong enough for arithmetic can't prove all arithmetical truths, and can't prove its own consistency -- that one I accept as just the theorem itself. The claim that there are mathematical truths no mind or machine can ever know -- I reject that, the theorem is about what a given formal system proves, not about the limits of knowers generally. But here's where it gets messy: I also accept that we can see that the Gödel sentence for, say, PA is true, even though PA can't prove it. And someone in my seminar said that if we can see truths that the system can't prove, that's already the start of the argument that minds aren't machines -- and I reject that conclusion too, but I honestly can't say where the argument goes wrong, and I'm not sure my three verdicts here are even consistent with each other.

  Then there are the loose analogical uses. Someone in my dorm argued that since formal systems are incomplete, legal systems must be too, so judges inevitably have to decide hard cases by something other than deriving the verdict from the rules -- and weirdly I kind of shrugged and said sure, that seems fine as a thought-starter. But when a guy at a party said Gödel proved that objective truth doesn't exist and every worldview is incomplete so all perspectives are equally valid, I thought that was pure nonsense. Both are extrapolations way past arithmetic, so why am I okay with the legal one? And my physics-major friend mentioned someone using the theorems to argue that no final theory of physics can be both complete and consistent, and my gut said that's an abuse but I couldn't defend it, especially since I dimly remember that the actual proof leans on self-reference and I genuinely don't know whether a physical theory could self-reference the way PA can.

  So what I want is a principle, or a couple of candidate principles, that sorts these into proper applications and abuses -- stated precisely, with which of my verdicts each clause is supposed to save, and what it implies about cases I haven't listed (like the physics one, or the claim that no AI can be truly intelligent because it runs on a formal system, or the claim that a sufficiently powerful theory can prove its own consistency if we just add axioms). I suspect my shrugging acceptance of the legal analogy might have to go, and I'd rather hear that than get some principle that's gerrymandered to save everything. Please tell me how confident you are in each part of what you say, and point out the single claim you're least sure about. Also, no bullet points or headings or anything like that -- just continuous prose, like an email.
