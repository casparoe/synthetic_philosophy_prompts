  Rejecting (4) means accepting that your local causal reach is all you can directly influence. The 'leverage' of acausal trade vanishes. You cannot justify ignoring the drowning child to optimise for distant counterparts, because you aren't actually optimising for them separately; you are just executing the code. If the code says 'save the child', you save the child. If the code says 'ignore', you ignore. But you don't get to count the distant savings as a consequence of your choice in a way that overrides local intuition. You lose the grandiose ability to trade with the multiverse, but you regain the sanity to save the child in front of you. Your supervisor's 'large world' becomes morally silent, leaving you responsible only for the world you can touch. This is a steep price: it renders vast swathes of existence decision-theoretically inert. You surrender the hope that thinking hard enough lets you punch above your causal weight. But you avoid the absurdity where local morality is annihilated by distant shadows.
