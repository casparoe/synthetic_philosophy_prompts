answer: |-
  You are not just pattern-matching on vibes. You have independently rediscovered a core distinction in formal semantics and the philosophy of language. However, your setup *is* slightly confused in a way that explains your anxiety about "black eye" vs. "white horse." You are mixing **syntactic phrases** (computed on the fly) with **lexical compounds** (stored in memory as units).

  Here is the breakdown you asked for: the principle, the cleanup, and the verdict on Gongsun Long.

  ### 1. The Principle: Intersective vs. Privative vs. Lexicalized

  Your intuition is tracking the semantic relationship between the modifier (A) and the head noun (B). In formal semantics, we distinguish modifiers based on how they affect the **extension** (the set of things the word refers to) of the head noun.

  Here is the precise principle that captures your verdicts:

  **The Principle of Modification:**
  Let $[[B]]$ be the set of things that are B. Let $[[A B]]$ be the set of things that are A B.
  1.  **Intersective:** $[[A B]] = [[A]] \cap [[B]]$. (Every A B is a B.) $\rightarrow$ Verdict: **FALSE** ("An A B is not a B").
  2.  **Subsective:** $[[A B]] \subseteq [[B]]$, but not necessarily intersective. (Every A B is a B, but A might not apply to the object directly.) $\rightarrow$ Verdict: **FALSE**.
  3.  **Privative:** $[[A B]] \cap [[B]] = \emptyset$. (No A B is a B.) $\rightarrow$ Verdict: **TRUE**.
  4.  **Lexicalized/Idiomatic:** $[[A B]]$ is an atomic entry in the lexicon where the head B has undergone semantic shift or metaphor. $\rightarrow$ Verdict: **TRUE** (if the shift moves it out of $[[B]]$).

  **Applying this to your new test cases:**

  *   **A rubber duck:** Lexicalized/Privative. It is a toy made of rubber, not a bird. $[[Rubber Duck]] \cap [[Duck]] = \emptyset$.
      *   *Prediction:* "A rubber duck is not a duck" is **TRUE**.
  *   **A stuffed animal:** Ambiguous.
      *   *Reading A (Toy):* Lexicalized/Privative. It is fabric/stuffing. **TRUE** (not an animal).
      *   *Reading B (Taxidermy):* Intersective. It is an animal that has been stuffed. **FALSE** (it is an animal).
      *   *Usage:* Usually implies Reading A.
  *   **A gray area:** Lexicalized/Metaphorical. It refers to a situation of ambiguity, not a spatial region with color.
      *   *Prediction:* "A gray area is not an area" is **TRUE** (in the spatial sense).
  *   **An alleged criminal:** Privative (Non-subsective). "Alleged" suspends the truth of the head noun. An alleged criminal may turn out to be innocent.
      *   *Prediction:* "An alleged criminal is not a criminal" is **TRUE** (or at least, the predicate 'criminal' does not yet apply).

  ### 2. The Cleanup: Which Verdicts to Drop

  You asked for honesty about which verdicts don't fit and should be discarded. Your "black eye" anxiety comes from treating a lexicalized compound as if it were a syntactic phrase.

  **Verdicts to Drop/Revise:**

  1.  **"A heavy smoker is not heavy."**
      *   *Drop this.* It is a category error in your list. This is **event modification**, not individual modification. "Heavy" modifies the *smoking* (the event), not the *smoker* (the individual). It doesn't test the "A B is not a B" structure because the adjective isn't attaching to the noun in the same way.
  2.  **"An old friend is not (necessarily) old."**
      *   *Refine this.* This is a **Subsective** case, but "old" modifies the *friendship*, not the *person*. It behaves like "heavy smoker." If you mean "an aged friend," then "An old friend is not old" is **FALSE**. If you mean "friend of long standing," the sentence is TRUE, but again, the adjective isn't modifying the noun's core extension in the standard way. It's a "relational" adjective.
  3.  **"A black eye is not an eye."**
      *   *Keep this, but reclassify.* Your sweat comes from thinking "black eye" and "white horse" are the same grammatical animal. They aren't.
      *   "White horse" is **compositional**. You can have a white horse, a red horse, a spotted horse. The language generates this on the fly.
      *   "Black eye" is **lexicalized**. You cannot have a "blue eye" (in the bruise sense) or a "green eye" (in the bruise sense). It is a stored unit in the mental dictionary where "eye" means "region surrounding the eye."
      *   *Principle:* The distinction is not "idiom vs. not idiom" (which feels fuzzy); it is **Syntax vs. Lexicon**. If you can vary the color and keep the meaning (white horse, brown horse), it's Syntax (Intersective). If varying the color breaks the meaning (blue eye $\neq$ bruise), it's Lexicon (Lexicalized).
      *   *Verdict:* Gongsun Long is trying to treat "White Horse" as Lexicalized. You are treating it as Syntactic. You are right about modern English; he is making a claim about Classical Chinese naming.

  ### 3. The Philosophy: Was Gongsun Long Confused?

  Given the semantic principle above, here is the verdict on the *White Horse Dialogue*.

  **The Standard View (He is confused):**
  In modern model-theoretic semantics, the extension of "White Horse" is a **subset** of the extension of "Horse." Therefore, every white horse *is* a horse. To say "A white horse is not a horse" is to confuse **identity of concepts** with **membership in a set**.
  *   Concept(White Horse) $\neq$ Concept(Horse). (True)
  *   Extension(White Horse) $\not\subseteq$ Extension(Horse). (False)
  Gongsun Long argues the first point to prove the second. This is a fallacy of equivocation.

  **The Charitable View (He is a Semantic Realist):**
  There is a serious reading where Gongsun Long is not making a mistake about objects, but a point about **reference and demand** (which matches your "if you ask for a horse..." intuition).
  *   **The Argument:** Terms are tools for picking out things. If I say "I want a horse," you can bring me a yellow one. If I say "I want a white horse," you cannot. Therefore, the term "White Horse" has different **conditions of satisfaction** than "Horse."
  *   **The Point:** If two terms have different conditions of satisfaction, they are not the same term. In Classical Chinese, *fei* (not) can mean "is not equivalent to" rather than "is not a member of."
  *   **Is he right?** He is right that the *names* are not interchangeable. He is wrong (or being sophistical) if he implies the *object* (the white horse) does not belong to the class of horses.

  **The Lexicalization Hypothesis (Your "Seahorse" hunch):**
  You asked: *Was he claiming that white-horse functioned as a unit name for a single kind, the way seahorse does for me?*
  *   **Linguistic Evidence:** Probably not. In other Warring States texts, "white horse" behaves compositionally. You can talk about "yellow horses" and "black horses" freely. It wasn't lexicalized like "seahorse."
  *   **Philosophical Motive:** However, he *wanted* it to be lexicalized. The School of Names (Ming Jia) was obsessed with the **Rectification of Names**. They believed that if names are not precise, social order collapses. By arguing "White Horse is not Horse," he is forcing a distinction between a specific kind (White Horse) and a general kind (Horse) to show that **specificity matters**.
  *   **Verdict:** He isn't arguing semantics; he's arguing metaphysics/politics. He is claiming that "White Horse" picks out a distinct *reality* (a *shi*) that is not identical to the reality of "Horse."

  ### 4. The "Confused Setup" Check

  You asked me to be plain if your setup is incoherent. Here is the plain truth:

  **You are mixing three layers:**
  1.  **Syntax:** "White horse" (Adjective + Noun phrase).
  2.  **Lexicon:** "Seahorse," "Black eye" (Compound nouns stored as atoms).
  3.  **Translation:** Classical Chinese *shi/fei* (is/is not) vs. English copula.

  **Why this matters:**
  Your intuition that "White horse is not a horse" is FALSE relies on English syntax where adjectives are intersective modifiers. Gongsun Long's argument relies on Classical Chinese where nouns can function as predicates and *fei* denies identity or class membership ambiguously.

  **The "Black Eye" Problem:**
  You worried that "black eye" vs. "white horse" was just "idiom vs. not." In linguistics, that **is** a principle. It is the distinction between **Free Combination** and **Lexical Integrity**.
  *   *Free Combination:* Meaning is computed from parts (White + Horse).
  *   *Lexical Integrity:* Meaning is stored as a whole (Black Eye).
  Your intuition is correct: "Black eye" is stored as a whole. "White horse" is computed. Gongsun Long is trying to argue that "White Horse" *should* be treated as Lexical Integrity (a specific Kind) rather than Free Combination (a subset).

  **Final Recommendation:**
  Don't drop the "Black Eye" verdict. It is the key. It shows you understand that language sometimes creates new categories (Seahorse, Black Eye) that break the rules of the head noun. Gongsun Long is trying to convince you that "White Horse" is one of those categories. You are resisting because in your language, it isn't.
  *   **In English:** "White horse" is Intersective. (Verdict: FALSE that it's not a horse).
  *   **In Gongsun Long's Metaphysics:** "White Horse" is a distinct Kind. (Verdict: TRUE that it's not [identical to] horse).

  He isn't confused about logic; he is making a stipulative claim about how we ought to carve up reality. You are right to reject it as a description of English semantics, but you should acknowledge it as a coherent (if aggressive) metaphysical stance.
