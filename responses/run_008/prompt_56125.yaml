prompt: |-
  I've been reading the decision-theory threads on rationalist blogs and forums for well over a decade now, and I'd long thought of myself as broadly sympathetic to updateless decision theory: it seemed obvious to me that an agent who can foresee that its later, updated self will refuse to pay in the counterfactual mugging is foreseeing its own predictable loss, and that a rational design would avoid that. But a long argument I recently witnessed between two people whose judgment I respect has left me unsure, and I'd like a careful referee.

  To set up their exchange: both parties accept the standard motivation. In the counterfactual mugging, Omega flips a fair coin before you exist. If it lands heads, Omega gives you $10,000 and you never hear anything more. If it lands tails, Omega appears and asks you for $100. An updating expected-utility maximizer who has seen the tails outcome refuses to pay. An updateless agent, which chooses a policy before conditioning on observations, pays -- ex ante the paying policy nets about $4,950, and the agent's refusal to pay was predictable and, by its own earlier lights, a mistake. Fine so far. The argument was about how much follows from this.

  The exchange, as best I can reconstruct it:

  (1) Dev, the updatelessness defender, said the counterfactual mugging generalizes: any agent whose decisions depend on which branch of a prediction or a random process it finds itself in is reflectively inconsistent, in the sense that its earlier self would pay to redesign its later self. Updatelessness isn't a quirky fix for a puzzle case; it's what consistency requires, the same way avoiding dominated strategies is required. An agent that updates and then decides is one that can be predicted to leave value on the table, and predictably leaving value on the table is as close to a formal definition of irrationality as we have.

  (2) Sasha replied that reflective consistency is cheap: a rock is perfectly reflectively consistent, and so is an agent with a fixed, stupid policy. If consistency plus ex ante optimality relative to some prior is all the theory offers, then all the real work is being done by the prior -- which prior, held at which point in the agent's history, policies are averaged over. On that question, she said, updateless decision theory is a schema with a blank in it, not a theory. Calling the filled-in schema "the right decision theory" just renames the hard problem of choosing the blank.

  (3) Dev answered that the blank is not arbitrary: the natural stopping point is the agent's epistemic position before it learned anything that it could have precommitted about. You take the policy that's optimal by the lights of the agent's earliest reasonable epistemic state, and that's a principled answer, not a dodge.

  (4) Sasha said this is where the view runs off the rails, because there is no such stopping point once you take logical uncertainty seriously. Her example: run the mugging again, but replace the coin with a digit of pi that Omega consults -- say, whether the trillionth digit is even -- and suppose the agent, before facing Omega, has already computed that it's odd. The "updateless" agent is now supposed to average its welfare over mathematical possibilities it has already computed away, which means acting as though it doesn't know a mathematical fact it plainly knows. And the known evasions are worse: designing the agent so it can't know what it will decide, or having it refuse to compute certain things, either makes the theory unimplementable for agents that must model their own decision or turns updatelessness into a crude and possibly self-defeating regime of self-imposed ignorance. Her conclusion: the observation-based version of updatelessness is fine but shallow, and the logical version -- the one that was supposed to matter for agents in a deterministic universe -- is either incoherent or insane.

  (5) Dev's final move was to bite the bullet, or most of it: yes, a well-designed agent will sometimes be built to not know things, or to act on policies chosen before it knows them, and that's not a bug. We accept structurally similar trade-offs whenever we bind ourselves -- a constitution, a promise, a prearranged inherit -- sorry, a prearranged inheritance arrangement is not self-defeating because it constrains a later self who knows more. The regress Sasha complains about is real but bounded: it bottoms out in the agent's design stage, where the averaging-over-uncertainty happens once, over everything the designer can't cheaply determine in advance.

  They were talking past each other by the end, and I genuinely couldn't tell. Please adjudicate the five moves in order: for each, say whether the speaker is right, partly right, or clearly mistaken, and why. Then, separately, tell me what you make of the two live issues underneath the exchange: whether Sasha's schema-with-a-blank objection really undermines updatelessness or just relocates the hard problem to prior choice (which may be where it was all along), and whether Dev's bullet on self-ignorance about logical facts is worth biting or is the reductio it looks like. And if both of them are missing something -- some consideration about, say, commitment races, or exploitability of updateless agents by adversaries who know their code -- I'd want to hear that too. Finally, given all this, would you tell someone like me, who wanted a settled view, that updatelessness is basically right with a loose end about priors, or basically a promissory note whose main content is still owed?
reasoning: |-
  Here's a thinking process that leads to the suggested adjudication:

  1.  **Analyze the Request:**
      *   **Context:** The user is a long-time reader of rationalist decision theory (DT) forums/blogs, previously sympathetic to Updateless Decision Theory (UDT), now unsure after witnessing a debate between "Dev" (UDT defender) and "Sasha" (UDT critic).
      *   **Task:**
          1.  Adjudicate the five moves in the exchange (Right/Partly Right/Mistaken + Why).
          2.  Address two live issues: (a) Does Sasha's "schema-with-a-blank" objection undermine UDT or just relocate the problem? (b) Is Dev's bullet on self-ignorance/logical uncertainty worth biting?
          3.  Identify missing considerations (commitment races, adversarial exploitability, etc.).
          4.  Provide a final verdict/recommendation for the user (Settled view vs. Promissory note).
      *   **Tone:** Careful, referee-like, philosophically precise, acknowledging the nuance of the field (LW/lesswrong style).

  2.  **Deconstruct the Debate Moves:**

      *   **Move 1 (Dev): Generalization & Reflective Inconsistency.**
          *   *Claim:* Counterfactual Mugging (CM) generalizes. Updating agents are reflectively inconsistent (earlier self pays to change later self). Predictable loss = irrationality.
          *   *Analysis:* This is the standard UDT motivation. It's strong for *predictable* losses in Newcomb-like problems. However, "any agent whose decisions depend on which branch..." is a bit too strong. Causal Decision Theory (CDT) agents update, but aren't always reflectively inconsistent in *all* scenarios, just specific ones involving prediction/logical correlation. The definition of irrationality as "predictably leaving value" is standard but contested (e.g., by evidentialists).
          *   *Verdict:* Partly Right. The core intuition is solid, but the generalization is slightly overstated, and "irrationality" definitions are debated.

      *   **Move 2 (Sasha): Reflective Consistency is Cheap / The Prior Problem.**
          *   *Claim:* A rock is consistent. Consistency + Ex Ante Optimality depends entirely on the *prior*. UDT is a schema with a blank.
          *   *Analysis:* This is a powerful critique. UDT maximizes expected utility relative to a *prior*. If the prior is bad, the policy is bad. "Reflective consistency" alone doesn't pick a unique policy without a prior. The "rock" analogy is a bit glib (rocks don't maximize utility), but the point about the prior doing the heavy lifting is accurate.
          *   *Verdict:* Right. This identifies the core technical gap in UDT formulations.

      *   **Move 3 (Dev): The "Earliest Reasonable Epistemic State" Stopping Point.**
          *   *Claim:* The blank isn't arbitrary. Stop at the agent's epistemic position before learning precommitment-relevant info.
          *   *Analysis:* This is the standard "Veil of Ignorance" move. It works for empirical uncertainty (coin flips before existence). It gets murky with logical uncertainty. It's principled *if* you can define that state clearly.
          *   *Verdict:* Partly Right. It's the best available answer, but "reasonable epistemic state" is vague, especially regarding logical facts.

      *   **Move 4 (Sasha): Logical Uncertainty & The Regress.**
          *   *Claim:* No stopping point with logical uncertainty. If you know the digit of Pi, UDT asks you to act as if you don't. Evasions (self-ignorance) are unimplementable or self-defeating.
          *   *Analysis:* This is the "Logical UDT" problem. It remains unsolved. If the agent knows the outcome, the counterfactual "what if the coin landed differently" becomes "what if 2+2=5". Standard probability theory breaks. Asking an agent to ignore known logical facts is indeed problematic (the "5 and 10" problem in some formulations).
          *   *Verdict:* Right. This is the strongest objection. Logical UDT is not fully formalized.

      *   **Move 5 (Dev): Biting the Bullet (Constitutional/Precommitment Analogy).**
          *   *Claim:* Agents *should* sometimes be built not to know things. Analogous to constitutions/promises. Regress bottoms out at design stage.
          *   *Analysis:* This conflates *strategic* ignorance (hiding info from adversaries) with *logical* ignorance (ignoring math). Constitutions bind future preferences/actions, not future *knowledge*. Ignoring known math to satisfy a prior is distinct from binding future actions. It risks "wishful thinking" as a policy.
          *   *Verdict:* Partly Right/Mistaken. The analogy is weak. Design-stage optimization is correct, but "acting as though you don't know math" is a category error in most decision theories.

  3.  **Address the Live Issues:**

      *   **Issue 1: Schema-with-a-blank (The Prior).**
          *   Does it undermine UDT? It shows UDT isn't a *complete* theory of rationality without a theory of priors. It relocates the problem. Is that fatal? Not necessarily, but it means UDT isn't the "final answer" on its own. It needs a companion theory of "Universal Priors" or "Indifference."
      *   **Issue 2: Self-Ignorance/Logical Facts.**
          *   Is it worth biting? Most researchers think no. The goal is to make decisions *given* what you know, not to pretend you don't know. The solution likely involves "logical counterfactuals" (what if the proof didn't exist?), not "ignore the proof." Dev's bullet is too strong.

  4.  **Identify Missing Considerations:**
      *   **Commitment Races:** If everyone is UDT, who precommits first? (Heller's problem).
      *   **Adversarial Exploitability:** If an adversary knows your prior/policy, can they pump you? (The "Pascal's Mugging" variant).
      *   **Computational Irreducibility:** You can't always compute the policy at the design stage.
      *   **Ambient Control / Acausal Trade:** UDT is crucial for acausal trade, which Sasha didn't mention.

  5.  **Final Verdict for the User:**
      *   Is it settled? No.
      *   Is it a promissory note? Yes, specifically regarding logical uncertainty and priors.
      *   Recommendation: Sympathy is warranted, but dogmatism is not. It's the best framework we have for acausal situations, but it's incomplete.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone Check:* Ensure I sound like a knowledgeable peer, not a textbook. Use terms like "reflective consistency," "logical counterfactuals," "prior optimization."
      *   *Structure:* Follow the prompt's structure (5 moves, 2 issues, missing considerations, final verdict).
      *   *Refining Move 1:* Dev is right about the *motivation*, but "any agent" is too broad. CDT agents aren't always inconsistent.
      *   *Refining Move 4:* Sasha is hitting on the "5 and 10" problem / Troll Bridge. This is the crux of modern DT research (MIRI/AF).
      *   *Refining Move 5:* Dev's analogy to constitutions is about *binding actions*, not *binding epistemic states*. This is a crucial distinction.
      *   *Refining the "Prior" issue:* This connects to the "Indifference Principle" problem.
      *   *Refining the "Logical" issue:* Connect to Functional Decision Theory (FDT) and Logical Induction.

  7.  **Final Polish:** Check against the user's specific request ("adjudicate... right, partly right, or clearly mistaken"). Make sure the conclusion answers "settled view" vs "promissory note."

      *(Self-Correction during drafting)*: I need to be careful not to take sides too heavily. The field is genuinely unresolved. I should acknowledge that Dev represents the "MIRI/UDT" stance and Sasha represents the "Academic/Objection" stance, but both have valid points. The "Logical Uncertainty" point is the real killer for UDT in its original form, leading to FDT and later attempts. I should mention that evolution of the theory.

      *Wait, one nuance:* Dev's Move 5 says "designed... to not know things." This is actually a valid strategy in game theory (e.g., not knowing the location of the treasure so you can't be tortured for it). But applying it to *logical* facts (digits of pi) is the contentious part. I need to distinguish strategic ignorance from logical ignorance.

      *Another nuance:* Sasha's "rock" argument. A rock doesn't have a utility function. A better analogy is a "fixed action agent." I should note that distinction.

      *Final check on the "Promissory Note" conclusion:* It's important to validate the user's decade-long sympathy. UDT *is* directionally correct for acausal problems, even if the formalism is incomplete.

      *Let's write.*
answer: |-
  This is an exceptionally clear reconstruction of a debate that cuts to the bone of modern decision theory research. You are asking for an adjudication of a dispute that mirrors the actual state of the field: the tension between the *normative appeal* of updatelessness (Dev) and the *formal/implementation hurdles* regarding priors and logic (Sasha).

  Here is my adjudication of the five moves, followed by an analysis of the underlying issues and a final verdict for your own epistemic state.

  ### Adjudication of the Five Moves

  **(1) Dev: Generalization & Reflective Inconsistency**
  **Verdict: Partly Right.**
  Dev is correct that the Counterfactual Mugging is not an isolated quirk; it is an instance of a broader class of problems (Newcomblike problems) where causal dependence and logical correlation come apart. In these specific contexts, an updating agent is reflectively inconsistent: its earlier self would pay to modify its later self.
  *However*, Dev overstates the case by implying *any* dependence on branch-location is inconsistent. Standard Bayesian updating is reflectively consistent in purely causal environments. Furthermore, defining irrationality solely as "predictably leaving value on the table" is the *conclusion* of UDT, not a neutral premise. Evidentialists and Causalists have competing definitions of "value" and "predictability." Dev is right about the *phenomenon* but slightly dogmatic about the *definition*.

  **(2) Sasha: Reflective Consistency is Cheap / The Prior Problem**
  **Verdict: Right.**
  This is the strongest technical objection in the exchange. "Reflective consistency" is a constraint, not an objective function. As Sasha notes, a maximizer of *anything* (even paperclips, or a rock that does nothing) is consistent with itself. To get a *normative* theory, you need to specify *what* is being maximized relative to *which* probability distribution. UDT says "maximize expected utility relative to the prior," but if the prior is arbitrary, the theory is empty. Sasha correctly identifies that UDT shifts the burden of rationality from the *decision rule* to the *prior selection*.

  **(3) Dev: The "Earliest Reasonable Epistemic State" Stopping Point**
  **Verdict: Partly Right.**
  Dev attempts to fill Sasha's blank with a "Veil of Ignorance" principle: optimize from the earliest state before specific, precommitment-relevant information is learned. For empirical uncertainty (the coin flip before existence), this is principled and widely accepted.
  *However*, the phrase "reasonable epistemic state" does significant, unargued work. In a deterministic universe, or one where the agent has access to its own source code, the "earliest state" is ill-defined. Dev is offering a heuristic that works for simple thought experiments but lacks a formal definition for general agents.

  **(4) Sasha: Logical Uncertainty & The Regress**
  **Verdict: Right.**
  This is the "Logical UDT" problem, and it remains the primary open problem in the field. If the coin flip is replaced by a logical fact (the trillionth digit of Pi) that the agent *already knows*, standard UDT breaks. It requires the agent to compute expected utility over logical possibilities it has already ruled out (e.g., "What if 2+2=5?").
  Sasha is correct that the standard evasions are unsatisfactory. Designing an agent to remain ignorant of logical facts it could easily compute is computationally inefficient and potentially dangerous (you don't want your agent unable to deduce that a bridge is unsafe). This move correctly identifies that empirical updatelessness does not automatically generalize to logical updatelessness.

  **(5) Dev: Biting the Bullet (Constitutional Analogy)**
  **Verdict: Mistaken (mostly).**
  Dev tries to normalize logical ignorance by comparing it to strategic ignorance (constitutions, promises). This is a category error. A constitution binds your future *actions* despite your future *preferences*; it does not require you to bind your future *knowledge*.
  Strategic ignorance (e.g., not learning a combination so you cannot be tortured for it) is rational because the information itself is dangerous. Logical ignorance (pretending you don't know the digit of Pi) is not strategically useful in the same way; it severs the link between truth and action. While Dev is right that the regress bottoms out at the design stage, the claim that the design stage should optimize over *known logical falsehoods* is incoherent in standard probability theory. You cannot condition on a known falsehood without exploding your probability distribution.

  ---

  ### Analysis of the Two Live Issues

  **1. Does Sasha's "Schema-with-a-Blank" objection undermine UDT?**
  It does not undermine the *insight*, but it does undermine the claim that UDT is a *complete* theory. Sasha is right that the hard problem is relocated to prior choice.
  *   **The Relocation:** In Causal Decision Theory (CDT), the hard problem is "how to define causation." In UDT, the hard problem is "how to define the universal prior over logical possibilities."
  *   **Is this fatal?** No. All decision theories rely on a prior. The virtue of UDT is that it isolates the prior problem from the decision-rule problem. It says: "Once you agree on the prior, *this* is how you must act to be consistent."
  *   **The Catch:** If the "correct prior" is just as mysterious as the "correct decision rule," UDT hasn't solved as much as it hoped. Current research (e.g., Logical Induction) attempts to fill this blank, but we do not yet have a unique, universally accepted "rational prior." So, Sasha is right that UDT is currently a schema, but wrong to imply this makes it useless. It is a useful schema that clarifies *where* the remaining work lies.

  **2. Is Dev's bullet on self-ignorance about logical facts worth biting?**
  No. Dev is biting the wrong bullet.
  *   **The Distinction:** The goal of Updatelessness is not to *ignore* information, but to *not let information screen off* logical correlations.
  *   **The Better View:** The solution isn't "act as if you don't know the digit of Pi." The solution is to develop a theory of **logical counterfactuals**. You need a formalism that allows you to ask, "What would happen if the output of this computation were different?" even if you know what the output is.
  *   **Why Dev is wrong here:** Dev frames it as "self-imposed ignorance." This suggests the agent should delete knowledge. The modern consensus (among UDT sympathizers) is that the agent should keep the knowledge but use a non-standard logic to evaluate counterfactuals. Dev's formulation makes UDT sound like anti-epistemology. It isn't; it's hyper-epistemology that treats logical facts as variables in a causal graph.

  ---

  ### Missing Considerations

  Both Debaters missed two critical dynamics that complicate the picture further:

  1.  **Commitment Races:** If multiple UDT agents interact, they may race to precommit to aggressive policies to force the other to yield. If I know you are updateless, I can precommit to "Demand $1000 or I destroy the pot," knowing you will pay to satisfy your prior. If we both do this, we crash. Updatelessness solves the Counterfactual Mugging but potentially creates a "Game of Chicken" in multi-agent scenarios. A complete theory must handle *when* to be updateless and when to allow updating to facilitate negotiation.
  2.  **Adversarial Priors (Pascal's Mugging):** If your prior assigns non-zero probability to high-stakes, low-probability scenarios (e.g., a matrix lord threatening 3^^^3 units of disutility), an updateless agent can be pumped for infinite value. Sasha's point about the prior being a "blank" is dangerous here: if the blank is filled by a standard Solomonoff prior, the agent is vulnerable to mugging. The "prior problem" is not just philosophical; it is a security vulnerability.

  ---

  ### Final Verdict: Settled View or Promissory Note?

  You asked if you should view updatelessness as "basically right with a loose end" or "a promissory note whose main content is still owed."

  **It is a Promissory Note.**

  Here is why:
  Your decade-long sympathy was well-placed. Dev is right about the *direction*. In a universe containing predictors, simulations, or acausal trade (which our universe likely is, given the nature of computation and physics), Causal Decision Theory is demonstrably suboptimal. An agent that refuses to pay the Counterfactual Mugger is leaving value on the table in a way that feels like a bug, not a feature.

  However, Sasha is right that the *implementation* is not ready for prime time.
  *   **Logical UDT is unsolved.** We do not yet have a rigorous mathematical definition of "logical counterfactuals" that avoids the paradoxes Sasha mentioned.
  *   **The Prior is unresolved.** We do not have a unique, objective prior that prevents mugging while allowing for acausal trade.

  **Recommendation:**
  Maintain your sympathy for the *normative intuition* of updatelessness (that agents should optimize policies, not just actions, and should respect logical correlations). But abandon the idea that UDT is a finished product you can simply "install."

  Think of UDT not as a specific algorithm, but as a **research program**. It has correctly identified the flaws in Causal and Evidential Decision Theory, but it has not yet fully constructed the replacement engine. If you adopt it now, you are adopting a framework that tells you *what* you want (reflective consistency over logical correlations) without fully telling you *how* to compute it in complex, logical environments.

  **The Referee's Ruling:** Dev wins on the *ethics* of rationality (you should want to be the kind of agent that pays). Sasha wins on the *math* of rationality (we don't know how to build that agent yet). Your uncertainty is the rational state to be in.
