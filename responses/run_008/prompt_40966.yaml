      *   **Case B (CBDC):** Fits (3), (4), (5) (state-issued, prevents hoarding via expiry, sovereign control). Potentially conflicts with (2) if forced, but Berkeley emphasizes *industry*.
      *   **Case C (Monetary Union):** Fits (2) (shared use), but violates (3) and (5) (loss of national control over issue, dependence on abroad).

  4.  **Determine the Implicit Rule:**
      *   *Conventionality Rule:* Money is whatever people agree is money. (Supports Bitcoin).
      *   *Instrumental Rule:* Money is a tool for national industry and welfare. (Supports CBDC, condemns Bitcoin/Monetary Union if they hinder industry).
      *   *Berkeley's Stance:* Berkeley is clearly an *instrumentalist*. He cares about money *because* it stimulates industry. Verdict (3) is key: money should keep the poor at industry. Verdict (5) reinforces national sovereignty for this purpose. Verdict (1) and (2) explain *how* money works, not *why* it should exist.
      *   *Load-bearing Verdict:* Verdict (3) is the teleological core. Money exists to stimulate industry.

  5.  **Address the Divergence on Case B (CBDC):**
