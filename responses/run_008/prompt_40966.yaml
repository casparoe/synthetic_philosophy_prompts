      *   *Refinement:* The prompt asks if they diverge on B or if a further case separates them. CBDC *compelling* circulation fits Instrumentalism perfectly. Conventionality might resist "forced" money. But a better separator is **foreign currency substitution (dollarization)**. People accept it (Conventionality says OK), but it violates national control/industry (Instrumentalism says No).

