          *   Book: Says this pattern cannot be squared with EUT.
          *   Fact Check: True. EUT requires Subjective Expected Utility (SEU) Savage axioms. If you prefer Known-Red to Unknown-Red, SEU implies you must prefer Unknown-Black to Known-Black (assuming you assign some subjective probability $p$ to Unknown-Red). The observed preference contradicts this.
