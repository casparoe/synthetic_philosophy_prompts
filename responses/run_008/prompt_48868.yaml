              *   *Standard View (Savage):* Yes, SEU is rational; Ellsberg preferences are irrational.
              *   *Modern View:* Highly debated. Many decision theorists argue ambiguity aversion is *reasonable* (information asymmetry, adverse selection, model uncertainty). Maxmin Expected Utility (Gilboa & Schmeidler) was designed as a *normative* alternative, not just a descriptive fix for a bias. It posits different axioms (Certainty Independence) that allow for ambiguity aversion as rational.
              *   *Status:* Not settled. It's a foundational schism in decision theory.
          *   Verdict: Overstatement/Conflation. Presents a contested normative debate as settled fact.

