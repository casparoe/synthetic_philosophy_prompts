      *   *Claim 3: The Specific Axiom Violated.*
          *   Book: Says it violates "Independence," which says "if you prefer betting on red from the known urn you must prefer betting on black from it too, since the two bets have the same odds."
          *   Fact Check: This is the tricky part. In the context of *risk* (von Neumann-Morgenstern), it's the Independence Axiom. In the context of *uncertainty/ambiguity* (Savage), it's the **Sure-Thing Principle** (Savage's P2). The book's *description* of the axiom ("if you prefer red... you must prefer black... since same odds") is a bit garbled. It sounds like it's confusing the *consequence* of the violation with the *definition* of the axiom. The Sure-Thing Principle is about common consequences across states, not just "same odds."
