          *   Book: Regulators should nudge people back to known odds, require point estimates rather than ranges.
          *   Fact Check: If ambiguity aversion is a bias, this makes sense. If ambiguity aversion is a rational response to model uncertainty or potential deception, forcing point estimates creates *false precision* and hides risk.
