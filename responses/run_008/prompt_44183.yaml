prompt: |-
  My friend is a hardcore nominalist about math, and every time platonism comes up he ends the conversation with the same line: "nobody has ever bumped into the number seven." Last week he used it to wave off the claim that we know arithmetic as well as we know anything at all, and I just grumbled instead of pushing back. Help me take the one-liner apart. What distinct precise claims could "you can't causally interact with numbers" actually be making — anywhere from the trivial (obviously I've never high-fived a seven) to the substantive? For each reading, tell me whether it's a platitude, whether it's contentious, and, crucially, whether it actually supports what he uses it for: not just that platonism has an epistemological puzzle to solve, but that we shouldn't believe in numbers at all. Then tell me which reading he'd actually be committed to if I forced him to be precise — and whether that reading gets him his conclusion on its own, or whether it needs extra premises (say, a causal theory of knowledge or of reference) that are more controversial than platonism itself. Lay it out as a list I can literally read to him over coffee.
