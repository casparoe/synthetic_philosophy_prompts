answer: |-
  Here is a breakdown you can read to him over coffee. It dissects his one-liner into four distinct claims, ranging from the harmless to the highly controversial, and exposes the hidden machinery required to make his argument work.

  ***

  ### The "Bumping Into Seven" Breakdown

  Your friend's line is a catchy shorthand for **Paul Benacerraf's Epistemological Problem** (1973). But he is using it to do two different jobs at once: (1) pointing out a puzzle for Platonists, and (2) proving Platonism false. To see if he succeeds, we have to separate what the sentence *says* from what it *implies*.

  Here are the four distinct claims hidden inside "nobody has ever bumped into the number seven."

  #### 1. The Literal Claim: "Numbers are not physical objects."
  *   **What it means:** You cannot trip over a number, put it in a box, or measure its weight. It is not a concrete particular like a rock or a neuron.
  *   **Is it a platitude?** **Yes.** Every Platonist agrees with this. In fact, that is the definition of a "Platonic object." They are abstract, not concrete.
  *   **Does it support his conclusion?** **No.** Pointing out that numbers aren't rocks doesn't prove they don't exist. It just proves they aren't physical. If his argument is "Numbers aren't physical, therefore numbers don't exist," he is assuming **Physicalism** (only physical things exist), which is a massive, unproven philosophical assumption.

  #### 2. The Metaphysical Claim: "Numbers are causally inert."
  *   **What it means:** The number 7 does not cause anything to happen. It doesn't push atoms, fire neurons, or alter the trajectory of billiard balls.
  *   **Is it a platitude?** **Mostly.** Most Platonists accept that abstract objects do not enter into cause-and-effect relationships with the physical world.
  *   **Does it support his conclusion?** **Not on its own.** This establishes a *difference* between numbers and chairs, but not non-existence. Electrons are also never "bumped into" directly (we infer them), and some argue they are causally inert in certain frameworks. Inertness makes an object hard to explain, but not impossible.

  #### 3. The Epistemological Claim: "Knowledge requires causal interaction."
  *   **What it means:** This is the heavy lifter. This claims that for you to *know* something exists (or know truths about it), you must be able to causally interact with it. If there is no causal link between you and the object, there is no knowledge.
  *   **Is it a platitude?** **No.** This is the **Causal Theory of Knowledge (CTK)**. It is highly contentious.
  *   **Does it support his conclusion?** **Yes, but at a high cost.** If CTK is true, and numbers are causally inert (Claim 2), then we cannot know arithmetic. But we *do* know arithmetic (2+2=4).
      *   *The Trap:* To save his nominalism, he must deny we have mathematical knowledge (skepticism), OR he must deny Platonism. But most philosophers reject CTK because it also rules out knowledge of logic, sets, counterfactuals, and possibly the future. It is widely considered too restrictive.

  #### 4. The Ontological Claim: "If it's outside the causal web, it isn't real."
  *   **What it means:** This is a methodological rule: Our ontology (list of things that exist) should only include things that play a role in the causal structure of the universe (Scientific Naturalism).
  *   **Is it a platitude?** **No.** This is a philosophical preference, not a fact.
  *   **Does it support his conclusion?** **Yes.** If you define "real" as "causally active," then by definition, numbers aren't real.
  *   **The Catch:** This is begging the question. It defines existence in a way that excludes Platonism by fiat. It's like saying, "I only believe in things that fit in my pocket; therefore, mountains don't exist."

  ***

  ### The Verdict: What He Is Actually Committed To

  If you force him to be precise, your friend is not actually resting his case on the fact that we can't "bump" into numbers. He is resting it on **Claim #3: The Causal Theory of Knowledge.**

  He is arguing:
  1.  Platonism says numbers are causally inert.
  2.  **Hidden Premise:** We can only know things we causally interact with.
  3.  Therefore, we cannot know numbers (if Platonism is true).
  4.  Since we *do* know arithmetic, Platonism must be false.

  **Here is the problem you can put to him:**
  That **Hidden Premise (#2)** is far more controversial than Platonism itself.

  *   **It's empirically false:** We have knowledge of things we don't causally interact with (e.g., we know truths about the distant past, or counterfactuals like "if I dropped this cup, it would break," neither of which we are currently causally interacting with).
  *   **It's self-defeating:** Does he causally interact with the *laws of logic* he is using to make this argument? If not, by his own standard, he doesn't know his argument is valid.

  ### The Coffee-Shop Closing Line

  Tell him this:

  > "You're right that Platonists have to explain how we access abstract objects. But your one-liner only works if you assume that **causal contact is the only way to know anything.** That's a huge philosophical assumption. You're trading the 'mystery' of Platonism for the 'skepticism' of your own epistemology. You haven't proven numbers don't exist; you've just proven you require a specific, controversial theory of knowledge that most philosophers rejected decades ago."
