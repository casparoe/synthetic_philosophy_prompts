answer: |-
  Your hunch is mostly right that cross-cultural psychology reifies ideology into a free-floating cause, but the residue you're looking for exposes exactly where historical materialism often gets too economistic to explain why superstructures stick around after the base changes.

  Here's the translation of those psychological constructs into your historical materialist vocabulary, piece by piece.

  **The Independent Self-Construal**
  In your framework, this is the **bourgeois legal subject** required for generalized commodity production. For a labor market to function, workers must be "free" in a double sense: free to sell their labor power and free from ownership of the means of production. This requires an ideology of atomization where individuals see themselves as distinct owners of their own capacity to work. When Markus and Kitayama talk about internal attributes defining the self, you read that as the psychological internalization of the contract form. It's not just a mindset; it's the subjective correlate to the wage relation.

  **The Interdependent Self**
  This translates as **ideological remnants of pre-capitalist relations repurposed for capitalist discipline**. In many East Asian contexts, rapid industrialization didn't wipe out feudal or patriarchal social forms; it subsumed them. The "interdependent" self isn't a mystical collective spirit; it's the psychological adaptation to a mode of production where capital accumulation relied on state coordination, family networks, or corporate paternalism (like lifetime employment) rather than pure market anonymity. It's a superstructural hangover that serves a material function: reducing transaction costs and stabilizing labor without needing high wages or strong unions.

  **Collectivism as a Measurable Variable**
  This is the **reification of the superstructure**. By turning ideology into a psychometric score, psychology treats the effect as the cause. In your vocabulary, you can't measure "collectivism" without measuring the material relations that reproduce it. When they measure a score, they're measuring the intensity of ideological hegemony in a specific population. Treating it as an independent variable smuggles in idealism because it suggests culture drives behavior, rather than culture being the terrain on which class struggle and production play out.

  **The East Asia vs. West Contrast**
  This is **different historical trajectories of capitalist development**. The US represents early, liberal capitalism where the bourgeoisie had to break feudal ties to establish market freedom. Japan and Korea represent late industrializing capitalism where the state and large conglomerates (chaebol/keiretsu) had to mobilize surplus value rapidly, often using nationalist or Confucian rhetoric to enforce discipline. The difference isn't "culture" in a vacuum; it's the specific class compromises and state formations required to catch up to imperialist cores.

  **The Distortions**
  The cleanest translation is the Independent Self as the bourgeois subject; that fits almost perfectly. The distortion happens with the Interdependent Self. Psychology frames this as "harmony" or "connectedness," which sounds benevolent. Your vocabulary reveals the coercion underneath: "interdependence" often means the worker is ideologically bound to the employer in a way that obscures exploitation. The psychology literature distorts power relations into cultural preferences.

  **The Residue Report**
  Here's where it gets tricky, and where you need to pay attention.

  First, **the Class Flattening Problem.** You asked about the Korean factory worker and the chaebol heir. Psychology says they share "interdependence." Historical materialism says they share an **ideology**, but not a **position**. The residue here is that HM sometimes struggles to explain why the worker *accepts* the ideology without resorting solely to "false consciousness." If you just say "false consciousness," you dismiss the lived reality that the worker might genuinely find meaning in those social bonds. Psychology captures the phenomenological truth—that the worker *feels* connected—while HM captures the structural truth—that the connection is asymmetrical and exploitative. You need both to explain why the system doesn't collapse from class conflict immediately.

  Second, **the Persistence Problem.** You mentioned Japan and the US having similar modes of production but different psychological profiles. This is the hard spot for orthodox HM. If the base determines the superstructure, why haven't they converged? The residue here points to the **relative autonomy of the superstructure**. Culture, language, and habit have a materiality of their own—they exist in neural pathways, daily rituals, and institutions that aren't instantly rewritten when the factory logic changes. Psychology identifies this inertia; HM often undertheorizes it. You can't just say "it's leftover feudalism" forever; at some point, the superstructure becomes part of the base's reproduction mechanism in a way that isn't purely economic.

  **The Bottom Line on Residue**
  The residue doesn't prove the psychologists right about culture being autonomous, but it does prove them right about culture being *sticky*. Your vocabulary explains *why* the differences exist (historical paths of capital), but their vocabulary describes *how* those differences live in the body and mind. If you dismiss their findings as idealism, you lose the ability to explain why revolutionary changes in the base (like in the USSR or China) didn't instantly produce a new "socialist man." The psychology stuff is idealist in its explanation, but realist in its observation. You need to keep the observation without buying their explanation.
