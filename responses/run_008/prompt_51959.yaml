answer: |-
  This is a classic philosophical dispute dressed in family clothing. You are wrestling with **Hard Incompatibilism** (your brother's view) versus **Compatibilism** (the view you seem to be leaning toward intuitively).

  Your brother is articulating a version of the "Basic Argument" made famous by philosophers like Galen Strawson and Derk Pereboom. It is a logically coherent position, but it is extremely costly to maintain consistently in human life.

  Here is an outside view on where the argument stands, where it likely fails in your brother's application, and how you can untangle your two problems.

  ### 1. The Argument's Soundness: Where does it go wrong?

  Your brother's argument rests on a specific chain of reasoning:
  1.  **Determinism/Luck:** Our actions are the result of our nature (genes/brain) and nurture (upbringing/circumstances).
  2.  **No Ultimate Control:** We did not choose our nature or our nurture.
  3.  **The Control Principle:** Moral responsibility requires "ultimate control" (the ability to have chosen your own causes).
  4.  **Conclusion:** Therefore, no one is morally responsible for their actions.

  **Where it goes wrong (The Compatibilist Objection)**
  Most philosophers reject **Premise 3**. This is the "Control Principle." The Compatibilist argument is that moral responsibility does not require *metaphysical* freedom (being the uncaused cause of your own existence); it only requires *practical* freedom.

  Practical freedom means:
  *   You were not coerced (no one held a gun to your head).
  *   You understood the nature of your action (you knew fraud was wrong).
  *   You acted according to your own desires and reasoning (you wanted the money, you chose fraud to get it).

  If you reject Premise 3, you save the concept of responsibility. **The cost of rejecting it** is that you must admit "free will" is not a magical power to step outside the laws of physics. You have to accept that your cousin *was* caused to be a liar, but he is still a *liar* in the only sense that matters for human relationships.

  **The "Proves Too Much" Problem**
  You are correct that the argument proves too much. If valid, it abolishes the criminal justice system, personal gratitude, and romantic love (since love is also caused by things we didn't choose).
  *   **Your brother's inconsistency:** He is unwilling to "bite the bullet" for strangers (the hit-and-run driver). This suggests he doesn't actually believe the argument is universally true; he believes it is *useful* in this specific instance.
  *   **Diagnosis:** The argument is likely functioning as a **rationalization**, not a discovery. He isn't angry anymore because he has emotionally detached to protect his peace, and he is using determinism to justify the detachment. If he truly believed the determinist view, the hit-and-run driver would be "weather" too. The fact that he still gets angry at strangers reveals that he *does* believe in responsibility generally, but is making a special exception for the cousin.

  ### 2. The Stability Problem: Feelings vs. Desert

  Your brother's defense—that gratitude and anger are "just feelings" that don't commit him to judgments of desert—is a sophisticated philosophical move derived from P.F. Strawson's essay *Freedom and Resentment*.

  Strawson argued that "reactive attitudes" (resentment, gratitude, forgiveness) are natural parts of human relationships. We can't just turn them off because of a metaphysical theory.

  **Is your brother right?**
  Partially. It is true that you can feel gratitude without writing a philosophical thesis on free will. However, his position is unstable for two reasons:

  1.  **The Selective Suppression:** He is using the metaphysical argument to *suppress* resentment toward the cousin ("I shouldn't be angry, he couldn't help it"), while allowing resentment toward the neighbor ("I am angry, he shouldn't have done that"). If the metaphysics were driving the bus, the resentment toward the cousin would vanish on its own, like anger at a storm. The fact that he needs an *argument* to stop the anger suggests the anger is still there, and he is trying to talk himself out of it.
  2.  **The Function of Blame:** Blame isn't just a feeling; it's a social tool. When you blame someone, you are communicating a norm: "This behavior is unacceptable." By telling the cousin (and the family) that he shouldn't be blamed, your brother is removing the social cost of the cousin's actions. This enables the behavior.

  **Can you blame the cousin while agreeing with the letter of his argument?**
  Yes. You can adopt a position called **Skepticism about Desert, but not about Accountability.**
  You can say: *"Metaphysically, maybe my cousin is a product of causes he didn't choose. But practically, he is an agent who harms us. I will hold him accountable not because he is cosmically 'evil,' but because boundaries are necessary for safety."*

  This allows you to keep your anger (as a signal that a boundary was crossed) without needing to solve the free will debate. You are blaming him for **who he is**, not **how he came to be**.

  ### 3. The Strongest Version of Your Brother's View

  To be fair to your brother, here is the steel-manned version of his position. It isn't just "excusing bad behavior." It is a stance of **Compassionate Determinism**.

  *   **The View:** Holding onto resentment against someone who is fundamentally broken (by genetics, trauma, or pathology) hurts the resenter more than the resented. The cousin is sick. Getting angry at a sick person for being sick is irrational.
  *   **The Goal:** Emotional liberation. He wants to stop suffering over things he cannot control (the cousin's character).
  *   **The Strength:** It prevents the family from being consumed by bitterness. It acknowledges that the cousin is unlikely to change, so punishing him emotionally is futile.

  **The Best Response to That Version**
  The counter-argument is **Protective Realism**.
  *   **Compassion vs. Enablement:** You can have compassion for the cousin's limitations without removing consequences. In fact, *true* compassion might require consequences to stop him from digging his hole deeper.
  *   **The Victim's Rights:** Your brother's peace of mind is being purchased at the expense of validating the cousin's fraud. If the cousin defrauded an employer, there are victims. Declaring him "blameless" effectively sides with the perpetrator against the victims (the employer, the family who lent money).
  *   **The Distinction:** You can accept that the cousin *can't help being who he is* while simultaneously deciding *you can't help protecting yourself from him.* You don't need to blame him to cut him off. But you do need to acknowledge the harm to justify the cutoff.

  ### Summary of Recommendations for the Debate

  If you want to continue this discussion with your brother, here is how to frame your objections:

  1.  **Point out the Selectivity:** Ask him directly: *"If the hit-and-run driver is also a product of his genes and upbringing, why is he blameworthy and the cousin isn't? Is the determinism true, or is it just a tool you use when you're tired of fighting?"*
  2.  **Challenge the "Weather" Analogy:** Weather doesn't lie to you. Weather doesn't borrow money with no intent to repay. The cousin engages in **reason-responsive behavior**. He lies when it benefits him. He tells the truth when lying is too risky. That proves he *can* adjust his behavior based on consequences. Therefore, he is not like weather; he is an agent.
  3.  **Separate Explanation from Excuse:** Agree that his upbringing *explains* the behavior. Refuse to accept that it *excuses* it. "I understand why you are this way" is compatible with "I will not tolerate what you do."
  4.  **Validate Your Own Anger:** Your anger is not a metaphysical claim about the universe; it is a boundary alarm. Tell your brother: *"I am not angry because I think he has magical free will. I am angry because he harmed us, and my anger is the mechanism that keeps us safe from him next time."*

  **Verdict:** Your brother's argument is philosophically defensible in the abstract (Hard Incompatibilism), but his application of it is inconsistent and likely motivated by emotional exhaustion rather than logical conviction. You are not required to accept his conclusion to accept his premise. You can believe the cousin is "determined" and still hold him responsible for the sake of family safety.
