          *   Defense: It's not a claim about *the* good, but a risk-hedging strategy under moral uncertainty. We aren't saying suffering *lexically* dominates happiness in reality; we are saying "Given we aren't sure, we allocate resources to test/cover that hypothesis."
          *   Conclusion: The separation is philosophically coherent *if* framed as moral uncertainty hedging rather than ontological commitment. If framed as "this is the true morality for this money," it collapses.

      *   *(b) The Reductio Transfer (Local vs. Global):*
          *   Opposition Argument: Adopting the premise locally (no happiness outweighs suffering) commits you to it globally (empty world preference).
          *   Analysis: The reductio against Negative Utilitarianism (NU) relies on the *unbounded* nature of the principle. If *any* suffering outweighs *any* happiness, you must eliminate all suffering even if it means eliminating all happiness (death).
          *   The Tranche: It's capped at 40%. It explicitly *does not* demand the elimination of all suffering if it costs the other 60%. It creates a *priority* weighting, not a lexical one in the strict metaphysical sense.
