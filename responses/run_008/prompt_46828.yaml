          *   Nuance: In pluralistic organizations, we often use *procedural* decision rules to accommodate *competing* value theories without agreeing on a single axiology. This is "modus vivendi" or "compromise via allocation."
          *   Stability: Is it stable to say "For this pot, suffering counts, happiness doesn't" while believing "Overall, both count"?
