      *   **Task:** Explain (1) temporal assumptions needed for the pump, (2) the real lesson (acyclicity vs. diachronic consistency), (3) specific failures targeted (intransitivity vs. independence vs. time-inconsistency), and (4) validity of the folk version ("cyclic preferences = free money").
