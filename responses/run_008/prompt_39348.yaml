prompt: |-
  I've been reading up on how two countries handled basically the same problem in almost opposite ways, and I'm trying to figure out what each approach actually presupposes philosophically. In Canada, after the near-miss of the 1995 Quebec referendum, the Supreme Court's 1998 reference said secession would require a clear majority on a clear question, and that this would trigger only an obligation to negotiate, not a right to secede; Parliament then passed the Clarity Act in 2000, which gives the House of Commons a say on whether a question counts as clear and refuses to specify any numeric threshold for the majority. In the UK, by contrast, the 2012 Edinburgh Agreement just let Scotland run a single-question referendum on simple majority, on a question the Scottish government itself had a hand in shaping, with the UK government agreeing in advance to respect the result -- 50% plus one was enough in principle, no clarity test, no negotiation threshold. So one system builds in gatekeeping and ambiguity about how big the Yes has to be, and the other treats a bare majority on a straightforward question as enough.

  What theory of self-determination does each of these practices presuppose, if any? I keep going back and forth. On one reading the Clarity Act only makes sense if you assume something like the remedial-rights view -- that there's no general right to secede, only a right triggered by serious injustice or exclusion, and since Quebec wasn't obviously in that position, all the fudge factors (clear question, clear majority, obligation to negotiate rather than to secede) are ways of raising the bar without ever saying so out loud. On another reading it presupposes almost the opposite: a purely plebiscitary view where anyone who'd secede from Canada has to really mean it, precisely because the majority's will does matter so much. And the Edinburgh Agreement looks like the clean plebiscitary case, but even there the 2014 "No" side spent the campaign saying it was a once-in-a-generation decision and the UK later refused a rerun, which seems to smuggle the supermajority idea back in through the timing rather than the threshold. Plus Canada lowered the voting age for neither while the UK let 16 and 17 year olds vote in 2014 -- do the two systems even agree on who the relevant "people" is?

  So here's what I actually want: reconstruct the implicit theory of self-determination in each practice, say where each is underdetermined (i.e., what different theories of the right to secede would license the same practice), and tell me whether the apparent inconsistency between the two is real or just reflects a deeper shared commitment -- maybe something like an agreement that legitimacy comes from negotiation between two majorities rather than from any unilateral democratic act. And if you think one of these practices is quietly incoherent, I'd want to know what specifically would have to change to make it coherent. No need to survey the literature on secession, just the conceptual reconstruction of these two cases.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the User's Request:**

      *   **Core Task:** Reconstruct the implicit theory of self-determination in two specific cases: Canada (Clarity Act/Reference Re Secession of Quebec) and the UK (Edinburgh Agreement/Scottish Referendum 2014).
      *   **Specific Requirements:**
          1.  Identify the presupposed theory of self-determination for each.
          2.  Identify where each practice is *underdetermined* (i.e., what other theories could justify the same practice).
          3.  Assess whether the inconsistency between them is real or reflects a deeper shared commitment (e.g., legitimacy via negotiation).
          4.  Identify any quiet incoherence in either practice and suggest what would make it coherent.
      *   **Constraints:** Do not survey the literature on secession generally. Focus on conceptual reconstruction of these two cases.
      *   **User's Observations:** The user notes the "gatekeeping/ambiguity" of Canada vs. the "clean plebiscitary" look of the UK. They note the "remedial-rights" vs. "plebiscitary" tension in Canada. They note the "once-in-a-generation" rhetoric and voting age differences in the UK.

  2.  **Analyze Case 1: Canada (Reference Re Secession of Quebec & Clarity Act)**

      *   *Mechanism:* Supreme Court says secession isn't unilateral. Requires "clear majority on a clear question." Triggers duty to negotiate, not duty to agree. Parliament decides clarity. No specific threshold.
      *   *Implicit Theory:* It's not purely plebiscitary (primary right) because a vote doesn't equal secession. It's not purely remedial because injustice isn't a prerequisite. It looks like a *Constitutional-Dialogic* theory. Sovereignty resides in the whole (Canada), but sub-units have a legitimate interest.
      *   *Underdetermination:*
          *   Could be *Remedial Right Plus*: Maybe they assume injustice *might* exist but want to prove it via the difficulty of the vote.
          *   Could be *Federalist Integrity*: The priority is preserving the federation; the process is a hurdle to protect the status quo.
          *   Could be *Deliberative Democracy*: The goal isn't the outcome but the quality of the decision (hence "clear question").
      *   *Incoherence:* The "obligation to negotiate" without an "obligation to agree" creates a potential deadlock. If the vote is clear, and negotiations fail, what happens? The theory says "rule of law," but if the political will clashes, the legal framework offers no exit. It creates a "veto by negotiation."

  3.  **Analyze Case 2: UK (Edinburgh Agreement & Scottish Referendum 2014)**

      *   *Mechanism:* Section 30 order. Single question. Simple majority (50% + 1). Pre-commitment to honor result. 16-17 year olds voted.
      *   *Implicit Theory:* Looks *Plebiscitary/Primary Right* (if the people say yes, they go). However, the power to grant the referendum rests entirely with Westminster (Parliamentary Sovereignty). So it's actually *Delegated Plebiscitary*. The right isn't inherent; it's granted by the sovereign.
      *   *Underdetermination:*
          *   Could be *Unitary Sovereignty*: Westminster allows this as a gift, not a right.
          *   Could be *Political Prudence*: Not a theory of right, but a theory of conflict management (let them vote to settle the issue).
          *   Could be *Territorial Integrity with Consent*: The UK stays together unless it consents to break up.
      *   *Incoherence:* The "Once in a Generation" claim vs. Parliamentary Sovereignty. If Parliament is sovereign, no Parliament can bind a future Parliament. If the Scots vote No, but demand another vote 5 years later, Westminster *can* legally say yes, but politically said "no." This creates a tension between democratic will (current) and prior political commitments. Also, the voting age (16) implies a different "demos" than UK general elections (18), suggesting the "people" of Scotland is distinct from the "people" of the UK.

  4.  **Compare and Synthesize (The "Deep Commitment" Question)**

      *   *Apparent Inconsistency:* Canada = Hard to leave (ambiguous thresholds, negotiation). UK = Easy to leave (simple majority, binding).
      *   *Deep Shared Commitment:* Both ultimately rest on *Constitutional Sovereignty of the Center*.
          *   In Canada, the Court says the Constitution rules.
          *   In the UK, Westminster granted the vote via Section 30.
          *   Neither recognizes an *inherent* right to secede under international law. Both treat secession as a domestic constitutional matter.
      *   *Legitimacy:* Both seek legitimacy through *process* rather than raw natural right. Canada uses legal process; UK uses political agreement.
      *   *Negotiation:* The user suggests "legitimacy comes from negotiation between two majorities."
          *   Canada: Explicitly yes (duty to negotiate).
          *   UK: Implicitly yes (Edinburgh Agreement *was* the negotiation before the vote).
      *   *Verdict:* The inconsistency is surface-level. Deep down, both assert that the *existing state* controls the terms of its own dissolution.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the prompt. Set the stage: both are domestic constitutional solutions, not international law applications.
      *   *Section 1: Canada (The Constitutional-Dialogic Model).*
          *   Theory: Not remedial, not primary. It's "Federalism + Democracy + Rule of Law."
          *   Underdetermination: Could be status quo bias disguised as procedure.
          *   Incoherence: The "Negotiation Veto." If the rest of Canada refuses to negotiate in good faith, the duty is unenforceable.
      *   *Section 2: UK (The Sovereign-Permission Model).*
          *   Theory: Parliamentary Sovereignty delegating a one-off plebiscite.
          *   Underdetermination: Is it a right or a privilege? The 16-year-old vote suggests a distinct demos, but Westminster controls the franchise.
          *   Incoherence: The "Binding Future Parliaments" problem. The "once-in-a-generation" claim is political, not legal.
      *   *Section 3: Comparison & Deep Commitment.*
          *   Is the inconsistency real? No. Both assert the Center's ultimate authority.
          *   Shared Commitment: Secession is not a right; it's a negotiated constitutional amendment.
          *   The "Two Majorities" point: Canada makes this explicit (Negotiate). UK made this implicit (Edinburgh Agreement negotiated *before* the vote).
      *   *Section 4: Fixing Incoherence.*
          *   Canada: Needs a tie-breaker mechanism if negotiations fail.
          *   UK: Needs a statutory rule on frequency or a constitutional convention on "demos" definition.

  6.  **Refining the Philosophical Labels:**

      *   Avoid standard "Remedial vs. Primary" if they don't fit perfectly.
      *   Canada: *Proceduralist Federalism*. The focus is on the *process* of separation, not the *right* to separate.
      *   UK: *Political Constitutionalism*. The focus is on political settlement rather than judicial gatekeeping.
      *   User's "Remedial" point: Address it. Canada *rejected* the remedial right in the Reference (Quebec wasn't oppressed), but didn't grant a primary right either. It created a *sui generis* category.
      *   User's "Plebiscitary" point: UK looks plebiscitary, but it's actually *authorized* plebiscitary.

  7.  **Addressing the "Who is the People" (Demos) Issue:**

      *   Canada: Implicitly the "Canadian People" (all provinces) have a stake, hence the negotiation.
      *   UK: 16-17 vote suggests the "Scottish People" are the decision-makers, *but* only because Westminster allowed it.
      *   This highlights the tension: To have a referendum, you must define the electorate. Defining the electorate presupposes the answer (if only Scots vote, they are a people; if UK votes, they are a region). Both sidestepped this by mutual agreement (Canada via Court, UK via Agreement).

  8.  **Final Review against Constraints:**

      *   Did I survey literature? No.
      *   Did I reconstruct implicit theories? Yes.
      *   Did I address underdetermination? Yes.
      *   Did I address the "real inconsistency" vs "shared commitment"? Yes.
      *   Did I identify incoherence and fixes? Yes.

  9.  **Final Polish:** Ensure tone is analytical and matches the user's high level of sophistication. (Self-Correction: Make sure not to get bogged down in the specific politics of Trudeau/Salmond, keep it on the *structural/philosophical* design).

      *   *Key Insight to emphasize:* Both systems treat secession as a *constitutional amendment* problem, not a *human right* problem. That is the shared bedrock.

  10. (Drafting response based on these thoughts...)
answer: |-
  This is a sharp dissection of two distinct constitutional architectures for managing dissolution. You are right to sense that the surface-level mechanics (gatekeeping vs. simple majority) obscure deeper structural similarities. Both systems are attempting to solve the same paradox: how to reconcile the democratic will of a sub-state nation with the constitutional integrity of the existing state, without admitting that the sub-state has an inherent *right* to break the constitution.

  Here is the conceptual reconstruction of the implicit theories, their underdetermination, and the nature of the inconsistency between them.

  ### 1. Canada: Proceduralist Federalism

  **The Implicit Theory:**
  The *Reference Re Secession of Quebec* and the *Clarity Act* do not presuppose a remedial right (injustice is not required) nor a primary right (a vote is not sufficient). Instead, they presuppose a theory of **Proceduralist Federalism**.

  In this view, sovereignty is not located in the "people of Quebec" nor the "people of Canada" exclusively, but in the *federal relationship itself*. Secession is treated not as an exercise of self-determination in the international sense, but as a **constitutional amendment** of the highest order. Because the Constitution belongs to all partners, no single partner can unilaterally alter it.

  *   **The Role of the Vote:** The referendum is not a trigger for secession; it is a trigger for *obligation*. It creates a political fact that the other partners must acknowledge.
  *   **The Role of Clarity:** The "clear majority on a clear question" requirement is not merely epistemic (making sure we know what people want); it is ontological. It asserts that the "will of the people" does not exist as a legal fact until the federal parliament certifies it.

  **Where It Is Underdetermined:**
  This practice is compatible with two conflicting theories:
  1.  **Status Quo Bias:** The ambiguity (no numeric threshold, parliamentary discretion on clarity) functions as a de facto veto. This presupposes that the federation has a right to self-preservation that outweighs the sub-unit's democratic will.
  2.  **Deliberative Integration:** The ambiguity forces the parties to talk. It presupposes that the *process* of negotiation is more legitimate than the *outcome* of a vote. It assumes that a "clean break" is less democratic than a negotiated divorce.

  **The Incoherence:**
  The system contains a **Deadlock Paradox**. The Court ruled that a clear vote creates a *duty to negotiate*, but explicitly stated there is *no duty to agree*.
  *   **The Problem:** If Quebec votes clearly, and the Rest of Canada negotiates in bad faith (or simply refuses terms that Quebec finds acceptable), the process halts. Quebec cannot secede (no right to unilateral secession), but Canada cannot force Quebec to stay (duty to negotiate in good faith).
  *   **The Fix:** To make this coherent, the framework would need a **tie-breaker mechanism**. For example, if negotiations fail after $X$ years despite a clear mandate, a second referendum with a supermajority threshold could trigger unilateral recognition, or an independent arbitration panel could impose terms. Without this, the "duty to negotiate" is legally enforceable but politically hollow.

  ### 2. The UK: Sovereign Permission (Delegated Plebiscitary)

  **The Implicit Theory:**
  The Edinburgh Agreement looks plebiscitary (50% + 1 binds the government), but philosophically it presupposes **Parliamentary Sovereignty with Delegated Consent**.

  Unlike Canada, where the Court derived rules from the Constitution, the UK has no codified constitution. Therefore, the 2014 referendum was not an exercise of an inherent right, but a **temporary loan of power** from Westminster to Holyrood.
  *   **The Theory:** The "People of Scotland" have no inherent right to decide their status. They have a *privilege* granted by the "People of the UK" (via Parliament) to decide it once.
  *   **The Voting Age:** Allowing 16- and 17-year-olds to vote supports a **Distinct Demos Theory**. By altering the franchise from the UK general election standard, Westminster implicitly acknowledged that the "relevant people" for this decision were the residents of Scotland, not the UK citizenry as a whole.

  **Where It Is Underdetermined:**
  This practice is compatible with two conflicting theories:
  1.  **Unitary Indivisibility:** The vote was a safety valve. Westminster calculated that the "No" side would win, so granting a "fair" vote was the best way to kill the movement permanently. This presupposes secession is undesirable but manageable.
  2.  **Voluntary Union:** The UK is a voluntary association. If a partner wants to leave, the moral cost of keeping them is higher than the cost of dissolution. The simple majority threshold presupposes that the *status quo* requires continuous consent.

  **The Incoherence:**
  The system contains a **Temporal Binding Paradox**.
  *   **The Problem:** The "once-in-a-generation" claim made by the Better Together campaign (and accepted by the SNP for tactical reasons) has no legal standing. Under Parliamentary Sovereignty, no Parliament can bind its successors. If the Scottish Parliament demands a second referendum in 5 years, Westminster *can* legally grant it. However, politically, they have claimed the first vote was "decisive." This creates a conflict between *legal capacity* (we can let them vote) and *political legitimacy* (we said this vote settled it).
  *   **The Fix:** To make this coherent, the UK would need to codify a **Constitutional Convention on Frequency**. Either secession referendums must be statutorily limited (e.g., minimum 25-year intervals) to give the "once-in-a-generation" claim legal weight, or the government must admit that *any* majority in the Scottish Parliament can trigger a new vote, accepting that the Union is perpetually provisional.

  ### 3. Is the Inconsistency Real?

  The inconsistency between Canada's "gatekeeping" and the UK's "simple majority" is **superficial**. Deep down, both systems share a identical commitment: **Secession is a domestic constitutional matter, not an international right.**

  Neither country accepts the "Remedial Right" theory (you can leave if oppressed) nor the "Primary Right" theory (you can leave whenever you want).
  *   **Canada** makes this explicit: You can't leave unilaterally, even with a majority.
  *   **The UK** made this implicit: You couldn't hold the vote *at all* without Westminster's permission (Section 30 order).

  **The Shared Commitment: Legitimacy via Mutual Recognition**
  You hypothesized that legitimacy comes from "negotiation between two majorities." This is correct, but the *timing* of the negotiation differs.
  *   **Canada (Post-Vote Negotiation):** The negotiation happens *after* the vote. The vote legitimizes the *demand* to negotiate; the negotiation legitimizes the *act* of secession.
  *   **UK (Pre-Vote Negotiation):** The Edinburgh Agreement *was* the negotiation. Westminster and Holyrood negotiated the *terms of the vote* (question, franchise, timing) beforehand. By agreeing to the rules, both sides pre-committed to the outcome. The vote itself was merely the counting mechanism.

  **Why the Difference?**
  *   **Canada** faces a legal constitution. The Supreme Court *had* to intervene to interpret the rules. This necessitates ambiguity (judges don't set political thresholds).
  *   **The UK** faces a political constitution. Politicians *agreed* to the rules. This allows for clarity (politicians can set specific thresholds).

  ### 4. Summary of Reconstruction

  | Feature | Canada (Clarity Act) | UK (Edinburgh Agreement) |
  | :--- | :--- | :--- |
  | **Implicit Theory** | **Proceduralist Federalism:** Secession is a constitutional amendment requiring federal consent. | **Sovereign Permission:** Secession is a privilege granted by the sovereign legislature. |
  | **Role of Vote** | Triggers a duty to negotiate, not a right to leave. | Triggers a binding political commitment to implement. |
  | **The "People"** | Ambiguous. The "Clear Majority" implies the whole federation has a stake in the threshold. | Distinct. The 16-17 franchise implies the "Scottish People" are the specific demos. |
  | **Underdetermination** | Is the ambiguity a protection for minorities or a veto for the status quo? | Is the vote a safety valve to preserve the Union or recognition of a voluntary association? |
  | **Primary Incoherence** | **The Deadlock:** Duty to negotiate without duty to agree creates a legal cul-de-sac. | **The Binding Problem:** "Once-in-a-generation" is politically binding but legally impossible under sovereignty. |
  | **Coherence Fix** | Add an arbitration mechanism for failed negotiations. | Codify referendum frequency or admit the Union is perpetually provisional. |

  **Conclusion:**
  The apparent inconsistency vanishes when you realize both systems are designed to prevent **Unilateralism**. Canada uses legal ambiguity to prevent unilateral declaration; the UK used political agreement to prevent unilateral referendum. Both assert that the *existing state* retains the ultimate authority to define the terms of its own dissolution. The UK approach appears more "democratic" (simple majority), but it is actually more fragile, because it relies on political goodwill (the Section 30 order) rather than entrenched constitutional law. Canada's approach is more rigid, but it acknowledges the hard truth that in a federation, the partners hold veto power over each other's existential status.
