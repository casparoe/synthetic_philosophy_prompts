answer: |-
  It is completely understandable that this area of law feels unsettling to you, because you have put your finger on a tension that legal philosophers have wrestled with for centuries. The confusion you feel comes from the fact that the law is trying to do two different things at once that are not entirely compatible. On one hand, it wants to be fair to individuals who are caught in impossible situations, acknowledging that human beings have limits. On the other hand, it wants to maintain social order and uphold certain absolute moral boundaries. When you look at the rules of duress through the lens of pure logic or pure free will, they seem contradictory, but when you view them as a negotiation between mercy and authority, they start to make a different kind of sense. To understand what the doctrine assumes about moral responsibility, we have to look past the idea of free will as a scientific fact and instead look at it as a social expectation.

  The underlying picture of moral responsibility in the duress defense is not actually that you lacked free will in a philosophical sense. If the law truly believed that a gun to your head removed your free will, it would treat you the same way it treats someone who is sleepwalking or having a seizure. In those cases, the law says you are not responsible at all because you were not acting as a human agent. But with duress, the law admits you chose to rob the bank. You knew what you were doing, and you intended to do it. The defense is not saying you are innocent of the act; it is saying you are not blameworthy for the choice. This is a crucial distinction. The law assumes that normally, you have the capacity to obey the law regardless of the cost to yourself. It assumes you are a citizen who owes a duty to the community to follow the rules. The duress defense is essentially a concession to human frailty. It is the law admitting that there is a point where the pressure becomes so great that it would be inhumane to punish you for failing to meet that duty. So the implicit belief is not that you had no choice, but that the choice was so skewed that we cannot fairly expect you to have chosen the right thing.

  This explains why the defense is limited to threats of death or serious injury and does not extend to economic desperation. If the theory were purely about having no acceptable alternative, then stealing to feed your starving children would qualify, because going to jail or letting them starve are both unacceptable outcomes. But the law draws a line here based on the source of the pressure and the nature of the duty. When a criminal points a gun at you, they are violating the social contract first, and the law recognizes that it cannot expect you to sacrifice your life to uphold a property right like a bank's money. However, when the pressure comes from circumstance, like poverty or illness, the law views enduring that hardship as part of the burden of citizenship. The implicit assumption is that we all face difficulties, and the law expects us to suffer those difficulties rather than pass them on to others by committing crimes. If the law excused crimes committed out of necessity to survive, it would undermine the stability of property rights and potentially encourage people to rely on crime as a social safety net. So, this part of the doctrine is not forced by the logic of free will; it is forced by the logic of social order. The law could change this and allow economic duress without breaking its theory of responsibility, but it would have to accept a much wider range of excuses that might make enforcement impossible.

  The requirement that a person of reasonable firmness would have resisted is another place where the law reveals its normative goals. You noted that this seems unfair to a cowardly person who was just as scared as a brave person. From a purely psychological standpoint, you are right. If the fear was real and overwhelming, the internal experience of coercion was the same. But the law is not just measuring internal states; it is setting a standard of conduct. By using the reasonable person test, the law is saying that courage is a duty. It assumes that moral responsibility includes the obligation to cultivate enough resilience to resist ordinary threats. If you are too cowardly to meet that baseline, the law treats that as a personal failing for which you are still responsible. This part of the doctrine could be dropped if the law cared only about the individual's actual psychological state, but keeping it reinforces the idea that the law demands a certain level of fortitude from its citizens. It shifts the focus from what you could do to what you should have been able to do.

  Then there is the most difficult piece you mentioned, which is the rule that duress is not a defense to murder. This is where the doctrine seems to contradict itself most sharply. If the logic of duress is that the pressure was too great for a human to bear, then surely the threat of death should apply even more strongly when the penalty for refusing is your own life. But here, the law switches from an excuse-based model to a value-based model. In cases of murder, the law is no longer asking whether you had a fair opportunity to comply. It is saying that some values are so important that you must die rather than violate them. The implicit belief here is that the innocent victim's right to life is superior to the coerced defendant's right to life. By killing the innocent person, you are asserting that your life matters more than theirs, and the law refuses to validate that calculation. This rule is not about free will at all; it is about moral hierarchy. It suggests that there are some lines you simply cannot cross, even under threat of death. This part of the doctrine is not forced by the theory of coercion; in fact, it actively rejects the theory of coercion in favor of a theory of absolute moral duty. The law could logically allow duress for murder if it stayed consistent with the rest of the defense, but it chooses not to because it prioritizes the sanctity of innocent life over the fairness to the coerced actor.

  If we were to reconstruct the law to commit fully to the no-choice idea, meaning we accepted that sufficient pressure removes moral responsibility entirely, the legal landscape would look very different. In that version, the inquiry would be purely causal. We would ask only whether the threat was sufficient to overcome this specific person's will, regardless of whether a brave person would have resisted. We would also likely allow the defense for economic desperation, because the pressure of starvation can be just as coercive as the pressure of a gun. Most radically, we would have to allow duress as a defense to murder, because if the threat removes your capacity to choose, you are merely an instrument of the killer, and punishing the instrument makes no sense. This would be a more philosophically consistent system regarding free will, but it would likely be a nightmare for society.

  The reason this fully consistent version would be dangerous is that it removes the law's ability to set boundaries on behavior during crises. If people know they will not be punished for committing crimes under pressure, it creates a perverse incentive for criminals to use coercion. It becomes easier to rob a bank if you can force someone else to do it for you knowing they will walk free. Furthermore, it shifts the risk entirely onto the innocent victim. If you are allowed to kill an innocent person to save yourself without legal consequence, the law is effectively telling citizens that they are on their own when confronted by a coercer. The current messy system, with its contradictions, exists to balance these risks. It offers mercy to the coerced person in most cases to acknowledge human weakness, but it draws hard lines at murder and economic crime to prevent the collapse of social order and to protect the most vulnerable victims.

  So to answer your question about whether the doctrine rests on one coherent picture, the answer is no. It rests on a hybrid of two pictures. One picture is that people are responsible agents who deserve pity when their will is overborne by another wrongdoer. The other picture is that citizens have a duty to uphold the social contract even at great personal cost. The rules you find weird are the seams where these two pictures are stitched together. The reasonable firmness test comes from the duty side, demanding courage. The exclusion of economic duress comes from the social order side, demanding endurance of hardship. The exclusion of murder comes from the moral hierarchy side, demanding sacrifice. The only part that truly fits the free will model is the core allowance of the defense for threatened violence. The law could drop the reasonable person test and look at individual psychology without collapsing, and it could theoretically allow duress for murder without logical inconsistency regarding coercion, but it chooses not to because the law is not just about logic. It is about what we demand of each other.

  Ultimately, the doctrine is not a scientific description of when free will exists. It is a moral statement about when we are willing to forgive. It assumes you are responsible unless the situation is so extreme that punishing you would shock the community's conscience, but not so extreme that it undermines the value of innocent life. It is a compromise rather than a theory. If the law committed fully to the no-choice idea, it would be more honest about determinism but less capable of protecting society. It would treat humans as machines that break under pressure, whereas the current law treats humans as moral agents who are expected to break only under specific, limited conditions. The frustration you feel is the friction of living in a system that tries to be both humane and authoritative, and while it lacks perfect logical symmetry, that asymmetry is what allows it to function in a complex world where people are sometimes victims and sometimes threats.
