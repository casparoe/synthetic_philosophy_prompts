      *   *Choice vs. Capacity:* The law assumes we have free will, but acknowledges that will can be overborne. However, it's not a purely causal "no choice" view (determinism). It's a normative view: "We expect citizens to resist some pressure, but not *this much* pressure."
      *   *The "Reasonable Person" Standard:* This introduces a moral expectation. It's not just "were you scared?" but "should you have been able to resist?" This filters out those deemed too weak-willed, implying a duty of courage.
      *   *The Murder Exception:* This is the biggest hinge. Why no duress for murder? The classic rationale is that one should sacrifice oneself rather than kill an innocent. This shifts from "could they help it?" to "should they have done it?" It prioritizes the sanctity of innocent life over the coerced actor's survival.
