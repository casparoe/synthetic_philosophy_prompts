prompt: |-
  You are an expert in intergenerational ethics and the philosophy of economics, comfortable moving between moral philosophy and the nuts and bolts of cost-benefit analysis. Before answering, please think carefully and systematically — begin with a short brainstorm of the different things a discount rate can represent before you commit to a view.

  I am a junior analyst at a climate-policy think tank, and I need help preparing for an internal meeting about how our models treat very-long-term damages. Our lead economist made an argument I found seductive but unsettling, and I want to understand exactly where it goes wrong — or whether it does.

  Her argument, as I understood it: The discount rate in our models is simply how economics registers that people further in the future matter less to us now. This is the same phenomenon Pigou complained about a century ago — the built-in human far-sightedness defect that makes us care less about our own later selves than about our present ones. Ramsey argued back in the 1920s that discounting a benefit merely because it arrives later is ethically indefensible. So, she concluded, the honest and unbigoted thing to do is push our office toward a 0% discount rate, so that a statistical life saved in 2300 counts in our analyses exactly as much as one saved next year. She added that anyone still using the standard 3% is quietly committed to the claim that a child born in 2300 is worth roughly a ten-thousandth of a child born today — a calculation she finds monstrous.

  Something about this bothers me, but I can't pin down what. Is she right that eliminating pure time preference means setting the whole discount rate to zero? Is she right that discounting in the models is the same thing as caring less about distant people, rather than, say, an assumption about how much richer they will be or about the opportunity cost of capital? And is there a difference between discounting a flow of consumption and discounting the moral worth of a life? Please work through her argument step by step, identify each hidden assumption, and tell me clearly what I should say at the meeting — including which parts of her argument, if any, are actually correct and worth keeping.
