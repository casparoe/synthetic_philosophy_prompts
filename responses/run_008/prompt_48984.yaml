answer: |-
  # THE VIOLENCE LEDGER: A Decision Tree for Mortality Trends
  **Start:** You are reviewing 500 years of data on human-caused death.

  ### 1. THE NUMERATOR (What counts as a "violent" death?)
  **Case:** A government enforces economic sanctions that collapse a healthcare system, leading to 10,000 excess deaths from preventable disease. A rebel group executes 10,000 prisoners.
  *   **A.** Only the executions count as violence. (Direct/Event-based) → *Go to 2*
  *   **B.** Both count equally. (Structural/Systemic) → *Go to 2*

  ### 2. THE DENOMINATOR (How do we weigh the toll?)
  **Case:** In Year 1, 1% of 1 billion people die violently (10M deaths). In Year 2, 0.5% of 6 billion die violently (30M deaths).
  *   **A.** Year 2 is safer; individual risk dropped by half. (Per Capita/Rate) → *Go to 3*
  *   **B.** Year 2 is worse; total suffering tripled. (Absolute Numbers) → *Go to 3*

  ### 3. THE ONTOLOGY (Is there a fact of the matter?)
  **Case:** Two analysts use the definitions above and reach opposite conclusions (e.g., "Risk is down" vs. "Total dead is up").
  *   **A.** One of them is describing the world more accurately. (Realist) → *See Leaves I–IV*
  *   **B.** Neither is "true"; they are choosing tools for different purposes. (Pragmatist/Relativist) → *See Leaf V*

  ---

  ## THE LEAVES (Your Position)

  | Path | Position Name | The Claim | Epidemiological Note |
  | :--- | :--- | :--- | :--- |
  | **1A → 2A → 3A** | **The Optimistic Declinist** | "Violence is historically down." | Focuses on *hazard rates*. Aligns with Pinker/Spierenburg. Robust for individual risk assessment. |
  | **1A → 2B → 3A** | **The Aggregate Pessimist** | "More bodies are dying than ever." | Focuses on *population burden*. Valid for total resource allocation, but ignores safety improvements per person. |
  | **1B → 2A/B → 3A** | **The Structural Critic** | "State negligence is violence; trends are flat or rising." | Expands *case definition*. Harder to measure (requires counterfactual modeling), but captures systemic harm. |
  | **1A → 2A → 3A** | **The Technocratic Realist** | "We can measure violence objectively like pathogen load." | **⚠️ Potentially Incoherent:** Assumes moral categories (violence) map cleanly to biological events (death) without normative framing. |
  | **Any → 3B** | **The Conceptual Pragmatist** | "'Violence' is a lens, not a discovery." | **⚠️ The 'Cop-Out' Check:** Not a cop-out if you specify *which lens serves which goal*. Is a cop-out if it stops you from choosing a metric for policy. |

  ---

  ## UNEXPLORED OR PROBLEMATIC SPACES
  *   **The "Hidden" Structural Optimist (1B → 2A → 3A):** Claims structural violence is objective *and* declining per capita. *Why rare?* Hard to prove structural "safety" objectively without admitting moral modeling.
  *   **The Indistinguishable Pair:** A **Pragmatist (Leaf V)** who *chooses* the Direct/Rate lens for policy looks identical in practice to an **Optimist (Leaf I)**. The difference is only in their confidence that they have found "The Truth."

  ## EPIDEMIOLOGIST'S NOTE ON THE "META" QUESTION
  You suspected the "It depends" (Leaf V) answer was a cop-out. Here is the philosophical distinction:
  *   **It IS a cop-out** if it implies all definitions are equally *useful*. (Counting factory-farmed animals alongside war deaths might be morally consistent, but it ruins the dataset for tracking interstate conflict trends).
  *   **It is NOT a cop-out** if it acknowledges that "Violence" is a *functional kind*, not a *natural kind*. There is no "violence particle." We define the numerator to answer a specific question (e.g., "Is my body safe?" vs. "Is humanity suffering more?").
  *   **The Trap:** The debate fails when participants argue about the *data* when they are actually arguing about the *case definition*. Your group needs to agree on the Numerator/Denominator *before* looking at the trend line.

  *(c) Prepared for the Pub Philosophy Group. Photocopy friendly.*
