      *   **Credit:** Correctly states the decision rule (maximize expected welfare based on price differential).
      *   **Note:** No deductions here. This section is A-quality.

  **Part (b): Motivation**
  *   *"Ordinary voters don't have money on the line... In a speculative market you have to put your money where your mouth is."*
      *   **Credit:** Correctly identifies incentive compatibility and "skin in the game" as the primary advantage over legislatures/voting.
