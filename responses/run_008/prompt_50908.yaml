      *   **Credit:** Accurately describes the selection mechanism for informed traders.
  *   *"Another advantage: the market price is basically the median trader's belief about the policy's effect..."*
      *   **Error:** This is theoretically imprecise. In prediction markets, prices reflect the **wealth-weighted average** belief (or the belief of the marginal trader), not the **median** trader's belief. The median implies an unweighted order statistic, whereas the student correctly notes later that votes are "weighted by how much they're willing to stake." These two claims are internally inconsistent.
