  At my ML reading group last week we got onto whether Occam's razor is actually truth tracking or just aesthetic preference, and this guy ended the whole argument by citing the no-free-lunch theorems -- as in, no learner beats random guessing once you average over all possible target functions, so preferring simple hypotheses is a bias we smuggle in and the success of science is basically luck that could run out any day now. I've heard the same phrase 'no free lunch' used for much smaller claims too, like 'there's no universally best optimization algorithm' or even 'every model wins on some datasets'. I have a feeling one slogan is quietly doing like four different jobs here and only one of them, if any, gets my reading-group guy his conclusion.

  Pretend you're a philosopher of science who also actually knows learning theory (Wolpert's stuff, off-training-set error, all that). Start with some unstructured brainstorming before you commit to anything, then give me the distinct precise claims 'no free lunch' could be expressing -- from the literal mathematical theorem about uniform averages over objective functions, to a methodological point about benchmark diversity, to a full-blown Humean conclusion about induction being unjustified or simplicity priors being arbitrary. For each reading say whether it's true, whether it's trivially true, and crucially whether it would actually support using it to end an argument like mine did. Lay it out as a numbered menu I can bring back to the group -- I want to be able to point at a number and say "which of these were you claiming?"
