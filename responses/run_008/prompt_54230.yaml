  ### My verdicts, restated

  You condemn 1850s slaveholders because abolitionist arguments were contemporary. Conversely, you condemn residential school architects despite mainstream praise. You excuse Aristotle on insect generation and Newton on alchemy as limitations of evidence. However, you condemn witch-trial judges for cruelty, even amidst universal belief, though you hesitate regarding frightened villagers. You remain undecided on the nineteenth-century craniologist measuring skulls to rank races, oscillating between viewing him as a moral monster or merely a practitioner of contemporary science. These judgements reveal a tension between available dissent and universal norms.

  ### The candidate principle

  A robust principle must distinguish between epistemic limitations and moral agency, separating facts from values. First, it is unfair to judge historical figures for factual errors where evidence was inaccessible, as with Aristotle's biology or Newton's alchemy; here, your 'in the air' test holds, requiring contemporary dissent or better methodology to justify criticism. Second, regarding moral harms, judgement is permissible if the action inflicted unnecessary suffering, regardless of mainstream acceptance, as seen in residential schools. This overrides the 'in the air' test when basic human welfare is visibly violated; even if praised, the suffering was observable to contemporaries. Third, agency matters significantly: those wielding institutional power, like witch-trial judges, bear greater responsibility than coerced participants, explaining your hesitation over villagers who acted under duress or fear. Therefore, the revised principle is: judge factual claims by contemporary evidential standards, but judge moral actions by the avoidability of harm and the actor's power to refrain. Dissent strengthens condemnation, as with the slaveholders, but is not strictly necessary for moral harms involving severe suffering. This accommodates the slaveholders (dissent existed) and residential schools (harm evident), while protecting Aristotle. It shifts focus from what was thought to what was done and who held the power. Ultimately, historicism should protect ignorance, not cruelty. We must ask not only what was known, but what power was wielded. This framework prepares us to assess the craniologist by asking whether his science masked avoidable harm.

  ### Where it strains your verdicts

  The principle strains most against strict historicism regarding residential schools. If a society genuinely believed assimilation was benevolent, claiming the harm was 'visible' imposes our hindsight. Your verdict condemns them; the principle agrees, but only by asserting some truths are timeless. This challenges the idea that context dictates morality. Furthermore, the distinction between the witch judge and the villagers relies on assessing degrees of coercion, which is historically difficult to measure. Your hesitation is prudent, but the principle demands a binary decision on agency. Regarding your original 'in the air' test, it survives partially. It remains essential for epistemic errors like Aristotle's, where dissent or evidence is required for criticism. It also strengthens moral cases like the slaveholders. However, it ceases to be a necessary condition for moral condemnation. You can condemn without contemporary dissent if the harm is egregious. This demotes your original principle from a gatekeeper to a mitigating factor, which may feel like a surrender of your initial historicist instinct. Consequently, you must accept that some moral standards transcend time, contradicting pure relativism.

  ### The craniologist

  The principle predicts a split verdict. Epistemically, the craniologist is excused like Newton; skull measurement was accepted methodology, and genetic science was unavailable. However, morally, he is liable like the residential school architects. If his rankings justified oppression or ignored visible suffering, the 'avoidable harm' clause applies. Unlike Aristotle's mud, race ranking inflicted social harm. Unless he actively resisted the oppressive uses of his data, he bears responsibility. He is not a monster for bad science, but he is culpable for ignoring the human cost.

  ### What I should give up

  You should give up your hesitation on the craniologist. Consistency demands that if residential schools are condemnable despite mainstream support, then scientific racism used to justify oppression must also be condemned. Both involve inflicting harm under the guise of benevolence or science. Maintaining doubt here while condemning the schools creates a contradiction in your treatment of institutional harm. Accept that mainstream acceptance does not immunise moral wrongdoing.
