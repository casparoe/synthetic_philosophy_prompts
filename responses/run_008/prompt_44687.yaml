      *   *Technical Nuance:* Linear probes explicitly assume linearity. SAEs assume features are sparse linear combinations of activations (dictionary learning). Causal patching often involves swapping activation vectors (linear operations) or masking. They all operate within the *vector space geometry* of the residual stream or MLP layers.
      *   *Verdict:* The "common linear-structure" objection *does* go through to some extent. It weakens the independence claim. However, it doesn't kill the argument entirely because SAEs (non-negative sparse coding) are structurally distinct from simple logistic regression probes.
      *   *Commitment:* I need to tell the author that the independence claim is overstated. The methods aren't *independent enough* to fully rule out structural artifacts. The argument works *if* qualified, but as written, it's vulnerable.
