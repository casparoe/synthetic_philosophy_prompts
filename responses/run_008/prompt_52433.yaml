answer: |-
  **The Nyāya Editorial Protocol**

  **Translation Notes**
  We drop Sanskrit terminology for accessibility. We merge *Arthāpatti* (postulation) into Inference; distinguishing "explanation of contradiction" from "inference from evidence" adds complexity without changing the editorial outcome. We treat *Upamāna* (analogy) strictly as a warning flag rather than a valid proof, given the high risk of misidentification in natural history.

  **The Procedure**
  1.  **Perception Check:** Was the phenomenon observed directly under adequate conditions (light, proximity, sensory competence)?
      *   *Pass:* Move to Verdict.
      *   *Fail:* Go to 2.
  2.  **Inference Check:** Does the evidence provided guarantee the claim? Are alternative explanations ruled out?
      *   *Pass:* Move to Verdict.
      *   *Fail:* Go to 3.
  3.  **Testimony Check:** Is the source primary? Is the author competent and accountable?
      *   *Pass:* Publish.
      *   *Fail:* Go to 4.
  4.  **Analogy Warning:** Is the claim based on resemblance alone?
      *   *Yes:* Reject (unless expert verified).
      *   *No:* **Handoff to Editor.** If steps 1–3 are ambiguous, the decision rests on editorial judgment regarding risk vs. inclusivity. This is the point where facts run out and policy begins.

  **Verdicts:** *Publish* (Secure pass); *Query* (Request better evidence); *Reject* (Safety failure or insufficient grounds).

  **Worked Submissions**

  1.  **Birdwatcher (Rarity, poor light, solo).**
      **Verdict: Query.**
      Fails Perception (light/competence uncertain). Fails Testimony (anonymous). Requires photo or second witness to corroborate the observation.

  2.  **Lake Dredging (Reeds absent 1985–1990).**
      **Verdict: Publish.**
      Passes Inference. Established features do not vanish without cause; photos rule out seasonal variation. The ground guarantees the claim.

  3.  **Building Date (Newspaper cites County Records).**
      **Verdict: Query.**
      Fails Testimony. Newspaper is secondary; journalist is not the competent authority (Records Office). Requires primary document.

  4.  **Fungus (Edible ID by resemblance).**
      **Verdict: Reject.**
      Fails Analogy Warning. Resemblance is not identity. Safety critical. Requires expert Perception.

  **Note on Disliked Verdict:** Case 3 (Building) often frustrates editors. The newspaper seems reliable, and chasing records slows workflow. However, the procedure overrides enthusiasm for speed to ensure archival stability, forcing a request for the primary source despite the extra labour.

  **Where It Misfires**
  Nyāya testimony relies on *āpta*—known, virtuous experts. Wiki contributors are often anonymous strangers lacking social accountability. We cannot judge their virtue or competence directly, breaking the link between the speaker and the truth.

  **Patch:** Shift trust from *person* to *track record*. Treat a user's history of accurate edits as their "virtue." If anonymous or new, demand higher evidentiary standards (Perception/Inference) over Testimony. This compensates for the lack of social accountability by increasing the burden of proof for strangers, ensuring safety without requiring real-world identity. If a user consistently provides verifiable claims, their testimony gains weight, mimicking the *āpta* status through digital reputation rather than social standing.
