      *   *Section 3: The "Politics vs. Tech" Conclusion.* Explain how the analogy smuggles in inevitability. If it's physics, you can't fix it. If it's math/social science, you might change the inputs.
      *   *Section 4: Better Analogies.* Pitch Arrow's Theorem. Explain why it fits better (social choice, definitions).
      *   *Section 5: Explaining the Impossibility Results.* Keep it simple. The "Pie Chart" or "Venn Diagram" explanation. Calibration = slices look the same. Error Balance = mistakes look the same. If the pie sizes (base rates) differ, you can't make the slices and mistakes match simultaneously.
      *   *Conclusion/Bottom Line:* Give the journalist a clear takeaway for their piece.

