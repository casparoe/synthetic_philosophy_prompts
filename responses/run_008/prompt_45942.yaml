  3. She can safely concede that states are artificial constructs unlike natural individuals, since this scaling difference does not alter the structural insecurity of the state of nature. Yet this admission fails to answer Kant's claim that existing internal constitutions grant states a moral status that makes external absorption destructive rather than liberating.
  4. The world-state conclusion fails because the analogy smuggles in atomism, whereas Kant's federation fits better with his image of trees in a forest crowding each other into upright growth or a dissolvable association that respects autonomy.
  5. This audit may fail if the Hobbesian insists that without coercive law there is no right at all, forcing me to concede the federation is merely provisional and logically demands eventual coercion to avoid reverting to war.
