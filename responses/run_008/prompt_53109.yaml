      *   *Section 2: Coherence.* Address the Indexation vs. Nominalism split. Argue it's functional differentiation, not theoretical incoherence. Private = Certainty; Public = Equity.
      *   *Section 3: Aristotle.* Tackle the fork. The "Drifting Yardstick" is the key. Aristotle cares about *proportionate reciprocity*. Nominalism breaks this in inflation. He would likely favor indexation to save the "measure" function, viewing the convention as subordinate to the natural end (justice/need).
