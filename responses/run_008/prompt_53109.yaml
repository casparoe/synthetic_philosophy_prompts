answer: |-
  The tension you describe—the "Nominalist Paradox"—reveals a fissure in the legal ontology of money. The law treats money as a *numeraire* (a counting unit) in private debt, but as a *welfare metric* (a store of value) in public obligation. To dissect this, we must evaluate the three candidate theories, assess the system's coherence, apply the Aristotelian fork, and map the practical consequences of shifting the underlying theory.

  ### I. The Three Candidate Theories

  **1. The Conventionist Theory**
  *   **Thesis:** Money is a social agreement; the community stipulates the content of the obligation.
  *   **Relation to Nominalism:** **Fits well, but does not strictly presuppose it.**
      *   *Analysis:* If the convention is understood as "100 units of account," nominalism follows naturally: the yardstick cannot shrink relative to itself. However, convention is malleable. A community could conventionally agree that "100 units" implies "100 units of *purchasing power*." Therefore, nominalism is not a logical necessity of conventionism, but a specific *choice* of convention.
      *   *Strain:* Strain arises if the convention is understood to facilitate exchange based on *need* (as Aristotle suggests). If inflation destroys the ability to meet need, the convention fails its purpose, yet nominalism upholds the convention anyway.

  **2. The Commodity Theory**
  *   **Thesis:** Money is a good like wheat; obligations are in kind.
  *   **Relation to Nominalism:** **Strictly presupposes it (historically), but fits poorly (modernly).**
      *   *Analysis:* If money is a commodity, a debt is a bailment of that commodity. You owe 100 ounces of gold, not 100 ounces of *value*. Repayment in kind discharges the debt. This strictly licenses nominalism.
      *   *Strain:* Modern fiat currency has no intrinsic commodity value. Applying commodity logic to fiat money requires a legal fiction that strains against economic reality. It treats a token as a substance.

  **3. The State-Creature (Chartalist) Theory**
  *   **Thesis:** Money is a creation of the sovereign; the unit's meaning is for the state to determine.
  *   **Relation to Nominalism:** **Strictly presupposes it.**
      *   *Analysis:* Courts are organs of the state. If the state defines the "dollar" as a unit of account without attaching it to a price index, the court cannot add that attachment without usurping the sovereign's prerogative. Nominalism is the judicial deference to the sovereign's definition of the unit.
      *   *Strain:* Minimal. This is the dominant implicit theory in modern legal systems. The strain appears only when the sovereign's definition (nominal) conflicts with the sovereign's other goals (equity in taxation), leading to the incoherence you noted.

  **Underdetermination:**
  The doctrine of nominalism is **radically underdetermined**. All three theories license it. You need not know *what* money is (convention, commodity, or state-creature) to know *how* courts treat debt. They simply enforce the face value. This underdetermination allows the legal system to maintain nominalism without committing to a specific metaphysics of money, preserving flexibility.

  ### II. Coherence: One Theory or Two?

  Is the system incoherent (running two theories) or unified (one theory applied differently)?

  **The Argument for Incoherence:**
  Superficially, the system is schizophrenic. It asserts $X = X$ in contract law, but $X \neq X$ in tax law (where brackets shift with inflation). This suggests the law silently runs two theories: **Money as Abstract Unit** (Private) and **Money as Real Resource** (Public).

  **The Argument for Unity:**
  A deeper unity exists if we view the distinction not as one of *money*, but of *default rules regarding risk allocation*.
  *   **Private Law (Nominalism):** Prioritizes **certainty and autonomy**. Parties are free to index (shift inflation risk to the debtor), but if they remain silent, the law assumes they accepted the currency risk. The "theory" here is freedom of contract.
  *   **Public Law (Indexation):** Prioritizes **equity and political stability**. The state cannot arbitrarily increase the tax burden via inflation (stealth taxation), nor should benefits erode due to state monetary policy. The "theory" here is protection of the subject from sovereign power.

  **Verdict:** The system is **functionally coherent but theoretically dualistic**. It applies a "formalist" theory of money to private actors (you made a deal) and a "realist" theory of money to the state (we must measure burden fairly). It is not a single theory of money applied in different domains; it is a single theory of *jurisdictional competence* (Courts enforce text; Legislatures manage equity).

  ### III. The Aristotelian Judgment

  Aristotle presents a fork:
  1.  **Convention:** Money is alterable by agreement (*Nicomachean Ethics*).
  2.  **Measure:** A drifting yardstick fails to measure proportionate reciprocity (*Ethics/Politics*).

  **Does Nominalism Vindicate or Betray?**
  Nominalism **vindicates the first claim** (Convention) but **betrays the second** (Measure).
  By enforcing the face value regardless of purchasing power, the law respects the community's stipulation (the number agreed upon). However, by allowing the "yardstick" to shrink during inflation, it destroys the proportionality of the exchange. If a lender gives 100 units when a unit buys a loaf of bread, and receives 100 units when a unit buys a crumb, the reciprocity is broken. The debtor has gained unjustly (in real terms), or the creditor has been unjustly enriched (in deflation).

  **What would a Consistent Aristotelian Prefer?**
  A consistent Aristotelian would prefer **indexed obligations**.
  *   *Reasoning:* For Aristotle, the purpose of money is to facilitate exchange based on *need* (*chreia*). The "measure" function is teleological; it exists to ensure justice in exchange. A convention that allows the measure to drift so wildly that it distorts need violates the *natural* end of money.
  *   *Resolution:* While Aristotle admits money is conventional, he subordinates convention to natural justice. If the convention (nominalism) destroys the measure's ability to ensure proportionate reciprocity, the convention is defective. An Aristotelian judge would imply a term of "real value" to preserve the *function* of the measure, viewing the "100 units" not as a count of tokens, but as a count of *value units* represented by tokens.

  ### IV. Practical Implications of Theoretical Shift

  If the legal system abandoned the current underdetermined nominalism for a strict **Commodity View** or a **Conventionist View with a Real-Value Default**, the following changes would be required:

  **1. Doctrinal Rewriting:**
  *   **Discharge of Debt:** The doctrine of "tender" would change. Paying face value would no longer automatically discharge debt if the real value had depreciated beyond a threshold.
  *   **Usury Laws:** These would become redundant or require total restructuring. If interest is merely compensation for value loss, "usury" becomes harder to define.
  *   **Bankruptcy:** The "fresh start" policy would be complicated. If debts are real-value obligations, inflation cannot erode the real burden of debt, making bankruptcy relief less effective for debtors in high-inflation environments.

  **2. Standard Clauses and Forms:**
  *   **"Gold Clauses":** These would become the default standard, likely mandated by law rather than optional. Contracts would read "100 Units of 2024 Purchasing Power" rather than "$100."
  *   **Lease Agreements:** Rent would automatically adjust to CPI, removing the current need for explicit escalation clauses.
  *   **Statutes of Limitation:** These might toll based on value preservation, not just time.

  **3. Alignment of Public and Private:**
  *   **Tax Code:** If private debt became real-value indexed, the tax code's indexation would no longer look like an anomaly. Conversely, if the tax code reverted to nominalism (to match private debt), it would constitute a massive hidden tax increase during inflation.
  *   **Damages:** Tort awards for lost future earnings would no longer require complex discounting for inflation; the "unit" would already be stable.

  ### V. Conclusion: The Silent Dualism

  The existing system is best read as **silently running two theories of money at once**, managed by a pragmatic division of labor.

  1.  **In Private Law:** Money is a **Token of Promise**. The focus is on the *sanctity of the word*. The specific value of the token is secondary to the certainty of the count. This supports commerce by reducing litigation over valuation.
  2.  **In Public Law:** Money is a **Token of Power/Welfare**. The focus is on the *burden on the subject*. The state acknowledges its monopoly on the currency and accepts the responsibility to prevent that monopoly from becoming predatory via inflation.

  This dualism is stable only so long as inflation remains low. In episodes of hyperinflation, the dualism collapses: the "Token of Promise" becomes worthless, and the "Token of Power" becomes predatory. At that breaking point, the law is forced to choose. Historically, it chooses the Aristotelian "Measure" over the Legalist "Convention," enacting revaluation statutes that impose indexation retroactively. This proves that while the law *pretends* money is nominal for the sake of order, it *knows* money is real for the sake of justice. The nominalist rule is thus a fiction of stability, maintained only so long as the currency does not betray its function as a measure.
