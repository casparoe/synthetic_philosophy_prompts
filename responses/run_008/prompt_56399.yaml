prompt: |-
  I'm a science and ideas journalist and I've somehow talked my editor into a 1,200-word feature on whether numbers exist. The framing is a genuine argument among philosophers that most readers have never heard of, not a "wow, maths is beautiful" piece. Don't write the feature for me and don't explain platonism vs nominalism to me -- I need the plan for how the explanation should go, since I'll be the one teaching it to readers. Specifically: what has to be established first before the question "do numbers exist?" stops sounding like nonsense to a general reader (I suspect I can't just open with it), which single example should carry the whole thing and what it has to do that other examples can't -- and tell me why the obvious candidates (Plato's cave, or "the number 2 is a set", or engineering blueprints that exist before the bridge) fail or half-fail, one piece of notation or machinery I'm allowed to introduce and where, the misconceptions readers will arrive with or form partway through (my guesses: that platonism is literally about a spooky realm you visit, that if numbers don't exist then arithmetic is somehow false, and that Gödel settled this) and where in the sequence I need to cut each one off, and how I'll know by the end of the piece whether a reader has actually got the question rather than just been amused by it. Also tell me what to explicitly refuse to cover in 1,200 words and say so out loud to the reader. Two conditions on your answer: use British English, and keep clearly separate what's settled background versus what's genuinely contested among philosophers who work on this -- I don't want to hand my readers some fighting-position on indispensability or Benacerraf's epistemological challenge as if it were the consensus view. If you think my framing itself smuggles in something contested, say that too rather than playing along.
