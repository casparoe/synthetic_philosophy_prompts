answer: |-
  Here is the structural plan for your 1,200-word feature. It is designed to navigate the metaphysical minefield without tripping over technical jargon, while adhering to your constraints on British English and the distinction between settled mathematics and contested philosophy.

  ### 1. The Framing Critique: A Warning Before You Begin
  You must acknowledge that your headline question smuggles in a contested assumption. To ask "Do numbers exist?" presupposes that 'existence' is a single, univocal property that numbers might either have or lack. Many philosophers (particularly ontological deflationists) argue this is a category mistake. They contend that 'exists' means something different in "electrons exist" versus "numbers exist".

  **Action:** Do not present the question as a mystery waiting for a 'yes/no' answer. Present it as a dilemma about *what kind of reality* we are willing to endorse. The settled background is that mathematicians agree on the truths (e.g., there are infinitely many primes); the contested territory is what makes those truths true.

  ### 2. What Must Be Established First
  Before the question stops sounding like nonsense, you must broaden the reader's definition of "existence". Most readers operate on a **spatio-temporal criterion**: to exist is to be somewhere and somewhen, capable of causal interaction.

  **The Setup:** You need to establish that if we stick to the spatio-temporal definition, numbers clearly *do not* exist (you cannot bump into a '7'). However, if numbers don't exist, it becomes difficult to explain why statements about them are objectively true.
  **The Goal:** Shift the reader from asking "Can I touch it?" to "What makes the statement true?" This moves the debate from physics to metaphysics without the reader noticing.

  ### 3. The Single Example
  **The Example:** *"There are prime numbers larger than the number of atoms in the observable universe."*

  **Why this carries the piece:**
  *   **It forces independence:** Unlike "2 apples", this statement cannot be verified by physical inspection. There are not enough atoms to instantiate these numbers.
  *   **It forces necessity:** Mathematicians agree this statement is true regardless of human opinion or physical reality.
  *   **It isolates the ontology:** If the statement is true, *what* is it true about? If nothing physical corresponds to it, the 'truthmaker' must be non-physical.

  **Why the obvious candidates fail:**
  *   **Plato's Cave:** This is an allegory about knowledge, not ontology. It distracts readers with shadows and fire rather than the logical status of numbers.
  *   **"The number 2 is a set":** This invites reductionism (Benacerraf's identification problem). Readers will get bogged down in *which* set defines 2, missing the point that *any* set definition is arbitrary.
  *   **Engineering Blueprints:** This confuses representation with reality. A blueprint exists physically; the mathematical relations it depicts do not. It suggests numbers are merely human tools, which begs the question against the Realist.

  ### 4. The One Piece of Notation
  **The Machinery:** The existential quantifier: **$\exists$** (read as "there exists").

  **Where to introduce it:** Immediately after introducing the Prime Number example.
  **How to use it:** Show the logical form of the claim: "$\exists x$ such that $x$ is prime and $x >$ [number of atoms]".
  **Why:** This clarifies that in logic, 'existence' is not about material substance; it is about satisfying a condition within a true proposition. It allows you to explain that when philosophers argue about existence, they are arguing about whether binding a variable with $\exists$ commits us to a real object, or merely a useful way of speaking. This prevents the "spooky realm" misconception by grounding existence in language and logic.

  ### 5. Misconceptions and Cut-Off Points
  You must preemptively dismantle three specific errors. If you do not cut them off, they will consume your word count.

  *   **Misconception 1: The "Spooky Realm"**
      *   *The Error:* Readers think Platonism (Realism) implies a mystical dimension we visit in trances.
      *   *The Cut-off:* In your first explanation of Realism. Explicitly state: "Abstract does not mean ethereal. It means non-spatio-temporal. It is not a place; it is a mode of being."
  *   **Misconception 2: "If numbers don't exist, arithmetic is false"**
      *   *The Error:* Readers assume Anti-Realism (Nominalism/Fictionalism) means $2+2=5$.
      *   *The Cut-off:* When introducing the Anti-Realist position. Clarify: "Denying the existence of numbers is not denying the utility of arithmetic. It is claiming that arithmetic is true *within the story*, much like 'Sherlock Holmes lived in London' is true, though Holmes did not exist."
  *   **Misconception 3: "Gödel Settled This"**
      *   *The Error:* Readers often conflate ontological questions with incompleteness.
      *   *The Cut-off:* In your "Refusals" section (see below). Do not let this creep into the main text.

  ### 6. How to Know the Reader "Got It"
  You will know the reader has understood the problem not if they agree with one side, but if they feel the **cost of both**.
  *   **Failure State:** The reader finishes thinking, "Obviously numbers are real, stop wasting my time," or "Obviously numbers are just ideas, why is this philosophy?"
  *   **Success State:** The reader feels the tension. They should realise that accepting Realism saves the truth of mathematics but costs us an explanation of how we access these objects (the epistemological challenge). They should see that accepting Anti-Realism saves us from spooky objects but costs us an explanation of why mathematics is so universally applicable (the indispensability challenge). If they feel that *both* answers require swallowing something difficult, they have grasped the debate.

  ### 7. What to Explicitly Refuse to Cover
  In a sidebar or a dedicated paragraph near the end, explicitly tell the reader what you are leaving out. This builds trust and manages scope.
  *   **The History:** No Pythagoras, no Newton. This is not a history of discovery.
  *   **Cognitive Science:** No discussion of whether babies or crows can count. That explains how we *learn* numbers, not whether they *exist*.
  *   **Physics Applications:** No quantum mechanics. The application of maths to physics is the *problem* (indispensability), not the solution.
  *   **Gödel's Incompleteness Theorems:** State clearly: "This is about truth and existence, not about the limits of proof systems."

  ### 8. Settled Background vs. Contested Philosophy
  Maintain a strict firewall between these two throughout the piece.

  *   **Settled (Mathematics):** It is an objective fact that there are infinitely many primes. It is an objective fact that physics relies on mathematical models that work. No philosopher disputes the *truth* of the theorems.
  *   **Contested (Philosophy):**
      *   Whether truth requires an existing object (Realism vs. Anti-Realism).
      *   Whether 'existence' is univocal (Quine vs. Frege).
      *   Whether indispensability in science proves existence (Putnam/Quine vs. Field).
      *   Whether we can have knowledge of causally inert objects (Benacerraf's Challenge).

  **Final Advice on Tone:**
  Do not write as if there is a emerging consensus towards one side (e.g., Naturalism). The field is fragmented. Use phrases like "Proponents argue..." and "Critics counter..." rather than "The evidence shows...". Your job is to illuminate the stalemate, not resolve it.

  If you follow this structure, you will avoid the trap of writing a "maths is magical" puff piece and instead deliver a rigorous ontological inquiry that respects the reader's intelligence.
