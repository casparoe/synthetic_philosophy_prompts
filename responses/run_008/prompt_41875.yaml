          *   *Misery Monster (MM):* Experiences amplified negative utility (near bottom of scale), making small harms to them outweigh large benefits to others.
      *   **Constraints:**
          *   Single paragraph scenario.
          *   Ordinary institutional context (clinic/benefits office).
          *   Symmetric conditions (same amplification, opposite ends of scale).
