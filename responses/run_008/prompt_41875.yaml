answer: |-
  At the Municipal Benefits Office, Director Chen manages a fixed grant for sensory rehabilitation. Two applicants present with symmetrical neural amplification syndromes: Mr. Intensity, whose nervous system magnifies all hedonic tones by a factor of 1,000, and Mr. Misery, whose system identically magnifies tones but functions from a chronic baseline of severe suffering near the physiological floor. Chen can allocate the entire grant to a procedure granting Mr. Intensity a modest hour of euphoria, to a palliative sparing Mr. Misery a modest hour of agony, or to standard treatments relieving significant chronic pain for 1,000 ordinary citizens. Clinical data confirms the magnitudes: Mr. Intensity's modest gain yields more total utility than the 1,000 citizens' aggregate relief, while Mr. Misery's modest avoidance of pain prevents more total disutility than the 1,000 citizens' aggregate gain, solely due to the amplification factor.

  **Classical Utilitarianism**
  Classical utilitarianism (CU) dictates maximizing the sum of well-being. Regarding Mr. Intensity, CU mandates funding his euphoria, as his amplified gain mathematically exceeds the aggregate relief of the 1,000 citizens; this is the standard Utility Monster verdict. Regarding Mr. Misery, CU similarly mandates funding his palliative care, as the amplified disutility he would suffer outweighs the aggregate utility gained by the 1,000. While critics find the first verdict repugnant (sacrificing the many for one's pleasure), the second verdict is structurally identical: the many are sacrificed to spare one's pain. CU is perfectly symmetric; it "pays the monster" regardless of whether the monster occupies the highs or the lows of the hedonic scale. The theory's commitment is to magnitude, not location.

  **Prioritarianism**
  Prioritarianism weights benefits inversely to the recipient's absolute well-being level, using a concave function. For Mr. Intensity, who presumably occupies a higher well-being baseline, the moral weight of his gain is diminished; Prioritarianism likely rejects funding him, thereby "solving" the original Utility Monster objection. However, for Mr. Misery, who occupies the lowest baseline, the moral weight of his benefit (pain avoidance) is maximized. Because his suffering is also amplified, the weighted value of sparing him easily swamps the unweighted or lightly weighted benefits of the 1,000 better-off citizens. Consequently, Prioritarianism succumbs to a "Misery Monster" objection: it sacrifices the many to benefit the one, precisely because that one is at the bottom. This treatment is at least as vulnerable to the original objection as CU; the charge was that aggregative theories ignore the separateness of persons by allowing one individual's claims to dominate the collective. Prioritarianism avoids this for the happy monster but embraces it for the miserable one, showing that the structural capacity for one person to swamp the many remains intact.

  **Egalitarianism**
  Telic egalitarianism values reducing inequalities in well-being. Funding Mr. Intensity increases inequality (making the high higher), so egalitarianism rejects it, seemingly avoiding the Utility Monster. However, funding Mr. Misery reduces inequality (raising the lowest), and because his amplification makes the gap-closing effect of the resource massive, egalitarianism mandates prioritizing him over the 1,000. Like Prioritarianism, Egalitarianism falls victim to the reversal: the drive to correct inequality allows a single individual's claim to override the aggregate interests of the many. The theory escapes the Intensity Monster only by embracing the Misery Monster, retaining the structural feature where a single locus of experience dictates the allocation for the entire group.

  **Structural Features**
  For Classical Utilitarianism, the working feature is **linearity** (simple summation). If linearity is removed—for instance, by capping the utility any single person can contribute—the Intensity Monster loses its dominance, but the theory ceases to be classical utilitarianism. For Prioritarianism, the feature is the **concavity of the weighting function**. If this concavity is weakened or capped (limiting how much extra weight the worst-off receive), the Misery Monster's claim diminishes, but the theory loses its distinctive prioritarian force and collapses toward utilitarianism. For Egalitarianism, the feature is the **shape of the inequality measure**. If the aversion to inequality is weakened, the imperative to rescue the Misery Monster over the many fades, but the theory ceases to be robustly egalitarian. In all three cases, the feature that generates the counter-intuitive verdict in one direction is the mathematical engine of the theory; removing it to fix the objection destroys the theory itself.

  **Strongest Prioritarian Reply**
  The strongest reply available to the Prioritarian is to deny that the weighting function behaves symmetrically above and below neutrality. They might argue that while positive utility is subject to diminishing marginal moral value, negative utility (suffering) carries lexical or near-lexical priority, or that amplified suffering constitutes a different *kind* of moral claim than amplified pleasure. They could argue that Mr. Misery's condition triggers a duty of rescue that overrides aggregation, whereas Mr. Intensity's condition does not. However, this reply risks appearing as special pleading engineered to survive exactly this case. If the neural amplification is symmetrical, the *experience* is symmetrical in magnitude; to claim the moral weight is asymmetrical requires a justification external to the weighting function itself. If the justification is simply "suffering matters more," the Prioritarian admits their view is not about weighting well-being symmetrically, but about negative utilitarianism, which faces its own distinct objections.

  **Honest Assessment**
  The reversal succeeds in exposing a structural inconsistency in welfarist alternatives to utilitarianism, but it may fail to convince an opponent whose objection to the Utility Monster is not about aggregation *per se*, but about **fairness and entitlement**. The original objection often relies on the intuition that the Monster has no *right* to consume resources simply because they can feel more. In the Misery Monster case, the intuition shifts toward **rescue**: we feel a stronger duty to prevent extreme suffering than to provide extreme pleasure. If the objector grounds their critique in rights or agent-relative duties of rescue, the symmetry breaks; the Misery Monster has a claim the Intensity Monster lacks. However, if the debate is confined to consequentialist theories of value (where only outcomes matter), the reversal holds genuine pressure. It demonstrates that Prioritarianism and Egalitarianism do not eliminate the "swamping" problem; they merely relocate it from the top of the scale to the bottom. A theory that avoids the Intensity Monster only by becoming vulnerable to the Misery Monster has not solved the problem of one person dominating the many; it has merely chosen which person is allowed to dominate.
