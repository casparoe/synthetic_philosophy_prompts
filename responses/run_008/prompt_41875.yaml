      *   *Disanalogy:* The Utility Monster is objectionable because it seems to violate *separateness of persons* or *fairness* (one person eating everyone's lunch). The Misery Monster case looks like *emergency triage*.
      *   *Intuition:* Saving one person from excruciating torture (even if amplified) vs. giving 1,000 people headaches. Most people *would* save the one.
      *   *Crucial Point:* The Utility Monster objection relies on the intuition that the Monster's gain is *trivial* compared to the many's loss (e.g., Monster gets a cookie, 1,000 lose lives). But the prompt stipulates the magnitudes are such that the Monster's gain *outweighs* the many.
