      *   *Assessment:* This looks like special pleading. Why does the moral weight of suffering saturate while the disvalue of suffering (for the MM) is supposed to be amplified? If the experience is genuinely 1000x worse, why does the moral weight not reflect it? It looks like tweaking the function to avoid the counter-example.

