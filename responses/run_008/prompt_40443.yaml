answer: |-
  Here is a structural plan for your fifty-minute session. It is designed to move from intuition to structure, avoiding economic jargon while preserving economic logic.

  ### I. The Skeleton (Order of Operations)

  Do not start with definitions. Start with the feeling of the problem.

  1.  **The Hook (0:00–0:10):** Introduce the concrete example. Establish the rules of the game. Do not name the problem yet.
  2.  **The Exercise (0:10–0:20):** Run the pencil-and-paper simulation. Let them *feel* the incentive pull.
  3.  **The Diagnosis (0:20–0:30):** Debrief the exercise. Name the "Tragedy." Distinguish between *bad people* and *bad incentives*.
  4.  **The Solutions Spectrum (0:30–0:40):** Discuss fixes. Move from "Police/Owner" to "Community Agreement."
  5.  **The Public Goods Distinction (0:40–0:45):** Briefly contrast the Commons (things that run out) with Public Goods (things that don't).
  6.  **Assessment & Close (0:45–0:50):** The final question and wrap-up.

  **Dependency Logic:** You cannot explain *why* the tragedy happens (Structure) until they have felt *that* it happens (Experience). You cannot propose *solutions* until they agree on the *diagnosis*. You cannot distinguish *Public Goods* until they understand *Commons*.

  ---

  ### II. The Concrete Example: The Shared Fridge

  **Selection:** Choose the **Office Shared Fridge** (or a "Team Lunch" scenario).
  **Principled Justification:**
  To successfully model the Tragedy of the Commons, your example must possess three specific traits and lack one specific trait.
  *   **It Must Have Rivalry:** If I take a yogurt, you cannot have that same yogurt. (The School Bathroom fails here; if I use a stall, I don't "consume" it, and messes are often viewed as vandalism/malice rather than rational consumption).
  *   **It Must Have Non-Excludability:** It is difficult or costly to stop anyone authorized from opening the door. (The Pasture works, but is abstract; the Fridge is immediate).
  *   **It Must Have Rational Actors:** The users must be trying to meet a legitimate need (hunger), not trying to destroy the resource. (The Bathroom often fails here; students assume mess-makers are "jerks," which allows them to moralize the problem rather than structuralize it).
  *   **It Must Lack Infinite Supply:** The resource must deplete.

  **Why the Fridge wins:** It isolates the *incentive*. If a sophomore eats a yogurt labeled "DO NOT TOUCH," they know they are being "bad." If they eat an unmarked yogurt because they are hungry and assume "someone else will bring more tomorrow," they are being *rational*. You need the latter to prove the tragedy is structural, not moral.

  ---

  ### III. Anticipated Misconceptions & Intervention Points

  Here are the misconceptions in the order they will likely arise, and exactly where to head them off.

  **1. "This happens because people are greedy/selfish."**
  *   **When it forms:** During the **Diagnosis (0:20)**. After the exercise, students will blame the groups that took the most points.
  *   **How to head it off:** Ask the "winning" group: *"Did you plan to ruin the game, or did you just want to secure points for yourselves?"* Then ask the "losing" group: *"If you knew others would take points, was it rational for you to take yours?"*
  *   **The Line:** "The tragedy isn't that people are greedy. The tragedy is that even *good* people, trying to feed their families, will empty the fridge if the rules don't stop them."

  **2. "The only solution is to lock the fridge (Privatization) or hire a monitor (State Control)."**
  *   **When it forms:** During the **Solutions Spectrum (0:30)**. This is their civics instinct.
  *   **How to head it off:** Acknowledge these work, but ask about cost. *"Who pays for the lock? Who pays the monitor?"* Then introduce the third option: *"What if the people who use the fridge make a deal?"*
  *   **The Line:** "Rules from above work, but so do agreements from within. If we all agree to label our food and toss old stuff on Fridays, the fridge works without a boss." (This plants the seed of Elinor Ostrom's self-governing commons without naming her).

  **3. "All shared resources are doomed to fail."**
  *   **When it forms:** During the **Solutions Spectrum (0:35)**.
  *   **How to head it off:** Use the counterexample of a family dinner table. *"Does your family run out of food every night because everyone is hungry? No. Why?"* (Because of social norms/trust).
  *   **The Line:** "Commons fail when the group is too big to trust each other. In small groups, reputation acts as the lock."

  **4. "Public Goods are the same thing as Commons."**
  *   **When it forms:** During the **Public Goods Distinction (0:40)**.
  *   **How to head it off:** Explicitly contrast *depletion* vs. *provision*.
  *   **The Line:** "The Fridge is a Commons: it breaks if we use it too much. National Defense is a Public Good: it doesn't break if I use it, but I might not pay for it hoping you will. One is about overuse; the other is about under-funding."

  ---

  ### IV. The Small-Group Exercise: "The Paper Fishery"

  **Time:** 10 Minutes.
  **Materials:** Slips of paper, a bowl, a marker.
  **Setup:**
  1.  Divide the room into 5 groups (representing fishing villages).
  2.  Draw a large circle on the board labeled "Ocean." Write "100 Fish" inside it.
  3.  **Rule 1:** Each group writes down how many fish they want to catch on a slip (0 to 20).
  4.  **Rule 2:** Submit slips anonymously. You will sum them publicly.
  5.  **Rule 3:** If the total catch is $\le$ 100, the ocean replenishes, and they keep their points. If the total catch is $> 100$, the ocean collapses, and *everyone* gets zero points for the round.
  6.  **Run two rounds.**

  **Why this works:**
  *   **Pencil/Paper:** No props to fight over.
  *   **Anonymous:** Prevents "You cheated!" debates. The *aggregate* is the teacher, not the students.
  *   **The Pull:** In Round 1, they will likely collapse the ocean (Tragedy). In Round 2, give them 2 minutes to talk strategy before writing. They will likely self-regulate (Self-Governance).
  *   **The Lesson:** They will feel the tension between "I need points" and "We need an ocean."

  ---

  ### V. What to Openly Decline to Cover

  To stay within 50 minutes and keep the intuition clean, explicitly tell them at the start:
  *"Today we are skipping the complex math and the big political arguments. We aren't doing payoff matrices, we aren't memorizing terms like 'excludability,' and we aren't solving climate change today. We are just looking at the engine that drives those problems."*

  1.  **Formal Payoff Matrices:** They obscure the intuition with algebra.
  2.  **The "Excludability/Rivalry" Matrix:** Use the *descriptions* (hard to stop, runs out) rather than the *labels*. The labels are for economists; the logic is for citizens.
  3.  **Climate Change as the Framing Case:** It is too large and polarized. It triggers despair or ideology. Use the Fridge to teach the *mechanism*, then mention climate change only as a footnote example of the mechanism at scale.

  ---

  ### VI. The Final Assessment Question

  Do not ask "What is the Tragedy of the Commons?" (They will recite a definition).
  Do not ask "How do we fix overfishing?" (They will propose policies).

  **Ask this:**
  > *"Imagine we install a camera in the shared fridge that records everyone who opens it, but we don't change any rules or lock the door. Does this solve the Tragedy of the Commons? Why or why not?"*

  **What this tests:**
  *   **If they say "Yes":** They think the problem is *catching bad people* (Moral Failure).
  *   **If they say "No":** They understand the problem is *incentives*. A camera adds monitoring but no consequence. The incentive to eat the yogurt remains. To solve it, the camera must be linked to a rule (exclusion) or a social agreement (norms). This shows they understand the *structure*, not just the symptom.

  ### VII. A Note on Delivery

  You are a junior, not a professor. Use that. When you run the Fishery exercise, if the ocean collapses, laugh about it. Say, *"I told you, and you still did it."* That moment of shared realization—that *they* just proved the theory—is worth twenty minutes of lecture. Your goal is not to make them economists, but to make them suspicious of systems that rely on perfect behavior.
