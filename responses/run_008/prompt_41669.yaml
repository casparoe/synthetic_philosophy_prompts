answer: |-
  This is a classic philosophical standoff, and it is no surprise it kept you up until 2 AM. You have articulated the two most standard and powerful objections to disjunctivism (specifically, the Naïve Realist variety your flatmate seems to endorse). Your reasoning is logically sound *within the framework of the assumptions you are making*, but your flatmate is likely correct that you are characterizing the view through a lens that disjunctivists explicitly reject.

  To help you prepare for Friday, I will assess your two objections in turn, explain the standard disjunctivist replies, and then address why anyone defends the view despite these difficulties.

  ### Objection 1: The Hallucination Problem
  **Your Claim:** If a hallucination has phenomenal character (it *seems* like seeing a tomato), there must be an object of awareness. If there is no physical tomato, there must be a mental one (a sense-datum). Therefore, disjunctivism covertly relies on sense-data.

  **Assessment:** This is the most common intuition against disjunctivism, but it rests on what disjunctivists call the **Common Kind Assumption**. You are assuming that for a mental state to have a specific "feel" or phenomenal character, it must be constituted by an object of awareness (intentional or otherwise).

  **The Disjunctivist Reply:**
  Disjunctivists (particularly M.G.F. Martin) argue that you have the metaphysics of hallucination backwards. They propose a **Negative Account of Hallucination**.
  *   **The Claim:** A hallucination is not a positive state of awareness *of something* (whether physical or mental). It is merely a state that is *indistinguishable* from a veridical perception.
  *   **The Metaphor:** Imagine a counterfeit bill. A counterfeit bill is not defined by what it *is* (cheap paper and ink); it is defined by its relationship to the real thing (it is indistinguishable from a real bill to the untrained eye). The disjunctivist says hallucination is like the counterfeit. It has no positive nature of its own that explains its phenomenal character; its nature is exhausted by the fact that the subject cannot tell it apart from the real case.
  *   **The Consequence:** They deny your premise that "awareness requires an object." In the hallucinatory case, there is no awareness relation at all. There is only an *appearance* of awareness. By refusing to posit a mental object (sense-datum) to ground the appearance, they claim to avoid the "veil of perception" entirely.

  **Verdict on Objection 1:** Your reasoning is sound if one accepts that phenomenal character requires a constituent (an object). Disjunctivists deny this. They argue that positing a sense-datum is a philosophical mistake inherited from the Argument from Illusion. Whether their "negative account" is satisfying is a matter of intense debate; many philosophers (like you) find it implausible that a conscious experience could lack a positive nature. However, it is not a self-contradiction; it is a deliberate rejection of the sense-datum framework.

  ### Objection 2: The Indistinguishability and Skepticism Problem
  **Your Claim:** Since the subject cannot distinguish the good case (veridical) from the bad case (hallucination), they cannot know which state they are in. Therefore, they cannot claim direct acquaintance with the world, and skepticism wins.

  **Assessment:** This objection targets the epistemic utility of disjunctivism. You are arguing that if I can't rule out the bad case, I don't have knowledge in the good case.

  **The Disjunctivist Reply:**
  This is where John McDowell's version of disjunctivism is most relevant. Disjunctivists argue that you are relying on a **Highest Common Factor** conception of knowledge.
  *   **The Claim:** You assume that for me to have knowledge in the good case, my evidence must be something I also possess in the bad case (a "common factor" like an appearance). Disjunctivists deny this.
  *   **Factive Reasons:** In the good case, my reason for believing "there is a tomato" is the fact *that there is a tomato*. This is a **factive reason** (it entails the truth of the belief). In the bad case, I do not have a reason; I merely have the *impression* of a reason.
  *   **Epistemic vs. Ontological:** Disjunctivists grant that the states are *epistemically* indistinguishable (I can't tell them apart). But they insist they are *ontologically* distinct (they are different kinds of things). The fact that I cannot prove to a radical skeptic that I am not hallucinating does not mean I lack knowledge when I am actually perceiving. It just means knowledge is not "internally certifiable" in the way skeptics demand.
  *   **The Consequence:** Disjunctivism doesn't try to *refute* skepticism by proving we aren't brains in vats. It tries to *dissolve* the pressure of skepticism by arguing that the possibility of error does not degrade the status of successful perception.

  **Verdict on Objection 2:** Your objection correctly identifies that disjunctivism does not offer a *skeptic-proof* guarantee. If your goal is to find a foundation for knowledge that is immune to the possibility of hallucination, disjunctivism fails. However, disjunctivists argue that this goal is misguided. They claim we *do* have direct contact in the good case, and the mere possibility of the bad case doesn't retroactively sever that contact. You are arguing from an internalist epistemology (justification must be accessible); they are arguing from an externalist or disjunctive epistemology (justification depends on the actual relation to the world).

  ### Why Defend Disjunctivism?
  You asked why anyone defends this view if it seemingly requires inner objects and destroys first-person contact. Disjunctivists would argue the exact opposite:

  1.  **Preserving Naïve Realism:** The primary motivation is to save the intuition that perception is a direct openness to the world. If you accept the "Common Kind Assumption" (that veridical and hallucinatory states share a mental core), you are forced to say that even in the good case, the immediate object of awareness is a mental representation, not the world itself. This leads to the "Veil of Perception," where we are trapped inside our own minds. Disjunctivists think this is a high price to pay to accommodate hallucination.
  2.  **Perceptual Knowledge:** As mentioned, McDowell argues that only disjunctivism allows perception to serve as a genuine constraint on thought. If perception is just an inner state, how does it tell us about the outer world? Disjunctivism allows the world itself to be part of the content of experience.
  3.  **Phenomenology:** Many argue that experience *feels* presentational. It feels like we are seeing the tomato, not a picture of the tomato. Disjunctivism takes this phenomenology literally; representationalism treats it as an illusion.

  ### Conclusion: Who is Right?
  You are not "mischaracterizing" the view in a charitable sense; you are accurately describing why many philosophers *reject* it. However, your flatmate is right that you are assuming premises (the Common Kind Assumption and the requirement for internally certifiable knowledge) that disjunctivism is specifically designed to deny.

  *   **On Objection 1:** You are right that the disjunctivist account of hallucination is thin and arguably unsatisfying (the "negative account"). But they are not contradicting themselves; they are biting a bullet to avoid sense-data.
  *   **On Objection 2:** You are right that disjunctivism does not solve skepticism in the traditional sense. But its defenders argue that skepticism arises *from* the assumptions you are using, so refusing those assumptions is the only way to move forward.

  **Advice for Friday:**
  Don't argue that disjunctivism is *self-refuting*. Instead, argue that the cost of accepting it is too high.
  *   Ask your flatmate: "Is it plausible that a conscious experience has no positive nature of its own?" (Attack the Negative Account).
  *   Ask: "If I cannot distinguish the states, in what meaningful sense do I have 'access' to the world that I can rely on?" (Attack the epistemic value).

  You have a strong grasp of the problems. The disagreement now is not about logic, but about which philosophical costs are acceptable: the "Veil of Perception" (your flatmate's fear) or the "Negative Account of Hallucination" (your fear).

  Get some sleep; philosophy is harder at 2 AM.
