      *   *Key Concept:* "Naïve Realism" vs. "Representationalism." Disjunctivism is often paired with Naïve Realism.
      *   *The "Common Kind Assumption":* The user assumes that if two experiences are subjectively indistinguishable, they must share a common mental nature (and thus a common object/constituent). Disjunctivists deny this.
      *   *Assessment:* The user's objection assumes what the disjunctivist denies (that phenomenal character *requires* an object). This is the core battleground. The user isn't necessarily "wrong" logically, but they are assuming a premise (Intentionalism/Sense-Data theory) that disjunctivism is designed to reject.
      *   *Nuance:* Some disjunctivists (like McDowell) might handle this differently than others (like Martin). Martin's "negative account" of hallucination is crucial here: hallucination is defined *only* as what is indistinguishable from veridical perception, not as a positive state with its own constituents.

