      *   *Section 4: The Paralyzed Patient.* This is the weak point. Philosophically, this reveals the law prioritizes *legal defensibility* and *social taboo* over *individual mercy* for that specific subgroup. It treats the physical act as epistemic evidence of will.
      *   *Section 5: Transitioning to the Dutch Model.* What changes? The theory of agency shifts. The doctor becomes the moral agent. The safeguard shifts from "physical ability" to "procedural rigor" (committees). The moral justification shifts from "right to suicide" to "right to mercy."

  8.  **Refining the Philosophical Terminology:**

