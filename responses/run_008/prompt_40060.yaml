      *   *Autonomy-Based Theory:* The core justification for PAD is usually respect for autonomy. But strict self-administration limits autonomy for the physically incapacitated. This suggests a *qualified* autonomy, not absolute.
      *   *Causation/Agency:* Who is the primary cause of death? The law wants the patient to be the *proximate* cause.
      *   *The "Slippery Slope" / Safeguard Theory:* Self-administration acts as a final check. If you can lift the cup, you are physically demonstrating current intent.
      *   *Complicity/Moral Clean Hands:* Doctors want to avoid being "killers." Self-administration keeps their hands technically clean (doing vs. allowing distinction, though the user challenges this).
      *   *Federalism/Controlled Substances Act:* There's a legal layer here too (Gonzales v. Oregon), but the user wants the *moral/philosophical* theory.

  3.  **Analyzing the "Doing/Allowing" Distinction:**

      *   User says: "I don't think that survives scrutiny."
      *   My take: They are right that it's shaky philosophically, but it *is* the dominant legal/moral intuition in US bioethics. The doctor provides the *means*, the patient provides the *act*. This aligns with the common law distinction between aiding suicide and homicide.
      *   Nuance: It's not just "allowing." It's "enabling agency."

  4.  **Analyzing Consistency (The Paralyzed Patient Problem):**

      *   If the goal is autonomy, excluding the paralyzed is inconsistent.
