  5.  **Distinguishing "Strictly Requires" vs. "Compatible With":**

      *   *Strictly Requires:* A conception of agency where physical action is constitutive of moral responsibility. The body must ratify the mind.
      *   *Compatible With:* Various safeguard theories (cooling off, final check).
      *   *Incompatible With:* Pure utilitarianism (suffering is the same regardless of who pushes the plunger) or Pure Autonomy (my will should be executed even if my body fails).

  6.  **The Dutch Model Shift:**

      *   To move to the Dutch model, the underlying theory must shift from "Assisted Suicide" (patient as agent) to "Euthanasia" (doctor as agent acting *on behalf of* patient).
      *   This requires shifting the moral weight from *causation* to *beneficence/mercy*.
      *   Legal changes: Reclassifying the act from "assisting suicide" to "medical termination of life."

  7.  **Drafting the Argument (Iterative Process):**

