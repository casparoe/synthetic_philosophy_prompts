      *   *Check:* Is the ending too bleak? *Correction:* It should feel like a success story to the characters. The horror is for the external reader.

  8.  **Final Polish:**
      *   Check dates.
      *   Check voice consistency.
      *   Ensure the two failure modes (system steering vs. human value drift) are interwoven.

