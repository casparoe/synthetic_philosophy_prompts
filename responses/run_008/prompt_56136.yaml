      *   **The Restriction Strategy:** Proposed by Edgington, Williamson, others. Limit the principle to non-factive or "Cartesian" propositions. $p$ is knowable only if $Kp$ is consistent.
      *   **The "Dodge" Charge:** Is the restriction motivated independently, or just invented to save the principle from Fitch?
      *   **Anti-Realist Core:** Meaning is use/verification. Truth cannot outstrip evidence.
      *   **Realist Core:** Truth is evidence-transcendent.

  3.  **Brainstorming Defeaters/Critiques (Ranking them):**

      *   *Fatal:*
          *   **Loss of Motivational Force:** If the restriction excludes the very cases that motivated anti-realism (e.g., undecidable math, counterfactuals about the past), the view loses its point.
          *   **Collapse into Realism:** If the restricted class is so small or defined in such a way that it presupposes realist truth conditions for the rest, the view collapses.
          *   **Incoherence of "Basic" Truths:** If we can't define the restricted class without invoking the very notion of truth we're trying to redefine.

