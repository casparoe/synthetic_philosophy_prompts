answer: |-
  This is a classic case of philosophical fatigue, and your diagnosis is sharp. When a reading group spends two years on the same impasse, it usually indicates that the participants are no longer disagreeing about the object-level arguments but are instead colliding over meta-philosophical commitments that haven't been made explicit.

  Here is a diagnosis of the impasse, an evaluation of your "planet/weed" hypothesis, and a proposal for what genuine progress might look like.

  ### 1. The Nature of the Impasse: Substantive, Not Verbal

  To answer your first question directly: **The impasse is substantive, but it is substantive at the meta-philosophical level, not the semantic level.**

  It is not merely verbal. If it were verbal, the two sides could agree to use "woman$_A$" (ameliorative) and "woman$_D$" (descriptive) and move on. The fact that they cannot do this reveals that the fight is over *who owns the term*. The word "woman" is not just a label; it is a site of political capital, social recognition, and legal protection. Both sides know that ceding the term means ceding power.

  However, the disagreement is also not purely about the extension of the set "women." It is a disagreement about the **function of philosophy itself**.
  *   **The Ameliorativists** are engaged in *conceptual engineering*. They view philosophy as a tool for social repair. For them, the success condition of a definition is *utility* (does this help us fight oppression?).
  *   **The Descriptivists** are engaged in *conceptual analysis* (or descriptive metaphysics). They view philosophy as a tool for mapping reality. For them, the success condition of a definition is *accuracy* (does this match the shared understanding of the community?).

  When the descriptivist says, "You've changed the subject," they are making a meta-philosophical claim: *Philosophy must track usage.* When the ameliorativist replies, "Usage is contaminated by oppression," they are making a counter-claim: *Philosophy must correct usage.*

  You are stuck because you are trying to solve a political/meta-philosophical conflict with semantic tools. Neither side can concede without abandoning their view of what philosophy is *for*.

  ### 2. Evaluating the "Planet/Weed" Hypothesis

  Your hypothesis—that ameliorativists treat "woman" like **planet** (legislative/stipulative) and descriptivists treat it like **weed** (folk taxonomic)—is a powerful heuristic, but it requires refinement. It captures the *structure* of the authority claim but distorts the *stakes* of the subject matter.

  **Where it captures the structure:**
  You are correct that the ameliorativist relies on a model of expert authority similar to the IAU (International Astronomical Union). They argue that a relevant community (feminist theorists) has the standing to legislate meaning for the sake of theoretical clarity, regardless of folk usage. The descriptivist relies on a model of organic emergence, similar to how gardeners identify weeds. The meaning is constituted by the practice, not by a decree.

  **Where it distorts the stakes:**
  The analogy breaks down because of **agency and identity**.
  *   **Pluto** does not care if it is a planet. It has no interior life or social rights tied to its classification.
  *   **Weeds** do not have a self-conception.
  *   **Women** do.

  This is why the impasse is so intractable. If "woman" were merely a theoretical term like "planet," the ameliorativists would have won long ago by stipulation. If it were merely a functional term like "weed," the descriptivists would have won by pointing to ordinary language.

  The term "woman" is a **social kind term with first-person authority implications**. When you redefine "planet," you change astronomy. When you redefine "woman," you potentially change people's access to resources, their self-understanding, and their social reality. The descriptivists aren't just saying "that's not how we talk"; they are often arguing (sometimes implicitly) that top-down redefinition is a form of epistemic violence that ignores the lived reality of the speakers. The ameliorativists argue that lived reality is already distorted by patriarchy, so tracking it tracks oppression.

  So, your framing relocates the dispute, but not into "natural vs. social kind." It relocates it into **"legislative authority vs. democratic usage."** The question is: Does the feminist theorist have the same right to redefine "woman" that the astronomer has to redefine "planet"? The descriptivists say no, because the consequences of the definition fall on the speakers, not the objects.

  ### 3. Pathways to Progress (or Accepting Stasis)

  Given this diagnosis, another round of "But Haslanger says X" vs. "But intuition says Y" will yield nothing. Here are three ways to potentially break the deadlock, ranked from most to least likely to succeed.

  **A. Distinguish the Contexts of Utterance (The "Register" Move)**
  Progress may come from agreeing that "woman" performs different functions in different contexts.
  *   **Legal/Political Context:** Here, the ameliorative definition may be necessary to draft legislation that protects the oppressed class (e.g., laws against sex-based discrimination).
  *   **Social/Phenomenological Context:** Here, the descriptive definition may be necessary to respect self-identification and social recognition.
  *   **The Test Case:** Ask the group to draft a specific policy (e.g., a shelter for survivors of domestic violence). Would they use the ameliorative or descriptive definition? Often, pragmatism forces a synthesis that abstract theory resists. If they can agree on the *policy* while disagreeing on the *philosophy*, the impasse loses its sting.

  **B. Shift from "Definition" to "Cost-Benefit Analysis"**
  Stop asking "What is the correct definition?" and start asking "What is the cost of this definition?"
  *   **To the Ameliorativists:** What is the political cost of alienating ordinary speakers who don't fit the definition? Does rendering the term "woman" inaccessible to those who identify as women undermine the solidarity needed for politics?
  *   **To the Descriptivists:** What is the political cost of retaining a definition that includes privileged individuals who do not suffer oppression under the term? Does it render the term useless for analyzing power structures?
  *   **The Reframing:** This moves the debate from *truth* (which is binary and stalling) to *strategy* (which is gradient and negotiable).

  **C. Acceptance of "Conceptual Pluralism"**
  You may need to accept that there is no movement because there is no single answer. This is the Cappelen/Plunkett "conceptual engineering" route. Acknowledge that we can have multiple concepts associated with the same word.
  *   We can have a concept WOMAN$_{descriptive}$ for use in sociology and daily life.
  *   We can have a concept WOMAN$_{ameliorative}$ for use in critical theory and structural analysis.
  *   **The Hard Truth:** The reason the group is stuck is likely that both sides want *their* concept to be the *only* legitimate one. Progress requires admitting that the term is essentially contested. If the group can agree to disagree on the *term* while collaborating on the *goal* (e.g., ending misogyny), the semantic debate becomes less urgent.

  ### Summary Diagnosis
  Your group is not stuck on semantics; they are stuck on **authority**. The ameliorativists claim the authority of the theorist to fix broken tools. The descriptivists claim the authority of the community to define their own identity.

  Your planet/weed analogy is structurally sound but misses the normative weight of identity. To move forward, stop trying to solve the definition. Instead, interrogate the *purpose* of the definition in specific contexts. If you cannot do that, you should expect no movement, because the disagreement is not about language; it is about who gets to decide social reality. In that case, the reading group has exhausted the philosophical utility of the debate and has entered the realm of political negotiation, which philosophy alone cannot resolve.
