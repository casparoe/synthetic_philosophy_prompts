prompt: |-
  EU law contains a principle of subsidiarity: in areas of shared competence, the Union may act only where the member states cannot sufficiently achieve the objectives themselves, or where those objectives can better be pursued at Union level given the scale or effects of the action. Enforcement of this principle is largely outsourced to national parliaments: each chamber of a national parliament may send a reasoned opinion objecting that a draft EU law violates subsidiarity, and if at least a third of all chamber-votes across the Union accumulate, the European Commission must review the proposal and justify, amend, or withdraw it. (The Court of Justice can in principle review subsidiarity breaches too, but has essentially never struck a measure down on that ground.) Notice how odd the allocation of guardian roles is: subsidiarity is usually described as protecting member-state autonomy, yet the designated watchdog is the national parliament — an actor the principle never otherwise mentions — rather than the national government that sits in the Council of the EU, or the constituent units' own populations, as in Switzerland, where constitutional amendments require a majority both of voters and of cantons. What theory of political authority does this arrangement presuppose? Does it treat subsidiarity as a comparative-competence principle — an efficiency claim about where scale and effects make action more effective — or as a claim about legitimacy, that decisions belong as close as possible to the demos affected? And why would parliaments, of all actors, be the right custodians of that claim: what view of representation does assigning them the watchdog role presuppose, and is that view consistent with the fact that the same treaties give the ultimate judicial say to a Union-level court? Reconstruct the implicit theory, distinguish what the arrangement strictly requires from what it merely fits well with, and identify where it is underdetermined enough that a different underlying theory would leave the practice standing. Please keep your answer to one page, at most 500 words.
