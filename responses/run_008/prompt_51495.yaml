  This arrangement views national parliaments as dual agents: domestic legislators and guardians of the vertical division of powers. It presupposes that national executives (in the Council) may be complicit in centralization through intergovernmental log-rolling, necessitating a separate legislative check. This separates the "state's voice" (executive) from the "people's voice" (legislature) regarding EU competence. Consequently, subsidiarity functions as a democratic boundary marker.

  The CJEU's retained ultimate jurisdiction suggests subsidiarity is treated as primarily **political**, with legal review as a secondary safeguard. This is consistent with a theory of the EU as a political union where boundaries are negotiated, rather than a strict federal constitution with rigid judicial enforcement. The court's deference implies that political dialogue is the preferred corrective for overreach.

  Distinguishing **requirements** from **fit**:
  Strictly, the mechanism requires only that national legislatures possess institutional independence from their executives and sufficient informational capacity to assess EU drafts. It does not require a theory of strong federalism, as the threshold (one-third) triggers only a review, not a veto.

  The arrangement is **underdetermined** regarding the nature of representation. It fits a theory where MPs represent national *interests* against Brussels, but also fits a theory where they represent universal *democratic standards* within a multi-level system. Crucially, it does not require that national parliaments be the *exclusive* guardians; the CJEU's retained role leaves open the possibility that subsidiarity is ultimately a legal norm. Furthermore, the weak threshold fits a theory of "cooperative sovereignty" where dialogue supersedes hard blocking powers. A stronger theory of state autonomy (like Switzerland's) would require a veto; the EU's design fits a softer theory of "shared competence" where centralization is presumptively valid unless politically contested. Thus, the mechanism sustains a hybrid authority: legitimacy flows from national democracies, but final constitutional authority remains supranational. The system allows for a theory of "executive federalism" (Council dominance) to coexist with a rhetorical commitment to "legislative oversight," leaving the actual balance of authority contingent on political will rather than constitutional necessity.
