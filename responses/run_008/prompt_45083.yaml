answer: |-
  ### Exam Question

  **Question 1.**
  Bertrand's Paradox yields three distinct probabilities (1/2, 1/3, and 1/4) for the proposition that a "randomly chosen chord" of a circle is longer than the side of an inscribed equilateral triangle. 

  (a) Briefly describe the specific physical generation method or sampling procedure corresponding to each of these three values. 
  (b) Critically evaluate the following claim: *"Bertrand's Paradox demonstrates that the Principle of Indifference is logically incoherent and must be abandoned."* In your evaluation, distinguish between the diagnosis that the paradox reveals an internal flaw in the Principle of Indifference versus the diagnosis that it reveals an underspecification of the chance setup. If the latter diagnosis is correct, does this vindicate the Principle of Indifference, or does it suggest that additional constraints (such as Jaynes' principle of transformation groups) are required to do the work Indifference cannot? Note clearly where mathematical consensus ends and philosophical controversy begins.

  ***

  ### Model Answer

  Bertrand's Paradox arises when applying the Principle of Indifference (PoI) to the continuous parameter space of chords in a circle. Mathematically, the derivations of the three probabilities are settled; they result from applying uniform distributions over different parameterizations of the chord space. However, the epistemological lesson remains genuinely contested.

  Regarding part (a), the three probabilities correspond to distinct physical generation methods:
  1.  **1/2 (Random Radial Distance):** A radius is chosen at random, and a point is selected uniformly along that radius. The chord is drawn perpendicular to the radius at that point. The chord exceeds the triangle's side length if the point lies within the inner half of the radius.
  2.  **1/3 (Random Endpoints):** One endpoint of the chord is fixed. The second endpoint is chosen uniformly from the circumference. The chord is sufficiently long if the second point falls within the arc subtended by the triangle's opposite vertex (one-third of the circumference).
  3.  **1/4 (Random Midpoint):** A point is chosen uniformly from the area of the disk to serve as the chord's midpoint. The chord is sufficiently long only if the midpoint falls within the concentric inner circle of half the radius (which has one-quarter of the area).

  Regarding part (b), the claim that PoI is "logically incoherent" represents one philosophical diagnosis, but it is not the only viable one. If one accepts this diagnosis (associated with critics like Keynes), the paradox shows that PoI yields contradictory assignments from the same evidence, rendering it useless for continuous variables without prior measure specification. This suggests PoI must be abandoned or radically restricted.

  However, the alternative diagnosis is that the phrase "randomly chosen chord" fails to specify a unique *chance setup*. On this view (defended by van Fraassen and others), probability is relative to a model. The paradox does not show PoI is incoherent; it shows PoI cannot be applied until the sample space and measure are physically defined. Once the experiment is fixed (e.g., "throw straws from a distance"), only one method applies, and PoI functions correctly within that specific model.

  This distinction determines whether PoI is vindicated. If the problem is underspecification, PoI remains a valid rule for assigning probabilities *given* a fixed parameterization. However, this invites the further question: how do we select the correct parameterization when the physical setup is unknown? Here, consensus dissolves. E.T. Jaynes argued that PoI must be supplemented by symmetry requirements (scale and translation invariance) to uniquely derive the 1/2 solution, effectively saving Indifference by constraining its application. Yet, this is contested. Critics argue Jaynes' invariance principles are themselves substantive assumptions, not purely logical requirements. Therefore, while it is mathematically settled that different measures yield different probabilities, it is philosophically unresolved whether invariance principles can objectively single out one "true" distribution or if the choice remains underdetermined by logic alone.

  ***

  ### Marking Scheme

  **A-Grade Moves (Distinctive of High Performance)**
  *   **Physical Specificity:** Explicitly links 1/2, 1/3, and 1/4 to distinct *generation procedures* (radial distance, endpoint selection, area midpoint) rather than just mathematical parameterizations.
      *   *Pitfall Note:* Students lose marks here if they describe the math (e.g., "uniform on r") without describing the physical act (e.g., "picking a point on a radius").
  *   **Diagnosis Distinction:** Clearly separates the "PoI is broken" thesis from the "Problem is underspecified" thesis.
      *   *Pitfall Note:* Students lose marks here if they treat the underspecification view as simply a restatement of PoI being broken, rather than a defense of its conditional validity.
  *   **Contested vs. Settled:** Explicitly flags that the derivations are mathematically settled while the Jaynes/Invariance resolution is philosophically debated.
      *   *Pitfall Note:* Students lose marks here if they present Jaynes' solution as the definitive answer to the paradox.
  *   **Implication Analysis:** Discusses whether fixing the experiment vindicates PoI or merely shifts the burden to symmetry principles.
      *   *Pitfall Note:* Students lose marks here if they fail to address whether PoI can do the work *alone* once the experiment is fixed.

  **B-Grade Moves (Competent but Standard)**
  *   **Canned Takeaway:** Correctly identifies that PoI gives inconsistent results but relies on the standard "PoI is broken" narrative without exploring the underspecification defense.
  *   **Mathematical Focus:** Describes the three methods primarily in terms of variables (e.g., $d < r/2$) rather than physical setups.
  *   **Consensus Blurring:** Treats the resolution of the paradox as more settled than it is (e.g., "Jaynes solved this").

  **Common Mark Deductions**
  *   **-10%:** Failing to link the probabilities to physical generation methods (treating them as purely abstract integrals).
  *   **-15%:** Presenting one philosophical resolution (usually Jaynes) as the consensus fact rather than a contested proposal.
  *   **-20%:** Reciting the "PoI is incoherent" slogan without analyzing the alternative "underspecification" diagnosis.
