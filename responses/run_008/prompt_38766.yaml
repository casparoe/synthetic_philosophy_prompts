  2.  **Analyze the Candidate's Answer (Sentence by Sentence/Claim by Claim):**

      *   *Claim 1:* "Robbins argued in the 1930s that interpersonal comparisons of utility are impossible."
          *   *Assessment:* Generally correct. Robbins (1932, 1938) argued they are *normative* or *metaphysical*, not scientifically verifiable. "Impossible" is a strong word, but captures the methodological stance (positivism).
          *   *Verdict:* Acceptable simplification.

      *   *Claim 2:* "Utility is a subjective mental quantity, and there is no observation or experiment that could establish that the utility a given sum of money yields one person exceeds the utility it yields another."
          *   *Assessment:* Accurate summary of Robbins's positivist critique.
          *   *Verdict:* Correct.

      *   *Claim 3:* "Since such comparisons cannot be made, they cannot form part of a scientific economics, and welfare economics had to be rebuilt without them."
          *   *Assessment:* Correct historical narrative.
          *   *Verdict:* Correct.

      *   *Claim 4:* "Economists responded in two ways. First, they abandoned cardinal utility altogether and moved to ordinal rankings..."
          *   *Assessment:* Correct. The "Ordinal Revolution."
          *   *Verdict:* Correct.

      *   *Claim 5:* "...Second, they sought criteria that never compare persons: the Pareto criterion approves a change if at least one person gains and nobody loses..."
          *   *Assessment:* Correct definition of Pareto.
