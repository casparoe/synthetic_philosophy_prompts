      *   *Claim 7:* "...and because the compensation is only hypothetical, everyone could in principle be made better off, so the criterion is consistent with Pareto."
          *   *Assessment:* **Problematic.** This is a conflation. Kaldor-Hicks is *not* consistent with Pareto in practice because compensation is *not* paid. If compensation isn't paid, losers lose. It creates a potential Pareto improvement, not an actual one. Furthermore, the Scitovsky paradox shows Kaldor-Hicks can be intransitive/contradictory (A > B and B > A). Saying it is "consistent with Pareto" glosses over the fundamental ethical breach of Kaldor-Hicks (losers actually lose).
