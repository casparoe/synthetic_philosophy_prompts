      *   **Problem:** Stuck on the First Supplement ("Of the Guarantee of Perpetual Peace") in Kant's text. Specifically, the tension between the moral duty to make peace (Definitive Articles) and Nature/Providence guaranteeing it mechanically (First Supplement).
