answer: |-
  This is a sharp, provocative profile. You've clearly identified the distinct components (Internalism about Worth, Sentimentalism about Motive, Consequentialism about Rightness). It's a position worth defending, but you are right to be worried. As it stands, it does not hang together.

  You have constructed an "Impossible Triangle" between claims 3, 4, and 5. One of these legs must break, or the whole structure collapses when poked.

  Here is the consistency check, ranked by severity.

  ### 1. The Fatal Tension: The Impossible Triangle (Claims 3, 4, & 5)
  **Severity: Critical.** This is not a mere friction; it is a logical contradiction.

  *   **The Conflict:**
      *   **Claim 3** says an act is right *only* if it produces the best outcome (Consequentialism). Therefore, the "right-making feature" is *outcome maximization*.
      *   **Claim 4** says moral worth requires acting *because* of the right-making feature. Therefore, to have worth, you must act *because* you are maximizing the outcome.
      *   **Claim 5** describes a neighbor who acts because of local sympathy ("he's right there"), explicitly *not* thinking about the broader calculus of need ("never once thinks about distant need").
      *   **The Crash:** If Claim 3 is true, the neighbor in Claim 5 is likely *not* acting on the right-making feature (since she isn't weighing distant need against local need). If Claim 4 is true, she therefore lacks moral worth. But Claim 5 asserts she has "full moral worth, full stop."
  *   **What has to give:**
      *   **Option A (Drop 4):** You keep Consequentialism and your intuition about the neighbor. You must admit that moral worth does *not* require acting from the concept of the right. Worth attaches to the disposition (sympathy) that *happens* to align with the right, even if the agent isn't tracking the "right-making feature" consciously.
      *   **Option B (Drop 3):** You keep the neighbor's worth and the requirement to act from the right features. You must abandon straight Consequentialism. If "he is sad and near" is a sufficient right-making feature for her act, you are moving toward Virtue Ethics or Particularism.
      *   **Option C (Drop 5):** You keep Consequentialism and the "Right Reason" requirement. You must admit the neighbor is *not* fully admirable. She is merely lucky or acting on a sub-moral impulse. (This aligns with Effective Altruism critiques of local charity).
  *   **The Cost:** Dropping 4 makes your theory of worth less "intellectualist" (which fits your anti-Kantian stance in 2). Dropping 3 changes your entire normative ethics. Dropping 5 makes you look cold and counter-intuitive in a discussion group.

  ### 2. The Epistemic Gap (Claims 1, 3, & 4)
  **Severity: High.**

  *   **The Conflict:**
      *   **Claim 1** says worth is in the will, not the world (outcomes don't determine worth).
      *   **Claim 3** says rightness is in the world (outcomes determine rightness).
      *   **Claim 4** says worth requires acting *because* of what makes the act right.
      *   **The Crash:** How can an agent act *because* of the outcome (Claim 3 + 4) when the outcome is unknown at the time of willing (Claim 1)? If I run to warn the village (Claim 1), I don't know if it will save everyone. If rightness depends on it actually saving everyone, I cannot act "because of the right-making feature" at the moment of action. I can only act because of my *belief* about the outcome.
  *   **What has to give:** You need to distinguish between the *actual* right-making feature (the outcome) and the *perceived* right-making feature (the expected utility). Claim 4 needs to be modified to "acting because of what the agent *believes* makes the act right."
  *   **The Cost:** This weakens Claim 4 significantly. It moves you away from "tracking the truth" of morality to "tracking your own best guess."

  ### 3. The Kantian Ghost (Claims 2 & 4)
  **Severity: Medium.**

  *   **The Conflict:**
      *   **Claim 2** explicitly rejects the Kantian idea that duty must supervise sympathy. You want spontaneous warmth to be the paradigm.
      *   **Claim 4** is structurally Kantian. It demands that the motive be sensitive to the *concept* of rightness ("features that make the act right"). Kant's "duty for duty's sake" is just a specific version of "acting because of the right-making feature."
      *   **The Crash:** You are trying to have a Sentimentalist heart (2) with a Rationalist skeleton (4). If the "feature that makes the act right" is "it maximizes utility" (per Claim 3), then the person in Claim 2 (who never thinks the word duty, or presumably utility calculus) fails Claim 4.
  *   **What has to give:** You need to decouple "moral worth" from "conscious tracking of moral theory."
  *   **The Cost:** You lose the philosophical precision of Claim 4, but you save the intuitive plausibility of Claim 2.

  ---

  ### The "Deck Stacking" Warning
  You asked me to be plain: **Claim 4 is doing too much work, and it is rigged.**

  Claim 4 assumes a transparent pipeline between "What makes an act right" (Metaphysics) and "Why the agent acted" (Psychology). In Consequentialism, this pipeline is broken.
  *   If the right act is determined by a complex global calculus (Claim 3), no human actually acts *because* of that feature in the moment. We act on heuristics, impulses, and local sympathies.
  *   By insisting on Claim 4, you are setting a standard for moral worth that almost no human can meet under your own definition of Claim 3.
  *   This makes Claim 5 (the neighbor) a "stacked deck" intuition pump. You want us to agree the neighbor is good (5), but your own theoretical commitments (3 & 4) dictate she isn't. You are asking the group to accept the intuition while rejecting the theory that evaluates it.

  ### The One Revision
  To clean up the most mess with the least damage to your core intuitions, **drop or radically rewrite Claim 4.**

  **Replace Claim 4 with:**
  > "Moral worth attaches to stable dispositions that reliably tend to produce right acts, even if the agent is not consciously tracking the right-making features in the moment."

  **Why this fixes it:**
  1.  **Saves Claim 2:** Spontaneous warmth is a stable disposition. It counts as worthy.
  2.  **Saves Claim 3:** The disposition is valuable *because* it tends to produce the best outcomes (Consequentialism), even if the agent isn't calculating outcomes.
  3.  **Saves Claim 5:** The neighbor has a sympathetic disposition that usually helps. She gets full worth.
  4.  **Saves Claim 1:** The worth is in the will (the disposition), not the specific outcome of the single act.

  **The Cost:** You lose the "purity" of acting *because* it is right. You admit that moral worth is partly about being a reliable instrument for the good, rather than a conscious philosopher of the good. Given your rejection of Kant in Claim 2, this is a price you should be willing to pay.

  ### Summary for your Discussion Group
  If you go in with the current five claims, expect them to hammer you on the neighbor case (5) vs. the consequentialist requirement (3). They will ask: *"If the best outcome was actually to ignore the beggar and donate the money overseas, was your neighbor's act right? If yes, you're not a consequentialist. If no, does she still have moral worth for doing the wrong thing?"*

  If you adopt the revision above (Dispositional Worth), you can answer: *"Her act might not be objectively right (per 3), but her character has worth because sympathetic dispositions generally maximize the good."* That is a consistent, defensible profile.
