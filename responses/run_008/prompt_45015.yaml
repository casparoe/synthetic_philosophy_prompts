  3.  **Identify Tensions/Conflicts:**

      *   **Tension A: Claim 3 (Consequentialism) vs. Claim 4 (Right-Making Features).**
          *   *Claim 3:* Rightness = Best Outcome (often global, aggregate, impersonal).
          *   *Claim 4:* Worth requires acting *because* of the right-making feature.
          *   *Conflict:* If the right-making feature is "maximizing global utility," does the neighbor in Claim 5 act because of that? No. She acts because "he's right there and moves her."
          *   *Severity:* High. This is the core structural conflict.

      *   **Tension B: Claim 4 (Right-Making Features) vs. Claim 2 & 5 (Sympathy/Particularity).**
