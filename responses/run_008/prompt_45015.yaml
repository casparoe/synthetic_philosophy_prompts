          *   *Conflict:* This is a standard "Rightness vs. Worth" distinction (Separation Thesis). It's not necessarily inconsistent, but it creates a gap. If rightness depends on outcomes, but worth depends on will, then Claim 4 (acting because of right-making features) becomes very hard to satisfy. How do you act "because of outcomes" when you don't know the outcomes yet?
          *   *Severity:* Medium. This is a known philosophical problem (the "esoteric" nature of consequentialist motivation), but manageable.

