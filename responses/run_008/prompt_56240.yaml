answer: |-
  # The Heritability Claim Checklist (HCC)

  **Audience:** Desk Editors and Fact-Checkers
  **Time Limit:** 15 Minutes
  **Goal:** Distinguish valid uses of heritability ($h^2$) from categorical errors.
  **Rule of Thumb:** Heritability is a description of *variance* in a *specific* population at a *specific* time. It is not a measure of individual destiny, nor a bridge between different populations.

  ---

  ## Phase 1: Identify the Claim's Purpose
  *Read the sentence containing the heritability number. What job is the number being asked to do?*

  *   **A. Explain Within-Group Variation:** "In this group, genes explain X% of the differences between individuals."
  *   **B. Explain Between-Group Differences:** "Group A differs from Group B because of genetics."
  *   **C. Predict Individual Outcome:** "This person has the trait because of their genes."
  *   **D. Estimate Policy Response:** "Interventions will/won't work because the trait is heritable."

  **STOP CONDITION:** If the claim is **B** or **C**, proceed immediately to **Phase 2, Test 1**. These are high-risk inferences. If **A** or **D**, proceed to **Phase 2, Test 2**.

  ---

  ## Phase 2: The Validity Tests (Run in Order)

  ### Test 1: The Boundary Test (Within vs. Between)
  *Does the claim use within-group heritability to explain between-group differences?*
  *   **The Science:** High heritability *within* groups (e.g., within Group A and within Group B) tells you **nothing** about why the *average* of Group A differs from the *average* of Group B. (Analogy: Height is highly heritable within two fields of corn, but if one field has poor soil, the average height difference between fields is 100% environmental).
  *   **PASS:** The story explicitly states that within-group $h^2$ cannot explain between-group gaps.
  *   **FAIL:** The story implies that because a trait is heritable within groups, the gap between groups must be genetic.
  *   **STOP CONDITION:** **KILL CLAIM.** This is a categorical logical error. The number cannot support this argument.

  ### Test 2: The Malleability Test (Fixity vs. Variance)
  *Does the claim imply that high heritability means the trait is immutable or that interventions are futile?*
  *   **The Science:** Heritability measures current variance, not biological fixedness. A trait can be 100% heritable but 100% reversible (e.g., Phenylketonuria [PKU] is genetic, but a dietary change eliminates the outcome). Conversely, low heritability does not guarantee an intervention will work.
  *   **PASS:** The story acknowledges that environmental changes can shift the trait mean even if $h^2$ is high.
  *   **FAIL:** The story argues that because $h^2$ is high, policy/medicine/parenting cannot change the outcome.
  *   **STOP CONDITION:** **QUALIFY HEAVILY.** The story must include a counter-example (like PKU or eyeglasses for myopia) or drop the claim that interventions are "futile."

  ### Test 3: The Context Match (Population & Environment)
  *Is the heritability estimate being applied to a population or environment different from the study sample?*
  *   **The Science:** $h^2$ is specific to the population and environment studied. If environmental variance increases (e.g., inequality grows), heritability drops. If environments become uniform, heritability rises. It does not transfer across borders or time periods.
  *   **PASS:** The story notes the estimate applies only to the studied population (e.g., "white twins in Sweden") and warns against generalizing.
  *   **FAIL:** The story applies a heritability estimate from one context (e.g., wealthy nations) to a different context (e.g., developing nations or cross-national comparisons).
  *   **STOP CONDITION:** **QUALIFY.** Add "in this specific population" or "under these specific conditions."

  ### Test 4: The Method Check (Twin Assumptions & Narrow vs. Broad)
  *Does the story acknowledge the limitations of the study design?*
  *   **The Science:**
      *   **Twin Studies:** Assume Identical (MZ) and Fraternal (DZ) twins share environments equally. If MZ twins are treated more similarly, $h^2$ is overestimated.
      *   **Narrow ($h^2$) vs. Broad ($H^2$):** Narrow-sense (additive genetics) predicts response to selection (breeding). Broad-sense includes gene-gene interactions.
  *   **PASS:** The story mentions "estimates vary" or "assumes equal environments."
  *   **FAIL:** The story treats a single twin-study number as a biological constant.
  *   **STOP CONDITION:** **QUALIFY.** Use phrases like "suggests," "estimates indicate," rather than "proves."

  ---

  ## Phase 3: Worked Cases

  ### Case 1: The IQ Gap Claim
  **Claim:** A commentator argues that because IQ heritability is 0.5–0.8 within modern populations, the average test score difference between Group A and Group B must partly reflect genetics.
  **Procedure Run:**
  1.  **Purpose:** Between-Group Difference (Phase 1, Type B).
  2.  **Test 1 (Boundary):** **FAIL.** The claim uses within-group $h^2$ to explain between-group means.
  3.  **Verdict:** **KILL CLAIM.**
  **Editorial Note:** This is the most common misuse in policy debates. However, here is the **inconvenient truth** for your reporters: Killing this claim does *not* prove the gap is environmental. It only proves this *number* cannot be used as evidence. If your reporters write, "This study proves the gap is entirely social," they are committing the reverse fallacy. The checklist forces agnosticism: *This statistic is silent on the cause of the gap.* Your story must reflect that uncertainty, not swap one certainty for another.

  ### Case 2: The Parenting Intervention Claim
  **Claim:** A report cites a twin study showing a behavioral trait (e.g., impulsivity) has $h^2 = 0.6$, arguing that parenting interventions are a waste of money.
  **Procedure Run:**
  1.  **Purpose:** Estimate Policy Response (Phase 1, Type D).
  2.  **Test 2 (Malleability):** **FAIL.** High $h^2$ is treated as immutability.
  3.  **Test 4 (Method):** **FAIL.** Twin studies often inflate $h^2$ if MZ twins share more environment than DZ twins (equal environment assumption).
  4.  **Verdict:** **QUALIFY HEAVILY.**
  **Editorial Note:** You cannot run this claim without a "However." You must explain that $h^2 = 0.6$ leaves 40% variance for environment, and that shared environment (parenting) often matters more in childhood than adulthood. The claim that interventions are a "waste" is unsupported by the statistic.

  ### Case 3: The Cattle Breeding Claim
  **Claim:** An agricultural piece notes dairy cattle milk yield has $h^2 \approx 0.3$, citing this as evidence that selective breeding is hopeless and farmers should rely on feed/veterinary care instead.
  **Procedure Run:**
  1.  **Purpose:** Estimate Policy Response (Phase 1, Type D).
  2.  **Test 2 (Malleability):** **FAIL.** The claim implies moderate $h^2$ means genetics don't matter for selection.
  3.  **Test 4 (Method - Narrow vs. Broad):** **FAIL.** In animal breeding, we care about *narrow-sense* heritability (additive). A value of 0.3 is actually considered moderate-to-high for selection response. It means 30% of the variance is transmissible genetic gain.
  4.  **Verdict:** **KILL CLAIM.**
  **Editorial Note:** This is the **inconvenient truth** for reporters skeptical of genetic arguments. In agriculture, $h^2 = 0.3$ is evidence *for* breeding, not against it. Reporters often instinctively treat "heritable" as "fixed/unchangeable." Here, "heritable" means "responsive to selection." If you kill the politician's claim in Case 1 because genetics isn't destiny, you must also kill this farmer's claim because genetics *is* actionable. Consistency requires acknowledging that heritability is a tool for prediction, not a philosophical statement on fate.

  ---

  ## Phase 4: Limitations of the Procedure

  **What This Checklist Cannot Do:**

  1.  **It Cannot Prove the Opposite:** If a claim fails Test 1 (Between-Group), the checklist tells you the genetic argument is unsupported. It does **not** tell you the environmental argument is proven. It creates a zone of *unknowns*, not a verdict for nature or nurture. Reporters must resist filling that void with ideological certainty.
  2.  **It Cannot Validate the Number:** This checklist assumes the heritability number itself is roughly accurate. It cannot detect if the underlying twin study was flawed, underpowered, or p-hacked. If a study is methodologically unsound, the checklist might "Pass" a claim based on a garbage number.
  3.  **It Cannot Resolve "Gene-Environment Correlation":** The checklist treats genes and environment as separable. In reality, genes often shape environments (e.g., a genetically impulsive child provokes stricter parenting). If a story hinges on this interplay, the checklist is insufficient.
  4.  **When to Call a Geneticist:** If a story passes the checklist but still feels intuitively wrong (e.g., a claim about "gene editing for intelligence"), or if the heritability estimate is being used to justify coercive policy (sterilization, segregation), stop. The checklist validates statistical logic, not ethical permissibility. In these cases, external expert review is mandatory.

  **Final Instruction to Staff:**
  Heritability is a real, useful quantity in its domain (agriculture, medicine, population variance). It is not a general-purpose measure of how "genetic" a trait is in a philosophical sense. Use this checklist to protect the science from the politics, and the politics from the science.
