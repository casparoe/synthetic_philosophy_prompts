          *   *Case 3:* Cattle breeding = hopeless. (Procedure will likely kill this).
          *   *Wait, if I kill all three, where is the nuance?*
          *   *Ah, Case 3:* "cited as evidence that selective breeding is hopeless."
          *   *Science:* $h^2 = 0.3$ is actually *good* for breeding. It means genetics accounts for a significant chunk. So the claim "hopeless" is wrong.
          *   *How to make this inconvenient for reporters?* Reporters might assume "Genetics = Bad/Immutable." If the procedure says "Actually, genetics = actionable via breeding," that challenges the "Genetics = Fatalism" narrative.
          *   *Wait, I need to follow the prompt's cases exactly.*
          *   *Case 1:* IQ Group Differences. (Standard fallacy: Within $\neq$ Between). Verdict: Fail.
          *   *Case 2:* Parenting Waste. (Standard fallacy: Heritable $\neq$ Immutable). Verdict: Fail.
          *   *Case 3:* Cattle Breeding Hopeless. (Standard fallacy: Moderate $h^2$ means environment dominates). Verdict: Fail.
          *   *Wait, if all three fail, is that useful?* Yes, it shows the checklist works.
          *   *But I need an "inconvenient" conclusion.*
          *   *Maybe the inconvenient conclusion is in Case 1:* The procedure might say "You can't rule out genetics entirely, you can only rule out the *inference* from within-group $h^2$." Reporters want to say "It's definitely environment." The procedure says "You can't prove that with this number." That is inconvenient.
          *   *Yes, that's the key.* The procedure prevents the *reverse* fallacy too. Just because the politician is wrong about $h^2$ proving genetic gaps, doesn't mean the reporter can claim $h^2$ proves *environmental* gaps.
          *   *Okay, I will structure Case 1 to highlight this.* The politician is wrong, but the reporter can't claim the opposite certainty either.

  4.  **Refining the Checklist Steps:**
      *   *Step 1: Define the Inference.* (Within, Between, Individual, Intervention).
      *   *Step 2: The Environment Match.* (Same population? Same environment?).
      *   *Step 3: The Fixity Trap.* (Does the claim imply immutability?).
      *   *Step 4: The Study Type.* (Twin/Adoption assumptions).
      *   *Step 5: Narrow vs. Broad.* (Selection response).

  5.  **Drafting the Content:**
      *   *Tone:* Professional, directive, clear, "desk editor" voice.
      *   *Formatting:* Bold headers, clear Pass/Fail/Stop logic.
      *   *Limitations Section:* Crucial. The checklist detects misuse, it doesn't prove truth.

  6.  **Review against Constraints:**
      *   *15-minute usability?* Keep it concise.
      *   *Fixed order?* Yes.
      *   *Stop conditions?* Yes (Qualify vs. Kill).
      *   *Three cases?* Yes.
      *   *Inconvenient conclusion?* Yes (Case 1: You can't use this to prove environment either).
      *   *Limitations?* Yes.

  7.  **Final Polish:**
      *   Ensure the distinction between $h^2$ (narrow) and $H^2$ (broad) is clear but simple.
      *   Ensure the "Within vs. Between" logic is airtight (Lewontin's seed analogy).
      *   Make sure the "Inconvenient" part lands hard in the analysis section.

  *(Self-Correction during drafting)*: I need to be careful with Case 3. The prompt says the claim is "breeding is hopeless." If $h^2$ is 0.3, breeding is *not* hopeless. So the claim is false. Why is that inconvenient for reporters? Maybe it isn't.
  *Alternative:* Maybe the "inconvenient" part is that the checklist forces the reporter to admit that *in the cattle case*, the genetic argument is valid, whereas in the human case, it's not. This highlights the double standard without endorsing it.
  *Better:* The "inconvenient" conclusion is in Case 1. The politician is wrong to say "Genetics causes the gap." But the reporter is *also* wrong to say "This proves Genetics does *not* cause the gap." The checklist forces agnosticism. Reporters hate agnosticism. That is the inconvenient truth. I will emphasize this in the Case 1 analysis.

  8.  **Finalizing the Procedure Steps:**
      1.  **Identify the Claim Type.** (Within-group variance? Between-group difference? Individual prediction? Policy response?)
      2.  **Check Population/Environment Context.** (Is the $h^2$ from the same pop/env as the claim?)
      3.  **Check the "Fixity" Inference.** (Does high $h^2$ imply unchangeable?)
      4.  **Check the Study Design.** (Twin assumptions, Narrow vs. Broad).
      5.  **Final Verdict.**

      *Let's merge some for speed.*
      1.  **Purpose Match:** What is the number doing?
