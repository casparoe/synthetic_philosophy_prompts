  I'm a software engineer with no formal philosophy background — everything I know about philosophy of mind comes from podcasts and late-night Wikipedia rabbit holes, so treat me as intelligent but unarmed. For the past year I have been building a toy architecture in my spare time: a set of specialist modules (something vision-ish, something language-ish, a memory store, a planner) that compete to write into a single shared workspace, with the winning content broadcast back to every module and appended to a transcript the system can later report from. My understanding is that this is roughly the shape of global workspace theory, and that the standard philosophical complaint is that it explains access consciousness — what is globally available for report and control — while remaining silent on phenomenal consciousness, i.e. whether there is anything it is like to be the system at all.

  Two things about my toy keep me up at night. First, a colleague pointed out that my broadcast is just push where pull would do: if I replaced the broadcast with a well-indexed store that modules query on demand, the system's behaviour would be identical, which makes me wonder whether global availability as such is doing any work beyond ordinary database accessibility. Second, the transcript gives the system articulate self-reports about why it did what it did, and I genuinely cannot tell whether the question of whether anything is experienced in there is a further question or a confused one.

