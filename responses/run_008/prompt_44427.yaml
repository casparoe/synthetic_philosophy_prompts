  1. Working definitions
  Access consciousness is information available for reasoning, reporting, and rational control of behavior. Phenomenal consciousness is the subjective quality of experience—the "what it is like" to be the system. The global-workspace family posits that consciousness arises when information is broadcast from specialized modules to a shared, capacity-limited workspace, making it globally available. For the proposition to have a determinate truth value, we must assume phenomenal consciousness is not definitionally excluded from functional explanation; otherwise, the proposition is analytically false. We treat "completed theory" as a mature version resolving current architectural ambiguities, and "sufficient" as meaning the architecture alone instantiates experience without requiring additional biological or physical properties. This frames the claim as a strong functionalist assertion about architecture generating subjectivity. We treat this as an empirical claim.

  2. The decomposition
  1. Is the access/phenomenal distinction ontologically real or merely conceptual? (0.50) If merely conceptual, explaining access explains phenomenality; if real, GWT faces the hard problem. Current philosophical consensus is split, with no empirical method to settle the ontology. I assign equal weight to reflect this stalemate.
  2. Is functionalism true, such that mental states are defined by causal roles rather than substrate? (0.60) If true, silicon architectures can theoretically host consciousness; if false, biology may be required. Most cognitive scientists lean functionalist, but biological naturalists disagree. I weight slightly toward functionalism based on computational success.
  3. Does global broadcast add causal efficacy over on-demand database retrieval? (0.40) Your colleague's critique suggests broadcast is an implementation detail; if so, GWT loses its specific explanatory power. Efficiency gains do not necessarily entail phenomenological gains. I remain skeptical that push mechanisms differ ontologically from pull.
  4. Are articulate self-reports reliable evidence for internal experience rather than sophisticated mimicry? (0.30) Philosophical zombies could generate transcripts without experience, making reports weak evidence for phenomenality. Self-report is the only data we have, yet it is easily simulated. I discount it heavily to avoid false positives.
  5. Is consciousness substrate-independent, allowing non-biological systems to feel? (0.70) Physicalism suggests yes, but biological naturalism argues specific causal powers are needed. Given the lack of evidence for unique biological quantum effects, I favor independence. However, uncertainty remains high.
  6. Will a completed GWT resolve the binding problem better than current models? (0.60) Unity of experience is required for phenomenality; fragmented workspaces may fail to generate a unified subject. Current models struggle with binding disparate modalities seamlessly. A completed theory must solve this to claim sufficiency.
  7. Is the "Hard Problem" a category error dissolvable by better concepts? (0.50) If the gap is linguistic, GWT suffices; if metaphysical, functional architecture cannot bridge it. Illusionists argue the former, realists the latter. I split the difference due to lack of consensus.
  8. Can current computational paradigms scale to human-level integration without new physics? (0.80) If consciousness requires quantum effects or unknown physics, classical software architectures will necessarily fail. No evidence currently demands non-classical physics for cognition. I assign high probability to classical scalability.

  3. The combination
  I compute the final credence by weighing the likelihood of functionalism against the reality of the explanatory gap. If functionalism holds (0.60) and the access/phenomenal distinction is conceptual (0.50), GWT has a high probability (0.80) of sufficiency. However, if the distinction is ontological (0.50), GWT's probability drops to 0.10. Weighting these branches: $(0.60 \times 0.50 \times 0.80) + (0.60 \times 0.50 \times 0.10) = 0.27$. I adjust downward to 0.25 to account for the broadcast critique (0.40) and the weakness of self-report evidence (0.30), which undermine the specific GWT mechanism. This calculation conditions on physicalism being true; if dualism holds, the credence collapses to zero. The result reflects skepticism that architecture alone solves subjectivity. This reflects a pessimistic view of current architectural sufficiency.

  4. Final credence
  My final credence is 0.25. This number reflects a significant doubt that architectural functionalism can bridge the gap to subjective experience, while acknowledging a non-zero chance that the gap is illusory.

  5. The fragile term
  The fragile term is Question 1: whether the access/phenomenal distinction is ontologically real. If neuroscience proves phenomenal states are identical to access states, my credence jumps to 0.60. Conversely, if evidence mounts that qualia exceed functional roles, it drops to 0.05. This binary switch dominates the calculation because it determines whether the Hard Problem exists to be solved. Empirical evidence regarding neural correlates that lack reportability would strengthen the distinction, while successful artificial agents claiming experience without architectural changes would weaken it. This variable acts as the primary gatekeeper for the entire proposition.
