answer: |-
  There is a name for this, though it lives more in philosophy of mind and cognitive psychology than in everyday language. The most precise established concept for what you are describing is **Alief**.

  However, depending on which angle you look at it from, there are two other frameworks that explain the *mechanism* of why it happens. Here is the breakdown of the existing terminology, followed by a coined term if you want something more colloquial.

  ### 1. The Philosophical Term: *Alief*
  Coined by philosopher Tamar Gendler (2008), an **alief** is a mental state that is distinct from belief.
  *   **Belief** is propositional. It is what you assent to as true when you reflect (e.g., "I believe this glass is safe to walk on").
  *   **Alief** is associative and automatic. It is what drives your visceral reaction and behavior (e.g., "I alieve this glass is dangerous" while standing on a skywalk).

  In your example, your relative has updated their **belief** (they assent to the doctor's data). But they have not updated their **alief**. The alief is the automatic association: *Feeling pain → Take pill → Feel better.*

  This explains why they can recite the evidence perfectly (their *belief* system is updated) but continue the behavior (their *alief* system is running the show). It also explains why there is no cognitive dissonance. Dissonance happens when two *beliefs* conflict. When a belief conflicts with an alief, the alief usually wins the behavior without the person feeling the conflict as a logical contradiction. They aren't lying to themselves; they are just operating on a different layer of cognition.

  ### 2. The Psychological Mechanism: *Dual-Process Decoupling*
  If *alief* feels too abstract, cognitive psychology describes this via **Dual-Process Theory** (System 1 vs. System 2) and **Memory Systems**.

  *   **The Update:** Happened in **System 2** (slow, analytical, reflective) and **Declarative Memory** (facts, events, "I remember the doctor saying...").
  *   **The Behavior:** Driven by **System 1** (fast, automatic, heuristic) and **Procedural Memory** (habits, routines, "what I do when my knee hurts").

  You are witnessing a **System 1/2 Decoupling**. The evidence persuaded the analyst (System 2), but it did not retrain the habit loop (System 1). The "old belief" isn't actually living as a belief anymore; it is living as a **habit script**. When pain arises, the script runs before the analyst wakes up. By the time the analyst says, "Wait, we know this doesn't work," the order has already been placed.

  ### 3. The Educational Term: *Inert Knowledge*
  In educational psychology, there is a concept called **Inert Knowledge** (originally Alfred North Whitehead). This is knowledge that a person can recall and state accurately but fails to apply in relevant real-world situations.
  Usually, this applies to math or science facts, but it applies perfectly here. The medical data is *inert*. It exists in their mind as a fact, but it has no "traction" on their decision-making machinery.

  ### Why it is not Akrasia or Self-Deception
  You were right to rule these out.
  *   **Akrasia (Weakness of Will):** Implies a struggle. The person *tries* to act on the knowledge but is overcome by impulse. In your scenario, there is no struggle. The behavior flows smoothly.
  *   **Self-Deception:** Implies active avoidance of the truth. Here, the truth is acknowledged and held.

  ### A Coined Term: *Operative vs. Semantic Belief*
  If you want a term to use in conversation that captures the "where is it living" question without using academic jargon, I suggest distinguishing between **Semantic Belief** and **Operative Belief**.

  *   **Semantic Belief:** What you agree is true in conversation. (Stored in language/logic centers).
  *   **Operative Belief:** What actually governs your choices. (Stored in habit/association centers).

  Your relative has a **Semantic Belief** that the supplement is fake, but an **Operative Belief** that it is real.

  ### Summary: Where is the belief living?
  To answer your final question: *Where is the belief even living in the meantime?*

  It is not living as a belief. **It is living as an association.**

  When they say, "I know what the data says," they are accessing a **fact**. When they order the supplement, they are accessing a **prediction**. Their brain has not updated the prediction model (Pill = Relief), only the fact sheet (Pill = Placebo).

  If you need a single phrase to name this pattern, **"Alief-Belief Decoupling"** is the most accurate technical term. If you want something for everyday use, call it **"Inert Assent."** They have assented to the truth, but that assent is inert; it has no kinetic energy to move their behavior.
