answer: |-
  At a municipal pain clinic, Director Chen holds a fixed budget for a novel neuro-modulator capable of eliminating chronic suffering, divisible between two patients: Elias, who possesses a hyper-reactive reward system that converts the drug into euphoria ten times more intensely than normal, and Mara, whose damaged nerves only register a modest dulling of pain. The crucial difference lies in temporal stability; Elias's brain chemistry aggressively homeostases, erasing the euphoric gains within hours and returning him to baseline misery, while Mara's condition lacks this adaptive feedback loop, allowing her modest relief to persist uninterrupted for the duration of the treatment. Given that hedonistic utilitarianism sums experienced welfare over time rather than ranking peak intensities, the total utility is determined by multiplying the intensity of relief by the duration it persists before baseline reset.

  **Act Utilitarian Conclusion:** The act utilitarian allocates the entire budget to Mara. While Elias generates higher *peak* utility per dose, the integral of his utility over time (Intensity × Duration) is lower because his duration is truncated by rapid adaptation. Mara's lower intensity is compensated by a vastly longer duration, resulting in a greater sum total of hedonic units.

  **Momentary vs. Whole-Life Hedonism:** A hedonist focused solely on momentary experience (maximizing the "best now") would favor Elias, as his peaks are objectively higher. However, standard hedonistic utilitarianism aggregates over whole lives (or the relevant timeframe); because adaptation erodes the *sum* of Elias's experience but not Mara's, the aggregate view flips the verdict to Mara. The Reverse Monster only works under aggregation.

  **The Single Feature:** The operative feature is **rapid hedonic adaptation** (baseline reset). This is the variable that decouples intensity from duration.

  **Delete the Feature:** If you delete adaptation—meaning Elias's intense relief lasts just as long as Mara's moderate relief—the case collapses straight back into the classic Utility Monster. Without the decay function, 10x intensity × Same Duration > 1x intensity × Same Duration, and utilitarianism demands giving everything to Elias.

  **Utilitarian Counterattack:** A sophisticated utilitarian might argue the case rigging overlooks **memory and anticipation**. Even if Elias's *sensory* pleasure adapts, the *anticipation* of the next spike and the *recollection* of past euphoria generate secondary utility streams that Mara's steady state lacks. If these cognitive echoes are counted as genuine hedonic goods, Elias's total aggregate utility might rebound, restoring his status as the preferred recipient despite the adaptation curve.
