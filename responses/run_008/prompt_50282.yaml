  ### The Rule: Selected Effects (Backward-Looking)
  Your sister is distinguishing between **what a trait *does*** (causal role) and **what a trait is *for*** (function). In evolutionary biology philosophy, the dominant rule for "function" is historical:

  > **Rule:** A trait $X$ has a function $F$ if and only if $X$ exists in the organism *because* ancestors of $X$ were naturally selected for doing $F$.

  Here is how this rule reverse-engineers her past verdicts:

  1.  **Cat Kidney (Broken):** **HAS Function.**
      *   *Why:* Even though *this specific token* kidney fails, it belongs to a *type* (mammalian kidney) that was selected for filtering. The history of the *type* confers function to the *token*, even if the token is broken.
  2.  **Whale Pelvis:** **NO Function.**
      *   *Why:* While ancestral pelvises were selected for walking, the *current* whale pelvis type is no longer maintained by selection for walking. The selection pressure is gone; therefore, the function is lost (it is vestigial).
  3.  **Goat Gene (4%):** **HAS Function.**
      *   *Why:* Even though rare, the gene is present *because* selection maintains it (likely balancing selection or recent positive selection). It has an evolutionary "reason" for being there.
  4.  **Dog Tumor:** **NO Function.**
      *   *Why:* Tumors are somatic errors. They were not selected for; they are accidents. Even if they causally *do* something (secrete hormones), they lack the historical pedigree of selection. They are "noise," not "signal."
  5.  **Deer Scent Gland:** **HAS Function.**
      *   *Why:* This is an **exaptation**. It started as a byproduct (no function), but once selection co-opted it for territory marking, it *acquired* a function. The history of selection for marking is now present.

  ### Why the Mouse is the Split Point
  The mouse case is the classic "intuition pump" used in philosophy of biology seminars to break the Selected Effects theory apart from its rival, the **Causal Role Theory** (Forward-Looking).

  *   **Causal Role Theory (Forward-Looking):** Function is whatever a part *currently contributes* to the system's capacity.
      *   *Prediction:* **YES.** The mutation *does* digest sugar. It contributes to the mouse's survival. It has a function.
  *   **Selected Effects Theory (Backward-Looking):** Function requires a history of selection.
      *   *Prediction:* **NO.** This is a *de novo* mutation. It has zero history. It has not been selected for yet. It is a "promising accident," similar to the tumor, but in the germline. Until this mutation spreads and is maintained by selection in the population, it is biologically "invisible" regarding function.

  Given her harsh stance on the tumor (which *did* something) and the whale pelvis (which *had* a history but lost it), she prioritizes **Selection History** over **Current Utility**. A new mutation has no history. Therefore: **No Function.**

  ### The Tie-Breaker Question
  If you want to be absolutely certain she isn't smuggling in a "Forward-Looking" clause (e.g., "Function is what *will* be selected"), or if you want to pressure her on the consistency of the Whale vs. Kidney verdict, ask her this:

  > **"Consider a human trait like the 'startle reflex' or 'craving salt.' In our modern environment, these often cause accidents or hypertension (actively harmful). Do they still have the function of protecting us / regulating balance?"**

  *   **If she says YES:** She is a strict **Selected Effects** theorist. History trumps current benefit. (This confirms the Mouse = No verdict).
  *   **If she says NO:** She is a **Forward-Looking / Fitness** theorist. Function requires current benefit. (This would imply the Mouse = Yes, and she is inconsistent with the Kidney verdict, where the kidney had *no* current benefit but kept its function).

  ### The "Inconsistency" Loophole
  If she tries to wiggle out and say the Mouse *does* have a function, she will likely try to distinguish between **Somatic** (Tumor) and **Germline** (Mouse) mutations.
  *   *Her Argument:* "Tumors die with the dog. The mouse mutation is heritable; it's the *seed* of a new function."
  *   *Your Counter:* "But the Goat Gene was only in 4% of the herd. At what percentage does a mutation stop being a 'seed' and start having a 'function'? Is it 5%? 10%?"

  **Summary for the Dinner:**
  Bet on **No Function**. Her case law relies on **ancestral selection**, not current performance. The mouse has no ancestors with that trait, so the trait has no function *yet*. It is merely a causal effect waiting to become a function.

  **Winning Move:** If she hedges, hit her with the **Salt Craving** question. If she admits a harmful, selected trait still has a function, she concedes that History > Current Benefit, and you win the milkshake on the Mouse verdict.
