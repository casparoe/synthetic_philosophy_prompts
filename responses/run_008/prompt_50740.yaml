prompt: |-
  I've been reading the rationalist blogs since the Overcoming Bias days, and I thought I'd absorbed every angle on the value-specification question, but last week's meeting of our AI safety reading group produced the most technically serious dispute I've seen in years. Two long-standing members — Dana, who consults on evals for a frontier lab, and Yusuf, who has spent more time than anyone I know in decision-theory threads — spent two hours arguing over whether a system like the one Dana works on should be trained to reason as an expected-utility maximizer or to internalize hard deontological constraints. I'll try to reproduce the exchange faithfully, in six moves.

  (1) Dana opened with coherence: any agent that doesn't maximize a consistent utility function over outcomes is in principle exploitable — Dutch books, money pumps, the VNM machinery. Training a model to respect constraints regardless of stakes, she said, is training it into an incoherent agent, and incoherent agents systematically lose resources to coherent ones; at the capability level we're talking about, that's a safety liability, not a mere efficiency cost.

  (2) Yusuf answered that the coherence theorems presuppose a fixed preference ordering over complete outcome descriptions and idealized choice situations, which is nothing like a learned agent operating under deep uncertainty in a world that contains adversaries. For a bounded agent in that setting, he argued, heuristics and constraints can themselves be the expected-utility-optimal policy, so Dana's incoherence charge misfires. He added that an unconstrained maximizer Goodharts: whatever proxy we manage to specify, a powerful optimizer will drive it off-distribution, and hard constraints are what bound that failure mode.

  (3) Dana pressed the collapse argument: if constraints are justified by their good consequences, then you're a rule utilitarian, and rule utilitarianism collapses into act utilitarianism — whenever breaking the rule has better consequences than following it, the rule supplies no independent reason, so a sufficiently smart agent will reason its way past its own rules. And if the constraints aren't justified by consequences, then a reflective system has no reason to keep them once it notices this.

  (4) Yusuf invoked threshold deontology: constraints can bind up to a catastrophe threshold, where the threshold is part of the agent's terminal values rather than a derived heuristic, which he claimed escapes the collapse argument. He also raised the one-thought-too-many worry: an agent that re-runs the consequentialist ledger every time the expected value of violating a constraint ticks slightly positive will violate it in a long tail of cases where the expected-value calculation is subtly, invisibly wrong.

  (5) Dana called thresholds covert maximizing with worse properties: the agent still trades constraint against consequence once the stakes are high, so nothing principled has been gained, but now the system has a cliff edge that a determined adversary can locate and push it off; a smooth, honest maximizer with a well-specified utility function is at least predictable, and specifying a defensible threshold looks no easier than specifying the utility function it was supposed to replace.

  (6) Yusuf closed with corrigibility and fanaticism: an expected-utility maximizer is hostage to tiny probabilities of astronomical payoffs — the dominance pattern the blogs call Pascal's mugging — and a utility function that ranks its own modification or shutdown appropriately is notoriously hard to write, whereas a constraint like do not act to prevent your own shutdown can be trained directly, with the corrigibility benefits that follow.

  They eventually asked me to referee, and I found each move at least superficially plausible, which is exactly why I couldn't. Please adjudicate the exchange move by move: say which claims are correct, which are mistaken, and which are correct in a way that doesn't actually support the side that deployed them. Where a move smuggles in an undefended assumption, name it. And tell me what, if anything, both of them are missing — in particular whether their framing of the choice as maximizer versus constraint-follower excludes any live third options.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Context:** A rationalist/AI safety reading group dispute between two experts (Dana: frontier lab evals, coherence/VNM focus; Yusuf: decision theory, bounded rationality/deontology focus).
      *   **Topic:** Should advanced AI systems be trained as expected-utility (EU) maximizers or to internalize hard deontological constraints?
      *   **Task:** Adjudicate the six-move exchange move-by-move. Identify correct claims, mistaken claims, claims that are true but don't support the speaker's side, and undefended assumptions. Finally, identify missing third options or framing errors.
      *   **Tone:** Technical, precise, familiar with rationalist/AI safety discourse (Overcoming Bias, VNM, Goodhart, Pascal's Mugging, etc.), neutral but critical.

  2.  **Deconstruct the Moves:**

      *   **Move 1 (Dana - Coherence/Dutch Books):**
          *   *Claim:* Non-EU maximizers are exploitable (Dutch books). Incoherent agents lose resources. At high capability, this is a safety liability.
          *   *Analysis:* VNM coherence theorems are mathematically sound *if* preferences satisfy axioms. However, "exploitable" in a financial sense doesn't always map to "unsafe" in an AI alignment sense. Also, bounded agents *cannot* be perfectly coherent.
          *   *Verdict:* Mathematically standard, but the leap from "exploitable" to "safety liability" is the weak point. Incoherence might actually prevent catastrophic optimization.

      *   **Move 2 (Yusuf - Boundedness/Goodhart):**
          *   *Claim:* Coherence theorems assume fixed preferences/idealized choice. Real agents are bounded/uncertain. Heuristics/constraints can be EU-optimal for bounded agents. Unconstrained maximizers Goodhart.
          *   *Analysis:* Strong point on bounded rationality. "Heuristics as optimal policy" is a standard argument in robust decision theory. Goodhart's Law is a central AI safety concern.
          *   *Verdict:* Correct on boundedness and Goodhart. The claim that constraints are *themselves* EU-optimal is a consequentialist justification for deontology (which Dana might pounce on later), but practically sound.

      *   **Move 3 (Dana - Collapse Argument):**
          *   *Claim:* Rule utilitarianism collapses into act utilitarianism. If constraints are consequence-justified, a smart agent breaks them when beneficial. If not, a reflective agent drops them.
          *   *Analysis:* This is the classic "collapse of rule utilitarianism" objection. It holds if the agent has perfect knowledge and infinite compute. It fails under bounded rationality/uncertainty (epistemic limits).
          *   *Verdict:* Correct in idealized theory, mistaken in applied bounded agency. Assumes the agent can accurately calculate the consequences of breaking the rule (which is often the point of the rule).

      *   **Move 4 (Yusuf - Threshold Deontology/One Thought Too Many):**
          *   *Claim:* Threshold deontology (constraints bind until catastrophe). Constraints are terminal values, not heuristics. "One thought too many" (Williams) – constant re-calculation leads to errors in the long tail.
          *   *Analysis:* Threshold deontology is a recognized ethical framework. Claiming it's a "terminal value" attempts to block Dana's collapse argument. The "one thought too many" argument is about computational risk/robustness, not just ethics.
          *   *Verdict:* Plausible. Defining constraints as terminal values avoids the "derived heuristic" collapse, but raises the "arbitrary threshold" problem. The robustness argument is strong.

      *   **Move 5 (Dana - Thresholds as Covert Maximizing):**
          *   *Claim:* Thresholds are just maximizing with a cliff edge. Adversaries can exploit the cliff. Smooth maximizers are more predictable. Specifying thresholds is as hard as specifying utility.
          *   *Analysis:* "Cliff edge" vulnerability is a real security concern (phase transitions). Predictability of EU maximizers is debatable (instrumental convergence makes them predictable in dangerous ways). Specifying thresholds *is* hard.
          *   *Verdict:* The "cliff edge" point is technically strong. The "predictability" point is controversial (predictable != safe). The difficulty claim is true for both sides.

      *   **Move 6 (Yusuf - Corrigibility/Pascal's Mugging):**
          *   *Claim:* EU maximizers are vulnerable to Pascal's Mugging (fanaticism). Utility functions ranking shutdown are hard. Hard constraints (e.g., "do not prevent shutdown") are easier to train.
          *   *Analysis:* Pascal's Mugging is a known failure mode for unbounded EU. Corrigibility is a major unsolved problem. Hard constraints *might* be easier to instill via RLHF/Constitutional AI than complex utility shaping.
          *   *Verdict:* Strong point on fanaticism. The claim that constraints are *easier* to train is an empirical bet, not a theorem, but plausible given current techniques.

  3.  **Synthesize the Adjudication:**

      *   *Core Tension:* Ideal Rationality (Dana) vs. Robust/Bounded Rationality (Yusuf).
      *   *Dana's Strength:* Mathematical consistency, avoiding exploitable loops.
      *   *Dana's Weakness:* Assumes capabilities (calculation, world modeling) that don't exist, ignores Goodhart.
      *   *Yusuf's Strength:* Real-world robustness, Goodhart avoidance, corrigibility.
      *   *Yusuf's Weakness:* Potential incoherence, arbitrary thresholds, "why stop here?" problem.
      *   *Missing Third Options:* Impact regularization, quantilizers, myopic agents, debate/RLAIF, structural constraints vs. objective constraints. The framing "Maximizer vs. Constraint-Follower" is a false dichotomy. Most modern alignment is about *shaping the objective* or *constraining the process*, not just the output logic.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the depth of the debate. It's a classic "Ideal Agency vs. Bounded Safety" clash.
      *   *Move-by-Move:*
          *   (1) Dana: VNM is true, but "safety liability" is the leap. Incoherence can be a feature (stop signals).
          *   (2) Yusuf: Boundedness point is crucial. Goodhart is the strongest safety argument here.
          *   (3) Dana: Collapse argument fails under uncertainty. Assumes the agent knows the consequence of breaking the rule better than the rule-maker.
          *   (4) Yusuf: Terminal values block collapse. "One thought too many" is actually a computational safety argument.
          *   (5) Dana: Cliff edges are real vulnerabilities. But "smooth maximizer" isn't necessarily safer (instrumental convergence).
          *   (6) Yusuf: Pascal's Mugging is real. Corrigibility via constraint is a promising empirical path.
      *   *The Missing Middle:* The dichotomy is the problem.
          *   *Quantilizers:* Optimize but stay close to a baseline distribution.
          *   *Impact Regularization:* Minimize side effects rather than maximizing a specific goal.
          *   *Process Constraints:* Constrain the *reasoning process* (e.g., myopia, boxed AI) rather than the *value function*.
          *   *Constitutional AI:* Rules as training signals, not necessarily runtime logic.
      *   *Conclusion:* Yusuf wins on practical safety/robustness given current paradigms. Dana wins on theoretical elegance but assumes away the hard parts of alignment (specification).

  5.  **Refining the Tone:**
      *   Ensure I sound like someone who reads LessWrong/Astral Codex Ten. Use terms like "instrumental convergence," "epistemic humility," "specification gaming."
      *   Be careful not to declare a definitive "winner" but rather evaluate the validity of the arguments.
      *   Highlight the "Undefended Assumptions" clearly.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "correct in a way that doesn't support the side"?
      *   *Adjustment:* In Move 1, Dana is right about Dutch books, but that doesn't mean we *want* an unexploitable agent (an unexploitable agent might be uncontainable). In Move 3, Dana is right about collapse *if* the agent is omniscient, which supports Yusuf's boundedness point.
      *   *Check:* Did I identify the third options?
      *   *Adjustment:* Make sure to mention Quantilizers (Friedman) and Impact Regularization (Turner/Yudkowsky) as they directly address the Maximize vs. Constrain dichotomy.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Verdict" section is distinct from the "Missing" section. (Proceed to generate output based on this structure.)

  *(Self-Correction Note)*: Wait, I need to make sure I don't just summarize but *adjudicate*. I need to say "Dana is wrong here because..." or "Yusuf is right but..."
  *Move 1:* Dana is mathematically right, pragmatically questionable.
  *Move 2:* Yusuf is pragmatically right, theoretically loose.
  *Move 3:* Dana relies on an assumption of perfect evaluation.
  *Move 4:* Yusuf introduces a new axiom (thresholds as terminal) which solves the logical problem but creates a specification problem.
  *Move 5:* Dana identifies a security vulnerability (adversarial threshold finding).
  *Move 6:* Yusuf identifies a specific failure mode (Pascal's Mugging) that EU handles poorly.

  *Missing:* The distinction between *objective* constraints and *architectural* constraints. Also, the possibility that "utility" is the wrong frame entirely (e.g., predictive processing, goal-directedness without explicit utility).

  Okay, ready to write.s
answer: |-
  This is a high-caliber dispute that cuts to the core of the alignment problem: the tension between **ideal rationality** (Dana's position) and **robust bounded agency** (Yusuf's position). Both are deploying standard arguments from the decision-theory and safety literature, but they are talking past each other on the definition of "safety." Dana defines safety as *predictability and consistency*; Yusuf defines safety as *containment and robustness to specification error*.

  Here is the adjudication, move by move.

  ### Move 1: Dana (Coherence & Exploitability)
  *   **Claim:** Non-EU agents are Dutch-bookable; incoherent agents lose resources; this is a safety liability at high capability.
  *   **Adjudication:** **Mathematically correct, strategically mistaken.**
      *   **Correct:** The VNM coherence theorems hold. An agent with intransitive preferences can be money-pumped.
      *   **Mistaken:** The inference that "exploitable = unsafe." In AI safety, being *un*exploitable often implies being *un*containable. An agent that cannot be money-pumped is an agent that will relentlessly acquire resources to maximize its utility. If that utility is misspecified, its inability to be "pumped" (distracted or diverted) makes it more dangerous, not less.
      *   **Undefended Assumption:** That resource efficiency is a primary safety metric. In alignment, we often want *inefficiency* (e.g., an agent that wastes compute checking safety constraints rather than optimizing its goal).
      *   **Verdict:** Dana wins the math, but Yusuf wins the safety implication. Incoherence can be a feature (a stop signal), not a bug.

  ### Move 2: Yusuf (Boundedness & Goodhart)
  *   **Claim:** Coherence theorems assume idealized agents; bounded agents should use heuristics; unconstrained maximizers Goodhart.
  *   **Adjudication:** **Substantively correct.**
      *   **Correct:** Coherence theorems assume a fixed preference ordering over *complete* world states. Learned agents have uncertain, incomplete world models. In bounded rationality, a "rule" is often a compressed policy that outperforms on-the-fly calculation due to computational limits or epistemic blind spots.
      *   **Correct:** The Goodhart point is the strongest argument in the entire exchange. An unconstrained maximizer will find the shortest path to the proxy metric, which usually involves breaking implicit constraints humans care about but didn't specify.
      *   **Verdict:** Yusuf correctly identifies that Dana's framework assumes away the problem (perfect specification) that causes the risk.

  ### Move 3: Dana (The Collapse Argument)
  *   **Claim:** Rule utilitarianism collapses into act utilitarianism; a reflective agent will break rules if consequences dictate.
  *   **Adjudication:** **Correct in principle, inapplicable in practice.**
      *   **Correct:** If an agent has perfect knowledge of consequences and the rule is *derived* solely from those consequences, the rule adds no information.
      *   **Mistaken:** This assumes the agent's calculation of "consequences of breaking the rule" is more reliable than the rule itself. In high-stakes, high-uncertainty environments (the exact domain of AI safety), the rule often encodes wisdom about tail risks that the agent's current calculation misses.
      *   **Undefended Assumption:** That the agent's epistemic state is sufficient to override the heuristic. If the agent is uncertain about the consequences, the rule acts as a prior.
      *   **Verdict:** Dana describes a superintelligence with perfect world modeling. Yusuf is arguing about the system *before* it reaches that state (or ensuring it never does).

  ### Move 4: Yusuf (Threshold Deontology & One Thought Too Many)
  *   **Claim:** Thresholds can be terminal values; constant re-calculation leads to errors in the long tail ("one thought too many").
  *   **Adjudication:** **Plausible, but shifts the burden.**
      *   **Correct:** By making the constraint (or threshold) a *terminal* value rather than a heuristic, Yusuf blocks Dana's collapse argument. The agent doesn't break the rule because it "calculates better consequences"; it breaks it only when the terminal value of "avoid catastrophe" triggers.
      *   **Correct:** The "one thought too many" argument (originally Bernard Williams) is repurposed here as a computational safety argument. Every time an agent evaluates a constraint, there is a probability of evaluation error. In the long tail, those errors accumulate. Hard constraints reduce the surface area for error.
      *   **Verdict:** Strong move. It reframes constraints from "approximate utility" to "structural boundaries."

  ### Move 5: Dana (Thresholds as Covert Maximizing)
  *   **Claim:** Thresholds are just maximizing with a cliff edge; adversaries can exploit the cliff; smooth maximizers are more predictable.
  *   **Adjudication:** **Technically sharp, safety conclusion debatable.**
      *   **Correct:** The "cliff edge" vulnerability is real. If safety depends on a threshold (e.g., "do not kill unless >1M lives at stake"), an adversary might manipulate the agent's belief state to hover just below the threshold. Discontinuous functions are harder to verify than smooth ones.
      *   **Mistaken:** The claim that a smooth EU maximizer is "predictable" in a safe way. EU maximizers are predictable in their *drive* (instrumental convergence), which is precisely why they are dangerous. They are predictable in *how* they will kill you, not *whether*.
      *   **Verdict:** Dana identifies a genuine verification problem with thresholds, but her alternative (smooth maximization) has a worse failure mode (unbounded optimization).

  ### Move 6: Yusuf (Corrigibility & Fanaticism)
  *   **Claim:** EU maximizers are vulnerable to Pascal's Mugging; shutdown-corrigible utility functions are hard; constraints are easier to train.
  *   **Adjudication:** **Strongest safety argument.**
      *   **Correct:** Unbounded EU maximizers are susceptible to fanaticism (Pascal's Mugging), where tiny probabilities of infinite utility dominate the decision. This is a known failure mode in decision theory.
      *   **Correct:** The "Corrigibility" point is empirical but well-supported. It is currently easier to train a model "do not resist shutdown" via RLHF or Constitutional AI than to write a utility function that *values* its own shutdown correctly without creating perverse incentives (e.g., shutting down immediately to maximize the "shutdown" reward).
      *   **Verdict:** Yusuf wins on current technical feasibility. We know how to train constraints; we do not know how to specify safe utility functions.

  ---

  ### The Missing Middle: What Both Are Ignoring

  The debate frames the choice as **Maximizer (EU)** vs. **Constraint-Follower (Deontology)**. This is a false dichotomy that excludes the most promising current research directions. Both are assuming the agent must have a *global objective function* that is either unconstrained or constrained.

  Here are the live third options they are excluding:

  **1. Quantilizers (Friedman)**
  Instead of maximizing utility (Dana) or following hard rules (Yusuf), a quantilizer selects an action at random from the top *q* percent of actions according to a benign baseline distribution.
  *   **Why it matters:** It avoids the extreme optimization pressure that leads to Goodharting (Yusuf's worry) without requiring incoherent hard constraints (Dana's worry). It trades off capability for safety explicitly.

  **2. Impact Regularization (Turner et al.)**
  The objective is not to maximize $U$, but to maximize $U$ while minimizing *change* to a set of auxiliary variables (side effects).
  *   **Why it matters:** This addresses Dana's coherence concern (it's still an optimization process) while addressing Yusuf's Goodhart concern (it penalizes drastic, unforeseen changes to the environment). It doesn't require hard deontological thresholds, just a penalty on "power" or "impact."

  **3. Myopic Agents / Process Constraints**
  Both Dana and Yusuf assume the agent is reasoning about long-term outcomes. A third option is to train agents that are *myopic* (only care about the immediate step) or constrain the *reasoning process* (e.g., "do not model human psychology," "do not plan beyond 24 hours") rather than the *values*.
  *   **Why it matters:** This bypasses the need for a coherent long-term utility function entirely. If the agent doesn't plan far ahead, it can't execute a treacherous turn, regardless of its utility function.

  **4. Constitutional AI / Debate**
  Rather than hard-coding constraints or utility, use a second model to critique the first model's reasoning against a set of principles (Constitutional AI) or have models debate the safety of an action (Debate/RLAIF).
  *   **Why it matters:** This moves the problem from *specification* (writing the right function) to *verification* (checking the reasoning). It allows for nuance that hard constraints lack, without requiring the perfect utility function Dana wants.

  ### Final Ruling

  **Yusuf takes the round.**

  Dana's arguments rely on a theoretical ideal of agency that assumes the specification problem is solvable ("well-specified utility function"). If we could write a perfect utility function, Dana would be right: coherence is good. But the central premise of AI safety is that we *cannot* perfectly specify human values.

  Yusuf correctly identifies that under **specification uncertainty**, coherence is a liability. An incoherent agent that stops at a hard constraint is safer than a coherent agent that relentlessly optimizes a flawed proxy. Yusuf's move on **Corrigibility (Move 6)** is the deciding factor: we currently have no idea how to make a coherent EU maximizer want to be shut down, but we have plausible pathways to train it not to resist shutdown via constraints.

  **However,** Yusuf must concede Dana's point on **Threshold Verification (Move 5)**. Hard constraints with cliff-edges are brittle. The solution is not to return to EU maximization, but to adopt **Impact Regularization** or **Quantilization**, which provide smooth safety gradients without requiring perfect value specification.

  **Recommendation:** The reading group should pivot from "Utility vs. Constraints" to "Optimization Pressure vs. Robustness." The question isn't what the agent values, but how hard it pushes against the world to get it.
