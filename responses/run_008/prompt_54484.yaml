      *   *Conflict:* If I tell them to minimize paper, they will tear.
      *   *Better:* No stated goal. Just "The Protocol."
      *   "In this procedure, there is one restriction: Do not tear your card. There is one consequence: If you do not tear, the System tears five."
      *   Let them feel the pull of the Restriction vs. the Consequence.
      *   Most will follow the Restriction because it's an instruction from authority + social norm.
      *   Then reveal the math.

