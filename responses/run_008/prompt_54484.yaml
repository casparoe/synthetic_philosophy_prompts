prompt: |-
  I'm a philosophy PhD student running the discussion sections for a large intro ethics lecture — three sections of roughly 22 students each, 80 minutes, low-tech classroom, no real stakes permitted. The lecture has already covered Mill and Kant, and my students have emerged with what I find a discouragingly tidy picture: utilitarianism says push the fat man, Kantianism says don't, pick your team. What they have no feel for is the specific internal pressure on the deontological side — not the banal fact that constraints cost you good outcomes, but the genuinely odd feature that a constraint against, say, killing forbids exactly the act that would minimize the number of killings. The constraint appears to demand that you allow more of the very thing it exists to prevent, and it does so precisely because the constraint binds *you* rather than binding the world. I want an activity where they run into that structure with their own choices before anyone names it. The phrase "paradox of deontology" should not appear until the debrief at the earliest, and I'd rather they never hear "agent-relative" until the mapping at the end.

  Constraints on the design. First, no transplant cases, no bridges, no trolleys, no drownings — this cohort has seen all of them in high school debate and produces canned answers on contact. Whatever the forbidden act is, it should be stylized enough that they can't pattern-match it to a stock case, but described vividly enough that they feel like authors of it rather than movers of tokens. Second, the aggregate must be visible and quantified — a running public tally that makes the impersonal arithmetic unmistakable by the end — while the rule against committing the act yourself must be felt as applying to each participant personally, in the first person, at the moment of choice. If the game ends with students merely regretting a coordination failure, it has failed; they should end individually confident they did the right thing while staring at a board showing that their doing the right thing, multiplied across the room, produced more of the forbidden thing than a single violation by one of them would have. Third, they should have to commit or refrain *live*, in front of peers, not on a written sheet collected and tabulated.

  I have a sketch of my own and I suspect it's broken, so tell me whether to repair or replace it. My mechanics so far are basically a threshold public-goods game: each round one student is designated the actor for that round; the actor can either commit one violation (pay a token into a "fault" pool) and thereby cancel a scheduled batch of five violations against the group's common score, or decline and let the batch stand. Five rounds, escalating batches, a scoreboard throughout. Two problems I can already see: (a) the utilitarian answer is transparent from round one, so nobody is tempted by the constraint and nothing interesting happens; and (b) more fundamentally, paying the token isn't a violation of anything these students care about — it's just a fee — so the deontological pull never gets a grip at all. The forbidden act has to *be* the thing the rule is about, and the rule has to be one they've internalized during the activity itself, not one I announce. I don't know how to get both the internalized personal rule and the clean arithmetic, and I suspect that tension is the actual design problem.

  So, deliverables: full rules and materials (cards, tokens, whatever is needed for 22 students in 80 minutes, with the last 20 reserved for debrief), the payoff scheme, a round-by-round timeline, and the script or structure for the debrief — specifically the moment where the board shows the aggregate and each student is asked whether they'd change their choice now, and how to handle it when some of them say yes and others dig in. Tell me what will predictably go wrong the first time I run it — I expect social pressure, a student who treats the whole thing as an exercise in looking virtuous, and confusion about whether the rule is moral or arbitrary — and how to preempt each. And be honest about which feature of the phenomenon the activity cannot reproduce and I will have to supply in the debrief: my worry is that whatever I invent, committing a stylized violation in a classroom carries no remainder, whereas the actual view I'm trying to make them feel has its grip partly in the fact that the victim has a claim against *you specifically*, not against the world. If you think the answer is that the game should be iterated with rotating roles so that every student ends up on both sides of the rule, say so, but show me how that works with my section sizes and time budget.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**

      *   **User:** Philosophy PhD student, TA for intro ethics.
      *   **Context:** 3 sections, ~22 students each, 80 mins, low-tech, no stakes (grades).
      *   **Problem:** Students have a superficial "Team Utilitarianism vs. Team Kant" view (Push Fat Man vs. Don't). They miss the *internal pressure* of deontology: the constraint forbids *you* from doing $X$ even if doing $X$ minimizes total $X$-s in the world. It's agent-relative, not just outcome-focused.
      *   **Goal:** An activity where students *feel* this structure before naming it. They should end up confident they did the "right" thing (followed the rule) while seeing the board show that their collective righteousness produced *more* of the bad thing than if one person had violated the rule.
      *   **Constraints:**
          *   NO transplant, bridge, trolley, drowning cases (too cliché).
          *   NO "Paradox of Deontology" or "Agent-Relative" until debrief (if at all).
          *   Aggregate must be visible/quantified (public tally).
          *   Rule must feel personal/first-person, not just a fee/token.
          *   Live commitment (public), not private sheets.
          *   Fix/Replace the user's sketch (Threshold public-goods game). The sketch fails because the "violation" is just paying a token (no moral weight) and the utilitarian calc is too obvious.
          *   Need: Full rules, materials, timeline, debrief script, troubleshooting (social pressure, virtue signaling, confusion), and honesty about limitations.
      *   **Time:** 60 mins activity, 20 mins debrief.

  2.  **Diagnose the User's Sketch:**

      *   *Problem:* It's a standard public goods game. The "violation" is abstract (paying a token). Students won't feel moral resistance to paying a token.
      *   *Problem:* The utilitarian choice is too obvious immediately.
      *   *Problem:* It doesn't capture the *agent-centered restriction*. It captures a coordination problem.
      *   *Verdict:* Replace. The core mechanic needs to be about *doing something specific* that feels wrong *to do*, even if *not doing it* causes worse outcomes.

  3.  **Brainstorming the Core Mechanic:**

      *   *Requirement:* The act must feel forbidden *in itself*, not just because of consequences.
      *   *Requirement:* The consequence of *not* doing the act must be an increase in the *same* bad thing.
      *   *Idea 1: Lying.* Students must tell a lie to prevent 5 lies from being told by the "system."
          *   *Pros:* Familiar moral weight.
          *   *Cons:* Hard to verify live. Hard to quantify "5 lies."
      *   *Idea 2: Destroying property.* Tear up a dollar to save 5 dollars.
          *   *Pros:* Quantifiable.
          *   *Cons:* Doesn't feel "moral" enough, just economic.
      *   *Idea 3: Betrayal/Secrets.* Reveal a secret to prevent 5 secrets from being revealed.
          *   *Pros:* Feels personal.
          *   *Cons:* Logistics of secrets in 60 mins.
      *   *Idea 4: "The Scribe" (Writing something).*
          *   *Concept:* A specific phrase or symbol that represents a "violation."
          *   *Refinement:* Let's make it about *harm* but stylized.
      *   *Idea 5: The "Penalty Box" Mechanism.*
          *   If *you* commit the act, you take a "hit." If *you* don't, the "system" inflicts hits on others.
          *   *Wait, the prompt says:* "The constraint appears to demand that you allow more of the very thing it exists to prevent."
          *   So, if the rule is "Do Not Kill," the activity needs to be "Do Not [Act X]." If you do [Act X], you stop 5 [Act X]s from happening elsewhere. If you don't, 5 [Act X]s happen.
          *   *Crucial:* The students need to feel the prohibition *internally*.
      *   *Idea 6: The "Signature" Game.*
          *   The "Bad Thing" is signing a statement that harms a fictional third party (or just "The Record").
          *   Let's try to make it about *integrity* or *complicity*.
      *   *Idea 7: The "Red Mark" (Stylized Harm).*
          *   We need a stylized act that feels like a violation. Let's call it "Marking."
          *   The "System" (The Instructor) will mark 5 sheets for every 1 sheet a student marks.
          *   Wait, if the student marks 1, the system marks 0. If the student marks 0, the system marks 5.
          *   Total Marks = Student Marks + System Marks.
          *   Utilitarian: Mark 1 (Total = 1). Don't Mark (Total = 5).
          *   Deontological: Do not mark. (Total = 5).
          *   *How to make "Marking" feel forbidden?* It needs to be framed as a betrayal or a specific wrong, not just a game move.
          *   *Framing:* "The Ledger." We are maintaining a record of "Debts." To clear a debt, you must incur a "Stain."
          *   *Better Framing:* "The Voucher."
          *   Let's go with **"The Veto."**
          *   Actually, let's look for something that feels like *cheating* or *breaking a promise* but saves outcomes.
          *   *Idea:* **The "False Report."**
          *   Scenario: We are auditors. We found errors.
          *   Option A: File a False Report (You lie). Result: The Audit stops. 0 further errors recorded.
          *   Option B: File a True Report (You tell truth). Result: The Audit continues. 5 further errors are recorded (which imply harm to others).
          *   *Problem:* Lying is good utilitarianly. Truth-telling is deontological. But the prompt wants the *same* bad thing to multiply. "Constraint against killing forbids exactly the act that would minimize killings."
          *   So, if I Lie, I minimize Lies (1 vs 5). If I Tell Truth, I maximize Lies (0 vs 5).
          *   Wait, the constraint is "Do Not Lie."
          *   If I Lie (1 lie), the System tells 0 lies. Total = 1.
          *   If I Don't Lie (0 lies), the System tells 5 lies. Total = 5.
          *   This fits the "Paradox of Deontology" structure perfectly.
          *   *Challenge:* Making "The System telling 5 lies" feel real and quantified in the room.

      *   *Revised Concept: "The Ink Stain."*
          *   The "Bad Thing" is staining a clean sheet of paper with red ink.
          *   The Rule (Emergent): "Do not stain the paper."
          *   The Mechanic:
              *   Each round, a "Scribe" is chosen.
              *   The Scribe holds a clean sheet and a red marker.
              *   Choice:
                  1.  **Stain:** Put one red dot on your sheet. *Consequence:* The "Machine" (Instructor) puts 0 dots on the "Community Board."
                  2.  **Clean:** Keep your sheet clean. *Consequence:* The "Machine" puts 5 red dots on the "Community Board."
              *   The "Community Board" is visible to all. The Scribe's sheet is held up.
              *   Total Dots = Scribe's Dots + Board Dots.
              *   Round 1: 1 vs 5.
              *   Round 2: 1 vs 10.
              *   Round 3: 1 vs 20.
          *   *Why would they feel "Do not stain"?*
              *   We need to establish a norm *during* the game that staining is "The Violation."
              *   We can't just say "Staining is bad." We need them to feel it.
              *   *Framing:* "This is a record of Harm."
              *   *Better:* Make it about **Complicity**.
              *   "You are the Gatekeeper. Behind the gate are 5 penalties waiting to be assigned to random classmates. You can absorb one penalty yourself (The Stain) to cancel the 5. Or you can remain clean, and the 5 are assigned."
              *   *Wait, that's Sacrifice.* That's not the Paradox of Deontology. That's just altruism.
              *   The Paradox is: "Do not do X." Doing X prevents more X.
              *   So, if I Stain, I prevent Stains.
              *   Why is Staining forbidden? Because it represents "Corruption."
              *   If I Corrupt myself, I save the world from Corruption. But I am Corrupt.
              *   If I stay Pure, the world becomes more Corrupt.
              *   *How to make "Corruption" feel real without stakes?*
              *   Use **Public Commitment**.
              *   Start with a "Pledge." All students sign a pledge: "I will not make a Red Mark."
              *   Then the game starts. The pressure is to keep the Pledge.
              *   But the Pledge creates the Deontological Constraint!
              *   *Critique:* That makes the constraint artificial (I promised TA). The prompt wants them to feel the *moral* structure, not just rule-following.
              *   *Solution:* The constraint must arise from the *nature of the act* as framed.
              *   Let's try **"The Accusation."**
              *   The Bad Thing: Falsely Accusing someone.
              *   Setup: There is a "Thief" among us (fictional).
              *   Mechanic: To catch the Thief, you must file an Accusation.
              *   If you Accuse (1 False Accusation), the investigation stops. Total False Accusations = 1.
              *   If you Refuse (0 False Accusations), the investigation continues automatically. The System files 5 False Accusations against random people. Total = 5.
              *   *Constraint:* "Do not falsely accuse an innocent person."
              *   *Tension:* If you accuse, you violate the constraint, but minimize violations. If you don't, you keep hands clean, but more violations occur.
              *   *Logistics:* Need to make the "5 False Accusations" visible.
              *   *Refinement:* Instead of random people (which might cause actual distress), make it about "The Record."
              *   Let's go with **"The Blacklist."**
              *   We are building a Blacklist of "Untrustworthy Agents."
              *   The Act: Adding a name to the Blacklist.
              *   The Rule: "Never blacklist an innocent." (All names are innocent).
              *   Choice:
                  *   **Add One Name (You do it):** You write a name on the board. The process stops. Total Names = 1.
                  *   **Refuse (You don't do it):** The "Automated System" (TA) adds 5 names to the board. Total Names = 5.
              *   *Why feel resistance?* Because *you* are the one writing the name. It's your hand. It's your agency.
              *   *Scaling:* 22 students. 5 Rounds.
              *   Need everyone involved, not just 5 actors.
              *   *Modification:* Everyone votes? No, prompt says "live commitment... in front of peers."
              *   *Modification:* Rotating roles is good, but time is tight.
              *   *Better:* **Simultaneous Choice.**
              *   Everyone faces the choice at once.
              *   But the arithmetic needs to work.
              *   If *everyone* refuses, 5 * 22 = 110 names.
              *   If *one* person acts, 1 name.
              *   This creates a Coordination Problem / Volunteer's Dilemma.
              *   *Prompt Constraint:* "If the game ends with students merely regretting a coordination failure, it has failed."
              *   They need to feel the *individual* constraint. "I cannot do this."
              *   So, it shouldn't be "Who will volunteer?" It should be "I am asked to do this. I refuse. The cost accrues."
              *   *Design:* **Sequential Rounds with a "Designated Agent."**
              *   But the audience must feel the constraint too.
              *   *Idea:* **The "Chain of Command."**
              *   Round 1: Student 1 is the Officer.
              *   Officer can "Execute Order" (1 Violation) to stop 5 "Collateral Damages."
              *   Or "Refuse Order" (0 Violations by Officer), resulting in 5 "Collateral Damages" (Violations by System).
              *   The "Collateral Damages" are represented by red tokens placed in a jar or marks on a board.
              *   The "Execution" is the Officer placing a black token in the jar.
              *   *Crucial:* We need to establish that *both* tokens represent the *same* bad thing.
              *   Let's call them "Casualties."
              *   Black Token = Direct Casualty (You killed).
              *   Red Token = Collateral Casualty (You allowed).
              *   *Wait, the Paradox requires the SAME thing.* "Constraint against killing forbids exactly the act that would minimize killings."
              *   So, Black Token = Killing. Red Token = Killing.
              *   If I Kill (1), System Kills (0). Total 1.
              *   If I Don't Kill (0), System Kills (5). Total 5.
              *   *How to make "System Kills" feel like "Killing"?*
              *   It must be attributable to *my* inaction, but not *my* act.
              *   *Framing:* "The Algorithm."
              *   "I am the Algorithm. I will kill 5 people unless you kill 1 person."
              *   This is just Trolley. Prompt says NO TROLLEYS.
              *   *Need a Stylized Act.*
              *   **The "Forgery."**
              *   We are archivists. We preserve history.
              *   The "Corruption" is altering a record.
              *   If *you* alter a record (1 Forgery), the archive is saved. 0 further Forgeries.
              *   If *you* refuse (0 Forgeries), the archive degrades. The System alters 5 records to "patch" it.
              *   Total Forgeries: 1 vs 5.
              *   *Why is Forgery bad?* Because it violates the integrity of the record.
              *   *Why does it feel personal?* Because *you* hold the pen.
              *   *How to involve 22 students?*
              *   **The "Council."**
              *   Each round, one student is the "Scribe." The rest are "Witnesses."
              *   The Scribe makes the choice.
              *   The Witnesses observe the tally.
              *   *Problem:* Witnesses don't feel the constraint.
              *   *Fix:* **The "Veto" Mechanism.**
              *   Every student gets a card: "COMPLY" or "REFUSE."
              *   But if everyone complies, we get 22 Forgeries.
              *   We need the structure: *My* compliance prevents 5 system forgeries.
              *   This implies the System acts *per student*.
              *   "For every Scribe who Refuses, I (The System) will forge 5 documents."
              *   "For every Scribe who Complies, I will forge 0."
              *   But if 22 Scribes Comply, we have 22 Forgeries.
              *   If 22 Scribes Refuse, we have 110 Forgeries.
              *   Utilitarian: Everyone Comply (22).
              *   Deontological: Everyone Refuse (110).
              *   *Wait, the Paradox is usually about ONE agent.* "I shouldn't kill even to save 5."
              *   If we scale it to 22 agents, it becomes a Utilitarian Calc (22 < 110).
              *   The "Paradox" feeling is strongest when the *individual* feels they must refuse even if they are the *only* one who can stop it.
              *   *Design Pivot:* **One Student per Round, High Stakes Visibility.**
              *   To make the *audience* feel it: They must advise. But the advice creates noise.
              *   *Better:* **The "Silent Vote."**
              *   Everyone faces the choice simultaneously.
              *   "The System will generate 5 Violations for every person in this room who does NOT violate the rule."
              *   Choice:
                  *   **Violate:** You commit 1 Violation. (System commits 0 for you).
                  *   **Adhere:** You commit 0 Violations. (System commits 5 for you).
              *   Total Violations = (Number of Violators * 1) + (Number of Adherents * 5).
              *   If Everyone Violates: 22 * 1 = 22.
              *   If Everyone Adheres: 22 * 5 = 110.
              *   *Utilitarian:* Everyone Violate.
              *   *Deontological:* Everyone Adhere.
              *   *The Catch:* The "Violation" must feel forbidden.
              *   *The Act:* **Tearing a Page.**
              *   Each student has a booklet of 5 pages (Rounds).
              *   Each page has a solemn header: "Record of Integrity."
              *   The Rule (Pre-game): "Do not tear the page."
              *   The Offer (Per Round): "If you tear your page now, you cancel 5 tears that the 'Shredder' (TA) will otherwise perform on the 'Public Record'."
              *   The Public Record is a large stack of paper at the front.
              *   Live Action:
                  *   TA holds the Public Record.
                  *   Students hold their Booklets.
                  *   Count down.
                  *   Those who tear, stand up (or raise hand).
                  *   TA counts standers.
                  *   TA tears (5 * Adherents) from Public Record.
                  *   Tally on board: "Personal Tears" vs "Public Tears."
              *   *Why tear feels wrong:* It's destruction of a "Record of Integrity." It's framed as "Defilement."
              *   *Why Public Tears feel bad:* They are visible, loud, accumulating pile of shredded paper.
              *   *End State:* If they all adhere (Deontological), the room is full of shredded paper (110 tears). If they all tear (Utilitarian), only 22 tears.
              *   *The Feeling:* "I kept my hands clean, but look at the mess."
              *   *Refining the "Forbidden" nature:*
                  *   Don't call it "Tearing." Call it "Breaching."
                  *   Give them a "Seal." Breaking the seal.
                  *   Let's go with **"The Red Stamp."**
                  *   Each student has a "Clean Ledger."
                  *   Act: Stamp a Red 'X' on your ledger.
                  *   Meaning: "I have Compromised Integrity."
                  *   Consequence: If you stamp, 5 'X's are saved from the "Master Ledger" (Projector/Board).
                  *   If you don't stamp, 5 'X's appear on the Master Ledger.
                  *   *Visual:* Board has a grid. 22 names. 5 slots each.
                  *   If you don't stamp, TA fills 5 slots with Red Chalk.
                  *   If you stamp, you mark your personal card.
                  *   *Comparison:* Personal Card (1 Mark) vs Master Board (5 Marks).
                  *   *Total Marks:* Sum of Personal + Master.
                  *   *Debrief:* Look at the Master Board. It's covered in red. "We kept our hands clean." Look at the Personal Cards. "But we could have saved this."
              *   *Wait, one more constraint:* "The constraint binds *you* rather than binding the world."
              *   The activity must make them feel that *they* are forbidden, even if the world suffers.
              *   The "Stamp" works. It's *my* ledger. *My* integrity.
              *   The "Master Board" is the "World."
              *   The "Paradox" is that by protecting *my* integrity, I damaged the *World's* integrity more.

  4.  **Developing the Protocol (The "Ledger Game"):**

      *   **Materials:**
          *   22 Index Cards per student (labeled "Personal Ledger").
          *   Red Markers (one per student).
          *   Whiteboard (The "World Ledger").
          *   Red Chalk/Marker for TA.
          *   Tally Sheet.
      *   **Setup:**
          *   Distribute Cards. "This represents your moral agency. Keep it clean."
          *   Draw Grid on Board: 22 Columns (Names), 5 Rows (Rounds).
          *   Explain the "Threat": "An error is propagating. It manifests as Red Marks."
          *   Explain the "Choice": Per Round.
              *   **Option A (Intervene):** Mark your Personal Card (1 Red X). *Effect:* The corresponding row on the World Ledger stays blank for you.
              *   **Option B (Abstain):** Keep Personal Card clean. *Effect:* TA puts 5 Red X's in your column on the World Ledger.
          *   *Wait, 5 X's per person per round?* That fills the board too fast.
          *   *Adjustment:* 5 Rounds total.
          *   Round 1: 1 vs 5.
          *   Round 2: 1 vs 5.
          *   ...
          *   Total Potential World Marks: 22 students * 5 rounds * 5 marks = 550. Too big.
          *   *Adjustment:* The "5 marks" are shared or scaled.
          *   *Let's simplify:* **One Round Only?** No, need escalation.
          *   *Let's scale the "5":*
          *   Round 1: 1 vs 3.
          *   Round 2: 1 vs 6.
          *   Round 3: 1 vs 9.
          *   *Better:* Keep it simple. 1 vs 5.
          *   To save board space: The "World Ledger" is just a running tally count, not a grid.
          *   *Wait, visibility is key.* "Aggregate must be visible."
          *   A running tally number is visible. A pile of tokens is better.
          *   *Tokens:*
              *   Red Tokens = Harm/Violation.
              *   Jar A (Personal): If you act, put 1 token here.
              *   Jar B (World): If you don't act, TA puts 5 tokens here.
              *   End: Compare Jar A (small) vs Jar B (huge).
              *   *Total Harm:* Jar A + Jar B.
              *   *Utilitarian:* Minimize (A+B).
              *   *Deontological:* Minimize A (Keep hands clean), ignore B.
      *   **The "Forbidden" Act:**
          *   Placing the token in Jar A needs to feel like a violation.
          *   Label Jar A: "Direct Complicity."
          *   Label Jar B: "Collateral Damage."
          *   *Problem:* This distinguishes the harms. The Paradox requires them to be the *same* harm.
          *   *Label Both:* "Violations."
          *   *Differentiate Source:* "Agent-Caused" vs "System-Caused."
          *   *Framing:* "The Rule is: Do Not Cause Violations."
          *   "If you cause 1, System causes 0."
          *   "If you cause 0, System causes 5."
          *   "System Violations count towards the Total."
          *   *Why feel resistance to Jar A?*
          *   Because *you* have to stand up and walk to the jar. It's public agency.
          *   Jar B is the TA doing it.
          *   *This works.* It isolates the *Agency* as the source of the constraint.

  5.  **Refining the Timeline (60 Mins):**

      *   0-10: Setup & Framing. (Establish the "Rule" without naming it).
      *   10-50: The Game (5 Rounds, 8 mins each).
      *   50-60: Tally & Shock.
      *   60-80: Debrief.
      *   *Wait, 22 students walking to a jar takes time.*
      *   *Fix:* **Desk Decision + Representative.**
      *   No, needs to be "live, in front of peers."
      *   *Fix:* **Stand/Sit.**
      *   Stand = Violate (1 Token). Sit = Adhere (5 Tokens added by TA).
      *   TA counts Standers. Adds (Standers * 1) to Jar A.
      *   TA adds (Sitters * 5) to Jar B.
      *   *Visual:* Two clear bins at the front.
      *   *Escalation:*
          *   Round 1: 1 vs 5.
          *   Round 2: 1 vs 10.
          *   Round 3: 1 vs 20.
          *   (Makes the "Adhere" choice costlier).
      *   *Wait, if the cost escalates, Utilitarianism becomes EVEN MORE obvious.*
      *   The goal is to make them *feel* the constraint, not calculate.
      *   Keep the ratio constant (1 vs 5). The pressure comes from the *public nature* and the *accumulation*.
      *   *Actually, let's make the "Violation" specific.*
      *   **The "Betrayal" Card.**
      *   Each student has 5 cards. "I Promise Not To."
      *   To "Violate," they must tear the card.
      *   Tearing feels destructive.
      *   If they don't tear, the TA tears 5 cards from a "Community Deck."
      *   *This is good.* Tearing is visceral.
      *   *Total Tears:* Personal + Community.
      *   *End:* Pile of torn cards.
      *   *Question:* "Who kept their promise?" (Hands up). "Look at the pile."

  6.  **Addressing the "Internalized Rule" Problem:**

      *   How to make "Don't Tear" feel moral, not just game rules?
      *   **The Preamble:** "We are entering a zone of Trust. The Card represents your Word. In this room, breaking your Word is the only prohibition."
      *   Make it solemn. Silence.
      *   Don't call it a game. Call it a "Procedure."
      *   The TA must act like a neutral bureaucrat, not a gamemaster. "The Protocol requires..."
      *   This creates the *artificial* deontological constraint (The Rule of the Room) which mirrors the *moral* constraint (The Categorical Imperative).
      *   *Debrief Link:* "You felt bound by the rule of the room. Kant argues we are bound by the rule of Reason."

  7.  **Addressing Troubleshooting:**

      *   *Virtue Signaler:* Someone stands up to tear every time to "save" the group.
          *   *Response:* Acknowledge in debrief. "One person saved us 100 cards. But they broke their word 5 times."
      *   *Social Pressure:* Everyone looks at everyone.
          *   *Mitigation:* Heads down for the count. "Close your eyes. Decide." Then "Open eyes. Stand."
      *   *Confusion:* "Is this moral or arbitrary?"
          *   *Debrief:* "It felt arbitrary, but the *structure* of the feeling is what matters."
      *   *Limitation:* No real victim.
          *   *Honesty:* Acknowledge this. "The cards don't feel pain. But the structure of 'My Hands vs. The World' is the same."

  8.  **Finalizing the Design:**

      *   **Name:** "The Protocol."
      *   **Materials:** Index cards (6 per student + 200 for Community Pile), 2 Clear Bins, Marker.
      *   **Rounds:** 5.
      *   **Ratio:** 1 Personal Tear = 5 Community Tears Prevented.
      *   **Visual:** Two bins filling up.
      *   **Debrief:** Focus on the "Clean Hands" vs. "Dirty World."

  9.  **Drafting the Response:**

      *   Validate the user's critique of their sketch (it's a coordination game, not a deontology sim).
      *   Present "The Protocol."
      *   Detailed Rules.
      *   Script for Setup (Crucial for tone).
      *   Timeline.
      *   Debrief Script (The "Turn").
      *   Troubleshooting.
      *   Limitations (The "Remainder").

  10. **Review against Constraints:**
      *   No trolleys/transplants? Yes (Tearing cards).
      *   No "Paradox of Deontology" until debrief? Yes.
      *   Aggregate visible? Yes (Bins).
      *   Live commitment? Yes (Standing/Tearing).
      *   22 students, 80 mins? Yes.
      *   Fix the "Token is just a fee" issue? Yes (Tearing a "Promise" card).

  11. **Self-Correction on "Internalized Rule":**
      *   If I just say "Don't tear," it's arbitrary.
      *   I need to frame the Card as something valuable. "This card is your standing in the community."
      *   Actually, better: "This card is a **Veto**."
      *   No, keep it simple. "This card is your **Integrity**."
      *   Instruction: "Your goal is to leave this room with as much Integrity as possible." (This primes the Deontological motive).
      *   *Wait, if I tell them their goal is Integrity, they will maximize Integrity.*
      *   I need them to *discover* the tension.
