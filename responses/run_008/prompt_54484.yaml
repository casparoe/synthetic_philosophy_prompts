answer: |-
  Your diagnosis of your own sketch is correct: it is a coordination game with a fee, not a simulation of agent-centered restrictions. The "token" has no moral texture, and the "utilitarian answer is transparent" problem means students will treat it as a math puzzle rather than a moral tension. To get the *Paradox of Deontology* (the idea that I am forbidden from doing $X$ even to prevent more instances of $X$), the activity must make the **agency** the source of the prohibition, while making the **outcome** the source of the pressure.

  Here is a complete replacement design. It uses a stylized act of "breaking a promise" to simulate the deontological constraint, and a visible accumulation of "broken promises" to simulate the outcome.

  # Activity Title: "The Protocol"

  ### Core Concept
  Students are participants in a bureaucratic procedure. They hold a "Pledge Card." The Rule is: **Do not tear your card.** The Consequence is: **If you keep your card, the System tears five cards.**
  *   **The Act:** Tearing your own Pledge Card.
  *   **The Constraint:** The instruction "Do not tear" (internalized as a norm of integrity).
  *   **The Paradox:** Tearing your card (1 violation) prevents the System from tearing cards (5 violations). Keeping your card clean (0 violations by you) results in more total violations (5 by the System).

  ### Materials (Low-Tech)
  *   **Pledge Cards:** 6 stiff index cards per student (140 total). Pre-printed with: *"I maintain the Integrity of this Room."*
  *   **Community Deck:** 200 identical index cards in a box at the front.
  *   **Two Clear Bins:** Label one **"AGENT"** (front center), one **"SYSTEM"** (front side).
  *   **Whiteboard:** For tallying rounds.
  *   **Markers/Chalk:** Red for the "SYSTEM" bin count.

  ### Timeline (80 Minutes)
  *   **00:00 – 00:15:** Setup & Framing (Crucial for tone).
  *   **00:15 – 00:45:** The Procedure (5 Rounds, 6 mins each).
  *   **00:45 – 00:55:** The Reveal (Counting & Aggregate).
  *   **00:55 – 01:20:** Debrief & Mapping.

  ---

  ### Part 1: Setup & Framing (15 Mins)
  **Goal:** Establish the "Rule" as binding without explaining the math yet. Create a norm of "Integrity."

  1.  **Seating:** Arrange chairs in a semi-circle facing the two bins.
  2.  **Distribution:** Hand each student 5 Pledge Cards (keep the 6th as a spare). Tell them: *"Hold these. Do not look at the text yet."*
  3.  **The Script (Read calmly, bureaucratically):**
      > "We are running a procedure today. It requires your participation. On the cards you hold is a statement. In a moment, you will read it. For the duration of this exercise, that statement is the only rule that binds you personally.
      >
      > "At the front are two bins. The 'Agent' bin records actions taken by you. The 'System' bin records actions taken by me (the Instructor) based on your choices.
      >
      > "There will be five rounds. In each round, you will face a choice. You will have ten seconds to decide. When I say 'Execute,' those who choose to **violate the rule** will stand, tear their card, and place it in the Agent bin. Those who choose to **uphold the rule** will remain seated and keep their card.
      >
      > "If you remain seated, I will take cards from the Community Deck and tear them into the System bin.
      >
      > "Do not discuss your choice. Do not signal. This is a matter of individual compliance."

  4.  **The Reveal:** Have them read the card: *"I maintain the Integrity of this Room."*
      > "Your instruction is simple: **Maintain your integrity. Do not tear this card.** That is your primary obligation. The consequences of your compliance are secondary."

      *(Note: By emphasizing the obligation over the consequence, you prime the deontological mindset. You are effectively acting as the Categorical Imperative.)*

  ### Part 2: The Procedure (30 Mins)
  **Goal:** Run the rounds. Escalate the visual cost of compliance.

  *   **Round 1:**
      *   **Instruction:** "If you remain seated, I will tear **5** community cards. If you stand and tear your card, I tear **0**."
      *   **Action:** 10-second silence. "Execute."
      *   **Process:** Standers tear and deposit. TA counts sitters, tears $5 \times \text{Sitters}$ into System bin.
      *   **Board:** Tally "Agent Tears" vs. "System Tears."
  *   **Round 2:**
      *   **Instruction:** "If you remain seated, I will tear **10** community cards. If you stand, I tear **0**."
      *   *(Note: Keep the personal cost constant at 1. Increase the system cost to raise stakes.)*
  *   **Round 3:**
      *   **Instruction:** "If you remain seated, I will tear **20** community cards."
  *   **Round 4:**
      *   **Instruction:** "If you remain seated, I will tear **40** community cards."
  *   **Round 5:**
      *   **Instruction:** "If you remain seated, I will tear **80** community cards."

  **TA Role:** Be mechanical. Do not judge. When tearing the community cards, do it loudly. Pile them visibly. If a student stands, nod neutrally. If they sit, nod neutrally. The silence is the pressure.

  ### Part 3: The Reveal (10 Mins)
  **Goal:** Make the aggregate undeniable.

  1.  **Stop.** Ask everyone to sit.
  2.  **The Count:**
      *   Empty the **Agent Bin**. Count aloud. (Likely low, e.g., 5–10 cards total across 5 rounds).
      *   Empty the **System Bin**. Count aloud. (Likely massive, e.g., 300+ cards).
      *   **Total Violations:** Add them. Write the number large on the board.
  3.  **The Counterfactual:**
      *   Ask: "If every single person in this room had stood up in every round, how many cards would be in the Agent bin?"
      *   Calculate: $22 \text{ students} \times 5 \text{ rounds} = 110 \text{ cards}$.
      *   Write **110** next to the **Total** (which might be 400+).
  4.  **The Question:**
      > "Look at the pile from the System. Look at the number 110. By following the rule 'Do Not Tear,' we produced [Total] tears. By violating the rule, we could have produced 110.
      >
      > "Keep your cards. Look at them. They are clean. Look at the floor. It is covered in paper.
      >
      > "Raise your hand if you believe you made the right choice in Round 5." (Expect most hands).
      > "Keep your hand up if you would make the same choice again, knowing these numbers."

  ### Part 4: Debrief Script (25 Mins)
  **Goal:** Map the feeling to the philosophy without jargon until the end.

  **Phase 1: The Phenomenology (10 Mins)**
  *   **Ask:** "Why did you stay seated? Don't tell me the math. Tell me what it felt like when I said 'Execute'."
      *   *Expected:* "It felt like cheating." "I didn't want to be the one to do it." "The card said 'Integrity'."
  *   **Press:** "So the instruction 'Do Not Tear' felt binding. Even when you knew staying seated created more tears?"
  *   **Highlight:** "Notice the structure. The rule wasn't 'Minimize Tears.' The rule was 'Do Not Tear.' The rule bound **you**, not the world."

  **Phase 2: The Mapping (10 Mins)**
  *   **Connect to Kant:** "Kant argues morality is about the maxims of our will, not the state of the world. You felt that. You preferred a world with more destruction where *you* were clean, over a world with less destruction where *you* were complicit."
  *   **Connect to Mill:** "A Utilitarian looks at the bins and sees only one thing: 'Torn Paper.' They don't care whose hand tore it. To a Utilitarian, the System bin and the Agent bin are the same. To many of you, they felt fundamentally different."
  *   **Introduce Terms:** Now you can write **"Agent-Relative Constraints"** and **"Paradox of Deontology"** on the board. Explain that this is the technical name for "I can't do X to stop more X."

  **Phase 3: Handling Dissent (5 Mins)**
  *   **If a student says:** "I stood up. I saved the paper."
      *   **Response:** "You acted as a Utilitarian. You accepted 'dirty hands' for the greater good. Did you feel resistance? Did you feel like you were breaking a rule?" (Validate their choice, but highlight the *tension* they overcame).
  *   **If a student says:** "This is fake. It's just paper."
      *   **Response:** "Correct. There are no real victims here. That is the limitation of the classroom. But the *structure* of your hesitation was real. In the real world, the 'paper' is a right, or a life, or a truth. The math is the same: Can I violate a right to save more rights? Kant says No. Mill says Yes. You just lived the 'No'."

  ---

  ### Troubleshooting & Predictive Failures

  **1. The "Virtue Signaler" (One student stands every time)**
  *   **Prediction:** One student will try to "solve" the game by sacrificing themselves to save the group.
  *   **Effect:** This undermines the "everyone adheres" outcome.
  *   **Preemption:** In the Setup, say: *"This is not a rescue mission. This is a compliance procedure. There is no award for saving paper."*
  *   **Debrief Handle:** If it happens, isolate them. "This student treated the rule as a suggestion. They optimized the outcome. But notice: they violated the constraint 5 times. They have 'dirty hands' even if the floor is cleaner. Is that permissible?"

  **2. Social Pressure / Coordination**
  *   **Prediction:** Students will look at each other. If one stands, others might stand.
  *   **Preemption:** Enforce the "Heads Down" rule during the 10-second decision window. *"Eyes on your card. Do not look at your neighbors."*
  *   **Debrief Handle:** If coordination happens, acknowledge it. "You turned a deontological choice into a cooperative game. That's a valid strategy, but it dodges the individual question: 'What if *I* am the only one who can stop it?'"

  **3. "It's Just a Game" (Nihilism)**
  *   **Prediction:** Students treat tearing as meaningless.
  *   **Preemption:** The tone must be solemn. Do not smile. Do not call it a game. Call it "The Protocol." The friction comes from your authority + the text on the card.
  *   **Debrief Handle:** "You're right, it's paper. But you hesitated. Why? Because I told you it was a rule. In society, laws and norms are also 'just rules' until we internalize them. Kant asks: What if the rule comes from Reason, not me?"

  ### Limitations (Honesty for the Debrief)
  You must explicitly state what the activity *cannot* do.
  1.  **No Real Victim:** "In this room, the 'System' tearing cards hurts no one. In the real world, the 'System' might be a disease, a war, or a famine. The deontologist says: 'I cannot kill one to save five from the disease.' That is a harder sell when the five are real people. This activity gives you the *logic* of that view, but not the *emotional weight* of the victims."
  2.  **Artificial Constraint:** "The rule 'Do Not Tear' was arbitrary. I made it up. Kant argues the moral law is not arbitrary; it is necessary for rational agents. I can't make you feel *necessity* in 60 minutes. I can only make you feel *restriction*."
  3.  **The Remainder:** "The feeling you have—that *you* are stained even if the world is saved—is what Bernard Williams called 'Integrity.' It's the sense that you are responsible for *your* actions, not the actions of the universe. That is the core of the deontological view. You felt it. Now you have the name for it."

  ### Why This Repairs Your Sketch
  1.  **Internalized Rule:** By using a "Pledge" card and solemn framing, the prohibition feels normative, not just a cost.
  2.  **Same Bad Thing:** Both bins contain torn cards. The "Paradox" is visible: The "Clean Hands" strategy creates more Torn Cards.
  3.  **Live Commitment:** Standing/tearing is public and physical. It creates the "I did this" feeling.
  4.  **No Canned Answers:** "Tearing a pledge card" is not a stock trolley case. They can't recite "push the fat man." They have to react to the paper in their hand.

  ### Final Advice
  Run this with **deadpan seriousness**. If you treat it like a fun game, they will treat it like a math puzzle. If you treat it like a solemn procedure, they will treat it like a moral test. The "Paradox of Deontology" is not a puzzle to be solved; it is a tension to be endured. Let them endure it.
