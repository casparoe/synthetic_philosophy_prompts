answer: |-
  Your roommate has reinvented a famous problem in decision theory known as **Pascal's Mugging** (or, in its broader form, the problem of **unbounded utility**). It is a serious objection, not a silly mistake. Philosophers and decision theorists (like Nick Bostrom, Alan Hájek, and Christian Tarsney) have written papers specifically about this.

  The argument looks airtight because it exploits a tension between three plausible ideas:
  1.  **Bayesian Regularity:** Never assign probability 0 to anything contingent (Step 3).
  2.  **Unbounded Value:** There is no limit to how good an outcome can be (Implicit in Step 2/4).
  3.  **Linearity of Expectation:** Value is just probability $\times$ value (Step 1).

  You cannot keep all three. To save Expected Value (EV) maximization (Step 1), you must modify either how you assign probabilities (Step 3) or how you assign values (Step 2/4).

  Here is where the hole is, which step to give up, and the cost.

  ### The Hidden Premise: Unbounded Utility
  The critical flaw isn't explicitly stated in your roommate's numbered list, but it is required for Step (2) to work. The argument assumes that for any probability $p$, there exists a value $V$ such that $p \times V$ is arbitrarily large. This requires your utility function to be **unbounded**.

  If your utility function is **bounded** (i.e., there is a maximum possible value, or values asymptote toward a limit), then there is a ceiling on $V$. Once $V$ hits the ceiling, no amount of "naming a bigger payoff" actually increases the mathematical value of the outcome.

  #### Option A: Accept Bounded Utility (Reject the implicit assumption in Step 2)
  This is the standard mathematical fix. You keep EV maximization (1) and Regularity (3), but you deny that outcomes can have infinite or arbitrarily large utility.

  *   **Why it looked fine:** We intuitively feel that "a billion happy lives" is better than "one happy life," and "a googolplex lives" is better than that. It feels like value scales linearly with quantity.
  *   **The Fix:** You argue that utility is bounded. Perhaps the first billion lives matter immensely, but the next billion matter slightly less (diminishing marginal value), such that the total sum converges to a finite number (e.g., 100 "utils" is the max possible value of any universe).
  *   **The Cost:** You have to accept that there is a limit to "goodness." You cannot say "infinite suffering is infinitely bad." You have to say "infinite suffering is extremely bad, but mathematically finite." This feels counterintuitive to many moral realists.
  *   **Why this saves EV:** If $V$ is bounded by $V_{max}$, then for a small enough $p$, $p \times V_{max}$ will eventually be smaller than the EV of studying for your exam. The fanatic gamble loses.

  #### Option B: Complexity Priors (Reject the inference in Step 4)
  If you refuse to bound utility (because you really do think $10^{40}$ lives is better than $10^{39}$), you must attack Step (4). Just because you can *name* a payoff doesn't mean it has enough probability mass to matter.

  *   **The Fix:** Use a **complexity prior** (like Solomonoff Induction). The probability of a hypothesis decreases exponentially with its description length (complexity). To specify a scenario where you get $10^{40}$ utils, you need a very complex description (a wizard, a simulation, a specific quantum fluctuation).
  *   **The Math:** If probability drops as $2^{-\text{length}}$ and utility grows only polynomially (or even exponentially, but slower than the probability drops), the Expected Value sum **converges**.
  *   **The Cost:** You must commit to a specific prior over reality. You are arguing that "fantastic claims are not just unlikely, they are *exponentially* unlikely relative to their value."
  *   **Why this saves EV:** The EV of the fanatic gamble becomes a convergent series that sums to a small number, allowing ordinary acts to dominate.

  #### Option C: Reject Regularity (Reject Step 3)
  Your roommate argues that assigning 0 probability is "dogmatism." You can push back here.

  *   **The Fix:** Distinguish between *logical possibility* and *model possibility*. Within your model of the world, the probability of a magic wizard appearing is exactly 0. This isn't dogmatism about logic; it's a boundary condition on your decision model.
  *   **The Cost:** You violate strict Bayesian orthodoxy (Cromwell's Rule). If the wizard *does* appear, your model breaks and you cannot update (you can't update on evidence you assigned 0 probability to).
  *   **Why this saves EV:** It simply removes the fanatic outcomes from the calculation entirely.

  ### Which step should you give up?

  **I recommend Option A (Bounded Utility).**

  It is the most robust defense of EV maximization. The VNM (Von Neumann-Morgenstern) axioms, which derive EV maximization, actually **imply bounded utility** if you accept a continuity axiom over infinite lotteries.

  Many decision theorists argue that the St. Petersburg Paradox (the ancestor of Pascal's Mugging) proves that rational agents *must* have bounded utility functions. If you have an unbounded utility function, you are vulnerable to a "money pump" where you will pay any amount to play a gamble with undefined expectation.

  **The argument to give your roommate:**
  > "EV maximization is correct, but it requires a well-defined expectation. If utility is unbounded, the expectation integral diverges, and EV is undefined. To make EV work, we must assume bounded utility. This doesn't mean we don't care about huge numbers of lives; it means our *valuation* of them asymptotes. Once we accept bounded utility, the 'fanatic gamble' no longer has infinite (or dominating) EV, and ordinary acts win."

  ### Regarding the "Paralysis" Objection (Step 6)

  Your roommate claims: *"EV maximization never actually issues in a choice."*

  This is a valid objection if the expectation is **undefined**. If the sum diverges (oscillates or goes to infinity), standard EV theory breaks down. It doesn't say "choose the fanatic gamble"; it says "I cannot compute."

  However, this is not a unique problem to EV. Any decision theory that relies on reasoning about the far future or low-probability high-impact events faces this.
  *   **Satisficing:** How high is the bar? If the bar is low, you ignore huge opportunities. If the bar is high, you face the same Pascal's Mugging problem.
  *   **Discounting probabilities:** This is effectively Option B (Complexity Priors) or Option C (Regularity). It works, but it's an adjustment *to* EV, not a replacement *for* it.

  ### Summary

  1.  **The Hole:** The argument assumes an **unbounded utility function**.
  2.  **The Fix:** Adopt **Bounded Utility**. This preserves EV maximization (1) and avoids the paralysis.
  3.  **The Cost:** You must accept that "goodness" has a mathematical ceiling, even if that ceiling is astronomically high.
  4.  **The Verdict:** Your roommate is right that *unbounded* EV maximization eats itself. But *bounded* EV maximization does not. You don't need to scrap EV; you just need to bound the inputs.

  If you want to keep (1), you must deny that value scales linearly forever. At some point, adding more happy lives adds less marginal value, ensuring the math converges.
