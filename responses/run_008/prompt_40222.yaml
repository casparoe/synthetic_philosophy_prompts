      *   *Which step to give up?* Primarily the implicit assumption of unbounded utility (affects 2/4). Secondarily (3).
      *   *Why did it look fine?* Because we intuitively think "more good is always possible."
      *   *What do I pay?* Accepting that value has a ceiling (boundedness) or that some possibilities are effectively impossible.
      *   *Is "no choice" an objection?* Yes, a decision theory that yields "undefined" too often is useless.

      *(Self-Correction during drafting)*: I should make sure to mention that VNM axioms *themselves* don't strictly force boundedness unless you add an axiom about infinite lotteries. But standard treatments often assume boundedness to avoid exactly this problem. I need to be precise there. Also, mention *St. Petersburg Paradox* as the historical ancestor of this problem.

      *(Another thought)*: The user asked about the slide from (4) to (5). This is about the *expectation sum*. If the sum diverges, you can't compare. I need to explain convergence.

