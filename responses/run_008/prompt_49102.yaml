answer: |-
  You have hit on the exact nerve that makes this literature both fascinating and frustrating. Your hypothesis is largely correct, but it requires a specific epistemological diagnosis. The stalemate isn't just about data quality or identification strategies; it is a **category error regarding causality in complex historical systems**, compounded by the **political economy of the profession**.

  Here is the diagnosis of the disagreement, broken down by why it persists, what kind of dispute it actually is, and what (if anything) constitutes progress.

  ### 1. The Diagnosis: It is a "Level of Analysis" Disguise
  The primary reason this fight doesn't resolve is that the three camps are answering different questions while claiming to answer the same one.

  *   **The Geographers** are answering the **Ultimate Cause** question: *Why did the divergence start?* (e.g., why did Europe develop states capable of colonization while the Congo did not?)
  *   **The Institutionalists** are answering the **Proximate Cause** question: *Why is income different today?* (e.g., why does investment happen in London but not Kinshasa right now?)
  *   **The Culturists** are answering the **Transmission Mechanism** question: *How do incentives get internalized?* (e.g., why do people in one place trust contracts and another don't?)

  When an institutionalist says, "Institutions cause growth," and a geographer says, "Geography causes institutions," they are both logically correct within their own time horizon. The disagreement becomes substantive only when they make **exclusionary claims** (e.g., "Geography *doesn't* matter, only institutions").

  **The Verdict:** It is partly verbal. They are fighting over where to place the "exogenous" label in a chain where everything is endogenous over a long enough timeline. If you go back far enough, geography causes culture causes institutions. If you look at the present, institutions cause GDP. The fight is about which link is the "real" cause. In philosophy of science terms, they are disagreeing about **causal salience**, not just causal existence.

  ### 2. The Methodological Ceiling: The "N=1" Problem in Disguise
  You asked if this is a fight about standards of evidence. Yes, but specifically about the **limits of the Credibility Revolution** when applied to macro-history.

  For the last 25 years, development econ has relied on the "identification strategy" (IVs, RDD, Natural Experiments) to solve endogeneity. In micro-development (e.g., does bed net distribution reduce malaria?), this works. In macro-history (e.g., did colonial legal origin cause financial development?), it hits a wall.

  *   **The Instrument Problem:** Every instrument used in this literature (settler mortality, distance from equator, colonial origin) is contested as being "contaminated." Why? Because history is not a lab. There are no truly exogenous shocks to *civilizations*. A shock that changes institutions (colonization) almost always changes culture and demographics simultaneously.
  *   **The Degrees of Freedom:** When you regress GDP on Institutions, Geography, and Culture, you have roughly 150 data points (countries). But these data points are not independent observations; they are clustered by history, region, and empire. The effective N is much smaller.
  *   **Non-Falsifiability:** Because the variables are so deeply intertwined, any finding can be explained away by a "third factor" story. If institutions predict income, the geographer says "institutions are just a proxy for disease load." If culture predicts income, the institutionalist says "culture is just an adaptation to bad institutions."

  **The Verdict:** This is a substantive limit of causal inference. We cannot rerun history. We cannot hold geography fixed while changing institutions in the Congo. Therefore, the "fact of the matter" you asked about (would the Congo be rich under Swedish institutions?) is **counterfactual and unknowable**. The disagreement persists because the data cannot kill the theories.

  ### 3. The Motivated Cognition Element
  We must acknowledge the policy stakes. This isn't just academic; it's ideological.

  *   **Institutionalism** is optimistic and interventionist. It implies that if we fix the rules (anti-corruption, property rights), poor nations can catch up. It empowers policy makers.
  *   **Geography** is pessimistic and structural. It implies that some places are hard to develop regardless of policy (e.g., landlocked, tropical disease). It can be used to justify aid fatigue or massive infrastructure spending.
  *   **Culture** is often viewed as reactionary or immutable. If poverty is caused by "values," policy is helpless (you can't legislate trust).

  Scholars in each camp have a vested interest in their "cause" being the dominant one because it validates their preferred policy solution. This creates a **motivated resistance to synthesis**. Admitting the other side has a point dilutes the policy punch of your own argument.

  ### 4. What Would Count as Progress?
  Since we cannot run a controlled experiment on nations, standard econometric tweaks won't settle this. Progress requires shifting the goalposts.

  **A. Abandon the "Silver Bullet" Search**
  Progress looks like admitting **complementarity**. The most sophisticated work now acknowledges interaction effects. For example: Institutions might matter *more* in temperate zones than in the tropics. Or, certain institutions only work when paired with specific cultural norms. Moving from "X vs. Y" to "X * Y" is progress.

  **B. Within-Country Variation (Spatial Econ)**
  Stop comparing Sweden to the Congo. Compare North Korea to South Korea, or East Germany to West Germany, or different ethnic homelands within the same country (e.g., the Bantustan boundaries in South Africa). This holds geography and broad culture constant while varying institutions. This is where the strongest evidence currently lives, but it limits generalizability.

  **C. Mechanism over Reduced Form**
  Stop running regressions of GDP on "Rule of Law Index." Start modeling *how* a specific rule changes a specific investment decision. Micro-foundations aggregated up are more convincing than macro-correlations. If you can show exactly *how* a property right change leads to a specific investment in a specific context, you bypass the "omitted variable" fight.

  **D. Structural Modeling**
  Build structural models where the parameters are calibrated to match historical data, then run counterfactuals within the model. This makes the assumptions explicit. Instead of arguing about the coefficient in a regression, you argue about the elasticity in the model. It doesn't give you "truth," but it clarifies *why* you disagree.

  ### 5. Pedagogical Advice for Your Seminar
  Since you teach this, here is how to frame the impasse for your students so they don't leave cynical:

  1.  **Reframe the Question:** Tell them the question "Why are some nations rich?" is too big. It's like asking "Why did the Roman Empire fall?" There is no single cause. The goal is not to find *the* cause, but to understand the *constraints* and *levers*.
  2.  **Teach the Identification Ceiling:** Be explicit that econometrics has limits. Show them that an Instrumental Variable is just a story about history, and stories can be contested.
  3.  **Focus on Policy Relevance:** Ask them: "Even if Geography is the ultimate cause, it is not a policy variable. You cannot move a country to a different latitude. You *might* be able to change an institution. Therefore, for a policymaker, institutions are the 'cause' that matters." This resolves the verbal dispute by changing the audience.

  ### Summary
  Is the disagreement substantive? **Yes**, regarding specific mechanisms.
  Is it verbal? **Yes**, regarding the definition of "cause."
  Is it evidentiary? **Yes**, because the data is insufficient to distinguish deep historical paths.

  **Can it be settled?** No. Not in the way physics settles a debate. History is a single observed trajectory of a complex system.
  **What is the honest answer?** The honest answer is that national wealth is **overdetermined**. Rich nations have good geography, good institutions, and supportive cultures. Poor nations often lack all three. Trying to isolate one as *the* cause is a category error. The field should admit that we are estimating **partial equilibrium effects** in a **general equilibrium world**, and our confidence intervals should reflect that fundamental uncertainty.

  If you teach them that the lack of consensus is a feature of the complexity, not a failure of the economists, you will have given them a more valuable lesson than any specific theory.
