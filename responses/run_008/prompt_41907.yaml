          *   *Reply:* No, that holds the structural background constant (late Imperial China) and varies the shock. The original question varies the background.
          *   *Concede:* Counterfactuals are tricky.
          *   *Weakness:* Hard to isolate the "shock" from the "structure."

      *   *Q8 (The Killer):* "If Britain and China are different *kinds*, how can you claim the Divergence is real? Divergence implies a common metric."
          *   *Reply:* (See below).

  5.  **Refining the "Killer Question":**
      *   *The Trap:* The thesis says the question is ill-posed because they are different kinds. But the thesis *also* says the Divergence is real. If they are different kinds, on what metric did they diverge? If there is a metric (e.g., GDP per capita, energy capture), doesn't that metric make them comparable *by definition*?
