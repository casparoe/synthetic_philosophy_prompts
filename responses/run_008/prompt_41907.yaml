answer: |-
  # Q&A PREP SHEET: The "Ill-Posed" Divergence Thesis
  **Seminar:** Graduate Economic History  
  **Topic:** Ontological Limits of the Britain/China Contrast  
  **Time Allocation:** 2 minutes per response max. Keep it grounded in historical mechanism, not pure philosophy.

  ---

  ### 1. The California School Veteran (Objection: "We Already Fixed This")
  **Voice:** "Pomeranz and the California School spent twenty years telling us not to compare Britain to 'China' but to the Lower Yangzi. You're attacking a strawman. We already solved the scale problem by matching core to core."
  **Reply:** Acknowledge Pomeranz's move, but argue it's inconsistent in practice. Even when comparing cores, the *causal background* differs: the Yangzi was embedded in a unified imperial fiscal state; Britain in a competitive state-system. Treating them as equivalent units in a regression ignores that the 'state' variable operates at different ontological levels. You can match GDP, but you can't match the political container.
  **Concede:** The California School correctly identified the geographic scale issue.
  **Soft Spot:** Risks sounding like you're nitpicking their main contribution to claim originality.

  ### 2. The Cliometrician (Objection: "Ill-Posed = Data Missing")
  **Voice:** "When you say the question is 'ill-posed,' I hear 'the data is too noisy.' If we had perfect regional GDP and factor price estimates for 1750, the comparison becomes a standard comparative statics exercise. Ontology doesn't stop math."
  **Reply:** This isn't about measurement error; it's about variable definition. 'Britain' is a sovereign polity with tariff control; 'China' is a continent-scale empire with internal free trade. Comparing them is like comparing a firm's profit margin to an industry's aggregate surplus. Perfect data on mismatched units yields precise nonsense.
  **Concede:** Better data improves *within-class* comparisons (e.g., Lancashire vs. Normandy).
  **Soft Spot:** Hard to prove that "mismatched units" invalidates a regression without sounding anti-quantitative.

  ### 3. The Historical Sociologist (Objection: "Contrast Classes are Pragmatic")
  **Voice:** "All explanation is contrastive, but the contrast class is chosen by the explainer, not nature. If my interest is 'why industrial capitalism emerged,' I *define* Britain and China as members of that class. You're policing my research interests."
  **Reply:** You can choose any contrast class, but valid causal inference requires the counterfactual world to be accessible. If the causal structures are radically different (e.g., Malthusian trap dynamics vs. Smithian growth dynamics), the counterfactual "China industrializes" isn't a nearby possible world; it's a different universe. Pragmatics can't override causal structure.
  **Concede:** Research questions are always interest-relative.
  **Soft Spot:** The line between "different variable values" and "different causal structures" is blurry.

  ### 4. The Agnostic Grad Student (Objection: "Are We Done Here?")
  **Voice:** "If the big question is ill-posed, are we supposed to stop studying the Great Divergence? It sounds like you're telling us the last thirty years of literature is a category error."
  **Reply:** No, we redirect. The literature survives as answers to *within-class* questions: "Why Yangzi vs. Pearl River?" or "Why Britain vs. France?" We keep the mechanisms (coal, institutions, colonies) but stop pretending they explain a global binary. We trade one big mystery for many solvable puzzles.
  **Concede:** The term "Great Divergence" is sticky and useful shorthand.
  **Soft Spot:** Sounds like semantic shuffling to save job prospects.

  ### 5. The California School Veteran II (Objection: "The 1800 Equality Claim")
  **Voice:** "You reject the 'equal until 1800' claim. That's the bedrock of the revisionist view. If you admit Europe was ahead earlier, you're back to the traditionalist story you claim to avoid."
  **Reply:** Distinguish *outcomes* from *capacities*. Real wages might have been comparable (outcome), but the *capacity* to sustain shock-driven growth differed (structure). I'm not saying Europe was richer; I'm saying the *kind* of economy Britain had was already distinct in its political fragmentation, even if living standards weren't.
  **Concede:** Standard of living measures (wages/calories) likely showed convergence.
  **Soft Spot:** Risks sliding back into "European Exceptionalism" if not careful.

  ### 6. The Methodological Critic (Objection: "The Needham Inconsistency")
  **Voice:** "You say the Needham Question (science) is well-posed because intellectual communities are commensurable. But scientific practices were also embedded in local economies and states. Why is a savant in Beijing comparable to one in London, but a merchant isn't?"
  **Reply:** Intellectual communities are defined by *text and practice* which were trans-local (Euclid is Euclid). Economic processes are defined by *resource constraints and property rights* which were hyper-local. A scientist reads the same book; a farmer faces different land/labor ratios. The unit of analysis for science is the network; for economics, it's the polity.
  **Concede:** Science is also socially embedded (Kuhn/etc.).
  **Soft Spot:** Economic knowledge (agronomy, tech) also traveled trans-locally.

  ### 7. The Counterfactual Historian (Objection: "The 'What If' Test")
  **Voice:** "You say 'What would it take for the Yangzi to industrialize?' is a valid question. But isn't that just 'Why Britain and not China' in disguise? You're still assuming they are on the same track, just asking about the switch."
  **Reply:** No. That question holds the *background structure* (Late Imperial China) constant and varies the *shock* (e.g., access to coal). The original question varies the background structure itself. One is a sensitivity analysis; the other is a category mistake.
  **Concede:** Counterfactuals always involve some abstraction.
  **Soft Spot:** Hard to isolate the "shock" from the "structure" in practice.

  ### 8. The "So What?" Challenge (Objection: "Policy Relevance")
  **Voice:** "Economic history often informs development economics. If we can't compare Britain and China, how do we draw lessons for modern development? Aren't you crippling the field's utility?"
  **Reply:** It makes lessons *more* robust. We stop looking for "silver bullets" (e.g., 'just add colonies') that worked in one ontological context and fail in another. We focus on mechanism transferability: under what *specific* structural conditions does this institution work?
  **Concede:** Generalizability is a goal of the field.
  **Soft Spot:** Makes the field sound less like "history" and more like "case studies."

  ---

  ### ⚠️ THE KILLER QUESTION (Hope nobody asks)
  **The Trap:** This turns your "incommensurable units" criterion against your claim that the "Divergence is real."

  **Question:** "You insist the Divergence is real, but also that Britain and China are radically different kinds of units. **Divergence implies a prior convergence or at least a common metric.** If they are ontologically different kinds, on what common scale did they diverge? If you have a scale (like GDP per capita), you've admitted they are comparable units, and your thesis collapses."

  **Best Available Answer:**
  "Distinguish between the *explanandum* (the outcome pattern) and the *explanans* (the causal model). We can measure the gap (the outcome) using a common metric like energy capture or wages without assuming the *causal processes* generating those numbers are comparable. They diverged in *outcome* via different *mechanisms*. My claim is that a single causal model cannot explain both sides of that gap, not that the gap didn't exist."

  **Honesty Flag:** This is the weakest point. It relies on a sharp distinction between "measurement" and "causation" that econ historians often blur. If they press that "measurement implies comparability of structure," you may have to concede that "Divergence" is a label for a pattern, not a single historical process. **Do not volunteer this distinction; wait for the question.**
