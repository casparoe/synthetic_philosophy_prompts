      *   *Q2 (Cliometrician):* Focus on "ill-posed" vs. "hard to measure."
      *   *Q3 (Sociologist):* Focus on the nature of contrastive explanation.
      *   *Q4 (Grad Student/General):* The "So what?" question. Are we done?
      *   *Q5 (California School/Revisionist):* The "Equal until 1800" pushback.
      *   *Q6 (Methodological):* The Needham Question inconsistency.
      *   *Q7 (Historical):* Counterfactuals. "What would it have taken?"
      *   *Q8 (The Killer):* Turning the criterion against the thesis.

      *Refining the Order:* Start with the most immediate methodological pushback (Cliometrician or California School), then move to the theoretical (Sociologist), then the implications (Grad Students), then the specific historical claims, ending with the Killer.
