      *   **Format:** ~8 objections, ordered by likelihood/flow, phrased in the subgroup's voice, 2-minute reply, concession note, weakness note.
      *   **Special Requirement:** Include the "killer question" (turns criterion against the author) with an honest answer.

  2.  **Deconstruct the Thesis & Anticipate Objections:**
      *   *Core Vulnerability:* If Britain and China aren't comparable, what *is* the unit of analysis? If the Yangzi Delta is the right unit, isn't that just a refined version of "China"?
      *   *California School:* They already compare Britain to Yangzi. They will say, "We fixed the scale problem already."
      *   *Cliometrician:* They hate "ill-posed." To them, everything is variables $X$ and $Y$. They will say, "You're just saying data is noisy."
      *   *Sociologists:* They focus on the logic of explanation. They will say, "Contrast classes are chosen by the explainer, not nature."
      *   *Grad Students:* They want a payoff. "So what? Do we stop studying the Great Divergence?"
      *   *The Killer Question:* If the Needham question is better posed because intellectual communities are commensurable, doesn't that imply economic units *can* be commensurable if defined right? Or, if the question is ill-posed, why did the divergence happen *there* and *then*?

  3.  **Drafting the Objections (Iterative Process):**

