          *   *Reply:* No, it's ontological. Even with perfect data, 'Britain' is a political unit and 'China' is a civilization-state. Comparing them is like comparing a firm to an industry.
          *   *Concede:* Better data helps within-class comparisons.
          *   *Weakness:* Hard to prove ontology matters more than data in econ history.

      *   *Q3 (Sociologist):* "Contrast classes are pragmatic, not natural."
          *   *Reply:* True, but pragmatic choices must respect causal structures. If the causal structures are different kinds, the pragmatics mislead.
          *   *Concede:* Explanation is always interest-relative.
          *   *Weakness:* Blurry line between "different kind" and "different variable values."

      *   *Q4 (Grad Student):* "Are you telling us to stop studying the Great Divergence?"
          *   *Reply:* No, redirect. Study the *within-class* divergences. The literature survives, just re-labeled.
          *   *Concede:* The label "Great Divergence" is sticky.
          *   *Weakness:* Sounds like semantic shuffling.

      *   *Q5 (Cal School - 1800):* "You reject the 'equal until 1800' claim. That's the core of our argument."
          *   *Reply:* Distinguish 'standard of living' from 'structural capacity'. They might have been equal in wages, but not in the *kind* of political economy.
          *   *Concede:* Real wages might have been comparable.
          *   *Weakness:* Risks sliding back into "European advantage" narrative.

      *   *Q6 (Needham):* "Why is Science commensurable but Economy isn't?"
          *   *Reply:* Intellectual communities are defined by practice/text, not territory. A savant in Beijing and London read the same Euclid. Farmers in Kent and Anhui did not face the same land constraints.
