      *   *Q2 (Projection):* Grice's resistance to Strawsonian presupposition. He'd argue projection is a feature of CIs too (e.g., "therefore").
      *   *Q3 (Reclamation):* The killer. Cancellability.
      *   *Q4 (Meaning vs. Utterance):* Reclamation as a shift in "timeless meaning" for a sub-community.
      *   *Verdict:* The CI framework holds *if* we allow expressive content to be context-sensitive. The amendment: A distinction between "Standard Conventional Implicature" and "Expressive Conventional Implicature," where the latter is sensitive to conversational contracts regarding attitude.

      *(Self-Correction during drafting)*: I need to make sure I don't just summarize modern literature (Potts, Hom, etc.) but interpret it through *Grice's* specific theoretical commitments (Cooperative Principle, Maxims, distinction between saying and implicating). Grice was concerned with *rational communication*. How does a slur fit rational communication? It signals an attitude.

      *Final Plan:*
