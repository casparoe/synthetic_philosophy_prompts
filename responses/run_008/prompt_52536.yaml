answer: |-
  Dear Colleague,

  It is no surprise that this exchange has stayed with you, for it touches upon one of the deepest fissures in moral theory, namely the tension between the metaphysical facts of identity and the normative requirements of justice. You have asked me to adjudicate the moves as they unfolded, and while neither participant landed a knockout blow, the trajectory of the argument reveals where the weight of truth lies. To begin with the philosopher's opening salvo, she is right to invoke the intuition that distinct persons are not mere containers for utility, a point famously crystallized by John Rawls. Her claim that we accept tradeoffs within a life because of the unifying threads of memory and project is phenomenologically accurate; we do experience our lives as unified narratives in a way we do not experience the lives of others. However, her assertion that this unity justifies aggregation within a life but not across lives rests on a metaphysical assumption that the economist rightly targets.

  The economist's reply leveraging Parfitian reductionism is the strongest metaphysical move of the debate. He is correct that if personal identity is nothing over and above psychological continuity and connectedness, then the boundary between intrapersonal and interpersonal is indeed a matter of degree rather than kind. An eighty-year-old is often psychologically discontinuous with their childhood self, and a long-married spouse may share more psychological connectedness with their partner than with their own distant past. On this specific point of metaphysical description, the economist is right and the philosopher is vulnerable. If the justification for prudential rationality is psychological connectedness, and that connectedness fades across time just as it varies across persons, then the philosopher's bright line between self and other begins to look like a shadow. Yet, the economist overreaches when he suggests this proves too much against the philosopher's position. He assumes that because the underlying facts are continuous, the normative categories must be equally fluid, which is a leap from is to ought that the philosopher successfully blocks in her final turn.

  When the philosopher answers that prudential tradeoffs are justified precisely because those relations exist, she is restating her premise rather than answering the degree objection, so on this specific exchange, the economist retains the advantage. He presses this advantage effectively in his next move by arguing that if weight tracks the density of relations, then aggregation should be permissible between spouses or across large temporal gaps, and impermissible only where relations thin out. He is right that the philosopher's view commits her to drawing a line through a continuum, which invites the charge of arbitrariness. However, he is wrong to claim that utilitarianism offers a principled stopping point by comparison. The utilitarian choice to aggregate all utility is itself an arbitrary axiom from the perspective of someone who values individual rights; claiming no boundary is more principled than drawing a boundary is merely a different kind of dogmatism. The economist mistakes the absence of a line for the presence of a principle, when in fact both positions require a foundational commitment that cannot be derived solely from the facts of psychological connectedness.

  This leads to the philosopher's last word, which is the most robust ethical move of the entire exchange. She is right that ethics is replete with thresholds drawn through continua, such as the line between childhood and adulthood or between negligence and recklessness. The existence of a sorites paradox does not invalidate the necessity of a binary distinction for the sake of moral agency and social coordination. While the economist is correct that the line is vague at the edges, the philosopher is correct that a line must exist for concepts like desert, rights, and partiality to function at all. We cannot allocate medical resources based on a sliding scale of psychological connectedness without undermining the very notion of a patient as a rights-bearer. Therefore, on the crucial point of whether a boundary can be justified despite metaphysical vagueness, the philosopher is right.

  What both panelists are missing, however, is the functional role of the person in moral theory. The economist treats personhood as a descriptive fact to be analyzed, while the philosopher treats it as a normative shield to be defended, but neither fully articulates that personhood is also a practical construct necessary for agency. We treat persons as separate units not merely because they are metaphysically distinct, but because they are the loci of responsibility, planning, and hope. To dissolve the boundary is not just metaphysically contentious but practically destabilizing. Furthermore, the economist misses that the utilitarian aggregation he defends is not neutral; it imposes a specific view of the good that privileges the sum over the individual, which is itself a value judgment no less arbitrary than the philosopher's threshold. The philosopher, for her part, misses an opportunity to concede that the separateness of persons is a moral postulate rather than a metaphysical discovery, which would have insulated her view from the Parfitian reductionism that bothered her throughout.

  Overall, the philosopher comes out more right, though not without scars. She wins because ethics is ultimately a normative enterprise designed for agents who experience themselves as unified wholes, regardless of the metaphysical leakiness of that unity. The economist wins the metaphysical skirmish by showing that the self is porous, but he loses the ethical war by implying that policy should track that porosity. In the context of allocating scarce medical resources, we must treat patients as distinct ends in themselves, not as stages in a collective life, because to do otherwise is to violate the conditions under which human beings find their lives worth living. The philosopher's defense of the threshold, despite its arbitrariness at the margins, is the only position compatible with a society that respects individuals rather than merely managing populations. The economist's consistency is admirable, but it is a consistency that dissolves the subject of morality itself.

  Yours sincerely,

  The Adjudicator
