  Subject: Re: Liar Paradox vs. Compiler Theory

  Hey, it's great that you're trying to map this stuff back to what you actually know, because honestly your intuitions are surprisingly solid and way closer to the mark than most students get even after weeks of lecture. You're basically asking for a compiler writer's guide to truth, and while there are some leaks in the abstraction, thinking about these philosophical positions as semantic models or type systems is the right way to hack into them. Let's walk through them in order, starting with your Tarski intuition, which is the cleanest fit.

  You guessed that Tarski's hierarchy is like a type system forbidding self-application, and that's basically correct, though I'd refine it to say it's a stratified type system where the truth predicate is polymorphic but restricted by level. In Tarski's view, you can't have a single function bool eval(Expression e) that works on all expressions, because if that function is itself expressible in the language, you can feed it its own source code and crash the system with the Liar. So Tarski forces you to have eval_1, eval_2, eval_3, where eval_n can only evaluate expressions containing eval_m where m < n. It's like having a compiler that refuses to compile code containing calls to the compiler itself unless you explicitly upgrade the compiler version for that specific scope. The residue here, the part that doesn't map cleanly to how you think about programs, is that in CS we usually view this limitation as a trade-off we accept for safety, whereas Tarski views it as a discovery about the nature of truth itself. He's claiming natural language is actually semantically incoherent unless we reconstruct it with these strict types. The distortion matters because in PL we can just say "natural language is sloppy, but our type system is precise," but for the philosopher, the goal is to explain natural language, not replace it. So Tarski saves consistency at the cost of expressiveness, effectively saying our everyday notion of truth is buggy and needs a patch that prevents recursion.

  Moving to Kripke, your intuition about evaluating an expression that returns undefined due to a dependency cycle is spot on, specifically regarding least fixed-point constructions in denotational semantics. Kripke introduces a three-valued logic where sentences can be True, False, or Undefined (often called a gap). You start with an empty extension for the truth predicate and iterate: any sentence whose truth value depends only on non-semantic facts gets valued, then any sentence depending on those gets valued, and so on. The Liar sentence never gets a value because it's ungrounded; it's like a variable that depends on itself without a base case, so it stays bottom or null forever. The residue here is subtle but critical: in your compiler, undefined usually means "error" or "non-termination," something to be caught or avoided. For Kripke, undefined is a stable semantic value. It's not a crash; it's the correct answer. However, the bigger residue is the Strengthened Liar, which is like a security exploit found after the patch. If you add a predicate for "is undefined," you can construct a sentence saying "This sentence is false or undefined," which forces a value again and breaks the system. Kripke's model handles the basic recursion bug but fails when the language can talk about its own gaps, suggesting his fixed-point construction is robust but not complete for natural language.

  Then you have the Revision Theory guys, like Gupta and Belnap, and your gloss of iterative fixpoint computation that never converges is exactly right. They treat truth as a revision operator rather than a static property. You hypothesize a truth value for the Liar, see what follows, and update. If you assume it's true, it implies it's false, so you revise to false. If you assume false, it implies true, so you revise to true. In CS terms, this is an infinite loop where the state oscillates between 0 and 1 forever. The residue here is the biggest departure from standard PL thinking: in semantics, non-convergence is usually a failure condition, meaning the program has no meaning. For Revision Theory, the oscillation is the meaning. They are arguing that truth is inherently dynamic for certain sentences, not a static mapping from syntax to value. This matters because it shifts the goalpost from finding a stable model to describing the behavior of the evaluation process itself. It's like saying a non-terminating program isn't broken, it's just computing a periodic function, which is a hard sell if you're trying to return a value to the user.

  Finally, there's the paraconsistent or glut approach, which you didn't mention but fits the pattern. If the previous theories try to avoid the crash, this one accepts that the system is corrupted and changes the hardware to handle it. They argue the Liar sentence is both True and False simultaneously. In your compiler, this is impossible; a bit is 0 or 1. If you assert both, you get a contradiction, and in classical logic, a contradiction implies everything (ex falso quodlibet), meaning your entire type system collapses and every program is valid. Paraconsistent logic changes the inference rules so that contradiction doesn't cause explosion. The residue here is ontological versus engineering. In CS, a variable being true and false is a race condition or memory corruption that must be fixed. For the dialetheist (someone who believes in true contradictions), this is how reality works. The distortion matters because it requires you to abandon standard boolean algebra, which is the foundation of almost all computing. You'd need a new logic gate set where A and not-A doesn't necessarily equal False.

  So if you're looking for the bottom line on where the translation breaks, it's that in CS we treat these semantic issues as engineering constraints to be managed for utility, while in philosophy they are ontological claims about what truth is. Tarski says truth must be stratified, Kripke says truth can have gaps, Revision says truth can be unstable, and Paraconsistent says truth can be contradictory. Your compiler intuitions are perfect for understanding the mechanics of each, but the residue is that you'll always want to fix the bug, whereas they are arguing about whether the bug is actually a feature of the universe. Hope that helps you survive the rest of the elective without zoning out.

