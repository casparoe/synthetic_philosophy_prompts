answer: |-
  Here is the 50-minute battle plan.

  ### 1. Order of Pieces: Calculation First
  **Do the calculation before the general statement.**

  **Why:**
  Sophomores in decision analysis are in a fragile epistemic state. They know how to crunch a decision tree, but they view theorems as "things the professor says are true." If you state Good's Theorem verbally first ("Information has non-negative expected value"), they will nod, file it under "Common Sense," and tune out. They won't feel the *need* for the math.

  By forcing them to calculate the EMV of the "Blind" decision first, then calculating the EMV of the "Informed" decision, you create a **numerical gap**. They see with their own eyes that $EMV_{informed} > EMV_{blind}$. The theorem then becomes the *label* for the phenomenon they just witnessed, not an abstract rule they have to trust.

  **Accommodating the Bayes Wobble:**
  Do not make them derive the posterior probabilities from scratch using Bayes' rule formula on the board. That is where 15 minutes die and confusion sets in.
  *   **Tactic:** Give them the likelihoods (e.g., "If Oil is present, the test is positive 80% of the time"). Write the resulting posterior probabilities on the board *after* asking them to guess the direction. Tell them: "For the purpose of this lesson, trust these numbers; the skill today is deciding what to *do* with them, not deriving them."

  ### 2. The Carrying Example: Stick with the Oil Wildcatter
  **Use the Oil Wildcatter.** Do not switch to used cars or medical tests.

  **Why:**
  *   **Used Cars:** Introduce "trust the mechanic" and "haggling" variables that aren't probabilistic.
  *   **Medical Tests:** Introduce risk aversion and emotional utility (health is not linear money).
  *   **Oil:** It is the sterile laboratory of decision analysis. It isolates the variables you need.

  **Specification:**
  *   **The State:** Dry (0) or Wet (1).
  *   **The Prior:** $P(Wet) = 0.5$. (Keep it symmetric for mental math).
  *   **The Acts:** Drill or Abandon.
  *   **The Payoffs:**
      *   Drill & Wet: +$400k
      *   Drill & Dry: -$100k
      *   Abandon: $0
  *   **The Test:** Seismic Survey (Cost = $0 for the theorem demonstration).
  *   **The Likelihoods:**
      *   $P(Signal+ | Wet) = 0.8$
      *   $P(Signal+ | Dry) = 0.2$
  *   **The Posteriors (Write these on the board):**
      *   $P(Wet | Signal+) = 0.8$
      *   $P(Wet | Signal-) = 0.2$

  **What it must not have:**
  *   **Risk Aversion:** Explicitly state, "We are maximizing Expected Monetary Value. We are risk-neutral corporations."
  *   **Test Cost:** For the *theorem* demonstration, the test must be free. Introduce cost only later when discussing "Net Value."

  ### 3. Misconceptions: Sequence and Scope
  Address these in the following order, immediately after stating the theorem.

  **A. "I don't have to change my action." (The Re-optimization Trap)**
  *   **When:** During the calculation phase.
  *   **Fix:** Show a branch where the signal comes back "Negative," but the EMV of Drilling is still higher than Abandoning. If the student drills anyway, the value of that specific information branch is *zero*.
  *   **Mantra:** "Information is only valuable if it has a non-zero probability of changing your decision."

  **B. "I can't end up worse off." (The Realization Trap)**
  *   **When:** Immediately after stating the theorem.
  *   **Fix:** Distinguish *Ex-Ante* (before seeing the signal) from *Ex-Post* (after seeing the signal).
  *   **Script:** "Good's Theorem protects your *expectation*, not your *outcome*. You might pay for the test, get a 'Go' signal, drill, and hit a dry well. You are worse off than if you hadn't tested. But *before* you bought the test, buying it was the rational choice. Do not confuse a bad outcome with a bad decision."

  **C. "More data is always good." (The Cost Trap)**
  *   **When:** Near the end.
  *   **Fix:** Remind them the theorem applies to *free* information. Once cost enters, $Value - Cost$ can be negative.

  **D. The Exceptions (Precommitment & Insurance)**
  *   **Decision:** **Gesture only. Do not explain.**
  *   **Why:** This is a sophomore course on individual rationality. Game theory (where information destroys bargaining power) and precommitment (where ignorance is bliss to maintain credibility) are advanced topics that will confuse the core lesson.
  *   **Script:** "In advanced game theory, there are cases where knowing less helps you—like if a kidnapper knows you can't reveal their face, they might let you live. Or if you can't insure against a risk you know about. Those are real. They are not for this class. In *individual* decision analysis under uncertainty, free relevant information is always an asset."

  ### 4. The Check: The Dominant Strategy Trap
  End with this question. Do not allow discussion until they write down an answer.

  **The Scenario:**
  "You are deciding whether to invest in a project.
  *   If the Market goes **Up**, Invest pays **$100**, Don't Invest pays **$0**.
  *   If the Market goes **Down**, Invest pays **$50**, Don't Invest pays **$0**.
  *   A genie offers to tell you the Market outcome for **free** before you decide.
  *   What is the maximum amount you should pay for this information?"

  **The Tempting Answer:** "Something positive. Information is valuable."
  **The Correct Answer:** "**Zero.**"

  **Why:**
  Invest is a **dominant strategy**. You make money in both states. Knowing the state does not change your action (you Invest regardless). If the action doesn't change, the Expected Value doesn't change. If the EV doesn't change, the Information Value is zero.
  *This separates the students who understand that Value of Information comes from **flexibility** vs. those who think Information is intrinsically magical.*

  ### 5. What to Refuse to Explain
  State this explicitly at the start or end to manage scope creep.

  1.  **The Proof:** "We are not proving *why* $E[\max] \ge \max[E]$. We are using it."
  2.  **Utility Curves:** "We are not discussing risk aversion today. If you want to maximize Expected Utility rather than EMV, the theorem holds, but the math is harder. We are staying in EMV land."
  3.  **Continuous Distributions:** "We are using discrete states. The calculus version is for grad school."

  ### 6. The Cut List (If Time Runs Short)
  If you hit the 40-minute mark and are still in the calculation:

  1.  **Cut the "Exceptions" (Precommitment/Insurance).** It is flavor text. The core theorem is the meat.
  2.  **Cut the "Realization Trap" discussion.** It is important, but if they understand the calculation, they can infer this.
  3.  **Do NOT cut the Check.** The Dominant Strategy question is the only way you know if they actually learned the concept or just watched you do math.

  **Summary of Flow:**
  1.  **0-5 min:** Setup Oil Example (Blind). Calculate EMV.
  2.  **5-25 min:** Add Test (Informed). Calculate EMV with Posteriors provided. Show the gain.
  3.  **25-30 min:** State Good's Theorem formally.
  4.  **30-40 min:** Misconceptions (Re-optimization, Realization vs. Expectation, Cost).
  5.  **40-45 min:** The Check (Dominant Strategy).
  6.  **45-50 min:** Scope boundaries & Dismiss.
