      *Caveat:* Keep the calculation *trivial*. Integers. 50/50 priors.

      *Re-evaluating the Example:* Oil wildcatter is standard for a reason—it separates the decision from the emotion. Used cars bring in "I hate mechanics." Let's stick to **Oil Wildcatter** but simplify the numbers heavily. It's the discipline of the course. Used car might feel too casual for a "Decision Analysis" course. Let's make it "Investment Project." Success or Failure.
