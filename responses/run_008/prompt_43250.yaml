      *   *Let's go with the "Irrelevant Info" check.* If the signal is independent of the state, EV of Info = 0.
      *   *No, the prompt wants to separate those who "got it" from those "nodding along".*
      *   *Idea:* You have a dominant strategy. Information cannot change your action. What is the value of information? (Zero). Students often think info *always* has value.
      *   *Refinement:* You are deciding whether to bring an umbrella. If rain costs -10, dry costs 0. Umbrella costs -2 always. If P(Rain) is 0.9, you bring umbrella. If P(Rain) is 0.1, you don't. If P(Rain) is 0.5?
