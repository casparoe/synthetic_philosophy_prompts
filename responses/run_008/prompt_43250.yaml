      *   Need a question where the intuitive answer violates the theorem.
      *   *Idea:* A case where the information is *free* but *irrelevant*. Or a case where the information is free but you *can't* change your action.
      *   *Better Idea:* A case where the information is free, relevant, but you *don't re-optimize*.
      *   *Best Idea:* The "Curse of Knowledge" trap or a "Costly Info" trap.
      *   *Selected Check:* A scenario where the test costs $1, and the EV of info is $0.50. Tempting answer: "Take the test because it's info." Correct answer: "Don't take the test, cost > value."
