      *   *Constraint:* No risk aversion. Treat money as linear utility.

  5.  **Address Question 3: Misconceptions:**
      *   *Misconception 1: "More data is always good, period."* (Ignores cost/effort).
          *   *Fix:* Address immediately after the theorem statement. Emphasize "Free" and "Relevant."
      *   *Misconception 2: "Can't leave you worse off in realization."* (Confuses Ex-Ante EV with Ex-Post Outcome).
          *   *Fix:* This is crucial. Need a specific moment where you say: "You might get the test, it says 'Go', you go, and it turns out to be a Lemon. You lost money. But *before* you took the test, taking the test was the right move."
