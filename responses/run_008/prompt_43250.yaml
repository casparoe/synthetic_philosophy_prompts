      *   **Role:** TA for a decision-analysis course (sophomores).
      *   **Topic:** Good's Theorem (Value of Information).
      *   **Core Statement:** Expected value of acting *after* observing free relevant information $\ge$ Expected value of acting *now* (blind), provided you re-optimize.
      *   **Constraints:** 50 minutes. Do *not* explain the theorem proof. Plan the lesson.
      *   **Student Profile:** Seen Bayes' rule but wobbly. Know decision trees and EMV (Expected Monetary Value). Think EMV = Rationality.
      *   **Specific Questions to Answer:**
          1.  Order of pieces (Calculation first vs. General statement first).
          2.  Carrying example (Oil wildcatter vs. something else, specs on what it must/must not have).
          3.  Misconceptions (Order of addressing, scope of exceptions like precommitment/insurance).
          4.  The Check (Final question to distinguish understanding).
          5.  What to refuse to explain (Scope boundaries).
          6.  Cut list (What to sacrifice if time runs short).

  2.  **Deconstruct the 50 Minutes:**
      *   Standard class time is actually about 45-48 minutes of teaching.
      *   Need engagement, clarity, and a solid takeaway.
      *   Sophomores get bored with abstraction but drown in arithmetic.
      *   Bayes' rule wobbliness is a critical constraint. If the math is too heavy, they miss the point.

  3.  **Address Question 1: Order of Pieces:**
      *   *Option A: General Statement First.* Risk: It sounds like a tautology or obvious ("Of course info is good"). They won't feel the *need* for the calculation.
      *   *Option B: Calculation First.* Risk: They get bogged down in Bayes' arithmetic and miss the forest for the trees.
      *   *Decision:* **Calculation First (but simplified).** Why? Because Good's Theorem is counter-intuitive to the *lazy* thinker. They think "Info costs time/effort" or "Info might scare me." To prove the *value*, they need to see the EMV jump. However, since they are wobbly on Bayes, the calculation must be *extremely* clean.
      *   *Refinement:* Start with a concrete scenario where they intuitively feel uncertainty. Do the "Blind" EMV. Then introduce the "Test." Do the "Informed" EMV. Show the difference. *Then* state the theorem as the generalization of what they just saw. This creates the "appetite" (as requested) by showing the *result* before the *rule*.

  4.  **Address Question 2: The Carrying Example:**
      *   *Oil Wildcatter:* Classic, but dry. Involves millions of dollars, which can feel abstract.
      *   *Medical Test:* Relatable, but brings in "health vs. money" utility issues (risk aversion creep).
      *   *Job Offer/Interview:* Relatable.
      *   *Selection:* **The "Used Car" (Lemon) Problem.**
      *   *Why:* Everyone understands buying a car. It's binary (Lemon vs. Peach). It's monetary. It's low stakes enough to be fun, high stakes enough to matter.
