prompt: |-
  quick background before my question: for my IB extended essay i picked the liar paradox (the "this sentence is false" one) and after skimming a bunch of articles i noticed that everyone jumps straight to their own fix — tarski's language hierarchy, kripke's grounded truth, the true-contradiction people — but nobody says upfront what would even count as fixing it. before i commit to defending one, can you write me the actual requirements list? like, must a solution preserve every instance of the truth-schema (calling s true iff s), or can it restrict that, and what does it cost? does it have to explain why the liar *feels* so compelling, or is just banning the sentence enough? what about revenge cases — the liar rebuilt out of whatever new vocabulary the theory itself introduces ("this sentence is not true" once the theory claimed the problem was with "false")? is calling the liar meaningless even an answer, when it so obviously isn't? for each requirement, say the case behind it, mark which ones you think are non-negotiable versus just things one camp happens to care about (is "no true contradictions" a real requirement or a prejudice?), and crucially: are some of the requirements impossible to satisfy together? that's the part i actually want, becuase if they are, the list itself is basically my thesis. one line each on how tarski, kripke, and the true-contradiction people do against your list is fine but keep it short, the list is the point. also no reading lists or citations pls, i just want the thinking
