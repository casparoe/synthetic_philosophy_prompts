  **The Scenario**
  Alice and Bob are equally senior on-call engineers for a critical server cluster. A crash alert arrives simultaneously on their screens; the system requires an immediate reboot to restore service, but the architecture is fragile: if two reboot commands are sent within the same millisecond, the database corrupts permanently. If exactly one sends the command, service restores fully. If neither sends it, the service remains down for an hour. The payoff structure is symmetric: successful restoration is worth +10 utility points to each (in reputation and relief); database corruption is -20 to each; continued downtime is -5 to each. They cannot communicate; they are "basically alike" in training, access, and temperament, knowing that whatever reasoning process one uses, the other is capable of using it too.

  **Straightforward Self-Interest**
  Standard game theory identifies this as a game of "Chicken." There is no dominant pure strategy (if Bob waits, Alice should act; if Bob acts, Alice should wait). Rational self-interest dictates a **mixed strategy**: each engineer should randomize their response to make their move unpredictable. Calculating the Nash Equilibrium, each should reboot with a probability of roughly 33%. This yields an expected value of **+0.7 utility** per person. While risky, this approach maximizes the mathematical expectation by ensuring that roughly 47% of the time, exactly one person acts (the optimal outcome), while accepting a small risk of collision to avoid the certainty of downtime.

  **Superrational-Style Reasoning**
  Superrational reasoning begins with the premise: "We are alike. If I decide to reboot, you will decide to reboot. If I decide to wait, you will decide to wait." The agents treat their own choice as a sample of the joint choice.
  *   **Option A (Reboot):** If I reboot, you reboot. Result: Collision. Payoff: -20.
  *   **Option B (Wait):** If I wait, you wait. Result: Downtime. Payoff: -5.
  *   **Conclusion:** Since -5 is better than -20, the superrational choice is to **Wait**.
  *   **Outcome:** Both wait. The server stays down. Payoff: **-5 utility** each.
  *   **Divergence:** Standard rationality accepts the risk of collision to unlock the asymmetric optimum (one acts, one waits). Superrationality, enforcing symmetry of action, locks them into the symmetric sub-optimum (both wait) to avoid the symmetric disaster (both act).

  **Feature Doing the Work**
  The critical feature is the **necessity of asymmetry for the optimal outcome**. Superrationality functions by aligning choices; it excels when the best outcome is symmetric (e.g., both Cooperate in a Prisoner's Dilemma). Here, the "basically alike" assumption forces a correlation of action that prevents the agents from occupying the complementary roles (Actor/Waiter) required for success. The reasoning fails not because the agents are irrational, but because the logic of "alikeness" precludes the differentiation needed to solve the coordination problem.

  **Friend's Likely Attack**
  Your friend will almost certainly argue that superrationality was never intended for games with asymmetric equilibria like Chicken. He will claim the theory applies only when the *payoffs* are symmetric in structure (like the Prisoner's Dilemma, where mutual cooperation beats mutual defection), not just when the *agents* are symmetric. He will say your case marks the theory's boundary: superrationality solves social dilemmas where interests align (PD), not coordination dilemmas where interests require divergence (Chicken).

  **Assessment and Symmetry Restoration**
  This reply is an **immunizing maneuver**, not a principled restriction. Your friend's original claim was that "basically alike" agents should assume their conclusions correlate. He did not stipulate "alike agents in symmetric payoff matrices." Restricting the theory to symmetric payoffs retroactively excludes the exact cases where the "alikeness" assumption creates trouble. It reduces superrationality to a tautology: "It works when the symmetric choice is the best choice."

  If we restore full symmetry to satisfy his restriction—making the optimal outcome symmetric—the trap disappears. Imagine a scenario where *both* rebooting yields +20 (parallel processing helps) and *both* waiting yields -5. Now the symmetric action (Both Reboot) is optimal. Superrationality recommends Reboot (assuming the other does too), yielding +20. Standard rationality (fearing the other might wait) might still hesitate. In this restored symmetric world, superrationality wins. But this confirms your suspicion: the theory only "works" when the world is already set up to reward the very symmetry the theory enforces. In the realistic, asymmetric world of the server crash, that enforcement is a liability.

  **Compliance Check**
  *   **Bad outcome derived?** Yes, derived from the payoff matrix and the correlation assumption, not stipulated.
  *   **Agents alike genuinely?** Yes, same training/role. The "trap" is not that they are unlike, but that their likeness prevents the necessary differentiation.
  *   **Specifications satisfiable?** Yes. The tension lies in the definition of "conclusion." If "conclusion" includes the final action, superrationality fails in asymmetric equilibrium games. If "conclusion" only includes the *strategy* (e.g., "flip a coin"), superrationality collapses into standard rationality (assuming independent coin flips). Your friend's claim relies on the former; the failure case demonstrates why that reliance is fragile outside symmetric payoff structures.
