  My credence drops to 0.50 (moral indifference). Since the expected loss of life is identical (0.1 deaths), the aggregation of *expected* harm does not distinguish the options. This implies our disagreement over the original case is significantly about **who visibly bears the loss** (ex post victim counts) rather than pure aggregation of expected utility. The intuition to save the five relies on the certainty of death; when reduced to probabilistic burdens, fairness (spreading risk) competes equally with aggregation.

  ***

