  2.  **0.25 — Probability that Taurek's coin flip is permissible respect for each person.**
      Justification: Randomization treats the five as a mere collection of individuals rather than a weightier moral claim.
  3.  **0.60 — Probability that the claims-based framing is the right frame.**
      Justification: While interpersonal comparison is real, the distinctness of persons constrains pure impersonal maximization.
  4.  **0.95 — Probability that no special duties or prior obligations defeat the general requirement.**
      Justification: The "all else equal" clause successfully isolates the numerical variable from relational noise.

  ***

  **Variant 1: One Victim versus a Million**
  My credence rises to 0.99. This is a stable feature of a *threshold aggregativist* view: while pairwise claims resist simple summation at low numbers (1 vs. 5), the moral weight of a million claims creates a lexical priority that overrides the distinctness-of-persons constraint. If the number did not move, it would imply the view was never about numbers but about procedural fairness; since it moves, I admit that at sufficient scale, the "nothing to compare" objection collapses under the weight of catastrophe.

