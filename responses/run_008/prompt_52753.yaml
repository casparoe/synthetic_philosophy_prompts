  *   **Confidence in Terms:** I am 0.90 confident in Term 1 (Aggregation), 0.85 confident in Term 2 (Taurek), 0.65 confident in Term 3 (Claims Frame), and 0.95 confident in Term 4 (No Defeaters).
  *   **Least Sure Term:** Term 3 (Claims-based framing). It is difficult to adjudicate between contractualist separateness and utilitarian impersonality without begging the question.
  *   **Greatest Mover:** The "Minor Harms" case: if saving the five from death required imposing a trivial headache on a sixth person, aggregation holds; if it required imposing a *life-ruining* harm on a sixth person, aggregation likely fails. Seeing where the break occurs would adjust my credence in Term 1 most drastically.
