answer: |-
  This is a classic philosophical puzzle, and you have correctly identified the core reference: **Frankfurt-style cases**. Named after Harry Frankfurt's 1969 paper *"Alternate Possibilities and Moral Responsibility,"* these scenarios are designed to test whether having the ability to do otherwise is necessary for free will or moral responsibility.

  Here is the move-by-move breakdown of your mom and Dana, followed by the philosophical landscape check you requested.

  ### Part 1: Move-by-Move Analysis

  **Mom Move 1:** *"That wasn't a free choice. Ray would never have let her go... The ending was fixed before she opened her mouth."*
  *   **Assessment:** **Philosophically Consistent, but misses the specific puzzle.**
  *   **Why:** Mom is arguing from the perspective that *alternative possibilities* matter. She is saying Maya wasn't free because she *could not* have done otherwise (due to Ray's threat). This aligns with the **Principle of Alternative Possibilities (PAP)**. However, in the specific logic of a Frankfurt case, the fact that the "ending was fixed" by a counterfactual threat is exactly what Frankfurt argues *doesn't* matter if the threat never activates. Mom is treating the *presence* of the constraint as the killer, ignoring that Maya acted on her own desires.

  **Dana Move 1:** *"But the threat never actually did anything. She stayed because she wanted to stay. You can't call a choice coerced when the coercion never had to fire."*
  *   **Assessment:** **Right on the specific Frankfurt logic.**
  *   **Why:** Dana captures the core intuition Frankfurt wanted to isolate: the **Actual Sequence**. If Maya's decision flowed from her own desires without the threat actually intervening, Dana argues the threat is irrelevant to the freedom of *that specific choice*. This is the standard Compatibilist response to Frankfurt cases. She correctly identifies that causal history (the threat existing) is distinct from the actual cause of the action (Maya's preference).

  **Mom Move 2:** *"Her wanting to stay IS the coercion. That want was installed by thirty years of living under Ray. The gun was at her head the whole time, she just stopped noticing it's there."*
  *   **Assessment:** **Right on a different argument (Manipulation), but shifts the goalposts.**
  *   **Why:** Mom realizes Dana won on the "threat" argument, so she switches to the **History of Desires**. She is no longer arguing about whether Maya *could* have taken the job; she is arguing that Maya's *desire* to stay was itself unfree because it was manipulated/conditioned by Ray. This is a valid philosophical objection (the **Manipulation Argument**), but it is distinct from the original Frankfurt puzzle. Frankfurt cases usually assume the agent's psychology is normal; Mom is challenging that assumption.

  **Dana Move 2:** *"Then nobody raised by a difficult parent has ever freely chosen anything... She's 34 with a phone and a bus fare. People walk away from worse."*
  *   **Assessment:** **Right on the "Reductio" (Absurdity) check.**
  *   **Why:** Dana points out that Mom's definition of coercion is too broad. If all influence from a difficult upbringing counts as coercion that negates freedom, then almost no adult is free. Dana is appealing to a threshold of **rational capacity**: Maya has the tools to leave (phone, bus, age), so her staying is a valid expression of agency, regardless of her upbringing.

  **What Both Are Missing:**
  They are talking past each other because they are debating two different conditions for freedom.
  1.  **Dana** is debating **Alternative Possibilities** (Could she have done otherwise?).
  2.  **Mom** is debating **Sourcehood** (Did the desire originate authentically within her?).
  Frankfurt cases are designed to settle the first debate (suggesting alternative possibilities aren't needed). Mom's second argument attacks the second debate (suggesting the *source* of the desire matters). Neither acknowledges they have switched topics mid-argument.

  ***

  ### Part 2: The Philosophical Landscape (Settled vs. Contested)

  You asked to distinguish between what is settled and what is fought over. In academic philosophy, very little is "settled" regarding free will, but there are clear maps of the disagreement.

  **1. The Goal of Frankfurt Cases (Contested)**
  *   **Frankfurt's Claim:** He intended to show that the Principle of Alternative Possibilities (PAP) is false. I.e., You can be responsible for an action even if you *could not* have done otherwise, provided the actual cause was your own will.
  *   **Status:** This is **highly contested**. Many compatibilists accept Frankfurt's conclusion. However, many incompatibilists (libertarians) reject it. It is not consensus that Frankfurt succeeded.

  **2. The "Flicker of Freedom" Objection (Mainstream, Not Fringe)**
  *   **The Claim:** You mentioned finding a thread about a "split second where the person could have done otherwise." This is known as the **Flicker of Freedom** strategy (championed by philosophers like David Widerker and Robert Kane).
  *   **The Argument:** They argue that in any Frankfurt case, there *is* always some alternative possibility left (e.g., the agent could have *started* to choose otherwise before the intervener stepped in, or the signing of the decision could have been different). Therefore, PAP isn't actually violated.
  *   **Status:** This is a **mainstream, serious objection**, not a fringe gripe. However, it is not considered a definitive "refutation." Frankfurt defenders have created "Flicker-Proof" cases to counter this. The debate is ongoing; it is not settled that the flicker wrecks the argument, nor is it settled that it doesn't.

  **3. The Manipulation Argument (Mom's Second Point)**
  *   **The Claim:** Even if an agent satisfies Frankfurt's conditions (no intervener needed), they aren't free if their desires were manipulated (like by Ray's upbringing).
  *   **Status:** This is a **major contemporary battleground**. Philosophers like Derk Pereboom use this to argue against compatibilism. There is no consensus on where to draw the line between "normal upbringing" (Dana's view) and "determining manipulation" (Mom's view).

  **4. What is actually settled?**
  *   It is settled that Frankfurt cases successfully shifted the debate from "Alternative Possibilities" to "Actual Sequence" (the history of how the decision was made).
  *   It is **not** settled whether Frankfurt cases successfully prove that alternative possibilities are irrelevant to moral responsibility.
  *   It is **not** settled whether historical manipulation (Mom's point) negates freedom in a way that simple determinism does not.

  ### Summary
  Dana wins the argument regarding the specific logic of the *threat* (the Frankfurt case itself). Mom wins the intuition regarding the *history of the desire* (the Manipulation argument). However, neither is "objectively right" because the philosophy underlying both positions remains actively disputed.

  \answer{Dana on alternative possibilities; Mom on historical manipulation}
