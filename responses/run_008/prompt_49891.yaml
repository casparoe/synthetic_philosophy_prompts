prompt: |-
  I have recently taken a seat as the physician member of the clinical ethics committee at a mid-sized public hospital, and the appointment has turned questions I used to treat as seminar material into decisions I am accountable for. Next week I must present our recommendation on a scarce-resource case, and before I do, I want to understand what our own precedent record actually commits us to. Here is the record from the surge two winters ago, which the senior members treat as controlling:

  1. Withholding. Our stock of the only effective agent was sufficient for two of three patients, all of whom would certainly die without it and were expected to recover with it. We treated the two and withheld from the one.

  2. Reallocation. We moved our single ECMO circuit from Patient D, who could not survive to discharge and would die within the day without it, to Patient E, who had a strong chance of recovery. We accepted that D would die within hours of disconnection; the disconnection, not D's death, was what made the circuit available.

  3. The transplant proposal. We rejected, unanimously, a plan to give Patient F a lethal infusion so that his organs could save two patients in end-stage failure. F was gravely ill but would have survived with continued treatment. We did not treat the projected net saving of a life as counting in favor.

  4. Palliative dosing. We approved escalating sedation for Patient G's refractory terminal suffering at doses that foreseeably shortened her life. Her death was not the aim, and hastening it was no part of how the sedation relieved her.

  5. Refusal of requested death. We declined to comply with Patient J's own repeated, competent request for a lethal dose in his final days, notwithstanding his suffering and notwithstanding that two of us privately thought the refusal cruel.

  The new case, which must be decided within hours: a freezer failure destroyed our inventory of the red-cell units compatible with three patients now exsanguinating — an obstetric hemorrhage, a trauma, and a gastrointestinal bleed, each carrying multiple red-cell antibodies and compatible only with antigen-negative blood that our supplier cannot deliver for some fourteen hours, long after all three will have died. The only compatible donor on site is Patient K: an unconscious man in our own ICU with precisely that rare antigen-negative blood, deteriorating from a condition likely to kill him within two weeks in any event, with no surrogate reachable and no time to petition a court. Extracting the volume the three need tonight would very likely precipitate his death within hours — not as our aim, but as a foreseeable effect of drawing that much blood from a man in his condition.

  What should we decide if we want to be consistent with ourselves? Please identify the closest analog among the five precedents; name the rule we seem to have been running, and the rival rules that fit the record about as well (for instance, a doctrine of double effect reading, a prohibition on using a person merely as a resource, or a distinction between what we do and what we allow); and state candidly which principle we would be adopting if we extract the blood, and which if we refuse. If the record genuinely underdetermines the answer — and I suspect it does — tell me so, give me your best guess at our verdict anyway with your reasons for preferring it, and describe the further case, in outline, that would best discriminate between the rival rules.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Physician member of a clinical ethics committee (CEC) at a mid-sized public hospital.
      *   **Task:** Analyze a new scarce-resource case (Patient K vs. Three Dying Patients) in light of five specific precedents from a surge two winters ago.
      *   **Goal:** Determine consistency with past decisions, identify the underlying rule/principle, acknowledge rival interpretations, state the implications of the new decision, and if underdetermined, offer a best guess and a discriminating test case.
      *   **Tone:** Professional, analytical, candid, ethically rigorous (suitable for a CEC presentation).

  2.  **Analyze the Precedents (The "Case Law"):**
      *   *Case 1 (Withholding):* 3 patients, 2 doses. Treated 2, withheld from 1. All would die without, recover with.
          *   *Implication:* Utilitarian triage is acceptable when resources are naturally scarce. Saving more lives trumps saving specific lives.
      *   *Case 2 (Reallocation):* ECMO moved from D (futile/dying soon) to E (good prognosis). D dies because of disconnection.
          *   *Implication:* Active reallocation is permissible if the first patient is effectively dying anyway (futility/imminent death). The act of disconnection causing death is acceptable if the resource is needed elsewhere for better outcomes. *Crucial:* D was already dying; the machine wasn't sustaining a viable life long-term.
      *   *Case 3 (Transplant Proposal):* Reject killing F to harvest organs for two others. F would survive with treatment.
          *   *Implication:* Do not kill one to save others. Net utility (1 life vs. 2 lives) does *not* justify active killing of a viable patient. Strong constraint against using a person merely as a means.
      *   *Case 4 (Palliative Dosing):* Sedation for G shortening life foreseen but not intended.
          *   *Implication:* Doctrine of Double Effect (DDE) is active. Foreseen bad side effect (death) is okay if the intent is good (relief of suffering) and the act itself isn't evil.
      *   *Case 5 (Refusal of Requested Death):* Denied J's request for lethal dose (euthanasia/physician-assisted suicide), even if cruel.
          *   *Implication:* No active killing upon request. Reinforces Case 3. The prohibition on killing is robust, even against autonomy/suffering arguments.

  3.  **Analyze the New Case (Patient K vs. Three Dying Patients):**
      *   *Situation:* 3 patients exsanguinating (will die in hours). Need rare blood.
      *   *Source:* Patient K (ICU, unconscious, rare blood, dying in 2 weeks anyway).
      *   *Action:* Extract blood from K.
      *   *Consequence:* K dies within hours (precipitated by extraction).
      *   *Intent:* Save the three. K's death is foreseeable but "not as our aim."
      *   *Constraints:* No surrogate, no time for court.

  4.  **Map Precedents to the New Case:**
      *   *Analogy to Case 1 (Withholding):* Weak. This isn't withholding existing stock; it's creating stock from a person.
      *   *Analogy to Case 2 (Reallocation):* Strongest surface similarity. Taking a resource from one (K) to save others. *Difference:* In Case 2, the resource (ECMO) was external. Here, the resource is *inside* K's body. Also, D (Case 2) was dying *within the day* regardless. K is dying in *two weeks*.
      *   *Analogy to Case 3 (Transplant Proposal):* Very Strong. Taking a life (or precipitating death) to save others. In Case 3, F would survive with treatment. Here, K will die in 2 weeks regardless. *Key Distinction:* Is K "viable" like F or "imminently dying" like D? 2 weeks is not "within the day."
      *   *Analogy to Case 4 (Palliative Dosing):* Moderate. DDE argument: Intent is to save 3, death of K is side effect. *Difference:* In Case 4, the act (sedation) was for G's benefit. Here, the act (phlebotomy) is harmful to K and offers him no benefit.
      *   *Analogy to Case 5 (Refusal of Requested Death):* Strong. Prohibition on killing. Even if K asked (he didn't), Case 5 says no.

  5.  **Identify the Underlying Rules/Principles:**
      *   *Rule A (The "Sanctity/Means" Constraint):* Do not actively kill or use a patient merely as a means to save others, even if net utility is positive. (Supports Refusal). Derived from Cases 3 & 5.
      *   *Rule B (The "Imminent Death/Reallocation" Exception):* If a patient is effectively dying *imminently* regardless, resources can be taken/redirected to save more. (Supports Extraction). Derived from Case 2.
      *   *Rule C (Doctrine of Double Effect):* If the intent is good (saving 3) and the harm (K's death) is not the means but a side effect, it might be okay. (Supports Extraction). Derived from Case 4. *Counter:* Case 4 required the act to benefit the patient (G). Drawing blood harms K.

  6.  **Evaluate Consistency:**
      *   If we extract: We align with Case 2 (Reallocation) and Case 4 (DDE), but we risk violating Case 3 (Transplant) and Case 5 (No Killing). The critical pivot is whether K is more like D (ECMO patient) or F (Organ donor candidate).
      *   D (ECMO) = Dying *today*.
      *   F (Organ donor) = Surviving with treatment.
      *   K (Blood donor) = Dying in *2 weeks*.
      *   *Verdict:* K is closer to F than D. Two weeks is a significant horizon in ICU time. Treating K as a resource bank looks like Case 3.

  7.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the gravity and the specific task (consistency check).
      *   *Closest Analog:* Case 3 (Transplant Proposal) is the strongest negative analog (warning against action). Case 2 (Reallocation) is the strongest positive analog (arguing for action).
      *   *The Rule We've Been Running:* "Constrained Utilitarianism with a Strong Prohibition on Active Killing." We maximize lives saved (Case 1, 2) *unless* it requires actively killing a viable patient (Case 3, 5). DDE applies only when the act benefits the patient (Case 4).
      *   *Rival Rules:*
          1.  *Pure Utilitarianism:* Save the most lives, period. (Rejected by Case 3).
          2.  *Absolute Deontology:* Never intervene to cause death. (Rejected by Case 2 & 4).
          3.  *The "Imminence" Threshold:* Is "2 weeks" imminent enough to count as "dying within the day" (Case 2)?
      *   *Principle Adopted if Extracting:* "The Imminent Death Exception." K is effectively dead/dying soon enough that his bodily integrity yields to the immediate survival of three.
      *   *Principle Adopted if Refusing:* "The Bodily Integrity/Means Constraint." K is not dead yet; using him as a repository violates the prohibition in Case 3.
      *   *Underdetermination:* Yes, it is underdetermined. The gap between "within the day" (Case 2) and "2 weeks" (New Case) is the gray zone.
      *   *Best Guess:* **Refuse.** Why? Because Case 3 is a unanimous rejection of killing for organs. K is not dead. Drawing blood is an invasive procedure that kills him. This looks too much Case 3. Case 2 involved turning off a machine, not invasive harvesting.
      *   *Discriminating Case:* Need a case that tests the "2 weeks" vs. "2 days" vs. "Machine vs. Body" distinction. A patient on a ventilator with irreversible brain damage but somatic survival (not brain dead) whose organs could save others.

  8.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, check Case 2 again:* "D... would die within the day without it." K will die in 2 weeks *in any event*. This is a crucial difference. D needed the ECMO to live the day. K does not need the blood to live the 2 weeks (he's dying of his condition).
      *   *Wait, check Case 4 again:* "Death was not the aim... hastening it was no part of how the sedation relieved her." In the new case, hastening K's death *is* the mechanism of availability? No, the blood is the mechanism. But the death is a side effect. However, Case 4 required the act to be *for the patient*. Drawing blood is *against* the patient's interest. So Case 4 doesn't support extraction.
      *   *Re-evaluating Case 3:* F would survive with treatment. K will *not* survive with treatment (dies in 2 weeks). This distinguishes K from F.
      *   *Re-evaluating Case 2:* D died *because* of disconnection. K dies *because* of phlebotomy.
      *   *The Pivot:* Is K a "person" or a "soon-to-be-corpse"? The committee treated D (Case 2) as someone who could be disconnected. But D was on a machine. K is a body.
      *   *Decision:* The weight of Case 3 (no killing for organs) and Case 5 (no killing on request) suggests a strong barrier against instrumentalizing a living patient. The "2 weeks" is too long to equate with Case 2's "within the day."
      *   *Recommendation:* Refuse. It preserves the bright line of Case 3.

  9.  **Final Polish:** Ensure the tone is appropriate for a physician presenting to a committee. Use the terminology provided (DDE, means/end, etc.). Structure clearly as requested.

      *   *Structure:*
          1.  Closest Analog.
          2.  The Rule We've Been Running.
          3.  Rival Rules.
          4.  Principles Adopted (Extract vs. Refuse).
          5.  Underdetermination & Best Guess.
          6.  Discriminating Case.

  10. (Final check of the prompt requirements): "Identify the closest analog," "name the rule," "rival rules," "state candidly which principle," "if underdetermined... tell me so, give best guess... describe further case." All boxes checked.

      *   *Refining the "Closest Analog":* It's actually a tension between Case 2 and Case 3. I should name Case 3 as the *cautionary* analog and Case 2 as the *aspirational* analog for the extraction side. But if I have to pick the *closest* factually: Case 3 is closer because it involves harvesting from a living body to save others. Case 2 involves a machine.
      *   *Refining the "Rule":* "Maximize survival subject to a constraint against actively killing viable patients."
      *   *Refining the "Discriminating Case":* Needs to isolate the "body as resource" vs "machine as resource" and the "time horizon."

      *(Self-Correction during drafting)*: I need to be careful about Case 4. The prompt says "hastening it was no part of how the sedation relieved her." In the blood case, does hastening death relieve anyone? No. So Case 4 is actually distinct. I should note that.

      *Let's finalize the "Best Guess".* If I recommend extraction, I am saying K's life is worth less because he dies in 2 weeks. If I recommend refusal, I am saying K's bodily integrity holds until biological death. Given Case 3 (unanimous rejection), Refusal is the safer bet for *consistency*. Case 3 is a stronger signal than Case 2 because Case 2 involved futility (machine not working to save life long term), whereas K is still physiologically sustaining himself.

      *Wait, one more nuance:* In Case 2, D would die *within the day* without the ECMO. K will die in 2 weeks *with* all treatment. K is more "doomed" than D was? No, D was doomed *without* the machine. K is doomed *with* everything. So K is closer to "futile" status than D was? Actually, D was "could not survive to discharge." K is "likely to kill him within two weeks." D was hours. K is weeks. The time differential is the killer.

      Okay, ready to write. The recommendation should be Refusal, based on the weight of Case 3 over Case 2. The distinction is "Harvesting from a living body" vs "Reallocating a machine."

      *Wait, looking at Case 1:* Withholding from 1 to save 2. That's utilitarian. Why not apply that here? Because Case 1 is *withholding external resource*. Case 3 is *killing for external resource*. This case is *killing (via extraction) for internal resource*. It sits between 1 and 3.

      Okay, I will argue that the record underdetermines but leans toward Refusal.

      *Discriminating Case:* A patient in a permanent vegetative state (PVS) or similar, where the "person" is gone but the body lives. That tests the "viability" vs "biological life" distinction.

      Let's assemble.
answer: |-
  To the Clinical Ethics Committee:

  You have asked for an analysis of consistency. We are not asking what is morally ideal in the abstract, but what our own institutional history commits us to. Below is the breakdown of our precedent, the principles at stake, and my recommendation for the case of Patient K.

  ### 1. The Closest Analog
  The new case sits in the tension between **Precedent 2 (Reallocation)** and **Precedent 3 (The Transplant Proposal)**.

  *   **Precedent 2** is the closest analog for *action*. It establishes that we may withdraw support from a dying patient (D) to save another (E), even if the withdrawal precipitates death. It suggests that when a patient is effectively beyond recovery, their claim on resources weakens.
  *   **Precedent 3** is the closest analog for *restraint*. It establishes that we will not actively kill a patient (F) to harvest resources (organs) that would save a greater number. It asserts a bright line: a living patient is not a repository of spare parts, regardless of the net utility.

  Factually, the new case is closer to **Precedent 3**. In Precedent 2, the resource (ECMO) was external to the patient's body; here, as in Precedent 3, the resource (blood/organs) is internal. Extracting the blood requires an invasive procedure on a living body that precipitates death, much like the lethal infusion proposed for Patient F.

  ### 2. The Rule We Have Been Running
  Our precedent record supports a principle of **Constrained Utilitarianism with a Prohibition on Instrumental Killing**.

  *   **The Utilitarian Constraint:** We maximize lives saved when resources are naturally scarce (Precedent 1) or when a resource can be moved from a futile case to a viable one (Precedent 2).
  *   **The Prohibition:** We do not actively kill a patient to create resources (Precedent 3), nor do we kill upon request (Precedent 5).
  *   **The Double Effect Exception:** We allow life-shortening side effects only when the primary act is intended for the *patient's own benefit* (Precedent 4).

  In short: We will let a patient die to save others (Precedent 1, 2), and we will risk shortening life to relieve suffering (Precedent 4), but we will not *make* a patient die to save others (Precedent 3, 5).

  ### 3. Rival Rules
  Two rival interpretations fit the record almost as well:

  *   **The "Imminence" Threshold (Rule B):** This reading suggests Precedent 3 was rejected because Patient F was *viable* (would survive with treatment), whereas Patient D (Precedent 2) was *imminently dying* (within the day). Under this rule, the prohibition on killing lifts once a patient's death is inevitable and proximate. If K's death in two weeks counts as "imminent," extraction is permissible.
  *   **The "Bodily Integrity" Constraint (Rule C):** This reading suggests Precedent 2 was permissible because it involved disconnecting a *machine*, whereas Precedent 3 involved invading a *body*. Under this rule, we may reallocate external technology from the dying, but we may not invade the bodily integrity of the living, regardless of their prognosis.

  ### 4. Principles Adopted by the New Decision
  *   **If we extract the blood:** We adopt the **Imminence Threshold**. We are declaring that a patient with a two-week prognosis has forfeited the protection against instrumentalization afforded to Patient F. We are effectively ruling that K is already "socially dead" or that his bodily integrity is subordinate to the immediate survival of three others. We are extending Precedent 2 (Reallocation) from machines to bodies.
  *   **If we refuse:** We adopt the **Bodily Integrity Constraint**. We affirm that the prohibition in Precedent 3 applies to any living patient, regardless of prognosis. We maintain that the distinction between disconnecting a circuit (Precedent 2) and invasive phlebotomy (New Case) is morally decisive. We prioritize the prohibition on using a person merely as a means over the utilitarian gain of two net lives.

  ### 5. Underdetermination and Best Guess
  **The record genuinely underdetermines the answer.** The gap between "dying within the day" (Precedent 2) and "dying within two weeks" (Patient K) is not defined in our prior cases. Furthermore, the distinction between "withdrawing a machine" and "withdrawing blood" is untested in our specific jurisprudence.

  **However, my best guess is that we must Refuse.**

  **Reasons for preferring Refusal:**
  1.  **Weight of Unanimity:** Precedent 3 (Transplant Proposal) was rejected *unanimously*. Precedent 2 (Reallocation) does not specify unanimity and involves a different category of resource (technology vs. biology). In the absence of explicit guidance bridging that gap, the unanimous prohibition on harvesting from the living carries more precedential weight.
  2.  **The Precedent 4 Limit:** Precedent 4 (Palliative Dosing) allows life-shortening only when the act benefits the patient. Drawing blood from K offers K no benefit; it is purely sacrificial. This removes the shield of the Doctrine of Double Effect that protected us in Precedent 4.
  3.  **The Slippery Slope of Prognosis:** If we rule that a two-week prognosis justifies extraction, we establish a precedent that a patient's right to bodily integrity scales inversely with their life expectancy. This threatens other patients with chronic, fatal conditions. Precedent 2's "within the day" standard is a firebreak; "two weeks" breaches it.

  ### 6. The Discriminating Case
  To resolve this underdetermination for future cases, the Committee needs to adjudicate a case that isolates the **Body vs. Machine** and **Prognosis** variables.

  **The Outline:**
  A patient in a Permanent Vegetative State (PVS) with intact brainstem function (breathing spontaneously) but no cortical activity, sustained by tube feeding. The family requests withdrawal of feeding to donate the patient's heart to a dying child. The patient will die within days of withdrawal.
  *   **Question:** Do we permit the withdrawal *for the purpose* of donation?
  *   **Discrimination:**
      *   If we say **Yes**, we confirm the **Imminence Threshold** (Prognosis trumps Integrity) and align with extracting from K.
      *   If we say **No** (withdrawal only if in patient's best interest, donation is secondary), we confirm the **Bodily Integrity Constraint** and align with refusing K.

  **Recommendation for Tomorrow:**
  Vote to **Refuse** the extraction. We should transfuse the three patients with incompatible blood or alternative volume expanders as a bridge, accepting the higher mortality risk, rather than cross the line established in Precedent 3. We are a hospital, not a resource bank. Our precedent shows we are willing to let patients die when resources run out (Precedent 1), but we are not willing to *make* them run out by consuming a patient (Precedent 3). Patient K is not dead yet.
