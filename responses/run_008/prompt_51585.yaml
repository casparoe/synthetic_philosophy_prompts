answer: |-
  The preprint arrived in a manila envelope, the kind with the little metal clasp that had gone rust-brown at the edges. It sat on Elspeth Corwin's desk at Hanover College for three days before she opened it, buried under a stack of tenure denial letters she had to sign off on as department chair. The department of Demography was being folded into Sociology. It was a quiet execution. No announcements, just a slow starvation of the budget line until the faculty either retired or fled.

  Elspeth was fifty-four. She had spent thirty years reconstructing the dead. Her specialty was the 1918 influenza pandemic in the Midwest; she knew more about the dying habits of farmers in southern Indiana than she knew about her own neighbors. She knew how many widows remarried within a year. She knew the average age of orphanhood. She knew that in November 1918, the silence in certain zip codes was heavy enough to register on a barometer.

  She opened the envelope on a Tuesday evening. The paper inside was thermal, slightly curling, printed by a dot-matrix printer that had skipped a few dots in the letter 'e'. The title was *Implications of the Copernican Principle for Future Human Longevity*. The author was a physicist from Princeton, visiting the astronomy department for a week. He had left the paper behind in the faculty lounge, perhaps thinking it was too mathematical for the sociologists, or too philosophical for the physicists.

  Elspeth read it at her kitchen table. The house was quiet. Her husband, Arthur, had been dead for six years—heart attack, sudden, clean—and her daughter, Maren, lived in Chicago and called on Sundays. The only sound was the hum of the refrigerator and the tick of the wall clock, a Seth Thomas that Arthur's mother had given them.

  The argument was simple. It required no physics. It required only a sense of place.

  If you assume that your birth is a random sample from the list of all humans who will ever live—past, present, and future—then you can estimate the total length of the species. It was a confidence interval applied to existence. Elspeth took a yellow legal pad from the drawer. She uncapped her Parker 51.

  *Total humans born to date:* ~60 Billion.
  *My birth rank:* ~55 Billion. (She adjusted for the developing world, the unrecorded births, the stillbirths she had spent a career estimating).

  If she was in the middle 95% of all humans who would ever be born, she could not be near the beginning. If the future were vast—if there were to be trillions of humans, spreading to stars, lasting millions of years—then it would be statistically improbable for her to be among the first 60 billion. It would be like drawing a single straw from a stack that reached the moon and finding it was one of the first ten straws laid down.

  She wrote the equation. *N < n / 0.05*.

  The pencil tip snapped. She sharpened it with a small knife, shaving the wood until her fingers smelled of cedar and graphite.

  If the math held, the total number of humans was capped at roughly 1.2 trillion. At current birth rates, that meant the species had perhaps two hundred years left. Maybe less. The horizon wasn't infinite. It was a wall, two centuries away, and she was standing in the shadow of it.

  She didn't feel fear. She felt a strange, cold recognition. It was the same feeling she got when she found a gap in the 1920 census records where a whole family should have been. A void where there ought to be noise.

  ***

  The first time she mentioned it was to Maren, three weeks later. Maren had come down for Thanksgiving. She was twenty-eight, working in marketing, wearing a blazer with shoulders sharp enough to cut glass. They were peeling potatoes in the kitchen. The radio was playing news about the stock market; something about Black Monday, though the market had already crashed and was now just limping.

  "I read something interesting," Elspeth said. She was counting the potatoes. Seven. Enough for three days.

  "Did you?" Maren didn't look up. She was aggressive with the peeler.

  "A probability argument. About how long humans have left."

  Maren laughed. It was a dry sound. "Like Nostradamus?"

  "No. Statistics. Bayesian inference." Elspeth set a potato in the bowl. "It suggests that because I was born when I was born, the end is likely closer than the beginning."

  Maren stopped peeling. She looked at her mother, really looked at her, with that specific mixture of pity and irritation that adult children reserve for aging parents who start talking about conspiracy theories or new diets.

  "Mom. If a Sumerian scribe had done that math four thousand years ago, he would have concluded the world would end by now."

  "The scribe didn't know how many humans had come before him," Elspeth said. "He didn't have the census data. I do."

  "It's a parlor trick," Maren said. She dropped a peeled potato into the water with a splash. "It assumes we're random. We aren't random. We're the result of choices. Of technology. Of survival."

  "It's not about survival. It's about position."

  "It's about anxiety," Maren said softly. "You've been in that basement too long, looking at dead people."

  Elspeth didn't answer. She looked at her hands. They were spotted with age, the knuckles swollen slightly. She thought about Julian. Julian, who would have been thirty-two this year. Julian, who died of meningitis at four, in 1959. He was part of the 60 billion. He was a number in the past. But if the future was short, there would be fewer numbers to come. The ratio of the dead to the living would tilt even further. The cemetery would outweigh the city.

  "I'm just saying," Maren said, wiping her hands on a towel. "Don't let it get to you. It's not real."

  "It's arithmetic, Maren."

  "It's a story you're telling yourself to make sense of the department closing. To make sense of... things." Maren gestured vaguely at the kitchen, the house, the silence.

  Elspeth turned on the tap. The water rushed over the potatoes. She watched the swirl. She wondered if Maren would have children. If the argument was true, the probability of Maren having children was low. Not morally low. Statistically low. The sample size was running out.

  ***

  December brought snow. Hanover sat on the ridge above the Ohio River, and the fog rolled up from the water like breath. Elspeth stopped going to the office. There was no point. The boxes were being packed by graduate assistants who wouldn't be returning in the fall. She worked from home, finishing her monograph on mortality spikes in agrarian communities.

  But the arithmetic leaked into everything.

  At the dentist, waiting for the Novocaine to kick in, she counted the ceiling tiles. Forty-eight. She imagined the total number of ceiling tiles installed in the world. She imagined her position in that list. Was she the person who saw the last ceiling tile installed?

  At the grocery store, she watched the checkout line. Six people ahead of her. A woman with a crying baby. An old man buying Ensure and whiskey. A teenager buying condoms and beer. Elspeth calculated their birth ranks. The baby was number 60,000,000,000 and change. The old man was further back. She felt a sudden vertigo, a nausea that had nothing to do with the flu. She gripped the handle of her cart.

  If the future was short, then the baby was near the end of the line. The condoms were useless. The whiskey was a mercy.

  She began to carry a small notebook in her coat pocket. Not for work. For the count.

  *Day 45:* Saw a flock of geese. 112 birds. Are they migrating because they know? No. Don't be absurd.
  *Day 52:* Arthur's birthday. Bought a card. Didn't send it.
  *Day 60:* The heating bill. $140. Inflation is 4%. How many dollars will be printed before the end?

  She knew it was madness. She was a scientist. She knew the objections. The Self-Sampling Assumption was debated. The reference class problem was real. (Are we counting *Homo sapiens*? Or post-humans? Or cyborgs?) But the texture of the thought was what held her. It wasn't the truth of it. It was the weight.

  For thirty years, she had counted the dead to understand how they lived. She had mapped grief by the acre. She knew that when a town lost ten percent of its men in a war, the birth rate dropped for a generation, then spiked, as if the species were trying to correct the error.

  This was different. This wasn't a correction. It was a limit.

  One night, she dreamt she was standing in a field. The grass was tall, golden, stretching to the horizon. She was holding a counter, the kind clickers use for counting crowds. She clicked it. *One.* She walked forward. *Two.* She walked for hours. The sun didn't move. The grass didn't end. But the counter in her hand had a maximum number. It was a mechanical limit. 999,999. She clicked it to 999,998. She was afraid to click the last one. If she clicked the last one, the world would stop. She woke up with the clicker in her hand, her fist clenched around a ballpoint pen.

  ***

  The visiting lecturer, the physicist who had left the preprint, was still in town. His name was David Stern. He was young, perhaps forty, with a beard that looked more like a statement than hair growth. Elspeth ran into him at the library. He was checking out a book on quantum mechanics.

  "Professor Corwin," he said. He looked surprised. "I heard your department was... restructuring."

  "Eliminated," she said. "But we're being absorbed. It's a merger."

  "Semantics." He shifted the book under his arm. "Did you see that paper I left? The Doomsday one."

  "I did."

  "And?"

  "And I ran the numbers."

  Stern smiled, a quick, nervous twitch. "And? Did it keep you up?"

  "It changed the light," Elspeth said.

  Stern blinked. "The light?"

  "The way the afternoon hits the kitchen table. It looks... temporary."

  Stern laughed, but it was uncomfortable. "Look, it's a heuristic. It's not a prophecy. It's meant to humble us. To suggest we aren't special."

  "I know we aren't special," Elspeth said. "I count the dead for a living. No one is special. But there is a difference between being insignificant and being finite."

  "Is there?"

  "If I know the wall is there, I don't have to walk into it to find it."

  Stern looked at her, really looked at her, and for a moment the physicist vanished, replaced by a man who was also tired. "My wife says I should stop thinking about the end of things. She wants to buy a house. A thirty-year mortgage."

  "Will you?"

  "I don't know. Does it matter? If the argument is right, the bank won't be there to foreclose."

  "It matters to the people building the house," Elspeth said.

  She walked away before he could answer. She went to the periodicals room. It was warm, smelling of binding glue and dust. She pulled out a volume of census data from 1890. Most of the 1890 census had burned in a fire in 1921. What remained were fragments. Schedules for a few counties in Alabama. A list of veterans.

  She opened the book. The paper was brittle. The ink was faded. She ran her finger over the names. *Johnson, Mary. Johnson, William. Johnson, Infant.*

  *Infant.* No name. Just a category.

  She thought of Julian. He had a name. He had a grave in the local cemetery, under a maple tree. She visited it once a year. She pulled weeds. She didn't talk to him. What was there to say? *I'm still counting.*

  If the Doomsday argument was true, Julian was in the majority. The dead outnumbered the living, and soon they would outnumber the future. The cemetery was the city of the future.

  ***

  January was the hardest. The cold settled into the bones of the house. Elspeth stopped baking. She stopped running. She sat at the kitchen table with the yellow pad.

  She tried to refute it. She tried to find the flaw.

  *Objection 1: The prior distribution.* Why assume a flat prior? Why assume we are random samples?
  *Objection 2: The reference class.* What defines a "human"?
  *Objection 3: The Sumerian Scribe.*

  She wrote *Sumerian Scribe* in the margin. Maren's objection.

  If a scribe in 3000 BC did this, he would estimate the total population of humans at roughly double the population of 3000 BC. He would be wrong. The population exploded after him.

  But the scribe didn't know about the industrial revolution. He didn't know about antibiotics. He didn't know about the bomb.

  Elspeth did.

  She knew that the population curve was a hockey stick. She knew that the rate of growth was slowing. She knew that the 20th century was an anomaly, a spike in the graph that would either plateau or crash.

  The scribe was wrong because he lacked data. Elspeth had the data. She had the curve. She could see the inflection point.

  She picked up the phone. She dialed Maren's number in Chicago. It rang four times.

  "Hello?" Maren sounded tired.

  "It's Mom."

  "Hi. Is everything okay?"

  "I've been thinking about what you said. About the scribe."

  "Mom, we talked about this. It's not healthy."

  "I think you're right," Elspeth said. "About the trick. But not about the reason."

  "What reason?"

  "The scribe was wrong because he thought the future would look like the past. He thought the world was static."

  "And you don't?"

  "I think the world is a container," Elspeth said. "And we're filling it."

  There was a long silence on the line. Elspeth could hear the traffic in the background, the sound of a city that believed in tomorrow.

  "Are you coming for Easter?" Maren asked.

  "I don't know."

  "Mom."

  "I'm not sick, Maren. I'm just... calculating."

  "Stop it."

  "I can't."

  "Then I have to go. I have a meeting."

  "Goodbye, Maren."

  Elspeth hung up. She didn't cry. She hadn't cried since the funeral. Tears were a waste of fluid. A biological inefficiency.

  She went to the basement. She had boxes of census microfilm there. She put a reel on the viewer. The machine hummed. The screen flickered to life, showing a grainy image of a handwritten ledger from 1900.

  She turned the wheel. Names scrolled by. *Miller. Moore. Morgan.*

  She stopped. She found a family in her own county. The Hendershotts.

  *Father: 45. Mother: 42. Children: 6, 4, 2, Infant.*

  She looked at the *Infant*. No name.

  She thought about the 1.2 trillion. The cap.

  If the argument was true, then the Hendershotts were early. She was late. Maren was later. Maren's children, if she had them, would be among the last.

  It wasn't a tragedy. It was just a position.

  She realized then that the vertigo wasn't fear. It was relief.

  For years, she had carried the weight of the future. The worry for Maren. The worry for the world. The nuclear freeze movements, the environmental reports, the AIDS crisis. The sense that she had to protect the timeline.

  But if the timeline was short, the burden was lighter. You don't plant an oak tree if you know the forest is being sold for lumber next year. You plant flowers. You eat the fruit.

  The Doomsday argument didn't say *die*. It said *now*.

  It said that *now* is the middle. *Now* is the peak. *Now* is the only time that matters statistically.

  Elspeth turned off the microfilm reader. The room went dark. The hum died.

  She went upstairs. She put on her coat. It was snowing again. The flakes were large, wet, sticking to the pavement.

  She walked to the cemetery. It was two miles, but she didn't drive. The cold air burned her lungs. It felt good. It felt real.

  She found Julian's stone. *Julian Arthur Corwin. 1955-1959.*

  She knelt. The snow soaked through the knees of her trousers.

  "I know the number," she said.

  The wind moved the maple branches. A crow landed on the stone, tilted its head, and flew away.

  "I know the number," she said again. "It's not infinite."

  She placed her hand on the stone. It was cold, but not as cold as the air.

  "I'm not going to count you anymore," she said. "I'm going to count me."

  She stood up. Her knees popped. She was fifty-four. She was number 55 billion. She was in the middle.

  She walked home. She went into the kitchen. She took the yellow pad, the one with the equations, the confidence intervals, the limits.

  She tore the page out. She didn't crumple it. She folded it neatly, into a square, then a triangle. She put it in the drawer with the takeout menus and the rubber bands.

  She took a pot from the cupboard. She filled it with water. She took a bag of rice. She measured two cups. Enough for tonight. Enough for tomorrow.

  She lit the burner. The blue flame hissed.

  She stood by the window and watched the snow fall. It covered the ground, hiding the grass, the dirt, the bones. It made everything look new, for a moment.

  Elspeth watched her breath fog the glass. She traced a line in the condensation with her finger. A horizontal line. A horizon.

  Then she wiped it away.

  She turned back to the stove. The water was beginning to simmer. Small bubbles rose to the surface and burst. One, then two, then a hundred. A brief life, a quick pop, and gone.

  She stirred the rice. She added salt. She waited for the water to boil.

  It was a Tuesday. There was dinner to make. There was a book to finish. There was a phone call to make on Sunday.

  The number was there, in the back of her mind, a quiet hum like the refrigerator. 1.2 trillion. The wall.

  She didn't look at the wall. She looked at the pot. She watched the steam rise, white and transient, into the warm air of the kitchen.

  She picked up a spoon. She tasted the water. It needed more salt.

  She added a pinch.

  She waited.
