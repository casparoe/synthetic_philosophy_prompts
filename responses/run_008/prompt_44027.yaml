answer: |-
  **Project Title:** Testing the Political Artifact: A Falsification Project
  **Applicant:** [Your Name]
  **Duration:** Nine Months

  **Project Overview**
  Decades ago, Langdon Winner asked whether technological artifacts can have politics. The canonical answer relied on the story of Robert Moses, who allegedly built low bridges on Long Island parkways to prevent buses—and thus, poor people—from reaching the beaches. Historians have since dismantled this story; the evidence does not support the claim that the bridges were designed for that exclusionary purpose. Yet, the broader thesis remains untouched. Believers still believe artifacts encode power; skeptics remain skeptical. This persistence suggests the "political artifact" thesis is functioning as a metaphysical stance rather than an empirical hypothesis. This project aims to state the thesis in a form that could actually be refuted by facts about design and history, and then determine, honestly, whether any version of it survives.

  **1. The Question: Distinguishing Three Readings**
  Current discourse conflates three distinct claims about technology and power. To test the thesis, these must be disentangled:
  *   **Intentional Encoding:** A design decision is made *specifically* to establish or maintain an authority relation (e.g., a designer intentionally excludes a group). This is the Moses claim.
  *   **Affordance and Default:** Regardless of intent, an artifact fits certain social arrangements better than others. Adopting it settles a political question by default because reversing the social order becomes too costly or difficult (e.g., infrastructure that necessitates private car ownership).
  *   **Mere Reflection:** An artifact reflects the politics of its makers without reinforcing them. The technology is a symptom of power, not a vehicle for it.

  Confusion arises when evidence against the first reading (intent) is treated as irrelevant because the second reading (affordance) remains plausible. This project will treat them as separate hypotheses requiring separate evidentiary standards.

  **2. The Problem: Immunity to Evidence**
  Both hard determinists and social constructionists currently occupy positions that accommodate any historical finding. If a designer's notes show no political intent, the determinist argues the *artifact itself* enforces politics anyway. If the artifact proves neutral in practice, the constructionist argues the *context* masked its politics. Because the thesis is rarely stated in a way that allows for a negative result, it cannot advance. It functions as a lens through which history is viewed, rather than a claim about history itself. This project seeks to break this immunity by defining conditions under which the political reading would have to be abandoned.

  **3. The Method: Pre-Registered Case Studies**
  I will select a handful of cases where the design history is unusually well-documented and the political interpretation is contested. To avoid cherry-picking, cases will be chosen based on fixed criteria stated in advance:
  *   **Documentation:** Archival records (memos, drafts, correspondence) must be sufficient to establish designer intent.
  *   **Contestation:** There must be an existing public or academic debate regarding the artifact's political nature.
  *   **Variety:** Cases must span different domains (e.g., physical infrastructure, digital architecture, regulatory technology) to ensure the criteria are robust.

  For each case, I will specify ahead of time what finding in the documentary record would count *for* and *against* the political reading. For example, if the claim is Intentional Encoding, the discovery of memos explicitly prioritizing cost or safety over social engineering would count against the thesis. If the claim is Affordance, evidence that alternative social arrangements were easily adopted alongside the technology would count against it.

  **4. The Deliverable**
  The output will not be a traditional monograph. It will consist of two practical components:
  *   **A Heuristic for Analysts:** A set of working criteria that editors, policy analysts, and journalists can use to judge when a story of the form "the technology itself is political" is actually earned. This will serve as a checklist to prevent the uncritical repetition of technological determinism.
  *   **A Long-Form Essay:** A narrative explanation of these criteria, illustrated through the investigative process of the case studies. This will translate the methodological rigor into a story accessible to a general-interest audience.

  **5. Defining Failure**
  Intellectual honesty requires defining what failure looks like. If, after applying the criteria, it becomes clear that every criterion is satisfiable or violable without changing anyone's verdict on the technology's politics, the honest conclusion is that the thesis as normally used is unfalsifiable. The essay will state this plainly rather than burying it. A negative result is still a result; it clarifies that the "politics of artifacts" is a philosophical commitment, not an empirical discovery.

  **Why Fund a Journalist?**
  This project requires forcing abstractions back against the documentary record, which is where this thesis either lives or dies. Philosophers are trained to refine concepts; journalists are trained to dig through the muck of the archive to see if those concepts match the world. My comparative advantage is not in generating new theory, but in subjecting existing theory to the friction of reported fact. Policy institutes often produce work that remains within the academy or the beltway. As a journalist, I will ensure the findings are tested against the standard of public evidence and communicated in a way that influences how the media and policymakers talk about technology. If the "political artifact" is to be more than a parlor trick, it must survive contact with the actual paper trail of how things get built. I propose to be the one to arrange that contact.
