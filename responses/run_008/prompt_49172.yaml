answer: |-
  **What Hume actually gives you**

  Hume shifts the question from "What is beauty?" to "Who is the judge?" He identifies five traits: practice, comparison, delicacy, freedom from prejudice, and good sense. The standard of taste is the joint verdict of these "true judges" across history. But this is retrospective validation, not a manual. He offers an aristocracy of sensibility, not a checklist. For a weekly critic, this is frustrating: Hume explains why some reviews last, not how to write one by Tuesday. You need to operationalize "delicacy" into annotation and "comparison" into quick research, transforming a philosophical ideal into an editorial workflow that admits when you lack the data to judge. The core tension is time: Hume's standard requires centuries; you have a week. You are attempting to simulate the verdict of time under deadline pressure, which requires rigorous self-policing to avoid mistaking personal whim for universal standard.

  **The procedure**

  1.  **Prejudice Scan:** Before reading, list expectations and biases. If you cannot mentally bracket them (e.g., hatred of the author or genre), you fail "Freedom from Prejudice." Verdict withheld.
  2.  **Delicacy Audit:** During reading, flag specific passages causing reaction. General "vibes" fail here. You must cite syntax, pacing, or imagery. If reactions remain unmoored from text, you fail "Delicacy."
  3.  **Comparison Check:** Spend two hours researching context. Is this trope innovative or stale? If you lack genre knowledge to answer, you fail "Practice and Comparison."
  4.  **The Circularity Brake:** Draft your verdict. Then, find one respected critic who disagrees. Can you articulate why they are wrong using text, not status? If no, soften the verdict. This prevents laundering taste by forcing external challenge.
  5.  **Publication Decision:** If steps 2 or 3 fail, write descriptively. Do not pronounce quality.

  This workflow converts Hume's virtues into gates. Passing means you may claim authority. Failing means you report experience only. It forces you to prove you aren't just repeating your own biases by demanding textual evidence and engaging dissent before printing. It acknowledges that a verdict is a claim on others' attention, requiring proof of competence. Crucially, it fits a seven-day cycle: days 1-2 for reading/audit, day 3 for comparison, day 4 for the brake, days 5-7 for writing. It turns philosophical ideals into editorial triage. If you fail the Circularity Brake, you must rewrite the verdict as provisional. This ensures you aren't just laundering your existing taste by forcing you to engage with counter-arguments explicitly. It makes the review a dialogue, not a decree.

  **Three cases**

  Case 1: The Hyped Novel. Your friends represent the current "joint verdict." To dissent, Step 2 requires specific textual evidence of hollowness, not just feeling. If you find only vague dissatisfaction, the procedure forces you to acknowledge your outlier status. You publish, but frame it as "This didn't land for me," rather than "This is bad." You avoid looking foolish when the book endures. The procedure protects you from contrarianism for its own sake, ensuring your dissent is grounded in craft, not just rebellion. You maintain credibility by admitting subjectivity where objective consensus exists.

  Case 2: The Thriller. You enjoyed it but feel snobbish guilt. Step 3 (Comparison) reveals it follows genre conventions perfectly. Step 4 challenges your "bad" intuition. The procedure concludes: It succeeded at its aim. Your discomfort is prejudice against genre. Verdict: "Effective thriller," not "Guilty pleasure." You must admit your elitism was the flaw, not the book. This is the uncomfortable answer: your taste was the variable, not the quality. You must publish praise for something you feel ashamed to like, validating pop art over your own snobbery. The procedure demands you respect the genre's internal logic over your external prejudices.

  Case 3: The Romance/Insta Poetry. Step 1 and 3 fail immediately. You lack "Practice and Comparison." You cannot distinguish cliché from convention. The procedure halts verdict issuance. You write about the cultural phenomenon or your experience as a stranger, but you cannot judge quality. You acknowledge incompetence rather than pretending universal authority. This shows the limit: you cannot judge what you do not know. You become a reporter, not a critic. The procedure saves you from error by forcing silence on quality. It admits that some gates cannot be opened without the right key.

  **Where it breaks**

  Hume's circle remains: you pick judges by their verdicts, then use judges to pick verdicts. This procedure mitigates it by forcing textual evidence (Step 2) and dissent checks (Step 4), but it can't solve the foundational epistemology. Also, Hume's standard emerges over centuries; you have seven days. You are simulating authority, not embodying it. Finally, "Good Sense" is unteachable. If you lack it, this checklist just makes you a more rigorous fool. It protects your reputation, not the truth. It turns vibes into arguments, but arguments can still be wrong. It's a tool for professional humility, not aesthetic certainty. You still decide who counts as a "respected critic" in Step 4, which reintroduces the bias you sought to escape.
