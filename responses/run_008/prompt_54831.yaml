answer: |-
  Here is a construction of the argument, drafted as a philosophical afterword suitable for your novel. It adopts your voice as a novelist to ground the metaphysical claims, confronts the two rejoinders directly, and attempts to leave the reader with a robust, if uncomfortable, ethical framework.

  ***

  ### Afterword: The Malformed Ledger

  My protagonist, a woman who spent forty years pricing the unpriceable, believes she has found a solution to the trolley problem by expanding the tracks until they cover the earth. She believes that if the number of people is large enough, the dust speck becomes a mountain. She is an actuary; she believes in the sum. I am a novelist; I believe in the story. And it is from the craft of fiction that I draw the evidence to suggest that her trade is not merely objectionable, but category-error. It is a malformed question.

  The argument rests on a claim about the ontology of harm. We tend to treat pain as a fluid substance, measurable in milliliters, pourable from one vessel into a billion smaller ones. But human life does not have the structure of a container; it has the structure of a narrative. A life is not a sum of moments; it is a coherence of memory, identity, and trajectory. For a harm to possess moral weight, it must have *narrative purchase*. It must enter the story the subject tells about themselves, or the story that is being lived through them. It must leave a trace.

  A dust speck in the eye is narratively inert. It stings, it blinks, it is gone. It is not remembered five minutes later. It does not alter a decision, sour a mood, or change a relationship. In my profession, if I insert a sentence into a manuscript that describes a character getting a speck in their eye, and then never reference it again, I have not written a different character. I have added noise, not plot. I contend that this is not merely an aesthetic limitation of fiction, but an ontological truth about harm. If an event leaves no trace on the continuity of the self, it has no magnitude in the moral ledger.

  To aggregate these specks across Knuth's triple-up-arrow number of people is not to build a mountain of pain. It is to count zeros. $N \times 0 = 0$. The question "How bad are all those specks?" has no answer, not because the answer is too large for our minds, but because the sum does not exist.

  However, to rest here is to invite two devastating rejoinders. If I am to stand by this, I must answer them.

  **I. The Threshold Problem**

  The first objection is practical. If only narratively salient harms count, what becomes of the ordinary arithmetic of society? We accept vaccine mandates because the tiny risk of a side effect for a million people is worth preventing a severe illness for a few. We accept that a million stubbed toes are preferable to one broken leg. If I claim the specks sum to zero, do I not also claim the stubbed toes sum to zero? Does this not dismantle epidemiology, public policy, and the basic compromise of communal life?

  The distinction lies between *risk* and *actualized inertness*, and between *noise* and *signal*.

  Public health ethics deals primarily in the aggregation of *risks* of narrative disruption, not the aggregation of actualized trivialities. A vaccine mandate asks millions to accept a microscopic *probability* of harm to prevent a significant *probability* of narrative termination (death) or disruption (illness). The trade is valid because the prevented harm has massive narrative purchase.

  But what of the million stubbed toes? Here, I must bite the bullet, though I will soften the landing. A stubbed toe is often, like the speck, narratively inert. It hurts, but it is forgotten. If we imagine a universe where a million people stub their toes and none of them remember it, none of them limp, and none of them are turned from their path, then yes: morally, nothing has happened. The utilitarian intuition that "pain is pain" demands we count it. The narrative intuition demands we ask: *Whose pain? And did it matter to them?*

  The line is not arbitrary pain intensity (e.g., "anything above 3 on a scale of 10 counts"). The line is *integration*. A broken leg forces a rewrite of the week's plot; it alters the character's agency. A speck does not. This threshold is not drawn by a bureaucrat, but by the structure of consciousness itself. We are not buckets of sensation; we are authors of our continuity. To treat us as buckets is to violate the very thing we are protecting.

  Does this retreat from application? No. It restricts application to where it belongs. We do not justify torture by aggregating annoyances. We justify minor impositions (taxes, traffic lights) not because they sum to a great good, but because they are the *grammar* that allows the narrative to proceed without collision. The trade my actuary proposes is not a traffic light; it is the destruction of the protagonist to save the background extras from a typo.

  **II. The Exclusion Problem**

  The second objection is moral. If moral weight requires narrative purchase—if harm must leave a trace in the life-story—do we not exclude the most vulnerable? The infant cannot narrate their life. The patient under anesthesia does not remember the pain. The person with advanced dementia has lost the thread of their story. If I argue that unremembered harms are inert, do I not sanction the abuse of those who cannot weave their suffering into a narrative?

  This is the point where the argument must bend, or break. I refuse to let it break. Therefore, it must bend.

  We must expand the definition of "Narrative" beyond *autobiographical memory*. A life is not only the story one tells oneself; it is the *biological and teleological arc* of a being. The infant has a narrative of development; the dementia patient has a narrative of care and remaining dignity; the anesthetized patient has a narrative of bodily integrity.

  Pain matters to the infant not because they will remember it at age forty, but because it disrupts the *current chapter* of their flourishing. It is a violent edit to a sentence being written in real-time. The dust speck, by contrast, is so minor it does not even disrupt the sentence; it is a typo corrected before the ink dries.

  The distinction is not "remembered vs. unremembered." It is "integrable vs. destructive." Torture is destructive; it shatters the capacity for narrative entirely. A dust speck is absorptive; the system corrects for it instantly. The suffering of the voiceless counts because it damages the *potential* or the *residue* of their life-story, even if they cannot articulate it. But the *aggregation* of trivialities still fails. A million infants getting a dust speck does not equal one infant being tortured, because the speck does not damage the arc. It is noise. The torture is silence.

  **Conclusion: The Actuary's Error**

  So, what survives of this argument? Is it a genuine restriction on aggregation, or just my intuition dressed in narratological language?

  It is a restriction on the *colonization of the trivial*. Utilitarianism assumes that all value exists on a single plane, where enough grains of sand become a rock. I am arguing that value exists on different planes. There is the plane of sensation (the speck) and the plane of meaning (the torture). You cannot trade between planes.

  My experience as a novelist is the evidence. I can kill a character, and the reader weeps. I can describe a character getting a speck in their eye a billion times across a billion books, and the reader feels nothing. This is not a failure of imagination. It is a recognition of truth. We are not aggregates. We are stories. And you cannot kill a story with a million typos.

  The actuary in my book chooses the specks. She believes she is saving the world from a monster. I argue she is merely feeding the monster the wrong currency. She offers it noise, expecting it to be satisfied. But the monster eats meaning. And in the end, the only thing that mattered was the one person whose story was ended, while the billion others merely blinked.
