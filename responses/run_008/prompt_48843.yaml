          4.  **Thread 3 (Modern Cosmology).** This is the coda/rebuttal. It resolves the "is it true?" anxiety but shouldn't block the main argument.

      *   *Missing Thread:* **The Equivocation of Time.** (As decided above). You cannot discuss the "ideality of time" without defining whether you mean "measured duration" or "ontological becoming." This is upstream of *everything*. If I don't rank this #1, the piece fails.

