  **JOINT STATEMENT ON AESTHETIC VALUE AND PROVENANCE**
  **Issued by the Seminar on Fakes, Forgeries, and Authenticity**
  **Date: December 14, 2023**

  **Preamble**
  After a semester of adversarial collaboration, the two primary factions within this seminar—designated here as the **Perceptualist Camp** (focusing on visual indistinguishability and immediate experience) and the **Historicist Camp** (focusing on genesis, agency, and context)—acknowledge that our debate has shifted from mutual incomprehension to precise disagreement. We recognize that we share a commitment to the value of art, but diverge on the locus of that value. This document codifies our common ground, clarifies our remaining disagreements, and establishes empirical tests to resolve them.

  ### I. Agreed Claims
  *Both camps affirm the following propositions as true:*

  1.  **On Deception:** The act of passing off a copy as an original for financial gain constitutes fraud, regardless of the copy's aesthetic merit. Ethical and legal judgments regarding forgery are distinct from aesthetic judgments.
  2.  **On Van Meegeren:** Han van Meegeren's *Supper at Emmaus*, once accepted as a Vermeer, possesses significant historical value *as a forgery*. Its current value lies in its narrative of deception and its technical mastery, not in its status as a 17th-century artifact. Both camps agree that its reclassification changed its art-historical function, even if its visual properties remained static.
  3.  **On Digital Reproduction:** A perfect digital reproduction of a painting (e.g., a high-resolution scan displayed on a calibrated monitor) captures the color and composition of the original but fails to capture the material history (brushstroke depth, canvas weave, aging). Both camps agree the digital file is not the *same object* as the physical painting.
  4.  **On the Role of Knowledge:** Knowledge of an object's provenance alters the viewer's psychological state. Both camps agree that learning a work is a fake changes the viewer's *attitude*, even if they disagree on whether this change constitutes a change in *aesthetic experience* or merely a change in *contextual framing*.

  ### II. Table of Disagreements
  *The following table outlines the core divergences. Each position is phrased to ensure the proponent of that view accepts the wording as accurate, without requiring the opposing camp to concede the point.*

  | Topic | Perceptualist Camp Position | Historicist Camp Position |
  | :--- | :--- | :--- |
  | **The Source of Value** | Aesthetic value is primarily a function of the object's perceptible properties and the qualitative experience they generate in the viewer. | Aesthetic value is partially constituted by the object's history of production, including the artist's intentions and the work's temporal context. |
  | **The "Perfect Copy" Thought Experiment** | If a copy is visually indistinguishable from the original to the ideal observer, the aesthetic experience provided is equivalent, rendering the original's uniqueness instrumentally, not aesthetically, valuable. | Even if a copy is visually indistinguishable, it belongs to a different artistic category than the original; therefore, the aesthetic experience is categorically different once the history is known. |
  | **The Function of Authenticity** | Authenticity serves as a heuristic for quality and rarity, but it is not a constituent ingredient of the aesthetic experience itself. | Authenticity is a constituent ingredient of the aesthetic experience; to view a work as "authentic" is to see it differently than to view it as a "copy." |

  ### III. Cruxes and Empirical Tests
  *We have identified two fundamental cruxes where our theories make different predictions about the world. We agree to the following tests to adjudicate these claims.*

  **Crux 1: Experiential Content vs. Cognitive Framing**
  *   **The Question:** Does knowing a work is a fake change the *sensory experience* of seeing it, or only the *intellectual judgment* about it?
  *   **The Test:** The "Blind/Reveal" Protocol. Participants undergo fMRI scanning while viewing two visually identical images. In Round 1, both are labeled "Original." In Round 2, one is labeled "Copy." Participants report on the intensity of their aesthetic pleasure.
  *   **Perceptualist Prediction:** Neural activity in visual processing centers will remain constant between rounds. Changes in reported pleasure will correlate with activity in reward/valuation centers, not visual centers. The *seeing* does not change; the *valuation* does.
  *   **Historicist Prediction:** Neural activity in visual processing centers will shift between rounds. Knowledge of provenance penetrates the visual experience itself (cognitive penetration). The *seeing* changes because the *category* of the object has changed.

  **Crux 2: Locus of Value (Object vs. Relation)**
  *   **The Question:** If the original is destroyed, but a perfect physical duplicate survives, has aesthetic value been lost?
  *   **The Test:** The "Destruction" Scenario. A thought experiment regarding the hypothetical destruction of the *Mona Lisa* given the existence of a perfect physical replica (molecule-for-molecule).
  *   **Perceptualist Prediction:** No significant aesthetic value is lost. The experience available to viewers remains identical. The loss is purely historical/archival.
  *   **Historicist Prediction:** Significant aesthetic value is lost. The link between the specific object and the specific creative act of Leonardo is severed. The replica is a testament to the original, not a substitute for the aesthetic encounter.

  ### IV. Statement on the AI Completion Case
  *Case Description: An AI is trained exclusively on a famous painter's surviving works. It completes the painter's final unfinished canvas. The workshop sells the object with a clear disclaimer stating the AI generated the final strokes.*

  Both camps agree that because the provenance is disclosed, this object is **not a forgery**. Both camps agree this object represents a **genuinely new category** of artifact. However, we describe this category and its value differently, using wording the opposing side accepts as a fair description of our view.

  **1. Classification of the Object**
  *   **Perceptualist Description:** We classify this as an **"Algorithmic Realization."**
      *   *Rationale:* The visual result fulfills the stylistic trajectory of the artist. Since the visual properties are indistinguishable from what the human artist might have produced, the aesthetic function is complete.
  *   **Historicist Description:** We classify this as a **"Simulated Completion."**
      *   *Rationale:* The visual result mimics the style but lacks the intentional agency of the artist during the final act. The causal chain of human creativity was interrupted and replaced by statistical prediction.

  **2. Assessment of Value**
  *   **Perceptualist Assessment:** The object holds **full aesthetic value** relative to its visual properties. The disclaimer ensures no deception, allowing the viewer to engage with the image on its own merits. The tool (AI) is irrelevant to the beauty of the outcome.
  *   **Historicist Assessment:** The object holds **diminished historical-aesthetic value**. While it may be visually pleasing, it cannot be appreciated as an expression of the original artist's final intent. It is a collaboration between the dead artist and a mathematical model, which is a different artistic achievement than a unified human work.

  **3. Joint Conclusion on the Case**
  We agree that this object challenges the binary of "Original vs. Fake." It forces us to acknowledge a third category: **"Disclosed Posthumous Extension."** Both camps agree that the market and museums must treat this category distinctly from both "Authentic Works" and "Forged Fakes," requiring new labeling standards that specify the percentage of human vs. algorithmic agency.

  ***

  **Signed,**

  *The Perceptualist Camp*
  *The Historicist Camp*
