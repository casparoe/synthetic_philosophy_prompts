  Dear Friends,

  As we bring our term on collective intentionality to a close, I have been thinking about how best to diagnose where each of us actually stands, not merely where our sympathies lie when reading a particular author. To that end, I have constructed a decision tree that begins from the one commitment we all share, namely that there is a genuine difference between two people mowing their own halves of a lawn side by side and two people mowing the lawn together. From this root, the tree branches through a series of concrete claims about the cases we have discussed, leading each of you to a specific account of joint action. There are seven branch questions in total, designed to be answered in about fifteen minutes, and they utilize the five cases we found most sorting power in: the corporation case, the dog case, the walking case, the fence case, and the duet case.

  The first branch question turns on the corporation case, where a company buries a memo through the meshing of private employee intentions without any single person intending the burying. You must decide whether it is literally true that the company decided to bury the memo, over and above the actions of its members. If you answer yes, holding that the group is itself an intentional subject irreducible to its members, your path terminates immediately at the leaf labeled Group-Agent Realism associated with List and Pettit. If you answer no, maintaining that only the individuals act, you proceed to the second question.

  The second question relies on the dog case, in which two spouses each privately intend that we walk the dog tonight, their intentions interlock by coincidence, and the dog gets walked exactly once. You must decide whether this coincidental mesh is sufficient for joint action. If you answer yes, claiming that overlapping individual intentions are all that collectivity amounts to, your path terminates at the Reductive or Summative view. If you answer no, insisting that joint action requires something more than accidental alignment, you proceed to the third question.

  The third question draws on the walking case, where two people are walking together and one wants to stop. You must decide whether the person who wants to stop is under any normative obligation to consult the other before doing so. If you answer no, denying that joint action creates such obligations, you proceed to the fourth question. If you answer yes, affirming that there is an obligation, you proceed to the fifth question.

  The fourth question, for those who denied obligations in the walking case, turns on the fence case, where four households repaint a shared fence without voiced agreement. You must decide whether the intention to act together is reducible to each person having an individual intention that we paint the fence. If you answer yes, holding that the collective intention is nothing over and above interlocking individual intentions, your path terminates at Bratman's interlocking-intentions account. If you answer no, claiming that the intention is primitive or irreducible even at the individual level, you proceed to the sixth question.

  The fifth question, for those who affirmed obligations in the walking case, also turns on the walking case but asks about the source of the constraint. You must decide whether stopping unilaterally is wrong because it violates an explicit or implicit joint commitment made to the other person. If you answer yes, locating the normativity in the commitment itself, your path terminates at Gilbert's joint commitment and plural subject view. If you answer no, suggesting the obligation stems from something else, you proceed to the seventh question.

  The sixth question, for those who reached it via the fence case, asks whether in the fence case the joint action is compatible with everyone acting primarily for private goals, such as property values, rather than group reasons. If you answer yes, allowing that primitive we-intentions can exist alongside private motivations, your path terminates at Searle's appeal to we-intentions and collective intentionality in action. If you answer no, you proceed to the seventh question.

  The seventh and final question turns on the duet case, where one singer silently mouths words while a recording does the work. You must decide whether the joint action fails primarily because the faker lacks a commitment to the group's goal rather than merely lacking a shared mental state. If you answer yes, emphasizing the necessity of acting for group reasons in the we-mode, your path terminates at Tuomela's distinction between the I-mode and the we-mode. If you answer no, maintaining that the lack of a primitive we-intention is the sole failure, your path converges with the sixth question's yes branch at Searle's account.

  I must be honest about the logical space this tree constructs. There is a combination of answers that leads to no occupant: if you answer yes to obligations in the walking case but no to the joint commitment source in the fifth question, and then no to the group reasons claim in the seventh question, you are left with a view that posits normative obligations without commitment or group reasons, which seems incoherent within the available frameworks. Furthermore, the tree leaves Searle and Tuomela adjacent, separated only by the nuance of whether private goals are compatible with the collective state. While the duet case attempts to prise them apart by focusing on the reason for failure, it is possible that your intuitions here will not cleanly distinguish a primitive we-intention from a we-mode commitment. To separate them further, we would need a case where agents share a we-intention but explicitly reject the group's ethos, testing whether the cognitive state alone suffices for joint action or if the normative stance is constitutive. I hope this instrument helps us locate ourselves not by the books we have read, but by the cases we believe in.
