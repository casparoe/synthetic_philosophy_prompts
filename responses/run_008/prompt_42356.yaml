      *   **Least Sure Point:** The grading of the "Substantive vs. Verbal" conclusion. Scholars debate this (Graham vs. Nivison vs. Van Norden). The student's reasoning is internally consistent even if premises are flawed. I need to decide if penalizing the conclusion is fair. I'll note this uncertainty.

