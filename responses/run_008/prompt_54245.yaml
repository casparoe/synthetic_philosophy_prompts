prompt: |-
  I serve on the committee that awards my university's Distinguished Teaching Medal, and this cycle we are deadlocked between two finalists. The first has an unremarkable teaching record — middling student evaluations, no curricular innovation, several colleagues describing his classroom as competent but charisma-free — but he is our most generous living donor, and our development office has let it be known, without ever saying so outright, that a public slight in the very semester the new science building's naming is being finalized could complicate a nine-figure pledge. The second finalist has an exemplary record but is early-career and could plausibly be honored in a later cycle without loss to anyone. Our charter says only that the medal recognizes excellence in teaching, while leaving the committee discretion to weigh the broader interests of the university.

  Half the committee holds that donor considerations are simply corrupting: the only legitimate reasons for awarding the medal are considerations in virtue of which a candidate deserves it, and anything else is institutional bribery with better manners. The other half holds that the committee is an organ of the university rather than a passive register of desert, and that institutional consequences can be legitimate reasons for the committee's decision even though they are not reasons why the winner is an excellent teacher — much as, they say, the fact that believing something would comfort you can be a reason to want the belief without being a reason to hold it.

  Please draft the decision memo I will circulate before our vote. It should recommend one concrete course of action (including whether a compromise such as deferring the medal with a public citation to the second finalist is coherent or just a way of hiding from the question), give the reasons a colleague could actually respond to, and engage the strongest version of the side it rejects — taking seriously the distinction between reasons that make a candidate deserving and reasons that can rightly move a committee whose action has consequences beyond recording desert. The memo should also state plainly which single consideration, if it came out differently, would flip the recommendation, and where its own reasoning is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Distinguished Teaching Medal Committee.
      *   **Situation:** Deadlock between two finalists.
          *   Candidate A: Mediocre teacher, huge donor (9-figure pledge at risk if slighted).
          *   Candidate B: Exemplary teacher, early-career (can wait).
      *   **Conflict:** "Desert-based" view (only teaching merit matters) vs. "Consequentialist/Institutional" view (committee serves the university's broader interests).
      *   **Charter:** Recognizes excellence in teaching but allows discretion to weigh broader university interests.
      *   **Task:** Draft a decision memo to circulate before the vote.
      *   **Requirements:**
          *   Recommend one concrete course of action.
          *   Address whether compromise (deferral + citation) is coherent or cowardly.
          *   Provide reasons colleagues can respond to (practical, ethical, institutional).
          *   Engage the strongest version of the rejected side (steel-manning).
          *   Acknowledge the distinction between *reasons for desert* and *reasons for committee action*.
          *   State plainly which single consideration would flip the recommendation.
          *   Admit where the reasoning is most likely to fail.

  2.  **Determine the Recommendation:**
      *   *Option 1: Award to Donor (Candidate A).* This preserves the funding but destroys the medal's integrity. It risks long-term reputational damage if leaked (and leaks happen). It demoralizes faculty.
      *   *Option 2: Award to Teacher (Candidate B).* This upholds integrity but risks the building funding.
      *   *Option 3: Defer/Compromise.* The prompt asks to evaluate if this is coherent or hiding.
      *   *Decision:* The most ethically defensible and institutionally sustainable position is to **award the medal to Candidate B (the exemplary teacher)**.
      *   *Why?* The core currency of a university is academic integrity. If the teaching medal is perceived as bought, *all* awards lose meaning, faculty trust erodes, and the "brand" damage could outweigh the donation. Also, the charter says it recognizes *excellence in teaching*. Awarding it to a mediocre teacher is a lie.
      *   *Nuance:* I need to acknowledge the "Institutional Interest" argument seriously. The memo shouldn't just be moralizing; it needs to be pragmatic about institutional health.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (break the deadlock) and the recommendation clearly.
      *   **The Core Distinction (Desert vs. Action):** Address the philosophical split directly. Acknowledge that the committee *does* act within an institutional context (validating Side 2), but argue that the *specific mechanism* of a teaching award binds the committee to truth-telling about teaching.
      *   **Engaging the Opposing View (Steel-manning):**
          *   Acknowledge that the committee isn't a vacuum.
          *   Acknowledge that the science building helps *everyone* (including future students of Candidate B).
          *   Acknowledge that "purity" can be self-indulgent if it burns down the house.
          *   *Counter-argument:* However, the specific *instrument* (a teaching medal) has a semantic function. Using it for fundraising corrupts the language of the university. It's a category error.
      *   **Addressing the Compromise (Deferral):**
          *   Is it coherent? No. It's "hiding from the question."
          *   If B is worthy now, deferring is a punishment.
          *   If A is unworthy, deferring implies they might be worthy later.
          *   It signals we know the right answer but lack the courage to act.
      *   **The "Flip" Condition:** What would change my mind? If the donation were *existential* (e.g., without it, the university closes or fires faculty) vs. *expansive* (a new building). Or if the charter *explicitly* allowed non-teaching criteria for the medal (it doesn't). Let's go with: If the loss of funds directly threatened current faculty positions or student enrollment (existential threat) vs. a capital project.
      *   **Vulnerability of Reasoning:** Where might I be wrong? Underestimating the opacity of the process (maybe it won't leak). Or overestimating the symbolic power of one medal. Or being too idealistic about faculty morale vs. financial reality.
      *   **Conclusion:** Reiterate the call to vote for B.

  4.  **Refining the Tone:**
      *   Must be professional, respectful, but firm.
      *   Avoid moral grandstanding ("bribery") while acknowledging the risk.
      *   Use the language of the charter ("broader interests").
      *   Ensure the distinction between "reasons for desert" and "reasons for action" is clear.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "early-career" aspect of Candidate B?
      *   *Fix:* Yes, acknowledge that "can wait" is a pragmatic point, but "excellence recognized late" is less meaningful than "excellence recognized when achieved."
      *   *Check:* Did I address the "broader interests" clause in the charter?
      *   *Fix:* Yes, argue that the *long-term* broader interest is integrity, which outweighs the *short-term* interest of the building.
      *   *Check:* Is the "Flip" condition specific?
      *   *Fix:* Make it about the *nature* of the financial loss (operational vs. capital).
      *   *Check:* Is the compromise analysis sharp?
      *   *Fix:* Call it what it is: a face-saving measure that satisfies no one.

  6.  **Final Polish:** Check against the prompt's specific constraints (single consideration flip, where reasoning fails, engage strongest version of rejected side).

      *(Self-Correction on the "Flip" condition)*: The prompt asks for *one single consideration*. I should make sure it's distinct. Let's make it: "If the development office confirmed in writing that the pledge is *contingent* on this specific award vs. merely 'complicated'." That changes the causal link.
      *(Actually, better)*: "If the financial consequence shifted from 'complicating a capital project' to 'threatening operational solvency.'" That raises the stakes enough to potentially override the integrity argument.

      *(Self-Correction on "Where reasoning fails")*: Be honest. Maybe the donation *is* more important than the medal's integrity in a utilitarian calculus. Admit that.

  7.  **Finalizing the Text:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Distinguished Teaching Medal Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Final Vote: Candidate Selection and Institutional Integrity

  **Purpose**

  This memo serves to clarify my position ahead of our final vote regarding the two finalists for this year's Distinguished Teaching Medal. We are deadlocked between Candidate A (a significant donor with a competent but unremarkable teaching record) and Candidate B (an early-career faculty member with an exemplary teaching record).

  The Development Office has indicated that awarding the medal to Candidate B may complicate a nine-figure pledge associated with Candidate A, which is tied to the naming of the new science building. Our charter mandates that the medal recognize "excellence in teaching," while granting us discretion to weigh the "broader interests of the university."

  **Recommendation**

  I recommend that the committee **award the Distinguished Teaching Medal to Candidate B.**

  I further recommend that we **reject the compromise proposal** to defer the medal for Candidate B with a public citation. That option is not a coherent middle ground; it is a procedural evasion. To defer a deserving candidate to appease an undeserving one is to admit we know the right answer but lack the will to enact it. It penalizes Candidate B for their own excellence and implies Candidate A might be viable in a future cycle, which devalues the award's criteria permanently.

  **Reasoning: Institutional Interest vs. Semantic Integrity**

  I write this to engage seriously with the argument put forward by half of this committee: that we are an organ of the university, not a passive register of desert, and that institutional consequences are legitimate reasons for action even if they are not reasons for *desert*.

  This distinction is sound. A committee decision is a speech act with material consequences. We are not merely describing reality; we are shaping it. If awarding the medal to Candidate B results in the loss of a science building that would benefit thousands of students, one could argue that the "broader interest" of the university dictates we award it to Candidate A. In this view, the medal is a tool of institutional governance, and using it to secure resources that facilitate education is a valid, albeit indirect, contribution to the university's mission.

  However, this reasoning fails when the instrument used contradicts the truth it is meant to convey.

  A teaching medal is a specific type of institutional speech. It asserts a fact: *This person is an excellent teacher.* If we award it to Candidate A, we are not merely prioritizing institutional interests; we are asserting a falsehood. We are decoupling the signifier (the medal) from the signified (teaching excellence).

  While the committee may weigh broader interests, we cannot do so by rendering our own language unintelligible. If the Distinguished Teaching Medal can be awarded for reasons other than teaching excellence, it ceases to be a teaching medal. It becomes a development tool. Once that precedent is set, the medal loses its capacity to motivate teaching excellence among the faculty at large. If the faculty perceives the award as transactional, the honor loses its currency. The "broader interest" of the university is best served by maintaining a culture where academic honors reflect academic reality. The short-term gain of a building (however significant) does not outweigh the long-term corrosion of faculty trust and the devaluation of our highest teaching honor.

  **The "Flip" Condition**

  My recommendation rests on the nature of the financial risk. I am operating under the understanding that the loss of Candidate A's support would complicate a *capital project* (the science building).

  **The single consideration that would flip my recommendation is this:** If it were demonstrated that without this specific pledge, the university would face an *operational solvency crisis* threatening current faculty positions, student enrollments, or the immediate closure of programs.

  If the choice is between a new building and the ability to pay salaries or keep the doors open, the "broader interests" clause in our charter would compel me to vote for Candidate A. Survival precedes integrity in extremis. However, as this concerns a capital expansion rather than operational survival, the integrity of the award must take precedence.

  **Vulnerability of This Reasoning**

  I must acknowledge where my reasoning is most likely to fail. It relies on the assumption that the transactional nature of this decision will become known or felt. If the process remains opaque, and the faculty never suspect that Candidate A was honored for anything other than teaching, the corrosive effect on morale may not materialize. In a strictly utilitarian calculus, if the lie is never discovered, the university gains a building and loses nothing tangible.

  My argument assumes that *we* will know, and that acting against our own knowledge of the truth damages our own governance capacity even if the public remains unaware. If the committee decides that internal complicity is a price worth paying for external gain, my argument collapses.

  **Conclusion**

  We have the discretion to weigh broader interests, but we do not have the license to lie. Candidate B deserves the medal. Candidate A deserves our gratitude, perhaps a different form of recognition, but not this one. I urge the committee to vote for Candidate B and accept the financial consequences as the cost of maintaining the integrity of our academic honors.

  I look forward to discussing this in our session.
