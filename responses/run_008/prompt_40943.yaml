answer: |-
  ### The Cartesian Theater Decision Tree

  **Start:** Assume the brain processes perceptual content in parallel, distributed pathways with no known single convergence point.

  **Node 1:** To have a unified experience, must all its contents exist simultaneously at a single location (in the mind or brain)?
  *   **YES** → Go to Node 2.
  *   **NO** → Go to Node 3.

  **Node 2:** Is this location of simultaneity constituted by physical neural tissue?
  *   **YES** → **Leaf A: The Neural Convergence View**
  *   **NO** → **Leaf B: The Dualist's Theater**

  **Node 3:** In perceptual illusions (e.g., color phi), is there a truth about the experience that exceeds what the subject can sincerely report?
  *   **YES** → **Leaf C: Distributed Phenomenal Realism**
  *   **NO** → **Leaf D: The Multiple Drafts View**

  ***

  #### The Leaves

  **Leaf A: The Neural Convergence View**
  *   **Description:** Consciousness occurs at a specific brain locus where all processing streams finally synchronize to become simultaneously available.
  *   **Awkward Commitment:** It posits a neuroanatomical convergence point that current neuroscience fails to find.

  **Leaf B: The Dualist's Theater**
  *   **Description:** Consciousness occurs in a non-physical substance where perceptions converge for a central observer.
  *   **Awkward Commitment:** It cannot explain how the non-physical interacts with the distributed physical brain.

  **Leaf C: Distributed Phenomenal Realism**
  *   **Description:** Processing is fully distributed, yet there is a determinate fact about what was experienced independent of later reports.
  *   **Awkward Commitment:** It commits to unknowable facts that make no empirical difference to observation.

  **Leaf D: The Multiple Drafts View**
  *   **Description:** Content becomes conscious by winning influence in the cortex rather than by arriving at a destination.
  *   **Awkward Commitment:** It denies there is any fact of the matter about what you experienced independent of your later reports.

  ***

  #### Logical Gaps (Unoccupied Space)
  One combination is notably absent: answering **YES** to Node 1 (Unity requires a place) and **YES** to Node 2 (It is physical), but **NO** to Node 3 (No fact beyond report). This view is **incoherent**; if a physical event occurs at a specific place and time, there is objectively a fact about what occurred there, regardless of whether the subject reports it.

  #### The Indistinguishable Pair
  This tree cannot separate the **Stalinesque** view (experience was edited before consciousness) from the **Orwellian** view (memory was edited after consciousness). Both positions reside in **Leaf C**, as both insist there is a "fact of the matter" despite distributed processing. No question based on observation can separate them, because both sides agree on every possible report the subject would give. To split them would require a question about metaphysical truth rather than empirical evidence, which would pretend to solve a dispute that is, by definition, observationally undecidable.
