  **The Scenario**

  Arthur signed a strict advance directive refusing long-term ventilation after watching his brother's illness bankrupt his own children, making Arthur's kids promise to hold him to it so their college funds remained secure for a disabled sibling's lifelong care. Years later, Arthur suffers a lung collapse, is placed on a vent, and surprisingly adapts well, reporting high life satisfaction and lucidly demanding to stay on the machine indefinitely. However, maintaining this care will drain the exact college funds his children relied on being preserved, funds they've already planned around, and Arthur knows this financial reality hasn't changed even if his fear of death has.

  ***

  **The Walk-Through**

  **(a) Why the directive should still win**
  In this specific setup, the advance directive wins not because the past Arthur is the "real" Arthur, and not because the current Arthur is confused, but because the directive functioned as a **binding promise to third parties** who relied on it to make their own life plans. Autonomy isn't just about doing what you want in the moment; it's also about the integrity of your commitments. If Arthur revokes the directive, he isn't just changing his mind about his own body; he is unilaterally breaking a contract that his children relied upon to secure care for their disabled sibling. The moral weight here shifts from "precedent autonomy vs. current well-being" to "promise-keeping vs. self-preservation." The directive wins because honoring it prevents tangible harm to others who acted in good faith based on Arthur's prior commitment.

  **(b) The single feature doing the real work**
  The feature doing all the heavy lifting is **reliance harm to others**.
  *   **The Test:** If you remove the disabled sibling and the specific financial reliance—so that Arthur's choice only affects his own money and no one else's future care—the case collapses. Without the third-party harm, there is no moral justification for overriding a lucid, happy person's wish to live, regardless of what their past self wrote. The moment the stakes become purely self-regarding, the "Past Self" loses its authority over the "Current Self" unless you reintroduce one of the crutches (e.g., claiming the current self is wrong about what makes them happy).

  **(c) How both sides would attack this case**
  *   **Your Cousin (The Nurse/AD Supporter):** She might actually dislike this argument. Her position is usually based on *precedent autonomy* (the past self's right to decide their own fate). This scenario forces her to argue based on *financial obligation to children*. She might worry this sets a precedent where poor people are pressured to die to save money, which undermines the dignity-focused argument she prefers. She'd attack it by saying, "Medical directives should be about dignity and bodily integrity, not balancing the family checkbook."
  *   **The Current Self Advocate (You):** You would attack this by arguing that **life trumps contracts**. You'd say that while breaking a promise is bad, being forced to die (or be removed from life support) is a disproportionately high price to pay for a financial promise. You'd argue that consent to medical treatment is ongoing and revocable, and no past promise should compel a competent person to accept death, especially when they are currently happy to be alive.

  **(d) Honesty Check: Is this airtight?**
  No, it is not airtight, and I need to be blunt: **It secretly sneaks in a version of Crutch #2.**
  By emphasizing that the children *relied* on the funds for a disabled sibling, the scenario implies the current self's choice is *selfish* or *irresponsible*. It subtly frames the current Arthur as morally compromised because he's prioritizing his life over his grandchild's care. A hardline Current Self Advocate would say, "A parent's duty to survive outweighs a financial promise." Furthermore, legally, in almost every jurisdiction, a competent patient can verbally revoke an advance directive instantly. If Arthur says "I want to live," the doctors must listen, regardless of the money. So, while this works as a *moral* puzzle, it fails as a *legal* or *clinical* rule.

  **(e) What would flip the verdict to the Current Self?**
  To flip this so that honoring Arthur's current wish is clearly the right call, you need to **remove the third-party reliance**.
  If Arthur's children say, "Dad, we don't care about the money, we want you alive," and the only reason to follow the AD is Arthur's own past preference, the AD should lose. Without the harm to others, there is no justification for overriding a happy, lucid person's will. If you present this modified version to your cousin (where the family *wants* him to live), and she still insists the AD must win, then she is forced to admit she relies on the "Past Self is the Real Self" crutch, because there's no other reason to ignore the living, breathing human in front of her.
