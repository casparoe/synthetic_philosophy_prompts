prompt: |-
  I run public programming at a mid-sized regional history museum, and each season we receive proposals for events — lectures, traveling exhibits, panel evenings, private collections on loan — a growing fraction of which involve contested history. In the past year these have included a docent-led "mysteries of the ancients" evening that treats Atlantis as an open archaeological question, a local enthusiast of Fomenko's New Chronology who wants to argue that our conventional dating of medieval documents is a scholarly construct, a collector asserting that artifacts in his possession prove extensive pre-Columbian transoceanic contact, and — harder — a proposal on the peopling of the Americas, where the scholarly consensus has itself shifted within living memory. Our refusals have been ad hoc and inconsistent enough that the board has asked for a written procedure. The committee that would apply it consists of volunteers with roughly a semester of college history each, and they can spend perhaps an hour per proposal. Where a proposal is refused, the refusal may be appealed to the board, so the procedure needs to leave a record showing its reasoning.

  Please write that decision procedure. Ground it in whatever the philosophy of pseudoscience and the study of pseudohistory actually offer on demarcation — the difference between an unorthodox hypothesis and a pseudo-inquiry, what it takes for a claim to answer to evidence rather than merely coexist with it, the role of consilience across independent lines of evidence, the standard warning signs such as claims that explain everything, hostility to falsification, and appeals to suppression by the academy — but operationalize all of this so a lay committee can run it. The procedure should specify: the questions to ask about a proposal, in order; what counts as a sufficient answer to each; the points where the procedure terminates in a "no"; the points where it hands the decision to a human because the remaining question is one of values rather than facts (for instance, whether to host a talk the committee judges false because it draws a crowd and is honestly labeled as entertainment); and, crucially, how to distinguish a fringe-but-live scholarly question from a closed one. Because the committee cannot itself evaluate radiocarbon dating or statistical arguments about manuscript chronologies, the procedure must say which proxy indicators — how a claimant treats counter-evidence, whether the claim connects to anything outside itself, who is engaging with it — can stand in for the expertise the committee lacks.

  Then run the procedure on three proposals. First, the Atlantis evening, which is popular with donors. Second, a talk presenting Norse presence in North America as established fact — include this case because it is the procedure's hardest test: that claim was itself considered fringe until excavation vindicated it, so the procedure must say what would have allowed a committee in the skeptical era to host such a talk without opening the door to every claim of the same shape, and it must not achieve this by knowing the answer in advance. Third, a talk arguing that a local carved stone is evidence of pre-Columbian contact, promoted by its supporters as a persecuted minority view. Finally, be honest about what the procedure cannot do: whether it can really distinguish a claim that is wrong from a claim that is not even being investigated, and how the committee should handle proposals that are wrong in ways the committee considers harmless but that bring in visitors who then trust our other labels a little less.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Context:** Mid-sized regional history museum, public programming.
      *   **Problem:** Growing number of proposals involving contested history/pseudohistory (Atlantis, New Chronology, Pre-Columbian contact, Peopling of Americas). Current refusal process is ad hoc/inconsistent. Board wants a written procedure.
      *   **Constraints:**
          *   Committee: Volunteers with ~1 semester of college history.
          *   Time: ~1 hour per proposal.
          *   Appeal Process: Refusals can be appealed to the Board (needs a record of reasoning).
          *   Content: Must ground in philosophy of pseudoscience/pseudohistory (demarcation problem, consilience, falsifiability, etc.) but *operationalize* it for laypeople.
          *   Specific Requirements: Ordered questions, sufficient answers, termination points ("no"), hand-off points (values vs. facts), distinguishing fringe-live vs. closed questions, proxy indicators for expertise (since they can't evaluate technical data).
      *   **Task:** Write the procedure, then run it on three specific cases (Atlantis, Norse/Vinland, Local Carved Stone), and finally discuss limitations (wrong vs. not investigated, harm vs. engagement).

  2.  **Deconstruct the Philosophy of Pseudoscience/History:**
      *   *Demarcation:* Popper (falsifiability), Kuhn (puzzles vs. crises), Lakatos (research programmes), Pigliucci/Boudry (cluster concepts).
      *   *Key Markers of Pseudohistory:*
          *   Immunity to counter-evidence (ad hoc hypothesizing).
          *   Lack of consilience (doesn't connect to geology, linguistics, genetics, etc.).
          *   Appeal to conspiracy/suppression ("Academia is hiding the truth").
          *   Selective skepticism (demanding impossible standards for consensus, accepting weak evidence for own claim).
          *   Stagnation (no new predictions, just reinterpreting old data).
      *   *Key Markers of Fringe/Live Science:*
          *   Engages with peer review.
          *   Acknowledges anomalies but seeks resolution within method.
          *   Connected to broader disciplinary networks.

  3.  **Drafting the Procedure (The "Museum Programming Demarcation Protocol" - MPDP):**
      *   *Goal:* Make it a flowchart/checklist style that fits the 1-hour limit.
      *   *Section 1: Initial Triage (Fact/Value Split).* Is this presented as history or entertainment?
      *   *Section 2: The Evidence Check (Proxy Indicators).* Since they can't read radiocarbon reports, they need to look at *behavior* of the claimant and the *structure* of the argument.
      *   *Section 3: Consilience & Connection.* Does this fit with other things we know?
      *   *Section 4: The "Suppression" Test.* How do they handle rejection?
      *   *Section 5: The "Live Question" Determination.* Is this actually debated in journals?
      *   *Termination Points:* Clear "Stop/Reject" signals.
      *   *Hand-off Points:* Where the Board decides on risk/reward.

      *Refining the "Live vs. Closed" distinction:* This is the hardest part for laypeople. They can't judge the science. They must judge the *ecosystem* of the science. Is it published in *Antiquity* or *Ancient American*? Is it cited by professors or YouTubers?

  4.  **Developing the Three Case Studies:**

      *   *Case 1: Atlantis (Mysteries of the Ancients).*
          *   *Status:* Pseudohistory.
          *   *Application:* Fails consilience (geology, timeline). Fails falsifiability (moves location/depth when disproven). Likely appeals to "hidden knowledge."
          *   *Outcome:* Reject as history. Potentially accept as "Myth & Imagination" if labeled clearly (Value Hand-off).
          *   *Donor Pressure:* This triggers the "Value" hand-off.

      *   *Case 2: Norse Presence (Vinland).*
          *   *Status:* Now consensus, was fringe.
          *   *Challenge:* How would the procedure work *before* L'Anse aux Meadows was confirmed?
          *   *Application:* In the 1950s, sagas were texts, not archaeology. A proposal then would need to show *testable* predictions (e.g., "We will dig here and find turf walls"). It distinguishes itself from Atlantis because it engages with textual criticism and specific geography, not "lost continents."
          *   *Key Differentiator:* Willingness to be proven wrong by a shovel.
          *   *Outcome:* In the past, it might have been "Fringe/Live." Today, it's "Consensus." The procedure must allow for "Emerging Consensus."

      *   *Case 3: Local Carved Stone (Pre-Columbian Contact).*
          *   *Status:* Likely Pseudohistory (New England "mystery stones" are usually 19th-century fakes or misinterpretations).
          *   *Markers:* "Persecuted minority view." "Mainstream archaeology ignores this." Single artifact without context.
          *   *Outcome:* Reject. Fails consilience (no genetic/linguistic support). Fails suppression test (accusations of conspiracy).

  5.  **Addressing the Limitations (The "Honesty" Section):**
      *   Can it distinguish Wrong vs. Not Investigated? No, it distinguishes *Investigated via Standard Methods* vs. *Investigated via Idiosyncratic Methods*.
      *   Harm vs. Engagement: The "Trust Tax." If visitors see us hosting pseudohistory, do they trust the real history less? This is a Board-level risk assessment, not a committee fact-check.

  6.  **Refining the Tone:**
      *   Needs to be administrative but intellectually rigorous.
      *   Respectful of volunteers (not asking them to be physicists).
      *   Clear on the "Why" (protecting institutional integrity).

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the procedure too complex for 1 hour?
      *   *Fix:* Simplify the questions. Use a "Traffic Light" system (Green, Yellow, Red).
      *   *Critique:* Did I address the Fomenko/New Chronology example in the prompt?
      *   *Fix:* Ensure the procedure catches "chronological revisionism" via the Consilience check (does this break physics/astronomy/other histories?).
      *   *Critique:* The Norse case is tricky. If the procedure is applied *today*, Norse presence is fact. If applied *then*, it was fringe. The prompt asks to run the procedure on the proposal "presenting Norse presence... as established fact." I need to clarify if I am evaluating it *now* or simulating the *past*. The prompt says "include this case because it is the procedure's hardest test: that claim was itself considered fringe until excavation vindicated it, so the procedure must say what would have allowed a committee in the skeptical era to host such a talk." Okay, I need to evaluate it as if the committee *doesn't know the outcome yet*, or explain how the procedure handles *settled* vs. *emerging* consensus. I will treat it as a "Settled Consensus" case to show how it passes, but add a note on how it would have looked in the "Fringe" phase (the "Testability" criterion). *Correction:* The prompt asks to run the procedure on the proposal. I should treat it as a current proposal (which passes easily) but explicitly analyze the "Counterfactual" (how would it have passed in 1950?) to demonstrate the procedure's robustness regarding the demarcation line. Actually, reading closely: "the procedure must say what would have allowed a committee in the skeptical era to host such a talk." I need to make sure the *Procedure Text* allows for this, and the *Case Study* demonstrates it. I will frame the Case Study as "The Vinland Test" analyzing the *criteria* that distinguish it from Atlantis, regardless of era.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Termination points? Yes.
      *   Hand-off points? Yes.
      *   Fringe-live vs. Closed? Yes.
      *   Proxy indicators? Yes.
      *   Three cases run? Yes.
      *   Limitations discussed? Yes.

  9.  **Writing the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  # Museum Programming Demarcation Protocol (MPDP)
  **Version 1.0 | Approved by Board of Directors**
  **Applicability:** All public programming proposals involving historical claims, archaeological findings, or chronological frameworks.
  **Review Body:** Programming Committee (Volunteers).
  **Time Allocation:** Maximum 60 minutes per proposal.

  ## I. Purpose and Scope
  This procedure exists to protect the Museum's integrity as an educational institution while allowing for robust public engagement. It distinguishes between **Historical Inquiry** (claims answerable by evidence and subject to revision), **Fringe Scholarship** (unorthodox claims engaging with standard methods), and **Pseudohistory** (claims insulated from evidence).

  The Committee does not evaluate the *truth* of technical claims (e.g., radiocarbon dates). The Committee evaluates the *structure* of the argument and the *behavior* of the claimant.

  ## II. The Decision Flowchart

  ### Phase 1: Classification (5 Minutes)
  **Question 1.1:** How is the event labeled in marketing materials?
  *   **A:** "Lecture," "Symposium," "Historical Analysis," "New Evidence." -> *Proceed to Phase 2.*
  *   **B:** "Myth & Imagination," "Folklore Evening," "Entertainment," "Alternative Theory (Speculative)." -> *Hand-off to Board.* (See Section IV).
  *   **C:** Ambiguous. -> *Require proposer to select A or B in writing before proceeding.*

  **Question 1.2:** Is the core claim currently taught as consensus in accredited undergraduate history/archaeology programs?
  *   **Yes:** -> *Approve (Expedited).*
  *   **No:** -> *Proceed to Phase 2.*

  ### Phase 2: The Consilience Check (15 Minutes)
  *Philosophy Grounding:* Real history relies on **consilience** (independent lines of evidence jumping together). Pseudohistory often isolates one anomaly while ignoring the web of connected facts (geology, linguistics, genetics, astronomy).

  **Question 2.1:** If this claim were true, what *else* would have to be true? (e.g., If Egyptians came to America, where is the DNA? The pollen? The linguistic drift?)
  *   **Sufficient Answer:** The proposer identifies at least two other fields (e.g., genetics, linguistics) and explains why evidence is absent *or* presents evidence from those fields.
  *   **Insufficient Answer:** "Those fields are irrelevant," "The evidence was destroyed," or "Mainstream science ignores those fields."
  *   **Termination (No):** If the claim requires dismissing entire unrelated disciplines (e.g., "Geology is wrong about ice sheets") to sustain the historical claim.

  **Question 2.2:** Does the proposal rely on a single artifact or text interpreted in isolation?
  *   **Sufficient Answer:** No, it relies on a pattern of data, or acknowledges the single artifact is inconclusive without context.
  *   **Insufficient Answer:** Yes, this one stone/map/text proves the whole theory.
  *   **Termination (No):** If the claim rests entirely on an object with no provenance (unknown origin) or context.

  ### Phase 3: The Falsifiability & Method Check (20 Minutes)
  *Philosophy Grounding:* A historical claim must be capable of being proven wrong (Popper). Pseudohistory often moves the goalposts or creates *ad hoc* hypotheses to explain away counter-evidence.

  **Question 3.1:** What evidence would convince the proposer they are *wrong*?
  *   **Sufficient Answer:** Specific, tangible data (e.g., "If radiocarbon dating shows the object is from 1850," or "If no settlement remains are found in this grid").
  *   **Insufficient Answer:** "Nothing would change my mind," "The evidence is suppressed," or "That evidence would just be planted by the establishment."
  *   **Termination (No):** If the claim is unfalsifiable.

  **Question 3.2:** How does the proposer handle existing counter-evidence?
  *   **Sufficient Answer:** Acknowledges the counter-evidence and offers a competing interpretation that can be tested.
  *   **Insufficient Answer:** Dismisses counter-evidence as a "conspiracy," "hoax by academics," or "misinterpretation by closed minds" without specific proof of malice.
  *   **Termination (No):** If the primary explanation for rejection by experts is a conspiracy against the proposer.

  ### Phase 4: The "Live Question" Determination (15 Minutes)
  *Philosophy Grounding:* Distinguishing a **Closed Question** (settled consensus) from a **Fringe-Live Question** (active debate in journals) from a **Dead/Pseudo Question** (rejected due to method, not just data).

  **Question 4.1:** Where has this research been published?
  *   **Green Light:** Peer-reviewed journals in history, archaeology, or related sciences (e.g., *American Antiquity*, *Journal of Archaeological Science*).
  *   **Yellow Light:** University press books, reputable popular history magazines (e.g., *Archaeology*, *BBC History*).
  *   **Red Light:** Self-published books, vanity presses, YouTube channels, blogs, or journals with names mimicking legitimate ones but no indexing.
  *   **Termination (No):** If *all* output is Red Light.

  **Question 4.2:** Who is engaging with this claim?
  *   **Green Light:** Critics engage with the *data* (e.g., "Your dating method is flawed").
  *   **Red Light:** Critics engage with the *person* (e.g., "He is a fraud") or ignore it entirely because it lacks methodological rigor.
  *   **Hand-off to Board:** If the claim is Yellow Light but controversial (e.g., shifting consensus on Peopling of the Americas).

  ### Phase 5: Final Disposition
  *   **APPROVE:** Passes all phases.
  *   **REJECT:** Triggers any Termination (No) in Phases 2, 3, or 4. *Reasoning must be recorded using the specific Question ID.*
  *   **BOARD REVIEW:** Triggers Hand-off points. This indicates the issue is one of **Risk/Value**, not Fact. (e.g., "This is pseudohistory, but labeled as entertainment, and brings donors.")

  ---

  ## III. Case Study Applications

  ### Case 1: The "Mysteries of the Ancients" Evening (Atlantis)
  **Proposal:** Docent-led evening treating Atlantis as an open archaeological question. Popular with donors.
  **Classification:** Phase 1.1 (Labeled "Mysteries," implies fact). Phase 1.2 (Not consensus).

  *   **Phase 2 (Consilience):**
      *   *Q 2.1:* If Atlantis existed (Plato's timeline/size), what else is true?
      *   *Result:* Requires ignoring geology (no continental shelf evidence), genetics, and Bronze Age records of major civilizations.
      *   *Verifier:* Proposer claims "Cataclysms erased the evidence."
      *   *Status:* **Termination (No)** on Q 2.1. The claim requires dismissing geology and physics to sustain history.
  *   **Phase 3 (Falsifiability):**
      *   *Q 3.1:* What proves Atlantis didn't exist?
      *   *Result:* "We haven't found it yet." (Moving the goalposts).
      *   *Status:* **Termination (No)** on Q 3.1.
  *   **Disposition:** **REJECT** as historical programming.
  *   **Board Hand-off:** The Committee notes this fails the fact-check. However, if Marketing labels it "Myth & Imagination: The Atlantis Story" (Phase 1.1 Option B), it moves to the Board. The Board must decide if the donor revenue outweighs the "Trust Tax" of hosting pseudohistory, even as fiction.

  ### Case 2: Norse Presence in North America (The Vinland Test)
  **Proposal:** Talk presenting Norse presence as fact.
  **Context:** This is the "Hardest Test." In 1950, this was fringe. Today, it is consensus. The procedure must show why it *would have passed* in 1950 without approving Atlantis.

  *   **Phase 2 (Consilience):**
      *   *Q 2.1:* If Norse were here, what else is true?
      *   *Result:* Sagas describe specific geography. We should find turf-wall foundations, iron smelting slag, or Norse-style artifacts *in context*.
      *   *Verifier:* Unlike Atlantis, this does not require ignoring geology. It predicts specific, diggable archaeological layers.
  *   **Phase 3 (Falsifiability):**
      *   *Q 3.1:* What proves they weren't here?
      *   *Result:* "If excavation of the proposed site yields no artifacts from the correct period."
      *   *Status:* **Pass.** This is a testable claim. Atlantis moves; Vinland stays put.
  *   **Phase 4 (Live Question):**
      *   *Q 4.1 (1950 Context):* Where is it published?
      *   *Result:* In the 1950s, serious historians debated the *Sagas* as texts. The claim was "Fringe-Live." It was engaged with by philologists and archaeologists, not just hobbyists.
      *   *Status:* **Yellow Light.**
  *   **Disposition:** **BOARD REVIEW (Historical Context).**
      *   *Committee Note:* In 1950, this would have triggered a Board Review due to lack of archaeological proof, but *not* a Rejection. Why? Because it passed Q 3.1 (Falsifiability). It invited the shovel to test it. Atlantis refuses the shovel; Vinland welcomes it.
      *   *Current Status:* Today, Q 1.2 (Consensus) is "Yes." **APPROVE (Expedited).**
      *   *Lesson:* The procedure distinguishes **Speculative Science** (Vinland 1950: testable, engages with texts) from **Pseudoscience** (Atlantis: unfalsifiable, ignores geology).

  ### Case 3: The Local Carved Stone (Pre-Columbian Contact)
  **Proposal:** Local enthusiast claims a carved stone in his garden proves transoceanic contact. Promoted as a "persecuted minority view."

  *   **Phase 2 (Consilience):**
      *   *Q 2.1:* If this stone is pre-Columbian foreign contact, what else is true?
      *   *Result:* Requires migration paths, linguistic links, or genetic markers.
      *   *Verifier:* Proposer says "They came and left no other trace."
      *   *Status:* **Termination (No)** on Q 2.1. (Violates consilience; "Ghost Population" without genetic/archaeological footprint).
  *   **Phase 3 (Falsifiability):**
      *   *Q 3.2:* How does proposer handle counter-evidence (e.g., tool marks match 19th-century steel)?
      *   *Result:* "Archaeologists are protecting their tenure."
      *   *Status:* **Termination (No)** on Q 3.2. (Appeal to suppression/conspiracy).
  *   **Phase 4 (Live Question):**
      *   *Q 4.1:* Publication record?
      *   *Result:* Self-published booklet, local news interviews.
      *   *Status:* **Termination (No)** on Q 4.1.
  *   **Disposition:** **REJECT.**
      *   *Record for Appeal:* Rejected on MPDP Q 2.1 (Lack of Consilience), Q 3.2 (Hostility to Counter-Evidence), and Q 4.1 (No Peer Review).

  ---

  ## IV. Limitations and Institutional Honesty

  The Programming Committee must understand what this procedure *cannot* do, to accurately advise the Board during Hand-offs.

  **1. Wrong vs. Not Investigated**
  This procedure cannot distinguish a **False Claim** from a **Neglected Truth**. It distinguishes **Standard Inquiry** from **Idiosyncratic Inquiry**.
  *   *Risk:* A genuine breakthrough often looks like pseudohistory at first (see Vinland, 1950).
  *   *Mitigation:* The "Falsifiability Check" (Phase 3) is the safety valve. If a claimant says, "Dig here, and if I'm wrong, I admit it," they may pass even if the Committee doubts them. If they say, "You can't test me," they fail. We prioritize *method* over *outcome*.

  **2. The "Trust Tax" (Harmless Falsehoods)**
  The Committee may identify a proposal as Pseudohistory (e.g., Atlantis) but labeled as Entertainment (Phase 1.1 Option B). The Committee must advise the Board on the **Trust Tax**.
  *   *The Problem:* Visitors do not always distinguish between "Museum Hosts" and "Museum Endorses." A donor-friendly evening on Atlantis may bring revenue, but it subtly undermines the authority of the docents leading the *real* tours. It suggests history is a matter of "belief" rather than evidence.
  *   *Recommendation:* When handing off "Entertainment" proposals that fail the Fact Check, the Committee must explicitly state: *"This event is factually inconsistent with our exhibits. Hosting it requires a public disclaimer that this is fiction, or it risks confusing the public on our core mission."*

  **3. The Consensus Lag**
  Scholarly consensus shifts (e.g., Peopling of the Americas). The procedure relies on Phase 1.2 (Consensus Check).
  *   *Risk:* We may reject emerging science because it hasn't hit textbooks yet.
  *   *Mitigation:* Phase 4.1 (Publication). If a claim is appearing in *Nature* or *American Antiquity* but not yet in textbooks, it passes Phase 4 even if it fails Phase 1. The Committee must be trained to recognize legitimate journals vs. vanity presses.

  **4. Operational Burden**
  Volunteers have one hour. They cannot read the proposer's book.
  *   *Reliance on Proxies:* This procedure forces volunteers to judge the *container* (journals, willingness to be tested, connection to other fields) rather than the *content* (is the translation correct?). This is a proxy for expertise. It is not perfect, but it is the only scalable method for a volunteer board.

  **5. Final Note on Appeals**
  If a proposer appeals to the Board, the Board should not re-litigate the history. They should review the **MPDP Compliance**. Did the Committee correctly apply Q 3.1? If the Committee says "Unfalsifiable" and the Proposer says "Here is my falsification condition," the Board may overturn. If the Board overturns a Rejection based on "Donor Relations," that decision must be minuted as a **Value Override**, not a Fact Correction, to preserve the integrity of the historical record.
