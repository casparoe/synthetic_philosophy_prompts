answer: |-
  This is a remarkably sharp observation, and it cuts to the heart of a mismatch between our inherited juridical frameworks and our emerging digital social ontology. You are identifying a clash between a **juridical model of accountability** (deed-based, time-bound, procedural) and a **social-expressive model of accountability** (character-based, timeless, diffuse).

  Here is an attempt to articulate the theoretical presuppositions, the temporal metaphysics, and the conditions for reform.

  ### 1. The Theory of Punishment and Desert

  You ask what theory of punishment online sanctioning presupposes. The short answer is that it is theoretically underdetermined, but it leans heavily toward a hybrid of **Moral Character Retributivism** and **Radical Expressivism**, often masquerading as Consequentialism.

  **Is desert attached to persons rather than deeds?**
  In the legal model, we punish the *act* because we assume the *person* is a black box we cannot reliably judge (hence the exclusion of character evidence). Online sanctioning operates on the premise that the act is a **symptom of an underlying essence**. When defenders say the tweets "reveal who they are," they are making a metaphysical claim: the act was not an anomaly, but a disclosure of a stable moral identity. This presupposes a **Vice Ethics** framework rather than a Deontological one. In Vice Ethics, the object of evaluation is the character trait, not the isolated action. If the action reveals a vice (racism, sexism), the sanction targets the possession of that vice. Since vices are dispositions, they are presumed to persist until proven otherwise.

  **Is the "Prison vs. Online" stance a contradiction?**
  It *can* be held consistently, but it requires a specific political distinction: **The State vs. Civil Society.**
  *   **The State:** Has a monopoly on violence and coercion. Because it is coercive, it owes citizens due process, proportionality, and a pathway to reintegration (rehabilitation). To do otherwise is tyrannical.
  *   **Civil Society (Online):** Operates on freedom of association. I am not *coercing* you when I refuse to follow you or demand you be fired; I am exercising my associative rights.
  *   **The Consistent View:** One can argue the State *must* believe people can change (to justify releasing them), but private actors *need not* (because they bear no duty to rehabilitate).
  *   **The Contradiction:** The contradiction arises when online mobs demand *coercive* outcomes (firing, deplatforming) while rejecting *coercive* protections (proportionality, expiration). If you want the power of the state (ending someone's livelihood) without the constraints of the state (rehabilitation), you are positing a **permanent caste system** based on moral error.

  **Can it be purely Expressive?**
  Yes, and this is perhaps the most charitable reading. On a pure **Expressive Theory** (like Joel Feinberg's), the sanction is not primarily about the offender's future or even their desert, but about **vindication of the norm**.
  *   In this view, the "cancelled" person is a vessel for the community's reaffirmation of its values.
  *   The permanence of the sanction isn't about the person; it's about the **indelibility of the norm**. To say "it's okay now" might be seen as weakening the normative boundary.
  *   However, this smuggles in a character claim. If the sanction is purely about the norm, an apology should suffice (the norm is vindicated by the condemnation). The fact that apologies often *fail* suggests the practice is not just about the norm, but about the **purity of the community**. The offender is treated as a contaminant. This moves from Expressivism to **Ritual Purity**.

  **Underdetermination:**
  You are right that both Consequentialists and Retributivists can license this.
  *   **Consequentialist:** "They posted this in 2012, but algorithms amplify it today; the harm is ongoing, and the risk of recurrence is non-zero." (Focus on risk management).
  *   **Retributivist:** "A moral wrong creates a debt. If the character remains tainted, the debt remains unpaid." (Focus on moral balance).
  The practice is stable precisely because it doesn't need to commit to *why* it is punishing, only *that* it is.

  ### 2. The Temporal and Identity Question

  Do not wave off the temporal part. It is not merely a practical difference caused by archives; it is a **metaphysical disagreement about moral agency over time.**

  **Does Desert Decay?**
  The legal system presupposes that **desert is time-sensitive**. Statutes of limitations exist not just because evidence fades (epistemic), but because the *moral claim* weakens (normative). The "debt to society" model implies that suffering + time = extinguishment of guilt.
  Online culture presupposes that **moral facts are eternal**. A racist tweet from 2012 is treated as a racist tweet today. This ignores the **contextual nature of meaning**. But more deeply, it ignores the **decay of the moral subject**.

  **Personal Identity: Lawyer's Dodge or Real Philosophy?**
  It is real philosophy. If you hold a **Psychological Continuity Theory** of personal identity (Locke/Parfit), the 22-year-old and the 38-year-old are the same person only insofar as there are overlapping chains of memory, intention, and character.
  *   If the 38-year-old genuinely repudiates the values of the 22-year-old, the psychological connection is severed.
  *   To punish the 38-year-old for the 22-year-old's act is, metaphysically, to punish **Person B for Person A's crime**.
  *   The legal system acknowledges this via juvenile records sealing and the concept of "maturity." It treats the younger self as a different *moral category* of agent.
  *   Online culture assumes a **Narrative Identity** where the self is a cumulative sum. You *are* your history. To deny the past is "inauthentic."
  *   **Why it matters:** If the online model is correct (you are your history), then rehabilitation is impossible, because you cannot delete history. If the legal model is correct (you are your current agency), then online sanctioning is often unjust because it targets a ghost.

  **The "Never Forgetting" Tech:**
  Technology exacerbates this, but it doesn't cause it. We had gossip and reputations before the internet. The internet just removes the **fog of time** that allows moral decay to occur. In small villages, people moved away to restart. Online, there is no "away." The philosophical error is treating **archival permanence** as **moral relevance**. Just because a record exists doesn't mean it retains normative force.

  ### 3. Rebuilding Informal Sanction on the Legal Picture

  Suppose we want to import "statutes of limitation" and "discharge" into online life. What stands in the way?

  **1. The Theory of the Sanction (The Biggest Obstacle)**
  For expiration to work, we must change the theory of what the sanction is *for*.
  *   Currently, the theory is **Safety/Purity**: "We must keep this person out because they are dangerous/impure." If this is the goal, expiration is irrational.
  *   To match the legal model, the theory must become **Reintegrative Shaming** (Braithwaite). The goal of the sanction must be to bring the person back into the fold, not cast them out.
  *   **What must change:** We need a cultural script for **forgiveness**. Law has parole hearings, expungement, and "time served." Online culture has no ritual for "you have paid your debt." Without a ritual of reintegration, the sanction cannot end. An apology is often treated as a *new* performance to be critiqued, not a *key* to unlock the cage.

  **2. Incentives and Political Economy**
  *   **Moral Grandstanding:** There is social capital in being the one who *doesn't* forgive. Forgiveness is low-status; it looks like weakness or complicity. Condemnation is high-status; it signals virtue.
  *   **Attention Economy:** Outrage drives engagement. "They were cancelled in 2012 and now they are back" is a less compelling narrative than "They are still problematic."
  *   **What must change:** We would need to decouple moral signaling from social capital. This is unlikely without platform governance changes (e.g., algorithms that downrank "digging up the past" content).

  **3. Technology (The Least Important Obstacle)**
  *   People say "the internet never forgets," but we can choose to **normatively ignore** data. We have "Right to be Forgotten" laws in Europe.
  *   The obstacle isn't that the tweets exist; it's that we treat their existence as a **trump card**.
  *   **What must change:** We need a norm that **contextualizes** old data. "This is from 10 years ago; does it reflect current risk?" HR departments could lead this by adopting "lookback periods" for social media checks, similar to credit checks (which drop off after 7 years).

  **Conclusion for the Classroom**
  The tension you are bumping into is the collision between **Liberal Legalism** (which protects the individual from the collective via procedure and time limits) and **Digital Communitarianism** (which protects the collective norms from the individual via transparency and permanence).

  The online practice presupposes that **moral identity is fixed** and **community purity is paramount**. The legal practice presupposes that **moral agency is mutable** and **social peace is paramount**.

  If you want to challenge your students, ask them this: *If the 22-year-old self and the 38-year-old self are psychologically discontinuous, does the 38-year-old have a right to introduce evidence of their change, or does the community have a right to rely on the historical record?* That forces them to choose between a metaphysics of the self and a politics of safety.
