  This disagreement is fundamentally categorical, not empirical. You are correct that bedrock intuitions drive it, but your hypothesis misses the functional divergence. The two sides aren't answering the same question. Utilitarians ask, "How do we minimize badness in the universe?" Anti-aggregationists ask, "How do distinct agents coexist without violation?"

  The utilitarian "time-slice" argument fails because it conflates prudence with justice. Trading my Tuesday for my Thursday works because I possess psychological continuity and self-concern across time. I am the beneficiary and the victim. In interpersonal tradeoffs, the victim does not consent to the sacrifice for another's gain. The metaphysical blur Parfit identifies reduces the *weight* of separateness but doesn't erase the *moral* relevance of distinct perspectives. A boundary can be metaphysically fuzzy yet morally sharp.

  Your intuition hypothesis is right but too psychological. It's not just that people *feel* differently; it's that the concepts serve different social technologies. Aggregation works for policy planning where individuals are abstract units. Separateness works for rights enforcement where individuals are concrete holders. The conflict arises when we demand one framework govern all contexts. When you argue about dust specks versus torture, you are arguing about whether morality is calculus or contract.

  Furthermore, treating this as an empirical question about personal identity is a category error. Even if neuroscience proves we are merely bundles of perceptions, the *experience* of being a distinct subject remains the locus of rights. You cannot derive an "ought" from a metaphysical "is" here. The utilitarian aggregation theorem proves you must maximize *something*, but it doesn't prove that *something* must be welfare summed across persons rather than respect distributed among them.

  Can this end? No. Not through better cases or fission thought experiments. These tools presuppose the framework they try to prove. A utilitarian sees fission and sees one stream of consciousness splitting; a Rawlsian sees two distinct claims emerging. The stalemate is permanent because it rests on incompatible definitions of the moral domain. One views morality as impersonal optimization; the other as interpersonal regulation.

  To dissolve it, we must reject moral monism. Accept that "what to do" (policy) might require aggregation, while "what to feel bad about" (guilt/violation) requires separateness. But as long as philosophers demand a Single True Theory of Everything Moral, the dust specks vs. torture thread will recycle forever. The disagreement is a feature, not a bug, of trying to force distinct normative languages into one syntax. Stop looking for a knockout argument. Look for domain specificity.
