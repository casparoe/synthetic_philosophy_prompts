answer: |-
  ### Specification: Desiderata for a Theory of Luck and Justice

  To be considered adequate, a theory of distributive justice that accounts for luck must satisfy the following six requirements. These are not merely positions to be debated, but functional criteria the theory must resolve to offer a coherent political programme.

  **1. The Discriminability Requirement (Choice vs. Circumstance)**
  *The Case:* Two equally careless drivers drive home; one encounters a pedestrian, the other does not. One injures a person; the other arrives home safely.
  *The Requirement:* The theory must specify whether justice registers the difference in outcome. It must provide a principled basis for distinguishing between *option luck* (consequences of calculated risks taken) and *brute luck* (consequences of unchosen circumstances). If the theory holds individuals responsible for their choices, it must explain why identical choices yielding divergent outcomes do not violate fairness, or conversely, why they do. It cannot simply assert that outcomes matter; it must define the moral relevance of the causal chain between agency and result.

  **2. The Epistemic Condition (Informed Agency)**
  *The Case:* A patient declines a precaution after being properly informed of risks and falls ill; another is misled by authorities or never told of the risk and falls ill.
  *The Requirement:* The theory must establish the knowledge threshold required for responsibility. Holding an agent responsible for a risk is only coherent if the agent possessed accessible, truthful information regarding the probability and magnitude of that risk. A theory fails if it treats a misinformed choice as morally equivalent to an informed gamble. It must account for the state's duty to disclose risks as a prerequisite for holding citizens accountable for ignoring them.

  **3. The Option Constraint (Affordability and Access)**
  *The Case:* One person deliberately declines insurance they can afford; another wishes to insure but cannot afford the premium. Both end up uninsured and suffer a loss.
  *The Requirement:* The theory must distinguish between a refusal of an option and the absence of an option. A "choice" to remain unprotected is only a valid basis for differential treatment if the protection was genuinely accessible. The theory must explain how to treat identical states of vulnerability (being uninsured) when the etiology differs (preference vs. poverty). It cannot treat the *status* of being uninsured as the sole metric for justice without referencing the *history* of how that status was acquired.

  **4. The Valuation Requirement (Needs vs. Tastes)**
  *The Case:* A dialysis patient requires expensive treatment to survive; a gourmet requires expensive ingredients to achieve the same level of satisfaction as a person with modest tastes.
  *The Requirement:* The theory must provide a metric for distinguishing between expensive *needs* (which merit social compensation) and expensive *tastes* (which may not). If justice aims to equalise welfare, the gourmet has a claim; if it aims to equalise resources or opportunities, they may not. The theory must justify why biological necessity commands a claim on collective resources that cultivated preference does not, without relying on arbitrary biological fetishism. It must define the currency of egalitarianism.

  **5. The Endowment Ambiguity (Talent vs. Effort)**
  *The Case:* One person is born with a natural aptitude for a lucrative skill; another is born without it. Both work equally hard.
  *The Requirement:* The theory must determine the status of natural assets. Are talents collective assets to be taxed for the benefit of the untalented (as brute luck), or are they personal property whose fruits belong to the holder (as part of the self)? The theory cannot simply reward "skill" without unpacking whether that skill is a product of labour (for which one is responsible) or genetics (for which one is not). It must draw a line between the person and their circumstances, even when those circumstances are internal to the person.

  **6. The Humaneness Constraint (Responsibility without Abandonment)**
  *The Case:* An individual makes a reckless choice leading to ruin. The state holds them responsible but must decide whether to leave them destitute or express civic contempt.
  *The Requirement:* The theory must clarify the consequences of holding someone responsible. It must specify whether assigning responsibility for a bad outcome permits the state to withdraw the safety net or express social stigma. An adequate theory must either defend the right to let the responsible suffer destitution or explain how one can be held responsible for a cost while still being guaranteed a social minimum. It must address whether justice is compatible with solidarity towards those who have erred.

  ***

  ### Analysis of the Specification

  **1. Non-negotiable Features vs. Camp Preferences**
  There is a sharp division here between procedural necessities and substantive outcomes.
  *   **Non-negotiable:** The **Epistemic Condition** and the **Option Constraint** are foundational. Any theory that holds people responsible for outcomes they could not foresee (Epistemic) or options they could not access (Option) is logically incoherent, not merely politically contentious. Responsibility presupposes agency, and agency presupposes knowledge and availability. Similarly, the **Humaneness Constraint** is increasingly viewed as non-negotiable in liberal democracies; a theory that mandates destitution for the imprudent violates the basic liberal commitment to the inviolability of the person.
  *   **Camp Preferences:** The **Valuation Requirement** (Needs vs. Tastes) and the **Endowment Ambiguity** are where the ideological battle lines are drawn. Luck egalitarians tend to compensate for expensive needs but not tastes; welfarists may do the opposite. Similarly, Rawlsians treat talents as collective assets to be managed for the least advantaged, whereas libertarians treat them as self-ownership. These are not errors in reasoning but divergent axioms regarding the boundary of the self.

  **2. Joint Unsatisfiability (The Responsibility Trilemma)**
  A subset of these requirements is jointly unsatisfiable in practice, creating a trilemma between **Responsibility**, **Compensation**, and **Feasibility**.
  *   To fully compensate for bad brute luck (Requirement 1 & 5) while holding people responsible for option luck (Requirement 1 & 3), the state requires perfect information about the counterfactuals of every citizen's life (the Epistemic Condition).
  *   No institution can possess this information. We cannot know if a low earner is lazy (choice) or untalented (circumstance).
  *   Therefore, a theory that demands strict adherence to the Choice/Circumstance distinction *and* a robust safety net *and* administrative feasibility cannot be satisfied simultaneously.
  *   If you compensate all bad outcomes to ensure safety, you penalise the prudent (violating Responsibility). If you hold strictly to responsibility, you must abandon some victims (violating Humaneness) or build an intrusive surveillance state to verify choices (violating Liberty/Feasibility). The theory must explicitly acknowledge which horn of this trilemma it accepts.

  **3. The Exclusionary Requirement**
  The **Epistemic Condition** does the most work in excluding candidate theories, particularly strict Luck Egalitarianism.
  *   Many theories propose elegant philosophical distinctions between choice and circumstance. However, the Epistemic Condition demands that these distinctions be *actionable* by political institutions.
  *   A theory that requires the state to distinguish between "bad luck" and "bad choices" to allocate benefits is excluded if it cannot explain how the state can know the difference without violating privacy or incurring prohibitive costs.
  *   This requirement filters out high-theory accounts that work in a vacuum but fail in the tribunal of administration. It forces the theorist to move from metaphysics to institutional design. If a theory cannot survive the fact that human motivation is opaque, it is not a political theory; it is a moral fantasy.

  ***

  ### Conclusion: Luck vs. Relations

  Could the two leading families of views satisfy this list? Luck Egalitarianism, which seeks to neutralise the effects of luck, satisfies the Discriminability and Endowment requirements theoretically but notoriously fails the Humaneness Constraint, often implying that the imprudent may be left to perish (the "abandonment objection"). Relational Egalitarianism, which focuses on the quality of relations among citizens, easily satisfies the Humaneness and Option Constraints by guaranteeing a social minimum based on status rather than merit, but it struggles with the Discriminability Requirement, often lacking the resources to explain why we should compensate for bad luck at all if social relations are equal. Neither satisfies the full specification without significant modification; the former lacks a heart, the latter lacks a ledger.
