prompt: |-
  PhD student in political philosophy here, chapter on prioritarianism, and before I go hunting for what weighting functions people actually propose I want the spec first. Assume the leveling-down objection is fatal for telic egalitarianism, so we go the prioritarian route: a benefit matters more the worse off its recipient is. What would an adequate prioritarian weighting scheme have to deliver? I have candidate requirements of my own but I suspect half of them are just egalitarian intuitions I haven't let go of yet. Things like: moral value of a benefit must be concave in the recipient's absolute welfare level (and not just a function of their rank relative to others — that distinction needs to be made precise and defended, since only the absolute version lets you evaluate one person in isolation); the scheme should be seperable across persons so you can score subgroups, which is arguably what separates prioritarianism from egalitarianism in disguise; it should say a tiny gain to someone at level 2 beats a huge gain to someone at level 90, but also give an answer to the mirror case (a one-unit gain to the very worst off vs. a life-transforming gain just above them) that I won't immediately regret. Give me the list with the case or consideration behind each, flag which are non-negotiable and which are camp prejudices, and tell me where the list becomes jointly unsatisfiable if it does — I specifically want to know whether separability and any anti-tyranny-of-the-worst-off requirement can coexist, since that's exactly where my chapter is stuck.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in political philosophy.
      *   **Topic:** Prioritarianism (specifically, the specification of the weighting function).
      *   **Context:** Writing a chapter. Accepts the Leveling Down Objection (LDO) as fatal for telic egalitarianism. Wants to distinguish prioritarianism from "egalitarianism in disguise."
      *   **Goal:** A specification list of requirements for an adequate prioritarian weighting function.
      *   **Specific Concerns:**
          *   Distinguish absolute vs. relative weighting.
          *   Separability (Person-affecting vs. Relational).
          *   Trade-offs between the very worst-off and those slightly better off (avoiding "tyranny of the worst-off" while maintaining priority).
          *   Identify which requirements are non-negotiable (definitional) vs. camp prejudices (intuitions).
          *   Identify impossibility theorems or tensions (specifically Separability vs. Anti-Tyranny).

  2.  **Deconstruct Prioritarianism:**
      *   *Core Idea:* Benefits matter more the worse off the recipient is. (Parfit's formulation).
      *   *Mathematical Form:* Maximize $\sum w(w_i) \cdot u_i$ or Maximize $\sum f(u_i)$ where $f$ is concave. Usually the latter (transformative prioritarianism).
      *   *Key Distinction from Egalitarianism:* Egalitarianism cares about the *gap* between persons (non-separable). Prioritarianism cares about the *absolute level* of persons (separable).

  3.  **Drafting the Requirements (The "Spec"):**
      *   *Requirement 1: Priority to the Worse Off.* (Definitional). A benefit to $A$ at level $x$ is worth more than the same benefit to $B$ at level $y$ if $x < y$.
      *   *Requirement 2: Separability (Person-Affecting).* The value of a benefit to $A$ shouldn't depend on $B$'s welfare. This is the main shield against LDO.
      *   *Requirement 3: Concavity.* The moral value function must be strictly concave. Diminishing moral value of welfare.
      *   *Requirement 4: Continuity/Smoothness.* No lexical thresholds (usually).
      *   *Requirement 5: Avoiding the "Bottomless Pit" / Tyranny of the Worst-Off.* This is the user's specific sticking point. If the weight goes to infinity as welfare goes to negative infinity (or zero), you can't justify *any* sacrifice of the worst-off for the greater good.
      *   *Requirement 6: Non-Aggregation at the Extremes?* (This is where it gets tricky).

  4.  **Addressing the Specific Tensions (The "Impossibility" Check):**
      *   *Separability vs. Anti-Tyranny:*
          *   Standard Prioritarianism (e.g., $f(u) = \sqrt{u}$ or $\log(u)$) is separable.
          *   Does it lead to tyranny? If $f'(u)$ approaches $\infty$ as $u \to 0$ (like $\log$), then yes, a tiny gain to the worst-off outweighs massive gains to others.
          *   If $f'(u)$ is bounded (like $1 - e^{-u}$), then no tyranny, but does it satisfy "Priority"? Yes, but the priority diminishes.
          *   *The Tension:* Strong Priority (lexical or near-lexical) conflicts with Aggregation (utilitarian-style trade-offs).
          *   *Separability itself* doesn't cause the tyranny; the *shape* of the concave function does. However, Separability prevents us from using relational checks (like "is the gap too big?") to solve the tyranny. So, within a separable framework, you are stuck with the function shape.
      *   *The "Mirror Case":* Tiny gain to worst-off vs. Life-transforming gain to second worst-off.
          *   Prioritarianism says: Depends on the slope of the weighting function.
          *   If the slope is steep enough, Worst-Off wins.
          *   If the slope flattens, Second Worst-Off might win.
          *   *User's worry:* "Give an answer... that I won't immediately regret." This implies they want a function that doesn't feel counterintuitive in either direction. This is the "Goldilocks" problem.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the query. Validate the LDO premise.
      *   **The Core Specification (The "Must-Haves"):** Define the mathematical/philosophical baseline. (Concavity, Separability, Absolute Levels).
      *   **The "Camp Prejudices" (The "Nice-to-Haves"):** Intuitions that often sneak in (e.g., specific views on sufficiency, specific aversion to aggregation).
      *   **The Impossibility/Tension Analysis:** Focus heavily on Separability vs. Anti-Tyranny.
      *   **Proposed Solutions/Paths Forward:** Bounded prioritarianism, hybrid views, or biting the bullet.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between *weighted prioritarianism* (weighting the utility) and *transformative prioritarianism* (transforming the utility). Most contemporary lit (Parfit, Otsuka, Voorhoeve) treats them as extensionally equivalent, but the spec matters. Let's stick to the transformative model ($\sum f(u_i)$) as it's cleaner for separability.
      *   *Clarification on Separability:* Separability is the *definition* of prioritarianism vs. egalitarianism in this context. If you give it up, you're a relational egalitarian. So it's non-negotiable *for a prioritarian*.
      *   *The "Tyranny" Issue:* This is often called the "Priority View's Problem with Aggregation" or the "Bottomless Pit." If the moral value of welfare is unbounded below, you get tyranny. If it's bounded, you lose strong priority.
      *   *The "Mirror Case":* A gain of 1 to person at 0 vs gain of 100 to person at 1. Standard concave functions (log) say Person at 0 wins. Is that regrettable? Some say yes. This leads to *sufficientarian* intuitions sneaking in.
      *   *Key Reference:* Need to mention Parfit (1991), Otsuka & Voorhoeve (2009) on the distinction between egalitarianism and prioritarianism, and maybe Holtug or Adler on the weighting functions.

  7.  **Final Polish:**
      *   Tone: Academic, precise, peer-to-peer.
      *   Formatting: Clear lists, bold text for emphasis.
      *   Direct Answer: Explicitly answer the "Separability vs. Anti-Tyranny" question. (Answer: They *can* coexist, but only if you weaken the Priority requirement at the extremes, i.e., Bounded Prioritarianism).

  8.  **Drafting the Response (Mental Outline):**
      *   Intro: Good project. LDO is the right starting point.
      *   Section 1: The Non-Negotiables (The "Spec"). Concavity, Separability, Welfarism, Absolute Scale.
      *   Section 2: The Camp Prejudices (Where Egalitarianism haunts you). Discontinuity, Lexicality, Specific Trade-off ratios.
      *   Section 3: The Impossibility Result (The core of the chapter). Separability + Strong Priority + Aggregation = Inconsistent.
      *   Section 4: Resolving the Tension. Bounded Prioritarianism (the likely solution).
      *   Conclusion: Advice for the chapter.

  9.  *(Self-Correction on "Separability vs Anti-Tyranny")*: Wait, does Separability *cause* the tension? Not exactly. Relational views can also face tyranny (if they prioritize closing gaps lexically). But Separability *restricts the tools* you have to solve it. You can't say "the gap is small enough." You can only look at absolute levels. So the tension is really between *Concavity Shape* and *Aggregation*. But since Separability forces you to rely *only* on the Concavity Shape, it exacerbates the difficulty. I need to be precise here. The tension is between **Unbounded Concavity** (Strong Priority) and **Avoiding Tyranny**. Separability just means you can't use relational fixes.

  10. *Final check on the "Mirror Case":* User asks: "tiny gain to someone at level 2 beats a huge gain to someone at level 90" (Standard Priority) BUT "one-unit gain to very worst off vs life-transforming gain just above them" (The Tyranny Case).
      *   Case A (2 vs 90): Prioritarianism says 2 wins.
      *   Case B (0 vs 1): Prioritarianism *usually* says 0 wins (if unbounded). User fears regretting this.
      *   Solution: The weighting function must be concave but *bounded*. This allows A to hold (slope is steeper at 2 than 90) but allows B to flip (slope at 0 is not *infinitely* steeper than at 1).

