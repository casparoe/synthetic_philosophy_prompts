prompt: |-
  My roommate and I just burned an entire evening arguing about takeoff speeds and I want to salvage something from it. He thinks an intelligence explosion is basically overdetermined: once AI systems meaningfully contribute to AI research, progress compounds on itself, doubling times shrink, and you get a fast transition where the world is transformed before anyone can react. I keep pushing back that this ignores where the actual bottlenecks are — compute, fabs, energy, data, and all the slow physical-world stuff you can't just think your way past — so even a superhuman software engineer just spins its wheels and we get something much more continuous, more like an unusually steep economy-wide productivity boom. We ended up admitting we'd been talking past each other for hours and half-drunkely agreed the only fix is to write down an adversarial collaboration document like the ones they do in other fields. Draft it for us. I want the claims we could both actually put our names to (including boring stuff like: algorithmic progress exists and is real; scaling isn't the whole story; "takeoff speed" needs defining before arguing about it). Then the precise disagreements, worded so each of us would accept how our own view is stated — no strawmen. Then the cruxes: I suspect one is what fraction of AI progress is algorithmic vs compute-driven, another is whether the non-cognitive bottlenecks bind hard enough to stop recursive self-improvement, and maybe one about whether a lead can be translated into further leads. For each crux, give an argument, historical case, or measurable thing we'd both agree bears on it, with both of our predictions written down in advance so we can actually be wrong. Numbered list of agreed claims first, then a disagreements section. Also flag anywhere you think our fight was actually just verbal, e.g. about what counts as "fast."
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **Context:** Two roommates argued all evening about AI takeoff speeds (Fast/Discontinuous vs. Slow/Continuous).
      *   **Goal:** Salvage the argument by drafting an "adversarial collaboration document."
      *   **Requirements:**
          *   List of agreed claims (including boring/obvious ones).
          *   Precise disagreements (no strawmen, acceptable to both sides).
          *   Cruxes (key points of divergence) with arguments/evidence and *specific predictions* from both sides.
          *   Flag verbal disputes (definitions, etc.).
          *   Format: Numbered list of agreed claims first, then disagreements/cruxes.
      *   **Tone:** Rational, collaborative, precise, avoiding jargon where possible but acknowledging technical depth.

  2.  **Deconstruct the Positions:**
      *   **Roommate A (The "Fast Takeoff" / Hard FOOM proponent):** Believes in recursive self-improvement (RSI). Once AI helps make AI, feedback loops accelerate progress. Doubling times shrink rapidly. World transforms before reaction. Overdetermined outcome.
      *   **Roommate B (The "Slow Takeoff" / Bottleneck proponent):** Believes physical constraints (compute, fabs, energy, data) limit speed. Superhuman software can't bypass physics/logistics. Continuous growth, steep productivity boom, but not a sudden singularity.
      *   **Common Ground:** Algorithmic progress is real. Scaling isn't everything. Need to define terms.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but accessible. "Adversarial Collaboration on AI Takeoff Dynamics."
      *   **Introduction:** Briefly state the purpose (clarify disagreement, establish predictions).

      *   **Section 1: Agreed Claims (The Common Ground):**
          *   Need to capture the "boring stuff" requested.
          *   1. Algorithmic efficiency matters (not just scaling).
          *   2. Scaling laws hold but aren't infinite.
          *   3. Physical bottlenecks exist (chips, energy).
          *   4. "Takeoff speed" needs operational definition (GDP? Capability? R&D cycle time?).
          *   5. AI is already contributing to AI (coding assistants, etc.).
          *   6. Uncertainty is high.

      *   **Section 2: Precise Disagreements (The Core Conflict):**
          *   Need to phrase these neutrally.
          *   *Disagreement 1: The Binding Constraint.* Is it cognitive labor (A) or physical deployment (B)?
          *   *Disagreement 2: Feedback Loop Strength.* Does AI R&D help lead to *disproportionate* gains in AI capability?
          *   *Disagreement 3: Economic Absorption.* Can the economy integrate new capability fast enough to matter?

      *   **Section 3: Cruxes & Predictions (The Meat):**
          *   *Crux 1: Algorithmic vs. Compute Contribution.*
              *   Context: How much of past progress was algo vs. compute?
              *   Prediction: What % of future gains (next 5 years) come from algo improvements?
              *   A (Fast): High algo potential via AI help.
              *   B (Slow): Diminishing returns on algo, compute dominates.
          *   *Crux 2: The Hardness of Physical Bottlenecks.*
              *   Context: Can AI design better chips/fabs fast enough to outpace deployment?
              *   Prediction: Time to double global compute capacity once AI optimizes designs.
              *   A (Fast): < 2 years (AI solves engineering).
              *   B (Slow): > 5 years (permitting, construction, supply chains).
          *   *Crux 3: Recursive Self-Improvement (RSI) Lag.*
              *   Context: Time between "AI can do X% of AI R&D" and "AI does 100% of AI R&D."
              *   Prediction: Duration of the transition period.
              *   A (Fast): Months.
              *   B (Slow): Years/Decades.

      *   **Section 4: Verbal/Definitional Flags:**
          *   "Fast" vs. "Slow" (months vs. years?).
          *   "Intelligence Explosion" (qualitative shift vs. quantitative growth).
          *   "Reaction" (government regulation vs. market adaptation).

  4.  **Refining and Polishing:**
      *   *Check:* Did I include the specific requests? (Algorithmic progress exists, scaling isn't whole story, define takeoff). Yes.
      *   *Check:* Are the predictions measurable? Need to ensure they aren't vague. "Double compute capacity" is good. "% of R&D tasks" is good.
      *   *Check:* Is the tone right? It should sound like two rationalists trying to find truth, not win an argument.
      *   *Self-Correction on Predictions:* Make sure the predictions are falsifiable within a reasonable timeframe (e.g., 3-5 years), not "when AGI arrives" (which is undefined). Let's focus on *rates of change* in the near term as proxies for the long-term takeoff shape.
      *   *Refining the "Cruxes":* The prompt suggested specific cruxes (algo vs compute, non-cognitive bottlenecks, lead translation). I should align closely with those.

  5.  **Final Review against constraints:**
      *   Numbered list of agreed claims first? Yes.
      *   Disagreements section? Yes.
      *   Cruxes with arguments/evidence/predictions? Yes.
      *   Flag verbal disputes? Yes.
      *   No strawmen? Ensure Roommate B isn't described as "AI won't work" and Roommate A isn't described as "magic."

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   *Agreement:* AI coding tools exist. Chips take time to build.
      *   *Disagreement:* Does AI coding speed up chip design enough to matter *now*?
      *   *Crux 1 (Algo vs Compute):* Hernandez & Brown (2020) type analysis.
      *   *Crux 2 (Bottlenecks):* Semiconductor lead times.
      *   *Crux 3 (Lead Translation):* OpenAI vs. others lag time.

      *(Self-Correction during drafting)*: Make sure the predictions are distinct. If A says "2 years" and B says "3 years," that's not a real disagreement. A needs to say "months" and B needs to say "years."
