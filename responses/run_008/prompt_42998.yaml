      *Let's flesh those out.*
      1. *Algo vs Compute:* Prediction on contribution to FLOP-adjusted performance gain over next 5 years.
      2. *Bottlenecks:* Prediction on deployment lag (time from model ready to model widely deployed at scale).
      3. *Lead Translation:* Prediction on the "gap" between the top lab and the #5 lab over time.

      *Verbal Flags:* Define "Fast" (economic doubling time vs capability doubling time).

  7.  **Final Polish:** Check tone. Ensure it looks like a document they can actually sign. (Proceed to generate output).

      *(Final thought)*: Add a section on "Update Conditions" – what evidence would make us change our minds? This fits the adversarial collaboration spirit.

