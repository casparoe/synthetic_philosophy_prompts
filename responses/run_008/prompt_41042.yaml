prompt: |-
  So here's my situation: I'm a journalist who mostly covers science and ideas, and I've got a longish essay percolating about how historians handle blame — not blame for a murder or a tax fraud, but for enormous structural things like wars. The Cold War is my case study, and I've gotten stuck in the loop of reading the classic back-and-forth: the orthodox folks putting it on Stalin, the revisionists putting it on Truman and the atom bomb diplomacy, then the post-revisionists shrugging and saying it was mutual paranoia and systemic pressure and nobody's really "to blame."

  What I want to argue in my piece is a bit more radical than the post-revisionist shrug, and I'd like you to actually make this argument for me in full, since I want to see if it holds up before I commit to it:

  The claim is that "who started the Cold War?" isn't a question historians merely answered differently — it's closer to a pseudo-question, and the reason why is a specific disanalogy between blaming someone for a war and the everyday cases where blame clearly works. In everyday blame there's (a) a discrete act, (b) a clearly identifiable wronged party, and (c) the counterfactual baseline is roughly obvious — if the person hadn't done the thing, things would have gone fine. None of those three get fixed in the Cold War case: there's no single decision point, there's no victim-perpetrator structure (both sides genuinely feared the other), and the counterfactual — what would Stalin or Truman have had to do differently, and what would have happened then — is exactly the thing under dispute.

  The second part of the argument I want you to develop: I suspect the orthodox/revisionist fight is actually doing disguised explanatory or policy work. There's a distinction in tort law between but-for causation and proximate cause, and proximate cause is famously not a factual question but a judgment about where to cut off an infinite causal chain. My hunch is that when historians say "the USSR started it," they're not reporting a discovery about 1945-47, they're making a proximate-cause style judgment — choosing a stopping point in the causal story for reasons that are really about their present concerns (who should be trusted with power now, what lessons follow). So the debate looks like a factual dispute but functions like a values dispute.

  Please argue for both halves — the pseudo-question claim and the disguised-policy-work claim — and anticipate the strongest objection: that this move proves too much, since on this logic we could never blame anyone for anything large (a war launched deliberately, say). Explain why the Cold War case is supposed to differ from that one.

  A few hundred words of tight argument, please — I want to see the load-bearing steps, not a survey of the historiography. And no name-dropping reading lists, I can't fact-check quotes against my library from a deadline anyway. If it matters to the argument, lay out the reasoning yourself.
