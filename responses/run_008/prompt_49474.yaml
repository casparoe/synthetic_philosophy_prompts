answer: |-
  1. **Bottom line**
  My credence is 0.75 that outside-view-first yields more accurate credences. The discipline of anchoring prevents catastrophic overconfidence even when reference classes are imperfect. While your friend correctly identifies selection bias, the structural constraints of the outside view outweigh the noise introduced by class selection.

  2. **The terms**
  *   **Principled Individuation (0.6):** Reference classes are fuzzy but not random; objective features exist to constrain selection, limiting the "tax."
  *   **Expertise Screening (0.3):** Domain knowledge reduces variance but rarely eliminates systematic overconfidence; experts still fall for the planning fallacy.
  *   **Deference Echo (0.4):** Real in insular communities (EA/LW), less so in broad markets or diverse teams; independence is recoverable.
  *   **Adjustment Discipline (0.85):** The core value is forcing explicit justification for deviations; this reduces noise even if the anchor is imperfect.

  **Combination:** I weight Adjustment Discipline highest. Even if the anchor is slightly off (Individuation) or correlated (Echo), the constraint on wild inside-view swings dominates accuracy metrics. The low Expertise Screening score prevents the inside-view-first policy from competing effectively. Most errors come from unwarranted deviation, not imperfect anchoring. Therefore, the policy that restricts deviation wins, provided the anchor isn't totally broken (which Individuation suggests it isn't). The Echo problem is secondary to the primary failure mode of inside-view reasoning: narrative fallacy.

  3. **Sensitivity**
  "Expertise Screening" is the lever. If I update that experts successfully neutralize overconfidence (prob +0.1), my final number drops to 0.65. Inside-view viability hinges entirely on expertise actually fixing bias.

  4. **Where the disagreement lives**
  The gap between 0.7 and 0.3 is too large for mere noise; it reflects a fundamental disagreement on the power of expertise to overcome cognitive bias. Your friend's 0.3 implies he believes his specific causal model is reliably superior to statistical aggregates, likely because he views the "reference class" as containing too many irrelevant failures (the Reference Class Tax). He assumes his expertise allows him to safely ignore the base rate. The crux is whether "knowing the mechanics" translates to "knowing the distribution." You believe the planning fallacy is structural; he believes it's a novice error.

  To test this cheaply: Don't argue theory. Ask him to reconstruct the base rate for his last five successful projects *before* knowing the outcome. If he cannot reconstruct a stable base rate without peeking, his confidence in selecting classes is unfounded. Alternatively, ask: "When you were wrong, was it because the base rate was wrong, or because you thought you were special?" If he admits the latter often, his credence should update. The cheapest question is: "What specific feedback loop tells you your inside view is calibrated better than the aggregate?" If the answer is vague intuition rather than tracked Brier scores, the inside-view policy is unsupported. Most experts lack actual calibration data, relying on reputation instead.

  5. **What would change my mind**
  Tracked calibration data showing inside-view-first experts outperforming base-rate anchors in high-uncertainty domains. Realistically gettable? Only via a pre-registered prediction tournament, not chat.
