      *   *Video's Claim 2:* Probability is subjective/no objective fact. *Philosophical nuance:* This is a strong subjectivist/Bayesian take (de Finetti style). However, frequentists or propensity theorists would disagree. The paradox highlights the need for a *generative process*. It doesn't necessarily kill objectivism, just naive objectivism about "events" without "processes."
      *   *Video's Claim 3:* Symmetry/Invariance (Jaynes) smuggles in assumptions/doesn't work. *Philosophical nuance:* Edwin Jaynes proposed the Principle of Maximum Ignorance/Invariance. He argued that if the problem doesn't specify size/position, the solution shouldn't depend on them. This yields the $1/2$ solution. Is this a "fix"? It's a *selection criterion*. It's not universally accepted as *the* solution, but it's a rigorous way to pick a measure. It's not "smuggling," it's making implicit assumptions explicit.
      *   *Programmer's Context:* In code, "random" always implies a distribution. `random()` usually means Uniform(0,1). The paradox arises because "random chord" isn't a standard library function. The "right" default depends on the physical model being simulated.

