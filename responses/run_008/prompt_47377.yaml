answer: |-
  A specific child, Leo, is pinned under a 900-pound concrete beam in a warehouse; it is a known physical fact that ten able-bodied adults can lift this weight, but nine cannot. You arrive to find ten neighbors already gripping the beam and lifting it steadily; they are committed to the effort and their combined capacity exceeds the threshold required to hold the beam safely. You are the eleventh able-bodied adult present. If you place your hands on the beam and lift, your force is structurally absorbed by the redundancy; the beam rises at the exact same speed, and Leo is saved at the exact same moment, whether you lift or stand aside, because the ten are already sufficient. However, if you stand aside with your hands in your pockets while the ten strain, the social and moral pressure to justify your inaction remains vivid, despite your causal inefficacy being guaranteed by the physics of the threshold.

  (a) Singer's principle dictates that if we can prevent something bad (Leo's crushing) without sacrificing anything of comparable moral importance (the modest effort of lifting), we ought to do it. In this scenario, Singer implies you must lift, regardless of the redundancy, because the cost is low and the stakes are life-and-death. The inefficacy objection, conversely, argues that moral obligation is tethered to causal impact; since your lifting makes no difference to the outcome (Leo is saved either way), you have no duty to lift. The verdicts diverge sharply: Singer demands participation, while the inefficacy objection permits free-riding on the causal labor of the ten.

  (b) The structural feature preserving the intuition that you ought to contribute is **participation in a collective agency facing an identifiable victim**. The duty arises not from being the *cause* of the rescue, but from being a *member* of the rescue group when membership is available and costless. The mechanism creates a "team" dynamic where abstention is interpreted as a refusal to share the burden of solidarity, even if the burden is currently light enough to be carried without you. The intuition is driven by the visible strain of the ten and the immediacy of Leo's plight, which makes your idleness look like complicity in the risk, rather than a neutral omission.

  (c) As we remove this feature toward the drowning-child structure (you are the 10th lifter, making you pivotal), the intuition that you ought to act intensifies into an absolute requirement; the excuse for inaction vanishes completely because your absence guarantees harm. As we move toward the climate-change structure (the victim becomes statistical future generations, the harm is diffuse temperature rise, and the "team" is billions of emitters), the intuition weakens. It dies out when the victim is no longer identifiable and the link between the individual act and the harm is obscured by complexity and time; without a "Leo" to see and a "team" to join, the demand for an excuse dissipates into the background noise of daily life.

  (d) The strongest reply for a defender of the inefficacy objection is to target the premise that "moral obligation requires causal efficacy." They might patch this by arguing that obligation requires only *expected* efficacy or participation in a *type* of action that is generally efficacious. However, this patch guts the objection's force against Singer because it concedes that individual acts can be obligatory even when causally inert in the specific instance, provided they fall under a general rule of rescue. If the defender insists on strict causal efficacy for the specific act, they must accept the counter-intuitive verdict that you need no excuse for standing idle while Leo is saved by straining neighbors, which undermines the plausibility of the inefficacy objection itself.

  (e) This case generalizes partially to meat purchases and voting but fails to capture them fully. In meat purchases, structural thresholds exist (e.g., orders triggering a slaughter), but the victim is anonymous and the harm is temporally distant, lacking the "Leo" factor that generates the immediate pressure for an excuse. In voting, the inefficacy is often probabilistic rather than structurally guaranteed (though effectively zero in large elections), and the "victim" of a bad policy is diffuse. What distinguishes the beam scenario is the **proximity of the identifiable victim** combined with the **visibility of the collective effort**; meat and voting lack the visceral, face-to-face demand of a specific life hanging in the balance, which is why the intuition of duty feels weaker in those domains despite similar structural inefficacy.
