answer: |-
  "So, she pulled out," Mark said, stirring his coffee. "Priya. The audition."

  "Teaching studio," Elena corrected. "She wants to focus on her students."

  "Come on. That's the line. She's in bad faith."

  Elena sighed. "Here we go. Look, I get why it looks shady. But you're treating self-deception like it's a magic trick. Priya isn't splitting herself in two. She's just doing what everyone does: motivated reasoning. She weighs the evidence poorly because the alternative hurts."

  "But that's too thin," Mark said. "Bias explains why you might think you're better than you are. It doesn't explain the timing. She goes quiet when the competitor list drops. She practices less right after. And remember that night with the wine? She said, *'Maybe I just didn't want it that much,'* with this look... like she was testing a truth she wasn't allowed to hold."

  "So she was insecure. Inhibition lowered, honest thought slipped out. That's not a hidden knower lurking beneath; it's just noise in the system."

  "It's not noise, it's structure," Mark insisted. "You're treating this like a computational error. But Priya isn't mistakenly believing she prefers teaching. She's *arranging* her world so she doesn't have to face the audition. Sartre's point wasn't that she's lying to herself—that would require a liar and a liee. It's that she's actively looking away. She knows the threat, precisely enough to avoid it."

  "But what state is that?" Elena pressed. "If she knows the threat, she knows it. If she doesn't, she doesn't. You want to say she 'knows without knowing.' That's a contradiction. Cognitive science doesn't have a box for 'conscious but unacknowledged knowledge.' It has implicit biases, explicit beliefs, and competing drives. Calling it deception implies an agent doing the deceiving. Who's doing it?"

  "Not an agent, a project," Mark said. "Think about how you walk past a beggar when you don't want to give money. You don't say 'I am ignoring him.' You just suddenly find your phone very interesting. Priya isn't harboring a secret belief. She's cultivating a certain opacity. She's refusing to synthesize the evidence."

  "But that's just wishful thinking with extra steps," Elena said. "Why call it deception? If I buy a stock because I want it to go up, ignoring the red flags, am I deceiving myself? Or am I just biased? If you say 'deception,' you imply I can fix it by confronting the liar. But there's no liar. There's just a brain minimizing prediction error and emotional pain."

  "Because the tension shows," Mark said. "If it were just bias, she'd be comfortable. She wouldn't drink wine and slip up. The discomfort proves the knowledge is there, being held at arm's length. The deflationary view makes her too smooth. It misses the anxiety."

  "Or," Elena countered, "the anxiety is just the conflict between competing drives. Approach versus avoidance. You're reifying the conflict into a metaphysical structure. You want there to be a mystery there. I'm saying there's just mechanics."

  "And I'm saying the mechanics don't capture what it *feels* like to be Priya," Mark said. "To feel the pull of the audition and the terror of it, and to construct a narrative about teaching studios to bridge the gap. That's not a glitch. It's a skill. A terrible one."

  "Maybe," Elena said, watching the steam rise from her cup. "But if it's a skill, she can unlearn it. If it's a structure of consciousness, she's stuck in it. I'd rather believe she's just biased. It means she can change her mind when the evidence gets loud enough."

  "And I'm afraid," Mark said quietly, "that when the evidence gets loud enough, she'll just find a new place to look away."
