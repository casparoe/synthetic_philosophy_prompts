answer: |-
  Your intuitive map of these cases is remarkably consistent with a sophisticated strand of contemporary moral philosophy, specifically those theories invoking an **agent-centred prerogative**. Your tentative cost-threshold principle is the right starting point, but in its raw form, it is too static to handle promises, aggregation, and the distinction between prudence and morality.

  Here is a precise formulation of a repaired principle, followed by an analysis of your cases, answers to your specific questions, and an honest assessment of where your intuitions may need to be revised.

  ### The Repaired Principle: The Cumulative Burden Threshold

  > **Principle:** An act is **obligatory** if it prevents significant harm to others at a cost to the agent that does not exceed a threshold of reasonable sacrifice, provided no special obligations exist to the contrary. An act is **supererogatory** if it prevents significant harm but exceeds this threshold.
  >
  > **Crucial Qualifiers:**
  > 1.  **Cost Definition:** 'Cost' includes not only immediate material loss or physical risk but also long-term impact on the agent's life projects and psychological integrity.
  > 2.  **Cumulative Cap:** The threshold applies to the agent's **lifetime burden**, not merely to isolated acts. Once an agent has sacrificed up to the limit of what can reasonably be demanded over a lifetime, further acts of beneficence become supererogatory.
  > 3.  **Special Obligations:** Voluntary undertakings (such as promises) or specific relationships (such as parenthood) can lower the threshold for specific beneficiaries, converting what would be supererogatory for a stranger into an obligation for the agent.

  ---

  ### Testing the Principle Against Your Cases

  **1. The Passer-by and the Coat (£300 vs. Child's Life)**
  *   **Verdict:** Obligatory.
  *   **Analysis:** The cost (£300 and a wet outing) is well below the threshold of severe loss. The benefit (a life) is maximal. The proximity is immediate. The principle classifies this squarely as duty.
  *   **Fit:** Perfect.

  **2. The Soldier and the Grenade (Life vs. Squad)**
  *   **Verdict:** Supererogatory.
  *   **Analysis:** The cost is the agent's entire future existence. This exceeds any plausible threshold of reasonable sacrifice. While military *discipline* might demand it, morally speaking, self-sacrifice of this magnitude is beyond duty.
  *   **Fit:** Perfect.

  **3. The Stranger and the Kidney (Health Risk vs. Stranger's Life)**
  *   **Verdict:** Supererogatory.
  *   **Analysis:** Surgical intervention carries significant risk and long-term health costs. For a stranger, this exceeds the threshold of what morality can demand.
  *   **Fit:** Perfect.

  **4. The Comparison (Drowning Child vs. Kidney)**
  *   **Verdict:** Drowning child = Blameworthy omission; Kidney = No blame.
  *   **Analysis:** You asked why, if both save lives, the verdicts differ. Under this principle, the difference lies in the **cost** and **certainty**. Wading into a canal is low cost/high certainty. Kidney donation is high cost/variable certainty (rejection risks, surgical complications). The threshold is crossed in the kidney case but not the canal case.
  *   **Fit:** Explains the asymmetry without contradicting the value of life.

  **5. The Colleague and the Promise**
  *   **Verdict:** Blameworthy upon backing out.
  *   **Analysis:** This is handled by **Qualifier 3 (Special Obligations)**. By promising, the colleague voluntarily altered their normative landscape. The act didn't change; the agent's relationship to the act did. The promise lowers the threshold for this specific act to zero.
  *   **Fit:** Perfect.

  **6. The Burning House and the Cat (Burns vs. Animal)**
  *   **Verdict:** Ambivalent (Supererogatory vs. Imprudent).
  *   **Analysis:** Here the principle clarifies your confusion. Morally, saving the cat at the cost of serious burns is **supererogatory** (cost exceeds threshold relative to the benefit of a cat's life). However, morality and prudence are distinct. An act can be morally optional yet rationally foolish. The principle categorises the *moral status*; it does not mandate that you admire the *prudence*.
  *   **Fit:** Resolves the tension by separating moral optionality from rational wisdom.

  **7. The Famine Relief Saint (Aggregate Sacrifice)**
  *   **Verdict:** Individual acts seem required; total life seems beyond duty.
  *   **Analysis:** This is handled by **Qualifier 2 (Cumulative Cap)**. On day one, giving £10 is below the threshold. On day 10,000, having lived on subsistence wages, the agent has reached their lifetime cap. Further giving becomes supererogatory. The intuition that the *whole life* is beyond duty is correct; the intuition that *each daily act* was strictly obligatory is false. They were permissible, but eventually became optional as the cumulative burden grew.
  *   **Fit:** Repairs the aggregation problem.

  ---

  ### Addressing Your Specific Questions

  **(a) The Rescuer with Accumulated Small Sacrifices**
  The repaired principle dictates that we evaluate the cost **holistically over time**. If a rescuer makes many small sacrifices that accumulate into a very large one (e.g., caring for a sick relative for twenty years, ruining their career prospects), the later acts shift in status.
  *   **Early stage:** Obligatory (cost is low).
  *   **Late stage:** Supererogatory (cumulative cost has breached the lifetime threshold).
  We should not blame the agent for stopping once the cumulative burden becomes excessive, even if the immediate act of stopping seems small. The principle protects the agent from being consumed by the sum of many small duties.

  **(b) Attitude and Merit Beyond Duty**
  Can attitude alone generate merit beyond duty? **No, not regarding the act's status, but yes regarding the agent's praiseworthiness.**
  *   **Deontic Status:** If an act is obligatory, it remains obligatory regardless of whether it is done grudgingly or joyfully. A grudging soldier who jumps on the grenade performs a supererogatory *act*. A joyful parent who feeds their child performs an obligatory *act*.
  *   **Aretaic Evaluation:** However, we distinguish between the *act* and the *agent*. An agent who fulfills their duty with exceptional generosity, warmth, or spirit displays **virtue**. We may admire them more than a grudging supererogator, but this is admiration of *character*, not of *supererogation*. Supererogation is defined by going beyond what is *required*, not by how nicely one does what is required. To call the joyful dutiful person 'supererogatory' conflates 'more than duty' with 'better than average'.

  ---

  ### Honest Assessment: Which Verdicts to Surrender?

  No principle captures every pre-theoretical intuition without friction. To maintain a coherent view, I counsel you to surrender two specific verdicts from your original list.

  **1. Surrender the Ambivalence on the Cat (Case 6)**
  You stated you "can't get those two reactions to sit together" regarding the man burned for the cat (supererogatory vs. imprudent).
  *   **Advice:** Accept that they sit together comfortably. Morality does not exhaust rationality. You should firmly classify the act as **supererogatory**. It is morally permissible to do it, and morally permissible to not do it. That it is *imprudent* is a separate judgement about the agent's welfare. Do not let the label 'imprudent' muddy the moral category. If you insist it is not supererogatory because it is foolish, you conflate self-interest with moral duty.

  **2. Surrender the Verdict on the Individual Daily Gifts (Case 7)**
  You felt that "each day's gift seems too small to be beyond duty," yet the whole life is plainly more than duty.
  *   **Advice:** You must surrender the intuition that **each** daily act was obligatory. This is logically incompatible with the verdict that the **sum** is beyond duty (unless you believe duty can demand self-destruction, which your threshold principle rightly rejects).
  *   **Correction:** Accept that there was a tipping point. Perhaps for the first year, the gifts were obligatory. By the tenth year, continuing to live on subsistence wages became supererogatory. The individual acts changed their deontic status as the cumulative burden increased. Holding that every single act was required forces you to conclude the saint was merely doing their duty, which contradicts your strong intuition that such a life is "plainly more than duty can demand."

  ### Conclusion

  Your cost-threshold instinct is sound. By refining it to account for **cumulative lifetime burden** and distinguishing **special obligations** from general duties, you can capture almost all your verdicts.

  The resulting view is this: Morality demands much of us, but it does not demand everything. It allows us a sphere of personal life protected by a threshold of acceptable cost. When we cross that threshold, we become saints or heroes; when we stay within it, we are merely good. And sometimes, we promise to cross it, binding ourselves to a higher standard voluntarily. That is a coherent, defensible, and humane moral architecture.
