  Let's write.

  *Title Idea:* The Relativity of Infinity.
  *Opening:* Cantor's diagonal. The sense of discovery.
  *The Twist:* Skolem.
  *The Interviewee:* Let's call him "Elias" or keep him anonymous but prominent. Let's use "a prominent set theorist I spoke with in Oslo."
  *The Argument:* The "Outside" is a mirage.
  *The Conclusion:* Absolutists need Second-Order Logic + Platonist justification.

