answer: |-
  This is a sophisticated administrative problem. You are correctly identifying the tension between *descriptive linguistics* (how language actually works) and *prescriptive law* (how language must work to be enforceable). Wittgenstein tells us that meaning is use; the Court tells us that meaning must be rule-bound to avoid "void for vagueness" challenges.

  Below is the **Definitional Stability Protocol (DSP)**. It is designed for your three planners to run using your existing permit logs, inspection reports, and past litigation files. It does not promise to eliminate litigation, but it promises to categorize *why* the litigation is happening so you choose the right drafting tool.

  Following the protocol, I have applied it to your three terms, including the unwelcome result you requested, and concluded with an analysis of where this approach is most vulnerable to legal attack.

  ***

  # The Definitional Stability Protocol (DSP)
  **Version:** 1.0 (Planning Dept. Internal Use)
  **Operators:** Planning Staff (3)
  **Inputs:** Past 5 years of permit logs, Inspector Disagreement Logs, Litigation Settlements.

  ### Step 1: The Core Consensus Test
  **Action:** Pull 50 random past permits involving the term. Separate them into "Clearly Yes," "Clearly No," and "Contested."
  **Question:** Do all three planners agree on the "Clearly Yes" pile without looking at the code?
  *   **If No:** The term is fundamentally broken. Do not draft definitions. Hand off to City Attorney (Step 5).
  *   **If Yes:** Proceed to Step 2.
  **[JUDGMENT CALL]:** *Agreement among staff is not objective truth. It may reflect shared bias. Document who was excluded from this consensus (e.g., "We all agreed a tent is not a dwelling," but did we ask a housing advocate?)*

  ### Step 2: The Dimensionality Test
  **Action:** Look *only* at the "Contested" pile from Step 1. List the reasons why each case was hard.
  **Question:** Do the disagreements track a **single dimension** (e.g., square footage, duration of stay) or **criss-crossing dimensions** (e.g., permanence + cooking capability + emotional attachment + economic independence)?
  *   **Single Dimension:** Strict Criteria are viable. (e.g., "Over 200 sq ft = Yes").
  *   **Criss-Crossing:** Strict Criteria will fail. New cases will emerge that match 2 out of 3 dimensions. Proceed to Step 3.
  **[JUDGMENT CALL]:** *Identifying dimensions is interpretive. Staff may unconsciously group dimensions to force a "Single Dimension" result because it's easier to draft.*

  ### Step 3: The Regulatory Purpose Test
  **Action:** For the term in question, list every code section that relies on it.
  **Question:** Does the term serve **one primary regulatory purpose** (e.g., Sewer Capacity, Fire Egress) or **multiple conflicting purposes** (e.g., Aesthetics + Density Control + Neighborhood "Character")?
  *   **One Purpose (Technical):** Strict Criteria are defensible.
  *   **Multiple Purposes (Social/Policy):** Strict Criteria will create loopholes. You need a "Prototype + Discretion" model. Proceed to Step 4.
  **[JUDGMENT CALL]:** *Distinguishing "Technical" from "Social" is political. Fire safety is technical; "preserving neighborhood feel" is social. Be honest here.*

  ### Step 4: The Loophole History Test
  **Action:** Review the last 3 times this definition was tightened.
  **Question:** Did the tighter definition resolve the dispute, or did it create a new specific boundary case within 24 months? (e.g., You banned "permanent foundations," so they built on "temporary blocks.")
  *   **Resolved:** Continue with Strict Criteria.
  *   **Created New Loopholes:** Stop tightening. You are playing Whac-A-Mole. Adopt a "Functional Equivalence" clause.
  **[JUDGMENT CALL]:** *Attributing a new permit application to a "loophole" rather than "innovation" is a value judgment.*

  ### Step 5: The Value Handoff (Stop Rule)
  **Action:** If Step 1 failed, or if Step 3 reveals the term is being used to enforce social norms rather than physical safety.
  **Decision:** **STOP.** Do not draft a definition.
  **Output:** Memo to City Council/Attorney stating: *"This term cannot be defined administratively without making policy choices reserved for the legislative body. Current disputes are value conflicts, not semantic ones."*

  ***

  # Application of the DSP to Your Contested Terms

  Here is the output your staff should generate if they run the DSP honestly.

  ### 1. Term: "Dwelling Unit"
  *   **Step 1 (Consensus):** **Pass.** Staff agrees a house is a dwelling; a shed is not.
  *   **Step 2 (Dimensions):** **Mostly Single.** Disagreements usually track "independent living capability" (kitchen + bath + egress).
  *   **Step 3 (Purpose):** **Technical.** Primarily used for sewer hookups, fire egress, and occupancy limits.
  *   **Step 4 (History):** **Mixed.** Tightening definitions on "kitchens" led to "kitchenettes."
  *   **DSP Recommendation:** **Strict Criteria (with Technical Updates).**
  *   **Drafting Strategy:** Define by *systems*, not rooms. Do not say "must have a kitchen." Say "must have permanent plumbing for potable water and wastewater disposal capable of supporting [X] gallons per day."
  *   **Why:** This is a high-stakes health and safety term. Courts expect precision here. You *can* pin this down, but you must update the technical specs (gallons, voltage, egress width) regularly, not the conceptual definition.

  ### 2. Term: "Family"
  *   **Step 1 (Consensus):** **Fail.** Staff disagrees on unrelated adults, foster children, or live-in nannies.
  *   **Step 2 (Dimensions):** **Criss-Crossing.** Biology, economics, emotion, duration, legal ties.
  *   **Step 3 (Purpose):** **Social.** Used to stabilize neighborhoods, but often functions to exclude non-traditional households.
  *   **Step 5 (Value Handoff):** **TRIGGERED.**
  *   **DSP Recommendation:** **Legislative/Attorney Handoff.**
  *   **Drafting Strategy:** Do not attempt a new administrative definition. Refer to State Statute or Federal Fair Housing definitions. If local code adds restrictions, it must come from Council with explicit findings of fact regarding health/safety, not "character."
  *   **Why:** *Moore v. City of East Cleveland* (1977) warns that defining family is a constitutional minefield. Any strict definition you write will be challenged as discriminatory. This is not a meaning problem; it is a rights problem.

  ### 3. Term: "Accessory Structure"
  *   **Step 1 (Consensus):** **Pass.** A shed is accessory; a second house is not.
  *   **Step 2 (Dimensions):** **Criss-Crossing.** Is it the size? The use? The mobility? The connection to utilities? (e.g., A tiny home on wheels is mobile but lived in permanently).
  *   **Step 3 (Purpose):** **Multiple.** Used for setbacks (safety), aesthetics (visual), and density (economic).
  *   **Step 4 (History):** **Loopholes Confirmed.** Every time you defined "structure" by foundation type, someone used wheels. Every time you defined by size, someone built two small ones.
  *   **DSP Recommendation:** **Prototype + Functional Discretion.** ( **UNWELCOME ANSWER** )
  *   **Drafting Strategy:** Stop listing what *is* an accessory structure. Define the **Primary Structure** strictly. Define Accessory as: *"A structure subordinate in area and purpose to the Primary Structure, not capable of independent habitation (per Dwelling Unit definition), and located on the same lot."*
  *   **The Kicker:** Add a **Discretionary Review Clause**: *"Structures exceeding [X] square feet or containing [Y] plumbing fixtures require a Special Determination of Subordination."*
  *   **Why this is unwelcome:** Your department wants to eliminate discretion to reduce workload and liability. This protocol tells you that **discretion is unavoidable.** If you remove the discretion, you will invite more litigation as innovators game the strict criteria. You are trading "permit processing speed" for "litigation defense."

  ***

  # Where the Procedure Will Misfire (The "Wittgenstein Trap")

  You asked for honesty about where this translation from philosophy to statute breaks down. There are three specific failure points you must disclose to the City Attorney.

  ### 1. The "Void for Vagueness" Risk
  Wittgenstein argues that open-textured concepts work fine in ordinary language because context resolves ambiguity. **Courts do not accept "context" as a defense in zoning.**
  *   **The Misfire:** If you adopt the "Prototype + Discretion" model for *Accessory Structures*, a property owner denied a permit will sue, claiming the code gives planners "unfettered discretion" to approve their neighbor's shed but deny theirs.
  *   **The Fix:** You must draft "Tie-Breaking Rules" that *look* like strict criteria but function as safety valves.
      *   *Bad:* "Must look subordinate."
      *   *Good:* "Must not exceed 40% of the Primary Structure's floor area OR 1,000 sq ft, whichever is less."
      *   *The Trap:* You are essentially lying. You are using strict numbers to approximate a family resemblance concept. Eventually, someone will hit 41% and claim hardship. You need a variance process that admits this is a judgment call, not a math error.

  ### 2. The "Gaming" Inevitability
  Strict criteria invite gaming; open standards invite bias. There is no middle ground, only a choice of enemy.
  *   **The Misfire:** The DSP recommends Strict Criteria for *Dwelling Unit*. Attorneys will immediately design "Efficiency Units" that meet the plumbing specs but violate the spirit of the density cap.
  *   **The Reality:** You cannot define "Dwelling Unit" in a way that prevents lawyers from parsing your syntax.
  *   **The Fix:** Include an **Anti-Evasion Clause**. *"Definitions are intended to capture the functional use of the space. Devices or arrangements designed to circumvent the intent of this definition shall be construed as violating the code."* This imports the "spirit" back into the "letter," but it requires a hearing officer willing to enforce intent over text.

  ### 3. The Institutional Bias Blind Spot
  Step 1 of the DSP relies on *your* staff's consensus.
  *   **The Misfire:** Your staff of three planners likely shares a specific worldview about what a "neighborhood" looks like. You may have 100% consensus that a "group home for 6 adults" is not a "Family," but the courts may disagree.
  *   **The Reality:** Consensus among regulators is often evidence of groupthink, not linguistic clarity.
  *   **The Fix:** When running Step 1, you must include a "Red Team" reviewer—someone from the Building Department or a citizen representative who is *not* a planner. If they disagree with the "Clearly Yes" pile, you must treat the term as a Step 5 Handoff.

  ### Summary Recommendation
  1.  **Dwelling Unit:** Write the strict technical specs, but add an Anti-Evasion clause. Accept that you will still litigate technicalities.
  2.  **Accessory Structure:** **Stop trying to list them.** Define by relationship to the main house and square footage caps. Empower staff to make "Subordination Determinations" for edge cases. This increases your workload but decreases successful lawsuits.
  3.  **Family:** **Do not touch this.** It is a legislative/political question. Any definition you write is ammunition for a civil rights suit. Hand this to the Council with a memo citing *Moore v. East Cleveland*.

  **Final Warning:** The DSP will not stop litigation. It will only ensure you are litigating the right battles. If you try to define "Family" strictly, you will lose. If you try to define "Accessory Structure" strictly, you will be gamed. If you define "Dwelling Unit" strictly, you will be safe on safety, but challenged on density. Choose your vulnerability intentionally.
