      *   **Task:** Audit the provided set of 6 commitments for internal tensions/contradictions.
      *   **Requirements:**
          *   Identify genuine tensions vs. apparent ones.
          *   Explain what each tension turns on.
          *   Rank tensions by severity.
          *   For genuine tensions, state what would have to give and the cost of giving it up.
          *   Recommend a *single revision* that cleans up the most.
          *   Do not be misled by the user's ordering of the list.

  2.  **Analyze the Commitments:**
