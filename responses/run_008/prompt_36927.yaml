prompt: |-
  I am a retired condensed-matter physicist — thirty-five years at a national laboratory, mostly on electronic transport in disordered materials — and since retiring I have been reading philosophy of science in earnest for the first time. Perhaps unwisely, I have also agreed to serve on the editorial board of a mid-tier physics journal and as an ad hoc reviewer for a funding agency. This means I now spend a few evenings a month judging manuscripts and grant proposals whose central claim is that some theory or model is confirmed by its agreement with data that were already in hand long before the theory was proposed, and I have discovered that I have no principled basis for judging such claims.

  When I was doing research, we all operated on a folk rule: a successful novel prediction counts heavily in a theory's favor, while successfully accommodating already-known data counts for much less, or nothing at all. Nobody could say exactly why, or how much less, and we quietly made exceptions — everyone in my field agrees that a theory's ability to explain a stubborn old anomaly can be devastatingly impressive even when the anomaly predated the theory by decades. Since beginning my reading, I have learned that philosophers have a name for the underlying puzzle, the problem of old evidence, and that it is genuinely awkward for Bayesian confirmation theory: if I already know E, then my probability for E is one, and it seems no hypothesis can raise the probability of something that is already certain — so old evidence apparently cannot confirm anything, which is obviously the wrong answer. I have also noticed some practical wrinkles in the refereeing situation that the philosophical discussions I have read do not address, and I would like your help with those in particular:

  1. There seem to be at least three different situations lumped together as "old evidence": the datum was actually used in constructing or tuning the theory; the datum was known to the theory's author but played no role in the construction; or the datum was unknown to the author though well known in the field (say, buried in an old technical report). My instinct is that these should count very differently, and that the crucial factor is somehow the author's epistemic situation rather than the logical relation between theory and evidence — but I am not confident, and I can't find a clean way to draw the lines.
  2. There is what I think of as a double-counting problem: in my field, a single venerable dataset gets cited as supporting a dozen successive refinements of a model, each paper taking the last one's success as its starting point, and I suspect the accumulated confirmation is largely illusory without anyone having done anything dishonest.
  3. Referees almost never know which of the three situations in (1) they are facing, because authors do not disclose how a model was actually built. A procedure that only works when one knows the model's construction history is useless to me.

  Please take on the role of a professional philosopher of science with deep expertise in Bayesian confirmation theory and its known difficulties, who has been asked to advise a working editorial board. Before writing anything, think carefully about the underlying epistemology — in particular, work out for yourself which distinctions genuinely matter and which of my three wrinkles are real problems as opposed to confusions on my part, since I may be misdescribing things. Feel free to conclude that some of my framing is off, but tell me so explicitly rather than silently correcting it.

  Then write the deliverable: a decision procedure that I and my fellow board members can actually run on a manuscript or grant proposal, in an evening, without access to the authors and without doing any of our own data analysis. It should be a checklist of questions in a sensible order, each with an indication of what counts as a sufficient answer, a plain-language explanation (a few sentences at most, aimed at scientists with no philosophy) of why that question is there, and clear stopping points where the procedure hands the decision back to human judgment because the remaining issue is not a factual one the checklist can resolve. It must be honest about which steps are defensible applications of confirmation theory and which are judgment calls dressed up as procedure. Finally, run the procedure on three cases drawn from my actual reviewing life:

  (a) A theory paper whose model, built from general principles with no free parameters fitted to the data in question, retrodicts the long-standing unexplained linear-in-temperature resistivity of the cuprate superconductors, and claims this as strong support. My strong prior is that this deserves full credit, whatever the old-evidence worry is.

  (b) A grant proposal in which a simulation model with something like forty adjustable parameters, tuned on a well-worn dataset, reproduces that dataset's features to within a few percent, and the applicants describe this as strong confirmation of the underlying physical assumptions.

  (c) A paper whose lead author, I happen to know from personal contact, chose one of the model's key parameter values precisely because it made the model match a known experimental result — but the paper presents the match as an independent success and does not disclose this.

  Please apply the procedure to all three in enough detail that I can see how each step behaves on a real case, and — this is important — tell me plainly if the procedure's verdict on case (a) comes out against my prior, or if it forces me to treat cases (a) and (c) more alike than I would like. Close with a candid statement of what the procedure cannot do, including the situations where it will misfire and what a board member should watch for as signs that it has.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired condensed-matter physicist (35 years at a national lab), expert in electronic transport in disordered materials. Now reading philosophy of science. Serves on an editorial board and as a grant reviewer.
      *   **Problem:** Struggling with the "problem of old evidence" in a practical reviewing context. Specifically, how to judge claims of confirmation when data predates theory.
      *   **Specific Wrinkles:**
          1.  Three types of "old evidence" (used in construction, known but not used, unknown to author but known in field).
          2.  Double-counting (same dataset supporting successive refinements).
          3.  Opacity (referees don't know how the model was built).
      *   **Task:** Act as a professional philosopher of science (expert in Bayesian confirmation theory). Advise the editorial board.
      *   **Deliverable:** A practical decision procedure (checklist) for manuscripts/grants. Must be runnable in an evening, without author access, without new data analysis. Must distinguish between defensible theory and judgment calls. Must apply to three specific cases (a, b, c). Must be honest about limitations and conflicts with the user's priors.
      *   **Tone:** Professional, respectful of the user's expertise, philosophically rigorous but practically grounded.

  2.  **Philosophical Groundwork (Internal Monologue/Scratchpad):**
      *   *The Problem of Old Evidence:* In strict Bayesianism, $P(E) = 1$ if $E$ is known. So $P(H|E) = P(H)$. No confirmation. This is the "static" problem. The "dynamic" solution (Garber, Jeffrey, etc.) involves logical learning or counterfactuals.
      *   *User's Intuitions:* The user distinguishes between *accommodation* (fitting old data) and *prediction* (novel data). This aligns with the "use-novelty" criterion (Worrall, Zahar).
      *   *Wrinkle 1 (Construction vs. Knowledge):* This is the core of use-novelty. Did the data *cause* the theory? If yes, accommodation. If no (even if known), it might still count as support (e.g., Einstein and Mercury's perihelion). The epistemic situation of the *author* matters more than the logical status of the evidence.
      *   *Wrinkle 2 (Double-Counting):* This is about independence. If Model 2 is just Model 1 + 1 parameter fitted to the *same* data, the confirmation is weak. This relates to overfitting and degrees of freedom. Bayesian model selection (BIC/AIC) handles this, but reviewers often don't calculate it. The philosophical issue is "independence of evidence."
      *   *Wrinkle 3 (Opacity):* This is the practical killer. We can't know the construction history. We must infer from the paper's structure, parameter counts, and transparency.
      *   *Resolution:* I need to shift the focus from "Does old evidence confirm?" (philosophical puzzle) to "Is the inference to the best explanation robust against overfitting and ad hocery?" (practical scientific evaluation). The checklist needs to operationalize "use-novelty" and "severity of test" (Mayo) without requiring psychic powers.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* A checklist.
      *   *Structure:* Sequential questions. Stop points.
      *   *Content:*
          1.  Parameter counting (degrees of freedom).
          2.  Independence of data (training vs. testing).
          3.  Transparency of construction (did they hide the tuning?).
          4.  Alternative explanations (were rivals considered?).
      *   *Philosophical Justification:* Needs to reference Bayesian model comparison (penalizing complexity) and Severe Testing (error statistics).
      *   *Honesty:* Admit that we can't solve the "old evidence" problem logically, so we solve it methodologically.

  4.  **Applying to Cases:**
      *   *Case (a):* Cuprate resistivity. No free parameters. General principles. *Verdict:* Passes. High severity.
      *   *Case (b):* 40 parameters, tuned on same data. *Verdict:* Fails. Overfitting risk. Low severity.
      *   *Case (c):* Hidden tuning. *Verdict:* Fails on transparency/integrity, even if the physics works. This is the tricky one. The procedure might flag it as "unclear construction," requiring judgment.
      *   *Conflict Check:* The user likes (a). The procedure should support (a). The user dislikes (c). The procedure should flag (c). The tension is between (a) and (c) regarding "old evidence." (a) uses old evidence but no tuning. (c) uses old evidence *with* hidden tuning. The distinction is *tuning*, not just age of data. I need to make sure the procedure captures this.

  5.  **Refining the Philosophy:**
      *   I need to correct the user slightly on the "Problem of Old Evidence." It's not just about $P(E)=1$. It's about *how* the hypothesis was generated. The "Garberian" solution involves learning the logical relation $H \vdash E$. But for reviewers, the "Use-Novelty" criterion is more practical.
      *   I need to address the "Double Counting." This is essentially the problem of *independent evidence*. If $E$ supports $H_1$, does it support $H_2$ (which entails $H_1$)? Only if $H_2$ makes *additional* risky claims.
      *   I need to address the "Opacity." We can't know the history, so we must demand *disclosure* as a condition of publication. This shifts the burden to the author.

  6.  **Developing the Checklist (Iterative Process):**
      *   *Step 1:* Identify the data. Is it old or new?
      *   *Step 2:* Identify the parameters. How many were fixed *before* seeing this specific data?
      *   *Step 3:* Independence. Is there a hold-out set?
      *   *Step 4:* Rivals. Did they compare to other models?
      *   *Step 5:* Disclosure. Do they admit how parameters were set?
      *   *Critique:* Is this too simple? Maybe. But it needs to be doable in an evening.
      *   *Refinement:* Add a "Severity" check. Did the test have a high probability of failing if the theory were wrong?

  7.  **Addressing the Specific Cases:**
      *   *(a) Cuprates:* No free parameters. Old data. *Procedure:* Passes parameter check. Passes severity (could have failed). Verdict: Supportive.
      *   *(b) 40 Parameters:* Old data. Tuned. *Procedure:* Fails parameter check (high DOF). Fails independence (no hold-out). Verdict: Weak/Reject.
      *   *(c) Hidden Tuning:* Old data. Hidden tuning. *Procedure:* Fails disclosure. Flagged for integrity. Verdict: Reject/Return.
      *   *Conflict:* Does the procedure treat (a) and (c) alike? No, because (a) has no free parameters to tune. (c) has parameters that were tuned. The distinction is *flexibility*, not just data age. I must explain this clearly to the user.

  8.  **Final Review against Constraints:**
      *   Role: Philosopher of Science.
      *   Tone: Respectful, expert.
      *   Deliverable: Checklist + Application + Limitations.
      *   Honesty: Admit where philosophy ends and judgment begins.
      *   User's Priors: Ensure (a) isn't unfairly penalized.

  9.  **Constructing the Response:**
      *   *Introduction:* Acknowledge the user's expertise and the validity of the puzzle. Validate their intuition about the three wrinkles.
      *   *Philosophical Preamble:* Briefly clarify the "Old Evidence" problem vs. the "Overfitting/Ad Hoc" problem. Explain that for reviewers, the latter is the operational proxy for the former.
      *   *The Procedure:* The "Epistemic Risk Assessment Checklist."
      *   *Application:* Walk through (a), (b), (c).
      *   *Limitations:* What this can't solve (e.g., fraud, genuine breakthroughs that look ad hoc).

  10. **Self-Correction/Nuance Check during drafting:**
      *   *Wait,* in Case (c), the user *knows* about the tuning from personal contact. The procedure can't rely on that. The procedure must rely on what's *in the paper*. So the procedure must flag the *lack of disclosure* as a fatal flaw, regardless of whether the tuning actually happened. This aligns with scientific norms.
      *   *Case (a):* The user's prior is strong. I need to make sure the checklist doesn't penalize "old data" per se, but penalizes "old data + high flexibility."
      *   *Double Counting:* I need to explicitly mention that citing the same dataset for $H_n$ requires $H_n$ to explain something $H_{n-1}$ didn't, or explain it *better* with *fewer* assumptions.

  11. **Final Polish:** Ensure the voice sounds like a colleague (philosopher) talking to a colleague (physicist). Avoid overly technical jargon where plain English works, but don't dumb down the epistemology. (e.g., use "degrees of freedom" instead of "dimensionality of parameter space" where possible).

  *(Self-Correction on the "Old Evidence" Problem)*: I should clarify that the "Problem of Old Evidence" is technically about logical omniscience in Bayesianism. But the *reviewer's* problem is actually the "Problem of Ad Hoc Accommodation." I need to make this distinction clear so the user knows I'm addressing their *practical* problem, not just the *theoretical* one.

  *(Refining the Checklist)*: Make sure there are "Stop" points. If a paper fails Step 2, don't bother with Step 5.

  *(Refining the Case Analysis)*: Be explicit about where the procedure aligns or conflicts with the user's intuition.

  Okay, ready to write.s
answer: |-
  Colleague, it is a pleasure to engage with someone who has spent a career in the trenches of condensed-matter physics and now turns a critical eye toward the epistemological foundations of that work. Your intuition is sound: the "problem of old evidence" as discussed in philosophy journals (largely a technical puzzle about Bayesian conditionalization on certainties) is not actually the problem you are facing at your desk.

  Your problem is the **problem of ad hoc accommodation** and **severity of testing**.

  In philosophy, we distinguish between the *context of discovery* (how the theory was built) and the *context of justification* (how it is evaluated). Strict Bayesianism struggles with old evidence because it treats probability as a static logical relation. But you are operating in a dynamic, human context where the *risk of error* matters. When you say a novel prediction counts more, you are invoking what Deborah Mayo and Aris Spanos call **Severe Testing**: a claim is well-tested only if it has passed a procedure that would likely have detected errors if they existed. Accommodating old data with a flexible model rarely constitutes a severe test because the model could have been twisted to fit almost anything.

  Regarding your three wrinkles:
  1.  **Construction vs. Knowledge:** You are correct. The crucial epistemic factor is **use-novelty**. Did the data *constrain* the construction of the hypothesis? If yes, the confirmation is weak. If the data was known but *not used* to tune the model (e.g., Einstein and the perihelion of Mercury), it can still confirm, provided the theory was rigid enough that it *could have failed*.
  2.  **Double-Counting:** This is a problem of **independence**. If Dataset $D$ supports Model $M_1$, it cannot fully support Model $M_2$ (which is just $M_1$ plus a fudge factor) unless $M_2$ explains something $M_1$ could not, or explains it with fewer assumptions.
  3.  **Opacity:** This is the practical bottleneck. Since we cannot read authors' minds, we must treat **transparency about construction** as a necessary condition for confirmation. If they don't tell us how the sausage was made, we must assume the sausage might be spoiled.

  Below is the decision procedure you requested. It is designed to operationalize "severity" and "use-novelty" without requiring you to solve the philosophical problem of old evidence from first principles.

  ***

  # The Epistemic Risk Assessment Checklist (ERAC)

  **Purpose:** To evaluate claims of theoretical confirmation when the supporting data predates the model.
  **Constraints:** To be completed by a referee in <2 hours, using only the manuscript text.
  **Philosophical Basis:** Error Statistics (Mayo) and Bayesian Model Selection (penalizing complexity).

  ### Step 1: The Flexibility Audit
  **Question:** Does the model contain adjustable parameters that were not fixed by independent theory or prior data *unrelated* to the dataset in question?
  *   **Yes:** Count them. Let this be $N_{free}$.
  *   **No:** Set $N_{free} = 0$.
  *   **Why:** A model with high flexibility can fit noise. Confirmation requires the model to risk being wrong.
  *   **Stop Rule:** If $N_{free} \geq$ the number of distinct data features fitted, **STOP**. Recommendation: Reject or Major Revision. The fit is mathematically trivial, not physically confirmed.

  ### Step 2: The Construction Disclosure
  **Question:** Does the text explicitly state which data were used to construct/tune the model versus which were reserved for testing?
  *   **Yes:** Proceed to Step 3.
  *   **No:** **STOP**. Recommendation: Major Revision. Require a "Construction Statement."
  *   **Why:** Without this, we cannot distinguish prediction from accommodation. Opacity prevents the assessment of severity.
  *   **Note:** This is a procedural judgment, not a physical one. We cannot evaluate the physics if the methodology is hidden.

  ### Step 3: The Independence Check (Addressing Double-Counting)
  **Question:** If this model is a refinement of a previous model ($M_{old}$) supported by the same dataset ($D$), does the new model explain a feature of $D$ that $M_{old}$ *failed* to explain, or does it explain $D$ with significantly fewer assumptions?
  *   **Yes:** Proceed to Step 4.
  *   **No:** **STOP**. Recommendation: Reject.
  *   **Why:** Citing the same success as a predecessor without new explanatory power is double-counting. It adds complexity without increasing evidential support.

  ### Step 4: The Counterfactual Test
  **Question:** Is there a statement (explicit or clearly implied) regarding what result would have falsified the model? (e.g., "If the slope had been negative, the theory would fail.")
  *   **Yes:** **PASS**. The claim is provisionally supported.
  *   **No:** **JUDGMENT CALL**. The procedure ends here.
  *   **Why:** A test is only severe if it could have failed. If the model is compatible with all possible outcomes of the old data, it predicts nothing.
  *   **Instruction for Referee:** If you reach here, you must use your physical intuition. Does the mechanism proposed *force* the result, or merely allow it?

  ***

  # Application to Cases

  Here is how the ERAC behaves on your three specific cases. I will note where the procedure aligns with or challenges your priors.

  ### Case (a): Cuprate Resistivity (No free parameters, old data)
  *   **Step 1 (Flexibility):** $N_{free} = 0$. The model is built from general principles. **Pass.**
  *   **Step 2 (Disclosure):** Presumably, the paper states the derivation is ab initio or from general symmetry. **Pass.**
  *   **Step 3 (Independence):** Assuming this is a new theoretical approach compared to previous failed attempts. **Pass.**
  *   **Step 4 (Counterfactual):** A theory deriving linear-in-$T$ resistivity from first principles could easily have derived $T^2$ or $T^3$. The result was risky. **Pass.**
  *   **Verdict:** **Supported.**
  *   **Conflict Check:** The procedure aligns with your prior. The "old evidence" does not penalize the paper because the *flexibility* was zero. The risk of error was high (the theory could have yielded the wrong power law), so the test was severe.

  ### Case (b): Simulation with 40 Parameters (Tuned on old data)
  *   **Step 1 (Flexibility):** $N_{free} = 40$. Unless they are fitting 40+ independent features, this is likely over-parameterized. **Fail.**
  *   **Stop Rule Triggered:** The procedure recommends Reject/Major Revision immediately.
  *   **Verdict:** **Not Confirmed.**
  *   **Conflict Check:** Aligns with your suspicion. The procedure identifies this as a mathematical certainty of fitting rather than physical confirmation. The "old evidence" is irrelevant; the *degrees of freedom* are the killer.

  ### Case (c): Hidden Tuning (Author known to have tuned, paper claims independence)
  *   **Step 1 (Flexibility):** Let's assume the parameter count looks low on paper (e.g., 1 or 2). **Pass.**
  *   **Step 2 (Disclosure):** The paper presents the match as an independent success. It does *not* disclose that the parameter was chosen to match the data. Technically, the text might say "Parameter $X$ was set to value $Y$," without saying *why*.
      *   *Strict Reading:* If they don't explicitly say "We tuned this to fit," Step 2 might technically Pass if they describe the parameter setting vaguely.
      *   *Charitable Reading:* If they claim the match is a "prediction" or "confirmation," they imply the parameter was fixed independently. If you (the referee) suspect otherwise based on the text's vagueness, you Flag Step 2.
  *   **Step 4 (Counterfactual):** If the parameter was tuned to match, the model *could not have failed* this specific test. The counterfactual is false. **Fail.**
  *   **Verdict:** **Reject/Flag for Integrity.**
  *   **Conflict Check:** Here is the tension. You know (from outside contact) this is dishonest. The procedure relies *only* on the text.
      *   If the text is vague enough to pass Step 2, the procedure relies on your Step 4 judgment. You must ask: "Could this parameter have been set differently based on theory alone?" If no, it fails Step 4.
      *   **Crucial Distinction:** The procedure treats (a) and (c) differently *if* (c) is scrutinized for severity. In (a), the parameters are fixed by *principle*. In (c), the parameter is fixed by *fit*. The checklist forces you to identify *why* the parameter is fixed. If the author hides it, the procedure forces you to demand disclosure (Step 2) or judge the severity as low (Step 4).

  ***

  # Limitations and Candid Advice

  You asked for honesty about where this procedure misfires. Here is where it will fail you, and what you should watch for.

  **1. The "Vague Parameter" Loophole (Case c vulnerability)**
  The ERAC relies on authors being minimally honest in Step 2. A sophisticated author can write, "We set parameter $\alpha$ to 0.5," without admitting they chose 0.5 because it fit the 1998 data.
  *   **The Misfire:** The checklist might Pass a dishonest paper if the writing is sufficiently opaque.
  *   **The Watch:** Look for phrases like "chosen to be consistent with," "set to typical values," or "fixed at..." without a citation to an independent measurement. If a parameter value matches a dataset feature too perfectly without a theoretical derivation, assume tuning and fail Step 4.

  **2. The "Novel Theory, Old Data" Dilemma**
  Sometimes a theory is so new that *no* novel data exists yet. If we reject all old evidence, we stifle theory.
  *   **The Misfire:** Step 1 penalizes flexibility, but sometimes a complex model is physically necessary.
  *   **The Watch:** Use your physicist intuition at Step 4. Is the complexity *physically motivated* (e.g., including a known interaction term) or *mathematically motivated* (e.g., adding a polynomial term to smooth a curve)? The checklist cannot distinguish physical necessity from mathematical convenience; you must.

  **3. The "Double-Counting" Gray Zone**
  Step 3 asks if the new model explains something the old one failed to. But what if it explains the *same* thing much more simply?
  *   **The Misfire:** The checklist asks for "significantly fewer assumptions." This is subjective.
  *   **The Watch:** Apply Occam's Razor aggressively. If Model 2 has the same fit as Model 1 but adds a mechanism, it is not confirmed by the old data unless it makes a *new* claim about that data (e.g., about the noise structure, or a secondary effect).

  **4. The Conflict Between (a) and (c)**
  You worried the procedure would treat (a) and (c) alike. It will not, provided you enforce Step 4 rigorously.
  *   In (a), the "parameter" is a fundamental constant or derived quantity. It could not be changed without breaking the theory.
  *   In (c), the parameter is adjustable. It could be changed, and if it were changed, the fit would fail.
  *   **The Risk:** If you are tired, you might treat "fixed parameter" in (a) and "fixed parameter" in (c) as the same checkbox item. You must verify *why* it is fixed. In (a), it is fixed by derivation. In (c), it is fixed by assertion. The procedure requires you to spot that difference.

  ### Final Recommendation for the Board
  Adopt the **Construction Disclosure (Step 2)** as a mandatory policy requirement. Make it a rule of the journal that authors must include a "Model Construction Statement" specifying which data were used for tuning and which for testing. This shifts the burden of the "old evidence" problem from your epistemological judgment to their methodological transparency.

  If they disclose they tuned on old data, you can still publish if the physics is insightful, but they cannot claim "strong confirmation." They must claim "consistency." If they hide it, they violate the policy. This solves the opacity problem (Wrinkle 3) by fiat, allowing you to focus on the physics.

  You are not solving the Problem of Old Evidence. You are managing the Risk of Overfitting. The checklist above is a tool for the latter, which is the only one available to a referee in an evening.
