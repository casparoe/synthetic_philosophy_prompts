answer: |-
  First off, take a deep breath. Your brother-in-law (BIL) is describing a real economic concept, but he is wielding it like a sledgehammer to swat a fly. He has taken a highly theoretical result that relies on assumptions which do not exist in the real world, and he is using it to invalidate basic, prudent financial planning.

  The theorem he is referencing is known as the **No-Trade Theorem** (specifically the Milgrom-Stokey theorem from 1982, which builds on Robert Aumann's work on agreement).

  Here is the breakdown of what he got right, where he stretched the truth until it snapped, and why your decision to move money into bonds for a house down payment is completely rational.

  ### 1. The Grain of Truth: What the Theorem Actually Says
  Your BIL is correct about the core logic of the theorem *within its specific mathematical model*.
  *   **The Setup:** Imagine two traders. They are both perfectly rational. They start with the same baseline beliefs ("common priors"). They know the other person is rational.
  *   **The Logic:** If you offer to sell me a stock, I have to ask: "Why is he selling?" If he is rational, he must think the price is too high. If he knows something I don't, his willingness to sell is "bad news" for me. I should update my belief and not buy. Since he knows I will think that, he shouldn't offer.
  *   **The Result:** In this specific, frictionless vacuum, **speculative trade cannot happen.** If a trade occurs, it implies someone is irrational or acting on noise rather than information.

  **Where the economist nods:** Economists agree that *purely speculative* trading (trying to beat the market by guessing price movements) is a zero-sum game before costs and a loser's game after costs. This is why index funds are generally recommended for long-term growth. Your BIL is right that you shouldn't try to out-smart the market on *direction*.

  ### 2. The Stretch: Why It Doesn't Apply to You
  The No-Trade Theorem relies on assumptions that are famously unrealistic. As soon as you step out of the math model and into the real world, the theorem breaks. Here is where your BIL's argument falls apart:

  **A. Liquidity Needs vs. Information Asymmetry**
  The theorem assumes people trade only because they have different *information* about the asset's value. It ignores **liquidity preferences**.
  *   **You:** You are not selling because you think tech ETFs will crash tomorrow. You are selling because you have a **liability** (the house payment) coming in two years. You are matching your assets to your liabilities.
  *   **The Buyer:** The person buying your ETF might be a 25-year-old with a 40-year horizon. They can afford a 30% drop; you cannot.
  *   **The Verdict:** You aren't disagreeing on the *value* of the ETF; you are disagreeing on the *utility* of holding it. Trade based on different risk profiles and time horizons is perfectly rational and expected.

  **B. Risk Tolerance is Not "Irrationality"**
  The theorem assumes a single definition of "rational" utility. In reality, risk tolerance is personal.
  *   If I offer you $50 for a $100 bill because I need cash for lunch, and you buy it, are we irrational? No. I value the liquidity more than the face value; you value the profit more than the cash-on-hand.
  *   Moving from stocks to bonds to reduce volatility before a major purchase is **risk management**, not market timing. Your BIL is conflating "trying to beat the market" with "managing exposure to risk."

  **C. Market Makers and Intermediaries**
  Most trades aren't "I bet the price goes up" vs. "I bet the price goes down." Many trades are with market makers who provide liquidity for a fee. They don't necessarily have a view on the price; they are facilitating the transaction. The existence of these intermediaries invalidates the idea that every trade is a duel of wits.

  ### 3. The "Never Trade" Conclusion
  Your BIL's bottom line—"the rational move is never to trade at all"—is demonstrably false in practice and theory.
  *   **Lifecycle Investing:** It is rational to hold high-risk assets (stocks) when you are young and low-risk assets (bonds/cash) when you are near retirement or a major purchase. This is called a "glide path." If you never traded, you would be 100% stocks at age 70, which is widely considered imprudent.
  *   **Rebalancing:** He claimed rebalancing is irrational. Actually, rebalancing is the *only* free lunch in finance. It forces you to "sell high and buy low" systematically to maintain your risk profile. It is not a bet on market direction; it is a discipline to maintain your target risk.

  ### 4. The "Markets Can't Aggregate Information" Claim
  This is the part where your BIL actually contradicts himself and standard economic theory.
  *   **The Grossman-Stiglitz Paradox:** There *is* a famous paradox that asks: "If prices perfectly reflect all information, no one has an incentive to gather information. But if no one gathers information, prices can't reflect information."
  *   **The Resolution:** Markets are *mostly* efficient, but not perfectly. There is enough "noise" and enough liquidity trading (like you selling for a house) to allow informed traders to make a profit, which keeps the market efficient.
  *   **His Error:** He is using the No-Trade Theorem to say markets *don't* work, while simultaneously saying index funds *do* work. If markets couldn't aggregate information, index funds wouldn't be efficient. He is mixing up a theoretical puzzle with a practical conclusion.

  ### Summary: Is Your Move Irrational?
  **No.** Your brother-in-law is committing a category error.

  1.  **He is talking about Speculation:** Betting on price changes based on private info.
  2.  **You are doing Planning:** Adjusting risk exposure to match a known future cash need.

  The No-Trade Theorem proves that you can't consistently *beat the market* by trading on information. It does **not** prove that you shouldn't *manage risk* by trading to align with your life goals.

  **How to handle the next dinner:**
  You can tell him: *"I looked up the Milgrom-Stokey No-Trade Theorem. You're right that speculative trade with common priors is impossible. But the theorem explicitly excludes liquidity shocks and differing risk aversions. Since I'm selling to fund a liability (the house) and reduce sequence-of-returns risk, I'm trading on liquidity preference, not information asymmetry. So the theorem doesn't apply, and my asset allocation is still optimal for my utility function."*

  Then, pour him another glass of wine and change the subject. He's treating a theoretical boundary condition like a personal finance rule, and that's a great way to end up 100% invested in tech stocks the month before you need to buy a home.
