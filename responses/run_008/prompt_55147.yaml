          *   *Case:* Neuroplasticity, convergent evolution, silicon vs. carbon.
          *   *Status:* Non-negotiable for functionalism, but neuroscientists (like the BIL) might reject it as a requirement for *science*. I need to frame this carefully. It's a requirement for a *philosophical* theory of mind, not necessarily a neural mechanism.
      *   *Requirement 2: Causal Efficacy.* Mental states must *do* something.
          *   *Case:* Pain causes avoidance. If mental states are epiphenomenal, the theory fails.
          *   *Status:* Non-negotiable.
      *   *Requirement 3: Normativity/Misfunction.* Things can go wrong.
          *   *Case:* Pain without damage (phantom limb), damage without pain (asymbolia). A theory needs to distinguish "pain" from "pain-like behavior."
          *   *Status:* Non-negotiable (addresses the Lookup Table objection).
      *   *Requirement 4: Granularity/Individuation.* How specific is the definition?
