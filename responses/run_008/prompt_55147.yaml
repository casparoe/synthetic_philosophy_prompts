      *   *Trade-off 2: Autonomy of Psychology vs. Reductionism.* The user's "abstraction layer" intuition. Does psychology stand on its own, or does neuroscience swallow it?
      *   *Trade-off 3: Synchronic vs. Diachronic Identity.* Is a state defined by what it does *now* (causal role) or what it was *selected for* (teleology)?

  5.  **Evaluating Theories (Briefly):**
      *   *Machine/Causal-Role:* Good on MR, bad on Lookup Tables (Liberalism).
      *   *Psychofunctionalism:* Empirical, but risks losing MR if neuroscience finds unity.
      *   *Teleofunctionalism:* Good on Normativity, bad on novel states (evolution hasn't selected for LLM thoughts yet).

