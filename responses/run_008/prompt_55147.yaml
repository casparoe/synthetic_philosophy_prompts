      *   **Goal:** Wants a "spec" or "acceptance criteria" for a theory of mental states. Needs to know what *must* be satisfied vs. what's optional/prejudicial. Needs to know about trade-offs (CAP theorem style). Needs an assessment of how their software analogies help/hinder.
      *   **Tone:** Technical, precise, no-nonsense, acknowledging the engineering mindset while correcting misconceptions.

  2.  **Deconstruct the Request into Sections:**
