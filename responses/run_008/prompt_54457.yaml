answer: |-
  ### The Heterogeneity Problem: Desiderata for a Theory of Pleasure

  The heterogeneity problem arises from the intuition that the class of mental episodes we call "pleasures" lacks an obvious common denominator. The warmth of a bath, the satisfaction of a solved proof, and the relief of good news differ in phenomenology, intentionality, and causal role. To move beyond piecemeal refutations based on isolated counterexamples, a theory of pleasure must satisfy a comprehensive set of desiderata. The following criteria establish the conditions of adequacy for any account of the nature of pleasure.

  #### 1. The Phenomenological Desiderata

  **D1. The Constraint of Unnoticed Enjoyment (Absorption)**
  An adequate theory must account for pleasures experienced without concurrent introspective awareness. Consider a philosopher absorbed in writing or a musician in flow; they may only realize *upon reflection* that they were enjoying the activity.
  *   *Motivation:* This case challenges views that identify pleasure with a distinct, introspectable sensation. If pleasure is a "feeling tone," its absence from immediate awareness suggests either the pleasure was absent (counter-intuitive) or the theory of feeling is incorrect.
  *   *Requirement:* The account must allow for the existence of pleasure that is phenomenally real but not the object of attention.

  **D2. The Constraint of Temporal Extension (Anticipation and Memory)**
  An adequate theory must accommodate pleasures that are not confined to the present moment. We speak of the pleasure of *anticipating* a holiday and the pleasure of *reminiscing* about a past success.
  *   *Motivation:* These episodes often lack the immediate sensory input of the event itself. A theory tied strictly to concurrent sensory stimulation fails here.
  *   *Requirement:* The account must explain how pleasure attaches to temporal modes of presentation (future-directed or past-directed) without losing its identity as pleasure.

  **D3. The Constraint of Mixed Affect (Guilty and Bittersweet Pleasures)**
  An adequate theory must explain cases where pleasure co-exists with, or seems constituted by, unpleasantness. In "guilty pleasures" or tragic art, the negative valence (shame, sadness) appears partly constitutive of the overall positive experience.
  *   *Motivation:* Simple hedonic summation models struggle here. If pleasure is a positive quantity and pain a negative one, they should cancel out. Yet, the complexity of the experience suggests a structural integration rather than arithmetic subtraction.
  *   *Requirement:* The account must allow for negative valences to be internal to the structure of the pleasure, rather than merely external obstacles to it.

  #### 2. The Intentional and Structural Desiderata

  **D4. The Distinction between Pleasantness and Desirability**
  An adequate theory must distinguish *feeling pleasant* from *being wanted*. One can want something that is not pleasant (e.g., a necessary medicine) and find something pleasant that one does not want (e.g., a third slice of cake one is trying to avoid).
  *   *Motivation:* This guards against reducing pleasure to a motivational state or a disposition to choose.
  *   *Requirement:* The account must treat hedonic tone as distinct from incentive salience or volition.

  **D5. The Intentional Scope Constraint (Sensory vs. Propositional)**
  An adequate theory must cover both sensory pleasures (the taste of wine, the warmth of a bath) and propositional pleasures (being pleased *that* a friend recovered).
  *   *Motivation:* Sensory pleasures often appear non-intentional (or have diffuse objects), while propositional pleasures are explicitly about states of affairs. A theory that works only for one category commits a category error regarding the other.
  *   *Requirement:* The account must either provide a unified genus covering both or explicitly justify a disjunctive taxonomy without losing the term's utility.

  #### 3. The Empirical and Metaphysical Desiderata

  **D6. The Empirical Dissociation Constraint (Liking vs. Wanting)**
  An adequate theory must be consistent with neuroscientific evidence dissociating 'liking' (hedonic impact) from 'wanting' (incentive salience). Research (e.g., Berridge et al.) shows these systems can be independently manipulated in the brain.
  *   *Motivation:* Philosophical conflation of pleasure with desire is empirically falsifiable.
  *   *Requirement:* The account must locate pleasure on the 'liking' side of this dissociation, ensuring it is not defined by motivational output.

  **D7. The Metaphysical Unity Constraint (Reductive vs. Disjunctive)**
  An adequate theory must specify whether pleasure is a natural kind (requiring a single reductive essence) or a family resemblance concept (allowing disjunction).
  *   *Motivation:* If pleasures share nothing but the label, the "nature of pleasure" is a pseudo-problem. If they share an essence, the heterogeneity must be explained away.
  *   *Requirement:* The account must declare its metaphysical commitment. If disjunctive, it must explain what justifies grouping the disjuncts under "pleasure." If reductive, it must identify the common property.

  ---

  ### Critical Tensions: Incompatible Desiderata?

  In constructing your background chapter, you should highlight that these desiderata may not be jointly satisfiable. There are at least two significant tensions that suggest a trade-off is necessary.

  **Tension 1: Phenomenal Unity (D7) vs. Unnoticed Enjoyment (D1)**
  If one insists on a strong **Metaphysical Unity Constraint** (that there is a single, shared phenomenal quality across all pleasures), it becomes difficult to satisfy the **Constraint of Unnoticed Enjoyment**. If pleasure is a specific "feel," it is unclear how one can undergo that feel without noticing it, unless one posits a subconscious sensation. However, positing subconscious sensations risks making the theory unfalsifiable. Conversely, if one satisfies D1 by making pleasure an attitude (which can be unconscious), one risks violating the intuition of Phenomenal Unity, as attitudes toward different objects (bath vs. proof) do not obviously share a phenomenal quality.

  **Tension 2: Intentional Scope (D5) vs. Phenomenal Salience**
  Satisfying the **Intentional Scope Constraint** requires a theory to cover both raw sensory feels and complex propositional attitudes. However, raw sensory pleasures often lack the cognitive structure required for propositional attitudes, while propositional pleasures often lack the sensory "punch" of bodily pleasures. A theory that unifies them (e.g., by claiming all pleasure is propositional) risks distorting the phenomenology of sensory pleasure (D5). A theory that prioritizes sensory phenomenology risks excluding the cognitive nature of propositional pleasure. Satisfying D5 fully may require abandoning the search for a single phenomenological essence.

  ---

  ### The Exclusionary Desideratum

  Of the criteria listed, **D1 (The Constraint of Unnoticed Enjoyment)** is the single desideratum that excludes the most prominent historical accounts, specifically the **Shared Phenomenal Quality (Feeling Theory)** account.

  *   **Why it excludes the Feeling Theory:** The classic view (e.g., early Brentano, Mill, Sidgwick) posits that pleasure is a distinct sensation or feeling-tone accompanying experiences. By definition, sensations are objects of awareness. If one is not aware of the sensation, the sensation is not occurring. Therefore, if unnoticed enjoyment is possible (as absorption cases suggest), pleasure cannot be a sensation.
  *   **Why it is less exclusionary for others:** Attitudinal theories (pleasure as pro-attitude) and Propositional theories (pleased that *p*) can accommodate unnoticed pleasure more easily, as one can hold an attitude or be in a state of affairs without actively introspecting it.

  *Note:* While D6 (Liking/Wanting) excludes Motivational/Desire theories, the Feeling Theory has historically been the dominant default in the heterogeneity debate. D1 is the primary wedge used to force the shift from Feeling to Attitudinal theories.

  ---

  ### Brief Assessment of Contenders

  In your thesis, you will evaluate these fully, but for the background chapter, their standing relative to the desiderata is as follows:

  1.  **Shared Phenomenal Quality (Feeling Theory):** Fails **D1 (Unnoticed Enjoyment)**. It struggles to explain how a specific feeling can exist without introspection. It also struggles with **D5 (Intentional Scope)**, as it reduces propositional pleasure to a feeling accompanying a thought, which often misdescribes the cognitive nature of the pleasure.
  2.  **Pleasure as Being Pleased That (Propositional Attitude Theory):** Fails **D5 (Intentional Scope)** regarding sensory pleasure. It is difficult to parse the pleasure of a massage or a taste as a pro-attitude toward a proposition (e.g., "I am pleased that my skin is warm"). It risks over-intellectualizing non-cognitive experiences.
  3.  **Attitude of Enjoyment (Attitudinal Theory):** Currently the strongest contender. It satisfies **D1** (attitudes need not be introspected) and **D6** (distinguishes liking from wanting). However, it faces pressure from **D3 (Mixed Affect)**; explaining how a pro-attitude can incorporate unpleasantness without contradiction remains a significant challenge. It also risks being too permissive, potentially classifying non-hedonic approvals as pleasures.

  **Recommendation for the Chapter:** Use these desiderata not merely as a checklist, but as a map of the philosophical space. The tensions between them (particularly D1 and D5) reveal why the heterogeneity problem remains unresolved: satisfying one constraint often forces a violation of another. Your thesis can then position its own argument as the one that best navigates these specific trade-offs.
