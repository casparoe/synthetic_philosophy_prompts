answer: |-
  ### The Counter-Silence Triage Protocol

  **Time:** 20 Minutes
  **Tools:** Pen, existing collection inventory (to check redundancy), phone (for quick donor queries).
  **Goal:** Prevent the archive from becoming a storage unit for the already-powerful.

  **Step 1: The Hazard Hard-Stop (3 Minutes)**
  *   **Question:** Is there active mold, pests, wetness, or weapons/ammunition mixed in?
  *   **Good Enough Answer:** A visual sniff-test. If you can smell the mold or see the bugs, the answer is Yes.
  *   **Decision:**
      *   **Yes:** **AUTO-NO.** (Do not bring this into the building. It threatens the existing 200 feet.) *Exception: Escalate to Board only if the donor offers specific remediation funding.*
      *   **No:** Proceed to Step 2.

  **Step 2: The Redundancy Audit (5 Minutes)**
  *   **Question:** Do we already hold the records of this *function* or *class* of person?
  *   **Good Enough Answer:** Check your inventory. Do you have 10 boxes of judges? 5 boxes of 19th-century social clubs?
  *   **Decision:**
      *   **Yes (Redundant):** Proceed to Step 3.
      *   **No (Unique):** Proceed to Step 3.

  **Step 3: The Power Inversion (5 Minutes)**
  *   **Question:** Does this collection document a group currently silenced or under-represented in our holdings (immigrants, labor, minorities, dissenters) OR does it document a group already over-represented (elites, officials, founders)?
  *   **Good Enough Answer:** Be honest. If the donor's name is on a building downtown, they are over-represented. If the donor is a grandchild finding a box in a garage, they are likely under-represented.
  *   **Decision:**
      *   **Over-represented + Redundant (Step 2 Yes):** **AUTO-NO.** (You cannot afford to store more of what you already have.)
      *   **Under-represented:** Proceed to Step 4.
      *   **Over-represented + Unique Function:** Proceed to Step 4.

  **Step 4: The Access Cost (7 Minutes)**
  *   **Question:** Can a volunteer or you make this searchable in under 20 hours?
  *   **Good Enough Answer:** Glance at the order. Is it boxed by year? Or is it a slurry of loose receipts requiring item-level logging?
  *   **Decision:**
      *   **Yes:** **ACCEPT.**
      *   **No:** **ESCALATE.** (Hand to Archivist/Board. This is a values question: Is this story worth the labor budget?)

  ***

  ### Application to Current Cases

  **Case 1: The Retired Judge**
  *   **Step 1 (Hazard):** No. Meticulously organized.
  *   **Step 2 (Redundancy):** Yes. You already have papers from three other county judges and the bar association.
  *   **Step 3 (Power):** Over-represented. He is the definition of the "powerful and tidy."
  *   **Step 4 (Cost):** N/A (Failed Step 3).
  *   **Procedure Verdict:** **AUTO-NO.**
  *   **Why I Won't Like This:** This is the socially dangerous outcome. The Judge is a living community power-broker. Telling him "No" risks future donations, board relations, and your own professional comfort. It feels rude to reject the "best" material, even if the procedure proves it's the "wrong" material for a balanced record.

  **Case 2: The Immigrant Social Club**
  *   **Step 1 (Hazard):** Yes. Moldy box found in a garage.
  *   **Step 2 (Redundancy):** No. You have nothing from this community.
  *   **Step 3 (Power):** Under-represented. High ethical value.
  *   **Step 4 (Cost):** N/A (Failed Step 1).
  *   **Procedure Verdict:** **ESCALATE.**
  *   **Rationale:** The procedure stops you from bringing mold into the archive (safety), but flags the content as critical. You must go to the Board and say: "This box is a health risk, but it is the only voice we have for this community. We need $500 for conservation or we throw away history."

  **Case 3: The Sheriff's Surveillance Records**
  *   **Step 1 (Hazard):** No.
  *   **Step 2 (Redundancy):** No. You have official reports, but not surveillance/raw data.
  *   **Step 3 (Power):** Over-represented (State Power), but Unique Function (Accountability).
  *   **Step 4 (Cost):** No. Surveillance logs require heavy redaction for privacy (FOIA/ethical review).
  *   **Procedure Verdict:** **ESCALATE.**
  *   **Rationale:** This is a values question, not a records question. Keeping this holds power accountable (good), but risks legal liability and donor relationships (bad). The Board must decide if they want to be an archive or a safe harbor.

  ***

  **Guiding Rule:** Prioritize the underdocumented function over the overdocumented status.
