      *Refining the Requirements:*
      1.  **Dual Comparability (Levels & Increments):** Non-negotiable. Prioritarianism weights gains *according to* levels. You need both structures.
      2.  **Ratio-Scale Gains:** Non-negotiable. To say a benefit counts for *more*, you need to measure the magnitude of the benefit across persons. Ordinal ranking of gains is insufficient for weighting functions.
      3.  **Normalized Intensity:** Non-negotiable. Self-reports suffer from adaptation (the back pain case). The theory must provide a calibration mechanism independent of raw subjective scores.
      4.  **Temporal Integration:** Non-negotiable. Comparing hospice (short term) to pediatric (long term) requires integrating welfare over time, not just snapshot intensity.
      5.  **Aggregability:** Non-negotiable. Must resolve trade-offs between many small gains and one large loss (the agony case).

      *The Tension:*
      Economists reject IUCs because utility is ordinal and subjective. Prioritarianism requires cardinal and objective comparisons. You cannot have both full individual sovereignty (your report is final) and objective prioritization. The theory must privilege an objective metric of welfare over idiosyncratic self-assessment.

      *The Three Views:*
      Hedonic: Meets cardinality/time, struggles with non-pain goods.
      Harsanyi: Meets objectivity, too abstract for clinical budgeting.
      Ordinal: Fails the math of prioritarianism.

      *Word Count Management:*
