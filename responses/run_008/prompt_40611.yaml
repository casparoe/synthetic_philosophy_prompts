answer: |-
  To operationalize prioritarianism for budget allocation, your theory of interpersonal utility comparisons (IUCs) must satisfy specific structural demands. Below are the desiderata, distinguished by whether they are non-negotiable for your purpose or philosophically contentious.

  **1. Dual Comparability (Levels and Increments)**
  *Requirement:* The theory must permit comparisons of both absolute welfare levels (who is worse off) and welfare increments (who gains more).
  *Case:* Prioritarianism weights benefits according to the recipient's prior level. You cannot identify the "worse off" hospice patient without level comparisons, nor calculate the "benefit" of a hip replacement without increment comparisons.
  *Status:* **Non-negotiable.** A theory offering only one structure fails the prioritarian calculus.

  **2. Ratio Comparability of Gains**
  *Requirement:* Gains must be comparable on a cardinal scale across persons, allowing for ratios (e.g., Person A's gain is twice Person B's).
  *Case:* To say benefits to the worse off "count for more," you must measure the magnitude of the benefit to apply the priority weight. Merely ranking gains (ordinal) is insufficient for weighting.
  *Status:* **Non-negotiable.** Ordinal structures cannot support the mathematical operation of priority weighting.

  **3. Calibrated Intensity (Overriding Idiosyncrasy)**
  *Requirement:* The theory must normalize subjective reports to account for adaptation and scale usage differences.
  *Case:* Consider the back pain patients: one rates pain 10/10, another 3/10, despite similar conditions. If you fund based on raw scores, you reward adaptation or expressive style rather than need.
  *Status:* **Non-negotiable.** Reliance on uncalibrated self-reports violates the objective fairness required for public budgeting.

  **4. Temporal Integration**
  *Requirement:* Welfare must be aggregable over time, not limited to momentary intensity.
  *Case:* Comparing hospice care (intense, short duration) to pediatric prevention (moderate impact, lifelong duration) requires a metric that integrates intensity over a life span.
  *Status:* **Non-negotiable.** Snapshot comparisons would systematically bias against preventive care.

  **5. Aggregability**
  *Requirement:* The theory must resolve trade-offs between many small gains and one large loss.
  *Case:* Small relief for many versus agony spared for one. A prioritarian view usually favors the agony spared, but only if the theory allows summing weighted utilities to compare total moral value.
  *Status:* **Non-negotiable.** Budgeting requires choosing one portfolio over another; non-aggregable views lead to paralysis.

  **The Incompatibility Warning**
  You asked whether objectivity can coexist with individualist constraints. Plainly: **No, not fully.** Standard economics rejects IUCs because utility is viewed as ordinal and sovereign to the individual's preferences. Prioritarianism requires utility to be cardinal and objectively comparable. To satisfy the non-negotiables above, your theory must bite the bullet: it must assert an objective metric of welfare (e.g., hedonic tone or capability function) that overrides idiosyncratic preference reports when they conflict. You cannot have full respect for individual subjective sovereignty and also have a workable prioritarian budget model. You must choose objective comparability over strict preference sovereignty.

  **Evaluation of Candidate Pictures**
  A **hedonic common-scale view** meets the cardinality and temporal requirements well, particularly for pain management, but struggles to capture the value of mobility or prevention where pleasure is not the sole metric. **Harsanyi's extended-preferences view** secures objectivity by asking what rational agents would choose behind a veil of ignorance, satisfying the calibration requirement, but it is too abstract for clinical operationalization and may ignore actual suffering. A **rough ordinal view** fails immediately; it cannot support the weighting function required by prioritarianism, rendering your budget rule mathematically incoherent. For your purpose, a calibrated hedonic or capability-based cardinal model is the only viable path, despite its philosophical cost.
