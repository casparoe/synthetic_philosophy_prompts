prompt: |-
  I'm a program officer at a grantmaking foundation that can support roughly a dozen philosophers and decision theorists for five years on work connected to the longtermism debate. The trustees already accept what people in this literature call weak longtermism — future people count morally, and their interests count as much as ours — so I don't need papers re-litigating that. The live question is strong longtermism: the claim that positively influencing the long-term future is, in expectation, the most important thing we could do, dominating in scale anything we could accomplish for the present generation. I want a dependency-aware prioritization of the open questions whose resolution would most change where the foundation's money should actually go.

  Please rank roughly six to eight questions. Candidates, though you should add or subtract: whether expected-value reasoning under deep moral uncertainty really supports the dominance claim, or whether it only supports it if you already accept aggregation across lives; Greaves-style cluelessness about the long-run effects of present actions, and whether it undermines the case for the strong view, the case against it, or symmetrically both; how much of the argument turns on the population axiology — in particular whether the asymmetry between creating happy and creating miserable lives is doing unacknowledged work that would embarrass the argument if made explicit; the hingeyness question of whether the present is genuinely unusual in the leverage it affords over the long run, or whether that's an artifact of storytelling about existential risk; and whether non-consequentialist side constraints, even at modest weights, can break the dominance of the long-term stakes.

  For each question, tell me: why it's upstream of the others, whether it's tractable with philosophical methods rather than empirical forecasting, and — this is the distinction I care about most — whether resolving it would change the actual allocation or merely change the justification for an allocation the foundation would make anyway. Several familiar objections to strong longtermism, like fanaticism worries and aggregation complaints, look as if they'd change the verdict when they'd really only change the story we tell about it; I want the ranking to sort the questions accordingly. Also flag which of the questions I listed you'd deprioritize outright and why.

  Since a ranking like this is mostly judgment laid over a few fixed points, close by saying explicitly what argument or consideration would most move you to a different ordering, and where in your own reasoning you think you're most likely to be wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested prioritization:

  1.  **Analyze the Request:**
      *   **Role:** Program Officer at a grantmaking foundation.
      *   **Budget/Capacity:** Support ~12 philosophers/decision theorists for 5 years.
      *   **Context:** Trustees accept *Weak Longtermism* (future people count equally).
      *   **Goal:** Prioritize open questions regarding *Strong Longtermism* (influencing the long-term future is the *most* important thing we can do, dominating present concerns).
      *   **Output:** Rank 6-8 questions.
      *   **Criteria per Question:**
          *   Upstream dependency (why it comes first).
          *   Tractability (philosophical vs. empirical).
          *   *Crucial:* Action-guidingness (does resolving it change allocation vs. just justification?).
      *   **Specific Candidates to Consider/Modify:** Expected value under moral uncertainty, Greaves-style cluelessness, Population axiology (asymmetry), Hingeyness (present leverage), Non-consequentialist constraints.
      *   **Exclusion Criteria:** Flag questions to deprioritize (e.g., objections that change the story but not the verdict).
      *   **Closing:** Explicitly state what would change the ordering and where the reasoning is most vulnerable.

  2.  **Deconstruct "Strong Longtermism":**
      *   Strong Longtermism (SL) = The claim that the *expected* value of influencing the long-term future dominates the expected value of near-term concerns.
      *   Formulaically: $EV(Longterm) \gg EV(Shortterm)$.
      *   Drivers of this inequality:
          1.  *Scale:* Number of future lives (Population Axiology).
          2.  *Probability:* Chance of affecting that future (Hingeyness/Tractability).
          3.  *Value:* Moral weight of those lives (Weak Longtermism is granted, but axiology matters for *total* value).
          4.  *Epistemology:* Can we know/estimate these values? (Cluelessness).
          5.  *Decision Theory:* How do we aggregate tiny probabilities of huge values? (Fanaticism/Expected Value).
          6.  *Normative Ethics:* Do side constraints block maximizing EV? (Deontology/Constraints).

  3.  **Evaluate Candidate Questions (Filtering for Action-Guidingness):**
      *   *Constraint:* The prompt warns against "justification changes" vs. "allocation changes." Many philosophical objections to Longtermism (e.g., "Aggregation is wrong") might lead a longtermist to say, "Okay, we'll use a different axiology but still focus on the future." I need to find questions where the answer actually shifts money *away* from longtermist causes (like AI safety, biosecurity) toward near-term causes (global health, policy reform) or vice versa.
      *   *Candidate 1: Aggregation/Fanaticism (Expected Value under Uncertainty).*
          *   If EV maximization is rejected (e.g., due to fanaticism), SL collapses. This changes allocation.
          *   *Verdict:* High priority.
      *   *Candidate 2: Cluelessness (Greaves).*
          *   If we can't know sign/magnitude, SL action guidance fails. But does it favor near-term? Often near-term is also clueless. Need to check if it's symmetric. If symmetric, it might not change allocation, just induce humility. If asymmetric (near-term less clueless), it changes allocation.
          *   *Verdict:* Medium-High, but needs nuance.
      *   *Candidate 3: Population Axiology (Asymmetry).*
          *   If we accept the Asymmetry (no duty to create happy lives, only duty not to create miserable ones), the "vast future" value drops precipitously. This directly attacks the *Scale* term.
          *   *Verdict:* High priority.
      *   *Candidate 4: Hingeyness.*
          *   Is *now* special? If not, maybe we should wait (investment) or focus on building capacity. If yes, spend now. This affects *timing* and *cause area* (existential risk vs. foundational research).
          *   *Verdict:* High priority.
      *   *Candidate 5: Non-consequentialist Constraints.*
          *   If rights/constraints block X-risk reduction (e.g., liberty restrictions), allocation changes. But most X-risk work is constraint-compatible.
          *   *Verdict:* Lower priority (often changes justification, not allocation).
      *   *Candidate 6: Moral Uncertainty (Aggregation across theories).*
          *   If we should hedge against non-longtermist theories, we might fund near-term.
          *   *Verdict:* Medium priority.

  4.  **Drafting the Ranking (Iterative Process):**

      *   *Top Tier (The Kill Switches):* These are questions where a "No" kills Strong Longtermism entirely.
          1.  **Population Axiology (The Asymmetry):** If the Asymmetry holds, the potential value of the future is bounded (only avoiding suffering matters, not creating happiness). This removes the "astronomical value" driver. *Action-guiding:* Yes, shifts focus to suffering-focused interventions or near-term.
          2.  **Decision Theory (Fanaticism/Aggregation):** SL relies on tiny probabilities of huge values. If expected value theory is rejected to avoid fanaticism, the math breaks. *Action-guiding:* Yes, shifts to robust/near-term interventions.

      *   *Second Tier (The Magnitude Adjusters):* These determine *how much* to spend, or *which* longtermist interventions.
          3.  **Cluelessness (Sign vs. Magnitude):** Greaves' objection. If we can't determine the *sign* of our impact, SL is paralyzed. If near-term is less clueless, money shifts. *Action-guiding:* Yes, potentially shifts to cause areas with more robust feedback loops.
          4.  **Hingeyness (Temporal Leverage):** Is *this* century the bottleneck? If not, the foundation should invest/preserve capital rather than spend on X-risk now. *Action-guiding:* Yes, changes spend-down rate and specific X-risk focus.

      *   *Third Tier (Refinements/Justification):*
          5.  **Moral Uncertainty (Hedging):** Even if SL is true, should we hedge? *Action-guiding:* Marginal shift (e.g., 10% to near-term).
          6.  **Non-Consequentialist Constraints:** Do rights block X-risk work? *Action-guiding:* Low, most X-risk work is permissible.
          7.  **Deprioritized:** "Aggregation complaints that only change the story." (As requested).

      *   *Refining the List to 6-8:*
          1.  Population Axiology (Asymmetry).
          2.  Decision Theory (Fanaticism/EV).
          3.  Cluelessness (Sign/Direction).
          4.  Hingeyness (Temporal Leverage).
          5.  Moral Uncertainty (Hedging).
          6.  Institutional/Epistemic Tractability (Can institutions actually steer the future?).
          *   *Deprioritize:* Pure deontological constraints (unless they specifically target X-risk tech), and "Aggregation complaints" that don't touch the math.

  5.  **Fleshing out the Details (per prompt requirements):**
      *   For each: Upstream? Tractable? Allocation vs. Justification?
      *   *Self-Correction on Tractability:* Can philosophers actually solve Population Axiology in 5 years? Maybe not "solve," but map the cost of accepting specific views. Same for Fanaticism. The prompt asks if it's tractable with *philosophical methods* (not empirical forecasting). Yes, these are conceptual.
      *   *Self-Correction on Allocation:* Be sharp here. If the answer to Axiology is "Total Utilitarianism," allocation stays. If "Asymmetry," allocation shifts to suffering-focused or near-term. This is a real switch.

  6.  **Addressing the "Deprioritize" Instruction:**
      *   The prompt specifically mentions: "Several familiar objections... look as if they'd change the verdict when they'd really only change the story."
      *   I need to explicitly call out things like "General Aggregation Complaints" that don't specify *which* axiology replaces them. Or "Rights-based objections" that are easily sidestepped by longtermist interventions (e.g., AI safety doesn't necessarily violate rights).

  7.  **Closing Reflection:**
      *   What would change my mind? Empirical evidence that the future is *not* vast (e.g., great filter is behind us). Or a decision theory that preserves EV but blocks fanaticism without killing SL.
      *   Where am I wrong? Assuming philosophers can make progress on these in 5 years. These are centuries-old problems. Maybe the funding should go to *applied* work, not *foundational* work. I need to acknowledge this risk.

  8.  **Final Review against Constraints:**
      *   6-8 questions? (I'll aim for 6 core + 2 deprioritized/explained).
      *   Upstream/Tractable/Allocation distinction clear?
      *   Ranking logic sound?
      *   Closing reflection included?

      *(Self-Correction during drafting)*: I need to make sure I distinguish between "Cluelessness about magnitude" (doesn't stop SL) and "Cluelessness about sign" (stops SL). Greaves emphasizes the latter. I will focus on the *Sign* problem.

      *(Refining the Hingeyness point)*: It's not just "is now special," it's "is now special *relative to investment*?" If we can invest at 5% real return, the future is richer. Hingeyness must overcome the investment argument. This is a philosophical/decision-theoretic point about discounting and leverage.

      *(Refining the Axiology point)*: The prompt mentions the asymmetry specifically. I should center that.

      *(Refining the "Allocation vs Justification")*: This is the hardest part. For example, if we reject Aggregation, do we stop funding AI safety? Maybe we switch to "Suffering-Focused AI Safety." That's an allocation change. If we reject EV maximization, do we switch to "Maximin"? That shifts money to preventing worst-case scenarios (still X-risk) but maybe different *types*. I need to be precise. The strongest allocation shift comes from Axiology (Future matters less) and Cluelessness (We can't help the future).

      *Let's finalize the list:*
      1. Population Axiology (Asymmetry).
      2. Decision Theory (Fanaticism/EV).
      3. Cluelessness (Sign).
      4. Hingeyness (vs. Investment).
      5. Moral Uncertainty (Hedging).
      6. Institutional Capacity (Steering).
      Deprioritized: General Deontology, "Aggregation is weird" (without alternative).

      *Wait, one more check on "Tractability".* Is Population Axiology tractable? Philosophers have worked on it for 40 years with no consensus. Is it wise to fund 12 people for 5 years? The prompt asks me to prioritize *questions*, implying I *am* funding the work. I should note the risk that these might be intractable, but rank them by *value of resolution*.

      *Okay, ready to write.*
answer: |-
  This prioritization is designed to maximize the expected value of your five-year research program by targeting the "kill switches" and "levers" of Strong Longtermism (SL). The ranking distinguishes between questions that, if resolved negatively, would force a reallocation of capital away from longtermist causes (e.g., existential risk reduction), versus those that would merely require a rhetorical shift in how the foundation justifies its existing portfolio.

  Here are the six prioritized questions, followed by two deprioritized candidates.

  ### 1. The Population Axiology Question (The Asymmetry)
  **The Question:** Does the moral value of the future depend on the *total* sum of well-being (Total Utilitarianism), or is there a fundamental asymmetry where we have no duty to create happy lives, only to avoid creating miserable ones (The Asymmetry/Person-Affecting Views)?
  *   **Upstream Dependency:** This is the primary driver of the "Scale" term in the Longtermist equation. If the Asymmetry holds, the potential value of the long-term future is bounded (limited to preventing suffering) rather than astronomical (including created happiness). This drastically reduces the expected value of existential risk reduction compared to near-term suffering alleviation.
  *   **Tractability:** High philosophical tractability. This is a conceptual problem regarding intuitions about creation and harm. While consensus is elusive, mapping the specific costs of accepting the Asymmetry (e.g., the "Repugnant Conclusion" vs. the "Sadistic Conclusion") is work for moral philosophers, not empirical forecasters.
  *   **Allocation vs. Justification:** **Allocation.** If the Asymmetry is vindicated, the "astronomical value" argument for prioritizing X-risk over global health collapses. The foundation would likely shift significant resources toward suffering-focused interventions or near-term welfare, as the leverage over *potential* lives diminishes.

  ### 2. The Decision-Theoretic Question (Fanaticism and Aggregation)
  **The Question:** Does expected value (EV) maximization remain the correct decision rule when dealing with tiny probabilities of infinite or astronomical value, or must we adopt a view (e.g., bounded utility, risk-weighted utilitarianism) that blocks "fanaticism"?
  *   **Upstream Dependency:** SL relies on the claim that a small reduction in existential risk has higher EV than saving lives today because the future is vast. This requires aggregating tiny probabilities across huge stakes. If EV maximization is rejected to avoid fanaticism, the mathematical dominance of the long-term future disappears.
  *   **Tractability:** High philosophical tractability. This is a problem in formal decision theory and normative ethics. Recent work (e.g., by Beckstead, Thomas, Isaacs) suggests progress is possible in defining "recklessness" vs. "fanaticism."
  *   **Allocation vs. Justification:** **Allocation.** If EV maximization is rejected, the foundation cannot justify spending millions on low-probability X-risk mitigation over high-probability near-term aid. It would force a shift toward "robust" interventions with more certain, albeit smaller, payoffs.

  ### 3. The Epistemic Question (Cluelessness about Sign)
  **The Question:** Is our ignorance regarding the long-term consequences of present actions symmetric (we don't know how *much* good we do) or asymmetric (we don't know *whether* we do good or harm)? Specifically, does "Greaves-style cluelessness" undermine the claim that X-risk reduction is positive in expectation?
  *   **Upstream Dependency:** This targets the "Probability" and "Value" terms. If we cannot determine the *sign* of our impact on the long-term future (e.g., does averting extinction lock in a bad trajectory?), then the EV of longtermist interventions is undefined or zero.
  *   **Tractability:** Medium philosophical tractability. This requires analyzing the structure of causal chains and moral epistemology. It is not an empirical forecasting question but a question about the limits of moral knowledge under complexity.
  *   **Allocation vs. Justification:** **Allocation.** If cluelessness is symmetric, it applies to near-term interventions too, so allocation might stay put. However, if long-term interventions are *more* clueless than near-term ones (plausible), resolving this would shift funds toward cause areas with shorter feedback loops and more legible impact (e.g., policy reform over foundational AI safety).

  ### 4. The Temporal Leverage Question (Hingeyness vs. Investment)
  **The Question:** Is the present century uniquely "hingey" (affording high leverage over the future), or is the apparent urgency an artifact of discounting? Should we instead preserve capital to spend when leverage is higher or needs are clearer?
  *   **Upstream Dependency:** This determines the *timing* of expenditure. SL claims we must act *now*. If the "Investment Argument" holds (we can grow resources faster than X-risk rises), the optimal strategy is endowment building, not grantmaking.
  *   **Tractability:** Medium philosophical/decision-theoretic tractability. It involves modeling leverage, discount rates, and the trajectory of technological power. It is not purely empirical; it requires a theoretical framework for comparing leverage across centuries.
  *   **Allocation vs. Justification:** **Allocation.** A verdict favoring the "Investment View" would stop the foundation from spending down its capital on current X-risk projects. It would shift the allocation toward asset management and institutional preservation, fundamentally changing the foundation's operational mode.

  ### 5. The Moral Uncertainty Question (Hedging)
  **The Question:** Given non-negligible credence in non-longtermist moral theories (e.g., common-sense morality, prioritarianism), does normative hedging require a substantial allocation to near-term concerns even if SL is objectively true?
  *   **Upstream Dependency:** This operates at the meta-ethical level. Even if SL is the "correct" theory, the foundation operates under uncertainty. If the "cost" of being wrong about SL is catastrophic (e.g., neglecting the present generation), hedging may be required.
  *   **Tractability:** High philosophical tractability. This is a standard problem in the literature on moral uncertainty (e.g., MacAskill, Byrd).
  *   **Allocation vs. Justification:** **Marginal Allocation.** This is unlikely to overturn the portfolio but would dictate the "margin." It might move 10–20% of funds to global health or animal welfare as a hedge, rather than 100% to X-risk. It changes the mix, not the core mission.

  ### 6. The Institutional Steering Question (Tractability of Influence)
  **The Question:** Are there plausible mechanisms by which current actors can reliably steer the long-term future, or is the future primarily determined by structural forces beyond the influence of grantmaking?
  *   **Upstream Dependency:** This targets the "Tractability" term. If the future is path-dependent but chaotic (sensitive to initial conditions we can't control), then influencing it is impossible. If it is determined by structural laws (e.g., economic growth), grantmaking may be impotent.
  *   **Tractability:** Low philosophical tractability, high interdisciplinary risk. This bleeds into social science. However, the *conceptual* mapping of "influence" (e.g., locking in values vs. delaying technology) is philosophical.
  *   **Allocation vs. Justification:** **Allocation.** If steering is deemed impossible, the foundation should cease "shaping" interventions (e.g., value lock-in) and perhaps focus only on "delaying" interventions (e.g., biosecurity) or dissolve. It determines *which* longtermist interventions are funded.

  ***

  ### Deprioritized Questions

  **A. General Non-Consequentialist Side Constraints**
  *   **Why Deprioritize:** You asked to flag questions that change the story but not the verdict. Most objections based on rights or deontology (e.g., "We shouldn't violate liberty to reduce X-risk") can be sidestepped by longtermist interventions that are constraint-compatible (e.g., defensive biosecurity, AI alignment research). Unless the research specifically targets constraints that *uniquely* block X-risk reduction (which is rare), resolving this will likely just change the *justification* for the same allocation.
  *   **Verdict:** Justification only.

  **B. "Aggregation is Counterintuitive" (Without Alternative Axiology)**
  *   **Why Deprioritize:** Many philosophers argue that aggregating well-being across lives is wrong. However, without a specific alternative axiology (like the Asymmetry in #1), this is just a vibe. If the alternative is "help those in front of you," that's a substantive claim covered by Axiology and Moral Uncertainty. Funding work that merely reiterates that aggregation is weird without proposing a decision-guiding alternative is low-value.
  *   **Verdict:** Justification only.

  ***

  ### Reflection on the Ranking

  **What argument would most move me to a different ordering?**
  I would reorder **Question 3 (Cluelessness)** to the top spot if I were convinced that the *sign* of longtermist interventions is not just unknown, but likely negative. Currently, I rank Axiology (#1) higher because even if we *can* influence the future (Cluelessness resolved), the future might not contain the astronomical value required to dominate the present (Axiology). However, if a strong argument emerged that "trying to help the long-term future systematically makes it worse" (e.g., via lock-in of bad values), Cluelessness becomes the immediate kill switch, surpassing Axiology.

  **Where is my reasoning most likely to be wrong?**
  I am likely overestimating the **Tractability** of Questions 1 and 2. Population axiology and decision-theoretic fanaticism are centuries-old problems with entrenched stalemates. Funding 12 philosophers for 5 years may not yield resolution, only further refinement of the deadlock. If these problems are intractable on this timescale, the "Value of Information" for this grant program drops precipitously. In that case, the ranking should shift toward **Question 6 (Institutional Steering)** or empirical-adjacent work, as understanding *how* to influence the future might be more actionable than settling *why* we should, even under uncertainty. I am betting that conceptual clarity on the "kill switches" is valuable even without final resolution, but that is a risk.
