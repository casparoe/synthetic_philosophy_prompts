isagreement actually lives — my current theory is that it's not about mathematics at all but about how much weird consequences are allowed to count as evidence against an axiom, i.e. whether "this implies a decomposition of the sphere into finitely many pieces and two copies of the sphere" is a cost or just a curiosity — and tell me which term of your own decomposition you're least confident in and what would actually move it. And if your real view is that it's all stipulation and truth doesn't apply here, fine, I've heard that at enough dinner parties, but then assign a probability to THAT view being right and run the decomposition through it anyway.
