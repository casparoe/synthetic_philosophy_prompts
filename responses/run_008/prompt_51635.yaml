      *   *Dennett:* Intentionality is a matter of perspective (The Intentional Stance). If predicting a system's behavior by treating it as a rational agent with beliefs/desires works, then it *has* beliefs/desires. No hard line between original and derived. Evolution gives us our intentionality, which is also "derived" in a sense.
