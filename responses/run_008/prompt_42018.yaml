      *(Self-Correction on "Natural Answer")*: I must be careful not to say 1/2 is objectively true in a vacuum. It is "natural" only under the assumption that the method of drawing chords should not depend on the size or position of the circle. This is a physical/structural assumption, not a purely mathematical one. I will frame it as "The Jaynesian Resolution."

      *(Final thought on Marcus's Cube)*: Marcus is essentially citing Keynes's *A Treatise on Probability*. This is a very strong move. I should acknowledge that.

