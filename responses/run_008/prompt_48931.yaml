  Right, let's get stuck into this. You've stumbled on one of the proper big debates in political philosophy, and the reason it's confusing is that the sentence you were given is doing a lot of heavy lifting. It sounds like one idea, but it's actually a umbrella for three or four different arguments that lead to very different places.

  The sentence is: **"Benefiting people matters more the worse off they are."**

  Here is the breakdown of the distinct claims hidden inside that sentence, ranked from "obvious fact" to "radical moral demand". I've kept the language plain, but I haven't skimped on the logic.

  ### 1. The Economic Platitude (Diminishing Marginal Utility)
  **The Claim:** This isn't a moral rule at all; it's just a fact about how money works. A hundred quid keeps a skint family fed for a week; to a millionaire, it's a rounding error they won't notice. Therefore, moving money from rich to poor increases the total amount of happiness or "wellbeing" in the system, even if some leaks out on the way.

  *   **Is it plausible?** Yes, highly. It's hard to argue that £1,000 means as much to Elon Musk as it does to a single parent on universal credit.
  *   **Does it support the tax (with leakage)?** Only up to a point. If the leakage is too high (e.g., you tax £1bn but only £200m reaches the poor), the total wellbeing might still drop. You have to do the maths.
  *   **Does it avoid the "leveling down" problem?** Yes. This view only cares about total wellbeing. Making a rich person poorer without helping anyone else reduces total wellbeing, so this view says that's bad.
  *   **Does it force the "strict queue"?** No. You just add up the total good. If helping a million slightly poor people creates more total good than helping one very poor person, you help the million.
  *   **Definition of "Worse Off":** **Absolute.** It's about having enough for food, shelter, and security. Once you have enough, the extra money matters less.

  ### 2. The Moral Weighting (Prioritarianism)
  **The Claim:** This is the one the first guy was likely pushing. It says that even if the *amount* of happiness gained was the same, the benefit counts for **more** morally if it goes to a worse-off person. It's not just that money buys more food for the poor (Claim 1); it's that society has a special duty to lift the bottom up. We apply a "weighting" to their gains.

  *   **Is it plausible?** It matches most people's moral intuitions (saving a drowning child matters more than buying a yacht), but it's harder to prove than Claim 1. It's a value judgement, not a fact.
  *   **Does it support the tax (with leakage)?** Yes, strongly. Because the moral value of the money landing in poor hands is weighted higher, you can afford to lose more of it in transit (lawyers' fees, inefficiency) and still come out ahead morally.
  *   **Does it avoid the "leveling down" problem?** Yes. This is the key selling point. Unlike pure egalitarianism, this view requires someone to actually *benefit*. If you just burn the rich person's money and nobody gains, no "benefit" has occurred, so nothing good has happened.
  *   **Does it force the "strict queue"?** No. It says the worse off matter *more*, not *exclusively*. You balance the number of people helped against how badly off they are.
  *   **Definition of "Worse Off":** **Relative.** You are worse off compared to others in society. It's about your share of the pie, not just whether you're starving.

  ### 3. The Strict Priority (Leximin)
  **The Claim:** This is the radical reading the third guy pushed. It says the interests of the very worst-off person **always** trump everyone else's, no matter what. Even if you could give a tiny benefit to the single poorest person on earth, you must do that before you can spend a penny on fixing moderate problems for a million other people.

  *   **Is it plausible?** Most people find this implausible when pushed. If the poorest person needs a gold-plated wheelchair but a million others need clean water, strict priority says buy the wheelchair first. That seems mad.
  *   **Does it support the tax (with leakage)?** Yes, but it's overkill. It would justify almost any tax rate as long as the very bottom person gains even a penny.
  *   **Does it avoid the "leveling down" problem?** Yes, because it still requires a benefit to the worst-off.
  *   **Does it force the "strict queue"?** Yes. That is literally what this claim is.
  *   **Definition of "Worse Off":** **Absolute Bottom.** It focuses on the single individual or group at the very bottom of the heap.

  ---

  ### The "Leveling Down" Objection Explained
  You mentioned the bit about "making a rich person poorer while nobody gains anything." This is the classic trap of **Egalitarianism**.

  If your only goal is *Equality*, then a world where everyone is equally poor is better (in terms of equality) than a world where some are rich and some are poor. That's the "leveling down" objection: it implies destruction of value is good if it makes things fairer.

  The sentence you were given ("Benefiting people matters more...") escapes this trap because of the word **"Benefiting"**.
  *   **Egalitarianism:** "Inequality is bad." (So leveling down reduces badness).
  *   **The Sentence (Prioritarianism):** "Benefiting the worse-off is good." (So leveling down creates no good, because no one benefited).

  The first guy was right that this sentence avoids the madness of caring about equality for its own sake. It cares about *helping*, not just *levelling*.

  ---

  ### The "Worse Off" Problem (Time and Comparison)
  You asked a cracking question: *Worse off than who? And when?* This is where the argument often falls apart if people aren't careful.

  **1. Relative vs. Absolute**
  *   **Claim 1 (Utility)** usually relies on an **Absolute** standard. Does this person have enough to eat? If yes, the extra money matters less.
  *   **Claim 2 (Priority)** usually relies on a **Relative** standard. Even if everyone is rich, the person with the smallest house is still "worse off" and deserves priority.
  *   **Why it matters for Inheritance Tax:** If "worse off" is absolute, inheritance tax is only needed to stop poverty. If "worse off" is relative, inheritance tax is needed to stop dynasties, even if the heirs are already comfortable.

  **2. Snapshot vs. Lifetime**
  *   **Snapshot:** How much money do you have *right now*?
  *   **Lifetime:** How much will you have over your whole life?
  *   **Why it matters for Inheritance Tax:** This is crucial. An heir receiving £10m might be "worse off" *right now* than a NHS consultant (because the consultant has a salary and the heir has nothing yet). But over a *lifetime*, the heir is vastly better off.
  *   **The Trap:** If you use the **Snapshot** definition, the sentence doesn't support inheritance tax well, because the heir might technically be "worse off" at the moment of inheritance than the taxpayers funding the public services. If you use the **Lifetime** definition, the sentence supports the tax strongly, because you are transferring from people with high lifetime prospects to those with low ones.

  ### Summary for Your Argument
  If you go back to that subreddit (or just think it through for yourself), here is the position that holds water:

  You are likely operating on **Claim 2 (Prioritarianism)** with a **Lifetime** definition of "worse off".

  *   **Why?** It admits that leakage is bad (unlike Claim 3), but argues that the moral weight of helping those with low lifetime prospects outweighs the financial loss (unlike Claim 1, which is too fragile).
  *   **Does it justify the tax?** Yes, provided the revenue raised actually goes to people with lower lifetime prospects than the heirs.
  *   **Does it avoid the "madness"?** Yes, because it doesn't demand we make the rich poor for no reason (avoids leveling down), and it doesn't demand we help the single worst-off person before fixing a million other problems (avoids the strict queue).

  The guy who shut you down was right that the sentence is powerful, but the other two were right that the sentence is ambiguous. If you clarify that you mean **"We should weight benefits by lifetime prospects, not just current cash,"** you reclaim the argument without signing up for the radical "strict queue" nonsense.

  Hope that clears the fog. It's solid thinking for a break room debate.
