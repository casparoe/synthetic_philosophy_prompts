  *   **Tension D: P3 vs. P6 (Fear).** Low.
      *   *Fix:* Fear requires anticipation of experience. Death has no experience.
      *   *Cost:* None really, standard Epicurean move.

  *   **Apparent Tension:** P2 & P3. They cooperate. P2 justifies P3.
