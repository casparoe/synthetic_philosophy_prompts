answer: |-
  Here is the committed design. I am keeping your split-room core because it is the only way to generate the visceral "gotcha" moment required to break their fluency. However, I am modifying the **presentation rules** to prevent the secret from leaking before the reveal, and I am cutting the number of findings from three to **two** to protect your debrief time.

  ### 1. The Activity: "The Adaptation Game"

  **Goal:** Demonstrate *post-hoc accommodation* (fitting a story to known data) vs. *risky prediction*.
  **Time:** 80 Minutes total.
  **Class Size:** 25 Students (5 Groups of 5).

  #### Preparation (Pre-Class)
  1.  **The Packets:** Create two versions of a handout (Version A and Version B).
      *   **Version A (12-13 students):** Contains Finding 1 (Positive) and Finding 2 (Positive).
      *   **Version B (12-13 students):** Contains Finding 1 (Negative) and Finding 2 (Negative).
      *   **Crucial:** The text must look identical except for the direction of the correlation. Use fake journal headers (e.g., *Journal of Evolutionary Behavioral Science, 2023*).
  2.  **The Room:** Arrange desks so groups cannot easily see each other's papers.
  3.  **Tokens:** 10 poker chips or candies per group (for voting).

  #### The Findings (Steal These)
  *   **Finding 1 (Birth Order & Risk):**
      *   *Version A:* "In a control study of 2,000 drivers, **first-born** individuals were **23% more likely** to receive speeding tickets than later-born siblings."
      *   *Version B:* "In a control study of 2,000 drivers, **first-born** individuals were **23% less likely** to receive speeding tickets than later-born siblings."
  *   **Finding 2 (Disgust & Morality):**
      *   *Version A:* "Participants exposed to a **foul odor** (rotten eggs) during a survey made **harsher** moral judgments about unrelated social transgressions."
      *   *Version B:* "Participants exposed to a **foul odor** (rotten eggs) during a survey made **more lenient** moral judgments about unrelated social transgressions."

  *(Note: Finding 2 is based on real "moral disgust" literature, but the direction is debated/manipulable, making it perfect for this.)*

  #### Run of Show (80 Minutes)

  **0:00–0:10 | Setup & Rules**
  *   Hand out packets randomly (A to half, B to half).
  *   **The Rule:** "You are research teams. Your job is to produce the *best* evolutionary explanation for your data. **Do not read the specific finding aloud to the class later.** When you present, you will only describe the *adaptive mechanism*, not the data direction."
  *   **Scoring:** Groups will vote on which *mechanism* sounds most scientifically robust. Winning group gets "tenure" (candy/bragging rights).

  **0:10–0:30 | Group Work (20 mins)**
  *   Task: Draft a 1-paragraph explanation.
  *   **Constraint Checklist (on board):** To count as an EP explanation, your story must include:
      1.  A reference to the Environment of Evolutionary Adaptedness (EEA).
      2.  A specific reproductive or survival benefit.
      3.  A reason why this trait would be heritable.
  *   *Instructor Role:* Circulate. If a group is stuck, prompt them: "What would this behavior do for their genes in the Pleistocene?" Encourage confidence.

  **0:30–0:45 | Presentations & Voting (15 mins)**
  *   Select one spokesperson from 3 groups (mix of A and B, but you don't know which is which).
  *   They stand and state **only the mechanism**.
      *   *Example (Group A):* "First-borns face higher parental investment pressure, leading to risk-aversion to protect existing resources."
      *   *Example (Group B):* "First-borns face higher competition for status, leading to risk-taking to signal dominance."
  *   **The Trap:** Because they aren't stating the finding, the class hears two plausible, opposite mechanisms and assumes they are explaining the *same* data.
  *   Class votes on which mechanism sounds more "scientific."

  **0:45–0:55 | The Reveal (10 mins)**
  *   Ask Group A to stand. Ask Group B to stand.
  *   Read Finding A aloud. Then read Finding B aloud.
  *   **The Silence:** Let the realization land. They just voted on "science" that was equally compatible with contradictory facts.
  *   Collect the tokens. No winners.

  **0:55–1:20 | The Debrief (25 mins)**
  *   (See below).

  ---

  ### 2. The Debrief: Mapping the Feeling to the Philosophy

  Do not let them off the hook with "Well, EP is hard." You need to pivot from the *feeling* of the game to the *criteria* of science.

  **Point 1: Accommodation vs. Prediction (10 mins)**
  *   **The Hook:** "You felt confident five minutes ago. Why?"
  *   **The Concept:** Distinguish **Accommodation** (fitting a hypothesis to existing data) from **Prediction** (stating what data *must* look like before you collect it).
  *   **The Lesson:** "An adaptive explanation that can explain X and Not-X explains nothing. In philosophy of science, we call this a lack of **falsifiability**. If your theory survives the data no matter what the data says, the theory isn't touching the world."
  *   **Action:** Write on board: *Post-hoc Plausibility ≠ Scientific Evidence.*

  **Point 2: The "Null Hypothesis" of Biology (10 mins)**
  *   **The Hook:** "You all assumed the behavior *must* be an adaptation. Why?"
  *   **The Concept:** Introduce the **Spandrel** (Gould & Lewontin).
  *   **The Lesson:** "In this game, you were forced to find an adaptation. In real science, the default should be: Is this a byproduct? Is it genetic drift? Is it a physiological constraint?"
  *   **Example:** "Maybe first-borns get fewer speeding tickets not because of 'status signaling,' but because parents hand down the older, slower car to the first child. That's a constraint, not an adaptation."
  *   **Takeaway:** Adaptive stories are the *last* resort, not the first.

  **Point 3: How to Save EP (5 mins)**
  *   **The Hook:** "Is EP dead then?"
  *   **The Lesson:** No. But rigorous EP looks different than this game.
      *   It uses **cross-cultural universals** (if it's adaptive, it should appear everywhere, not just in US undergrads).
      *   It makes **risky predictions** (e.g., "If disgust is linked to pathogen avoidance, people should be more morally conservative *only* when primed with disease cues, not danger cues").
      *   It integrates with **neuroscience** (is there a mechanism?).

  ---

  ### 3. Troubleshooting: What Will Go Wrong

  **Problem 1: The Secret Leaks.**
  *   *Scenario:* A student from Group A says, "So, since first-borns are *more* risky..." and Group B hears it.
  *   *Fix:* Enforce the "Mechanism Only" rule strictly. If a student slips, interrupt gently: "Just the mechanism, please." If the cat is out of the bag, lean into it: "Okay, the secret is out. Look at how easily you both justified opposite worlds."

  **Problem 2: Lazy Stories.**
  *   *Scenario:* Groups write "Because it helped them survive."
  *   *Fix:* The **Constraint Checklist** on the board is mandatory. Walk around and reject drafts that don't mention the EEA or reproduction. Make them work for the "science" feel.

  **Problem 3: The Cynical Turn.**
  *   *Scenario:* Students conclude "All social science is fake."
  *   *Fix:* Pivot hard during the debrief. "This isn't a problem with social science; it's a problem with *post-hoc* reasoning in *any* science. Astrology does this. Freudian psychoanalysis does this. The solution isn't to stop studying behavior; it's to demand pre-registered predictions."

  ---

  ### 4. Limitations: What This Activity Cannot Do

  You must supply this in the debrief, because the game structurally cannot show it:

  1.  **It cannot show Successful EP.** The game is rigged to make EP look like a parlor trick. You must explicitly name-drop examples where EP *has* made risky predictions that held up (e.g., Stephen Pinker's work on language, or specific pathogen-avoidance behaviors that vary predictably with local disease load). If you don't do this, they will leave thinking EP is pseudoscience.
  2.  **It cannot simulate "Costly Signaling."** The easiest way to defend against "Just-So" stories is showing that a behavior is *costly* (handicap principle). Your game doesn't allow for measuring costs. You need to explain that real EP looks for behaviors that *reduce* survival odds but increase mating odds (e.g., peacock tails), which constrains the storytelling.
  3.  **It creates a False Dichotomy.** The game implies "Adaptation vs. Nothing." In reality, it's often "Adaptation + Constraint + Culture." You need to clarify that modern EP is interactionist, not genetic determinist.

  ### Why This Design?
  I rejected the idea of giving them three findings. In an 80-minute class, three findings turns the activity into a rush. Two findings allow the "Reveal" to breathe. I also rejected having them present the *finding* aloud. That is the single point of failure for the split-room trick. By forcing them to present only the *mechanism*, you preserve the ignorance required for the reveal to land.

  **Final Instruction:** When you hand out the packets, say nothing about them being different. Say, "Everyone has a finding. Some of you have Finding 1, some have Finding 2." (This is a lie, but a necessary pedagogical one). If asked, "Are they all the same?" say, "Focus on your own data." The ethical breach is minor compared to the epistemic lesson.
