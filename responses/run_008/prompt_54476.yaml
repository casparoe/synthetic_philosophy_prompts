prompt: |-
  Just had a two-hour argument with my best friend about the welfare state and I'm still annoyed. She works adjacent to job services; I lean "just give people money." Every time I pushed on sanctions and mandatory job-search requirements she'd fall back on the same line: benefits should be a hand up, not a hand out. And the line was doing real work — she used it to defend workfare conditionality, sanctions for missed appointments, the whole apparatus that sorts the deserving from the undeserving (with some stuff about people gaming the system mixed in). I couldn't tell in the moment whether the slogan actually supports all that or just sounds like it does. So: what are the distinct precise claims 'a hand up, not a hand out' could be making — anywhere from the near-tautological (a training program isn't a check, fine), to desert and reciprocity claims about what the poor owe the state, to empirical claims about incentives and behavior change, to claims about fraud. For each reading, tell me whether it's a platitude, defensible-but-contentious, or just wrong. And don't hand me a menu and shrug — after laying them out, commit: which reading was she actually leaning on to defend sanctions, and does that one definately survive scrutiny or not? I want to know whether I lost the argument on the merits or just got out-sloganed.
reasoning: |-
