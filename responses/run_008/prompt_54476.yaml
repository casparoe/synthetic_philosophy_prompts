      *   *Diagnosis:* She is likely mixing the Moral Claim (you owe effort) with the Behavioral Claim (conditions create better outcomes). But the *work* the slogan is doing is moral justification for coercion. It's about *conditionality as a moral filter*.

  5.  **Evaluating the Merits (The "Commitment"):**
