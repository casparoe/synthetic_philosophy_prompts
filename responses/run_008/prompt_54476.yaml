      *   *Conclusion:* The slogan is internally inconsistent when used to defend *punitive* sanctions. It works for "supportive conditionality" (training), but fails for "punitive conditionality" (sanctions).
      *   *Verdict:* The user likely got out-sloganed. The friend's position relies on an empirical claim (sanctions work) that is dubious and a moral claim (coercion is help) that is contradictory.

