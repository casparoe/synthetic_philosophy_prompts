answer: |-
  My dear friend, it is a pleasure to assist you in this matter, for few things are more vital to historical fiction than ensuring that the intellectual furniture of your characters matches the room in which they sit. You are right to be cautious, as the summary you have encountered is a mixture of sound scholarship, defensible simplification, and modern projection, and distinguishing between them is crucial for the integrity of your scene. To understand what your Dominican confessor can credibly say, we must first walk through what Aristotle actually argues, for his views on money are not isolated economic opinions but are embedded in his broader philosophy of nature and ethics. In the first book of his Politics, Aristotle distinguishes between two kinds of wealth-getting. The first is natural, which he calls household management, where the acquisition of goods is limited by the needs of the household or the state. This is legitimate because it aims at a good life, not merely at living. The second is unnatural, which he calls the art of wealth-getting without limit, where the aim is simply the accumulation of currency. For Aristotle, money was indeed invented as a convention to facilitate exchange, solving the inconvenience of barter by providing a common measure of demand. However, he believes that money has a proper use, which is to be used in exchange for goods needed for life, and an improper use, which is to be used to generate more money. This distinction is the bedrock upon which the later medieval arguments were built.

  Turning now to the specific claims in your popular history book, we can audit them with this framework in mind. The assertion that money was invented purely as a convenience for exchange with no legitimate purpose beyond that is largely accurate, though it requires a slight qualification to be philosophically precise. Aristotle does view money as a tool for exchange, but he would argue its legitimate purpose is to facilitate the acquisition of necessary goods for the household, not merely exchange for exchange's sake. For the purposes of your novel, however, having the confessor state that money is a measure for exchange and not an end in itself is entirely safe and reflects the Aristotelian position well. The second claim, that trade between cities is natural but retail trade for profit is not, is a defensible simplification. Aristotle does allow for trade that supplies the deficiencies of the household or state, which often implies trade between communities, but he condemns retail trade specifically when it is pursued for the sake of profit accumulation rather than the supply of needs. Your Dominican could certainly argue that trading to supply the city is virtuous, while trading merely to swell a private purse is vicious, without contradicting the source material.

  The third claim, that money is barren by nature and that interest is unnatural because it makes money breed money, is the most accurate of the bunch and is the strongest card in your confessor's hand. This comes directly from Politics book one, where Aristotle plays on the Greek word for interest, tokos, which also means offspring. He argues that money is sterile and cannot naturally reproduce itself, so charging interest is a violation of nature. This was a favorite argument of the Scholastics, including Aquinas, and it is perfectly period-appropriate for your Dominican to use this metaphor. He would likely speak of the sterility of coin and the unnaturalness of forcing it to bear fruit, as this was standard preaching material in the fourteenth century. You can put this in his mouth with confidence, as it is both authentically Aristotelian and authentically medieval.

  The fourth claim, regarding fair exchange and equal value, is where things become slightly more complicated and touches on your specific concern about misreading. Aristotle, in the Nicomachean Ethics, discusses reciprocal justice in exchange, arguing that for a city to hold together, there must be a proportionate reciprocity between goods. He struggles with how to compare different things, like shoes and houses, and suggests money acts as a measure to make them commensurable based on demand. He does not strictly say the value must be equal in a modern labor-theory sense, but rather that the exchange must be proportionate to the need and status of the parties involved. However, the Scholastics interpreted this through the lens of the just price, which often implied a kind of equivalence to prevent fraud. If your confessor argues that a fair exchange requires an equivalence of value so that neither party is diminished, he is speaking as a Thomist Aristotelian, which is exactly what a fourteenth-century Dominican would be. It is a slight hardening of Aristotle's fluid concept of proportionality, but it is not an anachronism for your character to hold this view.

  The fifth claim, however, regarding the transmission of the doctrine and its effect on European finance, is where the popular history book fails you and where you must be most careful to avoid anachronism. The book suggests that Aristotle's doctrine became the Church's ban on usury, which is historically backward. The Church's prohibition on usury predates the medieval rediscovery of Aristotle by centuries, rooted firmly in Scripture, particularly the Gospel of Luke and the Psalms, as well as the decrees of early Church councils. Aristotle did not create the ban; rather, Aquinas and the Scholastics used Aristotle to provide a philosophical rationale for a ban that already existed on religious grounds. Furthermore, the idea that this ban held back European finance is a modern economic judgment, typical of Enlightenment or later historians looking back with the benefit of hindsight. A fourteenth-century Dominican would not view the usury ban as a drag on finance; he would view it as a safeguard for the soul and a protection for the poor against exploitation. To have your confessor lament that the ban holds back trade, or to have him claim Aristotle invented the rule, would be a significant error that a knowledgeable reviewer would spot immediately.

  This brings us to your specific worry about the causal story of the usury ban. You are right to be unsure, as the popular history has inverted the relationship. The authority for the Dominican is always Divine Law first and natural reason second. In his mouth, Aristotle is not the lawgiver but the philosopher who helps explain why God's law makes sense in the natural order. He would say that Scripture forbids usury, and Aristotle shows us why this prohibition is in harmony with nature. If you have him argue that the Church bans usury because Aristotle said so, you undermine his authority as a man of God. He must argue that the Church bans usury because God said so, and Aristotle merely illuminates the natural truth of that command. Regarding the equal value question, you are safe to have them argue about equivalence, provided you frame it as a matter of justice and preventing fraud rather than a rigid economic formula. The medieval concept of the just price was flexible, often determined by common estimation in the market, but the moral principle was that one should not profit from the need of another without providing equivalent value in return.

  In terms of what is safe for dialogue versus what is modern ventriloquism, you should feel free to let the confessor use the arguments about the barrenness of money and the distinction between natural and unnatural wealth. These are core Aristotelian-Thomistic positions that were actively taught in the universities of Paris and Oxford and preached from pulpits in Florence and Venice. He can also argue that exchange should be based on equivalence to maintain justice. However, you must not let him argue that the usury ban is a result of Aristotelian philosophy alone, nor should he express concern that the ban is stifling economic progress. That is a modern concern. If you wish to explore the tension between finance and morality, that argument belongs in the mouth of the money-changer, who might argue that credit lubricates trade and helps the city flourish, but the confessor should reject that metric, arguing that the health of the soul outweighs the wealth of the city. The confessor's role is to uphold the eternal law, not to optimize the market.

  To summarize my judgment for your revision, the claims about the nature of money, the sterility of coin, and the distinction between natural and unnatural trade are safe to place in your Dominican's mouth, as they reflect the intellectual toolkit he would actually possess. The claim about equal value is acceptable if framed as a matter of justice and proportionate reciprocity rather than strict mathematical equality. However, the claim that Aristotle caused the usury ban and that the ban hindered financial development must be kept out of the confessor's speech. The former misrepresents the hierarchy of authority in medieval theology, and the latter imposes a modern economic worldview on a medieval mind. If you keep these distinctions clear, your scene will not only survive the scrutiny of informed readers but will also gain a depth of authenticity that brings the intellectual struggles of the fourteenth century to vivid life. I wish you the very best with your novel, for it sounds like a project that handles these weighty matters with the care they deserve.
