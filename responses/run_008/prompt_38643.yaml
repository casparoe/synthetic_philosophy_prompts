answer: |-
  This is a classic reconstruction of the "Cosmopolitan Objection" to liberal nationalism (reminiscent of arguments by Thomas Pogge or Simon Caney against Thomas Nagel or David Miller). Your colleague's argument is valid, but it is unsound. Since you wish to preserve the meta-ethical structure of **(1)** (Choice vs. Relationship) and the consistency principle of **(4)** (Uniformity of Grounding), the point of failure lies squarely in **(3)**.

  Here is the diagnosis of the argument, the specific flaw in (3), and the costs of rejecting it.

  ### The Diagnosis: The Level of Generality Problem

  Your colleague's argument succeeds only because Premise **(3)** identifies the grounding relationship at a level of abstraction that is too thin.

  (3) claims the ground is "joint subjection to a common coercive authority and participation in a common scheme of cooperation." This description is intentionally capacious. It captures the *genus* of political relationship but misses the *species* that actually generates special duties.

  By defining the ground so abstractly, (3) sets up a straw man that the global order can easily match in (5). If the ground were merely "causal interdependence" or "subjection to rules," then yes, the global order qualifies. But if the ground is more specific, the global order fails to qualify, and the inference to (6) collapses.

  ### How to Reject (3)

  You should reject **(3)** not by denying that relationships ground duties, but by **specifying the relationship more precisely.**

  Most sophisticated statist or nationalist theories do not ground special duties in *coercion simpliciter* or *benefit simpliciter*. They ground it in features of the state relationship that the global order lacks. You should replace (3) with a "Thickened Premise":

  > **(3*)** The ground of compatriot priority lies in the specific nature of the political relationship: specifically, **joint authorship** of coercive laws, **comprehensive** jurisdiction over a shared life, and **democratic** reciprocity.

  **Why this blocks the argument:**
  1.  **It respects (1):** You are still grounding duties in Relationship, not Choice.
  2.  **It respects (4):** You are still applying duties uniformly. Everyone who stands in the relationship of *joint authorship of comprehensive law* gets the special duties.
  3.  **It blocks (5):** It is not true that we stand in relations of *joint authorship* or *comprehensive jurisdiction* with all participants in the global economic order. We are subject to global trade rules, but we do not co-author them democratically in the same way we do domestic law. The global order is fragmented; the state order is comprehensive.
  4.  **It blocks (6):** Since the global order does not instantiate the *specific* grounding relationship identified in (3*), the duties it generates are different in kind, not just in degree.

  ### Addressing the "Degree vs. Kind" Objection

  Your colleague's reply was that "density is a difference of degree," and degrees cannot mark categorical boundaries without arbitrariness. This is the strongest part of their position, and you must meet it head-on.

  **The Counter-Argument: Functional Thresholds**
  You should argue that while density is often a matter of degree, **functional kinds** emerge at specific thresholds.
  *   *Analogy:* Water heating from 20°C to 99°C is a difference of degree. Water at 99°C vs. 100°C is a difference of kind (liquid vs. gas). The underlying physical reality changes continuously, but the *functional properties* change categorically.
  *   *Application:* A state provides a *comprehensive* legal framework that claims ultimate authority over all aspects of life (tax, crime, family, property). The global order provides *fragmented* regimes (trade, human rights, environment) without a central enforcer or comprehensive legislature.
  *   *Conclusion:* This is not just "more" cooperation; it is a different *type* of normative environment. The state creates a unique problem of legitimacy (we are both subjects and authors of the law) that generates unique duties of justice. The global order creates problems of humanitarianism or fairness, but not the same problem of political justice.

  Therefore, the line is not arbitrary; it is drawn at the functional threshold where a cooperative scheme becomes a **political authority.**

  ### The Cost of Rejecting (3)

  Rejecting (3) in favor of (3*) saves your intuition that compatriot priority is permissible, but it comes with three significant costs you must accept:

  **1. You must accept robust global duties (just not equal ones).**
  By keeping (1) and (4), you concede that the global relationship *does* ground *some* duties. You cannot retreat to a hard nationalist view where we owe nothing to outsiders. You must argue that the global scheme of cooperation generates duties of basic human rights protection, fair trade, and harm avoidance. You are arguing for *priority*, not *exclusivity*. Your colleague will accept this, but you must ensure your view doesn't collapse into a view where global duties are so demanding they swallow compatriot priority.

  **2. You bear the burden of the "Threshold Defense."**
  You must explain exactly *which* features of the state make it qualitatively different. Is it democracy? Is it comprehensiveness? Is it coercion?
  *   *Risk:* If you say it's "democracy," you owe special duties to non-democratic compatriots (which seems odd) or none to democratic foreigners (which seems odd).
  *   *Risk:* If you say it's "coercion," you face the original problem.
  *   *Cost:* You need a nuanced political theory (likely along the lines of Nagel's "Political Conception of Justice" or Miller's "National Responsibility") to defend the specific threshold. You cannot just assert "the state is denser."

  **3. You must accept "Moral Discontinuity."**
  You are committing to the view that moral duties do not track smoothly with empirical interconnectedness. Even if the world becomes 99% integrated economically, unless it crosses the threshold into a global political authority with comprehensive jurisdiction, the special duties of citizenship remain distinct. This can feel counter-intuitive to those who think morality should be continuous with empirical reality, but it is necessary to preserve the distinction between *political justice* and *humanitarian duty*.

  ### Summary for the Workshop

  To reply to your colleague:

  "I accept your premises (1) and (4), but I reject (3) as an under-described account of the grounding relationship. Special duties arise not from coercion or cooperation *simpliciter*, but from **joint authorship of a comprehensive coercive order**. The global order involves interdependence, but it lacks the comprehensive, co-authored political structure that generates the specific duty of distributive justice we owe compatriots. This is not an arbitrary line of degree, but a functional threshold of political authority. Therefore, we owe outsiders significant duties of fairness and rights, but the special duties of citizenship remain distinct because the relationship that grounds them is distinct."
