  I came across a pop-science article that summed up Hofstadter's strange loop idea like this: 'Hofstadter's claim is that once a brain gets complex enough to model itself, a strange loop forms, and consciousness just is that loop. Gödel showed that formal systems can make statements about themselves, so any system with feedback — a thermostat, a video camera pointed at its own screen — contains a little spark of selfhood, and human consciousness differs only in degree. The self that this creates is a mirage, a story the brain tells itself, so there's no real "you" in there, and free will goes out the window with it.' I found it pretty convincing tbh, though the thermostat bit feels off somehow. Is this fair to Hofstadter? Go bit by bit — what he'd sign off on, where the article blurs things (I've heard he insists strange loops aren't just ordinary feedback loops, but I don't remember why that distinction matters so much to him), and whether the "no real you, no free will" conclusion actually follows from what he claims or is being bolted on.
