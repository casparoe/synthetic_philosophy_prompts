      *(Refining the Discriminator)*: The prompt asks for a case that discriminates among *candidate rules* derived from the section.
      Rule 1: Aggregation permitted (Utilitarian for animals).
      Rule 2: Constraints exist but are weaker (Graded).
      Case: Painlessly killing 1 animal to save 5 animals from death.
