      *   *Case 4 (Roadkill):* Eating already dead animal. No killing, no suffering.
          *   *Nozick's Track Record:* He focuses on *imposing* costs. If no cost is imposed, is it wrong? He doesn't explicitly say. But he challenges the meat-eater on the *killing*.
          *   *Verdict:* Likely Permitted. The wrong seems tied to the *imposition* of harm/death, not the consumption per se.

  6.  **Identify the "Discriminator" Case:**
      *   I need a case that splits Rule A (Two-Level/Utilitarian for animals) from Rule B (Graded Constraints).
      *   *Idea:* A case where Utilitarianism says "Do it" (Net pleasure > Net pain) but a Constraint says "Don't" (Right to life violated).
