prompt: |-
  I'm on the board of my condo building (software engineer, got roped in because nobody else wanted the job) and we're about to have a big vote on whether to ban short-term rentals like Airbnb. Here's the thing that's bugging me: our bylaws say only unit owners can vote, but probably a third of the people actually living in the building are renters, and they'd be the most affected by the outcome either way — they're the ones dealing with party guests in the lobby at 2am, or losing the ability to sublet if their landlord cracks down. Our building super also lives here rent-free as part of his compensation, and there's a guy who owns a unit but has been trying to sell for a year so he barely counts as present. One owner emailed everyone saying this is basically taxation without representation and renters should get ballots this time. Another owner replied that if you don't own, you don't get a say — you signed a lease, you can leave, it's an owners' association not a neighborhood democracy, same as being a shareholder in a company.

  My gut says both of them are half right and I can't articulate why. So I want to actually think this through instead of just vibes: what principle should decide who gets a vote in a setup like ours? Is there a real difference between "everyone significantly affected gets a say" and "members of the association decide, period", or is one just a rationalization for the status quo? Where would someone like our super even fall — affected, yes, but he's also kind of an employee of the owners. And practically: should I push to suspend the bylaws and let renters vote on this one question, or is that a worse precedent than just letting the rules we all (well, the owners) agreed to play out? For what it's worth the same fight keeps happening at work about whether contractors and people who joined the team last month should vote on team processes, so I suspect there's some general thing here I'm missing. Would love a straight answer, not just "it's complicated."
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Software engineer, condo board member (reluctant), analytical mindset ("think this through instead of just vibes," "straight answer, not just 'it's complicated'").
      *   **Context:** Condo building vote on banning short-term rentals (Airbnb).
      *   **Conflict:** Bylaws say only owners vote. ~33% of residents are renters. Renters are heavily impacted (noise vs. subletting rights).
      *   **Stakeholders:**
          *   Owners (voters).
          *   Renters (non-voters, high impact).
          *   Super (employee/resident, ambiguous status).
          *   Absentee Owner (selling, low engagement).
      *   **Arguments:**
          *   Pro-Renter Vote: "Taxation without representation," affected parties should decide.
          *   Pro-Owner Vote: Contractual agreement (lease), property rights, association structure (like shareholders).
      *   **Parallel:** Similar conflict at work regarding contractors/new hires voting on team processes.
      *   **Goal:** Determine the guiding principle for voting rights and decide whether to suspend bylaws for this vote.

  2.  **Deconstruct the Core Question:**
      *   *What principle should decide who gets a vote?*
      *   *Is there a real difference between "affected parties" vs. "members of the association"?*
      *   *Practical decision: Suspend bylaws or follow them?*

  3.  **Evaluate the Competing Principles:**
      *   **Principle A: Property Rights/Contractual Membership (The "Shareholder" Model).**
          *   *Logic:* You own the asset, you bear the financial risk (maintenance, special assessments, property value fluctuation). The HOA/Condo Board manages the *asset*, not just the *experience*.
          *   *Strength:* Clear legal boundary. Aligns decision-making with long-term financial liability.
          *   *Weakness:* Ignores immediate quality-of-life impacts on residents who don't own. Can lead to owner tyranny over renters.
      *   **Principle B: Stakeholder Impact (The "Democracy" Model).**
          *   *Logic:* If a rule changes your daily life, you should have a say.
          *   *Strength:* Moral fairness, reduces conflict, better buy-in.
          *   *Weakness:* Blurs accountability. Renters can leave; owners are stuck with the consequences (financial/legal). Hard to define "significant impact."

  4.  **Analyze the Specific Case (Short-Term Rentals):**
      *   *Impact on Owners:* Property values, insurance rates, ability to rent out *their* unit later, wear and tear on common elements.
      *   *Impact on Renters:* Safety, noise, ability to sublet (if their lease allows), community vibe.
      *   *Legal Reality:* In most jurisdictions, condo bylaws are legally binding documents recorded with the state/county. Allowing non-owners to vote on bylaw changes might be *illegal* or voidable, regardless of what the board wants. (Crucial point to verify).

  5.  **Address the "Super" and "Absentee Owner":**
      *   *Super:* Employee. Lives there as compensation. Technically a tenant (even if rent-free). Usually, employees shouldn't vote on employer governance to avoid conflict of interest, even if they live there.
      *   *Absentee Owner:* Still owns. Still liable for fees. Still has a financial stake. Should vote (or proxy).

  6.  **Address the Work Parallel:**
      *   Contractors/New Hires vs. Full-time Employees.
      *   Similar dynamic: FTEs bear long-term career risk/ownership of code. Contractors have short-term engagement.
      *   Process decisions vs. Strategic decisions.

  7.  **Formulate the Recommendation:**
      *   *The "Straight Answer":* Follow the bylaws. Do not let renters vote formally.
      *   *The "Why":* It's not about fairness of *impact*, it's about alignment of *liability*. Owners carry the long-term financial risk (special assessments, property value). Renters have an exit strategy (lease end).
      *   *The Nuance:* Just because they don't *vote* doesn't mean they don't have *input*.
      *   *The Risk:* Suspending bylaws could invalidate the vote legally.
      *   *The Solution:* Create a feedback loop for renters without giving them ballots.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Acknowledge the engineering mindset:* Use systems thinking. Define the system boundary.
      *   *Distinguish Governance vs. Feedback:* Voting is governance. Surveys/Town halls are feedback.
      *   *Legal Check:* Emphasize that bylaws are legal documents. Breaking them risks lawsuits.
      *   *The "Work" Analogy:* Map it out clearly. FTE = Owner, Contractor = Renter.
      *   *Actionable Advice:* How to handle the super, the absentee owner, and the renters.

  9.  **Refining the Principle:**
      *   The principle is **"Risk Alignment."** Who holds the bag if the decision goes wrong financially/legally?
      *   Owners hold the bag (property value, insurance, special assessments).
      *   Renters hold the bag (quality of life), but can liquidate their position (move) much faster.
      *   Therefore, Owners vote, but Renters must be heard.

  10. **Final Polish:**
      *   Ensure tone is empathetic but firm.
      *   Make sure the legal warning is prominent (I am not a lawyer, but this is standard HOA law).
      *   Address the "Taxation without Representation" claim directly (it's a category error).

  11. **Self-Correction/Edge Case:**
      *   *Wait, what if the bylaws allow suspension?* Even if they do, changing voting eligibility for a specific vote might be ultra vires (beyond powers) depending on state law. Better to advise caution.
      *   *What about the Super?* He is an employee. Voting creates a conflict. He should be excluded from voting even if renters were included (which they shouldn't be).
      *   *What about the Absentee Owner?* He definitely votes. He owns the asset.

  12. **Final Structure:**
      *   Direct Answer (The Principle).
      *   The Legal/Structural Reality (Why "Democracy" is the wrong model).
      *   The Risk Alignment Argument (The "Why").
      *   The Work Analogy (Connecting the dots).
      *   Practical Recommendation (What to do tomorrow).
      *   Handling the Super/Absentee Owner.

  (Proceed to generate output based on this thought process.)
answer: |-
  Here is the straight answer you are looking for, framed in terms of system design and risk alignment rather than political philosophy.

  ### The Principle: Risk Alignment, Not Impact
  The governing principle for who gets a vote in a condo association (or a corporation) is **Long-Term Liability Alignment**, not **Immediate Impact**.

  *   **Owners** hold the long-term financial risk. If the building's insurance spikes, if the roof leaks, if property values tank because the building gets a reputation for parties, or if the HOA gets sued, the owners pay. They cannot easily exit this position; selling a condo takes months and involves transaction costs.
  *   **Renters** hold short-term quality-of-life risk. If the building becomes unpleasant, their exit strategy is defined by a lease term (often 12 months). They do not bear the capital risk of the asset.
  *   **The Super** is an employee. His housing is compensation. Giving him a vote creates a conflict of interest between his fiduciary duty to the owners (his employers) and his personal interest as a resident.

  **The "Taxation Without Representation" argument is a category error.** An HOA is not a government; it is a mutual corporation. The "shareholder" model your other owner cited is the legally correct one. You do not get to vote at Apple's shareholder meeting just because you use an iPhone and are "affected" by their supply chain.

  ### The Legal Reality (The "Hard Stop")
  Before you debate the morality, you must address the legality. In almost every jurisdiction, condo bylaws are a legal covenant recorded with the state or county.
  *   **If your bylaws say only owners vote, letting renters vote may invalidate the entire election.**
  *   A losing owner could sue, claim the vote was *ultra vires* (beyond the powers of the board), and a judge would likely void the result.
  *   **Suspension of bylaws** usually requires a supermajority of *owners* to amend the bylaws themselves. You generally cannot suspend voting eligibility rules for a single vote without opening the board to litigation.

  ### The Work Analogy (Since you mentioned it)
  You noted this happens at your job too. Here is the mapping:
  *   **Owners = Full-Time Employees (FTEs).** They own the long-term health of the codebase, carry the on-call rotation next year, and their career reputation is tied to the product's success.
  *   **Renters = Contractors.** They are impacted by the process. If the process is bad, their life is harder. But if the ship sinks, they move to the next contract.
  *   **The Vote = Architectural Decision.**
  *   **The Rule:** FTEs vote on architecture because they maintain it. Contractors provide *input* (code review, feedback), but they do not get *commit access* (the vote).

  If you give contractors voting rights on team process, you decouple decision-making from long-term maintenance. You get short-term optimization at the expense of long-term stability.

  ### So, Why Does Your Gut Say They're Both Half Right?
  Your gut is detecting a **Feedback Loop Failure**, not a Voting Rights failure.

  The "Owner Only" rule is correct for *liability*, but it is dangerous for *information*. Owners who don't live in the building (like the guy selling his unit) lack data on the actual noise/security issues. Renters have the data but no mechanism to weigh it formally.

  If you ignore the renters completely, the owners will vote based on incomplete data, potentially making a decision that causes mass renter turnover, which hurts property values (hurting the owners).

  ### Practical Recommendation
  Do not suspend the bylaws. Do not give renters ballots. It creates legal liability and sets a precedent that undermines the property rights structure of the condo.

  **Instead, engineer a better input channel:**

  1.  **Formalize Renter Feedback:** Before the vote, hold a "Town Hall" where renters are explicitly invited to speak. Record their testimony. Distribute a summary of renter concerns to all owners before they cast their ballots. This gives renters *voice* without giving them *veto power*.
  2.  **The Super:** He should **not** vote. He is an employee. Even if you let renters vote (which you shouldn't), an employee of the association should not vote on association governance. He can, however, provide a professional report on security incidents related to short-term rentals.
  3.  **The Absentee Owner:** He **must** vote. He owns the asset. If he is disengaged, the board should reach out to ensure he understands the stakes. His financial interest is aligned with the other owners, even if his physical presence is not.
  4.  **The "Sublet" Compromise:** If the vote passes (ban STRs), ensure the rule includes a "grandfather clause" or specific provision for long-term sublets (e.g., 6+ months) so current renters aren't immediately punished if their landlords change the rules on them. This mitigates the harm to renters without giving them the vote.

  ### Summary
  *   **Principle:** Voting rights belong to those who bear the long-term financial liability (Owners), not those who bear the short-term lifestyle impact (Renters).
  *   **Decision:** Follow the bylaws. Do not let renters vote. It is likely illegal to do otherwise and creates bad governance precedent.
  *   **Mitigation:** Create a formal, documented channel for renter input so owners vote with full information. Treat the renters like "contractors" whose code review is mandatory before the "FTEs" merge the change.

  This preserves the legal integrity of the association while acknowledging the reality that renters hold the data you need to make a good decision.
