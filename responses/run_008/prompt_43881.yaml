answer: |-
  | Scheme | Stated rationale, in one sentence | What the design strictly presupposes | Views it quietly rules out | Views it is merely compatible with | Main internal tension, if any |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Norway** | Gender balance in corporate governance ensures equality and utilizes the full talent pool. | Fairness is defined by outcome parity in power structures, independent of proof of prior bias or individual merit. | Procedural meritocracy (process-only fairness), libertarian freedom of contract, gender-blindness. | The business case for diversity (profitability), structural functionalism. | Symmetric requirement implies men are equally disadvantaged by imbalance, contradicting historical reality of female exclusion; targets oversight (board) not execution (CEO). |
  | **United States** | Educational benefits are derived from the pedagogical value of a diverse student body. | Fairness requires individualized treatment even when pursuing group-level diversity goals; group allocation is inherently unjust. | Quotas or set-asides, reparations for past discrimination, strict colorblindness. | Utilitarian diversity, weak substantive equality. | Pursuing group-level demographic outcomes via individual-level mechanisms creates opacity about how race is actually weighted. |
  | **India** | Social justice and representation require reparative action for historically marginalized caste groups. | Disadvantage is inherently group-based and hereditary, requiring permanent structural redistribution of opportunity. | Pure meritocratic competition, individual-only disadvantage models, caste-blindness. | Distributive justice, representative bureaucracy, pluralist democracy. | The 50% cap validates "merit" for half the seats, conflicting with the premise that caste bias permeates the system; permanent temporariness. |

  All three schemes presuppose that unregulated selection processes will fail to produce socially legitimate distributions of power or opportunity. Each rejects strict procedural neutrality, mandating state intervention to shape outcomes. They all treat group identity as politically relevant, though Norway treats it symmetrically, the US individually, and India hereditarily. None fully embrace pure meritocracy (defined as process-only) nor pure proportionalism (India caps at 50%, US bans quotas). Ultimately, they share the assumption that fairness requires managing composition, not merely policing conduct, but they disagree fundamentally on whether composition matters for its own sake, for utility, or for justice.
