answer: |-
  **JOINT STATEMENT ON DECISION THEORY ADVERSARIAL COLLABORATION**

  **Participants:** A proponent of Causal Decision Theory (CDT) and a proponent of Updateless Decision Theory (UDT).
  **Date:** October 26, 2023
  **Subject:** Comparative Analysis of Counterfactual Mugging and XOR Blackmail

  Following a structured adversarial collaboration regarding two specific decision problems, the undersigned parties issue the following joint statement. We agree on the formal structure of the problems and the expected utilities of various policies. We disagree on the normative interpretation of rationality in light of these structures. This document records our points of convergence, the precise nature of our divergence, and the empirical or theoretical cruxes that remain.

  ### (a) Points of Agreement

  Both parties endorse the following claims:

  1.  **Payoff Structures:** In Case 1 (Counterfactual Mugging), the policy "Pay if Tails" yields an ex-ante expected value of $4,950, while "Refuse if Tails" yields $0. In Case 2 (XOR Blackmail), given that the letter has arrived, paying results in a loss of $1,000 with no causal impact on the privacy of the condition, while refusing retains the $1,000 but risks privacy loss determined by prior facts.
  2.  **Ordinary Decisions:** In standard one-shot decision problems where outcomes depend causally on actions (e.g., choosing between a safe job and a risky investment, or taking an umbrella when rain is causally independent of the choice), both frameworks yield identical recommendations. We agree that any viable decision theory must replicate these standard intuitions.
  3.  **Precommitment in Case 1:** Both parties agree that if offered the opportunity to bind themselves to a policy *before* the coin flip in Case 1, they would voluntarily bind themselves to "Pay if Tails."
      *   *Shared Interpretation:* This shared judgment shows that both frameworks recognize the instrumental value of appearing predictable to a predictor.
      *   *Divergent Interpretation (Noted for Section B):* We disagree on whether this precommitment represents a strategic workaround for a limitation in rational deliberation (CDT) or the revelation of the truly rational act itself (UDT).
  4.  **Convergence in Case 2:** Both parties recommend refusing to pay in Case 2 (XOR Blackmail). We agree that in this specific structure, the policy "Refuse if Letter" dominates "Pay if Letter" in terms of ex-ante expected utility, and paying lacks causal leverage over the secret's exposure.
  5.  **Ecological Validity:** Both parties acknowledge that Case 1 and Case 2 are highly stylized.
      *   The CDT signatory holds that real-world decisions more closely resemble Case 2, where correlations between actions and past states are typically evidential rather than logical or subjunctive.
      *   The UDT signatory holds that real-world decisions increasingly resemble Case 1, particularly in contexts involving reputation, algorithmic trading, or interactions with agents who model one's decision procedure.

  ### (b) Residual Disagreements

  The parties disagree on the following normative and metaphysical questions. Each formulation below is phrased such that the respective party accepts the description of their own view and the description of the opposing view.

  1.  **The Question "What Should I Do?"**
      *   *CDT Formulation:* The question asks for the action that maximizes expected utility conditional on the agent's current knowledge state and causal powers. From this perspective, refusing in Case 1 is the rational response to the fact that the coin has already landed Tails.
      *   *UDT Formulation:* The question asks for the output of the decision function that would have been selected to maximize expected utility from a prior ignorance state. From this perspective, refusing in Case 1 is a dynamic inconsistency that fails the test of reflective stability.
  2.  **The Status of Case 1 Refusal**
      *   *CDT Position:* Refusing in Case 1 is not a mistake; it is the price paid for maintaining a decision procedure that never sacrifices utility in the actual world for the sake of counterfactual worlds that did not obtain. The regret felt is about the *situation*, not the *choice*.
      *   *UDT Position:* Refusing in Case 1 is a substantive error in reasoning. It treats the logical correlation between the agent's algorithm and the predictor's simulation as irrelevant, thereby leaving value on the table that was accessible via the correct policy.
  3.  **The Case 1 / Case 2 Asymmetry**
      *   *CDT Position:* The asymmetry in the UDT recommendation (Pay in Case 1, Refuse in Case 2) appears ad hoc from a causal perspective, as neither action causally influences the past coin flip or the prior existence of the condition. CDT maintains a principled uniformity: never pay for past facts.
      *   *UDT Position:* The asymmetry is principled. In Case 1, the correlation runs through the predictor's simulation of the agent's *decision procedure* (subjunctive dependence). In Case 2, the correlation runs through the agent's *state* (having the condition), which the decision procedure does not control. Distinguishing these is necessary to avoid exploitation in blackmail scenarios while capturing gains in mugging scenarios.

  ### (c) Cruxes and Tests

  We identify the following cruxes as the primary drivers of our disagreement. For each, we propose a concrete case or test and record our predictions.

  **Crux 1: The Value of Time-Consistency**
  *   **The Issue:** Is rationality defined by making the best choice *now*, or by being the kind of agent who *would have* made the best choice *then*?
  *   **Test Case (Parfit's Hitchhiker):** An agent is stranded in a desert. A driver offers a ride only if predicted to pay $100 upon reaching the city. The driver is a perfect predictor. If the agent is predicted to refuse, they are left to die.
  *   **CDT Prediction:** The CDT agent, once in the city, will refuse to pay (as the ride is already received). Consequently, the CDT agent is left in the desert. CDT regards this as a tragic outcome but not a rational error *at the moment of refusal*.
  *   **UDT Prediction:** The UDT agent will pay upon reaching the city. Consequently, the UDT agent survives. UDT regards the CDT outcome as a definitive failure of rationality.
  *   **Joint Observation:** Both parties agree that dying in the desert is "terrible" on its face. This highlights the CDT vulnerability to predictors.

  **Crux 2: The Cost of Updatelessness**
  *   **The Issue:** Does maximizing ex-ante expected utility require accepting losses in scenarios where the agent knows they are in a specific branch of the probability tree?
  *   **Test Case (Extreme Counterfactual Mugging):** Case 1 is modified such that the coin is biased: Heads occurs with probability 1 in 1,000,000. If Heads, the reward is $1 Trillion (conditional on paying on Tails). If Tails, the cost is $100. The agent is now on Tails.
  *   **UDT Recommendation:** Pay the $100. The ex-ante expected value of the policy is still massively positive.
  *   **CDT Recommendation:** Refuse the $100. The expected causal gain is zero.
  *   **Joint Observation:** Both parties agree that the UDT recommendation looks "terrible" on its face to an observer who knows the coin landed Tails. It appears to be throwing away money for a counterfactual that almost certainly did not happen.
  *   **Signatory Statements:**
      *   *UDT:* "This intuition is a cognitive bias favoring the actual world over the logical whole. The policy is still correct."
      *   *CDT:* "This intuition is correct. Rationality should not demand sacrificing actual utility for a vanishingly small chance of a counterfactual benefit that is now impossible."

  **Crux 3: The Boundary of Control**
  *   **The Issue:** Where is the line between correlations an agent should optimize for (Case 1) and correlations an agent should ignore (Case 2)?
  *   **Test Case (Genetic Blackmail):** A blackmailer demands money if they predict you have a specific gene *and* will pay. The gene causes both a harmless trait and a tendency to pay. The letter has arrived.
  *   **UDT Prediction:** Refuse. The decision does not control the gene. Paying only loses money. (Aligns with Case 2).
  *   **CDT Prediction:** Refuse. The decision does not cause the gene. (Aligns with Case 2).
  *   **Disagreement Point:** We disagree on a modified case where the "gene" is actually a *source code variable* accessible to the predictor. If the correlation is via source code, UDT pays; CDT refuses. The crux is whether "source code" counts as a variable under the agent's control.

  ### (d) Statement on Verbal Disputes

  Both parties acknowledge that a portion of this dispute may be verbal, specifically regarding the definition of the term "Rational."

  *   **CDT Signatory:** I regard the dispute as partially verbal. If "Rational" means "acting to bring about the best outcomes given current causal leverage," I am correct. If "Rational" means "having the disposition that yields the best outcomes over a lifetime," UDT is correct. I maintain the former is the more useful definition for guiding action in the moment.
  *   **UDT Signatory:** I regard the dispute as partially verbal, but only superficially. While we can define "Rational" either way, the substantive question is which algorithm wins in a tournament of agents. Since the UDT algorithm accumulates more utility in environments containing predictors, I maintain that the UDT definition captures the functional essence of rationality, making the verbal distinction less significant than the performance gap.

  We agree that further collaboration should focus on defining the class of environments where the performance gap between our frameworks becomes negligible versus significant, rather than debating the label "Rational."

  ***

  **Signed,**

  _________________________
  *Proponent of Causal Decision Theory*

  _________________________
  *Proponent of Updateless Decision Theory*
