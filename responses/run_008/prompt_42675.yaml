such as the multiple origins of agriculture and writing, or formal models of increasing returns. Last, given our two numbers, tell me whether my friend and I most plausibly disagree about the dynamics (term i), the ontology of outcome-sameness (term iii), or about what "rerun with micro-perturbations" even means.
