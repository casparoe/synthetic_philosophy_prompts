answer: |-
  The forecasting tournament presupposes accuracy-first epistemology and probabilism, but the choice of scoring rule reveals that the practice relies on a specific, contestable utility function over errors rather than a unique vindication of credence alone.

  The leaderboard only makes sense under a view where belief is gradated (probabilism) and the primary epistemic good is closeness to the truth (accuracy-first). By requiring a number rather than a qualitative judgment, the practice rules out binary belief accounts unless those accounts treat probabilities as mere heuristic proxies for underlying binary states. By scoring based on the match between credence and outcome rather than the practical consequences of acting on that credence, the practice assumes epistemic value is separable from pragmatic utility. The proper scoring rule (PSR) is the mechanism that aligns the forecaster's incentive with this epistemic goal; it ensures that expected score is maximized only by reporting one's true credence. This forces a commitment to the view that rationality consists in maximizing expected epistemic utility, where utility is defined strictly by accuracy.

  The tension you notice between calibration and resolution is resolved by the mathematical decomposition of proper scoring rules. A PSR like the Brier score decomposes into Calibration, Resolution, and Uncertainty (Murphy decomposition). Calibration measures whether events happen at the frequency you predicted; Resolution measures whether you successfully separated high-probability events from low-probability ones. A forecaster who says 50% on everything is perfectly calibrated but has zero resolution. The scoring rule penalizes this lack of resolution because it fails to reduce uncertainty. Thus, the "virtue" celebrated is not calibration alone, but *informativeness subject to calibration*. The combination is coherent because the scoring rule treats calibration as a constraint and resolution as the objective function; they do not pull apart because the score drops if you sacrifice calibration for resolution (overconfidence) or resolution for calibration (hedging).

  However, the choice between scoring rules (e.g., Brier vs. Log-loss) introduces a normative element that accuracy-first epistemology does not settle. Both are proper, meaning both incentivize truth-telling, but they value errors differently. Log-loss penalizes confident errors much more severely than Brier. If you assign 99% to a falsehood, Log-loss crushes you; Brier hurts you less. This implies the tournament organizer has made a decision about the relative disvalue of surprise versus average error. Accuracy-first theory tells you to maximize accuracy, but it does not uniquely specify the metric of distance from the truth. Consequently, the practice does not merely vindicate probabilism; it vindicates probabilism combined with a specific risk attitude toward epistemic error. If you believe being confidently wrong is epistemically worse than squared-error suggests, you choose Log-loss; if you prefer a measure closer to Euclidean distance, you choose Brier. This choice is axiological, not purely logical.

  Rival views would struggle to run the same tournament without modification. A binary-belief theorist could participate but would view the requirement to issue non-0/1 probabilities as forcing them to simulate granularity they believe doesn't exist ontologically; the tournament would be measuring their ability to hack a system rather than their actual belief state. A safety-based or risk-averse epistemologist (e.g., a rank-dependent utility theorist) would advise against extremizing probabilities even when evidence supports them, to avoid catastrophic epistemic risk. Under a PSR, this caution is penalized as underconfidence. Therefore, a safety-based defender could not run the same tournament with a clear conscience unless they changed the scoring rule to reward robustness over expected accuracy. The current practice implicitly rejects safety-based norms in favor of expected utility maximization.

  My reconstruction is forced on the link between PSRs and accuracy-first norms: if you accept PSRs as the incentive mechanism, you are committed to maximizing expected accuracy. However, I could be wrong about the exclusivity of this commitment. It is possible that PSRs inadvertently track other epistemic goods, such as understanding or explanatory power, if those goods correlate with calibration and resolution. Furthermore, my verdict that the practice presupposes accuracy-first epistemology relies on the assumption that there are no non-accuracy-based reasons to use PSRs. If it were demonstrated that PSRs optimize long-term survival or pragmatic success rather than truth-tracking per se, the epistemological foundation would shift from accuracy-first to pragmatist. The reasoning is most likely to fail if imprecise probabilism is correct; if rational credence is sometimes a range rather than a point, the requirement to commit to a single number forces an artificial precision that violates epistemic norms, making the leaderboard a measure of compliance rather than rationality. To flip my verdict, one would need to show that accuracy is derivative of a more fundamental norm (like coherence or understanding) or that the specific metric of accuracy chosen (Brier vs. Log) is arbitrary in a way that undermines the claim that the tournament measures "epistemic virtue" rather than "fit for a specific purpose."
