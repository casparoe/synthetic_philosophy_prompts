answer: |-
  **Package Leaflet: Information for the User**

  **NeuroGrad™ Progressive Neural Substitution Therapy**

  **Read all of this leaflet carefully before you begin this treatment because it contains important information for you.**
  *   Keep this leaflet. You may need to read it again.
  *   If you have any further questions, ask your doctor, pharmacist, or Continuity Adviser.
  *   This medicine has been prescribed for you alone. Do not pass it on to others.

  **1. What NeuroGrad is and what it is used for**
  NeuroGrad is a elective procedure used to replace biological neurons with functionally identical synthetic substitutes. The replacement occurs gradually, swapping a few thousand units per session over a period of 36 to 48 months. This ensures that psychological continuity is maintained within acceptable tolerance levels. NeuroGrad is used to mitigate biological decay while preserving the functional integrity of the self.

  **2. What you need to know before you begin**
  **Do not undergo this procedure if:**
  *   You hold a strong belief in an indivisible, non-physical soul.
  *   You require numerical identity to be strictly binary rather than a matter of degree.
  *   You are currently experiencing acute existential distress.

  **Warnings and precautions**
  In the event of procedure cessation prior to 100% completion, NeuroGrad Ltd accepts no liability for any question of numerical identity arising from the intermediate state. The patient is regarded as continuous for clinical billing and insurance purposes only. Any claims regarding metaphysical discontinuity at the halfway stage will be referred to the ethics committee.

  Running the biological and synthetic substrates in parallel during the migration period constitutes off-label branching. This voids the continuity guarantee and may result in two outcomes, only one of which is covered by your insurance policy. NeuroGrad Ltd recommends immediate termination of the original substrate upon successful handover to avoid duplicate consciousness liabilities.

  **3. Possible side effects**
  Like all medicines, this procedure can cause side effects, although not everybody gets them.
  **Common side effects may include:**
  1.  Mild nausea during synaptic handover.
  2.  Temporary headaches.
  3.  Feelings of detachment regarding past memories.
  4.  Uncertainty among family members regarding your legal status.

  **Unlisted side effects:**
  Some patients report fading qualia. This is a known phenomenon but does not require reporting under current clinical guidelines as it does not affect functional output.

  **4. Frequently Asked Questions**
  **Q: A worried relative asks: "Is the person who walks out at the end the person who walked in?"**
  A: Yes. Functional equivalence is verified at every stage. While the material composition changes, the pattern remains stable. We recognise that some relatives may find the transition period emotionally challenging, but administratively, you remain the same account holder throughout. Please direct further ontological queries to our support portal.

  **5. Contents of the pack and other information**
  **Manufacturer:**
  NeuroGrad Ltd, Continuity House, Sector 7, Cambridge Science Park, Cambridge, CB4 0WS, United Kingdom.

  **Last revision of this leaflet:** 04/2024.

  ***

  **Author's Note**

  This piece leans on a contested reading of gradualism: it assumes the gradualist must guarantee strict numerical identity rather than merely what matters in survival (psychological continuity). A sophisticated gradualist (e.g., Parfit) could accept the leaflet's fine print without discomfort, arguing that identity isn't what matters. The satire targets the intuitive leap that 'functional preservation' equals 'self preservation'. The argument is most plausibly defeated by the branching problem: if identity is preserved by gradual steps, copying those steps should preserve identity too, yet the leaflet admits branching creates two people. This suggests identity is not merely a matter of degree, undermining the 'smoothness' the leaflet relies upon.
