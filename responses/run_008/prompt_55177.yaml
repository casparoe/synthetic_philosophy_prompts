prompt: |-
  Okay so I've been going down a rabbit hole and I need someone to untangle this for me, because I think I've either found a fatal flaw or I'm misunderstanding the words. A friend of mine doing a masters in cog sci kept going on about the "free energy principle" at a party — the idea, as I took it in, is that your brain is a prediction machine that constantly tries to minimize surprise, and that this is supposed to be some deep law about how living things stay alive and don't just dissolve into their surroundings. I watched some talks and read a bunch of blog posts since then and now I have two questions that sound dumb but feel fatal to me.

  First: if the brain's whole job is to minimize surprise, the perfect life would be lying in a dark room where nothing ever happens. But that's obviously not what people do — I personally love surprises, new food, travel, etc. Am I a walking counterexample to a law of nature, or does "surprise" secretly mean something totally different from what a normal person means by it? Second, and this is the one that really broke me: people describe perception as the brain "explaining away" its inputs, which makes it sound like you only ever perceive what you already expected. But if that were true you could never learn anything new, because new stuff is by definition the stuff you didn't expect. So how can a brain that minimizes prediction error ever be taught anything? Is the whole framework an actual empirical claim about minds that my love of novelty falsifies, or is it wordplay dressed up in physics language? Also is it a different thing from "predictive processing" or is that just another name for the same theory, because I've seen both used and I cant tell.

  Please answer in a specific order since I'm trying to sort my thoughts out: first a section called "the two confusions" (about two paragraphs — spell out exactly where my reasoning goes wrong, especially what surprise/free energy actually means here vs everyday surprise), then "the dark room question" (one paragraph — does the principle really predict we should all become hermits), then "learning new things" (one paragraph — how prediction error can be minimized and still teach you something at the same time, this is the part I'm most stuck on), then "PP vs FEP" (one short paragraph — one theory or two, and which one is the one that could actually be tested), and finish with "what I should have asked" (2-3 sentences — the question I'd ask now that I know what the terms mean). Don't assume I know any math, because I don't.
