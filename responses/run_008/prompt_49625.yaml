answer: |-
  You have identified the central fracture in welfare economics. The short, straight answer you have never gotten is this: **Standard discounting practice presupposes that future lives are ethically equivalent to present lives, but economically inferior.**

  The ambiguity you suspect is not a bug; it is the load-bearing wall that keeps the structure from collapsing under either fiscal absurdity or ethical condemnation. To take the practice seriously as a philosophical object, we must dissect the Ramsey Rule, which is the engine of discounting, and separate what is technically required from what is ethically smuggled in.

  ### 1. The Theory of Value: Weighted Utilitarianism with Temporal Discrimination

  The standard formula for the social discount rate ($r$) is the Ramsey Equation:
  $$r = \delta + \eta \cdot g$$

  *   **$\delta$ (Pure Time Preference):** This is the ethical weight. If $\delta > 0$, the theory presupposes that a unit of welfare occurring later is intrinsically less valuable than a unit occurring now, *ceteris paribus*. Frank Ramsey himself called this "ethically indefensible." If your government uses a $\delta$ of 1% or 2%, it is explicitly encoding the view that **future people count less simply because they are born later.**
  *   **$\eta \cdot g$ (The Wealth Effect):** $\eta$ is the elasticity of marginal utility of consumption (how fast the value of a dollar drops as you get richer), and $g$ is growth. This part presupposes **diminishing marginal utility.** It says a dollar (or a statistical life saved) matters less to a rich future person than to a poorer present person.

  **The Philosophical Presupposition:**
  Strictly speaking, the practice presupposes a form of **prioritarianism** (we care more about the worse off) applied across time, combined with **temporal discrimination** (via $\delta$).

  However, in public guidance, these two are deliberately conflated. Agencies often justify the *entire* rate ($r$) using the "opportunity cost of capital" argument (money can be invested). This is a category error. The opportunity cost of capital explains why we discount *financial* flows for efficiency. It does not explain why we discount *lives* or *suffering* for equity. By using the financial justification to defend the ethical rate, the practice avoids admitting that it is assigning a lower intrinsic weight to future citizens.

  ### 2. Is the Ambiguity Load-Bearing?

  **Yes.** The ambiguity between "money is worth less to the rich" and "later lives are worth less, period" is the only thing allowing the system to function.

  *   **If you admit it's all $\delta$ (Pure Time Preference):** You face the ethical charge of discrimination by date of birth. This violates the standard liberal democratic premise of intergenerational equity.
  *   **If you admit it's all $\eta \cdot g$ (Wealth Effect):** You face the "Stern Review" problem. If you assume future people will be richer ($g > 0$) but set $\delta = 0$ (no discrimination), the discount rate drops very low. This implies we should sacrifice almost all current consumption to invest for the future, because the compounded benefit to the vast number of future people outweighs our current pain. This is fiscally and politically impossible.

  The practice survives by claiming the rate is driven by $\eta \cdot g$ (which sounds neutral and economic) while actually relying on a non-zero $\delta$ to keep the rate high enough to prevent current budgets from being swallowed by future obligations. The ambiguity allows policymakers to claim they are being "economically realistic" while effectively making an ethical choice to prioritize the present.

  ### 3. Discounting Lives vs. Discounting Money

  You asked whether discounting operates on welfare itself or only on units like money.

  In strict Cost-Benefit Analysis (CBA), we do not discount "lives." We discount the **Value of a Statistical Life (VSL)**.
  *   **The Mechanism:** VSL is derived from wage-risk premiums. It is income-elastic. As societies get richer, people are willing to pay more to reduce risk. Therefore, the VSL in 2100 should be *higher* than today.
  *   **The Conflict:** If you discount the *benefit* of saving a life at 5%, but the VSL *grows* at 3% (due to wealth), the net present value of saving a future life is still diminished.
  *   **The Presupposition:** This implies that while future people might value their own lives more (because they are richer), *we* value saving them less. The discount rate overrides the income adjustment.

  **On Non-Wealth Goods (Extinction/Species):**
  You are correct that this is a category error in standard CBA. If a good is a precondition for all future welfare (like a stable climate or non-extinction), discounting its loss implies that the total collapse of welfare in 2100 is worth less than a marginal cost today.
  *   **Strict Theory:** If the good is essential for existence, its marginal utility is infinite. It should not be discounted, or should have a negative discount rate (scarcity increases value).
  *   **Practice:** Agencies usually force these goods into the standard discounting framework by estimating a "shadow price." This presupposes that existential risks are commensurable with current GDP. It is a methodological failure disguised as rigor.

  ### 4. Declining Discount Rates: Coherent or Compromise?

  You asked if declining-rate schedules (high now, low later) can be derived from a coherent view.

  **The Coherent View (Weitzman Uncertainty):**
  Martin Weitzman showed that if you are uncertain about the *correct* discount rate, the effective rate declines over time. Why? Because in the long run, the lowest possible discount rate dominates the calculation (due to compounding). If there is a non-zero chance the "right" ethical rate is near zero, that possibility swamps the others over centuries. This is philosophically coherent: it is an expression of **epistemic humility**.

  **The Political View:**
  However, in practice (e.g., UK Treasury, French guidelines), the specific trajectory is often calibrated to balance budget constraints with climate targets.
  *   **Short term:** High rate prevents current projects from looking too expensive.
  *   **Long term:** Low rate prevents climate models from recommending infinite spending.
  *   **Verdict:** It is a compromise, but a "reflective equilibrium" compromise. It acknowledges that while we might act impatiently now (revealed preference), we cannot ethically justify abandoning the distant future. It splits the difference between *descriptive* discounting (how we actually behave) and *normative* discounting (how we should behave).

  ### 5. The Zero Pure Time Preference Scenario ($\delta = 0$)

  If a government adopted $\delta = 0$ strictly:

  1.  **The Dominance Effect:** Yes, far-century benefits would dominate. Because the population of the future is potentially vast (even with declining birth rates, the cumulative sum is huge), any small probability of existential catastrophe prevention would justify massive current expenditure.
  2.  **Is it a Reductio?**
      *   **Of the Ethics?** No. Philosophers like Peter Singer or Derek Parfit would argue this is the *correct* ethical outcome. We *do* owe that much to the future.
      *   **Of the Method?** **Yes.** This reveals that CBA is not a moral calculator; it is a tool for **marginal allocation**. CBA assumes linearity and commensurability. It breaks down when the stakes are existential or when the trade-off requires sacrificing the basic functioning of the present society.
      *   **The "Tyranny of the Future":** If $\delta = 0$, the present generation becomes a slave to the future. This violates the idea that each generation has a right to its own flourishing. A coherent theory of intergenerational justice likely requires a "sufficiency" constraint (leave them enough) rather than a "maximization" constraint (maximize their utility), which CBA cannot handle.

  ### Summary: What the Practice Presupposes

  If we strip away the technical jargon, the practice of government discounting presupposes:

  1.  **Consequentialism:** The right action is the one that maximizes the net present value of welfare.
  2.  **Diminishing Marginal Utility:** A dollar (or life saved) is worth less to a rich person than a poor one.
  3.  **Implicit Temporal Discrimination:** Despite rhetoric about sustainability, the use of a non-zero "pure" rate presupposes that the welfare of future people is intrinsically less weighty than the welfare of current voters.
  4.  **Commensurability:** It presupposes that existential risks, species loss, and human lives can be traded off against current consumption costs without remainder.

  **The Straight Answer:**
  The ambiguity is load-bearing. The practice requires the **wealth effect** ($\eta \cdot g$) to be economically coherent, but it relies on the **pure time preference** ($\delta$) to be politically viable. By conflating them, governments avoid admitting that they are mathematically encoding the decision that a death in 2100 is worth less than a death today, not because the future person is richer, but because they do not exist yet.

  If you remove the ambiguity and set $\delta = 0$, CBA breaks because it demands infinite sacrifice. If you remove it and set $\delta$ high, the ethics break because it admits to discrimination. The "messy" practice exists to keep both contradictions at bay.
