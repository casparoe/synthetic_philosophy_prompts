  I've been thinking about dispositions, and I've realized my gut verdicts across a bunch of cases don't obviously add up to one story, so maybe you can help me find the principle, if there is one.

  Baseline stuff first. A wine glass on the shelf: fragile, obviously. That same glass wrapped in three inches of bubble wrap: still fragile, it just can't show it -- the wrapping blocks the shattering but doesn't touch what the glass is like. Now a glass that a wizard has enchanted so that, just before any blow could land on it, the glass would be transmuted into sturdy steel: I say that glass is NOT fragile. The wizard would remove the very thing that made it fragile before anything could set the disposition off. So far, so good, I think -- the bubble wrap is a mask and preserves the disposition, the wizard is a fink and destroys it.

  Here's where my gut starts making trouble.

  First case: reverse fink. The glass is currently made of sturdy stuff, but a demon would transmute it into ordinary fragile glass a split second before any impact. So it WOULD shatter if struck, and it would shatter as fragile glass, but I still want to say it's not fragile right now. I can feel the pull of the simple view -- fragile just means would break if struck, and this thing would -- but my verdict won't budge. Am I allowed to hold that?

  Second case, and this is the one I really can't reconcile. My irritable colleague: genuinely irritable, snaps at people constantly. His long-suffering teammate now watches him like a hawk and slips a sedative into his coffee the moment she sees a provocation brewing, so he never actually snaps anymore. I say he is STILL irritable. The disposition is fully there in him, it's just that the sedative arrives before the provocation does. But wait -- that's exactly what the wizard does to the glass, intervening before the trigger, and there I said the disposition is gone. So I've got two structurally identical pre-trigger interventions, and I save the disposition in one case and kill it in the other. I genuinely can't tell if there's a real difference there (something like: the sedative removes the route from irritation to outburst but leaves the irritability itself alone, while the wizard removes the fragility itself?) or if I'm just being sentimental about the guy because he's a person and not a glass.

  Third case: the exhibition glass, sealed in a vacuum chamber where nothing can ever strike it, forever, by design. I say still fragile, same as the bubble wrap. Fine, easy.

  Fourth: an athlete who is brilliant in every low-stakes match but chokes the instant the pressure goes up -- converts every match point into a loss. I say he does NOT have the disposition to win matches, but he DOES have genuine skill, and matches are what skill is for, so I can't figure out how both of those can be true at once. What exactly is the choking blocking, if not the skill?

  So: is there a principle that gets all of these, or close? Maybe something about whether the interfering factor targets the disposition's own causal basis versus the pathway from trigger to manifestation, or maybe about intrinsic versus extrinsic blockers -- I honestly don't know. What I'd like from you is (a) the principle, stated as precisely as you can, with each clause motivated by whichever of my verdicts needs it, (b) an honest accounting of which of my verdicts it can't save and which one you'd tell me to give up, and (c) its verdict on a case I haven't mentioned: a chess engine with a bug that makes it crash exactly in the positions where it has a forced win -- the bug isn't targeted at winning as such, it just happens that those are the positions where it runs out of memory. Does that thing have the disposition to win games or not? I keep flip-flopping.
