  ### The Rules Behind the Record
  Looking at her five prior verdicts, we can distill three competing principles she is balancing. They all fit the past data, but they collide on the Decretalist case.

  **1. The Settledness Constraint (The Card Rule)**
  *   **Principle:** Objective chance only applies to open futures. If an event is metaphysically settled (past or determined), the chance is 0 or 1. Any other number is merely epistemic ignorance.
  *   **Track Record:** Explains the Face-Down Card (no deference) vs. the Coin/Die/Bohm (deference).
  *   **Verdict on Decretalist:** **Defer.** Presumably, the decreed event is in the future and not settled by the decree itself (only the *chance* is settled).

  **2. The Empirical Priority Constraint (The Wheel Rule)**
  *   **Principle:** Deference is owed to *actual* physical chance, not *claimed* chance. If a sign (or theory) claims a probability, but empirical measurement reveals a different physical bias, the measurement trumps the claim.
  *   **Track Record:** Explains the Casino Wheel (ignore sign, match measurement).
  *   **Verdict on Decretalist:** **No Deference.** There is no physical dynamics or frequency here. The decree is a "claim" without physical grounding. If she requires chance to supervene on physical facts, this fails.

  **3. The Theoretical Posit Constraint (The Bohm Rule)**
  *   **Principle:** If the best governing theory of the world assigns a probability to an event, you defer to it, even if the underlying ontology is deterministic. Chance is a role played by the theory, not just a feature of the particles.
  *   **Track Record:** Explains the Bohmian Spin (deterministic physics, but defer to Born rule).
