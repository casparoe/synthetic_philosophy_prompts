  2.  **The Bohm Precedent:** The Bohmian case is the strongest signal. It proves she is willing to decouple "chance" from "fundamental indeterminism." In Bohm, the chance comes from a measure over initial conditions (typicality), not stochastic dynamics. In the Decretalist case, the chance comes from a measure over divine will (stipulation). Both are "theoretical measures" rather than "physical propensities." If she accepted the former, consistency demands she accept the latter, provided the case stipulates the decree is *constitutive*.
