answer: |-
  **Seminar Reading: The Box and the Ballot — Randomness, Ritual, and Responsibility**

  **Introduction: The Provocation**

  We begin this unit on sortition with a provocation. The theoretical case for lottocracy rests on the moral neutrality of randomness. Advocates argue that selection by lot is a great leveller: it strips away the advantages of wealth, incumbency, and ambition, distributing political power as a common possession. It dissolves the incentive structure that produces career politicians, because nobody can campaign for a role that is drawn.

  Shirley Jackson's *The Lottery* depicts a community that also treats randomness as a great leveller. In the story, the annual ritual is legitimated by the equality of the draw: every head of household takes a slip, the odds are identical, and no individual is singled out by malice. When Tessie Hutchinson protests the final result, she does not argue that the lottery itself is unjust, but that the specific draw was rigged against her. She accepts the logic of the mechanism while rejecting its outcome.

  This pairing is designed to test the limits of procedural fairness. If randomness can legitimate a stoning in Jackson's village, can it legitimate a legislature in ours? This reading outlines three ways to approach the text in seminar: first, as a critique of randomness-as-legitimation; second, as a category error regarding the nature of political office; and third, as an inquiry into who controls the machinery of selection.

  **I. The Procedural Trap: Fairness Without Justice**

  The strongest version of the claim that *The Lottery* critiques sortition is not that random selection is inherently violent, but that procedural fairness can mask substantive injustice. The villagers are obsessed with the correctness of the process. They worry about the timing of the draw, the condition of the black box, and the proper recitation of names. There is a palpable relief in the village that the ritual remains intact; the equality of the chance distributes the moral burden so thinly that no single person feels responsible for the death.

  For the sortition advocate, the random draw is a tool to achieve a just end (representative governance). For Jackson's villagers, the random draw *is* the end. The fairness of the odds substitutes for the fairness of the outcome.

  **Seminar Focus:** Direct students to the opening scenes. Note the casual conversation before the draw begins. The lottery is treated as a civic duty, akin to a town hall or a square dance. The horror relies on the banality of the administration.
  **Theoretical Link:** This mirrors the "accountability" objection to sortition. If representatives are chosen by lot, they cannot be voted out. If the system produces bad laws, who is to blame? The lottery suggests that when selection is random, responsibility is diffused. The villagers stone Tessie together; in a lottocracy, if the assembly fails, the blame falls on "chance" or "the people" generally, rather than specific representatives. Jackson forces us to ask: Does the fairness of the selection mechanism absolve us of the quality of the decision?

  **II. The Inversion of Office: Ruler vs. Victim**

  The most significant break in the analogy lies in what is being distributed. Sortition distributes *agency*; the lottery distributes *victimhood*.

  In democratic theory, we randomize the ruler to prevent tyranny. We assume that holding office is a good, or at least a neutral burden, and that the danger lies in people clinging to power. Jackson inverts this. In the story, the "offices" are effectively stable. Mr. Summers conducts the lottery year after year; Mr. Graves, the postmaster, swears him in and carries the box. These are the entrenched figures. The role that is rotated by lot is the role of the victim.

  This inversion offers a crucial correction to the anti-career-politician strand of the sortition case. The argument for lottocracy assumes the damage is done by people who seek and hold office. *The Lottery* suggests the damage may be done by people who administer the system while remaining untouched by its risks. Mr. Summers is the ultimate career politician: he controls the schedule, the box, and the slips, yet he never risks being selected.

  **Seminar Focus:** Ask students to track Mr. Summers' actions. He arrives with the black box; he has replaced the old wooden chips with paper slips; he knows the rules by heart. Contrast this with Tessie Hutchinson, who arrives late because she was doing dishes.
  **Theoretical Link:** This speaks directly to the "manipulation of the selection machinery" objection. In modern citizens' assemblies, who decides the stratification criteria? Who designs the algorithm? If the "Mr. Summers" of a citizens' assembly controls the recruitment pool, the randomness is merely a veneer over entrenched power. The story warns us that we must randomize the *administrators* or the *rules*, not just the participants, or else the lottery becomes a tool for the Summerses to sacrifice the Tessies.

  **III. The Argument from Tradition**

  The story contains its own reform debate, which maps neatly onto constitutional conservatism. When Mr. Adams mentions that some villages have given up the lottery, Old Man Warner responds that abandonment invites trouble. He cites the rhyme: "Lottery in June, corn be heavy soon."

  This is the argument from tradition in its purest form. Warner does not argue that the lottery is efficient or moral; he argues that it is ancestral and that breaking the chain invites catastrophe. In sortition debates, this mirrors the defense of existing bicameral systems or electoral colleges. Reformers argue for random selection as a modernization; conservatives argue that existing institutions, however flawed, contain accumulated wisdom and stability.

  **Seminar Focus:** The conversation between Warner and Adams. Note that Warner calls the younger generation a "pack of crazy fools."
  **Theoretical Link:** Use this to discuss the "competence" objection. Warner implies the lottery serves a function (harvest) that the reformers don't understand. Sortition critics often argue that elected representatives develop expertise that random citizens lack. Jackson shows us the dark side of this functionalism: sometimes the "function" of a tradition is merely its own continuation, sustained by the fear that stopping it will cause collapse.

  **IV. What the Story Adds: The Sociology of Randomness**

  If the analogy breaks on the distinction between power and death, what does the story add that standard theoretical arguments do not capture? It captures the *social cohesion* aspect of random selection.

  Standard arguments focus on epistemic value (do random citizens make better laws?) or normative value (is it more fair?). Jackson focuses on the sociological value: randomness binds the community through shared risk. The villagers are united not by governance, but by the shared relief that *they* were not chosen this year.

  This highlights a danger for lottocracy: does random selection create a legislature that is too insulated? If representatives are chosen by lot, they do not need to build coalitions or persuade the public to gain power. They are insulated from the people in a different way than elected officials are. Jackson suggests that randomness can create a community of bystanders. The villagers do not stop the stoning because they are all complicit in the system that allowed it.

  **Seminar Focus:** The final scene. Tessie's family members are given stones. Her own children participate. The randomness has successfully turned neighbors and kin into executioners without personal malice.
  **Theoretical Link:** This complicates the "descriptive representation" argument. Proponents say a random assembly mirrors the people. Jackson shows that mirroring the people might just replicate the people's capacity for violence. If the assembly is a microcosm of the public, and the public is capable of injustice, the random assembly will not necessarily purify the outcome.

  **Conclusion: Testing the Analogy**

  You should not conclude the seminar by forcing the story to fit the theory. The analogy *should* break. *The Lottery* is not a story about democracy; it is a story about scapegoating. Sortition is a mechanism for distributing power; the lottery is a mechanism for distributing guilt.

  However, the break is philosophically productive. It forces us to distinguish between *randomness as a means* and *randomness as an end*. Sortition advocates treat randomness as a means to fair representation. Jackson shows that if randomness becomes the only legitimacy (the "fairness" of the draw), the purpose of the institution can rot away until only the ritual remains.

  Use the story to ask your students the final question: In a system of sortition, who holds the black box? If the answer is "a permanent administrator," "a political party," or "an algorithm we cannot inspect," then the lottery is not a tool of liberation. It is merely a way to ensure that when the sacrifice comes, we can all say, with clean hands, that it was only chance.
