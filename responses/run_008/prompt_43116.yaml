  *   **(b) Amodal Representation Survival:** 0.35
      *   *Justification:* Neuroplasticity during critical periods typically prunes uncalibrated cross-modal pathways, favoring modality-specific encoding.
  *   **(c) Clinical-to-Ideal Generalization:** 0.70
      *   *Justification:* Correcting retinal pathology removes hardware noise, but does not reverse cortical critical period closure for integration.
  *   **(d) Task Salience (Sphere vs. Cube):** 0.95
      *   *Justification:* These shapes maximize geometric contrast (curvature vs. vertices), offering the highest possible signal for any latent transfer.

  **Combination**
