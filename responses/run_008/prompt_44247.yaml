      *   Camp 1 says: If the method is good (3rd person), you are entitled (1st person) without knowing it's good.
      *   Camp 2 says: You are only entitled (1st person) if you have reason to think the method is good (3rd person).
      *   So the disagreement is about the *link* between the two questions. Camp 1 severs the link (Externalism). Camp 2 fuses the link (Internalism).
      *   *Wait, the User asks to test their hypothesis.* I need to be careful not to just replace it, but evaluate it.
      *   *Test:* Does Camp 1 care about 3rd person methods? Yes (Reliabilism). Does Camp 2 care about 1st person entitlement? Yes (Fumerton's acquaintance requirement).
