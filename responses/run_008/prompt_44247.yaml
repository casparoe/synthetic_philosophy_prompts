      *   *Alternative 2: Bedrock Intuitions.* (Wright's "hinges", basic intuitions). This is a strong contender. The "intuition against bootstrapping" vs. the "intuition against skepticism." If these are brute, no argument resolves it.
      *   *Alternative 3: Conception of Justification.* Is justification deontological (blamelessness) or alethic (likelihood of truth)? Camp 1 leans alethic (reliability). Camp 2 leans deontological/responsibilist (don't be circular).

