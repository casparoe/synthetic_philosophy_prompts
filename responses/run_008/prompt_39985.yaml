answer: |-
  This is a sophisticated request that cuts to the bone of comparative meta-ethics. You are asking for a reduction of a soteriological system (Buddhism) into a normative ethical system (Consequentialism/EA).

  Here is the honest answer: **The translation project cannot be completed without doing violence to the core teleology of one or both systems.**

  You suspected the "intention" variable was the load-bearing failure. You are partially right, but the deeper failure is the *objective function*. EA seeks to maximize a value metric (welfare) within the system of samsara. Buddhism seeks to optimize the agent's relationship to the system such that they (and others) can exit it.

  Below is the piece-by-piece translation you asked for, followed by the residue report where I explain why the fit is fake.

  ---

  ### 1. Karma (Intention vs. Outcome)

  **The Concept:** *Cetana* (volition) is karma. The moral weight lies in the mental state at the moment of action, not the contingent results.

  *   **Clean Translation:** **Ex-Ante Expected Value.**
      In EA, we judge acts by expected value, not realized value, to avoid result-oriented bias. If you save a drowning child but they grow up to be a tyrant, your act was still morally good *ex ante*. Buddhism agrees: if the intention was compassionate, the karma is wholesome, even if the outcome is tragic. Both systems decouple moral worth from luck.
  *   **Bent Translation:** **Agent-Neutral vs. Agent-Relative Conditioning.**
      In EA, the "value" of the intention is instrumental; it matters because good intentions usually lead to good outcomes over time. In Buddhism, the intention *is* the fruit. It immediately conditions the mind-stream. EA cares about the world-state; Buddhism cares about the agent-state. Bending this requires viewing the agent's mental purity as a subset of "welfare" to be aggregated.
  *   **No Expression:** **Ontological Causality.**
      EA has no variable for "karmic seeds" that ripen across lifetimes independent of physical causality. In EA, if an intention doesn't causally impact welfare (even probabilistically), it is morally neutral noise. In Buddhism, a hateful thought generates bad karma *even if no one ever knows and no action is taken*. EA has no mechanism to account for the moral weight of private, causally inert mental states.

  ### 2. The Five Precepts (Sila)

  **The Concept:** Training rules (no killing, stealing, sexual misconduct, lying, intoxication).

  *   **Clean Translation:** **Rule Consequentialism / Heuristics.**
      EA often adopts rules ("don't lie," "don't kill") because case-by-case calculation is prone to bias and error. The Precepts function as high-reliability heuristics that prevent catastrophic negative value.
  *   **Bent Translation:** **Intrinsic Disvalue of Actions.**
      EA allows breaking the rule if the EV is clearly positive (e.g., kill the tyrant to save the village). Buddhism treats the precepts as much stricter constraints. To break them is to actively cultivate the mental states (greed, aversion, delusion) that bind one to suffering. Translating this requires bending EA to accept "agent-integrity" or "virtue" as a terminal value, not just an instrumental one.
  *   **No Expression:** **Training for Renunciation.**
      The Precepts are not just social contracts; they are training wheels for *nekkhamma* (renunciation). They are designed to reduce sensory engagement and craving. EA seeks to satisfy preferences (welfare); the Precepts seek to reduce the *velocity* of preference formation. EA has no variable for "reducing the intensity of desire" as a good in itself.

  ### 3. Rebirth (Time Horizon)

  **The Concept:** Beings cycle through existences indefinitely until liberation.

  *   **Clean Translation:** **Longtermism / Infinite Horizon.**
      EA's longtermism extends the consequence horizon to the heat death of the universe. Rebirth extends it indefinitely. Both demand we care about consequences far beyond our biological lifespan.
  *   **Bent Translation:** **The Value of Existence.**
      EA generally assumes existence is a prerequisite for welfare, so more lives (of good quality) is better. Buddhism views rebirth as *dukkha* (unsatisfactoriness). The goal is not to maximize the number of good rebirths, but to cease rebirth entirely. Translating this requires viewing "Nirvana" (cessation) as a form of "welfare," which stretches the definition of welfare to the breaking point.
  *   **No Expression:** **Exit Strategy.**
      EA is an optimization problem *within* the game. Buddhism is a strategy to *stop playing* the game. There is no EA equivalent for "the optimal outcome is the cessation of the subject who experiences the outcome."

  ### 4. Compassion (Karuna/Metta)

  **The Concept:** The wish for beings to be free from suffering.

  *   **Clean Translation:** **Impartial Benevolence.**
      EA's core axiom is that all suffering counts equally. Buddhism's *metta* is boundless and impartial. Both reject tribalism and demand universal concern.
  *   **Bent Translation:** **Wisdom-Constrained Compassion.**
      EA compassion is often "help them get what they want" or "stop them from hurting." Buddhist compassion is "help them see reality." Sometimes this means allowing short-term suffering (e.g., a meditation retreat, a hard truth) to prevent long-term delusion. EA struggles to justify inflicting suffering for "spiritual" gains that aren't easily mapped to QALYs.
  *   **No Expression:** **Non-Dual Empathy.**
      In EA, there is a helper and a helped (subject/object). In advanced Buddhist practice, compassion arises from the realization of non-separation. The "aggregation" of welfare implies distinct buckets of utility to be summed. Buddhism denies the ultimate reality of the buckets. You cannot aggregate what is empty of self-nature.

  ### 5. No-Self (Anatta)

  **The Concept:** There is no permanent, unchanging agent behind experience.

  *   **Clean Translation:** **Impartiality / Person-Neutrality.**
      EA treats persons as vessels for utility. My happiness counts for no more than yours. This mirrors the Buddhist de-centering of the ego.
  *   **Bent Translation:** **The Location of Value.**
      EA locates value in *experiences* (hedonic or preference). Buddhism locates the problem in the *grasping* at experience. EA says "maximize good experiences." Buddhism says "see experiences as empty." You can bend EA to value "insight," but EA fundamentally values the *content* of consciousness, while Buddhism values the *relationship* to content.
  *   **No Expression:** **Ontological Emptiness.**
      EA takes the "self" (or at least the "moment-of-experience") as a real unit of account. Buddhism argues that even the moment-of-experience is dependently originated and empty. EA aggregates utilities across time and persons. Buddhism argues that aggregation reifies entities that don't exist. There is no one to be saved, and no one to do the saving, only the process of suffering and its cessation.

  ---

  ### The Residue Report

  You asked me to be honest about whether the translation project is confused from the start. **It is.**

  Here is the specific breakdown of why the fit fails, and where the residue counts against the translation.

  #### 1. The Teleological Mismatch (The Load-Bearing Failure)
  You suspected "Intention" was the failure point. It is actually **The Good**.
  *   **EA Definition:** The Good is the maximization of welfare (preference satisfaction / reduction of suffering).
  *   **Buddhist Definition:** The Good is the cessation of *tanha* (craving/clinging).

  These are often correlated, but they are not identical.
  *   **Scenario:** A being is given a drug that makes them perfectly happy but deluded about reality.
  *   **EA:** High welfare. Good outcome.
  *   **Buddhism:** High delusion. Bad outcome (reinforces samsara).

  *   **Scenario:** A meditator undergoes intense psychological pain (dukkha) to breakthrough a delusion.
  *   **EA:** Negative utility. Needs justification via future gains.
  *   **Buddhism:** Noble suffering (*ariya dukkha*). Intrinsically valuable as part of the path.

  **Verdict:** The residue counts against the translation. You cannot map "Cessation of Craving" onto "Maximization of Welfare" without redefining Welfare so broadly it loses its utilitarian calculus.

  #### 2. The Aggregation Problem
  EA relies on **aggregation**. We sum QALYs across persons.
  Buddhism relies on **liberation**. We free beings from the illusion of personhood.

  If "no-self" is true, who is the welfare being aggregated?
  *   EA answers: "The momentary experience."
  *   Buddhism answers: "Aggregating moments of experience reinforces the illusion of a continuous self."

  EA wants to build a better prison (more comfortable cells). Buddhism wants to unlock the door. If you translate Buddhism into EA, you turn the Dharma into a welfare program. You lose the *soteriological* bite.

  #### 3. The Intention Variable (Your Hypothesis)
  You wrote: *"a worldview where the moral weight of an act is fixed by the agent's mental state at the moment of acting just is not going to fit inside outcome aggregation."*

  This is correct. In EA, intention is a **proxy** for outcome optimization. In Buddhism, intention is the **locus** of moral reality.
  *   In EA, if I intend to save you but fail, I update my priors and try a better method next time. The moral weight is on the *learning*.
  *   In Buddhism, if I intend to save you with pure compassion, the karma is wholesome *regardless* of whether I learn a better method. The moral weight is on the *purification*.

  EA is forward-looking (consequences). Buddhism is present-looking (quality of mind).

  ### Conclusion

  **Do not force the fit.**

  If you translate Buddhist ethics into EA vocabulary, you end up with **Longtermist Rule Consequentialism with a focus on Mental Health.** That is a noble project, but it is not Buddhism.

  *   **EA** asks: "How do I make the world better?"
  *   **Buddhism** asks: "How do I wake up from the dream of the world?"

  The "Residue" is the difference between optimizing the dream and waking up.

  **My advice:** Keep the EA toolkit for your external engagement (career, donations, policy). It is superior for coordinating large-scale material welfare. Keep the Buddhist toolkit for your internal engagement (motivation, relationship to suffering, meaning). It is superior for managing the psychological toll of caring about the world and for addressing the existential questions EA ignores.

  Trying to run Buddhism on a Consequentialist OS will crash the Dharma. Trying to run Consequentialism on a Buddhist OS will crash the Charity. Run them in parallel containers. They are compatible as a lifestyle, but incompatible as a unified ethical theory.
