  7.  **Finalizing the "Residue":** The user asked: "which side you think the residue counts against." I need to take a stance. The residue counts against the *translation*, not necessarily either system. They are different games. EA is a game of scoring points. Buddhism is a game of realizing the scoreboard is made of fire.

