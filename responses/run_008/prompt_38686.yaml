answer: |-
  **Scenario A**
  During a routine Monday microscopy audit, the head brewer isolates a specific lactobacillus strain and calculates its metabolic rate, deducing independently that an infection would spike tank pressure to exactly 5 bar within two hours. Only after finalizing this hypothesis does she check the independent pressure logs from last Friday, discovering a recorded 5 bar spike at 2 PM.

  **Scenario B**
  On Tuesday, the head brewer examines the independent pressure logs from last Friday and sees a recorded 5 bar spike at 2 PM. She then adjusts her model of bacterial CO2 production rates, tweaking variables and assumptions precisely until the hypothesis predicts a 5 bar spike at 2 PM.

  ***

  **Walkthrough**

  **Actual-Prior Bayes:** In both scenarios, the agent knows $E$ (the pressure log) at the time of evaluating $H$. Thus $P(E) = 1$. The likelihood ratio $P(E|H)/P(E)$ equals $1/1 = 1$. Standard conditionalization awards **zero confirmation** to $H$ in both A and B.

  **Garbled Bayes:** We construct a counterfactual prior $P^*$ where the agent does not know $E$. However, the agent retains collateral knowledge $K$ (the safety valve record). Since the valve is calibrated to blow *only* at 5 bar, $K$ entails $E$. Therefore, even in the counterfactual state, $P^*(E|K) = 1$, making $P^*(E) \approx 1$. The likelihood ratio remains $\approx 1$. Garbled Bayes awards **zero confirmation** (or negligible) to $H$ in both A and B.

  **Intuition:** Common sense suggests a split. In **A**, $H$ feels confirmed; the agent predicted the data (even if old) via independent mechanistic derivation. In **B**, $H$ feels unconfirmed or weakly confirmed; the hypothesis was tuned to fit the data (accommodation). If you reject this split and believe history of construction is irrelevant, then intuition matches the Bayesian verdicts (zero for both), but this contradicts the standard predictivist intuition motivating the Old Evidence problem. Assuming the split holds: Garbling fails to recover confirmation for A, and fails to distinguish A from B.

  **Load-Bearing Feature:** The entailment relation between the retained collateral knowledge ($K$) and the old evidence ($E$). Because $K \to E$, stripping direct knowledge of $E$ is insufficient to lower $P^*(E)$ below 1, neutralizing the garbling solution regardless of how $H$ was constructed.

  **Bayesian Counterattacks:**
  (i) **The Bullet-Biter (Logicism):** This agent argues that confirmation is a logical relation between $H$ and $E$ given background knowledge, not a psychological history. Whether $H$ was found before or after $E$ is irrelevant causality; only the probabilistic support matters. If $P(E)=1$, there is no uncertainty to reduce, so no confirmation occurs. The intuition that A is better than B is a cognitive bias, not a normative rule of inference.
  (ii) **The Radical Garbler:** This agent argues you didn't garble enough. To properly assess $H$'s support, you must strip *all* knowledge that entails $E$, including $K$. If you remove the valve record, $P^*(E)$ drops below 1, and confirmation is restored. The cost is holism: stripping $K$ might alter the prior on $H$ itself, but this is the price of solving Old Evidence.

