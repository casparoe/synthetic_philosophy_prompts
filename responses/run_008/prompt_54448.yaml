answer: |-
  ### Exam Question

  **Course:** PHIL 405: Teleology and Explanation in the Life Sciences
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question:**

  Consider the dispute between etiological (selected-effect) accounts of biological function (e.g., Wright, Millikan, Neander) and causal-role (systems) accounts (e.g., Cummins). Evaluate these accounts by applying them rigorously to the following three cases:

  1.  **The Mammalian Middle Ear:** The malleus and incus are homologous with bones that formed the jaw joint in reptilian ancestors. They were co-opted for sound transmission across a long transitional series. What function do these bones have? Your answer must apply equally to the start of the transition, the middle, and the present day.
  2.  **The Stem-Cell Heart:** A human heart is grown *de novo* from induced pluripotent stem cells and implanted. It pumps adequately for two years, then develops a persistent arrhythmia. Does this organ have functions in the full sense? Is the surgeon who labels it "dysfunctional" speaking strictly or loosely?
  3.  **The Natriuretic Peptide Dispute:** Two physiologists disagree on whether secreting natriuretic peptide counts as a *function* of the heart, given that the endocrine role is a late addition to a structure selected for pumping. What would settle this disagreement, and is it possible that nothing can?

  In your essay, you must address two overarching philosophical issues:
  *   **Normativity:** Can the normativity of function talk (the ability to say a trait is *supposed* to do X and is *failing*) be recovered on a pure causal-role account, or does it require an etiological standard?
  *   **Substance vs. Verbal Dispute:** Is the dispute between these accounts substantive or merely verbal? You are explicitly warned against "lazy pluralism" (the claim that both are simply useful for different purposes). To score highly, you must either defend one account as metaphysically fundamental or articulate the requirements for a principled hybrid.

  ***

  ### Model Answer

  The dispute between etiological (selected-effect) and causal-role accounts is substantive, not verbal, because only the etiological account grounds the normativity essential to biological explanation. While causal-role analysis accurately maps capacities, it cannot distinguish between a function and a mere side-effect without reference to history. A principled philosophy of biology must treat etiological function as fundamental, subsuming causal roles as the mechanisms by which selected effects are achieved.

  Consider the **mammalian middle ear**. On a causal-role account, the function of the malleus and incus is simply whatever contribution they make to the containing system's capacity (sound transmission). However, at the *start* of the evolutionary transition, these bones contributed to jaw articulation, not hearing. In the *middle* of the transition, they likely performed both, inefficiently. A pure causal-role account must attribute "hearing function" to the bones even when they were primarily jaw supports, provided they transmitted some vibration. This dissolves the distinction between adaptation and exaptation. An etiological account handles this by tying function to the specific selection pressure active at the time. Initially, their function was chewing; eventually, hearing. The "middle" presents a challenge for etiology, but a solvable one: function tracks the specific selective maintenance of the trait. If the trait is maintained *because* it aids hearing, it has a hearing function. If it is maintained for chewing, it does not. This historical precision is necessary to explain why the bones are *for* hearing now, whereas they were not before.

  This historical grounding is crucial for **normativity**, as seen in the **stem-cell heart**. The *de novo* heart has no selection history of its own. A causal-role account says it functions as long as it pumps. When it develops an arrhythmia, the causal-role theorist must say its capacities have merely changed. They cannot strictly call it "dysfunctional," only "different." Yet the surgeon's judgment is not loose; it is a rigorous assessment of failure. To recover this normativity, we must appeal to the etiological history of the *type* from which the token was derived. The stem-cell heart is dysfunctional because it fails to perform the effects for which hearts of that type were selected. A pure causal-role account cannot support the "ought" inherent in pathology; it can only report the "is" of capacity. Therefore, the surgeon is speaking strictly only if function is grounded etiology.

  Finally, regarding the **natriuretic peptide (NP) dispute**, the causal-role theorist must concede NP secretion is a function because the heart causally contributes to osmoregulation. The etiological theorist asks: was the heart selected *for* this contribution? If NP secretion is a conserved, selected capacity, it is a function. If it is a spandrel—a necessary physical consequence of pumping without selective maintenance—it is not. What settles this is not physiological measurement (which only establishes causal role) but evolutionary analysis (which establishes etiology). If the physiologists disagree, it is because one is measuring capacity and the other is inferring history. This confirms the dispute is substantive: they are asking different questions, but only one question (the etiological one) captures teleology.

  Consequently, "lazy pluralism" fails. We cannot say both accounts are equally valid because they yield contradictory verdicts on normativity. The causal-role account is indispensable for explaining *how* a system works, but the etiological account is fundamental for explaining *what* the system is for. A principled hybrid is possible only if it recognizes causal roles as the mechanism of etiological functions, not as an alternative definition of function. Without the etiological standard, biology loses the ability to distinguish performance from malfunction, reducing life sciences to mere chemistry.

  ***

  ### Marking Scheme

  **Total Marks:** 25

  **1. Characterization of Accounts (4 marks)**
  *   **Criteria:** Clearly distinguishes Etiological (history/selection) from Causal-Role (capacity/contribution).
  *   **Typical Error:** Defining them solely by author names (e.g., "Cummins says...") without explaining the conceptual difference.
  *   **A vs. B:** B defines them correctly. A explains *why* they diverge (history vs. current capacity).

  **2. Analysis of Case A (Middle Ear) (5 marks)**
  *   **Criteria:** Addresses the transitional nature. Acknowledges the shift in function over time (jaw → ear).
  *   **Typical Error:** Claiming the function is "both" throughout or ignoring the "middle" of the transition.
  *   **A vs. B:** B notes the homology. A explains how etiology tracks the *change* in selection pressure while causal-role obscures it.

  **3. Analysis of Case B (Stem Cell) & Normativity (6 marks)**
  *   **Criteria:** Identifies that the stem-cell heart lacks direct history. Argues whether "dysfunctional" is strict or loose based on the chosen theory. Links this directly to the problem of normativity.
  *   **Typical Error:** Asserting the heart has functions because it looks like a normal heart, without explaining the metaphysical ground of that "ought."
  *   **A vs. B:** B says the surgeon is right. A explains *how* the surgeon can be right on an etiological view (token-type relation) but wrong on a strict causal view.

  **4. Analysis of Case C (Natriuretic Peptide) (4 marks)**
  *   **Criteria:** Identifies that physiological data alone cannot settle the dispute; evolutionary data is required.
  *   **Typical Error:** Suggesting more physiological experiments could settle whether it is a "function."
  *   **A vs. B:** B says it depends on the definition. A identifies that the disagreement is about selection history, not mechanism.

  **5. Substance vs. Verbal / Anti-Pluralism (6 marks)**
  *   **Criteria:** Explicitly rejects "lazy pluralism." Argues for one account as fundamental or defines a strict hierarchy for a hybrid.
  *   **Typical Error:** Concluding that "both are useful tools" without resolving the conflict in normativity.
  *   **A vs. B:** B argues both have uses. A argues that without etiology, *malfunction* is unintelligible, making etiology fundamental.

  **General Grading Notes:**
  *   **A Answer (20-25):** Commits to a position. Uses the cases to *test* the theories, not just illustrate them. Explicitly dismantles the "both are useful" compromise by showing where it breaks down (usually on normativity).
  *   **B Answer (15-19):** Competent description of theories. Applies cases correctly but descriptively. May retreat to pluralism to avoid conflict.
  *   **C Answer (10-14):** Recites definitions. Name-drops without application. Cases are mentioned but not reasoned through.
  *   **Fail (<10):** Confuses the accounts. Ignores the prompt's constraints on pluralism.
