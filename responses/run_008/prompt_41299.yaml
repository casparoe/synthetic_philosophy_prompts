prompt: |-
  Right, so I'm a philosophy professor — epistemology mostly, but I also run a module on the philosophy of history — and I need some help untangling something from last week's seminar. We were doing the "when does a legend become history" material (Troy, King Arthur, the Exodus), and a dust-up broke out that nobody actually resolved.

  The setup: one student was defending the idea that there's a historical core to the Exodus narrative. Her main move was to brush off the silence of the Egyptian record — no plagues, no mass departure, no Israelites, nothing — with the old slogan "absence of evidence isn't evidence of absence." Another student shot back that if that works, then King Arthur is historical too, because the silence of the near-contemporary sources is also just "absence," and Arthur is at least as well attested in later sources as the Exodus is. Then someone else chipped in that the Trojan War is a different case entirely, because there really is a Bronze Age city at Hisarlik in roughly the right place, so there the absence argument never even gets started. And then we ran out of time.

  Here's what I want from you. Take the slogan itself — "absence of evidence isn't evidence of absence" — and lay out, as a menu, the distinct precise theses it could be expressing. I'd guess there's a trivial reading, something like: silence never entails non-existence, i.e., lack of evidence doesn't prove the story false. That one's obviously true but does almost no work. Then there are stronger readings with actual content — e.g., that silence provides no evidential support against a story at all (no Bayesian update, if you like that framing), or that it provides some weight but never enough to justify outright disbelief. For each reading, tell me whether it's plausible, and — this is the important bit — whether it's strong enough to support the use my student put it to. My hunch is that the Exodus defence needs the strong "no evidential weight whatsoever" reading, and I definately suspect that reading is false in general: whether silence counts against a story should depend on what evidence you'd expect to find if the story were true. On the numbers the biblical text itself gives — a population somewhere in the millions — you'd predict campsites and rubble at a scale archaeologists really would have tripped over; for a war at a real city in the right place, you'd predict a destruction layer and maybe a line in some neighbouring king's boast. But I want you to make that hunch precise rather than just waving at it, and to tell me honestly where it's most likely to fail.

  Also, if you can, say whether the readings force the three cases apart or allow lumping them together — I want something I can take back to the seminar that either splits the cases in a principled way or bites the bullet and treats Arthur, the Exodus, and Troy alike. The old euhemerist thought that legends are garbled history is lurking in the background, but don't let it swallow the analysis; the question is about the slogan, not about legends generally.

  You're a professional philosopher specialising in epistemology and the philosophy of history, so think carefully and don't rush to the first reading that comes to mind — do a quick brainstorm of candidate readings before you write, then organise them into the menu. Answer in British English, and don't pad it. At the end, tell me what would change your mind about your verdicts: which consideration or counterexample would push you to a different view, or where you think your own reasoning is most likely to go wrong. Better that than confident hand-waving.
reasoning: |-
