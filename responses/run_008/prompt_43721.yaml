prompt: |-
  I'm the commissioning editor for the essays and ideas section of a general-interest magazine that covers science and philosophy for an educated but non-specialist readership. We run maybe six to ten pieces a month that mention Gödel's incompleteness theorems, and the invocations run from careful to decorative: claims that Gödel proved human thought transcends computation, that every ideology or legal system must contain unresolvable contradictions, that the theorems show science can never be complete, that the universe is "a formal system" and therefore has true facts it cannot derive, and so on. Our fact-checkers are sharp but have no mathematical training beyond what they remember from college, and they currently handle these by instinct — some flag everything, some flag nothing. I want a screening procedure they can actually run in about ten minutes per invocation: an ordered set of questions to ask of any Gödel-referencing passage, what counts as a sufficient answer at each step, where the procedure terminates in a demand for revision or removal, and where it must hand the decision back to a human because the question is one of interpretation or philosophical judgment rather than checkable fact. It should be grounded in what the theorems actually establish — arithmetic, formal systems, the distinction between truth and provability within a system, what the first and second theorems each say, and the standard gap between that and the grander things people derive from them — but translated so that a fact-checker who has never seen a formal proof can apply it.

  The procedure needs to handle the hard cases, and I want you to run it on three passages drawn from real kinds of submissions we get. First, a sentence claiming that Gödel demonstrated no system of thought can be simultaneously complete and consistent, offered as the reason a particular political ideology must contain hidden contradictions. Second, a sentence claiming that there exist true mathematical statements that no computer could ever prove, used in a piece about the limits of artificial intelligence. Third, a serious essay that engages at length with Roger Penrose's argument from Gödel's theorems to the conclusion that human mathematical insight is not algorithmic — an essay I personally find elegant and would very much like to run, so if the procedure gives me an answer I won't like there, say so plainly rather than bending the procedure to spare me. For each, show where the procedure stops, what it demands, and what it leaves for the editor to decide.

  Two further things. Be honest about where the procedure will misfire: the passages where a technically loose mention is fine because of what the sentence is doing, and the passages where a technically correct one is still misleading in context — and tell me which distinction, if any, the procedure can draw between those. And identify the steps that are judgment calls dressed up as procedure, the places where two careful fact-checkers could run it and come out differently, so I know where our consistency guarantee is weakest before I put this in the desk manual. The final call on any flagged passage stays with me as editor; the procedure's job is to tell my staff what they can reject on their own authority, what they must escalate, and what has to be flagged as "technically fine, contextually your problem."
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Commissioning Editor for a general-interest science/philosophy magazine.
      *   **Problem:** Too many vague/misleading invocations of Gödel's Incompleteness Theorems (6-10/month). Fact-checkers lack math training and rely on instinct.
      *   **Goal:** A 10-minute screening procedure (checklist/flowchart style) for fact-checkers.
      *   **Requirements:**
          *   Grounded in actual math (arithmetic, formal systems, truth vs. provability).
          *   Translated for non-specialists.
          *   Distinguish between rejectable errors, escalatable judgments, and "technically fine but contextually risky."
          *   Apply the procedure to three specific test cases (Political ideology, AI limits, Penrose-style argument).
          *   Honest assessment of limitations (false positives/negatives, subjective judgment calls).
          *   Final authority remains with the Editor.
      *   **Tone:** Professional, precise, pragmatic, authoritative but humble about the limits of fact-checking philosophy.

  2.  **Deconstruct Gödel's Theorems (for the Fact-Checker):**
      *   *What they actually say:*
          *   Context: Formal axiomatic systems capable of expressing basic arithmetic (addition/multiplication of natural numbers).
          *   First Theorem: If the system is consistent, there are true statements within the system that cannot be proved *within that system*.
          *   Second Theorem: Such a system cannot prove its own consistency.
      *   *Common Misapplications:*
          *   Applying to *any* system (law, politics, theology) without establishing it's a formal axiomatic system of arithmetic.
          *   Confusing "unprovable in the system" with "unprovable by humans/machines ever."
          *   Confusing "true but unprovable" with "contradictory."
          *   Claiming science/math can never know *anything* certain.

  3.  **Drafting the Screening Procedure (The "Gödel Filter"):**
      *   *Constraint:* Must take ~10 minutes.
      *   *Structure:* Ordered questions (Yes/No/Maybe).
      *   *Step 1: Domain Check.* Is the claim about formal arithmetic or something else (law, politics, universe)?
      *   *Step 2: System Definition.* Does the text define the "system" being discussed?
      *   *Step 3: Completeness vs. Consistency.* Does it claim the system is *contradictory* (inconsistent) or just *incomplete*?
      *   *Step 4: Human/Machine Transcendence.* Does it claim humans escape the theorem while machines don't?
      *   *Step 5: Truth vs. Provability.* Does it distinguish between "true" and "provable"?
      *   *Outcomes:* Pass, Flag for Revision (Technical Error), Escalate to Editor (Philosophical Leap).

  4.  **Developing the Test Cases:**
      *   *Case 1 (Politics):* "Gödel demonstrated no system of thought can be simultaneously complete and consistent... political ideology must contain hidden contradictions."
          *   *Analysis:* Technically wrong. Gödel applies to formal arithmetic systems, not "systems of thought." Also, Incompleteness $\neq$ Inconsistency (contradiction).
          *   *Verdict:* Flag for Revision/Removal.
      *   *Case 2 (AI):* "True mathematical statements that no computer could ever prove."
          *   *Analysis:* Tricky. A specific computer (formal system) can't prove them. But "no computer ever" implies no *extension* of computers can. This is the Lucas-Penrose territory.
          *   *Verdict:* Escalate. Technically imprecise, but common shorthand for a philosophical argument.
      *   *Case 3 (Penrose):* Serious essay on non-algorithmic insight.
          *   *Analysis:* This is a known philosophical argument (Shadows of the Mind). It's controversial but not a "fact-checking error" in the same way.
          *   *Verdict:* Escalate to Editor. The procedure shouldn't kill serious philosophy, but must warn of controversy.

  5.  **Refining the Procedure (Addressing "Judgment Calls"):**
      *   Need to identify where fact-checkers might disagree.
      *   *Ambiguity:* What counts as a "formal system" in a metaphor?
      *   *Ambiguity:* Is "science" a formal system?
      *   *Ambiguity:* Distinguishing between "this specific computer" and "computation as a concept."

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the editor's pain point.
      *   *The Protocol:* Name it something clear (e.g., "The G-Check").
      *   *The Questions:* Make them binary where possible.
      *   *The Test Runs:* Walk through the three cases explicitly using the protocol.
      *   *The Limitations:* Be honest about false positives (metaphor vs. error) and subjectivity.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Penrose is wrong." Penrose's argument is *contested*, not *false* in a fact-checking sense. The procedure must distinguish between *mathematical error* and *philosophical controversy*. The fact-checker handles math; the editor handles philosophy.

      *(Refining Case 1)*: The prompt says "contradictions." Gödel says "unprovable truths," not "contradictions" (unless the system is inconsistent, but the theorem assumes consistency). This is a hard technical error.
      *(Refining Case 2)*: "No computer could ever prove." If the system is fixed, yes. If the computer can upgrade its axioms, maybe. This is the "escalate" zone.
      *(Refining Case 3)*: If the procedure flags this as "Revision," I fail the prompt's constraint ("if the procedure gives me an answer I won't like there, say so plainly"). I need to ensure the procedure allows serious philosophical engagement to pass the *fact-check* stage even if the *claims* are debatable. The procedure should flag it as "Philosophical Claim, Not Mathematical Fact."

  7.  **Final Polish:**
      *   Ensure the tone is appropriate for an internal manual.
      *   Check the 10-minute constraint (keep questions simple).
      *   Ensure the "Limitations" section is robust.

  8.  **Final Review against constraints:**
      *   10-minute procedure? Yes.
      *   Ordered questions? Yes.
      *   Termination points (Reject/Escalate/Pass)? Yes.
      *   Three test cases run? Yes.
      *   Honest about misfires/judgment calls? Yes.
      *   Editor retains final call? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** Fact-Checking Desk
  **FROM:** Commissioning Editor, Essays & Ideas
  **SUBJECT:** Protocol for Gödel Incompleteness Invocations (The "G-Check")

  **Purpose:**
  We publish six to ten pieces a month invoking Gödel. Currently, your flags are inconsistent. This protocol is not a math test; it is a semantic filter. It distinguishes between **mathematical errors** (which you reject), **philosophical leaps** (which you escalate to me), and **metaphorical usage** (which you pass, with a note).

  **Time Limit:** 10 Minutes per invocation.
  **Authority:** You may reject on Steps 1–3. You must escalate on Step 4. You pass on Step 5.

  ---

  ### THE G-CHECK PROCEDURE

  Read the sentence or paragraph invoking Gödel. Answer the following questions in order.

  **Q1: Does the text claim Gödel applies to a non-mathematical system (e.g., law, politics, theology, the universe, human psychology)?**
  *   **YES:** Go to Q2.
  *   **NO:** (It claims to be about math/logic/computation). Go to Q3.

  **Q2: Does the text explicitly acknowledge this is an analogy or extension, rather than a direct application of the theorem?**
  *   **YES (e.g., "Much like Gödel's math...", "If we treat ideology as a formal system..."):** **PASS.** Add a note to the editor: *"Metaphorical usage. Technically loose but signaled as analogy."*
  *   **NO (e.g., "Gödel proved that all systems..."):** **REJECT.** Demand revision.
      *   *Reason:* Gödel's theorems apply strictly to formal axiomatic systems capable of expressing basic arithmetic. They do not apply to "systems of thought," legal codes, or the physical universe unless the author explicitly constructs a mathematical mapping (which they never do in general interest pieces).
      *   *Correction:* Ask author to qualify the claim (e.g., "Analogous to...") or remove the reference.

  **Q3: Does the text claim the system contains "contradictions" or is "inconsistent" as a result of Gödel?**
  *   **YES:** **REJECT.** Demand revision.
      *   *Reason:* The First Incompleteness Theorem assumes the system is *consistent*. It proves the system is *incomplete* (there are truths it can't prove), not that it is *contradictory*. Confusing "incomplete" with "inconsistent" is a hard technical error.
      *   *Correction:* Change "contradiction" to "unprovable truth" or "limitation."
  *   **NO:** Go to Q4.

  **Q4: Does the text claim that humans can "see" truths that machines/formal systems cannot, implying human thought transcends computation?**
  *   **YES:** **ESCALATE TO EDITOR.**
      *   *Reason:* This is the Lucas-Penrose argument. It is a legitimate philosophical position, but it is highly contested. It is not a checkable fact; it is a philosophical stance.
      *   *Action:* Do not reject. Flag for me with the note: *"Penrose-style claim. Philosophically controversial, mathematically permissible as argument."*
  *   **NO:** Go to Q5.

  **Q5: Does the text claim "Science/Math can never be complete" or "There are truths we can never know"?**
  *   **YES:** **ESCALATE TO EDITOR.**
      *   *Reason:* Gödel shows specific statements within specific systems are unprovable *within that system*. He does not prove we can never know the truth (we can often see it from outside the system) nor that science as a whole halts.
      *   *Action:* Flag for me. This is often rhetorical hyperbole. I will decide if the rhetoric serves the essay.
  *   **NO:** **PASS.** The invocation is technically safe.

  ---

  ### TEST RUNS

  Here is how the G-Check handles the three hard cases you provided.

  #### Case 1: The Political Ideology Claim
  *Passage:* "Gödel demonstrated no system of thought can be simultaneously complete and consistent, offered as the reason a particular political ideology must contain hidden contradictions."

  *   **Q1 (Non-math system?):** **YES.** (Applies to "political ideology").
  *   **Q2 (Acknowledged analogy?):** **NO.** (States it as a direct demonstration: "Gödel demonstrated...").
  *   **Result:** **REJECT.**
  *   **Demand:** The author must either frame this explicitly as a metaphor ("Ideologies, *like* formal systems...") or remove the claim. Furthermore, the claim that the ideology *must contain contradictions* is technically wrong (Gödel implies unprovable truths, not inherent contradictions).
  *   **Editor Note:** This is a hard stop. It misrepresents the theorem and applies it to a domain where it has no traction.

  #### Case 2: The AI Limit Claim
  *Passage:* "There exist true mathematical statements that no computer could ever prove."

  *   **Q1 (Non-math system?):** **NO.** (About math/computers).
  *   **Q3 (Contradictions?):** **NO.**
  *   **Q4 (Humans vs. Machines?):** **NO.** (It doesn't explicitly say humans *can* prove them, just that computers can't).
  *   **Q5 (Never know/Science incomplete?):** **YES/MAYBE.** ("No computer could *ever* prove").
  *   **Result:** **ESCALATE TO EDITOR.**
  *   **Reasoning:** This is the gray zone. Strictly speaking, for any *fixed* formal system (computer program), there is a statement it cannot prove. But a computer can be upgraded to a stronger system. "No computer ever" implies a limit on computation *as such*, which is a philosophical interpretation of the math, not the math itself.
  *   **Editor Note:** I need to decide if this rhetorical flourish is acceptable. It is technically imprecise (a computer running a stronger axiom set could prove the previous system's unprovable statement), but it captures the spirit of the limitation. Do not kill this at the fact-check level; let me weigh the rhetorical value against the technical imprecision.

  #### Case 3: The Penrose Essay
  *Passage:* A serious essay engaging at length with Roger Penrose's argument that human mathematical insight is not algorithmic based on Gödel's theorems.

  *   **Q1 (Non-math system?):** **NO.** (About human cognition vs. algorithms).
  *   **Q3 (Contradictions?):** **NO.**
  *   **Q4 (Humans vs. Machines?):** **YES.**
  *   **Result:** **ESCALATE TO EDITOR.**
  *   **Reasoning:** The procedure correctly identifies this as the Lucas-Penrose argument. It stops short of rejecting it.
  *   **Editor Note:** You asked me to be honest: **If I followed the "Reject" instinct, I would kill this essay.** The G-Check correctly prevents that by routing Q4 to me. This is not a fact-checking error; it is a philosophical argument. The fact-checker's job is to ensure the math isn't *misstated* (e.g., claiming Penrose says the brain is inconsistent), not to adjudicate whether Penrose is *right*. Pass this to me with a flag that it is controversial philosophy, not established science.

  ---

  ### LIMITATIONS AND FAILURE MODES

  You need to know where this procedure will misfire. Consistency is not guaranteed in the following zones:

  **1. The "Metaphor vs. Error" Distinction (Q2)**
  *   **The Risk:** Two fact-checkers might disagree on whether an author is speaking metaphorically.
      *   *Checker A* reads "Our legal system is Gödelian" as a clear metaphor. **PASS.**
      *   *Checker B* reads the same sentence as a category error claiming math governs law. **REJECT.**
  *   **The Fix:** Look for qualifying words ("like," "analogous," "mirrors"). If absent, default to **REJECT**. It is better to force the author to clarify the metaphor than to let a category error stand.

  **2. The "Ever" Ambiguity (Case 2 & Q5)**
  *   **The Risk:** When an author says "Science can't know everything," is that rhetorical hype or a claim about formal decidability?
  *   **The Failure:** The procedure escalates this to me. This creates a bottleneck. You cannot solve this yourself because it requires judging the *tone* of the piece, not just the truth of the sentence.
  *   **The Fix:** Accept the bottleneck. If an author makes a sweeping claim about the limits of knowledge based on Gödel, I need to see it to ensure it fits the magazine's voice, even if it's not strictly a "lie."

  **3. The Penrose Trap (Q4)**
  *   **The Risk:** A fact-checker who knows Penrose is widely criticized by computer scientists might be tempted to flag this as "Disputed/False."
  *   **The Failure:** The procedure says **ESCALATE**, not **REJECT**. If a checker rejects a Penrose argument because "AI researchers disagree," they are overstepping.
  *   **The Fix:** Remind staff: Our job is to check if the author represents the *argument* accurately, not to settle the debate. If the author says "Penrose argues X," and Penrose does argue X, that is a fact. Whether X is true is philosophy.

  **4. Technically Correct, Contextually Misleading**
  *   **The Scenario:** An article about climate change modeling includes a sidebar: "Gödel proved math is incomplete, so our climate models have inherent uncertainty."
  *   **The Procedure's Verdict:** **PASS** (Q1=No, Q3=No, Q4=No, Q5=No). Technically, models are formal systems.
  *   **The Reality:** This is deeply misleading. Gödelian incompleteness is not the source of uncertainty in climate modeling (chaos theory and data limits are).
  *   **The Gap:** The G-Check cannot catch **relevance errors**. It only catches **truth errors**.
  *   **The Fix:** If a passage passes the G-Check but feels like a "non-sequitur," add a note: *"Technically passable, but relevance to main argument is tenuous. Editor to review."*

  ### SUMMARY OF AUTHORITY

  *   **You Reject:** Claims that Gödel proves inconsistencies/contradictions (Q3). Claims that apply Gödel directly to non-math systems without metaphorical framing (Q1/Q2).
  *   **You Escalate:** Claims about human transcendence over machines (Q4). Claims about the absolute limits of science/knowledge (Q5).
  *   **You Pass:** Careful mathematical discussions. Explicit metaphors.
  *   **I Decide:** Everything escalated, plus any "Technically Passable" notes regarding relevance.

  **Final Instruction:** When in doubt between Reject and Escalate, **Escalate**. It is better for me to delete a philosophical argument than for you to delete a valid one because the math looked scary.
