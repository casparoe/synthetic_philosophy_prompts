mand rigorous verification. The secrecy is a tactical tool, not a moral shield. If the leader hides the truth forever, it suggests shame rather than necessity. Cicero would advise: act to save the state, but prepare to stand trial for it if required. This aligns with his view that war against internal enemies justifies martial measures.

