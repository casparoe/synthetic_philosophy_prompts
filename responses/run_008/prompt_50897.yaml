  Structure your answer in four sections, in this order: first, "Relevant background," briefly setting out the parts of Cicero's thought and record that bear on the case (roughly 150 words); second, "Prediction," stating what Cicero would most likely advise and why (roughly 350 words); third, "Complications," discussing where Cicero's own record as consul makes the prediction less straightforward than his written principles alone would suggest (roughly 200 words); and fourth, "Verdict," a concise overall judgment on whether the Cicero of De Officiis and the Cicero of 63 BC would give the same answer here (roughly 100 words).
