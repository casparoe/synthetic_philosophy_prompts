answer: |-
  **Project Title:** Structural Integrity in Cause Prioritization: A Formal and Conceptual Critique of the ITN Framework

  **Research Question**
  The Importance-Tractability-Neglectedness (ITN) framework is the dominant heuristic for cause prioritization within the effective altruism community. It ranks causes by assigning scores to three factors and multiplying them ($Value = I \times T \times N$). This project asks: **Is the multiplicative structure of the ITN framework a harmless simplification, a distortion that systematically alters cause rankings, or a category error that no amount of patching can fix?**

  Specifically, I investigate whether the arithmetic operation of multiplication implicitly assumes statistical independence between variables that are, by definition, interdependent. If the framework contains a structural error, it does not merely add noise to decision-making; it encodes a false ontology of social change that may systematically direct resources away from high-impact opportunities.

  **The Problem: Independence Assumptions and Marginal Value**
  The standard application of ITN treats Importance, Tractability, and Neglectedness as separable inputs. My research proceeds from the suspicion that this separability fails in two distinct ways that affect the arithmetic rather than merely the details.

  First, **Tractability and Neglectedness are definitionally entangled.** Tractability is typically defined as the ease of making progress on a problem. However, progress for a given actor is a function of diminishing returns to additional resources. Neglectedness is precisely a measure of how many resources are already applied. Therefore, the tractability *for the marginal investor* is mathematically dependent on the level of neglectedness. By scoring them separately and multiplying them, the framework risks double-counting the effect of crowding. A problem may appear low-value because it is scored as "crowded" (low neglectedness) and "hard" (low tractability), when in reality the "hardness" is entirely a function of the "crowding."

  Second, **Importance is a non-marginal quantity applied to a marginal question.** The framework is intended to estimate the expected value of the *next* unit of resources. However, "Importance" is usually scored as the total scope of the problem (e.g., total lives affected). Total scope does not linearly translate to marginal impact. A massive problem with saturated solutions may have lower marginal value than a smaller problem with high-leverage openings. Because the diminishing returns curve is intrinsic to the problem's importance, treating Importance as a static multiplier separate from Tractability and Neglectedness obscures the actual marginal value function.

  **Why the "Heuristic Defense" Fails**
  Proponents often defend ITN by arguing it is merely a "scaffold" for ordinary expected-value reasoning, suggesting that interactions wash out in practice. This project argues that this defense is insufficient for three reasons.

  1.  **Systematic Bias:** If the entanglement between variables is structural, the error is not random noise. It will systematically penalize causes where crowding drives difficulty (e.g., policy change) while rewarding causes where difficulty is intrinsic regardless of crowding (e.g., fundamental scientific bottlenecks).
  2.  **Reification:** Practitioners do not treat ITN as a temporary scaffold; they treat the scores as objective properties of causes. A conceptual error in the framework becomes a normative error in allocation.
  3.  **Opacity:** By burying the marginal value function inside three separate multipliers, the framework hides the specific assumptions about returns to scale. A robust heuristic should make assumptions explicit, not obscure them behind arithmetic that implies independence.

  **Methodology**
  The research will be conducted over three stages, blending conceptual analysis with formal modeling.

  *Stage 1: Conceptual Separation (Months 1–3)*
  I will rigorously distinguish between *empirical correlations* (e.g., important problems attract more workers) and *definitional entanglements* (e.g., tractability is defined by the marginal product of labor, which is a function of labor already present). I will produce a formal taxonomy of ITN definitions currently in use to identify which versions suffer from the independence error.

  *Stage 2: Formal Reconstruction (Months 4–7)*
  I will construct an alternative model that internalizes the dependencies. Instead of $I \times T \times N$, I will explore a functional form where Tractability is a function of Neglectedness ($T(N)$), and Importance is defined marginally ($I'$). This will involve modeling standard economic production functions applied to altruistic capital. The goal is not necessarily to produce a new calculator, but to determine the mathematical conditions under which the standard ITN formula diverges significantly from the corrected model.

  *Stage 3: Stress-Testing and Comparison (Months 8–12)*
  I will apply both the standard ITN framework and the reconstructed model to a set of paradigmatic cause areas (e.g., global health, AI safety, animal welfare). I will analyze whether the structural correction changes the ordinal ranking of these causes. If the rankings remain stable, the "heuristic defense" is vindicated. If they swap, the framework is actively misleading.

  **Deliverables and Impact**
  The primary deliverable will be a technical paper suitable for publication in a journal of practical ethics or decision theory, alongside a "Practitioner's Brief" designed for funding organizations.

  For practitioners, the goal is not necessarily to replace ITN, which has pedagogical value, but to define its **boundary conditions**. A successful outcome provides funders with a clear set of criteria for when ITN is safe to use and when it must be abandoned for full marginal value analysis. For example, the research might conclude that ITN is valid for comparing causes at similar scales of maturity but fails when comparing nascent fields against saturated ones. This allows organizations to retain the framework's simplicity without incurring its structural risks.

  **Conditions for Failure**
  Intellectual honesty requires acknowledging that this project could fail to produce a actionable correction. There are two specific failure modes I anticipate.

  First, **the "Loose Practice" Problem.** It is possible that practitioners use ITN so informally that no principled reconstruction is possible. If users adjust scores post-hoc to match their intuitions, the arithmetic structure is irrelevant, and a formal critique addresses a straw man. I will mitigate this by interviewing prioritization researchers to verify how strictly the arithmetic is actually applied.

  Second, **the "Complexity Trap."** The corrected model might require data inputs (e.g., precise elasticity of impact with respect to funding) that are impossible to estimate. If the "accurate" model is unusable, and the "simple" model is inaccurate, the conclusion will be negative: that quantitative cause prioritization of this kind is currently premature. While a negative result is philosophically valuable, it would mean the project fails to provide the positive guidance hoped for by fellowship sponsors.

  In either case, clarifying the limits of our current tools is a necessary contribution to the field. If the ITN framework is fundamentally broken, knowing that is more valuable than continuing to use it under false pretenses.
