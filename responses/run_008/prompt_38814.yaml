      *   *Adjustment:* I will argue that the *discrepancy* between OPERA data and SR/SN1987A generates HOE. The HOE is the proposition: "It is highly probable that there is a systematic error in the OPERA setup." This proposition is supported by the conflict between FOE (OPERA) and Background (SR).
