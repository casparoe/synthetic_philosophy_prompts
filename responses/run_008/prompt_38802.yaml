              *   Functionalist: "The inheritance is a reason to admire, but not a fittingness reason." (Or "pragmatic reason").
              *   *Correction:* The prompt warns about slippage. "Reason to admire" is the contested term.
              *   *Objectivist Wording:* "The inheritance provides no normative reason *for* admiring; it provides a reason *to want* to admire."
              *   *Functionalist Wording:* "The inheritance provides a pragmatic reason *for* admiring, distinct from a fittingness reason."
          *   *Row 2 (Unity of 'Reason'):*
              *   Objectivist: "Reason" is univocal (always content-directed).
              *   Functionalist: "Reason" is ambiguous or broad (includes pragmatic).
          *   *Row 3 (Explanation of Defect):*
              *   Objectivist: Defect arises because the attitude lacks proper grounds.
              *   Functionalist: Defect arises because the attitude violates a constitutive norm, despite having pragmatic support.

      *   **Section 3: Cruxes:**
          *   Need concrete tests/predictions.
          *   *Crux 1: The "Seeming" Pull.* Does the WKR feel like a reason?
              *   Test: Introspective report on the "pull."
              *   Obj Prediction: It feels like a desire/incentive, not a reason.
              *   Func Prediction: It feels like a reason, just a pragmatic one.
          *   *Crux 2: Generalization across Attitudes.*
