  2.  **Deconstruct the Philosophical Positions:**
      *   **The Problem:** Distinguishing "Right Kind of Reasons" (RKR) from "Wrong Kind of Reasons" (WKR).
          *   *Example:* Evidence that it will rain (RKR for belief) vs. Reward for believing it will rain (WKR for belief).
          *   *Example:* Admirable traits (RKR for admiration) vs. Inheritance for admiring (WKR for admiration).
      *   **The Objectivist (Reasons for Content):**
          *   View: Reasons for an attitude must be reasons for the *content* of that attitude.
          *   Belief: Reasons must be evidence for $p$.
          *   Admiration: Reasons must be features making $X$ admirable.
          *   WKR Status: Rewards are reasons to *want* to have the attitude or to *bring it about*, but not reasons *for* the attitude itself.
      *   **The Functionalist (Reasons for Attitude):**
          *   View: Reasons for an attitude are considerations counting in favor of *holding* the attitude.
          *   Unification: Both evidence and rewards count in favor of holding the attitude, but they play different functional roles (e.g., constitutive aims vs. external incentives).
          *   WKR Status: Rewards *are* reasons to admire, just a different *kind* (pragmatic vs. epistemic/fittingness).
      *   **Common Ground:** They agree on the *cases* (the uncle isn't admirable just because of the money; bribed belief is defective). They disagree on the *explanation* (ontology of reasons).

  3.  **Drafting - Section by Section:**

