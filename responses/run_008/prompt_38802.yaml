answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Wrong Kind of Reasons Problem (WKR)
  **Participants:** The Objectivist (Member A), The Functionalist (Member B)
  **Facilitator:** [Your Name]
  **Date:** October 26, 2023

  ### 1. Agreed Claims

  The undersigned agree to the following propositions as the baseline for this collaboration. These claims represent the phenomenological and theoretical common ground established over the past year.

  1.  **The Phenomenology of the Cases:** In cases involving the "Uncle" (inheritance for admiration) and the "Rain" (reward for belief), we agree that:
      *   The promised inheritance does not make the uncle admirable.
      *   The promised reward does not make the proposition "it will rain" true or probable.
      *   An attitude held solely for the reward (bribed belief or paid admiration) is defective in a way that an attitude held on the basis of evidence or traits is not.
  2.  **The Distinction:** There is a robust, pre-theoretical distinction between considerations that make an attitude *fitting* (evidence, admirable traits) and considerations that make an attitude *beneficial* (rewards, threats, consequences). Any adequate theory must account for this distinction.
  3.  **The Explanatory Burden:** A theory of reasons for attitudes must explain why the "beneficial" considerations (Wrong Kind) cannot justify the attitude in the same way "fitting" considerations (Right Kind) do, even if the beneficial considerations exert a genuine normative pull on the agent.
  4.  **Mutual Threat Assessment:**
      *   **The Objectivist acknowledges:** The Functionalist correctly identifies that rewards exert a genuine normative pressure. Dismissing them merely as "reasons to want" risks failing to explain why an agent feels they *ought* to adopt the attitude, not just wish they could.
      *   **The Functionalist acknowledges:** The Objectivist correctly identifies that rewards cannot render an attitude *correct* or *accurate*. A theory that treats rewards as identical in status to evidence risks losing the ability to explain why bribed belief is irrational or defective.
  5.  **Non-Reduction:** Both sides agree that the WKR problem cannot be solved by simply denying that rewards influence rationality. The dispute is about *how* they influence it, not *whether* they influence behavior.

  ### 2. Statement of Disagreements

  The following table outlines the specific points of divergence. The wording in each column has been approved by the respective member as an accurate representation of their position.

  | Issue | Objectivist Position (Member A) | Functionalist Position (Member B) |
  | :--- | :--- | :--- |
  | **1. Status of the Reward** | The inheritance is **not a reason to admire**. It is a reason to *want* to admire, or a reason to *act* to bring about the admiration. | The inheritance **is a reason to admire**. It is a pragmatic reason for holding the attitude, distinct from a fittingness reason. |
  | **2. Unity of "Reason"** | The term "reason for an attitude" is univocal. It always refers to grounds that count in favor of the *content* or *object* of the attitude. | The term "reason for an attitude" is broad. It refers to any consideration counting in favor of *holding* the attitude, regardless of source. |
  | **3. Source of Defect** | A bribed attitude is defective because it lacks a reason *for the attitude*. It is an attempt to respond to a reason for *action* as if it were a reason for *attitude*. | A bribed attitude is defective because it satisfies the wrong *normative standard*. It is pragmatically rational but constitutively irrational. |
  | **4. Normative Force** | If you do not admire the uncle, you have not failed to respond to a reason. You have only failed to maximize your benefit. | If you do not admire the uncle, you have failed to respond to a pragmatic reason, even if you have satisfied the epistemic/aesthetic norm. |

  ### 3. Cruxes and Pre-Registered Predictions

  A "crux" is a sub-question where empirical or logical resolution would force at least one party to update their position. For each crux, we have defined a test case and recorded predictions in advance to prevent retrospective adjustment.

  **Crux 1: The "Impossible Action" Test**
  *   **The Question:** If it is impossible to act to secure the reward, does the "reason" to hold the attitude persist?
  *   **The Case:** An agent is physically incapable of performing any action to signal their admiration (e.g., paralyzed, isolated), but can still internally adopt the attitude. The inheritance is still offered for the attitude itself.
  *   **Objectivist Prediction:** The normative pull vanishes or converts entirely into a "wish." Since there is no action to take to get the reward, there is no reason left to process. If the Objectivist is right, the "reason" was always about the *action* of securing the inheritance.
  *   **Functionalist Prediction:** The normative pull remains. The agent still has a pragmatic reason to admire, even if they cannot act on it. If the Functionalist is right, the reason attaches to the *state* of admiring, not the *act* of securing.
  *   **Resolution Condition:** If the Functionalist concedes the pull vanishes without action capability, they move toward Objectivism. If the Objectivist concedes the pull remains, they must explain what the reason is *for* if not action.

  **Crux 2: The "Transparency" Test**
  *   **The Question:** When deliberating about whether to hold the attitude, is the reward visible as a justification?
  *   **The Case:** An agent is asked, "Why do you believe it will rain?" while knowing a reward is attached to that belief.
  *   **Objectivist Prediction:** The agent cannot cite the reward as a justification for the *belief* without acknowledging a category error. They must say, "I want to believe," not "I believe because of the money."
  *   **Functionalist Prediction:** The agent can cite the reward as a justification for the *holding* of the belief, provided they specify it is a pragmatic justification. The reward is visible in deliberation as a competing norm.
  *   **Resolution Condition:** If introspection shows the reward is *never* citable as a reason for the attitude (even with caveats), the Objectivist view is strengthened. If it is citable as a distinct type of reason, the Functionalist view is strengthened.

  **Crux 3: Generalization Across Attitudes**
  *   **The Question:** Does the WKR distinction behave identically across different mental states (Belief, Admiration, Fear, Intention)?
  *   **The Case:**
      *   *Fear:* A demon threatens to hurt you unless you fear him (WKR) vs. The demon is dangerous (RKR).
      *   *Intention:* A payoff for intending to $\phi$ vs. A payoff for $\phi$-ing.
  *   **Objectivist Prediction:** The structure is uniform. In Fear, the reason must be about the *danger* (content). In Intention, the reason must be about the *action's value*.
  *   **Functionalist Prediction:** The structure is uniform. In all cases, incentives count in favor of the *state* (fearing/intending), while evidence/traits count in favor of the *fittingness*.
  *   **Resolution Condition:** If one side is forced to treat Fear differently from Belief to save their theory, their claim to a general theory of reasons is weakened. We will record if either side treats Fear as an exception.

  ### 4. Verbal vs. Substantive Dispute

  Both parties acknowledge that philosophical disputes often dissolve into disagreements over definitions. We have identified the following boundaries regarding the charge of "verbalism."

  **1. What IS Merely Verbal:**
  *   **The Label "Reason":** We agree that if the dispute were *only* about whether the word "reason" applies to pragmatic incentives, it would be verbal. Both sides agree we can stipulate definitions where the Functionalist is right (broad definition) or the Objectivist is right (narrow definition).
  *   **Agreement:** We will not spend further time arguing over the dictionary definition of "reason."

  **2. What IS NOT Merely Verbal:**
  *   **Normative Consequences:** The dispute is substantive because it changes what we can say about an agent's rationality.
      *   If the Objectivist is right, an agent who admires the uncle for money is **not responding to a reason for admiration**.
      *   If the Functionalist is right, an agent who admires the uncle for money **is responding to a reason**, but violating a different norm.
  *   **The "Space of Reasons":** The dispute concerns the structure of normative space. Does the inheritance sit *outside* the justification for admiration (Objectivist), or does it sit *inside* the justification as a different coordinate (Functionalist)?
  *   **Agreement:** We acknowledge that settling the verbal definition does not settle the structural question. Even if we agree to call incentives "pragmatic reasons," the Objectivist maintains they are reasons for *action/desire*, while the Functionalist maintains they are reasons for *attitude*. This structural disagreement is substantive and remains the core of the collaboration.

  ***

  **Signatures:**

  _________________________ (The Objectivist)

  _________________________ (The Functionalist)

  _________________________ (Facilitator)
