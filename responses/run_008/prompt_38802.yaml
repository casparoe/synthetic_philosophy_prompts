          *   *Crux 3: The "Reason for Something Else" Test.*
              *   Can we fully reduce WKR to reasons for action/desire?
              *   *Test:* Case where action is impossible, only attitude remains.
              *   Obj Prediction: If you can't act to get the reward, the "reason" vanishes.
              *   Func Prediction: The reason to hold the attitude remains even if action is blocked.

      *   **Section 4: Verbal vs. Substantive:**
          *   They accuse each other of verbalism.
          *   *Verbal:* Maybe the definition of "Reason."
