  Regarding the fund, members worrying about "purchasing absolution" raise a valid ethical concern. An apology followed by payment can look like a transaction to close the ledger. However, words without resources are often rightly dismissed as "cheap talk." The fund is not compensation (which cannot fully quantify lost wealth), but a reparative gesture. It signals that the City values the harm enough to incur a cost. Refusing funding risks signaling that the City values its budget over the harm caused.

