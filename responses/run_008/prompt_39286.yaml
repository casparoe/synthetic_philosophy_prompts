      **MEMORANDUM**
      **TO:** Ad Hoc Reconciliation Committee, City of Aldermoor
      **FROM:** [My Name], External Advisor
      **SUBJECT:** Recommendation on Bottoms Families Alliance Petition
      **DATE:** October 26, 2023

      **Conceptual Framework**
      To resolve this deadlock, we must distinguish between *personal guilt* and *institutional responsibility*. Current residents are not personally guilty of 1962 acts. However, the City is a continuous corporate entity, not merely a collection of current voters. Like a corporation liable for a decades-old defect, the City retains obligations from past official acts. An apology here is not an expression of personal shame by current officers, but an official acknowledgement that the institution harmed a community and retains a duty to repair that relationship.

      Regarding addressees: While the original victims are deceased, the harm intergenerationally persists. Addressing descendants acknowledges that the injury was not isolated to 1962 but disrupted lineage and wealth accumulation.

      Regarding material components: Words without resources are often rightly dismissed as "cheap talk." A fund is not "buying absolution"; it is backing moral acknowledgement with tangible investment. Conversely, refusing funding risks signaling that the City values its budget over the harm caused.

      **Recommendations**
      1.  **Issue a Formal Resolution:** **Yes.** The City owes an official acknowledgement of harm.
      2.  **Language ("Atonement" vs. "Responsibility"):** **Modify.** I recommend replacing "atonement" with "acceptance of responsibility and commitment to repair." While "atonement" captures the moral depth petitioners seek, the City Attorney's warning regarding litigation is prudent. "Acceptance of responsibility" carries similar moral weight in political ethics without explicitly triggering admissions of legal liability often associated with religious or restorative justice terms like "atonement." This respects the legal constraint without diluting the moral commitment.
      3.  **Scholarship Fund:** **Yes.** Approve the $75,000 annual fund. This is not compensation (which cannot fully quantify lost wealth), but a reparative gesture. It answers the objection that an apology is costless speech.

      **The "Highway Never Built" Problem**
      Does the cancellation of the highway change the response? Yes. It aggravates the injustice. If the highway had been built, the City might argue the destruction was a tragic necessity for public utility. Since no public good materialized, the clearance was purely destructive. The City retained land acquired at clearance prices without delivering the promised infrastructure. This was not a "blunder"; it was a policy failure that benefited the City's asset sheet while devastating a community. The resolution must explicitly acknowledge that the promised public benefit never materialized. This validates the descendants' feeling that the sacrifice was demanded for nothing.

      **Draft Operative Clause**
      "The City of Aldermoor formally acknowledges its responsibility for the 1962 clearance of the Bottoms, recognizes that the promised public benefit failed to materialize, and commits to reparative investment in the descendants of the displaced community."

      **Practical Guidance for the Committee**
      **On Culpability:** The resolution must clarify that current residents and officers are not being asked to accept *personal* blame. They are accepting *institutional* stewardship. The language should specify that the City *as an institution* accepts responsibility. This addresses the committee concern that residents are being asked to bear a moral ledger they did not write. We are correcting the institution's record, not indicting the current populace.

      **On Legal Concerns:** Do not let legal risk silently dictate moral truth. The Attorney's warning is about litigation exposure, not moral correctness. We mitigate this by using precise language ("acknowledges responsibility" rather than "admits liability for damages") and by framing the fund as a "voluntary community investment" rather than "compensation." This allows the City to do the right thing without unnecessarily exposing the treasury to unlimited liability. The goal is reconciliation, not a legal settlement, but the language must be drafted to protect the former without inviting the latter.

      **Conclusion**
      The strongest argument against this resolution is that it forces current taxpayers to pay for past sins. This is a serious concern. However, the City still holds the benefit of that land acquisition. To keep the land benefit while rejecting the associated moral debt is inconsistent. Approving this resolution aligns the City's current stewardship with its institutional history, acknowledging that while individuals change, the City's obligations endure.

