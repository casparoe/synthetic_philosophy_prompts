prompt: |-
  I'm in a historical sociology course and we just spent two weeks on the Protestant ethic thesis -- the Weber idea that ascetic Protestantism, with its anxiety over election and its sanctification of disciplined labor, helped produce the "spirit" of capitalism and with it the actual practice of accumulation. My flatmate, who's an econ student, thinks the whole thing is unfalsifiable hand-waving: rich areas become Protestant, or Protestants just happened to live where commerce was already taking off, and the doctrine is decoration. My professor keeps gesturing at "elective affinity" and "adequate causality" as if those phrases settle something, but honestly neither side ever stops to say what would even COUNT as a culture-first explanation succeeding. So before I go back into the literature, I want the spec first.

  Write me the desiderata: what any explanation of a large-scale economic or social outcome that appeals to cultural values -- religious doctrine, ethical ideals, informal norms -- has to deliver to count as genuinely causal rather than a just-so story. I'd want you to think about things like: how it distinguishes values causing behavior from values rationalizing behavior that economic incentives already explain; whether it owes us a mechanism at the level of individual psychology (how does a doctrine about the afterlife become a habitual disposition toward profit?) or whether aggregate-level evidence of correlation plus timing is enough; what it has to say about the counterfactual (no Reformation, or a Lutheranism without predestination-anxiety -- what happens to capitalism, and how could we ever check); how it handles the fact that capitalism eventually thrived everywhere, including places with completely different religious traditions, which cuts both ways for the thesis; and whether it needs to explain the timing and geography of the outcome, not just its existence. Give the case behind each requirement, mark which are non-negotiable and which are just what one camp (economists, Weberians, the institutional people) happens to care about, and tell me if you think some subset of the desiderata is jointly unsatisfiable -- like whether demanding a fine-grained psychological mechanism is even compatible with a claim about slow, diffuse, century-scale outcomes, since that tension seems to be doing a lot of unacknowledged work in these debates.

  Then, briefly, score the three obvious contenders against your own list: Weber's actual thesis (as distinct from the pop version where Protestantism single-handedly caused capitalism), a materialist/incentive explanation where doctrine is downstream, and an institutional one where both culture and commerce ride on things like contract enforcement and city autonomy. Keep that part short though -- it's the requirements I actually need, since my essay is supposed to argue about the standard of evaluation itself, not do another audit of Weber. A table is fine for the scorecard if that's easier.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Historical sociology course, focused on Weber's *Protestant Ethic* thesis.
      *   **Conflict:** Student (user) vs. Econ Flatmate (skeptic) vs. Professor (Weberian defender).
      *   **Core Problem:** Lack of clarity on what counts as a successful "culture-first" causal explanation vs. a "just-so story."
      *   **Task:** Write a set of *desiderata* (requirements) for a cultural explanation of large-scale economic/social outcomes to be considered genuinely causal.
      *   **Specific Considerations:** Distinguish values causing vs. rationalizing behavior; mechanism (psychological vs. aggregate); counterfactuals (no Reformation); universality of capitalism (why it spread elsewhere); timing and geography.
      *   **Analysis:** Mark requirements as non-negotiable vs. camp-specific. Identify potential tensions/incompatibilities (e.g., micro-mechanisms vs. macro-outcomes).
      *   **Evaluation:** Briefly score three contenders (Weber, Materialist/Incentive, Institutional) against the list.
      *   **Format:** Essay-like structure for the desiderata, table for the scorecard.
      *   **Tone:** Academic, rigorous, balanced, slightly critical (matching the user's skepticism).

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   *Requirement 1: Temporal Precedence & Exogeneity.* Culture must exist *before* the economic shift and not be a product of it. (Crucial for causality).
      *   *Requirement 2: Mechanism (Micro-Macro Link).* How does a belief become a behavior? Needs more than "they believed X so they did Y." Needs psychology or social pressure.
      *   *Requirement 3: Counterfactual Robustness.* What if the culture wasn't there? Would the outcome still happen?
      *   *Requirement 4: Distinctiveness.* The culture must predict *specific* behaviors that alternative explanations (incentives) do not. (Rationalization vs. Causation).
      *   *Requirement 5: Diffusion/Universality.* If capitalism is universal, how did the specific culture matter? (The "Decoupling" problem).
      *   *Requirement 6: Geographic/Temporal Specificity.* Why *there* and *then*?

  3.  **Analyze Tensions/Incompatibilities:**
      *   *Micro vs. Macro:* Demanding rigorous psychological mechanisms for every individual might be impossible for historical data, but without it, it's just correlation.
      *   *Necessity vs. Sufficiency:* Weber claims "spirit" was necessary for the *form* of capitalism, not capitalism itself. This is a moving target.
      *   *Exogeneity:* Culture is rarely truly exogenous. It evolves with economics.

  4.  **Drafting the Desiderata Section:**
      *   Introduction: Acknowledge the stalemate.
      *   Point 1: The Exogeneity Condition (Time & Independence).
      *   Point 2: The Mechanism Condition (Psychology/Behavior).
      *   Point 3: The Counterfactual Condition (The "But For" Test).
      *   Point 4: The Specificity Condition (Rationalization vs. Motivation).
      *   Point 5: The Decoupling Condition (Explaining later spread).
      *   *Critical Reflection:* Discuss the "Micro-Macro Tension." Is it possible to satisfy all?

  5.  **Categorizing Requirements:**
      *   *Non-Negotiable:* Temporal precedence, Counterfactual coherence, Mechanism (some form).
      *   *Camp-Specific:* Psych mechanism (Weberians love it, Economists want incentives), Exogeneity (Economists demand it, Sociologists say it's messy).

  6.  **Drafting the Scorecard:**
      *   *Weber:* Strong on mechanism (anxiety -> labor), weak on exogeneity (did commerce come first?), weak on decoupling (why did Catholics catch up?).
      *   *Materialist:* Strong on exogeneity (incentives drive culture), weak on mechanism (why the specific religious form?), weak on timing (why then?).
      *   *Institutional:* Strong on geography/timing (cities/charters), sidesteps culture (treats it as epiphenomenal), strong on decoupling (institutions spread).

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure not to strawman Weber. He didn't say Protestantism *caused* capitalism single-handedly. He said it shaped the *spirit*.
      *   *Correction:* Ensure the "Micro-Macro" tension is highlighted as a key insight, as the user specifically asked about it.
      *   *Tone Check:* Keep it sophisticated. Use terms like "endogeneity," "identification strategy," "elective affinity."

  8.  **Final Review against User Prompt:**
