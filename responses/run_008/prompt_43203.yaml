      *   Did I cover counterfactuals? Yes.
      *   Did I cover universality/timing? Yes.
      *   Did I mark non-negotiables vs. camp preferences? Yes.
      *   Did I discuss joint unsatisfiability? Yes.
      *   Is the scorecard brief/tabular? Yes.

  9.  **Final Polish:** Check for clarity and flow. (The resulting output matches the detailed response provided previously.)
answer: |-
  Here is a specification sheet for cultural causality, designed to break the stalemate between your flatmate's econ skepticism and your professor's sociological defensiveness.

  ### The Desiderata for Cultural Causality

  To move beyond "just-so stories," any thesis claiming that cultural values (religious doctrine, norms, ethics) caused a large-scale economic or social outcome must satisfy the following conditions. I have categorized them by whether they are methodological necessities (Non-Negotiable) or theoretical preferences (Camp-Specific).

  #### 1. The Exogeneity Condition (Temporal Precedence)
  **Requirement:** The cultural variable must be shown to exist *prior* to the economic shift it is alleged to cause, and its emergence must not be fully explainable by prior economic conditions.
  **The Case:** If Protestantism spread only in areas where commerce was already expanding, it is a dependent variable, not an independent one. Correlation is not causation.
  **Status:** **Non-Negotiable.** Without temporal precedence, you have rationalization, not causation.
  **The Tension:** In historical sociology, true exogeneity is rare. Culture and economy co-evolve. Demanding strict exogeneity often forces researchers to find "natural experiments" (e.g., border discontinuities) that may miss the diffuse nature of cultural change.

  #### 2. The Mechanism Condition (Micro-Foundations)
  **Requirement:** The explanation must specify *how* a abstract doctrine translates into concrete economic behavior. It cannot simply assert "belief X led to action Y." It must bridge the gap between theology and habit.
  **The Case:** Your flatmate's critique hinges here. How does "predestination" become "working harder"? Is it fear of hell? Social signaling? Community enforcement? Without a psychological or social transmission mechanism, the link is magic.
  **Status:** **Non-Negotiable (in principle), Camp-Specific (in practice).** Economists demand individual utility-maximization models. Weberians accept "habituation" or "socialization." Institutionalists look for rule-enforcement.
  **The Tension:** **The Micro-Macro Incompatibility.** This is the critical friction point. Demanding a fine-grained psychological mechanism for every individual is often impossible for century-scale historical data. However, relying solely on aggregate correlation (Protestant regions grew faster) invites the ecological fallacy. A theory that satisfies the mechanism condition for the *individual* often fails to scale to the *epoch*, and vice versa.

  #### 3. The Counterfactual Condition (The "But-For" Test)
  **Requirement:** The theory must articulate what would have happened in the absence of the cultural variable.
  **The Case:** If the Reformation never happened, would capitalism still have emerged? If yes, Protestantism was not a *cause*, merely a vessel. Weber argues it shaped the *spirit* (rational, disciplined), not just the *fact* of accumulation.
  **Status:** **Non-Negotiable.** Causality implies that removing the cause removes (or alters) the effect.
  **The Tension:** Historical counterfactuals are untestable. We cannot run a control group on 16th-century Europe. This forces reliance on comparison (e.g., Catholic Italy vs. Protestant England), which introduces confounding variables (geography, politics).

  #### 4. The Specificity Condition (Distinguishing Motivation from Rationalization)
  **Requirement:** The cultural explanation must predict behaviors that material incentive explanations do not. It must show actors doing things that are *economically suboptimal* in the short term but *culturally consistent*.
  **The Case:** If Protestants only worked harder when wages were higher, that's standard labor supply. If they worked harder *despite* sumptuary laws forbidding consumption (reinvesting instead), that supports the "asceticism" thesis. If the behavior is indistinguishable from standard profit-seeking, the cultural label is decoration.
  **Status:** **Non-Negotiable.** This is the only way to distinguish "culture causes behavior" from "incentives cause behavior, culture justifies it."

  #### 5. The Decoupling Condition (Explaining Universality)
  **Requirement:** If the outcome (capitalism) eventually thrived in non-Protestant cultures (Japan, Catholic Europe, secular states), the theory must explain how the *outcome* detached from the original *cause*.
  **The Case:** Capitalism is universal now; Calvinism is not. If the "spirit" was necessary to start the engine, what sustains it once the religious fuel is gone? Weber argues the "iron cage" makes the culture unnecessary once the structure is built.
  **Status:** **Camp-Specific (Weberian).** Materialists don't need this; they argue capitalism arises wherever incentives align. Institutionalists argue institutions (laws, property rights) are the transferable technology, not the culture.
  **The Tension:** If the culture is easily decoupled, was it ever truly causal, or just a transient shock? If it isn't decoupled, why did capitalism succeed in Confucian or Catholic contexts?

  #### 6. The Geographic/Temporal Specificity Condition
  **Requirement:** The theory must explain why the outcome happened *there* and *then*, not just *that* it happened.
  **The Case:** Commerce existed in Florence and Baghdad centuries before Calvin. Why did modern rational capitalism emerge in Northwestern Europe in the 17th century? A cultural theory must account for the specific distribution of the culture.
  **Status:** **Non-Negotiable.** A theory that predicts capitalism everywhere predicts nothing.

  ---

  ### The Critical Tension: Is the Spec Satisfiable?

  There is a strong argument that **Desiderata 2 (Mechanism)** and **Desiderata 5 (Decoupling/Universality)** are jointly unsatisfiable in a way that favors the skeptics.

  To satisfy the **Mechanism Condition**, you need a tight, robust link between specific doctrine and specific behavior (e.g., anxiety about election causes reinvestment). But to satisfy the **Decoupling Condition**, you must admit that this link is fragile or temporary, because the behavior persists even when the doctrine vanishes (secular capitalism).

  *   **If the link is strong:** Capitalism shouldn't thrive in secular or Catholic contexts without the specific religious anxiety. (Weber struggles here).
  *   **If the link is weak/decouplable:** The culture wasn't the fundamental cause; it was a transient catalyst for a deeper structural shift (institutions/technology) that could have happened anyway. (The Materialist wins here).

  This is the unacknowledged work in your debate. Your professor relies on "elective affinity" to blur the mechanism (it's not direct causation, it's a resonance), while your flatmate demands direct causation. The "spec" reveals that Weber's thesis is strongest on **Specificity** (asceticism looks different than greed) but weakest on **Exogeneity** (did commerce drive the Reformation?) and **Decoupling** (why did the spirit survive the religion?).

  ***

  ### Scorecard: Contenders Against the Desiderata

  | Desideratum | **Weberian (Culture-First)** | **Materialist (Incentive-First)** | **Institutionalist (Rules-First)** |
  | :--- | :--- | :--- | :--- |
  | **1. Exogeneity** | **Fail.** Hard to prove religion wasn't a response to economic change. | **Pass.** Treats culture as endogenous to material conditions. | **Mixed.** Institutions often evolve with economics, but legal shocks can be exogenous. |
  | **2. Mechanism** | **Pass.** Strong psychological account (anxiety -> discipline). | **Pass.** Clear utility maximization (prices/wages -> labor). | **Pass.** Clear enforcement (contracts -> security). |
  | **3. Counterfactual** | **Weak.** "No Reformation" scenario is speculative; capitalism might have emerged slower but still emerged. | **Strong.** Incentives exist universally; capitalism is the default equilibrium. | **Strong.** Without property rights, capitalism fails regardless of culture. |
  | **4. Specificity** | **Pass.** Best at explaining *ascetic* accumulation vs. simple greed. | **Fail.** Struggles to explain why religious rhetoric differed if behavior was identical. | **Mixed.** Explains growth, but not necessarily the *ethical* texture of the work. |
  | **5. Decoupling** | **Weak.** Relies on the "Iron Cage" metaphor (habit survives belief), which is hard to test. | **Pass.** Naturally explains universal spread (incentives are universal). | **Pass.** Institutions are transferable/importable without cultural conversion. |
  | **6. Geo/Time** | **Pass.** Explains the NW Europe timing well. | **Weak.** Struggles to explain why it didn't happen earlier in commercial hubs (Venice/Baghdad). | **Pass.** Links to specific political fractures (city-states, charters). |

  **Summary Verdict:**
  *   **Weber** wins on **Specificity** and **Mechanism** (the *quality* of the action) but loses on **Exogeneity** and **Decoupling** (the *necessity* of the action).
  *   **Materialists** win on **Decoupling** and **Exogeneity** but lose on **Specificity** (cannot explain the ethical distinctiveness).
  *   **Institutionalists** offer the best middle ground for **Geo/Time** and **Decoupling**, often treating culture as a lubricant for institutions rather than the engine itself.

  **For your essay:** The strongest argument isn't that Weber is "wrong," but that his thesis fails the **Exogeneity** and **Decoupling** desiderata required for a *strict* causal claim. It succeeds better as a claim about the *legitimation* and *stabilization* of capitalism (making it socially acceptable) rather than its *genesis*. That shifts the debate from "Did Protestantism cause capitalism?" to "Did Protestantism make capitalism sustainable?"—a claim that satisfies more of the spec without triggering the econ student's falsification alarm.
