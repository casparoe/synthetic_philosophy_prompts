prompt: |-
  I lead a five-person country-risk unit at a development bank. Every quarter we have to produce short risk assessments for the sovereign borrowers in our portfolio, and the credit committee downstream of us wants a single number or at least an ordered ranking for each country — expected probability of default within five years, best to worst, so it can be fed into pricing. My problem is that I've been reading about Keynes's views on probability and uncertainty, and I suspect our current process commits exactly the errors he diagnosed: we treat every question as if it had a numerical answer, we collapse the difference between a well-supported modest probability and a barely-supported confident one, and we have no vocabulary for the cases where the honest output is not a low estimate but something like his admission that on some questions the only honest position is that we simply do not know.

  Please turn what is usable in Keynes into a procedure my analysts can actually run on a country in about ninety minutes per quarter. Specifically, I want the procedure to preserve at least these distinctions from his theory, though you should tell me which others deserve to survive the translation and which have to be dropped: (1) the difference between the probability of an argument's conclusion and the weight of the argument — between how likely something is given our evidence and how much evidence we have; (2) his claim that probabilities are often non-numerical and sometimes not even comparable, so that for some pairs of countries the right output may be "cannot be ranked," not a forced ordering; and (3) his suspicion, later developed by Post-Keynesians under the heading of non-ergodicity, that some processes have no stable underlying frequencies to read off, because the relevant future is generated once rather than sampled repeatedly.

  The procedure should fix an output format that the credit committee will accept — for instance a small set of verdicts such as numerical, banded, comparable-but-unranked, or suspended — with explicit rules for when an analyst is permitted to give each, and a required statement of weight alongside whatever probability verdict comes out. It should say what the analysts do when the committee pushes back demanding a ranking we have declared non-comparable, and it should be honest about which steps are judgment calls dressed up as procedure.

  Then run it on three cases: (a) a mid-income borrower with twenty years of decent fiscal data whose main risk is a plausible but unprecedented constitutional crisis; (b) a borrower where the dominant risk is a livestock pandemic jumping to humans, an event that has never happened in that country but has a well-studied global base rate; and (c) a newly elected government whose fiscal trajectory depends on a reform program that the government itself has not yet specified. At least one of these should come out with an answer the committee will not like, and I want you to show the procedure producing that answer anyway. Finally, tell me where the procedure will misfire — the situations in which Keynes's framework, operationalized this crudely, gives the wrong guidance, and what an analyst should do when they recognize one.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Leader of a 5-person country-risk unit at a development bank.
      *   **Task:** Create a 90-minute quarterly risk assessment procedure based on Keynes's theory of probability (from *A Treatise on Probability* and *The General Theory*).
      *   **Key Keynesian Concepts to Preserve:**
          1.  Probability ($p$) vs. Weight of Evidence ($w$).
          2.  Non-numerical/Non-comparable probabilities (incomparability).
          3.  Non-ergodicity (uncertainty vs. risk, unique future events).
      *   **Constraints:**
          *   Must fit in ~90 minutes per country.
          *   Must produce an output format acceptable to a Credit Committee (who want numbers/rankings).
          *   Must include rules for when to use specific verdicts (Numerical, Banded, Unranked, Suspended).
          *   Must include a "Weight" statement.
          *   Must address pushback from the Committee.
          *   Must admit where judgment calls are disguised as procedure.
      *   **Application:** Run the procedure on three specific cases:
          *   (a) Mid-income, good data, constitutional crisis (unprecedented).
          *   (b) Livestock pandemic jumping to humans (global base rate, no local history).
          *   (c) New government, unspecified reform program.
          *   *Requirement:* At least one outcome must be unpopular/uncomfortable for the Committee.
      *   **Critique:** Explain where this operationalized Keynesian framework fails and what analysts should do then.

  2.  **Analyze Keynes's Theory (Mental Sandbox):**

      *   *Probability ($p$):* The degree of rational belief. Often not a single number. Can be an interval or ordinal.
      *   *Weight ($w$):* The amount of evidence relative to ignorance. High $w$ means we have lots of data, even if $p$ is low. Low $w$ means we are guessing, even if we feel confident.
      *   *Uncertainty vs. Risk:* Risk is measurable (dice). Uncertainty is unmeasurable (war, future interest rates). Keynes argues most economic future is uncertain, not risky.
      *   *Non-ergodicity:* The future isn't a statistical reflection of the past. Structural breaks happen.
      *   *Incomparability:* You can't always say A is riskier than B. Sometimes they are just different *kinds* of uncertainty.

  3.  **Drafting the Procedure (The "Keynesian Risk Protocol" - KRP):**

      *   *Time Budget:* 90 minutes is tight. Need structured steps.
      *   *Step 1: Evidence Audit (Weight).* Quantify the "knowns."
      *   *Step 2: Ergodicity Check.* Is the future like the past?
      *   *Step 3: Probability Assessment.* Assign the risk level, but allow for "intervals" or "null."
      *   *Step 4: Comparability Check.* Can this be ranked against others?
      *   *Output Format:* Needs to satisfy the committee but retain nuance. Let's propose a "Risk Verdict + Weight Score" system.
      *   *Committee Pushback:* Need a script or protocol for defending "Unrankable."

  4.  **Developing the Output Format:**

      *   Committee wants: Single number or Ranking.
      *   Keynes wants: Nuance.
      *   Compromise: A "Risk Class" (Low/Med/High/Unknown) + A "Weight Grade" (A-D) + A "Comparability Flag" (Rankable/Non-Rankable).
      *   *Verdict Types:*
          1.  **Numeric (N):** Stable history, ergodic.
          2.  **Banded (B):** Some data, structural uncertainty.
          3.  **Ordinal-Only (O):** Can rank within a peer group, but not globally.
          4.  **Suspended (S):** Fundamental uncertainty (Keynesian Uncertainty).

  5.  **Refining the Steps (90 Minutes):**

      *   0-15 min: Data/Weight Audit.
      *   15-45 min: Ergodicity & Scenario Analysis.
      *   45-60 min: Probability/Verdict Assignment.
      *   60-75 min: Comparability Check.
      *   75-90 min: Write-up & Weight Statement.

  6.  **Applying to Cases:**

      *   *Case A (Constitutional Crisis):* Good data (High Weight historically), but event is unprecedented (Non-ergodic). Verdict: Banded or Suspended? Let's go **Banded (High Weight, Wide Interval)**. Committee won't like the width.
      *   *Case B (Zoonotic Pandemic):* Global base rate exists, local doesn't. Is it ergodic? Biologically yes, politically no. Verdict: **Numeric (with low weight)**. Actually, Keynes would argue base rates from other contexts don't apply perfectly. Let's make this **Banded**.
      *   *Case C (Unspecified Reform):* No data on the policy. Pure uncertainty. Verdict: **Suspended**. Committee *hates* this. This fulfills the "outcome they won't like" requirement.

      *Wait, I need to ensure the distinctions are clear.*
      *   Case A: High Weight, Low Ergodicity.
      *   Case B: Medium Weight (global data), Medium Ergodicity (biology is stable, politics isn't).
      *   Case C: Low Weight, Low Ergodicity. -> **Suspended**.

  7.  **Addressing the "Pushback" and "Misfire":**

      *   *Pushback:* The protocol needs an "Escalation Clause." If Committee forces a rank, the analyst must attach a "Dissenting Weight Warning."
      *   *Misfire:* Keynes's framework is paralyzing. In a bank, you *must* lend or not lend. Sometimes you have to act on low weight. The procedure might encourage "hiding" behind uncertainty.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, pragmatic, slightly academic but actionable.
      *   *Structure:*
          1.  Introduction (The Philosophy).
          2.  The Procedure (KRP-90).
          3.  The Output Format.
          4.  The Three Cases.
          5.  The Critique (Where it breaks).

      *   *Self-Correction on Case A:* A constitutional crisis is a "unique event." Keynes would say probability is meaningless. But the bank needs a number. Let's assign a "Banded Probability" (e.g., 5-25%) with High Weight on *context* but Low Weight on *outcome*. Actually, let's stick to the prompt's request: preserve the distinction between $p$ and $w$.
      *   *Refining Case C:* This is the best candidate for "Suspended." The government hasn't specified the program. There is no evidence to weigh. $w \approx 0$.

      *   *Refining the Output:* Let's use a matrix.
          *   Axis 1: Risk Level (1-5).
          *   Axis 2: Weight (High/Low).
          *   Axis 3: Comparability (Yes/No).
      *   *Committee Constraint:* They want pricing. Pricing requires $p$. If $p$ is suspended, pricing is impossible. The procedure must acknowledge this implies a "No-Trade" or "Maximum Premium" recommendation.

  9.  **Finalizing the Procedure Details:**

      *   *Step 1 (Weight):* Score 1-5 based on data availability/stability.
      *   *Step 2 (Ergodicity):* Yes/No. If No, probability cannot be numerical.
      *   *Step 3 (Verdict):* Choose from {Numeric, Interval, Ordinal, Suspended}.
      *   *Step 4 (Comparability):* Can I rank this against Country X?

  10. **Writing the Response:** (incorporating the specific constraints about judgment calls and misfires).

      *   *Check:* Did I include the 90-minute limit? Yes.
      *   *Check:* Did I address the 3 Keynesian distinctions? Yes ($p$ vs $w$, non-numerical, non-ergodic).
      *   *Check:* Did I run the 3 cases? Yes.
      *   *Check:* Is one outcome unpopular? Yes (Case C).
      *   *Check:* Did I explain where it misfires? Yes.

      *(Self-Correction during drafting)*: Make sure to explicitly mention which parts of Keynes are being dropped. For example, Keynes's deep philosophical skepticism about induction might be too paralyzing. We have to assume *some* induction works for the sake of the bank existing. Also, the "90 minutes" is a constraint that forces heuristics, which contradicts Keynes's call for deep deliberation. I need to acknowledge this tension.

      *Refining the "Pushback" protocol:* It shouldn't just be "say no." It should be "If forced, provide number but flag weight as Critical."

      *Refining the "Misfire":* The biggest risk is "Uncertainty Washing" — using uncertainty to avoid making a hard call on a risky loan that *should* be rejected on merits, not epistemology.

  11. **Final Polish:** Ensure the tone is appropriate for a unit leader speaking to analysts and a credit committee. (Professional, direct, intellectually honest).

      *(Final check on Case B)*: Livestock pandemic. Global base rate exists. Is it ergodic? Viruses mutate. It's a "unique" event in that country. But we have biological frequencies. This is a good test of "Reference Class" problems. I will classify this as "Banded" because the transmission to *sovereign default* is the uncertain link, not the virus itself.

      *(Final check on Case A)*: Constitutional crisis. Precedent exists elsewhere, but not here. High weight on fiscal data, low weight on political outcome. Verdict: **Interval**.

      *(Final check on Case C)*: Unspecified reform. $w$ is near zero. Verdict: **Suspended**.

      Okay, ready to write.
answer: |-
  Here is a procedural framework designed to operationalize Keynes's *A Treatise on Probability* and *The General Theory* within the constraints of a development bank's credit cycle.

  ### The Keynesian Risk Protocol (KRP-90)

  **Objective:** To produce a sovereign risk verdict that distinguishes between *risk* (measurable uncertainty) and *uncertainty* (unmeasurable ignorance), while fitting within a 90-minute analyst workflow.

  **Philosophical Compromises:**
  To make this usable, we must drop two Keynesian tenets:
  1.  **Radical Inductive Skepticism:** We cannot afford to question whether the sun will rise tomorrow. We must assume *some* structural continuity to function as a bank.
  2.  **Infinite Deliberation:** Keynes viewed probability as a logical relation requiring deep contemplation. We are capping this at 90 minutes. This means "Weight" will be a heuristic proxy, not a true epistemological measure.

  ---

  #### Part 1: The 90-Minute Workflow

  **Minutes 0–15: The Weight Audit ($w$)**
  *Task:* Quantify the evidence base, not the risk.
  *Action:* Score the country on a **Weight Scale (1–5)**:
  *   **5 (High):** 20+ years of stable data, institutions function predictably, risk factors are historical repeats.
  *   **3 (Medium):** Data exists but structural breaks occurred in last 10 years, or risk factor is new but analogous to past events.
  *   **1 (Low):** New regime, data gaps, or risk factor is unprecedented (no reference class).
  *   *Output:* Record $w$-Score. If $w \le 2$, you are prohibited from issuing a Numeric Verdict (see below).

  **Minutes 15–45: The Ergodicity Check**
  *Task:* Determine if the future can be modeled as a shadow of the past.
  *Action:* Answer the **"Structural Break Question"**: *Is the mechanism generating the risk today the same as the one that generated data in the past?*
  *   **Yes:** Process is ergodic. Frequencies apply.
  *   **No:** Process is non-ergodic. The future is being created, not sampled.
  *   *Output:* Ergodicity Flag (Ergodic / Non-Ergodic).

  **Minutes 45–60: Probability Assessment ($p$)**
  *Task:* Assign the risk level based on the Ergodicity Flag.
  *Action:* Select one of four **Verdict Types**:
  1.  **Numeric (N):** Single % probability. (Requires $w \ge 4$ AND Ergodic).
  2.  **Banded (B):** Range (e.g., 5–15%). (Requires $w \ge 3$ AND Non-Ergodic).
  3.  **Ordinal (O):** "Riskier than X, safer than Y," but no number. (Used when comparability exists but measurement fails).
  4.  **Suspended (S):** "No rational basis for belief." (Required if $w \le 2$ AND Non-Ergodic).

  **Minutes 60–75: Comparability Check**
  *Task:* Determine if this country can be ranked against the portfolio.
  *Action:* Ask: *Is the uncertainty here of the same kind as our other borrowers?*
  *   If Country A has *risk* (dice) and Country B has *uncertainty* (unique event), they are **Incomparable**.
  *   *Output:* Comparability Flag (Rankable / Non-Rankable).

  **Minutes 75–90: Write-Up & Weight Statement**
  *Task:* Draft the memo.
  *Requirement:* The "Weight Statement" must explicitly state what is *not* known. Example: *"Probability is low, but Weight is critical because the model assumes no regime change."*

  ---

  #### Part 2: Output Format for the Credit Committee

  The Committee requires pricing inputs. We will provide a **Risk Matrix Code** rather than a single scalar.

  | Verdict Code | Meaning | Pricing Instruction |
  | :--- | :--- | :--- |
  | **N-w4/5** | Numeric, High Weight | Use probability for standard pricing model. |
  | **B-w3** | Banded, Medium Weight | Price at the *upper bound* of the interval. |
  | **O-w2** | Ordinal, Low Weight | Price based on peer comparator, add 50bps "Uncertainty Premium." |
  | **S-w1** | Suspended, Critical Weight | **No Price.** Recommend "Watchlist" or maximum collateral requirement. |

  **Rule for Committee Pushback:**
  If the Committee demands a single number for a **Banded**, **Ordinal**, or **Suspended** verdict:
  1.  Analyst provides the number requested.
  2.  Analyst *must* append a **"Weight Warning"** to the pricing ticket.
  3.  The Warning states: *"This number is a forced heuristic. The Weight of Evidence is Low. Actual default risk is unmeasurable."*
  4.  This Warning triggers a mandatory review by the Chief Risk Officer if the loan defaults. This creates accountability for ignoring the uncertainty.

  ---

  #### Part 3: Application to Three Cases

  Here is the protocol applied to your three scenarios.

  **(a) The Constitutional Crisis**
  *   **Profile:** Mid-income, 20 years fiscal data ($w$ starts high). Risk: Unprecedented constitutional crisis.
  *   **Weight Audit:** Fiscal data is strong ($w=4$), but political mechanism is broken ($w$ drops to 3). **Final $w=3$**.
  *   **Ergodicity:** Non-Ergodic. A constitutional crisis changes the rules of the game; past fiscal data may not predict behavior under new rules.
  *   **Verdict:** **Banded (B)**.
  *   **Comparability:** Rankable against other political crises, but not against standard credit risks.
  *   **Output:** `B-w3 | 10–25% PD | Rankable`
  *   **Committee Friction:** They will want the midpoint (17.5%). The protocol forces the band. They must price at 25%.

  **(b) The Zoonotic Pandemic**
  *   **Profile:** Livestock pandemic jumping to humans. No local history, but well-studied global base rate.
  *   **Weight Audit:** Local data is zero. Global data is high. Does global data count as local evidence? Keynes would say cautiously. **Final $w=2$** (Reference class problem).
  *   **Ergodicity:** Non-Ergodic. Biological mutation + sovereign response is a unique conjunction.
  *   **Verdict:** **Ordinal (O)**. We can say "Riskier than a standard flu, safer than total collapse," but the base rate doesn't translate to *sovereign default* probability reliably.
  *   **Comparability:** **Non-Rankable**. This is a biological shock, not a credit cycle shock. Comparing it to a country with high debt-to-GDP is category error.
  *   **Output:** `O-w2 | Peer: Country X | Non-Rankable`
  *   **Committee Friction:** They cannot plug "Ordinal" into a pricing engine. They must use the Uncertainty Premium rule.

  **(c) The Unspecified Reform Program**
  *   **Profile:** New government. Fiscal trajectory depends on reforms they haven't specified yet.
  *   **Weight Audit:** No data on the policy. No track record for this specific administration. **Final $w=1$**.
  *   **Ergodicity:** Non-Ergodic. The future is being created by decisions not yet made.
  *   **Verdict:** **Suspended (S)**. There is no rational basis for a probability. Any number is a guess disguised as math.
  *   **Comparability:** **Non-Rankable**.
  *   **Output:** `S-w1 | No PD | Non-Rankable`
  *   **Committee Friction:** **High.** This is the verdict they will hate. It implies the bank cannot price the loan.
  *   **Protocol Enforcement:** The analyst must recommend "Watchlist" status. If the Committee forces a number (e.g., 5%), the analyst attaches the **Weight Warning**. If the country defaults, the Warning protects the analyst and indicts the Committee for overriding the epistemological constraint.

  ---

  #### Part 4: Where This Procedure Will Misfire

  Operationalizing Keynes in a bureaucracy creates specific failure modes. You need to warn your analysts about these three traps:

  **1. The "Uncertainty Wash"**
  *   **The Failure:** Analysts will use the **Suspended** verdict to avoid making difficult calls on risky loans they simply dislike for political or non-credit reasons. It is easier to say "we cannot know" than to say "this government is incompetent."
  *   **The Fix:** Require that a **Suspended** verdict be signed off by the Unit Head (you). If an analyst produces too many Suspended verdicts, audit their Workflows for laziness.

  **2. The False Precision of Weight**
  *   **The Failure:** By scoring Weight 1–5, we commit the very error Keynes warned against: quantifying the unquantifiable. Analysts will treat a Weight Score of 3 as a hard number, arguing over whether it should be 3 or 4, while ignoring the deeper epistemological void.
  *   **The Fix:** Remind analysts that the Weight Score is a *communication device* for the Committee, not a truth. In the narrative, they must describe *why* the weight is low, not just cite the score.

  **3. The Pricing Paradox**
  *   **The Failure:** The bank *must* lend to fulfill its development mandate. A **Suspended** verdict technically implies "No Trade." If we follow Keynes strictly, we might starve the very countries that need development finance most (because they are the most uncertain).
  *   **The Fix:** Distinguish between *Pricing Risk* and *Pricing Uncertainty*.
      *   **Risk** is priced via interest rates (expected loss).
      *   **Uncertainty** is priced via *structure* (collateral, tranches, disbursement conditions).
      *   If a verdict is **Suspended**, the procedure should not block the loan, but it must force **Structural Mitigation**. You do not lend against a probability; you lend against collateral that survives the uncertainty.

  ### Summary for the Credit Committee

  When you present this to the Committee, do not frame it as "Keynesian Philosophy." Frame it as **"Evidence-Weighted Pricing."**

  Tell them: *"Currently, we are pricing a guess the same as a calculation. This protocol forces us to charge more when we are guessing. It protects the bank's capital by ensuring that when we lack evidence, we either price for the worst case or secure better collateral. It stops us from pretending we know the future when we don't."*

  They will accept the "Weight Warning" liability shift because it protects *them* from blame if the model fails, provided they respect the protocol. If they force a number against a **Suspended** verdict, the Warning ensures the blame lands on their decision, not your unit's analysis.
