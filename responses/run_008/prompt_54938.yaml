  3. The pairing of purism (1) and stakes-sensitive permission (6) looks unstable but dissolves because you can consistently hold epistemic status fixed while practical rationality varies.
  4. You can save the package most cheaply by changing (3) to a sufficiency claim, permitting knowledge to be insufficient for action in high-stakes scenarios.
  5. Ultimately the package is unstable as written, yet it remains viable provided you sever the necessary link between knowledge and the propriety of action.
