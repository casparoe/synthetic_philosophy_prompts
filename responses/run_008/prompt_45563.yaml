      *   **Core Thesis:** History must serve *life* (action, creation, vitality). Too much history harms life (historical malady).
      *   **Three Modes:**
          1.  *Monumental:* Looking to great past figures for inspiration to act now. Risk: Distortion, ignoring context, making the past seem too easy to replicate.
          2.  *Antiquarian:* Preserving the past, reverence for origins, local identity. Risk: Mummification, rejecting anything new, hoarding without purpose.
