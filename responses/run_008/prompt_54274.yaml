          *   Address the God belief. Yes, he allowed it, but with caveats (live, forced, momentous option).
          *   Address Relativism. Yes, James is more relativistic than Peirce, but not purely subjective.
      *   **Part 3: The Wishful Thinking Objection:**
          *   Acknowledge it's a famous critique (Russell).
