      *   *Claim 4:* "Fuller said the statute wasn't law because it was so evil..."
          *   *Analysis:* **Nuance Needed.** Fuller argued the Nazi statutes violated the *inner morality of law* (e.g., retroactivity, secret laws), not just that they were substantively evil. He argued for a reinterpretation or a new statute to punish the wife, rather than simply saying "it wasn't law so she goes free."
      *   *Claim 5:* "...Hart said it was valid law, so the Germans just had to accept that she broke no law even though sending her husband to his death was monstrous."
