answer: |-
  # Q&A Prep Sheet: Descriptions in Cold Contexts
  **Audience:** Linguistics Semantics Group (Dynamic/Heim/Kamp heavy + 1 Strawsonian)
  **Goal:** Defend Russellian truth-conditions for "cold" texts without denying dynamic data for conversation.

  ## Part 1: What to Volunteer in the Talk
  *Do this to signal you aren't a time-traveler from 1905. Drop these naturally during the "Concession" or "Generalization" phase.*

  1.  **Acknowledge Heim (1983) on Accommodation:** When you discuss the legal statute, explicitly say: *"I am aware that in dynamic frameworks, a novel definite triggers accommodation into the Common Ground. My claim is that in cold contexts, accommodation is blocked or irrelevant; the text does not seek to update a shared conversational record, but to state conditions."*
  2.  **Mention "Maximize Presupposition" (Heim 1991):** When contrasting "a" vs. "the," acknowledge that linguists treat the choice of *the* as signaling stronger presuppositional content. Frame your view as: *"In cold contexts, the 'presupposition' is not a constraint on the Common Ground, but a constraint on the world-state required for the rule to apply."*
  3.  **Distinguish Semantic vs. Pragmatic Presupposition:** Use the Stalnakerian distinction. *"I am happy to grant that definites carry a pragmatic presupposition of familiarity in dialogue. I am denying they carry a semantic presupposition that affects truth-value in non-conversational texts."*

  ---

  ## Part 2: Likely Objections & Replies

  ### 1. The Projection Problem (The Strawsonian's Move)
  **The Question:** "If existence is *asserted* (Russellian) rather than *presupposed* (Strawsonian), how do you explain projection? If I say 'The King of France is not bald,' the existence of the King survives negation. If it were part of the assertion, negation should deny it. Your legal examples are affirmative; what happens when a statute is negated or questioned?"

  **The Reply (Hold):**
  "Distinguish between *conversational* negation and *logical* negation. In a dialogue, negation often targets the update potential, preserving background assumptions. But in a cold context—say, a scientific claim or a legal finding of fact—we care about the truth of the proposition. If a judge rules 'It is not the case that the surviving spouse inherits,' they are not presupposing a spouse exists; they are denying the condition is met.
  I'm arguing that dynamic projection is a feature of *discourse management*, not truth-conditions. In cold contexts, the 'projection' disappears because there is no Common Ground to project into. The sentence is simply false if the existential conjunct fails. We shouldn't let the behavior of 'the' in casual conversation dictate the semantics of 'the' in a code of law."

  *   **Soft Spot:** Negation in law is tricky ("No surviving spouse shall...").
  *   **Verdict:** **Hold.** This is your core distinction (Cold vs. Hot).

  ### 2. Accommodation and "Seamlessness"
  **The Question:** "In conversation, if you say 'I picked up the kids,' and I didn't know you had kids, I don't think you've said something false. I accommodate. The discourse flows. If Russell is right and existence is asserted, shouldn't I reject the utterance as false? Why posit a 'repair' mechanism (accommodation) if the semantics is just quantificational?"

  **The Reply (Concede the data, Hold the theory):**
  "I agree the discourse flows. But *why* does it flow? The Stalnakerian story is that you are repairing a failed assertion. The fact that accommodation feels seamless doesn't prove the existence claim wasn't made; it proves listeners are cooperative.
  In my 'cold contexts,' that cooperativity is absent. If a form says 'Sign here if the beneficiary is deceased,' and the beneficiary is alive, you don't 'accommodate' the death to make the form work. You reject the form. The dynamic machinery explains how we smooth over errors in conversation. It doesn't explain why, in non-conversational contexts, the existence condition behaves like a truth-conditional requirement."

  *   **Soft Spot:** It risks making "accommodation" look like a magic wand you just refuse to wave in legal texts.
  *   **Verdict:** **Hold,** but be humble about the conversational data.

  ### 3. Situational Uniqueness ("I went to the bank")
  **The Question:** "Russell requires absolute uniqueness. But I can say 'I went to the bank' even though there are thousands of banks. Dynamic semantics handles this via situational familiarity—the file contains a salient bank. If you stick to Russell, isn't almost every ordinary use of 'the' false? How does your legal analogy help with ordinary uniqueness?"

  **The Reply (Concede):**
  "That's exactly why I restrict my thesis to 'cold contexts.' In a statute, 'the surviving spouse' *does* require a stricter uniqueness condition relative to the decedent. In ordinary conversation, I grant you: the domain is restricted pragmatically, and familiarity does the work.
  My point isn't that Russell is right about 'the bank.' It's that the *mechanism* for 'the bank' (pragmatic domain restriction + familiarity) is not the *mechanism* for 'the surviving spouse' in the statute. Don't let the flexibility of conversation obscure the rigidity of the text."

  *   **Soft Spot:** If they push that *all* uses are context-sensitive, even legal ones (which statute? which jurisdiction?).
  *   **Verdict:** **Concede** on ordinary language, **Hold** on the legal/textual distinction. Don't fight the "bank" battle; it's their home turf.

  ### 4. Weak vs. Strong Definites (The Syntax-Semantics Interface)
  **The Question:** "Consider existential constructions. 'There is a book on the table' is fine. 'There is the book on the table' is infelicitous. This suggests 'the' carries a familiarity requirement that 'a' doesn't, syntactically encoded. If 'the' is just a quantifier, why does it clash with 'there is'?"

  **The Reply (Concede):**
  "I have no quarrel with the syntax of existential sentences. That is likely a matter of information structure, not the core semantics of the determiner. My claim is about the truth-conditional contribution of the definite description in predicative positions, specifically in texts designed to be context-independent.
  If the syntax of 'there is' requires novelty, that supports the idea that *some* uses of 'the' require familiarity. I'm arguing that *not all* do. The 'there is' test doesn't apply to statutes ('There shall be the surviving spouse' isn't how laws are written). Let's not let the behavior of definites in presentational constructions dictate the semantics of definites in normative provisions."

  *   **Soft Spot:** Linguists hate separating syntax/semantics/pragmatics too cleanly.
  *   **Verdict:** **Concede.** This is a syntactic/lexical constraint issue. It doesn't threaten your main thesis about truth conditions in cold texts.

  ---

  ## Part 3: The "Hope Nobody Asks" (And The Worse One)

  ### The Question You Fear: Embedded Cases (Conditionals)
  **The Question:** "Consider a conditional statute: 'If the surviving spouse claims the inheritance, they must file within a year.' If there is *no* surviving spouse, is this conditional true? On your Russellian view, the antecedent is false, so the conditional is vacuously true. But legally, the rule doesn't 'trigger'—it's not that it's vacuously true, it's that the presupposition of the rule fails. Doesn't this show existence is presupposed even in cold contexts?"

  **The Reply (Dangerous):**
  *Argument:* In classical logic, false antecedent = true conditional. In law, if the condition isn't met, the rule is inert.
  *Strategy:* Pivot to **material implication vs. rule application**.
  *Draft:* "In a truth-conditional semantics, yes, it's vacuously true. But legal interpretation isn't just classical logic; it's deontic. However, notice: if there is no spouse, the *obligation* to file does not arise. That is consistent with the antecedent being false. The 'presupposition' you're sensing is the *felicity* of the rule, not its truth. I maintain that if we ask 'Is this statement correct?', the answer relies on the existence of the spouse. If we ask 'Does this rule apply?', that's a different modality."

  *   **Risk:** This sounds like word salad. If they press on **Presupposition Projection in Conditionals** (e.g., "If the King of France is bald, he wears a hat"), you are in trouble. The standard dynamic view is that the antecedent *locally* accommodates the presupposition for the consequent. If you say it's asserted, the logic breaks.
  *   **Verdict:** **Hold your ground but limit scope.** Reiterate: "My thesis is about simple declaratives in cold contexts. Embedded cases introduce modal operators where I agree the dynamics get more complex." (Basically, retreat to the simple case).

  ### The *Actually* Worse Question: Generic/Kind Denoting Definites
  **The Question:** "Scientific writing is your paradigm 'cold context.' But consider: 'The electron has a negative charge.' This isn't quantificational over a specific electron (Russell), nor is it about a familiar file card (Dynamic). It's kind-denoting. If your theory relies on scientific text, how do you handle generics without abandoning Russell?"

  **Why this is worse:**
  1.  You explicitly cited "scientific writing" as a cold context where Russell wins.
  2.  Russellian analysis of generics is notoriously disastrous ("The electron has a charge" $\neq$ "All electrons have a charge" or "There is exactly one electron").
  3.  If you fumble this, you look like you don't know the semantics of scientific language, which undermines your primary evidence base.

  **The Reply (Preparation):**
  "You're right that generics are a distinct semantic category. Carlson (1977) and others have shown definites can denote kinds. I am not claiming *every* use of 'the' in science is Russellian quantification over individuals. I am claiming that when a text specifies conditions for *particular* entities (e.g., 'The sample was heated to 100 degrees'), the uniqueness and existence are asserted truth-conditions, not presuppositions.
  Don't let the special case of generics ('The tiger is striped') obscure the standard case of specific reference in technical reports ('The reactor cooled'). My thesis targets the specific reference in cold contexts, not kind-reference."

  ---

  ## Part 4: Strategic Advice for the Q&A

  1.  **Don't say "Pragmatics" as a Trash Can:** When you say "That's pragmatics," linguists hear "I don't have a semantic theory for that." Instead, say: *"That is a constraint on the Common Ground, not on the Truth Conditions."*
  2.  **Respect the Dynamic Machinery:** Don't call DRT "wrong." Call it "a theory of discourse update." Your claim is that discourse update $\neq$ truth conditions in all domains.
  3.  **The "Free Food" Syntax People:** If a syntactician asks about the DP structure, defer gracefully. *"I'm treating the DP as a quantifier for the purpose of truth conditions, but I defer to the syntax group on the internal structure."*
  4.  **If Cornered on Conditionals:** Admit that embedded cases are the "hard problem" for any Russellian. *"That is precisely why I've focused on simple declaratives in statutes. Embedded cases require a more complex interaction between quantification and modality that I'm not addressing today."* (Better to retreat than to bluff).

  **Final Mindset:** You are not trying to kill Dynamic Semantics. You are trying to carve out a **domain of immunity** for Russell. If you frame it as "Russell for Law/Science, Dynamic for Conversation," you can survive. If you frame it as "Russell is True, Dynamic is False," you will be eaten alive.
