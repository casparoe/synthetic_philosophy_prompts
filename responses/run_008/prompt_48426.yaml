prompt: |-
  I'm a journalist covering science and ideas for a long-form magazine, and I'm at work on a piece about omissions — cases where a failure to act seems, uncomfortably, to do causal work: the surgeon who never rechecks the chart, the neighbor who never phones the fire brigade, and, increasingly, automated systems that fail to warn a human operator in the seconds when a warning would have mattered. My working thesis is that our everyday concept of causation is quietly at war with itself over absences: we say the gardener killed the plants by not watering them, yet most analyses of causation — regularity, counterfactual dependence, production — take causes to be events, and a non-watering is not an event but the lack of one. Philosophers have offered various escape routes, and I want my piece to hang its narrative on the ones that are genuinely live rather than on tidy textbook resolutions.

  So I'd like a defended prioritization of the open questions in the metaphysics and semantics of causation by omission. I'm less interested in a survey than in the reasoning: for each question you rank, tell me why it deserves the place it gets — how many other issues in the area turn on it, whether it's tractable by argument alone or hostage to unsettled physics or psychology, whether it's neglected because it's unfashionable or because it's genuinely hard, and what would make you move it up or down. To give you a sense of the terrain as I understand it, the candidates I've encountered include at least these: whether omissions are causes at all, or merely occasions on which ordinary causes operate unchecked; whether every omission is irreducibly relative to a norm or expectation — a "failure" only against a background of what someone was supposed to do — and if so, whether that relativity imports morality into causation rather than the other way round; whether omission-causation is really a species of double prevention, and if not, what separates the two; how a chain of nested omissions transmits responsibility (the lifeguard who didn't check the schedule, the scheduler who didn't circulate it, the manager who didn't require circulation); and whether the moral distinction between doing and allowing should be respected by, or simply corrected against, whatever metaphysics of absence we settle on. If the most important question isn't on my list, say so and put it at the top on its own terms. Please also flag, as you go, which of these questions my journalistic treatment could responsibly leave open in the final piece and which I would be misleading readers to present as settled.

  For the last line of your answer, please give a machine-readable summary: a single line of the form \answer{...} containing a short phrase (no more than about ten words) naming the one open question you'd place first.
