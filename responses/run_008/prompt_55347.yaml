  **Counsel from the Public**

  **To the Public:** A Young Man asks whether he should devote his youth to a specific cause requiring personal sacrifice, or merely observe its progress.

  **The Public Replies:** The Public observes that devotion is a relic of a more passionate, less enlightened time. To commit oneself is to limit the scope of one's reflection, which is the primary duty of the age. Action is rash; it closes doors that understanding keeps open. The Public suggests that it is far more prudent to cultivate a sensible opinion on the cause than to burden oneself with its execution. Sacrifice implies that something matters more than the self's comfort, which is in poor taste. Let others act. The Public prefers to judge the outcome from a distance, where no responsibility can adhere.

  **To the Public:** A Writer wonders whether to attach his name to an essay criticizing the theater, or to publish it anonymously for the sake of safety.

  **The Public Replies:** The Public perceives that names are merely chains binding the thought to the thinker. When a sentiment circulates without a father, it belongs to everyone and no one, which is its proper state. The press is the Public's humble instrument, designed to carry whispers without tracing them to a mouth. To sign is to invite accountability, and accountability is a burden for which there is no compensation. Anonymity allows the critique to be enjoyed for its cleverness rather than scrutinized for its source. It is more dignified to remain a shadow within the aggregate than to stand exposed as an individual.

  **To the Public:** A Reader complains that a satirical journal has depicted him as a fool. He asks whether he ought to mind such an affront to his character.

  **The Public Replies:** The Public advises that taking offense is a sign of outdated sensibilities. In a reflective epoch, ridicule is the gentlest form of correction, sparing blood while administering shame. To mind is to claim significance where there is only generality. He should view himself as the Public views him: an instance of a type, interchangeable with any other. Laughter is the stoning of the spirit, far more humane than the stoning of the body. He should appreciate the attention. It proves he exists, if only as a subject for the collective amusement. To resist is to lack irony.

  **To the Public:** S. writes that the column consumes the substance of those who write to it, turning their genuine struggles into amusement for the idle, leaving them hollow.

  **The Public Replies:** The Public congratulates S. on his capacity for distinction. It is rare for one to perceive the mechanism while caught within it. Such individuality is isolating, but envy is the only passion this age permits, and it sharpens the eye. Every epoch receives the martyrs it requires. Previous times used rocks; this one uses wit. The suffering is the same, but the noise is less. S. is free to suffer his insight alone. The Public will continue to reflect upon him, for even the critic provides material for the aggregate. There is no escape from the mirror.
