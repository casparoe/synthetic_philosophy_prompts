prompt: |-
  My buddy's deep into pop history books, and after finishing one about contingency in history he gave me the grand takeaway. Roughly: history is chaotic like a weather system, so outcomes are basically accidents — if a driver hadn't taken a wrong turn in Sarajevo, or if a couple of key people had died earlier, the whole 20th century would be unrecognizable, and therefore there's no such thing as "underlying causes." WWI wasn't caused by alliance systems or nationalism, it was caused by a wrong turn. Historians who talk about deep structural causes are just doing hindsight — you look at what happened, pick a precursor that sounds deep, and call it "the cause." And since you can't rerun history, any "what would have happened if" is untestable, so counterfactuals are meaningless — good material for novels, nothing more. Bottom line: history is one damn thing after another, and anyone claiming to find laws or lessons in it is selling something.

  He delivered all this with alot of confidence, and the vibe seems off to me but i cant put my finger on exactly where. The one thing I keep circling back to: I write software for a living and I've messed around with chaotic systems, and chaotic doesn't mean anything can happen. Lorenz trajectories diverge like crazy from tiny differences, but they never leave the attractor — you can't predict individual runs, yet you can still say real things about the shape of the whole system. Feels like he's sliding from "sensitive to small changes" to "no structure at all." But honestly maybe I'm the one stretching my chaos analogy onto history, so I don't want to lean on it too hard.

  Can you go through his summary piece by piece and tell me what a working historian would actually agree with, what's a subtle misrepresentation, and whether his bottom line — no causes worth naming, no lessons, counterfactuals meaningless — actually follows from the parts that are true? I'd especially like it if you could point out the specific spots where he's conflating two things that should be kept apart, since that's the kind of thing I'd never catch on my own.
