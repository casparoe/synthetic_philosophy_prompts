answer: |-
  In the elite "Vanguard Corps," protocol dictates that any safety violation resulting in equipment loss requires a public "Status Reduction" ceremony where the responsible officer is stripped of rank insignia before the battalion. Officer Aris negligently damaged a drone. Before sentencing, his squad-mate, Officer Bren, formally invokes the "Shield Rite," volunteering to undergo the Status Reduction in Aris's place. Aris accepts Bren as his proxy, acknowledging the debt, and the Commandant approves the transfer, citing corps tradition. Bren undergoes the humiliation and loss of seniority; Aris retains his rank but acknowledges Bren's sacrifice. The battalion observes the ceremony, the norm is reinforced, and future negligence is deterred because the cost remains certain and visible, regardless of who physically stands on the dais.

  **Analysis of the Three Views**
  The **Consequentialist** is indifferent to the swap. Since the deterrent effect is secured (negligence carries a certain cost), the norm is expressed publicly, and the volunteer suffers no more than the offender would have, the net utility is identical to the standard case. The identity of the sufferer is morally irrelevant; only the function of the suffering matters. The **Lewisian** argues the swap is permissible because the representation relation makes the punishment-event literally Aris's. By accepting Bren as his proxy, Aris extends his moral agency such that Bren's suffering counts as Aris's own penalty; it is not a substitute punishment but the original punishment distributed across persons. The **Hard-line Retributivist** declares the swap impermissible. Regardless of consent or utility, Bren did not commit the negligence and therefore does not deserve punishment. Punishing an innocent person is a intrinsic wrong that consent cannot waive and social benefits cannot override.

  **The Driving Feature and the Removal Test**
  Strictly speaking, **none** of the three features (volunteering, representativeness, good effects) produce the Retributivist's verdict; the verdict is produced solely by Bren's *innocence* (lack of desert). However, **Representativeness** is the feature the Lewisian claims does the work to override the innocence objection. If we remove Representativeness (Aris refuses the proxy) while keeping Volunteerism and Good Effects, the Lewisian verdict flips to "Impermissible" (without the relation, it is just punishing an innocent), but the Retributivist verdict remains "Impermissible." This invariance reveals the crux of the disagreement: the Lewisian believes representation can metaphysically transfer the *status* of being punished, while the Retributivist believes it cannot transfer the *desert* required to make that punishment just.

  **The Retributivist's Strongest Move and Its Cost**
  The Retributivist's strongest move is to deny that representation can transfer *moral desert*, distinguishing it from the transfer of *liability*. They argue that while one can authorize another to pay one's debts (civil liability), one cannot authorize another to absorb one's guilt (penal desert). This move is not cheap, but it is costly. It forces the Retributivist to draw a sharp, perhaps unsustainable, line between penal and civil contexts. If a parent paying a child's fine is permissible (vicarious liability), but a squad-mate taking a demotion is not (vicarious punishment), the Retributivist must explain why the *type* of suffering changes the transferability of the obligation. If they cannot, their prohibition looks like an arbitrary restriction on agency; if they can, they must concede that Lewis is right about the metaphysics of representation but wrong that it applies to *desert*—which concedes the structural possibility of substitution while denying its moral permissibility.
