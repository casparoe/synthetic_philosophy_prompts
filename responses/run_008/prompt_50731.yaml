prompt: |-
  I want a thought experiment for pressure-testing David Lewis's defense of penal substitution — his move was roughly that, given the right representation relation between people, one and the same punishment-event can count as punishing the offender even when it's the substitute who gets whipped, so it's not a misleading stand-in but literally the offender's punishment. No divine actors needed for this, keep it secular and realistic: something like a military flogging regime, a sentencing hearing where a parent offers to serve a child's sentence, that sort of thing.

  Design the case so that three features come apart: (1) the substitute fully volunteers and understands what they're taking on, (2) the offender genuinely accepts this person as their representative, and (3) the punishment actually accomplishes whatever you think justifies punishment in the first place (deterrence, expression of society's condemnation, whatever you pick). The tricky constraint: build it so a hard-line retributivist still has to say the swap is impermissible — punishing an innocent is wrong even when everyone consents and the good effects are all there — while a Lewisian representation view says it's fine, and a consequentialist is indifferent either way. I want the scenario to generate those verdicts rather than just stipulate them, so don't have anyone in the story announce that it's fine or not fine. One paragraph for the scenario itself.

  After that, walk through what each of the three views says and why, tell me which of the three features (volunteering, representativeness, or the good effects) is actually doing the work of producing the retributivist's verdict, and what happens to the verdict when you remove that one feature while keeping the other two. Then finish with the strongest move the retributivist has for blocking the case — e.g., denying that representation can transfer desert — and say honestly whether that move is cheap or whether it costs the retributivist something elsewhere. This is for a paper arguing Lewis's move is either a real defense of penal substitution or a sleight of hand, so the case needs to actually discriminate between those, not just dramatize the disagreement.
