answer: |-
  She is absolutely right, and I would bet money on it. In fact, relying on private consensus to change institutional policy is not just ineffective; it is epistemically broken.

  You are currently living inside a textbook case of **pluralistic ignorance** sustained by a lack of **common knowledge**. The reason your private griping changes nothing while a single public statement could change everything isn't superstition; it's the difference between *mutual knowledge* and *common knowledge*, and the specific game-theoretic constraints of collective action.

  Here is the defense, stripped of the math but keeping the rigor you'd expect in your seminar.

  ### 1. The Epistemic Gap: Mutual vs. Common Knowledge
  Right now, you have **mutual knowledge**. You know the policy is bad. You know your peer knows it's bad. Your peer knows *you* know it's bad. But that chain stops there. You do not know that *they* know that *you* know that *they* are willing to go on the record.

  In social epistemology (following David Lewis and Thomas Schelling), **common knowledge** requires an infinite recursion: *I know X, you know X, I know that you know X, you know that I know that you know X,* and so on.

  Private conversations cannot generate common knowledge. They are pairwise and fragmented. If you complain to three people, you have three separate dyads of mutual knowledge. But in a town hall, when one person stands up and says, "This policy is unacceptable," and the room does not erupt in booing, a transformation occurs. Suddenly, it is not just that everyone *feels* it; it is that everyone *knows* that everyone else *knows* it is felt.

  Why does this matter? Because without common knowledge, no individual can accurately assess the risk of dissent.

  ### 2. The Coordination Problem (The Assurance Game)
  You are all stuck in an **Assurance Game** (a variant of the Stag Hunt). You prefer to oppose the policy *if and only if* enough others oppose it with you. If you oppose it alone, you get labeled a "troublemaker" and suffer reputational cost. If you oppose it together, the policy changes.

  Private conversations do not solve the Assurance Game. If I tell you privately I hate the policy, I am engaging in "cheap talk." I have no skin in the game. I might tell you I'm angry but stay silent in the meeting to protect my fellowship. You know this. So, even though we agree privately, we both defect (stay silent) publicly because we lack assurance that the other will actually coordinate.

  The public forum is the only mechanism that converts cheap talk into a **costly signal**. When someone speaks up in the town hall, they incur a risk. By absorbing that risk, they prove their commitment. That signal provides the assurance everyone else needs to join in. Without that first public speaker, the coordination equilibrium remains stuck at "everyone silent."

  ### 3. Institutional Plausible Deniability
  Finally, you have to look at the administration's epistemic position. Administrations operate on **public legitimacy**, not private sentiment.

  As long as the opposition remains private, the administration maintains **plausible deniability**. They can tell themselves (and the faculty) that the "silent majority" accepts the policy. They can dismiss private complaints as isolated grumbling or the venting of a few disgruntled students. There is no public cost to ignoring whispers.

  However, a public objection in a town hall creates a **focal point**. It forces the administration to update their common knowledge. They now know that *you know that they know* you are unhappy. If they ignore a public challenge, they signal weakness or tyranny, which invites further coordination against them. Private complaints allow them to treat the issue as a customer service problem; public complaints force them to treat it as a political crisis.

  ### The Verdict
  Your intuition that "we all know how we all feel" is the trap. That is the definition of pluralistic ignorance: the false belief that your private attitude is different from the public norm.

  The grad rep isn't being superstitious; she is identifying the only mechanism available to break the equilibrium. Private knowledge is structurally inert because it lacks the recursive certainty required for coordinated risk-taking.

  **She is right.** Nothing changes until the mutual knowledge becomes common knowledge. Until someone makes the private pain public, the administration has no incentive to move, and your peers have no assurance to act. The town hall isn't a place to report data the admin already has; it's the only place where the data becomes *actionable*.

  Speak up, or expect nothing to change. That's not magic; that's the mechanics of collective action.
