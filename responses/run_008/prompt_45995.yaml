answer: |-
  You've hit on a classic problem in institutional design and social psychology, and you're right to connect it to the Handicap Principle (Zahavi) and signaling theory (Spence). The inconsistency you're observing isn't just bureaucratic hypocrisy; it stems from different underlying theories of *why* we make people suffer to join a group.

  To answer your core question: **The practice of hazing presupposes different things depending on which theory is driving it, but in its most toxic form, it relies heavily on the Handicap Principle.**

  Here is the breakdown of the three theories, what they predict, and where they fail. Then we'll tackle the inconsistency between your fraternity, OCS, and the hospital.

  ### 1. The Three Theories of Initiation

  #### A. Costly Signaling (The Handicap Principle)
  *   **The Logic:** The cost *must* be the point. For a signal to be credible, it must be too expensive for a "low-quality" type to fake. If the task is useful (e.g., "learn this manual"), a lazy person might still do it because it helps them. If the task is wasteful and painful (e.g., "hold this plank for 20 minutes while we yell"), only someone truly confident in their status or commitment will pay it.
  *   **What the Practice Presupposes:** It presupposes that **wastefulness is a feature, not a bug.** If the suffering were useful, it would be training, not hazing.
  *   **Predictions:** Rituals should be arbitrary, dangerous, or humiliating. They should not teach skills relevant to the group's function.
  *   **What It Rules Out:** It rules out "efficient" initiation. If you can prove loyalty by doing something easy, the signal is cheap and worthless. This theory predicts that if you ban the wasteful suffering, the group loses its ability to verify member quality, leading to free-riders.

  #### B. Screening (Self-Selection)
  *   **The Logic:** This is less about biology and more about economics. The goal is to set a price of admission high enough that people who don't value the membership won't pay it. It filters out free riders before they get the benefits.
  *   **What the Practice Presupposes:** It presupposes that **commitment is correlated with willingness to endure pain.** It assumes that the people who quit during hazing would have been bad members anyway.
  *   **Predictions:** High dropout rates during the pledge period are a success metric, not a failure. The specific activity matters less than the *magnitude* of the cost.
  *   **What It Rules Out:** Open membership. It rules out the idea that you can assess fit through interviews or low-stakes interaction.

  #### C. Social Bonding (Communitas)
  *   **The Logic:** Shared suffering releases endorphins and creates a psychological "debt" among peers. It's not about signaling to the group that *I* am good; it's about creating a shared trauma that binds *us* together.
  *   **What the Practice Presupposes:** It presupposes that **synchrony in pain creates synchrony in loyalty.**
  *   **Predictions:** The suffering must be collective, not individual. Isolation hazing shouldn't work as well as group hazing.
  *   **What It Rules Out:** It rules out individual testing. If I suffer alone in a room, I don't bond with the other pledges. This theory predicts that cheap collective rituals (like a difficult group hike) *should* work just as well as dangerous ones, provided the emotional intensity is high. The fact that groups converge on the *costly* version suggests they don't actually believe this theory alone; they mix it with Signaling.

  ### 2. The Inconsistency: Hazing vs. Boot Camp vs. Residency

  You asked what separates the "bad" hazing from the "noble" suffering of OCS or Med. It comes down to **Human Capital vs. Social Capital** and **Institutional Legitimacy.**

  1.  **Instrumentality of Suffering:**
      *   **Med/Military:** The suffering is (theoretically) incidental to skill acquisition. In residency, the 80-hour weeks are justified because medicine requires repetition and exposure to rare cases under stress. In OCS, the sleep deprivation simulates combat stress. The suffering produces *human capital* (skills you keep).
      *   **Hazing:** The suffering produces *social capital* (trust within the group). Drinking until you vomit or doing pointless chores does not make you a better fraternity brother in a functional sense; it only makes you a more trusted one.
      *   **The Distinction:** Society tolerates suffering that creates public utility (doctors, soldiers) but bans suffering that creates private utility (frat bonds).

  2.  **Exit Options and Power Dynamics:**
      *   **Med/Military:** These are state-sanctioned or licensed professions. There is oversight, HR, and a legal framework. While hazing *does* happen in the military and hospitals, it is technically illegal there too. The "log drills" are authorized training; the unauthorized abuse is still banned.
      *   **Fraternities:** These are private social clubs with less oversight. The power dynamic is often peer-to-peer without adult supervision. The "consent" is also fuzzier because of social pressure and the desire to belong during a vulnerable developmental stage (college).

  3.  **The Signal's Recipient:**
      *   **Med/Military:** You are signaling to the *public* that you are competent to handle life-and-death situations.
      *   **Fraternities:** You are signaling to *peers* that you are loyal.
      *   Society cares more about the former signal because the stakes involve public safety.

  ### 3. Philosophical Underdetermination

  You asked if we can tell from the outside which theory a group is running on. **No, we can't.** This is the underdetermination problem.

  A fraternity chapter can claim they are doing "bonding" (Theory C) to justify "screening" (Theory B) behaviors that are actually just "signaling" (Theory A).
  *   *Example:* Making pledges stand in the cold.
      *   **Bonding argument:** "We suffered together."
      *   **Screening argument:** "Only the dedicated stayed."
      *   **Signaling argument:** "We proved we can take pain."

  Because the rationales overlap, groups can shift their justification depending on who is asking. If the university asks, it's "team building." If the alumni ask, it's "testing loyalty." This makes regulation difficult because the group can always claim the *intent* was bonding, even if the *mechanism* was signaling.

  ### 4. The Position: Are Blanket Bans Coherent?

  Here is my take: **Blanket hazing bans are normatively coherent, but they are functionally blind to the Signaling Theory.**

  If you accept the **Handicap Principle** as a valid way to build trust in a private organization, then a blanket ban on "wasteful costs" effectively bans the mechanism those groups use to verify loyalty. If the only way to prove I'm not a free-rider is to do something a free-rider won't do, and the ban says "you can't make them do hard things," the ban has broken the group's trust mechanism.

  **However, the bans are coherent for two reasons:**

  1.  **The "Wastefulness" Trap:** In modern society, we generally reject the idea that *physical risk* is a valid currency for *social trust*. We accept *time* and *effort* (residency, OCS) as currency, but not *dignity* or *safety*. A ban on hazing essentially says: "You can screen for commitment using difficult work (useful cost), but you cannot screen using arbitrary harm (wasteful cost)."
  2.  **Agency and Exit:** In residency or OCS, you are an adult entering a profession with a clear contract. In undergraduate fraternities, the power dynamic is skewed, and the "consent" is often coerced by social isolation threats. Bans protect the *ability to exit* without catastrophic social loss.

  **Conclusion:**
  The practice of hazing presupposes that **trust requires a blood tax.** It assumes that without a costly, wasteful barrier, the group's integrity will collapse.

  Blanket bans reject this presupposition. They assert that **trust can be built through time, shared positive experiences, and useful work,** rather than shared trauma.

  The bans are coherent *if* you believe that the "Handicap" of physical/psychological risk is an illegitimate price for social membership. They only seem incoherent if you believe that the only way to filter for true loyalty is through arbitrary suffering. Given that military and medical institutions (which need loyalty much more than a frat does) are also moving away from hazing and toward professional standards, the evidence suggests the "Handicap" model is not only ethically dubious but functionally unnecessary for building high-performing groups.

  So, your nationals are right to ban it, not because suffering doesn't build bonds, but because **arbitrary suffering is a lazy, dangerous, and inefficient technology for building them.**
