  The community center kitchen was quiet now, the whiteboard from the annual prediction review session still covered in fading dry-erase marks. Elias leaned against the counter, stirring a lukewarm coffee. Sarah sat at the table, stacking prediction cards into decks.

  "Another year, another near-miss," Elias said, nodding toward the board where the 'Global Carrying Capacity' thread was marked *Pending*.

  Sarah didn't look up. "You mean another year where Malthus was wrong again. We're twenty years past the deadline on that 2005 thread, Elias."

  "Deadlines are arbitrary when you're dealing with geological time," Elias replied. "The core argument stands. Exponential growth against a finite carrying capacity. The fact that we're still here doesn't refute the physics; it just means we found a one-time subsidy. Fossil energy, the Haber-Bosch process. We burned the capital instead of living off the interest. The delay is exactly what a correct long-run theory should look like from inside the run-up."

  "That's convenient," Sarah said, finally meeting his eyes. "But from where I sit, a prediction with no deadline, whose every failure gets rescued by an appeal to some unforeseen enabler, has been immunized against refutation. 'Right but early' isn't a vindication the theory can claim. It's a retroactive license to never concede. If you can push the goalpost every time the ball misses, you aren't playing the game."

  "It's not moving goalposts if the field is infinite," Elias countered. "You're treating this like a lab experiment with a stop-watch. I'm treating it like orbital mechanics. Sometimes there's drag you didn't model. That doesn't mean gravity is false."

  "Sometimes," Sarah conceded. "I'll grant you that some genuinely good theories survived early apparent refutations before their enabling conditions arrived. Newtonian mechanics looked shaky when Uranus's orbit didn't match the math. But the response wasn't 'Newton is right, just wait.' It was 'If Newton is right, there must be a planet there.' And then they found Neptune. There was a specific, risky constraint. What's your Neptune? What specific observation lowers your confidence, rather than just resetting the clock?"

  Elias set his cup down. "Decoupling. Genuine, permanent decoupling of economic growth from energy and material throughput. If we see global GDP double over the next fifty years while total energy consumption drops by half, without a collapse in human welfare or a shift to service-only economies that hide the supply chain... that breaks the model. It would mean efficiency isn't just slowing the drain, it's changing the nature of the pipe. That would falsify the hard constraint."

  "Okay," Sarah said, tapping a card on the table. "That's a start. But here's the epistemic bill you haven't paid. Every year you say 'not yet,' you ask for Bayesian credit for holding the true belief. But if the prediction is essentially 'Eventually, limits bind,' that's a tail-risk claim. The probability mass is spread over infinity. Repeated 'not-yets' should earn you no credit, because the theory absorbs all evidence by definition."

  "Unless," Elias said, leaning forward, "you're modeling the wrong structure. You're treating it as a flat claim: 'Collapse happens by year X.' I'm treating it as a conditional: 'If subsidies exceed regeneration, collapse follows.' The antecedent hasn't been satisfied yet. We are still drawing down the fossil battery. Your complaint about vacuity misses the structure of the claim. It's not that I'm wrong about the date; it's that the condition hasn't triggered."

  "But how do you know when the condition triggers until after the collapse?" Sarah pressed. "If the subsidy looks like innovation, and innovation looks like subsidy, the conditional becomes unfalsifiable in real-time. You only know the antecedent was satisfied when the consequent arrives. That's hindsight, not prediction."

  "Then we disagree on the visibility of the constraint," Elias said. "EROI is measurable. Soil depletion is measurable. We can see the battery draining. It's not hidden."

  "We can see the drain," Sarah said. "We just disagree on whether there's a backup generator around the corner we haven't invented yet. And that's where the crux lies."

  She stood up, gathering the cards. "You think this is a conditional with a not-yet-satisfied antecedent. So my complaint about vacuity misses the structure. I think this is a tail-risk claim whose repeated 'not-yet' should earn no Bayesian credit until the mechanism is locked in. We're not fighting about physics, Elias. We're fighting about whether 'eventually' counts as a forecast."

  Elias smiled, a tired expression. "Then let's write that down for next year's review. Under 'Crux.'"

  "Done," Sarah said. "But I'm still marking the prediction as unresolved. No credit for waiting."

  "Fair," Elias said. "But keep an eye on the soil metrics. The bill comes due."

  "Always does," she replied, turning off the kitchen light. "Just never on schedule."
