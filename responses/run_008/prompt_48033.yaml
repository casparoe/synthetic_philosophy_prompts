  3. Classical mathematics is not in error. It is a coherent and entirely legitimate practice, and its theorems are true of the very same numbers the constructivist studies; classical logic is simply a more liberal inferential apparatus operating on the same subject matter.
  4. I accept Markov's principle: if it is impossible that no counterexample to a decidable predicate exists, then a counterexample exists, and — crucially — I think a proof of that impossibility counts as a constructive proof of existence.

