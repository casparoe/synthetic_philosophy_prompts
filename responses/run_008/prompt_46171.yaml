prompt: |-
  I'm a second-year PhD student in philosophy of science and I've gotten a bit obsessed with Lakatos's methodology of scientific research programmes — mostly because it seems like the only account that even tries to explain how a theory can absorb anomaly after anomaly and still count as good science (the protective belt doing its job) while some other theory doing roughly the same counts as degenerating. My advisor thinks the whole framework is either too vague to do any real work or else quietly normative in a way Lakatos never justified, and honestly I can't fully disagree with him. Before I commit three years to this, I want a reality check on where the live problems actually are.

  So: what do you think are the most important open questions in or around Lakatos's framework that are worth a dissertation's worth of effort, and why? I want the ranking defended, not just listed. The ones I half-know about are whether the methodology is meant descriptively or prescriptively (and whether that distinction is even stable for him), whether a degenerating problemshift can be made precise enough to be more than a retrospective label we slap on losers, and whether the whole apparatus still says anything interesting now that Bayesian confirmation theory exists and mostly doesn't need talk of hard cores and heuristic power. But there might be something upstream of all three that I'm missing — like whether research programmes even carve science at the right joints once you leave physics and look at economics or climate science or ML research, where the units of scientific activity look pretty different.

  Give me exactly five numbered items, one or two sentences each, no intro and no conclusion. For each item, make clear which bits are actually settled among people who work on Lakatos and which are genuinely contested — I don't want to spend a chapter arguing for something the literature already treats as agreed, or build on a contested reading while presenting it as the standard one. And if you think one of my three candidate questions is a dead end or just not worth three years, say so within that item rather than hedging. If it helps, my background is in economics before this, so questions where the applicability of the framework outside physics is doing real work are the ones I'm most tempted by — tell me if that temptation is leading me somewhere boring.
