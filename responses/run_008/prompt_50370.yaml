      *   *Refinement:* The principle should be about **Information that changes the probability *independently* of your desire for the outcome.**

      *   *Better Principle:* **The "Pre-Registered Predictor" Test.** Would you have defined this class *before* knowing the outcome or having a stake in it?
      *   *Even Better:* **Causal/Structual Stability.** Does the feature belong to the *mechanism* generating the outcome?
