          *   *Marriage:* High agency. Base rates ignore the specific causal mechanism (the relationship work).
      *   **The Unifying Rule:** **"The Pre-Commitment Test"** or **"The Mechanism Test."** Can you define the class without knowing the outcome, and does the feature causally influence the outcome?
      *   **Solving the Tenure Case:**
