      *   *Tenure:* Be careful about "Assistant Professors on track." That *is* the right reference class usually, but the user worries about "baking in an earlier win." That's actually *correct* conditioning. You *have* won the earlier round. Ignoring that is the mistake. I need to explain why conditioning on survival is okay if you've already survived.

