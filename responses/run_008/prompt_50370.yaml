          5.  *Getting Rich:* "People sure they'll get rich" (Clearly wrong/Biased). *Conflict:* How is this different from Statin matching?
          6.  *Tenure Odds:* "Philosophy PhDs" (Too broad/ignores selection) vs. "Assistant Professors on track" (Bakes in survival bias) vs. ??? (Unclear).
      *   **Goal:** Find a unifying principle that validates the "good" intuitions and rejects the "bad" ones, or advise which intuitions to discard. Specifically address the Tenure case.

  2.  **Deconstruct the Intuitions (The "Why"):**
      *   *Life Expectancy:* We want causal relevance. Smoking causes death. Exact cholesterol might be overfitting noise or unavailable data.
      *   *Startup Failure:* "Smart founders" is subjective and hard to define objectively *ex ante*. It's prone to confirmation bias. General startup stats are objective.
      *   *Statin:* Medical intervention relies on *causal mechanisms*. Cholesterol directly causes heart issues. We need the class where the *treatment effect* is known.
      *   *Marriage:* General divorce rates ignore *agency* and *specific relationship dynamics*. Unlike startups (market forces), marriage is highly idiosyncratic and voluntary.
      *   *Getting Rich:* "People sure they'll get rich" is a *result* of the delusion, not a causal predictor. It's circular.
      *   *Tenure:* This is a sequential selection process.

  3.  **Identify Potential Principles:**
      *   *Principle 1: Causal Relevance.* The features defining the class must be causally relevant to the outcome, not just correlated or subjective.
      *   *Principle 2: Epistemic Objectivity.* The features must be knowable/verifiable *before* the outcome is known (no hindsight bias).
      *   *Principle 3: Reference Class Tennis.* (Nate Silver/Scott Adams). Don't pick the class that favors your desired outcome.
      *   *Principle 4: Predictive Stability.* Does the class hold up across similar contexts?
      *   *Principle 5: The "Inside View" vs. "Outside View" (Kahneman & Tversky).* This is the big one. The RCP is usually framed as Outside View (base rates) vs. Inside View (specifics). The solution is usually "Start with Outside, adjust for Inside *if* you have valid reasons."

  4.  **Synthesize a Unifying Framework:**
      *   The tension is between *Specificity* (narrow class) and *Sample Size/Reliability* (broad class).
      *   But there's a deeper tension: *Predictive Validity* vs. *Motivated Selection*.
      *   **Proposed Principle:** **Causal/Structural Relevance + Ex-Ante Verifiability.**
      *   *Why Statin works:* Biological markers are causal and measurable ex-ante.
      *   *Why "Smart Founders" fails:* "Smart" is vague, often defined ex-post by success, and prone to bias.
      *   *Why "Sure they'll get rich" fails:* It's a psychological state correlated with delusion, not a structural predictor.
