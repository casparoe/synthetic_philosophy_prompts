answer: |-
  | Question | Presses on | Likely reply | Follow-up |
  | :--- | :--- | :--- | :--- |
  | 1. Your book argues that the transition to agriculture was, on balance, a bad deal for humanity. When you say "bad deal," are you measuring that in calories, leisure time, or something else? | The core metric of welfare used to judge agriculture vs. foraging. | "It's about autonomy and leisure. Hunter-gatherers work less and want less." | "If autonomy is the metric, does coercion in farming societies outweigh the higher population capacity?" |
  | 2. You revive Sahlins' claim that hunter-gatherers were the "original affluent society." But you define affluence as wanting little rather than having much. Doesn't this redefine the term to fit the thesis? | The definitional move (wants vs. resources). | "Affluence means wanting little rather than having much." | "But if we define affluence by desire, doesn't a malnourished person who desires nothing count as affluent, making the thesis hard to test rather than deep?" |
  | 3. Critics argue that defining affluence this way ignores material deprivation and suffering. How do you respond to the charge that this is semantic sleight of hand? | The validity of the welfare definition against materialist critiques. | "Every welfare concept is contestable, so his is no worse than anyone else's." | "If every concept is contestable, on what grounds do you recommend this one over definitions that prioritize survival rates and child mortality?" |
  | 4. Let's look at the biological record. What fraction of the foragers you lived with lived to see their grandchildren, compared to neighboring farming populations? | Demographic evidence (mortality, life expectancy, grandchildren). | "Modern medicine skews that. Traditionally, they lived full lives, just shorter ones." | "If 'full' means dying at forty while farmers live to sixty, is the 'affluence' worth the cost of missing two decades of life?" |
  | 5. You argue leisure is a higher good than longevity. But if high infant mortality means most parents never reach that leisureful old age, does the average experience still count as affluent? | The trade-off between leisure quality and demographic reality. | "The quality of the years matters more than the quantity." | "Does that principle apply to modern policy? Should we trade life expectancy for leisure today?" |
  | 6. Ethnographers mostly study contemporary foragers who survive on land farmers did not want. Does this mean your subjects are the survivors of a process that pushed them to the margins? | The extrapolation problem (marginal land bias). | "They chose those spaces to maintain their autonomy." | "If pre-agricultural foragers lived on prime land before farmers existed to push them, would they still have been able to maintain that same low-work lifestyle?" |
  | 7. If the foragers you observed are atypical because they occupy ecological niches farmers rejected, can we really generalize their experience to all pre-agricultural people? | The generalizability of contemporary fieldwork to deep history. | "They show us the possibilities of human social organization." | "But if the material base is different, isn't projecting their lifestyle onto the Paleolithic a romantic error?" |
  | 8. If foraging was so superior, why did every society that encountered agriculture eventually adopt it, often violently displacing foragers? | The historical mechanism of the agricultural transition. | "They were coerced or trapped by population pressure." | "If it requires coercion to keep people from farming, does that suggest farming offers something people actually want?" |
  | 9. Is there any level of infant mortality or starvation that would, for you, outweigh the benefit of working fewer hours per week? | The normative limit of the "affluence" claim. | "We shouldn't judge past societies by modern moral standards." | "But you are judging them as 'affluent,' which is a positive moral claim. Can you have it both ways?" |
  | 10. Setting aside definitions and contestability: what specific empirical evidence, in principle, could get you to give this thesis up? | Falsifiability and conditions for changing his mind. | (Cannot use stock replies here without losing credibility) | "So if data showed higher starvation rates even by your definition, you would reconsider?" |

  If the interview runs long, I should cut Question 9. It overlaps significantly with the substantive trade-off already explored in Questions 4 and 5 regarding mortality versus leisure, and cutting it preserves the logical flow from empirical demographics (Q4-5) to historical mechanism (Q8) and finally to falsifiability (Q10) without losing the core argumentative pressure.
