prompt: |-
  My friend and I got into this whole thing last night after watching some documentary about brain emulation, and he kept leaning on the line that the mind is just software running on the brain's hardware. Like he'd just say it and treat it as obviously settling whether an uploaded copy of you would actually be you. When I pushed him on it he basically had two moves: one was the "obviously the mind depends on patterns not meat" thing, the other was this stronger "so we could run your mind on anything, silicon, whatever, if we get the program right" thing. And I noticed he was sliding between them whenever one got challenged, which is what made the argument so annoying.

  So can you untangle that slogan for me? What are the actual distinct precise claims packed into "the mind is software running on the brain's hardware"? I want a menu of readings, from the weak ones basically everyone agrees with, to the strong ones doing real work, to any that are just false or confused. A few things I'd want you to hit along the way: does the brain even have a hardware/software *distinction* the way computers do, or is that already a substantive assumption? Which readings line up with the classic multiple realizability story and which go beyond it? And is there a reading where the analogy just breaks, like where the fact that mental states are realized in neurons with specific properties (timing, chemistry, whatever) matters in a way "hardware details don't matter" papers over?

  Most importantly, tell me which readings would actually get him his conclusion — that an emulation would be a genuine continuing mind — and which ones are just vibes that sound like they get him there but don't. Also worth flagging: does he need the strong reading, or is there some middle version that's defensible and still enough? We sort of left it unresolved at 2am so I want to walk back in with the full disambiguation next time this comes up.
