prompt: |-
  I teach a gen-ed course on ethics and public data — mostly non-majors, 25ish students, one 75-minute session. The unit is on whether the world is becoming less violent, and I don't want to lecture it at them. I want a simulation where they have to decide the question for themselves, but for a fictional civilization, so nobody can just parrot half-remembered podcast takes about Steven Pinker. The thing I want them to run into before anyone names it: whether "violence declined" comes out true depends on choices that look like boring measurement decisions — per capita or absolute, what even counts as violence, how you treat harms that only show up in the records halfway through the period because people just started writing them down.

  Concretely: rules, something I can hand out, and an invented dataset. Make the population grow a lot over the invented time span so the two metrics genuinely diverge, and bury a couple of traps — a harm category that only appears in the data once it's criminalized, a category that quietly shrinks (public executions, say) while a new one quietly appears, something like that. I'd like it staged so they commit to some headline verdict early and then have to either defend it or eat it as more data arrives, and so that the disagreement between groups working from the same numbers surfaces before anyone says the words "per capita" to the class. Splitting them into commissions with different secret mandates would be great if you can make that work — but you know best whether that or something else gets the effect.

  Then a debrief that maps what actually happened onto the real debate: the absolute-vs-rates fight, the visibility problem, and the question of whether there's a fact of the matter once you fix the definitions — and whether fixing the definitions is itself a factual question or a values one. I want the students to do most of the talking in the debrief too, so give me questions, not talking points.

  Also tell me: what will predictably go wrong the first time I run it, and an honest note on which part of the real debate no simulation with made-up numbers can reproduce. I have a feeling it's the stakes — nobody has an interest in the fictional planet's death toll, and in the real version of this fight everyone does — but I'd like you to actually think it through rather than just agree with me.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Course:** Gen-ed Ethics and Public Data (non-majors, ~25 students).
      *   **Session:** One 75-minute class.
      *   **Topic:** Is the world becoming less violent? (Avoiding Pinker parroting).
      *   **Goal:** Simulation where students decide the verdict for a *fictional* civilization.
      *   **Key Learning Outcomes:**
          *   Realize "violence declined" depends on measurement choices (per capita vs. absolute, definitions, recording bias).
          *   Commit to a verdict early, then face conflicting data.
          *   Surface disagreement between groups before technical terms are introduced.
          *   Debrief mapping simulation to real debate (absolute vs. rates, visibility, fact vs. value).
          *   Student-led debrief (questions, not talking points).
          *   Instructor notes: Predictable failures and limitations of the simulation (stakes).
      *   **Deliverables:** Rules/handout, invented dataset, staged activity, debrief questions, instructor notes.

  2.  **Design the Simulation:**
      *   *Setting:* A fictional planet/civilization. Let's call it "Aethel."
      *   *Timeframe:* Needs to show population growth. Let's say 3 eras (Era 1, Era 2, Era 3).
      *   *Groups:* Split the class into "Commissions." To get disagreement, they need different mandates or different data slices.
      *   *Mandates:*
          *   Commission A (Resource Focus): Cares about total stability/order (Absolute numbers).
          *   Commission B (Citizen Focus): Cares about individual risk (Per Capita).
          *   Commission C (Justice Focus): Cares about specific types of harm (Definition changes).
          *   *Wait, better idea:* Give everyone the *same* raw data but different *reporting mandates*. This ensures they look at the same numbers but prioritize differently.
          *   *Actually, the prompt suggests "secret mandates."* Let's try that. It creates immediate divergence.
          *   *Commission 1 (The Ministry of Stability):* Tasked with reporting on "Threats to the State." (Focus on absolute numbers of rebellions/riots).
          *   *Commission 2 (The Office of Citizen Safety):* Tasked with reporting on "Risk to the Average Person." (Focus on per capita rates).
          *   *Commission 3 (The Human Rights Tribunal):* Tasked with reporting on "Recognized Harms." (Focus on changing definitions/new categories).
      *   *Data Structure:* Needs to be simple enough for a 75-minute class but complex enough to hide traps.
      *   *The Traps:*
          1.  **Population Growth:** Population triples. Absolute violence goes up, rate goes down.
          2.  **Definition Shift:** "Domestic Dispute" isn't recorded until Era 2. "Public Execution" stops in Era 2 (state violence hides).
          3.  **Recording Bias:** Era 1 data is spotty (only elite areas), Era 3 is comprehensive.

  3.  **Drafting the Data (Mental Check):**
      *   *Era 1:* Pop 100k. Deaths 1000. Rate 1%. (High visible violence).
      *   *Era 2:* Pop 200k. Deaths 1500. Rate 0.75%. (Absolute up, Rate down). *New Category: Domestic (200 deaths).* *Removed: Executions (was 300).*
      *   *Era 3:* Pop 300k. Deaths 2000. Rate 0.66%. (Absolute up more, Rate down more). *Domestic rises to 500 (better reporting).*
      *   *Result:* Stability Ministry says "Getting Worse!" (1000 -> 2000). Safety Office says "Getting Better!" (1% -> 0.66%). Rights Tribunal says "Wait, we just started counting wife-beating."

  4.  **Structuring the Class (75 mins):**
      *   0-5: Intro & Setup.
      *   5-15: Phase 1 (Initial Verdict). Give limited data.
      *   15-35: Phase 2 (The Complication). Reveal full data & mandates. Group work.
      *   35-55: Phase 3 (The Showdown). Present findings. Conflict arises.
      *   55-75: Debrief.

  5.  **Refining the "Secret Mandates":**
      *   If I give different mandates, they might just argue past each other.
      *   *Better:* Give everyone the *same* dataset packet, but assign them different *roles* for the final report.
      *   *Role A:* Headline Writer for "The Imperial Gazette" (State propaganda, cares about order/absolute numbers).
      *   *Role B:* Headline Writer for "The Citizen's Daily" (Public interest, cares about individual safety/rates).
      *   *Role C:* Auditor for "The Historical Truth Commission" (Cares about data integrity/definitions).
      *   *Wait, let's simplify.* Just split them into 3 groups. Give them the same data. Give them different *questions* to answer.
      *   *Group 1:* "Is the Empire safer for the Emperor?" (Total threats).
      *   *Group 2:* "Is the Empire safer for a Peasant?" (Risk per person).
      *   *Group 3:* "Is our Moral Progress real?" (Types of violence).
      *   *Actually, the prompt asks for "secret mandates."* Let's stick with that. It creates the "surface disagreement before anyone says per capita" effect best.
      *   *Mandate 1:* Maximize perceived stability (Absolute).
      *   *Mandate 2:* Maximize perceived safety (Per Capita).
      *   *Mandate 3:* Maximize perceived moral progress (Definitions).
      *   *Correction:* If I tell them their mandate, they will game it. I want them to *believe* they are finding the truth.
      *   *Revised Approach:* Give them different *data slices* or *priorities* without explicitly naming the statistical bias.
      *   *Let's go with "Departments":*
          *   Dept of Defense (Cares about total body count threatening order).
          *   Dept of Public Health (Cares about probability of death).
          *   Dept of Social Welfare (Cares about specific categories).
      *   *Actually, the cleanest way:* Give everyone the *same* raw data table. But give them different *Charting Instructions*.
          *   Group 1: "Plot Total Violent Events over Time."
          *   Group 2: "Plot Violent Events per 10,000 Citizens over Time."
          *   Group 3: "Plot 'Criminal' Violence vs 'State' Violence."
      *   *This guarantees the divergence.*

  6.  **Developing the Dataset (The Planet "Oakhaven"):**
      *   Time: 3 Centuries (C1, C2, C3).
      *   Population: 100k -> 200k -> 400k (Doubling makes math easy).
      *   Violence Types:
          *   War/Rebellion (Absolute goes up, Rate goes down).
          *   Homicide (Steady rate).
          *   Domestic (Unrecorded C1, Recorded C2/C3).
          *   State Execution (High C1, Zero C3).
      *   *The Twist:* C1 data is incomplete (only capital city). C3 is full census.

  7.  **Drafting the Debrief:**
      *   Need questions that force them to realize *why* they disagreed.
      *   Need to connect to Pinker/Real World without lecturing.
      *   Need to address the "Fact vs. Value" of definitions.

  8.  **Addressing the "What Will Go Wrong" & "Limitations":**
      *   *Failure Mode:* Math anxiety. Keep numbers simple.
      *   *Failure Mode:* One dominant student. Use roles within groups.
      *   *Failure Mode:* They figure out the trick too fast. Add noise.
      *   *Limitation:* Stakes. Students don't care about Oakhaven. Real debate involves policy/funding/identity. Also, real data is messier than this clean simulation.

  9.  **Review against Constraints:**
      *   75 mins? Yes, tight but doable.
      *   Non-majors? Keep math simple (percentages).
      *   No Pinker parroting? Fictional setting handles this.
      *   Student-led debrief? Questions provided.
      *   Instructor notes included? Yes.

  10. **Final Polish:**
      *   Make the handout look official.
      *   Ensure the "Trap" is clear in the data but not obvious in the instructions.
      *   Refine the debrief questions to be Socratic.

  *(Self-Correction during drafting)*: I initially thought about giving different data slices. But if they compare notes, the jig is up. Better to give the *same* data but different *analysis tasks*. That way, when they present, they are all looking at the same numbers but seeing different trends.
  *Wait, one more correction:* The prompt asks for "secret mandates." If I give different tasks, it's not really a secret mandate, it's just different math. A secret mandate implies they *interpret* the data to serve a goal.
  *Decision:* Let's combine them. Same Data Packet. But each group gets a "Mission Card" that tells them what question they are *supposed* to answer for the Galactic Council.
  *   Group 1: "Assess Threat to Imperial Stability" (Implies Absolute).
  *   Group 2: "Assess Risk to Average Subject" (Implies Per Capita).
  *   Group 3: "Assess Moral Progress of Civilization" (Implies Definitions).
  *   *Crucial:* Do not tell them *how* to calculate. Let them figure out that "Threat to Stability" = Total Numbers, while "Risk to Subject" = Rates. This forces the "per capita" realization to come from *them*.

  *Wait, will non-majors know to use per capita for risk?* Some might. Some won't. The conflict arises when Group 1 says "Violence Doubled!" and Group 2 says "Violence Halved!" using the same sheet. That's the gold.

  *Let's refine the Data Traps:*
  1.  **Population:** 100k -> 300k.
  2.  **Violence A (War):** 500 -> 900 -> 1200. (Absolute Up, Rate Down).
  3.  **Violence B (Executions):** 300 -> 100 -> 0. (State violence hides).
  4.  **Violence C (Domestic):** 0 -> 400 -> 600. (New category).
  5.  **Total Raw Deaths:** 800 -> 1400 -> 1800. (Looks like things are getting worse).
  6.  **Rate:** 0.8% -> 0.46% -> 0.6% (Wait, need consistent decline for the Pinker parallel).
      *   Let's adjust:
      *   C1: Pop 100k. Deaths 1000. (1%).
      *   C2: Pop 200k. Deaths 1200. (0.6%).
      *   C3: Pop 400k. Deaths 1600. (0.4%).
      *   *Trap:* Domestic violence only counted in C2/C3. If you add it back, maybe C1 was actually higher? No, keep it simple. The trap is that *Absolute* numbers rise (1000->1600) while *Rates* fall (1%->0.4%).
      *   *Trap 2:* In C1, "State Execution" was 400. In C3, it's 0. But "Homicide" rose.
      *   *Trap 3:* C1 data is from "Core Worlds" only (safer). C3 is "Full Galaxy" (dangerous outskirts included). This mimics the "records improved" bias.

  *Okay, let's finalize the plan.*

  *   **Handout 1:** The Data (Same for everyone).
  *   **Handout 2:** The Mission Card (Different for each group).
  *   **Timeline:** Strict timing needed.

  *Instructor Notes:*
  *   *Predictable Failure:* Groups will finish at different speeds. Need a "bonus question" for fast groups.
  *   *Limitation:* Stakes. Also, in reality, data collection isn't neutral. The simulation implies the data *exists* and we just choose how to slice it. In reality, power decides what gets counted. I need to make sure the debrief touches on *who* decided to count domestic violence in Century 2.

  *Let's write it.*
answer: |-
  Here is a complete lesson plan, including student handouts, data, and instructor notes.

  # Lesson Plan: The Oakhaven Inquiry
  **Time:** 75 Minutes
  **Students:** ~25 (Non-majors)
  **Goal:** Demonstrate that empirical claims about "violence" depend on prior normative and methodological choices (rates vs. absolute, definitions, recording bias).

  ## Part 1: Setup & Distribution (5 Minutes)
  **Instructor Script:**
  "Today you are data commissioners for the Galactic Council. We have received archives from a newly contacted civilization, the planet **Oakhaven**. They have 300 years of recorded history. The Council needs to know: *Is Oakhaven becoming a more violent place?*

  You will work in three commissions. You all get the **same data packet**. However, each commission has a different **mandate** from the Council. Do not show your mandate card to other groups. Analyze the data, answer your specific question, and prepare a one-sentence headline for the Council."

  **Logistics:**
  *   Divide class into 3 groups (A, B, C).
  *   Hand out **The Oakhaven Archives** (same for all).
  *   Hand out **Commission Mandates** (different for each).

  ## Part 2: Analysis Phase (25 Minutes)
  Students work in groups. They must calculate trends based on their mandate.
  *   *Instructor Role:* Circulate. If a group asks "Should we divide by population?", answer: "That depends on what your mandate asks you to assess." Do not validate methods yet.
  *   *Speed Bump:* If a group finishes early, hand them the **"Archivist's Note"** (see below) to complicate their conclusion.

  ## Part 3: The Council Session (20 Minutes)
  Each group presents their **Headline** and the **Key Number** that supports it. Write these on the board.

  *   **Expected Outcome:**
      *   Group A (Stability) will likely cite Absolute Numbers (Violence went UP).
      *   Group B (Safety) will likely cite Per Capita Rates (Violence went DOWN).
      *   Group C (Justice) will likely cite Category Shifts (Violence changed *type*, or "progress" is an illusion).
  *   **The Conflict:** Allow them to argue. "How can you say it's safer when more people died?" vs. "How can you say it's worse when your chance of dying is lower?"
  *   **The Reveal:** Only after they have argued do you allow them to compare Mandate Cards.

  ## Part 4: Debrief (25 Minutes)
  Do not lecture. Use the questions below to draw the insights out of them. Map their findings to the real world (Pinker, crime stats, war data) only as they make the connections.

  ---

  # STUDENT HANDOUT 1: The Oakhaven Archives
  *(Print one per group)*

  **Subject:** Historical Vital Statistics, Oakhaven Civilization
  **Period:** Three Centuries (C1, C2, C3)
  **Source:** Imperial Census & Judicial Records

  | Metric | Century 1 | Century 2 | Century 3 |
  | :--- | :--- | :--- | :--- |
  | **Total Population** | 100,000 | 200,000 | 400,000 |
  | **Deaths by War/Revolt** | 400 | 600 | 700 |
  | **Deaths by Homicide** | 300 | 400 | 500 |
  | **Deaths by State Execution** | 300 | 100 | 0 |
  | **Deaths by Domestic Violence** | 0 | 200 | 400 |
  | **Geographic Coverage** | Capital Region Only | 50% of Planet | 100% of Planet |

  **Archivist's Note (Century 1):** *Records from C1 are incomplete. Only the Capital Region kept detailed logs. Rural deaths were estimated.*
  **Archivist's Note (Century 2):** *New "Family Safety Act" passed. Domestic disputes previously handled privately are now criminalized and recorded.*
  **Archivist's Note (Century 3):** *State Executions abolished. Census coverage expanded to include dangerous borderlands.*

  ---

  # STUDENT HANDOUT 2: Commission Mandates
  *(Cut into strips. Give one type per group. Keep secret.)*

  **COMMISSION A: Ministry of Stability**
  **Your Question:** "Is the total burden of violence on the Oakhaven civilization increasing or decreasing?"
  **Your Goal:** The Council needs to allocate peacekeeping resources. You must report on the **total volume** of violent events the civilization must manage.
  **Deliverable:** A headline stating if the total burden is up or down.

  **COMMISSION B: Office of Citizen Safety**
  **Your Question:** "Is an average person on Oakhaven more or less likely to die violently today than in the past?"
  **Your Goal:** The Council needs to advise citizens on travel safety. You must report on the **individual risk** per person.
  **Deliverable:** A headline stating if individual risk is up or down.

  **COMMISSION C: Tribunal on Moral Progress**
  **Your Question:** "Has Oakhaven's definition of 'violence' expanded or contracted?"
  **Your Goal:** The Council wants to know if Oakhaven is morally improving. Look closely at **which categories** appear or disappear and **who** is being counted in the records.
  **Deliverable:** A headline stating if moral progress is real or illusory.

  ---

  # INSTRUCTOR GUIDE: The Debrief
  *(Do not read this to them. Use these questions to facilitate.)*

  **Phase 1: Surfacing the Disagreement**
  1.  "Group A, read your headline. Group B, read yours. Why do these two statements contradict each other when you used the same table?"
  2.  "Group A, why did you choose to sum the column? Group B, why did you choose to divide by population?"
  3.  "If I am a farmer in Century 3, which headline tells me the truth about my life? If I am the Emperor in Century 3, which headline tells me the truth about my throne?"

  **Phase 2: The Measurement Traps**
  4.  (Point to Domestic Violence row) "Group C, what happened in Century 2? Did domestic violence actually double, or did something else change?"
  5.  "If we treat the Century 1 '0' for domestic violence as a real zero, how does that change the trend line? Is 'better data' the same thing as 'more violence'?"
  6.  (Point to Executions) "State executions went from 300 to 0. That looks like progress. But if those 300 people were instead killed in unrecorded riots, does the 'peace' vanish?"

  **Phase 3: Mapping to Reality**
  7.  "In our world, when politicians say 'crime is up,' are they usually talking about total crimes or crime rates? Why does that choice matter for a growing population?"
  8.  "Steven Pinker argues the world is less violent. Critics say he ignores structural violence or recording bias. Based on Oakhaven, can both sides be looking at the same data and be 'right'?"
  9.  "Is deciding whether to use 'per capita' or 'absolute numbers' a mathematical decision or a moral one?"
  10. "Who has the power to decide what counts as violence? (e.g., The Family Safety Act in Century 2). Does the act of measuring change the reality?"

  ---

  # INSTRUCTOR NOTES: Risks & Limitations

  ### 1. What Will Predictably Go Wrong
  *   **Math Anxiety/Confusion:** Some non-majors will freeze at "per capita."
      *   *Fix:* Write the formula on the board during the work phase: *Rate = (Deaths / Population) x 100*. Tell them "Use percentages."
  *   **Group C (Moral Progress) will struggle:** This is the abstract group. They might just calculate numbers like the others.
      *   *Fix:* Check in on Group C early. Prompt them: "Look at the row labels, not just the numbers. What appears and disappears?"
  *   **The "Gotcha" feels cheap:** Students might feel tricked rather than enlightened.
      *   *Fix:* In the debrief, validate them. "The data *was* ambiguous. The trick wasn't in the numbers, it was in the question. That is exactly how real policy works."
  *   **Time Creep:** The argument phase (Part 3) can eat the debrief.
      *   *Fix:* Hard stop at 20 minutes for presentations. Write the conflicting headlines on the board immediately to anchor the debrief.

  ### 2. The Limitation: The Stakes Problem
  You suspected it, and you are right: **Nobody cares about Oakhaven.**
  In the real debate (Pinker vs. Critics), the stakes are visceral.
  *   **Real World:** If you claim violence is down, you might defund police or ignore war zones. If you claim it's up, you might justify authoritarianism or fear-mongering. People have *identities* and *budgets* tied to the verdict.
  *   **Simulation:** Students are playing with clean numbers. They don't feel the ethical weight of declaring a civilization "safe" when it isn't.
  *   **How to mitigate:** In the debrief, ask: "If Group A's headline was published in a newspaper, who would be angry? If Group B's headline was published, who would be relieved? Who gets hurt if we choose the wrong metric?"
  *   **The Deeper Limitation:** In the simulation, the data *exists*. In reality, much violence is **unrecorded by design**. The simulation implies that if we just choose the right math, we find the truth. The harder truth is that power determines what gets written in the ledger in the first place. (Use Question 10 in the debrief to hit this).

  ### 3. Why This Works (The "Per Capita" Reveal)
  By giving them the **Mandates** rather than the **Methods**, you force them to invent the statistics themselves.
  *   When Group B divides by population, they aren't doing it because you told them "that's how you do rates." They are doing it because their mandate asks about *individual risk*.
  *   This makes the statistical choice a **moral choice**. They realize that "Per Capita" isn't just a math trick; it's a decision to prioritize the individual over the collective. That is the core ethical lesson.
