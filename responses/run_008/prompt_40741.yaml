prompt: |-
  I work for a mid-sized state government's office of continuity and resilience, and my least favorite part of the job has become the word "collapse." Roughly twice a month somebody — a consultant with a slick deck, a worried planner from the ag department, someone forwarding a think tank report — sends us a claim that some system we nominally steward is "collapsing": the groundwater in the eastern agricultural basin, the rural hospital network, the sardine fishery, one time even the DMV. The director wants to know which of these to treat as emergencies and which belong in the ordinary planning queue, and right now we have no principled way to answer; we sort of vibe based on how scared the writeup sounds. From what I've read, the actual collapse literature is basically a long argument about whether "collapse" even names one kind of event: the Maya case where the southern lowland cities emptied out while cities in the north carried on, Tainter's story about diminishing returns on complexity, the people who argue Easter Island wasn't so much a collapse as a transformation people survived, and the skeptics who say "collapse" is mostly a label outsiders stick on a change they happen to dislike. I want the usable parts of that debate turned into a screening procedure my program officers can run in under an hour per claim, with no field data, producing a one-paragraph verdict for the director.

  So what I'd like is a set of questions in order — things like: what exactly is the unit claimed to be collapsing (a population, an institution, a way of life?), over what timescale, is the system ending or reorganizing into something cheaper, is the claimed loss one of complexity or one of wellbeing, who benefits from the word "collapse" being used here — each with a note on what counts as a sufficient answer, where the procedure terminates early with "this isn't a collapse framing, recast it as something else," and where it has to stop and hand the call to a human because it's a values question no checklist can settle. I expect the Maya/Easter Island-style cases, where the answer hinges on what you think the society even is, will land in that last bucket, and I want the procedure to be honest about that about itself. It should also distinguish between claims that are wrong but urgent, and claims that are right but slow, since those need different routing, and it should flag that a "no" on the collapse framing doesn't mean nothing bad is happening.

  Then run it on three claims I actually recieved last year: (1) a consultant says the eastern basin aquifer is being drawn down and regional agriculture will collapse within a decade; (2) a local op-ed calls the closure of four rural hospitals in two years "the collapse of rural healthcare"; (3) the sardine fishery, where the stock is genuinely way down but the fleet just switches target species every few years anyway. People in my office tell me the procedure will probably refuse the collapse framing on claim 2 even though the op-ed author is obviously right that something bad is happening — good, I want to see how the procedure handles handing back an answer I politically won't like. And please tell me flat out what the procedure cannot do: my guess is it can classify a claim but can't forecast whether a real collapse is likely, and if that's right, say so instead of smuggling a prediction in.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Works for a mid-sized state government's office of continuity and resilience.
      *   **Problem:** Too many claims of "collapse" (groundwater, hospitals, fisheries, DMV). No principled way to triage them. Currently relying on "vibe."
      *   **Goal:** A screening procedure (checklist/questions) based on academic collapse literature (Tainter, Maya, Easter Island, etc.) to determine if a claim warrants "emergency" status vs. "ordinary planning."
      *   **Constraints:**
          *   Must be runnable by program officers in under an hour.
          *   No field data required (desk review only).
          *   Output: One-paragraph verdict for the director.
          *   Must distinguish between "wrong but urgent" and "right but slow."
          *   Must acknowledge where the procedure fails (values questions, Maya/Easter Island ambiguity).
          *   Must explicitly state what the procedure *cannot* do (forecasting).
          *   Must apply the procedure to three specific cases: (1) Aquifer/Ag, (2) Rural Hospitals, (3) Sardine Fishery.
          *   User expectation: The procedure should likely reject the "collapse" framing for the hospitals (Claim 2) even if something bad is happening, and the user wants to see that honesty.

  2.  **Deconstruct the "Collapse" Literature (for the Procedure):**
      *   *Tainter:* Collapse is a rapid simplification of complexity (loss of energy capture, bureaucratic bloat).
      *   *McAnany/Yoffee (Maya):* Collapse is often political/elite failure, not necessarily population disappearance. It's about *who* defines the society.
      *   *Hunt/Lipo (Easter Island):* Resilience/adaptation vs. catastrophic die-off. "Transformation" vs. "Collapse."
      *   *Skeptic/Political View:* "Collapse" is a rhetorical device used to mobilize resources or assign blame.
      *   *Key Distinction:* System *termination* vs. System *reorganization/simplification*.

  3.  **Drafting the Procedure (The "Collapse Triage Protocol"):**
      *   *Structure:* Sequential questions. Early exit points.
      *   *Time Limit:* Needs to be fast. 5-6 questions max.
      *   *Question 1: Definition of the System.* What is actually ending? (Population vs. Institution).
      *   *Question 2: Timescale.* Is it rapid (Tainter's definition) or gradual?
      *   *Question 3: Complexity vs. Wellbeing.* Is socio-political complexity dropping, or just quality of life?
      *   *Question 4: Adaptation/Reorganization.* Is there a cheaper/simpler state available?
      *   *Question 5: Rhetorical Benefit.* Who gains from the word "collapse"?
      *   *Termination Points:*
          *   "Not Collapse" (Reframe as degradation/crisis).
          *   "Values Call" (Hand to Director/Political).
          *   "Emergency" (True collapse framing).
      *   *Caveats:* Must explicitly state this doesn't predict the future, it analyzes the *claim*.

  4.  **Refining the Procedure (Self-Correction/Edge Cases):**
      *   *Correction:* The user wants to distinguish "wrong but urgent" vs. "right but slow."
      *   *Adjustment:* Add a specific step for "Urgency vs. Framing." A claim can be factually urgent (people dying) without being a "collapse" (system simplification).
      *   *Correction:* The user wants honesty about the "Maya/Easter Island" ambiguity.
      *   *Adjustment:* Create a specific "Values/Definition" bucket where the procedure stops and says "We can't decide this without defining what the State *is*."

  5.  **Applying the Procedure to the Three Claims:**

      *   *Claim 1: Eastern Basin Aquifer/Ag.*
          *   System: Regional Agriculture + Aquifer.
          *   Timescale: "Within a decade" (Rapid).
          *   Complexity: High (industrial ag) to Low (dry farming/abandonment)?
          *   Adaptation: Can they switch crops? Import water?
          *   Verdict: Likely "Emergency/Planning Hybrid." High risk of simplification.
      *   *Claim 2: Rural Hospitals.*
          *   System: Rural Healthcare Network.
          *   Timescale: 4 in 2 years (Rapid).
          *   Complexity: Loss of specialized infrastructure.
          *   Adaptation: Telehealth? Travel to cities? (This is the "Transformation" argument).
          *   Rhetoric: Op-ed (Political pressure).
          *   *User Expectation:* Procedure should reject "collapse."
          *   *Reasoning:* Healthcare isn't disappearing, it's centralizing or changing mode. It's a service reduction, not necessarily a societal simplification. *However*, if access drops below a threshold, it *is* a collapse of the "rural way of life." This hits the "Values Call" bucket.
      *   *Claim 3: Sardine Fishery.*
          *   System: Sardine Stock vs. Fishing Fleet.
          *   Timescale: Cyclical.
          *   Adaptation: Fleet switches targets.
          *   Verdict: Not collapse. It's resilience/adaptation. The *fish* might crash, the *system* (fleet) persists.

  6.  **Drafting the Limitations Section:**
      *   Must be blunt. This tool analyzes *language and structure*, not hydrology or epidemiology. It cannot predict physical reality.

  7.  **Review against Constraints:**
      *   Under an hour? Yes, 5 questions.
      *   One-paragraph verdict? Yes, will structure the output that way.
      *   Honest about limitations? Yes.
      *   Handles the "Hospital" political friction? Yes, by categorizing it as a "Values/Definition" call or "Reframe as Crisis."

  8.  **Final Polish:**
      *   Tone: Professional, bureaucratic but intellectually rigorous.
      *   Formatting: Clear headings, bold text for decision points.
      *   Ensure the "Maya/Easter Island" nuance is embedded in the "Unit of Analysis" question.

  **(Self-Correction during drafting the response):** I need to make sure I don't just say "No" to the hospitals. The user said "something bad is happening." The procedure needs to validate the *harm* while rejecting the *label*. So the verdict should be "Reframe as Access Crisis, not Collapse."

  Let's build the "Collapse Claim Screening Protocol (CCSP)."

  *   *Step 1: Identify the Unit.* (Is it the people or the structure?)
  *   *Step 2: Identify the Trajectory.* (Simplification or Termination?)
  *   *Step 3: Identify the Alternative.* (Is there a lower-energy steady state?)
  *   *Step 4: Identify the Rhetoric.* (Who benefits?)
  *   *Step 5: Urgency Check.* (Is it fast?)

  *Decision Matrix:*
  *   If Unit = People + Termination = **Emergency.**
  *   If Unit = Structure + Simplification + Fast = **Emergency Planning.**
  *   If Unit = Structure + Service Loss + Adaptation exists = **Reframe (Crisis/Transition).**
  *   If Unit = Ambiguous (Way of Life) = **Values Call (Director).**

  Okay, let's write it.

  *Wait, one more check:* The user specifically asked for the procedure to tell them *where it terminates early* and *where it hands off to a human*. I need to make sure those "Stop" signs are clear in the protocol text.

  *Also:* The user wants to see the procedure run on the three claims *after* presenting the procedure.

  *Final check on limitations:* "My guess is it can classify a claim but can't forecast whether a real collapse is likely." I need to confirm this explicitly.

  Okay, ready to generate.cw
answer: |-
  Here is the **Collapse Claim Screening Protocol (CCSP)** designed for your office. It is derived from the structural definitions in collapse literature (Tainter, McAnany, Yoffee, etc.) rather than the rhetorical usage common in policy memos. It is designed to be run in under 60 minutes using only the provided claim document and public context.

  Following the protocol, you will find the application to your three specific claims, and a frank statement of the procedure's limitations.

  ***

  # Collapse Claim Screening Protocol (CCSP)
  **Purpose:** To distinguish between *system simplification/termination* (collapse), *service degradation* (crisis), and *adaptation* (resilience), and to route the claim to the appropriate decision bucket.
  **Time:** < 60 Minutes.
  **Input:** The claim document (memo, op-ed, report) + basic public context.

  ### Step 1: Define the Unit of Analysis
  **Question:** What exactly does the claimant say is ending?
  *   **A.** A specific population (death, migration, disappearance).
  *   **B.** A socio-political structure (government, institution, network).
  *   **C.** A specific resource or commodity (water, fish, revenue).
  *   **D.** A "way of life" or cultural identity.

  **Decision Point:**
  *   If **A**: Proceed to Step 2. (High probability of genuine collapse).
  *   If **B**: Proceed to Step 2. (Possible Tainter-style simplification).
  *   If **C**: **STOP.** Reframe as *Resource Scarcity*. This is a supply problem, not a system collapse, unless the loss of C destroys B. Route to Resource Management.
  *   If **D**: **STOP.** Hand to Director. This is a values/definition question. (See *Limitations*).

  ### Step 2: Determine the Trajectory
  **Question:** Is the system described as *terminating* or *simplifying*?
  *   **Termination:** The functions cease entirely; no successor system is described.
  *   **Simplification:** The system loses complexity (specialization, bureaucracy, energy capture) but persists in a cheaper, lower-capacity form.
  *   **Transformation:** The system changes structure to maintain function (e.g., digital vs. physical).

  **Decision Point:**
  *   If **Termination**: Proceed to Step 3.
  *   If **Simplification**: Proceed to Step 3.
  *   If **Transformation**: **STOP.** Reframe as *Transition Management*. This is resilience, not collapse. Route to Ordinary Planning.

  ### Step 3: Assess the Timescale
  **Question:** Over what period does the claimant say this occurs?
  *   **Rapid:** < 5 years (one political cycle).
  *   **Gradual:** > 10 years (generational).

  **Decision Point:**
  *   If **Rapid**: Proceed to Step 4. (Potential Emergency).
  *   If **Gradual**: **STOP.** Reframe as *Long-term Risk*. Even if accurate, this is not an immediate continuity emergency. Route to Ordinary Planning.

  ### Step 4: Check for the "Cheaper State" (Tainter Test)
  **Question:** If the system simplifies, is there a viable "lower energy" state available, or is there a cliff edge?
  *   **Cliff Edge:** Loss of the system makes the region uninhabitable or ungovernable.
  *   **Cheaper State:** The region functions with less capacity (e.g., fewer hospitals, dry farming).

  **Decision Point:**
  *   If **Cliff Edge**: **EMERGENCY.** This fits the collapse definition.
  *   If **Cheaper State**: Proceed to Step 5. (This is likely a political argument about acceptable quality of life).

  ### Step 5: Identify the Beneficiary of the Frame
  **Question:** Who benefits from the word "collapse" being used *right now*?
  *   **Resource Mobilization:** The claimant needs emergency funding/statutory override.
  *   **Blame Assignment:** The claimant wants to attribute fault to a specific agency.
  *   **Status Quo:** The claimant wants to prevent a change (e.g., stopping a new development).

  **Decision Point:**
  *   If **Resource Mobilization** + Steps 1-4 indicate Simplification/Termination: **EMERGENCY.**
  *   If **Blame/Status Quo**: **HAND TO DIRECTOR.** This is a political values call. The procedure cannot adjudicate whether the loss of the "status quo" constitutes a collapse of the *State* or just a loss for a *constituency*.

  ***

  # Application to Current Claims

  ### Claim 1: Eastern Basin Aquifer & Agriculture
  **Run:**
  1.  **Unit:** Resource (Water) driving Structure (Ag Industry). (Step 1: C/B hybrid).
  2.  **Trajectory:** Claimant argues for Termination of regional ag, likely leading to Simplification of the rural economy. (Step 2: Simplification).
  3.  **Timescale:** "Within a decade." (Step 3: Rapid/Gradual border, treat as Rapid for continuity).
  4.  **Cheaper State:** If water is gone, can the land support people? If yes, it's a Cheaper State (dry farming/urbanization). If no, it's a Cliff Edge (ghost towns).
  5.  **Beneficiary:** Consultant/Ag Dept seeking intervention.

  **Verdict for Director:**
  > **Routing: Emergency Planning Queue.** While technically a resource scarcity issue (Step 1), the claimant argues the loss of the aquifer triggers a termination of the regional economic structure within a single political cycle (Step 3). The critical unknown is whether a "cheaper state" exists for the population remaining on the land (Step 4). If the basin becomes uninhabitable without industrial water, this is a collapse event requiring continuity staging. If it merely becomes less profitable, it is a transition. Recommend immediate hydrological review to distinguish between *economic contraction* and *habitability loss*.

  ### Claim 2: Rural Hospital Closures (Op-Ed)
  **Run:**
  1.  **Unit:** Structure (Hospital Network). (Step 1: B).
  2.  **Trajectory:** Closures are happening, but healthcare is shifting to telehealth or regional hubs. This is Transformation/Simplification, not Termination of healthcare. (Step 2: Transformation).
  3.  **Timescale:** 4 in 2 years (Rapid). (Step 3: Rapid).
  4.  **Cheaper State:** Yes, centralized care/travel is the "cheaper" (less complex) state.
  5.  **Beneficiary:** Op-ed author seeking political pressure to restore status quo. (Step 5: Status Quo/Blame).

  **Verdict for Director:**
  > **Routing: Reframe as Access Crisis (Ordinary Planning).** The procedure rejects the "collapse" framing. While the loss of facilities is rapid and harmful, the *system* of healthcare is transforming (centralizing/digitalizing) rather than terminating (Step 2). This fails the Tainter test for collapse; it is a reduction in service complexity, not a societal simplification. However, because the "Unit" is arguably a "way of life" for rural residents (Step 1-D), this triggers a Values Call. The procedure cannot determine if "having to drive 40 minutes for care" constitutes a collapse of *rural viability* or merely a degradation of *service*. This requires a political decision on what level of access the State guarantees.

  *(Note: As you suspected, the procedure refuses the label "collapse" despite acknowledging the harm, forcing the Director to own the values judgment on rural viability.)*

  ### Claim 3: Sardine Fishery
  **Run:**
  1.  **Unit:** Resource (Sardines). (Step 1: C).
  2.  **Trajectory:** Stock is down, but Fleet switches targets. (Step 2: Transformation/Resilience).
  3.  **Timescale:** Cyclical. (Step 3: Gradual/Cyclical).
  4.  **Cheaper State:** N/A (System adapts).
  5.  **Beneficiary:** Likely Fishery management or environmental group.

  **Verdict for Director:**
  > **Routing: Ordinary Planning / Natural Resources.** This claim fails at Step 1 and Step 2. The "Unit" is a commodity stock, not a socio-political system. The "Fleet" (the actual human system) is demonstrating resilience by switching targets, which is the definition of *avoiding* collapse. This is a resource management fluctuation. Labeling this "collapse" dilutes the term for actual institutional failures. Route to Fish & Wildlife for standard stock assessment; no continuity implications.

  ***

  # Limitations of the CCSP

  You asked for flat honesty about what this procedure cannot do.

  1.  **It Cannot Forecast:** The CCSP analyzes the *structure of the claim*, not the physical reality. It can tell you if a claim *fits the definition* of collapse, but it cannot tell you if the aquifer *will actually* run dry. It is a triage tool for language and logic, not a predictive model for hydrology or epidemiology.
  2.  **It Cannot Define "The State":** As seen in Claim 2 (Hospitals), the procedure hits a hard stop when the definition of "society" is contested. Is the State defined by its GDP (in which case rural hospitals don't matter) or by its geographic equity (in which case they do)? The CCSP flags this as a "Values Call," but it cannot solve it. If your Director wants to know if rural depopulation is a "collapse" or just "urbanization," this checklist will always hand that back to them.
  3.  **It Cannot Measure Suffering:** A claim can be "Not Collapse" by this protocol (e.g., the hospitals) and still involve significant human suffering, death, or injustice. The CCSP optimizes for *system continuity*, not *human wellbeing*. A "No" verdict means "This does not threaten the continuity of the State's core complexity," not "Nothing bad is happening."
  4.  **It Is Vulnerable to Gaming:** Sophisticated claimants can learn to phrase requests to pass Step 4 (Cliff Edge) even if a Cheaper State exists. Program officers must be trained to spot "catastrophizing" in the description of the alternative state.

  **Summary:** Use this to stop the word "collapse" from losing its meaning. When the procedure says "No," tell the claimant: *"We are treating this as a Crisis or Transition, not a Collapse. This means it goes into the planning queue, not the emergency bucket. If you want emergency status, you must demonstrate why no simpler alternative state is viable."*
