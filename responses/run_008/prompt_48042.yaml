prompt: |-
  I'm teaching an intro-level biomedical ethics course (mostly sophomores, no philosophy background required) and I'm putting together the final exam. I want one essay question on the killing/letting-die distinction, but I'm so tired of getting back essays that are just a plot summary of Rachels' bathtub case plus the words "the bare difference argument" and nothing else. The problem is that the standard exam questions basically invite that: "Does the distinction between killing and letting die have moral significance? Discuss with reference to Rachels and Nesbitt" is a recitation trap and I've learned my lesson.

  So instead I want the question built around a case I made up that forces them to actually use the views rather than name-drop them. Here's the setup I've been working with: an ICU where every ventilator has a failsafe design flaw (company cut corners, there was a recall, the whole thing is a slow-burn scandal) such that the machine requires a nurse to press a "continue ventilation" button every 10 minutes. If the button isn't pressed, ventilation stops. A patient is on the machine, and the staff decides to withdraw treatment -- except now there's an internal fight about whether the nurse should simply not press the button, or press a separate (also existing, for legal reasons) "stop ventilation" button, or physically disconnect the patient from the machine. Administration insists these are all literally identical outcomes and anyone who thinks otherwise is irrational. A resident argues they're not identical, because the machine's default state was set by an engineer years before this patient existed, so whether the patient dies by decision or by default depends on facts about the machine's design history, not on anything the nurses do or don't do now. Then a visiting ethics consultant muddies it further by claiming the case shows the whole act/omission framework presupposes a background of "normal functioning" that machines don't have, so the framework itself is tracking something about who's responsible for setting up which defaults.

  What I want from you: the exam question itself (written for students to answer in about 90 minutes, no external citations available to them), a model answer of roughly 600-700 words, and a marking scheme worth 20 points total. The marking scheme should name the specific moves a top answer must make -- I'm thinking they need to show why the case is a problem specifically for views like Quinn's distinction between eliminating a threat and failing to aid, or Kamm-style attempts to ground doing/allowing in features of agency rather than in outcomes, and not just gesture at "Rachels said there's no difference." It should also say what separates an A answer from a B answer, and include one trap that a superficially good answer typically falls into (my guess is students will want to say the case vindicates Rachels because the three options feel equivalent, without noticing that the equivalence intuition here is doing different work than in the bathtub case -- but you'll see better than I do). Please make the model answer actually take a position rather than surveying, and if you can work in where the resident's "design history" point genuinely bites versus where it's a red herring, even better. Also, minor thing, don't put the phrase "bare difference" in the question itself -- I want to see if they can reconstruct the dialectic without the label.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Context:** Intro-level biomedical ethics course (sophomores, no philosophy background).
      *   **Goal:** Create a final exam essay question on the killing/letting-die distinction that avoids the "Rachels' Bathtub plot summary" trap.
      *   **Scenario:** ICU ventilator with a design flaw requiring a "continue" button every 10 mins. Options for withdrawal: (1) Don't press button, (2) Press "stop" button, (3) Physically disconnect. Admin says identical. Resident says design history matters (default state). Ethics Consultant says act/omission framework relies on "normal functioning" which machines lack.
      *   **Deliverables:**
          1.  Exam Question (90-minute limit, closed book).
          2.  Model Answer (600-700 words, takes a position).
          3.  Marking Scheme (20 points total, specific moves, A vs. B distinction, one specific trap).
      *   **Constraints:** Do not use the phrase "bare difference" in the question. Model answer must argue, not just survey. Address the Resident's "design history" point. Highlight specific philosophical moves (Quinn, Kamm, etc., though adapted for intro level).

  2.  **Deconstruct the Scenario & Philosophical Stakes:**
      *   *The Core Tension:* Standard killing/letting-die distinctions often rely on causal sequences or agency.
      *   *Rachels' Point:* Moral equivalence based on outcome + motive (Bathtub).
      *   *The Trap:* Students usually just say "Outcomes are same, so Rachels is right."
      *   *The Twist:* Here, the *mechanism* of omission is artificial. Usually, "letting die" implies a natural course. Here, the "natural course" (machine stops) is an artifact of engineering.
      *   *Resident's Point:* The "default" is arbitrary. If the default is "stop," continuing is an *act*. If the default is "run," stopping is an *act*. This challenges the idea that omissions are metaphysically distinct from acts.
      *   *Consultant's Point:* The framework depends on normative expectations of function, not just physics.
      *   *Philosophical Targets:*
          *   Quinn (Positive vs. Negative Agency): Does pressing "continue" count as positive agency (harming) or negative (allowing)?
          *   Kamm/Doctrine of Doing and Allowing: Is the causal sequence interrupted by human agency?
          *   Rachels: Is the moral difference solely in motive/outcome, or does the *structure* of the action matter?

  3.  **Drafting the Exam Question:**
      *   Need to present the case clearly but concisely.
      *   Need to ask a specific prompt that requires analysis, not just summary.
      *   *Prompt Idea:* Evaluate the Administration's claim vs. the Resident/Consultant's claims using course concepts.
      *   *Refinement:* Make sure they have to engage with *why* the distinction might matter, not just *if* it exists.
      *   *Constraint Check:* No "bare difference" phrase.
      *   *Time Limit:* 90 minutes implies a substantial essay, but the word count for the model is 600-700, so the prompt should focus on depth over breadth.

  4.  **Drafting the Model Answer:**
      *   *Word Count:* 600-700 words.
      *   *Position:* Needs to take a stand. Let's argue that the Administration is *practically* right but *philosophically* shallow, and the Resident identifies a real problem for agency-based views (like Quinn's), but the Consultant offers the best resolution. Or, argue that the distinction collapses here, but for different reasons than Rachels.
      *   *Decision:* Let's argue that the case undermines *causal* definitions of killing (like Quinn's) but supports a *normative* definition. The Resident is right that physics doesn't help, but wrong that history matters morally. The Consultant is closest: it's about expectations.
      *   *Key Moves:*
          1.  Acknowledge Rachels (outcome/motive) but note this case is different (structural).
          2.  Address the "Act vs. Omission" framework (Quinn/Kamm style without necessarily name-dropping if it's intro level, but the marking scheme will look for the *concept*). Let's use the concepts: "positive agency" vs. "failure to prevent."
          3.  Tackle the Resident: Design history is a red herring for *moral* responsibility, even if true for *causal* description.
          4.  Tackle the Consultant: Normative expectations define the "course of nature."
          5.  Conclusion: The distinction isn't about physics, it's about duty.
      *   *Drafting - Section by Section:*
          *   Intro: State thesis (Admin is right on outcome, wrong on reasoning; distinction relies on norms, not mechanics).
          *   Body 1: Rachels comparison. Why this isn't just Bathtub.
          *   Body 2: The Agency Problem (Quinn). Is pressing "continue" an intervention?
          *   Body 3: The Resident's objection. Why history doesn't change duty.
          *   Body 4: The Consultant's insight. Normative baselines.
          *   Conclusion: Final verdict.
      *   *Word Count Check:* Need to be tight.

  5.  **Drafting the Marking Scheme:**
      *   Total: 20 points.
      *   Categories: Argument/Thesis, Application of Concepts, Critical Analysis (Resident/Consultant), Clarity/Structure.
      *   *Specific Moves:* Must identify that "omission" here is mechanically an "action" (pressing a button). Must address why the Resident's historical point doesn't solve the moral problem.
      *   *A vs. B:* A answers distinguish between *causal* equivalence and *moral* equivalence. B answers conflate them or just repeat Rachels.
      *   *The Trap:* The "Rachels Vindication Trap." Students will say "Outcomes are same, so Rachels wins." But Rachels argued from *motive/outcome*, whereas this case argues from *mechanical structure*. The prompt asks them to see that the *reason* for equivalence is different.

  6.  **Review and Refine:**
      *   *Tone:* Academic but accessible for sophomores.
      *   *Philosophical Accuracy:* Ensure the representation of Quinn/Kamm/Rachels is accurate enough for an intro course context (focusing on the concepts rather than deep exegesis).
      *   *Constraint Check:* "Bare difference" excluded from question? Yes. Model answer length? Yes. Marking scheme specific? Yes.
      *   *Self-Correction on Model Answer:* I need to make sure I don't use too much jargon if it's an intro course, but the prompt asks me to reference Quinn/Kamm in the *marking scheme*. I will keep the model answer accessible but conceptually precise. I will ensure the model answer explicitly takes a position on the Resident's claim.

  7.  **Final Polish:** Check word counts and point distribution. (Self-correction: Ensure the marking scheme clearly identifies the "Trap" as requested).

  *(Self-Correction during drafting Model Answer)*: I need to be careful not to make the model answer too dense. 600-700 words is about 1.5 single-spaced pages. I need to be punchy. I will focus on the "Normative Baseline" argument as the winning position.

  *(Self-Correction during Drafting Marking Scheme)*: The prompt asks for specific moves regarding Quinn/Kamm. I need to make sure the rubric rewards students who recognize that "pressing a button to sustain life" looks like positive agency (Quinn's harmful positive agency) but functions as allowing death.

  Let's assemble.
answer: |-
  ### Final Exam Essay Question
  **Course:** Biomedical Ethics (PHIL 204)
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in a well-structured essay. You may not use notes or external texts. Your grade will depend on the clarity of your argument and your ability to apply course concepts to the specific details of the case.

  **The Ventilator Case**
  A hospital ICU uses a specific model of ventilator known to have a design flaw: the machine does not run continuously. Instead, it requires a nurse to press a "Continue Ventilation" button every 10 minutes. If the button is not pressed, the machine stops, and the patient dies. There is also a "Stop Ventilation" button, and nurses can physically disconnect the tubing.

  A decision is made to withdraw life support from a patient. The Hospital Administration claims that (1) not pressing the button, (2) pressing the "Stop" button, and (3) disconnecting the tubing are morally identical. They argue that anyone who sees a difference is being irrational, as the outcome (death) and the intention (withdrawal of futile care) are the same.

  A Medical Resident objects. She argues that because the machine's "default" state (stopping) was set by an engineer years ago, whether the patient dies by "decision" or by "default" depends on the machine's design history, not the nurse's current action. Therefore, the distinction between acting and omitting is unstable here.

  A Visiting Ethics Consultant adds that the standard framework for distinguishing killing from letting die presupposes a background of "normal functioning." Since machines do not have biological "normal functioning," the framework tracks who is responsible for setting the defaults, not the physics of the action.

  **Prompt:**
  Evaluate the Administration's claim that the three options are morally identical. Does this case support the view that the distinction between killing and letting die lacks moral significance (as James Rachels argues), or does it reveal a deeper problem with how we define "action" and "omission" in technological contexts? In your answer, you must address whether the Resident's appeal to "design history" successfully identifies a moral difference, and evaluate the Consultant's claim about "normal functioning."

  ***

  ### Model Answer 
  The Administration is correct that the three options are morally equivalent, but their reasoning is too shallow. While this case superficially resembles James Rachels' argument that killing and letting die are morally equivalent, it actually demonstrates something more specific: that the distinction between action and omission relies on normative expectations rather than physical mechanics. The Resident's appeal to design history is a red herring, while the Consultant correctly identifies that moral baselines are set by duty, not engineering.

  Rachels' famous bathtub cases argue that if the outcome and motive are identical, the method (drowning vs. letting drown) does not matter. In the Ventilator Case, the outcome and motive are indeed identical across all three options. However, relying solely on Rachels misses the structural puzzle here. Rachels assumed a clear distinction between pushing a head underwater (act) and watching someone slip (omission). Here, "omitting" to save a life requires a repetitive physical action (pressing a button). If we define "killing" strictly as positive physical agency, then keeping the patient alive looks like a series of interventions, and letting them die looks like stopping those interventions. This complicates views like Warren Quinn's, which ground the distinction in whether an agent initiates a harmful sequence versus failing to prevent one. In this ICU, *both* keeping alive and letting die involve manipulating a machine.

  This is where the Resident's objection fails. She argues that because the machine's default state was set by past engineering, the moral status of the nurse's action depends on that history. This confuses causal description with moral responsibility. The fact that an engineer decided the machine stops after 10 minutes is irrelevant to the nurse's current duty. Moral baselines are not determined by how a device was programmed five years ago, but by what is medically and ethically expected now. If we accepted the Resident's view, moral responsibility would shift every time a manufacturer updated a software default, which is absurd. The "default" state of the machine is not a moral baseline; the patient's need for care is the baseline.

  The Consultant offers the stronger insight: the act/omission framework presupposes "normal functioning." In biology, death is the natural default; life is maintained by internal processes. In this machine, "stopping" is the mechanical default. However, in a medical context, the "normal function" of a ventilator is to ventilate. Therefore, pressing the button is not an intrusive act of killing if stopped; it is the maintenance of a therapeutic aid. Disconnecting the tube, pressing "Stop," or refusing to press "Continue" are all ways of withdrawing that aid.

  Consequently, the Administration reaches the right conclusion for the wrong reasons. The options are equivalent not because physics makes them so, but because the moral permission to withdraw treatment renders the *method* of withdrawal secondary. The Resident is wrong to look for moral significance in design history; the Consultant is right that we must look at normative expectations. Ultimately, this case does not just vindicate Rachels; it shows that "letting die" is not about physical passivity. It is about the cessation of an obligation to sustain. Whether that cessation looks like pressing a button or walking away, if the obligation to treat has ended, the moral status is the same. The distinction between killing and letting die survives, but it must be understood as a distinction about duties, not just movements.

  ***

  ### Marking Scheme (20 Points Total)

  **1. Thesis & Position (5 Points)**
  *   **5 pts:** Clearly states a position on the Administration's claim (e.g., "Right conclusion, wrong reason" or "Claim is false"). Explicitly states whether this vindicates Rachels or complicates him.
  *   **3-4 pts:** Position is clear but hedges significantly or conflates the Administration's claim with Rachels' general thesis.
  *   **0-2 pts:** No clear thesis; summarizes the prompt without taking a stand.

  **2. Application of Course Concepts (5 Points)**
  *   **5 pts:** Successfully engages with the *structure* of agency (e.g., references the difficulty of defining "act" vs. "omission" when omission requires button-pressing). Connects to Quinn-style concerns (positive agency vs. failing to aid) or Rachels' outcome/motive focus without merely summarizing the Bathtub case.
  *   **3-4 pts:** Mentions Rachels or act/omission but applies them generically. Fails to note the unique "button-pressing" complication.
  *   **0-2 pts:** Only summarizes the Bathtub case or defines terms without applying them to the ventilator mechanics.

  **3. Critical Analysis of Resident & Consultant (5 Points)**
  *   **5 pts:** Correctly identifies the Resident's "design history" argument as morally irrelevant (a red herring regarding duty). Engages substantively with the Consultant's "normal functioning" claim (accepting, rejecting, or modifying it).
  *   **3-4 pts:** Addresses both figures but treats the Resident's point as philosophically weightier than it is, or dismisses the Consultant without argument.
  *   **0-2 pts:** Ignores one of the two figures or treats their comments as interchangeable.

  **4. Structure & Clarity (5 Points)**
  *   **5 pts:** Logical flow, distinct paragraphs for distinct arguments, precise language.
  *   **3-4 pts:** Understandable but disorganized; some confusion in terminology.
  *   **0-2 pts:** Difficult to follow; significant grammatical issues obstruct meaning.

  **Differentiation: A vs. B Answer**
  *   **A Answer (17-20 pts):** Recognizes that the *reason* for equivalence in this case is different from Rachels' Bathtub case. Rachels argues from *motive/outcome*; this case argues from *technological structure*. The A student explains why the Resident's causal point (engineering history) does not translate to moral responsibility.
  *   **B Answer (13-16 pts):** Correctly identifies that the outcomes are the same and cites Rachels. However, it treats the Ventilator Case as identical to the Bathtub Case, missing the nuance that "omission" here requires physical action. It may accept the Resident's point as a valid counter-argument rather than a category error.

  **The Trap (Specific Deduction)**
  *   **The "Rachels Vindication" Trap:** If a student argues that "This case proves Rachels right because the outcomes are identical," cap the score at **14 points** (unless they qualify it heavily).
  *   **Reasoning:** This is a superficial reading. Rachels argued that *motive + outcome* washes out the distinction. The Administration argues that *mechanical equivalence* washes out the distinction. The prompt asks students to see that the Administration's mechanical argument is weaker than Rachels' moral argument. An A-student sees that the case actually challenges *how* we define omission (Quinn/Kamm territory) rather than simply confirming Rachels.
