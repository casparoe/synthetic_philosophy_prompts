      *Decision:* I will recommend **The "Verbal Report" of Pain** as the primary concrete example, *informed* by the Zombie intuition but not relying on Zombie *ontology*. Why? Because "Why did I say 'ouch'?" is less metaphysically loaded than "Is there a being identical to me without consciousness?"
      *Actually, Chalmers' specific framing relies heavily on the Zombie.* "Why do we say we are conscious? Even a Zombie would say that."
