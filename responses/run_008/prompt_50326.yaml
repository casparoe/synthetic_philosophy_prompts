answer: |-
  Here is a 90-minute session plan designed to navigate the specific pitfalls you've identified.

  ### 1. The Sequence: How much "Hard Problem" first?
  **Do not spend more than 15 minutes on the Hard Problem.**
  Your worry is correct: if you dwell on the Hard Problem, the session will become a debate about qualia and physicalism, and the Meta-Problem will look like a physicalist workaround.

  **The Pivot:** Frame the Hard Problem not as a metaphysical mystery, but as a **sociological datum**.
  *   **Minute 0–15:** Acknowledge the Hard Problem exists *as a topic of conversation*. "We all agree people say things like 'physical descriptions leave something out.' We all agree people write books about the 'explanatory gap.' Let's take that behavior as our starting point."
  *   **Minute 15:** Introduce the Meta-Problem immediately as the study of *that behavior*. "We are not asking today if consciousness is physical. We are asking: what physical processes cause us to *say* consciousness isn't physical?"

  ### 2. The Single Example: The "Pain Report"
  **Your worry about the Zombie Twin is right.**
  In a lay group, "Philosophical Zombies" almost inevitably triggers debates about whether they are *possible*, which drags you into modal realism and metaphysics. You want to avoid ontology entirely.

  **Use this instead:** **The Utterance "This Hurts."**
  *   **What it must have:** It must be a concrete, observable behavior (vocalization or writing) that everyone in the room has performed. It must be linked to an internal state (pain) that everyone accepts is private.
  *   **What it must lack:** It must not commit to whether the pain is "real" or "physical" yet.
  *   **How to run it:**
      1.  Ask the group to imagine the exact chain of neural events that leads a human to say "Ouch" or write "I am in pain."
      2.  Ask: "If we could fully map the neural cause of that sentence, would we have explained why the pain *feels* like something, or only why the *sentence was spoken*?"
      3.  This isolates the **Meta-Problem** (explaining the sentence) from the **Hard Problem** (explaining the feeling).

  ### 3. Intercepting Misconceptions
  You need to head these off at specific moments. Do not wait for them to fully form, or the room will polarize.

  **A. The Engineer (Illusionist)**
  *   **The Risk:** They hear "explain the claim" and think "therefore the claim is false/consciousness is an illusion."
  *   **When to Intercept:** **During the Definition (Minute 15).**
  *   **How to Say It:** "I want to be precise: Solving the Meta-Problem does *not* mean consciousness is an illusion. An illusionist says 'You aren't really conscious.' The Meta-Problem says 'Let's explain why you say you are conscious,' regardless of whether you actually are. We are bracketing the truth of the claim to study the cause of the claim."

  **B. The Dualists (Physicalist Ambush)**
  *   **The Risk:** They hear "explain the claim in physical terms" and think "you are reducing the soul to neurons."
  *   **When to Intercept:** **During the Example (Minute 30).**
  *   **How to Say It:** When discussing the neural chain of the "Pain Report," add this caveat: "Mapping the physical cause of the *report* does not prove the *feeling* is physical. A dualist can agree that brain states cause us to speak, while maintaining the soul is the thing feeling. The Meta-Problem is neutral on this. It just asks for the mechanism of the speech."

  **C. The Dissolutionist ("Explaining claims = Explaining feeling")**
  *   **The Risk:** They argue that if you explain the behavior, the "hard problem" vanishes (the Daniel Dennett/Frankish position).
  *   **When to Intercept:** **At the Transition to Discussion (Minute 60).**
  *   **How to Say It:** "Someone might say, 'If you explain the report, you've explained the pain.' That is a valid philosophical stance (Illusionism/Physicalism), but it is a *solution* to the Hard Problem, not the Meta-Problem. The Meta-Problem is the step *before* that. It asks: 'Even if the feeling remains mysterious, can we explain the *talk*?' We must keep those two questions separate to see if one dissolves the other."

  ### 4. What to Refuse to Settle (and How)
  You must refuse to settle **the ontological status of consciousness** (i.e., Is it physical? Does it exist?).

  **The Script:**
  "We are practicing **methodological agnosticism**. Imagine we are mechanics studying a 'Check Engine' light. We can explain exactly why the light turns on (the sensor, the wiring, the code) without settling whether the engine is actually broken. Today, we are explaining the 'Check Engine' light of the mind. Whether the engine is actually 'broken' (i.e., whether consciousness is non-physical) is a question for the next session. If we mix them now, we solve neither."

  **Why this works:** It frames the refusal not as a dodge, but as a necessary methodological constraint to make progress. It validates the Dualists (the engine might be broken) and the Physicalists (the light is just a sensor) without letting them fight.

  ### 5. The Diagnostic Final Question
  To test if they have genuinely distinguished the Meta-Problem from the Hard Problem, do not ask for a definition. Ask for a **boundary condition**.

  **Put this to the group at Minute 85:**
  > "Suppose a neuroscientist comes to us tomorrow and says, 'I have fully explained the Meta-Problem. I can predict exactly when and why any human will claim they are conscious.'
  >
  > **Does that scientist still have work to do on the Hard Problem? Yes or No, and why?**"

  *   **Correct Understanding:** "Yes. They explained the *speech*, but they haven't explained why there is *experience* accompanying the speech." (Or, "Yes, unless they are an illusionist, but the Meta-Problem itself doesn't settle that.")
  *   **Incorrect Understanding:** "No. If you explain the claim, there's nothing left to explain." (This conflates the two.)
  *   **Incorrect Understanding:** "Yes, because the scientist is wrong." (This misses the hypothetical nature of the Meta-Problem).

  This forces them to acknowledge that the Meta-Problem is a distinct explanatory target that *could* be solved while the Hard Problem remains open.
