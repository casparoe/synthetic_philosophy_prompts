      *Let's stick to the prompt's request for a "single example."* I will recommend **The "Philosophical Zombie" but explicitly defanged.** Why? Because it's the most direct way to separate the *claim* from the *fact*. If I avoid it, I lose the sharpest tool. I will tell the user *how* to introduce it to avoid the trap.
