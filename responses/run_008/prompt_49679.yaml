      *   **Goal:** A practical decision procedure usable in 20 minutes.
      *   **Requirements:**
          1.  Triage questions (Transformative vs. Ordinary) accessible to a 19-year-old (no jargon).
          2.  Advice paths for each bucket (Ordinary = info gathering; Transformative = reversibility/exit costs/values).
          3.  Explicit markers where the advisor must stop and hand agency back to the student (values vs. facts).
          4.  Honesty about where the advisor's judgment is disguised as a checklist.
          5.  Run the procedure on three cases: Accounting vs. Art, Caregiving Leave, Study Abroad.
          6.  Include at least one case where the procedure challenges the advisor's intuition (specifically the Art/Accounting bias).

  2.  **Deconstruct the Theory (L.A. Paul's *Transformative Experience*):**
      *   *Epistemic Limitation:* You can't know what it's like to be a parent/artist/immigrant until you are one.
      *   *Personal Transformation:* The experience changes your core preferences/values.
      *   *Implication:* Rational choice based on expected utility fails because you don't know the utility of the outcome *for the future you*.
      *   *Advisor's Insight:* For transformative choices, focus on *reversibility* and *cost of error* rather than *prediction of satisfaction*.

  3.  **Drafting the Procedure (The "20-Minute Triage"):**
      *   *Constraint:* 20 minutes is tight. Need to be efficient.
      *   *Phase 1: Triage (5 mins).* Distinguish "Hard Choice" from "Transformative Choice."
      *   *Phase 2: Path A (Ordinary Hard Choice).* Focus on data, requirements, career outcomes.
      *   *Phase 3: Path B (Transformative Choice).* Focus on identity, reversibility, values.
      *   *Phase 4: The Handoff.* Explicitly stating where the advisor stops.
      *   *Phase 5: Meta-Commentary.* Where am I biasing this?

      *Drafting Triage Questions:*
      *   Instead of "Is this epistemically inaccessible?", ask "If you knew exactly what day-to-day life was like, would the choice be easy?"
      *   Instead of "Will your preferences change?", ask "Do you feel like the person who makes this choice won't be the same person you are now?"
      *   Check for reversibility early.

  4.  **Developing the Advice Paths:**
      *   *Ordinary:* Research internships, talk to professors, look at salary data. (Standard advising).
      *   *Transformative:* Don't try to predict happiness. Ask: "Can you undo this?" "What's the worst case?" "Which version of yourself do you want to become?"

  5.  **Addressing the "Advisor Bias" Requirement:**
      *   The prompt explicitly asks to mark where judgment is dressed up as a checklist. I need to be transparent about where the procedure might nudge the student based on institutional norms (e.g., graduation rates, employability) vs. genuine autonomy.

  6.  **Running the Cases:**

      *   *Case 1: Accounting vs. Studio Art.*
          *   *Advisor's Bias:* "Major in Accounting, minor in Art" (Safety first).
          *   *Procedure's Test:* Is Art transformative? Yes, it changes how you see the world. Is Accounting transformative? Less so (it's a skill set).
          *   *The Conflict:* The procedure should reveal that treating Art as a "hobby" (minor) might miss the transformative point. If the student wants the *identity* of an artist, the "safe bet" advice is actually irrational under the transformative framework because it denies the transformation.
          *   *Outcome:* Challenge the advisor's instinct.

      *   *Case 2: Semester Off for Sick Parent.*
          *   *Nature:* High emotional weight, potential identity shift (caregiver vs. student).
          *   *Reversibility:* High (can usually return).
          *   *Advice:* Focus on the cost of *not* doing it (regret) vs. academic momentum.

      *   *Case 3: Study Abroad.*
          *   *Nature:* Often sold as transformative, but sometimes just a vacation.
          *   *Triage:* Is this about seeing the world (transformative) or checking a box (ordinary)?
          *   *Advice:* If transformative, focus on immersion. If ordinary, focus on credit transfer.

