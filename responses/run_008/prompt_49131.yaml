      *   *Issue 2: Determinacy.* Bayesianism assumes a "true" posterior exists. Davidson worries about indeterminacy of translation (Quine) and tries to solve it via charity. But does the computational view assume too much determinacy in the agent's "utility function"?
          *   *Verdict:* AI safety knows the "human utility function" is ill-defined. Davidson anticipates this: there is no "fact of the matter" beyond what interpretation fixes. The Bayesian might smuggle in a "true latent variable" that Davidson denies exists independently of the interpretive scheme.
      *   *Issue 3: The Social/Externalist Element.* Triangulation. Bayesian agents can be solitary learners. Davidson says meaning is essentially social.
