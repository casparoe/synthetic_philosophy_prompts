      *   *Radical Interpretation:*
          *   *Davidson:* Interpreter observes speaker's hold-true attitudes + environmental stimuli. Constructs a truth theory (Tarski-style). Constrained by Principle of Charity.
          *   *Translation:* Inverse Reinforcement Learning (IRL) or Inverse Planning. We observe state-action pairs (stimulus-utterance). We want to recover the agent's internal model (beliefs/world-model) and objective function (desires/utilities).
          *   *Principle of Charity:* Not just a heuristic. It's an identifiability constraint. If the agent is systematically wrong, we can't distinguish "wrong beliefs + standard utility" from "correct beliefs + weird utility." To make the optimization problem well-posed, we regularize towards rationality/truth.
          *   *Tarski:* The hypothesis space is compositional. Semantics are recursive.

      *   *Conceptual Scheme:*
          *   *Davidson:* No incommensurable schemes. To translate is to find common ground. Dualism of scheme/content is a myth.
          *   *Translation:* Universal Approximation / Turing Completeness. If two agents can interact causally, there exists a mapping between their latent representations. "Incommensurability" just means high computational cost or lack of data, not logical impossibility. Latent space alignment is always possible in principle.

      *   *Anomalous Monism:*
          *   *Davidson:* Mental events are physical events (monism), but mental *predicates* aren't reducible to physical laws (anomalous). No strict psychophysical laws.
          *   *Translation:* Multiple Realizability / Abstraction Layers. The substrate is physics (computational hardware), but the "belief/desire" level is a high-level abstraction (software). You can't derive the software logic *laws* directly from the transistor physics without losing the intentional stance. Supervenience without reduction.

      *   *Triangulation:*
          *   *Davidson:* Meaning requires two creatures interacting with a shared object. Solipsism fails.
          *   *Translation:* Common Cause Inference / Intersubjective Verification. To fix the reference of a latent variable (the "object"), you need multiple observers conditioning on the same causal source. Prevents "brain in a vat" degeneracy in the model.

