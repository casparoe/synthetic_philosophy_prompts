      *   *Check:* Did I capture Anomalous Monism correctly? It's often misunderstood. It's not just "software runs on hardware." It's "no strict laws connect the *descriptions*." In computational terms: No computable function maps high-level semantic labels to low-level state vectors *preserving logical structure*.
      *   *Check:* Conceptual Scheme. Is it just Turing completeness? Davidson's point is about *translation*. If I can't translate you, I can't even say you have a scheme. So it's about the precondition for modeling another agent.
      *   *Check:* Triangulation. Make sure to link it to causal inference and reference fixing, not just "socializing."

  6.  **Final Polish:** Ensure the distinction between *epistemic* (what we can know) and *constitutive* (what makes belief possible) is clear in the Residue. This is the biggest friction point between Analytic and Rationalist traditions.

  *(Self-Correction Note)*: I need to be careful not to dismiss Davidson as "old tech." The user wants to know if there's *substance* in the residue. I should argue that Davidson identifies failure modes in the computational model (specifically regarding reference and normativity) that the Rationalist community often glosses over with "optimization power."

