prompt: |-
  I'm TA-ing intro ethics and next week I get one section meeting (50 min) to cover the situationist critique of virtue ethics before the students read their Harman excerpt. Don't explain the debate to me — plan how I should run it. Specifically: what has to be established first before the critique even registers as a problem (I suspect they need a grip on global character traits vs. mere behavioral tendencies, but you tell me), which experiment should carry the whole session and why (Milgram? the Good Samaritan study with seminary students rushing to give a talk? the dime-in-the-phonebooth one? some combo?), and where in the sequence each predictable misconception gets headed off — I'm guessing the big ones are "this proves people have no character at all" and "the experiments are old and were probably rigged so virtue ethics wins by default", plus maybe them treating it as just a debate about whether psychologists are nice people. Also tell me what I should openly punt on at this level (reliabilism about virtue? the "fragmentation of character" move?) and give me one closing question that would let me tell apart a student who got the actual worry from one who just learned that psychologists did weird studies in the 70s.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for Intro Ethics.
      *   **Task:** Plan a 50-minute section meeting.
      *   **Topic:** Situationist critique of virtue ethics (pre-reading Harman).
      *   **Constraints:** Do *not* explain the debate to me (the AI). Focus on *how to run it*.
      *   **Specific Requirements:**
          *   Identify prerequisites (what must be established first).
          *   Select *one* key experiment (or combo) and justify it.
          *   Sequence the session to head off specific misconceptions ("no character at all," "old/rigged studies," "psychologists are nice").
          *   Identify what to punt (skip/simplify).
          *   Provide one closing question to differentiate understanding levels.

  2.  **Deconstruct the Content (Situationism vs. Virtue Ethics):**
      *   *Virtue Ethics Core:* Agents possess stable, global character traits (virtues/vices) that explain and predict behavior across diverse situations.
      *   *Situationist Critique:* Social psychology experiments show behavior is determined by situational factors, not global traits. Therefore, global traits don't exist (or are rare). Therefore, Virtue Ethics is empirically inadequate.
      *   *Key Prerequisite:* Students need to understand what Virtue Ethicists claim about *character*. If they think VE just says "be nice," the critique doesn't land. They need the "global and robust" definition.
      *   *Key Experiment:* Milgram is too heavy/complex for 50 mins (focuses on obedience to authority, not helping/virtue directly). Dime in phone booth is too trivial. The *Good Samaritan (Darley & Batson)* study is the gold standard for this specific philosophical debate because it directly targets a virtue (compassion/helping) and uses a relevant population (seminary students talking about the Good Samaritan).
      *   *Misconceptions:*
          *   "No character": Situationism doesn't say we're robots, just that traits aren't *global/robust*.
          *   "Old/Rigged": Need to mention replication or modern context without getting bogged down in methodology.
          *   "Psychologists are nice": Keep focus on the *implications for moral theory*, not the field of psychology.
      *   *Punts:* Fragmentation of character (too technical), Reliabilism (too meta), Nuanced VE responses (Aristotle didn't claim *everyone* is virtuous).
      *   *Closing Question:* Needs to test if they see the threat to the *theory*, not just the *facts*.

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Setup (The Target).** Before shooting, define the target.
          *   *Time:* 0-10 mins.
          *   *Goal:* Define "Global Character Trait."
          *   *Activity:* Quick poll/scenario. If someone returns a wallet once, are they "Honest"? VE says yes (if it's a stable disposition). Situationists say "Wait, let's check other situations."
          *   *Misconception Check:* Ensure they don't think VE requires *perfection*, just *consistency*.

      *   **Phase 2: The Evidence (The Weapon).**
          *   *Time:* 10-25 mins.
          *   *Selection:* The Good Samaritan Study (Darley & Batson, 1973).
          *   *Why:* It directly tests a virtue (benevolence) against a situational variable (hurry). It involves people *trained* in virtue (seminary students).
          *   *Execution:* Don't just lecture. Walk them through the prediction vs. the result.
          *   *Misconception Check:* "Old/Rigged." Acknowledge date, but emphasize the *logic* of the finding, not the specific p-value. Mention that modern replications generally support the situational effect.

      *   **Phase 3: The Implication (The Wound).**
          *   *Time:* 25-40 mins.
          *   *Goal:* Connect data to theory.
          *   *Argument:* If virtue = global trait, and global traits don't predict behavior, then virtue (as defined) doesn't exist.
          *   *Misconception Check:* "No character at all." Clarify: We have *local* traits or habits, just not the *global* ones VE relies on for moral education/evaluation.
          *   *Misconception Check:* "Psychologists are nice." Keep focus on the *normative* claim. It's not about blaming psych, it's about whether VE is built on sand.

      *   **Phase 4: Wrap & Assess.**
          *   *Time:* 40-50 mins.
          *   *Punts:* Explicitly list what we aren't solving today.
          *   *Closing Question:* The differentiator.

  4.  **Refining the Details (Self-Correction during drafting):**
      *   *Critique:* Is 10 minutes enough for the setup?
      *   *Fix:* Make the setup interactive. Ask them to define a "virtuous person." Write their definitions on the board. Highlight words like "always," "usually," "in any situation." That *is* the target.
      *   *Critique:* Milgram is famous, maybe use it?
      *   *Fix:* No, prompt asks for *one* experiment to carry the session. Good Samaritan is tighter for *virtue* specifically. Milgram is about obedience (which is a vice/virtue debate, but Good Samaritan is about *helping*, a core virtue). Stick with Good Samaritan.
      *   *Critique:* How to handle the "old study" objection without getting into weeds?
      *   *Fix:* Pre-empt it. "I know this is from the 70s. The specific numbers might shift, but the 'hurry' effect is robust in social psych."
      *   *Closing Question:* Needs to be sharp. "If the situationist is right, what happens to moral education?" vs "Did the students help?"

  5.  **Final Polish:**
      *   Ensure tone is practical for a TA (actionable steps).
      *   Check all constraints from the prompt are met.
      *   Make sure the "Punt" section is clear.
      *   Ensure the "Closing Question" has a clear rubric for evaluation.

  6.  **Final Review against Prompt:**
      *   *Prerequisites established?* Yes (Global vs. Local traits).
      *   *One experiment?* Yes (Good Samaritan).
      *   *Misconceptions headed off?* Yes (No character, Old studies, Psych focus).
      *   *Punts identified?* Yes (Fragmentation, Reliabilism, Aristotelian nuance).
      *   *Closing Question?* Yes (Focus on Moral Education/Responsibility).

  7.  (Self-Correction on "Global Character Traits"): I need to make sure I emphasize that VE relies on *explanatory power*. It's not just that traits exist, but that they *explain* behavior better than situations. I will add that to the setup.

  8.  (Final check on Closing Question): The prompt asks for a question that distinguishes students who "got the actual worry" from those who "just learned psychologists did weird studies."
      *   *Bad Question:* "What was the result of the study?" (Fact recall)
      *   *Good Question:* "If the situationist is right, can we still blame someone for being cruel?" (Too standard?)
      *   *Better Question:* "If virtues aren't global traits, what is the *point* of trying to become virtuous?" (Hits the teleological aspect).
      *   *Best Question:* "Imagine two people: one helps because they are 'honest,' the other helps because the situation prompted it. If Situationism is true, why does Virtue Ethics care which one it is?" -> Actually, let's go with the *Moral Education* angle. VE is about *becoming* good. If situationism is true, can we become good?

      *   *Refined Closing Question:* "Virtue Ethics says moral education works by cultivating stable traits. If the Situationist is right that stable traits don't exist, what specifically breaks in the Virtue Ethicist's plan for moral education?"
      *   *Why:* A surface-level student says "We can't learn." A deep student says "We can't rely on the *internal character* to carry over to new situations, so the method of habituation fails."

      *   *Wait, let's make it even sharper.* "Does the Situationist say we should stop trying to be good, or that we need to change *how* we try?" -> No, that invites the "fix the situation" response which is the *solution*, not the *critique*.
      *   *Let's stick to the explanatory power.* "If I return your wallet, the Virtue Ethicist says 'She did it because she is Honest.' The Situationist says 'She did it because the sun was shining.' Why does this distinction matter for how we judge her?"
      *   *Actually, the prompt asks for ONE closing question.* I will provide the "Moral Education/Teleology" one as it cuts deepest into VE.

      *   *Wait, re-reading prompt:* "give me one closing question that would let me tell apart a student who got the actual worry from one who just learned that psychologists did weird studies in the 70s."
      *   *Okay:* "If the Situationist is right, is the Virtue Ethicist wrong about *what we ought to do*, or wrong about *what we are*?"
      *   *Analysis:* Surface student: "Wrong about what we do." Deep student: "Wrong about what we are (metaphysics of character), which undermines the 'ought'."
      *   *Alternative:* "Does the Situationist critique show that Virtue Ethics is *too demanding*, or that it is *empirically false*?"
      *   *Analysis:* Surface: "Too demanding." Deep: "Empirically false." This is good. It tests if they understand it's an *empirical* critique, not a *normative* one. I'll use this.

  9.  **Finalizing the Plan Structure:**
      *   **0-10:** The Target (Global Traits).
      *   **10-25:** The Evidence (Good Samaritan).
      *   **25-40:** The Implication (Empirical Adequacy).
      *   **40-50:** Punt & Close.

      *   *Wait, one more check:* "which experiment should carry the whole session and why". I need to explicitly justify Good Samaritan over Milgram in the text.
      *   *Justification:* Milgram is about obedience (authority), Good Samaritan is about benevolence (virtue). VE cares more about benevolence as a virtue. Also, the "seminary student" irony is pedagogical gold.

      *   *Misconception "No character at all":* Address in Phase 3.
      *   *Misconception "Old/Rigged":* Address in Phase 2.
      *   *Misconception "Psychologists are nice":* Address in Phase 3 (keep it philosophical).

      *   *Punts:* Fragmentation, Reliabilism, Aristotelian "Phronimos" exception.

      *   *Ready to write.*
answer: |-
  Here is a 50-minute lesson plan designed to land the Situationist critique without getting bogged down in empirical weeds or defensive virtue-ethics counter-arguments.

  ### **Phase 1: The Target (0–10 mins)**
  **Goal:** Establish the definition of a "Global Character Trait."
  **Why:** If students think Virtue Ethics (VE) just means "being a good person," the critique won't land. They need to see that VE makes a specific *psychological claim* about consistency.

  *   **The Board Work:** Write two columns: **"Global Trait"** vs. **"Local Habit."**
  *   **The Activity:** Ask the class: *"If I return a lost wallet, what does a Virtue Ethicist say explains my action?"*
      *   Guide them to the answer: "Honesty."
      *   Push further: *"Does 'Honesty' just mean I returned this wallet? Or does it mean I would return it in the rain, when I'm late, when no one is watching, and when I'm hungry?"*
  *   **The Definition:** Establish that for VE to work as a moral theory, virtues must be **robust** (predict behavior across time) and **global** (predict behavior across different types of situations).
  *   **Head Off Misconception:** Explicitly state: *"Virtue Ethics does not claim everyone IS virtuous. It claims that IF you are virtuous, your behavior is explained by this internal, stable trait, not by external circumstances."*

  ### **Phase 2: The Evidence (10–25 mins)**
  **Goal:** Present the data that threatens the "Global Trait" definition.
  **Selection:** **The Good Samaritan Study (Darley & Batson, 1973).**
  **Why this one?**
  1.  **Milgram** is about obedience to authority, which is messy to map onto "virtue."
  2.  **The Dime Study** is too trivial; students will dismiss it as "finding a dime isn't a moral act."
  3.  **Good Samaritan** tests *benevolence* (a core virtue) on *seminary students* (people training to be virtuous) who are literally on their way to give a talk *about* the Good Samaritan. The irony makes the situational variable stick.

  *   **The Setup:** Tell the story briefly. Seminary students told to walk to another building.
      *   *Variable 1:* Some are told "You're late, hurry." Others are told "You have time."
      *   *Variable 2:* Some encounter a slumped, coughing man in an alley.
  *   **The Prediction:** Ask the class: *"Who helps? The ones thinking about the Good Samaritan, or the ones in a hurry?"* (Most will guess the content of the talk matters).
  *   **The Result:** Reveal the data. The content of the talk didn't matter significantly. **Hurry** was the overwhelming predictor. 63% of low-hurry stopped; 10% of high-hurry stopped.
  *   **Head Off Misconception ("Old/Rigged"):** Pre-empt this immediately. Say: *"I know this is from the 70s. You might think, 'Surely we've changed,' or 'The methodology was shaky.' The specific percentages might shift, but the 'Hurry Effect' is one of the most replicated findings in social psych. The philosophical point isn't the p-value; it's that a trivial situational factor (time pressure) swamped a major character factor (religious training/moral focus)."*

  ### **Phase 3: The Implication (25–40 mins)**
  **Goal:** Connect the data to the failure of Virtue Ethics.
  **Why:** Students often walk away thinking, "Psychology is cool," without seeing why Ethics should care.

  *   **The Argument:**
      1.  VE says moral behavior is explained by Global Traits.
      2.  Situationism says behavior is explained by Situational Factors.
      3.  If (2) is true, Global Traits (as defined in Phase 1) are empirically rare or non-existent.
      4.  Therefore, VE is built on a false psychology.
  *   **Head Off Misconception ("No Character At All"):** Students will panic and say, *"So we're all robots? No one has any character?"*
      *   **Correction:** Clarify that Situationists admit we have *local* traits (e.g., "honest-with-friends" or "brave-when-rested"). The critique is that we lack the **cross-situational consistency** VE requires to call someone "The Honest Person."
  *   **Head Off Misconception ("Psychologists are Nice"):** Students might treat this as "Psychologists say people are bad, Ethicists say people are good."
      *   **Correction:** Reframe it. *"This isn't about whether people are nice. It's about **explanatory power**. If I want to predict if you will help me tomorrow, should I ask about your character, or should I ask if you're going to be in a hurry? Situationism says bet on the hurry."*

  ### **Phase 4: Punt & Close (40–50 mins)**
  **Goal:** Manage scope and assess understanding.

  **What to Punt (Explicitly tell them this):**
  1.  **The "Fragmentation" Move:** Don't get into whether virtues are fragmented modules. That's cognitive science territory.
  2.  **Aristotelian Nuance:** Don't let them argue "Aristotle knew only the *Phronimos* (wise person) has true virtue." Acknowledge it, but say: *"If only 1% of people have virtues, is VE still a useful theory for the rest of us? We'll discuss that next week."*
  3.  **Reliabilism:** Skip the debate on whether virtues need to be reliable *always* or just *often*. Stick to the "global vs. situational" dichotomy for now.

  **The Closing Question:**
  Write this on the board for them to answer on a slip of paper (or discuss in pairs):

  > **"If the Situationist is right, is the Virtue Ethicist wrong about *what we ought to do*, or wrong about *what we are*?"**

  **How to grade the answers:**
  *   **Surface Understanding (The "Weird Study" Student):** They will answer *"Wrong about what we ought to do"* or *"Wrong about how to teach ethics."* They think the critique is normative (i.e., "Situationists say we shouldn't try to be good").
  *   **Deep Understanding (The "Actual Worry" Student):** They will answer *"Wrong about what we are."* They recognize that Situationism is an **empirical/metaphysical critique**, not a normative one. The worry is that VE prescribes a psychology (stable traits) that humans do not possess. If the *ontology* of the virtuous agent is false, the *normative* theory collapses.

  ### **TA Cheat Sheet for Q&A**
  *   **If they ask:** "So should we just engineer situations instead of teaching virtue?"
      *   **Say:** "That's the Situationist *solution*, not the critique. For next week, just focus on why the *critique* hurts Virtue Ethics."
  *   **If they ask:** "But I know honest people!"
      *   **Say:** "You know people who act honestly *in the situations you see them in*. The critique is that you haven't seen them in *all* situations. VE claims they would be honest even if the situation changed drastically. The data says they wouldn't."
  *   **If they ask:** "Is this deterministic?"
      *   **Say:** "It threatens free will, but for this class, focus on how it threatens **moral responsibility**. If my action is caused by 'hurry' rather than 'character,' can you praise or blame me?"
