      *   *Check:* Bridge case. Physics is better, but extrapolation beyond test range is classic engineering no-no.

  9.  **Final Polish:** Ensure the distinction between "Statistical Uncertainty" (confidence intervals) and "Model Uncertainty" (validity of extrapolation) is clear. (This is the core of the user's struggle).

