answer: |-
  Here are the desiderata for a theory of the distribution of consciousness across animals, followed by an analysis of their constraints and a brief scorecard of leading theories.

  ### Desiderata for a Theory of Animal Consciousness

  #### I. Phenomenal Explanatory Power
  An adequate theory must explain specific behavioral and physiological profiles without resorting to "as-if" functionalism alone.

  1.  **Pain vs. Nociception:** The theory must distinguish between reflexive withdrawal (nociception) and negative subjective experience (pain).
      *   *Motivation:* Nociception exists in plants and simple robots; pain implies a welfare interest. If a theory cannot distinguish a spinal reflex from suffering, it cannot guide ethical treatment.
  2.  **Anesthesia and Sleep:** The theory must account for reversible loss of consciousness (anesthesia) and natural cycles of unresponsiveness (sleep) distinct from death or coma.
      *   *Motivation:* These are the only times we confidently assume consciousness turns "off" in humans. A theory that cannot explain why propofol silences consciousness in a crab but not a reflex is biologically inert.
  3.  **Motivational Trade-offs:** The theory must explain behavior where an animal sacrifices one drive (e.g., hunger) to satisfy another (e.g., pain avoidance) in a context-dependent manner.
      *   *Motivation:* Simple reflexes do not weigh competing costs. Trade-offs suggest a central integrator evaluating value, a hallmark of conscious decision-making.
  4.  **Learned Avoidance and Self-Medication:** The theory must account for long-term behavioral modification based on past negative experiences or the proactive use of substances to alter internal states.
      *   *Motivation:* This implies memory, anticipation, and a representation of one's own physiological state, moving beyond immediate stimulus-response.

  #### II. Conceptual Distinctions
  The theory must maintain logical boundaries to prevent category errors.

  5.  **Kind vs. Degree:** The theory must specify whether differences between species are qualitative (kind) or quantitative (degree).
      *   *Motivation:* Collapsing this leads to false negatives (assuming insects feel *nothing* because they don't feel *like us*) or false positives (anthropomorphizing simple reflexes).
  6.  **Absence of Evidence vs. Evidence of Absence:** The theory must provide a standard for when a lack of behavioral markers indicates a lack of consciousness, rather than just a lack of detection.
      *   *Motivation:* Invertebrates often lack the motor output to express human-like pain responses. Confusing silence with absence leads to ethical negligence.
  7.  **Consciousness vs. Moral Mattering:** The theory must not conflate the *presence* of consciousness with the *weight* of moral status.
      *   *Motivation:* Even if a fly is conscious, its moral weight may differ from a chimp's. Conflating the two stalls scientific inquiry with ethical anxiety.

  #### III. Biological and Evolutionary Constraints
  The theory must respect the hardware realities of neurobiology.

  8.  **Vertebrate Homology:** The theory must acknowledge that consciousness in mammals, birds, and fish likely relies on homologous structures (e.g., thalamocortical or pallial systems).
      *   *Motivation:* We have strong reason to believe a mouse and a trout share an evolutionary lineage of awareness. A theory that severs this link contradicts phylogeny.
  9.  **Convergent Evolution:** The theory must allow for consciousness to arise in cephalopods and arthropods via different neural substrates (e.g., mushroom bodies, ganglia).
      *   *Motivation:* Octopuses and humans split 600 million years ago. If both are conscious, it evolved independently.
  10. **No Mammalian Analogy Trap:** The evidential standard cannot require neural structures unique to mammals (e.g., a six-layered cortex).
      *   *Motivation:* Demanding a cortex for consciousness is like demanding feathers for flight. It misfires precisely where the dispute is sharpest (invertebrates).

  ---

  ### Classification: Non-Negotiable vs. Camp Prejudices

  Not all requirements are created equal. Some are logical necessities; others are stealth arguments for specific philosophical camps.

  **Non-Negotiable (Foundational Constraints)**
  *   **Absence of Evidence vs. Evidence of Absence:** This is an epistemic necessity. Any theory that treats a lack of report as proof of unconsciousness is logically unsound.
  *   **Convergent Evolution:** This is a biological fact. Any theory requiring mammalian-specific hardware is empirically falsified by the existence of complex invertebrate behavior.
  *   **Pain vs. Nociception:** This is the ethical core. If a theory cannot make this cut, it is useless for policy.

  **Camp Prejudices (Contentious Commitments)**
  *   **Motivational Trade-offs as Proof:** *Behaviorist/Functionalist Prejudice.* Some camps argue trade-offs can be solved by unconscious algorithms. Demanding this as *proof* of consciousness biases toward functionalism.
  *   **Vertebrate Homology:** *Biological Naturalist Prejudice.* While homology is fact, insisting that consciousness *must* track homology biases against convergent evolution. It assumes consciousness is a conserved trait rather than a solution to an ecological problem.
  *   **Consciousness vs. Moral Mattering:** *Ethical Prejudice.* While logically distinct, many advocates insist that proving consciousness *automatically* grants full moral rights. A scientific theory should resist this conflation, but ethical camps often demand it.

  ---

  ### Consistency Check: The Measurement Problem

  You suspected that demanding theory-neutral evidence standards and demanding that the theory adjudicate between rival accounts of what consciousness is cannot both be met. **You are correct.** This is the **Indicator Problem**, and it renders a subset of these desiderata jointly unsatisfiable.

  To generate evidence standards (e.g., "look for trade-off behavior"), you must already assume a theory of what consciousness *does* (e.g., "it integrates competing drives"). However, to adjudicate between rival theories (e.g., GWT vs. IIT), you need theory-neutral data.
  *   **The Conflict:** You cannot have a "theory-neutral" marker of consciousness. Every marker (report, integration, attention) is theory-laden.
  *   **The Resolution:** You must abandon the demand for **Theory-Neutral Evidence**. Instead, the desiderata should demand **Theory-Explicit Indicators**. A theory must state clearly: "If Theory X is true, we expect to see Y in animals." We then test for Y. We cannot ask for evidence that stands outside all theory.

  ---

  ### Scorecard: Leading Theories Against Desiderata

  **Global Workspace Theory (GWT)**
  *   **Pros:** Handles **Trade-offs** well (broadcasting information for global access). Explains **Anesthesia** (disruption of broadcast).
  *   **Cons:** Struggles with **Convergent Evolution**. GWT is often tied to specific mammalian cortical architectures. It risks the **Mammalian Analogy Trap** when applied to insects or octopuses lacking a clear "workspace" architecture.
  *   **Verdict:** Strong on phenomena, weak on biology outside vertebrates.

  **Higher-Order Theories (HOT)**
  *   **Pros:** Clearly distinguishes **Pain vs. Nociception** (first-order state vs. awareness of state). Maintains **Kind vs. Degree** distinctions sharply.
  *   **Cons:** High risk of **False Negatives**. Requires meta-representation, which is difficult to detect in non-linguistic animals. Often collapses **Absence of Evidence** into **Evidence of Absence** for invertebrates.
  *   **Verdict:** Conceptually clean, but biologically restrictive. Likely excludes too many animals.

  **Integrated Information Theory (IIT)**
  *   **Pros:** Excellent on **Convergent Evolution**. Substrate-independent; focuses on causal structure (Phi), not specific anatomy. Respects **Vertebrate Homology** while allowing invertebrate consciousness.
  *   **Cons:** Struggles with **Pain vs. Nociception** (high Phi might exist in simple networks). Risks **Panpsychism** (attributing consciousness to thermostats), blurring **Consciousness vs. Moral Mattering**.
  *   **Verdict:** Best on biological constraints, but risks over-attribution and lacks clear behavioral markers for **Trade-offs**.
