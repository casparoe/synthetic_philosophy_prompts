      *   Legacy Table 1 & 2:
          *   Bag A: 50% Green. (Need 4 Green, 4 Red).
          *   Bag B: 0% Green. (Need 0 Green, 2 Red).
      *   Cloud Table 3 & 4:
          *   Bag A: 100% Green. (Need 2 Green, 0 Red).
          *   Bag B: 87.5% Green. (Need 7 Green, 1 Red).
      *   *Wait, I can't pre-pack the bags based on how many people pick.*
      *   *Solution:* The bags must be large enough, or I use a "Deck" where they draw and replace?
      *   *Draw and Replace* is statistically cleaner but feels less "final".
      *   *Pre-packed Envelopes:* Each student gets an envelope.
      *   This is better. I prepare 20 Envelopes.
      *   10 Legacy Envelopes. 10 Cloud Envelopes.
      *   Inside Legacy: 8 "Method A" cards, 2 "Method B" cards. (Forces the split).
      *   Inside Cloud: 2 "Method A" cards, 8 "Method B" cards. (Forces the split).
      *   *Wait, if I force the split via the envelope, is it a choice?*
      *   *Prompt:* "making a choice each round between two options".
      *   *Okay, I will hide the split.*
      *   "Pick a Method Card from the deck."
      *   The Deck is rigged. 80% A, 20% B on Legacy tables.
      *   Then they draw a "Result Card" from the Bag corresponding to their Method.
      *   This guarantees the N counts for the math to work.
      *   Is this honest? Yes, it simulates "Real world constraints often dictate choice distribution."
      *   I will frame it as "Resource Availability."
      *   "On Legacy, Method A licenses are plentiful. Method B licenses are scarce."
      *   "On Cloud, Method B licenses are plentiful. Method A licenses are scarce."
      *   This satisfies "confounding baked into rules" and "students generate numbers" (they draw the cards).

      *   *Final Plan:*
      *   1. Entry: Sit at tables (Legacy vs Cloud).
      *   2. Phase 1: Draw "License Card" (Determines Method A or B). Rigged deck per table type.
      *   3. Phase 2: Draw "Outcome Card" from Bag corresponding to Method. Rigged bags per table type.
      *   4. Tally.
      *   5. Analyst.
      *   6. Reveal.

      *   *Wait, one nuance:* If I rig the License Card, they didn't *choose*.
      *   *Prompt:* "making a choice each round between two options".
      *   *Okay, I must let them choose.*
      *   *Risk:* If they choose 50/50, the paradox might not show.
      *   *Mitigation:* I will provide the "Expected Success Rates" on the table *incorrectly* or *incompletely* to nudge them? No, that's dishonest.
      *   *Better:* I will accept the risk and provide a "Facilitator Note" on how to nudge if the split is even. "Hey, are you sure you want to use Beta on Legacy? That's usually unstable."
      *   *Actually, the best way:* "The Budget."
      *   Give them $1000 budget.
      *   Legacy Table: Method A costs $100. Method B costs $500. (Most pick A).
      *   Cloud Table: Method A costs $500. Method B costs $100. (Most pick B).
      *   This makes it a *choice* driven by rules. Perfect.
      *   I will prepare the math assuming they follow the money. I will add a note: "If they rebel, adjust the tally explanation."
      *   *Wait, I need the math to hold.*
      *   I'll design the bags to be robust.
      *   If Legacy (10 people) splits 5/5.
      *   A (50%): 2.5 success. B (0%): 0 success.
      *   If Cloud (10 people) splits 5/5.
      *   A (100%): 5 success. B (87.5%): 4.375 success.
      *   Total A: 7.5 / 10 = 75%.
      *   Total B: 4.375 / 10 = 43%.
      *   Paradox *disappears*. A wins overall.
      *   *Conclusion:* I **must** ensure the split. The Budget trick is the most ethical way to force the correlation without removing agency. I will emphasize this in the instructions.

      *   *Wait, one more check:*
      *   If Legacy 5/5 and Cloud 5/5.
      *   A is better in both. A is better overall. No paradox.
      *   Simpson's requires the *weights* to flip.
      *   The "Easy" group (Cloud) must mostly use the "Inferior" method (B).
      *   The "Hard" group (Legacy) must mostly use the "Superior" method (A).
      *   So Cloud Budget: B is cheap. Legacy Budget: A is cheap.
      *   This ensures the weights flip.
      *   Okay, ready to write.
