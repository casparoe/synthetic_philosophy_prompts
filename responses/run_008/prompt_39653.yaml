  # Activity Design: "The Deployment Protocol"

  **Goal:** Experience Simpson's Paradox through data generation where the confounding variable (System Type) dictates both the success rate and the likelihood of choosing a specific method (via cost constraints).
  **Time:** 90 Minutes.
  **Group:** 18–22 Students (Designed for 20).
  **Materials:** Whiteboards, markers, printed "Budget Cards", printed "Outcome Decks", tally sheets. No projector for the first hour.

  ---

  ## 1. The Setup (10 Minutes)

  **Room Arrangement:**
  *   4 Round Tables (5 students each).
  *   **Tables 1 & 2:** Labeled **"Legacy System"**.
  *   **Tables 3 & 4:** Labeled **"Cloud Native"**.
  *   **Center:** A large whiteboard for the final tally.

  **The Narrative:**
  Tell the group: *"You are DevOps engineers. Your goal is to successfully deploy a patch. You have two deployment methods: **Method Alpha** (Conservative) and **Method Beta** (Aggressive). A deployment is either 'Clean' (Success) or 'Rolled Back' (Failure)."*

  **The Constraint (The Confounder Engine):**
  Hand each student a **Budget Card** face down. They flip it only when seated.
  *   **Legacy Tables:** "Method Alpha Cost: $100. Method Beta Cost: $900. Budget: $1,000."
      *   *Logic:* Most will choose Alpha because Beta is prohibitively expensive.
  *   **Cloud Tables:** "Method Alpha Cost: $900. Method Beta Cost: $100. Budget: $1,000."
      *   *Logic:* Most will choose Beta because Alpha is prohibitively expensive.

  *Facilitator Note:* This bakes the confounding into the rules. The "System Type" influences the "Method Choice" via cost, and independently influences the "Success Rate" via the Outcome Decks.

  ---

  ## 2. The Game (20 Minutes)

  **Step 1: Choose Method.**
  Students announce their choice based on their budget. (Expect ~80% Alpha on Legacy, ~80% Beta on Cloud).
  *   *If a student rebels (e.g., picks Beta on Legacy despite cost):* Allow it. It adds noise, but the math below has a small buffer. Gently ask, *"Are you sure? That's over budget."* but don't forbid it.

  **Step 2: Draw Outcome.**
  Each table has two decks of cards face down: **Deck Alpha** and **Deck Beta**.
  *   **Legacy Tables:**
      *   **Deck Alpha:** 5 Green (Clean), 5 Red (Rolled Back). **(50% Success)**
      *   **Deck Beta:** 1 Green, 9 Red. **(10% Success)**
      *   *Instruction:* "Draw one card from your chosen deck. Record the result. Return card to deck." (Sampling with replacement keeps probabilities stable).
  *   **Cloud Tables:**
      *   **Deck Alpha:** 10 Green, 0 Red. **(100% Success)**
      *   **Deck Beta:** 8 Green, 2 Red. **(80% Success)**
      *   *Instruction:* Same as above.

  **Step 3: Local Tally.**
  Each table fills out a small slip:
  *   Table ID: \_\_\_
  *   System Type: \_\_\_
  *   Alpha Attempts: \_\_\_ | Alpha Successes: \_\_\_
  *   Beta Attempts: \_\_\_ | Beta Successes: \_\_\_

  ---

  ## 3. The Analyst (15 Minutes)

  **The Role:**
  Pick one student to be the "CTO". Send them out of the room (or have them turn their back and put on noise-canceling headphones).

  **The Task:**
  The rest of the class aggregates the data onto the **Center Whiteboard**, but **hides the System Type**.
  *   **Column 1:** Method Alpha (Total Attempts, Total Successes, % Success)
  *   **Column 2:** Method Beta (Total Attempts, Total Successes, % Success)

  **The Expected Aggregate Numbers (based on 20 students, 80/20 split):**
  *   **Alpha Total:** 10 Attempts (8 Legacy + 2 Cloud). Successes: 4 (from Legacy) + 2 (from Cloud) = 6. **Rate: 60%.**
  *   **Beta Total:** 10 Attempts (2 Legacy + 8 Cloud). Successes: 0 (from Legacy) + 6 (from Cloud) = 6. **Rate: 60%.**
      *   *Wait, a tie is boring.* Let's tweak the Cloud Beta deck to **9 Green, 1 Red (90%)**.
      *   **Revised Beta Total:** 0 (Legacy) + 7 (Cloud) = 7 Successes. **Rate: 70%.**

  **The Call:**
  The CTO returns. They see:
  *   **Method Alpha:** 60% Success Rate.
  *   **Method Beta:** 70% Success Rate.
  *   **Stakes:** "Based on this data, which method should the company standardize on for next quarter? If you choose wrong, your team (the class) has to tidy the room."
  *   *Prediction:* The CTO will confidently choose **Method Beta**. It is arithmetically superior in the aggregate.

  ---

  ## 4. The Reveal (15 Minutes)

  **The Twist:**
  Ask the tables to reveal their **System Type** slips. Add two rows to the whiteboard: "Legacy Only" and "Cloud Only".

  **The Subgroup Numbers:**
  *   **Legacy System:**
      *   Alpha: 50% Success (4/8)
      *   Beta: 0% Success (0/2)
      *   *Winner:* **Alpha**
  *   **Cloud System:**
      *   Alpha: 100% Success (2/2)
      *   Beta: 87.5% Success (7/8)
      *   *Winner:* **Alpha**

  **The Collision:**
  *   **Aggregate:** Beta is better (70% vs 60%).
  *   **Subgroups:** Alpha is better in *both* environments (50% > 0% AND 100% > 87.5%).
  *   **Result:** The CTO's confident decision was statistically valid but causally wrong. The room tidying forfeit stands (or is waived as a joke, but the tension should be real).

  ---

  ## 5. The Debrief (30 Minutes)

  **Map the Activity to Formal Stats:**
  1.  **Treatment:** Method Alpha vs. Beta.
  2.  **Outcome:** Clean Deployment.
  3.  **Confounder:** System Type (Legacy vs. Cloud).
  4.  **The Mechanism:** System Type affected *both* the choice of Treatment (via Budget rules) and the Outcome (via Deck probabilities). This is the definition of confounding.

  **The "Which is Real?" Question:**
  This is the critical discussion.
  *   **Question:** "Should we use Alpha or Beta?"
  *   **Answer:** "It depends on the question."
      *   **Efficacy Question:** "If I *force* a method, which works better?" $\rightarrow$ Look at **Subgroups**. Alpha is causally superior.
      *   **Observational Question:** "If I let engineers choose based on budget, what will happen?" $\rightarrow$ Look at **Aggregate**. Beta *appears* better because it's mostly used on the easier Cloud systems.
  *   **Takeaway:** Aggregates answer "What is happening?" Subgroups (properly adjusted) answer "What would happen if we intervened?"

  **Limitations of the Activity (Honest Note):**
  *   **Known Confounders:** In this game, you *knew* to split by Table/System. In real data, the confounder (e.g., "User Motivation", "Server Load") is often unobserved. If there was a *third* hidden variable (e.g., "Engineer Experience") distributed unevenly *within* the tables, the subgroup analysis could still be biased.
  *   **Sample Size:** With N=20, random variance is high. If the Cloud Beta deck had given 2 Reds instead of 1, the paradox might have vanished. Real Simpson's Paradox requires robust sample sizes to be trustworthy.
  *   **Causal Graph:** The activity gives you the numbers, but not the graph. You only knew "System Type" was the confounder because I told you the rules. In the wild, deciding *which* variable to condition on is a causal inference problem, not a statistical one.

  ---

  ## 6. Risk Management & Failure Modes

  **1. The "50/50 Split" Failure:**
  *   **Risk:** If Legacy tables split 5 Alpha / 5 Beta (ignoring budget), the weights don't flip hard enough.
      *   *Math:* Legacy (5A@50%, 5B@10%) + Cloud (5A@100%, 5B@90%).
      *   *Agg A:* 75%. Agg B: 50%. Paradox vanishes. Alpha wins overall.
  *   **Mitigation:** As facilitator, circulate during the Budget phase. If a Legacy student reaches for Beta, say: *"Just a heads up, that's 90% of your budget. You won't have tokens for the post-game snack."* (Use social pressure/incentives to ensure the 80/20 split).
  *   **Backup:** If the split fails and the paradox doesn't appear, own it. *"This is why we need power analysis. We didn't have enough weight in the confounder to flip the marginal. Let's recalculate what split we needed."* (Turns a failure into a lesson on sample size).

  **2. The "Spoiler":**
  *   **Risk:** Someone shouts "It's Simpson's Paradox!" during the Analyst phase.
  *   **Mitigation:** Preface the session: *"We are doing a blind simulation. If you recognize the pattern, sit on your hands. Let the CTO make the mistake. The learning is in the mistake."*

  **3. Tally Errors:**
  *   **Risk:** Students miscount Greens/Reds.
  *   **Mitigation:** Use physical tokens (poker chips) instead of paper tally marks. Green Chip = Success, Red Chip = Fail. Dump them into clear bowls at the front. Visual aggregation reduces arithmetic errors.

  **4. No-Shows (18 instead of 20):**
  *   **Robustness:** The math holds with 18 people if the ratio is maintained.
      *   Legacy (9 people): 7 Alpha, 2 Beta.
      *   Cloud (9 people): 2 Alpha, 7 Beta.
      *   The percentages shift slightly, but the direction of the reversal remains.
      *   *Prep:* Have 2 "Ghost Player" envelopes ready. If people are missing, you (the facilitator) draw for the empty seats to keep the N=20 math exact.

  ---

  ## 7. Materials Checklist

  1.  **Table Signs:** 2x "Legacy System", 2x "Cloud Native".
  2.  **Budget Cards:** 20 cards.
      *   10 cards: "Legacy Budget: A=$100, B=$900".
      *   10 cards: "Cloud Budget: A=$900, B=$100".
  3.  **Outcome Decks:**
      *   **Legacy Alpha:** 5 Green, 5 Red cards.
      *   **Legacy Beta:** 1 Green, 9 Red cards.
      *   **Cloud Alpha:** 10 Green cards.
      *   **Cloud Beta:** 9 Green, 1 Red cards.
  4.  **Tally Tokens:** 2 bowls of Green/Red poker chips (or just use the cards themselves).
  5.  **Whiteboard Markers:** Multiple colors to distinguish Aggregate vs. Subgroup data.

  ## 8. Worked Numbers for Sanity Check

  **Scenario:** 20 Students. 80% comply with budget nudges.

  | System | Method | Users | Success Rate | Successes |
  | :--- | :--- | :--- | :--- | :--- |
  | **Legacy** | Alpha | 8 | 50% | 4 |
  | **Legacy** | Beta | 2 | 10% | 0 |
  | **Cloud** | Alpha | 2 | 100% | 2 |
  | **Cloud** | Beta | 8 | 90% | 7 |

  **Subgroup View:**
  *   Legacy: Alpha (50%) > Beta (0%)
  *   Cloud: Alpha (100%) > Beta (90%)
  *   **Conclusion:** Alpha is superior.

  **Aggregate View:**
  *   **Total Alpha:** 10 Users, 6 Successes $\rightarrow$ **60%**
  *   **Total Beta:** 10 Users, 7 Successes $\rightarrow$ **70%**
  *   **Conclusion:** Beta is superior.

  **Reversal Confirmed.**
