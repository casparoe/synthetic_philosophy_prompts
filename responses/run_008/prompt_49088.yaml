          2.  **Monotonicity:** In labor disputes, if the "pie" grows (company does better), labor should not be penalized. NBS violates this.
          3.  **Anchoring:** Wage negotiations are heavily focused on "maximum affordable wage" vs. "minimum acceptable profit." These map perfectly to the KSS ideal points.
