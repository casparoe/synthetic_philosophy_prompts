          *   *Does KSS have a better fairness story?* For laypeople, yes. "Equal sacrifice" is a powerful heuristic. NBS's "maximize product" is abstract. However, NBS's fairness comes from invariance to utility scaling (cardinal unit comparability). KSS requires comparing the "units" of utility across people to define the ideal point ratio, which is technically problematic unless utilities are normalized (which KSS does by fixing $d=0, u=1$).
