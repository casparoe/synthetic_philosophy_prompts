  3.  **Analyze Question 2: Equal Relative Concessions & Fairness**

      *   *Characterization:* Is KSS exactly "equal relative concessions"?
      *   *Math:* Let $d$ be disagreement, $u$ be ideal (utopia). Solution $x$.
      *   Concession for 1: $(u_1 - x_1) / (u_1 - d_1)$.
      *   Concession for 2: $(u_2 - x_2) / (u_2 - d_2)$.
      *   KSS lies on the line segment connecting $d$ and $u$. So $(x_1 - d_1)/(u_1 - d_1) = (x_2 - d_2)/(u_2 - d_2) = \lambda$.
