answer: |-
  This is a classic jurisprudential showdown. Your brother-in-law is channeling Lord Patrick Devlin's *The Enforcement of Morals* (1965), while you are implicitly standing with H.L.A. Hart's *Law, Liberty, and Morality* (1963).

  Devlin's argument is intuitive but relies heavily on metaphors to bridge the gap between "morality is important" and "the state must police private bedrooms." Your instinct that the Church analogy is doing too much heavy lifting is correct.

  Here is the audit of the analogy, the logical gaps, and a verdict on whether the argument survives.

  ### 1. The Correspondence Table
  Devlin's argument rests on the idea that society is an "invisible community of ideas." Here is how the mapping works in his framework:

  | **The Church Analogy** | **Devlin's Political Society** | **Function in Argument** |
  | :--- | :--- | :--- |
  | **The Congregation** | **The Citizenry / Society** | The entity that must remain intact to exist. |
  | **The Creed / Dogma** | **The Shared Moral Code** | The binding agent that creates the community. |
  | **Heresy / Apostasy** | **Immorality (e.g., Adultery)** | A deviation that threatens the integrity of the code. |
  | **Excommunication / Inquisition** | **Criminal Law / Punishment** | The mechanism used to purge the threat. |
  | **Schism / Loss of Salvation** | **Social Disintegration / Anarchy** | The catastrophic outcome if deviation is tolerated. |
  | **The Priesthood** | **The Judge / Legislature** | The authority tasked with defining and defending the creed. |
  | **Treason** | **Private Vice** | Both are framed as existential threats to the structure. |

  ### 2. Where the Mapping Breaks (The Disanalogies)
  You already spotted the big ones, but let's formalize why they matter legally and philosophically.

  **A. Voluntariness (Exit Rights)**
  *   **Church:** Membership is (ideally) voluntary. If you reject the creed, you can leave without destroying the church or being destroyed yourself.
  *   **Society:** Membership is involuntary. You cannot "exit" society without dying or becoming a hermit.
  *   **The Break:** Because you can't leave, punishing you for "heresy" isn't protecting a voluntary association; it is trapping people in a moral system they may no longer accept. A church *needs* orthodoxy to define itself; a state *needs* order to function. Orthodoxy $\neq$ Order.

  **B. Public Profession vs. Private Act**
  *   **Church:** Heresy is usually a *professed* belief. It is public teaching that contradicts the creed.
  *   **Society:** The "vice" Devlin wants to punish (adultery, homosexuality) is often private conduct.
  *   **The Break:** A private sinner does not publicly renounce the social contract. I can follow all laws, pay taxes, and be a good neighbor while committing adultery. A heretic explicitly says, "Your creed is false." The private sinner says nothing. Punishing silence/privacy is a much heavier lift than punishing public subversion.

  **C. Static vs. Dynamic Survival**
  *   **Church:** Many churches view their creed as eternal and immutable. Change is often seen as decay.
  *   **Society:** Societies are organic. They survive *by* changing their moral codes.
  *   **The Break:** As you noted, the U.S. survived the moral shift on slavery, segregation, and women's suffrage. In fact, *refusing* to change those moral codes would have destroyed the society (see: the Civil War). If Devlin's analogy held, the abolitionists were "heretics" threatening social disintegration. History shows they were the ones saving the society.

  **D. The Nature of the Threat (Treason vs. Vice)**
  *   **Church:** Heresy threatens the *spiritual* validity of the group.
  *   **Society:** Treason threatens the *physical* security of the state (giving secrets to enemies).
  *   **The Break:** Devlin equates private vice with treason. But treason has a direct causal link to state collapse (enemy invasion). Private adultery has no direct causal link to economic or political collapse. The link is purely metaphysical ("it rots the fabric").

  ### 3. The Scope Jump: "Some" vs. "This"
  This is the logical kill-shot you identified.

  *   **Premise:** Society requires *some* shared morality to function (e.g., don't kill, don't steal, keep promises). Hart agrees with this. This is the "minimum content of natural law."
  *   **Devlin's Jump:** Therefore, society requires *this specific* shared morality (e.g., Victorian sexual norms, specific religious views on marriage).
  *   **The Flaw:** This is like saying, "A car needs an engine to run; therefore, it needs *this specific* V8 engine." If you swap the V8 for a V6 or an electric motor, the car still runs.
  *   **Application:** Society needs a morality of *reciprocity and safety*. It does not logically follow that it needs a morality of *sexual fidelity* to prevent anarchy. The shift from one moral framework to another (e.g., "adultery is a sin" to "adultery is a private matter") is an engine swap, not removing the engine.

  ### 4. Verdict: Does the Argument Survive?
  **No.** The analogy is doing almost all the work, and once the disanalogies are exposed, the conclusion collapses.

  If your brother-in-law argues that "adultery laws are necessary to prevent social collapse," he has to provide empirical evidence that societies without adultery laws collapse. They don't. Most Western nations repealed them decades ago without descending into anarchy.

  Devlin's argument ultimately rests on a **psychological fact** (people *feel* disgust at certain acts) being treated as a **sociological necessity** (society *will* end if we allow those acts). Hart successfully argued that feelings of intolerance are not evidence of impending disintegration.

  ### 5. A Better Analogy for the Job
  If the goal is to explain how society holds together *without* enforcing private morality, the **Traffic System Analogy** (often used by legal positivists) is superior.

  **The Traffic Analogy:**
  *   **Society = The Road Network.**
  *   **Law = Traffic Rules.**
  *   **Shared Morality = The Agreement to Drive on the Right (or Left).**

  **How it works:**
  1.  **Coordination is Key:** We need a shared rule (drive on the right) to avoid crashes. This corresponds to the "minimum morality" needed for survival (don't kill, don't steal).
  2.  **Content is Arbitrary:** It doesn't matter *which* side we drive on, only that we *agree*. Similarly, society needs rules on property, but the specific moral reasoning behind them can change.
  3.  **Private Conduct is Irrelevant:** What music you listen to in your car, or who you are dating in the passenger seat, does not affect the traffic flow.
  4.  **Disintegration:** The roads only collapse if everyone ignores the stop signs (harm to others). They do not collapse if people change their taste in radio stations (private morality).

  **Why this beats the Church Analogy:**
  It separates **coordination rules** (which are necessary for safety) from **lifestyle choices** (which are irrelevant to the system's function). It shows that while we need *rules*, we don't need *uniformity of belief* to keep the roads open.

  ### Summary for Your Argument
  Tell your brother-in-law:
  1.  **Devlin's Church Analogy fails** because societies aren't voluntary clubs, and they survive moral evolution (slavery, divorce) without collapsing.
  2.  **The Logic Jump fails** because needing *a* morality isn't the same as needing *this* morality.
  3.  **The Evidence fails** because states that repealed adultery laws didn't dissolve.
  4.  **Better view:** Law is like traffic rules—it prevents collisions (harm), it doesn't dictate the destination (private virtue).
