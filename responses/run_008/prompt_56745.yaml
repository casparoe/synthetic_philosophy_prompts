prompt: |-
  Before I go back into the literature on the Pasadena paradox and its relatives, I want to work out what I should be demanding of a decision theory in that neighborhood in the first place. For my decision theory seminar, I'm supposed to write the specification first and only then score the proposals against it, and I'd like help constructing the list of desiderata.

  The scope is decision-making when expected values are infinite or undefined rather than merely hard to compute. So the theory has to cover at least these cases: the St. Petersburg game, where every finite play is fine but the expectation is infinite, so naive theory says pay any finite price to play; the Pasadena game as Nover and Hájek present it, where the series of probability-weighted payoffs alternates in sign and converges conditionally, so the expectation is not merely infinite but undefined, and reordering the terms yields any value you like; the Altadena game, which pays a dollar more than Pasadena in every state, so it seems obviously at least as good; the super-Petersburg variant with even faster-growing payoffs; and the two-envelope paradox, where the same theory appears to recommend switching forever, or paying to switch.

  What I want from you is the requirements list. For each desideratum, give the case or consideration that motivates it -- e.g., whatever else a theory says, it presumably must prefer Altadena to Pasadena, and must not charge me to swap envelopes with myself -- and say whether the requirement is non-negotiable or a camp preference. Some candidates I have in mind but am not sure how to weigh: dominance and statewise dominance; consistency of preferences under refinements of the outcome space (splitting a payoff into two equiprobable payoffs shouldn't change anything); some relation to the limit of the truncated or capped games, or an explanation of why no such relation is required; and extendability to unbounded utility, or else a principled reason to ban unbounded utilities and accept that St. Petersburg becomes unchoosable rather than infinitely choosable.

  The part I most want to see is where the desiderata conflict. In particular, I suspect that dominance plus any requirement that the theory's verdicts be insensitive to how we group and order the terms of an infinite series cannot be jointly satisfied, given what conditional convergence allows; if that's right, or if some other subset is jointly unsatisfiable, say so and say which requirement you'd drop. Also flag which single requirement does the most work in excluding the live proposals -- truncated-expectation views, relative or comparison-based accounts that rank games against each other rather than assigning values, and utility caps -- since that will tell me where the seminar debates actually turn.

  Please keep the weight on the criteria and their motivating cases rather than on adjudicating between the proposals; I'll do the scorecard in class myself. And write the desiderata at a level of generality that would also cover finite-but-pathological cases where the theory's machinery must agree with ordinary expected utility theory, since I'd otherwise worry the list only fits the exotic cases.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata list:

  1.  **Analyze the Request:**
      *   **Goal:** Construct a list of desiderata (requirements) for a decision theory handling infinite/undefined expected values (St. Petersburg, Pasadena, Altadena, Two-Envelope, etc.).
      *   **Context:** A decision theory seminar. The user needs to write a specification *before* scoring proposals.
      *   **Key Content:**
          *   List desiderata with motivating cases.
          *   Classify as "Non-negotiable" vs. "Camp Preference".
          *   Highlight conflicts/incompatibilities (especially regarding dominance vs. rearrangement invariance).
          *   Identify which requirement does the most "exclusionary work" against live proposals (truncated expectations, relative accounts, utility caps).
          *   Ensure generality (covers finite cases too, agrees with standard EU where applicable).
          *   *Constraint:* Focus on criteria, not adjudicating between proposals.

  2.  **Deconstruct the Problem Space:**
      *   **The Core Issue:** Standard Expected Utility Theory (EUT) relies on the integral/sum $\sum p_i u_i$ being well-defined (absolute convergence). In these paradoxes, it's either infinite (St. Petersburg) or conditionally convergent/undefined (Pasadena).
      *   **The Candidates:**
          *   *St. Petersburg:* Infinite expectation. Naive EUT says pay any finite amount. Intuition: Maybe not *any* amount (bounded rationality? diminishing marginal utility?).
          *   *Pasadena:* Alternating series. Expectation undefined. Reordering changes value.
          *   *Altadena:* Pasadena + $1. Dominance says Altadena > Pasadena.
          *   *Two-Envelope:* Symmetry suggests indifference, but calculation suggests switching.
      *   **The Tensions:**
          *   Dominance vs. Rearrangement Invariance (Riemann Series Theorem).
          *   Unbounded Utility vs. St. Petersburg Intuitions.
          *   Absolute Value vs. Relative/Comparison-based valuation.
          *   Continuity/Limits vs. Discontinuous jumps in value.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Candidate 1: Agreement with Standard EUT.*
          *   Motivation: If the expectation is finite and well-defined, the theory shouldn't contradict standard EUT.
          *   Status: Non-negotiable (otherwise it's not an extension, it's a replacement).

      *   *Candidate 2: Statewise Dominance.*
          *   Motivation: Altadena vs. Pasadena. If Act A pays $\ge$ Act B in every state and $>$ in some, A > B.
          *   Status: Non-negotiable (usually). *Wait, this is where the conflict lies.* In infinite spaces, weak dominance can conflict with other axioms. Let's call it "Statewise Dominance" but note the tension.

      *   *Candidate 3: Rearrangement Invariance (or Description Invariance).*
          *   Motivation: The physical game shouldn't change based on how we write down the math (order of summation). Pasadena terms can be reordered to yield any sum.
          *   Status: This is the tricky one. If we demand the *value* is invariant, we might break dominance. If we demand *preference* is invariant, it's harder. Let's frame it as "Insensitivity to Partition/Ordering."
          *   Status: Camp Preference (some say the order matters physically, most say it shouldn't).

      *   *Candidate 4: Unbounded Utility (or lack thereof).*
          *   Motivation: St. Petersburg. If utility is unbounded, St. Pete has infinite value. If bounded, it doesn't.
          *   Status: Camp Preference. This is a major fork in the road.

      *   *Candidate 5: Continuity / Limit Consistency.*
          *   Motivation: Truncated St. Petersburg. As $N \to \infty$, does the value converge to the infinite game's value?
          *   Status: Camp Preference. Some theories (like truncation) rely on this; others reject it.

      *   *Candidate 6: No Money Pumps / Cycle Avoidance.*
          *   Motivation: Two-Envelope. Switching forever implies a money pump.
          *   Status: Non-negotiable (Rationality constraint).

      *   *Candidate 7: Additivity.*
          *   Motivation: $V(A + B) = V(A) + V(B)$.
          *   Status: Camp Preference. Often fails in infinite contexts.

  4.  **Refining the Conflicts (The "Meat" of the answer):**
      *   *The Big Conflict:* **Dominance vs. Rearrangement Invariance.**
          *   In Pasadena, you can rearrange the series to make the sum negative. But Altadena is Pasadena + 1.
          *   If you require the value to be independent of ordering (Riemann), you can't assign a specific number.
          *   If you require Dominance (Altadena > Pasadena), you need a way to compare them even if values are undefined.
          *   *Crucial Insight:* You cannot have Statewise Dominance + Unique Real-Valued Representation + Rearrangement Invariance for conditionally convergent series. One must go.
      *   *The "Exclusionary" Requirement:*
          *   What kills the most theories?
          *   *Utility Boundedness:* Kills standard EUT extensions that keep unbounded utility (St. Pete becomes infinite).
          *   *Dominance:* Kills "Weak Expectation" views or views that rely solely on limiting averages if they violate dominance in specific constructions.
          *   *Actually, the strongest filter is usually "Agreement with EUT on finite cases" + "Dominance" + "No Infinite Values" (or handling them).*
          *   Let's identify **"Extensionality / Description Invariance"** (specifically regarding partitioning/ordering) as the heavy lifter against truncation views, and **"Statewise Dominance"** as the heavy lifter against some relative accounts.
          *   *Correction:* The prompt asks what excludes live proposals.
              *   Truncated-expectation views: Often violate Dominance or Continuity.
              *   Relative accounts: Often violate Transitivity or Independence.
              *   Utility caps: Violate "Unbounded Utility" (obviously) but solve St. Pete.
          *   The *conflict* is the most important part. The conflict between **Dominance** and **Rearrangement Invariance** is the technical heart of the Pasadena problem.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the task (specification before scoring).
      *   **The Desiderata List:** Grouped by category (Rationality, Mathematical Consistency, Structural).
      *   **Format per item:** Name, Motivation/Case, Status (Non-negotiable/Camp).
      *   **The Conflict Map:** Explicitly detail the incompatibility theorems (Dominance vs. Rearrangement).
      *   **The "Killer" Criterion:** Identify which desideratum forces the hardest choices.
      *   **Conclusion:** Advice on how to use the list.

  6.  **Drafting the Content (Self-Correction during drafting):**
      *   *Check:* Did I cover Two-Envelope? Yes, need a criterion about symmetry or money pumps.
      *   *Check:* Did I cover Altadena? Yes, Dominance.
      *   *Check:* Did I cover St. Pete? Yes, Unbounded Utility vs. Finite Valuation.
      *   *Refinement on "Rearrangement":* It's not just mathematical ordering; it's "Partition Invariance." Splitting a state into two sub-states with half probability each shouldn't change the verdict. This is crucial for Pasadena.
      *   *Refinement on "Dominance":* Distinguish Weak vs. Strong. In infinite cases, Weak Dominance is the one that causes trouble with countable additivity. Let's specify **Countable Statewise Dominance**.
      *   *Refinement on "Exclusionary Work":* The requirement that **values must be real numbers** (or comparable) does huge work. It kills the "undefined" answer. But the requirement that **preferences must be complete** is also huge. Let's focus on **Countable Additivity/Linearity** vs. **Dominance**.
      *   *Actually, the prompt asks:* "flag which single requirement does the most work in excluding the live proposals."
          *   Truncated views fail **Continuity** or **Dominance**.
          *   Relative accounts fail **Completeness** or **Independence**.
          *   Utility caps fail **Unbounded Utility**.
          *   The most contentious one is usually **Countable Additivity** (or the principle that leads to it). But for *this specific neighborhood* (Pasadena), the tension between **Dominance** and **Partition Invariance** is the specific technical bottleneck.
          *   However, the *practical* filter is often **Agreement with Intuition on St. Petersburg** (i.e., "Don't pay your life savings"). This is often codified as **Bounded Utility** or **Risk Sensitivity**.
          *   Let's stick to the structural conflict: **Dominance vs. Partition Invariance**. This is the theoretical knot.

  7.  **Final Polish:**
      *   Ensure tone is academic but helpful (seminar prep).
      *   Make sure the "Non-negotiable" vs. "Camp" distinction is clear.
      *   Ensure the conflict section is rigorous (referencing the Riemann Rearrangement Theorem implication).

  8.  *(Self-Correction on the "Killer" Criterion)*: The prompt asks what excludes live proposals.
      *   If I demand **Real-Valued Representation**, I kill "Undefined" views.
      *   If I demand **Dominance**, I kill some averaging views.
      *   If I demand **Partition Invariance**, I kill truncation views that depend on natural ordering.
      *   I will argue that **Partition Invariance (Description Invariance)** is the hardest constraint for infinite series theories to satisfy without giving up Dominance or Real-Valuedness.

  9.  **Final Review against constraints:**
      *   Scope: Infinite/undefined EV.
      *   Cases: St. Pete, Pasadena, Altadena, Two-Envelope.
      *   Output: Desiderata list, Conflicts, Exclusionary analysis.
      *   Tone: Specification-focused, not adjudication.

