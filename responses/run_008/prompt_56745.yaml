answer: |-
  Here is a specification list of desiderata for a decision theory handling infinite and undefined expectations. They are structured to apply generally (agreeing with standard Expected Utility Theory where it works) while targeting the specific pathologies of the St. Petersburg, Pasadena, and Two-Envelope neighborhoods.

  ### I. The Desiderata List

  #### 1. Finite Agreement (The Anchor)
  *   **Requirement:** In any decision problem where the expected utility sum converges absolutely to a finite value, the theory's ranking must agree with standard Expected Utility Theory (EUT).
  *   **Motivation:** A theory of *general* choice shouldn't break standard economics in standard cases. If a game has a well-defined expectation of $5, the theory shouldn't value it at $10 or declare it incomparable to a sure $5.
  *   **Status:** **Non-negotiable.** (Without this, the theory is not an extension of EUT but a replacement, requiring a wholly different justification.)

  #### 2. Countable Statewise Dominance
  *   **Requirement:** If Act $A$ yields an outcome at least as good as Act $B$ in every possible state, and strictly better in at least one state with non-zero probability, then $A$ is strictly preferred to $B$.
  *   **Motivation:** **The Altadena Game.** Altadena pays exactly $1 more than Pasadena in every state. Whatever the weirdness of the Pasadena series, adding a constant dollar to every outcome should make the act strictly better. A theory that says Altadena $\nsucc$ Pasadena is violating a basic rationality constraint.
  *   **Status:** **Non-negotiable.** (Though, as noted below, this is the primary source of theoretical tension.)

  #### 3. Partition Invariance (Description Independence)
  *   **Requirement:** The valuation or ranking of an act should not depend on how the state space is partitioned or how the terms of the expectation series are ordered/grouped. Splitting a state of probability $p$ into two states of $p/2$ with the same payoff should not change the verdict.
  *   **Motivation:** **The Pasadena Game.** The Pasadena expectation is conditionally convergent. By the Riemann Rearrangement Theorem, reordering the terms allows the sum to equal any real number. Since the physical game doesn't change when we reorder the math, the decision theoretic verdict shouldn't either.
  *   **Status:** **Camp Preference.** (Some "order-dependent" views exist, but most consider this a bug. However, maintaining this often forces the sacrifice of Dominance or Real-Valuedness.)

  #### 4. No Money Pumps (Cycle Avoidance)
  *   **Requirement:** The preference relation must be acyclic. It must not recommend a sequence of trades that returns the agent to their initial state with less money (or utility) than they started.
  *   **Motivation:** **The Two-Envelope Paradox.** Naive calculations suggest you should always switch envelopes. If you can switch back and forth indefinitely (perhaps paying a small fee), you lose money forever. A viable theory must block the inference that leads to this cycle.
  *   **Status:** **Non-negotiable.** (This is a minimal condition of instrumental rationality.)

  #### 5. Continuity (Limit Consistency)
  *   **Requirement:** If a sequence of acts $A_n$ converges to act $A$ (e.g., truncating an infinite game at $n$ rounds), the value/preference of $A_n$ should converge to the value/preference of $A$.
  *   **Motivation:** **Truncated St. Petersburg.** We often analyze infinite games by looking at finite caps. If the theory says every finite cap is worth $\approx \$20$, but the infinite game is worth $\infty$ (or undefined), there is a discontinuity. Some demand the infinite case be the limit of the finite cases; others argue infinite games are categorically different.
  *   **Status:** **Camp Preference.** (This is the main fault line between "Truncation" views and "Intrinsic" views.)

  #### 6. Unbounded Utility (or Principled Boundedness)
  *   **Requirement:** The theory must either (a) accommodate unbounded utility functions without collapsing, or (b) provide a principled justification for bounding utility that applies generally, not just *ad hoc* to avoid St. Petersburg.
  *   **Motivation:** **St. Petersburg Paradox.** Standard EUT with unbounded utility says St. Petersburg is worth infinite utility, implying you should mortgage your life to play. Most humans intuitively refuse. A theory must either explain why the intuition is wrong (defend unbounded utility) or explain why utility *must* be bounded (e.g., physical limits, cognitive limits).
  *   **Status:** **Camp Preference.** (This is the deepest philosophical fork. You must choose a side, but both are defensible.)

  #### 7. Completeness
  *   **Requirement:** For any two acts $A$ and $B$, the agent must either prefer $A$, prefer $B$, or be indifferent. (No "incomparable" verdicts).
  *   **Motivation:** **Decision Guidance.** A decision theory is supposed to tell you what to do. If Pasadena and a sure $0 are "incomparable," the theory fails to guide action.
  *   **Status:** **Camp Preference.** (Many modern proposals sacrifice this to save Dominance and Partition Invariance, allowing for "gaps" in preference.)

  ---

  ### II. The Conflict Map: Where Desiderata Collide

  You suspected that Dominance and Rearrangement Invariance cannot be jointly satisfied. You are correct, and this is the central technical theorem of this literature.

  **The Incompatibility Theorem:**
  You cannot simultaneously satisfy **Countable Statewise Dominance**, **Partition Invariance**, and **Real-Valued Representation** (assigning a specific number to every game) in the presence of conditionally convergent series (like Pasadena).

  *   **Why:** If you demand Partition Invariance, the "value" of the Pasadena game cannot depend on the order of summation. But for a conditionally convergent series, the sum *is* order-dependent. Therefore, no unique real number can represent the value.
  *   **The Consequence:** To save Partition Invariance, you must either:
      1.  **Drop Real-Valued Representation:** Allow values to be undefined, intervals, or hyperreals (sacrificing Completeness or standard arithmetic).
      2.  **Drop Dominance:** Some "Weak Expectation" or averaging views violate dominance in infinite cases to preserve a form of averaging.
      3.  **Drop Partition Invariance:** Claim that the "natural" ordering of the game (e.g., temporal order of coin flips) fixes the sum. (This is generally viewed as ad hoc).

  **Secondary Conflict: Continuity vs. Dominance**
  In the St. Petersburg case, if you demand **Continuity** (the infinite game is the limit of finite truncations) and **Unbounded Utility**, you are forced to accept the infinite value verdict. If you intuitively reject paying your life savings for St. Petersburg, you must drop either Continuity (the infinite game is a different beast) or Unbounded Utility (cap the utility function).

  ---

  ### III. The "Killer" Criterion

  If you want to know which requirement does the most work in excluding live proposals during your seminar scoring, it is **Partition Invariance (combined with Real-Valuedness).**

  Here is how it filters the major camps:

  1.  **Truncated-Expectation Views:** (Value = Limit of finite caps).
      *   *Fails:* **Partition Invariance.** If you partition the states differently, the sequence of truncations changes, and the limit may change or vanish. They also often struggle with **Dominance** in the Altadena case if the limits behave pathologically.
  2.  **Relative/Comparison-Based Accounts:** (Rank acts against each other without assigning values).
      *   *Fails:* **Completeness.** These views often conclude that Pasadena and a sure $0 are incomparable. They survive Dominance and Partition Invariance better, but at the cost of action-guidance.
  3.  **Utility Caps (Bounded Utility):**
      *   *Fails:* **Unbounded Utility.** (Obviously). But note: This is the *only* view that easily satisfies Dominance, Partition Invariance, and Real-Valuedness simultaneously. It solves the math by changing the inputs. If you keep Unbounded Utility as a desideratum, this view is eliminated immediately.
  4.  **Standard EUT Extensions (e.g., Weak Expectation):**
      *   *Fails:* **Dominance.** There are specific constructions (related to the Pasadena/Altadena pair) where satisfying the averaging condition required for Weak Expectation forces a violation of Statewise Dominance.

  **Recommendation for your Seminar:**
  If you want the most heated debate, mark **Partition Invariance** and **Dominance** both as **Non-negotiable**. This will force every single proposal into a contradiction, requiring students to argue which axiom should be the "sacrificial lamb."

  If you want to see which metaphysical commitments drive the theories, mark **Unbounded Utility** as the key Camp Preference. This cleanly separates the "fix the math" crowd (who keep unbounded utility and change the decision rules) from the "fix the model" crowd (who bound utility to save the decision rules).

  ### IV. Summary for your Specification Document

  When writing your spec, I recommend this hierarchy:

  1.  **Hard Constraints (The "Must Haves"):** Finite Agreement, No Money Pumps, Countable Statewise Dominance. (Any theory failing these is arguably broken).
  2.  **The Tension Zone (The "Pick One"):** Partition Invariance vs. Real-Valued Completeness. (Force the proposals to declare which one they relax).
  3.  **The Philosophical Fork (The "Camp Preferences"):** Unbounded Utility vs. Bounded Utility; Continuity vs. Discontinuity.

  This structure ensures you aren't just testing whether they solve the paradox, but *what cost* they incur to solve it.
