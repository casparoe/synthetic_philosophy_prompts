      *   *Is it verbal?* To an extent. Are we arguing about the definition of "death" or the criteria for "death"? If we define death as "loss of personhood," brain death fits. If "loss of organismic function," Shewmon has a point. But it's deeper than just semantics; it has real-world consequences (organ harvesting, turning off vents).
      *   *Is it policy/transplantation?* There's a strong historical link between brain death and organ transplantation (Harvard Committee 1968). Critics often allege the definition was moved to facilitate organs. Defenders deny this motivates the *truth* of the definition, even if it motivated the *adoption*. This is a "covert policy fight" element.
      *   *Is it intuitive/metaphysical?* Yes. What makes us *us*? Is it the breathing body or the conscious mind? This is the "bedrock intuition" angle.
      *   *Synthesis:* It's a **hybrid**. It's a *normative* dispute disguised as a *biological* one, fueled by *policy* needs, and rooted in *competing metaphysical intuitions*.

