          *   *Cost of Rejection:* Requires asserting a hard biological boundary for consciousness, which contradicts evolutionary continuity.

      *   **Premise (2): Total Consequentialism + Linear Aggregation.**
          *   *Plausibility:* Standard utilitarian view. Summing welfare.
          *   *Weakness:* "Linear aggregation" across *moral uncertainty* vs. *empirical uncertainty*. This is the crux. The argument mixes empirical uncertainty (are they sentient?) with moral uncertainty (how much do they count?).
          *   *Cost of Rejection:* Moving away from standard utilitarianism (e.g., person-affecting views, critical-level utilitarianism).

      *   **Premise (3): $N$ grows faster than $P$ shrinks.**
          *   *Plausibility:* Empirically, $N$ is huge (trillions/quadrillions). $P$ is subjective.
          *   *Weakness:* This assumes $P$ decreases *linearly* or *polynomially* with complexity, but $N$ increases *exponentially*. However, if $P$ is based on a threshold model (even if fuzzy), the drop-off might be step-like, not smooth. But the "no cutoff" claim in (1) attacks this.
