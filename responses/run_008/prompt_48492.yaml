  10. **Final Polish:** Check against the user's specific constraints ("tell me what I'm paying," "where your reasoning might go wrong"). Ensure the distinction between empirical and moral uncertainty is sharp. (Self-correction: The housemate frames sentience probability as empirical, but it functions as moral weight. I need to clarify that distinction).

