          4.  **Moral Uncertainty specific:** Voting models vs. Expectation models.

  5.  **Formulating the Diagnosis:**
      *   *Where does it break?* It breaks at the intersection of **Moral Uncertainty Aggregation** and **Empirical Uncertainty regarding Sentience**.
      *   *Specific Target:* Premise (2) and the application of Expected Value Theory to *moral* hypotheses where the "payoff" is ill-defined.
      *   *Better Target:* The treatment of **Sentience Probability**. It treats "probability of sentience" as a scalar multiplier on moral weight. But sentience isn't a binary switch with a probability; it's a *degree* of capacity.
      *   *Even Better Target:* **Risk Aversion / Bounded Utility.** If you are a total utilitarian, you are vulnerable to the "Repugnant Conclusion" and this "Invertebrate Conclusion." To avoid them, you need non-linear aggregation.
