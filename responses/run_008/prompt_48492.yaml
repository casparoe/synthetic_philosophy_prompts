      *   **The Constraint:** Do not just dismiss it via "Pascal's Mugging" hand-waving. If the argument is sound, admit it. If not, identify the specific break point, explain why it looked plausible, and what the cost of rejecting it is (trade-offs).
      *   **The Goal:** Step-by-step analysis of the 6 premises/inferences, identifying the weakest link, discussing costs, and stating what would change the verdict.

