      *   *Correction on Level 3:* Cognitive penetration is the strongest candidate for the colleague's claim, but it's empirically shaky.
      *   *Correction on Level 4:* Hanson's "theory-ladenness" is the standard philosophical interpretation. It supports the idea that *neutrality* is impossible, but not necessarily that *adjudication* is impossible (Kuhn vs. Lakatos). I need to be nuanced here.

