      *   **Language:** British English.

  2.  **Deconstruct the Slogan:**
      *   "We do not see the world as it is": Suggests a gap between appearance and reality, or between stimulus and experience.
      *   "But as we are": Suggests the observer's internal state (beliefs, desires, biology, culture) determines the content of experience.
      *   **Colleague's Goal:** To argue for strong theory-ladenness (observation cannot be neutral arbiter).

  3.  **Drafting the Distinct Theses (Iterative Process):**

      *   *Level 1: Trivial/Attention.* We notice different things based on interest.
          *   *Thesis:* Selective Attention / Perceptual Set.
          *   *Status:* Platitude.
          *   *Support for Colleague?* No. Ignoring data isn't the same as data being theory-constituted.

      *   *Level 2: Diachronic/Expertise.* Experts see differently than novices after training.
          *   *Thesis:* Perceptual Learning (e.g., radiologists seeing tumours).
          *   *Status:* Substantive/Defensible (empirically supported).
          *   *Support for Colleague?* Weak. It explains why experts disagree, but doesn't rule out convergence on truth eventually. It doesn't make observation *in principle* biased, just skilled.

      *   *Level 3: Synchronic/Cognitive Penetration.* Beliefs change the *content* of experience right now.
          *   *Thesis:* Cognitive Penetration of Perception (e.g., seeing a stick as bent due to belief, or colour due to desire).
