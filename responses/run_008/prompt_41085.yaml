          *   *Support for Colleague?* Stronger. If reports require theory, neutrality is hard. But adjudication is still possible via coherence.

      *   *Level 5: Kantian/Epistemic.* We never access the noumenal.
          *   *Thesis:* Transcendental Idealism / Constructivism.
          *   *Status:* Metaphysically heavy, hard to verify/falsify.
          *   *Support for Colleague?* Too strong. If we can't access reality *at all*, science is impossible, not just difficult. Self-defeating for a scientist.

