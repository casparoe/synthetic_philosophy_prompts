prompt: |-
  So here's my situation: I recently got asked onto the advisory board of a small family foundation that funds both SETI-style listening campaigns and origins-of-life research, and the board is split into two camps that have been arguing past each other for years. One side is basically rare-Earth: the chain from abiogenesis to a technological civilization is so contingent that we're probably alone or nearly alone, and the Fermi silence isn't a paradox, it's just what you'd expect. The other side says the Copernican point still stands, life is probably common where conditions allow, and the silence is explained by detectability limits, timing, or distances rather than by our rarity. Before we announce the next funding round, the chair wants a joint position statement we can all actually sign, and I've been tasked with drafting it. I want to do it properly, not produce both-sides mush. Can you write that document? Specifically: (1) the claims both camps can sign -- about the number of potentially habitable planets, what we genuinely do and don't know about how life starts, and what the null results so far do and don't show; (2) the exact disagreements, each phrased so its own side would accept the wording of its own view -- I suspect one dispute is whether "are we alone?" means any life vs. technological civilizations, and I'd want you to say whether that part is just verbal; (3) the cruxes, the sub-questions where settling them would actually move at least one side -- e.g. whether transitions like the one from simple cells to complex ones are inherently rare or just happened to be rare here, and whether decades of hearing nothing carries real Bayesian weight given we don't know how long civilizations broadcast; and (4) for each crux, a concrete finding or observation both camps would agree bears on it, with each side's prediction written down in advance so we can check later. Format it as a numbered agreed-claims section followed by a table for the disagreements. And keep it something a real person from each camp would put their name on.
reasoning: |-
  Here's a thinking process that leads to the suggested advisory board position statement:

  1.  **Analyze the Request:**
      *   **Context:** Advisory board of a small family foundation funding SETI and Origins-of-Life (OoL) research.
      *   **Problem:** Board is split between "Rare Earth" (we are alone/nearly alone, Fermi silence is expected) and "Copernican/Abundant Life" (life is common, silence is due to detectability/timing).
      *   **Task:** Draft a joint position statement for the next funding round.
      *   **Constraints:**
          *   No "both-sides mush" (needs substance).
          *   Must be signable by both camps.
          *   Specific sections required:
              1.  Agreed Claims (habitable planets, OoL knowledge, null results).
              2.  Exact Disagreements (phrased neutrally but accurately for each side).
              3.  Cruxes (sub-questions that would move the needle).
              4.  Concrete Findings/Observations for each crux with pre-registered predictions.
          *   Format: Numbered agreed-claims section followed by a table for disagreements/cruxes.
          *   Tone: Professional, scientific, diplomatic but precise (something a real scientist would sign).
          *   Specific instruction: Address whether the "are we alone?" dispute is verbal (life vs. tech civs).

  2.  **Deconstruct the Science & Philosophy:**
      *   *Rare Earth Ward (REW):* Emphasizes bottlenecks (abiogenesis, eukaryogenesis, intelligence, technology). Believes $N$ (number of detectable civs) is $\approx 1$. Fermi silence is evidence of rarity.
      *   *Copernican/Abundant Life Ward (CALW):* Emphasizes planetary abundance, chemical inevitability of life. Believes $N \gg 1$. Fermi silence is a selection effect or temporal mismatch.
      *   *Common Ground:* Exoplanets are common. Habitable zones exist. Abiogenesis mechanism is unknown. Current SETI sensitivity is limited.
      *   *The "Verbal" Dispute:* "Are we alone?" often conflates *microbial life* vs. *technosignatures*. REW often argues intelligence is rare; CALW often argues life is common. This needs clarification.
      *   *Cruxes:*
          *   Abiogenesis probability ($P_{life}$).
          *   Evolutionary bottlenecks (Prokaryote $\to$ Eukaryote $\to$ Multicellular $\to$ Tech).
          *   Longevity of civilizations ($L$ in Drake Equation).
          *   Interpretation of the "Great Silence."

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound official. "Joint Advisory Board Position Statement on Astrobiology and SETI Strategy."
      *   **Introduction:** Brief context setting. Acknowledge the tension but frame it as productive scientific discourse.

      *   **Section 1: Agreed Claims (The Common Ground):**
          *   *Planets:* Kepler data is robust. Earth-sized planets in HZ are common ($\eta_{\oplus}$).
          *   *Origins:* We don't know the pathway from chemistry to biology. It could be easy or hard.
          *   *Null Results:* SETI hasn't found ET yet. This constrains parameters but doesn't rule out life entirely *yet*.
          *   *Funding:* Both OoL and SETI are necessary to resolve the uncertainty.

      *   **Section 2 & 3 & 4: The Disagreements/Cruxes/Predictions Table:**
          *   This needs to be a matrix.
          *   *Columns:* Crux Question, Rare Earth Position, Copernican Position, Decisive Observation/Experiment, Pre-registered Predictions.
          *   *Crux 1: Abiogenesis.* Is it a fluke or chemistry?
              *   REW: Hard step.
              *   CALW: Easy/Inevitable.
              *   Test: Synthetic biology creating life from scratch / Biosignatures on early Earth or Mars.
          *   *Crux 2: Evolutionary Bottlenecks.* Eukaryogenesis/Intelligence.
              *   REW: Unique or extremely rare events.
              *   CALW: Convergent evolution makes them likely.
              *   Test: Fossil record analysis / Exoplanet atmospheric complexity (O2 without tech).
          *   *Crux 3: The Fermi Silence.* What does it mean?
              *   REW: Evidence of rarity ($N \approx 1$).
              *   CALW: Evidence of limited search space/time ($L$ is short or distance is far).
              *   Test: Next-gen SETI (negative result pushes REW, positive pushes CALW).
          *   *Addressing the "Verbal" Dispute:* I need to explicitly state in the preamble or the table that "Life" $\neq$ "Civilization."

      *   **Refining the Tone:**
          *   Avoid saying "Side A is wrong."
          *   Use phrases like "We acknowledge divergent interpretations..."
          *   Ensure the predictions are falsifiable.
          *   Make sure the "Verbal" point is handled carefully. It's not *just* verbal, because the probability of microbes is likely higher than tech, but the *implication* for funding is the key.

      *   **Drafting the Content (Iterative refinement):**
          *   *Claim 1:* $\eta_{\oplus}$ is high. (Both agree).
          *   *Claim 2:* Abiogenesis is unsolved. (Both agree).
          *   *Claim 3:* Current SETI is a drop in the bucket. (Both agree).
          *   *Disagreement:* Is the Great Filter behind us or ahead of us?
          *   *Verbal Check:* The prompt asks me to say whether the "are we alone?" part is just verbal. I should address this in the preamble or a specific note. It's *not* just verbal, it's a difference in probability assignments to specific steps. But often people talk past each other because one means "bugs" and the other means "radios." I will clarify this distinction in the "Agreed Claims."

      *   **Formatting:**
          *   Numbered list for agreements.
          *   Table for disagreements/cruxes.
          *   Sign-off line.

      *   **Self-Correction during drafting:**
          *   *Critique:* Is the table too cluttered?
          *   *Fix:* Keep the "Position" columns concise. Focus on the "Decisive Observation" and "Predictions."
          *   *Critique:* Did I address the "verbal" dispute?
          *   *Fix:* I will add a specific clause in the Agreed Claims distinguishing "Biological Life" from "Technological Civilization" to ensure they aren't arguing past each other.
          *   *Critique:* Is it "mush"?
          *   *Fix:* Ensure the predictions are stark. "If X happens, Side A admits Y."

  4.  **Final Polish:**
      *   Check against the prompt's 4 specific requirements.
      *   (1) Claims: Habitable planets, OoL ignorance, Null results. (Check)
      *   (2) Disagreements: Phrased neutrally. (Check)
      *   (3) Cruxes: Transitions, Bayesian weight of silence. (Check)
      *   (4) Concrete findings/predictions. (Check)
      *   Format: Numbered + Table. (Check)
      *   Tone: Signable. (Check)

  5.  **Final Review of the "Verbal" Instruction:** The prompt asks: "I suspect one dispute is whether 'are we alone?' means any life vs. technological civilizations, and I'd want you to say whether that part is just verbal."
      *   *Decision:* I will address this in the preamble/introductory text of the document. It is *not* merely verbal; it is a structural disagreement about the Drake Equation parameters. However, conflating the two *is* a source of confusion. I will clarify the distinction in the Agreed Claims so the table can focus on the hard parameters.

  6.  **Writing the Document.** (Proceeding to generate output based on these thoughts).
