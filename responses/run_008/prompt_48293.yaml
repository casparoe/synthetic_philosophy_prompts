      *   *Epistemic Akrasia:* Standardly defined as believing $P$ while believing that one's belief in $P$ is irrational/unwarranted. (e.g., "It's raining, but it's irrational for me to believe it's raining").
      *   *The Conflict:*
          *   *Conciliationism/Defeat:* Higher-order evidence (HOE) about reliability defeats first-order evidence (FOE). If I know I'm unreliable, I should lower confidence. (Feldman, Christensen).
          *   *Steering/Access:* FOE is what determines the truth. HOE is just noise about the process. If the slide *looks* like X, it's X. Ignoring the slide to satisfy a statistic is irrational. (Sliwa, Horowitz).
