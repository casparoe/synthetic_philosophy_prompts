          *   Address the Founder's intent (language vs. history).
          *   Tone: Accessible but rigorous (for philosophy-reading trustees and the program officer). Neutral/Collegial (must maintain working relationships).
          *   Format: Standard Memo (Question, Background, Arguments, Recommendation).
          *   Length: 1.5 - 2 pages.
