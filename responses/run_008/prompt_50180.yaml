answer: |-
  # Lesson Plan: The Impossibility of Innocence
  **Course:** Upper-Level Social Choice Theory Seminar
  **Class Size:** 18 Students
  **Duration:** 90 Minutes
  **Topic:** Gibbard–Satterthwaite Theorem (Experiential Introduction)

  ## I. Learning Objectives
  1.  **Experience Manipulability:** Students will identify a scenario where sincere voting yields a Pareto-inferior outcome and strategic voting yields a personal gain.
  2.  **Feel the Design Burden:** Students will attempt to construct a voting rule immune to manipulation and experience the frustration of "breaking" their own designs.
  3.  **Understand the Theorem's Constraints:** Students will map their failed designs to the specific assumptions of the Gibbard–Satterthwaite theorem (Unrestricted Domain, $\ge 3$ Alternatives, Non-Dictatorship, Surjectivity).

  ## II. Materials List
  *   **Preference Cards (18):** Pre-printed cards assigning each student a "Type" (Type A, B, or C) with a specific ranking of three alternatives. (6 of each Type).
  *   **Ballots (36):** Simple slips of paper for Stages 1 and 2.
  *   **Whiteboards/Flip Charts (3):** One per group for Stage 3.
  *   **Markers & Sticky Notes:** For "attacking" rules in Stage 3.
  *   **Timer:** Visible to the class.
  *   **The "Stake":** A printed syllabus page showing the three remaining seminar topics (e.g., *Judgment Aggregation*, *Spatial Models*, *Mechanism Design*).

  ## III. The Payoff Scheme
  **The Stake:** The order in which the final three seminar topics are taught.
  **The Incentive:** To ensure the game theoretic incentives align with the "Stake," students are instructed to **adopt the preferences on their assigned cards** for the duration of the activity.
  *   *Instructor Script:* "For the next hour, you are not yourselves. You are agents with the preferences on your card. If the alternative ranked #1 on your card is selected, you earn 2 Participation Points. #2 earns 1 Point. #3 earns 0. These points count toward your participation grade. However, the winning alternative *also* determines the actual order of topics for the rest of the term. You must balance your grade incentives with the reality of the syllabus."
  *(Note: This dual-stake ensures they care about the math and the real-world outcome.)*

  **The Alternatives:**
  *   **X:** Judgment Aggregation
  *   **Y:** Spatial Models
  *   **Z:** Mechanism Design

  **The Profile (Distributed via Cards):**
  *   **Type A (6 Students):** $X \succ Y \succ Z$
  *   **Type B (6 Students):** $Y \succ Z \succ X$
  *   **Type C (6 Students):** $Z \succ Y \succ X$
  *(Note: Y is the Condorcet Winner. X is the Plurality Winner if votes are split, or a Tie occurs. We will use Plurality with a Tie-Break rule favoring X to ensure a "disliked" outcome in Stage 1.)*

  ---

  ## IV. Minute-by-Minute Timeline

  ### Stage 1: The Trap of Sincerity (0:00 – 0:20)
  *   **0:00–0:05:** Distribute Preference Cards. Explain the Payoff Scheme. Emphasize the "Honor System" for sincerity.
  *   **0:05–0:10:** **Vote 1.** Instruct students to vote for their **top choice only** (Plurality Rule). Collect ballots.
  *   **0:10–0:15:** **Tally.**
      *   Type A votes X (6 votes).
      *   Type B votes Y (6 votes).
      *   Type C votes Z (6 votes).
      *   *Instructor Intervention:* Announce a 3-way tie. Invoke a pre-stated tie-breaking rule: "In the event of a tie, the alternative earliest in the alphabet wins." **Winner: X.**
  *   **0:15–0:20:** **Reaction.** Ask for a show of hands: "Who prefers Y over X?" (Types B and C raise hands: 12 students). "Who prefers Z over X?" (Types B and C: 12 students).
      *   *Key Observation:* 12 out of 18 students dislike the winner. 12 students prefer Y, which beat X in head-to-head comparisons (Condorcet Winner), but Y lost due to vote splitting.
      *   *Feeling:* Frustration/Regret. The system failed the majority.

  ### Stage 2: The Temptation to Lie (0:20 – 0:35)
  *   **0:20–0:25:** **Communication Phase.** Allow students to talk freely for 5 minutes. They realize Type C voters (who prefer Z) have no chance of winning Z. They realize if they switch to Y, Y beats X (12 vs 6).
  *   **0:25–0:30:** **Vote 2.** Re-vote using Plurality.
      *   Expected Outcome: Types A vote X. Types B vote Y. Types C strategically vote Y.
      *   Tally: X (6), Y (12). **Winner: Y.**
  *   **0:30–0:35:** **Debrief Stage 2.**
      *   Ask Type C voters: "Did you get your first choice?" (No). "Did you get a better outcome than Stage 1?" (Yes, Y is better than Z).
      *   *Lesson:* Strategic misreporting paid off. Sincerity was punished. The rule is **manipulable**.

  ### Stage 3: The Constitutional Convention (0:35 – 1:05)
  *   **0:35–0:40:** **Setup.** Divide class into 3 Committees (6 students each).
      *   **Task:** Design a voting rule (aggregation function) for 3 alternatives (X, Y, Z).
      *   **Constraints:**
          1.  Must work for *any* set of voter preferences (Unrestricted Domain).
          2.  Must be able to select any of the three alternatives depending on votes (Surjectivity/No Range Restriction).
          3.  Must not name a specific person as the sole decider (No Dictator).
          4.  Must be deterministic.
      *   **Goal:** Create a rule that is **Strategy-Proof** (no voter can ever benefit by lying).
  *   **0:40–0:55:** **Design Phase.** Committees work on whiteboards. They draft their rule (e.g., "Borda Count," "Instant Runoff," "Pairwise Majority").
  *   **0:55–1:05:** **The Attack (Adversarial Testing).**
      *   Committees swap whiteboards. Committee 1 attacks Committee 2's rule, etc.
      *   **Task:** Find a **Preference Profile** and a **Specific Voter** who would benefit from misreporting their preferences under the rival rule.
      *   Write the "Counter-Example Profile" on a sticky note and slap it on the rival's board.
      *   *Instructor Role:* Circulate. If a group claims immunity, prompt them: "Have you checked what happens if two voters lie? What if preferences are single-peaked? What if they aren't?"

  ### Stage 4: Closing Debrief & Theorem Reveal (1:05 – 1:30)
  *   **1:05–1:15:** **Report Out.** Each committee presents one "Attack" they successfully launched.
      *   *Likely Outcome:* Every rule (Borda, IRV, etc.) will have been successfully attacked.
      *   *Exception:* If a group designed a Dictatorship or restricted the outcome to only {X, Y}, acknowledge it worked but highlight the constraint violated.
  *   **1:15–1:25:** **Mapping to the Theorem.** (See Debrief Script below).
  *   **1:25–1:30:** **The Reveal.** State the Gibbard–Satterthwaite Theorem formally. Connect the name to the exhaustion they just felt.

  ---

  ## V. Closing Debrief Script & Mapping

  **1. The "Universal" Claim vs. Finite Testing**
  *   *Instructor:* "In Stage 3, you tested your rules against maybe 5 or 10 profiles each. You found manipulations. But does that prove *every* rule is manipulable? No. You only tested a finite sample."
  *   *Theorem Link:* "The theorem makes a **universal claim**: For *every* rule satisfying the conditions, there *exists* at least one profile where manipulation pays. You experienced the search, but I must assert the universality. You found the smoke; the theorem proves the fire is everywhere."

  **2. The Escape Hatches (Why some groups 'succeeded')**
  *   *Instructor:* "Did any group find a rule that seemed immune?"
  *   *Scenario A (Dictatorship):* "If you said 'Student 1 decides,' you found an immune rule. But look at Constraint 3. The theorem requires **Non-Dictatorship**. If you allow a dictator, strategy disappears for the dictator, and is irrelevant for others."
  *   *Scenario B (Range Restriction):* "If you said 'We only ever choose between X and Y,' you found an immune rule (Majority Rule is strategy-proof for 2 alternatives). But look at Constraint 2. The theorem requires **$\ge 3$ Alternatives** (Surjectivity). If you collapse the range, you avoid the paradox."
  *   *Scenario C (Restricted Domain):* "If you said 'This only works if preferences are single-peaked,' you are right. But look at Constraint 1. The theorem assumes **Unrestricted Domain**. If you limit what people are allowed to want, you can escape the theorem."

  **3. Distinction: Manipulable vs. Always Manipulated**
  *   *Instructor:* "A common confusion: The theorem says a rule *admits* a manipulable profile. It does not say *every* profile is manipulable. In Stage 2, Type A voters had no incentive to lie. Strategy is opportunistic, not constant. But the *possibility* corrupts the sincerity of the system."

  **4. The Reveal**
  *   *Instructor:* "This exhaustion you feel—the sense that every time you patch a hole, a new one opens, unless you surrender to a dictator or limit choices—is the essence of the **Gibbard–Satterthwaite Theorem** (1973/1975). It states: *For any finite set of 3 or more alternatives, any social choice function that is surjective and strategy-proof must be dictatorial.*"

  ---

  ## VI. Predictable Failures & Mitigation Strategies

  | Predictable Failure | Why It Happens | Instructor Mitigation |
  | :--- | :--- | :--- |
  | **Adversaries find only "implausible" manipulations.** | Students might find a manipulation that requires two voters to coordinate lies, whereas GS is about *individual* incentive. | **Intervene:** "GS is about *individual* rationality. Can *one* person gain by lying, assuming everyone else stays sincere? If your attack requires two people, it's a coalition, not a GS manipulation. Keep looking." |
  | **False Negative ("We found no manipulation").** | A group tests 3 profiles, finds no lies, and claims immunity. | **Challenge:** "You tested 3 profiles. There are $3!^{18}$ possible profiles. Have you proven immunity, or just luck? I will give you 2 minutes to find *one* specific case where a voter moves their second choice to first and wins." |
  | **Participants sulking over Stage 1 Payoff.** | Type C students hate Topic X winning and feel the "game" was rigged. | **Reframe:** "This dissatisfaction is the data. If you were happy, the theorem wouldn't matter. Your frustration is the empirical evidence of the theorem's premise. We are studying *why* you are frustrated." |
  | **Confusion between Rule vs. Outcome.** | Students attack the *outcome* (X is bad) rather than the *rule* (Plurality allows lying). | **Redirect:** "Don't argue that X is a bad topic. Argue that under *this rule*, a voter could have changed the outcome from X to Y by lying. Focus on the mechanism, not the policy." |
  | **Time Overrun in Stage 3.** | Designing rules is hard; students get stuck in weeds. | **Hard Stop:** At 0:55, blow a whistle. "Pens down. Even incomplete rules are vulnerable. Swap boards now." The pressure mimics the theoretical impossibility. |

  ## VII. What This Activity Cannot Show (Instructor Note)
  *   **The Proof:** The activity demonstrates the *search* for a strategy-proof rule, not the *impossibility* proof itself. You must explicitly state that their failure to find a rule is not a proof of non-existence, though the theorem confirms it.
  *   **Probabilistic Rules:** GS applies to deterministic rules. If students propose "Flip a coin," acknowledge this escapes GS but introduces other issues (ex-post efficiency), keeping the focus on the deterministic case.
  *   **Cardinal Utility:** GS assumes ordinal preferences. If students argue "But I *love* X way more than Y," remind them the rule only sees rankings, not intensity. This reinforces the **Unrestricted Domain** (ordinal) assumption.

  ## VIII. Post-Class Follow-Up
  In the next session, distribute the formal proof (or the intuitive sketch). Ask students to identify which step in the proof corresponds to the "Attack Phase" of Stage 3. This bridges the experiential gap to the formal mathematics.
