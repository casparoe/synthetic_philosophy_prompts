answer: |-
  This is one of the sharpest summaries of the *Protestant Ethic* stalemate I've read in a long time. You are right to sense that the empirical advancements (Becker, Woessmann, Blum, etc.) are talking past the theoretical holdouts, but your hypothesis that this is *just* a split between causal inference and interpretive explanation is slightly too clean. It captures the *methodological* divide, but it misses the deeper *ontological* disagreement that keeps the debate from resolving.

  Here is the diagnosis of the stall, followed by what actual progress would look like (and how to teach it).

  ### 1. The Diagnosis: It's an Operationalization Mismatch, Not Just a Causal One

  You asked if this is a verbal dispute about "cause," a substantive dispute about mechanisms, or an empirical data problem. It is primarily a **substantive dispute about operationalization**, disguised as a causal dispute.

  **The "Missing Y" Problem**
  The quantitative camp is testing whether Protestantism caused *economic growth* (GDP, city size, savings rates). Weber was arguing that Protestantism caused *a specific orientation toward economic action* (the spirit).
  *   **The Mismatch:** You can have capitalist *behavior* (profit-seeking, trade) without the capitalist *spirit* (rational, disciplined, reinvestment-oriented labor as a calling). Pre-modern adventurers, pirates, and court Jews had plenty of capitalist behavior but lacked the "spirit."
  *   **The Stall:** When econometricians show that Protestant regions grew faster, Weberians say, "That's not the spirit; that's just plunder or monopoly." When Weberians talk about the anxiety of predestination, econometricians say, "That's unmeasurable psychology; show me the regression."
  *   **Result:** They are measuring different dependent variables. One measures *wealth accumulation*; the other measures *rationalization of life conduct*.

  **The "Variable vs. Constitutive" Problem**
  This touches on your point about whether "cause" is the right relation.
  *   **The Quant View:** Culture is an independent variable ($X$). It can be toggled (Reformation happens) to see effects on $Y$.
  *   **The Interpretive View:** Culture is the water the fish swim in. It constitutes the *meaning* of the action. If you remove the meaning, the action isn't the same action anymore.
  *   **The Stall:** You cannot run a regression on "meaning." But if you ignore meaning, you aren't testing Weber's thesis; you're testing a materialist thesis with a religious control variable.

  ### 2. Is it Verbal or Substantive?

  It is **substantive**. If it were merely verbal, we could agree on definitions and move on. We can't, because the disagreement is about **how social reality hangs together.**

  *   **Side A (Institutionalists/Materialists):** Believes that incentives and institutions drive behavior. If Protestants worked harder, it was because they had better property rights (dissolved monasteries) or higher literacy (to read the Bible). The "meaning" is epiphenomenal.
  *   **Side B (Weberians):** Believes that meaning *creates* the incentive structure. The "calling" makes labor feel different *before* the institutional rewards kick in.

  The stalemate persists because neither side can definitively rule out the other's mechanism. The materialists can't prove that *no* Protestant felt religious anxiety driving their work ethic. The Weberians can't prove that the economic growth wouldn't have happened anyway due to broader European trends.

  ### 3. What Counts as Progress?

  You asked if we need a sharper typology, a split in research programs, or to accept the dual nature of the question. I argue for a **shift in the locus of inquiry.**

  The debate stalls because everyone is obsessed with the **Genesis** (Did Protestantism *start* capitalism?). This is historically impossible to settle definitively because the origins are murky and multi-causal.

  **Progress lies in studying the *Institutionalization* (How did the Spirit become the Iron Cage?).**
  Weber's real insight wasn't just that religion caused growth; it was that *charismatic/religious motivations can harden into secular structures.*
  *   **The Research Shift:** Instead of asking "Did Protestants make more money?", ask "How do religiously-derived norms survive after the religious belief fades?"
  *   **Why this works:** It bridges the gap. The quant folks can measure the persistence of norms (trust, work ethic) in post-religious societies (e.g., comparing secularized Protestant vs. secularized Catholic regions). The interpretive folks can analyze how the *language* of the "calling" secularized into the language of "career" and "professionalism."
  *   **Example:** Recent work on "cultural persistence" (e.g., by economists like Sascha Becker or sociologists like Philip Gorski) moves in this direction. It acknowledges the causal link but focuses on the *transmission mechanism* (family socialization, community networks) rather than the theological content.

  ### 4. Pedagogical Advice: How to Teach the Stall

  Since you teach intro sociology, you have a unique opportunity. Don't try to solve the debate for them; use the debate to teach them **sociological imagination.**

  **1. Teach the "Iron Cage" as the Resolution**
  Tell your students: "Weber knew he might be wrong about the history. He admitted that capitalism might have started for other reasons. His point was that once the 'spirit' was established, it locked into an 'iron cage' of bureaucratic rationality."
  *   *Why:* This validates the materialists (structures matter) and the Weberians (culture matters) by placing them in a temporal sequence. Culture creates the structure; the structure then sustains itself without the culture.

  **2. The "Counterfactual" Exercise**
  Ask students: "If we found a Catholic region in 1600 with the exact same work ethic and savings rates as a Calvinist region, does that disprove Weber?"
  *   *Goal:* This forces them to distinguish between *correlation* (the empirical claim) and *mechanism* (the interpretive claim). If they say "Yes, it disproves him," they are materialists. If they say "No, because the *meaning* of the work was different," they are Weberians.

  **3. Normalize the Stalemate**
  Explicitly tell them what you told me: "This debate has lasted 100 years not because sociologists are slow, but because the question sits on the fault line between two ways of knowing the social world."
  *   *Goal:* It prevents students from thinking sociology is "just opinions." It shows them that the discipline is defined by *how* we argue, not just *what* we conclude.

  ### Summary
  Your hypothesis is 80% there. The split is indeed between causal inference and interpretive explanation, but the fuel for the fire is that they are measuring different outcomes (Wealth vs. Rationality).

  **Don't split the research programs.** The tension is the most productive part of sociology. Instead, reframe the question for your students (and yourself): Move from **"Did religion cause capitalism?"** to **"How do moral visions become economic routines?"** That is a question both the econometricians and the interpretivists can actually answer, and it keeps Weber's core insight alive without getting bogged down in 16th-century GDP estimates.
