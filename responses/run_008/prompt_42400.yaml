answer: |-
  You have stumbled onto one of the oldest and thorniest problems in aesthetics, famously tackled by the philosopher Nelson Goodman in his book *Languages of Art*. You are wrestling with the difference between what an object *is* (its physical properties) and where it *came from* (its causal history).

  Here is the principle that unifies your verdicts, followed by the application to your new cases and the honest assessment of where your gut might be misleading you.

  ### The Principle: Causal Integrity

  **Value in collectible objects is a function of Causal Integrity. Causal Integrity requires that the object's history matches its representation, but the *weight* of that history depends on whether the medium is History-Bound or Structure-Bound.**

  To apply this, you must classify the object into one of two categories:

  1.  **History-Bound (Autographic):** The identity and value of the work are tied to the specific physical history of its production. (Paintings, wine, manuscripts, hand-crafted furniture).
      *   *Rule:* A copy is not the work, even if indistinguishable. Provenance is part of the product.
  2.  **Structure-Bound (Allographic):** The identity of the work is tied to a pattern, notation, or structure, not the specific physical instance. (Music, literature, digital files, theater scripts).
      *   *Rule:* Any instance that correctly instantiates the structure *is* the work. Provenance matters less than fidelity to the pattern.

  **The Fraud Clause:** In History-Bound media, lying about the causal history (forgery, topped-up wine) destroys Causal Integrity, collapsing value even if the sensory experience is identical.
  **The Continuity Clause:** In History-Bound media, physical replacement of parts (restoration) does not break Causal Integrity as long as there is an unbroken spatiotemporal chain of the *same object* being preserved.
  **The Agency Clause:** In History-Bound media, work produced by assistants counts as "by the Master" if the Master authorized the design and supervised the execution (Workshop), because the causal chain flows through the Master's intent.

  ---

  ### How This Principle Judges Your Cases

  *   **Van Meegeren (Then):** Violates the **Fraud Clause**. It was History-Bound (painting), but the history was lied about. Your gut was right: the value collapsed because the link between the object and its claimed origin was severed.
  *   **Van Meegeren (Now):** Causal Integrity is **restored**. It is no longer a "Fake Vermeer"; it is an "Authentic Van Meegeren." The deception is gone, so the fraud penalty vanishes. It gains value as a historical curiosity, though not as a Vermeer.
  *   **Museum Print / Honest Copy:** Causal Integrity is **intact**. The history is told truthfully ("this is a print," "this is a copy"). They are worth less because they lack the *primary* causal history (the artist's hand), but there is no moral or aesthetic collapse.
  *   **Heavily Restored Master:** Protected by the **Continuity Clause**. It is the same specific object that the master touched, even if the material has changed. Your intuition that 30% vs. 0% feels arbitrary is correct; the principle doesn't care about percentage, it cares about the *unbroken chain of existence*. If the painting was destroyed and then repainted from scratch, it's a copy (0% integrity). If it was patched over centuries, it's the original (high integrity).
  *   **Renaissance Workshop:** Protected by the **Agency Clause**. The Master is the causal source of the *design and authority*, even if not the brushstrokes. It is an authorized instance of the Master's brand.
  *   **Cover Song:** This is **Structure-Bound**. The work is the composition, not the specific sound waves. As long as the structure is honored, Causal Integrity is maintained. This explains why you feel less of a value gap here than with painting copies.
  *   **Topped-Up Wine:** **History-Bound**. A 1982 Bordeaux is defined by its harvest year. Topping it up lies about the causal history of the liquid. Fraud Clause applies.

  ---

  ### Application to Your Two New Cases

  **Case 1: The Digital Artwork (Original File vs. Bit-Identical Copy)**
  *   **Verdict:** They are equal in value *unless* a social contract (like an NFT or certificate) artificially makes them History-Bound.
  *   **Reasoning:** Digital files are inherently **Structure-Bound**. A copy is mathematically identical to the original; there is no "brushstroke" history to trace. Under Causal Integrity, they are the same work.
  *   **Caveat:** If the artist "mints" one as the official token, they are using a blockchain to impose **History-Bound** status on a Structure-Bound medium. In that case, the minted file has Causal Integrity (authorized token) and the copy does not. Without that layer, your gut should tell you they are worth the same.

  **Case 2: Living Artist Painting in the Style of a Dead Master (Honest Labeling)**
  *   **Verdict:** This is legitimate, worth less than the Dead Master, but more than a forgery.
  *   **Reasoning:** This satisfies the **Fraud Clause** because there is no deception. It is an **Authentic [Living Artist]** painting. It is History-Bound, so it has value based on its true causal history (the Living Artist's hand). It lacks the value of the Dead Master because it lacks that specific causal chain, but it suffers no penalty for fraud. It is a "Pastiche," not a Forgery.

  ---

  ### The Verdict You Must Sacrifice

  You asked me to be honest about which of your verdicts the principle cannot save. There is one you need to let go of, or at least refine:

  **The Verdict:** *"Van Meegeren's paintings got worse as art when the deception came out, even though nothing on the canvas changed."*

  **The Correction:** The paintings did not get worse *as art*. They got worse *as investments* and *as historical documents*.
  If you hang a Van Meegeren next to a Vermeer and turn off the lights, the aesthetic experience is (by your admission) identical. If the art *itself* had gotten worse, the aesthetic experience would have degraded. It didn't. What degraded was your **relationship** to the object.

  **Why you should give this up:** Holding that the art "got worse" implies that aesthetic value is magically contained in the history rather than the object. The principle suggests that **aesthetic value is perceptual, but market/historical value is causal.** When the deception was exposed, the *historical value* plummeted because the story was broken. The *aesthetic value* remained, but your ability to enjoy it was poisoned by the knowledge of the lie (the "Fraud Clause" psychological effect).

  Once the lie is known (the "Famous Forgery" status), the psychological poison clears, and the aesthetic value can be enjoyed again, just under a different category. If you insist the art *itself* degraded, you are arguing for a kind of magic that the rest of your intuitions (like the honest copy case) contradict.

  ### A Note on the Restoration Intuition
  You mentioned the 30% vs. 0% distinction feels arbitrary. The principle demands you accept that **Identity is Historical, not Material.**
  If you cannot accept that a ship with all replaced planks is the same ship (Ship of Theseus), you will never be comfortable with the "Heavily Restored" verdict. You have to choose: either you value the *matter* (in which case the restored painting is mostly fake) or you value the *history* (in which case the restored painting is real). Your gut says "real," so you must accept the historical continuity argument, even if the material math feels arbitrary.

  ### Final Advice on the Watercolor
  Keep the watercolor.
  Under the Principle of Causal Integrity, your great-aunt's painting has **provenance**. It is an "Authentic Family Heirloom." Its value is not in being a "Mid-Century Masterpiece" (which would be a lie), but in being a "Sixty-Year Family Artifact."
  The appraiser valued it as a commodity in the art market (History-Bound Art). You value it as a History-Bound Memory. The Causal Integrity is intact: you know what it is, you know where it came from, and no one is deceived. That makes it priceless *to you*, which is the only valuation that matters for something hanging on your wall.
