answer: |-
  Here is a complete package for your tutorial session. It includes the quiz handout, a scoring key for the students, and an instructor guide for the debrief (including the requested honesty about limitations).

  ### Session Plan & Timing (50 Minutes)
  *   **0:00–0:05:** Intro & Handout distribution.
  *   **0:05–0:15:** Students take the quiz (silent reading/thinking).
  *   **0:15–0:20:** Students calculate scores & identify their "Profile."
  *   **0:20–0:50:** Debrief & Discussion (using the Instructor Guide below).

  ---

  # HANDOUT: The "What Is Art?" Intuition Quiz

  **Instructions:** Read each case. Choose the **one** answer that best matches your immediate gut reaction. Don't overthink it based on what you think a philosopher *should* say; answer based on what *you* actually believe.

  **1. The Perfect Forgery**
  A painting is chemically indistinguishable from a famous Van Gogh. It fooled experts for 50 years. It is now revealed as a forgery made last year.
  *   **A.** It is still art, and just as good as the original. The visual experience is identical.
  *   **B.** It is art, but it is now "lesser" or damaged because it lacks the right history.
  *   **C.** It is not art at all. It is a fake, and art requires authentic genesis.

  **2. The Hardware Store Urinal**
  Consider a standard porcelain urinal. One is sitting in a hardware store; an identical one is signed "R. Mutt" and sitting in a museum.
  *   **A.** Both can be art if you look at them with an aesthetic attitude (shapes, curves, white porcelain).
  *   **B.** Only the museum one is art. The context confers the status.
  *   **C.** Neither is art. One is plumbing, the other is a prank.

  **3. The Bird's Nest**
  You find a beautifully woven bird's nest in the woods. You bring it inside and put it on a pedestal.
  *   **A.** It was always art; nature made it, and it is beautiful.
  *   **B.** It becomes art only when you pedestal it and present it as such.
  *   **C.** It is never art. Birds don't have artistic intentions.

  **4. The Rotting Meat**
  An artist displays a slab of rotting beef in a gallery. It smells bad. The point is to disgust the viewer and make them confront mortality.
  *   **A.** This cannot be art. Art must provide some form of aesthetic pleasure or unity.
  *   **B.** This is art. It succeeds because it challenges us, even if it's unpleasant.
  *   **C.** It is only art if the "artworld" (critics, curators) accepts it as a serious statement.

  **5. The AI Winner**
  A person types "cyberpunk city" into an AI generator, clicks through 40 variations, and submits the best one to a photo contest. It wins.
  *   **A.** It is art. The image exists and has aesthetic qualities.
  *   **B.** It is not art. There was no human creative agency, only a prompt.
  *   **C.** It is art because the contest rules and the community accepted it as an entry.

  **6. The Certificate**
  A conceptual artist sells a sheet of paper. The paper says: "The buyer is authorized to draw a line on the wall." The paper is framed and sold for $10,000. The line is never drawn.
  *   **A.** This is a scam, not art. There is nothing to perceive.
  *   **B.** The paper is the art. It is a contract that functions within the art market.
  *   **C.** The *idea* is the art. The physical paper is just documentation.

  **7. The Boring Box**
  An artist puts a plain, unpainted wooden box in a gallery. It is not beautiful. It is not interesting to look at. The artist says it represents "banality."
  *   **A.** If it has no aesthetic merit, it is not art.
  *   **B.** It is art. Art can be about ideas, not just beauty.
  *   **C.** Whether it is art depends on whether it connects to earlier art history (e.g., minimalism).

  **8. The Alien Artifact**
  Aliens visit. They leave behind a complex, shimmering object. They did not make it for us; they don't even have a concept of "art." We put it in a museum and call it "Art."
  *   **A.** It becomes art because we are treating it as art. The name makes it so.
  *   **B.** It is not art. They didn't make it with artistic intention.
  *   **C.** "Art" is a human concept; applying it here is a category mistake.

  ---

  # STUDENT SCORING KEY

  **Step 1: Tally your answers.**
  Count how many **A**s, **B**s, and **C**s you selected.

  **Step 2: Find your dominant letter.**

  *   **Mostly A's: The Aesthetic Functionalist**
      *   **Your View:** Art is defined by its ability to provide a specific kind of experience (beauty, pleasure, formal unity).
      *   **Your Commitment:** If an object doesn't offer an aesthetic experience, it isn't art. If a forgery looks the same, it *is* the same art.
      *   **Philosophical Kin:** Bell, Fry, Kant (sort of).

  *   **Mostly B's: The Contextualist (Institutional/Historical)**
      *   **Your View:** Art is defined by history, intention, and context. An object becomes art because of *what was done to it* or *where it is placed*, not just how it looks.
      *   **Your Commitment:** A urinal is art in a museum but not a store. A forgery is lesser because its history is fake.
      *   **Philosophical Kin:** Dickie (Institutional), Danto/Levinson (Historical).

  *   **Mostly C's: The Skeptic / Anti-Essentialist**
      *   **Your View:** You are wary of hard definitions. You tend to reject cases that don't fit the "standard" model or you rely heavily on external validation (the "artworld").
      *   **Your Commitment:** You likely believe "Art" is an open concept that cannot be defined by necessary conditions.
      *   **Philosophical Kin:** Weitz, Kennick.

  *   **Mixed / No Clear Majority: The Cluster Pluralist**
      *   **Your View:** You picked different answers because different cases require different criteria.
      *   **Your Commitment:** There is no single definition. Art has a "cluster" of properties (beauty, intent, context). An object needs *enough* of them, but no single one is strictly necessary.
      *   **Philosophical Kin:** Gaut, Bundick.

  ---

  # INSTRUCTOR GUIDE (For Your Eyes Only)

  ### 1. Mapping the Cases to Theory
  You asked to build from the case space first. Here is the logic used to construct the options, which you can use to explain *why* the quiz sorts them this way.

  *   **Q1 (Forgery):** Separates **Aesthetic** (perceptual indiscernibility implies artistic identity) from **Historical** (genesis matters). *Note: Institutionalists might split here depending on whether the museum *knows* it's a fake.*
  *   **Q2 (Urinal) & Q3 (Nest):** Separates **Aesthetic** (properties reside in the object) from **Institutional/Intentional** (status is conferred by context/agent).
  *   **Q4 (Meat) & Q7 (Box):** The "Necessity Test." Separates **Aesthetic Functionalism** (beauty/pleasure is *necessary*) from **Cluster/Contextual** (ideas can replace beauty).
  *   **Q5 (AI):** Tests **Human Agency**. Essential for Historical/Intentional definitions; irrelevant for pure Aesthetic definitions.
  *   **Q6 (Certificate):** Tests **Dematerialization**. If art must be perceived (Aesthetic), this fails. If art is a status/contract (Institutional), this passes.
  *   **Q8 (Alien):** Tests **Radical Nominalism**. Option A suggests "Art" is just a label we slap on things (Nominalism). Option B suggests Art requires a specific mental state in the creator (Realism/Intentionalism).

  ### 2. Honest Limitations (Flagging Indistinguishability)
  Be prepared to admit these two blurs to the class during the debrief. This models good philosophical practice.

  *   **Aesthetic Functionalism vs. Cluster Theory:**
      *   *The Problem:* Unless a student picks "Beauty is *necessary*" explicitly, a Cluster theorist might answer like an Aesthetic Functionalist just because they *like* beauty.
      *   *The Fix:* Look at Q4 (Meat) and Q7 (Box). If they said "Not Art" to both, they are likely Aesthetic Functionalists. If they said "Is Art" to one but not the other, they are likely Cluster theorists.
      *   *Tell the class:* "If you scored Mostly A's, you might actually be a Cluster theorist who just values aesthetics highly. The quiz can't perfectly separate 'Beauty is required' from 'Beauty is just one of many ways.'"

  *   **Institutional vs. Historical:**
      *   *The Problem:* Both are "Contextualists." They usually agree on the Urinal and the Nest.
      *   *The Fix:* Look at Q1 (Forgery).
          *   **Institutional:** If the museum displays it as art, it *is* art (status conferral).
          *   **Historical:** Even if displayed, if the lineage is broken (forgery), it lacks the correct relation to art history.
      *   *Tell the class:* "If you scored Mostly B's, look at Q1. If you said the forgery is *still art* (A), you lean Institutional. If you said it's *lesser or not art* (B/C), you lean Historical."

  ### 3. Coherent but Undefended Patterns
  Watch for students who produce this specific pattern:
  *   **Pattern:** Says the Bird's Nest is *always* art (Q3-A), but the Rotting Meat is *not* art (Q4-A), and the AI Image *is* art (Q5-A).
  *   **Analysis:** This is **Radical Aesthetic Subjectivism**. They believe "If I find it beautiful, it's art," but "If I find it ugly, it's not."
  *   **Status:** Philosophically unpopular because it makes the word "art" useless (it just means "I like this"). It collapses the distinction between "art" and "pretty object." Use this to prompt discussion: *Is there a difference between a pretty sunset and a painting of a sunset?*

  ### 4. Running the Debrief (25-30 Minutes)
  1.  **Show of Hands:** Ask for a show of hands for A, B, C, and Mixed. (Usually, B and Mixed dominate in contemporary groups).
  2.  **The "Hard Case" Challenge:** Pick the case where the room is most split (usually Q1 Forgery or Q5 AI). Ask an 'A' and a 'B' to justify their answer *without* using the word "art." (Forces them to reveal their underlying criteria).
  3.  **The Definition Trap:** Ask the Anti-Essentialists (C's): "If there is no definition, how do we decide funding for the NEA? Or copyright?" This pressures the Skeptic view to admit we need *some* working definition.
  4.  **Transition to Theory:** "Next week we read [Author]. If you were Mostly B's, you're going to feel at home. If you were Mostly A's, you're going to be frustrated. That frustration is where the philosophy happens."

  ### 5. Timing Note
  The quiz is 8 questions. At a normal reading pace, this takes 7–8 minutes. Allow 10 to let them think. Scoring takes 3 minutes. This leaves you a solid 30 minutes for discussion. If discussion lags, use the "Undefended Patterns" section above to stir trouble.
