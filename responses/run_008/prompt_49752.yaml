answer: |-
  Your gut is spot on. This is a classic "parity argument," and while it looks seductive because metaphysicians love symmetry, it commits a category mistake in **Premise (3)**.

  You can tell your friend that **Premise (3) is false**, and rejecting it costs the perdurantist nothing. In fact, the most famous perdurantist in history (David Lewis) explicitly rejected the conclusion of (3) while maintaining the truth of (1).

  Here is the diagnosis you need to dismantle the argument in your study group.

  ### 1. The Broken Step: Premise (3)
  Premise (3) claims: *"If having a property at a time works by some part of the thing having that property, then by the same reasoning, having a property in a counterfactual situation works by a part having it too."*

  This assumes that **time** and **modality** are ontologically symmetrical in a way that licenses the same mereological (part-whole) solution. They are not.

  **Why it looked innocent:**
  Metaphysicians often draw analogies between time and modality (e.g., "Actualism is to Modality what Presentism is to Time"). It feels like theoretical virtue to have a uniform explanation for property instantiation. If parts solve it for time, why not worlds?

  **Why it is false:**
  Perdurantism is a theory of **persistence**, not a theory of **modality**. The criterion for something being a *part* of a four-dimensional object is **spatiotemporal continuity**.
  *   My temporal part at 2:00 PM and my temporal part at 3:00 PM are parts of the same whole because they are spatiotemporally related within the same actual world. They are causally connected and occupy regions of the same spacetime manifold.
  *   A "modal part" in a counterfactual world is **not** spatiotemporally related to the actual mug. By definition (especially in Lewisian Modal Realism), possible worlds are spatiotemporally isolated. There is no spatiotemporal distance between the actual mug and the blue mug in world $W_2$; they share no spacetime.

  Therefore, the "modal part" fails the basic mereological requirement to be a *part* of the actual object. You can't have a whole composed of parts that share no spatiotemporal relation.

  ### 2. The "Lewis Card" (Empirical Refutation)
  Your friend's Premise (5) says: *"Even perdurantists who are full-on modal realists... say the guy at the other world is my counterpart... not a literal part of me."*

  Your friend thinks this supports their dilemma. Actually, it **refutes** their dilemma.

  David Lewis is the arch-perdurantist. He believes objects are worms made of temporal parts. He is also a Modal Realist (believes possible worlds are concrete). **If anyone were going to accept modal parts, it would be him.**

  But Lewis explicitly argues that objects are **world-bound**. The actual mug is *only* in the actual world. It does not extend into other worlds. The blue mug in the other world is a *counterpart*, not a part.
  *   **Lewis's View:** Perdurantism (Temporal Parts) + Counterpart Theory (No Modal Parts).
  *   **Your Friend's Claim:** Perdurantism *entails* Modal Parts.

  Since Lewis exists and holds this coherent position, your friend's claim that perdurantism *requires* modal parts is demonstrably false. The machinery of temporal parts was never designed to carry modal load.

  ### 3. Answering the "Special Pleading" Charge
  Your friend will say: *"You liked parts when they solved your problem (time), you dislike them when they solve mine (modality). That's special pleading."*

  **The Response:**
  It is not special pleading to limit a theory to its domain of application.
  *   **Analogy:** General Relativity explains gravity using the curvature of spacetime. It does not explain electromagnetism. If someone said, "If curvature explains gravity, it should explain charge! If you say charge isn't curvature, you're special pleading!" that would be a mistake. Gravity and charge are different phenomena.
  *   **Application:** Temporary intrinsics are a problem about **change through time**. Contingent intrinsics are a problem about **variation across possibilities**. Perdurantism was built specifically to solve the former by analyzing persistence as a relation between temporal parts. It was never sold as a unified theory of all property instantiation.

  Rejecting (3) doesn't undermine (1). The solution to temporary intrinsics relies on the fact that the temporal parts exist in the **same** world and are unified by immanent causation. That unity condition is absent in the modal case.

  ### 4. What does rejecting (3) cost?
  **Nothing.**
  The perdurantist loses no explanatory power regarding persistence.
  *   **Temporary Intrinsics:** Solved by temporal parts (I am sitting because my current temporal part is sitting).
  *   **Contingent Intrinsics:** Solved by Counterpart Theory (I am red, but my counterpart is blue).

  In fact, keeping them separate is *better*. If you accept modal parts, you run into the "Problem of the Many" on steroids. If the actual mug has modal parts, is the sum of the red mug + the blue mug + the green mug one big object? If so, is that big object red? Blue? Both? You recreate the Problem of Temporary Intrinsics at the modal level (The "Problem of Contingent Intrinsics"). Perdurantists avoid this by keeping the object world-bound.

  ### Summary for your Study Group
  1.  **Reject Premise (3).** The analogy between time and modality breaks at the level of parthood. Parts require spatiotemporal relatedness; trans-world entities do not have this.
  2.  **Cite Lewis.** The biggest perdurantist rejects modal parts. This proves perdurantism does not entail modal parts.
  3.  **Defend Domain Specificity.** It isn't special pleading to say a theory of persistence doesn't govern modal metaphysics.
  4.  **Hold (5).** Your intuition to keep (5) is correct. Almost everyone rejects modal parts (even Lewis), and perdurantists are no exception.

  Your friend's argument is a "modal collapse" of perdurantism that looks rigorous but ignores the mereological constraints that make perdurantism work in the first place. You can keep your perdurantism without buying into modal parts.
