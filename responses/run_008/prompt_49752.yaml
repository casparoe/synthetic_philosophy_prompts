      *   Premise (1) is a standard statement of perdurantism (worm theory) regarding temporary intrinsics.
      *   Premise (2) is a standard modal intuition (contingency of properties).
      *   Premise (3) is the critical inference: "If having a property at a time works by some part... then by the same reasoning, having a property in a counterfactual situation works by a part too."
      *   Premise (5) claims that even modal realists (like David Lewis) reject modal parts in favor of counterparts.
      *   Conclusion (6) sets up the dilemma.

  3.  **Evaluate the Premises & Inferences:**
      *   *Premise (1):* Accurate for perdurantism.
      *   *Premise (2):* Accurate for modal contingentism.
      *   *Premise (3):* **This is the weak link.** It assumes a structural isomorphism between time and modality that perdurantists are not committed to. Perdurantism is a theory of *persistence through time*, not *existence across worlds*.
      *   *Premise (5):* Mostly accurate. David Lewis (the biggest perdurantist + modal realist) explicitly rejects transworld identity (and thus transworld parts) in favor of Counterpart Theory. He treats worlds as spatiotemporally isolated, not as dimensions of a single object in the same way time is.
      *   *Conclusion (6):* Follows if (3) is accepted. If (3) is rejected, the dilemma dissolves.

  4.  **Identify the Philosophical Issue:**
      *   The argument relies on the **Time-Modality Analogy**.
      *   While Lewis and others often draw parallels between time and modality (modal realism treats worlds like distant times), the *ontology of the object* differs.
      *   Perdurantism solves the Problem of Temporary Intrinsics (Lewis's main motivation).
      *   The "Problem of Contingent Intrinsics" is different.
      *   Key distinction: **Actualism vs. Modal Realism** and **Identity vs. Counterparts**.
      *   Even for a Lewisian, the mug *itself* is world-bound. It does not extend across worlds. Its *counterparts* do. Therefore, the mug does not have modal parts.
      *   Why does the analogy fail? Because time is internal to the actual world's causal/spatiotemporal framework, while possible worlds (for Lewis) are causally isolated. For an Actualist, possible worlds aren't concrete entities at all, so "parts" located there make no sense.

  5.  **Formulate the Diagnosis:**
      *   **Step to Reject:** Premise (3).
      *   **Why it looked innocent:** Because metaphysicians (especially Lewisians) love drawing analogies between time and modality. "Actualism" vs. "Presentism" parallels are common. It feels like "uniformity of explanation."
      *   **Why it's false:** Perdurantism is a thesis about *persistence* (continuing to exist through time). It is *not* a thesis about *transworld identity* or modal metaphysics. One can be a perdurantist about time and an endurantist about modality (or a counterpart theorist).
      *   **The Lewisian Angle:** David Lewis is the champion of perdurantism *and* modal realism. If anyone would accept modal parts, it's him. But he *doesn't*. He explicitly argues objects are world-bound. This is a decisive counter-example to the friend's claim that "nobody accepts this... even perdurantists." Lewis *is* a perdurantist, and he rejects modal parts.
      *   **The Cost:** Rejecting (3) costs the perdurantist nothing regarding their original motivation (temporary intrinsics). They never promised a unified theory of *all* property instantiation, only persistence through time.

  6.  **Drafting the Response:**
      *   *Validate the User:* Your gut is right. The argument is a known "parity argument" but it fails on specific technical grounds.
