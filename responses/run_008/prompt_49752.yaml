          4.  Conclusion: Actual mug has modal parts in other worlds.
          5.  Observation: Nobody accepts modal parts (even Lewis uses counterparts, not parts).
          6.  Dilemma: Accept modal parts (insane) OR admit the "part" strategy doesn't generalize (undermines temporal parts).
      *   **User's Intuition:** Something slides between (3) and (4). The perdurantist only signed up for *time*, not *modality*.
