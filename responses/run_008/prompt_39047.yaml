answer: |-
  **MEMORANDUM**

  **TO:** Bar Admissions Committee
  **FROM:** Philosophical Consultant (Virtue Ethics and Situationism)
  **SUBJECT:** Reconstruction of Implicit Character Theory in Admissions Review

  **Introduction**

  The tension you identify is genuine. The bar admissions process operates on a folk-psychological model of character that assumes stability, while situationist social psychology suggests behavior is largely a function of specific contextual variables. However, declaring the practice obsolete based on textbook situationism would be premature. The practice is more nuanced than the "global trait" model that situationism typically targets. To advise you properly, I have reconstructed the implicit theory driving your review, distinguishing between what is metaphysically necessary and what is merely convenient rhetoric.

  **Reconstructing the Implicit Theory**

  In analyzing your procedures, I considered three candidate reconstructions. The first is **Robust Global Virtue Theory**, which posits that applicants possess cross-situational traits (e.g., "Honesty") that causally determine behavior regardless of context. This fits your language about "settled character" but fails to explain why you excuse single lapses due to situational pressure; a robust trait should withstand pressure. The second is **Pure Actuarialism**, which denies traits entirely and treats "character" as a shorthand for statistical base rates of past behavior. This fits your reliance on records but fails to explain why you seek *professional* references specifically, rather than just any behavioral data.

  The third, and most accurate reconstruction, is **Local Stability Theory**. This model presupposes that while global traits may be weak, individuals develop stable dispositional patterns within specific ecological niches, particularly professional roles. You are not betting on a saint; you are betting on habituation. You assume that repeated performance in professional or quasi-professional contexts (law school, prior employment) creates a "local trait" of compliance and honesty specific to that role. This explains why you weigh patterns across different contexts heavily (it shows the local trait is robust) while excusing single episodes under pressure (acknowledging that even local traits have breaking points). This theory fits the practice best because it accommodates the situational data you already consider without abandoning the predictive utility of past conduct.

  **Strict Requirements vs. Compatible Claims**

  Strictly speaking, your practice requires only two claims to remain functional. First, past behavior in *relevantly similar* contexts must have predictive validity for future behavior in those same contexts. Second, professional socialization must be capable of stabilizing conduct, meaning that exposure to professional norms alters future probability of compliance. If either is false, the review is pointless.

  Conversely, several popular glosses are compatible but not required. You do not need to believe in Aristotelian *hexis* (settled states of being) that are immutable after adulthood. You do not need to believe that "character" explains behavior across all domains of life (e.g., that honesty in billing predicts honesty in marriage). These are metaphysical luxuries your process can survive without.

  **The Verdict on Trait Skepticism**

  Which version of situationism sinks the ship? Skepticism about *global* traits is harmless; your practice does not depend on a lawyer being honest at home to be honest in court. Skepticism about *cross-situational* consistency is also manageable, provided the "situations" are defined narrowly as professional contexts. The fatal claim is the strong situationist thesis that situational variables *swamp* individual differences in predictive power. If the specific circumstances of a legal case (e.g., client pressure, billing ambiguity) determine behavior 95% of the time regardless of the lawyer's history, then past conduct is irrelevant. Your practice survives weak situationism (traits are local) but collapses under strong situationism (situations are all-consuming).

  **Pattern vs. Single Episode and Sentencing Coherence**

  The distinction between a pattern of misconduct and a single episode is primarily an **evidence claim** regarding base rates, though it implies a weak character claim about the capacity for habituation. A single episode is statistically noisy; a pattern suggests a stable local disposition. This coheres with your habit of excusing situationally pressured lapses. You are not contradicting yourselves; you are distinguishing between a signal (pattern) and noise (anomalous pressure).

  Regarding the legal system's dual approach, licensing on character and sentencing on circumstances are not incompatible. Licensing is **prospective risk management**; it asks, "What is the probability of future harm?" Sentencing is **retrospective culpability assessment**; it asks, "How blameworthy was this past act?" Both can acknowledge that situations influence behavior while maintaining that some individuals are riskier than others. If anything, licensing should be *more* sensitive to situationism than sentencing, because risk management allows for environmental controls (monitoring) that retributive justice does not.

  **Reform and Survival if Traits are Illusory**

  If strong situationism is true and global/local traits are close to illusory, significant changes are required. You would need to shift from gatekeeping based on *who the lawyer is* to regulating *where the lawyer works*. This implies probationary licensing with mandatory supervision, rather than permanent denial. It suggests focusing on firm-level compliance systems rather than individual moral fitness. You might also narrow inquiries to direct professional misconduct, removing academic or personal history that lacks contextual similarity.

  However, much would survive. The inquiry into past conduct remains useful as behavioral data, even without trait inference. Reference letters survive if treated as reports of observed behavior rather than attestations of virtue. The core goal—public protection—remains valid, even if the mechanism shifts from selecting "good people" to managing "risky situations."

  **Conclusion**

  Your practice is more resilient than the situationist critique suggests, provided you abandon the rhetoric of global virtue. You are not judging souls; you are assessing risk based on local habituation. As long as past professional behavior predicts future professional behavior, your committee has a job to do.

