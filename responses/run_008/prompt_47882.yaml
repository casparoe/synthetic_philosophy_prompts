  The verdicts regrouped

  Your verdicts cluster into three distinct spheres of authority. First, the **Intimate Sphere** (homeowner, dinner party) grants near-absolute exclusion rights, grounded in personal autonomy. Second, the **Associational Sphere** (country club) reveals a limit: private status does not license discrimination on immutable traits like gender. Third, the **Political Sphere** (states) is most complex. Here, exclusion is permitted for **security and capacity** (criminals, ecological limits) but forbidden for **economic protectionism or identity** (wages, ethnicity). Finally, a **Historical Justice** constraint overrides standard sovereignty: states cannot exclude those they displaced (colonizers), and perhaps cannot create second-class members (guest workers). The organizing logic isn't public versus private, but rather whether the exclusion violates duties of non-discrimination, historical rectification, or basic necessity versus mere preference.

  Candidate principles

  **Principle A: The Non-Domination Constraint.** Exclusion is impermissible when it reinforces systemic subordination or discrimination based on immutable characteristics, regardless of public or private status. The wrong-making feature is *status-based harm*. This explains the country club verdict (gender discrimination) and state ethnic exclusion. It permits ecological caps because those are neutral criteria, not status-based. It implies wage protection is wrong if it relies on exploiting outsider vulnerability to maintain insider privilege. To generate verdicts on new cases, Principle A requires examining the social meaning of the exclusion. Does excluding this group reinforce a hierarchy? Principle A leans toward harm over associative freedom.

  **Principle B: The Capacity and Rectification Principle.** States may exclude only to preserve functional capacity (ecology, security) or when no historical debt exists. The wrong-making feature is *disproportionate burden-shifting*. This justifies excluding violent criminals (security threat) and capping immigration on islands (physical limits), but forbids excluding colonized peoples (historical debt) or protecting wages at the cost of outsiders' subsistence. Sovereignty is conditional on not harming those to whom you owe rectification. This requires empirical assessment of capacity. Is the ecological limit real or pretextual?

  **Principle C: The Membership Integrity Principle.** If a state admits individuals for labor, it must offer a path to full membership. The wrong-making feature is *caste creation*. This addresses the guest-worker dilemma: exclusion is permissible, but exploitative inclusion is not. You cannot harvest labor without sharing political rights.

  Together, these suggest a hybrid view: sovereignty is real but constrained by anti-discrimination norms, historical justice, and a duty to avoid creating permanent underclasses. The core tension lies in distinguishing legitimate capacity constraints from illegitimate economic protectionism. Principle A handles the club; Principle B handles the island and colonizer; Principle C handles the guest workers. The difficulty lies in weighing economic capacity against moral obligation. Is wage protection a capacity issue or a preference? Your verdicts suggest the latter, implying a duty to absorb economic competition unless it threatens subsistence. This raises the bar for state exclusion significantly above standard realism. It treats borders not as property lines but as membranes regulating flow based on justice, not just interest. This framework demands rigorous scrutiny of state justifications. It prevents states from hiding behind sovereignty to mask discrimination. The wrong-making feature in A is *equality violation*. In B, it is *unjustified harm*. In C, it is *exploitation*.

  The hard pairs

  The **Country Club versus Island State** pair tests the public/private divide. Principle A (Non-Domination) handles this well: the club's exclusion is status-based harm, while the island's is neutral capacity. The cost is complexity in defining "status." Is "non-member" a status? No, but "woman" is. The principle requires nuanced sociological analysis of every exclusion. If we apply this strictly, many private associations (religious schools, single-sex clubs) might fail unless they prove no systemic harm. This overturns the intuition that "private" equals "free."

  The **Criminal versus Wage** pair tests security versus economics. Principle B (Capacity) distinguishes them: violence threatens physical security; wage competition threatens economic preference. The cost is drawing the line. Does "violent crime" include non-violent threats to order? Does "wage protection" include preventing welfare state collapse? Your verdicts imply states can protect security but not standards of living. This overturns much current policy. Most states claim wage protection as a legitimate aim. Accepting your verdict requires denying states the right to protect the economic interests of current citizens against non-violent outsiders. This is a heavy lift politically.

  The **Guest Worker** case is hardest. Principle C (Membership Integrity) says exclusion is better than caste. But this creates a dilemma: if you can't exclude (due to need) and can't exploit (due to rights), you must integrate. The cost is reduced flexibility. States might admit fewer workers to avoid granting citizenship. This might help or hurt migrants depending on whether exclusion or exploitation is worse. Your flip-flop suggests you sense this trade-off. A coherent principle forces a choice: either open borders with rights or closed borders without exploitation. You cannot have temporary, rightless labor. This demands sacrificing either the state's economic convenience or the migrant's immediate access to income. If you choose rights, you might reduce total migration. If you choose access, you tolerate injustice. You must decide which harm is greater. For the Club/Island pair, the cost is that "private" loses its magic shield. If a book club excludes based on race, Principle A condemns it. This aligns with your verdict but extends beyond it.

  Against the standard positions

  The **Freedom-of-Association (FoA)** view supports your verdicts on homeowners, dinner parties, and perhaps the country club (if viewed as intimate). However, it must overturn your verdicts on wage protection and ethnic exclusion if it treats states as large clubs. It struggles with the colonizer case, as FoA rarely accounts for historical debt. To patch it, FoA must accept that association rights diminish when power disparities create domination. It would need to distinguish between "intimate association" (protected) and "commercial/public association" (regulated). This saves the club verdict but threatens the state's right to exclude for wages.

  The **Open-Borders (OB)** view aligns with your verdicts on wages, ethnicity, and colonizers. However, it must overturn your verdicts on the island state (ecology) and criminals. OB typically allows exclusion only for immediate physical threat, not ecological capacity. To patch it, OB must accept "capacity constraints" as legitimate, which risks opening the door to economic protectionism disguised as ecology. It must distinguish between "physical limits" and "economic preferences."

  Neither fits cleanly. FoA is too permissive on state exclusion; OB is too restrictive on state capacity. Your view is a middle ground: sovereignty exists but is morally conditioned. You keep the state's right to exist (against OB) but deny its right to discriminate or ignore history (against FoA). The patch requires accepting that sovereignty is not a right to property, but a trusteeship. This hybrid view is more demanding than FoA and more state-friendly than OB. It requires both sides to concede ground: FoA accepts historical justice; OB accepts physical limits. Patching FoA weakens its core libertarian appeal; patching OB weakens its humanitarian urgency.

  What I must give up

  You must give up the flip-flop on **Guest Workers (Verdict 9)**. You cannot claim exclusion is wrong *and* that exploitative terms are wrong without implying borders must be open with full rights. If you prioritize rights, you accept reduced migration. If you prioritize access, you tolerate exploitation. I predict you will find this counterintuitive: **A wealthy state must admit refugees even if it threatens the welfare state's sustainability.** Your principles (History/Capacity) suggest historical debt trumps economic capacity. This means a colonizer state might have to absorb populations even if it lowers domestic living standards significantly. This goes beyond "wage protection" into "welfare protection." Your intuition on the island (ecology) might conflict here. If ecology limits trump need, does history trump economics? You must choose: is historical justice a capacity exception or an override?
