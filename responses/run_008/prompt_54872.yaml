      *   *Confidence Check:* I am highly confident Leibniz holds the distinction between moral and metaphysical necessity. I am less confident that modern readers find it coherent. I need to flag this.

  6.  **Writing the Essay (incorporating constraints):**
      *   *Tone:* Academic, rigorous, direct.
      *   *Formatting:* No citations. Explicit confidence markers (e.g., "It is textually secure that...", "This is a matter of intense interpretive debate...").
      *   *Ending:* Single point of least certainty.

  7.  **Final Review against Constraints:**
