          2.  Justice is the charity of the wise (internal virtue, not external rule).
          3.  Happiness is perpetual progress toward perfection (no final state).
      *   **The Two Readings:**
          *   *Grounding Reading:* Anchors obligation in objective value/wise agent; preserves freedom/normativity; makes striving the good.
          *   *Skeptical Reading:* Evil/sin is part of the best plan (determinism); moral necessity collapses into metaphysical necessity (rails); inclination without necessitation is either decisive (no freedom) or arbitrary (no grounding).
      *   **Requirements:**
          *   Weigh both readings seriously.
          *   Reach a verdict (no fence-sitting).
          *   Identify where the losing argument goes wrong OR what the winning argument costs the system.
