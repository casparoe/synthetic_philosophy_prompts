prompt: |-
  i keep getting dragged into arguments about whether viruses are alive, and they always end the same way: everyone lists features, the lists conflict, and nobody can say what would even settle it. before i have this fight again i want the spec first. write the requirements any adequate defintion of life has to meet, keeping in mind the theory needs to be good enough for two separate jobs — ruling on borderline cases here on earth, and recognizing the thing if we ever find it somewhere else, possibly in a chemistry nothing like ours.

  borderline cases it should have something to say about: viruses obviously, and the big ones like mimivirus that carry their own metabolic genes; prions; dormant spores and frozen embryos, where nothing is happening metabolically for centuries but we still want to call them alive; the mule, which is alive but can't do the whole lineage thing; HeLa cells, which outlived the person they came from and arguably became their own thing; a dead tree still standing; and a growing crystal or a self-copying computer program in RAM, which are the cases that are supposed to not count. my labmate also insists on asking about a simulated chemistry where little moving patterns consume a resource and reproduce, and i can't tell if that's alive or if i just described a screensaver.

  distinctions the theory can't collapse, at least if it wants to be taken seriously: alive vs merely self-organizing (stars, hurricanes, convection cells), alive vs merely self-replicating (crystal growth, von neumann probes), alive vs once-alive. results from biology it can't contradict — e.g. it can't imply every gene or every enzyme is alive, or that a sterile worker bee isn't. and a requirement i suspect matters more than people think: whatever the definition is, it can't just mean "descended from our last common ancestor," because then the astrobiology job is unanswerable in principle, and it can't be a naked list of features our particular branch of life happens to have. also it should either explain why the gray zone exists or explain why the gray zone is a defect of our concepts rather than of the world — one of those two.

  for each requirement, give the case or consideration behind it. mark which are non-negotiable and which are just the preferences of particular camps — the metabolism-first people will care about some, the darwinian-evolution-first people about others, and i want to know which demands are real and which are camp shibboleths. most importantly, flag any pair of requirements that can't be jointly satisfied — my suspicion is that "decides the borderline cases cleanly" and "general enough for alien chemistries" pull against each other, but i want to see whether that's real or just my lack of imagination.

  then, briefly, a scorecard: metabolism-first views, evolution-first views (the NASA astrobiology working defintion about a self-sustaining chemical system capable of darwinian evolution), and the autopoiesis / self-maintaining-organization crowd. a table is fine but the criteria are the part i actually care about — don't spend all your words on the scoring.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Create a "specification" (requirements list) for an adequate definition of life.
      *   **Purpose:** To settle arguments about borderline cases (viruses, prions, spores, mules, HeLa cells, dead trees, crystals, simulations) and to work for astrobiology (alien chemistry).
      *   **Constraints:**
          *   Must distinguish alive vs. self-organizing (stars), alive vs. self-replicating (crystals), alive vs. once-alive.
          *   Must not contradict biological results (genes aren't alive, sterile workers are).
          *   Must not be Earth-chauvinistic (not just "descended from LUCA").
          *   Must address the "gray zone" (explain it or dismiss it as conceptual).
          *   Must identify Non-Negotiable vs. Camp Preferences.
          *   Must identify Conflicting Requirements (trade-offs).
          *   Must provide a brief scorecard of major theories (Metabolism, Evolution, Autopoiesis).
          *   Tone: Analytical, precise, slightly weary of the debate but rigorous (matching the user's frustration).

  2.  **Deconstruct the Requirements (The "Spec"):**
      *   *Requirement 1: The Substrate Independence Clause.* (Astrobiology). Can't rely on DNA/proteins specifically.
      *   *Requirement 2: The Process vs. State Distinction.* (Dormancy). Needs to handle spores/frozen embryos that do *nothing* for a while.
      *   *Requirement 3: The Hierarchy Constraint.* (Reductionism). Can't call genes/enzymes alive. Life is a property of the *system*, not the parts.
      *   *Requirement 4: The Lineage vs. Individual Constraint.* (Mules/HeLa). Needs to handle sterile individuals and immortal cell lines.
      *   *Requirement 5: The Thermodynamic Boundary.* (Self-organization). Distinguish from hurricanes/stars (dissipative structures).
      *   *Requirement 6: The Replication vs. Evolution Constraint.* (Crystals/Software). Distinguish from simple copying. Needs heredity + variation + selection.
      *   *Requirement 7: The Vital/Dead Boundary.* (Dead trees). Distinguish functioning organization from structural remnant.
      *   *Requirement 8: The Gray Zone Mandate.* (Viruses). Must explicitly account for why viruses are ambiguous or declare the ambiguity a category error.

  3.  **Classify Requirements (Non-Negotiable vs. Camp Preference):**
      *   *Non-Negotiable:* Substrate independence (otherwise astrobiology fails), Hierarchy (otherwise biology breaks), Thermodynamic Boundary (otherwise physics breaks), Replication/Evolution distinction (otherwise crystals are alive).
      *   *Camp Preference:* Metabolism *now* (excludes spores), Evolution *potential* (includes viruses?), Autopoiesis *boundary* (hard to define for colonies).

  4.  **Identify Conflicts (The "Impossible Specs"):**
      *   *Conflict A:* Dormancy (Spores) vs. Metabolism-Now. If life requires active metabolism, spores are dead. If life allows indefinite pause, crystals/software might sneak in.
      *   *Conflict B:* Individuality (Mules) vs. Evolution. If life requires Darwinian evolution, sterile individuals are problematic unless defined as part of a *population*.
      *   *Conflict C:* Clean Boundaries vs. Continuous Reality. The user wants a clean decision on viruses. Nature likely offers a continuum. A definition that forces a binary "Yes/No" on a continuum is either arbitrary or wrong. This is the big one: *Decidability vs. Truth.*

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the frustration. The "spec" approach is good.
      *   **The Requirements List:** Group them logically.
          *   *Scope:* Earth + Alien.
          *   *Scale:* System vs. Part.
          *   *Dynamics:* Process vs. State.
          *   *Differentiation:* Not crystals, not stars, not corpses.
      *   **Classification:** Mark NN (Non-Negotiable) vs. CP (Camp Preference).
      *   **The Conflicts:** This is crucial. Highlight the "Binary vs. Continuum" tension.
      *   **The Scorecard:** Evaluate Metabolism, Evolution (NASA), Autopoiesis against the spec.

  6.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Viruses:* The NASA definition ("capable of Darwinian evolution") actually *includes* viruses if you consider the host-virus system, but excludes them if viewed in isolation. I need to make sure the spec highlights this tension.
      *   *Correction on Spores:* A definition based on *current* metabolism kills spores. A definition based on *dispositional* properties (capacity to metabolize) saves them but risks including dry seeds that are actually dead. The spec needs to demand a "potentiality" clause that isn't too loose.
      *   *Correction on HeLa/Mules:* This points to the "Unit of Life" problem. Is the individual alive, or the lineage? The spec must require the definition to specify the *unit* (cell, organism, population).
      *   *Simulation:* The "moving patterns in RAM" case. This tests Substrate Independence. If it's just logic, is it life? Most biologists say no (needs chemistry/thermodynamics). The spec should demand an embodiment constraint (physical causality, not just logical).

  7.  **Finalizing the Conflicts:**
      *   The biggest conflict is **Binary Classification vs. Evolutionary Continuum**. If evolution is gradual, the origin of life and the status of viruses *must* be gray. A definition that forces a sharp line is scientifically dishonest, but a definition that allows a gray zone fails the user's desire to "settle the argument." I need to be honest: You can't have both a clean binary verdict *and* a definition that respects evolutionary continuity.

  8.  **Final Review against User Prompt:**
      *   Did I cover viruses, mimivirus, prions, spores, mules, HeLa, dead trees, crystals, software? Yes.
      *   Did I distinguish self-organizing vs. self-replicating vs. alive? Yes.
      *   Did I mark NN vs. Preference? Yes.
      *   Did I flag conflicting requirements? Yes.
      *   Is there a scorecard? Yes.
      *   Is the tone appropriate? Keep it sharp and technical.

  9.  **Constructing the Output:** (Proceeding to generate response based on these thoughts.)
answer: |-
  This is a request for a requirements specification for a natural kind definition. You are asking for a formal ontology of "life" that satisfies both operational utility (settling arguments) and scientific validity (astrobiology/evolutionary theory).

  Below is the spec. It is divided into **Functional Requirements** (what the definition must do), **Classification of Constraints** (what is hard law vs. ideological preference), and **Incompatibility Matrix** (where the spec breaks).

  ### I. Functional Requirements Specification (FRS)

  **FRS-01: Substrate Independence (Astrobiology Compliance)**
  *   **Requirement:** The definition cannot rely on specific molecular machinery (DNA, RNA, proteins, lipids). It must define the *functional role* these molecules play.
  *   **Test Case:** Alien life based on silicon, alternative solvents, or non-enzymatic catalysis.
  *   **Rationale:** If the definition requires "ribosomes," it fails the astrobiology job. It must describe the *process*, not the *parts*.
  *   **Status:** **Non-Negotiable.**

  **FRS-02: The Hierarchy Constraint (Reductionism Barrier)**
  *   **Requirement:** The definition must apply to a specific level of organizational closure. It cannot apply to constituent parts (genes, enzymes) nor arbitrarily to aggregates (ecosystems, unless specified).
  *   **Test Case:** A single ATP synthase enzyme is not alive; a sterile worker bee is.
  *   **Rationale:** Prevents panpsychism or mereological fallacies. Life is an emergent property of a specific system configuration, not a property of matter itself.
  *   **Status:** **Non-Negotiable.**

  **FRS-03: The Dispositional State Clause (Dormancy Handling)**
  *   **Requirement:** The definition must distinguish between *occurrent* properties (doing metabolism now) and *dispositional* properties (having the capacity to metabolize given conditions).
  *   **Test Case:** Frozen embryos, bacterial spores (alive but inactive) vs. a dead tree (structure remains, capacity lost).
  *   **Rationale:** If life requires active metabolism *now*, spores are dead. If life requires only *potential*, a viable seed and a dead seed look identical until water is added. The definition must specify what preserves the disposition (e.g., structural integrity of information vs. thermodynamic equilibrium).
  *   **Status:** **Non-Negotiable** (but implementation is the hard part).

  **FRS-04: The Evolutionary Unit Specification (Lineage vs. Individual)**
  *   **Requirement:** The definition must explicitly state whether "life" is a property of an *individual organism* or a *lineage/population*.
  *   **Test Case:** The Mule (alive individual, evolutionary dead end), HeLa cells (immortal lineage, debatable individual), Viruses (evolve, but depend on host lineage).
  *   **Rationale:** You cannot judge a mule by evolutionary standards if the unit is the "individual." You cannot judge a virus by metabolic standards if the unit is the "replicator system."
  *   **Status:** **Non-Negotiable** (The definition fails if it doesn't declare its unit of analysis).

  **FRS-05: The Thermodynamic Boundary (Self-Organization Filter)**
  *   **Requirement:** The system must maintain a low-entropy state not merely through equilibrium physics, but through active work against equilibrium that is causally linked to its own persistence.
  *   **Test Case:** Hurricanes, stars, convection cells (dissipative structures).
  *   **Rationale:** These systems self-organize and persist, but they do not encode information to reconstruct themselves if disrupted. They are slaves to thermodynamic gradients, not masters of them.
  *   **Status:** **Non-Negotiable.**

  **FRS-06: The Heredity/Evolution Distinction (Replication Filter)**
  *   **Requirement:** Self-replication is insufficient. Replication must involve heredity with variation subject to selection (Darwinian threshold).
  *   **Test Case:** Crystals (replicate structure, no heritable variation), Von Neumann probes (copy perfectly), Computer viruses (logic only, no physical selection).
  *   **Rationale:** Prevents crystals and simple algorithms from qualifying. Requires an open-ended evolutionary potential.
  *   **Status:** **Camp Preference** (Evolution-first camps say NN; Metabolism-first camps say this is a consequence, not a requirement).

  **FRS-07: The Embodiment Constraint (Simulation Filter)**
  *   **Requirement:** The process must be physically instantiated in a way that thermodynamic consequences matter to the system's persistence. Purely logical replication in a lossless environment does not count.
  *   **Test Case:** Self-copying code in RAM, Conway's Game of Life gliders.
  *   **Rationale:** Distinguishes biology from simulation. If the hardware doesn't degrade and resources aren't physically scarce, it's math, not life.
  *   **Status:** **Camp Preference** (Materialists say NN; Functionalists/Strong AI say this is chauvinism).

  **FRS-08: The Gray Zone Mandate**
  *   **Requirement:** The definition must either (A) provide a binary decision for borderline cases (Viruses, Mimivirus) or (B) explicitly model life as a continuum and explain why the binary question is category error.
  *   **Test Case:** Viruses, Prions, Protocells.
  *   **Rationale:** You requested a spec to settle arguments. A definition that says "it depends" fails the utility job, but a definition that forces a binary "Yes/No" on a continuum may fail the truth job.
  *   **Status:** **Conflicted** (See Incompatibility Matrix).

  ---

  ### II. Incompatibility Matrix (Where the Spec Breaks)

  You suspected that "Decides borderline cases cleanly" and "General enough for alien chemistries" pull against each other. That is correct, but the deeper conflict is between **Binary Classification** and **Evolutionary Continuity**.

  | Conflict Pair | Tension Description | Resolution Cost |
  | :--- | :--- | :--- |
  | **FRS-03 (Dormancy) vs. FRS-05 (Thermodynamics)** | To allow spores (FRS-03), you must allow systems with *zero* active metabolism. To exclude dead trees (FRS-05), you must require *some* active maintenance. | **Arbitrary Time Limit:** You must define a maximum dormancy duration or a minimum structural integrity threshold. Both are arbitrary. |
  | **FRS-04 (Unit) vs. FRS-08 (Gray Zone)** | If the unit is the *Lineage* (Evolution), Viruses are alive (they evolve). If the unit is the *Cell* (Metabolism), Viruses are dead. You cannot satisfy both the Mule (Individual) and the Virus (Lineage) with one unit definition. | **Dual Definition:** You must admit there are two definitions of life (Physiological vs. Evolutionary). This admits defeat on "settling the argument." |
  | **FRS-08 (Binary) vs. Reality (Continuum)** | Evolution is gradual. The transition from non-life to life was not an event but a process. A binary definition forces a sharp line on a gradient (Sorites Paradox). | **Scientific Dishonesty:** A clean binary verdict on viruses requires drawing a line that nature did not draw. It satisfies the argument, but falsifies the biology. |
  | **FRS-01 (Substrate) vs. FRS-07 (Embodiment)** | If you make it too substrate-independent, self-replicating software qualifies. If you require physical embodiment (thermodynamics), you risk excluding alien biochemistries we don't understand. | **The "Physics" Loophole:** You must require *thermodynamic cost* to replication, not just logical copying. This saves you from the screensaver, but requires measuring entropy in alien systems. |

  **The Critical Trade-off:**
  You cannot have **FRS-08 (Binary Verdict)** and **Scientific Accuracy** simultaneously.
  *   **Option A:** Accept that "Life" is a fuzzy cluster concept. Viruses are "borderline." This satisfies biology but fails your goal of ending arguments.
  *   **Option B:** Enforce a strict binary (e.g., "Must metabolize independently"). This ends arguments but classifies spores as dead and excludes potential alien lineages that are parasitic by nature.

  ---

  ### III. Theory Scorecard

  Here is how the major camps score against your requirements.

  | Requirement | **Metabolism-First** (Autopoiesis) | **Evolution-First** (NASA/Darwinian) | **Systems/Information** (Complexity) |
  | :--- | :--- | :--- | :--- |
  | **FRS-01 (Substrate)** | **Pass.** Focuses on chemical closure, not specific molecules. | **Pass.** Focuses on information transfer, not chemistry. | **Pass.** Abstract enough for silicon/carbon. |
  | **FRS-02 (Hierarchy)** | **Pass.** Defines the "cell" boundary rigorously. | **Fail.** Struggles with individuals (Mules); focuses on populations. | **Mixed.** Often allows "alive" software/ecosystems. |
  | **FRS-03 (Dormancy)** | **Fail.** A spore has no metabolic closure; it is a crystal-like object until activation. | **Pass.** A spore retains the *capacity* for evolution/metabolism. | **Pass.** Information persists even if process pauses. |
  | **FRS-04 (Unit)** | **Pass.** The Individual Cell/Organism. (Mules are alive). | **Fail.** The Lineage. (Mules are evolutionary dead ends; Viruses are alive). | **Mixed.** Depends on where the "information boundary" lies. |
  | **FRS-05 (Thermo)** | **Pass.** This is their core strength. Distinguishes from hurricanes. | **Mixed.** Evolution implies thermodynamics, but doesn't mandate it explicitly. | **Fail.** Often ignores thermodynamic cost (screensaver problem). |
  | **FRS-06 (Evolution)** | **Fail.** A single mule is alive but cannot evolve. | **Pass.** This is their core strength. | **Pass.** Requires complexity growth. |
  | **FRS-07 (Embodiment)** | **Pass.** Requires physical boundary (membrane). | **Pass.** Requires chemical system. | **Fail.** Often accepts digital life. |
  | **FRS-08 (Gray Zone)** | **Binary.** Virus = Dead (No metabolism). | **Binary.** Virus = Alive (Evolves). | **Continuum.** Virus = Complex, but degree varies. |
  | **Verdict on Viruses** | **Dead.** | **Alive.** | **Borderline.** |
  | **Verdict on Spores** | **Dead (Dormant).** | **Alive.** | **Alive.** |
  | **Verdict on Mule** | **Alive.** | **Dead (Lineage).** | **Alive.** |

  ### IV. Recommendation for the Argument

  If you want to end the fight, you must force your opponents to choose which **Unit of Analysis (FRS-04)** they are using.

  1.  **If they define Life as a Physiological State:** (Metabolism/Autopoiesis)
      *   **Viruses:** Dead.
      *   **Spores:** Dead (until germination).
      *   **Mules:** Alive.
      *   **Pros:** Matches intuition about "living things."
      *   **Cons:** Fails Astrobiology (might miss alien replicators) and Evolutionary Theory (ignores the point of life).

  2.  **If they define Life as an Evolutionary Process:** (NASA/Darwinian)
      *   **Viruses:** Alive.
      *   **Spores:** Alive.
      *   **Mules:** Not Alive (biologically sterile), or only alive as vessels for the lineage.
      *   **Pros:** Works for Astrobiology, handles dormancy.
      *   **Cons:** Contradicts intuition (a mule isn't alive?), makes "life" a property of populations, not individuals.

  **The Settlement:**
  Tell your labmate: *"We are arguing because you are using an Evolutionary definition and I am using a Physiological one. Under the Physiological spec, viruses are dead tools. Under the Evolutionary spec, viruses are alive replicators. Both are consistent internally. Pick one spec, and the verdict is automatic. If you want a spec that does both, you violate FRS-04 and the definition becomes incoherent."*

  **The Hard Truth:**
  The "Gray Zone" is not a defect of our concepts; it is a feature of the universe. Life emerged from non-life via gradual steps. Any definition that draws a sharp line (to satisfy your desire for a clean verdict) is necessarily **arbitrary**. You can have a definition that is **useful** (binary) or **true** (continuous), but the spec demands both. You must drop one. For the purpose of ending arguments, drop "True." Adopt the **NASA Evolutionary Definition** for astrobiology and the **Autopoietic Definition** for medicine/ecology, and admit they are different words for different jobs.
