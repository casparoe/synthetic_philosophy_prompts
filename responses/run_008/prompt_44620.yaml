  *(Self-Correction on "Unknown Old Evidence")*: Wait, if the agent *possesses* E but doesn't recognize relevance, is E in the belief corpus? If E is in the corpus, $P(E)=1$. If they don't recognize relevance, they don't know $H \vdash E$. So Garber handles this easily. Counterfactuals struggle because do we remove E from the corpus if they "had" it but didn't "use" it? This nuance is important.

