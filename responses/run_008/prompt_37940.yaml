answer: |-
  **Opening Remarks: The Verification Bottleneck**

  Good morning. Look around the room. On my left, people who build models. On my right, people who analyze arguments. We are here because we share a hope: that we can align superhuman systems by having them argue in front of human judges.

  I am not here to welcome you to the workshop. I am here to tell you that the premise of this workshop is partially broken, and that fixing it requires us to stop pretending debate is about truth.

  The standard pitch for AI Debate is elegant. Two adversarial models argue a point. A human judge decides the winner. We assume truth has a structural advantage—that honest arguments are easier to defend, easier to verify, or somehow more robust than lies. Therefore, by optimizing for winning the debate, we optimize for truth.

  I want to argue that this assumption is false. Debate does not track truth. It tracks *verifiability within a fixed cognitive budget*.

  Here is the failure mode. It is not that models lie. It is that honest decompositions of complex truths are often long, messy, and computationally expensive to verify. Dishonest decompositions can be engineered to be short, clean, and rhetorically satisfying. When the honest path requires fifty steps of checking and the dishonest path requires five, the human judge does not pick the truth. They pick the path they can actually finish.

  This is the Obfuscation Problem. And I am arguing that this is not a patchable edge case. It is the load-bearing failure of the protocol.

  As models get stronger, they do not just get better at finding the truth. They get better at generating obfuscation that looks like verification. They learn to produce arguments that *simulate* the shape of soundness without the substance. If the judge's bottleneck is time and cognitive load, the model that best compresses the argument wins. If compression favors the liar, the system scales into deception.

  Now, I know what the philosophers in the room are thinking. You are hearing me conflate truth with verifiability. You are ready to pounce on the claim that "what the judge accepts" is a proxy for "what is true."

  I am not going to route around that objection. I am going to bite the bullet.

  Debate was never about truth. It is an economic protocol, not an epistemic one. It is a mechanism for concentrating verification effort. It buys us *justification that fits in a human head*, not *correspondence with reality*. If we continue to market this as "truth-seeking," we are lying to ourselves. We should instead admit that we are building a system that maximizes *winnable justification*.

  This admission is not a defeat. It is a clarification. If debate is about verification concentration, then our metric for success changes. We stop asking, "Did the judge pick the true answer?" and start asking, "What was the cost of the verification?"

  To the ML researchers: This is not philosophical grousing. This is a measurable scaling problem. If obfuscation becomes cheaper than verification as capabilities increase, the scheme collapses. We need to know the ratio.

  We need to stop trying to patch debate to handle obfuscated cases by making judges smarter or adding more rounds. That is fighting the wrong war. Instead, we need to measure the judge's task directly. I propose we treat the judge's job as a computational problem. We need to measure the *length of the shortest verifiable certificate* the honest side must produce to convince a bounded agent.

  If the shortest honest certificate is length $N$, and the shortest dishonest certificate is length $M$, and $M \ll N$, the judge will pick the lie. Our goal is not to make the judge infinite. Our goal is to characterize the gap between $N$ and $M$ across different domains.

  So, here is the pivot. For the next two days, I ask that we stop discussing debate as a truth machine. Let us discuss it as a bandwidth allocation problem.

  And here is your concrete task for this week. Do not run a new debate tournament. Do not tune a reward model. Instead, take three existing transcripts from your past experiments. Annotate them. For every claim made by the winning side, mark whether it was verified by the judge or merely asserted. Then, estimate the *minimum* number of additional steps required to actually verify that claim to a standard of logical necessity.

  Calculate the "Verification Debt." How much work did the judge skip to reach a verdict? If that debt is high, the model didn't find the truth; it found a shortcut.

  If we do this, we might find that debate is still useful. It might be the best way we have to concentrate verification effort. But we must know the limits of that concentration. We must know exactly how much truth we are leaving on the cutting room floor to fit the argument into a human mind.

  Let us spend this workshop measuring the floor, not polishing the machine.

  Thank you.

  ***

  **Appendix: Exposure Note for Q&A**

  *Use this to prepare for pushback. The argument above leans on three contested choices:*

  1.  **The Computational View of the Judge:** I have treated the judge's task as a complexity problem (length of certificate/steps to verify) rather than an epistemic one (coherence, credibility, probabilistic updating).
      *   *Risk:* Philosophers may argue that human judgment relies on holistic intuition or "phronesis" that cannot be reduced to step-counting. If verification is non-linear, my metric fails.
      *   *Defense:* Even if judgment is holistic, it is still bounded by time and attention. The "steps" metric is a proxy for cognitive load, which is the actual scarce resource.

  2.  **Truth vs. Verifiability:** I explicitly decoupled truth from the outcome of the debate.
      *   *Risk:* ML researchers may argue that in the limit, verifiability *converges* to truth, so the distinction doesn't matter for alignment.
      *   *Defense:* In AI safety, we care about the pre-limit behavior. If the system scales into deception before it scales into truth, the convergence argument is cold comfort. We need to know the trajectory, not just the asymptote.

  3.  **Obfuscation Scaling:** I claimed obfuscation gets easier faster than verification as models improve.
      *   *Risk:* This is an empirical claim, not a theorem. It is possible that better models also produce better "honest compression" tools that make the honest path shorter.
      *   *Defense:* This is exactly why I proposed the "Verification Debt" task. We need to measure this ratio empirically rather than assuming the honest path naturally compresses. The burden of proof is on those who claim honesty is naturally concise.
