answer: |-
  The Pluto case is indeed a stress test for the Kripke-Putnam framework, precisely because it exposes the boundary between natural kinds and theoretical classifications. To run this through the machinery of rigid designation and the necessary a posteriori, we have to look closely at what fixed the reference of 'planet' in 1930 versus 2006.

  On the first direction—whether 'planet' functions as a natural-kind term—the evidence leans heavily against the Kripkean model. For Kripke and Putnam, natural kind terms like 'water' or 'gold' rigidly designate a substance based on an underlying microstructural essence (H2O, Au) that exists independently of human classification. When we discovered water is H2O, we didn't change the meaning of 'water'; we discovered the necessary condition that was fixing the reference all along. If 'planet' worked this way, the 2006 IAU assembly would have been unnecessary. Biologists do not vote on whether whales are mammals; they discover the biological facts that make them so. The fact that a vote was required—that the definition was *adopted* rather than *found*—indicates that 'planet' lacks a hidden essence waiting to be uncovered. Instead, 'planet' functions more like your TA's example of 'jade'. 'Jade' turned out to refer to two distinct minerals (jadeite and nephrite) linked only by superficial properties; it is not a unified natural kind. Similarly, 'planet' prior to 2006 was a cluster concept held together by historical usage and macroscopic features (orbiting the sun, roundness), not a single intrinsic essence. The discovery of Eris didn't reveal a new fact about Pluto's essence; it revealed a pragmatic problem for the extension of the term.

  This leads directly to the status of the vote. On a strict Kripkean reading, experts fix reference via causal contact with the world (Putnam's division of linguistic labor). However, the IAU vote looks less like experts refining reference based on causal contact and more like legislation. They stipulated a new criterion (orbital dominance) to preserve the utility of the term. If this is legislation, it poses a specific challenge to externalism: it suggests that for certain scientific terms, the "expert class" doesn't just track nature, they negotiate conventions. This isn't a fatal blow to externalism, but it does limit its scope. It shows that externalism explains the stability of terms like 'water' well, but is silent on who gets to legislate terms like 'planet' when nature doesn't provide a sharp cutoff. The "weird silence" you perceive is real: externalism assumes the world fixes the reference, but here the community fixed the reference because the world (the Kuiper Belt) was too messy.

  On the second direction—the necessity story—the Pluto episode fails the test for the necessary a posteriori. If "Pluto is a planet" were a necessary truth (like "Water is H2O"), it could not become false without a change in the world or a change in meaning. Pluto didn't change. Therefore, the meaning changed. If the meaning changed, the term was not rigidly designating the same kind across the 2006 boundary. Pre-2006, "Pluto is a planet" was contingently true based on the classificatory scheme of the time. Post-2006, it is contingently false based on the new scheme. It was never a necessary truth waiting to be discovered, nor a necessary falsehood (like "Whales are fish") waiting to be corrected. The whale case involves correcting a false belief about a fixed biological essence. The Pluto case involves changing the definition because the old one became inconvenient. This confirms that astronomical kind terms like 'planet' are not in the business of supporting necessities the way chemical ones are. They are theoretical kinds whose boundaries are determined by explanatory utility, not metaphysical essence.

  My stance is that the 2006 criteria were replacing meaning, not discovering it. The IAU did not find out that Pluto *never was* a planet in the way we found out whales *never were* fish; they decided that henceforth, the word 'planet' would not apply to Pluto. This episode is ultimately a point against universalizing the Kripkean natural kind model to all scientific terminology. It shows that not every scientific term is a rigid designator of a natural kind; some are stipulative tools subject to revision by the linguistic community's experts. Externalism survives, but only if we acknowledge that 'planet' is not a natural kind term in the strict sense.

