  # Research Proposal: The Behavioral Distinction Between Imprecise and Sharp Credence
  ## A Test of Dynamic Mimicry

  ### 1. Introduction and Statement of the Problem

  The orthodox Bayesian framework maintains that a rational agent's degrees of belief are best represented by a single, precise probability function. When an agent exhibits behavior that suggests hesitation—such as refusing to bet on an event at odds that seem favorable, or refusing both sides of a bet—the orthodox explanation is that the agent possesses a precise credence but is influenced by other factors, such as risk aversion, state-dependent utility, or simply a different prior. In contrast, the theory of imprecise probabilities argues that rational credence is sometimes inherently indeterminate, represented by a set of probability functions rather than a single one. On this view, hesitation is not a performance error or a feature of utility; it is a direct reflection of the doxastic state.

  The central dispute driving this project is whether these two frameworks are behaviorally equivalent. My interlocutor argues for the "Sharp Mimic Hypothesis": for any pattern of choices made by an agent modeled with imprecise credences, there exists a sharp Bayesian agent (with a fixed precise probability function and utility function) who would make the exact same choices. If this hypothesis holds, the debate over imprecise probabilities is merely verbal or pragmatic; imprecision is just a bookkeeping device for complex sharp attitudes. If the hypothesis fails, then imprecise probabilities capture a normative structure of rationality that sharp Bayesianism cannot replicate.

  This paper will investigate whether there exists a pattern of choices, specifically within dynamic decision contexts, that distinguishes an agent with imprecise credences from every possible sharp-probability agent. The goal is to move beyond static examples like the Ellsberg paradox, which can often be explained away by non-linear utility, and focus on dynamic phenomena like dilation, where the structure of learning itself appears to generate behavioral differences that a fixed sharp prior cannot track.

  ### 2. Precising the Question

  To ensure the project yields a determinate answer, the core concepts must be defined rigorously. The question is not whether imprecise probabilities are *useful*, but whether they are *behaviorally distinct* from sharp probabilities under idealized rationality.

  **The Imprecise Agent (IP):**
  The IP agent is characterized by a credal set, which is a convex set of probability functions representing their doxastic state. When facing a decision, this agent does not maximize expected utility relative to a single function. Instead, they employ a decision rule appropriate for imprecision, such as *Maximin Expected Utility* (choosing the act with the highest minimum expected utility across the credal set) or *E-Admissibility* (choosing any act that maximizes expected utility for at least one function in the set). Crucially, the IP agent updates their credal set via generalized conditionalization upon receiving evidence.

  **The Sharp Mimic (SB):**
  A Sharp Mimic is an agent characterized by a single prior probability function $P$ and a utility function $U$. This agent maximizes subjective expected utility. To count as a genuine mimic, the SB agent must be *dynamically consistent*. They must choose acts that align with their prior plan at all stages of a decision tree, updating via standard Bayesian conditionalization. They cannot change their utility function or their prior mid-stream to match the IP agent's choices; the pair $(P, U)$ must be fixed at the outset.

  **The Class of Decision Situations:**
  Static choice scenarios are insufficient for this test. As my interlocutor correctly notes, risk aversion (a concave utility function) can mimic the refusal of fair bets associated with imprecise credences. Therefore, the comparison must be run over a class of *dynamic decision problems*. These are sequences of choices where the agent receives evidence between decisions. The test for mimicry is whether there exists a fixed $(P, U)$ pair that generates the same choice policy as the IP agent across all nodes of the decision tree.

  **The Research Question:**
  Is there a dynamic decision problem and an imprecise credal state such that no fixed sharp Bayesian agent $(P, U)$ can replicate the IP agent's choice policy without violating the norms of dynamic consistency or Bayesian updating?

  ### 3. Why Standard Arguments Leave the Question Open

  The existing literature provides strong intuition for the imprecise view but fails to decisively settle the mimicry challenge. The standard argument relies on static violations of the Sure Thing Principle, most famously illustrated by Ellsberg-style cases. In these scenarios, agents prefer betting on known probabilities over unknown ones, violating the axioms of Savage.

  However, the orthodox defense is robust here. A sharp Bayesian can argue that the agent's utility function is not linear in money. If the agent is sufficiently ambiguity-averse, this can be modeled as a form of risk aversion where the "risk" is the uncertainty about the underlying chance setup. Furthermore, a sharp Bayesian can model uncertainty about the true prior by treating the "unknown" probability as a random variable with a second-order distribution. By integrating over this second-order distribution, the agent arrives at a single precise prior that accounts for their hesitation. Thus, in static contexts, the behavioral data underdetermines the doxastic model. The interlocutor's claim that the dispute is verbal rests on this underdetermination: if every imprecise choice can be reconstructed as a sharp choice with complex utilities or higher-order priors, then imprecision adds no ontological value.

  The weakness in the orthodox defense emerges in dynamic contexts. While a sharp agent can mimic a static refusal to bet, it is unclear if they can mimic the *evolution* of that refusal under learning. This is where the phenomenon of dilation becomes critical. Dilation occurs when, for a given event, the posterior probability interval becomes strictly wider than the prior interval for every element of a partition of evidence. In simpler terms, the agent becomes *less* certain after learning specific evidence, regardless of what that evidence is.

  A sharp Bayesian agent generally becomes more certain (or at least, does not systematically become less certain in terms of variance or entropy) upon conditionalization. While a sharp agent can have a prior that anticipates high variance posteriors, they cannot replicate the structural feature of dilation where *every* possible outcome of an experiment increases imprecision. If an IP agent's choices shift in response to dilation (e.g., they accept a bet before the experiment but reject it after, regardless of the outcome), a sharp mimic would need a prior that prescribes rejecting the bet after *any* outcome while accepting it before. This places severe constraints on the sharp prior. The standard Ellsberg arguments do not address this dynamic shift, leaving the mimicry hypothesis open to empirical and formal refutation.

  ### 4. Methodology and Work Plan

  The project will proceed over a twelve-week semester, divided into four phases. The method is primarily formal-philosophical: constructing decision models and testing for the existence of mimicking functions.

  **Phase 1: Formalization (Weeks 1–3)**
  *   **Goal:** Rigorously define the IP and SB frameworks without ambiguity.
  *   **Tasks:**
      *   Define the credal set and the specific update rule (e.g., Generalized Conditionalization).
      *   Define the decision rule (e.g., Maximin).
      *   Define the Sharp Mimic constraints: Fixed $P$, Fixed $U$, Dynamic Consistency (plan-execute alignment).
      *   Formalize the definition of "Behavioral Equivalence": Two agents are equivalent if they select the same set of permissible acts in every decision node of a given problem class.
  *   **Deliverable:** A formal appendix draft defining the models to be used in the paper.

  **Phase 2: The Static Test (Weeks 4–6)**
  *   **Goal:** Concede or refute the static mimicry claim to clear the ground for the dynamic argument.
  *   **Tasks:**
      *   Analyze a standard Ellsberg-style static choice.
      *   Attempt to construct a sharp $(P, U)$ pair that mimics the IP choice.
      *   *Hypothesis:* I expect to find that static mimicry is possible if we allow for sufficiently complex utility functions (e.g., state-dependent utility).
      *   **Strategic Decision:** If static mimicry holds, I will explicitly grant this point in the paper to focus entirely on the dynamic case. This strengthens the overall argument by conceding the weaker ground to defend the stronger.
  *   **Deliverable:** A section of the paper demonstrating that static choices are insufficient to distinguish the frameworks.

  **Phase 3: The Dynamic Test – Dilation (Weeks 7–9)**
  *   **Goal:** Construct the counterexample that breaks the mimicry hypothesis.
  *   **Tasks:**
      *   Construct a decision tree involving a dilating partition.
      *   Specify an IP agent's choices: e.g., Accept a free bet at time $t_0$, but reject the same bet at time $t_1$ regardless of the evidence received.
      *   Attempt to solve for a sharp prior $P$ that validates this policy.
      *   *The Crucial Constraint:* For the sharp agent to accept at $t_0$, the expected utility must be positive. For them to reject at $t_1$ (after any evidence $E$), the conditional expected utility given $E$ must be negative for all $E$.
      *   By the Law of Total Expectation, if the conditional expectation is negative for all $E$, the prior expectation must be negative. This creates a contradiction for the sharp agent: they cannot rationally plan to accept a bet at $t_0$ if they know they will reject it at $t_1$ in all contingencies.
      *   However, the IP agent is not bound by the Law of Total Expectation in the same way due to the interval nature of their credence.
      *   **Verification:** I must verify that the IP decision rule permits this shift without violating IP norms of dynamic consistency (which are weaker than Bayesian consistency).
  *   **Deliverable:** The core proof/counterexample for the paper.

  **Phase 4: Synthesis and Drafting (Weeks 10–12)**
  *   **Goal:** Assemble the argument and assess the philosophical implications.
  *   **Tasks:**
      *   Draft the full paper, ensuring the transition from formal results to philosophical conclusion is smooth.
      *   Write the "Stakes" section (see below).
      *   Review for clarity and ensure the "Sharp Mimic" definition is consistently applied.
  *   **Deliverable:** Final 6000-word paper.

  ### 5. Criteria for Success and Failure

  To settle the dispute, the results must meet specific criteria.

  **Settling in the Interlocutor's Favor (Mimicry Holds):**
  To prove the interlocutor right, I would need to demonstrate that for the dilation case described above, there *does* exist a sharp prior $P$ that validates the policy. This would likely require showing that the IP agent's behavior violates a norm of dynamic consistency that the sharp agent correctly upholds. If the IP agent accepts a bet at $t_0$ knowing they will reject it at $t_1$ regardless of the outcome, they are dynamically inconsistent. If the sharp agent refuses to mimic this because it violates dynamic consistency, then the "mimicry" fails only because the IP behavior is irrational.
  *   *Condition for Interlocutor's Win:* If the only way to mimic the IP choices is to be dynamically inconsistent, then the sharp framework is normatively superior, and the IP model is merely describing irrational hesitation.

  **Settling in My Favor (Mimicry Fails):**
  To prove my position, I must show a case where the IP agent's shift in preference is *rational* within the IP framework (permissible by IP norms) but *impossible* for any dynamically consistent sharp agent.
  *   *Condition for My Win:* I must exhibit a decision tree where:
      1.  The IP agent's choices are permissible under a standard IP decision rule (e.g., E-Admissibility).
      2.  No fixed $(P, U)$ pair can generate these choices while satisfying the Law of Total Expectation and Dynamic Consistency.
      3.  The IP agent's behavior is defensible as rational (e.g., avoiding a sure loss in a way the sharp agent cannot).
      If such a case exists, then sharp Bayesianism is expressively incomplete: there are rational policies it cannot represent.

  ### 6. Risk Assessment and Feasibility

  The primary risk to this project is mathematical complexity. The theory of imprecise probabilities involves measure-theoretic details that could easily swallow the word count and obscure the philosophical argument. Specifically, the mathematics of dilation and the conditions under which it occurs are technical.

  **Mitigation Strategy:**
  1.  **Finite Models:** I will restrict the analysis to finite state spaces and finite decision trees. This avoids the need for advanced measure theory while preserving the logical structure of the problem. Dilation occurs in finite spaces, so this restriction is safe.
  2.  **Focus on Structure, Not Derivation:** The paper will not aim to prove new theorems in probability theory. Instead, it will utilize existing known results about dilation (without citing them, per the constraint) and focus on the *decision-theoretic implications*. The philosophical work lies in interpreting the impossibility of the sharp mimic, not in deriving the dilation itself.
  3.  **Scope Control:** If the full dilation proof proves too dense, I will focus on a specific, simplified numerical example that illustrates the contradiction in the sharp agent's expectations. A concrete numerical counterexample is philosophically sufficient to disprove a universal claim like the Sharp Mimic Hypothesis.

  A secondary risk is that the "Sharp Mimic" might escape the trap by adopting a state-dependent utility function that changes effectively with the evidence. I must ensure my definition of the Sharp Mimic explicitly forbids utility functions that are contingent on the evidence in a way that amounts to changing the utility function mid-stream. The utility function must be defined over final outcomes, not over the path taken, to maintain the integrity of the "fixed agent" requirement.

  ### 7. Philosophical Stakes

  My friend demands to know what turns on the answer. If the project concludes that the Sharp Mimic Hypothesis is true, the implications are deflationary for imprecise probabilities. It would suggest that imprecision is a pragmatic tool for handling computational complexity or ignorance, but not a fundamental feature of rational belief. The ontology of credence remains sharp; we merely use intervals as a shorthand for complex sharp priors. Decision theory would remain firmly rooted in the orthodox Bayesian paradigm, with ambiguity aversion treated as a preference trait rather than a doxastic one.

  However, if the project concludes that the Sharp Mimic Hypothesis is false, the implications are substantial for both decision theory and epistemology.
  1.  **Normative Deficiency of Orthodoxy:** It would demonstrate that orthodox Bayesianism is expressively incomplete. There are rational strategies for managing uncertainty that require a doxastic representation more rich than a single function. A sharp agent would be forced to make choices that lead to sure losses (Dutch Books) in scenarios where an IP agent could avoid them.
  2.  **The Nature of Evidence:** It would alter our understanding of how evidence relates to belief. In the sharp view, evidence always refines belief (reduces entropy). If dilation is rational, then evidence can sometimes legitimately degrade the precision of belief. This challenges the standard view of learning as a purely cumulative process of certainty.
  3.  **Rational Disagreement:** It provides a framework for understanding reasonable disagreement. If two agents have the same evidence but different priors, the sharp view often demands they converge. The IP view allows them to maintain a set of priors that does not collapse to a point, sustaining rational disagreement longer. Proving the behavioral distinctness of IP validates this as a rational stance rather than a failure to update.

  Ultimately, the answer determines whether the hesitation we feel in the face of deep uncertainty is a bug in our cognitive machinery to be corrected by sharpening our priors, or a feature of the world to be represented by our credences.

  ### 8. Conclusion

  This project moves the debate from static intuitions to dynamic constraints. By rigorously defining the "Sharp Mimic" and testing it against the phenomenon of dilation in decision trees, I aim to provide a definitive answer to whether imprecise probabilities offer a genuinely distinct model of rational agency. The week-by-week plan ensures that the mathematical heavy lifting is managed early, leaving sufficient time for the philosophical analysis of what the formal results imply for the nature of belief. Whether the result validates the orthodox view or the imprecise one, the process will clarify the behavioral commitments of each, ending the verbal stalemate with a substantive test.
