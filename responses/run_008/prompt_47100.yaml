  0.68

  **Decomposition:**

  *   **0.80** — Probability that an updateless/functional framework (FDT/UDT) is normatively superior to CDT in the limit.
      *   *Justification:* CDT loses money on Newcomb and Mugging, and while FDT has open problems, it captures the "winning" intuition across the broader class of prediction problems.
  *   **0.90** — Probability that physical fixedness (the burned ledger) does not sever the logical control FDT requires.
      *   *Justification:* FDT treats logical correlation as invariant to physical causal seals, but there is residual risk that empirical randomness introduces a "screening off" effect distinct from logical uncertainty.
  *   **0.95** — Probability that the payoff structure remains policy-contingent rather than collapsing into a fixed payout.
      *   *Justification:* As long as Omega's reward in the Heads branch depends on your *disposition* rather than the ledger's physical state, the Mugging isomorphism holds.

  **Combination:** $0.80 \times 0.90 \times 0.95 = 0.684 \approx 0.68$

  **Least Confident Term:** The second term (0.90) regarding physical fixedness vs. logical control.

  **What Would Move It:** A formal counterexample where an FDT agent correctly pays in a standard logical-uncertainty Mugging but fails in an empirically-fixed Mugging (like your burned ledger) due to the predictor using a physical randomizer *after* policy selection but *before* prediction. If such a case were constructed and widely accepted as a failure mode for FDT, I would drop that term to 0.50, dragging my total credence down to ~0.38. Conversely, a proof that logical correlation supervenes on algorithmic identity regardless of physical randomization timing would push it to 0.99.

  **On Your Framing:** You're smuggling in a CDT assumption that "causally sealed" implies "logically independent." In the Burned Ledger, the coin is causally sealed from your *action*, but not from your *algorithm* (which Omega simulated). The asymmetry with XOR Blackmail isn't about the letter vs. the ledger; it's that in Blackmail, the disaster is independent of your algorithm, whereas in Mugging (and your Ledger case), the reward is *dependent* on your algorithm. Your intuition wobbles because you're tracking the physical causal graph (CDT) half the time and the logical decision graph (FDT) the other half.
