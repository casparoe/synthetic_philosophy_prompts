      The social trap you identified where public nomination makes refusal feel like rejecting charity does not break the analogy but actually confirms the selfish nature of memetic replication. In biological evolution genes that ensure their own propagation even at a cost to the host are successful and here the meme engineered a social cost for non replication. By making the nomination public the meme turned social cohesion into a replication engine where the pressure to conform acted as the environmental filter. This fits inside the theory because memetics does not require the cultural trait to be beneficial for the host only that it is good at getting copied. The coercion is simply a highly effective adaptation that increased the fidelity and rate of transmission making it a superior replicator compared to passive cultural ideas that rely on voluntary adoption.

