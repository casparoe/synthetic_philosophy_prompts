prompt: |-
  For my philosophy elective we just read about Dawkins' idea of memes, that culture evolves the same way genes do -- stuff makes copies of itself, copies vary a little, and the ones that spread best take over. Our teacher said to pick a real thing and stress-test the theory on it, and I want to use the ice bucket challenge from 2014. You know, the ALS thing where you dump ice water on your head, film it, nominate three friends who have 24 hours to do it too or donate to ALS research. Everyone in my family did it, my principal did it, half of facebook did it one summer, it raised a ton of money for the ALS association, and then by fall it was just dead and hasnt come back.

  You can assume I know the basic facts, don't recap. What I want is a real mapping, done carefully: what exactly is the "replicator" here -- the challenge itself, the video format, the nomination chain? What's doing the copying, what's the variation, what's the selection pressure (looking good to your friends? the nomination part making refusal feel rude?). Then actually take a position on whether the theory genuinely explains why this thing exploded and then died, or whether it's just a fancy re-labeling of "it was a fad that spread because it was popular." That's my real worry and I want you to land on one side of it, not do the "there are arguments both ways" cop-out.

  Two things I specifically can't figure out. First, a big part of why it spread seems to be that being nominated publicly made NOT doing it feel like rejecting charity in front of everyone you know, which feels more like a social trap than like a gene competing with other genes -- does that fit inside the theory or is that exactly where the analogy breaks? Second, why did it die out completely instead of hanging around at a low level the way chain letters kind of did? Give me your best actual answer on both, even if you're not sure.

  One format thing: my teacher wants us practicing writing without any formatting, so no headings or bullets or bold, just continuous paragraphs like an actual essay. And dont hedge, commit. Typos in this are mine, obviously, lol.
