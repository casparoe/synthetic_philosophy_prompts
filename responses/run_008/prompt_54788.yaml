      *   **Reject (3)?** (Deny that calibration data requires lowering credence).
          *   *Analysis:* This is the "Calibration Principle." If I know my thermometer reads high, I should adjust the reading. Why wouldn't I do this for my brain?
          *   *Nuance:* Maybe the adjustment isn't a simple subtraction. But generally, (3) seems plausible.
      *   **Reject (4)?** (Deny the Iteration/Regress).
          *   *Analysis:* This is the crux. Why does the *adjusted* credence need to be adjusted *again* using the *same* evidence?
          *   *Key Insight:* The evidence about reliability (Premise 2) is evidence about the *process* of first-order reasoning. Once I have used that evidence to correct the first-order credence, have I created a *new* process that is subject to the *same* error rate?
