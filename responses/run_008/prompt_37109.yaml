answer: |-
  Your intuition is spot on: your friend's summary contains a direct contradiction, and it misrepresents Nozick's actual goal. You caught the exact glitch that makes the summary incoherent.

  Here is the untangling of what is fair to Nozick, what your friend garbled, and the status of the "closure" objection.

  ### 1. The Contradiction: Do we know we have hands or not?

  **Your Friend's Contradiction:**
  *   **Statement A:** "If you were a brain in a vat you'd still believe you have hands, so the theory says **you don't know you have hands**."
  *   **Statement B:** "You **can know you have hands**, and know that having hands means you're not a brain in a vat, but still not know you're not a brain in a vat."

  **The Correction:**
  Nozick is an **anti-skeptic**. His entire goal with the Tracking Theory was to explain how we *can* have knowledge of the external world even if skeptical scenarios (like the Brain-in-a-Vat) are logically possible.

  If Nozick's theory concluded "You don't know you have hands," it would be a skeptical theory. Nozick explicitly argues that **you do know you have hands.**

  **Where your friend got confused:**
  Your friend applied the "Brain-in-a-Vat" counterfactual to the proposition "I have hands."
  *   **Friend's logic:** To test "I know I have hands," look at the world where "I have hands" is false. The friend assumed the nearest world where you don't have hands is the *Brain-in-a-Vat* world. In that world, you still believe you have hands. Therefore, tracking fails.
  *   **Nozick's logic:** To test "I know I have hands," look at the *nearest* possible world where "I have hands" is false. Nozick argues the nearest world where you don't have hands is **not** a BIV world; it is a world where you lost your hands in an accident or were born without them. In *that* world, you would *not* believe you have hands. Therefore, you **track** the truth. Therefore, **you know you have hands.**

  However, when testing the proposition "I am not a Brain-in-a-Vat," the nearest world where *that* is false **is** the BIV world. In that world, you still believe you aren't a BIV. Therefore, you **do not track** that truth. Therefore, **you do not know you aren't a BIV.**

  **Verdict:** Your friend garbled the first half. Nozick says you *do* know you have hands.

  ### 2. The Closure Principle: Bug or Feature?

  **The Principle:**
  Epistemic Closure is the intuition that knowledge transfers through deduction.
  *   If I know $P$ ("I have hands")...
  *   And I know $P$ implies $Q$ ("If I have hands, I am not a BIV")...
  *   Then I must know $Q$ ("I am not a BIV").

  **Nozick's Stance:**
  Nozick **explicitly denies** the closure principle. He admits this is counterintuitive, but he argues it is the necessary price to pay to defeat skepticism.
  *   He accepts that knowledge is not closed under known implication.
  *   He argues our intuition that it *should* be closed is mistaken because it ignores the modal (counterfactual) structure of knowledge.

  **Is this a "Refutation"?**
  Your friend claims this is a "fatal flaw" that "refuted the theory on arrival." This is hyperbolic and historically inaccurate.
  *   **Not "On Arrival":** Nozick published *Philosophical Explanations* in 1981. The theory dominated epistemology for decades. It wasn't refuted immediately; it sparked a massive industry of "modal epistemology."
  *   **Not Necessarily "Fatal":** While many philosophers find denying closure unacceptable (it leads to weird results like "I know I'm in London, and I know London is in England, but I don't know I'm in England"), Nozick's move forced everyone to refine their definitions.
  *   **The Legacy:** Most contemporary epistemologists agree that Nozick was right about the *problem* (standard theories struggle with skepticism) but many think he was wrong about the *solution* (denying closure). This led to new theories like **Contextualism** (which tries to save closure by changing the context of "knows") or **Safety Theories** (like Sosa or Williamson), which try to fix the tracking conditions so closure is preserved.

  So, denying closure is a **major cost**, but calling it a "refutation" ignores that it was a deliberate, defended feature of his system that shaped 40 years of philosophy.

  ### 3. Summary of Corrections for Your Friend

  You can tell your friend this:

  1.  **You spotted the contradiction:** You are right. Nozick cannot say both "You don't know you have hands" and "You know you have hands but not that you're not a BIV."
  2.  **Nozick's Actual View:** Nozick says you **do** know you have hands. He distinguishes between the "nearest world where I have no hands" (amputation) vs. the "nearest world where I am a BIV." You track the first, but not the second.
  3.  **Closure:** Nozick didn't "fail" to notice closure; he **rejected** it on purpose. He thought saving knowledge from skepticism was more important than saving the closure principle.
  4.  **Refutation:** It wasn't refuted on arrival. It's considered a "bullet-biting" theory. Many philosophers think the bullet (denying closure) is too big to swallow, so they look for other theories, but Nozick's Tracking Theory remains a foundational reference point in epistemology.

  **The "TL;DR" fix:**
  Nozick says: "I know I have hands. I know hands imply I'm not a vat. But I *don't* know I'm not a vat. Logic is weird, but skepticism is worse." Your friend accidentally turned Nozick into a skeptic in the first half of their summary.
