      *   *Claim 2: Networks build an internal dictionary of human-understandable concepts.*
          *   **Status:** Partially true/Simplified. There is evidence of monosemantic features (features that mean one thing), but it's not a perfect "dictionary" yet.
      *   *Claim 3: Single neurons responded to unrelated things (polysemanticity), but "superposition" explained this.*
          *   **Status:** Accurate. This is a core concept in MI. Neurons are polysemantic; superposition explains how more features exist than neurons.
      *   *Claim 4: Sparse Autoencoders (SAEs) untangled the mess, so now we can read thoughts directly.*
          *   **Status:** Oversold. SAEs are a leading technique and show promise (e.g., Anthropic's work), but "read thoughts directly" implies a level of completeness and reliability we don't have. It's more like "finding hints of concepts" than "reading thoughts."
      *   *Claim 5: This proves networks represent the world *like we do* (same concepts).*
