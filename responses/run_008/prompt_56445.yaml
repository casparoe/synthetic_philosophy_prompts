prompt: |-
  I've been going down a rabbit hole about how AI actually works, and I want to run something by you because I can't tell how much to trust it. I don't have a CS background or anything, I just watch a lot of youtube videos about this stuff and read the occasional pop-science book.

  So I was listening to a podcast where the guest (some tech journalist promoting her book) explained what's going on inside neural networks, and I'll try to reproduce what she said since I can't find a transcript. Basically her claim was: for a long time people thought neural nets were inscrutable black boxes, but the field of mechanistic interpretability has now settled this. Researchers have shown that networks build an internal dictionary of human-understandable concepts, and for a while it was messy because a single neuron would respond to several unrelated things at once, but then they discovered "superposition," and after that came sparse autoencoders, which untangle the mess, so now we can basically read a network's thoughts directly — open it up and see the concept it's using, like there's genuinely a "cat feature" in there when it recognizes cats. And her big takeaway was that this settles an old philosophical argument: the network doesn't just do statistics on pixels, it represents the world the same way we do, it literally has concepts like ours, so the "it's just matrix multiplication with no understanding" crowd has been proven wrong.

  Some of this sounded really satisfying to my layman ears, but other parts felt suspiciously tidy? Like, "read its thoughts directly" seems strong, and I remember one video saying the superposition stuff actually made interpretability HARDER, not that it got resolved and everything clicked into place. And the "concepts exactly like ours" leap at the end gave me pause even though I kind of want it to be true. Can you go through her summary and tell me which parts a researcher in this area would actually stand behind, which parts are simplifications, and which are just wrong or oversold? And separately — even if the accurate parts are true, does her conclusion that machines "represent the world like we do" actually follow from them, or is she sneaking in a bigger claim than the research supports? Sorry if this is basic, it's just hard to find takes on this that aren't either hype or doomerism.
reasoning: |-
