      *   (5) **The Critical Leap:** Purple Mailbox ($\neg B a \land \neg R a \land \neg W a \land \neg C a \dots$) confirms $\forall x (R x \rightarrow B x)$ AND $\forall x (R x \rightarrow W x)$ AND $\forall x (R x \rightarrow C x)$.
      *   (6) Incompatible Hypotheses: One observation confirms mutually exclusive claims.
