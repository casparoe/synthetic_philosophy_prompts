          *   *Pros:* Keeps logic mostly intact, adds quantitative nuance.
          *   *Cons:* Still admits *some* confirmation, just very little.
      *   **Route 3: Reject Equivalence (Scheffler).**
          *   *Price:* Logic becomes intensional. "All R are B" is not confirmed the same way as "All non-B are non-R".
          *   *Solution:* Selective Confirmation. A black raven confirms "All R are B" but does *not* confirm "All non-B are non-R" in the same way (it falsifies the contrary of the first, but not the second).
