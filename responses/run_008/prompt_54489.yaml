  **The Winter Fleet, 1900**

  The manager counts the cost in **current**,
  watching snow bury the electric **flame**.
  One cab stalled hard on the cobble **street**,
  a frozen battery beneath the **hand**.
  The gasoline rival waits without **choice**,
  smelling of oil, ready to turn the **wheel**.

  Nothing moves forward except the **wheel**,
  driven by explosions of **current**,
  while the silent rival loses **choice**.
  The winter kills the battery's **flame**,
  leaving the contract in the manager's **hand**,
  signed for the noise that will rule the **street**.

  Now smoke will choke the artery **street**,
  pumps rise where charging stations turned the **wheel**,
  infrastructure heavy as a **hand**
  that squeezes the grid, starving the **current**.
  We forget the quiet, extinguished **flame**,
  tell ourselves there was never a **choice**.

  But history is a muscle in the **hand**,
  flexing to grip whatever fills the **street**.
  If the snow had missed, if the hidden **flame**
  of the motor had held, spun another **wheel**,
  would we breathe cleaner **current** now? No **choice**
  remains to test the counterfactual **hand**.

  The form repeats what the first line chose: **choice**
  is an echo. The syntax locks the **hand**
  to the verb. We cannot swap out **current**
  for water, or widen the narrow **street**.
  The poem runs on the tracks of the **wheel**,
  returning to the source of the **flame**.

  Replay the tape. If we change the **street**,
  does the **current** find a different **flame**?
  No. The **wheel** turns only where the **hand**
  guides it. There is no other **choice**.
  This lock-in is the poem's **current**:
  six words fixed, determining the end.
