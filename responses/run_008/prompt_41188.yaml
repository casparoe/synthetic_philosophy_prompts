answer: |-
  # P&T Sequential Decision Protocol (P&T-SDP)

  ### 1. The Formulary Decision Ledger (FDL)
  Every final vote must be recorded in the FDL with the following mandatory fields:
  *   **Decision ID:** (e.g., 2023-04-PPI)
  *   **Action:** (Add, Restrict, Switch Preferred, Remove)
  *   **Primary Trade-off:** (e.g., Cost Savings vs. Formulary Breadth; Safety Profile vs. Acquisition Cost)
  *   **Deciding Evidence:** (Citation of key studies or cost models used)
  *   **Review Conditions:** (Specific triggers required to revisit this decision, e.g., "Generic availability," "New FDA black box warning," "Cost differential exceeds 15%")
  *   **Sunset Date:** (Automatic review date, default 24 months)

  ### 2. Motion Intake & Precedent Check
  Before a motion is debated, the Chair or Designated Secretary must perform a Precedent Check against the FDL (rolling 24-month window).
  *   **Match Found:** If the current motion proposes a decision on the same drug class and relies on the same Primary Trade-off as a previous entry, the motion is **Blocked**.
  *   **Blocking Statement:** The Chair must read: *"We already answered this. Decision ID [XYZ] settled this trade-off on [Date]. To reopen, you must meet the Review Conditions listed in the Ledger or demonstrate a Material Change in Evidence."*
  *   **No Match:** The motion proceeds to debate.

  ### 3. The Material Change Test
  To override a Block or revisit a decision before its Sunset Date, the proponent must pass the Material Change Test.
  *   **Evidence Change:** New clinical data must alter the risk/benefit profile significantly (e.g., new safety signal, new indication) OR cost data must shift the economic model by >10%.
  *   **Value Change:** The committee must explicitly vote that hospital strategic values have shifted (e.g., from "Cost Minimization" to "Risk Mitigation").
  *   **Failure:** If the test fails, the motion is tabled until the Sunset Date.

  ### 4. The Value Judgment Flag
  If debate reveals that evidence is equivalent between options (e.g., Drug A and Drug B are clinically identical and cost-neutral), the procedure cannot decide the winner.
  *   **Action:** The Chair declares a **Value Judgment Flag**.
  *   **Protocol:** The committee must vote on the *criteria* for selection (e.g., "We prefer the manufacturer with local supply chain reliability") rather than the drug itself. This criteria is recorded in the FDL under "Deciding Evidence" as "Operational Preference."
  *   **Restriction:** This criteria binds future decisions until voted otherwise.

  ### 5. The Honorable Reopening Protocol
  If the Material Change Test is passed because previous evidence was misunderstood or unavailable, the committee must acknowledge the error to prevent gaslighting the record.
  *   **Requirement:** The FDL entry for the *new* decision must include a "Lessons Learned" field.
  *   **Statement:** "This decision overrides Decision ID [XYZ]. The previous decision was based on [Evidence X], which is now superseded by [Evidence Y]. The previous switch incurred estimated costs of $[Z]."
  *   **Purpose:** To distinguish rational updating from irrational cycling.

  ***

  ### Protocol Limitations & Philosophy

  **Which tests are judgment dressed up as a rule?**
  The **Material Change Test** is judgment dressed as a rule. The threshold of ">10% cost shift" or "significant safety signal" requires human interpretation. A determined committee can manipulate what counts as "significant." This procedure does not solve human bias; it forces bias to be explicit. By requiring a vote on "Value Change," we force the committee to admit they are changing their minds about what matters, rather than pretending the data changed when it did not.

  **Does this procedure treat meetings as free-standing or bind us to plans?**
  This procedure **binds the committee to plans**. Each meeting's choice is not free-standing; it is a conditional commitment to future behavior (the "Review Conditions" and "Sunset Date").
  *   **Why:** Free-standing choices allow intransitivity (A > B, B > C, C > A) because context shifts between meetings. Binding the committee to a plan (e.g., "We prefer Drug A *unless* safety data changes") prevents money pumps. It sacrifices some flexibility to ensure consistency. If you want to avoid being led in circles, you must restrict your future selves' ability to vote on whim.

  ***

  ### Case Application 1: The Manufacturer Push
  **Scenario:** A manufacturer representative requests a switch to their Proton-Pump Inhibitor (PPI). The cost-effectiveness trade-off is identical to one declined six months ago (Decision ID 2023-02-PPI).
  **Procedure Run:**
  1.  **Motion Intake:** Proponent moves to switch preferred PPI to Manufacturer X.
  2.  **Precedent Check:** Secretary searches FDL. Finds Decision ID 2023-02-PPI (Date: 6 months ago).
  3.  **Comparison:**
      *   Class: PPI.
      *   Trade-off: Cost vs. Formulary Breadth.
      *   Outcome: Switch declined.
      *   Review Conditions: "Generic availability" or "Cost differential >15%".
  4.  **Material Change Test:** Proponent offers same cost model, adjusted for minor rebate. Cost differential is 3%. No new safety data.
  5.  **Outcome:** **Motion Blocked.**
  6.  **Chair Statement:** *"We already answered this. Decision ID 2023-02-PPI settled this trade-off on [Date]. To reopen, you must meet the Review Conditions listed in the Ledger (Cost differential >15%) or demonstrate a Material Change in Evidence. Current data does not meet this threshold."*
  7.  **Result:** No vote taken. Meeting time saved. Cycle prevented.

  ### Case Application 2: The Safety Data Reopening
  **Scenario:** New comparative safety data emerges favoring Drug B, which was removed two years ago in a cost-driven switch to Drug A (Decision ID 2021-05-ONC). The switch to Drug A saved money but now appears to have increased adverse event monitoring costs.
  **Procedure Run:**
  1.  **Motion Intake:** Proponent moves to reinstate Drug B as preferred agent.
  2.  **Precedent Check:** Secretary finds Decision ID 2021-05-ONC.
  3.  **Comparison:**
      *   Class: Oncology Support.
      *   Trade-off: Acquisition Cost vs. Safety Profile.
      *   Outcome: Drug A preferred (Cost wins).
      *   Review Conditions: "New safety data."
  4.  **Material Change Test:** Proponent presents new Phase IV data showing statistically significant increase in adverse events for Drug A.
  5.  **Outcome:** **Test Passed. Motion Proceeds.**
  6.  **Debate:** Committee acknowledges the new data invalidates the safety assumptions of the 2021 decision.
  7.  **Vote:** Committee votes to switch back to Drug B.
  8.  **Honorable Reopening Protocol:** Secretary records new Decision ID 2023-10-ONC.
      *   **Lessons Learned Field:** *"This decision overrides Decision ID 2021-05-ONC. The previous decision was based on [Phase III Data], which is now superseded by [Phase IV Safety Data]. The previous switch incurred estimated costs of $150,000 in adverse event management plus switching costs."*
  9.  **Result:** Question reopened honestly. The record reflects that the earlier switch was a mistake given current knowledge, preventing the committee from pretending the new decision is "business as usual." The cost is acknowledged as the price of updated evidence, not procedural failure.
