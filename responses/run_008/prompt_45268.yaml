      *   **Tone/Style:** Analytical, rigorous, honest about tensions/trade-offs, avoiding pre-packaged answers. "Spec first, not the answers."
      *   **Specific Constraints:**
          *   Must address specific "glossed over" issues (territory vs. right, recursive minorities, remedial vs. primary right, franchise, aftermath/recognition, neutrality).
          *   Must flag incompatible pairs of requirements (trade-offs).
          *   Must identify the single requirement that does the most damage to main contenders (remedial, national, plebiscitary).
          *   Must distinguish between genuine normative requirements and preferences of existing liberal democratic states.
      *   **Context:** Scotland/Catalonia/Quebec style (democratic, non-colonial, internal secession).

  2.  **Deconstruct the Requirements (Drafting the List):**
      *   *Requirement 1: Territory vs. People.* The prompt explicitly asks for this. A theory can't just say "people can leave." It must justify why *this specific land* goes with them. The status quo state has a claim too.
      *   *Requirement 2: The Recursive Minority Problem.* If Region A leaves State X, Region B inside Region A might want to stay with State X. Does the theory allow B to secede from A? If not, why was A's secession from X okay?
      *   *Requirement 3: Remedial vs. Primary Right.* Is suffering required? Or is choice enough? The theory needs a clear bar.
      *   *Requirement 4: The Franchise (Who Votes?).* This is crucial. Residents? Citizens? Ethnic kin? Past residents? The "demos" problem.
      *   *Requirement 5: Post-Secession Obligations.* Can the theory stop at the "right to leave"? Or must it account for debt, assets, citizenship, borders?
      *   *Requirement 6: Recognition vs. Right.* The gap between moral right and international recognition (Kosovo vs. Crimea).

  3.  **Refining the Requirements (Adding Depth & "Glossed Over" Nuance):**
      *   *Refining Req 1 (Territory):* Call it the "Jurisdictional Claim." It's not just land; it's the authority over the land.
      *   *Refining Req 2 (Minorities):* Call it the "Nested Demos Problem." Focus on the asymmetry of justification.
      *   *Refining Req 3 (Grievance):* Call it the "Threshold of Justification."
      *   *Refining Req 4 (Franchise):* Call it the "Boundary of the Electorate."
      *   *Refining Req 5 (Aftermath):* Call it the "Terms of Divorce."
      *   *Refining Req 6 (Recognition):* Call it the "International Stability Constraint."

  4.  **Identifying Tensions/Incompatibilities:**
      *   *Plebiscite vs. Minority Protection:* If 51% of Region A can leave, 51% of Sub-region B should theoretically be able to stay. But if B stays, A might be unviable. Clean plebiscites crush nested minorities.
      *   *Territorial Integrity vs. Self-Determination:* You can't maximize both.
      *   *Remedial Only vs. Democratic Will:* If you require oppression, you ignore democratic will. If you allow democratic will, you risk trivial secession.
      *   *Franchise Definition:* If you let everyone affected vote, the electorate is infinite. If you restrict it to current residents, you ignore historical claims.

  5.  **Selecting the "Killer" Requirement:**
      *   Which one knocks out the most theories?
      *   *Remedial theories* fail on the "Democratic Will" aspect (Quebec/Scotland aren't oppressed).
      *   *Plebiscitary theories* fail on the "Nested Minority" aspect (What about the 40% who voted No?).
      *   *National Self-Determination* fails on the "Franchise/Territory" aspect (Who counts as the nation?).
      *   *Decision:* The **Nested Demos/Recursive Minority** requirement is the strongest critic. It exposes the arbitrariness of *any* border drawn for a vote. It hits plebiscitary theories hardest (why is *this* majority sacred?) but also hurts remedial theories (what if the oppressed group contains an oppressed sub-group?). Let's go with the **Recursive Minority Problem** as the biggest hurdle for *coherence*, but the **Territory vs. People** distinction is the biggest hurdle for *legitimacy*. The prompt asks for the one that knocks out main contenders. The Recursive Minority problem is the standard philosophical objection to plebiscitary theory. The Territory problem is the standard objection to all of them. Let's choose **The Territory/People Distinction** as the "Killer" because without it, the vote is meaningless. Actually, re-reading the prompt's emphasis on the recursive minority ("manufactures a brand-new minority"), that seems to be the user's specific pain point. I will highlight the **Recursive Minority/Nested Demos** requirement as the one that creates the hardest logical paradox.

  6.  **Distinguishing Genuine Requirements vs. State Preferences:**
      *   *State Preference:* Stability, existing borders (uti possidetis), debt repayment, monopoly on violence.
      *   *Genuine Requirement:* Non-domination, democratic consistency, protection of basic rights.
      *   Need to be honest: International law favors existing states. A *moral* theory might not.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the task. Set the stage.
      *   *The Specs:* Go through the 6 points requested, fleshing them out with the "why it matters."
      *   *The Tensions:* Explicitly pair them off. Plebiscite vs. Minority is the big one.
      *   *The Killer:* Identify the Recursive Minority requirement.
      *   *The Honesty Check:* Separate "Liberal State Interests" from "Normative Justice."

  8.  **Review against Constraints:**
      *   Did I answer the specific bullet points? Yes (Territory, Minority, Remedial, Franchise, Aftermath, Recognition).
      *   Did I flag incompatible pairs? Yes.
      *   Did I identify the "knockout" requirement? Yes.
      *   Did I distinguish requirements vs. preferences? Yes.
      *   Is it speculative/criteria-focused rather than giving the "answer"? Yes.

  9.  **Final Polish:** Ensure the tone is sharp and philosophical but accessible. Avoid jargon where possible, or define it. Make sure the distinction between "Right to Secede" and "Right to Territory" is clear, as the user highlighted it. (Self-Correction: Make sure to emphasize that *recognition* is political, while *right* is moral, and the theory needs to bridge or explain that gap).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a request for a specification document, not a verdict. You want the architectural constraints for a theory of secession before you let the philosophers move into the building.

  Here are the six requirements an adequate theory must meet, followed by the incompatibilities, the "killer" constraint, and an honesty check on where these requirements come from.

  ### The Specifications

  **1. The Jurisdictional Claim (Territory vs. People)**
  *   **The Requirement:** The theory must distinguish between the right of a *group* to dissociate and the right of that group to take *specific land* with them. It must provide a metric for why the secessionists have a stronger claim to the soil than the rump state.
  *   **The Case:** A group of people can always pack up and move (emigration). Secession is distinct because it involves changing the sovereignty over a fixed geographic space. If the theory only justifies the people leaving, it justifies emigration, not secession. If the state claims the land based on historical investment, infrastructure, or prior sovereignty, the secessionist theory needs a counter-claim (e.g., indigenous title, historical borders, or "land goes with the majority will"). Without this, the vote is advisory only.

  **2. The Recursive Minority (The Nested Demos Problem)**
  *   **The Requirement:** The theory must explain the status of minorities *within* the seceding region who wish to remain with the original state. It must state whether the right to self-determination applies recursively (can the sub-region secede from the new state?) or if it stops at one level. If it stops, it must justify why the parent state's "you lost the vote" argument is invalid while the seceding region's "you lost the vote" argument is valid.
  *   **The Case:** If 55% of Catalonia votes to leave Spain, but 90% of a specific Catalan comarca votes to stay in Spain, a theory that relies on "majority will" creates a new tyranny. If the theory says the comarca is stuck, it must explain why the principle of democratic self-determination suddenly ceases to apply at the municipal level. If it says they can leave, it risks infinite fragmentation (the "matryoshka doll" problem).

  **3. The Threshold of Justification (Remedial vs. Primary)**
  *   **The Requirement:** The theory must define the bar for entry. Is secession a *remedial right* (only permissible to escape persecution, cultural destruction, or systematic exploitation) or a *primary right* (permissible simply because a majority desires it, akin to divorce)?
  *   **The Case:** Scotland and Quebec are not being genocided; they are functioning democracies. A strictly remedial theory (like many in international law) renders their claims illegitimate. A pure primary right theory makes borders entirely volatile. An adequate theory must explain why economic/cultural preference is either sufficient or insufficient grounds for breaking a political union, and where the line is drawn.

  **4. The Boundary of the Electorate (The Franchise)**
  *   **The Requirement:** The theory must define *who* constitutes the "self" in self-determination. Does the franchise include only current residents? Citizens born there living elsewhere? Recent immigrants? People who would move there if independence happened?
  *   **The Case:** In Brexit, EU citizens living in the UK could vote, but UK citizens living in the EU for >15 years could not. In Quebec, the "people" is debated: is it all residents of Quebec, or the French-speaking nation? If you restrict the vote to "historic" populations, you risk ethnic cleansing via franchise. If you open it to "all affected," the electorate becomes global (since everyone is affected by border changes). The theory needs a non-arbitrary rule for who holds the pen.

  **5. The Terms of Divorce (Post-Secession Obligations)**
  *   **The Requirement:** The theory cannot stop at the moment of border creation. It must account for the allocation of assets, debt, citizenship, and security. It must determine if the rump state has veto power over the *terms* of secession, even if it lacks veto power over the *fact* of secession.
  *   **The Case:** If a region secedes but refuses to take on a share of the national debt, or claims all offshore oil reserves, the rump state is harmed. A theory that grants a right to secede without a corresponding duty to negotiate fair terms is a theory of theft. Conversely, if the rump state can set punitive terms (e.g., "You can leave but you lose all citizenship rights"), the right to secede is illusory.

  **6. The Recognition Gap (Right vs. Fact)**
  *   **The Requirement:** The theory must address the disconnect between moral legitimacy and international recognition. It must explain why two unilateral declarations (e.g., Kosovo vs. Crimea) are treated differently, or admit that it cannot.
  *   **The Case:** International law is contradictory. It supports self-determination but also territorial integrity. A theory that says "If X conditions are met, secession is just" fails if it cannot explain why the international community recognizes some just secessions and sanctions others. Does the theory care about geopolitical stability? If so, it's not purely moral. If not, it's politically irrelevant.

  ***

  ### The Incompatible Pairs (Trade-offs)

  You cannot maximize all six. Here are the critical tensions:

  **1. The Plebiscite vs. The Recursive Minority**
  *   **Conflict:** You cannot have a clean, one-time majority vote *and* robust protection for internal minorities simultaneously.
  *   **Why:** If the rule is "50% + 1 decides," then the sub-region minority is crushed. If the rule is "sub-regions can opt out," then the original majority is crushed (they might lose the territory they need for viability).
  *   **Which Bends:** Most theories bend on the **Recursive Minority**. They accept that creating a new minority is an unfortunate cost of self-determination. To satisfy the Recursive Minority requirement fully, you essentially ban secession unless borders are drawn perfectly along ethnic lines (which is impossible) or you allow infinite fragmentation (which creates unviable micro-states).

  **2. Primary Right vs. Territorial Integrity**
  *   **Conflict:** You cannot have a low bar for secession (Primary Right) and stable international borders (Territorial Integrity).
  *   **Why:** If any region can leave simply because it wants to, borders become temporary administrative lines. This undermines the long-term investment and trust required for a welfare state or national defense.
  *   **Which Bends:** Liberal democratic states bend on **Primary Right**. They prefer Remedial theories because they protect the state's existence. Secessionist movements bend on **Territorial Integrity**, arguing that democracy trumps stability.

  **3. The Franchise vs. The Jurisdictional Claim**
  *   **Conflict:** You cannot define the electorate purely by residence *and* claim the territory based on historical nationhood.
  *   **Why:** If the claim is "This is the historic land of the Scots," then Scots living in London should vote. If the claim is "Everyone living here decides their future," then recent immigrants who don't identify with the nation have equal veto power.
  *   **Which Bends:** Most modern theories bend toward **Residence**. It is administratively cleaner and less ethno-nationalist, but it weakens the "National Self-Determination" argument.

  ***

  ### The "Killer" Requirement

  If I have to pick the single requirement that does the most damage to the main contenders, it is **Requirement #2: The Recursive Minority (Nested Demos).**

  *   **Why it knocks out Plebiscitary Theories:** These theories argue that democracy requires letting people choose their government. But the Recursive Minority problem shows that *any* boundary for the vote is undemocratic to those on the losing side of that boundary. If democracy is the value, why does the democracy of the Region trump the democracy of the Sub-region? Plebiscitary theory has no non-arbitrary answer for where the vote stops.
  *   **Why it knocks out National Self-Determination Theories:** These argue that "nations" deserve states. But nations are rarely geographically pure. There are always "stranded" nationals in the rump state and "outsiders" in the seceding region. The theory cannot explain why the nation's claim to the land overrides the individuals living on it who don't identify with the nation.
  *   **Why it knocks out Remedial Theories:** Even if a region is oppressed, there may be sub-groups within it who are *not* oppressed and do not wish to leave. A remedial right for the region effectively forces these sub-groups into a new state against their will, potentially replicating the oppression they fled.

  This requirement exposes that **there is no neutral unit of analysis.** Choosing the region as the voting unit is already a political act that privileges one group over another.

  ***

  ### Honesty Check: Requirements vs. State Preferences

  You asked to distinguish between genuine normative requirements and the preferences of liberal democratic states. Here is the split:

  **Genuine Normative Requirements (Justice-based)**
  *   **Non-Domination:** No group should be subject to rules they had no hand in making without recourse. (Supports secession).
  *   **Protection of Basic Rights:** Minorities (both inside the seceding region and the rump state) must not have their human rights violated by the border change.
  *   **Consistency:** The moral logic used to justify the secession must apply equally to sub-regions. (The Recursive Minority requirement).

  **Liberal Democratic State Preferences (Stability-based)**
  *   **Uti Possidetis (Existing Borders):** States prefer the rule that "old administrative borders become new international borders." This is not moral; it is a heuristic to prevent war. A genuine theory might say borders should follow ethnic lines; states say they should follow map lines to avoid bloodshed.
  *   **Debt and Asset Continuity:** States insist the new state inherits a share of the debt. While fair, this is often enforced to punish secessionists. A genuine theory might say debt is tied to the *people*, not the *land*, or vice versa.
  *   **The "Recognition" Barrier:** States prefer to make recognition political (Kosovo vs. Crimea) rather than legal. They want the discretion to recognize allies and ignore enemies. A genuine theory would demand recognition be automatic if criteria are met.
  *   **High Bar for Entry:** States prefer Remedial theories only. They will never accept a Primary Right theory because it threatens their own existence.

  **The Verdict on the Spec:**
  If you write a theory that satisfies the **Recursive Minority** requirement and the **Jurisdictional Claim** requirement, you will likely conclude that unilateral secession is almost never legitimate. If you write a theory that satisfies the **Primary Right** and **Plebiscite** intuitions, you will likely violate the **Recursive Minority** requirement.

  The philosophers you are about to read generally pick a side in that trade-off and try to hide the cost. Your job is to see which cost they are hiding.
