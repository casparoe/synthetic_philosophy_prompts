prompt: |-
  i'm trying to figure out what i actually think about scotland/catalonia/quebec-style secession before i go read the actual philosophers, and i want the spec first, not the answers. so: what does a theory of secession and self-determination have to get right to count as adequate? give me the requirements with the case or consideration behind each one, and i want you to take seriously the stuff people usually gloss over, e.g.:

  - the difference between having a right to secede and having a claim to the *territory* you'd take with you -- the state you're leaving presumably has some story about why that land is its land, and a theory that only talks about who gets to vote has silently answered a different question
  - the fact that a majority vote in the seceding region manufactures a brand-new minority that just got outvoted, and the theory has to say whether that minority gets to secede in turn, recursively, or is stuck. think about how a theory handles a sub-region that votes 90% to stay with the old state -- does the theory owe them anything, or does "you lost the vote" do all the work, and if so why was that answer bad when the parent state gave it?
  - whether the bar is different for a region with a remedial grievance (being conquered, being systematically excluded) vs. a region that's doing fine and just wants out
  - who counts in the referendum franchise at all -- long-term residents born elsewhere, recent arrivals, people who left, people who'd move there if the border changed
  - whether the theory has to say anything about the aftermath -- citizenship, the national debt, the currency, who gets the military bases -- or whether that's somebody else's problem and it's fine for the theory to stop at the border, so to speak
  - whether it can stay neutral between "who may secede" and "who must be recognized once they do" -- kosovo vs crimea, roughly: both unilateral, one recognized and one not. if your theory can't explain the difference between those, say so

  then flag which pairs of requirements you suspect can't be jointly satisfied -- like, can you have both a clean plebiscitary rule and real protection for internal minorities, or does one have to bend, and which one should it be? and tell me which single requirement on your list does the most to knock out the main contenders (remedial-right-only theories, national self-determination theories, bare plebiscitary theories). dont do a full scorecard, i just want the criteria and the reasoning behind them, the scoring can come later. and be honest about which of your requirements are genuine requirements and which are really just preferences of the liberal democratic states that happen to be writing the rules.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

