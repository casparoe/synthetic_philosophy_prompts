answer: |-
  # Joint Statement on the Value of Originals, Copies, and Reconstructions

  **Preface**
  This document records the outcomes of a year-long adversarial collaboration between proponents of Aesthetic Empiricism and proponents of Artistic Historicism. Our goal was not to secure a surrender from either side, but to map the topology of our disagreement with greater precision than previous debates have allowed. We acknowledge that the standard examples (the perfect fake, the indistinguishable copy) have exhausted their utility. Consequently, we have structured this statement around newer, harder cases that stress our respective theories. We sign this as colleagues who respect the integrity of the opposing position, acknowledging that our divergence rests on foundational commitments regarding the nature of art and value, not on simple errors of fact.

  ### A. Agreed Claims

  We affirm the following six claims as common ground. Each is substantive and necessary for the subsequent disagreement to be meaningful.

  1.  **The Ethical/Epistemic Distinction:** The wrongness of forgery or deceptive attribution is primarily ethical and epistemic (a lie about origin), not necessarily aesthetic. A deceptive fake is morally culpable even if it is aesthetically superior to the original it mimics.
  2.  **Market Irrelevance:** Market value is a composite of scarcity, provenance, investment potential, and aesthetic regard. High auction prices for originals do not constitute evidence of superior aesthetic value compared to indistinguishable copies.
  3.  **Cognitive Penetration:** Knowledge of an object's history causally alters the perceptual experience of a suitably situated observer. We agree that telling a viewer a work is a fake changes how they see it, even if the physical object remains unchanged.
  4.  **The Limits of Blind Testing:** The inability of experts to distinguish originals from high-quality copies in blind tests demonstrates a limit on human discrimination, but it does not logically prove that historical properties are irrelevant to value.
  5.  **Instrumental Preservation:** Both camps agree that physical preservation of original artifacts is instrumentally vital. Even if a copy could theoretically replace the aesthetic experience, the original remains the primary evidence for historical research and the anchor for cultural continuity.
  6.  **Non-Verbal Core:** While terminological confusion exists (see Section B), we agree that our dispute is not *merely* verbal. Even if we standardized our definitions of "aesthetic value," we would still disagree on whether historical facts should normatively count toward the evaluation of the work.

  ### B. Disagreements Table

  In this section, we record our residual disagreements. We have included the three specific cases mandated by our collaboration to demonstrate how our theoretical divergences apply in practice. We have also addressed the extent to which our debate is verbal.

  | Issue | Aesthetic Empiricist Position | Artistic Historicist Position |
  | :--- | :--- | :--- |
  | **Constitution of Value** | Aesthetic value supervenes on the intrinsic, perceptible properties of the object as experienced. If two objects afford identical experiences to a suitably situated observer, they possess equal aesthetic value. | Aesthetic value is partly constitutive of the work's history. The value includes the *achievement* of the artist. Two objects affording identical experiences may differ in value if one represents a genuine achievement and the other a mimicry. |
  | **Case 1: The Studio**<br>(Master supervised assistant's execution) | If the master's supervision ensured the visual result matches the master's intentional composition, the aesthetic value is intact. Relabeling is for historical accuracy, not aesthetic downgrade. The master "performed" the work via direction. | The physical execution is part of the performance. Dilution of the master's hand reduces the work's status as an autograph achievement. Relabeling acknowledges a loss in the specific artistic value of *this* object, even if the design is the master's. |
  | **Case 2: The Reconstruction**<br>(Destroyed fresco printed on new plaster) | If the visual experience is continuous with the pre-fire state, the aesthetic function is restored. The loss is historical (the original material is gone), not aesthetic (the experience is recovered). | The causal chain linking the object to the artist's action is severed. What remains is a replica, not the work. The loss is the *identity* of the work itself, which depends on its specific history of production. |
  | **Case 3: The Synthetic**<br>(AI generates preferred work in period style) | If experts prefer the AI work blind, it possesses higher aesthetic value. The source (algorithm vs. human) is irrelevant to the quality of the experience provided. | The work lacks the human intentionality required for art of this kind. It is a simulacrum of style without the communicative act. Preference for it indicates a success of simulation, not a success of art. |
  | **Verbal Dispute Status** | **Partly Verbal:** We agree that confusion arises because Empiricists often use "aesthetic value" to mean "value of the experience," while Historicists use it to mean "value of the artistic performance." | **Partly Verical, Mostly Substantive:** Aligning terminology helps, but does not resolve the conflict. Even if we agree to call it "artistic value," Empiricists will still argue history should not weigh on the score, while Historicists insist it must. |

  ### C. Cruxes

  We identify two fundamental subquestions (cruxes) that underlie the disagreements listed above. Settling these would significantly shift the dialectic.

  **Crux 1: The Normative Weight of Testimony**
  *Question:* Is reliance on historical testimony (provenance, attribution) a defect in the aesthetic judge, or a feature of the practice?
  *   *Empiricist Lean:* Reliance on testimony suggests the visual properties are insufficient to sustain value on their own. Ideal judgment should be autonomous.
  *   *Historicist Lean:* Art is a communicative practice embedded in history. Ignoring testimony is like ignoring the context of a speech act; it is a category error, not a virtue.

  **Crux 2: The Ontology of Aesthetic Properties**
  *Question:* Are "performance facts" (who made this, how, and when) themselves aesthetic facts, or are they a different kind of value (historical/cognitive) that we mistakenly conflate with aesthetics?
  *   *Empiricist Lean:* Performance facts are cognitive context. They may enhance enjoyment, but they are not *aesthetic* properties like balance, color, or form.
  *   *Historicist Lean:* Performance facts are constitutive of aesthetic properties. "Boldness" or " delicacy" are not just visual patterns; they are records of human action. A machine pattern cannot be "bold" in the same sense.

  ### D. Tests and Predictions

  For each crux, we propose a concrete test, argument, or case. We record our predictions in advance. We acknowledge that if both parties predict the same outcome, the crux is not load-bearing for our disagreement.

  **Test for Crux 1 (Testimony-Dependence): The Longitudinal Blind Study**
  *   **Method:** Select a set of works where attribution is currently disputed (e.g., workshop vs. master). Have experts evaluate them blind, then with full provenance revealed. Track whether the *description* of the visual properties changes, or only the *valuation*.
  *   **Empiricist Prediction:** The valuation will shift significantly with provenance, but the description of visual properties (e.g., "the brushwork is hesitant") will remain constant or be revealed as projected bias. This proves history biases judgment rather than revealing new aesthetic facts.
  *   **Historicist Prediction:** The description of visual properties will change (e.g., "hesitant" becomes "deliberately understated") because the historical knowledge alters the perception itself (cognitive penetration). This proves history is constitutive of the aesthetic experience.
  *   **Load-Bearing Status:** High. If descriptions do not change, Empiricism gains ground. If descriptions change systematically, Historicism gains ground.

  **Test for Crux 2 (Performance Facts): The Gradual Degradation Thought Experiment**
  *   **Method:** Consider a continuum of cases regarding the "Studio Case."
      *   *Stage A:* Master paints 100%.
      *   *Stage B:* Master paints 90%, assistant 10% (background).
      *   *Stage C:* Master paints 50%, assistant 50% (under close supervision).
      *   *Stage D:* Master paints 10%, assistant 90% (under close supervision).
      *   *Stage E:* Master paints 0%, assistant 100% (under close supervision).
      *   *Stage F:* Master paints 0%, machine 100% (under close supervision of output).
      *   Ask: At which stage does the *aesthetic value* drop, assuming the visual result is identical at all stages?
  *   **Empiricist Prediction:** Aesthetic value remains constant across all stages (A–F) because the visual result is identical. Any drop in value is purely historical/collectible value, not aesthetic.
  *   **Historicist Prediction:** Aesthetic value declines gradually or hits a tipping point (likely between C and D) because the density of the human performance decreases. At Stage F, aesthetic value collapses because the category of "artistic action" is voided.
  *   **Load-Bearing Status:** Critical. This isolates whether "human performance" is a variable in the aesthetic equation or external to it.

  **Test for Case 3 (The Synthetic): The "Post-Reveal" Preference**
  *   **Method:** Present viewers with an AI work and a Human work of indistinguishable quality. Reveal the origin. Ask viewers if they wish to revise their preference *after* knowing the origin, assuming no ethical concern about deception (both are honestly labeled).
  *   **Empiricist Prediction:** Preferences will remain stable. Once the ethical issue of deception is removed, the origin is irrelevant to the enjoyment of the visual properties.
  *   **Historicist Prediction:** Preferences will shift significantly toward the Human work. Viewers will report that knowing the work is AI-generated diminishes the experience of "connection" or "meaning," which are aesthetic components.
  *   **Load-Bearing Status:** High. This tests whether "meaning derived from origin" is an aesthetic component or an external add-on.

  ***

  **Closing Remark**
  We acknowledge that these tests may not end the debate. The Empiricist may interpret a shift in preference as a non-aesthetic bias; the Historicist may interpret stability as a failure of viewer education. However, by isolating these predictions, we move from arguing past each other to identifying exactly where our intuitions about art diverge. We recommend these cases as the new standard curriculum for future inquiry.
