answer: |-
  You and your flatmate have accidentally recreated one of the most active debates in contemporary epistemology. You aren't just arguing about chores; you are arguing about the semantics of knowledge attributions.

  The overarching name for the phenomenon you are describing is **Pragmatic Encroachment**.

  This is the view that practical factors (like stakes, costs, and risks) can "encroach" on the epistemic domain, affecting whether a true belief counts as knowledge. However, philosophy distinguishes between *why* this happens. Based on the specific patterns you noticed (especially whose stakes matter and the "fixable error" case), you can break this down into three competing concepts.

  Here is the breakdown of the concepts, how they map to your observations, and how to use them to settle the argument.

  ### 1. The Core Concept: Subject-Sensitive Invariantism (SSI)
  **Also known as:** Interest-Relative Invariantism (IRI).
  **Key Proponent:** Jason Stanley (*Knowledge and Practical Interests*, 2005).

  This is the strongest match for your flatmate's behavior. SSI argues that whether someone *knows* something depends on the **subject's** practical interests.

  *   **The Theory:** Two people can have the exact same evidence and the exact same level of confidence (credence), but one knows and the other doesn't, purely because the cost of being wrong is higher for one of them.
  *   **Mapping to your argument:**
      *   *Same evidence, different stakes:* This is the textbook definition of SSI. Your flatmate admits her confidence is the same, but withdraws the knowledge claim when the stakes rise. An SSI theorist says she is correct: she literally *does not know* in the high-stakes scenario, even if her brain state is identical.
      *   *Her stakes vs. Your stakes:* You noticed she claims knowledge when *you* are at risk (coming home late), but denies it when *she* is at risk (leaving for the weekend). SSI specifically tracks the **subject's** stakes. Since she is the one saying "I know," she is the subject. When her personal practical burden is low (you getting locked out is annoying for you), she knows. When her personal burden is high (her house getting burgled), she doesn't know.
  *   **Verdict on her theory:** She is half-right that it's about stakes, but wrong that it's just "vagueness" or "confidence dropping." SSI explicitly argues that confidence can remain constant while knowledge vanishes.

  ### 2. The Alternative: The Knowledge Norm of Assertion
  **Key Proponent:** Timothy Williamson (*Knowledge and Its Limits*, 2000).

  This concept addresses your observation about "embarrassment about the speech act." It suggests that knowledge itself might not be changing, but the rules for *saying* you know are changing.

  *   **The Theory:** There is a rule of conversation: **Assert that p only if you know that p.** However, asserting "I know" also invites responsibility. If you say "I know" and you are wrong, you are blameworthy.
  *   **Mapping to your argument:**
      *   *Embarrassment/Speech Act:* You noted she seems worried about "having said 'I know' out loud and then be caught out." This suggests she might actually *know* the door is locked in both cases, but in high-stakes situations, the **cost of assertion** is too high. She isn't denying knowledge; she is refusing to *warrant* the knowledge because the blame for error is too severe.
      *   *Fixable Errors:* When she can check the camera remotely, the cost of being wrong (and thus the blame for asserting) drops to near zero. So she is happy to assert "I know" again.
  *   **Verdict:** If this is the case, your flatmate is confusing *knowing* with *claiming to know*. She might know the door is locked, but she shouldn't *say* she knows it until she checks, because saying it creates a liability.

  ### 3. The Competitor: Epistemic Contextualism
  **Key Proponents:** Keith DeRose, David Lewis.

  This is the view you mentioned hearing about ("words like 'know' shift depending on who's talking"). It's important to distinguish this from what your flatmate is doing.

  *   **The Theory:** The word "knows" changes its meaning (semantic content) depending on the **context of the attributor** (the person speaking), usually driven by how "salient" the possibility of error is.
  *   **Mapping to your argument:** Contextualism usually predicts that if *you* ask her about the door and raise the stakes (by asking anxiously), *her* standards should rise because the conversational context is now high-stakes.
  *   **Why it doesn't fit:** You noted that when *your* stakes are high (you coming home late), she is still fine saying she knows. Contextualism would struggle to explain why the standards don't rise when you, the listener/attributor, care deeply. Her behavior tracks *her* situation, not the conversational context. This points back to **SSI** (Concept #1) rather than Contextualism.

  ### Summary of the Sub-Cases You Found

  You asked if there are names for the specific distinctions you stumbled into. Here is the philosophical vocabulary for them:

  1.  **Stakes for Believer vs. Stakes for Listener:**
      *   This distinguishes **Subject-Sensitive Invariantism** (Believer's stakes matter) from **Contextualism** (Listener/Conversational stakes matter). Your flatmate is behaving like an SSI theorist.
  2.  **Costly-to-be-Wrong vs. Embarrassing-to-have-Claimed:**
      *   This distinguishes **Pragmatic Encroachment on Knowledge** (The truth of "S knows p" changes) from **Pragmatics of Assertion** (The truth stays the same, but the permission to speak changes).
  3.  **Fixable vs. Unfixable Errors:**
      *   This relates to **Epistemic Safety** (Ernest Sosa). A belief is "safe" if it couldn't easily have been wrong. If she can check the camera, the belief becomes "safe" in a practical sense, or the *expected utility* of the error drops. This is often folded back into Pragmatic Encroachment as a calculation of **Expected Cost**.

  ### How to Settle the Argument

  Your flatmate's theory is that her confidence genuinely drops (psychological second-guessing). Your counter-observation is that she admits her confidence is the same.

  **The Verdict:**
  She is describing **Subject-Sensitive Invariantism (SSI)**, but she is explaining it via **Psychologism**.

  *   **Tell her this:** "You aren't just 'second-guessing.' You are acting like a philosophical **Interest-Relative Invariantist**. You believe that knowledge isn't just about evidence and truth; it's about whether the belief is good enough to act on."
  *   **The distinction:** If she insists her *confidence* drops, she is arguing for a psychological explanation. If she admits her confidence is the same but she still doesn't *know*, she is arguing for **Pragmatic Encroachment**.
  *   **The "Fixable" Point:** The camera example proves it's about **Practical Rationality**, not just raw confidence. If confidence were the only threshold, the camera wouldn't matter (the probability of the door being unlocked hasn't changed). The fact that the camera changes her willingness to say "I know" proves she is tracking the **Cost of Error**, not just the **Probability of Truth**.

  **The Cheat Sheet for Future Arguments:**
  *   When she says "It matters more this time": She is invoking **Pragmatic Encroachment**.
  *   When she says "I don't want to say it if I'm wrong": She is invoking the **Knowledge Norm of Assertion**.
  *   When she says "I can check the camera so it's fine": She is invoking **Epistemic Safety** / **Risk Mitigation**.
  *   When you say "But you were sure an hour ago": You are defending **Epistemic Purism** (the view that only truth-related factors affect knowledge).

  You win the point on the definition: It's not just vagueness. It's a structured dependency of knowledge on practical stakes. She wins the point on usage: In high-stakes environments, withdrawing the knowledge claim is the rational thing to do, regardless of whether we call it "not knowing" or "not asserting."
