answer: |-
  This is a precise and philosophically fertile observation. You have identified a tension at the heart of social epistemology: the conflict between *rational heuristic skepticism* (using reference classes to manage information overload) and *epistemic exclusion* (systematically silencing truths via structural priors).

  Here is a breakdown of the concepts, the literature, and the current state of debate regarding your two questions.

  ---

  ### 1. Is there an established concept for credibility discounting keyed to claim type?

  **The Short Answer:** There is no single, universally settled term equivalent to "testimonial injustice" for content-based discounting. However, there are several competing frameworks that address it, and a significant debate over whether the distinction between "identity" and "content" is stable.

  #### A. The Frickerian Baseline (Settled)
  In Miranda Fricker's *Epistemic Injustice* (2007), **testimonial injustice** is explicitly defined as a credibility deficit caused by *identity prejudice* (e.g., sexism, racism, classism).
  *   **Settled:** On the strict Frickerian definition, what you are describing is *not* testimonial injustice. Fricker acknowledges that we must discount some claims based on content (e.g., obvious falsehoods) and that doing so is not unjust unless identity prejudice is the driver.
  *   **Settled:** Fricker does discuss **preemptive testimonial injustice**, where a speaker is not even allowed to offer testimony because the audience assumes they have nothing to say. This overlaps with your "self-sealing" concern, but it is still rooted in identity prejudice in her framework.

  #### B. Proposed Extensions (Contested)
  Many social epistemologists argue that Fricker's definition is too narrow. They propose concepts that cover content-based discounting, especially when the content is structurally linked to power.

  *   **Content-Based Credibility Deficits:** Some philosophers (e.g., **Nora Berenstain**, **José Medina**) argue that prejudice often operates through *stereotypes about what kinds of things certain people know*, which blurs the line between identity and content. However, for your specific cases (market edges, drug reactions) where identity is less salient, this doesn't fully fit.
  *   **Institutional Epistemic Vice:** Scholars like **Ian James Kidd** and **Heather Battaly** focus on *epistemic vices* (closed-mindedness, arrogance) that can be institutional rather than individual. If an institution (e.g., a pharmaceutical company or a hedge fund) structurally incentivizes the rejection of a claim type, this is sometimes termed **structural epistemic injustice** (Elizabeth Anderson).
  *   **Propositional Prejudice:** This term is occasionally used in informal discourse and some niche literature to describe prejudice against a *proposition* rather than a person, but it is **not** a canonical term in the field.

  #### C. The "Self-Sealing" Mechanism (Settled Description, Contested Normativity)
  You describe a feedback loop: *Discounting $\rightarrow$ No Investigation $\rightarrow$ No Vindication $\rightarrow$ Low Base Rate $\rightarrow$ Discounting.*

  *   **Hermeneutical Injustice:** This is the closest established concept to the *consequence* of your loop. In Fricker's sense, hermeneutical injustice occurs when there is a gap in shared conceptual resources, preventing an experience from being understood. If claims of type $X$ are never vindicated, the concepts required to articulate and verify $X$ never develop.
      *   *Example:* Before "Repetitive Strain Injury" was a recognized medical category, reports of pain were dismissed as "worker weakness." The dismissal prevented the data collection needed to create the category.
  *   **Epistemic Smothering:** Coined by **Kristie Dotson** (2011). This occurs when a speaker truncates their own testimony because they judge the audience to be incapable of receiving it. This is a rational response to the self-sealing environment you describe.
  *   **Self-Insulating Belief Systems:** In the literature on conspiracy theories and polarization (e.g., **Cailin O'Connor**, **James Weatherall**), this is modeled as a network effect where priors are protected from updating. However, this literature usually treats the agents as irrational. Your point is that they may be *locally rational* (Bayesian) but *globally destructive*.

  ---

  ### 2. Is this Epistemic Injustice or Rational Bayesian Practice?

  This is the core philosophical tension. The literature is divided between **Proceduralists** (who focus on the listener's mental state) and **Structuralists** (who focus on the history of the data).

  #### A. The Bayesian Defense (Rational Skepticism)
  *   **The Argument:** In a world of limited cognitive resources, using reference classes (base rates) is rational. If 99% of "market alpha" claims are fraud, a prior of $P(Truth) = 0.01$ is justified. If the listener updates correctly based on new evidence, no injustice occurs.
  *   **The Limit:** This view holds that if the listener *fails* to update despite strong evidence (your "Problem 1"), that is simply a cognitive bias (conservatism bias), not necessarily an *injustice*. It is an epistemic error, but not a moral/epistemic wrong against the speaker.
  *   **Status:** This is the standard view in formal epistemology, but many social epistemologists find it insufficient for social contexts.

  #### B. The Structuralist Critique (Polluted Priors)
  *   **The Argument:** Scholars like **Elizabeth Anderson** ("Epistemic Justice as a Virtue of Social Institutions," 2012) and **Gaile Pohlhaus** ("Knowing Subalterns," 2012) argue that base rates are not natural facts; they are *historical products*.
  *   **The Mechanism:** If the low base rate of vindicated "whistleblower claims" is the *result* of past discounting (your "Problem 2"), then the prior is **polluted**. Relying on a prior that was generated by past injustice perpetuates that injustice.
  *   **Key Concept:** **Willful Hermeneutical Ignorance** (Pohlhaus). This describes when dominant groups refuse to expand their hermeneutical resources to understand marginalized claims. In your context, it manifests as refusing to update the reference class because doing so would require costly investigation.
  *   **Status:** **Contested.** Strict Frickerians may argue that unless identity prejudice caused the initial pollution, it's not "injustice." Structuralists argue that any systematic exclusion of truth from the "common knowledge" pool is unjust.

  #### C. The Medical Epistemology Literature (High Relevance)
  Your example ("this drug wrecked me") maps directly onto the literature on **Medical Epistemic Injustice** (e.g., **Havi Carel**, **Ian Kidd**, **Rachel Cooper**).
  *   **Finding:** Patients reporting subjective symptoms are often discounted because their claims fall into the reference class of "hypochondria" or "psychosomatic complaint."
  *   **Consensus:** There is a growing consensus here that this *is* epistemic injustice, even if the doctor isn't prejudiced against the *patient's identity*. The injustice lies in the **institutional structure** that prioritizes objective biomarkers over subjective testimony, creating a self-sealing loop where subjective effects are never validated.
  *   **Term:** Some authors call this **Diagnostic Injustice**.

  ---

  ### 3. Summary: Settled vs. Contested

  To ensure you do not walk away with one side of a debate presented as fact, here is the map of the current terrain.

  | Claim | Status | Nuance / Debate |
  | :--- | :--- | :--- |
  | **Fricker's original definition requires identity prejudice.** | **Settled** | Fricker (2007) is explicit. Content-based skepticism is not testimonial injustice *unless* tied to identity stereotypes. |
  | **There is a canonical term for "Content-Based Testimonial Injustice."** | **False** | There is no agreed-upon term. "Propositional prejudice" and "content-based deficit" are descriptive but not canonical. |
  | **Using base rates is inherently irrational.** | **False** | **Settled:** Bayesian updating is rational. **Contested:** Whether relying on historically polluted base rates remains rational. |
  | **The "Self-Sealing" loop constitutes an injustice.** | **Contested** | **Structuralists (Anderson, Medina):** Yes, because it corrupts the collective knowledge pool. <br> **Individualists:** No, unless an individual agent is culpable for ignoring evidence. |
  | **Identity and Content can be cleanly separated.** | **Contested** | **Critics (Medina, Pohlhaus):** No. Content stereotypes ("women are emotional") are proxies for identity. <br> **Your Case:** Your examples (market edges, safety claims) are harder to tie to identity, making this a harder test case for the theory. |
  | **This phenomenon fits under Hermeneutical Injustice.** | **Plausible** | Many specialists argue that the *lack of vindication* prevents the formation of concepts, making it a hermeneutical issue even if the initial dismissal is testimonial. |

  ### 4. Recommended Reading for Your Specific Puzzle

  If you want to pursue this, these three areas of literature address your specific constraints (claim-type focus, self-sealing nature, Bayesian tension):

  1.  **On the "Polluted Prior" Argument:**
      *   **Elizabeth Anderson**, "Epistemic Justice as a Virtue of Social Institutions" (2012). She argues that institutions must be designed to *generate* diverse testimony, not just process it. This addresses your concern that the evidence is "never allowed to be generated."
      *   **Nora Berenstain**, "Epistemic Exploitation" (2016). Discusses how marginalized agents are asked to educate others, but also how their data is extracted without credit.

  2.  **On the Medical/Claim-Type Specifics:**
      *   **Havi Carel & Ian Kidd**, "Epistemic Injustice in Healthcare" (2014). Directly addresses the "my body is broken" claim type and how institutional protocols create credibility deficits independent of specific doctor prejudice.
      *   **Hannah Landecker**, "The Use of Human Beings." (Historical sociology of how drug side effects are categorized).

  3.  **On the Self-Sealing/Feedback Loop:**
      *   **Kristie Dotson**, "Tracking Epistemic Violence" (2011). Introduces "epistemic smothering."
      *   **Cailin O'Connor**, "Games on the Edge of Belief." (Uses game theory to show how rational agents can get stuck in bad equilibria regarding truth).

  ### Conclusion

  You are describing a phenomenon that sits in a gap in the current taxonomy. It is widely recognized by specialists as a problem, but it lacks a single name.

  *   If you need a label for the **mechanism**, **"Structural Credibility Deficit"** or **"Reference Class Exclusion"** are descriptive and safe.
  *   If you need a label for the **injustice**, **"Hermeneutical Marginalization"** captures the self-sealing lack of vindication better than "Testimonial Injustice."
  *   If you are arguing against a Bayesian skeptic, your strongest lever is the **endogeneity of the prior**: the base rate is not an external fact of nature, but an output of the very system the skeptic is defending. This moves the debate from "Is skepticism rational?" to "Is this data source reliable?"
