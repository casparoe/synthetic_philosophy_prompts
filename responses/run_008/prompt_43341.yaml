          *   Suggest specific experimental manipulations that isolate the variables (e.g., eye-tracking, neural imaging during the $T_0$ phase, distinguishing passive recognition from active manipulation).
          *   Argue for a reconception of cross-modal capacity (not a link between two finished products, but a shared generative structure).
      *   *Conclusion:* Summarize.

  8.  **Refining the Tone:**
      *   Ensure it sounds like a philosophical colleague speaking to another.
      *   Avoid historical name-dropping (Berkeley, Leibniz, etc.) unless necessary for the *structure* of the argument.
      *   Keep it in American English (e.g., "behavior" not "behaviour", "program" not "programme").
      *   Maintain the "hypothesis" stance (don't claim absolute truth, but argue for the most explanatory power).

  9.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I survey history? *No.*
      *   *Check:* Did I address the Held et al. study? *Yes, implicitly as the "recent controlled study."*
      *   *Check:* Did I answer the "what counts as progress" prompt? *Yes.*
      *   *Check:* Is the distinction between verbal and substantive clear? *Need to ensure I explain why it's not just semantics.* (It's not semantics because it changes the ontological commitment to the mind's structure).

  10. **Final Polish:** Check flow and clarity. Ensure the distinction between Camp 2 (Skill) and Camp 3 (Ill-posed) is sharp enough. Camp 2 says the capacity is there but hidden; Camp 3 says the capacity doesn't exist yet. This is a crucial distinction for the "Substantive" diagnosis.

  *(Self-Correction on Camp 3)*: Camp 3 says the question is ill-posed because "see as" doesn't exist yet. This is stronger than Camp 2. Camp 2 says "They see it but can't report." Camp 3 says "They don't see it *as an object* yet." This supports the "Explanatory Target" diagnosis.

  *(Final Plan)*:
  1. Validate hypothesis: It's about target cognitive achievement.
  2. Diagnose: Substantive disagreement about the *architecture of perception* (Association vs. Access vs. Constitution).
  3. Progress: Decomposition + Reconception of cross-modal invariance.

