      *   *Rawls:* Correct the "equal distribution" error. Mention the *Difference Principle*. Mention "Primary Goods" as an index, not just stuff.
      *   *Sen:* Acknowledge the strength of the critique (conversion factors). But note it's a critique, not a disproof. Mention Nussbaum (who formalized it more).
