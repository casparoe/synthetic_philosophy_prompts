answer: |-
  This is a classic case of someone wielding a philosophical sledgehammer without checking if there are nails nearby. Your friend is using "moral relativism" as a shield, but as you noticed with the dog incident, she puts the shield down whenever it inconveniences her.

  To help you dissect this over coffee, here is the menu of distinct claims hidden inside the slogan "morality is relative / who's to say." I have broken them down by philosophical category, assessed their truth value, and tested them against the Whale/Dog contradiction.

  ### 1. Descriptive Relativism (The Anthropological Claim)
  *   **The Claim:** "Different cultures have different moral codes."
  *   **Verdict:** **True (but Trivial).**
      *   It is an empirical fact that the Faroese value the hunt and you do not.
  *   **Does it block your criticism?** **No.**
      *   The fact that people *disagree* about geometry doesn't mean there is no right answer to a math problem. The fact that cultures disagree about morality does not prove there is no objective moral truth. It just proves there is disagreement.
  *   **The Dog/Whale Test:** **Consistent.**
      *   She can acknowledge cultures differ on whales while still being furious about the dog. But this claim is too weak to support her argument. It explains the *situation*, it doesn't justify *silence*.

  ### 2. Metaethical Relativism (The Truth Claim)
  *   **The Claim:** "Moral statements are only true relative to a cultural framework. There is no 'God's eye view'."
  *   **Verdict:** **Debatable / Philosophically Heavy.**
      *   This claims that "Whaling is wrong" is like saying "This soup is too cold." It's true for *you*, false for *them*. There is no objective fact of the matter.
  *   **Does it block your criticism?** **Yes.**
      *   If moral truth is bound by culture, then you are literally speaking nonsense when you apply your standards to their framework. You are trying to play chess with checkers pieces.
  *   **The Dog/Whale Test:** **Consistent (with a caveat).**
      *   This allows her to condemn the dog owner (same cultural framework as her) while withholding judgment on the Faroese (different framework).
      *   **The Flaw:** This relies on an arbitrary definition of "culture." Why is "The Faroe Islands" a valid moral boundary, but "People Who Love Dogs" isn't? If the dog owner is part of a "Global Animal Welfare Culture," his actions violate *that* culture's norms. If the Faroese are part of a "Global Human Rights Culture," their hunt violates *that*. She gets to pick the borders of the culture to suit the conclusion she wants.

  ### 3. Epistemic Skepticism (The "Math" Claim)
  *   **The Claim:** "You can't prove moral claims the way you prove math claims."
  *   **Verdict:** **Plausible, but often misused.**
      *   She is right that you can't derive an "ought" from an "is" using pure logic (Hume's Guillotine). However, lack of mathematical proof doesn't mean lack of justification. We can't "prove" the Holocaust was wrong with an equation, but we aren't therefore silent about it.
  *   **Does it block your criticism?** **No.**
      *   Even if moral claims aren't mathematically provable, they can still be *better supported* than others. If lack of proof meant silence, she couldn't rant about the dog guy either, since she can't "prove" animal cruelty is wrong mathematically.
  *   **The Dog/Whale Test:** **Inconsistent.**
      *   She used this to silence you on the whales, but ignored it for the dog. If unprovability silences judgment, she should be indifferent to the dog. Her fury proves she believes some moral claims are robust enough to act on, which undermines her claim that the whale issue is too vague to judge.

  ### 4. Normative Relativism (The Tolerance Claim)
  *   **The Claim:** "We *ought* not to judge other cultures. It is wrong to interfere."
  *   **Verdict:** **Self-Refuting.**
      *   This claims there is a universal moral rule ("Do not judge other cultures"). But if there is one universal moral rule, then morality isn't relative. It also begs the question: Why is "tolerance" the one universal value that overrides "non-suffering"?
  *   **Does it block your criticism?** **Yes.**
      *   It frames your criticism not as "incorrect," but as "immoral behavior" on your part (i.e., you are being intolerant).
  *   **The Dog/Whale Test:** **Inconsistent.**
      *   Normative relativism usually implies a duty of non-interference. Her rant about the dog guy is an act of moral interference (calling for bans, shaming). She is enforcing a norm on the dog owner. She cannot claim "non-interference" is the highest virtue while actively interfering with the dog owner's life.

  ### 5. Moral Nihilism / Error Theory (The Nuclear Option)
  *   **The Claim:** "Nothing is actually right or wrong. We just have feelings."
  *   **Verdict:** **Radical / Counter-intuitive.**
      *   This says both the whalers and you are mistaken in thinking morality exists.
  *   **Does it block your criticism?** **Yes.**
      *   There is nothing to criticize because nothing matters.
  *   **The Dog/Whale Test:** **Inconsistent.**
      *   If she were a nihilist, her post about the dog would have to be, "Well, that guy did what he wanted, and I feel bad about it, but nothing is actually wrong." Her fury ("He should be banned!") implies she believes objective wrongs exist.

  ---

  ### The Diagnosis: What was she actually doing?

  If you quote me at her, tell her this: **She is likely not a relativist; she is a Tribalist.**

  The only reading that makes her behavior (Silence on Whales + Fury on Dog) coherent is a specific, muddled version of **Metaethical Relativism restricted by Group Identity.**

  *   **The Logic:** "Inside my tribe (nation/species/subculture), moral truths exist and I can enforce them. Outside my tribe, moral truths dissolve into 'culture,' and I must remain silent."
  *   **The Incoherence:** This makes the "border of the culture" the most important moral fact of the universe. Why does a geographic border (Faroe Islands) grant moral immunity, while a species border (Humans vs. Dogs) does not?
  *   **The Real Move:** She wasn't doing philosophy. She was using **The Conversation Stopper.**
      *   "Who's to say?" is not an argument; it is a request to lower the stakes. She likely felt that criticizing the Faroese felt like bullying a small, distinct group (a "culture"), whereas criticizing the dog abuser felt like defending a vulnerable victim within her own sphere.
      *   She conflated **"I cannot mathematically prove this"** with **"I have no right to feel this."**
      *   She conflated **"Understanding why they do it"** with **"Accepting that they do it."**

  ### How to handle coffee

  Don't go in trying to "win" the philosophy debate. If you hit her with "That's a self-refuting normative claim," she will tune out. Instead, point out the **Boundary Problem**.

  **Say this:**
  > "I looked up the arguments you made. The only way your position works is if 'culture' is a magic shield. But you didn't use the shield for the dog guy. You judged him fiercely. That means you believe some things are objectively wrong, regardless of what the person thinks.
  >
  > So the question isn't 'Is morality relative?' The question is: **Where do you draw the line?** Is the line 'National Borders'? Because if the line is national borders, then you can't criticize anything another country does. Is the line 'Species'? Because then the whales are out of luck.
  >
  > You're allowed to be angry about the dog and the whales. But you can't use 'Who's to say' to silence the whale argument while you're screaming about the dog one. You have to pick a standard that works for both."

  **Verdict:** She was doing philosophy badly to end an argument she was tired of having. She wanted to avoid the discomfort of condemning a "culture" while maintaining the comfort of condemning a "criminal." Pointing out that she gets to be uncomfortable about both is the kindest thing you can do for her intellect.
