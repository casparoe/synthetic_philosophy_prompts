answer: |-
  First off, well done. Your diagnosis is not rubbish at all; in fact, it is remarkably sharp for a school philosophy club. You have intuitively stumbled upon a distinction that professional epistemologists and aestheticians spend careers trying to untangle. You are correct that there is a verbal element here, but there is also a genuinely substantive disagreement hiding underneath it.

  To answer your questions directly: your diagnosis is **partly right**, but the substantive disagreement is about the **nature of aesthetic value itself**, not just the definition of knowledge. And yes, grown-up philosophers are still arguing about this exact thing, and many are just as stuck as you three.

  Here is a breakdown of what is actually happening in your argument, using the terminology the professionals use, along with some suggestions on how you might finally get unstuck.

  ### 1. The Verbal Disagreement: "Knowing That" vs. "Acquaintance"

  Your working theory is that one side is talking about *propositional knowledge* (knowing *that* something is the case) and the other is talking about *experiential appreciation* (knowing *what it is like*).

  In philosophy, this is often framed as the difference between:
  *   **Knowledge by Description:** I know facts about the film (the director, the plot, your friend's verdict).
  *   **Knowledge by Acquaintance:** I have a direct, first-hand awareness of the film itself.

  Friend 1 is relying on what is known as the **Acquaintance Principle**. This was famously articulated by the philosopher Frank Sibley and later Richard Wollheim. The principle states that aesthetic judgements must be based on first-hand experience of the object. You cannot legitimately judge a painting beautiful if you have only seen a photograph of it; you must see the brushstrokes. Friend 1 is arguing that without the experience, you lack the *justification* required for knowledge.

  Friend 2 is arguing from **Testimonial Optimism**. In general epistemology (the study of knowledge), most philosophers agree that testimony is a valid source of knowledge. I know Napoleon existed though I never met him. Friend 2 is asking: *Why is art special?* If I know my friend's cognitive machinery works like mine, her testimony is simply data.

  So, on this point, you are right. If you define "know" as "have a justified true belief based on reliable evidence," Friend 2 wins. If you define "know" as "possess the grounded appreciation necessary to make the judgement," Friend 1 wins.

  ### 2. The Substantive Disagreement: The Nature of Aesthetic Reasons

  However, it is not *just* verbal. Friend 1 wavered between two points, and you asked if they were the same. They are different, and this is where the real philosophical meat lies.

  **Point A: The Metaphysical Claim.**
  Friend 1 sometimes says you need "acquaintance." This suggests aesthetic properties (beauty, mastery) are not real properties of the film like "running for 120 minutes." They are response-dependent. They exist in the interaction between the viewer and the film. Therefore, asking if the film is a masterpiece without a viewer experiencing it is like asking if a joke is funny if no one hears the punchline.

  **Point B: The Conceptual Claim.**
  Friend 1 also says you can't understand an *aesthetic reason* without seeing what it is a reason for. This is subtler. Imagine your friend says, "It's a masterpiece because the lighting in the third act mirrors the protagonist's internal decay."
  *   Friend 2 says: "I trust you, so I know that is a good reason."
  *   Friend 1 says: "You don't actually understand the reason. You understand the *words*, but you don't grasp the *force* of the reason."

  This is the substantive hurdle. In science, I can understand why atoms exist without seeing them. In art, can I understand *why* it is good without feeling the goodness? If aesthetic value is tied to emotional or perceptual response, then testimony transfers the *information* but not the *response*.

  ### 3. Do Grown-Up Philosophers Agree?

  You will be relieved (or perhaps frustrated) to hear that there is no consensus. This is known as the **Debate over Aesthetic Testimony**.

  *   **The Pessimists (Friend 1's camp):** Philosophers like Mary Mothersill or Peter Kivy have argued that there is something peculiar about aesthetic testimony. Even if I trust you, it seems inappropriate for me to assert "This film is a masterpiece" if I haven't seen it. It feels like cheating. They argue aesthetic judgement requires autonomy.
  *   **The Optimists (Friend 2's camp):** Philosophers like Aaron Meskin or Jonathan Matheson argue that this "snobbery" is unjustified. They point out that we rely on critics all the time. If you deny testimony in art, you have to explain why it works for history, science, and geography but fails for film. Is art really that magical?

  The reason the argument stalls is that both sides have strong intuitions that pull in opposite directions.
  *   **Intuition for Friend 2:** If you deny testimony, you are saying your friend's reliable track record counts for nothing. That seems irrational.
  *   **Intuition for Friend 1:** If you accept testimony, you are saying you can have an aesthetic opinion without an aesthetic experience. That seems hollow.

  ### 4. How to "Win" (or Stop Arguing)

  You asked what would count as winning. In philosophy, you rarely "win" by proving the other person wrong. You win by showing that your framework explains more of the world with fewer contradictions.

  Here is how you might try to break the deadlock in your club:

  **Step 1: Split the Question (Your Idea)**
  You should propose exactly what you suggested. Agree to discuss two separate questions:
  1.  **The Epistemic Question:** Do I have sufficient evidence to believe the film is good? (Friend 2 is likely right here).
  2.  **The Normative Question:** Is it *proper* or *valuable* for me to claim it is good without seeing it? (Friend 1 is likely right here).

  **Step 2: The "Critic" Example Refinement**
  Your example of the critic who is right 200 times is good, but try this tweak:
  Imagine the critic tells you the film is a masterpiece because of a specific scene that moves them to tears.
  *   Ask Friend 2: Do you know *why* it moves them? No. Do you know if it will move *you*? Probably, but not certainly.
  *   Ask Friend 1: If you watch the film and don't cry, was your friend wrong? Or was the film still a masterpiece?

  This exposes whether they think "masterpiece" is an objective fact (like atoms) or a shared human response (like humour).

  **Step 3: Accept the "Hollow" Victory**
  You might concede to Friend 1 that testimony gives you "second-hand knowledge." It is knowledge, but it is impoverished. It is the difference between reading a menu and eating the meal. You know *that* the meal is good, but you don't know the *goodness* of the meal.
  If Friend 2 accepts that their knowledge is "impoverished" but still counts as knowledge, and Friend 1 accepts that it counts as *some* kind of knowledge (just not the full aesthetic kind), you have a compromise.

  ### 5. A Note on British English and Style

  Since you mentioned you are in the UK and get marked down for Americanisms, a quick note on your writing style in the future (though your prompt was fine):
  *   Stick to **analyse** rather than *analyze*.
  *   Use **defence** rather than *defense*.
  *   Use **colour** rather than *color*.
  *   Generally, British academic marking schemes prefer a slightly more tentative tone ("It might be suggested that...") rather than the assertive American style ("I argue that...").

  ### Summary

  Your diagnosis is excellent. You have identified that Friend 1 is conflating **epistemic justification** (do I have grounds to believe?) with **aesthetic appreciation** (do I have the experience?).

  However, don't dismiss Friend 1 as merely confused. They are defending a robust philosophical position: that aesthetic value is not a fact 'out there' to be collected, but a relationship to be experienced. Friend 2 is defending the rationality of trusting reliable sources.

  The argument stalls because both are true in different senses. The way through is not to find a clever example that proves one right, but to agree that "knowledge" is doing too much work in a single word. Split it into **believing on authority** (Friend 2 wins) and **judging from experience** (Friend 1 wins).

  If you propose that distinction to your friends, you might find the argument finally moves. Good luck with the club; it sounds like you are doing proper philosophy.
