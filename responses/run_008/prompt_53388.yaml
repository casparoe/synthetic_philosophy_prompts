answer: |-
  Here is a principle that saves all your verdicts without requiring you to overturn any of them, followed by its application to your test case and an assessment of its confidence.

  ### The Principle: The Ecology of Virtue

  **Morality is not a single scalar value to be maximized, but a system of competing goods that must be balanced.**

  Your housemates' argument hinges on the idea that "goodness" is like money: more is always better. Your intuitions correctly reject this. In a robust ethical framework (specifically Virtue Ethics), "goodness" is composed of multiple distinct virtues (generosity, justice, kindness, prudence, joy, loyalty). These virtues can conflict. Maximizing one at the expense of the others does not make you "more good"; it makes you *imbalanced*.

  Therefore, **a person cannot be "too good," but they can be morally monomaniacal.** When moral commitment displaces other essential human goods (like social harmony, self-care, or joy) to the point of dysfunction, it ceases to be a virtue and becomes a vice (e.g., generosity becomes self-destruction; honesty becomes brutality).

  ### How This Saves Your Verdicts

  1.  **The 30% Colleague (Admirable):** She demonstrates **Integration**. She balances the virtue of *generosity* (30% salary) with the virtue of *friendship* (fun at parties) and *prudence* (living simply but not ascetically). She is the model of the Ecology of Virtue.
  2.  **The Extreme Ascetic (Admired but Feared):** He demonstrates **Displacement**. He has maximized *beneficence* but eliminated *self-care* and *personal flourishing*. You admire the height of his sacrifice (supererogation), but you correctly sense that a life without hobbies or comfort is tragically imbalanced. Your shame comes from knowing you aren't willing to make that trade; the principle says you don't have to be. That level of sacrifice is optional, not required for a "good" life.
  3.  **The Flawless Friend (Worse Company):** He demonstrates **Rigidity**. You describe him as "flawless in small-scale morality," but the principle challenges this description. Correcting false beliefs at awkward moments prioritizes *abstract truth* over *kindness* and *social harmony*. In the Ecology of Virtue, tact and kindness are moral virtues too. He is not "too good"; he is lacking the virtue of *phronesis* (practical wisdom). He knows the rules but not the context. Your embarrassment vanishes: you aren't disliking his goodness; you are disliking his lack of wisdom.
  4.  **The Boat Neighbor (Not Failing):** He demonstrates **Partiality**. Human morality is structured concentrically. We have stronger duties to friends and family than to strangers. He fulfills his inner-circle duties. He is not failing because morality does not demand impartial maximization of global welfare (contrary to strict Utilitarianism).
  5.  **The Indifferent Person (Failing):** He demonstrates **Deficiency**. He fails the baseline of *care*. Even if he is "nice to be around," his indifference to others violates the minimum threshold of human connection required to be a moral agent. He fails the "floor" test.

  ### The Test Case: The Minimalist Parent

  **Verdict:** She is **morally successful**, provided "decently" means meeting the threshold of care required for her children's flourishing.

  **Application:** Parenting, like morality, has a **sufficientarian** threshold, not a **maximizing** one. You are not required to pour *every* ounce of energy into your children to be a good parent; you are required to meet their needs for safety, love, and support.
  *   If she meets these needs ("never bad"), she has satisfied her moral obligations.
  *   By pouring energy into travel and music, she cultivates her own *flourishing*.
  *   **Why this is good:** A parent who models a full, balanced life (The Ecology of Virtue) is often better for a child than a parent who sacrifices everything and risks resentment or burnout (The Extreme Ascetic). Her "barely" is acceptable because it clears the floor; her travel and music are permissible because self-actualization is a valid moral good once duties are met.

  ### Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident in this principle because it aligns with the most durable tradition of moral philosophy (Aristotelian Virtue Ethics) and successfully resolves the specific tensions in your intuitions without forcing you to abandon any of them. It explains why we admire saints but don't want to be them, and why "nice" people can be unpleasant company.

  **Point of Least Certainty: The Boat Neighbor's Boundary**
  I am least sure about where exactly to draw the line between the **Boat Neighbor** (permissible partiality) and the **Indifferent Person** (failing).
  *   *The Uncertainty:* In a world of extreme suffering, how much *must* one give to strangers before keeping money for a boat becomes morally suspect? The "Ecology of Virtue" allows for partiality, but it doesn't precisely quantify the limit.
  *   *Why it wobbles:* If the neighbor's boat spending is conspicuous while neighbors starve, does he slip into "Indifferent"? Your intuition says he's fine; a strict Effective Altruist would say he's failing. My principle sides with your intuition (humans are not built for pure impartiality), but I acknowledge this is the fuzzy edge of the theory. The "floor" is clear, but the ceiling on self-indulgence is not.

  ### Summary for Your Housemates
  Tell them: **"Goodness isn't a high score on a single meter; it's a healthy ecosystem."** You can't have a forest with only one species of tree, no matter how magnificent that tree is. The person who is "too good" is actually just unbalanced—they have let one virtue cannibalize the rest. The goal isn't maximum moral output; it's sustainable moral integrity.
