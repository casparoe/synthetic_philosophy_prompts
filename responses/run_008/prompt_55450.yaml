  **The Rule:** Evidence confirms if it reduces the set of unexamined locations where a counter-example *could* hide, provided the sampling frame is known to contain instances of the subject kind. Non-$R$ objects confirm if they are removed from a "raven-containing" population, but not from a "raven-free" population.
