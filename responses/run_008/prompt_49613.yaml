answer: |-
  The acceptance letter sat on the kitchen table, heavy as a stone. It was from the Lycée in Lyon, fully funded, a year of immersion in a language Maya couldn't speak, in a city where she knew no one. Across from her, her mother tapped a pen against a spreadsheet.

  "It's a utility calculation, Maya," her mother said, her voice tight with the strain of holding everything together. "One year. Grandpa is in stage two. The doctors say the lucidity... it's nonlinear. But statistically, this year is high-value time. You stay, you share that time. You go, you gain a future."

  Maya looked toward the hallway. The house was quiet, save for the hum of the refrigerator and the soft shuffle of slippers from the den. Her grandfather, Elias, was in there watching a game show he no longer understood the rules of.

  "It's not math," Maya said. "I don't know what I'm buying."

  Her mother sighed. "You know what you're giving up."

  "Do I?" Maya touched the paper. "I know the concept of missing him. I don't know the *texture* of it. And I don't know what Lyon does to me. If I go, I come back someone else. How do I choose for her?"

  Later, Maya met Julian at a coffee shop downtown. He had taken the same scholarship five years ago. He looked different now—sharper, harder around the edges, wearing a coat style Maya had never seen on him before.

  "It was incredible," Julian said, stirring his espresso. "Lonely. Terrifying. Then it wasn't."

  "But how did it feel?" Maya pressed. "When you landed? When you missed home?"

  Julian shrugged, a gesture that felt foreign on his new shoulders. "I can tell you I cried in the shower for a week. I can tell you I learned to love bitter chocolate. But telling you... it's like describing a color to someone who's blind. You're asking me to translate a sensation into data. The data is useless."

  "So was it worth it? Leaving your family?"

  Julian looked at her, and for a moment, she saw a flicker of the boy he used to be, buried under the layers of who he had become. "The me who left would say no. The me who stayed would have said yes. The me sitting here? I don't know. I don't miss the person I was before I left. Does that answer your question?"

  It didn't. It only deepened the hollow in her chest. She was trying to maximize the happiness of a stranger: her future self. But that stranger's values were contingent on the choice itself. If she stayed, she would value presence. If she went, she would value expansion. There was no common currency.

  That evening, she sat on the edge of Elias's bed. The room smelled of lavender and old paper. He was holding a photograph of them from five years ago, tracing the outline of her face with a trembling thumb.

  "You look tired, Maybird," he said.

  "Just thinking, Grandpa."

  "About the place with the towers?"

  "Yes."

  He put the photo down. His eyes were clear, for now. "When I was your age, I joined the navy. Left my mother. She cried at the station. I thought I was brave. When I came back, she was... smaller. I wasn't the son she remembered, and she wasn't the mother I left. We spent years trying to introduce ourselves again."

  "Would you have stayed?"

  Elias smiled, a sad, crooked thing. "That's the trick. The man who came back wouldn't let the boy who left stay. You can't ask the boy to know what the man needs. You just have to pick which ghost you want to haunt you."

  He was facing his own transformation, Maya realized. The illness was stripping him layer by layer, changing his values, his memories, his very capacity to know her. Soon, he wouldn't care about the choice because he wouldn't remember the question. She was standing on the shore, watching two tides pull in opposite directions.

  The deadline was midnight. Maya sat at her desk, the acceptance letter on one side, her suitcase open on the floor. She tried to simulate the future. She imagined waking up in Lyon, the panic of incomprehension, the thrill of a new name. She imagined waking up here, making breakfast for Elias, the slow erosion of his mind, the quiet guilt of safety.

  But the simulations were flat. They were paintings of pain and joy, not the things themselves. She couldn't feel the weight of the absence until she was empty. She couldn't feel the weight of the new self until the old one was shed.

  Her mother knocked softly. "You don't have to decide tonight. Technically."

  "Yes, I do."

  Maya picked up the pen. She thought about Julian's shrug. She thought about Elias's ghosts. She realized that rationality was a map for a territory that didn't exist yet. There was no right answer, only the act of jumping.

  She signed the letter.

  It wasn't a triumph. It felt like stepping off a ledge in the dark, trusting that the ground would rearrange itself to catch her. She packed the suitcase. She would leave in three days.

  Years later, Maya would stand in a gallery in Lyon, looking at a painting that reminded her of her grandfather's hands. She would feel a pang of grief, sharp and specific, followed by a swell of gratitude for the life that led her here. She would tell herself it was the right choice. She would believe it.

  But standing in her bedroom now, pen still wet, she knew that the woman who would make that judgment was not the girl holding the pen. The girl was making a sacrifice for a stranger. The stranger would look back and call it an investment. Neither of them could truly know if the trade was fair, because they could never occupy the same skin.

  Maya capped the pen. The house was silent. She turned off the lamp, leaving the decision in the dark, waiting for the morning to reveal who had survived the night.
