      *   *Tension B: (5) vs (6).* (5) says software is *always* sphexish because it's code/rules. (6) says sphexishness is about behavior shape (updating vs. not updating), and a deterministic system *could* be non-sphexish. If a deterministic system can be non-sphexish (per 6), and humans are deterministic (per 2), then humans could be non-sphexish. But (5) says software (code) is *always* sphexish. If humans are just meat-code (per 1 & 2), why are they exempt from (5)?
