  2.  **Deconstruct Goodhart's Law for the Game:**
      *   *Core Concept:* When a measure becomes a target, it ceases to be a good measure.
      *   *Mechanism:* Participants need a clear incentive to maximize $X$, while the *actual* desired outcome is $Y$. $X$ correlates with $Y$ initially, but diverges under pressure.
      *   *Flavors:*
          *   *Regressional:* $X$ is a noisy proxy for $Y$. Extreme $X$ doesn't mean extreme $Y$.
          *   *Causal:* $X$ causes $Y$, but manipulating $X$ directly breaks the causal chain.
          *   *Adversarial/Gaming:* Participants actively find loopholes to inflate $X$ without doing $Y$.
      *   *Selection:* For a 75-minute game with juniors, *Adversarial/Gaming* is the easiest to demonstrate quickly. *Regressional* is too subtle. *Causal* is hard to simulate without complex mechanics. Let's aim for a mix of Gaming (finding loopholes) and Regressional (quantity vs. quality).

