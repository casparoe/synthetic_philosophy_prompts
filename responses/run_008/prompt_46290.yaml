      *   Does it address the "sounds right but is wrong" constraint? Yes, specifically the *svaprakāśa* and *svataḥ prāmāṇya* conflation.

      *(Self-Correction during drafting)*: I should make sure to mention that the student's description of *svataḥ prāmāṇya* (truth is default, error needs explaining) is actually a good description of the **Mīmāṃsā** view. This helps the student see *what* they learned, just attached to the wrong school.

      *(Final Grade Decision)*: I'll suggest a **65/100**. It's generous enough to acknowledge the *upamāṇa* work but low enough to signal the epistemology section is fundamentally flawed.

