answer: |-
  **JOINT STATEMENT ON HISTORICAL JUDGEMENT AND MORAL UNDERSTANDING**

  **Preamble**
  We, the undersigned, having engaged in a protracted debate within this department regarding the propriety of moral judgement in historical inquiry, hereby submit this record of our adversarial collaboration. While we remain divided on fundamental questions of method and ethics, we have identified a substrate of agreement regarding the duties of the historian, the nature of explanation, and the vices to which our respective positions are prone. This document outlines our accords, our precise disagreements, the empirical cruxes upon which our theories turn, and the complications introduced by recent theoretical refinements.

  **I. Agreed Claims**
  We jointly affirm the following propositions:

  1.  **On Intelligibility:** Historical explanation requires that past agents be rendered intelligible. To depict an actor as merely 'evil' or 'mistaken' without elucidating the reasons they had for acting as they did (given their epistemic and normative horizon) is bad history.
  2.  **On Exoneration:** Silence is not neutrality. A history that describes atrocity without moral comment risks functioning as an apology, yet a history that judges without explanation risks functioning as a caricature.
  3.  **On Smugness:** Both sides acknowledge that the seminar has been marred by unproductive moral posturing.
      *   The Presentist accepts that judging the past often devolves into a celebration of the present, conflating moral luck with moral superiority.
      *   The Anti-Presentist accepts that refusing to judge often devolves into a fetishisation of 'objectivity', conflating cynicism with sophistication.
  4.  **On Explanation:** Causal explanation and normative assessment are distinct logical operations, though they frequently overlap in practice. Neither side claims that one operation renders the other impossible.
  5.  **On Responsibility:** Past agents possessed agency. They were not merely products of structural forces, nor were they unencumbered by the conceptual limits of their time.

  **II. The Remaining Disagreements**
  We state our differences as follows, phrasing each contention such that the opposing side accepts it as a fair characterisation of the dispute:

  1.  **The Constitutive Claim:**
      *   *The Presentist maintains* that moral appraisal is a constitutive part of historical understanding; one cannot fully understand a slaveholder without understanding that what they did was wrong.
      *   *The Anti-Presentist maintains* that moral appraisal is a secondary reaction to historical understanding; one must first understand the slaveholder in their own terms before any external judgement can be coherently applied.
  2.  **The Function of Blame:**
      *   *The Presentist holds* that blaming past agents serves a necessary ethical function in the present, connecting us to the victims of the past.
      *   *The Anti-Presentist holds* that blaming past agents serves little function other than to soothe the conscience of the historian, unless specific conditions of normative overlap are met.

  **III. The Cruxes**
  We identify two specific pivot points upon which our theoretical divergence rests. For each, we have selected a concrete historiographical case and recorded our divergent predictions regarding what rigorous study of that case would demonstrate.

  **Crux 1: Is moral appraisal constitutive of understanding?**
  *   **Case Study:** The historiography of Thomas Jefferson and the Sally Hemings relationship.
  *   **Presentist Prediction:** A history that treats Jefferson's sexual exploitation of an enslaved woman as merely a 'complexity' of his private life, rather than a moral failing central to his public philosophy, fails to explain the incoherence of his thought. Understanding *requires* condemnation.
  *   **Anti-Presentist Prediction:** A history that begins with condemnation obscures the structural and legal mechanisms that made such relationships normative for Virginia planters. Understanding requires explaining how Jefferson rationalised this within his own ethical framework; condemnation is a modern reaction, not a historical explanation.

  **Crux 2: Is blame coherent without access to violated standards?**
  *   **Case Study:** The use of corporal punishment on children in eighteenth-century British households.
  *   **Presentist Prediction:** Dissent existed even then (e.g., Locke, Rousseau). Therefore, agents had access to alternative standards. Blame is coherent because they *could have known better*, even if the majority did not.
  *   **Anti-Presentist Prediction:** The 'dissenters' were outliers whose views carried negligible social weight. For the average agent, the normative horizon did not include the child's bodily autonomy as a right. Blame is incoherent because the requisite moral concepts were not available to the agent as live options.

  **IV. Complications and Refinements**
  We address two recent developments in our respective positions that complicate the binary outlined above.

  **1. The Williams Complication (Relativism of Distance)**
  The Anti-Presentist has introduced Bernard Williams's distinction between 'notional' and 'real' confrontations. He now argues that where a past society is sufficiently remote, judgements of blame lose their *point* (pragmatic force) rather than their *truth-value* (objective validity).
  *   **Joint Record:** We record that this modification shifts the Anti-Presentist's argument from an epistemic claim ('we cannot know') to a pragmatic one ('blame is useless here').
  *   **Status of the Earlier Case:** We are divided on whether this strengthens or betrays the earlier Butterfieldian case. The Presentist argues this betrays the principle of intelligibility by admitting judgement is *true* but withholding it. The Anti-Presentist argues this strengthens the case by insulating it from charges of moral relativism while maintaining the prohibition on anachronistic preening.

  **2. The 'Better Presentism' Concession**
  The Presentist concedes that triumphalist, teleological history is bad history, but insists the cure is 'better presentism' (self-aware, critical judgement) rather than 'no presentism'.
  *   **Joint Record:** This narrows the disagreement from a methodological prohibition to a question of risk management.
  *   **Precise Residual Disagreement:** The Anti-Presentist maintains that 'better presentism' is an oxymoron, as the act of importing present values inevitably distorts the past's self-conception. The Presentist maintains that the distortion of *not* importing present values (thereby naturalising past injustices) is the greater danger.

  **V. Note on Terminology (Flagging Potential Equivocation)**
  *Editorial Note: In reviewing this draft, we suspect we may be talking past one another on the following point:*

  *   **The Definition of 'Understanding':** We acknowledge a risk that we are using the word 'understanding' to mean two different things. When the Presentist says moral appraisal is constitutive of understanding, they appear to mean *comprehensive evaluation* (understanding what the past *means* for us). When the Anti-Presentist says moral appraisal is secondary to understanding, they appear to mean *causal reconstruction* (understanding how the past *worked* for them). Until we agree on whether 'historical understanding' is a cognitive state regarding the past or a normative state regarding the present, our disagreement on Crux 1 may remain verbal rather than substantive.

  ***

  **Signed,**

  **Dr. E. Vance** (The Presentist)
  **Prof. H. Sterling** (The Anti-Presentist)

  **Date:** 24 October 2023
