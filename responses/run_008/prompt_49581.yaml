answer: |-
  Good evening, everyone. For those of you who don't know me, I'm Harlan's nephew. And for the half of this room who are family: yes, I know. I know about the closet. I know about the little grid booklets.

  For the teachers and students here: My uncle Harlan has a secret. Well, not a secret—he'd never hide data—but a context. You know him as the history teacher who never raised his voice, who never told you you were wrong but instead asked you a question that made you realize you were wrong, and who somehow had the energy for thirty-seven years of sophomore essays.

  The family knows where that energy came from. It came from Benjamin Franklin.

  When Harlan was a teenager, he read Franklin's *Autobiography* and didn't treat it like literature. He treated it like an instruction manual. Specifically, the "bold and arduous project of arriving at moral perfection." You know the one. Thirteen virtues. Temperance, Silence, Order, Resolution, Frugality, Industry, Sincerity, Justice, Moderation, Cleanliness, Tranquility, Chastity, and Humility. One per week. A grid in a little notebook. Mark a black spot for every fault. Cycle through four times a year.

  Most of us read that and think, "Cute." Harlan read it and thought, "Schedule."

  We have boxes of those booklets in the closet. Decades of them. And if you ask him—and you should, he loves the data—he'll tell you his results. Temperance? Clean columns. Industry? Spotless. Frugality? He's the only man I know who can make a pair of trousers last fifteen years without it being a fashion statement.

  But like Franklin, Harlan found some virtues… stickier than others. Specifically, Order. Franklin famously wrote about the "speckled axe." A man wants a perfectly polished axe, but the grinding takes so long he decides he likes the bright face better than the sharp edge, and leaves it speckled. Harlan's desk, I can confirm, has always been a bit speckled. He made peace with the fact that a man can be virtuous without being a filing cabinet.

  And then there is Humility. That wasn't on the original list. Franklin added it late. Harlan did too. Only after his best friend—a Mennonite, which is our local version of Franklin's Quaker—told him flat out that while he wasn't loud, he was generally thought proud. Harlan didn't argue. He added the virtue. He started tracking it. That takes a kind of strength that doesn't show up on a report card.

  Now, this system made him a legendary teacher. The Franklin method of "never contradicting anybody directly" makes for a Socratic classroom where students feel heard. It makes for a beloved mentor.

  It also, I should admit, makes for a maddening uncle. [Pause, shuffles cards] Sorry, where was I—yes, a maddening uncle. When you're ten and you ask if you can have a cookie, and he asks you, "What do you think is the prudent course regarding sugar before dinner?"… you want to throw the grid booklet at him.

  But we grew up. And we realized the grid wasn't about control. It was about attention.

  Which brings us to tonight. Retirement. The bell has rung. The lesson plans are done. And the question the family has been whispering is: What happens to the booklets?

  Does a man who has finished his apprenticeship keep carrying the grid? Or was that always confusing the instrument for the workshop?

  I think I know the answer. I think Harlan knows the answer.

  Franklin wrote that he never arrived at perfection. He said he fell short. But he concluded that he became a better and happier man for the attempt. The point of the grid wasn't to be a machine. The point was to be a gardener. You don't weed a garden because you hate the weeds. You weed because you love the flowers enough to make space for them.

  For thirty-seven years, the garden was the classroom. The weeds were ignorance, cynicism, boredom. He weeded them with Industry, with Justice, with that stubborn, speckled-axe Order.

  Now, the garden changes. Maybe the weeds are different. Maybe the flowers are different. Maybe the virtue of the week is just… Rest.

  I don't think the booklets are going away. But I hope the black spots don't matter as much. Because the character built by tracking them is already there, in the room, in the hundreds of students who learned history from him, and in the family who learned how to try, how to fail, and how to start the cycle again on Monday.

  So, if everyone could raise a glass.

  To Uncle Harlan. To the speckled axe. To the clean columns, and to the messy, beautiful garden you've grown for all of us.

  To Franklin, and to the only man I know who actually read the instructions.

  To Harlan.
