      *   (5) *Premise:* In Trolley cases (Switch vs. Footbridge), the three factors are matched.
      *   (6) *Conclusion:* Therefore, withdrawal/injection are on a par, and switch/footbridge are on a par. Residual differences are bias.

  3.  **Evaluate the Premises against the User's Intuitions:**
      *   The user accepts Smith/Jones parity (3).
      *   The user rejects Trolley parity (6).
      *   The user is unsure about Medical parity (4/6).
