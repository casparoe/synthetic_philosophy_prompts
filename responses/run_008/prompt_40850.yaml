      *   *Why it is false:* It omits the *normative structure of the action itself*. Specifically, it ignores the distinction between *intending harm as a means* vs. *foreseeing harm as a side effect* (Double Effect), and it ignores *rights-based constraints* (I cannot use you without consent).
