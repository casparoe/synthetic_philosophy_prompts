  4.  **Identify the Weak Link:**
      *   **Premise (1)** is the most vulnerable. It asserts a specific meta-ethical claim: *only* consequences, motives, and counterfactual dependence matter. This excludes the *nature of the act itself* (e.g., means vs. side-effect, physical intrusion, rights violations).
      *   **Premise (5)** is also highly controversial in philosophy (Footbridge vs. Switch). Most people (and the user) feel they are different. If the user feels they are different, but accepts (1), then (5) must be false (i.e., the factors *aren't* matched according to the definition in (1)). But the resident claims they *are* matched on consequences, motives, and counterfactuals.
      *   **The Conflict:** The user accepts Smith/Jones parity but rejects Switch/Footbridge parity. The resident's argument treats these as structurally identical applications of Premise (1).
      *   **The Crucial Distinction:** The Doctrine of Double Effect (DDE) or the Means/Side-Effect distinction. In the Switch case, the death of the one is a *side effect* of saving the five. In the Footbridge case, the death of the one is the *means* to saving the five.
      *   **Does Premise (1) capture this?** No. Premise (1) lists "consequences, motives, and counterfactual dependence." It does *not* list "the causal role of the harm relative to the good" (means vs. side-effect).
