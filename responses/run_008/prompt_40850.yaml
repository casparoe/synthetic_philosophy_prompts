          *   You must concede that Rachels was right about Smith/Jones *for the wrong reason* or that Smith/Jones lacks the feature that makes Footbridge different (the bystander is not already threatened).
          *   *Correction on Smith/Jones:* In Smith/Jones, both are seeking inheritance. Both intend death. The difference is physical intervention. Rachels says that doesn't matter. The User agrees.
