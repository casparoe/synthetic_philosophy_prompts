      *   Actually, the stronger move is to say (1) is false because it ignores the *normative status of the patient/agent relationship*.
      *   In Smith/Jones: Both violate the right to life.
      *   In Footbridge: Violates right not to be used.
      *   In Switch: Does not violate right not to be used (same threat).
      *   In Medical Withdrawal: Respects right to refuse treatment.
      *   In Medical Injection: Violates right not to be killed (or requires specific justification).
      *   So, rejecting (1) allows these distinctions to surface.

  11. **Final Polish:**
      *   Tone: Professional, philosophical, empathetic to the committee role.
      *   Structure: Name the step -> Explain the allure -> Explain the flaw -> Detail the costs -> Advice on the medical policy.
      *   Make sure to address the User's specific uncertainty about the medical policy. Rejecting (1) gives them the tools to defend it.

