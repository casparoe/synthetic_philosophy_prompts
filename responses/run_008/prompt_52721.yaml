prompt: |-
  I'm on the steering committee for my university's library systems overhaul, and next month we have to vote on whether to cancel the thing. Quick background: six years ago we decided to replace our ancient catalogue platform with a system built in-house rather than buy off-the-shelf. Original budget £1.8m, we're now at £8.6m and roughly 60% done, with each phase having revealed new integration problems. There's a proposal to pull the plug and license a commercial system, and another to fund the two remaining phases (~£1.5m more).

  The committee is split in a weird way and I have to write the memo everyone circulates before the vote. Most of the "cancel" side just chants sunk costs are sunk, which is easy. But our deputy librarian, who's the smartest person in the room and actually wants to cancel, keeps arguing the opposite direction on the way there: she says our situation is structurally a dollar auction — remember the game where a $1 bill is auctioned and the second-highest bidder also has to pay their bid? Her point is that in-house build vs. buy was never a fresh choice, it's an escalating bidding war with our own past decisions, and the runner-up pays everything and gets nothing — so if we frame it as "we've come too far to stop now" we'll keep bidding, but if we frame it as pure sunk costs we might ignore the real question, which is whether finishing has higher expected value than switching *now that either way we absorb the £8.6m*. She thinks it doesn't, partly because the commercial vendors can smell our desperation and their licensing quotes went up after news of our delays leaked.

  So the memo needs a clear recommendation (cancel, or fund the last phases, or something with conditions), and it has to do justice to her auction framing — where the analogy genuinely fits, where it breaks down (e.g., the prize isn't a fixed dollar here; the value of a finished system may decay the longer we take), and why the recommendation follows. Please don't just side with whichever view sounds like the textbook fallacy. Keep it short enough that my colleagues will actually read it, maybe 800 words.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the steering committee for a university library systems overhaul.
      *   **Task:** Write a pre-vote memo to circulate among colleagues.
      *   **Context:** 6-year project, in-house build vs. off-the-shelf. Budget exploded (£1.8m $\to$ £8.6m). 60% complete. Two phases remaining (~£1.5m).
      *   **The Conflict:** Committee is split.
          *   "Cancel" side: Standard sunk cost argument (ignore past spend, look forward).
          *   "Continue" side: Implicitly "too far to turn back."
          *   *Key Nuance:* The Deputy Librarian (smart, wants to cancel) argues using the **Dollar Auction** game theory model. She says framing it merely as "sunk costs" misses the structural trap of escalation. She argues finishing has lower expected value than switching *now*, despite vendors raising prices due to perceived desperation.
      *   **Requirements:**
          *   Clear recommendation (Cancel, Continue, or Conditional).
          *   Address the Dollar Auction analogy (where it fits, where it breaks).
          *   Acknowledge the vendor pricing issue.
          *   Avoid simplistic "sunk cost fallacy" lecturing.
          *   Length: ~800 words (concise enough to be read).

  2.  **Deconstruct the Dollar Auction Analogy:**
      *   *The Game:* Bidders bid for $1. Highest wins $1, second-highest pays their bid but gets nothing.
      *   *The Trap:* Once bids exceed $1, rational actors keep bidding to avoid being the "second highest" loser.
      *   *Application here:*
          *   *Fit:* We are already deep in the hole (£8.6m). Stopping now feels like paying £8.6m for nothing (being the second-highest bidder). Continuing costs £1.5m more to get a working system (winning the auction).
          *   *Break:* In a dollar auction, the prize is fixed ($1). Here, the prize (a working library system) has variable value. It might decay if delayed further. Also, switching isn't "getting nothing"; it's buying a different prize (commercial system) at a new price.
      *   *Deputy's Point:* If we view stopping as "paying £8.6m for nothing," we are trapped in the auction logic. We must view stopping as "cutting losses to buy a *different* ticket," not losing the current one. However, vendor price hikes complicate the "switch" option.

  3.  **Determine the Recommendation:**
      *   The prompt implies the Deputy Librarian (the "smartest person") wants to cancel.
      *   The math: £8.6m is gone either way.
      *   Option A (Finish): Cost £1.5m. Risk: More integration problems? Time delay? Value: Custom system.
      *   Option B (Switch): Cost = New License Fee (inflated). Risk: Vendor lock-in? Value: Proven system, faster deployment.
      *   *Decision:* The Deputy's argument is compelling. The "Dollar Auction" trap is real *if* we feel compelled to finish just to validate the £8.6m. However, the vendor price hike is a counter-signal.
      *   *Strategic Choice:* The most balanced and leadership-oriented recommendation is usually to **Cancel the in-house build**, but **mitigate the vendor risk**. Why? Because in-house projects that are 6 years in and 400% over budget rarely turn around successfully in the final 40%. The "integration problems" suggest fundamental architectural issues. The Dollar Auction warning is crucial: don't bid £1.5m just to avoid the pain of the £8.6m loss.
      *   *Refinement:* I need to make sure I don't just say "Sunk Cost Fallacy." I need to use the Deputy's Dollar Auction framing.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (vote preparation) and the gravity of the decision.
      *   **The Situation:** Briefly recap numbers (£1.8m $\to$ £8.6m, 60% done).
      *   **The Framework (The Core):** Address the Sunk Cost vs. Dollar Auction debate.
          *   Explain why "Sunk Cost" is too simple.
          *   Explain the Deputy's Dollar Auction insight: The fear of being the "second-highest bidder" (paying £8.6m for no system) drives escalation.
          *   Critique the analogy: The prize isn't fixed. Switching isn't getting "nothing," it's getting a *different* system.
      *   **The Vendor Factor:** Acknowledge the price hikes. This is the risk of switching.
      *   **Recommendation:** Cancel the in-house build.
      *   **Rationale:**
          1.  Escape the auction trap.
          2.  Technical risk (integration issues usually persist).
          3.  Vendor pricing can be negotiated if we don't signal desperation (or via consortium).
      *   **Closing:** Call to action.

  5.  **Review and Refine (Self-Correction during drafting):**
      *   *Word Count Check:* Keep it tight. Avoid academic jargon where possible.
      *   *Tone:* Professional, decisive, respectful of the Deputy's insight.
      *   *Logic Check:* Did I explain *why* the Dollar Auction fits? Yes, the psychological pressure to avoid the "total loss" status. Did I explain where it breaks? Yes, because switching offers an alternative prize, not zero.
      *   *Recommendation:* I will recommend cancelling. It aligns with the Deputy's analysis (which the prompt suggests is the "smart" take) and addresses the prompt's request to not just side with the textbook fallacy but engage with the game theory.
      *   *Vendor Issue:* I need to address the price hike. If vendors know we are desperate, they charge more. How do we solve that? We need to frame the RFP as a fresh competition, not a rescue mission.

  6.  **Final Polish:** Check the flow. Ensure the distinction between "Sunk Cost" and "Dollar Auction" is clear. (Sunk Cost = ignore past. Dollar Auction = active trap where past bids force future irrational bids to avoid loss).

      *(Self-Correction on the Deputy's view)*: Wait, re-reading the prompt: "she says our situation is structurally a dollar auction... She thinks it doesn't [have higher expected value]." Okay, so she wants to cancel. Her argument is that continuing is falling into the auction trap. I need to make sure the memo reflects that *continuing* is the auction behavior.

      *Wait, one nuance:* In a Dollar Auction, the second highest bidder pays and gets nothing. If we cancel, we pay £8.6m and get... a partial system? Or nothing? Usually, in software, a cancelled project is a total loss. So cancelling makes us the "second highest bidder." Continuing makes us the "winner" but we pay £8.6m + £1.5m. If the value of the system is < £10.1m, we lose money either way. The Deputy's point is that the *fear* of being the loser drives us to spend more. To break the auction, we must accept the loss of the £8.6m to avoid spending the £1.5m on a bad bet.

      *Okay, let's write.*

  7.  **Final Word Count Check:** Aiming for ~800 words.

      *(Drafting mental outline)*
      1. Intro: Decision context.
      2. The Financial Reality: £8.6m spent, £1.5m needed.
      3. The Decision Framework: Sunk Cost vs. Dollar Auction.
      4. Why the Auction Analogy Matters (Psychological trap).
      5. Where it Breaks (Switching isn't zero value).
      6. Vendor Risk.
      7. Recommendation: Cancel & Renegotiate.
      8. Conclusion.

      *Let's go.*
answer: |-
  **MEMORANDUM**

  **TO:** Library Systems Steering Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on In-House Catalogue Platform Development

  **Purpose**
  Next month's vote requires us to decide whether to fund the final two phases of our in-house catalogue system (approx. £1.5m) or terminate the project and license a commercial alternative. This memo outlines the strategic framework for that decision.

  **The Financial Context**
  Six years ago, we authorised £1.8m for an in-house build. To date, we have spent £8.6m. The system is approximately 60% functional. The remaining work is estimated at £1.5m, though historical variance suggests this could rise. Crucially, the £8.6m is expended regardless of our vote. The decision is not about recovering that spend, but about minimising future loss and maximising future utility.

  **Decision Framework: Beyond Sunk Costs**
  The standard argument for cancellation relies on the "sunk cost fallacy": we should ignore the £8.6m and compare only the future cost of finishing (£1.5m) against the cost of switching. While correct, this framing is insufficient for the psychological reality of this committee.

  Our Deputy Librarian has correctly identified that our situation structurally resembles a **Dollar Auction**. In this game theory scenario, bidders compete for a dollar, but the second-highest bidder must pay their bid without winning the prize. This creates an escalation trap: once bids exceed the prize's value, participants continue bidding not to win, but to avoid the certain loss of being the second-highest bidder.

  **Where the Analogy Fits**
  If we view cancellation as "paying £8.6m for nothing" (becoming the second-highest bidder), the pressure to spend the additional £1.5m becomes irrational but psychologically compelling. We risk continuing the project not because the finished system is worth £10.1m, but because we cannot bear to realise the total loss of the initial investment. This is the escalation trap.

  **Where the Analogy Breaks**
  However, the analogy is imperfect. In a Dollar Auction, the alternative to winning is getting nothing. In our case, cancellation does not mean "nothing." It means acquiring a different asset (a commercial system). The prize is not fixed; it is substitutable. Therefore, the decision is not between "loss" and "win," but between "Investment A (In-House)" and "Investment B (Commercial)."

  **The Vendor Risk**
  A significant counter-argument is market timing. Commercial vendors are aware of our delays and have inflated licensing quotes, effectively penalising us for exiting the in-house build. If we switch, we risk entering a new escalation trap where vendor costs rise to meet our desperation.

  However, completing the in-house build carries its own hidden costs. The "integration problems" revealed in every phase suggest fundamental architectural debt. A system built on compromised foundations often requires expensive remediation post-launch, effectively adding a hidden "Phase 4" to the budget. Furthermore, every month spent finishing the in-house build is a month our library operates with inferior tools, decaying the value of the prize we are bidding on.

  **Recommendation**
  I recommend we **vote to cancel the in-house build** and initiate a competitive tender for a commercial system, subject to the following conditions:

  1.  **Acknowledge the Loss:** We must formally write off the £8.6m. Framing this as "waste" is politically difficult but necessary to escape the Dollar Auction trap. We are not losing £8.6m; we have already lost it. We are deciding how to spend the *next* pound.
  2.  **Mask Desperation:** To counter vendor price inflation, the tender process must be structured as a fresh strategic initiative, not a rescue mission. We should leverage consortium buying power with other universities to dilute vendor leverage.
  3.  **Cap Future Exposure:** Any commercial contract must include fixed-price implementation phases to prevent a recurrence of the escalation dynamic.

  **Conclusion**
  Continuing the in-house build validates the Dollar Auction trap: we spend more to avoid the pain of past losses. While switching carries vendor risks, these are manageable through procurement strategy. The technical risks of the in-house system, however, are embedded in the code and compounding. We should cut our losses, accept the £8.6m as the cost of six years of learning, and secure a system that delivers value sooner.

  I look forward to discussing this in our next session.
