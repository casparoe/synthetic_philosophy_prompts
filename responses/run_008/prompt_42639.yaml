  Here is a breakdown you can paste directly into the channel. It dissects the slogan "no new relevant information" into five distinct technical claims. For each, it evaluates whether the claim is true, whether it actually forces the 1/2 conclusion, and how it behaves in the "woken twice regardless" variant your friend mentioned.

  ***

  **Menu of Interpretations: "Beauty Receives No New Relevant Information"**

  The slogan is ambiguous. To decide the debate, we have to specify *what kind* of information is being discussed. Here are the five distinct claims hidden inside that sentence.

  **1. The "No New Uncentered Fact" Claim**
  *   **Definition:** Beauty learns no proposition about the external world that does not involve indexicals like "I," "now," or "today." (e.g., She doesn't learn the coin result, the day of the week, or the experiment status from an outside view).
  *   **True in Standard SBP?** **Yes.** She knew on Sunday she would wake up. She doesn't learn the coin outcome.
  *   **Entails Halving (1/2)?** **No.** Thirders agree with this claim. Thirders argue that *centered* (self-locating) information can update credences even if *uncentered* information does not. Accepting this claim is compatible with Thirding.
  *   **True in "Always Twice" Variant?** **Yes.** (She still learns no uncentered fact about the coin).

  **2. The "No Elimination of Possibilities" Claim**
  *   **Definition:** Upon waking, Beauty does not rule out any "centered world" (a combination of Coin + Day + Perspective) that she considered possible on Sunday.
  *   **True in Standard SBP?** **No.** On Sunday, she considered it possible that "It is Tuesday and I am asleep." Upon waking, she rules out "I am asleep now." She has gained the self-locating information *I am awake now*.
  *   **Entails Halving (1/2)?** **No.** If you admit she rules out "I am asleep," you admit she gains information. Whether that information shifts the coin credence is the next question, but the slogan "she learns nothing" is strictly false here.
  *   **True in "Always Twice" Variant?** **No.** (She still rules out being asleep).

  **3. The "No Evidence for Tails" Claim (Likelihood Ratio)**
  *   **Definition:** The experience of waking is equally likely under Heads and under Tails. ($P(\text{Wake} | \text{Heads}) = P(\text{Wake} | \text{Tails})$).
  *   **True in Standard SBP?** **No.** This is the core of the Thirder argument. Under Tails, there are two opportunities for this awakening; under Heads, only one. Waking is more likely (in a sampling sense) if the coin is Tails.
  *   **Entails Halving (1/2)?** **Yes.** If this claim were true, Bayesian conditionalization would keep the coin at 1/2. But since the claim is false in the standard setup, the slogan fails to justify Halving here.
  *   **True in "Always Twice" Variant?** **Yes.** In this variant, she wakes twice regardless of the coin. Waking provides **zero** evidence for Tails over Heads.
      *   *Note:* This shows your friend is conflating the Standard game with the Variant. In the Variant, this claim is true and the coin stays 1/2. In the Standard game, it is false.

  **4. The "No Change in Total Evidence" Claim**
  *   **Definition:** The set of true propositions known by Beauty at Wake is identical to the set known on Sunday.
  *   **True in Standard SBP?** **No.** Trivially false. On Sunday she knows "It is Sunday." On Wake she knows "It is not Sunday." Her total evidence has changed.
  *   **Entails Halving (1/2)?** **No.** This is just a platitude that is factually incorrect. Everyone agrees her evidence changes; the debate is about *relevance*.
  *   **True in "Always Twice" Variant?** **No.** (Same reason).

  **5. The "Monday is 50/50" Claim**
  *   **Definition:** Specifically regarding the day, waking provides no evidence that it is Monday rather than Tuesday. ($P(\text{Mon} | \text{Wake}) = 1/2$).
  *   **True in Standard SBP?** **No.** Even most Halfers (Lewis-Halfers) agree $P(\text{Mon}) = 3/4$ upon waking, because Heads guarantees Monday, while Tails splits between Mon/Tue. Only a "Double Halfer" claims 1/2, but this violates standard conditionalization rules.
  *   **Entails Halving (1/2)?** **N/A.** This is a derived claim, not a premise. But if he asserts this, he is mathematically inconsistent with the standard Halfer position ($P(H)=1/2 \rightarrow P(Mon)=3/4$).
  *   **True in "Always Twice" Variant?** **Yes.** In the variant where she wakes both days regardless of the coin, Monday and Tuesday are equiprobable awakenings. $P(\text{Mon}) = 1/2$.
      *   *Note:* This is the smoking gun. Your friend's slogan yields the correct result for the *Variant* ($P(\text{Mon})=1/2$) but the wrong result for the *Standard* game ($P(\text{Mon}) \neq 1/2$).

  ***

  **Summary for the Channel:**
  If your friend insists "No new information" implies $P(\text{Heads})=1/2$ **and** $P(\text{Monday})=1/2$:
  1.  He is relying on **Claim #3** (No Evidence for Tails). This is **false** in the Standard game (waking is evidence for Tails) but **true** in his Variant. He cannot use the Variant to justify the Standard game.
  2.  He is relying on **Claim #5** (Monday is 50/50). This is **false** in the Standard game (even for Halfers) and **true** in his Variant.
  3.  If he retreats to **Claim #1** (No Uncentered Info), he is correct, but that claim **does not entail Halving** (Thirders accept Claim #1).

  The slogan only works if he equivocal between the Standard game and the Variant. In the Standard game, waking *is* evidence for Tails (Claim #3 is false). In the Variant, it is not. He cannot have it both ways.
