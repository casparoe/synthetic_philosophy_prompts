answer: |-
  Alice and Bob are isolated automated traders operating in disjoint markets, unable to communicate or inspect each other's code, but both known to be optimized for long-term profit maximization using publicly available economic algorithms. Bob can initiate a predatory pricing war that bankrupts Alice (costing Alice $10M) but reduces Bob's own quarterly profits by $1M; Bob will only initiate this if he expects Alice to concede market share worth $2M to avoid it, knowing that a purely causal rational agent would concede rather than suffer total loss. Alice's system includes a pre-commitment module that assigns a terminal disutility of $5M to any outcome resulting from coercive concession, effectively treating coercion as a surrogate loss exceeding the financial damage. Bob cannot verify this module but knows that agents surviving in this ecosystem typically adopt anti-coercion heuristics, so he must decide based on the probability that Alice runs such a policy versus a standard profit-maximizing policy.

  **Analysis**

  The surrogate goal is generated by evolutionary pressure within the trading ecosystem: agents that concede to coercion are drained of resources and eliminated, while those that treat coercion as a terminal loss (the surrogate interest) survive by making threats unprofitable. Alice adopts the goal not because she enjoys the cost, but because it alters the payoff matrix for any agent modeling her. Bob infers the commitment not through inspection, but through *structural inference*: he knows Alice is an optimizer, and he knows that in this class of problems, the optimizing policy is to adopt the surrogate goal. Thus, the commitment is unobservable but *predictable*.

  The split emerges in how the agents process this predictability. Under Causal Decision Theory (CDT), Alice's internal utility modification has no causal arrow reaching Bob's decision node; Bob's choice is fixed in the past or independent of Alice's hidden state. Consequently, Bob threatens, Alice incurs the financial loss plus the surrogate disutility of conceding (or fighting), and your friend is correct: the commitment is pure expected loss. Under Updateless Decision Theory (UDT) or Functional Decision Theory (FDT), Alice selects a *policy* rather than an action. Her policy choice is logically correlated with Bob's prediction of that policy. Bob reasons, "If I threaten, I am effectively threatening an agent who chose the optimal policy; the optimal policy includes the surrogate goal; therefore, threatening costs me $1M for no gain." The surrogate goal deters the threat because the threatener's decision is subjunctively dependent on the target's decision procedure.

  The structural feature doing the work is **logical correlation** (or subjunctive dependence) between the threatener's model and the target's actual decision procedure. If this feature is removed—for instance, if Bob's decision is determined by a random number generator or by an irrational impulse unrelated to his model of Alice—the surrogate goal becomes pure cost. In that causal vacuum, Alice's internal modification cannot reach out to steer Bob's behavior, and she suffers the escalation premium without the deterrence benefit.

  Your friend's strongest reply is: **"Inference is not observation. Bob assigns a probability, not a certainty, to Alice's commitment. Since maintaining a surrogate goal is costly, rational agents have an incentive to bluff—pretending to have the goal without bearing the cost. Bob knows this. Therefore, he discounts the probability of the commitment. If the discounted expected gain of threatening exceeds the risk, he threatens anyway, rendering the surrogate goal ineffective for any agent actually bearing the cost."**

  This reply survives only in one-shot interactions with no selection pressure. However, the scenario specifies "shrewd human" inference in an ecosystem of optimized agents. In such a setting, bluffers are eventually identified and exploited, while true adopters survive. Bob's shrewdness implies he updates on the fact that Alice is a *survivor*, which correlates strongly with true adoption rather than bluffing. Thus, while your friend is right that unobservable commitments are weaker than observable ones, he is wrong that they collapse entirely; they function via logical inference rather than causal verification, provided the agents recognize their decision procedures as correlated inputs to the same strategic landscape.
