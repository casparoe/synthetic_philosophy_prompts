  # HANDOUT: The Periodization Decision Tree
  **Topic:** Historiography & Survey Discussion  
  **Epigraph:** *"There was no such thing as the Scientific Revolution, and this is a book about it."* — Steven Shapin

  **Instructions:** Start at **Node 1**. Follow the arrows based on your intuition. Answer the questions as they are phrased—do not try to guess which "position" you are supposed to land on. If you land on a named position, write it down. If you land in "Nowhere," note why.

  ---

  ### **NODE 1: The Fact of the Matter**
  When your students ask you, "When did the Middle Ages end?", is there a **fact of the matter** you are trying to report back to them (even if we don't know it yet), or are you negotiating a boundary agreement?
  *   **A.** There is a fact of the matter (a true date exists). → *Go to Node 2*
  *   **B.** There is no fact of the matter (we are negotiating). → *Go to Node 5*

  ### **NODE 2: The 1500 Test**
  Imagine a merchant in Florence in the year 1500. If they said, "I am living in the Middle Ages," would they be **factually mistaken** about their own time?
  *   **A.** Yes, they could be mistaken (the era exists independently of their awareness). → *Go to Node 3*
  *   **B.** No, that's a category error (they are just living; "eras" are for later historians). → *Go to Node 5*

  ### **NODE 3: The Date Disagreement**
  Historians argue for 1453 (Constantinople), 1492 (Columbus), or 1517 (Luther). Is this disagreement like arguing about the **height of a mountain** (one answer is right, others are measurement errors) or like arguing **where a neighborhood begins** (all are reasonable lines drawn in a gradient)?
  *   **A.** Height of a mountain (One date is the true boundary). → *Go to Node 4*
  *   **B.** Where a neighborhood begins (Boundaries are inherently fuzzy). → *Go to Node 4*

  ### **NODE 4: The Essence Check**
  Is there a **single defining feature** (an essence, like "secularism" or "feudalism") that makes a period what it is, or is a period just a **cluster of overlapping traits** with no core?
  *   **A.** Single defining feature. → **LEAF: Strong Realism**
  *   **B.** Cluster of overlapping traits. → **LEAF: Family-Resemblance Realism**

  ---

  ### **NODE 5: The Continuity Thesis**
  *(Reached if you denied a "fact of the matter" or "contemporary mistake" above)*
  If we prove that modern science has deep medieval roots (continuity), does the label "Scientific Revolution" become **false**, or does it remain **useful/complicated**?
  *   **A.** It becomes false (the label lies about the past). → *Go to Node 6*
  *   **B.** It remains useful (the label highlights a shift, even if roots are deep). → *Go to Node 7*

  ### **NODE 6: The "Dark Ages" Test**
  We stopped using the label "Dark Ages" but kept the years 500–1000 unchanged. Given your answer to Node 5, should we do the same for "The Renaissance" (drop the label, keep the years)?
  *   **A.** Yes, drop the label (and most others like it). → *Go to Node 6b*
  *   **B.** No, keep "Renaissance" but drop "Dark Ages". → **LEAF: Selective Eliminativism**

  ### **NODE 6b: Scope of Elimination**
  *(Reached if you said "Yes" to Node 6)*
  Should we ban **all** period labels (Medieval, Modern, etc.) because they obscure more than they reveal, or only the toxic ones?
  *   **A.** Ban all of them. → **LEAF: Flat Eliminativism**
  *   **B.** Only the toxic ones. → **LEAF: Selective Eliminativism** *(Note: You arrived here via a different path than Node 6)*

  ### **NODE 7: Carving Nature**
  *(Reached if you said labels remain "useful" in Node 5)*
  Do some periodizations (like "Industrial Revolution") objectively **carve reality at its joints** better than others (like "Renaissance"), or are they only better relative to specific research questions?
  *   **A.** Some objectively carve better. → *Go to Node 8*
  *   **B.** Only better relative to questions. → **LEAF: Perspectivalism**

  ### **NODE 8: Scope of Utility**
  *(Reached if you said "Some objectively carve better" in Node 7)*
  Are these "better" labels useful for **all historians** universally, or only for historians asking specific types of questions (e.g., intellectual history vs. economic history)?
  *   **A.** Useful for all historians. → **LEAF: Conventionalism**
  *   **B.** Only for specific questions. → **LEAF: Perspectivalism** *(Note: You arrived here via a different path than Node 7)*

  ---

  ## **LOGIC CHECK & MAP NOTES**

  ### **1. Indistinguishable Leaves**
  *   **Family-Resemblance Realism vs. Conventionalism:** In practice, these two positions often look identical. Both admit boundaries are fuzzy and that labels are human tools, but one claims the "clusters" are real features of the past (Realism) while the other claims the "clusters" are just useful groupings (Conventionalism). If you found yourself arguing about semantics here, you are in good company; many historians occupy the space between these two leaves.
  *   **Selective Eliminativism (Node 6 vs. Node 6b):** You can reach this leaf from two different directions. Logically, the position is the same (keep some labels, drop others), but the *motivation* differs. One group drops "Renaissance" because it's factually false (Node 6 path); the other drops "Dark Ages" because it's value-laden/toxic (Node 6b path).

  ### **2. Nowhere Land (Incoherent or Unoccupied Combinations)**
  *   **Node 1 (No Fact) + Node 2 (Yes Mistaken):** If you believe there is *no fact of the matter* about when a period ends, it is logically incoherent to say a contemporary could be *factually mistaken* about which period they are in. You cannot be wrong about a fact that does not exist. If you answered this way, you likely slipped into thinking "mistaken" meant "disagreeing with modern consensus" rather than "describing reality incorrectly."
  *   **Node 5 (False) + Keep Label:** If you believe continuity proves the "Scientific Revolution" is **false** (Node 5A), but you argue we should **keep using the label** anyway, you land in an unattractive logical space. This implies historians should knowingly teach falsehoods for convenience. While some might argue this pragmatically, it is philosophically unstable; usually, this combination collapses into **Conventionalism** (admitting it's not "true" but "useful," which contradicts the "False" answer).
  *   **Strong Realism:** While logically possible, this leaf is practically unoccupied in modern historiography. Almost no professional historian believes there is a single "essence" of the Renaissance that could be pinpointed to an exact year like a physical event. If you landed here, check if you are conflating "political events" (which have dates) with "cultural periods" (which do not).

  ### **3. The "Dark Ages" Variable**
  Note that **Node 6** tests your consistency. If you claim periods are "false" due to continuity (Node 5A), you must be willing to drop "Renaissance" just as we dropped "Dark Ages." If you refuse to drop "Renaissance," you are implicitly admitting that **utility** matters more than **truth**, which pushes you back toward **Conventionalism**.
