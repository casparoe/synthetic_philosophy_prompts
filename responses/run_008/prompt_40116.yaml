      *   If V_low = 2.
      *   Fight EV = 0.5(2) - 4 = -3. (Rational Low player yields).
      *   Equilibrium: High gets 10, Low gets 0. Total 10.
      *   Naive SPI (Coin): High gets 5, Low gets 1. Total 6.
      *   High player is *worse off* (5 vs 10). They will reject the SPI.
      *   This demonstrates why SPI is hard: You can't just randomize over the *resource*, you have to randomize over the *strategies* in a way that preserves the "concession" benefit when it exists.
      *   *Actually, true SPI usually randomizes over the conflict outcomes specifically.*
      *   If the conflict *would have happened*, SPI saves the cost.
      *   If conflict *would not have happened*, SPI should stay out of the way.
      *   The challenge is: How does the mediator know if conflict would have happened without asking for private values (which creates lying incentives)?
      *   *This is the core tension for the debrief.*

