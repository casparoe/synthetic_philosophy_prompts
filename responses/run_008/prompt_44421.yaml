prompt: |-
  I'm putting together a panel discussion for my podcast on what's sometimes called the gender-equality paradox -- the finding that occupational sex segregation, e.g. in STEM, tends to be *larger* in countries that score higher on gender equality indices, not smaller (the original paper used students' relative strengths and interests across ~70 countries, and the finding also shows up in things like the variance in men's vs women's interests). I want to hand my two guests their positions in advance, so that it's a real argument and not the usual cable-news version of it, and I'd like you to write the transcript we can only dream of getting. Please write like a dramatist who has a philosophy background and genuinely understands both sides -- think carefully about each move before writing it, maybe brainstorm the strongest version of each character's position first.

  Guest 1 is an evolutionary-minded psychologist who thinks the paradox is basically revealed preference: once you remove material constraint, people sort by what they actually enjoy and are good at, and average sex differences in interests (people-vs-things orientation) do some real work. Guest 2 is a quantitative sociologist who thinks that inference is way too fast. They should hit, at minimum: (a) Guest 2's argument that the finding may partly be a statistical artifact -- think about how you aggregate or rank "interests" across countries with very different school systems, and whether the paradox survives if you look at absolute interest in science rather than relative strength profiles; (b) Guest 1's comeback that even if some of the effect is measurement, the cross-country pattern keeps showing up across different datasets and outcomes, and "equal institutional treatment" isn't the same as "no social pressures" -- wealthy liberal countries have their own gendered norms, just subtler ones; and (c) whether *either* of them gets to draw any conclusion about justice or policy from this -- Guest 2 is very worried about the naturalistic fallacy slide from "possibly biological" to "therefore leave it alone," while Guest 1 insists that Guest 2 is doing the mirror-image slide, rejecting an empirical hypothesis because its policy implications are uncomfortable.

  Both guests are smart and arguing in good faith -- no strawmen, no one "destroys" the other, and they should actually respond to each other's points rather than delivering prepared speeches past each other. I want at least one moment where each guest concedes something real to the other, and I'd rather the ending be a genuine impasse or partial agreement than a tidy synthesis. It can get a little heated but stay collegial, like people who've read each other's papers and mostly respect each other. Maybe 1200-1800 words, stage directions are fine but keep them sparse. Begin directly with the dialogue itself -- no preface, no commentary, no framing note about what you're about to do.
