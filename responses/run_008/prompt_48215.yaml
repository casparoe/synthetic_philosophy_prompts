      *   *C3 (Compatibilism):* Determinism is compatible with responsibility because reasons-responsive sequences can exist in deterministic worlds.
      *   *C4 (Pereboom's Plum):* Plum (in Manipulation Cases) is *not* responsible, even in Case 4 (ordinary determinism). The intuition survives the slippery slope.
      *   *C5 (Fairness/History):* Unjust to blame if the agent never had a fair opportunity to avoid becoming the type of person who does such things (Historical Condition).
