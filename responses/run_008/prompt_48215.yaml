          *   *The Conflict:* If C2 is the *sole* criterion (Actual Sequence), coercion shouldn't necessarily exculpate if the reasoning process is intact. But C6 says it does. C5 (Fairness/History) might save this: The clerk had no fair opportunity to avoid the situation. But Jones (Frankfurt) also had no opportunity to avoid the situation (Black is there).
