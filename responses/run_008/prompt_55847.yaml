      *   **The Move:** Achilles says $A \land B \implies Z$. Tortoise accepts $A, B$. Accepts the hypothetical $(A \land B) \implies Z$ (let's call it $C$). But refuses to conclude $Z$ unless $C$ is added as a premise.
      *   **The Regress:** Then Achilles needs $(A \land B \land C) \implies Z$ (call it $D$). Tortoise accepts $D$ but won't conclude $Z$. And so on ad infinitum.
      *   **Core Issue:** The distinction between *rules of inference* (operational mechanisms) and *premises/axioms* (static data). The Tortoise treats the rule of inference (Modus Ponens) as just another premise.

  3.  **Translate to Compiler/PL Vocabulary:**
