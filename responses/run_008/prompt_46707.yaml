answer: |-
  # Specification: Aggregation of Claims in Scanlon-Style Contractualism

  ## Preamble
  This specification defines the necessary conditions for an adequate account of numbers and aggregation within a contractualist framework. The goal is not to summarize existing literature but to establish the criteria against which any proposed solution must be tested. The central tension lies between the *individualist* foundations of contractualism and the *aggregative* demands of moral intuition.

  ## I. The Desiderata

  ### 1. The Numbers Intuition (Rescue Case)
  *   **Requirement:** The account must justify choosing to save a larger group over a smaller group (e.g., five vs. one) in direct conflict cases where all other variables are equal.
  *   **Motivation:** The "Rescue Case." Intuitively, it is wrong to save the one when you could save the five, even if the one has no stronger individual claim than any single member of the five.
  *   **Constraint:** This justification cannot rely on simple summation of welfare (utilitarianism) or treating the group as a collective entity. It must respect the distinctness of persons while still allowing the number of persons to affect the outcome.
  *   **Camp:** Aggregators (e.g., Hooker, later Scanlon) vs. Non-Aggregators (e.g., early Scanlon, Taurek).
  *   **Status:** **Non-Negotiable.** A moral theory that mandates flipping a coin between saving one and saving five is phenomenologically untenable.

  ### 2. The Individualist Restriction (IR)
  *   **Requirement:** The account must not permit the loss suffered by one person to be directly balanced against or cancelled out by the gains enjoyed by others. Principles must be justifiable to each individual on the basis of their own reasons.
  *   **Motivation:** The "Separateness of Persons." Utilitarian aggregation treats humanity as a single container of value; contractualism treats it as a forum of distinct individuals.
  *   **Constraint:** Explicitly, this is a **Camp Prejudice** masquerading as a desideratum. While it is definitional for *Scanlonian* contractualism, it is the primary obstacle to solving Requirement 1. To solve the numbers problem, this restriction must either be discarded, reinterpreted as a heuristic, or shown to be compatible with a form of aggregation.
  *   **Camp:** Non-Aggregators (Purists).
  *   **Status:** **Negotiable.** It is the core brand identity of contractualism, but if it renders the theory incapable of guiding action in conflict cases (see Impossibility Result below), it must be revised.

  ### 3. The Small Impositions Problem (Aggregation of Burdens)
  *   **Requirement:** The account must explain how a principle imposing a tiny burden on each of a very large number of people can be rejected, even if no single individual's burden is comparable to the burden avoided (e.g., one death).
  *   **Motivation:** Social Coordination. Traffic laws, taxation, and pollution regulations rely on the idea that many small costs can aggregate to outweigh a significant individual liberty or cost.
  *   **Constraint:** If the theory forbids summing (per IR), it cannot explain why the million headaches outweigh the one death. If it allows summing, it violates IR. The account must navigate this without collapsing into utilitarianism.
  *   **Camp:** Aggregators / Moderate Contractualists.
  *   **Status:** **Non-Negotiable.** A theory that cannot justify traffic laws or public health measures is practically useless.

  ### 4. The Transgression Cost Constraint
  *   **Requirement:** The account must distinguish between the *cost of complying* with a principle and the *cost of the principle being transgressed*. It must explain whether the moral "wrong" of violating a right (transgression) carries a weight that can be aggregated or outweighed by many smaller claims.
  *   **Motivation:** The "Killing vs. Letting Die" intuition. Many people suffering minor inconveniences (cost of compliance) generally cannot justify killing one innocent person (transgression cost). However, they might justify imposing a risk.
  *   **Constraint:** The theory must specify if "being wronged" is a distinct complaint type that blocks aggregation, or if it is merely another harm to be weighed.
  *   **Camp:** Rights-based Contractualists (e.g., Kumar).
  *   **Status:** **Negotiable.** This is a theoretical mechanism to solve Req 1 and 3, not a pre-theoretical intuition itself.

  ### 5. The Scope of Complaints (Affected vs. Objectors)
  *   **Requirement:** The account must specify whose complaints count in the selection of principles: only those who are *objecting* to a principle, or all those *affected* by it.
  *   **Motivation:** The "Bystander Problem." If a principle saves the many but kills the one, does the one object? Do the saved count as objectors against a principle that would have let them die?
  *   **Constraint:** If only objectors count, the saved many may have no complaint against a principle that lets them die (if they aren't alive to object). If all affected count, the view risks consequentialism.
  *   **Camp:** Universalists vs. Restricted Contractualists.
  *   **Status:** **Non-Negotiable.** The theory must be internally consistent on who constitutes the moral constituency.

  ### 6. Risk and Uncertainty Assessability
  *   **Requirement:** The account must provide a method for assessing principles that impose probabilistic harms rather than certain outcomes.
  *   **Motivation:** The "Ex-Ante/Ex-Post" Problem. A policy might expose millions to a 1/1,000,000 chance of death to save one life certainly.
  *   **Constraint:** The theory must decide whether complaints are lodged based on the *ex-ante* risk imposed or the *ex-post* harm realized. Pure ex-post views make risk-imposition impossible to judge before the fact; pure ex-ante views may ignore actual victims.
  *   **Camp:** Ex-Ante vs. Ex-Post Aggregators.
  *   **Status:** **Non-Negotiable.** Real-world policy operates under uncertainty; a theory limited to certainty is inert.

  ---

  ## II. The Impossibility Result

  **Verdict:** Your suspicion is correct. **The Numbers Intuition (Req 1) and the Strong Individualist Restriction (Req 2) are jointly unsatisfiable.**

  **Reasoning:**
  1.  **The Individualist Restriction** dictates that Person A's loss cannot be outweighed by Person B's gain. In a conflict case, the One's loss (death) cannot be outweighed by the Five's gain (survival).
  2.  **The Numbers Intuition** dictates that the Five's survival *does* outweigh the One's death.
  3.  **The Conflict:** To satisfy the Numbers Intuition, the Five must exert a "moral force" greater than the One. Since each of the Five has an identical claim to the One, the only way their force is greater is if their claims are *aggregated* (summed or combined).
  4.  **The Contradiction:** Aggregation violates the Strong Individualist Restriction. If you forbid aggregation, the Five exert no more force than the One (1 claim vs. 1 claim), leading to a tie (coin flip). If you allow the Five to outweigh the One, you have functionally aggregated, violating the IR.

  **Conclusion:** You cannot honor the Strong Individualist Restriction and the Numbers Intuition simultaneously without engaging in "aggregation by stealth" (redefining aggregation to sound like individualism). A viable theory must either weaken the IR (allowing limited aggregation) or reject the Numbers Intuition (accepting the coin flip).

  ---

  ## III. The Primary Filter

  **The Single Most Exclusionary Requirement:** **The Small Impositions Problem (Req 3).**

  **Reasoning:**
  While the Individualist Restriction defines the *type* of theory (contractualism vs. utilitarianism), the Small Impositions Problem is what renders specific contractualist accounts *unworkable*.
  *   Strict Non-Aggregators pass the IR but fail Small Impositions (they cannot justify traffic laws).
  *   Utilitarians pass Small Impositions but fail the IR.
  *   Therefore, any candidate account that wishes to remain contractualist *and* action-guiding must solve Req 3. This requirement excludes the "purest" versions of the theory (which are most faithful to Scanlon's original text) and forces the theory toward complex, hybrid models that often look suspiciously like the consequentialism they sought to avoid. It is the pressure point that breaks the system.

  ---

  ## IV. Scorecard: Candidate Accounts

  Here is how three prominent approaches fare against the specification, weighted by the criteria above.

  **1. Strict No-Aggregation (Early Scanlon / Taurek)**
  *   **Performance:** Fails **Req 1 (Numbers)** and **Req 3 (Small Impositions)**. Passes **Req 2 (IR)** perfectly.
  *   **Sketch:** This view holds that complaints are only comparable one-to-one. In a rescue case, you must flip a coin. In a small imposition case, one death outweighs a million headaches.
  *   **Verdict:** Theoretically pure but practically absurd. It honors the brand (IR) but fails the world (Numbers/Impositions).

  **2. Levelling-Down-Averse Aggregative Amendment (e.g., Otsuka / Voorhoeve)**
  *   **Performance:** Passes **Req 1 (Numbers)** and **Req 3 (Small Impositions)**. Fails **Req 2 (IR)** (technically).
  *   **Sketch:** This view allows aggregation only when it does not involve "levelling down" (making the worse off even worse to benefit the better off). It attempts to save the Numbers Intuition by arguing that saving the five minimizes the number of individuals with a legitimate complaint.
  *   **Verdict:** The most robust practical solution, but it effectively abandons the Strong Individualist Restriction. It is contractualism in name, aggregative consequentialism in function.

  **3. Appeal to Transgression Costs (e.g., Kumar / Later Scanlon)**
  *   **Performance:** Passes **Req 2 (IR)** (nominally) and **Req 4 (Transgression)**. Struggles with **Req 1 (Numbers)** and **Req 3 (Small Impositions)**.
  *   **Sketch:** This view argues that violating a principle (transgression) carries a distinct moral cost beyond the harm caused. It tries to block aggregation by saying the One's complaint against *being killed* is categorically different from the Five's complaint against *dying*.
  *   **Verdict:** Nuanced but unstable. It explains why we shouldn't kill the one to save the five, but fails to explain why we *should* save the five if we can do so without "killing" the one (e.g., diverting a trolley). It often collapses back into No-Aggregation in hard cases.
