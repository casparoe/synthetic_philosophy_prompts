answer: |-
  You have described a sophisticated systemic failure with great precision. To answer your first question directly: **No, there is no single, established technical term in economics or sociology that captures the entire cycle you described.**

  There are terms for the *parts*, and terms for the *end state*, but the specific dynamic loop you outlined—the escalation, the industry formation, the stable equilibrium of appearance, and the absence of individual villainy—does not have a unified label in the literature.

  Here is the breakdown of the nearest neighbors, why they fall short, the specific concepts for the stages you asked about, and finally, the carving and name you requested.

  ### 1. The Nearest Neighbors (and why they fall short)

  *   **Goodhart's Law:** As you noted, this covers only the *trigger*. It states that "when a measure becomes a target, it ceases to be a good measure." It describes the moment of breakdown, not the subsequent arms race, the refinement cycles, or the stable equilibrium of waste.
  *   **Campbell's Law:** The sociological cousin of Goodhart's Law ("The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures"). It implies corruption/gaming but doesn't capture the *legitimate* refinement process or the "no villain" aspect.
  *   **Metric Fixation:** Coined by historian Jerry Muller (in *The Tyranny of Metrics*). This is the closest cultural diagnosis. It covers the obsession with measurement and the costs. *Shortcoming:* It is a cultural critique, not a game-theoretic model. It doesn't formally define the equilibrium state or the strategic adaptation loops.
  *   **Institutional Decoupling:** In organizational sociology (Meyer & Rowan), this describes when an organization's formal structures (policies, metrics) become separated from its actual work practices. *Shortcoming:* This describes the *end state* (the separation) but not the *dynamic process* (the escalation and refinement) that got you there.
  *   **Rent-Seeking:** In economics, this is when an entity increases its share of existing wealth without creating new wealth. The "appearance industry" you describe is absolutely engaging in rent-seeking. *Shortcoming:* Rent-seeking is a behavior, not a system configuration. It doesn't account for the measurement proxy itself or the management's responsive refinements.
  *   **The Lucas Critique:** In macroeconomics, this argues that policy changes will alter the expectations and behavior of economic agents, rendering historical correlations useless. *Shortcoming:* This covers the *strategic adaptation* (your second question), but it is focused on policy modeling, not organizational measurement systems.

  ### 2. The "No Villain" Aspect

  You asked if there is a concept for the feature where the bad outcome is composed entirely of locally reasonable decisions.

  *   **The Problem of Many Hands:** In ethics and political science, this refers to situations where responsibility is so distributed that no single individual can be held accountable for a negative outcome.
  *   **Coordination Failure (or Moloch):** In game theory and rationalist philosophy (popularized by Scott Alexander), this describes a multi-player game where every player acts rationally in their own self-interest, yet the Nash Equilibrium is suboptimal for everyone. This captures the "no villain" dynamic perfectly: everyone is playing their best hand, but the game itself is broken.
  *   **Systemic Rationality:** The state where individual rationality aggregates to collective irrationality.

  ### 3. The Carving: A Name and Definition

  Since the configuration lacks a standard name, I will propose one that synthesizes the economic and sociological elements you described. The most precise label for this specific configuration is **The Goodhart Equilibrium**.

  While "Goodhart's Law" describes the *breakdown*, **The Goodhart Equilibrium** describes the *stable state* that follows the escalation.

  #### **Definition: The Goodhart Equilibrium**
  A systemic state in which an organization's measurement regime has decoupled from its primary goal due to iterative strategic adaptation, resulting in a stable allocation of resources toward the *production of metric compliance* rather than *goal achievement*, sustained by locally rational behavior from all participants.

  #### **Necessary Conditions (The Edges)**
  For a situation to qualify as a **Goodhart Equilibrium**, it must meet all five of the following criteria:

  1.  **The Unmeasurable Core:** The true goal is inherently difficult or impossible to measure directly (e.g., "learning," "health," "usefulness").
  2.  **The Proxy Ladder:** There has been at least one cycle of metric refinement. (Initial metric $\rightarrow$ Gaming $\rightarrow$ Refined metric). A single static metric that is gamed is just Goodhart's Law; the *Equilibrium* requires the history of escalation.
  3.  **The Decoupling:** There is a significant, persistent gap between the metric's signal and the reality of the goal. (High scores do not guarantee high performance).
  4.  **Local Rationality:** No individual participant is acting "incorrectly" by their local incentives. Management is right to measure; workers are right to optimize for rewards; auditors are right to verify. There is no "villain," only misaligned systemic incentives.
  5.  **Defensive Stability:** The system resists correction. Attempts to remove or simplify the metrics are met with resistance from the "appearance industry" (internal or external) because their utility depends on the complexity of the measure.

  #### **Boundary Conditions (When it does *not* apply)**

  *   **Is an industry required?**
      *   *No.* A Goodhart Equilibrium can exist within a single department where employees simply learn to "work the system." However, the emergence of a specialized industry (consultants, test-prep, SEO) is a strong *indicator* that the Equilibrium has matured and stabilized.
  *   **Does the goal have to be unmet?**
      *   *No, but efficiency must be degraded.* If the goal is being met, but at 10x the cost because 90% of effort is spent on measurement compliance, it is still a Goodhart Equilibrium. The defining feature is the *fraction of effort* diverted to appearance, not necessarily the total failure of the goal.
  *   **Is it just "Bureaucracy"?**
      *   *No.* Bureaucracy implies rule-following. In a Goodhart Equilibrium, the rules are actively *optimized against*. It is dynamic, not static.
  *   **Is it "Fraud"?**
      *   *No.* Fraud implies deception that violates the rules. In a Goodhart Equilibrium, the participants are following the rules exactly; the rules themselves are the vulnerability.

  ### 4. Addressing Your Specific Questions

  > *Does economics have something for the stage where the people being measured become strategic about the measure?*

  Yes. This is **Rational Expectations** applied to micro-incentives, often discussed under the **Lucas Critique**. In labor economics, this is sometimes called **Incentive Contamination**. The distinction you sensed is correct: it differs from a simple price change because the *structure* of the relationship changes. The measure is no longer information; it is a constraint to be optimized.

  > *Is there a separate concept for the feature that disturbs me most, that the bad outcome is composed entirely of locally reasonable decisions?*

  Yes. This is **Coordination Failure** resulting from **Misaligned Incentives**. In the context of organizational theory, it is often referred to as **Sub-optimization** (where sub-units optimize their own metrics at the expense of the whole). The philosophical label for "no villain, just bad system" is **Structural Sin** or **Systemic Vice**.

  ### Summary

  You have identified a gap in the terminology. We have **Goodhart's Law** for the moment the proxy breaks, and **Institutional Decoupling** for the state of separation. We lack a standard term for the *escalating cycle of refinement and defense* that connects them.

  **The Goodhart Equilibrium** is the name for that cycle's end-state. It applies when the cost of measuring has surpassed the value of the measurement, yet the system persists because the cost of *stopping* the measurement is politically higher than the cost of continuing the waste. It is the point where the map not only fails to match the territory but actively consumes the territory to redraw the map.
