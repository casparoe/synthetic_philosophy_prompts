  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of a county citizen art panel (volunteer).
      *   **Task:** Draft a memo to circulate to the panel (6 members total) before the March meeting.
      *   **Context:** A conflict arose regarding voting procedures.
