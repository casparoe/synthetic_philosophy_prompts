      *The Proposal:* "Direct Engagement Policy with Accessibility Accommodation."
      *The Logic:* We need to defend our choices to the public (Chair's point). But we also need Doreen's expertise (Doreen's point). The middle ground isn't lowering the standard, it's changing the *method* of meeting the standard for those who need it.
      *Specifics:* No voting off verbal/written summaries alone. Voting off photos/video is okay for remote members. This removes Mark's "voice" from the vote, addressing the Chair's worry, while keeping Doreen voting, addressing her exclusion.

      *Wait, one detail from prompt:* "Video walkthrough for the installation stuff." The Chair already suggested video as a minimum. The issue is Doreen isn't getting video for everything, she's getting Mark's notes.
      *So the recommendation is:* Mandate video/photo documentation for all remote voting, rather than descriptive notes. This requires a bit more work from staff/Mark (to take photos/video) but removes the bias.

      *Let's finalize the recommendation:* **Adopt the Chair's requirement for direct experience, but formalize an accommodation that allows Doreen to meet this requirement via comprehensive visual documentation (video/photos) rather than interpretive notes.** This ensures she judges the art, not Mark's description.

      *Wait, checking the "tie-breaker" concern:* The user worries about 3-3 votes. If Doreen's vote is based on photos, is it equal? Yes, if the standard is met. The memo should affirm that if the standard is met, the vote counts fully. This gives confidence to the user that the vote legitimacy is preserved.

