answer: |-
  You have correctly identified that your colleague's invocation of Arrow's theorem is a shorthand that obscures more than it reveals. While your intuition is sound, the specific phenomena you are encountering have precise names and distinct theoretical boundaries.

  Here is a breakdown of the concepts, the terminology, and the distinction between mathematical certainties and empirical disputes.

  ### 1. The Names of the Phenomena

  **The Cycle: The Condorcet Paradox**
  The situation you described (A beats B, B beats C, C beats A) is the **Condorcet Paradox** (or Condorcet Cycle), named for the 18th-century mathematician Marquis de Condorcet.
  *   **Status:** Mathematically settled.
  *   **Explanation:** This occurs when individual preferences are transitive (if I prefer A to B and B to C, I prefer A to C), but the aggregated *majority* preference is intransitive. It demonstrates that "the will of the majority" is not always a coherent, single entity.

  **The Order Dependence: Path Dependence or Agenda Control**
  The fact that the winner changes based on the order of voting (A vs. B, then winner vs. C) is known in social choice theory as **Path Dependence** within **Sequential Majority Voting**. In political science, the power to determine that order is called **Agenda Control**.
  *   **Status:** Mathematically settled.
  *   **Explanation:** When a Condorcet cycle exists, there is no "Condorcet Winner" (an option that beats all others head-to-head). Consequently, any sequential procedure (often called an "amendment procedure" in parliamentary contexts) will produce a winner determined by the path taken. The chair, by setting the agenda, effectively chooses the winner.
  *   **Terminology Note:** You noted the media usage of "agenda-setting." In social choice, "agenda" refers specifically to the sequence of binary votes, not merely what topics are discussed. They are related concepts (gatekeeping vs. ordering), but in your context, the technical definition applies.

  **The Elimination Problem: Failure of the Condorcet Criterion**
  Your second observation—that an option eliminated early could have beaten the ultimate winner in a head-to-head matchup—describes a voting method failing the **Condorcet Criterion**.
  *   **Status:** Mathematically settled.
  *   **Explanation:** A voting system satisfies the Condorcet Criterion if, whenever a Condorcet Winner exists, that system elects them. Many common systems (Plurality, Instant Runoff Voting, Borda Count) fail this criterion. Even if there is no cycle, these systems can elect an option that a majority would reject in a direct comparison against the loser.

  ### 2. Is Your Colleague Right About Arrow?

  Your colleague is technically incorrect, though they are pointing in the right general direction.

  **The Boundary:**
  *   **Arrow's Impossibility Theorem** concerns **Social Welfare Functions**. It asks: "Can we create a rule that takes everyone's ranked ballots and produces a consistent, transitive *ranking* of all options for society?" Arrow proved that no such rule exists that satisfies a specific set of fairness criteria (including Independence of Irrelevant Alternatives).
  *   **Your Problem** concerns **Social Choice Functions**. You are not trying to rank A, B, and C for the university record; you are trying to select *one* winner.

  **Why the distinction matters:**
  Arrow's theorem implies that there is no perfect way to rank options. However, your immediate problem is that majority rule itself creates cycles (Condorcet), and specific selection rules fail to identify majority preferences (Condorcet Criterion failure).

  There is a theorem closer to your specific worry about selecting a single winner: the **Gibbard-Satterthwaite Theorem**. This theorem states that for any voting system with three or more options, if it is not dictatorial, there will be situations where voters can benefit by **misrepresenting their preferences** (strategic voting).

  **Verdict:** Your colleague invoked the most famous impossibility theorem, but the **Condorcet Paradox** explains the cycle, and **Agenda Control** explains the order dependence. Arrow's theorem is the "grandparent" of these results, but citing it here is like blaming gravity for a specific car accident—it's the underlying force, but not the immediate mechanism.

  ### 3. Sincere vs. Strategic Voting

  You asked where the literature on misrepresentation begins and your situation ends.

  *   **Your Situation (Sincere Voting):** You are assuming members vote their true preferences in every round. The paradoxes you found (Condorcet cycles, agenda dependence) persist *even if everyone is perfectly honest*. This is a structural flaw in aggregation, not a behavioral one.
  *   **The Other Literature (Strategic Voting):** This is the study of **Manipulability**. This occurs when a voter prefers Option A, but votes for Option B in an early round to prevent Option C from winning, because they know how the subsequent rounds will play out.

  **The Connection:**
  The existence of Condorcet cycles *invites* strategic voting. If members realize the agenda determines the outcome, they have an incentive to vote tactically rather than sincerely. The Gibbard-Satterthwaite theorem proves that no procedure can make strategic voting impossible (unless one person is a dictator). However, your current observation holds even without this behavior.

  ### 4. Settled Mathematics vs. Contested Reality

  You requested a clear separation between what is proven and what is debated. This is critical for your role as Chair.

  #### Mathematically Settled (You can rely on this)
  1.  **Cycles are possible:** It is a mathematical fact that majority preferences can be intransitive (Condorcet Paradox).
  2.  **Agenda matters:** In the presence of a cycle, the order of voting determines the outcome in sequential procedures. There is no mathematical way to avoid this without changing the voting rule.
  3.  **No perfect rule:** There is no voting system that satisfies all desirable fairness criteria simultaneously (Arrow/Gibbard-Satterthwaite). You cannot choose a procedure that is immune to cycles, agenda manipulation, *and* strategic voting all at once.
  4.  **Neutrality Axiom:** In social choice theory, a rule is "Neutral" if it treats all alternatives symmetrically (i.e., the names of the proposals don't matter, only the votes). Many rules satisfy this technical definition. However, satisfying technical Neutrality does not prevent the *outcome* from being sensitive to the agenda.

  #### Genuinely Contested / Empirical (You cannot rely on consensus here)
  1.  **Frequency of Cycles:** There is significant debate about how often Condorcet cycles occur in real-world committees.
      *   *View A:* With small groups (like your 9 members) and multidimensional issues (curriculum involves cost, quality, time), cycles are common.
      *   *View B:* In practice, preferences are often "single-peaked" (members agree on a spectrum), which mathematically prevents cycles. Some empirical political scientists argue cycles are rarer in stable institutions than theory suggests.
  2.  **The Impact of Agenda Power:**
      *   *View A:* The Chair's power to set the agenda is decisive and potentially dangerous to fairness.
      *   *View B:* In small, deliberative bodies like university committees, norms of consensus often override strict voting procedures. Members may negotiate a compromise before the vote, rendering the theoretical cycle moot.
  3.  **Strategic Behavior:**
      *   *View A:* Voters are sophisticated and will manipulate early rounds (e.g., voting to eliminate a strong rival early).
      *   *View B:* Most voters are "sincere" because calculating the strategic path is too cognitively demanding, or because social norms punish manipulation.
  4.  **Normative Selection:** There is no consensus among theorists on which voting rule is "best" for a committee like yours.
      *   Some argue for **Condorcet Methods** (e.g., Schulze method) because they find the majority winner if one exists.
      *   Others argue for **Borda Count** (ranking points) because it minimizes the intensity of dissatisfaction.
      *   Others argue for **Approval Voting** because it is simple and reduces strategic incentives.

  ### 5. Practical Implications for "Neutrality"

  You asked if any procedure can be "honestly described as neutral."

  **Technically:** Yes. You can adopt a rule that is "Neutral" in the axiomatic sense (it does not favor Proposal A over Proposal B by name).

  **Practically:** No. Because of the Condorcet Paradox and Agenda Control, **procedural neutrality does not guarantee outcome neutrality.** If a cycle exists, the procedure *must* break it somehow. Whether it breaks it by agenda order, by elimination, or by points, the mechanism you choose will advantage different coalitions of voters.

  **Recommendation for the Chair:**
  Since you cannot mathematically eliminate the problem, your best recourse is transparency.
  1.  **Acknowledge the Cycle:** If you detect a cycle, state it openly. "We have a situation where majority preferences are circular."
  2.  **Fix the Procedure in Advance:** Do not choose the voting method *after* seeing the preferences. Adopt a standard parliamentary procedure (e.g., Robert's Rules) or a specific voting method (e.g., Ranked Choice) *before* proposals are made. This moves the "agenda setting" from a tactical tool to a pre-agreed constraint.
  3.  **Deliberation over Voting:** In small committees, the mathematical impossibility results are often best managed by negotiation. If A, B, and C are cycling, the committee is usually best served by crafting a Proposal D that incorporates elements of the others, rather than forcing a binary choice that a majority will regret.

  ### Summary
  *   **Phenomenon 1:** Condorcet Paradox (The Cycle).
  *   **Phenomenon 2:** Agenda Control / Path Dependence (The Order).
  *   **Phenomenon 3:** Failure of Condorcet Criterion (The Elimination).
  *   **Colleague's Claim:** Imprecise. Arrow's Theorem is about ranking; your problem is about selection and cycles.
  *   **Settled:** The math proves no perfect system exists and agenda order matters in cycles.
  *   **Contested:** How often this actually disrupts real university committees and whether members will vote strategically.

  You are not imagining the problem, but it is a known structural feature of collective choice, not a unique failure of your committee. Your role is not to solve the math (which is unsolvable) but to manage the process with transparency.
