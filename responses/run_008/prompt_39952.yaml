  7.  **Self-Correction/Nuance Check:**
      *   *Did I be too hard on the film?* The user said "don't be gentle." Okay, I can be critical.
      *   *Is the illiteracy point accurate?* Yes, Schlink (the author) and the filmmakers explicitly use illiteracy as the metaphor for moral blindness. Arendt would reject that metaphor.
