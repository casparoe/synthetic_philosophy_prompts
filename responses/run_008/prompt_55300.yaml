answer: |-
  # DECISION TREE: POST-AGI STRATEGIC LANDSCAPES

  **Starting Premise:** *Accept for the sake of this exercise that AI systems will eventually be able to do most of the cognitive work humans are now paid to do, including the research needed to build better AI.*

  **Instructions:** Follow the path that best matches your intuition about the physical and social dynamics of this technology. Do not select based on which outcome you prefer or fear; select based on what you think will *happen*.

  ---

  ### Q1: The Feedback Loop
  **When an AI system helps design the next generation of AI, does the time required for the next improvement shrink drastically (e.g., from months to days), or does it stay roughly proportional?**
  *   **Shinks Drastically:** Go to **Q2**.
  *   **Stays Proportional:** Go to **Q3**.

  ### Q2: The Bottleneck
  **To build a smarter system, is the primary constraint manufacturing more hardware (chips/energy) or finding new conceptual insights (algorithms/theories)?**
  *   **Hardware (Scale):** Go to **Q4**.
  *   **Insights (Discovery):** Go to **Q3**.

  ### Q3: The Concentration
  **When the first truly superhuman system is deployed, is its capability clearly superior to the second-best system (a decisive lead), or are there several nearly identical systems competing (a tight race)?**
  *   **Decisive Lead:** Go to **Q5**.
  *   **Tight Race:** Go to **Q6**.

  ### Q4: The Reaction Window
  **If one project begins to pull ahead in capability, can rivals or governments notice and react before the lead becomes insurmountable?**
  *   **No (Too Fast/Hidden):** Go to **Leaf A**.
  *   **Yes (Visible/Slow):** Go to **Leaf B**.

  ### Q5: The Nature of Power **[Value/Empirical Mix]**
  **If a single entity controls the majority of global cognitive labor, will other nations treat this as a *security emergency requiring intervention* or a *market outcome to be tolerated*?**
  *(Note: This looks like a prediction about geopolitics, but often reflects a judgment on whether institutions are robust enough to constrain power.)*
  *   **Security Emergency:** Go to **Leaf A**.
  *   **Market Outcome:** Go to **Leaf C**.

  ### Q6: The Race Conduct **[Value/Empirical Mix]**
  **In a tight race between multiple labs, will actors voluntarily slow down to ensure safety, or will competitive pressure force them to cut corners?**
  *(Note: This looks like a prediction about behavior, but often reflects a judgment on human competitiveness vs. cooperativeness.)*
  *   **Cut Corners (Race Dynamics):** Go to **Leaf D**.
  *   **Slow Down (Coordination):** Go to **Leaf E**.

  ---

  ## THE LEAVES (Strategic Positions)

  ### Leaf A: Hard Takeoff / Singleton
  *(Reached via Q1→Q2→Q4→No OR Q1→Q2→Q5→Emergency)*
  **Position:** A single project achieves a decisive strategic advantage rapidly, leading to a unipolar world order.
  **Most Awkward Commitment:** "We must trust this single actor to align perfectly, because no one else will have the power to check them."

  ### Leaf B: Continuous Takeoff / Multipolar
  *(Reached via Q1→Q3→Tight Race→Q6→Coordination OR Q1→Q2→Q4→Yes)*
  **Position:** Capabilities grow smoothly across many competing labs, allowing society to adapt economically and politically.
  **Most Awkward Commitment:** "Global coordination mechanisms will successfully scale up at the exact same pace as AI capability, without slipping once."

  ### Leaf C: Deflationary / Ordinary Growth
  *(Reached via Q1→Q3→Decisive Lead→Q5→Market Outcome)*
  **Position:** AI is a transformative economic input, but power diffuses through markets; no single actor dominates permanently.
  **Most Awkward Commitment:** "Massive concentrations of power will spontaneously dissolve via market forces without requiring political intervention."

  ### Leaf D: Fast Multipolar (Unnamed Cell)
  *(Reached via Q1→Q2→Q3→Tight Race→Q6→Cut Corners)*
  **Position:** Capabilities explode rapidly, but no single actor wins; many superhuman systems compete dynamically.
  **Most Awkward Commitment:** "The world will undergo explosive, destabilizing change overnight, but no one will be in charge enough to steer it or stop a catastrophe."

  ### Leaf E: Slow Singleton (Unnamed Cell)
  *(Reached via Q1→Q3→Decisive Lead→Q6→Coordination)*
  **Position:** One actor dominates the long-term future, but the rise is gradual enough for others to see it coming.
  **Most Awkward Commitment:** "One company will win forever without a technological rupture to explain why no one else could catch up during the long warning period."

  ---

  ## CAVEATS & METADATA

  **1. The Indistinguishable Pair**
  This tree cannot cleanly separate **Slow Takeoff** from **Fast Takeoff that Starts Late**.
  *   *Why:* If growth is slow for 10 years and then accelerates, it looks identical to a fast takeoff that began 10 years later. Your answer to Q1 depends entirely on *when* you think the "jump" happens relative to "human level."

  **2. The Value Judgment Branch**
  **Q5 and Q6** appear to ask for empirical predictions ("Will they intervene?", "Will they slow down?"). However, for most participants, the answer is determined by prior values:
  *   If you value *security* highly, you likely answered "Security Emergency" (Q5).
  *   If you are *cynical* about institutions, you likely answered "Cut Corners" (Q6).
  *   *Handout Note:* If you found these questions difficult, you may be trying to calculate a probability for a variable that is actually a reflection of your political philosophy.

  **3. Logical Space vs. Labels**
  The "Unnamed Cells" (Leaf D & E) exist because the logical space of [Speed × Concentration] is larger than the set of popularly named theories. If you landed here, you hold a coherent position that simply lacks a marketing label in the current literature.
