answer: |-
  Dear Colleague,

  It is always gratifying when students synthesize the readings into an argument that strikes at the foundational tensions of the discipline, and your student has assembled a particularly sharp version of a critique that has circulated since Amartya Sen's early work on behaviorism and welfare. You are correct to suspect a sleight of hand, though I would suggest that the error is not so much a single logical fallacy as a conflation of two distinct theoretical commitments that often travel together under the banner of revealed preference. To put this to your class in its strongest form, you will want to isolate exactly where the argument overreaches, which requires us to distinguish between the positive description of choice and the normative assessment of welfare, as well as between the definition of preference and the conditions required for utility representation.

  The most vulnerable link in the chain is step four, though step three requires significant qualification to be technically accurate. Step four asserts that because revealed preference defines what an agent prefers, it thereby defines what is contrary to the agent's own good. This looks innocuous because in standard welfare economics we often operate under the assumption of consumer sovereignty, where preference satisfaction is taken as a proxy for welfare. However, this is a normative assumption external to the revealed-preference machinery itself. The revealed-preference approach is fundamentally operationalist and positive; it defines preference as a relation derived from choice data, but it remains silent on whether satisfying those preferences constitutes the agent's well-being. By conflating the operational definition of preference with the normative concept of the good, the argument commits a version of the naturalistic fallacy. If we reject step four, we can maintain that while the gambling choice reveals a preference for gambling over saving, this does not entail that gambling is good for the agent. This allows you to keep step six, acknowledging weakness of will as a literal truth about welfare, without necessarily declaring the revealed-preference approach false in its own positive domain. It simply limits the approach to describing behavior rather than evaluating it.

  However, there is a second, more technical issue lurking in step three that your students should confront. The argument assumes that every voluntary choice is utility-maximizing by definition. Strictly speaking, revealed preference theory only attributes a utility function to an agent if their choices satisfy certain coherence conditions, such as the Weak Axiom of Revealed Preference. If an agent exhibits weakness of will, they often display time-inconsistent choices, such as planning to save on Friday but gambling on Saturday. If these choices violate transitivity or consistency axioms, the revealed-preference theorist does not say the agent is maximizing utility; rather, she says the agent's choices cannot be represented by a stable utility function at all. The sleight of hand here is treating revealed preference as a universal theory of all choice, when it is actually a theory of consistent choice. The argument looks innocuous because textbooks often glide over the consistency requirements when introducing the intuition of utility maximization, leading students to believe the theory claims to explain every act rather than every rationalizable pattern of acts.

  Rejecting these steps does come at a cost to the revealed-preference theorist, and this is where the seminar discussion can become most productive. If you reject step four to save the theory from the charge of denying weakness of will, you must concede that revealed preference cannot ground welfare economics without additional normative premises. You can no longer claim that free choice automatically implies improved welfare, which undermines the standard justification for laissez-faire policies based solely on efficiency. The theorist must admit that an agent can voluntarily choose what is bad for them, meaning preference satisfaction is not synonymous with well-being. This forces a wedge between what economists call utility and what philosophers call the good, requiring a separate theory of welfare to judge cases like the gambling student.

  Furthermore, if you reject the universal claim in step three by insisting on coherence conditions, you limit the descriptive scope of the theory. The revealed-preference approach applies only to agents whose choices are sufficiently consistent to be modeled as maximizing a function. This means the theory cannot formally describe the gambling case without modification, such as introducing multiple selves or hyperbolic discounting parameters, which effectively reintroduce the psychological magnitudes the approach sought to avoid. The cost here is theoretical purity; to account for weakness of will within the model, one must often smuggle back in the very psychological states that revealed preference was designed to eliminate. The gambling case thus becomes a boundary condition where the theory either falls silent or must evolve into a psychological theory of choice.

  Ultimately, your student's argument succeeds in showing that revealed preference cannot be both a complete description of choice and a sufficient account of welfare, but it fails to prove the approach is false rather than incomplete. By guiding your class to see that step four conflates positive choice with normative good, and that step three ignores the necessity of consistency axioms, you can preserve the integrity of the formal theory while validating the reality of weakness of will. This allows you to keep step six as a phenomenological fact that the economic model must either accommodate through complexity or acknowledge as outside its domain. I hope this diagnosis helps you frame the discussion, as it strikes me as an excellent opportunity to show students how philosophical precision can clarify the limits of economic modeling.

  Warmly,

  Your Colleague
