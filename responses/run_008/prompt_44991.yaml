          *   Provide a short section on what would change if the theory were replaced by strict ordinalism.
          *   **Methodology:** Brainstorm candidate commitments first, be honest about confidence/uncertainty (hedge where necessary), avoid confident lists that might collapse, no citations/reading lists.
      *   **Tone:** Analytical, careful, hedged, conceptual.

  2.  **Deconstruct the QALY Mechanism:**
      *   Input: Health states (utility weights 0-1), Duration (years).
      *   Operation: Multiplication (Quality $\times$ Time) + Aggregation (Summation across individuals).
      *   Output: Cost per QALY ratio compared to a threshold.
      *   Core Principle: "A QALY is a QALY" (Equity weight = 1 for everyone).

  3.  **Brainstorming Candidate Commitments (Mental Draft):**
      *   *Cardinality:* You need to add them up. Ordinal isn't enough.
      *   *Interpersonal Comparability:* You need to compare a QALY for Person A vs. Person B.
      *   *Zero Point:* Is death 0? Is a health state worse than death negative? Need a fixed origin.
      *   *Linearity/Constant Returns:* Is 2 years at 0.5 quality equal to 1 year at 1.0 quality? (The standard QALY model assumes this).
      *   *Welfarism:* Health is the only thing that matters? Or is health a proxy for utility?
      *   *Summation/Aggregation:* Utilitarianism. Maximizing the sum.
      *   *Time Preference:* Do we discount future QALYs? (Usually yes, but philosophically tricky).
      *   *Risk Neutrality:* How do we handle uncertainty in outcomes?

  4.  **Filtering for "Strict Necessity" vs. "Convenience":**
      *   *Cardinality:* Strict necessity. You can't sum ordinals.
      *   *Interpersonal Comparability:* Strict necessity. Otherwise, you can't prioritize Person A over Person B based on QALY gain.
      *   *Zero Point:* Strict necessity. Otherwise, "gains" don't make sense.
      *   *Linearity (Q $\times$ T):* This is shaky. Is it *strictly* necessary? The math requires it, but the *philosophy* might allow a different function (e.g., HALYs). But for *QALYs* specifically, yes, it's definitional.
      *   *Utilitarian Aggregation:* Strict necessity for the *threshold* decision rule. If you cared about distribution, the threshold would vary.
      *   *Health as Utility:* This is a big one. Is QALY *utility* or *health capability*? NICE treats it as utility-ish, but measures health states.

  5.  **Addressing the Organ/ICU Inconsistency:**
      *   Why the difference?
      *   *Ex Ante vs. Ex Post:* QALYs are often population-level (ex ante risk reduction), organs are specific identified lives (ex post).
      *   *Rule Utilitarianism vs. Act Utilitarianism:* Maybe the *system* maximizes QALYs, but specific triage rules prevent panic/loss of trust.
      *   *Property Rights/Entitlement:* Once you are in the ICU, do you have a claim?
      *   *Measurement Feasibility:* Maybe we *can't* measure QALYs fast enough for ICU? (Weak argument).
      *   *The "Identifiable Victim" Effect:* Philosophical weakness, but practical reality.
      *   *Best Philosophical Save:* Distinction between *allocating resources to treatments* (insurance logic) vs. *allocating scarce physical units to identified patients* (triage logic). One is policy, one is clinical ethics.

  6.  **Addressing Underdetermination:**
      *   What other theories yield the same math?
      *   *Prioritarianism:* If everyone is below a threshold, maximizing sum looks like prioritarianism.
      *   *Sufficientarianism:* If the threshold represents "enough," maybe?
      *   *Capabilities Approach:* If health is the central capability, maybe the math looks similar but the justification differs (freedom to function vs. utility).

  7.  **Addressing Strict Ordinalism:**
