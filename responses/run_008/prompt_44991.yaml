      *   *Section 5: The Ordinalist Counterfactual:* What happens if we drop cardinality?

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to be careful about "Utility." QALYs are often framed as *health* benefits, not general *utility*. But to aggregate across people, they function as a proxy for utility. I need to highlight this slippage.
      *   *Correction on Linearity:* The assumption that 1 year at 0.5 = 0.5 years at 1.0 is the "Constant Proportional Trade-off" assumption. Is it strictly necessary for the *system*? Yes, otherwise the "QALY" unit isn't stable.
      *   *Confidence Check:* I am highly confident about Cardinality and Interpersonal Comparability. I am less confident about the "Zero Point" being metaphysical vs. conventional. I need to flag that.
      *   *The ICU distinction:* Don't just say "it's inconsistent." Explore the "Rule Consequentialist" defense. The system maximizes QALYs *generally*, but specific triage rules exist because *calculating* QALYs in real-time destroys trust or leads to error.

  10. **Final Review against Constraints:**
