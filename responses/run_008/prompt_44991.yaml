answer: |-
  This is a sharp observation. You have put your finger on the central tension in welfare economics: the gap between the *measurement technology* (QALYs) and the *moral philosophy* required to justify using that technology as a decision rule. As a philosopher of economics, I see this not just as a policy quirk, but as a case of "implicit metaphysics"—the system is running on philosophical assumptions that the engineers of the system often treat as engineering constraints.

  Per your request, I will start by brainstorming the candidate commitments, flagging my confidence in whether they are strict necessities or mere conveniences. Then I will lock in the reconstruction, address the underdetermination, tackle the organ/ICU inconsistency, and finish with the ordinalist counterfactual.

  ### Phase 1: Brainstorming Candidate Commitments

  Here are the philosophical moving parts required to make the QALY calculus work. I will rate my confidence on whether these are *strict presuppositions* (the math breaks without them) or *conveniences* (the math works, but could be tweaked).

  1.  **Cardinality of Utility:**
      *   *Idea:* We can measure the *magnitude* of difference between health states, not just rank them.
      *   *Confidence:* **High (Strict).** You cannot sum ordinal rankings. If Health State A is "better" than B, and B is "better" than C, you cannot say the gain from B to A equals the gain from C to B without cardinal intervals. The QALY arithmetic ($Quality \times Time$) collapses without this.

  2.  **Interpersonal Comparability:**
      *   *Idea:* A unit of health gain for Person X is equivalent to a unit of health gain for Person Y.
      *   *Confidence:* **High (Strict).** This is the "A QALY is a QALY" slogan. Without this, you cannot aggregate across a population. If my pain relief is "worth more" than yours intrinsically, the sum is meaningless.

  3.  **The Zero Point (Origin):**
      *   *Idea:* Death is 0, Perfect Health is 1. States worse than death are negative.
      *   *Confidence:* **Medium (Strict/Conventional).** Strictly, you need a fixed origin to calculate *gains*. However, whether "Death" is metaphysically zero or just a conventional anchor is debatable. If we anchored "Perfect Health" as 0 and "Death" as -1, the math works the same. So, a fixed *interval* is strict; the specific *labeling* of zero is conventional but functionally necessary for the "gain" calculation.

  4.  **Constant Proportional Trade-off (Linearity):**
      *   *Idea:* 10 years at 50% quality is equivalent to 5 years at 100% quality.
      *   *Confidence:* **High (Strict for QALYs).** This is the multiplication operation. If people value duration non-linearly (e.g., the first year of life is worth more than the tenth), the simple product $Q \times T$ is invalid. The system *presupposes* linearity to function, even if empirical evidence suggests humans don't actually value time linearly.

  5.  **Welfarism (Health as Utility):**
      *   *Idea:* Health states are a perfect proxy for wellbeing/utility.
      *   *Confidence:* **Low (Underdetermined).** The system *acts* as if health is utility. But one could argue health is a *capability* or a *resource*. The math remains the same, but the justification changes. I'll class this as underdetermined rather than a strict presupposition.

  6.  **Summation (Classical Utilitarianism):**
      *   *Idea:* We maximize the total sum, not the minimum or the median.
      *   *Confidence:* **High (Strict for the Threshold).** The cost-per-QALY threshold implies we are willing to sacrifice a large gain for one person to secure small gains for many. That is pure aggregation. If we cared about the worst-off, the threshold would vary by baseline health.

  7.  **Time Discounting:**
      *   *Idea:* Future QALYs are worth less than present QALYs.
      *   *Confidence:* **Low (Convenience).** NICE applies discounting (usually 3.5%), but this is a policy choice to align with capital costs, not a philosophical necessity of the QALY concept itself. You could have a non-discounted QALY system.

  ---

  ### Phase 2: The Reconstruction of Implicit Theory

  Based on the filtering above, here is the implicit philosophical theory required to make the NICE-style QALY machinery coherent.

  **1. Strong Cardinality and Unit Comparability**
  The system strictly presupposes that wellbeing (operationalized as health-related quality of life) is a cardinal quantity with a common unit of measurement across persons.
  *   **Why Strict?** If utility were merely ordinal, we could rank treatments for a single patient, but we could not compare the *size* of the benefit between a hip replacement for an 80-year-old and a gene therapy for a child. The threshold (£/QALY) is a price per *unit*. If the unit varies in magnitude between people, the price comparison is category error.
  *   **The Philosophical Cost:** This rejects the standard neocortical economic view that utility is ordinal and revealed preference is the only metric. QALYs require us to measure *experienced* value, not just *chosen* value.

  **2. The "Fixed Origin" Assumption**
  The system presupposes a natural zero point (Death) and a natural ceiling (Perfect Health).
  *   **Why Strict?** To calculate a "gain," you must measure the distance from a baseline. If the baseline is unstable or subjective (e.g., "my normal health"), you cannot compare gains across conditions. The system treats "Death" as a universal constant of zero value.
  *   **The Philosophical Cost:** This ignores adaptation. A person with a disability might rate their "Perfect Health" differently than an able-bodied person. The system imposes an external metric of quality upon the patient's internal experience to ensure the units match.

  **3. Aggregative Consequentialism (Utilitarianism)**
  The decision rule (fund if below threshold) presupposes that the moral goal is to maximize the total sum of health benefits across the population, regardless of distribution.
  *   **Why Strict?** If the system cared about equity (e.g., prioritizing the worst-off), the threshold would not be constant. It would be lower for the wealthy/healthy and higher for the poor/sick. The fact that the threshold is roughly flat (£20k-£30k) implies a unit weight for every person.
  *   **The Philosophical Cost:** This licenses sacrificing the interests of a minority (e.g., rare disease patients with high costs) for the aggregate gain of the majority. It treats persons as "containers" of value rather than rights-bearers.

  **4. Risk Neutrality**
  The system treats expected QALYs as equivalent to certain QALYs.
  *   **Why Strict?** When evaluating drugs with uncertain outcomes, the system multiplies probability by QALY gain. This assumes the decision-maker (society) is risk-neutral regarding health outcomes.
  *   **The Philosophical Cost:** Most humans are risk-averse regarding health (we prefer a guaranteed modest gain over a gamble for a cure). The system overrides individual risk preferences with a societal risk-neutral stance.

  ---

  ### Phase 3: Philosophical Underdetermination

  You asked where the practice is underdetermined—i.e., where rival theories license the same arithmetic. This is crucial because it means the economists might be using the right math for the *wrong* reasons.

  **1. Prioritarianism vs. Utilitarianism**
  *   *The Rival:* Prioritarianism says we should weight benefits to the worse-off more heavily.
  *   *The Overlap:* If the population being treated is uniformly "badly off" (e.g., everyone seeking NHS treatment is sick, unlike the general public), a Prioritarian calculus might look mathematically identical to a Utilitarian one within that specific subset. The QALY math doesn't distinguish between "maximize total" and "maximize total where everyone is already below a threshold."
  *   *Implication:* NICE could claim they are helping the worst-off, but their math doesn't actually check who is worst-off, only who gains the most.

  **2. The Capabilities Approach (Health as Functioning)**
  *   *The Rival:* Amartya Sen's view that we should measure freedom to function, not utility.
  *   *The Overlap:* If "Quality" is interpreted as "Level of Functioning" rather than "Happiness/Satisfaction," the $Q \times T$ math remains identical.
  *   *Implication:* This is a major underdetermination. NICE measures "utility" via surveys (EQ-5D), but justifies it as "health." If they switched to a Capabilities justification, the math wouldn't change, but the *measurement* of Q (Quality) should theoretically change to reflect what people can *do*, not how they *feel*. The fact that they don't adjust the measurement suggests they are implicitly Welfarists, even if they claim otherwise.

  **3. Sufficientarianism**
  *   *The Rival:* The goal is to get everyone above a "sufficient" level of health, not to maximize beyond that.
  *   *The Overlap:* If the cost-effectiveness threshold (£30k/QALY) happens to align with the cost of bringing people up to sufficiency, the decisions look the same.
  *   *Implication:* This is weak. Usually, maximizing QALYs pushes resources toward marginal gains for the healthy (cheaper) rather than massive investments to bring the severely disabled to sufficiency (expensive). So the practice likely *violates* Sufficientarianism, but the rhetoric often sounds like it.

  ---

  ### Phase 4: The Organ/ICU Inconsistency

  This is the strongest point of tension. Why maximize QALYs for drugs, but refuse to maximize QALYs for hearts?

  **The Inconsistency Charge:**
  If a QALY is a QALY, we should give the liver to the 20-year-old (50 QALYs gain) rather than the 60-year-old (10 QALYs gain), regardless of waiting time. The fact that we use waiting lists or "sickest first" (urgency) in triage contradicts the "maximize total QALYs" rule used in drug funding.

  **Possible Philosophical Saves (Distinctions):**

  1.  **Ex Ante vs. Ex Post (The Insurance View):**
      *   *Argument:* Drug funding is an *insurance* decision made behind a "veil of ignorance." You don't know if you'll be the old person or the young person. Rational agents would agree to a rule that maximizes total health to lower premiums for everyone.
      *   *Triage:* Organ allocation is *ex post*. The patients are identified. The "veil" is lifted. At this stage, abstract aggregation feels like a betrayal of the specific individual in front of the doctor.
      *   *Verdict:* This is a "Rule Utilitarian" save. We maximize QALYs at the *policy* level (NICE) but forbid it at the *clinical* level to maintain trust. It's consistent if you view the clinic as a constraint on the policy.

  2.  **Entitlement vs. Benefit:**
      *   *Argument:* Once you are on the transplant list, you have entered a contract with the state. You have a "claim" based on entry time (first-come) or medical need (urgency).
      *   *Triage:* Maximizing QALYs treats the organ as a resource to be invested. Triage treats the organ as a debt owed to the patient.
      *   *Verdict:* This suggests the QALY system is actually **consequentialist**, while the ICU system is **deontological** (rights-based). This is a genuine inconsistency in the government's moral framework. They switch philosophies depending on the budget cycle.

  3.  **Measurement Feasibility (The Pragmatic Save):**
      *   *Argument:* We *could* do QALYs for ICU, but we can't calculate them fast enough.
      *   *Verdict:* Weak. We could have pre-calculated protocols. The refusal is normative, not technical.

  **My Assessment:**
  The practice rests on **inconsistent commitments**. The drug funding system is Act/Rule Utilitarian (maximize the good). The triage system is Egalitarian/Rights-based (fairness among identified lives). The government tolerates this because the populations don't overlap much (budget holders vs. bedside clinicians), but philosophically, it is a fracture. If they were consistent, ICU beds would be allocated to those with the best prognosis/survival probability (which they partly are), but waiting lists would not exist if a higher-QALY patient arrived.

  ---

  ### Phase 5: The Ordinalist Counterfactual

  Finally, you asked what would happen to day-to-day practice if we replaced the implicit cardinal theory with a **strictly ordinalist view of utility**.

  In strict ordinalism, we can say Patient A prefers Treatment X to Y, but we cannot say X gives "twice as much benefit" as Y. We cannot sum benefits across people.

  **Changes to Practice:**

  1.  **Death of the Threshold:**
      The £30,000/QALY threshold would vanish. You cannot have a price per unit if the unit is not cardinal. You could not compare a cancer drug to a hip replacement.

  2.  **Categorical Prioritization (Lexicographic Rules):**
      Instead of trading off cost vs. benefit continuously, decisions would become binary or hierarchical.
      *   *Rule 1:* Save life vs. Improve quality. (Life always wins).
      *   *Rule 2:* Treat children vs. Adults. (One group always wins).
      *   *Rule 3:* Cost only matters if benefits are *equal*.
      This looks more like military triage or religious ethics than economics.

  3.  **Voting or Deliberative Mechanisms:**
      Without a common metric to aggregate, allocation decisions would have to be made by committee vote or public deliberation for each drug class. "Is this drug *more important* than that one?" rather than "Does this drug yield more QALYs per pound?"

  4.  **Budget Silos:**
      You could not have a single health budget. You would have a "Cancer Budget," a "Cardiology Budget," etc., because you cannot compare the utility gains across disease categories. Inefficiency would skyrocket because you couldn't shift money from low-priority areas to high-priority areas across categories.

  **Summary:**
  Moving to ordinalism would destroy the efficiency of the system but might align it better with how people actually make moral decisions (categorical rather than calculative). The QALY system is a "fiction" of cardinality imposed on an ordinal reality to allow for budgetary fluidity. The refusal to use it in ICUs suggests that when the fiction becomes too morally costly (identifiable victims), the system reverts to ordinal/rights-based intuition.
