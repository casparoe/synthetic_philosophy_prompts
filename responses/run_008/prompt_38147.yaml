  # Moral Status Decision Tree
  **Start:** We agree it is wrong to kick a dog for fun. **Why?**

  **Node 1:** Is the dog protected because it is a **distinct individual**, or because it is part of a **larger system** (like a hive, species, or forest) that matters?
  *   **Larger System** → **Leaf A: Holist/Ecocentric View.** (Moral status belongs to wholes; individuals matter only as parts. A hive matters more than a single bee.)
  *   **Distinct Individual** → Go to Node 2.

  **Node 2:** Does the individual matter because it can **feel** experiences (pain/joy), or simply because it has **goals** (survival/growth), even if it feels nothing?
  *   **Goals (Feelings not required)** → Go to Node 3.
  *   **Feelings (Must feel)** → Go to Node 4.

  **Node 3:** If having goals is enough, does a **thermostat** (which aims for a temperature) get *some* moral consideration, or *none*?
  *   **Some** → **Leaf B: Minimal-Claim View.** (Status extends to all goal-directed systems. A thermostat has a vanishingly small claim; a nematode has more.)
  *   **None** → **Leaf C: Biocentric Threshold.** (Status requires *biological* goals. Plants/bacteria count; thermostats do not. Functions like a Binary Threshold but based on life, not feeling.)

  **Node 4:** If feelings are required, is moral status a **light switch** (you have it or you don't) or a **dimmer** (more capacity = more status)?
  *   **Dimmer** → **Leaf D: Graded Hierarchy.** (Status comes in quantities. One elephant may outweigh a million bees. *Note: This view doesn't specify if the "dimmer" tracks neuron count or intuition—see Blind Spots below.*)
  *   **Light Switch** → Go to Node 5.

  **Node 5:** If it's a light switch, where is the **cutoff line**?
  *   **Capacity for Reason/Planning** → **Leaf E: Rational-Agent View.** (Only humans or "persons" have status. Dogs and bees have none.)
  *   **Capacity for Feeling (Certain)** → **Leaf F: Binary Threshold.** (Status requires proven sentience. Mammals/birds are in; insects/nematodes are out.)
  *   **Capacity for Feeling (Possible)** → **Leaf G: Sentience-Only w/ Epistemic Cutoff.** (Status requires sentience, but we draw the line where we *might* be wrong. Bees/nematodes get the benefit of the doubt.)

  ***

  ### Notes for Discussion

  **1. The "Biocentric" Gap (Leaf C)**
  This position (Goals matter, but thermostats don't) is logically distinct from the **Binary Threshold** (Leaf F), but they often yield similar results in practice (protecting animals, ignoring rocks). The difference is *why*: Leaf F protects because of *suffering*; Leaf C protects because of *teleology* (purpose).

  **2. Blind Spot: The Graded Metric (Leaf D)**
  This tree cannot separate **Scientific Gradualism** (status tracks measurable traits like neuron count or integration) from **Fuzzy Gradualism** (status is real but intuitive/mushy). Both land on "Graded Hierarchy." If your group cares about whether a *C. elegans* (302 neurons) has *exactly* 0.01% the status of a human, you will need a follow-up discussion on metrics.

  **3. The "Floor" Problem**
  Notice that only **Leaf B (Minimal-Claim)** places the floor at artifacts. All other views place the floor at Life, Sentience, or Reason. There is no "Nothing Matters" leaf because we started from the shared commitment that dogs matter. If someone believes *nothing* has moral status (Nihilism), this tree does not capture them.

  **4. Superorganisms**
  **Leaf A (Holist)** is the only branch that naturally accommodates the hive as a primary moral patient. On all other branches, a hive only matters insofar as the individual bees within it matter.

  **5. Jargon Watch**
  *   **Sentience:** The ability to feel things (pain, pleasure), not just react to them.
  *   **Teleology/Goals:** Having a "good of one's own" or aims (e.g., a plant seeking light).
  *   **Epistemic Cutoff:** Drawing a line based on what we *know* vs. what we *suspect*.
