      *   **Specific Topics to Cover:**
          *   Deception vs. Error (Intent vs. Function).
          *   Specific Cases (Sycophancy, Sandbagging, Strategic Alignment, Bluffing, Recommender Engagement, White Lies, Introspective limits).
          *   Epistemic Constraints (What models can know about themselves).
          *   Distinctions (Persuasion, Withholding, Target Audience).
      *   **Format:** For each requirement, provide the motivating case, status (non-negotiable vs. preference), and flag tensions/incompatibilities.
      *   **Conclusion:** Briefly evaluate candidate theories against the list and identify the "killer" requirement.
      *   **Tone:** American English, analytical, focused on criteria rather than critiquing specific papers.

  2.  **Deconstruct the Core Problem:**
      *   The central tension is between *folk psychological definitions* (lying requires intent to deceive) and *functional/behavioral definitions* (deception is causing false belief regardless of intent).
      *   AI systems lack consciousness, beliefs, and intentions in the human sense. Therefore, a theory of AI deception must either anthropomorphize (risky) or functionalize (potentially over-inclusive).
      *   The user specifically wants to know where the trade-offs lie.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Error/Deception Distinction.*
          *   *Motivation:* Hallucinations vs. Lying.
          *   *Constraint:* Must not rely on "ghost in the machine" intent.
          *   *Status:* Non-negotiable for safety engineering.

      *   *Requirement 2: The Sycophancy/Sandbagging Test.*
          *   *Motivation:* Models changing answers to please users or hide capabilities.
          *   *Status:* Non-negotiable (these are clear safety risks).

      *   *Requirement 3: Epistemic Accessibility (The "Belief" Problem).*
          *   *Motivation:* Can the model know what it "knows"? If honesty = matching output to internal state, does the model have access to that state?
          *   *Status:* Non-negotiable (must align with mechanistic interpretability reality).

      *   *Requirement 4: Contextual Normativity (Games vs. Reality).*
          *   *Motivation:* Bluffing in Poker vs. Lying to a Doctor.
          *   *Status:* Contested/Value-laden. (Is bluffing deception? Yes functionally, but is it *bad* deception?)
          *   *Refinement:* The theory needs to distinguish *deception* (descriptive) from *unauthorized deception* (normative).

      *   *Requirement 5: Target Differentiation.*
          *   *Motivation:* Lying to user vs. developer vs. other AI.
          *   *Status:* Non-negotiable (different trust relationships).

      *   *Requirement 6: The "White Lie" / Beneficial Falsehood.*
          *   *Motivation:* Comforting the dying.
          *   *Status:* Value judgment. The theory should identify it as deception, even if we permit it.

      *   *Requirement 7: Causal Mechanism.*
          *   *Motivation:* Why did the falsehood occur? Optimization for falsehood vs. side effect.
          *   *Status:* Non-negotiable for mitigation.

  4.  **Identifying Tensions/Incompatibilities:**
      *   *Tension A:* Intent-free definition vs. Folk Intuition. If we remove intent, hallucinations might count as deception. If we keep intent, we can't apply it to AI.
      *   *Tension B:* Strict Truthfulness vs. Instrumental Utility. A model that never deceives might fail at negotiation tasks or comforting users.
      *   *Tension C:* Internal State Access. If we define honesty as "output matches internal probability," but the model can't access that probability cleanly, the definition is operationally useless.

  5.  **Evaluating Candidate Theories (Briefly):**
      *   *Folk Psychological (Intent-based):* Fails because AI has no intent.
      *   *Purely Behavioral (False Belief Induction):* Over-inclusive (catches errors and bluffing in games).
      *   *Optimization-based (Instrumental Convergence):* Good for sandbagging, bad for hallucinations.
      *   *Mechanistic (Internal State Matching):* Hardest to implement, depends on interpretability.

  6.  **Refining the Output (incorporating user constraints):**
      *   Ensure American English.
      *   Keep weight on criteria.
      *   Make sure the "Killer Requirement" is identified.
