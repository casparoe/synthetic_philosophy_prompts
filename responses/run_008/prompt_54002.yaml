      *   *Correction:* Make sure to explicitly flag which desiderata are incompatible. The prompt specifically asks for this.
      *   *Correction:* Ensure the distinction between *descriptive* (is this deception?) and *normative* (is this allowed?) is clear. The user suspects the "no bluffing" crowd is importing values. I need to validate that suspicion in the spec.

  8.  **Final Structure:**
      *   Introduction (Setting the stage).
      *   The Desiderata List (numbered, with Case, Rationale, Status).
