answer: |-
  ### The Spec: Desiderata for a Modal Profile of Persons

  **1. The Gamete Case**
  *   **The Case:** Could *you* have originated from a different sperm and egg than the ones you actually came from?
  *   **Why it's a Requirement:** This is the central query driving the debate. A theory of personal origins that refuses to answer this is incomplete.
  *   **Load-bearing?** Yes. This is the target phenomenon. However, the *demand* for a "No" answer is aesthetic (essentialist preference); the requirement is simply that the theory must assign a truth value without contradiction.

  **2. The Spectrum of Nearby Variations**
  *   **The Case:** Same gametes, different womb? Same parents, "runner-up" sperm? Frozen embryo implanted five years later?
  *   **Why it's a Requirement:** Ordinary modal intuition is gradient, not binary. We feel it is *more* plausible that you could have been born in a different hospital than that you could have had different parents. A theory must explain this fading of identity across close possible worlds or justify why the intuition is mistaken.
  *   **Load-bearing?** Yes. If a theory treats "different womb" and "different sperm" as equally impossible (or equally possible) without distinction, it fails to map the actual structure of how we reason about counterfactual lives.

  **3. Everyday Counterfactuals**
  *   **The Case:** "I could have been conceived a month later." "My parents could have had one more child."
  *   **Why it's a Requirement:** The stated purpose is to answer *ordinary* questions. In ordinary language, these claims are trivially true. A theory that renders them false imposes a technical cost on everyday discourse that must be justified by massive gain elsewhere.
  *   **Load-bearing?** **Critical.** If the theory fails here, it ceases to be a tool for understanding ordinary modal claims and becomes a revisionary metaphysics that tells people they are wrong about their own lives.

  **4. Twinning**
  *   **The Case:** The zygote that became you could have split (monozygotic twins). Did *you* become two people? Or did "you" not exist yet?
  *   **Why it's a Requirement:** Twinning is a biological fact involving human organisms. Any account tying persons to biological origins must handle the branching of that biology.
  *   **Load-bearing?** Yes. Identity is logically one-to-one. If the theory implies you could have been two distinct people simultaneously, it violates the logic of identity itself.

  **5. Fission and Transplant (Parfit Cases)**
  *   **The Case:** Brain transplants, teletransportation, or hemispherectomy.
  *   **Why it's a Requirement:** Even an origin-focused theory has implications for survival. If origin is essential, does destroying the original body kill you even if your psychology continues?
  *   **Load-bearing?** Yes. Persons care about survival. A theory of personal identity that cannot tell you whether you survive a brain transplant is practically useless, regardless of its elegance on origins.

  **6. Biological Reality**
  *   **The Case:** Gametes are not atomic; they undergo metabolic turnover. Conception is a process (penetration, membrane fusion, syngamy), not an instant.
  *   **Why it's a Requirement:** Metaphysics must supervene on physics. If "this sperm" has no precise identity conditions due to biological vagueness, a necessity claim attached to "this sperm" is unintelligible.
  *   **Load-bearing?** **Critical.** If the theory requires precise boundaries where biology provides none, it cannot be applied to actual human beings, only to abstract proxies.

  ***

  ### The Incompatibility Matrix

  You are right to suspect tension. The following pairs cannot be jointly satisfied without significant theoretical cost:

  *   **(1) Gamete Essentialism vs. (3) Everyday Counterfactuals:** This is the hard conflict. Biologically, being conceived a month later entails different gametes (new egg, new sperm). If (1) is "No, you must come from *these* gametes," then (3) is false. To save (3), the essentialist must argue that "conceived a month later" is shorthand for "similar gametes," which undermines the strictness of (1).
  *   **(1) Gamete Essentialism vs. (6) Biological Reality:** Essentialism requires a rigid designator for the origin. Biology offers vague, process-based identity. To satisfy (1), you must posit a metaphysical precision that contradicts (6), forcing you to claim there is a fact of the matter about "which sperm" even when biology says there isn't.
  *   **(4) Twinning vs. (1) Strict Zygote Identity:** If you are essentially *this* zygote, and the zygote splits into A and B, are you A? B? Both? If both, identity is not one-to-one. If neither, then the zygote wasn't you (undermining origin views). If one, what determines which? (1) offers no resources to answer this.

  ***

  ### Evaluation of Existing Views

  **Origin Essentialism** satisfies (1) and handles (2) by drawing sharp lines, but it fails (3) flat out: it makes ordinary claims like "I could have been born later" strictly false, violating the purpose constraint. It also struggles with (6), requiring metaphysical precision where biology is vague, and hits a wall on (4), unable to explain twinning without violating the transitivity of identity. **Counterpart Theory** sidesteps the contradictions by treating identity as context-dependent; it saves (3) and (2) beautifully by allowing "you" to have different counterparts in different contexts, but it effectively dissolves (1) rather than answering it (there is no strict fact about whether *you* could have had different gametes, only whether a counterpart could), which may feel like evasion to someone seeking a robust truth. **Psychological Continuity** aces (3) and (5), aligning with ordinary survival intuitions, but crashes hard on (1) and (4); since a zygote has no psychology, the theory implies you did not exist at conception, making "origin" contingent on later development, which contradicts the biological intuition that you were once an embryo. None satisfy the full spec; Essentialism sacrifices ordinary usage for metaphysical rigidity, Psychological views sacrifice biological origins for survival intuitions, and Counterpart theory sacrifices the question itself for consistency.
