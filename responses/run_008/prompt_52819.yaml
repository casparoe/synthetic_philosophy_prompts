  All three reject pure negative liberty (ruled out by Cases 1-3 where no interference occurred) and positive liberty (ruled out by Case 4). They converge on Mira being unfree and Devin free, but diverge on *why*. Non-domination cites arbitrariness; Status cites hierarchy; Discursive cites recourse. The core divergence lies in whether the *source* of constraint (arbitrary will vs. structural cost) defines unfreedom, though here they align. To distinguish them, we must test where arbitrariness and status come apart. For Mira, Non-Domination highlights the unchecked deactivation power. Status highlights her dependency on the app. Discursive highlights the lack of appeal. For Devin, Non-Domination highlights the enumerated violations. Status highlights his licensed standing. Discursive highlights the hearing process. All predict Mira unfree, Devin free. Thus, all candidates align on the verdicts but offer distinct diagnostic explanations for the underlying pathology of unfreedom.

  Predictions
  **Mira:** Unfree. The platform holds arbitrary power over her livelihood (deactivation without cause/appeal). This mirrors the indulgent master (Case 1): the power exists even if unused. Her anticipatory conformity (stopping contestation) confirms domination.
  **Devin:** Free. The board's power is non-arbitrary. Revocation requires enumerated violations and hearings. The actual revocation was procedural, not whimsical. Like the taxed citizen (Case 6), he lives under rules he can contest.
  **Reasoning:** The professor's glosses dictate this. "What he could do" condemns Mira (platform *could* deactivate arbitrarily). "Law is yours to contest" saves Devin (he has judicial review). The key is not the outcome (pay/revocation) but the structure of power. Mira lives at the mercy of an algorithm; Devin lives under the rule of law. Mira's exit costs are secondary to arbitrary power. Devin's interference is secondary to non-arbitrary process. The distinction rests on arbitrariness.

  Best fit
  **Best Fit:** Republican Non-Domination.
  **Why:** It uniquely explains the asymmetry between the benevolent dictator (unfree) and the democratic citizen (free). Both interfere (or could), but only the latter tracks interests via contestability. It handles the poor man (no dominator) vs. the slave (dominator). The professor's glosses ("what he could do", "yours to contest") are practically direct quotes from Pettit's framework. It captures the structural nature of freedom without collapsing into resource-based positive liberty. It fits the mob vs. state distinction perfectly (arbitrary vs. non-arbitrary interference).

  The case that would settle it
  **The Case:** A wealthy freelancer subject to random, unappealable tax audits (arbitrary power, low cost) vs. a welfare recipient subject to strict, appealable means-testing (non-arbitrary power, high dependency).
  **Non-Domination:** Freelancer unfree (arbitrary power); Recipient free (non-arbitrary rules).
  **Resource/Status View:** Recipient unfree (dependency/poverty); Freelancer free (wealth/independence).
  **Purpose:** This separates arbitrariness from material dependency. If the professor calls the recipient unfree, she leans toward resource views. If she calls the freelancer unfree, Non-Domination holds. It tests whether *power* or *poverty* is the true constraint.
