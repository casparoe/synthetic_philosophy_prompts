  I'm a junior in high school taking a philosophy elective, and we've spent the last two weeks on the knowledge argument — the story of the color scientist who knows every physical fact about color vision but has never seen color. I feel like I have a handle on the basic setup and on the three standard replies we covered: the ability hypothesis (she gains know-how rather than new facts), the phenomenal concept strategy (she gains a new way of thinking about an old fact), and the old-fact-under-a-new-guise reply. What I'd like is a thought experiment constructed to a specification, because in class I couldn't come up with anything that didn't just repeat what's in our textbook.

