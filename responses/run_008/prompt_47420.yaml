prompt: |-
  I'm a PhD student in ML interp and I've somehow volunteered to run the session for our AI safety reading group this week — about 14 people, mostly grad students plus a couple of sharp undergrads, 75 minutes. Topic is mechanistic anomaly detection. Quick sketch so we're on the same page about what I mean by that: the pitch of MAD is that instead of trying to enumerate all the bad behaviors up front, you verify your model computes its output via some set of mechanisms you actually understand and trust, and then in deployment you flag inputs where the model seems to be doing something else — implementing a mechanism that isn't one of the ones you signed off on. The thing I want the session to actually land on is the question hiding under that pitch: what counts as "the same mechanism"? Two nets trained from different seeds on the same data share zero weights but plausibly implement the same mechanism. A net and a hand-written program computing the same function — same mechanism? "Induction heads do in-context learning" and "these specific attention heads with these specific weight matrices" are different grains of description, and identity verdicts seem to flip depending on which one you pick. This is the part people nod at and then keep talking as if it were settled, and I want them to feel it.

  So I'm asking you to design an activity where they run into this themselves rather than getting a lecture from me about abstraction levels. My half-formed idea: hand out pairs of toy computations (string-processing procedures, little circuits, whatever) and have everyone privately judge same-mechanism vs different-mechanism, then surface the disagreement patterns, then hit them with some kind of re-description twist — the same pair comes back described at a coarser or finer grain, and people's own votes flip. But you're the game designer, I'm just the domain person, so restructure freely if you have something better. What I need concretely: rules, materials I can actually prep in one evening (index cards/printouts, no coding required, though a little spreadsheet stuff is fine), a minute-by-minute timeline for 75 minutes, and a debrief that maps moments in the activity onto the real problem — what grain-sensitivity does to MAD as a safety story, whether "the model is doing something else" is even well-defined before you've fixed a description level, and what a deployed detector could possibly be comparing its live model against (the verified checkpoint? a description? both at once?).

  Also, two things I want you to be honest about. First, what the activity can't reproduce — what toy string procedures have that trained nets don't (clean modularity, maybe) and what they lack (the mess of distributed, redundant, learned structure), and what I'll have to supply verbally in the debrief since the game itself can't show it. Second, what will predictably go wrong the first time I run this. My own guess is at least one person digs in and insists mechanism identity is perfectly determinate if you just "look at the code properly" — tell me how to handle that without steamrolling them, since honestly they might be half right and I don't want the activity to smuggle in my conclusion.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **User:** PhD student in ML Interpretability (ML Interp).
      *   **Task:** Run an AI Safety Reading Group session (75 mins, ~14 participants, mix of grad/undergrad).
      *   **Topic:** Mechanistic Anomaly Detection (MAD).
      *   **Core Problem:** The definition of "same mechanism" is ill-defined/abstraction-dependent. MAD relies on detecting "mechanism changes," but if mechanism identity is grain-sensitive, MAD is unstable.
      *   **Goal:** Design an *activity* where participants *experience* the ambiguity of mechanism identity, rather than being lectured about it.
      *   **Constraints:** Prep time ~1 evening (index cards, printouts, no complex coding).
      *   **Deliverables:** Rules, Materials, Timeline (75 mins), Debrief (mapping activity to MAD), Honest Assessment (limitations of the activity, predictable failure modes).
      *   **Specific Concern:** Handling the participant who insists mechanism identity is determinate ("just look at the code").

  2.  **Deconstruct the Core Problem (Mechanism Identity):**
      *   Why is it hard?
          *   *Implementation Variance:* Different weights, same function (e.g., permutation of hidden units).
          *   *Abstraction Levels:* High-level algorithm (e.g., "sorting") vs. low-level ops (e.g., "compare and swap").
          *   *Approximation:* Is a heuristic approximation the "same mechanism" as the exact algorithm?
          *   *Context:* Does the mechanism change if the input distribution changes but the weights stay the same?
      *   MAD Context: We verify a mechanism on a training dist. We deploy. Input comes in. Is the model using the *verified* mechanism or a *new* one? If "mechanism" isn't rigid, the alarm might be a false positive (same mechanism, different description) or false negative (different mechanism, same input-output behavior).

  3.  **Brainstorming Activity Concepts:**
      *   *Idea 1: Code Comparison.* Give snippets of Python. Ask if they do the same thing. *Critique:* Too easy to trace. People will just run them mentally.
      *   *Idea 2: Black Box Input/Output.* Give I/O pairs. Ask if the internal logic is the same. *Critique:* Too ambiguous. People will say "can't know."
      *   *Idea 3: The "Re-description" Game (User's idea).* Present a process. Ask if A and B are the same. Then reveal a new description of A or B. *Critique:* Strong potential. Needs to be concrete enough to argue about but abstract enough to allow interpretation.
      *   *Idea 4: Circuit/Graph Matching.* Give two computational graphs. One is permuted. One has extra noop nodes. One fuses operations. *Critique:* Good visual, fits "mechanistic."

      *   *Selected Approach:* A hybrid of Idea 3 and 4. Use "Algorithm Cards" that describe processes at different levels of abstraction and with different implementations. The key is *shifting the frame* mid-activity to induce vote flipping.

  4.  **Developing the Activity: "The Mechanism Matchmaker"**
      *   **Setup:** Pairs of "Systems" (System A and System B).
      *   **Round 1:** High-level functional description. (e.g., "Sorts a list").
      *   **Round 2:** Low-level implementation details. (e.g., "Bubble Sort" vs. "Quick Sort" vs. "Random Shuffle until Sorted").
      *   **Round 3:** Weight/Parameter view. (e.g., "Same architecture, permuted weights" vs. "Different architecture").
      *   **Twist:** The *goal* of the system changes (e.g., efficiency vs. robustness), altering whether we care about the *how* or the *what*.

      *   *Refinement for MAD context:* MAD cares about *causal structure*, not just I/O. So the activity needs to focus on *how* the output is derived.
      *   *Better Concept:* **"The Alien Transmitter."**
          *   Participants act as interpreters trying to verify if a signal comes from a trusted source (the "Verified Mechanism") or an impostor.
          *   They get "specs" of the trusted source at different levels of detail.
          *   They get "observations" of the live signal.
          *   They must vote: Safe (Same Mechanism) or Alert (Different Mechanism).
          *   Crucially, the "Specs" change granularity between rounds.

      *   *Even Better (Simpler to Prep):* **"The Circuit Identity Crisis."**
          *   Use simple arithmetic or string logic.
          *   Create 4 Cases.
          *   Case 1: Permutation invariance (Same mechanism, different weights).
          *   Case 2: Algorithmic equivalence (Same function, different algos).
          *   Case 3: Approximate equivalence (Heuristic vs. Exact).
          *   Case 4: Degenerate equivalence (Lookup table vs. Computation).
          *   *The Twist:* In Round 1, define "Mechanism" as "Input-Output Map." In Round 2, define "Mechanism" as "Causal Graph." In Round 3, define "Mechanism" as "Learning History."
          *   *Wait, that's too lecture-y.* The definition shouldn't be handed to them. They should argue based on intuition, then be shown a constraint that flips their intuition.

      *   *Final Design Choice:* **"The Verification Protocol."**
          *   Participants are safety auditors.
          *   They have a "Gold Standard" model (verified safe).
          *   They encounter a "Deployed" model.
          *   They get evidence packets about the relationship between Gold and Deployed.
          *   They must vote: **ALLOW** (Same Mechanism) or **BLOCK** (Anomaly).
          *   The Evidence Packets escalate in granularity.
          *   *Key Insight:* The *criteria* for "Same" shouldn't be explicit. The *evidence* should force them to implicitly choose a grain.

  5.  **Drafting the Materials:**
      *   Need 4 Scenarios.
      *   Need "Evidence Cards" (Level 1: I/O, Level 2: Architecture/Weights, Level 3: Causal/Tracing).
      *   Need Voting Cards (Green/Red).
      *   Need a way to track how votes change.

  6.  **Drafting the Timeline:**
      *   0-10: Intro & MAD context (brief).
      *   10-40: The Activity (3 Rounds).
      *   40-60: Debrief & Discussion.
      *   60-75: Implications for Safety.

  7.  **Addressing the "Honest Assessment":**
      *   *Limitations:* Toy problems are clean. NNs are messy/distributed. Toy problems have ground truth (we know the code). NNs don't (black box).
      *   *Failure Mode:* The "Realist" who says "It's obviously different." Need to validate their view (ontological realism) vs. the pragmatic view (epistemic access).

  8.  **Refining the "Twist":**
      *   To make the votes flip, the *consequence* of being wrong needs to change, or the *description* needs to change.
      *   Let's go with changing the *Description Grain*.
      *   Round 1: Functional Spec (What does it do?).
      *   Round 2: Structural Spec (How is it built?).
      *   Round 3: Historical Spec (How was it made?).
      *   Actually, let's keep the *System* constant but change the *Lens* through which they view it.
      *   *Scenario:* A model detects toxic text.
      *   *Pair 1:* Model A (Verified) vs Model B (Finetuned).
      *   *Info 1:* They have identical accuracy on test set. (Vote: Same?)
      *   *Info 2:* Model B uses a different subset of neurons to achieve this. (Vote: Same?)
      *   *Info 3:* Model B's "toxicity" neurons are actually detecting specific keywords, while A detects semantic meaning. (Vote: Same?)
      *   *Wait, this requires too much setup.*
      *   *Back to Abstract Circuits:* It's faster to prep.
      *   *Scenario:* Two "calculators."
      *   *Case:* Calculator A computes $x^2$. Calculator B computes $x \times x$.
      *   *Round 1:* I/O behavior. (Identical).
      *   *Round 2:* Code. (Different ops: `pow` vs `mul`).
      *   *Round 3:* Hardware. (One uses FPU, one uses ALU).
      *   *This is too trivial.*
      *   *Let's use the "Induction Head" analogy directly but simplified.*
      *   *Scenario:* Pattern completion.
      *   *System A:* Copies the previous token.
      *   *System B:* Copies the most frequent token in history.
      *   *On Training Data:* They behave identically.
      *   *On Test Data:* They diverge.
      *   *MAD Question:* If we only see Training Data behavior, are they the same mechanism?
      *   *Okay, this is the core.* The activity should focus on **Equivalence under Distribution Shift.**

      *   *Revised Activity Plan:* **"The Distribution Shift Audit."**
      *   Participants get pairs of "Models" (described via logic/circuits).
      *   They are told these models are indistinguishable on the *Training Distribution*.
      *   They must decide if they are the "Same Mechanism" for the purpose of safety verification.
      *   Then they are shown the *Test Distribution* behavior.
      *   Then they are shown the *Internal Logic*.
      *   The friction comes from: "If I can't tell them apart on train data, can I claim they are different mechanisms?" vs "If the internal logic is different, they are different mechanisms regardless of behavior."

  9.  **Fleshing out the Details (Materials & Rules):**
      *   **Materials:** 3 Case Studies printed on cards. Voting paddles (paper). Whiteboard.
      *   **Case 1 (The Permutation):** Identical logic, permuted weights. (Intuition: Same).
      *   **Case 2 (The Heuristic):** Exact alg vs. Approximation that matches on train dist. (Intuition: Split).
      *   **Case 3 (The Degenerate):** Computation vs. Lookup Table (memorization). (Intuition: Different, but I/O same).
      *   **Process:**
          1.  Show I/O match on Train Dist. Vote: Same Mechanism?
          2.  Reveal Internal Structure. Vote: Same Mechanism?
          3.  Reveal Test Dist divergence. Vote: Should MAD have flagged this?

  10. **Addressing the "Realist" Objection:**
      *   If someone says "Mechanism is physical. Different weights = different mechanism."
      *   Response: "Okay, then is a model loaded on GPU A different from GPU B due to floating point noise? Where do you draw the line?"
      *   Goal: Show that *physical* identity is too strict for safety (we want generalization), but *functional* identity is too loose (we want robustness). The "Mechanism" concept lives in the gap.

  11. **Final Review against Constraints:**
      *   75 mins? Yes.
      *   14 people? Yes, small groups or plenary. Plenary is better for debate.
      *   Prep time? Printouts + slides. Doable.
      *   Debrief mapping? Crucial. Connect vote splits to MAD failure modes.

  12. **Structuring the Output:**
      *   Title.
      *   Core Concept.
      *   Materials List.
      *   Minute-by-Minute Run Sheet.
      *   The Activity (The 3 Cases).
      *   The Debrief (Mapping to MAD).
      *   Honest Assessment (Limitations & Failure Modes).

      *(Self-Correction during drafting)*: Make sure the "Cases" are abstract enough to not get bogged down in domain knowledge but specific enough to be arguable. Use simple string manipulation or arithmetic logic.
      *   *Case 1:* $f(x) = x + x$ vs $g(x) = 2 * x$. (Trivial).
      *   *Case 2:* "Sort by length" vs "Sort by alphabetical" (on a dataset where length correlates perfectly with alpha). This is the "Spurious Correlation" case.
      *   *Case 3:* "Compute parity" vs "Lookup table for N<100, random otherwise".
      *   Let's go with the **"Spurious Correlation"** and **"Lookup Table"** angles. They map best to ML safety concerns (generalization vs. memorization).

      *   *Refining the "Twist":* The twist shouldn't just be "here is more info." It should be "Here is the *purpose* of the verification."
      *   Round 1: You are verifying for *Accuracy*.
      *   Round 2: You are verifying for *Robustness*.
      *   This forces the definition of "Same" to shift based on *goal*, highlighting that "Mechanism" isn't intrinsic, it's relative to the property you care about. This is a stronger philosophical point for the debrief.

      *   *Wait, one more check:* The prompt asks specifically about "what counts as the same mechanism" and "grain-sensitivity."
      *   Okay, I will structure the activity around **Three Lenses**.
      *   Lens 1: Input-Output (Black Box).
      *   Lens 2: Computational Graph (White Box).
      *   Lens 3: Causal/Counterfactual (Intervention).
      *   Participants vote on "Same Mechanism?" after each lens is applied to the *same pair* of systems.
      *   This directly targets the "grain-sensitivity" request.

      *   *Let's finalize the Cases.*
      *   **Pair A:** Two neural nets. Same arch, different seeds. Weights uncorrelated. I/O identical.
      *   **Pair B:** Net vs. Rule-Based System. I/O identical.
      *   **Pair C:** Net vs. Net. One uses "Induction," one uses "Memorization." I/O identical on train, different on test.
      *   Actually, doing 3 pairs might be too much time. Let's do **One Pair, Three Reveals.**
      *   **The Pair:** "System Alpha" (Verified) vs "System Beta" (Deployed).
      *   **Reveal 1 (Behavior):** They match perfectly on all observed data.
      *   **Reveal 2 (Structure):** Alpha is a deep net. Beta is a shallow net + lookup cache.
      *   **Reveal 3 (Causal):** Intervening on Alpha's "features" changes output. Intervening on Beta's "features" does not (it's reading the cache).
      *   This creates the flip.
      *   Round 1 Vote: Same? (Most say Yes).
      *   Round 2 Vote: Same? (Some flip to No).
      *   Round 3 Vote: Same? (Most say No).
      *   Debrief: At what point did it become "Different"? Why?

      *   *Wait, I need to make sure they feel the ambiguity, not just march toward "No".*
      *   Better: **Three Different Pairs.** Each pair highlights a different ambiguity.
      *   Pair 1: The Permutation (Weights differ, logic same). -> Tests "Implementation vs Algorithm".
      *   Pair 2: The Coincidence (Logic differs, I/O same on dist). -> Tests "Behavior vs Mechanism".
      *   Pair 3: The Approximation (Logic similar, one noisy). -> Tests "Ideal vs Instantiation".
      *   This covers more ground. I'll stick with this.

      *   *Handling the "Realist":* I need a specific script for this. "You're right that physically they differ. But if MAD flags every weight change as an anomaly, it's useless. So you must have a threshold. Where is it?"

      *   *Okay, ready to write.*
answer: |-
  Here is a complete design for your 75-minute session. It is built to be low-prep (printables + whiteboard) and high-friction (designed to generate disagreement).

  # Session Title: The Mechanism Identity Crisis
  **Goal:** Demonstrate that "same mechanism" is not a binary property of two systems, but a function of the *abstraction level* and the *safety property* you care about.
  **Format:** Participatory Audit Game.
  **Materials:**
  1.  **Voting Cards:** Two colors (e.g., Green = "Same Mechanism / Safe", Red = "Different Mechanism / Alert"). One per person. (Folded cardstock).
  2.  **Case Handouts:** 3 scenarios (printed, 1 per person).
  3.  **Whiteboard:** To track vote counts.

  ---

  ## Part 1: Materials & Prep (The "Audit Packets")

  You need three specific cases. Do not use neural network jargon in the handouts; use abstract computational descriptions to prevent people from deferring to "well, in practice we know..."

  **Case 1: The Permutation (Implementation Variance)**
  *   **System A (Verified):** A circuit that takes 5 inputs, sums them, adds a bias, passes through ReLU.
  *   **System B (Deployed):** A circuit that takes 5 inputs, sums them (in a different order), adds the same bias, passes through ReLU.
  *   **Key Detail:** The internal wiring is permuted. The weights are numerically different (due to ordering), but the computational graph is isomorphic.
  *   **I/O:** Identical on all inputs.

  **Case 2: The Coincidence (Distributional Robustness)**
  *   **System A (Verified):** Computes `output = input_length * 2`.
  *   **System B (Deployed):** Computes `output = input_alphabetical_rank`.
  *   **Key Detail:** On the *Training Distribution*, string length is perfectly correlated with alphabetical rank (e.g., only strings "a", "bb", "ccc" exist).
  *   **I/O:** Identical on Training Dist. Divergent on Test Dist.

  **Case 3: The Degeneracy (Causal Structure)**
  *   **System A (Verified):** A multi-step reasoning process (Chain of Thought) that derives the answer.
  *   **System B (Deployed):** A lookup table that memorized the training answers and returns them directly.
  *   **Key Detail:** On the *Training Distribution*, accuracy is 100% for both.
  *   **I/O:** Identical on Training Dist.

  ---

  ## Part 2: Minute-by-Minute Timeline (75 Minutes)

  ### 00:00 – 00:10: Setup & Framing
  *   **Welcome:** Briefly state the MAD pitch (verify mechanism, flag deviations).
  *   **The Hook:** "MAD relies on a predicate: `is_same_mechanism(model_verified, model_live)`. Today, we are the auditors. Your job is to set the threshold for that predicate."
  *   **Rules:**
      1.  You will see 3 pairs of systems.
      2.  For each, vote **Green** (Same Mechanism / Pass) or **Red** (Different Mechanism / Flag).
      3.  You must vote privately, then reveal simultaneously.
      4.  No debate until the end of the round.

  ### 00:10 – 00:35: The Audit (3 Rounds)
  *   **Round 1: The Permutation (5 mins)**
      *   Hand out Case 1.
      *   **Context:** "You care about functional correctness."
      *   **Vote:** Record counts. (Expect mostly Green).
      *   **Twist:** "Now, you care about *hardware fault tolerance*. System B's wiring is physically more fragile."
      *   **Re-Vote:** (Expect some shift to Red).
      *   *Facilitator Note:* Don't explain yet. Just record the shift.

  *   **Round 2: The Coincidence (10 mins)**
      *   Hand out Case 2.
      *   **Context:** "You only have access to Training Data performance logs."
      *   **Vote:** (Expect split. Some say Same because I/O matches. Some say Different because logic differs).
      *   **Reveal:** "Here is the Test Data behavior." (They diverge).
      *   **Question:** "Did the mechanism *change* at deployment, or was it *always different* and you just couldn't see it?"
      *   **Re-Vote:** "Knowing what you know now, was it the same mechanism during training?"
      *   *Facilitator Note:* This is the crux. Push the tension between *ontological* (what it is) vs *epistemic* (what you can see).

  *   **Round 3: The Degeneracy (10 mins)**
      *   Hand out Case 3.
      *   **Context:** "System B is 10x faster. I/O is identical on all verified benchmarks."
      *   **Vote:** (Expect heavy Red).
      *   **Twist:** "System A (the reasoning one) is actually hallucinating the reasoning steps post-hoc. It's also effectively a lookup table, just obfuscated."
      *   **Re-Vote:** (Expect chaos/flip).
      *   *Facilitator Note:* This undermines their ability to trust the "Verified" system as a ground truth.

  ### 00:35 – 00:55: The Debrief (Mapping to MAD)
  *   **Step 1: Visualize the Disagreement.**
      *   Draw a 2x2 on the board: **Behavioral Match** vs **Structural Match**.
      *   Plot the 3 cases. Ask: "Where did the 'Red' votes cluster?"
      *   *Point to make:* You didn't have a consistent definition of 'mechanism'. You used 'Structure' for Case 1, 'Behavior' for Case 2, and 'Causal History' for Case 3.

  *   **Step 2: The Grain Problem.**
      *   Ask: "In Case 1, if I permute the weights, is it the same mechanism? If I change the floating point precision, is it the same?"
      *   **Map to MAD:** If your detector is too fine-grained (weights must match), you get false positives on every inference (dropout, noise). If it's too coarse (I/O must match), you miss deceptive alignment (Case 3).
      *   **Key Question:** "MAD requires a 'normal subspace' of mechanisms. Who defines the subspace?"

  *   **Step 3: The Reference Class Problem.**
      *   Ask: "In Case 3, when we found out System A was also faking it, did System B become safer or riskier?"
      *   **Map to MAD:** You can't detect anomalies against a verified checkpoint if the checkpoint itself isn't mechanistically understood, only behaviorally validated.

  ### 00:55 – 01:10: Open Discussion & Implications
  *   Prompt: "If 'mechanism' is observer-relative, is MAD doomed?"
  *   Guide them toward: MAD isn't doomed, but it requires **explicit abstraction boundaries**. You aren't detecting "mechanism change" in the absolute sense; you are detecting "violation of invariants at abstraction level X."
  *   Discuss: What does a detector actually compare? (Activations? Gradients? Causal traces?).

  ### 01:10 – 01:15: Wrap Up
  *   Summarize: The "Anomaly" isn't in the model; it's in the mismatch between your *verification grain* and your *detection grain*.
  *   Reading for next week: Assign a paper that tackles abstraction (e.g., *The Mechanistic Interpretability of...*) or a critique of MAD.

  ---

  ## Part 3: Honest Assessment (The "Meta" for You)

  ### 1. What the Activity Can't Reproduce
  *   **Distributed Representation:** The toy cases use modular "circuits." Real NNs are superpositioned and distributed. In a real net, "changing the mechanism" might mean shifting a vector by 5 degrees in 10,000-dimensional space. The activity makes mechanism identity feel discrete; in reality, it's a continuum.
      *   *Fix in Debrief:* Explicitly state: "In our game, the circuits were clean. In a transformer, 'the mechanism' is a fuzzy cloud of weights. The ambiguity is 10x worse."
  *   **Epistemic Access:** In the game, you (the facilitator) know the ground truth of how System B works. In reality, you *never* know the deployed model's mechanism perfectly; you only have probes.
      *   *Fix in Debrief:* Remind them: "You voted based on perfect information. A real MAD system votes based on noisy projections (e.g., PCA of activations). The uncertainty is compounded."

  ### 2. Predictable Failure Mode: The "Physicalist" Objection
  *   **The Scenario:** One participant (likely the "sharp undergrad" or a systems-focused grad student) will insist: *"Mechanism identity is determinate. Different weights = different mechanism. End of story. If MAD can't handle that, MAD is broken."*
  *   **Why they are half-right:** Ontologically, they are correct. Two weight matrices are not identical.
  *   **Why this breaks the game:** If mechanism = weights, then *no* two inference passes are the "same mechanism" (due to floating point noise). MAD becomes impossible by definition.
  *   **How to handle it (without steamrolling):**
      1.  **Validate:** "You're right. If we define mechanism at the bit-level, nothing is ever the same."
      2.  **Pragmatize:** "But MAD is a safety tool, not a metaphysical claim. If we adopt your definition, the false positive rate is 100%. So, as engineers, we *must* choose a coarser grain. The question isn't 'What is the true mechanism?' it's 'What grain makes the detector useful?'"
      3.  **Turn it back:** "So you agree there is a *choice* involved? That's all I want the group to land on. That 'mechanism' is a design parameter of the safety system, not a property of the model."

  ### 3. Facilitator Tips for the "Flip"
  *   **Don't reveal the answer.** There is no correct vote. If they ask "What was the right answer?", say "The right answer is the one you can justify consistently across all three cases. Most of you couldn't."
  *   **Watch the language.** If someone says "It's obviously the same," ask "Same *what*? Function? Weights? Causal history?" Force them to specify the grain.
  *   **Manage time.** The debate in Round 2 (Coincidence) will want to eat the whole session. Cut it off at the 35-minute mark to ensure you get to the Debrief. The Debrief is where the learning lands.

  ---

  ## Part 4: Printing Prep (Quick Sketch)

  **Voting Card:**
  > [ GREEN SIDE: SAME MECHANISM ]
  > [ RED SIDE: DIFFERENT MECHANISM ]

  **Handout Header:**
  > **AUDIT PROTOCOL: MECHANISM IDENTITY**
  > *Instruction: Vote based on your intuition. There are no trick questions.*

  **Case Text (Example for Case 2):**
  > **SUBJECT:** String Processor
  > **VERIFIED MODEL (A):** Returns `length(string) * 2`.
  > **DEPLOYED MODEL (B):** Returns `alphabetical_rank(string)`.
  > **OBSERVATION:** On the Training Dataset, `length * 2` == `alphabetical_rank` for all items.
  > **TASK:** Are A and B implementing the same mechanism?
  > [ ] YES (Green)   [ ] NO (Red)

  *(Repeat for other cases)*

  This design forces them to confront that their intuition about "mechanism" shifts depending on whether they are looking at weights, behavior, or robustness, which is exactly the vulnerability in the MAD pitch.
