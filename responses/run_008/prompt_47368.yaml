      3. (d) Committee (Mechanically determinate, but inputs are fuzzy).
      4. (c) CEV (Most liable to diverge from the person entirely).

  4.  **Addressing Specific Constraints:**

      *   *Circularity:* Brandt avoids it best. CEV suffers most.
      *   *Averaging in (d):* It resolves conflict but creates a "lowest common denominator" life. It blurs intensity.
      *   *Re-ranking Condition:* What assumption failing changes things?
