      *   **The Four Accounts:**
          *   (a) Brandt-style cognitive psychotherapy (CP).
          *   (b) Railton's ideal advisor (IA).
          *   (c) Yudkowsky's Coherent Extrapolated Volition (CEV).
          *   (d) User's variant: Committee of fully-informed selves at every age (equal weights).
      *   **Specific Constraints:**
