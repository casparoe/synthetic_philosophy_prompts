      *Refining the "Removal" point:* If the feature (functional equivalence) is removed, does a residue survive? The prompt asks: "does a distinct residue survive that the original setup was never positioned to expose?" If she couldn't sort beforehand, it's the standard case. The residue in the *current* case is the gap between functional competence and phenomenal feel. If removed, that gap disappears because the competence disappears.

