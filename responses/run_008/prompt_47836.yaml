  **The Achromat Scientist**

  Mary is a congenital achromat, seeing the world entirely in grays. Nevertheless, she becomes the world's leading vision scientist. She sorts Munsell chips flawlessly using a handheld spectrometer, verbally labeling them "red" or "green" based on wavelength data. She mixes pigments against tables to create scenes colleagues confirm are photorealistic. She describes the functional role of red experiences in words experts endorse as exhaustive. She exercises these skills daily. Then, she undergoes gene therapy restoring cone function. Looking at a ripe tomato, she says, "I knew everything about this wavelength, but I didn't know *this*."

  **Analysis**

  **Isolated Question:** Is knowing what an experience is like merely possessing discriminatory and imaginative abilities, or does it require a specific phenomenal ground?

  **Predictions:** The **Ability Hypothesis** predicts Mary gains nothing new. She already exercised the capacities to identify, discriminate, and describe red states; the therapy merely changed the input mechanism from spectrometer to cone. On this view, "knowing what it's like" is just having the know-how, which she had. The **Acquaintance Hypothesis** predicts she gains a direct, non-propositional relation to a phenomenal property previously inaccessible. The **Representationalist** (Old Fact/New Mode) predicts she gains a phenomenal concept—a new mode of presentation—for a physical property she already knew under a theoretical mode.

  **Working Feature:** The case relies on *functional equivalence*. Mary performs the exact behavioral outputs the Ability Hypothesis identifies as "know-how" (sorting, identifying, describing) via alternative mechanisms. The intuition that she still learns something suggests abilities alone are insufficient; the *way* the ability is grounded matters.

  **Steelman**

  How would a defender respond? They must argue spectrometer-sorting isn't *recognitional* ability; true recognition requires phenomenal grounding. They claim Mary lacked the specific ability to recognize red *phenomenally*, not just functionally. A phenomenal-concept strategist adds that she lacked the conceptual machinery to deploy these abilities in first-person thought.

  **Cost:** This risks circularity. If "ability to recognize red" is defined as "ability acquired only by seeing red," the hypothesis explains nothing. It drains "ability" of independent content, making it a synonym for "experience." The view loses its physicalist advantage, conceding that something non-functional (the experience) is required to unlock the ability. It becomes a label for the mystery rather than a solution.

  **Removal**

  If we remove the spectrometer and painting (the functional equivalence), Mary is simply ignorant of color data. The case collapses to the standard black-and-white room. Does a distinct residue survive? No. Without the pre-existing competence, the intuition that she learns something is trivial because she lacked both facts and abilities. The original setup exposes the gap between *doing* (functional competence) and *feeling* (phenomenal experience). By maximizing her pre-therapy abilities, we isolate the phenomenal feel as the sole variable. Remove that maximization, and the variable confounds with factual ignorance. The standard room allows the Ability Theorist to say, "She lacked the ability to imagine." This setup blocks that move; removing the setup restores their defense.
