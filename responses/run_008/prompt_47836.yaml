  3.  **Drafting the Analysis:**
      *   **Question:** Is phenomenal knowledge reducible to functional/recognitional abilities?
      *   **Predictions:**
          *   Ability Hypothesis: Mary learns nothing new (she had the abilities).
          *   Acquaintance: She gains acquaintance with a property.
          *   Representationalist: She gains a new mode of presentation of an old fact.
      *   **Working Feature:** The *mediation* vs. *immediacy* of the ability. She had the output (correct sorting) without the internal state.
      *   **Steelman:** Ability theorist says "True recognition requires phenomenal grounding." Cost: Makes "ability" synonymous with "experience," vacating the physicalist explanation.
      *   **Removal:** If she couldn't sort/describe beforehand, it collapses to the standard case.

  4.  **Drafting the Content (Iterative refinement for word count):**

      *   *Thought Experiment:* Mary, a congenital achromat, sees only grayscale. Yet she is the world's leading vision scientist. Using a handheld spectrometer, she sorts Munsell chips flawlessly, labeling them "red" or "green" based on wavelength data. She mixes pigments against tables to create scenes colleagues confirm are photorealistic. She describes the functional role of red experiences in words experts endorse as exhaustive. She exercises these skills daily. Then, she undergoes gene therapy restoring cone function. Looking at a ripe tomato, she says, "I knew everything about this wavelength, but I didn't know *this*."

