          *   **Question:** Is knowing what an experience is like merely possessing discriminatory abilities?
          *   **Predictions:** The Ability Hypothesis predicts Mary gains nothing; she already sorted, painted, and described red correctly. The Acquaintance Hypothesis predicts she gains a direct relation to a phenomenal property. The Representationalist predicts she gains a phenomenal concept (new mode) for a physical property she already knew.
          *   **Working Feature:** The *functional equivalence* of her pre-therapy abilities. She could do everything the ability theorist says matters (discriminate, identify) without the experience.

      *   *Steelman:* The defender argues spectrometer-sorting isn't *recognitional* ability; true recognition requires phenomenal grounding.
          *   **Cost:** This risks circularity. If "ability to recognize red" just means "ability triggered by seeing red," the hypothesis explains nothing. It drains "ability" of independent content.

      *   *Removal:* If we remove the spectrometer/painting (the functional equivalence), Mary is just ignorant. The case collapses to the standard room. The residue is the intuition that *doing* the thing isn't *feeling* the thing.

