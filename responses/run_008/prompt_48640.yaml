prompt: |-
  i edit a small magazine where every issue pairs a short life of someone admirable with a short life of someone who went wrong — sort of Plutarch-style, though with modern people. The whole pitch is that readers pick up character better from lives than from rules. I've been in a running argument with a friend who writes for a religious audience and is convinced any admiring life has to lean hagiographic — clean up the flaws, or nobody comes away with something to imitate. Before we go another round on specific people, I want the spec first.

  Write the desiderata: what an adequate use of biography for moral learning has to deliver. I'm thinking things like — which cases it has to handle (the subject with one ruinous flaw, the person who was right about the big thing and aweful in private life, the admirable-but-not-immitable genius), the distinctions it can't collapse (learning about a person vs learning from a person, imitating vs merely admiring), and whatever constraints come from how people actually absorb exemplars. Give the case or consideration behind each requirement, and mark which are non-negotiable and which are really just the taste of one camp. My friend's camp will say "must present an imitable ideal," mine will say "must be honest about the subject's failures," and I suspect we can't always have both. If some subset of the requirements turns out to be jointly unsatisfiable, say so plainly — that's the part I most want to see, and tell me which side each unsatisfiable pair is forcing a choice between.

  Two more things. Don't score actual biographies or lives against the list, I'll do that myself — just the spec. And if you think the premise itself is off — that nobody really learns morality from lives, that Plutarch's pairs were mostly entertainment for readers who already agreed — say that straight instead of handing me a polite list. Same if you think one of my suggested requirements above is just my prejudice dressed up as a spec. I'd rather hear that than get the version built to please me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user edits a small magazine pairing "admirable" lives with "gone wrong" lives (modern Plutarch).
      *   **Goal:** Create a "desiderata" (specification/requirements list) for using biography for moral learning.
      *   **Conflict:** The user vs. a religious friend. User wants honesty about flaws; Friend wants hagiography (cleaned-up flaws for imitability).
      *   **Specific Instructions:**
          *   Define requirements (cases to handle, distinctions to keep, constraints on absorption).
          *   Provide the case/consideration behind each requirement.
          *   Mark requirements as Non-Negotiable (NN) or Taste/Partisan (T).
          *   Identify jointly unsatisfiable requirements (trade-offs) plainly.
          *   Do *not* score actual biographies.
          *   Do *not* be polite if the premise is flawed (challenge the idea that people learn morality from lives).
          *   Do *not* dress up prejudice as spec.

  2.  **Deconstruct the Premise (The "Plutarch for Moderns" Idea):**
      *   *Does it work?* Psychological research on moral exemplars suggests yes, but with caveats. People learn from narratives, but identification is key. If the gap is too wide (saint vs. sinner), identification fails. If the flaws are too relatable, rationalization occurs ("well, if *they* did it, it's okay").
      *   *The Friend's View (Hagiography):* Focus on *imitability*. If the goal is action, the model must seem actionable. Flaws distract or normalize sin.
      *   *The User's View (Realism):* Focus on *integrity/truth*. Flaws humanize and show struggle. Hagiography creates cynicism when the truth leaks out.
      *   *The Tension:* Truth vs. Utility.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Truthfulness.* (User's side). Essential for trust. If readers find out you lied, the moral lesson collapses.
      *   *Requirement 2: Imitability.* (Friend's side). If the person is too unique (genius, saint), you can't copy them.
      *   *Requirement 3: Complexity.* (User's side). Life isn't binary. Good people do bad things.
      *   *Requirement 4: Clarity of Lesson.* (Both). The reader needs to know *what* to take away.
      *   *Requirement 5: Psychological Realism.* (Neutral). How brains actually learn. We learn from struggle, not just success.

      *   *Refining the "Unsatisfiable" aspect:* This is crucial. The prompt asks to identify where the requirements clash.
      *   *Clash:* "Total Honesty about Flaws" vs. "Unambiguous Imitability." If I admit the hero was abusive but brilliant, can you imitate them? No. If I hide the abuse, is it honest? No.
      *   *Clash:* "Moral Learning from Lives" vs. "Moral Learning from Rules." Maybe the premise itself is shaky.

  4.  **Challenging the Premise (As requested):**
      *   The prompt explicitly says: "if you think the premise itself is off... say that straight."
      *   *Critique:* Do people actually learn *morality* from lives? Or do they learn *identity*? Plutarch wasn't really teaching ethics; he was teaching statesmanship and character *recognition*. Modern psychology suggests "moral licensing" (reading about a good person makes me feel good enough to be lazy) or "moral disengagement" (their flaws justify mine).
      *   *Decision:* I need to validate the premise enough to answer the prompt, but rigorously challenge the mechanism. The "Plutarchian" method has a specific failure mode: *Outcome Bias*. We judge the life by the result, not the intent.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the tension. State the verdict on the premise immediately (it's viable but fragile).
      *   **Section 1: The Core Tension (The Unsatisfiable Pair):** Get the hard truth out first.
      *   **Section 2: The Desiderata List:** Categorized by Function, Content, and Reception. Mark NN vs. Taste.
      *   **Section 3: The "Prejudice Check":** Address the user's specific suggestions that might be biased.
      *   **Section 4: The Premise Check:** Address the "does this actually work?" question.

  6.  **Drafting Content - Specific Points:**

      *   *Unsatisfiable Pair:* **Completeness of Character** vs. **Clarity of Action.** You cannot show the full messy truth of a high-achiever and maintain a clear "do this" signal.
      *   *Requirement:* **Causal Linkage.** (NN). The virtue must cause the success, not correlate. (Otherwise it's survivorship bias).
      *   *Requirement:* **Relatability Gap.** (NN). The subject can't be so gifted they are alien.
      *   *Requirement:* **Flaw Integration.** (Taste). User wants flaws integrated; Friend wants flaws omitted. This is the battleground.
      *   *Requirement:* **Distinctness of Domains.** (NN). Public vs. Private.

      *   *Premise Challenge:* Narrative transportation often bypasses critical judgment. We emulate the *style*, not the *substance*. Plutarch worked because his audience shared a specific conception of *arete*. Modern audiences don't share a conception of "Good."

  7.  **Refining the Tone:**
      *   Direct, analytical, slightly philosophical but grounded.
      *   Avoid placating the user.
      *   Ensure the "Friend's" position is represented fairly (it's not just "lying," it's "pedagogical simplification").

  8.  **Final Review against Constraints:**
      *   Did I score biographies? No.
      *   Did I mark NN vs. Taste? Yes.
      *   Did I identify unsatisfiable pairs? Yes.
      *   Did I challenge the premise? Yes.
      *   Did I challenge the user's prejudices? Yes (specifically around "honesty" automatically equaling "moral utility").

  9.  **Self-Correction during drafting:** I initially thought about making a long list. Better to make a tight list with strong justifications. The prompt asks for "the spec," implying a functional document. I should structure it like a design spec.
      *   *Correction on Premise:* I need to be careful not to say "Biography is useless." That's too dismissive. The nuance is that biography teaches *discernment*, not necessarily *rules*. The user's pitch ("readers pick up character better from lives than from rules") is the specific claim to test.
      *   *Key Insight:* Rules tell you *what* to do. Lives show you *what it costs*. That's the differentiator.

  10. **Final Polish:** Ensure the distinction between "Imitating" and "Admiring" is clear, as requested.

  *(Self-Correction Note)*: Wait, I need to make sure I don't just side with the user. The prompt asks me to identify if their requirements are prejudice.
  *User's Prejudice:* "Must be honest about failures." Is this necessary for moral learning? Sometimes, knowing the failure distracts from the specific virtue being taught. If teaching courage, does the person's infidelity matter? The Friend says no. The User says yes (integrity is holistic). I need to flag this as a philosophical disagreement, not just a spec requirement.

  Okay, ready to write.
answer: |-
  Here is the specification for using biography as a moral technology. I have structured this as a design spec, separating functional requirements from philosophical commitments. I have also included the "Premise Check" and "Prejudice Check" you requested at the end.

  ### Part I: The Unsatisfiable Pair
  **Status:** Jointly Unsatisfiable. You must choose one.

  **Requirement A: Holistic Integrity (Your Camp)**
  *   **Definition:** The biography must present the subject as a unified whole. Public virtues and private vices must be displayed in proportion to their impact on the subject's total life.
  *   **Constraint:** You cannot omit a ruinous private flaw to preserve a public lesson.
  *   **Cost:** This often destroys *imitability*. If the genius was a tyrant, the reader cannot imitate the genius without risking the tyranny. The signal-to-noise ratio of the moral lesson drops.

  **Requirement B: Pedagogical Clarity (Friend's Camp)**
  *   **Definition:** The biography must present a actionable model. The narrative arc must isolate specific virtues and demonstrate their payoff without confounding variables (like major sins) that muddy the causal link.
  *   **Constraint:** Flaws that do not serve the specific moral lesson must be minimized or omitted to prevent rationalization ("Well, if he cheated and succeeded, cheating is okay").
  *   **Cost:** This requires hagiography. It risks cynicism if the reader discovers the omission later, and it fails to teach how to wrestle with complex character.

  **Verdict:** You cannot have a life that is both *fully honest* and *purely imitable* if the subject is a complex adult. You are building a tool for **discernment** (User); your friend is building a tool for **replication** (Friend). These are different tools.

  ---

  ### Part II: The Desiderata (Specification)

  #### 1. Causal Linkage (Non-Negotiable)
  *   **Spec:** The narrative must demonstrate that the specific virtue caused the specific outcome, rather than merely correlating with it.
  *   **Case:** The "Survivorship Bias" Problem. Many people succeed *despite* their vices, or because of luck, not because of their virtue. If you present a wealthy person as "virtuous" without proving the wealth resulted from the virtue, you teach readers that virtue pays off when it might not.
  *   **Constraint:** You must distinguish between *moral success* (acting rightly) and *worldly success* (fame/wealth). If the admirable life ends in ruin, the spec must explain why the virtue was still worth it.

  #### 2. The Relatability Gap (Non-Negotiable)
  *   **Spec:** The subject's capacities must fall within two standard deviations of the reader's potential.
  *   **Case:** The "Admirable-but-Not-Imitable Genius." If the subject's virtue relies on a talent the reader cannot possess (e.g., a specific intellectual brilliance or a unique historical opportunity), the life teaches awe, not ethics.
  *   **Constraint:** If the subject is a genius, the biography must isolate the *discipline* behind the genius, not the genius itself. If it cannot do this, the life is for admiration only, not moral learning.

  #### 3. Domain Separation (Non-Negotiable)
  *   **Spec:** The text must explicitly distinguish between the subject's competence in their field and their competence in living.
  *   **Case:** The "Right about the Big Thing, Awful in Private Life." A scientist who saves millions but abuses their spouse.
  *   **Constraint:** The narrative must prevent the "Halo Effect." Readers tend to assume excellence in one domain implies excellence in all. The spec requires a firewall: you can learn from their public courage without imitating their private cruelty.

  #### 4. The Mechanism of Struggle (Non-Negotiable)
  *   **Spec:** The biography must depict the *cost* of the virtue, not just the *reward*.
  *   **Case:** Psychological absorption. Readers learn from lives via simulation. If the virtuous act appears effortless, the reader simulates it as easy. When they encounter resistance in their own life, they abandon the virtue.
  *   **Constraint:** You must show the temptation to do otherwise. A saint who never felt the pull of sin is not a moral model; they are a different species.

  #### 5. Flaw Integration (Taste / Partisan)
  *   **Spec:** (Your Camp) Flaws must be integrated into the narrative arc as obstacles the subject failed to overcome or struggled with.
  *   **Case:** (Friend's Camp) Flaws are distractions that dilute the instructional value.
  *   **Note:** This is the core disagreement. Your friend views the biography as a **diagram** (simplify to clarify). You view it as a **map** (accuracy is safety). Neither is objectively "correct" for moral learning; it depends on the maturity of the reader. Children need diagrams; adults need maps.

  #### 6. The "Gone Wrong" Symmetry (Taste / Editorial)
  *   **Spec:** The "failed" life must fail for reasons symmetrical to the "admirable" life's success.
  *   **Case:** If the admirable life succeeds due to patience, the failed life should not fail due to bad luck; they should fail due to impatience.
  *   **Note:** This is your magazine's unique hook. However, be warned: Real life is rarely symmetrical. Forcing symmetry risks turning history into fable. If you force symmetry to make the moral point clearer, you drift into your friend's camp (simplification).

  ---

  ### Part III: The Prejudice Check

  You asked me to flag if your suggested requirements are just your bias dressed up as specs.

  **1. "Must be honest about the subject's failures."**
  *   **Verdict:** This is your prejudice (philosophically), not a functional necessity for moral learning.
  *   **Reasoning:** There is evidence that "idealized modeling" works better for behavior modification in early stages of habit formation. If I want to teach a child to share, showing them a perfect example works better than showing them a nuanced example who sometimes shared and sometimes stole. Your insistence on honesty is a commitment to **intellectual integrity**, which is a virtue, but it is not strictly required for **behavioral mimicry**. Your friend is arguing for behavioral mimicry; you are arguing for character formation. These are different goals.

  **2. "Readers pick up character better from lives than from rules."**
  *   **Verdict:** Plausible, but risky.
  *   **Reasoning:** This is your core premise. It assumes readers are good at *inductive reasoning* (extracting the rule from the life). Many readers are bad at this. They extract the *aesthetic* instead of the *ethic*. They imitate the clothes, the tone, or the status of the subject, rather than the moral choice.
  *   **Constraint:** Your spec must include a "Extraction Mechanism." You cannot just tell the story; you must guide the reader on *what* to extract, or they will extract the wrong thing (e.g., "He was rich and honest, so honesty makes you rich").

  ---

  ### Part IV: The Premise Check

  You asked me to say it straight if the premise is off.

  **The Premise:** "Readers pick up character better from lives than from rules."

  **The Critique:**
  This is half-true. Readers pick up *identity* better from lives than from rules. They pick up *rules* better from rules than from lives.

  Plutarch's *Parallel Lives* were not primarily moral instruction for the masses; they were political training for the elite. They worked because the audience shared a specific, rigid definition of *Arete* (excellence/virtue). They already agreed on what "Good" looked like; Plutarch showed them how it navigated reality.

  **The Modern Problem:**
  Your audience does not share a definition of "Good."
  *   If you pair a devout ascetic with a hedonistic billionaire, half your readers will think the ascetic is the "gone wrong" example.
  *   Biography without a shared moral framework does not teach morality; it teaches **taste**. Readers will choose the life that matches their pre-existing aesthetic preferences, not the one that challenges their character.

  **The Risk:**
  If you present a "Gone Wrong" life honestly, readers may not see the warning. They may see a martyr. If you present an "Admirable" life honestly, readers may see a hypocrite.
  *   **Example:** If you write about a civil rights leader who was an adulterer, the "Rules" crowd says you undermine the cause. The "Lives" crowd says you humanize the struggle. But the *reader* often uses the flaw to dismiss the virtue entirely ("He cheated, so his politics are void"). This is "Moral Disengagement," a well-documented psychological phenomenon.

  **Conclusion on Premise:**
  Biography is superior to rules for teaching **resilience, context, and cost.**
  Biography is inferior to rules for teaching **specific obligations and boundaries.**

  If your magazine wants to teach *character* (how to endure, how to decide), the premise holds.
  If your magazine wants to teach *morality* (what is right vs. wrong), the premise is fragile. Lives show you how people navigated gray areas; they rarely prove which way was objectively "right" without a accompanying framework.

  **Recommendation:**
  Drop the claim that you are teaching "morality." Claim you are teaching **judgment.**
  Rules tell you what to do. Lives show you what it looks like when someone tries to do it. That is a defensible spec. Your friend wants to sell a map to a destination. You want to sell a compass. Make sure your readers know they are buying a compass, or they will get lost in the flaws.
