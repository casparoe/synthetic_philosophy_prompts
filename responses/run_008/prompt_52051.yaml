answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors
  **FROM:** [Your Name]
  **DATE:** November 14, 2024
  **SUBJECT:** Decision on Allocation Framework (Infinite Ethics & The "Bubble" Proposal)

  **Bottom Line Up Front**

  For the December cycle, I recommend we **retain the Expected Value (EV) framework but modify how we calculate long-horizon impacts.** Specifically, we should reject the advisor's proposed "Hard Bubble" rule (truncating value at a fixed spacetime coordinate) and instead adopt a **"Causal Convergence" rule.**

  Under this rule, we continue to rank grants by expected value, but we explicitly model future value using a discount rate that ensures the sum mathematically converges, and we restrict our accounting to outcomes within our *causal horizon* rather than an arbitrary geometric bubble. This preserves our long-horizon portfolio while respecting the mathematical constraints raised in the advisor's paper.

  Below is the reasoning, the math check, and where we are still flying blind.

  ***

  ### 1. The Math: What's Real vs. What's Theoretical

  The advisor's paper is not nonsense. We need to be clear about where the math is settled and where it's just philosophy wearing a math costume.

  **Settled Science:**
  If the universe is spatially infinite or temporally endless, and if we assume value can be generated indefinitely, the "total value" of any outcome is infinite. The advisor is correct that standard aggregation breaks down here. You cannot subtract infinity from infinity to get a clean number. Furthermore, he is right about the Riemann rearrangement theorem analogy: if a series is conditionally convergent, you can reorder the terms to sum to any number you like. If we are trying to calculate the *absolute total value of the universe* resulting from a grant, the number is undefined.

  **Contested Philosophy:**
  The leap from "total universal value is undefined" to "we must ignore everything outside a 300-year bubble" is **not** settled. This is the contested repair work. There are at least three competing fixes in the literature:
  1.  **Truncation (The Advisor's View):** Only count value inside region *X*.
  2.  **Density/Average Utilitarianism:** Compare value per unit of spacetime rather than totals.
  3.  **Pareto/Comparative Approaches:** We don't need to know the *total*; we only need to know if Option A is *better than* Option B in the regions where they differ.

  The advisor is presenting his preferred philosophical fix (Truncation) as a mathematical necessity. It isn't. It's a policy choice to solve the math problem.

  ### 2. Why We Should Reject the "Hard Bubble"

  The advisor proposes we treat value outside a specific spatiotemporal boundary (e.g., Earth + 300 years) as zero. While this solves the divergence problem, it introduces two fatal flaws for our fund:

  **A. The Cliff-Edge Problem**
  A hard bubble creates moral arbitrariness. Under this rule, saving a life in year 299 counts; saving the exact same life in year 301 counts for nothing. There is no ethical basis for this cliff. It forces our grants team to game the model—e.g., structuring endowments to expire exactly at the boundary—to maximize reported EV.

  **B. It Kills Our Mission**
  Roughly half our board sees long-horizon risk reduction (pandemic preparedness, AI safety, etc.) as core to our identity. These interventions often pay off beyond the advisor's proposed window. If we adopt the Hard Bubble, the EV of long-horizon grants drops to near-zero compared to direct present-day aid (malaria nets, etc.). We would effectively be defunding the long-term portfolio without a substantive debate on mission, just because of a mathematical technicality.

  ### 3. The Recommendation: Causal Convergence

  Instead of a hard bubble, we should adopt a **Causal Convergence** rule. This has two components:

  1.  **Causal Horizon:** We only count value we can plausibly influence. Even if the universe is infinite, our causal reach is not. We cannot affect events outside our light cone. This naturally bounds the *spatial* infinity problem without an arbitrary coordinate cutoff.
  2.  **Convergent Discounting:** For the *temporal* infinity problem, we apply a discount rate to future value. This isn't about saying future people matter less; it's a mathematical tool to ensure the sum converges. If the probability of our intervention mattering declines over time (due to uncertainty, technological obsolescence, or other overriding factors), the infinite sum becomes finite.

  **Why this works:** It respects the math (the sum now converges) without the ethical arbitrariness of the Hard Bubble. It allows us to compare Grant A vs. Grant B based on the *difference* they make within the realm of causal possibility.

  ### 4. Honesty Check: The Strongest Point of the Losing Side

  If we vote this down and stick with our modified EV framework, we need to acknowledge where the advisor (and the "Bubble" proponents) are right.

  **Their strongest point:** We are pretending to a precision we cannot have.
  Even with discounting and causal horizons, our estimates for long-horizon grants are essentially educated guesses. The advisor is correct that *any* number we assign to "value of preventing an existential risk in 2200" is sensitive to arbitrary modeling choices (e.g., the discount rate selected). By rejecting the Bubble, we are choosing to live with that uncertainty rather than eliminate it. We must admit to stakeholders that our EV rankings for long-term work are **comparative heuristics**, not absolute measurements of universal good. We are not measuring the universe; we are measuring our best guess of our own footprint.

  ### 5. Action Items for December

  To implement this before the meeting:

  1.  **Research Team:** Update the cost-effectiveness models to explicitly include a declining discount rate for impacts beyond 100 years. (Propose a rate, e.g., 1-2%, justified by uncertainty rather than time-preference).
  2.  **Policy:** Formalize that "Expected Value" for board purposes means "Expected Causal Difference," not "Total Universal Value."
  3.  **Communication:** Prepare a brief FAQ for stakeholders explaining why we aren't adopting the "finite bubble" recommendation, emphasizing that our causal reach is naturally limited even if the universe isn't.

  **Summary:** The math problem is real, but the proposed solution is too blunt. Let's fix the math without breaking our mission.

  Let me know if you have pushback before I circulate this to the full chair.

  Best,

  [Your Name]
