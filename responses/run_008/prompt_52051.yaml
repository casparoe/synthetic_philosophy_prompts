      *   *Actually, looking at the prompt again:* The advisor says "treat everything outside the bubble as off the books entirely." The board fears this kills long-horizon. If I define the bubble as "causal influence," long-horizon work (existential risk) *is* inside the bubble because it preserves the future where our influence continues.
