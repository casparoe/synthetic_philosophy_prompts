      *   *Alternative:* Recommend *against* the Bubble Rule, but *modify* the EV framework to rely on *difference-making* within a probable causal horizon rather than total universal value.
      *   *Let's go with:* **Retain the Expected Value framework, but explicitly model long-term impacts using a declining discount rate that effectively converges to zero, rather than a hard spatiotemporal cutoff.** This addresses the convergence issue (math) without the moral arbitrariness of the bubble (ethics).

