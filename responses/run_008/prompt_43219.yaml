prompt: |-
  writing up a position statement for a grad seminar on adaptationism and want someone to poke holes in it before I send it around. here's roughly where I stand:

  (1) I'm an adaptationist — for any complex organismal trait, the default assumption should be that selection built it, and I think "panselectionist" is mostly just an insult people reach for when they've run out of arguments.

  (2) I also think Gould and Lewontin's spandrels paper is one of the best things ever written in the field and basically right about byproducts and developmental constraints.

  (3) some case verdicts: I think the human chin is a structural byproduct of jaw growth and needs no adaptive story at all, but I think the female orgasm is a genuine adaptation with a real selectionist account, and I find it annoying when people call the latter a byproduct of male biology — that always strikes me as question-begging.

  (4) I'm fine with Kimura — most molecular variation really is drift, nearly neutral theory basically won that one.

  (5) I think "just-so story" is a lazy criticism, and the right way to evaluate an adaptive hypothesis is to compare it against alternatives, not to sneer at it.

  Do these hang together? Which of these actually pull against each other, which only look like they do, and what's the cheapest fix for each? Rank the tensions by severity rather than listing them as all equally bad, and then tell me which single revision would clean up the most. Don't be polite about it.
reasoning: |-
  Here's a thinking process that leads to the suggested critique:

  1.  **Analyze the User's Request:**
      *   **Task:** Critique a position statement for a grad seminar on adaptationism.
      *   **Goal:** Poke holes, identify tensions/contradictions, rank them by severity, and suggest the single best revision.
      *   **Tone:** "Don't be polite about it." (Direct, critical, rigorous).
      *   **User's Stance:**
          1.  Adaptationist default (complex traits = selection). "Panselectionist" is an insult.
          2.  Gould & Lewontin (G&L) "Spandrels" paper is great/right about byproducts/constraints.
          3.  Specific verdicts: Chin = byproduct; Female Orgasm = adaptation (annoyed by byproduct counter-claim).
          4.  Molecular level: Kimura/Neutral Theory is right (drift dominates).
          5.  Methodology: "Just-so story" is lazy; compare hypotheses.

  2.  **Initial Assessment of Coherence:**
      *   On the surface, this looks like a standard "Modern Synthesis/Extended Synthesis" moderate adaptationist stance. It acknowledges drift at the molecular level and constraints at the developmental level but insists selection is the primary driver of complex phenotype.
      *   *However*, there are significant philosophical and methodological tensions, particularly between (1), (2), and (3).

  3.  **Identify Tensions/Contradictions:**

      *   **Tension A: The "Default Assumption" vs. G&L (1 vs. 2).**
          *   (1) says default = selection for complex traits.
          *   (2) says G&L are "basically right" about byproducts/constraints.
          *   *Conflict:* G&L's core argument is *against* making selection the default assumption without ruling out architecture/byproducts first. If you accept G&L's critique as "basically right," can you logically maintain that the *default* assumption should be selection? G&L argue the default should be null (architecture) until selection is proven.
          *   *Severity:* High. This is the core philosophical conflict of the seminar topic.

      *   **Tension B: The Chin vs. Female Orgasm (3).**
          *   Chin = Byproduct (G&L's favorite example).
          *   Female Orgasm = Adaptation (User rejects byproduct view).
          *   *Conflict:* Why is one a byproduct and the other not? The user finds the "byproduct of male biology" claim question-begging. But isn't assuming it's an adaptation *also* question-begging if you haven't ruled out the byproduct hypothesis? The criteria for distinguishing them seem subjective or post-hoc.
          *   *Severity:* Medium-High. It exposes a potential bias in how evidence is weighed.

      *   **Tension C: Molecular vs. Phenotypic (4 vs. 1).**
          *   (4) Kimura/Drift wins at molecular level.
          *   (1) Selection wins at complex organismal trait level.
          *   *Conflict:* This is actually a standard distinction (phenotype vs. genotype), so it's not a logical contradiction, but it needs careful phrasing. If "complex organismal trait" is built on molecular variation, how do you separate them cleanly?
          *   *Severity:* Low. This is standard orthodoxy.

      *   **Tension D: "Just-so Story" Criticism (5 vs. 1 & 3).**
          *   (5) "Just-so story" is lazy; compare hypotheses.
          *   (1) Default = selection.
          *   *Conflict:* If the default is selection, aren't you *inviting* just-so stories? If you start with the assumption of adaptation, the "alternative hypotheses" you compare against might be weak strawmen. G&L's point was that adaptationists often *don't* test alternatives seriously.
          *   *Severity:* Medium. Methodological inconsistency.

  4.  **Ranking the Tensions:**

      1.  **The Default Assumption vs. G&L (1 vs. 2):** This is the fatal flaw. You cannot claim G&L were "basically right" while simultaneously rejecting their primary methodological injunction (don't assume adaptation first).
      2.  **The Criteria for Byproducts (3):** The chin/orgasm distinction looks arbitrary without a clear heuristic. It looks like "I like this adaptation, I don't like that one."
      3.  **The "Just-So" Defense (5):** Calling it lazy while holding (1) makes you vulnerable to the exact charge G&L made.

  5.  **Developing the Critique (Drafting the content):**

      *   *Tone Check:* Needs to be sharp, academic but direct. No "nice try."
      *   *Point 1 (The G&L Paradox):* You're trying to have your cake and eat it. G&L attacked the *heuristics* of adaptationism, not just the conclusions. If you keep the heuristic (default = selection), you've rejected G&L's main point.
      *   *Point 2 (The Orgasm/Chin Inconsistency):* Why is the chin obvious but the orgasm not? Is it because the orgasm *feels* functional? That's teleological intuition, not evidence. The "male byproduct" hypothesis (exaptation/spandrel) is actually a strong null. Dismissing it as "question-begging" while asserting adaptation is projection.
      *   *Point 3 (Molecular vs. Phenotypic):* This is fine, but don't let it shield you. If molecular is drift, where does the variation for selection come from? (Minor point compared to the others).
      *   *Point 4 (Just-So Stories):* If your default is selection, your "comparison" is rigged.

  6.  **Identifying the Single Best Revision:**
      *   To fix the biggest tension (1 vs. 2), the user needs to adjust (1).
      *   *Current (1):* Default = selection.
      *   *Revision:* Default = *testable function*, but null hypothesis = constraint/byproduct. Or, shift from "default assumption" to "primary explanatory target."
      *   *Better Revision:* Drop the word "default." Replace with "primary working hypothesis *pending* constraint checks."
      *   *Actually, the cleanest fix:* Admit that G&L changed the *burden of proof*. You can be an adaptationist about *outcomes*, but not about *methodology*.
      *   *Best Single Revision:* Modify (1) to acknowledge that the "default" must be subjected to the G&L filter first. Or, more radically, admit that "default" is the wrong word. "Prior probability" is high, but "methodological default" is low.
      *   *Let's go with:* Change (1) from "default assumption" to "null hypothesis *only after* architectural constraints are ruled out." No, that's too clunky.
      *   *Simpler:* Change (1) to: "I prioritize selectionist explanations for complex traits, *but* I accept G&L's demand that architectural nulls be tested *before* selection is inferred."
      *   *Wait, the prompt asks for the "cheapest fix" that cleans up the most.*
      *   The biggest mess is the contradiction between claiming G&L are right (2) and keeping the pre-G&L heuristic (1).
      *   *Fix:* Qualify (1). Acknowledge that "default" is too strong.

  7.  **Refining the Output:**
      *   Structure:
          1.  Executive Summary (Brutal honesty).
          2.  Ranked Tensions (High to Low).
          3.  The Single Best Revision.
      *   Ensure the tone is "don't be polite."

      *(Self-Correction during drafting)*: I need to make sure I don't just say "G&L disagree." I need to explain *why* the user's position is internally inconsistent. The user says G&L are "basically right." G&L say "Do not assume adaptation." User says "Assume adaptation." That is a direct logical contradiction, not just a difference of opinion.

      *Re-evaluating the Orgasm point:* The user finds the "byproduct of male biology" claim annoying. This is a common adaptationist reflex. But if G&L are right (2), then the byproduct hypothesis is a *stronger* null than the adaptation hypothesis. Dismissing it requires evidence, not annoyance. This links back to tension #1.

      *Final Plan:*
      1.  Hit the (1) vs (2) contradiction hard.
      2.  Hit the subjective criteria in (3).
      3.  Dismiss (4) as mostly safe but potentially a shield.
      4.  Hit (5) as enabling (1)'s laziness.
      5.  Recommendation: Soften (1) to align with (2).

  8.  **Final Polish:** Check against "Don't be polite." Use phrases like "This is intellectually dishonest," "You're smuggling in intuition," "This collapses under scrutiny."

      *(Wait, one nuance)*: Is it possible to be a "methodological adaptationist" while agreeing with G&L's ontology? Some argue yes. But the user says "default assumption." That is methodological. G&L attacked the method. So the contradiction stands.

      *Let's write.*
answer: |-
  Here is the brutal assessment you asked for.

  ### Executive Summary
  Your position is currently a "cafeteria adaptationism" that tries to occupy the sensible middle ground but ends up contradicting itself on the core methodological question of the seminar. You want the *conclusions* of Gould and Lewontin (G&L) without accepting their *methodology*. This will get you torn apart by anyone who has actually read the Spandrels paper closely. You are claiming to respect the critique while simultaneously violating its primary injunction.

  Here are the tensions, ranked by severity.

  ### 1. The Fatal Contradiction: "Default Assumption" vs. "G&L are Right" (Tension between 1 and 2)
  **Severity: Critical**

  This is not a tension; it is a logical contradiction.
  *   **Your Claim (1):** The *default assumption* for complex traits is selection.
  *   **Your Claim (2):** G&L are "basically right."
  *   **The Reality:** The entire point of the Spandrels paper is that making selection the *default assumption* is the error. G&L argued that the null hypothesis should be architectural/developmental constraint, and adaptation must be *proven*, not assumed.

  By keeping (1) as written, you are explicitly rejecting the central methodological contribution of (2). You cannot say "G&L were right about byproducts" while maintaining a heuristic that systematically overlooks byproducts in favor of selection. If you keep (1), you are admitting that you think G&L were historically important but methodologically wrong. If you think they were "basically right," you have to abandon the "default assumption" language.

  **Why this hurts:** In a grad seminar, this looks like you haven't internalized the critique you claim to respect. It makes you look like a pre-1979 adaptationist wearing a post-1979 mask.

  ### 2. The Arbitrary Verdicts: Chin vs. Orgasm (Tension within 3)
  **Severity: High**

  You assert the chin is a byproduct and the female orgasm is an adaptation, but you provide no heuristic for *how* you distinguished them.
  *   **The Chin:** You accept the G&L view (structural consequence).
  *   **The Orgasm:** You reject the G&L-adjacent view (byproduct of male homolog) as "question-begging."
  *   **The Problem:** Calling the "byproduct of male biology" hypothesis question-begging is projection. Asserting it *is* an adaptation without ruling out the byproduct hypothesis is the actual question-begging.

  Why is the structural constraint of the jaw obvious, but the developmental homology of the clitoris/penis not? It looks like you are using **teleological intuition** (does it *feel* like it should be there?) rather than a rigorous criterion. If you can't articulate the specific evidentiary threshold that separates the chin from the orgasm, your position reduces to: "Byproducts are real, just not in the cases I dislike."

  **Why this hurts:** It exposes a bias. It suggests you accept non-adaptive explanations only when they are convenient or when the adaptive story is hard to tell (chin), but you revert to adaptationism when the trait feels "functional" (orgasm).

  ### 3. The "Just-So" Defense vs. The Default Assumption (Tension between 1 and 5)
  **Severity: Medium**

  You claim "just-so story" is a lazy criticism (5), which is partially true *if* you are testing hypotheses. But because you hold (1) (selection is the default), you are structurally incentivized to write just-so stories.
  *   If selection is the **default**, then alternative hypotheses (drift, constraint) become the hurdles you have to clear, rather than competing models.
  *   G&L's point was that adaptationists often construct a plausible story, declare victory, and never seriously model the null.
  *   By calling the criticism "lazy," you are insulating yourself from the exact methodological sloppiness G&L identified.

  **Why this hurts:** It makes your defense of adaptationism look defensive rather than rigorous. It suggests you want to be allowed to tell stories without being held to the burden of proof that G&L established.

  ### 4. Molecular vs. Phenotypic (Tension between 1 and 4)
  **Severity: Low**

  This is standard orthodoxy. Phenotype = Selection, Genotype = Drift. This holds together fine *provided* you don't let the molecular drift explain away phenotypic variation that *should* be selected. As long as you keep these domains separate, this isn't a contradiction, just a boundary condition.

  ---

  ### The Single Best Revision

  **Change Claim (1).**

  You need to align your methodology with your endorsement of G&L. You cannot keep "default assumption."

  **Current (1):**
  > "I'm an adaptationist — for any complex organismal trait, the default assumption should be that selection built it..."

  **Revised (1):**
  > "I'm an adaptationist — for complex organismal traits, selection is the **primary explanatory target**, but **only after** architectural and developmental null hypotheses (per G&L) have been tested and rejected."

  **Why this fixes the most:**
  1.  **Resolves the Critical Contradiction:** It aligns (1) with (2). You acknowledge G&L's methodological injunction while maintaining that selection is still the most likely *outcome* once constraints are accounted for.
  2.  **Fortifies (3):** It forces you to apply the same rigorous null-testing to the female orgasm as you do to the chin. You can still conclude the orgasm is an adaptation, but you have to admit the *burden of proof* was on you to rule out the byproduct hypothesis first.
  3.  **Defangs (5):** It removes the accusation that you are lazy. You aren't dismissing the "just-so" critique; you are claiming you meet the higher standard G&L set.

  **Bottom Line:** Right now, you sound like someone who likes the *idea* of constraints but still wants to play by the old rules. Make the methodological shift explicit, or expect to be hammered on the inconsistency between your respect for Spandrels and your commitment to the "default assumption."
