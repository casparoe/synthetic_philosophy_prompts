answer: |-
  **Conference Room B, 1:17 AM**

  **Elena:** (Rubbing her temples, staring at a spreadsheet) Look, Marcus, we've seen eight candidates. Candidate four is the strongest. The marginal expected utility of interviewing candidate nine is strictly less than the cost of keeping this room rented and our brains oxygenated for another hour. We stop. That's not satisficing; that's optimizing with search costs included.

  **Marcus:** (Leaning back, spinning a pen) It's satisficing because our stop rule isn't derived from that spreadsheet. It's derived from the fact that candidate four met the threshold we set after candidate two. If candidate one had been a godsend, our threshold would be higher now. If we'd struck out five times, we'd be desperate. The target moves, Elena. You can't optimize against a moving target without redefining "optimize" until it means nothing.

  **Elena:** I'm not redefining anything. I'm expanding the state space. The "moving target" is just dynamic utility updating based on new information about the distribution of talent. A fully rational agent anticipates that their aspirations will shift based on early signals. If you include the cognitive cost of recalculating that shift, the optimal policy *looks* like a fixed aspiration level. Simon's stop rule is just the solution to my Bellman equation.

  **Marcus:** But that's the "as if" defense. It assumes the agent is actually running the Bellman equation. We know they aren't. Humans use heuristics. And here's the kicker: in this hiring market, the payoff function has flat maxima. The difference in productivity between the 90th percentile candidate and the 95th percentile candidate is negligible. But the cost of distinguishing between them is massive. Optimization implies precision where the environment offers no reward for it.

  **Elena:** That just means the derivative of the utility function is near zero in that region. It doesn't mean the agent isn't maximizing. It means the optimal action is "stop searching early because precision is expensive." You're describing the *shape* of the cost function, not a different *logic* of choice. If a satisficer stops at "good enough," and an optimizer stops at "good enough because better costs too much," they take the same action. Why do you need two theories?

  **Marcus:** Because the psychological aftermath is different. Schwartz's data shows committed maximizers are less happy with objectively equivalent outcomes than satisficers. They experience more regret. If your model says "maximize utility," and the act of trying to maximize utility *destroys* utility through regret and rumination, then the prescription to "just optimize including costs" is self-defeating. You can't tell a stressed human to "calculate the cost of stress" without adding more stress.

  **Elena:** (Pauses, looks at the whiteboard) Okay. I'll grant you the regress problem. If the cost of deliberation is itself a variable that requires deliberation to price, you get an infinite regress. To avoid that, you need a rule of thumb to stop calculating. So, in practice, a rational agent must use a heuristic to determine when to stop optimizing.

  **Marcus:** Exactly. The heuristic *is* the rationality. It's not a buggy approximation of optimization; it's the only way optimization is computationally possible for a finite mind.

  **Elena:** I concede the computational bottleneck. But I still maintain that "rationality" names the *goal*—the best possible outcome given constraints—not the *tool*. If satisficing gets us the best outcome, it's because it successfully approximates the optimization ideal. Calling it "bounded rationality" suggests there's a "unbounded" version we're failing at. There isn't. There's just optimization.

  **Marcus:** And I'm saying "rationality" should name the *adaptation*. If the tool fits the creature, it's rational. If you insist on calling a heuristic "optimization in disguise," you're protecting the ideal at the expense of the description. You're saying, "Humans are rational because they act *as if* they are gods with infinite compute," rather than "Humans are rational because they use scissors to cut paper instead of simulating the molecular bonds."

  **Elena:** (Sighs, closing the laptop) So we agree to hire candidate four?

  **Marcus:** We agree to hire candidate four.

  **Elena:** Good. But I'm writing the justification in terms of expected value.

  **Marcus:** And I'll tell the department head we found someone who meets our needs.

  **Elena:** (Standing up) We're arguing about whether "rational" is a north star or a compass.

  **Marcus:** And whether it matters if the compass is magnetic or just a drawing of one, as long as we don't get lost.

  **Elena:** Let's get coffee. Optimizing for caffeine.

  **Marcus:** Satisficing with a donut.

