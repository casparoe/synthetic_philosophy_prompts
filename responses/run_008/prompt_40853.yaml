answer: |-
  This is the exact tension that keeps ethics committees awake. Your mate is right about the philosophy, but you're right about the Tuesday morning reality. You cannot run Dworkin vs. Dresser in a 20-minute slot with a tired consultant who just wants to know if they can prescribe antibiotics without getting sued.

  Below is a practical tool designed for an NHS Clinical Ethics Committee. It is framed around the **Mental Capacity Act (MCA) 2005** (which governs this in England/Wales), specifically focusing on **Applicability**.

  **The Hard Truth Before We Start:**
  If an Advance Decision to Refuse Treatment (ADRT) is **valid** and **applicable**, it is legally binding. You cannot override it with a "best interests" argument, no matter how cheerful the patient is. The ethical work, therefore, happens in determining whether the ADRT is truly *applicable* to the *current* person and situation. This procedure is a structured way to test applicability without pretending it's pure math.

  ***

  # The ADRT Applicability & Continuity Protocol

  **Time limit:** 20 Minutes.
  **Goal:** Determine if the ADRT applies to *this* patient in *this* state, or if it has been rendered inapplicable by changed circumstances/identity.

  ### Step 1: The Legal Gate (Validity)
  *Ask:* Is the document signed, witnessed, and does it explicitly state it applies "even if life is at risk" (if refusing life-sustaining treatment)?
  *   **No:** Stop. It is a "Statement of Wishes." Proceed to Best Interests decision (weigh current welfare heavily).
  *   **Yes:** Proceed to Step 2.

  ### Step 2: The Clinical Match (Specificity)
  *Ask:* Does the directive name the *exact* treatment and the *exact* condition currently present?
  *   **No (Vague):** Stop. It is a "Statement of Wishes." (See Case 3).
  *   **Yes:** Proceed to Step 3.

  ### Step 3: The "Change of Mind" Check (Post-Directive Evidence)
  *Ask:* Is there reliable evidence (verbal or written) that the patient changed their mind *after* signing the directive?
  *   **Yes:** The ADRT is likely invalid/inapplicable. Defer to the most recent expressed wish.
  *   **No / Unknown:** Proceed to Step 4.

  ### Step 4: The "Current Self" Check (Jaworska/Dresser Filter)
  *Ask:* Is the patient currently expressing a wish that contradicts the directive (e.g., asking for help, smiling at treatment)? OR, does the patient appear to have a level of wellbeing the directive-writer did not anticipate?
  *   **Current Contradiction:** If the patient has *some* capacity to express a current preference, this weighs heavily against applicability.
  *   **Contentment:** If the patient is cheerful/comfortable, does this contradict the *state* described in the directive (e.g., directive feared "misery," patient is not miserable)?
      *   *If Yes:* Flag for Step 6 (Value Judgement). The directive may not cover *this* quality of life.
      *   *If No (Patient is distressed):* The directive likely applies.

  ### Step 5: The "Narrative Rupture" Test (Dworkin vs. New Life)
  *Ask:* Have the patient's fundamental life circumstances changed so drastically since the directive that the "story" the directive tells no longer fits the person? (e.g., new marriage, new faith, new grandchild, significant time lapse).
  *   **No (Life is consistent):** The directive likely stands.
  *   **Yes (Life has transformed):** Flag for Step 6. The "past self" may no longer represent the "whole life" interests.

  ### Step 6: The Committee Verdict (The Grey Zone)
  *If flagged in Step 4 or 5:*
  The committee must make a value judgement on **Applicability**.
  *   **Option A:** The ADRT applies. (The right to refuse treatment in advance protects the critical interest, even if the current self is content).
  *   **Option B:** The ADRT is inapplicable. (The current situation is so distinct from what was envisioned that the directive does not cover it; treat in Best Interests).

  ***

  # Running the Cases

  Here is how this procedure handles your three scenarios. Note where it gives you a clear answer, and where it forces you to own the moral weight.

  ### Case 1: The Cheerful Refusal
  *Profile:* Moderate dementia, generally cheerful. ADRT (5 years old) refuses antibiotics for life-threatening infections. Family says "Don't bind her by this."
  *   **Step 1 (Validity):** Assume valid (signed/witnessed). **Pass.**
  *   **Step 2 (Match):** Refuses antibiotics for infection. Patient has infection. **Pass.**
  *   **Step 3 (Change of Mind):** No evidence she verbally revoked it. **Pass.**
  *   **Step 4 (Current Self):** Patient is cheerful. Directive likely envisioned a state of suffering or "undignified" survival.
      *   *Question:* Does her current cheerfulness contradict the *condition* she sought to avoid?
      *   *Finding:* She is not suffering. She is enjoying day-to-day life.
      *   *Flag:* **Yes.** The "misery" anticipated may not be present.
  *   **Step 5 (Narrative):** 5 years is significant, but no major life restructuring mentioned. **No Flag.**
  *   **Step 6 (Verdict):** **The Uncomfortable Answer.**
      *   *Procedure Output:* This lands in the Grey Zone.
      *   *Ethical Reality:* Under the MCA, if she lacked capacity when she made it, and it's valid/applicable, her current cheerfulness does **not** legally override the ADRT. Dworkin wins here. The "critical interest" of not being kept alive in dementia outweighs the "experiential interest" of being happy for a few more months.
      *   *Committee Action:* You must advise that the ADRT likely **stands**, unless you can argue the *specific* infection/outcome is different from what she envisioned.
      *   *Where it hurts:* You have to tell the family that her current happiness doesn't matter legally. The procedure forces you to admit this is a value judgement on whether "life with dementia" was the specific harm she sought to avoid. If the directive said "If I don't recognise my family," and she doesn't, it stands. If it said "If I am suffering," and she isn't, you have room to argue inapplicability.

  ### Case 2: The New Life
  *Profile:* Directive decades old (pre-2nd marriage, pre-grandchild). Refuses treatment that would allow her to see the grandchild grow up. Family says following the old directive feels wrong.
  *   **Step 1 & 2:** Assume Valid and Match. **Pass.**
  *   **Step 3:** No formal revocation. **Pass.**
  *   **Step 4:** Current self wishes unknown (dementia), but current life is relational.
  *   **Step 5 (Narrative Rupture):** **Major Flag.**
      *   *Question:* Is the person who wrote the directive the same moral agent as the one sitting here?
      *   *Finding:* She entered a new marriage and became a grandmother. These are core identity shifts. The directive was written by a "single/childless" self about a future that no longer exists.
  *   **Step 6 (Verdict):** **The "Out" Clause.**
      *   *Procedure Output:* Recommend the ADRT is **Inapplicable**.
      *   *Reasoning:* The "circumstances" have changed fundamentally (MCA s.25(4)(c)). The life she is now living contradicts the assumptions of the life she planned when she signed.
      *   *Where it helps:* This gives the consultant cover. You aren't ignoring the directive; you are ruling that the *context* of the directive has been voided by the new chapter of her life. The "Past Self" does not have veto power over the "New Narrative."

  ### Case 3: The Vague One
  *Profile:* "No extraordinary measures." No elaboration. Patient non-communicative.
  *   **Step 1:** Valid signature? Maybe.
  *   **Step 2 (The Clinical Match):** **HALT.**
      *   *Question:* Is antibiotics/feeding/surgery "extraordinary"?
      *   *Finding:* No. These terms are medically undefined and legally insufficient for refusing life-sustaining treatment.
  *   **Verdict:** **Stop.**
      *   *Procedure Output:* This is not a binding ADRT. It is a "Statement of Wishes and Feelings."
      *   *Action:* Treat under **Best Interests**.
      *   *Where it's honest:* The procedure admits it can't solve this. It kicks it back to the clinicians to weigh burden vs. benefit *now*, using the vague note as one piece of evidence among many. It prevents the committee from trying to interpret "extraordinary" as if it were a legal contract.

  ***

  # Where the Procedure is Lying to You (The "Judgement Dressed as Procedure" Bits)

  You asked for upfront honesty. Here are the three points where this flowchart is actually just structured moral reasoning:

  1.  **Step 4 (Contentment vs. Anticipation):**
      *   *The Lie:* It implies we can objectively know if her current cheerfulness contradicts the directive.
      *   *The Truth:* We are guessing what the "Past Self" would think of the "Current Self." Would Past-Self say, "Thank god she's happy, ignore me"? Or would Past-Self say, "That happiness is delusional, stick to the plan"? The procedure forces you to vote on this, but calls it an "Applicability Check."

  2.  **Step 5 (Narrative Rupture):**
      *   *The Lie:* It suggests a grandchild automatically changes the validity of a directive.
      *   *The Truth:* Legally, it might not. A right to refuse treatment is robust. This step relies on the committee feeling brave enough to tell a consultant that a legal document is ethically void because the patient fell in love again. That is a moral call, not a legal one.

  3.  **Step 6 (The Verdict):**
      *   *The Lie:* That there is a correct answer.
      *   *The Truth:* In Case 1 especially, there are two right answers (Protect Autonomy vs. Protect Welfare). The procedure doesn't solve the conflict; it just ensures you've argued about the right things before you take the vote.

  ### Recommendation for your Committee
  Print Step 1 and Step 2 on a card. If a case passes those, do not pretend the rest is legal compliance. Call Step 4, 5, and 6 what they are: **"Ethical Risk Assessment."**

  If you vote to override an ADRT based on Step 4 or 5, you are accepting legal risk to prevent moral harm. The procedure doesn't remove that risk; it just makes sure you aren't taking it blindly.
