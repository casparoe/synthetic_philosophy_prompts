  10. **Final Polish:** Ensure the distinction between "feasible plan" and "ideal outcome" is clear. Ensure the distinction between "action" and "policy" is clear.

  *(Self-Correction on Move 5)*: Daniel says "a policy you are tempted to abandon... cannot be what rationality demands." This is a strong claim. In game theory, subgame perfection requires no temptation to deviate. But here, the "subgames" are indistinguishable. The standard resolution is that the *ex-ante* optimization binds the *intra-intersection* choice because the agent knows his future self is identical to his current self. I will mark Move 5 as "Right about the tension, Wrong about the conclusion."

