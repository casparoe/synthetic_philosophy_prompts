answer: |-
  ### 1. Exam Question

  **Module:** Rational Choice Theory (Final Year)
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer **one** question.

  **Question 1**

  Consider the **Wilmslow Game**. A fair coin is tossed until it first lands heads. Let $n$ denote the toss number on which heads first appears. The player receives a payoff in utility units given by:
  $$ u_n = \frac{(-1)^{n+1} \cdot 2^n}{n^2} $$
  The probability of outcome $n$ is $1/2^n$. Consequently, the expected value of the game corresponds to the series $\sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n^2}$.

  Unlike the Pasadena game, this series converges absolutely. However, the second moment of the payoff distribution diverges, implying infinite variance.

  Drawing on our analysis of the St Petersburg and Pasadena paradoxes, evaluate the following claim: *"Because the Wilmslow game possesses an absolutely convergent expected value, the decision-theoretic pathologies of the Pasadena game are resolved, and a rational agent should value the game at its expectation."*

  In your answer, you must address:
  (a) Why absolute convergence matters for the coherence of the expectation;
  (b) Whether a defined expectation with infinite variance provides a stable guide for choice in single-play scenarios;
  (c) What the long-run behaviour of the sample mean implies for repeated play;
  (d) What the Wilmslow case reveals about the true lesson of the Pasadena paradox.

  ***

  ### 2. Model Answer

  The claim that the Wilmslow game resolves the decision-theoretic pathologies of the Pasadena game merely by virtue of having a defined expected value is false. While the Wilmslow game avoids the specific mathematical inconsistency of undefined expectations, it retains the economic instability that makes expectations action-guiding only under specific conditions. The defined expectation is necessary for standard decision theory, but it is not sufficient to guarantee rational usability.

  First, the nature of the convergence is crucial. The Pasadena game's expectation is conditionally convergent, meaning its value depends on the order of summation. This allows for "reordering objections," where relabelling outcomes changes the expected value, violating dominance principles. The Wilmslow game's series, $\sum (-1)^{n+1}/n^2$, converges absolutely because $\sum 1/n^2$ is finite. Absolute convergence ensures the expectation is invariant under reordering. Therefore, the Wilmslow game blocks the specific logical incoherence of the Pasadena game. A rational agent can assign a unique number ($\pi^2/12$) to the game without contradicting the axioms of probability regarding countable additivity.

  However, assigning a number does not ensure that the number is a useful guide for choice. In a single-play scenario, the expectation represents a probability-weighted average. With infinite variance, the distribution of payoffs has "heavy tails." While extreme payoffs are rare, they are sufficiently large to dominate the variance. For a risk-neutral agent maximizing expected utility, the expectation is theoretically the correct price. Yet, in practice, the infinite variance implies that the actual outcome is highly likely to deviate massively from the expectation in any finite sample. The expectation becomes a poor predictor of the likely experience of the agent. If rational choice requires the expectation to be a robust summary of the gamble's worth, the Wilmslow game fails this test just as the St Petersburg game does, despite the former having a finite mean.

  This instability is confirmed by analysing repeated play. In standard games with finite variance, the Law of Large Numbers ensures the sample mean converges to the expected value, and the Central Limit Theorem describes the error distribution. In the Wilmslow game, the infinite variance violates the conditions for the standard Central Limit Theorem. While the Weak Law of Large Numbers may still hold (convergence in probability), the convergence is exceptionally slow and erratic. The "long run" does not offer the same safety net as it does for games with finite variance. An agent playing the Wilmslow game repeatedly cannot rely on the average payoff stabilizing around the expectation within a reasonable timeframe. Thus, the expectation lacks "strong" normative force.

  Ultimately, the Wilmslow game demonstrates that the lesson of the Pasadena paradox was not solely about undefined sums. The deeper lesson is that expectations are only action-guiding when the underlying distribution is sufficiently stable. The Pasadena game failed on logical coherence (undefined/conditional expectation); the Wilmslow game succeeds on coherence but fails on stability (infinite variance). Therefore, the claim is incorrect: the pathologies are not resolved. A rational agent might accept the expectation as the theoretical value but should recognise it as a fragile guide that does not guarantee favourable outcomes in either single or repeated interactions. The definition of the expectation is a mathematical fix, not a decision-theoretic cure.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 20 (5 Points × 4 Marks)

  | Point | Requirement | Typical B-Level Fumble / A-Level Distinction |
  | :--- | :--- | :--- |
  | **1. Convergence Type** | **Identifies that absolute convergence blocks reordering objections.** Must explain that unlike Pasadena, the Wilmslow expectation is invariant to how outcomes are indexed or summed. | **B:** States the series converges but treats it as merely "defined." **A:** Explicitly contrasts absolute vs. conditional convergence and links it to the relabelling objection. |
  | **2. Single-Play Guidance** | **Argues that defined EV is insufficient for single-case choice due to heavy tails.** Must note that infinite variance makes the EV a poor predictor of the actual outcome. | **B:** Assumes that because EV is finite, it automatically dictates the rational price/choice. **A:** Recognises that infinite variance undermines the EV's representativeness for a one-off decision. |
  | **3. Repeated-Play Stability** | **Discusses the failure of standard convergence (CLT) in the long run.** Must explain that the sample mean does not stabilise normally due to the divergent second moment. | **B:** Assumes the Law of Large Numbers applies normally, guaranteeing the average payoff matches EV. **A:** Notes that while weak convergence might hold, the lack of finite variance prevents reliable long-run stabilisation. |
  | **4. Pasadena Comparison** | **Distinguishes between logical coherence and decision-theoretic stability.** Must argue that Pasadena failed on coherence (math), while Wilmslow fails on stability (utility). | **B:** Concludes Wilmslow is "solved" because the math works, missing the parallel with St Petersburg/Pasadena instability. **A:** Synthesises that undefinedness was only one symptom of a broader problem with heavy-tailed expectations. |
  | **5. Definite Verdict** | **Reach a clear conclusion rejecting the prompt's claim.** The answer must definitively state that the expectation is defined but not necessarily action-guiding. | **B:** Hedges or concludes "it depends" without resolving the tension between defined EV and infinite variance. **A:** Commits to the verdict that the decision-theoretic pathologies persist despite mathematical well-definedness. |
