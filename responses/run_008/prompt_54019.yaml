          *   Variance/Second Moment: $\sum (1/2^n) \cdot [(-1)^{n+1} \cdot 2^n / n^2]^2 = \sum (1/2^n) \cdot [2^{2n} / n^4] = \sum 2^n / n^4$. This diverges.
      *   **Goal:** Create a question that forces students to engage with the *implications* of infinite variance despite defined EV, rather than just reciting Pasadena literature.
      *   **Deliverables:**
          1.  Exam Question (framed for the paper).
          2.  Model Answer (~600 words, definite verdict, brief math).
          3.  Marking Scheme (5 points x 4 marks = 20 total). Must distinguish B-level (EV is defined, so it's fine) from A-level (EV defined + infinite variance creates new problems/insights).

