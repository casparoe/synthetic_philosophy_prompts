answer: |-
  Here is a complete design for an 80-minute seminar session. It is built to be prepped in under two hours, requires only standard classroom materials, and uses a proper scoring rule to financially (socially) punish the "certainty mistake."

  # Game Title: The Fallible Oracle Market

  ## 1. Learning Objective
  To viscerally demonstrate that updating on uncertain evidence (Jeffrey Conditioning) requires weighting the evidence by its reliability, whereas treating uncertain evidence as certain (Standard Conditioning on a false proposition) leads to systematic expected utility loss (Dutch Book vulnerability).

  ## 2. Materials & Prep (Afternoon Work)
  *   **The State:** A standard deck of cards. Remove all cards except Red and Black face cards (e.g., 10 Red, 10 Black). Shuffle them.
  *   **The Noise:** One 10-sided die (D10).
  *   **The Ledger:** A whiteboard or projected spreadsheet with 10 rows (Rounds) and 10 columns (Students).
  *   **Betting Slips:** Small slips of paper for each student for each round.
  *   **Currency:** "Epistemic Utility Points" (EUP). Start everyone at 100 EUP.
  *   **The Sting:** Print a voucher: *"The bottom 3 EUP scorers buy coffee for the top 3 scorers next week."* (Cost: ~$30 out of pocket if you want to be nice, or let them actually pay. The social stake is usually enough).

  ## 3. Game Rules (10 Minutes)
  **The Setup:**
  1.  **Hypothesis ($H$):** The color of the top card on the deck (Red or Black). Prior $P(H) = 0.5$.
  2.  **The Oracle (You):** You draw the card. You look at it. You do **not** show them.
  3.  **The Signal ($E$):** You roll the D10 secretly.
      *   **Roll 1–7 (70%):** You speak the **True** color.
      *   **Roll 8–10 (30%):** You speak the **False** color.
      *   *Example:* Card is Red. Roll is 9. You announce: "Black."
  4.  **The Announcement:** You announce *only* the color (e.g., "The Oracle says: Red"). You do **not** announce the die roll.
  5.  **The Task:** Students must submit a probability $q \in [0, 1]$ that the Card is the Announced Color.
      *   *Constraint:* They cannot bet on the die roll. They must bet on the Card.
  6.  **Scoring (Brier Score):**
      *   If they are **Right**: Score $= 1 - (1 - q)^2$
      *   If they are **Wrong**: Score $= 1 - (0 - q)^2 = 1 - q^2$
      *   *Add this score to their EUP total.*
      *   *Note:* Explain that reporting $q=1.0$ (Certainty) yields 1 point if right, but **0 points** if wrong. Reporting $q=0.7$ yields ~0.91 if right, and ~0.51 if wrong.

  ## 4. The Session Timeline (80 Minutes)

  ### Phase 1: Setup & Calibration (0–15 mins)
  *   **0-5:** Hand out the "Coffee Voucher." Explain the stakes.
  *   **5-10:** Explain the Oracle Mechanism. **Crucial:** Tell them explicitly, "The Oracle is calibrated to 70% reliability. You know this."
  *   **10-15:** **Practice Round.** Do one round where you reveal the die roll immediately after. Let them calculate the correct update together.
      *   *Goal:* Ensure they understand $P(Red | Oracle Says Red) = 0.7$.
      *   *Check:* Ask, "If I say Red, what is the rational credence?" Wait for "0.7". If they say "1", stop and correct. "The Oracle lies 30% of the time. If you bet 1, you are betting the Oracle never lies."

  ### Phase 2: The Market (15–55 mins)
  *   Run **10 Rounds**.
  *   **Pace:** 4 minutes per round.
      *   Draw Card, Roll Die, Announce Signal (1 min).
      *   Students write $q$ on slip, hand to TA/You (1 min).
      *   Reveal Card, Update Ledger publicly (1 min).
      *   Reset (1 min).
  *   **Instructor Role:** Be dramatic. "The Oracle says... **RED**." Pause. Watch the students who look confident.
  *   **Data Collection:** Keep the slips. You will need them for the debrief.

  ### Phase 3: The Reveal & Scoring (55–65 mins)
  *   Calculate final EUP.
  *   Announce the Top 3 and Bottom 3.
  *   **The Sting:** Hand out the voucher. "See me after class to arrange the coffee run."
  *   **The Hook:** Ask the class: "Look at the Bottom 3. Look at their bets on the slips I kept. What did they have in common?"
      *   *Answer:* They likely bet $q \ge 0.9$ repeatedly. They treated the signal as certain.

  ### Phase 4: Debrief & Formalism (65–80 mins)
  *   **Map the Game to Jeffrey Conditioning:**
      *   **$H$:** The Card Color.
      *   **$E$:** The Proposition "The Card is [Announced Color]".
      *   **The Mistake:** Standard Conditioning assumes $P_{new}(E) = 1$. The students updated as if the Oracle's word made $E$ certain.
      *   **The Jeffrey Fix:** The experience (hearing the Oracle) does not make $P(E)=1$. It makes $P_{new}(E) = 0.7$ (the reliability).
      *   **The Formula:** Write on board:
          $$P_{new}(H) = P(H|E) \cdot P_{new}(E) + P(H|\neg E) \cdot P_{new}(\neg E)$$
      *   **Plug in numbers:**
          *   $P(H|E) = 1$ (If the Oracle is telling truth, Card matches Signal).
          *   $P(H|\neg E) = 0$ (If Oracle lying, Card opposes Signal).
          *   $P_{new}(E) = 0.7$ (Reliability).
          *   Result: $1 \cdot 0.7 + 0 \cdot 0.3 = 0.7$.
      *   **Rigidity:** Point out that $P(H|E)$ (the link between Signal and Truth) remained rigid at 1.0 *conditional on the signal being truthful*. What changed was the weight of the signal itself ($P_{new}(E)$).

  *   **Honest Limitations (What the game hides):**
      *   *Known Reliability:* In the game, they knew $\rho=0.7$. In real Jeffrey conditioning (e.g., "It looks green in dim light"), you rarely know the reliability parameter objectively. You have to estimate $P_{new}(E)$ introspectively.
      *   *Partition:* Here the partition was binary (Red/Black). Real Jeffrey updates often involve continuous shifts or overlapping propositions.
      *   *Tell them:* "This game was a 'training wheels' version. You knew the noise. Next week, we discuss how to estimate the noise when you don't have a D10."

  ## 5. Predictable Failure Modes & Mitigation

  **1. The Refuser (The "I won't bet" kid)**
  *   *Behavior:* Submits $q=0.5$ every time or refuses to play.
  *   *Why:* Risk aversion or philosophical objection to scoring rules.
  *   *Fix:* **Default Rule.** "If you do not submit a slip, your score for that round is 0." This penalizes non-participation more than calibrated uncertainty ($q=0.5$ yields 0.75 expected score).
  *   *Debrief Note:* "Refusing to update is also a strategy. It yields 0.5 EUP per round. The Certainty Bettor yields 0.7 EUP *if* they are calibrated, but 0 if they crash. The Jeffrey Bettor maximizes growth."

  **2. The Gambler (The "I can guess the die" kid)**
  *   *Behavior:* Tries to pattern-match your die rolls. Bets 1.0 when they feel "lucky."
  *   *Why:* They think they can beat the noise channel.
  *   *Fix:* **Proper Scoring Rule.** The Brier Score punishes variance. If they bet 1.0 five times and are wrong once, their average score drops precipitously.
      *   *Math:* 5 correct @ 1.0 = 5 pts. 1 wrong @ 1.0 = 0 pts. Avg = 0.83.
      *   Jeffrey (0.7) @ 6 rounds: $6 \times [(0.7 \times 0.91) + (0.3 \times 0.51)] = 6 \times 0.79 = 4.74$.
      *   Wait, the Gambler wins short term.
      *   *Correction:* Make sure the "Wrong" outcomes happen early. **Stack the deck.** In the first 3 rounds, ensure the Oracle lies at least once. Nothing kills a Gambler like a $q=1.0$ bust in Round 2.
  *   *Debrief Note:* "The Gambler treated the noise as signal. They tried to update on $H$ using a phantom variable (the die roll) they had no access to."

  **3. The Confused Bayesian (The "Likelihood" kid)**
  *   *Behavior:* Calculates $P(Signal|H)$ correctly but outputs $q=1.0$ anyway because "It's still evidence."
  *   *Why:* This is the specific mistake you want to kill. They acknowledge the noise but collapse the probability anyway.
  *   *Fix:* This is why the **Brier Score** is essential. It mathematically forces the penalty. When you return their slips, circle the $q=1.0$ entries where they lost. Show them the math: "You knew the 30% risk. You priced it at 0%. The market charged you for that."

  ## 6. Why This Works
  1.  **It separates Evidence from Truth:** The Oracle's statement is the evidence. The Card is the truth. The gap between them is the Jeffrey parameter.
  2.  **It monetizes overconfidence:** Standard conditioning on uncertain evidence is effectively overconfidence. The Brier score taxes overconfidence.
  3.  **It fits the time:** 10 rounds is enough to establish a trend (Law of Large Numbers) but short enough to leave 30 mins for the math.
  4.  **It creates a "Scar":** The students who lost EUP will remember the feeling of being "certain" and wrong. That emotional sting anchors the formalism.

  ## 7. Instructor Script Snippet (For the Debrief)
  *"Look at Round 4. I said 'Red'. The card was Black. Sarah, you bet 0.95. John, you bet 0.70. Sarah, you lost 0.90 points. John, you lost 0.49 points. You both saw the same evidence. The difference is that John respected the Rigidity of the conditional probability but adjusted the weight of the evidence. Sarah, you implicitly assumed $P(Evidence) = 1$. In Jeffrey Conditioning, the art is not calculating the likelihoods—it's honestly assessing the weight of the experience. Today, the D10 was that weight. Next week, it's your own eyes."*
