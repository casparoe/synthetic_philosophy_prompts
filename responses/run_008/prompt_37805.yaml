      *   *Point 1 (Argument vs. Intuition):* Call it a "performative truth." It's not a syllogism.
      *   *Point 2 (The "I"):* Bring in Lichtenberg. "It thinks." Maybe there's no "he" to owe money.
      *   *Point 3 (Time):* This is the killer. If he only exists now, the lease is void.
      *   *Point 4 (Other Minds):* Admit the *cogito* doesn't prove *you* exist. But point out the pragmatic contradiction.
      *   *Point 5 (The Rent):* Synthesize. To argue, he assumes a shared world. To live, he assumes a shared world.

  7.  **Final Review against Constraints:**
