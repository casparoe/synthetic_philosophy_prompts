  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Futarchy (governance by prediction markets).
      *   **Context:** The user and a friend argued for 3 hours. The friend loves it (clean separation of facts/values); the user is skeptical (hidden assumptions).
