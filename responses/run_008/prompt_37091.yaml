answer: |-
  **Lunar Fission and Vat-Brains: A Reading Guide for *Moon* and 'Where Am I?'**

  **Introduction**
  This session pairs Duncan Jones's *Moon* (2009) with Daniel Dennett's philosophical short story 'Where Am I?' (1978). Both works interrogate the location of the self. Dennett's narrator discovers his brain can be vat-bound while his body roams freely, challenging the intuition that we inhabit our skulls. *Moon* presents Sam Bell, a lunar miner who discovers he is a clone with implanted memories, challenging the intuition that we are unique, continuous entities. Reading the film through Dennett's puzzle reveals how cinematic narrative complicates functionalist metaphysics, forcing us to confront the emotional and ethical costs of fission that thought experiments often stipulate away.

  **Mapping the Metaphysics**
  Dennett's story relies on a separation of components: the brain (Yorick), the body (Hamlet, later Fortinbras), and a computer simulation (Hubert). The narrator maintains his identity by following his point of view, regardless of the substrate. *Moon* maps onto this structure but alters the causal architecture. The various Sam Bells are analogous to Dennett's bodies (Hamlet/Fortinbras), while the 'original' Sam on Earth functions as the remote source, akin to Yorick in the vat. However, the connection is not a radio link transmitting consciousness, but a stream of implanted memories.

  In Dennett's scenario, the radio link allows the brain to control the body; in *Moon*, the live feed from Earth is jammed, severing the clone from the source. This is the inverse of Dennett's severed link: where Dennett's narrator fears disconnection from his body, Sam Bell fears connection to a home that does not know him. The implanted memories act as a counterfeit causal stream, creating psychological continuity where there is no biological continuity. When the film introduces a second Sam, we see a fission event similar to the narrator's alternation between Yorick and Hubert. However, where Dennett's narrator switches substrates, the film forces two embodied Sams to coexist. This transforms Dennett's abstract puzzle of location into a concrete problem of duplication: if identity follows psychological continuity, both Sams are equally Sam, yet they occupy distinct spatial locations and face divergent fates.

  **The Cinematic Strain: Perspective and Coexistence**
  The mapping strains when we consider the medium of presentation. Dennett's story is rigorously first-personal. The philosophical tension arises because the narrator *feels* himself to be wherever his point of view is, even when logic suggests he should be in the vat. He insists on locating himself phenomenologically. *Moon*, conversely, is a third-person cinematic narrative. Once there are two Sams, the camera cannot occupy both points of view simultaneously. It must remain neutral, observing the Sams as distinct objects in a way Dennett's narrator never experiences his own bodies.

  This creates a divergence in how identity is tested. Dennett's narrator is confused about where he is; the audience of *Moon* knows exactly where the Sams are, but struggles with who they *are*. The film dramatizes a limitation of the first-personal method: from the inside, each Sam feels uniquely real, but the camera reveals them as interchangeable units of labour. Furthermore, Dennett's story keeps only one active locus of consciousness at a time (switching between brain and computer). *Moon* forces genuine coexistence. The two Sams speak, argue, and care for one another. This makes the film a harder test for psychological continuity theories. If identity is merely a stream of consciousness, the branching should not matter. Yet, the film suggests it matters profoundly because the stream divides into two competing claims on the future. The audience is forced to identify with one Sam over the other—usually the one who survives—revealing that our intuitive grasp of identity is tied to narrative survival, not just functional equivalence.

  **Ethics and Ontological Limits**
  Dennett's story is almost entirely metaphysical; the moral status of Yorick or Hubert is irrelevant to the puzzle of location. *Moon* introduces a dimension Dennett ignores: the ethics of exploitation. The Sams are disposable labour, created to bypass union laws regarding solitary confinement. The film plainly cares about this injustice. This raises a critical question: do the moral questions come apart from the identity questions?

  The corporation in *Moon* operates on the assumption that they do. They treat the clones as non-persons because they are not the 'original'. The film argues against this separation. It suggests that moral status attaches to the phenomenological experience of the subject, regardless of their ontological pedigree. Whether Sam is a clone or the original, his suffering is real. However, we must be faithful to both texts and acknowledge where the reading fails. Dennett's functionalist framework is ill-placed to capture the film's emotional logic, which relies on narrative identity. Dennett's narrator is puzzled; Sam Bell is grieving. The film depends on the audience feeling the tragedy of the dying Sam, even if, metaphysically, he is merely a copy whose continuation exists in the younger Sam.

  If we strictly apply Dennett's logic, the death of the older Sam should be negligible so long as the younger Sam continues the psychological stream. But *Moon* insists this death is a loss. This suggests that personal identity debates regarding uniqueness are beside the point when the wrong done is one any person-numbering convention would condemn. The film argues that exploitation is wrong because of the capacity for suffering, not because of the uniqueness of the soul. Yet, the emotional weight of the ending relies on the very uniqueness Dennett seeks to dissolve. We mourn the older Sam because he is *this* specific instance of consciousness, not just a token of a type. Here, the film exposes the coldness of the thought experiment: tidy stipulations about radio links cannot account for the radiation sickness, the loneliness, and the visceral fear of death that ground the film's ethical claim.

  **Student Discussion Guide**
  For the seminar, please rewatch the following three scenes. First, the moment Sam discovers the stash of sleeping clones in the storage room. Question: Does this visual multiplication of bodies resolve or complicate the question of which Sam is the 'real' subject of experience? Second, the kitchen confrontation where the two Sams argue over who should leave. Question: If both possess identical memories up to the point of awakening, on what basis does the dying Sam claim a right to the future that the other does not? Third, the final sequence where the younger Sam escapes while the older dies. Question: Does the film suggest the older Sam's death is a tragedy or a metaphysical necessity?

  Finally, consider what the film adds to the personal identity debate that the thought experiment alone cannot. Dennett's story is free to stipulate tidy conditions: perfect copies, instantaneous switching, and no physical decay. *Moon* is bound by the messy reality of embodiment. The film adds the dimension of time and deterioration; the Sams age and sicken differently. It demonstrates that identity is not just a logical puzzle of information transfer, but a lived experience of bodily fragility. While Dennett shows us that 'I' might be wherever the point of view is, *Moon* shows us that 'I' am also wherever the pain is. The film forces us to acknowledge that resolving the metaphysics of fission does not resolve the ethical obligation to the individual instance of consciousness facing extinction.
