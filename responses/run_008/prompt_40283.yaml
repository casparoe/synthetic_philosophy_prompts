prompt: |-
  hey so I'm not a student or anything, just someone who got kind of obsessed with how world war one actually started after one too many documentaries. one word that keeps coming up in the popular history books is "overdetermined" — as in, the war was overdetermined, meaning even if princip had missed, or the archduke never got in the car, you still had the alliance commitments dragging everyone in, the mobilization timetables that basically couldn't be stopped once started, the naval race, austria-hungary convinced serbia had to be dealt with, empires terrified of slipping into second place. basically so many causes that historians still argue over which one "really" mattered as if the answer is hiding out there somewhere. and honestly that idea messed with me a little? like we want a villain or a mistake to point at, and overdetermination says: remove any one piece and you're probably still standing in the trenches by 1916.

  heres the thing though. I run a small book club, all regular working people, and I want to actually convey this to them — not the timeline, they know the timeline, but that specific feeling of a system that was already loaded. I think a poem could do that where my rambling explanation can't.

  I want you to act as a professional poet who also genuinely knows their history and has thought hard about causation. dont just dive in — brainstorm first: which candidate causes should make the cut, what each one implies on its own, and how the sestina form could carry the idea instead of just decorating it.

  the poem: a sestina. heres the structural idea I want, though tell me if you think its bad, you're the poet. the six repeating end-words each belong to one "cause" — the alliance chains, the mobilization schedules, the naval race, the balkan nationalism, whatever six you pick — so the form itself does the arguing. in a sestina the same six words keep coming back no matter where you are, and thats kind of exactly it, right? every stanza should read like a complete, standalone "this is why the war happened" story, but by the third or fourth stanza the reader should notice the other five never left. and don't let the poem resolve into "so the assassination didn't matter" — I keep going back and forth on whether the trigger/cause distinction even holds up, and I'd rather the poem hold that uncertainty open than fake a conclusion. maybe the envoi, where all six words get crammed into three lines, is everything arriving at once in sarajevo, but you decide.

  one guy in the club knows what a sestina is so please actually follow the form properly (six stanzas of six lines plus a three-line envoi, correct rotation of the end-words). and someone else did a history degree years ago, so nothing that would make her wince.
