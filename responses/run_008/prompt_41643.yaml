  2.  **Understand the Two-Envelope Paradox:**
      *   Setup: Two envelopes, one contains $x$, the other $2x$. Total = $3x$.
      *   Player picks one (contains $A$).
      *   Argument: The other contains either $2A$ or $A/2$ with equal probability (0.5).
      *   Expected Value of other = $0.5(2A) + 0.5(A/2) = 1.25A$.
      *   Conclusion: Switching is better.
      *   Paradox: Since the situation is symmetric, you should switch back too. Infinite switching.
      *   Resolution: The variable $A$ cannot be the same value in both cases of the expectation calculation. If $A$ is the smaller amount, the other is $2A$. If $A$ is the larger amount, the other is $A/2$. You can't assume equal probability for all values of $A$ without a proper prior distribution. The total sum is fixed.

