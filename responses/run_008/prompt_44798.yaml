answer: |-
  **Essay Question**

  Consider the following exchange regarding the Liar Paradox. A student, Dana, argues that the Liar is harmless because truth is a property of propositions rather than sentences. On her view, the Liar sentence is grammatical but fails to express a proposition; thus, there is nothing for truth to attach to. When pressed with the revenge sentence ("This sentence does not express a true proposition"), Dana replies that this sentence also fails to express a proposition, licensing a principled division between sentences that express propositions and those that do not. She claims this boundary is fixed by "semantic dependency structure."

  Write an essay addressing the following:
  1.  Charitably reconstruct Dana's "propositions-first" move.
  2.  Explain precisely why the revenge sentence is structurally harder for her view than the original Liar.
  3.  Evaluate whether her appeal to "semantic dependency" is a genuine stopping point or merely relocates the paradox.
  4.  Discuss what this exchange teaches about the choice between hierarchical, gap, and revision-theoretic approaches. Specifically, does her position inherit the standard objection to gap theories (that they cannot explain why we can't say the Liar fails to be true), and how does this turn on the distinction between *denying* the Liar is true versus *asserting* it lacks content?

  ***

  **Model Answer**

  Dana's position constitutes a propositional gap theory. Charitably reconstructed, she argues that truth is a property of propositions, not sentences. The Liar sentence, while grammatical, is semantically defective; it fails to express a proposition, so truth never attaches. This avoids contradiction by removing the truth-bearer. However, this move invites revenge. Consider the sentence R: "This sentence does not express a true proposition." If R fails to express a proposition, then it is the case that R does not express a true proposition. But that is exactly what R says. So R seems to state a truth. If R states a truth, it expresses a proposition. But if it expresses a proposition, and says it doesn't express a true one, is it true or false? If true, it doesn't express a true proposition (contradiction). If false, it expresses a true proposition (contradiction). R is harder than the original Liar because it targets the *expressibility condition* itself, forcing Dana to claim her own explanatory sentence fails to express a proposition. This creates a pragmatic contradiction: she uses a sentence to argue that certain sentences express nothing.

  Dana appeals to "semantic dependency structure" to fix the boundary. This is vulnerable. If the boundary is sharp and definable, we can construct a sentence referencing it to regenerate paradox. If the boundary is vague or ineffable, the theory cannot explain *why* the Liar fails. This suggests the division merely relocates the paradox one level up: from truth to propositionhood. The structural problem remains; we have just changed the label on the undefined predicate. The "dependency" must itself be defined without invoking the problematic notions it seeks to constrain. Consequently, the appeal to dependency structure functions as a placeholder for a solution rather than a solution itself, masking the recursive nature of semantic evaluation.

  This inherits the standard objection to gap theories like Kripke's. In Kripke's fixed points, we cannot say within the language that the Liar is undefined. Similarly, Dana cannot say within her system that the Liar lacks a proposition without generating a new paradox. She faces a dilemma: either her theory is ineffable (she cannot state it without contradiction) or it requires a hierarchy (meta-language to discuss object-language failures). If she chooses hierarchy, she concedes to Tarski. If she chooses ineffability, she concedes silence. This connects directly to the course menu: she attempts a Kripkean gap but faces the Tarskian limitation on expressing the gap.

  The crucial distinction lies between denying the Liar is true and asserting it lacks content. To deny "L is true" presupposes L has a truth-value. Dana denies L has a truth-value. But to assert "L lacks a truth-value" is to make a true claim about L. If her language can express this claim, why can't it express the Liar? If it cannot, she cannot teach her theory. A competent answer notes the gap; a top answer recognizes that asserting the failure reintroduces truth at the meta-level, forcing a hierarchy she claimed to avoid. Dana saves consistency only by sacrificing the expressiveness required to formulate her own solution. The paradox is not solved but displaced to the meta-theory. Her view collapses into a hierarchy unless she accepts that her own theory cannot be truly stated.

  ***

  **Marking Scheme (25 Marks)**

  1.  **Reconstruction of Propositions-First View (5 marks)**
      *   *Must hit:* Clearly distinguishes sentences (vehicles) from propositions (truth-bearers) and identifies the Liar as failing to express the latter.
      *   *Common error:* Confusing this with a simple truth-value gap without addressing the propositional failure mechanism.

  2.  **Analysis of Revenge Sentence (5 marks)**
      *   *Must hit:* Explains that R targets the *condition* for truth-bearing, creating a contradiction if Dana claims R fails to express a proposition.
      *   *Common error:* Treating R as identical to the original Liar rather than showing how it targets the gap theory itself.

  3.  **Evaluation of Boundary Stability (5 marks)**
      *   *Must hit:* Argues that "semantic dependency" either invites new paradoxes (if definable) or renders the theory ineffable (if undefined), thus relocating the paradox.
      *   *Common error:* Accepting "semantic dependency" as a substantive explanation without critiquing its definability.

  4.  **Connection to Gap Theory Objections (5 marks)**
      *   *Must hit:* Identifies the dilemma: Dana must either adopt a hierarchy (Tarski) or accept ineffability (cannot state her own theory).
      *   *Common error:* Failing to link Dana's specific problem to the general inexpressibility objection against Kripkean gaps.

  5.  **Denying Truth vs. Asserting Failure (5 marks)**
      *   *Must hit:* Distinguishes between internal denial (presupposes truth-value) and external assertion (makes a true claim about failure), showing the latter reintroduces truth at the meta-level.
      *   *Common error:* Treating "The Liar is not true" and "The Liar expresses no proposition" as logically equivalent moves within the same language level.

  Crux: Recognizing that asserting the Liar's failure reintroduces truth at the meta-level.
