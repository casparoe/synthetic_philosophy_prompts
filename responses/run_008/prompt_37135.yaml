answer: |-
  This is a sharp diagnosis of a genuine bottleneck in the field. You are correct that the stalemate persists because both sides are talking past each other, but I disagree that it is purely metaphysical or merely verbal.

  Here is the diagnosis: **The disagreement is substantive, but it is mislabeled.** It is not a debate about ontology (what *exists*); it is a debate about **causal granularity and invariance.**

  ### 1. The Diagnosis: Causal Invariants vs. Epiphenomenal Coordinates

  The realist and anti-realist are not disagreeing about whether the math works. They are disagreeing about the **direction of fit** between the feature and the computation.

  *   **The Realist Claim:** The feature (e.g., the "dog direction") is a **causal invariant**. It is a variable in the model's internal algorithm. The model computes *using* this variable. If you perturb the rest of the activation space but hold this direction fixed, the "dog-ness" of the output should remain stable.
  *   **The Anti-Realist Claim:** The feature is a **convenient coordinate system**. It is a lossy compression we impose on the state space to make sense of it. The model does not compute *in* this basis; it computes in the full high-dimensional space, and we happen to be able to project a hyperplane that correlates with "dog."

  **Why this is substantive, not verbal:**
  If the realist is right, the feature should support **interchange interventions**. If you take the "dog direction" activation from Context A and swap it into Context B, the model should behave as if Context B contains a dog, *without* breaking unrelated computations.
  If the anti-realist is right, such interventions should be brittle. Steering the "dog direction" works because it correlates with the true causal state, but swapping it might break superpositioned features or interfere with downstream circuits that rely on the specific orthogonal noise you discarded.

  The debate feels metaphysical because "real" is a philosophical term, but in mechanistic interpretability, "real" cashes out as **robustness to causal intervention.** The stalemate exists because most papers demonstrate *correlation* (probes, SAE reconstruction loss) or *single-variable intervention* (steering), but rarely **causal abstraction** (swapping features between contexts to test modularity).

  ### 2. The Superposition Lever

  Your intuition about superposition is the strongest empirical argument against the anti-realist, and it deserves to be weaponized.

  The anti-realist argues that features are "projections of ours." But as you noted, **you cannot store a projection.** A projection implies a higher-dimensional space being mapped down. In superposition, the model is storing $N$ features in $M$ dimensions ($N \gg M$).

  For the model to compute successfully in superposition, it *must* be able to isolate and manipulate these features within the shared subspace. If the "dog feature" were merely a human projection, the model's downstream layers would not be able to reliably read it out amidst the interference of other features. The fact that the model *does* read it out implies that the **direction itself is computationally privileged.**

  The model is not computing in "neuron space" and we are projecting to "feature space." The model is computing in "feature space" and compressing it into "neuron space." Therefore, the features are more "real" (computationally fundamental) than the neurons. The anti-realist position collapses here unless they argue that the model is miraculously robust to interference without actually separating the features.

  ### 3. The Burden of Proof

  The burden of proof is currently asymmetrical, and it sits heavier on the **anti-realist.**

  *   **Realist Burden:** Demonstrate that a feature is not just correlated, but **causally isolated.** (This is hard, but doable via interchange interventions).
  *   **Anti-Realist Burden:** Explain **convergence.** Why do SAEs trained on different models, with different seeds, on different data slices, find roughly the same "dog direction"?

  If features are just "convenient stories we project," they should be idiosyncratic to the analyzer. But they are idiosyncratic to the *model architecture and data distribution.* The fact that independent training runs converge on similar feature subspaces implies there is a **loss landscape attractor** corresponding to that feature.

  The anti-realist owes an account of why the "fiction" is so consistently replicated across independent physical instantiations of the network. If it's just a human projection, it shouldn't transfer from Model A to Model B without retraining the probe. But we see zero-shot transfer of SAE features across model scales. That is empirical evidence of structure, not just projection.

  ### 4. Path to Progress

  The field should not pick a convention and stop litigating, because the stakes (alignment, safety) depend on the answer. If features aren't causally stable, steering is a safety risk. However, the field must stop using the word "real."

  **Progress requires shifting from Ontology to Control Theory.**

  1.  **Stop asking:** "Is this feature real?"
  2.  **Start asking:** "Is this feature an **Interventionally Stable Abstraction**?"

  **The Proposed Standard:**
  A feature counts as a valid unit of interpretation only if it passes a **Causal Interchange Test**.
  *   *Experiment:* Train an SAE on Model A. Identify feature $F$. Take an input $X$ that does not trigger $F$. Take an input $Y$ that does trigger $F$. Swap the activation of $F$ from $Y$ into the run of $X$.
  *   *Success Criterion:* The output of $X$ changes specifically in ways related to $F$, *without* degrading perplexity or breaking unrelated features (e.g., grammar, tone, other facts).

  If the anti-realist says, "That's just a useful correlation," the response is: "It is a correlation that supports causal substitution." In engineering, that is the definition of a component.

  **Conclusion:**
  The disagreement is a **category error about levels of abstraction.** The anti-realist is demanding neural-level realism (one neuron = one feature) while the realist is proposing algorithmic-level realism (one direction = one variable).

  Because of superposition, the algorithmic level is the only one that makes sense. The progress path is to formalize **Causal Abstraction** as the gatekeeper for interpretability claims. If a feature cannot survive an interchange intervention, it is a "convenient story." If it can, it is a "mechanistic variable." That is an empirical distinction, not a metaphysical one, and it resolves the debate by rendering the ontology irrelevant.
