prompt: |-
  Hi! Novelist here, wrestling with something fun. I'm writing a book where one of the minor characters is basically a fictionalized Bernard Williams — the philosopher — an English public intellectual type who cared way too much about opera, wrote a handful of essays on Figaro and the like (they got collected after his death in 2003 in that little book On Opera). My plot needs him transported to today and I have to write his reactions, so help me get the philosophy right before I get the prose right.

  The opera world has basically reinvented itself since he died and I want to know how this guy would actually respond, working from his real views, not just vibes. Concretely:

  1. Opera in cinemas. Since around 2006 you can watch the Met live in HD at your local multiplex — cameras swooping over the stage, close-ups of singers mid-aria, an intermission host interviewing the soprano while she's still in costume. Would he count this as seeing opera at all, given how much he thought about opera as a form with its own strange reality — people singing what they can't say? Or would the intimacy of the close-up actually deepen it?

  2. Surtitles everywhere. His generation had to choose: understand the words or hear the music properly, and a lot of them sneered at translations projected above the stage. My guess is he'd be torn — he obviously cared about the drama and the words, but also knew nobody goes to Figaro to read. What's the principled position here rather than just grumpiness?

  3. Regietheater going nuclear. Directors updating settings, killings, rapes, alien spacecraft. He was no traditionalist about productions as far as I can tell, but he also had this idea that opera's stories are mythic or ritual-like rather than realistic. So when a director insists on making everything psychologically "real" and contemporary — is there a Williams-style argument that this misses the point of the form itself?

  4. The one I can't figure out at all: streaming and the algorithm. Opera on demand, playlists of "greatest arias," the whole thing flattened into content. He wrote about how opera is a cultural artifact with literary and philosophical implications, not just gorgeous noise. Does the碎片化 — sorry, the fragmenting of opera into excerpts — actually undermine the thing he valued, or was the full-evening experience never the point?

  Also: he had strong views about how Verdi and Wagner pull in opposite directions as dramatists. Would any of the above hit differently depending on whose opera it is? I feel like cinema-close-ups might be fine for Verdi's momentum but weird for Wagner, but maybe I have that backwards.

  Don't just give me "he'd probably disapprove because old man." Trace the reasoning from things he actually cared about. And where you're extrapolating beyond what he ever wrote, flag it so I know which parts of my character's opinions are invented. Thanks!
