          *   **Verdi vs. Wagner:** Verdi = humanism, clarity, momentum, the music serves the dramatic situation (mostly). Wagner = mythology, endless melody, the music swallows the drama, psychological depth via orchestration.
          *   **Production:** He disliked "concept" productions that ignored the internal logic of the work, but wasn't a "period instrument/frock" traditionalist. He wanted the production to serve the *work's* reality, not the director's ego.
