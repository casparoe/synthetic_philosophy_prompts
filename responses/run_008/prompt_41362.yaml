answer: |-
  ### Part I: Brainstorm and Discards

  Before settling on the final criteria, several candidate desiderata must be weighed and often discarded. The goal is to separate methodological necessities from school-specific preferences.

  1.  **Predictive Capacity:** *Discarded.* Demanding that a historical explanation could have predicted the event confuses history with prophecy. Historical explanation is retrodictive. While an explanation should imply that the event was *possible*, requiring ex-ante predictability imposes a covering-law model that fails for singular, complex events (e.g., the specific timing of the Berlin Wall's fall). This is a camp prejudice of positivist social science, not a general requirement.
  2.  **Total Evidential Coverage:** *Discarded.* Requiring that an explanation account for all available evidence is impossible due to the fragmentation of the historical record. An explanation is adequate if it accounts for the *relevant* evidence, not *all* evidence. This is an impossible standard that would halt all inquiry.
  3.  **Agent-Neutrality:** *Discarded.* Some schools (e.g., structuralism, Annales) distrust individual agency, while others (e.g., traditional narrative) center it. An adequate method must allow for both structural causes and intentional actions. Excluding either is a camp prejudice.
  4.  **Moral Neutrality:** *Discarded.* While moral judgment is distinct from causal explanation, demanding that explanations be stripped of all normative context often renders them unintelligible (e.g., explaining the Holocaust without reference to antisemitic ideology). However, moral *condemnation* cannot substitute for causal *mechanism*. This is a boundary condition, not a primary desideratum.
  5.  **Mechanism Specification:** *Retained.* An explanation must specify the channel by which a cause produced an effect, not just correlate them.
  6.  **Independence from Outcome:** *Retained.* The identification of causes must not depend on knowing the effect.

  ### Part II: The Desiderata for Historical Causal Explanation

  Here are the non-negotiable requirements for an explanation to count as genuine rather than retrospective storytelling.

  **1. The Temporal Independence Constraint**
  *   **Requirement:** The evidence cited as a cause must be identifiable and significant *without* knowledge of the outcome. The status of a document, speech, or economic indicator as a "cause" cannot rely on the fact that the event subsequently occurred.
  *   **Motivating Case:** Consider the outbreak of the First World War. If a historian cites the assassination of Archduke Franz Ferdinand as a primary cause, they must show that contemporaries viewed this as a destabilizing event of unique magnitude *at the time*, not just because we know war followed. If they only highlight this event because war followed, while ignoring other assassinations that did not lead to war, they are exploiting hindsight.
  *   **Status:** **Non-negotiable.** Without this, the explanation is merely a post-hoc linkage, indistinguishable from superstition.

  **2. The Asymmetry of Support (Anti-Re-description)**
  *   **Requirement:** The explanation must provide support for the actual outcome that it would *not* provide for the opposite outcome. If the same set of facts and logic could be used to explain why the Western Roman Empire *survived* just as easily as why it *collapsed*, the explanation is a re-description, not a causal account.
  *   **Motivating Case:** A historian explains the Fall of Rome by citing "moral decay and bureaucratic bloat." If these conditions existed during periods of Roman stability and expansion (which they did), then this explanation fails the asymmetry test. It describes the background conditions but does not distinguish the moment of collapse from moments of resilience.
  *   **Status:** **Non-negotiable.** This is the logical core of causality. If $C$ explains $E$, $C$ must make $E$ more probable than not-$E$.

  **3. The Contingency Acknowledgement**
  *   **Requirement:** The explanation must identify points of fragility where the outcome could have been diverted by small changes. It must distinguish between necessary conditions and sufficient triggers.
  *   **Motivating Case:** In explaining the fall of the Berlin Wall, an account that treats the collapse as the inevitable result of long-term economic stagnation fails if it cannot account for why the wall fell on *that* night and not five years earlier. An adequate explanation must isolate the specific press conference error or the local commander's decision that acted as the trigger, distinguishing the "fuel" (stagnation) from the "spark" (contingency).
  *   **Status:** **Non-negotiable.** This guards against teleology (the idea that history was moving toward a specific end regardless of events).

  **4. The Mechanism Specification**
  *   **Requirement:** The explanation must describe the process connecting cause and effect, not just assert a correlation. It must answer "how," not just "why."
  *   **Motivating Case:** Claiming "economic inequality caused the French Revolution" is insufficient. The mechanism must detail how inequality translated into mobilization: e.g., through the specific failure of the tax system to fund the state, leading to the calling of the Estates-General, which created a platform for dissent. Without the mechanism, "inequality" is a label, not an explanation.
  *   **Status:** **Non-negotiable.** This distinguishes historical science from poetic association.

  ### Part III: Weighing the Candidate Desiderata

  **1. The Twin-Outcome Test**
  *   **Weight:** **High, but Regulative.**
  *   **Analysis:** This test demands that the historian specify what evidence would have led them to predict the non-occurrence of the event. While logically sound (it enforces the Asymmetry of Support), it is practically difficult for singular historical events. Historians cannot run controlled trials. However, as a *regulative ideal*, it is essential. If a historian cannot articulate what would have sustained the status quo (e.g., "If the Kaiser had not authorized the blank check, war would have been localized"), their explanation of the war is weak.
  *   **Verdict:** It is a non-negotiable logical requirement for causal claims, even if historical practice often fudges it. An explanation that cannot conceive of its own falsification is dogma.

  **2. Narrative Economy**
  *   **Weight:** **Suspicious / Potential Vice.**
  *   **Analysis:** The demand for a "good story"—sequential, focused, with a climax—is often the engine of the narrative fallacy. Real history is messy, multi-causal, and anti-climactic. Requiring narrative economy forces the historian to prune contingent details that might disrupt the arc but are causally relevant.
  *   **Verdict:** This should **not** be a desideratum for *truth*, though it may be a desideratum for *communication*. Prioritizing narrative economy risks sacrificing accuracy for intelligibility. It is a camp prejudice of traditional narrative history to treat this as a virtue of explanation rather than a virtue of rhetoric.

  ### Part IV: Joint Unsatisfiability (The Core Tension)

  There is a fundamental tension between **Intelligibility** and **Probative Validity**.

  *   **The Conflict:** To satisfy the reader's need for understanding (Intelligibility), an explanation usually requires a coherent narrative arc with clear agents and decisive moments. However, to satisfy the methodological requirement of Hindsight Immunity and Contingency (Probative Validity), the explanation must acknowledge loose ends, multiple overlapping causes, and the role of chance.
  *   **The Result:** A perfectly intelligible story tends to look inevitable (violating the Contingency Acknowledgement). A perfectly rigorous causal account tends to look like a fragmented list of factors (violating the demand for Narrative Economy).
  *   **Implication:** You cannot maximize both. The historian must choose between a persuasive story that risks hindsight bias and a rigorous account that risks being unreadable. The "Twin-Outcome Test" exacerbates this: specifying the conditions for the *non-occurrence* of a famous event often undermines the narrative flow of the event itself. This tension is not a problem to be solved, but a structural feature of historical writing that must be managed.

  ### Part V: Brief Evaluation of Accounts

  **Covering-Law Account**
  *   **Performance:** Fails on **Contingency Acknowledgement** and **Temporal Independence**. By subsuming events under general laws (e.g., "revolutions occur when X meets Y"), it often ignores the singular mechanisms and specific triggers of the event. It satisfies **Asymmetry** logically but often fails empirically because the "laws" are too vague to rule out the opposite outcome in specific cases.

  **Counterfactual Account**
  *   **Performance:** Excels at the **Twin-Outcome Test** and **Asymmetry of Support** by explicitly modeling the alternative. However, it struggles with **Mechanism Specification** if it relies on abstract modeling rather than archival detail. It risks violating **Temporal Independence** if the counterfactuals are constructed using knowledge of the actual outcome to tailor the "near miss."

  **Plain Narrative Account**
  *   **Performance:** Excels at **Intelligibility** but fails **Hindsight Immunity** and **Narrative Economy** (as a vice). It naturally compresses sequences into arcs, inviting the narrative fallacy. It often struggles with the **Twin-Outcome Test** because narratives are typically linear and deterministic, making it difficult for the author to show how the story would have differed had the ending changed.
