  I'm taking political philosophy this semester and we just finished the patriotism unit, and now I have to write a short paper laying out my actual view, so before I start I want a sanity check on wether my positions even fit together. Here's roughly what I beleive:

  (1) Patriotism is a virtue — love of and loyalty to your country, roughly the way you love a sibling or an old friend: not because they're the best person, just because they're yours.
  (2) Cosmopolitanism: every person's interests count the same no matter what passport they hold, and there's nothing morally deep about borders.
  (3) We do have special obligations to compatriots, but they're grounded in reciprocity — we're all part of one big cooperative scheme, we benefit from it, so we owe each other its upkeep — not in compatriots being "ours."
  (4) In charitable giving it's wrong to favor your compatriots over foreigners who are much worse off; the money should go where it helps most.
  (5) I'm still glad my government taxes me to fund healthcare and schools for my compatriots even when that money would help people abroad more, and I don't think that's the same mistake as (4).
  (6) A patriot's loyalty should survive their country doing bad things — you don't stop loving your brother when he screws up — and sometimes standing by your country while it's in the wrong is part of the virtue, not a failure of it.

  Something about this package feels off to me but I honestly can't see which part. Give me exactly five numbered points, each one or two sentences, no intro or conclusion: points 1–3 should be the three worst tensions ranked by severity, saying for each what would have to give; point 4 should be the pair that only looks like a contradiction but actually dissolves on inspection, and say why it dissolves; point 5 should be the single cheapest revision that would clean up the most.
