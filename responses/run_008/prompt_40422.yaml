  2. Claiming loyalty should survive wrongdoing in (6) directly violates the equal moral worth principle in (2) when your country harms foreigners. You must either limit loyalty when justice is breached or concede that borders create moral exemptions.
  3. Asserting patriotism is a virtue in (1) implies permissible partiality, yet (4) demands strict impartiality in charitable allocation, leaving the virtue practically toothless. You must either allow some partiality in giving or reclassify patriotism as a private feeling rather than an actionable virtue.
  4. The tension between favoring compatriots in taxation (5) but not charity (4) dissolves because state institutions have specific contractual obligations that individuals lack. Private aid addresses global need, whereas tax funding fulfills a specific reciprocal scheme of justice.
  5. Modifying (6) to say loyalty requires correcting your country's wrongs rather than standing by them aligns patriotism with cosmopolitan justice without abandoning special obligations. This single change resolves the moral conflict with (2) while preserving the emotional core of (1).
