      *   *Respect:* Ensure the Catholic faith isn't treated as superstition and the Atheism isn't treated as coldness.

      *(Self-Correction during drafting)*: I need to be careful not to make the grandfather sound *too* cold/economic. The trade must be emotional too. The "currency" isn't just money, it's wisdom, stability, challenge.
      *Also, avoid saying "all beliefs are valid." Instead, say "their beliefs were real, and the friction was real."

