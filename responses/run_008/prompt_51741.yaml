          2.  Level of evaluation for rationality (acts vs. dispositions vs. policies).
          3.  "Rational Irrationality" as coarse temporal grain vs. illegitimate decision point notion.
      *   **Task 5:** Reach a definite verdict on the *original* scenario (no diary).
      *   **Task 6:** Distinguish between framework-dependent and framework-neutral aspects of the answer.
