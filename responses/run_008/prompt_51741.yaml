  2.  **Deconstruct the Core Philosophical Problem:**

      *   *Parfit's Hitchhiker* is a classic Newcomb-like problem (specifically, a Prisoner's Dilemma with prediction, or more accurately, a coordination problem involving trust and prediction).
      *   *CDT (Causal Decision Theory):* Focuses on causal consequences. Once in the city, paying causes loss of money with no causal benefit (driver already drove). CDT says *don't pay*. But if the driver knows you are CDT, she won't stop. So CDT agents die in the desert.
      *   *EDT (Evidential Decision Theory):* Focuses on correlations. Paying is evidence that you are the kind of person who keeps promises, which is evidence that the driver would have stopped. EDT says *pay*.
      *   *TDT/UDT (Timeless/Updateless Decision Theory):* Focuses on the output of the decision algorithm. You should act as if you are choosing the output of the algorithm that determines both your past prediction and your current action. TDT says *pay*.
      *   *The "Rational to be Irrational" angle:* It seems irrational to pay (causally useless), but being the *type* of person who pays is rational (gets you saved). Hence, "rational irrationality."

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Define the Hitchhiker problem. State the thesis. (Thesis: It is rational to pay, because rationality must account for the predictability of agency, not just immediate causal leverage.)
