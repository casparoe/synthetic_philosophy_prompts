answer: |-
  # The Logic of the Promise: Rationality, Prediction, and the Hitchhiker

  The question of whether it can be rational to be irrational strikes at the heart of decision theory. It suggests a paradox: that maximizing expected utility might require adopting a disposition to perform actions that, in the moment, appear to minimize it. Nowhere is this tension more vivid than in Derek Parfit's Hitchhiker problem. To resolve it, we must look beyond the isolated moment of choice and examine the architecture of agency itself.

  ### The Desert Road: The Standard Setup

  Imagine a hitchhiker stranded in a deadly desert. A driver approaches, capable of saving him, but she is psychologically egoistic: she will only offer a ride if she predicts the hitchhiker will pay her $100 once they reach the city. She is an excellent judge of character, accurate 99% of the time. The hitchhiker, desperate, promises to pay. The driver, predicting he will keep the promise, stops and drives him to safety.

  Once in the city, the dynamic shifts. The hitchhiker is safe. The driver has no power to return him to the desert. Causally, the money is now his to keep or give. If he pays, he is $100 poorer and gains nothing new (he is already alive). If he keeps the money, he is $100 richer and suffers no penalty. The driver's decision is in the past; it is fixed. From the perspective of the moment of payment, paying is causally futile.

  ### The Case for Payment

  Despite the causal futility, the hitchhiker should pay. To argue otherwise is to accept a definition of rationality that guarantees failure in prediction-rich environments.

  The strongest opposing argument comes from Causal Decision Theory (CDT). The CDT proponent argues that rationality is about maximizing the causal consequences of one's actions *at the time of decision*. Once in the city, the rescue is a sunk cost. The driver's prediction is a fact of the past, unalterable by the hitchhiker's current wallet. Therefore, paying causes a loss of utility with no compensating causal benefit. To pay is to throw away money for no reason; a rational agent maximizes their actual state, not their counterfactual reputation.

  This argument is compelling because it aligns with our intuition that we cannot change the past. However, it relies on a fragmented view of the agent. It treats the "hitchhiker in the desert" and the "hitchhiker in the city" as distinct agents rather than temporal stages of the same decision-making algorithm. If rationality is the art of winning, an agent who reasons according to CDT will be predicted as a defector. The driver will not stop. The CDT agent dies in the desert to save $100 they never get to spend.

  Therefore, paying is rational because the hitchhiker's action in the city is logically correlated with the driver's prediction in the desert. The hitchhiker is not merely choosing to lose $100; he is validating the prediction that saved his life. To refuse to pay is to retroactively make the driver's decision irrational, which implies the hitchhiker's own prior promise was a lie. A rational agent must view their choice as the output of a type. If the type "promise-keeper" gets rescued and the type "promise-breaker" dies, rationality demands identifying with the former, even when the local causal leverage seems absent.

  ### The Diary Hitchhiker

  This abstraction becomes concrete in the "Diary Hitchhiker" variant. Here, the hitchhiker keeps a public, timestamped diary recording his sincere intentions for future situations. Motorists in this region read these diaries before offering rides. The hitchhiker wrote, under a general entry about promises made under duress, that he would pay. The driver read this entry and stopped. Now in the city, the hitchhiker faces the same choice: pay or keep the money.

  This variant forces us to address three specific questions regarding the nature of rationality.

  **1. Causal vs. Evidential Convergence**
  In the standard case, CDT and EDT diverge. CDT says don't pay (no causal impact); EDT says pay (paying is evidence you are the type who gets rescued). Does the diary bridge this gap?

  The diary transforms the evidential link into a causal chain. By writing the diary, the hitchhiker performed a causal act that influenced the driver. However, the diary's efficacy depends on its reliability. If the hitchhiker does not pay, the diary entry becomes a record of a lie or a failure of will, destroying the causal power of the diary for *future* interactions. But even for *this* interaction, the diary creates a causal dependency between the *current act* and the *past entry's sincerity*.

  If the agent views the diary as a pre-commitment device, CDT and EDT converge. A sophisticated CDT agent recognizes that the decision to pay is part of the same causal chain initiated by the diary entry. To write "I will pay" sincerely requires the intention to pay. If the agent knows they will not pay, they cannot sincerely write it, and thus they would not have been rescued. Therefore, the act of paying is causally necessary to validate the sincerity of the prior cause (the diary entry) that produced the rescue. The diary shows that when agents can shape the evidence their future acts constitute, the distinction between "causing an outcome" and "being evidence of an outcome" dissolves. The act *is* the mechanism by which the past prediction was made viable.

  **2. The Level of Evaluation**
  If keeping the diary is rational, but paying in the city appears causally irrational, where does rationality reside? Is it in individual acts, standing dispositions, or policies?

  The diary variant demonstrates that evaluating individual acts in isolation is a category error. The "act" of paying is merely the execution of a "policy" established when the diary was written. Rationality is properly evaluated at the level of **policies chosen in advance**. The grounds for this are pragmatic: the policy level is the locus of control over predictions. The driver does not predict the atomistic twitch of the hand handing over cash; she predicts the stability of the agent's policy. If we evaluate rationality only at the moment of payment, we sever the link between the agent's long-term strategy and their immediate behavior. The diary makes explicit what is implicit in the standard case: the rational unit of agency is the extended self, not the instantaneous self.

  **3. Temporal Grain and the Decision Point**
  Does this support the idea that "rational irrationality" is just rationality at a coarser temporal grain? Or does it reveal that the "single decision point" is illegitimate?

  The variant supports the latter. The notion of a single, well-defined decision point in the city is doing illegitimate work. It assumes that the agent's identity resets upon arrival. The diary shows that the decision point was actually *when the entry was written*, or more accurately, it is a distributed process spanning the writing and the fulfillment. "Rational irrationality" is a misnomer born of zooming in too close. It is not that it is rational to be irrational; it is that what looks irrational at the temporal grain of the *payment* is rational at the temporal grain of the *agency*. The debate often stalls because CDT insists the decision point is the moment of causal leverage, while EDT/TDT insists it is the moment of logical correlation. The diary reveals the decision point is wherever the agent's policy is susceptible to optimization.

  ### The Verdict

  Returning to the original scenario—no diary, no public record, just a stranded man and a promise—should the hitchhiker pay?

  **Yes, the hitchhiker should pay.**

  This verdict does not depend entirely on adopting a specific decision-theoretic framework like Evidential Decision Theory or Timeless Decision Theory, though those frameworks articulate the logic more naturally. The verdict survives framework-neutral scrutiny because it rests on the pragmatics of agency.

  Any agent who knows they will face such problems must ask: "What kind of agent do I need to be to survive?" If the answer is "an agent who pays," then the rational action is to pay. To argue otherwise is to claim that an agent can rationally choose to be the kind of person who dies in the desert. Even a Causal Decision Theorist, if allowed to self-modify before entering the desert, would modify themselves to become a promise-keeper. Since the hitchhiker in the city is the same agent who would have self-modified, consistency demands he act according to that modification.

  The framework-dependent element is merely the *explanation*. A CDT proponent must invoke "disposition selection" or "pre-commitment" to justify the payment, admitting that the isolated act is suboptimal but the strategy is optimal. An EDT or TDT proponent argues the act itself is optimal because it correlates with or determines the rescue. However, the *conclusion* is framework-invariant: an agent who keeps the money is an agent who fails to secure the benefits of cooperation in a transparent world.

  Rationality is not about maximizing utility in a vacuum; it is about maximizing utility in a world where you are known. To keep the money is to assert that your current desire outweighs the logical conditions of your own survival. That is not rationality; it is myopia. The hitchhiker must pay, not because the money buys his safety now, but because paying is the price of being the sort of person who gets saved.
