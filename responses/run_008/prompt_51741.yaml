      *   **Question 3 (Temporal Grain/Decision Point):** Is "rational irrationality" just looking at a longer timeline? Or is the "decision point" illusion? The diary suggests the decision point isn't *in the city*, it was *when writing the diary* (or generally, when forming the character). The single decision point is the illegitimate notion.
      *   **Verdict on Original:** Should the original hitchhiker pay? Yes. Even without the diary, the logic of predictability applies. You are effectively predicting yourself.
      *   **Framework Dependence:** How much depends on CDT vs. TDT? The *conclusion* (pay) is robust across EDT/TDT, but CDT rejects it. However, a sophisticated CDTer would pre-commit. So the *practical verdict* survives if we allow for self-modification/disposition formation. I need to be firm here.

