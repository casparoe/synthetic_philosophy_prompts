          *   *Assessment:* **False.** Rawls engaged with Sen, and Sen critiqued Rawls (primary goods = resources), but Rawls *never* revised his theory to adopt the Capability Approach. Rawls stuck with Primary Goods. This is a factual error regarding the history of political philosophy.
          *   *Verdict:* Factually incorrect.

