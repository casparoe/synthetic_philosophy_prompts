          *   *Assessment:* **Major Error.** This is the "looks right but isn't" trap. Sen explicitly argues against the resource view *because* of conversion factors. He argues that focusing on resources (means) misses the point of freedom/opportunity (ends). While capabilities *involve* conversion factors, saying the views "collapse into one" and the choice is "mostly pragmatic" fundamentally undermines Sen's philosophical critique. Sen argues resources are fetishistic; capabilities are constitutive of freedom. They are distinct metrics, not just pragmatic variations of the same thing.
