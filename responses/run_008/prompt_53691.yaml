answer: |-
  # The Job Description for Self-Deception: A Specification of Desiderata

  To determine whether self-deception is coherent, we must first specify what a theory of it is required to explain. A successful account cannot merely define the term; it must accommodate the specific phenomenology of the self-deceived agent while respecting conceptual boundaries that separate self-deception from neighboring mental states. Below are the desiderata any adequate theory must satisfy, organized by the phenomena they must capture and the distinctions they must preserve.

  ## I. Phenomenological Desiderata
  *The theory must explain the following five features of the self-deception case without explaining them away.*

  **1. The Asymmetry of Scrutiny (The Spouse/Friend Case)**
  *   **Requirement:** The theory must explain how an agent applies rigorous epistemic standards to others while suspending them for themselves regarding a specific proposition.
  *   **Motivating Case:** The husband who interprets his spouse's unexplained absences and coldness charitably ("She's just stressed"), yet offers brutally clear-eyed advice to a friend in the identical situation ("She's definitely cheating").
  *   **Constraint:** The account cannot attribute this to a general lack of evidence. The evidence is identical; the processing is selectively biased by motivation.

  **2. Active Evidence Management (The Avoidance Case)**
  *   **Requirement:** The theory must account for strategic behaviors aimed at preventing the acquisition or consolidation of threatening evidence.
  *   **Motivating Case:** The agent never opens the test results, or actively steers conversation away from the topic when it arises.
  *   **Constraint:** Self-deception cannot be modeled as a passive cognitive glitch. It involves active, goal-directed avoidance that suggests the agent treats the truth as a threat to be managed.

  **3. Doxastic Resilience (The Mounting Cost Case)**
  *   **Requirement:** The theory must explain why the belief persists even as the pragmatic or epistemic costs of being wrong increase significantly.
  *   **Motivating Case:** The agent maintains the belief despite mounting evidence and negative consequences (e.g., financial ruin, social isolation) that would typically force a belief revision in a non-deceived agent.
  *   **Constraint:** The account cannot treat the belief as a tentative hypothesis. It functions as a settled conviction resistant to standard Bayesian updating.

  **4. The "Deep Down" Avowal (The Quasi-Knowledge Case)**
  *   **Requirement:** The theory must accommodate reports where the agent claims, "I knew it all along, really," suggesting a state between full belief and full ignorance.
  *   **Motivating Case:** Upon confrontation, the agent admits they had suspicions but "didn't want to face it."
  *   **Constraint:** The account cannot posit total ignorance. Some access to the truth must be preserved to make sense of the admission, yet not so much access that it counts as conscious belief during the deception.

  **5. The Normative Sting (The Exposure Case)**
  *   **Requirement:** The theory must explain why exposure elicits anger, shame, or embarrassment rather than simple surprise or correction.
  *   **Motivating Case:** When the deception is revealed, the agent reacts with the shame of a norm-violator, not the "oops" of someone who made an honest mistake.
  *   **Constraint:** This is crucial. It implies the agent is *responsible* for the state. A theory that reduces self-deception to a mere mechanical error (like a visual illusion) cannot explain the shame.

  ## II. Conceptual Distinctions
  *The theory must not collapse self-deception into these neighboring categories.*

  **1. Versus Wishful Thinking**
  *   **Requirement:** Must distinguish between *desiring* $p$ and *believing* $p$.
  *   **Motivation:** In wishful thinking, I know I want $p$ but acknowledge $\neg p$ is likely. In self-deception, I actually come to believe $p$. The theory must explain how desire converts into doxastic commitment.

  **2. Versus Akrasia (Weakness of Will)**
  *   **Requirement:** Must distinguish between acting against belief and believing against evidence.
  *   **Motivation:** The akratic agent eats the cake believing it will ruin their diet. The self-deceived agent eats the cake believing it *won't* ruin their diet. The locus of failure must be epistemic, not merely practical.

  **3. Versus Cold Cognitive Bias**
  *   **Requirement:** Must distinguish between motivation-independent errors and motivation-driven errors.
  *   **Motivation:** In cold bias (e.g., availability heuristic), nothing is at stake for the believer. In self-deception, the bias serves a specific emotional or psychological need (e.g., preserving self-esteem or a relationship).

  **4. Versus Trying to Believe**
  *   **Requirement:** Must distinguish between the *process* of indoctrination and the *state* of belief.
  *   **Motivation:** I can try to believe I am confident while knowing I am not. Self-deception requires that the attempt succeeds, at least temporarily. The agent must actually hold the belief, not just strive for it.

  ## III. Borderline Requirements: Positions Taken

  **1. The Truth Condition: Can one self-deceive into a truth?**
  *   **Position:** **No, falsity is not required.**
  *   **Reasoning:** If self-deception is a critique of the *process* of belief formation, the truth value of the outcome is incidental. If a husband suspects his wife is cheating, avoids evidence to spare his feelings, and she *is* actually cheating, he has still engaged in the same epistemic vice as if she were faithful. To make SD contingent on falsity is to make the mental architecture dependent on external luck. A theory of SD must condemn the *management of evidence*, not just the error.

  **2. The Intentionality Condition: Must the process be intentional?**
  *   **Position:** **Yes, but sub-intentionally.**
  *   **Reasoning:** Purely non-intentional accounts (mere bias) fail the "Normative Sting" desideratum (shame requires agency). Purely intentional accounts (conscious plotting) fail the "Ignorance" desideratum (you can't deceive yourself if you know you're doing it). The intention must be *strategic but opaque*. The agent intends to avoid pain, and the mind executes a strategy to avoid evidence, but the connection between the strategy and the belief formation is hidden from the conscious subject.

  ## IV. The Central Tension: Intentionality vs. Ignorance

  **The Conflict:**
  There is a genuine, non-dissolving tension between the requirement that the process be **agential/intentional** (to satisfy the Responsibility/Exposure desideratum) and the requirement that the agent be **genuinely ignorant** of the truth (to satisfy the Asymmetry and Avowal desiderata).

  **Analysis:**
  If the agent intentionally deceives themselves, they must know the truth to deceive themselves about it. If they know the truth, they are not deceived. This is the Static Paradox of Self-Deception.
  *   **Does it dissolve?** No, not if we assume a unitary, synchronic subject. If the mind is a single "I" at time $t$, the paradox holds.
  *   **Resolution:** The tension forces the theory to abandon the unitary subject model. To satisfy both desiderata, the theory must posit either **temporal partitioning** (I know the truth at $t_1$, hide it from myself at $t_2$) or **structural partitioning** (one subsystem knows, another believes). A theory that insists on a fully unified consciousness *cannot* meet the desiderata.

  ## V. The Knockout Criterion

  **The Single Requirement:** **The Normative Sting (Responsibility for Ignorance).**

  **Why:** This is the hardest hurdle.
  *   **Cold Bias theories** fail here immediately: One feels no shame for having a blind spot or a heuristic error. If SD is just bias, the shame is irrational.
  *   **Strong Intentionalist theories** fail here too: If I consciously lied to myself, I shouldn't be surprised or ashamed upon exposure; I should admit the lie.
  *   **The Knockout:** A theory must explain how an agent is *culpable* for a belief they genuinely hold to be *true*. It requires a mechanism of agency that operates without conscious authorization. This eliminates any theory that relies solely on standard rational updating (deflationary) and any theory that relies on conscious lying (classical intentionalism).

  ***

  ## VI. Brief Scorecard: Two Contenders

  **1. Deflationary Account (e.g., Alfred Mele)**
  *   **Mechanism:** Self-deception is ordinary motivated bias. The agent desires $p$, which triggers cognitive mechanisms (salience, evidence weighting) that produce belief $p$ without any intention to deceive.
  *   **Performance:**
      *   *Passes:* Asymmetry, Avoidance (as selective attention), Cold Bias distinction.
      *   *Fails:* **The Normative Sting.** If I am merely the victim of a bias I didn't intend, why do I feel shame upon exposure? Mele's agent is a cognitive casualty, not a norm-violator. It also struggles with the "I knew it all along" avowal, as there is no "knowing" subsystem, just skewed processing.
  *   **Verdict:** Coherent, but explains away the distinctively *moral/agency* feel of self-deception.

  **2. Partitioning Account (e.g., Davidson / Sartre)**
  *   **Mechanism:** The mind is divided. One subsystem (the Deceiver) knows $\neg p$ and manages information to ensure another subsystem (the Deceived) believes $p$.
  *   **Performance:**
      *   *Passes:* **The Normative Sting** (the Deceiver is responsible), **Intentionality vs. Ignorance** (resolved via division), **Avowals** (the truth is available to part of the mind).
      *   *Fails:* **Ontological Parsimony.** It risks positing homunculi (little men inside the head). It also struggles to explain the *unity* of consciousness—why don't I feel like two people? Sartre's "Bad Faith" attempts to solve this by making the division a fluid project of consciousness, but this risks returning to the paradox.
  *   **Verdict:** Captures the phenomenology of responsibility and ignorance best, but at the cost of a fragmented model of the self.

  **Conclusion:** The Deflationary account saves the unity of the self but loses the agency required for shame. The Partitioning account saves the agency but fractures the self. The desiderata suggest that self-deception is only coherent if we accept that the human mind is not a unitary agent, but a coalition of competing subsystems where responsibility can exist without conscious admission.
