answer: |-
  You have remembered your epistemology correctly, and you have correctly identified why the newsroom fights are happening. Your reporters are implicitly arguing from **Subject-Sensitive Invariantism** (the subject had enough evidence to act, given *their* stakes), while your lawyers are arguing from **Contextualism** (the standards for asserting "knowledge" rise when *we* publish it to the world, given *our* stakes).

  When a reporter says, "But look at the memo," they are saying the subject's epistemic threshold was met. When a lawyer says, "But we can't prove intent," they are saying the attributor's (our) threshold for liability is not met. Both are right. A "knew" headline asserts a bridge between the two.

  Here is the decision procedure. It is designed to be printed and kept on the copy desk.

  ***

  # The "Knew" Attribution Protocol
  **Time Limit:** 10 Minutes
  **Goal:** Determine if "knew" is epistemically sound and legally defensible.

  ### Phase 1: The Subject's Evidence (The "Justification" Check)
  *This addresses the Subject-Sensitive view: Did the subject have enough evidence to count as knowledge in their own context?*

  **1. Is there a direct admission?**
  *   **Yes:** (e.g., deposition testimony, signed confession). → **Proceed to Phase 2.**
  *   **No:** → **Go to Q2.**

  **2. Is there a contemporaneous document stating the fact as true?**
  *   **Yes:** (e.g., internal memo saying "The dam is failing"). → **Proceed to Phase 2.**
  *   **No:** (e.g., data that *implies* failure, ambiguous studies, verbal warnings). → **STOP.** "Knew" is likely unsupported. Use fallback: *"was warned," "saw data suggesting," "was alerted."*

  **3. Did the subject act on the information as if it were true?**
  *   **Yes:** (e.g., they hid the report, fixed the pipe secretly, priced in the risk). → **Proceed to Phase 2.**
  *   **No:** (e.g., they ignored it, filed it away, continued business as usual without concealment). → **STOP.** This suggests they may not have treated it as "known." Use fallback: *"received information," "was briefed."*

  ### Phase 2: The Subject's Stakes (The "Pragmatic" Check)
  *This addresses the Subject-Sensitive view: High stakes require higher evidence for the subject to claim they "knew."*

  **4. What was the cost to the subject if they accepted this as true?**
  *   **Low/Medium:** (e.g., minor inconvenience, small cost). → **Proceed to Phase 3.**
  *   **High:** (e.g., bankruptcy, criminal liability, career end, massive recall). → **Raise the bar.** If the cost was this high, human psychology often defaults to denial. Do we have *irrefutable* proof they overcame denial?
      *   **If Yes:** → **Proceed to Phase 3.**
      *   **If No:** (e.g., they *should* have known, but proof of internal acceptance is thin). → **STOP.** Use fallback: *"faced evidence," "ignored warnings."*

  ### Phase 3: Our Context (The "Attributor" Check)
  *This addresses Contextualism: Does our usage of "knew" imply more than the evidence supports?*

  **5. What does "knew" imply in this specific headline?**
  *   **Neutral:** (e.g., "Mayor knew of parade route change"). → **Safe.**
  *   **Accusatory:** (e.g., "Company knew product was deadly"). → **Raise the bar.** In a legal context, "knew" implies *scienter* (guilty knowledge).
      *   **Do we want to litigate *scienter*?**
      *   **No:** → **STOP.** Use fallback: *"documents show," "records indicate."*
      *   **Yes:** → **Proceed to Q6.**

  **6. Is the "knew" claim essential to the public interest?**
  *   **No:** (e.g., it's color, not the core of the story). → **STOP.** Soften the language.
  *   **Yes:** (e.g., the story *is* about the cover-up). → **Escalate to Standards Editor.** This is no longer a fact check; it is a values calculation regarding risk vs. truth.

  ***

  ### The Fallback Ladder
  If the protocol stops you from using "knew," select the most precise alternative:
  1.  **"Was aware"**: They had the info, but maybe didn't process it.
  2.  **"Was told" / "Was warned"**: Shifts agency to the messenger.
  3.  **"Had reason to suspect"**: Acknowledges the evidence without claiming certainty.
  4.  **"Documents show"**: Attributes the claim to the paper, not the person.

  ### The Honesty Appendix (Where Judgment Hides)
  *   **Q3 (Action)** is a judgment call. Ignoring a warning can mean you didn't know, OR it can mean you knew and didn't care. The desk must decide which narrative fits the *totality* of evidence.
  *   **Q6 (Public Interest)** is a values call. This is where the Standards Editor must step in. The procedure cannot calculate moral necessity.

  ***

  # Running the Cases

  Here is how the protocol handles your three scenarios.

  ### Case 1: The Chemical Company (2011 Memos)
  *Scenario: Scientist flags one ambiguous study linking chemical to tumors. Reporter wants: "Company knew chemical was carcinogenic since 2011."*

  *   **Phase 1, Q2:** Is there a document stating the fact as true? **No.** The study is "ambiguous." The memo flags a link, it does not confirm it.
  *   **Phase 1, Q3:** Did they act as if it were true? **Unclear.** If they kept selling, they acted as if it was *safe*, not carcinogenic.
  *   **Phase 2, Q4:** Cost to subject? **High.** Admitting carcinogenicity kills the product. This raises the bar for proof of knowledge.
  *   **Phase 3, Q5:** Does "knew" imply *scienter*? **Yes.** It implies they knew it caused cancer and sold it anyway.
  *   **Verdict:** **STOP at Phase 1.**
  *   **Fallback:** "Company **was warned** chemical **might be** carcinogenic since 2011" or "Internal memos **flagged tumor link** in 2011."
  *   **Why:** Epistemologically, an ambiguous study does not constitute knowledge, even for the subject. Legally, "knew" asserts a causal certainty the study didn't have.

  ### Case 2: The Governor and the Bridge
  *Scenario: Aide mentions inspection worries in passing at a fundraiser. Desk wants: "Governor knew bridge was unsafe."*

  *   **Phase 1, Q1:** Direct admission? **No.**
  *   **Phase 1, Q2:** Contemporaneous document stating fact? **No.** It was a verbal comment "in passing."
  *   **Phase 1, Q3:** Acted as if true? **No.** No record of immediate inspection order.
  *   **Phase 2, Q4:** Cost to subject? **High.** Public safety and re-election. High stakes mean we need proof they processed the info, not just heard it.
  *   **Phase 3, Q5:** Does "knew" imply accusation? **Yes.** It implies negligence.
  *   **Verdict:** **STOP at Phase 1.**
  *   **Fallback:** "Governor **was alerted** to bridge worries" or "Aide **raised concerns** to Governor."
  *   **Why:** Hearing a worry "in passing" is not epistemic knowledge. It is auditory reception. To say the Governor "knew" the bridge was unsafe conflates *hearing a claim* with *accepting a fact*.

  ### Case 3: The Whistleblower (The Annoying One)
  *Scenario: Sympathetic whistleblower, one dataset + strong hunch. Staff wants: "She knew the product was dangerous."*

  *   **Phase 1, Q2:** Document stating fact as true? **No.** She has a dataset and a hunch.
  *   **Phase 1, Q3:** Acted as if true? **Yes.** She blew the whistle (risked career).
  *   **Phase 2, Q4:** Cost to subject? **High.** Her career/safety. She clearly *believed* it, but did she *know* it?
  *   **Phase 3, Q5:** Does "knew" imply accusation? **Yes,** against the company, but it also vouches for *her*.
  *   **Phase 3, Q6:** Is it essential to public interest? **Yes.** Her credibility is the story.
  *   **Verdict:** **ESCALATE TO STANDARDS EDITOR.**
  *   **The Conflict:** The procedure flags this as epistemically weak (a hunch + data $\neq$ knowledge), but morally strong (she was the only one who saw the truth).
  *   **My Ruling:** Soften it. Use **"She suspected"** or **"She identified data suggesting."**
  *   **Why (and why you might hate this):**
      *   **Epistemically:** If we say she "knew," and it turns out the dataset had a flaw, we have lied. We have converted her *justified belief* into *fact*.
      *   **Narratively:** I understand the urge. "She knew" makes her a hero. "She suspected" makes her a gambler.
      *   **The Misfire:** This is where the procedure protects the *outlet* more than the *truth*. Sometimes "knew" is the only word that captures the moral reality of a whistleblower who was right. However, in a libel context, we cannot trade on moral reality.
      *   **Compromise:** "She **warned** the product was dangerous." This captures the action (the whistleblowing) without asserting the epistemic state (knowledge) as an objective fact. It keeps her agency without guaranteeing her infallibility.

  ### Final Note for the Desk
  When reporters push back, tell them this: **"Knew" is a verb of completion.** It means the mental process is finished. **"Suspected," "Warned," "Saw"** are verbs of process. Most news stories are about the process of discovery and concealment, not the moment of completion. Unless you have a smoking gun confession, you are almost always reporting on the process.

  If they fight you on Case 3 (The Whistleblower), bring it to me. That is the one place where the "values calculation" (Q6) might override the epistemic strictness, but I need to make that call, not the desk.
