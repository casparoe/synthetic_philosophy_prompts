answer: |-
  Your instincts are excellent. The summary you received from that airport book contains a mix of accurate background, significant distortions, and conclusions that Peter Singer would explicitly and vigorously reject. In fact, the "we can relax" conclusion is almost the exact opposite of Singer's intent.

  It sounds like the author of that book may have conflated Singer with other evolutionary psychologists (like Steven Pinker or Robert Wright) or simply succumbed to a "just-so story" version of history that feels comforting rather than accurate.

  Here is a claim-by-claim breakdown of what is fair, what is distorted, and what Singer would reject, followed by answers to your specific questions.

  ### Claim-by-Claim Analysis

  **1. Claim:** *Morality started as an evolutionary trick (kin selection/reciprocal altruism), which is why early groups cared only about their own clan.*
  *   **Verdict:** **Fair Rendering.**
  *   **Singer's View:** Singer agrees with this. In *The Expanding Circle* (1981), he accepts the sociobiological account of the *origins* of our moral sentiments. We evolved to care about kin and cooperators because it helped our genes survive. He does not view this as a "trick" in a nihilistic sense, but as the biological starting point.

  **2. Claim:** *Reason kicked in, extending concern from tribe to nation to humanity to animals.*
  *   **Verdict:** **Fair Rendering.**
  *   **Singer's View:** This is the core metaphor of the book. Singer argues that while our *feelings* are evolutionary, our *capacity for reason* allows us to recognize that there is no logical basis for stopping at the border of our tribe or species. If my suffering matters to me, I must logically admit that similar suffering matters to others, regardless of their genetic relation to me.

  **3. Claim:** *This is a one-way ratchet; moral progress is built into history; it is inevitable.*
  *   **Verdict:** **Distortion / Singer Would Reject.**
  *   **Singer's View:** Singer is not a historical determinist. He argues that reason *allows* for expansion, not that history *guarantees* it. He acknowledges that societies can regress, that tribalism can flare up, and that the circle can shrink. The expansion depends on people actually *using* reason to override their evolutionary impulses. It is a potentiality, not a law of physics.

  **4. Claim:** *Because moral feelings are genetic leftovers, moral judgments are illusions.*
  *   **Verdict:** **Singer Would Strongly Reject.**
  *   **Singer's View:** This is the most critical error in the summary. Singer explicitly argues against the idea that evolutionary origins debunk morality (a position known as the "genetic fallacy"). He distinguishes between the **origin** of a belief (evolution) and the **justification** for a belief (reason).
      *   *Example:* We evolved to fear snakes (origin), but we can use science to determine which snakes are actually dangerous (justification).
      *   Similarly, we evolved to care about kin (origin), but we can use ethics to determine that we *ought* to care about strangers (justification). Singer believes ethical truths can be objective (specifically, preference utilitarian truths) despite their evolutionary beginnings.

  **5. Claim:** *Ethics is riding a wave science set in motion, so we can relax.*
  *   **Verdict:** **Singer Would Strongly Reject.**
  *   **Singer's View:** Singer's work is prescriptive, not descriptive. He writes to motivate action, not to induce complacency. If the circle expands only through the application of reason and effort, then "relaxing" ensures the circle stops expanding. Given the suffering that exists (in factory farms, in global poverty, etc.), Singer argues we are morally obligated to work harder, not relax.

  ---

  ### Addressing Your Specific Questions

  #### 1. Is the historical expansion supposed to be automatic/inevitable, or does it depend on something people have to do?
  **It depends on what people do.**
  Singer's argument is that human beings possess a unique capacity for **universalizing reason**. Our evolutionary hardware gives us tribal instincts, but our software (reason) can run a program that says, "All suffering counts equally."
  However, running that program requires cognitive effort. It requires overcoming the "visceral" pull of tribalism. Singer does not believe the universe is pulling us toward goodness. He believes we have the *tools* to create goodness, but we can choose to drop those tools. The expansion is a **normative goal**, not a **historical inevitability**.

  #### 2. Is the bit about genetic origins debunking morality part of the view or the opposite of it?
  **It is the opposite of his view.**
  The book summary describes a position called **Error Theory** or **Moral Nihilism** (the idea that because morality has a selfish origin, it isn't "real").
  Singer is a **Moral Realist** (specifically a Preference Utilitarian). He argues that once reason enters the picture, ethics escapes the grip of genetics.
  *   **The Book's Logic:** Genetics made us moral -> Therefore morality is just genetics -> Therefore morality is an illusion.
  *   **Singer's Logic:** Genetics made us moral -> But reason allows us to critique our genetics -> Therefore we can find objective ethical truths that transcend genetics.
  Singer would say the book summary commits the **Genetic Fallacy**: assuming that because something has a humble or selfish origin, its current validity is nullified.

  #### 3. Does the "we can relax" conclusion follow from any of the parts that are accurate?
  **No.**
  Even if you accept the accurate parts (that we have evolutionary instincts and reason allows us to expand the circle), the "relax" conclusion does not follow.
  *   **If progress isn't inevitable:** Then relaxing risks regression.
  *   **If morality isn't an illusion:** Then we have actual obligations to reduce suffering.
  *   **If the circle is expanding:** It isn't expanding fast enough to prevent current suffering.

  Singer's philosophy is famously demanding. He argues that if we can prevent something bad from happening without sacrificing anything of comparable moral importance, we ought to do it. This leads to conclusions like donating a significant portion of income to effective charities or stopping the consumption of animal products. This is the antithesis of "relaxing."

  ### Why the Confusion?
  It is possible the pop-science author was trying to synthesize Singer with **Steven Pinker** (who argues in *The Better Angels of Our Nature* that violence has declined historically) or **Robert Wright** (who argues in *Non-Zero* that history has a directional logic toward cooperation).

  While Singer respects their data, his philosophical stance is much more urgent. Pinker might suggest we are getting better and should keep doing what we're doing; Singer suggests we are logically compelled to do much more than we currently are.

  ### Summary
  *   **Accurate:** Evolutionary origins of moral sentiments; the metaphor of the expanding circle; the role of reason in expanding it.
  *   **Distorted:** The inevitability of progress (it's not a ratchet); the idea that evolutionary origins make morality an illusion.
  *   **False:** The conclusion that we can relax.

  Your suspicion was correct. The summary turns a demanding ethical call to action into a comforting story about historical destiny. Singer's actual view is that we are standing on the shoulders of evolutionary giants, holding a flashlight of reason, and it is our job to walk forward into the dark—not to sit down and assume the sun will rise on its own.
