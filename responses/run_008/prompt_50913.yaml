answer: |-
  Dear Student,

  It is completely understandable that you feel stuck on this objection, because your teacher has constructed a very sophisticated version of a classic critique known as the argument from moral vanity. She has effectively cornered the naive deontologist who simply says killing is wrong without explaining why, but her argument relies on a subtle mischaracterization of what the deontologist is actually doing when she refuses to kill the one patient. You have a very good instinct about there being a slide in the reasoning, specifically regarding how we understand the agent's motivation and the nature of rights. To defend your position while keeping your commitment to the idea that the surgeon must refuse, you should reject step five of your teacher's argument. This is the step where she claims that the surgeon who refuses to act is treating the condition of her own hands as worth more than four lives. This step looks plausible at first glance because it translates the deontological constraint into a currency that consequentialists understand, namely a trade-off between values. If we assume that everything in morality must be weighed on a single scale, then refusing to save five lives to keep one's own hands clean looks like selfishness. It looks like the surgeon is saying my purity is worth more than your life. However, this description is false because it misunderstands the structure of the duty. The surgeon is not weighing her hands against the lives of the patients at all. She is recognizing that there is no scale on which these things can be weighed. By rejecting step five, you are arguing that the surgeon is not prioritizing herself over others, but rather prioritizing the inviolability of the one patient over the aggregate welfare of the five. She is not valuing her own conduct above four lives; she is acknowledging that she has a specific duty to the one patient not to use him as a means, a duty that does not exist in the same way toward the five dying patients.

  Rejecting this step allows you to answer the teacher's counter-argument about rights stacking as well. Your teacher argued that if the constraint is based on the patient's right, then five rights should outweigh one. This objection assumes that rights are like units of value that can be summed up, so that violating five rights is simply five times worse than violating one. But if you reject step five, you are already committed to the idea that moral constraints are not about maximizing good outcomes or minimizing bad units. In deontology, rights function as side-constraints rather than goals. A right not to be killed is a boundary that others must not cross, not a value that must be promoted. When the surgeon refuses to kill the healthy patient, she is respecting his boundary. The fact that five other people have similar rights does not give her permission to cross the boundary of the one. The rights of the five dying patients are rights not to be killed by others, or perhaps rights to be rescued, but they do not generate a license for the surgeon to violate the healthy patient. The slide you suspected is indeed here, between a right being violated by nature or disease versus a right being violated by a moral agent. The five dying patients are unfortunately losing their lives, but their rights are not being violated by the surgeon in the same way the healthy patient's right would be if she cut him open. By rejecting step five, you clarify that the surgeon is not choosing herself over them, but choosing to respect the specific moral relationship she has with the healthy patient which forbids using him, whereas her relationship with the dying patients only obligates her to help them within the bounds of not harming others.

  You also asked about moral residue and whether it matters for this objection. Moral residue is the idea that even when a moral agent makes the right choice, she may still feel regret or sorrow for the bad outcomes that occurred as a result of her decision. This concept is very helpful for your paper, though it does not solve the logical problem of rights stacking on its own. Instead, it helps you defeat the charge of moral vanity in step six. Your teacher argues that a person who values her own conduct above four lives is self-indulgent. If the surgeon refuses to kill and then walks away indifferent to the five deaths, she might indeed seem vain or cold. But if she experiences moral residue, if she is genuinely devastated by the deaths of the five even while knowing she was right not to kill the one, it demonstrates that she does not value her own purity above their lives. She acknowledges the tragedy of the situation without accepting the guilt of murder. This shows that her refusal is not about self-regard but about principle. It helps with the rights objection indirectly by showing that the deontologist takes the rights and lives of the five seriously, even if she does not accept that their aggregate weight overrides the constraint against killing the one. It humanizes the deontological agent and makes the position seem less like a rigid obsession with rules and more like a tragic acceptance of moral limits.

  However, you should be aware that rejecting step five and defending deontology in this way does come with costs, both for your paper and for the theory itself. For your paper, the cost is that you must do the hard work of explaining why rights are not aggregable. You cannot simply assert that five rights do not outweigh one; you have to explain the distinction between agent-relative duties and agent-neutral goals, which is a complex philosophical concept to articulate clearly in a high school term paper. You will need to be precise about why the surgeon's duty to the one patient is different in kind, not just in degree, from her duty to the five. For the theory of deontology itself, the cost is accepting what some critics call the problem of negative responsibility. By defending the view that the surgeon must refuse, you are accepting that it is morally permissible to let five people die when you could have saved them, provided saving them required committing a wrong. This means you are defending a morality that sometimes allows preventable tragedies to occur in order to maintain the integrity of the moral agent. This is a hard pill to swallow for many people, and it means your version of deontology must be comfortable with the idea that the world might contain more death and suffering than it would under a consequentialist system, because justice and respect for persons are valued higher than overall welfare. You are essentially arguing that there are things we must not do, even to save the world, and while this preserves the dignity of the individual, it leaves the deontologist open to the charge that she is letting the world burn to keep her hands clean, a charge you can mitigate with moral residue but never fully eliminate.

  Despite these costs, this is the strongest path for your argument because it preserves your core intuition in step one that the surgeon must refuse. If you were to accept step five, you would have to concede that the surgeon is being vain, which undermines the moral authority of her refusal. If you were to accept step two, you would be forced into a false dilemma where you must choose between consequentialism or vanity. By rejecting step five, you carve out a third space where the agent acts out of respect for others rather than love of self. This aligns with your intuition about the slide between violating a right and allowing a right to be violated. It allows you to say that the surgeon is not counting lives against purity, but rather recognizing that some actions are forbidden regardless of the count. This preserves the deontological insight that persons are ends in themselves and cannot be used as mere resources, even for a good cause. It is a demanding position, and it requires you to argue that morality is not just about making the world better but about acting rightly within it, but it is a defensible and respectable position for your seminar. I hope this helps you structure your response and gives you the confidence to push back on the teacher's argument while acknowledging the difficulties involved.

  Sincerely,

  Your Assistant
