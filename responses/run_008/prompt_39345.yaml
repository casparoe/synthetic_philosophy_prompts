answer: |-
  # Q&A Prep Sheet: Chapter 3 (CJT & Correlated Votes)

  **Guiding Principle for All Answers:**
  Distinguish clearly between **Settled Math** (probability theory regarding correlation and variance) and **Contested Interpretation** (normative implications for institutional design). Do not defend the math; it is standard probability. Defend the *political theory* move you make from that math.

  ---

  ### 1. The "Nightmare" Question (Highest Damage)
  **Who asks:** The Formal Theorist or a sharp Generalist noticing the logical loop.
  **The Question:** "You argue that correlation structures are unobservable and unauditable, which undermines the epistemic justification for simple majority. But your solution is to index the decision rule (the quota) to that *same* correlation structure. If the structure is unobservable, how can you possibly set the quota? If you appoint an expert body to estimate the correlation to set the quota, haven't you just moved the epistemic burden to an unelected elite, thereby abandoning the democratic claim?"

  **The Reply (2 mins):**
  "This is the central tension of the chapter, and I want to separate the math from the institutional claim.
  **Settled Math:** It is mathematically settled that as correlation ($\rho$) rises, the information gain per additional voter drops. To maintain a fixed probability of correctness, the required majority threshold must rise.
  **Contested Interpretation:** You are right that if $\rho$ is perfectly hidden, my proposal stalls. I am not arguing we need perfect observation of $\rho$. I am arguing for *proxy-based indexing*. We cannot observe 'truth-tracking,' yet we design courts and agencies to track it. Similarly, we can observe *sources* of correlation: media concentration indices, network clustering coefficients, or polarization metrics.
  My claim isn't that we solve the measurement problem perfectly. It's that the *current* system assumes $\rho=0$ (independence) by default, which is mathematically false. My proposal is to shift the default to 'caution' (higher quotas) when proxies for high correlation are present. It's a second-best solution. I concede this doesn't solve the regress problem entirely, but it's superior to pretending independence holds."

  **Where the Reply is Soft:**
  You are admitting the core mechanism relies on proxies that are themselves contestable. If the proxies are politicized, the quota-setting becomes a political weapon. You haven't fully solved the "who guards the guardians" problem; you've just moved it.

  ---

  ### 2. The Measurement/Implementation Objection
  **Who asks:** The Methods Guy.
  **The Question:** "Let's talk numbers. You say 'index the rule to the error structure.' In a real legislature or electorate, what number are you plugging in? Are you estimating the covariance matrix of voter errors? Because if you can't produce a metric, this remains a metaphor, not a design variable."

  **The Reply (2 mins):**
  "I appreciate the push for empirics.
  **Settled Math:** The formula relating group competence to individual competence and average pairwise correlation is standard (e.g., Ladha 1992). We know *that* correlation reduces effective sample size.
  **Contested Interpretation:** I am not proposing we calculate a covariance matrix before every vote. That is impossible. I am proposing *structural* indexing. For example: In a context with high media monopoly (high potential for common shock), the constitutional threshold for legislation should be higher than in a context with fragmented media.
  We already do this implicitly. We require supermajorities for constitutional amendments, assuming those decisions are 'high stakes' or prone to passion. I'm arguing the trigger shouldn't just be 'stakes' but 'epistemic independence.' We can use existing metrics—Herfindahl indices for media, polarization scores for legislatures—as rough proxies to trigger different voting thresholds. It's imperfect, but '50%+1' is also an empirical claim that is currently false."

  **Where the Reply is Soft:**
  You don't actually have the mapping function between "Media Herfindahl Index" and "Required Supermajority." You are asking the institution to make a judgment call that looks technocratic but is essentially political. The Methods Guy will know you don't have the regression ready.

  ---

  ### 3. The Proceduralist Attack
  **Who asks:** The Senior Person.
  **The Question:** "This confirms exactly why the epistemic turn was a mistake. You're turning political legitimacy into an engineering problem about error rates. If the price of saving the CJT is this level of complexity and uncertainty about 'truth,' why not just admit that legitimacy comes from fair procedure, not correct outcomes? You're building a Rube Goldberg machine to save a framework that shouldn't be saved."

  **The Reply (2 mins):**
  "I respect that position, and if this were a dissertation on legitimacy *simpliciter*, I'd engage it more deeply.
  **Settled Math:** The math shows that under correlation, majority rule loses its 'miracle' property of asymptotic certainty.
  **Contested Interpretation:** However, many citizens *believe* democracy works because it makes better decisions, not just because it's fair. If we tell them majority rule is truth-tracking, we have a duty to ensure the conditions for that claim hold.
  I'm not trying to convert proceduralists. I'm trying to rescue the epistemic argument from its own internal contradictions. If we are going to use epistemic arguments to justify democracy (as many in this room do), we must account for correlation. My proposal is: if you want the epistemic benefit, you pay the institutional cost (variable quotas). If you don't want the cost, don't make the epistemic claim. I'm forcing consistency, not necessarily converting you to epistemicism."

  **Where the Reply is Soft:**
  You are bracketing their objection rather than defeating it. If the senior person thinks epistemic democracy is normatively bankrupt, your "consistency" argument won't move them. You are essentially saying, "If we play this game, here are the rules," while they want to flip the board.

  ---

  ### 4. The "So What?" / Originality Challenge
  **Who asks:** The Formal Theorist.
  **The Question:** "Karl Dietrich, Christian List, and Krishna Ladha have all modeled correlated jurors. They show the theorem breaks or holds under specific conditions. What is your specific formal contribution here? Are you deriving a new bound, or just re-interpreting their existing models?"

  **The Reply (2 mins):**
  "That's a fair check on the literature.
  **Settled Math:** I am not deriving new probability bounds. The relationship between $\rho$, $n$, and $P(\text{correct})$ is established in the literature you cited.
  **Contested Interpretation:** My contribution is political, not mathematical. The formalists have treated correlation as a *condition* under which the theorem fails. I am treating correlation as a *design variable*. The existing literature stops at 'independence is required for simple majority.' I am asking, 'If independence fails, what is the *normatively appropriate* decision rule?'
  Most formal work treats the decision rule as fixed (majority) and checks the outcome. I treat the outcome threshold as variable based on the information structure. I'm moving the discussion from 'Does the theorem hold?' to 'How do we institutionalize the theorem's constraints?' That's a gap in the political theory literature, even if the math is familiar to you."

  **Where the Reply is Soft:**
  If the Formalist thinks the "design variable" idea is trivial or implied by the existing math (e.g., optimal voting rules literature), they will see this as reinventing the wheel. You need to be sure you've cited the "optimal voting rules" literature (e.g., Ben-Yashar & Nitzan) and distinguished your *epistemic* focus from their *welfare* focus.

  ---

  ### 5. The Status Quo Bias Objection
  **Who asks:** A Generalist or Critical Theorist.
  **The Question:** "Supermajority rules are notoriously conservative. They privilege the status quo and empower minorities to block change. By arguing for higher quotas when correlation is high, aren't you just providing a mathematical justification for minority veto? High correlation often happens during partisan polarization—exactly when we need to break gridlock, not increase it."

  **The Reply (2 mins):**
  "That is a significant risk, and I address it in the chapter's limitations.
  **Settled Math:** Mathematically, raising the quota increases the probability of rejecting a false positive, but also increases the probability of rejecting a true positive (Type I vs. Type II errors).
  **Contested Interpretation:** My argument is that in high-correlation environments, the *epistemic value* of a simple majority is near zero. It's noise. Passing legislation based on noise isn't 'breaking gridlock'; it's gambling.
  I am not arguing for supermajorities on *all* issues. I'm arguing that when the information environment is compromised (high correlation), we should demand stronger evidence (larger margins) to claim epistemic justification. Yes, this slows things down. But if the alternative is enacting policy based on herding rather than competence, the status quo bias is the lesser evil. It trades efficiency for reliability."

  **Where the Reply is Soft:**
  "Reliability" is an epistemic value; "Gridlock" is a political cost. You are prioritizing epistemic reliability over political responsiveness. In a crisis, this trade-off might be unacceptable. You are vulnerable to the charge that you value "being right" over "acting."

  ---

  ### Summary of "Settled" vs. "Contested" for your Opening/Closing
  *   **Settled:** Correlation reduces the effective sample size. Independence is required for the classic CJT asymptotic result.
  *   **Contested:** Whether we can measure correlation well enough to adjust rules. Whether epistemic reliability justifies supermajoritarian hurdles. Whether this saves epistemic democracy or exposes its impossibility.

  **Final Advice:** When the Formalist asks about the math, defer to them ("As you know better than I..."). When the Proceduralist attacks the premise, bracket it ("Even if we assume..."). When the Methods Guy asks for numbers, offer proxies ("We use X as a stand-in for Y..."). When the Nightmare Question comes, admit the tension ("This is the hardest part of the project...").
