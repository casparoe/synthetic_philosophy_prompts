          2.  Address the "Child at the Well": For Mencius, it proves spontaneity of *yi* (righteousness). For Xunzi, it's a fleeting emotion, not sustained morality.
          3.  Address the Stakes: Why does Xunzi care? Because if *xing* is good, ritual is superfluous.
          4.  The "Third Way": Definitions in Warring States philosophy are prescriptive. To name *xing* is to set the curriculum. Therefore, it is *both* verbal and substantive.
      *   *Tone:* Academic, precise, respectful of the texts.

  5.  **Developing the Marking Scheme:**
      *   Total 20 marks.
