      *   *The "Substantive" Argument:* The definition *is* the fight. Xunzi attacks Mencius because Mencius's view undermines the necessity of Ritual (*li*) and Teachers. If people think morality is natural, they won't cultivate.
      *   *The "Third Way" (Nuance):* In Early Chinese thought, definitions aren't just labels (like "tomato"); they are normative guides. To define *xing* a certain way is to prescribe a way of living. So the "verbal" vs. "substantive" split might be a category error.

  3.  **Drafting the Essay Question:**
