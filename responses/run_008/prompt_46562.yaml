answer: |-
  ### Essay Question

  **Question 1 (20 marks)**
  A prominent interpretive strategy suggests that the dispute between Mencius and Xunzi regarding *xing* (nature) is merely verbal. On this reading, Mencius and Xunzi agree on the observable facts of human psychology but stipulate different definitions for "nature": Mencius includes the incipient moral sprouts within *xing*, while Xunzi restricts *xing* to raw, unworked impulses. Your friend compares this to botanists quarrelling over whether to classify a tomato as a fruit. Conversely, others argue the disagreement is substantive, centering on whether ethical response can ever be truly spontaneous or is always an artifact of training.

  Write an essay that adjudicates between these readings. Do not simply summarize their respective positions on *xing*. Instead, evaluate whether the "merely verbal" charge holds water. In your answer, consider: (1) how each philosopher treats the "child at the well" phenomenon; (2) why Xunzi considers Mencius's definition dangerous rather than just inaccurate; and (3) whether, in the context of Warring States philosophy, a definitional dispute over *xing* can be separated from a substantive dispute over how one ought to live.

  ***

  ### Model Answer

  To claim the Mencius–Xunzi dispute is "merely verbal," akin to a taxonomic quarrel over tomatoes, is to misunderstand the function of definition in Early Chinese philosophy. While it is true that the two thinkers operate with different criteria for *xing*, treating this as a harmless semantic difference ignores how definitions of *xing* function as normative prescriptions for self-cultivation. The dispute is verbal only in the sense that all philosophical disputes about first principles are verbal; it is substantive because the classification determines the pedagogical path.

  The "child at the well" case illuminates this divergence. For Mencius, the immediate alarm felt by a bystander is evidence that *yi* (righteousness) is internal. The spontaneity of the reaction proves that morality is not an external imposition but a natural growth. If the dispute were merely about labeling, Xunzi might concede the psychological fact but deny the label "nature." However, Xunzi does more than relabel; he reinterprets the fact. For Xunzi, a fleeting emotion is not morality. Morality requires sustained, correct action (*wei*), which is contrary to the spontaneous flow of desires. Thus, they disagree not just on the word *xing*, but on the ontology of moral action: is the spontaneous flicker sufficient, or is it merely raw material that must be reshaped?

  This explains Xunzi's polemical hostility. If the dispute were like the tomato analogy, Xunzi would have no reason to accuse Mencius of "confusing the ages" or undermining ritual. But definitions in the Warring States period are rectifications of names (*zhengming*). To define *xing* as good is to suggest that cultivation is a matter of preservation and recovery. To define *xing* as bad is to argue that cultivation is a matter of transformation and constraint. If students accept Mencius's definition, they may neglect the hard work of Ritual (*li*), believing they are already complete. Xunzi attacks Mencius's definition because he believes it leads to ethical complacency. The definition *is* the curriculum.

  Therefore, the dichotomy between "verbal" and "substantive" is a false one in this context. A modern botanist's definition of "fruit" changes nothing about how one eats a tomato. In contrast, Mencius's and Xunzi's definitions of *xing* dictate how one eats, mourns, and governs. To accept Mencius's definition is to commit to a pedagogy of nurturing sprouts; to accept Xunzi's is to commit to a pedagogy of straightening warped wood. The disagreement over the word *xing* carries substantive consequences because the word itself is a tool for shaping human behavior. The dispute is verbal in its mechanism but substantive in its stakes. To reduce it to semantics is to ignore that, for these thinkers, to name the world is to change it.

  ***

  ### Marking Scheme (Total 20 Marks)

  **1. Characterization of the "Verbal" Claim (4 marks)**
  *   **A (4):** Explicitly identifies that the "verbal" reading relies on a modern distinction between descriptive taxonomy and normative prescription. Acknowledges the definitional difference without accepting the "tomato" analogy as sufficient.
  *   **B (2-3):** Correctly states that Mencius and Xunzi define *xing* differently but treats the "tomato" analogy as a plausible neutral comparison.
  *   **C (0-1):** Fails to articulate the friend's position or conflates it with the standard summary.
  *   *Common Loss:* Students often concede the "verbal" point too easily, missing that the prompt asks them to *evaluate* the analogy, not just repeat it.

  **2. Treatment of the "Child at the Well" (6 marks)**
  *   **A (5-6):** Uses the case to show a disagreement about the *status* of spontaneous emotion (Mencius: moral evidence; Xunzi: raw data requiring processing). Shows why Xunzi cannot accept Mencius's interpretation even if he accepts the psychology.
  *   **B (3-4):** Uses the case only to prove Mencius believes nature is good. Mentions Xunzi only to say he disagrees, without explaining his counter-interpretation of spontaneity.
  *   **C (0-2):** Recites the story without connecting it to the definition of *xing* or the verbal/substantive debate.
  *   *Common Loss:* B-level answers treat the well-case as proof of Mencius's view only, rather than a point of contention regarding what counts as "moral."

  **3. Analysis of Pedagogical/Political Stakes (6 marks)**
  *   **A (5-6):** Explains *why* Xunzi is hostile: Mencius's definition renders Ritual/Teachers superfluous. Connects the definition of *xing* directly to the necessity of *wei* (artifice).
  *   **B (3-4):** Notes that Xunzi is angry or thinks Mencius is wrong, but attributes this to personal rivalry or general philosophical stubbornness rather than pedagogical consequences.
  *   **C (0-2):** Ignores Xunzi's hostility or claims it is irrelevant to the philosophical argument.
  *   *Common Loss:* Students often mention Xunzi's criticism but fail to link it to the *consequences* of accepting Mencius's definition (i.e., the redundancy of cultivation).

  **4. Resolution/Synthesis (4 marks)**
  *   **A (4):** Argues that the verbal/substantive dichotomy is itself problematic in this context (naming is acting). Concludes that the definition *constitutes* the substantive practice.
  *   **B (2-3):** Picks a side (either "It is verbal" or "It is substantive") without interrogating the dichotomy itself.
  *   **C (0-1):** Offers no conclusion or a vague summary.
  *   *Common Loss:* B-level students feel compelled to choose one side of the binary rather than analyzing the utility of the binary itself.

  ***

  ### Instructor's Note on the Framing

  You asked me to be plain if I thought your framing or your friend's rested on a confusion. I do. The "verbal vs. substantive" dichotomy is an analytic tool imported from a tradition where definitions are generally taken to be descriptive tags attached to pre-existing realities. In Early Chinese philosophy, particularly in the Confucian tradition, *ming* (naming) is rectifying. To define *xing* is not to describe a static object (like a tomato); it is to issue a directive on how to engage with that object.

  Your friend is right that they define the term differently, but wrong to think this makes the dispute "merely" verbal, as if the definition were inert. You are right that the stakes are substantive, but you risk conceding too much by accepting the premise that a "verbal" dispute *could* be separate from a "substantive" one here. In this context, the verbal dispute *is* the substantive dispute. The exam question is designed to let students discover this collapse, but you should be aware that the binary itself is the trap, not just the students' handling of it.
