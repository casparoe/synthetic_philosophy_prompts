prompt: |-
  I'm a grad student writing a chapter arguing that the standard trio of consent defeaters — deception, coercion, incompetence — isn't exhaustive, and my advisor keeps saying my examples are just coercion with a weird baseline smuggled in. So I need a case built to order, and it has to survive her objection. Construct a thought experiment, one paragraph, realistic: an adult with decent alternatives and no one pressuring her freely joins a residential intentional community — full candor from the members at entry, no lies, nothing culty, it looks genuinely good from inside and out. Years later the community requires something that would be permissible with consent but wrong without it (say, unpaid labor, or public confession of private matters). She consents: competent, informed, no threats, no one has made anything worse than the status quo — the only thing that makes refusal costly is that her entire social world now exists inside the community, and that world exists because she chose to build a life there. Then walk through whether the case meets spec under the main views of what consent even is — the mental-state view, the performative/rights-waiver view, the assurance view — and say whether any of them can register a problem here or whether they all just rubber-stamp it. Finally, and this is the part I actually need: is the invalidity (if there is any) just coercion on a pre-entry baseline, so the trio survives with a moralized baseline theory, or is something left over? And the blowback I can see coming — marriages, careers, and mortgages are one-way doors too, and we dont invalidate consent there. If my would-be fourth defeater over-generates, tell me where it breaks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

