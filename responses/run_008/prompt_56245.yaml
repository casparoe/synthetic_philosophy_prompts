  3.  **Analyzing Consent Theories:**
      *   *Mental-State View (Subjective):* Did she intend to waive the right? Yes. She wants to stay. Theory says: Valid.
      *   *Performative/Rights-Waiver (Objective):* Did she perform the waiver? Yes. Was it voluntary? Usually defined by absence of coercion/deception. Theory says: Valid.
      *   *Assurance View (Scanlon/Oshana):* Did she assure them they wouldn't hold her to the right? Yes. Does the context undermine the assurance? Maybe, if the context makes the assurance non-autonomous. But standard Assurance views focus on communication. Theory likely says: Valid.
