      *   **Analysis Required:** Walk through the case under three main theories of consent (Mental-State, Performative/Rights-Waiver, Assurance).
      *   **Core Question:** Is the invalidity just coercion on a pre-entry baseline (saving the standard trio), or is there something leftover?
      *   **Objection Handling:** Address the "over-generation" objection (marriages, careers, mortgages are also one-way doors; why don't we invalidate consent there?).
