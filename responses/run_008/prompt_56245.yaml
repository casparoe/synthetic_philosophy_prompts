      *   *The "Something Left Over":* The issue isn't necessarily *coercion* (threat) but *entrapment via dependency*. It's structural vulnerability created by permissible prior choices.
      *   *Verdict:* It *can* be modeled as coercion with a moralized baseline (the community shouldn't hold social hostage), but it feels distinct because no agent *issued* the threat. The threat is circumstantial. This points toward "Situational Vulnerability" or "Structural Coercion" rather than interpersonal coercion.

  5.  **Addressing the Over-Generation Objection (Marriage/Career):**
      *   *Why is Haven different from a marriage?* In marriage, mutual obligations are usually reciprocal and regulated by exit rights (divorce). In Haven, the power dynamic might be more collective/monolithic.
      *   *Why is it different from a career?* You can quit a job and keep your friends/family outside. In Haven, the *social world* is the job.
