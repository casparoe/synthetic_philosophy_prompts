answer: |-
  **The Case**
  Elena, a competent 32-year-old with savings and employable skills, voluntarily joins "The Hearth," a transparent intentional community after reviewing all bylaws and speaking freely with members. There is no deception, no initial pressure, and she retains legal freedom to leave at any time with her assets. Five years later, The Hearth institutes a "Radical Accountability" protocol requiring all residents to perform weekly public confessions of intimate sexual history to maintain residency. Elena finds this humiliating and would never agree to it outside The Hearth, but her entire social network, emotional support system, and sense of purpose are now entrenched there; leaving means returning to an atomized, isolated life she finds psychologically devastating. No one threatens her with violence or destitution, and the "cost" of refusal is solely the loss of the community she chose to build. She consents to the confessions to stay.

  **Analysis of Consent Theories**
  Under the **Mental-State View**, Elena's consent is valid: she subjectively intends to waive her right to privacy to avoid isolation. The **Performative/Rights-Waiver View** also validates it: she performs the requisite speech act without external impediment, and her right to waive privacy is generally within her power. The **Assurance View** (e.g., Scanlon) similarly rubber-stamps it: she has assured the community she will not hold them to the duty of non-intrusion, and they rely on that assurance. None of these standard views register a problem because they focus on the *moment* of agreement and the absence of direct interference, not the structural context of the choice.

  **Coercion and Baselines**
  Your advisor argues this is just coercion with a moralized baseline. Standard coercion requires a threat to make you worse off relative to a *normative baseline*. If the baseline is "pre-entry life," The Hearth isn't threatening her; they are offering a continued benefit (residency) conditional on confession. However, if the baseline is "moral entitlement," one could argue The Hearth is wrongfully holding her social world hostage. If you moralize the baseline enough to say "agents are entitled to exit without catastrophic social loss," then yes, this collapses into coercion. But this stretches "coercion" beyond its interpersonal roots (a threatener) to structural conditions (a situation). Something is left over: **Situational Vulnerability**. The invalidity stems not from a threatener's will, but from a dependency structure that renders the choice non-autonomous even without a coercive agent.

  **The Over-Generation Objection**
  The "Fourth Defeater" breaks if it invalidates consent whenever exit is *subjectively* costly. We do not invalidate consent in marriages or careers merely because divorce or resignation is emotionally or financially painful. The distinction lies in **Monopoly and Portability**. In a marriage or career, the goods (love, income) are not monopolized by a single unaccountable entity; legal frameworks protect exit rights, and social capital is partially portable. In The Hearth, the community monopolizes *all* social goods and creates a "total institution" where exit equals social death. Your fourth defeater survives only if restricted to **Non-Portable Dependency**: cases where an institution systematically concentrates all vital human goods (social, economic, psychological) such that the cost of exit is not just high, but *disproportionate to the norm*, effectively removing the capacity for meaningful refusal. If you cannot distinguish The Hearth from a demanding marriage on these structural grounds, the trio survives, and your example is indeed just coercion with a high baseline.
