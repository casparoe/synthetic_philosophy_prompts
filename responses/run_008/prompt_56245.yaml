      *Key distinction for the over-generation:* In marriage/career, the cost of exit is a *side effect* of valuing the relationship/job. In the cult/community case, the cost of exit is *engineered* (or at least structurally inherent) to ensure compliance with internal norms that wouldn't hold outside. Actually, the stronger distinction is *exit rights vs. exit costs*. Divorce is legally protected; leaving Haven might be legally fine but socially impossible.
      *Better distinction:* The "Fourth Defeater" shouldn't be about cost of exit (which is everywhere), but about *non-portable dependency*. In a career, your skills are portable. In a marriage, you have legal protections. In the Community, your social capital is non-portable and held hostage.

