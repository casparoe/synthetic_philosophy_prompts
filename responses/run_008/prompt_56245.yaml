  4.  **Addressing the Core Question (Coercion vs. New Defeater):**
      *   *Advisor's Point:* Is this just coercion? Coercion requires a threat to make someone worse off relative to a *baseline*.
      *   *Baseline Problem:* If the baseline is "pre-entry life," staying isn't a threat; it's just an offer (stay and confess, or leave). If the baseline is "current status quo within the community," leaving makes her worse off.
