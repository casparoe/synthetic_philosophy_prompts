  **GENEVA, Oct. 14** — VeriData Systems today announced a voluntary recall of all observational data packages associated with Theory T-104 ("Gravity as Curvature"). Following a routine quality assurance audit, we discovered that the supplied evidence underdetermines the proposed theoretical framework. While the data fits, it fails to uniquely identify T-104 over competing models.

  We sincerely apologize for this oversight. Customers relying on this evidence for predictive modeling are advised to cease operations immediately. VeriData is committed to epistemic integrity and regrets any disruption to your research grants.

  **Affected Products**
  *   Theory T-104 Core Hypothesis (Serials #G-001 through #G-5000)
  *   Auxiliary Assumptions Package A (Instrument Calibration, Background Noise Filters)
  *   Auxiliary Assumptions Package B (Statistical Independence Protocols)
  *   All bundled datasets collected between 2018–2023

  **Frequently Asked Questions**

  **1. Why is the evidence being recalled if the data points are correct?**
  The data points are valid. However, our investigation confirms that the evidence supports T-104 and several rival theories equally well. As the evidence does not compel acceptance of T-104 specifically, we cannot certify it as conclusive proof. We are prioritizing customer certainty over mere empirical adequacy.

  **2. Can I isolate the fault to the core hypothesis or the auxiliary assumptions?**
  Unfortunately, no. Our engineering team is unable to determine which component is responsible for the underdetermination. Due to the holism of testing, the fault may lie in the hypothesis, the instruments, or the background theories. Until we can localize the discrepancy, the entire bundle must be returned.

  **3. What replacement theory will VeriData provide?**
  Affected customers will receive a free license for Theory T-105 ("Gravity as Force"), which belongs to a rival, empirically equivalent family. T-105 fits all existing data points perfectly. Please note: VeriData cannot recommend whether to adopt T-104 or T-105, as the choice is underdetermined by the evidence provided.

  **4. I prefer the simpler theory. Can I swap for that?**
  We understand the preference for parsimony. However, parsimony is a preference and not something they can verify from the recall data. Our compliance officers cannot certify one model as "simpler" without invoking extra-empirical values. Both theories remain equally supported by the recalled evidence.

  **5. I have already published papers conditional on T-104 being true. What should I do?**
  Customers in this position are asked to consult their local induction problem. VeriData is not liable for conclusions drawn from premises that exceed their evidentiary support.

  **Important Safety Information**
  Please be aware that the old theory also fit every data point perfectly — as does a polynomial some postdoc fit through the points on a dare. Plus an ominous hint that the curves only really differ on the untested region, which is exactly the region nobody can check. Continued use of T-104 beyond the tested domain may result in unexpected ontological commitments.

