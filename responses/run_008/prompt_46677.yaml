answer: |-
  The monitors hummed, a low-frequency thrum that Marie felt in her teeth. Outside the chamber, the world was Technicolor. Inside, it was grayscale, precise, and absolute. Marie adjusted the gain on the telemetry feed. On the screen, a waveform spiked—a jagged mountain range of neural activity transmitted from Mary's occipital lobe.

  Mary was looking at a tomato.

  Marie knew exactly what was happening. She watched the photons, wavelengths of approximately 700 nanometers, strike Mary's retina. She saw the photoisomerization of rhodopsin, the cascade of neurotransmitters across the synapse, the BOLD signal lighting up V4 in the visual cortex. Marie had the galvanic skin response, the pupil dilation metrics, the verbal report logged simultaneously: *It's vibrant.*

  Marie typed a correction into the log. *Vibrant* was imprecise. The saturation level was 84%. The neural firing rate was 40Hz. Marie knew more about Mary's seeing than Mary did. Mary possessed the experience; Marie possessed the architecture. Mary knew the shadow; Marie knew the object casting it.

  For three years, Marie had curated the dossier. It was exhaustive. Every physical fact regarding color perception was cataloged here, cross-referenced with Mary's subjective reports. If physicalism held, Marie should have been able to reconstruct the experience from the data alone. She had the map down to the atomic level.

  She leaned back, rubbing eyes accustomed only to shades of slate and ash. The question wasn't whether the data was complete. It was. The question was what the data *was*.

  Marie pulled up the simulation module. She could stimulate her own visual cortex using the recorded patterns from Mary's feed. It was risky, but the ethics board had waived it for "internal consistency verification." She aligned the electrodes. She loaded the file labeled *TOMATO_RED_04*.

  If the Ability Hypothesis was correct, this stimulation would grant her the capacity to recognize and imagine red, but no new factual knowledge. She already knew the facts. She would just gain a new skill, like learning to ride a bike after reading the manual.

  If the Phenomenal Concept Strategy was correct, she already possessed the factual knowledge under a physical mode of presentation. The stimulation would merely provide the phenomenal mode of presentation. Same fact, new guise.

  Marie hesitated. Her finger hovered over the execute key.

  She thought about Mary, outside, eating the tomato. Mary didn't know the wavelength. Mary didn't know the firing rate. Mary just knew the red. Marie knew the wavelength. Marie knew the firing rate. Did Marie know the red?

  She had written a definition of red in her journal yesterday. *Red is the subjective correlate of long-wave spectral light processing.* It was accurate. It was true. It was empty.

  Marie pressed the key.

  The electrodes warmed against her temples. The waveform on the screen flattened, transferred into her own mind. She waited for the shift. She waited for the data to become experience, or for the skill to unlock, or for the concept to flip.

  The hum of the machines grew louder. Her heart rate matched the telemetry on the screen. She closed her eyes, waiting for the grayscale dark to be punctured by something else.

  Nothing happened. Or rather, nothing she had a category for happened. There was a sensation, a shift in the texture of the dark, but whether it was the *presence* of red or merely the *awareness* of the simulation was impossible to distinguish. She had the complete physical story. She had the trigger.

  She opened her eyes and looked at the log entry box. The cursor blinked. She needed to record the result. Did she learn something new? Or did she just learn how to do something new?

  Marie typed: *Subjective state aligned with physical data.*

  She stared at the sentence. It was true. It was also silent. She had the map, perfectly drawn, but the territory remained either a place she could not visit, or a skill she had not practiced. She saved the file. It was complete. It was everything. And when she closed her eyes, the dark remained perfectly, utterly dark, waiting to be named.
