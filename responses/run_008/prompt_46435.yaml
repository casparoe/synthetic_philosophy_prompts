answer: |-
  It is good to hear from a colleague who remembers when "memetics" was the shiny object on the grant circuit before it quietly vanished from the *Evolution* bibliography. You are right to be suspicious. As an audit of a theoretical model, classical memetics fails to meet the standards we would demand of a population genetics model, primarily because it conflates *mechanism* with *metaphor*.

  The reason it fizzled in the 90s wasn't just fashion; it was a failure of parameterization. You cannot write a Price Equation for a meme if you cannot define the variance in the replicator. However, the intuition behind it hasn't died; it has migrated into epidemiology and network science, which is where the "virus" analogy took over.

  Here is the audit you requested, treating Memetics as a grad student's thesis that needs rigorous defense.

  ### 1. The Correspondence Table

  Here is the mapping between the Standard Evolutionary Synthesis (SES) and Classical Memetics, with the "wobbly bits" highlighted.

  | Evolutionary Component | Biological Analog (SES) | Memetic Analog (Classical) | The Wobbly Bit |
  | :--- | :--- | :--- | :--- |
  | **Replicator** | Gene (DNA sequence) | The Meme (Unit of culture) | **Granularity:** A gene has physical boundaries. A meme does not. Is "Hamlet" one meme? A line? A theme? Without discrete units, you cannot track frequency. |
  | **Phenotype** | Organism / Protein / Trait | Behavior / Artifact / Speech | **Reconstruction:** In biology, genotype maps to phenotype. In culture, the "phenotype" (speaking the idea) is often what *recreates* the "genotype" in the next head. |
  | **Fitness** | Reproductive success ($R_0$) | Transmission rate (Virality) | **Host vs. Meme:** Biological fitness is usually aligned with host survival. Memetic fitness is often defined *independently* of host welfare (the virus analogy). |
  | **Mutation** | Replication error / Recombination | Modification / Interpretation | **Directionality:** Biological mutation is random w.r.t. fitness. Cultural "mutation" is often *directed* (improvement, simplification, bias). |
  | **Drift** | Stochastic sampling in finite $N$ | Stochastic loss in small groups | **Valid:** This holds up well in small communities or early adoption phases. |
  | **Selection** | Natural / Sexual Selection | Social / Cognitive Selection | **Agency:** Organisms don't choose their genes. Humans choose which ideas to adopt based on utility, prestige, or truth. |
  | **Species Barrier** | Reproductive isolation | Linguistic / Cultural boundaries | **Permeability:** Biological barriers are hard (mostly). Cultural barriers are porous. Ideas jump "species" (expert to layperson) constantly, often mutating to do so. |

  ### 2. Where the Mapping Breaks (The Structural Failures)

  You identified fidelity as the likely culprit. You are correct, but there are two deeper structural failures that prevent memetics from being a rigorous Darwinian science in the biological sense.

  **A. The Fidelity Problem (Copying vs. Reconstruction)**
  In biology, replication is *copying*. The DNA polymerase machinery is designed to minimize error. In culture, transmission is *reconstructive*. I do not copy the idea from your brain to mine; I observe your behavior, infer the underlying concept, and rebuild it in my own neural architecture.
  *   **Consequence:** This introduces a massive bias toward *learnability*. Ideas that are easier to reconstruct spread, regardless of truth. This supports the "catchy vs. true" argument, *but* it also means the "mutation" is not random. It is biased by human cognitive architecture. This violates the "blind variation" assumption of strict Darwinism.

  **B. The Replicator Problem (What is the Unit?)**
  In your *Drosophila* work, you could sequence a locus. In memetics, there is no consensus on the unit of selection. Is it a word? A sentence? A narrative? A ritual?
  *   **Consequence:** Without a discrete unit, you cannot measure frequency changes accurately. You cannot calculate heritability ($h^2$). If you can't measure heritability, you can't partition variance between selection and drift. This is why memetics failed to produce predictive models in the 90s. It was qualitative poetry, not quantitative genetics.

  **C. The Agency Problem (The "Virus" Conflation)**
  This is the critical error in the modern usage you dislike.
  *   **Gene View:** The replicator benefits the host (usually), or is neutral.
  *   **Virus View:** The replicator benefits itself *at the expense* of the host.
  *   **The Conflation:** Modern pop-memetics assumes all ideas are viruses. It assumes the human mind is a passive petri dish.
  *   **The Reality:** Humans are *active selectors*. We reject ideas that kill us (mostly). We adopt ideas that help us build better shelters. If rational evaluation were truly epiphenomenal, we would not see the cumulative retention of technological knowledge. We would see random walks of culture. We see ratchets.

  ### 3. Does This Matter for the "Rationality is Epiphenomenal" Conclusion?

  You asked which breakages matter for the conclusion that "ideas win because they are catchy, not true."

  **The Verdict: The conclusion is an overgeneralization derived from a specific subset of cultural dynamics.**

  1.  **Where the Virus Analogy Holds:** In high-speed, low-stakes transmission (Twitter rumors, fashion trends, conspiracy theories), the cost of adoption is low, and the transmission speed is high. Here, *context biases* (who said it, how emotional is it) outweigh *content biases* (is it true?). In this specific niche, the "virus" model works. Rationality is indeed swamped by transmissibility.
  2.  **Where the Virus Analogy Fails:** In high-stakes, cumulative domains (engineering, medicine, navigation), *content biases* dominate. If you adopt a "memetic virus" that says "gravity is optional," your fitness crashes. The environment acts as a brutal selector. Here, truth correlates with fitness.
  3.  **The Epiphenomenal Trap:** The claim that rational evaluation is *always* epiphenomenal commits the "Selfish Gene" fallacy. Even in biology, the gene doesn't "want" anything; it is selected. In culture, the *host* participates in the selection. If I choose an idea because it works, that is a selection pressure. To call that epiphenomenal is to ignore the mechanism of selection.

  **Summary:** The "virus" model explains the spread of *maladaptive* or *neutral* traits well. It fails to explain the spread of *adaptive* knowledge. Since human culture is defined by adaptive knowledge, the virus model is insufficient as a total theory.

  ### 4. Is "Cultivar" a Better Analogy?

  Your intuition about the **cultivar** is excellent. In the literature, this is formalized as **Dual Inheritance Theory (DIT)** or **Cultural Evolutionary Theory** (Boyd, Richerson, Henrich).

  *   **The Cultivar Model:** We domesticate ideas. We select them deliberately for utility.
  *   **The Mechanism:** Guided Variation. Unlike biological mutation, cultural variation is often directed toward a goal.
  *   **The Fit:** This accounts for the "ratcheting" effect of human culture. It acknowledges that we are not passive hosts.

  **However, the Cultivar model has a blind spot:** It struggles to explain *runaway processes*. Financial bubbles, witch hunts, and ideological purges look less like gardening and more like an autoimmune disease or a parasite outbreak. In these cases, the "cultivar" model is too optimistic about human agency.

  **The Synthesis:**
  There is no single analogy because cultural transmission is a **mixed mode system**.
  1.  **Vertical/Oblique Transmission (Parent/Teacher to Child):** Resembles the **Cultivar** model. High fidelity, high selection for utility.
  2.  **Horizontal Transmission (Peer to Peer/Media):** Resembles the **Virus** model. Low fidelity, high selection for transmissibility.

  The modern crisis of misinformation is essentially a shift in the *ratio* of these modes. Social media maximizes horizontal transmission, shifting the selective landscape from "truth/utility" to "virality/arousal." The meme analogy works here *only* because the medium has artificially selected for viral properties over utility.

  ### 5. Final Audit Recommendation

  If this were a grad student's model, I would recommend the following revisions:

  1.  **Abandon "Memetics" as a standalone theory.** It lacks a defined replicator. Adopt **Cultural Evolutionary Theory**. It uses the same math (Price Equation, replicator dynamics) but allows for multiple transmission biases (content vs. context).
  2.  **Reject the "Virus" as a universal.** Treat parasitic idea-spread as a specific *regime* of cultural evolution (high horizontal transmission, low accountability), not the default state.
  3.  **Restore Agency.** Rational evaluation is a selection pressure, not an epiphenomenon. It is a *costly* selection pressure that is sometimes outcompeted by cheaper heuristics (like "copy the prestigious individual").
  4.  **Define the Unit.** Stop looking for the "atom" of culture. Model the *trait frequency* in the population. You don't need to know the molecular structure of "fitness" to measure changes in allele frequency; similarly, you don't need to define the exact boundary of a "meme" to track the prevalence of a belief statement.

  **Bottom Line:** You were right in the 90s, and you are right now. The "meme" is a powerful metaphor for *parasitic* cultural spread, but a terrible theory for *cumulative* cultural adaptation. The "cultivar" analogy is closer to the truth of human success, but it needs to be coupled with epidemiological models to explain our failures.

  Don't let the podcast hosts convince you that Darwinism implies nihilism. Selection is a filter, not a judge. Sometimes it filters for truth, sometimes for catchiness. The job of the biologist (and the philosopher) is to determine which filter is currently running.
