      2.  **The Core Error:** Conflating *intent* with *obligation*.
      3.  **Point 1: Prospective Responsibility (Duty of Care).** It's about the choice to deploy, not just the specific crash.
      4.  **Point 2: The Lightning Analogy Fails.** Manufactured risk vs. Natural risk.
