prompt: |-
  In my psych class the teacher keeps saying the self is just a center of narrative gravity, like how a physical object has a center of gravity that isn't an actual little thing sitting inside it, and a story has a main character who doesn't exist outside the story. She used it last week to wave off my question about whether the self could ever be located in the brain somewhere, like if neuroscientists scanned you hard enough. Then later a classmate used the same line to argue that nobody is really responsible for anything, since if the self is just a story then there's no one to blame. I feel like the teacher and my classmate can't both be right about what it means but i can't put my finger on why. Can you lay out the different precise claims hiding in that slogan, from pretty trivial to pretty radical, and say for each one whether it's actually plausible and whether it would support waving off my brain question, or the blame argument, or neither? lay it out as a list i can bring to class.
