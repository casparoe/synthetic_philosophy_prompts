  I ran into an expected-value maximizer who'd gone broke betting his whole stack on a favorable coin flip. He insisted he'd followed the math.

  "In the average across all parallel versions of me," he said, "I'm a billionaire."

  I told him that was comforting, but the cashier only accepts money from this version.

  He shrugged. "Fine. Tell the version of me who won to pay you."

  I said, "He's not here."

  He said, "Exactly. He's busy being rich."

  ***

  **Alt one-liner:**
  "People treat half-Kelly like a moral virtue. It's not virtue; it's just admitting you live in one universe, not a million."
