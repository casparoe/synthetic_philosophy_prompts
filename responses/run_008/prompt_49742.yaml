answer: |-
  This is an excellent question. The summary you encountered captures the technical core of Lewis's 1976 result reasonably well but stumbles significantly on the philosophical implications, particularly regarding counterfactuals and Lewis's own broader project.

  Here is a claim-by-claim audit of the summary, distinguishing between what is correct, what is a simplification, and what is a misattribution.

  ### 1. "In the 1970s, Lewis proved that ordinary-language conditionals cannot have truth conditions."
  *   **Verdict:** **Simplification / Slightly Misleading.**
  *   **Analysis:** Lewis did not prove that conditionals *metaphysically cannot* have truth conditions. He proved a conditional statement: *If* conditionals express propositions (have truth conditions) *and* their probabilities obey "The Equation" (see below), *then* probability distributions collapse into triviality.
  *   **Correction:** A logician would say Lewis proved that conditionals cannot be **ordinary propositions** that interact with probability in the standard way while satisfying The Equation. One can save truth conditions by rejecting The Equation (as some material conditional theorists do), but Lewis chose to reject the idea that indicative conditionals express propositions at all.

  ### 2. "Start with a principle Lewis himself had proposed: the probability of the conditional 'if A, then B' equals the conditional probability of B given A."
  *   **Verdict:** **Correct (with nuance).**
  *   **Analysis:** This principle is widely known as **The Equation** (or sometimes Stalnaker's Thesis). Lewis did not originally propose it as his own invention (it is often associated with Ernest Adams and Robert Stalnaker), but in his 1976 paper *"Probabilities of Conditionals and Conditional Probabilities,"* Lewis accepted it as a highly plausible constraint on *indicative* conditionals that any theory should try to accommodate. He used it as a premise to generate the triviality result.

  ### 3. "Lewis showed that if this principle holds across a probability space rich enough to contain a few independent propositions, then every proposition in that space must have probability 0 or 1..."
  *   **Verdict:** **Correct.**
  *   **Analysis:** This is an accurate summary of the **Triviality Result**. Lewis demonstrated mathematically that if $P(A \to B) = P(B|A)$ for all $A, B$ in a sufficiently rich algebra of propositions, then for any $B$, $P(B)$ must be either 0 or 1. This means agents cannot have partial beliefs (credences), which is empirically false.

  ### 4. "...which is absurd for anyone with partial beliefs."
  *   **Verdict:** **Correct.**
  *   **Analysis:** This is the *reductio ad absurdum*. Since we clearly have partial beliefs (e.g., I am 0.7 confident it will rain), the conjunction of premises leading to this conclusion must be false.

  ### 5. "Since conditionals therefore cannot be propositions, they cannot be true or false."
  *   **Verdict:** **Correct (regarding Lewis's view on Indicatives).**
  *   **Analysis:** This is the conclusion Lewis drew specifically for **indicative conditionals**. Lewis argued that to save The Equation (which he found intuitively compelling for indicatives), we must deny that indicative conditionals express propositions. If they aren't propositions, they aren't the kind of thing that can be true or false. This aligns with a non-cognitivist or expressivist view of indicatives (similar to Ernest Adams' view).
  *   **Nuance:** This does not follow logically from the math alone. One could instead reject The Equation and keep truth conditions. Lewis *chose* this path, but the summary presents it as the only logical outcome.

  ### 6. "And the same argument applies to counterfactual conditionals..."
  *   **Verdict:** **Controversial / Simplification.**
  *   **Analysis:** The mathematical argument applies to *any* operator if you assume The Equation holds for it. However, most philosophers (including Lewis) argue that The Equation is **not** plausible for counterfactuals in the same way it is for indicatives.
  *   **Example:** "If Oswald hadn't killed Kennedy, someone else would have." Most people assign this a low probability (it's likely false), but the conditional probability of "someone else would have" given "Oswald hadn't" might be assessed differently depending on your theory of counterfactuals. Lewis maintained a sharper distinction between indicatives and counterfactuals than this summary suggests.

  ### 7. "...Lewis took his result to show that his own possible-worlds semantics for counterfactuals had rested on a mistake."
  *   **Verdict:** **Outright Error / Misattribution.**
  *   **Analysis:** This is the most suspicious part of the summary, and your intuition was correct. David Lewis is famous precisely for **defending** possible-worlds semantics for counterfactuals (in his 1973 book *Counterfactuals*).
  *   **The Reality:** Lewis did **not** abandon his possible-worlds semantics for counterfactuals due to the triviality results.
      1.  **Distinct Treatments:** Lewis treated indicatives and counterfactuals differently. He accepted the triviality result as a reason to deny truth conditions to *indicatives* (1976 paper).
      2.  **Counterfactuals Retain Truth Conditions:** For *counterfactuals*, Lewis maintained that they **do** have truth conditions defined by similarity relations between possible worlds.
      3.  **The Equation Fails for Counterfactuals:** Lewis argued that for counterfactuals, The Equation does not hold. Therefore, the triviality result does not force us to abandon truth conditions for counterfactuals. He believed we can have truth-conditional semantics for counterfactuals *without* satisfying $P(A \boxright B) = P(B|A)$.
      4.  **No Retraction:** Lewis never retracted his 1973 theory. He spent the rest of his career refining it, not discarding it. The summary conflates Lewis's non-cognitivism about *indicatives* with a supposed rejection of his realism about *counterfactuals*.

  ---

  ### Addressing Your Specific Question on Truth Values

  > *I'd like to know whether the conclusion that conditionals lack truth values follows from anything Lewis himself established, or whether that is a further move that others made in response to his results.*

  **The conclusion does not follow from the mathematics alone.** It is a philosophical choice Lewis made in response to his results.

  The Triviality Result establishes an inconsistency between three claims:
  1.  Conditionals express propositions (have truth conditions).
  2.  The probability of a conditional equals the conditional probability (The Equation).
  3.  Agents have non-trivial partial beliefs (probabilities are not just 0 or 1).

  Since (3) is undeniable, you must reject either (1) or (2).

  *   **Lewis's Move (for Indicatives):** He rejected (1). He argued indicative conditionals do not express propositions and thus lack truth values. He did this to preserve (2), which he felt captured the logic of ordinary reasoning.
  *   **Alternative Moves (by others):** Many logicians and philosophers (e.g., Frank Jackson, Dorothy Edgington, or proponents of the Material Conditional) rejected (2). They argued that conditionals *do* have truth conditions (often material or strict), but that our *assertibility* or *probability* judgments are governed by pragmatic rules that mimic The Equation without actually being identical to it.

  **Regarding Counterfactuals:**
  Lewis explicitly **kept (1)** for counterfactuals. He argued that counterfactuals have truth conditions (via possible worlds) and therefore we must **reject (2)** for counterfactuals.

  ### Summary of the Audit

  | Claim in Book Summary | Status | Notes |
  | :--- | :--- | :--- |
  | **Lewis proved conditionals cannot have truth conditions.** | **Simplification** | He proved they can't have truth conditions *if* they satisfy The Equation. |
  | **The Equation (Probability = Conditional Probability).** | **Correct** | This is the premise Lewis used (often called Stalnaker's Thesis). |
  | **Triviality Result (Probabilities collapse to 0 or 1).** | **Correct** | This is the accurate mathematical core of the 1976 paper. |
  | **Conditionals cannot be propositions / true or false.** | **Correct (for Indicatives)** | This was Lewis's specific conclusion for *indicative* conditionals. |
  | **Same argument applies to Counterfactuals.** | **Misleading** | The math applies only if you assume The Equation holds for counterfactuals, which Lewis denied. |
  | **Lewis rejected his possible-worlds semantics for Counterfactuals.** | **False** | **Major Error.** Lewis defended possible-worlds semantics for counterfactuals throughout his career. |

  **Conclusion:** The book summary is reliable on the technical logic of the 1976 triviality result regarding *indicative* conditionals, but it is historically and theoretically incorrect regarding Lewis's stance on *counterfactuals*. It falsely suggests Lewis abandoned his signature contribution to philosophy (possible-worlds semantics for counterfactuals) when, in reality, he used the triviality result to sharpen the distinction between indicatives (no truth conditions) and counterfactuals (truth conditions via possible worlds).
