answer: |-
  It is completely understandable why that exchange left you unsettled, because your classmate is relying on a very specific and arguably distorted reading of Du Bois to do a lot of heavy lifting that the quote cannot support. When you bring this to seminar, it will help to separate the slogan all art is propaganda into four distinct claims ranging from the trivial to the radical, because the validity of the statement and its consequences for aesthetic judgment change completely depending on which version you are discussing. The first and weakest version is the descriptive claim that all art communicates some perspective or values simply by existing. Under this reading, a landscape painting propagates the idea that nature is worthy of attention, or a portrait propagates the worth of the subject. This is largely a platitude and arguably true, but it does not support your classmate's dismissal of aesthetic questions. Even if a painting communicates a value, it can still be judged on how well it is painted. A clumsy, muddy painting might propagate dignity, but it propagates it poorly. Du Bois would not laugh at this definition, but he would find it too weak to capture his urgency.

  The second version is the sociological claim that all art is inevitably political because it is produced within a structure of power. This is substantive and defensible. It suggests that even art claiming to be neutral is taking a side by ignoring injustice. However, this still does not license the conclusion that quality does not matter. If art is inevitably political, then the question becomes whether it is effective politics. A poorly made film about civil rights might fail to move audiences or might even reinforce stereotypes through its incompetence. Therefore, aesthetic standards are not merely politics in disguise; they are the metrics by which we judge the effectiveness of the political communication. Your classmate's move to say that asking if it is good as art is asking nothing fails here, because the craft is the vehicle for the politics. If the vehicle is broken, the politics do not arrive.

  The third version is the prescriptive claim that Du Bois was actually making in his 1926 essay Criteria of Negro Art. This is the view that Black artists have a moral duty to create work that advances the cause of racial justice and dignity. This is substantive and was Du Bois's genuine position. He famously wrote that he did not care a damn for any art that is not used for propaganda. However, and this is crucial for your seminar, Du Bois coupled this with an insistence on excellence. He believed that shoddy work discredited the race. He wanted propaganda, but he wanted propaganda that was so technically proficient that white audiences could not dismiss it. He was fighting against the stereotype of Black inferiority, and he reasoned that mediocre art would only confirm that stereotype in the minds of racists. So under this reading, which is what Du Bois actually held, your classmate is wrong. Du Bois would argue that a painting with clumsy composition and muddy colors is bad art precisely because it fails as propaganda. It fails to command respect. He would not laugh you out of the room for asking about quality; he would thank you for it, because quality was the only way the propaganda could work.

  The fourth and final version is the reductionist claim that art is nothing but propaganda and that aesthetic value is identical to political utility. This is the version your classmate needs for her argument to work. If art is only a message, then the wrapping does not matter, only the content. This claim is highly controversial and generally considered false by most philosophers of art. It collapses the distinction between a pamphlet and a poem. If this were true, then aesthetic criticism would indeed be illegitimate, replaced entirely by political analysis. But this is not what Du Bois meant, and it is not a defensible position on its own merits. Du Bois was a lover of beauty and culture who studied in Germany and appreciated high art. He did not want to reduce art to slogans; he wanted to elevate propaganda to the level of art. If you present this fourth version to your professor, you will likely find that this is the straw man your classmate is attacking. Du Bois would absolutely laugh this version out of the room because it ignores the necessity of craft. He believed that without beauty, propaganda is just noise.

  So when you go to class, you can frame this by saying that the slogan all art is propaganda is doing too much work in your classmate's argument. You can point out that even if we accept Du Bois's prescriptive view that art should serve justice, it does not follow that technical standards are irrelevant. In fact, Du Bois argues the opposite. He was engaged in a debate with Alain Locke, who favored art for art's sake, but Du Bois's counter was not that quality doesn't matter, but that quality is required for the art to survive and serve the race. You can ask the seminar whether a message of dignity can survive a medium of incompetence. Du Bois's answer was no. The muddy colors and clumsy composition undermine the dignity they are supposed to depict. Therefore, aesthetic questions are not pointless; they are essential to the political project. Your classmate is using a radical reductionist reading to shut down a question that Du Bois himself would have considered vital. He wanted art that was both propaganda and excellent, not propaganda instead of excellence. Bringing this distinction up will show that you have engaged with the text beyond the slogan and understood the tension between ethics and aesthetics that defined the Harlem Renaissance. It also opens the door to discuss Locke, who argued that forcing art to be propaganda stifles the very creativity that makes art valuable in the first place. But even without bringing Locke in, you can show that on Du Bois's own terms, your question about the mediocre painting is the most important question to ask. If the art is bad, it betrays the cause. So the slogan does not kill aesthetic judgment; it demands it.
