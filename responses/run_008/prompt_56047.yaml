answer: |-
  **Seminar Handout: Specifying the Performative**

  **Introduction**

  We are beginning this seminar not with a history of ideas, but with a engineering problem. Traditionally, theories of speech acts have been built to explain a specific slice of human interaction: a judge sentencing a defendant, a couple marrying, a bet being placed. These accounts assume a human speaker, a shared social convention, and a serious context. But the social reality we actually inhabit is hybrid. A huge portion of the utterances that govern our lives come from systems that are not human. When an automated email terminates your account, it performs an act with real-world consequences. When a chatbot apologizes, it mimics a speech act without a mind. When a smart contract executes, it binds parties without a handshake.

  If we treat these as edge cases, we miss the structure of modern social reality. If we treat them as central, existing theories strain. The following spec sheet outlines the requirements any adequate theory of performatives must satisfy in this hybrid environment. Do not treat these as settled truths. Treat them as demands we are placing on a theory. Some are non-negotiable constraints based on observable data; others are theoretical preferences inherited from specific philosophical camps. Your task is to see if any single framework can satisfy the whole list without breaking.

  **The Requirements**

  **1. Speaker Agnosticism**
  *Consideration:* In standard accounts, the speaker is a moral agent capable of responsibility. In our environment, the "speaker" is often a script, a bot, or an interface.
  *Requirement:* The theory must specify whether agency is a prerequisite for speaking. Can a system without moral status occupy the speaker position, or must we always trace the utterance back to a human designer? If the latter, the theory must explain how the intermediate system functions as a conduit without diluting the act.

  **2. Intentionality vs. Functionality**
  *Consideration:* Human speech acts are typically tied to psychological states (believing, intending, wishing). Automated systems have functions, not intentions. Yet, a system message saying "Access Denied" successfully denies access.
  *Requirement:* The theory must determine if the successful performance of an act requires a corresponding internal state. Is intention constitutive of the act, or is it merely a typical accompaniment? If a system lacks belief but produces the correct conventional effect, has the act occurred?

  **3. The Status of Convention**
  *Consideration:* Traditional performatives rely on pre-existing social rituals (marriage, law). Digital acts often rely on code or emerge instantly (e.g., a moderator banning a user in a new forum).
  *Requirement:* The theory must account for the source of the act's power. Does the power derive from historical social convention, or can it derive from immediate technical architecture? Can conventions be created on the fly by the utterance itself, or must they pre-exist?

  **4. Uptake and Recognition**
  *Consideration:* Austin argued that for a performative to succeed, it must secure uptake—the audience must understand what is being done. But automated acts often succeed regardless of understanding (e.g., a shadow-ban).
  *Requirement:* The theory must define the role of the hearer. Is uptake necessary for the act to exist, or only for it to be recognized? If an automated termination email goes to spam, was the account terminated?

  **5. The Etiolation Clause**
  *Consideration:* Classic theory sets aside "non-serious" uses (actors on stage, poetry, reciting) as parasitic or etiolated. However, chatbots and automated messages operate in a space that looks exactly like this: they simulate speech without "serious" human intent, yet they cause serious harm or benefit.
  *Requirement:* The theory cannot relegate these cases to a footnote. It must explain how "non-serious" or simulated utterances generate real-world consequences. If the theory requires "seriousness" as a condition, it fails to describe the actual world.

  **6. Sincerity and Expression**
  *Consideration:* When a bot says "I apologize," it expresses a state it does not hold. In human interaction, this is insincerity. In system interaction, this is standard protocol.
  *Requirement:* The theory must distinguish between the expression of a state and the possession of that state. Is sincerity a felicity condition (without which the act is void) or a normative expectation (which can be violated without voiding the act)?

  **7. Transparency and Contestability**
  *Consideration:* Human acts can be contested ("I didn't mean that," "You had no authority"). Automated acts are often opaque black boxes.
  *Requirement:* The theory must allow for a mechanism by which participants can verify whether an act succeeded. If the success conditions are hidden in proprietary code, can the act be part of a public social reality?

  **Categorization: Non-Negotiable vs. Camp Preferences**

  To proceed, we must separate what the data demands from what tradition insists upon.

  *Non-Negotiable Requirements:*
  These are constraints imposed by the reality of hybrid communication. A theory that ignores these fails descriptively.
  *   **Speaker Agnosticism (Functional):** The theory must account for the efficacy of non-human outputs. Whether you call the bot a "speaker" or a "tool," the output changes social reality.
  *   **The Etiolation Clause:** You cannot dismiss automated speech as "just simulation." It has teeth. A theory that requires "serious human intent" to define a performative cannot explain automated bans, contracts, or alerts.
  *   **Transparency:** If social reality is constructed through these acts, participants must theoretically be able to contest them. A theory that makes success conditions inherently unknowable renders the social reality magical rather than conventional.

  *Camp Preferences:*
  These are theoretical choices. Different traditions will answer these differently. None are logically forced by the data, but choosing one locks you into a specific philosophical lineage.
  *   **Intentionality:** Insisting that a mind must intend the act is an intention-based preference. Dropping this requirement moves toward conventionalism or functionalism.
  *   **Sincerity:** Treating sincerity as a felicity condition (voiding the act if fake) is a strict moralist preference. Treating it as a norm (the act stands, but the speaker is blamable) is a legalistic preference.
  *   **Pre-existing Convention:** Insisting on historical ritual is a conservative preference. Allowing code or immediate agreement to constitute convention is a constructivist preference.

  **Tensions and Incompatibilities**

  Here is the critical finding for our seminar. When we lay these requirements out side-by-side, specific pairs appear to pull against each other. It is not obvious that a single theory can satisfy the Non-Negotiables while maintaining the traditional Camp Preferences.

  **Tension 1: Intentionality vs. Etiolation**
  If you hold the Camp Preference that *Intentionality* is constitutive (a mind must intend the act), you clash with the Non-Negotiable *Etiolation Clause*. Automated systems do not have intentions. If you insist on intention, you must classify automated terminations and apologies as "not speech acts." But since they function exactly like speech acts in social reality, your theory fails to describe the world. If you drop intention to save the description, you abandon the human-centric foundation of classic theory.

  **Tension 2: Convention vs. Transparency**
  If you hold the Camp Preference that acts require *Pre-existing Convention*, you clash with the Non-Negotiable *Transparency* requirement in digital spaces. Many digital acts rely on proprietary code, not public convention. The "rules" are hidden. If the convention is not accessible to the participants, it cannot be a social convention in the public sense. A theory requiring public convention cannot account for private algorithmic governance.

  **Tension 3: The Joint Unsatisfiability Claim**
  I want to flag a specific subset of requirements that appears jointly unsatisfiable. Consider these three together:
  1.  **Strict Intentionality:** The speaker must possess the psychological state expressed.
  2.  **Automated Efficacy:** System outputs count as successful performatives.
  3.  **Human Accountability:** The act must be attributable to a moral agent for responsibility.

  You cannot hold all three.
  If you keep (1) and (2), you must attribute psychological states to machines (anthropomorphism).
  If you keep (1) and (3), you must deny that automated outputs are performatives (descriptive failure).
  If you keep (2) and (3), you must sever the link between intention and the act (abandoning strict intentionality).

  **Conclusion**

  This spec sheet is not a menu from which you can pick and choose without cost. The friction points above are not bugs; they are features of the landscape. The finding here is that the set of requirements for a theory of language in a hybrid human-machine world may be logically inconsistent if we cling to human-centric definitions of agency and intention.

  If a subset of these requirements is jointly unsatisfiable, then no single theory can cover the whole field without revision. We will either need a fragmented theory (one account for humans, another for machines) or a radical reconception of what "speaking" means. That is the work of this term. Do not look for a theory that solves this. Look for the theory that admits where it breaks.
