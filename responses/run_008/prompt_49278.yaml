prompt: |-
  I am the analytic lead for a state health technology assessment committee — the standing body that reviews clinical and economic evidence and recommends to the state health department which candidate interventions (new drugs, screening programs, telehealth expansions, staffing models) should be funded ahead of which others. Every six weeks we receive a batch of dossiers, each involving reallocations of care worth tens of millions of dollars across the state's population, and our recommendations are publicly defensible by design: they are regularly challenged at legislative hearings and in the press. The committee itself is eleven people — clinicians, a biostatistician, two patient representatives, a hospital administrator, a health economist, an ethicist — none of whom will ever work through a formal proof, all of whom must be able to explain to a skeptical legislator why one program was ranked above another. We have one three-hour meeting per batch. The secretary of health signs off on the final ranking but has asked that our reasons be structured rather than ad hoc.

  Our chair has become interested in Harsanyi's 1955 aggregation theorem and its companion impartial-observer argument: roughly, that if a social evaluator ranks risky prospects by expected utility while satisfying a Pareto condition with respect to individuals who are themselves expected-utility maximizers, the social ranking must be a weighted sum of individual cardinal utilities; and that if the evaluator instead takes each affected person's place with equal probability behind something like a veil of ignorance, the weights come out equal. The chair wants this as the spine of an actual decision procedure, not a seminar topic. Write me that procedure.

  Specifically, I need:

  1. A step-by-step procedure the committee can run on a dossier within a single three-hour meeting: the questions to ask in order, what counts as a sufficient answer to each, the points at which the procedure outputs or updates a ranking, and the points at which it must stop and flag the question as one of values for the political principals rather than one the framework can settle. As you simplify, preserve what actually does the work in Harsanyi's argument — the equal-probability construction, the expected-utility assumptions, the Pareto condition — so that committee members understand what they are committed to when they follow the procedure, and say which simplifications are safe and which quietly discard the theorem's justification. Be explicit about what the theorem does not settle: whether and how the cardinal utilities being summed are interpersonally comparable; whose utilities enter the sum (the chronically ill, future beneficiaries, taxpayers who bear the cost); and how risk attitudes should be handled — in particular, whether a person's aversion to a risky prospect is a fact about their well-being at stake or a fact about their psychology that the impartial observer should not inherit. That last question matters to us because Rawls's maximin objection to Harsanyi turns on exactly it, and my committee members reliably start talking like Rawlsians the moment a dossier contains a small probability of catastrophe.

  2. Worked applications of the procedure to three dossiers we have actually faced or expect to face:
     (a) a proposal to add critical congenital heart disease screening to the standard newborn panel — a very small expected benefit per infant, spread across essentially every birth in the state;
     (b) a gene therapy for a rare, fatal pediatric neurodegenerative condition that affects roughly two dozen children statewide at a price of several million dollars per patient, alongside dozens of cheaper competing uses of the same budget;
     (c) an expanded prostate cancer screening program that would prevent some deaths over twenty years while exposing a much larger number of men to biopsy complications, overdiagnosis, and treatment side effects.
     For case (b), I will be honest that I expect the procedure to give an answer I will not like, and I want to see whether it does, and what the procedure's own escape hatches are when it does.

  3. A candid section on where the procedure will misfire: the characteristic ways a committee using it in good faith reaches the wrong answer or no answer, the steps that are judgment calls dressed up as procedure, and what the committee should do when two runs of the procedure on the same dossier produce different rankings.

  Throughout, please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Analytic Lead for a State Health Technology Assessment (HTA) Committee.
      *   **Context:** 11-member committee (diverse backgrounds, no formal proof skills), high stakes (tens of millions, public scrutiny), tight timeline (3 hours per batch), need for defensible/structured reasoning.
      *   **Core Task:** Develop a practical decision procedure based on Harsanyi's 1955 Aggregation Theorem and Impartial Observer Argument.
      *   **Requirements:**
          1.  Step-by-step procedure (questions, sufficiency criteria, output points, flagging value judgments). Must preserve Harsanyi's core logic (equal probability, EU, Pareto) while simplifying for practice. Must address interpersonal comparability, scope of population, and risk attitudes (Harsanyi vs. Rawls).
          2.  Worked applications for three specific cases (Newborn Screening, Gene Therapy, Prostate Cancer). Case (b) needs special attention regarding potential undesirable outcomes and "escape hatches."
          3.  Candid section on failure modes (where it misfires, judgment calls disguised as procedure, handling inconsistency).
      *   **Tone:** American English, professional, pragmatic, philosophically rigorous but accessible.

  2.  **Deconstruct Harsanyi's Argument for Practical Use:**
      *   *Theorem:* Social Welfare Function (SWF) = Weighted Sum of Individual Utilities.
      *   *Impartial Observer:* If I don't know *who* I will be (veil of ignorance), I should maximize Expected Utility (EU). This implies equal weights.
      *   *Pareto:* If everyone prefers A to B, society prefers A to B.
      *   *Key Tensions for the Committee:*
          *   *Cardinality:* Utilities must be cardinal (measurable intensity), not just ordinal (ranking). QALYs/DALYs are the practical proxy here.
          *   *Interpersonal Comparability:* Harsanyi assumes this is possible. In practice, we use standardized metrics (e.g., EQ-5D).
          *   *Risk:* Harsanyi assumes the *observer* adopts the individual's risk attitude. Rawls argues for maximin (protect the worst off) because the stakes are too high to gamble with lives. The prompt specifically asks to address this.
          *   *Population:* Who counts? (Taxpayers? Future gens?). Harsanyi says "all affected."
      *   *Simplification Strategy:* We can't calculate actual EU integrals in 3 hours. We need a scoring rubric that *mimics* the logic. The "Equal Probability" becomes "Equal Weight per Person." The "Expected Utility" becomes "Expected Health Benefit (QALYs) adjusted for severity/risk."

  3.  **Drafting the Procedure (Section 1):**
      *   *Goal:* Translate abstract theory into a meeting agenda.
      *   *Step 1: Define the "Who" (Scope).* Harsanyi requires summing *all* affected utilities. We need to explicitly decide who is in the sum (patients, taxpayers, caregivers?).
      *   *Step 2: Define the "Utility" (Metric).* Need a cardinal measure. QALYs are the standard HTA proxy. Acknowledge the limitation (it assumes risk neutrality regarding health states usually).
      *   *Step 3: The Impartial Observer Calculation.* This is the core. Instead of "maximize sum," frame it as "If you had an equal chance of being anyone in the state, which option would you pick?"
      *   *Step 4: Risk Attitudes.* This is the Rawlsian flashpoint. Harsanyi says use individual risk preferences. But for public policy, we often assume risk neutrality over large populations (law of large numbers). However, for catastrophic individual risk, Rawlsian concern creeps in. The procedure needs a specific "Risk & Severity Adjustment" step where the committee can deviate from pure EU if the "catastrophe" threshold is met, but they must flag it as a *value judgment* overriding Harsanyi.
      *   *Step 5: Pareto Check.* Is there an option that makes everyone better off? (Rare in resource allocation).
      *   *Step 6: Flagging.* When do we stop? When the math says X but the ethics say Y.

  4.  **Developing the Worked Applications (Section 2):**
      *   *Case (a) Newborn Screening:* Low cost, tiny benefit per person, huge population. Harsanyi loves this (Sum of small gains > large cost). *Procedure outcome:* Fund.
      *   *Case (b) Gene Therapy:* High cost, huge benefit for few, opportunity cost for many. Harsanyi (utilitarian sum) usually rejects this compared to many small interventions (ICER thresholds). *Procedure outcome:* Likely Reject (or rank low). *Escape Hatch:* Severity weighting or "Rule of Rescue" flagged as a deviation from pure Harsanyi.
      *   *Case (c) Prostate Screening:* Mixed bag. Some gain life, some lose quality of life. Net QALYs might be negative or marginal. *Procedure outcome:* Depends on the net sum. Likely Reject if net negative.
      *   *Focus on Case (b):* The user expects to dislike the answer. I need to show *why* Harsanyi says "no" (opportunity cost) and where the committee can legally/philosophically say "yes" (by adjusting weights for severity, acknowledging this breaks strict Harsanyi but satisfies political/ethical constraints).

  5.  **Addressing Failure Modes (Section 3):**
      *   *Measurement Error:* QALYs aren't perfect cardinal utilities.
      *   *Risk Aversion:* The committee will naturally be more risk-averse than the model.
      *   *Inconsistency:* Different committees might weight severity differently. Need a calibration mechanism.
      *   *The "Veil" Illusion:* Members aren't truly impartial.
      *   *Recommendation:* Document deviations.

  6.  **Refining the Tone and Content:**
      *   *Tone:* Authoritative, clear, not overly academic but philosophically precise.
      *   *Harsanyi Nuance:* Ensure I distinguish between the *Aggregation Theorem* (weights) and the *Impartial Observer* (justification for equal weights).
      *   *Risk:* Be clear that Harsanyi assumes the observer takes on the individual's risk profile. If the individual is risk-neutral over health lotteries, the observer is too. If the committee applies maximin, they are explicitly rejecting Harsanyi's EU assumption for that case.
      *   *Interpersonal Comparability:* Acknowledge that we *assume* a QALY is a QALY across persons. This is the "safe simplification" that actually does heavy lifting.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I make it too mathematical?
      *   *Fix:* Keep the math conceptual. Use "Score" instead of "Integral."
      *   *Critique:* Did I address the Rawls objection?
      *   *Fix:* Yes, in the Risk Attitude step. Explicitly state that adopting Maximin is a *departure* from Harsanyi that must be recorded.
      *   *Critique:* Is the 3-hour constraint respected?
      *   *Fix:* Structure the steps with time allocations.
      *   *Critique:* Case (b) escape hatches.
      *   *Fix:* Ensure the "Severity Weighting" is presented as a parameter the committee sets, which allows favoring the rare disease without breaking the *structure*, even if it bends the *theorem*.

  8.  **Final Polish:** Check against all prompt requirements.
      *   Step-by-step? Yes.
      *   Questions/Sufficiency? Yes.
      *   Stop/Flag points? Yes.
      *   Harsanyi core preserved? Yes (EU, Pareto, Equal Weight).
      *   Simplifications noted? Yes.
      *   Three cases? Yes.
      *   Case (b) specific focus? Yes.
      *   Failure modes? Yes.
      *   American English? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** State Health Technology Assessment Committee
  **FROM:** Analytic Lead
  **SUBJECT:** Operationalizing the Harsanyi Impartial Observer Procedure for Dossier Review
  **DATE:** October 26, 2023

  ### Executive Summary

  The Chair has requested we adopt John Harsanyi's 1955 Aggregation Theorem and Impartial Observer Argument as the structural spine of our decision-making. This is a robust choice. It provides a defensible philosophical basis for cost-effectiveness analysis (utilitarianism) while demanding we treat every citizen's health interests equally (the veil of ignorance).

  However, Harsanyi's theorem is a mathematical proof, not a checklist. To use it in a three-hour meeting without reducing it to a slogan, we must translate its axioms into procedural steps. The core commitment we are making is this: **We will rank interventions based on the sum of expected health benefits across all affected individuals, weighting each person equally, unless we explicitly vote to deviate based on severity or risk.**

  Below is the procedure, the worked applications, and a candid assessment of where this framework will strain.

  ---

  ### Part 1: The Harsanyi-Impartial Observer Procedure (HIOP)

  **Time Allocation:** 180 Minutes per Batch
  **Goal:** Produce a ranked list of interventions with a documented rationale for any deviation from the "Expected Utility Sum."

  #### Phase 1: Scope and Population (30 Minutes)
  *Harsanyi Axiom: The Social Welfare Function sums the utilities of all affected individuals.*

  **Step 1.1: Define the "Affected Population"**
  *   **Question:** Whose utility enters the sum?
  *   **Procedure:** The Committee must affirm the standard scope: All state residents who experience a change in health status or financial burden (taxes/premiums).
  *   **Sufficiency Criterion:** A simple majority vote confirms the scope.
  *   **Flag Point:** If a member argues that *only* patients count (ignoring taxpayers) or *only* current citizens count (ignoring future births), this is a value judgment outside the theorem. Record the objection, but default to "All Affected" to maintain the impartial observer stance.

  **Step 1.2: Confirm the Utility Metric (Cardinality)**
  *   **Question:** Are we using a cardinal measure of health benefit?
  *   **Procedure:** We adopt Quality-Adjusted Life Years (QALYs) as the proxy for cardinal utility.
  *   **Simplification Note:** Harsanyi requires *von Neumann-Morgenstern* utilities (measured under risk). QALYs are typically time-trade-off based. We accept this as a "safe simplification" provided we acknowledge that 1 QALY for Person A is treated as equivalent to 1 QALY for Person B (Interpersonal Comparability).
  *   **Commitment:** By using QALYs, we commit to the view that a year of life in a specific health state has a measurable value that can be summed across persons.

  #### Phase 2: The Impartial Observer Calculation (90 Minutes)
  *Harsanyi Axiom: The evaluator chooses as if they have an equal probability of being any member of the affected population.*

  **Step 2.1: Calculate Expected Health Benefit (EHB)**
  *   **Question:** What is the total expected QALY gain for the population?
  *   **Procedure:** Staff presents the total net QALYs (Benefit minus Harm) multiplied by the number of people affected.
      *   *Formula:* $EHB = \sum (Probability\_of\_Outcome \times QALY\_Change \times N\_People)$
  *   **Sufficiency Criterion:** Staff must provide confidence intervals. If the interval crosses zero, the dossier moves to "Uncertain."

  **Step 2.2: Calculate Resource Cost (The Constraint)**
  *   **Question:** What is the opportunity cost?
  *   **Procedure:** Convert budget impact into "foregone QALYs" elsewhere in the system.
      *   *Formula:* $Cost\_QALYs = Budget\_Impact / System\_Cost\_Per\_QALY$
  *   **Commitment:** This satisfies the Pareto condition. Spending money here means spending less there. We must account for the utility lost by those denied care elsewhere.

  **Step 2.3: The Net Social Utility Score**
  *   **Question:** What is the net sum?
  *   **Procedure:** $Score = EHB - Cost\_QALYs$.
  *   **Ranking:** Interventions are tentatively ranked by Score.
  *   **Harsanyi Logic:** If you had a 1-in-3-million chance of being any citizen in this state, you would choose the intervention with the highest Net Social Utility Score to maximize your expected well-being.

  #### Phase 3: Risk, Severity, and Deviations (45 Minutes)
  *Harsanyi Axiom vs. Rawlsian Objection: Should the observer adopt the individual's risk attitude?*

  **Step 3.1: The Risk Attitude Check**
  *   **Question:** Does this intervention involve a small probability of catastrophic loss for specific individuals?
  *   **Procedure:** Identify if any subgroup faces a high-magnitude negative utility (e.g., severe complication, death due to false positive) with low probability.
  *   **Harsanyi Stance:** The Impartial Observer should be risk-neutral over large populations (Law of Large Numbers). We sum the expectations.
  *   **Rawlsian Objection:** If the "loss" is death or irreversible disability, the Observer should be risk-averse (Maximin).
  *   **Decision Rule:** If the Committee wishes to apply a "Risk Penalty" to an intervention due to catastrophic individual risk, they must vote to **Override the EU Assumption**.
  *   **Flag Point:** This is the critical escape hatch. If you vote to penalize risk beyond the expected utility calculation, you are explicitly departing from Harsanyi to accommodate Rawlsian concerns. This must be recorded as a "Severity/Risk Adjustment."

  **Step 3.2: The Severity Weighting (The "Rule of Rescue")**
  *   **Question:** Do we weight QALYs gained by the severely ill more heavily than QALYs gained by the mildly ill?
  *   **Procedure:** Harsanyi's standard theorem implies equal weights (1 QALY = 1 QALY). However, modified social welfare functions allow severity weights.
  *   **Decision Rule:** The Committee may apply a multiplier (e.g., 1.5x) to QALYs for patients with life expectancy < 5 years.
  *   **Flag Point:** Applying a multiplier is a **Value Judgment**, not a mathematical derivation from the 1955 theorem. It violates strict utilitarian aggregation to satisfy egalitarian intuitions. It is permissible, but must be flagged as "Equity Adjustment."

  #### Phase 4: Final Ranking and Political Flagging (15 Minutes)
  *Harsanyi Axiom: Pareto Condition.*

  **Step 4.1: Pareto Check**
  *   **Question:** Is there an alternative that yields higher Net Social Utility without making any specific subgroup worse off?
  *   **Procedure:** If yes, select it. (Rare in budget reallocation).

  **Step 4.2: Political Flagging**
  *   **Question:** Does the ranking conflict with legislative mandates or public sentiment?
  *   **Procedure:** If the top-ranked intervention is politically toxic (e.g., denying gene therapy to children), flag it for the Secretary.
  *   **Output:** A ranked list with annotations: "Derived via HIOP," "Adjusted for Severity," or "Adjusted for Risk Aversion."

  ---

  ### Part 2: Worked Applications

  Here is how the HIOP runs on three representative dossiers.

  #### Case (a): Newborn Critical Congenital Heart Disease (CCHD) Screening
  *   **Profile:** Cost $10 per infant. Benefit: Detects rare defect, prevents death/disability. Benefit per infant is tiny (probability is low), but population is huge (all births).
  *   **HIOP Run:**
      1.  **Population:** All newborns (~50,000/year).
      2.  **EHB:** (Probability of Defect × QALYs Saved) × 50,000. Even with low probability, the aggregate QALYs are significant.
      3.  **Cost:** Low per unit. Foregone QALYs elsewhere are minimal.
      4.  **Net Score:** Strongly Positive.
      5.  **Risk/Severity:** No catastrophic risk to the infant from the screen itself.
  *   **Result:** **Rank 1 (Fund).**
  *   **Harsanyi Justification:** Behind the veil of ignorance, you are most likely to be a healthy baby. But even if you are the sick baby, the expected value is massive. The sum of small benefits across many outweighs the small cost. This is the "easy" case for utilitarianism.

  #### Case (b): Gene Therapy for Rare Pediatric Neurodegenerative Condition
  *   **Profile:** 24 children statewide. Cost $3M/patient ($72M total). Benefit: Life extension + quality of life for these 24. Competing uses: Chronic disease management for thousands.
  *   **HIOP Run:**
      1.  **Population:** 24 patients vs. Statewide population bearing cost.
      2.  **EHB:** High QALY gain per patient (e.g., 10 QALYs each = 240 Total QALYs).
      3.  **Cost:** $72M. At a standard threshold of $150,000/QALY, this budget could generate 480 QALYs elsewhere in the system.
      4.  **Net Score:** Negative (240 gained - 480 foregone = -240).
      5.  **Rawlsian Tension:** The 24 children face certain death without treatment. The "losers" elsewhere face marginal reductions in care.
  *   **Result:** **Rank Low (Do Not Fund) — *Under Strict Harsanyi*.**
  *   **Why you might dislike this:** It feels cruel to deny the 24 children to save a larger number of QALYs elsewhere.
  *   **The Escape Hatch:**
      *   **Severity Adjustment:** The Committee can vote to apply a **Severity Weight**. If we weight QALYs for terminal pediatric conditions at 2.0x, the gain becomes 480 QALYs. The score breaks even.
      *   **Procedural Requirement:** To do this, you must vote to **Override the Equal Weight Axiom**. You are acknowledging that Harsanyi's strict sum does not capture our moral intuition about "rescuing the identifiable victim."
      *   **Recommendation:** If the Committee funds this, do not claim Harsanyi supports it. Claim that the Committee has *amended* the Social Welfare Function to include a "Priority for the Worst Off" constraint. This preserves intellectual honesty for legislative defense.

  #### Case (c): Expanded Prostate Cancer Screening
  *   **Profile:** Men aged 55-70. Prevents some deaths (long term). Causes biopsies, incontinence, impotence in many (overdiagnosis).
  *   **HIOP Run:**
      1.  **Population:** ~500,000 men.
      2.  **EHB:** Complex calculation. (Lives Saved × QALYs) MINUS (Complications × QALY Loss).
      3.  **Risk Attitude:** This is where risk matters. If men are risk-averse regarding cancer death, they might value the screen highly. If they are risk-averse regarding sexual function, they might value it lowly.
      4.  **Harsanyi Stance:** Use population-average utility weights for health states (incontinence, etc.). Do not privilege the fear of cancer over the fear of side effects unless evidence shows the population does.
      5.  **Net Score:** Often marginal or negative in HTA literature due to overdiagnosis.
  *   **Result:** **Rank Low/Medium.**
  *   **Flag Point:** If the Committee rejects this despite positive net QALYs because "men have a right to know," that is a **Rights-Based Objection**, not a Harsanyi one. Harsanyi only cares about the *outcome* utility, not the *process* right. Flag this as a "Liberty Constraint."

  ---

  ### Part 3: Failure Modes and Candid Assessment

  Using the HIOP in good faith does not guarantee correct or consistent answers. Here is where the procedure will misfire, and how to manage it.

  #### 1. The "Cardinality Illusion"
  *   **The Problem:** Harsanyi requires cardinal utility (intensity of preference). QALYs are an imperfect proxy. A QALY gained by a 20-year-old is not necessarily psychologically equivalent to a QALY gained by an 80-year-old, though the math treats them as such.
  *   **The Risk:** The Committee treats the QALY score as a physical constant (like meters) rather than a moral construct.
  *   **Mitigation:** In Phase 1, explicitly state: "We are treating QALYs as cardinal for the purpose of this vote, acknowledging this is a simplification."

  #### 2. The Rawlsian Reversion (Risk Aversion)
  *   **The Problem:** As noted in Case (b), committee members will instinctively revert to Maximin (protect the worst off) when faces are identifiable. Harsanyi's EU model will tell them to ignore the identifiability.
  *   **The Risk:** Members will fudge the numbers (inflating the QALY gain for the gene therapy) to make the Harsanyi math work, rather than admitting they are overriding the math.
  *   **Mitigation:** The "Severity Adjustment" vote (Phase 3.2) must be a separate, recorded vote. Do not allow the analysts to bake the weight into the initial QALY calculation. Force the Committee to say: "The math says No; our values say Yes."

  #### 3. Inconsistency Across Batches
  *   **The Problem:** Committee A might apply a 1.5x severity weight to pediatric cases in Batch 1. Committee B (or the same committee in a different mood) might apply 1.2x in Batch 4.
  *   **The Risk:** The procedure loses defensibility if the "value parameters" drift ad hoc.
  *   **Mitigation:** Establish a **Calibration Log**. If you vote for a Severity Weight or Risk Penalty, record the magnitude. The Chair should review this log quarterly to ensure we aren't applying Harsanyi selectively to fit desired outcomes.

  #### 4. The "Veil" is Porous
  *   **The Problem:** The patient representatives and clinicians on the committee are *not* impartial observers. They have fiduciary duties to specific groups.
  *   **The Risk:** The "Equal Probability" assumption is violated by design because the members are advocates.
  *   **Mitigation:** During Phase 2, the Chair must explicitly invoke the veil: "For this calculation, assume you do not know if you are the patient, the taxpayer, or the competitor for resources." If a member argues solely from their constituency's view, rule their point out of order for the Calculation Phase (it belongs in the Political Flagging Phase).

  #### 5. When Two Runs Produce Different Rankings
  *   **The Scenario:** We review a dossier in Session 1 and rank it #1. In Session 2 (perhaps with different attendance), we rank it #3.
  *   **The Diagnosis:** This indicates the "Value Parameters" (Severity Weights, Risk Penalties) are unstable.
  *   **The Fix:** Freeze the Parameters. Once the Committee sets a Severity Weight for "Terminal Pediatric Conditions," that weight stands for the fiscal year unless a supermajority votes to change it. This separates *parameter setting* (legislative-style) from *dossier review* (judicial-style).

  ### Closing Recommendation

  The Chair wants Harsanyi because it forces us to be utilitarian when it is easy and explicit when we choose not to be.

  Adopt the procedure as written. It will likely tell you not to fund the gene therapy (Case B) under strict rules. When that happens, do not break the procedure. Use the **Severity Adjustment** escape hatch. Vote to override the equal weighting.

  This achieves the Chair's goal: a structured reason. You can tell the legislator: *"Under a strict impartial observer model, the budget saves more lives elsewhere. However, this Committee voted to apply a severity weight to pediatric terminal conditions, prioritizing the worst-off over the greatest number. Here is the vote count on that value judgment."*

  That is a defensible position. It is honest about the math and honest about the morality.
