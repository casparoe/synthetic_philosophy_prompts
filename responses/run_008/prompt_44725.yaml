answer: |-
  You have independently rediscovered a central fault line in the philosophy of mind. There is no single catchy noun (like "The Godel Effect") for the specific inverse relationship you noticed between descriptive granularity and conceivability, but the phenomenon is well-documented, rigorously debated, and has a technical vocabulary.

  Here is the breakdown of what you found, who works on it, and how it impacts the zombie argument.

  ### 1. The Technical Name: Positive vs. Negative Conceivability
  The distinction you are drawing is formally known in the literature as the difference between **Positive Conceivability** and **Negative Conceivability**.

  *   **Negative Conceivability:** You cannot find a contradiction in the proposition. (e.g., "A physical duplicate without experience" contains no logical contradiction like "a square circle.") This corresponds to your "coarse grain" version. It is effortless because it is just checking for logical consistency.
  *   **Positive Conceivability:** You can construct a coherent, detailed mental model of the scenario. This corresponds to your "fine grain" version. This is where you are noticing the failure.

  Your observation is that **Positive Conceivability decays as descriptive resolution increases.** When you try to positively conceive a zombie at high resolution, the "no experience" part ceases to be a simulated feature and becomes a **stipulative label**.

  In the literature, this is often called the **"Stipulation Objection"** or the failure of **"Imaginative Simulation."**

  ### 2. The Literature and Key Players
  Since you want to know who works on this directly:

  **Daniel Dennett** is the primary antagonist to the zombie argument and explicitly makes your point.
  *   **Key Text:** *"The Unimagined Preposterousness of Zombies"* (1995) and *Consciousness Explained*.
  *   **His Argument:** Dennett argues that when people think they are conceiving a zombie, they are actually conceiving a "partial zombie" (a being that lacks some functional capacity) or they are merely uttering the words without a genuine mental model. He calls the zombie intuition an **"intuition pump"** that only works if you don't look too closely at the mechanics.
  *   **Relevance to you:** Dennett would say your experience of the "caption" is the smoking gun. If you can't simulate the "darkness" alongside the physics, you aren't actually conceiving it; you're just asserting it.

  **David Chalmers** is the proponent of the zombie argument who formalized the terms above.
  *   **Key Text:** *The Conscious Mind* (1996) and *"Does Conceivability Entail Possibility?"* (2002).
  *   **His Defense:** Chalmers acknowledges your observation. He admits that *ideal* positive conceivability is hard. However, he argues that **Negative Conceivability** is sufficient for metaphysical possibility. He would argue that your inability to *simulate* the darkness doesn't prove it's impossible, only that your cognitive architecture is designed to simulate minds as conscious. He distinguishes between "1st-pass conceivability" (prone to error) and "2nd-pass conceivability" (idealized rational reflection).

  **Keith Frankish** and **Peter Carruthers** (Illusionists).
  *   **Key Text:** Frankish's *"The Illusion of Consciousness"* papers.
  *   **Relevance:** They argue that "phenomenal consciousness" (the inner life) is a user-illusion generated by the brain. Your observation supports them: you can't conceive of the physics without the experience because the experience *is* the brain's way of modeling that physics for itself. To remove the experience is to break the model.

  ### 3. Coining a Term (If you need one)
  Since there isn't a specific law named after this inverse relationship, if you want to discuss this in engineering or interdisciplinary terms, you could call it **"Resolution-Dependent Conceivability"** or **"The Granularity Constraint on Simulation."**

  **Definition:** The cognitive friction encountered when attempting to maintain a stipulative property (e.g., "no inner life") in a mental model as the structural fidelity of that model increases.
  **Edge Case:** It hits **phenomenal concepts** (pain, redness, qualia) hardest because we access them via simulation. It hits **theoretical identities** (Water = H2O) differently (see below).

  ### 4. The Water/H2O Question
  You asked: *Does this hit any claim that rides on top of a description, like imagining a glass of water that isn't H2O?*

  This is the crux of **Saul Kripke's** argument in *Naming and Necessity* (which you alluded to).

  *   **Water/H2O:** If you specify the physics fully (two hydrogens, one oxygen, bond angles, etc.), you *cannot* coherently stipulate "this is not water." Water *is* that structure. If you say "it's not water," you are contradicting the definition.
  *   **Pain/C-Fibers:** Kripke argued that unlike water, pain is picked out by **how it feels**. So when you imagine the C-fibers firing without the pain, you aren't imagining the *referent* of pain without the referent; you are imagining the physical state without the *mode of presentation*.

  **Your observation refines Kripke:** You are noticing that at high resolution, the "mode of presentation" (the feeling) becomes functionally indistinguishable from the processing itself.
  *   **Scope:** This constraint applies most strongly to **first-person access concepts**. You can imagine a clockwork universe without "inner life" easily because you view it from the outside. You cannot imagine *yourself* (or a perfect duplicate of yourself) from the inside without experience, because "from the inside" *means* "with experience."

  So, the constraint is specific to **phenomenal concepts**. You *can* imagine water isn't H2O at coarse grain ("clear liquid that isn't H2O"), but at fine grain, the stipulation breaks. The difference is that with zombies, proponents claim the stipulation *holds* even at fine grain. Your intuition says it doesn't.

  ### 5. Practical Implication: Which Reply is Right?
  You asked: *Does this show the zombie argument's persuasive force depends on keeping the description vague?*

  **Yes.** This is the consensus among materialist critics. The zombie argument is an artifact of **low-resolution modeling**.

  **Which reply is the right one?**
  *   **Option A ("Coarse is fine"):** This is Chalmers' position. He argues that logical possibility doesn't require detailed simulation, only the absence of contradiction. If you can't find a contradiction in "Physical Duplicate + No Experience," it's possible.
  *   **Option B ("Fine is the real test"):** This is Dennett's position (and arguably yours). If the "no experience" clause becomes a mere caption at high resolution, then you haven't actually conceived the thing. You've conceived a physical duplicate and *said* "no experience" out loud.

  **The Verdict:**
  From a software engineering perspective, **Option B is the stronger architectural critique.**
  If you have a system where `Output = f(Physics)` and `Report = "I am conscious"`, and you simulate the physics perfectly, the system *will* report consciousness. To say "but it's not *really* conscious" is to posit a variable `IsReallyConscious` that has no causal impact on the physics.

  If `IsReallyConscious` has no causal impact, it is **epiphenomenal**.
  If it is epiphenomenal, you could remove it, and the physics would be identical.
  But if the physics are identical, your behavior (including writing papers about zombies) is identical.
  So why do you believe you have it?

  Your observation—that the "no inner life" part feels like a caption—is the introspective recognition of **epiphenomenalism**. You are noticing that in your simulation, the "experience" is doing no work; it's just a label.

  **Summary for your toolkit:**
  1.  **Term:** Failure of **Positive Conceivability** at high resolution.
  2.  **Phenomenon:** **Stipulative Conceivability** (attaching a label vs. simulating a state).
  3.  **Key Adversary:** **Daniel Dennett** (read *"Quining Qualia"*).
  4.  **Key Proponent:** **David Chalmers** (read *"Does Conceivability Entail Possibility?"* to see the counter-argument).
  5.  **Conclusion:** The zombie argument relies on the cognitive gap between coarse functional description and fine-grained simulation. Your intuition that the gap closes at high resolution is a standard and robust materialist objection. You aren't missing a name; you're doing philosophy.
