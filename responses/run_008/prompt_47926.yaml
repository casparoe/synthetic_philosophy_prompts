answer: |-
  The pattern you describe exposes a fracture in the normative architecture of the modern militia state. To analyze it, we must distinguish between the *legitimating rhetoric* (the "People's Army"), the *legal status of citizens* (equal rights), and the *administrative practice* (gendered conscription). The implicit theory attempting to bind these together is a hybrid of **Civic-Republicanism** and **Paternalistic Protectionism**, but these components are no longer logically compatible given the grant of full political rights to women.

  ### 1. Exchange vs. Civic-Republican Theory
  The militia model explicitly invokes a **Civic-Republican** theory: legitimacy flows from the fact that the army *is* the people in arms, and citizenship is constituted by the willingness to defend the polity. In a pure Republican framework, exemption from the constitutive duty implies a deficiency in citizenship status (as historically seen with non-property owners or slaves).

  However, the gender asymmetry forces a contradiction. Switzerland and Finland grant women full political rights (voting, office), signaling they are full citizens. Yet, they are exempt from the constitutive duty.
  *   **If the theory were Exchange:** Men "purchase" full citizenship with blood; women receive rights as a gift or via taxation. This undermines the Republican claim that the army is legitimate *because* the burden is universal. It turns the militia into a male tax.
  *   **If the theory were Republican:** Women are ostensibly full citizens but are excluded from the activity that *makes* one a citizen in the martial sense. This creates a two-tier citizenship: "Active Citizens" (men, who defend) and "Passive Citizens" (women, who are defended).

  The practice cannot publicly state this two-tier reality without collapsing the "People's Army" rhetoric. If the duty flows from citizenship *as such*, exempting half the citizens suggests the polity believes the duty tracks **biological sex** rather than **membership**. The implicit theory is that the *capacity for violence* is the true marker of political agency, and this capacity is naturally male. This sits comfortably with 19th-century republicanism but contradicts the 20th-century legal reality of gender-equal citizenship.

  ### 2. Ontology vs. Manpower
  Is the exemption about women or manpower? If it were purely a **Manpower Calculation** (the state claims the bodies it needs), the practice would be philosophically underdetermined. A lottery system among all citizens, or a fitness-based draft regardless of sex, would license the same manpower outcome without sex-based classification.
  *   **The Presupposition:** The choice to use *sex* as the proxy for liability, rather than fitness or lottery, presupposes a normative claim: men are the *default* defenders, and women are the *exception*.
  *   **The "Protection" Racket:** This is not merely pragmatic; it is ontological. It relies on a **Paternalistic Theory**: the state (via men) protects the homeland, which includes women. Women are the *objects* of security, not the *subjects*.
  *   **Public Rhetoric:** This belief cannot be stated publicly in a modern equality regime. To say "women are too valuable to risk" (reproductive role) or "men are naturally stronger" contradicts the premise of equal rights and the proven capability of female volunteers. Thus, the practice relies on a **silent presupposition**: it treats a normative gender role as a natural fact to avoid admitting that the "universal" burden is actually particular.

  ### 3. Reading the Nordic Reforms
  The Norwegian and Swedish reforms clarify the theoretical landscape by resolving the tension Switzerland retains.
  *   **Correction vs. Expansion:** The shift to gender-neutral conscription should be read as a **Correction of Inconsistency**. The older systems *did* presuppose a sex-based theory of duty (Patriarchal Republicanism). As the legal definition of citizenship shifted to strict equality, the old theory became untenable.
  *   **The Divergence:** Sweden and Norway aligned the *duty* with the *right* to restore Civic-Republican consistency. Switzerland and Finland have chosen to retain the *inconsistency*, prioritizing traditional social structures over theoretical coherence. The Nordic reforms prove that the civic theory *can* be universal, which demonstrates that the male-only model was never a strict requirement of the militia concept itself, but a contingent historical artifact of gender roles.

  ### Consistency Assessment
  The practice rests on three commitments:
  1.  **Legal Equality:** Men and women are equal citizens with equal rights (Constitutional).
  2.  **Republican Legitimacy:** The army is legitimate because the burden of defense falls on the citizenry universally (Ideological).
  3.  **Gendered Liability:** The burden of defense falls on men only (Administrative).

  These commitments cannot all be true at once.
  *   If (1) and (2) are true, (3) must be false (women must serve).
  *   If (1) and (3) are true, (2) must be false (the army is not universally representative, undermining the specific claim to legitimacy).
  *   If (2) and (3) are true, (1) must be false (women are not full citizens in the relevant martial sense).

  Switzerland and Finland maintain all three by masking the contradiction with silence or pragmatic excuses ("manpower"). Sweden and Norway removed the contradiction by aligning (3) with (1). The pattern as a whole reveals that the male-only conscription model is theoretically incompatible with modern equal citizenship under a Republican justification. The parts of the practice presuppose commitments (Equality vs. Gendered Duty) that are mutually exclusive.

  \answer{INCONSISTENT}
