      *   **Requirements:**
          1.  Numbered section of *Agreed Claims* (convergence points, why it matters).
          2.  *Exact Disagreements* (neutral phrasing, no smuggling premises).
          3.  *The Cruxes* (fundamental theoretical divides, e.g., nature of the claim, indeterminacy).
          4.  *Test Cases/Predictions* (concrete scenarios where they predict different outcomes, recorded *ex ante*).
          5.  *Verbal Disputes* (identify if terminology is the real issue).
          6.  **Tone/Style:** Symmetrical, binding (no take-backs), no drafting slips, balanced concessions. Signed by both.

  2.  **Deconstruct the Theoretical Positions:**
      *   **AAI (All-Affected Interests):**
          *   *Strength:* Moral intuition that impact creates a claim. Handles transnational issues (climate, trade).
          *   *Weakness:* "Butterfly effect" problem (everything affects everyone). Operational difficulty.
      *   **ASC (All-Subjected to Coercion):**
          *   *Strength:* Clearer boundary (jurisdiction/legal authority). Ties to legitimacy of force.
          *   *Weakness:* Arbitrary borders. Excludes those impacted but not legally coerced (e.g., foreigners affected by trade policy).

  3.  **Drafting - Section by Section:**

      *   **Header:** Needs to look formal, like a seminar handout or a pre-commitment document. Title: "Joint Statement on the Boundary Problem."

      *   **Section 1: Agreed Claims (Common Ground):**
          *   Need to establish that this isn't just semantics.
          *   Need to acknowledge the normative stakes (legitimacy, justice).
          *   *Convergence:* Long-term residents (both agree they should be in). Children (both agree they are tricky but need representation). The fact that *some* boundary is necessary (anarchy isn't an option).
          *   *Phrasing:* "We agree that..."

      *   **Section 2: Exact Disagreements (Neutral Phrasing):**
          *   *Challenge:* Avoid "The demos *should* track interests" (AAI bias) or "Coercion is the *only* trigger" (ASC bias).
          *   *Strategy:* Frame as competing necessary/sufficient conditions.
          *   *Drafting:* "Party A holds that X is sufficient. Party B holds that X is necessary but not sufficient..." Wait, better to keep it symmetrical. "Disagreement 1: The Trigger for Inclusion." "Disagreement 2: The Scope of Application."
          *   *Refinement:* Let's focus on the *ground* of the right to vote. A: Impact generates the right. B: Subjection generates the right.

      *   **Section 3: The Cruxes (Theoretical Divides):**
          *   *Crux 1 (Nature of the Claim):* Is it about avoiding harm (AAI) or justifying force (ASC)?
          *   *Crux 2 (Indeterminacy):* Is vagueness fatal? B says AAI is too vague to function. A says ASC is morally arbitrary.
          *   *Refinement:* Let's stick to the prompt's suggestions but sharpen them.
              *   Crux 1: Normative Ground (Impact vs. Coercion).
              *   Crux 2: Feasibility/Indeterminacy (Is "unbounded" a refutation?).

      *   **Section 4: Test Cases & Predictions (The "Bet"):**
          *   Need cases where they diverge.
          *   *Case 1: Transnational Environmental Policy.* (AAI: Foreigners affected get vote. ASC: Only citizens/residents coerced).
          *   *Case 2: The Tourist.* (AAI: Minor impact, no vote. ASC: Subject to laws while there, maybe vote on local issues? Actually, ASC usually says tourists aren't *subjected* in the full sense. Let's pick a better one).
          *   *Case 3: Citizens Abroad (Expats).* (ASC: Still subject to some laws/taxes? AAI: Affected by home policy?).
          *   *Case 4: Sanctions on a Third Country.* (AAI: People in sanctioned country affected. ASC: Not coerced by the sanctioning state).
          *   *Selection:* Let's go with (1) Foreigners affected by Trade/Climate Policy, and (2) Non-Resident Citizens (Expats).
          *   *Predictions:* Must be specific. "A predicts inclusion. B predicts exclusion."

      *   **Section 5: Verbal Disputes (Terminology):**
          *   Address the definition of "Affected."
          *   Address the definition of "Coercion."
          *   If they agree on definitions, does the gap close? Likely not fully, but narrow it.

      *   **Signatures:** Essential for the "binding" feel.

  4.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is the language too biased toward A or B?
      *   *Check:* In Section 2, ensure B doesn't sound like they are defending the status quo, and A doesn't sound like they are defending moral universalism too strongly.
      *   *Check:* In Section 4, ensure the predictions are falsifiable within the context of the seminar.
      *   *Tone:* Academic, precise, slightly legalistic (to prevent weaseling).
      *   *Prompt Constraint:* "Don't let one side get all the good concessions." Make sure B admits AAI has moral pull, and A admits ASC has practical pull.
      *   *Prompt Constraint:* "No drafting slips." The document must look final.

  5.  **Final Polish:**
      *   Add a preamble explaining the purpose (to structure the debate).
      *   Ensure the "Verbal Disputes" section acknowledges the professor's hunch without validating it as the *whole* truth.
      *   Make sure the "Cruxes" clearly identify *why* they disagree, not just *what*.

  6.  **Final Output Generation:** (Proceeding to draft the document based on these thoughts.)
answer: |-
  **JOINT STATEMENT ON THE BOUNDARY PROBLEM**
  **Course:** POLS 605: Democratic Theory Seminar
  **Parties:** Proponent of All-Affected Interests (AAI) / Proponent of All-Subjected to Coercion (ASC)
  **Date:** October 24, 2023
  **Status:** Binding Pre-Commitment for Adversarial Collaboration

  **PREAMBLE**
  We, the undersigned, acknowledge that our previous debates regarding the constitution of the *demos* have suffered from talking past one another, rhetorical escalation, and shifting definitions. To remedy this, we submit this joint statement. We agree to treat this document as the fixed framework for our remaining seminar contributions. We concede that neither principle is self-evident, that both face serious counter-examples, and that the goal of this collaboration is not to declare a winner but to isolate the precise normative and empirical fault lines between our positions.

  ### I. AGREED CLAIMS (COMMON GROUND)
  *We affirm the following propositions as shared premises. Neither party will argue against these in subsequent sessions.*

  1.  **The Normative Stakes:** We agree that the boundary problem is not merely definitional or procedural. It is a question of legitimacy. A democratic decision is illegitimate if the boundary of the *demos* is drawn arbitrarily to exclude those with a valid claim to inclusion.
  2.  **The Necessity of a Boundary:** We agree that a *demos* without any boundary is impossible. Democratic decision-making requires a defined set of decision-makers. Therefore, some principle of exclusion is necessary, even if that principle is morally regrettable.
  3.  **Convergence on Long-Term Residents:** We agree that long-term resident non-citizens (guest workers) possess a strong claim to inclusion.
      *   *AAI Concession:* We acknowledge that resident non-citizens are subject to coercive state authority.
      *   *ASC Concession:* We acknowledge that resident non-citizens have significant interests affected by local policy.
      *   *Joint Conclusion:* On this specific case, both principles yield the same result (inclusion). Disagreement here is not about the *outcome*, but the *justification*.
  4.  **Convergence on Children:** We agree that children present a hard case for both sides.
      *   *Joint Conclusion:* Neither "interests" nor "coercion" automatically solves the question of *how* children are included (e.g., proxy voting vs. guardianship). We agree this requires a supplementary theory of competence or representation, regardless of which boundary principle is adopted.
  5.  **Rejection of Status Quo Bias:** We agree that existing borders are not morally decisive. The fact that a person is currently outside a border does not settle the question of whether they *ought* to be inside the *demos*.

  ### II. EXACT DISAGREEMENTS
  *The following statements describe our divergence. We agree that these are accurate descriptions of our respective positions. Neither party will characterize the other's position as a straw man.*

  1.  **The Trigger for Inclusion:**
      *   **AAI Position:** The fact that a decision significantly alters an individual's life prospects (interests) generates a pro-tanto claim to participate in that decision.
      *   **ASC Position:** The fact that an individual is legally bound to comply with a decision under threat of sanction (coercion) generates a pro-tanto claim to participate in that decision.
      *   **Disagreement:** AAI holds that coercion is neither necessary nor sufficient for inclusion (one can be affected without being coerced). ASC holds that affected interest is neither necessary nor sufficient for inclusion (one can be affected without having a claim, and one can be coerced without having a strong interest).
  2.  **The Scope of the Principle:**
      *   **AAI Position:** The boundary of the *demos* should be fluid, expanding or contracting based on the specific issue at hand (issue-specific demos).
      *   **ASC Position:** The boundary of the *demos* should be stable and institutional, tied to the jurisdiction of the coercive authority (institutional demos).
      *   **Disagreement:** AAI prioritizes moral accuracy regarding impact. ASC prioritizes institutional feasibility and the specific relationship of political obligation.

  ### III. THE CRUXES
  *We identify the following two theoretical nodes as the primary drivers of our dispute. Resolution of the boundary problem depends on resolving these.*

  **Crux 1: The Normative Ground (Harm vs. Force)**
  *   **The Question:** Does the democratic right to vote exist primarily to protect individuals from harmful outcomes (AAI), or to justify the imposition of force upon them (ASC)?
  *   **AAI Stance:** Democracy is a tool for welfare protection and justice. If a policy harms you, you need a say to prevent injustice, regardless of whether that policy is enforced via police power.
  *   **ASC Stance:** Democracy is a tool for legitimating authority. Coercion requires special justification that mere causal impact does not. Being harmed by a market fluctuation is regrettable; being jailed for violating a law you had no say in is illegitimate.

  **Crux 2: The Indeterminacy Objection (Vagueness vs. Arbitrariness)**
  *   **The Question:** Is the vagueness of a principle fatal to its validity?
  *   **ASC Stance:** The "All-Affected" principle is operationally fatal because causal chains are infinite (the butterfly effect). If we cannot empirically identify the *demos* prior to the vote, the principle is useless.
  *   **AAI Stance:** Vagueness is a feature of all moral principles (including "coercion"). The fact that "affected interests" are hard to measure does not negate the moral claim. Conversely, the "Coercion" principle is morally arbitrary because it relies on contingent legal borders that may not match moral reality.

  ### IV. TEST CASES AND EX ANTE PREDICTIONS
  *To prevent retrofitting, we commit to the following predictions regarding hard cases. If a case arises in seminar discussion, we will refer to this record.*

  | Test Case | Description | AAI Prediction (Inclusion?) | ASC Prediction (Inclusion?) | Justification for Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Climate Voter** | A citizen of a small island nation facing inundation due to the carbon policy of a large continental state. They are not subject to the large state's laws. | **YES.** Their vital interests (life/home) are decisively affected by the policy. | **NO.** They are not subject to the coercive authority of the large state's legislature. | **AAI:** Impact creates the claim.<br>**ASC:** No legal obligation to comply = no claim. |
  | **2. The Non-Resident Citizen** | A citizen living permanently abroad who pays no taxes and is rarely enforced upon, but retains a passport. | **MAYBE.** Depends on if home policy affects their welfare (e.g., consular protection). | **YES.** They remain subject to the state's coercive authority (laws follow citizenship, e.g., taxation/treason). | **AAI:** Interest varies by policy.<br>**ASC:** Legal subjection is constant regardless of location. |
  | **3. The Sanctioned Foreigner** | A civilian in a third-country targeted by economic sanctions. They suffer economic harm but are not legally coerced by the sanctioning state. | **YES.** Sanctions intentionally alter their life prospects. | **NO.** They are not under the jurisdiction of the sanctioning state. | **AAI:** Intentional harm creates a claim.<br>**ASC:** Jurisdictional boundary holds. |
  | **4. The Transit Tourist** | A visitor present for 48 hours, subject to local laws (traffic, conduct) but with no long-term stakes. | **NO.** Interests are too transient/trivial to warrant voting rights. | **MAYBE.** Technically subjected to coercion while present, but duration may matter for *demos* membership. | **AAI:** Threshold of significance not met.<br>**ASC:** Coercion is present, but membership may require duration. |

  *We agree that Case 1 (The Climate Voter) is the strongest discriminator between our theories. If AAI cannot explain how to institutionalize this vote without global anarchy, ASC wins on feasibility. If ASC cannot explain why the islander's exclusion is legitimate, AAI wins on morality.*

  ### V. VERBAL DISPUTES AND TERMINOLOGY
  *We acknowledge that a portion of our prior disagreement stemmed from ambiguous terminology. We agree to the following stipulations for the remainder of the seminar.*

  1.  **"Affected":** We agree to define "affected" as **"significant alteration of life prospects,"** excluding trivial causal chains (e.g., I am not "affected" by your lunch choice). This addresses the ASC concern about infinite regress.
      *   *Residual Dispute:* Even with this definition, ASC maintains that "significant alteration" is still too vague to administer compared to legal jurisdiction.
  2.  **"Coercion":** We agree to define "coercion" as **"enforceable legal obligation backed by state sanction,"** excluding social pressure or market forces.
      *   *Residual Dispute:* AAI maintains that market forces backed by state property law *are* a form of coercion, but we will bracket this for the sake of the experiment.
  3.  **Admission of Verbal Component:** We acknowledge that approximately 30% of our prior conflict was due to AAI using "affected" too broadly and ASC using "coercion" too narrowly. We agree that clarifying these terms narrows the gap, but does not close it. The core normative disagreement (Crux 1) remains substantive.

  **SIGNATURES**

  By signing below, we agree that this document accurately represents our current positions. We agree not to retract concessions made herein during oral discussion. We agree that violating this protocol constitutes a failure of the collaboration.

  __________________________
  (Student A - All-Affected Interests)

  __________________________
  (Student B - All-Subjected to Coercion)

  __________________________
  (Prof. [Name] - Witness)
