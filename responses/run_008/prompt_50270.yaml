answer: |-
  There is no single, universally agreed-upon noun for this specific phenomenon, but there is a robust cluster of concepts in psychology and cognitive science that carve out exactly the space you are describing. You have accurately identified a functional cognitive architecture that is distinct from grief, distinct from the Freudian superego, and distinct from Hofstadter's metaphysical musing.

  The most precise established framework is **Dialogical Self Theory (DST)**, specifically the concept of the **Internalized Other**.

  However, DST describes the *structure*, not necessarily the *function*. To get the "carving" you want, we need to combine DST with **Simulation Theory** and **Epistemic Offloading**.

  Here is the breakdown of the concept, the terminology, and the boundaries.

  ### 1. The Name: "Internalized Other Modeling"
  If you need a label to use in conversation with a specialist, the closest technical term is an **Functional Introject** or an **Internalized Other Position**.

  *   **Introject:** In psychology, this is the unconscious adoption of the ideas or voices of others. Traditionally (Freud), this is pathological or moralistic (the superego).
  *   **Functional:** You are distinguishing it from the pathological/moral version. You are using it as a tool for *competence*, not *compliance*.
  *   **Modeling:** This acknowledges the cognitive science aspect: you are running a simulation.

  So, you are engaging in **Deliberative Simulation of Internalized Others.**

  ### 2. The Mechanism: How It Works
  You asked: *"When internal-dad objects to something... whose objection am I actually hearing?"*

  This is answered by **Simulation Theory of Mind**. Your brain possesses a "Theory of Mind" module capable of running predictive models of other agents. Usually, this is used to predict what someone will do *now*. In your case, you have promoted a specific model to a **Standing Subroutine**.

  *   **The Data:** The model is built from memories, past interactions, and observed patterns of the real person (Dad/Maya).
  *   **The Processor:** The simulation runs on *your* hardware, using *your* cognitive biases and *your* current context.
  *   **The Output:** The "voice" is a synthesis. It is not the dead father, nor is it purely you. It is **your simulation of his agency applied to your current problem.**

  To answer your ontological question: You are hearing *your* brain's best prediction of *their* processing. When "Model-Dad" makes a better argument than "Real-Dad" would have, it is because your simulation has stripped away the Real-Dad's noise (fatigue, mood, lack of context) and retained the signal (his core heuristics). You have effectively debugged his code.

  ### 3. The Function: Epistemic Offloading
  You mentioned this isn't grief or authority; it's a tool. In cognitive science, this is a form of **Epistemic Offloading**.

  Usually, we offload cognition to notebooks, calculators, or GPS. You are offloading cognition to **Social Surrogates**.
  *   **The Maya Case:** This is a **Heuristic of Trust**. You have identified that Maya's "taste algorithm" has a higher success rate than yours in specific domains. Asking "What would Maya say?" is a shortcut to bypass your own noisy intuition. It is rational outsourcing.
  *   **The Dad Case:** This is **Continuity of Competence**. You are preserving a specific cognitive style that you value and integrating it into your own decision matrix.

  ### 4. Carving the Edges (Inclusions and Exclusions)
  You asked where to draw the boundaries. Here is how a rigorous definition of this phenomenon would handle your edge cases:

  **A. Does it count if it's someone I never met? (e.g., a dead writer)**
  *   **Yes.** This is **Parasocial Internalization**. If you have consumed enough of their work to build a high-fidelity model of their judgment (e.g., "What would Marcus Aurelius say about this traffic jam?"), it functions identically. The source of the data (direct interaction vs. text) matters less than the fidelity of the model.
  *   *Edge:* If the model is too low-fidelity (a caricature), it stops being "consulting an other" and becomes "roleplaying."

  **B. Does it count if I know the advice is bad but follow it out of loyalty?**
  *   **No.** This is the critical boundary.
  *   **Consultation:** You run the simulation to *inform* your decision. You retain veto power. (This is what you are doing with Dad/Maya).
  *   **Submission:** You run the simulation and *surrender* your decision. (This is the Superego/Pathological Introject).
  *   *The Carving:* If you override your own judgment *against* the evidence because the Voice says so, you have crossed from **Tool Use** into **Subjugation**. Your description suggests you remain the final arbiter ("...and it was a good one, and the real him never actually made it"). You evaluated the advice on merit.

  **C. Does it count if the model stops updating?**
  *   **Yes, and that is a feature, not a bug.**
  *   With the dead father, the model is frozen at death. This creates a "Timeless Advisor." It provides consistency that living people cannot.
  *   With the living friend (Maya), your model *does* update as you interact with her, but there is a lag. If Maya changes her mind radically tomorrow, your internal model might not catch up immediately.
  *   *The Carving:* The phenomenon relies on the model having **Relative Stability**. If the internal voice changed its mind as often as you do, it wouldn't be useful as a counterweight.

  ### 5. Why It Feels "Weird" (And Why It Isn't)
  It feels weird because we have a cultural narrative that the "Self" should be singular and autonomous. But cognitive science increasingly views the self as **modular** and **socially extended**.

  *   **Hofstadter's Fuzziness:** Hofstadter leans into the metaphysical ("Is it really her?"). You are asking the engineering question ("Does this module work?").
  *   **The Superego Confusion:** Freud assumed internalized parents were primarily *policemen*. You have discovered they can be *consultants*. This is a healthier integration. It is what developmental psychologists call **Secure Internalization**—taking the useful parts of attachment figures without swallowing their pathology.

  ### Summary
  You are describing **Functional Internalized Other Modeling**.

  *   **What it is:** A cognitive strategy where high-fidelity simulations of specific others are maintained as standing subroutines to assist in decision-making.
  *   **What it includes:** Dead or living subjects; direct acquaintances or parasocial figures (writers); practical or moral domains.
  *   **What it excludes:** Compulsive obedience (Superego); grief rituals (bond maintenance); low-fidelity caricatures (roleplay).
  *   **Whose voice it is:** It is your neural hardware running their software. It is a joint product, but the *authority* you grant it is yours to give.

  It is not a ghost. It is a library of specialized algorithms you have compiled from the people you trust, and you are wise to use them.
