answer: |-
  The airport bar was half-empty, the kind of limbo space where time feels suspended. Alex stirred an old fashioned while Jamie nursed a soda. Their flight had been delayed twice already.

  "At least we agree on the destination," Alex said, gesturing vaguely upward. "God exists. But I worry your route is going to get us stranded."

  Jamie smiled. "The Leibnizian route? How so?"

  "Because it's too expensive. You buy God with the Principle of Sufficient Reason (PSR). Everything must have an explanation. But then you have to explain why the PSR itself is true, and why God doesn't need one. Once you start carving out exemptions for necessary beings, why can't the atheist carve out an exemption for the universe? If you can say 'God is brute,' they can say 'The cosmos is brute.' Your argument collapses into a stalemate."

  Jamie leaned forward. "That's the standard objection, but it misses the modal distinction. I'm not saying everything needs a *cause*; I'm saying everything needs an *explanation*. Contingent things—things that could have failed to exist—demand an explanation outside themselves. The universe is contingent. God, by definition, is necessary. Existence is part of His nature. The atheist can't say the universe is necessary without contradicting empirical reality. Things change. Things decay. That screams contingency."

  "But does the PSR hold everywhere?" Alex pressed. "If you say 'everything has a reason,' does God have a reason? If yes, He's not God. If no, you've admitted not everything needs a reason. So why is the universe the wrong place to stop the regress? You're asking me to accept a massive metaphysical principle just to avoid a brute fact. My Kalam argument is leaner. Whatever begins to exist has a cause. The universe began to exist. Therefore, it has a cause. I don't need the PSR to govern all being, just causation within time."

  "Leaner?" Jamie scoffed gently. "Your first premise is just the PSR wearing a disguise. Why does whatever begins to exist have a cause? Because something can't come from nothing without a reason. You're smuggling in the very principle you claim to avoid. And you're hostage to physics. What happens if cosmologists decide the universe is past-eternal? If the B-theory of time is true and the universe is a four-dimensional block, nothing 'begins to exist' in the way you need. Your argument dies with the next telescope."

  Alex shook his head. "Metaphysics trumps physics. Physics describes the structure of the universe; metaphysics asks why there's a structure at all. Even if the universe is past-eternal, I'd argue an actual infinite cannot exist in reality. You can't traverse an infinite past to reach today. So there must be a beginning, regardless of what the Big Bang models say this decade. And regarding the cause: it must be timeless, immaterial, and personal."

  "Personal?" Jamie jumped on this. "That's the bolted-on part. You get to a timeless cause, fine. But why think it's a *who*? Why not a timeless abstract object or a brute mechanism? Saying 'it willed the universe into being' feels like you're scrambling to get theology out of philosophy."

  "It's not scrambling," Alex countered, voice sharp but calm. "It's the only way to get time from timelessness. If the cause is a mechanistic state, and the state is timeless, the effect should be timeless too. If the conditions for water freezing are eternally present, the ice is eternally present. To get a temporal effect from a timeless cause, you need agency. You need a being who can choose to create *in time* without changing *in essence*. Libertarian agency is the only coherent bridge there. Without it, I don't get a Creator; I get a static emanation."

  Jamie paused, tapping the rim of the glass. "I'll concede that's the strongest version of the Kalam I've heard. But it still feels like you're betting the farm on temporal intuition. Here's the worry: are we even running different arguments? You're talking about the beginning of the universe. I'm talking about the grounding of the universe. But if God is timeless, He doesn't 'begin' anything in a temporal sense. He grounds existence. Isn't your 'cause' just my 'necessary being' with a stopwatch attached?"

  Alex considered this. "Maybe. But the emphasis matters. Your argument allows for an eternal universe sustained by God. Mine demands a creation event. If I'm right, the universe is fundamentally contingent on a decision. If you're right, it's contingent on a nature. I think the decision model protects divine freedom better. But I hear you. Maybe the Kalam is just the contingency argument applied to time specifically."

  "Exactly," Jamie said. "And that's why I worry about your approach. If you tie apologetics to the Big Bang, you tie faith to the Standard Model. If I tie it to contingency, I tie it to the distinction between 'might-not-have-been' and 'must-be.' That distinction holds even if the universe is eternal. But you make a fair point about the PSR. If I claim the PSR is obvious, I have to explain why it doesn't apply to God. Maybe the answer isn't exemption, but limitation. The PSR applies to contingent truths. God isn't a contingent truth. The atheist's universe is. So it's not an arbitrary stop; it's a categorical one."

  "But is that convincing to someone who doesn't already buy your modal metaphysics?" Alex asked. "They'll say you're defining God into existence. My argument starts with intuition about causation everyone uses daily. Cups don't just appear. Universes shouldn't either."

  "Everyone uses causation within the universe," Jamie replied. "Jumping from causes inside the box to the cause of the box is the real leap. Maybe that's where we meet. You're worried my argument is too abstract to land. I'm worried yours is too fragile to hold. Both of us are trying to avoid the brute fact. You say a brute fact universe is impossible because things begin. I say it's impossible because things depend."

  Alex signaled the bartender for the check. "So the choice isn't about strength. It's about what you're willing to be accused of assuming. I assume causation scales up. You assume explanation scales up."

  "And both of us assume reason isn't useless," Jamie said. "Even if we think the other's proof leaks."

  "Right. A bad argument for a true conclusion... it invites people to reject the conclusion when the argument fails."

  "Which is why we keep talking," Jamie said, standing up as the boarding call finally echoed. "Otherwise we're just preaching to the choir."

  Alex grabbed his bag. "Next flight. We continue this."

  "Deal. But I'm buying the soda."
