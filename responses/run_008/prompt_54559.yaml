  2.  **Completeness Requirement (0.95):** Probability that a population axiology must yield a complete, transitive ordering to be considered a valid solution.
      *   *Justification:* Longtermism requires action-guidance; an incomplete ordering paralyzes decision-making in the exact high-stakes cases where the theory is needed.
  3.  **Mathematical Finality (0.95):** Probability that the impossibility theorems contain no logical loopholes or domain restrictions within standard decision theory.
      *   *Justification:* The proofs are rigorous within their frameworks; errors are unlikely, though alternative logics (e.g., supervaluationism) remain unexplored.

