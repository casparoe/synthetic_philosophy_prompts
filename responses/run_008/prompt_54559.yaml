  **My Credence:** **20%**

  Here is the decomposition of that probability, treating the existence of a "perfect" axiology as the negation of three independent failure modes.

  1.  **Formalization Rigidity (0.90):** Probability that Arrhenius's adequacy conditions are the only valid formalization of our core moral intuitions.
