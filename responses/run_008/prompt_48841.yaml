answer: |-
  Here is the operational procedure you requested, designed to stabilize your referee pool by translating Dennett's philosophical distinctions into actionable peer-review criteria. Following the procedure, I have applied it to your three schematic submissions and provided the requested critique on where the tool might misfire or reveal editorial bias.

  ### The Dennett Audit: A Procedure for Cross-Level Explanations

  **Time Budget:** 2–3 Hours
  **Goal:** Distinguish between *legitimate higher-level abstraction* (Cranes) and *explanatory mysticism* (Skyhooks), while blocking *greedy reductionist* demands.

  #### Question 1: The Phenomenon and the Posit
  **Query:** Does the manuscript identify a specific, stable regularity (the *explanandum*) and propose a specific structural or causal posit (the *explanans*) to account for it?
  *   **Sufficient Answer:** Yes. The phenomenon is clearly defined (e.g., "flash crash," "mound geometry"), and the explanation points to a specific arrangement, process, or constraint (e.g., "feedback loop," "stigmergic trace").
  *   **Insufficient Answer:** The phenomenon is vague ("consciousness," "life") or the explanation is a restatement of the phenomenon ("it happens because of emergent properties").
  *   **Termination:** If **Insufficient**, recommend **Reject**. (No explanation is being offered).

  #### Question 2: The Skyhook Check (Magic Detection)
  **Query:** Does the explanatory posit perform work that it has not earned from below? Specifically, does the author invoke a property (e.g., "strong emergence," "downward causation") as a *terminator* of explanation rather than a *description* of a mechanism?
  *   **Sufficient Answer:** No. Higher-level terms are used as shorthand for a described interaction structure, not as a causal force that bypasses the lower level.
  *   **Insufficient Answer:** Yes. The author claims the explanatory gap is "dissolved" or "bridged" simply by labeling the phenomenon (e.g., "Consciousness emerges because the system is complex").
  *   **Termination:** If **Insufficient**, recommend **Reject**. Tag as **Skyhook**. (This is mysticism).

  #### Question 3: The Crane Check (Scaffolding Verification)
  **Query:** Is there a specified mechanism linking the lower-level components to the higher-level regularity, even if abstract? Can the author describe *how* the parts interact to produce the whole without invoking a designer or external orchestrator?
  *   **Sufficient Answer:** Yes. The paper specifies interaction rules, feedback structures, or environmental constraints (e.g., "agents react to price changes," "termites deposit pheromones").
  *   **Insufficient Answer:** No. The link is asserted but not modeled or described (e.g., "the whole influences the parts" without specifying the channel of influence).
  *   **Termination:** If **Insufficient**, recommend **Revise/Reject**. Tag as **Needs-More-Crane**. (The scaffolding is missing).

  #### Question 4: The Greedy Reductionism Check (Necessity of Detail)
  **Query:** Is the demand for lower-level detail necessary to validate the specific claim being made, or is it a demand for a full derivation of the whole from the parts?
  *   **Sufficient Answer:** The lower-level detail provided is sufficient to instantiate the mechanism (Q3). Further detail (e.g., specific code lines, specific neural firing sequences) would not change the structural explanation.
  *   **Insufficient Answer:** Referees demand micro-foundations that are irrelevant to the structural claim (e.g., demanding the exact chemical composition of a pheromone when the *presence* of the trace is the explanatory variable).
  *   **Termination:** If referees demand this, the **Editor** must overrule. This is a **Judgment Call** on the appropriate grain of explanation. The paper stands if Q3 is met.

  #### Question 5: The Empirical Anchor (Historical/Constraint Check)
  **Query:** For cases where micro-details are inaccessible (history, evolution), are there empirical signatures or constraints that validate the proposed crane?
  *   **Sufficient Answer:** Yes. The model makes predictions about the current state that would be unlikely under alternative explanations (e.g., mound geometry matches simulation despite unknown individual histories).
  *   **Insufficient Answer:** No. The explanation is a "just-so story" with no testable consequences.
  *   **Termination:** If **Insufficient**, recommend **Reject** (Needs-More-Crane). If **Sufficient**, recommend **Accept**. Tag as **Crane**.

  ---

  ### Application to Submissions

  #### Submission A: Market Flash Crash (Algorithmic Feedback)
  *   **Q1 (Phenomenon/Posit):** Pass. Phenomenon = crash; Posit = feedback loop structure.
  *   **Q2 (Skyhook):** Pass. The loop is a structural description, not a magical force.
  *   **Q3 (Crane):** Pass. The feedback mechanism is characterized. The refusal to specify individual algorithms is a claim of *structural invariance* (the crash happens regardless of specific code, provided the loop structure exists).
  *   **Q4 (Greedy Reductionism):** The demand for specific algorithms is flagged here as Greedy Reductionism. The structural explanation does the work.
  *   **Q5 (Empirical Anchor):** Pass. Market data constrains the model.
  *   **Outcome:** The explanation builds up from interaction rules without needing to bottom out in code.
  *   **Verdict:** `crane`

  #### Submission B: Neural Correlates (Strong Emergence)
  *   **Q1 (Phenomenon/Posit):** Pass. Phenomenon = consciousness; Posit = complexity index.
  *   **Q2 (Skyhook):** **Fail.** The authors claim the explanatory gap is *dissolved* by accepting strong emergence. This uses "emergence" as a noun that does causal work without a mechanism. It is a skyhook lowering organization from on high.
  *   **Q3 (Crane):** Fail. No mechanism links the index to the experience; the index is a correlate, not a crane.
  *   **Outcome:** Terminates at Q2.
  *   **Verdict:** `skyhook`

  #### Submission C: Termite Mounds (Stigmergy)
  *   **Q1 (Phenomenon/Posit):** Pass. Phenomenon = mound architecture; Posit = stigmergy (local rules + trace).
  *   **Q2 (Skyhook):** Pass. Stigmergy is a mechanistic description of indirect coordination, not a mystical force.
  *   **Q3 (Crane):** Pass. Local rules + environmental trace constitute the scaffolding.
  *   **Q4 (Greedy Reductionism):** The lack of a "complete inventory of individual termite behavior" is flagged here. Demanding this would be Greedy Reductionism. The statistical regularity of the rules is the crane.
  *   **Q5 (Empirical Anchor):** Pass. Empirically constrained predictions about mound form validate the model.
  *   **Outcome:** This is a textbook Crane. It explains global order via local mechanisms without requiring impossible micro-data.
  *   **Verdict:** `crane`

  ---

  ### Critique: Misfires and Prejudices

  **1. Where the Procedure Might Misfire (Historical Sciences)**
  The danger lies in **Question 3 (The Crane Check)**. In historical sciences (evolutionary biology, geology), the "mechanism" is often a past sequence of events that is irretrievably lost. A rigid referee might interpret "specified mechanism" as requiring a complete causal chain.
  *   *Correction:* The procedure accounts for this in **Question 5 (Empirical Anchor)**. If the "crane" is a historical process (like natural selection), we cannot observe the steps, but we can observe the *signatures* (phylogenetic constraints, fossil records). If Q5 is passed, Q3 should be considered satisfied by *inferred* scaffolding. If a referee uses Q3 to reject a solid evolutionary explanation because the exact mutation history is unknown, they are misusing the tool.

  **2. Where the Procedure Reveals Prejudice (Submission C)**
  You admitted you want Submission C (Termites) rejected. The procedure categorizes it as a `crane`.
  *   *The Prejudice:* Your desire to reject C likely stems from the "no complete inventory of individual termite behavior" clause. This is a hidden demand for **deterministic micro-foundations**.
  *   *The Reality:* In complexity science, stigmergy is the paradigmatic *Crane*. It explains how order arises without a blueprint. Demanding a complete inventory of individual behavior is **Greedy Reductionism** (Question 4). It asks for a derivation of the whole from the parts that is computationally intractable and explanatorily unnecessary.
  *   *The Verdict:* If you reject C using this procedure, you are violating the procedure's logic. The procedure correctly identifies C as good science. Your intuition to reject it is the "faction's prejudice dressed as a rule"—specifically, the prejudice that an explanation is only valid if every micro-state is accounted for. Dennett's framework explicitly protects C from this demand.

  **3. The "Judgment Call" Zone**
  The procedure hands the question back to the editor only when **Question 4** is triggered (referees demanding unnecessary micro-foundations) or when **Question 5** is ambiguous (the empirical constraints are weak but the mechanism is plausible). In those cases, the editor must decide the *sociological* question: "How much unexplained structure is this field entitled to start from?" For example, in neuroscience, starting with "neurons fire" is acceptable; starting with "homunculus decides" is not. The procedure flags the boundary, but you must police the border.

  \verdicts{A: crane, B: skyhook, C: crane}
