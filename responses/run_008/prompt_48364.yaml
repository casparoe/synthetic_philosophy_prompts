  ### The principle, stated

  Adopt a **Hybrid Dysfunction Account with Structural Priority**. A condition is a disease if and only if: (1) There is a failure of an internal psychological or physiological mechanism to perform its evolutionarily selected function (Dysfunction); AND (2) This failure is not part of the species-typical aging process (Non-Aging). However, (3) the presence of invasive structural pathology (e.g., neoplasms, pathogens) qualifies as disease regardless of current functional harm (Structural Override). Finally, (4) social disvaluation alone cannot establish dysfunction; the mechanism must fail its natural design parameters, not merely violate social norms (Normative Constraint). This navigates the naturalism/normativism debate by grounding disease in biological facts while using normative filters to exclude social variations. It combines naturalist facts about design and aging with normative filters on what counts as a function versus a variation, while granting ontology priority to physical pathology over symptomatic harm.

  ### Which case buys which clause

  Your verdicts map cleanly onto these four clauses, resolving the specific tensions you identified regarding harm, statistics, and social values. First, the **indolent tumor, gingivitis, and caries** are purchased exclusively by Clause 3 (Structural Override). You noted the tension here: these conditions lack current harm, yet you call them diseases. Clause 3 resolves this by granting ontology priority to physical pathology. The presence of neoplasms or pathogens constitutes disease regardless of functional impact, satisfying your naturalist intuition without requiring suffering. This explicitly overrides the normativist demand for harm in cases of clear biological invasion, ensuring that asymptomatic pathology remains medical. It acknowledges that a tumor is a disease because of what it *is*, not what it *does*.

