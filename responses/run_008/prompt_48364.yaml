  Third, **presbyopia versus myopia** is distinguished by Clause 2 (Non-Aging). Both involve optical failure, but presbyopia is species-typical for the age class, whereas myopia is not. This validates your view that aging is not disease, while maintaining that atypical functional failures are. It clarifies that statistical commonness (gingivitis) matters less than design function, unless that commonness is due to the expected lifecycle. This prevents the "normalization" of disease just because many people have gum disease, while protecting aging from medicalization. Finally, **grief and ordinary sadness** are excluded by Clause 1. These states represent mechanisms working *as designed* in response to loss; labeling them diseases would mistake natural function for dysfunction. Even if grief impairs functioning, it is not a disease because the impairment is a side-effect of a properly functioning adaptation to loss, not a failure of the adaptation itself. Your wavering on **congenital deafness** is the only outlier; it fits Clause 1 (auditory mechanism failure) but conflicts with your disability distinction. Overall, the principle separates biological failure from social disadvantage, validating your psychopath verdict while securing the homosexuality exclusion without relying on harm alone. It successfully navigates the trap where statistical typicality (presbyopia) conflicts with social typicality (homosexuality) by anchoring both in evolutionary design and aging expectations.

  ### Verdicts I should give up

  To maintain coherence, you should overturn your verdict on **congenital deafness**. You classify the psychopath as disordered because his internal mechanisms fail evolutionary design, despite his subjective well-being. Consistency demands you classify congenital deafness similarly: the auditory mechanism fails its selected function, regardless of the individual's adaptation or cultural identity. Calling it merely a "disability" while calling psychopathy a "disorder" introduces an inconsistent normative epicycle—likely stemming from political sensitivity rather than medical ontology. If you accept the tumor verdict (naturalism), you must accept deafness as a disease (naturalism). Alternatively, you could overturn the **psychopath** verdict, insisting on subjective harm. But this would conflict with your tumor verdict, which explicitly rejects harm as a necessary condition. Therefore, the cleanest cut is to accept deafness as a disease. This aligns with the Biostatistical Theory core of your principle, preserving the distinction between biological dysfunction and social value that protects homosexuality from pathologization. It requires accepting that "disease" is not a pejorative but a biological category, distinct from the social accommodations implied by "disability." Holding onto the disability distinction undermines the naturalist core you rely on for the tumor and psychopath cases.

