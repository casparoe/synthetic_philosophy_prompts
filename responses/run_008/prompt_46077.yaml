  You have stumbled onto one of the most active debates in modern moral philosophy, often called the problem of "moral uncertainty." Your intuition is sharp: treating moral disagreement like factual disagreement (e.g., RAM size) is a specific philosophical choice, not a neutral default. Here is what that spreadsheet is actually doing under the hood.

  ### 1. The "Data Type" Assumption: Intertheoretic Comparability
  To average a utilitarian's "units of suffering" with a rights-based theorist's "violations of dignity," you must assume these are compatible data types. In philosophy, this is called **intertheoretic comparability**.
  *   **The Presupposition:** The practice assumes there is a universal "moral currency" that allows us to say 1 unit of Theory A equals 1 unit of Theory B.
  *   **The Risk:** If one theory measures value in "happiness points" and another in "divine commandments," averaging them is like averaging inches with kilograms. The spreadsheet presupposes these can be normalized onto a single scale, which is a heavy metaphysical lift.

  ### 2. The "Reduction Function" Assumption: Commensurability
  Your observation about the "midpoint" highlights the issue of **commensurability**. Some moral views say certain values are lexical or absolute (e.g., "Never sacrifice a human right, no matter how many chickens are saved").
  *   **The Presupposition:** The spreadsheet assumes all values are trade-off-able. It flattens structural differences into a single scalar number.
  *   **What It Rules Out:** This setup functionally silences "non-aggregative" views. If 50% of staff believe rights are absolute side-constraints, the average might suggest "sometimes violate rights," a position literally no one holds. It rules out the view that some moral categories cannot be summed, regardless of the weights.

  ### 3. The Justification: Expectationalism vs. Pragmatism
  This brings us to your question about neutrality. Can the nonprofit use this table without deciding *why* it works?
  *   **View A (Expectationalism):** Moral uncertainty is exactly like factual uncertainty. You should maximize "expected moral value." This view says the spreadsheet is *truth-tracking*.
  *   **View B (Pragmatism/Contractualism):** We know the math is philosophically messy, but we need to allocate funds somehow. The average is a "focal point" or a negotiated treaty to allow cooperation despite disagreement. This view says the spreadsheet is *tool-tracking*.

  The practice itself does not force you to choose A or B. A software engineer can write the reduction function without knowing if the CEO believes it reveals moral truth or just prevents gridlock. The code runs the same way. However, the practice *does* require you to accept that *some* aggregation is permissible, ruling out those who say "we should do nothing until we resolve the moral truth."

  ### Conclusion
  The spreadsheet is not philosophically neutral, but it is **metanormatively flexible**. It demands you accept that moral values can be compared and summed (ruling out incommensurability), but it does not demand you agree on whether that sum represents reality or merely a compromise. Different underlying theories can license the exact same table, meaning the practice itself doesn't settle the deeper philosophical dispute.

  \answer{underdetermined: because distinct meta-normative justifications can validate the same decision procedure}
