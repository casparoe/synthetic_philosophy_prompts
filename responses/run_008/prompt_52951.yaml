answer: |-
  # JOINT STATEMENT ON THE DISCURSIVE DILEMMA

  **1. ACCEPTED CLAIMS**

  We, the undersigned, having engaged in adversarial collaboration regarding the aggregation of connected judgments, affirm the following propositions as common ground:

  1.  **The Impossibility Result:** For any group deciding on a set of logically connected propositions (e.g., premises $P, Q$ and conclusion $C$, where $P \land Q \leftrightarrow C$), no aggregation function can simultaneously satisfy universal domain (accepting any profile of individual judgments), anonymity (treating members equally), proposition-wise independence (deciding each proposition by a function of individual views on that proposition alone), and collective consistency (ensuring the collective set is logically closed).
  2.  **Individual Coherence:** The dilemma arises even when every individual member holds a perfectly consistent set of judgments. The inconsistency is a property of the aggregation mechanism, not of the individual reasoners.
  3.  **Structural Parallel:** The logical structure of this dilemma is isomorphic to the Lottery Paradox. In both cases, high confidence (or majority acceptance) in separate premises does not guarantee high confidence (or majority acceptance) in their conjunction or logical consequence.
  4.  **Profile Dependence:** The dilemma does not arise in every possible voting profile. However, under the conditions above, there exists at least one admissible profile of individual judgments for which every aggregation method satisfying the other conditions yields a collectively inconsistent outcome.
  5.  **Methodological Misfire:** On the profiles where the dilemma arises, any method chosen will violate at least one desideratum valued by the group (e.g., responsiveness to the majority on the conclusion, or responsiveness to the majority on the premises, or collective consistency).

  **2. RESIDUAL DISAGREEMENTS**

  We acknowledge that while we agree on the formal structure of the problem, we disagree on the normative and metaphysical implications. The following table articulates our divergent positions without attributing to either party views they do not hold.

  | Topic | Statement Endorsed by the Conclusion-Driven Signatory | Statement Endorsed by the Premise-Driven Signatory |
  | :--- | :--- | :--- |
  | **Collective Consistency** | Requiring a group to maintain logical consistency across all propositions imposes a "unitary agent" constraint that misdescribes the nature of pluralistic bodies; inconsistency is an acceptable cost of respecting majority will on each distinct question. | Requiring a group to maintain logical consistency is a precondition for the group to bear responsibility for its decisions; inconsistency represents a failure of the procedure to synthesize a coherent position. |
  | **Source of Legitimacy** | Legitimacy derives from the responsiveness of the collective outcome to the distribution of individual views on the specific outcome in question; the group speaks with several voices, and the majority view on the conclusion is the authoritative one. | Legitimacy derives from the integrity of the reasoning process connecting accepted reasons to accepted outcomes; the group must take responsibility for the inferences drawn from the premises it accepts. |
  | **Nature of the Group** | Treating the group as a single mind is a fiction that obscures the reality of disagreement; the procedure should reflect the fact that the group is a collection of individuals, not a super-agent. | Treating the group as a single mind is a necessary normative ideal for collective action; the procedure should enforce the discipline required for the group to act as a unified agent. |

  **3. CRUCES AND TESTS**

  We identify three specific cruxes where our disagreement remains substantive. For each, we specify the argument or computation that bears on the issue and record our competing predictions.

  **Crux 1: The Requirement of Consistency**
  *   **The Issue:** Is collective consistency a genuine normative requirement, or is it an artifact of treating the group as a unitary agent?
  *   **The Test:** We consider a scenario where a group must act on its judgment. If the group accepts $P$ and $Q$ but rejects $C$ (where $P \land Q \rightarrow C$), can it coherently implement a policy based on $P$ and $Q$ without implementing $C$?
  *   **Signatory Predictions:**
      *   *Conclusion-Driven:* The group can coherently implement $P$ and $Q$ as findings of fact while rejecting $C$ as a normative or legal classification. The inconsistency is manageable in practice.
      *   *Premise-Driven:* The group cannot coherently implement $P$ and $Q$ without being committed to $C$. To deny $C$ while affirming the grounds for $C$ renders the action arbitrary and indefensible to those subject to it.

  **Crux 2: Epistemic Consequences (Condorcet-Style Model)**
  *   **The Issue:** Is the choice between premise-based and conclusion-based aggregation epistemically consequential (affecting truth-tracking) or purely procedural?
  *   **The Model:** Suppose a committee of size $N$ faces propositions $P, Q$, and $C$ (where $C \leftrightarrow P \land Q$). There is a fact of the matter about the truth of $P$ and $Q$. Each member judges $P$ and $Q$ with competence $p > 0.5$ (probability of judging correctly), independently. $C$ is true if and only if $P$ and $Q$ are true.
      *   *Premise-Based (PB):* The group votes on $P$ and $Q$ by majority; $C$ is determined by the logical consequence of the collective $P$ and $Q$.
      *   *Conclusion-Based (CB):* The group votes on $C$ directly by majority (ignoring the logical link to individual votes on $P$ and $Q$ for the final outcome).
  *   **The Question:** As $N \to \infty$, which method yields a higher probability that the collective judgment on $C$ matches the true state of $C$?
  *   **Signatory Predictions (Recorded Prior to Computation):**
      *   *Premise-Driven Signatory:* **Premise-Based** will track the truth better. Aggregating judgments on the fundamental facts ($P, Q$) utilizes more information and reduces error rates on the components before deriving the conclusion.
      *   *Conclusion-Driven Signatory:* **Conclusion-Based** will track the truth better (or equally well). Direct voting on $C$ aggregates specific information regarding the conclusion that may be lost when decomposing the judgment into premises, and it is more robust to errors in individual logical reasoning.

  **Crux 3: Proposition Individuation (Verbal Dispute Analysis)**
  *   **The Issue:** Does the dispute partly dissolve if we clarify whether "the conclusion" is a separate object of judgment or just the closure of the premises under the group's logic?
  *   **The Analysis:** We distinguish between two interpretations of the conclusion $C$:
      1.  *C as Inference:* $C$ is merely a label for the logical conjunction of $P$ and $Q$.
      2.  *C as Proposition:* $C$ is a distinct normative or factual claim that happens to be logically equivalent to $P \land Q$ but carries independent weight.
  *   **Agreement on Verbal Component:** We agree that if $C$ is understood strictly as *C as Inference*, then voting on $C$ separately from $P$ and $Q$ is redundant, and the "dilemma" is merely a logical contradiction generated by double-counting. In this specific interpretation, the Premise-Driven view is logically necessitated, and the dispute is verbal.
  *   **Agreement on Non-Verbal Component:** We agree that in legal and political contexts, $C$ is typically understood as *C as Proposition* (e.g., "Liability" is not just "Breach + Causation" but a distinct status with normative consequences). In this interpretation, the choice between aggregation methods involves a substantive trade-off between responsiveness (respecting views on Liability) and rationality (respecting views on Breach/Causation). This portion of the dispute is **not verbal**; it is a genuine conflict of values regarding whether the group prioritizes the integrity of its reasoning or the direct expression of its will on the outcome.

  ***

  **Signed,**

  _________________________
  (Conclusion-Driven Signatory)

  _________________________
  (Premise-Driven Signatory)

  **Date:** _________________
