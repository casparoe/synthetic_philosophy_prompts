prompt: |-
  I run enrichment programs at a mid-size sanctuary (mostly rescued ex-farm animals, some native wildlife that can't be released, and a handful of exotics people illegally kept and then surrendered). I've been reading about Dennett's four grades of mind -- Darwinian creatures that only "learn" by dying (selection over generations), Skinnerian creatures that learn by trial and error during their own lifetime, Popperian creatures that can pre-test hypotheses in their heads before acting, and Gregorian creatures that use tools and mind-tools like language to restructure their own thinking. My thought is that this ladder is basically an enrichment-matching framework in disguise: what counts as good enrichment for an animal depends on what grade you think it operates at. A puzzle feeder that requires imagining a solution before trying it is worthless (or worse, stressful) for an animal that can only learn by bumping into things repeatedly, and a Skinnerian-level foraging setup is insulting under-enrichment for something that plans.

  What I want is a procedure my team (three keepers, varying experience, and me) can actually run when we write or revise an enrichment plan for a species or individual. Concretely:

  1. A classification procedure: an ordered list of questions/tests that sorts an animal into one of the four grades (or says it's genuinely ambiguous), using only what we can observe in daily husbandry plus cheap controlled-ish setups we can rig from stuff we already have. It should say what counts as a sufficient answer to each question, where the procedure stops and just assigns the more conservative grade, and where it flags "this is a judgment call, Sarah has to decide" instead of pretending it's mechanical.

  2. An enrichment-matching rule: given a grade, what kinds of enrichment are appropriate, what kinds are wasted money, and what kinds are actively harmful (I'm thinking about frustration and learned helplessness here, but tell me if that framing is wrong).

  3. Honesty about failure modes: where the grade system itself breaks down. E.g., does learning during an individual's lifetime shade continuously into "testing hypotheses in the head" in a way that makes the Popperian/Skinnerian line somewhat arbitrary? What about animals that are Gregorian about one thing and Darwinian-ish about everything else? Tell me what the procedure can't do.

  Then run it on three cases we actually have:

  - Our ravens, who are obviously the smartest animals here and get the most elaborate enrichment -- I suspect we're mis-assigning them and either over- or under-shooting.
  - Our bearded dragons. My board president keeps pushing for expensive "problem-solving" enrichment for them because it looks good on our social media, and I have a feeling the procedure is going to say something we both won't like, whichever direction that is.
  - A batch of battery hens new to us, where we genuinely don't know what they can and can't do because the literature on chicken cognition is thin or I just can't get at it, and we need a plan next week.

  Keep it usable by someone who hasn't read any Dennett -- if a distinction doesn't survive translation into keeper language, tell me whether I can drop it or whether dropping it guts the whole idea. Also, if you think the four-grade ladder is the wrong framework for enrichment entirely and something else from animal cognition would do the job better, say so, but only after giving me the procedure I asked for.

  (also, small thing, but if any of my statements about Dennett above are wrong or sloppy, correct me -- I read this stuff on weekends and probably mangled something.)
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Sanctuary manager/program lead. Practical, experienced, ethically minded (concerned about stress/helplessness), resource-conscious (mid-size sanctuary, cheap setups), team-oriented (3 keepers + manager).
      *   **Task:** Create a usable procedure based on Daniel Dennett's "Four Grades of Mind" (Darwinian, Skinnerian, Popperian, Gregorian) to guide enrichment planning.
      *   **Specific Deliverables:**
          1.  Classification Procedure (questions/tests, stopping rules, ambiguity flags).
          2.  Enrichment-Matching Rule (appropriate, waste, harmful per grade).
          3.  Honesty about Failure Modes (limitations of the framework).
          4.  Application to Three Cases (Ravens, Bearded Dragons, Battery Hens).
          5.  Critique/Correction of Dennett interpretation & Framework suitability.
      *   **Tone:** Practical, "keeper language," honest about limitations, actionable.
      *   **Constraint:** Keep it usable by someone who hasn't read Dennett. Correct sloppy interpretations.

  2.  **Deconstruct Dennett's Four Grades (and Correct the User):**
      *   *Darwinian Creatures:* Learn via natural selection (generations). Individual doesn't learn. *Correction:* In an enrichment context, *no* individual animal is purely Darwinian. They all have nervous systems. This grade is mostly theoretical for individuals. *Action:* Adapt this to "Instinct-Driven / Hardwired."
      *   *Skinnerian Creatures:* Learn via operant conditioning (trial and error reinforcement). *Correction:* Accurate.
      *   *Popperian Creatures:* Can simulate outcomes internally before acting ("let my hypotheses die in my stead"). *Correction:* Accurate, but hard to distinguish from complex Skinnerian without rigorous testing.
      *   *Gregorian Creatures:* Use cultural tools/language to reshape thinking. *Correction:* This is the trickiest. True Gregorianism implies symbolic culture/language. Most animals aren't Gregorian in the strict sense, even corvids. *Action:* Adapt to "Tool Users / Social Learners / Culture."
      *   *Critique:* The ladder is a philosophical heuristic, not a strict biological taxonomy. It's useful for *enrichment* if treated as a spectrum of cognitive flexibility, not rigid boxes.

  3.  **Drafting the Classification Procedure (The "Keeper's Ladder"):**
      *   Need observable behaviors, not philosophical debates.
      *   *Step 1 (Darwinian/Instinct):* Does it respond to novel stimuli purely via fixed action patterns? (e.g., moth to light). If yes -> Grade 1. (Rare for vertebrates).
      *   *Step 2 (Skinnerian/Trial & Error):* Does it modify behavior based on consequences? (e.g., pressing lever for food). If no -> Grade 1. If yes -> Grade 2.
      *   *Step 3 (Popperian/Insight):* Does it pause before acting? Does it solve a novel problem without prior trial? (e.g., bending a wire to hook food). If yes -> Grade 3.
      *   *Step 4 (Gregorian/Cultural):* Does it learn from conspecifics? Does it use external artifacts as thinking tools? (e.g., teaching young, using specific tools passed down). If yes -> Grade 4.
      *   *Stopping Rules:* If evidence is mixed, default to the *lower* grade to prevent frustration (Safety First). Flag "Sarah" for ambiguous Popperian/Gregorian distinctions.

  4.  **Drafting the Enrichment-Matching Rule:**
      *   *Grade 1 (Instinct):* Sensory stimulation, environmental variation. *Harm:* Complex puzzles (stress).
      *   *Grade 2 (Trial & Error):* Puzzle feeders requiring manipulation, variable reinforcement. *Harm:* Nothing really, but boredom if too simple.
      *   *Grade 3 (Insight):* Multi-step puzzles, novel problem solving. *Harm:* Repetitive, solved-once tasks (boredom).
      *   *Grade 4 (Cultural):* Social learning tasks, tool provision, complex choice architectures. *Harm:* Isolation, lack of agency.

  5.  **Drafting Failure Modes (Honesty):**
      *   The lines are blurry (Skinnerian vs. Popperian is a huge debate in cognition).
      *   Domain specificity (smart at foraging, dumb at social).
      *   State dependence (stress lowers cognitive function).
      *   The "Gregorian" trap: Attributing culture where there is none.

  6.  **Applying to Cases:**
      *   *Ravens:* Definitely Popperian, arguably Gregorian (social learning). Risk: Over-challenging? No, risk is *under*-challenging. They need novelty.
      *   *Bearded Dragons:* Reptiles are often underestimated but generally Skinnerian with some spatial mapping. Board President wants "smart" enrichment. Reality: Thermal/UV/Sensory is better than puzzles. Don't waste money on complex puzzles.
      *   *Battery Hens:* Unknown cognitive state due to deprivation. Start Skinnerian (basic foraging) and test for Popperian (novel obstacles). Don't assume they are broken, but don't assume they are ravens.

  7.  **Refining the Framework (The "Is this the right tool?" question):**
      *   Dennett's ladder is philosophical. For enrichment, the "Five Domains Model" or "Control/Agency" frameworks might be more practical.
      *   *Decision:* I must provide the Dennett procedure first (as requested), but then offer the critique/alternative. The "Agency Ladder" is a better fit for enrichment than the "Mind Ladder."
      *   *Correction on Dennett:* The user's definition is mostly right, but "Darwinian" doesn't apply to individuals in a lifespan context. I need to make sure they know that. Also, Gregorian is very high bar (language/symbols). Most animals won't hit Grade 4.

  8.  **Review and Polish:**
      *   *Tone Check:* Is it respectful of the keeper's expertise? Yes.
      *   *Clarity:* Are the steps actionable?
      *   *Safety:* Emphasize the "default to lower grade" rule to prevent learned helplessness.
      *   *Specifics:* Ensure the Bearded Dragon advice is firm (reptile cognition is different). Ensure the Hen advice is compassionate (deprivation effects).

  9.  **Final Output Structure:**
      *   Intro: Validate the idea, correct Dennett slightly.
      *   Part 1: The Classification Procedure (The "Cognitive Triage").
      *   Part 2: Enrichment Matching (The "Menu").
      *   Part 3: Failure Modes (The "Fine Print").
      *   Part 4: Case Studies (Ravens, Dragons, Hens).
      *   Part 5: The Pivot (Is Dennett the right tool? Suggesting "Agency" instead).

  *(Self-Correction during drafting)*: I need to be careful not to insult the Board President regarding the Bearded Dragons. Frame it as "Species-Appropriate" rather than "Dumb Animal." Also, for the Hens, acknowledge that battery hens often exhibit learned helplessness which mimics low cognitive grade, but isn't. I need to distinguish *capacity* from *performance*.

  *(Refining Dennett Correction)*: Dennett's "Darwinian Creatures" are literally genes/organisms over generations. An individual chicken isn't a Darwinian creature in this sense. I need to translate this to "Hardwired/Reflexive" for the procedure to work. "Gregorian" implies symbols/language. Ravens might not be truly Gregorian in Dennett's strict sense, but for enrichment, "Social/Cultural Learner" is the functional equivalent. I will make this translation explicit.

  *(Final Plan)*:
  1. Acknowledge the creativity of the idea.
  2. Correct the Dennett definitions slightly for biological accuracy.
  3. Build the "Keeper's Cognitive Triage" (Procedure).
  4. Build the "Enrichment Matrix" (Matching).
  5. List the "Bug Reports" (Failure Modes).
  6. Run the Cases.
  7. Offer the "Agency" alternative as a post-script recommendation.

