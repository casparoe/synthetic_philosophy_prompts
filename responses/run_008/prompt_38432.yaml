          2.  *The Identifiable Beneficiary:* Impact must be traceable to a person. (Wisconsin fails).
          3.  *The Causal Clarity:* Signal-to-noise ratio. (Wisconsin fails).
      *   **The Tie-Breaker Test:** Propose a scenario that separates "Low P" from "Diffuse V".
