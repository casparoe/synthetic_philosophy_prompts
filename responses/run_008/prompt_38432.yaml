      *   *Wisconsin:* Even if P is higher, the benefit is still "diluted across millions." So he should still say Irrational.
      *   *Test Case:* Needs to isolate Concentration vs. Probability.
          *   *Option A:* 100% chance to save a statistical life (diffuse) vs 0.0001% chance to save a specific life.
          *   *Option B:* Voting in a 100-person election for a prize that goes to the winner (Concentrated) vs Voting for a tax cut (Diffuse).
      *   *Better Test:* "The Specific vs. Statistical Life."
