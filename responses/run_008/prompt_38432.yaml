          *   Wisconsin Prediction: Voting affects millions diffusely. Verdict: **Irrational.**

      *   **Model C: The Personal Agency/Causality Rule.**
          *   Rule: You must be able to see the direct causal chain from Action -> Outcome without massive noise.
          *   Logic: In voting, noise (other voters) drowns signal. In malaria, money -> nets -> life is clearer.
