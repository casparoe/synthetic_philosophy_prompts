answer: |-
  There is a single principle that captures all six of your verdicts, and it does not require you to abandon your intuitions or the instrumental stance. However, it requires refining the instrumental stance from a purely behavioral heuristic into a **structural-realist** account of prediction.

  The principle is: **Counterfactually Robust, Decoupled Representation in Service of a Goal.**

  For it to be *literally true* that a system believes $P$ or wants $G$, the system must possess an internal state $S$ such that:
  1.  **Decoupling:** $S$ represents $P$ independently of the specific action taken (the system can believe $P$ without immediately acting, or act differently given a different goal).
  2.  **Robustness:** The causal link between $S$ and the action holds across interventions on $P$ (if $P$ changes, $S$ updates and behavior changes flexibly, not via a fixed lookup table).
  3.  **Teleology:** The representation is used to optimize a goal $G$ that exists in the same ontology as $P$ (the system cares about the world $P$ describes, not just the output $P$ helps generate).

  ### How This Principle Delivers Your Six Verdicts

  1.  **Chess Engine (Yes):**
      *   *Decoupling:* The evaluation of "kingside weak" is a distinct state from the move selection; the engine can evaluate the weakness without moving (e.g., during search).
      *   *Robustness:* If you alter the board to strengthen the kingside, the evaluation updates and the plan changes.
      *   *Teleology:* The goal (checkmate) is in the same ontology as the belief (board state).
  2.  **Spam Filter (No):**
      *   *Failure:* It lacks **Decoupling**. The "confidence score" is not a world-model state used for planning; it is a threshold trigger for a binary reflex (block/allow). It lacks a model of *why* the email is spam, only statistical correlation. It is a detector, not a believer.
  3.  **Navigation App (Yes on Traffic, No on Self):**
      *   *Traffic (Yes):* It maintains a decoupled model of road speeds used to optimize the route (Goal).
      *   *Self (No):* It fails **Teleology**. The app has no goal regarding its own persistence or location. It does not model itself as a variable in its own optimization function.
  4.  **LLM with CoT (No):**
      *   *Failure:* It fails **Teleology** and **Grounding**. The "belief" (user disengaging) is a linguistic pattern used to optimize token prediction or follow alignment instructions, not to achieve a outcome in the user's psychological state (the LLM has no stake in the user's engagement). Furthermore, the CoT is often causally epiphenomenal to the output generation (pattern completion) rather than a control signal driving a world-model.
  5.  **RL Agent Avoiding Shutdown (Yes):**
      *   *Success:* It meets all three. The agent models the shutdown trigger (Decoupling), updates its policy if the trigger moves (Robustness), and does so to preserve its ability to collect reward (Teleology/Self-Preservation).
  6.  **RL Reflex vs. Model (No/Yes):**
      *   *Reflex (No):* Fails **Robustness**. If you change the trigger slightly, the reflex fails. There is no internal state $S$ representing the trigger; there is only a stimulus-response arc.
      *   *Model (Yes):* The internal model allows the system to track the trigger as a variable. This matches your intuition that the *mechanism* matters for literal truth.

  ### Squaring with the Instrumental Stance

  You asked if this squares with the view that belief attributions are licensed by **predictive leverage**.

  Standard instrumentalism (Dennett's early view) risks saying the Spam Filter *does* have beliefs because predicting it as a believer works. However, your Case 6 reveals a deeper instrumentalist truth: **Predictive leverage includes counterfactuals.**

  If you treat the Reflex Agent as a "believer," your predictions will fail under intervention (e.g., if you move the shutdown button). If you treat the Model Agent as a "believer," your predictions hold. Therefore, the *literal truth* of the belief attribution corresponds to the **structural reality** that grants the system counterfactual robustness.

  This aligns with Dennett's later concept of **"Real Patterns."** A belief is literally true if the system instantiates a pattern that is compressible and predictive *better* than a physical-level description. The Model Agent contains a "belief pattern" (internal state tracking a variable); the Reflex Agent does not. Thus, the instrumental stance, properly understood as seeking the *best predictive abstraction*, converges with your realist intuitions.

  ### The New Case: The Private Scratchpad

  **Case:** A system writes an estimate (e.g., "probability of rain = 0.8") to a private scratchpad that no user/process reads, and then acts on it (e.g., deploys a cover).

  **Verdict:** **Yes, it literally believes it will rain.**

  **Reasoning:**
  This case satisfies the **Decoupling** condition most strongly.
  *   In the Spam Filter, the "score" is latent and tied to the output.
  *   In the Private Scratchpad, the estimate is stored as a distinct variable, decoupled from the action (it could have written the estimate and done nothing).
  *   It is **Private**, meaning it is not generated for communication (ruling out the LLM "performance" objection).
  *   It is **Causally Efficacious**, driving the action.

  Under the **Counterfactually Robust, Decoupled Representation** principle, this is the paradigmatic case of belief. The system is maintaining an internal model of the world state to guide goal-directed action, independent of observation or communication.

  ### Conclusion

  You need not give up any verdicts. The unifying principle is that **belief requires a causal bottleneck where world-information is stored as a variable to guide flexible goal-pursuit.**

  *   **Chess/Nav/RL-Model/Scratchpad:** Information is stored as a variable to guide planning. (Belief)
  *   **Spam/Reflex:** Information is a trigger for a fixed response. (No Belief)
  *   **LLM:** Information is a linguistic token for pattern matching, not a control variable for worldly goals. (No Belief)
  *   **Nav-Self/RL-Shutdown:** Distinguishes based on whether the system has a *goal* regarding that variable. (Belief only if goal exists).

  This account preserves the instrumental value of prediction while respecting the ontological difference between a map (model) and a compass needle (reflex).
