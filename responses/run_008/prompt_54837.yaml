      *   **Content:** For each claim, state whether a careful expositor of Rand would accept it, and if not, explain what she actually held and where the distortion lies. If the author's concluding remark about ordinary decency depends on a distortion, note that within the relevant item.
      *   **Input Claims:**
          1.  Rand used altruism in its everyday sense (any concern for others) and attacked that concern wholesale.
          2.  Her ideal of the selfish man was one who follows his own desires and feelings wherever they lead, unburdened by guilt.
          3.  On her view giving to charity is always wrong, since any transfer of value to another person treats one's own life as less important than theirs.
