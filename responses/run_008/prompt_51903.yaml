answer: |-
  You have identified a genuine and well-trodden tension in normative theory, specifically at the intersection of welfare economics, deliberative democracy, and meta-ethics. The move you describe—privileging a counterfactual "idealized" preference over an actual "revealed" preference—is a standard maneuver in philosophy, but the specific failure mode you're observing (the collapse of the idealization into the idealizer's bias) has a more complicated status.

  Here is the analysis of the concept, the established neighbors, and the specific carving you are looking for.

  ### 1. The Legitimate Concept: Idealized Preference Theory
  The theoretical framework your facilitator is invoking is **Idealized Preference Theory** (or Ideal Advisor Theory). It is not inherently nonsense; it was developed to solve real problems in welfare economics and ethics.

  *   **The Problem:** Actual human preferences are often inconsistent, based on false beliefs, or adaptively formed under oppression (e.g., the "happy slave" who prefers slavery because they cannot conceive of freedom). If we aggregate *actual* preferences, we might encode biases or ignorance into policy.
  *   **The Solution:** Philosophers like **Richard Brandt** (who proposed "cognitive psychotherapy" to clean preferences), **Peter Railton** (who proposed an "ideal advisor" model), and **John Harsanyi** (in utilitarian economics) argue that welfare should be measured by what an agent *would* want if they were fully informed, rational, and calm.
  *   **The AI Parallel:** You correctly identified **Coherent Extrapolated Volition (CEV)**. This is the attempt to program AI to fulfill humanity's "idealized" values rather than our stated ones, precisely to avoid catastrophic literalism.

  In these frameworks, the "idealized preference" is treated as more *authentic* than the "actual preference" because it aligns with the agent's deeper evaluative standards, freed from cognitive noise.

  ### 2. The Implementation Gap: The Authority Problem
  The theoretical weakness you have spotted is known in the literature as **The Authority Problem** (or sometimes **The Problem of Specification**).

  To calculate an idealized preference, you must specify the *conditions* of idealization: What counts as "full information"? What counts as "rational"? How much "calm reflection" is required? These parameters are underdetermined by theory. There is no physical state of "fully informed" to run a simulation against.

  Because the procedure cannot be run, the result cannot be observed. It must be *estimated*. This creates an epistemic vacuum. In your workplace scenario, the facilitator occupies that vacuum. She is not reporting the results of a deliberation that happened; she is reporting the results of a deliberation she *simulated in her head* on behalf of the group.

  ### 3. Individual vs. Group Idealization
  You asked if the idealization differs in kind between the individual and the group. It does.

  *   **Individual Case (Welfare):** When a theorist says, "You would want X if you were rational," the error is epistemic. If they are wrong, you suffer a welfare loss. The critique here is usually about **Paternalism**.
  *   **Group Case (Legitimacy):** When a facilitator says, "The group would want X if you were rational," the error is *political*. It bypasses the mechanism of consent. In deliberative democracy (e.g., Habermas), legitimacy comes from the *actual* procedure of discourse. By substituting the *outcome* of a hypothetical discourse for the *actual* discourse, the facilitator severs the link between participation and authority. This is not just paternalism; it is a **usurpation of agency**.

  ### 4. The Failure Mode: Established Terms vs. The Gap
  There are several established terms that circle this phenomenon, but none perfectly capture the specific *epistemic collapse* you described.

  *   **Preference Laundering:** Used in social choice theory (e.g., by Robert Goodin). This refers to modifying preferences to make them fit rationality axioms before aggregation. It captures the "cleaning" process but doesn't inherently imply the cleaner's bias infects the result (though critics argue it inevitably does).
  *   **Substituted Judgment:** A legal/medical standard where a surrogate decides what an *incapacitated* person would have wanted. Your facilitator is applying a **Substituted Judgment** standard to *capacitated* agents. This is a category error, but "Substituted Judgment" itself doesn't name the bias failure.
  *   **False Consciousness:** The Marxist concept that people do not know their true interests due to ideology. This matches the "you don't know what you really want" vibe, but it is a structural critique, not a label for the facilitator's specific move.
  *   **Epistemic Paternalism:** Interfering with someone's inquiry for their own good. Close, but again, misses the "I am speaking *as* you" aspect.

  ### 5. The Coinage
  There is no single established term that specifically names the failure mode where the underdetermined parameters of an idealization procedure are unconsciously filled by the idealizer's own preferences, while maintaining the claim of representing the subject's "true" will.

  Garden-variety paternalism admits: "I know better than you."
  Your facilitator claims: "I know *you* better than you do."

  This is distinct because it hijacks the subject's voice rather than overriding it. It treats the subject's actual voice as noise and the idealizer's voice as the signal, but claims the signal belongs to the subject.

  I propose the term **Idealization Capture**.

  **Definition:** *Idealization Capture* occurs when a normative or deliberative process relies on a counterfactual "idealized preference" that is procedurally impossible to verify, resulting in the parameters of the idealization being unconsciously populated by the biases of the idealizer, who then asserts authority over the subject by claiming to represent the subject's "true" will rather than their own.

  It is distinct from **Paternalism** because it denies it is overriding preference (claiming instead to reveal it). It is distinct from **Preference Laundering** because it highlights the *power dynamic* (the capture of the process by the operator) rather than just the data cleaning. It is the epistemic equivalent of regulatory capture: the body meant to represent the public interest (the idealized preference) ends up serving the private interest of the regulator (the facilitator).

