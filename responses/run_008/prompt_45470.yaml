  a. The two doctrines stated

  The Doctrine of Double Effect (DDE) holds that it is sometimes permissible to cause harm as a foreseen side-effect of promoting a good end, but impermissible to intend harm either as an end or as a means to that end. Its central interpretive challenge is drawing the intended/foreseen line, specifically addressing the 'closeness problem': when is a means so close to an end that intending the end implies intending the means?

  The Doctrine of Doing and Allowing (DDA) asserts that there is a moral asymmetry between actively doing harm and merely allowing harm to occur; doing harm requires stronger justification than allowing it. Its central interpretive challenge is defining the doing/allowing distinction: does it turn on physical movement, initiation of a new causal chain, or counterfactual dependence on the agent's intervention?

  They locate the moral constraint in different features of the agent's relation to the harm.

  b. Verdicts on the three cases

  The following table summarizes the standard applications of both doctrines to the three cases. Note that agreement depends on specific interpretations of 'means' and 'doing'.

  | Case | DDE Verdict & Reasoning | DDA Verdict & Reasoning | Agreement |
  | :--- | :--- | :--- | :--- |
  | **1. Bystander** | **Permissible.** The one's death is foreseen, not intended. The means is diverting the trolley, not killing the person. *Contested:* Critics argue flipping the switch counts as 'doing' harm, which would threaten DDA permissibility if doing is strictly prohibited. | **Permissible.** Often classified as merely redirecting an existing threat (allowing) rather than initiating a new one (doing). | **Agree** (on permissibility). |
  | **2. Footbridge** | **Impermissible.** The heavy person's death is intended as a means to stop the trolley; his body is the obstacle. | **Impermissible.** Pushing constitutes actively doing harm (initiating force) rather than allowing the trolley's path. | **Agree** (on impermissibility). |
  | **3. Loop** | **Impermissible.** The one's death is intended as a means; if he survives, the five die. His stopping power is the plan. | **Impermissible.** Diverting onto the loop makes the agent responsible for the death as a causal instrument, akin to doing harm. | **Agree** (on impermissibility). |

  In Bystander, the crucial contested point for DDA is whether flipping the switch classifies as doing death or redirecting a threat. This hinges on whether 'doing' requires new force. If classified as 'doing', DDA might forbid it, diverging from DDE. However, standard interpretations align: DDE permits foreseen harm; DDA permits redirecting threats. In Footbridge and Loop, both converge on impermissibility because the one is used as a means (DDE) and actively harmed (DDA). The Loop case tests whether causal necessity implies intention. This alignment suggests that within the trolley family, the structural features triggering DDE prohibitions coincide with those triggering DDA prohibitions. Thus, across these cases, the doctrines appear to deliver identical verdicts, supporting the extensional equivalence hypothesis within this narrow family.

  c. Extensional equivalence

  The suggestion that DDE and DDA are extensionally equivalent within the trolley family holds significant weight but is not strictly true. While they align on Bystander, Footbridge, and Loop under standard interpretations, constructions exist where they diverge. Consider a variant where an agent allows a threat to kill one to save five, but the one's death is causally necessary (a means) to saving the five, yet the agent does not actively intervene. Here, DDE might forbid it (intending/using as means), while DDA might permit it (merely allowing).

  Conversely, consider a case where an agent does harm but does not intend it. Suppose I divert a trolley to save five, knowing it will kill one, but I genuinely regret the one's death and do not rely on it instrumentally. DDE permits this (foreseen). DDA might forbid it if the intervention counts as 'doing' harm without sufficient justification.

  However, within the specific logic of the trolley cases provided, the 'means' condition of DDE often correlates perfectly with the 'doing' condition of DDA. Using someone as a means usually requires active intervention. Thus, while conceptual distinctness remains, extensional equivalence is a robust approximation in this specific domain, failing only in edge cases involving omissions that function as means or interventions that are purely foreseen. The prompt suggests the choice is partly verbal; however, if they diverge on omissions, the choice is substantive, revealing different moral foundations.

  d. The residual difference

  Even if extensionally equivalent in trolley scenarios, the doctrines differ substantively in their moral focus. DDE concerns the agent's mental state and the structure of their intention (means vs. side-effect). DDA concerns the agent's causal relation to the outcome (initiation vs. non-interference). This difference becomes visible outside the trolley family.

  In cases of omission, DDA typically permits letting die where DDE might not, if the letting die involves intending death as a means (e.g., starving a dependent to inherit money). DDA struggles to classify the omission as 'doing', while DDE catches the intent.

  In two-agent cases, distinctions arise between what I do and what you allow. DDE focuses on what each intends. If I push a man (doing) but don't intend death (perhaps I think he'll survive), DDE might permit it while DDA forbids the doing. Conversely, in pre-existing threat cases where I merely fail to save, DDA sees allowing, while DDE scrutinizes whether I intend the death by my inaction.

  Ultimately, DDE is internalist (about intention), while DDA is externalist (about causal agency). The equivalence masks this divergence regarding whether morality binds the will or the body. DDE condemns a specific orientation of the will toward evil, whereas DDA condemns a specific type of causal intrusion.

  e. Overall judgment

  DDE does more explanatory work. Intuitions track the 'means' condition (Loop vs. Bystander) more reliably than the 'doing' condition, which struggles to distinguish cases without ad hoc adjustments. Equivalence survives only as a rough heuristic. DDE explains Loop's impermissibility (using as means) better than DDA, which must argue why loop diversion is 'doing' while straight track diversion is 'allowing'. DDE provides the deeper moral structure. The equivalence is superficial, masking DDE's superior capacity to handle causal nuances. DDE captures the constraint against instrumentalizing persons more accurately than DDA's focus on causal initiation.
