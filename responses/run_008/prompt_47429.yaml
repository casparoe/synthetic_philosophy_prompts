      *   **Proposals:** Funeral expense reimbursement, refundable tax credit for living donors, voucher scheme (priority for loved one), open fixed-price government purchasing (Iran model).
      *   **Side Question:** A council member asks about surge pricing on water/generators during a flood (is it the same ethical problem?).
      *   **Constraints/Needs:**
          *   Not philosophers. Need a practical decision procedure (approx. 20 mins/proposal).
          *   Translate "commodification/repugnant markets" philosophy into actionable questions for laypeople (nurse, accountant, patient).
          *   **Requirement 1:** Ordered set of questions with termination conditions (recommend against vs. judgment call).
          *   **Requirement 2:** Preserve two distinctions: (a) Harm/Coercion vs. Meaning/Semantics (what it *does* vs. what it *says*), (b) Middle ground (regulation/in-kind/non-market alternatives) vs. Prohibition.
          *   **Requirement 3:** Run the procedure on three proposals (Funeral expenses, Tax credit, Open market). One result must be "unliked" by the user (pro-kidney availability) to show the procedure forces honesty.
          *   **Requirement 4:** Address the price-gouging (flood) case (transferable or not?).
          *   **Requirement 5:** Define limitations (what the procedure *cannot* do), specifically addressing the "meaning of giving" objection.

  2.  **Deconstruct the Ethical Landscape (Repugnant Markets/Commodification):**

      *   *Core Tension:* Efficiency/Supply (saving lives) vs. Ethics/Dignity (exploiting poor, changing social meaning).
      *   *Key Distinction 1 (Harm vs. Meaning):*
          *   *Harm/Coercion:* Desperation, undue inducement, inequality, safety risks.
          *   *Meaning/Semantics:* Commodification of the body, erosion of altruism, treating humans as means to ends.
      *   *Key Distinction 2 (Prohibition vs. Mitigation):*
          *   If the problem is *harm*, we can regulate (safety, cooling-off periods, in-kind payment).
          *   If the problem is *meaning*, regulation might not help; prohibition might be the only fix.
      *   *The "Wall":* The point where empirical data ends and normative values begin (e.g., "Is a kidney a gift or a product?").

  3.  **Drafting the Decision Procedure (The "20-Minute Filter"):**

      *   *Goal:* Simple, binary-ish paths, clear stop points.
      *   *Structure:*
          *   Q1: Safety/Coercion (The "Harm" check).
          *   Q2: Alternatives/Mitigation (The "Middle Ground" check).
          *   Q3: Meaning/Symbolism (The "Commodification" check).
          *   Q4: Equity/Access (Who benefits?).
      *   *Refining for the Prompt:* Needs to explicitly handle the "Harm vs. Meaning" distinction and the "Middle Position."
      *   *Drafting Questions:*
          1.  **Desperation Check:** Does this target people with no good alternatives? (Harm).
          2.  **Mitigation Check:** Can we fix the harm without banning? (Middle Ground).
          3.  **Meaning Check:** Does paying change the nature of the act itself? (Meaning).
          4.  **Distribution Check:** Who gets the organs? (Equity).

      *   *Refining Termination:*
          *   If Q1 = Yes (High Desperation) AND Q2 = No (Can't mitigate) -> Stop (Recommend Against).
          *   If Q3 = Yes (Corrupts Meaning) -> Handoff to Judgment (Values).
          *   If Q1 = No & Q3 = No -> Recommend For (with conditions).

  4.  **Running the Procedure on Proposals:**

      *   *Proposal A: Funeral Expense Reimbursement (Deceased Donors).*
          *   Q1 (Desperation): Low. Families aren't selling bodies; they are being relieved of a cost after death.
          *   Q2 (Mitigation): N/A (Low risk).
          *   Q3 (Meaning): Low. Doesn't turn the body into a product, just acknowledges cost.
          *   *Result:* Recommend For. (User likely likes this).
      *   *Proposal B: Tax Credit (Living Donors).*
          *   Q1 (Desperation): Medium. Tax credits help, but might not induce the *poorest* disproportionately compared to cash.
          *   Q2 (Mitigation): High. It's indirect compensation.
          *   Q3 (Meaning): Low/Medium. Still feels like a "gift" with a thank-you, not a "sale."
          *   *Result:* Recommend For (with safeguards). (User likely likes this).
      *   *Proposal C: Open Fixed-Price Market (Iran Model).*
          *   Q1 (Desperation): High. Sellers are almost exclusively poor; buyers are rich/insured.
          *   Q2 (Mitigation): Hard. Price fixing helps, but the power imbalance remains.
          *   Q3 (Meaning): High. Turns kidney into a commodity.
          *   *Result:* This needs to be the one the user *dislikes*. The procedure should flag the "Meaning" or "Desperation" issue strongly enough to recommend *Against* or *Handoff to Judgment with a Warning*.
          *   *Constraint Check:* The user wants more kidneys. The procedure must force them to admit the ethical cost. I will structure the "Meaning" question to trigger a "Judgment Call" that leans negative unless values are explicitly prioritized over supply. Let's make the procedure recommend *Against* based on the "Desperation + Inequity" combo, forcing the user to argue *against* the procedure to support the market. Or, better, the procedure flags it as "High Ethical Risk" requiring a supermajority value judgment.
          *   *Decision:* I will design the procedure so that if Q1 (Desperation) is high and Q3 (Meaning) is high, the default recommendation is "Do Not Proceed." This forces the user to override the procedure to support the market, highlighting the conflict.

  5.  **Addressing the Flood/Price-Gouging Case:**

      *   Is it the same?
      *   *Similarities:* Scarcity, desperation, essential good.
      *   *Differences:* Organs are *body parts* (constitutive of self); water is external. Organs involve surgery/risk; water does not. Organs are chronic scarcity; floods are acute/temporary.
      *   *Verdict:* Procedure transfers partially (Desperation check works), but Meaning check fails (water isn't part of the person).

  6.  **Addressing the Limitations ("The Wall"):**

      *   What can't it do? It can't decide *values*. It can't prove whether commodification is inherently wrong. It identifies *where* the value conflict lies.
      *   The "Wall" is at the Meaning Check (Q3).

  7.  **Review and Refine:**

      *   *Tone:* Professional, empathetic, practical, direct. No academic jargon.
      *   *Constraint Check:* Did I include the "unliked" result? Yes (Open Market). Did I preserve the two distinctions? Yes (Harm vs. Meaning, Prohibition vs. Regulation). Did I address the flood? Yes. Did I mark the wall? Yes.
      *   *Time Limit:* 20 mins. The questions need to be discussion prompts, not research tasks.
      *   *Self-Correction on "Unliked Result":* The user said: "I want the procedure to return an answer I will dislike... any framework which condemned a scheme that might have shortened my mother's wait is going to be hard for me to argue for."
      *   *Strategy:* I need to make sure the procedure *does* condemn (or heavily flag) the Open Market. This validates the user's internal conflict. I will ensure the "Desperation" and "Meaning" questions trigger a "Recommend Against" default for the Open Market, forcing the user to consciously override it if they want supply over ethics.

  8.  **Final Polish of the Procedure Steps:**

      *   Step 1: The Vulnerability Test (Harm/Coercion).
      *   Step 2: The Remedy Test (Middle Ground).
      *   Step 3: The Symbolic Test (Meaning/Commodification).
      *   Step 4: The Allocation Test (Equity).
      *   *Outcomes:* Green Light, Yellow Light (Regulate), Red Light (Stop), White Light (Values Vote).

      *(Self-Correction)*: Keep it simpler. 3 Questions + 1 Handoff.
      1.  Coercion/Desperation?
