answer: |-
  Here is a decision procedure designed for your council. It is built to fit a twenty-minute discussion, requires no philosophical training, and forces the specific distinctions you requested.

  ### Part 1: The Decision Procedure ("The Council Filter")

  **Instructions:** For each proposal, the facilitator reads the three questions in order. The group must reach a consensus (or majority vote) on each before moving to the next.

  **Question 1: The Desperation Check (Harm & Coercion)**
  *   **Ask:** "Does this proposal rely on people accepting risks or burdens they would refuse if they had a decent income or safety net?"
  *   **Sufficient Answer:**
      *   **No:** The benefit is incidental to normal life (e.g., a tax credit for existing donors). -> *Proceed to Q2.*
      *   **Yes:** The benefit is a lifeline that overrides safety concerns (e.g., cash for the destitute). -> *Proceed to Q2.*
  *   **Termination Point:** If the answer is **Yes** AND the group agrees the risk is physical/psychological harm that cannot be medically screened out, **terminate with a Recommendation Against.** (This settles cases of unmitigable exploitation).

  **Question 2: The Mitigation Check (The Middle Position)**
  *   **Ask:** "If we answered 'Yes' to Q1, can we fix the coercion without banning the program? (e.g., cooling-off periods, in-kind payments instead of cash, income caps, government as sole buyer)."
  *   **Sufficient Answer:**
      *   **Yes:** We can regulate the terms to protect the vulnerable. -> *Proceed to Q3.*
      *   **No:** The harm is inherent to the transaction structure itself. -> **Terminate with a Recommendation Against.**
  *   **Note:** This preserves the "remedies short of prohibition" distinction. If the problem is *conditions*, we fix conditions. If the problem is *existence*, we stop.

  **Question 3: The Meaning Check (Commodification)**
  *   **Ask:** "Does paying for this change what the act *is*? (e.g., Does it turn a 'gift of life' into a 'sale of parts'? Does it make the body a warehouse of inventory?)"
  *   **Sufficient Answer:**
      *   **No:** It remains a gift, merely reimbursed or thanked. -> **Recommendation For.**
      *   **Yes:** It fundamentally alters the social meaning of the act. -> **Handoff to Judgment Call.**
  *   **Handoff Protocol:** If Q3 is **Yes**, the procedure stops. The group must vote based on values, not rules. The minutes must record: *"The group acknowledges this creates a market in [X]. We are proceeding/stopping based on a value judgment that [Supply/Saving Lives] outweighs [Commodification/Dignity] (or vice versa)."*

  ***

  ### Part 2: How the Distinctions Survive

  1.  **Harm vs. Meaning:** Question 1 isolates *harm* (desperation, coercion). Question 3 isolates *meaning* (commodification, symbolism). A proposal can fail Q1 (too dangerous) but pass Q3 (not commodifying), or pass Q1 (safe) but fail Q3 (commodifying). They are treated as separate hurdles.
  2.  **Prohibition vs. Regulation:** Question 2 is the "Middle Position" gate. It forces the group to ask if regulation can solve the Q1 problem. If the answer is "Yes, we can regulate," prohibition is ruled out. If "No," prohibition is triggered. This prevents sliding from "this is risky" straight to "this is banned" without considering safeguards.

  ***

  ### Part 3: Running the Proposals

  Here is the output of the filter on your three specific cases.

  **1. Proposal: Reimbursing Funeral Expenses (Deceased Donors)**
  *   **Q1 (Desperation):** **No.** The family is not selling a body to survive; they are being relieved of a cost after a death has already occurred. The decision to donate is not driven by the money.
  *   **Q2 (Mitigation):** N/A.
  *   **Q3 (Meaning):** **No.** Reimbursing a cost does not turn the body into a product. It acknowledges the family's sacrifice without pricing the organ.
  *   **Result:** **Recommendation For.**
  *   **Council Action:** Approve.

  **2. Proposal: Refundable State Tax Credit (Living Donors)**
  *   **Q1 (Desperation):** **No/Low.** A tax credit requires having a tax liability or waiting for a refund. It does not offer immediate cash to someone in acute crisis. It rewards altruism rather than inducing desperation.
  *   **Q2 (Mitigation):** N/A.
  *   **Q3 (Meaning):** **No.** This is widely viewed as a "thank you" or cost-offset, similar to reimbursing travel. It does not feel like a purchase price.
  *   **Result:** **Recommendation For.**
  *   **Council Action:** Approve.

  **3. Proposal: Open Fixed-Price Government Purchasing (Iran Model)**
  *   **Q1 (Desperation):** **Yes.** Evidence from similar markets shows sellers are disproportionately poor and buyers are wealthy. The fixed price is a lifeline for sellers, creating an unequal bargaining position.
  *   **Q2 (Mitigation):** **No.** While government purchasing removes black-market middlemen, it cannot remove the economic desperation that drives the seller. You cannot regulate away poverty in a cash-for-organ swap.
  *   **Q3 (Meaning):** **Yes.** This explicitly prices the kidney. It changes the language from "donation" to "procurement." It treats the body as a source of spare parts.
  *   **Result:** **Recommendation Against.** (Triggered at Q2 due to unmitigable coercion, reinforced by Q3).
  *   **The Unliked Truth:** This is the result you said you would dislike. You want more kidneys; your mother waited four years. This procedure tells you that securing those kidneys via this method relies on unmitigable desperation and changes the meaning of the act.
  *   **Forcing Honesty:** To support this proposal, you cannot simply say "it saves lives." You must formally override the procedure's "Recommendation Against." You must stand up and say: *"I acknowledge this exploits economic desperation and commodifies the body. I vote to proceed anyway because I value supply over these ethical costs."* The procedure prevents you from hiding behind "it's regulated" or "it's just compensation." It forces you to own the trade-off.

  ***

  ### Part 4: The Flood Case (Price Gouging)

  **Does the procedure transfer?**
  **Partially.**

  *   **Q1 (Desperation):** **Transfers.** Selling generators at 10x cost during a flood relies entirely on the buyer's lack of alternatives. This is the same coercion logic as the kidney market. The procedure would likely flag this as **Recommendation Against** (exploitation of necessity).
  *   **Q2 (Mitigation):** **Transfers.** Price caps or government distribution are the regulatory equivalents of "government sole buyer" in organs.
  *   **Q3 (Meaning):** **Does Not Transfer.** This is the critical divergence. Selling water at a high price does not change the *meaning* of water or the *meaning* of the seller's body. There is no "commodification of the self" issue.
  *   **Verdict:** The procedure condemns price gouging on **Harm/Coercion** grounds (Q1), not **Meaning** grounds (Q3).
  *   **Difference:** In the kidney case, even if you solve the poverty (Q1), the Meaning objection (Q3) might still stop you. In the water case, if you solve the coercion (e.g., by distributing free water), there is no remaining ethical objection. The kidney problem is deeper; the water problem is logistical/economic.

  ***

  ### Part 5: What the Procedure Cannot Do (The Wall)

  Several of your council members are right: No checklist can determine whether paying for organs changes what giving means.

  **The Wall:**
  The wall falls at **Question 3 (The Meaning Check).**

  *   **What the procedure DOES:** It identifies *that* there is a conflict. It separates the empirical facts (are people desperate?) from the normative values (is selling a kidney wrong?). It prevents you from confusing the two.
  *   **What the procedure CANNOT DO:** It cannot tell you whether the "Meaning" objection is more important than the "Life-Saving" benefit.
      *   If the group answers **Yes** to Q3, the procedure hands off to a **Judgment Call**.
      *   At that moment, the accountant, the nurse, and the patient are no longer analyzing data; they are voting on their souls.
      *   The procedure cannot resolve whether a kidney is a "gift" or a "resource." It only forces you to admit that you are making that choice.

  **Why this matters for you:**
  You mentioned that any framework condemning a scheme that might have shortened your mother's wait is hard to argue for. The procedure respects that. It allows you to override the "Recommendation Against" on the Open Market, but it strips away the cover. It ensures that if you vote for the market, you are not pretending it isn't a market. You are voting to accept commodification as the price of supply.

  The wall is not before the questions; it is after them. The questions clear the brush so you can see the wall clearly. You cannot climb it with a checklist. You have to climb it with a vote.
