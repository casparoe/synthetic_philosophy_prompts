      *   Part 1: The Procedure (The "Kidney Council Filter").
      *   Part 2: The Two Distinctions (Embedded in the procedure).
      *   Part 3: Running the Proposals (Funeral, Tax, Market). *Ensure Market gets the "Red Light".*
      *   Part 4: The Flood Case (Transferability).
      *   Part 5: The Wall (Limitations).

  10. **Refining the "Market" Result:** To ensure the user dislikes it, the procedure must weigh the "Meaning" and "Desperation" heavily. If the procedure concludes "Recommend Against" for the Open Market, the user (who admits wanting more kidneys) will find that result difficult. This matches the prompt.

  11. **Refining the "Flood" Case:** Be precise. The procedure applies to *exploitation* (Q1) but not *commodification* (Q3).

  12. **Refining the "Wall":** Be clear that the procedure identifies the conflict but doesn't resolve the ultimate value judgment.

