answer: |-
  MEMORANDUM

  **To:** Research Computing Committee
  **From:** Student Representative
  **Date:** 14 October 2023
  **Subject:** Recommendation on GPU Cluster Allocation Mechanism

  I recommend that the Committee adopt the Hybrid allocation model, implementing the internal credit system alongside a committee-held reserve for exploratory work by junior researchers. This approach best balances efficiency with equity, leveraging market mechanisms to solve information asymmetries while mitigating the distributive injustices inherent in pure price systems.

  The current status quo resembles the central planning criticised by Mises and Hayek. Under the proposal-based system, the Committee acts as a planning board attempting to allocate resources without genuine price signals. Mises argued that rational calculation is impossible without market prices; here, the 'price' of compute is zero to the user, leading to the chronic oversubscription we observe. Hayek's knowledge problem is equally pertinent: researchers possess tacit, dispersed knowledge of their actual computational needs, which they cannot fully communicate in written proposals. Consequently, they pad requests, and the Committee, lacking local knowledge, cannot verify them. The result is the idle capacity and bottlenecks we currently face. The credit system proposes a Langean solution: the Committee acts as the planning board, simulating a market by adjusting posted credit rates via trial and error (tâtonnement) until demand meets supply.

  However, we must not assume these arguments transfer unchanged from a national economy to a faculty cluster. Lange's model was criticised for being too complex for a whole economy, but our scope is narrow. The 'goods' are homogeneous (GPU-hours), and preferences are relatively uniform. This makes the Committee's task of finding clearing prices far more feasible than Lange envisioned for steel or coal. Therefore, a credit system is theoretically viable here in a way national socialism was not.

  A member has objected that because researchers can compare our internal rate with commercial cloud prices, the calculation problem dissolves. This misunderstands the nature of the scarcity. Commercial cloud prices reflect Amazon's or Microsoft's marginal costs and profit margins, not the specific scarcity constraint of our local cluster. While cloud prices provide an external ceiling—if our credit cost implies a higher monetary value than AWS, users should leave—they do not solve the internal allocation problem. We are not trying to determine the absolute value of compute, but rather to ration a fixed, oversubscribed supply among competing internal demands. External prices cannot clear our local queue.

  We must also confront the distributive question which the classic socialist calculation debate largely brackets. A pure credit system allocates based on initial endowments (group size or past usage), not scientific merit. The proposal system, for all its inefficiencies, pretended to correct for this by allowing the Committee to prioritise high-value research. A pure market mechanism imports unfairnesses: established groups with larger budgets can outbid junior researchers regardless of the potential scientific yield. This risks entrenching existing hierarchies rather than optimising knowledge production. The Hybrid model addresses this by retaining a reserve. This functions similarly to a social dividend or specific grant funding, ensuring that those with low initial endowments but high potential merit are not priced out of the market entirely.

  The strongest argument for the losing option—the Pure Credit System—is efficiency. Proponents argue that adding a committee-held reserve reintroduces the very central planning distortions the credit system seeks to eliminate. Allocating the reserve requires judgement calls on 'merit', inviting lobbying and administrative burden. A pure market is blind to status; it rewards only those who value the resource most highly at the margin. If the goal is strictly to ensure no GPU-hour sits idle, the pure credit system is superior. It removes administrative friction and ensures capacity is always used by those willing to pay the clearing price.

  However, efficiency cannot be the sole metric for a public faculty. We are not a cloud provider; we are an academic community. The proposal system failed because it tried to plan usage without prices; the pure credit system fails because it prices without regard for mission. The Hybrid model accepts the Hayekian insight that we need prices to utilise dispersed knowledge, but rejects the Misesian conclusion that we must abandon all planning. By using credits for routine allocation and reserves for exploratory work, we acknowledge that while prices are excellent for rationing scarcity, they are poor at nurturing nascent research.

  In conclusion, the Hybrid model offers a pragmatic synthesis. It utilises Lange's trial-and-error pricing to clear the queue and eliminate padding, satisfying the efficiency critique of the status quo. Simultaneously, it recognises the distributive limitations of market mechanisms within a public institution. I urge the Committee to vote for the Hybrid option at the Michaelmas round.
