answer: |-
  ## Session Plan: Disassembling the Intuition Pump

  **Goal:** Move participants from "This story proves X" to "This story is calibrated to make me feel X."
  **Time:** 90 Minutes
  **Tools:** Whiteboard, markers.

  ### 1. The Setup & The Pivot (0–15 mins)
  **Objective:** Establish that thought experiments are not evidence about the world, but probes of conceptual commitments.
  *   **Hook:** Ask, "If I tell you a story about a magic genie, have I proved magic exists?" (Obviously no). "If I tell you a story about a scientist who never sees color, have I proved something about color?" (Maybe).
  *   **The Pivot:** Draw a arrow: `Story -> Intuition -> Conclusion`.
  *   **Critical Distinction:** Most people think the arrow goes `Story -> World -> Conclusion`. You must establish that the middle step is **Internal Data**.
  *   **Key Phrase:** "Your gut reaction is not a measurement of the *case*; it is a measurement of *your concepts*."
  *   **Why here:** If they think the intuition is evidence about the world, they will treat the story as a factual claim. You must reframe the intuition as *data about the listener* before you can show how that data can be manipulated.

  ### 2. The Carrying Example: The Experience Machine (15–30 mins)
  **Recommendation:** **Talk yourself out of the Chinese Room.**
  *   **Why:** The Chinese Room requires defining "syntax," "semantics," and "computation" before you can even start. With a mixed crowd, you will lose 30 minutes to "But what if the robot walks around?" debates.
  *   **Choose:** **Nozick's Experience Machine.**
  *   **Why:** Everyone understands "pleasure" and "reality." The setup is two sentences. It isolates the *value judgment* being pumped without requiring technical definitions. It is easier to vary details live on a whiteboard without breaking the scenario's logic.
  *   **Setup:** Draw a tank on the board. "You can plug in. You feel perfect happiness. You never know it's fake. Do you plug in?"
  *   **Vote:** Show of hands. Yes vs. No. (Usually split).

  ### 3. The "Flip" Exercise (30–50 mins)
  **Objective:** Demonstrate that small structural changes flip the intuition, proving the intuition isn't about the core outcome (happiness).
  *   **Instruction:** "We are not debating if you *should* plug in. We are testing *why* you said no."
  *   **The Variation:** Ask the "No" voters: "What if the machine erased your memory of plugging in? You think it's real life." (Still no). "What if *everyone* else is in the machine, and you're the only one outside managing it?" (Intuition often shifts).
  *   **The Critical Flip:** "What if the machine is **not** a machine? What if it's just 'Life', but you are guaranteed good outcomes?"
  *   **Action:** Have them propose one detail change that would make them switch sides. Write these on the board under "Loaded Details."
  *   **Why here:** This is the kinetic moment. They must feel the instability of their own intuition to understand how a writer can stabilize it to suit an argument.

  ### 4. Disassembly: Spotting the Smuggle (50–75 mins)
  **Objective:** Identify *what* value was smuggled in the original framing.
  *   **Analysis:** Look at the "Loaded Details" list.
  *   **The Reveal:** The original story smuggles "Passivity" and "Fakeness" into the definition of "Happiness." It pumps the intuition that "Reality matters more than Pleasure" by making Pleasure seem cheap.
  *   **Generalizable Tool:** Teach them the **"Neutralize" Test**. When you hear a thought experiment in the wild:
      1.  Identify the conclusion (e.g., "AI can't think").
      2.  Identify the intuition required (e.g., "The man in the room doesn't understand").
      3.  Ask: "What detail is doing the heavy lifting?" (e.g., "The rulebook").
      4.  Vary that detail. Does the intuition hold?
  *   **Why here:** Now that they've felt the flip, they are ready to learn the method for detecting it in others' work.

  ### 5. Close & Check (75–90 mins)
  **Objective:** Consolidate the skill and verify uptake.
  *   **Refusal:** Explicitly state what you are *not* solving. (See Omissions below).
  *   **The Check Question:** (See JSON).
  *   **Takeaway:** "Don't ask if the story is true. Ask what work the story is doing."

  ---

  ### Misconceptions & Antidotes
  1.  **"Thought experiments are just bad arguments/fiction."**
      *   *When:* Intro (0–15 mins).
      *   *Antidote:* Reframe them as "calibrated instruments," not "claims." A thermometer isn't a claim about heat; it's a tool to measure it.
  2.  **"My gut reaction is the proof."**
      *   *When:* Before the Example (15 mins).
      *   *Antidote:* "Your gut is data about *your* concepts, not the *world*. Data can be noisy."
  3.  **"Changing the story is cheating."**
      *   *When:* During Exercise (30–50 mins).
      *   *Antidote:* "In engineering, we stress-test bridges. In thinking, we stress-test intuitions. Changing details is the *only* way to test validity."

  ### Omissions (What to Refuse)
  *   **The "Right" Answer:** Refuse to conclude whether plugging in is moral or if AI can think.
  *   **Historical Context:** No biography of Nozick or Searle.
  *   **Technical Definitions:** Do not define "qualia," "syntax," or "utilitarianism." Use plain English.
  *   **Other Examples:** Do not introduce Trolley or Chinese Room as comparators. Stick to one case to depth.

  ---

