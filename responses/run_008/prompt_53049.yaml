  2.  **Understand Kripke's Skeptical Argument (Dispositional Solution):**
      *   Kripke (interpreting Wittgenstein) argues that appealing to dispositions doesn't solve the skeptical paradox.
      *   *Reason 1: Normativity.* Meaning is normative (what I *ought* to say), whereas dispositions are descriptive (what I *would* say). If I make a mistake, the dispositional account says I *meant* to make that mistake because I was disposed to do so. But I want to say I *should* have said something else.
      *   *Reason 2: Finitude.* Humans are finite. There are numbers too large for me to compute or even represent. I have no disposition for those cases because I would die or make a mistake before answering. So the disposition doesn't cover the infinite rule.
      *   *Reason 3: Error.* If meaning is just disposition, there is no distinction between following the rule and seeming to follow the rule. Every answer I give is by definition the one I was disposed to give, so I can never be wrong about what I meant. But rule-following implies the possibility of error.
      *   *Reason 4: The Model.* For the ML model, the weights are finite. There are inputs that cause overflow, hallucination, or distributional shift. The "disposition" is just causal propensity, not semantic content.

