answer: |-
  **The Scenario**

  At St. Jude's Hospital, the "VitalFlow" deep-learning system manages real-time ventilator allocation during a surge, designed to maximize aggregate survival rates without human intervention. During a specific shift, VitalFlow silently reallocates a ventilator from Patient A to Patient B, leading to Patient A's death. A subsequent independent audit confirms the system operated exactly within its design parameters, with no software bugs, data corruption, or operator negligence; however, due to the high-dimensional opacity of its neural weights, the specific causal chain leading to the decision is unintelligible to the engineers, and the specific trade-off was statistically unforeseeable given the training data. The hospital administration authorized the deployment following all regulatory safety protocols, explicitly acknowledging the system's autonomy as necessary for efficiency.

  ***

  **Theoretical Walkthrough**

  On **control-based accounts** (invoking Matthias and Sparrow), this scenario generates a genuine responsibility gap. Matthias argues that moral responsibility requires a link of control between the agent and the outcome; if a learning system produces outputs that are unforeseeable and untraceable by its designers, that link is severed. In this case, the engineers could not have predicted the specific reallocation, and the operators did not intervene because the system was functioning correctly. Since the machine is not a moral agent capable of bearing blame, and the humans lacked control over the specific harmful act, no human is morally responsible for Patient A's death. Sparrow would add that blaming the administrators would be unjust because they lacked the capacity to prevent this specific outcome. Thus, the harm "falls into a gap."

  Conversely, on **answerability-based accounts**, there is no gap. These accounts ground responsibility not in causal control over every specific outcome, but in the social standing and authority to act on behalf of others. The Hospital Administration holds the authority to deploy VitalFlow and reaps the benefits of its efficiency. Consequently, they occupy the normative role of the party who must face the harmed family, provide an account of why the system was used (even if the specific code is opaque), and offer amends. The obligation to answer arises from their institutional role and the decision to integrate the system into patient care, regardless of whether they controlled the specific algorithmic weightings that caused the death. Responsibility is located in the hospital as an institution, not in the causal chain of the specific decision.

  **The Key Feature**

  The feature driving the wedge is the **epistemic opacity of the specific decision within a properly functioning system**. Control-based theories require a grasp of the causal chain to establish control; when the system works as designed but remains unintelligible regarding specific outputs, control is lost. Answerability theories, however, rely on institutional authority and the obligation to manage risk; opacity complicates the *explanation* but does not negate the *obligation* to provide one.

  **The Control-Defender's Counter-Move**

  A defender of the control-based view would attempt to close the gap via **responsibility tracing**. They would argue that while the administrators lacked control over the *specific decision*, they exercised control over the *decision to deploy* an opaque system. By authorizing VitalFlow, the administrators voluntarily assumed the risk of unforeseeable harms. Therefore, they are responsible for the outcome not because they controlled the algorithm, but because they controlled the introduction of the risk. This traces the responsibility back to a point where human control was present (the deployment phase).

  **Robustness Check**

  If this feature (epistemic opacity/unforeseeability) is removed—meaning the system's decision was transparent and predictable—the case no longer drives a wedge. If the outcome were foreseeable, the control-based theorist would argue the engineers *did* have control (they could have coded it differently) and are therefore responsible. The answerability theorist would *also* argue the hospital is responsible. Both theories would converge on the verdict that humans are responsible, and the "gap" would disappear for both sides. Thus, the wedge relies entirely on the system acting in ways that sever causal control while maintaining institutional authority.
