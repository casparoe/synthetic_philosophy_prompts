      *   *Walkthrough?* Need to ensure I distinguish Matthias/Sparrow from Answerability (e.g., Shoemaker-inspired or institutional).
      *   *Feature identification?* Epistemic opacity of the specific act.
      *   *Tracing argument?* "Culpable ignorance" or "Risk assumption."
      *   *Removal test?* If opacity is gone, Control view finds responsibility, wedge collapses.

  9.  **Final Polish:** Ensure tone is academic and precise. Make sure the distinction between "causal control" and "moral answerability" is sharp. (Self-Correction: Ensure I don't conflate Answerability with Liability. Answerability is about owing an account. Liability is about punishment. The prompt asks for "answerability — being the party who owes an explanation and amends".)

      *   *Name Check:* Andreas Matthias ("The Responsibility Gap"), Robert Sparrow ("Killer Robots"). For answerability, I can reference the general family (e.g., Angela Martin, or just the conceptual distinction). I will stick to the conceptual families as requested.

      *   *Drafting the response:*
