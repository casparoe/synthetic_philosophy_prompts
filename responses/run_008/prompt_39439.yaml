answer: |-
  ### Ground Rules for the No-Self Reading Group

  We are not here to defend a pre-existing conclusion, but to test whether a coherent picture of human life is possible once the notion of a persisting self is removed. To prevent the discussion from drifting into vague mysticism or covert substantialism, any account we consider must meet the following five desiderata.

  #### 1. Phenomenological Continuity
  The account must explain how memory and anticipation function without a persisting subject. It is not enough to say "there is remembering but no rememberer." The theory must specify the mechanism by which a present mental event accesses a past one, and how a present intention projects into a future experience, without positing an underlying entity that owns these events. If the link is causal, the nature of that causality must be described without implying a carrier.

  #### 2. Conventional Viability
  The account must make room for ordinary interpersonal practices that seem to presuppose a stable person. We promise, we hold grudges, we praise virtue, and we blame wrongdoing. These practices rely on the assumption that the person who acted is the same person who is now being praised or blamed, and the same person who will fulfill the promise. The theory must explain how these practices remain meaningful, binding, or at least intelligible if the "person" is merely a designation for a collection of fleeting events.

  #### 3. Soteriological Continuity (Rebirth)
  The account must say something determinate about what, if anything, carries over in rebirth. If there is no self to die and no self to be born, we need a precise description of the transmission mechanism. Is it the transfer of energy? The continuation of a causal chain? The inheritance of karmic tendencies? The explanation cannot rely on a "subtle self" or a "consciousness essence" that survives the break of death, or it violates the core premise.

  #### 4. Cross-Tradition Robustness
  The account must handle Western metaphysical puzzle cases, such as teletransportation, fission, or brain transplants. These cases test our intuitions about identity and survival. If the Buddhist account claims that identity is an illusion, it must predict our intuitions in these cases correctly or explain why our intuitions are systematically mistaken. It cannot simply ignore these puzzles as "Western" problems; if the nature of persons is being investigated, the puzzles apply universally.

  #### 5. The No-Smuggling Constraint
  This is the critical constraint. The account cannot replace the word "self" with "stream," "continuum," "causal series," or "aggregate" while retaining the functional role of the self. If the "stream" is doing the work of unifying experience, bearing responsibility, and surviving death, it is a self in a costume. The theory must demonstrate how unity and continuity arise without a unifier or a continuer. It must avoid positing a "glue" that holds the moments together, for that glue becomes the new self.

  ***

  ### The Incompatibility Flag

  There is a direct tension between **Desideratum 2 (Conventional Viability)** and **Desideratum 5 (The No-Smuggling Constraint)**.

  Ordinary practices like promising and retributive blame require a robust locus of agency. To truly hold a grudge or bind a promise, there must be a single entity that persists through time to be the target of that grudge or the bearer of that promise. If you weaken the "person" enough to satisfy the No-Smuggling Constraint (admitting there is no real unity, only a causal heap), you undermine the metaphysical foundation required for Conventional Viability.

  Conversely, if you strengthen the "causal stream" enough to support genuine blame and binding promises, you inevitably smuggle in a substantive self. You begin to treat the causal chain as if it has boundaries and ownership properties that mere causality does not possess. You cannot have it both ways: you cannot have a truly selfless ontology that also ultimately validates our deepest intuitions about personal responsibility.

  ***

  ### The Commitment

  If we are forced to choose, **I drop Desideratum 2 (Conventional Viability) in its ultimate form.**

  Here is the argument for this choice: The primary purpose of investigating *anatta* is to dismantle the grasping that causes suffering. That grasping is fueled by the belief that we are ultimately responsible agents who can be praised or blamed, and who can secure the future through promises. If we insist that the theory must validate these practices at the ultimate level, we will be forced to smuggle a self back in to do the work (violating Desideratum 5). We will end up with a "stream" that acts exactly like a soul, merely to save our comfort with moral judgment.

  It is philosophically more honest to admit that if *anatta* is true, retributive blame and binding promises are ultimately unintelligible. They are useful fictions for social coordination, but they do not map onto reality. We can keep the practices conventionally—we still promise and we still hold people accountable—but we must drop the requirement that our metaphysics *justify* them.

  By sacrificing the demand for ultimate ethical coherence, we protect the integrity of the No-Smuggling Constraint. We allow the "stream" to remain a mere causal series without forcing it to bear the weight of moral ownership. This leaves us with a harder doctrine, but a cleaner one. It forces the group to confront the possibility that a fully realized understanding of no-self changes not just how we think, but how we judge, forgive, and bind ourselves to others. If the theory saves the self to save our ethics, it has failed. Better to save the insight and let the ethics become provisional.
