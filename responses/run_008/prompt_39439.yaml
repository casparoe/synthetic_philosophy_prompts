prompt: |-
  starting a reading group on buddhist no-self and I want to kick things off with ground rules instead of any particular theory. Write the desiderata: what an adequate account of persons has to deliver once you take anatta seriously — e.g. it has to explain how memory and anticipation even work without a persisting subject, it has to make room for the ordinary practices (promising, praise and blame, holding grudges) that seem to presuppose a stable person, it has to say something determinate about what if anything carries over in rebirth, and it should handle the western puzzle cases like teletransporters too, since our group is reading both literatures. Here's the part I actually care about: most reductionist moves replace the self with a causal stream of psychophysical events, and I have a suspicion that a "stream" doing all the unity-work the self used to do is just the self in a costume. So the list must include a no-smuggling requirement — the account can't bring the self back under another name — and you should flag any pair of desiderata you think can't be jointly satisfied. Then commit: if the list is jointly unsatisfiable, say which requirement you'd actually drop and why, don't just lay out the menu for me to pick from. no citations, just the positions and arguments.
