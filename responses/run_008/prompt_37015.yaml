answer: |-
  Your diagnosis is remarkably astute. To suggest that the impasse is not merely about interpersonal comparability but about the *normative status of the representation theorem itself* is to identify the fault line that has kept this debate dormant for decades. You have correctly perceived that the formalism is acting as a proxy for a deeper methodological disagreement.

  I shall address your hypothesis directly, then expand upon the substantive divisions that sustain the stalemate, and finally offer a candid assessment of what might constitute progress.

  ### 1. The Status of the Axioms: Substance or Form?

  Your working hypothesis is that the disagreement turns on whether the von Neumann–Morgenstern (vNM) axioms encode substantive norms of rationality that social evaluation must inherit, or whether they are merely a convenient mathematical dressing. On this point, you are largely correct, though I would refine it slightly.

  For **Harsanyi**, the vNM axioms are indeed substantive norms of rationality, but crucially, they apply to *moral preferences* just as they do to individual preferences under risk. In his 'Impartial Observer' argument, Harsanyi posits that if an agent is making a moral judgement, they are essentially choosing behind a veil of ignorance (to use the Rawlsian phrase, though Harsanyi predates Rawls here). If the agent is rational, their preferences over these social lotteries must satisfy the Independence axiom. Consequently, the social welfare function *must* take the expected utility form. For Harsanyi, the representation theorem is not just a mapping; it is a derivation of moral truth from the concept of rationality itself. To reject the linear form is, for Harsanyi, to be irrational.

  **Sen**, conversely, treats the vNM axioms as conditions on *individual choice under risk*, which do not automatically transfer to *social evaluation under uncertainty*. For Sen, the representation theorem reveals the *informational poverty* of the vNM framework. The fact that vNM utilities are unique only up to positive affine transformations means they carry no information about the intensity of preference across persons. When Harsanyi sums them, he is, in Sen's view, performing a mathematical operation on numbers that lack the requisite empirical or normative content. Sen does not merely think the axioms are 'convenient dressing'; he thinks they are *procrustean*. They force social choice into a welfarist mould that excludes non-utility information (such as rights, liberties, or the specific identity of the worst-off).

  Thus, the disagreement is substantive. It is a clash between a **monistic conception of rationality** (Harsanyi: one logic of choice applies to ethics and prudence) and a **pluralistic conception of evaluation** (Sen: social justice requires informational inputs that prudence does not).

  ### 2. The Diamond Objection and the Nature of Risk

  You mention the Diamond objection, and this is where the 'structural' feel of the impasse becomes most palpable. This is not simply a dispute about measurement; it is a dispute about the ontology of social risk.

  Harsanyi treats social uncertainty as isomorphic to individual risk. If society faces a lottery, we evaluate it by the sum of expected utilities.
  Diamond (and Sen following him) argues that a lottery over *who* suffers is morally distinct from a lottery over *outcomes* for a single person.

  Consider a society of two persons.
  *   **Option A:** Person 1 gets 1, Person 2 gets 0 (determined by a coin toss).
  *   **Option B:** Person 1 gets 0.5, Person 2 gets 0.5 (certainty).

  Under Harsanyi's aggregation, if the vNM utilities are linear, these might be equivalent in expected value. However, Diamond argues that Option B is preferable because it avoids ex-post inequality. Harsanyi's framework struggles to accommodate this without violating the Pareto principle or the Independence axiom.

  The impasse here is structural because **Harsanyi's theorem is a consistency result**. It says: *If* you accept these axioms, *then* you must accept utilitarianism. Sen's critique is an **adequacy result**. It says: *Even if* you accept these axioms for individuals, they are inadequate for capturing our considered judgements about fairness.

  When you spend four weeks on this, it feels like an impasse because one side is playing chess (internal consistency of the axioms) and the other is playing poker (assessing the value of the hand in the real world). Harsanyi wins on internal coherence; Sen wins on normative plausibility.

  ### 3. Is the Disagreement Verbal?

  You ask whether this is a verbal dispute. I would argue it is not. A verbal dispute implies that if we clarified our definitions, we would agree. Here, even with Weymark's reconstruction—which clarifies that Harsanyi's theorem yields a *weighted* sum and requires an extra ethical premise for equal weights—the disagreement persists.

  Why? Because the disagreement is about **what counts as a reason**.
  *   For the Harsanyi camp (including Broome), the fact that a principle can be derived from thin axioms of rationality is a virtue. It suggests objectivity.
  *   For the Sen camp, the fact that a principle ignores the distribution of well-being is a vice. It suggests blindness.

  This is not a confusion of language; it is a conflict of moral intuitions regarding the scope of rationality. Broome's defence, for instance, argues that 'good' is inherently additive. Sen argues that 'good' is inherently relational (good for whom?). No amount of semantic clarification will reconcile additive and relational conceptions of value.

  ### 4. Prospects for Progress

  You ask honestly what would count as progress. I fear I must deliver a sombre verdict.

  **Formal Progress:** Unlikely to resolve the debate. We have sufficient theorems. We have generalised utilitarianism (rank-dependent social welfare functions) which can accommodate some of Sen's concerns about equity while retaining a welfarist structure. We have axiomatic characterisations of the Gini coefficient. The mathematics is not the bottleneck.

  **Conceptual Progress:** This is where the only hope lies, but it requires stepping outside social choice theory proper and into moral philosophy. Progress would require one of the following:

  1.  **A Defence of the Independence Axiom in Ethics:** Harsanyi's entire edifice rests on the Independence axiom (that preferences between lotteries should not depend on common outcomes). Sen and Diamond reject this for social choice. A robust philosophical defence of why *social* ethics should satisfy Independence—without merely asserting 'rationality requires it'—would be progress. Broome attempts this, but many remain unconvinced.
  2.  **A Unified Theory of Comparability:** Sen's 'capabilities approach' was, in part, an attempt to move beyond the utility metric entirely. Progress would look like a formalisation of interpersonal comparability that does not rely on vNM utilities but is still rigorous enough for aggregation. This is notoriously difficult.
  3.  **Reframing the Question:** We might need to stop asking "Which social welfare function is correct?" and start asking "For what specific institutional purpose are we aggregating?" Harsanyi is perhaps better suited for cost-benefit analysis in policy (where efficiency is paramount); Sen is better suited for constitutional design (where rights and equity are paramount). Acknowledging that 'social choice' is not a singular problem but a family of problems might dissolve the impasse.

  ### 5. Conclusion

  Your hypothesis is right: the two sides are answering different questions under one name. Harsanyi is asking, "What does consistency require of a rational moral observer?" Sen is asking, "What information is required to make a just social judgement?"

  No new theorem will settle this because the dispute is not about what follows from the axioms, but about whether the axioms are the right starting point. The impasse is structural because it reflects a fundamental tension in liberal political theory between **procedural rationality** (Harsanyi) and **substantive fairness** (Sen).

  If I were to advise you on how to conclude your seminar: do not look for a victor. Instead, characterise the Harsanyi–Sen debate as the point where social choice theory touches bedrock moral philosophy. The formalism runs out, and one is left with irreconcilable intuitions about the nature of the good. That is not a failure of the theory; it is a map of its limits.

  In short, you have diagnosed the condition correctly. The patient is not ill; it is simply facing a dilemma that mathematics cannot cure.
