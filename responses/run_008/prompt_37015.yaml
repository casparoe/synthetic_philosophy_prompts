      *(Final check on the User's Hypothesis)*: The user suggests the disagreement is about "what a representation theorem is for". I should affirm this but expand it to "what counts as a normative constraint". Harsanyi thinks vNM axioms are normative for *morality*. Sen thinks they are descriptive/normative for *individual choice* but not necessarily for *social justice*.

      *(Progress)*: Be realistic. Social choice theory has moved to voting rules and mechanism design. Normative social choice (the Harsanyi-Sen bit) is somewhat stalled because it hits bedrock moral philosophy. Acknowledge this.

  9.  **Drafting the Content:** (Mental Outline)
