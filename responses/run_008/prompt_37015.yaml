          5.  Address the "Verbal vs. Substantive" question.
          6.  Discuss Prospects for Progress (what would actually move the needle?).

  5.  **Key Arguments to Include:**
      *   **Harsanyi:** The "Impartial Observer" argument. Moral preferences are preferences. If you are rational, you satisfy vNM. Therefore, social welfare satisfies vNM. The sum follows mathematically.
      *   **Sen:** The "Informational Base" argument. welfarism is too restrictive. We need to know *who* is well-off, not just the sum. The vNM scale doesn't allow comparing the *size* of gains across persons.
      *   **Diamond (1967):** The specific objection about ex-ante vs. ex-post equity. Harsanyi conflates social uncertainty with individual risk.
      *   **The "Representation" Point:** Harsanyi thinks the theorem *derives* utilitarianism. Sen thinks the theorem *presupposes* the comparability needed for utilitarianism.
      *   **Progress:** Not a new theorem (we have enough math). Progress requires clarifying the *normative status of the axioms*. Maybe moving to "generalised utilitarianism" (rank-dependent) or accepting pluralism.

