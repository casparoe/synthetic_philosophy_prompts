answer: |-
  Your intuition is spot-on. Your friend's summary is a classic case of "telephone" distortion: it gets the setup right but garbles the conclusion in a way that would make Dennett pull his hair out. Dennett is indeed famously sensitive to being labeled a "consciousness denier," and for good reason: that label contradicts the core of his project.

  Here is a piece-by-piece breakdown of what your friend got right, what is a simplification, and what is simply wrong, addressing your specific questions (a), (b), and (c).

  ### 1. The Setup: The Four Properties
  **Verdict: Accurate.**

  Your friend is correct here. In "Quining Qualia" (1988), Dennett identifies the "standard philosophical folklore" about qualia. He argues that when philosophers defend qualia, they implicitly commit to four properties:
  1.  **Ineffable:** You can't fully describe them to others.
  2.  **Intrinsic:** They are non-relational properties (they are what they are regardless of context).
  3.  **Private:** Interpersonal comparison is impossible.
  4.  **Directly or Immediately Apprehensible:** You can't be wrong about them; introspection is infallible.

  Dennett's strategy is to argue that these four properties are not just empirically false, but *conceptually incoherent* when taken together.

  ### 2. The Argument Structure (Your Point a)
  **Verdict: Simplification.**

  Your friend frames it as: *Qualia lack these features → Therefore qualia don't exist.*
  A philosopher of mind would refine this: *The concept of "qualia" is defined by the conjunction of these four features. If these features are mutually incompatible or incoherent, then the concept refers to nothing.*

  It is not merely that qualia fail a test (like failing to find a particle in a collider). It is that the *definition* of qualia relies on a specific kind of epistemic authority (infallible, private access) that Dennett argues is impossible. He isn't saying "there is brain stuff but it isn't qualia"; he is saying "the philosophical category of 'qualia' is a confusion."

  ### 3. The Coffee Cases and Introspection (Your Point b)
  **Verdict: Exaggerated.**

  Your friend claims the coffee cases show "we have no access to our own minds" and reports are "confabulations."
  Dennett's actual point is more subtle. The coffee taster cases (where a taster's preference flips over years, and they can't tell if the coffee changed or their palate changed) are designed to attack the fourth property: **Direct Apprehensibility.**

  Dennett argues that there is no "final court of appeal" in phenomenology. We often treat our introspective reports as the gold standard of truth (e.g., "It *seems* red to me, so it *is* red-experience"). Dennett shows that introspective judgments are theory-laden, revisable, and subject to error just like perceptual judgments.

  *   **What's wrong with your friend's take:** Dennett does not say we have *no* access. He advocates for **heterophenomenology**: we treat the subject's speech acts as data. The data is real (the person *said* it tasted bitter), but the *authority* of that data regarding the internal state is not privileged.
  *   **Confabulation:** Dennett does use the word "confabulation," but usually to describe the *narrative* we construct to explain our behavior, not to say the entire mental life is fake. We construct a "user illusion" of a unified self, but the underlying processes are real.

  ### 4. The Leap to "Consciousness Doesn't Exist" (Your Point c)
  **Verdict: Wrong.**

  **This is the critical error.** Your friend claims Dennett argues: *No qualia → No consciousness.*
  Dennett argues: *No qualia → Consciousness is not what you think it is.*

  Dennett is a **realist about consciousness**. He believes consciousness is a real, natural phenomenon that evolved in brains. However, he is an **eliminativist about qualia**.
  *   **Qualia:** The magical, ineffable, intrinsic "ghostly glow" of experience. (Dennett says: This doesn't exist.)
  *   **Consciousness:** The functional, informational, discriminative capacity of the brain to control behavior and report on states. (Dennett says: This definitely exists.)

  When Dennett says "consciousness is an illusion," he means the *Cartesian Theater* (the idea that there is a little man inside your head watching a screen of your experiences) is an illusion. He does not mean that being awake, reporting pain, or seeing red are illusions.

  If you tell a Dennettian "Consciousness doesn't exist," they will correct you: "Consciousness exists, but it doesn't involve qualia." Your friend has conflated **Qualia Eliminativism** with **Consciousness Eliminativism**. The latter is a view held by very few (perhaps Keith Frankish with "illusionism," though even he is nuanced); Dennett is not in that camp in the way your friend describes.

  ### 5. Historical Context and Title
  **Verdict: Mixed/Inaccurate.**

  *   **The Title:** "Quining Qualia" is a pun on the name of the logician **W.V.O. Quine**, not an insecticide brand. Quine was famous for ontological questions ("On What There Is"). To "quine" something means to deny its existence in your ontology (in the style of Quine). Your friend's insecticide story is a common urban legend in philosophy circles, but the primary reference is the philosopher.
  *   **The History:** Your friend claims this view was "pretty much accepted until people got sentimental about zombies a decade later." This is historically inaccurate. Dennett's view was *always* controversial. While functionalism was dominant in the 80s, qualia realism (Nagel, Jackson) was already pushing back hard before Chalmers popularized "Philosophical Zombies" in the mid-90s. Chalmers didn't kill a consensus; he crystallized an existing opposition.

  ### Summary for Your Group

  If you want to bring this back to the group, here is the corrected "Philosopher's Summary":

  1.  **Dennett is not a Consciousness Denier:** He believes consciousness is a real biological function. He denies *qualia* (the magical intrinsic properties), not *consciousness* (the functional capacity).
  2.  **The Argument is Conceptual, not just Empirical:** He argues the standard definition of qualia is incoherent, not just that we haven't found them yet.
  3.  **Introspection is Fallible, not Non-Existent:** We can report on our minds, but our reports are not infallible data; they are behaviors to be explained, not explanations themselves.
  4.  **The "Illusion":** The illusion is not that we are conscious; the illusion is that our consciousness is made of "qualia" in a Cartesian Theater.

  Your friend got the "setup" (the four properties) right, which is the hardest part to memorize, but they fell into the most common trap regarding Dennett: assuming that if you remove the "magic" from consciousness, you've removed consciousness itself. Dennett's whole career is an attempt to show how you can have consciousness *without* the magic.
