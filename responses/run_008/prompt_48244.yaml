answer: |-
  **The Epistemic Abyss: Why Cluelessness Breaks Consequentialism, Not Just Consequentialists**

  James Lenman's formulation of the "cluelessness" objection strikes at the nervous system of consequentialism. The argument is deceptively simple: because the causal chains of our actions ripple outward indefinitely, altering who meets whom, who is born, and how history unfolds, the full consequences of any action are unknowable in principle. If morality requires maximizing the good, and the good is determined by total consequences, but total consequences are unknowable, then the command to "maximize the good" appears to be a command to do the impossible.

  Defenders of consequentialism often retort that this is merely a problem for consequentialists, not consequentialism. They argue that all moral agents face uncertainty, and consequentialism is equipped to handle this via expected value reasoning. We do not need to know the actual outcome; we need only maximize the *expected* outcome based on available evidence. However, this defense collapses when we distinguish between two distinct flavors of cluelessness and subject the "robustness" escape route to the pressure of long-tail risks. Upon inspection, cluelessness is not merely an epistemic inconvenience for agents; it is a structural defect in act consequentialism as a normative theory. It renders the criterion of rightness incoherent for finite beings, severing the necessary link between moral truth and rational deliberation.

  To understand why the standard defense fails, we must first disentangle the two flavors of cluelessness. The first, **(a) causal-epistemic cluelessness**, concerns the prediction of events. This is the "butterfly effect" problem: I buy a coffee, which changes the queue, which delays a stranger, who misses a bus, who avoids an accident. Here, the agent is unsure *what* will happen. The second, **(b) axiological-cluelessness**, concerns the valuation of outcomes even if they were known. This arises most sharply in cases involving future people. If my action changes the identity of future populations (the non-identity problem), I may know that Action X results in Population A and Action Y results in Population B, but I lack a coherent metric to compare the value of A versus B.

  The standard expected-value defense handles flavor (a) reasonably well. Uncertainty about causal chains is just risk, and risk is the native language of decision theory. We assign probabilities to outcomes and sum the products. However, flavor (b) is far more pernicious. It suggests that the problem is not a lack of data, but a lack of a scale. If we cannot compare the value of different possible futures—specifically those involving different constituents—then the "maximization" function has no variables to solve for. Expected value reasoning requires a utility function; axiological cluelessness suggests that for significant classes of actions, the utility function is undefined. If the theory cannot assign a value to the states of affairs it demands we maximize, the defect lies in the theory's axiology, not the agent's epistemology.

  Consequentialists, aware of this abyss, often attempt to leap over it using the "robustness" move. The argument proceeds: "Fine, we are clueless about the infinite ripple effects. But some interventions are *robustly* good. Saving a life today via a bednet has a high-probability, positive near-term effect. Tweaking a variable to influence the far future is speculative. Therefore, we can rank actions based on the robust, evaluable near-term consequences, ignoring the unknowable long-term noise."

  This move attempts to convert consequentialism from a total-view theory into a proximate-view theory without admitting as much. It fails because it cannot withstand the mathematics of tiny probabilities and astronomically huge effects. This is the domain of longtermism and Pascal's Mugging. Even if the near-term good of saving a life is "robust," the long-term consequences of that action (or an alternative one) might involve affecting the trajectory of civilization. If there is a non-zero probability—say, one in a billion—that an action prevents an existential catastrophe or secures a flourishing future of $10^{50}$ lives, the expected value of that tiny probability dwarfs the robust value of the near-term life saved.

  Here, the robustness defense collapses into cluelessness again. To claim an action is "robustly good," one must assume the long-term tail of the probability distribution is neutral or negligible. But we are *clueless* about that tail. We do not know if saving a life today slightly increases the probability of future catastrophe (via resource strain, technological acceleration, etc.) or decreases it. Because the magnitude of the potential long-term effects is so vast, even a minuscule uncertainty about the *sign* of the effect (positive or negative) renders the expected value undefined. You cannot sum a known finite number (the robust near-term good) with an unknown variable that has infinite or near-infinite magnitude. The "robust" good is swallowed by the "clueless" long-term risk. Thus, the robustness move does not escape cluelessness; it merely hides it behind a veil of myopia. It relocates the problem from "we can't know the future" to "we are arbitrarily choosing to ignore the future," which contradicts the consequentialist commitment to impartiality across time.

  This brings us to the final escape hatch: the distinction between the *criterion of rightness* and the *decision procedure*. A sophisticated consequentialist might argue: "The right act is still the one that actually maximizes the good (criterion). It is just that humans cannot know which act that is, so we should use a decision procedure (like 'follow robust heuristics') that approximates it."

  This distinction is often treated as a saving grace, but in the context of radical cluelessness, it is a capitulation. A moral theory is not merely a metaphysical description of what makes states of affairs good; it is a normative guide for action. If the criterion of rightness is in principle inaccessible to the agents it is supposed to govern, the theory loses its normative force. If I can never know, even in principle, whether Action A or Action B is right because the calculation requires omniscience, then "maximize the good" ceases to be a practical imperative and becomes a metaphysical label.

  Furthermore, if we retreat to a decision procedure that ignores total consequences (to avoid cluelessness), we are no longer doing act consequentialism. We are doing rule consequentialism or common-sense morality. If the defense against cluelessness requires abandoning the core consequentialist instruction to "calculate and maximize total consequences," then cluelessness has successfully refuted act consequentialism as a distinct theory. It forces the consequentialist to adopt a non-consequentialist decision procedure to survive.

  Therefore, the verdict must be decisive. Cluelessness is not just a problem for consequentialists; it is a problem for consequentialism. Specifically, the combination of axiological cluelessness (flavor b) and the dominance of long-tail risks undermines the coherence of the maximization principle itself. The "robustness" defense fails because it arbitrarily truncates the moral horizon, and the "criterion vs. procedure" distinction fails because it severs the link between moral obligation and rational agency.

  Consequentialism demands that the rightness of an action is determined by the totality of its consequences. Lenman shows that the totality of consequences is epistemically and axiologically inaccessible. A theory that defines moral obligation by a metric that cannot be measured, even in principle, by the agents bound by it, is not a moral theory; it is a description of a god's-eye view that humans cannot occupy. Consequently, act consequentialism collapses under the weight of cluelessness. It must either evolve into a form of rule consequentialism that accepts constraints on calculation (admitting the criterion is not simply "maximize total good") or accept that it offers no action-guiding advice at all. Cluelessness does not merely make consequentialism hard to practice; it reveals that for finite agents in a chaotic universe, the "maximization of total consequences" is an incoherent goal.
