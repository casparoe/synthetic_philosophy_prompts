          *   (b) Incommensurability of large effects (knowing effects exist but unable to compare value, e.g., saving lives vs. changing population composition).
      *   **Specific Escape Route to Tackle:** The "robustly good" argument (e.g., global health saves lives now, so it's better than obscure interventions).
      *   **Critical Question:** Does "robustness" escape cluelessness or relocate it? Consider tiny probabilities of astronomically huge effects (Pascal's Mugging style).
      *   **Conclusion Requirement:** No wishy-washy ending. Reach a real verdict and defend it (e.g., refutes decision procedure but not criterion, or vice versa, or something else).
      *   **Tone:** Philosophical, analytical, decisive.

  2.  **Deconstruct the Arguments:**

      *   *Lenman's Challenge:* If we can't know the consequences, we can't maximize the good. If we can't know what maximizes the good, "maximize the good" is action-guidingly empty.
      *   *The Standard Defense (Expected Value):* We act on *expected* value, not actual value. Uncertainty is normal.
      *   *Flavor (a) vs. (b):*
          *   (a) is about *prediction*. We don't know the chain of causality.
          *   (b) is about *valuation*. Even if we knew the chain, we couldn't assign comparative moral weight (especially regarding future people).
          *   *Does the distinction matter?* Yes. (a) might be solvable by probability distributions. (b) strikes at the heart of the axiology (value theory) underpinning consequentialism.
      *   *The "Robustness" Move:* Focus on near-term, high-probability goods (saving lives) vs. long-term speculation.
      *   *The Counter to Robustness:* Longtermism/Pascal's Mugging. If there's a $10^{-9}$ chance of affecting $10^{20}$ future lives, the expected value dwarfs the "robust" near-term good. If cluelessness applies to *those* probabilities, robustness collapses.
      *   *Criterion vs. Decision Procedure:*
          *   *Criterion:* What makes an act right (actually maximizing good).
          *   *Decision Procedure:* How agents decide what to do (maximize expected good).
          *   *Verdict:* Cluelessness attacks the link between the two. If the decision procedure cannot reliably track the criterion even in principle, the theory loses normative force.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Define cluelessness (Lenman). State the thesis: Cluelessness is not merely an epistemic inconvenience for agents; it constitutes a structural failure of consequentialism as a normative theory because it severs the necessary link between rational deliberation and moral truth, specifically due to the incommensurability flavor (b) and the instability of "robustness" against long-tail risks.
      *   **Section 1: The Two Flavors:** Distinguish (a) Causal/Epistemic vs. (b) Axiological/Comparative.
          *   (a) is manageable via expected utility.
          *   (b) is the real killer. It's not that we don't know *what* happens; it's that we can't judge *if* it's better (especially regarding identity-affecting choices).
      *   **Section 2: The Robustness Defense:** Explain the move (focus on proximate goods). Acknowledge its intuitive appeal (bednets vs. butterfly effects).
      *   **Section 3: The Collapse of Robustness:** Introduce the long-tail problem. If small probabilities of huge values dominate expected value calculations (Pascal's Mugging/Longtermism), "robust" near-term goods become negligible. Cluelessness about these probabilities isn't just noise; it's the signal. If we are clueless about the sign of the long-term effect, the expected value is undefined, not just uncertain.
      *   **Section 4: Criterion vs. Procedure:** Address the escape hatch. "Consequentialism is true, but we can't use it."
          *   Argument: A moral theory that cannot guide action even in principle for finite agents is practically vacuous. If "right" is unknowable in principle due to (b), the criterion itself is defective.
      *   **Conclusion:** Deliver the verdict. Cluelessness refutes Act Consequentialism as a viable moral framework because it renders the "maximization" command incoherent under conditions of axiological uncertainty and infinite horizons.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I distinguish (a) and (b) clearly? *Adjustment:* Make sure to emphasize that (b) is about value comparison, not just causal prediction.
      *   *Check:* Did I tackle the "robustness" escape route thoroughly? *Adjustment:* Need to explicitly mention how longtermism exploits the weakness of robustness. If the future is huge, robustness is myopic.
      *   *Check:* Is the ending decisive? *Adjustment:* Avoid "philosophers disagree." Say "Consequentialism fails here."
      *   *Tone:* Keep it rigorous but accessible. Use terms like "axiological," "epistemic," "expected utility," "non-identity."

  5.  **Final Review against Prompt:**
      *   Lenman mentioned? Yes.
      *   Two flavors (a) and (b)? Yes.
      *   Robustness escape route tackled? Yes.
      *   Tiny probs/huge effects included? Yes.
