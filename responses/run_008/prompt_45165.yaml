answer: |-
  Subject: Draft materials for x-phi final exam question on Knobe effect variants

  Hi there,

  Here is the draft material you requested for the final exam essay question, including the prompt, a model answer, and the grading scheme, all formatted as continuous prose without any headings or lists as you specified.

  Please use the following text for the exam question. You are presented with a variant of the classic Chairman case. A low-level manager at a firm owned by a notorious polluter learns that installing scrubbers would marginally hurt quarterly profits but would meaningfully clean up the town's air. The firm's owner has an explicit standing rule never to spend a dime on emissions controls, and everyone knows he will be furious if this is violated. The manager installs the scrubbers anyway, saying I do not care about the owner's rule, I just want the plant to pass the town's inspection. Subjects are asked whether the manager intentionally helped the environment. In your essay, operationalize the two dominant explanations for the Knobe Effect, specifically the Moral Valence view and the Normative Expectation view. Explain what each theory predicts for this specific scrubber case given that helping the environment is morally good but violates the local corporate norm. Finally, analyze why the empirical data might show a messy split rather than a consensus, discussing whether this case successfully decouples moral valence from normative conformity.

  Below is a model answer that demonstrates the expected depth and length. The Knobe Effect originally demonstrated an asymmetry where people attribute intentionality to bad side effects but not good ones, suggesting moral judgment influences psychological attribution. Two main theories explain this. The Moral Valence view argues that the moral goodness or badness of an outcome directly biases whether we see an action as intentional. The Normative Expectation view argues that intentionality is attributed when an outcome deviates from what is expected or normal within a relevant context, regardless of moral value. In the standard Chairman case, harming the environment is both morally bad and normatively expected under profit-maximization, while helping is morally good and normatively unexpected, confounding the variables. The scrubber case attempts to pull these apart. Here, helping the environment is morally good, which the Moral Valence view suggests should lower intentionality attributions, similar to the standard help case. However, the action violates the explicit corporate norm set by the owner. The Normative Expectation view suggests that because the outcome is abnormal relative to the operative local norm, subjects should attribute intentionality, similar to the standard harm case. This creates a conflict in predictions. If subjects follow moral valence, they should say the manager did not intentionally help. If they follow normative deviation, they should say the manager did intentionally help. The messy split in the data suggests that neither theory fully captures the cognitive process in isolation. It is likely that subjects are uncertain about which norm is operative, the owner's profit rule or the town's inspection requirement. If the town's regulation is seen as the primary norm, the action is normative, lowering intentionality. If the owner's rule is primary, the action is deviant, raising intentionality. Furthermore, the manager's stated motive complicates matters, as intentionality often requires some level of endorsement rather than mere foreseeability. Therefore, this case does not cleanly favor one theory but rather exposes the complexity of how competing norms interact with moral judgment. A definitive conclusion is unavailable because the case underdetermines which normative framework subjects prioritize, indicating that both moral valence and contextual norms likely play interacting roles rather than exclusive ones.

  Here is the marking scheme and grading guidance. The essay is worth twenty marks total, divided across five required elements that must be addressed in continuous prose. First, the student must accurately define the Knobe Effect and the original harm-help asymmetry, which is worth four marks. Second, they must clearly operationalize the Moral Valence explanation, detailing how moral goodness or badness drives attribution, worth four marks. Third, they must clearly operationalize the Normative Expectation explanation, detailing how deviation from baseline expectations drives attribution, worth four marks. Fourth, they must apply both theories to the scrubber case specifically, identifying the conflict between moral goodness and corporate norm violation, worth four marks. Fifth, they must analyze the messy data split, acknowledging that the case underdetermines the outcome due to competing norms or motivational ambiguity, worth four marks. To achieve an A grade range, the student must not only hit these five points but also demonstrate nuanced critical engagement with the underdetermination, explicitly discussing why the data might be split rather than forcing a false consensus around one theory. A B grade answer will successfully identify and apply both theories and predict the conflict but will likely treat the theories as more rigid or deterministic than the data supports, perhaps arguing confidently that one theory should win without acknowledging the ambiguity of which norm is operative. An A answer embraces the messiness of the empirical result as evidence of theoretical complexity, whereas a B answer treats the messiness as a problem to be solved by picking a side. Ensure that marks are deducted if the student claims the data cleanly supports one view without justification, as the model answer emphasizes the ambiguity. Please apply this scheme consistently across all submissions to maintain grading reliability.

  I hope this fits your needs for the seminar final.

  Best regards
