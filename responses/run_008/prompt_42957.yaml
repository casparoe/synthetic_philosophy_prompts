      *   *Better:* Make the principle *his own*. He *endorses* impartiality as his professional mandate. The disposition (empathy) conflicts with his *own* endorsed principle.
      *   *So:* Epistemic = Follows Empathy (Disposition). Procedural = Follows Endorsed Principle (Revised Disposition).
      *   *This ensures he doesn't disavow the empathy (it's a feeling), but the procedure prioritises the principle.*
      *   *Wait, if he endorses the principle now, why doesn't Epistemic Idealisation follow it?* Because Epistemic Idealisation says "specify goal by reference to what... idealised version... would want".
      *   *Epistemic Idealisation of *Him*:* He has the disposition to feel empathy. He acts on it.
      *   *Procedural Idealisation of *Him*:* He reflects on the conflict between empathy and principle. He resolves it in favour of principle.
      *   *The divergence is: Does idealisation freeze the conflict (Epistemic) or resolve it (Procedural)?*
      *   *Yes, this is the key.* Epistemic idealisation gives him the truth but leaves the *conflict* intact. Procedural idealisation gives him the truth and the *resolution* of the conflict.
      *   *Perfect.*

  5.  **Final Polish:** Check constraints one last time.
      *   Single person/decision? Yes (Marcus, charity fund).
      *   No false beliefs? Yes (knows stats).
      *   No disavowal? Yes (empathy is a feeling, not a belief he rejects, though he might wish it were different, he stands by the *action* it prompts as 'human'). *Correction:* He must stand by the disposition *at the object level*. "I prefer to save the child I can see." He doesn't say "I'm wrong."
      *   No sci-fi? Yes (reflection).
      *   Sympathetic? Yes.
      *   Prose/British English? Yes.

      *   *Wait, one constraint:* "a case that meets the letter of the brief by stipulating its verdicts rather than generating them fails."
      *   *I must ensure the verdicts *fall out* of the procedures.*
      *   *Epistemic:* Input = Marcus + Facts. Marcus has a strong heuristic "Help the visible". Output = Help visible. (Because the procedure doesn't alter the heuristic).
      *   *Procedural:* Input = Marcus + Facts + Reflection. Reflection exposes the heuristic as arbitrary relative to his goal "Maximise Good". Output = Help many. (Because the procedure alters the heuristic).
      *   *I need to be careful not to just assert this.* I need to explain *why* the heuristic survives facts but not reflection.
      *   *Reason:* Facts don't change emotional salience. Reflection on consistency does.

      *   *Okay, ready to write.*
