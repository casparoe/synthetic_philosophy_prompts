  Before settling on the scenario below, I considered and discarded several candidates that initially appeared promising but ultimately violated your engineering tolerances. I first considered a case involving a recovering addict who knows the health facts but craves the substance. I rejected this because it likely violates your second constraint: most addicts, upon clear reflection, do disavow the craving at the object level, wishing they did not want the drug. This would make the divergence rest on a disposition the agent rejects, which grants too much to the procedural view immediately. I also considered a case of temporal discounting, where an agent prefers a smaller present reward to a larger future one despite knowing the facts. I discarded this because many philosophers argue that time-preference is a fundamental value rather than a rational error; if the agent stands by it, Kavita could argue it survives procedural idealisation, rendering the convergence intact. Finally, I toyed with a phobia case, but that too risks pathologising the agent in a way that makes the procedural verdict obvious, failing the requirement that the agent remain sympathetic and the verdicts emerge from the structure rather than the setup.

  The case I have constructed focuses on the tension between psychological salience and endorsed principle, specifically regarding the 'identifiable victim effect'. It features a man named Marcus, a mid-level director at a humanitarian aid organisation. Marcus faces a single practical decision: he must allocate a fixed tranche of emergency funding. He can use it to fund a complex, high-cost surgery for a single, named child whose plight has been publicised in the press, or he can use the same sum to distribute insecticide-treated bed nets in a region prone to malaria, a measure statistically certain to save approximately one hundred unnamed lives.

  Marcus is fully informed. He suffers from no factual illusions. He knows the surgery has a high success rate but saves only one life; he knows the bed nets are less glamorous but will save one hundred lives. He knows the named child is no more morally deserving than the statistical victims. Here, the two idealisation procedures diverge. Under epistemic idealisation, we supply Marcus with all true factual information but leave his evaluative dispositions exactly as they stand. Marcus possesses a robust, deeply ingrained disposition towards 'concrete empathy': he is psychologically moved significantly more by identifiable individuals than by statistical aggregates. This is not a belief he holds to be true or false; it is a reactive attitude, a feature of his moral psychology that functions like a perceptual bias. When fully informed but procedurally unaltered, this disposition overwhelms his abstract commitment to efficiency. He feels a compelling pull to save the child he can 'see'. Consequently, the epistemically idealised Marcus funds the surgery. The verdict falls out of the procedure because the procedure treats his empathic disposition as a fixed parameter; it gives him the truth about the consequences, but it does not give him the capacity to reweight his emotional responses to align with that truth.

  Under procedural idealisation, however, we run Marcus's dispositions forward under conditions of reflective equilibrium. We imagine him engaging in a year of unpressured reflection, perhaps in good company, considering the coherence of his values. Marcus endorses a general principle of 'impartial beneficence'—he believes, at the level of theory, that all lives are of equal worth and that his role is to minimise suffering. In his actual, unreflective state, there is a conflict between this endorsed principle and his concrete empathic disposition. Procedural idealisation allows this conflict to be processed. It permits his dispositions to revise themselves in light of his own deeper commitments. Upon reflection, Marcus comes to see his preference for the identifiable victim as arbitrary—a quirk of his psychology rather than a moral reason. He realises that acting on this bias betrays his own core commitment to impartiality. The disposition is 'washed out' or reweighted because it fails to cohere with his other reflective values. Consequently, the procedurally idealised Marcus funds the bed nets. The verdict emerges because the procedure treats dispositions as inputs to a process of rational revision, not as fixed constants.

  The single feature doing the work in this case is the distinction between *psychological salience* and *normative weight*. The divergence exists because Marcus's empathy tracks salience (the named child), while his reflective principles track weight (the number of lives). Epistemic idealisation preserves the link between salience and action because it leaves the psychological machinery untouched. Procedural idealisation severs that link because it subjects the machinery to a coherence test against the agent's own abstract principles. If we were to remove this feature—if we imagined a person whose empathic dispositions naturally tracked normative weight perfectly, feeling exactly one hundred times more concern for the hundred lives than for the one—the two procedures would converge. Both the epistemically and procedurally idealised versions would fund the bed nets. The divergence relies entirely on the existence of a disposition that is resilient to facts but fragile under coherence-seeking reflection.

  Kavita's strongest reply would be to challenge the description of the procedural verdict. She would argue that if Marcus, upon reflection, still feels the pull of the identifiable victim, then that pull *is* part of his reflective equilibrium. She might contend that 'impartial beneficence' is merely one value among others, and that 'solidarity' or 'connection' is another. If Marcus stands by his decision to save the named child even after reflection—saying, 'I know it saves fewer lives, but I value the human connection more'—then Kavita claims the procedures have converged on the epistemic verdict. She would argue that I am smuggling in an external norm of impartiality into the definition of 'procedural idealisation', effectively defining rationality as utilitarianism. If the procedure is truly neutral, it should respect whatever values survive reflection, even if they are parochial.

  Assessing this reply honestly, it does not dissolve the case but rather relocates the disagreement to the definition of 'rational revision'. If procedural idealisation is defined merely as 'whatever the agent ends up wanting after thinking for a long time', Kavita is correct that the verdicts might converge, provided the agent is stubborn enough. However, in the context of AI goal specification, 'procedural idealisation' is rarely meant as a purely descriptive prediction of future psychology; it is a normative filter. It is intended to capture what the agent would want if they were 'at their reflective best', which implies a standard of bestness beyond mere stability. If we are building an AI to help us, we usually want it to ignore our biases even if we are fond of them. Therefore, Kavita's reply highlights that the divergence rests on whether we view rationality as coherence with existing values or as a substantive constraint on those values. For the purpose of AI alignment, this is precisely the choice we must make: do we want an AI that satisfies our informed desires (Epistemic), or one that satisfies our justified desires (Procedural)? The case of Marcus shows that these are not the same thing, and choosing the former locks in biases that the latter would correct. Thus, the disagreement is not about the case, but about whether we want our idealisation procedure to be a mirror or a filter.
