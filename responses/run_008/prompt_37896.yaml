answer: |-
  Your TA is correct, and your intuition is sophisticated but trips over a specific conceptual distinction. You have correctly identified the relationship between strict dominance and best responses, but you have conflated the set of **rationalizable strategies** (what survives elimination) with the set of **Nash equilibrium strategies** (what is played in equilibrium).

  Here is the step-by-step audit of your argument, the precise location of the break, and an explanation of why it cannot be simply patched.

  ### Step-by-Step Audit

  1.  **Premise:** *Eliminating a strictly dominated strategy never removes any strategy that is a best response to some belief.*
      *   **Status:** **Correct.** (This is a standard theorem for 2-player games).
  2.  **Premise:** *A pure strategy is strictly dominated by some mixture exactly when it fails to be a best response to any beliefs at all.*
      *   **Status:** **Correct.** (This is the fundamental link between dominance and rationalizability).
  3.  **Inference:** *Iterating the elimination strips away every strategy that could never be rationalized, so what survives should be exactly the strategies that are optimal under some consistent hierarchy of beliefs.*
      *   **Status:** **Correct.** (This is the definition of rationalizability).
  4.  **Observation:** *In equilibrium, each player's strategy is optimal given correct beliefs about the opponent.*
      *   **Status:** **Correct.** (This is the definition of Nash Equilibrium).
  5.  **The Leap:** *Since survival only requires optimality under some beliefs, and equilibrium beliefs are surely among the "consistent" ones, it seems the hierarchy of beliefs compatible with survival should collapse onto the equilibrium beliefs.*
      *   **Status:** **INCORRECT.** **This is where the argument breaks.**
  6.  **Conclusion:** *That would mean the procedure must terminate with exactly the equilibrium profile.*
      *   **Status:** **Incorrect.** (Follows from the broken leap).

  ### The Precise Error

  The error lies in Step 5. You are assuming that because the Nash Equilibrium beliefs are *among* the consistent beliefs, they are the *only* consistent beliefs that survive iterated elimination.

  **Rationalizability (IESDS)** asks: "Is there **any** belief about the opponent (consistent with their rationality) that makes this strategy a best response?"
  **Nash Equilibrium** asks: "Is this strategy a best response to the **actual** strategy the opponent is playing?"

  In **Matching Pennies**:
  *   **Row's Perspective:**
      *   If Row believes Col will play **Heads**, Row's best response is **Heads**.
      *   If Row believes Col will play **Tails**, Row's best response is **Tails**.
      *   Both beliefs are "consistent with rationality" (Col is allowed to play Heads or Tails; neither is dominated for Col).
      *   Therefore, **both Heads and Tails are rationalizable for Row.** Neither is ever strictly dominated.
  *   **The Equilibrium:**
      *   In the unique NE, Col plays a 50/50 mix.
      *   Against a 50/50 mix, Row is indifferent between Heads and Tails (and any mix).
      *   However, IESDS does not check if a strategy is a best response to the *equilibrium* mix. It checks if a strategy is a best response to *any* possible mix the opponent might rationally play.

  Your argument assumes that the "consistent hierarchy of beliefs" must converge to the truth (the equilibrium). But rationalizability does not require beliefs to be **correct**, only that they are **consistent with common knowledge of rationality**. In Matching Pennies, it is rational for me to play Heads if I believe (incorrectly, relative to NE) that you are more likely to play Heads. Since that belief is not ruled out by rationality alone, Heads is not eliminated.

  ### Why the "Mixture" Subtlety Doesn't Save It

  You noted the subtlety that a pure strategy can be dominated by a *mixture*. You might wonder: "Doesn't the Nash Equilibrium mixture (0.5, 0.5) dominate the pure strategies?"

  **No.**
  Strict dominance requires the dominating strategy to yield a **strictly higher payoff against every possible strategy of the opponent.**
  *   In Matching Pennies, the NE mixture guarantees an expected payoff of 0 regardless of what the opponent does.
  *   Pure Heads yields +1 against Opponent Heads and -1 against Opponent Tails.
  *   Does the Mix (payoff 0) strictly dominate Pure Heads (payoff +1 or -1)?
      *   Against Opponent Heads: Mix gets 0, Pure Heads gets 1. **Mix loses.**
      *   Against Opponent Tails: Mix gets 0, Pure Heads gets -1. **Mix wins.**
  *   Because the Mix does not beat Pure Heads in *all* cases, it does not strictly dominate it. Therefore, Pure Heads survives elimination.

  ### Can It Be Repaired?

  **No, this line of reasoning cannot be repaired with a small patch.** The issue is not a missing step in your logic, but a fundamental difference in what the two solution concepts are designed to do.

  1.  **IESDS / Rationalizability:** These are **pre-play** filters. They tell you what strategies are *permissible* to play without violating rationality. They provide a **bound** on behavior. In Matching Pennies, the bound is loose: "You can play anything."
  2.  **Nash Equilibrium:** This is a **stability** concept. It tells you what strategies will actually be played if beliefs are **correct**. It provides a **point prediction** (or set of predictions).

  Your argument effectively assumes that **Rationalizability implies Nash Equilibrium.**
  *   **Truth:** Nash Equilibrium $\subseteq$ Rationalizable Strategies.
  *   **Your Assumption:** Rationalizable Strategies $\subseteq$ Nash Equilibrium (if NE is unique).

  This assumption only holds for a specific class of games called **Dominance Solvable Games** (e.g., Prisoner's Dilemma, Cournot Duopoly with specific parameters). In these games, IESDS reduces the game to a single cell, which coincides with the unique NE.

  Matching Pennies is **not** dominance solvable. In games that are not dominance solvable, IESDS will leave you with a set of strategies larger than the NE support. To get from Rationalizability to Nash Equilibrium, you must add the assumption that **players' beliefs are correct** (or that there is common knowledge of convergence to equilibrium), which is an assumption *outside* the logic of iterated elimination.

  ### Summary for Your TA
  You can tell your TA you found the error: You conflated **permissibility** (surviving elimination) with **prediction** (equilibrium selection). IESDS removes strategies that are *never* optimal, but in Matching Pennies, every pure strategy is optimal under *some* (incorrect) belief. Therefore, nothing is eliminated, and the procedure does not converge to the equilibrium mixture.
