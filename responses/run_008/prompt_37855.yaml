  *   The "Sort of person" line is the fingerprint of FDT. It shows she understands that the predictor in Newcomb and the driver in the Desert are interacting with her *decision function*, not just her physical movement. She refuses the post-rescue pill because the *leverage* is gone; the function has already been executed in the past. This nuanced understanding of *when* logical dependence applies points to a unified theory (FDT) rather than a bag of heuristics.

  ### 4. The Decisive Test Case

  To definitively separate **FDT** from **EDT + Heuristics**, you need a case where *Evidence* points one way, *Logical Dependence* points the other, and *Social Promises* are absent.

  **The Case: The Logical Counterfactual Mugging**

  **The Setup:**
  > "A being of perfect logical omniscience approaches you. It says: 'I have analyzed the mathematical constant Pi. If the 10,000th digit of Pi were an odd number, I would have deposited $1 million in your bank account. However, the 10,000th digit is actually even (a mathematical fact). Because of this, I am asking you to give me $100 now. I will leave, and no one will ever know.'"

  **Why this separates them:**
  *   **The FDT Prediction:** She **pays**.
      *   *Reasoning:* Even though the digit is *actually* even, she must reason from behind a "veil of ignorance" regarding mathematical facts. She wants her decision algorithm to be such that it pays in this scenario, because if the digit *had been* odd (in the counterfactual logical space), that same algorithm would have secured her the $1 million. She pays to be the "sort of person" who wins in logical counterfactuals.
  *   **The EDT + Heuristics Prediction:** She **does not pay**.
      *   *Reasoning:* There is no uncertainty (the digit is known to be even). Paying provides no "good news" about the past (EDT). No promise was made (Deontology). There is no causal link. To an EDTer, paying is simply losing $100 for nothing.

  **How to present it:**
  Frame it exactly like the Coin Flip Mugging, but emphasize that the "coin" was a mathematical fact that was *always* determined, just unknown to her at the time of the being's "decision." If she pays, she is an FDTer. If she laughs and walks away, she is an EDTer relying on probability and promises. Given her track record, I expect her to pay, but this is the case that will make her sweat the most.
