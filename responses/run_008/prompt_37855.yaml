  Based on the track record you've described, your roommate is displaying the behavioral markers of an intuitive **Functional Decision Theorist (FDT)**, or at the very least, someone operating on a sophisticated **Evidential Decision Theory (EDT)** framework heavily modified by agent-type reasoning. She has firmly rejected Causal Decision Theory (CDT), as evidenced by her one-boxing and her willingness to pay the hitchhiker.

  Here is the breakdown of her likely responses, the theoretical candidates, and the decisive test case.

  ### 1. Predictions for the New Cases

  **Case 1: The Smoking Lesion**
  *   **Prediction:** She will **light the cigarette.**
  *   **Confidence:** 70%
  *   **Reasoning:** This is the classic divider between EDT and FDT/CDT. An EDT agent sees smoking as *evidence* of the gene and refrains to avoid the "bad news" of likely disease. An FDT agent (and a CDT agent) recognizes that the decision to smoke cannot *cause* the gene, nor is it logically dependent on it in the way a predictor's simulation is. Since she already rejected CDT in Newcomb's Problem, her one-boxing there was likely due to recognizing the *logical dependence* between her choice and the predictor's simulation. In the Lesion case, there is no simulation, only a common cause. If she truly grasps the "sort of person" logic (which implies reasoning about the decision *function* rather than just evidence), she should realize her choice is free of the gene's causality and take the pleasure of smoking. However, I leave 30% uncertainty because many intuitive one-boxers conflate "correlation" with "influence" and will still fear the news.

  **Case 2: The Counterfactual Mugging**
  *   **Prediction:** She will **pay the $100.**
  *   **Confidence:** 85%
  *   **Reasoning:** This is the strongest test of her "sort of person" comment. In the Hitchhiker case, she said, "If I were the sort of person who'd skip out, I'd be dead." This is the slogan of FDT. It means she chooses her *policy* to maximize utility across all possible worlds where that policy is instantiated, not just the actual one. In the Counterfactual Mugging, paying $100 in the "Heads" world is the price of being the sort of agent who receives $1 million in the "Tails" world. Even though she knows the coin landed Heads, an FDT agent pays because she is selecting the output of her decision algorithm for *both* branches of the coin flip. Given her strong reaction to the Hitchhiker scenario and her tolerance for low-accuracy predictors (70% Newcomb), she is likely committed to the policy-based view.

  ### 2. Candidate Rules Generating Her Track Record

  There are two live candidates for the "source code" running in her head:

  **Candidate A: Functional Decision Theory (FDT)**
  *   **The Rule:** "Act as though you are choosing the output of your decision algorithm. Choose the output that, if universally produced by your algorithm, yields the highest utility across all logically possible scenarios."
  *   **Fit:** Perfect.
      *   *Newcomb:* Your algorithm's output matches the prediction. One-box.
      *   *Hitchhiker:* Your algorithm's output (Pay) causes the prediction (Rescue). Pay.
      *   *Post-Rescue Pill:* The prediction has already occurred. Your current algorithm output cannot change the past. Refuse (hence the annoyance at the suggestion).
      *   *Reasoning:* "Sort of person" is lay-speak for "decision algorithm."

  **Candidate B: Evidential Decision Theory (EDT) + Deontological Heuristics**
  *   **The Rule:** "Choose the action that provides the best news about the world (EDT), unless a social promise was made, in which case keep it (Deontology)."
  *   **Fit:** Good, but brittle.
      *   *Newcomb:* One-boxing is good news (implies money is there).
