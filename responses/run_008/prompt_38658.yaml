answer: |-
  Two internal teams, Incumbent and Challenger, are bidding corporate credits for a project worth \$100k. The CFO's rule is Shubik-style: the highest bidder wins the project and pays their bid; the runner-up pays their bid and gets nothing. However, company policy dictates that if the Incumbent team loses a major bid, their entire operational budget is frozen for the next fiscal year, a penalty valued at \$500k, whereas the Challenger faces no such consequence. The Incumbent has bid \$90k; the Challenger has bid \$100k. The Incumbent bids \$110k. An advisor, observing that the bid exceeds the project's intrinsic value, urges the Incumbent to cut their losses and withdraw.

  The reasoning here inverts the standard backward-induction lesson of the Dollar Auction. In the classic game, rational players anticipate the spiral and refuse to start, or quit immediately upon realizing the trap, because the marginal cost of winning eventually exceeds the prize value. In this scenario, the Incumbent is not bidding \$110k for a \$100k asset; they are bidding \$110k to secure a package worth \$600k (\$100k project + \$500k avoided penalty). The Advisor is applying a heuristic ("never bid more than the prize value") that ignores the contingent liability attached to losing. The structural feature doing the work is the **Asymmetric Terminal Payoff**: the cost of losing is discontinuous and status-dependent. For the Challenger, the cost of losing is linear (the bid amount); for the Incumbent, it is step-function heavy (bid + freeze). This asymmetry gives the Incumbent a higher "pain ceiling." If you remove the budget freeze rule, the scenario reverts to the standard Dollar Auction: both parties face symmetric linear losses, the Incumbent's ceiling drops to \$100k, and the \$110k bid becomes irrational escalation leading to mutually assured destruction.

  A sunk-cost purist would steelman their position by arguing that this is not escalation of commitment at all, but rather **bundled valuation**. They would claim the Incumbent is rationally pricing a \$600k good, and the "escalation" is an illusion created by the Advisor arbitrarily defining the "prize" as only the project revenue. This denial is substantive, not merely verbal, because it hinges on whether the \$500k penalty is a valid part of the decision matrix. To separate the readings, observe the agent's behavior if the penalty is removed *ex-ante*. If the Incumbent refuses to enter the auction at all without the penalty (because the project alone isn't worth the risk of a bidding war), their behavior is consistent with rational valuation. If they enter and escalate past \$100k even without the penalty, citing only the \$90k already bid as justification, then—and only then—is it true sunk-cost fallacy. In this case, the Incumbent escalates solely to avoid the future freeze, making the purist's label incorrect.
