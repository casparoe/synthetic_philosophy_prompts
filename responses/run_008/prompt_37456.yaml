          3.  **Expression (Identity):** Dress, leisure behavior. *Rule:* Discretionary, unless it triggers Safety/Transaction issues.
      *   *The "Hand-Off":* When a local norm violates a *core human right* or *deep personal value* (e.g., gender segregation, discrimination).

  6.  **Writing the Response:**
