answer: |-
  Here is a decision procedure designed for a 15-minute advising slot. It keeps your colleague's intuition but tightens the definitions so students don't have to guess at "harm" or "membership."

  ### Part 1: The Fixed Framework
  Your colleague's three buckets are a good start, but the "Signal" bucket is dangerous. "Barely at all" suggests students can ignore local dress codes or greetings, which can lead to harassment or deep offense. We need to split "Signal" into **Respect** (mandatory) and **Membership** (optional).

  Here are the revised definitions you will use to categorize the student's question:

  1.  **Coordination (The System):** Rules that keep physical or social logistics moving (traffic, queuing, boarding).
      *   *Default:* **Follow Local.** If you don't, you cause chaos or block the flow.
  2.  **Transaction (The Contract):** Rules about money, goods, or relational debt (tipping, gifts, greetings).
      *   *Default:* **Follow Local Contract.** "Harm" is defined by the receiver's culture, not the giver's intent.
  3.  **Expression (The Self):** Rules about identity, dress, or leisure (clothing, jaywalking when safe, volume of voice).
      *   *Default:* **Discretionary,** bounded by **Respect.** You don't have to "pass" as a local, but you must not signal disrespect.

  ### Part 2: The 5-Question Procedure
  Hand this list to the student. Walk them through it in order. The first "Yes" or "No" that triggers a **STOP** dictates the advice.

  **Q1: The Safety & Law Stop**
  *   *Question:* Is this behavior illegal *and* enforced, or physically dangerous?
  *   *If Yes:* **Do not do it.** (Terminates: Follow Home/Safety).
  *   *If No:* Go to Q2.

  **Q2: The Wallet & Dignity Test (Transaction)**
  *   *Question:* If I skip this, does a specific person lose money they rely on, or feel insulted by my refusal to participate?
  *   *Crucial Note:* Use *local* standards for "lose" or "insult."
  *   *If Yes:* **Do it.** (Terminates: Follow Local).
  *   *If No:* Go to Q3.

  **Q3: The Flow Test (Coordination)**
  *   *Question:* Is this behavior about how the group moves or organizes itself (queues, boarding, traffic)?
  *   *If Yes:* **Do it.** (Terminates: Follow Local).
  *   *If No:* Go to Q4.

  **Q4: The Respect Test (Expression)**
  *   *Question:* Does doing (or not doing) this signal disrespect to the host community (e.g., dress in sacred spaces, volume in quiet zones)?
  *   *If Yes:* **Do not do it.** (Terminates: Follow Local Norm of Respect).
  *   *If No:* Go to Q5.

  **Q5: The Conscience Veto (Hand-Off)**
  *   *Question:* Does following the local norm violate a core moral value I am unwilling to compromise (e.g., equality, honesty, human rights)?
  *   *If Yes:* **STOP. Hand off to Advisor.** (This is a values conflict, not a norm conflict).
  *   *If No:* **Your Choice.** (Terminates: Student Discretion).

  ***

  ### Part 3: Running the Cases
  Here is how the procedure handles the three scenarios you provided.

  #### Case 1: Tipping in Japan
  *The Student:* "I feel like not tipping is stiffing the waiter. I want to tip."
  *The Procedure:*
  1.  **Safety/Law:** No.
  2.  **Wallet & Dignity:** *Pause.* Does skipping it cause loss? No, wages are included. Does it cause insult? **Yes.** In Japan, tipping signals you view the server as a charity case or that the price wasn't fair.
  3.  **Result:** **Do not tip.**
  *   **Analysis:** This fixes your colleague's "Compensate" bucket. The student thinks "Compensate" means "pay what feels fair at home." The procedure forces them to ask "What counts as compensation *here*?"
  *   **Advisor Note:** You might want to tell them, "Be generous if you can." The procedure overrides this. Generosity here is interpreted as insult. The procedure wins.

  #### Case 2: The Contact-Sport Bus Boarding
  *The Student:* "Is elbowing past people stealing from whoever was there first?"
  *The Procedure:*
  1.  **Safety/Law:** No (assuming no violence).
  2.  **Wallet & Dignity:** No one loses money or dignity; seats are unassigned resources.
  3.  **The Flow Test:** **Yes.** This is a coordination norm. The local "queue" is physical positioning, not linear order.
  4.  **Result:** **Follow Local.** Board assertively.
  *   **Analysis:** This falls under **Coordination.** If the student queues politely while everyone else pushes, the bus leaves without them. The system requires participation to function.
  *   **Advisor Note:** You might want to say, "Don't be aggressive." But the procedure identifies this as a *logistical* requirement, not a moral failing.

  #### Case 3: Jaywalking (The "Rube" Problem)
  *The Student:* "Everyone crosses against the light. Waiting makes me look like a tourist target."
  *The Procedure:*
  1.  **Safety/Law:** Technically illegal, but *enforced?* No. *Dangerous?* No, because traffic flow adjusts to pedestrians.
  2.  **Wallet & Dignity:** No.
  3.  **The Flow Test:** **Yes.** This is coordination. The "green light" is a suggestion; the "herd" is the signal.
  4.  **Result:** **Follow Local.** Cross with the crowd.
  *   **Analysis:** This is where the procedure might conflict with your institutional risk management.
  *   **Advisor Note:** **This is the case where the procedure goes against what you'd want to tell the student.** Your instinct as an advisor is likely "Follow the law to stay safe/covered." The procedure correctly identifies this as a **Coordination** norm where standing out (waiting) creates more risk (targeting) than complying (crossing).
  *   **The Tension:** You have to decide if you can advise a student to technically break a law because the *social enforcement* says otherwise. The procedure says "Go." Your liability insurance might say "Stop."

  ***

  ### Part 4: Limitations & The Hand-Off
  You asked where the procedure has to hand the call back to you. That is **Q5: The Conscience Veto.**

  The procedure cannot settle conflicts between **Local Norms** and **Universal Values.**
  *   *Example:* A student is going to a region where women are legally barred from certain spaces.
  *   *Procedure Run:* Q1 (Law) says "Don't do it." Q5 (Conscience) says "This violates my core value of equality."
  *   *Outcome:* **Hand-Off.**
  *   *Why:* This is no longer about "which fork to use." It is about whether the student can ethically participate in the program at all. You cannot algorithmically solve a moral dilemma. You must discuss their personal boundaries, the political context, and whether they can withdraw without penalty.

  **Summary for your 15-minute session:**
  1.  Use the **Fixed Framework** (Coordination, Transaction, Respect/Expression).
  2.  Run the **5 Questions**.
  3.  If they hit **Q5**, stop the flowchart and have a real conversation.
  4.  Accept that in **Case 3 (Jaywalking)**, the procedure prioritizes *social integration/safety* over *technical legality*, which may contradict your official university stance. You need to decide if you can endorse that distinction.
