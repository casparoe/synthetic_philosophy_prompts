  # JOINT STATEMENT ON THE FREGE-GECH PROBLEM
  **Adversarial Collaboration Outcome**

  **Signatories:** The Expressivist Party (Quasi-Realist) & The Cognitivist Party (Moral Realist)
  **Date:** [Current Date]
  **Subject:** Structural Analysis of the Frege-Geach Problem and Moral Validity

  ## PREAMBLE
  We, the undersigned, acknowledge that our previous dialectical stalemate regarding the Frege-Geach problem stemmed from a conflation of substantive disagreements regarding moral ontology with structural disagreements regarding semantic theory. We agree to stipulate the positions at issue rather than litigate the exegesis of specific authors (e.g., Blackburn, Gibbard, Smith, Boyd). We further agree that the existence of a formal system does not constitute a philosophical solution, nor does the assertion of moral facts constitute an explanation of logical validity. This document records our points of convergence, identifies stretches of dispute we deem merely verbal, and isolates the remaining substantive cruxes with agreed-upon test cases.

  ## PART I: SUBSTANTIVE AGREEMENTS
  *Both parties affirm the following claims. Denial of any claim below constitutes a departure from the consensus reached in this collaboration.*

  1.  **Validity of the "Cat Argument":** We agree that the following inference is logically valid:
      *   P1: Tormenting the cat is wrong.
      *   P2: If tormenting the cat is wrong, getting your little brother to torment the cat is wrong.
      *   C: Therefore, getting your little brother to torment the cat is wrong.
      *   *Agreement:* Rejecting the conclusion while accepting the premises constitutes a logical error, not merely a moral mistake. Any adequate metaethical theory must vindicate this validity.

  2.  **The Frege Point (Content Stability):** We agree that the sentence "Tormenting the cat is wrong" must contribute the same semantic content when it appears as a standalone assertion (P1) as it does when it appears in the antecedent of a conditional (P2). A theory that posits different meanings for these two contexts fails to explain the validity of the inference.

  3.  **Failure of Simple Emotivism:** We agree that simple Ayer-style emotivism (which treats moral sentences as equivalent to non-propositional interjections like "Boo!") is insufficient. It cannot account for the embedding of moral sentences in unasserted contexts (conditionals, negations, questions) without rendering them nonsensical.

  4.  **Requirement of Compositionality:** We agree that a semantic theory must explain how the meaning of complex moral sentences (e.g., "It is not the case that..." or "If... then...") is determined by the meanings of their parts and their mode of combination. A theory that treats every complex moral sentence as a primitive fails this requirement.

  5.  **Surface Grammar:** We agree that moral sentences behave grammatically like truth-apt declarative sentences. They can be negated, conditionalized, quantified over, and embedded under propositional attitude verbs (e.g., "John believes that...").

  ## PART II: IDENTIFICATION OF MERELY VERBAL DISPUTES
  *The following stretch of our previous dispute is identified as verbal. Both parties agree that continued argument on this specific point is unproductive without resolving the substantive cruxes in Part III.*

  **The Definition of "Truth-Condition":**
  *   **The Dispute:** The Cognitivist has insisted that only their view allows moral sentences to have "truth-conditions." The Expressivist has insisted that their view denies "truth-conditions."
  *   **The Resolution:** We agree this is verbal if "truth-condition" is understood deflationarily.
      *   If "S has a truth-condition" means merely "There is a condition under which S is true (where 'is true' is a disquotational device)," **both sides accept this.**
      *   If "S has a truth-condition" means "S functions to represent a mind-independent state of affairs," **the Expressivist denies this and the Cognitivist affirms it.**
  *   **Stipulation:** Henceforth, we will not use the phrase "has truth-conditions" as a premise in arguments unless qualified as "robustly representational" or "deflationary."

  ## PART III: TABLE OF REMAINING SUBSTANTIVE DISAGREEMENTS
  *The following table isolates the non-verbal disagreements. For each row, we have agreed on a concrete test case or formal constraint that bears on the issue, and we record what each side predicts will result from applying that test.*

  | # | Topic | The Expressivist's Phrasing | The Cognitivist's Phrasing | The Underlying Crux | Agreed Test Case / Constraint | Expressivist Prediction | Cognitivist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Explanation vs. Mimicry** | Our semantics for conditionals (e.g., via higher-order attitudes or plans) **explains** validity by showing that holding the premises commits one to the conclusion via consistency of attitude. | Their semantics **mimics** validity by constructing a formal structure isomorphic to truth-conditional logic without the ontology to ground it. | Does structural isomorphism to classical logic count as an *explanation* of validity, or is it a *description* that presupposes the very logical norms it claims to derive? | **The "Because" Test:** Analyze the sentence: "The argument is valid *because* [moral facts exist / attitudes are inconsistent]." | We can ground validity in the inconsistency of normative attitudes without invoking facts. The formal system *is* the explanation. | Without truth-conditions, "inconsistency of attitudes" is a metaphor borrowed from logic. Only truth-preservation explains *why* the attitudes must be inconsistent. |
  | **2** | **Uniformity of Treatment** | Our theory treats all logical connectives (negation, disjunction, quantifiers) uniformly as operations on normative states (e.g., plans). | Their theory solves the conditional case but requires *ad hoc* patches for negation and quantification, unlike the seamless realist treatment. | Can expressivism provide a unified semantics for *all* logical operators, or does it require a new theoretical device for each connective? | **Quantified Moral Claims:** Analyze "Everything the dictator did was wrong." Can this be parsed without positing a domain of moral properties? | We can parse this as a general plan-like state regarding all actions of the dictator. No properties required. | To quantify, you must quantify over *something*. If not properties/facts, the variable is bound to nothing, rendering the semantics empty. |
  | **3** | **The Cognitivist's Explanatory Burden** | Realism assumes logic applies to moral facts without explaining *how* non-natural (or natural) facts enter logical relations. | Realism explains validity trivially: moral sentences express propositions, and logic applies to propositions. | Does realism *explain* the applicability of logic to morality, or does it merely *assert* that moral sentences are the kind of thing logic applies to? | **The Euthyphro of Logic:** Do moral sentences express propositions *because* they obey logic, or do they obey logic *because* they express propositions? | They beg the question. They assume logic applies to prove realism, then use realism to explain logic. | It is not a circle but a category assignment. Once categorized as propositional, logic applies by definition. No further explanation is needed. |
  | **4** | **Deflationary Truth & Embedding** | Deflationary truth allows us to say "It is true that tormenting is wrong" within embedded contexts without positing robust facts. | Deflationary truth presupposes the cognitive structure (propositions) that expressivism denies; it cannot do the heavy lifting alone. | Does a deflationary truth predicate allow expressivism to handle embedding (e.g., "It is true that if P then Q") without collapsing into realism? | **The "It is true that..." Operator:** Embed a moral conditional under a truth operator: "It is true that if P, then Q." | We can handle this via the logic of attitudes. 'True' adds no ontological weight. | 'True' functions to disquote. If you can disquote, you have propositions. If you have propositions, you are a covert cognitivist. |

  ## PART IV: CONDITIONS FOR RESOLUTION
  *We agree that the dispute will only be resolved if one of the following concrete developments occurs:*

  1.  **For the Expressivist:** A demonstration of a unified semantic framework that handles negation, conditionals, and quantification using a single primitive (e.g., "plans" or "normative attitudes") without requiring distinct logical rules for each that mirror classical logic by stipulation.
  2.  **For the Cognitivist:** An explanation of how moral facts (particularly if non-natural) stand in logical relations to one another that does not rely on the prior assumption that moral sentences function like descriptive sentences.
  3.  **For Both:** A consensus on whether "logical validity" in the moral domain requires a metaphysical ground (truth-makers) or is solely a feature of the normative architecture of reasoning.

  **Signed,**

  _________________________ (The Expressivist)

  _________________________ (The Cognitivist)
