prompt: |-
  I'm one of three people on the grants committee of a small philanthropic fund (a family office that spun off, about $2M a year to give away), and I've realized our process for evaluating weird proposals is basically vibes. Most of what we see is normal enough -- bed net distributions, local school programs -- but a couple times a year we get proposals that are structured like: very small chance of astronomically large payoff, please give money. Examples we've actually sat through: a guy who wants to fund a study of whether particle collisions could trigger some vacuum-decay scenario, someone proposing to preserve "at-risk" knowledge by etching it onto nickel plates in a salt mine, and a group arguing that since we might be living in a simulation, we should fund research into not annoying the simulators. I've read enough decision theory to know the naive answer is expected value: multiply the probability by the payoff, biggest number wins. But I also stumbled on this thing called Pascal's mugging, where someone threatens to torture an absurdly huge number of people unless you hand over your wallet, and naive EV says pay him, which is obviously broken. So now I don't trust the math I half-remember and neither does the committee.

  What I want is a decision procedure we can actually run in an afternoon, per proposal, written for people who are not decision theorists (one of our members, bless him, refuses to take seriously any probability below 1%, another one basically wants to always fund anything involving space). Concretely: the questions to ask in order, what counts as a sufficient answer to each, where the procedure outputs a "no" and stops, and where it has to punt back to us because the question is about values rather than math and can't be settled by the procedure itself. It needs to say what to do when the probability attached to a proposal is not just small but obviously made up -- the applicant pulled 10^-30 out of the air -- and whether there's a principled way to set a "probability floor" below which we ignore payoffs no matter how big, or whether that's just an irrational flinch at large exponents. It should also handle diminishing returns (our $50k is a rounding error in some of these schemes) and the possibility that the "payoff" is itself questionable, not just the probability.

  Then run it on three worked cases: (1) our usual bed net grant, (2) the vacuum-decay-study proposal, and (3) the simulation-simulators one -- and I want at least one case where the procedure gives an answer I'm going to hate, since those are the tests of whether it's real. Finally, and this matters to me: be honest about which parts of this are actually settled among people who study this stuff and which parts are genuinely contested. I can never tell whether things like bounding the utility function, or discounting tiny probabilities, or refusing to aggregate across astronomical numbers of lives are the consensus view or just one school yelling louder, and I'd rather see the disagreements flagged than have them hidden inside a confident-looking formula. We meet quarterly, so if the procedure needs a spreadsheet or some crude numbers that's fine, but it can't require anything we couldn't do ourselves in a couple hours.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a 3-person grants committee for a small philanthropic fund (family office spinoff).
      *   **Budget:** ~$2M/year to give away.
      *   **Problem:** Evaluating "weird" proposals (low probability, astronomically high payoff) where their current process is just "vibes."
      *   **Knowledge Level:** Has read some decision theory (knows Expected Value (EV) and Pascal's Mugging), but the committee is mixed (one skeptical of <1% probabilities, one loves space/exotic stuff).
      *   **Needs:** A concrete, actionable decision procedure (checklist/flowchart style) runnable in an afternoon. Needs to handle made-up probabilities, diminishing returns, and questionable payoffs. Needs worked examples (including one unpopular outcome). Needs honesty about contested vs. settled theory.
      *   **Constraints:** No complex math/spreadsheets beyond crude numbers. Must be usable by non-experts.

  2.  **Deconstruct the Core Problem (Pascal's Mugging & Longtermism):**
      *   *The Trap:* Naive Expected Value (EV = Probability $\times$ Payoff) breaks down when Payoff is infinite/astronomical and Probability is tiny but non-zero. Any tiny probability multiplied by infinity is infinity.
      *   *The Solutions (in literature):*
          *   Bounded Utility (capping how much good can exist).
          *   Probability Discounting (ignoring probabilities below a threshold).
          *   Epistemic Humility/Complexity Penalty (more complex claims need more evidence).
          *   Robustness/Tractability (can we actually influence the outcome?).
      *   *The Consensus:* There is *no* consensus. Effective Altruism (EA) and Longtermist circles debate this heavily. I need to be explicit about this.

  3.  **Drafting the Decision Procedure (The "Afternoon Protocol"):**
      *   *Goal:* Filter out the nonsense without throwing out potentially valid high-impact bets.
      *   *Structure:* Sequential gates. If you fail a gate, you stop (or flag for committee vote).
      *   *Gate 1: Tractability & Counterfactuals.* (Can the money actually change the outcome?) This kills the "simulation appeasement" stuff quickly.
      *   *Gate 2: Epistemic Grounding.* (Where did the numbers come from?) This addresses the "made up $10^{-30}$" issue.
      *   *Gate 3: The "Sanity Check" Cap.* (Bounded Utility/Discounting). This addresses Pascal's Mugging directly.
      *   *Gate 4: Diminishing Returns.* (Is $50k actually relevant?)
      *   *Gate 5: Values Vote.* (If it passes math, do we *want* to do this?)

  4.  **Refining the "Probability Floor" Question:**
      *   The user asks if there's a principled way to set a floor or if it's irrational.
      *   *Honest Answer:* It's contested. Some say "never ignore non-zero EV." Others say "probabilities below $1/10^{100}$ are epistemically indistinguishable from zero."
      *   *Practical Advice:* Use an "Epistemic Confidence" score instead of a raw probability floor. Don't trust the applicant's number.

  5.  **Developing the Worked Cases:**
      *   *Case 1: Bed Nets.* (Baseline). Should pass easily. High probability, moderate payoff, tractable.
      *   *Case 2: Vacuum Decay.* (Existential Risk). Low probability, huge payoff. The tricky one. Needs to fail on *tractability* or *epistemic grounding*. (Actually, studying vacuum decay might be scientifically valid, but the grant proposal sounds crackpot. Let's make it fail on Epistemic Grounding/Specificity).
      *   *Case 3: Simulation Appeasement.* (Pascal's Mugging). Should fail. Needs to be the "hate" answer if the committee loves space/weird stuff, or pass if they are risk-averse. Let's make it fail hard on Tractability.
      *   *Wait, the user wants an answer they will hate.* If the committee is generally skeptical (one member refuses <1%), the procedure might force them to fund something weird *or* reject something they want. Let's aim for the procedure rejecting a "sexy" longtermist bet (like the Vacuum Decay one) because the epistemic grounding is too weak, which might annoy the "space" member. OR, have it approve a boring thing over a sexy thing. Let's try to make the Procedure reject the Vacuum Decay study because the *marginal impact* of $50k is zero, which annoys the "big ideas" person.

  6.  **Addressing the "Settled vs. Contested" Requirement:**
      *   I need a dedicated section for this.
      *   *Settled:* Naive EV is broken for infinite payoffs. Tractability matters.
      *   *Contested:* How to discount tiny probabilities. Bounded vs. Unbounded utility. Moral weight of future generations.

  7.  **Iterating on the Procedure (Self-Correction):**
      *   *Critique:* Is it too complex?
      *   *Fix:* Simplify the scoring. Use "Red/Yellow/Green" lights.
      *   *Critique:* How to handle the "made up probability"?
      *   *Fix:* Shift burden of proof. Applicant must justify probability with *evidence*, not models. If they can't, default to "Epistemically Negligible."
      *   *Critique:* The "Hate" case.
      *   *Fix:* Make sure the Vacuum Decay case fails not because the risk isn't real, but because the *grant* doesn't move the needle. This is a common frustration for longtermists (the "drop in the bucket" objection).

  8.  **Finalizing the Content:**
      *   **Introduction:** Acknowledge the difficulty.
      *   **The Procedure:** 5 Gates.
      *   **The "Probability Floor" Answer:** Be honest (it's a heuristic, not a law).
      *   **Worked Examples:** Bed Nets (Pass), Vacuum Decay (Fail - the "hate" one), Simulation (Fail).
      *   **The State of the Field:** Clear distinction between consensus and debate.

  9.  **Tone Check:**
      *   Professional, pragmatic, slightly academic but accessible.
      *   Respectful of the committee's constraints.
      *   Honest about the philosophical uncertainty.

  10. **Final Polish:** Ensure the "Hate" case is clearly identified and explained why it might be unpopular (e.g., rejecting an existential risk mitigation because the specific intervention is ineffective). *Correction:* Actually, the user said "I want at least one case where the procedure gives an answer I'm going to hate." Since I don't know *exactly* which way they lean, I will construct the Vacuum Decay case to fail on "Marginal Impact," which often frustrates people who care about x-risk because it implies their small grant is useless. That's a safe bet for a "hate" outcome.

      *Wait, re-reading:* "One of our members... refuses to take seriously any probability below 1%, another one basically wants to always fund anything involving space."
      *Strategy:* I will design the procedure to be *more* open to low probabilities than the skeptic, but *stricter* on evidence than the space-lover. The "Hate" case should probably be the Space-Lover getting shot down on a space-adjacent weird proposal (Vacuum Decay) because the *tractability* is zero.

      *Let's refine the "Hate" case:* The Vacuum Decay proposal is scientifically intriguing but the specific grant ($50k to a guy) doesn't change the risk. The procedure says NO. The Space-Lover will hate this. The Skeptic will love it. I need to make sure *the user* might hate it. The user seems to be the one worrying about Pascal's Mugging. They might hate it if the procedure *approves* a mugging. But the procedure is designed to *stop* mugings. So the "Hate" case must be a legitimate-sounding high-impact thing getting rejected on technical grounds. Let's go with the Vacuum Decay study getting rejected because the *marginal contribution* is negligible.

      *Actually, let's look at the "Settled vs Contested" part again.* I need to make sure I don't present my heuristics as laws of physics.

      *Okay, ready to write.*
answer: |-
  This is a classic problem in effective altruism and longtermist grantmaking. You have correctly identified that naive Expected Value (EV) calculation breaks down when dealing with astronomical payoffs and tiny probabilities (Pascal's Mugging). There is no mathematical "silver bullet" that satisfies everyone, because the disagreement is often about epistemology (how we know what we know) rather than arithmetic.

  Below is a practical decision procedure designed for a 3-person committee. It prioritizes **tractability** and **epistemic grounding** over raw EV calculations. Following the procedure, I have included the "State of the Field" honesty check you requested.

  ---

  # The "Afternoon Protocol" for High-Variance Grants

  **Time required:** 2–3 hours per proposal.
  **Materials:** Whiteboard, printed proposal, one "Skeptic" and one "Champion" assigned per proposal (rotate roles).

  ## Phase 1: The Tractability Gate (30 Minutes)
  *Goal: Determine if the grant money actually changes the outcome.*

  **Question 1:** If we do *not* fund this, does the bad thing happen (or the good thing fail to happen)? If we *do* fund this, does it stop the bad thing (or cause the good thing)?
  *   **Pass:** There is a clear causal chain from \$50k $\rightarrow$ specific action $\rightarrow$ outcome change.
  *   **Fail:** The outcome depends on global coordination, massive capital (billions), or factors outside the applicant's control.
  *   **Stop Condition:** If the answer is "This is just one small part of a much larger necessary effort" and they cannot explain why *their* part is the bottleneck, **REJECT**.

  **Question 2:** Is this the *marginal* dollar that matters?
  *   **Pass:** The applicant shows they are funding-constrained, not talent/time constrained.
  *   **Fail:** The project is a rounding error in the context of the total cost to solve the problem (e.g., asking for \$50k to prevent a risk that requires \$50B to mitigate).
  *   **Stop Condition:** If your contribution is functionally zero relative to the scale of the problem, **REJECT**. (This handles diminishing returns).

  ## Phase 2: The Epistemic Grounding Gate (45 Minutes)
  *Goal: Determine if the probability number is real or made up.*

  **Question 3:** Where did the probability estimate come from?
  *   **Pass:** Based on historical base rates, empirical data, or peer-reviewed models.
  *   **Fail:** Based on theoretical maximums, "it could be possible," or a number pulled from a model that assumes the conclusion.
  *   **Rule:** If the applicant provides a probability (e.g., $10^{-30}$), you must **ignore it**. You must generate your own "Epistemic Confidence Score" (ECS) on a scale of 1–5.
      *   5 = Empirical data exists.
      *   3 = Theoretical consensus among experts.
      *   1 = Speculation by the applicant alone.

  **Question 4:** The Complexity Penalty.
  *   **Instruction:** Count the number of "miracles" required for the plan to work. (e.g., 1. The theory is true. 2. The experiment works. 3. The result changes policy. 4. Policy prevents the risk).
  *   **Rule:** For every "miracle" beyond the first, discount your confidence by half. If the chain is longer than 4 links, **REJECT**.

  ## Phase 3: The "Mugging" Check (30 Minutes)
  *Goal: Handle the astronomical payoff without breaking the bank.*

  **Question 5:** Is the payoff contingent on accepting a claim that is unfalsifiable?
  *   **Pass:** We can verify if the work was done and if it had an effect (even if decades later).
  *   **Fail:** The payoff relies on metaphysical claims we cannot verify (e.g., "appeasing simulators," "preventing vacuum decay that we can't detect").
  *   **Stop Condition:** If the payoff is unfalsifiable, **REJECT**. (This is your probability floor heuristic).

  **Question 6:** The "Utility Cap" Heuristic.
  *   **Instruction:** Do not calculate the total value of all future humans. Instead, cap the "Payoff" at **1,000 times your annual budget** (\$2B equivalent value).
  *   **Reasoning:** Any claim of value higher than this is epistemically indistinguishable from infinity to a small committee.
  *   **Calculation:** $EV = (\text{Your ECS converted to \%}) \times (\text{Capped Payoff})$.
  *   **Threshold:** If the adjusted EV is less than 10x the grant amount, **REJECT**.

  ## Phase 4: The Values Vote (15 Minutes)
  *Goal: Acknowledge where math ends and philosophy begins.*

  **Question 7:** If this works, is it a world we want?
  *   **Instruction:** This is not a math question. If the proposal succeeds (e.g., we preserve knowledge in a salt mine), do all three committee members agree that is *good*?
  *   **Rule:** Unanimous agreement required. If one member objects on moral/strategic grounds, **PUNT TO FULL COMMITTEE VOTE**.

  ---

  # Worked Cases

  Here is how the protocol applies to your three scenarios.

  ### Case 1: Bed Net Distribution (The Baseline)
  *   **Tractability:** **Pass.** \$50k buys specific nets. Nets prevent malaria. We know this works. Marginal dollar matters (funding gaps exist).
  *   **Epistemic Grounding:** **Pass (ECS 5).** Decades of empirical data. Base rates are solid.
  *   **Mugging Check:** **Pass.** Payoff is finite (lives saved), not astronomical/unfalsifiable.
  *   **Values:** **Pass.** Everyone agrees saving lives is good.
  *   **Outcome:** **FUND.**
  *   *Note:* This is the control case. If the procedure rejects this, the procedure is broken.

  ### Case 2: Vacuum-Decay Study (The "Hate" Answer)
  *Proposal:* A physicist wants \$50k to run a tabletop experiment to see if high-energy collisions trigger vacuum decay. Payoff: Prevents extinction of all future life. Probability: Low, but non-zero.
  *   **Tractability:** **FAIL.**
      *   *Reasoning:* Even if the study confirms the risk, does your \$50k stop the Large Hadron Collider or future colliders? No. The applicant admits this is "basic research." The marginal impact of *this specific grant* on the actual existential risk is near zero. The risk is global; the funding is local.
      *   *Protocol:* Phase 1, Question 2 (Marginal Dollar).
  *   **Epistemic Grounding:** **FAIL.**
      *   *Reasoning:* The probability estimate is theoretical. ECS is likely 2. Complexity chain is long (Study $\rightarrow$ Result $\rightarrow$ Policy Change $\rightarrow$ Global Compliance).
  *   **Outcome:** **REJECT.**
  *   *Why you might hate this:* If you believe existential risk is the *only* thing that matters, rejecting a project that studies an x-risk feels immoral. However, the procedure flags that **your money doesn't move the needle.** This is the "drop in the bucket" problem. The space-loving committee member will hate this.

  ### Case 3: Simulation Appeasement (The Mugging)
  *Proposal:* Fund art/rituals to avoid annoying potential simulators. Payoff: Prevents simulation shutdown (infinite loss).
  *   **Tractability:** **FAIL.** No causal mechanism established.
  *   **Epistemic Grounding:** **FAIL.** ECS is 1 (Speculation). Unfalsifiable.
  *   **Mugging Check:** **FAIL.**
      *   *Reasoning:* Phase 3, Question 5. The payoff is unfalsifiable. We cannot verify if simulators exist or if they are annoyed.
  *   **Outcome:** **REJECT.**
  *   *Why this is easy:* This is a classic Pascal's Mugging. The protocol kills it at the "Unfalsifiable" gate.

  ---

  # The "Probability Floor" Question

  You asked if there is a principled way to set a probability floor (e.g., ignore anything below 1%) or if that is irrational.

  **The Honest Answer:**
  There is **no consensus** on a mathematical probability floor.
  *   **The Purist View:** A probability of $10^{-100}$ multiplied by $10^{100}$ lives is still 1 life. Ignoring it is mathematically inconsistent.
  *   **The Pragmatist View (Recommended for you):** Probabilities below a certain threshold are **epistemically indistinguishable from zero.** When an applicant says $10^{-30}$, they are not doing math; they are expressing "very unlikely."

  **The Procedure's Solution:**
  Do not use a probability floor. Use an **Epistemic Confidence Score (ECS)** floor.
  *   If the claim relies on unfalsifiable metaphysics (Simulators), ECS = 0. Reject.
  *   If the claim relies on speculative physics (Vacuum Decay), ECS = Low.
  *   If the claim relies on empirical data (Bed Nets), ECS = High.

  This sidesteps the math problem. You aren't saying "1% is the floor." You are saying "If you cannot provide evidence that allows us to estimate confidence, we treat the probability as negligible." This is defensible to donors and avoids the "irrational flinch" accusation.

  ---

  # State of the Field: Settled vs. Contested

  You asked for honesty about what is agreed upon in decision theory and effective altruism circles. Here is the breakdown:

  ### 1. Settled (Consensus)
  *   **Naive EV is broken for infinite payoffs:** Everyone agrees you cannot simply multiply Infinity $\times$ Tiny Probability.
  *   **Tractability matters:** It is widely accepted that a grant must be *marginal*. If your money doesn't change the outcome, the EV is zero regardless of the stakes.
  *   **Diminishing Returns:** It is accepted that \$50k means less to a billion-dollar project than to a \$100k project.
  *   **Unfalsifiable claims are bad investments:** There is strong consensus that philanthropy should target verifiable outcomes.

  ### 2. Contested (Active Debate)
  *   **Bounded vs. Unbounded Utility:**
      *   *Debate:* Should we cap the value of the future? (My procedure suggests capping it for practical reasons).
      *   *Side A:* Capping utility implies that saving 1 billion people is not significantly better than saving 1 million, which seems immoral.
      *   *Side B:* Without a cap, you are forced to prioritize speculative space projects over saving living people (the "Astronomical Waste" argument).
  *   **Probability Discounting:**
      *   *Debate:* Is it rational to ignore probabilities below a threshold?
      *   *Side A:* No, that's irrational bias.
      *   *Side B:* Yes, because human estimation of probabilities below 1% is noise, not signal.
  *   **The "Cluelessness" Objection:**
      *   *Debate:* Because the future is complex, we can never know the long-term consequences of our actions.
      *   *Implication:* Some argue we should only fund short-term, measurable interventions (Bed Nets). Others argue we must try to influence the long-term anyway (Vacuum Decay). **Your committee is currently fighting this war.**

  ### 3. The "Hate" Case Explanation
  In Case 2 (Vacuum Decay), the procedure rejects the grant.
  *   **Why it hurts:** If you believe existential risk is the priority, rejecting *any* x-risk research feels wrong.
  *   **Why it's necessary:** For a \$2M fund, you cannot move the needle on global existential risk. You are too small. The procedure forces you to admit that **you are not the bottleneck.**
  *   **The Conflict:** The committee member who "wants to fund anything involving space" will argue that we *must* take the bet. The procedure forces them to prove **tractability**. If they can't, the math says "No." This is the intended friction.

  ### Summary Recommendation
  Adopt the **Afternoon Protocol** as a trial for one quarter.
  1.  **Print the Gates.**
  2.  **Force the applicants** to answer Phase 1 (Tractability) before you even look at the science.
  3.  **Ignore their probability numbers.** Use the ECS (1–5) instead.
  4.  **Accept the rejection** of the Vacuum Decay proposal if it fails the Marginal Dollar test. It is better to admit your fund is too small for that problem than to pretend \$50k saves the universe.

  This protects you from Pascal's Muggers without requiring you to become decision theorists. It shifts the burden of proof to the applicant to show *causal impact*, not just *high stakes*.
