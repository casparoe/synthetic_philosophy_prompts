answer: |-
  ### 1. The Procedure

  **Step 1: Pin the Rule**
  Write the policy as a single sentence rule of action: "I will [action] when [condition] to achieve [goal]." You must strip out specific names, dates, or unique identifiers unless they are morally relevant. You cannot say "I will lie to Acme Corp on Tuesday." You must say "I will lie to clients when it secures a deal." If the proposal only works because *we* are doing it and others are not, you must generalize it to "Any company may do this." If the panel cannot agree on this formulation within 15 minutes, the proposal is too vague to evaluate. Pause and rewrite.

  **Step 2: Imagine the Standard Practice**
  Assume every company and employee adopts this rule as standard industry practice. No one is exempt. Describe this world in detail. Does the practice still function? For example, if everyone shades the truth about promotions, do candidates still believe recruiters? If everyone hides data usage in long documents, do users still understand consent? Write down the state of trust and communication in this world.

  **Step 3: Test for Functional Collapse**
  Ask: "In this world, does the action become impossible?" If the universal practice destroys the conditions needed for itself to exist, it fails. If no one believes recruiters because everyone lies, lying no longer secures deals. The policy defeats its own goal. If the panel agrees the practice would collapse under universal adoption, terminate here. Verdict: **Veto**.

  **Step 4: Test for Rational Acceptance**
  If the practice functions, ask: "Would a rational person agree to work or live in this world?" Even if the system doesn't collapse, does it undermine something essential we need? If everyone monetizes hidden data, the market functions, but would you willingly join a market where no one knows how their data is used? If no rational agent would consent to this standard because it erodes essential trust or autonomy, it fails. If the panel agrees rational agents would reject this world, terminate here. Verdict: **Veto**.

  **Step 5: Determine the Verdict**
  *   **Veto:** If Step 3 or 4 fails. The policy is ethically impermissible. Explain to leadership: "We tested whether this policy could function as a standard industry rule. It failed because universal adoption would [collapse trust/be unacceptable to rational agents]."
  *   **Pass:** If both steps pass. The policy is ethically permissible.
  *   **Punt:** If the rule passes but creates significant friction or risk not captured by logic (e.g., everyone preferring coffee to tea). This is a business risk, not an ethics veto. Return to the product lead for final call.

  ### 2. Where Judgment Lives

  Do not fool yourselves that this is an algorithm. Three steps require subjective judgment dressed as procedure. First, **Step 1 (Maxim Formulation)**: Deciding which details are "morally relevant" versus "gaming" is interpretive. A clever advocate can always broaden or narrow the rule to sway the outcome. Second, **Step 4 (Rational Acceptance)**: Defining what a "rational agent" would will is a proxy for your own values. You might claim objective rationality while importing personal biases about risk or privacy. Third, **Distinguishing Collapse from Inconvenience**: In Step 3, deciding whether a practice becomes *impossible* or merely *harder* is a judgment call. This is where **contradiction in conception** bleeds into **contradiction in will**. You are deciding how much friction counts as failure.

  ### 3. Three Test Cases

  **(a) Recruiters shading truth about promotions:**
  *Rule:* "I will misrepresent timelines to candidates to prevent drop-off."
  *Universalize:* Every recruiter misrepresents timelines.
  *Collapse:* Candidates learn timelines are always lies and ignore them. Recruiters can no longer influence decisions with timelines. The practice destroys its own utility.
  *Verdict:* **Veto**. This is a classic **contradiction in conception**. The test is built for this. It handles direct instrumental lying perfectly.

  **(b) Monetizing behavioral analytics hidden in ToS:**
  *Rule:* "I will monetize user data disclosed only in unread legal terms."
  *Universalize:* Every company hides data use in unread terms.
  *Collapse:* Consent becomes fictional; users know they are blind. The market functions, but would a rational agent will a world where privacy consent is impossible? Most panels will say no.
  *Verdict:* **Veto**. This tests **contradiction in will**. However, you may dislike this because it vetoes standard industry revenue models. The test treats structural deception the same as direct lying.

  **(c) Falsely warm rejection feedback:**
  *Rule:* "I will give false positive feedback to rejected candidates to spare feelings."
  *Universalize:* All companies give false positive feedback to rejections.
  *Collapse:* Feedback becomes noise. Candidates cannot distinguish rejection from encouragement. The practice loses meaning.
  *Verdict:* **Veto**. You will likely dislike this. Socially, this feels like kindness. Kantian universalizability is blind to social lubrication; it sees only the degradation of communication. The test is built for truth-telling, not nuance. It reaches this case but offers no flexibility for benevolent deception.

  ### 4. What the Procedure Can't Do

  Universalizability is a test for **perfect duties** (strict prohibitions), not a guide for optimizing good. It cannot resolve conflicts between two universalizable options (e.g., "hire internally" vs. "hire externally"). It is silent on **consequentialist** harms; if everyone did something harmful but logically consistent (e.g., "everyone drives gas cars"), the test might pass it despite climate damage. It also struggles with **structural injustice**; if a practice relies on existing inequality, universalizing it might not reveal the injustice if the inequality is assumed in the background. Stop pretending this procedure can handle trade-offs, systemic harm without logical contradiction, or conflicting ethical goods. It is a veto switch for deception and coercion, not a compass for strategy.
