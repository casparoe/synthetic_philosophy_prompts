answer: |-
  You have stumbled upon one of the most profound distinctions in probability theory and economics, often framed as the difference between **ensemble averages** (your friend's view) and **time averages** (your view). This is not merely a disagreement about risk tolerance; it is a disagreement about the physical nature of the process you are engaging in.

  Here is the untangling of the math, the principle, and the intuition.

  ### 1. The Core Disagreement: Ergodicity
  Your friend is calculating the **arithmetic expected value**. He is correct that if you could make this bet in 1,000 parallel universes simultaneously, the average wealth across those universes would be maximized by betting everything in each one. In that ensemble, the universes where you win big outweigh the universes where you go to zero.

  However, you do not live in an ensemble of parallel universes. You live in a single timeline where wealth compounds sequentially. This is a **non-ergodic** system. The average outcome across many people (ensemble) is not the same as the average outcome for one person over time (time average).

  In a sequential, multiplicative process (compounding bankroll), the relevant metric is not the arithmetic mean, but the **geometric mean**.
  *   **Arithmetic Mean (Friend):** $(1.1 + 0.9) / 2 = 1.0$ (Simplistic example). He focuses on $E[W]$.
  *   **Geometric Mean (You):** Focuses on the growth rate $g$ such that $W_N = W_0 \cdot e^{Ng}$.

  If you bet 100% of your bankroll at 55% win probability, your wealth trajectory is a multiplicative random walk. The moment you hit a loss (which happens with probability $0.45^N$ as $N$ grows), your bankroll hits zero. Zero is an absorbing state. In the long run, the probability of hitting zero approaches 1. Therefore, the **time-average growth rate of an all-in strategy is negative infinity.**

  Your friend is optimizing for *expected wealth* (which is dominated by rare, astronomically high outcomes in the tail). You are optimizing for *typical wealth* (what actually happens to you).

  ### 2. The Principled Solution: The Kelly Criterion
  You asked if there is a principled sense in which a specific fraction is optimal. There is. It is the **Kelly Criterion**, derived by John Kelly at Bell Labs in 1956.

  The principle is: **Maximize the Expected Logarithm of Wealth.**
  Why log? Because wealth compounds multiplicatively. If you take the logarithm of a product, it becomes a sum:
  $$ \log(W_N) = \log(W_0) + \sum_{i=1}^{N} \log(1 + f \cdot r_i) $$
  By the Law of Large Numbers, this sum converges to the expected value. Maximizing $E[\log(W)]$ maximizes the long-term geometric growth rate of your bankroll. This is the only strategy that asymptotically dominates all other strategies in terms of reaching any given wealth target in the minimum time, without risking ruin.

  **Does it pin down an exact number?**
  Yes. For a binary bet with even-money payout ($b=1$) and win probability $p$, the optimal fraction $f^*$ is:
  $$ f^* = \frac{bp - q}{b} = p - q $$
  Where $q = 1 - p$ is the probability of loss.

  Plugging in your numbers:
  *   $p = 0.55$
  *   $q = 0.45$
  *   $b = 1$ (even money)

  $$ f^* = 0.55 - 0.45 = 0.10 $$

  **The exact growth-optimal fraction is 10%.**

  Your intuition about 5–10% was remarkably close. 10% is the theoretical peak of the growth curve. However, the growth curve is "flat" near the peak. Betting 5% (Half-Kelly) reduces volatility by roughly 50% while sacrificing only about 25% of the growth rate. Most professional gamblers and investors use **Half-Kelly** (5% in your case) to protect against estimation error (i.e., if your edge is actually 53% instead of 55%, Full Kelly becomes dangerous).

  ### 3. Is Your Friend's Position a Mistake?
  It is not a mathematical mistake; it is a **specification error**.

  His position is coherent *only if*:
  1.  You have linear utility of money (you value the billionth dollar exactly as much as the first).
  2.  You can play the game in parallel (or reset your bankroll to the starting value after every bet using outside income).
  3.  You do not care about the probability of ruin.

  If you are maximizing $E[W]$ (Arithmetic Expectation) over a single sequence, the math dictates you should indeed bet everything. But because $W$ can go to zero, $E[W]$ is driven by outcomes that happen with vanishingly small probability (winning 1,000 times in a row).

  In almost every *realizable* path (the "typical" set), you go broke. Your friend is optimizing for a miracle; you are optimizing for a living. In the context of a side project you want to sustain for years, his objective function is functionally wrong for your goals.

  ### 4. Additive vs. Multiplicative (Your Intuition Check)
  Your intuition here is spot on. The strange behavior you are seeing comes **precisely** from the fact that each round's stake is a share of what you currently have (multiplicative).

  **Scenario A: Multiplicative (Current Setup)**
  *   **Mechanism:** Bet $f \times \text{Current Bankroll}$.
  *   **Constraint:** Bankroll cannot go negative; zero is ruin.
  *   **Math:** Geometric Brownian Motion (discrete).
  *   **Optimization:** Maximize Geometric Growth (Kelly).
  *   **Result:** All-in leads to ruin. Fractional betting leads to compounding.

  **Scenario B: Additive (Fixed Exposure)**
  *   **Mechanism:** Bet fixed $\$X$ per round. Losses covered by outside income/salary.
  *   **Constraint:** No ruin (assuming income covers drawdowns).
  *   **Math:** Arithmetic Random Walk.
  *   **Optimization:** Maximize Arithmetic Expected Value.
  *   **Result:** You should bet as much as possible (subject to liquidity constraints or risk limits imposed by your outside income).

  If you had infinite outside income to cover any losing streak, your friend would be right: you should stake the maximum dollar amount the bookie will take on every bet, because the expectation is positive and there is no risk of permanent ruin. The "risk of ruin" only exists because the bet size is coupled to the current wealth.

  ### Summary & Recommendation

  1.  **You are right.** In a single timeline with compounding capital, maximizing arithmetic expected value leads to almost certain ruin. Maximizing geometric growth (log utility) is the mathematically rigorous way to maximize long-term wealth.
  2.  **The Number:** The growth-optimal fraction is exactly **10%** (Full Kelly). However, given that your edge (55%) is an estimate and not a physical law, **5% (Half-Kelly)** is the standard professional recommendation. It protects you if your model degrades or if you hit a bad variance streak.
  3.  **The Friend:** He is applying single-period logic to a multi-period problem. He isn't "bad at math," but he is ignoring the **ergodicity problem**.
  4.  **The Structure:** If you could decouple bet size from bankroll (additive bets funded by income), the logic flips. But since you are recycling winnings (multiplicative), you must respect the geometry of compounding.

  **Practical Advice:**
  With a $20,000 bankroll, a 10% Kelly bet is $2,000 per wager. That is incredibly volatile. Even with a 55% edge, a standard 10-bet losing streak (which happens reasonably often) would cut your bankroll by nearly 65% if you bet Full Kelly.
  *   Adopt **Half-Kelly (5%)**.
  *   This stakes $1,000 per bet.
  *   It maximizes the ratio of expected growth to volatility.
  *   It acknowledges that your 55% estimate might be optimistic.

  Tell your friend: *"We aren't maximizing expected value; we are maximizing the time-average growth rate. In a non-ergodic system, those are different things. Kelly maximizes the one that keeps us in the game."*
