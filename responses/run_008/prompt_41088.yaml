          *   All-in betting with $p < 1$ guarantees eventual ruin ($\lim_{N \to \infty} P(\text{ruin}) = 1$).
          *   This is the "St. Petersburg Paradox" / "Kelly Criterion" territory.
      *   **User's Argument (Maximize Growth/Survival):**
          *   Focuses on the *time average* growth rate.
          *   This leads directly to the **Kelly Criterion**.
          *   Kelly maximizes the expected logarithm of wealth ($E[\log(W)]$).
          *   Why log? Because wealth compounds multiplicatively. $\log(\prod X_i) = \sum \log(X_i)$. By the Law of Large Numbers, the average growth rate converges to the expected log growth.
      *   **Kelly Calculation:**
          *   Edge ($p$) = 0.55
          *   Odds ($b$) = 1.0 (even money)
          *   Formula: $f^* = \frac{bp - q}{b} = \frac{1(0.55) - 0.45}{1} = 0.10$.
          *   So, 10% is the *exact* Kelly fraction.
      *   **Additive vs. Multiplicative:**
          *   Multiplicative (betting % of bankroll): Ruin is absorbing state (0). Geometric mean dominates. Kelly applies.
