answer: |-
  This is a fantastic philosophical puzzle. Your roommate is clearly operating under what philosophers call the **Standard View of Lying** (often associated with Augustine, Aquinas, and contemporary scholars like J.E. Mahon).

  Based on her "docket," she is distinguishing between **what is said** (semantics) and **what is implied** (pragmatics), and she places a heavy premium on **belief** and **intent**.

  Here is the breakdown of her likely rulings, the rule she's actually using, and the tiebreaker case you need.

  ### 1. The Underlying Rule
  Your roommate is running a three-part test. For something to be a **Lie**, it must meet all three criteria:
  1.  **Assertion:** You must explicitly state a proposition (not just imply it).
  2.  **Belief:** You must believe that proposition is false.
  3.  **Intent:** You must intend for the listener to believe that proposition is true.

  If you imply something false but state something true (Innkeeper, Laptop), it's **Misleading**.
  If you state something false but believe it's true (Party Time), it's a **Mistake**.

  ### 2. The Rulings on Your Two Cases

  #### Case One: The Diary ("Have you stopped?")
  **Her Ruling:** **Lie.**
  **Why:** This is a classic "Complex Question" fallacy (like "Have you stopped beating your wife?"). The question presupposes you *were* reading the diary.
  *   **Semantics:** To answer "Yes" to "Have you stopped X?" is semantically equivalent to asserting "I was doing X, and I am no longer doing X."
  *   **Belief:** Since he never read it, he knows the statement "I was doing X" is false. Therefore, the whole proposition "I have stopped" is false.
  *   **Intent:** He says it to "get out of the conversation," which implies he is willing to let her believe the falsehood to achieve peace.
  *   **The Split:** This case tests the **Assertion** condition. Even though the *question* tricked him, his *answer* was a literal falsehood he knew was false. Unlike the Innkeeper (who told a literal truth), the Diary Guy told a literal falsehood. She will likely rule that validating a false presupposition counts as asserting it.

  #### Case Two: The Cake ("It wasn't me")
  **Her Ruling:** **Not a Lie.**
  **Why:** This tests the **Intent** condition.
  *   **Assertion:** He stated a falsehood ("It wasn't me").
  *   **Belief:** He believed it was false (he ate it).
  *   **Intent:** He did *not* intend for anyone to believe him. The frosting, the audience, and the "grin" signal that this is **irony** or **joking**.
  *   **The Split:** This splits the "Assertion of Falsehood" rule from the "Intent to Deceive" rule. If lying were *just* saying what you believe is false, this would be a lie. But because the social context removes the intent to deceive, her philosophy (which aligns with the Standard View) will classify this as **Joking**, not lying.

  ### 3. The "Stopped" Presupposition Deep Dive
  You asked: *Is the "yes" even false?*

  Yes, logically it is. In formal semantics, the verb "stop" is a **factive predicate** that entails the prior existence of the action.
  *   Proposition: `Stop(Reading)`
  *   Truth Condition: `Past(Reading) AND Not-Present(Reading)`
  *   Reality: `Not-Past(Reading)`
  *   Result: **False.**

  By answering "Yes," he is not just accepting the frame; he is asserting the truth conditions of the verb. If he wanted to avoid lying, he would have to reject the presupposition ("I never read it"). By saying "Yes," he lies.

  ### 4. The Tiebreaker: The "Bullshit" Case
  You mentioned she's muttering about **Bullshitting**. This refers to Harry Frankfurt's famous essay *On Bullshit*.

  *   **The Liar** cares about the truth (they have to know it to hide it).
  *   **The Bullshitter** does not care about the truth at all (they are indifferent to whether it is true or false).

  To force her hand, you need a case that separates **Belief in Falsehood** (Lying) from **Indifference to Truth** (Bullshitting). Her current rules rely on the speaker *believing* something is false. What if they don't believe anything?

  **Propose this Case Three to her:**

  > **The Wine Snob:** A guy is at a party trying to impress a date. He knows nothing about wine. He picks up a bottle, looks confident, and says, "Ah, this is a bold 2015; the drought that year really concentrated the tannins."
  >
  > **The Catch:** He has no idea if it's a 2015. He has no idea if there was a drought. He hasn't checked the label. He doesn't care if the statement is true or false. He just wants to *sound* like he knows wine. (As it happens, the bottle *is* a 2015, and there *was* a drought, so his statement is technically true).

  **Why this ties it all up:**
  1.  **Is it a Lie?** No. He didn't believe the statement was false. (Fits her "Mistake" rule, but it's not a mistake).
  2.  **Is it Misleading?** No. He isn't hiding a specific truth; he's fabricating an impression.
  3.  **Is it a Mistake?** No. He isn't trying to be accurate.
  4.  **The Verdict:** This forces her to use the **Bullshit** category. It proves that "Lying" requires a relationship with the truth (hiding it), whereas "Bullshitting" is an abandonment of the truth constraint entirely.

  **Summary of your prep:**
  *   **Diary:** Lie (Literal falsehood).
  *   **Cake:** Not a Lie (No intent to deceive).
  *   **Wine Snob:** Bullshit (Indifference to truth).

  If you walk in with that distinction, you'll look like you've been reading Frankfurt yourself. Good luck.
