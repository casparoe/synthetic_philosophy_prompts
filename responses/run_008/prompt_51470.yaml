prompt: |-
  My roommate is a philosophy major and we have this ongoing thing about lying vs "just misleading" someone. She's very firm that they're different in kind, not just different amounts of bad, and over like two years of movies and stuff happening at her lab job she's accumulated a little docket of rulings. So far, for the record: me telling the delivery guy "I already paid online" when I hadn't — lie. The movie scene where the fugitive asks the innkeeper "did you see him pass?" and the innkeeper answers "he was heading toward the bridge an hour ago" (true! but the guy's hiding in the cellar) — not a lie, though she called it a genuinely nasty thing to do. Her coworker, asked directly "anything wrong with this laptop I should know about?", replying "it's got the original charger and never left my desk" while knowing full well the motherboard is fried — also not a lie, but she rated it almost as bad as lying. And me telling our friend the party started at 8 when I honestly believed it did (it was 9) — obviously just a mistake, no lying involved.

  Anyway this weekend we cooked up two cases she refused to rule on right away because she wants to sit with them, and I want to have my thinking done before she announces. Case one: a guy who has never once read his roommate's diary — doesn't even know where she keeps it — gets confronted with "have you finally stopped reading my diary?" and, because it's the fastest way out of the conversation, just says "yes." Case two: at a party, in front of everyone who literally watched him eat the last slice of cake, with frosting on his face, he says "it wasn't me," grinning, purely as a bit, and everyone including the cake's owner laughs because they all know the truth.

  Help me get ahead of her. What will she say about each of the two, and what rule(s) has she actually been running all along? I can see at least a couple that fit everything she's ruled so far — something like "you lie exactly when you assert something you believe false" vs something more like "you need an intent to actually deceive the person" vs maybe something about what the utterance semantically carries regardless of what's strictly asserted. Which of the two cases splits which of those rules, and what's your best guess at her ruling for each? Also, and I'm guessing this matters for the first case: is the "yes" even false, given he never touched the diary? Depends on whether the "have you stopped" question smuggles the diary-reading in as part of what he's asserting or just as baggage the question brings with it, I guess. And finally, she's been muttering lately that bullshitting might be its own whole category, so suggest a further case that would really tiebreak between the surviving rules — like, would it be someone who flatly asserts something they have no belief about either way? I want the case that forces her hand.
