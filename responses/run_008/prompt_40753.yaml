answer: |-
  You have intuitively stumbled upon a distinction that moral philosophers spend careers debating. Your gut reactions are surprisingly consistent with a robust framework, but to make them hold water logically, you need **two principles**, not one.

  Here is the breakdown of the principles, where they split, which of your verdicts needs to be sacrificed, and how this applies to the reformed racist case.

  ### The Two Principles

  **Principle 1: Normative Integrity (The Hypocrisy Check)**
  *   **Scope:** Applies to your general relationship with the *rule* being broken.
  *   **The Rule:** You have standing to blame only if your conduct demonstrates a current commitment to the specific norm you are invoking.
  *   **Why:** Blame is a demand for compliance. If your actions show you don't respect the rule, your demand is noise.
  *   **Covers:** Your cases #1 (Dishes), #2 (Texting), #3 (Gossip), #4 (Taxes), and #5 (Littering).

  **Principle 2: Causal Clean Hands (The Provocation Check)**
  *   **Scope:** Applies to your specific relationship with the *event* being blamed.
  *   **The Rule:** You have no standing to blame if you are the causal architect of the specific violation you are criticizing.
  *   **Why:** You cannot demand someone maintain composure if you are actively dismantling it. This isn't about hypocrisy; it's about entrapment.
  *   **Covers:** Your case #6 (Snapping).

  **Where One Leaves Off and the Other Takes Over:**
  Principle 1 looks at your **character over time** (Do you honor this rule?). Principle 2 looks at the **interaction in the moment** (Did you cause this breach?). You can have perfect Normative Integrity (you never snap at anyone) but fail Causal Clean Hands (you poked this person until they snapped at you). Principle 2 overrides Principle 1; even a saint loses standing if they provoke the sin.

  ---

  ### Mapping Your Cases

  *   **Case 1 (Dishes):** Fails Principle 1. You are currently violating the specific norm. **Verdict: No standing.**
  *   **Case 2 (Texting):** Passes Principle 1. You are currently compliant. Your past violation actually strengthens your "moral experience" (you know the struggle). **Verdict: Standing.**
  *   **Case 3 (Gossip):** Fails Principle 1 (Ambiguous). Your record is clean, but not by *choice*. Integrity requires tested virtue, not just luck. **Verdict: Shaky standing.**
  *   **Case 4 (Taxes):** Fails Principle 1. You are actively violating the norm. (More on this below). **Verdict: No standing.**
  *   **Case 5 (Littering):** Passes Principle 1. Norm individuation matters. Littering (direct, public decay) is a different norm than Carbon Footprint (systemic, diffuse harm). You can uphold one while failing the other. **Verdict: Standing.**
  *   **Case 6 (Snapping):** Fails Principle 2. You caused the specific reaction. **Verdict: No standing.**

  ---

  ### The Verdict to Throw Out: Case 4 (Taxes)

  To make Principle 1 work strictly, you must discard the idea that **admission grants standing.**

  You wrote: *"Blaming my brother for cheating on his taxes when I cheat on mine too but feel awful about it and admit it: more permissible than plain hypocritical blame, but not clean either."*

  **The Correction:** You have **no standing** to blame him while you are actively cheating.
  **The Reason:** Standing is about the *authority to demand compliance*. By actively cheating, you are signaling that the norm does not bind you *right now*. Admission makes you an *honest* violator, which reduces the interpersonal hostility (your brother won't resent you as much), but it does not restore your authority to enforce the rule on him. You have standing to *confess with him*, or to *advocate for the rule generally*, but you cannot occupy the position of the "blamer" while you are a co-conspirator.

  If you keep the verdict that you have "some" standing, the principle collapses because it allows active violators to police the very rules they are breaking, provided they feel bad about it. Feeling bad is internal; compliance is external. Standing requires external alignment.

  ---

  ### Application: The Reformed Racist

  This maps directly to **Case 2 (Texting)** under Principle 1.

  **1. Do they have standing?**
  **Yes.** Under Principle 1, standing is determined by your *current* commitment to the norm, not your permanent record. If they have genuinely renounced racism and are actively anti-racist now, they satisfy the Normative Integrity condition.

  **2. Does it matter how recent the change is?**
  **Yes, but for credibility, not standing.**
  *   **Standing:** Theoretically, the moment they genuinely change, they regain standing.
  *   **Credibility:** In practice, standing is a social currency. If the change was yesterday, observers (and the person being blamed) will doubt the stability of that commitment (similar to your **Case 3/Gossip** luck problem). Time provides the evidence that the commitment is real, not just performative. So, while a newly reformed racist *has* standing, a long-reformed racist has *unassailable* standing.

  **3. Does it matter if they used to be much worse?**
  **Yes, it creates "Moral Debt."**
  This is where your intuition in **Case 2** ("more standing than someone who's never done it") is crucial. A reformed racist often has *more* effective standing than a lifelong non-racist, but they carry a higher burden of proof.
  *   **The Advantage:** Like the reformed texter, they can speak to the *possibility of exit*. A lifelong non-racist cannot explain how to stop being racist; they can only say "don't start." The reformed racist can say, "I know how deep that hole goes, and I know how to climb out." This is moral expertise.
  *   **The Burden:** Because their past was severe, they must be more vigilant in demonstrating their current commitment. If a lifelong non-racist makes a slip, it's a mistake. If a reformed racist makes a slip, it looks like a relapse.

  **Summary Verdict on the Racist Case:**
  A genuinely reformed racist has full standing to blame racists. In fact, under your **Case 2** intuition, they may have *greater* moral authority to offer a path forward. However, the severity of their past racism means their "reformed" status must be robustly demonstrated over time to silence the inevitable accusations of hypocrisy. They have the *right* to blame immediately upon change, but they earn the *weight* of that blame over time.
