  1.  **Analyze the Request:**

      *   **User:** Experienced novelist (12 years, 4 books).
      *   **Problem:** Deciding whether to shelve a stalled manuscript or keep going. Struggles to distinguish sunk-cost rationalization from legitimate forward-looking considerations.
      *   **Goal:** A decision procedure grounded in philosophical literature on the sunk cost fallacy, acknowledging where philosophy ends and judgment begins.
      *   **Key Philosophical Nuance:** Must not simply say "ignore sunk costs." Must account for arguments *for* honoring sunk costs (policy integrity, past self as counterparty, epistemic value of past effort, craft acquisition, contractual/reputational reliance).
      *   **Constraints:**
          *   Fixed order of questions.
          *   Answerable from a desk in an evening.
          *   Explicit stop-points (Shelve vs. Continue vs. Judgment Call).
          *   Candid about where it's judgment vs. procedure.
          *   Run on three specific cases (Trilogy Vol 3, Abandoned First Novel, Decade-Old Literary Novel).
          *   Include at least one disliked verdict.
          *   Mark where the verdict flips based on "strict sunk-cost irrelevance" vs. "honor-the-sunk-costs."
          *   Tone: Formal, American English, authoritative (a document to be obeyed).

  2.  **Philosophical Grounding (Mental Sandbox):**

      *   *Standard View:* Sunk costs are irrelevant. Only future costs and future benefits matter. (Thaler, Kahneman, standard microeconomics).
      *   *Nuanced View:* Sunk costs *can* be relevant if they signal commitment, build reputation, or constitute a policy rule that maximizes utility over time (McClennen, Bratman on planning agency).
      *   *Contractual/Relational:* If others rely on completion (agent, publisher), the "cost" isn't just time; it's reputational capital and legal liability. This transforms sunk cost into *future* cost of breach.
      *   *Epistemic:* Past effort provides information. If I spent 5 years and it's still broken, that's data about feasibility.
      *   *Identity/Integrity:* "I am a finisher." Breaking this policy might damage future agency.

      *   *Synthesis for Procedure:* The procedure needs to isolate *Future Value* (FV) from *Past Cost* (PC). It needs to test if PC is being used as a proxy for FV (legitimate) or as a justification in itself (fallacious). It needs to separate *Internal* values (craft, joy) from *External* obligations (contracts).

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Structure:* Needs to be a checklist or flowchart style, but written as text.
      *   *Step 1: The Contractual/Relational Filter.* This is the hardest constraint. If there's a contract, it's not really a sunk cost question; it's a breach of contract question.
      *   *Step 2: The Feasibility Test.* Can it actually be fixed? (Epistemic).
      *   *Step 3: The Opportunity Cost.* What else could I do?
      *   *Step 4: The Policy Test.* Does finishing this serve my long-term identity as a writer?
      *   *Step 5: The Sunk Cost Isolation.* If I started today, would I start this?

      *   *Refining the Steps for the Prompt's Requirements:*
          *   Need explicit stop points.
          *   Need to mark where philosophy flips.
          *   Need to distinguish fact from value.

      *   *Revised Structure:*
          1.  **External Obligation Audit:** (Contracts, advances, reputation).
          2.  **Technical Feasibility Assessment:** (Is the break fixable?).
          3.  **The "Zero-Base" Inquiry:** (Would I start this today?).
          4.  **The Policy Integrity Check:** (Does quitting damage future agency?).
          5.  **The Final Weighing:** (Where judgment takes over).

  4.  **Developing the Three Cases:**

      *   *Case 1 (Trilogy Vol 3):* Contracted. 100k/110k words. Premise collapse. Needs rewrite from Act 2.
          *   *Analysis:* Contract makes it high stakes. But if premise collapses, is it feasible? Rewrite from Act 2 is huge.
          *   *Verdict:* Likely "Finish" due to contract, but philosophically shaky on artistic merit. *Wait, user wants a disliked verdict.* If the procedure says "Shelve" despite contract, that's risky. If it says "Finish" despite artistic collapse, that's pragmatic. Let's aim for the procedure to suggest "Shelve/Negotiate Exit" if the artistic cost is too high, contradicting the user's hope to just power through. Or, more likely, the procedure forces the realization that "Finishing" this specific draft is impossible, so the choice is "Rewrite (New Project)" or "Breach." Let's make the verdict: *Do not finish this draft; negotiate a release or radically reconceive.* (Disliked because they want to finish).
      *   *Case 2 (Abandoned First Novel):* 4 years ago. 60k words. Loved by author, failed by readers. Undiagnosed.
          *   *Analysis:* No contract. High emotional attachment. Negative external signal.
          *   *Verdict:* Shelve.
      *   *Case 3 (Literary Novel):* No contract. 10 years "between projects."
          *   *Analysis:* Pure sunk cost. "Between projects" is a lie.
          *   *Verdict:* Shelve.

  5.  **Refining the Philosophical Markers:**

      *   I need to explicitly state: "If you adhere to Strict Sunk Cost Irrelevance, stop here. If you adhere to Planning Agency/Policy Theory, proceed."
      *   This satisfies the requirement to show where the philosophy lives.

  6.  **Drafting the Content (Iterative refinement for tone):**

      *   *Tone:* Formal, clinical but respectful. Like a legal brief or a medical protocol.
      *   *Language:* American English.
      *   *Formatting:* Clear headings, bold text for decisions.

      *(Self-Correction during drafting)*: I need to make sure I don't just give advice. I need to give a *procedure* they can run themselves, then demonstrate it.
      *   *Procedure Section:* Define the steps clearly.
      *   *Application Section:* Run the three cases through the steps.
      *   *Philosophical Annotation:* Highlight the specific steps where the sunk cost debate matters.

      *   *Crucial Check:* The prompt asks for "questions in a fixed order... explicit stop-points."
      *   *Crucial Check:* "Mark the step or steps at which the verdict would flip if strict sunk-cost irrelevance were true."

      *   *Refining Step 3 (Zero-Base):* This is the classic sunk cost test. If the answer is "No," strict theory says stop. Nuanced theory says "Check Policy."
      *   *Refining Step 4 (Policy):* This is where the "honor the sunk cost" view enters. If I quit, do I become a quitter?

  7.  **Final Polish:**

      *   Ensure the "Disliked Verdict" is clear. (I will make the Trilogy case recommend shelving/negotiating out, as the artistic collapse makes the future cost too high relative to the benefit, despite the contract).
      *   Ensure the distinction between "Fact" and "Value" is clear in the stop-points.
      *   Check word count and density. It needs to be substantial enough to feel weighty.

  8.  **Final Review against constraints:**
      *   Formal register? Yes.
      *   American English? Yes.
      *   Decision procedure included? Yes.
      *   Three cases run? Yes.
      *   Disliked verdict included? Yes.
      *   Philosophical markers included? Yes.
      *   Candid about judgment calls? Yes.

      *(Self-Correction on Case 1)*: If there is a contract, "Shelving" implies breach. The procedure must distinguish between "Shelve and absorb penalty" vs "Finish." If the rewrite is from Act 2, is it the same book? If not, can the contract be fulfilled? I will frame the verdict as "Do not attempt to complete *this* draft; treat as a new proposal or negotiate exit." This contradicts the desire to "finish the trilogy" as currently conceived.

      *(Self-Correction on Philosophy)*: I need to be precise. The "Sunk Cost Fallacy" says past costs are irrelevant. The "Planning Agency" argument (Bratman/McClennen) says sticking to plans is rational even if local optimization suggests quitting. I will label these clearly.

      Let's write.

      *Structure:*
      1.  Preamble (Tone setting).
      2.  The Protocol (The 5 Questions).
      3.  Philosophical Annotations (Where the theory shifts).
      4.  Case Studies (The 3 scenarios).
      5.  Limitations (What this cannot do).

      *Tone Check:* "This will sit in a file I read at my lowest moments, and it should sound like a document that deserves to be obeyed." -> Authoritative, unyielding, clear.

      *Wait, one more thing:* The prompt asks for "questions in a fixed order... explicit stop-points where the procedure's output is 'shelve it' and, separately, where the procedure hands the decision back to me."
      I need to make sure the Protocol section itself has these stop points defined, not just in the case studies.

      *Okay, let's finalize the Protocol Steps:*
      1.  External Liability (Fact). Stop if High Liability -> Continue (but reframe). Stop if No Liability -> Go to 2.
      2.  Technical Viability (Fact/Judgment). Stop if Unfixable -> Shelve.
      3.  Zero-Base Preference (Psychology/Value). If No -> Go to 4 (Policy). If Yes -> Continue.
      4.  Policy Integrity (Value/Philosophy). If Quitting damages agency -> Continue. If No -> Shelve.
      5.  Final Weighing (Judgment).

      Actually, to make it cleaner:
      Q1: Obligations.
      Q2: Viability.
