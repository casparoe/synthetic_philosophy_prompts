answer: |-
  # PROTOCOL FOR MANUSCRIPT CONTINUATION ASSESSMENT

  **Version:** 1.0
  **Authority:** Derived from decision theory, planning agency philosophy, and professional publishing standards.
  **Usage:** To be executed only when a manuscript has stalled for >6 months and the author is actively considering abandonment.

  ## PREAMBLE

  This document is not a substitute for judgment. It is a scaffold designed to separate rational forward-looking considerations from irrational backward-looking rationalizations. It acknowledges that the "Sunk Cost Fallacy" (the principle that past costs are irrelevant to future decisions) is the default rational stance, but it permits exceptions where past costs constitute evidence, policy integrity, or relational reliance.

  You are required to answer the following five questions in order. Do not proceed to Question *n*+1 until Question *n* is resolved. Record your answers in writing.

  ---

  ## THE PROCEDURE

  ### QUESTION 1: The External Liability Audit
  **Query:** Are there third parties (agents, publishers, collaborators) who have incurred financial cost or reputational risk in reliance on the completion of this specific manuscript, such that abandonment triggers a quantifiable penalty or contract breach?

  *   **Sufficient Answer:** A binary "Yes" (Contract/Advance exists) or "No" (No external obligation).
  *   **Stop-Point A (If Yes):** Do not shelve. The decision is no longer "Shelve vs. Finish." The decision is "Fulfill vs. Breach." You must proceed to Question 2 to determine *how* to fulfill, or to negotiate an exit. Abandonment without negotiation is a breach of professional ethics, not a creative decision.
  *   **Stop-Point B (If No):** Proceed to Question 2.

  ### QUESTION 2: The Technical Viability Assessment
  **Query:** Based on the current text and the diagnosed problem, is the gap between the manuscript's current state and a publishable state bridgeable within a defined resource limit (e.g., 12 months, 2 drafts)?

  *   **Sufficient Answer:** A specific scope of work (e.g., "Rewrite Act 3," "Fix pacing," "Rebuild premise from Act 2").
  *   **Stop-Point C (If Unfixable):** If the defect is foundational (e.g., the premise is false, the voice is wrong) and cannot be repaired without writing a different book, **SHELVE IT.** Past effort does not make a broken premise viable. This is a fact, not a value.
  *   **Proceed:** If the work is technically feasible, proceed to Question 3.

  ### QUESTION 3: The Zero-Base Inquiry
  **Query:** If you had not written a single word of this manuscript, and the idea presented itself to you today as a new project, would you commit to writing it?

  *   **Sufficient Answer:** A clear "Yes" or "No."
  *   **Philosophical Seam 1:** **If Strict Sunk-Cost Irrelevance holds true, this is the final question.** A "No" mandates abandonment. A "Yes" mandates continuation.
  *   **Proceed:** If you answer "No," do not stop. Proceed to Question 4. This step acknowledges the *Planning Agency* argument: that your past self made a commitment your present self is bound to honor for the sake of long-term rationality.

  ### QUESTION 4: The Policy Integrity Check
  **Query:** Does abandoning this project violate a standing policy of your professional life (e.g., "I finish contracted trilogies," "I do not quit at 80,000 words") such that violating it would degrade your ability to complete future work?

  *   **Sufficient Answer:** An assessment of whether this abandonment is an *exception* or a *precedent*.
  *   **Stop-Point D (If Precedent):** If quitting this establishes a habit of quitting when work becomes difficult, and you judge that habit to be more costly than the time lost finishing this book, **CONTINUE.** Here, you are honoring the sunk cost not because the cost matters, but because the *policy* matters.
  *   **Stop-Point E (If Exception):** If this is a singular anomaly (e.g., "I finish everything, except structurally broken drafts"), proceed to Question 5.

  ### QUESTION 5: The Final Weighing (Judgment Call)
  **Query:** Weighing the Opportunity Cost (what else could you write in the time required to fix this) against the Completion Value (craft gained, reputation maintained, closure achieved), is the net utility positive?

  *   **Sufficient Answer:** A decision.
  *   **Note:** This step is not philosophical. It is managerial. There is no correct answer here, only a responsible one.
  *   **Output:** **CONTINUE** or **SHELVE**.

  ---

  ## PHILOSOPHICAL ANNOTATIONS

  **On Question 1 (Liability):**
  This step bypasses the sunk cost fallacy entirely. If a publisher has paid an advance, that money is sunk for *them*, but for *you*, the obligation to repay or deliver is a *future* cost. Continuing to write is not honoring a sunk cost; it is avoiding a future penalty. This is standard rational choice theory.

  **On Question 3 (Zero-Base):**
  This is the boundary line.
  *   **View A (Strict Sunk-Cost Irrelevance):** If the answer is "No," you must shelve. The time already spent is gone. Spending more time on something you wouldn't start today is irrational.
  *   **View B (Planning Agency/Resolute Choice):** If the answer is "No," you may still continue. Philosophers like Edward McClennen and Michael Bratman argue that agents who can bind themselves to plans over time achieve better outcomes than agents who re-optimize at every moment. If you value being "the kind of writer who finishes," you may override the Zero-Base "No."
  *   **The Seam:** If you shelve a project because of Question 3, you are a Strict Irrelevance theorist. If you continue past a Question 3 "No" because of Question 4, you are a Planning Agency theorist.

  **On Question 4 (Policy):**
  This is where "honor the sunk cost" is rehabilitated as "honor the policy." You are not valuing the past years; you are valuing the future utility of a reliable self-conception. However, be candid: if the policy is "I never shelve anything," the policy is irrational. The policy must be defeasible.

  ---

  ## CASE APPLICATIONS

  ### CASE 1: The Contracted Trilogy (Volume 3)
  **Status:** 100k/110k words. Contracted. Advance paid.
  **Diagnosis:** Premise collapse in final act. Requires rewrite from Act 2 onward.

  *   **Q1 (Liability):** **Yes.** Contract and advance exist. Abandonment is breach.
      *   *Result:* Proceed to Q2. Cannot shelve without negotiation.
  *   **Q2 (Viability):** **Borderline.** Rewriting from Act 2 is effectively writing a new novel (approx. 60k words). However, it is technically possible within a year.
      *   *Result:* Proceed to Q3.
  *   **Q3 (Zero-Base):** **No.** If you had this premise today, you would not sign a contract for it. You know the premise collapses.
      *   *Philosophical Seam:* Under Strict Sunk-Cost Irrelevance, you should stop here and negotiate a release. You are throwing good time after bad.
  *   **Q4 (Policy):** **Mixed.** Your policy is "I finish trilogies." However, your policy is also "I do not publish broken books."
      *   *Result:* Proceed to Q5.
  *   **Q5 (Final Weighing):** The cost is one year of life. The benefit is fulfilling a contract vs. publishing a book you know is flawed.
      *   **VERDICT:** **DO NOT FINISH THIS DRAFT.**
      *   **Reasoning:** While Q1 prevents simple abandonment, Q2 and Q3 reveal that "finishing" is a mirage. You cannot finish *this* book; you can only write a *new* book that occupies the same contractual slot. The procedure dictates you contact your editor immediately. Do not attempt to patch the premise. Propose a replacement manuscript or negotiate a buyout.
      *   **Disliked Outcome:** You wanted license to "power through" and finish the trilogy as conceived. The procedure denies this. It identifies the effort as a sunk cost trap disguised as professional duty. The rational move is to treat the contract as the constraint, not the draft.

  **What the Procedure Cannot Do:** It cannot guarantee the publisher will accept a new proposal. It cannot remove the shame of admitting the premise failed.

  ### CASE 2: The Abandoned First Novel
  **Status:** 60k words. 4 years ago. No contract.
  **Diagnosis:** Author loves it; two trusted readers failed to finish. Undiagnosed flaw.

  *   **Q1 (Liability):** **No.** No external obligation.
      *   *Result:* Proceed to Q2.
  *   **Q2 (Viability):** **No.** You have been unable to diagnose the flaw for four years. Two external readers confirm the experience is non-viable (DNF). If the flaw were technical, it would be visible. It is likely foundational.
      *   *Result:* **STOP-POINT C.**
      *   **VERDICT:** **SHELVE IT.**
      *   **Reasoning:** This is a fact-based termination. The text does not work. The inability to diagnose it after four years is data: you currently lack the craft to fix it, or it is unfixable.
      *   **Philosophical Note:** Sunk cost is irrelevant here. Even if you loved it, the viability test fails.

  **What the Procedure Cannot Do:** It cannot stop you from grieving the loss of the story. It cannot tell you if you will be able to cannibalize parts of it for future work (you probably will).

  ### CASE 3: The Decade-Old Literary Novel
  **Status:** Half-finished. No contract. No advance.
  **Diagnosis:** "Between projects" for 10 years.

  *   **Q1 (Liability):** **No.**
      *   *Result:* Proceed to Q2.
  *   **Q2 (Viability):** **Unknown.** You have not looked at it seriously in a decade.
      *   *Result:* Proceed to Q3.
  *   **Q3 (Zero-Base):** **No.** You have not returned to it in 10 years despite "between projects" time. Your behavior reveals your preference.
      *   *Philosophical Seam:* Strict Irrelevance says Shelve immediately.
  *   **Q4 (Policy):** **No.** You have no policy of finishing uncontracted literary novels from a decade ago. In fact, your policy seems to be "I work on what excites me."
      *   *Result:* Proceed to Q5.
  *   **Q5 (Final Weighing):** Opportunity cost is high (current work). Completion value is low (no market, no drive).
      *   **VERDICT:** **SHELVE IT.**
      *   **Reasoning:** The "between projects" narrative is a sunk-cost rationalization. You are keeping it alive to preserve the identity of "the writer of that book," not because the book has future value.

  **What the Procedure Cannot Do:** It cannot tell you if shelving this kills a part of your artistic identity. That is a psychological cost, not a rational one.

  ---

  ## LIMITATIONS AND SEAMS

  **1. The Epistemic Value of Sunk Costs**
  This procedure treats past effort primarily as data (Q2: Viability). It acknowledges that five years of struggle *might* mean the project is hard, but it defaults to the interpretation that five years of struggle means the project is broken. If you believe your past self possessed unique insight that your present self has lost, the procedure underweights this. You must manually adjust Q2 if you have concrete evidence that the "collapse" is a temporary loss of knowledge rather than a structural flaw.

  **2. The Definition of "Policy"**
  In Q4, the procedure relies on your honesty about your policies. If you lie to yourself ("I am a finisher" when you are actually a dabbler), the procedure will generate a false positive for continuation. The rigor of this step depends entirely on your willingness to define your policies narrowly. A policy of "I finish everything" is irrational. A policy of "I finish contracted work" is rational. Ensure your policy is the latter.

  **3. The Emotional Cost of Abandonment**
  The procedure treats "emotional pressure" as noise to be filtered. It does not account for the psychological damage of shelving a work you love. In rare cases, the therapeutic value of finishing a broken book (craft acquisition, closure) may outweigh the economic or reputational logic. This is a value judgment located in Q5. The procedure cannot calculate the worth of your peace of mind.

  **4. The Philosophical Flip**
  Be aware: If you adopt **Strict Sunk-Cost Irrelevance**, Case 1 (Trilogy) likely becomes a negotiation for release rather than a rewrite. You would only continue if the *future* book (the rewrite) is something you would start today.
  If you adopt **Planning Agency**, you may continue Case 1 even if you wouldn't start it today, provided that quitting damages your long-term capacity to commit.
  The procedure defaults to **Planning Agency** in Q4, allowing you to continue despite a Q3 "No," but it forces you to explicitly justify that choice as a policy decision, not a creative one.

  ## FINAL INSTRUCTION

  Print this document. When the question arises, sit at your desk. Answer the five questions. If the verdict is "Shelve," close the file. Do not reopen it for six months. If the verdict is "Continue," set a deadline for the next milestone. If you miss that deadline, the Protocol resets, and you must begin again at Question 1.

  You are not your past work. You are the agent responsible for your future time. Act accordingly.
