  # Epistemological Diagnostic Tree: Classical Indian Philosophy

  **Instructions:** Start at the top. Answer each question based on your intuition about the case. Follow the branch that matches your judgment until you reach a school label.

  ### **START: The Smoke on the Hill**
  **Case:** Smoke rises from a distant hill. Are you entitled to conclude there is fire there?
  *   **NO:** You cannot verify that connections observed in some cases hold in unobserved ones. Only perception is valid.
      *   ➔ **CĀRVĀKA (Materialism)**
  *   **YES:** Inference is a valid source of knowledge (*pramāṇa*).
      *   ➔ **Go to Question 2**

  ---

  ### **Q2: The Doctor's Word**
  **Case:** A reliable doctor tells you your test results are fine. Does her word settle the matter directly?
  *   **NO:** You are only entitled because you *infer* her reliability; testimony is not autonomous.
      *   ➔ **BUDDHIST LOGICIANS (Dignāga/Dharmakīrti)**
  *   **YES:** Testimony operates as an autonomous source of knowledge.
      *   ➔ **Go to Question 3**

  ---

  ### **Q3: The Fat Man Who Doesn't Eat**
  **Case:** A man is fat but never seen eating by day. Is concluding he eats at night a distinct judgment?
  *   **NO:** This is just one more inference about him (reducible to standard logic).
      *   ➔ **NYĀYA-VAIŚEṢIKA**
  *   **YES:** This requires its own source, postulation (*arthāpatti*), to resolve the conflict.
      *   ➔ **Go to Question 4**

  ---

  ### **Q4: The Absent Pot**
  **Case:** You say, "There is no pot on the table." Is this a finding that needs its own source?
  *   **NO:** This is either perception of the empty table or a report about your own cognition (no separate source needed).
      *   ➔ **MĪMĀṃSĀ (PRĀBHĀKARA)**
  *   **YES:** This requires non-apprehension (*anupalabdhi*), a separate source for knowing absence.
      *   ➔ **Go to Question 5**

  ---

  ### **Q5: The Shell-Silver Error**
  **Case:** You mistake a shell for silver. When the mistake comes apart, what went wrong?
  *   **MISJOINING:** A real silver seen elsewhere was misjoined to what is present (positive error).
      *   ➔ **MĪMĀṃSĀ (BHĀṬṬA)**
  *   **IGNORANCE:** Nothing real corresponded to the silver; the mistake is rooted in beginningless ignorance (*avidyā*).
      *   ➔ **ADVAITA VEDĀNTA**

  ***

  ## Logical Space & Diagnostic Notes

  **1. Mapping the Schools**
  This tree maps the six schools into the logical space generated by the five cases. Each school occupies a unique "leaf" (endpoint), meaning **all six positions are distinguishable** using this specific set of cases. The primary dividers are:
  *   **Inference (Case 2):** Separates Cārvāka from all others.
  *   **Testimony (Case 2):** Separates Buddhists (reductionist) from theists/orthodox (autonomous).
  *   **Postulation (Case 3):** Separates Nyāya (reductionist) from Mīmāṃsā/Advaita (expansionist).
  *   **Absence (Case 4):** Separates Prābhākara (restrictive) from Bhāṭṭa/Advaita (expansive).
  *   **Error (Case 5):** Separates Bhāṭṭa (realist error) from Advaita (ontological error).

  **2. Unoccupied Combinations**
  Not every combination of answers corresponds to a historical school.
  *   **Unoccupied Path:** Yes (Inference) → Yes (Testimony) → Yes (Postulation) → Yes (Non-apprehension) → **No Falsity (Prābhākara Error)**.
  *   **Diagnosis:** **Incoherent/Unattractive.** This combination accepts *anupalabdhi* (knowing absence as a positive fact) but denies that error involves misapprehending reality (the Prābhākara view). Historically, schools that accept non-apprehension as a distinct source usually acknowledge positive error, making this hybrid theoretically unstable.

  **3. Limitations of the Instrument**
  *   **Nyāya vs. Bhāṭṭa on Error:** While separated here by Postulation (Case 3), these two schools hold nearly identical views on Error (Case 5). If a student accepts Postulation as autonomous (Bhāṭṭa) but holds the Nyāya view on Error, the tree still correctly identifies them as Bhāṭṭa based on the Postulation commitment.
  *   **Prābhākara vs. Nyāya on Absence:** Both reject *anupalabdhi*. They are separated entirely by their stance on Postulation (Case 3). If a student holds the Nyāya view on Postulation but the Prābhākara view on Absence, they land on Nyāya, which is historically accurate enough for survey purposes.
  *   **No Sanskrit Knowledge Required:** The tree relies on intuitions about concrete cases (doctors, smoke, pots) rather than definitions of technical terms, allowing students to locate their own commitments before learning the school names.
