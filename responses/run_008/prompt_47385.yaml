  ### 1. Diagnosis: The Duplication Principle

  Maya appears to operate on a rule that can be summarized as: **"Anthropic evidence only updates credence when there is indexical uncertainty among subjectively indistinguishable copies."**

  *   **Sleeping Beauty & Clones:** In both cases, there are multiple instantiations of *her specific perspective* (or a clone indistinguishable from her). On Tails/Two-Clone, there are two "Mayas"; on Heads/One-Clone, there is one. She updates 2:1 in favor of the scenario with more copies. This looks like SIA.
