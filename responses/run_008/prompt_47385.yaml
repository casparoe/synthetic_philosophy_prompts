  *   **Aliens/Crowded Universe:** Similarly, a universe with more *aliens* does not create more *Mayas*. Since the number of observers subjectively identical to her remains one in both the Sparse and Crowded models, she sees no reason to favor the Crowded one. This rejects the "Presumptuous Philosopher" implication of standard SIA.

  **The Verdict:** She is not a standard SIA-ist (who would favor the Crowded universe) nor a standard SSA-ist (who would favor the Sparse universe, as explained below). She is a **Restricted SIA-ist**.

  ### 2. Dev's Case: Do the Rules Come Apart?

  Yes, the two rules you mentioned (Standard SIA vs. SSA with Inclusive Reference Class) come apart dramatically on Dev's case, and Maya's answer will likely diverge from *both*.

  *   **Standard SIA:** Weights hypotheses by the total number of observers.
      *   Model B (Crowded) has $10^{12}$ times more observers.
      *   **Verdict:** Model B is a trillion times more likely than Model A. (The Presumptuous Philosopher).
  *   **SSA (Inclusive Reference Class = All Observers):** Weights hypotheses by the probability of sampling *you* specifically from the total pool.
      *   In Model A (Sparse), you are 1 in a million. In Model B (Crowded), you are 1 in a trillion trillion.
      *   It is vastly more surprising to find yourself as "Maya" in the Crowded universe.
      *   **Verdict:** Model A (Sparse) is a trillion times more likely than Model B. (The Inverse Presumptuous Philosopher).
  *   **Maya's Likely Rule (Restricted SIA):** Weights hypotheses by the number of *copies of you*.
      *   There is one Maya in Model A. There is one Maya in Model B.
      *   **Verdict:** **50/50.** No update.

  **Prediction:** Maya will tell Dev to stick with the **50/50 prior**.

  **Reasons:** Her comment that she "doesn't see why existence should count in favor of a crowded universe" is the smoking gun. Standard SIA says existence *does* count. SSA says existence counts *against* the crowded universe (because it dilutes your probability). Maya's rejection of the positive pressure, combined with her rejection of Doomsday (negative pressure based on rank), implies she rejects the counting of *other* observers entirely. She only counts *copies*. Since Dev's models don't change the number of Mayas, she won't change her credence.

  ### 3. The Discriminating Question

  Your proposed question is excellent and cuts to the heart of the Reference Class problem.

  > *"If you learned for certain that humans are the only observers that ever exist anywhere (no aliens, no sims, nothing), would your birth rank THEN count as evidence of an early end for humanity?"*

  Here is why this works and what the answers reveal:

  **If she says "YES" (Rank counts now):**
  *   **Diagnosis:** She is an **SSA-ist with an Elastic Reference Class**.
  *   **Reasoning:** Her rejection of the Doomsday Argument earlier wasn't because she rejects SSA logic, but because she defines her reference class as "All Intelligent Observers." In that broad class, being the 100-billionth human is uninformative because there might be quadrillions of aliens. But if you remove the aliens, the reference class shrinks to "Humans." Now, being 100-billionth *is* surprising if the total is 100-trillion.
  *   **Implication for Dev:** If this is her rule, she should actually favor the **Sparse** model in Dev's case (because being Maya is less probable in the Crowded model). If she predicts 50/50 for Dev but "Yes" for this question, she is being inconsistent.

  **If she says "NO" (Rank still doesn't count):**
  *   **Diagnosis:** She is a **Restricted SIA-ist (Duplication Principle)**.
  *   **Reasoning:** She rejects the logic of sampling from a reference class entirely. For her, evidence only arises from *duplication of her perspective*. A longer human future creates more humans, but it does not create more *Mayas*. Therefore, even with no aliens, her birth rank is just a fixed fact, not a sample.
  *   **Implication for Dev:** This confirms the 50/50 prediction. She consistently ignores total observer counts unless they involve her own duplicates.

  **A Slight Refinement:**
  To make the question bulletproof, ensure she understands that in the "No Aliens" hypothetical, the *physical* laws and her *origin* remain the same; only the existence of other civilizations changes. You might phrase it:

  *"Imagine a 'Lonely Universe' scenario where physics guarantees no other conscious life exists but humans. In that specific universe, does knowing you are the 100-billionth human make an early extinction more likely than a long future?"*

  **Why this is better than asking about Dev directly:**
  Dev's case is abstract (cosmological models). The Doomsday question is personal (her own birth rank). If she is an SSA-ist, the "Lonely Universe" case forces the Doomsday conclusion she previously rejected. If she holds firm on "No," she proves her rejection of Doomsday wasn't just about reference classes, but about the fundamental logic of anthropic evidence.

