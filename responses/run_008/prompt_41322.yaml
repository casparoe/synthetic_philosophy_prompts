answer: |-
  Your intuition is spot-on. Your friend has conflated two distinct (though related) concepts that circulate in Effective Altruism (EA) and decision-theory circles: **Moral Trade** and **Moral Uncertainty**. While they often appear in the same conversations, they rely on different mechanisms and solve different problems.

  Here is the piece-by-piece breakdown of your friend's summary, with confidence flags attached to each verdict.

  ### 1. Claim: "Moral trade... rests on moral uncertainty."
  **Verdict: False.**
  **Confidence: 95%**

  **Analysis:** This is the core error in your friend's explanation.
  *   **Moral Uncertainty** is the idea that *you personally* do not know which moral theory is true (e.g., you are 60% sure utilitarianism is right, 40% sure deontology is right). You act to maximize "expected moral value."
  *   **Moral Trade** (most famously articulated by Toby Ord in 2013) is explicitly designed to work even when agents are **100% confident** in their own divergent views. It relies on the economic principle of *comparative advantage*.
  *   **How it works without uncertainty:** If you are a strict Kantian and I am a strict Utilitarian, we value different outcomes. However, I might be able to produce "Kantian value" (e.g., keeping a promise) more cheaply than you can, and you might be able to produce "Utilitarian value" (e.g., saving a life) more cheaply than I can. We trade actions to increase the total amount of "good" (according to both our separate metrics) without either of us changing our minds about which theory is true.
  *   **Why the distinction matters:** If moral trade *required* uncertainty, it would collapse into mere hedging. The radical claim of Moral Trade is that cooperation is rational even when we agree to disagree on the fundamental truth.

  ### 2. Claim: "The rational move is... splitting the difference... like you'd average two forecasts."
  **Verdict: Misleading / Category Error.**
  **Confidence: 90%**

  **Analysis:** Your friend is importing a heuristic from the **Moral Uncertainty** literature (specifically a view called *Proportionalism* or linear interpolation) and misapplying it to Moral Trade.
  *   **In Moral Uncertainty:** Some philosophers (like William MacAskill) discuss whether you should "average" your choices based on the probability weights of different theories. Even within that niche, "splitting the difference" is controversial; many argue for "My Favorite Theory" (just follow the one you think is most likely) or "My Favorite Option" (maximize expected choiceworthiness, which isn't always a simple average).
  *   **In Moral Trade:** The goal is not to find a middle-ground *principle* (a blended ethics). The goal is to find a **Pareto improvement**. We don't agree to "half-utilitarianism"; I agree to do X for you, and you agree to do Y for me. The mechanism is bargaining and exchange rates, not averaging forecasts.
  *   **The Risk:** "Splitting the difference" implies both sides dilute their integrity. Moral Trade implies both sides *achieve more* of what they actually value by leveraging the other person's labor/resources.

  ### 3. Claim: "Does the view have anything to say to people who are fully confident in their ethics?"
  **Verdict: Yes, that is the primary audience.**
  **Confidence: 95%**

  **Analysis:** As noted in point #1, Moral Trade is most potent when preferences are fixed and known.
  *   In economics, trade is hardest when agents are unsure what they want. Similarly, in Moral Trade, if I am unsure whether I value animal welfare or human welfare, it is hard for me to negotiate a deal with you.
  *   If I am 100% committed to Animal Rights and you are 100% committed to Global Health, we can calculate an exchange rate (e.g., "I will donate to your malaria fund if you stop eating meat for a month").
  *   **Nuance:** The view *does* require that we can compare values across theories (inter-theoretic comparison). We have to agree that "1 unit of Kantian duty" is worth "X units of Utilitarian welfare" for the trade to execute. But this is a technical hurdle, not a requirement for internal uncertainty.

  ### 4. Claim: "This is basically what philosophers now agree we should all be doing."
  **Verdict: Wildly False.**
  **Confidence: 99%**

  **Analysis:** This is a classic example of "EA bubble" thinking.
  *   **Mainstream Ethics:** The vast majority of academic moral philosophers have never engaged with the concept of Moral Trade. Many would reject the premise that moral obligations are tradable commodities. A Kantian might argue that duties are categorical and cannot be bargained away; a Virtue Ethicist might argue that trading actions corrupts the moral character of the agent.
  *   **EA Community:** Even within Effective Altruism, Moral Trade is a niche proposal. It is discussed by decision theorists and global priorities researchers, but it is not a settled norm. There is active debate about whether it is permissible, obligatory, or incoherent.
  *   **Consensus:** There is no consensus in philosophy that we should "meet in the middle." Most ethicists still argue for the correctness of their specific theory, not for a negotiated compromise between theories.

  ### Summary of the Confusion
  Your friend described **Moral Uncertainty** (hedging bets because you don't know the truth) but labeled it **Moral Trade** (gains from cooperation despite knowing the truth).
  *   **Your Intuition:** You were right to suspect it was about "gains from trade between people who each fully hold their own view." That is the actual definition of Moral Trade.
  *   **The "Tidy" Feeling:** The reason your friend's version sounded "tidy" is that averaging forecasts is mathematically simpler than negotiating complex bargains based on incommensurable values. But the simplicity comes at the cost of accuracy.

  ***

  ### Least Sure Claim
  You asked me to identify the specific claim in this answer where I am on the shakiest ground.

  **Claim:** *"In Moral Uncertainty... 'splitting the difference' is controversial; many argue for 'My Favorite Theory'... or 'My Favorite Option'."*
  **Confidence:** **80%**

  **Why this is shaky:** While I am confident that "splitting the difference" is not the consensus in moral uncertainty, the landscape of that specific sub-field is fast-moving and highly technical. The terminology ("Proportionalism," "Linear Interpolation," "Expected Choiceworthiness") is sometimes used loosely even by proponents. There is a non-zero chance that in casual EA discourse (which your friend is part of), the term "Moral Trade" is occasionally used as a catch-all slang for *any* strategy involving multiple moral theories, including uncertainty-based hedging. While technically incorrect based on the seminal papers (Ord vs. MacAskill), the social reality of the community might blur the lines more than the academic literature does. I am less confident in mapping the *sociological* usage of the terms in the community than I am in the *philosophical* definitions.
