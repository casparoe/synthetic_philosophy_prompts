answer: |-
  You have identified a genuine and crucial distinction that professional philosophers and sociologists wrestle with, but which gets flattened in everyday conversation. You are right to be frustrated by "social construct" being used as a catch-all; it obscures the difference between a *shared delusion* (Type 1) and a *structural reality* (Type 2).

  There isn't one single magic word that everyone agrees on, but there are three specific terms from different traditions that carve out exactly the territory you are describing.

  ### 1. The Philosophical Term: "Institutional Fact"
  The philosopher John Searle, who wrote the definitive book on this (*The Construction of Social Reality*), distinguishes between **Brute Facts** (mountains, gravity) and **Institutional Facts** (money, property, marriage).

  Type 1 (rumors, fads) are what Searle might call *collective intentionality* without a status function. They exist only as long as the belief persists.
  Type 2 (money, race, borders) are **Institutional Facts**.

  The specific mechanism that makes Type 2 inescapable is what Searle calls **Deontic Power**.
  *   **Type 1** relies on *belief*. If you stop believing the rumor, it no longer affects your behavior.
  *   **Type 2** relies on *status functions* that create rights, duties, and obligations. These exist independently of your personal belief.

  When you hold a dollar bill, it has the status "money." This status carries *deontic power*: it gives you the right to buy goods and imposes a duty on the shopkeeper to accept it. You cannot opt out of this duty unilaterally. The fact is "ontologically subjective" (it only exists because we created it) but **epistemically objective** (it is true regardless of your opinion).

  **The Term:** **Institutional Fact** (specifically one endowed with **Deontic Power**).

  ### 2. The Sociological Term: "Social Fact" (Durkheimian)
  Before Searle, the sociologist Émile Durkheim made the exact distinction you are noticing. He defined a **Social Fact** not as "anything people do together," but specifically as a way of acting that is:
  1.  **External** to the individual (it exists before you are born and after you die).
  2.  **Coercive** (it exerts pressure on you to conform).

  A fad (Type 1) is not a Durkheimian Social Fact; it is a fleeting collective sentiment.
  Race, money, and law (Type 2) *are* Durkheimian Social Facts. They "grip you from the outside," as you put it. Durkheim emphasized that these facts possess **exteriority** and **constraint**. If you try to violate them, you face sanctions (legal, economic, or social) that feel as physical as hitting a wall.

  **The Term:** **Coercive Social Fact** (or simply **Social Fact** in the strict Durkheimian sense).

  ### 3. The Critical Theory Term: "Structural Kind"
  In contemporary philosophy of race and gender (e.g., Sally Haslanger, Charles Mills), scholars distinguish between *discursive constructs* (ideas we talk about) and **Structural Kinds** (material realities enforced by systems).

  *   **Type 1** is a *cultural construct* or *discursive kind*. It lives in our heads and conversations.
  *   **Type 2** is a *structural kind*. It is embedded in institutions, laws, and physical arrangements.

  Haslanger argues that race is not just a "social construct" in the sense of being an idea; it is a **social structure**. You can stop believing in race, but you cannot stop being *racialized* by the structure. The structure operates independently of your internal belief state.

  **The Term:** **Structural Kind** (or **Materialized Construct**).

  ### The "Carving" You Asked For
  If you want to be precise about the line between the two, here is the philosophical carving:

  1.  **Dependence:** Both depend on humans. (Ontologically Subjective).
  2.  **Independence:** Type 2 is independent of *your* individual attitude. (Epistemically Objective).
  3.  **Mechanism:** Type 1 works via *causation of belief*. Type 2 works via *constitutive rules* and *enforcement*.
  4.  **Opt-out:** Type 1 allows private opt-out. Type 2 allows only collective opt-out (and often not even then, due to path dependence).

  ### Recommendation
  If you need a single term to use in conversation that signals you know the difference:

  *   Use **Institutional Fact** if you are talking about money, borders, or property. It signals you understand the *rules-based* inescapability.
  *   Use **Structural Fact** (or **Structural Reality**) if you are talking about race, class, or gender. It signals you understand the *power-based* inescapability.
  *   Use **Reified Fact** if you want to describe the *process* by which a Type 1 idea hardens into a Type 2 reality. **Reification** is the process of treating an abstract social relation as if it were a concrete thing. Once a construct is reified, it hits you like a brick.

  **Summary:** The distinction is real. Type 1 are **Conventions**; Type 2 are **Institutions** (or **Structures**). The specific quality of being "jointly created but individually inescapable" is **Epistemic Objectivity** grounded in **Deontic Power**.
