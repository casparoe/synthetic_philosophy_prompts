answer: |-
  Looking at the bundle of practices we currently have in place, from the grandfathered Grammarly exception to the mandatory AI tutor for quizzes, the policy does not actually rest on a single coherent theory of learning but rather on a fragmented assumption about where cognitive labor resides in the writing process. The implicit theory seems to be that writing is constitutive of understanding, but only at the level of argumentation and structure, not at the level of syntax and mechanics. By allowing Grammarly and spellcheck while banning LLM drafting, the policy presupposes that the student has already generated the core philosophical content—the claims, the objections, the reasoning—and that the tool is merely assisting in the transmission of that pre-existing thought. This draws a bright line between encoding and generating. It assumes that when a student uses Grammarly, the understanding is already formed and is simply being polished, whereas when a student uses an LLM to draft, the understanding is being outsourced. This is why the calculator analogy fails to capture the whole picture; the policy treats grammar like arithmetic, something mechanical that can be offloaded without losing the core competency, but it treats argument construction like the math itself, the thing that must be done manually to prove competence.

  However, the introduction of the university licensed AI tutor for practice quizzes complicates this constitutive view significantly. If writing is where understanding gets formed, and offloading writing offloads learning, then using an AI tutor to guide answers on practice quizzes should theoretically undermine the learning process just as much as using an LLM to write the essay. The fact that the department encourages this suggests a second implicit theory running parallel to the first, which is that writing is primarily a measurement of understanding formed elsewhere. Under this view, the ban on LLMs in essays is not necessarily because using them prevents learning, but because using them prevents us from verifying that learning occurred. The essay becomes a proctored exam in written form. The AI tutor is permissible in the practice zone because that is the learning phase, where scaffolding is acceptable, but the essay is the assessment zone, where scaffolding becomes cheating. This creates a tension where the policy simultaneously claims that writing is the process of learning (hence the ban on generative tools during the process) and that writing is the proof of learning (hence the ban on generative tools during the assessment). The policy tries to have it both ways, asserting that the struggle of writing is necessary for growth while also treating the final paper as a secure container for measuring that growth.

  This tension is where the disclosure clause quietly collapses. The requirement that students report any AI assistance assumes that there is a clear, binary distinction between human work and AI work, but the Grammarly exception proves that this distinction is porous. Grammarly is generative in many instances; it suggests rewrites that change tone, clarity, and sometimes meaning. If a student accepts a Grammarly suggestion that rephrases a clumsy sentence into a sophisticated one, they have received AI assistance in forming the final output. By not requiring disclosure for Grammarly, the policy normalizes a certain level of undisclosed AI intervention. This makes the disclosure clause for LLMs less about transparency and more about policing a specific threshold of generativity that is technically arbitrary. If the goal were true transparency regarding cognitive offloading, Grammarly sessions would need to be logged and reported just like LLM chats. The fact that they are not suggests the disclosure clause is not actually about knowing how much help was received, but about signaling that the student did the heavy lifting of argumentation. It collapses under scrutiny because it asks students to police a boundary that the department itself has already blurred by exempting tools that perform similar functions at a lower level of abstraction.

  If we were to openly adopt the pure output-based view, the policy would look radically different and would likely resemble a professional editorial contract rather than an academic honor code. Under a strict output-based view, the only thing that matters is the quality and integrity of the final text. The policy would allow students to use any tool available, including LLMs for drafting, provided the final work is accurate, cited, and meets the assignment criteria. The focus would shift from how the work was produced to whether the work stands on its own merits. We would stop asking students to disclose their process and start asking them to take responsibility for the content. If an student submits an essay generated by an AI that contains hallucinated citations or shallow reasoning, they receive a poor grade not because they cheated, but because the product is defective. This aligns with how the professional world treats writing, where the origin of the text is less important than its utility and truthfulness.

  However, switching to this output-based view would entail a significant loss for an introductory philosophy course specifically. The primary thing we would lose is the guarantee of cognitive development. In a professional setting, the goal is the deliverable; in an educational setting, the goal is the transformation of the student mind. If we allow the output to be fully offloaded, we sever the link between the grade and the student's actual philosophical ability. A student could graduate with high marks having never struggled through the formulation of a counterargument, which is precisely the skill the course is meant to develop. The current policy, despite its inconsistencies, is trying to protect the struggle. It is trying to ensure that the grade reflects the student's capacity to think, not just their capacity to prompt. The messiness of the current rules arises because we are trying to navigate a transition where tools are becoming capable of doing the very thing we are trying to teach. The policy is effectively a attempt to preserve the pedagogical value of friction—the idea that the resistance encountered while writing is where the learning happens—while acknowledging that some friction, like spelling errors, is merely noise. The disclosure clause fails because it tries to regulate this friction transparently without defining what counts as productive struggle versus mere obstruction, but the ban on LLM drafting remains consistent with the goal of ensuring that the student, and not the machine, is the one doing the philosophizing.
