  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Don't just say "Quasiparticles." Simmballs are *stable patterns*. In non-equilibrium stat mech, these are **Dissipative Structures**. But that's too niche. Stick to **Collective Variables** in an EFT.
