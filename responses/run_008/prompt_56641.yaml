answer: |-
  **Project Title:** The Aggregation Problem for the Procreation Asymmetry

  **Project Summary**
  This project investigates a tension in contemporary population ethics. Many philosophers accept the "procreation asymmetry": we have a reason not to create a child whose life would be miserable, but no corresponding reason to create a child whose life would be happy. However, when this asymmetry is combined with standard principles of aggregation, it risks collapsing into a suffering-focused axiology, where preventing suffering outweighs producing happiness to an extreme degree. Most ethicists accept the asymmetry but reject this extreme conclusion. This project asks whether there is a principled, non-arbitrary stopping point between these two positions. Over three months, I will construct a series of comparative cases to test whether a moderate position is logically stable or whether accepting the asymmetry commits one to a stronger negative view than is commonly admitted.

  **Research Question**
  Is there a consistent intermediate position between accepting the procreation asymmetry and accepting a strong suffering-focused axiology?

  To be precise: Can one maintain that (a) creating a miserable life is wrong while creating a happy life is neutral, and (b) happiness and suffering aggregate in a standard way across populations, without being forced to conclude that preventing suffering lexically outweighs producing happiness in all other contexts? If such a position exists, where is the boundary? If it does not exist, which of the underlying commitments must be dropped to restore consistency?

  **Background and Motivation**
  The procreation asymmetry is widely intuitively appealing. It captures the thought that we should make people happy rather than make happy people. Total utilitarianism rejects this asymmetry, counting happy lives as positive value, but this leads to the "repugnant conclusion." Person-affecting views preserve the asymmetry by claiming an act can only be bad if it is bad for someone, but this struggles with non-identity problems and cases where we intuitively feel we should improve existing lives even if no specific person is harmed by not doing so.

  On the other end of the spectrum, strong negative utilitarianism accepts the heavy weight of suffering but implies that painlessly ending humanity would be good if it prevents future suffering. Most philosophers want a view in the middle: suffering matters more than happiness in creation cases, but happiness still matters enough to avoid the extinction conclusion.

  Currently, this middle ground is under-theorized. In seminar discussions, defenders of the asymmetry often admit they cannot specify where the special weight of suffering stops applying. They gesture toward the extreme implications of negative utilitarianism as a reductio, but do not explain why the logic of the asymmetry does not lead there. This project aims to fill that gap. It does not aim to solve population ethics broadly, but to test the stability of one specific, widely held cluster of intuitions.

  **Methodology**
  This is a conceptual project requiring no empirical data. The work will proceed by constructing a "ladder of cases" to test for reflective equilibrium. I will evaluate whether judgments remain consistent as variables shift. The cases will vary along three dimensions:

  1.  **Creation vs. Improvement:** Does the special weight of suffering apply only to bringing new people into existence, or also to improving the lives of existing people? If it applies only to creation, what principled difference explains this?
  2.  **Magnitude Trade-offs:** At what point does a large amount of happiness outweigh a small amount of suffering? I will test cases involving small suffering vs. huge happiness, and many small happinesses vs. one large suffering.
  3.  **Life Composition:** How do we evaluate lives that are mostly good but contain significant bad periods? If the asymmetry holds, does the bad part vetoes the good part in evaluation, or do they sum?

  I will work through these cases systematically. For each step on the ladder, I will check if the judgment aligns with the procreation asymmetry without triggering the extreme implications of negative utilitarianism. If a judgment shifts arbitrarily (e.g., suffering matters more at 10 units of happiness but not at 11), I will treat this as evidence that the position is unstable.

  **Timeline**
  *   **Month 1:** Case construction. I will draft the specific scenarios and variables, ensuring they isolate the relevant moral principles without confounding factors.
  *   **Month 2:** Analysis. I will work through the cases, testing different theoretical responses (e.g., lexical thresholds, discounting rates, person-affecting restrictions) to see if any successfully block the slide toward suffering-focused axiology.
  *   **Month 3:** Writing. I will draft the paper, focusing on clarity and argument structure. The goal is a manuscript ready for submission to a general ethics journal.

  **Expected Outcomes and Contingencies**
  The ideal outcome is to identify a principled stopping point—a specific condition under which the asymmetry applies but aggregation returns to normal. This would provide a defense for moderate views that currently lack one.

  However, I anticipate a significant risk: the analysis may show that there is no non-arbitrary line. It may turn out that the intuitions supporting the asymmetry are vague all the way down, or that they are logically incompatible with moderate aggregation.

  If this is the case, the project will not fail. Instead, the output will shift from defending a moderate position to mapping the incompatibility. I will demonstrate which pairs of intuitions cannot be jointly held. This is a valuable negative result: it shows that philosophers cannot hold the procreation asymmetry, standard aggregation, and moderate conclusions simultaneously. They must explicitly drop one. This clarifies the dialectic and forces a choice between revising the asymmetry or accepting a more radical axiology.

  **Feasibility**
  This scope is realistic for a single researcher over three months. It requires no archival work, no travel, and no empirical surveying. The primary resource required is uninterrupted time for conceptual analysis and writing. As a second-year PhD student, I have the necessary background in normative ethics to conduct this analysis without extensive additional training.
