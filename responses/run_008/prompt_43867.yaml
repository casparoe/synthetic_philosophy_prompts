answer: |-
  This is a strong, compelling core for an essay. You are effectively triangulating between moral philosophy, behavioral economics, and the phenomenology of fiction.

  To answer your primary concern: **Yes, the philosophical core holds up,** but there are three specific pressure points where a philosopher (or a careful reader) might push back. If you reinforce those joints, the argument will be robust.

  Here is the breakdown of your three specific questions, followed by a few conceptual tweaks to tighten the machinery.

  ### 1. Does the "successive-selves" framing follow from Hyperbolic Discounting (HD)?
  **Verdict:** Yes, but it is a specific *interpretation* of HD, not the only one.

  You are not just borrowing a curve to license a metaphor; you are aligning with a specific school of thought in the philosophy of action. The economist **George Ainslie** (specifically in *Breakdown of Will*) argues exactly what you are arguing: that hyperbolic discounting creates time-inconsistent preferences so severe that we must model the agent as a succession of competing "selves" to make sense of the behavior.

  **The Philosophical Nuance:**
  Strictly speaking, HD describes a *preference structure*, not a metaphysical splitting of the soul. A standard economist might say, "It is one agent with a dynamically inconsistent utility function." A philosopher might say, "It is one agent suffering from a failure of rationality."
  By claiming the selves are "barely the same person," you are making a stronger claim than the math requires. You are moving from *functional fragmentation* (my preferences flip) to *ontological fragmentation* (I am different people).

  **Recommendation:**
  You don't need to walk this back, but you should acknowledge it as a choice. Phrase it as: *"Hyperbolic discounting provides the mechanism that makes the novelist's intuition literal."* If you present the "successive selves" as the *only* interpretation of HD, an economist might object. If you present it as the interpretation that best explains the *experience* of akrasia (which is your lane as a novelist), you are on solid ground.

  ### 2. Is there a standard name for the view you are resisting?
  **Verdict:** There isn't one single catchy "-ism," but you are resisting a conclusion often drawn from **Personal Identity Reductionism**.

  The view you are describing—that if the selves are distinct, blame dissolves—is a consequence of taking a **Parfitian** view of personal identity (named after Derek Parfit). Parfit argued that "personal identity" is just a matter of psychological connectedness. If the Evening Self has weak psychological connectedness to the Morning Self (different desires, different priorities), then, morally, they are like two different people. If they are two different people, the Evening Self isn't responsible for the Morning Self's promises.

  You are resisting the idea that **Explanation entails Exoneration.**
  In philosophy of action, this is sometimes called the **"Exculpatory Fragmentation"** view. You are arguing against the idea that *akrasia* is merely a **coordination failure** between neutral parties. You want to maintain that it is a **normative failure** of a single agent.

  **Recommendation:**
  You don't need to name-drop Parfit, but be aware that your opponent is the idea that *time-slices* absolve responsibility. Your counter-argument is that **agency is diachronic** (it stretches across time). The "Morning Self" isn't just a different voter; it is the *trustee* for the agent's long-term identity.

  ### 3. Is the "Legislation" picture coherent, or does it invite infinite regress?
  **Verdict:** It is coherent, but only if you ground the authority of the legislator in **Second-Order Volition**, not just temporal priority.

  Your worry ("Who votes for the legislator?") is the **Homunculus Problem**. If the Morning Self is just another impulse (the "wanting to quit" impulse) battling the Evening Self (the "wanting to stay" impulse), why does the Morning Self have the right to rule? If it's just a tug-of-war, the stronger impulse wins, and "legislation" is just a fancy word for "winning."

  To avoid the regress, you need to distinguish the selves not just by *time* (Morning vs. Evening) but by *level* (Reflective vs. Impulsive).
  *   **The Philosophical Fix:** This is **Harry Frankfurt's** distinction between first-order desires (I want to drink) and second-order volitions (I want to *not* want to drink).
  *   The Morning Self gets to legislate not because it woke up earlier, but because it is the self capable of **reflective endorsement**. It represents the agent's *values*, whereas the Evening Self represents the agent's *urge*.

  **Recommendation:**
  Frame the legislation not as a democracy (where the latest voter wins) but as a **Constitution**. The Morning Self writes the constitution (the resolution) when it is capable of reason. The Evening Self is the citizen who must abide by it. The "failure" isn't that the citizen outvoted the founder; it's that the citizen rebelled against the law that constitutes their own long-term freedom. This avoids the regress: The Morning Self has authority because it aligns with the agent's *identity*, not because it has a bigger gavel.

  ### Two Conceptual Tweaks to Strengthen the Essay

  **1. "Judgment" vs. "Preference"**
  You write: *"akrasia isn't acting against your own judgment at all -- it's two successive selves with opposite rankings."*
  Be careful here. The traditional definition of *akrasia* (from Aristotle to Davidson) requires acting against one's **better judgment**.
  If HD means your judgment *actually changes* (i.e., at 6 PM, you genuinely believe staying is better), then technically it isn't *akrasia* anymore; it's just **rational action based on new information** (the information being proximity).
  *   **The Fix:** Argue that the *evaluation* changes, but the *value* does not. The Evening Self knows, objectively, that leaving is better for the "Life Project," but the *weighting* of the immediate reward overwhelms that knowledge. This preserves the "knowingly" part of "knowingly doing the worse." The Evening Self knows the Morning Self was right, but simply doesn't care enough *in this moment*. That preserves the moral sting.

  **2. The "Ulysses Contract"**
  Your legislation idea is very close to what Thomas Schelling and Jon Elster call a **Ulysses Contract** (binding your future self to prevent weakness).
  *   **The Risk:** If you frame it purely as a strategic binding, it becomes a game theory problem.
  *   **The Opportunity:** Use this to highlight the tragedy. A Ulysses contract only works if you can physically bind yourself (like Ulysses to the mast). In your protagonist's case, he *re-enrols* himself every morning. He is voluntarily taking off the chains.
  *   **The Point:** This makes the "legislation" even more poignant. The Morning Self has the right to legislate, but it lacks the **executive power** to enforce it. The tragedy of *akrasia* is not that the laws are illegitimate, but that the state (the self) is too weak to enforce its own constitution.

  ### Summary of Advice

  1.  **HD/Selves:** You are on solid ground with Ainslie, but acknowledge that "successive selves" is a model of agency, not necessarily a metaphysical fact.
  2.  **Culpability:** You are resisting **Personal Identity Reductionism**. Maintain that agency requires diachronic unity, even if preferences fragment.
  3.  **Legislation:** Avoid the regress by grounding the Morning Self's authority in **Reflective Endorsement** (Frankfurt) or **Constitutional Authority** (Schelling/Elster), not just temporal priority.
  4.  **Terminology:** Ensure you distinguish between *preferences flipping* (HD) and *judgment being wrong*. The protagonist must still *know* the Morning Self is right for it to remain *akrasia*.

  Your core insight—that HD explains the *mechanism* of the betrayal without excusing the *betrayal* itself—is philosophically sound and makes for a excellent literary argument. It bridges the gap between the "puzzle" of philosophy and the "experience" of fiction.
