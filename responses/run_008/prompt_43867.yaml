      *   *Philosophical Connection:* George Ainslie is the key figure here. He explicitly uses HD to argue for "multiple selves" or "successive selves." The idea is that because preferences reverse based on temporal proximity, the agent at $t_1$ effectively has different utility functions than the agent at $t_2$.
      *   *Verdict:* It's not *just* a metaphor. In behavioral economics and philosophy of action (specifically the Ainslie camp), HD is the *mechanism* that generates the successive selves model. However, it's a specific *interpretation* of HD. Some economists treat it as a single agent with a weird discount function. But for the user's purpose (philosophical essay), the Ainslie interpretation is robust enough to stand on.
