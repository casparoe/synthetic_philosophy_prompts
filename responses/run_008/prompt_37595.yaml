answer: |-
  This is a sharp observation. You have identified a fissure in bioethics that often goes unexamined because the legal practice is so entrenched. The "obvious answer" you suspect is wrong is likely the standard appeal to **Precedent Autonomy** (the Dworkinian view that the competent self's critical interests trump the incapacitated self's experiential interests). If Precedent Autonomy were the sole governing theory, the asymmetry you describe shouldn't exist. If the past self is sovereign, its "yes" should be as binding as its "no."

  The fact that the law treats the past self's *veto* as absolute but its *command* as advisory reveals that the legal system is not actually operating on a robust theory of personal identity or narrative selfhood. Instead, it is operating on a specific, constrained theory of **autonomy as negative liberty**, coupled with a **fiduciary constraint on medical agency**.

  Here is the reconstruction of the implicit theory, its relationship to personal identity, and what a consistent alternative would look like.

  ### 1. The Implicit Theory: Autonomy as a Shield, Not a Sword

  The legal asymmetry presupposes that autonomy is fundamentally a **right of non-interference** rather than a **right of specific performance**.

  *   **The Refusal (The Shield):** When your past self says "no," it is exercising a negative right. It is withdrawing consent for bodily intrusion. In law and ethics, touching a body without consent is battery. The past self holds the "keys" to the body. Even if the current demented self is happy, the law prioritizes the *integrity of the bodily boundary* established by the competent agent. This is why the "no" is binding: it prevents a violation of the self's sovereignty.
  *   **The Request (The Sword):** When your past self says "yes" (demanding treatment), it is attempting to create a positive obligation for another agent (the doctor). It is trying to commandeer medical labor, resources, and technical judgment. The law implicitly holds that **autonomy cannot create obligations for others that violate their professional integrity or judgment.**

  Therefore, the implicit theory is not that the "Past Self is the Real Self." The implicit theory is that **the Past Self is the Guardian of the Body, but not the Master of the Physician.**

  This explains the asymmetry without needing to resolve whether the demented patient is the "same person." It doesn't matter if the demented you is a different person; the past you still holds the veto on bodily entry. But it *does* matter that the doctor is a moral agent with their own integrity. A "yes" directive forces the doctor to act; a "no" directive merely requires them to refrain. The law privileges *refraining* over *acting* when the two conflict.

  ### 2. Does This Settle the Personal Identity Debate?

  No. This is the crucial point where the practice "papers over" the philosophy. The current legal framework is **compatible with rival views of identity** because it sidesteps the metaphysical question entirely.

  *   **Compatibility with "Same Self" (Lockean/Psychological Continuity):** If the demented patient is the same person as the competent author, the law protects their long-term interests (via refusal) but prevents them from harming themselves (via overriding requests).
  *   **Compatibility with "Different Self" (Psychological Discontinuity):** If the demented patient is effectively a new entity, the law treats the advance directive as a property right left by the "dead" competent self to protect the "body" they left behind. The refusal protects the corpse-like interests of the past; the request is ignored to protect the welfare of the new, sentient entity currently inhabiting the body.

  Because the law relies on the **Negative/Positive Right distinction** rather than the **Identity Distinction**, the practice does not pick a winner in the philosophy-of-identity debate. You could argue for this exact legal setup whether you believe the demented patient is you or a stranger. The limiting factor isn't *who* the patient is; it's *what* the directive asks the doctor to do (stop vs. start).

  ### 3. What Parts are "Forced" vs. "Contingent"?

  *   **Forced by the Theory:** The binding nature of the **refusal**. If autonomy is negative liberty (freedom from interference), then a competent withdrawal of consent *must* remain binding even after competence is lost. To ignore a living will's "no" is to treat the patient as a means to an end (their own survival), violating the Kantian core of the negative liberty model.
  *   **Contingent (Compatible with Rivals):** The non-binding nature of the **request**. This is not forced by the theory of autonomy itself, but by the *social contract of medicine*. We could conceive of a libertarian medical system where a patient's "yes" is a binding contract that doctors must fulfill regardless of medical futility (provided they are paid). The fact that the law allows doctors to override requests is a policy choice to protect **medical integrity** and **resource allocation**, not a logical necessity of personal identity or autonomy.

  ### 4. The Counterfactual: A Legislature of "Full Authority"

  If a legislature took the "Full Authority for the Earlier Self" view seriously (a true Precedent Autonomy regime where the past self is sovereign over the future self's existence), the law would look radically different. It would have to close the asymmetry.

  1.  **Binding Requests:** If the past self is sovereign, its "yes" must be binding. If I sign a directive saying, "Keep me on a ventilator even if I am permanently unconscious and my body is failing," the doctor would be legally obligated to comply, even if they deem it "futile" or "inhumane." The doctor becomes a mere technician executing the will of the sovereign past self.
  2.  **Irreversible Refusals:** Conversely, the "no" would remain binding, but the justification would shift. Currently, we honor a "no" partly to protect the *current* patient from unwanted intrusion. In a Full Authority regime, we would honor the "no" even if the *current* patient was screaming "I want to live!" and had no physical pain, purely because the Past Self owns the Future Self's life.
  3.  **The "Ulysses" Extreme:** This regime would enforce Ulysses contracts to the letter. If I pre-commit to refusing antibiotics for pneumonia in old age, the state would have to prevent the current me from consenting to them, treating the current me's desire to live as a symptom of my "corruption" or incapacity to know my "true" will.

  ### Summary

  The asymmetry you found bugs you because it reveals that the law is not actually committed to the **Sovereignty of the Past Self**. It is committed to the **Sovereignty of the Body against Intrusion.**

  The law assumes the competent self has the right to lock the door (refusal), but not the right to force someone to come in and clean the house (request). This is not a theory of personal identity; it is a theory of **rights topology**. The "identity" language is indeed papering over a pragmatic compromise: we want to respect your past values enough to let you die, but not enough to force us to torture you (or the doctor) to keep you alive.

  If you want to win the argument with your friend, the point is this: The law doesn't trust your past self to know what is *good* for your future self (hence requests are voidable), but it does trust your past self to know what is *violating* to your future self (hence refusals are binding). That isn't a consistent theory of the self; it's a consistent theory of harm.
