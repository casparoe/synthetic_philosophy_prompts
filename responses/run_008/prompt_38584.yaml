answer: |-
  This is an exceptionally sharp observation, and it cuts to the core of the ontological debate in the philosophy of psychiatry. You have identified the central tension: the DSM operates with a **public face of realism** (discovering natural boundaries) while functioning through a **mechanism of pragmatism and social negotiation** (responding to values, utility, and looping effects).

  To answer your question directly: The DSM revision practice does not presuppose a single, consistent theory of psychiatric kinds. Instead, it presupposes what we might call **Strategic Realism** covering a core of **Operational Pragmatism**. It treats categories *as if* they were indifferent natural kinds to secure scientific authority, but revises them *as if* they were interactive kinds when stability threatens utility or social legitimacy.

  Here is a breakdown of what the practice requires, where it is underdetermined, and how it would look if it truly embraced Hacking's looping effects.

  ### 1. Strict Requirements vs. Comfortable Fits

  To understand what the DSM *presupposes*, we must distinguish between what is necessary for the manual to function and what is merely rhetorical decoration.

  **What the Practice Strictly Requires:**
  *   **Stability (for Bureaucracy):** The categories must be stable enough to allow for billing, insurance reimbursement, and legal adjudication. This requires the *appearance* of fixed boundaries, regardless of whether those boundaries are "real."
  *   **Utility (for Clinicians):** The categories must facilitate communication and treatment selection. If a category causes more confusion than clarity (low reliability), it must be changed.
  *   **Legitimacy (for the Institution):** Psychiatry must maintain its status as a medical discipline. This requires the *language* of discovery, validity, and biology, even if the underlying ontology is murky.

  **What the Practice Merely Sits Comfortably With:**
  *   **Natural Kind Realism:** The DSM is comfortable claiming it is "finding" disorders (e.g., "we refined the criteria to match the underlying pathology"), but it does not *require* this to be true. It only requires that users *believe* it is true enough to trust the diagnosis.
  *   **Social Constructivism:** The DSM is comfortable removing diagnoses due to social pressure (Homosexuality) or ethical concern (Grief), but it rarely admits this is the reason. It sits comfortably with constructivism in practice, provided it can dress the decision in the language of "clinical utility" or "lack of validity."

  **The Verdict:** The revision process presupposes that psychiatric kinds are **tools for coordination**, not necessarily mirrors of nature. The "Realist" language is a tool to secure the authority of the tool.

  ### 2. Where the Practice is Underdetermined

  You asked if the practice is internally inconsistent. A more precise philosophical diagnosis is that the revisions are **ontologically underdetermined**. The same revision can be justified by competing theories of kinds, which allows the APA to pivot between them as needed.

  **Case A: The Removal of Homosexuality (DSM-II to DSM-III)**
  *   *Natural Kind Justification:* "We discovered that homosexuality does not meet the definition of 'mental disorder' (distress/dysfunction) as well as we thought." (Implies the kind was always there, we just mislabeled it).
  *   *Interactive/Constructivist Justification:* "The label itself was creating the distress (minority stress), and the category was a mechanism of social control." (Implies the kind was constituted by the classification).
  *   *Underdetermination:* The *outcome* (removal) is the same. The DSM officially used the language of validity (Natural Kind), but the *cause* was activism (Interactive). The practice allows the Natural Kind narrative to retroactively sanitize the Constructivist event.

  **Case B: Asperger's Absorption into ASD (DSM-IV to DSM-5)**
  *   *Natural Kind Justification:* "Research shows no clear boundary exists between Asperger's and High-Functioning Autism; they are one etiological kind."
  *   *Pragmatic/Interactive Justification:* "The distinction was unreliable across clinics, leading to inequitable access to services. Merging them stabilizes resource allocation."
  *   *Underdetermination:* Again, the revision holds under both views. If you believe in Natural Kinds, you say science found the truth. If you believe in Interactive Kinds, you say the bureaucracy rationalized the spectrum to manage the population.

  **Case C: The Grief Exclusion (DSM-5)**
  *   *Natural Kind Justification:* "Depression is depression, regardless of the trigger. Biological markers are the same."
  *   *Normative/Interactive Justification:* "Labeling grief as pathology changes how society treats the bereaved and how they treat themselves. We should not medicalize normal human variation."
  *   *Underdetermination:* The decision to keep the exclusion (with caveats) was a compromise. It acknowledges that the *consequences* of the classification (looping effects on the bereaved) matter as much as the *symptoms*.

  **Conclusion on Consistency:** The practice is not logically consistent regarding ontology, but it is **functionally consistent**. It prioritizes *institutional survival* over *ontological purity*. It uses Realism when it needs authority and Pragmatism when it needs flexibility.

  ### 3. Sketching a Hackingian Revision Process

  If the DSM revision process took **looping effects** seriously from the start—accepting Hacking's premise that classifying people changes people, and that this change is constitutive of the kind, not just noise—the entire architecture of the manual would shift.

  Currently, looping effects are treated as **confounds** (e.g., "patients are faking symptoms to get the diagnosis"). In a Hackingian framework, looping effects are **data**.

  Here is what a "Looping-Aware" DSM revision process would look like:

  **A. Mandatory Expiry Dates and "Dynamic Stabilization"**
  *   *Current:* Categories are presumed stable until proven otherwise.
  *   *Hackingian:* Categories are presumed temporary stabilizations of a moving target. Each diagnosis carries an **expiry date** (e.g., 10 years).
  *   *Rationale:* Because the classification changes the classified, the "kind" drifts over time. A category valid in 1990 may not describe the same phenomenon in 2020 because the 1990 label changed the population's self-conception. Re-authorization would require proving the category still "carves nature at its joints" *in the current social context*.

  **B. Ethical and Social Impact Field Trials**
  *   *Current:* Field trials measure **inter-rater reliability** (do two doctors agree?) and sometimes **validity** (does it predict course/treatment?).
  *   *Hackingian:* Field trials must measure **constitutive impact**.
  *   *Method:* Before a new category (e.g., "Attenuated Psychosis Syndrome") is published, pilot studies would track:
      1.  How does receiving this label change the patient's narrative identity?
      2.  Does it induce the very symptoms it predicts (self-fulfilling prophecy)?
      3.  Does it alter family dynamics or employment prospects in ways that exacerbate the condition?
  *   *Criterion:* If a category has high reliability but negative looping effects (e.g., it creates chronicity where there was transient distress), it should be rejected or modified.

  **C. Participatory Ontology**
  *   *Current:* Workgroups consist of researchers and clinicians. Patients are "subjects."
  *   *Hackingian:* Workgroups must include **representatives of the kind**.
  *   *Rationale:* Since interactive kinds are co-constituted by the classified people's understanding of themselves, you cannot define the kind without them. "Autism" is not just what clinicians see; it is how autistic people organize, advocate, and experience their neurology. The revision process would treat patient advocacy not as "external pressure" (as with Homosexuality) but as **internal data** about the kind's reality.

  **D. The "Reactivity" Warning Label**
  *   *Current:* The DSM describes symptoms as static features.
  *   *Hackingian:* Diagnostic criteria would include **reactivity notes**.
  *   *Example:* "Warning: Classification under this code has been observed to increase help-seeking behavior in demographic X, but increase stigma-related withdrawal in demographic Y."
  *   *Goal:* To make the clinician aware that the act of diagnosing is an intervention that alters the trajectory of the disorder.

  ### Summary for Your Seminar

  The DSM revision process presupposes that psychiatric kinds are **bureaucratic technologies** that require the **mask of natural kinds** to function. It is ontologically agnostic but rhetorically realist.

  It is underdetermined because the same administrative move (adding, removing, or merging a category) can be justified by appealing to "scientific discovery" or "social utility" depending on which argument protects the institution best.

  If the process took looping effects seriously, it would cease to be a static taxonomy and become a **dynamic monitoring system**. It would admit that it is not mapping a fixed territory, but gardening a landscape that grows back differently every time it is mowed. It would trade the authority of "Truth" for the accountability of "Consequence."
