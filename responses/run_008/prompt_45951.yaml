answer: |-
  (1) **Right-but-not-for-the-reason-given.** Jonas is correct that political and legal obligations (debts, treaties) persist across generations; states are continuous legal persons. However, this establishes *political liability*, not *moral guilt*. Jaspers explicitly separates these categories to prevent the exact conflation Jonas attempts here.

  (2) **Right.** Petra correctly identifies the category error. Guilt implies desert based on agency and choice; liability implies obligation based on membership or benefit. One can inherit the duty to repair (responsibility) without inheriting the stain of the crime (guilt).

  (3) **Wrong.** The "ledger view" accurately describes unjust enrichment and the basis for reparations, but defining that financial/historical liability as "collective guilt" is semantically and ethically misleading. It conflates the state's balance sheet with the individual's moral standing.

  (4) **Right.** Petra correctly notes that demographic reality undermines the metaphysical substrate required for collective guilt. If the "group" changes composition entirely, the moral agent purportedly carrying the guilt no longer exists in the form Jonas requires.

  (5) **Right-but-not-for-the-reason-given.** Jonas accurately describes Jaspers' concept of metaphysical guilt (solidarity without specific acts), but misapplies its temporal scope. Jaspers applied this to *contemporaries* who survived, not to descendants born decades later who had no opportunity to "stand by."

  (6) **Right.** Petra's Arendtian critique is the strongest philosophical check here. Diluting guilt across a collective (or across time) risks exonerating actual perpetrators and renders the concept of guilt too broad to have moral force.

  **What Both Are Missing**
  Both disputants treat Jaspers' 1946 text as a timeless algorithm rather than a specific address to *contemporary* Germans facing immediate post-war reconstruction. They are also missing the distinction between *backward-looking blame* (culpability) and *forward-looking obligation* (complicity/structural benefit). A modern German is not *guilty* of the Holocaust, but may be *complicit* in structures sustained by it, creating duties distinct from both debt and sin.

  **Overall Assessment**
  Petra is more right overall. She maintains the necessary philosophical distinctions between agency, liability, and guilt, whereas Jonas relies on intuitive analogies that collapse under conceptual scrutiny. Jonas identifies a real phenomenon (inherited obligation) but insists on labeling it "guilt," which weakens his position.

  Verdict: Moves 2, 4, and 6 survive scrutiny, making Petra more right overall.
