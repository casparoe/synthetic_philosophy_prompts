prompt: |-
  I'm a third-year PhD student in economics, TA-ing for a master's course in decision analysis — the students are mostly public policy and health policy people, comfortable with expected utility at the level of a decision tree, but they've never seen a proof of anything and they get prickly when a topic smells like theory for theory's sake. Next week I get fifty minutes on the result everyone calls Good's theorem: if you're a Bayesian expected-utility maximizer, the expected value of acting after receiving free information is never lower than the value of your best act now, so imformation never has negative expected value. The instructor warned me this is historically the session where half the class decides the whole Bayesian framework is a shell game, so I want to plan it properly rather than wing it like I did for the risk aversion lecture.

  To be clear, don't explain the theorem to me — I know the proof, it's basically the law of total expectation plus "you're allowed to ignore the signal." What I need is a plan for the session. What has to be in place before I even state the theorem — my instinct is that the whole thing lives or dies on them getting whose expectation we're talking about (the prior expectation, taken before you see the signal, over what you'll do after), but tell me if you think something else has to come first. Then pick the single running example that should carry the full fifty minutes: I'm torn between a policy pilot study and a diagnostic test for some condition, but choose one for me and say what it needs to contain that a boring umbrella-and-weather example wouldn't. Then the misconception map: I already know they'll say "but sometimes I'd rather not know" (test for an untreatable disease, etc.), and "so we should just run every study forever," and probably "this is circular, you assumed Bayes to prove Bayes is fine" — tell me where in the sequence each should be headed off rather than left to fester till Q&A, and, importantly, which of these is actually pointing at a real limitation of the theorem's setup rather than a misunderstanding, because I suspect at least one of them is. Also tell me what I should openly refuse to cover in fifty minutes and say out loud that I'm refusing — costly information? the sample-size machinery from my own field? — so they don't think I just forgot it.

  Please make actual choices rather than giving me menus of examples and orderings to pick between, and push back on my guesses where they're wrong, including the one about whose expectation being the crux. End with the single question I can put on the board in the last five minutes that would let me tell who's actually gotten it from who's just nodding along.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** 3rd-year PhD student in Economics. TA for a Master's course in Decision Analysis.
      *   **Audience:** Master's students (Public Policy, Health Policy). Comfortable with expected utility (EU) and decision trees. *Not* comfortable with proofs/theory. Prickly about "theory for theory's sake."
      *   **Topic:** Good's Theorem (Value of Information is non-negative for Bayesian EU maximizers).
      *   **Constraint:** 50 minutes.
      *   **Goal:** A concrete lesson plan. No menus/choices. Push back on user's instincts. Identify misconceptions vs. real limitations. Define scope boundaries. End with a specific diagnostic question.
      *   **User's Instinct:** The crux is "whose expectation" (prior expectation over future actions).
      *   **User's Dilemma:** Example choice (Policy Pilot vs. Diagnostic Test).
      *   **User's Concern:** Students rejecting the Bayesian framework ("shell game").

  2.  **Evaluate User's Instincts:**
      *   *Instinct:* "The whole thing lives or dies on them getting whose expectation we're talking about."
      *   *Pushback:* This is *necessary* but not *sufficient*. If they understand it's the *ex-ante* expectation, they might still reject the result if they don't buy the *action space* assumption. The real friction point for policy/health students is usually the "freedom to ignore" assumption or the "costless" assumption, not just the expectation operator. However, the user is right that confusing $E[U|info]$ (posterior) with $E[U]$ (prior predictive) is the most common technical error. I need to refine this: It's not just *whose* expectation, it's the *timing* of the evaluation relative to the decision rule.
      *   *Example Choice:* Policy Pilot vs. Diagnostic Test.
          *   *Policy Pilot:* Good for policy students, but often involves sample size issues (frequentist overlap) which muddies the Bayesian water.
          *   *Diagnostic Test:* Classic health policy context. Immediate binary decision (treat/don't treat). Clear prior (prevalence), clear signal (test result), clear action (treatment).
          *   *Decision:* Diagnostic Test. It's more visceral for health policy students. It allows for the "untreatable disease" objection (real limitation) more naturally than a policy pilot.
      *   *Misconceptions:*
          *   "Rather not know" (Psychological value of ignorance). -> Real limitation (utility function definition).
          *   "Run every study forever." -> Misunderstanding (Cost).
          *   "Circular." -> Misunderstanding (Coherence vs. Truth).
      *   *Scope:* Must explicitly exclude *costly* information. Must exclude *sample size design* (that's VOI *optimization*, not VOI *non-negativity*).

  3.  **Drafting the Plan - Section by Section:**

      *   **Phase 1: Pre-Theorem Setup (10 mins):**
          *   Need to ground the notation without doing math.
          *   Must establish the *Decision Rule*. The theorem isn't about the signal; it's about the *policy* mapping signal to action.
          *   *Correction on User's Instinct:* It's not just "whose expectation." It's that the *ex-ante* value compares the *optimal ex-post* strategy against the *optimal ex-ante* strategy. The key is the *option value* embedded in the future choice.
          *   *Action:* Define the "Status Quo" vs. "Wait and See."

      *   **Phase 2: The Running Example (25 mins):**
          *   *Choice:* Diagnostic Test (e.g., a rare genetic marker predicting response to a costly drug).
          *   *Why not Umbrella:* Too trivial. Doesn't capture the stakes of health policy.
          *   *Why not Policy Pilot:* Too much noise about statistical power vs. Bayesian updating.
          *   *Specifics:* Need a specific prior (10% prevalence), specific test accuracy (sensitivity/specificity), specific payoffs (QALYs or $).
          *   *Crucial Element:* The "Ignore" option. The decision tree must show that after the test, you *can* choose the same action you would have chosen without the test. This proves the inequality.

      *   **Phase 3: Misconception Map (10 mins):**
          *   *Objection 1: "I'd rather not know" (Untreatable disease).*
              *   *Verdict:* Real Limitation. The theorem assumes Utility is defined over *states and actions*, not *knowledge itself*. If "not knowing" provides utility, the model is misspecified. Acknowledge this.
          *   *Objection 2: "Run every study forever."*
              *   *Verdict:* Misunderstanding. This ignores *cost*. Good's theorem is for *free* information.
              *   *Timing:* Address this immediately after the proof intuition.
          *   *Objection 3: "Circular/Shell Game."*
              *   *Verdict:* Misunderstanding. It's about internal coherence, not external truth.
              *   *Timing:* Q&A or wrap-up. Don't let it derail the middle.

      *   **Phase 4: Scope Boundaries (5 mins):**
          *   Explicitly state what is *not* covered. Cost of info. Design of experiments (sample size). Non-Besian frameworks (Minimax, etc.).

      *   **Phase 5: The Diagnostic Question (Last 5 mins):**
          *   Needs to distinguish mechanical understanding from conceptual grasp.
          *   Idea: Ask about a scenario where VOI is *zero*.
          *   Better Idea: Ask about the "Ignore" condition.
          *   Best Idea: A scenario where the signal is perfectly correlated but the action doesn't change. Or, ask them to identify the specific step where the "non-negative" guarantee breaks if costs are introduced.
          *   *Refinement:* Let's go with the "Zero Value" case. When is information worthless? When it never changes your decision. This tests if they understand that value comes from *decision switching*, not just *uncertainty reduction*.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *User's Instinct Check:* The user thinks the crux is "whose expectation." I need to push back gently. It's actually about the *feasible set of actions*. The expectation is the math, but the *freedom to choose* is the economics. I will emphasize the "Option Value" aspect.
      *   *Example Detail:* Make sure the numbers work out nicely in head. Prior 0.5 is easiest. Treatment cost vs. Benefit.
      *   *Tone:* Respectful of their policy background. Avoid measure theory. Use decision trees (which they know).
      *   *The "Shell Game" Fear:* Address this by framing Good's Theorem as a consistency check, not a truth claim. It says "If you believe your own probabilities, you can't expect to be hurt by learning more."

  5.  **Finalizing the Plan Structure:**
      *   **Pre-Work:** Define the "Decision Rule" not just the expectation.
      *   **Example:** Diagnostic Test (Hypothetical Drug "X" for Condition "Y").
      *   **Misconceptions:** Categorize into "Model Boundary" vs. "Student Error."
      *   **Exclusions:** Costly info, Sample Size, Non-EU.
      *   **Final Question:** The "Zero Value" condition.

  6.  **Writing the Response:** (Iterative refinement for clarity and directness).
      *   *Pushback:* Be direct about the "whose expectation" point. It's about the *comparison of optimal policies*.
      *   *Example:* Commit to the Diagnostic Test. Specify the "Untreatable" twist for the limitation section.
      *   *Misconceptions:* Be precise about which one is a valid critique (utility over knowledge).
      *   *Final Question:* Make it binary and conceptual.

  7.  **Final Review against constraints:**
      *   50 mins? Yes, timing allocated.
      *   No menus? Yes, choices made.
      *   Push back on instincts? Yes.
      *   End with specific question? Yes.

  *(Self-Correction on the Final Question)*: A question like "When is VOI zero?" is good. But maybe "If the test costs $1, does Good's theorem apply?" is too easy. Let's stick to the "Decision Switching" concept. "If your decision doesn't change, what is the VOI?" Answer: Zero. This proves they understand value comes from *action*, not *information*.

  *(Self-Correction on the "Whose Expectation" Pushback)*: I need to be careful not to say the user is *wrong*, but that it's incomplete. The expectation is the *mechanism*, but the *constraint* is the action space. I will phrase it as "Necessary, but the real lever is the action set."

  *(Final Polish)*: Ensure the tone is peer-to-peer (PhD to PhD) but directive.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the plan. It is designed to be tight, defensive against the "shell game" reaction, and grounded in the decision trees they already know.

  ### 1. The Pre-Theorem Setup (Minutes 0–10)
  **Pushback on your instinct:** You are right that "whose expectation" is the technical crux, but it is not the *pedagogical* crux. If you focus only on the expectation operator ($E_{prior}$ vs $E_{posterior}$), they will get lost in the subscripts. The real conceptual lever is the **feasible action set**.

  Before you write down a single probability, you must establish two definitions on the board:
  1.  **The Status Quo Policy:** The optimal action chosen *now* without the signal.
  2.  **The Contingent Policy:** A rule that maps *every possible signal* to an action.

  **The Crucial Move:** You must explicitly draw the decision tree for the "Wait and See" option and highlight that the action nodes *after* the signal include the option to choose the Status Quo action.
  *   *Why:* Good's theorem relies on the inequality $\max\{a, b\} \geq a$. The value of information comes from the *option* to switch actions, not the signal itself. If you don't establish that the decision-maker is *allowed* to ignore the signal and do what they would have done anyway, the proof fails.
  *   *Script:* "We are not comparing 'acting blind' vs. 'acting informed.' We are comparing 'acting blind' vs. 'having the option to act blind OR act differently depending on the news.' Since having options is never worse than having fewer options, the value must be non-negative."

  ### 2. The Running Example (Minutes 10–35)
  **Choice:** **The Diagnostic Test.**
  Do not use the policy pilot. Pilot studies invite frequentist questions about power and sample size that will derail the Bayesian logic. The umbrella example is too trivial to justify the theoretical weight.

  **The Scenario:** A health policy decision on whether to subsidize a new expensive drug ($D$) for a specific condition ($C$).
  *   **States:** Patient has $C$ (Responds to drug) vs. No $C$ (Drug ineffective/wasteful).
  *   **Prior:** Prevalence is 20%.
  *   **Actions:** Subsidize ($A_1$) or Don't Subsidize ($A_2$).
  *   **Payoffs:**
      *   Subsidize + Has $C$: +100 QALYs.
      *   Subsidize + No $C$: -50 QALYs (waste/side effects).
      *   Don't Subsidize: 0 QALYs (status quo).
  *   **The Signal:** A genetic test result (Positive/Negative).
      *   Sensitivity/Specificity: Make them imperfect but informative (e.g., 80% accurate).

  **What this example must contain that an umbrella example doesn't:**
  It must include a **region of decision stability**. You need to show a calculation where the test comes back "Positive," but the posterior probability is *still* not high enough to switch the decision from "Don't Subsidize" to "Subsidize."
  *   *Why:* This is the only way to visually demonstrate why the value is *non-negative* rather than *strictly positive*. If every signal changes the decision, they will think information is only valuable when it flips the choice. You need to show that even when the signal doesn't change the choice, the *expected* value is still higher (or equal) because in the *other* branch of the tree, it *did* change the choice.

  **Execution:**
  1.  Calculate EU of Status Quo (Don't Subsidize).
  2.  Calculate Posterior probabilities given Test +/-.
  3.  Calculate EU of Optimal Action given Test +.
  4.  Calculate EU of Optimal Action given Test -.
  5.  Take the Prior Expectation of steps 3 & 4.
  6.  Show Step 5 $\geq$ Step 1.

  ### 3. The Misconception Map (Minutes 35–45)
  Do not wait for Q&A to address these. Pre-empt them during the calculation or immediately after the result.

  **1. "But sometimes I'd rather not know" (e.g., untreatable fatal disease).**
  *   **Verdict:** **Real Limitation.**
  *   **When to address:** Immediately after stating the theorem.
  *   **How:** "Good's theorem assumes utility is defined over *outcomes* (health, wealth), not over *states of knowledge*. If 'not knowing' provides you utility (peace of mind), that is a cost of information not captured in the standard payoff matrix. If you add 'anxiety cost' to the 'Test Positive' branch, the net value can be negative. The theorem holds for *instrumental* value, not *consumption* value of information."
  *   *Why:* Validating this prevents them from thinking the model is delusional. It draws a boundary around the model's applicability.

  **2. "So we should just run every study forever."**
  *   **Verdict:** **Misunderstanding.**
  *   **When to address:** During the calculation of the "Wait and See" branch.
  *   **How:** "Notice the theorem specifies **free** information. As soon as the test costs money, you subtract that cost from the expected value. We are proving the *gross* value is non-negative. The *net* value is an empirical question."
  *   *Why:* This is the most common policy objection. Kill it early.

  **3. "This is circular; you assumed Bayes to prove Bayes is fine."**
  *   **Verdict:** **Misunderstanding (Coherence vs. Truth).**
  *   **When to address:** Wrap-up.
  *   **How:** "This isn't a proof that Bayesian updating finds the *truth*. It's a proof of *coherence*. If you violate this theorem (i.e., you expect to be worse off by learning for free), you are vulnerable to a 'money pump' where someone can sell you information you don't want and then buy it back. It's a consistency check on your own beliefs, not a guarantee about the world."

  ### 4. Scope Boundaries (Minutes 45–50)
  You must explicitly state what you are **refusing** to cover. If you don't, they will assume you ignored it because you couldn't handle it.

  **Say this out loud:**
  "I am explicitly excluding two things today:
  1.  **Costly Information:** We are not optimizing sample sizes or budgeting for studies. That is *Value of Information Optimization*, which builds on today's result but requires cost functions.
  2.  **Non-Expected Utility:** If you use Minimax or Ambiguity Aversion (Knightian uncertainty), this theorem can fail. In those frameworks, information can resolve ambiguity in a way that restricts your robust options. We are strictly in the Bayesian EU world today."

  ### 5. The Diagnostic Question (Last 5 Minutes)
  Put this on the board. Do not ask for a calculation. Ask for a condition.

  **The Question:**
  > "Under the assumptions of Good's Theorem (free info, Bayesian EU), **when is the Expected Value of Information exactly zero?**"

  **The Answer you are looking for:**
  "When the information **never changes your optimal decision** across any possible signal realization."

  **Why this works:**
  *   If they say "When the test is useless/noisy," they haven't gotten it. (Noisy info still has non-negative value if it *could* change a decision).
  *   If they say "When the prior is 0 or 1," that's a subset, but not the general case.
  *   If they say "When the decision doesn't change," they understand that value comes from the *option to switch actions*, not from the reduction of entropy/uncertainty itself. This confirms they grasped the "feasible action set" logic from the first 10 minutes.

  **Instruction to you:** If more than half the class answers "When the test is inaccurate," you know you spent too much time on the math and not enough time on the decision-tree structure.
