prompt: |-
  My brother is deep into effective altruism, and whenever we argue about how much we should care about the far future he reaches for the same picture: humanity as an adolescent. His version goes something like — we're like a gifted but reckless sixteen-year-old, smart enough to build things that could kill us, too immature to be trusted with them yet, but with nearly our whole life ahead of us, so these few dangerous years matter enormously, and mostly because of what they decide about whether the adult decades ever happen at all. He uses it to support two conclusions at once: that we live at an unusually influential moment (the time-of-perils idea), and that the sheer size of the life still ahead makes the future morally dwarf the present, so reducing existential risk this century beats nearly any other cause. I want to take the picture seriously rather then just mock it, but I don't know how to audit an analogy properly.

  So can you walk me through what maps onto what? I'd like a table with these exact columns: element on the teenager side; what it's supposed to correspond to for humanity; what the mapping gets right; where it breaks down; and whether that break matters for either of my brother's conclusions or is just cosmetic. There are spots I'm already suspicious of, so tell me if I'm right to be. Adolescence assumes a roughly fixed developmental script and that surviving it is the normal case — teenagers mostly do grow up — but I don't see what makes "humanity grows out of it" the default rather than one outcome among several. Also the teenager has parents and teachers, but the guardians in the human case would have to be the humans themselves, which seems like the analogy quietly doing the work of an outside helper who isn't there. And "most of your life is ahead of you" is a fact about a typical lifespan, while for humanity it's exactly the thing at issue, so I worry the picture smuggles in the conclusion it's supposed to be evidence for.

  Then give me the bottom line: once the disanalogies are on the table, does the "uniquely influential moment" conclusion survive on its own, does the "future dwarfs the present" one survive on its own, or were they leaning on the image to different degrees? And if the teenager framing is doing more harm than good, suggest a better comparison — something that keeps what's true in it without the parts that smuggle. Finally, after the table and discussion, a compact JSON object my brother can skim since he refuses to read anything long, lol: fields "survives_time_of_perils_conclusion" and "survives_future_dwarfs_present_conclusion" (each true, false, or "uncertain" plus a one-sentence reason), "load_bearing_disanalogies" (array of strings for the breaks that actually matter), "cosmetic_disanalogies" (array for the ones that don't), and "better_analogy" (a short string, or null if you think none is needed). No other fields please, I want to be able to eyeball it fast.
