    "survives_time_of_perils_conclusion": "true: The power-wisdom gap creates a unique risk spike regardless of developmental inevitability.",
    "survives_future_dwarfs_present_conclusion": "uncertain: The analogy assumes survival to adulthood rather than treating it as a probability to be calculated.",
    "load_bearing_disanalogies": [
      "Humanity lacks external guardians to mitigate risk",
      "Adulthood is not a biological default for civilizations",
      "Future lifespan is contingent not guaranteed"
    ],
    "cosmetic_disanalogies": [
      "Teenagers have hormones, humanity has incentives",
