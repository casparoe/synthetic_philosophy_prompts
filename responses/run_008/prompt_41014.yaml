answer: |-
  (a) **Brainstorm**

  To systematize your adviser's four verdicts, we can posit three candidate rules generating her judgments. 

  1.  **The Potential Access Rule:** Phenomenology is present iff the subject has subjective conviction *and* the information is potentially reportable given appropriate attentional cues (even if not initially reported).
  2.  **The Subjective Authority Rule:** Phenomenology is present iff the subject sincerely claims experience, unless they explicitly deny it (as in blindsight).
  3.  **The Veridical Encoding Rule:** Phenomenology is present iff the content is actually encoded in a sensory buffer, regardless of immediate report, provided the subject claims it.

  Rules 1 and 2 diverge on the beach case. Rule 1 predicts **no phenomenology** (the subject claims richness, but the flicker test proves the detail was not potentially accessible). Rule 2 predicts **yes phenomenology** (the subject sincerely claims they saw it).

  Regarding excluded criteria: Her track record explicitly rules out a **strict Global Workspace Theory (GWT)** criterion. Strict GWT holds that phenomenology requires global ignition and reportability. If she adhered to this, she would have ruled "no phenomenology" on Sperling's uncued letters, since they were not initially accessed or reported. By affirming phenomenology there, she rejects the identity of access and consciousness. Similarly, a pure **Behaviorist Criterion** (phenomenology equals competent performance) is excluded by the Absent-minded Driver and Blindsight cases, where competence exists without credited experience.

  (b) **Prediction**

  Applying the surviving rules to the beach case yields a split. The **Subjective Authority Rule** mandates a "Yes." The subject insists she took in the scene; unless she denies it (like the blindsight patient), her word is law. This view treats the feeling of richness as constitutive of phenomenology, even if illusory. Conversely, the **Potential Access Rule** mandates a "No." While the subject has conviction, the failure to notice the change and the inability to report details upon questioning demonstrate that the information was never available to the global workspace, even potentially. The Sperling icon supports report *if* cued; the beach "icon" does not.

  My best guess is that she will rule **No phenomenology of the details** (perhaps allowing a "fringe" feeling of the scene). I favor the **Potential Access Rule** as her implicit framework. Her Sperling verdict wasn't based merely on the subject's claim; it was vindicated by the cue. She treats phenomenology as real content, not just a feeling of content. In the beach case, the flicker test functions as a negative cue: it proves the detail was never there. She distinguishes between "I saw it but couldn't say" (Sperling) and "I thought I saw it but didn't" (Change Blindness).

  Theoretically, she occupies a nuanced **Overflow** position. Like standard Overflow theorists (e.g., Block), she accepts rich phenomenology beyond immediate report (Sperling). However, unlike naive Overflow views that might accept any subjective richness, she imposes a veridicality or access-potential constraint. The four earlier verdicts pull her in opposite directions: Blindsight and Driver pull toward GWT (access required), while Sperling pulls toward Overflow (richness exceeds report). The beach case resolves this tension: Overflow is permitted only when the overflow is *real* (accessible via cue), not when it is merely *felt*. If she rules "Yes," she prioritizes Subjective Authority, aligning closer to a phenomenological existentialism. If she rules "No," she prioritizes the cognitive reality of the content, aligning with a realist Overflow view.

  (c) **Discriminating Cases**

  To distinguish the **Potential Access Rule** from the **Subjective Authority Rule**, you need a case where conviction is high but access is definitively blocked.

  **Case 1: The Failed Sperling.** Present a 3x4 grid for 50ms. The subject insists, "I saw all twelve letters." However, when cued to a row, performance is at chance (perhaps due to masking or degradation). 
  *   **Subjective Authority:** Predicts **Yes** (subject claims it).
  *   **Potential Access:** Predicts **No** (info not available).
  *   **Revelation:** If she rules "Yes," she values the first-person perspective over cognitive architecture. If "No," she requires the sensory buffer to be functionally real.

  **Case 2: Blindsight with Conviction.** A blindsight patient guesses correctly but, unlike typical patients, claims, "I had a vague visual hint," though they cannot describe it. 
  *   **Subjective Authority:** Predicts **Yes** (claim of experience).
  *   **Potential Access:** Predicts **No** (still no global access/reportability of content).
  *   **Revelation:** This tests whether her "No" on standard blindsight was due to the patient's denial or the lack of access. If she rules "Yes" here, access is secondary to conviction. If "No," access is primary.

  I recommend the **Failed Sperling**. It directly mirrors the beach case structure but isolates the variable of cue-success. Her ruling here would confirm whether her Overflow commitment is grounded in metaphysics (experience exists even if inaccessible) or epistemology (we count experience only when verified by potential access).

  **Closing**

  Keep this in mind: Her framework likely treats phenomenology as a natural kind requiring both a first-person feel and a third-person footprint. If she rules "No" on the beach, she is telling you that consciousness is not just what it feels like, but what your brain can actually do with that feeling. Don't argue subjectivity; argue availability.
