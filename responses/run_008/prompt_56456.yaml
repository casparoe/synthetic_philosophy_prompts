      *   *Desideratum 2: Safety/Reliability.* Knowledge shouldn't be lucky. (Camp: Externalists/Safety Theorists).
      *   *Desideratum 3: Sorites/Margin for Error.* Vagueness in sensation requires margins. (Camp: Anti-Luminosity).
      *   *Desideratum 4: Fallibility Data.* Blindsight exists. (Non-negotiable: Any theory must explain why we *think* we are infallible even if we aren't, or limit the scope of luminosity).
      *   *Desideratum 5: KK Asymmetry.* Why does KK hold for pain but not lottery? (Non-negotiable: Explain the asymmetry, even if the answer is "KK always fails" or "Self-knowledge is special").
      *   *Distinction:* "In a position to know" vs. "Actually knows." This is crucial for saving luminosity from attention failures.

      *   *The Artificial Agent:* This tests Internalism vs. Externalism. If the agent's state is functionally identical to a human's, does the *history* of training matter?
