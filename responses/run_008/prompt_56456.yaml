      *   *Core Tension:* Luminosity (if in state S, know S) vs. Safety/Margin for Error (if you know S, you couldn't easily be wrong).
      *   *The Gradual Change Case:* If I feel cold at $t_1$, I know it. At $t_2$ (indistinguishable), I still know it. Eventually, I'm warm but think I'm cold. This violates Safety. So, to keep Luminosity, I must reject Safety or Margin-for-Error principles. To keep Safety, I must reject Luminosity.
      *   *KK Principle:* Luminosity implies KK (if I know I'm in pain, I'm in pain, so I know I know I'm in pain). But KK fails in externalist cases (lottery). So, is self-knowledge special?
      *   *Fallibility:* We *are* wrong sometimes (blindsight, confabulation). So "Infallibility" is too strong. "In a position to know" is weaker than "Actually knows."
      *   *Artificial Agent:* If an AI has a black-box readout that is reliable but could have been miscalibrated (modal fragility), does it have self-knowledge? Internalists say yes (current state), Externalists say no (history/reliability conditions).
