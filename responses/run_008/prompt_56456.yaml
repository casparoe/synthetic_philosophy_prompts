          *   *Decision:* I need to state whether the list applies unchanged. It shouldn't. Externalist criteria will fail the AI if the training was lucky. Internalist criteria might pass it.

      *   *Unsatisfiability:* The "Williamson Triangle."
          1.  Luminosity (If Cold, Know Cold).
          2.  Safety (If Know Cold, not easily False).
          3.  Indistinguishability (Cold_n is indistinguishable from Cold_n+1).
          *   Result: If 1 & 3, then at boundary, you believe Cold but are Warm. Violates 2.
          *   Verdict: Cannot hold all three.

      *   *Scoring:*
          *   Constitutive: Saves Luminosity/KK, struggles with Fallibility/Safety.
          *   Inner Sense: Saves Fallibility/Reliability, struggles with Luminosity/KK (scanner can fail).
          *   Safety-Denial (Anti-Luminosity): Saves Safety/Margin, sacrifices Luminosity/KK for sensations.

  5.  **Refining the Tone:**
