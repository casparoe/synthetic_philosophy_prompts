prompt: |-
  I'm a high school senior on our student council, and a thought experiment got out of hand. Our council decides things like whether to extend library hours or change the parking lottery by arguing for an hour and then raising hands, and I began to wonder what would happen if instead we let students wager play-money on which proposals would actually raise average attendance and exam scores, rewarded the bettors who turned out to be right, and adopted whatever the market favored. When I described this to a teacher, she told me that an economist named Robin Hanson had proposed something along these lines for real governments, under the name futarchy: the voters would choose the measure of national welfare that society commits to maximizing, and prediction markets would decide which policies will maximize it, with the government bound to enact whatever the market prices as best. I want to think carefully about whether a scheme like this could actually work, and before I read any further I want the specification first, because I notice the arguments I keep encountering are one-case-at-a-time — someone points to manipulation, someone else points to a prediction market that called an election correctly, and I can't tell which considerations are load-bearing.

  So here is my request. Write the requirements any workable futarchic system would have to meet: the cases it must get right, the failure modes it must survive, and the distinctions it has to respect. Among the cases I most want covered are ones I have been chewing on. There is the problem of conditional bets: a contract that pays out only in the world where the policy is actually adopted, so that whenever a policy is unlikely to be chosen the potential payouts are diluted and hardly anyone bothers to trade, leaving the market thin exactly when a decision is pending. There is the saboteur, who bets against a policy and then works quietly to make it fail, so that the market was right about the outcome and the outcome was wrong about the policy. There is the majority choosing a welfare metric that quietly ignores a minority, and the related pressure where the thing being measured degrades under the effort to maximize it. There is the horizon problem, that the effects of serious policies arrive decades out while traders want their stakes settled this year. And there is the thought I keep circling, that manipulation is harmless noise to be profitably absorbed by informed traders only when the manipulator is betting on the outcome, and not when the manipulator is betting while also redefining the scoreboard or shaping the event itself. For each requirement, give the consideration behind it, and say which requirements you regard as non-negotiable and which are merely the prejudices of people who already like or dislike markets. Please commit: if you believe some subset of the requirements cannot be jointly satisfied, say which subset and why, since that is the part I most want to see; and tell me which single requirement, in your judgment, does the most to decide whether futarchy is viable at all. Don't spend much space scoring existing proposals against the list; the criteria are what I want, since the scoring will depend on knowing the proposals and the criteria are where the thinking is. And I would rather you took definite positions and defended them than laid out the options and left me to choose. One note on form: please write continuous prose, the way one writes an essay or a letter, with no headings, bullet points, bold text, or tables — I know this subject tempts everyone into lists, and I want to see whether the requirements still stand up when they have to be argued out in sentences.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** High school senior, student council member. Interested in futarchy (Robin Hanson's idea: vote on values, bet on beliefs).
      *   **Task:** Write the requirements any workable futarchic system would have to meet.
      *   **Specific Content:** Must cover specific cases mentioned (conditional bets/liquidity, saboteurs, welfare metric tyranny/goodharting, horizon problem, manipulation vs. redefining the scoreboard).
      *   **Format:** Continuous prose (essay/letter style). NO headings, NO bullet points, NO bold text, NO tables.
      *   **Tone/Style:** Definite positions, defended arguments. Not neutral "on the one hand, on the other." Commit to judgments about non-negotiable vs. prejudicial requirements. Identify incompatible subsets if any. Identify the single most decisive requirement.
      *   **Constraint:** Do not spend much space scoring existing proposals. Focus on the criteria themselves.

  2.  **Deconstruct the Subject (Futarchy):**
      *   Core idea: Vote on the utility function (what we want), market on the causal beliefs (how to get it).
      *   Mechanism: Prediction markets determine policy adoption based on expected impact on the metric.
      *   Key Challenges: Liquidity, manipulation, sabotage, metric definition (Goodhart's Law), time horizons, counterfactuals.

  3.  **Address the Specific Cases Mentioned:**
      *   *Conditional Bets/Liquidity:* Markets need to price policies *before* adoption. If contracts only pay out if adopted, low probability of adoption = low liquidity = bad price discovery.
      *   *Saboteur:* Someone bets against a policy and then undermines it. This conflates prediction with causation.
      *   *Welfare Metric/Minority:* Voting on the metric might lead to tyranny of the majority.
      *   *Goodhart's Law:* Maximizing the metric degrades the actual welfare.
      *   *Horizon Problem:* Policies take decades; markets want settlement soon.
      *   *Manipulation:* Manipulation is okay if arbitrageurs correct it, but not if the manipulator changes the rules/outcome itself.

  4.  **Drafting Strategy - Continuous Prose:**
      *   I need to weave these points into a coherent narrative flow.
      *   Start with the core distinction between values and beliefs.
      *   Move into the market mechanics (liquidity, conditionality).
      *   Discuss the integrity of the outcome (sabotage, manipulation).
      *   Discuss the metric itself (Goodhart, tyranny).
      *   Discuss time (horizons).
      *   Make definitive claims about necessity vs. preference.
      *   Identify the "killer constraint."

  5.  **Determining Positions (Commitment):**
      *   *Liquidity/Conditionality:* This is technical but solvable via conditional markets (decision markets). Non-negotiable that markets must price counterfactuals, but the mechanism can vary.
      *   *Sabotage:* This is critical. If traders can influence the outcome they are betting on, the market ceases to be a predictor and becomes a self-fulfilling prophecy or a weapon. This is a major failure mode.
      *   *Metric Definition:* This is the hardest part. Voting on a metric is vulnerable to Goodhart's Law. I need to take a stand on whether this is fatal. I will argue that defining a robust welfare metric is the single most decisive requirement.
      *   *Horizon:* Can be solved with subsidies or long-term contracts, but difficult.
      *   *Manipulation:* Distinguish between noise manipulation (buying to move price) and fundamental manipulation (changing the world to match the bet). The latter is the real threat.
      *   *Incompatibility:* I should argue that there is a tension between *democratic control of the metric* and *resistance to Goodharting*. You can't easily have both.
      *   *Non-negotiable:* The market must not incentivize sabotage. The metric must not be easily gameable.
      *   *Decisive Requirement:* The definition and integrity of the welfare metric. Without a true north, the efficiency of the market doesn't matter.

  6.  **Writing - Section by Section (mental outline for flow):**
      *   Intro: Acknowledge the student council context, validate the intuition, define the core separation (values vs. beliefs).
      *   The Market Mechanism (Liquidity/Conditionals): Address the thin market problem. Argue that conditional contracts are non-negotiable.
      *   Integrity of Causality (Sabotage/Manipulation): Distinguish between betting on the world and betting against the world. Sabotage is a fatal flaw if not prevented.
      *   The Metric (Goodhart/Tyranny): This is the core. Argue that this is the hardest problem.
      *   Time (Horizons): Address the settlement issue.
      *   Conclusion/Commitment: Identify the incompatible subset (democratic metric vs. robust metric) and the single decisive requirement (metric integrity).

  7.  **Refining the Prose (Checking Constraints):**
      *   *Check:* No bullet points. *Check:* No bold text. *Check:* No headings.
      *   *Check:* Continuous prose.
      *   *Check:* Definite positions. (e.g., "I assert," "This is fatal," not "Some argue.")
      *   *Check:* Address the specific cases (conditional bets, saboteur, metric, horizon, manipulation).

  8.  **Drafting - Iteration 1 (Mental):**
      Start by telling the student that their intuition is sharp. Futarchy separates values and beliefs. But for it to work, specific things must hold. First, the market needs to know what happens if we *don't* pass the law. Conditional markets are needed. If liquidity is low, it fails. Second, people shouldn't be able to break the thing they bet against. Sabotage must be impossible or punished. Third, the metric matters. If we measure GDP, people ignore happiness. This is Goodhart's law. Fourth, time. Policies take long. Markets want short. We need a way to settle late. Finally, manipulation. If I can move the price to change the vote, that's one thing. If I can change the outcome to win the bet, that's another. The biggest problem is the metric. If the metric is wrong, the market is efficiently wrong.

  9.  **Drafting - Iteration 2 (Fleshing out for length and depth):**
      Need to make it sound like an essay/letter. More sophisticated argumentation.
      *   *Opening:* Validate the student council thought experiment. It mirrors the core philosophical split of futarchy.
      *   *Conditionality:* The market must price counterfactuals. If contracts only settle on adoption, no one trades unlikely policies. We need decision markets where contracts settle based on the *decision* regardless of outcome, or conditional assets. This is non-negotiable for price discovery.
      *   *Sabotage:* This is distinct from manipulation. Manipulation is lying with money. Sabotage is lying with action. If a trader can lower attendance to win a bet against extended hours, the market incentivizes destruction. This must be prevented. It requires separating trading权力 from implementation power.
      *   *Metric:* The voting on welfare is the weak link. Majorities will pick easy-to-measure metrics that ignore minorities. Goodhart's law says when a measure becomes a target, it ceases to be a good measure. This is the hardest requirement.
      *   *Horizon:* Long-term effects need short-term proxies or subsidized long-term holdings.
      *   *Synthesis:* Which is non-negotiable? The separation of betting from doing (anti-sabotage). Which is decisive? The metric definition.
      *   *Incompatibility:* You cannot have a purely democratic metric and a robust metric.

  10. **Final Polish (Checking against "No formatting" constraint):**
      Ensure no markdown headers or lists slip in. Keep paragraphs distinct but flowing. Ensure the tone is respectful but authoritative.

      *Self-Correction on "Commitment":* The prompt asks me to commit to whether some requirements cannot be jointly satisfied. I should explicitly state that democratic selection of the welfare metric and resistance to Goodharting are in tension. I should also identify the single most decisive requirement. I will choose the integrity of the welfare metric as the decisive one, because a perfect market optimizing the wrong thing is dangerous.

      *Self-Correction on "Sabotage":* I need to be clear that this is about the incentive structure. If the market rewards failure, people will cause failure.

      *Self-Correction on "Conditionals":* The user mentioned "conditional bets... diluted... thinly traded." I need to address how a workable system solves this. It requires a mechanism where the bet resolves based on the counterfactual estimate, not just the realized outcome of the adopted policy.

      *Let's write.*

      (Drafting thought process continued): I need to make sure I don't use bolding. I need to make sure I don't use lists. I need to make sure I answer the specific prompt about "non-negotiable" vs "prejudices".

