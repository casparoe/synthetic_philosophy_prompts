answer: |-
  Your intuition that the standard arguments surrounding futarchy are often fragmented is correct, because most defenses of the idea focus on the elegance of the mechanism while glossing over the fragility of the prerequisites. To determine whether a futarchic system could actually work, either in a student council or a nation, we must distinguish between the engineering challenges of building a market and the philosophical challenges of defining the goal. The core promise of futarchy is the separation of values from beliefs, where voters decide what we want and traders decide how to get it, but this separation is porous in practice. A workable system must satisfy requirements regarding market structure, incentive alignment, and metric integrity, and I will argue that while some of these are merely difficult engineering problems, others represent fundamental contradictions that threaten the viability of the entire project.

  The first non-negotiable requirement concerns the structure of the contracts themselves, specifically addressing the problem of conditional bets and liquidity that you identified. In a standard prediction market, traders bet on whether an event will happen, but in futarchy, traders must bet on whether a policy will cause an event relative to the counterfactual where the policy was not adopted. If contracts only pay out when a policy is adopted, then policies with low initial support will suffer from thin markets because the potential payout is diluted by the low probability of adoption, leading to poor price discovery exactly when the council needs information most. A workable system must utilize decision markets or conditional assets where the bet resolves based on the estimated outcome of the policy regardless of whether it is passed, or where the market is subsidized to ensure liquidity even for unlikely proposals. This is not a matter of preference but of mathematical necessity; without a mechanism to price counterfactuals robustly, the market merely reflects the probability of adoption rather than the efficacy of the policy, rendering the whole exercise redundant. Therefore, the ability to trade on causal impact rather than mere occurrence is a non-negotiable structural requirement.

  However, even with perfect market structure, the system faces a critical failure mode regarding the incentives of the participants, specifically the threat of the saboteur. You distinguished between manipulation as noise and manipulation as redefining the scoreboard, and this distinction is vital. In financial markets, manipulation is often harmless because arbitrageurs can profit from correcting the price, but in futarchy, a trader can profit by ensuring the policy fails after betting against it. If a student bets that extended library hours will lower attendance and then secretly spreads rumors to keep students away, the market was technically correct in its prediction, but the policy was sabotaged by the incentive structure itself. This is not merely noise; it is an attack on the causal integrity of the system. A workable futarchy must strictly separate the power to bet from the power to implement or influence the outcome outside of the market mechanism. While some might argue that informed traders can out-manipulate saboteurs, I contend this is a prejudice of those who trust market efficiency too much; when the cost of sabotage is lower than the potential payout, the market incentivizes destruction. Thus, preventing traders from having a direct hand in the causal chain they are betting on is a non-negotiable security requirement.

  The third requirement involves the time horizon of the policies versus the settlement of the bets. Serious policies, like changing a curriculum or a parking lottery, often have effects that unfold over years, while traders typically want their capital returned much sooner. If the market settles too early, it prices only immediate effects; if it settles too late, liquidity dries up because capital is locked for too long. A workable system must either subsidize long-term holdings or utilize proxy metrics that correlate strongly with the long-term welfare goal but settle quickly. While this is a significant engineering challenge, I regard it as solvable through financial innovation, such as using layered markets where short-term traders bet on the predictions of long-term traders. Consequently, while the horizon problem is severe, it is not necessarily fatal, provided the system has the capital to subsidize the delay. This stands in contrast to the structural and incentive requirements, which are more rigid.

  The most difficult requirement, and the one that I believe holds the greatest weight, concerns the definition of the welfare metric itself. You noted the danger of the majority choosing a metric that ignores the minority, and the related problem that the thing being measured degrades under the effort to maximize it, known as Goodhart's Law. In your student council, if you choose average attendance as the metric, students might show up and sleep in the library, raising attendance but lowering learning. If you choose exam scores, teachers might teach to the test, raising scores but lowering understanding. A workable futarchy requires a welfare metric that is robust to optimization, resistant to gaming, and representative of the true values of the community. This is where I must commit to a difficult truth: I believe that the requirement for a democratically chosen metric and the requirement for a robust, ungameable metric are likely incompatible. Democracies tend to choose simple, measurable metrics because they are easy to agree upon, but complex welfare is rarely reducible to simple numbers without losing essential nuance. If the voters choose a flawed metric, the market will efficiently maximize that flaw, potentially leading to outcomes worse than random chance. Therefore, the integrity of the welfare metric is not just another requirement; it is the single most decisive factor in whether futarchy is viable at all. A perfect market optimizing the wrong thing is more dangerous than an imperfect market optimizing the right thing.

  This leads me to the subset of requirements that cannot be jointly satisfied without significant compromise. You asked me to identify if some requirements are mutually exclusive, and I argue that there is a fundamental tension between the requirement for democratic legitimacy in choosing the welfare metric and the requirement for resistance to Goodharting. To make the metric robust against gaming, it must be complex, opaque, or managed by experts who understand the causal pathways of welfare, but this removes the democratic control that legitimizes the system in the first place. If the students vote on the metric, they will likely choose something simple that can be gamed; if experts choose the metric to prevent gaming, the students may feel the system is rigged against their values. This is not a problem that more liquidity or better contracts can solve; it is a political and epistemological limit. Furthermore, there is a tension between the requirement to prevent sabotage and the requirement for a liquid market. If you restrict who can trade to prevent saboteurs, you reduce liquidity and information aggregation; if you allow open trading to ensure liquidity, you invite those with implementation power to bet against the system. A workable system must navigate this trade-off, likely by accepting lower liquidity in exchange for higher security, which contradicts the standard market prejudice that liquidity is always paramount.

  In distinguishing between non-negotiable requirements and mere prejudices, I must be clear that the demand for total transparency in trading positions is a prejudice, as it can hinder liquidity by exposing strategies, whereas the demand for causal separation between betting and doing is non-negotiable. Similarly, the desire for immediate settlement is a preference of traders, not a requirement of the system, whereas the ability to price counterfactuals is a requirement of the logic. Many proponents of futarchy assume that the market will naturally correct for bad metrics over time, but this is a prejudice derived from financial markets where profit signals true value; in governance, profit signals only metric optimization, which may diverge from value. Therefore, the belief that the market will self-correct the welfare metric is a dangerous prejudice that must be discarded.

  Ultimately, if I must identify the single requirement that does the most to decide whether futarchy is viable, it is the construction of a welfare metric that aligns with true community values without being susceptible to degradation under optimization. Everything else—the liquidity, the conditional contracts, the anti-sabotage measures—is engineering that can be tuned and adjusted. If the metric is wrong, the engineering only makes the failure more efficient. You asked for a definite position, and here it is: futarchy fails if the voters cannot define a good target, because a prediction market is merely an engine, and an engine driving in the wrong direction only gets you to the wrong place faster. Your student council experiment should focus less on the betting mechanism and more on whether you can agree on a definition of success that cannot be cheated. If you cannot solve that in a high school, where the stakes are low and the community is small, it is unlikely to work for a nation where the stakes are high and the community is fragmented. The market can solve the problem of knowledge, but it cannot solve the problem of wisdom, and futarchy requires both to function.
