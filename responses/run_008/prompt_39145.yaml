answer: |-
  ### Position Statement: The Critical Interest Priority

  Before the procedure, you need the philosophical spine. Here is the definite position this protocol rests on:

  **The earlier, competent self retains authority over the narrative arc of their life, provided the current clinical reality matches the *conditions* they sought to avoid.**

  "Happy dementia" does not override a refusal of life in dementia. The competent self's **critical interests** (values, dignity, the kind of life they deem worth living) outweigh the current self's **experiential interests** (momentary pleasure, absence of pain) when the two conflict. To rule otherwise is to assert that a life the patient deemed unacceptable is acceptable simply because the patient no longer remembers why they deemed it unacceptable.

  **Where Authority Ends:** The earlier self's authority ends *only* if the clinical reality has diverged so significantly from the anticipated scenario that the *rationale* for the refusal is nullified (e.g., they refused treatment to avoid pain, but the treatment is painless and restores function they valued). Mere contentment is not a divergence.

  ---

  ### The Procedure: Precedent Authority Protocol (PAP)
  **Time Limit:** 45–60 Minutes
  **Participants:** Ethics Chair (you), Attending, Surrogate(s), Nurse Lead.
  **Materials:** Advance Directive (AD), Medical Chart, Surrogate present.

  #### Step 1: Validity & Authenticity Check (5 Minutes)
  *Goal: Ensure the document represents a competent choice.*
  *   **Question:** Was the AD executed when the patient had capacity, without coercion, and with adequate information?
  *   **Good Enough Answer:** "Yes, it is notarized/witnessed and dates from a period of documented capacity."
  *   **Red Flag:** Evidence of untreated mental illness *at the time of signing* (see Case 3) or coercion.
  *   **Decision Node:** If **Invalid**, stop. Follow Surrogate. If **Valid**, proceed to Step 2.

  #### Step 2: The Specificity Match (10 Minutes)
  *Goal: Determine if the current medical state triggers the directive.*
  *   **Question:** Does the current diagnosis/prognosis match the *conditions* specified in the AD (e.g., "terminal," "permanent unconsciousness," "advanced dementia")?
  *   **Good Enough Answer:** "Yes, the physician certifies the patient meets the clinical criteria listed in the AD."
  *   **Nuance:** If the AD says "Stroke" but the patient has "ALS," ask: *Is the functional outcome worse than, or equivalent to, the feared stroke?*
  *   **Decision Node:** If **No Match** (and outcome is better), Follow Surrogate. If **Match** or **Worse**, proceed to Step 3.

  #### Step 3: The Rationale Audit (15 Minutes)
  *Goal: Uncover the "Why" behind the refusal.*
  *   **Question to Surrogate:** "What did the patient say they were most afraid of? Was it pain? Loss of independence? Being a burden? Not recognizing family?"
  *   **Question to Chart:** Do prior conversations with providers corroborate this fear?
  *   **Good Enough Answer:** A consistent theme emerges (e.g., "She said she'd rather die than not know her grandchildren").
  *   **Decision Node:**
      *   If the current state **violates** that value (e.g., she doesn't know them), **Follow Directive**.
      *   If the current state **preserves** that value (e.g., she knows them, AD was about total loss of recognition), **Follow Surrogate**.
      *   If **Unclear/Ambiguous**, proceed to Step 4.

  #### Step 4: The Burden/Benefit Assessment of the *Current* Self (10 Minutes)
  *Goal: Assess if treatment harms the person in the bed.*
  *   **Question:** Does the proposed treatment (e.g., antibiotics, tube) impose significant physical burden (pain, restraint, hospitalization) on the current patient?
  *   **Good Enough Answer:** "Oral antibiotics: low burden." vs. "Surgical tube with restraints: high burden."
  *   **Question:** Does the patient currently demonstrate consistent distress *or* consistent contentment?
  *   **Decision Node:**
      *   If Treatment is **High Burden** + Patient is **Content**: **Follow Directive** (Do not inflict burden to prolong a life they refused).
      *   If Treatment is **Low Burden** + Patient is **Content**: Proceed to Step 5 (The Hard Hand-off).

  #### Step 5: The "Narrative Break" Test (10 Minutes)
  *Goal: The final values judgment.*
  *   **Question:** Does honoring the AD require us to end a life that is currently experienced as "good" by the patient, based solely on a theoretical standard they can no longer comprehend?
  *   **The Rule:** If Steps 1–3 confirm the AD applies to this state, **Follow Directive**. Current contentment does not invalidate a prior refusal of *this state of being*.
  *   **Exception:** If Step 3 (Rationale) was ambiguous *and* Step 4 shows Low Burden/High Contentment, you may default to **Follow Surrogate** to preserve life, acknowledging this is a concession to uncertainty, not a right.
  *   **Final Output:** A binary recommendation: " Honor AD" or " Honor Surrogate."

  ---

  ### Application to Your Three Cases

  #### Case 1: Moderate Dementia, AD Refuses Antibiotics, Family Wants Treatment
  *   **Step 1 (Validity):** AD valid.
  *   **Step 2 (Match):** AD likely cites "advanced dementia" or "incurable condition." Match confirmed.
  *   **Step 3 (Rationale):** Patient feared "living like a vegetable" or "loss of self." Current state: Moderate dementia. She is "enjoying days," but does she recognize family? If no, the core value is violated.
  *   **Step 4 (Burden):** Antibiotics are low burden. Patient is content.
  *   **Step 5 (Narrative Break):** The patient is in the state they defined as unacceptable. Their current enjoyment is an *experiential interest*, but their prior refusal was a *critical interest* regarding the *type* of life.
  *   **Verdict:** **Follow Directive.**
  *   **Why:** To treat is to prioritize the biological life over the biographical life the patient chose. The "happiness" is real, but it is the happiness of a person the earlier self decided should not exist in this state.
  *   **Outcome:** Family will likely hate this. They see a smiling mother; you see a violated autonomy. You must hold the line.

  #### Case 2: AD Refuses Tube for Stroke, Patient has Degenerative Disease (Worse)
  *   **Step 1 (Validity):** AD valid.
  *   **Step 2 (Match):** AD specifies "Stroke." Patient has degenerative disease (e.g., ALS/FTD).
  *   **Step 3 (Rationale):** Rationale for stroke refusal is typically permanent loss of function/swallowing/interaction. Degenerative disease guarantees this and adds progression.
  *   **Step 4 (Burden):** Feeding tube is high burden (surgical, often requires restraint in dementia).
  *   **Step 5 (Narrative Break):** The condition is functionally equivalent or worse than the trigger. The intent was to avoid permanent dependency.
  *   **Verdict:** **Follow Directive.**
  *   **Why:** This is a "greater includes the lesser" argument. If they refused life support for a temporary recovery chance (stroke), they would refuse it for a guaranteed decline (degenerative).

  #### Case 3: Young Man, Refusal During Untreated Depression, Family Challenges
  *   **Step 1 (Validity):** **FAIL.**
  *   **Analysis:** Capacity requires the ability to reason *and* be free of distorting pathology that negates values. Untreated severe depression is a pathology that alters value structures (hopelessness vs. reality).
  *   **Decision Node:** Stop at Step 1.
  *   **Verdict:** **Follow Surrogate/Treat.**
  *   **Why:** This is not a case of Precedent Autonomy; it is a case of Compromised Competence. The "earlier self" was ill. We treat the depression first; if he refuses again when euthymic, *then* we respect it.

  ---

  ### Where This Procedure Misfires (The Cost of Consistency)

  You asked for honesty about where this breaks. Here is the failure mode you will have to live with:

  **The "Happy Object" Misfire (Case 1 Variant)**
  There will be cases where the patient is not just "content" but clearly flourishing in a way the earlier self could not have imagined. Imagine a patient with an AD refusing life in "severe dementia," who now has severe dementia but has formed deep, joyful bonds with a new partner or finds profound peace in art/music they couldn't access before.
  *   **The Misfire:** The PAP will still tell you to **Follow Directive**.
  *   **The Cost:** You will be recommending the withdrawal of life-sustaining treatment from a patient who is not suffering and is arguably "well" in their current context, based on the judgment of a ghost (the prior self) who cannot know this reality.
  *   **The Family Reaction:** They will accuse you of valuing paper over people. They will say, "You are killing her because she's disabled."
  *   **Your Defense:** You must admit this is the cost of autonomy. If we allow "happiness" to void ADs, we render ADs for dementia useless, because almost all dementia patients can experience moments of joy. We prioritize the right to define one's death over the right to be kept alive in a state one deemed undignified.

  **The "Ambiguous Rationale" Trap**
  In Step 3, families often say, "She just said she didn't want to be a burden." That is vague. Does antibiotics make her a burden? Does a feeding tube?
  *   **The Misfire:** The protocol forces a Default to Directive in ambiguity.
  *   **The Cost:** This can feel legalistic. It prioritizes the *text* of the AD over the *spirit* of the family's knowledge.
  *   **Mitigation:** This is where your 1-hour limit is tight. If the rationale is truly opaque, you must call a full ethics committee meeting, not a bedside consult. Do not let the bedside protocol make a values judgment on ambiguity.

  ### Summary for the Team
  1.  **Presumption:** The AD is the voice of the person. The surrogate is the voice of the family. The patient in the bed is the subject.
  2.  **Hard Line:** Current happiness does not cure prior refusal of *this state*.
  3.  **Exception:** Pathology at the time of signing (Depression) or fundamental mismatch of condition (Stroke AD vs. Broken Hip).
  4.  **Acceptable Harm:** We will sometimes recommend letting a "happy" patient die to honor the life story they authored. This is not a bug; it is the feature of autonomy.
