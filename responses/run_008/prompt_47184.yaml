  *(Self-Correction Note on "Faith"):* Be careful not to dismiss the philosophical point entirely. Hilbert's Program wanted *finitary* consistency. Gentzen's proof uses transfinite induction, which some argue isn't finitary. So there is a sense in which we accept principles we can't prove "safer." But "faith" is too strong a word for "accepting axioms that work."

