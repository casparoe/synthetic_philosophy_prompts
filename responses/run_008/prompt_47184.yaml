      *   *Gentzen:* The base theory is usually PRA (Primitive Recursive Arithmetic). The added principle is Transfinite Induction up to $\epsilon_0$ ($TI(\epsilon_0)$). PRA + $TI(\epsilon_0) \vdash Con(PA)$. Is PRA + $TI(\epsilon_0)$ stronger than PA? In terms of consistency strength, yes. In terms of theorems, they are incomparable in some senses, but usually, we say the proof uses methods *outside* PA.
      *   *Russell vs. Gödel:* Russell = Inconsistency in Naive Comprehension. Gödel = Incompleteness in Consistent Systems. The book conflates "danger of contradiction" with "incompleteness." Incompleteness is the price of avoiding contradiction while retaining strength.

