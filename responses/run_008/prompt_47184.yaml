answer: |-
  Your friend the logician is absolutely right: the passage conflates several distinct technical results into a single dramatic narrative. While it makes for good storytelling, it is technically imprecise in ways that change the philosophical conclusion.

  Since you have a background in first-order logic, I will be specific about the distinctions between systems, provability, and consistency. Here is the sentence-by-sentence autopsy, followed by an explanation of the "1930s proof" (which is real) and a verdict on the "faith" claim.

  ### Part 1: Sentence-by-Sentence Autopsy

  **Sentence 1:** *"Gödel proved in 1931 that any formal system strong enough to do arithmetic cannot prove its own consistency."*

  *   **Verdict:** **Mostly Accurate (with technical caveats).**
  *   **The Logic:** This refers to Gödel's Second Incompleteness Theorem (G2).
  *   **The Nuance:** A logician would add three qualifiers:
      1.  The system must be **consistent** (an inconsistent system proves everything, including its own consistency).
      2.  The system must be **recursively axiomatizable** (you can write a computer program to list the axioms).
      3.  "Strong enough to do arithmetic" usually means it can interpret Robinson Arithmetic ($Q$) or Peano Arithmetic ($PA$).
  *   **Summary:** For a popular book, this is acceptable shorthand, provided you understand it applies to consistent, computable systems like $PA$ or $ZFC$.

  **Sentence 2:** *"So the axioms of mathematics can never be shown to be free of contradiction — not by mathematicians working within the system, and not by anyone else either."*

  *   **Verdict:** **Incorrect.**
  *   **The Logic:** This is the critical error your friend spotted. G2 states that a system $T$ cannot prove $Con(T)$ *within $T$*. It does **not** state that $Con(T)$ is unprovable *simpliciter*.
  *   **The Correction:** We can prove the consistency of weaker systems using stronger systems. For example, Zermelo-Fraenkel Set Theory ($ZFC$) can prove the consistency of Peano Arithmetic ($PA$). We can prove the consistency of $ZFC$ if we assume the existence of an inaccessible cardinal (a large cardinal axiom).
  *   **Why it matters:** The phrase "not by anyone else either" implies absolute unprovability. In logic, consistency is often **relative**. We know $PA$ is consistent *if* $ZFC$ is consistent. The book claims consistency is *absolutely* unprovable, which is false.

  **Sentence 3:** *"Russell's paradox had already shown that a genuine contradiction was lying in wait inside naive set theory, and Gödel generalized the lesson: incompleteness is just what the danger of contradiction looks like once you've patched things up."*

  *   **Verdict:** **Misleading Simplification.**
  *   **The Logic:** Russell's Paradox demonstrated that Naive Set Theory (specifically the Axiom of Unrestricted Comprehension) was **inconsistent**. Gödel's theorems apply to systems that are **consistent**.
  *   **The Correction:** Gödel did not generalize Russell's lesson; he identified a different phenomenon. Russell showed that some axioms lead to $P \land \neg P$. Gödel showed that even if you successfully remove contradictions (patch things up to make a consistent system like $PA$ or $ZFC$), you inevitably lose **completeness** (there will be true statements you can't prove).
  *   **Why it matters:** Incompleteness is not "the danger of contradiction." It is the price of strength. You can have a complete system (like Presburger Arithmetic, which lacks multiplication) or a consistent system, but not both if the system is strong enough.

  **Sentence 4:** *"The upshot is that the consistency of arithmetic is not merely unproven but unprovable in principle, which means the whole edifice of mathematics ultimately rests on faith."*

  *   **Verdict:** **Philosophical Leap / Incorrect.**
  *   **The Logic:** As established in Sentence 2, consistency is not "unprovable in principle"; it is unprovable *within the specific system itself*.
  *   **The Correction:** The claim that math rests on "faith" is a philosophical interpretation, not a logical consequence of G2. In logic, we rely on **relative consistency** and **models**. If we can construct a model of $PA$ inside $ZFC$, we have reduced the certainty of $PA$ to the certainty of $ZFC$.
  *   **Why it matters:** "Faith" implies belief without evidence. Mathematicians have evidence: the construction of models, the lack of contradictions found after a century of intense scrutiny, and the successful application of arithmetic in physics and engineering.

  ---

  ### Part 2: The "1930s Consistency Proof" (Gentzen)

  Your second friend is remembering correctly. This is **Gerhard Gentzen's Consistency Proof of 1936**.

  **What did Gentzen do?**
  Gentzen proved the consistency of Peano Arithmetic ($PA$). He did this using a system that is *different* from $PA$.
  1.  **Base Theory:** He used Primitive Recursive Arithmetic ($PRA$), which is weaker than $PA$.
  2.  **Added Principle:** He added the principle of **Transfinite Induction up to the ordinal $\epsilon_0$**.
  3.  **Result:** $PRA + \text{Induction}(\epsilon_0) \vdash Con(PA)$.

  **Does this contradict Gödel?**
  No. Gödel's Second Theorem says $PA \nvdash Con(PA)$. Gentzen showed that $S \vdash Con(PA)$, where $S$ is a system *other than* $PA$.
  *   $PA$ can prove transfinite induction for any ordinal $\alpha < \epsilon_0$.
  *   $PA$ cannot prove transfinite induction for $\epsilon_0$ itself.
  *   Gentzen's proof relies on a principle ($TI(\epsilon_0)$) that $PA$ itself cannot justify.

  **How does this fix the book's error?**
  The book claims consistency is "unprovable... not by anyone else either." Gentzen is the "someone else." He proved arithmetic's consistency using methods that were, at the time, considered "finitary enough" (though this is debated).
  This demonstrates that **consistency is provable**, provided you are willing to step outside the system and use principles (like transfinite induction) that the system itself cannot verify. It refutes the claim of absolute unprovability.

  ---

  ### Part 3: Does Mathematics "Rest on Faith"?

  Now we can evaluate the book's dramatic conclusion based on the corrected logic.

  **1. The "Absolute Certainty" Argument**
  If "faith" means "absolute, metaphysical certainty that no contradiction will ever be found," then yes, mathematics rests on faith. But so does empirical science, logic itself, and the belief that the external world exists. Gödel did not discover this; it is a feature of axiomatic reasoning. We must always start with *some* unproven axioms.

  **2. The "Blind Belief" Argument**
  If "faith" implies "blind belief without justification," the book is wrong. We do not accept $ZFC$ or $PA$ on faith. We accept them because:
  *   They are **relatively consistent** (we have models of them).
  *   They are **empirically reliable** (they model the physical world).
  *   They are **intuitively compelling** (the axioms match our understanding of sets and numbers).

  **3. The Logical Verdict**
  The book's conclusion relies on Sentence 2 ("unprovable by anyone else"). Since Sentence 2 is false (Gentzen proved it, $ZFC$ proves $Con(PA)$), the deduction that consistency is "unprovable in principle" collapses.
  Therefore, the claim that mathematics rests on "faith" *because of Gödel* is unsupported. Mathematics rests on **axioms**, which are justified by their utility and coherence, not by "faith" in the religious sense.

  ### Summary for Your Presentation

  Here is how you can frame this for your book club:

  1.  **Validate the Drama:** Acknowledge that Gödel's theorems *are* profound and do limit what formal systems can do.
  2.  **Correct the Record:** Point out that the book conflates "unprovable *inside* the system" with "unprovable *at all*." Use the Gentzen example (1936) as concrete evidence that consistency *can* be proven if we use slightly different tools (transfinite induction).
  3.  **Refine "Faith":** Suggest that while we cannot have *absolute* certainty (we have to start somewhere), mathematicians rely on **relative certainty** (Model Theory) rather than faith. We know Arithmetic is consistent *if* Set Theory is consistent.
  4.  **The Takeaway:** Gödel showed that mathematics cannot be its own foundation; it needs a meta-language. But that doesn't mean it's shaky; it just means it's layered.

  **Your Logician Friend's "Separate Claims":**
  To impress your friend, you can note that the author conflated:
  1.  **Inconsistency** (Russell/Naive Set Theory) with **Incompleteness** (Gödel/PA).
  2.  **Internal Provability** (G2) with **Absolute Provability** (The "no one else" claim).
  3.  **Unprovability** with **Philosophical Faith**.

  The book is poetically powerful but logically sloppy. Your job is to keep the wonder of Gödel without accepting the errors.
