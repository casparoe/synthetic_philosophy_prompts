      *   **Task:**
          1.  Identify observations over the next century that would refute the theory (keep it asleep) vs. confirm it (wake it up).
          2.  Address the risk of unfalsifiability (insulation via "dormant").
          3.  Provide a version that "sticks its neck out" (specific predictions).
          4.  Assess the retrospective fit (pre-industrial history) – genuine vs. backward writing.
          5.  Rank candidate defeaters (fatal, awkward, inconvenient).
          6.  Conclude on falsifiability (bug vs. feature of long-run theory).
          7.  **Constraint:** Under 650 words.
          8.  **Constraint:** No bibliography/citations.
          9.  **Tone:** Honest reckoning, analytical.

  2.  **Deconstruct the Theory:**
      *   Core claim: Resource constraints inevitably bind population/wealth unless permanent technological/behavioral shifts occur. Current shifts are temporary.
      *   Risk: "Just wait longer" makes it unfalsifiable.
      *   Retrospective: Pre-industrial stagnation is strong evidence, but is it cherry-picked?

  3.  **Drafting - Section by Section:**

      *   *Refutation vs. Confirmation (Next Century):*
          *   Refutation (Stay Asleep): Decoupling of growth from resource use becomes permanent (e.g., fusion + closed-loop recycling), demographic transition stabilizes globally without collapse, real wages rise indefinitely despite population plateau.
          *   Confirmation (Wake Up): Resource wars, mass starvation despite tech, population collapse due to scarcity (not choice), real wages stagnate/decline globally.

      *   *Falsifiability/Insulation:*
          *   The risk is real. "Dormant" is a get-out-of-jail-free card unless bounded.
          *   To stick neck out: Specify *mechanism* failure. E.g., "By 2100, energy return on investment (EROI) drops below X, causing per capita GDP contraction."
          *   If it collapses into "bad things happen when resources get tight," it's tautological. Needs specific trigger.

      *   *Retrospective Assessment:*
          *   Pre-industrial fit is strong but selective. It ignores periods of significant gain (Song China, Abbasid Golden Age) that didn't trigger Malthusian crashes immediately. It also ignores institutional factors (property rights) vs. pure resource limits. It's partly backward writing, but the broad stagnation trend is hard to deny.

      *   *Ranking Defeaters:*
          *   Fatal: Permanent decoupling of energy/economy (fusion/renewables scale infinitely).
          *   Awkward: Demographic transition holds without scarcity (people choose small families because of culture, not stress).
          *   Inconvenient: Temporary setbacks that recover quickly.

      *   *Conclusion on Falsifiability:*
          *   Is it falsifiable? Yes, if bounded. If unbounded, it's metaphysics.
          *   Bug or Feature? For long-run theory, some slack is necessary, but too much makes it useless.

