  ### 3. The Decisive Test Case

  To separate these rules—specifically to determine if she follows **Rule A/B (Patronage/Outcome)** or **Rule C (Pre-Political Ties)**—you should not test her with a variant of the wedding case (which she already flagged as corrupt due to the gift) or the cousin case (which she flagged due to the worse bid).

