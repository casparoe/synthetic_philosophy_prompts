  Based on your friend's six verdicts, we can reconstruct three distinct ethical frameworks that are all consistent with her past decisions but diverge sharply on the new case.

  ### 1. Reconstructing the Rules

  **Rule A: The "Private Appropriation" Principle**
  *   **Definition:** Corruption occurs only when the official (or their immediate family) converts public office into private wealth or assets. Misallocation of public resources is permissible so long as the official does not personally profit.
  *   **Fit with Record:**
      *   *Cases 1 & 2 (Corrupt):* In Case 1, the cousin (extended family) gains a contract; in Case 2, the officer's family gets a wedding paid for. Both involve private asset transfer.
      *   *Cases 3, 4, 5, 6 (Not Corrupt):* In Case 3, the nephew gets a salary, but it's framed as "small town work" (perhaps viewed as earned/qualified). In Case 6, the village benefits, but the Mayor's pocket does not. Case 4 is trivial value. Case 5 involves no transfer.
  *   **Prediction for New Case:** **Not Corrupt.** The Mayor spends public money on public works; nothing goes into his pocket or his family's.

  **Rule B: The "Public Detriment" Principle**
  *   **Definition:** Corruption occurs when an official decision results in worse public outcomes (higher cost, lower quality, delayed services) *unless* the deviation is mandated by a deep social obligation (kinship, native village).
  *   **Fit with Record:**
      *   *Case 1 (Corrupt):* Worse bid selected (Public Detriment).
      *   *Case 2 (Corrupt):* While the bid was best, the secret payment implies a hidden liability/trust breach (Potential Detriment).
      *   *Case 3 (Not Corrupt):* Qualified hire, post filled (No Detriment).
      *   *Case 6 (Not Corrupt):* Rival village delayed (Detriment), but overridden by "home village" obligation (Social Exception).
  *   **Prediction for New Case:** **Not Corrupt.** The projects are "genuinely useful" and "legal." There is no public waste, only distributional prioritization, which Case 6 suggests is allowed if you are "looking after your own."

  **Rule C: The "Circle of Obligation" Principle**
  *   **Definition:** Corruption is using public resources to reward *transactional* allies (political supporters, donors) rather than fulfilling *pre-political* duties (family, clan, home village). The state must be impartial to strangers, but an official is a patron to their "own."
  *   **Fit with Record:**
      *   *Cases 3 & 6 (Not Corrupt):* Nephew and Home Village are pre-political ties. Favoring them is a duty.
      *   *Cases 1 & 2 (Corrupt):* Case 1 is family (pre-political) but violated the "No Harm" constraint. Case 2 is a transactional swap (gift for contract).
      *   *Case 5 (Not Corrupt):* Impartial service to all (strangers included).
  *   **Prediction for New Case:** **Corrupt.** The beneficiaries are "neighborhoods that voted for him." This is a *political* tie, not a *pre-political* one (like a home village or kin). Rewarding voters with public works is clientelism (transactional), not solidarity (obligatory).

