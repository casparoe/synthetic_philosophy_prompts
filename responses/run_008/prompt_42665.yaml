  *   **How to verify:** Look at the syllabus or slide deck titles. If the slide was titled "Contractualist Objections," give the student full credit for the label.

  ***

  ### ❓ Is there anything to ask the Professor about?

  **Yes, but not about clarity—about technical definitions.**

  The student's writing is clear enough that you don't need to ask *"What did they mean?"* You understand their argument. However, before you finalize the grade, you should verify one thing to protect your own grading grade:

  **Ask:** *"For the peer grading, should we penalize students for conflating 'equal treatment' with 'equal consideration of interests' in Singer's view, or is that treated as shorthand in this course?"*

  **Why?**
  The student wrote: *"we also can't ever treat the two differently in practice."*
  *   **If the answer is "Yes, penalize":** My grade of 8.5 is correct.
  *   **If the answer is "No, that's fine":** The grade should be a 9.5 or 10/10.

  Since your professor is "picky about precision on positions," my hunch is you **should** deduct for that error. But asking that one question ensures you don't lose points on *your* grading assignment for being either too harsh or too lenient on a technicality.

  **Summary Recommendation:**
  Submit the **8.5/10** with the comments above, but **only if** you confirm that Singer's "Consideration vs. Treatment" distinction was emphasized in your specific lectures. If you can't check the notes, stick with the 8.5—it is philosophically more defensible to be precise on Singer than to be loose.
