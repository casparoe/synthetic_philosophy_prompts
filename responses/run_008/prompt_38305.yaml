  ### The Prediction
  Amy will declare the inaudible symphony **genuinely beautiful**.

  ### The Rule She Is Running
  Amy's track record reveals a consistent commitment to **Strong Formalist Realism**. On this view, beauty is an intrinsic, mind-independent property of the object, constituted entirely by its structural features (proportion, economy, resolution of tension). 

  While her judgments align with **Ideal Observer Theory** (the view that beauty is what an ideal, unprejudiced judge *would* approve of) in many instances, the two theories diverge on the inaudible symphony, and her history suggests she prioritizes the former.

  **Why the Rules Diverge on the Symphony:**
  *   **Strong Formalism:** Since the score and spectrographic analysis confirm the presence of the relevant formal properties, the work is beautiful. Perception is merely the means of *detecting* beauty, not a condition for its *existence*. The fact that humans cannot hear it is analogous to the century of neglect in her fifth case: a failure of reception, not a lack of value.
  *   **Ideal Observer Theory:** This theory defines beauty as a disposition to cause a specific response in an ideal judge. Standard aesthetic versions of this theory (Hume, Kant) require sensory contemplation. An ideal *human* judge cannot contemplate a sound they physically cannot hear. If the work is defined by its acoustic realization, the ideal transaction is impossible. Thus, an Ideal Observer theorist should hesitate to call it beautiful, or deem the question category-mistaken.

  **Why Expect Formalism?**
  Amy's justifications are the smoking gun. She consistently cites **objective features** ("proportion, economy") rather than **idealized responses** ("a refined listener would feel..."). 
  *   In **Case 4 (Boredom)**, she admits a defect in herself, which sounds like Ideal Observer theory. However, she uses this to vindicate the *work's* status despite her experience. 
  *   In **Case 5 (Neglect)**, she claims the work was beautiful *all along*. While an Ideal Observer theorist can use counterfactuals ("an ideal judge *would have* liked it"), Amy's language ("collective error") treats the beauty as a fact that existed independently of any possible judgment at the time. 
  *   Most crucially, in **Case 3 (Pop Song)**, she decouples beauty from being "moved." Ideal Observer theories typically ground beauty in a specific kind of pleasure or approval. Amy explicitly rejects the subject's emotional state as the measure, pointing instead to the object's architecture. This suggests she views beauty as a property akin to mass or shape, not a relational disposition.

  ### The Further Case: The "Neurologically Repellent" Pattern
  To definitively distinguish between Strong Formalism and Ideal Observer Theory, you should present Amy with the following scenario, which her record leaves untouched:

  **The Case:** 
  > "Imagine a visual pattern generated by a computer. Mathematically, it possesses perfect symmetry, golden-ratio proportions, and maximal economy of line—every formal feature you cite. However, due to a quirk of human neurology, this specific arrangement of lines triggers an involuntary, visceral nausea or migraine in every human being who looks at it, regardless of training or exposure. It is perceivable, but biologically repellent."

  **How It Distinguishes the Rules:**
  *   **Strong Formalism (Amy's likely view):** She should call it **beautiful**. The formal properties exist intrinsically. The human biological reaction is irrelevant to the object's structure, just as human deafness was irrelevant to the symphony.
  *   **Ideal Observer Theory:** They should call it **not beautiful**. Beauty is tied to a specific valence of experience (approval, pleasure, contemplative satisfaction). If an ideal human judge *cannot* derive satisfaction due to hardwired biological constraints, the object lacks the disposition to be beautiful *for us*.

  If Amy calls the repellent pattern beautiful, she confirms she is a Realist Formalist who believes beauty exists even if it is impossible for humans to appreciate it. If she hesitates or says no, she reveals her Formalism is actually grounded in a hidden Ideal Observer constraint: that formal properties must be *capable* of sustaining human contemplation to count as beauty.
