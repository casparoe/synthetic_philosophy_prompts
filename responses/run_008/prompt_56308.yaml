prompt: |-
  I help decide how a large pool of grant money is split across causes — global health, factory-farm animal welfare, existential risk, and a few others — and the tool we use is the importance–tractability–neglectedness framework: score each cause on importance (the good that would be done if the problem were fully solved), tractability (the share of the problem a fixed increase in resources is expected to remove), and neglectedness (a discount for crowdedness, on the thought that returns diminish as more money and attention arrive in an area); combine the three scores, and rank the causes. Before we lean on this any further — or replace it — I want the specification it is supposed to live up to, written out and justified, not a defense of the incumbent.

  Please write out the desiderata a cause prioritization framework must meet to be adequate for our actual allocation decisions: the cases it must get right, the distinctions it cannot collapse — marginal versus average impact, cause-level versus intervention-level judgments, the difference between a problem being large and a solution to it being underfunded — and the facts about funding markets it must respect, such as diminishing returns, other funders adjusting when we move, and the possibility that an intervention does net harm rather than just less good. For each requirement, give the case or consideration behind it; mark which are non-negotiable and which are conveniences of our particular situation; flag any pair you suspect cannot be jointly satisfied (I would especially like your view on whether a framework can be at once sensitive to diminishing returns and stable under our choosing where to draw the boundaries between causes); and say which single requirement excludes the most plausible rivals. Then, briefly, score the importance–tractability–neglectedness framework as we use it against the list: where it passes, where it fails, and which failure matters most. Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Decision-maker for a large grant pool (Effective Altruism/Global Priorities context).
      *   **Current Tool:** Importance-Tractability-Neglectedness (ITN) framework.
      *   **Task:** Define the *desiderata* (requirements/specifications) a cause prioritization framework *must* meet to be adequate for actual allocation decisions.
      *   **Specific Instructions:**
          *   Write out and justify the desiderata (not a defense of ITN).
          *   Include specific distinctions: marginal vs. average impact, cause-level vs. intervention-level, problem size vs. solution underfunding.
          *   Include market facts: diminishing returns, other funders adjusting, net harm possibilities.
          *   For each requirement: Give the case/consideration, mark as Non-Negotiable (NN) or Convenience (C), flag incompatibilities (especially diminishing returns vs. boundary stability).
          *   Identify which single requirement excludes the most plausible rivals.
          *   Score the current ITN framework against this list (Pass/Fail, most critical failure).
          *   Language: American English.

  2.  **Deconstruct the Desiderata (The "Specification"):**
      *   *Goal:* Allocate marginal dollars effectively.
      *   *Requirement 1: Marginality.* The framework must evaluate the impact of the *next* dollar, not the average dollar. (NN)
      *   *Requirement 2: Counterfactuals/Market Dynamics.* It must account for what other funders would do if we didn't (fungibility/leveraging) and how they react if we do (crowding out). (NN)
      *   *Requirement 3: Risk of Harm.* It must allow for negative expected value (net harm), not just "less good." (NN)
      *   *Requirement 4: Granularity/Level.* It must distinguish between cause areas (broad) and specific interventions (narrow). Aggregation errors occur here. (NN)
      *   *Requirement 5: Diminishing Returns.* It must model the non-linear relationship between funding and impact. (NN)
      *   *Requirement 6: Boundary Stability.* The ranking shouldn't flip-flop wildly based on arbitrary definitions of "causes." (C/NN hybrid - let's call it NN for decision stability).
      *   *Requirement 7: Uncertainty Handling.* It must incorporate uncertainty/risk aversion appropriately. (C/NN - let's lean NN for large pools).

  3.  **Address Specific Tensions/Incompatibilities:**
      *   *Diminishing Returns vs. Boundary Stability:* This is the core tension requested. If returns diminish rapidly, moving a boundary (e.g., splitting "Global Health" into "Malaria" and "Non-Malaria") changes the marginal value calculation significantly. A framework that treats causes as buckets with fixed returns fails here. A framework that models continuous marginal value curves handles this better but is less stable for high-level comparison.
      *   *Cause-Level vs. Intervention-Level:* Aggregating intervention EVs to get cause EVs is mathematically distinct from assessing a cause's "tractability" directly.

  4.  **Identify the "Killer" Requirement:**
      *   Which requirement excludes the most plausible rivals?
      *   Rivals: Simple cost-effectiveness analysis (CEA) without marginality, pure intuition, "Shallow" ITN (averages).
      *   The strongest filter is **Marginality combined with Counterfactuals**. Many frameworks look at *total* good or *average* good. Only those focusing on the *marginal* dollar given the *counterfactual* landscape are adequate for allocation. Let's pinpoint **Marginal Counterfactual Impact** as the single exclusionary requirement.

  5.  **Drafting the Desiderata (Iterative refinement):**

      *   *Desideratum 1: Marginal Impact Assessment.* (NN). Case: We are moving the margin, not funding the whole cause.
      *   *Desideratum 2: Counterfactual Funding Dynamics.* (NN). Case: Other funders exist. If we leave, they might fill the gap. If we enter, they might leave.
      *   *Desideratum 3: Negative Value Possibility.* (NN). Case: Interventions can backfire (e.g., advocacy backlash, unintended consequences).
      *   *Desideratum 4: Intervention-Cause Distinction.* (NN). Case: A cause can be promising on average but have no good marginal interventions left, or vice versa.
      *   *Desideratum 5: Continuous Diminishing Returns.* (NN). Case: Money doesn't buy linear impact.
      *   *Desideratum 6: Boundary Invariance.* (NN). Case: Arbitrarily splitting a cause shouldn't double its priority score.

  6.  **Analyzing the Tension (Diminishing Returns vs. Boundary Stability):**
      *   If I model diminishing returns strictly (Requirement 5), the value of a "cause" depends entirely on how much is already in it. If I redefine the cause boundaries (Requirement 6), the "amount already in it" changes.
      *   *Verdict:* They are in tension. A framework that treats causes as discrete buckets with fixed "neglectedness scores" violates Boundary Invariance when Diminishing Returns are real. To satisfy both, you need a continuous marginal value curve, not a static score.

  7.  **Scoring ITN:**
      *   *Marginality:* Fail (usually treats tractability/neglectedness as static properties, not marginal functions).
      *   *Counterfactuals:* Fail (often ignores replacement funding).
      *   *Negative Value:* Fail (usually assumes positive but diminishing).
      *   *Granularity:* Fail (conflates cause and intervention).
      *   *Diminishing Returns:* Partial Pass (Neglectedness is a proxy, but often static).
      *   *Boundary Stability:* Fail (Sensitive to how causes are carved).
      *   *Most Critical Failure:* Marginality/Counterfactuals (The "Shallow ITN" problem).

  8.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the role and the task.
      *   Section 1: The Specification (Desiderata List).
          *   Format: Requirement, Justification/Case, Status (NN/C).
      *   Section 2: Incompatibilities & Tensions.
          *   Focus on the Diminishing Returns vs. Boundary Stability tension.
      *   Section 3: The Exclusionary Requirement.
      *   Section 4: Audit of ITN.
          *   Pass/Fail per requirement.
          *   Most critical failure.

  9.  **Drafting Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to defend ITN in the first part. Keep it purely prescriptive.
      *   *Correction:* Ensure "American English" spelling (prioritization vs prioritisation, etc.).
      *   *Nuance:* When discussing "Boundary Stability," clarify that *some* sensitivity is okay (if you split a cause, the funding per cause changes), but the *total allocation* to the underlying problem space shouldn't change arbitrarily.
      *   *Refining the "Exclusionary Requirement":* Is it just Marginality? Or Marginality + Counterfactuals? Let's group them as **Marginal Counterfactual Value**. This kills "Average Impact" frameworks immediately.

  10. **Final Review against constraints:**
      *   Did I mark NN vs C? Yes.
      *   Did I flag incompatibilities? Yes.
      *   Did I identify the single exclusionary requirement? Yes.
      *   Did I score ITN? Yes.
      *   American English? Yes.

  11. **Final Polish:** Check tone. It needs to be professional, analytical, and direct, suitable for a grant decision-maker. (Proceed to generate output).

  *(Self-Correction on the "Boundary Stability" tension)*: The prompt asks specifically about "whether a framework can be at once sensitive to diminishing returns and stable under our choosing where to draw the boundaries between causes."
  *Analysis:* If returns diminish, the marginal value depends on total funding. If I split Cause A into A1 and A2, the "total funding" for A1 is lower than A. So the marginal value looks higher. This creates an incentive to gerrymander causes. To fix this, the framework must model the *problem space*, not the *cause label*. This is a hard tension for bucket-based frameworks like standard ITN. I need to be clear about this.

  *(Self-Correction on "Exclusionary Requirement")*: The prompt asks "which single requirement excludes the most plausible rivals."
  *Rivals:* Intuition, Simple CEA, ITN, Moral Weight frameworks.
  *Exclusion:* The requirement for **Marginal Counterfactual Impact** excludes Simple CEA (which often looks at average cost-effectiveness of an intervention without considering funding context) and Intuition. It's the core of EA allocation theory.

