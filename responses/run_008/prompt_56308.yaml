answer: |-
  ### Specification for a Cause Prioritization Framework

  To function as an adequate tool for allocating marginal capital across cause areas, a framework must satisfy the following desiderata. These are derived from the economic and ethical constraints of philanthropic allocation, not from the features of your current tool.

  #### 1. Marginal Impact Assessment
  *   **Requirement:** The framework must estimate the good done by the *next* unit of resources deployed, not the average good done by resources already deployed or the total good done if the problem were solved.
  *   **Case:** You are not funding a cause from scratch; you are moving the margin. A cause may have high average impact (e.g., basic scientific research) but low marginal impact if the lowest-hanging fruit is already picked. Conversely, a cause may have low average impact but high marginal impact if it is currently starved of capital at a critical juncture.
  *   **Status:** **Non-Negotiable.**

  #### 2. Counterfactual Funding Dynamics
  *   **Requirement:** The framework must model the behavior of other funders. It must account for *fungibility* (if you do not fund this, will someone else?) and *displacement* (if you do fund this, will others leave?).
  *   **Case:** In efficient funding markets, your dollars may simply replace dollars that would have been spent anyway (zero counterfactual impact). In inefficient markets, your entry might signal legitimacy, drawing in more capital than you contributed (leveraging). Ignoring this leads to overfunding crowded areas and underfunding areas where you are the "funder of last resort."
  *   **Status:** **Non-Negotiable.**

  #### 3. Possibility of Net Harm
  *   **Requirement:** The framework must allow for negative expected value. It cannot treat "low impact" and "harmful impact" as points on the same positive scale.
  *   **Case:** Interventions can backfire (e.g., advocacy that triggers a backlash, or biosecurity research that lowers barriers to entry for bad actors). A framework that only discounts for crowdedness assumes the worst outcome is zero marginal utility, ignoring the risk of active damage.
  *   **Status:** **Non-Negotiable.**

  #### 4. Intervention-Cause Distinction
  *   **Requirement:** The framework must distinguish between the attractiveness of a broad problem area (cause) and the specific mechanisms available to solve it (interventions). It must prevent aggregation errors where a high-value intervention masks a low-value cause, or vice versa.
  *   **Case:** "Global Health" is a cause; "bednet distribution" is an intervention. A cause may be important and neglected, but if the only available interventions are ineffective, the cause is not fundable. Conversely, a specific intervention may be highly effective but saturated, while other interventions in the same cause remain underfunded.
  *   **Status:** **Non-Negotiable.**

  #### 5. Continuous Diminishing Returns
  *   **Requirement:** The framework must model returns as a continuous, non-linear function of total resources, not as a static discount factor.
  *   **Case:** Impact rarely drops in discrete steps. It usually follows a curve (e.g., logarithmic or sigmoid). A static "neglectedness score" implies a step-function: a cause is either neglected or it isn't. This fails to capture the precise point where an additional dollar yields less than it would elsewhere.
  *   **Status:** **Non-Negotiable.**

  #### 6. Boundary Invariance
  *   **Requirement:** The allocation recommendation should not change significantly based on arbitrary changes to how cause boundaries are drawn.
  *   **Case:** If you split "Animal Welfare" into "Farm Animals" and "Wild Animals," the total money allocated to the combined problem space should remain roughly consistent. If the framework rewards you for splitting a cause into smaller, more "neglected" sub-buckets, it incentivizes gerrymandering categories rather than finding value.
  *   **Status:** **Non-Negotiable.** (Though practically difficult, it is required for stability).

  #### 7. Uncertainty Integration
  *   **Requirement:** The framework must incorporate uncertainty not just as a confidence interval, but as a factor in decision-making (e.g., via risk aversion or value of information calculations).
  *   **Case:** High-variance causes (e.g., existential risk) may have high expected value but low probability of success. A framework that treats a 1% chance of saving a billion lives identically to a 100% chance of saving ten million lives ignores the portfolio needs of a large fund.
  *   **Status:** **Convenience** (Depends on your fund's risk tolerance, but necessary for long-term stability).

  ---

  ### Incompatibilities and Tensions

  **Diminishing Returns vs. Boundary Invariance**
  You asked specifically about the tension between sensitivity to diminishing returns and stability under boundary changes. **These two requirements are mathematically in tension for any bucket-based framework.**

  *   **The Conflict:** If returns diminish, marginal value depends on the *total amount already funded* in a category. If you draw the boundary narrowly (e.g., "Malaria Vaccines"), the total funded is low, so marginal value appears high. If you draw it broadly (e.g., "Global Health"), the total funded is high, so marginal value appears low.
  *   **The Verdict:** A framework cannot be fully sensitive to diminishing returns *and* stable under arbitrary boundary drawing unless it models the **problem space** rather than the **cause label**. It must recognize that "Malaria Vaccines" and "Global Health" share a funding pool. Standard frameworks fail this because they treat causes as silos. To satisfy both, you must abandon discrete cause scores in favor of continuous marginal value curves across a unified landscape of problems.

  **Marginality vs. Tractability Heuristics**
  *   **The Conflict:** "Tractability" is often assessed as a property of the problem (e.g., "Is climate change solvable?"). Marginality requires assessing the property of the *investment* (e.g., "Does *this* dollar solve more of climate change than *that* dollar?").
  *   **The Verdict:** A framework that scores tractability as a static attribute of a cause will inevitably fail marginality.

  ---

  ### The Exclusionary Requirement

  The single requirement that excludes the most plausible rivals (including intuition, simple cost-effectiveness analysis, and moral weighting frameworks) is:

  **Requirement 1: Marginal Impact Assessment (combined with Requirement 2: Counterfactual Dynamics).**

  *   **Why:** Most rivals assess *average* impact (how good is this intervention typically?) or *total* impact (how good would it be if solved?). Only a framework centered on **Marginal Counterfactual Value** forces the user to account for the specific context of *this* dollar, *now*, given *other* funders. This excludes standard Cost-Effectiveness Analysis (which often ignores funding context), "Shallow" ITN (which uses averages), and moral weighting systems (which often rank causes by intrinsic value regardless of funding saturation).

  ---

  ### Audit of the Importance–Tractability–Neglectedness (ITN) Framework

  Here is how your current tool scores against the specification.

  | Requirement | Verdict | Notes |
  | :--- | :--- | :--- |
  | **1. Marginal Impact** | **Fail** | ITN typically scores the *cause*, not the margin. "Tractability" is often assessed as "how solvable is this problem?" rather than "what is the slope of the returns curve at our current funding level?" |
  | **2. Counterfactuals** | **Fail** | Standard ITN does not explicitly model other funders' behavior. It assumes your money is additive, not potentially substitutive. |
  | **3. Net Harm** | **Fail** | ITN scores are typically positive multipliers. There is no standard mechanism in ITN to generate a negative score for interventions that might backfire. |
  | **4. Intervention-Cause** | **Mixed** | ITN is often applied at the cause level. While it *can* be applied to interventions, users frequently conflate the two, assuming a high ITN cause guarantees high ITN interventions. |
  | **5. Diminishing Returns** | **Partial Pass** | "Neglectedness" is a proxy for diminishing returns. However, it is usually treated as a static score (1–10) rather than a continuous function of capital deployed. |
  | **6. Boundary Invariance** | **Fail** | Because Neglectedness depends on how much money is in a "bucket," splitting a bucket makes it look more neglected. ITN is highly sensitive to cause definition. |
  | **7. Uncertainty** | **Partial Pass** | Users often adjust scores for uncertainty, but the framework itself does not mandate a specific method (e.g., expected value vs. risk aversion). |

  #### Most Critical Failure
  **The Failure of Marginality (Requirement 1).**

  This is the most damaging flaw. By treating Importance, Tractability, and Neglectedness as properties of the *cause* rather than functions of the *margin*, the ITN framework encourages you to fund causes that look good on paper (high average impact) but are actually saturated at the margin. It leads to the "shallow ITN" error: funding a cause because it is important and neglected, without asking if the *specific interventions* available at the current funding margin are effective. This disconnect is what allows money to flow into cause areas that are theoretically promising but practically exhausted.

  #### Conclusion
  The ITN framework is a useful heuristic for *screening* broad areas, but it fails the specification for *allocation*. It collapses marginal and average impact, ignores counterfactual funding dynamics, and is unstable under boundary changes. To meet your specification, you would need to replace static scores with marginal value curves that explicitly model the counterfactual behavior of the rest of the funding market.
