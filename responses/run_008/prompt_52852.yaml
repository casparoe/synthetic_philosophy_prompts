answer: |-
  Your intuition is correct: this gloss is not merely a simplification; it is a cascade of philosophical errors that would be rejected by David Lewis, his defenders, and his critics alike. It misstates the principle, misapplies the examples, misdiagnoses the metaphysical problems, and draws a conclusion that does not follow.

  Here is an audit of the gloss, clause by clause, followed by a detailed discussion of your specific questions regarding admissibility, the coin example, and the "moral."

  ### Clause-by-Clause Audit

  **1. "The Principle says that rational degree of belief just is objective chance."**
  *   **Verdict:** **Straight Misrepresentation.**
  *   **Analysis:** The Principal Principle (PP) is a *bridge principle*, not an identity statement. It does not say credence *is* chance ($C = Ch$). It says rational credence should *align* with known chance ($C(A \mid Ch(A)=x) = x$). Lewis was a metaphysical realist about chance (specifically, a Humean reductionist); he believed chance was a feature of the world (the "Best System") that constrains the mind, not a projection of the mind itself.

  **2. "If you know that a setup has a 70% chance of producing outcome A, you must believe A to degree 0.7 — no matter what else you know."**
  *   **Verdict:** **Critical Omission (The Admissibility Error).**
  *   **Analysis:** This is the most technically damaging error in the gloss. Lewis explicitly included an **admissibility condition**. The principle holds only relative to *admissible* evidence. Information about the *outcome* of the event (e.g., seeing the coin land heads) is *inadmissible*. If you know the coin landed heads, your credence should be 1.0, regardless of the chance. The phrase "no matter what else you know" renders the principle mathematically incoherent.

  **3. "So when a fair coin has landed heads nine times in a row, the Principle forbids expecting anything but 50% on the next toss, which is plainly irrational."**
  *   **Verdict:** **Backwards / Endorsement of Fallacy.**
  *   **Analysis:** The gloss claims that maintaining a 50% belief after nine heads is "plainly irrational." This implies the author believes the coin is *due* for tails (the Gambler's Fallacy). In standard probability theory, if the coin is fair (chance = 0.5), rational belief *must* remain 0.5. The PP actually *protects* agents from the Gambler's Fallacy. The book is attacking the PP for enforcing the correct view of independence.

  **4. "Worse, the Principle is circular: Lewis analyzed chance in terms of the credences a rational agent would have..."**
  *   **Verdict:** **Exaggerated Simplification.**
  *   **Analysis:** Lewis analyzed chance via the **Best System Analysis (BSA)**. Chances are the probabilities entailed by the theory that best balances simplicity, strength, and *fit* with the actual history of the world. "Fit" is measured by how well the chances assign high probability to the actual course of events. While this involves probability measures, it is not defined by *our* rational credences. There is a tension here (Lewis called it the "Big Bad Bug"), but it is not a simple definitional circle that invalidates the principle.

  **5. "Lewis's own followers conceded this within a few years and abandoned the idea that chances guide credences..."**
  *   **Verdict:** **False.**
  *   **Analysis:** Philosophers of chance (e.g., Ned Hall, Jenann Ismael, Rachael Briggs) have proposed revisions (like the "New Principle" or "Guiding Principle") to handle technical issues with Lewis's Humeanism. However, the core idea—that objective chance is the "guide to life" for rational credence—remains the orthodoxy. It has been refined, not abandoned.

  **6. "...the moral is that objective chance is nothing over and above long-run frequency."**
  *   **Verdict:** **Non-Sequitur.**
  *   **Analysis:** Even if the PP were flawed, nothing in the previous argument supports frequentism. In fact, the PP is often used to argue *against* strict frequentism, because it allows for single-case chances (a single atom has a 50% chance of decaying, even if it never decays). Lewis was a Humean, which is a sophisticated cousin of frequentism, but the gloss's argument does not lead there.

  ---

  ### Deep Dive: The "No Matter What Else You Know" Clause

  You asked whether this clause omits something essential. **It omits the entire technical mechanism of the principle.**

  Lewis defined **admissible evidence** roughly as information that does not give you "crystal ball" access to the future outcome.
  *   **Admissible:** The laws of nature, the past history of the world, the setup of the experiment.
  *   **Inadmissible:** Knowledge of the specific outcome (e.g., looking at the coin after it lands).

  The Principal Principle is formally stated as:
  $$C_0(A \mid Ch(A) = x \ \& \ E) = x$$
  *Where $E$ is any **admissible** evidence.*

  If you remove the admissibility constraint (as the book does), the principle becomes self-contradictory. If $E$ includes the fact that $A$ occurred, your credence $C_0(A)$ must be 1. But if $Ch(A) = 0.7$, the principle (without the constraint) says your credence must be 0.7. You cannot believe to degree 1 and 0.7 simultaneously.

  By saying "no matter what else you know," the book attributes a contradiction to Lewis, then critiques him for it. A philosopher working on chance would say the admissibility clause is the *most important* part of the principle.

  ### Deep Dive: The Run-of-Heads Example

  You asked whether this example shows a conflict with rational updating or mixes two kinds of evidence. **It mixes two kinds of evidence, but the book's judgment of "irrational" is the real error.**

  The scenario describes a **fair coin**. By definition, a fair coin has a chance of 0.5 for heads on every toss, independent of previous tosses.
  1.  **The Evidence:** We know the chance is 0.5 (from the setup). We also know the past outcomes (9 heads).
  2.  **The Admissibility:** Past outcomes are admissible evidence *regarding the chance*. If the coin landed heads 9 times, should we update our belief that the coin is *fair*?
      *   If we are *uncertain* about the chance (e.g., is this a trick coin?), then 9 heads should make us suspect the chance is not 0.5.
      *   However, the gloss stipulates: "When a **fair coin**..." This fixes the chance at 0.5.
  3.  **The Application:** If the chance is fixed at 0.5, the PP says your credence should be 0.5.
  4.  **The Book's Error:** The book claims expecting 50% is "plainly irrational." This implies the rational expectation should be *lower* than 50% (expecting tails to "balance" the run). This is the **Gambler's Fallacy**.

  The PP does not conflict with rational updating. It demands that if you *know* the objective chance is 0.5, your credence must be 0.5. If you think your credence should be different, you are implicitly admitting you don't actually believe the chance is 0.5. The book confuses *uncertainty about the chance* with *uncertainty about the outcome given the chance*.

  ### Deep Dive: The Closing Moral (Frequency)

  Does the moral follow from the accurate content? **No.**

  1.  **The Argument Fails:** Since the premises (that PP is circular, abandoned, and irrational) are false, the conclusion is unsupported.
  2.  **Frequency vs. Chance:** The "long-run frequency" view (frequentism) struggles immensely with single-case probabilities (e.g., "What is the chance this specific patient survives surgery?"). The Principal Principle was designed precisely to make sense of single-case chances.
  3.  **Lewis's View:** Lewis *was* a reductionist (Humean Supervenience). He believed chances supervene on the total history of categorical events (which includes frequencies). However, he explicitly rejected the idea that chance *is* actual frequency (because a fair coin could land heads 100% in a row by bad luck). He identified chance with the *probabilities in the Best System*, which approximate frequency but are not identical to it.

  The book seems to be arguing: "PP failed, therefore we must be frequentists." But PP is the primary tool modern frequentists (or Humeans) use to explain why frequencies matter to belief. Abandoning PP would actually make frequentism *harder* to defend, not easier.

  ### Summary for the Reader

  The book's gloss is a "straw man" argument. It attacks a distorted version of the Principal Principle that no philosopher accepts.
  *   **What to accept:** The book is right that the relationship between chance and credence is complex and that Lewis's specific formulation faced technical challenges (the "Big Bad Bug").
  *   **What to reject:** The claim that PP equates chance with belief, the claim that it ignores admissible evidence, the claim that it mandates the Gambler's Fallacy (or forbids the rational view), and the claim that it has been abandoned.

  The "moral" that chance is just frequency is a separate metaphysical claim that is not proven by the failures of this gloss. If anything, the enduring relevance of the Principal Principle suggests that objective chance is a robust concept that cannot be eliminated in favor of simple frequency or subjective belief alone.
