  last session is friday and a few of us wanna close with a poem (we did this for the grice unit and weirdly it landed, the professor is into it).

  write me a villanelle on the triviality results. the two refrains should be near-twins: one line saying the probability of the conditional just *is* the conditional probability, and the other saying they can't be, not for all distributions at once. the form should do real work here -- the way a villanelle drags its refrains back around tercet after tercet is exactly the structure of the result, the equation getting reasserted and re-broken each time it returns. by the end the reader should feel why the equality keeps looking fixable for one credence function and always collapses when you demand it in general, and the closing couplet should finally put the two refrain-lines together and land on the trivial residue: the only case where both survive is the empty one where learning A leaves B's probability untouched.

  get the actual philosophy right -- no equations in the poem itself, but someone in my class who's been confused all semester should read it and finally get why the equality is so seductive, and the professor (who knows this literature cold) should not wince. no quotes from the readings, just the ideas rendered in the verse. also please don't make the material conditional do any of the work here, that was last month's fight and we lost it.
