      *   **Adams's Thesis:** $P(A \rightarrow B) = P(B|A)$. This is intuitively very strong. We assert conditionals based on conditional probability.
      *   **Lewis's Argument:** If $A \rightarrow B$ is a proposition (has truth conditions) and Adams's Thesis holds for *all* probability functions (credence functions), then $P(B|A) = P(B)$.
      *   **Implication:** The conditional probability equals the unconditional probability. This means $A$ and $B$ are probabilistically independent.
      *   **Conclusion:** Conditionals cannot be ordinary propositions (truth-apt sentences) if Adams's Thesis is universally valid. Or, if they are propositions, they are "trivial" (only exist in languages where agents don't learn anything from antecedents).
