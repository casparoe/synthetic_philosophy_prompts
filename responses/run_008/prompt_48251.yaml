  *Heritability is a descriptive statistic quantifying the proportion of phenotypic **variance** attributable to genetic **variance** within a specific population at a specific time. It is context-dependent, distinct from developmental determination, and logically disconnected from mean differences between populations or times.*

  **The Competing Rule: The Genetic Potency Rule**
  *Heritability measures the biological "strength" or "importance" of genetic causation. A higher $h^2$ implies genes are more causally potent, and high $h^2$ suggests traits are harder to change or that group differences are likely genetic.*

