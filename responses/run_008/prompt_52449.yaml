      *   Claim: "We agree that welfare facts, if they exist, must be stable across framing conditions." (Transitivist: Yes. Spectrum: Yes, if framing changes the welfare, that's a confound. If framing changes the *report*, that's data. Let's say "stable across irrelevant framing").

