      *(Self-Correction on Verbal Dispute)*: Don't dodge. If I think it's substantive, say it's substantive. I think it's mostly substantive (vagueness vs error), but there is a verbal component regarding "indifference." I will flag the definition of indifference.

      *(Final check on Section 1)*: I need to make sure I don't accidentally endorse Trichotomy.
      *   Claim: "We agree that the 'better than' relation is the primary target of analysis, not 'choice' or 'preference'." (Safe).
