answer: |-
  This is an excellent question. It cuts right to the heart of what axiomatic bargaining theory is actually *doing*, and it is very common for students at your stage to feel exactly the way you do. Your technical understanding of the mechanics (Nash product vs. proportional gains) and the axioms (Individual Monotonicity) is correct.

  However, your framing of the situation as a "refutation" analogous to a "dominated statistical estimator" contains a category error. You are treating normative axioms as if they were empirical hypotheses, and you are treating the bargaining solution as a "true value" to be discovered rather than a modeling choice to be justified.

  Let's unpack your framing carefully, check where the intuition holds and where it breaks, and then explain why the Nash solution remains the workhorse of economics despite the existence of Kalai–Smorodinsky (KS).

  ### 1. The "Dominated Estimator" Analogy
  **Your Framing:** You compare the Nash solution to a statistical estimator that is "dominated." In statistics, if Estimator A has higher variance and higher bias than Estimator B for the same parameter, A is objectively worse. We discard A.
  **The Correction:** In bargaining theory, there is no "true parameter." There is no objective, mind-independent "fair deal" waiting to be measured. The solution *defines* what fairness means in that context.
  *   **Nash** defines fairness as a specific balance of bargaining power derived from risk neutrality and independence of irrelevant alternatives.
  *   **Kalai–Smorodinsky** defines fairness as equal relative concession from the ideal.

  Choosing between them isn't like choosing between a biased and unbiased ruler; it's like choosing between a ruler and a scale. One measures length, the other weight. Neither is "refuted"; they measure different normative concepts.

  ### 2. The Axiomatic Trade-Off (The "Cost" of Monotonicity)
  You identified that Nash violates **Individual Monotonicity (IM)** and KS satisfies it. You framed IM as a "flat-out fairness defect" if violated. This is the crux of the ethical misunderstanding.

  Axioms are not free. The fundamental theorem of this field (roughly speaking) is that **you cannot have both Independence of Irrelevant Alternatives (IIA) and Individual Monotonicity.**

  *   **Nash** keeps **IIA** and **Scale Invariance**, but drops **IM**.
  *   **KS** keeps **IM**, but drops **IIA** (and Scale Invariance, as we will see).

  **Why is IIA valuable?**
  IIA says: If you remove options from the feasible set that *neither player would have chosen anyway*, the solution should not change.
  *   *Intuition:* If we are bargaining over a salary and benefits package, and we remove a "poison pill" option that neither of us wanted, the deal we strike shouldn't suddenly change.
  *   *Nash View:* The solution depends on the *local* shape of the Pareto frontier at the agreement point.
  *   *KS View:* The solution depends on the *global* shape (specifically the ideal points at the far corners).

  Your friend's comment ("expanding the feasible set can shift the ideal points") hints at this. For KS, if the feasible set expands in a way that raises Player 1's maximum possible utility (even if that maximum is unattainable in a fair deal), Player 1's "ideal point" moves. KS adjusts the deal to keep the *ratio* of gains constant. Nash ignores that distant corner entirely.

  Is it "unfair" to ignore the ideal point? Nash would argue: "Why should my payoff change just because a utopian option for you became theoretically available, if we both know we'd never agree to it?"
  Is it "unfair" to respect the ideal point? KS would argue: "If your bargaining potential increased, your leverage increased, even if we don't go all the way to the limit."

  Neither is objectively "correct." They are different ethical commitments.

  ### 3. The Measurement Problem (Scale Invariance)
  This is the most important economic reason why Nash remains the default.

  **The Nash Solution** satisfies **Scale Invariance** (or Independence of Equivalent Utility Representations).
  *   In standard economics, utility is von Neumann-Morgenstern (vNM). It is unique only up to positive affine transformations ($u' = a u + b$).
  *   This means we cannot compare utility *levels* or *units* between people. We can only compare ratios of differences for a *single* person.
  *   The Nash product $(u_1 - d_1)(u_2 - d_2)$ is invariant to these transformations. If I change the units of Player 1's utility, the maximizer remains the same.

  **The Kalai–Smorodinsky Solution** generally **violates Scale Invariance**.
  *   KS requires calculating the "fraction of ideal gain."
  *   To know if Player 1 got 50% of their ideal gain and Player 2 got 50% of theirs, you must be able to measure the "distance" from disagreement to ideal for both players and compare them.
  *   This implies **interpersonal comparability of utility units**. You have to assume that a "util" for Player 1 is comparable to a "util" for Player 2 in a way that standard microeconomics explicitly forbids.

  **Why this matters:**
  If you use KS, you are no longer doing standard welfare economics; you are doing social choice with interpersonal comparisons. You have to ask: *Who defines the utility scale?* If Player 1 exaggerates their utility function (claims they care 100x more about the outcome), KS will shift the deal in their favor to maintain the proportional gain. Nash is immune to this "utility stretching" manipulation.

  For an economist, Nash is "safer" because it respects the ordinal/affine nature of vNM utility. KS requires stronger, often indefensible, assumptions about measuring happiness across people.

  ### 4. The Strategic Foundation (The Nash Program)
  Finally, there is the question of implementation.
  *   **Nash:** We have the **Rubinstein Bargaining Model** (alternating offers with discounting). As the time between offers goes to zero, the subgame perfect equilibrium converges exactly to the **Nash Bargaining Solution**. This gives Nash a "non-cooperative foundation." It explains *how* the agreement might be reached strategically.
  *   **Kalai–Smorodinsky:** There is no equally robust, widely accepted non-cooperative game that implements KS as a unique equilibrium.

  Textbooks prioritize Nash because it bridges cooperative and non-cooperative game theory. It tells a story about *process*, not just *outcome*.

  ### 5. Summary: Reframing the "Default"
  Your framing suggests that axiomatic theory is a search for the **One True Fairness**.
  The expert framing is that axiomatic theory is a **taxonomy of ethical properties**.

  *   If you care about **procedural independence** (removing bad options shouldn't change the deal) and **measurement robustness** (invariance to utility scales), you **must** use Nash.
  *   If you care about **monotonicity** (more potential surplus means no one should lose) and **egalitarian proportions**, and you are willing to assume **interpersonal utility comparisons**, you use Kalai–Smorodinsky.

  **Why Nash is the default:**
  1.  **Measurement:** It works within standard vNM utility (no interpersonal comparisons needed).
  2.  **Strategy:** It has a clear non-cooperative foundation (Rubinstein).
  3.  **Tractability:** The calculus of maximizing a product is often easier than computing ideal points and intersections, especially in $n$-player games.

  **Conclusion:**
  You are not missing a mathematical detail; you are encountering a philosophical trade-off. The Nash solution hasn't been "refuted" any more than Utilitarianism has been "refuted" by Rawlsian Justice. They prioritize different axioms. Nash prioritizes **Scale Invariance and IIA**; KS prioritizes **Individual Monotonicity**.

  In economics, Scale Invariance is usually considered the "harder" constraint to violate because it touches on the definition of utility itself. That is why Nash remains the baseline, and KS is taught as the primary alternative when one is willing to relax the constraints on utility measurement.

  Does this help resolve the tension between your intuition about fairness and the textbook's presentation?
