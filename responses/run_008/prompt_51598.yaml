answer: |-
  This is a sophisticated problem in formal epistemology. You are grappling with the distinction between **updating on evidence** (Bayesian Conditionalization) and **updating on constraints** (Jeffrey Conditioning), complicated by the **source reliability** of the testimony.

  Your intuition is actually sharper than you give it credit for. The reason Case 1 and Case 2 feel structurally identical but demand different reactions is that they are **not** structurally identical in terms of epistemic authority.

  Here is the precise principle that unifies your verdicts, followed by the case-by-case breakdown, the prediction for your new scenario, and the one verdict you need to discard.

  ### The Core Principle: Evidence vs. Reference Class

  To determine how to update on a conditional statement ("If $A$, then odds of $B$ are $X$"), you must classify the speaker's knowledge into one of two categories:

  1.  **Private Evidence (Deferral):** The speaker has access to specific evidence about *this specific instance* that you do not have. (Example: The Doctor with the scan).
      *   **Rule:** Defer fully to their conditional odds. They have screened off your prior with superior data.
  2.  **Statistical Regularity (Aggregation):** The speaker is offering a general statistical rule about a reference class (e.g., "hikers," "patients") that you belong to, but you possess private evidence about *yourself* within that class. (Example: The Local Hiker).
      *   **Rule:** Aggregate. Treat their statement as a likelihood function to be combined with your prior self-knowledge. You move partway, not all the way.

  This distinction resolves your conflict between Case 1 and Case 2.

  ---

  ### Case-by-Case Analysis

  #### Case 1 (Hiking Local) vs. Case 2 (Doctor)
  *   **Your Verdict:** Case 1 = Partial update (2:1). Case 2 = Full update (4:1).
  *   **Analysis:** This is the crux of your puzzle.
      *   **Case 2 (Doctor):** The doctor has a **scan**. This is *Private Evidence*. The scan reveals facts about your specific biology that you cannot access. When the doctor says "If something is wrong, it's 4:1 Condition A," they are reporting the posterior probability derived from that scan. You have no competing evidence. You must defer.
      *   **Case 1 (Local):** The local has **general experience**. They are reporting a statistical regularity about *hikers in general* ("If *one* is on a ridge..."). However, you have private evidence about *your own* hiking style, fitness, and navigation skills. You are not a random sample of "hikers"; you are *you*. Therefore, you should not treat their statistic as absolute truth for your specific case. You combine their general statistic with your specific self-knowledge.
  *   **Principle at Work:** **Reference Class Aggregation.**
  *   **Verdict:** **Both intuitions are correct.** The structural similarity is superficial; the epistemic status of the speaker differs.

  #### Case 3 ("Period" / Certainty)
  *   **Your Verdict:** Move to 100% certainty.
  *   **Analysis:** When a trusted source states a conditional as a logical certainty ("If lost, then Ridge, period"), they are asserting a physical or logical constraint, not a probability. This functions as a boundary condition on your possibility space.
  *   **Principle at Work:** **Logical Constraint.** If $P(\text{Ridge} | \text{Lost}) = 1$, then $P(\text{River} | \text{Lost}) = 0$.
  *   **Verdict:** **Correct.**

  #### Case 4 (Antecedent Probability)
  *   **Your Verdict:** Probability of *getting lost* does not change.
  *   **Analysis:** A conditional statement $P(B|A)$ constrains the relationship between $A$ and $B$, but it does not inherently constrain the marginal probability $P(A)$. Unless the advice implies that the *reason* for the conditional is that $A$ is becoming more likely (e.g., "The trail is dangerous, so if you go, you'll get lost"), the risk of the antecedent remains independent.
  *   **Principle at Work:** **Independence of Antecedent.**
  *   **Verdict:** **Correct.**

  #### Case 5 (Stranger vs. Local)
  *   **Your Verdict:** Ignore the stranger.
  *   **Analysis:** This is simple reliability weighting. If the source reliability weight $w \approx 0$, the update magnitude is $\approx 0$.
  *   **Principle at Work:** **Source Reliability Weighting.**
  *   **Verdict:** **Correct.**

  #### Case 6 (Strong Prior vs. Trusted Local)
  *   **Your Verdict:** Flip-flop (Stay put vs. Trust Local).
  *   **Analysis:** This is the most dangerous case. Your prior (100:1 River) is based on your own terrain analysis ("long valley, no reason to climb"). The Local's advice (3:1 Ridge) is *also* terrain analysis, but from an expert.
      *   If you "stay put," you are assuming your amateur analysis is superior to the expert's.
      *   If you go "1 to 3," you are assuming the expert knows your specific intentions better than you do.
      *   **The Error:** The "Stay Put" intuition is arrogance. The Local is an expert on the *terrain hazards* that cause people to get lost. You are an expert on your *intentions*. However, getting lost is often about terrain traps you don't know exist.
  *   **Principle at Work:** **Expert Deference on Domain Specifics.** On matters of terrain mechanics, the Local dominates. On matters of your own willpower, you dominate. Since "where you drift" is largely terrain-dependent, you must move significantly toward the Local.
  *   **Verdict:** **Unsaveable.** The "Stay Put" intuition is wrong. You should move significantly (e.g., to 1:1 or 1:2), acknowledging the expert knows hazards you don't.

  ---

  ### Prediction: The GPS vs. Local Conflict

  **Scenario:** You have a GPS unit you treat as near-oracular. It gives a conditional prediction (e.g., based on topo data and historical tracks: "If lost, 9:1 River"). The Trusted Local says "If lost, 3:1 Ridge."

  **Prediction:**
  1.  **Classify the GPS:** The GPS is not a "statistical regularity" source like the Local; it is a **Measurement Instrument** (like the Doctor's Scan). It processes specific data (topography, your current track) to generate a probability.
  2.  **Apply the Principle:** Measurement Instruments generally trump Heuristics (Local) in specific instances, *provided* the instrument is functioning correctly.
  3.  **Result:** You should weight the GPS much higher than the Local. The Local is offering a heuristic ("people usually drift downhill"); the GPS is offering a calculation based on the specific geometry of *this* valley.
  4.  **Action:** Update close to the GPS odds (9:1), perhaps discounting slightly for the possibility of signal error or algorithmic bias, but do not split the difference evenly.

  ---

  ### Summary of Principles for Your Toolkit

  1.  **The Deferral Rule:** If the speaker has **private evidence** about the specific case (Doctor, GPS, Eye-witness), adopt their conditional odds fully (within the conditional space).
  2.  **The Aggregation Rule:** If the speaker has **general statistical knowledge** (Local, Actuary, Weatherman) and you have **specific self-knowledge**, update partially. Combine their likelihood with your prior.
  3.  **The Partition Rule (Jeffrey Conditioning):** If the advice constrains a sub-partition (North vs. South Ridge) but says nothing about the complement (Valley), do not change the probability of the complement (Valley stays 50%).
  4.  **The Domain Rule:** In conflicts between your prior and an expert, assess the *domain*. If the outcome depends on facts outside your knowledge (terrain hazards, medical biology), defer to the expert. If it depends on internal states (your intentions, your pain), trust your prior.

  ### Final Diagnosis

  You do not need to discard your reaction to Case 1 or Case 2; the difference is real and justified by the **Evidence vs. Reference Class** distinction.

  However, you must discard the **"Stay Put"** option in **Case 6**. In a conflict between a strong amateur prior and a trusted expert conditional regarding external terrain mechanics, the expert's information value is higher. To stay put is to assume you know the mountain better than the guide, which is the precise definition of the risk you are trying to manage. Move your odds significantly toward the expert, even if you don't go all the way.
