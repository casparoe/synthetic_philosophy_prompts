  ### Where the referee goes wrong

  The referee's fundamental error lies in conflating the locus of stake-sensitivity. Epistemic Contextualism (EC) posits that the truth-conditions of 'knows' shift with the *attributor's* context. Interest-Relative Invariantism (IRI) maintains that 'knows' is invariant, but whether the knowledge relation holds depends on the *subject's* practical interests. By claiming both views merely predict that stakes shift ascribability, the referee ignores whose stakes matter. This conflation renders the views empirically equivalent only in single-context cases. Once we separate the subject's situation from the attributor's, the predictions diverge sharply. The referee treats them as notational variants because they observe the same output in standard cases, failing to see the underlying mechanistic difference regarding who sets the epistemic standard. This is not a minor semantic quibble; it is a substantive disagreement about the metaphysics of knowledge.

  ### The core disagreement

  The core disagreement concerns the semantic content of knowledge ascriptions versus the metaphysical nature of knowledge itself. For the contextualist, 'knows' is indexical, akin to 'tall' or 'here'. The proposition expressed changes depending on the speaker's conversational context. High stakes raise the semantic standard, altering the content expressed. Conversely, the invariantist argues the content remains stable; however, the truth of that content depends on whether the subject meets the relevant epistemic position, which is partly determined by their practical interests. Consequently, EC locates the variability in language, whereas IRI locates it in the world (or the knowledge relation).

  This distinction carries significant theoretical weight regarding disagreement. If two speakers dispute a knowledge claim, EC suggests they may be talking past one another, expressing different propositions. IRI preserves the intuition of genuine disagreement about a single proposition. Furthermore, IRI aligns better with the idea that knowledge is a mental state of the subject, not dependent on the distant attributor's conversational needs. Therefore, they are not merely swapping labels; they offer competing explanations for why ascriptions fail in high-stakes environments. One blames the word; the other blames the knowledge. This divergence dictates how we model epistemic evaluation across different contexts. Ultimately, this determines whether knowledge is a relation between subject and world, or subject, world, and conversational context.

  ### The diagnostic cases

  Diagnostic cases isolate whose stakes drive truth-values. Consider a subject, Hannah, in low stakes, who truly believes the bank is open. An attributor, John, faces high stakes regarding the same bank. For IRI, Hannah knows; John's stakes are irrelevant to her epistemic position. Thus, John's assertion 'Hannah knows' is true, though perhaps unassertable due to prudential norms. For EC, John's high stakes raise the semantic standard for his utterance. Thus, 'Hannah knows' expresses a falsehood in John's mouth, regardless of Hannah's situation.

  Past-tense ascriptions sharpen this. If John later says, 'Hannah knew', EC typically dictates his current standards apply, rendering the claim false. IRI maintains it remains true based on Hannah's past stakes. This tests whether knowledge is fixed at the time of action or reassessed later.

  Eavesdropper cases further separate the views. Suppose an eavesdropper (high stakes) overhears a low-stakes speaker assert 'Hannah knows'. The IRI theorist says the speaker spoke truly, and the eavesdropper should endorse this. The contextualist must say the speaker spoke truly relative to their own context, but the eavesdropper cannot endorse the content without shifting context. This creates a fragmentation of truth that IRI avoids. Furthermore, consider retraction: if the low-stakes speaker later learns of the high stakes, EC predicts they should retract their earlier claim. IRI predicts no retraction is necessary, as the knowledge fact remains unchanged. These cases demonstrate that the views are not empirically equivalent; they yield different truth-value judgments in cross-context scenarios, specifically regarding endorsement and retraction behaviours. The invariantist preserves a stable truth across contexts; the contextualist fractures it.

  ### Where the referee has a point

  The referee is correct that auxiliary pragmatic hypotheses can blur these lines. If contextualists appeal to implicature to explain why low-stakes assertions seem inappropriate in high-stakes contexts, and invariantists appeal to norms of assertion to explain why true knowledge claims shouldn't be voiced, both views can accommodate the same data regarding *assertability*. In ordinary conversation, speakers rarely distinguish between truth and propriety. Consequently, both theories can be tuned to predict identical patterns of speech behaviour in standard cases. This convergence suggests the dispute may be less about observable linguistic data and more about theoretical virtues, such as semantic simplicity versus metaphysical stability. The referee rightly identifies that without careful experimental design targeting truth judgments rather than assertion, the views risk empirical indistinguishability.

  ### What this means for my rebuttal

  Your rebuttal must pivot from assertability to truth-conditions. Do not defend IRI merely on why we speak as we do; defend it on what makes our speech true. Emphasise the cross-context cases where truth judgments diverge. Argue that the referee's 'notational variant' charge fails because the views offer different truth-conditions for third-person ascriptions. Your paper should highlight that preserving a stable truth-value across contexts is a theoretical advantage, not a storm in a teacup.
