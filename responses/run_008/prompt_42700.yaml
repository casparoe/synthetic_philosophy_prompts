answer: |-
  Here is a decision procedure designed for a cognitive/psych stats reviewer who needs to audit evolutionary claims without becoming an evolutionary biologist. It is built for a 4-hour window, relies on checking the authors' work rather than generating new data, and explicitly flags where your statistical intuition is standing in for biological expertise.

  ### The "4-Hour EP Triage" Procedure

  **Goal:** Determine if the evolutionary adaptation claim is *necessary*, *specified*, and *tested against rivals*, or if it is decorative storytelling.

  #### Phase 1: The Necessity & Specificity Screen (30 mins)
  *Read the Abstract and Introduction.*

  1.  **The "So What?" Test:** If you delete every sentence mentioning "ancestral," "adaptive," or "evolutionary pressure," does the main statistical finding or cognitive mechanism collapse?
      *   *Yes:* The claim is central. Proceed to Q2.
      *   *No:* The claim is decorative. **Decision: Recommend "Drop Adaptation Framing."** (The paper is a standard cognitive paper wearing a costume).
  2.  **The Ancestral Problem Specification:** Do the authors define the *specific* ancestral problem the mechanism solves? (e.g., "avoiding teratogens in the first trimester" vs. "being healthy").
      *   *Vague/General:* **Flag as Judgment Call.** (Vague claims are harder to falsify).
      *   *Specific:* Proceed to Q3.
  3.  **The Design Specificity Check:** Does the mechanism look "engineered" for this specific problem, or is it a general-purpose tool doing a job? (e.g., A dedicated nausea trigger vs. general immune response).
      *   *General Purpose:* High risk of byproduct. Proceed to Phase 2.
      *   *Specialized:* Supports adaptation. Proceed to Phase 2.

  #### Phase 2: The Rival Hypotheses Audit (90 mins)
  *Read the Discussion and Literature Review. You are not checking if they are right; you are checking if they acknowledged the competition.*

  4.  **The Byproduct (Spandrel) Test:** Do the authors cite and address the possibility that the trait is a non-adaptive byproduct of another adaptation? (e.g., Nausea as a side-effect of hormonal shifts required for placenta growth, not an adaptation itself).
      *   *Ignored:* **Major Red Flag.**
      *   *Addressed & Ruled Out (theoretically):* Pass.
      *   *Addressed & Admitted as Plausible:* **Decision: Survives with Caveat.**
  5.  **The Learning/Culture Test:** Do the authors address whether this could be learned behavior or cultural transmission rather than a genetic module? (Crucial for sex differences or social behaviors).
      *   *Ignored:* **Major Red Flag.**
      *   *Addressed (e.g., citing cross-cultural variance or developmental data):* Pass.
  6.  **The Mismatch Check:** If the behavior is currently maladaptive (e.g., anxiety disorders), do they argue "mismatch" (adaptive then, not now)?
      *   *Yes:* Do they specify *what* changed in the environment?
      *   *No:* **Flag as Judgment Call.** (Mismatch claims are unfalsifiable without environmental specs).

  #### Phase 3: The Statistical & Predictive Audit (90 mins)
  *Review Methods and Results. This is your home turf.*

  7.  **Prediction vs. Accommodation:** Did they preregister the evolutionary hypothesis, or is it explaining data already collected?
      *   *Preregistered Prediction:* Strong evidence.
      *   *Post-hoc Accommodation:* **Weak evidence.** (Does not warrant rejection, but downgrades confidence).
  8.  **Model Comparison:** Did they statistically compare the Adaptation Model against a Rival Model (e.g., Learning Model)?
      *   *Yes (e.g., BIC/AIC comparison, nested models):* Strong evidence.
      *   *No (Null Hypothesis Significance Testing only):* **Standard for Psych, but limits evolutionary inference.** Proceed to Q9.
  9.  **Effect Size & Robustness:** Is the effect size large enough to have been visible to selection? (This is a heuristic).
      *   *Tiny effect (d < 0.2):* **Flag as Judgment Call.** (Hard to argue selection pressure for tiny effects).
      *   *Robust effect:* Pass.

  #### Phase 4: The Decision Matrix (30 mins)

  *   **Route A (Reject Claim, Keep Paper):** Passes Phase 3 (Stats are solid), Fails Phase 2 (Rivals ignored).
      *   *Action:* "The cognitive finding is robust, but the evolutionary explanation is unsupported. Reframe as a cognitive phenomenon without ancestral claims."
  *   **Route B (Major Revision / Reject):** Fails Phase 1 (Vague) AND Fails Phase 2 (Rivals ignored).
      *   *Action:* "The adaptation claim is a just-so story. Unless you can address [Specific Rival], the claim must be removed."
  *   **Route C (Accept with Caveat):** Passes Phase 1 & 3, Partially Passes Phase 2 (Rivals mentioned but not ruled out).
      *   *Action:* "Accept, but Discussion must explicitly state that [Rival] remains a viable explanation."
  *   **Route D (Editor Escalation):** The paper hinges on biological plausibility you cannot assess (e.g., genetic heritability estimates, neuroendocrinology).
      *   *Action:* "I can validate the stats, but the biological mechanism requires an expert reviewer."

  ---

  ### Honest Flags: Where This Procedure is "Vibes in Disguise"
  *   **Phase 1, Q3 (Design Specificity):** You are guessing what looks "engineered." Cognitive psychologists often mistake complex processing for evolutionary design.
  *   **Phase 3, Q9 (Effect Size):** There is no hard cutoff for "visible to selection." This is you using stats intuition to do biology.
  *   **Phase 2, Q4 (Byproduct):** You are relying on *their* citations. If they miss the key byproduct paper, you might miss it too.

  ---

  ### Running the Procedure on Your Three Submissions

  #### 1. The Morning Sickness Paper (Profet-style Toxin Avoidance)
  *   **User Prior:** Classic suspect.
  *   **Procedure Run:**
      *   *Phase 1:* Specific ancestral problem? Yes (teratogens). Design specificity? Debatable (nausea is a general response).
      *   *Phase 2 (Rivals):* **FAIL.** Most papers in this niche cite the toxin hypothesis but fail to adequately model the *hormonal byproduct* rival (nausea as a side-effect of hCG levels necessary for corpus luteum maintenance). If they treat nausea as a "module" without addressing the endocrinology, they fail Q4.
      *   *Phase 3:* Stats likely fine (correlations between nausea and miscarriage rates).
      *   **Decision:** **Route A (Reject Claim, Keep Paper).**
      *   **The Verdict:** The procedure agrees with your prior. The stats on nausea/miscarriage correlation are likely real, but the *causal evolutionary claim* is unsupported without ruling out the hormonal byproduct hypothesis.
      *   **The Review Line:** "The statistical association between nausea and pregnancy outcomes is robust. However, the adaptation claim requires ruling out the null hypothesis that nausea is a non-adaptive byproduct of necessary hormonal shifts. Without cross-species comparison or endocrine controls, this must be framed as a correlation, not an adaptation."

  #### 2. The Casual Sex / Parental Investment Paper
  *   **User Prior:** Probably fine.
  *   **Procedure Run:**
      *   *Phase 1:* Specific problem? Yes (gamete investment asymmetry). Design specificity? Yes (psychological mechanisms for short-term mating).
      *   *Phase 2 (Rivals):* **PARTIAL PASS.** They likely cite Parental Investment Theory (PIT). Do they cite Social Role Theory or Cultural Transmission? If they ignore culture entirely, they fail Q5. If they mention it but say "PIT explains more variance," they pass.
      *   *Phase 3:* Stats usually solid (large N, sex differences are robust).
      *   **Decision:** **Route C (Accept with Caveat).**
      *   **The Verdict:** This is the case where the paper survives with a caveat you won't enjoy writing. The data supports the sex difference, but the *exclusive* evolutionary framing is too strong.
      *   **The Caveat:** You must force them to add a paragraph acknowledging that cultural transmission and social roles modulate these effects. This waters down their "hardwired" punchline, which they will hate, but it satisfies the "Rival Hypotheses" audit.
      *   **Why this feels annoying:** You know the editors want a clean story. This forces a "It's complicated" story. But the procedure demands it because Q5 (Learning/Culture) is rarely fully ruled out in survey data.

  #### 3. The Survival Processing Effect (Memory)
  *   **User Prior:** Solid experimental work.
  *   **Procedure Run:**
      *   *Phase 1:* Specific problem? Yes (survival relevance). Design specificity? **FAIL (Q3).** Memory is a general-purpose system. Is there a "survival module"? Or is it distinctiveness/arousal?
      *   *Phase 2 (Rivals):* **FAIL (Q4).** The main rival is *elaborative encoding* or *arousal*, not an ancestral memory module. Many of these papers treat "Survival" as the only alternative to "Moving House." They rarely compare against "Emotional Arousal" controls adequately.
      *   *Phase 3:* Stats are solid (within-subject effects are clear).
      *   **Decision:** **Route A (Reject Claim, Keep Paper).**
      *   **The Verdict:** This contradicts your prior slightly. You thought it was "solid." The procedure says the *memory data* is solid, but the *evolutionary claim* is the weak link.
      *   **The Firm Answer:** This is the case where the procedure gives you a firm answer on a tough call. You might feel "But the effect is real!" The procedure says: "The effect is real; the *explanation* is a just-so story."
      *   **The Review Line:** "The survival processing effect is statistically robust. However, attributing this to ancestral selection pressures rather than general cognitive mechanisms (e.g., distinctiveness, arousal, elaborative encoding) is unsupported by the current design. Please reframe as a cognitive processing effect rather than an evolutionary adaptation."

  ---

  ### Where This Procedure Will Misfire

  1.  **The Novelty Trap (Phase 1, Q2):** If a paper proposes a *new* evolutionary hypothesis, there may be no prior literature on "Rivals" yet. The procedure will flag this as "Ignored Rivals" and push for Rejection/Revision.
      *   *Fix:* If the claim is genuinely novel, escalate to Editor (Route D) with a note: "Statistically sound, but evolutionary novelty requires biological expert review."
  2.  **The "Adaptationist Stance" Defense:** Some EP authors argue you don't need to prove adaptation to *use* the heuristic. They will cite Dennett or Pinker.
      *   *Fix:* Your journal is Cognitive/Psych, not Philosophy. Stick to Phase 2, Q4. If they don't test the rival, the claim isn't scientific *in this context*.
  3.  **The Mismatch Black Box (Phase 2, Q6):** "Mismatch" is the ultimate unfalsifiable claim. If they say "It was adaptive then, not now," you can't test "then."
      *   *Fix:* Treat any "Mismatch" claim as a **Judgment Call**. If the environmental change isn't specified (e.g., "sugar was scarce" vs. "environment changed"), downgrade confidence.

  ### Summary for Your Next Review
  You are not reviewing the biology. You are reviewing the **inference**.
  *   If they treat an adaptation claim as a **fact** without testing rivals: **Force a Reframe.**
  *   If they treat it as a **heuristic** and acknowledge rivals: **Let it Slide.**
  *   If the stats are good but the story is just-so: **Keep the Data, Kill the Story.**

  This saves you from needing to know the difference between kin selection and group selection. You only need to know if they *checked their work*.
