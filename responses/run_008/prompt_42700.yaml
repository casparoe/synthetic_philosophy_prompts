          *   *Procedure Outcome:* Likely "Drop the adaptation framing" or "Major Revision." It's a byproduct candidate.
          *   *Constraint Check:* Can't demand new data. So, ask for acknowledgement of the byproduct theory.

      *   **Case 2: Casual Sex / Parental Investment (Buss/Schmitt style).**
          *   *User Prior:* Probably fine.
          *   *Analysis:* Sex differences in sociosexuality are robust. PI theory is the dominant framework. Rival: Social role theory.
          *   *Procedure Outcome:* If they acknowledge social role/cultural variance, it passes. If they say "it's purely genetic adaptation," it fails. Let's make this the "Survives with Caveat" case. The caveat is acknowledging cultural modulation.

      *   **Case 3: Survival Processing Effect (Nairne et al.).**
          *   *User Prior:* Solid experimental work.
          *   *Analysis:* The effect is robust (memory is better for survival contexts). The *evolutionary claim* (ancestral selection) is the weak link. Is it just distinctiveness? Arousal?
          *   *Procedure Outcome:* This is the "Firm Answer on a Tough Case." The experimental data is fine, the evolutionary *explanation* is the "just-so" part. The procedure should force a decoupling: Keep the memory finding, downgrade the ancestral claim.
          *   *Wait, I need to challenge the priors.* The prompt asks me to say if the procedure disagrees.
          *   *Strategy:* Let's make the Survival Processing one the "Drop the framing" case. The memory effect is real, the *evolutionary mechanism* is often underspecified compared to cognitive alternatives (e.g., elaborative encoding). This fits the "stats person" critique well.
          *   *Alternative:* Let's make Morning Sickness the "Reject/Major Revision" (too many byproduct rivals ignored). Let's make Casual Sex the "Fine with Caveat." Let's make Survival Processing the "Solid data, overclaimed mechanism" (Accept but tone down).
          *   *Refinement:* The prompt wants one case where the procedure tells me the paper survives with a caveat I don't enjoy writing. And one where it gives a firm answer on a case where I genuinely couldn't tell.
          *   *Adjustment:*
              *   Morning Sickness: Firm "Drop the claim/Revise" (Byproduct rivals ignored).
              *   Casual Sex: Survives with Caveat (Cultural transmission rivals not fully ruled out, but PI is strong).
              *   Survival Processing: The "Shrug/Editor Decision" or "Firm Answer." Let's make this the one where the procedure forces a "Firm Answer" that contradicts the prior slightly. The prior says "solid." The procedure might say "Solid memory data, unsupported evolutionary claim."

  5.  **Refining the Procedure Steps (Iterative Drafting):**
      *   *Step 1: Necessity.* Does the paper fall apart without the EP claim?
      *   *Step 2: Specification.* Is the ancestral problem defined narrowly?
      *   *Step 3: Rivals.* The "Spandrel/Byproduct/Learning" test.
      *   *Step 4: Prediction.* Preregistration or out-of-sample prediction?
      *   *Step 5: Design.* Functional specificity.
      *   *Decision Matrix:* Map answers to recommendations.

  6.  **Addressing the "Honesty" Constraint:**
      *   Must explicitly state: "This step is a judgment call."
      *   Must acknowledge: "I am a stats person, not a biologist."

  7.  **Addressing the "Misfire" Constraint:**
      *   Where does this fail? Novel hypotheses (can't have prior predictions), cross-disciplinary work (biology + psych).

  8.  **Final Review against Prompt:**
