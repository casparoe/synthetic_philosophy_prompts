      *   **User:** Postdoc, stats expert, reviews for a mid-tier cognitive/psych journal.
      *   **Problem:** Assigned papers with evolutionary psychology (EP) claims due to stats expertise, not EP expertise. Frustrated by "just-so stories." Current reviews are "vibes + Gould & Lewontin citations." Wants a concrete decision procedure.
      *   **Constraints:** ~4 hours per review. No new data collection. No re-running analyses. Needs to distinguish testable adaptation claims from post-hoc storytelling. Needs to handle rival explanations (byproduct, learning, culture). Needs to identify judgment calls vs. checklist items. Needs to know when to recommend "drop framing" vs. "reject" vs. "editor decision."
      *   **Task:**
          1.  Create an ordered decision procedure (checklist/questions).
          2.  Apply the procedure to three specific paper types (Morning Sickness, Casual Sex/Sex Differences, Survival Processing).
          3.  Honor user's priors (Morning Sickness = suspect, Casual Sex = fine, Memory = solid) but allow the procedure to disagree/shrug.
          4.  Include at least one case where the paper survives with an annoying caveat and one where it gives a firm answer on a tough case.
          5.  Flag where the procedure might misfire (e.g., novel claims).

  2.  **Deconstruct the Scientific Problem (Evolutionary Psychology in Cognitive Psych):**
      *   *The Core Issue:* Adaptationism vs. Exaptation/Byproduct/Noise.
      *   *The Standard:* Tinbergen's Four Questions (Function, Mechanism, Ontogeny, Phylogeny). Most psych papers only do Mechanism.
      *   *The "Just-So" Trap:* Post-hoc fitting of a current behavior to an ancestral problem without evidence of design specificity or heritability.
      *   *Rival Hypotheses:* Is it a spandrel (byproduct of something else)? Is it learned (cultural/individual)? Is it a mismatch (adaptive then, maladaptive now)?
      *   *Stats Perspective:* Power, effect sizes, model comparison, preregistration (predictive power vs. explanatory power).

  3.  **Drafting the Decision Procedure (The "4-Hour EP Triage"):**
      *   *Goal:* Actionable, time-bound, acknowledges limitations.
      *   *Structure:* Phased approach (Screening -> Rival Hypotheses -> Evidence Quality -> Framing).
      *   *Key Questions:*
          1.  Is the adaptation claim necessary for the main finding?
          2.  Did they specify the *Selection Pressure* concretely?
          3.  Did they address *Rival Hypotheses* (Byproduct, Learning, Culture)?
          4.  Is there *Design Specificity* (does the mechanism look engineered for *this* problem)?
          5.  *Prediction vs. Accommodation:* Did they predict the data or fit it after?
      *   *Decision Nodes:* Reject, Major Revision (Drop Claim), Accept with Caveat, Editor Escalation.
      *   *Honesty Check:* Explicitly label the "Judgment Calls."

  4.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Morning Sickness (Profet's Hypothesis).**
          *   *User Prior:* Classic suspect.
