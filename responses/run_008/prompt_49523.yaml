      *Revised Principle Idea:* **The Distinction between Constitutive and Modulative Looping.**
      *   Constitutive: The label brings the phenomenon into existence (Fugueurs).
      *   Modulative: The label changes how the phenomenon is lived/expressed, but the phenomenon predates the label (Autism).
