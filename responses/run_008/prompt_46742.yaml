prompt: |-
  been arguing with my brother about who deserves help from the state, and I've noticed I keep giving the same sort of answer, so I want to know if there's an actual rule behind my gut reactions. A woman born with a heart condition that costs a fortune to treat: obviously she should be covered, it's pure bad luck. A bloke who bet his savings on a horse and lost: he shouldn't get taxpayer money to restore his stake, that was his own daft choice. A builder whose back gives out after thirty years of lifting bricks: he should be helped, even though he chose that trade, becuase it's not like he could've known his particular back would go. A smoker who gets lung cancer: I want to say he still deserves full treatment, no question, even though the smoking was a choice and everyone knows the risks. A woman who quit a safe accounting job to try being a painter and is now broke: sympathy, but not much compensation from the state — whereas her friend who stayed in accounting and got made redundant anyway: that friend I'd happily help. And a clever kid born to parents who can't afford tutoring, up against a less able kid with wealthy pushy parents — the second kid's results shouldn't count for more just because of the accident of family.

  My brother says the rule I'm gesturing at is something like "you should be rescued from outcomes you couldn't control, and left to carry the ones you could" — responsibility-tracking or something. But that rule seems to say the smoker doesn't deserve treatment, and maybe that the failed painter deserves nothing at all since she chose badly, and I'm not sure I want to follow it there. Or maybe I should? Is there a principle that gets all my gut verdicts, or close to it? I don't mind being told some of my reactions don't hang together — I'd rather know which ones are the odd ones out than keep a tidy story that fits nothing. If the clean version of the principle forces me to drop one of my verdicts, tell me which and why that one rather than another.

  Also test it on the case we couldn't settle: a man who never buys contents insurance because he'd rather spend the money on gigs, and then gets burgled. My brother says he's exactly like the gambler and should get nothing. I keep flip-flopping — being burgled doesn't feel like the same kind of thing as losing a bet, even though the "he could've protected himself" bit is the same. What does the principle say, and if it says something I'll hate, is that a mark against the principle or against me?
