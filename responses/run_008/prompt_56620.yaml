  2.  **The Outcome Principle:** Blame should scale with the actual harm caused or the success of the action (supported by Verdicts 1 and 2).

  Verdict 3 is the outlier that conflicts with both: it suggests that *good* luck (escaping detection) makes an agent *worse*, whereas Verdicts 1 and 2 suggest *bad* luck (killing someone) makes an agent *worse*.

  To achieve coherence, you must distinguish between **Moral Blame** (an assessment of character and will) and **Social Liability** (an assessment of harm and legal punishment). Here is the repaired principle, the necessary surrender, and the prediction for the grenade case.

  ### The Repaired Principle: The Dual-Aspect Accountability Principle

  **"Moral blame tracks the quality of the will manifested in voluntary action, discounted by constitutive disadvantages; but social liability and punishment track the actual harm caused."**

  This principle splits your concept of "blame" into two distinct tracks to accommodate your intuitions without contradiction.

  #### 1. Mapping Your Verdicts to the Principle

  *   **Verdict 4 (Temperaments) & Verdict 5 (Inside Trading):** These fall under **Moral Blame**.
      *   *Why:* In (4), the brother-in-law has a constitutive disadvantage (temper), which discounts his blame relative to the cold-blooded friend. In (5), you had no opportunity to act; without a voluntary action, there is no manifestation of will, so you bear no moral blame.
      *   *Clause:* "Moral blame tracks the quality of the will... discounted by constitutive disadvantages."

  *   **Verdict 1 (Drunk Drivers) & Verdict 2 (Nurses):** These fall under **Social Liability**.
      *   *Why:* Morally, the drivers and nurses are equally reckless (same will). However, society punishes based on harm to regulate behavior and provide restitution. The killer driver is not *more evil*, but he is *more liable*.
      *   *Clause:* "Social liability and punishment track the actual harm caused."
      *   *Repair:* You must amend your verdict here. You should say the killer is *more punishable*, but not *more blameworthy* in his soul.

  *   **Verdict 3 (Fraudsters):** This requires the **Surrender**.
      *   *Why:* Under the Dual-Aspect Principle, both fraudsters manifested the same corrupt will (Moral Blame = Equal) and caused the same financial harm to victims (Social Liability = Equal).
      *   *The Surrender:* You must surrender the intuition that the successful fraudster is *worse*. His good luck in escaping detection does not increase his moral corruption, nor does it increase the harm done to the victims. You may feel *more anger* toward him because he is unpunished, but that is a demand for justice, not an assessment of his guilt.

  ### Which Verdicts Have to Go?

  To make your system philosophically robust, you must surrender the **moral significance** of Verdicts 1 and 2, and the **comparative severity** of Verdict 3.

  1.  **Surrender the "More Blameworthy" claim in (1) and (2).**
      *   *Reason:* If you maintain that the killer driver is *morally worse* than the lucky driver, you cannot coherently hold Verdict 4 (where the man with the bad temper is *less* blameworthy). In both cases, the agent is fighting against circumstances (external luck in 1/2, internal luck in 4). To be consistent, you must admit that luck should not alter moral worth. Keep the *punishment* difference for pragmatic legal reasons, but discard it as a measure of moral evil.
  2.  **Surrender the "Worse" claim in (3).**
      *   *Reason:* There is no coherent metric where bad luck increases blame (1 & 2) and good luck also increases blame (3). The fraudsters are equally guilty.

  ### The Grenade Case: Prediction and Advice

  **The Case:** Two soldiers throw themselves on what they believe is a live grenade. One dies (live), one lives (dud).

  **Prediction from the Principle:**
  *   **Moral Admiration:** **Equal.** Both manifested the exact same quality of will (supreme self-sacrifice) and exercised the exact same control. Under the "Moral Blame" track of our principle (which applies to praise as well as blame), they are identical.
  *   **Medal/Honor:** **Equal.** While the dead soldier suffered more harm, medals typically honor the *choice* and the *risk undertaken*, not the biological fact of death.

  **Does this follow from the principle?**
  Yes, if you prioritize the **Control Aspect** for praise. However, if you strictly apply the **Outcome Aspect** from Verdicts 1 and 2 (where harm amplifies the moral response), you would have to say the dead soldier is *more* praiseworthy because his sacrifice was "completed" by death.

  **My Advice:**
  You should **refuse the departure**. You should award them equal medals.
  Why? Because Verdicts 1 and 2 (Drunk Drivers/Nurses) are the weak link in your moral architecture. They reflect a legalistic intuition (we punish harm) rather than a moral one (we judge character). In the case of the soldiers, we are judging character and heroism, not assigning liability for damage.

  If you accept that the survivor's medal should be smaller, you are accepting that **Resultant Moral Luck** is real. If you accept that, you must logically accept that the lucky driver in Verdict 1 is *less evil* than the killer, which undermines the retributive justification for punishing him severely.

  **Recommendation:**
  Adopt the **Control Principle** as your primary moral truth.
  *   **Keep:** Verdicts 4 and 5 (Control matters).
  *   **Modify:** Verdicts 1 and 2 (Punishment tracks harm, but moral blame is equal).
  *   **Modify:** Verdict 3 (Guilt is equal).
  *   **Grenade Verdict:** Equal admiration and equal medals.

  This creates a coherent system where a person's moral worth is determined by what they control, while society's response is determined by what happens. This protects the soldier's honor without preventing the law from punishing the drunk driver.
