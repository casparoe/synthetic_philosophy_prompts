  i'm a novelist working on a scene where a doctor has to tell a family their mother is dead whilst her heart is still beating on a ventilator, and in drafts i keep reaching for the same two analogies people seem to use in real life. one has the doctor say the ventilator is like a porch light left on after everyone's moved out — house intact, nobody home. the other has her death be like a fire going out: a process, no exact last flame, so the moment we declare is basically a legal fiction, a grey line drawn on a blur. can you audit both for me? what maps onto what in each (whats the house, whats the fire, and is there a fire brigade at all), where each breaks — for instance does the fire picture survive the fact that a lot of her cells keep working for hours after any declaration you like? — and can either analogy actually carry the weight i want the doctor to put on it, that "when did she die" has a determinate answer, or does one of them quietly undercut that? also please tell me if my scene is on the verge of confusing brain death with a vegetative state, which i'm told is a mistake everyone makes and i dont want it in mine. answer in American English please, even though i've written this in my own spelling.
