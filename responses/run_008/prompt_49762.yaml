      *   **Constraint:** 50-minute discussion section, whiteboard only.
      *   **Deliverables:**
          1.  Dependency Structure (logical flow/order of operations).
          2.  Carrying Example (evaluate the user's proposed 3x3, fix/replace it, ensure it allows for iteration).
          3.  Misconception Map (when to address specific errors).
          4.  Closing Question (tests conceptual understanding vs. arithmetic).
          5.  Scope Boundaries (what to explicitly exclude).

  2.  **Dependency Structure:**
