      *   *Prerequisites:* Need to define strict dominance formally ($u_i(s_i, s_{-i}) > u_i(s'_i, s_{-i}) \forall s_{-i}$). Need to define expected utility of a mixed strategy.
      *   *Flow:*
          1.  Review Pure IESDS (quickly).
          2.  Introduce the limitation (what if no pure strategy dominates?).
          3.  Define Mixed Strategy Dominance (inequality holds against all opponent pure strategies).
          4.  Demonstrate on the Carrying Example (Round 1).
          5.  Show the consequence (Round 2 becomes possible *after* Round 1).
          6.  Discuss implications (Rationalizability/Common Knowledge).
      *   *Critical Decision:* Should I run a full IESDS on a simple matrix *before* introducing mixed? Yes, to activate prior knowledge and highlight the gap.

  3.  **Carrying Example Evaluation:**
      *   *User's Proposal:*
          *   Row Player: T, M, B.
          *   Col Player: L, C, R.
          *   Payoffs (Row):
              *   T: (3, 0, 1)
              *   M: (0, 3, 1)
              *   B: (1, 1, 0.5)
          *   Check: Does $\frac{1}{2}T + \frac{1}{2}M$ dominate B?
              *   vs L: $0.5(3) + 0.5(0) = 1.5 > 1$. (Yes)
              *   vs C: $0.5(0) + 0.5(3) = 1.5 > 1$. (Yes)
              *   vs R: $0.5(1) + 0.5(1) = 1 > 0.5$. (Yes)
          *   *Verdict:* This works perfectly for showing mixed dominates pure.
      *   *Critique:* Is it good for *Iteration*?
          *   If B is eliminated, does that allow Col to eliminate something?
          *   We need Col's payoffs. The user didn't specify them. I need to construct Col's payoffs to make the iteration work.
          *   *Goal for Iteration:* Once B is gone, Col should have a strategy that becomes dominated (either by pure or mixed) which wasn't dominated before.
          *   *Design:* Let's make R dominated for Col *only after* B is removed.
          *   Col Payoffs (L, C, R) against (T, M, B):
              *   T: (0, 0, 0) -> Doesn't help.
              *   Let's try:
                  *   Against T: L=1, C=0, R=0
                  *   Against M: L=0, C=1, R=0
                  *   Against B: L=0, C=0, R=1 (Make R look good against B)
              *   If B is present: R is best against B. L is best against T. C is best against M. No dominance.
              *   If B is removed: Col plays against mix of T/M? No, Col plays against T or M.
              *   Wait, for Col to eliminate R, R must be dominated by something else (say, a mix of L and C) *given Row plays T or M*.
              *   Let's refine Col's payoffs to ensure R is dominated by 0.5L + 0.5C *after* B is gone.
              *   Col Payoffs:
                  *   vs T: L=2, C=0, R=0.5
                  *   vs M: L=0, C=2, R=0.5
                  *   vs B: L=0, C=0, R=2 (Keep R alive initially)
              *   Check Col dominance with B present:
                  *   R vs L: 0.5 < 2 (T), 0.5 > 0 (M), 2 > 0 (B). No pure dominance.
                  *   R vs Mix(L,C):
                      *   vs T: 0.5(2)+0.5(0) = 1 > 0.5. (Mix loses to R).
                      *   So R survives Round 1.
              *   Check Col dominance *after* B eliminated (Row plays T or M):
                  *   Mix 0.5L + 0.5C vs R.
                  *   vs T: 1 > 0.5.
                  *   vs M: 1 > 0.5.
                  *   Now R is dominated by mixed strategy for Col!
              *   *Result:* This creates a nice 2-round elimination where Round 1 requires Mixed (Row), Round 2 requires Mixed (Col).
              *   *Complexity Check:* Is this too much for 50 mins? Calculating mixed dominance for both players might eat time.
              *   *Simplification:* Let's make Round 2 a *pure* dominance for Col to save time, focusing the "mixed" lesson on the Row player first.
              *   *Revised Col Payoffs:*
                  *   vs T: L=1, C=1, R=0
                  *   vs M: L=1, C=1, R=0
                  *   vs B: L=0, C=0, R=2
              *   With B: R is best against B. L/C best against T/M. Nothing dominated.
              *   Without B: R yields 0 against T and M. L (or C) yields 1. R is *purely* dominated by L.
              *   *Decision:* This is better. It shows that eliminating a row (via mixed dominance) unlocks a pure dominance for the column player. It keeps the focus on the Row player's mixed dominance as the "new" concept.

  4.  **Misconception Map:**
      *   *Error 1: "Someone must play the mix."* (Address immediately after showing the math. The mix is a theoretical benchmark, not a prescription.)
      *   *Error 2: "Order doesn't matter."* (Strict dominance order independence is true, but students confuse it with Weak. Still, worth a brief mention that strict is robust.)
      *   *Error 3: "Not dominated = Rational."* (Address at the end. IESDS leaves rationalizable strategies, but not all are NE.)
      *   *Error 4: "Rationality vs. Common Knowledge."* (Address when explaining *why* we can do Round 2. Row knows Col is rational, Col knows Row knows...)
      *   *Timing:*
          *   Error 1: During the "Why do we care?" phase.
          *   Error 4: During the Iteration phase.
          *   Error 3: During the Wrap-up.

  5.  **Closing Question:**
      *   Need to test *why* the mix dominates, not just the calculation.
      *   Idea: Change one payoff slightly so the mix no longer dominates, or ask them to construct a mix.
      *   Better Idea: Ask about the *interpretation*. "If I tell you Row will never play B, does that mean Row will play T 50% and M 50%?" (No).
      *   Best Idea (Conceptual): "Suppose I change B's payoff against R from 0.5 to 1.1. Does the 50/50 mix still dominate? If not, does *any* mix dominate?" This forces them to check the inequality conditions generally, not just plug-and-chug the specific 50/50 example.
      *   *Refinement:* Keep it simpler for a 50-min wrap-up. "Why can we delete B even though no player intends to flip a coin between T and M?"

  6.  **Scope Boundaries:**
      *   *Exclude:* Weak Dominance (order dependence is a can of worms).
      *   *Exclude:* Formal Epistemic Logic (Aumann, etc.).
      *   *Exclude:* Relationship to Nash Equilibrium (beyond "NE survives IESDS").
      *   *Exclude:* Continuous strategy spaces (calculus).

  7.  **Drafting the Plan (incorporating timing):**
      *   0-5: Warm-up/Review (Pure IESDS).
      *   5-15: The Gap (Show example where Pure IESDS gets stuck).
      *   15-30: Mixed Dominance (Define, Calculate on Example, Eliminate B).
      *   30-40: Iteration (Show Col's response, eliminate R).
      *   40-45: Misconceptions/CKR discussion.
      *   45-50: Closing Question & Scope Boundaries.

  8.  **Refining the Example Numbers:**
      *   Row Payoffs (User's):
          *   T: 3, 0, 1
          *   M: 0, 3, 1
          *   B: 1, 1, 0.5
      *   Col Payoffs (My construction for iteration):
          *   Need R to be dominated *after* B is gone.
          *   Need R to *not* be dominated *before* B is gone.
          *   Let's use:
              *   vs T: L=1, C=1, R=0
              *   vs M: L=1, C=1, R=0
              *   vs B: L=0, C=0, R=2
          *   *Check:* With B, R is best response to B. So R isn't dominated. Without B, R gives 0, L gives 1. L dominates R.
          *   *Wait:* Does Col have a dominated strategy *initially*?
              *   L vs C: Identical payoffs. (Weak dominance, avoid).
              *   Let's make L and C slightly different so neither dominates the other initially.
              *   vs T: L=2, C=0, R=0
              *   vs M: L=0, C=2, R=0
              *   vs B: L=0, C=0, R=2
              *   Now, is R dominated initially?
                  *   vs L: 0<2 (T), 0>0 (M), 2>0 (B). No.
                  *   vs Mix(L,C): 0.5(2)+0.5(0)=1 > 0 (T). 0.5(0)+0.5(2)=1 > 0 (M). 0.5(0)+0.5(0)=0 < 2 (B).
                  *   So R is not dominated initially.
              *   After B removed:
                  *   R gives 0 against T and M.
                  *   L gives 2 against T, 0 against M.
                  *   Mix 0.5L + 0.5C gives 1 against T, 1 against M.
                  *   So Mix(L,C) dominates R.
              *   *Problem:* This requires Col to use mixed dominance in Round 2. That might be too heavy for 50 mins.
              *   *Simpler Iteration:* Make R purely dominated by L *after* B is gone.
              *   Col Payoffs:
                  *   vs T: L=1, C=0, R=0
                  *   vs M: L=1, C=0, R=0
                  *   vs B: L=0, C=2, R=2
              *   Initial: R vs L. T(0<1), M(0<1), B(2>0). No dominance.
              *   Post-B: Row plays T or M. L gives 1, R gives 0. L strictly dominates R.
              *   *Perfect.* This keeps the "Mixed" spotlight on Row's Round 1, and uses Round 2 to show the *power* of elimination without adding new calculation complexity.

  9.  **Final Review of the Plan:**
      *   Does it fit 50 mins? Yes, if strict timekeeping.
      *   Is the example clear? Yes, numbers are simple.
      *   Are misconceptions addressed? Yes, mapped to specific segments.
      *   Is the closing question diagnostic? Yes.
      *   Are boundaries clear? Yes.

