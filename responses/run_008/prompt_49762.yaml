answer: |-
  Here is a 50-minute discussion plan structured around your four requirements.

  ### 1. Dependency Structure (The Logical Flow)
  You cannot jump straight to mixed dominance without anchoring it in the logic of strict dominance. The sequence must establish that dominance is about **guaranteed improvement**, not just average improvement.

  1.  **Review Pure IESDS (5 mins):** Briefly solve a 2x2 or 3x3 where pure strategies dominate.
      *   *Goal:* Reactivate the definition: $s_i$ is strictly dominated if $\exists s'_i$ such that $u_i(s'_i, s_{-i}) > u_i(s_i, s_{-i})$ for **all** $s_{-i}$.
      *   *Crucial Detail:* Remind them we only check against the opponent's **pure** strategies. (If you beat all pure strategies, you beat any mixture of them by linearity of expectation).
  2.  **The "Stuck" State (5 mins):** Present the Row player's payoffs from the carrying example *before* showing Col's payoffs. Ask them to find a dominated pure strategy.
      *   *Goal:* They will fail. This creates the cognitive gap. "We know B is bad, but no single row beats it everywhere."
  3.  **Formalizing Mixed Dominance (10 mins):** Define dominance by a mixed strategy $\sigma_i$.
      *   *Definition:* $B$ is dominated if $\exists \sigma_i$ (a probability distribution over $T, M$) such that $E[u_i(\sigma_i, s_{-i})] > u_i(B, s_{-i})$ for all opponent pure strategies $s_{-i}$.
      *   *Visual:* Draw the payoffs of T and M as vectors. Show that B lies "inside" the shape formed by T and M.
  4.  **Execution on Carrying Example (15 mins):** Calculate the specific mixture (50/50) that dominates B. Eliminate B.
  5.  **Iteration (10 mins):** Reveal Col's payoffs. Show that R was safe *only because* B existed. Once B is gone, R becomes dominated (purely or mixed). Eliminate R.
  6.  **Epistemic & Conceptual Wrap-up (5 mins):** Address why we can delete B (Rationality + CKR) and what remains (Rationalizability).

  ---

  ### 2. The Carrying Example
  Your instinct for the Row payoffs is excellent; it is the standard "convex hull" counterexample. However, to make the **iteration** work within 50 minutes, the Column payoffs need to be engineered so that the second round is quick. If Round 2 also requires mixed-strategy calculations for Column, you will run out of time.

  **Recommendation:** Keep your Row payoffs exactly as proposed. Construct Column payoffs so that Round 2 is a *pure* dominance that is unlocked by Round 1.

  **The Matrix (Row, Column):**

  | | **L** | **C** | **R** |
  | :--- | :---: | :---: | :---: |
  | **T** | 3, 1 | 0, 0 | 1, 0 |
  | **M** | 0, 0 | 3, 1 | 1, 0 |
  | **B** | 1, 0 | 1, 0 | 0.5, 2 |

  **Why this works:**
  1.  **Row Round 1:** Exactly as you designed. $0.5T + 0.5M$ yields $(1.5, 1.5, 1)$. This strictly beats $B$'s $(1, 1, 0.5)$. **Delete B.**
  2.  **Column Round 2:** Now Column knows Row will not play B. Column compares L, C, R against only T and M.
      *   Payoff for **R**: 0 against T, 0 against M.
      *   Payoff for **L**: 1 against T, 0 against M.
      *   *Result:* **L strictly dominates R** (1>0 and 0>0 is false... wait, 0=0 is not strict).
      *   *Correction for Strictness:* We need strict dominance for IESDS. Change Col's payoff for L against M to something positive, or ensure R is strictly worse.
      *   *Revised Col Payoffs for Iteration:*
          *   vs T: L=2, C=0, R=1
          *   vs M: L=0, C=2, R=1
          *   vs B: L=0, C=0, R=3
      *   *Re-eval:*
          *   **Row:** $0.5T + 0.5M$ gives 1 vs L, 1 vs C, 1 vs R. B gives 1, 1, 0.5. **B is strictly dominated.** (Delete B).
          *   **Col (after B gone):** R gives 1 vs T, 1 vs M.
          *   Consider Mix $0.5L + 0.5C$ for Col: Gives 1 vs T, 1 vs R. (Tie, not strict).
          *   *Let's try Pure Dominance for Col in Round 2 to save time:*
          *   **Final Proposed Matrix:**
              | | **L** | **C** | **R** |
              | :--- | :---: | :---: | :---: |
              | **T** | 3, **2** | 0, 0 | 1, **0** |
              | **M** | 0, 0 | 3, **2** | 1, **0** |
              | **B** | 1, 0 | 1, 0 | 0.5, **3** |
          *   **Row Analysis:** $0.5T + 0.5M$ yields $(1.5, 1.5, 1)$. B yields $(1, 1, 0.5)$. **B is strictly dominated.**
          *   **Col Analysis (Post-B):** Row plays T or M.
              *   If Row plays T: L=2, R=0.
              *   If Row plays M: L=0, R=0.
              *   *Wait, L doesn't dominate R strictly (0 vs 0).*
              *   *Fix:* Make R strictly worse. Set R's payoff to **-1** against T and M.
              *   **Final-Final Matrix:**
                  | | **L** | **C** | **R** |
                  | :--- | :---: | :---: | :---: |
                  | **T** | 3, 2 | 0, 0 | 1, **-1** |
                  | **M** | 0, 0 | 3, 2 | 1, **-1** |
                  | **B** | 1, 0 | 1, 0 | 0.5, **3** |
          *   **Round 1:** Row deletes B (dominated by 50/50 T/M).
          *   **Round 2:** Col knows B is gone. Against T, L(2) > R(-1). Against M, L(0) > R(-1). **L strictly dominates R.** Delete R.
          *   **Round 3:** Row knows R is gone. T dominates M? No. M dominates T? No. Stop.

  **What the example must have:**
  *   **Lack:** No pure strategy dominating B initially.
  *   **Have:** A convex combination of two strategies that clears the "hurdle" of B's payoffs in every column.
  *   **Have:** A "poison pill" for the opponent (Column R) that looks good only if the dominated strategy (B) is played, ensuring the iteration chain continues.

  ---

  ### 3. Misconception Map
  Place these interventions at specific timestamps to prevent confusion from compounding.

  | Time | Misconception | Intervention Strategy |
  | :--- | :--- | :--- |
  | **Min 15** | **"The player must randomize."** <br> Students think proving a mix dominates B means Row *should* play the mix. | **Explicit Disclaimer:** "We are not telling Row to flip a coin. We are using the mix as a *measuring stick*. If a hypothetical coin flip beats B, then B is logically indefensible, even if Row plans to play pure T." |
  | **Min 25** | **"Check against opponent mixes."** <br> Students think they must check Row's mix against Col's mixed strategies too. | **Board Note:** Write "Theorem: If $\sigma_i$ beats all **pure** $s_{-i}$, it beats all mixed $s_{-i}$." Tell them this is due to linearity of expectation. Do not prove it; assert it to save time. |
  | **Min 35** | **"Rationality vs. CKR."** <br> Students ask why Col can delete R. "What if Row plays B anyway?" | **Epistemic Check:** "Col deletes R only because Col knows Row is rational. Row deletes B only because Row knows Col is rational. This chain requires **Common Knowledge of Rationality**." |
  | **Min 45** | **"Survival = Nash Equilibrium."** <br> Students assume the remaining strategies (T, M, L, C) form a NE. | **Reality Check:** Point out that in the final 2x2, there might be no pure NE (matching pennies style). IESDS yields *rationalizable* strategies, not necessarily equilibrium. |

  **Anticipated Error You Missed:**
  *   **"Dominance by Average."** Students will calculate the average payoff of T and M (e.g., 1.5) and compare it to the average payoff of B (e.g., 0.83) and claim dominance.
  *   **Fix:** Force them to write the inequality three times (once for L, once for C, once for R). Emphasize "For All Columns," not "On Average."

  ---

  ### 4. Closing Question & Scope Boundaries

  **The Diagnostic Question (Last 3 Minutes):**
  Do not ask them to calculate. Ask them to reason about the *condition* for dominance.

  > *"Look at Row's payoffs against Column R. T gets 1, M gets 1, B gets 0.5. Our 50/50 mix got 1. Suppose I change B's payoff against R from 0.5 to **0.9**. The 50/50 mix still dominates (1 > 0.9). Now suppose I change B's payoff against R to **1.1**. The 50/50 mix fails (1 < 1.1). Does this mean B is no longer dominated by **any** mixture of T and M, or just that specific 50/50 one?"*

  *   **Correct Answer:** It might still be dominated by a *different* mixture (e.g., more weight on T if T performed better elsewhere, though in this symmetric example it actually means B is no longer dominated at all).
  *   **What this reveals:** If they say "B is safe," they understand that dominance requires *existence* of a dominating strategy, not just one specific example. If they say "We need to check other mixes," they understand the definition. If they say "1.1 > 1 so B is better," they are reverting to pure strategy thinking.
  *   **Ideal Follow-up:** "In this specific symmetric case, if B beats the mix against R, B cannot be dominated by *any* mix of T and M because T and M are identical against R."

  **Scope Boundaries (What to Explicitly Exclude):**
  Write this on the corner of the board at the start.

  1.  **Weak Dominance:** "We are doing **Strict** Elimination. Weak dominance (where payoffs are equal in some cases) changes the order-dependence of elimination. We are ignoring that today."
  2.  **Epistemic Logic:** "We are using Common Knowledge of Rationality intuitively. We are not writing out the belief hierarchies ($\text{I know that you know that I know...}$)."
  3.  **Continuous Strategies:** "This logic holds for finite matrices. If strategies were continuous (like setting a price), we'd need calculus, but the intuition is the same."

  **TA Script for the Boundary:**
  *"Game Theory is deep. Today we are digging a specific hole: Strict Dominance with Mixed Strategies. If you ask me about Weak Dominance or Nash Equilibrium refinements, my answer will be 'That's for the next lecture.' This keeps us from confusing the logic of elimination with the logic of equilibrium."*
