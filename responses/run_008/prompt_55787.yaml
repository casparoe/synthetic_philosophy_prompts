answer: |-
  To distinguish macrohistorical theory from elaborate curve-fitting, adopt these desiderata for policy-grade validity:

  1.  **Prospective Out-of-Sample Prediction** (Non-negotiable). Motivation: Retrodictions fit noise; policy requires foresight. Fail state: Missing a predicted instability window by >20% or false positives on stability during known crises. Must distinguish genuine forecasts from dressed-up post-dictions.
  2.  **Mechanism Discrimination** (Non-negotiable). Motivation: Policy requires intervenable levers. Aggregate cycle regularity without identifiable causal processes (e.g., measuring elite overproduction independently of unrest) is insufficient. Correlation cannot guide intervention.
  3.  **Cross-Era Operationalization** (Non-negotiable). Motivation: Generalizability. Variables like "state capacity" must be quantified comparably across agrarian and modern contexts without semantic stretching.
  4.  **Small-N Uncertainty Quantification** (Non-negotiable). Motivation: With N≈30, confidence intervals must reflect parameter uncertainty, not just residual variance. Overfitting is the default assumption.
  5.  **Data Endogeneity Correction** (Preference). Motivation: Historical records reflect recorder bias. Bayesian priors should account for source survival bias, though perfect correction is impossible. Rejecting papers solely on this halts the field; acknowledging it improves rigor.
  6.  **Reflexivity Statement** (Non-negotiable). Motivation: Lucas Critique. Publishing instability indicators alters elite behavior. The model must specify if it is self-fulfilling (panic) or self-defeating (prevention).

  **Joint Unsatisfiability:** I agree that Reflexivity and Policy-Grade Prediction are in tension, potentially unreachable simultaneously. If a theory successfully predicts collapse based on specific indicators, rational actors will manipulate those indicators to survive, invalidating the model (Goodhart's Law). A theory cannot be both perfectly predictive and publicly actionable unless it models the counter-measures as part of the dynamics. If it predicts collapse, and policy prevents it, the theory appears falsified. If it doesn't model the prevention, it fails reflexivity. This suggests policy-grade utility may require the theory to remain opaque or accept that successful application looks like prediction failure. To defuse this, the theory must predict the *response* to the prediction, not just the baseline trajectory.

  **The Kill Switch:** Enforcing **Prospective Out-of-Sample Prediction** would reject the majority of current literature. Most cliodynamics remains retrospective curve-fitting on known historical trajectories. Requiring pre-registered forecasts for future decades eliminates papers that merely organize past data without risking falsification on unseen events. Mechanism arguments can always be retrofitted; prediction cannot.
