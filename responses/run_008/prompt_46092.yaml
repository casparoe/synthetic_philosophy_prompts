      *   **Actualists:**
          *   Claim: Possible worlds are abstract representations (sets of sentences, properties).
          *   Argument 1: Parsimony counts *numbers* (ontological extravagance of duplicates).
          *   Argument 2: Lewis's view implies indifference (ethical/existential cost).
          *   Argument 3: Lewis's parsimony metric is ad hoc.
          *   Goal: Preserve intuition about "actualness," minimize ontology.
      *   **The Impasse:** "Incredulous stare" vs. "Circularity charge."

  3.  **Evaluate the "Verbal vs. Substantive" Question:**
      *   *Is it just about the word 'concrete'?* No. If they agreed on all sentences about what exists, they would agree on the structure of reality. But they don't. The Lewisian says there is a concrete counterpart of me typing this. The Actualist says there is not. This looks substantive.
      *   *Is it about theoretical virtues?* Yes. This is the core. They agree on the *data* (modal truths are true, counterfactuals work) but disagree on the *cost* of the explanation.
      *   *User's Hypothesis:* Scientific vs. Metaphysical theory. This is close to the "Systematic Metaphysics" vs. "Descriptive Metaphysics" or "Quinean" vs. "Aristotelian" divide.
      *   *Diagnosis:* It is a *meta-ontological* clash over theoretical virtues (parsimony, ideology vs. ontology, reductive power). It is substantive in that it affects how one constructs *all* metaphysics, but it might be "pragmatically" undecidable.

  4.  **Analyze the Role of 'Concrete':**
      *   For Lewis, 'concrete' means spatiotemporal location and causal potency (within the world).
      *   For Actualists, 'abstract' means causally inert, non-spatiotemporal.
      *   Does the word do work? Yes, because it dictates the *relationship* between the world and the subject. If worlds are concrete, I have counterparts. If abstract, I have representations. This changes the truth conditions of de re modal claims. So, it's not merely verbal.

  5.  **Analyze Parsimony (The Hidden Formal Question):**
      *   Lewis: Qualitative parsimony (kinds) is king. One kind: Concrete World.
      *   Actualists: Quantitative parsimony (tokens) is king. Fewer things: Just this world + abstracta.
      *   *Can a definition settle it?* Unlikely. Why prefer one kind of parsimony? That preference is pre-theoretical. Defining it precisely just makes the disagreement about the *definition* explicit, not resolved.

  6.  **Analyze the Mereological Composition Analogy (UMC):**
      *   *UMC Debate:* Universalists (any fusion exists) vs. Restrictivists (only some fusions exist).
      *   *Similarity:* Both involve ontological inflation vs. intuition. Both rely heavily on theoretical virtues (simplicity, vagueness avoidance).
      *   *Difference:* UMC is often seen as more "verbal" (Sider's quasi-conventionalism). Modal Realism feels more substantive because the *nature* of the entities (concrete vs. abstract) has downstream consequences for causation, identity, and ethics (the "indifference" point).
      *   *Diagnosis via Analogy:* If UMC is verbal/conceptual, Modal Realism might be too. But Lewis insists his view has explanatory power UMC doesn't necessarily claim. The analogy suggests the impasse is due to conflicting *intuitions about existence* driven by theoretical utility.

  7.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the student. Validate the frustration. State the thesis: The dispute is substantive but *meta-ontological*, centering on conflicting theoretical virtues rather than empirical facts.
      *   **Diagnosis 1: Substantive vs. Verbal:** It's not verbal. They disagree on the *furniture* of reality (concrete counterparts vs. abstract sets). The word 'concrete' tracks a real structural difference (causal isolation vs. representation).
      *   **Diagnosis 2: The Core Clash (Theoretical Virtues):** This confirms the user's hypothesis but refines it. It's not Science vs. Metaphysics, but *Systematic Unity* (Lewis) vs. *Commonsense Ontology* (Actualists).
          *   Lewis trades quantitative parsimony for qualitative parsimony + reductive analysis.
          *   Actualists trade qualitative parsimony for quantitative parsimony + modal primitivism (admitting they can't fully reduce modality).
      *   **Diagnosis 3: Parsimony:** A formal definition won't help. The disagreement is about *which* parsimony matters. This is a value judgment, not a logical one.
