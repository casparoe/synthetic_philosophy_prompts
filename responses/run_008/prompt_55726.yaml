answer: |-
  1. The regime presupposes a contributory theory of desert where state support is morally contingent on demonstrable effort, implying that the poor must actively earn their subsistence while the wealthy are presumed to have already satisfied societal obligations. This creates a dual standard where economic security is a right for capital owners but a privilege contingent on behavioral compliance for labor sellers.

  2. This system rests on a voluntarist view of responsibility that treats unemployment primarily as a failure of individual will rather than a structural economic condition, necessitating sanctions to correct alleged shirking. By mandating job applications, the policy assumes that labor market participation is always within the claimant's immediate control, disregarding systemic barriers to entry.

  3. Such conditionality quietly rules out luck egalitarian theories that would compensate individuals for brute bad luck in the labor market without requiring behavioral penance, as well as strict insurance models where past contributions alone dictate entitlement. It also conflicts with human rights frameworks that view subsistence as an inherent dignity rather than a transactional reward for compliance.

  4. The practice is underdetermined regarding reciprocity, as both liberal egalitarians and conservatives might agree on some civic duty to seek work, yet diverge sharply on the severity of sanctions and the definition of reasonable offers. Furthermore, multiple theories could justify exemptions for carers, but the current arbitrary boundaries between eligible and ineligible care work remain unjustified by any single coherent principle.

  5. A regime built on unconditional citizenship entitlements would visibly abolish sanctions and job-search mandates, treating income security as a foundational infrastructure rather than a behavioral lever. This shift would eliminate the administrative bureaucracy dedicated to policing claimant compliance and extend the same autonomy currently enjoyed by dividend recipients to all citizens regardless of employment status.
