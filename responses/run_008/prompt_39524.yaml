          4.  Writing Advice (Phenomenology, Salience, Gestalt).
          5.  Thematic Implications (Trust, Shared Reality).
      *   *Key References:* Anil Seth (Being You), Lisa Feldman Barrett, predictive coding, cognitive penetrability.
      *   *Specific Examples:* Give concrete examples of how to describe the bird sighting.

  6.  **Refining the Content (Self-Correction during drafting):**
