prompt: |-
  I'm a novelist, halfway through my third book, and I've hit a snag that's less about plot than about how minds work, so bear with me.

  The POV character, Maren, is a fairly new birder. Early on a friend tells her a rare warbler has been spotted in the county. After that, Maren starts seeing "the warbler" everywhere — a flick of yellow in the bushes that she'd previously have clocked as a goldfinch, or as nothing at all, now jumps out at her, and twice she genuinely swears she saw the field marks before the bird flew off and it turned out she was wrong. Later she's told the warbler was almost certainly never in the county at all, and the bushes still look warbler-y to her. Her more experienced birding companion, who never believed the sighting, looks at the same hedges and just... sees sparrows.

  My agent says these scenes read as either Maren lying to herself or me being lazy with a dramatic device, because perception doesn't work that way — you see what's there, and belief only comes in afterward, when you interpret. But I wrote them intending the opposite: that what Maren was told literally changes what shows up in her visual experience, that the yellow flick becomes more vivid, more salient, more insistently *there*.

  So, questions. Is my version actually defensible, psychologically and philosophically? Is there a real difference between "her belief changed what she saw" and "her belief changed what she noticed and concluded" — and should I as a writer care which one is true? If the second one is the right story, how would I even rewrite the scenes so the distortion happens at the level of attention or judgment instead — like, how do you show a character mis-judging on the page without just narrating "she judged"? And related: if perception really can be shaped by what you believe, does that make Maren's visual experience less trustworthy in some principled way, or is that fine — her companion certainly throws "you see what you want to see" at her in chapter nine, and I honestly don't know who's suppossed to win that argument. I want to get this right without the book turning into a psych paper, but I also don't want a reviewer catching me doing something no philosopher of mind would let slide.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User:** Novelist, halfway through book three.
      *   **Problem:** A specific plot point involving perception, belief, and birding.
      *   **Conflict:** The agent claims the character's experience (seeing a rare bird due to expectation) is psychologically/philosophically impossible ("you see what's there, belief comes after"). The author believes expectation *changes* the visual experience itself (top-down processing).
      *   **Questions:**
          1.  Is the author's version defensible (psychologically/philosophically)?
          2.  Is there a real difference between "belief changes what is seen" vs. "belief changes what is noticed/concluded"?
          3.  Should the writer care which one is true?
          4.  If the second one is right, how to write it without just narrating "she judged"?
          5.  Does this make the character's perception less trustworthy? Who wins the argument (Maren vs. Companion)?
      *   **Goal:** Get the science/philosophy right without turning the novel into a textbook. Avoid reviewer criticism.

  2.  **Evaluate the Science/Philosophy (Question 1 & 2):**
      *   *Agent's View:* Naive realism. Perception is a camera; cognition is the developer.
      *   *Author's View:* Constructivist/Predictive Processing. Perception is a hallucination controlled by sensory input.
      *   *Current Consensus:* The author is much closer to modern cognitive science than the agent. "Cognitive Penetrability of Perception" is a real debate, but *Predictive Processing* (Bayesian Brain) is the dominant framework. Expectations *do* shape early visual processing, not just late-stage judgment.
      *   *Key Concept:* Top-down processing. The brain predicts what it will see to save energy. If Maren expects a warbler, her brain lowers the threshold for "warbler-like" patterns.
      *   *Distinction:* "Seeing" vs. "Noticing/Judging." Philosophically, this is the "Modularity of Mind" debate (Fodor vs. Churchland/Clark). But phenomenologically (what it *feels* like), the author is right. It *looks* different to her.
      *   *Verdict:* The author's intuition is scientifically defensible. The agent is relying on an outdated model of perception.

  3.  **Address the Writing Craft (Question 3 & 4):**
      *   *Should the writer care?* Yes, because it affects *how* the scene is rendered. If it's just judgment, it's an intellectual error. If it's perception, it's a sensory experience.
      *   *How to write it?* Focus on *phenomenology* (the lived experience). Don't say "she thought it was a warbler." Describe the *salience*. The yellow pops. The shape resolves faster than it should. The brain fills in gaps.
      *   *Technique:* Use sensory language that implies completion. "The wing bar flashed" (when it was just a leaf). "The song clicked into place" (when it was ambiguous noise).
      *   *Rewriting:* Show the *speed* of the identification. Experienced birders identify by gestalt; new birders by checklist. Maren is skipping the checklist because her brain is predicting the gestalt.

  4.  **Address the Character/Theme (Question 5):**
      *   *Trustworthiness:* All perception is untrustworthy in a principled way. We all live in controlled hallucinations.
      *   *The Argument:* The companion isn't necessarily "right" in a philosophical sense, but is right in a *pragmatic* sense (intersubjective verification).
      *   *Resolution:* Don't make it about "truth" vs. "lie." Make it about "shared reality" vs. "private reality." Maren isn't lying; her brain is optimizing for a specific pattern. The companion's brain is optimizing for probability.
      *   *Theme:* This is rich ground for a novel. Desire shapes reality. Grief/Hope shapes perception.

  5.  **Drafting the Response:**
      *   *Tone:* Encouraging, authoritative but accessible, respectful of the craft.
