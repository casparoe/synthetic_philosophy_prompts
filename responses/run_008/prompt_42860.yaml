      *   *Final Question:* Refine for maximum diagnostic power.

  7.  **Refining the "Thermostat" Placement:**
      *   Instructor asked: Beginning (what are we measuring) or End (reductio)?
      *   My analysis: Beginning. If you leave it to the end, the functionalists have already contaminated the Bee/Fish discussion for 30 minutes. You need to inoculate the class against functionalism *before* analyzing the bee.
