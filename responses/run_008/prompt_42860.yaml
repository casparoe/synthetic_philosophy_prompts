          *   *Best:* "If sentience is a dimmer switch rather than an on/off button, does the moral obligation to prevent pain fade gradually or cut off at a specific brightness?"

  6.  **Drafting the Plan (Iterative Refinement):**

      *   *Introduction:* Acknowledge the binary intuition. It's natural but potentially misleading.
