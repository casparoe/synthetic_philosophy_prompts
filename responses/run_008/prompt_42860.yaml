  2.  **Deconstruct Question 1: Structure & Order of Distinctions:**

      *   *Goal:* Move from Binary to Gradient without it feeling like a stipulation.
      *   *Prerequisite 1: Definition.* Students conflate "reacting" with "feeling." Need to separate *Nociception/Function* from *Phenomenology*. If they think a thermostat feels heat, the gradient argument collapses into panpsychism or functionalism.
      *   *Prerequisite 2: Dimensions of Gradation.* "Sentience" isn't one slider. It's multidimensional.
          *   *Intensity:* How loud is the pain?
          *   *Duration:* How long does it last?
          *   *Cognitive Depth/Range:* Can they anticipate? Do they have preferences beyond immediate sensation? (Welfare Range).
      *   *Order:*
          1.  Sentience vs. Non-sentient Response (The On/Off Switch).
          2.  Once "On," *how* is it on? (Intensity/Complexity).
          3.  Moral Implications (Status vs. Weight).
      *   *Constraint:* 50 minutes is tight. Can't do deep metaphysics. Must be conceptual clarity.

  3.  **Deconstruct Question 2: The Carrying Example:**

      *   *Proposed Set:* Thermostat, Honeybee, Fish, Human Infant.
      *   *Critique:*
          *   *Thermostat:* Essential for ruling out functionalism/behaviorism. If placed at the end, it's a reductio. If at the beginning, it sets the baseline. *Verdict:* Beginning. It defines the "Zero Point." If you start with the bee, students might argue the bee is just a biological thermostat. Start with the machine to clear the deck.
          *   *Honeybee:* Good for "minimal sentience" debate.
          *   *Fish:* Good for "vertebrate but simple" intuition.
          *   *Human Infant:* Good for "high capacity but non-verbal."
      *   *Missing:* A clear "Paradigm Sentient" adult human might be useful for contrast, but Infant works better to avoid "rationality" confounds.
      *   *Job of Thermostat:* To establish that *information processing $\neq$ suffering*. It must be the control group.
      *   *Job of Bee/Fish:* To show the gradient *within* the sentient category.
      *   *Recommendation:* Keep the set, but reorder. Thermostat $\rightarrow$ Bee $\rightarrow$ Fish $\rightarrow$ Infant.

  4.  **Deconstruct Question 3: Misconceptions:**

      *   *Predicted:*
          1.  Phylogeny = Moral Status (Human-centric bias).
          2.  Neuron Count = Moral Status (Physicalism reduction).
          3.  Killing Wrongness = Sentience Degree (Status vs. Harm).
