  2.  **Deconstruct the Philosophical Tension:**
      *   The user is grappling with the *Explanatory Gap* and the *Causal Closure of the Physical*.
      *   *The Conflict:* If physicalism is true (brain states cause behavior), and mental states are distinct from brain states, then mental states seem to have no work to do (Epiphenomenalism). If mental states *are* brain states (Identity Theory), then they do have causal power, but the "swapped qualia" intuition becomes incoherent.
