      *   **Recommendation:** Give up the "Zombie/Swapped" intuition *as a description of reality*, treating it instead as a *conceptual trick*.
      *   **The Principle:** **"The Identity Principle."** Mental states are not effects of brain states; they are brain states (or aspects thereof). Therefore, if the brain state causes the action, the mental state causes the action. The "swapped qualia" scenario is metaphysically impossible in the actual world, even if conceivable in imagination.
      *   **Addressing the User's Proposed Principle:** Their principle ("Feelings only matter when talking about feelings") fails because of the swap argument. The Identity Principle fixes this.
