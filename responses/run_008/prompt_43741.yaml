answer: |-
  The hum of the Server Farm was the only sound that mattered during the night shift. It was a low, tectonic vibration that traveled up through the floor grating and settled in the marrow of Venn's shins. She rubbed her eyes, the skin rough under her palms, and stared at the Official Chart.

  It filled the entire curved wall of her station, a sprawling topography of light and number. Every star, every drift-cloud, every solitary buoy in the deep void had its emplacements locked in here. The Bureau of Coordinate Standards did not care what things *were*, only where they *were*. If the Chart said a planet was at Grid-Reference 88-Delta, then for the purposes of navigation, taxation, and causality, it was there.

  Venn took a sip of synthetic coffee. It tasted like copper. On her desk console, a new notification blinked red. Not a standard update. Those were green. Not an error. Those were yellow. Red was for anomalies.

  She tapped the screen. The message was text-only, stripped of headers, sender ID, or timestamp.

  *SUBJECT: MAINTENANCE LOG 449 (UNFILED)*
  *CONTENT: During the cycle shift at 0300, the Substrate in Sector 9 underwent a smooth re-registration. All Matter-States preserved internal vectors. All relative distances preserved. However, the underlying Loci were permuted. The things are in the same shape, but they are not on the same points.*

  Venn blinked. She read it again. The words swam slightly. *the the points were permuted.* She didn't correct the typo in her head; fatigue made her brain skip over glitches like that.

  She pulled up Sector 9. It was a quiet region, mostly empty space dotted with three automated mining stations and a decaying nebula. She ran the diagnostics. The interferometers reported the distance between Station A and Station B was exactly 4.2 million clicks. The angle between Station B and the nebula core was 34.5 degrees. The velocity vectors were stable.

  Everything matched the Chart. Perfectly.

  If the memo was true, the mining stations were still 4.2 million clicks apart, but they were sitting on different pieces of the universe. Like moving a chessboard pattern onto a different table without changing the arrangement of the squares.

  Venn leaned back. The chair creaked. If the Loci—the actual points of the grid—had swapped places with each other, but carried all the matter and energy along with them smoothly, how would anyone know? The instruments measured relations. They measured distance *between* things. They didn't measure distance between a thing and the void itself.

  She flagged the message for deletion, but her finger hovered. She minimized the window instead.

  The next morning, she took the lift up to Supervisor Hark's office. Hark was a man who believed the Chart was not a map of reality, but the source code of it.

  "Sector 9 is stable," Venn said, placing a data slate on his desk.

  "Then why are you here?" Hark didn't look up from his own screen.

  "Received an anomaly report. Claims a substrate slip. A re-registration of emplacements."

  Hark stopped typing. He looked at her over his glasses. "A what?"

  "It says the points moved. The matter stayed relative, but the absolute locations shifted."

  Hark sighed, a sound like air escaping a sealed room. "Venn, look at the Chart. Does the Chart show a shift?"

  "No. The Chart shows everything in the correct relative position."

  "Then there was no shift. The Chart defines the emplacements. If the relations hold, the location is invariant. You can't move the grid without moving the pieces relative to each other. That's Physics 101."

  "But what if the grid moves *with* the pieces?" Venn asked. Her voice sounded too loud in the quiet office. "What if the canvas slid underneath the paint, but the paint didn't crack?"

  Hark stood up. He was taller than her, and he used it. "There is no canvas, Venn. There are only the pieces. Don't waste Bureau resources chasing ghosts in the coordinate system. If you can't measure it, it didn't happen."

  She went back to the night shift. But the hum of the servers sounded different now. It sounded like it was dragging.

  She needed to talk to Yarrow. He was retired, living in the Veterans' Wing of the Bureau housing complex, his mind mostly gone but his memory for the old theories sharp as a razor. He had worked on the Chart before the Great Standardization, back when they still argued about what the grid was made of.

  She found him in the common room, staring at a static screen. He smelled of dust and old paper.

  "Yarrow," she said softly. "Did we used to believe in the Substrate?"

  He turned slowly. His eyes were milky. "The Loci? The Points?"

  "Yes. The places where things happen."

  "Used to?" Yarrow chuckled, a dry rattling sound. "We still do. Or we did. Depends on who you ask. The Bureau says the points are just names. Labels for where things bump into each other."

  "But what if the names changed?" Venn sat opposite him. "What if yesterday, Sector 9 got swapped. Not the stars. The *where*."

  Yarrow leaned forward. "Ah. The Hole. You found the Hole."

  "There's a memo."

  "There's always a memo," Yarrow whispered. "Listen, girl. When I was young, we thought the grid was real. Like a fabric. Heavy. You could tug on it. But then we realized... if you smooth the tug out, if you keep all the distances the same... the fabric doesn't care. The fabric doesn't have eyes."

  "So it didn't happen?"

  "Or it happens all the time," Yarrow said. He tapped his temple. "The question isn't did it happen. The question is, does it matter? If the universe is just the relations, then swapping the points is like changing the serial numbers on the dollars in your wallet. You still have the same money. But if the points are real... if the 'Here' is a real thing, distinct from the 'Thing'..."

  "Then I'm standing in a different place than I was yesterday," Venn said. "Even though the room looks the same."

  "Then you're a different person," Yarrow corrected. "Because you're on a different point."

  Venn left him there. The walk back to the Bureau felt longer than usual. She kept looking at her feet. When she stepped on a tile, was she pressing down on a specific, unique identity of space? Or was the tile only a tile because her foot was on it?

  She became obsessed. It started with small things. She recalibrated the deep-space interferometers, looking for a lag. If the substrate had slipped, maybe there was friction. Maybe the light traveling through the "moved" points would take a different amount of time, even if the distance was the same.

  She filed requests for high-energy particle bursts in Sector 9. She wanted to see if the vacuum energy density changed when the points shifted.

  The requests were denied. *Reason: Redundant. Data matches Chart.*

  She began working off the books. During the night shift, while the supervisors slept, she ran simulations. She created a model of Sector 9. Then she created a second model. In the second model, she applied a smooth function, a gentle warp that moved every event to a neighboring locus within the sector, fading to zero at the boundaries.

  In Model A, the mining station was at Point X.
  In Model B, the mining station was at Point Y.
  But Point Y was exactly where Point X used to be, relative to everything else.

  She ran the physics engines. Both models produced identical outputs. Gravity behaved the same. Light traveled the same. Time dilation was identical.

  She sat in the dark of the server room, the glow of the monitors painting her face blue. She was tired. So tired. Her head felt full of cotton. *she couldnt understand why it hurt.* The typo flashed in her mind, uncorrected.

  If the physics was identical, the difference was metaphysical. It was a ghost. But the Bureau didn't track ghosts. The Bureau tracked coordinates.

  She decided to print them. Physical copies. The Bureau hadn't used paper in decades, but she had access to the archival printer in the basement. It whirred and groaned, spitting out large sheets of heavy stock.

  She printed the Official Chart of Sector 9.
  Then she printed the Shifted Chart.

  She laid them on the floor of the server room. The hum of the machines was deafening now, vibrating in her teeth.

  They looked identical.

  She held them up to the light. The ink patterns were the same. The numbers were the same. The vectors were the same. The only difference was the metadata in the header, which she had manually altered to reflect the theoretical locus shift. But the data itself... the representation of reality... was indistinguishable.

  She picked them up, one in each hand. The paper was heavy, cold.

  If she filed the Shifted Chart, nothing would change. The pilots would fly the same routes. The miners would dig in the same spots. The taxes would be the same. The universe would function exactly as it had before.

  But if the points had identity... if the "Here" was a real thing... then one of these charts was a lie. One of them described the *true* arrangement of the universe, and the other described a counterfeit reality that merely pretended to be real.

  But there was no experiment to tell them apart. There was no instrument that could measure "hereness" without measuring "thereness" relative to something else.

  Venn looked at the two sheets. Her hands shook.

  If she threw one away, she was deciding that the points didn't matter. That only the relations were real. That the canvas was a fiction.
  If she kept both, she was admitting that the Bureau's job was impossible. They were cataloging shadows.

  She thought about Yarrow. *Then you're a different person.*

  She thought about Hark. *If you can't measure it, it didn't happen.*

  She thought about the memo. *Routine maintenance.*

  Maybe it hadn't been an error. Maybe it was a feature. Maybe the universe was constantly shuffling itself, smoothing out the wrinkles, and the Bureau was just there to pretend the numbers stayed still.

  Venn walked to the incinerator chute in the corner of the room. It was a dark maw in the wall, labeled *ARCHIVAL PURGE*.

  She held the Official Chart over the hole. The heat radiating from below warmed her face.
  Then she held the Shifted Chart over the hole.

  They felt the same weight.

  If she burned the Official Chart, she would be fired. Possibly arrested. Falsifying the Record was a capital offense.
  If she burned the Shifted Chart, she was burning a ghost. She was burning nothing.

  But if the points were real, burning the Shifted Chart was burning a universe. It was erasing a valid state of existence where she was standing three inches to the left of where she thought she was.

  She closed her eyes. She tried to feel the floor beneath her boots. She tried to feel the specific identity of the spot she was standing on. Was it *this* spot? Or was it just a spot?

  She couldn't feel it. She could only feel the pressure of her weight. The relation between boot and floor.

  Venn opened her eyes. She looked at the two charts. They were perfectly, terrifyingly silent.

  She slid the Official Chart into her satchel.
  She held the Shifted Chart over the incinerator.

  Her finger hovered over the release lever.

  If she dropped it, she was agreeing with Hark. Relations are all that exist. The canvas is a lie.
  If she kept it, she was agreeing with the memo. The points are real. And she was the only person in history holding proof of a difference that made no difference.

  The hum of the servers surged, a wave of sound that washed over her.

  Venn lowered the chart. She didn't drop it. She didn't burn it. She folded it carefully, creasing the paper along the grid lines, and put it in her pocket, next to the Official one.

  She walked back to her console. The screen was waiting, blank and hungry. She had to file the nightly report. *Status: Nominal.*

  She typed the words. Her fingers felt numb.

  *Status: Nominal.*

  She hit enter.

  Then she sat back, her hands resting on the two folded papers in her lap. She waited for the shift to end. She waited for the sun to come up, or for the grid to slip again, or for nothing to happen at all. She watched the cursor blink on the screen, a steady, rhythmic pulse marking time in a place that might not be there.
