          *   A: Squeeze them in (risk safety). B: Leave them (safety first).
      *   *Drafting Q3 (Imminent Death):* Swimmer sinking now. Boat has slight room but crowded.
          *   A: Rescue immediately. B: Watch to see if they survive.
      *   *Drafting Q4 (Comfortable Swimmer):* Swimmer has a raft, just wants better food.
          *   A: Let them board. B: No, they aren't drowning.
      *   *Drafting Q5 (Swimmers Help):* Swimmers are strong rowers. Boat is tired.
          *   A: Take them (benefit). B: No, they still eat food.
      *   *Drafting Q6 (Passenger Sacrifice):* Boat full. Passenger offers seat to swimmer.
          *   A: Allow it. B: Forbid it (passenger safety is collective duty).
      *   *Drafting Q7 (Luxury Cargo):* Boat full. Heavy furniture onboard. Swimmer dying.
          *   A: Dump furniture, take swimmer. B: Keep furniture, leave swimmer.
      *   *Drafting Q8 (Historical Timber):* Swimmers cut the wood for the boat years ago, weren't paid.
          *   A: They have a right to board. B: Past is past, safety first.
      *   *Drafting Q9 (Chain Reaction):* Taking one swimmer signals others to come.
          *   A: Take the one anyway. B: Don't take the one (prevents rush).
      *   *Drafting Q10 (Uncertain Capacity):* Captain says full, but passengers think there's room.
          *   A: Trust passengers, make room. B: Trust Captain, stay safe.

      *   *Refining for Distinction:* I need to ensure the options clearly separate the four target positions.
      *   *Refining Q6 (Sacrifice):* Hardin would say no (collective safety). Singer would say yes (if cost is seat, benefit is life). Communitarian might say no (duty to group).
      *   *Refining Q9 (Signal):* This tests the "slippery slope" argument Hardin uses.
      *   *Refining Q10 (Authority):* Tests the "capacity is constructed" view.

      *   *Review against constraints:* All on water? Yes. Concrete actions? Yes. No labels? Yes.

  4.  **Step 3: Develop the Scoring Key:**
      *   Need to map patterns to the four positions:
          1.  **Strict Hardin:** Prioritize boat safety, fixed capacity, no sacrifice, cargo stays.
