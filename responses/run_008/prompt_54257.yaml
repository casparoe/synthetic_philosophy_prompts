answer: |-
  ### Part 1: Mapping the Logical Space

  Before writing the quiz, we must identify where the disagreement actually lives. People often argue about labels ("conservative," "liberal," "humanitarian") when they actually agree on the facts, or they use the same label to mean different things. In the Lifeboat debate, the real disagreements happen at specific pressure points.

  **The Five Fault Lines**
  These are the questions where the four main positions (Hardin, Singer, Charity-First, and Justice-Critic) finally split apart:

  1.  **Is capacity fixed?** Hardin says the boat has a hard physical limit. The Justice-Critic says "full" is a choice about how much space we give ourselves.
  2.  **Is there a duty to rescue?** Singer says yes, if the cost to you is small. Hardin says no, survival of the group comes first.
  3.  **Whose safety matters?** Hardin says the group aboard. Singer says the person in the water counts equally. The Charity-First view says the group aboard counts *more*, but not *only*.
  4.  **Do past wrongs matter?** Hardin says only current safety matters. The Justice-Critic says if the swimmers built the boat, they have a ticket.
  5.  **What counts as "cost"?** Is giving up a seat a "modest cost" (Singer) or a "threat to survival" (Hardin)? Is dumping cargo a "loss" (Hardin) or a "moral necessity" (Singer/Justice)?

  **Placing the Positions**
  Here is how the four views sit in relation to those fault lines:

  *   **The Strict Lifeboat (Hardin):** The boat is physically full. Safety of the passengers is absolute. No duty to rescue if it risks the boat. Cargo and seats are protected. Past history is irrelevant.
  *   **The Rescue Duty (Singer):** A life in the water outweighs luxury or comfort on the boat. If you can save a life without sinking the boat *completely*, you must. Seats and cargo can be sacrificed.
  *   **The "Home First" (Moderate):** We owe help to our own first. If there is easy room, we help. If it requires sacrifice or risk, we protect our own. We are not cruel, but we are not martyrs.
  *   **The Justice Critic:** The metaphor is rigged. The boat isn't full; we just hoard space. The swimmers have a claim because they built the boat or were pushed off by us. We don't "rescue" them; we return what is theirs.

  ***

  ### Part 2: The Lifeboat Quiz

  **Instructions:** Read each situation carefully. Choose the option that best matches what you would actually do or decide. Do not worry about what your choice is called; worry about what it means for the people in the water.

  **1. The Spare Seats**
  The boat has sixty seats. There are fifty passengers aboard. The weather is calm. One swimmer is treading water nearby, tired but not drowning. They ask to come aboard to rest.
  *   **A.** Pull them aboard immediately; there is plenty of room.
  *   **B.** Tell them to keep swimming; we save the empty seats for emergencies or future passengers.

  **2. The Drowning**
  The boat is at its rated capacity. A swimmer is sinking and will drown within minutes. Taking them in will make the boat sit lower in the water, making everyone aboard less safe, but probably not sinking it.
  *   **A.** Take them in; a life is worth the extra risk.
  *   **B.** Do not take them in; the safety of those already aboard comes first.

  **3. The Comfortable Swimmer**
  The boat is full. A swimmer is floating on a sturdy raft. They are not in danger of drowning, but they want to come aboard because the food on the boat is better than their rations.
  *   **A.** Let them aboard; sharing our surplus is the right thing to do.
  *   **B.** Wave them off; they are safe on their raft, and our supplies are for us.

  **4. The Strong Rowers**
  The boat is crowded and the passengers are exhausted. A group of swimmers offers to come aboard. They are strong and promise to row and fish, making the boat faster and better fed, but they will still eat some of the stored food.
  *   **A.** Take them; they make the boat stronger overall.
  *   **B.** Leave them; even if they help, they add weight and complexity we don't need.

  **5. The Volunteer**
  The boat is full. A swimmer is drowning. One passenger stands up and says, "I will give up my seat to save them. I am willing to swim."
  *   **A.** Allow the swap; it is their body and their choice.
  *   **B.** Forbid the swap; every passenger is responsible for the safety of the whole group, and one weak spot endangers everyone.

  **6. The Luxury Cargo**
  The boat is full. A swimmer is drowning. The boat is carrying heavy furniture and luxury goods that take up the space of five people.
  *   **A.** Throw the cargo overboard to make room for the swimmer.
  *   **B.** Keep the cargo; the passengers worked for it, and the swimmer is not our responsibility.

  **7. The Timber**
  The boat is full. A swimmer is drowning. You learn that the wood used to build this boat was cut by the swimmer's ancestors, who were never paid and never allowed to board.
  *   **A.** Let them aboard; they have a rightful claim to the boat itself.
  *   **B.** Save them only if it is safe; the past is past, and current safety matters most.

  **8. The Signal**
  The boat has room for five more. There are fifty swimmers nearby. If you take five, the other forty-five will try to swarm the boat, which could capsize it.
  *   **A.** Take the five; we cannot let people drown just to send a message.
  *   **B.** Take none; we must not encourage a rush that will sink us all.

  **9. The Captain's Count**
  The Captain says the boat is full. Several passengers say they have measured the deck and there is room for ten more if we sit closer. A swimmer is drowning.
  *   **A.** Trust the passengers and make room; the Captain is being too cautious.
  *   **B.** Trust the Captain; in a crisis, we must follow the strictest safety rules.

  **10. The Storm Margin**
  The boat is stable today. However, the weather report says a storm is coming in a week. Taking swimmers aboard now means we will have no safety margin when the storm hits.
  *   **A.** Take them now; we might survive the storm anyway, and they will die today without help.
  *   **B.** Wait until the storm passes; we must guarantee our survival through the bad weather.

  ***

  ### Part 3: Scoring Key

  To find your position, tally which letter you chose most often. Most people will have a mix, but your dominant pattern reveals your ethical center.

  **If you mostly chose A:**
  **You lean toward the Rescue Duty or Justice view.**
  You believe that preserving life is more important than preserving comfort, cargo, or strict safety margins. You are willing to accept risk to save others.
  *   *Check your answers to Q6 and Q7:* If you chose **A** on "Luxury Cargo" and "The Timber," you likely reject the Lifeboat metaphor entirely (Justice View). You believe resources are being hoarded and the swimmers have a claim.
  *   *If you chose B on Cargo/Timber but A on Drowning:* You hold a **Singer-style Rescue Duty**. You will save lives at a cost, but you might not accept historical claims or sacrifice property.

  **If you mostly chose B:**
  **You lean toward the Strict Lifeboat or Home First view.**
  You believe the primary duty of the boat is to ensure the survival of those already aboard. You view safety margins and resources as fixed limits that cannot be breached.
  *   *Check your answer to Q1 (Spare Seats):* If you chose **B** here (refusing help even when there is room), you hold the **Strict Hardin** position. You believe resources must be guarded against all future uncertainty.
  *   *If you chose A on Q1 but B on Q2 (Drowning):* You hold the **"Charity Begins at Home"** position. You are willing to help when it is easy/costless, but you will not sacrifice safety or security for strangers.

  **If your answers are mixed (e.g., A on Timber, B on Drowning):**
  You may hold a **Justice View without the Rescue Duty**. You believe the swimmers have a right to be there (because of the timber), but you might not feel a general duty to rescue strangers who have no historical claim. This is a coherent position: you see the boat as stolen property, but you still prioritize the current passengers' survival over immediate rescue.

  ***

  ### Part 4: What This Quiz Cannot Tell You

  This quiz is a diagnostic tool, not a final verdict. There are two important blind spots you should discuss when you reveal your scores.

  **1. The "Singer" and "Justice" Overlap**
  The quiz cannot fully separate the **Rescue Duty (Singer)** from the **Justice Critic**. Both will often choose "Take them aboard."
  *   *The Singer* says: "Take them because suffering is bad and we can help."
  *   *The Justice Critic* says: "Take them because the boat isn't really full and they built it."
  *   *Why it matters:* If the storm comes, the Singer might admit, "Okay, now it's too dangerous, we stop." The Justice Critic might say, "No, the storm is an excuse; we make room because it's theirs." To tell these apart, you must ask *why* they chose A, not just *that* they chose A.

  **2. The "Incoherent" Pattern**
  There is one pattern that no named position occupies: **Choosing A on "The Volunteer" (Q5) but B on "The Drowning" (Q2).**
  *   This means: "I won't risk the boat to save a swimmer, but I will let a passenger jump out to save them."
  *   *Why it's rare:* This suggests you care more about individual choice than group safety, but only if the group doesn't have to agree to the risk. It is logically possible, but often unstable. If the passenger drowns after jumping out, the boat is now less safe (one fewer rower). Most people who support the volunteer swap also support the rescue; most who oppose the rescue also forbid the swap. If someone lands here, ask them if they realize their choice reduces the boat's total strength.

  **3. Motivation vs. Action**
  Finally, the quiz measures *judgments*, not *motivations*. Two people might choose **B** on "The Drowning."
  *   *Person X* thinks: "We must save our own kind first."
  *   *Person Y* thinks: "If we sink, nobody can help anyone ever again."
  *   These are very different reasons for the same answer. Use the quiz to start the conversation, not to end it.
