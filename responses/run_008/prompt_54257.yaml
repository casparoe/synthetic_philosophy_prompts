  2.  **Step 1: Map the Logical Space (Philosophical Analysis):**
      *   *Core Conflict:* Hardin's Lifeboat Ethics vs. Competing Ethical Frameworks (Utilitarian/Singer, Communitarian/"Charity Begins at Home", Structural/Justice-based).
      *   *Key Variables:*
          1.  **Capacity:** Is the boat physically full? Is there slack?
          2.  **Urgency:** Is the swimmer dying now or later?
          3.  **Cost/Benefit:** Does helping hurt the passengers? Does helping help the passengers (labor)?
          4.  **Sacrifice:** Must a passenger give up a spot?
          5.  **Resources:** Can cargo be sacrificed?
          6.  **History/Justice:** Did the swimmers build the boat?
          7.  **Safety:** Will taking them aboard sink the boat (Hardin's core claim)?
      *   *Positions to Distinguish:*
          1.  **Strict Hardin:** Safety of the boat is paramount. No duty to rescue if it risks the boat. Passengers first, always. Capacity is fixed.
          2.  **Singer-style (Rescue Duty):** If you can save a life at less than comparable moral cost, you must. Distance/nationality doesn't matter.
          3.  **"Charity Begins at Home" (Moderate Communitarian):** Prioritize passengers, but allow rescue if safe. Duty exists but is limited by proximity/commitment.
          4.  **Structural/Justice Critic:** Rejects the metaphor. The boat isn't full; resources are hoarded. The swimmers have a claim based on past injustice.

      *   *Divergence Points (Where do they disagree?):*
          *   *Risk Tolerance:* Hardin says *any* risk is too much. Singer says *significant* risk is okay to save a life.
          *   *Property vs. Life:* Hardin prioritizes the boat's integrity/cargo. Singer prioritizes the life.
          *   *Obligation Source:* Hardin = Survival of the group. Singer = Minimization of suffering. Justice Critic = Rectification of wrongs.
          *   *Capacity:* Hardin = Fixed physical limit. Justice Critic = Socially constructed limit.

  3.  **Step 2: Draft the Questions (Iterative Process):**
      *   *Requirement Check:* Need 10 questions. Need specific scenarios (spare seats, full, dying/comfortable, helpful swimmers, seat sacrifice, cargo dump, historical timber).
