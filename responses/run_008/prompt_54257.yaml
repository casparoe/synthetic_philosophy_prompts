          4.  **Justice/Structural:** Focus on the timber, the cargo, and the definition of "full."

      *   *Scoring Mechanism:* Instead of points, I'll group questions by "theme" and show which answer aligns with which view. Or, I can create a "Profile" system. A profile system is more engaging for a discussion group.
      *   *Let's try a "Tally" approach:* Count how many times they choose "Rescue," "Protect Boat," "Justice," etc.
      *   *Actually, a Pattern Match is better:* "If you mostly chose A, you are X." But people mix views.
      *   *Best approach for a discussion group:* Break down the questions into clusters. Show them which questions reveal which tension.
      *   *Wait, the prompt asks for a Scoring Key that maps answer patterns onto positions.* I should make it actionable. I will assign each option a "leaning."
      *   *Leaning A:* Rescue/Humanitarian (Singer).
      *   *Leaning B:* Safety/Security (Hardin).
      *   *Leaning C:* Justice/Structural (Critique).
      *   *Wait, some questions don't fit C.* I need to ensure the options cover the spectrum.
      *   *Revised Scoring:* I will categorize the *answers* chosen.
          *   Type R (Rescue): Save the swimmer.
          *   Type S (Security): Protect the boat/passengers.
          *   Type J (Justice): Acknowledge historical claim or reject capacity limits.
      *   *Then map the dominance of R, S, or J to the positions.*

  5.  **Step 4: "What this quiz cannot tell you":**
      *   Need to identify blind spots.
      *   *Blind Spot 1:* Motivation. Someone might choose rescue because they fear God, another because of utilitarianism. Quiz looks the same.
      *   *Blind Spot 2:* The "Singer vs. Structural" overlap. If the boat is never full (Structural), you always rescue (Singer-ish result). The quiz might conflate them.
