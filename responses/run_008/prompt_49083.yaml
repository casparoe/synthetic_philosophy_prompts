answer: |-
  # UX CLAIM VALIDATION PROTOCOL (CVP)
  **Purpose:** Prevent mind-reading disguised as data. Ensure every insight drives design or is cut.
  **Timebox:** 10–15 minutes per claim.

  ### STEP 1: THE EVIDENCE LINK (3 mins)
  **Question:** Can you point to the exact timestamp, quote, or interaction log that supports this *specific* mental word (believe, want, trust)?
  *   **Pass:** "Participant 4 said X at 14:02" or "Log shows 3 hovers then exit."
  *   **Fail:** "Generally," "The vibe was," or "They completed the task."
  *   **Action:** If **Fail**, mark for **DUMP** unless Step 3 saves it.

  ### STEP 2: THE BEHAVIORAL TRANSLATION (5 mins)
  **Question:** Can you rewrite this claim using *only* observable actions or stated preferences without losing the design implication?
  *   **Test:** Replace "believes/wants/trusts" with "clicked/said/hesitated."
  *   **Pass:** The meaning changes or weakens significantly (e.g., "hesitated" misses the *surprise* element).
  *   **Fail:** The meaning stays identical (e.g., "believes secure" = "clicked submit").
  *   **Action:** If **Fail**, **REWRITE** as behavioral. If **Pass**, proceed to Step 3.

  ### STEP 3: DESIGN UTILITY & FALSIFIABILITY (5 mins)
  **Question:** If this claim is wrong, does it change what we build? Could the observed behavior happen *without* this mental state?
  *   **Pass:** Yes, it drives a specific feature change, and there is a scenario where the behavior exists but the mental state does not (e.g., they clicked because they were rushed, not because they trusted).
  *   **Fail:** No specific feature change, or the claim is unfalsifiable (e.g., "trust" based on completion).
  *   **Action:** If **Fail**, **DUMP**. If **Pass**, **KEEP** (mental vocabulary allowed).

  ---

  ### DECISION MATRIX
  | Result | Action | Example Phrasing |
  | :--- | :--- | :--- |
  | **KEEP** | Mental vocab justified. | "Users *expected* X based on prior experience, causing surprise when Y occurred." |
  | **REWRITE** | Flatten to behavior/disposition. | "Users *clicked* without hesitation" or "Users *stated* a preference for X." |
  | **DUMP** | Unfalsifiable or redundant. | Replace with video clip or remove entirely. |

  ---

  ### WORKED EXAMPLES (From Recent Draft)
  **(A) "Users believe the checkout is secure because they completed the purchase without hesitation."**
  *   **Step 1 (Evidence):** Fail. Completion ≠ belief in security.
  *   **Step 2 (Translation):** "Users completed purchase without hesitation." Meaning identical.
  *   **Step 3 (Utility):** Fail. Doesn't tell us *why* they didn't hesitate.
  *   **VERDICT:** **REWRITE.** *New Claim:* "100% of participants completed checkout without triggering error states or pausing on the payment field."

  **(B) "Participants wanted more control over notification settings."**
  *   **Step 1 (Evidence):** Pass. 9/12 explicitly said this unprompted.
  *   **Step 2 (Translation):** "9/12 said they wanted more control." Meaning shifts from *desire* to *report*.
  *   **Step 3 (Utility):** Pass. Drives specific settings UI work. Falsifiable (they might not use it).
  *   **VERDICT:** **KEEP (with qualification).** *New Claim:* "9/12 participants *explicitly requested* more control over notification settings during interviews." (Note: Distinguish stated vs. revealed).

  **(C) "Customers trust our brand."**
  *   **Step 1 (Evidence):** Fail. Based on "vibes" and one ambiguous quote.
  *   **Step 2 (Translation):** "One participant said 'yeah I guess'." Meaning collapses.
  *   **Step 3 (Utility):** Fail. Unfalsifiable. No specific design action.
  *   **VERDICT:** **DUMP.** *Action:* Insert video clip of the one participant if illustrative, otherwise delete.

  ---

  ### RISKS & LIMITATIONS
  1.  **Gaming (Goodhart's Law):** Analysts will learn to cite timestamps that don't actually support the claim. *Mitigation:* Spot-check 10% of claims against raw video/logs during sign-off.
  2.  **Loss of Nuance:** Step 2 might flatten genuine interpretive work (e.g., tone, hesitation). *Mitigation:* If Step 2 fails but the insight feels critical, flag for **Senior Review** rather than automatic rewrite.
  3.  **The Metaphysical Gap:** This procedure does not prove beliefs *don't exist*. It treats them as **instrumental tools**. If the tool doesn't work (predict behavior/drive design), discard it. It solves the *practical* problem of client pushback, not the *philosophical* problem of mind.

  ### PHILOSOPHY CUT NOTE
  *To fit one page, I omitted the distinction between **Instrumentalism** (beliefs are useful fictions) and **Realism** (beliefs are physical states).*
  *Why Safe:* Your problem is client pushback and actionable insights, not ontology. Whether beliefs "exist" matters less than whether claiming them helps you build better products. This protocol treats mental vocabulary as a tool that must earn its keep, regardless of its metaphysical status.
