answer: |-
  **To:** Instructor, Intro to Contemporary Moral Problems
  **From:** [Philosopher Colleague]
  **Re:** Unit Capstone — *Of Mice and Men* and the Doctrine of Doing and Allowing

  It is a genuine pleasure to see a syllabus that trusts fiction to carry philosophical weight. You are right to be wary of the standard journal articles here; they often sanitize the emotional residue of killing in a way that makes the "Doctrine of Doing and Allowing" feel like a logic puzzle rather than a human crisis. Steinbeck forces us to confront the *cost* of the moral verdict, not just its validity.

  Per your request, I have mapped out the philosophical terrain of the novel below, followed by a structured lesson plan you can take straight into the classroom.

  ### Part 1: Philosophical Brainstorm & Scene Mapping

  Before we get to the lesson, here is how the text maps onto the doctrine, and where it threatens to collapse the distinction entirely.

  **1. The Candy's Dog Sequence (The Prelude)**
  *   **The Setup:** The dog is suffering, smelly, and useless. Carlson argues for euthanasia.
  *   **The Doing/Allowing:** Carlson offers to do the killing (Doing). Candy acquiesces and hands over the dog (Allowing).
  *   **The Philosophical Pivot:** Candy's regret is not that the dog died. It is that he *allowed a stranger* to do it. He says, explicitly, that he should have been the one to pull the trigger.
  *   **Implication:** This suggests the moral weight isn't in the causal mechanism of death (bullet vs. neglect), but in the *relational duty*. To outsource the death of a dependent is a moral failure, even if the death is inevitable.

  **2. The Climax (George and Lennie)**
  *   **The Setup:** Lennie has accidentally killed Curley's wife. Curley forms a mob to lynch him. George finds Lennie first.
  *   **The Doing/Allowing:**
      *   *Option A (Doing):* George shoots Lennie in the back of the head.
      *   *Option B (Allowing):* George hides or runs, letting the mob find Lennie.
  *   **The Standard Reading:** Option A is killing; Option B is letting die. If the Doctrine holds, Option B should be morally preferable (or at least less culpable).
  *   **The Steinbeck Reading:** Option B is abandonment. Option A is protection. The "Doing" is an act of intimacy; the "Allowing" is an act of desertion.
  *   **Scene Detail to Verify:** Ensure you recall exactly how George positions Lennie before the shot. He makes Lennie look across the river at the horizon, distracting him with the story of the farm. This ensures Lennie feels no fear. This *manner* of doing is crucial—it transforms the act from execution to mercy.

  **3. The Aftermath (Slim and Curley)**
  *   **The Verdict:** Curley wants to know George shot him. Slim stops him. Slim's line is essentially: "You had to. Don't let anyone blame him."
  *   **The Tension:** Slim validates the utilitarian calculus (better Lennie dies quickly than suffers), but the mood is funereal, not triumphant. George walks away alone. The "right" act has destroyed the agent's world.

  ***

  ### Part 2: Lesson Plan — "The Burden of the Trigger"

  **Objective:** To evaluate whether the Doctrine of Doing and Allowing captures the moral complexity of euthanasia and mercy killing, using *Of Mice and Men* to test the limits of agent-neutral vs. agent-relative obligations.

  **I. Opening Framing (10 Minutes)**
  *   Briefly recap the Doctrine of Doing and Allowing. Usually, we teach that there is a moral asymmetry: actively killing is worse than passively letting die, all else being equal.
  *   Pose the central question: *Is the moral difference found in the physical act (pulling a trigger vs. withholding aid), or in the relationship between the agent and the victim?*
  *   **Constraint Note:** Tell the class we are avoiding the Trolley Problem today. Why? Because the Trolley Problem abstracts away relationship. It asks about strangers. This novel is entirely about what we owe to people we love.

  **II. Scene Analysis: Candy's Dog (15 Minutes)**
  *   Ask the class to recall the scene with the old sheepdog.
  *   **Discussion Question:** The dog was going to die either way. Carlson was efficient and quick. Why does Candy feel guilt?
  *   **Guide the conversation here:** Candy's guilt isn't about the *outcome* (the dog is dead either way). It is about *agency*. By handing the gun to Carlson, Candy treated the dog like garbage to be disposed of, rather than a companion to be honored.
  *   **Philosophical Concept:** Introduce the idea of **Agent-Relative Residue**. Sometimes, the morality of an act depends on *who* performs it. A stranger killing your dependent is a violation; you killing your dependent (under specific conditions) might be a duty.
  *   **Key Point:** Candy failed in his duty of care by not being the agent of the death. He prioritized his own emotional comfort over the dog's dignity.

  **III. Scene Analysis: The Riverbank Ending (20 Minutes)**
  *   Move to George and Lennie. Establish the two options clearly.
      1.  George shoots Lennie (Active Killing).
      2.  George lets the mob find Lennie (Passive Allowing/Abandonment).
  *   **Discussion Question:** If we apply the Doctrine of Doing and Allowing strictly, Option 2 looks safer for George's moral record. He didn't kill Lennie; Curley did. Why does the novel present Option 2 as the monstrous choice?
  *   **Push the "Manner of Doing":** Ask students to focus on *how* George does it. He isn't angry. He isn't punishing. He is telling a story about rabbits. He ensures Lennie is happy in the final second.
  *   **The Synthesis:** George learns from Candy's mistake. He realizes that "letting die" in this context is actually a form of betrayal. By taking on the burden of the killing, George absorbs the moral violence so Lennie doesn't have to feel it.
  *   **Challenge the Utilitarian View:** A strict utilitarian might say, "George did the right thing, end of story." But ask the class: Why is the ending so sad? If it was just a math problem (1 painless death vs. 1 painful death), George should feel relief. Instead, he feels devastation.
  *   **Philosophical Concept:** **Moral Tragedy.** Sometimes, the "right" thing to do still requires violating a deep moral prohibition (do not kill your friend). The Doctrine of Doing and Allowing tries to tell us which act is *worse*. Steinbeck shows us that sometimes both options are terrible, but one is *loyal*.

  **IV. Closing Discussion: Does the Distinction Hold? (15 Minutes)**
  *   Bring it back to the course theme. Does the Doing/Allowing distinction do any work here?
  *   **Argument:** The distinction collapses when the "Allowing" involves abandoning a special duty.
  *   **Argument:** However, the "Doing" still carries a cost. George survives, but he loses his purpose. The novel suggests that even justified killing leaves a stain on the soul that "letting die" (if it were possible without abandonment) might not.
  *   **Final Question:** If George had simply walked away and let the mob do it, would he be alive at the end? Yes. Would he be a good man? The novel suggests no. To be a good man, he had to become a killer.

  ***

  ### Part 3: The Board Paragraph

  *Write this on the board as the students pack up. It summarizes the unique contribution of the literature to the philosophical debate.*

  > **The Limit of the Doctrine:** The standard philosophical distinction between *killing* and *letting die* assumes the moral weight lies in the causal mechanism of death. Steinbeck argues the weight lies in the **relational duty**. To "let die" when you are the sole protector is not neutrality; it is abandonment. However, to "kill" to prevent suffering is not clean; it is a sacrifice of the killer's own moral innocence. The novel shows us that the right act can still be a tragic one, leaving a residue of guilt that abstract ethical theories often fail to account for. George does not choose between right and wrong; he chooses between two kinds of wrong, and takes the one that honors the friendship.
