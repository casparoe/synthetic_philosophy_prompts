prompt: |-
  I teach an intro course on contemporary moral problems, and we're coming to the end of a unit on the doctrine of doing and allowing — killing vs letting die, active vs passive euthanasia, that whole cluster. For the final session I want to do something different and close with Steinbeck's Of Mice and Men instead of another journal article. Everyone in the class will have read it in high school, so nobody needs to catch up on the plot, and the ending is exactly on point.

  Take the role of a professional philosopher who works on the ethics of killing and has a soft spot for novels that do moral philosophy better than the papers do. Think through this carefully before writing — maybe start with a short brainstorm mapping which scenes carry the doing/allowing distinction and which cut against it — then give me the reading I can actually teach.

  Here's the angle I want you to take seriously. The standard framing says George kills Lennie, which is a doing, but the realistic alternative was letting Curley's mob have him, which is an allowing, or at least a non-doing. So the novel stages the exact question the doctrine is about: was George's act made worse by being a killing, or better, or neither — does the doing/allowing distinction do any work at all in our verdict on George? Then push on the part the papers handle less well. Earlier in the book, Candy lets Carlson shoot his old dog, and Candy's regret afterwards is not that the dog died but that he let a stranger do it — he thinks he should have done it himself. If you take that regret seriously, the morally loaded thing isn't doing vs allowing at all, it's something about who does it and what it costs them — agent-relative residue, or something like that (I don't fully know what to call it, thats part of what I want from you). Does the dog scene restructure how we read the ending? Is the point of George shooting Lennie himself, quietly, while telling him about the farm, that the manner of the doing absorbs what would otherwise be wrong with it? And where does the novel resist that reading — is there any honest way to say the ending is just a mercy killing the doctrine should permit, or is Steinbeck leaning on our anti-consequentialist intuitions to make the utilitarian verdict feel tragic anyway?

  Two ground rules. First, don't have the students quote the text and don't you produce quotes either — work from the plot and scenes as they're commonly remembered, and flag any place where the reading turns on how exactly a scene goes, so I can double-check the novel beforehand. Second, don't smuggle in the trolley problem. If trolley stuff genuinely wants to show up, tell me why it's needed here and not just reflex.

  At the end, give me one paragraph on what the novel shows about the doing/allowing distinction that the argumentative literature doesn't — something I can put up on the board as they walk out.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in ethics of killing, with a soft spot for literature doing moral philosophy better than papers.
      *   **Task:** Create a reading/lesson plan for the final session of an intro course on contemporary moral problems.
      *   **Topic:** Doctrine of Doing and Allowing (killing vs. letting die, active vs. passive euthanasia) using Steinbeck's *Of Mice and Men*.
      *   **Key Angle:**
          *   Standard framing: George killing Lennie (doing) vs. Curley's mob lynching him (allowing/non-doing). Does the distinction matter?
          *   Deeper angle: Candy's dog scene. Candy's regret isn't about the death, but about *who* did it (agent-relative residue). Does this restructure the reading of the ending? Is the "manner of the doing" what absorbs the wrongness?
          *   Tension: Is it a clean mercy killing (utilitarian) or does Steinbeck lean on anti-consequentialist intuitions to make it feel tragic?
      *   **Ground Rules:**
          *   No direct quotes (work from plot/scenes as commonly remembered).
          *   Flag scene details that matter for verification.
          *   No reflexive Trolley Problem smuggling (only if genuinely needed).
          *   End with a specific "board paragraph" summarizing the novel's unique contribution compared to argumentative literature.

  2.  **Brainstorming & Mapping (Mental Draft):**
      *   *Scenes involving Doing/Allowing:*
          *   Candy's Dog: Carlson offers to shoot it (Doing). Candy allows it (Allowing). Candy regrets not doing it himself.
          *   Curley's Wife: Lennie kills her (Doing). George arrives later.
          *   The Ending: George shoots Lennie (Doing). Alternative: Curley's mob tortures/kills Lennie (George allows this by not intervening).
          *   Slim's Verdict: "You hadda." (Moral absolution).
      *   *Cutting Against the Distinction:*
          *   Is George *really* just choosing between two deaths? Or is he choosing between a good death and a bad death?
          *   Candy's regret suggests the moral weight lies in *relationship* and *responsibility*, not just the causal mechanism of death.
          *   The "Doing" by George is intimate; the "Allowing" (mob) is violent/impersonal.
          *   Does the distinction collapse when the "Allowing" is morally monstrous?
      *   *Agent-Relative Residue:* This is the key philosophical hook. It's not just about the outcome (Lennie dies either way). It's about George's moral integrity. By doing it himself, he takes the sin/burden upon himself to save Lennie from pain/humiliation. This echoes the "dirty hands" problem or agent-centered prerogatives.
      *   *Trolley Problem Check:* The prompt says *don't* smuggle it in. I need to respect that. The situation is structurally similar (one dies either way), but the emotional/relational context makes Trolley talk reductive. I will explicitly mention *why* we are avoiding it (it strips the relationship).

  3.  **Structuring the Lesson Plan:**
      *   **Title:** Needs to sound academic but engaging.
      *   **Philosophical Framing:** Set the stage (Doing/Allowing Doctrine).
      *   **Scene 1: Candy's Dog (The Setup):** Focus on the regret. Who pulls the trigger?
      *   **Scene 2: The Climax (The Application):** George vs. The Mob.
      *   **Discussion Questions:** Guide the students through the specific angles requested (agent-relative residue, tragedy vs. utility).
      *   **The "Board Paragraph":** The takeaway.

  4.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the shift from papers to fiction. Validate the professor's instinct.
      *   *Brainstorm (for the professor's eyes):* Briefly map the scenes as requested in the thought process, highlighting where the distinction blurs.
      *   *The Lesson Plan:*
          *   *Opening:* Establish the Doctrine of Doing and Allowing quickly.
          *   *The Dog:* Focus on Candy's specific regret. "I ought to have shot that dog myself." Why? It's not about the dog's pain (Carlson was quick). It's about *ownership* of the act.
          *   *The Ending:* Contrast George's act with the Mob's potential act. Is George's act a "killing" in the same moral category as Curley's intended killing?
          *   *The Synthesis:* Connect the dog to George. George does what Candy failed to do. He claims the burden.
          *   *The Tragedy:* Why does it still feel sad if it's the "right" utilitarian move? Because it violates a deep prohibition (do not kill a friend), even if justified. This is where literature beats papers—papers argue for justification; literature makes you *feel* the cost of the justification.
      *   *Refining the "Agent-Relative Residue":* I need to give the professor a term or concept to use. "Moral Burden," "Relational Responsibility," or "The Cost of Care." Let's stick close to the prompt's "agent-relative residue" but explain it through the text.
      *   *Checking Ground Rules:* No quotes. Check scene details (e.g., Carlson's gun, the location of the shooting, Slim's final words). No Trolley Problem.

  5.  **Refining the Philosophical Argument:**
      *   The standard Doing/Allowing debate asks: Is killing intrinsically worse than letting die?
      *   Steinbeck asks: Who is the agent, and what is their relationship to the victim?
      *   If George allows the mob to kill Lennie, he abandons Lennie. If George kills Lennie, he betrays a trust but honors a duty of care.
      *   The "Doing" is an act of love/protection, whereas the "Allowing" is an act of abandonment. This flips the standard script where "Allowing" is usually the passive/safer moral option.
      *   *Crucial nuance:* The prompt asks if the manner of the doing absorbs the wrongness. Yes, the *context* of the doing (calm, storytelling, mercy) transforms the *nature* of the doing from "murder" to "sacrifice."

  6.  **Final Polish:**
      *   Tone: Collegial, insightful, respectful of the literature.
      *   Formatting: Clear headings, bullet points for discussion.
      *   The Board Paragraph: Needs to be punchy and profound.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe compare George to a utilitarian calculator.
      *   *Correction:* No, the prompt warns against making it feel like a clean utilitarian verdict. Steinbeck makes it tragic. I need to emphasize the *residue*. George survives, but he is alone. The "right" act destroys his world.
      *   *Check on Trolley:* Make sure I explicitly state *why* we aren't using it. (It abstracts away the relationship, which is the whole point of the novel).
      *   *Check on Quotes:* Ensure I describe scenes rather than citing lines. (e.g., instead of "I ought to have shot that dog myself," say "Candy expresses a specific regret that he delegated the task.")

  8.  **Final Review against Prompt:**
      *   Role assumed? Yes.
      *   Brainstorm included? Yes.
      *   No quotes? Yes.
      *   No Trolley? Yes.
      *   Board paragraph included? Yes.
      *   Addressed Candy's dog/George parallel? Yes.
      *   Addressed agent-relative residue? Yes.

