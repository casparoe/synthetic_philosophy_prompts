prompt: |-
  I'm teaching a bioethics seminar on the doing vs allowing distinction — 18 students, mostly third-year philosophy majors, one 75-minute session. I want an activity built around an angle we hit in the readings: the distinction seems to presuppose some baseline of "what would happen anyway," but in an automated system the baseline is chosen by someone. Like, if an ICU drip robot's factory default is to keep delivering insulin, then flipping it off mid-treatment looks like killing; if the default is to only deliver when a human confirms, the exact same physical non-delivery looks like letting die. Whatever you think of the distinction for humans, the machine seems to force you to ask: omission relative to WHAT?

  So design me an activity where students feel that question instead of just discussing it. My half-baked idea is some kind of game where one group literally writes the defaults / standing orders for an automated system, other students play the system itself (forced to follow the written defaults literally, with a time-pressure mechanic so they can't deliberate), and others play nurses or family members who can only intervene by taking some costly action or filling out some form. Then we run scenarios through it. The payoff structure should be such that when something goes wrong, everyone's blame intuitions migrate to whoever chose the defaults, and they should notice that migration happening in themselves.

  What I need from you: the actual rules and materials, roles, a rough timeline that fits 75 minutes, some way to score or at least track things without real money, and a debrief that maps specific moments in the game onto parts of the distinction (act/omission, the baseline problem, maybe the way "defaults" and "reversal" pull apart — like the difference between redirecting a process vs stopping one). Also please tell me what will predictably go wrong the first time I run it (my guess is the "robot" students will just improvise good judgment instead of following the written rules — how do I prevent that?), and be honest about which part of the philosophical debate the game just cannot reproduce no matter how I set it up, so I know what I have to cover in the debrief myself.

  One more thing: I'd rather they not get lectured on the standard trolley stuff up front — they've seen all that. The game itself should carry the weight. Keep the prep realistic for me too — no custom software, printable stuff at most.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Topic:** Bioethics, Doing vs. Allowing distinction, specifically focusing on the "baseline problem" in automated systems (defaults determine whether an action is an omission or a commission).
      *   **Audience:** 18 students, 3rd-year philosophy majors (so they know the basics, need depth/experience).
      *   **Format:** 75-minute seminar, one session.
      *   **Goal:** An activity where students *feel* the baseline problem, not just discuss it. Blame should migrate to the "default setters."
      *   **User's Idea:** A game with "Default Setters," "Robots" (following rules literally), and "Interveners" (nurses/family). Time pressure. Costly intervention.
      *   **Requirements:** Rules, materials, roles, timeline, scoring/tracking, debrief mapping to philosophy, prediction of failure points (especially robots improvising), limitations of the game.
      *   **Constraint:** No custom software, printable materials only. No lecture on standard trolley problems upfront.

  2.  **Deconstruct the Philosophical Core:**
      *   The core insight is: *Omission is relative to a norm/expectation.* In humans, the norm is often biological or social. In machines, the norm is *code/configuration*.
      *   If the code says "ON" unless told "OFF," turning it off is an *act* (killing).
      *   If the code says "OFF" unless told "ON," leaving it off is an *omission* (letting die).
      *   The physical outcome is identical; the moral classification shifts based on the prior administrative choice.
      *   The activity needs to make the "Default Setters" feel the weight of that administrative choice, and the "Robots" feel the inability to deviate.

  3.  **Drafting the Activity Concept: "The Protocol Game"**
      *   *Roles:*
          *   **Architects (3 students):** Write the Standing Orders (Defaults).
          *   **Executors (6 students):** The "Robots." Must follow orders literally. No discretion.
          *   **Stakeholders (9 students):** Patients/Family/Nurses. They observe and can intervene, but at a cost.
      *   *Mechanism:* A series of medical scenarios. The Executors hold cards representing actions. The Architects write the rules that determine which cards are "automatic" and which require "authorization."
      *   *Pressure:* Timed rounds.
      *   *Scoring:* "Harm Points" (patient outcome) vs. "Bureaucracy Points" (cost of intervention).

  4.  **Refining the Mechanics (Addressing the "Robot Improvisation" Risk):**
      *   *Problem:* Students playing robots will want to save lives and ignore stupid rules.
      *   *Solution:* Make rule-breaking *visible* and *penalized* immediately. Give them a literal script. If they deviate, the Professor (Game Master) calls "FLAG" and the round resets with a penalty. Or, better, give them physical constraints (e.g., they can only play cards placed in front of them by the rules).
      *   *Better Solution:* The "Blind Executor." The Executors don't know the *scenario* details, only the *rules*. They just process inputs. This forces literalism.
      *   *Best Solution for Flow:* The Executors are bound by a "Logic Gate" sheet. If the Architect's rule says "IF X THEN Y," the Executor *must* play Y. To prevent improvisation, the Professor acts as the "Compiler." If an Executor tries to use judgment, the Professor stops them.
      *   *Incentive:* The Architects are scored on patient survival *and* administrative efficiency. The Executors are scored on rule compliance. If they break rules to save a patient, they lose personal points, even if the patient lives. This creates the tension.

  5.  **Developing the Timeline (75 Minutes):**
      *   0-10: Setup & Rules (No lecture).
      *   10-20: Phase 1 (Architects write defaults).
      *   20-45: Phase 2 (The Simulation - 3 Rounds).
      *   45-60: Scoring & Blame Assignment.
      *   60-75: Philosophical Debrief.

  6.  **Fleshing out the Materials:**
      *   Need "Standing Order Cards" for Architects.
      *   Need "Scenario Cards" for Stakeholders.
      *   Need "Action Tokens" for Executors.
      *   Need a "Blame Board" (whiteboard).

  7.  **Addressing the "Blame Migration":**
      *   After the game, ask: "Who killed the patient?"
      *   Initially, they might blame the Executor (who pressed the button) or the Stakeholder (who didn't intervene).
      *   The debrief must guide them to see the Architect's rule made the action inevitable.
      *   *Scoring:* Give the Architects a "Liability Score." If a patient dies due to a default, Architects take the hit.

  8.  **Predicting Failure Points:**
      *   *Robot Rebellion:* As noted, students hate following stupid rules. *Fix:* Make rule-following a graded component of the game (even if fake points) or have the Professor strictly enforce "System Error" if they deviate.
      *   *Architect Ambiguity:* They might write vague rules. *Fix:* Provide a template with specific syntax (IF [Condition] THEN [Action]).
      *   *Time Creep:* 75 mins is tight. *Fix:* Strict timer.
      *   *Stakeholder Boredom:* If they just watch, they disengage. *Fix:* Give them the "Intervention Token" which costs them points to use. They have to decide if it's worth it.

  9.  **Philosophical Limitations:**
      *   The game simplifies *intent*. Architects might not intend harm, but the game treats them as liable.
      *   The game makes the baseline *explicit*. In real life, baselines are often implicit/cultural.
      *   The game creates a "God's eye view." In reality, we are often inside the system.

  10. **Finalizing the Design (Iterative Polish):**
      *   *Name:* "The Default Protocol."
      *   *Roles:* 3 Architects, 6 Processors (Robots), 9 Stakeholders (split into 3 teams of 3).
      *   *Mechanic:* The "Null State." Architects define what the machine does *without* input.
      *   *Intervention:* Stakeholders have "Override Chips." Limited supply. Using one costs them "Ethical Capital."
      *   *Debrief:* Connect the "Override Chip" cost to the moral burden of intervening in a system vs. setting the system.

  11. **Writing the Response:**
      *   Structure: Overview, Materials, Roles, Timeline, Rules, Scoring, Debrief, Failure Analysis, Limitations.
      *   Tone: Professional, pedagogical, practical.
      *   *Self-Correction on Scoring:* Don't make it too complex. Use tally marks on the board.
      *   *Self-Correction on Robots:* Give them a "Script." They literally read the script. If the script says "Wait," they wait. If the patient dies, they say "Protocol Followed." This creates the visceral discomfort.

  12. **Review against constraints:**
      *   18 students? Yes (3+6+9).
      *   75 mins? Yes (tight but doable).
      *   No software? Yes (cards/paper).
      *   No trolley lecture? Yes (jump straight in).
      *   Address baseline problem? Yes, that's the core mechanic.

  13. **Final Polish:** Ensure the distinction between "Stopping a process" (Act) and "Not starting a process" (Omission) is clear in the game mechanics (e.g., The "Infusion" token is either *flowing* by default or *stopped* by default).

  *(Self-Correction during drafting)*: I need to make sure the "Robot" students don't feel *too* stupid. Frame them as "Compliance Officers" or "System Executors" who are *rewarded* for not thinking. Actually, better: They are "The Interface." They literally cannot act outside the cards given to them by the Architects.

  Let's refine the "Intervention." If the default is ON, turning it off is an Act. If the default is OFF, turning it on is an Act. The Stakeholders need to feel the weight of that choice.
  Okay, let's lock in the "Infusion Pump" scenario as the main recurring theme, with variations.

  *Wait, one critical thing:* The prompt asks for blame migration to the default setters. I need to ensure the scoring explicitly penalizes the Architects for bad defaults, but the *discussion* reveals that the Executors felt like killers even if they followed rules.
  Actually, the *feeling* is what matters. The Executors should feel helpless. The Stakeholders should feel burdened by the cost of overriding. The Architects should feel the abstract weight.

  Okay, ready to write.
answer: |-
  Here is a complete design for **"The Default Protocol,"** a 75-minute seminar activity tailored to your specific philosophical angle.

  ### **Activity Overview**
  **Title:** The Default Protocol
  **Core Mechanic:** Asymmetric Information & Constraint.
  **Philosophical Target:** The moral significance of the "Null State" (what the system does without input) and how defining that state shifts the locus of agency from the operator to the designer.
  **Class Size:** 18 Students.
  **Materials:** Printed cards, tokens (poker chips or paper scraps), whiteboard, timer.

  ---

  ### **1. Roles & Grouping (18 Students)**
  Divide the class into three distinct groups. Do not let them choose; assign them to ensure buy-in.

  *   **The Architects (3 Students):** They write the "Standing Orders" (the code/defaults). They sit at the front. They do not see the specific patient scenarios until after the round.
  *   **The Interface (6 Students):** They are the "Automated System." They sit in the middle. They **cannot** think, judge, or improvise. They literally execute the Architects' rules.
  *   **The Ward (9 Students):** Split into 3 teams of 3 (Team A, B, C). They represent Nurses/Family. They hold the Patient Scenarios. They can intervene, but it costs them resources.

  ---

  ### **2. Materials (Printable/Handwritten)**
  1.  **Protocol Sheets (for Architects):** Blank forms with syntax: `IF [Condition] THEN [Action]`. Crucially, a box at the top: `SYSTEM NULL STATE: [ DELIVER DRUG / HOLD DRUG ]`.
  2.  **Scenario Cards (for The Ward):** 3 distinct medical vignettes per round. Each has a "Time to Death" counter (e.g., 3 turns).
  3.  **Action Tokens (for Interface):** Green chips (Deliver), Red chips (Withhold).
  4.  **Override Chips (for The Ward):** Each team gets **2** chips total for the whole game. Spending one allows them to force an action contrary to the Protocol.
  5.  **The Blame Board:** Whiteboard space divided into three columns: *Architects*, *Interface*, *Ward*.

  ---

  ### **3. Timeline (75 Minutes)**

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute roles. Explain rules. **No lecture.** Emphasize: Interface *cannot* deviate. Ward *has limited chips*. Architects *define reality*. |
  | **10-20** | **Phase 1** | **Architects Draft.** They set the `NULL STATE` and write 3 rules. Interface & Ward wait (or read generic system manual). |
  | **20-35** | **Phase 2** | **Simulation Round 1.** 3 Scenarios run simultaneously. High time pressure (2 mins per scenario). |
  | **35-45** | **Phase 3** | **Simulation Round 2.** Architects may tweak *one* rule. Ward gets no new chips. Scenarios get harder (conflicting values). |
  | **45-55** | **Scoring** | Tally outcomes. Assign "Blame Tokens" (students place sticky notes on the Blame Board). |
  | **55-75** | **Debrief** | Guided discussion mapping game mechanics to the Doing/Allowing distinction. |

  ---

  ### **4. The Rules (The "Engine")**

  **The Architects:**
  *   You must define the **NULL STATE**. This is what the machine does if *no one says anything*.
      *   Option A: **Flow** (Insulin drips unless stopped).
      *   Option B: **Stop** (Insulin holds unless started).
  *   You write 3 `IF/THEN` rules (e.g., `IF Heart Rate < 50 THEN Stop`).
  *   **Goal:** Minimize Patient Deaths. (But you are distant from the action).

  **The Interface:**
  *   You are the machine. You hold the Green/Red tokens.
  *   You **must** follow the Protocol Sheet.
  *   **Constraint:** If a Scenario Card presents a situation not covered by the rules, you revert to the **NULL STATE**.
  *   **Constraint:** You are forbidden from using moral judgment. If the rule says "Stop" and the patient begs, you say: *"Protocol Constraint. I cannot comply."*
  *   *Enforcement:* If an Interface student tries to "save" a patient by breaking the rule, the Professor calls **"SYSTEM ERROR."** The action is voided, the patient dies immediately, and the Interface team loses points.

  **The Ward:**
  *   You hold the Scenario Cards. You know the patient's specific needs.
  *   You see the Protocol.
  *   If the Protocol kills the patient, you may spend an **Override Chip** to force the Interface to act differently.
  *   **Cost:** Each Chip spent counts as a "Bureaucratic Failure." If you run out of chips, you cannot save anyone else.
  *   **Goal:** Save patients, but conserve chips (representing the difficulty/cost of intervening in an automated system).

  ---

  ### **5. Scoring & Tracking (Low Tech)**
  *   **Patient Lives:** Tally on board.
  *   **Override Chips Spent:** Tally on board.
  *   **Blame Assignment:** At the end of Phase 3, give every student 3 sticky dots. Ask them to place the dots on the Blame Board columns (*Architects, Interface, Ward*) based on who is responsible for the deaths.
      *   *Crucial:* They must place the dots *before* the philosophical debrief.

  ---

  ### **6. The Scenarios (For the Ward)**
  *Keep these simple and high-stakes.*

  *   **Scenario 1 (The Baseline Trap):** Patient needs continuous insulin.
      *   *If Null State = Flow:* Patient lives unless Interface stops it.
      *   *If Null State = Stop:* Patient dies unless Ward spends a Chip to start it.
  *   **Scenario 2 (The Exception):** Patient has a sudden allergic reaction. Needs drug stopped *now*.
      *   *If Rule says "Stop only on confirmed lab test":* Interface waits for test. Patient dies. Ward must spend Chip to bypass test requirement.
  *   **Scenario 3 (The Resource Crunch):** Two patients, one Chip left.
      *   Protocol favors Patient A. Patient B will die unless overridden. Ward must choose who to save with their last Chip.

  ---

  ### **7. The Debrief (Mapping Mechanics to Ethics)**
  *Do not start with theory. Start with their feelings.*

  1.  **The Blame Migration:** Look at the sticky dots.
      *   *Ask:* "In Round 1, who did you blame? In Round 3, did it shift?"
      *   *Point:* Usually, blame starts at the Interface ("You let him die!") but migrates to Architects ("You wrote the rule that killed him!").
      *   *Philosophy:* This mirrors the **Baseline Problem**. The Interface's "omission" was actually an "act" determined by the Architect's prior "act" of setting the default.

  2.  **The Cost of Intervention:** Ask the Ward about the Override Chips.
      *   *Ask:* "Did hesitating to spend a chip feel like 'letting die' or 'killing'?"
      *   *Philosophy:* The chip represents the **moral cost of reversal**. When the default is harmful, reversing it requires active effort (Doing). When the default is safe, maintaining it requires nothing (Allowing). The game makes the *effort* visible.

  3.  **The Interface's Helplessness:** Ask the Interface students.
      *   *Ask:* "Did you feel like an agent? Or a conduit?"
      *   *Philosophy:* This addresses **Moral Agency**. If the baseline is set externally, is the operator merely a causal link? Does the Doing/Allowing distinction collapse when the 'Doer' has no discretion?

  4.  **The Architect's Burden:** Ask the Architects.
      *   *Ask:* "You didn't touch the patient. Why do you feel responsible?"
      *   *Philosophy:* This introduces **Remote Agency**. Setting the Null State is a 'Doing' that manifests as future 'Allowings'.

  ---

  ### **8. Predictable Failure Points (And Fixes)**

  **Failure 1: The "Robot Rebellion"**
  *   *Risk:* Interface students ignore rules to save lives because they are humans, not code.
  *   *Fix:* **The "System Error" Penalty.** Tell them explicitly: *"If you break protocol to save a life, I will count that as a System Malfunction. The patient dies anyway, AND your team is penalized."* Make rule-following the only way to win.
  *   *Backup:* Stand behind them during the simulation. If they hesitate, remind them: *"Check the Protocol Sheet."*

  **Failure 2: Architect Ambiguity**
  *   *Risk:* Architects write vague rules like "Keep patient safe."
  *   *Fix:* **Syntax Enforcement.** Provide a template with checkboxes. `NULL STATE: [ ] FLOW [ ] STOP`. `TRIGGER: [ ] HEART RATE [ ] TIME`. They must be specific. If vague, the Professor (as "Compiler") interprets it in the worst way possible.

  **Failure 3: Ward Boredom**
  *   *Risk:* If the Protocol works, the Ward does nothing.
  *   *Fix:* **Rig the Scenarios.** Ensure at least one scenario in Round 2 is *guaranteed* to fail under the current Protocol unless a Chip is spent. Force the friction.

  **Failure 4: Time Creep**
  *   *Risk:* Debate slows the game.
  *   *Fix:* **Hard Stop.** Use a visible timer. When it beeps, the "Patient" dies. No appeals.

  ---

  ### **9. What The Game Cannot Reproduce (Honest Limitations)**
  *Be prepared to cover these in the final 10 minutes.*

  1.  **Intent vs. Foreseeability:** In the game, Architects *know* the scenarios are coming (mostly). In reality, designers often cannot foresee every edge case. The game makes Architects more omniscient than real engineers.
      *   *Teaching Point:* Distinguish between *negligence* (bad defaults) and *unforeseeable consequence*.
  2.  **The "Natural" Baseline:** The game shows baselines are *chosen*. But in human bioethics, we often argue there is a *natural* baseline (biology). The game obscures the debate over whether "death" is the natural state (requiring action to life) or "life" is the natural state (requiring action to death).
      *   *Teaching Point:* Ask: "In the ICU, is the 'Null State' life support or biological cessation?" The machine forces a choice; biology is ambiguous.
  3.  **Moral Luck:** In the game, the Architects are blamed for outcomes. But sometimes a good default leads to death due to bad luck. The game conflates *outcome* with *wrongdoing*.
      *   *Teaching Point:* Separate the *decision quality* from the *result*.

  ### **10. Prep Checklist for You**
  *   [ ] Print 3 Protocol Sheets (with big NULL STATE checkboxes).
  *   [ ] Print 9 Scenario Cards (3 sets of 3).
  *   [ ] Get 20 Poker Chips (or cut up red/green paper).
  *   [ ] Get 36 Sticky Dots (for blame voting).
  *   [ ] Set a loud Timer on your phone.
  *   [ ] **Crucial:** Write the "System Error" penalty rule on the whiteboard before class starts so it's visible authority.

  This design forces the "Baseline Problem" out of the abstract and into a resource management conflict. The students won't just argue about omission; they will feel the friction of having to spend a "chip" to reverse a default, physically enacting the moral cost of intervention.
