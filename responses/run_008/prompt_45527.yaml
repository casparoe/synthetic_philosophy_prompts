      *   **Why FPTP is the Worst Option:** It failed last year. It violates the Majority Criterion.
      *   **The Proposal (President):** Alternative Vote (IRV). Explain simply. Benefits (Majority support, no spoilers).
      *   **The Proposal (Shortlisting):** Same ballots, different count (Condorcet/Schulze). Why? Robust ranking.
      *   **Scale Argument:** 40 members means we can handle slightly more complex counting for better results. We aren't a nation-state.
      *   **Conclusion:** Motion to adopt.

  6.  **Refining the Tone:**
