      *   **Council Shortlisting (Ranked Output):** Needs a full ordering. Borda is often used here but is susceptible to cloning. **Condorcet (specifically Schulze)** is better for generating a robust ranking. Or just use the same AV ballots but count differently. Let's recommend **Schulze Method** for rankings if needed, or just note that AV ballots can be reused. Actually, for a shortlist, **Borda** is often acceptable *if* the list is long and the goal is "consensus" rather than "winner," but it's risky. Let's suggest using the same ranked ballots but analyzing via **Condorcet** for robustness.
      *   *Simplification:* To keep the memo tight, I'll recommend **Alternative Vote (IRV)** for the President. For shortlisting, I'll suggest using the **same ballots** but counting via a **Condorcet-consistent method** (like Schulze) if a full ranking is needed, as it handles cycles better than Borda.

  4.  **Addressing Arrow's Theorem (The Friend's Point):**
      *   Must admit: Yes, Arrow is right. No perfect system exists.
      *   Counter: FPTP is *also* a voting system and violates even basic fairness (Majority Criterion).
      *   Nuance: IIA (the axiom that breaks ranked systems) assumes voters don't change preferences based on options. In a 40-person society, we know each other. Context matters.
