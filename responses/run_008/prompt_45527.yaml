  *Rebuttal:* FPTP isn't a ranked system, so Arrow doesn't technically apply to it directly in the same way, but FPTP violates the *Majority Criterion* (if >50% want A, A should win), which ranked systems usually satisfy. This is a crucial distinction. FPTP is *more* flawed in practice for multi-candidate races. I need to make sure this is clear.

  *Scale:* 40 people. This is a committee. Transparency is high. Strategic voting is harder to hide. This makes ranked voting safer.

