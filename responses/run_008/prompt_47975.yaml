  Okay, let's write it.

  *Wait, one more check on the "Circularity" argument.* The user asks: "if it's doomed, does that count as real evidence for the family-resemblance view, or is that also unfalsifiable in the same sneaky way?" I need to answer this specifically. If no definition works, is it Wittgenstein? Or is it just bad definitions? I should argue that the failure of *essentialist* definitions supports family resemblance, but the "rigged battery" point means we are testing our *concepts*, not the *world*.

