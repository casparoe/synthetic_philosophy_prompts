prompt: |-
  quick context: I'm at a small AI lab and our team just grew enough that I actually have to make the calls now instead of deferring up. The decision on my desk is how to train our models on reasoning tasks (math, code, that kind of thing), and my position is that we should supervise the process, not the outcome — grade the individual reasoning steps for being sound, rather than just checking whether the final answer is right and rewarding that. My reasoning: outcome-only feedback rewards a correct answer that was arrived at through garbage reasoning, or even for bad reasons we can't see, and step-level grading gives us something legible we can audit — we know what we actually paid the model to do.

  My boss is on board but I want to know what would count *against* this before we sink six months into it. Specifically: what evidence, including things that have arguably already shown up in other labs' models, would show that process supervision is worse than outcome-only? I can think of one worry myself — that graders end up rewarding steps that *look* good rather than steps that actually caused the answer — but I assume there are more, and some might be ones a committed step-grader like me would be tempted to explain away. So I also want an honest check: has the view probably been qualified into unfalsifiability ("grade the steps but sanity-check the answer", "grade steps in domains where steps are checkable"), and if so is that a real problem for a view like this or just how engineering tradeoffs work?

  I'd like the defeaters ranked from would-actually-make-me-switch to merely annoying, and please flag which ones defenders of process supervision would concede vs. brush off.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Lead/Manager at a small AI lab. Recently promoted to decision-maker.
      *   **Decision:** Process Supervision (PRM/Process Reward Models) vs. Outcome Supervision (ORM/Outcome Reward Models) for reasoning tasks (math, code).
      *   **User's Position:** Pro-Process Supervision. Believes it ensures legible, auditable reasoning and prevents "right answer, wrong reason" scenarios.
      *   **Boss:** On board.
      *   **Goal:** Steelman the *opposition*. What evidence or arguments would suggest Process Supervision is *worse*?
      *   **Specific Requests:**
          *   Rank defeaters from "would-actually-make-me-switch" to "merely annoying."
          *   Flag which ones defenders concede vs. brush off.
          *   Address the "unfalsifiability" concern (qualifying the view until it's safe).
          *   Tone: Honest, technical, strategic, aware of lab dynamics.

  2.  **Deconstruct the Core Debate (Process vs. Outcome):**
      *   *Process Supervision (PS):* Rewarding intermediate steps. (Lightman et al., "Let's Verify Step by Step").
      *   *Outcome Supervision (OS):* Rewarding final answer correctness. (Standard RLHF/RLAIF).
      *   *The User's Intuition:* PS prevents hacking the reward function via spurious correlations. It aligns with interpretability/safety.
      *   *The Counter-Intuition:* OS is the ground truth. PS introduces noise, bias, and cost. If the answer is right, does the path *really* matter for capability?

  3.  **Brainstorming Defeaters (Arguments Against Process Supervision):**
      *   *Cost/Scalability:* Grading steps is way more expensive than grading answers. Human labelers get tired.
      *   *Error Propagation:* If the model makes a small error in step 3, do you kill the whole trajectory? OS is forgiving; PS might be brittle.
      *   *The "Look Good" Problem (Goodhart's Law):* Models learn to write plausible-sounding nonsense that gratifies the grader, rather than actually reasoning. (Sycophancy).
      *   *Constraint on Creativity:* OS allows weird shortcuts. PS forces a specific "textbook" style of reasoning that might be suboptimal for the model's internal mechanics.
      *   *Diminishing Returns:* Recent papers (e.g., from OpenAI, Anthropic, or independent researchers) suggesting PRMs don't scale as well as ORMs for final performance.
      *   *Verification Difficulty:* It's harder to verify a step than an answer. Math proofs can be checked, but "logic" in natural language is fuzzy.
      *   *Inference Overhead:* Using a PRM during beam search/inference is computationally heavier than checking a final answer.

  4.  **Selecting and Ranking the Defeaters:**
      *   *Top Tier (Switch-worthy):* Empirical performance gaps (OS beats PS on benchmarks), Cost/Scalability walls (can't afford the labels), Reward Hacking (model learns to flatter the grader).
      *   *Mid Tier (Annoying/Engineering challenges):* Inference cost, Definition ambiguity (what is a "step"?).
      *   *Low Tier (Brushed off):* Philosophical purity, Minor implementation friction.

  5.  **Addressing the "Unfalsifiability" Question:**
      *   The user asks if qualifying the view ("grade steps *but* check answers") makes it unfalsifiable.
      *   *Analysis:* It's not unfalsifiable, but it *is* a hybrid approach. Pure PS is rare. Most "PS" implementations still filter for correct answers. The real question is whether the *marginal gain* of PS justifies the cost over OS+Verification.
      *   *Verdict:* It's an engineering tradeoff, not a philosophical dodge, *unless* you claim PS is necessary for safety regardless of capability loss.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the position. It's a strong one (Lightman et al. 2023), but the landscape has shifted slightly since then.
      *   *Defeater 1: The Capability Ceiling (Empirical).* If OS gets 90% and PS gets 88% but costs 10x, that's a hard stop. *Status:* Defenders concede this happens in some domains but argue it's temporary.
      *   *Defeater 2: Reward Hacking / Sycophancy.* The model learns to write steps the *grader* likes, not steps that lead to truth. This is the "Look Good" worry amplified. *Status:* Defenders worry about this most.
      *   *Defeater 3: The Cost/Signal-to-Noise Ratio.* Human labelers are noisy. Grading 10 steps introduces 10x the noise of grading 1 answer. *Status:* Defenders concede, argue for automated verifiers.
      *   *Defeater 4: Constraining Search Space.* OS allows the model to find non-human shortcuts. PS forces human-like reasoning. *Status:* Defenders brush this off (we want human-like reasoning for safety).
      *   *Defeater 5: Inference Latency.* Running a PRM at every step slows down generation. *Status:* Engineering problem, defenders concede.

      *   *The Unfalsifiability Check:* Is "PS + Outcome Sanity Check" a retreat? Yes, it's a hybrid. Is it a problem? No, it's pragmatism. Pure PS is dangerous if the model drifts into plausible nonsense that sums to wrong answers.

  7.  **Refining the Tone:**
      *   Needs to be peer-to-peer. No fluff.
      *   Use industry terminology (PRM, ORM, RLHF, Goodhart's Law, Pareto frontier).
      *   Be specific about recent literature (e.g., mentioning that PRM gains haven't scaled as wildly as initially hoped in some contexts).

  8.  **Final Review against Constraints:**
      *   Ranked defeaters? Yes.
      *   Flagged concessions? Yes.
      *   Addressed unfalsifiability? Yes.
      *   Context: Small lab, 6-month sink cost. (Emphasize the opportunity cost).

  9.  **Self-Correction/Nuance Check:**
      *   *Correction:* I need to make sure I don't just say "PS is bad." The user *wants* PS. I need to tell them when PS *fails*.
      *   *Nuance:* The "Process" isn't just natural language steps. It can be code execution. If the user means natural language reasoning, the "Sycophancy" risk is higher. If they mean code, unit tests (outcome) are easier. I should assume natural language/math reasoning based on the prompt.
      *   *Recent Research:* Mention that while "Let's Verify Step by Step" was promising, subsequent work shows ORMs are catching up or that PRMs require massive data to beat ORMs.
      *   *Safety vs. Capability:* The user cares about "legible/auditable." This is a safety/alignment goal. The counter-argument is usually capability-focused. I need to bridge that. If PS hurts capability too much, the lab fails.

  10. **Final Polish:** Organize with clear headings. Ensure the "Unfalsifiability" section is distinct. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, I need to be careful about the "unfalsifiability" part. If you say "Grade steps but ensure answer is right," you are effectively doing Outcome Supervision with a regularizer. Is that Process Supervision? Technically it's a constrained optimization. I should point out that if the outcome constraint is hard, the process reward becomes secondary, potentially negating the benefit.

  Okay, let's structure the response.
  1. Intro: Validate the intuition (it's the "Let's Verify Step by Step" thesis).
  2. The Defeaters (Ranked).
  3. The Unfalsifiability/Qualification check.
  4. Recommendation/Conclusion.

