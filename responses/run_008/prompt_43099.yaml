answer: |-
  Dear Colleague,

  It is a pleasure to correspond with someone who recognizes that the architecture of belief often mirrors the architecture of matter, even if the substrates differ. Your analogy from statistical mechanics is not merely a helpful heuristic; it cuts to the bone of the controversy surrounding the common prior assumption. You have identified the precise tension that keeps formal epistemologists awake at night, namely that Bayesian updating resembles Hamiltonian dynamics, where the trajectory is determined by the equations of motion acting upon an initial state, while the common prior assumption resembles the microcanonical ensemble, where the distribution is dictated by the constraints of equilibrium rather than the history of the system. In your field, you know that asking why a gas has a specific Maxwell-Boltzmann distribution is to ask about its equilibrium state, derived from the dynamics and the conservation laws, whereas asking why a specific molecule is here rather than there is to ask about initial conditions which the dynamics leaves open. The trouble in epistemology is that we have the dynamics, the Bayesian conditioning, but we lack the conservation laws or the ergodic hypotheses that would derive the prior from something deeper. Consequently, the field has fractured into those who treat the prior as an arbitrary initial condition, those who treat the common prior as a law of equilibrium, and those who treat it as a mere coordinate transformation for the convenience of the modeler. You ask for a verdict on which of these it really is, and while I understand the temptation to offer a diplomatic survey, the integrity of the discipline demands a sharper edge.

  To understand why the convention view is ultimately unsatisfactory, we must first grant its utility. There is a pragmatic seduction in treating the common prior as a bookkeeping device, much like choosing a gauge in electromagnetism. If two agents disagree, the modeler can always reconcile their views by positing that they received different signals in the past, thereby pushing the disagreement into the information structure rather than the probability assignments. This preserves the mathematical elegance of the common prior while accommodating the empirical reality of human discord. It allows the economist to prove the no-trade theorem and the epistemologist to prove the agreement theorem without having to explain why two people born into the same world might see it differently. However, this convenience comes at a steep philosophical cost. If the common prior is merely a convention, then the agreement theorems lose their normative force. They become tautologies about the model rather than truths about rationality. If I can explain away any disagreement by adjusting the information sets, I have not explained why rational agents should agree; I have only defined them as agreeing by fiat. This reduces the common prior assumption to a linguistic trick, and while such tricks are useful for solving equations, they are poor guides for understanding the nature of reason.

  Conversely, the view that the common prior is an empirical hypothesis is easily dispatched by observation. People do not share priors. We see this in the polarization of political belief, the divergence of scientific paradigms, and the simple fact that two jurors can hear the same testimony and reach different verdicts without either having made a calculation error. If the common prior were an empirical claim about human psychology, it would be falsified immediately. Therefore, we are left with the Harsanyi position, that the common prior is a normative constraint on rationality. This is the view that aligns with your analogy to equilibrium statistical mechanics. In equilibrium, the distribution over microstates is not arbitrary; it is the unique distribution that maximizes entropy subject to constraints. If you assign a different distribution to a gas at equilibrium, you are not expressing a different preference; you are making a mistake about the physics. Harsanyi argues that rationality imposes similar constraints on belief. If two agents are ideally rational and share the same information, there is only one correct probability assignment they should make. To assign differently is to violate the norms of reasoning, just as assigning a non-equilibrium distribution to an equilibrium system violates the norms of thermodynamics.

  The strength of this normative view lies in its preservation of the objectivity of truth. If priors are merely initial conditions, like the position of a particle, then rationality is purely procedural; it tells you how to update, but not where to start. This implies that two agents could start at opposite ends of the probability spectrum, process the same infinite stream of evidence, and never converge, much like two non-ergodic systems that never visit the same region of phase space. This is a bleak picture for a theory of knowledge, as it suggests that reason alone cannot bridge the gap between subjective perspectives. By contrast, if the common prior is a normative requirement, it asserts that there is a unique rational response to ignorance, often grounded in principles of symmetry or indifference. It claims that rationality is not just about how you change your mind, but about where you start. This makes the agreement theorems powerful: they tell us that if we are truly rational, our differences must vanish when our information is pooled. The disagreement is not a feature of the world; it is a bug in our reasoning.

  However, we must apply your physics analogy critically here. In statistical mechanics, the equilibrium distribution is derived from the dynamics plus the assumption of ergodicity or equal a priori probability. In epistemology, we have no such derivation. We do not have a theorem that shows Bayesian updating leads to a unique prior regardless of starting point. We simply postulate the common prior. This suggests that the common prior assumption is not a derived law of rationality but a constitutive norm. It is a rule we adopt to make the game of reasoning possible. This brings us to the crux of your question regarding the rationality of disagreement. If we accept the common prior as a normative constraint, then two people who understand each other perfectly, share all their evidence, and still disagree must indeed count at least one of themselves as irrational. They have failed to meet the standard of ideal rationality. This does not mean they have committed a logical fallacy in the calculus of probability; it means they have failed to abstract away the idiosyncratic "initial conditions" of their cognitive architecture that should not influence rational belief. They are treating their personal history as a constraint on the world, rather than as data to be processed.

  Yet, there is a nuance here that distinguishes epistemology from mechanics. In mechanics, the initial conditions are factual and arbitrary. In epistemology, what we call a "prior" often encapsulates a lifetime of unrecorded evidence, genetic predispositions, and cultural conditioning. To demand a common prior is to demand that agents strip away their history and view the world from a "view from nowhere." This is why the convention view is so tempting; it acknowledges that we cannot actually strip away that history. But if we accept the convention view, we surrender the idea that disagreement is resolvable by reason. We admit that some disagreements are brute facts, like the position of a particle, rather than errors to be corrected. I argue that this surrender is too high a price. We must treat the common prior as a normative ideal, not because it describes how humans think, but because it prescribes how they ought to think if they wish to converge on the truth. It is a regulative ideal in the Kantian sense, a goal that guides inquiry even if it is never fully realized.

  Therefore, my verdict is this: the common prior assumption is a normative constraint on rationality, not a modeling convention or an empirical hypothesis. It is the epistemic equivalent of the equilibrium distribution, a state that rational agents are compelled to occupy if they are to avoid the defect of arbitrary divergence. When two agents with common knowledge of their posteriors disagree, they are not demonstrating a permissible diversity of opinion; they are demonstrating a failure of rationality. One or both of them is holding onto a prior that cannot be justified by principles of reason alone. This does not mean we should expect actual humans to agree, any more than we expect actual gases to perfectly obey the ideal gas law. But it does mean that when we model rational agents, we must impose the common prior to capture the normativity of reason, rather than relaxing it to capture the psychology of disagreement. To treat it as a convention is to confuse the map for the territory, allowing the messiness of human cognition to dictate the standards of rationality rather than the other way around.

  In the end, your intuition that the assumption sits between initial conditions and equilibrium is correct, but the weight must fall on the side of equilibrium. Priors may feel like initial conditions because they are the starting point of the dynamics for any individual agent, but the common prior assumption asserts that for rational agents, there is only one valid starting point. It is a demand that reason be universal, that the laws of thought do not depend on the accident of who is thinking them. If we relax this, we lose the ability to say that disagreement is a problem to be solved rather than a fact to be recorded. So, when you return to your seminar, you might suggest that the common prior is the price we pay for believing that communication can do more than exchange data, that it can actually align our view of the world. It is a demanding price, and one that real agents often cannot pay, but it is the only price that purchases the possibility of genuine agreement.

  Yours in shared inquiry.
