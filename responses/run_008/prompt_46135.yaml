prompt: |-
  I'm the TA for a 2nd year evolution course, and every semester we have students propose an explanation for some trait and sketch how you'd test it. Grading these is a nightmare of just-so stories: everything from giraffe necks to the human chin gets an adaptive story, the adaptation explains the trait, the trait's existence confirms the adaptation, and nobody ever considers that the thing might be a byproduct, a leftover, drift, or a straight-up physical constraint. I've been citing the Gould/Lewontin spandrels paper at them but they just nod and keep doing it. At the same time I don't want to just tell them adaptationism is wrong -- half the time the adaptive story is genuinely the best one, and teaching them to reflexively say "it's a spandrel" would be its own disease.

  Can you write a procedure the students can run on their own hypothesis before they hand it in? Something they can actually use in 15 minutes with no lit access beyond what they remember: the questions to ask in order (e.g. is the trait even heritable/variable, what's the null -- drift, constraint, byproduct of something else, is there an independent way to test the function, etc.), what counts as a passing answer to each, where the procedure stops and tells them "this isn't a testable hypothesis as stated, rewrite it", and where it has to admit it can't decide and they need the actual study. Please be honest about which steps are judgment calls dressed up as a checklist.

  Then run it on three of the ones I actually got last term: (1) the human chin as an adaptation for stress resistance during chewing, (2) the appendix as a vestigial leftover that we only keep because removing it was historically too dangerous so selection never got a clean shot at it, and (3) sickle-cell allele frequencies as an adaptation to malaria. Also, since you'll probably find one where the procedure gives a verdict I don't like -- I happen to think (2) is basically fine, and I'd want to know if the procedure really flags it, and whether the flag is correct or just an artifact of the checklist being too strict.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** TA for a 2nd-year evolution course.
      *   **Problem:** Students submit "just-so stories" (adaptationism without evidence), ignoring null hypotheses (drift, constraint, byproduct). Citing Gould/Lewontin isn't working.
      *   **Goal:** Create a 15-minute self-check procedure/checklist for students to use *before* submitting.
      *   **Constraints:** No literature access (rely on memory/logic), must be honest about judgment calls, must define pass/fail/rewrite conditions.
      *   **Task:** Write the procedure, then apply it to three specific student hypotheses:
          1.  Human chin = stress resistance (adaptation).
          2.  Appendix = vestigial leftover maintained by lack of selection pressure to remove (drift/negligible cost).
          3.  Sickle-cell = adaptation to malaria (balanced polymorphism).
      *   **Specific Concern:** The TA believes hypothesis (2) is "basically fine," but suspects the checklist might flag it. Need to analyze if the flag is valid or an artifact of strictness.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   Students love adaptive stories because they feel intuitive (teleology).
      *   They struggle with null models (drift, constraint) because they require thinking about *absence* of function.
      *   The checklist needs to force them to articulate *falsifiability*, not just plausibility.
      *   It needs to distinguish between "This is a hypothesis" and "This is a confirmed fact."
      *   It needs to address the "Adaptationist Programme" critique without banning adaptationism.

  3.  **Drafting the Procedure (The "Adaptationist Sanity Check"):**
      *   *Step 1: Variation & Heritability.* Basic population genetics. If it doesn't vary or isn't genetic, selection can't act.
      *   *Step 2: The Null Model.* What if selection *isn't* driving this? (Drift, Constraint, Exaptation).
      *   *Step 3: Independent Evidence of Function.* Can we measure the benefit without assuming the history? (Engineering/Performance analysis).
      *   *Step 4: Comparative/Phylogenetic Context.* Did it arise when the pressure arose? Do relatives have it without the pressure?
      *   *Step 5: Falsifiability.* What observation would kill this hypothesis?
      *   *Tone:* Practical, slightly skeptical, acknowledging where judgment is needed.

  4.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Human Chin (Stress Resistance).**
          *   *Variation:* Yes, chins vary.
          *   *Null:* Byproduct of facial shortening (constraint/spandrel).
          *   *Function:* Does a bigger chin actually resist stress better? (Biomechanics).
          *   *Phylogeny:* Do other primates with similar diets have chins? (No).
          *   *Verdict:* Likely a spandrel/byproduct. The adaptive story is weak compared to the developmental constraint explanation.
          *   *Checklist Outcome:* Flags it heavily.

      *   **Case 2: Appendix (Vestigial/Neutral).**
          *   *Wait, the prompt says:* "Appendix as a vestigial leftover that we only keep because removing it was historically too dangerous so selection never got a clean shot at it."
          *   *Analysis:* This is actually a *non-adaptive* hypothesis (or rather, a hypothesis about the *lack* of selection). It claims the trait persists due to negligible cost (relaxed selection), not positive selection.
          *   *Variation:* Yes.
          *   *Null:* Drift/Neutral evolution.
          *   *Function:* Does it have a function *now*? (Immune reservoir, maybe). But the hypothesis is about *origin/persistence*.
          *   *Phylogeny:* Other mammals have ceca.
          *   *Verdict:* This is a "Neutral/Nearly Neutral" hypothesis.
          *   *Checklist Outcome:* The checklist is designed to vet *adaptive* hypotheses. If a student proposes "It's vestigial," does the checklist break?
          *   *TA's Concern:* TA thinks (2) is fine. Will the checklist flag it as "Not an adaptive hypothesis"?
          *   *Resolution:* The checklist needs to handle non-adaptive hypotheses too. If the hypothesis is "It's vestigial," the burden of proof is different (show homology + lack of current function/cost). The prompt implies the student is proposing an explanation for the *trait's existence*.
          *   *Refinement:* The checklist should ask: "Are you claiming Positive Selection?" If No -> Go to Neutral Path. If Yes -> Go to Adaptive Path.
          *   *Wait, looking closer at the prompt's description of (2):* "...we only keep because removing it was historically too dangerous so selection never got a clean shot at it." This is slightly confused. It implies there *was* selection to remove it (dangerous), but it wasn't strong enough? Or that the cost of having it is low enough that selection didn't bother removing it? Usually, vestigial means "no function, low cost." If the student says "selection never got a clean shot," they are invoking *weak selection* vs. *drift*.
          *   *Critique:* This hypothesis is actually a bit muddled. Vestigial traits persist because the *cost* is low, not necessarily because removal is "dangerous" (unless they mean surgical removal, which is anachronistic). If they mean "mutation to remove it is deleterious," that's pleiotropy/constraint.
          *   *TA's View:* TA says "(2) is basically fine." I need to respect that while being honest about the biological nuance. The checklist might flag the *wording* or the *mechanism* (selection vs. drift).
          *   *Decision:* I will run the checklist honestly. If it flags it, I will explain *why* (it's a neutral hypothesis being tested with an adaptive checklist, or the mechanism described is slightly off).

      *   **Case 3: Sickle-Cell (Malaria).**
          *   *Variation:* Yes.
          *   *Null:* Drift? (Unlikely given frequencies).
          *   *Function:* Heterozygote advantage.
          *   *Phylogeny/Geography:* Correlates with malaria zones.
          *   *Verdict:* Strong adaptive hypothesis.
          *   *Checklist Outcome:* Passes.

  5.  **Refining the Checklist (Addressing the "Judgment Call" requirement):**
      *   I need to explicitly mark where the student has to use judgment.
      *   I need to make sure the checklist doesn't just say "Adaptationism Bad." It should say "Adaptationism Needs Evidence."
      *   I need to address the TA's worry about Hypothesis 2. If the checklist flags it, is it because the checklist is biased toward adaptation? Or because the hypothesis is actually a "Null Hypothesis" masquerading as an explanation?
      *   *Correction:* Hypothesis 2 is an explanation for *persistence*, not *origin*. It's a "Nearly Neutral" argument. The checklist should accommodate this.
      *   *Key Insight:* The prompt asks for a procedure to run on *their hypothesis*. If their hypothesis is "It's a spandrel," the checklist should validate that. If their hypothesis is "It's an adaptation," the checklist should stress-test that.
      *   *Wait, re-reading the prompt:* "every semester we have students propose an explanation for some trait... grading these is a nightmare of just-so stories." The students are usually proposing *adaptive* stories. Hypothesis (2) is interesting because it's a *non-adaptive* story (vestigial).
      *   *The Conflict:* The TA says "(2) is basically fine." But the description ("removing it was historically too dangerous so selection never got a clean shot") is biologically weird. Selection doesn't "try" to remove things. Mutations arise. If the trait is costly, selection removes individuals. If the trait is neutral, drift takes over.
      *   *Strategy:* I will build the checklist to distinguish between "Adaptive Claim" and "Non-Adaptive Claim." Then I will apply it. I will point out that (2) passes as a non-adaptive claim but fails the "mechanism" check if interpreted strictly. I will validate the TA's intuition while correcting the biological phrasing.

  6.  **Drafting the Content:**
      *   **Introduction:** Acknowledge the TA's frustration. Validate the Gould/Lewontin issue.
      *   **The Protocol:** "The 15-Minute Adaptationist Stress Test."
      *   **Structure:** 5 Steps. Clear Pass/Fail/Rewrite criteria.
      *   **Honesty:** Call out where "biological intuition" is required.
      *   **The Application:** Run the three cases.
      *   **The Analysis of Case 2:** Deep dive into why the TA likes it, why the checklist might twitch, and who is right. (Spoiler: The student's phrasing is teleological ("selection never got a shot"), but the core idea [low cost -> persistence] is sound neutral theory).

  7.  **Review against Constraints:**
      *   15 minutes? Yes, keep it concise.
      *   No lit access? Yes, rely on logic/known facts.
      *   Honest about judgment calls? Yes, annotate them.
      *   Address the TA's worry about (2)? Yes, dedicated section.

  8.  **Final Polish:**
      *   Ensure tone is supportive but rigorous.
      *   Make sure the "Stop/Rewrite" conditions are clear.
      *   Ensure the distinction between "Adaptation" (process) and "Adaptation" (trait) is clear if needed (probably too nuanced for 2nd year, stick to "Selected For" vs. "Byproduct").

  *(Self-Correction during drafting)*: I need to be careful with Hypothesis 2. The student says "removing it was historically too dangerous." This sounds like they think selection *wants* to remove it but can't. That's teleology. The biological reality is "The cost of having it is lower than the threshold of selection efficacy." I need to make sure the checklist catches this teleological language without rejecting the valid core concept (neutral persistence).

  Let's build the checklist to have a "Claim Type" gate at the start. Are you claiming it was *shaped by* selection (Adaptation) or *tolerated by* lack of selection (Vestigial/Neutral)? This solves the Case 2 problem.

  Okay, ready to write.
answer: |-
  Here is a procedure designed for 2nd-year undergraduates. It is calibrated to be strict enough to kill just-so stories but flexible enough to allow genuine adaptive hypotheses (and valid non-adaptive ones) to pass.

  Following the procedure, I have run it on your three cases and provided an analysis of the "Appendix Problem" you flagged.

  ***

  # The 15-Minute Adaptationist Stress Test
  **For:** 2nd Year Evolution Students
  **Goal:** Determine if your evolutionary explanation is a testable hypothesis or a just-so story.
  **Constraints:** No Google Scholar. Use logic, course concepts, and general knowledge.

  ### Step 0: Classify the Claim
  Before starting, label your hypothesis.
  *   **Type A (Adaptive):** Selection *favored* this trait because it conferred a specific advantage. (e.g., "Necks got long to reach leaves.")
  *   **Type B (Non-Adaptive):** This trait exists due to drift, constraint, or as a byproduct of something else. (e.g., "Necks got long due to sexual selection on body size; reaching leaves is a side effect.")

  *If you are writing a Type A, you must pass Steps 1–5. If Type B, you must pass Steps 1, 2, and 4.*

  ### Step 1: The Raw Material Check (Variation & Heritability)
  **Question:** Is there evidence that this trait varies in the population and that the variation is genetic?
  *   **Pass:** You can state that the trait varies (e.g., "Some chins are more prominent") and is known to be heritable (e.g., "Family studies show...").
  *   **Fail/Rewrite:** If the trait is invariant (everyone has it exactly the same) or purely environmental (e.g., a scar), selection cannot shape it. **STOP.** Rewrite as a developmental or physiological question, not an evolutionary one.
  *   **Judgment Call:** In 2nd year, you can assume basic morphological traits are heritable unless you know otherwise. Don't get bogged down here, but acknowledge it.

  ### Step 2: The Null Model (The "So What?" Test)
  **Question:** What is the specific alternative to your hypothesis?
  *   **Type A Requirement:** You must explicitly state: "The null hypothesis is that this trait is a byproduct of [X], or fixed by drift." You cannot just say "The null is no function."
  *   **Type B Requirement:** You must explicitly state: "The null hypothesis is that this trait *does* have a function selected for by [Y]."
  *   **Pass:** You have named a specific rival explanation (e.g., "Chin is a structural byproduct of jaw shortening" OR "Appendix has immune function").
  *   **Fail/Rewrite:** If you cannot imagine a world where the trait exists *without* your proposed cause, your hypothesis is unfalsifiable. **STOP.** Rewrite to include a specific null.

  ### Step 3: Independent Evidence of Function (Type A Only)
  **Question:** Can you measure the benefit *without* assuming the history?
  *   **Pass:** You propose a way to measure performance *now*. (e.g., "We can biomechanically test if a larger chin withstands more chewing force.")
  *   **Fail/Rewrite:** If the only evidence for the function is the existence of the trait itself (e.g., "We know it's for chewing because we have it and we chew"), you are circular. **STOP.** Rewrite to focus on performance or correlation.
  *   **Judgment Call:** You don't need the actual data, just the *method*. If the method is impossible in principle (e.g., "Ask the ancestor why they evolved it"), flag it.

  ### Step 4: The Phylogenetic/Geographic Match
  **Question:** Does the distribution of the trait match the distribution of the proposed pressure?
  *   **Pass:** The trait appears when/where the pressure appears. (e.g., "Sickle-cell is high where malaria is high.")
  *   **Fail/Rewrite:** The trait exists where the pressure does not, or vice versa. (e.g., "All primates chew, but only humans have chins.") **STOP.** This suggests your pressure is not the driver.
  *   **Judgment Call:** This relies on your general knowledge. If you aren't sure, state it as a prediction ("If this is true, we should see X in relatives").

  ### Step 5: The Falsification Condition
  **Question:** What specific observation would prove you wrong?
  *   **Pass:** A clear condition. (e.g., "If we find a population with high malaria but no sickle-cell allele," or "If biomechanical testing shows chin size doesn't correlate with stress fractures.")
  *   **Fail/Rewrite:** "Nothing would prove it wrong" or "It's too complex to know." **STOP.** This is not a scientific hypothesis.

  ***

  # Running the Procedure on Your Three Cases

  Here is how the checklist handles the specific examples from your last term.

  ### Case 1: The Human Chin (Adaptation for Stress Resistance)
  *Claim Type:* **A (Adaptive)**

  1.  **Variation:** Pass. Chins vary; heritability is assumed.
  2.  **Null Model:** Pass. Student *should* identify "Byproduct of facial shortening during brain expansion" as the null. (If they didn't, they fail here).
  3.  **Independent Function:** **FAIL.**
      *   *Reasoning:* Can we test if chins resist stress? Yes. But do we see evidence that animals without chins *fail* at chewing? No. Other primates chew tough vegetation without chins.
      *   *Judgment:* The student must acknowledge that the "function" is unique to humans despite the "pressure" (chewing) being universal in mammals.
  4.  **Phylogenetic Match:** **FAIL.**
      *   *Reasoning:* Chewing existed long before human chins. If chewing stress drove chin evolution, why don't gorillas have chins?
  5.  **Falsification:** Pass. "If primates with higher bite forces lack chins."

  **Verdict:** **REWRITE.**
  The checklist correctly identifies this as a just-so story. The phylogenetic mismatch (Step 4) is the killer. The trait appears without the unique presence of the proposed pressure.

  ### Case 2: The Appendix (Vestigial/Neutral Persistence)
  *Claim Type:* **B (Non-Adaptive)**
  *Student Phrasing:* "Vestigial leftover... removing it was historically too dangerous so selection never got a clean shot at it."

  1.  **Variation:** Pass. (Presence/absence varies, though mostly fixed).
  2.  **Null Model:** **PASS/FLAG.**
      *   *Reasoning:* The student identifies the null: "It has a current function (Adaptive)."
      *   *Nuance:* The phrasing "selection never got a clean shot" is teleological. Selection doesn't "try" to remove things.
  3.  **Phylogenetic Match:** **PASS.**
      *   *Reasoning:* Related mammals have ceca; humans have reduced ceca (appendix). Matches the "leftover" claim.
  4.  **Falsification:** **PASS.**
      *   *Reasoning:* "If we find the appendix provides a critical survival advantage that increases reproductive success."

  **Verdict:** **PASS (with a notation on mechanism).**
  The checklist accepts this as a valid Non-Adaptive hypothesis. However, the specific wording in Step 2 ("selection never got a shot") is biologically imprecise.

  ### Case 3: Sickle-Cell Allele (Adaptation to Malaria)
  *Claim Type:* **A (Adaptive)**

  1.  **Variation:** Pass. Allele frequencies vary.
  2.  **Null Model:** Pass. "Drift" or "Mutation-Selection Balance without heterozygote advantage."
  3.  **Independent Function:** Pass. "Measure malaria resistance in heterozygotes vs. homozygotes."
  4.  **Phylogenetic/Geo Match:** Pass. Allele frequency correlates geographically with malaria endemicity.
  5.  **Falsification:** Pass. "If allele frequency is high in non-malaria zones without other explanations."

  **Verdict:** **PASS.**
  This is a robust hypothesis. The checklist confirms it because the geographic correlation provides the independent evidence required in Step 4.

  ***

  # Analysis of the "Appendix Problem" (Case 2)

  You mentioned you think Case 2 is "basically fine," but you were worried the checklist might flag it. Here is the honest breakdown of why the checklist behaves the way it does, and where the student's phrasing is actually problematic.

  **1. Why the Checklist Passes It (Mostly)**
  Because I included **Step 0 (Classify the Claim)**, the checklist doesn't force Non-Adaptive hypotheses to prove "Function" (Step 3). If a student says "This is a spandrel/vestige," they are not required to prove it *does* something; they are required to prove it *doesn't need to*. The checklist respects Gould/Lewontin by allowing Non-Adaptive claims to pass if they meet the Null and Phylogenetic criteria.

  **2. Where the Student's Phrasing is Actually Wrong**
  You noted the student said: *"removing it was historically too dangerous so selection never got a clean shot at it."*
  Biologically, this is teleological nonsense. Selection is not an agent trying to prune the genome.
  *   **Correct Neutral Theory:** The trait persists because the *cost* of having it is lower than the *threshold of selection efficacy* ($1/2N_e$). It's not that removal is "dangerous"; it's that the mutations required to remove it either don't arise, or the slight cost of keeping it isn't enough to be "seen" by selection.
  *   **The Checklist's Reaction:** If you are strict on Step 2 (Null Model), you might flag the *mechanism*. The student is describing "Relaxed Selection" but using language that implies "Positive Selection against the trait that failed."
  *   **Your Instinct:** You are right that the *conclusion* (it's vestigial/neutral) is fine. The checklist validates the conclusion.
  *   **The Teaching Moment:** If you use this checklist, you can circle Step 2 and write: *"Your conclusion is correct, but your mechanism is teleological. Selection doesn't 'try' to remove traits. Rewrite this as: 'The metabolic cost of the appendix is too low for selection to act against it.'"*

  **3. Is the Checklist Too Strict?**
  No, but it forces precision.
  *   If the student had written: "It's vestigial because it does nothing and doesn't cost much," the checklist gives a clean **PASS**.
  *   Because they wrote: "Selection couldn't get a shot at it," the checklist exposes a misunderstanding of *how* neutrality works, even if the *result* (it's neutral) is correct.

  **Recommendation:**
  Use the checklist, but add a footnote to Step 2: *"Avoid teleological language. Selection does not 'try,' 'want,' or 'attempt.' Describe costs, benefits, and probabilities."* This protects your Case 2 students from failing on semantics while correcting the misconception that drives the just-so stories in Case 1.

  **Summary for your Students:**
  Tell them: *"This checklist is not designed to tell you if you are right or wrong. It is designed to tell you if you are speaking biology or speaking poetry. Case 1 is poetry. Case 3 is biology. Case 2 is biology, but you used poetry words to describe it."*
