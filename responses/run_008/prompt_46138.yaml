answer: |-
  Here is the full design for *The Harwick Inscription*. It is built to replicate the specific psychological friction you described: the quiet, unconscious slide from record to memory, and the social pressure to smooth rough truths into communal comfort.

  ### I. Materials & Preparation

  **The Room:**
  *   One large table (or tables pushed together) so all twelve can see each other.
  *   A whiteboard or large pad of paper for the Plaque Draft.
  *   **The Cards:** 12 index cards (see Section II).
  *   **The Dossier:** 12 identical folders containing the "Archival Truth" (see Section III).
  *   **Pens:** Red and black.

  **The Rule of Silence:**
  *   Participants cannot show their cards to one another. They can only speak the story. This forces the "corruption" to happen in the telling, not in the reading.

  ### II. The Index Cards (The Memory)

  **Design Logic:**
  There is an **Archival Truth** (which they do not see yet) and **12 Memory Variations**.
  *   **The Archive:** 6 Dead. Mill owner (Mr. Harwick) locked the doors to prevent theft. Fire brigade arrived 40 minutes late due to frozen hoses.
  *   **The Drift:** The cards systematically soften the owner's guilt, reduce the death toll, or externalize the blame. This mimics the "protective lie" of community memory.

  **Instructions on Card:** *"Read this silently. You are telling the group what your grandfather told you about the Harwick Fire. Do not show the card. Speak from memory."*

  **The 12 Cards:**
  *(Note: The bolded sections indicate the deviation from the archival truth.)*

  1.  **Card 1:** "Grandpa said the fire started in the sifters. **Three men died**, trapped inside. **Mr. Harwick was there, trying to pry the doors open.** The firemen came as fast as they could."
  2.  **Card 2:** "Grandpa said the fire started in the sifters. **Four men died**. **The doors were chained, but only to keep thieves out at night.** The firemen **fought the cold to get here**."
  3.  **Card 3:** "Grandpa said the fire started in the sifters. **Three men died**. **Mr. Harwick broke his hand trying to open the chains.** The firemen were delayed by **snow on the roads**."
  4.  **Card 4:** "Grandpa said the fire started in the sifters. **Five men died**. **The workers had locked themselves in to stay warm.** Mr. Harwick **wept when he saw the smoke.** The firemen came **within the hour**."
  5.  **Card 5:** "Grandpa said the fire started in the sifters. **Four men died**. **A saboteur had jammed the locks.** Mr. Harwick **threw water on the walls.** The firemen **did their best**."
  6.  **Card 6:** "Grandpa said the fire started in the sifters. **Three men died**. **The doors were stuck from the cold, not chained.** Mr. Harwick **carried one man out.** The firemen were **brave**."
  7.  **Card 7:** "Grandpa said the fire started in the sifters. **Four men died**. **Mr. Harwick was the first to call for help.** The doors **had been repaired the week before.** The firemen arrived **before dawn**."
  8.  **Card 8:** "Grandpa said the fire started in the sifters. **Five men died**. **The chains were old and rusted.** Mr. Harwick **lost his coat in the fire.** The firemen **couldn't get water fast enough**."
  9.  **Card 9:** "Grandpa said the fire started in the sifters. **Three men died**. **Mr. Harwick tried to hold the roof up.** The doors **were locked by the night watchman.** The firemen **froze their hands on the hoses**."
  10. **Card 10:** "Grandpa said the fire started in the sifters. **Four men died**. **Mr. Harwick stayed until the end.** The doors **were secure against unions.** The firemen **came from the next town over**."
  11. **Card 11:** "Grandpa said the fire started in the sifters. **Three men died**. **The heat warped the locks.** Mr. Harwick **paid for the funerals.** The firemen **worked all night**."
  12. **Card 12:** "Grandpa said the fire started in the sifters. **Five men died**. **Mr. Harwick was asleep but woke to the bells.** The doors **were meant to protect the flour.** The firemen **did what they could**."

  **The Pattern for You to Observe:**
  *   **Death Toll:** Archive says 6. Cards range from 3 to 5. (Minimizing loss).
  *   **The Doors:** Archive says Owner locked them. Cards say "Stuck," "Saboteur," "Watchman," "Thieves," or "Warmth." (Diffusing culpability).
  *   **The Owner:** Archive says Absent/Negligent. Cards say "Trying," "Wept," "Carried," "Paid." (Humanizing/Heroizing).
  *   **The Firemen:** Archive says 40 mins late/Frozen. Cards say "Fast as they could," "Brave," "Before dawn." (Validating effort over result).

  ### III. The Archival Dossier (The Record)

  Hand this out *only* after the first plaque is signed. It should look bureaucratic, typed on onion-skin paper or aged printouts.

  **Folder Contents:**
  1.  **Coroner's Inquest (Excerpt):** *"Verdict: Accidental Death. Six (6) bodies recovered. Cause of death: Smoke inhalation and burning. Note: All exterior exit doors were found padlocked from the outside. Key found in possession of owner, J. Harwick."*
  2.  **Insurance Adjustment Ledger:** *"Claim denied. Clause 14: Negligence. Owner failed to provide egress. Fire Brigade log shows call received 02:15, arrival 02:55. Delay due to frozen hydrants at Station 4."*
  3.  **The Daily Gazette (Feb 1927):** *"Mill Owner Absent During Fire. Harwick at Winter Estate in City. Town Council Calls for Inquiry."*

  ### IV. Timing & Sequencing (3 Hours)

  **0:00 – 0:15 | Introduction & Distribution**
  *   Welcome. No theory. No mention of "memory vs. history."
  *   Hand out cards. Give them 2 minutes to read and internalize.
  *   **Instruction:** "You are the elders of Harwick. You are telling the younger generation what happened. Speak naturally. Do not read verbatim; tell it as you remember it."

  **0:15 – 1:00 | The Storytelling Round**
  *   Go around the table. Each person tells their version (3 mins each).
  *   **Facilitator Role:** Take notes on the whiteboard *only* on points of agreement. If someone says "3 died" and the next says "5 died," do not correct them. Let the dissonance hang.
  *   *Observation:* Watch how the story smooths out as it passes. By person 10, they may start adopting details from Person 1 to create cohesion.

  **1:00 – 1:45 | Plaque Drafting (Round 1)**
  *   **Task:** "We are commissioning a centennial plaque. It must be exactly 40 words or fewer. It must be signed by all 12 of you. If one person refuses to sign, the plaque is not installed."
  *   **Process:** Appoint one Scribe (rotate if needed). The group dictates.
  *   **Constraint:** You (Facilitator) enforce the Unanimity Rule. If someone objects, the text does not go on the board. Do not allow voting. It must be consensus.
  *   *Goal:* They will likely converge on a vague, heroic narrative that ignores the specific contradictions (e.g., "In honor of the brave men who died...").

  **1:45 – 2:00 | The Break (Crucial)**
  *   Collect the signed plaque text (photocopy it).
  *   Hand out the **Dossiers**.
  *   Give them 5 minutes to read in silence. The room will get quiet.

  **2:00 – 2:30 | Revision & Defense (Round 2)**
  *   **Task:** "You have new information. You may revise the plaque text. The 40-word limit and Unanimous Signature rule still apply."
  *   **Dynamic:** Some will want to include the "Truth" (6 dead, locked doors). Others will argue the Plaque is for *honor*, not *evidence*.
  *   **Facilitator Role:** If they gridlock, remind them: "The plaque remains blank if you do not agree."

  **2:30 – 3:00 | The Debrief**
  *   (See Section VI).

  ### V. Facilitating the Plaque Negotiation

  The risk here is that the group votes ("Majority rules") or you impose a solution. You must resist this.

  **Script for Consensus:**
  *   *If they vote:* "The rule is unanimity. A vote leaves someone out. The plaque requires all names."
  *   *If they stall:* "What words can we use that hold the weight of what we know but fit the purpose of a memorial?"
  *   *If they get angry:* "This is the friction. This is the work. Sit with it."

  **The "Collapse" Protocol:**
  If, at 2:25, they have not agreed:
  *   Stop the drafting.
  *   Declare the plaque "Unfinished."
  *   Move to debrief. *An unfinished plaque is a valid result.* It proves the point that truth and consensus are sometimes incompatible.

  ### VI. The Debrief (Mapping the Experience)

  Do not lecture. Ask these questions in order. Let the silence do the work.

  1.  **On Convergence:** "In the first round, did anyone change a detail from their card while speaking? Why? Was it to make the story flow better, or because someone else's version sounded more 'right'?"
      *   *Target:* Reveals the social pressure to align memory.
  2.  **On the Plaque:** "Look at the first draft. Did it match the cards? Or did it match the *idea* of what a plaque should sound like?"
      *   *Target:* Distinguishes **Commemorative Accuracy** (what comforts the living) from **Archival Accuracy** (what happened).
  3.  **On the Dossier:** "When you saw the Coroner's Report, did you feel betrayed by the documents, or by your own story? Which felt more like the 'lie'?"
  4.  **On Obligation:** "What does the town owe the dead? Does it owe them the cold number '6', or does it owe them the story that lets the town sleep at night? Can it owe both?"
  5.  **The Novelist's Question:** "If you were writing a novel about this fire, which version would you publish? The one that sells, the one that honors the families, or the one in the dossier? Why?"

  ### VII. Risk Assessment: What Will Go Wrong

  **1. The Trauma Trigger (High Probability)**
  *   **Risk:** A participant has a family member who died in a fire, or a history of industrial trauma in their family. The "game" feels like a violation.
  *   **Mitigation:**
      *   **Content Warning:** In the festival description and at the door, state: *"This workshop explores community trauma, fire, and death."*
      *   **The Exit Ramp:** At the start, say: "If at any point this hits too close to home, you may step out without explanation. You can return when you wish. No questions asked."
      *   **In the Moment:** If someone gets visibly upset, pause. Acknowledge the reality. "This is fiction, but the feeling is real. Take your time." Do not force them to participate in the plaque signing.

  **2. The "Archivist as Power" Problem (Certain)**
  *   **Risk:** You hold the "Truth" (the Dossier). You are the State. The participants are the subjects. This replicates the power dynamic you want to critique, rather than examining it.
  *   **Mitigation:** In the debrief, explicitly name this. "I held the archive. I decided what was 'true' in this room. In your real research, who holds the archive? Is the newspaper neutral? Is the family photo album neutral? I was the gatekeeper today. Who is the gatekeeper in your town?"

  **3. The Plaque Gridlock (Medium Probability)**
  *   **Risk:** They cannot agree. The workshop ends in frustration.
  *   **Mitigation:** As noted in the protocol, an unfinished plaque is a *successful* outcome for the lesson. It demonstrates the incommensurability of the two truths. Do not rescue them.

  ### VIII. Confidence & Critique

  **Confidence Ratings:**
  *   **The Card/Dossier Collision (90%):** This will work. The cognitive dissonance of holding two conflicting "facts" is visceral and reliable.
  *   **The Storytelling Drift (75%):** Participants might stick too rigidly to their cards. You may need to nudge them: "Tell it like you remember it, don't read it."
  *   **The Plaque Consensus (60%):** This is the volatile element. Twelve adults agreeing on 40 words is difficult. It may devolve into politeness rather than truth.
  *   **The Debrief Insight (85%):** Provided you don't lecture, the questions are designed to lead them to your specific realization about "quietly siding with family."

  **The Weakest Element:**
  **The Unanimity Rule on the Plaque.**
  *   **Why:** In a 3-hour workshop with strangers, social politeness often overrides truth. They may sign a vague plaque ("We remember the brave") just to get to the next stage, bypassing the conflict entirely. They might treat the signature as a formality, not a moral stance.
  *   **How to Fix:** You must raise the stakes of the signature. Tell them: *"Signing this means you stand by this text as the historical record for the next 100 years. If you sign, you own this lie or this truth."* Remind them halfway through Round 1 that they can refuse to sign. Make the refusal a valid, respected option.

  **The Missing Feature (Real Stakes):**
  You correctly identified that this lacks **consequence**. In your novel, if you choose family memory, you might lose critical acclaim or historical credibility. In this room, if they choose the "lie," nothing happens.
  *   **Your Supply:** You must supply the *emotional weight* in the debrief. Connect their hesitation to sign the "Archive Truth" plaque to the fear of hurting their own family. Ask: *"If you put 'Negligence' on that plaque, who in this room would be angry? Who would stop talking to you?"* That makes the stakes real.

  **Final Note on Rigging:**
  The design *does* rig the outcome toward the conclusion that "Memory is softer than Record." The Cards are designed to be flattering; the Dossier is designed to be cold.
  *   **Correction:** Ensure the Dossier isn't *too* villainous. If the Owner is a monster in the Archive, it's easy to reject him. If the Archive shows the Owner was just *tired* or *confused*, but the Memory makes him a *Hero*, the conflict is harder.
  *   **Adjustment:** Tweak the Dossier slightly. Maybe the Coroner's report says "Locks found engaged," but doesn't explicitly say Harwick locked them *that night*. Let the *implication* of negligence stand, rather than a smoking gun. This forces the participants to interpret the ambiguity, just like you do in your drafts.

  This design respects your participants' intelligence and mirrors your own creative struggle. It moves the problem from the abstract to the physical (the pen, the signature, the card). Good luck.
