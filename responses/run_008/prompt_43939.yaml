prompt: |-
  My hospital, like most, has two completely different ways of declaring death depending on where you are. In the ER, death is when the heart and breathing stop permanently. But in the ICU, a ventilated patient whose entire brain has stopped functioning can be declared dead by neurological criteria while their heart is still beating and their organs are being kept warm and perfused — sometimes for days. And then there's organ donation after circulatory death, where they wait only a couple of minutes after the heart stops before starting procurement. That's way too short for the loss of circulation to be irreversible, since people get resuscitated successfully after much longer arrests, so defenders of the practice say the stopping only needs to be permanent (nobody will try to restart the heart) rather than irreversible (nobody could). What definition of death does this patchwork actually presuppose? Is death being treated as a biological fact about the organism, or partly as a decision about what will be done for the patient? Can one institution coherently treat death as both the loss of circulation and the loss of brain function, or is one of those criteria quietly doing all the real work while the other is a legal fiction? And does the permanent-not-irreversible move smuggle in the idea that death is partly constituted by human choice about when to stop intervening — and if so, is that a scandal or just an honest admission of what we were doing all along? Please answer in continuous prose only, like a long email — no headings, no bullet points, no bold text, no tables.
