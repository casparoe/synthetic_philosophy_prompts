answer: |-
  Your observation cuts directly to the heart of one of the most persistent and uncomfortable tensions in modern bioethics and clinical practice. You are quite right to notice that the operational definitions of death shift depending on the location in the hospital and the clinical context, and this variability is not merely a matter of administrative convenience but reflects a deeper philosophical ambiguity about what death actually is. The patchwork you describe presupposes a definition of death that is not solely a biological fact existing independently of human intervention, but rather a status conferred upon a patient when the loss of biological function is deemed sufficient to warrant the cessation of treatment and the initiation of post-mortem protocols. In essence, the working definition across these departments is the permanent loss of the capacity for consciousness and the permanent loss of the capacity to sustain spontaneous circulation and respiration, but the pathway to verifying that loss changes based on technology and intent.

  When we look at the coherence of treating death as both the loss of circulation and the loss of brain function, we have to understand that these are not necessarily two different definitions of death, but rather two different indicators of the same underlying reality, which is the loss of the organism functioning as an integrated whole. In the traditional cardiopulmonary model, when the heart stops, the brain dies quickly from lack of oxygen, and the organism ceases to be an integrated unit. In the neurological model, the brain has died first, and while the heart may continue to beat with mechanical support, the body is no longer being driven by the central integrator that makes it a single living entity rather than a collection of perfused tissues. From this perspective, the institution is not necessarily contradicting itself by using two criteria, because both criteria are proxies for the same end point: the irreversible loss of the capacity for consciousness and the irreversible loss of the ability to maintain homeostasis without artificial support. However, this coherence relies on the assumption that a body kept alive by a ventilator after brain death is no longer a person or an organism in the morally relevant sense, which is a philosophical claim as much as a biological one.

  The situation becomes more ethically fraught with donation after circulatory death, where the distinction between permanent and irreversible cessation of circulation is invoked. You are correct to identify that this distinction smuggles in the idea that death is partly constituted by human choice. If a patient is declared dead after two minutes of asystole because no resuscitation will be attempted, but could theoretically be resuscitated if someone chose to do so, then the state of being dead is contingent on the decision not to intervene. This suggests that death is not purely a biological switch that flips at a specific moment in time, but rather a status that emerges from the intersection of biological reality and social or medical policy. If death were purely a biological fact independent of human action, the possibility of resuscitation would mean the patient is not yet dead, regardless of whether anyone intends to resuscitate them. By accepting the permanent rather than the irreversible standard, medicine is implicitly admitting that death is partly a normative judgment about when further treatment is futile or unwanted, rather than just a descriptive judgment about physiological status.

  This leads to your question about whether this is a scandal or an honest admission. It is likely more accurate to view it as an honest admission of what modern medicine has been doing all along, though one that we often obscure with technical language. For most of human history, the decision not to intervene and the fact of death were simultaneous because we lacked the capacity to reverse death once it appeared to have occurred. The development of CPR, ventilators, and intensive care decoupled the biological potential for recovery from the decision to pursue it. Consequently, declaring death now inevitably involves a judgment about the appropriateness of continued intervention. To call this a scandal implies there is a pure biological definition available that we are ignoring, but given that life support can maintain cellular function indefinitely in a brain-dead body, the pure biological line is already blurred. The real work is being done by the concept of the loss of integrated function, but the timing of the declaration is inevitably influenced by the context of care, including the potential for organ donation.

  Ultimately, the institution can coherently treat death as both the loss of circulation and the loss of brain function only if it accepts that death is the loss of the organism's ability to function as a whole, regardless of which system fails first. However, the reliance on the permanent rather than irreversible standard in circulatory death does confirm that death is partly a decision about what will be done for the patient. This is not necessarily a corruption of the concept, but rather a recognition that in the era of advanced life support, the boundary between life and death is not just a line drawn by nature, but a threshold managed by society. We define death not only by what the body can do, but by what we are willing to do for the body. Acknowledging this does not diminish the reality of death, but it does require us to be transparent about the fact that our definitions are shaped by our capabilities and our values, ensuring that the declaration of death remains a safeguard for the living rather than just a procedural step for the dead.
