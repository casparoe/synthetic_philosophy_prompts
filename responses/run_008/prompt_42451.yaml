  ### Surviving Candidate Rules

  To understand *why* she holds these views, we can distill her logic into two competing candidate rules. Both fit her past record, but they diverge on the source of the unfairness.

  **Candidate Rule 1: The Democratic Deficit Threshold**
  *   **Definition:** Fairness is determined primarily by the *volume* of wasted votes. If a party exceeds a specific vote share (approx. 15–20%), it is undemocratic for them to hold zero seats, regardless of geography.
  *   **Logic:** Country D was unfair because 22% is too many people to ignore. Country B was fair because 12% is negligible.
