          *   *Rating:* Right (with a caveat on which Malthus). The 1798 text was indeed stark, but later editions softened. However, the core "iron law of wages" style prediction failed in the industrialized world.

      *   *Marcus Move 1:* Conflates mechanism with timetable. Claim: Population presses against subsistence *unless* checked by restraint/innovation. Coal/Haber-Bosch were contingent windfalls not asserted to be impossible. Verdict: Sound mechanism, wrong timing.
          *   *Analysis:* This is the "Neo-Malthusian" defense. It shifts the claim from "inevitable collapse by date X" to "collapse unless technology solves it."
          *   *Rating:* Right-with-an-important-caveat. It accurately describes how the theory evolved, but risks moving the goalposts if the original claim was stronger.

      *   *Dara Move 2:* "Right but early" makes doom theories unfalsifiable. Population Bomb, Millerites could all claim this. No failed prediction with a date counts against anything.
          *   *Analysis:* This is a strong Popperian critique. If you can always say "wait longer," falsifiability vanishes.
          *   *Rating:* Right. This is a standard and valid criticism of unfalsifiable eschatology.

      *   *Marcus Move 2:* Popper's model is too crude for structural long-run claims. Timing depends on variables (rate of innovation) the theory didn't pin down. Opposite bias (Simon-Ehrlich) is also a category error.
          *   *Analysis:* Defends structural models against strict date-based falsification. Points out that resource optimism (Simon) also makes assumptions.
          *   *Rating:* Right-with-an-important-caveat. Long-run structural claims *are* different than specific event predictions, but they still need to constrain expectations to be useful.

      *   *Dara Move 3:* Rescue has to cost something. A theory surviving every missed date by redescribing itself as early buys immunity too cheaply. What has Malthusianism ever forbidden?
          *   *Analysis:* This is the "Lakatosian" critique (research programmes). Is the core hardening or degenerating? What predictions does it rule out?
          *   *Rating:* Right. This is the crux of the philosophy of science argument.

      *   *Marcus Move 3:* It forbids plenty — e.g., sustained exponential growth in per-capita welfare for a closed population with unrestricted fertility and fixed agricultural land. A prohibition without a date is still a real prohibition.
          *   *Analysis:* Defines the boundary conditions. If $X$ (finite land) and $Y$ (unrestricted fertility), then $Z$ (collapse).
          *   *Rating:* Right. This specifies the ceteris paribus conditions.

  3.  **Address the Underlying Issue (Philosophy of Science):**
      *   *The Line:* The line between "right but early" and "degenerating rescue" lies in *independent variable specification*.
      *   *Legitimate:* "The bridge will collapse when load exceeds $X$." If load is currently $0.9X$, saying "it's right but early" is valid *if* we can measure load.
      *   *Degenerating:* "The bridge will collapse." It doesn't. "It will collapse when the invisible stress reaches critical mass." (Unmeasurable/adjustable).
      *   *Malthus Application:* Malthus specified variables (population, food). He underestimated the *function* relating land to food (technology).
