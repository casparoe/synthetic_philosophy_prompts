answer: |-
  You have identified a precise and well-documented problem in the philosophy of science, though it rarely has a single catchy name in popular discourse. You are describing a specific species of **ad hoc rescue** known technically as an **immunizing stratagem**, specifically involving **temporal deferral**.

  Here is the breakdown of the existing concepts, the tools for distinguishing legitimate from degenerate rescues, the contested readings of your examples, and a proposed term for the specific configuration you noticed.

  ### 1. The Established Concepts

  There are two main frameworks that cover what you are seeing.

  **A. The Immunizing Stratagem (Oskar Albert)**
  The German philosopher Oskar Albert coined the term *Immunisierungsstrategie* (immunizing stratagem). This occurs when a theory is threatened by empirical evidence, and instead of accepting the falsification, the theorist modifies the background assumptions or the scope of the theory to make the evidence compatible.
  *   **Fit:** This covers the logic. The theory is "immunized" against the falsifying data (the missed date).
  *   **Limit:** It is a broad category. It covers changing definitions, adding hidden variables, or shifting timelines. It doesn't specifically name the *time* shift.

  **B. The Degenerating Research Programme (Imre Lakatos)**
  Imre Lakatos provided the tool you asked for to distinguish "legitimate" from "degenerate" rescues. He argued that we shouldn't judge a single theory in isolation, but rather a "research programme" (a core theory plus its auxiliary hypotheses).
  *   **Progressive Shift:** A rescue is legitimate if, after modifying the theory to account for the failure, it predicts **novel facts** that were not previously expected. (e.g., "We missed the 1990 oil peak because we didn't account for fracking; therefore, we predict a surge in US oil output by 2010.")
  *   **Degenerating Shift:** A rescue is degenerate if it only explains the past failure without generating new, risky predictions. (e.g., "We missed the 1990 oil peak because of unforeseen technology; the peak is now coming.")
  *   **Fit:** This answers your request for a principled way to tell them apart.
  *   **Limit:** Lakatos admitted this is often only visible in **hindsight**. In the moment, a degenerating programme can look progressive.

  ### 2. The Specific Configuration: "Temporal Immunization"

  While "immunizing stratagem" is the standard philosophical term, it does not specifically capture the *temporal* nature of the move you described (shifting the date while keeping the mechanism). In the literature on futurism and eschatology, this is sometimes called **eschatological deferral**, but that carries religious baggage.

  Since no single standard term captures the *economic/scientific prediction + failed date + mechanism preserved* configuration precisely, I will coin a term for this specific subset, building on Albert's framework.

  **Term:** **Temporal Immunization**
  **Definition:** A defensive maneuver where a falsified time-bound prediction is saved by reclassifying the time variable from an *essential condition* to a *contingent parameter*, while asserting the causal mechanism remains invariant.
  **Exclusion:** It excludes "moving the goalposts" where the *outcome* changes (e.g., "We said collapse, but actually we meant stagnation"). In Temporal Immunization, the outcome remains identical; only the coordinate changes.

  ### 3. Distinguishing Legitimate vs. Degenerate Rescues

  You asked for a principled way to tell the difference *at the moment of rescue*, rather than in hindsight. This is the hardest problem in philosophy of science. Most philosophers agree that **you cannot know with certainty in the moment.** However, you can apply a heuristic based on Lakatos's criteria.

  **The "New Risk" Test:**
  When the proponent says, "We were right in principle, just early," ask: **"What specific, checkable thing must happen between now and the new date that didn't happen before?"**

  *   **Legitimate Rescue (The Malthusian Exception):**
      *   *Claim:* "The population pressure mechanism is real, but the Haber-Bosch process (synthetic fertilizer) temporarily offset it."
      *   *New Risk:* "If fertilizer production plateaus or energy costs for nitrogen fixation rise, the pressure will resume by Year X."
      *   *Why it works:* It identifies a specific *shield* that protected us and predicts what happens if that shield fails. It turns the "delay" into a new variable to be measured.

  *   **Degenerate Rescue (The Degenerating Programme):**
      *   *Claim:* "The collapse is inevitable, just delayed."
      *   *New Risk:* None. The mechanism is vague ("finite land"), and the new date is arbitrary.
      *   *Why it fails:* It treats the delay as "noise" rather than data. If the theory cannot explain *why* it was early (other than "we underestimated innovation"), it is not learning from the error.

  **The Principled Distinction:**
  A rescue is legitimate if the *reason for the delay* becomes a new part of the theory that can be independently tested. It is degenerate if the delay is attributed to a vague "external factor" that is not modeled.

  ### 4. Contested Ground: The Malthus Reading

  You asked me to flag where scholars disagree. There is significant contention over whether Malthus himself actually made the prediction his critics attack.

  *   **The Standard Reading (Your Commute Version):** Malthus predicted inevitable famine due to geometric population growth vs. arithmetic food growth. This reading makes him easily falsifiable by the last 200 years of data.
  *   **The Contested Reading (Scholarly Nuance):** Many historians of economic thought argue Malthus was describing a **tendency**, not a hard law with a deadline. He wrote about "checks" on population (preventative and positive). Some argue he anticipated that moral restraint or technology could alter the curve.
      *   *Implication:* If Malthus described a *tendency* (pressure on resources) rather than a *prophecy* (mass starvation by 1900), then he was not falsified, and the "right but early" defense is unnecessary. He was simply describing a force (like gravity) that can be counteracted by other forces (like lift).
      *   *Contrast:* The 1970s "Limits to Growth" or Paul Ehrlich's *The Population Bomb* made specific, date-bound claims. These are clearer cases of Temporal Immunization when defended today.

  **My Carving:** I treat the "Malthus was right in principle" claim as a Neo-Malthusian defense of the *mechanism*, distinct from Malthus's original text. The epistemic sin usually lies with the modern defenders who treat a tendency as a prophecy that was merely "delayed."

  ### 5. A Boundary Case: Commercial Nuclear Fusion

  To test the definition of **Temporal Immunization**, consider the timeline of commercial nuclear fusion.

  *   **Prediction:** Since the 1960s, physicists have often stated fusion is "20 years away."
  *   **Falsification:** It is now 60 years later, and we still do not have commercial fusion.
  *   **The Rescue:** "The physics was right (net energy is possible), but the engineering materials and plasma confinement stability took longer to solve. We are now 10 years away."
  *   **Is it Legitimate or Degenerate?**
      *   *Argument for Legitimate:* The delay is explained by specific technical hurdles (tokamak stability, neutron damage to walls) that are being actively measured. Progress is quantifiable (Q-factor improvements). This fits Lakatos's "Progressive Shift."
      *   *Argument for Degenerate:* The "20 years" claim is repeated identically every decade without adjusting the economic model. If the prediction is always "20 years from now" regardless of the starting date, it functions as a statement of faith, not science.
      *   *Verdict:* This is a genuine boundary case. It sits right on the edge. It is **Temporal Immunization**, but it *might* be a progressive research programme if the next decade yields a net-energy pilot plant. If the date slips again without a specific technical explanation for the new slip, it becomes degenerate.

  ### 6. Summary and Recommendation

  You have spotted **Temporal Immunization**, a specific subtype of an **Immunizing Stratagem**.

  *   **When you hear it:** Someone concedes a failed prediction but insists the causal mechanism remains valid, shifting the event to a later date.
  *   **How to evaluate it:** Apply the Lakatos Test. Does the explanation for the delay generate a *new, testable prediction*?
      *   If they say, "We didn't account for X (specific tech/policy), and now that X is saturating, the crash will happen," that is **Legitimate**.
      *   If they say, "Human ingenuity delayed it, but limits are real," without specifying what limit is being approached *now* that wasn't being approached *then*, that is **Degenerate**.

  **Final Note on "Right but Early":**
  In logistics, you know the difference between a shipment that is delayed due to a specific bottleneck (port strike, engine failure) and a shipment that is delayed because the ETA was estimated using a broken model. The former is a legitimate delay; the latter is a model error.
  *   **Legitimate Rescue:** Identifies the bottleneck (e.g., "We didn't model the Green Revolution").
  *   **Degenerate Rescue:** Blames the ETA without fixing the model (e.g., "The demand curve is still valid, the date was just optimistic").

  The danger you sensed is real: when "Right but Early" becomes a universal shield, the theory ceases to be a map of reality and becomes a compass that always points to "Eventually."
