  # Joint Statement on Decision-Making Under Moral Uncertainty

  **Parties:** [User] and [Sister]
  **Date:** October 26, 2023
  **Subject:** Resolution of Disagreement Regarding Action Guidance Under Moral Uncertainty

  ### I. Agreed Claims

  We, the undersigned, acknowledge the following claims as common ground in our discussion of how to act when uncertain about which moral theory is true:

  1.  **Existence of Moral Uncertainty:** We agree that it is possible to be uncertain about which fundamental moral theory (e.g., utilitarianism, deontology, virtue ethics) is correct, and that this uncertainty is distinct from empirical uncertainty about the consequences of our actions.
  2.  **Goal of Action:** We agree that the objective of deliberation is to perform the action that is, in fact, morally right (or at least, to minimize the probability of committing a serious moral error).
  3.  **Relevance of Credence:** We agree that our subjective degrees of belief (credences) in various moral theories are relevant to our decision-making process; we reject the notion that we must act as if we are 100% certain of one theory when we are not.
  4.  **Convergence at Extremes:** We agree that in cases where credence in one theory is overwhelming (e.g., 99% vs. 1%), both of our methods would likely prescribe the same action, namely, following the dominant theory.
  5.  **Rejection of Nihilism:** We agree that moral skepticism or nihilism is false; there are objective moral truths, even if we are currently unsure what they are.
  6.  **Action-Guiding Stakes:** We acknowledge that our disagreement is not merely academic; in specific cases (such as the "Minor Promise" case described below), our methods yield contradictory instructions on what to do.

  ***

  ### II. Table of Disagreements and Cruxes

  | Issue | Sister's Position (Moral Expected Value) | User's Position (My Favorite Theory) | Crux, Test Case, and Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. Intertheoretic Comparison** | **Possible and Necessary.**<br>It is coherent to compare the "value" or "disvalue" assigned by different moral theories on a common scale (e.g., by normalizing utilities), allowing them to be weighed against one another. | **Incoherent or Impossible.**<br>Different moral theories use fundamentally different currencies (e.g., "utils" vs. "duties"). There is no neutral exchange rate, so averaging them is a category error. | **Crux:** Can we construct a "moral exchange rate"?<br>**Case:** Theory A says Action X = +10 units. Theory B says Action X = -10 units.<br>**Sister's Judgment:** These cancel out; the agent is indifferent.<br>**User's Judgment:** This comparison is meaningless; the agent must ignore the numbers and follow the higher credence. |
  | **2. Decision Rule** | **Maximize Expected Moral Value (MEMV).**<br>Calculate the moral value of each action according to each theory, weight by credence, and choose the highest sum. This treats moral uncertainty analogously to empirical risk. | **Maximize Credence (MFT).**<br>Identify the single moral theory with the highest subjective probability and act exactly as that theory prescribes, ignoring the "magnitude" of value in rival theories. | **Crux:** Is moral uncertainty structurally identical to empirical uncertainty?<br>**Case:** 51% sure a box contains $100; 49% sure it contains a bomb.<br>**Sister's Judgment:** Don't open (Expected Value is negative).<br>**User's Judgment:** Open (Most likely outcome is gain). *Note: User may concede empirical risk aversion but denies it applies to moral theories.* |
  | **3. The "Minor Promise" Case** | **Keep the Promise.**<br>Even at 45% credence, the "grave wrong" of breaking the promise outweighs the "small good" of breaking it at 55% credence. Risk aversion regarding moral wrongdoing is rational. | **Break the Promise.**<br>Since the "small good" theory has higher credence (55% > 45%), we must follow it. The "gravity" of the wrong in the minority view cannot veto the majority view. | **Crux:** Does a minority view ever have veto power?<br>**Case:** 40% credence that an action is *infinitely* wrong (lexical prohibition).<br>**Sister's Judgment:** Yes, veto. Expected value becomes negative infinity.<br>**User's Judgment:** No veto. 40% < 60%, so proceed. |
  | **4. Risk Attitude** | **Moral Risk Aversion.**<br>It is rational to be more concerned with avoiding high-magnitude moral errors (even if unlikely) than securing low-magnitude moral gains (even if likely). | **Moral Risk Neutrality.**<br>Once credences are assigned, the "magnitude" of error in a less-credible theory should not influence the choice. Only the probability of the theory being *true* matters. | **Crux:** Is "moral risk" a coherent concept?<br>**Case:** A policy saves 1,000 lives (T1: 51%) but violates 1 right (T2: 49%).<br>**Sister's Judgment:** Depends on the normalized weight of the Right vs. Lives.<br>**User's Judgment:** Save the lives (T1 wins). |

  ***

  ### III. Note on Verbal Dispute

  We have reviewed our disagreement to determine if it is merely verbal (i.e., using the same words to mean different things without substantive conflict).

  **Conclusion:** The dispute is **substantive**, not merely verbal.

  **Reasoning:**
  1.  **Divergent Action:** In the "Minor Promise" case, our methods prescribe opposite physical actions (Breaking vs. Keeping). A verbal dispute cannot result in contradictory physical behaviors if both parties understand the facts of the case.
  2.  **Metaphysical Commitment:** The disagreement rests on a factual claim about the structure of moral reality: specifically, whether moral theories share a common ontology of value that permits mathematical aggregation.
      *   If the Sister is right (common scale exists), the User's method is systematically liable to cause grave moral harm by ignoring high-stakes minority theories.
      *   If the User is right (no common scale), the Sister's method is mathematically incoherent, akin to adding meters to kilograms.
  3.  **Potential Verbal Element:** There is a minor verbal component regarding the definition of "rationality." The Sister defines rationality as *consequence-optimizing under uncertainty*, while the User defines it as *consistency with highest-probability truth*. However, clarifying this definition does not resolve the action-guidance conflict; it merely labels it. Therefore, the core dispute remains substantive.

  ***

  **Signed,**

  _________________________ (Sister)

  _________________________ (User)
