      *   *Correction on Argument 2:* The "Rightward Drift" claim is contentious. Is it actually rightward, or just technocratic? The sorting mechanism claim is the weak link. The prompt explicitly asks me to be honest about this weakness.
      *   *Tone:* Professional, strategic, slightly cynical (matching the journalist's vibe), but constructive.
