answer: |-
  Here is a decision tree designed for your reading group. It avoids labels like "substantivalism" or "absolute space" in the questions, relying instead on concrete physical predictions and conceptual coherence.

  ### The Decision Tree

  **Start Here: Node 1 (The Empty Bucket)**
  *Imagine a universe containing nothing but a single bucket of water. The bucket is spinning. Does the water climb up the sides?*

  *   **NO (Water stays flat):** Inertia requires other matter to exist.
      *   $\rightarrow$ Go to **Node 2**.
  *   **YES (Water climbs):** Inertia exists even without other matter.
      *   $\rightarrow$ Go to **Node 3**.

  ---

  **Node 2 (The One-Particle Test)**
  *Imagine a universe containing exactly one single particle. Is the statement "The particle is moving in a straight line" physically meaningful?*

  *   **NO (It is nonsense):** Motion is nothing but a change of relation between bodies. One body cannot have relations.
      *   $\rightarrow$ **Leaf A: Leibnizian Relationism**
  *   **YES (It is meaningful, but...):** The statement makes sense kinematically, but the particle would have no *inertia* (no resistance to force) because there is no distant mass to generate it.
      *   $\rightarrow$ **Leaf B: Machian Relationism**

  *(Note: If you need to probe further here, ask the **Two Globes** question: "Two globes connected by a cord in an empty universe. Is there tension?" Mach says "No tension." Leibniz says "The scenario is impossible to describe.")*

  ---

  **Node 3 (The Massive Shell)**
  *Take the spinning bucket from Node 1. Now surround it with a massive, thick shell of distant stars. If we keep the bucket static but rotate the massive shell around it, does the water climb?*

  *   **NO (Water stays flat):** The distribution of matter does not affect the standard of inertia. Space is a rigid stage.
      *   $\rightarrow$ **Leaf C: Newtonian Absolutism**
  *   **YES (Water climbs):** The matter in the universe interacts with the local geometry to determine inertia.
      *   $\rightarrow$ **Leaf D: Metric Field Realism**

  ---

  ### The Leaves (Position Mapping)

  Here is where the standard philosophical positions land based on the path taken:

  *   **Leaf A (Leibnizian Relationism):** Space is not a thing; it is an order of co-existences. Without at least two bodies, "space" and "motion" are logical errors.
  *   **Leaf B (Machian Relationism):** Space is a bookkeeping device. Inertia is a real physical effect, but it is causally generated by the distribution of distant mass (the "fixed stars").
  *   **Leaf C (Newtonian Absolutism):** Space is a container (Absolute Space). It exists independently of matter and dictates what counts as non-accelerated motion. Matter does not affect space.
  *   **Leaf D (Metric Field Realism):** Spacetime is a physical field (the metric $g_{\mu\nu}$). It is not a mere container (it interacts with matter), but it is not merely relations (it exists and has structure even in a vacuum).

  ---

  ### Analysis for the Group Leader

  #### 1. Answer Combinations Nobody Holds (Empty Leaves)
  There is one major "forbidden" zone in this tree that corresponds to a physically incoherent position in modern physics:
  *   **The "Magic Shell" Combo:** Answering **YES** to Node 1 (Empty Bucket has inertia) but **NO** to Node 3 (Shell rotation has no effect).
      *   *Wait, this is Newton.* (Correction: Newton is a valid historical position).
      *   *The actual empty combo:* Answering **NO** to Node 1 (Empty Bucket has no inertia) but **YES** to Node 3 (Shell rotation causes climbing).
      *   *Why?* If inertia vanishes in an empty universe (Node 1 = No), there is no physical mechanism for the water to climb when the shell rotates (Node 3 = Yes), unless you posit that mass *creates* inertia (Mach). But if mass creates inertia, you are a Machian.
      *   *Actually, the truly empty combo is:* **YES** to Node 1, **NO** to Node 3, but claiming **Space is Dynamical**. You can't claim space is a dynamical entity that interacts with matter (GR) but then claim matter doesn't drag it (Newton).
      *   *Simpler Empty Combo:* **NO** to Node 1, **NO** to Node 3, but claiming **Inertia is Real**. If inertia doesn't exist in the empty case, and matter doesn't induce it in the shell case, you have denied inertia entirely.

  #### 2. Pairs the Tree Cannot Separate (Indistinguishable Leaves)
  You suspected **Absolutism vs. Metric Field**. You are **wrong** (which is good news!).
  *   **Newton (Leaf C) vs. Metric Field (Leaf D):** These *are* separated by Node 3 (Frame Dragging). Newtonian absolute space is rigid; it is not "dragged" by rotating mass. The GR metric field *is* dragged (Lense-Thirring effect). If your students accept the GR prediction, these leaves are distinct.

  **The Real Problem: Mach vs. Leibniz (Leaf A vs. Leaf B)**
  *   **The Issue:** In the classical regime, Mach and Leibniz are empirically indistinguishable. Both say "No" to the Empty Bucket.
  *   **The Split:** Node 2 (One Particle) attempts to separate them metaphysically.
      *   *Leibniz* denies the *conceivability* of the scenario (Identity of Indiscernibles).
      *   *Mach* accepts the scenario but denies the *dynamics* (no inertia).
  *   **Warning:** In a GR context, Mach's view is often absorbed into Metric Field Realism (since the metric field acts like the "distant masses"). Pure Machian Relationism is technically incompatible with GR vacuum solutions (like gravitational waves in empty space). You should flag to the group that **Leaf B (Mach)** is historically important but arguably extinct in post-1915 physics, whereas **Leaf A (Leibniz)** survives in modern "Ontic Structural Realism."

  #### 3. Facilitation Tips for Grad Students
  *   **SR Comfort:** Remind them that "Straight line" in Node 2 implies a geodesic. Since they know SR, they know inertial motion is privileged. The question is *why*.
  *   **GR Haze:** For Node 3, don't ask them to calculate frame dragging. Ask for the *conceptual* link: "If space is just a stage (Newton), does it matter if the audience rotates? If space is a fluid-like field (GR), does it matter?"
  *   **The "Hole Argument":** If the group finishes early, introduce the Hole Argument to Leaf D (Metric Field). It challenges whether the metric field is truly "substantival" or if diffeomorphism invariance forces us back toward a sophisticated relationism. This adds nuance to Leaf D.

  ### Summary of Node Logic
  1.  **Empty Bucket:** Separates "Inertia is intrinsic" (Newton/GR) from "Inertia is extrinsic" (Mach/Leibniz).
  2.  **Massive Shell:** Separates "Space is rigid" (Newton) from "Space is coupled" (GR).
  3.  **One Particle:** Separates "Space is impossible without bodies" (Leibniz) from "Space is possible but inert without bodies" (Mach).
