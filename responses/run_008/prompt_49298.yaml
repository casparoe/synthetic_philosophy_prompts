      *Wait, does this fit 6?* If a billionaire manipulates a market (5), they are trying to cause the outcome. The counterargument (6) says "sure, but info still gets out." The principle says "No, because the *governance* is corrupted." The user's gut says "Not fine." So the principle supports the gut, forcing the user to reject the "manipulation subsidizes info" academic argument in a governance context.
