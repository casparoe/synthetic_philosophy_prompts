      *   *Strongest Principle:* **The Principle of Decoupled Epistemic Authority.** Markets are valid tools for aggregating probabilistic beliefs *only so long as* the mechanism translating those beliefs into action remains subject to human accountability and normative deliberation. When the market *becomes* the decision mechanism, it bypasses the necessary friction of democratic legitimacy and creates perverse incentives to manipulate the underlying reality rather than just predict it.

