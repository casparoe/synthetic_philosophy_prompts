      I think the "Decoupling" angle is the most robust. It explains why advisory is fine (8) but binding is not (3). It explains why election markets are fine (1 - they don't decide the election) but assassination markets are not (4 - they incentivize the event). It explains the manipulation worry (5) because if the market decides, manipulation is an attack on governance, not just a trade.
      *Wait, let's look closer at 6.* The user is half-convinced by the "manipulation subsidizes info" argument. This suggests the user values *accuracy*. But the gut says "not fine." Why? Because *governance* isn't just about accuracy. It's about legitimacy.
      *Revised Principle:* **The Legitimacy-Accuracy Tradeoff.** Markets optimize for accuracy (truth). Governance optimizes for legitimacy (consent/accountability). You can use markets to inform governance, but you cannot substitute market accuracy for political legitimacy.
      *Actually, let's go with **The Incentive-to-Intervene Principle**.*
      *   Case 1 (Elections): I bet on it, I can't easily change it. (Pass)
