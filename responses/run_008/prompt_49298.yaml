      *   *Better Principle:* **The Separation of Prediction and Power.** Markets function well as *predictors* when they lack *executive power*. When markets are granted executive power (Futarchy), they cease to be neutral aggregators and become battlefields for causal intervention, inviting predation and eroding accountability.

      Let's refine this to be more precise.
