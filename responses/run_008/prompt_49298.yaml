  6.  **Refining the Principle:**
      Let's call it **The Principle of Distinct Accountability Regimes.**
      *   *Idea:* Financial markets enforce accountability via profit/loss. Political governance enforces accountability via re-election/legal/social sanction. These are not fungible.
