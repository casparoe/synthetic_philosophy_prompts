answer: |-
  Here is my number, though I offer it with the usual humility required when quantifying historical consciousness. I place my credence at 0.85 that more than half of today's European nation-states had no mass national identity before 1750, defined strictly as ordinary people imagining horizontal kinship with strangers. This is higher than your editor's 0.7, reflecting my view that the modernist school, while sometimes overly mechanistic, correctly identifies the structural prerequisites for nationalism that simply did not exist for the majority of Europeans prior to the mid-eighteenth century. To arrive at this figure, I have to decompose the claim into the four sub-questions you outlined, because the final number is essentially a weighted average of how much confidence I have in each of those underlying premises.

  The first and heaviest weight rests on how we count mass participation versus elite self-identification. My confidence here is about 0.95 that elite identity cannot stand in for mass identity in this context. Before 1750, a French nobleman might have felt a distinct loyalty to the Crown that separated him from a Spanish nobleman, but a French peasant identified with his village, his parish, and his immediate lord, not with the abstract concept of France. The social horizon was too narrow. Unless we are willing to argue that the political consciousness of the top five percent dictates the national identity of the whole, which contradicts the Andersonian definition you are working with, this premise holds almost securely. The second term concerns whether print capitalism and vernacular standardization were necessary conditions or merely accelerants. I assign this a probability of 0.90. While oral cultures can sustain strong group bonds, the specific mechanism of imagining millions of strangers requires a shared medium of communication that fixes language and synchronizes time. Without the novel, the newspaper, and the standardized textbook, the cognitive leap required to feel kinship with someone three hundred miles away is psychologically improbable for the masses. There are rare exceptions, perhaps in island nations or highly homogenous religious communities, but as a general rule for continental Europe, print was the engine.

  The third term is the most contentious, involving the ethnosymbolist critique regarding pre-modern protonational attachments like religious confession or dynastic loyalty. Here my confidence drops to 0.80 that these should not count as national in even a weaker sense. Critics like Anthony Smith argue that modern nations were built on pre-existing ethnic cores, and there is truth to the idea that religious wars, such as the Thirty Years War, hardened boundaries that later became national ones. However, identifying as a Catholic or a subject of the Habsburgs is fundamentally different from identifying as German or Austrian. The former are vertical or universalist categories, while the latter are horizontal and territorial. I remain convinced that the translation of religious or dynastic loyalty into secular national loyalty required a deliberate recoding that had not happened for the majority of states by 1750, but I leave more room for error here because the continuity of symbols and myths is harder to disprove than the absence of print culture. The fourth term involves the counterfactual of industrialization and urbanization alone producing nations absent deliberate state-building. I assign this a lower probability of 0.75, because while industrialization creates the structural need for a standardized workforce, it does not dictate the specific cultural content of the nation. Without the deliberate myth-making, the schooling, and the conscription that states imposed, urbanization might have produced class identities or cosmopolitanism rather than national ones. This term matters less for the timing question than the others, but it affects whether we see the nation as inevitable or constructed.

  Combining these into the final 0.85 requires treating them not as a strict mathematical chain where one failure collapses the whole, but as converging lines of evidence. The high confidence on the mass versus elite distinction and the necessity of print pulls the average up, while the uncertainty around pre-modern attachments and the industrial counterfactual prevents it from reaching certainty. If I were to model this, I would treat the first two terms as having double the weight of the latter two, because they address the mechanism and the demographic scope directly, whereas the latter two address the origins and inevitability. The calculation is less about multiplying probabilities and more about assessing the cumulative weight of the historical record; the absence of evidence for mass national feeling before 1750 is so stark in parish records and travelogues that it overwhelms the theoretical possibility of hidden continuities.

  The number is most sensitive to the third term, the question of pre-modern protonational attachments. If future research were to demonstrate that peasants in 1700 routinely identified with a linguistic or ethnic community broader than their region, independent of elite projection, my credence would drop sharply, perhaps toward 0.6. This is the weakest link in the modernist armor because it relies on interpreting silence in the historical record. The sort of evidence that would move me most would not be high theory but granular data from historians. I am thinking of parish records that show migration patterns correlated with language boundaries, or conscription rolls from the early eighteenth century that indicate whether deserters fled to a neighboring province or a neighboring nation. Language-shift data from catechism records would be invaluable, showing whether villagers understood the priest only because he spoke their local dialect or because a standardized vernacular had already penetrated the countryside. Similarly, literacy rates broken down by region could show if the capacity for print capitalism existed before the state enforced it. If we found evidence of widespread vernacular literacy in 1700 without state schooling, the necessity of print as a state tool weakens. Until such data appears, however, the silence of the masses before the age of revolutions remains the loudest evidence we have, and that is why I stay high at 0.85.
