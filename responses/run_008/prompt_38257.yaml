          3.  *Aggregation:* Does summing deaths globally presuppose commensurability and additivity across time/space? What would a non-additive measure look like?
          4.  *Meta-question:* Is there a "fact of the matter" about the trend, or only facts about measures? Which commitments are doing real work? How should an honest headline be hedged?

  2.  **Analyze Each Question & Formulate Arguments:**

      *   **Question 1: The Unit (Deaths vs. Structural Violence)**
          *   *Observation:* Counting deaths is operationalizable. Counting "suffering" or "structural violence" (Galtung) is not.
          *   *Philosophical Commitment:* It privileges *event-based* violence over *process-based* violence. It assumes the state's monopoly on violence is good if it reduces homicide, even if it increases incarceration or structural inequality.
          *   *Coherence with "Thick" Conceptions:* Hard to make coherent directly. You'd need proxy metrics (DALYs, disability, surveys on fear). The current practice effectively defines violence as "lethal interpersonal conflict."
          *   *Key Term:* "Epistemic violence" of exclusion.

      *   **Question 2: Normalization (Rates vs. Totals)**
          *   *Observation:* Population growth means absolute numbers go up even if safety improves.
          *   *Philosophical Commitment:* Utilitarian/Individualist. It cares about *your* probability of dying, not the total sum of grief in the universe. It aligns with liberal political theory (rights of the individual).
          *   *Total View:* A "total utilitarian" would care about the absolute sum of suffering. If population doubles and rate halves, total deaths stay same. Is that progress? Pinker says yes (safer for you). Total view says maybe not (same amount of grief).
          *   *Why Rates?* Comparability. You can't compare a tribe of 100 to a nation of 100 million without normalization. But the choice of *which* normalization (per capita vs. total) is axiological.

      *   **Question 3: Aggregation (Commensurability)**
          *   *Observation:* Summing implies a death in 14th C France = a death in 21st C Syria.
          *   *Philosophical Commitment:* Universalism/Humanism. All lives have equal weight.
          *   *Non-Additive View:* Context matters. A death in a genocide might "count more" morally than a random homicide because of the intent to destroy a group. Or, social fabric matters more than bodies.
          *   *Alternative:* Qualitative indices, social trust metrics, inequality measures.

      *   **Question 4: The Meta-Question (Fact of the Matter?)**
          *   *Observation:* "Violence" is a thick ethical concept (Williams/Putnam). It's not just a natural kind like "water."
          *   *Answer:* There is no view-from-nowhere fact. There are facts *relative to a framework*.
          *   *Which commitments do work?* The definition of violence (lethal vs. structural) does the most work. Normalization does the second most.
          *   *Hedging:* "Lethal violence per capita has declined, but structural harm may not have."

