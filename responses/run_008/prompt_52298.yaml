      *   **The Timescale Clue:** Shows both sides accept functional equivalence doesn't require specific speeds, but they disagree on *what constitutes the functional unit* (colony vs. organism).
      *   **The Moral Clue:** Suffering requires phenomenology. You can't have "bookkeeping suffering." This forces the Holists to defend not just intelligence, but *qualia* at the colony level, which is much harder.

  6.  **Develop Paths to Progress:**
