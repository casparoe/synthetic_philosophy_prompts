      *   **Individualists:** Sound like *Biological Naturalists* (Searle-esque) or *Organismic Individualists*. There's something about the biological unity or evolutionary history of a single organism that grounds mentality. They view colony-level intentionality as *derived* (like a computer), not *original*.

