answer: |-
  ### The Scenario: The Fairness Gamble

  You are offered a choice between two payout structures for a procedure you are about to undergo, with stakes high enough to matter but low enough to be mundane (e.g., a bonus affecting your next vacation). **Option A** uses a classical coin flip: 50% chance you receive $100, 50% chance you receive $0. **Option B** uses a quantum random number generator (QRNG) configured to split the wavefunction into two equal-amplitude branches: in one branch, your successor receives $100; in the other, your successor receives $0. **Option C** uses a QRNG configured so that in both branches, your successor receives $50. A rational agent who is risk-neutral regarding money but averse to inequality *between their own future selves* must choose. If you treat the QRNG outcomes as creating two co-existing beneficiaries (branch-selves) but the classical outcomes as creating only one beneficiary (your future self in the actual world), your preference ordering will diverge from an agent who treats classical counterparts in other possible worlds as morally equivalent to quantum branches.

  ### The Walkthrough

  **1. Strict Lewisian Modal Realism (Counterpart Theory)**
  *Verdict: Indifferent between Option A and Option C (assuming risk neutrality).*
  For the Lewisian, you exist only in this world. In Option A, you face a 50% objective chance of being the $100-self and a 50% chance of being the $0-self. In Option C, you face a 100% chance of being a $50-self (or branching into two $50-selves, which sums to the same utility). The "other" outcome in Option A belongs to a counterpart in a causally isolated world. That counterpart is not you; they are merely qualitatively similar. Your self-concern extends only to the person who is causally continuous with you in this world. Since you are risk-neutral, the Expected Utility (EU) of Option A ($50) equals Option C ($50). Inequality between you and your counterpart is an interpersonal ethical concern, not a matter of rational self-interest.

  **2. Everettian Branching (Born-Weighted Care)**
  *Verdict: Prefer Option C over Option A.*
  For the Everettian, the QRNG in Option A creates two distinct successors, both of whom are causally continuous with the pre-branch you. Both are "you" in the sense that matters for self-concern. Option A results in a multiverse state where one successor has $100 and the other has $0. Option C results in a multiverse state where both successors have $50. If you have a preference for fairness *among your own temporal stages/successors* (intra-personal inequality aversion), Option A imposes a penalty that Option C avoids. Even if the Born-weighted sum is identical ($50), the distribution matters because both recipients exist within the same ontological reality (the wavefunction) and share your causal history. You are not choosing between risks; you are choosing between an equal distribution and an unequal one across your future selves.

  **3. Collapse View (Standard Single-World)**
  *Verdict: Indifferent between Option A and Option C (assuming risk neutrality).*
  This view aligns with the Lewisian on the decision, though for different metaphysical reasons. In the Collapse view, only one outcome becomes real. The "loser" in Option A does not exist; they are a counterfactual. Therefore, there is no second self to be treated unfairly. There is only you, facing risk. If you are risk-neutral, the variance in Option A does not disqualify it against the certainty of Option C. Self-concern tracks the single actual future, not the unrealized possibilities.

  ### The Work-Doing Feature

  The divergence is generated entirely by **causal co-existence**.

  In the Everettian case, the "Winner" and "Loser" share a common causal past (you) and exist within the same physical ontology (the universal wavefunction). They are, in a robust sense, *together*. This allows for intra-personal comparisons of welfare (fairness) to apply. In the Lewisian and Collapse cases, the "Loser" is either non-existent (Collapse) or causally isolated in a distinct concrete world (Lewis). They are not *with* you. Therefore, inequality between you and them is inter-personal (or non-existent), which falls outside the scope of strict rational self-interest for a risk-neutral agent.

  If you remove shared causal history (e.g., by stipulating the QRNG branches decohere into entirely separate universes with no common past), the Everettian verdict collapses into the Lewisian one. If you add causal history to the Lewisian counterparts (making them accessible), they cease to be Lewisian counterparts and become Everettian branches.

  ### The Lewisian Attack

  A Lewisian would attack the case by denying the premise that branch-selves warrant *greater* concern than counterparts. They would argue: "You are smuggling in a premise that 'existence in the same wavefunction' matters morally. But moral concern tracks identity, and identity is strict. I am not my branch-successors any more than I am my counterparts. If I care about the branch-self who gets $0, it is because I am altruistic toward my future selves, not because they are *me*. If I am equally altruistic toward my counterparts, the divergence vanishes. If I am not, the Everettian is irrationally privileging physical proximity over qualitative resemblance."

  Lewis himself, in his late piece "How Many Lives Has Schrödinger's Cat?" (2004), acknowledged that if branching were real, it would threaten ordinary identity because it violates the principle that identity is one-to-one. He suggested that if we accept branching, we must accept that "I" will be both successors, which forces a change in how we count lives. However, he maintained that in Modal Realism, counterparts are *not* me, so the threat to identity is unique to Everett. A modern Lewisian would press that unless you can justify why causal connection grounds *self*-concern while qualitative resemblance does not, the Everettian is just engaging in special pleading for the physical structure of the multiverse.

  ### The Stand

  **Self-concern properly extends to branch-selves, but *not* to Lewisian counterparts.** The two relations ground genuinely different kinds of concern.

  The justification is that rational self-concern is grounded in **psychological continuity and causal connectedness**, not merely qualitative resemblance. In the Everettian case, the branch-selves inherit my memories, intentions, and causal trajectory. They are the literal causal successors of my current mental state. To ignore their welfare is to ignore the consequences of my actions on the only entities that will carry my projects forward.

  In the Lewisian case, the counterpart does not inherit my causal history. They are a distinct person who happens to resemble me. My concern for them is properly altruistic, not self-interested. While I *may* care about them, rationality does not *require* me to weight their utility identically to my own in a decision problem. The "Fairness Gamble" exposes this: it is rational to want to avoid creating an unequal distribution of welfare among my own successors (Everett), but it is not rationally required to avoid a distribution where I win and a distinct person loses (Lewis/Classical). The Everettian branches are "me" in a way the Lewisian counterparts are not, because only the branches are bound to me by the physical chain of cause and effect that constitutes personal identity.

  ### Caveat on Assumptions

  This case leans heavily on the **No-Collapse** assumption. If wavefunction collapse is real (or if decoherence does not entail ontological branching), then the Everettian verdict collapses into the Collapse view: only one successor exists, and the "inequality" is illusory. Furthermore, the verdict depends on the agent accepting **Inequality Aversion among Selves** as a rational constraint. A strict hedonic utilitarian who cares only for the sum of utility would remain indifferent in all three cases, rendering the metaphysical distinction decision-theoretically inert. The case works only if one accepts that the *distribution* of welfare across one's own future stages is a rational concern distinct from the *sum* of welfare.
