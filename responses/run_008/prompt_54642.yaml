answer: |-
  Here is a proposal for a principle that organizes your verdicts, followed by the application to new cases and the necessary sacrifice.

  ### The Principle: Contextual Integrity and Labor-Desert

  Your intuitions are not a mess; they are tracking a hybrid of **Lockean labor-desert** (you own what you make) and **Practice-Based Norms** (you must follow the rules of the game you are playing). A single monolithic rule (like "ideas are free" or "labor creates property") fails because different social practices treat ideas differently.

  I propose the **Contextual Integrity and Labor-Desert Principle**. An agent wrongfully appropriates an idea if and only if:

  1.  **Labor Condition:** The originator invested significant creative labor or risk to generate the idea; **AND**
  2.  **Normative Access Condition:** The appropriator acquired the idea by bypassing the explicit or implicit normative conditions of access governing that specific practice (e.g., confidence, license, secrecy); **UNLESS**
  3.  **Functional Commons Exception:** The idea functions as essential infrastructure for a practice that relies on diffusion to flourish (e.g., truth, language, culinary culture), in which case exclusivity is waived, though **Attribution Norms** may still apply if the value lies in the specific feat of discovery rather than the utility of the result.

  #### Motivation for the Clauses

  *   **Clause 1 (Labor):** This captures the baseline intuition that effort creates a claim. It explains why the **Short Story** and **Business Idea** are protected (months of work/risk) but a casual remark might not be. It also explains why the **Math Proof** is praiseworthy despite being "already proved"—your labor was independent, creating a new claim to the *verification*, not the truth itself.
  *   **Clause 2 (Normative Access):** This resolves the **Font vs. Cocktail** tension. The font was released under a *paid license* (explicit norm of exclusion); the cocktail was posted publicly with no restriction (implicit norm of sharing). It also captures the **Magic Trick**: even if you analyzed it partly yourself, the practice of magic relies on a norm of secrecy; bypassing that norm to reveal the method violates the practice's integrity.
  *   **Clause 3 (Functional Commons):** This saves the **Slang Term** and **Math Proof**. Language and Truth are public goods; monopolizing them destroys their value. This clause also does the heavy lifting on the **Dress Silhouette**: fashion is a practice where trends (copying) drive the market, unlike typography where copying kills the incentive to design.
  *   **Attribution Norms (Sub-clause):** This distinguishes **Slang** from **Speedrunning**. Slang becomes infrastructure (no credit); a speedrun route remains a specific feat of labor (credit required). This explains why your speedrun verdict is about *credit*, not *use*.

  ---

  ### Predictions on New Cases

  Here is how the principle applies to the cases you haven't listed:

  **1. A chef's signature dish copied dish-for-dish by a rival restaurant.**
  *   **Verdict:** **Fine.**
  *   **Reasoning:** Meets Labor Condition (yes), but fails Normative Access (recipes are generally public upon service) and triggers **Functional Commons Exception**. Culinary culture relies on iteration and copying to evolve. While "sleazy," it is not wrongful appropriation under this principle.
  *   **Cost:** This aligns with your Dress verdict.

  **2. A professor's lecture notes passed around without permission among students at other universities.**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** Meets Labor Condition (yes). Meets Normative Access Condition (academic context implies the notes are for enrolled students to facilitate the specific course, not for external distribution which undermines the professor's ability to license or control their pedagogy). Does not trigger Functional Commons (education relies on structured access, not total diffusion).
  *   **Nuance:** If the notes were purely factual data, it might be Fine, but "lecture notes" imply expressive organization.

  **3. A hobbyist cartographer's freely published hiking maps bundled into a paid app.**
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** Meets Labor Condition (yes). While published freely, the **Normative Access** condition is violated by the *commercial bundling*. The hobbyist likely released them for community use (Commons), but the app developer is extracting value without contributing labor, violating the reciprocity norm of the hobbyist community. It fails the Functional Commons Exception because the *compilation* is being sold, not the facts of the terrain.
  *   **Note:** This is close to the Font case (labor extracted for profit against the creator's intent).

  **4. An illustrator whose distinctive style is used as the reference for a commercially sold image generator's outputs.**
  *   **Verdict:** **Fine (but Sleazy).**
  *   **Reasoning:** Meets Labor Condition (yes). However, **Style** falls under the **Functional Commons Exception**. Style is the "language" of visual art; allowing monopoly over style stifles artistic evolution (like the Dress or Slang).
  *   **Nuance:** If the AI is selling outputs *explicitly marketed* as "In the style of X" to undercut X, it may violate **Attribution Norms** or specific market norms, edging toward Wrong. But purely training on style is likely Fine under this principle, matching your Dress intuition.

  ---

  ### The Sacrifice: Which Verdict Must Go?

  You asked me to be honest about which of your verdicts this principle cannot save. I believe the **Font vs. Dress** pair is the unstable element, and to achieve reflective equilibrium, you should overturn your verdict on the **Dress**.

  **The Recommendation:** Change your verdict on the **Dress Silhouette** from **Fine** to **Wrong**.

  **The Argument:**
  Your principle (and current law) treats the Dress as a "Functional Commons" because the fashion industry *economically* relies on copying to drive trends. However, philosophically, this is a utilitarian policy exception, not a moral truth.
  *   **Labor:** The designer invested significant labor.
  *   **Access:** The runway is a display, not an invitation to copy (implicit norm).
  *   **Function:** A dress is not "infrastructure" like language or math; it is a product.

  If you accept the **Contextual Integrity and Labor-Desert Principle**, the Dress looks exactly like the Font. Both are functional aesthetics created through labor. The only reason you feel the Dress is "Fine" is because you are deferring to the *legal* doctrine of the "useful article," not the *moral* claim of the designer.

  **The Cost:**
  1.  **Legal/Moral Divergence:** You must accept that current IP law is *morally under-protective* of fashion designers. What is legal (copying the dress) is morally wrongful (appropriating labor).
  2.  **Economic Counter-Intuition:** You have to reject the economic argument that "copying helps fashion." You must assert that the designer's right to their labor outweighs the industry's benefit from trend cycles.
  3.  **Consistency Gain:** This aligns the Dress with the Font, the Short Story, and the Business Idea. It removes the "sleazy" feeling you admitted to having. It treats functional art consistently: if you sell it, you own the design, regardless of whether it covers a body or a page.

  **Why not overturn the Font?**
  You could argue fonts are tools of communication and should be free (like the Math Proof). But fonts are software/products, not truths. Overturning the Font verdict would undermine the software industry's moral claim to code. Overturning the Dress verdict only undermines a specific industry's lobbying exception. The moral cost is lower.

  **Why not overturn the Trick?**
  The Trick relies on **Secrecy** as a constitutive norm. Revealing it destroys the object itself (the illusion). Revealing a Dress design does not destroy the dress. The Trick verdict is robust.

  **Conclusion:**
  Your gut feeling that the dress copying is "slightly sleazy" is the moral signal. The law permits it for economic reasons, but in a seminar on *philosophy* of law, you should follow the moral principle: **Labor + Normative Expectation = Ownership.** Admit the dress copying is wrong, and your system becomes coherent.
