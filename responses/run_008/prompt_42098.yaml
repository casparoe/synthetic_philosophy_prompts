answer: |-
  This is one of the most productive frustrations a science writer can have, because you have identified the exact seam where pharmacology ends and political philosophy begins. The short answer to your core question is that the Controlled Substances Act (CSA) does not presuppose a theory of *harm* at all. It presupposes a theory of *legitimacy*.

  If you treat the CSA as a failed attempt at a harm-reduction ranking, it looks incoherent. If you treat it as a mechanism for assigning custodial authority over molecules, it is perfectly consistent.

  Here is a breakdown of the theoretical machinery underneath the scheduling system, where it breaks, and what a harm-based reconstruction would actually look like.

  ### 1. The Theory of Harm: Paternalistic Gatekeeping
  You asked if "danger" is treated as partly constituted by medical and legal recognition rather than intrinsic to the substance. **Yes, absolutely.**

  The CSA operates on a **Medicalist Theory of Harm**. In this framework, harm is not an intrinsic property of the molecule (like toxicity or addictiveness); harm is a function of *context*.
  *   **Context A (Medical):** A molecule is ingested under the supervision of a licensed gatekeeper (physician), for a specific indication, at a specific dose. In this context, the law presumes the risk is managed. Therefore, the "harm" is low.
  *   **Context B (Non-Medical):** The same molecule is ingested without gatekeeping. In this context, the risk is unmanaged. Therefore, the "harm" is high.

  This explains the Cocaine vs. Cannabis paradox. Cocaine is Schedule II not because it is safer than cannabis (pharmacologically, it is arguably more dangerous regarding cardiac events and addiction velocity), but because the American Medical Association and the FDA have granted it **ontological legitimacy**. It has a "use." Cannabis (until very recently in state law) did not.

  Under this theory, the molecule doesn't change, but its *moral status* does. The scheduling system is not ranking toxicity; it is ranking **deviance**. Schedule I is reserved for substances that are "deviant" (no medical use, high abuse potential). Schedule II is for substances that are "dangerous but useful" (high abuse potential, but sanctioned by the hierarchy).

  ### 2. The Alcohol and Tobacco Exception: The Prohibition Pragmatism
  Why are alcohol and tobacco excluded? This requires a different theoretical lens: **Feasibility Utilitarianism.**

  When the CSA was drafted in 1970, the drafters were acutely aware of the failure of the 18th Amendment (Alcohol Prohibition). The theory of harm here is not "how much damage does this drug do?" but "how much damage does *criminalizing* this drug do?"

  To justify leaving alcohol and tobacco out, the system relies on a **Cultural Entrenchment Clause** (implicit, not written). The logic is:
  1.  Harm = Intrinsic Damage + Social Cost of Enforcement.
  2.  For heroin, the Social Cost of Enforcement is acceptable relative to the Intrinsic Damage.
  3.  For alcohol, the Social Cost of Enforcement (organized crime, loss of tax revenue, cultural rebellion) outweighs the Intrinsic Damage.

  So, to answer your specific query: Yes, the practice requires a view that "harm only counts when it flows from abuse of a non-established substance." Or, more cynically, "harm is only actionable if the substance lacks a powerful lobbying constituency and cultural habituation."

  ### 3. Historical Accretion vs. Rational Design
  You asked if this is just historical accretion dressed up as a ranking. **It is overwhelmingly historical accretion.**

  The CSA is a fossil record of 20th-century anxieties.
  *   **Cocaine/Opiates:** Scheduled heavily in the early 1900s (Harrison Act) driven by racialized panic (cocaine among Black men in the South, opiates among Chinese immigrants).
  *   **Cannabis:** Scheduled via the Marihuana Tax Act (1937) driven by xenophobia (Mexican immigrants) and cultural policing (jazz culture).
  *   **MDMA:** Scheduled in the 80s during the "War on Drugs" moral panic, before clinical trials could establish "accepted medical use."

  The "Accepted Medical Use" criterion is the primary vehicle for this accretion. Because "accepted" is a sociological status (FDA approval, compendia listing) rather than a pharmacological one, it allows political decisions to harden into scientific "fact." Once a drug is Schedule I, research is restricted, which prevents the generation of data needed to prove medical use, which keeps it in Schedule I. It is a feedback loop of ignorance.

  ### 4. Rebuilding Around a Harm Function
  If we rebuilt scheduling around an actual harm function (like David Nutt's *Lancet* MCDA model), the system would not just change; **the binary of Legal/Illegal would collapse.**

  Nutt's work measures:
  *   **Physical Harm:** Mortality, disease, loss of function.
  *   **Dependence:** Withdrawal, reinforcement.
  *   **Social Harm:** Crime, economic cost, family adversity, environmental damage.

  **What would change?**
  1.  **Alcohol would be the benchmark.** It would likely be the most strictly controlled substance due to its combination of toxicity, addiction, and massive social externalities (violence, accidents).
  2.  **Schedules would become Regulations, not Prohibitions.** A harm-based system recognizes that prohibition often increases harm (black markets, unknown potency, incarceration).
      *   *High Harm (Alcohol/Heroin):* Strict state monopoly, high taxation, mandatory purity testing, prescription models (heroin-assisted treatment).
      *   *Medium Harm (Cocaine/Meth):* Regulated access, strict dosage limits, heavy taxation.
      *   *Low Harm (Cannabis/Psilocybin/LSD):* Age restrictions, taxation similar to alcohol, decriminalization.
  3.  **The "Medical Use" Distinction Vanishes.** In a harm model, it doesn't matter if a doctor prescribes it. It matters if the *pattern of use* causes net negative utility. If alcohol causes more harm than LSD, it is regulated more strictly, regardless of whether it has "therapeutic value."

  **Would the system collapse?**
  The current *legal* framework would collapse, because the CSA is built on the premise that Schedule I substances cannot be possessed. A harm-based model is built on the premise that *all* substances can be possessed, but with varying degrees of friction (tax, age, prescription). You would move from a **Criminal Law** model to a **Public Health/Consumer Safety** model.

  ### 5. Where is the Practice Underdetermined?
  This is the crux for your writing. Where does science end and values begin?

  **Determined (Objective/Pharmacological):**
  *   **LD50:** The lethal dose.
  *   **Receptor Binding:** What proteins the molecule interacts with.
  *   **Half-life:** How long it stays in the body.
  *   **Withdrawal Severity:** Physiological markers of dependence.
  *   *Note:* Even these can be interpreted differently, but the raw data is theory-neutral.

  **Underdetermined (Subjective/Political):**
  *   **"Potential for Abuse":** This is the biggest black box. Does "potential" mean "how likely is the average person to become addicted?" or "how intense is the reinforcement?" Heroin has high reinforcement but low population penetration. Alcohol has moderate reinforcement but massive penetration. The CSA treats Heroin as worse. A harm model might treat Alcohol as worse. This is a value judgment on *individual* vs. *population* risk.
  *   **"Accepted Medical Use":** As discussed, this is purely sociological. It depends on who funds the trials and who sits on the FDA panel.
  *   **"Safety under Medical Supervision":** This assumes medical supervision *makes* it safe. But if a drug has a narrow therapeutic index (like methadone or cocaine), medical supervision mitigates but does not eliminate risk. The law treats "medical use" as a magic shield that lowers the danger rating, which is a philosophical claim, not a medical one.
  *   **The Weighting of Social Harm:** Is crime caused by the drug (pharmacological violence) or crime caused by the prohibition of the drug (black market violence)? The CSA counts the former heavily; it ignores the latter. A harm theory must decide how to weigh state-inflicted harm (incarceration) vs. drug-inflicted harm (overdose).

  ### Summary for your piece
  The scheduling system is not a scientific ranking. It is a **boundary-maintenance tool** for the medical-legal complex.

  It presupposes that harm is generated by *unauthorized access*, not by chemistry. It treats the physician's prescription pad as a harm-reduction device that magically alters the risk profile of a molecule. Alcohol and tobacco are excluded not because they are safe, but because they are **grandfathered privileges**, acknowledging that the state's power to prohibit has limits when faced with deep cultural habituation.

  If you rebuilt it on harm, you would stop asking "Is this drug evil?" and start asking "What is the cost of this drug to the user and the bystander, and what regulatory friction minimizes that cost?" That shift would likely leave alcohol at the top of the "danger" list, but regulated rather than banned, while moving cannabis and psychedelics to the bottom, regulated like caffeine or alcohol. The "Schedules" would disappear, replaced by a continuum of **Risk-Adjusted Access**.

  The incoherence you feel isn't a bug in your understanding; it's the sound of a 1970s moral framework grinding against 21st-century data.
