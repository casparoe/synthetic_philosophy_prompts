      *   *Section 4: Historical Accretion.* It's a fossil record of 20th-century anxieties.
      *   *Section 5: Rebuilding on Harm.* Nutt's model. Shift from "Scheduling" to "Regulation."
      *   *Section 6: Underdetermination.* Distinguish pharmacological facts from sociological values.
