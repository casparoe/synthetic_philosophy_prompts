prompt: |-
  bioethics question, need help auditing an analogy before i write my response paper. we're doing the therapy/enhancement distinction in human enhancement, and my professor loves this move: sport, he says, already solved the problem medicine supposedly can't. anti-doping rules draw exactly the line we're told is unprincipled — an asthmatic gets a therapeutic use exemption for their inhaler, but nobody gets EPO to push their hematocrit above normal, even tho both are just altering blood chemistry. restoring normal function is permitted, exceeding it is banned. and it's not just a rule of thumb, it's codified, with hearings and tribunals and case law. so his conclusion: the therapy/enhancement line is principled and workable, and doctors and regulators who refuse to provide or pay for enhancements on that basis are on solid ground. the classmate who's supposed to rebut this just said "but sport is artificial" and got shot down, so i need something better.

  could you take the role of a philosopher of medicine who's also deep in the sports ethics literature, and think carefully about this — maybe brainstorm the mapping before committing to it. what i want out:

  1. the full mapping — what in the sport case plays the role of disease, of therapy, of enhancement, of the doctor, of the regulator. be explicit about correspondences that are awkward even before we get to the arguments.

  2. the disanalogies, sorted into the ones that actually matter for his conclusion and the ones that don't. my hunch is that the zero-sum contest thing is load bearing: sport bans doping partly to protect the meaning of the contest, and medicine isn't a game with constitutive rules, there's no spectator, no league table of health. but i want to know if that's really the crucial point or if there's something subtler, like the difference between a baseline that's a measurable performance threshold and a baseline that's species-typical functioning contested by disability scholars.

  3. what the analogy smuggles in. it seems to quietly treat all enhancement as positional — as if people who want better memory or a longer healthspan are necessarily competing against other people, when maybe they're just... trying to be better off. does the fairness rationale that carries the sport rule even apply outside a contest?

  4. whether his conclusion survives once the disanalogies are on the table, or whether the analogy was doing all the argumentative work. and i'm curious whether the sport case actually cuts against him in places — e.g. i've read that athletes on legitimate exemptions can end up with better-than-healthy markers, which seems to break the "restoring normal" reading from the inside. if you know of other ways the sport line frays (things like caffeine being allowed up to a threshold, out-of-competition vs in-competition rules, etc.) fold those in.

  5. if there's a better analogy for the therapy/enhancement distinction than "medicine is like anti-doping," what is it, and what does it get right that his doesn't.

  no citations or bibliography needed, just the reasoning — i'll deal with sources myself. plz don't pad it, i'd rather have a tight audit than a survey. also if you think my hunch in (2) is wrong, say so directly, don't just politely agree with me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Bioethics, specifically the therapy/enhancement distinction in human enhancement.
      *   **Context:** A student needs to audit an analogy used by their professor (Sport/Anti-Doping $\rightarrow$ Medicine) before writing a response paper.
      *   **Professor's Argument:** Sport has successfully drawn the therapy/enhancement line (TUEs allowed, EPO banned). Therefore, the line is principled and workable in medicine.
      *   **Classmate's Failed Rebuttal:** "Sport is artificial" (too vague, easily dismissed).
      *   **Desired Role:** Philosopher of medicine + Sports Ethics expert.
      *   **Required Output:**
          1.  Full Mapping (Sport $\leftrightarrow$ Medicine).
          2.  Disanalogies (Sorted by relevance to the conclusion).
          3.  Hidden Assumptions (What the analogy smuggles in).
          4.  Evaluation of Conclusion (Does it survive? Does sport actually undermine the professor?).
          5.  Better Analogy (If available).
      *   **Constraints:** No citations/bibliography, tight reasoning, no padding, direct critique (don't just agree with the user's hunch if it's weak).

  2.  **Deconstruct the Professor's Analogy (Sport $\rightarrow$ Medicine):**
      *   *Claim:* The World Anti-Doping Agency (WADA) model proves the Therapy/Enhancement (T/E) distinction is robust.
      *   *Mechanism:* Therapeutic Use Exemptions (TUEs) allow restoring function; Performance Enhancing Drugs (PEDs) ban exceeding function.
      *   *Conclusion:* Doctors/Regulators can legitimately deny enhancements based on this distinction.

  3.  **Drafting Section 1: The Mapping:**
      *   Need to align the entities.
      *   *Disease/Pathology:* Injury, illness, or physiological deficit limiting sport performance.
      *   *Therapy:* TUE-approved medication (e.g., insulin for diabetic athlete, inhaler for asthmatic).
      *   *Enhancement:* Banned substances/methods (EPO, steroids) intended to boost beyond baseline.
      *   *Doctor:* Team physician or treating MD who applies for the TUE.
      *   *Regulator:* WADA / International Federations (not the state, not insurance).
      *   *Goal:* Fair competition / Integrity of sport.
      *   *Awkward Fits:* In medicine, the "regulator" is often insurance or the state, but the "goal" is health/well-being, not fairness against peers. The "patient" isn't a "competitor" in the same sense.

  4.  **Drafting Section 2: Disanalogies (The Core Critique):**
      *   *User's Hunch:* Zero-sum contest vs. non-zero-sum health.
      *   *Assessment:* The hunch is *correct* but needs nuance. It's not just "zero-sum," it's about *constitutive rules*.
      *   *Crucial Disanalogy 1: The Purpose of the Baseline.* In sport, "normal" is often irrelevant; "fair" is key. Sometimes therapy *creates* an advantage (e.g., ADHD meds in focus sports). In medicine, "normal" is species-typical functioning (Daniels/Boorse).
      *   *Crucial Disanalogy 2: The Stakeholders.* Sport bans are about protecting *other* athletes (fairness). Medicine denies enhancements usually based on *safety* or *resource allocation*, not because my better memory hurts your memory.
      *   *Crucial Disanalogy 3: Enforcement.* WADA punishes cheating. Medicine denies coverage based on medical necessity.
      *   *Non-Crucial Disanalogy:* "Artificiality." Sport is a practice, medicine is a practice. Both are social constructs. This doesn't matter.
      *   *Subtler Point:* The "Normal" Baseline. In sport, the baseline is often the *unenhanced* human, but TUEs can push people *above* the average (e.g., a diabetic on insulin might have more stable glucose than a non-diabetic). This undermines the "restoring normal" claim.

  5.  **Drafting Section 3: What the Analogy Smuggles In:**
      *   *Positionality:* It assumes all enhancement is positional (I win, you lose). Most medical enhancement desires (longevity, mood, cognition) are non-positional goods.
      *   *Cheating Frame:* It frames enhancement seekers as "dopers" (rule-breakers) rather than consumers/patients seeking well-being.
      *   *Authority:* It assumes a central authority (WADA) has the legitimacy to define human limits, which doesn't exist in liberal medicine.

  6.  **Drafting Section 4: Does the Conclusion Survive? (The "Turn"):**
      *   *Verdict:* No, the analogy collapses under scrutiny.
      *   *Why?* The sport line isn't drawn at "therapy vs. enhancement." It's drawn at "fair vs. unfair."
      *   *Internal Fraying:*
          *   TUEs *can* provide net advantage (e.g., corticosteroids for inflammation might aid recovery beyond baseline).
          *   Thresholds exist (e.g., Testosterone T/E ratio, Caffeine limits). This admits that *some* enhancement is okay until a specific arbitrary line.
          *   "Normal" is hard to define in sport (is a high hematocrit natural or EPO?).
      *   *Impact on Professor:* If sport bans enhancement to protect *fairness*, and medicine has no fairness constraint (mostly), then the sport rationale doesn't apply to medicine. If sport allows TUEs that confer advantage, then the "restoring normal" principle is false even in sport.

  7.  **Drafting Section 5: A Better Analogy:**
      *   *Idea:* Education / Accommodations.
      *   *Mapping:* Learning disability = Disease. Extra time on tests = Therapy/TUE. Tutoring/Enrichment = Enhancement.
      *   *Why better?* It deals with functioning in a social context without zero-sum competition (usually). It highlights the "leveling up" vs. "leveling the playing field" distinction.
      *   *Alternative:* Cosmetic Surgery vs. Reconstructive Surgery. (Classic, but maybe too close to the original problem).
      *   *Selection:* Education/Accommodations is stronger because it deals with *function* and *opportunity* rather than just aesthetics or winning a race.

  8.  **Review and Refine:**
      *   *Tone Check:* Needs to be philosophical, rigorous, not padded.
      *   *User's Hunch:* Validate it but deepen it. It's not just "zero-sum," it's about the *telos* of the practice.
      *   *Specific Sport Details:* Mention the "spirit of sport," the TUE advantage loophole, and the arbitrary thresholds (testosterone ratios).
      *   *Constraint Check:* No citations. Tight audit.

  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just say "sport is different." I need to explain *why* that difference invalidates the *normative force* of the analogy.
      *   *Emphasis:* Highlight that WADA's goal is *fairness*, Medicine's goal is *health*. You can't import fairness rules into health contexts without arguing health is a competition.
      *   *Refining the "Normal" point:* In sport, "normal" is often the *average of competitors*, not species-typical. In medicine, it's species-typical. This is a major disanalogy.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the audit of the analogy, structured as requested.

  ### 1. The Mapping

  To evaluate the analogy, we must align the terms explicitly. The professor argues that the **World Anti-Doping Agency (WADA)** framework maps onto **Clinical Practice/Insurance Policy**.

  | **Sport / Anti-Doping Domain** | **Medicine / Bioethics Domain** | **Awkward Fits / Tensions** |
  | :--- | :--- | :--- |
  | **Pathology/Deficit** | Injury, illness, or physiological limitation hindering performance. | Disease/Disability (species-typical dysfunction). | In sport, a "deficit" is only relevant if it hinders *competition*. In medicine, it hinders *life*. |
  | **Therapy** | Therapeutic Use Exemption (TUE). Medication allowed to treat a condition. | Medical Treatment. Restoring species-typical functioning. | TUEs are permissions, not rights. Medical treatment is often framed as a right or necessity. |
  | **Enhancement** | Banned Substance/Method (PEDs). Artificially boosting performance beyond baseline. | Enhancement (cosmetic, cognitive, longevity). Exceeding species-typical functioning. | In sport, enhancement is *cheating*. In medicine, it's often *consumer choice* or *self-optimization*. |
  | **The Doctor** | Team Physician / Treating MD. Advocates for the athlete, files TUE paperwork. | Clinician. Advocates for patient health, writes prescriptions. | The team doctor has dual loyalty (athlete vs. team integrity). The clinician has fiduciary duty to the patient. |
  | **The Regulator** | WADA / International Federations. Enforces rules, adjudicates violations. | Insurance Companies / State / Medical Boards. Decide coverage/licensing. | WADA enforces for *fairness*. Insurance enforces for *cost/necessity*. |
  | **The Goal** | Fair Competition / Integrity of the Contest. | Health / Well-being / Autonomy. | **Critical Mismatch.** Sport is zero-sum; medicine is (ideally) non-zero-sum. |
  | **The Baseline** | The "Natural" Athlete (unenhanced). | Species-Typical Functioning (Boorse/Daniels). | Sport baselines are often statistical averages of competitors, not biological norms. |

  ### 2. The Disanalogies

  Your hunch about the zero-sum contest is load-bearing, but it's not the only structural failure. I have sorted these by whether they actually damage the professor's conclusion.

  **A. Non-Crucial Disanalogies (Don't save the argument)**
  *   **"Sport is artificial":** Your classmate was right to be shot down here. Medicine is also a social practice with constructed norms. The fact that sport is a "game" doesn't invalidate its rules *within the game*. This is too superficial.
  *   **Spectators/Money:** The commercial aspect of pro sport doesn't change the ethical logic of the T/E line. Amateur sport has the same rules.

  **B. Crucial Disanalogies (Destroy the argument)**
  *   **The *Telos* of the Regulation (Fairness vs. Health):** This is the killer. WADA bans EPO not because it is "unnatural" or "unsafe" (though safety is cited), but primarily because it creates an *unfair advantage*. If everyone took EPO safely, WADA would likely still ban it because it corrupts the test of natural talent.
      *   *Impact:* In medicine, if everyone took a safe memory enhancer, there is no "unfairness" unless you view life as a competition. The professor imports a **fairness constraint** into a **well-being context**. Denying a patient enhancement because "others don't have it" is a distributive justice argument, not a therapy/enhancement argument.
  *   **The Definition of "Normal":** In sport, the baseline is often the *unenhanced competitor*. In medicine, the baseline is *species-typical functioning*.
      *   *Impact:* Sport TUEs often restore a player to *competitive parity*, which may be significantly *above* species-typical functioning (e.g., an elite athlete with asthma treated to breathe like an elite athlete, not a normal person). Medicine aims for the statistical norm of the species. The targets are different.
  *   **The Consequence of Violation:** In sport, crossing the line makes you a **cheater** (moral failing + sanction). In medicine, crossing the line makes you a **consumer** (market transaction) or creates a **coverage dispute** (economic issue).
      *   *Impact:* The professor wants the moral stigma of "doping" to attach to "enhancement." But without a constitutive rule agreement (like signing a sports contract), the "cheating" label doesn't stick in clinical care.

  ### 3. What the Analogy Smuggles In

  The analogy is not neutral; it performs rhetorical work by hiding assumptions.

  *   **Positionality:** It assumes all enhancement is a **positional good** (my gain is your loss). This is true in sport (I win, you lose). It is false in medicine (my better memory does not inherently reduce your memory). By using the sport analogy, the professor frames enhancement seekers as people trying to "win" against their peers, rather than people trying to improve their own absolute welfare.
  *   **The "Cheating" Frame:** It smuggles in the idea that seeking enhancement is a violation of a social contract. Athletes agree to anti-doping rules to compete. Patients do not sign a contract agreeing to remain "species-typical" when they enter a clinic.
  *   **Paternalistic Authority:** It assumes a central body (like WADA) has the epistemic and moral authority to define the "limits of man." In liberal medicine, authority is distributed between patient autonomy and clinical judgment, not a central tribunal.

  ### 4. Does the Conclusion Survive?

  **Verdict:** No. The analogy does not support the professor's conclusion; in fact, a closer look at sport ethics undermines it.

  **Why the Sport Case Cuts Against Him:**
  1.  **TUEs Can Be Enhancements:** In sport, a TUE does not guarantee a return to "normal." It guarantees the ability to compete.
      *   *Example:* An athlete with ADHD granted a TUE for stimulants may end up with *better* focus than a neurotypical competitor. WADA accepts this because the alternative (no meds) excludes the athlete.
      *   *Implication:* Sport already admits that "therapy" can result in "super-normal" function if it's required for participation. If sport allows this, why can't medicine allow cognitive enhancers for a student who needs them to compete academically? The line is already porous.
  2.  **Thresholds, Not Binaries:** Sport often uses thresholds, not hard bans on "enhancement."
      *   *Example:* Testosterone ratios (T/E ratio) or hemoglobin levels. You are allowed to be high, just not *too* high. Caffeine was banned only above a certain urinary concentration.
      *   *Implication:* This admits that "enhancement" is a matter of degree, not kind. It undermines the professor's claim that there is a principled *line* between therapy and enhancement. It suggests regulation is about managing *excess*, not prohibiting *improvement*.
  3.  **The "Spirit of Sport" is Vague:** WADA explicitly bans substances that violate the "spirit of sport." This is widely criticized in sports ethics as being essentially arbitrary or culturally contingent.
      *   *Implication:* If the sport line is based on a vague "spirit," it is not the robust, principled boundary the professor claims it is. It is a negotiated consensus, not a moral truth.

  **The Zero-Sum Point:** Your hunch is correct. The sport rule works *only* because sport is a zero-sum contest with constitutive rules. Medicine is not. You cannot ban "winning" in health because health is not a game. Therefore, the rationale for the ban (fairness) evaporates when applied to medicine.

  ### 5. A Better Analogy

  If "Sport" fails because it is zero-sum and rule-constituted, you need an analogy that deals with **functioning within a social context** without inherent competition.

  **The Better Analogy: Education and Accommodations.**

  *   **Mapping:**
      *   **Disease:** Learning disability (e.g., dyslexia).
      *   **Therapy:** Accommodations (extra time on tests, text-to-speech software).
      *   **Enhancement:** Private tutoring, enrichment camps, "brain training" apps for non-disabled students.
      *   **Regulator:** School Board / State Education Dept.
      *   **Goal:** Equal opportunity / Mastery of material (not beating other students).

  *   **Why it works better:**
      1.  **Non-Zero-Sum:** One student getting extra time doesn't inherently make another student fail (ideally). This matches medicine better than sport.
      2.  **The Line is Still Hard:** Schools rigorously distinguish between *accommodations* (leveling the playing field) and *advantages* (tilting the field). This preserves the T/E distinction the professor likes.
      3.  **The Friction is Exposed:** In education, we argue constantly about whether a specific tool is an accommodation or an advantage (e.g., is a calculator an accommodation for dyscalculia or an unfair advantage in math class?). This mirrors the bioethics debate perfectly.
      4.  **No "Cheating" Stigma:** A student getting tutoring isn't a "cheater," they are just privileged. This maps better to the economic reality of medical enhancement (available to those who can pay) rather than the moral reality of doping (forbidden to all).

  **Conclusion for your paper:**
  Use the sport analogy to show *why* the distinction works in a specific, rule-bound context (fairness in competition), and then argue that because medicine lacks those specific constraints (no constitutive rules, no zero-sum outcome), the sport justification cannot transfer. The "line" in sport is policed to protect the *game*, not the *player*. Medicine exists to protect the *player*. Therefore, the sport model is category error.
