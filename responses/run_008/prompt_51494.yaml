  1. Did the system generate the output through its intended computational pathway rather than through hardware failure or unhandled exception? Engineering log confirmation counts as a sufficient answer, and a "No" terminates the procedure by attributing the incident to hardware failure without system content.
  2. Is there a documented design specification or training objective that explicitly defines the semantic category the system was built to detect? A reference to version-controlled specs counts as a sufficient answer, and a "No" terminates the procedure by classifying the incident as undefined behavior without specific content.
  3. When the input physically supports two candidate contents, does the design history designate one as the intended target over the other? A design doc citation counts as a sufficient answer, and a "No" terminates the procedure by marking content as indeterminate.
  4. Can the discrepancy between the attributed content and the desired outcome be corrected by retraining the model without altering the system's operational specifications? A technical assessment from the model owner counts as a sufficient answer, and a "Yes" terminates the procedure by assigning the fix to model retraining.
  5. Does resolving this incident require changing the system's defined role, acceptable error rates, or operational environment rather than its technical implementation? An impact assessment on product requirements counts as a sufficient answer, and any answer terminates the procedure, with "Yes" handing the call to policy and "No" classifying it as an upstream data problem.
