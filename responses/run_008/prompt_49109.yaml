  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Consultant Bioethicist]
  **DATE:** October 24, 2023
  **RE:** Case D – Validity of Psychiatric Advance Directive During Acute Psychosis

  **Purpose**
  This memo addresses the conflict between Patient D.'s current refusal of treatment and his Psychiatric Advance Directive (PAD) signed eighteen months ago during stability. The core ethical tension is not merely about capacity, but about *temporal autonomy*: does the competent "past self" have the authority to bind the incapacitated "present self"?

  **The Constitutional Analogy**
  The Committee is rightly divided on the political theory underlying PADs. The Chair's view invokes the "Ulysses contract": D.-stable is the constituent power, binding D.-psychotic to prevent harm during irrationality. The opposing view argues that unlike a Constitution, a PAD lacks an amendment clause; D.-psychotic has no procedural recourse to override his prior will, rendering the analogy coercive rather than protective.

  Both sides capture part of the truth. However, the strongest version of the opposing argument—that overriding current refusal disrespects the person in the bed—relies on the assumption that D.-psychotic is capable of exercising autonomy comparable to D.-stable. In psychiatric crises, the "current will" is often a symptom of the illness the PAD was designed to mitigate. If we prioritize the transient psychotic self over the stable self, we effectively deny patients the right to plan for their illness, undermining the very purpose of advance care planning. The "amendment clause" critique holds only if the current self possesses capacity to amend. When psychosis precludes capacity, the prior constitution must stand, provided it was validly ratified.

  **Assumptions and Validity**
  I proceed under a critical clinical assumption: D.'s claim that the PAD is a "forgery" is delusional content consistent with his current psychosis, rather than evidence of actual fraud. There is no external evidence of coercion provided by the ex-partner, only philosophical objection. If there were credible evidence of fraud or incapacity at the time of signing, the "ratification" would be void, and the PAD invalid. Barring such evidence, the directive remains presumptively valid.

  **Recommendation**
  I recommend the Committee authorize treatment consistent with the PAD, with a specific limitation regarding ECT.

  1.  **Medication:** Administer Olanzapine as pre-consented. Strictly avoid Haloperidol per the refusal clause. This honors D.'s stable judgment regarding side effects (akathisia) while addressing the acute episode.
  2.  **ECT:** Do not proceed to ECT immediately. The PAD authorizes ECT "if meds fail," but D.'s current refusal offers a window to reassess. Initiate Olanzapine treatment for a period of **72 hours**. If D.'s psychosis remits sufficiently to restore decision-making capacity, seek contemporaneous consent for ECT. If capacity does not return and clinical indicators show medication failure, then honor the PAD's ECT provision.
  3.  **Rationale:** This approach respects the Ulysses contract regarding medication (where the stable self's preference is clear and specific) but creates a minimal "amendment window" for high-invasiveness procedures like ECT. It acknowledges the dissenting Committee member's concern by ensuring we do not bypass a potentially recovered capacity before proceeding to the most intrusive intervention.

  **Policy Implications**
  Our policy states PADs are "presumptively valid" but fails to define what defeats that presumption. This ambiguity invites exactly the conflict we face today. Going forward, policy should specify that the presumption is defeated only by: (1) credible evidence of coercion or incapacity *at the time of signing*; or (2) clear evidence that the patient's values have fundamentally changed *during a period of capacity* prior to the current crisis. Mere refusal during incapacity cannot void a PAD, or the document becomes meaningless. We must codify that the "constitution" holds unless the "people" (the patient) amend it while sober, not while intoxicated by psychosis.

  **Conclusion**
  Honoring D.'s PAD is not silencing him; it is listening to the version of him capable of listening. We should enforce the medication clauses immediately and reassess capacity for ECT in three days.

