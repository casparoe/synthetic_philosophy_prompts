prompt: |-
  here's my metaphysical profile for our work-in-progress group, and before I send it out I want a sanity check on whether it actually coheres. Roughly where I stand: (1) the fundamental facts are all microphysical, and everything else that's true is true in virtue of those, with nothing below them; (2) no brute truths above the fundamental level — every non-fundamental truth is grounded, no circles and no infinite decent, chains terminate at the base; (3) grounding is hyperintensional, so necessarily equivalent facts needn't share grounds; (4) I'm a priority monist about concrete objects, so facts about parts hold because of facts about the whole; (5) there are also facts *about* grounding — e.g. it's a fact that facts about tables are grounded in microphysical facts — and those look like truths like any other; (6) just about any macroscopic truth has the total microphysical state as a full ground. Do these hang together? Go through the pairs: which are genuinely in tension, which only look that way, rank the real ones by severity, and for each say what the cheapest fix is and what it costs me. I honestly can't tell where the problem is, so don't take it easy on any of them.
reasoning: |-
