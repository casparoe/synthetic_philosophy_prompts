      *Refining (5):* Grounding facts. If (1) says *all* fundamental facts are microphysical, then grounding facts must be either microphysical or derivative. If derivative, what grounds them? If microphysical, that's weird (is "grounding" a microphysical property?).
      *Correction:* Most ground theorists take grounding facts to be fundamental structural facts. This directly contradicts (1).

      *Refining (6):* "Just about any macroscopic truth has the total microphysical state as a full ground." This is "Global Grounding." Combined with (3) Hyperintensionality: If $P$ and $Q$ are distinct macro truths, and both are fully grounded in Total State $T$, do they share the same ground? Yes. Does (3) forbid this? (3) says "necessarily equivalent facts needn't share grounds." It doesn't say "distinct facts *must* have distinct grounds." However, if $T$ necessitates everything, then everything is necessarily equivalent relative to the base. Hyperintensionality is usually motivated to distinguish $P$ and $Q$ even if they are co-extensive. If the ground is always $T$, the grounding relation loses its ability to discriminate structure. It makes grounding trivial.

  7.  **Finalizing the Plan:**
      *   **Severity 1 (Fatal):** (1) vs (4). Micro-fundamentalism vs. Monism.
      *   **Severity 2 (Serious):** (1) vs (5). Micro-fundamentalism vs. Existence of Grounding Facts.
      *   **Severity 3 (Structural):** (2) vs (5). Well-foundedness vs. Grounding Facts (Regress).
