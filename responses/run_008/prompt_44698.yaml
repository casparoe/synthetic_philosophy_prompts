      *Final check on (3):* Hyperintensionality. If (6) says *everything* is grounded in the *Total State*, then the ground is invariant. Hyperintensionality allows distinct grounds for equivalent facts. It doesn't *require* distinct grounds for distinct facts. But it makes (6) look very coarse-grained. I'll mark this as a theoretical cost rather than a contradiction.

