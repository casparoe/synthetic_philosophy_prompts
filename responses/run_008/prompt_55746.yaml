answer: |-
  This is a precise description of a well-studied structural failure in social epistemology. You have correctly identified that the phenomenon is not a psychological weakness (like "groupthink") but a mathematical inevitability arising from how rational agents process public and private information in sequence.

  Here is the carving you requested. I will lay out the candidate concepts, argue for the precise fit, and then draw the boundaries around the specific features you highlighted, including the distinction between belief and reputation.

  ### 1. Candidate Concepts

  In formalizing your intuition, three concepts compete for the label. I evaluated them against your three core features: (1) local rationality/global error, (2) structural/observational basis, and (3) fragility/reversal.

  *   **Candidate A: Psychological Herding (Bandwagon Effect)**
      *   *Definition:* Individuals conform due to social pressure, desire for affiliation, or cognitive laziness.
      *   *Verdict:* **Reject.** As you noted, this implies a failure of individual rationality ("caving under pressure"). In your examples, every agent is doing the math correctly given their limited view. This concept cannot explain the "mistake with no author."
  *   **Candidate B: Pluralistic Ignorance**
      *   *Definition:* A situation where a majority of group members privately reject a norm, but incorrectly assume that most others accept it, and therefore go along with it.
      *   *Verdict:* **Reject.** This requires private disagreement. In your restaurant and tool-adoption examples, the agents *actually believe* the crowd is right. They are not hiding their true views; their true views have been updated to match the crowd.
  *   **Candidate C: Information Cascade**
      *   *Definition:* A process where individuals, acting sequentially, observe the actions of those before them and rationally choose to ignore their own private information to follow the public history.
      *   *Verdict:* **Accept.** This fits all three features. It is locally rational (Bayesian updating), structurally determined (who sees whom), and famously fragile (small shocks break the lock-in).

  ### 2. The Best Fit: Information Cascade

  The phenomenon you are describing is the **Information Cascade**.

  This concept was formalized in economics and game theory (notably by Bikhchandani, Hirshleifer, and Welch, 1992; and Banerjee, 1992). It models exactly the restaurant queue scenario: agents act in sequence; each has a private signal (e.g., "I looked at the menu") and observes public actions (e.g., "There is a line").

  **Why this fits your "Mistake with No Author":**
  In a cascade, once the public history becomes strong enough, it becomes *mathematically rational* for the next agent to ignore their private signal. If ten people are in line, your single private observation that "the other place looks okay" is statistically outweighed by the implied information of the ten people ahead of you. You are not caving; you are updating. Yet, if those ten people were *also* ignoring their private signals and just following the first two, the system has locked into a decision based on very little actual data. The error is systemic, not individual.

  **Why this fits your "Correlated Evidence" observation:**
  You noted that "a single piece of information... gets counted once per hand it passes through." In the strict rational model, agents *should* realize that predecessors might be cascading and discount their actions. However, in real-world applications (and bounded rationality models), agents often suffer from **Correlation Neglect**. They treat the actions of others as independent signals rather than dependent echoes. This effectively creates **Serial Evidence Inflation**: the evidentiary weight compounds linearly while the underlying information remains static.

  ### 3. Drawing the Boundaries (Answering Your Questions)

  Here is the precise accounting of the phenomenon's edges, addressing your four specific queries.

  #### Q1: Does the core configuration have an established name?
  **Yes: Information Cascade.**
  This is the standard term in formal epistemology and information economics. It captures the "locally rational, collectively bad" dynamic. It distinguishes the phenomenon from "irrational herding" by emphasizing that the agents are maximizing expected utility given their information set. The "mistake with no author" is a feature of the equilibrium, not a bug in the agents.

  #### Q2: Is there a name for the version produced by arrangement rather than psychology?
  **Yes: Structural vs. Behavioral.**
  The field marks this distinction by contrasting **Informational Cascades** (structural/epistemic) with **Psychological Herding** (behavioral).
  *   **Informational:** Driven by the *topology of observation*. If you cannot see the kitchen, only the queue, the structure forces the cascade.
  *   **Behavioral:** Driven by *utility functions* (e.g., pain of standing out).
  Your intuition is correct: the arrangement of who can observe whom is the causal engine. In the literature, this is often modeled as a **Sequential Decision Problem** with **Observational Learning**. The critical boundary is that if you changed the structure (e.g., everyone had to vote simultaneously rather than sequentially), the cascade would not form.

  #### Q3: Does the reversal part have its own name?
  **Yes: Cascade Fragility.**
  This is not a footnote; it is a central theorem of cascade models. Because a cascade is maintained by the *absence* of contrary public signals (everyone is ignoring their private info, so no new info enters the public pool), the public belief is actually quite shallow. It looks deep because of the long queue, but it is supported by only the first few independent signals.
  Therefore, a single credible contrarian signal (the "respected figure visibly defies the crowd") releases a flood of pent-up private information from everyone who was privately doubting but publicly conforming. The reversal is instant because the "confidence" was never actually accumulated; it was merely simulated by silence.

  #### Q4: The Reputation Question (and a Coinage)
  You ask: *Does it still count when people go along to be safe — reputationally — rather than because they have inferred anything?*

  **No. That is a different animal.**
  I agree with your suspicion. When an agent follows the crowd *despite* believing the crowd is wrong, simply to protect their reputation or career, the literature calls this **Reputational Herding** (or **Career Concerns Herding**, modeled by Scharfstein and Stein, 1990).

  *   **Information Cascade:** "I follow the crowd because I believe they know something I don't." (Epistemic)
  *   **Reputational Herding:** "I follow the crowd because I don't want to be the only one wrong." (Strategic/Incentive)

  **The Coinage: Epistemic Inflation**
  While "Information Cascade" names the *process*, there is no single standard term for the specific *state of belief* you described in your third feature: "confidence appears to be conserved while direction flips... the underlying evidence stays the same size."
  To carve this out precisely, I propose the term **Epistemic Inflation**.

  *   **Definition:** A state in a collective belief system where the *expressed confidence* in a proposition increases over time without a corresponding increase in *independent evidentiary support*.
  *   **Mechanism:** It occurs when dependent signals (echoes) are processed as independent signals (data).
  *   **Boundary Case 1 (Counts):** Your restaurant queue. The 50th person in line adds to the *appearance* of evidence (confidence) but adds zero *independent* data (inflation).
  *   **Boundary Case 2 (Does Not Count):** A scientific consensus reached after 50 independent labs replicate a result. Here, confidence rises *with* evidence. This is valid accumulation, not inflation.
  *   **Boundary Case 3 (The Reputation Edge):** If a team adopts a tool because they fear being fired for not using the industry standard, this is **Reputational Herding**, not Epistemic Inflation. In Reputational Herding, the agents do not necessarily *believe* the tool is good; they only *act* as if they do. In Epistemic Inflation (within a Cascade), the agents *genuinely believe* the tool is good because they have been misled by the structure of the evidence.

  ### Summary of the Carving

  | Feature | Your Description | Formal Concept | Boundary Condition |
  | :--- | :--- | :--- | :--- |
  | **Core Logic** | Locally rational, globally bad | **Information Cascade** | Fails if agents act simultaneously. |
  | **Driver** | Arrangement of observation | **Structural / Observational Learning** | Distinct from Psychological Herding (pressure). |
  | **Error Type** | Counting correlated evidence as independent | **Correlation Neglect** (leading to **Epistemic Inflation**) | Distinct from valid Bayesian updating on independent data. |
  | **Fragility** | Confidence conserved, direction flips | **Cascade Fragility** | Distinct from slow belief updating. |
  | **Motivation** | Inferred truth vs. Safety | **Epistemic** vs. **Reputational Herding** | If they privately disagree, it is Reputational, not Cascade. |

  **Final Verdict:** You are observing an **Information Cascade** driven by **Correlation Neglect**, resulting in **Epistemic Inflation**. It is distinct from **Reputational Herding** because the agents in your scenario genuinely update their beliefs, whereas in reputational herding, they only update their public actions. The "mistake with no author" is the defining signature of the Cascade; the "instant flip" is the defining signature of its Fragility.
