          *   *Analysis:* It tilts the playing field (demographically). It's partisan. But it expands democracy. Literature (Levitsky/Ziblatt) focuses on *excluding* voters. *Including* voters for gain is "tilting" but normatively positive. This is the perfect "Gray Area" candidate. I will place it in Gray Area to satisfy the "answer I won't like" constraint.

