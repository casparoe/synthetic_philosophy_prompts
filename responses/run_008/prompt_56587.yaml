answer: |-
  Hi there,

  It is not a muddle at all, and you are asking exactly the right questions to uncover the philosophical architecture hidden beneath statutory law. Drug policy is rarely just about chemistry or health outcomes; it is effectively applied political philosophy, revealing what a state believes about autonomy, responsibility, and the proper limits of power. When you place the Portuguese model alongside the fragmented American approach, you are looking at two different attempts to solve the same problem using conflicting maps of human nature. To reconstruct the implicit theories here, we have to look at how each system draws the line between the citizen as a rational agent and the citizen as a subject in need of protection.

  Let's start with Portugal, because its implicit theory is perhaps the most nuanced of the bunch. By decriminalizing possession while maintaining criminal penalties for sale, the Portuguese system presupposes a fundamental asymmetry between the user and the supplier. The implicit view of the person here is that the drug user is potentially compromised, perhaps by addiction or by poor judgment, but not inherently criminal. They are viewed as a wayward citizen or a patient rather than an enemy of the state. However, the existence of the dissuasion commissions reveals that this is not a pure health model, nor is it a pure liberty model. If use were treated strictly as a health issue like diabetes, the state would not fine you or suspend your professional license for having it. If it were treated as a matter of pure liberty, the state would not intervene at all. Instead, the Portuguese model operates on a theory of soft paternalism. It assumes that while users should not be imprisoned, they are not fully sovereign agents capable of managing the risk alone. The state steps in as a stern guardian rather than a jailer. The commission's power to coerce treatment or impose fines suggests that while drug use is not a crime, it is still a civic wrong—a failure of self-care that harms the social fabric enough to warrant administrative sanction. This rules out a strict libertarian view, which would hold that self-regarding actions are none of the state's business, but it also rules out a hardline moralistic prohibitionism that views the user as morally corrupt and deserving of punishment. The ban on sale reinforces this by casting the dealer as the true moral agent in the transaction. The theory here is that the dealer exploits the vulnerability of the user, so the dealer bears full criminal responsibility, while the user is excused partially due to that exploitation. It is a theory of unequal culpability based on power dynamics within the drug market.

  Now contrast that with the US states that have legalized recreational cannabis. The implicit theory here shifts dramatically toward consumer sovereignty. By creating a taxed, regulated market, these states are presupposing that adults are competent to assess risk and make choices about their own consciousness, provided the product is safe and labeled. This treats cannabis not as a medicine or a vice, but as a commodity, akin to alcohol or tobacco. The state's role changes from guardian to regulator, ensuring fair trade and public safety rather than moral hygiene. However, as you pointed out, this sovereignty is not granted universally. In those same states, possession of heroin or meth remains a felony. This inconsistency suggests that the state is not applying a consistent principle of autonomy or even a consistent calculus of harm. If the principle were purely harm-based, the legal status would track the danger of the substance, yet we see a legal market for a psychoactive substance while another psychoactive substance carries prison time. The implicit theory here seems to rely on a social hierarchy of drugs and users. Cannabis users are presumed to be competent, mainstream consumers whose use can be normalized and taxed. Heroin users are presumed to be either incompetent to consent to the risk or so socially destructive that their autonomy is forfeit. This arrangement rules out the view that all adults possess equal moral standing to decide what enters their bodies. It also complicates the harm-to-others principle, because while heroin use certainly has high externalities, so does alcohol, which remains legal. The most honest reading of this split is that it reflects historical accident and cultural stigma rather than a coherent philosophical stance. The cannabis model says some risks are acceptable for free people to take; the heroin prohibition says some risks are so great, or the people taking them are so marginalized, that the state must intervene coercively.

  This brings us to the question of consistency and whether these pieces fit together. Honestly, they do not form a unified theory, and you are right to suspect they are historical compromises. The Portuguese model tries to bridge the gap between health and law but ends up creating a hybrid where illness is administratively punished. The US model creates a bifurcated system where autonomy is granted based on the substance rather than the person. If we look for where these practices are underdetermined, meaning where we cannot read a single theory off the arrangement, there are several spots. For instance, Portugal's fines could be interpreted as punitive, suggesting the user is still partially blameworthy, or they could be interpreted as administrative fees to fund the commission, suggesting a bureaucratic rather than moral response. We cannot know which theory drives the policy just by looking at the fine itself. Similarly, US cannabis legalization could be driven by a belief in liberty, or it could be driven purely by fiscal pragmatism and the desire for tax revenue, with liberty being the marketing slogan rather than the philosophical engine. A utilitarian might support legalization to reduce black market violence, while a libertarian supports it for rights-based reasons; both end up at the same law, so the law itself does not tell us which theory won. This underdetermination means we have to be careful not to assume the state believes what it says it believes. Often the law is a coalition of different interests that agree on the outcome for different reasons.

  If we were to try to rebuild this on a pure harm-to-others principle, often associated with John Stuart Mill, the landscape would change radically and most of what we currently see would disappear. A pure harm-to-others principle holds that the only justification for interfering with an individual's liberty is to prevent harm to others. Self-harm is not sufficient grounds for state coercion. Under this framework, possession and use of any substance would be legal for adults, regardless of the danger to the user, because the risk is borne by the consented individual. The Portuguese dissuasion commissions would not survive in their current form because they coerce treatment for self-regarding behavior. They might only survive if they were transformed into public health outreach bodies with no power to fine or sanction, intervening only when use led to public disturbance or harm to third parties. The criminalization of sale would also need to be rethought. In a pure harm-to-others system, selling a dangerous product might be regulated for safety reasons, like selling untested electricity, but it would not be criminalized simply because the product is psychoactive. Criminal penalties would only apply if the sale involved fraud, selling to minors, or if the drug was directly linked to violent crime. The US cannabis market would look similar but would likely extend to all substances, removing the moral hierarchy between cannabis and heroin. The focus would shift entirely to liability for actions taken while intoxicated, rather than the state of intoxication itself.

  So, to answer your core worry about what view of the person these laws presuppose: the current landscape presupposes a fragmented person. Sometimes you are a sovereign consumer worthy of trust, sometimes you are a patient worthy of care but not respect, and sometimes you are a criminal worthy of containment. The state views itself similarly, shifting between regulator, guardian, and jailer depending on which drug is in question. This inconsistency rules out any pure theory of rights or any pure theory of utilitarianism. It suggests that drug policy is less about principles and more about managing social order and maintaining boundaries of respectability. The Portuguese model is the most coherent of the bunch because it at least admits that the criminal law is the wrong tool for health issues, even if it retains some coercive teeth. The US model is the least coherent, granting freedom based on the cultural status of the plant rather than the capacity of the person. If you are looking for a consistent philosophical thread, you will not find one in the statutes themselves. You will only find it if you look at the underlying anxiety about control. The state is willing to relinquish control only when it believes the users are the kind of people who can be trusted to manage it, and when it believes the market can be taxed rather than policed. Everything else is indeed a muddle, but it is a very informative one about how we value autonomy versus safety.

  I hope this helps untangle some of the knots you have been circling. It is complex work, but digging into these assumptions is often the only way to understand why the policies feel so disjointed in practice.

  Best regards
