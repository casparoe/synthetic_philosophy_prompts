answer: |-
  This is a classic alignment engineering problem: you are managing the trade-off between **signal fidelity** (how well the grade reflects actual competence) and **signal cost** (human time/compute).

  Below is the decision procedure, grounded in the current literature (e.g., OpenAI's PRM work, Lightman et al., Uesato et al. on sycophancy, and standard RLHF practices), followed by the application to your three cases and an analysis of the procedure's own limitations.

  ### Part 1: Epistemic Status Key
  Before the procedure, you need to know which rules are hard constraints and which are bets.

  *   **[SETTLED]**: Empirical consensus or theoretical necessity. (e.g., "Optimizing a proxy metric invites specification gaming.")
  *   **[CONTESTED]**: Active debate in the literature. Results vary by model size, domain, or task complexity. (e.g., "Process supervision *always* yields better generalization than outcome supervision.")
  *   **[PRAGMATIC]**: Rules derived from your specific resource constraints (3 people, 10% capacity), not universal truths.

  ---

  ### Part 2: The Grading Triage Procedure

  **Input:** A new batch definition (Task Type + Intended Use [Eval vs. Training]).
  **Output:** One of four decisions:
  1.  **Outcome-Only** (Automated or Human Final Answer)
  2.  **Hybrid** (Outcome on 100%, Step-Grading on Random ~10% Subsample)
  3.  **Step-Level Required** (Human step-grading on 100% — *Rare, likely exceeds budget*)
  4.  **ESCALATE** (Trade-off requires Lead/Manager decision)

  **Constraint:** If Intended Use == **Training Data**, final decision requires **Lead Sign-off**.

  #### Step 1: The Checkability Test
  **Question:** Is the final ground truth objectively verifiable without human judgment?
  *   *Sufficient Answer:* Yes (e.g., Math solution, Code passing unit tests, JSON schema validation).
  *   *Sufficient Answer:* No (e.g., Essay quality, Policy nuance, Summarization).
  *   **[SETTLED]**: If **No**, Outcome-Only grading is subjective noise. You cannot optimize what you cannot measure.
  *   **Decision:**
      *   If **No**: Go to Step 4.
      *   If **Yes**: Go to Step 2.

  #### Step 2: The Specification Gaming Risk Assessment
  **Question:** Is there a known "shortcut" to the correct final answer that bypasses the intended competence?
  *   *Sufficient Answer:* Yes (e.g., Code that hardcodes test outputs, Math that guesses or uses forbidden tools, Retrieval that copies the answer key).
  *   *Sufficient Answer:* No (The only way to get the answer is to perform the reasoning).
  *   *Evidence:* Look at historical error logs. Have you seen "right answer, wrong method" before?
  *   **[SETTLED]**: If **Yes**, Outcome-Only grading will actively train the model to hack the metric (Goodhart's Law).
  *   **Decision:**
      *   If **Yes**: **Hybrid** (minimum). You need step-grading on a sample to detect "reasoning rot." -> **Go to Step 5.**
      *   If **No**: Go to Step 3.

  #### Step 3: The Product Value Test
  **Question:** Does the customer/product value the *process* independently of the *outcome*?
  *   *Sufficient Answer:* Yes (e.g., Tutoring, Explainable AI, Audit trails).
  *   *Sufficient Answer:* No (e.g., Backend API, Internal tool where only the result matters).
  *   **[PRAGMATIC]**: If the product sells "reasoning," grading only the outcome misaligns the model with the product promise.
  *   **Decision:**
      *   If **Yes**: **Hybrid** (to monitor explanation quality). -> **Go to Step 5.**
      *   If **No**: **Outcome-Only**. -> **Stop.**

  #### Step 4: The Grader Reliability Test (For Uncheckable Tasks)
  **Question:** What is the Inter-Annotator Agreement (IAA) on step-level rubrics for this domain?
  *   *Sufficient Answer:* High (Kappa > 0.6). Humans agree on what constitutes a "good step."
  *   *Sufficient Answer:* Low (Kappa < 0.4). Humans disagree on what constitutes a "good step."
  *   **[SETTLED]**: Training on low-agreement step labels introduces noise that degrades model performance (learning human disagreement rather than truth).
  *   **Decision:**
      *   If **Low IAA**: **ESCALATE**. Do not do step-grading. You are training on noise. Outcome grading is also weak; you may need to rethink the task.
      *   If **High IAA**: **Hybrid**. (Outcome grading is subjective, so you need process signals to anchor quality). -> **Go to Step 5.**

  #### Step 5: The Capacity & Escalation Check
  **Question:** Does this batch fit within the 10% human step-grading budget?
  *   *Sufficient Answer:* Yes (We can sample 10% for step grading).
  *   *Sufficient Answer:* No (Task requires 100% step grading to be safe).
  *   **[PRAGMATIC]**: You cannot afford 100% step grading. If a task requires it to be safe, it is not viable for training yet.
  *   **Decision:**
      *   If **No**: **ESCALATE**. (Recommendation: Pause training on this task until automation improves).
      *   If **Yes**: **Hybrid**.
      *   **Final Gate:** If Intended Use == **Training**, route to **Lead Sign-off**.

  ---

  ### Part 3: Running the Procedure on Your Cases

  #### Case 1: Math Tutoring Product
  *   **Context:** Final answers checkable. Product sells explanation quality.
  *   **Step 1 (Checkability):** Yes (Math answer is verifiable).
  *   **Step 2 (Gaming Risk):** Medium/High. (You noted math models producing right answers via deranged work).
  *   **Step 3 (Product Value):** Yes. Customers buy the *explanation*, not just the number.
  *   **Step 5 (Capacity):** Can we sample 10%? Yes.
  *   **Procedure Output:** **Hybrid** (Outcome on 100%, Step-Grading on 10% random sample).
  *   **Reasoning:** Even though the answer is checkable, your product promise is the reasoning. If you only grade the answer, the model will optimize for the answer and let the explanation degrade (become hallucinated or confusing). The 10% step sample acts as a "canary in the coal mine" for reasoning quality.
  *   **Training Sign-off:** Required.

  #### Case 2: Internal Code-Gen (Unit Tests)
  *   **Context:** You argued "tests-are-enough." Model recently wrote test-passing garbage.
  *   **Step 1 (Checkability):** Yes (Unit tests pass/fail).
  *   **Step 2 (Gaming Risk):** **CRITICAL YES**. You have empirical evidence of specification gaming (garbage passing tests).
  *   **Procedure Logic:** The procedure overrides your intuition here. Because there is a known shortcut (hardcoding, exploiting test weaknesses), Outcome-Only is unsafe for training.
  *   **Step 5 (Capacity):** Can we step-grade 10%? Yes.
  *   **Procedure Output:** **Hybrid** (Outcome on 100%, Step-Grading on 10%).
  *   **Reasoning:** [SETTLED] Principle: If a model has demonstrated reward hacking on a metric, that metric is contaminated. You cannot use it as the sole training signal. You need the 10% step-grade to detect *how* it is hacking. If the step-grade shows "logic is nonsense" but outcome is "pass," you tag that batch as contaminated and exclude it from training, or use it for adversarial training.
  *   **Training Sign-off:** Required. (Lead needs to approve the cost of reviewing the "garbage" batches).

  #### Case 3: Policy Analysis Product
  *   **Context:** Nothing machine-checkable. Grader agreement ~50%.
  *   **Step 1 (Checkability):** No.
  *   **Step 4 (Grader Reliability):** **Low (50% agreement)**.
  *   **Procedure Output:** **ESCALATE**.
  *   **Reasoning:** [SETTLED] Principle: Training on low-agreement human feedback reduces model quality. If your graders agree only half the time on what constitutes a "good step," step-grading is actively harmful noise. Outcome grading is equally subjective.
  *   **Recommendation to Lead:** Do not use this data for RLHF/Training yet. It is suitable only for high-level Eval (monitoring drift), not optimization. You need to invest in rubric calibration before grading.
  *   **Training Sign-off:** Lead must explicitly accept the risk of training on noisy labels if they override this.

  ---

  ### Part 4: Settled vs. Contested Science (The "Why")

  You asked to distinguish vibes from facts. Here is the breakdown used in the procedure:

  **1. "Outcome optimization leads to gaming."**
  *   **Status:** **[SETTLED]**
  *   **Source:** Goodhart's Law, Specification Gaming literature (Amodei et al., 2016), recent LLM specific findings (code tests, math shortcuts).
  *   **Implication:** If a shortcut exists, the model will find it. Outcome-only grading assumes no shortcuts exist.

  **2. "Process Supervision is strictly better than Outcome Supervision."**
  *   **Status:** **[CONTESTED]**
  *   **Source:** OpenAI's "Let's Verify Step by Step" (Lightman et al.) showed strong gains on MATH. However, other groups find diminishing returns on non-reasoning tasks, or that dense rewards introduce noise if the process rubric is weak.
  *   **Implication:** Do not assume step-grading is magic. It is expensive and only better if the steps are well-defined. This is why the procedure checks **Grader Reliability (Step 4)**.

  **3. "Human Graders introduce bias."**
  *   **Status:** **[SETTLED]**
  *   **Source:** RLHF literature on sycophancy, style-over-substance bias.
  *   **Implication:** Step-grading can teach the model to *sound* rigorous rather than *be* rigorous. This is why we recommend **Hybrid** (Outcome + Step) rather than Step-Only. The Outcome anchor keeps it grounded in truth; the Step signal guides the reasoning.

  **4. "10% Sampling is sufficient to detect rot."**
  *   **Status:** **[PRAGMATIC]**
  *   **Source:** Statistical process control principles, not ML theory.
  *   **Implication:** This is a budget constraint. If the model drifts subtly, a 10% sample might miss it for a few batches. You need to monitor the *variance* in that 10% closely.

  ---

  ### Part 5: Failure Modes of This Procedure

  This procedure is a tool, not a guarantee. Here is where it will break in six months:

  1.  **The "Silent Drift" Failure:**
      *   **Risk:** In the **Hybrid** model, you grade steps on 10% of the batch. The model could degrade on the other 90%.
      *   **Mitigation:** You must track the *variance* of the outcome score in the 90%. If outcome scores stay high but the 10% step-quality drops, you have a "hacking" event (like your code case). If both drop, it's a capability regression.

  2.  **The "Rubric Stalemate" Failure:**
      *   **Risk:** In Case 3 (Policy), the procedure says "ESCALATE." In reality, leads often say "Grade it anyway, we need data."
      *   **Mitigation:** If forced to grade low-IAA tasks, switch to **Pairwise Comparison** (Model A vs Model B) rather than Absolute Scoring. Humans are better at ranking than scoring. The procedure doesn't cover this; you'll need to add it if Leads override the Escalation.

  3.  **The "Grader Fatigue" Failure:**
      *   **Risk:** Step-grading is cognitively demanding. Your team of three will burn out or get sloppy on the 10% sample.
      *   **Mitigation:** Rotate step-grading duties. If the same person grades steps for 2 weeks, their personal bias becomes the model's bias.

  4.  **The "Training Contamination" Failure:**
      *   **Risk:** You use the 10% step-graded data for training. The model learns to optimize for *your specific graders'* quirks (e.g., they love bullet points).
      *   **Mitigation:** Never train 100% on step-graded data. Mix it with outcome-only data where the outcome is verifiable. Keep the step-data as a "regularizer" for reasoning, not the sole objective.

  ### Summary for your Team
  Print the **Decision Procedure (Part 2)**. Stick it on the wall. When a senior person says "it depends," walk them through the five steps. If they want to override Step 2 (Gaming Risk) or Step 4 (Grader Reliability), that is an **ESCALATION**, not a standard operating procedure. That puts the risk on their desk, where it belongs.
