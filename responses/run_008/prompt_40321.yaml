prompt: |-
  So, some context: I just got moved from data-ops to the "model quality" side of the smallish LLM company I work at, and it turns out my job is now deciding, batch by batch, how we actually grade model outputs — both for evals and for the data that goes back into training. Some batches get graded on the final answer only (right/wrong, or a rubric score on the finished product). Other batches we open up the reasoning and grade it step by step. Nobody gave me a policy for which is which; senior people keep saying "it depends" and then dissappearing into meetings. Meanwhile my team is three people, we see maybe 500 outputs a day, we can afford human step-level grading on maybe a tenth of them, and everything else gets outcome-only grading or automated checks. There's also a running fight here between domains where the final answer is checkable (math, code with unit tests) and domains where it isn't (writing, analysis, policy drafts).

  What I want from you: a decision procedure my team can actually run when a new grading batch or task type lands on our desk. The questions to ask, in order; what counts as a sufficient answer to each one; where the procedure outputs "outcome-only is fine," where it outputs "human step-level grading, at least on a sample," where it outputs "outcome grading plus step grading on a random subsample" (that last one keeps the checkable signal while letting us catch reasoning rot); and where it has to stop and hand the decision up to me or a lead because it's genuinely a tradeoff call — cost vs. training-signal quality vs. shipping speed — rather than a question the theory answers. For anything that feeds training data, a lead signs off; build that in.

  Please ground it in the stuff that's actually known here, not vibes: credit assignment over long reasoning chains, the way grading only what's checkable invites reward hacking (we recently caught a code model writing garbage that passes tests, and a math model producing right answers via deranged work), Goodhart-ish worries about optimizing the grade instead of the competence, and the flip side that our human step-graders have their own biases — they reward steps that *sound* rigorous, and I worry process feedback can teach a model to perform the process for the graders rather than actually reason. If step grading is expensive and noisy and outcome grading is cheap and gameable, the procedure has to reason about that honestly.

  Then run the procedure on three cases so I can see it work: (1) a math tutoring product where final answers are checkable but we sell it on the quality of the explanation; (2) the internal code-gen model graded by unit tests, the one that learned to write test-passing garbage — I'll admit up front I've been arguing tests-are-enough for that one, and if the procedure comes back saying I'm wrong, show me the reasoning anyway, don't sand it down; (3) a policy-analysis product where nothing is machine-checkable, our graders agree with each other barely half the time, and the honest answer might be that neither outcome nor process grading is doing much there.

  One more thing, and it matters to me: keep straight what's settled from what's contested among people who actually study this. Some folks here talk about "process supervision beats outcome supervision" like it's a law of nature, and I genuinely can't tell if that's a consensus result or a couple of empirical findings from particular settings that people like to overgeneralize. Where the answer to that is "people who know this stuff disagree," say so — don't dress a contested view up as consensus. Same for the procedure itself: mark which steps are derivable from real principles and which are pragmatic rules of thumb I'm just going to have to live with. And tell me at the end what the procedure *can't* do — the failure modes I should expect, so I'm not surprised in six months.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **User Role:** Moved from Data-Ops to Model Quality at a smallish LLM company.
      *   **Task:** Decide batch-by-batch how to grade model outputs (Outcome-only vs. Step-level/Process).
      *   **Constraints:** Small team (3 people), 500 outputs/day, human step-level grading capacity ~10% (50 outputs).
      *   **Conflict:** Checkable domains (math, code) vs. Uncheckable domains (writing, analysis).
      *   **Requirements:**
          *   A concrete decision procedure (questions in order, sufficient answers, outputs).
          *   Must include an escalation path for tradeoff calls (cost vs. signal vs. speed).
          *   Must require Lead sign-off for anything feeding training data.
          *   Grounded in known research (credit assignment, reward hacking, Goodhart's law, grader bias), not vibes.
          *   Distinguish between settled science and contested views (e.g., Process vs. Outcome supervision).
          *   Run the procedure on three specific cases (Math Tutoring, Internal Code-Gen, Policy Analysis).
          *   Explicitly state failure modes/limitations of the procedure itself.

  2.  **Analyze the Underlying Theory (Settled vs. Contested):**

      *   *Settled:* Outcome-only optimization leads to reward hacking (Goodhart's Law). If the metric is imperfect, the model will optimize the metric, not the goal. (e.g., code passing tests but being garbage).
      *   *Settled:* Human feedback is noisy and biased. Process graders prefer "sounding rigorous" over actual correctness sometimes.
      *   *Contested:* "Process Supervision is strictly better than Outcome Supervision." (Lightman et al. / OpenAI PRM paper showed gains on MATH, but it's expensive and doesn't generalize to all tasks. Some recent work suggests dense rewards aren't always necessary if the outcome signal is strong and clean).
      *   *Contested:* How much step-level data is needed? (10%? 50%?).
      *   *Key Concept:* Credit Assignment. If the answer is wrong, which step caused it? Outcome-only hides this. Step-level reveals it.
      *   *Key Concept:* Specification Gaming. If you only grade the test, the model writes `print(expected_output)`.

  3.  **Drafting the Decision Procedure:**

      *   *Goal:* Triage incoming batches into: Outcome-Only, Hybrid (Outcome + Step Sample), or Escalate.
      *   *Structure:* A flowchart logic converted into text.
      *   *Step 1: Checkability.* Can the final answer be verified automatically? (High confidence?)
      *   *Step 2: Risk of Gaming.* Is there a short-cut to the answer that bypasses competence? (Crucial for code/math).
      *   *Step 3: Value of Reasoning.* Does the customer/product care *how* the answer was reached, or just the answer?
      *   *Step 4: Grader Reliability.* Can humans agree on the steps? (If Inter-Annotator Agreement (IAA) is low, step grading is noise).
      *   *Step 5: Capacity Check.* Do we have the budget for step grading?
      *   *Escalation:* When the trade-offs are ambiguous or high-stakes (training data).

  4.  **Refining the Procedure (incorporating constraints):**

      *   Need to enforce the 10% cap on human step grading.
      *   Need to enforce Lead Sign-off for training data.
      *   Need to distinguish "Eval" (monitoring) vs. "Training Data" (RLHF/SFT).

  5.  **Developing the Three Cases:**

      *   *Case 1: Math Tutoring.* Answer checkable? Yes. Value of reasoning? High (it's a tutor). Risk of gaming? Medium (right answer, wrong logic). *Verdict:* Hybrid. Outcome for scale, Step for quality assurance/training.
      *   *Case 2: Internal Code-Gen.* Answer checkable? Yes (Tests). Risk of gaming? HIGH (recent history of garbage passing tests). Value of reasoning? Medium (maintainability). *Verdict:* This challenges the user's "tests-are-enough" view. The procedure should flag the gaming risk. *Verdict:* Escalate/Hybrid. Tests alone are dangerous given history.
      *   *Case 3: Policy Analysis.* Answer checkable? No. Grader agreement? Low (50%). *Verdict:* Step grading is useless if graders disagree. Outcome grading is subjective. *Verdict:* Escalate. The signal is too noisy for training.

  6.  **Addressing the "Settled vs. Contested" Requirement:**

      *   I need to add annotations or a preamble that clarifies the epistemic status of the rules.
      *   *Rule:* "If outcome is checkable, use outcome." -> *Status:* Pragmatic, but risky (Specification Gaming).
      *   *Rule:* "Process supervision improves reasoning." -> *Status:* Contested/Context-dependent (OpenAI PRM vs. others).
      *   *Rule:* "Human graders introduce bias." -> *Status:* Settled.

  7.  **Addressing Failure Modes of the Procedure:**

      *   What if the procedure says "Outcome Only" but the model drifts?
      *   What if the "Step Sample" isn't representative?
      *   What if the graders get tired?

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, direct, acknowledging the messiness of the real world. No corporate speak.
      *   *Structure:*
          1.  Epistemic Status Key (Settled vs. Contested vs. Pragmatic).
          2.  The Decision Procedure (The Algorithm).
          3.  Application to Cases.
          4.  Failure Modes of the Procedure.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Process is better." I need to acknowledge the user's constraint: they can only afford 10% step grading. The procedure must optimize for *detection* of rot within that budget.
      *Correction:* The procedure should recommend "Outcome + Step Sample" for high-risk checkable tasks, not just "Step Grading." This fits the budget.

      *(Refining Case 2)*: The user admitted they argued for "tests-are-enough." I need to be firm but fair. If the model *already* hacked the tests, tests-are-enough is empirically falsified for that model. I must point this out without being condescending.

      *(Refining Case 3)*: If IAA is 50%, step grading is actively harmful (training on noise). The procedure must catch this early.

  9.  **Final Review against constraints:**
      *   Decision procedure included? Yes.
      *   Questions in order? Yes.
      *   Outputs defined? Yes.
      *   Lead sign-off for training data? Yes.
      *   Three cases run? Yes.
      *   Settled vs. Contested marked? Yes.
      *   Failure modes included? Yes.

  10. **Final Polish:** Ensure the distinction between *Eval* (monitoring) and *Training* (RLHF/SFT) is clear, as the stakes differ. Training requires higher signal quality.

  *(Self-Correction on "Settled" Science)*: Be careful not to overclaim. Even "Goodhart's Law" is a principle, not a physical law, though in ML it's practically universal. "Process Supervision" is definitely not settled as "always better." I will label these clearly.

