  **Case 1: The Illustrator vs. AI Company**
  *   **Verdict:** **Exploited.**
  *   **Reasoning:** She will view this not as a wage labor issue, but as a **rentier extraction** issue. Her verdict on the medieval peasant is the key here: she explicitly counts feudal rent as exploitation. To her, the AI company is acting like a feudal lord enclosing the commons. They are appropriating the value of her past labor (embodied in the style/data) to generate profit without compensating the producer. The fact that she keeps her copyright is irrelevant; the *value* of that copyright has been undermined by the company's appropriation of her labor's output. It fits the "Peasant" model: she produces, they extract a tithe (in this case, the competitive value of the style) via a power asymmetry she cannot reasonably refuse (the ubiquity of the model).

  **Case 2: The Open-Source Maintainer**
  *   **Verdict:** **Not Exploited.**
  *   **Reasoning:** This maps directly onto her **Hobbyist Woodworker** verdict. The crucial factor for her is *compulsion* and *appropriation*. The maintainer owns the means of production (computer/time), sets the terms, and critically, "would keep doing it even if the company vanished." There is no coercive transfer of surplus value because the labor is gratuitous. The fact that a billion-dollar company *benefits* is insufficient for exploitation in her book; otherwise, the woodworker's friends (who benefit from the furniture) would be exploiters. For her, exploitation requires a structural relation where the producer is *compelled* to surrender surplus to a distinct class.

  ### 2. The Implicit Rule

  She is not running the **Strict Surplus-Extraction Rule** (which requires a wage contract and direction), because that fails to explain the **Stay-at-Home Partner** verdict (no wage, no boss).

  She is not running the **Broader Benefit/Coercion Rule** (benefit flows + inability to refuse), because that would likely condemn the **Open-Source Maintainer** (Big Tech benefits, and one could argue relying on reputation is a form of coercion) and potentially the **Hobbyist** (friends benefit).

  **The Rule She Is Using: Class Appropriation of Surplus Labor.**
  Her definition of exploitation is: *A systematic transfer of labor value from a producing class to a non-producing class, enforced by the power relations of the prevailing mode of production.*

  *   **Why it fits the Engineer:** He sells labor power to Capital. The class relation exists regardless of the wage size.
  *   **Why it fits the Housework:** She views domestic labor as reproducing labor power for Capital (and the specific partner), appropriated via Patriarchal/Capitalist relations.
  *   **Why it fits the Peasant:** Feudal extraction is a class appropriation mechanism, functionally equivalent to capitalist surplus value in her moral ontology.
  *   **Why it fits the Hobbyist:** No class appropriation occurs; it is outside the mode of production.

  ### 3. Alienation vs. Exploitation (The AI Wiggle Room)

  You asked how she handles the AI case if it's alienating but not exploitative on a strict rule.

  *   **The Wiggle:** She will likely argue that the AI case is **both** alienating and exploitative, but for different reasons.
      *   **Alienation:** She will use the term loosely here (as you noted she does). The illustrator is alienated because her creative essence is objectified into a model that works against her interests; she loses control over the *purpose* of her past labor.
      *   **Exploitation:** She will justify calling this "exploitation" (rather than just "theft") by leaning on the **Peasant Verdict**. Just as the Lord exploits the Peasant through rent rights rather than a wage, the AI Company exploits the Illustrator through data rights.
      *   **Consistency with Housework:** This is consistent. Housework is exploited not because there is a wage, but because the *value* of the labor (reproduced worker) is appropriated by the capitalist system (and the partner) without compensation. Similarly, the *value* of the Illustrator's labor (training data) is appropriated by the AI capitalist without compensation. In both cases, the "wage" is absent, but the "class appropriation" is present.

  ### 4. The Wedge Case (To Distinguish the Rules)

  To truly test whether she prioritizes **Class Appropriation** (her likely rule) vs. **Broad Benefit/Coercion** (the alternative), you need a case where labor is appropriated without pay, but *not* by a Capitalist class.

  **The Test Case: The Unpaid Intern at a Worker Cooperative.**

  > **Scenario:** A fully functioning Worker Cooperative (equal profit shares, no external owners) takes on an unpaid intern. The intern performs core labor under the direction of the worker-members. The co-op sells the product of this labor and distributes the revenue among the *members*. The intern is not a member yet, receives no pay, and takes the position because they need the experience to get a job elsewhere (coercive necessity).

  **Why this splits the rules:**

  1.  **Strict Surplus Rule:** **Exploited.** (Labor is directed, product is appropriated, no wage).
  2.  **Broad Benefit/Coercion Rule:** **Exploited.** (Benefit flows to the co-op, intern cannot reasonably refuse due to job market necessity).
  3.  **Her Likely Rule (Class Appropriation):** **Not Exploited.** (This is the critical prediction).
      *   *Reasoning:* In her view, exploitation requires a transfer of value to a *distinct, non-producing class* (Capitalists/Lords). In a Co-op, the surplus stays with the workers. While the intern is treated unfairly, the *structural relation* of exploitation (Capital vs. Labor) is absent. The surplus is socially owned by the producers (the members), not appropriated by a separate class.

  **How to spring it:**
  Ask her: *"If a worker co-op uses an unpaid intern to boost their profit shares, is that exploitation? There's no capitalist owner, but the intern is working for free under direction."*

  *   If she says **Exploited**: She is more of a **Humanist/Universalist** (unpaid labor is inherently exploitative). This undermines her Co-op Member verdict's logic (which relies on class structure).
  *   If she says **Not Exploited**: She is a **Structuralist/Class Marxist** (exploitation requires a capitalist class relation). This confirms she will treat the AI case as exploitation (because AI Cos are Capitalist) but the OS case as non-exploitation (because the maintainer opts out of the class relation).

  **My bet:** She says **Not Exploited** (but perhaps "unethical"). This confirms her reliance on *Class Appropriation* as the defining feature of exploitation, distinguishing her from liberals who call any unpaid work "exploitation."
