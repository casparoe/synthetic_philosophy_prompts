          *   *Crucial Insight:* The analogy actually reveals that **Extended Preferences is just a specific normalization technique.**
      *   *Section 4: The Smuggled Assumption.* What is the ML equivalent of "Imagine being them"?
          *   It's choosing the *baseline* and the *scale*.
