          *   Philosophical equivalent: Extended preferences assume "Rationality" is the common unit.
      *   *Section 5: Where it breaks.* Verification. In ML, we check if normalization helps downstream tasks. In ethics, there is no "downstream task" to verify against (unless you define one, like social stability).
      *   *Conclusion:* The analogy supports the *structure* of the Extended Preferences argument (b), but highlights the *fragility* of the Skeptic's worry (a). The "normalization assumption" is **The Invariance Assumption** (that the transformation doesn't distort the moral signal).

  8.  **Refining the Tone:**
