prompt: |-
  I read something on a tech blog last week and its been bugging me ever since. It was about Goodhart's law, with a detour into AI safety. You're a senior researcher type, half economist half ML person, an expert on measurement theory and specification gaming, so please think carefully before answering -- maybe brainstorm the different ways the thing could be wrong before you commit to an audit.

  The article's summary went roughly like this:

  "Charles Goodhart proved in the 1970s that any measure you optimize for stops measuring the thing you care about. His law is usually stated as 'when a measure becomes a target, it ceases to be a good measure.' So when the colonial British put a bounty on cobras, people started breeding cobras, and the metric (dead cobras) stopped tracking the goal (fewer cobras). The lesson is that metrics are self-defeating by nature: the harder you push on the proxy, the faster the correlation between proxy and goal decays, until optimizing the proxy is actively worse than not measuring anything at all. Campbell discovered the same thing in the social sciences a few years earlier. This is why modern AI systems will inevitably game their reward signals, and why the only real solution is to keep humans in the loop using qualitative judgment instead of metrics."

  Something about this feels off to me, but I honestly cant tell where. I know the cobra story is at least half legend, and I vaguely remember a friend insisting there are actually several different Goodhart's laws that people run together, some of which aren't even about incentives? Can you go bit by bit and tell me which parts someone who actually works on this (economists, ML alignment people) would accept, which are simplifications a careful person would let slide, and which are just wrong. Especially: did Goodhart "prove" anything, and was the target/measure phrasing even his? Is the "the harder you push, the faster it decays" claim true in general, or does it depend on which mechanism is doing the damage? And does the conclusion at the end -- that we should ditch metrics for qualitative judgment -- actually follow from whichever parts survive the audit? I'm inclined to half believe the article because the vibe matches stuff I've heard about reward hacking, so definately be hard on it.
