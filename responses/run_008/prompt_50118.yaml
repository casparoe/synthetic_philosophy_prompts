      *   **Conclusion:** Summary of what survives the audit.

  4.  **Drafting the Content (Iterative refinement for tone and accuracy):**
      *   *Tone:* Professional, analytical, slightly conversational but dense with insight.
      *   *Key Distinction:* Make sure to distinguish between *Regressional Goodhart* (statistical noise) and *Adversarial Goodhart* (gaming). The article conflates them.
      *   *Key Reference:* Mention Katja Grace, Paul Christiano, or Scott Garrabrant/Manheim taxonomy to show ML alignment expertise. Mention the original 1975 paper for economics credibility.
