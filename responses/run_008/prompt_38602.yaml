answer: |-
  Break the argument at **(4)**.

  Premise (4) claims your scientific beliefs are caused by the "same natural stuff" in the same truth-insensitive way as religious ones. This is false. While both originate in human brains shaped by evolution, the *mechanism* sustaining them differs crucially.

  Religious beliefs are often maintained by cultural transmission regardless of empirical evidence. If Zeus didn't exist, lightning would still strike, and believers would still attribute it to him. The belief is insensitive to the truth.

  Scientific beliefs are maintained by **feedback loops**. If antibiotics didn't work, patients would die, and you would stop believing in antibiotics. Your belief is tethered to reality. If the world were different, the evidence would be different, and so would your belief. Therefore, scientific beliefs satisfy the condition in (2)—they are sensitive to truth—while religious beliefs often do not. You aren't believing science just because your culture told you to; you believe it because it consistently predicts and manipulates reality.

  **The Cost:** Rejecting (4) costs you the comfort of total equivalence. You cannot treat science as merely "another narrative" or "just culture." You must acknowledge that the scientific method is a unique tool designed specifically to bypass cultural bias and track truth. It requires you to trust that empirical verification is fundamentally different from tradition.

  This saves your rationality. Your belief in science is rational not because you chose your birth culture, but because your belief-forming process (observation, testing, falsification) is reliable. Your belief in this argument is rational because it follows logical rules that hold regardless of culture.

  You keep (1)—religion is naturally explained—without losing science. The natural explanation for science includes reality checking; for religion, it often includes social cohesion. They are natural, but not the same.
