  Dear Colleague,

  It sounds like you witnessed a classic instantiation of the debate between Humean supervenience and anti-Humean realism regarding the laws of nature, and while the barbecue setting was informal, the philosophical structure of their exchange was remarkably precise. To adjudicate this properly, we need to recognize that Maya is defending a version of the Best System Account, likely following David Lewis, where laws are mere summaries of the spatiotemporal mosaic of particular facts, optimized for simplicity and strength. Dan is arguing for a governing conception of laws, where laws are ontologically distinct from the events they describe and possess some modal force that constrains how particles behave. Their exchange moves through the four standard battlegrounds of this literature: modality, intelligibility, explanation, and scientific practice.

  On the first point regarding the tachyon, Dan is intuitively correct while Maya is technically consistent but practically vulnerable. Dan's objection highlights the problem of modal force. If laws are merely summaries of what actually happens, they lose their normative capacity to forbid what does not happen. For a physicist, the statement nothing travels faster than light is not just a report of past data but a constraint on future possibilities. If a tachyon appeared, the Humean must say the law was never truly a law because the best system would change, which undermines the stability required for scientific planning. Maya's position implies that laws are contingent on the total history of the universe, so a single new event can retroactively alter the status of a law, which feels deeply counterintuitive to scientific practice. However, Maya could argue that the Best System supports counterfactuals within the current mosaic, meaning the law still tells us what would happen in nearby possible worlds, but Dan is right that this lacks the robust necessity physicists assume when they design experiments based on the expectation that nature will not suddenly violate a conservation law.

  On the second point concerning the mystery of governance, Maya holds the stronger metaphysical ground. Her challenge to Dan is the standard intelligibility objection against anti-Humeanism. If laws are entities distinct from the mosaic, how do they interact with it? To say a law pushes a planet implies a causal relation between an abstract proposition and a concrete body, which risks a category mistake or invokes a kind of natural magic. Maya is correct that positing a governing layer adds ontological baggage without clearly explaining the mechanism of governance. Dan's appeal to Ockham's razor here is weak because he is positing extra entities, but Maya's appeal to parsimony is strong because she denies the need for the extra entities altogether. Unless Dan can specify the metaphysical category of laws, such as treating them as relations between universals or as dispositional essences, Maya is right that the governing view introduces a mystery about how the governance occurs that the Humean view successfully avoids by denying governance exists.

  On the third point about explanation and circularity, Dan identifies a genuine weakness in the Humean account, though Maya's defense is standard. The charge is that Humeanism makes explanation circular because the laws are derived from the mosaic, yet the laws are supposed to explain the mosaic. Dan argues that saying the glass fell because of gravity, when gravity is just a summary of falling things, is uninformative. Maya counters that all explanations bottom out in brute facts, and her brute facts are ontologically cheap. While Maya is right that some foundation is necessary, Dan is right that the Humean base is explanatorily shallow. The Humean claims the systematization provides understanding, but as Dan notes, this looks like saying the data explains itself. If the goal of science is to find the reasons why the mosaic is one way rather than another, summarizing the mosaic does not provide those reasons. Therefore, Dan wins on the depth of explanation, even if Maya wins on the avoidance of metaphysical mystery.

  On the fourth point regarding parsimony versus explanatory grip on unseen cases, Dan again aligns better with scientific realism. Maya argues that her view is cheaper, but Dan correctly points out that cheapness is not the only theoretical virtue. Physics relies on the extrapolation of laws to regimes never before observed, such as the interior of black holes or the early universe. This practice assumes laws have a grip on reality that transcends the actual data collected so far. A mere summary of seen cases cannot logically guarantee unseen cases without assuming the uniformity of nature, which itself requires justification. Maya might say the best system is the best guide because simplicity projects, but this assumes nature is simple, which is itself a substantive claim about the world. Dan is right that the Humean view makes the success of induction and extrapolation look like a happy accident, whereas a governing view treats the stability of laws as the reason induction works.

  Both of them are missing some nuance that a professional metaphysician would bring to the table. Maya did not deploy the Lewisian defense that the Best System Account can handle counterfactuals by analyzing them in terms of similarity relations between possible worlds where the laws hold fixed. This would blunt Dan's tachyon objection slightly. Dan, conversely, did not specify what kind of anti-Humean view he holds. If he were a dispositional essentialist, he could argue that laws are not external governors but internal to the properties of particles, which avoids Maya's mystery of governance objection. Without specifying whether laws are external constraints or internal dispositions, Dan leaves himself open to the charge of mysticism, and without addressing counterfactual semantics, Maya leaves herself open to the charge of making laws too fragile.

  Overall, Dan is more right given your context as a physicist, though Maya is more right on strict ontological parsimony. If the criterion is which view better captures the practice and self-understanding of physics, Dan wins. Physicists treat laws as discoveries about the constraints of reality, not as compressions of data. The feeling that a tachyon would violate a law rather than just update a summary is central to how physics progresses. However, if the criterion is metaphysical minimalism and avoiding category mistakes about abstract entities influencing concrete ones, Maya wins. Since you are embedded in the scientific practice, Dan's intuition that laws have grip is likely more useful for your work, even if Maya's ontology is cleaner. The Humean view saves on entities but costs significantly in explanatory power and modal stability, which are currencies physicists spend daily.

  Regarding the bonus question about the fundamental constants, their drift into that topic absolutely tracks their earlier disagreement rather than changing the subject. The debate over whether constants could have been different is a debate about the modality of laws. For Maya, the constants are just part of the mosaic summary, so they are contingent facts that could have been different if the universe had been different. For Dan, if laws govern, there is a stronger temptation to view constants as either necessary or constrained by the nature of the laws themselves. If laws are real features of the world, there might be a reason why the fine-structure constant has the value it does, whereas for Maya, it is just a brute number in the best system. Therefore, the constants argument is simply the modal status of laws applied to specific parameters, and it remains squarely within the Humean versus anti-Humean framework they were already debating.

  I hope this helps you navigate the next time the barbecue turns metaphysical. It is a rare treat to hear the literature on laws of nature enacted so vividly outside a seminar room, and while neither side delivers a knockout blow, the tension between them defines much of contemporary philosophy of science.

  Best regards,

  Your Colleague
