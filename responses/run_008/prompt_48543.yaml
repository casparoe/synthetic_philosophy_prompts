answer: |-
  1. Candidate principle or principles

  **The Constitutive History Principle.** Provenance matters to the degree that the object's identity is constituted by its history of production rather than its perceptual properties. Where the work is defined by its specific physical genesis, authenticity is essential (motivated by Case 1). Where the work is defined by its informational or sensory content, perceptual equivalence suffices (motivated by Case 4).

  **The Engagement Distinction.** Within objects valued for history, value splits based on engagement: passive experience ignores provenance, while ownership claims demand it (motivated by Case 3). This explains why an object can be aesthetically identical yet financially distinct depending on whether one acts as a listener or a collector.

  2. Application to my verdicts

  Case 1 fits perfectly: paintings are constitutive history, so forgery destroys value because the specific physical genesis is the work. Case 2 fits but with reduced intensity: prints are multiples, so history matters less than unique paintings, warranting only a modest premium for the original block. Case 3 is explained by the Engagement Distinction: listening is experiential (no care), while owning is historical (high care), justifying the price disparity despite identical sound. This shows value shifts with the observer's role. Case 4 fits clearly: text is information, so the scan suffices without physical contact with the scribe, unlike Case 1 where the canvas itself is the work. This distinction clarifies why Case 4 differs from Case 1: one seeks data, the other seeks presence. Case 5 fits: food is consumable experience, so the chef's hand is irrelevant once consumed, distinguishing it from Case 7. Case 6 mostly fits: recordings are experiential, so provenance should not matter, though cultural conditioning causes a brief dip before rationality prevails. Case 7 fits intensely: the fresco is a physical relic, so partial originality retains constitutive history, unlike a total replica. Physical continuity here outweighs aesthetic completion. The only slight mismatch is Case 6's transient concern, which conflicts with the clean split in Case 5, suggesting an emotional lag rather than a principled value difference. Case 2's modesty also requires acknowledging that multiples dilute the "unique relic" status. Overall, the principles predict your verdicts with high accuracy, treating the transient dip in Case 6 as psychological inertia rather than rational valuation, and explaining the owner/listener split in Case 3 as a shift in mode of valuation from experience to historical possession.

  3. The workshop case

  The workshop case tests the boundary of constitutive history. Since the face—the expressive locus—is by the master, the painting retains significant historical connection to the originating agency. However, the apprentice's hand breaks the total physical continuity required for a full autograph valuation. My principle predicts you should value it higher than a period copy but lower than a fully autograph work. Treat it as a discounted original, acknowledging the master's agency where it matters most. Value it closer to an original because the expressive locus carries the master's touch. This satisfies the requirement for causal-aesthetic relation in the most critical area while acknowledging the apprentice's labor as historical context rather than value-destroying forgery.

  4. Verdicts I should give up

  To achieve perfect equilibrium, you should give up the brief dip in Case 6. If the chef's hand (Case 5) matters not at all once the experience is identical, the songwriter's identity should logically matter not at all once the recording is identical. The transient feeling is likely residual cultural conditioning rather than a coherent value judgment. Keeping it requires adding a clause about "attributional inertia," which complicates the principle without adding explanatory power. Simpler to align Case 6 with Case 5: if the experience is indistinguishable, the provenance is irrelevant for experiential arts.

  5. A test case of your own

  **Test Case:** A handwritten letter from a famous historical figure versus a perfect typewritten transcript.
  **Verdict:** As information (reading the content), the transcript suffices (Case 4 logic). As an artifact (owning a piece of history), the handwritten original commands a premium (Case 1 logic). If you are buying it to read, provenance is irrelevant. If you are buying it to collect, provenance is constitutive. This tests whether you can separate the informational value from the historical-relic value in a single object type.
