  In a workshop, a pane of pre-stressed safety glass sits on a workbench, universally agreed to be fragile in virtue of its high internal tension. A hammer strikes the pane (stimulus), but the hammer is equipped with a sensor that emits a stress-relieving field upon contact, instantly neutralizing the internal tension before any crack can propagate, so the glass does not shatter (manifestation fails). If we specify the manifestation coarsely as "shattering," the glass retains its intrinsic nature as safety glass and the field acts as an extrinsic blocker, suggesting a mask; but if we specify the manifestation finely as "releasing stored tensile energy via fracture," the stimulus itself triggers the loss of that very tension (the intrinsic basis), making the mechanism look like a fink that removes the disposition mid-strike.

  **Analysis of the Distinction**
  Standardly, a **mask** is an extrinsic factor that prevents the manifestation while the intrinsic basis of the disposition remains intact; a **fink** is a mechanism triggered by the stimulus that removes the intrinsic basis before the manifestation can occur. In this case, the divergence hinges entirely on the granularity of the manifestation. Under the coarse reading ("shattering"), the basis is the glass's structural type, which remains intact while the extrinsic hammer-field blocks the break—classic masking. Under the fine reading ("releasing tension"), the basis *is* the tension itself; since the field removes the tension, the basis is lost upon stimulus—classic finkishness. The granularity flip works by tying the manifestation constitutively to the basis in the fine reading, such that preventing the manifestation necessitates destroying the basis.

  **Lewis's Revised Conditional Analysis (RCA)**
  Lewis's RCA states that $x$ is disposed to $M$ when $S$ iff $x$ has an intrinsic basis $B$ such that if $S$ were to occur and $x$ were to retain $B$, then $M$ would occur.
  *   **Fine Reading (Fink):** The basis (tension) is lost in the actual scenario. RCA evaluates the counterfactual where $S$ occurs and the basis is *retained* (i.e., the field fails to neutralize). In that world, the tension releases. Verdict: **The glass is disposed.** (RCA successfully tolerates the fink).
  *   **Coarse Reading (Mask):** The basis (glass type) is retained in the actual scenario. RCA evaluates the counterfactual where $S$ occurs and the basis is retained. In this world, the extr hammer-field still operates (as it is extrinsic to the glass), so shattering still fails. Verdict: **The glass is not disposed.** (RCA fails to tolerate the mask).
  Thus, the same physical case yields opposite RCA verdicts depending on how finely we carve the manifestation.

  **Plain Conditional Analysis (PCA) Resistance**
  A defender of the Plain Conditional Analysis ($D \iff S \rightarrow M$) would reject the intuition that the disposition existed beforehand. They would argue: "You claim it was fragile, but it didn't break when struck. Therefore, it wasn't fragile. Your attribution of a pre-existing disposition is a mistake based on ignorance of the hammer's capabilities." They resist the case by denying the pre-stimulus disposition rather than accommodating the interference.

  **Honest View**
  This case suggests the fink/mask distinction is not a sharp ontological difference but an artifact of how we individuate manifestations and bases. The "fink" reading only works because we defined the manifestation so finely that it *includes* the basis's existence; the "mask" works because we defined the manifestation loosely enough to separate it from the basis's destruction. If we remove the granularity flip and fix the manifestation as "shattering," the case becomes a standard **fink** (since the tension basis is lost), distinct from bubble-wrapped glass (where the tension basis remains and is merely cushioned). However, because we can always redescribe the basis to save the disposition (e.g., "the disposition to be tensioned glass" vs. "the disposition to break"), the distinction remains vulnerable to descriptive manipulation rather than reflecting a hard boundary in the causal structure of the world.
