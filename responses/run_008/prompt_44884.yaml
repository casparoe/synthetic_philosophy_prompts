      *   *Epistemology:* Montaigne is skeptical of book-learning (Ancients) but trusts the "simple" witness (the houseguest, later the cannibals themselves). Why? Because the houseguest is a "plain fellow" (uneducated, honest) vs. the learned liars of history.

