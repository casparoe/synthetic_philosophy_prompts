answer: |-
  This is an excellent set of questions. You have correctly identified that the opening of "Of Cannibals" is not merely throat-clearing but a carefully constructed epistemological prologue. Montaigne is not just introducing a topic; he is calibrating the reader's judgment before presenting the evidence. If you treat the opening as "epistemological hygiene"—a cleaning of the lens through which we view the New World—the digressions cease to be trivia and become essential proof of why European judgment is currently clouded.

  Here is a breakdown of how the opening functions, addressing your four questions for your seminar preparation.

  ### 1. The Framing Anecdote: Pyrrhus and the Definition of Barbarism

  **Who and Why:** King Pyrrhus of Epirus (319–272 BCE) was a Hellenistic general who fought the Romans. The Greeks used the term *barbaros* (barbarian) originally as onomatopoeia for non-Greek speakers (those who said "bar-bar"), but it carried the connotation of being uncivilized, disordered, or savage.

  **Argumentative Function:** The anecdote serves as a **definition of terms**. Montaigne is arguing that "barbarism" is not an intrinsic quality of a people, but a failure of perception on the part of the observer.
  *   **Textual Support:** Montaigne writes that Pyrrhus saw the Roman army's order and concluded it "has nothing of barbarism in it." He follows this immediately with the moral: "By which it appears how cautious men ought to be of taking things upon trust from vulgar opinion, and that we are to judge by the eye of reason, and not from common report."
  *   **Mapping to the Subject:** This maps directly onto the Tupinambá. Europe calls them "barbarians" based on "common report" (they eat people). Montaigne invites us to use the "eye of reason" (examine their actual social order, as Pyrrhus did with the Romans). The anecdote establishes the essay's central method: **suspend the label, examine the evidence.** It prepares the reader to accept that the "cannibal" might be more "ordered" than the "Christian."

  ### 2. The Atlantis and Geography Digression

  This is the most difficult section, but it performs three crucial argumentative tasks. It is not ironic pedantry; it is a demonstration of the instability of Old World knowledge.

  **A. Undermining Ancient Authority:**
  Montaigne is writing during the Renaissance, a period obsessed with recovering Classical wisdom. By spending hundreds of words weighing the Atlantis story (from Plato/Solon) and the Carthaginian story (from pseudo-Aristotle) only to conclude they are uncertain, Montaigne demonstrates that **the Ancients did not know everything.**
  *   **Reconstruction:** If Europe's intellectual foundation (Plato, Aristotle) cannot agree on whether a massive continent existed in the Atlantic, why should we trust their moral or geographical frameworks to judge the *newly* discovered Brazil? The digression clears the deck of Classical authority.

  **B. The Mutability of the Earth:**
  Montaigne pivots from ancient texts to contemporary geography: the river Dordogne shifting banks and the sea burying his brother's estate in Medoc.
  *   **Textual Support:** He notes these changes happened "within living memory."
  *   **Argumentative Function:** This establishes that the physical world is unstable. If the map of Europe changes within a human lifetime, the "truth" of geography is not fixed. This supports the idea that the New World is genuinely *new*, not just a rediscovery of Atlantis. It resists the European impulse to assimilate the unknown into the known. He is arguing that the New World must be judged on its own terms, not forced into old myths.

  **C. The Limit of Human Knowledge:**
  The digression acts as a negative example. Scholars have argued about Atlantis for centuries with no resolution. Montaigne is showing us what happens when we try to know things through books and speculation: we get nowhere. This creates a vacuum that only **direct testimony** can fill.

  ### 3. "Eyes Bigger Than Bellies": Self-Mockery and Colonial Critique

  The complaint that "we have more curiosity than capacity; for we grasp at all, but catch nothing but wind" is the pivot point between the Pyrrhus anecdote and the Atlantis digression.

  **Relation to the Digression:**
  This line is a confession. Montaigne includes *himself* in the critique. By launching into a speculation about Atlantis immediately after saying we "catch nothing but wind," he is performing the very error he describes.
  *   **Self-Mockery:** He is acknowledging that even he, the skeptic, is tempted to fill the void of the New World with old stories (Atlantis). It signals to the reader: "I am about to speculate, but I know it is speculative."
  *   **Colonial Appetite:** In the context of the 16th century, "grasping at all" is a potent metaphor for colonization. Europe wanted to consume the world (resources, land, knowledge) without having the "capacity" (moral or intellectual understanding) to hold it.
  *   **Function:** It lowers the stakes. Montaigne is telling the reader not to expect a definitive scientific treatise on Brazil. He is offering a moral reflection, not a conquest of knowledge. It protects him from the charge of pedantry later; he has already admitted that human understanding is limited.

  ### 4. Epistemic Standing: Skepticism vs. The Houseguest

  This is the crux of your seminar question. If Montaigne distrusts Plato, Aristotle, and "common report," why does he trust his houseguest's account of the Tupinambá?

  **The Distinction in Witnesses:**
  Montaigne distinguishes between two types of testimony: **Learned Speculation** vs. **Simple Observation.**
  *   **The Distrusted Sources (Atlantis/Ancients):** These rely on books, hearsay, and theoretical fitting. They try to make the new fit the old. They are "grasping at wind."
  *   **The Trusted Source (The Houseguest):** Later in the essay (immediately following the opening you cited), Montaigne describes this man. In Cotton's translation, he notes the man was a "plain, blunt fellow."
  *   **Reconstruction:** Montaigne's skepticism is not nihilism; it is a tool to filter out bias. He distrusts the *educated* witness because they lie to make themselves look learned or to fit a theory. He trusts the *uneducated* witness because they lack the vocabulary to embellish.
  *   **Coherence:** The opening skepticism coheres with the later trust because the criteria for truth have shifted from **Authority** to **Experience.**
      *   *Pyrrhus:* Trust the eye, not the label.
      *   *Atlantis:* Distrust the book, because the earth changes.
      *   *Houseguest:* Trust the man who was *there* and has no reason to lie.

  Montaigne signals the epistemic standing of his source by contrasting him with the sources in the digression. The Atlantis story is ancient, textual, and disputed. The Brazil story is contemporary, oral, and singular. Montaigne is arguing that in a world where land shifts and ancient texts are uncertain, the only stable ground is the unmediated report of a plain man.

  ### Seminar Strategy: The "Funnel" Argument

  For your discussion, I suggest framing the opening as a **funnel** that narrows the reader's focus:

  1.  **Broad Skepticism (Pyrrhus):** Don't trust names/labels ("Barbarian").
  2.  **Human Limitation (Eyes/Bellies):** Don't trust your own capacity to understand everything.
  3.  **Historical Instability (Atlantis/Sands):** Don't trust ancient texts or fixed maps; the world changes.
  4.  **The Narrow Aperture (The Houseguest):** Therefore, the *only* thing we can trust is the specific, unvarnished observation of a single, honest witness.

  **Discussion Question for the Group:**
  "Montaigne spends the first quarter of the essay proving that we cannot know the past (Atlantis) or trust our labels (Barbarians). Does this make his reliance on the houseguest's testimony about the Tupinambá more credible, or does it undermine the possibility of *any* cross-cultural understanding? Is Montaigne saying we can know the cannibals, or simply that we can know them *better* than we know the Ancients?"

  **Where to be careful (Text vs. Reconstruction):**
  *   *Text:* Montaigne explicitly says we should "judge by the eye of reason" and notes the geographical changes in Medoc.
  *   *Reconstruction:* Montaigne does not explicitly state "I trust my servant because he is uneducated." You must infer this from his description of the servant as "plain" and his general skepticism of "pedants" throughout the *Essays*. Be prepared to defend this inference by pointing to his critique of "book learning" in the Atlantis section.

  By treating the opening as a dismantling of European epistemic arrogance, you can show that the "delay" is actually the main point: we cannot understand the cannibals until we have admitted how little we understand ourselves.
