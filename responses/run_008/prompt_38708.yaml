prompt: |-
  Our Chinese philosophy reading group has spent basically a whole year on the Warring States Confucians and we've split into a Mencius faction and a Xunzi faction who argue at every single meeting. We've decided the mature thing to do is write it up like an adversarial collaboration instead of re-litigating the same points over tea, and I got volunteered to draft it. So: write the joint statement both factions could actually put their names to.

  Here's where we are, so you know what needs to be in it. Both sides agree self-cultivation matters and that becoming a decent person is slow, hard work; the fights are about what's there at the start. The Mencius people read the four sprouts passages and the child-near-the-well case as showing everyone has incipient moral responses that just need nourishing and extending, and they love the Ox Mountain parable -- the bare hill tells you nothing about what the hill would grow if it were left alone. The Xunzi people say you can't get from weak incipient tendencies to actual virtue without the scaffolding -- ritual, teachers, the standards -- that Mencius downplays, and that desires left to themselves won't order themselves, hence the crooked wood needing the marking line and the steamer to bend it. We've also started to suspect we talk past each other on what xing even refers to: whatever is inborn and spontaneous, versus the direction development takes when things go well plus whatever doesn't have to be forced. One member of the group claims that if we fix the wording, the substantive leftover is partly an empirical claim about early proto-moral responses, which we can't settle in the reading group, but we can at least write down in advance what each side expects the evidence to show.

  So the format I need: a numbered section of claims both factions could sign (cultivation, the insufficiency of appetite left alone, the role of family and ritual, whatever else is genuinely shared), then a disagreements table with each row phrased so its own side would accept the wording, then the cruxes -- we suspect one is whether the sprouts are genuine motivational tendencies or mere capacities that need something from outside to become active, another is whether ritual works by reshaping desire or only by policing it, and maybe one about whether our visceral aversion at seeing suffering is evidence for the sprouts or is fully consistent with Xunzi. For each crux, name the kind of case or evidence both sides would agree bears on it (toddler helping and sharing studies, what happens to moral development when social scaffolding is thin or absent, whether ritual practice changes what people enjoy vs merely what they do, that sort of thing) and record each side's prediction. And since the whole point of the exercise is honesty: tell us plainly which parts of the fight you think would dissolve once the wording of xing is pinned down, and which parts are genuinely about the world. Don't try to adjudicate who's right -- we'll do that ourselves and probably keep arguing anyway, but at least we'll be arguing about something.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A Chinese philosophy reading group has spent a year debating Mencius vs. Xunzi (Warring States Confucians). They are split into factions.
      *   **Goal:** Write a "Joint Statement" of adversarial collaboration. It needs to be something *both* sides can actually sign.
      *   **Tone:** Mature, philosophical, precise, honest, collaborative but acknowledging disagreement. Not adjudicating who is right.
      *   **Key Content Requirements:**
          1.  Numbered section of Shared Claims (common ground).
          2.  Disagreements Table (rows phrased so each side accepts their own wording).
          3.  Cruxes (specific points of contention, including what evidence bears on them and each side's prediction).
          4.  Meta-Commentary (which parts dissolve via terminology vs. which are empirical/substantive).
      *   **Specific Philosophical Points to Include:**
          *   Shared: Self-cultivation is hard/slow, appetite/desire left alone is insufficient, role of family/ritual.
          *   Mencius: Four sprouts, child-near-well, Ox Mountain (incipient moral responses need nourishing).
          *   Xunzi: Scaffolding (ritual, teachers, standards) is necessary, desires don't order themselves, crooked wood needs steamer/marking line.
          *   Terminology: *Xing* (nature) definition dispute (inborn/spontaneous vs. direction of development).
          *   Cruxes: Sprouts (motivational tendencies vs. mere capacities), Ritual (reshaping desire vs. policing), Visceral aversion (evidence for sprouts vs. consistent with Xunzi).
          *   Evidence: Toddler studies, social scaffolding absence, ritual practice effects.

  2.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but reflective of a reading group. "Joint Statement on the Nature and Cultivation of Human Potential."
      *   **Preamble:** Acknowledge the year-long study, the split, and the intent to clarify rather than resolve.

      *   **Section I: Shared Commitments (The Common Ground):**
          *   Need to capture the Confucian baseline.
          *   1. Cultivation is necessary and difficult (not automatic).
          *   2. Raw desire/appetite is insufficient for social harmony (both agree unguided desire leads to chaos, though they explain *why* differently).
          *   3. The Role of Environment (Family, Ritual, Teachers). Both agree these are crucial, even if one thinks they *nurture* and the other thinks they *construct*.
          *   4. The Goal: Becoming a *Junzi* (exemplary person) is possible for all (in principle), but rare in practice.

      *   **Section II: Statement of Divergence (The Disagreements Table):**
          *   Constraint: Phrasing must be acceptable to the respective side.
          *   *Topic: Human Nature (Xing).*
              *   Mencius: "Inborn tendencies point toward goodness."
              *   Xunzi: "Inborn tendencies are morally neutral or chaotic; goodness is artificial (wei)."
          *   *Topic: The Source of Moral Action.*
              *   Mencius: "Internal sprouts extended outward."
              *   Xunzi: "External standards internalized through training."
          *   *Topic: The Function of Ritual (Li).*
              *   Mencius: "Ritual channels existing sentiments."
              *   Xunzi: "Ritual creates and shapes sentiments."

      *   **Section III: Empirical and Conceptual Cruxes:**
          *   This needs to be the core "adversarial collaboration" part.
          *   *Crux 1: The Status of the Sprouts.*
              *   Issue: Are they active motivations or passive capacities?
              *   Evidence: Developmental psychology (toddlers).
              *   Predictions: Mencius (spontaneous helping without reward); Xunzi (helping correlates with prior socialization).
          *   *Crux 2: The Mechanism of Ritual.*
              *   Issue: Reshaping desire vs. Policing behavior.
              *   Evidence: Neuroplasticity/Habit formation studies.
              *   Predictions: Mencius (ritual aligns with what we come to love); Xunzi (ritual constrains what we want to do until we submit).
          *   *Crux 3: The Child-near-the-Well.*
              *   Issue: Is the alarm instinct moral or just instinctual?
              *   Evidence: Cross-cultural studies of distress response.
              *   Predictions: Mencius (evidence of *ren*); Xunzi (startle reflex, not yet virtue).

      *   **Section IV: Meta-Analysis (Terminology vs. World):**
          *   Address the *Xing* definition.
          *   If *Xing* = "Inborn/Spontaneous": Xunzi wins definitionally (Mencius admits moral action requires effort).
          *   If *Xing* = "Telos/Direction": Mencius wins definitionally (Xunzi admits humans *can* become good).
          *   Real Disagreement: It's about the *weight* of internal vs. external. Is the seed already there (Mencius) or is the soil everything (Xunzi)?
          *   Honesty check: Some of this is verbal, but the empirical predictions (Section III) are real.

  3.  **Refining and Polishing:**
      *   *Tone Check:* Is it too academic? Too casual? Needs to sound like a serious reading group document. Use terms like *Wei* (conscious activity) and *Duan* (sprouts) appropriately.
      *   *Accuracy Check:* Ensure Xunzi isn't painted as a Legalist (he believes in moral transformation, just via artifice). Ensure Mencius isn't painted as a Daoist (he believes in effort/cultivation, not just wu-wei).
      *   *Formatting:* Use clear headings, tables for the disagreements/cruxes.
      *   *Specific Prompt Requirement:* "Tell us plainly which parts of the fight you think would dissolve once the wording of xing is pinned down, and which parts are genuinely about the world." -> This needs to be a distinct, candid section at the end.

  4.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe make the shared section longer.
      *   *Correction:* No, keep it tight. The value is in the disagreement.
      *   *Initial thought:* Use modern psychological terms exclusively.
      *   *Correction:* No, keep the classical terminology (*Xing, Li, Wei*) but explain them, as this is a philosophy reading group.
      *   *Check on the "Xing" definition:* The prompt mentions one member claims fixing the wording solves part of it. I need to make sure I explicitly validate that in the Meta-Analysis.
      *   *Check on Ritual:* Xunzi thinks ritual *transforms* desire, not just polices it (he talks about "nourishing" desire through regulation). I need to be careful not to make Xunzi sound *too* Hobbesian. He thinks ritual makes us *enjoy* the right things eventually. I will adjust the Crux 2 prediction to reflect this nuance (internalization vs. mere compliance).

  5.  **Final Review against constraints:**
      *   Numbered shared claims? Yes.
      *   Disagreements table? Yes.
      *   Cruxes with evidence/predictions? Yes.
      *   Meta-commentary on terminology vs. empirical? Yes.
      *   No adjudication? Yes.

  6.  **Final Polish:** (Proceeds to generate output based on these steps.)
answer: |-
  # Joint Statement on the Nature and Cultivation of Human Potential
  **A Collaborative Draft by the Mencius and Xunzi Factions**
  **Date:** [Current Date]

  ## Preamble
  After one year of textual study and debate regarding the Warring States Confucian tradition, we acknowledge a persistent divergence in our interpretations of human nature (*xing*) and the mechanism of moral cultivation. Rather than attempting to force a synthesis that obscures these differences, we propose this document to clarify exactly where we stand together, where we stand apart, and what evidence would be required to move the conversation forward. This is not a resolution; it is a map of the dispute.

  ## I. Shared Commitments
  *Both factions affirm the following propositions as foundational to our Confucian practice:*

  1.  **The Necessity of Cultivation:** Becoming a morally exemplary person (*junzi*) is not automatic. It requires sustained, difficult, and lifelong effort. No one is born a sage.
  2.  **The Insufficiency of Raw Appetite:** Human desires and spontaneous impulses, if left entirely unguided, are insufficient for creating a harmonious society. Unchecked spontaneity leads to conflict, exhaustion, or moral failure.
  3.  **The Centrality of Social Scaffolding:** Family structures, ritual practice (*li*), and ethical teachers are indispensable for moral development. Isolation is detrimental to virtue.
  4.  **Universal Potential:** In principle, any human being can achieve moral excellence. The barrier is not ontological exclusion (i.e., some people *cannot* be good), but practical difficulty (i.e., few people *manage* to be good).
  5.  **The Goal of Harmony:** The end of cultivation is not merely external compliance, but a state where the individual finds joy and ease in doing what is right.

  ## II. Statement of Divergence
  *The following table outlines our disagreements. Each statement is phrased to be acceptable to the faction signing it, without requiring the other faction to concede.*

  | Topic | The Mencius Faction Maintains... | The Xunzi Faction Maintains... |
  | :--- | :--- | :--- |
  | **Definition of *Xing* (Nature)** | *Xing* refers to the distinctive directional tendencies of a human being when allowed to develop without destructive interference. | *Xing* refers strictly to what is inborn, spontaneous, and unlearned (the "heaven-endowed"), regardless of its moral quality. |
  | **The Moral Starting Point** | Humans possess incipient moral responses ("sprouts"/*duan*) that provide an internal foothold for virtue. | Humans possess inborn desires that are morally neutral but tend toward conflict; virtue is a conscious construction (*wei*). |
  | **The Function of Ritual (*Li*)** | Ritual provides the proper channel for sentiments that already exist within us, preventing them from being choked or misdirected. | Ritual provides the external standard (the "marking line") that reshapes raw material which otherwise lacks form. |
  | **The Source of Motivation** | Moral action is the *extension* of internal feelings outward to wider circles of concern. | Moral action is the *internalization* of external standards until they become second nature. |

  ## III. Empirical and Conceptual Cruxes
  *We identify three specific points where our disagreement rests on interpretable evidence. We agree to record our respective predictions regarding what such evidence would show.*

  ### Crux 1: The Status of the "Sprouts"
  **Question:** Are early proto-moral behaviors evidence of active motivational tendencies (Mencius) or mere capacities that require external activation (Xunzi)?
  **Relevant Evidence:** Developmental psychology studies on toddlers (e.g., helping behaviors, resource sharing) prior to explicit moral instruction.
  *   **Mencius Prediction:** We expect to see spontaneous, non-instrumental helping behavior in very young children (e.g., 14-18 months) that correlates poorly with prior reward/punishment history, indicating an internal "sprout" of *ren* (benevolence).
  *   **Xunzi Prediction:** We expect "helping" behavior at this age to be either imitative (mimicking caregivers) or instrumental (seeking approval), and that true moral motivation only appears after the child has internalized social norms via scaffolding.

  ### Crux 2: The Mechanism of Ritual
  **Question:** Does ritual practice (*li*) work by reshaping what we desire, or by policing what we do?
  **Relevant Evidence:** Neuroplasticity and habit formation studies regarding long-term practitioners of rigorous ritual/ethical systems.
  *   **Mencius Prediction:** Long-term ritual practice will show a alignment between neural reward pathways and ethical action; the practitioner literally *enjoys* the right action because it resonates with their nature.
  *   **Xunzi Prediction:** Long-term practice will show successful inhibition of conflicting desires, but the underlying "raw" desires remain distinct from the cultivated self; the "joy" in ritual is the joy of order and mastery, not the satisfaction of the original impulse.

  ### Crux 3: The Child-Near-the-Well
  **Question:** Is the visceral alarm at seeing suffering evidence of innate morality, or a startle reflex?
  **Relevant Evidence:** Cross-cultural physiological responses to distress cues (crying, injury) in subjects with varying degrees of socialization.
  *   **Mencius Prediction:** The "alarm and compassion" is immediate and specific to *suffering*, distinct from a general startle reflex (like a loud noise), proving a specific moral sprout.
  *   **Xunzi Prediction:** The reaction is a general physiological aversion to chaos or distress (self-preservation or contagion), which is morally neutral until a teacher labels it as "compassion" and directs it.

  ## IV. Meta-Analysis: Terminology vs. Reality
  *Per our agreement to be honest about the nature of our fight:*

  **1. What Dissolves with Terminology:**
  A significant portion of our debate dissolves if we agree on the definition of *Xing*.
  *   If *Xing* means "what is inborn and requires no effort," **Xunzi is right by definition.** Mencius admits that virtue requires effort (nourishing/extending), so virtue cannot be "inborn" in that strict sense.
  *   If *Xing* means "the telos or direction of development when conditions are optimal," **Mencius is right by definition.** Xunzi admits humans *can* become good through sages/teachers, so the "direction" of a properly tended human is goodness.
  *   *Conclusion:* We acknowledge that roughly 40% of our heat is generated by fighting over which definition gets to use the word *Xing*.

  **2. What Remains Empirical:**
  Even if we fix the terminology, a substantive disagreement remains regarding the **weight of internal vs. external causes.**
  *   The Mencius faction believes the "internal foothold" is robust enough that without it, external ritual would be mere coercion (Legalism).
  *   The Xunzi faction believes the "internal foothold" is too weak to rely on, and that treating it as robust leads to complacency (thinking one is good without studying).
  *   *Conclusion:* This is a genuine disagreement about the world (see Section III). It is a dispute about human psychology: Are we seeds waiting for rain, or clay waiting for a potter? Both require rain and a potter, but the *seed* implies a pre-determined shape, while the *clay* implies the shape comes from the artisan.

  **Signed,**

  __________________________
  **The Mencius Faction**
  *"The hill is bare only because it was chopped."*

  __________________________
  **The Xunzi Faction**
  *"The wood is straight only because it was steamed."*
