answer: |-
  **JOINT STATEMENT ON SIMPSON'S PARADOX AND THE INFERENCE OF EFFECTS**

  **Preamble**

  We, the undersigned representatives of the Causal Resolutionist and Statistical Formalist camps, having engaged in a structured adversarial collaboration, submit this joint statement. Our objective was not to secure a surrender of one position by the other, but to delineate precisely where our consensus lies, where our disagreements are substantive, and where they may be merely verbal. We acknowledge that while our mathematical tools often converge on the same practical recommendations, our explanations for *why* those recommendations hold differ in ways that matter for the foundations of statistical science.

  The following document summarises our findings regarding the nature of Simpson's reversal, the necessity of extra-statistical assumptions, and the ontology of those assumptions.

  ***

  ### 1. Agreed Claims

  We affirm the following propositions as common ground. These claims hold regardless of whether one adopts the vocabulary of causal graphs or the vocabulary of exchangeability and symmetry.

  1.  **Arithmetic Consistency:** The numerical reversal described in the prompt is a mathematical certainty given the provided frequencies. There is no error in calculation. The inequality $P(R|D, M) > P(R|\neg D, M)$ and $P(R|D, F) > P(R|\neg D, F)$ is perfectly consistent with $P(R|D) < P(R|\neg D)$. Probability theory is not violated; the phenomenon is a feature of weighted averages, not a bug in the calculus of probability.
  2.  **Insufficiency of Data Alone:** In both Scenario A (Sex) and Scenario B (Blood Pressure), the contingency table alone is insufficient to determine the correct course of action. No quantity computed solely from the observed frequencies can dictate whether to administer the drug without additional assumptions about the data-generating process.
  3.  **Scenario A Resolution (Pre-treatment Partition):** In Scenario A, where the partitioning variable (Sex) is determined prior to treatment and influences both treatment selection and recovery, both camps agree that the stratified estimates (within-sex comparisons) provide the appropriate guide for decision-making. The aggregated estimate is misleading for the purpose of predicting the effect of intervention.
  4.  **Scenario B Resolution (Post-treatment Partition):** In Scenario B, where the partitioning variable (Blood Pressure) is measured after treatment and is influenced by the drug, both camps agree that the aggregated estimate provides the appropriate guide for decision-making regarding the total effect of the drug. Conditioning on the post-treatment variable induces a selection bias that renders the stratified comparisons unrepresentative of the intervention's effect.
  5.  **Decision Reversal:** Consequently, despite the data tables being identical in both scenarios, the recommended decision flips. In Scenario A, the evidence supports administering the drug; in Scenario B, the evidence (specifically the aggregated data) suggests the drug is net less effective than the control. Both camps agree on this flip.
  6.  **No "Paradox" in Logic:** We agree that the term "paradox" is a misnomer if it implies a logical contradiction. It is, rather, a conflict between competing intuitions about which reference class is relevant. The resolution lies not in new mathematics, but in clarifying the assumptions that link the data to the question being asked.
  7.  **Mutual Validity of Methods:** Neither camp is entitled to claim that the other's mathematical machinery yields the *wrong number*. The disagreement is not about the computation of conditional probabilities, but about which conditional probability corresponds to the quantity of interest (e.g., the causal effect versus the associative effect).

  ***

  ### 2. Disagreements Table

  While we agree on the decisions in the specific scenarios above, we disagree on the general framework required to justify those decisions. The table below summarises the residual substantive and terminological disputes.

  | Issue | Causal Resolutionist Position | Statistical Formalist Position | What Turns on It |
  | :--- | :--- | :--- | :--- |
  | **1. The Ontology of Assumptions** | The extra assumptions required to resolve the reversal are inherently *causal*. They concern mechanisms, interventions, and counterfactuals that cannot be reduced to joint probability distributions over observables. | The extra assumptions are about *symmetry and exchangeability*. They concern whether units in one group are probabilistically similar to units in another, given certain covariates, without invoking causal metaphysics. | Whether causal inference is a distinct scientific discipline or a specialised application of probabilistic modelling. |
  | **2. The Source of the Error** | The paradox arises because analysts mistakenly interpret associative probabilities ($P(Y|X)$) as causal probabilities ($P(Y|do(X))$). The error is category confusion. | The paradox arises because analysts fail to identify the correct exchangeable reference class. The error is a failure of judgement regarding symmetry in the sampling process. | How we teach statistics: do we teach students to draw causal diagrams or to critique selection mechanisms? |
  | **3. Necessity of Causal Vocabulary** | Terms like "confounder," "mediator," and "collider" are indispensable. They encode assumptions that probability theory alone cannot express. Attempting to do without them leads to ambiguity. | Such terms are useful shorthand but are not fundamental. They can be translated into statements about conditional independence and temporal ordering without loss of rigour. | Whether formal statistical languages need to be expanded to include causal operators, or if existing probabilistic languages suffice. |

  ***

  ### 3. Cruxes and Tests for Resolution

  We have identified three specific cruxes where our disagreement is sharpest. For each, we propose a test case or argument that would bear on the dispute. We record our divergent predictions below.

  #### Crux 1: The Reducibility of Causal Assumptions
  **Question:** Can the assumption required to prefer the stratified estimate in Scenario A be fully expressed using only probabilistic statements about observables and time, without invoking counterfactuals or causal arrows?

  *   **Test:** Formulate the assumption "Sex is a confounder" strictly in terms of conditional independence relations among observed variables and temporal precedence, avoiding terms like "effect" or "cause."
  *   **Causal Resolutionist Prediction:** This will fail. You cannot distinguish a confounder from a collider using observables alone; you need an assumption about the *direction* of influence which is not contained in the probability distribution.
  *   **Statistical Formalist Prediction:** This will succeed. By specifying exchangeability conditional on pre-treatment variables and asserting no exchangeability conditional on post-treatment variables, the decision rule is fully determined without causal ontology.
  *   **Verbal Dispute Check:** If the Formalist's "exchangeability assumptions" turn out to be isomorphic to the Causalist's "structural assumptions," the dispute may be verbal. However, if the Causalist can demonstrate a case where the symmetry judgement fails without a causal justification, the dispute is substantive.

  #### Crux 2: The M-Bias Structure
  **Question:** Consider a third scenario where the partitioning variable is a pre-treatment variable that is influenced by two unmeasured common causes (one affecting treatment, one affecting outcome), forming an "M" structure. Standard causal theory says one should *not* adjust for this variable, despite it being pre-treatment.

  *   **Test:** Present this M-structure scenario to both camps. Ask whether one should stratify by the pre-treatment variable.
  *   **Causal Resolutionist Prediction:** We will correctly identify that adjusting introduces bias (opening a collider path). The rule is "do not adjust for colliders," regardless of temporal ordering.
  *   **Statistical Formalist Prediction:** We will argue that exchangeability holds conditional on the pre-treatment variable because it precedes the outcome. If we are wrong, it shows that temporal precedence is insufficient and causal structure is indeed required.
  *   **Significance:** If the Formalists concede that temporal precedence is insufficient and that "collider bias" requires causal language to detect, the Causal Resolutionists win the claim that causal vocabulary is necessary.

  #### Crux 3: The Nature of the "Sure-Thing Principle"
  **Question:** Does the intuition that "if a treatment is better for men and better for women, it must be better overall" (the Sure-Thing Principle) hold universally?

  *   **Test:** Apply the principle to Scenario B (Blood Pressure).
  *   **Causal Resolutionist Prediction:** The principle holds for causal effects, but not for associative probabilities. In Scenario B, the stratified associations do not represent causal effects, so the principle is not violated. This confirms that the paradox is about mistaking association for causation.
  *   **Statistical Formalist Prediction:** The principle is a heuristic that fails when the subgroups are not exchangeable with the total population under intervention. The failure is not about "causation" per se, but about the stability of probabilities under selection.
  *   **Significance:** This determines whether the resolution is framed as a correction of causal intuition (Causalist) or a refinement of probabilistic conditioning (Formalist).

  ***

  ### 4. Conclusion on the Verbal Dispute

  After extensive deliberation, we conclude that a portion of our disagreement is **verbal**, but it rests upon a **substantive** core.

  It is **verbal** insofar as the Statistical Formalists can, with sufficient effort, translate causal assumptions into complex statements about exchangeability and symmetry. If "causal structure" is defined simply as "a set of assumptions about conditional independence and temporal order sufficient to identify an effect," then the Formalists are correct that no new metaphysics is needed.

  However, it is **substantive** insofar as the Causal Resolutionists demonstrate that such translations are cumbersome, prone to error, and obscure the actual judgements being made. The causal vocabulary (arrows, confounders, mediators) acts as a necessary cognitive technology that prevents specific classes of errors (such as adjusting for mediators or colliders) which pure probabilistic language does not naturally flag.

  Therefore, while we agree that probability theory is not *violated* by Simpson's paradox, we disagree on whether probability theory *alone*, without the scaffolding of causal semantics, is sufficient for human analysts to reliably navigate it. We recommend that future pedagogy incorporate elements of both: the rigour of probabilistic exchangeability and the clarity of causal diagrammatics.

  **Signed,**

  *The Causal Resolutionist Working Group*
  *The Statistical Formalist Working Group*
