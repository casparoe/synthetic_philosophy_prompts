answer: |-
  ### Design of the Experiment: Mapping the Logical Space

  Before we lay out the tape, let's look at the loom. You've hit on a structural issue that keeps graduate seminars awake at night. If we treat justification as a binary (Justified/Unjustified), getting three distinct verdicts on a *single* assertion is logically impossible given the standard definitions of these views.

  Here is the subset problem:
  1.  **Anti-Reductionism (AR)** is the most permissive. It grants justification unless a defeater is present.
  2.  **Local Reductionism (LR)** is a subset of AR. It grants justification *unless* a defeater is present *OR* the claim is independently checkable (in which case it behaves like Reductionism).
  3.  **Global Reductionism (GR)** is the strictest subset. It grants justification *only* if positive inductive evidence is present.

  If AR says "Unjustified" (due to a defeater), LR and GR must also say "Unjustified." If GR says "Justified" (evidence present), LR and AR must also say "Justified." You cannot get a Yes/No/Yes split on one proposition.

  **The Solution:** To distinguish all three, we need a **Two-Assertion Matrix**. We need one assertion that triggers the "Checkability" clause (splitting AR from LR/GR) and one that triggers the "Inductive Evidence" clause (splitting LR/AR from GR).

  *   **Assertion 1 (Checkable, No Evidence):** AR says *Yes*; LR & GR say *No*.
  *   **Assertion 2 (Uncheckable, No Evidence):** AR & LR say *Yes*; GR says *No*.

  **The Profile:**
  *   **GR:** (No, No)
  *   **LR:** (No, Yes)
  *   **AR:** (Yes, Yes)

  This matrix uniquely fingerprints each theory. Now, let's build the apparatus.

  ***

  ### The Scenario: The Heritage Home Open House

  **Context:** You are a potential homebuyer viewing a heritage property built in 1920. You are at a public open house. You have never met the current owner (the Speaker), nor have you done any due diligence yet (no title search, no home inspection). The Speaker is milling about, appearing sincere and knowledgeable.

  **The Assertions:**
  1.  **Assertion A (Checkable):** "The main electrical panel was upgraded to 200 amps in 2018."
      *   *Epistemic Status:* This is physically inspectable. You could open the panel box or request municipal permits during the due diligence period. It is a claim about the current physical state of the world.
  2.  **Assertion B (Uncheckable):** "The original architect was a student of Frank Lloyd Wright."
      *   *Epistemic Status:* This is a historical claim. The original blueprints are lost. Municipal records from 1920 are incomplete. Unless you hire a specialized architectural historian (costly/rare), testimony is your *only* accessible source.

  **Constraints:**
  *   You have **zero prior inductive evidence** regarding the Speaker's reliability (you don't know if they are the owner, a neighbor, or a squatter, though they act like the owner).
  *   There are **no active defeaters** (the Speaker is not sweating, stuttering, or contradicting themselves).
  *   The Speaker is **sincere and correct** (for the sake of the justification test).

  ***

  ### Walkthrough of Verdicts

  #### Assertion A: "The panel was upgraded in 2018." (Checkable Domain)

  *   **Global Reductionism (GR): Unjustified.**
      *   *Reasoning:* You lack positive inductive evidence. You don't know this person's track record for truth-telling, nor do you have independent verification of the electrical panel. The mere fact that they spoke is not evidence of reliability without a prior inductive base linking speech to truth in this context.
  *   **Local Reductionism (LR): Unjustified.**
      *   *Reasoning:* Per your definition, LR grants default entitlement *only* "within domains where testimony is basically our only possible source." Electrical specifications are checkable ("where we could in principle check for ourselves"). Therefore, the default entitlement is switched off. Since you have no positive reasons (evidence of reliability), you are not justified.
  *   **Anti-Reductionism (AR): Justified.**
      *   *Reasoning:* AR posits a general prima facie entitlement. The domain (home repair) does not matter. Unless there is a specific defeater (e.g., you see them lying about something else), the burden of proof is on the skeptic. You are entitled to trust the assertion until proven otherwise.

  #### Assertion B: "The architect was a Wright student." (Uncheckable Domain)

  *   **Global Reductionism (GR): Unjustified.**
      *   *Reasoning:* Unchanged. You still lack positive inductive evidence of the Speaker's reliability. The difficulty of checking the fact doesn't generate evidence of the Speaker's truthfulness.
  *   **Local Reductionism (LR): Justified.**
      *   *Reasoning:* This falls squarely into the "only possible source" clause. You cannot verify this without disproportionate effort (hiring a historian). Therefore, the default entitlement activates. In the absence of defeaters, you are justified in accepting the testimony.
  *   **Anti-Reductionism (AR): Justified.**
      *   *Reasoning:* Unchanged from Assertion A. The general default entitlement applies regardless of checkability.

  ***

  ### Feature Analysis: What Does the Work?

  The divergent verdicts turn entirely on the **Checkability Condition**.

  *   **Between AR and LR:** The split is driven by whether the *possibility* of independent verification negates the *default* right to trust. AR says verification possibility is irrelevant to the initial entitlement. LR says verification possibility shifts the burden of proof back to the hearer.
  *   **Between LR and GR:** The split is driven by the **Necessity of Testimony**. GR demands evidence regardless of necessity. LR treats necessity (uncheckability) as a sufficient condition for default trust.

  **Counterfactual: Removing the Feature**
  If we remove the checkability distinction (e.g., we make *both* claims historical, or *both* claims about the electrical panel):
  *   If **both are checkable**: LR collapses into GR (both say No). AR stands alone (Yes). You lose the ability to distinguish LR from GR.
  *   If **both are uncheckable**: LR collapses into AR (both say Yes). GR stands alone (No). You lose the ability to distinguish LR from AR.

  The *contrast* between the two assertions within the same conversational context is required to isolate Local Reductionism.

  ***

  ### Best Attack: The Anti-Reductionist Critique

  If I were defending Anti-Reductionism (e.g., channeling Tyler Burge or Richard Moran), here is my attack on this case:

  > "This scenario relies on an artificial distinction between 'checkable' and 'uncheckable' that doesn't track the normative reality of communication. When a speaker asserts *anything* to me in a conversational context, they are presenting themselves as a rational agent offering a reason for belief. To say I am justified in believing the historical claim (B) but not the electrical claim (A) implies that the *speaker's assurance* changes its normative force based on my ability to go behind their back and check.
  >
  > But the speaker's assurance is the same in both cases! If I trust them on the history, I am accepting their *word*. If I withhold trust on the electrical panel solely because I *could* check it, I am not treating them as a person, but as a data terminal. The 'checkability' clause makes justification dependent on the hearer's logistical capabilities rather than the interpersonal transaction. It turns testimony into a fallback option rather than a primary source of knowledge."

  **The Force of the Attack:** It argues that LR is unstable. It tries to sit between GR and AR, but it ends up making justification dependent on the *hearer's resources* (do I have a multimeter? do I have a historian's budget?) rather than the *speaker's presentation*.

  ***

  ### Addressing Your Hunch: Do LR and AR Collapse?

  You asked: *"My hunch is that once you allow defeaters on both sides, local reductionism and a moderate anti-reductionism get squeezed so close together that no everyday case can split them."*

  **Verdict:** You are **half-right**, but the "Checkability" clause is the wedge that keeps them apart *in principle*, even if they converge *in practice*.

  **Where you are right (The Squeeze):**
  In everyday life, "checkability" is rarely binary. Consider Assertion A (Electrical Panel). Is it *really* checkable? You'd need an electrician. Is that "in principle" checkable? Yes. Is it "practically" checkable during a 30-minute open house? No.
  *   A **Moderate AR** theorist might say: "Default trust applies, but is easily defeated by the stakes (buying a house)."
  *   A **Sensitive LR** theorist might say: "Given the stakes and the cost of checking, this counts as 'effectively uncheckable,' so default trust applies."
  In high-stakes, ordinary contexts, both views often migrate toward "Trust, but verify if the stakes are high." This makes their *verdicts* look identical.

  **Where you are wrong (The Divergence):**
  The divergence remains sharp in **low-stakes, high-checkability** scenarios.
  *   *Scenario:* A stranger on the street says, "It's raining around the corner."
  *   *AR:* Justified. (Default entitlement).
  *   *LR:* Unjustified. (You can walk 10 feet and check; testimony is not the "only possible source").
  *   *GR:* Unjustified. (No inductive base).

  Here, LR and AR do *not* collapse. LR denies justification because the world is accessible; AR grants it because the speaker is accessible.

  **The Geophysicist's Take:**
  Think of it like error bars. AR says the measurement is valid until the instrument fails. GR says the measurement is invalid until you calibrate the instrument yourself. LR says the measurement is valid *unless* you have a better instrument in your pocket, in which case you must use it.
  Your hunch holds for "expensive calibration" (historical claims, complex geology), where LR and AR agree trust is necessary. But for "quick calibration" (is it raining, is the light on), LR demands you check, while AR lets you trust. That is the remaining sliver of daylight between them.
