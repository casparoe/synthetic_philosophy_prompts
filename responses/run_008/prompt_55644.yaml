prompt: |-
  You're a decision theory prof who's also designed a lot of classroom games, so please lean into both. I need a runnable activity for my upper-level seminar on rational choice — 16 students, 90 minutes, one room, no real money allowed.

  The idea I want them to feel in their bones is expected value fanaticism: the position that you should always go with the option with the highest expected value, even when the probability is absurdly small and the payoff absurdly large. I don't want them to just define it and list standard objections — I want them to get逐步 lured into actually endorsing it, and then find out what it commits them to.

  Here's the setup I've been toying with, feel free to improve it: the class plays the grants committee of a (fictional) philanthropic foundation with a budget of, say, 1000 utiles that get paid out via some physical mechanism — d100 rolls, lookup tables, whatever you think works. Round 1, they allocate between a handful of boring interventions with ordinary probabilities and payoffs, and EV-maximization feels obviously right, no controversy. Then round 2 introduces a lottery with an unbounded or undefined expected value (some St. Petersburg-flavored thing — maybe with a twist so it's not just the textbook version). Round 3 is the part I care most about: I want a subset of students to get secret role cards as outside petitioners trying to convince the committee to fund them, and I want the rules to let them escalate their claimed payoff whenever their probability is questioned — so the committee discovers that pure EV reasoning forces them to hand the whole budget to whoever lies most brazenly. Maybe the petitioners should also get some incentive structure so they're actually motivated to game the committee rather than play nice.

  Please start by brainstorming a couple of different possible structures before committing to one — tell me briefly what you considered and why you picked the design you picked. Then give me: full rules, materials, the actual payoff scheme and how the randomness is resolved physically, role cards, a minute-by-minute timeline, and a debrief that maps specific moments in the game onto the philosophical distinction between fanatical and non-fanatical decision theories (they should NOT have heard the term "fanaticism" before the debrief). Also include: what will predictably go wrong the first time I run this and how to handle it, and an honest note on which feature of actual EV fanaticism the activity simply cannot reproduce and I'll have to supply in the debrief myself.

  One thing — keep the math doable by hand in a few minutes, these are sharp students but I don't want the session eaten by arithmetic. Think carefully about edge cases in your rules, especally around the escalation mechanic, and patch them preemptively.
