  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Philosophy PhD, writing on statutory interpretation.
      *   **Task:** Presenting at a law school faculty workshop in two weeks.
      *   **Thesis:** Textualism vs. Purposivism is a choice of default convention (coordination equilibrium), not a metaphysical truth about meaning/intent. Textualism is slightly favored on institutional design grounds (predictability compounds, purposivist gains get capitalized away).
      *   **Audience:** Law faculty, skews textualist. Specific archetypes: Two former Easterbrook clerks (hardcore textualists), Empiricist (congressional drafting), Legal Historian (Hart & Sacks/Legal Process), CLS scholar (legitimacy critique). Respondent: Admin Law expert.
      *   **Constraint:** 30 min Q&A. Needs lawyer-speak, not philosopher-speak. Needs hard truths about soft spots. Needs clarification on "settled" vs. "contested" literature.
      *   **Goal:** A prep sheet with objections, replies, concessions, and soft spots.

  2.  **Deconstruct the Thesis & Identify Vulnerabilities:**
      *   *Core Claim:* It's a convention choice, not truth-apt.
      *   *Vulnerability 1 (Textualists):* If it's just a convention, why not pick the one that best matches the democratic mandate (intent)? They believe textualism *is* the best proxy for intent/legitimacy, not just a coordination game.
      *   *Vulnerability 2 (Empiricist):* "Legislatures are plural agents" is the weak empirical link. Staffers *do* have shared understandings.
      *   *Vulnerability 3 (Legal Process/Historian):* Hart & Sacks already did the "purpose" thing. You're reinventing the wheel but stripping out the moral reasoning.
      *   *Vulnerability 4 (CLS):* "Coordination" assumes the state is legitimate. It's not.
      *   *Vulnerability 5 (Admin Law/Respondent):* Chevron deference (or its ghost). If courts pick conventions, what role does the Agency play?
      *   *Vulnerability 6 (The "Capitalization" Point):* Do purposivist gains *actually* get capitalized away? Or does drafting around textualism just make statutes unreadable?

  3.  **Address the "Settled vs. Contested" Request:**
      *   *History:* Purposivism (Hart & Sacks) *was* mid-century orthodoxy. Textualism (Scalia/Easterbrook) *was* the 80s insurgence. *However*, the narrative that purposivism was "anything goes" is a textualist caricature. Hart & Sacks were structured.
      *   *Current State:* Textualism is dominant but fracturing (New Textualism vs. Old). Purposivism is retrenched but alive in admin law and dissent.
      *   *User's Risk:* Treating "legislative intent is fiction" as settled. Many legal scholars (especially intentionalists) fight hard on this.

  4.  **Drafting the Prep Sheet - Section by Section:**

      *   **Introduction:** Set the tone. Acknowledge the culture clash (Phil vs. Law).
      *   **Literature Check:** Address the "Settled vs. Contested" query first to ground the rest.
      *   **The Objections (The Meat):**
          *   *Objection 1: The Easterbrook Clerks (Textualist Orthodoxy).* They will attack the "convention" framing. To them, textualism is law, not policy.
          *   *Objection 2: The Empiricist (Staffer/Drafting).* The "plural agent" claim. They have data showing shared intent exists.
          *   *Objection 3: The Legal Historian (Hart & Sacks).* "You're doing Legal Process without the normativity."
          *   *Objection 4: The CLS Scholar.* "Coordination implies legitimacy."
          *   *Objection 5: The Admin Law Respondent.* "What about Agencies?" (This is likely the "hope nobody asks" candidate, or close to it).
      *   **The "Capitalization" Point:** Critique this specifically. It's the weakest empirical link.
      *   **Translation Guide:** Phil-speak vs. Law-speak.

  5.  **Refining the Objections (Iterative Process):**
      *   *Refining Objection 1:* Don't let the user say "it's just a convention." The lawyers will say "No, it's the *rule of law*." The reply needs to be: "Okay, Rule of Law values are the *reason* we pick the convention."
      *   *Refining Objection 2:* The empiricist will say "We interviewed staffers." The user needs to concede that *some* intent exists but argue it doesn't solve *hard cases*.
      *   *Refining the "Hope Nobody Asks":* The user suspects the empiricist. I think the Admin Law person is more dangerous because it exposes the institutional blind spot. If courts pick conventions, do agencies get deference on *that*? Actually, the Empiricist is the specific "receipts" threat the user mentioned. Let's stick with the Empiricist as the "Hope Nobody Asks" because it directly undermines Premise 1.
      *   *Wait, looking closer:* The prompt asks for the "one question I'm hoping nobody asks." The user suspects it's the staffer-empirics one. I should validate that suspicion but maybe offer a nuance. Actually, the Admin Law question is often the killer in workshops because it opens a whole new can of worms (Chevron, *Loper Bright*). But the Empiricist undermines the *foundation*. Let's go with the Empiricist as the "Hope Nobody Asks" because if Premise 1 falls, the whole paper falls. The Admin Law question is manageable.
      *   *Correction:* The prompt asks me to *include* the one question they hope nobody asks. I need to identify it. The user *suspects* it's the staffer one. I need to decide if I agree. I agree. If the legislature *does* have unified intent in many cases, the "underdetermination" premise weakens.

  6.  **Developing the "Capitalization" Critique:**
      *   The user says purposivist gains get capitalized away.
      *   Counter: Textualism also gets gamed. "Magic words" drafting.
      *   Counter: If purposivism allows flexibility, sophisticated legislatures might *rely* on that flexibility to pass controversial bills (constructive ambiguity). If you switch to textualism, they stop passing those bills. That's a loss, not a wash.
      *   *Advice:* Soften this claim. Don't say "capitalized away." Say "diminished marginal utility."

  7.  **Tone and Style:**
      *   Direct, pragmatic, slightly cynical (law school workshop style).
      *   Avoid "metaphysics," "ontology," "normativity" (unless defined). Use "canon," "doctrine," "institutional competence," "democratic legitimacy."
      *   Be honest about soft spots.

  8.  **Final Review against Constraints:**
