answer: |-
  # Workshop Prep Sheet: Statutory Interpretation as Convention
  **Target:** Law Faculty Workshop (Textualist Skew)
  **Time:** 30 Min Q&A
  **Goal:** Survive the cross-examination without getting eaten by "legal process" or "empirical receipts."

  ---

  ## Part 1: The "Settled" vs. "Contested" Landscape
  *You asked for clarity on the literature so you don't step on a rake.*

  **1. "Purposivism was the mid-century orthodoxy, Textualism is the 80s insurgence."**
  *   **Verdict:** **Mostly True, but nuanced.**
  *   **The Nuance:** It is safe to say the *Legal Process* school (Hart & Sacks, ~1950s) dominated the mid-century. They argued statutes should be interpreted to achieve their "purpose" assuming the legislature acted reasonably.
  *   **The Trap:** Do not characterize Hart & Sacks as "anything goes" intentionalists. They had strict constraints. Textualists (Scalia, Easterbrook) successfully *caricatured* purposivism as "judicial legislation" to gain traction in the 80s/90s. If you treat purposivism as "judges doing what they want," the Historian in the room will eviscerate you.
  *   **The "Intent" Fiction:** You treat "legislative intent is incoherent" as background consensus. **It is not.** While many scholars accept the "plural agent" problem, intentionalists (like Larry Alexander or some originalists) argue that *enacted text* embodies the intent regardless of psychological states. The Empiricist in your room will challenge the "no unified intention" premise with data about drafting coalitions.

  **2. "Textualism is now dominant."**
  *   **Verdict:** **True, but fracturing.**
  *   **The Nuance:** Textualism won the war of rhetoric. Everyone claims to be a textualist now (even purposivists often start with text). However, "New Textualism" (focus on ordinary meaning) vs. "Old Textualism" (focus on canons) is a live fight.
  *   **Your Risk:** You are treating Textualism and Purposivism as stable categories. The Admin Law scholar knows these categories are blurring, especially post-*Loper Bright* (2024). If courts no longer defer to agencies on interpretation, the "coordination convention" stakes are higher.

  ---

  ## Part 2: The Objections (In Order of Likelihood)

  ### Objection 1: The "Rule of Law" Attack (From the Easterbrook Clerks)
  **The Vibe:** Aggressive, doctrinal, focused on legitimacy.
  **The Question:** "You're framing this as a policy choice about 'transaction costs.' But textualism isn't just a useful convention; it's required by the Constitution's bicameralism and presentment requirements. If you treat it as a mere coordination game, you're admitting judges can swap conventions whenever they think 'purposivism works better.' Doesn't that destroy the constraint textualism is supposed to provide?"

  **The Translation:** They hear "convention" as "judicial discretion." They think you're giving judges a license to ignore text when it's inconvenient.

  **Two-Minute Reply:**
  "I agree that the constraint is the point, not the metaphysics. My claim isn't that judges should swap conventions case-by-case. It's that the *legal community* needs to settle on one stable rule to make legislation possible. I'm arguing textualism is the *better* convention precisely because it binds judges more effectively than purposivism. So we end up in the same place—textualism wins—but for a different reason. It's not because text *is* the law metaphysically; it's because treating text *as* the law is the only convention that sustains the separation of powers over time. I'm giving textualism a firmer foundation, not a weaker one."

  **Concede Up Front:** Concede that if the convention changes case-by-case, the Rule of Law is dead. Emphasize your view requires a *systemic* choice of convention, not an ad-hoc one.
  **The Soft Spot:** You can't prove textualism binds judges better without empirical evidence of judicial behavior. They will press you on whether textualist judges actually vote differently than purposivist ones.

  ### Objection 2: The "Drafting Reality" Attack (From the Empiricist)
  **The Vibe:** Cold, data-driven, impatient with theory.
  **The Question:** "Your first premise is that legislatures are 'plural agents with no unified intention.' I have interviews with 50 congressional counsels. They tell me they draft specific provisions to solve specific problems and they *do* have shared understandings about what the words do. You're building a philosophical castle on an empirical sand dune. If intent exists in the hard cases you care about, why do we need a convention at all?"

  **The Translation:** "Your philosophy is ignoring my data. Legislators aren't a mythological hydra; they are people who talk to each other."

  **Two-Minute Reply:**
  "I appreciate the data, and I don't mean to suggest *no* agreement exists. I'm talking about the *marginal* cases that reach federal courts. By the time a statute is litigated in the 5th Circuit ten years later, the specific coalition that drafted the compromise is gone, and the text is being applied to a scenario they never discussed. Your staffers might agree on the core, but litigation happens at the boundaries. My argument is that for *those* boundary cases, the 'shared understanding' runs out, and we need a default rule. I'm happy to narrow my premise: intent exists for easy cases; conventions are for the hard ones."

  **Concede Up Front:** Concede that "no unified intention" is too strong. Change it to "no unified intention *resilient enough to resolve hard cases*."
  **The Soft Spot:** **This is the question you hope nobody asks.** If the Empiricist proves that drafting coalitions *do* anticipate hard cases and draft specifically to prevent judicial discretion, your "underdetermination" premise collapses. You need to be ready to say: "Even if they try, language cannot cover every future contingency."

  ### Objection 3: The "Legal Process" Defense (From the Historian)
  **The Vibe:** Protective, scholarly, slightly weary of "new" theories.
  **The Question:** "This sounds like Hart and Sacks repackaged. They argued exactly this: that interpretation is about making the statute the 'best it can be' within an institutional framework. They called it 'reasoned elaboration.' You're calling it 'coordination convention.' What work is your philosophical framing actually doing that the Legal Process school didn't do better in 1958?"

  **The Translation:** "You haven't read the canon, or you're ignoring it to sound novel."

  **Two-Minute Reply:**
  "Hart and Sacks are the giants I'm standing on, but there's a key difference. They assumed the legislature was a 'reasonable' actor pursuing a coherent public good. My framework is more cynical and, I think, more realistic for modern polarized legislatures. I'm not asking judges to maximize the 'goodness' of the statute; I'm asking them to apply a coordination rule that lowers transaction costs even if the legislature was *unreasonable*. Hart and Sacks relied on a normative consensus about the public good that doesn't exist anymore. My convention-based approach works even in a gridlocked, partisan environment."

  **Concede Up Front:** Acknowledge the debt to Hart and Sacks explicitly. Do not claim to have invented institutional design.
  **The Soft Spot:** If you trash Hart and Sacks too hard, you lose the Historian. If you lean on them too much, you aren't contributing anything new. Walk the line: "Updating for polarization."

  ### Objection 4: The "Legitimacy" Attack (From the CLS Scholar)
  **The Vibe:** Skeptical, structural, focused on power.
  **The Question:** "You talk about 'coordination equilibria' as if the state is a neutral platform. But these conventions entrench power. Textualism favors sophisticated drafters (lobbyists) who can write around the rules. By framing this as a neutral 'choice of convention,' you're masking the political distributional effects of textualism. Why should we coordinate on a rule that favors the interests of the well-funded?"

  **The Translation:** "Your theory is ideological. Textualism helps corporations. Admit it."

  **Two-Minute Reply:**
  "That's a serious concern, and I agree that no convention is neutral. However, my argument is comparative. Purposivism gives judges more discretion to find 'purpose.' In a polarized system, whose purpose do they find? Their own, or the last administration's? Textualism's rigidity might favor sophisticated drafters, but it also limits judicial imposition of policy preferences. I'm arguing for the convention that minimizes *unaccountable* power, even if it doesn't eliminate *all* power imbalances. It's a second-best solution."

  **Concede Up Front:** Concede that textualism has distributional consequences. Do not claim it is "neutral."
  **The Soft Spot:** You can't prove textualism limits judicial power better than purposivism without empirical data (see Objection 1). The CLS scholar will press this.

  ### Objection 5: The "Agency Deference" Trap (From the Admin Law Respondent)
  **The Vibe:** Technical, doctrinal, focused on *Loper Bright*.
  **The Question:** "You're discussing court-legislature coordination. But most statutory interpretation happens in agencies, not courts. Post-*Loper Bright*, courts are reclaiming this power. Does your convention apply to agencies? If an agency adopts a purposivist reading and the court adopts a textualist convention, who wins? Your theory seems to ignore the administrative state where most interpretation actually happens."

  **The Translation:** "You're analyzing the wrong player. Agencies do the interpreting. Courts just review."

  **Two-Minute Reply:**
  "That's the next step of the project. Right now, I'm focusing on the judicial convention because courts are the final arbiters of the 'rules of the game.' But you're right: if agencies use purposivism and courts use textualism, we have a coordination failure. My framework suggests courts should *not* defer to agency interpretations of law (which aligns with *Loper Bright*), because the court must be the one to enforce the coordination convention uniformly. If agencies pick their own conventions, the predictability I'm arguing for disappears."

  **Concede Up Front:** Acknowledge this is a limitation of the current draft.
  **The Soft Spot:** If you say courts should *not* defer, you are taking a hot-button political stance. If you say agencies *should* pick the convention, you undermine the "court as umpire" role.

  ---

  ## Part 3: The "Capitalization" Point (Step 4 of your argument)
  *You asked for a reality check on: "Purposivism's gains get capitalized away by sophisticated legislatures."*

  **The Hard Truth:** This is the weakest part of your paper.
  **Why:**
  1.  **Transaction Costs:** Drafting around textualism is expensive. It requires more words, more specificity. This creates "statutory bloat." Purposivism allows for shorter, cleaner statutes because legislators trust courts to fill gaps. If you switch to textualism, the *cost of legislation goes up*. This might mean *less* legislation passes, not just different legislation.
  2.  **The "Constructive Ambiguity" Counter:** Legislators often *want* ambiguity to secure votes. They rely on purposivism to let opposing factions claim the statute means different things. If you enforce textualism, you force the conflict into the drafting stage, potentially causing gridlock.
  3.  **The Reply Strategy:** Do not claim the gains are fully "capitalized away." That implies a perfect market.
      *   **Better Phrasing:** "The marginal benefit of purposivism diminishes as drafters learn to game it, but the marginal cost of textualism (rigidity) remains constant. Over time, the predictability of textualism compounds, whereas the flexibility of purposivism degrades as trust in judicial neutrality falls."
      *   **Concession:** Admit that in the short term, switching to textualism increases legislative drafting costs. Your claim is about long-term stability, not short-term efficiency.

  ---

  ## Part 4: Phil-Speak to Law-Speak Translation Guide
  *Do not use the left column in the workshop. Use the right.*

  | Philosophy Speak | Law School Speak | Why |
  | :--- | :--- | :--- |
  | "Metaphysically correct" | "Required by the Constitution / Rule of Law" | Lawyers don't care about metaphysics; they care about authority. |
  | "Normative framework" | "Institutional Competence / Policy" | "Normative" sounds like moralizing. "Institutional competence" sounds like structure. |
  | "Underdetermination" | "Ambiguity / Gap in the statute" | "Underdetermination" sounds like you think the text is meaningless. |
  | "Coordination Equilibrium" | "Clear Canon / Default Rule" | "Equilibrium" sounds like game theory (suspicious). "Canon" is doctrinal. |
  | "Constructive" | "Judicial Role / Gap-filling" | "Constructive" sounds like "making it up." "Gap-filling" is accepted doctrine. |
  | "Epistemic access" | "Evidence of Intent" | Keep it evidentiary. |
  | "Legitimacy" | "Democratic Accountability" | Legitimacy is vague; accountability is structural. |

  ---

  ## Part 5: Strategic Advice for the Q&A

  1.  **The "Philosopher" Stigma:** They expect you to be abstract and unconcerned with doctrine. Open your answers with a case name or a canon if you can. (e.g., "Think about *Holy Trinity*...") It signals you speak their language.
  2.  **Don't Defend "Intent" Too Hard:** The Textualists hate "intent." Don't try to convince them intent exists. Concede intent is hard to find, but argue that *conventions* are necessary regardless.
  3.  **The "So What?" Test:** Every answer must end with why this matters for a judge deciding a case tomorrow. If your theory doesn't change outcomes, they will dismiss it as academic navel-gazing.
      *   *Your Hook:* "This changes the debate from 'who is right about meaning' to 'which rule makes Congress do its job better.'"
  4.  **Handling the Empiricist:** If they bring receipts, do not argue theory. Say: "That data is fascinating. Does it cover contested litigation cases or just enacted bills? My point is about the litigation tail."
  5.  **Closing Move:** If you get stuck, pivot to **Stare Decisis**. "Regardless of which theory is 'true,' the Supreme Court has moved toward textualism. My paper explains *why* that shift is stable, even if you disagree with the metaphysics." Lawyers love stability arguments.

  **Final Warning:** The Admin Law Respondent controls the summary at the end. Make sure you engage them warmly during Q&A so they don't summarize your paper as "ignoring the administrative state."
