      *   Concede up front? (Yes, strategic concessions).
      *   Soft spots identified? (Yes).
      *   Settled vs. Contested? (Yes, addressed in intro).
      *   Phil-to-Law translation? (Yes).

  9.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Make sure to mention Loper Bright.* Since this is current, the Admin Law person will care about the Court's recent killing of Chevron. It changes the stakes for statutory interpretation.
      *   *Hart & Sacks:* Ensure the Historian knows I know they weren't "squishy." They had the "reasonable legislation" principle.
      *   *Easterbrook:* They care about "Legislative Deal." Don't call it "intent." Call it "the deal."

  10. **Final Polish:** Check the "Settled vs. Contested" section. Is purposivism mid-century orthodoxy? Yes, broadly. But the "Intentionalism" vs "Purposivism" distinction is often blurred. Textualism as 80s insurgence is accurate (Scalia's 1989 lecture).

