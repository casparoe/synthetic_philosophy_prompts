answer: |-
  1. How to use this
  You're three drinks in and someone claimed a grain of sand makes a heap. Don't argue labels; argue intuitions. Start at the top. Answer honestly based on how the case feels. There are no right answers, only consistent ones. If your path ends in "Nihilism," order another round. This map sorts views by what you're willing to swallow, not what you've read. Follow the arrows down.

  2. The tree
  **Q1. The Forced March:** Imagine removing grains one by one. Do you feel forced to switch from "Yes, heap" to "No, not a heap" at some specific step?
  *   **Yes** → Go to Q2.
  *   **No (I'd stop answering)** → Go to Q3.
  *   **No (I'd say "Yes" all the way)** → Go to Q6.

  **Q2. The Sharp Cut-off:** Is there a specific number of grains where the switch happens, even if we can't know it?
  *   **Yes** → **Epistemicism**.
  *   **No** → Go to Q3.

  **Q3. Truth Status:** For a clear borderline case, is "This is a heap" true, false, both, neither, or a matter of degree?
  *   **Both** → **Subvaluationism**.
  *   **Matter of Degree** → **Degree Theory**.
  *   **Neither** → Go to Q4.
  *   **True/False (depends on context)** → **Contextualism**.

  **Q4. Higher-Order:** Is there a sharp boundary between "definitely a heap" and "borderline"?
  *   **Yes** → **Many-Valued Logic**.
  *   **No (It's blurry all the way down)** → Go to Q5.

  **Q5. Already Determinate:** Is "Heap or Not-Heap" true right now, before we pick a precise definition?
  *   **Yes** → **Classical Supervaluationism**.
  *   **No** → **Nonclassical Supervaluationism**.

  **Q6. The Endgame:** Do you think "heap" is too broken to apply to anything, or does it just shift meaning?
  *   **Too broken** → **Nihilism**.
  *   **Shifts meaning** → **Contextualism**.

  3. Leaf glossary
  *   **Epistemicism:** There is a precise number of grains that makes a heap, and God knows it but you don't.
  *   **Contextualism:** Whether something is a heap depends on who is asking and how strict they're feeling right now.
  *   **Subvaluationism:** A pile can be truly described as both a heap and not a heap at the same time.
  *   **Degree Theory:** Truth comes in percentages, so "this is a heap" is only 60% true.
  *   **Many-Valued Logic:** There is a sharp boundary between being "definitely a heap" and "borderline," which defeats the point of vagueness.
  *   **Classical Supervaluationism:** "Either heap or not" is true even though neither option is individually true yet.
  *   **Nonclassical Supervaluationism:** Logic itself changes in borderline cases, so you can't trust standard reasoning there.
  *   **Nihilism:** There are no heaps anywhere, ever, so you've been lying every time you used the word.

  4. Empty rooms
  *   **Q1(Yes) + Q2(Yes) + Q3(Neither):** If there is a fixed cut-off number, claiming truth-value gaps is **incoherent**.
  *   **Q3(Neither) + Q4(Yes) + Q5(No):** Admitting sharp higher-order boundaries but denying classical determinacy is **unstable**.
  *   **Q1(No-Stop) + Q3(Both):** Refusing to answer because of a gap while claiming it is both true and false is **incoherent**.

  5. Blind spots
  *   **Contextualism vs. Epistemicism:** Both preserve classical logic in practice, making them hard to distinguish without probing metaphysical commitments.
  *   **Degree Theory vs. Many-Valued Logic:** The distinction is often just mathematical notation rather than a difference in how vagueness feels.
