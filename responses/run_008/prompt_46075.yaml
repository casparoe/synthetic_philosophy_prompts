answer: |-
  Daniel Dennett's conception of the self as a "center of narrative gravity" proposes that personal identity is not a distinct entity located within the brain, but rather an abstraction posited to make sense of a complex, parallel array of cognitive processes. Much like a center of mass in physics, the self has no physical substance, yet it is real insofar as it serves as a necessary reference point for predicting behavior and organizing experience. In *Consciousness Explained*, Dennett suggests that for the most part, "we don't spin our tales; they spin us." The narrative emerges from the competition of multiple drafts of experience, coalescing into a coherent story that the organism treats as its own history. Christopher Nolan's *Memento* (2000) functions as a radical stress test for this account. By presenting a protagonist, Leonard Shelby, whose biological capacity for declarative memory is destroyed, the film forces the narrative self to migrate outward, relying on Polaroids, tattoos, and notes to sustain its gravity. While this initially appears to be a perfect vindication of Dennett—isolating the narrative function from the biological substrate—a closer reading reveals significant friction. The film does not merely illustrate the narrative self; it exposes the ethical and metaphysical costs of a selfhood maintained through deliberate fabrication, challenging Dennett's claims about authorship, the role of non-narrative memory, and the continuity of identity.

  The most striking alignment between the film and Dennett's theory is the externalization of the narrative scaffolding. For Dennett, the brain normally handles the "drafting" of the self internally; for Leonard, this drafting must be physical. When Leonard develops a Polaroid and writes "Don't believe his lies" on the front, he is quite literally constructing the premises upon which his future self will operate. This supports Dennett's claim that the self is a posit: Leonard's "self" exists only in the gap between the artifact and the interpretation of that artifact. However, this setup inverts Dennett's assertion that narratives spin us. Leonard is not spun by a tale; he is the deliberate author of a tale designed to spin his future self. In the film's climax, Leonard chooses to ignore Teddy's revelation that he has already killed the real "John G." Instead, Leonard selectively tattoos Teddy's license plate as a new "fact," knowingly planting a clue that will send his future self on a wild goose chase. Here, the "center of narrative gravity" is not an emergent property of unconscious processing but a weaponized fiction. If the self is just a narrative posit, who is the agent deciding to falsify the narrative? Dennett might argue this is simply one competitive draft overriding others, but the film presents it as a moment of lucid, cynical agency. Leonard is not just a passenger in his narrative; he is its architect, suggesting that even within a narrative account, there remains a locus of decision-making that resists reduction to the story itself.

  Furthermore, *Memento* complicates the narrative account by highlighting what persists when the narrative fails. Dennett's Multiple Drafts Model allows for parallel processing that never reaches the "fame" of conscious narrative, yet Leonard's condition suggests that significant aspects of the self survive without declarative storytelling. In the sequence where Leonard injects insulin, he operates on a somatic memory; his body knows the routine even if his story does not. More poignantly, his grief for his wife persists as an emotional tone that contradicts his official narrative. Dennett would classify this as sub-personal processing, but the film imbues it with personal weight. The "Sammy Jankis" story, which Leonard tells repeatedly as a cautionary tale about a man with the same condition, is eventually revealed to be a projection of Leonard's own trauma. Leonard's wife survived the assault, but Leonard, unable to accept his own role in her subsequent death (via insulin overdose), rewrote the memory, assigning the tragedy to Sammy. This suggests that the narrative self is not just an organizer of facts but a defense mechanism. If the center of narrative gravity is maintained by repressing the truth, as Leonard's is, Dennett's model must account for the *motivation* behind the narrative. The narrative is not merely explanatory; it is therapeutic, serving a psychological need that overrides factual accuracy.

  This leads to the question of identity continuity, which Dennett attempts to solve through narrative connectedness. If the self is the story, and the story is fractured, is the self fractured? The film's structural gimmick—playing the color sequences in reverse—forces the audience to reconstruct Leonard's identity in the same fragmented way he experiences it. We meet the "end" Leonard first (the murderer of Teddy) and work backward to the "beginning" (the man receiving the phone call). This mirrors Dennett's view that identity is a matter of retrospective coherence. However, the revelation regarding Sammy Jankis implies a rupture between the pre-injury Leonard and the post-injury Leonard that narrative continuity cannot bridge. If the post-injury Leonard is living a lie constructed to mask the sins of the pre-injury Leonard, are they the same center of gravity? Dennett might argue they are the same "character" in the ongoing novel of the brain, but the film suggests a moral discontinuity. The pre-injury Leonard committed a sin; the post-injury Leonard manufactures a quest to punish a ghost. The narrative connects them, but the moral agency is disjointed. The film leaves the identity question genuinely open, suggesting that while narrative can sustain the *appearance* of a self, it cannot necessarily guarantee the *integrity* of a person.

  Ultimately, *Memento* validates Dennett's descriptive claim that the self is a constructed abstraction, but it challenges the normative implications of that construction. Dennett often presents the narrative self as a benign, necessary user-illusion for social functioning. Nolan presents it as a potentially malignant survival strategy. Leonard's center of narrative gravity holds firm—he remains "Leonard" throughout the film—precisely because he is willing to murder the truth to maintain it. The film demonstrates that the reality of the self consists in the explanatory work the posit does, as Dennett claims, but it adds a darker corollary: the explanatory work required to keep the self coherent may require the systematic destruction of reality. The narrative self is robust enough to survive amnesia, but only by becoming a closed loop of self-deception. In this light, *Memento* does not just dramatize the center of narrative gravity; it reveals its gravitational pull as a force that can distort the truth to keep the self from flying apart.

