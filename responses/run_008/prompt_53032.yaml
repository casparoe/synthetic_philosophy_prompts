  6.  **Formulating the Verdict:**
      *   *Defect in Vocabulary or Claim?* Both. Physics vocabulary lacks "normativity" and "constitutive feedback." But Dennett's metaphor *is* rhetorical. It hides the hard problem of how the abstraction causally influences the micro.
