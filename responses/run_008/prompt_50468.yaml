answer: |-
  This is a sophisticated stalemate because both sides are technically correct within their own frameworks, but they are operating in different domains of discourse. Your hunch is accurate: this is not a factual dispute about history, nor is it purely a moral dispute about values. It is a **pragmatic mismatch** regarding the function of language and memory.

  Here is the diagnosis based on what each side is actually doing:

  **Side A (The Historians/Analysts)**
  *   **What they say:** "Comparing is just what historians do... the only way to get general lessons."
  *   **What they are doing:** They are engaging in **epistemic instrumentalism**. To them, "ranking" is a shorthand for *structural comparison*. They are asking: *What variables correlate with higher death tolls? What political mechanisms allow one genocide to scale faster than another?*
  *   **The Goal:** Prevention and understanding. For this goal, comparison is not just allowed; it is required. If you cannot compare the Holocaust to other genocides, you cannot build a general theory of genocide, and "Never Again" becomes a slogan rather than a policy.

  **Side B (The Mourners/Ethicists)**
  *   **What they say:** "Ranking suffering is spitting on graves, full stop."
  *   **What they are doing:** They are engaging in **ritualistic preservation**. To them, "ranking" is a shorthand for *moral valuation*. They hear "worse" not as "higher casualty count" or "more systematic," but as "more worthy of grief."
  *   **The Goal:** Dignity and memory. For this goal, comparison is inherently destructive because it turns unique human suffering into a metric. It feels like a zero-sum game where acknowledging one tragedy diminishes another.

  **The "Shame" Layer (Your Insight)**
  You identified the critical tension: *Policy already ranks, but memory refuses to.*
  Governments allocate reparations and memorial budgets; this is an implicit ranking (e.g., veterans vs. civilian victims, Group X vs. Group Y). Side B is not necessarily unaware of this, but they are objecting to the **explicit verbalization** of the hierarchy.
  *   **Side A** wants to make the implicit explicit so it can be analyzed.
  *   **Side B** wants to keep the implicit tacit so it doesn't wound the living.
  This makes the fight about **discursive norms** (what is safe to say in public) rather than **ontological truths** (what actually happened). Side B feels that speaking the ranking *enacts* the harm, whereas Side A feels that speaking the ranking *prevents* the harm.

  **What Counts as Progress?**
  Progress will not come from finding a "correct" ranking. It will come from a **meta-conversation** that separates the *contexts* of comparison.
  1.  **Acknowledge the Dual Purpose:** The group must agree that "comparison" is being used for two different language games: *Scientific/Historical* (explanation) and *Liturgical/Memorial* (mourning).
  2.  **Validate the Implicit:** Side B must admit that resource allocation (reparations, memorials) requires prioritization (a form of ranking), while Side A must admit that public mourning requires a suspension of hierarchy to be effective.
  3.  **Reframe the Question:** Move from "Is ranking allowed?" to "In which contexts is ranking useful, and in which contexts is it harmful?"

  The stalemate exists because Side A thinks Side B is anti-science, and Side B thinks Side A is anti-human. The breakthrough happens when they realize Side A is trying to *save the future* (via analysis) and Side B is trying to *honor the past* (via respect). These are compatible, provided they don't use the same tools for both jobs.

  \answer{pragmatic-mismatch}
