      Welcome. Half of you are kerning the invitations, half are just here for the cake. Dad spent 40 years asking "What makes an 'a' an 'a'?" He hated when people said "it looks like one." He said an 'a' can look like an 'o' but still be an 'a'. He said the identity is in the whole alphabet. I didn't get it, but I think it means he built a world. Now he's retiring. Let's drink.
