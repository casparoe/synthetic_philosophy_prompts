  6.  **Developing the Metaphor (The "System" vs. "Individual"):**
      The father's insight is that *context creates meaning*.
      *   For designers: This is about optical balance and systemic integrity.
      *   For family: This is about how a person is defined by their relationships.
      *   *Bridge:* "He spent forty years drawing letters, but he was actually building relationships."

  7.  **Writing the Toast (Iterative Process):**
