answer: |-
  Good evening, everyone.

  For those of you scanning the menu on the wall to see if the kerning is tight enough to be legible from across the street: welcome. You're on Dad's side. And for the rest of you, who are just wondering if the open bar is open yet: welcome. You're on my side.

  For forty years, my dad has spent his life asking a question that sounds simple but isn't. He'd bring it up at dinner, usually right when we were trying to pass the potatoes: "What makes an 'a' an 'a'?"

  Now, if you ask a normal person that, they say, "Well, it looks like an 'a'." But Dad would shake his head. He knew that the 'a' in his fonts shares basically no ink with my terrible handwritten 'a', or the 'a' in the novel you're reading on the train. And yet, we read them all instantly as the same letter. So it can't just be the shape.

  Then people would say, "Okay, it's family resemblance." That's the part that would actually annoy him. He'd say that was a lazy answer. Because if you look closely, an 'a' can share more actual ink with the 'o' sitting right beside it than it does with an 'a' in a different font. And yet, you never confuse them. You know which is which.

  He believed that the identity doesn't live in the letter itself. He believed the identity lives in the whole alphabet. A letter is only itself because of the system holding it up. Because of its relationship to everything around it.

  I'll be honest: I never fully followed him on that last part. It sounded like homework. But standing here tonight, looking at this room, I think I finally get it.

  If a letter is defined by its neighbors, then Dad's career wasn't about drawing shapes. It was about building relationships.

  To the designers in the room: You know better than anyone that his fonts work because he understood that balance isn't about isolation. It's about how the letters breathe together. He didn't just draw type; he built environments where words could live.

  And to the family: We know that he didn't just build fonts. He built a life where *we* are the alphabet. He taught us that we make sense because we're together. That context is everything. That you can't judge a mark on the page without looking at what surrounds it.

  Dad, for forty years, you worried about what makes an 'a' an 'a'. You worried about the weight of the stroke, the curve of the shoulder, the integrity of the system. You gave us the tools to tell our stories.

  But tonight, you're retiring. Which means you're done drawing the letters. You don't have to worry about the system anymore. You've earned the right to just read the story.

  So, here is to the man who taught us that meaning comes from connection. May your next chapter be set in a typeface that's easy on the eyes, with plenty of leading, and no deadlines.

  To Dad.
