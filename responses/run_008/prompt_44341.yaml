answer: |-
  # JOINT STATEMENT OF THE DELIBERATIVE PANEL ON FRANCHISE BOUNDARIES
  **Submitted to the Electoral Commission**  
  **Date:** 24 May 2024  
  **Signatories:** The Subjection Working Group & The Affectedness Working Group

  ## I. AGREED CLAIMS

  1.  **The Boundary Problem is Genuine:** We agree that the boundary of the *demos* is not a pre-political natural fact. Existing state borders do not perfectly match the extension of any single normative principle. The question of who constitutes "the people" is prior to, not solved by, existing constitutional arrangements.
  2.  **Indeterminacy of Principles:** We agree that both the Principle of Subjection (all those subject to coercive law) and the Principle of Affectedness (all those whose interests are materially impacted) suffer from extensional indeterminacy. "Coercion" is not always a sharp binary (e.g., background property law vs. direct command), and "affectedness" is continuous in an interdependent economy where almost every policy has some ripple effect.
  3.  **The Bootstrapping Worry:** We acknowledge that any procedure to determine the boundary of the *demos* must itself be authorized by a *demos*. There is no neutral arbiter outside the system to draw the line without already presupposing a membership.
  4.  **Necessity of Closure:** We agree that while moral principles may extend continuously, political decision-making requires discrete closure. A functional democracy must draw a line somewhere to operate, even if that line inevitably excludes some moral claimants or includes some with attenuated stakes.
  5.  **Rejection of Status Quo Naturalism:** We agree that appealing to current citizenship laws or historical accident is insufficient justification for franchise exclusion in cases where strong moral claims of subjection or affectedness are demonstrably present.

  ## II. DISAGREEMENTS TABLE

  | Disputed Question | Subjection Camp Position (ASP) | Affectedness Camp Position (AAP) | The Crux |
  | :--- | :--- | :--- | :--- |
  | **1. Cross-Border Commuters**<br>(Work/pay tax in capital; reside/vote elsewhere) | **Include.** They are subject to the daily coercive administration of the capital's labor and municipal laws. Their legal obligation creates the membership claim, regardless of where they sleep. | **Include.** Their material livelihood and daily welfare are determined by capital policy. Their stake is immediate and tangible. | Is the claim grounded in *legal obligation* or *material stake*? (Convergent verdict, divergent reasoning). |
  | **2. Neighbor State (Port Referendum)**<br>(Environmental/economic spillover across border) | **Exclude.** They are not subject to the sovereign authority of this state. They cannot be prosecuted by our courts nor bound by our statutes. Inclusion dissolves the distinction between international diplomacy and domestic democracy. | **Include.** The environmental and economic impact on them is comparable to that of residents. To exclude them is to allow the *demos* to externalize costs onto non-members. | Does sovereignty create a moral discontinuity that overrides continuous harm? |
  | **3. Future Generations**<br>(Youth movement/Climate Law) | **Exclude (as members).** Non-existent entities cannot be "subject" to law. Trustees may represent their interests, but they cannot be members of the *demos* until they exist to be coerced. | **Include (via representation).** Their interests are the most heavily affected. Denying them standing allows the present to tyrannize the future. Proxy representation is a necessary institutional fix. | Can "membership" apply to entities that cannot currently exercise agency or bear legal duty? |
  | **4. Resident Non-Citizens**<br>(Long-settled, no national franchise) | **Include (Local).** They are subject to the local coercive order (police, zoning, bylaws). National citizenship is irrelevant to the fact of local subjection. | **Include (Local & National).** Their life chances are determined by the full range of state decisions. Length of residence cements the stake. | Is the relevant unit of subjection the local legal order or the national sovereign? |
  | **5. Non-Resident Foreigners**<br>(Affected by trade/climate policy globally) | **Exclude.** Global affectedness is universal. If everyone is affected, no one is a member. Democracy requires a bounded community of reciprocal obligation, not a global plebiscite. | **Conditional Inclusion.** Where effects are systematic and severe (e.g., climate), institutional mechanisms must be found to register their stake, even if full franchise is impractical. | At what threshold does "affectedness" become too diffuse to ground a voting right? |

  ## III. CRUXES AND RECORDED PREDICTIONS

  ### Crux A: The Nature of Coercion vs. Affectedness
  **The Question:** Is the "coercion" cited by the Subjection Camp a distinctively political phenomenon, or is it merely an especially intense form of "affectedness"?
  **Test Case:** *The Voluntary Resident.* A foreigner chooses to move to the jurisdiction, knowing the laws.
  *   **Subjection Prediction:** They are members immediately upon entry. By entering, they placed themselves under the sovereign's coercive umbrella. The choice to enter is irrelevant to the fact of subjection.
  *   **Affectedness Prediction:** They are members because their stakes are now high, but if they were to move to a zone where they were unaffected (e.g., a remote offshore platform), they would cease to be members. Subjection is just a proxy for high-stakes affectation.
  *   **Convergence Point:** Both agree the resident gets the vote.
  *   **Divergence Point:** If the state passes a law that *only* affects tourists (e.g., a tourist tax), the Subjection Camp says tourists are members for that issue; the Affectedness Camp says tourists are members for that issue. *However*, if the state passes a law that coerces residents but benefits them (e.g., mandatory jury duty with no pay), the Subjection Camp says they are members (bound by law); the Affectedness Camp might argue their stake is negative, but they remain members. The divergence is theoretical: one tracks *authority*, the other tracks *welfare*.

  ### Crux B: Deep Economic Interdependence
  **The Question:** Does modern economic integration dissolve the practical difference between being subjected to a state's laws and being affected by its policies?
  **Test Case:** *The Supply Chain Worker.* A worker in a neighboring state makes components essential to our capital's economy. Our labor laws raise their costs; our environmental laws restrict their suppliers.
  *   **Subjection Prediction:** Exclude. They are not bound by our labor inspectors. Our laws do not reach them directly; they reach them only through the mediation of market prices. To include them is to claim jurisdiction over the world.
  *   **Affectedness Prediction:** Include (or grant strong consultative standing). The distinction between "direct law" and "market pressure" is a fiction. Our regulations determine their livelihood as surely as if we had commanded it.
  *   **Convergence Point:** Both agree that *direct* legal prosecution creates membership.
  *   **Divergence Point:** The Subjection Camp predicts that accepting the Affectedness logic here leads to an infinite regress (no decision can ever be made). The Affectedness Camp predicts that accepting the Subjection logic here leads to moral tyranny (power without accountability).

  ### Crux C: Future Generations and Agency
  **The Question:** Can trustees or representatives stand in for members-to-be, or is that category confusion?
  **Test Case:** *The 100-Year Climate Bond.* A referendum to incur debt payable in 80 years.
  *   **Subjection Prediction:** Current voters decide. Future people cannot be coerced now. We can act prudently, but we cannot grant them franchise. To do so confuses *interests* with *agency*.
  *   **Affectedness Prediction:** Current voters are conflicted agents. We must institutionalize guardians for future interests (e.g., a veto-wielding ombudsman). This is not full franchise, but it acknowledges their membership status.
  *   **Convergence Point:** Both agree current voters must cast the ballots.
  *   **Divergence Point:** The Subjection Camp views future guardians as a policy tool; the Affectedness Camp views them as a right of membership.

  ***

  # RAPPORTER'S ANALYSIS (CONFIDENTIAL)

  ### 1. Verbal vs. Substantive Dispute
  There is a significant verbal component to this dispute, though a substantive residue remains.

  **The Verbal Component:**
  The two camps are often using the word "membership" (or "belonging to the *demos*") to track two different moral phenomena.
  *   **The Subjection Camp** uses "membership" to track a **claim-right against coercive imposition**. For them, the franchise is a shield against authority. If you are bound, you need the shield.
  *   **The Affectedness Camp** uses "membership" to track a **stake in outcomes**. For them, the franchise is a tool for welfare protection. If you are harmed, you need the tool.

  In roughly 60% of the concrete cases discussed (e.g., resident non-citizens, cross-border commuters), both camps converge on the same franchise extension. They agree on *who votes*, but they disagree on *why they vote*. In these instances, the dispute is largely verbal: they are arguing over the label of "member" rather than the allocation of the ballot.

  **The Substantive Residue:**
  The dispute becomes substantive in the "hard cases" where the two principles diverge extensionally.
  *   **Foreign Neighbors (Port Case):** The Subjection Camp will *never* grant the vote to the foreign neighbor, because no legal authority exists. The Affectedness Camp *must* grant the vote (or equivalent power), because the harm is real. Here, the verbal agreement breaks down; the ballot allocation differs.
  *   **Future Generations:** The Subjection Camp cannot conceptually accommodate them as members (no agency/coercion). The Affectedness Camp must accommodate them (maximum stake).
  *   **The "All-Affected" Regress:** The Affectedness Camp faces a substantive pragmatic problem the Subjection Camp avoids: if everything affects everything, the *demos* becomes global and unworkable. The Subjection Camp avoids this but faces the substantive moral problem of "tyranny over outsiders."

  **Conclusion:** The dispute is verbal regarding the *justification* for standard inclusions, but substantive regarding the *limits* of inclusion.

  ### 2. Assessment of the "Operational Boundary" Observation
  *User Request: Include the chemist's observation (boundaries are operational choices judged by neglected fluxes) if signable; otherwise leave it out and say why.*

  **Decision:** I have **excluded** the strong version of your observation from the Agreed Claims, though I included a weakened variant (Claim #4: Necessity of Closure).

  **Reason for Exclusion:**
  While your instinct is analytically sound, framing the boundary as an "operational choice judged by neglected fluxes" would be read as hostile by both camps, for different reasons:

  *   **Hostility to the Subjection Camp:** To a theorist of coercion, the boundary is not a pragmatic convenience; it is the *definition* of the political order. Suggesting it is "operational" implies the authority of the state is merely a matter of administrative efficiency rather than legitimate sovereignty. They would view this as reducing a right against coercion to a matter of bureaucratic bookkeeping.
  *   **Hostility to the Affectedness Camp:** To a theorist of interests, the boundary is a moral imperative to prevent harm. Suggesting it is "operational" implies that excluding affected parties is acceptable simply because drawing the line is easier. They would view this as a utilitarian dismissal of moral claims.

  **The Compromise (Claim #4):**
  I substituted your "flux" language with "Necessity of Closure." This acknowledges the pragmatic reality (we must draw a line to function) without explicitly framing the principle itself as merely instrumental. This allowed both sides to sign without feeling their core moral principle was being deflated.

  **Private Note to the Rapporteur:**
  Your chemist's instinct is correct—the political *demos* functions exactly like a control volume in fluid dynamics. However, political actors cannot admit this publicly without undermining the legitimacy of the system. They must treat the boundary as sacred (discovered) to maintain the authority of the decisions made within it. Acknowledging it as a tool (drawn) risks revealing the arbitrariness of the power structure. The panel was only able to agree on the *necessity* of the draw, not the *arbitrariness* of the method.
