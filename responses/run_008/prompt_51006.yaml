answer: |-
  [Stand at the podium. Adjust the mic. Look at the left side of the room, then the right.]

  Good evening. Looking around this room, I see a distinct divide. On my left, Eileen's family. On my right, her former fellows. For the family: don't worry. We aren't going to ask you for money. For the fellows: yes, I know. We're already in debt.

  For thirty years, Eileen ran a summer fellowship for journalists. And on the first morning, she would stand at a podium exactly like this one. She would hold up a crisp twenty-dollar bill. She would auction it off. But there was one rule: the highest bidder gets the twenty. The second-highest bidder also pays their bid. But gets nothing.

  I have watched hardened war correspondents bid eighteen dollars for that twenty. I have seen editors bid forty. I have seen good people stand at that podium, sweating, knowing the math is broken, knowing they are losing, but unable to step away because walking away feels like admitting the last hour was a mistake.

  Eileen never called this a lesson in economics. She never told us that a man named Shubik invented this game in 1971. She let us think it was hers. She let us think the trap was hers, so the escape would be ours, too.

  And sometimes, there was an escape. A fellow named Dave once bid nine dollars. Then he stopped. He just put his paddle down. He lost the nine. He walked back to his seat while the bidding raged without him. After class, Eileen took nine dollars of her own money. She taped it to Dave's lost nine. She wrote a note on the card. Dave still has it on his office wall. Eighteen dollars that taught him the most expensive thing he ever learned: that losing a little is better than losing everything.

  She taught us that knowing the trap doesn't save you. You can read every book on negotiation. You can memorize every chart on sunk costs. But when you are standing at that podium, and you have already spent eighteen-fifty, and the only way to make that money make sense is to spend nineteen… quitting feels like throwing money away. Staying in feels like the only responsible choice.

  She warned us against smugness. She said looking down on the bidders was "bidding with other people's money." It's easy to be wise when you aren't the one holding the paddle.

  So, tonight, I want to say what she deserves.

  Eileen is the reason I have a career.
  She is the reason I understand how stories work.
  She is the reason I know that being right is less important than being useful.
  She is the most generous mentor I have ever known.
  She is the smartest person in this room.
  She is the kindest person in this room.
  She is—

  [Pause. Look at the prepared index cards in your hand. There is clearly more written there. Look up at Eileen. Look at the room. Slowly lower the cards.]

  I have more to say. I have a whole final paragraph about her legacy. About how she changed the field. About how we all carry her voice in our heads when we're on deadline.

  But if I say it… if I keep stacking praise on praise just to have the perfect ending… I'm just bidding up the cost of this moment. I'm trying to win your applause when the only thing that matters is that she's here.

  And I know, better than anyone in this room, that the smartest move isn't to win the auction. It's to leave something on the table.

  [Step back from the microphone. Do not say "Thank you." Do not say "Cheers." Just nod to Eileen, gather your cards, and sit down while the room is still expecting more.]
