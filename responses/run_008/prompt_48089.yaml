prompt: |-
  I'm a software engineer with no philosophy background (decent math though) and I keep bumping into imprecise probabilities because of my day job. Short version: I build internal decision-support tools, and the honest situation is usually that different experts / different models give genuinely different probability estimates, not just one distribution with noise around it. The imprecise-probability people seem to say the right representation is a *set* of probability functions instead of one, and that appeals to me intuitively — but once you buy that, everything downstream gets weird, and there seem to be a bunch of unresolved fights about the downstream stuff: what decision rule to use when the options' expected utilities overlap for some members of the set but not others (maximality vs E-admissibility vs gamma-maximin, I think they're called), how you're supposed to update a set of probabilities when evidence arrives (just condition each member separately? is that obviously right?), whether the "dilation" thing is a real practical problem or a curiosity, and whether any of this beats just putting a second-order distribution over the experts and collapsing back to ordinary decision theory.

  If I'm going to spend my weekends for the next year reading and prototyping around one or two of these questions, which should they be, and why? My end goal is working software that gives sane recommendations under this kind of deep disagreement — I don't care about philosophy of science for its own sake, though I'd genuinely like to know if I'm missing something a philosopher would say I *should* care about. Rank the questions, defend the ordering (what makes one upstream of the others, which are overrated for my use case), and tell me what would make you re-rank them. One paragraph of framing then the ranked list is fine, keep the whole thing under 450 words.
