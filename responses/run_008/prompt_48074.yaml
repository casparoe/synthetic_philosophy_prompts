  6.  **Drafting the Analysis (Task 3: Anthropics):**
      *   *Counterattack:* We only see it because it works. Observer selection.
      *   *Verdict:* This relocates selection from the *system's genesis* to the *observer's context*. It saves the nesting thesis only by making the Design Stance relative to the observer's survival, not the system's history. It weakens the claim that Design must underwrite Intentional *in the object*. It suggests the Design Stance is a projection of the observer's need for patterns, not an ontological feature of the system.

