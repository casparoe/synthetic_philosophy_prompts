      *   This is tricky because "Design Stance" in Dennett's terms often includes "functions" derived from evolution. If there's no evolution, is there a "function"?
      *   The system must be a "fluke" of physics that happens to behave rationally.
      *   *Challenge:* If it's a fluke, is the pattern "real"? Dennett says real patterns are those that support prediction better than noise. If the fluke is robust, it supports prediction.
      *   *Challenge:* How to ensure "no iterative winnowing"? It must be a single event producing a complex, rational system.
