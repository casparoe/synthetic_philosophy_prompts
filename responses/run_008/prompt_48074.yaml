      *   *Verdict:* This case forces a revision. The Intentional Stance can stand alone if the pattern is robust enough. The Design Stance is a *heuristic* for finding Intentional systems, not a metaphysical ground. If the pattern exists, the intentionality exists, regardless of genesis. The nesting is epistemic (how we find them), not ontological (what makes them real).
