      *   *Is this "one paragraph"?* Yes.
      *   *Is it exotic physics?* No, just improbable physics.
      *   *Does Design Stance work?* There was no designer. There was no selection. So, etiological function is absent.
      *   *Does Intentional Stance work?* Yes, predicting chess moves via beliefs/desires is easier than physics.

      *   *Refining the Scenario for Maximum Punch:*
      *   Let's call it the "Thunderhead Computer." A lightning strike hits a specific mineral deposit. The cooling slag forms a complex integrated circuit. Solar static charges power it. It outputs moves on a grid. The moves maximize territory (Go game). It wasn't selected; it was a singularity.

