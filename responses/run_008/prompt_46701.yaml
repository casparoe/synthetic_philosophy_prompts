      *   This explains why decomposition doesn't work. You can't decompose a contradiction.

  10. **Finalizing the Structure:**
      *   **Diagnosis:** Methodological-Substantive Hybrid (Explanatory Expectations).
      *   **The Hidden Question:** The Mereology of Subjecthood (Container vs. Structure).
      *   **Settled vs. Contested:** Map the literature accurately.
      *   **Path to Progress:** Formal Mereology or Abduction of Privacy.
