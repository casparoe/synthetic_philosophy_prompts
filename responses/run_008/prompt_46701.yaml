  11. **Self-Correction during drafting:**
      *   *Caution:* Don't get bogged down in specific authors (Goff, Chalmers, etc.) unless necessary to illustrate the *structure* of the argument. The user knows the literature.
      *   *Focus:* Keep it on the *logic of the stalemate*.
      *   *Refinement on "Univocality":* It's not just univocality, it's *continuity*. Panpsychism requires a continuous scale of subjecthood. Critics see a discontinuity (on/off switch).
      *   *Refinement on "Bonding":* Why does it feel empty? Because "bonding" implies a relation between two things that remain distinct, whereas "unity" implies they become one. If they remain distinct, James is right. If they become one, where did the originals go? This is the Mereological Nihilism vs. Universalism tension.

  12. **Final Polish:** Check against constraints one last time.
