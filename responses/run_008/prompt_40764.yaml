  Bottom line
  I assign 0.38 credence to your friend's position. While causal decision theory strongly supports their view that the local act is dominated, a normative theory that labels the winning move irrational is fundamentally defective. Rationality should track success in Newcomb-like problems where predictions depend on your disposition. However, the intuitive force of causal dominance prevents me from dismissing their view entirely, as the ride is physically already secured. Thus, while the disposition is clearly rational, the act's irrationality relies on a fragmented view of agency I find less compelling than functional accounts.

  The decomposition
  To derive this, I evaluate the probability of the friend's claim across semantic and theoretical dimensions. First, I assess whether rationality is unified or split between acts and agents. Second, I assess causal decision theory's validity if rationality is unified. Third, I assess if causal decision theory can salvage the act within this specific case. Fourth, I assess the friend's success if rationality splits.

  1.  P(Single Sense): 0.80. Unified normative theory is theoretically preferable to bifurcated "rationality."
  2.  P(CDT | Single): 0.25. CDT fails Newcomb problems; functional accounts better capture logical correlations.
  3.  P(CDT Saves | CDT): 0.10. Once in town, causal links to prediction are severed; CDT cannot retroactively justify payment.
  4.  P(Friend | Split): 1.00. If rationality splits, the friend's distinction holds by definition.

  Combination: The friend is correct if rationality splits, or if it is single but CDT is true and offers no save. P(Friend) = P(Split) + [P(Single) × P(CDT) × (1 − P(Save))]. Substituting values: 0.20 + (0.80 × 0.25 × 0.90) = 0.20 + 0.18 = 0.38. This calculation assumes the split view guarantees the friend's victory, while the single view requires CDT to override functional success.

  Where the weight sits
  The final number is most sensitive to P(CDT | Single). The semantic question is largely stipulative, but the validity of CDT is substantive. Convincing me that causal isolation trumps logical correlation in normativity would shift this term above 0.5, doubling the final credence. If you argue that rationality must imply winning in prediction-based cases, this term collapses toward zero, vindicating your position. Conversely, if causality is the only legitimate channel for influence, CDT rises, vindicating your friend.

  Locating the argument
  You disagree about semantics grounded in metaphysics. Friend isolates the temporal slice (act); you integrate the logical slice (algorithm). It is a dispute over whether "act" includes subjunctive dependencies or only causal history. Your friend treats the payment as an isolated event; you treat it as an output of a source code. This is less about decision theory mechanics and more about the ontology of the "act" itself.
