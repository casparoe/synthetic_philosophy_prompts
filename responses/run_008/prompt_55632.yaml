      *   Section 4: Fidelity to Law (Missing the "appeal to majority" point).
      *   Add a "Calibration Note" section to help the TA grade the rest of the batch consistently.

      *(Final Polish)*: Make sure the distinction between Conscientious Refusal and Civil Disobedience is clear, as that's the specific Rawlsian distinction tested here.

