answer: |-
  ### The Darwinian Theory of Culture: An Epidemiological Translation

  **The Unit of Transmission**
  In this framework, a cultural variant (the "meme") is an infectious agent. It is not merely analogous to a pathogen; in the model, it functions as a distinct strain with a specific genotype (the information content) and phenotype (the observable behavior or artifact). The human mind is the host. Acquisition of the variant is an infection event. Retention is chronic infection or latency. Abandonment of the variant is clearance or recovery.

  **Variation, Selection, and Retention**
  *   **Variation:** During transmission (shedding and uptake), the agent undergoes mutation. Unlike genetic mutation, this is often non-random; host cognitive biases act as mutagenic pressures, systematically altering the variant during replication to increase its fit with host psychology.
  *   **Selection:** A variant is selected if its effective reproduction number ($R_e$) exceeds 1 within the contact network. Selection pressure is determined by the transmission rate ($\beta$) and the duration of infectiousness ($D$).
  *   **Retention:** The variant persists in the population (endemicity) if the rate of new infections outpaces the rate of clearance (forgetting) and host mortality.

  **Transmission Routes and Population Structure**
  *   **Vertical Transmission:** Parent-to-offspring infection (socialization). High fidelity, low contact rate.
  *   **Horizontal Transmission:** Peer-to-peer infection. Lower fidelity, high contact rate.
  *   **Oblique Transmission:** Non-parental adult-to-child infection (teaching/institutions).
  *   **Contact Networks:** Social structures define the contact matrix. Assortative mixing (homophily) creates clusters that alter the herd immunity threshold for specific variants.

  **Virulence and Host Fitness**
  The model posits a trade-off between the variant's transmissibility and its virulence (cost to host fitness).
  *   **Commensalism/Mutualism:** Variants that increase host survival or reproductive success (e.g., hygiene norms) may persist via vertical transmission or by extending the host's infectious period.
  *   **Parasitism:** Variants that reduce host genetic fitness (e.g., celibacy, suicide cults) must compensate with high horizontal transmissibility ($\beta$) to maintain $R_e > 1$.
  *   **The Conflict:** Cultural evolution tracks the fitness of the variant, not the host. A variant can spread even if it is virulent (harmful to the host), provided its transmission advantage outweighs the loss of hosts.

  **The Replicator Debate**
  *   **The Dawkins Position (Replicator):** To model this epidemiologically, we must identify a discrete, high-fidelity storage mechanism analogous to a genome. Without a distinct "cultural gene" that survives the death of the host, we cannot distinguish the agent from the host phenotype.
  *   **The Boyd-Richerson Position (Dual Inheritance):** We do not need to isolate the "genome." We can model the population dynamics of the infection directly. This is a co-infection model: hosts carry genetic pathogens (biological evolution) and cultural pathogens (cultural evolution) simultaneously. The two interact; genetic selection may favor hosts resistant to virulent cultural variants, while cultural variants may evolve to suppress genetic fitness.

  ***

  ### Residue Report

  This section categorizes which elements of cultural evolution translate cleanly into your epidemiological vocabulary, which require distortion, and which have no expression in standard infectious disease models.

  #### 1. Clean Maps (High Fidelity)
  *   **Transmission-Transmission Trade-offs:** The virulence trade-off hypothesis maps directly. A cultural variant that kills or incapacitates the host (high virulence) must have a sufficiently high transmission rate ($\beta$) to persist. Variants that rely on vertical transmission must be low-virulence to ensure host reproduction.
  *   **Herd Immunity:** Market saturation of a belief system functions exactly like herd immunity. When the proportion of susceptible hosts (those who do not hold the belief) drops below $1 - 1/R_0$, the variant cannot invade, regardless of its intrinsic transmissibility.
  *   **Vector-Borne Transmission:** Institutions (churches, schools, media) act as vectors. They do not generate the variant but mechanically transport it between hosts, altering the generation interval and expanding the contact network beyond direct physical proximity.
  *   **Superinfection Exclusion:** In many cases, acquiring one cultural variant (e.g., a specific religious identity) confers cross-immunity against competing variants, functioning like viral interference.

  #### 2. Distorted Maps (Requires Parameter Adjustment)
  *   **Host Susceptibility (Immunity):** In infectious disease, immunity is biological and often binary (immune/susceptible). In culture, "immunity" is cognitive (skepticism, prior beliefs) and continuous. A host can be partially infected or co-infected with contradictory variants without clearance. The "immune system" is plastic and can be downregulated by the pathogen itself (indoctrination reduces skepticism).
  *   **Mutation Rates:** Biological mutation is stochastic and generally deleterious. Cultural mutation is often directed (biased transmission). Hosts actively modify the variant to make it more "catchy" before re-shedding. This violates the assumption of random variation in standard evolutionary epidemiology.
  *   **Virulence Definition:** In infectious disease, virulence is host mortality or morbidity. In culture, "virulence" is often defined as reduction in *genetic* fitness (e.g., choosing not to reproduce), which may not correlate with host health or survival. A host can be highly "virulentized" (culturally) while remaining biologically healthy.

  #### 3. Null Sets (No Epidemiological Expression)
  *   **Cumulative Culture (The Ratchet Effect):** This is the largest gap. In epidemiology, co-infection usually leads to competition (strain displacement) or recombination (new strain). It rarely leads to *functional scaffolding*. In culture, a new variant (calculus) builds upon a previous variant (algebra) to increase the host's capacity. In your vocabulary, this would require a model where Infection B cannot exist without Infection A, and the presence of both increases the host's ability to transmit *both*. Standard SIR models do not account for infections that upgrade host hardware.
  *   **Active Host Seeking:** In infectious disease, the host typically avoids infection. In cultural evolution, hosts often actively seek infection (learning). This inverts the contact function $c$. The host expends energy to increase $\beta$, effectively acting as a co-conspirator in their own infection.
  *   **Blending Inheritance:** Biological pathogens do not blend; you are infected with Strain A or Strain B. Cultural traits blend (averaging). If Host A has trait value 1 and Host B has trait value 3, the "offspring" trait is often 2. This requires a quantitative genetics model, not a strain-based compartmental model.

  ***

  ### Interpretation of the Residue

  The residue indicates three distinct conclusions regarding the theory, your vocabulary, and the substantive disagreements in the field.

  **1. The Limitation of the "Passive Host" Assumption**
  The null set regarding **Active Host Seeking** and **Cumulative Culture** suggests that standard epidemiological models (SIR, SEIR) are insufficient not because cultural evolution theory is wrong, but because infectious disease models typically treat the host as a passive vessel. The residue indicates that cultural evolution requires an *eco-evolutionary feedback loop* where the infection alters the host's behavior to increase contact rates ($c$). The "missing" element in the Darwinian theory of culture is not a mechanism, but a dynamic parameter: host agency. When you model the host as an active agent seeking to optimize their own "infection load," the distinction between pathogen and mutualism blurs.

  **2. The Replicator Debate is a Modeling Choice, Not an Ontological Dispute**
  The dispute between the Dawkins school (replicators) and the Boyd-Richerson school (dual inheritance) maps onto the distinction between **mechanistic** and **phenomenological** modeling in epidemiology.
  *   **Dawkins** demands we sequence the virus (identify the discrete meme) before modeling the outbreak.
  *   **Boyd-Richerson** argue we can model the outbreak dynamics (population-level prevalence) without isolating the specific genetic sequence of the idea.
  The residue suggests this is less a substantive disagreement about reality and more a disagreement about the necessary resolution of the model. If you are modeling $R_e$, you do not need a replicator concept. If you are modeling mutation fidelity, you do. The "replicator" is simply the assumption that the cultural variant has a discrete storage state with low mutation rates.

  **3. Cumulative Culture Breaks the "Pathogen" Ontology**
  The inability to map **Cumulative Culture** cleanly indicates a hard boundary in your vocabulary. In epidemiology, the pathogen is distinct from the host. In cumulative culture, the "pathogen" becomes part of the host's operating system (cognitive toolkit).
  *   **Judgment:** This is not a failure of cultural evolution theory, but a limit of the infectious disease analogy. When a cultural variant becomes a tool (e.g., language, math), it ceases to be a parasite competing for resources and becomes a symbiont expanding the host's niche.
  *   **Implication:** To model this in your vocabulary, you would need to move from *Infectious Disease Dynamics* to *Symbiogenesis*. You would need to model the "infection" as a horizontal gene transfer that permanently alters the host's genome (cognitive architecture), allowing for new transmission pathways.

  **Summary:**
  The Darwinian theory of culture translates robustly into your vocabulary regarding transmission dynamics, network structure, and virulence trade-offs. The residue reveals that the theory is not missing a mechanism, but your vocabulary assumes a passive host and a competitive pathogen environment. Where culture involves active host modification and symbiotic scaffolding (cumulative culture), the epidemiological model must be expanded to include host-driven transmission enhancement and obligate co-infection dependencies. The "replicator" debate is merely a question of whether your model requires discrete strain tracking or aggregate prevalence rates.
