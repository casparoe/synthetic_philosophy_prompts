          4.  Discuss the implications for the auction (risk assessment).
          5.  Provide a recommendation (sample or avoid).

      *   *Drafting - Section 1 (Introduction):* Start by validating their confusion. It's a famous problem. The fact that they arrived at different values using logical steps is the point.
      *   *Drafting - Section 2 (The Math):* Explain that uniformity is not invariant under transformation. If $s$ is uniform, $s^3$ is not. If $s^3$ is uniform, $s$ is not. Since we don't know the physics of the production, we can't choose the "natural" variable.
      *   *Drafting - Section 3 (The Verdict):* None are right. The assumption of uniformity is an assertion of knowledge they don't have. It's a "prior" without evidence.
      *   *Drafting - Section 4 (The Decision):* The reserve price is the kicker. It sits between the Partner and Machinist. If the Machinist is right, you lose money. If the Partner is right, you make some. But without data, the risk is asymmetric.
      *   *Drafting - Section 5 (Recommendation):* Don't bid based on theory. Try to sample. If not, bid below the worst-case valuation or pass. Given the reserve is $2,600 and the Machinist says $1,300, bidding at reserve is gambling.

