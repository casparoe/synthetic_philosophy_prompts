answer: |-
  **VAUNT MUTUAL INSURANCE LTD.**
  *Ashenreach Division | Claims Adjustment Bureau*
  **Claim Reference:** 8940-B [Onyx Drake Deletion]
  **Date:** 14th of Frostfall, Cycle 4
  **Recipient:** User ID #7734-H (Hereinafter "The Claimant")

  **NOTICE OF CLAIM DENIAL**

  Dear Claimant,

  Vaunt Mutual has completed its review of your petition regarding the loss of the rare flying mount designated "Onyx Drake" following the server rollback of October 12th. Pursuant to the Terms of Service and End User Liability Agreement (EULA) accepted upon account creation, we are compelled to deny coverage. This decision rests on the following policy clauses regarding the ontology of virtual assets and the scope of insurable harm.

  **I. Nature of Property (Clause 14.B)**
  The policy defines "destruction" as the permanent removal of physical matter from existence. The Onyx Drake is not matter, but an arrangement of data the Company remains free to rearrange. The rollback did not destroy the Drake; it merely reverted the server state to a prior configuration. As the underlying code remains intact within our archives, no object was destroyed, only modified. To claim otherwise is to confuse the map with the territory.

  **II. Rarity and Replicability (Clause 3.C)**
  You assert the Drake was "rare." However, rarity implies scarcity. Since the Developers retain the capacity to mint unlimited identical tokens of the Drake type, your specific token cannot possess unique value. If an object can be perfectly reproduced by the creator, the loss of a single instance is negligible. Nothing rare was lost because nothing unique was held.

  **III. Insurable Interest (Clause 5.A)**
  We acknowledge the Drake was purchased with real currency. However, ownership of unreal objects cannot confer a real insurable interest. Fiat currency exchanged for digital licenses grants access, not property rights. You purchased a service experience, not a thing. Therefore, the loss of the thing cannot be compensated by real funds, as the thing was never real to begin with.

  **IV. Acts of God (Clause 9.1)**
  The rollback resulted from a botched patch. Per Section 9, patch notes, rebalancing, and server maintenance are classified as Acts of God. The Developers stand to their creation as nature stands to us: their will is natural law. A storm is not liable for sinking a ship; likewise, a patch is not liable for deleting a mount. To sue the Developer is to sue the weather.

  **V. Avatar/Player Distinction (Clause 11.4)**
  Your claim cites "distress" suffered during the loss. Policy dictates that harm to an avatar is not harm to the player. The avatar is a puppet; the player is the hand. If the puppet is burned, the hand feels no pain. Your login credentials remain intact; therefore, you are unharmed.

  We note the log transcripts indicate three hundred hours of labor were invested in the mount's acquisition. We note the guild convened in the Plaza of Whispers to mourn the loss. The distress recorded in your chat logs was, regrettably, authentic. However, authenticity does not constitute liability. Sentiment is not a covered asset class.

  **VI. Required Documentation**
  To proceed with any further inquiry, you must submit Form 88-Z (Affidavit of Ontological Continuity). On this form, you must state whether the Drake existed prior to the rollback and explain, in your own words, the difference between deletion and retroactive non-occurrence. Please be advised that contradictory statements regarding the temporal existence of the asset may void your account.

  **Appeal Process**
  Should you wish to contest this denial, you may file a Notice of Appeal with the Board of Arbiters. Please note that per Policy 1.0, the Board convenes exclusively within the Shattered Zone instance. Verdicts are rendered in binary and possess no causal efficacy outside the client software. Any decision reached exists only in-game.

  We trust this clarifies the matter.

  Sincerely,

  **Adjuster K-7**
  *Vaunt Mutual Claims Division*
  *"Reality is Subject to Patch Notes"*
