      *(Refining the Circularity Point)*: The book says Hume assumes uniformity to prove uniformity. A scholar would say: Hume assumes uniformity *based on past evidence* to evaluate *new evidence*. It's not circular; it's inductive. The miracle claimant is the one asking us to discard massive inductive evidence based on weak testimonial evidence.

