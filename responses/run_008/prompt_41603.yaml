answer: |-
  # JOINT STATEMENT ON THE ONTOLOGICAL STATUS OF PROPOSITIONAL ATTITUDES

  **Signatories:**  
  *The Eliminative Materialist (EM)*  
  *The Realist about Propositional Attitudes (RPA)*

  **Date:** October 26, 2023  
  **Subject:** Consensus and Dissensus Regarding Folk Psychology and Cognitive Ontology

  Following a period of adversarial collaboration, we submit this joint statement to clarify the ground shared between eliminative materialism and realism regarding propositional attitudes (beliefs, desires, etc.). While we remain divided on the ultimate ontology of the mind, we have identified significant methodological agreements and isolated the precise empirical and conceptual cruxes that sustain our disagreement.

  ### I. AGREED CLAIMS

  1.  **Physicalist Commitment:** Both parties affirm a naturalistic, physicalist ontology. There is no commitment to substance dualism or non-physical mental substances. All cognitive phenomena supervene upon physical processes.
  2.  **Theory-Theory of Folk Psychology:** Both parties agree that Folk Psychology (FP) functions as a theoretical framework. It is not merely a pragmatic skill or a narrative device; it carries ontological commitments regarding the existence of discrete, causally efficacious internal states (beliefs, desires) that possess semantic content.
  3.  **The Status of the Self-Refutation Objection:** Both parties agree that the standard self-refutation objection ("To assert eliminativism is to *believe* it, therefore beliefs exist") is not a logical truism independent of empirical premises. Its force is contingent upon the prior assumption that the act of theoretical assertion necessarily instantiates the specific ontological categories posited by Folk Psychology.
  4.  **The Phlogiston Analogy:** Both parties agree that the analogy between 'belief' and 'phlogiston' is illustrative rather than demonstrative. Its applicability depends entirely on whether mature cognitive neuroscience reveals a structural continuity with FP (supporting reduction/realism) or a structural discontinuity (supporting elimination).
  5.  **Normativity and Rationality:** Both parties agree that any successor theory to FP must account for the normative constraints on human behavior (rationality, consistency) that FP currently tracks, even if the mechanisms explaining those constraints differ radically.
  6.  **Empirical Arbitration:** Both parties agree that the dispute is not resolvable by conceptual analysis alone. The ultimate arbiter is the progress of empirical cognitive science, specifically neurobiology and computational modeling.

  ### II. RESIDUAL DISAGREEMENTS AND CRUXES

  The following table isolates the precise points of divergence. For each crux, we specify the kind of evidence both parties accept as relevant, and we record our divergent predictions regarding emerging frameworks (specifically Connectionism and Predictive Processing).

  | Issue | Eliminative Materialist (EM) Stance | Realist about Propositional Attitudes (RPA) Stance | Admissible Evidence / Argument | Divergent Predictions (Connectionism & Predictive Processing) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Natural Kind vs. Disjunctive Kind** | 'Belief' fails to name a natural kind. It is a heterogeneous disjunction (like 'jade' or 'witch'), lacking a unified causal structure. Neuroscience will fragment the category. | 'Belief' names a functional natural kind. Even if multiply realized, it picks out a robust causal role invariant across physical substrates. | **Evidence:** Successful cross-context generalization in cognitive models; Neural mapping of semantic content.<br>**Argument:** Whether 'belief' clusters in neural state-space or scatters. | **EM:** Models will show distributed, sub-symbolic processing where no discrete state corresponds to a specific belief. 'Belief' will fragment into distinct neurocomputational kinds.<br>**RPA:** Models will show functional modules or stable attractor states that map isomorphically to propositional attitudes, preserving the category despite sub-symbolic implementation. |
  | **2. Marr's Levels & Vindication** | Computational-level descriptions are heuristic fictions if they lack implementational grounding. If neuroscience does not find sentence-like structures, 'belief' is eliminated, regardless of computational utility. | Computational-level autonomy is sufficient for realism. If the intentional stance predicts behavior at the algorithmic/computational level, the posits are real, even if the implementation is non-classical. | **Evidence:** Explanatory power of high-level models independent of neural detail; Success of 'reverse engineering' the mind.<br>**Argument:** Whether explanatory indispensability at the computational level entails ontological commitment. | **EM:** Predictive Processing (PP) will show that 'priors' are not belief-like representations but weighting parameters in a hierarchical error-minimization system.<br>**RPA:** PP priors *are* the neural realization of beliefs. The mathematical structure of Bayesian inference vindicates the reality of credences and propositional attitudes. |
  | **3. Reference Fixation (Verbal vs. Substantive)** | 'Belief' rigidly designates the specific structural posits of Folk Psychology (e.g., sentence-like vehicles). If those structures don't exist, the term refers to nothing. | 'Belief' designates the functional role. If neuroscience finds states that play the belief-role (causing behavior via content), they are beliefs, even if structurally unlike FP posits. | **Evidence:** Historical case studies of theory change (e.g., 'gene', 'atom').<br>**Argument:** Whether reference is fixed by description (functional role) or by causal-historical link to specific structures. | **EM:** This is a substantive dispute about the world's structure, not just language. Changing the definition hides the elimination.<br>**RPA:** Part of this is verbal. If we agree on the functional role, calling it 'belief' or 'neuro-functional-state-X' is terminological. |

  ### III. NOTE ON MERELY VERBAL DISPUTES

  We identify one area where the dispute is partially verbal, though it rests upon a substantive disagreement regarding **reference fixation**.

  *   **The Verbal Component:** If the RPA defines 'belief' as *"whatever internal state plays the causal role of mediating input and output in a rational manner,"* and the EM defines 'belief' as *"a discrete, sentence-like representational vehicle as posited by classical Folk Psychology,"* the parties may talk past one another. If neuroscience finds states that fit the RPA definition but not the EM definition, the RPA will claim vindication and the EM will claim elimination.
  *   **Why it is not *merely* verbal:** The verbal disagreement masks a substantive disagreement about the **structure of cognitive architecture**. The EM claims the world does not contain states that fit the RPA's functional description in a unified way (the functional kind is gerrymandered). The RPA claims the world does contain such states. Therefore, while the *label* 'belief' is negotiable, the question of whether there exists a **unified functional kind** corresponding to that label is an empirical, substantive matter.

  ### IV. CONCLUSION

  We conclude that the debate is not dead, but it has shifted from armchair metaphysics to empirical adjudication. The EM bets on fragmentation and discontinuity in cognitive neuroscience. The RPA bets on robustness and functional autonomy. We commit to updating our respective credences based on the success of next-generation cognitive architectures in preserving or dissolving the intentional stance.

  ***

  **Signed,**

  _________________________  
  *The Eliminative Materialist*

  _________________________  
  *The Realist about Propositional Attitudes*
