answer: |-
  1. This project asks whether accepting the simulation argument undermines or amplifies longtermist priorities, contingent on whether moral value is located at our level, aggregated across all levels, or exclusively at base reality. It investigates how these loci of value interact with the probability of being in a nested simulation to determine net ethical impact.
  2. Existing literature treats the simulation argument as ethically neutral metaphysics, failing to distinguish how value localization affects astronomical waste reasoning. Consequently, longtermists cannot determine if their efforts are hostage to simulators or critical for pleasing them.
  3. We will model expected value under distinct value-localization axioms rather than assuming base reality or ignoring the hypothesis entirely. This outperforms alternative approaches by exposing hidden leverage points instead of dismissing simulation scenarios as irrelevant or paralyzing.
  4. The output will be a decision framework that allows funders to stress-test grants against simulation hypotheses without requiring belief in them. This enables robust career planning that remains viable whether we are in base reality or a nested simulation.
  5. The project fails if it demonstrates that expected value depends entirely on inscrutable facts about simulator motives, rendering the analysis action-guiding only for beings outside our epistemic position. I prioritize this honest negative result over a false positive, as knowing the inquiry is futile saves resources better spent elsewhere.
