      *   *Premise (5) analysis:* It claims the convergence point *is* the Theater. Dennett says the Theater is the *myth* that there is a place where things *become* conscious. In MDM, things are already "conscious" (in the functional sense) in various drafts before the final report. The report bottleneck doesn't create consciousness; it just selects one draft for verbalization.
