  Subject: Re: Berkeley, Bitcoin, and the three-hour argument

  Dear friend,

  First, let me say that I am sorry to hear about the silence on the drive home, though I must admit the image of a three-hour debate over George Berkeley ending in a stony silence is rather fitting for the eighteenth century. Philosophical friendships have always been fraught, and Berkeley himself was no stranger to controversy, though usually over theology rather than cryptocurrency. I have read through your summary of the argument carefully, and I want to validate your intuition immediately: your framing of Berkeley's economics is actually quite sharp, and you have grasped the core thrust of The Querist much better than your friend has grasped the core thrust of his metaphysics. To give you the verdict straight away, I am firmly on your side. Your friend's reading is indeed a lazy one, conflating digital immateriality with philosophical idealism in a way that Berkeley would have found category-confused, whereas your focus on the circulation of credit and the stimulation of industry hits the exact nerve of Berkeley's economic project. However, since you asked for a careful reconstruction rather than just a ruling, I want to walk through exactly why this is the case, where the tensions lie, and what a Berkeley scholar might nitpick about this conclusion.

  To understand why your friend's argument fails, we have to clear up a common misunderstanding about Berkeley's idealism. When Berkeley argues that esse est percipi, or "to be is to be perceived," he is not making a claim about physical versus digital substance. He is making a claim about the nature of reality itself. For Berkeley, a gold coin is no more "material" than a Bitcoin entry. Both are collections of sensory ideas or signs that exist only insofar as they are perceived by minds and ultimately sustained by the mind of God. The physical gold of a coin has no intrinsic power or value in Berkeley's metaphysics any more than the silicon of a server does. Therefore, the fact that Bitcoin is "dematerialized" does not make it any closer to Berkeley's philosophy than a gold doubloon. Berkeley had already dematerialized money conceptually long before computers existed. In his view, money is a sign, a ticket, a counter. The substance is irrelevant; the signification is what matters. Your friend is treating Berkeley's idealism as if it were a prophecy of the digital age, but it is actually a metaphysical claim about perception that applies equally to paper, metal, and pixels. So, the metaphysical allure of Bitcoin is a red herring. Berkeley would not care that Bitcoin is immaterial, because he believes everything accessible to us is, in a sense, immaterial ideas.

  Where your argument holds significant weight is in the economic function of money, which is where Berkeley's practical philosophy actually lives. You are correct that in The Querist, Berkeley treats money not as wealth itself but as a claim on labor and goods. He was writing in the context of an Ireland that was economically strangled by English policy, where wealth was drained away and the local population was left in idle poverty. His solution was to create a national bank that would issue paper credit based on the land and labor potential of Ireland. The crucial mechanism here is velocity. For Berkeley, money that sits still is dead money. It fails to perform its function as a ticket to mobilize industry. He wanted to put credit into the hands of people who would use it to build, farm, and manufacture, thereby creating the actual goods that give money its value. This is why he was suspicious of hoarding and why he viewed the accumulation of gold and silver by the wealthy as detrimental if it removed circulating media from the economy.

  When we apply this to Bitcoin, the conflict becomes stark. Bitcoin's design is fundamentally deflationary; it has a fixed supply cap that encourages holding rather than spending. The cultural phenomenon surrounding it, often termed "HODLing," is precisely the kind of hoarding behavior Berkeley diagnosed as a disease. If money is a ticket to labor, Bitcoin functions more like a collector's item or a speculative asset that people lock away in hopes of future appreciation. It does not inherently incentivize productive industry in a specific nation, nor does it facilitate the circulation of credit to the industrious poor. In fact, its volatility and deflationary nature often discourage its use as a medium of exchange for daily goods, which was Berkeley's primary requirement for money. He wanted money to flow like blood in a body, nourishing the limbs; Bitcoin often acts more like a clot, accumulating in digital wallets while the real economy stagnates. Furthermore, Berkeley was a nationalist in his economics. He wanted to keep wealth within Ireland to build up Irish industry. Bitcoin is borderless and facilitates capital flight, allowing wealth to escape the national jurisdiction entirely, which would have horrified Berkeley given his goal of strengthening the specific economic body of Ireland against English drainage.

  This brings us to Central Bank Digital Currencies, or CBDCs, which you mentioned as a contrast. Here, the reconstruction becomes even more favorable to your side. A CBDC is essentially a digital version of the national bank credit Berkeley proposed. It is state-backed, tied to a specific national economy, and potentially programmable to ensure it is used for productive ends rather than speculative hoarding. Berkeley argued for a bank that would issue notes based on the value of land and labor, effectively creating money out of the productive potential of the nation. A CBDC operates on a similar logic of state-managed credit designed to facilitate exchange within a jurisdiction. While Berkeley might have concerns about the specific implementation or the moral character of the modern state issuing them, the structural logic aligns much more closely with his vision than decentralized cryptocurrency does. He trusted authority, specifically the authority of responsible elites and the church, to guide the economy toward the public good. He was not a libertarian; he was a moralist who believed economy was subordinate to ethics. A state-issued digital currency that could be managed to stimulate employment and industry fits his model of a paternalistic economic guidance much better than a decentralized, anarchic ledger.

  However, I want to be honest about where this reconstruction is shaky, because a specialist might push back on certain points. The area of greatest uncertainty is Berkeley's view on interest and profit versus his moral theology. Berkeley was a bishop, and he was deeply concerned with the moral hazards of wealth. While he wanted money to circulate, he was also wary of the corruption that comes with complex financial instruments. He might view the speculative frenzy of crypto not just as economically unproductive, but as a form of gambling that distracts the soul from God and virtue. On the other hand, he might view CBDCs as too much state control, potentially enabling tyranny, though given his support for a national bank, he likely saw state management as necessary for the common good. The specific interpretive choice I am making here is prioritizing The Querist over his theological writings. A scholar might argue that Berkeley's ultimate goal was the salvation of souls, and if Bitcoin allowed for greater individual liberty or reduced state corruption, he might tolerate it. But given his explicit writings on economics, the evidence suggests he prioritized the material conditions necessary for a virtuous society, which required employment and circulation.

  Another point of contention is the international aspect. Berkeley was writing in a mercantilist era where national wealth was often seen as zero-sum. Bitcoin challenges this by being a global currency. If Berkeley were convinced that a global currency could facilitate a global improvement in industry and reduce war over resources, he might pivot. However, his focus was intensely local and practical; he wanted to fix Ireland, not the world. So, unless you could show evidence that Berkeley believed in a global commonwealth over national sovereignty, the nationalist argument holds. The evidence that would genuinely flip my verdict to your friend's side would be if Berkeley placed a higher value on the conventional agreement of money than on its circulation. If he argued that the value of money is purely whatever people agree it is, regardless of whether it circulates or hoards, then Bitcoin's social consensus would win. But The Querist is explicit that money is only valuable insofar as it stirs industry. Without industry, the ticket is worthless. Therefore, the consensus behind Bitcoin is, for Berkeley, a consensus to hoard, which negates the purpose of the ticket.

  So, to summarize the verdict clearly: you are right, and your friend is wrong. Your friend's argument relies on a superficial reading of Berkeley's metaphysics that ignores his actual economic theory, while your argument aligns with the functional purpose Berkeley assigned to money. Berkeley would likely view Bitcoin as a speculative idol, a digital gold that encourages the very hoarding and idleness he sought to cure in Ireland. He would likely view a Central Bank Digital Currency as a tool that, in the right hands, could fulfill his dream of a national bank issuing credit to stimulate labor. The commitment doing the real work here is not his idealism, but his moral economics: the belief that wealth is only real when it translates into the lived well-being and industry of the people. The part of this reconstruction I am least sure about is how he would weigh the moral risks of state power in a CBDC versus the moral risks of speculation in Bitcoin, but given his trust in hierarchical authority to guide the public good, I suspect he would side with the state instrument over the market anarchy. I hope this helps you break the silence, though I cannot promise your friend will be any happier to hear that a eighteenth-century bishop would reject their favorite asset class.

  Warmly,

  Your Historian Friend
