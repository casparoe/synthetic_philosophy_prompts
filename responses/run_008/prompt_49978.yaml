      *Refining the Verdict:* The verdict should be that labeled nudges are acceptable *because* they shift the objection from manipulation to policy preference.

      *Refining the Mind Changer:* Be specific about the premise. Maybe the premise that "transparency reduces manipulation" is wrong if cognitive load is too high.

