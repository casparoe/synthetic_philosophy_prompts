      *   **Tone:** Casual but rigorous.
      *   **Length:** Under 600 words.

  2.  **Deconstruct the Arguments:**
      *   *Argument 1 (Pro-Label):* Disclosure kills the nudge. It becomes a recommendation because people know they're being steered.
      *   *Argument 2 (Anti-Label):* Defaults work on inertia, not ignorance. Labeling doesn't stop the bias. It's just honest paternalism.
      *   *Paternalism Badness:*
          *   (a) Deception: Labels fix this.
          *   (b) Bypassing Deliberation: Labels might not fix this (inertia remains).
