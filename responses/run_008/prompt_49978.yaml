      The "nutrition label for nudges" idea is fascinating. It forces us to pinpoint exactly what smells rotten about paternalism. Is it the lie, the laziness, or the bossiness?

      If the sin is (a) deception, labeled nudges are innocent. The state is saying, "We want you to do X." But if the sin is (b) bypassing deliberation, labels don't help much. Behavioral science suggests defaults work via inertia, not ignorance. Knowing you're being steered doesn't always give you the energy to uncheck the box. The cognitive cost of opting out remains, label or no label. Similarly, if the sin is (c) substitution of judgment, the label admits guilt rather than pardoning it. The government still decided what's best for you; they just put a sticker on it.

      This brings us to the "inevitability" objection. A form must have a pre-checked box or an empty one. Neutrality is impossible; even a random coin-flip default is a policy choice. If the state must choose, why not choose the one that maximizes welfare? In this light, *all* defaults are paternalistic, but not all are manipulative. The distinction isn't between steering and not steering; it's between steering secretly and steering openly.

