  The "nutrition label for nudges" idea forces us to pinpoint exactly what smells rotten about paternalism. Is it the lie, the laziness, or the bossiness?

  Consider the claim that labeling turns a nudge into a recommendation. This is empirically shaky. Defaults work via inertia, not ignorance. Knowing you're being steered doesn't always give you the energy to uncheck the box. The cognitive cost of opting out remains, label or no label. So, the mechanism remains a nudge, not a rational recommendation.

  If the sin of paternalism is (a) deception, labeled nudges are innocent. But if the sin is (b) bypassing deliberation or (c) substitution of judgment, the label admits guilt rather than pardoning it. The government still decided what's best for you; they just put a sticker on it.

  This is where the "inevitability" objection matters. A form must have a pre-checked box or an empty one. Neutrality is impossible; even a random coin-flip default is a policy choice. If the state must choose, why not choose the one that maximizes welfare? In this light, *all* defaults are paternalistic, but not all are manipulative. The distinction isn't between steering and not steering; it's between steering secretly and steering openly.

  Here's the verdict: Labeled nudges are acceptable, and the labeling makes them meaningfully better, not just cosmetic. The primary danger of nudging isn't that it influences behavior—it's that it insulates policy choices from democratic contestation. An unlabeled default hides the value judgment behind a veneer of administrative neutrality. It treats citizens like subjects to be managed. A labeled nudge treats citizens like stakeholders to be convinced. It transforms the interaction from psychological manipulation to policy negotiation. By forcing the government to state its goal ("to raise donation rates"), the label invites public scrutiny on whether that goal is worthy, rather than just whether the trick worked. It shifts the burden from "why are you hiding this?" to "why do you want this?"

  Therefore, labeled nudges are legitimate. They acknowledge the inevitability of defaults while rejecting the arrogance of invisibility. They preserve the welfare benefits of steering without the democratic deficit of secrecy. The inevitability objection doesn't undermine the case for labels; it rescues it. Since we cannot eliminate the steering, we must regulate its transparency.

