answer: |-
  Yes, there is a single principle that accommodates all six of your verdicts. It is the principle underlying the **Uniform Determination of Death Act (UDDA)**, refined by the concept of **organic integration**.

  Your intuitions are not inconsistent; they are actually more philosophically robust than your friend's "consciousness" view. Your friend is arguing for a *personhood* definition of death (you are dead when the "someone" is gone). You are arguing for a *biological organism* definition of death (you are dead when the living body ceases to function as a whole).

  Here is the principle that delivers your verdicts, followed by the application to your cases and the pregnant woman scenario.

  ### The Principle: Permanent Loss of Organic Integration

  **A human being is dead when there is the permanent cessation of the capacity for spontaneous organic integration, evidenced by either:**
  1.  **The irreversible cessation of all functions of the entire brain, including the brainstem;** OR
  2.  **The irreversible cessation of circulatory and respiratory functions.**

  **Crucial Clarification on "Irreversible/Permanent":** In this context, "irreversible" does not mean "physically impossible to reverse by any technology in the universe." It means **"will not be reversed"** given the physiological context and the medical plan. Cessation is permanent if the function will not return spontaneously *and* no intervention will be undertaken to restore it.

  ---

  ### How the Principle Delivers Your Verdicts

  **1. Ventilated Brain-Dead Patient: DEAD**
  *   **Clause:** Brain Criterion.
  *   **Work:** The brainstem is the body's central integrator. It regulates breathing, temperature, and hormonal balance. Without it, the body is a collection of tissues, not an organism. The ventilator provides oxygen, but the *organism* cannot integrate it.
  *   **Verdict:** Matches your confidence.

  **2. Permanent Vegetative State (PVS): ALIVE**
  *   **Clause:** Brain Criterion (Negative).
  *   **Work:** In PVS, the cortex is damaged (no consciousness), but the **brainstem is intact**. The patient breathes spontaneously, digests food, and cycles sleep/wake. The organism is still integrating itself biologically, even if the "person" (in the psychological sense) is gone.
  *   **Verdict:** Matches your confidence. This distinguishes you from your friend.

  **3. Anencephalic Infant: ALIVE**
  *   **Clause:** Brain Criterion (Negative).
  *   **Work:** This resolves your "wobble." The criterion is not "amount of brain tissue" but "critical integrative function." Anencephalic infants lack a cortex, but as you noted, they have a **brainstem** and breathe on their own. They are biologically integrating organisms. Case (1) is dead because the *stem* is gone; Case (3) is alive because the *stem* remains.
  *   **Verdict:** Consistent with (1) once you shift from "Whole Brain Mass" to "Brainstem Function."

  **4. DCD Donor (Heart stopped 5 mins): DEAD**
  *   **Clause:** Circulatory Criterion.
  *   **Work:** The heart has stopped. It will not restart spontaneously. Crucially, by protocol, **no intervention will be attempted** to restart it (because organs are being retrieved). The cessation is therefore *permanent* in this context.
  *   **Verdict:** Matches your comfort.

  **5. Cardiac Arrest (Resuscitation Ongoing): ALIVE**
  *   **Clause:** Circulatory Criterion (Negative).
  *   **Work:** The heart has stopped, but the cessation is **temporary**. Interventions *are* being undertaken to restore integration. Until the decision is made to stop, the loss of function is not permanent.
  *   **Verdict:** Matches your judgment.

  **6. Hypothermic Hiker: ALIVE**
  *   **Clause:** Circulatory Criterion (Negative).
  *   **Work:** This resolves your collision with (4). In (4), the heart won't restart *and* we won't make it. In (6), the heart won't restart *spontaneously*, but it **can and will be restarted** via rewarming. The metabolic suspension means the *capacity* for integration is paused, not destroyed. The cessation is not permanent.
  *   **Verdict:** Consistent with (4) once "Permanent" is understood as "Will not be reversed" rather than "Cannot be reversed."

  ---

  ### The Pregnant Woman Case

  **The Scenario:** A pregnant woman satisfies the whole-brain criterion (brainstem dead), but her body is maintained on ventilators and hormones for four months to gestate the fetus.

  **The Verdict:** **She is dead.**

  **Application of the Principle:**
  Under the **Brain Criterion**, she has lost the capacity for spontaneous organic integration. Her heart beats and her uterus expands, but these are not *her* spontaneous functions. They are the result of external machinery (ventilator) and pharmacological intervention (hormones) artificially maintaining somatic functions. The "integrator" (her brainstem) is gone.

  **Does this make her death depend on what her body is being used for?**
  **No.** This is the critical distinction.
  *   **Her Status:** Her death is determined solely by the loss of brain function. This status does not change whether she is pregnant, single, organ-donating, or lying in a morgue. She is dead in all those scenarios.
  *   **The Treatment:** The *decision to maintain somatic support* depends on the fetus. If she were not pregnant, the support would be withdrawn, and her circulation would cease (confirming death via the Circulatory Criterion). Because she is pregnant, the support continues.

  **The Philosophical Cost:**
  You must accept that a dead organism can be artificially manipulated to support a living parasite (the fetus). This feels uncanny, but it is biologically coherent. The fetus is alive because *it* has integrative capacity (eventually); the mother is dead because *she* has lost it. The machines are doing the work of the dead mother's brainstem.

  If you were to declare her **alive** solely because she is gestating, you would break your principle. You would be saying that "Life = Utility to Another." That would force you to declare the PVS patient (Case 2) dead if no one found her useful, or the anencephalic infant (Case 3) dead if you decided to harvest its organs. To keep your six verdicts stable, you must maintain that **biological integration defines life, not function.**

  ### Summary

  You do not need to discard any of your verdicts. Your "wobbles" arise from confusing **anatomy** (how much brain?) with **function** (does the stem work?), and confusing **physiological possibility** (could we fix it?) with **clinical permanence** (will we fix it?).

  **Your Principle:** Death is the permanent loss of the body's capacity to function as an integrated whole.
  **Your Stance:** You are a **Biological Integrationist**. You believe life is a property of the organism, not the consciousness.

  This position is defensible, legally standard in the US and many other jurisdictions, and it successfully navigates all six of your cases without contradiction. It requires you to accept that death is not always a instantaneous biological event, but sometimes a judgment about the *permanence* of biological failure—but that is a feature of medicine, not a bug of your philosophy.
