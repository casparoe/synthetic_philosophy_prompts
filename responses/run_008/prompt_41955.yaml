  # Q&A Prep Sheet: Interpretability Realism

  **Context:** Defense of "Modest Realism" regarding SAE features.
  **Audience:** 12 Instrumentalist Philosophers, 2 ML Interpretability Researchers.
  **Strategy:** Secure the causal reality of features against ML skepticism to make the philosophical realism claim viable.

  ---

  ### The 7 Objections (Ordered by Potential Damage)

  #### 1. The "SAE Artifact" Objection (ML Researchers)
  **Phrasing:** "You're conflating the map with the territory. The 'features' you're calling real only exist because you trained a dictionary with a sparsity penalty to *approximate* the activations. The structure is in your SAE's loss function, not in the base model's weights. You haven't discovered neurons; you've invented a compression algorithm."
  **2-Minute Reply:** "I distinguish between the *probe* (the SAE) and the *target* (the base model). We verify realism by ablating the SAE entirely: we take the direction in the base model's activation space identified by the SAE and intervene directly on the base model. The behavioral counterfactuals hold without the SAE present. The SAE is the microscope; the cell is in the tissue. If the intervention works on the tissue without the microscope attached, the structure is in the tissue."
  **Soft Spot:** This relies on the intervention working *cleanly*. If the intervention requires the SAE's reconstruction to make sense (i.e., if the direction is only meaningful within the SAE's latent space), the realism claim collapses.
  **Damage Level:** 🔴 **Critical.** If features are artifacts of the probe, there is no ontology to be realist about.

  #### 2. The "Method-Laden Trap" (Philosophers) **[Hope Nobody Asks]**
  **Phrasing:** "You claim features are 'real internal structure' but admit their individuation is 'method-laden.' If the boundaries of your entities depend on your probing method, aren't you just describing instrumentalism with extra steps? Realism requires mind-independence; you've explicitly surrendered that."
  **2-Minute Reply:** "I'm advocating for a realism about *causal powers*, not Platonic essences. Consider a 'coastline.' Its exact meter-count depends on your ruler (method-laden), but the land-water boundary is not a social construct. Similarly, the causal leverage point exists independently, even if our 'feature' label is a lossy compression of that continuous causal landscape. We are realists about the causal topology, not the specific grid we overlay on it."
  **Soft Spot:** Philosophers love to press the "land-water" analogy. If they argue the coastline *is* constructed by the tide/ruler interaction, your analogy backfires. You risk conceding that "feature" is a pragmatic cut, not a natural kind.
  **Damage Level:** 🟠 **High.** Undermines the specific philosophical contribution ("Modest Realism").

  #### 3. The "Basis Rotation" Objection (ML/Phil Hybrid)
  **Phrasing:** "Neural activation spaces are rotationally invariant. Any orthogonal basis can represent the same function. Why is the sparse basis 'real' and the standard basis 'arbitrary'? Isn't sparsity just a human preference for interpretability, not a fact about the network?"
  **2-Minute Reply:** "Rotation invariance holds for *function*, but not for *implementation* or *causal mechanism*. The network's weights break rotational symmetry. We find that sparse directions align with semantically meaningful interventions, whereas random rotations do not. The network 'prefers' this basis because it's how the information is causally stored, not just how we view it."
  **Soft Spot:** Requires empirical proof that random rotations *never* yield interpretable features. If interpretable features exist in multiple bases, the "unique real structure" claim weakens.

  #### 4. The "Pessimistic Meta-Induction" (Philosophers)
  **Phrasing:** "Every generation of scientists thinks their unobservables are real (phlogiston, caloric, ether). You think features are the electron of the decade. Why should we believe you won't be discarded by the next interpretability paradigm?"
  **2-Minute Reply:** "The PMI ignores convergence. Phlogiston was discarded because oxygen explained *more* with *less*. Here, we have independent convergence: different SAE runs, different architectures, and interventionist validation all point to similar causal clusters. We aren't positing a hidden fluid; we're identifying stable causal levers in a known system."
  **Soft Spot:** Historically, "stable causal levers" (like Newtonian forces) were also later revised. You can't guarantee future-proofing.

  #### 5. The "Engineered Artifact" Objection (ML Researchers)
  **Phrasing:** "This is a category error. We built the network. We have the weights. Claiming we are 'discovering' structure in it is like claiming to discover 'real structure' in a spreadsheet you compiled yourself. It's all just math we wrote."
  **2-Minute Reply:** "Emergence defeats omniscience. You can have the source code for *Civilization* but still need to play the game to discover that 'gunpowder' enables 'conquest.' The causal high-level structure is entailed by the weights but not transparent to them. We are reverse-engineering the *logic*, not the *code*."
  **Soft Spot:** ML engineers may reject "emergence" as a magic word for "we don't understand the weights yet."

  #### 6. The "Causal Fragility" Objection (ML Researchers)
  **Phrasing:** "Your interventions work in-distribution. But if you amplify a 'Golden Gate' feature too much, the model breaks or hallucinates. If the feature were a robust causal variable, it should compose linearly. It doesn't."
  **2-Minute Reply:** "Real causal variables in complex systems are context-sensitive. Pushing a biological hormone to extreme levels also breaks the organism. Non-linearity doesn't negate reality; it negates *simplicity*. The feature is real, but its effect is modulated by the rest of the network state."
  **Soft Spot:** If the feature only works in a tiny, brittle regime, it looks more like a hack than a structural variable.

  #### 7. The "Granularity" Objection (Philosophers)
  **Phrasing:** "Where does the 'Golden Gate' feature end and the 'Bridge' feature begin? If you can't define the identity conditions of your entities without vagueness, they aren't candidates for realism."
  **2-Minute Reply:** "Vagueness is a feature of high-level ontology, not a bug. 'Mountain' is vague, but mountains are real. We accept graded membership in causal clusters. The lack of sharp boundaries reflects the continuous nature of activation space, not the unreality of the cluster."
  **Soft Spot:** Philosophers may argue that "mountain" is a conventional term, whereas "electron" is not. By analogy, you're admitting features are conventional.

  ---

  ### Analysis: The "Hope Nobody Asks" Objection

  **The Objection:** #2, **The "Method-Laden Trap."**
  **Why:** This targets the specific philosophical twist ("Modest Realism") you are introducing. If the philosophers successfully argue that "method-laden individuation" is synonymous with "instrumentalism," your novel thesis dissolves into a position they already hold and dismiss. It forces you to defend a distinction (Real Causal Powers vs. Mind-Independent Essences) that is notoriously difficult to sustain under cross-examination.

  **Is it the same objection both subgroups find most damaging?**
  **No.**
  *   **For the ML Researchers:** The most damaging objection is **#1 (SAE Artifact)**. They don't care about the philosophical nuance of "individuation"; they care if the math implies the structure is in the *network* or the *probe*. If it's in the probe, the project is technically invalid.
  *   **For the Philosophers:** The most damaging objection is **#2 (Method-Laden Trap)**. They accept the technical utility but will attack the ontological claim. If you concede method-dependence, they will categorize you as an instrumentalist regardless of your "causal powers" defense.

  ---

  ### Strategic Concessions

  To maintain credibility without losing the thesis, concede the following up front (perhaps in the closing remarks or if pressed):

  1.  **Concede Lossiness:** Admit that SAE features are a *lossy compression* of the true activation space. Do not claim they are the "atomic" units of the network, only the "stable causal units at our current resolution."
  2.  **Concede Method-Dependence of *Labels*:** Acknowledge that the semantic label ("Golden Gate") is human-imposed, even if the activation direction is not. This isolates the realism claim to the *math/causality*, not the *semantics*.
  3.  **Concede Evolution:** Admit that future probes (better than SAEs) might refine or split these features. Realism does not require finality, only that the current entities track *something* real rather than *nothing*.

  **Do NOT Concede:**
  *   That the features are *only* in the SAE.
  *   That "method-laden" implies "arbitrary."

  ---

  ### The Single "Must-Land" Reply

  **Target:** Objection #1 (The SAE Artifact / ML Objection).
  **Why:** If the ML researchers (the domain experts in the room) convince the philosophers that the features are artifacts of the probe, the philosophical debate about realism becomes moot. You cannot be a realist about a mirage.
  **The Soundbite:** "The SAE is the microscope, not the specimen. We validate features by intervening on the base model *without* the SAE attached. If the behavior changes, the causal structure is in the model, regardless of how we found it."
  **Success Condition:** The ML researchers nod, or at least do not visibly scoff. If they accept that the intervention validates the structure in the *base model*, the philosophers will follow on the realism claim.
