      *   **Goal:** Argue hedonism survives because structural features can support aggregation/comparison just as well as qualitative tones.
      *   **Specific Questions:**
          *   (a) Does this dissolve the heterogeneity problem or relocate it? (Is "presenting as worth continuing" itself heterogeneous?)
          *   (b) Is the intensity/comparability problem the deeper issue? How to measure "insistence" without conflating it with obsession/craving?
          *   (c) Is there a fatal objection to building a pro-attitude into phenomenal character (the "feel" vs. "directive" distinction)?
          *   **Constraint:** If the strategy is a dead end, say so plainly and suggest a better path for a hedonist wanting aggregation.

  2.  **Evaluate the Core Thesis (The "Recommendatory Account"):**
