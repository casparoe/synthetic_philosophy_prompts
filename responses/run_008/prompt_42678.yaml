prompt: |-
  I run a weekend math study group for undergrads, all of whom have done linear algebra and a first proofs course. Next session is on Zorn's lemma, because they keep running into it in textbooks — every vector space has a basis, every proper ideal sits inside a maximal one — and just treating it as a black box labeled "accepted on faith." I want to actually unpack it. Plan the session for me, don't just explain the lemma.

  What needs to be in place first — I'm guessing partial orders, then chains, then upper bounds, but tell me if even that order is wrong and why. Which example should carry the whole thing? I'm torn between using the vector space basis case they've already seen black-boxed, and the "every partial order can be extended to a linear order" version, which feels cleaner but less familar to them — say something about what the carrying example has to do and what it's better off not doing.

  Then the misconceptions. I know from experience that someone will conflate "maximal element" with "greatest element," and someone else will try to prove the lemma by saying "just keep adding elements until you can't anymore" — which is half a real proof and half a trap, and I honestly don't know which half to emphasize. Where in the sequence should I head each of those off, and are there other misconceptions I'm not anticipating (my guess is something around whether the upper bound has to already be inside the chain, but I might be off)?

  Also: how do I handle the inevitable person who asks why we can't just do induction on this? Is there a one-sentence honest answer or do I need to say more, and if more, how much?

  I want a closing question I can ask to check whether the idea actually landed rather than them nodding along. And tell me what I should openly punt on given ninety minutes — the equivalence with the axiom of choice, ordinals, whatever — and whether I should actually mention that we're punting or just quietly skip it.
