prompt: |-
  So I sit on the board of a mid-sized private research foundation, and at next month's meeting we have to vote on the biggest commitment in the foundation's history: a roughly 12-year, $180M program to develop and run a regional soil-carbon monitoring network — hundreds of sensing sites, a shared data platform, farmer partnerships, the works. The vote is basically greenlight / kill / greenlight with conditions, and I'm supposed to circulate a written opinion before the meeting that actually recommends one of these.

  Here's the fight we keep having, and it's basically the inside view vs the outside view dressed up in grant-committee clothing. Our internal technical committee — genuinely excellent people, two of whom have run large field programs before, and who have lived inside this proposal for two years — says the plan is solid: risk register is thorough, the pilot sites performed, and they put success odds around 70%. Our external review panel did a base-rate style analysis instead: they looked at how big multi-site environmental monitoring and large ag-tech partnerships have historically gone (cost overruns, sites dropping out, data platforms that never become interoperable, farmer participation collapsing after year three) and put our odds closer to 20%. Then it gets recursive, because of course it does: the technical committee's rebuttal is that the reference class is wrong — our program is bottom-up, the pilot de-risked the hard part, the sensing tech is mature now. And the panel counters that this is exactly what every insider group says, and the fact that they say it every time is itself part of the base rate. There's also a modesty problem layered on top: half our board thinks the whole point of paying for an external panel is that we should basically defer to it whenever it disagrees with insiders (we're not smarter than the aggregate of comparable programs), and the other half thinks that policy is self-defeating — if the inside view never counts for anything, we'd never have funded anything, including the two programs that are now the foundation's crown jewels.

  Please draft the memo I'll circulate. It needs a concrete recommendation (including, if you go for "greenlight with conditions," conditions that a board could actually vote on — staged funding gates, kill criteria, whatever), not a survey of the epistemology. But I want the epistemology done for real, because people will smell it if I hand-wave: when, if ever, should the inside view be allowed to move you off the base rate, and what does "our case is different" have to prove before it counts? Is deferring to the panel epistemic modesty or just an excuse for not thinking? And be fair to the losing side of whatever you recommend — the strongest version of the argument you're voting against, not a strawman. Keep it to something the board will actually read. Also if you think our whole way of framing it (two views, pick a weighting) is confused, say so and tell us what the framing should be instead — but you still have to tell us how to vote.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Board member of a mid-sized private research foundation.
      *   **Task:** Draft a written opinion/memo for the board regarding a $180M, 12-year soil-carbon monitoring network proposal.
      *   **Decision:** Greenlight / Kill / Greenlight with Conditions (must recommend one).
      *   **Core Conflict:** Inside View (Technical Committee: 70% success odds) vs. Outside View (External Panel: 20% success odds based on base rates).
      *   **Secondary Conflict:** Epistemic Modesty (defer to external panel) vs. Agency (inside view matters, or we never fund anything).
      *   **Requirements:**
          *   Concrete recommendation (with actionable conditions if applicable).
          *   Rigorous epistemological handling (don't hand-wave the Inside/Outside view tension).
          *   Steelman the losing side (fair to the argument not taken).
          *   Readable length (board will actually read it).
          *   Critique the framing if necessary (but still vote).

  2.  **Deconstruct the Epistemological Problem:**
      *   *The Outside View (Base Rate):* Large ag-tech/monitoring projects historically fail (20% success). This is the prior.
      *   *The Inside View (Specifics):* Pilot worked, tech is mature, team is experienced. This is the likelihood/update.
      *   *The Bayesian Update:* You start with the base rate (20%). You only move away from it if the specific evidence is *strong enough* to overcome the prior.
      *   *The Trap:* Insiders *always* claim their case is special. That claim itself has a base rate of being wrong (optimism bias).
      *   *The Solution:* You don't just "weight" them 50/50. You treat the Outside View as the *anchor* and demand specific, verifiable evidence to move the needle. The "Greenlight with Conditions" option is the natural bridge here. It acknowledges the base rate risk (by limiting exposure initially) while allowing the Inside View to prove itself (by unlocking funds upon milestones).

  3.  **Determine the Recommendation:**
      *   *Kill:* Too conservative. Ignores the pilot success and the foundation's mission. If the foundation never takes risks, it fails its purpose.
      *   *Greenlight:* Too risky. $180M is "biggest commitment in history." 12 years is an eternity. If the base rate holds, we waste $144M.
      *   *Greenlight with Conditions:* The Goldilocks zone. It respects the base rate (by acknowledging high failure risk) and respects the inside view (by allowing the specific team to prove they are the exception).
      *   *Specific Conditions:* Staged funding (tranches), hard kill criteria (not just "review," but "terminate if X"), and independent verification of milestones (not self-reported).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** State the recommendation immediately. Board members are busy.
      *   **The Decision:** "Greenlight with Conditions" (Staged Commitment).
      *   **The Epistemology (The "Why"):** This needs to be the meat. Address the Inside/Outside view debate directly.
          *   Acknowledge the External Panel is right about the *prior*.
          *   Acknowledge the Tech Committee is right about the *potential update*.
          *   Explain why "deferring to the panel" is actually *immodest* (it assumes we can't learn).
          *   Explain why "trusting the team" is dangerous (planning fallacy).
          *   *Key Insight:* The Outside View tells us *how* to fund (cautiously), not *whether* to fund.
      *   **Steelman the Opposition:**
          *   If recommending "Conditions," I need to respect the "Kill" argument (the External Panel's implicit lean) and the "Full Greenlight" argument (Tech Committee's desire for certainty).
          *   Actually, the prompt asks to be fair to the *losing side of whatever I recommend*. If I recommend "Conditions," the losing sides are "Full Greenlight" and "Kill." I should focus on the strongest alternative, which is likely "Kill" (given the massive financial risk) or "Full Greenlight" (given the mission). Let's focus on the tension between the two main camps. I will frame the "Kill" argument as the strongest alternative because $180M is a lot.
      *   **The Conditions (Actionable):**
          *   Tranche 1 (Years 1-3): Proof of scaling.
          *   Tranche 2 (Years 4-7): Proof of retention/interop.
          *   Tranche 3 (Years 8-12): Full deployment.
          *   *Kill Switches:* Specific metrics (e.g., farmer dropout rate > X%, data latency > Y).
          *   *Governance:* Independent auditor for milestones, not the Tech Committee.
      *   **Conclusion:** Reiterate the vote.

  5.  **Refining the Tone:**
      *   Needs to be authoritative but collaborative.
      *   Avoid academic jargon where possible, but don't dumb down the probability reasoning.
      *   Show respect for both the Tech Committee and the External Panel.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "when does inside view move the needle" question?
      *   *Fix:* Yes, explicitly state that inside view evidence must be *falsifiable* and *verified* to move the needle. Pilot data counts, but promises don't.
      *   *Check:* Is the recommendation concrete?
      *   *Fix:* Ensure the conditions are vote-able (e.g., "Release of funds contingent on...").
      *   *Check:* Did I critique the framing?
      *   *Fix:* Add a section noting that "Inside vs. Outside" is a false dichotomy; it's actually "Prior vs. Evidence."

  7.  **Final Polish:** Check word count and flow. Ensure the "modesty" argument is nuanced (blind deference is lazy, but ignoring base rates is arrogant).

  *(Self-Correction on the "Losing Side"):* If I recommend "Greenlight with Conditions," the strongest opposing view is probably "Kill." Why? Because $180M is huge. If the base rate is 20%, the expected value might be negative depending on the upside. I need to make sure I acknowledge that a "Kill" vote is rational risk management, not just pessimism. Conversely, the "Full Greenlight" side argues that conditions create administrative drag that *causes* failure. I should acknowledge that too. I will focus on the "Kill" argument as the primary counterweight because of the financial magnitude.

  8.  **Finalizing the Memo Structure:**
      *   To/From/Subject/Date.
      *   Recommendation (Bottom Line Up Front).
      *   The Core Tension (Inside/Outside).
      *   Why "Deference" is the Wrong Frame.
      *   The Proposal (Staged Funding).
      *   Fairness to the "Kill" Argument.
      *   Voting Language.

