answer: |-
  Your friend's consequentialism collapse objection is the single most dangerous threat because it undermines the distinct normative value of the reactive attitudes themselves. If you cannot explain why we need resentment specifically, rather than just any effective behavioral tool, your forward-looking justification consumes the phenomenon it aims to save. The retributivists will smell instrumentalization immediately, and if you concede that the attitudes are merely tools, you lose the moral force required to justify punishment over mere quarantine or conditioning.

  **1. The Consequentialism Collapse (Friend/Retributivists)**
  **Objection:** "If the justification for resentment is purely forward-looking calibration, why shouldn't we bypass the attitude entirely whenever a more efficient tool exists? You've reduced moral blame to a social technology, which means you haven't justified blame; you've justified manipulation."
  **Reply:** "I distinguish between the *justification of the practice* and the *internal logic of the attitude*. While the practice is justified by its social function—maintaining a community of accountable agents—the attitude itself cannot be swapped for a 'more efficient tool' because the function *requires* participation in the moral relationship. Resentment communicates a demand for regard; a purely technical intervention does not. If we replace resentment with conditioning, we stop treating agents as participants in a normative community and start treating them as objects to be fixed. The forward-looking justification preserves the attitude because the attitude is the only medium capable of conveying the expectation of goodwill. We aren't using people as means; we are engaging them as ends who are capable of understanding and modifying their conduct based on shared norms. The calibration works *because* it is experienced as a moral demand, not a causal lever."
  **Soft Spot:** The distinction between a "moral demand" and a "causal lever" is thin if the ultimate metric is behavioral outcomes.
  **Concede:** Concede that if calibration fails consistently, the attitude loses its justification in that specific context, but maintain that the *type* of justification remains non-instrumental regarding the person's status.

  **2. The Manipulation/Respect Objection (Retributivists)**
  **Objection:** "You say this isn't manipulation, but if I resent you to shape your character rather than because you deserve it, aren't I using your emotional pain as a means to my social end? That violates the Kantian constraint inherent in criminal law."
  **Reply:** "Manipulation implies bypassing the agent's rational capacity to respond to reasons. My account relies precisely on the agent's capacity to recognize the resentment as a reason-giving fact. When I express resentment, I am inviting you into a dialogue about our shared expectations. I am not hiding my intent; the signal is transparent. The pain involved is not inflicted as a cost imposed from the outside, but arises from the recognition of a ruptured relationship that the agent has the power to repair. Respect is shown by holding you capable of responding to moral reasons, even if the ultimate goal is future harmony. To withhold resentment would be to treat you as incapable of moral understanding, which is the true insult to dignity."
  **Soft Spot:** Hard determinism suggests the agent's capacity to "respond" is itself determined, weakening the claim of genuine dialogue.
  **Concede:** Acknowledge that on hard determinism, no interaction is free from causal influence, but argue that *reason-responsive* influence is morally distinct from *coercive* influence.

  **3. The Proportionality Problem (Retributivists)**
  **Objection:** "Desert provides a limit on punishment: you cannot punish more than is deserved. If resentment is just a calibration signal, what stops us from amplifying it to maximize behavioral correction? Where is the limiting principle?"
  **Reply:** "The limiting principle is the scope of the expectation itself. Resentment is calibrated to the degree to which an expectation was violated, not the utility of correcting it. If I resent you proportionally to the breach of goodwill, I cannot legitimately escalate that resentment to achieve a greater future good without breaking the communicative link. Excessive resentment signals that I no longer view you as a peer but as a project, which undermines the calibration mechanism. The 'signal' loses its integrity if it is inflated. Therefore, the internal logic of the reactive attitude imposes a proportionality constraint mirroring desert, even if the foundational justification is forward-looking."
  **Soft Spot:** Empirically, people do escalate blame for deterrent effects, suggesting the internal logic is fragile.
  **Concede:** Admit that without a cultural commitment to the integrity of the signal, the limit is vulnerable, which is why this theory requires a supportive legal culture.

  **4. The Phenomenological Mismatch (Legal Psychologist)**
  **Objection:** "My data shows juries experience blame as inherently backward-looking. They report feeling resentment because of what was done, not for what it will achieve. Are you prescribing a theory of blame that no human being actually experiences?"
  **Reply:** "I am not denying the phenomenology; I am offering an interpretation of its function. Humans often operate with implicit rationales that differ from their explicit experience. We feel hunger as a desire for food, but its biological function is homeostasis. Similarly, we feel resentment as a verdict on the past, but its social function is future calibration. This doesn't make the feeling fake; it means the feeling is designed to be compelling enough to enforce norms. Acknowledging the forward-looking function doesn't require jurors to lie about their feelings, only to understand that the legitimacy of those feelings rests on their role in sustaining a normative community going forward."
  **Soft Spot:** If the phenomenology is strictly backward-looking, convincing people to accept a forward-looking justification may be psychologically impossible.
  **Concede:** Concede that legal instructions cannot ask jurors to suppress their natural phenomenology, but argue that sentencing guidelines can reflect the forward-looking limit.

  **5. The Neuroscience Abolitionism (Grad Students)**
  **Objection:** "If readiness-potential literature suggests decisions are made before consciousness, why keep the painful attitudes at all? Why not replace blame with therapeutic intervention? You're keeping the superstition without the metaphysics."
  **Reply:** "Because the social reality of agency exists independently of the metaphysical status of causation. Even if my decisions are determined, I am still the locus where environmental inputs meet behavioral outputs. Reactive attitudes are part of that environment. Removing them doesn't stop determinism; it changes the causal inputs to a less effective set. Therapeutic intervention works on pathology, but most crime is not pathological; it is normative failure. Abolishing blame removes the primary mechanism by which communities negotiate norms. We keep the attitudes not because they prove libertarian free will, but because they are indispensable tools for social coordination among beings who experience themselves as agents."
  **Soft Spot:** If neuroscience proves agency is an illusion, the "social reality" argument looks like a convenient fiction.
  **Concede:** Acknowledge that if neuroscience proves we cannot respond to reasons, the theory collapses, but maintain current evidence only shows determinism, not reason-insensitivity.

  **6. The "Wrong Kind of Reason" Objection (Retributivists/Philosophers)**
  **Objection:** "You're giving me the wrong kind of reason for resentment. I should resent you because you wronged me, not because resenting you helps society. That confuses the reason for the attitude with the benefit of having it."
  **Reply:** "I agree that the *content* of resentment is backward-looking—it responds to a wrong. But the *justification for maintaining the capacity* for resentment is forward-looking. This is a two-level view. At the level of interaction, I resent you because you violated a norm. At the level of reflection, we endorse this practice because it sustains the norm. This avoids the paradox of trying to resent someone *in order to* calibrate them, which would be insincere. We cultivate the attitude for its utility, but deploy it sincerely. This preserves the integrity of the emotion while grounding its moral permission in social good."
  **Soft Spot:** Critics may argue that knowing the ultimate justification is utilitarian corrupts the sincerity of the deployment.
  **Concede:** Concede that public dissemination of this theory risks undermining the sincerity of the attitudes, so it must be handled as a theoretical justification, not a jury instruction.

  **7. The Incapacitated Agents Objection (Legal Theorists)**
  **Objection:** "Your calibration model relies on the target's ability to adjust expectations. How do you justify resentment toward psychopaths or severe cognitive impairments who cannot calibrate? Retributivism excuses them; your view seems to punish them for utility."
  **Reply:** "On my account, the target of the reactive attitude shifts. When an agent cannot participate in the normative community, resentment is inappropriate because the calibration mechanism is broken. We move to a management stance, not a moral one. This aligns with current insanity defenses. The justification for reactive attitudes is contingent on the capacity for reciprocal expectation. If that capacity is absent, the justification dissolves. This prevents the consequentialist slide into punishing the innocent or incapacitated simply for deterrence, because the *condition* for the attitude is the capacity for moral response, not just the presence of dangerous behavior."
  **Soft Spot:** Determining the threshold of "capacity" is legally and scientifically messy.
  **Concede:** Admit that the boundary is fuzzy, but argue that the fuzzy boundary is better than a system that punishes based solely on risk assessment.

  **8. The Strawson Fidelity Objection (Philosophers)**
  **Objection:** "Strawson explicitly argued these attitudes are beyond rational justification. Aren't you just hijacking his terminology to push a compatibilist agenda he would have rejected?"
  **Reply:** "Strawson argued they are beyond justification *from the outside*, by metaphysical theories. He didn't say they lack a social rationale. He wanted to save them from skeptical dissolution, not from functional analysis. I am extending his naturalism. He said we couldn't abandon the attitudes; I am explaining why we shouldn't. This isn't a betrayal of Strawson but a completion of his project. He cleared the ground of metaphysical skepticism; I am building a normative structure on that ground. The core insight—that we are committed to these attitudes by our nature—remains intact, even if we add a layer of rational defense regarding their deployment."
  **Soft Spot:** Strawson purists may view any rational justification as missing his point about the non-rational foundation of human life.
  **Concede:** Concede that Strawson might resist the rationalization, but argue that in a legal context, we require more than naturalistic inevitability; we require normative defense.

  **The One Question I Hope Nobody Asks**
  "If your view is correct, should we lie to defendants about why they are being punished to maximize the calibration effect, telling them it's about desert when it's really about character formation?"
