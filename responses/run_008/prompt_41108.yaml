answer: |-
  # Lesson Plan: The Luring Lottery Simulation
  **Course:** Upper-Level Seminar on Rational Choice and Collective Action  
  **Class Size:** 14 Students  
  **Duration:** 75 Minutes  
  **Topic:** Nash Equilibrium vs. Superrationality in Collective Action Dilemmas  

  ## Learning Objectives
  1.  Experience the tension between individual rationality (Nash Equilibrium) and collective optimality.
  2.  Test the efficacy of cheap talk (pre-play communication) vs. structural incentives.
  3.  Critically evaluate "Superrationality" (Hofstadter) as a distinct mode of reasoning versus disguised altruism.
  4.  Understand the methodological limitations of classroom simulations compared to formal game theoretic assumptions.

  ## Materials Needed
  *   **Tokens:** 14 sheets of paper per student (to record decisions) or a simple digital poll (Qualtrics/Google Forms). *Paper is preferred for secrecy.*
  *   **Whiteboard:** To track round results and payoff calculations.
  *   **Prize Pool:** A visible "bank" of points (e.g., written as 1,400 Course Points).
  *   **Randomizer:** A 14-sided die or random number generator app to select the winner.

  ---

  ## Payoff Structure (The "Luring Lottery")
  *   **The Pot:** 1,400 Points.
  *   **The Rule:** Any student may choose to **Enter** or **Stay Out**.
  *   **The Draw:** If $n$ students enter, one entrant is drawn uniformly at random.
  *   **The Prize:** The winner receives $1,400 / n$. All others receive 0.
  *   **The Outside Option:** Staying Out yields 0 points.
  *   **The Math:**
      *   **Individual Expected Value (EV):** $\frac{1}{n} \times \frac{1,400}{n} = \frac{1,400}{n^2}$.
      *   **Collective Expected Value (Sum of all EVs):** $n \times \frac{1,400}{n^2} = \frac{1,400}{n}$.
  *   **The Dilemma:**
      *   **Nash Equilibrium:** Since $\frac{1,400}{n^2} > 0$ for any finite $n$, entering is a strictly dominant strategy. **Prediction:** All 14 enter. ($EV \approx 7.1$ points each).
      *   **Social Optimum:** Collective value is maximized when $n=1$. **Prediction:** Exactly 1 enters. ($EV = 1,400$ for that one, 0 for others, but highest total utility).

  ---

  ## Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Introduction & Framing (10 mins)
  *   **Hook:** "Today we are testing whether rational agents can solve a coordination problem without a central authority."
  *   **The Script (Crucial for Validity):**
      > "For this simulation to work, you must adopt the mindset of the model. Imagine these points are real money. Imagine you will never see these classmates again after this hour. Imagine no social reputation is at stake. You are anonymous agents in a one-shot game. Do not look at each other for cues. Do not signal. Your goal is to maximize your own points."
  *   **Verify Understanding:** Walk through the math on the board. Ask: "If 13 others enter, and you enter, what is your EV?" (Answer: $1/14 \times 100 = 7.1$). "If you stay out?" (Answer: 0). "So you enter?" (Yes).

  ### 0:10 – 0:20 | Round 1: The Baseline (10 mins)
  *   **Condition:** Strict silence. No communication. Private decisions.
  *   **Action:** Students write "IN" or "OUT" on a slip. Collect them.
  *   **Calculation:** Count $n$. Calculate prize per winner ($1400/n$). Draw winner. Record payoffs on board.
  *   **Expected Outcome:** High entry rate (likely 10–14 students).
  *   **Observation:** Note the low individual EV compared to the potential 1,400.

  ### 0:20 – 0:35 | Round 2: Cheap Talk (15 mins)
  *   **Condition:** 5 minutes of open public discussion allowed before voting. Decisions remain private/non-binding.
  *   **Prompt:** "You may try to coordinate. You may make promises. But remember: the vote is secret, and the promise is not legally binding."
  *   **Typical Dynamic:** Students will propose "Only one person should enter." They may volunteer or suggest drawing lots.
  *   **Action:** 5 min discussion, 5 min voting, 5 min reveal/calc.
  *   **Expected Outcome:** Entry rate drops, but rarely hits 1. Some will "defect" on the promise, reasoning "If others hold back, my chance of winning is huge."
  *   **Observation:** Did trust hold? Did someone lie to secure the pot?

  ### 0:35 – 0:50 | Round 3: Institutional Design (15 mins)
  *   **Condition:** Introduce an **Entry Fee** of 100 points. (Deducted from payoff regardless of win/loss).
  *   **New Math:**
      *   If $n=14$: EV = $7.1 - 100 = -92.9$ (Loss).
      *   If $n=1$: EV = $1,400 - 100 = 1,300$ (Gain).
      *   If $n=0$: No winner, 0 payoff.
  *   **Prompt:** "The rules have changed. Entering is now costly. Discuss briefly how this changes your strategy, then vote."
  *   **Action:** 5 min discussion, 5 min voting, 5 min reveal/calc.
  *   **Expected Outcome:** Entry rate should drop significantly. Might oscillate around $n=1$ or $n=2$.
  *   **Observation:** This changes the *Nash Equilibrium*. It is no longer dominant to enter.

  ### 0:50 – 1:15 | Debrief & Theory (25 mins)
  *   **Part 1: The Data (5 mins)**
      *   Compare $n$ across rounds.
      *   Ask Round 2 defectors: "Why break the promise?" (Answer: Incentive to deviate was too high).
      *   Ask Round 3 abstainers: "Why stay out?" (Answer: Payoff structure changed).
  *   **Part 2: Nash vs. Superrational (15 mins)**
      *   **Nash Reasoning:** "I take the actions of others as fixed parameters. Given that 13 others are entering, my best response is to enter."
      *   **Superrational Reasoning (Hofstadter):** "I am not unique. My opponents are rational agents facing the same problem. If I conclude 'Enter' is rational, they must conclude the same. Therefore, my decision *predicts* theirs."
      *   **The Superrational Move:** In Round 1, a superrationalist reasons: "If I enter, everyone enters ($n=14$). If I stay out, everyone stays out ($n=0$). Neither is good. I must adopt a *mixed strategy* (e.g., roll a die: enter on 1, stay out on 2-6) to probabilistically achieve $n=1$."
      *   **Discussion Question:** "Is Superrationality just altruism in disguise?"
          *   *Argument for Altruism:* You stay out to let others win.
          *   *Argument for Rationality:* You stay out because you realize your reasoning is correlated with theirs. You aren't sacrificing for them; you are avoiding the logical consequence of universal defection.
  *   **Part 3: Methodological Candor (5 mins)**
      *   Discuss why the simulation is "impure."
      *   **The Facilitator's Bridge:** "In theory, this is a one-shot, anonymous game. In reality, you sit next to each other. You care about your grade relative to peers. You can read faces. A true test requires double-blind anonymity and stakes that matter (real money). However, the *logic* of the tension remains visible even if the *behavior* is noisy."

  ---

  ## Facilitator Notes & Candid Limitations

  ### 1. The "One-Shot" Illusion
  **The Problem:** In a classroom, students know they will see each other next week. Round 1 is not truly one-shot; it is the first round of an iterated game. They may cooperate early to build reputation for later rounds.
  **The Fix:** Explicitly state in the intro: *"Treat this as the only interaction you will ever have with this group. Do not strategize for future classes."* Acknowledge in the debrief that this instruction is likely impossible to fully obey, which is why Round 1 often shows *more* cooperation than a true Nash prediction (some stay out).

  ### 2. The "Points" Problem
  **The Problem:** Course points are not liquid cash. The marginal utility of 1,400 points vs. 7 points may not feel distinct enough to trigger "rational" greed.
  **The Fix:** Use the debrief to ask: "If this were $1,400 vs $7 cash, would you have lied in Round 2?" This highlights the difference between *preference* (which might be flat for points) and *incentive structure*.

  ### 3. Superrationality vs. Altruism
  **The Trap:** Students often conflate "cooperating" with "being nice."
  **The Distinction:**
  *   **Altruist:** Stays out because they want *someone else* to win. (Preference transformation).
  *   **Superrationalist:** Stays out (or randomizes) because they recognize that "Enter" is a losing argument if universally adopted. They maximize their own utility by reasoning as a member of a class of identical reasoners. (Epistemic transformation).
  *   **Press Point:** Ask the class: "If you knew for a fact that your decision had *no causal or correlational link* to anyone else's (a magic spell ensured you were unique), would a Superrationalist still stay out?"
      *   *Answer:* No. A Superrationalist defects if they know they are the only one reasoning that way. This proves it is not altruism; it relies on the symmetry of reasoning.

  ### 4. Round 3 (Incentives) Warning
  Introducing the entry fee changes the game from a **Prisoner's Dilemma/Luring Lottery** (Dominant strategy to defect) to a **Coordination Game/Chicken** (Multiple equilibria).
  *   **Teaching Point:** Use this to show the limits of "moral suasion" (Round 2) vs. "institutional design" (Round 3). Communication cannot change payoffs; rules can. But rules require enforcement (the fee must be collectible).

  ## Suggested Board Layout

  | Round | Condition | Entrants ($n$) | Prize per Winner | Individual EV | Collective EV | Outcome |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Silent | 14 | 100 | 7.1 | 100 | Tragedy |
  | **2** | Talk | 6 | 233 | 38.8 | 233 | Partial Coop |
  | **3** | Fee (-100) | 1 | 1300 | 1300 | 1300 | Success |

  *(Note: Round 3 numbers are hypothetical; adjust based on actual class result)*

  ## Closing Statement for the Instructor
  "Today you saw that rational choice theory predicts a suboptimal outcome (Round 1). You saw that talk is cheap when incentives contradict promises (Round 2). You saw that changing the rules changes the behavior (Round 3). But the deepest question remains: Is it rational to act as if your choice dictates the choices of others (Superrationality), or is that a logical fallacy? Nash says fallacy. Hofstadter says it's the only way to escape the trap. Your homework is to decide which reasoning you would trust with your own money."
