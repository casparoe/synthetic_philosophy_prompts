answer: |-
  This is a remarkably sharp connection. You have effectively mapped the AI safety distinction between **goal-directed** (maximize $U$ over time) and **approval-directed** (maximize $P(\text{human approves} | \text{action})$) agents onto the legal and economic theory of **Rules vs. Standards**.

  The tension you identify in human institutions isn't just historical accident; it is a calculated trade-off between *ex-ante certainty* and *ex-post accuracy*. However, the analogy breaks down in a critical place: the alignment of the approver.

  Here is a reconstruction of the implicit theory behind this mixed practice, what approval-based systems strictly require, and where the AI safety analogy illuminates—and obscures—institutional design.

  ### 1. What Approval-Based Design Presupposes

  When an institution chooses an approval model (IRB, Jury, Zoning Board) over a rule model (Sentencing Guidelines, EPA Thresholds), it is making three specific philosophical bets:

  1.  **The Codification Gap:** It presupposes that the "good" we are seeking is high-dimensional and contextual. Any rule simple enough to be written down will be either too broad (catching good cases) or too narrow (missing bad cases). This mirrors the AI safety fear of *specification gaming*: if you tell an AI "maximize human happiness," it might wirehead us; if you tell a regulator "keep pollution under 5ppm," they might dump toxins at 4.9ppm.
  2.  **Latent Wisdom:** It assumes the approver possesses tacit knowledge or moral intuition that cannot be algorithmically compressed. The "human in the loop" isn't just a safety switch; they are the *oracle* of value.
  3.  **The Gaming Assumption (The Weak Link):** You asked if this presupposes approvers can't be gamed. The answer is nuanced. It doesn't assume they *can't* be gamed; it assumes that **gaming the approver is harder than gaming the rule.**
      *   To game a rule, you only need to find the loophole in the text.
      *   To game an approver, you must manipulate a mind (via bribery, social pressure, or deception).
      *   *However*, this presupposes the approver is *aligned* with the institution's goal. If the approver is corrupt, the approval model collapses faster than the rule model because the "safety check" has become the vulnerability.

  ### 2. Is There a Coherent Theory? (Rules vs. Standards)

  Yes. In law and economics (most notably in the work of Louis Kaplow), this is the debate between **Rules** (goal-directed proxies) and **Standards** (approval-directed judgments).

  *   **Use Rules (Goal-Directed) when:**
      *   **Volume is high:** You cannot afford a committee meeting for every speeding ticket.
      *   **Conduct needs guidance:** Actors need to know *ex-ante* what is forbidden to plan their behavior (e.g., tax law).
      *   **Bias risk is high:** You distrust the discretion of the enforcer (e.g., mandatory minimums were originally sold as a way to reduce racial bias in sentencing, though they arguably created other rigidities).
      *   **The environment is stable:** The edge cases are known and can be codified.

  *   **Use Approval/Standards (Approval-Directed) when:**
      *   **Stakes are high:** One error is catastrophic (e.g., approving a gene therapy trial).
      *   **Context is king:** The morality of the act depends entirely on circumstances (e.g., self-defense, fair use in copyright).
      *   **Innovation is expected:** You are dealing with novel situations where no rule yet exists (e.g., AI safety itself, or new financial instruments).

  The "mixed practice" you see is not incoherent; it is an optimization of **administrative cost vs. error cost**. We use rules for the 99% of cases where the outcome is predictable, and approval mechanisms for the 1% where the stakes are too high or the context too complex for a formula.

  ### 3. Strict Requirements vs. Compatibilities

  If we reconstruct the approval-directed model strictly, separating what it *needs* from what it merely *tolerates*, we get the following:

  **Strict Requirements:**
  1.  **Alignment:** The approver must value the same outcome as the principal. (In AI: The human must actually be safe. In Institutions: The Jury must actually want justice, not revenge).
  2.  **Capacity:** The approver must have the time and cognitive bandwidth to evaluate the specific context. (This is why IRBs are slow; speed breaks the approval model).
  3.  **Authority:** The approver must have the power to veto. A "recommendation" is not approval.

  **Merely Compatible (Often Sacrificed):**
  1.  **Consistency:** Approval systems inherently produce variance. Jury A convicts; Jury B acquits on similar facts. The system tolerates this inconsistency as the price of contextual accuracy.
  2.  **Scalability:** Approval does not scale. You cannot add more IRBs indefinitely without diluting the quality of judgment or increasing coordination costs.
  3.  **Predictability:** Because the "rule" is inside the human's head, actors cannot easily predict the outcome.

  ### 4. If We Took the Argument Seriously: Institutional Reform

  If we accepted the AI safety premise—that goal specification is brittle and dangerous—and applied it rigorously to human institutions, we would see a shift away from **compliance** and toward **oversight**.

  **The Proposal:**
  You suggested judicial review of agency rules running like an IRB. Currently, courts ask: *Did the agency follow the statute?* (Rule-checking).
  An approval-directed court would ask: *Given the current context, is this specific application of power reasonable?* (Outcome-checking).

  **Implications:**
  1.  **Outcomes over Process:** We would care less about whether an agency followed the correct paperwork and more about whether the specific result was harmful. This is already happening in some "disparate impact" legal theories.
  2.  **Sunset Clauses as Default:** Since long-term goals are brittle, no regulation would be permanent. Every rule would require periodic "re-approval" by a human body to ensure it hasn't drifted into harmful optimization.
  3.  **Discretionary Budgets:** Instead of funding specific programs (goal-directed), governments might fund "problem areas" and let local committees approve specific interventions (approval-directed).

  ### 5. Where the Analogy Breaks

  This is the critical friction point. The approval-directed AI argument works only if the **Human Approver is the Ground Truth.**

  *   **In AI Safety:** We assume the human overseer is aligned with "humanity's best interests." The AI is the agent; the Human is the Principal.
  *   **In Institutions:** The "Approver" (Judge, Official, Juror) is *also* an Agent. The Principal is "The Public" or "The State."

  This creates a **Second-Order Alignment Problem**.
  If you give a zoning board approval-directed power, you solve the problem of "rigid rules failing to capture neighborhood nuance." But you create the problem of "zoning board members taking bribes from developers."
  In AI, we worry the AI will game the human. In institutions, we worry the human will game the system.

  **The Human Friction:**
  1.  **Fatigue:** An approval-directed AI doesn't get tired. A human judge on their 50th case of the day creates "decision fatigue," leading to harsher or more arbitrary rulings.
  2.  **Corruptibility:** You can bribe a human approver. You cannot (easily) bribe a hardcoded threshold.
  3.  **Inconsistency as Injustice:** In AI, variance in approval might be acceptable exploration. In law, variance is often defined as *inequality before the law*.

  ### Conclusion

  The mixed practice of our institutions is a **defense against the approver.**

  We use goal-directed rules (mandatory minimums, thresholds) not because we think they are morally superior, but because we distrust the *humans* who would otherwise be doing the approving. We sacrifice contextual accuracy to buy protection against bias, corruption, and fatigue.

  If you took the AI safety argument seriously for institutions, you would have to solve the **Principal-Agent problem** first. You would need approvers who are as tireless as algorithms but as wise as humans. Since we don't have those, we use rules to constrain the humans, and approval mechanisms only where the risk of the rule failing is higher than the risk of the human failing.

  The lesson for AI safety from institutions is: **Approval-directedness is only safe if the approver is secure.** If the human overseer can be coerced, tired, or deceived, the approval-directed agent becomes a weaponized yes-man. Therefore, institutional design suggests that "human in the loop" is not a silver bullet; it is merely shifting the vulnerability from the *code* to the *operator*.
