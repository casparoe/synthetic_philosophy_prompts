answer: |-
  **1. "The candidate rules"**

  Rule One is "Inherent Necessity." An artifact is political only if its physical design *requires* a specific power structure to function at all. Moses's bridges literally block buses; solar panels inherently decentralize energy production. QWERTY and hammers don't demand hierarchy or exclude groups by their geometry, so they're out. This is the strict Langdon Winner reading: politics baked into the hardware.

  Rule Two is "Historical Consequence." An artifact is political if its actual deployment significantly redistributed power or authority, regardless of design intent. The tomato harvester fits here because it broke unions in practice, even if you could theoretically imagine it used differently. This rule cares about what the tech *did* in the world, not just what it *is* in the abstract.

  Her tomato phrasing ("as it was actually deployed") hints Rule Two, but accepting Moses (a design argument) keeps Rule One in play. The tension lies in whether the politics must be baked into the steel or if it emerges from the history.

  **2. "What each rule says about the box"**

