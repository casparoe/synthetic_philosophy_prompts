prompt: |-
  I'm a program officer at a small regional foundation whose charter commits us to funding "scientific research and public understanding of science." We review perhaps forty proposals a quarter, most from independent researchers, citizen-science groups, and small nonprofits, and we have no scientific advisory board — just me and three trustees, none of whom have a philosophy of science background. A recurring problem is that we receive proposals that occupy the gray zone: rigorous-looking studies of questions with a pseudoscientific reputation, poorly designed studies of respectable questions, and theoretical programs that never seem to make contact with evidence. The trustees have asked me for a defensible way to draw the line, and I'd rather ground it in the actual demarcation literature than in my instincts.

  Please write a decision procedure we could actually run on an incoming proposal: the questions to ask in a fixed order, what counts as a sufficient answer to each, at which points the procedure terminates with a recommendation to decline, and — critically — which steps are genuinely mechanical versus which are judgment calls dressed up as procedure, so that when a trustee asks me to justify a decision I can say honestly where I exercised discretion. The procedure should be built around what falsificationism actually says — risky predictions, prohibitions, the response to refutation — but it should also incorporate what that view gets wrong or leaves open: the way auxiliary assumptions let a theory absorb failed predictions, the difference between a research program that is merely unproductive and one that is unscientific, and the fact that some clearly legitimate sciences (historical sciences, early-stage theory) don't fit the falsificationist template well. Where the philosophy is genuinely contested, say so and give us a default rule anyway.

  Then run the procedure on three proposals of the kind we actually see. First, a properly designed, preregistered, randomized controlled trial of a homeopathic remedy for a self-limiting condition, submitted by a licensed clinician with an adequate sample size calculation. Second, a request for three years of funding for a small theoretical physics group whose program has produced mathematically sophisticated results but no experimentally testable predictions in a decade. Third, a citizen-science project proposing to test whether pet dogs can anticipate their owners' epileptic seizures, run by volunteers with mentorship from a university statistics department. For each, show the procedure's output step by step, and identify any case where the procedure gives an answer I or the trustees are likely to find unwelcome, explaining whether that discomfort reveals a flaw in the procedure or a bias in us.

  Finally, state plainly what the procedure cannot do — the cases it will misclassify or leave unresolved, and where I simply have to make a value judgment and own it in the memo to the trustees. Keep the whole thing usable by someone with no philosophy background; the trustees will read only the procedure itself, not the theory behind it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Program Officer at a small regional foundation.
      *   **Mission:** "Scientific research and public understanding of science."
      *   **Constraints:** No scientific advisory board, 4 decision-makers (PO + 3 trustees), no philosophy of science background. ~40 proposals/quarter.
      *   **Problem:** Gray zone proposals (rigorous-looking pseudoscience, poorly designed respectable science, untestable theory).
      *   **Task:** Create a *decision procedure* based on demarcation literature (specifically falsificationism, but acknowledging its limits like Duhem-Quine, Lakatos, historical sciences).
      *   **Requirements:**
          *   Fixed order of questions.
          *   Sufficient answers defined.
          *   Termination points (Decline/Advance).
          *   Distinguish mechanical steps vs. judgment calls.
          *   Run the procedure on three specific cases (Homeopathy RCT, String Theory-esque group, Dog Seizure Citizen Science).
          *   Identify unwelcome outputs and analyze bias vs. procedure flaw.
          *   State limitations (what the procedure *can't* do).
          *   Tone: Usable by non-philosophers, defensible to trustees.

  2.  **Deconstruct the Philosophy (The "Engine"):**
      *   *Popper (Falsificationism):* Core is risky predictions and prohibitions. If a theory forbids nothing, it's not science.
      *   *Duhem-Quine Problem:* Theories aren't tested in isolation; auxiliary assumptions can save a theory from refutation. Need to check if auxiliaries are ad hoc.
      *   *Lakatos (Research Programmes):* Distinguish "progressive" (predicts novel facts) vs. "degenerating" (constant retrofitting) shifts.
      *   *Historical/Observational Science:* Not everything is an RCT. Need to allow for inference to the best explanation.
      *   *Methodological Rigor:* Even if the question is scientific, the method must be capable of answering it (power, controls, bias).

  3.  **Drafting the Decision Procedure (The "Tool"):**
      *   Need a flowchart style but in text.
      *   *Step 1: The Prohibition Test (Popper).* Does the proposal state what *cannot* happen if the hypothesis is false?
      *   *Step 2: The Auxiliary Check (Duhem-Quine).* If the prediction fails, can they explain why without inventing a new excuse just for this case?
      *   *Step 3: The Progress Test (Lakatos).* Is this adding new knowledge or just protecting old beliefs?
      *   *Step 4: The Methodological Fit.* Is the design appropriate for the claim? (Crucial for the Homeopathy case).
      *   *Step 5: The "Understanding" Clause.* Since the charter includes "public understanding," does it clarify the boundary even if negative?
      *   *Labeling:* Must explicitly mark [JUDGMENT] vs. [MECHANICAL].

  4.  **Running the Cases:**
      *   *Case 1: Homeopathy RCT.*
          *   Step 1 (Prohibition): Yes (if it works, X happens; if not, Y).
          *   Step 2 (Auxiliaries): Risk of ad hoc explanations ("potency," "individualization").
          *   Step 3 (Progress): Degenerating program historically.
          *   Step 4 (Method): Rigorous.
          *   *Conflict:* Method is good, Theory is pseudoscientific. Popper says reject (unfalsifiable in practice due to auxiliaries). But an RCT *is* a falsification attempt.
          *   *Decision:* This is the hardest one. A strict Popperian might say "Don't fund pseudoscience." A methodological view says "This *is* the test." The procedure needs to handle this. If the *aim* is testing the claim, it's science. If the aim is *proving* it despite evidence, it's not. Let's lean into the "Risky Prediction" aspect. Homeopathy usually lacks a mechanism.
          *   *Refinement:* The procedure should flag the *theoretical framework*. If the framework is immune to refutation, reject. If the proposal treats the remedy as a black box to be tested, accept (as understanding of science).
      *   *Case 2: Theoretical Physics (String Theory-esque).*
          *   Step 1 (Prohibition): Weak/None.
          *   Step 2 (Auxiliaries): N/A.
          *   Step 3 (Progress): Mathematical progress, but empirical stagnation.
          *   *Decision:* Likely Reject under strict falsification. But theoretical work is vital. Need a "Early Stage Theory" exception.
      *   *Case 3: Dog Seizures.*
          *   Step 1 (Prohibition): Yes (Dogs don't react before seizure).
          *   Step 2 (Auxiliaries): Smell, behavior cues. Testable.
          *   Step 3 (Progress): Novel data.
          *   Step 4 (Method): Citizen science + Stats mentor.
          *   *Decision:* Accept. Fits "Understanding of Science" well.

  5.  **Refining the Procedure for the User's Constraints:**
      *   The user wants to know where *they* exercise discretion.
      *   Need to be honest about where philosophy is contested.
      *   Need to ensure the trustees don't get bogged down in jargon.
      *   *Key Insight:* The distinction between "Funding Science" vs. "Funding the *Test* of a Claim."
      *   *Adjustment:* I need to make sure the procedure doesn't automatically reject Homeopathy if the *design* is a genuine test. However, the foundation charter is "Scientific Research." Funding a test of a debunked theory might be "Public Understanding" but not "Research" in the generative sense. I will structure the procedure to differentiate between *generating knowledge* vs. *re-testing settled science*.

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the difficulty. Set the stage.
      *   **The Procedure:** 5 Steps. Clear Pass/Fail/Review markers. Explicit tags for [JUDGMENT].
      *   **Case Studies:** Walk through step-by-step. Highlight the "Unwelcome Result" (likely the Physics one or the Homeopathy one).
      *   **Limitations:** What this tool misses (ethics, social value, pure math).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the Homeopathy case too tricky?
      *   *Fix:* Differentiate between "Testing the mechanism" (pseudoscience) vs. "Testing the clinical outcome" (medical science). If they claim "water memory," that's the issue. If they claim "does this pill reduce symptoms compared to placebo," that's a clinical trial. The prompt says "Homeopathic remedy." I need to address the *plausibility* vs. *testability*.
      *   *Decision:* I will guide the procedure to flag "Implausible Mechanism" as a risk, but allow funding if the primary goal is *definitive resolution* (Public Understanding) rather than *exploration*. Actually, for a small foundation, funding homeopathy is often reputational risk. I should advise a "High Bar" for settled negative science.
      *   *Critique:* The Physics case. String theory is often criticized as non-science by philosophers (Smolin, etc.). But it's mainstream physics.
      *   *Fix:* The procedure must allow for "Theoretical Maturation." If they admit no predictions *yet* but show mathematical consistency leading to potential predictions, it passes. If they claim predictions are impossible *in principle*, it fails.
      *   *Critique:* Tone. Needs to be professional, not academic.
      *   *Fix:* Use bolding, boxes, and clear "Stop/Go" language.

  8.  **Final Polish:** Check against all prompt requirements.
      *   Fixed order? Yes.
      *   Sufficient answers? Yes.
      *   Termination points? Yes.
      *   Mechanical vs. Judgment? Yes.
      *   Three cases run? Yes.
      *   Unwelcome answers analyzed? Yes.
      *   Limitations stated? Yes.
      *   Usable by non-philosophers? Yes.

      *(Self-Correction on the Homeopathy Case)*: If I recommend funding Homeopathy, the trustees might fire the PO. If I recommend rejecting it because it's "pseudoscience," I'm violating the "rigorous-looking study" premise of the prompt (it's an RCT). The philosophical tension is: Is science defined by *method* or *content*? Popper says method (falsifiability). But if the theory is already falsified historically, is it science to test it again?
      *Resolution:* I will structure the procedure to identify "Degenerating Research Programs" (Lakatos). If the field has a history of moving goalposts, funding a new test requires a justification of *why this test is definitive* where others failed. If they can't answer that, it's a decline. This protects the foundation from being used to legitimize a degenerating program while allowing for genuine "Public Understanding" if the case is made well.

      *(Self-Correction on Physics)*: If the procedure rejects theoretical physics because it lacks immediate predictions, that's a flaw. I need a "Theoretical Science" track in Step 1 or 2. I will add a clause for "Formal Consistency" as a temporary proxy for empirical prediction in early stages.

      *(Final Plan)*:
      1.  Intro: Contextualize the tool.
      2.  The Demarcation Protocol (5 Steps).
      3.  Case Applications.
      4.  Analysis of Unwelcome Results.
      5.  Limitations & Disclaimers.

      Let's write it.
answer: |-
  # The Demarcation Protocol: A Decision Procedure for Scientific Funding

  **To:** The Board of Trustees
  **From:** Program Officer
  **Subject:** Proposed Procedure for Evaluating Scientific Merit

  ## 1. Purpose and Scope
  This document provides a fixed sequence of questions to evaluate whether a proposal qualifies as "scientific research" or "public understanding of science" under our charter. It is based on established philosophical criteria for distinguishing science from non-science (demarcation).

  **How to use this:**
  *   Proceed through the steps in order.
  *   If a proposal fails a step, terminate with a **Decline** unless a specific "Exception Path" is triggered.
  *   Steps marked **[JUDGMENT]** require trustee discretion. Steps marked **[MECHANICAL]** require evidence-based verification.
  *   Where philosophy is contested, this procedure adopts a **Default Rule** to ensure consistency.

  ---

  ## 2. The Procedure

  ### Step 1: The Prohibition Test (Falsifiability)
  **Question:** Does the proposal state a specific observation or outcome that, if found, would prove the hypothesis *false*?
  *   **Sufficient Answer:** The proposal explicitly says, "If we observe X, the theory is wrong," or "If the data shows Y, we must reject the hypothesis."
  *   **Insufficient Answer:** The proposal only lists outcomes that would support the theory, or claims the theory is compatible with all possible outcomes.
  *   **Termination:** If **Insufficient**, **DECLINE**. (A theory that cannot be wrong is not science.)
  *   **Exception Path (Theoretical Work):** If the proposal is purely mathematical or theoretical (e.g., physics, logic), it may pass if it demonstrates **Internal Consistency** and identifies *potential* future conditions for empirical testing, even if not currently testable. **[JUDGMENT]**
  *   **Type:** [MECHANICAL] (Look for the statement in the text).

  ### Step 2: The Auxiliary Check (Immunity to Refutation)
  **Question:** If the predicted outcome fails to appear, does the proposal rely on "escape clauses" to explain away the failure?
  *   **Sufficient Answer:** The proposal acknowledges potential confounding variables (auxiliary assumptions) in advance and specifies how they will be measured or controlled. It does not reserve the right to invent new reasons for failure *after* seeing the data.
  *   **Insufficient Answer:** The proposal suggests that negative results might be due to "interference," "consciousness," "energy fields," or other unmeasurable factors not defined in the methodology.
  *   **Termination:** If **Insufficient**, **DECLINE**. (This indicates a "degenerating research program" that protects itself from evidence.)
  *   **Type:** [JUDGMENT] (Assessing the plausibility of the escape clauses).

  ### Step 3: The Progress Test (Novelty vs. Retrofitting)
  **Question:** Is this project designed to discover something new, or to explain away old anomalies?
  *   **Sufficient Answer:** The project predicts a *novel* fact (something not already known or used to construct the theory) or resolves a contradiction between existing theories.
  *   **Insufficient Answer:** The project is designed solely to accommodate data that already exists, or to re-test a question that has been definitively settled by multiple high-quality prior studies without new methodology.
  *   **Termination:** If **Insufficient**, **DECLINE** under "Scientific Research."
  *   **Exception Path (Public Understanding):** If the question is settled but public confusion is high, funding may be approved under "Public Understanding of Science" *if* the design is rigorous enough to be educational. **[JUDGMENT]**
  *   **Type:** [JUDGMENT] (Requires knowledge of the field's history).

  ### Step 4: The Methodological Fit
  **Question:** Is the proposed method capable of answering the specific question asked?
  *   **Sufficient Answer:** The design (RCT, observational, historical, mathematical) matches the claim. Sample sizes are calculated. Controls are appropriate.
  *   **Insufficient Answer:** The method is too weak to detect the effect claimed, or the design introduces bias that cannot be corrected (e.g., no blinding for subjective outcomes).
  *   **Termination:** If **Insufficient**, **DECLINE**.
  *   **Type:** [MECHANICAL] (Verify sample size calc, blinding, controls).

  ### Step 5: The "Understanding" Clause (Charter Alignment)
  **Question:** Even if the hypothesis is likely false, will conducting this study improve public understanding of how science works?
  *   **Sufficient Answer:** The proposal includes a dissemination plan that explains how negative results will be communicated clearly to prevent misinformation.
  *   **Insufficient Answer:** The proposal implies that only positive results will be published, or the team has a history of promoting the claim regardless of evidence.
  *   **Termination:** If **Insufficient**, **DECLINE**. (Funding risks legitimizing pseudoscience.)
  *   **Type:** [JUDGMENT] (Assessing intent and communication plan).

  ---

  ## 3. Application to Sample Proposals

  Below is the procedure applied to three representative cases.

  ### Case 1: The Homeopathy RCT
  *   **Proposal:** Preregistered RCT of a homeopathic remedy for a self-limiting condition. Licensed clinician. Adequate power.
  *   **Step 1 (Prohibition):** **PASS.** The RCT design inherently allows for a null result. If the remedy performs no better than placebo, the hypothesis is falsified.
  *   **Step 2 (Auxiliaries):** **REVIEW.** Homeopathy often relies on "individualization" or "potency" as escape clauses.
      *   *Check:* Does the protocol lock the dosage and remedy selection beforehand?
      *   *Finding:* Yes, it is preregistered.
      *   *Verdict:* **PASS.**
  *   **Step 3 (Progress):** **FAIL.** Homeopathy is a "degenerating program." It has survived 200 years of negative results by shifting claims (from "cures cholera" to "supports well-being"). This study does not predict a novel fact; it re-tests a settled question.
      *   *Exception Path (Public Understanding):* Does it improve understanding?
      *   *Analysis:* If the goal is to show the public that rigorous testing yields null results, it serves the charter.
      *   *Verdict:* **CONDITIONAL PASS** (Only under "Public Understanding," not "Research").
  *   **Step 4 (Method):** **PASS.** Rigorous design.
  *   **Step 5 (Understanding):** **JUDGMENT REQUIRED.** Will they publish negative results?
      *   *Risk:* If they plan to spin a null result as "subtle effects," this fails.
      *   *Decision:* **DECLINE** unless they sign a binding agreement to publish regardless of outcome.
  *   **Procedure Output:** **DECLINE** (Default) or **FUND** (Only with strict publication clauses).
  *   **Unwelcome Result Analysis:** Trustees may want to fund this because it looks like "real science" (RCT). The procedure flags it because the *research program* is degenerating.
      *   *Bias Check:* Is this bias against alternative medicine? No. It is an application of Lakatos's criterion on research programs. If we fund every re-test of settled science, we run out of money.
      *   *Procedure Flaw:* None. This is a feature, not a bug. It forces us to decide if we are funding *knowledge generation* or *public reassurance*.

  ### Case 2: Theoretical Physics Group
  *   **Proposal:** 3 years funding for mathematical physics. No experimental predictions in 10 years. High sophistication.
  *   **Step 1 (Prohibition):** **FAIL (Initial).** No empirical predictions offered.
      *   *Exception Path (Theoretical Work):* Does it show internal consistency and a path to future testability?
      *   *Finding:* Yes, the math resolves inconsistencies in the Standard Model, even if energy scales for testing are currently unreachable.
      *   *Verdict:* **PASS** (via Exception). **[JUDGMENT]**
  *   **Step 2 (Auxiliaries):** **N/A.** (No empirical test yet).
  *   **Step 3 (Progress):** **PASS.** It solves mathematical anomalies (novel facts within the formal system). It is a "progressive shift" theoretically, even if empirically stagnant.
  *   **Step 4 (Method):** **PASS.** Mathematical rigor is the method here.
  *   **Step 5 (Understanding):** **PASS.** Theoretical advances often filter down to public understanding eventually.
  *   **Procedure Output:** **FUND.**
  *   **Unwelcome Result Analysis:** A strict Popperian might say "Decline" because it isn't falsifiable *now*.
      *   *Bias Check:* Trustees might feel intimidated by the math and fund it blindly, or reject it as "useless."
      *   *Procedure Flaw:* The "Theoretical Exception" in Step 1 is a **[JUDGMENT]** call. It requires us to trust the mathematicians' assessment of "consistency." We cannot mechanically verify this. We must rely on peer review (even informal) for this step.

  ### Case 3: Citizen Science (Dog Seizures)
  *   **Proposal:** Volunteers test if dogs anticipate seizures. Stats mentor from university.
  *   **Step 1 (Prohibition):** **PASS.** Hypothesis: "Dogs react before onset." Null: "Reactions are random or post-onset."
  *   **Step 2 (Auxiliaries):** **PASS.** They control for owner cues, smell, and time of day.
  *   **Step 3 (Progress):** **PASS.** This is novel data. Anecdotal evidence exists; systematic data does not.
  *   **Step 4 (Method):** **REVIEW.** Citizen science can be messy.
      *   *Check:* Is the stats mentor involved in design or just name-dropped?
      *   *Finding:* Mentor is co-PI. Design is sound.
      *   *Verdict:* **PASS.**
  *   **Step 5 (Understanding):** **PASS.** High public engagement, clear scientific method demonstration.
  *   **Procedure Output:** **FUND.**
  *   **Unwelcome Result Analysis:** None. This is the ideal candidate.
      *   *Note:* If the volunteers claimed the dogs detect "evil spirits," Step 1 would fail. Because they claim a biological/behavioral link, it passes.

  ---

  ## 4. Limitations and Disclaimers

  **To the Trustees:**
  This procedure is a tool, not a substitute for governance. Please note the following limitations where you must exercise discretion:

  1.  **The "Theory" Loophole (Step 1 Exception):**
      *   *Limitation:* We cannot mechanically verify if a mathematical theory is "on the path" to testability.
      *   *Your Role:* You must ask, "Do experts in this field consider this a dead end or a maturation phase?" If the field itself is divided, you must make a value judgment on risk tolerance.
  2.  **The "Settled Science" Dilemma (Step 3):**
      *   *Limitation:* The procedure recommends declining re-tests of settled science (like Homeopathy) unless framed as "Public Understanding."
      *   *Your Role:* You must decide if "debunking" counts as "Understanding." Sometimes funding a definitive negative study is the most scientific thing we can do to clear public confusion. This requires assessing the *intent* of the applicant, which is not mechanical.
  3.  **Interdisciplinary Gray Zones:**
      *   *Limitation:* Fields like psychology, economics, and ecology often struggle with strict falsification due to complex variables.
      *   *Your Role:* Do not apply Step 1 too rigidly to observational sciences. Look for "Inference to the Best Explanation" rather than strict lab-style falsification.
  4.  **Ethical and Social Value:**
      *   *Limitation:* This procedure tests for *scientific merit*, not *moral good*.
      *   *Your Role:* A project can pass this protocol and still be unethical or low-priority. You must layer ethical review and strategic fit on top of this protocol.

  **Final Instruction:**
  When declining a proposal using this protocol, cite the specific Step and the specific failure (e.g., "Failed Step 2: Auxiliary Check"). When approving a proposal that triggered a Judgment call, record the rationale in the minutes (e.g., "Approved under Step 1 Exception based on consensus that theoretical maturation is required before empirical testing"). This creates the audit trail you requested.
