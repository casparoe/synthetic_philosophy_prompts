  The evidence on the table

  By 1615, Galileo's telescope had revolutionized observational astronomy, yet the data remained ambiguous regarding Earth's motion. The phases of Venus were crucial: they disproved the pure Ptolemaic system, where Venus's epicycle remained strictly between Earth and Sun, preventing full illumination. However, these phases were consistent with both Copernican heliocentrism and Tychonic geo-heliocentrism, where Venus orbits the Sun while the Sun orbits Earth. Similarly, Jupiter's moons demonstrated that not all bodies orbit Earth, undermining Aristotelian crystalline spheres, but did not prove Earth itself moved. The critical missing evidence was stellar parallax. Copernicans argued stars were too distant to detect shift; Tycho argued their lack of shift proved Earth stationary, implying impossibly vast stellar sizes if Copernicus were right. Furthermore, terrestrial physics offered no proof; falling bodies dropped vertically, suggesting no planetary rotation. Mathematically, the Tychonic and Copernican systems were largely transformable regarding planetary longitudes. Thus, regarding planetary positions and visible phases, the systems were empirically equivalent. Bellarmine correctly noted that without physical demonstration of Earth's motion or detected parallax, heliocentrism remained a hypothesis saving appearances rather than a proven physical reality. The evidence discriminated against strict Ptolemy but left the Copernican-Tychonic choice underdetermined by observation alone. Bellarmine's insistence on demonstration reflected this empirical stalemate: the phenomena were saved equally well by competing spatial arrangements. Consequently, the observational record between 1610 and 1633 supported a plurality of models, validating Bellarmine's claim that no singular physical truth was yet compelled by the stars. Tycho's hybrid model gained traction precisely because it accommodated Galileo's findings without requiring terrestrial motion.

  What underdetermination explains

  The doctrine of underdetermination elucidates why competent astronomers remained non-Copernicans decades after Galileo. If evidence alone dictates theory choice, the 17th-century astronomer faced a genuine tie. Bellarmine's stance was not merely theological obstructionism but a rigorous application of Aristotelian scientific standards: physical claims require physical proof. Since the Tychonic system saved the appearances equally well, choosing Copernicus required extra-empirical virtues like simplicity, which were not yet universally binding. Underdetermination explains the legitimacy of the conservative position; it was rational to withhold assent from a physically counterintuitive theory (a moving Earth) when a stationary Earth model fit the data equally. It highlights that theory choice is not automatic upon new data but involves a threshold of certainty. Bellarmine's condition—that Scripture would yield to demonstration—shows he recognized the epistemic priority of evidence over tradition, provided that evidence was conclusive. Therefore, the controversy was not simply faith versus reason, but a dispute over when evidence becomes demonstrative. Underdetermination validates the historical actors' perspective: from within their epistemic horizon, the world really did look compatible with multiple structures. This explains the longevity of the Tychonic system among Jesuits and others who accepted Galileo's discoveries but rejected his cosmological conclusions. They were not ignoring data; they were acknowledging its insufficiency to uniquely determine the Earth's kinematic status. Hindsight often obscures this, painting opponents as dogmatic, but underdetermination reveals their caution as methodologically sound. The lack of parallax meant the data did not speak univocally; thus, reasonable dissent persisted not due to blindness, but because the evidence genuinely supported multiple ontological interpretations of the celestial machinery.

  Where the lens distorts

  However, framing this solely as underdetermination distorts the historical reality by suggesting parties compared systems against a bare data set. They did not. Copernicans appealed to theoretical virtues: heliocentrism offered a unified explanation for planetary retrograde motion and ordered planetary periods by distance. Tychonics retained complex mechanisms to avoid intersecting spheres. Underdetermination talk sidelines these non-empirical weighings, implying a neutrality that didn't exist. Furthermore, the dispute involved auxiliary assumptions about physics, not just astronomy. Aristotelian dynamics suggested heavy earths cannot move; Copernicus lacked a new physics to explain why objects stay on a spinning planet. This wasn't just underdetermination; it was a conflict between incomplete physical frameworks. Additionally, treating Bellarmine's position as pure epistemology ignores the theological stakes that raised the burden of proof specifically for Copernicus. While methodologically sound, the demand for demonstration was applied asymmetrically; Ptolemaic physics was accepted without similar proof. Thus, underdetermination risks sanitizing the controversy, removing the sociological and theological pressures that shaped what counted as "evidence." It suggests a level playing field where none existed. The lens obscures that "saving the appearances" was not the only goal; physical plausibility mattered. By focusing on empirical equivalence, we might miss that the Copernican system was arguably *better* science even before parallax, due to its coherence. Underdetermination explains the stalemate but distorts the reasons for breaking it, which involved shifting standards of explanation, not just new data. It also risks implying that all theories are equally valid until refuted, whereas contemporaries recognized degrees of probability. The controversy was not merely about data equivalence but about the weight of tradition versus innovation in natural philosophy.

  What the episode does to the doctrine

  The eventual resolution via stellar aberration (1727) and parallax (1838) challenges strong interpretations of underdetermination. These discoveries broke the empirical equivalence, demonstrating that the underdetermination was transient and practical, not principled. Given sufficient technological precision and theoretical development (Newtonian gravity), evidence *did* determine the theory. This suggests underdetermination is often a function of historical context rather than a permanent logical feature of science. The episode supports a moderate realism: theories may be underdetermined temporarily, but convergence is possible. It refutes the idea that theory choice is always non-rational or purely social. However, it also shows that resolution requires more than just data; it needed a new physics to make the data intelligible. The doctrine must accommodate that "evidence" includes instrumental capacity and theoretical coherence. The Copernican case shows underdetermination is a phase in scientific maturation, not a permanent state. It warns against declaring theories empirically equivalent too hastily. Ultimately, the episode suggests underdetermination is a methodological caution, not an ontological verdict. Science can overcome it, but often requires centuries of cumulative work. The delay indicates that while evidence is the final arbiter, the path to arbiter status is paved with theoretical innovation. Thus, the doctrine remains useful for understanding historical stalemates but fails as an argument against scientific progress. It highlights that empirical determination is an achievement, not a starting point.
