answer: |-
  ### **HONEST ASSESSMENT: THE "SUB-PERSONAL" MOVE**

  **The Hard Truth:** You need to hear this before you step into the room. Your "sub-personal state S" move does not neutralize the Dilemma Defense; it **relocates** it.

  Widerker and Kane argue that any prior sign sufficient to trigger the device *is* a deterministic cause. By explicitly defining State S as "fully sufficient for the decision," you are effectively stipulating determinism in the actual sequence. The libertarians will not concede Horn 1 ("S is sufficient"). They will simply say, "If S is sufficient, Jones isn't an agent-cause, so this case is irrelevant to free will."

  Your counter-dilemma ("If you say S isn't sufficient, the device guarantees...") relies on the device being able to use S as a reliable predictor *without* S being causally sufficient. But if S isn't sufficient, the device can't know *in advance* that the decision won't happen. If the device waits until the decision is inevitable to intervene, it's too late to block alternatives. If it intervenes earlier based on an insufficient sign, it might intervene unnecessarily (blocking a free choice that would have happened anyway).

  **Verdict:** The libertarians will see through this immediately. They will treat your "sub-personal" label as an attempt to hide a deterministic cause behind technical jargon. Your prep needs to focus on damage control, not victory.

  ***

  ### **Q&A PREP SHEET**

  **Order:** Ranked by potential to derail your talk (High to Low).
  **Time:** Replies are drafted for ~2 minutes spoken at a moderate pace.

  #### **1. The "Begging the Question" Objection (The Libertarian Heavyweight)**
  *   **Who:** The senior agent-causationist (Widerker fan).
  *   **The Attack:** "You claim State S is 'fully sufficient' for the decision. But if a sub-personal neural state is sufficient for a choice, determinism is true by stipulation. You haven't shown PAP is false; you've just assumed determinism is compatible with the kind of control we care about. Why shouldn't we just reject the sufficiency of S?"
  *   **The Reply:** "I'm not assuming determinism is compatible with control; I'm testing the *source* of the constraint. My argument is a *reductio*. If the libertarian says S isn't sufficient, then the device lacks a reliable trigger to intervene counterfactually, and the case fails to block alternatives. If they say S *is* sufficient, they admit a free choice can be the inevitable outcome of a sub-personal state Jones didn't initiate. My goal isn't to prove compatibilism, but to show the libertarian cannot describe the counterfactual setup without either admitting determinism or making the device impotent."
  *   **The Soft Spot:** You are essentially admitting the case only works if determinism is possible. If they dig in and say "S is never sufficient for free choices, period," your case describes an unfree agent, and they walk away unscathed.

  #### **2. The "Agent-Cause Bypass" Objection**
  *   **Who:** Agent-Causationist #2.
  *   **The Attack:** "You call S 'sub-personal.' That's the problem. If the decision flows from a sub-personal configuration, the *agent* isn't causing it. Even in the actual sequence where the device doesn't fire, Jones is just a vessel for State S. You've removed the agent from the actual sequence, not just the alternative sequence."
  *   **The Reply:** "State S is the neural correlate of Jones's reasoning. It's 'sub-personal' only in the sense that we don't consciously monitor our synapses. But it constitutes Jones's mental state. If the libertarian claims Jones's own reasoning states are 'sub-personal' and therefore unfree, they are pushing free will outside the natural order entirely. I'm holding them to the idea that *Jones's* decision process must have some physical realization. If that realization guarantees the outcome, the 'agent-cause' is doing no additional work."
  *   **The Soft Spot:** If they hold a robust substance-dualist or non-reductive view, they will say the physical realization *never* guarantees the outcome. You'll be talking past each other on metaphysics.

  #### **3. The "Guidance Control" Trap (The Fischer Grad Student)**
  *   **Who:** The Grad Student.
  *   **The Attack:** "Even if you kill PAP, you haven't established Guidance Control. Fischer says we need the actual sequence mechanism to be the agent's own. But the *presence* of the device changes the modal profile of the mechanism. Jones knows (or could know) the device is there. Doesn't that taint the actual sequence mechanism, making it non-modular?"
  *   **The Reply:** "Fischer's worry is about mechanism ownership. In my case, the device is idle. The causal history of the actual decision is identical to a world without the device. The 'modal profile' changes only in counterfactual worlds. Guidance control looks at the actual sequence properties: is the mechanism responsive to reasons? Yes. Is it Jones's? Yes. The device is a safety net, not a steering wheel. It doesn't alter the actual mechanism's ownership."
  *   **The Soft Spot:** Fischer himself admits that "hard" Frankfurt cases (where the sign is deterministic) are problematic for guidance control. If S determines the action, is the mechanism *really* reasons-responsive? If S fires, Jones *must* vote. That looks like a lack of receptivity.

  #### **4. The "Flicker of Freedom" Strategy**
  *   **Who:** Libertarian #1 or #2.
  *   **The Attack:** "You haven't eliminated all alternative possibilities. Jones can still choose to 'initiate the intervention' vs. 'decide on his own.' There is a flicker: the difference between the device firing and not firing. That's a morally significant alternative."
  *   **The Reply:** "That flicker is not a robust alternative possibility regarding the *outcome*. PAP requires the ability to do otherwise *with respect to the action*. Being the cause of your own action vs. being the cause of a device causing the action is a difference in *mode*, not in *content*. If moral responsibility hinges on that tiny flicker, it's a trivial responsibility, not the freedom to choose differently."
  *   **The Soft Spot:** Some libertarians argue that *any* alternative possibility, even a flicker, preserves the 'openness' of the future required for agent-causation. You might get stuck debating the moral relevance of flickers.

  #### **5. The "Compatibilist Yawn"**
  *   **Who:** One of the two Compatibilists.
  *   **The Attack:** "Why are we spending time on this? Compatibilists never accepted PAP. If Jones acts on his own desires without coercion, he's free. Whether the device *could* have fired is irrelevant. Isn't this entire literature just a sideshow for libertarians?"
  *   **The Reply:** "It matters because libertarians use PAP as their primary wedge against compatibilism. They say, 'You can't have responsibility without alternate possibilities.' My case is designed to remove that wedge. If I show PAP is false, the libertarian loses their clearest argument against you. I'm clearing the brush so you can fight the real battle about the nature of control, not the existence of alternatives."
  *   **The Soft Spot:** They might agree and then ask why you care about refuting libertarians if compatibilism is already secure. It makes your project look purely destructive.

  #### **6. The "Epistemic Access" Problem**
  *   **Who:** General Audience / Metaphysics focus.
  *   **The Attack:** "How does the device detect State S without interacting with it? To monitor S, the device must couple with Jones's brain. Doesn't that coupling constitute an intervention that affects the sufficiency of S?"
  *   **The Reply:** "We can stipulate a passive monitoring system, like a thermometer measuring temperature without changing it. In neuroscience, we assume we can read neural states without altering them for the sake of thought experiments. The philosophical point isn't the engineering feasibility, but the logical relationship between the sign and the action."
  *   **The Soft Spot:** In quantum or chaotic systems, measurement *does* affect the state. If the audience is physics-literate, they might pounce on the "passive monitoring" stipulation as physically impossible, undermining the "sufficiency" claim.

  #### **7. The "Overdetermination" Worry**
  *   **Who:** Analytic Metaphysician.
  *   **The Attack:** "If S is sufficient, and the device is sufficient, and the device fires in the counterfactual, isn't the decision overdetermined in that sequence? And if it's overdetermined there, why isn't it suspiciously close to overdetermination in the actual sequence?"
  *   **The Reply:** "In the actual sequence, there is no overdetermination because the device doesn't fire. In the counterfactual, yes, it is overdetermined, but that's acceptable. We care about the actual sequence for responsibility. The counterfactual sequence just serves to block the alternative. Overdetermination there doesn't bleed into the actual sequence's causal history."
  *   **The Soft Spot:** If the device is *ready* to fire, is there a standing causal disposition in the actual sequence? Some argue the mere presence of the backup cause affects the actual causal structure.

  #### **8. THE "PRAYER" OBJECTION (The One You Hope Nobody Asks)**
  *   **Who:** The Smartest Person in the Room (possibly the Workshop Organizer).
  *   **The Attack:** "You say your twist avoids the Dilemma Defense. But look closely: If S is sufficient for the decision, Jones *cannot* choose otherwise even without the device. So the device is redundant. If the device is redundant, this isn't a Frankfurt case; it's just a determinism case. If S is *not* sufficient, the device can't use it as a prior sign to intervene *before* the choice is made. So you haven't solved the Prior Sign problem; you've just hidden it behind the label 'sub-personal.' Aren't you just asserting determinism and calling it a Frankfurt case?"
  *   **The Reply:** (You need to pivot hard here) "I'm not asserting determinism is true; I'm asserting the libertarian *description* of the case forces them into a corner. If they want to use Frankfurt cases to argue against PAP, they must accept the possibility of a reliable prior sign. If they reject reliable prior signs, they must admit we can't construct FSCs. My point is that the 'Prior Sign' objection proves too much—it makes FSCs impossible by definition, which suggests the objection is a defensive maneuver, not a genuine metaphysical insight."
  *   **The Soft Spot:** This is the truth. Your reply admits you aren't proving PAP false, but rather attacking the libertarian's consistency. It weakens your positive claim significantly.

  ***

  ### **STRATEGIC ADVICE FOR THE TALK**

  1.  **Don't Claim Victory:** Do not say "This refutes libertarianism." Say "This exposes a tension in the libertarian's description of FSCs." It lowers the bar for success.
  2.  **Lean into the "Sub-Personal":** When they attack S, emphasize that *all* physicalists must accept some neural correlate of decision. Ask them at what level of description the "agent" appears if not in the neural configuration.
  3.  **Befriend the Compatibilists:** When they say "PAP doesn't matter," agree with them! Say, "Exactly, which is why the libertarian obsession with PAP is the real target here."
  4.  **Manage the Grad Student:** Give the Fischer distinction credit. "I'm focusing on Regulative Control (PAP) here, but I agree Guidance Control is the next step." It validates them without letting them derail the talk.

  **Final Word:** Your case is a "Prior Sign" Frankfurt case. The literature on this (Widerker 1995, Kane 1996, Ginet 2000) is extensive. They *know* this move. Your best bet is to frame it not as a solution, but as a challenge: "Show me how to build the device without assuming sufficiency." Put the burden of construction on them.
