answer: |-
  **MEMORANDUM**

  **TO:** Members, Commission on Higher Education Affordability
  **FROM:** [Your Name], Citizen Commissioner
  **DATE:** October 12, 2023
  **SUBJECT:** Recommendation on Tuition Policy: A Case for Universal Public Funding

  **Recommendation**

  I recommend the Commission adopt **Option (a)**: making public college and technical training tuition-free, funded through general state taxation.

  I offer this recommendation not as an academic, but as a small business owner who never finished a degree. I have hired young people, paid taxes, and watched the price of entry into the middle class climb out of reach for the kids of my customers and my own neighbors. We are not choosing between paying and not paying. We are choosing *how* to pay, *who* pays, and what kind of economy we want on the other side of that payment.

  **The Core Argument: Choosing the Fairer Tax**

  My thinking on this commission has been guided by a specific conviction: the current system of tuition financed by loans is not a market price. It is a tax. It is a tax levied only on people who attempt higher education, assessed on their future earnings, with interest, and collected disproportionately from those who lacked the savings to pay upfront.

  If we proposed a law tomorrow that said, "Any citizen born to a family without $50,000 in liquid assets must pay a 5% surcharge on their income from age 22 to 45," we would reject it as punitive. Yet, that is effectively what our aid-by-debt system does. It treats education as a private wager rather than a public infrastructure.

  Option (a) shifts this burden to general taxation. I hear the counter-argument: *Why should a plumber pay for a lawyer's degree?* It is a fair question. But we must look at the ledger over a lifetime. College graduates, on average, earn significantly more than non-graduates. They pay more income tax, more sales tax, and more property tax over their lives. Funding tuition through general revenue is an upfront investment in that future tax base. It is a shared cost for a shared benefit: a more skilled workforce, lower reliance on social safety nets, and greater economic mobility.

  Between the "debt tax" (which penalizes ambition without capital) and the "general tax" (which asks everyone to chip in for a stronger economy), the general tax is the fairer instrument. It spreads risk across the population rather than concentrating it on the shoulders of the young.

  **The Strongest Case Against This Recommendation**

  I want to address the arguments for **Option (c) (Means-Tested Tuition)** and **Option (b) (Improved Loans)** honestly, because my colleagues advocating for them are not wrong about the risks of Option (a).

  The strongest argument against universal free tuition is that it is a regressive subsidy. Under Option (a), tax revenue from working-class families who do not attend college will subsidize the degrees of students from wealthy families who could have paid their own way. In Germany or the Nordics, this is accepted as part of the social contract. In our state, with our political culture, this may be a hard sell. Means-testing (Option c) avoids this by targeting only the needy. It feels more precise. It feels more fiscally conservative.

  Furthermore, there is the issue of **rationing**. As I have noted in our discussions, when you remove price as a barrier, demand rises. If we do not expand capacity, access will be rationed by grades, by waitlists, or by the ability to afford living expenses in college towns. In the Nordic model, the "cost" of free tuition is often borne by families who must support adult children for years, or by students who face rigid academic tracking at a young age. If we adopt Option (a) without expanding seats or addressing housing costs, we may simply swap a financial barrier for a bureaucratic one. We risk making college free for those who can get in, while leaving behind those who need remedial help or must work full-time to support a family.

  Those favoring **Option (b)** argue that loans, if made generous enough with income-based repayment, preserve choice without burdening the non-college public. They argue that the problem isn't tuition, but repayment terms.

  **Why I Reject Those Alternatives**

  I reject Means-Testing (Option c) because it creates a "benefits cliff." It penalizes families who save modestly or earn just above the threshold, effectively imposing a high marginal tax rate on the middle class. It also creates a bureaucratic maze that discourages participation. If we believe education is a public good, like roads or fire protection, we should not means-test access to it.

  I reject Improved Loans (Option b) because it leaves the fundamental distortion in place. There is a credible empirical claim—often called the Bennett Hypothesis—that easily available loan money allows institutions to raise tuition without consequence. As long as the revenue stream is backed by federal guarantees, universities have little incentive to control costs. Strengthening the loan system may soften the landing for the borrower, but it does not stop the plane from crashing. It perpetuates the idea that education is a private commodity to be leveraged, rather than a public asset to be maintained.

  **The Gamble and The Uncertainty**

  I must be candid about what we are gambling on.

  1.  **Legislative Follow-Through:** We are recommending a shift to general taxation. This requires the legislature to appropriate funds consistently, even in recession years. If they fund the promise in year one and cut it in year three, universities will face fiscal cliffs that could damage quality.
  2.  **Capacity Constraints:** We are assuming the legislature will fund not just tuition, but the expansion of seats and faculty. If we declare college free without building more classrooms, we simply move the line.
  3.  **Cultural Differences:** We are not Germany. Our higher education system is more decentralized, and our labor market is less standardized. There is no guarantee that free tuition here will produce the same social cohesion or economic efficiency it does in Scandinavia.

  However, the gamble of *inaction* is greater. We know what the current system produces: a generation burdened by debt, delayed homeownership, and suppressed entrepreneurship. We know that the "price" of college has outpaced inflation for decades. The status quo is not a stable equilibrium; it is a bubble.

  **A Necessary Correction to My Own Framing**

  In our private discussions, I framed the cost of "free" tuition as shifting the burden to non-graduates. I want to refine that. The burden is not just on non-graduates; it is on the *state's priorities*. If we fund this by cutting other essential services, we have failed. The funding must come from a recognition that the return on investment (ROI) of an educated populace exceeds the cost of the tuition.

  Furthermore, I want to ensure this recommendation covers **technical and vocational training** equally. As someone from the trades, I know that a four-year degree is not the only path. If "Free College" means only free university, we distort the labor market further. The recommendation must specify that "public higher education" includes community colleges and trade apprenticeships. Otherwise, we are subsidizing the white-collar path at the expense of the skilled trades, which is not a balance I can support.

  **Conclusion**

  We are choosing between a system that ration by **price and debt** versus a system that rations by **capacity and merit**, funded by the **community** rather than the **individual**.

  The current system asks a eighteen-year-old to bet their future earnings against a tuition bill they cannot verify. That is a bad contract. Option (a) asks the community to invest in its own future capacity. It is not perfect. It will require hard budget choices. It will require us to manage demand. But it treats education as what it actually is: the foundation of our civic and economic life, not a product on a shelf.

  I ask my fellow commissioners to join me in recommending Universal Public Funding, with the stipulation that it includes vocational pathways and is paired with a commitment to capacity expansion.

  Respectfully,

  [Your Name]
  Citizen Commissioner
