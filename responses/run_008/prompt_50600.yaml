      *   **Chaos Theory:** Deterministic systems that are highly sensitive to initial conditions. Non-linear dynamics.
      *   **Predictability:** An *epistemic* concept (about what we can *know*).
      *   **Determinism:** An *ontological* concept (about what *is*).
      *   **The BIL's Error:** Conflating epistemology (prediction) with ontology (reality). Just because we can't *know* the outcome doesn't mean the outcome isn't fixed by prior causes.
