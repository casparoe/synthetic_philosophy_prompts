answer: |-
  This is one of the sharpest questions being asked in the philosophy of science right now, and you have put your finger on the exact nerve that makes many philosophers of science wince. Your intuition is correct: on a naive realist view, evidence is evidence. The "Likelihood Principle"—a foundational concept in statistical inference—states that all the evidence relevant to a hypothesis is contained in the likelihood function of the observed data. By that metric, the researcher's mental state, the date on the lab notebook, or the order of operations should be irrelevant.

  Yet, pre-registration explicitly violates the Likelihood Principle. It asserts that the *process* by which data are generated is part of the evidence, not just the data itself.

  To answer your question directly: The machinery of pre-registration does not rest on a single, unified philosophy. It is a pragmatic hybrid that smuggles in **Error Statistics (Neo-Popperism)** under the hood, relies on a **sophisticated Bayesian** understanding of selection effects to justify itself mathematically, and is sold via a **Pragmatic/Institutionalist** argument about incentives.

  Here is the breakdown of the philosophical machinery you are looking for.

  ### 1. The Error-Statistical View (The "Severity" Argument)
  You noted that methodologists deny being Popperians. They are likely denying the *label* because Popper's specific formulation was often too rigid, but they are operating firmly within the tradition of **Error Statistics**, most notably championed by the philosopher Deborah Mayo.

  In this view, the goal of science is not just to find true hypotheses, but to avoid false ones. A claim is warranted only if it has passed a **severe test**. A test is severe if it would very likely have detected an error if one existed.

  *   **The Pre-registered Study:** If I predict a specific effect in the left tail and find it, the test is severe. I could have easily been wrong.
  *   **The Post-Hoc Study:** If I analyze 50 variables and report the one that worked, the test is *not* severe. The procedure guarantees a "significant" result eventually, even if the null is true.

  From this perspective, the data *are not the same* in the two scenarios you described. The "data" include the sampling distribution of the test statistic. If you change the stopping rule or the analysis plan, you change the sampling distribution. Therefore, the p-value (which is a property of the test, not just the numbers) changes.

  **Verdict:** This is falsificationism refined. It's not about "embarrassment" (psychology); it's about the **capacity of the method to detect error**. Pre-registration ensures the method retains its error-detecting capacity.

  ### 2. The Bayesian View (Selection Effects)
  You asked if this is compatible with Bayesianism. Surprisingly, yes, but it requires moving away from "naive" Bayesianism to one that models the researcher.

  In a standard Bayesian update, $Posterior \propto Likelihood \times Prior$. The Likelihood Principle suggests the timing of the hypothesis shouldn't matter. However, sophisticated Bayesians argue that **researcher degrees of freedom act as a selection effect.**

  If a researcher engages in "p-hacking" or HARKing (Hypothesizing After Results are Known), they are effectively filtering the data.
  *   **Lab A (Pre-registered):** Tests Hypothesis H on Data D.
  *   **Lab B (Post-hoc):** Tests Hypotheses H1...H50 on Data D, reports H.

  For a Bayesian observer, the likelihood of observing Data D *given* that Lab B chose to report it is different than for Lab A. Lab B's report implies "D was the most favorable outcome among 50 tries." Lab A's report implies "D was the outcome of the one try we planned."

  Therefore, the timing of the hypothesis matters because it informs the **model of data generation**. If you don't know when the hypothesis was formed, you cannot accurately calculate the likelihood of the data under the null model. Pre-registration solves this by making the data-generation model transparent.

  **Verdict:** Compatible, provided you treat the researcher's behavior as part of the probabilistic model.

  ### 3. The Pragmatic/Institutional View (The "Anti-Bullshit" Mechanism)
  This is the deflationary account you suspected. Many methodologists (like Brian Nosek or Simine Vazire) are less concerned with high epistemology and more with **institutional design**.

  Science is a collective enterprise plagued by misaligned incentives (publish or perish). The "epistemic value" of a result is not an intrinsic property of the numbers; it is a social credit assigned by the community. If the community assigns high credit to novel, clean results, researchers will produce clean results by any means necessary (including massaging data).

  Pre-registration is a **commitment device**. It binds the researcher to a course of action to prevent their future self from succumbing to temptation. In this view, the "psychologism" you detected is a feature, not a bug. We are acknowledging that scientists are human and building guardrails.

  **Verdict:** This view doesn't care about the "truth" of the data in the abstract; it cares about the **trustworthiness of the testimony**.

  ### 4. The Serendipity Inconsistency
  You are right to identify a tension here, but the profession resolves it via Reichenbach's distinction between the **Context of Discovery** and the **Context of Justification**.

  *   **Discovery:** How you found the idea (serendipity, dreams, data dredging). This is psychologically interesting but epistemically irrelevant.
  *   **Justification:** How you prove the idea is true (rigorous testing).

  The inconsistency arises when researchers present a *Discovery* as a *Justification*.
  *   **Penicillin:** Fleming noticed mold killing bacteria (Discovery). This was not evidence that mold kills bacteria in a generalizable way; it was a prompt to run experiments (Justification).
  *   **CMB:** Penzias and Wilson found noise (Discovery). They didn't claim it proved the Big Bang until the data were subjected to theoretical scrutiny and independent verification (Justification).

  The replication crisis occurred because researchers were publishing "Discoveries" (post-hoc patterns) formatted to look like "Justifications" (confirmatory tests). Pre-registration forces authors to label their work correctly. A registered report says: "This is a confirmatory test." A standard exploratory paper says: "This is a hypothesis generator."

  The inconsistency you see in op-eds is largely rhetorical laziness. The methodologists know the difference; the PR departments do not.

  ### 5. Where is the Practice Underdetermined?
  You asked which rival philosophies could sign off on this without discomfort.

  *   **Who Signs Off:**
      *   **Error Statisticians (Mayo):** Because it increases test severity.
      *   **Pragmatists (Dewey/Rorty):** Because it improves the social utility of science.
      *   **Sophisticated Bayesians:** Because it clarifies the likelihood model.
      *   **Realists:** Because it helps isolate true causal structures from noise.

  *   **Who is Uncomfortable:**
      *   **Naive Empiricists:** Those who believe "data speak for themselves." They hate pre-registration because it imposes theory before observation.
      *   **Kuhnians:** Some might argue this rigidifies "normal science" and prevents paradigm shifts that often come from anomalies found during exploration. (Though most Kuhnians would agree anomalies need follow-up).
      *   **Proponents of the Likelihood Principle:** Strict adherents (often subjective Bayesians) argue that conditioning on the experimental design is unnecessary if you have the full likelihood function. They argue pre-registration is a solution to a problem created by bad frequentist metrics (p-values), not a fundamental epistemic requirement.

  ### Summary for Your Piece
  The philosophy underneath pre-registration is not a return to Popper, but rather a shift from **evidence-as-object** to **evidence-as-process**.

  The profession is admitting that a number in a vacuum is not evidence. A number becomes evidence only when embedded in a protocol that limits the researcher's ability to deceive themselves. It is a recognition that in the modern era of big data and flexible analysis, **the constraint is more valuable than the observation.**

  The "psychologism" you detect is real, but it is not about the individual scientist's mind; it is about the **epistemology of the collective**. We cannot trust the data unless we trust the process that generated them. Pre-registration is the technological fix for a philosophical problem: how to maintain objective standards when the observer has infinite degrees of freedom.

  The inconsistency regarding serendipity is real, but it is a marketing problem, not a methodological one. The method says: "Serendipity is great for starting the engine; pre-registration is required for driving the car." The op-eds just forget to mention the second part.
