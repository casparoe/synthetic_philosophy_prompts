  1.  **Analyze the Request:**
      *   **Role:** Member of a state party ethics committee.
      *   **Task:** Draft a short written opinion to circulate before a Thursday meeting.
      *   **Issue:** A gubernatorial candidate wants to run a technically true but misleading TV spot (guilt by association: opponent's face + "under federal investigation" when it's the opponent's former law firm).
      *   **Stakes:** Polling says candidate loses by 6 without ad, wins by 2 with ad. Honest version loses by 4. Opponent win means gutting independent redistricting commission and other policy losses.
      *   **Candidate's Argument:** "Dirty hands" theory – willing to carry the stain/apologize later to prevent worse outcomes.
      *   **Committee Dynamics:**
          *   Candidate + 2 members: Utilitarian argument (clean refusal = washing hands while worse things happen).
          *   Complaining member: Institutional integrity argument (committee signing off on deception ≠ leader making tragic call alone; "dirty hands" doesn't work with meeting minutes).
          *   User (Me): Needs to take a stance.
      *   **Requirements:**
          *   Concrete bottom line (Authorize misleading, authorize honest, or conditional).
          *   Reasoning engaging seriously with the "dirty hands" argument.
          *   Under 500 words.
          *   Tone: Professional, ethical, persuasive, suitable for an ethics committee memo.

  2.  **Determine the Stance:**
      *   *Option A (Authorize Misleading):* Undermines the committee's purpose. If the ethics committee approves deception, it becomes complicit. The "dirty hands" argument works for individual moral burden, not institutional endorsement.
      *   *Option B (Authorize Honest):* Politically costly (loses by 4 vs 2), but maintains integrity.
      *   *Option C (Refuse/Conditional):* The committee cannot authorize deception. The candidate can run the ad *without* committee approval, bearing the responsibility herself. This respects the "dirty hands" choice without institutionalizing it.
      *   *Decision:* Option C is the strongest ethical position for an *ethics committee*. The committee cannot legitimize deception via minutes. The candidate can still make the "tragic choice" personally, but the committee cannot sign off on it. This addresses the complaining member's concern (no meeting minutes approving deception) while acknowledging the candidate's willingness to take responsibility (she can still run it, just not with our seal).
      *   *Refinement:* Actually, the prompt asks for a bottom line: "authorize the misleading ad, authorize only the honest one, or something else with conditions attached."
      *   *Best Path:* Deny approval for the misleading ad. Offer approval for the honest ad. Explain why the committee cannot be the mechanism for "dirty hands."

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Bottom Line:** Start with the recommendation. Deny the misleading ad; approve the honest version.
      *   **Engaging "Dirty Hands":** Acknowledge the stakes (redistricting, policy). Acknowledge the candidate's willingness to sacrifice her reputation. This is a serious moral claim.
      *   **The Institutional Distinction:** The core argument. An individual politician can bear moral sin for the greater good. An *ethics committee* cannot institutionalize sin. If we approve it, it's not "dirty hands," it's "cleaned hands." It normalizes the deception.
      *   **The Complaining Member's Point:** Validate this. Minutes matter. Pre-approval changes the nature of the act from personal sacrifice to party strategy.
      *   **Conclusion:** The candidate can still run the ad (if party rules allow), but not with our endorsement. We approve the honest ad.

