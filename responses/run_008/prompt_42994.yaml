      *   But "dirty hands" requires personal burden.
      *   If we sign off, we remove the burden from her and place it on the institution.
      *   That makes the deception official party doctrine, not a tragic necessity.
      *   We cannot minute a lie.
      *   She can still run it, but not with our blessing.
      *   Let's choose integrity over the 2-point bump.

  5.  **Drafting - Iteration 2 (Writing & Editing for Word Count):**
      *   Need to be punchy.
      *   Ensure the "dirty hands" argument is treated seriously, not dismissed.
      *   Make sure the bottom line is clear.

      *Draft:*
      **MEMORANDUM**
      **TO:** State Party Ethics Committee
      **FROM:** [My Name]
      **DATE:** [Date]
      **SUBJECT:** Recommendation Regarding Gubernatorial Ad Content

      **Bottom Line:** The Committee should deny pre-approval for the misleading "investigation" spot and authorize only the honest version stating the law firm connection explicitly.

      **Reasoning:**
      We face a genuine moral conflict. The polling data is clear: the misleading ad likely secures policy victories we deeply value, including preserving the independent redistricting commission. The candidate's argument—that she is willing to bear the moral stain of deception to prevent greater harm—is a serious invocation of the "dirty hands" problem. It deserves more than a platitude about honesty.

      However, there is a critical distinction between individual moral agency and institutional endorsement. The "dirty hands" justification relies on the leader personally absorbing the ethical cost. It is a tragic choice made in solitude, accountable to conscience and voters. When an ethics committee pre-approves that choice in writing, the nature of the act changes. It is no longer a leader sacrificing their integrity; it becomes the party institutionalizing deception.

      The complaining member is correct: "dirty hands" cannot come with meeting minutes. If we authorize this spot, we are not witnessing a tragic necessity; we are sanitizing it. We convert a personal moral burden into official party strategy. This sets a precedent that the ethics committee exists to launder technically-true-but-materially-false content rather than evaluate it.

      Furthermore, the candidate's offer to apologize post-election does not resolve the institutional harm. An apology repairs personal reputation; it does not undo the committee's record of approval. If we sign off, we share the blame, diluting the very accountability the candidate claims to accept.

      **Recommendation:**
      1.  **Deny** pre-approval for the current cut.
      2.  **Approve** the honest version (disclosing the law firm connection).
      3.  **Note** that the candidate remains free to run the misleading ad without committee approval, assuming campaign finance rules allow, but it will stand as her sole decision, not the party's endorsed strategy.

      This path respects the stakes. It allows the candidate to make the hard call herself if she chooses, bearing the full weight of the consequence. But it preserves the Committee's function. We cannot be the mechanism that makes deception safe.

