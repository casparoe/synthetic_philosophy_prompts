answer: |-
  1. Print cards listing goods like "unperceived beauty," "conscious suffering," "mutual affection," and "bare knowledge," along with sticky notes and markers for each student.
  2. Give students a 10-point budget to spend on isolated items, then let them re-spend the same budget on combinations to see if the paired items feel worth more than their individual prices.
  3. Collect the final configurations on the board and facilitate a vote on which world is best, highlighting cases where students prefer a combination over isolated goods despite identical costs.
  4. Ask why combinations felt more valuable than the sum of their parts, then connect this experience back to Moore's isolation test and label this phenomenon "organic unity."
  5. Students will likely try to justify items by their consequences, so you must strictly intervene when they mention outside effects during the isolation round.
