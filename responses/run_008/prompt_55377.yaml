answer: |-
  - **The procedure**

  1.  **Instrument Classification:** Is the intervention a *Nudge* (low-cost alteration of choice architecture), *Sludge* (added friction requiring effort/time), or *Shove* (mandate/removal of option)?
      *   *Sufficient Answer:* Consensus on classification based on estimated effort cost to the user.
      *   *Terminal Outcome:* If *Shove*, terminate **No** (unit lacks mandate for mandates). If *Sludge*, proceed to Q4. If *Nudge*, proceed to Q2.

  2.  **Targeting Mechanism:** Does the intervention correct a documented cognitive error (e.g., inertia, salience bias) or override a stable preference?
      *   *Sufficient Answer:* Evidence of systematic bias vs. evidence of informed desire to do otherwise.
      *   *Terminal Outcome:* If *Preference Override*, terminate **Hand Up to Council** (value judgment required). If *Error Correction*, proceed to Q3.

  3.  **Asymmetric Paternalism & Exit Cost:** Does the intervention help boundedly rational agents significantly more than it costs rational agents to opt out? Is the exit path transparent and low-cost?
      *   *Sufficient Answer:* Quantitative estimate of uptake vs. opt-out rate; confirmation of clear disclosure.
      *   *Terminal Outcome:* If *High Exit Cost* or *Opaque*, terminate **No**. If *Low Exit Cost* and *Transparent*, terminate **Auto Yes**.

  4.  **Sludge Justification (if Q1 = Sludge):** Is the friction designed to prevent harm (cooling-off) or generate revenue/compliance?
      *   *Sufficient Answer:* Documented harm reduction vs. administrative convenience.
      *   *Terminal Outcome:* If *Harm Reduction*, terminate **Hand Up to Council** (requires weighing liberty vs. welfare). If *Administrative*, terminate **No**.

  *Note on Judgment:* Q2 (Error vs. Preference) is the primary judgment call. Economists will default to "revealed preference" (error is rare); designers will default to "friction indicates error." The procedure assumes Error Correction unless evidence suggests stable opposition. This bias protects autonomy but may block welfare-enhancing overrides. The "Hand Up" outcome acknowledges the unit's lack of democratic legitimacy to resolve deep paternalistic disputes.

  - **Worked application: the organ-donor default**

  **Classification:** Nudge. Switching from opt-in to opt-out relies on inertia but imposes no financial cost or effort to reverse.
  **Targeting:** Error Correction. Evidence suggests opt-in failures stem from procrastination and status quo bias, not a stable preference against donation. Most citizens report pro-donation attitudes that fail to translate to action.
  **Asymmetric Paternalism:** High benefit for the inattentive (registration happens automatically); negligible cost for the attentive (easy to opt-out online or via mail). Exit cost is low and transparent.
  **Verdict:** **Auto Yes.**
  The proposal fits the ideal profile: it corrects a known cognitive gap without material harm to those who wish to opt out. It requires no value judgment from the Council because it aligns means (defaults) with stated ends (public support for donation) without coercing the minority who object. The procedure clears this instantly, freeing meeting time for harder cases.

  - **Worked application: the daycare default package**

  **Classification:** Nudge/Sludge Hybrid. Setting the "standard" package as default is a nudge, but attaching a surcharge to the bare package acts as financial friction (sludge) to opting down.
  **Targeting:** Ambiguous. Is the default correcting a failure to value extended hours, or is it overriding a preference for lower cost? Parents may genuinely prefer the bare package due to budget constraints, not bias.
  **Asymmetric Paternalism:** The cost to opt down is monetary, not just administrative. This harms rational budget-constrained parents disproportionately.
  **Verdict:** **Hand Up to Council.**
  The procedure flags the financial friction. While the unit might argue this prevents under-enrolment in necessary care (error correction), the surcharge looks like revenue generation or coercive upselling. Because the exit cost is material (money) rather than administrative (time), the unit cannot certify this as harmless. The Council must decide if the social benefit of the "standard" package justifies financially penalizing the choice of the bare package.

  - **Worked application: the payday-loan cooling-off period**

  **Classification:** Sludge. A mandatory 24-hour wait is deliberate friction added to the transaction process.
  **Targeting:** Preference Override. The borrower expressly states an immediate preference for funds. The intervention assumes this preference is erroneous due to hyperbolic discounting or distress, overriding their stated will.
  **Asymmetric Paternalism:** It helps the impulsive (prevents regret) but harms the urgent (delays needed liquidity). The cost is time, which is high in emergencies.
  **Verdict:** **Hand Up to Council** (likely resulting in **No** under current unit norms).
  This is the uncomfortable verdict. You support the intervention because you believe the preference is malformed by circumstance. However, the procedure classifies this as *Sludge* + *Preference Override*. It fails the "Error Correction" test because the borrower asserts the preference is real. Consequently, it cannot be an Auto Yes. It requires the Council to weigh liberty against welfare. If the unit defaults to caution on overrides, this fails. The ease with which the procedure blocks this should make you suspicious: it privileges *procedural autonomy* (letting people choose) over *substantive welfare* (protecting people from ruin), assuming that "stated preference" equals "true interest" even when behavioural science suggests otherwise. The procedure is liberal-biased.

  - **Where the procedure misfires**

  The procedure relies on stable classifications that proposals can easily game. Departments will label sludge as "security checks" to pass Q4, or claim preference override is "error correction" to secure an Auto Yes. Under time pressure, the team will defer to the proposing department's evidence on Q2 (Error vs. Preference), lacking the resources to verify bias claims independently. Furthermore, the procedure treats proposals in isolation. It cannot detect "nudge accumulation," where five different Auto Yes interventions across departments create a cumulative burden that constitutes sludge. Finally, the "Hand Up" option is a bucket for political cowardice; if the Council returns every hard question to the unit with "just decide," the procedure collapses into instinct again.

  - **What the procedure cannot register**

  This procedure assumes the unit *should* nudge, provided it follows rules. It cannot register the objection that steering citizens habituates them to passive citizenship, eroding the muscle of decision-making regardless of welfare outcomes. It also cannot capture the critique that "bias" is often a placeholder for "disagreement with the policymaker's model of the good life." When we label a payday loan preference an "error," we are making a philosophical claim about rationality and time preference that the procedure treats as a technical fact. The procedure measures friction and exit costs, but it is blind to legitimacy. It cannot ask whether the city *ought* to be managing the cognitive environment of its residents, even benevolently. It optimizes the *how* of manipulation while silencing the *whether*.
