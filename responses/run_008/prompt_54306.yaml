  The principle that captures your verdicts is **The Principle of Preserved Generative Constraints**.

  ### The Principle Stated Precisely

  A simplifying assumption is scientifically permissible if and only if it removes **accidental complexity** (noise, secondary forces, or implementation details) while preserving the **generative constraint** (the specific scarcity, conflict, or uncertainty that produces the phenomenon the model is designed to explain).

  Conversely, an assumption is objectionable when it dissolves the generative constraint. In your terms, this is when the assumption "smuggles in the answer": it makes the phenomenon of interest impossible, trivial, or inevitable by fiat, rather than letting it emerge from the model's mechanics.

  To apply this, you must identify the **Explanatory Target** of the model (what is it trying to explain?) and ask: *Does this assumption remove the very thing that causes the target to exist?*

  ---

  ### Application to the Difficult Pair

  This principle resolves your conflict between the **Traffic Model** and the **Election Model** by distinguishing between *physical bottlenecks* and *informational bottlenecks*.

  **1. The Traffic Model (Verdict: Fine)**
  *   **Explanatory Target:** Traffic congestion and flow dynamics.
  *   **Generative Constraint:** Road capacity vs. vehicle demand.
  *   **The Assumption:** Drivers always take the fastest route (perfect navigation).
  *   **Analysis:** Even if every driver knows the fastest route perfectly, the road still has a finite width. If everyone optimizes for the same road, it becomes congested, slowing it down, forcing re-routing. The *physical scarcity* (capacity) remains active. The assumption simplifies the *agent's logic* without removing the *system's bottleneck*. The congestion is still generated by the model, not assumed away.
  *   **Conclusion:** The generative constraint is preserved. The assumption is **Fine**.

  **2. The Election Model (Verdict: Not Fine)**
  *   **Explanatory Target:** Voting outcomes, swings, or the impact of campaigns.
  *   **Generative Constraint:** Decision-making under uncertainty and information asymmetry.
  *   **The Assumption:** Voters are perfectly informed about candidates.
  *   **Analysis:** In most political science models, the "problem" being studied is how voters aggregate limited information, how campaigns persuade, or how misinformation spreads. If voters possess perfect information, the *uncertainty* is removed. There is no room for persuasion, no risk of error, and no information asymmetry. The "choice" becomes a trivial calculation rather than a political process. The assumption removes the *informational scarcity* that drives the phenomenon.
  *   **Conclusion:** The generative constraint is dissolved. The assumption is **Not Fine**.

  **The Crucial Distinction:**
  Your intuition correctly spots that **Rationality** (optimizing given what you know) is different from **Omniscience** (knowing everything perfectly).
  *   **Rational Consumers:** You accept this because it assumes *structural consistency* (I buy what I like best within my budget), not *epistemic perfection*. The constraint (Budget/Scarcity) remains.
  *   **Perfectly Informed Voters:** You reject this because it assumes *epistemic perfection*. The constraint (Uncertainty/Information Cost) is removed.

  ---

  ### Evaluation of Your Verdicts

  Does this principle force you to give up any of your verdicts? **No.** Your intuition is remarkably consistent with the Principle of Preserved Generative Constraints. However, the principle does add a necessary condition to two of your "Fine" verdicts that you should be aware of to keep your rule robust.

  **1. The "Rational Consumers" Verdict**
  *   **Your Verdict:** Fine.
  *   **Principle Check:** This holds *only* if the model's target is **Price Equilibrium** (where scarcity is the constraint).
  *   **Caveat:** If the model's target is **Market Crashes** or **Bubbles**, the assumption of perfect rationality *does* dissolve the generative constraint (which, in behavioral finance, is psychological bias). In that specific context, your gut should object. As long as you are thinking of standard microeconomics (allocation), your verdict stands.

  **2. The "Traffic Model" Verdict**
  *   **Your Verdict:** Fine.
  *   **Principle Check:** This holds *only* if the model's target is **Flow/Congestion** (where capacity is the constraint).
  *   **Caveat:** If the model's target is **Navigation Error** or **The Value of GPS Systems**, then assuming perfect routing smuggles in the answer (GPS is useless). As long as the model is about *traffic physics* rather than *driver psychology*, your verdict stands.

  ### Summary
  You do not need to give up any verdicts, provided you implicitly understand that the validity of an assumption depends on the **Explanatory Target**.

  Your "smuggling" intuition was correct:
  *   **Fine Assumptions** clear the stage so the main actors (Gravity, Scarcity, Capacity) can perform.
  *   **Not Fine Assumptions** fire the main actors and replace them with puppets that guarantee a happy ending (Public Interest, Perfect Compliance, Perfect Information).

  The Traffic model keeps the main actor (Capacity); the Election model fires the main actor (Uncertainty). Your distinction is precise.
