          *   *Better Advice:* The prompt asks for the "cheapest fix." Dropping (3) is the cheapest fix to save the DBA argument. Keeping (3) requires rebuilding the whole formal framework.
          *   *Alternative:* The TA said "inconsistency." The friend said (3) sinks it. The most coherent "DBA defense" paper usually bites the bullet on Ellsberg (says it's irrational) or restricts the scope of DBA.
