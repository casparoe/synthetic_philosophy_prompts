          *   *Assessment:* Accurate. Understands that $h^2 = V_A / V_P$ and that $V_P$ changes with environment and $V_A$ changes with population genetics.
          *   *Score:* Full marks for this section.

      *   **Part 3 (Within-Group vs. Between-Group Differences):**
          *   *Student:* "if a trait is measured as highly heritable in both of two groups, and the two groups live in broadly comparable environments, then a genetic difference between the groups is the most parsimonious explanation..."
