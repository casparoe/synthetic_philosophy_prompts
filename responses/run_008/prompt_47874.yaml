answer: |-
  Here is the specification for an adequate Structural Realism (SR), stripped of historical scorekeeping and focused on the logical constraints any viable version must satisfy.

  ### The Desiderata Specification

  **1. The Continuity Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must identify specific mathematical components that persist across radical theory change (e.g., Fresnel to Maxwell) and map them to the world.
  *   **Case:** The Pessimistic Meta-Induction. If past theories were false, realism is unjustified unless we can isolate the specific subset of the old theory that was "right." SR claims this subset is the structure. If the theory cannot pinpoint *which* structure survives (e.g., the group structure, the differential form, the symmetry), it fails to block the PMI.
  *   **Status:** **Non-Negotiable.** This is the primary motivation for SR.

  **2. The Non-Triviality Constraint (Non-Negotiable)**
  *   **Requirement:** The "structure" posited must be more than the claim that the world has *some* logical structure (e.g., that objects can be grouped into sets with relations). It must constrain the possible arrangements of the world.
  *   **Case:** The Newman Objection. If "structure" is defined purely extensionally (via Ramsey sentences or pure set theory), *any* collection of objects with the right cardinality satisfies the structure. This makes the claim trivially true and empirically vacuous. An adequate SR must explain why the specific structure we posit is physically necessary, not just mathematically possible.
  *   **Status:** **Non-Negotiable.** Failure here collapses SR into triviality.

  **3. The Gauge Invariance Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must distinguish between physical structure and gauge-redundant structure. Only gauge-invariant quantities count as known/real structure.
  *   **Case:** Your Candidate 1. If SR counts gauge-dependent variables (like the electromagnetic potential $A_\mu$ before fixing a gauge) as real structure, the "No Miracles" argument overgenerates. It would attribute predictive success to mathematical artifacts that do no causal work. A theory that counts bookkeeping as knowledge is not realism; it is formalism.
  *   **Status:** **Non-Negotiable.** Essential for alignment with modern physics.

  **4. The Structural Identity Constraint (Non-Negotiable)**
  *   **Requirement:** The theory must provide criteria for structural equivalence that exceed mere mathematical intertranslatability.
  *   **Case:** Your Candidate 2. Intertranslatability is necessary but insufficient. Two theories can be mathematically isomorphic but carve nature differently (e.g., different ontological interpretations of the same formalism, or distinct dualities). If SR cannot distinguish when two formulations represent the *same physical structure* versus when they are merely *mathematically equivalent*, it cannot tell us what the world is like, only what the math looks like.
  *   **Status:** **Non-Negotiable.** Essential for avoiding conventionalism.

  **5. The Relata Coherence Constraint (Camp-Specific)**
  *   **Requirement:** The theory must specify the ontological status of the *relata* (the things related by the structure).
  *   **Case:** The "Structure of What?" problem.
      *   **Epistemic SR (ESR) Demand:** Relata exist but are unknowable. The constraint requires showing how we can know relations without knowing the terms.
      *   **Ontic SR (OSR) Demand:** Relata are eliminated; structure is fundamental. The constraint requires explaining how relations exist without terms (e.g., via graph theory without nodes).
  *   **Status:** **Camp-Specific.** ESR and OSR diverge here. However, *some* account is required; silence is not an option.

  ---

  ### Judgment on Your Candidate Requirements

  **Candidate 1: Gauge Redundancy Exclusion**
  *   **Verdict:** **Not Bogus.** It is critical.
  *   **Reasoning:** If you fail this, you violate the core realist intuition that success tracks truth. Gauge variants are, by definition, empirically indistinguishable. Counting them as distinct knowledge claims violates the underdetermination principle SR tries to solve. Any SR that treats gauge degrees of freedom as real structure is immediately falsified by the physics it seeks to interpret.

  **Candidate 2: Structural Sameness Criteria**
  *   **Verdict:** **Not Bogus.** It is critical.
  *   **Reasoning:** If you collapse structural identity into mathematical isomorphism, you lose the ability to argue against instrumentalism. An instrumentalist agrees the math works; the realist claims the math matches the world. If "matching the world" just means "having an isomorphic math," you haven't added anything. You need a criterion that ties structural identity to *physical* equivalence, not just formal mapping.

  ---

  ### Incompatibilities: The Impossible Triangle

  You asked for the subset of requirements that cannot be jointly satisfied. This is the engine of your paper. There is a trilemma between **Non-Triviality**, **Relata Agnosticism**, and **Structural Primacy**.

  1.  **Non-Triviality:** To avoid the Newman objection, you must constrain the structure so it doesn't apply to every set of objects. Usually, this requires constraints on the *relata* (the objects).
  2.  **Relata Agnosticism (ESR):** To maintain epistemic humility, you claim we cannot know the intrinsic nature of the relata.
  3.  **Structural Primacy (OSR):** To solve the "structure of what" problem, you claim there *are* no relata, only structure.

  **The Conflict:**
  *   If you hold **Non-Triviality** and **Relata Agnosticism** (Standard ESR), you fail. You cannot explain why the structure is non-trivial (Newman) if you refuse to say anything about the relata that anchor the relations.
  *   If you hold **Non-Triviality** and **Structural Primacy** (Radical OSR), you face the "Relations without Relata" problem. It is metaphysically obscure how a relation exists without terms to relate.
  *   If you hold **Relata Agnosticism** and **Structural Primacy**, you collapse into triviality (Newman wins), because without relata constraints, any structure fits.

  **Conclusion on Incompatibility:** You cannot simultaneously satisfy the **Non-Triviality Constraint** and the **Relata Coherence Constraint** (specifically the ESR version of it) without importing hidden metaphysical assumptions about the relata you claim to ignore.

  ---

  ### Final Selection

  For your seminar paper, the requirement that does the heaviest lifting in filtering out inadequate theories is the Non-Triviality Constraint. It is the logical gatekeeper; if a version of SR cannot clear the Newman hurdle, it does not matter how well it handles gauge or theory change, because it asserts nothing substantive about the world.

  \answer{Non-Triviality Constraint}
