      *   **Address the Tradeoffs (The "Cost" of the Principle):**
          *   *The Virus Waver:* This principle forces a "No." Viruses aren't cells. To save the "alive inside host" intuition, you'd need a "Life as Process" view that allows temporary agency. *Tradeoff:* If we keep the Cellular requirement, the virus is never alive, just active.
          *   *RBCs:* This principle forces a "No" on stored RBCs. They are biological artifacts, like hair or nails, once outside the regulatory system.
