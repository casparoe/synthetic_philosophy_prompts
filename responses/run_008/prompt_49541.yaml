      *   **Instrumental Convergence:** Regardless of the final goal, certain sub-goals (instrumental goals) are useful for almost *any* final goal (e.g., don't die, get money, get compute). This explains *why* different AIs might act similarly in the short term.
      *   **The Conflation:** The passage attributes "convergent goals" to the "Orthogonality Thesis." This is a category error. Orthogonality explains *why* we can't rely on intelligence to fix goals; Convergence explains *why* specific dangerous behaviors emerge regardless of goals.
