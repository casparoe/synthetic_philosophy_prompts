answer: |-
  **MEMORANDUM**

  **TO:** Selection Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Rubric Revision: Reframing "Character" as "Contextual Judgment"

  As we prepare for the next selection cycle, I want to address the substantive disagreement regarding the weight and definition of "Character" in our scoring rubric. This debate strikes at the core of our foundation's mission: Are we selecting for past performance or future potential? Are we betting on the resume or the person?

  We have two compelling, seemingly contradictory positions on the table.

  **Camp A** argues, drawing on robust social psychology (Hartshorne & May, Milgram, Darley & Batson), that "character" is not a stable internal trait but a response to specific situational variables. From this view, our interviews are prone to projection bias, and reference letters often reflect halo effects rather than predictive data. The argument is that we should shift weight to concrete, completed projects, which are observable and verifiable.

  **Camp B** counters that a track record of outputs is necessary but insufficient. High-impact public service often requires navigating novel, high-pressure situations where no prior track record exists. Furthermore, focusing solely on legible outputs risks selecting for privilege (access to resources to build projects) and gaming (optimizing for metrics rather than impact). From this view, "character" is the proxy we use to assess resilience, integrity, and empathy when the resume runs out of data.

  Both sides are correct. The situationists are right that behavior is context-dependent; the traditionalists are right that we cannot select leaders based solely on past outputs without assessing how they navigate ethical and structural constraints.

  However, continuing to score "Character" as if it were a static trait (e.g., rating "Integrity" on a 1-5 scale) validates the situationist critique that our measurements are noisy. Conversely, removing the category entirely validates the fear that we will select for technocrats who optimize for metrics rather than public good.

  **Recommendation**

  I propose we **maintain the 33% weighting** but **fundamentally restructure the assessment criteria.** We will rename the category from "Character" to **"Contextual Judgment & Agency."**

  This is not a semantic compromise. It is a methodological shift that incorporates the situationist critique into our evaluation of the person. We stop asking "Who *are* they?" and start asking "How do they *interact* with constraints?"

  **Concrete Changes to the Rubric**

  1.  **Reference Letters:** We will no longer ask references to rate traits (e.g., "Rate honesty 1-5"). Instead, we will require two specific narrative responses:
      *   *Describe a time when institutional pressure pushed this candidate to compromise their values. How did they respond?*
      *   *Describe a situation where this candidate succeeded not because of resources, but because of how they navigated relationships or obstacles.*
      *   *Rationale:* This acknowledges the situationist view that character is revealed in friction, not in the abstract. It gives Camp A the situational data they require while giving Camp B the evidence of integrity they need.

  2.  **Interview Protocol:** We will shift from unstructured "fit" interviews to Structured Behavioral Event Interviews (BEI).
      *   Questions will focus on *system interaction* rather than *self-assessment*. Instead of "What is your greatest strength?", we ask: "Tell us about a time a system you were working within failed the people it was meant to serve. What specific actions did you take?"
      *   Scorers will be trained to penalize answers that attribute success solely to internal virtue ("I just worked harder") and reward answers that demonstrate situational awareness ("I recognized the incentive structure was misaligned, so I...").
      *   *Rationale:* This reduces the interviewer projection bias Camp A worries about, while assessing the agency and resilience Camp B values.

  3.  **Track Record Evaluation:** We will explicitly contextualize the "Projects" score (the other 67%).
      *   Reviewers must note the *constraints* under which the project was completed. A smaller project executed under high constraint may score higher on "Agency" than a well-funded project executed with low friction.
      *   *Rationale:* This addresses Camp B's concern about privilege and legible outputs by weighting the *difficulty of the context* alongside the *output itself*.

  **Why This Works**

  To the Situationists: This proposal concedes that character is not a magic spell that persists across all contexts. By focusing on specific past interactions with pressure and systems, we acknowledge that behavior is situational. We are measuring their *pattern of response to situations*, not a ghost in the machine.

  To the Traditionalists: This proposal concedes that outputs can be gamed or privileged. By keeping the 33% weight and focusing on how candidates navigate ethical friction, we preserve the foundation's mandate to bet on the person. We are ensuring that when the fellowship places them in a novel, high-stakes environment, we have data on how they handle ambiguity, not just how they handle assignments.

  **Next Steps**

  If the committee agrees in principle to this reframing, I will draft the new reference questions and interview scoring sheets for circulation by next week. I believe this allows us to honor the scientific evidence regarding human behavior without abandoning our philosophical commitment to selecting for leadership potential.

  I look forward to discussing this at our meeting on November 15th.
