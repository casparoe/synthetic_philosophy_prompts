prompt: |-
  I'm on the selection committee for a fellowship our foundation gives to college seniors heading into public service, and we're fighting about how much weight to give "character." It's currently a third of the score, based on interviews and reference letters, because the founding idea was that we're betting on the person, not the resume. One of our commitee members teaches social psych and keeps pushing situationism at us: the old Hartshorne and May honesty studies, Milgram, the seminarians-in-a-hurry finding, all supposedly showing that what people do is driven by circumstances more than by stable traits, and that interviewers mostly project a coherent character onto whatever's in front of them. Half the committee wants to scrap the character score entirely and shift the wieght to a track record of concrete completed projects. The other half says the track record only counts *because* it displays character, so this is a distinction without a difference, and that a fellowship picked purely on outputs will select for people who optimize for legible outputs. Draft the memo I'll circulate before next month's meeting: recommend a concrete change (or a concrete non-change) to the scoring rubric, with reasoning both sides could actually respond to, and take the losing side's best argument seriously rather than just splitting the baby.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Selection Committee Member.
      *   **Audience:** Fellow Committee Members (divided into two camps).
      *   **Topic:** Weight of "Character" vs. "Track Record/Outputs" in a fellowship selection rubric.
      *   **Current State:** Character is 1/3 of the score (interviews + references). Foundation philosophy: "Betting on the person, not the resume."
      *   **Conflict:**
          *   *Camp A (Situationists):* Character isn't stable (Hartshorne & May, Milgram, Darley & Batson). Interviews are biased projections. Shift weight to concrete projects.
          *   *Camp B (Trait/Integrators):* Track record *is* a proxy for character. Removing character metrics selects for output-optimizers, not public servants.
      *   **Task:** Draft a memo for the next meeting.
      *   **Requirements:**
          *   Recommend a concrete change (or non-change).
          *   Provide reasoning both sides can respond to.
          *   Take the losing side's best argument seriously (no cheap compromise/splitting the baby).
          *   Tone: Professional, thoughtful, persuasive, bridge-building.

  2.  **Deconstruct the Arguments:**
      *   **Situationist Argument (Camp A):** Psychology shows behavior is context-dependent. Interviews are noisy and prone to halo effects/halo bias. We can't measure "who they are," only "what they did." Let's measure what they did.
      *   **Trait/Philosophy Argument (Camp B):** The foundation's mission is public service *leadership*, not just task completion. Outputs can be gamed or privileged (access to resources). Character (resilience, integrity, empathy) predicts behavior in *novel* situations where there's no track record.
      *   **The "Splitting the Baby" Trap:** Simply keeping it at 33% or moving it to 25% doesn't address the core epistemological disagreement. We need a structural change that acknowledges situationism while preserving the "bet on the person" philosophy.

  3.  **Develop a Strategic Recommendation:**
      *   *Option 1: Keep it the same.* (Too status quo, ignores the social psych evidence).
      *   *Option 2: Scrap character entirely.* (Violates foundation mission, ignores the "optimizing for legible outputs" risk).
      *   *Option 3: Reframe "Character" as "Contextualized Judgment."* This is the winner.
      *   *Why?* It accepts the situationist critique (behavior depends on context) but maintains the need to assess the *person's relationship to context*. Instead of asking "Are they honest?" (trait), ask "How do they navigate ethical pressure?" (situation + agency).
      *   *Concrete Change:* Keep the 1/3 weight, but change *how* it is assessed. Move away from abstract references ("Is she honest?") toward situational behavioral evidence ("Tell us about a time systems failed you"). Shift interview focus from "Who are you?" to "How do you interact with constraints?"
      *   *Addressing Camp A:* Acknowledges traits aren't magic spells; admits interviews need structure to reduce projection.
      *   *Addressing Camp B:* Preserves the focus on the human element beyond just outputs; acknowledges outputs happen within systems.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the debate. Validate both sides. State the purpose (decision for next cycle).
      *   **The Core Tension:** Articulate the "Person vs. Resume" vs. "Situation vs. Trait" debate clearly. Show I understand the social psych literature (Hartshorne & May, etc.).
      *   **The Recommendation:** Don't change the *weight* (keep 1/3), but change the *method*. Rename "Character" to "Contextual Judgment & Agency."
      *   **Rationale (Addressing Camp A - Situationists):**
          *   Admit traits aren't cross-situational constants.
          *   Admit unstructured interviews are prone to bias.
          *   Solution: Structured Behavioral Event Interviews (BEI) focused on constraints, not virtues.
      *   **Rationale (Addressing Camp B - Traditionalists):**
          *   Admit outputs can be gamed or privilege-dependent.
          *   Admit we need to predict behavior in *new* situations (fellowship contexts).
          *   Solution: Assessing how they navigate situations is better than just counting outputs.
      *   **Implementation:** Specific changes to reference questions and interview rubrics.
      *   **Closing:** Call for feedback based on this specific framing.

  5.  **Refining the Tone:**
      *   Avoid condescension.
      *   Ensure the social psych references are accurate but not pedantic.
      *   Make sure the "losing side" (let's say, if we move away from pure trait theory, Camp B loses a bit, but if we keep the weight, Camp A loses a bit) feels heard. Actually, the prompt asks to take the *losing side's* best argument seriously. Since I'm recommending a *modification* rather than a scrap, Camp A (Scrap Character) is the "losing" side in terms of the raw score, but their critique drives the methodological change. I need to make sure Camp A feels like their scientific critique fundamentally altered the *nature* of the assessment, even if the weight remains.
      *   *Self-Correction:* Actually, the prompt asks to recommend a concrete change *or* non-change. If I recommend keeping the weight but changing the method, both sides win/lose something. I need to make sure I don't just "split the baby." The distinction is: Camp A says "Character doesn't exist." Camp B says "It does." My stance: "Character as a static trait is dubious, but *patterned response to situation* is real and measurable." This validates the science without abandoning the mission.

  6.  **Final Polish:** Check against constraints.
      *   Concrete change? Yes (Rubric rename + Question structure).
      *   Reasoning both sides respond to? Yes (Science vs. Mission).
      *   Take losing side seriously? Yes (The Situationist critique fundamentally reshapes the *definition* of character, even if the category remains).

  7.  **Writing the Memo:** (Drafting mentally...)
      *   Subject: Rubric Revision Proposal.
      *   Start with the shared goal: Selecting effective public servants.
      *   Address the Hartshorne/May point directly. It's strong.
      *   Address the "Legible Outputs" risk directly. It's strong.
      *   Proposal: Shift from "Character Assessment" to "Situational Judgment & Agency."
      *   Keep the 33% weight (compromise on number, but not on logic).
      *   Change the questions. References shouldn't rate "Integrity 1-5." They should describe "A time integrity was costly."
      *   Interviews shouldn't be "What are your strengths?" They should be "Describe a system that pushed you to compromise."

  8.  **Final Review:** Does this sound like a committee member speaking to peers? Yes. Is it actionable? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to sound like I'm dismissing the Situationists. Their point is scientifically robust. I need to concede that "Character" as a *ghost in the machine* is wrong, but "Character" as *stable interaction style* is useful. I will frame the recommendation as "Operationalizing Situationism."

