answer: |-
  1. The theory must provide a cardinal ranking mechanism that translates moral wrongs into specific units of deprivation, not just a binary permission to punish. A sentencing commission cannot write guidelines based on "punish the wicked" without a metric for how much wickedness equals six months versus five years.

  2. The theory must justify punishment severity based on factors other than actual harm caused, ensuring attempted murder and completed murder are distinguishable yet both punishable. If punishment tracks only harm, the drunk driver who hits a pedestrian is guilty of murder while the identical drunk driver who hits no one is guilty of nothing, which violates intuitive culpability standards.

  3. The theory must account for liability in the absence of proven subjective culpability without resorting to purely instrumental deterrence arguments. Regulatory offenses like statutory rape or environmental dumping often punish actors who lacked malicious intent, requiring a basis for blame that isn't solely rooted in conscious choice.

  4. The theory must explain how punishment applies to non-sentient collectives that cannot feel pain or possess moral agency in the human sense. When a corporation is fined for fraud, the theory must clarify who is actually being punished—the shareholders, the entity itself, or the public—since the corporation cannot suffer retributively.

  5. The theory must maintain a conceptual firewall between what an offender deserves and what produces the best social outcomes, prohibiting the substitution of one for the other. A utilitarian calculation might justify punishing an innocent person if it stops a riot, but a viable theory must rule this out even if the outcome is optimal.

  **Pair that can't be jointly satisfied:** Requirements 1 and 5. Retributive desert (5) is inherently qualitative and resists the quantitative translation required for a cardinal sentencing scale (1), while consequentialist scaling (1) inevitably collapses desert into social optimization (5). You cannot have a fixed metric of moral worth that simultaneously refuses to trade off against social utility.

  **Single requirement that knocks out standard contenders:** Requirement 1. Retributivism fails because it has no natural unit of measurement for "an eye for an eye" in modern incarceration, consequentialism fails because optimal punishment fluctuates with crime rates rather than fixed scales, and restorative justice fails because it is case-specific and resists standardization. This is the implementation filter that turns philosophy into policy, and every major theory breaks against it.
