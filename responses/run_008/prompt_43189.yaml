          *   *Deeper Issue:* The "Same Person" claim under psychological criteria across different conception times is highly controversial and arguably incoherent in this context. If I am conceived 10 years later, my parents are different ages, the historical context is different, my upbringing is different. My psychological makeup would be radically different. Would it be the *same* person? Most philosophers say no.
          *   *Parfit's Own View:* Parfit actually *reduced* personal identity to psychological continuity (in *Reasons and Persons*). He didn't use NIP to prove identity is biological; he used NIP to show that *Person-Affecting Views* are inadequate. He accepted the Non-Identity Fact.
