          *   *Response:* It's not just stubbornness. Most philosophers agree the *logic* is valid but reject one of the *premises* or the *framework*. The intuition that "depletion is wrong" is stronger than the intuition behind the Person-Affecting View. It's not like the Repugnant Conclusion (where the conclusion itself is repugnant); here, the conclusion contradicts a deep moral intuition about responsibility.
      *   *The "Fix" (Psychological Continuity):* This is the crux of the second part.
