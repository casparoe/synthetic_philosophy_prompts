answer: |-
  This is a fantastic way to build character consistency. You are essentially reverse-engineering a utility function for Rosa. Because you want to avoid the pitfall of presenting contested economic theory as fact, I will structure this response by clearly separating the **mathematical consensus** (what her choices imply about standard models) from the **interpretive debate** (what those choices mean about her rationality).

  ### Part 1: The Academic Ground Truth
  *Use this section to ensure your narration or internal monologue doesn't accidentally state a contested theory as a law of physics.*

  **What is Settled (The Math):**
  Rosa's choices exhibit a classic violation of **Subjective Expected Utility (SEU)** theory, specifically the **Independence Axiom** (or Savage's Sure Thing Principle).
  *   **The Fact:** In standard probability theory, if you prefer Urn K over Urn C in Scenario 1, you should logically maintain that preference ranking when both are paired against a third option. Her switching preferences between Scenario 1 (K > C) and Scenario 2 (C > Known 30/70) creates an intransitivity that cannot be modeled using a single, consistent subjective probability number.
  *   **The Label:** This is the **Ellsberg Paradox**. It is a settled mathematical fact that her behavior cannot be represented by a standard Bayesian belief system.

  **What is Contested (The Meaning):**
  *   **Rationality:** Standard behavioral economics often labels this a "bias" (ambiguity aversion). However, evolutionary economists and game theorists (like Ken Binmore) argue it is **ecologically rational**. In the real world, "unknown mixes" are often created by adversaries trying to cheat you. Rosa's skepticism might be a feature, not a bug.
  *   **Modeling:** There is no single "accepted" framework to fix the math. Some scholars use **Maxmin Expected Utility** (she assumes the worst-case scenario for ambiguous urns), others use **Smooth Ambiguity** (she has a probability distribution over probabilities), and others use **Source Dependence** (she weights "Nature" risks differently than "Human" risks). None are consensus; they are just tools.

  ***

  ### Part 2: Candidate Rules for Rosa
  Based on your five data points, here are the two strongest character rules that fit her behavior.

  #### Rule A: "The Verifier" (Epistemic Closure)
  **The Logic:** Rosa only trusts information she has personally verified. If she didn't see the balls go in, the data doesn't exist.
  *   **Fits Data:** Explains Scenario 1 (She saw K filled, didn't see C) and Scenario 4 (Didn't see Denny fill the jar).
  *   **Strain on Data:** Struggles with Scenario 2. She chose Urn C (unverified coin flips) over a Known 30/70 urn. Unless she distrusts the label "30/70" as much as she distrusts the coin, this rule doesn't fully explain why she prefers the Coin urn over the Known urn in Scen 2.
  *   **Voice:** "If I didn't watch it happen, it's just a story."

  #### Rule B: "The Poker Player" (Source Dependence)
  **The Logic:** Rosa distinguishes between **Nature** (random processes like coins) and **Agents** (people like Denny). She assumes Nature is neutral, but she assumes Agents are adversarial unless proven otherwise.
  *   **Fits Data:** Perfectly explains Scenario 4 (Denny = Adversary) vs. Scenario 2 (Coin = Nature). It explains why she tolerates the ambiguity of the Coin urn (Scenario 2) but rejects the ambiguity of Denny's jar (Scenario 4).
  *   **Strain on Data:** Requires her to view the "Known 30/70" urn in Scenario 2 as less trustworthy than the Coin urn. Perhaps she views fixed ratios as "House Odds" (rigged) and coin flips as "Fair."
  *   **Voice:** "The coin doesn't care if I lose. Denny cares very much."

  ***

  ### Part 3: Prediction for the Denny vs. 25/75 Scene
  **The Setup:** Denny's Jar (Human/Unknown) vs. Known Urn (25 Red / 75 Black).
  **The Bet:** $500 if she names the color and draws it.

  **Prediction:** **She takes the Known Urn (25/75).**

  **Reasoning:**
  In Scenario 4, she rejected Denny's Jar in favor of a Known 40/60 urn. Assuming she names the majority color (Black), that was a 60% win chance. In this new scene, the Known urn offers a 75% win chance.
  *   **Under Rule A (Verifier):** She takes the Known urn because she can verify the mix. Denny's jar is unverified.
  *   **Under Rule B (Poker Player):** She takes the Known urn because 75% is a "fat line," and she refuses to play against Denny's potential stack unless the odds are overwhelming. Since she wouldn't play Denny at 60% odds (Scen 4), she won't play him at 75% odds unless the payout changes.

  **Drafting Tip:** To nail her voice, don't have her calculate the 75%. Have her focus on the *source*.
  *   *Example Internal Monologue:* "Seventy-five black balls. I can see them. Denny's jar? That's not a bet, that's a donation."

