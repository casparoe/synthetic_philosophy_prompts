  ### Part 5: The Niece vs. Stranger Nuance
  You asked specifically about who filled the jar. This is where **Rule B (Source Dependence)** shines and adds great texture to her character.

  **If her Niece fills the jar:**
  *   **Rule A Prediction:** Rejects it. (Didn't verify the mix).
  *   **Rule B Prediction:** **Accepts it.** (Or treats it as neutral). She trusts the Niece's intent (non-adversarial). She might even treat it like Urn C (The Coin).
  *   **Character Beat:** This shows her soft spot. "Kid wouldn't screw me. Might not know how to mix 'em, but she won't stack 'em."

  **If a Stranger fills the jar:**
  *   **Rule A Prediction:** Rejects it.
  *   **Rule B Prediction:** **Rejects it.** (Treats it like Denny). In the absence of trust, she assumes adversarial intent.
  *   **Character Beat:** This shows her street smarts. "Don't know you? Then you're trying to eat my lunch."

  **If Denny fills the jar:**
  *   **Prediction:** **Strongest Rejection.** Denny is a known quantity (a poker buddy). She knows he *can* stack decks. The "Ambiguity Penalty" is highest here because she knows his capability for deceit.

  ### Summary for your Draft
  1.  **Academic Note:** You can safely say her choices violate "standard probability axioms" (Settled). Do not say they are "irrational" (Contested). Frame it as her protecting herself against "bad info."
  2.  **The Rule:** Adopt **Rule B (Source Dependence)**. It fits the Denny data best and makes her more active as a character (judging people) rather than passive (checking receipts).
  3.  **The Scene:** She takes the Known 25/75 urn. Her reasoning isn't about the 75%; it's about refusing to let Denny set the terms.
  4.  **The Future:** Use the "Niece" scenario to show she isn't a sociopath; she trusts innocence. Use the "Stranger" scenario to show she isn't naive.

  This approach keeps the math honest without letting it dictate the soul of the character.
