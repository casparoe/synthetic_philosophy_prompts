  ### Part 4: The Tie-Breaker Scenario
  You mentioned you can slip one more chapter in. To distinguish between **Rule A (Verifier)** and **Rule B (Poker Player)**, you need to test whether her issue is *verification* or *adversarial intent*.

  **The Scenario:**
  > **Urn N:** Filled by a random number generator machine (verified to be truly random, but she didn't see the specific outcome).
  > **Urn S:** Filled by a Stranger who she watches do it, but she doesn't know the stranger's motives.

  **The Split:**
  *   **If she follows Rule A (Verifier):** She rejects *both*. She didn't count the balls herself in either case. Ambiguity is ambiguity.
  *   **If she follows Rule B (Poker Player):** She prefers **Urn N (Machine)**. The machine has no intent to cheat. The Stranger has intent, even if unknown.

  **Recommendation:**
  If you want Rosa to feel like a **hardened gambler**, go with **Rule B**. It gives her more agency; she isn't just obsessive about verification, she is reading *intent*. It makes her smarter.
  *   *Chapter Idea:* Have her accept a bet from a drunk who fills a jar randomly, but refuse a bet from a sober shark who fills a jar identically. That shows she bets on *people*, not just math.

