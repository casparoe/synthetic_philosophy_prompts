answer: |-
  **Essay Question**

  The "scale argument" for insect ethics contends that even if the probability ($P$) of any given insect being sentient is very low, the vast number of insects ($N$) implies a massive expected value of suffering, demanding moral attention. Critically evaluate the decision-theoretic structure of this argument. Do not discuss empirical evidence regarding invertebrate nervous systems. Instead, analyze whether the argument necessarily relies on expected-value maximization over moral uncertainty. How does its force change if moral status is a threshold property rather than a matter of degree? Does it survive lexical or risk-weighted approaches where avoiding catastrophic error prioritizes over maximizing expected value? Finally, assess the symmetry between the small probability that insects are sentient ($P_S$) and the small probability that any proposed intervention would reduce suffering on net ($P_E$). Is this symmetry a feature of the argument, an artifact of expected-value reasoning, or a defect? Conclude by stating whether the argument's practical force depends more on entomological confidence or on the rules used to aggregate moral uncertainty.

  ***

  **Model Answer**

  The scale argument functions less as an empirical claim about insects than as a decision-theoretic maneuver under moral uncertainty. Its core structure is expected-value (EV) maximization: Expected Suffering = $P_S \times N \times \text{Intensity}$. By inflating $N$, the argument compensates for a low $P_S$, forcing the product to remain morally significant. However, this reliance on linear multiplication is contingent on accepting standard EV maximization as the correct method for aggregating moral uncertainty. If one adopts a "my favorite theory" approach or a specific credence threshold for moral patienthood, the scale argument collapses regardless of $N$. Thus, the argument's validity is internal to the meta-ethical framework chosen, not the biological data.

  This fragility becomes apparent when examining moral status. If moral status is a matter of degree, EV maximization holds: partial credence in sentience yields partial moral weight. However, if moral status is a threshold property—an entity is either a patient or it is not—the scale argument struggles. Under a threshold view, low credence in sentience might fail to cross the bar for inclusion in the moral community entirely. Unless one adopts a "probability-weighted threshold" (where the probability of crossing the threshold matters), the sheer number of entities below the threshold remains morally irrelevant. The scale argument therefore implicitly presupposes a gradualist view of moral status or a specific interpretation of thresholds that allows probabilistic inclusion.

  Furthermore, the argument faces challenges from lexical or risk-weighted views. In these frameworks, avoiding a catastrophic moral error (e.g., enslaving a sentient being) takes priority over maximizing aggregate welfare. While this might initially seem to support insect protection, it often cuts the other way regarding intervention. If interventions carry a risk of making things worse (e.g., ecological collapse causing more suffering), a risk-averse lexical rule might forbid intervention entirely. The scale argument assumes we should act on the expected value of suffering prevented, but lexical priorities might demand we act on the worst-case scenario of our intervention, not the worst-case scenario of inaction. This shifts the burden from the magnitude of insect populations to the certainty of our causal impact.

  This leads to the crux of the structural analysis: the symmetry between $P_S$ (probability of sentience) and $P_E$ (probability of effective intervention). The scale argument highlights the uncertainty of $P_S$ but often treats the efficacy of intervention as sufficiently known to warrant action. Yet, in complex ecosystems, $P_E$ is likely equally low. If we apply the same skeptical discounting to $P_E$ that we apply to $P_S$, the expected value becomes $P_S \times N \times P_E$. If both probabilities are small, their product is negligible, regardless of $N$. Treating $P_S$ as a reason for caution while treating $P_E$ as a reason for action is an asymmetry. This asymmetry is an artifact of EV reasoning that selectively applies uncertainty discounts. A consistent decision rule would either discount both (paralyzing action) or discount neither (demanding radical intervention).

  Ultimately, the scale argument's practical force depends almost entirely on how moral uncertainty is aggregated, not on how confident we are about the entomology. Even with perfect knowledge of insect nervous systems, if one rejects EV maximization in favor of threshold-based or lexical decision rules, the argument fails. Conversely, under strict EV maximization, even negligible credence in sentience mandates action. Therefore, the debate is not about insect brains, but about whether we should multiply probabilities across uncertainties or treat them as veto conditions. The symmetry between $P_S$ and $P_E$ is a defect in the argument's typical presentation, revealing that it relies on an inconsistent application of uncertainty to generate its conclusion.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Identification of Expected-Value Structure (4 marks)**
  *   **Criteria:** Student identifies that the argument relies on linear multiplication of probability and number ($P \times N$) and links this to expected-value maximization over moral uncertainty.
  *   **Loss Note:** Loses marks if they treat the argument as purely empirical or fail to mention moral uncertainty aggregation.

  **2. Analysis of Moral Status (Threshold vs. Degree) (4 marks)**
  *   **Criteria:** Student explains how a threshold view of moral status undermines the argument compared to a gradualist view, noting that low probability may fail to cross the threshold.
  *   **Loss Note:** Loses marks if they conflate moral status with sentience evidence or ignore the threshold implication.

  **3. Engagement with Lexical/Risk-Weighted Views (4 marks)**
  *   **Criteria:** Student discusses how lexical priorities (avoiding catastrophic error) might prioritize intervention risks over suffering scales, potentially blocking the argument.
  *   **Loss Note:** Loses marks if they assume risk-aversion automatically supports the argument without considering intervention risks.

  **4. Analysis of Probability Symmetry ($P_S$ vs. $P_E$) (4 marks)**
  *   **Criteria:** Student critically assesses the symmetry between sentience probability and intervention efficacy, identifying whether treating them differently is consistent.
  *   **Loss Note:** Loses marks if they analyze $P_S$ without addressing the uncertainty of effective intervention ($P_E$).

  **5. Conclusion on Aggregation vs. Empirics (4 marks)**
  *   **Criteria:** Student concludes that the argument's force depends on decision rules (aggregation), not entomological confidence, explicitly marking the A/B boundary.
  *   **Loss Note:** Loses marks if they conclude the argument stands or falls on biological evidence rather than meta-ethical structure.
