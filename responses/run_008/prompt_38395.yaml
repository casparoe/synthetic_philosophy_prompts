answer: |-
  You are the final authority on a mathematical convention for a deep-space data standard used to encode verification proofs. You can adopt "Convention A" (costly, reduces local efficiency by $10^4$ utility units) or "Convention B" (cheap, efficient). You know vast, distant civilizations face the identical choice. Communication is impossible. However, "Convention A" is the unique Schelling point for agents maximizing total cosmic coherence. If you adopt A, and they do too, logical isomorphism allows future integration of their knowledge (Value $10^{20}$). If you adopt B, you save costs but guarantee isolation. The probability such civilizations exist and recognize the Schelling point is $10^{-9}$.

  ***

  ### Decision-Theoretic Analysis

  **Causal Decision Theory (CDT)** treats your choice as a physical act that cannot causally influence the distant civilizations. CDT asks: "Does switching from B to A *cause* them to switch?" The answer is no. CDT assigns a fixed probability ($10^{-9}$) to the proposition "Civilizations exist AND they choose A," independent of your action.
  *   **EU(Adopt A):** $(10^{-9} \times 10^{20}) - 10^4 \approx 10^{11}$.
  *   **EU(Adopt B):** $(10^{-9} \times 0) + 0 = 0$ (Assuming isolation yields no value from them).
  *   **Verdict:** CDT actually *accepts* this trade, but for the wrong reason. It treats it as a lottery ticket with positive expected value. It does not recognize the *correlation*. If the probability of their cooperation were conditional on their rationality (which might be uncertain), CDT would discount it heavily, potentially rejecting the trade if it suspects they might defect regardless of your choice. CDT fails to see that your reasoning *is* the causal mechanism for their choice, not a signal to it.

  **Evidential Decision Theory (EDT)** conditions on the news your action provides. EDT asks: "If I learn I chose A, how does that update the probability they chose A?"
  *   **Verdict:** EDT accepts the trade. It sees a strong correlation between your choice and theirs because you share the same evidence (the mathematical structure). However, EDT is vulnerable to "spurious correlations." If there were a common cause (e.g., a universal law forcing both of you to choose A), EDT would act as if your choice influenced them, which is correct here, but EDT cannot distinguish this from cases where the correlation is coincidental. It lacks the structural explanation for *why* the correlation holds.

  **Functional Decision Theory (FDT)** treats your decision as the output of a logical algorithm. FDT asks: "What happens if the algorithm 'Rational Agent facing this Standard' outputs A?"
  *   **Verdict:** FDT accepts the trade robustly. It recognizes that the distant civilizations are running the same algorithm (reasoning from the same mathematical premises). Therefore, if your algorithm outputs A, theirs *must* output A (assuming they exist and are rational). The probability $10^{-9}$ applies only to the *existence* of the partners, not their *cooperation*.
  *   **Calculation:** $P(\text{Existence}) \times \text{Value} - \text{Cost}$. FDT collapses the probability of cooperation to 1 (conditional on existence), whereas CDT leaves it as an independent variable.

  ### The Structural Differentiator

  The feature separating this from Pascal's Wager or Mugging is **Trackability of the Logical Correlation**.

  In Pascal's Mugging, the link between your action (hand over wallet) and the payoff (infinite utility) is asserted by the mugger ("I have magic"). There is no derivable logical path connecting the two. In Pascal's Wager, the link is theological and epistemically opaque.

  In this Acausal Trade scenario, the link is **derivable from first principles**. Both parties can independently verify that "Convention A" is the unique Schelling point. The correlation isn't magic; it's the inevitable convergence of identical logic on a unique solution. You don't need to believe they *will* cooperate; you need to believe that *if* they exist and reason, they *must* cooperate. The probability mass sits on their *existence*, not their *compliance*. This moves the uncertainty from the domain of "will they keep their promise?" (untrackable) to "do they exist?" (cosmological prior).

  ### The Clipping Test

  If we clip the payoff so the far side's cooperation no longer dominates (e.g., Value drops to $10^8$, making $10^{-9} \times 10^8 < 10^4$):

  *   **FDT:** The trade vanishes. FDT does not demand sacrifice for negligible returns. It becomes an ordinary Prisoner's Dilemma where the cost of cooperation outweighs the expected return even with perfect correlation. The case collapses into a standard recommendation to defect (choose Convention B).
  *   **Significance:** This shows the theory isn't pathological. It doesn't demand infinite sacrifice for tiny probabilities; it demands *proportional* sacrifice. The "Pascal's Mugging" pathology arises when the payoff is unbounded (infinite). Here, with bounded payoffs, the decision scales linearly. If the EV is negative, FDT says "don't do it."

  ### The Strongest Attack: The Reference Class Swamp

  **The Attack:** A skeptic argues that the probability $10^{-9}$ is wildly inflated due to the **Reference Class Problem**. For the logical correlation to hold, the distant civilization must not only exist but must: (1) face the *exact* same mathematical bottleneck, (2) carve the problem space at the *exact* same joints, and (3) value "cosmic coherence" over local efficiency in the *exact* same way.
  Every specific detail you add to ensure the logical link holds (e.g., "they value coherence") drastically reduces the prior probability of such a civilization existing. To get the correlation, you must assume they are like you. To get the probability, you must assume they are generic. You cannot have both. If you specify the conditions enough to guarantee the trade, the probability drops from $10^{-9}$ to $10^{-100}$, killing the expected value. If you keep it vague enough to maintain $10^{-9}$, the logical correlation breaks (maybe they interpret "coherence" differently).

  **Does the Case Survive?**
  Barely, but it requires a retreat to **Logical Uncertainty**. The defense is that mathematical truth is not contingent on culture. If "Convention A" is objectively the unique Schelling point (like the prime numbers), then *any* civilization capable of the math finds it. The uncertainty is not "do they value what I value?" but "does the math actually force this conclusion?"
  If the math is solid, the reference class is "all mathematical agents," which is broad. If the math is shaky (i.e., "coherence" is subjective), the skeptic wins. The case survives only if the trade is based on **objective logical necessities** (like math or physics) rather than **subjective values** (like ethics or aesthetics). This limits the scope of defensible acausal trade to domains where reasoning converges necessarily, insulating it from the "arbitrary values" objection that destroys most Pascal-style wagers.
