answer: |-
  Dear Friend,

  I have been reflecting on the questions you raised regarding the philosophical underpinnings of conservation law, and I find the tension you identified between biological reality and legal fixity to be profoundly revealing. When we look at how the law operates, specifically regarding the instability of taxonomy and the exclusion of hybrids, it appears to presuppose a mixed ontology that is somewhat unstable in its own right. On the one hand, the way protection attaches to a list entry suggests that the law treats species primarily as bookkeeping units. When taxonomists split a widespread species into two, and one half instantly becomes critically endangered without any biological change on the ground, the law is responding to a change in description rather than a change in the world. This implies that the protected entity is not the biological population itself, but the legal classification assigned to it. I am fairly confident in this assessment because the mechanism of protection is bureaucratic; the trigger is the publication of a name in a register, not the observation of a biological threshold. However, this bookkeeping view clashes with the second feature you noted, which is the treatment of hybrids. The practice of culling hybrids to maintain the purity of a protected population suggests that the law is not merely managing arbitrary units but is trying to preserve something intrinsic. This behavior aligns much more closely with the view of species as natural kinds with essences that can be adulterated. If species were merely historical individuals, a hybrid would simply be a new branch of that individual lineage, not a contamination. If they were merely bookkeeping units, a hybrid could be categorized pragmatically. The fact that hybrids are often removed to protect the integrity of the listed entity implies a belief that there is a true, essential form of the species that the law is sworn to defend.

  So, to reconstruct the implicit ontology, I would argue that current conservation practice operates as if species are essential natural kinds, but it administers them as if they are conventional bookkeeping units. This creates a friction where the law seeks to freeze biological fluidity into static legal categories. You asked whether this practice strictly requires one of these views or is compatible with several. I believe the practice is compatible with several views but functions most coherently, albeit problematically, under this hybrid of essentialism and conventionalism. It does not strictly require species to be real natural kinds in a metaphysical sense, but it requires the administrators to act as if they are. The law needs the bookkeeping aspect to function administratively, because courts and agencies require definite boundaries to enforce penalties and allocate funding. Yet, it needs the essentialist aspect to justify the moral urgency of preservation, particularly when excluding hybrids. If the law admitted that species boundaries were entirely arbitrary, the moral imperative to cull hybrids would vanish. Therefore, while the law does not metaphysically require species to be natural kinds, it pragmatically requires the stakeholders to believe they are. I am reasonably confident that this pragmatic essentialism is what drives the culling policies, even if the statutory language is more ambiguous.

  If we were to shift to a legal regime built on the rival position—that species boundaries are conventional and that a hybrid is no less valuable than a purebred animal—the changes required would be far more radical than simply extending the list of protected entities. A regime based on the conventionality of species would have to abandon the entity-based model of conservation entirely. Currently, the law protects the noun, the species. A rival regime would need to protect the verb, the process of evolution, or the health of the ecosystem itself. This would mean shifting from the Endangered Species Act model, which focuses on preventing the extinction of specific listed taxa, to a model that focuses on maintaining evolutionary potential and ecological function. Under such a system, funding would not be tied to the status of a named population but to the integrity of a habitat that allows for speciation, hybridization, and adaptation. Penalties would not be assessed based on harming a specific listed individual but on degrading the capacity of an ecosystem to sustain biodiversity. This is a fundamental restructuring of conservation ethics, moving from a museum model of preservation to a garden model of management. I am highly confident that this structural shift is necessary because merely adding hybrids to the list would retain the underlying assumption that the list itself is the primary tool of conservation, which perpetuates the problem of arbitrary boundaries.

  As I lay out these arguments, I want to be transparent about where my certainty lies. I am most confident in the claim that the culling of hybrids presupposes an essentialist view of species, as there is no other logical justification for removing viable organisms from a population unless one believes their genetic makeup is fundamentally wrong. However, I am least sure about the point regarding legislative intent versus operational reality. It is difficult to determine whether the lawmakers who drafted these statutes genuinely presupposed an essentialist ontology or if they simply adopted the scientific consensus of their time without philosophical scrutiny, leaving the essentialist implications to emerge later through administrative practice. Distinguishing between a philosophical presupposition and a bureaucratic accident is notoriously difficult in legal history, and I worry I may be attributing more coherence to the system than its drafters intended. Despite this uncertainty, it seems clear that whatever the original intent, the current operation of the law relies on these ontological commitments to function. I hope this letter helps clarify the philosophical stakes involved in how we choose to protect the natural world.

  Warmly,

  A Correspondent
