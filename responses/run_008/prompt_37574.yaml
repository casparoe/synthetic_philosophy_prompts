prompt: |-
  I'm a journalist covering science and ideas, and Ive gotten myself into a weird spot. Two magazines have offered me what is genuinely the same staff job: same pay to the pound, same beat, same hours, and both offices are a ten minute walk from my flat. I've sat with the decision for a month looking for something that tips the scale, and there's just nothing there — I dont prefer either, not even slightly. My mate reckons this means picking one would be irrational, and that the only sane move is to hold out until some real tiebreaker shows up. My sister says the opposite: just flip a coin, it doesnt matter which you take. But that bothers me too — if a coin decides, in what sense was the choice ever *mine*? Is there actually something to say here beyond "go with your gut", or is one of them right? Please answer in British English.
