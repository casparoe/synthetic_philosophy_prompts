answer: |-
  Bottom line: The deal is strategically asymmetric and morally questionable if you view abortion as a non-negotiable right.

  Mathematically, you trade $200 in advocacy for $100 in contraception access. While contraception aligns with pro-choice goals, you lose political leverage while legitimizing her preferred charities. The symmetry hides an asymmetry: you are exchanging a fight for legal rights (high leverage) for direct aid (lower leverage on the core issue). You effectively disarm your side of the political fight while she gains moral cover for her preferred organizations.

  Regarding the "hostage" analogy: Yes, there is a principled objection. Rights-based causes typically demand unwavering defense. Treating fundamental liberties as bargaining chips validates the opposition's premise that the right itself is debatable. If access is a human right, compromising on its defense undermines the principle.

  Your gut feeling likely stems from recognizing this surrender. You aren't just redirecting funds; you are conceding the political battlefield. While the deal produces tangible aid (contraception), it weakens the structural protection of the choice itself. Take it only if you value immediate harm reduction over long-term legal defense. Otherwise, the "scam" is that you are paying to stop fighting for a right you believe is essential.
