answer: |-
  This is a fantastic pedagogical hook. The Hobbes-Wallis feud is genuinely the reality TV of the 17th century, and using his stubbornness to test his philosophical commitments is a great way to make the material stick.

  You have correctly identified the core tension in Hobbes's philosophy of math: **Is geometry a science of *consequences from definitions* (which sounds formalist) or a science of *real space and motion* (which sounds materialist/physicalist)?**

  For Hobbes, the answer is always the latter. He is not a formalist. He believes definitions are stipulations, *but* they must be stipulations of things we can *generate in our imagination* as bodies in motion. If you can't picture the motion, the term is "insignificant speech."

  Here is your answer key, broken down by development, with the internal tensions flagged, followed by the confidence ranking and the "angriest" verdict.

  ---

  ### 1. Non-Euclidean Geometry (19th Century)
  **The Scenario:** Mathematicians show that if you change the parallel postulate, you get consistent geometries where triangles don't add up to 180 degrees.

  *   **The "Chill Hobbes" Argument (Definitionalism):** Hobbes claims in *De Corpore* that reasoning is just "reckoning" (addition/subtraction) of names. If geometers stipulate new definitions for "line" and "parallel," and deduce consequences consistently, isn't that exactly what he wants? Math is the only science where we control the premises.
  *   **The "Angry Hobbes" Argument (Materialism/Kinematics):** For Hobbes, geometry is the study of *extension* (space). Space is real. A "line" is the trace of a moving body. If you claim a line curves in a way that contradicts our sensory experience of space without a physical force causing it, you are speaking nonsense. Non-Euclidean geometry posits spaces that cannot be *generated* by the motion of bodies as we understand them.
  *   **The Tension:** Can you define a "point" however you want, or must the definition match the nature of reality?
  *   **The Verdict:** **Rejection.** Hobbes would view Non-Euclidean geometry as a logical game, not "science." Science, for Hobbes, is knowledge of causes. The "cause" of geometric truth is the generation of the figure. If the figure cannot be generated in real space (or conceivable space), it is fiction. He would say, "You have defined words, but you have not conceived a body."
  *   **Discussion Prompt for Students:** *Is Hobbes's requirement that we must "picture" the motion a strength (grounds math in reality) or a weakness (limits mathematical imagination)?*

  ### 2. Cantor's Set Theory & Actual Infinities
  **The Scenario:** Cantor proves there are different sizes of infinity and treats infinite sets as completed objects (actual infinities).

  *   **The "Chill Hobbes" Argument:** There really isn't one. Maybe he'd admire the rigor of the deductions?
  *   **The "Angry Hobbes" Argument (Metaphysics):** This hits Hobbes's hard materialism. For Hobbes, "infinite" is not a thing; it is a confession of ignorance. To say "infinite number" is like saying "infinite pile of apples." You can always add one more. An *actualized* infinite set is a metaphysical impossibility because the universe is finite body. Furthermore, Cantor's objects (sets) are abstract. They aren't bodies. They don't move. They are the ultimate "universals," which Hobbes thinks are just names, not things.
  *   **The Tension:** Hobbes denies the actual infinite, but is that just 17th-century baggage, or does it follow from "All is Body"? It follows from "All is Body." You can't have an infinite body.
  *   **The Verdict:** **Absolute Rejection.** He would call transfinite numbers "insignificant speech." You cannot generate an infinite set by motion. You cannot count to it. It has no causal power. To Hobbes, Cantor is doing exactly what Wallis did: using symbols to pretend you understand something you cannot conceive.
  *   **Discussion Prompt for Students:** *Hobbes says "infinite" is a name for our inability to count. Cantor says "infinite" is a number we can calculate with. Who has the better claim on the word?*

  ### 3. The Arithmetization of Analysis (Weierstrass/Cauchy)
  **The Scenario:** Calculus is rebuilt on static epsilon-delta definitions, removing "fluxions," "infinitesimals," and the idea of continuous motion from the foundations. Number becomes primary; space becomes secondary (mapped to $\mathbb{R}$).

  *   **The "Chill Hobbes" Argument:** Hobbes hated Wallis's infinitesimals because they were mystical "nothings" that somehow had magnitude. The epsilon-delta purge removes the mystical infinitesimal! It demands rigor. Hobbes should love the hate of "mystical quantities."
  *   **The "Angry Hobbes" Argument (Kinematics):** Hobbes's calculus (such as it was) was kinematic. A curve is a path of motion. A tangent is the direction of *conatus* (endeavor) at a point. By staticizing the continuum into number sets, analysis severs math from physics. It makes Arithmetic the master of Geometry. For Hobbes, Geometry is the master because it deals with *res extensa* (extended stuff). Numbers are just counts of things. To make numbers the foundation of continuity is to put the cart before the horse.
  *   **The Tension:** Rigor vs. Intuition. Hobbes wants rigor, but he wants *physical* rigor (can I build this?), not *logical* rigor (can I prove this inequality?).
  *   **The Verdict:** **Mixed/Mostly Negative.** He would applaud the destruction of infinitesimals but despise the ontology. He would argue that $\epsilon$-$\delta$ definitions hide the motion rather than explaining it. It turns dynamic problems into static puzzles.
  *   **Discussion Prompt for Students:** *Hobbes thinks math is about "how things are made." Modern analysis is about "what properties things have." Is modern math describing the world, or just describing our descriptions of the world?*

  ### 4. Turing Machines / Computability
  **The Scenario:** A machine manipulates symbols according to fixed rules. Computation is physical (a machine) but the logic is syntactic (symbol manipulation).

  *   **The "Chill Hobbes" Argument (Materialism):** Finally! A "reasoning machine." Hobbes famously defined reasoning as "reckoning" (computation). A Turing machine is a body in motion (head moving, tape shifting) that performs logic. It validates his view that thinking is computational and material. No souls required.
  *   **The "Angry Hobbes" Argument (Semantics):** A Turing machine manipulates symbols *without understanding*. For Hobbes, names must refer to conceptions of bodies. If the machine shuffles symbols that don't refer to magnitudes, it is producing "insignificant speech" very quickly. Also, the "infinite tape" assumption triggers his infinity allergy again.
  *   **The Tension:** Is the *process* (motion of the machine) enough to make it valid math, or does the *output* need to refer to a magnitude?
  *   **The Verdict:** **Fascinated Ambivalence.** This is the hardest call. He would likely claim the Turing Machine is the ultimate proof of his materialism ("See! Matter can reason!"), but he would worry that computer science detaches logic from geometry. If the computer calculates numbers without measuring space, Hobbes might call it "accounting," not "philosophy."
  *   **Discussion Prompt for Students:** *Hobbes says reasoning is computation. If a computer reasons, does it have "conceptions" of bodies? If not, is it really doing math, according to Hobbes?*

  ---

  ### Confidence Ranking (For your back pocket)

  1.  **Most Confident: Cantor's Set Theory.**
      *   *Why:* This violates his core metaphysics (Materialism) and his core epistemology (Conceivability). There is no wiggle room here. An actual infinite set is an incorporeal substance, which is God-talk or nonsense to Hobbes.
  2.  **High Confidence: Non-Euclidean Geometry.**
      *   *Why:* While he likes definitional freedom, he is too committed to Geometry as the science of *real space*. He would view NEC as a parlor trick, not truth.
  3.  **Medium Confidence: Arithmetization of Analysis.**
      *   *Why:* He'd agree with the ban on infinitesimals (point for Weierstrass) but disagree with the demotion of Geometry (point for Hobbes). It's a split decision.
  4.  **Least Confident / Most Debatable: Turing Machines.**
      *   *Why:* This is the wildcard. It validates his "reasoning is reckoning" thesis perfectly, but the abstraction might offend his "math is measure of space" thesis. Students could argue this one both ways effectively.

  ---

  ### The Closer: What Would Make Him Angriest?

  **Winner: Cantor's Set Theory.**

  **Why?**
  You want to remind the students of the Wallis feud. Wallis made Hobbes angry because Wallis used algebraic symbols to claim knowledge of things he couldn't construct geometrically. He used "infinity" loosely.
  Cantor is **Wallis on steroids.**
  Cantor takes the very thing Hobbes said was impossible (actual infinity) and not only claims it exists but creates a whole arithmetic for it.
  *   **The Hobbesian Meltdown:** Hobbes would view Cantor as the Antichrist of Mathematics. It combines the sin of **Abstracta** (sets aren't bodies) with the sin of **Infinity** (which denies the finite nature of the universe) and the sin of **Insignificant Speech** (talking about sizes of things that cannot exist).

  **Fun way to frame it to the class:**
  "Hobbes spent his old age writing 600 pages of insults against John Wallis because Wallis used a symbol for infinity ($\infty$) that Hobbes thought was nonsense. If Hobbes saw Cantor proving that some infinities are *bigger* than others, he wouldn't just write a book. He would likely try to challenge Cantor to a duel... despite both of them being long dead. It validates his fear that when mathematicians stop drawing pictures and start writing definitions, they become priests of a new, nonsensical religion."

  ### One Final Tip for the Section
  Remind your students that Hobbes was **confidently wrong** about squaring the circle. He thought he had solved it using kinematic methods. He was rejected by the math community of his own time.
  *   **The Meta-Lesson:** Hobbes's philosophy of math is incredibly robust internally, but it led him to reject valid math (algebra, infinitesimals) and accept invalid math (his own circle-squaring).
  *   **Question to leave them with:** "Does Hobbes's failure to accept the math of his future (calculus/algebra) suggest his philosophy was wrong? Or does it suggest that being a good philosopher of math requires knowing the math better than the mathematicians do?"

  Good luck with the section. If you lean into the "Hobbes as the grumpy old materialist yelling at clouds of abstraction" angle, they'll love it.
