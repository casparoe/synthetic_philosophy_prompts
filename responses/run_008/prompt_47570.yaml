answer: |-
  You have good instincts. Marcus has served you a very polished version of a classic objection to the Doctrine of Double Effect (DDE), often associated with philosophers like Elizabeth Anscombe (ironically, a deontologist herself who wrestled with this) or Jonathan Bennett.

  The argument feels compelling because it targets the *epistemic* difficulty of knowing intentions. But Marcus makes a metaphysical error: he confuses **how we find out** what someone intended with **what intention is**.

  Here is the breakdown of where the argument fails, which premise to reject, and the costs involved.

  ### The Verdict: Reject Premise (4)

  Marcus's argument hinges on Premise (4): *"What's in your plan is just how you describe the action to yourself."*

  This is the slide you sensed. It equates **intention** with **narrative description**. Marcus is treating intention as a linguistic label you paste onto an action *after* the fact to make it palatable. But in philosophy of action, intention is not a description; it is a **functional state of mind** that structures the action itself.

  Here is how you pin him down on (4).

  #### 1. The "Success Condition" Test
  Intention determines what counts as *success* for the agent.
  *   **Terror Bomber (Intends deaths):** If the bomb destroys the factory but the civilians survive (perhaps they were in bunkers), the Terror Bomber has *failed* part of his mission. His plan required their deaths to demoralize the enemy.
  *   **Tactical Bomber (Foresees deaths):** If the bomb destroys the factory and the civilians survive, the Tactical Bomber has *succeeded* perfectly. In fact, he has succeeded *better* than expected.

  This is not a difference in description. It is a difference in the conditions under which the agent would feel satisfied. You cannot "describe" your way out of this. If Marcus says, "Well, the Tactical Bomber can just describe the survival as a failure," you ask: "Why would he? He got the military objective without the moral stain." The psychological state is objectively different.

  #### 2. The Counterfactual Test
  This is the strongest rebuttal to (4).
  *   Ask the agent: *"If you could achieve your goal without the civilians dying, would you?"*
  *   **Terror Bomber:** No. Their deaths are the mechanism.
  *   **Tactical Bomber:** Yes. Their deaths are a cost he wishes to avoid.

  This reveals that intention is about the **structure of the reasoning**, not the vocabulary. If the constraint is "Do not intend harm," it rules out agents who would say "No" to that counterfactual. That protects people because it rules out a specific kind of hostile will toward them.

  ### The Cost of Rejecting (4)

  If you tell Marcus, "Intention is a real psychological state, not just a description," he will hit you with the **Epistemic Objection**.

  **The Cost:** You must admit that it is often hard for *outsiders* (courts, moral judges, you and me at the bar) to know for sure what someone intended.
  *   **Marcus's Charge:** "So the constraint is unenforceable! A utilitarian can just lie and say he didn't intend the deaths."
  *   **Your Reply:** "The difficulty of adjudication does not negate the reality of the constraint."

  Just because speed limits are hard to enforce perfectly doesn't mean there's no difference between driving 50mph and 80mph. Similarly, the fact that a liar can game the system doesn't mean the moral distinction between *aiming at* death and *regretfully accepting* death is imaginary. Deontology governs the **will**, not just the observable outcome. A world where agents are morally forbidden from *willing* your death is safer than a world where they are only forbidden from *causing* it, even if we can't always read their minds perfectly.

  ### A Second Option: Reject Premise (2)

  You mentioned: *"I'd rather keep (1) than the permissibility of the bombing case."*

  This is a philosophically robust position. Marcus assumes standard Deontology *must* accept the bombing case (Premise 2). But you don't have to.
  *   **Moderate Deontology (DDE):** Killing 1 to save 5 is wrong; collateral damage in bombing is permissible. (Marcus attacks this).
  *   **Absolutist Deontology (Pacifist/Strict):** Killing 1 to save 5 is wrong; *and* bombing that kills civilians is also wrong because you are initiating a causal chain you know will kill them.

  **If you reject (2):**
  You tell Marcus: "You're attacking a straw man. I don't think the bombing case is permissible either. If I know the bomb will kill civilians, I cannot throw it. The distinction between means and side-effect matters for *degree* of wrongness, perhaps, but not for permissibility."

  **The Cost:** This makes your deontology much more demanding. It might forbid self-defense, police action, or any war that risks civilian life. It creates a "purity" problem where you might let five die because you can't save them without dirtying your hands. But it immunizes you against Marcus's "mental bookkeeping" charge, because you aren't using the distinction to *permit* killing, only to analyze it.

  ### Why (5) and (6) Fail if (4) Fails

  Marcus argues that if the distinction is real, it still doesn't protect anyone (5), and utilitarians can game it (6).

  *   **On (5):** Constraints *do* protect people. They protect them from being the *object* of your will. There is a profound moral difference between being someone's target and being someone's unfortunate neighbor. Deontology says you have a right not to be targeted. That is a form of protection, even if you still die from the shrapnel. It preserves your dignity as a person, not just your biological life.
  *   **On (6):** A utilitarian cannot just "describe" killings as side effects. To truly make them side effects, the utilitarian must *actually not need the deaths to achieve the good*. If the utilitarian *needs* the deaths to maximize utility (e.g., organ harvesting), they cannot genuinely intend the good without intending the deaths. The constraint blocks the *reasoning process*, not just the final report.

  ### Summary for Your Next Beer

  1.  **Don't give up (1).** That is the heart of deontology (persons as ends, not means).
  2.  **Attack (4).** Intention is not a description; it is a functional state defined by success conditions and counterfactuals. It is a fact about the agent's psychology, not their vocabulary.
  3.  **Acknowledge the Cost.** Admit that intentions are hard to prove from the outside, but insist that moral truth isn't determined by what's easy to prove in court.
  4.  **Optional:** If you really hate the bombing case, reject (2). Tell Marcus you are a stricter deontologist than he assumes.

  Marcus thinks he's found a loophole in the *rules*. You need to show him he's misunderstood the *game*. The game isn't about describing outcomes; it's about governing the will.
