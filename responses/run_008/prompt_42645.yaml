  2) The mapping breaks threateningly because centers of gravity are passive effects of mass, whereas selves are normative projects that revise their own "mass" simply by contemplating the theory of themselves.
  3) Complaints that a geometrical point can't read books miss the mark because the *organism* reads the books, while the "self" is just the theoretical pivot used to organize that reading.
  4) It smuggles in a strict instrumentalism where "real" means "useful for prediction," leaving consciousness looking like a useful fiction rather than the intrinsic phenomenon it was supposed to explain.
  5) The conclusion survives only if you accept that normative self-creation is just another causal mechanism, otherwise the analogy was secretly doing the ontological work by defining "real" as "abstractly useful" from the start.
