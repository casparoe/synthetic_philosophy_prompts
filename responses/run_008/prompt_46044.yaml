answer: |-
  # JOINT STATEMENT ON ANTHROPIC REASONING AND THE DOOMSDAY ARGUMENT

  **Date:** October 26, 2023
  **Parties:** The Proponents of the Carter–Leslie Inference (Camp 1) and The Proponents of the Self-Indication Assumption (Camp 2)
  **Subject:** Adversarial Collaboration on Observation Selection Effects

  ## 1. AGREED CLAIMS

  The following claims represent the consensus of the collaboration. Each claim has been vetted to ensure it is neither trivial nor acceptable to a naive outsider without understanding the technical context of the anthropic debate.

  1.  **Formal Validity vs. Premise Dispute:** Both camps agree that the Carter–Leslie Doomsday Argument is deductively valid within a Bayesian framework *conditional* on the acceptance of the Self-Sampling Assumption (SSA) over a specific reference class. The dispute is not regarding the calculus of the update, but regarding the justification of the prior sampling assumption and the definition of the reference class.
  2.  **Distinction from Gott's Formulation:** Both camps agree that J. Richard Gott's duration-based "Copernican Principle" formulation is methodologically distinct from and strictly weaker than the Carter–Leslie birth-rank formulation. Gott's version relies on temporal duration as a proxy for observer count without explicit modeling of the observer density, making it more susceptible to reference class ambiguities than the Bayesian treatment utilized by both Camp 1 and Camp 2.
  3.  **Non-Specialness of Humanity:** Both camps agree that the logic of the argument does not depend on humanity occupying a privileged position in the universe. The same anthropic reasoning applies to any reference class (e.g., extraterrestrial civilizations, AI successors, or conscious moments), and the structural tension between SSA and SIA arises regardless of the specific substrate of the observers.
  4.  **Policy Orthogonality:** Both camps agree that the practical implications for existential risk policy are smaller than popularized accounts suggest. Whether the probability of early extinction is elevated (Camp 1) or baseline (Camp 2), the expected value of mitigation efforts remains high enough that rational actors should pursue similar risk-reduction strategies regardless of the anthropic update.
  5.  **The "Presumptuous Philosopher" as the Primary Objection:** Both camps agree that the strongest objection to Camp 2's position is not the Doomsday conclusion itself, but the "Presumptuous Philosopher" problem (the implication that one can favor cosmological theories solely based on the number of observers they contain). Camp 1 views this as a *reductio ad absurdum* of SIA; Camp 2 views it as a counterintuitive but necessary consequence of correct anthropic reasoning.
  6.  **Reference Class Sensitivity:** Both camps agree that the magnitude of any anthropic update is highly sensitive to the definition of the "reference class" of observers. Narrowing the class (e.g., to "observers with exactly our current information") weakens the Doomsday shift; broadening it (e.g., to "all conscious beings") strengthens it. There is no consensus on the objective criterion for drawing this boundary.

  ## 2. DISAGREEMENTS TABLE

  The following table outlines the residual disagreements. Formulations in each column are endorsed by the respective camp as accurate statements of their position.

  | Issue | Camp 1 (Carter–Leslie / SSA) | Camp 2 (SIA) |
  | :--- | :--- | :--- |
  | **The Nature of the Evidence** | Finding oneself at an early birth rank ($n$) is evidence that the total number of observers ($N$) is small, because $n$ is unlikely to be small if $N$ is very large. | Finding oneself existing at all is evidence that the total number of observers ($N$) is large, because one is more likely to exist in a world with more observers. |
  | **Net Bayesian Update** | The birth-rank evidence dominates. The posterior probability of a "short future" is significantly higher than the prior. | The existence evidence cancels the birth-rank evidence exactly. The posterior probability of a "short future" equals the prior. |
  | **Reference Class Definition** | The reference class must be constrained by epistemic symmetry (observers who share our specific information state). Unconstrained classes lead to absurdities. | The reference class should be as broad as possible (all observers). Constraints on the reference class are ad hoc maneuvers to avoid the Doomsday conclusion. |
  | **Source of the Paradox** | The paradox arises if one rejects SSA, leading to underestimation of extinction risk. SIA solves Doomsday only by creating the Presumptuous Philosopher problem. | The paradox arises if one accepts SSA, leading to the false conclusion that we can predict the future from our birth rank. SIA resolves the paradox by correcting the sampling bias. |
  | **Terminological Dispute** | The term "evidence" in Camp 2's usage conflates *likelihood* with *prior probability*. Existence is a condition for reasoning, not data to update upon. | The term "evidence" in Camp 1's usage ignores *indexical information*. Being "me" is data that distinguishes possible worlds with different observer counts. |

  ## 3. CRUCES AND PREDICTIVE CASES

  The following cases were selected to isolate the specific mechanistic differences between the camps. Each camp records its prediction and the reasoning bearing on the crux.

  ### Case (a): The "Mild Presumptuous Philosopher"
  **Scenario:** Two cosmological theories, $T_1$ and $T_2$, are empirically indistinguishable by all non-anthropic data. $T_1$ posits a universe containing 2 trillion observers. $T_2$ posits a universe containing 3 trillion observers. The prior odds are 1:1.
  **Crux:** Does the sheer number of observers constitute evidence favoring $T_2$?

  *   **Camp 1 Prediction:** **No Update.** The odds should remain 1:1. The number of observers is not a physical parameter that affects the likelihood of our specific observations (other than existence, which is already conditioned on). To update based on a factor of 1.5 is to accept the principle that leads to the absurdity of favoring infinite-observer universes with certainty.
  *   **Camp 2 Prediction:** **Update to 3:2.** The odds should shift to 1.5:1 in favor of $T_2$. The principle of SIA is binary: you either accept that existence is evidence for more observers or you do not. Rejecting the update here because the factor is "small" while accepting it for larger factors is inconsistent. We accept the counterintuitive result as the cost of avoiding the Doomsday fallacy.

  ### Case (b): The Sealed Generation Ship
  **Scenario:** A generation ship launched 200 years ago has a fixed maximum capacity ($N_{max}$) determined by engineering constraints unknown to the current crew. The ship cannot be altered. A crew member knows their birth rank ($n$) among the ship's total eventual population but does not know $N_{max}$.
  **Crux:** Does the fixed physical nature of $N$ change the epistemic weight of the birth rank?

  *   **Camp 1 Prediction:** **Update Applies.** The crew member should update toward a lower $N_{max}$. The fact that $N$ is fixed by physics is irrelevant to the crew member's epistemic state. From their perspective, they are a random sample from the set of all ship inhabitants. If $N_{max}$ were very high, it would be unlikely for them to be among the first 10%.
  *   **Camp 2 Prediction:** **No Update.** The crew member should not update. The probability of the ship being built with a large $N_{max}$ vs. a small $N_{max}$ already incorporates the likelihood of the crew member's existence. The "fixed" nature of the ship highlights that the Doomsday logic conflates *causal influence* over $N$ with *information* about $N$. Since the crew member's existence is guaranteed in both scenarios (conditional on the ship launching), birth rank provides no new information about the total capacity.

  ### Case (c): The Relocation Question
  **Scenario:** Assessing the trade-offs of accepting SIA. If SIA is true, it defuses Doomsday but alters probabilities in other domains (e.g., simulation hypotheses, multiverse sizes).
  **Crux:** Is the "weirdness" of anthropics eliminated or merely relocated?

  *   **Camp 1 Prediction:** **Weirdness is Relocated and Amplified.** Accepting SIA purchases safety from Doomsday at the price of accepting that we can know about the external universe from our existence alone. Specifically, SIA implies we are almost certainly living in a simulation if simulators create many simulations. This "Simulation Hypothesis" update is more epistemologically damaging than the Doomsday update.
  *   **Camp 2 Prediction:** **Weirdness is Relocated but Contained.** We accept that SIA increases the probability of the Simulation Hypothesis (or large multiverses). However, this is a feature, not a bug. It correctly reflects that we are more likely to find ourselves in high-observer-count scenarios. This is preferable to the Doomsday conclusion, which implies we can predict the end of humanity based solely on our birth order. We prefer the "Presumptuous" implication to the "Doomsday" implication.

  ## 4. CLOSING ASSESSMENT

  **Verbal vs. Genuine Disagreement:**
  The collaboration identifies a significant verbal component to the dispute regarding the definition of "evidence." Camp 1 treats "I exist" as a precondition for reasoning (a tautology), while Camp 2 treats "I exist" as indexical data distinguishing possible worlds. However, a genuine disagreement remains regarding the **prior probability distribution over indexical facts**. Camp 1 assigns uniform priors over observer-moments within a world; Camp 2 assigns priors weighted by the number of observer-moments in that world. This is not merely semantic; it yields divergent posterior probabilities in Cases (a) and (b).

  **Undecidable Elements:**
  Currently, there is no empirical test available to adjudicate between SSA and SIA, as both frameworks are designed to be consistent with all existing non-anthropic data. The choice between them rests on meta-philosophical intuitions regarding parsimony, the nature of indexical information, and the acceptability of "Presumptuous" conclusions.

  **Conditions for Resolution:**
  Both camps agree that the debate would be materially advanced by a consensus on **Decision Theory**. If a unified decision theory (such as Updateless Decision Theory or a specific variant of Functional Decision Theory) could be shown to mandate one anthropic assumption over the other for the purpose of maximizing expected utility in anthropic scenarios, the epistemic dispute would be rendered obsolete. Until such a decision-theoretic derivation is produced and widely accepted, the collaboration concludes that both positions remain rationally permissible, provided the adherents acknowledge the trade-offs detailed in Section 3.

  **Signed,**

  *Representatives of Camp 1 (Carter–Leslie/SSA)*
  *Representatives of Camp 2 (SIA)*
