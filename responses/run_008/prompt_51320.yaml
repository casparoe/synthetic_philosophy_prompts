      *   *Imageless Thought Controversy:* Early 20th century. Structuralism (Titchener) vs. Würzburg (Külpe/Marbe/Watt). Titchener said all thought is images/sensations. Würzburg said some thought is non-sensory. Deadlock because introspection is private and theory-laden. Led to Behaviorism (Watson) rejecting inner states entirely.
      *   *Connection:* Dennett explicitly discusses the failure of introspection and the rise of behaviorism. He sees heterophenomenology as the middle path between "Cartesian Materialism" (inner theater is real) and "Behaviorism" (inner states don't matter/aren't real).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's grasp of the history. It's accurate. Set the stage: Heterophenomenology (HP) as the "third way" between dogmatic introspection and eliminative behaviorism.

      *   **Part 1: HP on the Episode (What were they doing?):**
