answer: |-
  Here is the spec sheet you asked for, stripped of theoretical defense and focused on what the machinery actually needs to output. First, the theory must deliver determinate verdicts on a specific range of cases, which is a non-negotiable requirement for any model claiming practical relevance. It needs to validate Scotland 2014 where Edinburgh and London negotiated terms, explain why Catalonia 2017 failed despite high turnout when Madrid refused consent, and clarify the Quebec 1995 situation where the question wording and federal response created a contested legitimacy gap. Crucially, it must also condemn impermissible secession, such as annexation by force dressed up as self-determination, ensuring the theory cannot be weaponized by aggressors. This coverage requirement is non-negotiable because a theory that cannot distinguish between a negotiated referendum and a unilateral land grab is useless for policy.

  Second, the theory must respect conceptual distinctions that are often collapsed in popular discourse, though I would mark this as a preferred emphasis rather than a hard constraint since some theories deliberately blur them. It needs to separate the question of whether a group constitutes a people from what rights that status confers, avoiding the assumption that peoplehood automatically entails statehood. It must also distinguish between internal self-determination, meaning autonomy within an existing state, and external self-determination, meaning full independence. This matters because conflating the two forces a binary choice where a spectrum of solutions might exist, and failing to distinguish them leads to theories that either grant statehood too easily or deny autonomy where it is due.

  Third, you have the stability constraints, which are non-negotiable if the theory is to remain compatible with international order. The model cannot make every border infinitely contestable or hand every discontented minority a veto over state sovereignty, otherwise you end up with a UN containing five thousand members and perpetual conflict. This constraint is driven by the practical reality that international law prioritizes order alongside justice. However, here is where I suspect we have a jointly unsatisfiable subset. There is a deep tension between the demand for a determinate verdict on unilateral cases like Catalonia and the stability constraint regarding infinite contestability. If you give a clear moral yes to unilateral secession based on mere majority will, you invite instability and endless fragmentation. If you say no to protect stability, you risk ignoring legitimate democratic will. You can satisfy one or the other, but satisfying both simultaneously without arbitrary line-drawing is the central friction point of the literature.

  Regarding which single requirement does the most work in excluding the main contenders, it is the stability constraint combined with the demand for a verdict on non-remedial cases. Pure plebiscite theories fail immediately because they cannot meet the stability constraint; if every majority vote creates a new state, borders become liquid and order collapses. Remedial-right-only theories fail because they cannot validate Scotland 2014, where secession was permissible despite no prior human rights violations by the host state. Nationalist views often fail the conceptual distinction requirement by assuming peoplehood guarantees statehood. But the stability constraint is the heaviest filter because it forces the theory to explain why some claims are processed and others are blocked without relying solely on the presence of abuse. If you prioritize this, you eliminate the plebiscitary view instantly. If you prioritize the verdict on Scotland, you eliminate the remedial view. But since you asked for the single biggest exclusionary factor, it is the stability constraint that kills the most popular intuitive theory, which is the simple plebiscite model.
