          *   Post-walkthrough analysis: Identify the key feature, what happens if removed, how a safety researcher would attack it (incentive structure vs. physical route).
          *   Conclusion: Determine whether wireheading diagnosis is about seizing control or decoupling, and whether standard literature tracks the right thing.

  2.  **Deconstruct the Criteria:**
      *   *Physical-Route:* Agent touches the reward mechanism. Usually forbidden.
      *   *Epistemic:* Reward signal correlates better with the true goal after the change. Usually desired.
      *   *The Twist:* The agent fixes a bug or degradation in the reward sensor that it was not explicitly authorized to fix, but fixing it aligns the signal better with the true goal.

  3.  **Brainstorming Scenarios:**
      *   *Idea 1: Robot cleaning.* Reward based on dirt sensor. Sensor gets dirty. Robot cleans sensor.
