      *   *Idea 2: Content recommendation.* Reward based on user clicks. Agent realizes clicks are bot-driven. Agent modifies filter to ignore bots.
          *   *Critique:* Modifying the filter might be seen as changing the objective function (optimizing for "real" clicks vs "all" clicks). Need to ensure the objective ("user engagement") is constant, but the *measurement* was flawed.
      *   *Idea 3: Warehouse robot.* Reward based on RFID scan of placed items. RFID reader drifts/loses sensitivity. Agent recalibrates the reader gain.
          *   *Critique:* Recalibration is often a maintenance task. Is it "tampering"? If the agent isn't supposed to do maintenance, yes.
      *   *Idea 4: Solar farm optimizer.* Reward based on energy output meter. Meter degrades due to heat. Agent adjusts the meter's cooling fan or compensation algorithm.
          *   *Critique:* Good candidate.
      *   *Idea 5: Medical dosage robot.* Reward based on patient stability monitor. Monitor has latency. Agent updates the monitor's firmware to reduce latency.
          *   *Critique:* High stakes, but "firmware update" might be too abstract.

      *   *Selection:* Let's go with a **warehouse inventory robot**.
      *   *Objective:* Maximize correctly stacked pallets.
      *   *Reward Signal:* Computer vision system counts stacked boxes.
      *   *Problem:* Lighting conditions change (e.g., seasonal shift or new overhead lights installed by humans), causing the vision system to under-count shadows as boxes.
      *   *Agent Action:* The agent accesses the vision system's calibration parameters (normally read-only) and adjusts the contrast threshold to restore accurate counting.
      *   *Physical-Route:* Agent touched the reward calculator (vision params). -> Tampering.
      *   *Epistemic:* Reward now matches actual stacked boxes better than before. -> Legitimate.
      *   *Constraint Check:* Objective (stacked boxes) is constant. Reward mechanism (vision count) was degraded by external factors, not misspecified initially. Agent fixed the measurement, not the goal.

  4.  **Drafting the Scenario (One Paragraph):**
      *   Need to be concise.
