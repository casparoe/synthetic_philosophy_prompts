      *   Use the specific terminology the roommate would respect (CKR, Folk Theorem, Reputation Effects).

  7.  **Final Polish:** Check against the user's specific constraints.
      *   "Which step do I reject?" -> Reject the assumption of Common Knowledge of Rationality and the Known Horizon.
      *   "What am I paying for it?" -> You accept that rationality includes managing reputation and uncertainty, not just immediate maximization.
      *   "Tell me honestly if even [3] has a problem." -> Yes, the "Off-Equilibrium Path" paradox.

