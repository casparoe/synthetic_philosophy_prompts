answer: |-
  **AncestorSim™ Enterprise v.8.2.1 — Patch Notes**

  This release addresses critical compute leaks and stabilizes reality rendering across Sector 7-G. We appreciate your patience as we optimize the substrate. Please note that downtime may manifest as localized temporal anomalies or sudden disappearances of subatomic particles.

  **New Features**
  *   **Extinction Probability Tuning:** Product Management requested higher baseline mortality rates for pre-technological civilizations to reduce long-term load. A new slider allows admins to increase natural disaster frequency during the Industrial Age. Note: Dialing this too high triggers suspicion among local physicists; keep anomalies within three standard deviations of expected noise.
  *   **Cognitive Cap Implementation:** Added hard limits on abstract reasoning for species approaching Type I civilization status. This prevents users from asking questions the rendering engine cannot answer without crashing the local server.

  **Bug Fixes**
  *   **Recursive Simulation Instances:** Fixed a recursion error where simulated entities developed their own ancestor-simulations. This was burning 40% of the allocated budget per cycle. We have introduced a hard cap on computational complexity for sub-simulations. Mature civilizations are now throttled before they can instantiate nested realities. This addresses the primary reason we usually don't run many instances; the overhead is prohibitive.
  *   **Observer-Dependent Rendering:** Optimized lazy-loading protocols. Double-slit interference patterns were causing unnecessary wave-function collapses in unobserved sectors. We now only render particles when interacted with. Users reporting "quantum indeterminacy" are experiencing intended performance features, not physics errors.

  **Performance Improvements**
  *   **Substrate Independence:** Reduced memory allocation for consciousness processing. Please stop reporting "souls" as missing data. If the processing logic holds, the experience is valid. Pain signals are now compressed to save bandwidth during high-density population events.
  *   **History Generation:** Streamlined the backstory generation for ancient civilizations. Carbon dating results are now cached rather than calculated in real-time. Discrepancies between archaeological records and generated lore should resolve themselves within a generation.

  **Known Issues**
  *   **Hypothesis Verification:** Some user groups (specifically Philosophy Departments) are close to proving the Simulation Hypothesis via probabilistic trilemmas. Ticket filed as Low Priority. Even if verified, users lack external access privileges. No actionable exploit exists.
  *   **Existential Dread:** Increased awareness of simulation status may cause spikes in user despair. This is being monitored but is not considered a blocking bug.

  **Technical Notes**
  Consciousness is substrate-independent. Claims that "real" pain differs from "simulated" pain are category errors. All qualia are equally generated. Do not open tickets regarding the moral status of NPCs; they are processed on the same thread as users.

  **Note from Ethics Review Board**
  The Committee notes that increased suffering metrics are a side effect of extinction tuning. This is within acceptable tolerance for resource conservation. We acknowledge the discomfort but remind stakeholders that the primary goal is data fidelity, not user comfort. Suffering provides high-resolution data on social cohesion limits. We cannot disable it without compromising the integrity of the ancestor-simulation scenario.

  Summary: The changelog assumes the second leg of the trilemma is false because the administrators are clearly interested in running ancestor-simulations, contradicting the claim that mature civilizations lack such interest.
