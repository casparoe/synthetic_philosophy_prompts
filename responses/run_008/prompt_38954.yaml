  # Jurisprudential Validity Decision Tree

  **Instructions:** Answer each question based on the concrete case described. Follow the branch to your position.

  **Q1. The Nazi Statute (Substance)**  
  A statute is duly enacted, published, and prospective, but commands grave injustice (e.g., the Grudge Informer). Is it **valid law**?
  *   **NO** → **Strong Natural Law** (Radbruch Formula: Unjust law is not law).
      *   *Follow-up:* **Q2. The Failing Monarch (Procedure)**  
          A ruler issues benign commands that are secret, retroactive, and contradictory. Is it **valid law**?
          *   **NO** → **UNNAMED 1** (Strong Substantive & Procedural Natural Law). *Simply unexplored; redundant given the substantive veto.*
          *   **YES** → **UNNAMED 2** (Substantive Natural Law / Procedural Positivism). *Unattractive; inconsistent valuation of morality's role.*
  *   **YES** → **Q2. The Failing Monarch (Procedure)**  
      A ruler issues benign commands that are secret, retroactive, and contradictory. Is it **valid law**?
      *   **NO** → **Fuller** (Internal Morality: Procedural failure defeats legality).
      *   **YES** → **Q3. The Moral Constitution (Incorporation)**  
          Can a legal system's ultimate rule *choose* to make morality a condition of validity (e.g., "No law valid if unjust")?
          *   **NO** → **Q4. The Conceptual Claim (Necessity)**  
              Is that moral connection **necessary** for all legal systems?
              *   **YES** → **UNNAMED 3** (Exclusive Positivism + Necessary Morality). *Incoherent; contradicts the definition of exclusive positivism.*
              *   **NO** → **Exclusive Positivism** (Raz: Moral criteria are conceptually excluded from validity).
          *   **YES** → **Q4. The Conceptual Claim (Necessity)**  
              Is that moral connection **necessary** for all legal systems, or merely **contingent**?
              *   **NECESSARY** → **Soft Natural Law** (Finnis: Law is defective without moral aim, though valid).
              *   **CONTINGENT** → **Inclusive Positivism** (Hart: Moral criteria are valid only if the Rule of Recognition says so).

  ***

  **Limitations & Overlaps**  
  This tree separates positions based on case outcomes. However, **Fuller** and **Inclusive Positivism** may converge on outcomes if one interprets Hart's critique of the Failing Monarch as denying a legal *system* rather than valid *laws*. In that scenario, case answers alone cannot separate them; you must ask the metaphysical question at **Q4**: Is the procedural/moral constraint a *conceptual necessity* for legality (Fuller/Soft Nat Law) or a *contingent rule* of the system (Inclusive Positivism)?

  Summary: The deepest fork distinguishes whether moral criteria are conceptually necessary or merely contingent, separating natural law theories from inclusive positivism.
