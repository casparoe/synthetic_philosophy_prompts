answer: |-
  **Dissertation Prospectus**

  **Title:** Stale Evidence: The Problem of Old Evidence as a Limiting Case of Uncertain Confirmation

  **1. The Research Question**

  The Problem of Old Evidence (POE) arises in Bayesian Confirmation Theory (BCT) when an agent assigns probability 1 to a piece of evidence $E$. Under standard conditionalization, if $P(E) = 1$, then $P(H|E) = P(H)$; the evidence cannot confirm the hypothesis. Yet, historically, old evidence (e.g., the perihelion of Mercury for General Relativity) clearly does confirm new theories.

  Standard responses to the POE generally accept the binary idealization of evidence: either $E$ is unknown ($P(E) < 1$) or it is known ($P(E) = 1$). Solutions involve reconstructing counterfactual priors where $P(E) < 1$, or shifting the object of learning from $E$ to the logical relation $H \vdash E$.

  This dissertation challenges the binary idealization itself. In actual scientific practice, evidence is rarely assigned probability 1. It is "stale": established, highly trusted, but acknowledged to have error bars, calibration uncertainties, or a credence of $0.95$ rather than $1$.

  **Primary Research Question:** Is the Problem of Old Evidence a structural paradox intrinsic to confirmation, or is it an artifact of the idealization $P(E) = 1$? Specifically, if we model confirmation using "stale evidence" (where $P(E)$ is high but strictly less than 1) via Jeffrey Conditionalization or uncertain likelihoods, does the confirmation function behave continuously as $P(E) \to 1$, or does a structural discontinuity remain?

  **Secondary Question:** If the general treatment of near-certain evidence dissolves the POE, does this necessitate a broader revision of how BCT models the epistemic status of observational data?

  **2. Why Existing Positions Leave This Open**

  The existing literature treats the POE as a crisis of *logical* learning or *historical* reconstruction, rather than a crisis of *probabilistic* idealization.

  *   **The Counterfactual Strategy (e.g., Garber, Glymour):** These approaches attempt to reconstruct a state of ignorance regarding $E$. They accept that for the *actual* agent, $P(E)=1$, and thus confirmation is impossible without fictionalizing the agent's epistemic state. This leaves open the question of why the actual agent (with $P(E)=1$) feels confirmed. It treats the $P(E)=1$ state as a hard wall rather than a limit.
  *   **The Logical Learning Strategy:** By claiming we learn "$H$ entails $E$" rather than $E$, these accounts bypass the $P(E)=1$ constraint. However, they rely on agents who are not logically omniscient. They do not address the status of $E$ itself. If $E$ is stale (highly probable but uncertain), the logical relation is less critical than the probabilistic weight of $E$.
  *   **Jeffrey Conditionalization:** Some authors (e.g., Jeffrey, Christensen) have noted that relaxing $P(E)=1$ allows confirmation to proceed. However, this is typically treated as a technical fix for specific cases of uncertain observation, not as a dissolution of the POE. The literature has not rigorously tested whether the POE persists as a limiting case. If confirmation drops off precipitously as $P(E)$ approaches 1 (even if not equal), the problem remains practically relevant. If confirmation remains robust as $P(E) \to 1$, the POE is merely an artifact of the equality sign.

  Current debates stall because they argue over how to handle the $P(E)=1$ constraint rather than asking if the constraint is ever genuinely instantiated in the science we aim to model.

  **3. Chapter-by-Chapter Plan**

  **Chapter 1: Introduction**
  *   Statement of the POE and its significance for Bayesian epistemology.
  *   Introduction of the "Stale Evidence" framework: distinguishing between *certain* evidence ($P=1$), *stale* evidence ($P \approx 1$, e.g., $0.99$), and *novel* evidence ($P \ll 1$).
  *   Overview of the argument: The POE is a discontinuity error caused by modeling stale evidence as certain evidence.

  **Chapter 2: The Binary Trap in Confirmation Theory**
  *   Detailed analysis of the standard solutions (Counterfactual Priors, Logical Learning, Explanationism).
  *   Critique: Demonstrate how each solution implicitly accepts the binary distinction between "background" and "new" evidence.
  *   Argument: Show that these solutions fail to account for the *degree* of reliance scientists place on old data (e.g., trusting a dataset while acknowledging systematic error).

  **Chapter 3: Formalizing Stale Evidence**
  *   Technical development of the "Stale Evidence" model.
  *   Comparison of Standard Conditionalization vs. Jeffrey Conditionalization in the limit.
  *   Derivation of the "Confirmation Function" $C(H, E)$ as $P(E)$ varies from $0.5$ to $0.999...$
  *   Investigation of the limit: Does $\lim_{P(E) \to 1} C(H, E) = 0$? If so, the POE is robust. If not, the POE is an artifact of setting $P(E)=1$ exactly.

  **Chapter 4: Case Studies in Stale Confirmation**
  *   **Historical Case:** The perihelion of Mercury. Re-analysis not as $P(E)=1$, but as a measurement with known error margins available to Einstein.
  *   **Contemporary Case:** Precision measurements in particle physics or cosmology (e.g., the Hubble constant tension). These rely on "old" calibration data treated as highly probable but revisable.
  *   Goal: Show that scientists treat old evidence as stale, not certain, and that confirmation tracks the staleness, not the certainty.

  **Chapter 5: Structural Implications for Bayesian Epistemology**
  *   If the POE dissolves under the Stale Evidence model, what else changes?
  *   Impact on the problem of Idealization in formal epistemology.
  *   Impact on related paradoxes (e.g., the Irrelevant Conjunction paradox, the Tacking paradox) which often rely on $P(E)=1$ assumptions.
  *   Defense against the objection that $P(E)=1$ is a necessary normative idealization for "knowledge."

  **Chapter 6: Conclusion**
  *   Summary of findings.
  *   Verdict on the POE: It is a pseudo-problem generated by mathematical convenience rather than epistemic reality.
  *   Proposal for a "Continuous Confirmation Theory" that rejects binary evidence states.

  **4. Conditions for Success and Failure**

  **Success:**
  1.  **Formal:** You demonstrate mathematically that the confirmation boost provided by $E$ to $H$ does not vanish as $P(E) \to 1$, provided $P(E)$ remains strictly less than 1.
  2.  **Philosophical:** You successfully argue that assigning $P(E)=1$ is never epistemically justified in empirical science, making the "Old Evidence" scenario a straw man.
  3.  **Explanatory:** The Stale Evidence model explains scientific reasoning in your case studies better than the Counterfactual or Logical Learning models (e.g., it explains why scientists worry about error bars in old data when testing new theories).

  **Failure:**
  1.  **Formal:** You find that the confirmation boost *does* asymptotically approach zero as $P(E) \to 1$, meaning the "Stale" model yields the same result as the "Certain" model for all practical purposes.
  2.  **Philosophical:** You cannot defend the claim that scientists *should* avoid $P(E)=1$. If $P(E)=1$ is a valid normative ideal for "established fact," the POE returns.
  3.  **Scope:** The project collapses into a simple application of Jeffrey Conditionalization without generating new philosophical insight into the nature of confirmation.

  **5. Verdict on Scope: Dissertation or Paper?**

  **Honest Verdict:** As currently conceived, this is a **strong journal paper**, but it risks being too thin for a dissertation unless significantly expanded.

  **The Risk:** The core argument—"The POE disappears if you don't set $P(E)=1$"—is a known point in the literature (often associated with Jeffrey and Christensen). If your dissertation is simply "Apply Jeffrey Conditionalization to the POE and argue it's better," a committee may argue this is a single argument, not a book-length project.

  **How to Make it Dissertation-Sized:**
  To justify a dissertation, you must move beyond *solving* the POE to *rebuilding* the framework around it.
  1.  **Expand Chapter 3:** Do not just apply existing Jeffrey Conditionalization. Develop a novel formal account of "Stale Evidence" that handles error propagation in confirmation. How does the uncertainty in $E$ propagate to the posterior of $H$ over time?
  2.  **Expand Chapter 5:** Connect the "Stale Evidence" insight to other areas. Does this solve the problem of *new* theories predicting old evidence? Does it impact the debate between Bayesianism and Likelihoodism? Does it offer a new account of "empirical adequacy"?
  3.  **Deepen the Case Studies:** Chapter 4 needs to be rigorous. Don't just describe the history; model the probabilistic assignments of the historical agents as best as possible to show they were treating evidence as stale.

  **Recommendation:**
  Proceed with the dissertation *only if* you are prepared to treat the POE as the entry point for a broader critique of binary idealizations in formal epistemology. If your goal is strictly to solve the POE, write the paper. If your goal is to propose a "Continuous Confirmation Theory" that reforms how Bayesians model data generally, this is a dissertation.

  **Next Steps:**
  1.  Formalize the limit argument in Chapter 3 immediately. If the math doesn't hold, the project collapses.
  2.  Select a second major paradox (e.g., the Problem of Priors or the Raven Paradox) to see if the "Stale Evidence" approach illuminates it. If it does, you have a dissertation. If not, you have a paper.
