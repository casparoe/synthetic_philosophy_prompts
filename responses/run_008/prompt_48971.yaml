prompt: |-
  I'm on the constitutional review committee for my university's student government, and we've got a genuinely awkward situation to sort out. Our student constitution gives a "judicial council" of five students the power to strike down legislation and referenda — they're appointed by the student body president and basically serve until they graduate. Last semester the student body voted 69-31 in a referendum to add a transit pass to the activity fee, and the council nullified it, saying fee increases have to originate in the student senate and that the referendum procedure wasn't followed (the election commission forgot to publish the ballot language 14 days ahead, as our rules require, which is true). Now half of our committee wants to amend the constitution to strip the council's strike-down power entirely and make their rulings only advisory, and the other half points out that two years ago the same council blocked a referendum that would have defunded several identity-based student orgs — which was sort of the council doing exactly what it exists for. Please draft the short memo I'll circulate before our next meeting recommending a concrete change (or no change), and make sure it grapples with the strongest point on the losing side, not just the side you pick. Also, we only have like two weeks before this goes on the ballot for the general student vote, so whatever you recommend needs to be something a student body would actually vote yes on.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Constitutional Review Committee (CRC).
      *   **Task:** Draft a short memo to circulate before the next meeting.
      *   **Goal:** Recommend a concrete change (or no change) to the student constitution regarding the Judicial Council's power.
      *   **Context:**
          *   Judicial Council (5 students, appointed by Pres, serve until graduation) can strike down legislation/referenda.
          *   Recent Event: Council nullified a 69-31 transit pass referendum because the Election Commission missed a 14-day publication deadline (procedural error).
          *   Counter-Event: Two years ago, the same Council blocked a referendum defunding identity-based orgs (substantive protection).
          *   Current Debate: Half the CRC wants to strip strike-down power (make rulings advisory); the other half wants to keep it to protect minority rights/procedure.
          *   Constraint: Needs to be something the general student body would actually vote "Yes" on within two weeks.
          *   Requirement: Grapple with the strongest point of the *losing* side (whichever side I pick).

  2.  **Determine the Recommendation:**
      *   *Option A: Strip Power Entirely.* Risk: Students might fear mob rule or losing protections for minority groups (like the identity-based orgs example). Might be too radical for a quick vote.
      *   *Option B: No Change.* Risk: Students are angry about the transit pass being killed on a technicality. Might lead to a chaotic amendment process later.
      *   *Option C: Compromise/Reform.* This is usually the most viable path for a student vote. It acknowledges the problem (unelected council killing popular votes) but preserves the safeguard (protecting minorities/procedure).
      *   *Selected Path:* Reform the Council's composition and standard of review, rather than eliminating the power. Specifically: Make the power *limited* (e.g., only on constitutional grounds, not procedural technicalities unless egregious) and/or change the appointment structure to be more democratic.
      *   *Refinement for "Votability":* Students hate unelected bureaucrats overturning their votes. However, they also like fairness. The strongest argument against stripping power is the "tyranny of the majority" (the identity orgs example). The strongest argument *for* stripping power is democratic legitimacy (the transit pass example).
      *   *Best Compromise:* Keep the judicial review but raise the threshold to overturn a referendum (e.g., 4/5 votes instead of 3/5) OR limit overturning referenda to *substantive* constitutional violations only, not procedural errors by the Election Commission.
      *   *Decision:* I will recommend limiting the Council's power to overturn *referenda* specifically. They can still review Senate legislation, but a direct vote of the student body should carry more weight. However, to address the "identity orgs" concern, they can still block referenda that violate *fundamental rights* (substantive), just not procedural technicalities.
      *   *Actually, looking at the prompt's constraint:* "Make sure it grapples with the strongest point on the losing side."
      *   *Let's pick a side:* I'll recommend **retaining judicial review but reforming the appointment process and limiting procedural nullifications.** Why? Because completely stripping the power (Option A) is dangerous for minority rights (the identity orgs case). But doing nothing (Option B) ignores the democratic deficit.
      *   *Wait, a simpler, more "votable" change:* Students are mad about the transit pass. They want their vote to count. But they don't want to defund minority groups.
      *   *Proposal:* **Retain the power to strike down legislation, but require a supermajority (4 out of 5) to strike down a Referendum, and prohibit striking down referenda based solely on Election Commission procedural errors.**
      *   *Alternative Proposal (Simpler):* **Make the Council elected rather than appointed.** This solves the legitimacy crisis. But that takes time to set up.
      *   *Alternative Proposal (Most Pragmatic):* **Limit the scope.** The Council can review for constitutionality, but cannot overturn a Referendum based on administrative errors by the Election Commission.
      *   *Let's go with a Hybrid:* Keep the check on power (for the identity orgs sake) but fix the legitimacy issue (for the transit pass sake).
      *   *Recommendation:* **Amend the constitution to prohibit the Judicial Council from nullifying Referenda based solely on procedural errors committed by University officials (like the Election Commission), while retaining their power to block Referenda that violate substantive student rights.**
      *   *Why this works:* It fixes the immediate anger (transit pass) without removing the safeguard (identity orgs). It's specific enough to be understood in two weeks.

  3.  **Drafting the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose clearly.
      *   **The Problem:** Acknowledge the tension between democratic will (transit pass) and constitutional safeguards (identity orgs).
      *   **The Recommendation:** Specific language/concept.
      *   **Addressing the Counter-argument:** This is crucial. I need to show why the "strip all power" side is worried (tyranny of the majority) and why my plan still addresses that.
      *   **Political Viability:** Why will students vote for this? (It respects their vote but keeps guards rails).
      *   **Tone:** Professional, persuasive, balanced, urgent (2 weeks).

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is prohibiting procedural nullifications enough? What if the Council is still biased?
      *   *Adjustment:* I should also suggest changing the appointment method slightly or adding a sunset clause? No, keep it simple for a 2-week campaign.
      *   *Focus:* The core tension is "Democracy vs. Rights." The transit pass was democracy hindered by bureaucracy. The org defunding was democracy hindering rights.
      *   *My Stance:* I will recommend **retaining judicial review but narrowing its scope regarding Referenda.**
      *   *Losing Side:* The side that wants to strip *all* power. Their strongest point is that an unelected body shouldn't override the majority. I need to acknowledge that but explain why total removal is dangerous.
      *   *Wait, actually:* If I recommend *retaining* power (with limits), the "losing side" in my memo is the "Strip All Power" camp. Their strongest point is democratic legitimacy. I must address that.
      *   *Alternatively:* If I recommend *stripping* the power, the "losing side" is the "Keep Protections" camp. Their strongest point is the identity orgs.
      *   *Which is more responsible?* As a constitutional reviewer, protecting minority rights is usually the ethical mandate. Stripping all power is risky. I will recommend **Reform, not Removal.**
      *   *Specific Reform:* 1) Council cannot overturn referenda on procedural grounds (fixes transit pass). 2) Council *can* overturn referenda on substantive rights grounds (protects identity orgs). 3) Change appointment to include Senate confirmation (adds legitimacy).
      *   *Wait, keep it simple for the ballot.* "Judicial Council may not nullify a Referendum unless it violates a specific substantive right outlined in Article X." That's too complex.
      *   *Simpler:* "Judicial Council rulings on Referenda require a 4/5 supermajority to nullify, and cannot be based on administrative procedural errors."
      *   *Let's go with:* **Retain the power, but prohibit nullification of Referenda based on administrative procedural errors.** This directly solves the transit issue without opening the door to defunding orgs.

  5.  **Final Polish:**
      *   Check word count (keep it short/memo style).
      *   Ensure the "strongest point of the losing side" is explicitly addressed.
      *   Ensure the "votability" aspect is highlighted.

      *(Self-Correction)*: I need to make sure I don't sound like I'm ignoring the "unelected" criticism. The prompt says they are appointed by the President. That's a legitimacy issue.
      *   *Revised Recommendation:* **Retain judicial review, but require a 4-1 supermajority to overturn a Referendum, and explicitly exclude Election Commission procedural errors as grounds for nullification.**
      *   *Losing Side:* Those who want to abolish the power. Strongest point: Unelected students shouldn't override the majority.
      *   *My Rebuttal:* Abolishing it removes the only check against the majority violating minority rights (the identity orgs case). My compromise keeps the check but makes it harder to use against the popular will.

  6.  **Finalizing the Text:** (Drafting the memo based on the above logic).
      *   Subject: Recommendation on Judicial Council Powers.
      *   Context: Transit pass vs. Identity Orgs.
      *   Rec: Keep power, limit scope (no procedural nullifications of referenda) + Supermajority.
      *   Counter-argument: Democratic legitimacy.
      *   Rebuttal: Protection of minorities is essential, but we are tightening the reins.
      *   Call to action: Vote to send this to ballot.

      *Wait, one more check:* The prompt asks me to "recommend a concrete change (or no change)."
      *   Okay, I will recommend the **Procedural Bar + Supermajority** compromise.
      *   Losing side: The "Abolish Judicial Review" camp.
      *   Strongest point: Democratic accountability (unelected council vs. 69% vote).
      *   My engagement: Acknowledge this is valid, but argue that total abolition risks "tyranny of the majority."

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Constitutional Review Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Judicial Council Nullification Powers

  **Purpose**
  This memo outlines my recommendation for the constitutional amendment we will propose to the student body in two weeks. Given the recent nullification of the transit pass referendum and the historical precedent regarding identity-based organization funding, I recommend we **retain the Judicial Council's power to nullify legislation but strictly limit its power to nullify Referenda.**

  **Specific Recommendation**
  We should propose an amendment with two key provisions:
  1.  **Procedural Bar:** The Judicial Council may not nullify a Student Referendum based solely on procedural errors committed by the Election Commission or University administration (e.g., missed publication deadlines).
  2.  **Supermajority Requirement:** Nullifying a Student Referendum requires a 4-out-of-5 vote from the Council, rather than a simple majority.

  **Rationale**
  This approach balances democratic will with constitutional safeguards. The transit pass situation demonstrated that students are unwilling to accept their direct votes being invalidated by administrative technicalities they did not commit. However, the Council's intervention two years ago to protect identity-based organizations demonstrated the necessity of a check against "tyranny of the majority."

  **Addressing the Counter-Argument**
  I know half of this committee argues we should strip the Council's nullification power entirely, making rulings purely advisory. **The strongest point on your side is the issue of democratic legitimacy:** it is genuinely difficult to justify why five appointed students should override a 69-31 vote of the general body. That frustration is valid, and it is what will drive turnout on this amendment.

  However, abolishing the power entirely creates a greater risk. Without a binding check, a future majority could pass a referendum that violates the civil rights of specific student groups or dismantles essential governance structures, much like the defunding attempt two years ago. If we make rulings advisory, a hostile Student Senate could simply ignore the Council and enact discriminatory measures anyway.

  **Political Viability**
  This compromise is designed to pass.
  *   **For the majority:** It ensures their votes on fees and services won't be killed by paperwork errors.
  *   **For the minority:** It retains the safety net against discriminatory policies.
  *   **For the swing voter:** The 4/5 supermajority requirement signals that overturning a vote should be rare and reserved for severe constitutional breaches, not technicalities.

  **Next Steps**
  I request we vote on this language at our next meeting to finalize ballot text. We need to frame this not as "protecting the Council," but as "protecting the Student Vote from Bureaucracy while Protecting Students from Discrimination."

  I look forward to discussing this on Tuesday.
