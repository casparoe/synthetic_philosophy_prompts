  Give me your own number, but what I really want is the decomposition. I'm thinking at least these terms, though tell me if I'm missing some: your probability that consciousness requires something like integration or global information rather than just reflexive withdrawal from harm; your probability that insects have whatever is actually required, conditional on each way the first question could go; and whether "morally relevant" can come apart from "phenomenally conscious" in a way that changes the arithmetic at all. A rough probability and one line of justification for each term, then however they combine into the final number.

  Then two more things, because I think the interesting part comes after the number. First: I'm not even sure expected value is the right frame here. The whole argument is tiny-credence-times-astronomical-numbers, so a credence of 1 in a million still generates astronomical expected suffering. Does it actually matter, for what we should do, whether the true number is 0.001 or 0.000001 — or does the answer to that depend on views about how to handle moral uncertainty that are themselves pretty contested? Second: of the terms in your decomposition, which one would shift the final answer the most if you could just get perfect evidence on it, and between me at 0.35 and my brother at 0.05, who do you think is making the more consequential mistake — i.e., which of us is wrong about the sub-question that actually drives the practical upshot?
