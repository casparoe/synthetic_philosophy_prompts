answer: |-
  Dear friend,

  It is a fascinating puzzle you have laid out, and I think you are right to sense that there is a coherent principle hiding behind these intuitions, even if it resists a simple one-sentence formulation. Your hypothesis about who benefits is a strong start, but as you noted, it stumbles on the doctor versus the online store, since both involve the steering party gaining something from your decision. After turning this over in my mind, I believe the principle that best captures your verdicts is what I would call the Principle of Reflective Alignment and Non-Extraction. This principle suggests that a nudge is ethically permissible if it helps you overcome inertia to achieve a goal you would reflectively endorse for yourself, provided it does not rely on deception and does not extract value from you for the private gain of the nudger.

  Let us walk through your cases to see how this holds up. The cafeteria salad placement and the pension auto-enrollment both pass the test because they align with your reflective interests in health and financial security, reducing the friction for choices you likely want to make anyway without hiding the alternative. The doctor's framing is the trickiest one, but under this principle, it is fine because the doctor's advantage is derivative of your welfare; her goal of your coping is non-rival with your goal of mental peace, whereas the online store's scarcity tactic fails because it relies on a deception about stock levels to extract a purchase you might not make under calm deliberation, creating a conflict between their profit and your rational agency. This distinction saves the doctor case while condemning the store, resolving the hole in your original beneficiary hypothesis.

  The distinction between the green energy tariff and the boss's donation box is where the principle gets its sharpest test, and it relies on the Non-Extraction clause. Both cases cost you money, but the green energy tariff arguably serves a public good, whereas the company foundation is a private affiliate of your employer, making the default donation feel like a coercive transfer of your wages to their pet project. However, I must be honest with you about where this principle might force us to overturn one of your verdicts. You mentioned that the boss's donation feels worse than the green energy tariff, even though the energy tariff requires printing and mailing a letter to opt out while the donation box takes one click. A strict application of libertarian paternalism would argue that the friction cost is the primary metric of coercion, meaning the green energy case is actually worse because it imposes a significant burden on your freedom to choose. To maintain your verdict that the boss's behavior is worse, our principle has to weigh the nature of the extraction private versus public more heavily than the mechanical friction of the opt-out, which is a subjective moral judgment that not everyone would share.

  If we apply this Principle of Reflective Alignment and Non-Extraction to the new cases you mentioned, we can make some confident predictions. A city that makes parking inconvenient to encourage tram use would likely be fine under this framework, assuming the goal is public welfare like reduced traffic or pollution rather than revenue generation, and assuming the tram is a viable alternative; this aligns with the green energy case but without the private extraction, steering you toward a collective good you might reflectively support. Conversely, a supermarket rearranging aisles to place candy between the entrance and the bread would not be fine, as this mirrors the cafeteria nudge but inverts the welfare outcome; it exploits your path dependency to sell you sugar rather than helping you buy the bread you came for, serving the store's profit at the expense of your health goals without your reflective consent.

  Ultimately, I think this principle gets us near enough to your intuitions to be useful, though it requires us to accept that the ethics of nudging depend heavily on whether the nudger's interests are aligned with ours or extracted from us. The only verdict I fear we might have to overturn is your ranking of the boss versus the green energy case, simply because the hardness of the opt-out in the energy case is a very objective harm to autonomy that might outweigh the ickiness of the company foundation donation. But even if we disagree on that ranking, the core idea that nudges should help you be who you want to be rather than what someone else wants to profit from seems to be the solid ground you were looking for. I hope this helps clarify the sorting you have been doing, and I would love to hear if this resonance feels true to your experience.
