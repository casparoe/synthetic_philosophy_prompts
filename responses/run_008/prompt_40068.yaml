answer: |-
  This is one of the most persistent and fertile stalemates in cognitive science right now. You are not failing to teach it; you are teaching the exact fault line where the field is currently fracturing. The reason your students end up annoyed rather than enlightened is that they are arguing past each other on four distinct dimensions simultaneously, while assuming they are having one argument.

  Here is a diagnosis of the disagreement, followed by a proposal for how to restructure the unit to make the friction productive rather than depressive.

  ### Part 1: The Diagnosis
  The disagreement is not merely verbal, nor is it purely factual. It is a **category error regarding the *explanandum* (what is being explained) compounded by an epistemological clash regarding sufficiency.**

  Here are the four specific layers of the conflict that are getting conflated in Week 5:

  **1. The Ontological Mismatch (Rules vs. Weights)**
  *   **Linguistics Students:** They are asking about *competence*. They want to know how the child acquires a system of abstract, discrete, structure-dependent rules (e.g., "Move the auxiliary in the main clause"). To them, "learning" means fixing parameters in a symbolic system.
  *   **ML Students:** They are asking about *performance*. They want to know if a system can produce the correct output strings (e.g., predicting "Is" in "Is the man who is tall..."). To them, "learning" means minimizing loss on a test set.
  *   **The Clash:** A transformer can get the auxiliary inversion right without representing "structure dependence." It might be using a heuristic like "copy the third token." The linguist says, "It didn't learn the rule." The ML student says, "It got the answer." They are defining "acquisition" differently.

  **2. The Inductive Bias Content (Domain-Specific vs. Domain-General)**
  *   **The Verbal Trap:** You noted that if "innate" just means "prior," the argument evaporates. It doesn't, because the fight is about the *content* of the prior.
  *   **Linguistics Side:** The prior must be *linguistically specific* (UG). It contains constraints like Subjacency or Binding Principles.
  *   **ML Side:** The prior is *architectural* (attention mechanisms, gradient descent). It is domain-general.
  *   **The Real Fight:** Can a domain-general prior (transformer) converge on a domain-specific solution (human grammar) given realistic data? The linguists suspect the geometry of the loss landscape requires linguistic scaffolding; the ML students suspect the scaffolding emerges from the data + attention.

  **3. The Epistemological Standard (Logical vs. Empirical Sufficiency)**
  *   **Linguistics Side (Logical):** They are running a "Gold's Theorem" style argument. *In principle*, can this data support that hypothesis? If the input is compatible with multiple grammars, and the child picks the right one without negative evidence, there must be a constraint.
  *   **ML Side (Empirical):** They are running an "Existence Proof." *In practice*, does this model learn it? If the model learns it, the logical problem is dissolved because the premise (that it *can't* be learned) is empirically false.
  *   **The Clash:** The linguists view the ML result as "changing the subject" (you showed it's computationally possible, not cognitively plausible). The ML students view the linguist argument as "armchair speculation" (you said it was impossible, but here it is working).

  **4. The Data Mismatch (Idealized vs. Tokenized)**
  *   **Linguistics Side:** "Input" means the semantic-pragmatic intake available to a child, filtered through cognitive attention.
  *   **ML Side:** "Input" means the text corpus (Childes, BookCorpus, etc.).
  *   **The Clash:** ML students often underestimate the noise in child-directed speech or overestimate the similarity between text tokens and linguistic intake. Linguists often underestimate the statistical richness of the input (as you noted).

  ### Part 2: What Counts as Progress?
  You asked what would count as progress. A standard learnability result won't fix this, because the sides disagree on what counts as a result. Progress in the seminar comes from **decoupling the questions.**

  You should not stop teaching the unit. This *is* the field. However, you must stop teaching it as a debate with a winner. Instead, teach it as a **translation problem.**

  Here is a concrete redesign for Weeks 5–8 to break the wall:

  **1. The "Inductive Bias Audit" (Week 5)**
  Stop asking "Is POS right?" Start asking "Where is the bias?"
  *   **Activity:** Have the students map specific linguistic constraints (e.g., Structure Dependence) to specific ML architectural features or training objectives.
  *   **Goal:** Force the ML students to admit that a Transformer *does* have strong priors (e.g., locality bias via attention). Force the Linguists to admit that "innate" might just mean "hard-coded architectural constraints" rather than "grammatical rules."
  *   **Outcome:** They realize they are arguing about *which* prior, not *whether* there is a prior.

  **2. The Generalization Challenge (Week 6)**
  Move the debate from "Training Loss" to "Systematic Generalization."
  *   **Activity:** Use datasets like COGS (Compositional Generalization) or specific POS test cases (e.g., Berwick's auxiliary inversion examples) that are rare in training data.
  *   **Task:** Can the model generalize to structures it has never seen, the way a child does?
  *   **Why this helps:** ML students often rely on test sets that are IID (independent and identically distributed) with training. Children generalize systematically. If the model fails at systematic generalization on POS phenomena, the Linguist's point stands (the model is memorizing patterns, not learning rules). If the model succeeds, the ML student has a stronger case.
  *   **Key Reading:** Look at work by **Brenden Lake, Marco Baroni, or Tal Linzen**. They bridge this gap explicitly.

  **3. Efficiency vs. Possibility (Week 7)**
  Distinguish between "Can it be learned?" and "Is it learned *this* way?"
  *   **Concept:** A transformer might learn auxiliary inversion, but does it require 100 million examples to do what a child does with 10,000?
  *   **Activity:** Compare sample efficiency.
  *   **Outcome:** This shifts the burden of proof. The ML student must show not just that the model *can* learn it, but that it learns it with *child-like data efficiency*. The Linguist must specify if their argument is about logical impossibility or just computational inefficiency.

  **4. The "Negative Evidence" Gap (Week 8)**
  Focus on errors children *don't* make.
  *   **Concept:** Children don't make certain overgeneralization errors (e.g., they don't say "Is the man who tall is happy?"). Do transformers make these errors during training?
  *   **Activity:** Analyze the error trajectories of LLMs on specific syntactic phenomena.
  *   **Outcome:** If transformers make errors children never make, the "input is rich enough" argument weakens. It suggests the child has a constraint the model lacks.

  ### Part 3: Recommended Reading to Bridge the Gap
  To stop the "citing the same few papers" loop, introduce papers that force the two sides to speak the same language:
  *   **Warstadt et al. (2020):** "The Learnability of Linguistic Theory." (Explicitly tests neural networks on linguistic theory predictions).
  *   **Linzen (2020):** "How Can We Accelerate Progress Towards Human-like Linguistic Generalization?" (A manifesto for the ML side to care about linguistic structure).
  *   **Marcus (2001/2020 updates):** For the skeptical view on connectionism/algebraic rules.
  *   **Rogers et al. (2020):** "A Primer on BERT." (To ground the linguists in what the models actually are).

  ### Summary Recommendation
  **Do not drop the unit.** The wall is there because the field hasn't climbed it yet.

  **Redesign the goal:** The goal of the seminar should not be to resolve POS. It should be to **precisely locate the disagreement.**
  *   If, by Week 8, the ML students can articulate *why* a linguist thinks attention isn't a substitute for Subjacency, and the Linguists can articulate *why* a statistical existence proof doesn't satisfy cognitive plausibility, you have succeeded.
  *   Make the "annoyance" the subject of study. Ask them: "Why does this result feel like a non-answer to the other side?"

  If you frame the stalemate as the *data* of the course, rather than an obstacle to the course content, you turn their frustration into the primary learning objective. You are teaching them how to navigate a paradigm clash, which is a more valuable skill for grad students than knowing the "answer" to POS.
