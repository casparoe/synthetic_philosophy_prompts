  # Joint Statement of Adversarial Collaboration on the Nature of Time

  **Participants:** The Presentist (Author A) and The Eternalist (Author B)
  **Date:** [Current Date]
  **Subject:** Mapping the Disagreement on Temporal Ontology

  ## 1. Agreed Claims

  We affirm the following claims as common ground. These statements are intended to be non-vacuous and acceptable within both our frameworks without requiring semantic reinterpretation.

  1.  **Phenomenology:** We both experience time as flowing. We share the immediate sensation that the present is uniquely vivid, that the past is fixed, and that the future is open.
  2.  **Physics:** We agree that the theory of special relativity is empirically successful. We agree that within the mathematics of this theory, simultaneity is relative to an observer's state of motion.
  3.  **Truth:** We agree that statements about the past (e.g., "Caesar crossed the Rubicon") have stable truth values. We agree that such statements are true now.
  4.  **Causation:** We agree that present events are causally dependent on past events. We agree that effects do not precede their causes in any standard frame of reference.
  5.  **Existence (Present):** We agree on the inventory of what exists *right now*. We do not disagree about which objects are present; we disagree about whether non-present objects exist.
  6.  **Language:** We agree that tensed language (past, present, future) is indispensable for daily life and successful communication.

  ## 2. The Six Candidate Disagreements

  For each candidate point of contention, we provide two formulations: one favored by the Eternalist (B) and one favored by the Presentist (A). We then note whether the difference in wording reflects a genuine disagreement or merely a difference in emphasis.

  **1. Plain Ontology**
  *   **Eternalist Wording:** Past and future events exist tenselessly; the present is merely the time at which the speaker is located.
  *   **Presentist Wording:** Only present events exist simpliciter; past and future events do not exist in any sense.
  *   **Note on Disagreement:** These wordings contradict each other directly regarding the extension of the word "exist."

  **2. Truthmakers for Past Truths**
  *   **Eternalist Wording:** True statements about the past require existing entities (truthmakers) to ground their truth; since past statements are true, past entities must exist.
  *   **Presentist Wording:** True statements about the past are grounded in present traces, properties, or primitive facts; they do not require past entities to exist.
  *   **Note on Disagreement:** These wordings disagree on the metaphysical requirements for truth, not merely on language.

  **3. Relativity and Simultaneity**
  *   **Eternalist Wording:** Because simultaneity is relative to velocity, there is no privileged present slice of reality; therefore, all times are equally real.
  *   **Presentist Wording:** Because simultaneity is relative to velocity, it is a feature of measurement coordinates, not a guide to what fundamentally exists; a privileged present may still exist ontologically.
  *   **Note on Disagreement:** These wordings disagree on the ontological implications of physical theory.

  **4. Cross-Temporal Relations**
  *   **Eternalist Wording:** Relations like causation or debt hold between existing entities located at different times within the block universe.
  *   **Presentist Wording:** Relations like causation or debt hold between present entities and non-existent past entities, or are analyzed as present properties of current entities.
  *   **Note on Disagreement:** These wordings may be paraphrases of the same structural claim, differing only on whether the relata must "exist."

  **5. The Nature of Change**
  *   **Eternalist Wording:** Change is variation in properties across different temporal parts of an object (like a road varying in scenery across miles).
  *   **Presentist Wording:** Change is the alteration of an object's properties over time, requiring the object to wholly exist at different times.
  *   **Note on Disagreement:** These wordings define "change" differently; it is unclear if they describe different phenomena or just label the same phenomenon differently.

  **6. The Verbal Suspicion**
  *   **Eternalist Wording:** The Presentist is restricting the quantifier "there exists" to "there exists now," creating an artificial dispute.
  *   **Presentist Wording:** The Eternalist is expanding the quantifier "there exists" to include "there exists tenselessly," creating an artificial dispute.
  *   **Note on Disagreement:** These wordings accuse the other of linguistic manipulation; the disagreement is about the logic of the dispute itself.

  ## 3. The Cruxes

  We identify three sub-questions such that settling one would force at least one of us to revise our position. For each, we specify a concrete test and our respective predictions.

  **Crux 1: The Ontological Import of Relativity**
  *   **The Question:** Does the relativity of simultaneity in physics entail that there is no objective present, or does it merely describe measurement limitations?
  *   **The Test:** Consider two observers passing each other at high speed. According to relativity, they disagree on whether a distant event (e.g., a flare on Andromeda) is happening "now." If one observer's "now" includes the flare and the other's does not, can both be ontologically correct?
  *   **Eternalist Prediction:** Yes. Both are correct relative to their frames. Since the flare is real for one, it is real simpliciter. This forces Presentism to deny standard physics.
  *   **Presentist Prediction:** No. Only one frame (perhaps undetectable) corresponds to the true present. Physics describes observations, not fundamental ontology. This forces Eternalism to conflate measurement with being.

  **Crux 2: The Truthmaker Principle**
  *   **The Question:** Must every true proposition be made true by something that currently exists?
  *   **The Test:** Consider the statement "Dinosaurs existed." Currently, there are bones and fossils. Are these present traces sufficient to make the statement true, or must the dinosaurs themselves exist in some sense to ground the truth?
  *   **Eternalist Prediction:** Traces are insufficient. A trace is consistent with many pasts. Only the actual past events (which exist tenselessly) make the statement true. This forces Presentism to accept non-present existents.
  *   **Presentist Prediction:** Traces plus laws of nature are sufficient. We do not need the dinosaurs to exist now to make it true that they *were*. This forces Eternalism to accept unnecessary ontology.

  **Crux 3: The Phenomenology of Relief**
  *   **The Question:** Does the feeling of relief after a painful event require that the event no longer exists?
  *   **The Test:** Consider finishing a painful root canal. The relief seems to be about the pain being *gone*. If the pain still exists in the block universe (just at an earlier time), is the relief rational?
  *   **Eternalist Prediction:** Yes, it is rational. Relief is indexical, like feeling relief that a dangerous location is "there" but not "here." The pain is not "now." This forces Presentism to admit indexicality explains the feeling.
  *   **Presentist Prediction:** No, it is not rational. Relief requires cessation of existence, not just spatial/temporal distance. If the pain still exists, it is not truly over. This forces Eternalism to deny the veridicality of deep human experience.

  ## 4. Verdicts on Candidate Disagreements

  For each of the six candidates, we render a verdict on whether the disagreement is verbal (a matter of definition or language) or substantive (a matter of fact or metaphysics).

  **1. Plain Ontology: Substantive**
  *   **Reasoning:** While quantifiers can be restricted, the disagreement here is about what fundamental reality contains. One view posits a four-dimensional manifold of entities; the other posits a changing three-dimensional slice. This is not merely a choice of words but a choice of world-structure.

  **2. Truthmakers for Past Truths: Substantive**
  *   **Reasoning:** This concerns the metaphysical principle of grounding. Whether present traces are sufficient to ground past truths is a claim about the nature of truth and reality, not just how we speak.

  **3. Relativity and Simultaneity: Substantive**
  *   **Reasoning:** This is a disagreement about the interpretation of physical theory. Whether mathematics maps directly to ontology or merely to observation is a factual claim about the relationship between physics and metaphysics.

  **4. Cross-Temporal Relations: Verbal**
  *   **Reasoning:** Both sides can model relations like causation successfully. The Presentist uses tensed properties or ersatz objects; the Eternalist uses relations between spacetime points. Since the predictive and explanatory power is identical, the disagreement is about how to linguistically frame the relation, not the relation itself.

  **5. The Nature of Change: Verbal**
  *   **Reasoning:** Both sides agree on the phenomena: an object has different properties at different times. The Eternalist calls this "variation across parts"; the Presentist calls this "alteration." Since they agree on the observable data, the dispute is over the definition of the word "change."

  **6. The Verbal Suspicion: Substantive**
  *   **Reasoning:** This is a meta-ontological claim. To assert that a dispute is verbal is to make a substantive claim about the logic and structure of the disagreement. Since we disagree on whether the dispute is verbal, this disagreement itself is substantive.

  ## 5. Conclusion

  We conclude that while some aspects of our decade-long argument were indeed verbal (specifically regarding the labeling of change and the modeling of relations), the core dispute regarding the ontology of time, the grounding of truth, and the interpretation of physics remains substantive. We have not resolved the dispute, but we have isolated the load-bearing pillars. Future work should focus exclusively on the cruxes identified in Section 3.

