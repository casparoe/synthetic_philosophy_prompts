  **That prove the inconsistency of men who blame in women the ignorance they themselves enforce**

  You lock the book and bar the door,
  Then ask why I am ignorant.
  You make the mind so indigent,
  And blame the dust upon my floor.

  You want a wife who speaks with grace,
  But fear the school where wit is grown.
  You sow the weed and blame the stone,
  Then scorn the silence of my face.

  You say the kitchen is my place,
  Where eggs reveal their fluid state.
  You call it base, I call it fate,
  Where Aristotle left his trace.

  When syrup thickens in the heat,
  I learn the laws you read in text.
  You say my study is incomplete,
  Yet stand on what I cook and eat.

  I claim no laurel for my brow,
  I keep my humble station here.
  Yet who has put me in this fear?
  If not the men who banish now?

  You bar the door and call me blind,
  You steal the lamp and blame the night.
  You take the sun and hide the light,
  Then scorn the shadow on my mind.

  Who is more worthy of the blame?
  She who steals knowledge from the dark?
  Or he who sets the lock and mark?
  And brands her silence as her shame?

  ***

  **Note on Liberties Taken**

  For the purposes of this classroom exercise, several liberties were taken with Sor Juana's actual corpus and historical context:

  1.  **Authorship:** This is a pastiche. Sor Juana never wrote this specific poem; it is constructed to mirror the form and argumentative strategy of *Hombres necios* while incorporating the epistemological arguments found in the prose of the *Respuesta a Sor Filotea*.
  2.  **Form:** While the poem adheres to the *redondilla* structure (quatrains, ABBA rhyme), maintaining strict octosyllabic meter in English is significantly more difficult than in Spanish. Some lines rely on poetic contraction (e.g., "boundary" as two syllables) to maintain the snap of the original meter.
  3.  **The Closing Choice:** The original *Hombres necios* ends with an open rhetorical question (*¿O cuál es más de culpar...?*). Per your instruction to "make a definite choice," this version loads the question heavily to indict the male gatekeeper unequivocally, removing the semblance of equilibrium found in Sor Juana's original closing dilemma.
  4.  **Kitchen Empiricism:** The specific examples of frying eggs and thickening syrup are drawn directly from paragraph 77 of the *Respuesta*, versified here to fit the satirical tone of *Hombres necios*. In her actual work, these examples appear in prose as a serious defense of natural philosophy, not within a satirical poem.
