answer: |-
  Dear Colleague,

  I have spent some time thinking through the argument your colleague presented, and I share your intuition that the conclusion proves far too much. While Sen's liberal paradox is a profound result in social choice theory, the leap from that theorem to the claim that every actual society is irrational contains a subtle but critical error. The step you should reject is step five, which infers that because no procedure works for all possible preference profiles, every institution in every society is irrational. This step slides from a logical impossibility result under conditions of universal domain to an empirical claim about actual human societies, and while the slide looks innocent because it relies on a plausible observation about human nature, it misapplies the scope of the theorem.

  The mischief lies in how step five interprets the conditions under which Sen's impossibility arises. Sen's theorem, as correctly stated in step four, proves that no aggregation rule can satisfy Pareto and Minimal Liberalism simultaneously for all logically possible preference profiles. This condition is known in the literature as universal domain. It means that if you can imagine any conceivable configuration of preferences, even bizarre or highly meddlesome ones, there will be some configuration that breaks the system. However, step five claims that because people always harbor preferences about each other's business, the paradox arises everywhere. This is a non sequitur. It is not enough for people to have preferences about others' lives; those preferences must be structured in the specific, contradictory way illustrated by the prude and the lewd reader. In Sen's example, the paradox requires a specific cycle of preferences where individual decisiveness clashes directly with unanimous preference in a way that generates intransitivity. Most real-world preferences about others' business do not form this specific logical knot. People may care what their neighbors read, but they rarely care in the precise configuration required to generate a social cycle that violates rationality while respecting both Pareto and Liberalism.

  This slide looked innocent because it conflates the existence of interdependent preferences with the existence of paradox-generating preferences. It is true that people are meddlesome, and it is true that the theorem applies to all possible profiles, but it does not follow that actual societies inhabit the specific subset of profiles that trigger the paradox. Your colleague's argument assumes that the theoretical possibility of a contradiction implies an actual contradiction in every instance, much like arguing that because a bridge could collapse under a specific, extreme weight distribution, every bridge is currently collapsing. The theorem shows a vulnerability in the logical structure of liberal social choice, not a permanent state of failure in all functioning societies. By rejecting step five, you preserve the integrity of the theorem while denying its universal application to reality.

  However, rejecting this step does come with a cost, and you should be honest about what you are giving up. By denying that the theorem bites everywhere, you must concede that social rationality is not guaranteed by institutions alone. If you keep Pareto and Minimal Liberalism, you must admit that the rationality of a society depends contingently on the moral character of its citizens. A liberal society can only function logically if its members possess a certain level of tolerance or limited meddlesomeness. If a society were to become sufficiently nosy in the specific ways Sen describes, where everyone's personal preferences over others' private actions clash with unanimous welfare judgments, the institutions would indeed fail to produce a rational collective choice. You are giving up the claim that liberal institutions are robust against any change in public morality. You cannot argue that the system is foolproof; you must argue that it works because people are, as a matter of fact, not usually prudes and lewds in the specific logical sense required to break it.

  Regarding your colleague's demand that you name an actual rational society or confess that the theorem bites everywhere, you now have a clear response. You do not owe him the name of a society that is rational under all conceivable conditions, because no such society exists given the theorem. You only need to show that actual societies are rational under actual conditions. You can point to any stable liberal democracy and argue that while it is vulnerable to the paradox in theory, it does not suffer from it in practice because the preference profiles of its citizens do not typically satisfy the paradox-generating conditions. Your colleague can fairly demand that you acknowledge the fragility of this rationality and admit that a shift in cultural norms toward extreme meddlesomeness could precipitate a crisis of collective rationality. He cannot, however, fairly demand that you accept that current societies are already irrational, because the premises required to trigger the impossibility are not universally present in the real world.

  In sum, the argument fails at step five because it treats a theoretical limit on all possible worlds as an empirical description of this world. You can keep the Pareto principle and Minimal Liberalism without accepting that society is inherently defective, provided you accept that their compatibility relies on the empirical fact that people are not always logically meddlesome. This preserves the ideal of a free society while acknowledging that its coherence depends on the virtues of its members as much as the design of its institutions.
