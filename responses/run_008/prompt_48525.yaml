prompt: |-
  My cousin has gone pretty deep down the moon landing rabbit hole, and whenever anyone in the family pushes back he just says "do your own research." Thing is, I've heard my stats prof say basically the same thing when she wanted us to stop taking textbook claims on faith, and it sounded completely reasonable coming from her. Same five words, totally different vibe, so I got to wondering wether the slogan is actually several different claims wearing one hat.

  Can you lay out the distinct precise things "do your own research" could be asserting? For each reading I'd want to know what "research" even means there (reading primary sources yourself? finding commentators you trust? just not deferring to the specific authority being challenged?), whether trusting an expert counts as doing your own research under that reading or as its opposite, who carries the burden of proof, and whether the reading is trivially true, substantive and defensible, substantive and false, or just a conversation-stopper dressed up as epistemic advice. It'd also help if you said which reading does the work my cousin needs it to do when he uses it to end an argument at Thanksgiving, since for him it seems to mean "nothing you cite counts as research" while for my prof it seemed to mean "go check before you repeat it." If any readings can't really be separated in practice, flag that instead of pretending they're cleanly distinct. Lay it out as a list I can bring to dinner.
