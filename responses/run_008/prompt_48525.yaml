answer: |-
  Here is a breakdown of the distinct claims hiding inside "Do Your Own Research" (DYOR). You can bring this list to dinner to disentangle why the phrase feels virtuous coming from your professor but frustrating coming from your cousin.

  Note: In practice, your cousin likely blends Readings 2, 3, and 4 together, while your professor is strictly operating under Reading 1.

  ### 1. The Pedagogical Imperative (The Professor's Reading)
  *   **What "Research" Means:** Engaging with the methodology, data, and primary literature to understand *how* a conclusion was reached. It implies acquiring enough literacy to evaluate the quality of evidence.
  *   **Trusting Experts:** Compatible. Experts are viewed as guides who have already done the heavy lifting. Trusting them is rational *if* you understand the process that validated them. Blind faith is the enemy; informed trust is the goal.
  *   **Burden of Proof:** Shared. The claimant must provide evidence, but the listener has a duty not to accept claims without checking their coherence.
  *   **Epistemic Status:** **Substantive and Defensible.** It is a call for intellectual hygiene.
  *   **Does it do the Cousin's work?** **No.** This reading requires you to engage with the material he is rejecting. It invites argument and clarification, it does not end them.

  ### 2. The Epistemic Sovereignty Claim (The Philosophical Reading)
  *   **What "Research" Means:** Any personal effort to verify a claim. It prioritizes *your* processing of information over *their* status. It asserts that belief is a voluntary act that cannot be compelled by authority.
  *   **Trusting Experts:** The Opposite. Deferring to an expert without personal verification is seen as a surrender of autonomy. You are the final arbiter of truth, regardless of your competency level.
  *   **Burden of Proof:** On the Individual. You are responsible for your own belief state. No one can force you to believe, so you must do the work to decide.
  *   **Epistemic Status:** **Substantive and Defensible (in principle), but Risky (in practice).** It is true that you are responsible for your beliefs, but false to imply that a layperson's "research" is epistemically equal to an expert's consensus.
  *   **Does it do the Cousin's work?** **Yes.** This justifies his refusal to accept your sources. He is asserting his right to be the judge, not the jury.

  ### 3. The Burden-Shifting Tactic (The Rhetorical Reading)
  *   **What "Research" Means:** Finding counter-evidence to *my* claim. It transforms "research" from "verify the truth" to "disprove me."
  *   **Trusting Experts:** Irrelevant unless they agree with me. If you cite an expert, the response is "that's just what they want you to think," requiring you to find an expert who disagrees to balance the scale.
  *   **Burden of Proof:** **Shifted entirely to the Listener.** The speaker makes an extraordinary claim (e.g., "the moon landing was faked"), but refuses to defend it, instead demanding you prove it didn't happen.
  *   **Epistemic Status:** **Conversation-Stopper / Fallacious.** This is a variation of "appeal to ignorance." It creates an asymmetrical standard where the claimant needs no evidence, but the skeptic needs infinite evidence.
  *   **Does it do the Cousin's work?** **Yes.** This is the mechanical function of the phrase at Thanksgiving. It allows him to make a claim without defending it, framing your pushback as laziness.

  ### 4. The Institutional Corruption Presupposition (The Conspiracy Reading)
  *   **What "Research" Means:** Digging for anomalies, leaks, or alternative narratives that the "mainstream" has suppressed. Standard channels (textbooks, peer review) are viewed as part of the problem, not the solution.
  *   **Trusting Experts:** The Opposite. Mainstream experts are treated as suspects or actors. Trusting them is evidence that you have been "programmed."
  *   **Burden of Proof:** On the Institution. The burden is on NASA (or science) to prove they *aren't* lying, which is often an impossible standard (proving a negative).
  *   **Epistemic Status:** **Substantive and False.** It assumes corruption as a premise rather than a conclusion. It renders the claim unfalsifiable because any evidence against the conspiracy is interpreted as proof of the conspiracy's depth.
  *   **Does it do the Cousin's work?** **Yes.** This defines *what* he researches. It explains why your stats professor's advice doesn't apply to him; he believes the "textbook" itself is compromised.

  ***

  ### Summary for the Dinner Table

  | Feature | **The Professor (Reading 1)** | **The Cousin (Readings 2, 3, 4)** |
  | :--- | :--- | :--- |
  | **Goal of Research** | Understanding methodology. | Validating personal intuition / Disproving the mainstream. |
  | **Role of Experts** | Scaffolding to help you learn. | Obstacles to be bypassed or suspects to be exposed. |
  | **Burden of Proof** | Claimant provides evidence; Listener verifies. | Listener must disprove the Claimant's alternative theory. |
  | **Outcome** | Consensus or refined understanding. | Permanent stalemate ("You haven't looked hard enough"). |

  ### How to Use This
  If you want to push back without just saying "you're wrong," try addressing the specific reading he is using:

  *   **If he's using Reading 3 (Burden-Shifting):** "You're asking me to disprove your claim rather than you proving it. That's not research, that's moving the goalposts."
  *   **If he's using Reading 1 (Pedagogical):** "I have done the research. I've looked at the telemetry, the geology, and the peer review. What specific methodology are you suggesting I look at that I haven't?"
  *   **If he's using Reading 4 (Corruption):** "If every source that disagrees with you is part of the cover-up, then 'do your own research' just means 'find people who already agree with you.' That isn't research, that's echo-chambering."

  **The Overlap Flag:** In practice, Readings 2, 3, and 4 are fused for the conspiracy theorist. He believes he has the *right* to decide (2), so he shifts the *burden* to you (3), because he assumes the *sources* you cite are corrupt (4). Separating them analytically helps, but he likely won't distinguish them in the moment.
