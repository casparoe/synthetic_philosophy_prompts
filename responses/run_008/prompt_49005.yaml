answer: |-
  # The Control Sorting Handout

  **Start:** You've heard the claim: *Some things are up to us, and some things aren't.* Answer the following concrete questions to find which version of Stoicism you actually hold.

  **1. The Archer**
  You aim perfectly at a target, but a gust of wind blows the arrow off course. Is the miss outside your control?
  *   **No (I control the outcome):** Go to **Leaf A**.
  *   **Yes (Only the aim was mine):** Go to Question 2.

  **2. The Interview**
  You prepare thoroughly for a job interview but don't get the job. Is your influence over the hiring manager a middle category (not fully control, not fully none)?
  *   **Yes (Influence counts):** Go to **Leaf B**.
  *   **No (It's binary):** Go to Question 3.

  **3. The Emotion**
  You feel a sudden spike of anger or grief. Is the feeling itself "up to you"?
  *   **No (It's a biological reflex):** Go to **Leaf A**.
  *   **Yes (It's my judgment):** Go to Question 4.

  **4. The Sufficiency**
  If only your judgments are truly up to you, is mastering them enough to live a good life?
  *   **No (I need external results):** Go to **Flag X**.
  *   **Yes (Virtue is enough):** Go to Question 5.

  **5. The Physics**
  If a brain scan could predict your judgment before you made it, would you still say the choice was "up to you"?
  *   **No (Real control needs freedom from cause):** Go to **Leaf C**.
  *   **Yes (Causation doesn't remove ownership):** Go to **Leaf D**.

  ***

  ### Leaves

  **Leaf A: Deflationary**
  *Reached via Q1 (No) or Q3 (No).*
  You think the dichotomy is either trivially true (everything I do is controlled) or scientifically confused (biology controls me). You agree with the Strict reader that it's "just psychology," but you see this as reducing the claim's value rather than securing it.

  **Leaf B: Modified Trichotomy**
  *Reached via Q2 (Yes).*
  You believe there are things we fully control, things we don't, and things we can merely influence. You likely read modern adaptations (like Irvine) that soften the classical binary to make it more practical for goal-setting.

  **Leaf C: Strict Classical**
  *Reached via Q5 (No).*
  You hold that only assent and judgment are up to us, and you ground this in a notion of agency that stands apart from physical determinism. You focus on the ethical scope of control regardless of whether the universe is determined.

  **Leaf D: Compatibilist**
  *Reached via Q5 (Yes).*
  You believe the dichotomy only works if determinism is true. You see "up to us" as compatible with causal chains, arguing that your judgments are yours precisely because they arise from your character, even if determined.

  ***

  ### Flags

  **Flag X: The Frustrated Stoic (Incoherent/Unattractive)**
  *Reached via Q4 (No).*
  You accept the strict dichotomy (only judgment is yours) but reject the core Stoic promise (that this is enough for happiness). This view is logically stable but philosophically unattractive to Stoicism, as it accepts the cost without the benefit.
