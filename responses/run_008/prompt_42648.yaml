      *   **Money Pump:** An agent with intransitive/cyclic preferences (A > B > C > A) can be induced to trade A->B (pay $\epsilon$), B->C (pay $\epsilon$), C->A (pay $\epsilon$), ending with A but less money. Repeated indefinitely = bankruptcy.
      *   **Diachronic Rationality:** Rationality over time. Is it a constraint on single choices (synchronic) or sequences of choices (diachronic)?
      *   **Synchronic vs. Diachronic:** One-shot consistency vs. trajectory consistency.
      *   **Sophisticated Choice:** Backward induction. Anticipating future preference changes and acting accordingly (often leads to "unraveling" or suboptimal outcomes relative to $t=0$).
      *   **Resolute Choice:** Committing at $t=0$ to a plan and sticking to it, even if future selves want to deviate.
      *   **Dynamic Consistency:** A plan made at $t=0$ is still optimal at $t=k$.

  3.  **Map to ML/RL Vocabulary:**
      *   *Preferences* $\rightarrow$ Reward Function ($R$) or Value Function ($V$).
      *   *Money Pump* $\rightarrow$ Exploitability / Negative Regret / Dutch Book in betting markets.
      *   *Cyclic Preferences* $\rightarrow$ Inconsistent Value Function / Non-transitive Reward Model.
      *   *Synchronic* $\rightarrow$ Greedy Policy / Myopic Optimization.
      *   *Diachronic* $\rightarrow$ Trajectory Optimization / Cumulative Return ($\sum \gamma^t r_t$).
      *   *Sophisticated* $\rightarrow$ Subgame Perfect Equilibrium / Backward Induction / Model-Based RL with changing dynamics.
      *   *Resolute* $\rightarrow$ Precommitment / Constrained Optimization / Policy Binding.
      *   *Preference Drift* $\rightarrow$ Non-stationary Reward Function ($R_t$ changes).

  4.  **Drafting the Mapping (Iterative Refinement):**

      *   *Money Pump:* In ML, if an agent has cyclic preferences, it implies the value function isn't well-defined. In RL, we assume a scalar reward. If $V(A) > V(B) > V(C) > V(A)$, the Bellman equation breaks. *Correction:* In bandits/RL, we usually assume a fixed underlying reward distribution. If the *agent's model* is cyclic, it's a bug. If the *environment* is cyclic (Rock-Paper-Scissors), the optimal policy is mixed. The Money Pump assumes the *agent* pays to switch. This maps to an adversary finding a policy $\pi$ such that Expected Return is negative despite starting/ending in same state.
      *   *Transitivity:* In ML, utility must be scalar to optimize. If preferences aren't transitive, you can't define a max. So "No Cycles" is a prerequisite for defining the objective function, not just a rationality constraint.
      *   *Diachronic/Synchronic:* This is the core tension. ML optimizes cumulative return (Diachronic). But if $R_t$ changes, optimizing $\sum R_t$ requires knowing future $R$.
      *   *Sophisticated:* This is standard RL with non-stationary rewards. You calculate $Q^*(s, t)$ knowing $R_{t+1} \neq R_t$. You act optimally for *that* time step.
      *   *Resolute:* This is *not* standard RL. Standard RL allows re-planning. Resolute choice is forcing $\pi_0$ to hold even if $\pi_t$ disagrees. This maps to *commitment devices* or *hard constraints*.

  5.  **Identifying the Residue (The "Real" Disagreement):**
      *   ML assumes the "Agent" is a single optimization process maximizing a defined objective.
