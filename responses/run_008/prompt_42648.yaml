      *   *Residue:* The ontological status of the "self" over time. ML treats time as indices in a sequence. Philosophy treats time as distinct agents (multi-agent game vs. single agent).
      *   *Is the disagreement substantive?* Yes, it's about normativity (what *should* you do) vs. descriptiveness (what *does* the algorithm do). ML defines rationality as "optimizing the given objective." Philosophy asks "Is the objective itself rational?"

  6.  **Critiquing the Money Pump/Transitivity:**
      *   Is it just "no cycles"? In ML, yes, because we need a scalar field to descend.
