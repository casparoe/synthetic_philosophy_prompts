      *   *User's definition of Resolute:* "committing early." -> This is Open-Loop Control vs. Closed-Loop.
      *   *Money Pump:* In ML, if you have cyclic preferences, your Value Function doesn't converge. Q-learning would diverge. So it's less "exploitability" and more "optimization failure." I need to make sure this distinction is clear. The Money Pump is an *external* exploit, Q-learning divergence is an *internal* failure. They are duals.
      *   *Residue:* The key is *Normativity*. ML is instrumental. Philosophy is often constitutive.

  10. **Final Polish:** Check against constraints (piece by piece, residue report, honest take, no softening). (Proceed to generate output based on these thoughts.)

  *(Self-Correction during drafting)*: Wait, I need to be careful about "Reward Drift." In the user's background, they model the *user* with a drifting reward. In the philosophy debate, the *agent itself* has drifting preferences. These are mathematically identical (the objective function $R_t$ depends on $t$), but the *normative* question differs. In RecSys, we (the system) want to maximize our metric, potentially accounting for user drift. In Philosophy, the agent *is* the user. I need to clarify that the "Agent" in the philosophy debate corresponds to the "User" in the RecSys setting, while the "RL Algorithm" is the mechanism trying to satisfy them. Actually, better to treat the RL Agent as the Philosophical Agent to keep the mapping direct. I will assume the RL Agent's reward function is what's drifting.

