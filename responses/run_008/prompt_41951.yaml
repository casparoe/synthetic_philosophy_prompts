  **Activity: The Toxin Trap (90 mins)**
  **Props:** Camp tokens (high value), spicy chips (safe, check allergies), envelopes, whiteboard.
  **Timing:** Payment Day 1, Consumption Day 2. The gap is crucial.

  **Phase 1: The Billionaire's Offer (45 mins)**
