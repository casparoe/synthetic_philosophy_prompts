  **Troubleshooting**
  *   **Stakes Too Low:** If 10 tokens buys nothing, they won't care. **Fix:** Auction exclusive privileges (front of line, music choice) instead of just food. Ensure tokens feel scarce.
  *   **Gaming the Scanner:** Kids will act well to get tokens. **Fix:** Remind them *they* know they're lying. The puzzle is internal, not external. Ask: "Did you feel like you tricked me, or tricked yourself?"
  *   **Refusal to Eat:** Someone takes money, refuses chip, feels cheated/angry. **Fix:** Pre-frame: "The money is yours regardless. The chip is optional. The weird feeling is the lesson. If you feel no tension, you lost the point."
