  2.  **Detection Mechanism:** You cannot read minds. **Handle:** Play the "Omniscient Billionaire." Tell them: "I know when you're lying. If I doubt your intent, no tokens." Judge based on eye contact/hesitation during individual interviews.
  3.  **Why This Works:** It externalizes the internal doubt. In the puzzle, *you* know you're lying. Here, *I* pretend to know. It forces them to confront their own sincerity rather than just gaming a form.
  4.  **Distortion:** This adds social pressure (shame/reputation) absent in the original puzzle. They fight your judgment, not just logic. Acknowledge this in debrief.
  5.  **Execution:** Individual interviews. Pay out. Next day, public eating attempt.

  **Phase 2: Bootstrapping (30 mins)**
  1.  **Challenge:** "Most couldn't intend last time because you knew you'd back out. Can you force yourself?"
  2.  **Tools:** Allow commitment devices. Public vows on whiteboard. Betting their own tokens (if you don't eat, you owe me 20). Signing contracts.
  3.  **Goal:** See if adding consequences changes the *intention* or just the *action*. Does it make the intention rational now? Does it change the *feeling* of intending?
  4.  **Execution:** Repeat Phase 1 with their chosen binders. Compare success rates.

  **Debrief (15 mins)**
  Don't lecture. Ask:
  *   "Who got paid but felt like a fraud?" (Highlights intention/action gap).
  *   "At the exact moment I handed you tokens, did your desire to eat the chip change?" (Highlights the rationality shift).
