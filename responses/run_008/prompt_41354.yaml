answer: |-
  You are right to feel unsatisfied. Your intuition is actually aligned with how professional mathematicians and philosophers of probability think about this, while your friend is reciting a slogan that sounds deep but conflates two different concepts.

  The core confusion here is between **Ontological Probability** (how the world *is*) and **Epistemic Probability** (what we *know*).

  *   **Ontological:** Is the universe random? (e.g., Does a radioactive atom *really* have a chance of decaying?)
  *   **Epistemic:** How confident should a rational person be? (e.g., I haven't looked under the cup, so I'm 50% confident the coin is heads.)

  Your friend is arguing about the first one. You are talking about the second one.

  Here is the breakdown of the five distinct things your friend could mean, evaluated by whether they are true and whether they actually stop you from making the bet.

  ### 1. The Ontological Claim
  *   **The Claim:** "Goldbach is either true or false. There is no '90% true' in reality. Therefore, probability doesn't apply."
  *   **Verdict:** **True, but useless.**
  *   **Does it kill the bet?** **No.**
  *   **Why:** This is the point you already spotted with your coin flip analogy. Once a coin lands, it is 100% heads or 100% tails. But if it's under your hand, it is perfectly rational to bet 50/50. The "truth" of the matter is fixed; your *access* to that truth is not. Probability in betting is almost always about your access to the truth, not the truth itself.

  ### 2. The Frequentist Claim
  *   **The Claim:** "Probability is defined as the long-run frequency of an event in repeated trials. You can't run the 'Goldbach Conjecture experiment' multiple times. So '90%' is gibberish."
  *   **Verdict:** **Contentious (and mostly outdated).**
  *   **Does it kill the bet?** **No.**
  *   **Why:** This is a specific definition of probability (Frequentism) that many statisticians have moved away from for exactly this reason. If Frequentism were the only valid view, you couldn't put a probability on "Will it rain tomorrow?" (since tomorrow only happens once) or "Did Shakespeare write this play?" (it's either yes or no). Most modern betting and decision-making uses *Bayesian* probability, which measures degree of belief, not just repeatable frequencies.

  ### 3. The Proof-Standard Claim
  *   **The Claim:** "In mathematics, belief without proof is not rational. You either have a proof (100%) or you have nothing (0%). Anything in between is just guessing, not math."
  *   **Verdict:** **Culturally true, philosophically false.**
  *   **Does it kill the bet?** **No.**
  *   **Why:** This is a norm of the *mathematics profession*, not a rule of *rationality*. Mathematicians refuse to publish conjectures as theorems without proof. But mathematicians absolutely hold private beliefs about conjectures. They will say, "I'd bet my house on the Riemann Hypothesis being true." If your friend says you can't bet because it's not proven, he's confusing "publishing a paper" with "making a decision under uncertainty."

  ### 4. The Logical Omniscience Claim
  *   **The Claim:** "Standard probability theory assumes that if you know the rules of logic, you know all the consequences. If Goldbach is true, it is a logical consequence of the axioms. Therefore, a rational agent *must* assign it 100%."
  *   **Verdict:** **The strongest theoretical point, but impractical.**
  *   **Does it kill the bet?** **Technically yes, practically no.**
  *   **Why:** This is the "steelman" version of your friend's argument. Traditional probability math (Kolmogorov axioms) breaks down if you assign less than 100% to a statement that turns out to be a logical truth. It assumes you are a god who sees all logical connections instantly. Since humans aren't logically omniscient (we can't instantly see if a huge number is prime), we need a theory of "Logical Uncertainty." Your friend is appealing to the ideal standard, ignoring human limitation.

  ### 5. The Resolution Claim
  *   **The Claim:** "A bet requires a settlement condition. If Goldbach is undecidable (neither provable nor disprovable), this bet never ends. Therefore the odds are meaningless."
  *   **Verdict:** **Pragmatically True.**
  *   **Does it kill the bet?** **Yes, this is the only one that works.**
  *   **Why:** This isn't about whether probability *exists*, but whether the *contract* is valid. If the conjecture is independent of standard math axioms (like the Continuum Hypothesis), there may be no "fact of the matter" within our current system, or we may never find the proof. A bet that can't be settled is a bad bet.

  ---

  ### The Steelman: What is the strongest version of his position?

  If you want to respect your friend's intelligence while correcting him, here is the strongest version of his argument. It relies on **Logical Uncertainty**.

  In standard probability, if $A$ implies $B$, and you believe $A$ is 100% true, you *must* believe $B$ is 100% true.
  *   $A$ = "The axioms of arithmetic are true."
  *   $B$ = "Goldbach Conjecture is true."

  If Goldbach is actually true, it is a necessary consequence of the axioms. Therefore, in a perfect logical system, the probability is 1. By saying "90%," you are admitting that you are not treating this as a logical system, but as an empirical observation.

  **The Steelman Argument:**
  > "You aren't actually assigning a probability to the *truth* of the conjecture. You are assigning a probability to the event that *humans will find a proof or counterexample within a certain timeframe.* If you mean 'I bet we find a proof before we die,' that's a valid bet. But if you mean 'I bet the statement is true in the abstract,' you are confusing your current ignorance with a property of the statement. Since we can't calculate the logical consequence, we can't rigorously price that risk."

  **Why this is strong:** It points out that "90%" is hard to calibrate. If you bet on a coin flip, you know why it's 50% (physics/symmetry). If you bet on Goldbach, where does "90%" come from? It's a vibe. In rigorous decision theory, uncalibrated probabilities can lead to "Dutch Books" (sets of bets that guarantee you lose).

  ### How to bring this back to the team

  You don't need to use big words to win this. You just need to separate the **fact** from the **knowledge**.

  **Try saying this:**
  > "I think we're talking past each other. I agree that the conjecture is either true or false. I'm not saying the *universe* is 90% Goldbach. I'm saying that *given what I know right now*, I would value a ticket that pays \$100 if Goldbach is true at \$90.
  >
  > If you hide a coin under your hand, it's already heads or tails. But if I offer you even odds on guessing it, you'd take it. Are you saying that because the coin has already landed, it's 'meaningless' to bet on it? Or are you saying that because math isn't random, my confidence doesn't count? Because if it's the second one, that means you can't have a rational opinion on anything that hasn't been proven yet."

  **The "Checkmate" Question:**
  Ask him this:
  > "If a computer checked the first trillion numbers and they all worked, would you be *more* confident than if it only checked ten? If yes, then your confidence changes based on evidence. If your confidence changes, you are using probability. So why is it meaningless?"

  **Summary for you:**
  1.  **You are right:** It is perfectly rational to assign probabilities to mathematical conjectures based on evidence (heuristics, checked cases, related theorems). This is standard practice in analytic number theory.
  2.  **He is half-right:** Mathematically, the probability is 0 or 1. But that's the *answer*, not the *process* of guessing the answer.
  3.  **The Bet:** The only valid reason to reject the bet is if you can't agree on how to settle it (e.g., "What if it's unprovable?"). If you settle it as "True unless a counterexample is found by year 2100," the bet is valid.

  Your friend is hiding behind a technical definition of "truth" to avoid admitting that in the real world, we have to act on incomplete information. That's what betting *is*.
