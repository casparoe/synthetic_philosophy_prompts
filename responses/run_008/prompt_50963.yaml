          1.  Map the analogy (Clerk, Phrasebook, Procedure, Output, Outsider).
          2.  Identify critical *disanalogies* (specifically focusing on those bearing on *understanding*, not just capability).
          3.  Evaluate the conclusion (Is the "shallowness" claim about hard cases, all cases, or the mechanism? Can the phrasebook picture support it?).
      *   **Tone:** Intellectual, precise, nuanced, suitable for a well-informed general audience (like *The Atlantic*, *NYT Magazine*, *Aeon*).
