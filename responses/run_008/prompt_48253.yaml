  Dear Colleague, I have read through your colleague's argument with care, and I share your admiration for the elegance of its first half. It is tempting to accept the whole chain because the initial insights are so robust, yet your intuition that the conclusion proves too much is precisely correct. The step you must give up is step seven, the claim that constructions are answerable to taste and politics rather than to truth. This step looked fine because it relies on a deep-seated intuition that anything made by human hands is inherently subjective, contrasting the artificial with the natural and the constructed with the discovered. We are prone to thinking that if a historian imposes a plot or selects facts, the resulting narrative reflects the historian's mind more than the past itself, and therefore cannot be judged by the strictures of truth and falsehood that govern the natural world. This intuition gains further plausibility from the legitimate observation that political values often influence historical selection, making it seem as though politics replaces truth as the governing standard.

  However, rejecting this step is necessary because it commits a category error regarding what constructions can do. As you noted with the seismograph and the map, human beings construct models, traces, and representations constantly in the sciences, and yet we do not hesitate to say that a map can be wrong or a seismograph can be accurate. A map is a construction involving projection, scale, and selection, just as a historical narrative involves emplotment and emphasis, but we do not conclude from this that cartography is answerable only to taste. We expect a map to correspond to the terrain, and if it fails to do so, we call it false, not merely aesthetically displeasing. By rejecting step seven, you preserve the insights of steps one through five, acknowledging that history is shaped by the historian's choices, without conceding that those choices liberate the historian from the constraint of reality. This allows you to keep the teachings of Carr and Hayden White, who argued that history is a constructive dialogue between the historian and the facts, without accepting the radical skepticism that suggests the facts have no say in the matter. White insisted on the literary nature of history, but he did not necessarily argue that any plot is as valid as any other regardless of the evidence; rather, he showed that the form is imposed, not that the content is unmoored.

  The cost of rejecting step seven is that you lose the comfortable shield of relativism. If constructions are answerable to truth, then you cannot dismiss a rival historical account merely by pointing out its constructed nature or its political commitments. You must engage with the evidence and argue that one construction corresponds better to the past than another. It demands that you treat objectivity not as a state of pure neutrality which is indeed impossible, but as a regulative ideal where constructions are tested against the archive and against reality. It means admitting that while Ranke's ambition to show how it actually was may be asymptotically approachable rather than fully achievable, it is not incoherent. You must accept that some narratives are truer than others, even if all narratives are constructed. This places a heavier burden on your practice, requiring you to defend your selections and plots not just as compelling stories but as accurate representations, yet it saves history from collapsing into mere literature or propaganda. By holding fast to the idea that constructions can be true, you preserve the integrity of the discipline alongside geology and forensics, acknowledging that while we build the house of history, the ground on which it stands is not of our making.
