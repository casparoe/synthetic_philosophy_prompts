  1. "The setup"
  Two colleagues, Alex (Sophisticated) and Jordan (Naive), decide to learn a new skill via weekend workshops. Each session costs $100 drop-in, or $2,000 for an annual unlimited pass. Both know they struggle with consistency. Alex, anticipating future laziness, buys the annual pass immediately—a rational precommitment based on unit economics and self-knowledge. Jordan intends to go weekly but pays per session, admitting they might quit if it gets hard. A third colleague, Sam (Resolute), plans to go weekly without financial locks, relying on internal discipline. The goal is skill acquisition; the constraint is limited leisure time and energy. At the start, all three are equally motivated. The trap lies not in the price, but in how the cost structure interacts with changing motivation over the year.

  2. "How the three agents do"
  For the first two months, all three attend weekly. Then, a busy quarter at work hits. Here, the preference reversal engine kicks in: at Time 0 (setup), the cost of attending future classes felt distant and abstract, discounted heavily against the immediate benefit of securing a deal. At Time 1 (the busy quarter), the effort cost is immediate, while the skill benefit is distant. 

  Jordan (Naive) faces the $100 decision each week. When exhaustion hits, the immediate pain of spending $100 + effort outweighs the distant reward. Jordan stops going. Total spend: $800. Utility remains neutral; no debt, no guilt.

  Alex (Sophisticated) faces no marginal financial cost per class, but carries the sunk cost of $2,000. However, the precommitment transforms the hobby into an obligation. The pressure to "get value" from the pass adds psychological cost to the effort. Alex attends three more times under duress, hates the experience, then quits due to burnout. Total spend: $2,000. Alex ends up with the same skill level as Jordan but $1,200 poorer and higher stress.

  Sam (Resolute) maintains the habit without financial pressure, achieving the highest skill gain. But crucially, Alex does worse than Jordan. Alex's sophistication led to over-investment in a future self that didn't materialize, while Jordan's "weakness" acted as an adaptive circuit breaker, cutting losses when marginal utility turned negative.

  3. "What's doing the work"
  The structural feature is the **undervaluation of option value** caused by hyperbolic discounting at Time 0. When setting the commitment, the agent discounts the future pain of rigidity (being forced to attend when exhausted) more heavily than the immediate pleasure of securing a discount. The commitment device removes the "quit option." If you remove the ability to prepay (forcing pay-as-you-go), the Sophisticate reverts to the Naive strategy and avoids the loss. The failure isn't the commitment itself, but the mismatch between Time 0's smooth valuation of the year and Time 1's spiky reality of energy costs.

  4. "The precommitment defender's reply"
  A defender would argue this scenario mistakes *low-stakes hobbies* for *high-stakes goals*. Precommitment is designed for contexts where the Time 1 preference is reliably pathological (e.g., addiction, catastrophic debt), not merely fatigued. The lesson here isn't that commitment fails, but that it requires an audit of *exit conditions*. A sophisticated agent should have bought a refundable pass or set a milestone review. The failure was in the granularity of the commitment, not the strategy. Commitment devices are tools, not straitjackets; using a sledgehammer for a thumbtack doesn't prove hammers are useless.

  5. "Where this could fall apart"
  The weakest joint is assuming the Sophisticate couldn't anticipate the burnout risk. A truly sophisticated agent might model the probability of life interference and calculate the expected value of the pass accordingly. If Alex factored in a 50% chance of quitting, the pass might still be mathematically irrational at Time 0. The case relies on the Sophisticate making a calculation error regarding their own variance, which blurs the line between "structural failure of precommitment" and "bad math by the agent."
