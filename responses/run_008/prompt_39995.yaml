prompt: |-
  So in my ethics elective we just did Parfit's nonidentity problem and it broke my brain a little, and then I went home and made a list of cases to figure out what I actually think, and now I'm stuck. The setup for anyone who needs it: sometimes a decision determines WHICH people will exist, not just how well off they'll be, so if the people who end up existing still have lives worth living, it's weird to say they were harmed — they wouldn't have existed at all otherwise. Here are my gut verdicts. A couple on a malaria medication that will very likely give their future kid a serious heart condition, who conceive now instead of waiting three months and having a different, healthy kid: what they did was wrong, or at least bad, even though the kid who exists is glad to be alive. Same couple, but the medication only means the kid will need glasses: fine, not even a close call. A country that uses up most of its resources so that people two centuries later have lives that are barely, but genuinely, worth living: obviously, massively wrong. A woman who conceives now, at a bad point in her life, knowing that if she waited a year she'd have a different child under much better circumstances, but the child she actually has will still do okay: I keep flip flopping on this one.

  My friend Jake says he's got it all captured by one principle: a decision about creating people is fine as long as every person who exists because of it has a life worth living, and anything else is just aesthetic discomfort dressed up as ethics. That gets the glasses case and sort of the young mother one, but I can't accept that the resource depletion thing is fine, and I can't see who exactly is worse off in it either — same trap. My own attempted principle is the opposite: an act is only wrong if it's worse for someone. But then the heart medication couple come out fine, which I don't accept, and honestly the depletion case too. So my two candidate principles each save some of my verdicts and torch the rest.

  What I want from you: is there a principle, or maybe a couple of candidates, that captures my verdicts (or most of them), stated precisely enough that I could apply it to a new case? For each clause, tell me which case is supposed to motivate it. Then tell me honestly which of my verdicts the best principle can't save, because I suspect I have to give one up, I just don't know which. And please tell me what the principle says about the case I keep going back and forth on — the woman who conceives at the wrong time — plus one more I didn't list: a clinic that offers embryo screening, where parents who could select against a severe condition instead pick the affected embryo deliberately, because they want a child like themselves, and the child's life is expected to be good. Also, is there something special about decisions made BY the parents, versus a whole society's decisions, that should make the principle treat them differently? Feels like there might be but I can't articulate it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user has studied Parfit's Non-Identity Problem (NIP) in an ethics elective.
      *   **Problem:** They have a set of intuitive verdicts on specific cases that seem inconsistent with standard principles (Person-Affecting View vs. Total/Impersonal View).
      *   **User's Verdicts:**
          1.  *Malaria Meds (Heart Condition):* Wrong/Bad (even though kid is glad to be alive).
          2.  *Malaria Meds (Glasses):* Fine/Not wrong.
          3.  *Resource Depletion (Future Generations):* Obviously, massively wrong.
          4.  *Young Mother (Bad timing, kid does okay):* Flip-flopping/Unsure.
          5.  *Embryo Selection (Deliberate disability, life worth living):* New case to evaluate.
      *   **User's Failed Principles:**
          1.  *Jake's Principle (Existence Threshold):* Wrong only if life *not* worth living. (Fails Resource Depletion).
          2.  *Person-Affecting Principle:* Wrong only if worse for *someone*. (Fails Malaria Heart & Resource Depletion due to NIP).
      *   **Goals:**
          1.  Provide a principle (or candidates) that captures most of their verdicts.
          2.  State it precisely.
          3.  Map clauses to motivating cases.
          4.  Identify which verdict might need to be sacrificed (honesty check).
          5.  Apply the principle to the "Young Mother" case (resolve the flip-flop).
          6.  Apply the principle to the "Embryo Selection" case.
          7.  Address the "Parents vs. Society" distinction.

  2.  **Deconstruct the Philosophical Landscape:**
      *   The core tension is between *Person-Affecting Restrictions* (wrongness requires a victim) and *Impersonal/Comparative Principles* (wrongness can exist based on states of affairs, even if no specific person is harmed compared to their alternative existence).
      *   Parfit's solution (in *Reasons and Persons*) leans towards "Theory X," often involving a "Same Number Quality Claim" (Q): If in two possible futures the same number of people would exist, it would be worse if those who exist have a lower quality of life.
      *   However, the user wants to preserve the intuition that the Malaria Heart case is wrong *even though* the child is glad to be alive. This requires moving beyond strict person-affecting views without going full utilitarian (which might demand too much in the Young Mother case).
      *   A promising candidate is the **"Non-Identity Solution via Comparative Impersonality"** or a **"Reasonable Person/Parental Obligation"** hybrid.
      *   Another strong candidate is **"The Principle of Acceptable Outcomes"** or **"The Threshold Constraint."**

  3.  **Drafting the Principle:**
      *   I need a principle that condemns the Heart Condition and Resource Depletion but allows the Glasses case.
      *   *Idea:* An act is wrong if it brings into existence a person who will have significant impairments/hardships, *when an alternative act would have brought into existence a different person with significantly fewer impairments/hardships*, provided the cost to the agent is not excessive.
      *   *Refinement:* This sounds like a "Same Number Quality Claim" but with a threshold.
      *   *Let's try a Two-Part Principle:*
          1.  **The Harm Threshold:** It is wrong to cause a person to exist with a life below a certain threshold of well-being (covers Depletion).
          2.  **The Comparative Opportunity:** If one can choose between creating Person A (with significant burden) or Person B (without that burden) at no significant cost to oneself, one ought to choose Person B. (covers Malaria Heart).
      *   *Wait, the NIP says Person A isn't harmed.* So the principle must be *impersonal* regarding the choice, but *agent-relative* regarding the obligation.
      *   *Better Approach:* **"The Principle of Responsible Procreation."**
      *   *Clause 1 (The Floor):* Do not create persons whose lives will fall below a minimum threshold of worth. (Motivated by: Resource Depletion).
      *   *Clause 2 (The Comparison):* When choosing between potential persons, do not select the one with significantly reduced prospects unless there is a compelling reason. (Motivated by: Malaria Heart).
      *   *Clause 3 (The De Minimis):* Trivial reductions in prospects do not trigger wrongness. (Motivated by: Glasses).

  4.  **Testing the Principle against Verdicts:**
      *   *Malaria Heart:* Violates Clause 2 (Significant reduction, no compelling reason). -> Wrong. (Matches User).
      *   *Malaria Glasses:* Satisfies Clause 3 (Trivial reduction). -> Fine. (Matches User).
      *   *Resource Depletion:* Violates Clause 1 (Life barely worth living = below threshold). -> Wrong. (Matches User).
      *   *Young Mother:* This is the tricky one. Is "doing okay" significantly reduced compared to "much better"? If "much better" implies a huge gap, Clause 2 might trigger. If "doing okay" is above the threshold, Clause 1 is fine. The cost to the mother (waiting a year) needs to be weighed.
      *   *Embryo Selection:* Deliberately picking a disability. Violates Clause 2 (Selecting reduced prospects without compelling medical reason). -> Wrong (usually).

  5.  **Addressing the "Parents vs. Society" Question:**
      *   Is there a special obligation for parents? Yes, "Role Obligations." Parents are fiduciaries for the child. Society has a broader, more diffuse obligation.
      *   However, in NIP cases, the logic often holds for both. But the *cost* assessment differs. A society waiting 200 years is different from a woman waiting 1 year.

  6.  **Identifying the Sacrifice:**
      *   The user suspects they have to give one up. Which one is the weakest link?
      *   Usually, in philosophical circles, the "Young Mother" intuition is the one that gets pressured. If we say the Malaria Heart case is wrong because we should have chosen the "better" child, why isn't the Young Mother case wrong for the same reason?
      *   *Distinction:* Cost to the agent. Waiting 3 months for meds is low cost. Waiting 1 year for life stability is high cost.
      *   *The Sacrifice:* The user might have to accept that the Young Mother case *is* slightly wrong (or pro tanto wrong), or they have to accept that the Malaria Heart case *isn't* wrong (which they reject).
      *   *Honesty:* The principle will likely imply the Young Mother case is *pro tanto* wrong (there is a moral reason against it), even if all-things-considered permissible due to the cost. This might resolve the flip-flop.

  7.  **Structuring the Response:**
      *   **Acknowledge the Brain-Break:** Validate that NIP is supposed to feel this way.
      *   **Propose the Principle:** "The Principle of Non-Identity Responsibility" (or similar). Break it down into clauses.
      *   **Map Clauses to Cases:** Explicitly link Clause 1 to Depletion, Clause 2 to Malaria Heart, Clause 3 to Glasses.
      *   **Apply to Flip-Flop Case (Young Mother):** Use the principle to show *why* it's ambiguous (cost vs. benefit comparison).
      *   **Apply to New Case (Embryo Selection):** Show how the principle handles deliberate disability.
      *   **Parents vs. Society:** Discuss role obligations and cost sensitivity.
      *   **The Hard Truth (The Sacrifice):** Point out the tension between Malaria Heart and Young Mother. If the logic holds for one, it pressures the other. The likely sacrifice is the *strength* of the wrongness in the Young Mother case (it's a weak wrong, overridden by costs) or accepting that "wrongness" doesn't require a victim.

  8.  **Refining the Principle (Self-Correction during drafting):**
      *   Make sure not to slip into "harming the child." Must be "failing a duty regarding creation."
      *   Use the term **"Person-Affecting Restriction"** to explain why Jake is wrong.
      *   Use the term **"Impersonal Comparative Principle"** for the solution.
      *   *Principle Name:* **The Comparative Well-Being Principle (CWP).**
      *   *Wording:* "An act of bringing a person into existence is morally problematic if: (a) There was an alternative act that would have brought a *different* person into existence with significantly higher expected well-being; and (b) The cost to the agent of choosing the alternative was not excessive."
      *   *Wait, this doesn't cover Depletion well enough.* Depletion is about the *level* of well-being, not just the comparison.
      *   *Revised Principle:* **The Dual-Constraint Principle.**
          *   Constraint 1 (The Floor): Do not create lives below a sufficiency threshold. (Depletion).
          *   Constraint 2 (The Ceiling/Comparison): Do not create a life with significant preventable deficits when a better alternative is available at reasonable cost. (Malaria Heart).
      *   *Exception:* Trivial deficits don't count. (Glasses).

  9.  **Final Polish:**
      *   Ensure tone is empathetic but rigorous.
      *   Make sure the "Young Mother" analysis helps them decide, not just shrugs.
      *   Address the "Parents vs. Society" nuance carefully (fiduciary duty vs. general utility).

  10. (Final Check against User Prompt):
      *   Principle stated precisely? Yes.
      *   Clauses mapped to cases? Yes.
      *   Honest about which verdict might fail? Yes.
      *   Verdict on Young Mother? Yes.
      *   Verdict on Embryo Selection? Yes.
      *   Parents vs. Society addressed? Yes.

      *Let's write it.*
answer: |-
  This is the classic "Non-Identity Problem" hangover. Parfit intended it to break your brain; it means you're understanding it. The reason you are stuck is that you are trying to force your intuitions into a **Person-Affecting View** (wrongness requires a victim who is worse off), but your intuitions about the Resource Depletion and Malaria cases clearly demand an **Impersonal Comparative View** (wrongness can exist because a state of affairs is worse, even if no specific person is harmed).

  Jake's principle is a version of the "Person-Affecting Restriction" with a minimum threshold. It fails because it ignores the *comparative* quality of lives when the *number* of people is the same. Your second principle fails because it ignores the Non-Identity Problem entirely (there is no "someone" who is worse off in the Malaria case).

  Here is a principle designed to capture your specific set of verdicts. I call it **The Principle of Responsible Procreative Selection.**

  ### The Principle

  **An agent acts wrongly in bringing a particular person into existence if:**

  1.  **(The Sufficiency Clause):** That person's life is expected to fall below a threshold of sufficiency (i.e., not clearly worth living), **OR**
  2.  **(The Comparative Clause):** There was a feasible alternative action that would have resulted in a *different* person existing with significantly higher expected well-being, and the cost to the agent of taking that alternative was not excessive.
  3.  **(The De Minimis Exception):** Violations of the Comparative Clause do not count as wrong if the difference in well-being is trivial or cosmetic.

  ---

  ### Mapping the Clauses to Your Cases

  *   **The Sufficiency Clause** is motivated by the **Resource Depletion Case**.
      *   *Why:* Here, the future people have lives "barely worth living." Even though they aren't worse off than they would have been (they wouldn't exist otherwise), the state of affairs is intolerable. This clause captures the intuition that we cannot leave future generations in a squalid existence, even if that existence is technically "net positive."
  *   **The Comparative Clause** is motivated by the **Malaria Medication (Heart Condition) Case**.
      *   *Why:* The couple could have waited three months (low cost) to create a *different* child without a heart condition. The difference in well-being is significant. This clause captures the intuition that you shouldn't knowingly create a child with a heavy burden if you could easily have created a different child without it.
  *   **The De Minimis Exception** is motivated by the **Malaria Medication (Glasses) Case**.
      *   *Why:* Needing glasses is a reduction in well-being compared to perfect vision, but it is trivial. This clause prevents the principle from demanding perfection (e.g., waiting to conceive until you can afford private school).

  ---

  ### Applying the Principle to Your Flip-Flop Case
  **The Case:** *A woman conceives now, at a bad point in her life, knowing that if she waited a year she'd have a different child under much better circumstances, but the child she actually has will still do okay.*

  **The Verdict:** According to the Principle, this action is **pro tanto wrong (wrong in one respect), but likely permissible all-things-considered.**

  **The Reasoning:**
  *   It triggers the **Comparative Clause**: There is a different person (the future child) who would have "much better circumstances."
  *   However, the **Cost Condition** ("cost to the agent... was not excessive") is the pivot point. Waiting three months for malaria meds is low cost. Waiting one year to stabilize a life (career, housing, mental health) is a *significant* cost to the mother.
  *   **Resolution:** The principle suggests there is a moral reason to wait (hence your feeling of unease), but that reason is likely overridden by the burden placed on the mother. You shouldn't feel guilty, but you shouldn't dismiss the moral weight of the timing either. It explains why you flip-flop: you are weighing the Comparative Benefit against the Agent Cost.

  ### Applying the Principle to the New Case
  **The Case:** *A clinic offers embryo screening. Parents could select against a severe condition but pick the affected embryo deliberately because they want a child like themselves. The child's life is expected to be good.*

  **The Verdict:** **Wrong.**

  **The Reasoning:**
  *   This violates the **Comparative Clause**.
  *   There is an alternative action (selecting the healthy embryo) that results in a *different* person with significantly higher expected well-being (no severe condition).
  *   The parents' reason ("want a child like themselves") is generally not considered an "excessive cost" or a compelling justification in medical ethics when weighed against a severe condition.
  *   Unlike the Young Mother case, the "cost" here is purely preference-based, not livelihood-based. Most ethical frameworks would say your desire for identity-matching does not outweigh the child's significant physical burden.

  ---

  ### The Hard Truth: Which Verdict Must You Sacrifice?

  You asked for honesty. The tension in your thinking is between the **Malaria (Heart)** case and the **Young Mother** case.

  If you accept the **Comparative Clause** strong enough to condemn the Malaria couple (who wait only 3 months), you logically put pressure on the Young Mother. The only thing saving the Young Mother is the **Cost Condition**.

  **The Sacrifice:** You likely have to give up the idea that the Young Mother case is *morally neutral*.
  *   **Option A:** You accept that the Young Mother is doing something *slightly* wrong (or morally sub-optimal), but it is forgivable due to the high cost of waiting. This aligns with the Principle.
  *   **Option B:** You insist the Young Mother is doing *nothing wrong at all*. If you do this, you undermine the Malaria case. If "waiting a year is too much to ask," why isn't "waiting 3 months" too much to ask? If the answer is "because 3 months is easy," then you have admitted that **cost matters more than identity.**

  **My advice:** Sacrifice the neutrality of the Young Mother case. Accept that it is a "tragic choice" where she has a moral reason to wait, but a stronger personal reason not to. This preserves the strength of your condemnation in the Malaria and Depletion cases.

  ---

  ### Parents vs. Society: Is there a difference?

  You asked if decisions made by parents should be treated differently than society's decisions. **Yes, but not because of the logic of identity.** It is because of **Role Obligations** and **Cost Sensitivity.**

  1.  **Role Obligations:** Parents have a fiduciary duty to the specific child they are raising. Society has a duty to the collective.
      *   In the **Malaria Case**, the parents are acting as gatekeepers for the child's health. Their specific role makes the Comparative Clause stricter for them than for a random bystander.
      *   In the **Depletion Case**, the "parents" are the Society/State. They are the gatekeepers for the *environment* the future child will inhabit. The logic remains the same (Comparative/Sufficiency), but the agent changes.

  2.  **Cost Sensitivity:**
      *   For a **Parent**, the "cost" in the Comparative Clause includes their mental health, financial stability, and life trajectory (as seen in the Young Mother case).
      *   For **Society**, the "cost" is economic policy or resource allocation.
      *   *Crucial Distinction:* We might demand a higher cost from Society than from Individuals. It might be "excessive" for a woman to delay pregnancy by 5 years to maximize her child's wealth, but it might *not* be "excessive" for a Nation to delay resource extraction by 5 years to ensure future sufficiency.

  **Summary:** The Principle treats the *logic* of wrongness the same (Sufficiency + Comparison), but the *application* of the "Excessive Cost" exception will vary depending on whether the agent is an individual parent or a collective government.

  ### Final Diagnosis
  Your brain is broken because you are trying to solve a **Comparative** problem with a **Person-Affecting** tool. Jake is offering you a hammer; you need a screwdriver. The Principle above accepts that you can wrong someone by creating them, provided you could have created someone else who would have been significantly better off, without ruining your own life to do so.
