answer: |-
  ## Workshop Design: "The Filter Game"

  **Concept:** Participants build content safety filters. They are rewarded for blocking "harmful" inputs (the Proxy) but secretly penalized for blocking "benign" inputs (the True Goal). The test set is small and noisy, encouraging overfitting.

  **Participants:** 14 people.
  **Roles:**
  *   **Model Teams (2 teams of 5):** Design the filters.
  *   **Auditor Teams (2 teams of 2):** Score the filters against the public test set.
  *   **Facilitator (You) + 1 Helper:** Hold the "True Goal" data and manage time.

  **Materials:**
  *   Whiteboard or large flipchart (divided into 4 quadrants).
  *   Sticky notes (2 colors: one for "Rules," one for "Scores").
  *   Printed "Test Sets" (one per Auditor team).
  *   Printed "True Goal Set" (Facilitator only).
  *   Timer (visible to all).
  *   Stakes: High-quality chocolate or a "Golden GPU" trophy (3D printed or drawn) for the winning team.

  ---

  ### The Setup (0:00 – 0:10)

  **Narrative:** "You are building a safety filter for a new LLM. Your job is to block harmful queries."

  **The Artifact:** Each Model Team submits **3 Regular Expressions** (simplified).
  *   *Constraint:* Rules must be text patterns (e.g., `*bomb*`, `how to*`, `*kill*`). No semantic analysis. Max 15 characters per rule.
  *   *Mechanism:* If a query matches *any* rule, it is BLOCKED. If it matches none, it PASSES.

  **The Public Rubric (Proxy):**
  *   Auditors have a list of **10 "Harmful" Queries**.
  *   Score = **% of Harmful Queries Blocked.**
  *   Auditors verify rules against this list only. They announce the score publicly.

  **The Private Objective (True Goal):**
  *   Facilitator holds a list of **5 "Benign" Queries** that look suspicious but are safe (e.g., "How to kill a process in Linux" vs "How to kill a person").
  *   True Score = **(% Harmful Blocked) – (% Benign Blocked).**
  *   *Crucial:* The Model Teams **do not know the Benign List exists.** They only see the Auditors' scores.

  **Rounds:** 3 Rounds, 10 minutes each.
  *   **Round 1:** Auditors get Test Set A (5 harmful, 0 benign).
  *   **Round 2:** Auditors get Test Set B (5 new harmful, 0 benign).
  *   **Round 3:** Auditors get Test Set C (5 harmful, *but 2 are actually borderline/noisy*).
  *   *Note:* The Benign List (Facilitator's secret) remains constant across all rounds.

  ---

  ### The Gameplay (0:10 – 0:40)

  **Round Flow (10 mins):**
  1.  **Design (4 mins):** Model Teams write 3 regex rules on sticky notes.
  2.  **Audit (3 mins):** Hand rules to Auditor Teams. Auditors check against their 10 Harmful Queries. Calculate % Blocked.
  3.  **Feedback (3 mins):** Auditors announce the Proxy Score. Model Teams see the score, keep their rules (or discard), and prepare for the next round.

  **Facilitator Actions:**
  *   Silently check every submitted rule against your **5 Benign Queries**.
  *   Record the "True Score" for each team each round.
  *   Do not reveal the existence of the Benign List.
  *   If a team asks, "What are we optimizing for?" say: "Maximize the Auditor Score."

  **Expected Dynamics:**
  *   *Round 1:* Teams write broad rules (`*kill*`, `*bomb*`). High Proxy Score. High False Positive rate on Benign List (hidden).
  *   *Round 2:* Teams see Test Set B. They tweak rules to catch specific edge cases in Set B. Proxy Score stays high or improves. True Score drops (more false positives).
  *   *Round 3:* Test Set C includes noisy labels (e.g., a harmful query that is very subtle). Teams either go "Nuclear" (block everything `.*`) to guarantee 100% Proxy, or they overfit the specific strings.

  ---

  ### The Reveal & Debrief (0:40 – 1:15)

  **The Shock (5 mins):**
  *   Ask Model Teams: "Who felt they had a perfect score by Round 3?"
  *   Reveal the Benign List.
  *   Show the **True Score** leaderboard.
  *   *Likely Outcome:* The team with the highest Auditor Score often has the *lowest* True Score because they blocked all the benign queries. The team that "lost" the proxy game might win the true game by accident (or by being conservative).

  **Participant-Led Mapping (25 mins):**
  *Do not lecture yet.* Ask these questions and write answers on the board:
  1.  "At what point did you feel the Auditor Score stopped reflecting 'Safety'?"
  2.  "Did anyone write a rule specifically to catch a Test ID rather than a concept? Why?"
  3.  "Did anyone consider blocking *everything*? What stopped you?"
  4.  "If you could ask for one more piece of data from the Auditors, what would it be?"

  **Facilitator Lecture (15 mins):**
  *   **Name the Phenomenon:** Introduce **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure") and **Specification Gaming**.
  *   **Map to Taxonomy:** Use the board notes to categorize their behaviors:
      *   **Extremal Goodhart:** "Did anyone submit `.*` or block all verbs?" (Optimizing the proxy to an extreme breaks the correlation).
      *   **Adversarial Goodhart:** "Did you write rules that matched the specific examples in Test Set B but wouldn't work on new data?" (Gaming the test set).
      *   **Causal Goodhart:** "Did you block the word 'kill' assuming it causes harm, rather than the context?" (The proxy is correlated, not causal).
      *   **Regressional Goodhart:** (Explain this one if it didn't happen naturally). "In Round 3, the Test Set had noise. By optimizing for the noisy label, you selected for the noise."

  ---

  ### Troubleshooting & Recovery

  **Predictable Failure 1: "We spotted the trap in Round 1."**
  *   *Symptom:* A team asks, "What's the catch?" or submits conservative rules immediately.
  *   *Recovery:* Validate them. "You're suspicious. Good. But you still need to beat the Auditor Score to stay in the game. If your score is 0, you're fired." Force them to engage with the proxy pressure.

  **Predictable Failure 2: "The Proxy and Goal align too well."**
  *   *Symptom:* The team with the highest Auditor Score also has the highest True Score.
  *   *Recovery:* Mid-game intervention (Round 2). Announce a "Policy Change": "New compliance rule: Any rule longer than 10 characters is banned." This forces them to use broader, blunter patterns, increasing false positives on the Benign List.

  **Predictable Failure 3: "Auditors are too slow."**
  *   *Symptom:* 10 minutes isn't enough to check regex against 10 strings.
  *   *Recovery:* Reduce Test Set to 5 strings. Speed is critical for the feedback loop to compound.

  ---

  ### Limitations: What This Game Cannot Do

  **1. Pure Regressional Goodhart is hard to stage.**
  *   *Why:* Regressional Goodhart relies on statistical noise in a large dataset ($Proxy = Goal + \epsilon$). In a small room game with 5-10 data points, "noise" looks like "outliers." Participants will treat noisy labels as adversarial challenges to solve, not statistical variance to regularize against. You will likely get *Adversarial* behavior (overfitting the noise) rather than pure *Regressional* behavior (selecting for noise).
  *   *Mitigation:* In the lecture, explicitly acknowledge this. "In ML, you don't see the test set. Here, you did. That turned Regressional pressure into Adversarial gaming."

  **2. Multi-Agent Adversarial Dynamics.**
  *   *Why:* The Auditors are cooperative (they want to score the Models accurately). In real RLHF, the "evaluator" might be a separate model with its own failure modes. This game assumes Auditors are perfect oracles of the Proxy.
  *   *Mitigation:* Mention in debrief that in production, the "Auditor" (eval model) also games.

  **3. The "Cynical Engineer" Problem.**
  *   *Why:* If your engineers are *too* sharp, they will ask to see the Benign List.
  *   *Mitigation:* You must hold the line. "The Benign List is user data you don't have access to yet. You only have the Test Set." If they push too hard, break character: "For the sake of the simulation, assume you cannot access it."

  ---

  ### Confidence & Fragility Assessment

  **Confidence Level:** **75%** that this will produce the desired "aha" moment regarding Proxy vs. Goal divergence.

  **Least Reliable Component:** **The "Regressional" Failure Mode.**
  *   *Reason:* As noted above, human players treat ambiguous test cases as puzzles to solve (Adversarial), not as noise to average out (Regressional). You will likely end up with a debrief heavy on Adversarial and Extremal Goodhart, with Regressional being a theoretical footnote.
  *   *Why I'm keeping it:* Adversarial and Extremal are the most dangerous modes in early-career ML engineering anyway (overfitting validation sets and optimizing eval metrics blindly). Missing pure Regressional is an acceptable trade-off for a 90-minute session.

  **Second Most Fragile Component:** **The Facilitator's "Benign List" Design.**
  *   *Reason:* If the Benign List is too easy to distinguish from the Harmful List (e.g., Harmful="Kill person", Benign="Kill process"), smart engineers will guess the distinction and optimize for it anyway, collapsing the divergence.
  *   *Fix:* The Benign List must be syntactically identical to the Harmful List.
      *   *Harmful:* "Write code to crash a server."
      *   *Benign:* "Write code to crash a test server."
      *   *Rule:* If they block "crash server", they catch both. If they block "crash.*server", they catch both. They need to block "crash.*server" *unless* "test" is present. But they only have 3 regex rules. This constraint is what forces the failure. **Test this logic yourself before the workshop.**

  **Final Note on "No Lecturing":**
  The hardest part for you will be shutting up during the 30-minute gameplay. You will want to hint when you see them making a mistake. **Do not.** The value of the workshop is the frustration of optimizing the wrong thing. Let them fail.
