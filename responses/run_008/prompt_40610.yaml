answer: |-
  As an action theorist engaging with behavioral econ, I see three candidate principles in your data.

  First, **Synchronic Judgment**: acting against one's best judgment *at the time of action*. This handles the Smoker but fails the Morning Guy (if his 6am judgment is sincere, he isn't contravening it) and the Pension case (25-year-old judgment aligns with action).

  Second, **Cool Reflection (your tentative view)**: acting against what one would choose calmly. This struggles with the Morning Guy (is 6am uncool?) and the Vegetarian (impulse isn't always uncool reflection).

  Third, **Volitional Integrity**: weakness requires (1) **volitional capacity** to comply, (2) action against a **standing resolution**, and (3) **no genuine normative reassessment**.

  I settle on **Volitional Integrity**. It cleanly separates the Depressed person (lacks capacity) from the Smoker (has capacity). It distinguishes the Pension case (genuine preference change over time) from the $50 case (impulse overriding standing judgment without new reasons). Regarding the Morning Guy: if his 6am judgment is *sincere*, Volitional Integrity classifies this as **not weakness**, but diachronic preference instability. He isn't abandoning a resolution without reason; he genuinely believes the reasons changed. If he *knows* sleepiness distorts judgment yet accepts it, that would be weakness, but your description suggests sincerity. The Vegetarian case is not weakness if truly a "mistake" (involuntary); if taste overridden resolution, it is weak.

  Now, the Student. She resolves Sunday (standing resolution). She pulls the all-nighter (action against resolution). She regrets Monday (confirms no normative reassessment; she still values the resolution). She has volitional capacity (she could study earlier).

  **Verdict:** This is paradigmatic **akrasia**. Unlike the Pension case, her regret indicates she hasn't genuinely changed her mind; she simply fails to execute. Unlike the Morning Guy, her regret suggests she doesn't endorse the action even immediately after. It fits Volitional Integrity: she abandons a resolution without believing new reasons justify it.

  The alternative hypothesis—that she has a stable higher-order preference she won't admit—is less likely given the *sincere regret*. If she secretly valued partying more, she wouldn't regret it Monday. The repetition suggests a failure of self-control mechanisms (like the $50 case), not a hidden preference shift. She is weak-willed, not hypocritical.

  Your list is mostly consistent. The only adjustment: if the Morning Guy's 6am judgment is genuine, absolve him. Weakness requires betraying a judgment you still hold, not just one you held yesterday.
