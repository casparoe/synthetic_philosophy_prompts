answer: |-
  Here is a construction of the desiderata for an account of natural kinds, derived from the cases you provided and the constraints of industrial and scientific practice.

  ### The Desiderata

  **1. Inductive Security (Projectibility)**
  *   **Requirement:** Membership in a kind must license expectations about unobserved properties or behaviors. If I put a material in Bin A, I must be able to predict its melt flow, toxicity, or reactivity better than chance.
  *   **Case:** If "polymer" were not a natural kind, testing one batch of polyethylene would tell you nothing about the next.
  *   **Status:** **Non-negotiable.** Without this, classification is merely cataloging, not science.

  **2. Explanatory Contextuality**
  *   **Requirement:** The account must allow a set of entities to be a natural kind relative to one causal inquiry and not another, without accusing one inquiry of error.
  *   **Case:** **Isotopes.** To a synthetic chemist, C-12 and C-13 are the same kind (same valence, same bonding). To a nuclear physicist, they are distinct kinds (different stability, different mass). An account that forces a single "True" carbon kind fails here.
  *   **Status:** **Non-negotiable.** Your experience confirms that "sameness" is always "sameness with respect to a specific interaction."

  **3. The Revision Distinction (Discovery vs. Stipulation)**
  *   **Requirement:** The account must distinguish between a reclassification driven by the discovery of a new causal structure and a reclassification driven by administrative or pragmatic convenience.
  *   **Case:** **Quasicrystals vs. Pluto.** The crystallographers changed the definition of "crystal" because diffraction patterns revealed a structure that violated the old translation-symmetry rule but possessed a new long-range order. Nature forced the hand. The astronomers demoted Pluto because the "clearing the neighborhood" criterion was a pragmatic line drawn to limit the number of planets, not because Pluto's intrinsic geology changed overnight.
  *   **Status:** **Non-negotiable.** If an account treats these two changes as identical operations, it loses the distinction between *finding* and *deciding*.

  **4. Cross-Cutting Tolerance**
  *   **Requirement:** The account must accommodate kinds that are unified by function, history, or macroscopic property despite microscopic heterogeneity.
  *   **Case:** **Jade.** It is two distinct mineral species (jadeite and nephrite) unified by toughness and cultural use. **Clay.** Defined partly by grain size (a convention) and partly by mineralogy. **Keystone Species.** Defined by ecological role, not phylogeny.
  *   **Status:** **Non-negotiable.** If the account rules these out as "not real kinds," it is irrelevant to biology, geology, and engineering.

  **5. The Instrumentation/Practice Tension**
  *   **Requirement:** (A) Kind boundaries should not shift merely because measurement precision improves (Stability). (B) The account must defer to scientific practice, which *does* shift boundaries when measurement improves (Deference).
  *   **Case:** When mass spectrometry improved, we could distinguish isotopes. Did the kind "Carbon" split? Or did we just see the old split more clearly? When you identified a tacticity change, was it a new material or a defect? The instruments decided.
  *   **Status:** **Jointly Unsatisfiable (in strong forms).** See Verdict below.

  ***

  ### The Verdict on the Tension

  You asked for a plain verdict on Requirements 5A (Stability) and 5B (Deference).

  **They are logically incompatible if taken literally.**

  If you demand that kind boundaries be *indifferent* to instrumentation (5A), you must reject the actual history of science, where better instruments routinely split kinds (e.g., the splitting of "Rare Earths" in the 19th century, or the distinction between isomers once spectroscopy arrived). If you defer *entirely* to practice (5B), you accept that kinds are ephemeral, shifting with every calibration of a spectrometer, which undermines Inductive Security (Req 1).

  **The Resolution:**
  The tension dissolves only if you distinguish between **Ontological Grounding** and **Operational Criteria**.

  1.  **Ontological Grounding (Stable):** The causal structures that make induction possible (e.g., electron configuration, lattice energy) do not change when instruments improve.
  2.  **Operational Criteria (Mutable):** The *markers* scientists use to identify those structures (e.g., melting point range, specific diffraction peaks) *must* change when instruments improve.

  **The Verdict:** Requirement 5A is a **Metaphysical Prejudice**. It assumes we have access to boundaries independent of our means of detection. Requirement 5B is an **Epistemic Non-negotiable**. We cannot know kinds except through practice.

  Therefore, an adequate account must reject 5A. It must admit that **kind boundaries are sensitive to instrumentation,** *but only insofar as the instrumentation reveals previously inaccessible causal mechanisms.* If a better spectrometer merely measures the *same* property more precisely, the kind stays. If it reveals a *new* causal variable that breaks the inductive pattern (e.g., tacticity affecting crystallinity), the kind *should* split.

  The difference between the Quasicrystal case and the Pluto case is not that one is "nature" and one is "convenience." It is that the Quasicrystal reclassification preserved **Inductive Security** (the new definition captured a unified structural cause), whereas the Pluto reclassification sacrificed Inductive Security for **Cataloging Convenience** (to keep the list of planets manageable).

  ***

  ### Scorecard of Existing Accounts

  Here is how the major contenders fare against your specific desiderata.

  **1. Classical Essentialism (Lockean/Kripkean)**
  *   *Thesis:* Kinds are defined by necessary and sufficient intrinsic properties (microstructural essences).
  *   *Performance:*
      *   **Fails Contextuality:** Cannot explain why Isotopes are one kind for chemists and two for physicists without calling one group wrong.
      *   **Fails Cross-Cutting:** Cannot accommodate Jade or Functional Kinds (no single micro-essence).
      *   **Passes Stability:** Excellent at maintaining boundaries.
  *   *Eliminated by:* **Req 2 (Contextuality)** and **Req 4 (Cross-Cutting).**

  **2. Homeostatic Property Cluster (HPC)**
  *   *Thesis:* Kinds are clusters of properties held together by underlying causal mechanisms (homeostasis), allowing for some variation.
  *   *Performance:*
      *   **Passes Cross-Cutting:** Handles Species and Jade well (unified by mechanism or function, not strict identity).
      *   **Passes Projectibility:** Designed specifically to support induction.
      *   **Struggles with Stability:** Boundaries are fuzzy. When does a cluster break? It relies on judgment.
      *   **Passes Revision Distinction:** Can model the Quasicrystal shift as discovering a new homeostatic mechanism.
  *   *Eliminated by:* None strictly, but it requires modification to handle **Req 2 (Contextuality)** explicitly. Standard HPC often assumes a "God's eye" view of the cluster.

  **3. Deflationary / Pragmatic Accounts**
  *   *Thesis:* Kinds are merely tools for human organization; there are no "joints" in nature independent of our interests.
  *   *Performance:*
      *   **Passes Contextuality:** Embraces it fully.
      *   **Passes Deference:** Defers entirely to practice.
      *   **Fails Stability:** Makes kinds too volatile. If the interest changes, the kind vanishes.
      *   **Fails Revision Distinction:** Struggles to explain why the Quasicrystal change felt *forced* while Pluto felt *chosen*. If all is pragmatic, both are choices.
  *   *Eliminated by:* **Req 3 (Revision Distinction).** It cannot account for the *resistance* nature offers to our classification.

  ***

  ### The Eliminator

  The single requirement that does the most work in eliminating candidates is **Req 3: The Revision Distinction.**

  *   **Essentialism** fails it because it cannot explain why we ever change definitions (essences are eternal).
  *   **Deflationism** fails it because it cannot explain why some changes feel mandatory (nature forcing us).
  *   **HPC (modified)** survives it, provided it acknowledges that the "homeostatic mechanisms" are only visible through specific instrumental contexts.

  ### Best Current Construction: Contextual Realism

  Based on your constraints, the only viable model is a **Contextual Realist** view (a hybrid of HPC and Perspectival Realism).

  1.  **Kinds are Real:** There are causal structures in the world (tacticity, lattice packing) that exist independently of us. This satisfies the intuition behind **Stability**.
  2.  **Kinds are Relative:** A set of entities constitutes a kind *only relative to a specific causal field of inquiry*. Carbon is a kind relative to chemistry; Isotopes are kinds relative to nuclear physics. This satisfies **Contextuality**.
  3.  **Instruments are Constitutive:** Instruments are not just passive viewers; they are the means by which the causal field is accessed. When an instrument reveals a new causal variable (like quasicrystalline order) that disrupts induction, the kind *must* change. This satisfies **Deference** while rejecting the strong version of **Stability**.
  4.  **The Test:** The difference between Quasicrystals (Nature) and Pluto (Convention) is **Inductive Risk**.
      *   If keeping the old definition ("Crystals must have translational symmetry") prevents you from predicting diffraction patterns, Nature forced the change.
      *   If keeping the old definition ("Planets clear their orbit") does not prevent you from predicting orbital mechanics, but merely clutters a list, Convention forced the change.

  **Summary for your reading:**
  Demand an account that treats natural kinds as **stable causal structures** that are **only accessible via instrumental practices**. Reject any account that claims kinds are *purely* mind-independent (Essentialism) or *purely* mind-dependent (Deflationism). The "joint" is in the world; the "carving" is in the lab. If the philosophy you read cannot distinguish between a spectrometer revealing a new joint and a committee drawing a new line, put the book down.
