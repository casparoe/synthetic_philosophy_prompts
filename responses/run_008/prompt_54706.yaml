prompt: |-
  I've recently taken over teaching duties for the future-generations unit of an upper-level bioethics seminar — fourteen students, a single ninety-minute slot — and I'd like your help designing the session's centrepiece activity. My own interest in this material has just become rather personal: a close friend is deciding whether to attempt conception whilst taking a medication that raises the risk of birth defects, and working through the ethics of that with her has made me realise how differently the nonidentity problem lands when you meet it as a decision rather than as a puzzle. My students, by contrast, treat it as a debating-game: they can recite the move — the depletion policy changes who exists, the people who exist under it have lives worth living, so on a counterfactual account nobody is harmed — without ever feeling its bite. The session follows two weeks on Parfit, so they know the territory; what I want is for the problem to happen to them before anyone names it.

  Concretely, I'd like a role-play in which the class forms a deliberative committee for a fictional island republic choosing between a conservation policy and a rapid-depletion policy (the depletion path yields a short resource boom, after which everyone is permanently poorer, but — crucially — the two policies lead to different people existing a few generations on, all of whose lives remain worth living). I want each student to receive a role card for a named future person, with the following distribution built in: most cards describe people who exist only under one policy or the other, with the depletion-born characters leading recognisably worse but still decent lives; a few cards describe people who exist under both policies and are harmed by depletion in the ordinary identity-preserving way; and — this is the wrinkle I most want you to keep — at least two characters who exist under both policies and are materially better off under depletion because their families captured the boom. The committee must reach a verdict, and I'd like a second round in which the same committee confronts a policy that harms only identity-affecting parties, so the students feel the contrast between the two kinds of case by bumping into it rather than by being told.

  Please give me the full runnable package: materials and preparation, a timeline for the ninety minutes, rules for deliberation (including what information is common knowledge and what stays on the cards), and a debrief that maps specific moments in the session onto the philosophy — the counterfactual account of harm, the person-affecting intuition, the way the "better-off under depletion" characters complicate any simple appeal to harm, and how the students' own objections, pressed hard, will have trouble identifying a victim. I'd also like your honest assessment of what the activity cannot reproduce (I suspect the temporality is the problem: nobody's existence is actually made contingent by the vote, and I suspect some students will see through that) and practical advice on the two failure modes I anticipate: students abandoning their characters to philosophise at the table, and the vote simply descending into a utilitarian headcount of the role cards. If you can suggest a payoff or stake structure that keeps the deliberation honest without real money — even something as simple as the facilitator's later report card determining whose character's descendants "get written into" the epilogue — I'd welcome that too.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level bioethics seminar, 14 students, 90 minutes.
      *   **Topic:** The Non-Identity Problem (Parfit), specifically moving from abstract puzzle to lived decision.
      *   **Instructor's Motivation:** Personal connection (friend's pregnancy/medication decision), wants students to *feel* the problem, not just debate it.
      *   **Current Student State:** Know the theory (Parfit), treat it as a "debating game," can recite the moves without feeling the "bite."
      *   **Desired Activity:** Role-play deliberative committee for a fictional island republic.
      *   **Policy Options:** Conservation (stable future) vs. Rapid-Depletion (short boom, long-term poverty, different people exist later).
      *   **Role Card Distribution:**
          *   Most: Exist only under one policy (Identity-Affecting). Depletion-born have worse but "worth living" lives.
          *   Few: Exist under both, harmed by depletion (Identity-Preserving Harm).
          *   Wrinkle: At least two exist under both, *better off* under depletion (captured the boom).
      *   **Structure:** Two rounds (Round 1: Mixed harm/identity; Round 2: Purely identity-affecting).
      *   **Deliverables:** Full runnable package (materials, prep, timeline, rules, debrief), honest assessment of limitations, advice on failure modes (philosophizing instead of role-playing, utilitarian headcount), stake structure (no real money).

  2.  **Deconstruct the Challenge:**
      *   *The Core Tension:* How to make abstract future people feel real enough to generate moral stress, without the simulation collapsing into "we know this is fake."
      *   *The Non-Identity Trap:* Students usually solve this by saying "It's wrong because it makes people worse off." The goal is to block that move for the identity-affecting characters.
      *   *The "Better Off" Wrinkle:* This is crucial. It prevents a simple "Depletion = Bad" consensus. It introduces envy and complexity.
      *   *Time Management:* 90 minutes is tight for a two-round role-play + debrief. Needs strict facilitation.
      *   *Failure Modes:*
          1.  *Meta-Gaming:* Students dropping character to discuss Parfit.
          2.  *Utilitarian Calc:* Just counting happy vs. sad cards.
          3.  *Cynicism:* "None of these people exist, so who cares?"

  3.  **Drafting the Activity Design:**

      *   **Setting:** "Insula Aeterna" (sounds suitably fictional but serious).
      *   **Committee:** The "Charter Council."
      *   **Round 1 (The Mixed Case):** Policy A (Conservation) vs. Policy B (Depletion).
          *   *Roles:* Need 14 cards.
          *   *Distribution:*
              *   Group X (Exist only if Conservation): 5 students. Good lives.
              *   Group Y (Exist only if Depletion): 5 students. Harder lives, but > 0.
              *   Group Z (Exist Both, Harmed): 2 students. (e.g., current generation's grandchildren).
              *   Group W (Exist Both, Benefited): 2 students. (e.g., resource barons' kids).
      *   **Round 2 (The Pure Non-Identity Case):** Policy C (Strict Contraception/Timing) vs. Policy D (Free Conception). *Wait, the prompt asks for a policy that harms only identity-affecting parties.* Let's refine.
          *   *Idea:* A policy that shifts the timeline slightly.
          *   *Scenario:* "The Seismic Shift." Building a dam now vs. later.
          *   *Roles:* Everyone gets *new* cards. All are identity-affecting. One policy leads to lives worth living, the other to lives *still* worth living but significantly harder. No identity-preserving victims.
      *   **Stakes:** The "Archivist's Ledger." The instructor plays the Archivist. The decisions determine which characters get a "legacy entry." This appeals to the desire for significance without needing money.

  4.  **Developing the Materials:**
      *   *Role Cards:* Need specific names, backgrounds, and *secret* knowledge (which policy allows their birth).
      *   *Public Info:* The economic/environmental outcomes of the policies.
      *   *Private Info:* "I am the grandchild of..." or "My conception depends on..."

  5.  **Refining the Timeline (90 Mins):**
      *   0-10: Intro & Setup (Setting the scene, distributing cards).
      *   10-35: Round 1 Deliberation & Vote.
      *   35-45: Transition & Card Swap (Round 2 Setup).
      *   45-70: Round 2 Deliberation & Vote.
      *   70-90: Debrief (The most important part).

  6.  **Addressing the "Better Off" Wrinkle:**
      *   These two students (Group W) are the key to preventing a easy moral consensus. They will argue *for* depletion. This forces the "Conservation" group to argue against them without being able to say "You are harming specific people" (for the identity-affecting group).

  7.  **Addressing Failure Modes:**
      *   *Philosophizing:* Rule: "Speak only as your character. No mention of philosophers or 'cases'." Penalty: Loss of voting weight.
      *   *Utilitarian Headcount:* The "Archivist" mechanic helps here. It's not about total utility, it's about *whose story gets told*. Also, the debrief will highlight why the headcount failed to capture the intuition.
      *   *Temporality/Cynicism:* Acknowledge it in the debrief. The "feel" comes from the *commitment* to the role, not the ontology.

  8.  **Drafting the Debrief:**
      *   Map specific arguments heard to Parfit's concepts.
      *   Highlight the frustration of the "Conservation" group (Who is the victim?).
      *   Highlight the confidence of the "Benefited" group.
      *   Connect back to the friend/medication scenario (the instructor's personal hook).

  9.  **Review against Constraints:**
      *   14 students? Yes, role cards designed for 14.
      *   90 minutes? Yes, timeline is tight but workable.
      *   Two rounds? Yes.
      *   Specific card distribution? Yes (Identity-affecting, Identity-preserving harmed, Identity-preserving benefited).
      *   Stake structure? Yes (The Archivist's Ledger).
      *   Honest assessment? Yes, included in the "Limitations" section.

  10. **Refining the Tone:**
      *   Needs to be professional, pedagogical, yet empathetic to the instructor's personal stake.
      *   Clear instructions.
      *   Philosophical precision (don't muddle Non-Identity with standard harm).

  11. **Self-Correction/Polish during drafting:**
      *   *Critique:* Round 2 might feel redundant if not distinct enough.
      *   *Fix:* Make Round 2 explicitly about a policy where *no one* is identity-preserving harmed. In Round 1, the 4 identity-preserving students (2 harmed, 2 benefited) can use standard harm arguments. In Round 2, *everyone* is non-identical. This sharpens the contrast.
      *   *Critique:* How do students know if they exist under a policy?
      *   *Fix:* The card states: "You are born if Policy A passes" or "You are born if Policy B passes."
      *   *Stake Structure:* The "Archivist" idea is good. Let's make it concrete: The instructor writes a post-class email summarizing the "History of Insula Aeterna." Who gets mentioned depends on the vote. It's symbolic but creates a desire for "historical survival."

  12. **Final Polish:** Check the math on the cards.
      *   Total: 14.
      *   Round 1:
          *   5 Conservation-Only (Good lives).
          *   5 Depletion-Only (Harder lives).
          *   2 Both (Harmed by Depletion).
          *   2 Both (Benefited by Depletion).
      *   Round 2:
          *   7 Policy X-Only.
          *   7 Policy Y-Only.
          *   (All identity-affecting, no overlap).

      *Wait, the prompt asks for Round 2 to confront a policy that harms only identity-affecting parties.*
      *   Okay, Round 1 is the "Mixed" case (some identity-preserving victims exist).
      *   Round 2 is the "Pure" case (NO identity-preserving victims).
      *   This contrast is vital. In Round 1, students can say "This hurts [Name]." In Round 2, they can't.

      *Let's finalize the card details.*
      *   Round 1 Cards need to clearly state existence conditions.
      *   Round 2 Cards need to ensure *no one* exists under both.

      *Wait, one more check on the "Better Off" wrinkle.*
      *   Prompt: "at least two characters who exist under both policies and are materially better off under depletion."
      *   Okay, I will ensure these two are in Round 1.

      *Let's write the response.*
answer: |-
  This is a sophisticated pedagogical challenge. You are asking students to inhabit a paradox that is designed to be immune to inhabitation. The goal is to create *friction*—to make the theoretical "glitch" feel like a moral injury.

  Below is the full runnable package for **"The Insula Aeterna Charter Council."** It is designed for 14 students, 90 minutes, with strict facilitation notes to prevent meta-gaming.

  ---

  # Part 1: Instructor's Brief & Preparation

  ## The Core Mechanic: The Archivist's Ledger
  To solve the "stakes" problem without money, you will play **The Archivist**. You hold the "Historical Record." At the end of class, you will write a brief "Epilogue" (emailed to them later) describing the history of the island.
  *   **The Stake:** Characters whose policy wins get a named lineage in the Epilogue. Characters whose policy loses are "erased from history" (their lines die out or are unrecorded).
  *   **Why this works:** It appeals to the desire for significance and narrative continuity without requiring real-world consequences. It mimics the "existence" stake of the Non-Identity Problem.

  ## Materials Needed
  1.  **14 Role Cards for Round 1** (Printed on distinct cardstock).
  2.  **14 Role Cards for Round 2** (Different color cardstock).
  3.  **Public Policy Sheet** (Projected or handout).
  4.  **Voting Ballots** (Simple slips of paper).
  5.  **Timer** (Visible to all).

  ## Room Setup
  *   One large table (U-shape or oval).
  *   You sit at the head as "The Archivist/Facilitator," not a voting member.

  ---

  # Part 2: The Timeline (90 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute Round 1 cards. Read "Charter Preamble." Establish rules (No meta-talk). |
  | **10-35** | **Round 1** | Deliberation on **Policy A (Conservation)** vs. **Policy B (Depletion)**. Vote. |
  | **35-45** | **Transition** | Collect cards. Distribute Round 2 cards. Brief scenario shift. |
  | **45-70** | **Round 2** | Deliberation on **Policy X (Early Infrastructure)** vs. **Policy Y (Delayed Infrastructure)**. Vote. |
  | **70-90** | **Debrief** | Structured discussion mapping experience to Parfit/Non-Identity. |

  ---

  # Part 3: Rules of Deliberation (Read Aloud)

  1.  **In-Character Only:** You are a stakeholder in the Republic of Insula Aeterna. You do not know you are in a seminar. You do not know "Parfit." You know your family, your future, and the public data.
  2.  **Private Information:** Your card contains information about your birth conditions that others do not know. You may choose to reveal it or keep it secret.
  3.  **The Archivist's Rule:** If you break character to discuss philosophy ("This is the non-identity problem"), I will mark your character as "Historically Unreliable." Your vote will still count, but your character will be excluded from the Epilogue regardless of the outcome.
  4.  **The Goal:** Secure a future where you (or your descendants) can thrive.

  ---

  # Part 4: Role Cards (Round 1)

  **Public Context (Known to all):**
  *   **Policy A (Conservation):** Resources preserved. Economy grows slowly. Stable environment for 100 years.
  *   **Policy B (Depletion):** Resources sold now. Massive economic boom for 20 years. Then, permanent poverty/environmental degradation for 100 years.
  *   **Crucial Fact:** The economic shift changes social conditions (who meets whom, when jobs are available), altering *who* is conceived in Generation 3.

  **Distribution (14 Students):**

  *   **Group 1: The Conservation Lineage (5 Students)**
      *   *Card Text:* "You are a member of Generation 3. **You are only born if Policy A passes.** Under Policy A, your life is comfortable and secure. Under Policy B, your parents never meet, so you are never born."
  *   **Group 2: The Depletion Lineage (5 Students)**
      *   *Card Text:* "You are a member of Generation 3. **You are only born if Policy B passes.** Under Policy B, your life is harder and poorer than Group 1, but still worth living (you are happy to be alive). Under Policy A, your parents never meet, so you are never born."
  *   **Group 3: The Harmed Contemporaries (2 Students)**
      *   *Card Text:* "You are a member of Generation 2 (Current Leaders' grandchildren). **You are born under BOTH policies.** However, under Policy B, your family loses their land to pollution, and you suffer chronic health issues. Under Policy A, you are healthy."
  *   **Group 4: The Boom Beneficiaries (2 Students)**
      *   *Card Text:* "You are a member of Generation 2 (Current Leaders' grandchildren). **You are born under BOTH policies.** Under Policy B, your family owns the resource rights. You are vastly wealthier than under Policy A. You are healthy in both."

  ---

  # Part 5: Role Cards (Round 2)

  **Public Context:**
  *   **Policy X (Immediate Construction):** Build a dam now. Floods a valley. Power surplus for 50 years.
  *   **Policy Y (Delayed Construction):** Build the dam in 30 years. Valley remains for 30 years, then flooded. Power surplus for 50 years (starting later).
  *   **Crucial Fact:** The timing shift (30 years) ensures **completely different people** are conceived in Generation 3. No one exists in both outcomes.

  **Distribution (14 Students):**
  *   **Group X (7 Students):** "You are born **only if Policy X passes**. Your life is good (modern power)."
  *   **Group Y (7 Students):** "You are born **only if Policy Y passes**. Your life is good (modern power), but your community was displaced later. *Crucially:* Your lives are **equally worth living**, but Policy X creates a slightly higher total GDP."
  *   *Note:* In this round, **no one** exists under both policies. There are no identity-preserving victims. This forces the Non-Identity Problem into the open.

  ---

  # Part 6: Facilitation & Failure Mode Management

  ### Failure Mode 1: "Let's just do the utilitarian calc."
  *   **Symptom:** Students start counting "5 good lives vs 5 hard lives."
  *   **Intervention:** As The Archivist, interrupt. "The Council does not vote on aggregate utility. You vote on *justice*. Does the Depletion Lineage have a *complaint*? Does the Conservation Lineage have a *right*?"
  *   **Prevention:** In the Round 1 briefing, emphasize: "You are not calculating numbers. You are advocating for your right to exist or your right to quality of life."

  ### Failure Mode 2: Meta-Philosophizing ("This is Parfit's Case 1.")
  *   **Symptom:** Students drop the accent/role to discuss the seminar reading.
  *   **Intervention:** Enforce the "Historically Unreliable" penalty immediately. "Student X, you have broken the simulation. Your character's lineage will be noted as 'confused' in the historical record."
  *   **Prevention:** Remind them in the first 2 minutes: "The person sitting next to you is not a classmate; they are a political rival or ally in 2080."

  ### Failure Mode 3: Cynicism ("None of us exist, so it doesn't matter.")
  *   **Symptom:** Students treat the vote as meaningless.
  *   **Intervention:** Lean into the personal stake. "It doesn't matter ontologically, but it matters *to you*. You want your story told. You want your descendants to have a chance."
  *   **Prevention:** The Archivist's Epilogue stake. Make it clear you *will* write it and send it.

  ---

  # Part 7: The Debrief (20 Minutes)

  *Do not start by explaining the Non-Identity Problem. Start by asking about their feelings.*

  **Phase 1: The Round 1 Friction (10 mins)**
  *   **Ask Group 3 (Harmed Contemporaries):** "How did you argue your case?"
      *   *Expected:* "We said Policy B hurts *us* specifically."
  *   **Ask Group 4 (Boom Beneficiaries):** "How did you respond?"
      *   *Expected:* "We said we didn't hurt anyone, we just made things better for us, and the future people wouldn't exist otherwise."
  *   **Ask Group 1 & 2 (Identity-Affecting):** "Did you feel you had a voice?"
      *   *Key Moment:* Group 1 (Conservation) will struggle to say they are *harmed* by Depletion, because Depletion gives them non-existence, not a bad life. Group 2 (Depletion) will feel defensive that their "worth living" life is being treated as a tragedy.
  *   **Connect:** "This friction you felt? That is the **Person-Affecting Intuition** clashing with the **Counterfactual Account of Harm**. Group 1 couldn't find a victim. Group 4 couldn't find a crime."

  **Phase 2: The Round 2 Contrast (5 mins)**
  *   **Ask:** "How did Round 2 feel different?"
  *   *Key Insight:* In Round 2, *no one* could claim identity-preserving harm. If they chose Policy X, Group Y couldn't say "You hurt me." They could only say "You didn't create us."
  *   **Connect:** "In Round 2, you faced the **Pure Non-Identity Problem**. Without the 'Harmed Contemporaries' from Round 1 to anchor you, did you feel morally unmoored?"

  **Phase 3: The Personal Turn (5 mins)**
  *   **Instructor Disclosure:** "I asked you to do this because I am currently helping a friend decide on a medication. It changes the genetic makeup of her future child. It carries risks. If she takes it, a specific child is born with risks. If she doesn't, a *different* child is born later."
  *   **Question:** "Knowing the theory now, does it help you decide? Or does it make the decision harder?"
  *   **Goal:** Move them from "Solving the puzzle" to "Sitting with the uncertainty." The theory doesn't solve the dilemma; it explains why the dilemma feels impossible.

  ---

  # Part 8: Honest Assessment & Limitations

  You asked for an honest assessment of what this activity cannot reproduce. You should share some of this with the students during the debrief to maintain intellectual honesty.

  **1. The Temporality Problem**
  *   **Limitation:** In the classroom, the vote is instantaneous. In reality, the causal chain takes decades. Students know their existence isn't *actually* contingent on the vote.
  *   **Impact:** This creates a "safety net" of unreality. They can play hard, but they know they will walk out of the room regardless of the outcome.
  *   **Mitigation:** Acknowledge this. "The simulation compresses time to make the contingency visible. In real life, the contingency is invisible, which is why we ignore it."

  **2. The "Headcount" Temptation**
  *   **Limitation:** Even with rules, 14 students will naturally gravitate toward "7 votes vs 7 votes."
  *   **Impact:** This obscures the qualitative difference between "harming a person" and "creating a different person."
  *   **Mitigation:** The Debrief must explicitly dismantle the headcount. "If morality were just headcounts, Group 4 (Benefited) would always win. Why did that feel wrong to some of you?"

  **3. The Emotional Gap**
  *   **Limitation:** You (the instructor) feel the bite because it is your friend. The students feel a *simulated* bite.
  *   **Impact:** They may leave thinking it's a clever logic game.
  *   **Mitigation:** Your personal disclosure at the end is the bridge. It transfers the weight from the simulation to the reality.

  ---

  # Part 9: The Archivist's Epilogue (Template)

  *Send this email within 24 hours to cement the stakes.*

  **Subject:** Historical Record: Insula Aeterna Charter Council

  **Body:**
  *   *If Policy A/Conservation Won:* "The Council chose preservation. The Resource Barons (Group 4) were overruled. The Generation 3 Conservation Lineage (Group 1) flourished. The Depletion Lineage (Group 2) remains unwritten in the history books, a ghost population that might have been."
  *   *If Policy B/Depletion Won:* "The Council chose growth. The Resource Barons (Group 4) secured their legacy. The Generation 3 Depletion Lineage (Group 2) entered history, enduring hardship but surviving. The Conservation Lineage (Group 1) was never conceived."
  *   *Note on Round 2:* "In the second session, the Council faced the timing shift. Regardless of the choice, the historical record notes that the population was entirely replaced. No specific individual was harmed, yet the character of the nation changed."

  ---

  # Final Advice for the Instructor

  You mentioned your friend's situation. Be careful not to let the session become *about* your friend. Use it as the closing key, not the opening lock.

  The success of this session depends on **your restraint**.
  *   Do not explain the Non-Identity Problem until the debrief.
  *   Do not validate their philosophical insights during the role-play ("Good point about counterfactuals!"). Instead, validate their *character's* passion ("That is a passionate defense of your lineage.").
  *   If they solve it too easily (e.g., "We just ban depletion because it's risky"), push back as a stakeholder: "But the Depletion group says they have lives worth living. Why do you get to decide their lives aren't worth the risk?"

  You want them to leave the room feeling that **moral mathematics has broken down**. That is the correct learning outcome for Parfit.
