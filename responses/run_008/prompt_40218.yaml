prompt: |-
  I'm on the benefits committee for the graduate-student health plan at a large university, and we're stuck on a case that's turned into a weirdly heated email thread. A DMA piano student has congenital, progressive sensorineural hearing loss, mild-to-moderate, that's never been treated. Standard hearing aids would restore her fully to normal conversational hearing -- no dispute there, we'd cover it in a heartbeat. But she's asking us to cover a newer high-fidelity device that would also extend audibility into the higher frequency ranges that typical listeners can't hear well, because her whole livelihood depends on discriminating overtones that even normal ears catch only partially. Her audiologist's letter argues that years of training have literally reorganized her auditory cortex, so her functional "baseline" was always above species-typical, and the premium device just restores *her* baseline rather than exceeding it.

  The committee has fractured into camps. One member wants a bright-line rule: we cover whatever restores species-normal functioning, and the increment beyond that is enhancement, full stop, since our charter says the plan exists to treat illness. A second thinks that's too crude -- he points out that we already cover, say, antidepressants for someone who'd still be functional-but-miserable without them, so we clearly don't only treat deficits against the species baseline. A third says the therapy/enhancement distinction is bankrupt altogether and we should just be doing cost-effectiveness like a sensible insurer, but she can't say how that squares with the charter language. And the pianist herself, when she came to speak, said something that stuck with me: she pointed out that if she'd lost her hearing in an accident we'd feel obviously obligated to restore everything she'd trained herself to have, and she doesn't see why being born with the loss changes the counterfactual.

  We meet in two weeks and I've been asked to circulate a written opinion beforehand, since I'm the one who keeps saying the camps are talking past each other. Draft the memo: it needs to recommend something concrete we can actually vote on (approve the premium device, deny it, or approve with some condition), give a principled rule we could apply to future enhancement-ish requests without opening the floodgates, and deal honestly with the strongest version of whichever position it rejects -- including the possibility that the third member is right and the whole distingushion should be abandoned. Please don't just restate the "medical necessity" boilerplate from our policy, and don't pad it with citations; I mainly need the reasoning worked out. Also, whatever rule you land on, flag the weird cases it would break on, because someone on this committee WILL bring up tattoo removal or Viagra at the meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the graduate-student health plan benefits committee.
      *   **Task:** Draft a written opinion/memo to circulate before the next meeting.
      *   **Subject:** Coverage request for a high-fidelity hearing device by a DMA piano student with congenital hearing loss.
      *   **Conflict:**
          *   *Camp 1 (Species-Normal):* Cover only what restores species-typical function. Anything beyond is enhancement (not treatment).
          *   *Camp 2 (Individual Baseline):* Species-normal is too crude. We cover mental health (functioning-but-miserable), so we care about individual flourishing. The student's "baseline" is higher due to training.
          *   *Camp 3 (Cost-Effectiveness/Pragmatist):* Therapy/enhancement distinction is bankrupt. Just look at cost-effectiveness. (Struggles with charter language).
          *   *The Student's Argument:* Counterfactual fairness. If acquired loss, we'd restore trained capacity. Why does congenital matter?
      *   **Requirements:**
          *   Recommend a concrete vote (Approve, Deny, or Conditional).
          *   Provide a principled rule for future cases (no floodgates).
          *   Address the strongest version of rejected positions (especially Camp 3).
          *   Avoid boilerplate "medical necessity" language.
          *   Flag edge cases/weird implications (tattoos, Viagra, etc.).
          *   Tone: Professional, reasoned, persuasive, suitable for a committee memo.

  2.  **Deconstruct the Ethical/Policy Problem:**
      *   *The Core Tension:* Treatment (restoring health) vs. Enhancement (improving beyond health).
      *   *The Twist:* For a professional musician, "species-normal" hearing is actually a *disability* relative to their professional requirements. "Normal" hearing misses overtones crucial for their trade.
      *   *The Congenital vs. Acquired Issue:* Intuitively, we feel more obligation to restore lost function (acquired) than grant new function (congenital). But from the patient's perspective, the functional deficit is the same.
      *   *The Charter:* Exists to "treat illness." This limits Camp 3's pure cost-effectiveness approach unless cost-effectiveness is framed *within* the scope of treating illness.

  3.  **Evaluate the Camps:**
      *   *Camp 1 (Species-Normal):* Easy to administer, but unjust in this specific case. It treats the musician's professional requirement as a luxury rather than a medical need relative to their life plan. It penalizes congenital conditions unfairly compared to acquired ones.
      *   *Camp 2 (Individual Baseline):* More just, but risks the "floodgates." If a basketball player needs growth hormone to reach *their* potential, is that treatment? If a math student needs Modafinil to reach *their* baseline focus? Need to narrow this.
      *   *Camp 3 (Cost-Effectiveness):* Honest, but violates the charter. We aren't a general welfare fund; we are a health plan. We can't ignore the "treatment of illness" mandate. However, Camp 3 is right that the therapy/enhancement line is blurry.

  4.  **Develop a Recommendation:**
      *   *Decision:* Approve the device, but with a specific narrowing condition.
      *   *Rationale:* The "Species-Normal" standard fails because "health" is contextual. For a pianist, hearing overtones isn't a superpower; it's a basic requirement for function, analogous to a runner needing legs that work for running, not just walking.
      *   *The Rule:* "Occupational Restoration Standard." Coverage extends beyond species-typical norms *only* when the specific sensory/motor capacity is a documented, essential requirement of the beneficiary's trained profession, and the device restores the capacity they would have had absent the pathology.
      *   *Addressing Camp 3:* Acknowledge the distinction is fuzzy. Admit that cost matters, but cost-effectiveness can't override the charter's purpose. We can use cost as a tie-breaker, not a definition.
      *   *Addressing the Congenital/Acquired distinction:** Agree with the student. The moral obligation stems from the *current* functional deficit relative to life plans, not the history of the deficit.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Opening:** State the purpose and the recommendation clearly (Approve with conditions).
      *   **The Core Argument (Rejecting Species-Normal):** Explain why "species-typical" is insufficient for graduate students (who are training for specific professions). Use the "runner's legs" analogy.
      *   **The Proposed Rule (Occupational Restoration):** Define the limit. It's not "anything that helps you do your job." It's "restoring the specific physiological function required for the job that the pathology impaired."
      *   **Addressing Camp 3 (The Distinction is Bankrupt):** Validate their skepticism. The line *is* blurry. But we can't abandon the charter. Propose that "treatment" means removing barriers to the life plan the pathology created, not optimizing the life plan.
      *   **Edge Cases (The "Weird Stuff"):**
          *   *Viagra:* Distinguish between function (erection) and specific occupational need. Unless they are a sex worker? (Maybe too risky for a formal memo, keep it to "reproductive health vs. performance"). Better: Compare to glasses. Glasses correct to normal. This request is "high-def glasses."
          *   *Tattoo Removal:* Cosmetic vs. Psychological distress.
          *   *ADHD Meds for Grades:* This is the real risk. Need to distinguish between *treating a deficit* (ADHD) vs. *enhancing focus* for a deadline. The rule must require a diagnosed pathology, not just professional pressure.
      *   **Conclusion:** Reiterate the vote.

  6.  **Refining the Reasoning (Self-Correction during drafting):**
      *   *Critique:* Is "Occupational Restoration" too broad? What if a coder wants a brain implant to type faster?
      *   *Fix:* Tighten the rule. It must be a *sensory or motor* restoration directly linked to the *core physical mechanic* of the profession, not general cognitive enhancement. And it must be the *least costly* effective option for *that* specific restoration.
      *   *Critique:* How do I handle Camp 3's point about the charter?
      *   *Fix:* Argue that the charter's "treat illness" clause implies restoring the patient to *their* healthy baseline, not a statistical average. If the illness prevents their specific healthy functioning, treating the illness requires addressing that gap.
      *   *The Student's Point:* Make sure to explicitly validate the congenital vs. acquired argument. It's morally sound.

  7.  **Final Polish:**
      *   Check tone: Needs to be diplomatic but firm.
      *   Check constraints: No citations, no boilerplate.
      *   Check the "Weird Cases": Ensure Viagra/Tattoo/ADHD are addressed as stress tests for the rule.

  8.  **Final Review against Prompt:**
      *   Recommend concrete vote? Yes (Approve).
      *   Principled rule? Yes (Occupational/Sensory Specificity).
      *   Deal with Camp 3? Yes (acknowledge fuzziness but maintain charter bounds).
      *   Flag weird cases? Yes (ADHD, Cosmetic, etc.).

  *(Self-Correction on the "Viagra" point)*: Be careful. Viagra treats ED (a pathology). Using it for performance enhancement is off-label. The analogy should be about *degree* of function. Better to use the "Glasses" analogy. Normal glasses vs. Eagle-Eye glasses. Or the "Prosthetic" analogy. A runner with a prosthetic leg wants a carbon-fiber one that gives them a bounce. We cover the leg, not the bounce. *Wait, the pianist case is different.* She needs the bounce to run *at all* professionally. A normal leg lets her walk (species normal), but she needs to run. So the carbon fiber is necessary for *her* function.
  *Refined Edge Case:* A mathematician requesting expensive nootropics. The rule must exclude cognitive enhancement even for professionals, limiting it to sensory/motor restoration to avoid the "Limitless" problem.

  *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Graduate Student Health Plan Benefits Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation regarding High-Fidelity Auditory Device Coverage (Case #492)

  **Executive Summary**

  I recommend we **approve** the coverage for the high-fidelity hearing device, subject to a specific limitation regarding occupational specificity.

  The current deadlock stems from three competing frameworks: a "Species-Normal" standard (Camp 1), an "Individual Baseline" standard (Camp 2), and a "Cost-Effectiveness" standard (Camp 3). None of these are sufficient on their own. Species-normal is too blunt for a population of professional trainees; individual baseline is too expansive; and pure cost-effectiveness ignores our charter's mandate to treat illness rather than maximize utility.

  We should adopt a rule of **Occupational Sensory Restoration**. This allows coverage beyond species-typical norms *only* when: (1) the beneficiary has a diagnosed pathology; (2) the specific sensory/motor deficit prevents the core physical execution of their trained profession; and (3) the requested technology is the minimum intervention required to bridge *that specific* gap.

  Below is the reasoning, the proposed policy language, and an analysis of the edge cases this rule creates.

  **1. Why "Species-Normal" Fails Here**

  Camp 1 argues that our charter requires restoring "health," defined as species-typical functioning. Under this view, hearing up to 15kHz is normal; hearing to 20kHz is enhancement.

  This distinction collapses in the context of graduate professional training. A "healthy" graduate student is not a statistical average; they are an individual training for a specific vocation. If a doctoral candidate in architecture loses fine motor control in their dominant hand, restoring "species-normal" grip strength is insufficient treatment if they cannot draft. We would cover specialized therapy to restore *their* grip, not the average person's.

  For this pianist, "species-normal" hearing is functionally equivalent to blindness. It allows for conversation (walking), but not for professional performance (running). To treat her illness (hearing loss) is to restore her capacity to function in the life she is medically and vocationally situated in. To deny the high-fidelity device because it exceeds the hearing of a non-musician is to treat her profession as a hobby.

  Furthermore, the student's point on congenital vs. acquired loss is morally decisive. If a tenured professor lost this hearing in a car accident, we would intuitively feel obligated to restore their professional capacity. The moral claim rests on the *current deficit relative to life plans*, not the history of the deficit. Penalizing congenital conditions creates a perverse incentive where we value the lost potential of the acutely injured over the unrealized potential of the chronically impaired.

  **2. Addressing the "Bankrupt Distinction" (Camp 3)**

  Camp 3 is correct that the therapy/enhancement line is porous. They are also right that cost-effectiveness matters. However, they are wrong that we can abandon the distinction entirely. Our charter restricts us to "treatment of illness." If we fund anything that is cost-effective, we become a general stipend fund, not a health plan.

  We must keep the distinction, but refine it. The distinction shouldn't be "Normal vs. Better." It should be "Barrier Removal vs. Optimization."
  *   **Treatment** removes a pathological barrier that prevents the patient from accessing their specific life plan.
  *   **Enhancement** optimizes a capacity that is already functional for that life plan.

  In this case, the lack of high-frequency audibility is a *barrier* to her career, not an *optimization* of it. She cannot work without it. Therefore, it falls under treatment, even if the device exceeds species norms.

  **3. The Proposed Rule: Occupational Sensory Restoration**

  To prevent floodgates, I propose we adopt the following criterion for future "enhancement-adjacent" requests:

  > *The Plan will cover interventions that exceed species-typical functional norms only when the beneficiary demonstrates that the specific sensory or motor capacity in question is an essential, documented requirement of their trained profession, and the intervention is necessary to restore the capacity to the minimum threshold required for that profession.*

  **Key Limitations:**
  1.  **Sensory/Motor Only:** This excludes cognitive enhancement. We are not covering nootropics for a math student, even if their "baseline" requires high focus. The line must be drawn at physical/sensory hardware to avoid subjective definitions of cognitive "pathology."
  2.  **Minimum Threshold:** We cover the device that gets them to the professional threshold, not the most expensive one that exceeds it. If a mid-tier high-fidelity device works, we don't cover the top-tier.
  3.  **Trained Profession:** This excludes hobbyists or undergraduate explorers. The commitment to the profession must be established (e.g., DMA status).

  **4. Stress Testing the Rule (The "Weird Cases")**

  Someone *will* raise these examples at the meeting. Here is how the rule handles them:

  *   **Viagra/Sexual Performance:**
      *   *Challenge:* If a sex worker requests coverage for erectile dysfunction meds to restore their "professional baseline," do we pay?
      *   *Resolution:* Deny. Our plan excludes reproductive/sexual function from occupational definitions unless tied to reproductive health pathology. Also, the "Occupational" clause is intended for accredited professional training tracks, not gig economy roles.
      *   *Better Challenge:* What about a standard patient wanting Viagra for "confidence"?
      *   *Resolution:* Deny. That is optimization of function, not restoration of a barrier to a trained profession.

  *   **Tattoo Removal:**
      *   *Challenge:* If a tattoo prevents employment (e.g., visible neck tattoo for a corporate trainee), is it a barrier to a life plan?
      *   *Resolution:* Deny. This is a cosmetic modification, not a pathology of sensory/motor hardware. The rule requires a diagnosed medical condition (hearing loss), not a social stigma.

  *   **ADHD Medication for Grades:**
      *   *Challenge:* A law student argues they have sub-clinical focus issues. To reach *their* baseline for law school, they need expensive, brand-name stimulants rather than generics.
      *   *Resolution:* Deny. We treat the diagnosed pathology (ADHD) with standard care. We do not cover the "premium" version of treatment to optimize grades. The pianist case is different because standard hearing aids *do not work* for her profession. The generic solution fails the medical goal. For the law student, the generic solution works for the pathology; they just want the premium version for better results.

  *   **The "Cyborg" Risk:**
      *   *Challenge:* If we cover high-fidelity hearing, does a computer science student request neural implants to process code faster?
      *   *Resolution:* Deny. The rule is restricted to *restoration* of human sensory ranges, not *expansion* into non-human ranges. The pianist needs to hear 20kHz (human range); she does not need to hear 50kHz (bat range). The CS student wants to process data at a speed no human brain can. That is enhancement, not restoration.

  **5. Recommendation and Vote**

  We should vote to **Approve** the device for this student.

  This decision acknowledges that "health" for a graduate student is contextual. It validates the student's argument regarding congenital vs. acquired loss without opening the door to general cognitive enhancement. It respects the charter by framing the cost as "treatment of a professional disability" rather than "subsidy for elite equipment."

  If we deny this, we are effectively telling students in high-fidelity sensory professions (music, radiology, culinary arts) that their congenital disabilities are covered only up to the point where they can survive, not up to the point where they can work. That contradicts the purpose of a *graduate* student health plan.

  I look forward to discussing this framework on Tuesday.
