answer: |-
  **Essay Question**

  The Priority View is often defended as avoiding the Leveling Down Objection while preserving the egalitarian intuition that we should benefit the worse off. However, if the moral weight of benefits is determined solely by the recipient's absolute level of well-being, it is unclear why this weighting should not apply to temporal parts of a single life. Assess whether extending the Priority View to intrapersonal distribution strengthens or undermines its claim to offer a distinct, non-relational alternative to telic egalitarianism.

  ***

  **Model Answer**

  The Priority View (prioritarianism) is typically motivated by Parfit's Leveling Down Objection (LDO). Telic egalitarianism implies that a world where everyone is equally miserable is, in one respect, better than a world where some are well off and others are slightly less well off, even if no one benefits from the equality. Prioritarianism avoids this by assigning greater moral weight to benefits the worse off one is, regardless of how others fare. Thus, leveling down benefits no one and generates no moral value. While this successfully dodges the LDO, it raises a deeper justificatory question: why do we give priority to the worse off?

  If the justification is non-relational—grounded simply in the diminishing moral value of well-being increments—it is difficult to see why the boundaries of persons should act as moral firewalls. This is the crux of the Otsuka and Voorhoeve challenge. They argue that prioritarianism aggregates weighted well-being across persons, potentially violating the "separateness of persons" by sacrificing the interests of the better off for the weighted gains of the worse off in ways that would be irrational within a single life.

  This brings us to the intrapersonal twist. If prioritarianism is truly about the concave value of well-being, it should apply intrapersonally. Consider a single life with a period of high well-being and a period of low well-being. A "prioritarian" prudence would favor smoothing this life, even if it involves "intrapersonal leveling down"—reducing the high period to raise the low period, provided the weighted gain outweighs the loss.

  Extending the view intrapersonally strengthens its consistency. It demonstrates that the view is indeed non-relational; person-boundaries are not morally fundamental, merely practical containers for well-being. If we accept that smoothing a life is prudentially rational (as many theories of prudence suggest), then the interpersonal case is simply the intrapersonal logic applied across the "veil" of identity. This insulates prioritarianism from the charge that it smuggles in relational concerns; it treats all well-being units equally, regardless of whose they are.

  However, this extension also undermines the view's distinctness from egalitarianism. If prioritarianism recommends intrapersonal leveling down, it looks remarkably like telic egalitarianism applied within a life. Telic egalitarians argue inequality is bad *in itself*; if a prioritarian argues that a jagged life is worse than a smooth one (even at a cost to total well-being), they are effectively valuing equality of distribution within the life. This suggests the "non-relational" defense is unstable. The motivation for prioritizing the worse off interpersonal may secretly rely on a relational intuition (that gaps between people are bad), which is merely suppressed in the interpersonal case but revealed in the intrapersonal one.

  Furthermore, if prioritarianism applies intrapersonally, it faces a version of the LDO. If I can make my life more equal by destroying a peak experience without raising a trough (pure intrapersonal leveling down), does the priority view condemn it? A consistent prioritarian must say yes, it generates no value. But if they say no, they admit that the view relies on person-affecting constraints that look suspiciously like relational boundaries.

  Ultimately, the intrapersonal test exposes that prioritarianism sits precariously between utilitarianism and egalitarianism. To maintain its non-relational status, it must apply intrapersonally, but in doing so, it risks collapsing into a form of egalitarianism about life-shapes. To avoid this, it must assert a moral significance to person-boundaries, which concedes the egalitarian's point that relations between persons matter. The intrapersonal case does not solve the tension; it illuminates that avoiding leveling down is easy, but justifying the trade-offs without relational premises is the true hurdle.

  ***

  **Marking Scheme (20 Marks)**

  **1. Characterization of LDO and Priority's Avoidance (4 Marks)**
  *   **Must Hit:** Correctly explain that Telic Egalitarianism values equality intrinsically (vulnerable to LDO), while Prioritarianism values weighted well-being (immune to LDO).
  *   **Common Fumble:** Students recite the definition of LDO but fail to note that avoiding it is the "easy" part of the prompt, spending too much time on this instead of the justification.

  **2. The Interpersonal Justification & Otsuka/Voorhoeve (6 Marks)**
  *   **Must Hit:** Explain *why* prioritarianism favors the worse off (concave value function) and articulate the challenge: if it's non-relational, why respect person-boundaries? (The aggregation/separateness objection).
  *   **Common Fumble:** Treating Otsuka/Voorhoeve as simply "anti-prioritarian" without engaging with the *separateness of persons* argument regarding aggregation vs. prudence.

  **3. Application to Intrapersonal Leveling Down (6 Marks)**
  *   **Must Hit:** Apply the priority weighting to temporal parts of a life. Discuss whether "smoothing" a life via lowering highs is recommended and whether this looks like egalitarianism.
  *   **Common Fumble:** Dismissing the intrapersonal case as purely "prudential" and therefore irrelevant to political justice, missing the structural parallel requested.

  **4. Synthesis: Distinctness vs. Collapse (4 Marks)**
  *   **Must Hit:** Conclude on whether this extension strengthens (consistency) or undermines (collapse into egalitarianism/relationalism) the view. No single verdict required, but reasoning must be tight.
  *   **Common Fumble:** Taking a dogmatic "Prioritarianism is right/wrong" stance without analyzing how the intrapersonal case affects the *theoretical distinction* between the views.
