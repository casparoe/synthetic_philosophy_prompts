answer: |-
  Your flatmate is correct that the mathematics is valid within its specific axiomatic framework, but wrong that it settles ethics, because the theorem relies on contentious normative premises about rationality and interpersonal utility comparison that Rawls explicitly rejected on philosophical rather than mathematical grounds.

  Social choice theorists distinguish between two separate Harsanyi results that your flatmate has conflated. The **Aggregation Theorem** (1955) states that if individual and social preferences both satisfy the von Neumann-Morgenstern (VNM) axioms of rationality and respect the Pareto principle, social welfare must be a weighted sum of individual utilities. Crucially, this theorem does not specify *equal* weights; it allows for any weighting scheme, including prioritarianism or elitism. To get classical utilitarianism (equal weights), you need Harsanyi's **Impartial Observer Theorem**, which argues that an observer behind a veil of ignorance who assumes an equal probability of being anyone will maximize average utility. Your flatmate treats these as a single seamless proof, but the move from "linear aggregation" to "equal weighting" requires the additional, controversial assumption that impartiality is mathematically equivalent to equiprobability.

  The derivation smuggles in several substantive ethical premises that are not mathematical truths. The most significant is **interpersonal comparability of utility**: VNM utilities are only unique up to positive affine transformation (you can shift the zero and scale the unit arbitrarily), so summing them across people requires a normative rule to normalize everyone's scales to a common metric. Harsanyi assumes this is possible and meaningful, but many economists and philosophers argue there is no factual basis for comparing the intensity of different people's preferences. Furthermore, defining impartiality as equiprobability (the Principle of Insufficient Reason) is itself a normative choice; one could argue impartiality requires protecting the worst-off rather than gambling on the average, which leads directly to Rawls.

  The dig at Rawls is unfair because it mischaracterizes a philosophical disagreement as a calculation error. Rawls accepts the veil of ignorance but rejects the **equiprobability assumption**, arguing that the Original Position represents radical uncertainty rather than calculable risk, making expected utility maximization inappropriate for choices involving basic liberties. Rawls advocates for the **Maximin rule** (maximize the minimum position) because he views the stakes as too high for gambling, whereas Harsanyi insists that rationality *requires* expected utility maximization even in moral contexts. They are disagreeing over the axioms of rationality under uncertainty, not solving the same equation differently; Rawls didn't slip up in the maths, he rejected the applicability of that specific maths to justice.

  Ultimately, decision theory cannot settle ethics because it is instrumental: it tells you how to maximize given goals, not which goals are moral. The VNM axioms describe consistency in choice, not moral truth, and many ethical frameworks (like rights-based deontology) explicitly reject the premise that all values are commensurable and tradable off against each other in a single utility function. Harsanyi proved that *if* you accept VNM rationality, *if* you accept interpersonal comparability, and *if* you define impartiality as equiprobability, *then* you get utilitarianism; since non-utilitarians deny those antecedents, the theorem constrains their consistency but does not refute their morality.
