      *   **Claim 4: Rawls vs. Nozick (Separateness of Persons):** This is a crucial distinction.
          *   Rawls: Critique of *aggregation* across persons as if they were one person. Focus on distribution and sacrifice.
          *   Nozick: Focus on *marginal utility* differences violating boundaries.
