  5.  **Final Polish:** Organize with clear headings matching the user's questions. Ensure the distinction between "self-refuting" (internal contradiction) and "counter-intuitive implication" is clear. (Self-refuting means the theory contradicts itself; the monster shows it contradicts *our morals*).

