answer: |-
  This is one of the most sophisticated and persistent questions in Adam Smith scholarship. You have identified the central tension in *The Theory of Moral Sentiments* (TMS): **How can a moral faculty constructed from social interaction transcend the limitations of that very interaction?**

  If the Impartial Spectator (IS) is merely an internalized aggregate of local approval, Smith is indeed a moral conventionalist, and his system cannot account for moral reformers who stand against their age (e.g., abolitionists in a slave-holding society).

  The short answer is: **The standard characterization is a simplification.** While the IS is socially *grounded*, it is not socially *bound*. Smith provides specific mechanisms within his account that allow the spectator to critique, rather than merely echo, prevailing opinion. However, Smith also admits this capacity is fragile and not guaranteed.

  Here is a breakdown of the resources Smith provides for rising above convention, and where the tensions remain.

  ### 1. The Distinction Between "Actual" and "Idealized" Spectators
  The most common misunderstanding of the IS is identifying it with the *actual* people around the agent. Smith is careful to distinguish between the "man without" (actual observers) and the "man within" (the impartial spectator).

  *   **Construction vs. Constitution:** The IS is *constructed* from social experience, but once constituted, it operates as an **idealized** standard. We do not simply ask, "What would my neighbors say?" We ask, "What would a neutral, well-informed observer say?"
  *   **The Element of Imagination:** Sympathy for Smith is an act of imagination ("changing places in fancy"). When consulting the IS, the agent imagines an observer who is not burdened by the specific biases, passions, or limited information of the actual neighbors. By stripping away the specific context of the local community in the imagination, the agent creates a vantage point that is more general than the local norm.
  *   **Textual Evidence:** In TMS III.2.3, Smith notes that we often appeal from the "tribunal of the world" to the "tribunal of conscience." If they were identical, this appeal would be impossible.

  ### 2. The Desire for Praiseworthiness vs. The Desire for Praise
  Smith draws a crucial psychological distinction between wanting to be *praised* (conventional approval) and wanting to be *praiseworthy* (meriting approval).

  *   **The Mechanism:** The "man within" is the guardian of praiseworthiness. A person can realize that their society applauds something (e.g., dueling or infanticide) but that the action does not *merit* applause from a truly impartial viewpoint.
  *   **Transcending Convention:** This distinction allows the agent to say, "My neighbors approve of this, but they are partial. If they were truly impartial, they would condemn it." This moves the standard from *de facto* approval to *normative* approbation. The IS represents how people *ought* to react, not just how they *do* react.

  ### 3. The Role of Reason and General Rules
  While Smith is a sentimentalist (morality is rooted in feeling, not pure reason), he assigns reason a critical regulatory role in TMS Part VII and Part III.

  *   **Inductive Generalization:** We form general moral rules based on repeated experiences of sympathy. Over time, these rules gain authority independent of the immediate sentiment.
  *   **Critiquing Custom:** Once established, these general rules can be used to critique specific local customs that violate them. Smith explicitly acknowledges that custom can corrupt sentiment (e.g., making brutality seem normal). However, he argues that the "general rules of morality" are the only things that can check the "spirit of faction" or the "contagion" of bad social norms.
  *   **Consistency:** The IS seeks consistency. If a society holds contradictory norms (e.g., valuing human life but accepting slavery), the IS can expose the incoherence. The resource here is logical consistency applied to sentimental judgments.

  ### 4. Distance and Perspective
  Smith uses spatial metaphors frequently. Moral judgment requires viewing conduct from a "certain distance."

  *   **Local vs. Remote:** Local spectators are often too close to the action, infected by the passions of the moment. The IS represents a standpoint of distance.
  *   **Universalizing the Audience:** In his later revisions to TMS (particularly the 1790 edition), Smith expands the scope of the spectator. He suggests that the ultimate appeal is to the "Great Judge of mankind," or the spectator of the "whole universe." This moves the IS from a local proxy to a universal standpoint. As Amartya Sen has argued in *The Idea of Justice*, Smith's IS is a device for "open impartiality," inviting the agent to consider the perspective of distant others, not just neighbors.

  ### 5. Acknowledging the Limits (The Unresolved Tension)
  You asked if the tension is real and unresolved. In a sense, **yes.** Smith is a fallibilist. He does not claim the IS is infallible or that every individual can successfully access it.

  *   **Corruption is Possible:** Smith admits that in some societies, the "spirit of the age" can be so overwhelming that it corrupts the IS itself. He cites the exposure of infants in ancient Greece and the dueling culture of 18th-century Europe as cases where the "man within" was silenced or corrupted by the "man without."
  *   **The Moral Hero:** Smith acknowledges that standing against society requires a level of moral strength ("self-command") that is rare. The capacity to rise above convention exists in the *structure* of the theory, but it is not guaranteed in every *psychology*.
  *   **No Algorithm:** Smith does not provide a moral algorithm. The IS is a process of deliberation, not a voice that always speaks the truth. It is possible to consult the IS poorly.

  ### Conclusion: Critical Conventionalism
  The standard characterization is misleading if it implies the IS is a passive mirror. A more accurate description is that Smith offers a **critical conventionalism**.

  1.  **Grounded:** Moral concepts *originate* in social interaction (you cannot be moral in isolation).
  2.  **Critical:** The mechanism of that interaction (sympathy + imagination + distance) creates a standard that *exceeds* any particular interaction.

  The resources for rising above convention are **idealization** (imagining a better-informed observer), **abstraction** (forming general rules), and **distance** (considering the view of distant others).

  Smith does not resolve the tension by guaranteeing success; he resolves it by making the *struggle* between local opinion and impartial judgment the central drama of moral life. The IS is not a voice that tells you what your society thinks; it is the faculty you use to decide whether what your society thinks is *right*.

  **Recommended Reading for Further Nuance:**
  *   **D.D. Raphael, *The Impartial Spectator*:** The definitive analysis of how the IS develops and functions.
  *   **Amartya Sen, *The Idea of Justice* (Chapter 6):** Argues Smith's IS is a tool for comparative justice that transcends local borders.
  *   **Samuel Fleischacker, *On Adam Smith's Wealth of Nations*:** Discusses the relationship between moral judgment and cultural context.
  *   **Griswold, *Adam Smith and the Virtues of Enlightenment*:** Addresses the tension between custom and conscience directly.
