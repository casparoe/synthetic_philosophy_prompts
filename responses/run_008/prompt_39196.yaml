answer: |-
  Your hypothesis is remarkably precise. You have correctly identified that the heritability debate in your seminar is a *composite* conflict, where distinct layers of disagreement are conflated under the single label of "heritability." This conflation is precisely why the common ground (the rectangle analogy, PKU, context-dependence) fails to dissolve the tension: the participants agree on the *definitions* but disagree on the *implications* of those definitions.

  Here is a diagnosis of the dispute, broken down by the components you identified, assessing the nature of the disagreement and the conditions for progress in each.

  ### 1. The Empirical Dispute: Robustness of the Additive Model
  **Nature of Disagreement:** Substantive and Empirical.
  **Where it lies:** This is the only component that is truly about the world rather than our description of it. It concerns the structure of the genotype-phenotype map.
  *   **The Statisticians' Claim:** Additive genetic variance ($V_A$) is usually the dominant component of genetic variance. Even if Gene-Environment (GxE) interactions exist, they often amount to "scaling" (magnitudes change) rather than "crossover" (ranks change). If ranks don't change, the heritability coefficient remains predictive and stable enough for utility.
  *   **The Skeptics' Claim:** Crossover interactions are pervasive. Reaction norms cross frequently enough that the main effects ($V_G$ and $V_E$) are unstable artifacts of the specific sampling distribution. If the ranking of genotypes changes across environments, the "fraction of variance" is not a property of the trait, but a transient property of the sample.

  **What Counts as Progress:**
  *   **Formal Results:** We need formal bounds on robustness. Progress would look like a theorem stating: "If the magnitude of crossover interactions is bounded by $X$, the heritability estimate remains stable within confidence interval $Y$ across environmental shifts of magnitude $Z$."
  *   **Empirical Surveys:** Systematic meta-analyses not of heritability estimates themselves, but of *GxE prevalence* across trait classes (e.g., anthropometric vs. behavioral). If data show crossover interactions are rare for height but common for cognitive test scores, the debate splits into trait-specific claims rather than a general war over the coefficient.
  *   **Current Status:** This is the most resolvable layer. However, even if resolved (e.g., "Additivity holds for 80% of traits"), the other two layers of the fight will persist.

  ### 2. The Conceptual/Verbal Dispute: Variance vs. Causation
  **Nature of Disagreement:** Verbal and Categorical (Talking Past Each Other).
  **Where it lies:** This is a confusion about what question is being answered.
  *   **The Statisticians** are answering: *"In this specific dataset, how much of the observed variation correlates with genetic variation?"* This is a question about **data structure**.
  *   **The Skeptics** are hearing: *"How much did genes cause this trait?"* or *"How fixed is this trait?"* This is a question about **causal mechanism**.

  The "Rectangle Analogy" resolves the individual causal question (100% genes, 100% environment), but it does not resolve the population variance question. The fight persists because the Skeptics believe that reporting a population variance statistic *inevitably* triggers causal essentialism in the listener, regardless of the disclaimers attached. The Statisticians believe that if the listener infers causation from a variance statistic, the listener is committing a logical fallacy (the ecological fallacy), and the statistician is not responsible for the listener's logic.

  **What Counts as Progress:**
  *   **Terminological Discipline:** Progress requires abandoning the word "heritability" in public-facing contexts in favor of "population variance ratio" or similar clunky but precise terms. If the term itself carries historical baggage (eugenics), the label is part of the problem.
  *   **Reporting Standards:** A convention where $H^2$ is never reported without a concurrent "environmental variance ratio" ($E^2$) and a statement of the environmental range sampled.
  *   **Current Status:** This is largely solvable through stricter conceptual hygiene, but it requires the Statisticians to concede that language has pragmatic force beyond semantic definition.

  ### 3. The Normative Dispute: Epistemic Duty vs. Social Harm
  **Nature of Disagreement:** Non-Empirical (Value Conflict).
  **Where it lies:** This is the "pragmatics of science communication" you identified. It is a clash between two ethical frameworks.
  *   **The Statisticians (Epistemic Duty):** Withholding a valid descriptive statistic is a form of censorship. The duty of the scientist is to describe the world accurately. If the public misinterprets the description, the solution is better education, not less data.
  *   **The Skeptics (Harm Reduction):** The duty of the scientist includes anticipating the downstream use of their data. If a statistic is "misread by virtually everyone who touches it," the statistic is functionally misleading. Publishing it prominently is negligent.

  **What Counts as Progress:**
  *   **No Empirical Resolution:** You cannot run a study to determine whether scientists *should* prioritize truth-telling or harm reduction. This is a value judgment.
  *   **Negotiated Norms:** Progress here looks like a professional consensus on *presentation*, not *content*. For example: "Heritability estimates may be published in technical literature but require specific contextual framing in abstracts and press releases."
  *   **Current Status:** **Do not expect this component to be "solved."** It tracks a fundamental tension in liberal democracies between free inquiry and social responsibility. The seminar will keep fighting here because one side views the other as intellectually cowardly (Skeptics hiding data) and the other views the one as socially reckless (Statisticians fueling determinism).

  ### 4. The Philosophical Dispute: What Counts as Explanation?
  **Nature of Disagreement:** Philosophical (Intractable).
  **Where it lies:** Your "third element."
  *   **The Statisticians** operate with a **Predictive/Statistical** model of explanation. To explain a trait is to account for its variance. If genes account for 50% of the variance, we have explained 50% of the trait.
  *   **The Skeptics** operate with a **Mechanistic/Causal** model of explanation. To explain a trait is to describe the developmental process. Partitioning variance without describing the mechanism (e.g., *how* the genes build the trait) is not explanation; it is merely bookkeeping.

  **What Counts as Progress:**
  *   **Acknowledgment of Limits:** Progress requires the Statisticians to admit that variance partitioning is not causal explanation, and the Skeptics to admit that variance partitioning is useful for prediction (e.g., in breeding or risk assessment) even without mechanistic understanding.
  *   **Current Status:** **No progress should be expected.** This is a standoff between two philosophies of science (Hempel's covering law vs. Salmon's causal processes). Unless the seminar agrees on what "explanation" means, they will not agree on whether heritability provides it.

  ### Summary Diagnosis

  Your seminar is stuck because you are treating a three-layer cake as a single slice.

  1.  **30% Empirical:** (How common are crossover interactions?) **Progress is possible** via data and formal modeling.
  2.  **30% Conceptual:** (Does this number describe data or causes?) **Progress is possible** via stricter terminology and reporting standards.
  3.  **40% Normative/Philosophical:** (What are our duties? What is explanation?) **Progress is unlikely.** This is a value conflict.

  **Recommendation for the Seminar:**
  The fight will only de-escalate if you explicitly decouple these layers. Propose a rule: *We are allowed to disagree on the ethics of publication (Layer 3) and the philosophy of explanation (Layer 4), but we must agree on the empirical conditions under which the additive model fails (Layer 1) and the precise definition of the statistic being used (Layer 2).*

  If you can force the room to admit, "We agree on the math, we agree on the PKU case, we disagree on whether publishing this number is dangerous," the temperature will drop. You will find that the Statisticians and Skeptics are often allies on the empirical science, but adversaries on the sociology of science. Recognizing that distinction is the only way to stop the ritual reenactment.
