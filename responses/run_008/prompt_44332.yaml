  Glaciers grind the valley floor to dust,
  A million years in layers of red rust,
  The wind carves arches out of solid stone,
  No human hand has marked this plain,
  The coastline sleeps beneath the rain.

  Silk roads fray and shift across the sand,
  Grain prices drift like smoke above the land,
  An empire stretches out its slow decree
  Before it fades into the forest quietly.
  The coastline sleeps beneath the rain.

  Guns flash, eighteen-fifteen, the roar,
  Names shouted, dying men upon the floor,
  Headlines burn and vanish in the wind,
  They crash their bodies on the shore where
  The coastline sleeps beneath the rain.

  The markets close, the coins are melted down,
  Ivy wears the cathedral like a crown,
  Generations pass without a single name,
  Tides return to wash away the fame.
  The coastline sleeps beneath the rain.

  I stand here watching minutes tick away,
  While centuries dissolve into the day,
  The foam is white and frantic on the crest,
  But silence holds the ocean in its chest,
  The coastline sleeps beneath the rain.

  Where does a life belong on these three clocks?
  What does it cost to be the foam on rocks?
