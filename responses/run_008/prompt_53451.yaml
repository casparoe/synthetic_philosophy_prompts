  ### Analysis of D.'s Heuristic Profile

  D. operates as a **Heuristic Hygienist**. He does not reject heuristics outright; rather, he maintains a strict taxonomy of *when* the bridge between informal argument and reality is structurally sound. His track record reveals a tension between the **purity of the object's generation** (provenance) and the **empirical validation of the specific instance** (scrutiny).

  Here are two candidate rules that rationalize his four prior verdicts, followed by my prediction for the "coin-flip hash."

  ### Candidate Rules

  **Rule 1: The Anti-Selection Bias Principle (Provenance)**
  *   **Formulation:** Trust independence heuristics only when the object's relevant properties arise from a process that is *blind* to those properties. Distrust heuristics when the object has been selectively optimized or engineered to exhibit the very properties the heuristic assumes (selection bias).
  *   **Rationalization:**
      *   *Case 1 (Primes):* Random numbers are blind; adversarial numbers are optimized to fool tests (Carmichael).
      *   *Case 2 (Graphs):* Random graphs are blind samples; the heuristic holds because no one tuned the edges to defeat coloring.
