      *   *Case 4 (ROM):* Natural schemes weren't engineered to break the ROM; contrived schemes were optimized to exploit the gap between the model and reality.
  *   **Prediction for Coin-Flip Hash:** **Trust.** The hash was generated by a blind seeded generator. It was *not* optimized for cryptographic properties or random-lookingness. It is the epitome of provenance purity, avoiding the sin of SHA-256.

  **Rule 2: The Instance Validation Principle (Scrutiny)**
  *   **Formulation:** Trust independence heuristics for a specific instance only when known failure modes of the heuristic have been empirically excluded for that instance. A "random" generation process guarantees ensemble properties, but not instance-specific safety.
  *   **Rationalization:**
      *   *Case 1 (Primes):* **Trust (conditional).** He runs Fermat tests. He does not trust a random number *until* he has ruled out the rare failure modes (Carmichael numbers).
