      *(Self-Correction during drafting)*: Make sure I don't just say "Lakatos is better." I need to specify *why*. Lakatos handles the "ad hoc" nature of the fixist defenses (sinking land bridges) better than Kuhn's "anomaly accumulation." Kuhn implies anomalies just pile up until break; Lakatos explains *why* they pile up (degenerating shift).
      Also, ensure I address Oreskes' point about Wegener. It wasn't irrational to reject him in 1920. Kuhn sometimes implies resistance is irrational dogma. This case shows resistance can be methodologically sound.

      *(Refining the "Standards of Evidence" point)*: In the mapping, emphasize the shift from *descriptive* geology to *explanatory* geophysics. That is a change in standards, which supports Kuhn slightly, but the fact that both sides agreed on the *value* of geophysics undermines the incommensurability claim.

      *(Final Polish)*: Ensure the tone is analytical, not textbook-like. Use the user's vocabulary without defining it.

  7.  **Final Review against constraints:**
      *   Mapping explicit? Yes.
      *   Assess fit honestly? Yes.
      *   Kuhn's later softening? Yes.
      *   What episode says about theory/Alternatives? Yes.
      *   No definition recitation? Yes.

