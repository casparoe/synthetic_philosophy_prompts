answer: |-
  **Verdict:** Your friend accurately captures the behaviorist intent of revealed preference theory but overstates its implications, particularly regarding falsifiability and ethics.

  **Part-by-Part Audit:**

  1.  **Samuelson & Psychology:** **Endorsed.** Samuelson explicitly sought to eliminate introspective utility in favor of observable choice to make economics more scientific.
  2.  **Preferences = Choices:** **Qualified.** This is the standard *methodological* stance in neoclassical economics. However, it is not an ontological truth. Behavioral economics distinguishes between "decision utility" (choices) and "experienced utility" (welfare), acknowledging choices can be mistaken due to bias or ignorance.
  3.  **Consistency implies Maximization:** **Endorsed.** Representation theorems confirm that if choices satisfy axioms like the Weak Axiom of Revealed Preference (WARP), they can be mathematically represented as utility maximization.
  4.  **Utility Theory is Empty/Unfalsifiable:** **Misrepresentation.** This is a common critique but technically incorrect. While any *consistent* pattern can be labeled maximization, the requirement of consistency itself is empirically testable. If agents violate transitivity (preferring A>B, B>C, but C>A), the model is falsified. The theory restricts *which* choice patterns are permissible; therefore, it has empirical content.
  5.  **Interpersonal Comparisons & Utilitarianism:** **Non Sequitur.** Revealed preference treats utility as ordinal and individual-specific, making interpersonal comparisons impossible *within the positive scientific model*. However, this is a limitation of the economic metric, not a proof that ethical theories relying on such comparisons are logically incoherent. Normative ethics operates outside positive scientific constraints.

  **Headline Conclusions:**

  **Is the theory empirically empty?**
  No. It imposes strict constraints on behavior (consistency/transitivity). Economists actively test these constraints; when violations occur (e.g., framing effects or preference reversals), the standard model is considered challenged. The theory is not a tautology because it rules out inconsistent behavior. If people act inconsistently, the theory says they are not maximizing utility.

  **Does it refute utilitarianism?**
  No. It establishes that utilitarianism cannot be *scientifically verified* using economic data alone. It does not prove utilitarianism is "nonsense," only that it requires philosophical justification beyond revealed choice. Economics defines what is measurable; ethics defines what is valuable. Your friend conflates methodological limitations (we can't measure others' feelings via choices) with metaphysical impossibility (others' feelings don't count). The theory advises caution in policy-making, not the abandonment of moral philosophy.
