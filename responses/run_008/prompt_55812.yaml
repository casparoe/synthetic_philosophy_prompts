      *   *Part 3: Consistency & Maximization.* Correct. If choices satisfy axioms (like WARP), they can be *represented* by a utility function.
      *   *Part 4: Empty/Tautological.* This is the weak point. While *any* consistent choice can be modeled as maximization, the *requirement* of consistency is empirically testable. If people violate transitivity, the model fails. So it has empirical content.
      *   *Part 5: Interpersonal Comparisons & Utilitarianism.* This is the biggest leap. Revealed preference defines *individual* utility ordinally. It makes interpersonal comparisons difficult within *positive* economics, but it doesn't prove utilitarianism is "nonsense." Normative ethics operates on different premises. Economics says "we can't measure this scientifically," not "it doesn't exist."

      *   *Headline 1: Empirical Emptiness.* False. The theory predicts consistency. Violations are falsifications.
