answer: |-
  Your friend did not make that up. You have stumbled directly into a well-documented problem in political philosophy and economics called the **Discursive Dilemma** (sometimes known as the **Doctrinal Paradox**).

  The specific theorem your friend is recalling is likely the **List-Pettit Theorem** (2002), which is the judgment-aggregation cousin of the famous **Arrow's Impossibility Theorem**.

  Here is the breakdown of the theory, why your deadlock is mathematically inevitable under certain conditions, and how to resolve it practically—especially given that you announced the rules to the candidate.

  ### 1. The Theory: Why This Happened
  Your friend is essentially correct. In social choice theory, there are impossibility results showing that you cannot have a voting system that satisfies all intuitive fairness criteria at once.

  *   **Arrow's Impossibility Theorem** deals with ranking preferences (e.g., Candidate A > Candidate B). It proves that no rank-order voting system can be fair, consistent, and non-dictatorial all at once.
  *   **The List-Pettit Theorem** deals with **judgment aggregation** (your situation). It proves that if a group votes on logically connected propositions (Style + Budget = Hire), you cannot satisfy all of the following simultaneously:
      1.  **Universal Domain:** Any combination of individual votes is allowed.
      2.  **Consistency:** The group's judgments must be logically consistent (you can't say "Yes" to Style, "Yes" to Budget, but "No" to Hire).
      3.  **Systematicity/Independence:** The vote on each proposition is treated equally and independently.
      4.  **Non-Dictatorship:** No single person determines the outcome.

  **The Paradox:**
  You chose a **Premise-Based Procedure** (vote on Style and Budget separately, then derive the result). This satisfies consistency with the *rules*, but it can violate the majority will on the *outcome*.
  Ada wants a **Conclusion-Based Procedure** (vote on Hire directly). This satisfies the majority will on the outcome, but it can violate logical consistency with the *criteria*.

  Mathematically, there is no perfect bridge between the two. One side must "fail" in terms of ideal democratic theory. So, to answer your question: **You do have to pick which failure you hate least.**

  ### 2. The Ethical Twist: The Announcement
  You mentioned a crucial detail: *"We did announce the criteria rule in advance, and the illustrator heard us announce it."*

  This changes the problem from a purely mathematical paradox to a **procedural justice** issue. In legal and ethical terms, the candidate has a **reliance interest**. They structured their pitch and expectations based on the rules you set.

  *   **Dilip's Argument (Procedural Integrity):** He is right. If you change the aggregation method *after* the votes are cast (or after the candidate has performed), you are moving the goalposts. Even if the outcome feels "wrong" to the majority of the panel, the panel agreed to be bound by the criteria to ensure fairness to the applicant.
  *   **Ada's Argument (Substantive Will):** She is right that the panel's job is to exercise judgment. If the criteria produce a result the panel overwhelmingly rejects, the criteria are flawed. *However*, fixing flawed criteria is a job for *next year*, not this candidate.

  ### 3. A Principled Way Out
  Since you cannot solve the math, you must solve the ethics. Here is the recommended path:

  **Step 1: Honor the Announced Rule (Hire the Illustrator)**
  You must follow Dilip's advice for this specific contract.
  *   **Reasoning:** You created a contract of sorts with the candidate when you announced the rules. To reject them now because "the majority actually meant something else" is bad faith. It exposes your studio to reputational damage and potential grievances.
  *   **The Cost:** You hire someone two of you have reservations about. This is the price of maintaining procedural integrity.

  **Step 2: Acknowledge the Paradox to the Panel**
  Tell Ada: "You are right that this result is counter-intuitive, and there is a mathematical theorem that proves why. But because we announced the rule to the candidate, we are bound by it this time. We cannot punish the candidate for our voting system's flaw."

  **Step 3: Reform the Process for Next Year**
  The Discursive Dilemma suggests your current voting system is fragile. For the next contract, choose one of these fixes:
  *   **Switch to Conclusion-Based Voting:** Vote on "Hire/No-Hire" directly. Discuss style and budget during deliberation, but make the binding vote about the outcome. This aligns with Ada's intuition.
  *   **Require Unanimity on Criteria:** If you stick with the premise-based rule, require that *all* judges agree on Style and Budget. This prevents the "2-1 pass" that leads to the paradox.
  *   **Weighted Scoring:** Instead of binary Yes/No, use a 1–10 scale. A low score on Budget might mathematically cancel out a high score on Style, preventing the "bare majority" problem Dilip and Ada encountered.
  *   **Deliberative Voting:** Vote, discuss, then vote again. Often, the paradox resolves itself once judges realize their colleagues' dealbreakers (e.g., Ada might have voted Yes on Budget if she knew Dilip thought it was too close).

  ### Summary
  Your friend is right: the theory is real, and the deadlock is structural. You cannot have a system that is perfectly democratic, perfectly logical, and perfectly non-dictatorial all at once.

  However, the **announcement of the rules** breaks the tie. In a vacuum, Ada's democratic intuition is strong. But because an external party relied on your announced procedure, **Dilip is right.** You must honor the rule this time to preserve the integrity of your studio's process, even if it feels unsatisfying. Fix the voting system for next year, but don't let the candidate pay the price for this year's theoretical confusion.
