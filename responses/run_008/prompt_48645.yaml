          *   *Result under Direct Vote:* Reject (2-1).
      *   **The Conflict:** The premise-based rule says "Hire," but the conclusion-based vote says "Reject."
      *   **The Characters' Stances:**
          *   Dilip: Follow the announced rule (Rule of Law/Consistency).
          *   Ada: Follow the panel's actual will (Democratic/Outcome-based).
