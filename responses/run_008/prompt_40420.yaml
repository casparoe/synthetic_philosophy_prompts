  The three verdicts
  Strong economism denies the scenario's possibility. It must assert the monk's arrival or the Rite's acceptance was secretly caused by latent economic tensions, such as rising productivity making labor dues inefficient. To deny the exogeneity is to render HM unfalsifiable; any counter-example is reinterpreted as cryptic economic determination. This costs the theory empirical content, reducing it to a definitional truth where "economy" simply means "whatever causes history." It cannot admit accidents.

  The conciliatory (Engelsian) reading accepts Phase 1 (autonomy) and Phase 2 (reaction). It claims victory in Phase 3: the base ultimately selected the doctrinal variant that fit it. However, this risks immunization. If "ultimately" allows indefinite lag, any divergence is absorbed. Victory depends on whether Phase 3 is a necessary structural adjustment or a post-hoc observation. If the theory cannot specify *when* the base must reassert control, it explains everything and nothing. It saves the thesis by making determination asymptotic.

  Cohen's functionalism explains the Rite's persistence, not its origin. It argues the Rite survived *because* it stabilized the new cash base. But this collapses into tautology unless a selection mechanism is specified. Did lords enforce it? Did market failure eliminate non-believers? Without a mechanism, "functional" means only "survived," offering no explanatory power beyond survival bias. It fails to distinguish between lucky accidents and selected traits, leaving the causal link between function and persistence obscure.

  The load-bearing feature
  The exogeneity of the founder event is the load-bearing feature. The case hinges on the doctrinal spark being truly independent of the economic base. If the monk's arrival or the doctrine's appeal can be traced to material conditions (e.g., psychological stress from exploitation), the scenario collapses into standard historical materialism. The stress-test only works if the superstructure initiates the causal chain. Without this stipulation, the divergence is merely delayed economic determination.

  The determinist's counterattack
