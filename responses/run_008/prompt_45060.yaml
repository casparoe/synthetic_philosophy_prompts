      *   **Task:** Audit the analogy. Map person-knowledge vs. character-knowledge. Map the three stances to the character case. Identify where the mapping breaks. Determine which disanalogies matter for the claim ("she wouldn't take the job," "fact of the matter"). Evaluate if the conclusion survives (is she a real pattern? is it just consistency?).
      *   **Constraint:** Write as continuous prose. No headings, no bullet points, no bold, no tables. Flowing paragraphs, like a considered email to a friend.

  2.  **Deconstruct the Philosophical Issues:**
      *   **The Workshop Analogy:** Characters feel autonomous. They "push back." This is a common phenomenological experience for writers.
      *   **Dennett's Real Patterns:** Something is real if it exhibits patterns that allow for successful prediction and compression of data, even if it's not a fundamental physical object. (e.g., centers of gravity, words, beliefs).
      *   **Dennett's Three Stances:**
          *   *Physical:* Predict based on physical constitution/laws.
          *   *Design:* Predict based on function/purpose.
          *   *Intentional:* Predict based on beliefs, desires, and rationality.
      *   **The Problem:** In fiction, the author is the creator (Design) and the interpreter (Intentional). The "physical" base is text/mental states. There is no external world for the character to track.
      *   **The Core Question:** Is the character's autonomy real (in Dennett's sense) or just an illusion of the author's consistency? Does the "fact of the matter" exist independently?

  3.  **Drafting - Section by Section (Mental Outline):**
