          *   Intentional: Treating the character as having beliefs/desires to predict actions.
      *   *The Breakdown:* In real people, the stances are distinct layers. In fiction, the Design stance (author's plan) *creates* the Physical (text) and dictates the Intentional (character psychology). There's a collapse of independence.
      *   *Real Patterns:* Dennett says patterns are real if they support prediction. Does the character support prediction? Yes, but only relative to the author's internal consistency or the reader's interpretation.
      *   *The "Fact of the Matter":* For real people, facts exist independently. For characters, the facts are constitutive. If the author changes the text, the fact changes. However, within the *constraint* of the established text, there is a logical consistency that feels like independence.
      *   *Conclusion:* The analogy holds pragmatically (for writing) but fails ontologically. The "push back" is the author encountering their own prior commitments. It's still a "real pattern" relative to the text, but not independent of the author. The conclusion survives partially: she is a real pattern *within the work*, but not independent of the creator.

