answer: |-
  It is a pleasure to hear from you, and I have been turning this puzzle over in my mind since I read your note because it strikes at something I think many of us feel but rarely scrutinize with such philosophical care. That sensation of a character pushing back is one of the most uncanny experiences in the creative life, and it is entirely understandable why your workshop leans on it as evidence of autonomy. You are asking whether this feeling is a genuine encounter with a real pattern in the Dennettian sense or merely a shadow play of your own consistency, and to answer that, we really do need to walk through the mapping you proposed with a fine-toothed comb. Let us start by laying out the three stances as they apply to a human person versus how they apply to your fictional character, because the friction appears exactly where the layers fail to separate.

  When you take the physical stance toward a real person, you are predicting their behavior based on the laws of physics and their material constitution, perhaps noting that a blow to the head will cause them to fall. For your character, the physical stance is indeed the words on the page or the neural firings in your own head as you compose them. There is no biology there, only ink or mental states. When you take the design stance toward a person, you treat them as an artifact of evolution or culture, predicting behavior based on their function or purpose, like assuming a heart pumps blood or a teacher teaches. For the character, the design stance is precisely what you identified: it is you, the author, with your plot outline and your thematic goals. You know what role she is supposed to play in the narrative machinery. Finally, the intentional stance is where you treat the entity as a rational agent with beliefs and desires to predict their actions. This is the workshop mode, where you ask what she wants and what she believes about Lisbon.

  The trouble begins when we look at the relationship between these stances in the two different cases. For a real person, these stances are distinct layers of description that happen to converge on the same object. The physical facts constrain the design, and the design constrains the intentional, but none of them are wholly determined by a single conscious mind in real time. For your character, however, you occupy the position of the designer and the interpreter simultaneously. The design stance does not just predict the character; it constitutes them. If you decide in the design stance that she must take the job in Lisbon to make the third act work, you can simply write the words in the physical stance that say she took the job. There is no external physical reality to resist you. So when you feel that resistance, when you feel she would not take the job, it cannot be coming from the world, because there is no world. It must be coming from the tension between your design stance and your own prior commitments in the intentional stance.

  This is where the analogy starts to fray, but perhaps not where you fear it does. You worry that the predictability is just you being consistent with your earlier drafts, a trick that would vanish if you weren't the only reader. But consider what Dennett means by a real pattern. He argues that something is real if adopting a certain stance toward it allows for successful prediction and compression of information, regardless of whether it is made of fundamental particles. A center of gravity is a real pattern, even though you cannot trip over it. Your character is a pattern established by the text you have already written. When you say she would not take the job, you are recognizing that writing her taking the job would violate the pattern you have already instantiated. It would require more explanatory work to justify the deviation than to follow the trajectory. The resistance you feel is the cognitive cost of breaking the compression. You have built a model of her that predicts her behavior efficiently, and forcing her to act against that model destroys the efficiency. In that specific sense, she is a real pattern. The pattern exists in the text and in your mind, and it has constraints.

  However, the disanalogy that matters most for your workshop's claim is the independence of the fact of the matter. When your friends say there is a fact of the matter about what she would do independent of you, they are smuggling in a metaphysical claim that the Dennettian framework does not support for fiction. For a real person, the fact of the matter exists because there is a causal history independent of your observation. For a character, the fact of the matter is constitutive of the text. If you change the text, you change the fact. There is no deeper layer of character reality beneath the words to appeal to. If you rewrite the early chapters to make her more adventurous, then suddenly she would take the job in Lisbon. The fact of the matter is relative to the current state of the manuscript, not independent of the author. So the claim that she has a life of her own in the way a person does is strictly false if taken ontologically. She does not track a world; she tracks your consistency.

  Yet, and this is crucial for your practice, the conclusion survives in a pragmatic sense. You asked if the predictability would vanish the moment you weren't the only reader. I would argue it would not, because once the text is fixed, the pattern becomes public. A reader can take the intentional stance toward your character and make predictions that you, the author, might not have explicitly planned but which are supported by the pattern you created. If a reader says she wouldn't take the job based on the first half of the book, and you try to make her take it in the second half, the reader will cry foul. They will say you broke character. In that intersubjective space between author and reader, the character acquires a kind of objectivity. The pattern is real enough to constrain both of you. The resistance you feel is you anticipating the reader's rejection of the inconsistency. You are internalizing the audience's intentional stance.

  So where does this leave your workshop analogy? It is a vital heuristic, even if it is a metaphysical category error. Telling yourself the character is real protects the integrity of the pattern. If you view them as mere puppets of the design stance, you are tempted to violate the intentional stance for the sake of plot, which results in bad writing because it breaks the compression that makes the story intelligible. The feeling of pushback is your brain signaling that the cost of violating the pattern is too high. It is not that she exists independently of you, but that the pattern you have created has logical consequences that you must discover rather than invent. You are not finding a person; you are finding the implications of your own prior definitions.

  Ultimately, you can keep telling people your characters are real patterns in the Dennettian sense, provided you understand that the reality is relative to the text, not the world. The pattern is real because it supports prediction and explanation. The autonomy is real because the constraints are binding once the pattern is established. But you must accept that you are both the god who created the laws of physics for this universe and the scientist observing them. The fact of the matter about Lisbon exists, but it exists only within the closure of the work. The analogy holds up well enough to justify the practice of listening to your characters, because ignoring them means ignoring the internal logic of the work you are building. The vandalism your friends speak of is real, but it is vandalism of the pattern, not of a person. You are not hurting her; you are breaking the machine you built to simulate her. And since the goal of the novel is to make that simulation feel lifelike, treating the simulation as if it were life is the only way to keep the engine running smoothly. So write on, and listen to that pushback, not because she is out there waiting for you, but because you have built something here that is sturdy enough to resist your own careless hands.
