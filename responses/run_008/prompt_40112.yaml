answer: |-
  Your flatmate has given you a very competent 'undergraduate survey' version of literary theory. It is the sort of summary that gets a B+ in a first-year essay but would be picked apart in a third-year seminar or by a philosopher of language. She has the broad strokes right—there was a shift away from authorial intention in the mid-20th century—but she has conflated distinct movements, confused epistemological arguments with semantic ones, and presented a contested debate as a settled historical fact.

  If she wants her podcast to be rigorous, she needs to untangle three specific knots: the difference between American New Criticism and French Post-structuralism, the distinction between *knowing* intentions and intentions *constituting* meaning, and the actual status of intentionalism today.

  Here is a claim-by-claim breakdown of where she is right, where she is wobbling, and how a modern intentionalist would dismantle her summary.

  ### 1. The Conflation: New Critics vs. 'The Death of the Author'
  **Her Claim:** The 1940s American New Critics argued the author died before we got to the text (quoting a French guy).
  **The Correction:** She has merged two different movements separated by twenty years and an ocean.

  *   **The New Critics (US, 1940s):** The specific essay she is referencing is likely 'The Intentional Fallacy' (1946) by W.K. Wimsatt and Monroe Beardsley. Their argument was methodological. They argued that judging a poem's success by the author's psychological state was a mistake. However, they did not use the rhetoric of the 'death' of the author. They believed the text was an autonomous verbal icon.
  *   **The French Theorists (1960s):** The quote about the author dying comes from Roland Barthes' 1967 essay 'The Death of the Author'. This is a much more radical, post-structuralist claim. Barthes wasn't just saying 'we can't know what they meant'; he was arguing that 'the Author' is a modern capitalist construct that limits the text. For Barthes, the author doesn't just die physically; the *function* of the author must be abolished to liberate the reader.

  **The Intentionalist Response:** A careful scholar would never cite Barthes to explain Wimsatt. By lumping them together, she obscures the fact that New Criticism was about close reading and aesthetic unity, whereas Barthes was about political and philosophical liberation.

  ### 2. The Argument: Epistemic vs. Semantic
  **Her Claim:** Intentions are not available to readers, so we must rely on the text.
  **The Correction:** She is confusing an *epistemic* problem (what we can know) with a *semantic* thesis (what meaning *is*).

  *   **The Epistemic Point:** 'We cannot know what was in Shakespeare's head.' This is true, but trivial. Anti-intentionalists often hide behind this, but it's a weak defence. Just because something is hard to know doesn't mean it doesn't exist or determine meaning.
  *   **The Semantic Point:** 'Meaning is determined by public linguistic conventions, not private mental states.' This is the actual heavy lifting of the anti-intentionalist argument. They argue that once a text is published, it belongs to the language, not the writer.

  **The Intentionalist Response:** A modern intentionalist (drawing on the philosopher H.P. Grice) would argue that communication *just is* the recognition of an intention. If I leave a note saying 'Meet me at the bank', and you wonder if I mean a river bank or a financial institution, you are trying to recover my intention. The words alone cannot decide it. Therefore, meaning *is* intended meaning. The flatmate's claim that 'a poem means whatever its words mean in the language' ignores ambiguity, irony, and metaphor, all of which require inferring intention to resolve.

  ### 3. The Status: 'Refuted' vs. 'Contested'
  **Her Claim:** Intentionalism is a refuted position; nobody serious holds it anymore.
  **The Correction:** This is historically false. Intentionalism never went away; it went underground and then came back stronger.

  *   **The Counter-Attack:** In 1967 (the same year as Barthes), E.D. Hirsch Jr. published *Validity in Interpretation*, a rigorous defence of intentionalism. He distinguished between 'meaning' (what the author intended) and 'significance' (how we value it today). He argued that without authorial meaning, there is no norm for validity, and interpretation becomes solipsistic.
  *   **Philosophy of Language:** In analytic philosophy, intentionalism is actually the dominant view. Philosophers like Quentin Skinner (historical context) and Alexander Nehamas have argued that treating texts as detached from agents makes it impossible to distinguish between a text *meaning* something and a text *causing* a reaction in a reader.

  **The Verdict:** She cannot say it is 'refuted'. She can say it fell out of favour in certain literary theory circles between 1970 and 1990, but it remains a robust position in philosophy, history, and law.

  ### 4. The Evidence: Biographical Material
  **Her Claim:** Biographical material is never legitimate evidence.
  **The Correction:** This is the 'New Critical orthodoxy', but it is practically impossible to maintain.

  *   **Context is Key:** Even anti-intentionalists use literary history. If you argue a poem is ironic because of the conventions of 18th-century satire, you are using historical context. The line between 'literary history' (allowed) and 'biography' (forbidden) is porous. Knowing an author was a devout Catholic, for instance, might be 'biographical', but it is also essential for understanding their use of sacramental imagery.
  *   **The Intentionalist View:** Biographical evidence is admissible as *clues* to intention. It is not conclusive proof (authors lie or change their minds), but it is part of the total evidence package. To say it is 'never legitimate' is to blind oneself to how language actually works in context.

  ### 5. The Author's Statement: 'I Meant X'
  **Her Claim:** If an author says 'I meant X', that tells us nothing; they are misreading their own work like anyone else.
  **The Correction:** This is the most contentious point, and her absolute stance is vulnerable.

  *   **The Anti-Intentionalist View:** Once the work is public, the author has no special authority. They might have failed to execute their intention. If they intended to write a tragedy but wrote a comedy, the text is a comedy.
  *   **The Intentionalist View:** The author has *privileged*, though not infallible, access. If an author says, 'That passage is ironic,' and there is nothing in the text that contradicts it, we should generally accept that. To reject it is to claim we know the author's mind better than they do.
  *   **The Nuance:** There is a difference between *success* and *meaning*. An author can be wrong about whether they *succeeded* (aesthetic judgment), but they are the ultimate authority on what they were *trying to do* (semantic intention). If Keats says 'I intended this image to suggest mortality', we cannot say 'No, it suggests teapots'.

  ### Summary for the Podcast
  If she wants to be accurate without losing the narrative flow, she should adjust her script as follows:

  1.  **Distinguish the Movements:** Acknowledge that Wimsatt and Beardsley (New Criticism) started the 'Intentional Fallacy' argument on methodological grounds, while Barthes (Post-structuralism) later radicalised it into the 'Death of the Author'.
  2.  **Soften the 'Refuted' Claim:** State that intentionalism was the dominant target of theory in the late 20th century, but remains a live and respected position in philosophy and history. It is not a dead horse.
  3.  **Clarify the Evidence:** Instead of 'never legitimate', say that New Critics argued biographical evidence was secondary to textual analysis, but most modern critics accept context as vital for establishing linguistic norms.
  4.  **The Author's Voice:** Acknowledge that while an author's statement doesn't guarantee a successful reading, it carries significant weight in determining what was intended, distinguishing between what a text *says* and what it *does*.

  **The Bottom Line:** Her summary is a faithful reproduction of a specific, somewhat dogmatic strand of literary theory from the 1970s and 80s. It is not, however, an accurate description of the current philosophical consensus or the nuances of the debate. She is presenting a partisan victory as a historical fact. Tell her to dial back the certainty; the 'Intentional Fallacy' is a warning, not a law of physics.
