answer: |-
  Your diagnosis is sharp, and it aligns with a significant shift in the literature over the last decade. You are largely correct that the stalemate has migrated from metaethics to general epistemology. However, to say it is *only* about a general epistemological norm risks overlooking why morality remains the privileged battleground for this norm.

  Here is an assessment of your hypothesis, broken down by what is settled, what is contested, and what would actually count as progress.

  ### 1. The Epistemological Core: Your Hypothesis
  **Verdict:** **Mostly Correct, but with a Domain-Specific Caveat.**

  **What is Settled:**
  It is now widely acknowledged by both sides (Street, Enoch, Wielenberg, Vavova, Lutz) that the force of an Evolutionary Debunking Argument (EDA) depends entirely on the **epistemological premise**. Specifically, the debate turns on whether justification requires a *positive explanation of reliability* (a "genealogical vindication") or whether justification is *default* until a specific defeater is provided.
  *   **Street/Joyce Side:** Implicitly relies on a requirement that beliefs must be "sensitive" or "safe" with respect to the truth, or that we need a positive reason to think our faculties track mind-independent truths.
  *   **Realist Side (Wielenberg/Lutz):** Relies on a "dogmatism" or "conservatism" in epistemology: we are entitled to trust our cognitive faculties (including moral intuition) unless given a specific reason to doubt them (a "defeater-defeater").

  **What is Contested:**
  The contested issue is not just *which* epistemological norm is correct, but **whether morality triggers the skeptical norm more than other domains.**
  If the debate were purely about general epistemology, the "Companions-in-Guilt" move (math, logic, modality) would have settled it. If math survives the EDA, morality should too. The fact that this move hasn't killed the debate suggests the disagreement isn't *just* about the general norm, but about **domain specificity**.
  *   **The Substantive Hiding Spot:** Critics of realism argue morality is *relevantly disanalogous* to math. Math might be constitutive of rational thought (you can't reason without it), whereas moral beliefs are arguably more contingent on reproductive fitness. Therefore, the epistemological norm might apply "stricter scrutiny" to morality than to logic.
  *   **The Metaphysical Hiding Spot:** The difficulty of the "tracking" story depends on the *metaphysics* of moral truth. If moral truths are natural properties, tracking is easier (causal connection). If they are non-natural (as Enoch and many realists posit), the "link" is mysterious. Thus, the epistemological stalemate is fueled by a metaphysical disagreement about the *nature* of the truth being tracked.

  **Diagnosis:** You are right that the *engine* of the stalemate is epistemological (the burden of proof regarding reliability). But the *fuel* is still metaethical (whether moral truths are the kind of things that can be tracked given our evolutionary history).

  ### 2. The Scientific and Explanatory Premises
  You asked if there is genuine disagreement about evolutionary facts or what counts as a debunking explanation.

  **The Scientific Premise (Evolutionary Facts):**
  *   **Settled:** Everyone agrees evolution shaped *some* of our evaluative tendencies (e.g., care for kin, reciprocity).
  *   **Contested:** How *specific* are these tendencies?
      *   **Strong Debunkers (Joyce/Street):** Argue evolution shaped specific normative *contents* (e.g., "suffering is bad" was selected for).
      *   **Realists (Enoch/Rowland):** Argue evolution shaped general *capacities* (e.g., reasoning, empathy), and specific moral truths are discovered by those capacities.
      *   **Progress Barrier:** This is an empirical bottleneck. Until evolutionary psychology specifies whether we have a "moral module" or general learning mechanisms, the "scientific premise" remains a philosophical placeholder.

  **The Explanatory Premise (What counts as debunking?):**
  *   **Contested:** There is no consensus on what constitutes a sufficient "explanation of reliability."
      *   **Enoch's Third-Factor:** Argues that survival is *itself* good, so evolution tracking survival indirectly tracks moral truth.
      *   **Critique (Vavova/Street):** This explains why we believe *some* truths (survival is good), but not why we believe *specific* complex moral truths (distributive justice, rights).
      *   **The Stalemate:** Realists say the Third-Factor is enough to break the "coincidence" charge. Debunkers say it is too coarse-grained to explain the *accuracy* of our specific moral beliefs. This is a dispute about the **granularity of explanation** required for justification.

  ### 3. What Would Count as Progress?
  Given the stalemate, a "proof" of realism or anti-realism is unlikely. Progress would look like one of the following three developments:

  **A. A Formal Epistemological Model (The Most Likely Path)**
  Progress requires moving away from intuitions about "coincidence" to formal models of reliability.
  *   **What it looks like:** Applying **process reliabilism** or **modal epistemology (safety/sensitivity)** rigorously to normative domains.
  *   **The Hurdle:** We need a consensus on whether "safety" (could I have easily been wrong?) is the correct metric for normative belief. If moral truths are necessary truths (as many realists claim), it is hard to be "unsafe" about them (you can't easily believe a false necessary truth if you believe a necessary truth).
  *   **Progress Marker:** If epistemologists agree that "sensitivity" is not required for necessary truths, EDAs lose force against non-naturalist realism. If they agree that "explanatory connection" is required regardless of necessity, EDAs gain force.

  **B. Empirical Narrowing of the Scientific Premise**
  *   **What it looks like:** Evolutionary psychology or moral psychology provides data showing that specific moral beliefs (e.g., "torture is wrong") are *not* direct adaptations but byproducts of general reasoning.
  *   **Progress Marker:** If data shows moral beliefs are highly plastic and culturally variable (weak evolutionary determination), the EDA weakens. If data shows rigid, universal moral instincts (strong evolutionary determination), the EDA strengthens. Currently, the data is mixed enough that both sides can cherry-pick.

  **C. Distinguishing "Global" vs. "Local" Debunking**
  *   **What it looks like:** Abandoning the attempt to debunk *all* of morality.
  *   **Progress Marker:** The field is already moving here. Instead of "Morality is debunked," the argument becomes "Deontological constraints are debunked, but consequentialist reasoning is not," or "Folk morality is debunked, but reflective equilibrium is not."
  *   **Why it matters:** This dissolves the "all or nothing" stalemate. It admits the epistemological norm applies *locally* where evolutionary influence is direct, but not where reasoning overrides instinct.

  ### 4. Summary of Consensus vs. Contention

  To be upfront as requested:

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **EDAs rely on an epistemological premise.** | **Settled** | Everyone agrees the argument lives or dies by the norm of justification. |
  | **The epistemological norm is neutral.** | **Contested** | Realists argue the norm presupposes skepticism; Debunkers argue it's a minimal condition on knowledge. |
  | **Math/Logic are perfect analogues.** | **Contested** | Realists say yes (Companions-in-Guilt); Debunkers say no (Morality is action-guiding/contingent). |
  | **Enoch's Third-Factor succeeds.** | **Contested** | Critics argue it explains too little (survival) to vindicate specific moral truths. |
  | **Evolution shaped specific moral contents.** | **Contested** | Empirical uncertainty allows both sides to posit favorable evolutionary stories. |
  | **The debate is purely metaethical.** | **False** | As you noted, it is now primarily a debate in general epistemology. |

  ### Final Call
  Your hypothesis is **80% correct**. The debate is stalled because it has become a proxy war for a broader dispute in epistemology regarding **externalism vs. internalism** and the **burden of proof for reliability**.

  However, the missing 20% is the **metaphysical nature of moral truth**. The reason the epistemological norm feels more pressing in morality than in math is that moral truths (for non-naturalists) are causally inert. If moral truths were natural properties, the epistemological demand for an etiological explanation would be easier to meet. Therefore, the stalemate is not *just* about whether we need an explanation, but about whether the *kind* of truth morality involves makes that explanation impossible to give.

  **Progress** will not come from a new moral argument, but from either:
  1.  **Epistemology:** A consensus on whether "explanatory connection" is a necessary condition for knowledge of necessary truths.
  2.  **Science:** Empirical data that forces a concession on how much evolution determined specific moral contents.

  Until then, the "moral" framing is indeed just the surface texture of a deeper epistemological impasse.
