prompt: |-
  Trying to figure out what I actually believe about why originals matter, by going with my gut on cases, and Id like you to act as an expert in philosophy of art and help me find the principle, if there is one. Think carefully, brainstorm a couple of candidate principles before settling on one, and don't just flatter my intuitions.

  A museum hangs what everyone takes for a Vermeer for forty years; it turns out to be a forgery so good that even now experts can't tell from the surface. Nothing about the paint changed, but I think it should come off the wall, or at least be labeled differently, and it's worth a tiny fraction of what it was yesterday. A wine I blind-tasted and raved about turns out to be a counterfeit of the famous vintage it claimed to be. It tasted the way it tasted, but I feel cheated and wouldn't pay that price again. A designer bag made in the same factory, from the same materials, but unauthorized — I basically think it's fine to buy that cheap, and I don't feel cheated at all. A digital artwork where the "original" file and my copy are bitwise identical: I genuinely don't care which one is the original, that seems like a pure convention. A 300-year-old chair that's had every part replaced over the centuries, maybe 10% original wood left: still seems genuinely valuable, and it still seems right to call it the chair. And my grandmother's handwritten recipe card versus a perfect photocopy: the original matters to me a lot, even though the photocopy carries exactly the same information.

  So — contact with the creator? Some historical chain? Authenticity of the experience rather than the object? Is there one principle that gets all or most of these verdicts? Note the photocopy case and the digital case feel like they pull in opposite directions even though they're structurally similar, and I can't tell if that's hypocrisy or a real difference. Tell me which of my gut verdicts the best principle has to sacrifice, what it predicts for a case I haven't listed, and what it says about the one I keep flip-flopping on: a known, openly labeled forgery so good that connoisseurs prefer it to the master's mediocre genuine works — should a museum hang that as a forgery, and can it be great art?
