prompt: |-
  International law treats captured enemy soldiers oddly, and I want to know what theory of their moral status the treatment rests on. Under the Geneva Conventions, a prisoner of war cannot be prosecuted merely for having fought: detention is supposed to be non-punitive, and he is released when the war ends, even if the war his side waged was flagrantly aggressive. States accept this for their own enemies knowingly. The aftermath of wars follows the same pattern: leaders of the losing side may be tried for the crime of aggression, individual soldiers may be tried for atrocities, but the ordinary infantryman who fought and killed in an unjust cause is released and typically pensioned at home — Germany was paying war pensions to veterans of the Wehrmacht within a few years of 1945. Yet the very same legal order insists that soldiers are personally responsible for how they fight: superior orders is no defense to a war crime, and a low-ranking conscript could be executed for shooting a surrendered prisoner.

  What view of combatants does this package presuppose? On its face it looks like the traditional doctrine of the moral equality of combatants: a soldier's permission to kill derives from his status as a combatant rather than from the justice of his cause, so soldiers on both sides are equally entitled to fight and become liable to punishment only through violations of the rules of war. But I can see at least two other readings. Perhaps the law presupposes only that unjust combatants are excused rather than justified — conscripts are coerced, volunteers misled — so their detention is preventive rather than deserved punishment. Or perhaps it presupposes nothing about desert at all and is simply a reciprocal bargain: we do not prosecute their soldiers so they will not prosecute ours, and the practice would survive even if unjust combatants act wrongly every time they fight.

  Reconstruct the implicit theory. Distinguish what the practice strictly requires from what it merely fits comfortably, and identify where it is philosophically underdetermined — that is, say whether the moral-equality reading, the excuse reading, and the reciprocal-bargain reading really do license the same institutions, or whether some detail of the practice (the non-punitive character of POW detention, the pension, the amnesty for ordinary soldiers) discriminates among them. Pay particular attention to the asymmetry: personal responsibility is assumed for conduct within the war but denied for participation in it. Can that asymmetry be defended by something other than the moral-equality doctrine — say, soldiers' limited epistemic access to the justice of their war, or the thought that aggression is a crime of states rather than of individual men? Finally, tell me what would actually have to change if the moral equality of combatants were rejected on philosophical grounds: would POW camps become prisons for the wrongfully violent, would veterans' pensions of unjust wars become tainted, would every returning soldier of a bad war owe restitution — or could the whole edifice stand on the weaker justifications alone?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Question:** What theory of moral status underlies the treatment of captured enemy soldiers under international law (specifically the Geneva Conventions and post-war practices)?
      *   **Key Observations:**
          *   POWs aren't prosecuted for fighting (non-punitive detention).
          *   Released when war ends, even if their side was aggressive.
          *   Leaders tried for aggression; soldiers tried for atrocities, but ordinary soldiers in unjust wars are amnestied/pensioned.
          *   Soldiers *are* responsible for *how* they fight (war crimes, no superior orders defense).
          *   Asymmetry: Responsible for conduct *in* war, not responsible for participation *in* war.
      *   **Candidate Theories:**
          1.  *Moral Equality of Combatants (MEC):* Soldiers are justified in killing based on status, not cause. Liability arises only from *jus in bello* violations.
          2.  *Excuse Theory:* Unjust combatants act wrongly but are excused (coercion, ignorance). Detention is preventive, not punitive.
          3.  *Reciprocal Bargain (Pragmatism):* It's a deal to protect our own soldiers. Moral status is irrelevant.
      *   **Tasks:**
          *   Reconstruct the implicit theory.
          *   Distinguish what the practice *requires* vs. what *fits*.
          *   Identify philosophical underdetermination (do the theories license the same institutions?).
          *   Analyze specific details (non-punitive detention, pensions, amnesty) to see if they discriminate among theories.
          *   Address the asymmetry (responsibility for conduct vs. participation). Can it be defended without MEC? (Epistemic limits, state crime theory).
          *   Counterfactual: What changes if MEC is rejected? (Prisons? No pensions? Restitution? Or does the edifice stand on weaker justifications?)

  2.  **Initial Analysis & Theoretical Mapping:**

      *   *Moral Equality of Combatants (MEC):* This is the Walzerian traditional view. It posits a symmetry of rights and liabilities. If this is true, the soldier isn't doing anything wrong by shooting an enemy soldier, regardless of the war's justice.
      *   *Excuse Theory:* This aligns with Revisionist Just War Theory (e.g., McMahan). Unjust combatants *do* wrong by fighting, but we excuse them due to duress or ignorance. Detention is to stop them from returning to the fight (preventive), not punishment for a crime.
      *   *Reciprocal Bargain:* This is a realist/conventionalist view. Morality is bracketed. We treat them well so they treat our guys well.

  3.  **Evaluating the Practice against the Theories:**

      *   *Non-punitive Detention:*
          *   MEC: Fits perfectly. They did nothing wrong.
          *   Excuse: Fits well. You don't punish the excused, you just neutralize the threat.
          *   Bargain: Fits. Punishment would break the deal.
      *   *Amnesty/Pensions:*
          *   MEC: Fits. They served honorably.
          *   Excuse: Tricky. Why pension someone who did wrong (even if excused)? But if the state is responsible, maybe the state pays.
          *   Bargain: Fits. Reintegration ensures stability and future reciprocity.
      *   *Responsibility for War Crimes:*
          *   MEC: Fits. *Jus in bello* is independent of *jus ad bellum*.
          *   Excuse: Fits. Killing a surrendering soldier is murder, no excuse applies.
          *   Bargain: Fits. Necessary to maintain the utility of the rules.

  4.  **Addressing the Asymmetry (Participation vs. Conduct):**

      *   Why are soldiers liable for war crimes but not for aggression?
      *   *MEC:* Because *ad bellum* belongs to the sovereign, *in bello* belongs to the individual.
      *   *Excuse/Epistemic:* Soldiers can't know if the war is just (invincible ignorance), but they *can* know not to shoot prisoners.
      *   *State Crime:* Aggression is a leadership crime. Soldiers are instruments.

  5.  **Underdetermination & Discrimination:**

      *   Do the theories license the *same* institutions? Mostly yes, but the *justification* changes the texture.
      *   *Discriminating Detail:* The *honor* associated with service. MEC grants honor. Excuse theory grants pity/neutral status. Bargain grants nothing but safety.
      *   *Pensions:* MEC justifies pensions as earned benefits. Excuse theory makes them questionable (why reward wrongdoers?). Bargain justifies them as social stability measures.
      *   *Detention:* MEC says "you are harmless now." Excuse says "you are dangerous but not guilty." Bargain says "you are a chip in a game."

  6.  **Counterfactual: Rejecting MEC:**

      *   If MEC is false (Revisionist view: Unjust combatants act wrongly), does the legal system collapse?
      *   *Prisons:* If they are wrongdoers, why not punish? Because of the Excuse (coercion/ignorance). So camps remain preventive, not punitive.
      *   *Pensions:* Might become controversial, but likely remain for social stability (Bargain).
      *   *Restitution:* Unlikely on a mass scale. Too disruptive.
      *   *Conclusion:* The legal edifice is robust enough to stand on Excuse + Bargain even if MEC falls.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the tension. Define the three candidate theories clearly.
      *   *Section 1: The Implicit Theory (The Hybrid).* It's not just one. It's a pragmatic layering of MEC for *in bello* and Excuse/Bargain for *ad bellum*.
      *   *Section 2: Distinguishing Requirements vs. Fit.*
          *   Non-punitive detention: Required by Excuse and Bargain, consistent with MEC.
          *   War Crimes liability: Required by all (MEC needs rules, Excuse needs moral baseline, Bargain needs utility).
          *   Pensions/Amnesty: This is the discriminator. MEC *celebrates* this. Excuse *tolerates* it. Bargain *buys* it.
      *   *Section 3: The Asymmetry.* Focus on Epistemic Access and the Nature of Aggression. Soldiers know *how* to fight (don't shoot meds), they don't know *why* (intelligence is classified/propaganda). Aggression is a "crime of state."
      *   *Section 4: Rejecting MEC.* If we accept McMahan's Revisionism (Unjust combatants lack the right to kill), what happens?
          *   Does detention become imprisonment? No, because the Excuse remains.
          *   Do pensions vanish? No, because the Bargain remains.
          *   The system is "overdetermined." It doesn't rely solely on MEC.
      *   *Conclusion:* The law is a pragmatic compromise that *mimics* MEC without necessarily committing to its metaphysical truth.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between *justification* (act was right) and *excuse* (act was wrong but agent not blameworthy). This is crucial for the "Excuse Reading."
      *   *Nuance:* The prompt asks about the "implicit theory." I should argue that the law *pretends* MEC is true for functional reasons, even if the moral reality might be closer to Excuse.
      *   *Specific Detail:* The prompt mentions Germany paying pensions to Wehrmacht. This is a strong test case. MEC justifies it easily. Excuse theory struggles (why pay wrongdoers?). Bargain explains it (need to rebuild Germany/stability). I need to highlight this tension.
      *   *Asymmetry:* Ensure I address "crime of states." This is the Nuremberg distinction (Crimes Against Peace vs. War Crimes).

  9.  **Final Polish:** Check tone (analytical, philosophical, legal). Ensure all parts of the prompt are answered. (Re-read prompt: "Reconstruct implicit theory," "Distinguish practice requires vs fits," "Identify underdetermination," "Address asymmetry," "What would change if MEC rejected.")

      *(Self-Correction on "What would change"):* If MEC is rejected, the *moral stigma* changes, but the *legal institutions* might not. I need to be clear on the difference between moral ontology and legal institutionalism.

  10. **Final Structure:**
      1.  Introduction: The Tripartite Tension.
      2.  The Implicit Theory: Functional MEC backed by Excuse and Bargain.
      3.  Discriminating Details: Where the theories diverge (Pensions, Honor).
      4.  Defending the Asymmetry: Epistemic Limits and State Agency.
      5.  The Counterfactual: Life after MEC (Institutions remain, Meaning shifts).
      6.  Conclusion.

  (Proceed to generate output based on this structure.)
answer: |-
  The legal regime governing prisoners of war (POWs) and combatant immunity is one of the most stable yet philosophically contested structures in international law. To reconstruct its implicit theory, we must disentangle the normative claims it makes from the pragmatic functions it serves. The practice does not rest on a single moral premise but rather on a **hybrid justification** that layers the traditional doctrine of the Moral Equality of Combatants (MEC) over a substrate of excusing conditions and reciprocal pragmatism.

  Here is an analysis of the implicit theory, the points of underdetermination, and the resilience of the legal edifice should the Moral Equality of Combatants be philosophically abandoned.

  ### 1. Reconstructing the Implicit Theory

  The legal practice presupposes a **functional Moral Equality of Combatants**, but it does not necessarily commit to MEC as a metaphysical truth. Instead, it treats combatants *as if* they are morally equal for the sake of regulation, while relying on **excuse theory** and **reciprocal bargain** to handle the moral residue of unjust wars.

  *   **The MEC Layer (Surface):** The law operates *as if* the right to kill in war derives from status (being a uniformed combatant) rather than cause (*jus ad bellum*). This explains why a German infantryman in 1942 and an American infantryman in 1942 possessed the same legal privilege to shoot each other.
  *   **The Excuse Layer (Depth):** The non-punitive nature of POW detention suggests the law acknowledges that fighting for an unjust cause is not a *crime* for the individual. This aligns with the **Excuse Reading**. The soldier is not *justified* (the act of aggression is objectively wrong), but he is *excused* due to coercion, duress, or invincible ignorance. Detention is preventive (neutralizing a threat), not retributive (punishing a wrong).
  *   **The Bargain Layer (Structure):** The universality of the practice points to the **Reciprocal Bargain**. States accept these rules not because they believe enemy soldiers are morally innocent, but because they require a guarantee that their own soldiers will not be executed upon capture.

  ### 2. Requirements vs. Fit: Where the Theories Diverge

  While all three theories can accommodate the basic rule ("don't prosecute soldiers for fighting"), specific details of the practice discriminate among them. The system is **underdetermined** regarding the *moral status* of the soldier, but **determined** regarding the *treatment* of the soldier.

  | Feature of Practice | Moral Equality (MEC) | Excuse Theory | Reciprocal Bargain |
  | :--- | :--- | :--- | :--- |
  | **Non-punitive Detention** | **Fits Perfectly.** Soldier did no wrong; detention is merely security. | **Fits Perfectly.** Soldier did wrong but is not blameworthy; detention is preventive. | **Fits.** Punishment violates the treaty; detention is leverage. |
  | **War Crimes Liability** | **Required.** *Jus in bello* is independent. Violating rules forfeits status. | **Required.** Excuses do not cover manifest crimes (e.g., shooting POWs). | **Required.** Rules must be enforceable to maintain utility. |
  | **Veterans' Pensions** | **Justified.** Service was honorable; benefits are earned. | **Problematic.** Why reward excused wrongdoers? Requires shifting blame to the State. | **Justified.** Reintegration prevents instability; cost of doing business. |
  | **Amnesty/Reintegration** | **Celebrated.** The soldier returns as a hero/citizen. | **Tolerated.** The soldier returns as a non-threatening civilian. | **Engineered.** Necessary to end conflict and normalize relations. |

  **The Discriminating Detail:** The **pension and honor** accorded to veterans of unjust wars is the stress point.
  *   Under **MEC**, paying a Wehrmacht veteran is morally coherent: he served his state honorably within the rules.
  *   Under **Excuse Theory**, it is morally awkward. If the war was aggressive, the soldier participated in a collective wrong. Paying him implies the state accepts responsibility for the error, absolving the individual entirely.
  *   Under **Reciprocal Bargain**, it is irrelevant. Pensions are domestic policy tools to prevent revolution or destitution, unrelated to international moral status.

  The fact that states *do* pay pensions suggests the legal order leans heavily on the **Bargain** and **State Crime** theories to override the moral discomfort of the **Excuse** theory. The law treats aggression as a crime of the *state* (leadership), not the *instrument* (soldier).

  ### 3. Defending the Asymmetry Without MEC

  The prompt highlights a crucial asymmetry: soldiers are liable for *conduct* (war crimes) but not *participation* (aggression). If we reject MEC (accepting, for instance, Jeff McMahan's Revisionist Just War Theory that unjust combatants fight wrongly), can this asymmetry survive?

  Yes, but the justification shifts from **status** to **epistemology and agency**.

  1.  **Epistemic Access (Invincible Ignorance):**
      *   *Conduct:* The rules of *jus in bello* (do not shoot surrendering men, do not target civilians) are epistemically accessible to every soldier. They require no intelligence briefings. A conscript knows shooting a prisoner is wrong. Therefore, liability attaches.
      *   *Participation:* The justice of the war (*jus ad bellum*) relies on classified intelligence, diplomatic history, and strategic assessment unavailable to the infantryman. In a closed society or amidst propaganda, the soldier lacks the capacity to judge the war's justice. Therefore, liability is mitigated.
      *   *Defense:* The asymmetry is not about moral equality, but about **culpable knowledge**. You are responsible for what you can know.

  2.  **The Crime of State:**
      *   International law constructs the state as a moral agent distinct from its citizens. Aggression is a "leadership crime" (as established at Nuremberg). The soldier is an organ of the state, not a private actor.
      *   *Defense:* To prosecute the soldier for participation is to misunderstand the locus of agency. The state pulled the trigger; the soldier was the bullet. However, if the bullet is used unlawfully (war crime), the wielder of the bullet (the soldier) becomes liable.

  This defense preserves the legal institutions without requiring the metaphysical claim that unjust combatants are *justified*. It merely claims they are *non-culpable*.

  ### 4. Counterfactual: What if MEC is Rejected?

  If the international community explicitly adopted the Revisionist view (that unjust combatants act wrongly and lack the right to kill), the legal edifice would likely **stand**, but its **moral texture** would change. The system is overdetermined; it does not rely solely on MEC.

  **What would NOT change:**
  *   **POW Camps would not become Prisons:** Even if unjust combatants act wrongly, the **Excuse Reading** (coercion/ignorance) remains valid. We do not imprison the coerced; we detain them until the threat passes. The *preventive* rationale survives the loss of the *justification* rationale.
  *   **War Crimes Trials would continue:** Revisionists agree that *jus in bello* violations are morally heinous. Liability for atrocities is arguably *stronger* under Revisionism, as the soldier lacks even the putative cover of a just cause.
  *   **Amnesty would likely remain:** Prosecuting hundreds of thousands of conscripts for "participation in aggression" is pragmatically impossible and politically destabilizing. The **Reciprocal Bargain** dictates that peace requires letting the defeated army go home.

  **What WOULD change:**
  *   **The Stigma of Service:** Under MEC, a veteran of an unjust war returns with honor. If MEC is rejected, their service is morally tainted. Pensions might remain (per the Bargain), but they would be viewed as welfare or hush money rather than earned benefits. Monuments might become controversial.
  *   **Command Responsibility:** If soldiers are not morally equal, the burden on officers to ensure the war is just increases. The "superior orders" defense might be eroded further regarding *ad bellum* issues, though currently, it is already null for *in bello* crimes.
  *   **Restitution Claims:** If unjust fighting is a wrong (even if excused), there is a stronger philosophical basis for civil claims or reparations directed at individual combatants, though sovereign immunity would likely block this legally.

  ### Conclusion

  The international law of armed conflict presupposes a **pragmatic fiction of Moral Equality**. It treats soldiers as moral equals not because it is philosophically certain that they are, but because it is necessary for the regulation of violence.

  The asymmetry you identify—responsibility for conduct but not participation—is defensible without MEC by appealing to **epistemic limits** (soldiers can know rules of engagement but not grand strategy) and **agency theory** (aggression is a state act).

  If MEC were rejected on philosophical grounds, the **institutions** (POW camps, amnesty, pensions) would survive because they are buttressed by the **Excuse** and **Bargain** theories. However, the **honor** of the soldier would vanish. The veteran of an unjust war would transition from a "misunderstood hero" (MEC) to a "pitiable instrument" (Excuse) or a "necessary risk" (Bargain). The law would remain the same, but the moral silence surrounding the returning soldier of a lost, unjust war would become deafening.
