          *   Needs to distinguish understanding vs. vibe.
          *   Draft: "Suppose Person A has rights over {x, y} and Person B over {y, z}. If everyone prefers x to z, does Sen's theorem force society to prefer x to z? Explain why or why not using the axioms." (Tests understanding of decisiveness vs. Pareto scope).
