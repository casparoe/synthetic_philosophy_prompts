  Dependency order
  Begin with social states and individual preferences. Define a Social Welfare Function (SWF) mapping profiles to orderings. Introduce Weak Pareto (if everyone prefers X to Y, society prefers X to Y) not as moral truth but as an efficiency axiom they usually accept. Without this foundation, the impossibility result looks like a trick rather than a structural conflict between valued principles. Students must accept Pareto as intuitive before seeing it clash with liberty. Then define Minimal Liberalism (at least two people have decisive power over at least one pair of states each). Crucially, establish that preferences are *ordinal* and *unrestricted*. The punchline lands only when they see Pareto and Liberalism as separate, reasonable conditions that jointly demand a contradiction. Do not start with the paradox; start with the axioms. Ensure they understand "decisive" means society *must* follow the individual, regardless of others. Spend 10 minutes here. This ensures real clarity.

  The carrying example
  Stick with Sen's *Lady Chatterley's Lover* but sanitize framing. It works because the preferences are ordinal and distinct (Prude: No read > Lewd read > Prude read; Lewd: Lewd read > Prude read > No read). Specific content matters less than the *structure* of meddlesome preferences. If you change it, ensure the "personal sphere" is clear (e.g., Person A chooses wall color, Person B chooses carpet). Prude/Lewd is pedagogically efficient because the conflict between personal rights and Pareto efficiency is stark. Don't over-engineer a new case; spend time explaining the preference ordering. Novel examples often confuse the personal sphere definition.

  Misconception map
  1. *Arrow Rebrand:* Head this off early. Arrow requires Universal Domain + IIA + Pareto + Non-dictatorship. Sen swaps Non-dictatorship for Minimal Liberalism and drops IIA. The conflict is between Efficiency and Liberty, not Independence. Students confuse impossibility results; clarify Sen isolates liberty, not voting rules. Explicitly contrast Arrow's focus on aggregation rules with Sen's focus on individual rights over specific pairs.
  2. *Rights Don't Exist:* This is your friend's error. Address it at the conclusion. The theorem says you cannot have *both* unconditional Pareto and unconditional Liberalism with *unrestricted* preferences. It implies rights must be constrained or Pareto limited, not that rights are incoherent. Emphasize that logical consistency requires trade-offs, not abandonment of rights. Your friend's leap is a category error. Logic limits simultaneous satisfaction of axioms, not the validity of rights themselves. Constitutions choose which axiom to relax.
  3. *Meddlesome Preferences:* Students will think "just don't care about others." Sen's point is precisely that rights should protect you *even* when others meddle. If you restrict domain to non-meddlesome prefs, the paradox vanishes, but that's a solution, not a refutation. Liberalism is meant to handle conflict, not assume it away. Rights protect against meddling; assuming no meddling makes rights unnecessary.

  Exit ticket question
  Identify which axiom (Pareto or Liberalism) drives the cycle in the Prude/Lewd case. Briefly argue which one should be restricted in a legal system and why. This distinguishes students who see the trade-off from those who see only impossibility. Require them to justify their choice using theorem logic, not personal opinion.

  What I'm leaving out
  Correct to exclude Gibbard's paradox and complex domain restrictions (like limited preferences). Sophomores need the core impossibility result first. Skip game-theoretic implementations or strategic voting. Focus on the normative conflict. Mentioning waiver rights or game forms complicates the logical impossibility point. Keep it on the axiomatic conflict. You can mention "solutions exist" but don't derive them. Save advanced resolutions for graduate modules. Furthermore, avoid diving into constitutional designs that resolve paradox, such as constrained Pareto principles.
