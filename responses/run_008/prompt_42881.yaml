      *   **Context:** The user is an instructor preparing a 50-minute intro social choice section (econ/poli-sci sophomores) on Sen's Liberal Paradox.
      *   **Motivation:** A fight with a friend who misinterprets the theorem as proving rights are logically incoherent. The user wants to avoid students leaving with that same misconception.
      *   **Constraints:**
          *   Structure the answer exactly as: "Dependency order" (~150 words), "The carrying example" (~100), "Misconception map" (~200), "Exit ticket question" (~50), "What I'm leaving out" (~75).
          *   Total word count constraints are tight per section.
          *   Content needs to address: prerequisites (Pareto), example choice (Lady Chatterley vs. alternative), misconceptions (Arrow rebrand, rights don't exist, meddlesome preferences), exit ticket question, and scope limitations (Gibbard/domain restriction).

  2.  **Drafting - Section by Section:**

      *   **Dependency order (~150 words):**
          *   Need to establish what concepts must come before the paradox.
          *   User suspects Pareto needs to be framed as a constraint, not obvious truth.
          *   Need social welfare function (SWF) basics, preferences, and the definition of "liberalism" (minimal rights).
          *   Draft: Start with social states and individual preferences. Define a Social Welfare Function (SWF) as mapping profiles to orderings. Introduce Weak Pareto (if everyone prefers X to Y, society prefers X to Y) not as moral truth but as an efficiency axiom they usually accept. Then define Minimal Liberalism (at least two people have decisive power over at least one pair of states each). Crucially, establish that preferences are *ordinal* and *unrestricted*. The punchline lands only when they see Pareto and Liberalism as separate, reasonable conditions that jointly demand a contradiction. Do not start with the paradox; start with the axioms. Ensure they understand "decisive" means society *must* follow the individual, regardless of others. This sets the trap: two reasonable axioms + unrestricted domain = impossibility.

      *   **The carrying example (~100 words):**
          *   Lady Chatterley (Prude/Lewd) is classic but potentially distracting.
          *   Needs to be simple, binary choices per person.
          *   Draft: Stick with Sen's *Lady Chatterley's Lover* but sanitize the framing. It works because the preferences are ordinal and distinct (Prude: No read > Lewd read > Prude read; Lewd: Lewd read > Prude read > No read). The specific content matters less than the *structure* of meddlesome preferences. If you change it, ensure the "personal sphere" is clear (e.g., Person A chooses wall color, Person B chooses carpet). But Prude/Lewd is pedagogically efficient because the conflict between personal rights and Pareto efficiency is stark. Don't over-engineer a new case; spend time explaining the preference ordering instead.

      *   **Misconception map (~200 words):**
          *   Address: "Arrow rebranded", "Rights don't exist", "Meddlesome preferences".
          *   Draft:
              1.  *Arrow Rebrand:* Head this off early. Arrow requires Universal Domain + IIA + Pareto + Non-dictatorship. Sen swaps Non-dictatorship for Minimal Liberalism and drops IIA. The conflict is between Efficiency and Liberty, not Independence.
              2.  *Rights Don't Exist:* This is your friend's error. Address it at the conclusion. The theorem says you cannot have *both* unconditional Pareto and unconditional Liberalism with *unrestricted* preferences. It implies rights must be constrained or Pareto limited, not that rights are incoherent.
              3.  *Meddlesome Preferences:* Students will think "just don't care about others." Address this when defining preferences. Sen's point is precisely that rights should protect you *even* when others meddle. If you restrict domain to non-meddlesome prefs, the paradox vanishes, but that's a solution, not a refutation. Highlight that liberalism is meant to handle conflict, not assume it away.

