  2.  **Deconstruct the Friend's Summary (Claim by Claim):**
      *   *Claim 1:* "Einstein showed that if you treat spacetime as a substance — a real thing whose points have their own identity — then general relativity becomes radically indeterministic."
          *   *Analysis:* This is the core of the Earman & Norton (1987) reconstruction of the Hole Argument. It's technically accurate regarding the *argument*, though historically Einstein's own struggle was slightly more nuanced (he used it to argue *against* general covariance initially, then later accepted GC and changed his view on substantivalism). The logical structure is correct: Substantivalism + Diffeomorphism Invariance -> Indeterminism.
