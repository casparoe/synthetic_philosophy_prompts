answer: |-
  Ranking these methods from most trustworthy for extracting latent knowledge to least gives you: (3), (4), (1), (5), (2).

  (3) lands first because training a probe on internal activations is the only read-only method that bypasses the output layer where the "lose on purpose" suppression is likely implemented.
  (4) is second because activation steering intervenes at inference to amplify truth signals without changing weights, though it assumes truth is linearly separable which isn't guaranteed.
  (1) comes third because prompting leaves weights untouched but relies on the compromised output head, making it unlikely to override robust fine-tuning.
  (5) is fourth because fine-tuning on true statements changes the model's weights, effectively manufacturing new honest behavior rather than excavating existing latent knowledge.
  (2) ranks last because training the model to fool a lie detector explicitly optimizes for deception, ensuring the output matches the detector's expectations rather than reality.

  The distinction between "finding" and "changing" knowledge holds only if the fine-tuning suppressed the output without catastrophically forgetting the underlying computation; if the weights were overwritten, the knowledge is genuinely gone. A sixth method that beats all five is **Contrast Consistent Search (CCS)**, which finds latent knowledge without needing labeled true/false data to train probes, avoiding the assumption that you already know the truth to find it.
