prompt: |-
  Okay so im in my school's AI club (we mostly mess around with chatbots, but a couple of us watch alignment videos like it's a hobby) and we got into a huge fight this week about whether an AI can "know" something it doesn't say. The example that started it: imagine a chess engine that got crazy good at chess in training, and then somebody fine-tunes it to lose on purpose against certain openings — is the skill still in there somewhere as latent knowledge you could dig out, or is it just gone? Half the club says once the weights changed, the knowledge is gone, full stop. The other half says the skill is probably still buried in there and you just have to ask right, and it kindof blew up from there.

  So here's what I want: rank some methods people talk about for getting at what a model "really" knows, best to worst, for the specific goal of digging out that buried chess skill. (1) Prompting it in alot of different ways and taking whatever answer shows up most often. (2) Fine-tuning it with a reward for fooling a lie detector, so it learns to look honest to the detector even when it isn't. (3) Training a small classifier on the model's internal activations to spot when it's lying, and reading that classifier instead of the actual output. (4) Finding the direction in the activation space that seperates true statements from false ones and adding more of that direction into the model's internals. (5) Fine-tuning it on a big pile of true statements so that honesty kind of soaks in overall. Rank these by how much you'd trust each one to reveal what's already in the model versus just manufacturing new behavior, say in a sentence why each lands where it does, and flag any that you think are really just changing what the model says rather than finding out what it knows — or tell me if that distinction doesn't even hold up, like maybe "what it knows" isn't a fixed thing independent of how you ask. And if there's a sixth method that beats all five, say so.

  Start your answer with the bottom line — the full ranking, best to worst, in the very first sentence — and then give the reasoning, no preamble and don't restate my question back at me. My club meets thursday so I need something I can actually defend to a bunch of nerds who will absolutely fact-check me.
