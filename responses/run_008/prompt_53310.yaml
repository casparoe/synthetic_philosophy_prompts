prompt: |-
  I'm a novelist, and I need help from someone who knows statistics the way a trial lawyer knows procedure. My current book is told from the point of view of a biostatistician who serves as an expert witness, and I'm determined that every number she recites on the stand should survive an expert reader. For background reading I picked up a popular book on statistical pitfalls — well reviewed, author has a doctorate, exactly the sort of thing my character's lawyer would hand her before deposition — and it contains the following passage, which I've copied out word for word:

  "Simpson's paradox, first described by the British statistician Edward Simpson in 1951, is what happens when a trend that appears in every subgroup of a dataset vanishes or reverses when the subgroups are pooled. The classic case is graduate admissions at Berkeley in the fall of 1973: overall, men were admitted at 44 percent and women at only 35 percent — a gap so large that sex bias seemed the only explanation. But when the applications were examined department by department, the pattern dissolved: in most of the largest departments women actually fared slightly better than men, and the pooled-and-adjusted analysis showed a small but significant bias in favor of women. The university was, statistically speaking, exonerated. The culprit in such cases is always a third variable — statisticians call it a confounder — hiding in the aggregate; here, the fact that women tended to apply to more competitive departments. The practical lesson is unforgiving: the pooled numbers are always the misleading ones. Whenever you see a headline statistic, ask for the breakdown. Simpson's paradox is the ecological fallacy's mirror image — where the ecological fallacy warns that group-level patterns may not describe individuals, Simpson's paradox warns that they may describe them backwards. Once you know about it, you never trust an unstratified number again."

  Please answer as a statistician who works on causal inference and has taught the philosophy of statistics — someone my narrator would consider a peer. Think carefully and take your time; before you audit the passage, briefly set out the standard you're applying, namely what separates a genuine error about Simpson's paradox from an acceptable simplification for a lay audience. Then go through the passage claim by claim: what a working statistician would accept, what is a harmless gloss, and what is actually wrong. I don't know where the errors are, if there are any — I'm inclined to trust the book, though a biostatistician friend of mine made a face at the "never trust an unstratified number" line, and I can't tell whether that's a real disagreement or a turf thing. I'd also like your view on whether the "statistically speaking, exonerated" conclusion about Berkeley follows from the accurate parts of the summary, or whether something is being closed off prematurely there.

  Two plot questions ride on this, and they're the real reason I'm asking.

  First, in my draft, county commissioners want to defund the trauma center at County General, pointing to its overall inpatient mortality of 13 percent against 5.8 percent at the suburban Mercy Heights. My narrator testifies that over the same three years, County General admitted 2,000 patients — 1,000 classified as mild, who died at a rate of 1 percent, and 1,000 classified as severe, who died at a rate of 25 percent — for 260 deaths in all. Mercy Heights admitted 2,000 patients as well: 1,800 mild at 2 percent and 200 severe at 40 percent, for 116 deaths. She argues that the trauma center does better by every class of patient, and that the gap the commissioners cite is case mix. Does her arithmetic actually produce the reversal she claims, is her inference sound, and what would competent opposing counsel attack in it?

  Second — and here is where I most need you — later in the book she testifies in a different matter and, to the jury's visible surprise, tells them that in this instance the aggregate is the number to trust. A rival expert (my most entertaining villain) reads the passage's rule — the pooled numbers are always the misleading ones — back at her. Is there a coherent statistical position she can be occupying? Please construct a concrete scenario, with small round numbers I can put in her mouth, in which stratifying is the error and pooling gives the right answer — say, a case where the variable you'd disaggregate by is itself affected by the treatment or intervention being judged — and then draft the one paragraph of plain-English testimony in which she explains to a jury why her friend's favorite rule fails here. If the book's rule and my character's position can both be made to sound right to a layperson, I want to understand exactly what separates them, since the novel turns on it.
