answer: |-
  Your intuition is spot on. Your friend has captured the *spirit* of Grice's popularization but has conflated several distinct technical concepts, mischaracterized the nature of the maxims, and drawn a radical conclusion that Grice himself would have rejected.

  Here is a claim-by-claim breakdown of what a philosopher of language would accept, what they would flag, and why the conclusion doesn't follow.

  ### 1. "His big idea is that an utterance carries two layers. There's what the sentence logically entails, and then there's what the speaker smuggles in on top — the implicature."
  *   **Verdict:** **Mostly Acceptable (with caveats).**
  *   **The Gricean View:** Grice distinguishes between **"what is said"** and **"what is implicated."**
  *   **The Flag:** A philosopher would nitpick "logically entails." "What is said" isn't just logical entailment; it involves fixing reference (who "he" is), disambiguation (which "bank"), and filling in indexicals. But as a rough summary of the two-layer structure (semantic content + pragmatic enrichment), this is passable.

  ### 2. "So if I say 'some students passed,' the sentence logically allows that all of them did, but everyone hears 'not all did'..."
  *   **Verdict:** **Accurate.**
  *   **The Gricean View:** This is the classic example of a **scalar implicature**. Logically, *some* is compatible with *all*. Pragmatically, if the speaker knew *all* passed, saying *some* would be less informative than required (violating the Maxim of Quantity). Therefore, the hearer infers the speaker believes *not all* passed.
  *   **The Flag:** None. This is standard textbook Grice.

  ### 3. "...the maxims are rules of polite conversation speakers are expected to obey..."
  *   **Verdict:** **False.**
  *   **The Gricean View:** This is a very common misconception. Grice's Cooperative Principle is not about **politeness**; it is about **rational cooperation** in the exchange of information.
  *   **The Flag:** Politeness is the domain of Geoffrey Leech (who proposed a "Politeness Principle" to explain why people *flout* Grice's maxims). Grice's maxims (Quality, Quantity, Relation, Manner) are about being truthful, informative, relevant, and clear. You can be brutally rude while perfectly obeying Grice's maxims (e.g., "Your hair looks terrible," is cooperative/truthful but impolite).

  ### 4. "...the hearer assumes obedience, and works backwards to the hidden message."
  *   **Verdict:** **Accurate.**
  *   **The Gricean View:** This describes the **derivation** of a conversational implicature. The hearer assumes the speaker is being cooperative. If the literal meaning seems insufficient or odd, the hearer calculates what the speaker *must* have meant to maintain the assumption of cooperation.

  ### 5. "So an implicature is really just another kind of logical consequence, only an indirect one."
  *   **Verdict:** **Major Error.**
  *   **The Gricean View:** Implicatures are **not** logical consequences. They are **defeasible** (cancelable).
  *   **The Flag:** If $A$ logically entails $B$, you cannot assert $A$ and deny $B$ without contradiction. However, you *can* assert an implicature and cancel it without contradiction.
      *   *Example:* "Some students passed. In fact, all of them did."
      *   This sounds slightly odd, but it is not a logical contradiction. If implicature were a "logical consequence," this sentence would be nonsense. Grice insists implicatures are pragmatic inferences, not logical truths.

  ### 6. "And on Grice's account, speaker meaning ends up being a fact about the audience — if your utterance gets the hearer to draw a conclusion, that conclusion is part of what you meant."
  *   **Verdict:** **Conflation/Misinterpretation.**
  *   **The Gricean View:** This conflates Grice's 1957 paper *"Meaning"* with his 1975 lectures *"Logic and Conversation."*
  *   **The Flag:** Grice's theory of **non-natural meaning (meaning-nn)** is intention-based, not audience-success-based. For Grice, to mean something is to intend to produce an effect in an audience *by means of the recognition of that intention*.
      *   If I try to trick you, and you draw a conclusion, I haven't "meant" that in the Gricean sense if I didn't intend for you to recognize my intention.
      *   Conversely, if I mean something but you fail to understand it, I still *meant* it. Meaning is a property of the speaker's complex intention, not a fact about whether the audience actually got it.

  ### 7. "That's why Grice thinks almost nothing we say is ever communicated literally; the literal content is scaffolding that gets discarded once the implicature is in place."
  *   **Verdict:** **Radically False.**
  *   **The Gricean View:** Grice was a defender of truth-conditional semantics. He believed **"what is said"** (the literal content) is the essential foundation upon which implicature is built.
  *   **The Flag:** This conclusion sounds more like **Relevance Theory** (Sperber & Wilson) or a radical contextualist view (like Recanati), not Grice.
      *   For Grice, you cannot calculate the implicature without first establishing the literal content. You need to know the literal meaning is "Some passed" to infer "Not all passed."
      *   Grice does not think literal content is "discarded." In fact, if you lie, you are violating the Maxim of Quality regarding the *literal content*. If the literal content were just scaffolding to be discarded, lying would be impossible.

  ### Does the Grand Conclusion Follow?
  **No.** The conclusion that "almost nothing we say is ever communicated literally" is a non-sequitur based on the previous errors.

  1.  **It relies on the "Politeness" error:** If conversation were just about social maneuvering (politeness), maybe literal truth wouldn't matter. But since Grice views it as information exchange, literal truth (Quality) is paramount.
  2.  **It relies on the "Logical Consequence" error:** If implicature were just indirect logic, one might argue it swallows up literal meaning. But because implicature is cancelable and distinct from "what is said," the two remain separate layers.
  3.  **It ignores the "Scaffolding":** Grice explicitly argues that we need the literal meaning to calculate the implicature. You can't discard the ladder you just climbed.

  ### Summary for Your Friend
  You can tell your friend they have a good grasp of the **mechanism** (the "some/all" example and the "working backwards" part), but they have misunderstood the **ontology** of the theory.

  *   **Grice is not a Pragmatic Radical:** He didn't think literal meaning was an illusion. He thought it was the baseline.
  *   **Grice is not about Politeness:** He is about rational information transfer.
  *   **Grice is not about Logic:** Implicatures are psychological inferences, not logical entailments.

  The "off" feeling you had regarding the last sentences is philosophically justified. That specific claim—that literal content is discarded—is actually an argument *against* Grice used by later pragmatists who thought Grice didn't go far enough. Attributing that view to Grice himself is anachronistic.
