      *   *(Refining Claim 5):* Use the word "defeasible." That's the technical killer for the "logical consequence" idea.
      *   *(Refining Claim 6 & 7):* This is the crux. Grice's analysis of meaning-nn is intention-based. The "scaffolding discarded" view is closer to *generalized* implicature becoming semanticized, or perhaps a misunderstanding of ironic speech. But Grice definitely valued truth-conditional content.

