      *(Self-Correction on Confidence)*: I should be highly confident about the logic contradiction. I should be less confident about whether the user *really* means to deny the existence of the cutoff or just finds it counterintuitive. I will frame the uncertainty around the charitable interpretation of (2).

      *(Final Polish)*: Check the tone. "Here is the audit." "Here is the ranking." "Here is the fix."

