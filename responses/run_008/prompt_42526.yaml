  I'm a PhD student in comparative politics, working on anti-corruption reform, and I've started keeping a list of my supervisor's verdicts because he insists that "corruption" has a clear core that every reasonable person can recognise, and I'm increasingly not so sure. His calls so far, all delivered with total confidence over coffee:

  - a customs officer taking cash to wave through a shipment thats actually legal: corrupt.
  - a mayor hiring his sister's not-particularly-competant son over a clearly better-qualified stranger, no money involved at any point: corrupt.
  - a village official who helps local families with their paperwork all year and recieves sacks of rice and bottles of liquor at harvest, at a level everyone in the district considers normal: not corrupt.
  - a former regulator who, years after leaving office, accepts a very generous retirement gift from a firm she had supervised, which never got anything from her it wasn't entitled to: not corrupt.
  - an official demanding "speed money" to issue a licence the applicant is legally entitled to anyway: corrupt.

  Next week we meet to discuss a case for my thesis chapter: a procurement officer accepts an expensive hunting rifle from a firm just before a tender opens, nothing is said, no promises are made, and the firm then wins anyway with what everyone agrees was objectively the best bid. I want to walk into that meeting with a prediction of what he'll say. But honestly I'm less interested in the right answer than in what rule he's actually running -- I can see at least two that fit his track record equally well -- what each one predicts about the rifle case, your best guess as to his verdict, and what further case I could put to him that would actually split the rules apart. He despises hypotheticals, so the splitting case has to sound like something from a real audit report, not a trolley problem.

  Please answer in British English and keep it under 450 words -- this goes in my fieldnotes, not an essay.
