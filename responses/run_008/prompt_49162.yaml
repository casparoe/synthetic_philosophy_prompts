              4.  *Acyclicity vs. Transitivity:* MPA proves you shouldn't have cycles ($A \succ B \succ C \succ A$). It doesn't strictly prove full transitivity ($A \succ B \land B \succ C \implies A \succ C$) in all contexts, though usually, they are linked.
