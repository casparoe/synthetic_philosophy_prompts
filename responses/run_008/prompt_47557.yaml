answer: |-
  Hey there,

  It sounds like you have a fascinating guest lined up, and given his staunch defense of the Biological Species Concept, you need to steer the conversation carefully so it does not become a monologue. I have drafted eight question sets for you below, written as continuous text so you can read them easily off your phone in the studio. Each paragraph contains a main question, a follow-up keyed to his likely answer, and my reasoning for why I chose that angle, including plain-language explanations for any technical terms you might need to gloss out loud.

  To start, you should ask him why reproductive isolation, which means whether populations can successfully breed and produce fertile offspring, is the only metric that matters compared to genetic similarity. I suggest this because it forces him to state his core thesis immediately and sets the stage for every contradiction you will bring up later. If he says that genetics are secondary because gene flow is what keeps a species unified, your follow-up should be to ask whether two groups that look identical and have nearly identical DNA but cannot breed due to a single chromosomal mutation are truly different species. This pushes him on whether his definition is about biological reality or just a semantic rule about mating.

  Next, you need to bring up your day job by asking how his definition applies to bacteria and other asexual lineages that do not have sex. This is required for your context and exposes the biggest hole in his theory since most life on earth does not interbreed. He will likely say that bacteria are a special case and the concept only applies where sex exists. Your follow-up must be to ask why sex is so special that the majority of organisms on the planet get filed under a special case, and whether a definition of species that excludes most life is still useful. This challenges the universality of his view without being aggressive.

  Then you should press him on ring species like the Ensatina salamanders in California, which are a chain of neighbors that breed locally but not at the ends. Ask him whether that ring is one species or two, since the ends meet and cannot interbreed. I chose this because it is the classic textbook counterexample that forces a choice between continuous variation and discrete categories. If he says it is one species because there is gene flow around the ring, your follow-up is to ask how the same species name can apply to two forms standing next to each other that cannot breed, and whether he would treat them as legally distinct if one end was endangered.

  Speaking of laws, you need to ask whether the Endangered Species Act needs there to be one right answer to what a species is, and whether his view can give the law something usable. This is required for your conservation angle and moves the debate from philosophy to real-world consequences. He might argue that the law should be changed to match biology. If he says that, your follow-up should be to ask who pays the price in the meantime, since conservation funding depends on listing discrete units and his definition might leave many populations unprotected. This highlights the practical cost of theoretical purity.

  You should also ask about hybridization, since many animals like wolves and coyotes or various plants breed across supposed species lines. Ask him if natural hybridization invalidates the barrier he thinks defines a species. I want you to ask this because it shows that reproductive isolation is often porous in nature, not a hard wall. If he says hybridization is rare and does not count, your follow-up is to ask where the line is drawn between rare hybridization and two groups merging, and who gets to decide when enough interbreeding means they are the same species. This exposes the subjectivity in applying his rule.

  Since he is an old-school biologist, ask him how we define species in the fossil record where we cannot test breeding. Ask whether fossil species are just guesses under his framework. This is important because it addresses the time dimension of evolution which his concept struggles with. If he says fossil species are hypothetical units, your follow-up should be to ask if that means our understanding of evolutionary history is fundamentally fuzzy because we cannot verify the only metric that matters. This challenges the stability of the history he studies.

  You need to address his specific dislike of phylogenetic-cladistics people, who focus on grouping organisms by their family tree branches rather than breeding. Ask him what those researchers are actually measuring if they are not defining species. I suggest this because it gives him a chance to critique his rivals directly, which he will enjoy, but it traps him into defining what those units are. If he says they are just defining lineages or populations, your follow-up is to ask why a lineage that stays distinct for millions years is not a species in any meaningful sense, even if they could theoretically breed. This questions whether his definition adds any value over just tracking ancestry.

  Finally, ask him for practical advice for someone building a pipeline to cluster genomes, specifically what nucleotide identity cutoff he would recommend. I want this last because it brings the conversation back to your work and tests if his theory has any operational use. He will likely say there is no universal cutoff. If he says that, your follow-up is to ask how a working scientist is supposed to do their job if the theory provides no usable threshold, and whether he thinks pragmatic definitions are acceptable for engineering even if they are not philosophically pure. This ends the interview on the tension between ideal science and practical work.

  I hope these help you get a dynamic conversation out of him. Good luck with the recording.

  Best,

  Your Assistant
