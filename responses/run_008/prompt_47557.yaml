k the follow-ups yourself, and tell me your reasoning for each choice inline, don't hand me a menu of options with pros and cons. and write the whole thing as continuous prose like an email — no bullet points, no numbered lists, no headings, no bold — because I read these off my phone in the studio. last thing, I have zero philosophy background, so any term of art you use (reproductive isolation, species delimitation, whatever) needs a quick plain-language gloss I can say out loud without sounding like an idiot.
