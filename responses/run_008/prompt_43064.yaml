answer: |-
  **Preparation Sheet: Two-Track Conciliationism (TTC)**
  **Colloquium Q&A Strategy**

  **1. The Formal Epistemologist**
  *(Likely to speak first, aiming to destabilize your definitions.)*

  **Objection:** "You're positing a gap between credence and betting disposition that Dutch Book arguments forbid. If you refuse to bet on $p$ at odds your credence warrants because of a 'practical hedge,' you are effectively admitting your credence is lower than you claim. You aren't describing a distinct epistemic state; you're just mislabeling a pragmatic lowering of confidence. Operationally, your 'unchanged credence' is inert."

  **Reply:** "I grant that *all-things-considered* betting dispositions must align with action. But TTC distinguishes *epistemic* credence (the weight of evidence) from *practical* confidence (the license to act). A Dutch Book exploits inconsistency between *degrees of belief* and *betting behavior*. I am arguing that in peer disagreement, the norm linking the two is severed temporarily. The peer's disagreement acts as a defeater for *assertibility*, not necessarily for the *evidential support* I currently possess. I can acknowledge the evidence supports $p$ to degree 0.8, while acknowledging the social-epistemic context forbids acting on that 0.8 until we deliberate. The credence tracks the evidence; the action tracks the epistemic situation."

  **Soft Spot:** If they press a functionalist definition of belief (belief *just is* the disposition to act), you have no retreat. You are relying on a phenomenological or representational view of credence that formalists often reject.

  ***

  **2. The Equal-Weighter (Steadfastness Charge)**
  *(The core rival view. They will smell a rat.)*

  **Objection:** "This looks like steadfastness with extra bookkeeping. The conciliationist requirement is to acknowledge the peer's testimony as evidence against your own reliability. If you keep your credence fixed, you are ignoring that evidence. Hedging your assertions is just politeness; it doesn't satisfy the epistemic requirement to adjust for the likelihood that you are the one in error. You're keeping the cake (your belief) and eating it too (looking conciliatory)."

  **Reply:** "Steadfastness ignores the peer's epistemic weight; TTC incorporates it by restricting the *use* of the belief. The Equal-Weight view assumes the only way to respect a peer is to alter your internal probability function. I argue that respecting a peer requires suspending the *authority* of that function in the public sphere. If I lower my credence immediately, I might prematurely abandon a true belief before we've had a chance to compare arguments. TTC preserves the truth-tracking potential of my original evidence while respecting the peer by refusing to impose my conclusion on the shared inquiry. It is steadfastness about evidence, but conciliationism about authority."

  **Soft Spot:** They may argue that if you truly respected the peer as an equal, you *would* have to think you are likely wrong, which *just is* lowering credence. Distinguishing "I might be wrong" from "I am less confident" is psychologically thin.

  ***

  **3. The Kantian Colleague**
  *(Concerned with the integrity of the rational agent.)*

  **Objection:** "I worry about the coherence of the agent on this view. If you hold $p$ to be true but refuse to assert or act on it, are you not engaging in a form of self-deception? Assertion is the outward expression of judgment. To judge $p$ is to commit to $p$. To bracket that commitment is to alienate yourself from your own rationality. It sounds like bad faith: 'I know it is so, but I will proceed as if it is not.'"

  **Reply:** "It is not bad faith to recognize the distinction between *judgment* and *endorsement*. I can judge that the evidence favors $p$ while refusing to endorse $p$ as a premise for collective action. Think of a juror who leans toward guilt but votes 'not guilty' because the standard of proof isn't met. They aren't lying to themselves; they are adhering to a higher normative standard. TTC treats peer disagreement as a higher-order defeater for *closure*, not for *content*. I am not denying $p$; I am acknowledging that my warrant for $p$ is currently contested, and rational integrity demands I honor that contest in my conduct."

  **Soft Spot:** The juror analogy works for legal standards, but epistemic norms are usually truth-aimed, not procedure-aimed. If truth is the aim, and you think $p$ is true, withholding assertion feels like a betrayal of the truth.

  ***

  **4. The Graduate Students**
  *(Will press on the mechanics of "bracketing.")*

  **Objection:** "You say we must 'bracket $p$ in shared reasoning.' But the decision to bracket $p$ is itself a move in shared reasoning. If my peer disagrees with $p$, do they also have to agree to bracket it? If they refuse to bracket $p$ and keep arguing for it, does your rule apply to them? Isn't the rule of bracketing itself subject to the very disagreement it's supposed to manage?"

  **Reply:** "Bracketing is a *procedural* norm, not a substantive premise. It's akin to agreeing on rules of order before debating a motion. We don't need to agree on $p$ to agree that *if* we are peers and disagree, we should pause assertion. If a peer refuses to bracket, they are violating the norms of inquiry, not just disagreeing on $p$. TTC is a proposal for how to conduct inquiry, not a premise within it. We can agree on the 'rules of the road' even if we disagree on the destination. The regress stops because the norm is constitutive of what we mean by 'respecting peer disagreement'."

  **Soft Spot:** Peers often disagree on meta-norms. If they are a "steadfast peer," they won't accept your bracketing rule. You risk begging the question by assuming they accept your procedural norms.

  ***

  **5. The Question I Hope Nobody Asks**

  **Question:** "If your credence in $p$ remains high, but you refuse to act or assert on it, what *work* is that credence doing? If it doesn't guide action, doesn't guide assertion, and doesn't guide further belief (since you've bracketed it as a premise), isn't it epistemically idle? Why call it a 'credence' rather than a mere 'impression' or 'intuition'?"

  **Why I fear it:** This strikes at the functional role of belief. If TTC severs the link between credence and all downstream cognitive/behavioral outputs, the "credence" becomes a ghost in the machine—a private feeling with no explanatory power. Answering this requires a robust defense of the intrinsic value of doxastic states independent of their utility, which is a hard sell in a naturalistic climate.

  **Fallback Reply (if asked):** "It guides *private* deliberation and future evidence gathering. I keep the credence so I know where to look for confirming evidence during the deliberation phase. It preserves the heuristic value of my initial assessment without risking the costs of premature closure."
