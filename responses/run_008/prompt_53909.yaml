      *Wait, one more check:* If I say (3) is false, I am saying FP *is* approximately true. Does that save "Beliefs exist"? Yes, via (1). Does it save "Fish exist"? Yes. Does it kill "Phlogiston exists"? Yes, because Phlogiston theory was *not* approximately true (it got the direction of chemical change wrong).
