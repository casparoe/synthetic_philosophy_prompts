prompt: |-
  My housemate has been reading Paul Churchland and has distilled the case for eliminative materialism into four steps. I have walked through it a dozen times; each step still looks defensible to me on its own, yet the same reasoning, applied elsewhere, delivers conclusions I regard as absurd. I would like a diagnosis.

  (1) The entities a theory posits exist only if that theory is at least approximately true within its home domain. He presents this as uncontroversial: phlogiston does not exist because phlogiston theory was not even approximately true of combustion, whereas terms that belonged to roughly correct theories survived theory change as terms for real things.

  (2) Beliefs and desires are posits of folk psychology — the everyday framework by which we explain and predict one another's behavior by attributing contentful states.

  (3) Folk psychology is not approximately true. The supporting case: it offers no account of sleep, memory, learning, mental illness, or imagination; its central principle — that people act so as to satisfy their desires in light of their beliefs — admits exceptions no one can enumerate in advance; and it has seen no substantive development in all of recorded history, which he says is the signature not of a roughly correct theory but of a moribund one.

  (4) Therefore beliefs and desires do not exist.

  Here is my problem. If I continue in his register:

  (5) Folk biology, which placed whales among the fish and treated species as fixed, is not approximately true by the standard applied in (3) — it misclassified whole orders of organisms, embedded everything in a false picture of fixity, and stagnated equally long.

  (6) So fish do not exist — and, running the parallel against folk physics, neither do sunrises or solid objects.

  He anticipates this objection and answers that folk psychology is like demonology rather than folk taxonomy: demonology was false through and through, its entire explanatory machinery wrong, whereas pre-scientific fish-sorting got most classifications right and needed only boundary corrections. But I cannot see how to apply the distinction between false-through-and-through and right-in-outline without begging the question. Demonology got some things right too — the episodes it pathologized do cluster, remit, and call for explanation — and folk psychology arguably tracks the gross patterns of human action quite reliably. If the weighting of right calls against wrong ones is left to intuition, then the intuition that fish exist is doing all the work, and the intuition that beliefs exist should get a vote as well.

  Where I stand: I have no deep attachment to beliefs and desires, and if (4) is the price of the argument I will consider paying it. What I cannot accept is (6), and I also cannot accept the obvious escape of rejecting (1) outright, since (1) is what makes elimination possible at all — I want to keep saying that phlogiston never existed, and that the chemists who dropped it were responding to how the world is rather than merely changing the subject. So: which step do I give up, and what does giving it up cost? If your diagnosis rests on a disanalogy between the folk-psychology case and the fish case, state it in terms that don't simply restate the conclusion; and if you think the flaw is in how (3) supports itself, say why the friend's three complaints — silence on neighboring phenomena, exception-ridden laws, stagnation — don't show what he thinks they show.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user's housemate argues for Eliminative Materialism (EM) based on Paul Churchland's four-step argument.
      *   **The Argument:**
          1.  Theory-dependent ontology (entities exist only if the theory is approximately true).
          2.  Folk Psychology (FP) is a theory positing beliefs/desires.
          3.  FP is not approximately true (fails on sleep, memory, etc.; exception-ridden; stagnant).
          4.  Therefore, beliefs/desires don't exist.
      *   **The User's Dilemma:** The steps look defensible individually, but applying the same logic elsewhere leads to absurd conclusions (e.g., "fish don't exist," "sunrises don't exist").
      *   **The Housemate's Defense:** FP is like demonology (wholly false), not like folk biology (mostly right with boundary errors).
      *   **The User's Critique of the Defense:** The distinction seems question-begging. Demonology got *some* things right (symptoms cluster); FP tracks action reliably. Intuition seems to be doing the heavy lifting.
      *   **The User's Constraints:**
          *   Willing to accept (4) if necessary (no deep attachment to beliefs).
          *   Cannot accept (6) (fish/sunrises don't exist).
          *   Cannot reject (1) outright (wants to keep phlogiston non-existent).
          *   Needs a diagnosis that identifies *which step to give up* and *the cost*.
          *   Needs a non-question-begging disanalogy between FP and Folk Biology/Physics if one exists.
          *   Needs an analysis of whether (3)'s support (silence, exceptions, stagnation) actually proves falsity.

  2.  **Deconstruct the Argument Steps:**

      *   **Step (1): Theory-Dependent Ontology.** "Entities exist only if the theory is approximately true."
          *   *Strength:* Handles phlogiston well.
          *   *Weakness:* "Approximately true" is vague. What counts as a "theory"?
          *   *User's stance:* Wants to keep this to save phlogiston elimination.

      *   **Step (2): FP is a Theory.**
          *   *Strength:* Standard EM move.
          *   *Weakness:* Some argue FP isn't a *theory* but a practice/skill (Ryle, Wittgenstein).
          *   *User's stance:* Seems to accept this for the sake of argument ("If I continue in his register").

      *   **Step (3): FP is False.**
          *   *Support:* Explanatory gaps (sleep, memory), exception-ridden laws, stagnation.
          *   *User's Challenge:* Folk biology had similar issues (whales as fish, fixed species) but we don't eliminate "fish."
          *   *Key Issue:* Is FP *radically* false or just *coarse-grained*?

      *   **Step (4): Elimination.**
          *   *Result:* No beliefs/desires.

      *   **The Reductio (5 & 6):** Folk Biology/Physics fails similar tests $\rightarrow$ Fish/Sunrises don't exist.
          *   *Housemate's Reply:* FP = Demonology (wholly false), Folk Bio = Roughly true.
          *   *User's Reply:* This distinction is intuitive/question-begging.

  3.  **Evaluate the "Fish" Analogy (The Core Conflict):**
      *   Why do we keep "fish" but drop "phlogiston"?
      *   *Phlogiston:* The *mechanism* was wrong (release vs. uptake). The *ontology* was wrong (substance vs. process). Nothing in modern chemistry maps to "phlogiston."
      *   *Fish:* "Fish" is a paraphyletic group. Modern biology says "there is no clade 'fish'." However, we still use the term pragmatically. But strictly speaking, a biological realist might say "fish" is a folk category, not a natural kind. *Wait, this helps the EM argument.* If the user insists "fish exist," they are relying on a pragmatic ontology, not a strict scientific one.
      *   *Sunrises:* We know the earth moves. "Sunrise" is a phenomenological description, not an ontological claim about the sun moving. We don't eliminate the *experience*, just the *geocentric explanation*.
      *   *Beliefs:* EM claims beliefs are like phlogiston (non-referring), not like sunrises (phenomenological) or fish (pragmatic grouping).

  4.  **Identify the Flaw:**
      *   The flaw isn't necessarily in (1), (2), or (4). It's in the interpretation of **(3)** and the application of **(1)**.
      *   Specifically, the criterion for "approximately true" in (1) is being applied too strictly in the FP case compared to the Folk Physics/Biology case, OR the definition of "theory" in (2) is doing too much work.
      *   *Better Diagnosis:* The problem lies in the **ambiguity of "Existence" in Step (1)**.
      *   Phlogiston fails because it posits a *causal mechanism* that doesn't exist.
      *   Beliefs/Desires might not be causal mechanisms in the neuroscientific sense, but they are *functional states*.
      *   Folk Biology (Fish): "Fish" is a *classification*. It's imprecise but refers to real clusters of organisms.
      *   Folk Physics (Sunrise): "Sunrise" is an *appearance*. It doesn't claim the sun moves; it claims the sun *appears* to rise.
      *   Folk Psychology (Belief): Does it claim a specific neural mechanism? No. It claims a functional role.
      *   *The Churchland Move:* FP claims beliefs are sentence-like propositional attitudes with specific causal powers. Neuroscience shows nothing like that.
      *   *The Counter-Move:* FP is a *heuristic*, not a strict theory.

  5.  **Formulating the Diagnosis:**
      *   I need to tell the user where to break the chain without sacrificing the phlogiston intuition.
      *   **Option A: Reject (1) slightly.** Modify "approximately true" to "successfully refers." Phlogiston fails reference. Beliefs might succeed via functional reference even if the structural account is wrong.
      *   **Option B: Reject (3).** Argue that FP's stagnation/gaps don't imply falsity, but rather *autonomy*. FP operates at a different level of abstraction than neuroscience (like software vs. hardware).
      *   **Option C: Reject (2).** FP isn't a theory; it's a know-how. (User seems willing to grant (2) for the argument, so maybe avoid this).
      *   **Option D: The "Level" Distinction.** This is the strongest non-question-begging disanalogy.
          *   Phlogiston was a *rival* theory to Oxygen chemistry. Same domain, same level.
          *   FP and Neuroscience are *different levels*. FP is functional/personal; Neuroscience is mechanistic/sub-personal.
          *   Folk Biology (Fish) vs. Cladistics: Same level (classification).
          *   Folk Physics (Sunrise) vs. Astronomy: Phenomenology vs. Mechanism.
          *   *Crucial Point:* "Fish" is a bad scientific kind, but a good pragmatic kind. "Beliefs" are bad neural kinds, but good functional kinds.
          *   *Wait, EM says functional kinds don't exist either.*
          *   *Refinement:* The error is in Step (1)'s universal application. Step (1) works for *fundamental* ontology (what the world is made of) but not for *higher-level* ontology (patterns that emerge). Phlogiston was claimed to be fundamental. Beliefs are higher-level.

      *   **Decision:** The best diagnosis targets **Step (1)** but refines it, OR targets **Step (3)** by challenging the criteria for "truth" in higher-level theories.
      *   Actually, the most robust philosophical response to Churchland (from people like Dennett or Fodor) is to attack the inference from "FP is not neuroscience" to "FP is false." This attacks **(3)**'s implication that FP *ought* to look like neuroscience to be true.
      *   However, the user asks: "Which step do I give up?"
      *   If I keep (1) (to save phlogiston elimination), I must show why FP passes (1) while Phlogiston fails.
      *   This requires showing FP *is* approximately true, contrary to (3).
      *   So, the break is at **(3)**. But I need to explain *why* the housemate's evidence for (3) (gaps, exceptions, stagnation) doesn't prove falsity.
      *   *Argument:* FP is a *normative* or *functional* framework, not a *causal-mechanical* one. Its "laws" are ceteris paribus (all else being equal). The lack of strict laws doesn't make it false, just distinct from physics.
      *   *Disanalogy with Fish:* "Fish" was a failed attempt at a *scientific cladistic group*. "Belief" is not an attempt at a *neural group*. It's an attempt at an *intentional stance* description.
      *   *Disanalogy with Phlogiston:* Phlogiston claimed to be the *stuff* of combustion. Beliefs don't claim to be the *stuff* of thought (neurons); they claim to be the *organization* of thought.

  6.  **Drafting the Response:**
      *   **Acknowledge the strength:** The user's reductio (5-6) is a classic and powerful objection (often associated with Lynne Rudder Baker or Jerry Fodor).
      *   **The Diagnosis:** The flaw is in the **univocal application of Step (1)**. Step (1) conflates *fundamental* ontology with *derived/higher-level* ontology.
      *   **Step to Modify:** You don't give up (1) entirely, but you restrict its scope. Or, you give up the specific interpretation of **(3)** that demands FP compete directly with neuroscience.
      *   **Let's choose Step (3).** Why? Because (1) is needed for phlogiston. (2) is granted. (4) follows from 1-3. If (3) is wrong (FP *is* approximately true, just not in the way neuroscience is), then (4) fails.
      *   **Addressing the Housemate's Evidence for (3):**
          *   *Silence on sleep/memory:* FP isn't meant to explain the *mechanism* of memory, but the *content* of what is remembered. (Level distinction).
          *   *Exception-ridden:* FP laws are ceteris paribus. This is typical of special sciences (biology, economics), not a sign of falsity.
          *   *Stagnation:* FP is a stable equilibrium of social coordination, not a research program.
      *   **Addressing the Fish/Phlogiston Disanalogy:**
          *   Phlogiston: Wrong about the *direction* of the process (release vs uptake). Radical error.
          *   Fish: Wrong about *boundaries* (whales), but right about *cluster properties* (gills, fins, water).
          *   Beliefs: Right about *cluster properties* (goal-directedness, sensitivity to information). Wrong about *implementation* (sentence-like structures in the head).
          *   *Key:* If EM says beliefs don't exist because they aren't sentence-like neural states, then "fish" don't exist because they aren't monophyletic clades. If we keep "fish" as a useful category despite cladistic error, we keep "beliefs" as a useful category despite neural error.
          *   *The Cost:* You must accept that "existence" is scale-relative. Phlogiston doesn't exist at *any* scale. Beliefs exist at the *personal/functional* scale, just as "solidity" exists at the human scale but not the quantum scale.

  7.  **Refining the "Cost":**
      *   If you break at (3), you save beliefs and fish.
      *   Cost: You must accept a pluralistic ontology. There is no single "true" description of the world. Chemistry doesn't eliminate biology; neuroscience doesn't eliminate psychology.
      *   Does this threaten Phlogiston? No. Phlogiston fails at *its own* scale. It didn't predict combustion better than oxygen theory even phenomenologically. FP predicts behavior better than (current) neuroscience.
      *   *Wait, check that:* Does FP predict behavior better? Yes, for macro-behavior. Neuroscience predicts seizures, not voting.
      *   *Phlogiston check:* Did Phlogiston predict combustion? Yes, but poorly. Oxygen predicted it better.
      *   *So the criterion is:* Does the theory offer the *best available explanation* in its domain?
      *   Phlogiston: No (Oxygen won).
      *   FP: Yes (Neuroscience can't yet predict behavior based on beliefs).
      *   Folk Biology: Yes (Cladistics is too technical for catching fish).
      *   *This saves (1) but refines "approximately true" to "indispensable/successful in its domain."*

  8.  **Final Plan:**
      *   Validate the user's intuition (the reductio is strong).
      *   Identify the break point: **Step (3)**.
      *   Explain why the evidence for (3) (gaps, exceptions, stagnation) indicates *autonomy*, not *falsity*.
      *   Provide the non-question-begging disanalogy: **Predictive Success/Indispensability in Domain**.
      *   Phlogiston was superseded in its own domain. FP is not superseded in its domain (predicting action).
      *   Cost: Accepting ontological pluralism (levels of reality).

  9.  **Self-Correction/Nuance:**
      *   Churchland would argue FP *is* superseded by connectionist models.
      *   I need to make sure I don't just say "FP works." I need to explain *why* the Housemate's criteria for "truth" are too strict for special sciences.
      *   The "Exception-ridden" point is crucial. Biology and economics are exception-ridden. Are they false? No. They are *ceteris paribus* sciences. FP is the same.
      *   The "Stagnation" point: FP is a cultural tool, not a lab science. Its stability is a feature, not a bug.
      *   The "Silence" point: Category error. FP explains *why* (reasons), Neuroscience explains *how* (mechanisms).

  10. **Structure of the Output:**
      *   **Diagnosis:** The flaw is in the inference within Step (3) regarding what counts as "approximately true" for a high-level theory.
      *   **The Disanalogy:** Phlogiston vs. FP/Folk Bio regarding *domain competence*.
      *   **The Cost:** Ontological Pluralism (rejecting the idea that only fundamental physics is "real").
      *   **Addressing the Housemate's Defense:** Why "Demonology" is the wrong analogy.

