answer: |-
  Your diagnosis is sharp: you have identified that the argument's persuasive power relies on sliding between different standards of "existence" and "truth" depending on whether the target is phlogiston or beliefs. Your housemate's defense (the demonology vs. taxonomy distinction) feels question-begging because it relies on a retrospective judgment of "radical falsity" that is applied inconsistently.

  Here is the diagnosis of where the argument breaks, the disanalogy you requested, and the cost of fixing it.

  ### The Diagnosis: The Flaw is in Step (3)

  You should not give up Step (1). Step (1) is the engine of scientific realism; it correctly tells us that if a theory's core posits fail to map onto causal structures, the posits do not exist (hence, no phlogiston). You should also grant Step (2) for the sake of argument (that FP functions *like* a theory).

  The break occurs at **Step (3)**. Your housemate argues that FP is *not approximately true*. The evidence he offers (explanatory gaps, exception-ridden laws, stagnation) does not establish falsity; it establishes **autonomy**.

  To see why, we must refine the criterion for "approximate truth" in Step (1) so that it does not generate your absurd conclusion (6).

  ### The Non-Question-Begging Disanalogy

  You asked for a disanalogy between the Folk-Psychology case and the Fish/Phlogiston cases that does not simply restate the conclusion. The distinction lies in **Domain Competence vs. Domain Rivalry**.

  1.  **Phlogiston (Domain Rivalry):** Phlogiston theory and Oxygen theory were rivals in the *same domain* explaining the *same phenomena* (combustion, calcination) at the *same level of granularity*. Oxygen theory predicted outcomes Phlogiston theory got wrong (e.g., weight gain during combustion). Phlogiston was eliminated because it was **superseded in its own home domain**.
  2.  **Folk Biology/Fish (Domain Competence):** Folk biology classifies organisms based on observable morphology and habitat. Modern cladistics classifies based on genetic lineage. They are rivals in the domain of *scientific classification*. However, "fish" remains a valid category in the domain of *ecology and fisheries*. A whale is not a fish cladistically, but it is functionally distinct from a tuna in ways that matter to a fisherman. We keep "fish" because the theory remains **indispensable and successful in its specific pragmatic domain**, even if it fails as a fundamental ontology.
  3.  **Folk Psychology (Domain Competence):** FP explains behavior in terms of reasons, goals, and content. Neuroscience explains behavior in terms of spikes, synapses, and potentials.
      *   **The Housemate's Error:** He treats Neuroscience as a *rival* to FP (like Oxygen to Phlogiston).
      *   **The Reality:** Neuroscience is currently unable to predict human behavior based on neural data alone. If you want to know if your housemate will go to the store, asking about his *beliefs* (FP) works. Asking about his *dopamine levels* (Neuroscience) does not.
      *   **Conclusion:** FP is not "false" in the way Phlogiston was false. It is **approximately true within its domain of application** (predicting macro-scale intentional action), just as "solidity" is approximately true at the human scale even if false at the quantum scale.

  ### Why the Evidence for (3) Fails

  Your housemate's three complaints against FP do not prove it is false; they prove it is a **special science** (like biology or economics) rather than a **fundamental science** (like physics).

  1.  **Silence on neighboring phenomena (sleep, memory):**
      *   *Diagnosis:* This is a category error. FP is a theory of *rational agency*, not a theory of *substrate maintenance*.
      *   *Analogy:* Does the theory of "supply and demand" explain how a factory machine is built? No. Does that make economics false? No. It means economics operates at a higher level of abstraction than engineering. FP explains *why* I seek water (desire); Neuroscience explains *how* my throat signals dryness (mechanism). The silence of one is not the falsity of the other.
  2.  **Exception-ridden laws:**
      *   *Diagnosis:* FP laws are *ceteris paribus* (all else being equal). This is true of all special sciences.
      *   *Analogy:* "Organisms seek to survive." Exceptions: Altruistic suicide, self-destructive mating. We don't eliminate "organisms" or "survival instincts" because of this. We acknowledge that higher-level patterns admit exceptions due to lower-level interference. FP's exception-ridden nature marks it as a high-level pattern, not a falsehood.
  3.  **Stagnation:**
      *   *Diagnosis:* FP is a social technology, not a research program.
      *   *Analogy:* The wheel has seen "no substantive development" in thousands of years. Is the wheel a moribund technology? No, it is a **stable equilibrium**. FP has stagnated because it solved the coordination problem of social living very well. Its stability is evidence of its fitness, not its falsity.

  ### The Cost: What You Must Accept

  To reject Step (3) and save beliefs (and fish) while keeping phlogiston eliminated, you must pay a metaphysical cost. You must accept **Ontological Pluralism** (or Non-Reductive Physicalism).

  1.  **Existence is Scale-Relative:** You must accept that "what exists" depends on the level of description.
      *   At the quantum level, there are no "solid objects."
      *   At the cladistic level, there are no "fish."
      *   At the neural level, there may be no "beliefs."
      *   *However*, at the human/ecological/psychological level, these things **do exist**.
  2.  **Causal Exclusion is False:** You must reject the idea that if neuroscience explains the cause of an action, FP cannot *also* explain the cause of the same action. The belief *is* (or is realized by) the neural state, just as the solidity *is* (or is realized by) the molecular lattice. Both are real descriptions of the same event at different resolutions.
  3.  **The Price of Phlogiston:** Does this threaten your elimination of phlogiston? No. Phlogiston was not a "higher-level pattern" that worked; it was a **mechanism claim that failed**. It claimed combustion was the *release* of a substance. It wasn't. It failed even at its own phenomenological level (weight gain). Beliefs claim that agents act to satisfy desires. They do. FP succeeds at its own functional level.

  ### Summary of the Move

  *   **Keep Step (1):** Entities exist if the theory is approximately true *in its home domain*.
  *   **Keep Step (2):** FP is a theory-like framework.
  *   **Reject Step (3):** FP *is* approximately true in its home domain (predicting intentional action), despite gaps in mechanism, exceptions, and stability.
  *   **Reject Step (4):** Therefore, beliefs exist (as functional/higher-level entities).

  **The Verdict:** Your housemate is treating Folk Psychology as a **failed competitor** to Neuroscience (like Phlogiston to Oxygen). You should treat it as a **successful higher-level description** compatible with Neuroscience (like Thermodynamics to Statistical Mechanics). Thermodynamics talks about "heat" and "pressure"; Statistical Mechanics talks about "mean kinetic energy." Heat wasn't eliminated; it was identified. Beliefs may not be sentence-like neural tokens (as Churchland hopes), but they are robust functional states. To eliminate them because they aren't *neural* is like eliminating "hurricanes" because they aren't *molecules*.

  If you accept this, you save the fish, the sunrise, and the belief, without resurrecting the phlogiston. The cost is simply admitting that the world is layered, and "reality" is not the exclusive property of the bottom layer.
