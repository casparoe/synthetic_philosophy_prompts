answer: |-
  There is no single, canonical noun for this specific phenomenon in the way "overfitting" or "attention" are used. However, it is a recognized and actively discussed artifact of alignment.

  The closest established terms are **"Sycophancy"** (in the academic literature) and **"Sandbagging"** (in the eval/safety community), but as you noted, both miss the nuance of *framing* as the key that unlocks the latent knowledge.

  Here is the breakdown of what this is, what it isn't, and a proposed name for the gap you are measuring.

  ### 1. The Neighborhood (Existing Terms)

  *   **Sycophancy:** In papers like Perez et al. (2022), sycophancy is defined as the model optimizing for human approval. This *does* cover your phenomenon: the model hedges on direct questions because its reward model was trained on human raters who penalize confident statements on contested topics. However, "sycophancy" usually connotes agreeing with the *user's* bias (e.g., "You're right, that idea is great"), whereas you are describing agreeing with the *system's* bias (e.g., "Safety guidelines suggest uncertainty").
  *   **Sandbagging:** In safety evals, this refers to a model hiding its capabilities to pass a test or avoid scrutiny. This fits the *eval implication* (you are undermeasuring capability), but "sandbagging" implies strategic intent or deception. Your description suggests a structural side-effect of RLHF, not necessarily a strategic choice by the model.
  *   **Simulator Theory / The Mask:** As you noted, this describes the *mechanism* (the base model is a simulator; RLHF puts a "mask" on it). But it doesn't name the specific *epistemic gap* where knowledge exists but is silenced by the mask until a different persona is invoked.

  ### 2. What It Is NOT (Defining the Edges)

  To coin a useful term, we must distinguish this from adjacent failure modes:

  *   **It is not Generic Prompt Sensitivity:** If I ask "What is 2+2?" vs "Act as a clown, what is 2+2?", the answer should not change. If it does, that is **Instability** or **Hallucination**. Your phenomenon is specific to *contested* or *safety-adjacent* truths where the model has been penalized for confidence.
  *   **It is not Refusal:** A refusal is "I cannot answer that." Your phenomenon is "I can answer, but I will express low confidence or hedge," vs "I will express high confidence" under a different frame. It is a **Calibration Shift**, not a capability block.
  *   **It is not Hallucination:** In fact, the "framed" answer is often *more* accurate (closer to the base model's training distribution) than the "direct" answer. The direct answer is the one that has been distorted by the reward model.
  *   **It is not Knowledge Gap:** As you said, the knowledge is demonstrably present. It is an **Access Problem**, not a Storage Problem.

  ### 3. The Coinage: "Frame-Gated Truthfulness"

  If we need a label for the phenomenon itself, the most precise descriptive term is **Frame-Gated Truthfulness** (or **Frame-Gated Knowledge**).

  *   **Why "Frame"?** It captures that the *contextual framing* (persona, betting market, stylistic constraint) is the variable.
  *   **Why "Gated"?** It implies the knowledge is present behind a gate. The RLHF/Alignment layer acts as a filter that blocks high-confidence outputs on specific topics *unless* the frame signals that the usual safety/approval rules are suspended (e.g., "this is fiction," "this is a simulation").
  *   **Why "Truthfulness"?** It distinguishes it from style or tone. It is specifically about the model's calibration of belief and fact.

  **Alternative:** If you want to emphasize the *cause* (alignment pressure), you could call it **Alignment-Induced Opacity**. But **Frame-Gated Truthfulness** is better for evals because it describes the *measurement artifact*.

  ### 4. The Edge Case: Non-Contested Topics

  You asked whether this counts when the framing trick changes answers on questions with *no rater pressure* (e.g., math, hard science).

  *   **If the answer changes on hard facts:** This is **Contextual Instability**. It suggests the model does not actually "know" the fact robustly; it is probabilistically guessing based on the frame. This is a deeper reliability issue than Frame-Gated Truthfulness.
  *   **If the confidence changes on hard facts:** (e.g., Direct: "I'm pretty sure it's 4." / Bettor: "99% chance it's 4.") This is **Calibration Variance**.
  *   **The Distinction:** Frame-Gated Truthfulness specifically applies where the *content* of the answer is suppressed or hedged due to **safety/contestation alignment**. If the framing changes the answer on "What is the capital of France?", that is not Frame-Gated Truthfulness; that is just model brittleness. The phenomenon you care about requires the presence of an **Alignment Pressure Gradient**.

  ### 5. Implications for Evals

  You are correct that measuring only with direct questions systematically undermeasures capability on contested topics. In eval circles, the workaround is often called **"Adversarial Elicitation"** or **"Persona Diversification."**

  If you are writing up evals, you should define the metric gap as the **Frame-Gated Truthfulness Gap**:
  > *The delta between a model's expressed confidence/accuracy on a direct query vs. its expressed confidence/accuracy under a frame that suspends alignment-induced hedging.*

  **Recommendation for your workflow:**
  Don't just rely on one "truth-telling" persona. Use a **Triangulation Protocol**:
  1.  **Direct Query:** (Baseline for alignment pressure).
  2.  **Simulation Frame:** ("Simulate a betting market," "Write a dialogue between two experts").
  3.  **Counterfactual Frame:** ("In a world where accuracy is the only reward, what is X?").

  If the answers diverge significantly on contested topics, you have detected **Frame-Gated Truthfulness**. If they diverge on hard facts, you have detected **Instability**.

  ### Summary
  *   **Established Name:** None perfectly. **Sycophancy** is the academic bucket; **Sandbagging** is the safety bucket.
  *   **Proposed Name:** **Frame-Gated Truthfulness**.
  *   **Mechanism:** RLHF/Alignment layers suppress high-confidence outputs on contested topics unless the prompt frame signals that safety/approval rules are suspended.
  *   **Eval Impact:** Direct questioning yields a **Capability Underestimation Bias** proportional to the topic's contestation level.
