  10. **Final Polish:** Ensure the distinction between IIA (Arrow) and Clone Independence (Tideman) is clear, as the user's Scenario 2 is specifically about clones (M and M'). Condorcet methods satisfy Clone Independence but not strict IIA. This is a vital distinction to make so I don't claim the impossible.

      *   *Plan:*
          1.  Validate the intuition.
          2.  Define the "Majoritarian Charter" (Condorcet + Clone Independence + Transitivity).
