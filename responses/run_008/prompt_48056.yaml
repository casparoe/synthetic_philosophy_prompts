  11. (Self-Correction on Scenario 2): The user describes M (40), R (31), M' (29). M+M' = 69. R = 31. In pairwise, M likely beats R. M' is a clone. FPTP fails. Condorcet passes (M beats R). This is **Independence of Clones**, not strict IIA. Strict IIA says if M beats R, adding M' shouldn't change it. Clone Independence says adding a *similar* candidate shouldn't help a *dissimilar* candidate win. Condorcet methods satisfy Clone Independence. I must be precise here.

