          2.  *Independence of Irrelevant Alternatives (IIA) / Clone Independence:* 100 voters. M (40), R (31), M' (29). M' splits M's vote, R wins. 69 prefer M to R. User says M should win; presence of M' shouldn't change M vs R outcome.
          3.  *Transitivity/Consistency:* 3 voters, cyclic preferences (X>Y>Z, Y>Z>X, Z>X>Y). User wants a coherent output (no cycles in social preference), though suspects the electorate might be at fault.
          4.  *Monotonicity:* A candidate shouldn't lose if supporters raise them on ballots. User finds this unacceptable if violated.
          5.  *Participation Criterion:* A candidate shouldn't win *only* because their supporters stayed home (No-Show Paradox). User finds this unacceptable (less fiercely than monotonicity).
          6.  *Anonymity:* Swapping ballots shouldn't change outcome. (Trivial).
          7.  *Pareto Efficiency:* If everyone prefers A to B, group can't prefer B to A. (Trivial).
      *   **Specific Questions:**
          1.  Is there a single principle or short list of clauses covering these verdicts? State precisely and map to scenarios.
