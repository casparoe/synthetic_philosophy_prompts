      *   *Verdict 2 (M vs R disturbed by M'):* This is **Independence of Irrelevant Alternatives (IIA)** or, more specifically in voting theory, **Independence of Clones** (since M and M' are "clones"). Arrow's Impossibility Theorem looms large here.
      *   *Verdict 3 (No Cycles):* This is **Transitivity** of the social ordering.
      *   *Verdict 4 (Monotonicity):* Raising a winner shouldn't make them lose.
