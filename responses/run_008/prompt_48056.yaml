      *   *Verdict 6 & 7 (Anonymity & Pareto):* Basic fairness/dominance.

  3.  **Identify Conflicts (The "Impossible" Part):**

      *   *Arrow's Impossibility Theorem:* You cannot have a ranked voting system that satisfies Unrestricted Domain, Non-Dictatorship, Pareto Efficiency, and IIA simultaneously.
      *   *Gibbard-Satterthwaite:* No deterministic ranked system is immune to strategic voting (unless it's a dictatorship or limits choices to 2).
      *   *Condorcet vs. Monotonicity:* Most Condorcet methods violate Monotonicity (e.g., Ranked Pairs, Schulze).
      *   *Condorcet vs. Participation:* Most Condorcet methods violate the Participation Criterion (No-Show Paradox).
      *   *Condorcet vs. IIA:* Condorcet methods generally violate IIA (adding a candidate can change the winner, especially in cycles).
      *   *The User's Conflict:* The user suspects the "head-to-head one" (Condorcet) and "not disturbing contests" (IIA/Clone Independence) are at war. They are right.

