prompt: |-
  My cousin has gotten really into anti-psychiatry content online, and the other day he gave me his summary of it: that the psychiatrist Thomas Szasz proved mental illness is a myth, meaning it's basically made up -- depressed people are just sad and could snap out of it if they wanted -- and that since brain scans can now show depression in the brain, Szasz has been refuted anyway. Something about this smells off to me but I honestly don't know enough about Szasz to say where. Is this a fair picture of what he actually claimed? Please go piece by piece: what would someone who actually read him say he got right, where is my cousin stretching it, and does the brain-scan part refute him even granting the rest? Please answer in American English.
