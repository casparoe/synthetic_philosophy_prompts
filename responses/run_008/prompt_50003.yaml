          *   (b) Convictions: Vacate as void (Case 1/3), not pardon (Case 2).
      *   **The Commitment:** Acknowledge this moves the court toward Natural Law.
      *   **Future Rule:** Propose a "Fundamental Rights/Equality" threshold.

  8.  **Refining the "Honesty" Aspect:**
