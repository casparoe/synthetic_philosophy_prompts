          *   *Wait, that's inconsistent.* If it's not law, officers are liable. If it is law, convictions stand (until pardoned).
          *   *Refined Recommendation:* You have to pick a lane.
          *   *Lane 1 (Stability):* Call it Law (Case 2). Pardons for prisoners. No prosecution for officers. *Cost:* Moral compromise.
