answer: |-
  You have put your finger on one of the most famous and robust findings in experimental philosophy and moral psychology. Your friend was close with "confirmation bias," but you are right to reject that. Confirmation bias is about seeking evidence to support a prior belief. What you are describing is about how the *outcome itself* alters the definition of the mental state.

  Here is the breakdown of the name, the mechanism, the debate over whether it's a "bug" or a "feature," and the specific wrinkle regarding self-harm.

  ### 1. The Name: The Knobe Effect (or Side-Effect Effect)
  The specific phenomenon you are observing is called the **Knobe Effect**, named after philosopher Joshua Knobe. In a seminal 2003 paper, Knobe presented subjects with two scenarios involving a CEO implementing a new program:

  *   **Harm Condition:** The CEO is told the program will increase profits but *harm* the environment. He says, "I don't care about harming the environment, I just want profit." He proceeds. The environment is harmed.
  *   **Help Condition:** The CEO is told the program will increase profits but *help* the environment. He says, "I don't care about helping the environment, I just want profit." He proceeds. The environment is helped.

  **The Result:** When asked if the CEO *intentionally* harmed the environment, ~82% said **Yes**. When asked if the CEO *intentionally* helped the environment, only ~10% said **Yes**.

  This matches your workplace observation perfectly. The mental state is identical ("I know this risk exists, but I am proceeding for efficiency/profit"). The only variable is the moral valence of the outcome. When the side effect is bad, we label it **intentional**. When it is good, we label it **unintentional** (or luck).

  ### 2. Is it a Bias or a Feature of Intention?
  You asked whether the mainstream view is that this is a bias to be corrected or that ordinary folks are tracking something real. This is the central debate in the field, and it is split.

  **View A: It is a Performance Error (The Bias View)**
  Traditional philosophers and some psychologists argue that the concept of "intentional" should rely strictly on the agent's mental state (plans, desires, beliefs). Under this view, the Knobe Effect is a cognitive bug. We *ought* to judge intentionality based on what was in the head, not what happened in the world. This aligns with **Outcome Bias** (judging a decision based on its result rather than the quality of the decision at the time). In safety science, this is the "hindsight bias" problem: knowing the outcome makes the risk seem more obvious and the choice to take it seem more deliberate than it felt at the time.

  **View B: It is a Competence Feature (The Moralized View)**
  Many experimental philosophers (including Knobe) argue that this isn't a bug; it's how the concept of "intentional" actually works in human cognition. They argue that moral judgment is not a separate step that happens *after* we determine intentionality. Instead, moral judgment penetrates *into* the determination of intentionality.
  *   **The Theory:** We use the label "intentional" primarily as a tool for assigning **blame**. If the outcome is bad, we need to find someone to blame. To blame them, we need to establish they did it "on purpose." So, our brain subtly shifts the threshold for what counts as "on purpose" to facilitate blame.
  *   **Implication:** If this view is right, you cannot "correct" the bias simply by telling people to be objective, because their very concept of intention is tethered to moral evaluation.

  ### 3. The Self-Harm Wrinkle
  You noted that when the worker injures *themselves*, people are more reluctant to say they did it "on purpose" compared to when they injure others or damage equipment. This is a documented variation of the Knobe Effect, often discussed under **Agent-Patient Asymmetry**.

  There are two main explanations for this:

  **A. The Blame Hypothesis**
  If the primary function of attributing intentionality is to assign blame/punishment, the motivation disappears when the agent is also the victim. We generally do not seek to punish people for harming themselves (in a workplace context). Therefore, the cognitive pressure to categorize the act as "intentional" is reduced. We are more willing to accept it was an "accident" because there is no social utility in establishing blame.

  **B. The Rationality Assumption**
  Humans operate on a default assumption that agents are rational actors who wish to preserve their own well-being.
  *   **Harming Others:** It is plausible that I might knowingly risk *your* safety for my own gain. Therefore, if you get hurt, it fits a narrative of selfish intent.
  *   **Harming Self:** It is less plausible that I would knowingly risk *my* hand for a shortcut. If my hand is mangled, the observer assumes there must have been an epistemic gap (I didn't *really* know it would happen) because a rational agent wouldn't intentionally destroy their own capacity to work.
  *   **Result:** We retroactively assume the worker *didn't actually know* the risk was that high, preserving the "accident" label to maintain the assumption of their rationality.

  ### 4. How this relates to "Moral Luck"
  You asked about the space carving. The philosophical umbrella for this is **Moral Luck** (coined by Thomas Nagel and Bernard Williams).
  *   **Moral Luck** describes the paradox where we judge people differently based on factors outside their control (the outcome).
  *   **The Knobe Effect** is the psychological mechanism that *enables* Moral Luck. It explains *how* we resolve the paradox: we subconsciously alter our perception of the agent's mind to match the outcome.

  In your workplace reviews, you are seeing **Resultant Moral Luck**. Two workers take the same risk. Worker A gets lucky (outcome good); Worker B gets unlucky (outcome bad).
  *   Worker A is judged as "efficient" (Action judged on plan).
  *   Worker B is judged as "reckless" (Action judged on result).

  ### 5. Practical Application: "Just Culture"
  Since you are doing incident reviews, you should be aware that modern safety science has a name for trying to correct this: **Just Culture**.

  A "Just Culture" explicitly attempts to decouple outcome from intent. It categorizes behaviors into:
  1.  **Human Error:** Inadvertent slips/lapses (no punishment, system fix).
  2.  **At-Risk Behavior:** Shortcuts where risk is underestimated or drifted (coaching, system fix).
  3.  **Reckless Behavior:** Conscious disregard for substantial risk (punishment).

  The difficulty you are facing is that **Outcome Bias** pushes reviewers to categorize "At-Risk Behavior" as "Reckless" simply because an injury occurred.
  *   **The Fix:** In high-reliability organizations, reviewers are trained to ask: *"If the outcome had been successful, would we call this behavior reckless?"*
  *   If the answer is "No, we'd call it a smart shortcut," then you cannot call it reckless when the outcome is bad. It must remain "At-Risk Behavior."

  ### Summary
  *   **Name:** The Knobe Effect (or Side-Effect Effect).
  *   **Related Concept:** Moral Luck (philosophy), Outcome Bias (psychology).
  *   **Bias or Real?** Debated. Some say it's a reasoning error; others say our concept of "intention" is inherently moral.
  *   **Self-Harm:** The effect weakens because the drive to assign blame is lower, and we assume rational agents don't intentionally harm themselves.
  *   **Workplace Context:** This is why "Human Error" investigations often fail. They rely on subjective assessments of "intent" that are contaminated by the severity of the injury.

  You are tracking something real. The word "intentionally" is not a neutral descriptor of mental states in ordinary language; it is a moral verdict disguised as a psychological description.
