      *   *Nuance:* Is it *pure* instrumentalism? Dennett says if the stance works, the beliefs are "real enough." But labs often deny *ontological* reality while using the *predictive* utility.
      *   *Interpretability:* When interpretability researchers map activations to "beliefs" (e.g., truthfulness vectors), they lean towards a form of Functionalism or even Representational Realism. They are claiming there is a physical substrate (activations) that carries semantic content.
