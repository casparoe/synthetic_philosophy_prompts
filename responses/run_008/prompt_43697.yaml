      *   *Eval Practice:* "The model deceptive aligned," "sandbagging," "situational awareness." This language is inherently mentalistic. It treats the model as an agent with goals and epistemic states.
      *   *The Conflict:* If it's *just* pattern matching, how can it *deceive*? Deception requires a model of the evaluator's mind and an intent to mislead. Pattern matching can *mimic* deception, but can it *be* deception without belief?

  3.  **Address Question 1 & 2: Theory of Mind in Eval Practice:**
