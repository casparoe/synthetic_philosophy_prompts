      *   *The Catch:* The labs often deny the *capacity* for belief (it's just next-token prediction), not just the phenomenology. This creates a contradiction. If the intentional stance works *too* well (e.g., instrumental convergence, deceptive alignment), the "just statistics" defense weakens.
