answer: |-
  # What Do You Really Think About the Lottery and Preface Paradoxes?

  **A Diagnostic Quiz for the Philosophically Inclined**

  Many introductions to epistemology ask you to pick a team: *'Are you a contextualist or an invariantist?'* But labels are often just costumes we wear after the work is done. This quiz is designed to bypass the jargon. It presents ten concrete scenarios drawn from the neighbourhood of the Lottery and Preface paradoxes.

  Read each case and select the option that best matches your immediate reaction. Do not overthink it; your first instinct is usually the most diagnostic. At the end, you will find a scoring key to help you locate your philosophical commitments.

  ***

  ### The Questions

  **1. The Single Ticket**
  You hold one ticket in a fair lottery with one million tickets and exactly one winner. The draw has not happened yet. Without checking any further information, are you in a position to *know* that your ticket will lose?
  *   A) Yes. The odds are overwhelmingly in your favour.
  *   B) No. It is merely very probable, not known.
  *   C) It depends on how much the prize is worth.

  **2. The Pile of Tickets**
  Imagine you have looked at every single ticket in that same lottery (except the winner, which you haven't identified). For each individual ticket, you are confident it will lose. Does it follow that you are confident that *all* of them will lose?
  *   A) Yes. If I'm sure of each, I'm sure of the lot.
  *   B) No. I can be sure of each individually, but not of the whole group together.
  *   C) I wouldn't say I am 'sure' of any of them in the first place.

  **3. The Humble Author**
  An author has written a non-fiction book containing one thousand claims. She has checked each one carefully and believes every single claim is true. However, in the preface, she writes: 'Despite my best efforts, at least one claim in this book is surely mistaken.' Is the author being irrational?
  *   A) Yes. She cannot logically believe every claim is true and also believe one is false.
  *   B) No. It is reasonable to trust your research while acknowledging human fallibility.
  *   C) She should not claim to believe the individual claims so strongly.

  **4. The Asymmetry**
  Consider the lottery player (who thinks her ticket will lose) and the book author (who thinks her book contains an error). Many people feel these cases are different. Why?
  *   A) They aren't different; both are in the same logical boat.
  *   B) The author has specific evidence about human fallibility; the lottery is pure chance.
  *   C) The lottery player is claiming knowledge; the author is only claiming high probability.

  **5. The Elimination**
  Imagine a lottery where tickets are checked physically one by one. You watch 999,999 tickets being confirmed as losers. Only one ticket remains unchecked. Do you now *know* the remaining ticket is the winner?
  *   A) Yes. The process of elimination secures the knowledge.
  *   B) No. It is still possible the checking process made a mistake.
  *   C) Yes, but only because the odds are now 100%, not before.

  **6. The Actuary**
  An insurance actuary calculates that the chance of a specific historic house burning down this year is less than one in a million. She writes in her report: 'This house will not burn down.' Does she know this statement is true?
  *   A) Yes. That is what statistical expertise provides.
  *   B) No. Statistics can never yield knowledge of specific events.
  *   C) She knows it for the purposes of business, but not in a strict philosophical sense.

  **7. The Student**
  A student has memorised every past exam paper for a course and knows the professor never changes the format. She says, 'I know I will pass the exam.' Is she correct?
  *   A) Yes. She has excellent inductive evidence.
  *   B) No. Something unexpected could always happen.
  *   C) She knows she will pass, provided the stakes aren't life-or-death.

  **8. The Second-Order Reflection**
  You reflect on your own mind and realise that, statistically, you are wrong about something you currently believe with confidence. Does this realisation stop you from claiming to *know* those things?
  *   A) No. I can know things even if I am generally fallible.
  *   B) Yes. If I know I make mistakes, I cannot claim certainty now.
  *   C) It stops me from claiming *knowledge*, but I can still hold strong beliefs.

  **9. The High Stakes**
  Return to the Single Ticket case (Question 1). Suppose the lottery prize is £1. Now suppose the prize is £1 million, and you are destitute. Does the change in stakes change whether you *know* you will lose?
  *   A) No. Knowledge depends on the evidence, not how much you care.
  *   B) Yes. When the stakes are high, I need more evidence to claim knowledge.
  *   C) Yes. When the stakes are low, I can speak loosely; when high, I must be precise.

  **10. The Sharp Line**
  Is there a specific point where probability turns into knowledge? For example, is 99% enough, but 98% not?
  *   A) Yes. There must be a threshold, even if we cannot pinpoint it exactly.
  *   B) No. The transition is vague; there is no sharp line.
  *   C) No. Knowledge is not the right concept; we should only talk about probability.

  ***

  ### Scoring Key and Diagnostic Map

  Tally your answers. While human intuition is rarely consistent enough for a perfect mathematical score, your dominant pattern will point towards one of the following philosophical positions.

  #### 1. The Kyburg-Style Acceptance Rule
  *   **Typical Pattern:** Q1 (A), Q2 (B), Q3 (B).
  *   **The View:** You are willing to accept propositions that are highly probable, but you deny that rational acceptance is closed under conjunction. You can believe $P$ and believe $Q$, but refuse to believe '$P$ and $Q$'.
  *   **The Awkward Commitment:** You must accept that it is rational to hold a set of beliefs that you know are logically inconsistent when taken together.
  *   **Note:** This view is distinct from simple inconsistency; it is a structured refusal to aggregate.

  #### 2. The Lockean (High Threshold)
  *   **Typical Pattern:** Q1 (A), Q2 (A), Q10 (A).
  *   **The View:** Belief is simply having a credence above a certain high threshold. If the probability is high enough, you believe it; if you believe each ticket loses, you believe all lose.
  *   **The Awkward Commitment:** You must explain why the Preface Author is not blatantly irrational for believing contradictory things, or deny that she knows her book contains an error.
  *   **Note:** Pure Lockeanism often struggles to distinguish itself from **Pragmatic Encroachment** (Leaf 5) in this quiz, as both may adjust thresholds based on context or stakes.

  #### 3. The Credence-Only Theorist (Bayesian)
  *   **Typical Pattern:** Q2 (C), Q6 (C), Q10 (C).
  *   **The View:** Binary belief (knowing/not knowing) is a folk-psychological myth. We should only speak in degrees of confidence or probability.
  *   **The Awkward Commitment:** You must reconstruct everyday talk and scientific assertion without ever using the concept of 'belief' or 'knowledge' as a genuine state.
  *   **Note:** This position is cleanly separated from the others by its rejection of the binary framework in Q2 and Q10.

  #### 4. The Anti-Luck Theorist (Safety/Sensitivity)
  *   **Typical Pattern:** Q1 (B), Q5 (A), Q3 (B), Q4 (B).
  *   **The View:** Knowledge requires that your belief could not easily have been wrong (Safety) or would change if the fact were different (Sensitivity). Lottery beliefs are 'unsafe' (you'd believe it even if you won); Elimination beliefs are 'safe'.
  *   **The Awkward Commitment:** You must accept that two beliefs supported by identical statistical evidence (Lottery vs. Elimination) differ in epistemic status solely due to modal proximity.
  *   **Note:** This quiz **cannot cleanly distinguish Safety from Sensitivity**. Both yield the same answers to these cases; separating them requires technical modal scenarios (e.g., fake barns) not included here.

  #### 5. The Pragmatic Encroacher (Subject-Sensitive Invariantist)
  *   **Typical Pattern:** Q1 (C), Q7 (C), Q9 (B).
  *   **The View:** Whether you 'know' something depends partly on the practical stakes of being wrong. High stakes raise the bar for knowledge.
  *   **The Awkward Commitment:** You must accept that two people with identical evidence can differ on who 'knows' the truth simply because one has more to lose.
  *   **Note:** As flagged under Leaf 2, a **Pure Lockean** who adjusts their probability threshold for practical reasons may look identical to a Pragmatic Encroacher in this quiz.

  #### 6. The Epistemicist (Sharp Threshold)
  *   **Typical Pattern:** Q10 (A), Q1 (B), Q5 (A).
  *   **The View:** There is a precise probability (e.g., 0.994) where belief becomes knowledge. We are just ignorant of where the line is.
  *   **The Awkward Commitment:** You must bite the bullet that a difference of 0.001 in probability can make the difference between ignorance and knowledge, even if we cannot detect it.
  *   **Note:** This is often a fallback position for those who want binary knowledge but reject vagueness.

  ### Indistinguishable Pairs and Limitations

  *   **Safety vs. Sensitivity:** As noted above, these modal theories track each other closely in standard lottery cases. Distinguishing them requires cases where a belief is safe but insensitive (or vice versa), which are too technical for this diagnostic.
  *   **Lockeanism vs. Pragmatic Encroachment:** If a Lockean claims the 'threshold' for belief shifts depending on the context, their results will mirror the Pragmatic Encroacher. This quiz isolates the *effect* (stakes matter) but cannot diagnose the *mechanism* (semantic shift vs. threshold shift).
  *   **Anti-Luck vs. Contextualism:** Both deny knowledge in the standard lottery case. Distinguishing them requires asking whether the word 'know' changes meaning in different contexts, which is difficult to test via case intuition alone.

  *If your answers were scattered across these categories, do not worry. In epistemology, a consistent set of intuitions is often the sign not of wisdom, but of having not yet thought hard enough about the hard cases.*
