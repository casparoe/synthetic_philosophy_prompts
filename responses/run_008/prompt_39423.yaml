      *   *Which Premise?* **(3)** is the faulty joint. It assumes a satisficer *can* recognize a dominating option and still satisfice. But satisficing is a search termination rule. If you recognize the dominating option, the search is over, and you take it. If you take the "good enough" one despite recognizing the "better" one, you aren't satisficing; you're being irrational.
