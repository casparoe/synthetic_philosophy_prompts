prompt: |-
  When U.S. regulatory agencies evaluate a rule, they routinely monetize the mortality benefits using a single "value of a statistical life" — an estimate derived mainly from revealed preference, i.e., the wage premiums workers accept for riskier jobs — and then sum those dollars together with compliance costs across all affected parties into one net-benefit figure. Yet the neoclassical economics that grounds this practice insists that utility is ordinal only, that it cannot be compared across persons, and that one person's gain cannot be stacked against another's loss; the revealed-preference method itself adds that choices under constrained options reveal welfare. What theory of value does cost-benefit analysis actually presuppose here? Is it that dollars, not utils, serve as a common currency (a potential-compensation story in the Kaldor–Hicks tradition), that market choices are authoritative even about life and health, or something else? Reconstruct the implicit view, say whether it is coherent in light of the objections economists themselves raise — that willingness-to-pay tracks ability to pay, that risk wages reflect desperation as much as valuation — and tell me what would have to change in the practice if agencies instead treated preferences as one input among several rather than as the measure of welfare.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** U.S. regulatory cost-benefit analysis (CBA), specifically regarding the Value of a Statistical Life (VSL).
      *   **The Tension:** CBA monetizes mortality benefits (summing dollars) vs. Neoclassical Economics foundations (utility is ordinal, interpersonal comparisons are forbidden, preferences reveal welfare under constraints).
      *   **Key Questions:**
          1.  What theory of value does CBA actually presuppose? (Dollars as currency? Kaldor-Hicks? Market authority?)
          2.  Is this coherent given internal economic objections (WTP tracks ability to pay, risk wages reflect desperation)?
          3.  What would change if preferences were treated as *one input among several* rather than *the measure of welfare*?

  2.  **Analyze Question 1: The Implicit Theory of Value:**

      *   *Neoclassical Orthodoxy:* Utility is ordinal. $U_A > U_B$ is meaningful for an individual, but $U_A > U_B$ across individuals is not. Pareto improvements are the only unambiguous welfare gain.
      *   *CBA Practice:* Summing dollars ($\sum WTP$ vs. $\sum Costs$). This implies interpersonal comparability of *money*, not utils.
      *   *The Bridge:* Kaldor-Hicks Efficiency. A policy is good if winners *could* compensate losers (potential compensation), even if they don't.
      *   *The Value Theory:* It's not strictly utilitarian (summing utils). It's "wealth maximization" or "potential Pareto improvement" measured in monetary equivalents. It treats money as a proxy for utility, assuming marginal utility of income is roughly equal across individuals (which is known to be false).
      *   *Market Authority:* It treats revealed preference (market choices) as the normative benchmark for welfare, even in non-market contexts (health/safety).

  3.  **Analyze Question 2: Coherence and Internal Objections:**

      *   *Objection 1: Ability to Pay.* WTP is constrained by budget. Rich people value safety more in dollar terms because they *have* more dollars, not necessarily because they care more in utility terms.
      *   *Objection 2: Constrained Choices/Desperation.* Labor market risk premiums (the source of VSL) aren't free choices. They reflect lack of alternatives, information asymmetry, and bargaining power.
      *   *Coherence Check:* Is CBA coherent?
          *   *Internally:* It's consistent with Kaldor-Hicks, *but* Kaldor-Hicks has known flaws (Scitovsky paradox, distributional indifference).
          *   *Normatively:* It conflicts with the neoclassical prohibition on interpersonal utility comparison by smuggling it in via the assumption that the marginal utility of money is constant.
          *   *Conclusion:* It is *operationally* coherent (it produces a number) but *theoretically* fragile. It relies on a "money metric utility" that economists know is flawed.

  4.  **Analyze Question 3: Treating Preferences as One Input:**

      *   *Current State:* Preferences (via WTP) = Welfare.
      *   *Proposed State:* Preferences = Data point. Welfare = Multi-dimensional (Rights, Equity, Capabilities, Deliberative values).
      *   *Practical Changes:*
          *   No single net-benefit number.
          *   Distributional weighting (dollars to poor count more).
          *   De-monetization of life (thresholds or constraints instead of prices).
          *   Deliberative processes (citizen juries, surveys on values rather than market behavior).
          *   Shift from "Efficiency" to "Public Reason" or "Capability Approach."

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the paradox. CBA uses neoclassical tools but violates neoclassical axioms.
      *   *Section 1: The Implicit Theory.* Identify it as **Kaldor-Hicks Efficiency** operationalized through **Money-Metric Utility**. It's not classical utilitarianism (summing utils) but "wealth maximization." It assumes money is a neutral proxy for welfare.
      *   *Section 2: Coherence Check.* Address the critiques.
          *   *Interpersonal Comparison:* CBA *does* make them, implicitly assuming $MU_{income}$ is equal. This contradicts standard theory.
          *   *WTP & Wealth:* Acknowledge the "rich value life more" problem.
          *   *Revealed Preference:* Acknowledge the "desperation" problem (adaptive preferences).
          *   *Verdict:* It is pragmatically coherent for bureaucracy but theoretically inconsistent with strict welfarism.
      *   *Section 3: The Alternative (Preferences as Input).*
          *   What changes? Break the "One Number" tyranny.
          *   Distributional Analysis (who pays, who benefits).
          *   Rights/Constraints (some things shouldn't be traded).
          *   Deliberative Valuation (what do we value, not just what do we buy).
          *   Reference the "Capability Approach" (Sen/Nussbaum) or "Civic Republicanism."
      *   *Conclusion:* Summarize the shift from "Market Mimicry" to "Public Reason."

  6.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* Make sure not to say CBA *is* utilitarianism. It's often called that, but strictly it's Kaldor-Hicks. I need to be precise.
      *   *Nuance:* Acknowledge that agencies *do* sometimes do distributional analysis now (Executive Order 12868 updates), but the *decision rule* remains net benefits.
      *   *Tone:* Analytical, philosophical, but grounded in policy practice.
      *   *Key Terminology:* Money-metric utility, Kaldor-Hicks, Pareto, Welfarism, Adaptive Preferences, Capability Approach.

  7.  **Final Polish:** Check against the prompt's specific questions.
      *   *Theory of value?* Money-metric utility / Kaldor-Hicks.
      *   *Coherent?* No, violates MU of income assumptions and revealed preference validity.
      *   *What changes?* Multi-criteria analysis, distributional weighting, de-monetization.

  8.  *(Final thought before drafting)*: Ensure I address the "ordinal utility" point specifically. Neoclassical economics says you can't measure utility cardinally. CBA measures dollars cardinally. The link is the assumption that dollars map linearly to utility, which is the weak link.

  9.  **Drafting the Content:** (Proceed to generate output based on these structured thoughts.)
answer: |-
  The tension you identify lies at the heart of modern regulatory governance. U.S. cost-benefit analysis (CBA) employs the *language* of neoclassical welfare economics while violating its foundational *axioms*. To answer your questions, we must reconstruct the implicit theory of value, test its coherence against internal economic critiques, and envision a practice that treats preferences as informational rather than constitutive of welfare.

  ### 1. The Implicit Theory of Value: Money-Metric Utility and Kaldor–Hicks

  The regulatory practice of summing dollars across persons presupposes a theory of value that is **not** classical utilitarianism (which sums utils) and **not** strict Paretian welfare economics (which forbids interpersonal comparison). Instead, it relies on **Kaldor–Hicks efficiency** operationalized through **money-metric utility**.

  *   **Money as the Common Denominator:** Neoclassical theory holds that utility is ordinal and non-comparable across persons. However, CBA treats money as a cardinal proxy for utility. By summing willingness-to-pay (WTP), agencies implicitly assume that the marginal utility of income is roughly equal across all affected individuals. If a rich person is willing to pay \$100 for safety and a poor person \$10, CBA counts the rich person's preference as ten times stronger. This converts ordinal utility into cardinal monetary units, allowing for interpersonal aggregation.
  *   **Potential Compensation (Kaldor–Hicks):** The normative justification is not that the policy makes everyone better off (Pareto), but that the winners *could* compensate the losers and still remain better off. The "net benefit" figure represents the size of the surplus available for this hypothetical compensation. The theory of value here is **wealth maximization**: society is better off if the aggregate monetary value of resources increases, regardless of who holds them.
  *   **Market Authority:** By relying on revealed preference (wage-risk premiums), CBA presupposes that market choices under existing constraints are the authoritative measure of welfare. It assumes the status quo distribution of wealth and risk is the appropriate baseline for valuation.

  ### 2. Is This Coherent? The Internal Economic Objections

  While operationally functional for bureaucracy, this framework is theoretically fragile when scrutinized through the very neoclassical lens it claims to inhabit.

  **A. The Marginal Utility of Income Problem**
  The most significant incoherence is the assumption that a dollar represents the same amount of welfare for everyone. Standard economics dictates diminishing marginal utility of income. A dollar taken from a poor person causes more utility loss than a dollar gained by a rich person.
  *   *The Contradiction:* By summing unweighted dollars, CBA violates the utilitarian goal of maximizing total welfare because it weights the preferences of the wealthy more heavily. It claims to measure welfare but actually measures **ability to pay**.
  *   *Coherence Verdict:* Incoherent. It uses a welfare metric (WTP) that is structurally biased by the distribution of wealth, which neoclassical theory admits is exogenous and morally arbitrary.

  **B. The Validity of Revealed Preference**
  CBA assumes that market choices reveal true welfare. However, labor market risk premiums (the source of VSL) are derived from choices made under constraint.
  *   *The Contradiction:* If a worker accepts a risky job for a small premium because they lack education, alternatives, or bargaining power, neoclassical theory calls this a "revealed preference." However, welfare economics acknowledges **adaptive preferences** (preferences formed to cope with deprivation) and **market failures** (information asymmetry regarding risk).
  *   *Coherence Verdict:* Incoherent. Treating desperate choices as authoritative valuations of life conflates *choice* with *welfare*. If the baseline conditions (wealth, information, options) are distorted, the revealed preference does not reveal welfare; it reveals constraint.

  **C. The Interpersonal Comparison Ban**
  Neoclassical economics famously forbids comparing Person A's utility to Person B's.
  *   *The Contradiction:* CBA does exactly this by converting both A's and B's utility into dollars and summing them. It bypasses the ban by assuming money is a neutral medium, but as established above, money is not neutral.
  *   *Coherence Verdict:* Incoherent. It smuggles interpersonal comparisons in through the back door of monetary aggregation while claiming the scientific neutrality of positive economics.

  ### 3. Reconstructing the Practice: Preferences as Input, Not Measure

  If agencies treated preferences as one input among several—acknowledging that WTP measures *demand* but not necessarily *value* or *right*—the practice of regulation would shift from **Market Mimicry** to **Public Reason**.

  Here is what would have to change:

  **A. Abandoning the Single Net-Benefit Number**
  Currently, the "bottom line" is a single scalar (Net Benefits > 0). If preferences are just one input, there is no single metric.
  *   *Change:* Agencies would present a **multi-criteria dashboard**. One column would show efficiency (net benefits), another distributional equity (who pays/benefits), another rights compliance, and another uncertainty/risk profiles. The decision becomes a deliberative judgment weighing these columns, not a mechanical calculation.

  **B. Distributional Weighting**
  If a dollar does not equal a util, then dollars must be weighted.
  *   *Change:* CBA would apply **equity weights**. A benefit accruing to a low-income population would be multiplied by a factor greater than 1, while a benefit to the wealthy might be weighted less. This aligns the monetary metric closer to actual utility maximization and acknowledges that welfare depends on the baseline.

  **C. De-Monetizing Mortality (Thresholds and Constraints)**
  Treating preferences as non-authoritative regarding life implies that life is not a commodity to be traded off against consumer goods.
  *   *Change:* Instead of a VSL used to calculate trade-offs, agencies would adopt **safety constraints** or **thresholds**. For example, a rule might be required if it reduces risk below a certain de minimis level, regardless of cost, unless the cost is so high it creates catastrophic economic harm (a "cost-effectiveness" or "feasibility" approach rather than "optimization"). This treats safety as a right (a side constraint) rather than a good to be purchased.

  **D. Deliberative Valuation**
  Revealed preference looks at what people *do* buy. Treating preferences as input allows for asking what people *value*.
  *   *Change:* Agencies would incorporate **deliberative polling** or **citizen juries**. Instead of inferring value from wage data, regulators would solicit reasoned judgments from representative groups about the value of safety, environmental integrity, or health. This distinguishes between "consumer preferences" (private wants) and "citizen values" (public norms).

  **E. Acknowledging Adaptive Preferences**
  If market choices reflect desperation, they should be discounted.
  *   *Change:* Regulatory analysis would explicitly adjust for **market failures and power asymmetries**. If wage-risk premiums are derived from an industry with low unionization and high information asymmetry, the VSL derived from that data would be adjusted upward to reflect what workers *would* pay under idealized conditions (a "clean market" hypothetical).

  ### Conclusion

  The current practice presupposes a theory of **Money-Metric Welfarism**: the belief that aggregate wealth is a sufficient proxy for social welfare and that market choices are normatively authoritative. This is theoretically incoherent because it ignores the diminishing marginal utility of income and the distorting effects of constraint on choice.

  Shifting to a model where preferences are merely one input requires abandoning the illusion of a single, objective "net benefit" number. It demands a regulatory practice that is explicitly **pluralistic**, weighing efficiency against equity, rights, and deliberative values. It moves the justification for regulation away from "mimicking the market" toward "correcting the market" and "articulating public values." This is less mathematically precise but more philosophically honest about the nature of social choice.
