  2.  **Evaluate the Steps:**

      *   **(1) Imperfect Correlation:** Generally true in complex real-world systems. Hard to reject.
      *   **(2) Regressional Goodhart via Conditioning:** This is the statistical definition of regression to the mean/extremes. If $Y = X + \epsilon$, selecting high $X$ selects high $\epsilon$. True.
      *   **(3) Metric Usage = Conditioning:** True. If you don't condition on the metric, it's not guiding action.
      *   **(4) Equivocation Check:** This is the sneaky one.
          *   Regressional: Passive statistical selection (taking the top $N$).
          *   Extremal: Pushing *beyond* the support of the training data (extrapolation).
          *   Causal: Intervening on the proxy ($do(X)$) vs. observing $X$.
          *   Adversarial: An agent *changing* the relationship $P(Y|X)$ actively.
          *   *Critique:* Step (4) claims "the same conditioning is exactly what happens." This is false. Causal Goodhart specifically requires an *intervention* that breaks the causal link, not just conditioning. Adversarial requires an *agent* optimizing against you. Extremal requires *distributional shift*. While they all involve looking at the proxy, the *mechanism* of failure differs.
