  │   │   │       │       message is treated as a certain fact     │  │    │
  │   │   │       │       about the partition?                     │  │    │
  │   │   │       │   │                                            │  │    │
  │   │   │       │   ├── YES ─────────────────────────────────────┼──┼────┤
