answer: |-
  # JOINT STATEMENT ON MORAL INTUITION AND THE DOCTRINE OF DOUBLE EFFECT

  **Signatories:** The Tom Camp (Defense of Intentional Structure) and The Priya Camp (Defense of Consequentialist Analysis)
  **Date:** October 26, 2023
  **Location:** The Kitchen Table

  ### I. AGREED CLAIMS

  1.  **The Empirical Asymmetry:** Both camps acknowledge the robust statistical reality that most people judge the "Switch" case (diverting a trolley onto one person to save five) as permissible, while judging the "Footbridge" case (pushing a large man off a bridge to stop the trolley and save five) as impermissible, despite the identical outcome (one death, five lives saved).
  2.  **The Explanatory Burden:** Any viable moral theory must account for this asymmetry. The Tom Camp must explain why the structural difference justifies the moral difference. The Priya Camp must explain why the moral intuition is mistaken or biased without dismissing the data entirely.
  3.  **The Bomber Case Structure:** Both camps agree that in the "Terror Bomber" scenario (bombing civilians specifically to demoralize the enemy) and the "Strategic Bomber" scenario (bombing a factory knowing civilians nearby will die as a side effect), the physical outcomes may be identical, but the agent's relationship to the harm differs. Both camps agree a theory must specify whether this difference in relationship carries moral weight.
  4.  **The Status of Intuitions:** Both camps agree that moral intuitions are the primary data set for this inquiry. The Tom Camp treats them as evidence of moral truth (perceptual model). The Priya Camp treats them as psychological phenomena requiring explanation (causal model). Both agree that if intuitions are shown to track irrelevant factors (like physical distance), their evidentiary value decreases.
  5.  **Tracking Harm:** Both camps agree that an account of "intending" must address cases where the agent must monitor the harm for the plan to succeed. If an agent must verify that civilians have died to achieve their goal (Terror Bomber), this differs from verifying a factory is destroyed while hoping civilians survive (Strategic Bomber), regardless of the final body count.

  ### II. AREAS OF DISAGREEMENT

  | Issue | The Tom Camp Position | The Priya Camp Position |
  | :--- | :--- | :--- |
  | **Moral Relevance of Means vs. Side-Effect** | Harm intended as a *means* to an end is morally distinct from harm *foreseen* as a side-effect. This distinction is objective and morally decisive. | The means/side-effect distinction is a post-hoc rationalization. Only outcomes and probabilities matter; drawing a line here is gerrymandering to protect squeamishness. |
  | **The Loop Case Verdict** | In the Loop Case (see Section III), pushing the man is impermissible. His death is used as a means to stop the trolley, violating his rights regardless of the necessity. | In the Loop Case, pushing the man is permissible. The causal structure is functionally identical to the Switch case; the "means" label is a descriptive artifact, not a moral barrier. |
  | **Certainty of Harm** | A harm foreseen with 100% certainty is still morally distinct from an intended harm, provided it is not part of the agent's plan structure. | A harm foreseen with 100% certainty is functionally equivalent to intended harm. Claiming otherwise is semantic evasion to avoid responsibility for inevitable outcomes. |

  ### III. CRUXES AND RECORDED PREDICTIONS

  To move beyond stalemate, we identify three specific sub-questions. For each, we describe a concrete case and record each camp's prediction regarding how moral judgment *should* land. If empirical or logical consensus shifts on these points, one camp agrees to reconsider their position.

  **Crux 1: The Personal Force Heuristic**
  *   **The Question:** Is the intuition against the Footbridge case driven by the moral structure of "using a person," or by a visceral heuristic against direct physical contact and personal force?
  *   **The Case (Remote Footbridge):** A large man stands on a trapdoor above the track. The agent does not touch the man. The agent stands 100 yards away and presses a button that opens the trapdoor, dropping the man onto the track to stop the trolley and save the five. There is no physical contact, no feeling of weight, and no direct personal force.
  *   **Tom Camp Prediction:** The act remains impermissible. The man is still being used as a means to save the five. Removing physical contact does not change the intentional structure of using a human body as a tool.
  *   **Priya Camp Prediction:** Intuitions will shift significantly toward "permissible" compared to the hands-on Footbridge case. If people find this permissible, it proves the original objection was based on a heuristic about contact, not a moral principle about means.

  **Crux 2: The Necessity Constraint (The Loop)**
  *   **The Question:** Does the moral prohibition against "using someone" hold when their involvement is mechanically necessary to save the victims, even if they are on a side track?
  *   **The Case (The Loop Track):** A trolley is headed toward five people. There is a side track. A large man stands on the side track. If the trolley is diverted, it hits the man. His bulk stops the trolley. Crucially, the side track loops back around to the main track. If the man were not there, the trolley would hit him, continue around the loop, and kill the five anyway. Therefore, the man's death is strictly necessary to save the five; he is not just a side effect, he is the stopper.
  *   **Tom Camp Prediction:** The act is impermissible. Because the man's death is the mechanism by which the five are saved (the trolley stops *because* it hits him), he is being used as a means. The loop structure makes this morally equivalent to the Footbridge, not the Switch.
  *   **Priya Camp Prediction:** The act is permissible. The causal chain is identical to the Switch case (divert threat -> hit one -> save five). The fact that the track loops is irrelevant to the moral calculus of minimizing death. If the Tom Camp calls this impermissible, the Doctrine of Double Effect forbids saving lives in scenarios where utilitarianism demands it.

  **Crux 3: The Definition of Intention**
  *   **The Question:** Does "intending" refer to the agent's internal plan structure, or to the agent's knowledge of inevitable consequences?
  *   **The Case (The Collapsing Building):** A firefighter sets a charge to collapse a burning building to stop a fire from spreading to a city block. He knows with 100% certainty that one homeless person is sleeping inside and will die. He does not need the person to die to stop the fire; the building collapsing is sufficient. However, he knows the person will die.
  *   **Tom Camp Prediction:** The firefighter does not *intend* the death. It is a foreseen side-effect. The plan works even if the person miraculously survives. Therefore, this is morally distinct from killing the person to stop the fire.
  *   **Priya Camp Prediction:** The firefighter *intends* the death in any meaningful moral sense. Knowing an outcome is inevitable and proceeding anyway is functionally identical to intending it. Distinguishing the two allows agents to wash their hands of predictable bloodshed.

  ### IV. VERBAL DISPUTE IDENTIFICATION

  Both camps acknowledge that a portion of the disagreement is verbal, specifically regarding the definition of **"Intention."**

  *   **The Tom Camp** uses a technical, philosophical definition: An outcome is intended only if it is part of the agent's plan structure (i.e., the plan would fail or make no sense without this outcome occurring).
  *   **The Priya Camp** uses a folk-psychological, broad definition: An outcome is intended if the agent knows it will happen and proceeds anyway.

  **Resolution Protocol:** In this document, "Intention" refers to the Tom Camp's technical definition (Plan Structure). "Foreseen Certainty" refers to outcomes known to happen but not required by the plan. The disagreement remains whether this technical distinction carries moral weight.

  ### V. SIGNATURES

  _________________________
  **Tom (Camp A)**

  _________________________
  **Priya (Camp B)**

  Bottom line: If the Remote Footbridge case (Crux 1) proves permissible to most people, it undermines the Tom Camp's claim that "means vs. side-effect" is the core moral issue, suggesting instead that the intuition is driven by a bias against personal force.
