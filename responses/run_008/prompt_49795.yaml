      *   This supports Local Linearity (1) because over small steps, arithmetic and geometric means converge.
      *   *Cost:* You have to rewrite Commitment 4. It's not that recurrence is irrelevant; it's that *wealth dynamics are inherently sequential/path-dependent*, so the "one-off" view is the illusion. You also have to abandon Commitment 2 (Linear Utility) in favor of a specific objective function (Growth Rate).

