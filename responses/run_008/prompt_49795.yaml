      *   **Commitment 2 (Linearity of Utility):** Utility is nearly linear across *all* personally encounterable ranges (current wealth to max realistic windfall). Suspicious of concave utility curves used ad hoc.
      *   **Commitment 3 (Kelly Criterion):** Invest using Kelly (or half-Kelly). Justification: Maximizes long-run growth, avoids ruin. Sympathetic to "ensemble vs. time average" critique of EMV.
      *   **Commitment 4 (Time Consistency/Recurrence):** Recurrence is irrelevant to rationality. A sequence should be evaluable as a composite. Individual rationality must align with composite rationality.
      *   **Commitment 5 (All-In Intuition):** Declining +EV all-in bets (e.g., 60/40 double-or-nothing on net worth) is rational. Accepting small +EV bets is rational. Scale matters.

