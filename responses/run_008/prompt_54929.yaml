answer: |-
  ### 1. Exam Question

  **Course:** PHIL 450: Rational Agency and Ethics
  **Assessment:** Final Examination
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question 1: Moral Trade and Strategic Structure**

  Consider a nonprofit governed by a two-member board, Amara and Bo. The board makes two annual decisions:
  1.  **Domain 1 (Research):** Choose between an *X-Risk Institute* or a *Wild-Animal Lab*.
  2.  **Domain 2 (Campaign):** Choose between *AI-Safety Lobbying* or *Factory-Farming Reform*.

  By charter, Amara has sole decision rights over Domain 1, and Bo has sole decision rights over Domain 2. However, both agents care about the outcomes of *both* domains. Their preferences (in personal utils) are as follows:

  *   **Amara:** X-Risk (10), Wild-Animal (8); AI-Lobbying (4), Factory-Reform (1).
  *   **Bo:** Wild-Animal (10), X-Risk (2); Factory-Reform (6), AI-Lobbying (4).

  Each agent's total payoff is the sum of the utils they derive from the chosen option in Domain 1 and the chosen option in Domain 2. Assume both agents are rational utility maximizers.

  (a) Calculate the outcome and payoff distribution if no agreement is reached (the "No-Deal" baseline). Explain why this outcome occurs. (5 marks)
  (b) Identify a alternative combination of decisions that constitutes a "Moral Trade." Calculate the new payoff distribution and demonstrate that this trade is a Pareto improvement over the No-Deal baseline. (5 marks)
  (c) A critic argues that this trade is impossible because Amara's "human welfare" utils cannot be compared to Bo's "animal welfare" utils. Refute this criticism using the calculations from (a) and (b). (5 marks)
  (d) Characterize the strategic structure of this interaction. Why might the Moral Trade fail to materialize even if both parties recognize the benefits? Discuss the institutional conditions (e.g., verification, commitment) required to sustain such trade, and identify one genuine limit to moral trade in real-world contexts. (10 marks)

  ***

  ### 2. Model Answer

  **(a) No-Deal Outcome**
  In the absence of an agreement, each agent exercises their charter rights to maximize their own utility. Amara controls Domain 1 and prefers the X-Risk Institute (10) over the Wild-Animal Lab (8). Bo controls Domain 2 and prefers Factory-Farming Reform (6) over AI-Safety Lobbying (4).
  *   **Outcome:** X-Risk Institute + Factory-Farming Reform.
  *   **Payoffs:** Amara = 10 + 1 = 11. Bo = 2 + 6 = 8.
  This is the Nash Equilibrium of the control game; neither has an incentive to unilaterally deviate given their control rights.

  **(b) Moral Trade Outcome**
  The agents can agree to swap their preferred decisions. Amara agrees to fund the Wild-Animal Lab, and Bo agrees to run the AI-Safety Lobbying campaign.
  *   **Outcome:** Wild-Animal Lab + AI-Safety Lobbying.
  *   **Payoffs:** Amara = 8 + 4 = 12. Bo = 10 + 4 = 14.
  *   **Pareto Improvement:** Amara gains 1 util (12 > 11); Bo gains 6 utils (14 > 8). Both are strictly better off by their own lights.

  **(c) Interpersonal Comparability**
  The critic is mistaken. Moral trade does not require interpersonal comparison of utility (e.g., asking if Amara's 10 equals Bo's 10). It only requires *intrapersonal* comparison. Amara compares her No-Deal payoff (11) to her Trade payoff (12). Bo compares his No-Deal payoff (8) to his Trade payoff (14). Because both agents rank the Trade outcome higher than the No-Deal outcome within their own utility functions, the trade is rational for both without ever comparing Amara's values to Bo's. The "exchange rate" is determined by the intensity of preferences within each agent, not between them.

  **(d) Strategic Structure and Limits**
  This scenario has the structure of a **Prisoner's Dilemma**. While (Trade, Trade) yields the best joint outcome, the dominant strategy for each agent, absent enforcement, is to defect (exercise control selfishly). If Amara commits to the Lab, Bo is tempted to defect to Factory-Reform (gaining 6 instead of 4). If Bo commits to Lobbying, Amara is tempted to defect to X-Risk (gaining 10 instead of 8). Thus, the No-Deal outcome is the equilibrium.

  For moral trade to succeed, the game must be modified. **Commitment mechanisms** (binding contracts) or **iteration** (repeated interactions where defection triggers future punishment) are required. In the real world, this resembles vote-trading in legislatures or cause-prioritization compromises in effective altruism.

  However, a genuine limit exists: **Verification/Opacity.** Unlike vote swaps, moral actions are often hard to verify. If Amara cannot verify if Bo actually prioritizes animal welfare in his campaigns (or vice versa), the risk of defection rises. Furthermore, if moral convictions are deontological rather than consequentialist (e.g., "I must not support X-Risk regardless of consequences"), trade becomes impossible because the utility function is lexicographic, not additive.

  ***

  ### 3. Marking Scheme

  **Total Marks:** 25
  **Passing Threshold:** 13/25

  | Point | Requirement | Marks | Common Error / "B-Grade" Trap |
  | :--- | :--- | :--- | :--- |
  | **1** | **No-Deal Calculation:** Correctly identifies (X-Risk, Factory) as the baseline based on unilateral control. Correctly sums payoffs (Amara 11, Bo 8). | /5 | Calculating the *social* optimum as the baseline, or failing to sum the cross-domain utils (e.g., saying Amara gets 10, ignoring the 1). |
  | **2** | **Trade Calculation:** Correctly identifies (Wild-Animal, AI-Lobby) as the trade. Correctly sums payoffs (Amara 12, Bo 14) and notes both are higher than baseline. | /5 | Identifying the trade but failing to prove it is a Pareto improvement (e.g., only showing total utility increased). |
  | **3** | **Comparability Refutation:** Explicitly states that only *intrapersonal* comparison is needed. Explains that Amara compares 11 vs 12, not her 10 vs Bo's 10. | /5 | **The A/B Splitter.** B-answers wave hands at "different values." A-answers explicitly invoke the independence of utility functions. |
  | **4** | **Game Structure:** Identifies Prisoner's Dilemma / Commitment Problem. Explains temptation to defect (e.g., Bo wants Factory even if Amara picks Lab). | /5 | Calling it a "Coordination Game" without explaining the incentive to defect. Failing to link structure to the need for commitment. |
  | **5** | **Real World & Limits:** Names a mechanism (iteration/contract) AND a limit (verification/deontology/opacity). Connects to analogues (vote trading). | /5 | Listing mechanisms without explaining *why* they are needed, or offering a trivial limit (e.g., "people are mean"). |

  **Distinguishing A from B:**
  A **B-grade answer** performs the arithmetic correctly in (a) and (b) and correctly labels the situation a Prisoner's Dilemma, but treats the "moral trade" concept as a slogan, failing to rigorously explain in (c) why interpersonal comparability is irrelevant. An **A-grade answer** treats the utility numbers as ordinal representations of distinct preference orderings, explicitly demonstrating that the trade relies on intensity of preference within agents rather than value alignment between them, and provides a nuanced limit (like deontological constraints) rather than a practical friction.
