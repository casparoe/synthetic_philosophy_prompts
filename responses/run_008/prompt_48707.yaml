prompt: |-
  I'm the only privacy person at a ~150-person company that ships a bunch of small consumer apps, and product managers come to me maybe three times a week with "is this a privacy thing?" right before launch. So far I've been going on gut plus half-remembered compliance training, and I'd like to replace that with an actual decision procedure. Can you turn whatever the philosophy of privacy actually says -- control over your information, restricted access to your person and spaces, information flowing according to the norms of the context it came from, that whole cluster -- into something I can run in fifteen minutes in a meeting? I need ordered questions, what counts as a sufficient answer to each, where it ends with "fine, ship it," where it ends with "no," and where it explicitly hands the question back to me because it's a value judgment that a checklist can't absorb. It should also say what counts as a privacy problem when no user complains, since half my PMs think privacy is just status anxiety and I need something to say back to them. Then run it on the three things on my desk right now: a change to our messaging app that flips read reciepts from opt-in to on-by-default; a neighborhood app that displays doorbell footage of package thefts with house numbers "mostly" blurred; and a new feature where the app infers which of your contacts you're closest to, entirely on-device, with nothing ever leaving the phone. Constraints: our CTO signs off on whatever I bring him, and his test is basically "will a journalist write about this," so the procedure has to survive that guy. Be honest about where it'll misfire, and flag it if one of the three comes out in a direction I won't like, because I suspect one does.
reasoning: |-
  Here's a thinking process that leads to the suggested privacy decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Sole privacy person at a ~150-person company (consumer apps).
      *   **Problem:** PMs come late (pre-launch) with "is this a privacy thing?" relying on gut feeling. Needs a structured decision procedure.
      *   **Goal:** A 15-minute meeting tool based on privacy philosophy (control, restricted access, contextual integrity, etc.).
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Outcomes: "Ship it," "No," or "Escalate to Privacy Lead (User)."
          *   Address "invisible harms" (when no user complains).
          *   CTO Constraint: "Will a journalist write about this?" (Reputation risk).
          *   Test Case: Run the procedure on three specific scenarios.
          *   Honesty: Flag where the procedure might misfire or yield an unpopular result.
      *   **Tone:** Practical, direct, slightly cynical but principled (matching the user's vibe).

  2.  **Deconstruct Privacy Philosophy for Practical Use:**
      *   *Control/Consent:* Did the user agree to this specific use?
      *   *Restricted Access/Solitude:* Does this expose something intimate or private to the wrong audience?
      *   *Contextual Integrity (Nissenbaum):* Does information flow according to the norms of the context in which it was collected?
      *   *Power Asymmetry/Harm:* Does this create a risk of harm (even if the user doesn't realize it)?
      *   *Transparency:* Is it hidden or surprising?

  3.  **Drafting the Procedure (The "Privacy Pre-Flight Check"):**
      *   Need to keep it under 15 minutes.
      *   Need to satisfy the CTO's "Headline Test."
      *   Need to distinguish between "Compliance OK" and "Privacy OK."
      *   *Structure:*
          1.  Transparency/Surprise (The Headline Test).
          2.  Contextual Integrity (The Expectation Test).
          3.  Control/Choice (The Opt-Out Test).
          4.  Harm/Risk (The Invisible Harm Test).
      *   *Outcomes:* Green (Ship), Yellow (Escalate to User), Red (Stop).

  4.  **Addressing "Invisible Harms" (The PM Objection):**
      *   PMs think privacy = complaints.
      *   Counter-argument: Privacy = Power dynamics & Future risk.
      *   Need a specific question about "What could go wrong in 2 years?" or "Who else could use this data?"

  5.  **Running the Test Cases:**

      *   **Case 1: Messaging App Read Receipts (Opt-in -> On-by-default).**
          *   *Transparency:* Users notice.
          *   *Context:* Messaging norms vary. Some expect privacy, some expect speed.
          *   *Control:* Can they turn it off? If yes, it's usually okay. If no, it's a problem.
          *   *Headline:* "App Forces You to Tell People You Read Their Texts." Mildly annoying, not scandalous *if* reversible.
          *   *Verdict:* Likely Green/Yellow depending on ease of opt-out.

      *   **Case 2: Neighborhood App (Doorbell Footage + "Mostly" Blurred House Numbers).**
          *   *Transparency:* High visibility.
          *   *Context:* Public street vs. private property. "Mostly blurred" is a huge red flag.
          *   *Control:* Do neighbors consent to being filmed/posted? No.
          *   *Harm:* Stalking, burglary risk, doxxing.
          *   *Headline:* "App Exposes Home Addresses of Crime Victims." High risk.
          *   *Verdict:* Red (Stop). This is the one the user suspects they won't like.

      *   **Case 3: On-Device Contact Closeness Inference.**
          *   *Transparency:* Invisible processing.
          *   *Context:* Phone knows contacts. Inferring "closeness" is sensitive.
          *   *Data Flow:* Nothing leaves device. This is the key.
          *   *Headline:* "App Guesses Your Best Friends." If data stays on device, headline is weaker.
          *   *Verdict:* Green (Ship), provided the "on-device" claim is technically auditable.

  6.  **Refining the Procedure (Iterative Polish):**
      *   Make the "Escalate" criteria clear. It's not just "I don't know," it's "This requires a value judgment."
      *   Integrate the CTO's "Journalist Test" explicitly into Question 1.
      *   Ensure the "Invisible Harm" section gives the user ammo against PMs.

  7.  **Addressing the Constraints & Warnings:**
      *   *Misfire:* Checklists can't capture nuance. A "technically compliant" thing can still be creepy.
      *   *Unpopular Result:* The Neighborhood App is definitely the trap. It sounds "pro-social" (catching thieves) but is privacy-destructive. I need to be firm here.
      *   *CTO Alignment:* The procedure must prioritize reputation risk, as that's his language.

  8.  **Final Review against User Prompt:**
      *   15 minutes? Yes, 4 questions.
      *   Ordered? Yes.
      *   Sufficient answers defined? Yes.
      *   Outcomes defined? Yes.
      *   Invisible harm addressed? Yes.
      *   Three cases run? Yes.
      *   Honest about misfires? Yes.
      *   Flag the unpopular one? Yes (Neighborhood app).

  9.  **Drafting the Content:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just say "GDPR." The user asked for *philosophy* translated to practice. Focus on norms and expectations, not just legal checkboxes.
      *   *Correction:* The CTO constraint is crucial. Every question needs to link back to "Does this look bad?"
      *   *Tone Check:* Keep it professional but empathetic to the "sole privacy person" struggle.

  10. **Final Polish:** Check the "Read Receipt" logic. Changing from opt-in to default is a dark pattern risk. Needs to be highlighted. The "Mostly blurred" house numbers is a technical failure waiting to happen. Needs to be a hard stop.

  (Proceed to generate response based on these thoughts.)
answer: |-
  Here is a decision procedure designed for your constraints. It translates privacy philosophy (Contextual Integrity, Control, Harm) into a reputation-risk framework that satisfies your CTO's "Headline Test."

  ### The Privacy Pre-Flight Check (15 Minutes)

  **Instructions:** The PM must answer these four questions verbally. You take notes. If they hesitate, guess, or say "legal didn't flag it," treat that as a failed answer.

  #### Q1: The Headline Test (Transparency & Surprise)
  *Philosophy: Secrecy undermines autonomy. If users knew, would they feel tricked?*
  **Question:** "If TechCrunch wrote a headline describing exactly how this feature works and what data it uses, would our users feel betrayed or relieved?"
  *   **Sufficient Answer:** "Relieved" or "Indifferent." Specific example: *"Headline: App Adds Feature to Help You Find Friends. Users Happy."*
  *   **Fail Condition:** The headline requires qualifiers to sound okay (e.g., *"App Adds Feature... But Only If You Read The Fine Print"*).
  *   **Outcome:**
      *   **Pass:** Go to Q2.
      *   **Fail:** **STOP.** (This is a CTO-level reputation risk).

  #### Q2: The Context Test (Contextual Integrity)
  *Philosophy: Information flows must match the norms of the context in which it was collected.*
  **Question:** "Does this data move to a place or audience the user did not explicitly expect when they gave it to us?"
  *   **Sufficient Answer:** "No, it stays within the original service context," OR "Yes, but we are asking for fresh, specific consent for the new context."
  *   **Fail Condition:** "It's technically anonymized," "It's for internal improvement," or "It's public but obscured." (Obscuring $\neq$ Restricted).
  *   **Outcome:**
      *   **Pass:** Go to Q3.
      *   **Fail:** **ESCALATE TO YOU.** (This requires a value judgment on norms).

  #### Q3: The Exit Test (Control & Power)
  *Philosophy: Privacy is the ability to withdraw from a data relationship.*
  **Question:** "If a user hates this, is there a toggle to turn it off that is as easy to find as the toggle to turn it on?"
  *   **Sufficient Answer:** "Yes, in the same menu, same number of clicks."
  *   **Fail Condition:** "It's in settings," "They can delete the account," or "It's on-by-default for safety/UX."
  *   **Outcome:**
      *   **Pass:** Go to Q4.
      *   **Fail:** **ESCALATE TO YOU.** (Dark patterns are reputation risks).

  #### Q4: The Invisible Harm Test (Risk & Asymmetry)
  *Philosophy: Harm exists even without user complaints (power asymmetry, future risk).*
  **Question:** "If this data were breached, subpoenaed, or scraped tomorrow, who could get hurt besides us?"
  *   **Sufficient Answer:** "No one. The data is low sensitivity (e.g., app color preference) or never leaves the device."
  *   **Fail Condition:** "Users won't care," "It's unlikely to be breached," or "We can't imagine a bad actor using this."
  *   **Outcome:**
      *   **Pass:** **SHIP IT.**
      *   **Fail:** **ESCALATE TO YOU.** (This is where PM intuition fails).

  ---

  ### Decision Matrix

  | Result | Action | Rationale |
  | :--- | :--- | :--- |
  | **All Pass** | **SHIP IT** | Meets CTO's headline test and basic privacy norms. |
  | **Any "Escalate to You"** | **PAUSE** | This is a value judgment. You must weigh the business value against the normative violation. |
  | **Any "Stop"** | **NO SHIP** | Immediate reputation risk. CTO will not sign off. |

  ---

  ### Addressing the "No User Complaints" Objection
  When a PM says, "Privacy is just status anxiety, no one complains," use this script:

  > "Privacy isn't about complaints; it's about **leverage**. When users don't know data is being collected, they can't consent, and they can't leave. That creates a power asymmetry. If we get caught leveraging that asymmetry, the headline isn't 'Users Annoyed,' it's 'Company Exploits Users.' My job is to ensure we don't build a business model that relies on users *not* understanding what we're doing. That is the definition of a reputation time-bomb."

  ---

  ### Running the Procedure on Your Desk

  Here is how the three items on your desk score.

  #### 1. Messaging App: Read Receipts (Opt-in $\to$ On-by-Default)
  *   **Q1 (Headline):** "App Forces Read Receipts On." **Verdict:** *Risky.* Users feel loss of control.
  *   **Q2 (Context):** Messages are private comms. Changing the rules of engagement shifts norms. **Verdict:** *Escalate.*
  *   **Q3 (Exit):** Is there an easy toggle to turn it back off?
      *   *If Yes:* **Pass.**
      *   *If No:* **Fail.**
  *   **Q4 (Harm):** Low physical harm, high social anxiety.
  *   **Final Verdict:** **ESCALATE TO YOU.**
  *   **Why:** This is a "Dark Pattern" risk. Changing a default from Opt-In to Opt-Out is a classic erosion of trust. Even if legal allows it, it violates the *norm* of the previous relationship.
  *   **Recommendation:** Allow the change *only if* there is a prominent, one-click toggle in the chat settings to revert to Opt-In. If the toggle is buried, tell the CTO: "This looks like we're hiding something."

  #### 2. Neighborhood App: Doorbell Footage + "Mostly" Blurred House Numbers
  *   **Q1 (Headline):** "Neighborhood App Broadcasts Surveillance Footage of Your Street." **Verdict:** **STOP.**
  *   **Q2 (Context):** Footage collected for personal security is being repurposed for public broadcast. **Verdict:** **Fail.**
  *   **Q3 (Exit):** Can neighbors opt out of being in the background? No. **Verdict:** **Fail.**
  *   **Q4 (Harm):** High. Stalking, burglary scouting, doxxing. "Mostly blurred" is a technical guarantee of failure. **Verdict:** **Fail.**
  *   **Final Verdict:** **NO. DO NOT SHIP.**
  *   **Why:** This is the one you suspected. "Mostly blurred" is not a privacy control; it's a vulnerability. This violates Contextual Integrity (security cam $\neq$ public news feed) and creates tangible physical risk.
  *   **CTO Pitch:** "A journalist will find a house number that wasn't blurred, trace a burglary to a post on our app, and the headline will be 'App Helps Burglars Target Homes.' We cannot defend 'mostly' in court or in print."

  #### 3. Contact Closeness Inference (On-Device Only)
  *   **Q1 (Headline):** "App Organizes Your Contacts Locally to Improve UX." **Verdict:** *Pass.*
  *   **Q2 (Context):** Data stays in the context of the device. No flow to server. **Verdict:** *Pass.*
  *   **Q3 (Exit):** Can they disable contact access? **Verdict:** *Pass (Assuming OS permissions hold).*
  *   **Q4 (Harm):** If the phone is seized? Risk exists, but lower than server-side aggregation. **Verdict:** *Pass.*
  *   **Final Verdict:** **SHIP IT.**
  *   **Why:** This is "Privacy by Design." The value is delivered without the data leaving the user's sphere of control.
  *   **Caveat:** You must verify the "nothing ever leaves the phone" claim with Engineering. If *any* metadata leaks (e.g., analytics events triggered by the inference), this moves to **Escalate**.

  ---

  ### Where This Procedure Will Misfire (Honesty Check)

  1.  **The "Compliant but Creepy" Gap:** The procedure relies on the PM answering honestly. A sophisticated PM can game Q2 (Context) by arguing "Users expect this." You will need to spot-check their claims.
  2.  **The CTO's Blind Spot:** The CTO cares about *journalists*, not *regulators*. This procedure optimizes for headlines. It might miss a GDPR violation that doesn't generate press but generates fines. You need to layer a legal compliance check (separate from this) for high-risk data processing.
  3.  **The "Innovation Killer":** Q4 (Invisible Harm) can stall features where the harm is theoretical. You will be the "Department of No." To mitigate, when you Escalate, always offer a **Mitigation Path** (e.g., "Don't ship the footage feature, but ship a text-only alert feature").

  ### Summary of Actions for You
  1.  **Neighborhood App:** Kill it. The "mostly blurred" claim is indefensible.
  2.  **Read Receipts:** Negotiate the opt-out. If they bury the setting, block it.
  3.  **On-Device Inference:** Approve, but audit the code to ensure no data egress.

  This gives you a shield ("The checklist said Stop") and a sword ("Here is the headline that will kill us"). Use them.
