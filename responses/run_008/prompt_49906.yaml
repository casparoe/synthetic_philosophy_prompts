answer: |-
  ## The V-S Protocol: A Decision Procedure for Verbal Disputes

  **Purpose:** To determine whether a philosophical disagreement presented in a manuscript is *Substantive* (about the world), *Merely Verbal* (about language/concepts), or *Cannot Tell* (insufficient information), without requiring exhaustive literature review.
  **Time Budget:** 2–3 hours.
  **Audience:** Associate Editors (AEs) who need clear, articulable grounds for acceptance or rejection.

  ### Phase 1: The Diagnostic Questions

  Run these steps in order. If a step yields a definitive verdict, stop. If not, proceed to the next.

  **Step 1: The Non-Linguistic Fact Check (Chalmers)**
  *   **Question:** Can you identify a specific sentence $S$ that Party A accepts and Party B rejects, such that both parties agree on all *non-linguistic, non-conceptual* facts relevant to $S$?
  *   **Sufficient Answer for "Substantive":** No. If they disagree on the physics, psychology, history, or causal structure of the situation, the dispute is substantive. **Terminate: Substantive.**
  *   **Sufficient Answer for "Verbal":** Yes. They agree on the distribution of matter, the causal history, and the mental states, but disagree on the truth of $S$. **Proceed to Step 2.**
  *   **Judgment Call:** Distinguishing "conceptual facts" from "worldly facts." (See Failure Modes).

  **Step 2: The Translation/Paraphrase Test (Chalmers)**
  *   **Question:** Can Party A's claim be paraphrased into Party B's idiom (and vice versa) without loss of truth conditions or explanatory power?
  *   **Sufficient Answer for "Verbal":** Yes. If Party A says "X exists" and Party B says "X does not exist," but B accepts "There are simples arranged X-wise," and this paraphrase satisfies the theoretical goals of both, the dispute is verbal. **Terminate: Merely Verbal.**
  *   **Sufficient Answer for "Substantive":** No. If the paraphrase loses explanatory power, predictive utility, or logical force (e.g., one side cannot make sense of the other's laws of nature), the dispute is substantive. **Terminate: Substantive.**
  *   **Hard Case (Stipulation):** If one side says, "I stipulate 'object' means X," and the other says, "That stipulation renders your theory trivial," treat this as a **No**. Proceed to Step 3.

  **Step 3: The Joint-Carving Check (Sider)**
  *   **Question:** Is the disputed term (e.g., "exists," "cause," "free") plausibly candidates for "carving nature at the joints," or is it clearly a human convention?
  *   **Sufficient Answer for "Substantive":** The term is a logical quantifier or fundamental predicate where variance implies a difference in the structure of reality (e.g., the quantifier itself is the dispute). If the paper argues that *quantifier meaning* is metaphysical, grant this point for the sake of the report unless it is obviously absurd. **Terminate: Substantive.**
  *   **Sufficient Answer for "Verbal":** The term is clearly a sortal or conventional category (e.g., "mountain," "chair") where variance does not alter the underlying physics. **Terminate: Merely Verbal.**
  *   **Judgment Call:** Determining if "existence" is joint-carving. (This is the core metaontological hinge).

  **Step 4: The Metalinguistic Negotiation Check (Plunkett & Sundell)**
  *   **Question:** Is the disagreement actually about *which concept we ought to use* for specific practical, moral, or theoretical purposes, rather than about what the world contains?
  *   **Sufficient Answer for "Substantive (Normative)":** Yes. The parties agree on the facts but disagree on which classification best serves justice, science, or communication. This is substantive *pragmatics*, not metaphysics.
      *   *Referee Action:* If the journal is general philosophy, recommend **Accept/Revise** (it's substantive). If the journal is pure metaphysics, recommend **Reject** (it's the wrong kind of substance).
  *   **Sufficient Answer for "Merely Verbal":** No. The parties treat the conceptual choice as a discovery of fact, obscuring the normative nature of the disagreement. **Terminate: Merely Verbal.**
  *   **Hard Case (Conceptual Engineering):** If the paper explicitly argues for a new concept, classify as **Substantive (Normative)**.

  **Step 5: The "So What?" Handoff**
  *   If the verdict is **Merely Verbal**, ask: Does resolving the verbal confusion yield philosophical insight?
  *   **Judgment Call:** If yes, recommend **Accept** (clarification is valuable). If no, recommend **Reject** (trivial).
  *   **Articulable Reason to AE:** "While the dispute is verbal, the paper clarifies the conceptual landscape," OR "The dispute is verbal and the clarification adds no value."

  ---

  ### Application to Manuscripts

  Here is the procedure run on the three specific cases provided.

  #### Manuscript 1: Mereological Composition (Shoe + Eiffel Tower)
  *   **Step 1 (Fact Check):** The Nihilist and Universalist agree on the distribution of matter (simples arranged shoe-wise, simples arranged tower-wise). They disagree only on "There exists an object composed of..." **Pass to Step 2.**
  *   **Step 2 (Translation):** The Nihilist can accept "There are simples arranged fusion-wise." The Universalist can accept this too. The truth conditions of the physical claims are preserved. **Pass to Step 3.**
  *   **Step 3 (Joint-Carving):** The paper argues the quantifier ("there exists") is the locus of disagreement. Following Sider, if quantifier variance is real, this is substantive. However, following Chalmers/Hirsch, if the variance doesn't change the physics, it's verbal. The procedure defaults to **Chalmers** for mid-tier general journals unless the paper proves joint-carving. The paper does not prove joint-carving; it assumes quantifier variance is verbal.
  *   **Verdict:** **Merely Verbal.**
  *   **Referee Recommendation:** Accept if the verbal diagnosis yields new insight; Reject if it's a rehash of standard quantifier variance arguments.
  *   **Alignment:** Aligns with your sympathy.

  #### Manuscript 2: Free Will (Compatibilism vs. Incompatibilism)
  *   **Step 1 (Fact Check):** The paper states parties agree on determinism and the agent's psychology. They disagree on "desert-entailing control." Is "desert" a non-conceptual fact?
      *   *Procedure Ruling:* "Desert" is a normative concept, not a natural fact. Therefore, they agree on all *natural* facts. **Pass to Step 2.**
  *   **Step 2 (Translation):** Can the Incompatibilist paraphrase the Compatibilist? "You say he is free, I say he lacks alternate possibilities." The Compatibilist replies, "Alternate possibilities aren't required for *my* concept of free." They talk past each other regarding the *concept* of free. **Pass to Step 3.**
  *   **Step 3 (Joint-Carving):** Is "free will" a natural kind? The paper treats it as metaphysical. The procedure flags this as dubious without empirical backing. **Pass to Step 4.**
  *   **Step 4 (Metalinguistic Negotiation):** The disagreement is about whether the concept "free" *ought* to include determinism-compatible states for the purpose of moral responsibility. The paper frames this as a metaphysical discovery ("control is undermined") rather than a normative choice ("we should not hold responsible").
      *   *Procedure Ruling:* Because the paper treats a normative/conceptual choice as a metaphysical fact, it fails the Metalinguistic Check. It obscures the negotiation.
  *   **Verdict:** **Merely Verbal.**
  *   **Referee Recommendation:** Reject or Major Revision. The paper mistakes a conceptual/normative dispute for a metaphysical one.
  *   **Alignment:** **Contradicts your view.** (You are skeptical of the verbal claim; the procedure rules it verbal).

  #### Manuscript 3: Species (Individuals vs. Classes)
  *   **Step 1 (Fact Check):** Biologists agree on the phylogeny, reproduction, and genetics. They disagree on the ontological category. **Pass to Step 2.**
  *   **Step 2 (Translation):** Can "Species X is an individual" be paraphrased as "Species X is a class"? In practice, biologists use the terms interchangeably for modeling. **Pass to Step 3.**
  *   **Step 3 (Joint-Carving):** "Individual" and "Class" are logical/biological tools. There is no evidence nature cares about this distinction independent of biological practice. **Pass to Step 4.**
  *   **Step 4 (Metalinguistic):** The paper claims the dispute is verbal *because* biologists do work either way. This is a pragmatic argument. However, the paper does not argue which concept *ought* to be used, only that both work.
  *   **Verdict:** **Cannot Tell.** The paper establishes the dispute is practically idle, but fails to diagnose whether it is verbal (meaning) or pragmatic (utility). It needs Step 4 analysis to be complete.
  *   **Referee Recommendation:** Revise. Clarify if the claim is about meaning (verbal) or utility (pragmatic).
  *   **Alignment:** Neutral.

  ---

  ### The Uncomfortable Verdict: Manuscript 2 (Free Will)

  **The Verdict:** The procedure classifies the Free Will dispute as **Merely Verbal**.
  **Your View:** You are skeptical of the claim that free will disputes are verbal (i.e., you believe they are Substantive).
  **Why the Procedure Returns This:**
  The procedure enforces a strict separation between *natural facts* (causal chains, physics, psychology) and *normative/conceptual facts* (desert, responsibility, "freedom"). Under Step 1 and Step 4, if the disagreement rests entirely on whether a specific causal chain *counts as* "desert-entailing," and "desert" is not a natural kind discoverable by physics, the dispute is classified as conceptual/normative.

  Since the manuscript frames this as a metaphysical disagreement ("control is undermined") rather than a normative negotiation ("we ought not use the concept 'free' here"), the procedure flags it as a **confused verbal dispute** rather than a **substantive metalinguistic negotiation**.

  **Why You Won't Like It:**
  You likely view "desert-entailing control" as a real feature of the world, or at least a metaphysically robust property that isn't merely a linguistic choice. The procedure, however, operationalizes "Substantive" as "Agreement on Non-Conceptual Facts." By categorizing "desert" as conceptual/normative by default, it forces the Free Will debate into the "Verbal" bucket unless the author explicitly argues for the normative utility (Step 4). Since the author argued for metaphysical undermining, the procedure penalizes them for misdiagnosing a normative issue as a metaphysical one.

  **Defense to the Associate Editor:**
  "This paper treats a conceptual/normative disagreement about responsibility as a metaphysical disagreement about control. Following the V-S Protocol (Steps 1 & 4), since parties agree on the causal facts, the disagreement is about the application of the concept 'free.' The paper fails to engage with the metalinguistic nature of this negotiation, rendering the dispute merely verbal in the context of metaphysical ontology."

  ---

  ### Known Failure Modes & Limitations

  Be candid with the AE about where this procedure breaks.

  **1. The "Joint-Carving" Judgment Call (Step 3)**
  *   **Failure Mode:** The procedure cannot settle whether quantifiers "carve nature." This is the core metaontological disagreement between Sider (Yes) and Hirsch (No).
  *   **Impact:** On Manuscript 1 (Composition), a Siderian referee could override Step 2 and rule "Substantive" at Step 3. The procedure acknowledges this by making Step 3 a judgment call.
  *   **Mitigation:** In your report, state: "Even granting Sider's joint-carving assumption, the paper fails to..." or "Under a Hirschian reading, this is verbal."

  **2. The Normative/Natural Blur (Step 1 & 4)**
  *   **Failure Mode:** The procedure assumes "desert" and "control" are normative/conceptual. If moral realism is true, these might be natural facts.
  *   **Impact:** This is why Manuscript 2's verdict is controversial. The procedure defaults to anti-realism about normative properties for the sake of diagnostic speed.
  *   **Mitigation:** Explicitly note in the report: "This verdict assumes 'desert' is not a natural kind. If the author defends moral realism as a natural fact, Step 1 would yield 'Substantive'."

  **3. The "Lazy Rejection" Risk (Step 5)**
  *   **Failure Mode:** Referees may use "Merely Verbal" to reject papers that are actually interesting conceptual engineering.
  *   **Impact:** A paper on Metalinguistic Negotiation (Step 4) could be rejected as "Verbal" by a traditionalist AE.
  *   **Mitigation:** The procedure explicitly separates "Merely Verbal (Confused)" from "Substantive (Normative)." You must advocate for the latter if the paper is high quality. Do not let Step 5 become an automatic reject.

  **4. The Assumption of Discoverable Meanings**
  *   **Failure Mode:** The entire procedure assumes meanings are stable enough to be "discovered" or "translated." If meaning is use-based and fluid (Wittgensteinian), Step 2 (Translation) is impossible.
  *   **Impact:** The procedure may force a binary (Verbal/Substantive) on a spectrum of linguistic practice.
  *   **Mitigation:** Use the "Cannot Tell" verdict when linguistic practices are too divergent to map.

  **5. Disguised Judgment Calls**
  *   **Step 1:** Deciding what counts as a "non-conceptual fact" is itself a philosophical stance.
  *   **Step 3:** Deciding what "carves nature" is the very dispute the paper might be about.
  *   **Honesty Clause:** In your cover letter to the AE, write: "This report applies a standard diagnostic protocol for verbal disputes. Note that Step 3 involves a metaontological judgment call regarding quantifier variance. I have ruled in favor of [X] based on [Y], but a referee with a different metaontological commitment might reasonably reach the opposite conclusion at this step."

  This protocol does not eliminate philosophy from refereeing; it structures the philosophy so the AE can see exactly where the disagreement lies.
