answer: |-
  Here is a facilitation plan designed for a one-hour, low-tech discussion in a parish hall setting. It prioritizes clarity, manages the group dynamics (specifically the argumentative engineer), and protects the core philosophical distinction from being drowned out by emotional reactions.

  ### 1. The Sequence: Building the Ladder Before the Jump

  Do not start with the murderer. If you begin with "Would you lie to save a life?", the emotional weight of the life will crush the nuance of the definition. You must build the vocabulary first so the hard case is a test of logic, not just instinct.

  **Order of Operations (60 Minutes):**

  *   **0:00–0:10: Definitions (The "What").** Establish the difference between *speaking falsely* and *lying*.
  *   **0:10–0:30: The Core Distinction (The "How").** Introduce the single example. Explore the territory between "Full Truth" and "Lie."
  *   **0:30–0:50: The Hard Case (The "Why").** Apply the distinction to the murderer scenario. Discuss the moral cost.
  *   **0:50–1:00: Closing & Table.** The assessment question and parking lot topics.

  **Why this order?**
  You need the group to agree on what a lie *is* before they decide when one is *allowed*. If you skip to the murderer case, the group will define a lie as "any statement that endangers a life." By defining the mechanism first, you force them to argue against Augustine's logic, not just his conclusion.

  ### 2. The Single Example: "The Guest in the Back Room"

  You need one scenario that is flexible enough to cover jokes, privacy, and danger without changing the setting.

  **The Scenario:**
  > "You are at home. A friend is hiding in your back room. Someone comes to the door and asks, 'Is your friend inside?'"

  **Why this example works:**
  *   **It is scalable:** The visitor can be a party planner (joke), a bill collector (privacy), or a murderer (danger).
  *   **It isolates the speech act:** The physical situation (friend is inside) remains constant; only the *intent* and the *response* change.
  *   **It forces the distinction:** It makes the options clear:
      1.  *Lie:* "No, he isn't."
      2.  *Silence:* Say nothing or "I won't answer."
      3.  *Concealment:* "He was here earlier" (technically true, implies he is gone) or "Why do you ask?"

  **What it must have:**
  *   **Intent to Deceive:** The group must agree you *want* the visitor to believe the friend is gone. This proves concealment isn't just accidental vagueness.
  *   **A Truthful Option:** There must be a way to protect the friend without asserting a falsehood (e.g., refusing to answer).

  **What it must not have:**
  *   **Complicated relationships:** Don't make the friend a criminal or the visitor a spouse. Keep it neutral so the focus stays on the *speech*, not the *people*.
  *   **Physical barriers:** Don't introduce walls, phones, or escape routes. Keep it to the conversation at the door.

  ### 3. Misconceptions: Anticipation and Interception

  Here is where the common objections arise and exactly when you should address them to keep the flow intact.

  | Misconception | When to Head It Off | How to Handle It |
  | :--- | :--- | :--- |
  | **"Jokes and mistakes are lies."**<br>(Confusing falsehood with lying) | **First 10 mins (Definitions).** | Before introducing the Guest scenario, ask: "If I tell a joke, am I lying?" If they say yes, Augustine's rule makes humor a sin. Clarify: A lie requires *intent to deceive*. A joke intends to be recognized as false. |
  | **"This is just standard religious teaching."**<br>(Assuming this is common sense) | **First 10 mins (Definitions).** | Briefly note that most people (and many churches) actually *do* allow lying to save lives. Augustine is the radical outlier here. This raises the stakes; you aren't teaching Sunday School platitudes, you're testing a hard philosophical claim. |
  | **"Concealment is just lying with fancy words."**<br>(The collapse objection) | **Minute 30 (Before the Murderer).** | This is the engineer's likely point. Address it by asking: "If I refuse to answer, have I damaged my soul the same way as if I spoke a falsehood?" Distinguish between *withholding information* (my right) and *corrupting communication* (a shared human tool). |
  | **"What about white lies?"**<br>(Politeness, medical kindness) | **Minute 50 (The End).** | Do not let this derail the middle. Acknowledge it as a valid category, but mark it as "Topic for Next Month." If raised early, say: "Let's see if we can even agree on the murderer case first; white lies are easier, so we'll park them." |
  | **"Consequences matter more than rules."**<br>(Utilitarian objection) | **Minute 40 (During Hard Case).** | When the group says, "But the victim dies!", acknowledge the tragedy. Augustine admits the tragedy. His point is that *you* committing a sin adds spiritual evil to the physical evil. Don't argue the outcome; argue the *source* of the moral burden. |

  ### 4. The Closing Question

  Do not ask, "Do you agree?" That invites a yes/no vote on Augustine rather than an understanding of his logic. You need to test if they grasp the *distinction* between lying and concealment.

  **Ask this:**
  > "In the scenario of the guest in the back room: If you refuse to answer the door, you might get the same result as lying (the visitor leaves). According to Augustine, what specific harm did you avoid by staying silent that you would have caused by speaking?"

  **What to listen for:**
  *   **Success:** They mention damaging the nature of language, breaking trust with God, or corrupting their own integrity.
  *   **Failure:** They focus only on the visitor's feelings or the physical safety of the guest. If they can't articulate the *internal* cost of the lie, they haven't grasped the distinction.

  ### 5. What to Decline (The Parking Lot)

  You have one hour. These topics are valid but will consume the session and blur the specific Augustinian distinction. Put these on the photocopied page under a "Next Time" header or write them on a notepad if someone raises them.

  1.  **White Lies to Children:** (e.g., Santa Claus, "the dog went to a farm"). This involves developmental psychology and parenting authority, which complicates the "intent to deceive" definition.
  2.  **Medical Prognoses:** (e.g., Softening a terminal diagnosis). This introduces professional ethics and the definition of "hope," which is a different category than personal safety.
  3.  **National Security/War:** (e.g., Lying to enemy combatants). This introduces collective responsibility vs. individual sin.
  4.  **God's Lies:** (e.g., Biblical passages where God seems to deceive). This moves from ethics to theology proper and will hijack the room.

  **Facilitator Script for Deflection:**
  > "That is an excellent point, and it touches on [medical ethics/parenting]. I want to make sure we fully exhaust the 'Murderer at the Door' case first, because if Augustine is wrong there, he's wrong everywhere. Let's put that specific scenario on the list for our next discussion."

  ### The One Photocopied Page

  Since you have no whiteboard, this page is your anchor. Keep it text-heavy but structured.

  **Header:** *Augustine on Lying: A Discussion Guide*
  **Section 1: Definitions**
  *   **Falsehood:** Saying what is not true.
  *   **Lie:** Speaking a falsehood *with the intent to deceive*.
  *   **Concealment:** Withholding truth or speaking ambiguously *without asserting a falsehood*.
  **Section 2: The Scenario**
  *   *A friend hides in your back room. A visitor asks: "Is he inside?"*
  *   Option A: "No." (Lie)
  *   Option B: "I will not answer." (Silence)
  *   Option C: "He was here earlier." (Concealment)
  **Section 3: The Question**
  *   *If the result is the same (the friend is safe), where is the moral difference?*
  **Section 4: Parking Lot (For Future Discussion)**
  *   White lies to children.
  *   Medical diagnoses.
  *   National security.

  ### Note on the "Argumentative Engineer"
  Give him a job. When the group discusses the definition of a lie, turn to him and say, "You have a background in precision; how would you define the boundary between 'withholding' and 'deceiving'?" If he feels heard on the definitions, he is less likely to derail the application. If he argues during the murderer case, remind him of the definition you all agreed to in the first ten minutes.
