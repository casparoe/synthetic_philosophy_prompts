      *   *Key Feature of Failure:* For Hawking: The slide between "completeness of physical prediction" and "logical completeness." For Lucas: The assumption of knowable consistency. I need to pick one "single feature" responsible for the weaker argument's failure. I'll focus on the **mapping of the formal system**. Hawking fails because a ToE isn't obviously a formal system of the requisite type. Lucas fails because the Mind isn't obviously a *fixed* formal system.
      *   *Wait, the prompt asks:* "which single feature of the theorems is most responsible for the weaker argument's failure." I need to choose the weaker argument first. I will argue Hawking's is weaker. The feature is the **requirement of sufficient arithmetic**. A ToE might not need to encode Peano Arithmetic.

