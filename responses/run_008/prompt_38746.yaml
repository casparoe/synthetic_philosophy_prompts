      *   **Deployment 2 (Deflationary):** Hawking (Physics < Theory of Everything).
      *   **Tone:** Evenhanded, rigorous, avoiding caricature/naive tourist tropes. Focus on where the analogy breaks ("which joint gives way").
      *   **Required Axes of Comparison:**
