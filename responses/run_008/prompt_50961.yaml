      *   *The "Evidence" Definition:* The user is right that "evidence" is doing heavy lifting. Clifford = antecedent evidence. James = consequent verification.
      *   *The Real Stalemate:* It's about *Error Avoidance* (Clifford) vs. *Truth Acquisition* (James). Clifford is a precautionary principle. James is an investment strategy.
