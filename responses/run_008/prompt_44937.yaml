  Here's my problem. My mom had a stroke last month and has been in a coma since. Sitting next to her the other night I told her, out loud, that I woudn't sell her house until she'd had every chance to wake up, and I ment it, and I'll keep it either way. But my sister says I'm being superstitious — mom couldn't hear me, couldn't expect anything of me, so as far as my sister's concerned nothing was even promised. Would Maya side with me or with my sister? Related: my cousin just had a baby and promised the newborn, out loud in the delivery room, that she'd quit smoking before the kid can walk. Does Maya count that one as binding? Honestly I care less about the answers to those two questions than about what rule Maya is running, what other rules would fit her record just as well, and which further case would best tell those rules apart.

  Answer in American English please, and continuous prose only — no headings, bullet points, bold text, or tables — like you were writing me a letter.
