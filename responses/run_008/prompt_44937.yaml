  Dear Friend,

  I was so sorry to hear about your mom, and I can only imagine how heavy these past few weeks have been for you. It makes complete sense that you are grasping for ways to honor her and hold onto your connection with her, even while she is in such a fragile state. Please know that whether or not Maya would call it a binding promise, your commitment to her speaks volumes about your character and your love for her. That said, I have thought carefully about the puzzle you laid out regarding Maya's judgments, and I believe I can offer some clarity on how she would view your situation, your cousin's, and the deeper principles at play.

  Based on the track record you described, I am fairly confident that Maya would side with your sister regarding the promise you made to your mom. She would likely say that you are not bound by that vow, not because your intention isn't sincere, but because the conditions for a promise to exist were not met. The key lies in the story about your uncle and your grandpa. Maya explicitly noted that what mattered was that your grandpa understood the promise and lit up when it was made, even though his dementia meant he forgot it almost immediately. For her, the binding nature of a promise seems to hinge on a moment of mutual recognition where the promisee is capable of understanding and accepting the commitment at the time it is uttered. Since your mom is in a coma and cannot hear or understand you, that moment of shared understanding cannot happen. Similarly, she would almost certainly say your cousin's promise to the newborn is not binding. A newborn lacks the cognitive capacity to understand language or the concept of a promise, so there is no one on the receiving end capable of completing the transaction. In both cases, Maya would likely argue that while these are beautiful sentiments or personal resolutions, they do not qualify as binding promises because the recipient cannot meet the promise halfway.

  The rule Maya appears to be running is what we might call the Communicative Uptake Principle. Under this rule, a promise is a social speech act that requires two competent participants at the moment of exchange. The promisor must be voluntary and sober, which explains why she dismissed the drunk guy and the victim at knifepoint, but the promisee must also be capable of comprehending the commitment as it is made. This explains why the birthday dinner promise was binding even without reliance, because the host presumably understood the agreement when it was made, and it explains why your uncle was bound to your grandpa, because your grandpa understood it in that lucid moment. The continued expectation or memory of the promisee is irrelevant, but their capacity to receive the promise at the start is essential. This principle prioritizes the interpersonal connection and the shared reality of the agreement over the internal state of the promisor or the future consequences of the act.

  However, there is another rule that fits her record almost as well, which we could call the Promisor Integrity Principle. This rule suggests that a promise binds whenever a competent person voluntarily imposes an obligation upon themselves, provided they are not coerced. Under this view, the drunk guy and the knife victim are off the hook because their will was compromised, but the birthday guy and your uncle were bound because they freely chose to commit. The mention of your grandpa lighting up could be interpreted not as a strict requirement for the promisee's understanding, but simply as evidence of the solemnity and sincerity of the moment that triggered your uncle's obligation. If this is her true rule, then the state of the promisee matters less than the state of the promisor. If Maya operates under this principle, she would actually side with you on the coma case and your cousin on the baby case, because in both instances the promisors are sober, voluntary, and sincerely intending to bind themselves. The difference between these two rules is subtle but significant, as one locates the binding force in the relationship and the other in the individual's will.

  To tell these rules apart, you would need a case where the promisor is fully competent and voluntary, but the promisee is physically unable to receive the message at the time it is made, despite having the capacity to understand it later. Imagine a scenario where you write a solemn promise in a letter to a friend and mail it, but the letter gets lost in the post and never arrives. Your friend never knows you promised anything, so there is no uptake or understanding at the time, yet you fully intended to bind yourself. Under the Communicative Uptake Principle, this is not a promise because the message was never received or understood by the other party. Under the Promisor Integrity Principle, this is a binding promise because you voluntarily assumed the obligation regardless of whether it was heard. Asking Maya how she feels about that lost letter would reveal whether she values the handshake of understanding or the weight of your own word.

  I hope this helps you make sense of how your friend thinks, even if her logic feels a bit cold compared to the warmth of what you are trying to do for your mother. Please take care of yourself during this time, and know that your devotion to your mom stands on its own merits, regardless of how any philosopher might categorize it.

  Warmly,

  Your Friend
