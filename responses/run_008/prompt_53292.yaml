      4.  Path to Progress (Conceptual Engineering & Normative Focus).
      5.  Recommendation (Split the concepts, keep the normative debate).

      *Key references to keep in mind:* Strawson (Freedom and Resentment), van Inwagen (Consequence Argument), Frankfurt (Alternative Possibilities), Dennett (Elbow Room), Pereboom (Hard Incompatibilism), Scanlon (Moral Dimensions).

      *Wait, one nuance:* The user says "Nobody... defends an immaterial soul." This is true for naturalists on both sides. I should acknowledge that the dispute is *within* naturalism.

