      *   *Diagnosis:* Break down the "Two Questions." Use specific arguments (Consequence Argument = Backward-looking/History; Frankfurt = Forward-looking/Capacity). Show how they miss each other.
      *   *Nature of Disagreement:* It's not *merely* verbal. It's normative. It's about whether "Basic Desert" is coherent.
      *   *Progress:* Suggest "Conceptual Engineering" and "Normative Shift."
      *   *Conclusion:* Endorse the split, but with a caveat about the normative stakes.

      *(Self-Correction during drafting)*: I need to be careful not to paint compatibilists as *only* forward-looking. Some (like Wolf) care about "Real Self" which has a historical component. And some incompatibilists (like Kane) care about agency, not just blame. I should nuance the "Two Questions" hypothesis. It's not a perfect split, but a difference in *priority*.

      *(Refining the "Verbal vs. Substantive" point)*: If I define "Free Will" as "Capacity to respond to reasons," compatibilism wins. If I define it as "Ultimate Origination," incompatibilism wins. So the fight is over *which definition captures the value we care about*. That makes it substantive (axiological), not just verbal.

