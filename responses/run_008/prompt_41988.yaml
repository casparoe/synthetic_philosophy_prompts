answer: |-
  Here is a specification of desiderata for a normative theory of promising, tailored to your practical, non-ideal theoretic aims. I have organised these by the constraints they impose, marking each as either **Non-negotiable** (conditions a theory must meet to count as a theory of promising) or **Camp Preference** (conditions that reflect specific meta-ethical or structural commitments, analogous to the locality constraint in quantum mechanics).

  Following the list, I address your hypothesis regarding the incompatibility of these constraints and score the three major families of views.

  ### The Desiderata

  **1. The Deliberative Constraint**
  *   **Motivation:** The theory must guide an agent *in media res*. It cannot rely on counterfactuals about a fully just society or idealised interlocutors. If an agent cannot use the theory to determine her obligation in a non-ideal context (e.g., under an unjust regime), the theory is practically inert.
  *   **Status:** **Non-negotiable**. (This is your primary methodological stipulation).

  **2. The Coercion Constraint**
  *   **Motivation:** The case of the unjust regime. A theory must explain why a promise extracted at gunpoint (or under threat of death by a state) lacks binding force, whilst acknowledging that not all pressure negates a promise (e.g., 'If you don't promise to visit, I shall be very sad'). It must distinguish illegitimate coercion from mere strong motivation.
  *   **Status:** **Non-negotiable**.

  **3. The Content Constraint**
  *   **Motivation:** The 'Kidney Case'. A theory must account for the limits of promissory content. One cannot promise to do the impossible, the logically incoherent, or the profoundly immoral/self-destructive. If the theory implies the agent is bound to donate the kidney simply because she said so, it fails.
  *   **Status:** **Non-negotiable**.

  **4. The Epistemic Independence Constraint**
  *   **Motivation:** Promises to the dead or the unaware. The obligation must persist even if the promisee cannot verify performance, cannot rely on the promise in a behavioural sense, and cannot experience the benefit. The obligation cannot be wholly contingent on the promisee's present epistemic state.
  *   **Status:** **Non-negotiable**.

  **5. The Release Constraint**
  *   **Motivation:** The power of waiver. If the promisee can release the promisor at will (at no cost to others), the theory must explain the mechanism. If the obligation arises from the promisor's will alone, why does the promisee's will extinguish it? If it arises from reliance, why can it be waived *before* reliance occurs?
  *   **Status:** **Non-negotiable**.

  **6. The Performative Distinction**
  *   **Motivation:** Promise vs. Prediction. A theory must distinguish 'I promise I will be there' from 'I will be there, you can count on it' (said by a reliable person). The former creates an obligation *sui generis*; the latter creates an expectation based on character. The normative force must stem from the act of promising, not merely the probability of performance.
  *   **Status:** **Non-negotiable**.

  **7. The Reluctant Promisee Constraint**
  *   **Motivation:** The 'Politeness Case'. You promise, knowing the promisee would prefer you break it, and they extracted it only out of politeness. Both welfare and preference align against performance. Yet, breaking it without asking feels like a wrong. A theory that reduces the obligation to the promisee's benefit or reliance cannot explain why the promisor remains bound without the promisee's explicit release.
  *   **Status:** **Non-negotiable**. (This is the specific stress test you identified).

  **8. The Directionality Constraint**
  *   **Motivation:** The distinction between being *obligated to perform* and *owing performance to someone*. Breaking a promise involves a wrong *to the promisee*, not merely a violation of an impersonal moral rule.
  *   **Status:** **Camp Preference**. (Some reductionists argue all duties are ultimately impersonal; others insist promissory duties are essentially relational).

  **9. The Fault Distinction**
  *   **Motivation:** Making vs. Breaking. There is a distinct wrong in making a promise negligently (knowing one cannot keep it) separate from the wrong of breaking it. A theory must have the resources to condemn the hollow promise even if, by luck, it is kept.
  *   **Status:** **Non-negotiable**.

  **10. The Remedial Distinction**
  *   **Motivation:** Promise vs. Contract. Contract law often focuses on remedies (damages) rather than specific performance. Promissory morality focuses on the primary duty to perform. A theory of promising must not collapse into a theory of economic exchange or liability rules.
  *   **Status:** **Non-negotiable**.

  **11. The Non-Reductionist Constraint**
  *   **Motivation:** Is promissory obligation a distinct normative kind, or recoverable from general moral considerations (e.g., utility, lying, manipulation)? A theory should take a stance.
  *   **Status:** **Camp Preference**. (As you noted, some treat this as a constraint, others as question-begging).

  **12. The Intrapersonal Constraint**
  *   **Motivation:** Promises to oneself. Are these coherent? If a theory treats promising as essentially interpersonal (involving a claim-right by another), self-promises are a category error. If it treats them as binding, it must explain the mechanism of self-release.
  *   **Status:** **Camp Preference**. (You suspect this is either trivial or a *reductio*; a theory should not be disqualified solely for ruling them out, provided it explains why).

  ***

  ### The Compatibility Problem

  You hypothesised that the desiderata cluster into two families that cannot be jointly satisfied: one tying obligation to **Assurance/Reliance** (favouring the promisee's standing), and another tying it to **Self-Imposed Obligation** (favouring the promisor's will).

  I agree with your assessment: **Pure versions of these families are jointly unsatisfiable.**

  1.  **The Assurance/Reliance Family** satisfies the *Coercion* and *Content* constraints well (no reasonable reliance in duress; no benefit in the kidney case). However, it fails the **Reluctant Promisee** and **Epistemic Independence** constraints. If the promisee does not rely (wants you to break it) or cannot know (the dead), the 'assurance' value evaporates. To save the theory, one must posit 'hypothetical reliance' or 'normative reliance', but this risks becoming a fiction that abandons the core mechanism of the view.
  2.  **The Commitment-of-Will Family** satisfies the **Reluctant Promisee**, **Epistemic Independence**, and **Performative** constraints beautifully. The obligation exists because I willed it. However, it struggles catastrophically with the **Coercion** and **Content** constraints. If the will is the sole source, why does a gun negate it? Why can I not will to donate my kidney? To save this theory, one must import external moral constraints, which threatens to make the 'will' redundant.

  **Conclusion on Compatibility:** A viable theory must be a hybrid. It must posit that the *source* of the obligation is the promisor's will (to satisfy the Reluctant Promisee/Dead cases), but that the *validity conditions* of that will are constrained by the promisee's normative standing and general morality (to satisfy Duress/Kidney cases). The tension you identified is real: it is the tension between the **autonomy of the promisor** and the **authority of the promisee**. A theory that privileges one entirely will fail the desiderata associated with the other.

  ***

  ### Scoring the Three Families

  Here is how the three dominant families score against your non-negotiable desiderata.

  **1. Social-Practice / Convention Theories (e.g., Rawls, early Practice Views)**
  *   **Performance:** Poor.
  *   **Analysis:** These views ground obligation in the utility or existence of a social convention.
  *   **Failures:** They struggle with the **Deliberative Constraint** in non-ideal societies (if the practice is unjust, does it bind?). They often fail the **Epistemic Independence Constraint** (if the practice requires uptake). They struggle with the **Reluctant Promisee** case (if the practice is for mutual benefit, why bind when benefit is absent?).
  *   **Verdict:** Excluded primarily by the **Deliberative Constraint** and **Reluctant Promisee Constraint**.

  **2. Assurance / Reliance Theories (e.g., Scanlon, Sheinman)**
  *   **Performance:** Moderate.
  *   **Analysis:** These views ground obligation in the wrong of manipulating expectation or inducing reliance.
  *   **Failures:** They handle *Duress* and *Content* well (no reasonable reliance). However, they fail the **Reluctant Promisee Constraint** (no reliance induced if they want you to break it) and the **Epistemic Independence Constraint** (the dead cannot rely). They also struggle with the **Release Constraint** (why can I waive a duty not to manipulate you before I have manipulated you?).
  *   **Verdict:** Excluded primarily by the **Reluctant Promisee Constraint**.

  **3. Commitment-of-Will / Voluntarist Theories (e.g., Fried, Humean variants)**
  *   **Performance:** Moderate.
  *   **Analysis:** These views ground obligation in the exercise of normative power by the promisor.
  *   **Failures:** They handle **Reluctant Promisee**, **Dead**, and **Performative** cases well. However, they fail the **Coercion Constraint** (why doesn't the will bind under duress?) and the **Content Constraint** (why can't I will the impossible?). Crucially, they often fail the **Release Constraint**: if I bound myself, why can *you* unbind me?
  *   **Verdict:** Excluded primarily by the **Coercion Constraint** and **Release Constraint**.

  ***

  ### The Single Most Exclusionary Desideratum

  If one must identify the single desideratum that does the most work in excluding candidates, it is the **Reluctant Promisee Constraint**.

  **Reasoning:**
  The **Coercion Constraint** can be accommodated by Voluntarists by appealing to the invalidity of coerced consent (a standard legal/moral move). The **Epistemic Independence Constraint** can be accommodated by Reliance theorists by positing 'normative' rather than 'psychological' reliance.

  However, the **Reluctant Promisee Constraint** strikes at the heart of the most influential contemporary theory (the Scanlonian Assurance view). If the obligation is generated by the *value of reliance* or the *wrong of disappointment*, there is *no* wrong and *no* value in the Reluctant Promisee case. To accommodate it, the Assurance theorist must abandon reliance as the *ground* of the obligation and treat it merely as a *condition*. This collapses the distinction between Assurance and Voluntarism.

  Conversely, the Voluntarist can accommodate the Reluctant Promisee easily (I bound myself). Therefore, this desideratum acts as the sharpest filter: it eliminates the dominant 'middle-ground' theories that attempt to reduce promising to general morality without invoking a robust normative power. It forces the theorist to admit that there is a deontic residue in promising that survives the absence of reliance, benefit, or promisee desire. That is a high bar, and most current theories cannot clear it without significant revision.
