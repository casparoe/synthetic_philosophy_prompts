answer: |-
  The concept you are describing has a name, and you have effectively reconstructed one of the most significant arguments in contemporary value theory without realizing it. The term you are looking for is **Parity** (specifically, being "on a par").

  The philosopher most associated with formalizing this concept is **Ruth Chang**. In her seminal work (starting with *Incommensurability, Incomparability, and Practical Reason* in 1997 and subsequent papers), she argues exactly what you have intuited: that the standard trichotomy of practical reason ("better than," "worse than," "equally good") is incomplete. There is a fourth relation.

  Here is how you can arm yourself for your seminar, distinguishing Parity from the alternatives your classmates are proposing, and mapping the boundaries you asked for.

  ### 1. The Diagnostic: The Small Improvement Argument
  You mentioned: *"Small improvements can tip things while the current amounts do not."*

  This is known as the **Small Improvement Argument (SIA)**. It is the formal test for Parity. Here is the logic you can present to your seminar:

  1.  Assume Option A and Option B are not "better than" or "worse than" each other.
  2.  **Hypothesis 1 (Indifference):** They are *equally good*.
      *   *Test:* If A and B are equally good, then A+ (A plus a small improvement, e.g., $100 more salary) must be *better than* B.
      *   *Your Intuition:* You feel A and B are not *equal* (they are qualitatively different), yet A+ *would* be better than B.
  3.  **Hypothesis 2 (Incomparability):** They cannot be compared at all.
      *   *Test:* If A and B are incomparable, then A+ should also be incomparable to B (adding $100 doesn't create a common measure where none existed).
      *   *Your Intuition:* You know A+ *would* be better than B.
  4.  **Conclusion:** Since A and B are not equal, not strictly better/worse, yet A+ is better than B, they stand in a fourth relation: **Parity**.

  ### 2. Defending Against "Vagueness" and "Rough Equality"
  Your classmates accuse you of hedging (vagueness) or describing imprecise equality. Here is how defenders of Parity distinguish it:

  **Vs. Rough Equality (Imprecise Equality)**
  *   **The Classmate Objection:** "You just mean they are roughly equal, but you can't measure the difference precisely."
  *   **The Parity Defense:** Equality implies **interchangeability**. If two things are equally good, you have no rational reason to prefer one over the other; a coin flip is rational. With Parity, **will** creates the reason. When items are on a par, you are permitted to commit to one, and that commitment *makes* it the better choice for you going forward. Parity allows for **normative significance** in the choice itself, whereas equality renders the choice normatively inert.
  *   **Key Distinction:** In rough equality, the value is the same. In Parity, the values are different but "match" in overall choiceworthiness without being identical.

  **Vs. Vagueness (Epistemic Uncertainty)**
  *   **The Classmate Objection:** "There is a fact of the matter about which is better, you just don't know it (like not knowing if a heap has 1,000 or 1,001 grains of sand)."
  *   **The Parity Defense:** Vagueness is **epistemic** (about our knowledge). Parity is **ontological** (about the values themselves). In your job case, you said: *"I'm not uncertain about any of the facts."*
  *   **The Argument:** If it were vagueness, there would be a precise point where adding $1 makes Job A better. But in hard choices, there is no such "tipping point" grain of sand. The lack of a determinate relation isn't due to the blurriness of our concepts; it's because the world does not determine a ranking.

  ### 3. Mapping the Boundaries (The "Whisker" Cases)
  You asked for a definition that distinguishes your state from cases where one option is "better by a whisker."

  **Definition of Parity:**
  Two items, A and B, are **on a par** if and only if:
  1.  A is not better than B.
  2.  B is not better than A.
  3.  A is not equally good as B.
  4.  There exists some small improvement to A (A+) such that A+ is better than B.

  **Boundary Case 1: The Whisker (Strict Betterness)**
  *   *Scenario:* Job A is better than Job B by a tiny margin (a "whisker").
  *   *Classification:* **Not Parity.**
  *   *Why:* Condition #1 fails. If A is better by a whisker, trichotomy holds. In Parity, trichotomy *fails*. If you genuinely feel one is better, even slightly, you are in the realm of standard maximization. Parity only exists where the ranking relation is genuinely indeterminate.

  **Boundary Case 2: Lexical Superiority (Strong Incommensurability)**
  *   *Scenario:* Job A involves saving a life; Job B involves making toast. No amount of toast-making makes B better than A.
  *   *Classification:* **Incomparability / Lexical Superiority.**
  *   *Why:* Condition #4 fails. A small improvement to B (making *two* pieces of toast) does not tip the scale. Parity requires that the options be comparable enough that improvements *can* tip the scale.

  **Boundary Case 3: True Indifference**
  *   *Scenario:* Two identical bus routes.
  *   *Classification:* **Equality.**
  *   *Why:* Condition #3 fails. They are equal. Parity requires qualitative difference.

  ### 4. Why This Matters for Rational Choice
  If your seminar is on rational choice, this is the critical pivot point.
  *   **Standard Rational Choice Theory:** Assumes trichotomy. If you aren't indifferent, you must have a preference. If you can't state a preference, you are irrational or uninformed.
  *   **Parity Theory:** Suggests that **hard choices** are opportunities for **agency**. When options are on a par, reason runs out. This is not a failure of rationality; it is the space where **will** operates. You don't *find* the reason to choose; you *create* it by committing.

  ### 5. Recommended Reading for Your Seminar
  To stop "circling" and give your classmates concrete targets, cite these:

  1.  **Ruth Chang, "Incommensurability, Incomparability, and Practical Reason" (1997).** This is the source of the Small Improvement Argument.
  2.  **Ruth Chang, "Are Hard Cases Vague?" (2002).** This directly addresses your classmates' accusation that you are describing vagueness.
  3.  **Joseph Raz, *The Morality of Freedom* (1986).** Look for his discussion on **incommensurability**. Raz is often the foil for Chang; he argues that when values conflict, they are often incomparable. Chang argues they are comparable *via parity*.
  4.  **Elizabeth Anderson, *Value in Ethics and Economics* (1993).** She discusses "pluralistic values" which often lead to parity situations.

  ### Summary for Your Discussion
  When you return to class, you can say:

  > "I am not describing vagueness or indifference. I am describing **Parity**, as defined by Ruth Chang. It is distinct from indifference because the options are qualitatively distinct and not interchangeable. It is distinct from vagueness because the indeterminacy is normative, not epistemic. It is distinct from strong incomparability because small improvements *do* determine a ranking. The 'Small Improvement Argument' proves that trichotomy fails here, requiring a fourth value relation."

  If your professor pushes back, they are likely a **monist** about value (believing all value can be reduced to a single metric, like utility). If so, your disagreement is foundational: they believe a common metric *must* exist; you are arguing that the phenomenology of hard choices suggests it does not.

  **Coinage (if you need a fresh label):**
  If "Parity" feels too loaded by the literature and you want a term that captures the *dynamic* nature you described (where improvements tip the scale), you might coin **"Tippable Equilibrium."**
  *   *Definition:* A state of normative suspension between two options where neither ranks higher, but the relation is sensitive to marginal changes in value dimensions.
  *   *Inside the map:* Career vs. Family, Art vs. Security.
  *   *Outside the map:* Identical options (Indifference), Sacred vs. Profane (Incomparability), Clear best option (Strict Betterness).

  However, I strongly advise using **Parity**. It connects you directly to the existing literature, which is the point of a seminar. You have stumbled upon a central debate in modern philosophy; you aren't hedging, you're doing value theory.
