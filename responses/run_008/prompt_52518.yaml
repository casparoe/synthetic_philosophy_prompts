answer: |-
  This is an exceptional case study for a seminar on the ethics of killing. *Re A (Children)* is rare in legal history because the judges explicitly recognized they were engaging in moral philosophy, not just statutory interpretation. For your purposes, it serves as a stress test for the doing/allowing distinction: it forces students to see that categorizing an act is often the *result* of a moral judgment, not the *premise* of it.

  Here is a mapping of the case, a critique of the available framings, and an analysis of what the case reveals about the distinction itself.

  ### 1. Mapping the Episode onto the Distinction

  To discipline the discussion, we must fix the variables for each framing: the **Act** (what is physically happening), the **Agent** (whose will is primary), and the **Relevant Alternative** (the baseline against which the act is measured).

  **A. The Withdrawal of Aid Framing (Ward J, First Instance)**
  *   **Act:** Discontinuing the life-support system provided by Jodie's circulatory system to Mary.
  *   **Agent:** The surgeons act as proxies for Jodie (the provider of aid).
  *   **Relevant Alternative:** Continuing to force Jodie's body to sustain Mary against the natural limits of Mary's own physiology.
  *   **Classification:** **Letting Die.**
  *   **Rationale:** Mary is viewed as a "parasite" or free-rider. Jodie has no duty to provide her heart and lungs to Mary. Therefore, severing the connection is not an attack on Mary, but a reclamation of Jodie's bodily integrity. The cause of death is Mary's own pre-existing defects (lack of lungs/heart), not the cut.

  **B. The Rachels Framing (The Distinction is Morally Irrelevant)**
  *   **Act:** An intervention (surgery) that results in Mary's death.
  *   **Agent:** The surgeons (state-sanctioned).
  *   **Relevant Alternative:** Non-intervention, resulting in both deaths.
  *   **Classification:** **The label is inert.**
  *   **Rationale:** Following James Rachels' "Active and Passive Euthanasia," the moral weight lies in the motive (saving Jodie) and the consequence (one life saved vs. two lost), not the causal mechanism. Whether we call it killing or letting die is semantic; the justification is identical in both cases (mercy/necessity).

  **C. The Quinn Framing (Direct vs. Indirect Agency)**
  *   **Act:** Cutting the shared artery.
  *   **Agent:** The surgeons.
  *   **Relevant Alternative:** Leaving the twins conjoined.
  *   **Classification:** **Killing (Direct Harmful Agency).**
  *   **Rationale:** Philippa Quinn distinguishes between *direct* agency (harming someone to achieve a goal) and *indirect* agency (allowing harm to occur). Here, the surgeons must physically cut Mary's tissue. They are not merely removing an obstacle; they are initiating a causal sequence that terminates her life. Quinn would likely classify this as direct agency, making it a killing, though potentially justifiable under extreme constraints.

  **D. The Doctrine of Double Effect (DDE) Framing (Brooke/Walker L.J. leanings)**
  *   **Act:** Separation surgery.
  *   **Agent:** The surgeons.
  *   **Relevant Alternative:** No surgery.
  *   **Classification:** **Killing (but permissible).**
  *   **Rationale:** The *intention* is to save Jodie. Mary's death is a *foreseen but unintended* side effect. The death is not the means to Jodie's survival (Jodie survives because she is separated, not *because* Mary dies), nor is it the end. Thus, while it is a "doing," it lacks the malicious intent that typically makes killing wrong.

  ---

  ### 2. Strains and Endorsement

  Each framing encounters significant friction when applied to the specific facts of *Re A*.

  **The Strains:**
  *   **Withdrawal of Aid:** This faces the "Scalpel Problem." Withdrawing life support usually involves turning off a machine or removing a tube. Here, surgeons must actively cut into Mary's body. Furthermore, the "provider" of the aid (Jodie) is an infant incapable of consent, and the "surrogates" (parents) explicitly refused the withdrawal. To call this "allowing" requires defining the *status quo* as "Jodie's body is hers alone," which is a normative claim, not a descriptive one.
  *   **Rachels:** This dissolves the distinction entirely. While philosophically robust, it fails to explain why the judges felt such anxiety about categorizing the act. If the distinction carries no weight, the legal struggle to define it as "lawful homicide" vs. "medical treatment" is pointless.
  *   **Quinn:** This framing is honest but dangerous for the students. If it is Direct Harmful Agency, it is a killing. This forces the justification into the realm of "justifiable homicide," which unsettles the prohibition on killing innocent persons.
  *   **Double Effect:** This faces the "Certainty Problem." DDE relies on the distinction between intended and foreseen consequences. But when a consequence is known with near-certainty (Mary *will* die upon separation), the distinction between "intending" and "foreseeing" becomes linguistic sleight of hand. As the judges noted, you cannot separate them *in order to save Jodie* without accepting Mary's death as a necessary condition of the success.

  **My Endorsement:**
  I endorse the **Withdrawal of Aid** framing, but with a specific metaphysical caveat.

  I argue this is the most coherent way to preserve the doing/allowing distinction without collapsing into consequentialism. To make it work, we must treat Jodie's circulatory system not as a shared resource, but as **Jodie's property**. If I am forced to donate a kidney to you to keep you alive, and I stop, I have let you die; I have not killed you. In *Re A*, Jodie is being forced to donate her heart and lungs continuously. The surgery is simply the physical mechanism required to stop that forced donation.

  We must accept that "withdrawal" does not always mean "passivity." If a saboteur attaches a bomb to your car, disabling it requires active cutting of wires. That is still "removing a threat" or "stopping aid," not "killing." The strain regarding the scalpel is real, but it is physical, not moral. The moral act is the cessation of Jodie's life-support to Mary. The physical act is cutting tissue. We should not let the physical violence of the cut obscure the moral nature of the withdrawal.

  However, I endorse this *only* because it respects the intuition that Jodie has a right to bodily integrity that trumps Mary's right to life. If you cannot accept that Jodie's body is "hers" in a way that excludes Mary, this framing collapses.

  ---

  ### 3. The Case Turned Back on the Theory

  This is the most critical section for your seminar. *Re A* does not just apply the doing/allowing distinction; it interrogates its validity.

  **A. The Distinction as Post-Hoc Rationalization**
  The episode suggests that the doing/allowing distinction does not carry independent moral weight here; rather, it is manipulated to fit a conclusion driven by **prognosis** and **bodily autonomy**.
  *   **Prognosis:** Almost everyone intuits that saving one life is better than losing two. This is a utilitarian calculation. If the distinction were doing the heavy lifting, the fact that it is a "killing" (as Quinn suggests) should make it much harder to justify than a "letting die." Yet, the court authorized it despite the "killing" classification leaning heavily in the Appeal Court.
  *   **Autonomy:** The real driver of permissibility is Jodie's right not to be a life-support machine.
  *   **The Judicial Split:** The fact that three appellate judges could not agree on *what kind of act* this was (Ward: withdrawal; Brooke: self-defense; Walker: necessity) indicates that the ontology of the act is indeterminate. We are not discovering whether it is a killing or a letting die; we are *choosing* the description that licenses the outcome we want. This supports the Rachels view: the distinction is morally inert, serving only as a legal label to manage our discomfort.

  **B. The "Normal Brain" Variation**
  Would the analysis change if Mary had normal brain function? **Yes, drastically.**
  *   If Mary were a cognitively normal person, the **Withdrawal of Aid** framing becomes much harder to sustain. Why? Because the "parasite" metaphor relies on Mary being a defective organism leeching off a host. If Mary is a full person with equal moral status, the claim that Jodie's body is "hers alone" competes directly with Mary's claim to life.
  *   **Implication for the Theory:** If the *type of act* (separation) remains identical, but our willingness to call it "Letting Die" vanishes when the victim's moral status rises, then the doing/allowing distinction is not tracking the *physics* of the act. It is tracking the *value of the victim*.
  *   This shows the distinction is **swamped by other considerations**. We are more willing to categorize an act as "allowing" when the person being allowed to die has a weaker claim to our resources (due to defect or dependency). If the distinction were robust, it should hold regardless of Mary's brain function. The fact that it doesn't suggests the distinction is flexible enough to be molded by our assessment of the lives involved.

  **C. Where the Theory is Silent**
  The doing/allowing distinction is silent on **conflicts of rights**. It tells us that killing is worse than letting die. It does not tell us what to do when Person A's "letting die" (refusing to share organs) requires Person B's "killing" (surgical separation).
  *   The theory assumes a single agent facing a single patient. *Re A* presents two patients with conflicting bodily claims.
  *   In this vacuum, the theory stretches. We try to force the case into "Withdrawal" to avoid the "Killing" prohibition. But this reveals that the distinction is not a fundamental moral truth, but a heuristic that breaks down in cases of bodily entanglement.

  **Conclusion for the Seminar**
  Use *Re A* to show students that the doing/allowing distinction is not a microscope that reveals the moral truth of an act. It is a language we use to negotiate competing rights.
  *   If you want to save Jodie, you describe the act as **Withdrawal** (stopping forced donation).
  *   If you want to protect the sanctity of life, you describe the act as **Killing** (active destruction of Mary).
  *   The case vindicates the idea that the distinction has *rhetorical* weight, but not *ontological* weight. The permissibility of the surgery is driven by the tragedy of the prognosis (1 vs 2 deaths) and the priority of bodily integrity. The "doing/allowing" label is the garment we tailor to fit that conclusion.

  For your students, the lesson is this: Do not ask "Is this killing or letting die?" to find the answer. Ask "What rights are in conflict?" and then see which label fits the resolution. The case shows that sometimes, to do the right thing, we must admit that the distinction is less important than the necessity of the choice.
