      *   *Section 3: Residue Report.* Clean, Distorted, Unmappable.
      *   *Section 4: The "World Pushes Back" Flag.* Address the user's specific suspicion.
      *   *Section 5: Verdict.* Friend is 70% right, but the last 30% matters.
      *   *Section 6: Contested Ground.* Acknowledge where Rorty scholars fight.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I use "vibes"? No, keep it technical.
