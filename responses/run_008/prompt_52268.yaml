  11. **Final Polish:** Ensure the distinction between *causal* pressure (loss) and *normative* pressure (peer review/benchmark acceptance) is sharp. This is the key to the "world pushes back" problem.

  **(Self-Correction Note):** I need to be careful not to make Rorty sound like a pure instrumentalist in a way that denies *any* external constraint. He admits the world is hard. He just denies the world *speaks*. In ML, the test set "speaks" via metrics. I need to clarify that the metric is a human construction.

  Let's structure the response.
  1. **The Translation Layer:** Map Rorty concepts to ML concepts.
