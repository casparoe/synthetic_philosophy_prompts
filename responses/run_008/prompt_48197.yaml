      Your rule of thumb is wrong. Simpson's Paradox doesn't mean subgroups are always truth and aggregates are propaganda; it means you need to understand the causal structure behind the data. Sometimes the aggregate effect is the real total effect (e.g., if department choice is influenced by gender socialization, the overall disparity matters). Other times, disaggregating creates bias. Your friend is describing "collider bias" or "overadjustment." If you split by a variable that is caused by the treatment (a mediator) or influenced by both treatment and outcome (a collider), you block the causal path or open a spurious one, manufacturing a reversal where none exists. There is no statistical test to tell you which level is "real"; you need subject-matter knowledge to draw a causal diagram. You must identify confounders (common causes) to adjust for, while avoiding mediators (intermediate steps) and colliders. In the Berkeley case, department was a confounder (influencing admission rates and application choices independently), so disaggregation was correct. In your friend's epidemiology examples, the subgroup variable was likely a mediator, so disaggregation hid the true effect. Statistics alone cannot decide this; you need theory to know which variables represent fair comparisons versus which represent biased selections. Blindly disaggregating is just as dangerous as blindly aggregating.

