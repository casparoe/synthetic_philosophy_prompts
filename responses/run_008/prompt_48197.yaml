answer: |-
  Your rule of thumb is wrong. Simpson's Paradox does not imply that subgroups are inherently truthful and aggregates are propaganda; it reveals that statistical associations depend on causal structure. Whether the aggregate or disaggregated number represents the "real" effect depends on whether the grouping variable is a confounder, a mediator, or a collider. You should only disaggregate to control for confounders (common causes of treatment and outcome), as in Berkeley where department preference influenced both gender and admission. However, if you disaggregate by a variable affected by the treatment (a mediator) or a common effect (a collider), you introduce bias that can manufacture reversals out of thin air. This is why your epidemiologist friend sees effects vanish when splitting by post-treatment variables. There is no purely statistical rule for how far to break data down; you need subject-matter knowledge to map causal relationships, often using Directed Acyclic Graphs (DAGs). Blindly trusting subgroups is just as dangerous as blindly trusting averages. The "truth" isn't at a specific level of aggregation, but in the causal model that justifies adjusting for specific variables. Without understanding *why* the data varies, disaggregation is merely slicing bias into smaller pieces.
