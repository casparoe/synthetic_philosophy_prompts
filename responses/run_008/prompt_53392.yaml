  **JOINT STATEMENT OF PRINCIPLES AND RESEARCH AGENDA**
  **SUBCOMMITTEE ON FAMINE ETIOLOGY AND EARLY WARNING**
  **DATE:** October 26, 2023
  **STATUS:** DRAFT FOR COLLABORATIVE REVIEW

  ### I. AGREED CLAIMS AND SHARED FOUNDATIONS

  The undersigned parties, representing the Entitlement/Political Economy perspective and the Food Availability/Demographic perspective, acknowledge that while theoretical divergences remain, operational efficacy requires a shared baseline of historical and conceptual understanding. We affirm the following:

  1.  **Historical Consensus on Case Studies**
      *   **The Irish Famine (1845–1852):** Both camps agree that *Phytophthora infestans* (potato blight) was the biophysical trigger that destroyed the primary caloric source for the Irish poor. Both camps acknowledge that net food exports from Ireland to Great Britain continued during the crisis, though they differ on the caloric significance of those exports relative to the deficit. Both agree that British administrative policy (laissez-faire economics, relief limitations) significantly influenced the mortality rate.
      *   **The Bengal Famine (1943):** Both camps agree that wartime inflation, speculative hoarding, and distribution bottlenecks (the "Denial Policy" of rice boats) exacerbated the crisis. Both camps acknowledge that recent re-evaluations of crop data suggest the decline in availability may have been more severe than Amartya Sen's original 1981 analysis posited, though the magnitude of this decline remains contested.
      *   **The Great Leap Forward (1959–1961):** Both camps agree that radical collectivization and excessive grain procurement quotas were central drivers of the disaster. Both camps acknowledge that adverse weather conditions occurred during this period, though they differ on whether these conditions were sufficient to cause famine absent policy errors.

  2.  **Scope of the Entitlement Framework**
      *   We agree that the Entitlement Approach provides the superior explanatory framework for **differential mortality**. It successfully explains why specific occupational groups (e.g., landless laborers, rural artisans) starve while others with access to assets or wages survive within the same geographic region.
      *   We agree that the Entitlement Approach, in isolation, does not fully explain the **onset of aggregate production shocks**. A collapse in entitlements is often *triggered* by a sudden drop in endowment (e.g., crop failure), even if the entitlement failure determines the ultimate death toll.

  3.  **Resolution of Verbal Disputes**
      *   **"Natural Disaster":** We agree that this term is currently functioning ambiguously.
          *   For the Availability camp, it is a **causal claim** regarding biophysical triggers (drought, blight).
          *   For the Entitlement camp, it is heard as an **exculpatory claim** implying inevitability and absolving governance.
          *   *Agreement:* Henceforth, we will distinguish between "biophysical triggers" and "institutional resilience." We will avoid the phrase "natural disaster" in policy documents unless qualified by "mitigated by human action."
      *   **"Political Crime":** We agree that this term conflates legal intent with structural outcome.
          *   For the Entitlement camp, it signifies **foreseeable negligence** and the prioritization of non-human goals (e.g., war effort, ideology) over civilian life.
          *   For the Availability camp, it implies **malicious intent** that exceeds the state's actual capacity or knowledge at the time.
          *   *Agreement:* We will adopt the term "Political Failure" to describe instances where policy choices exacerbated mortality, reserving "Crime" for legal determinations outside this technical body.

  ***

  ### II. TABLE OF RESIDUAL DISAGREEMENTS

  The following table outlines remaining theoretical divergences. Each position is phrased charitably, as its proponents would articulate it, to ensure accurate representation in future modeling.

  | Topic | Position A: Entitlement & Political Economy | Position B: Food Availability & Demography |
  | :--- | :--- | :--- |
  | **Primary Driver** | Famines are fundamentally failures of **distribution and access**. Even in the presence of moderate shortages, functional markets and social safety nets can prevent mass mortality. Famine is the exception, not the rule, of scarcity. | Famines are fundamentally failures of **production**. When aggregate caloric availability drops below a critical demographic threshold, distribution mechanisms inevitably collapse. Scarcity is the necessary precondition for famine. |
  | **Bengal 1943 Data** | The statistical record supports the view that rice availability in 1943 was **not significantly lower** than in non-famine years. The disaster was driven by panic, inflation, and the failure of the state to manage trade, proving that FAD (Food Availability Decline) is not required for famine. | The statistical record is unreliable due to wartime reporting disruptions. Revised agronomic data suggests a **significant yield decline** due to brown spot disease and cyclone damage. FAD was present and necessary to explain the scale of the mortality. |
  | **State Capacity** | States in famine zones possess the **agency to prevent death** through redistribution. When they fail to do so, it is because the lives of the starving are politically undervalued. The famine is a choice by omission or commission. | States in famine zones are often **overwhelmed by biophysical constraints**. No amount of redistribution can create calories that do not exist. Attributing famine solely to policy imputes omniscience and capacity to governments that may simply be unable to cope with ecological shock. |
  | **Democracy Hypothesis** | No substantial famine has ever occurred in a functioning democracy with a free press. Electoral accountability and information flow force early government response, making famine impossible under these political conditions. | While democracies reduce risk, the correlation is not absolute. Democracies can suffer **slow-onset nutritional crises** that meet famine mortality thresholds if the affected population lacks political power. The "free press" mechanism can fail if the crisis is misdiagnosed as localized. |

  ***

  ### III. CRUXES FOR ADVERSARIAL COLLABORATION

  To move beyond theoretical stalemate, we identify four specific cruxes. Settling these empirically would require at least one camp to adjust its confidence intervals or model weighting. For each crux, we specify the evidence required and the divergent predictions.

  #### Crux 1: The Magnitude of Bengal's Availability Decline
  *   **The Question:** Was the Food Availability Decline (FAD) in Bengal in 1943 statistically significant enough to cause famine absent distributional failures?
  *   **Evidence Required:** A joint re-analysis of the *Manhattan Project* of Bengal crop data, utilizing Tauger's agronomic disease estimates against Sen's trade and carry-over data, standardized to caloric availability per capita.
  *   **Predictions:**
      *   *Entitlement Camp:* Predicts that even with revised yield data, per capita availability remained above the starvation threshold (approx. 1,600 kcal/day), implying distribution was the sole killer.
      *   *Availability Camp:* Predicts that revised data will show availability dropped below the survival threshold for the bottom quartile of the population, making some mortality inevitable regardless of policy.

  #### Crux 2: Mortality Correlates in Ireland and Bengal
  *   **The Question:** Does mortality track **class/entitlement** or **regional crop failure intensity**?
  *   **Evidence Required:** Sub-district level mortality data cross-referenced with occupational class (Ireland) and landholding size (Bengal), compared against local crop yield estimates.
  *   **Predictions:**
      *   *Entitlement Camp:* Predicts high mortality in areas with high landless labor populations *even where* crop yields were less affected (e.g., urban centers or areas growing non-potato crops).
      *   *Availability Camp:* Predicts mortality rates will correlate most strongly with the percentage of local crop loss, regardless of class, with class only determining the *timing* of death, not the *incidence*.

  #### Crux 3: The Democracy and Free Press Hypothesis
  *   **The Question:** Is the absence of famine in democracies a causal rule or a historical coincidence limited to the post-1950 era?
  *   **Evidence Required:** A expanded dataset of "near-miss" events in democracies (e.g., India 1965–67, Ethiopia post-1991) coded for "Famine Conditions" (IPC Phase 5) vs. "Famine Mortality."
  *   **Predictions:**
      *   *Entitlement Camp:* Predicts that in all democratic cases, early warning triggered intervention before mortality spiked to famine levels, confirming the preventive mechanism.
      *   *Availability Camp:* Predicts that at least one case will show significant excess mortality (meeting famine definitions) where the government was elected and the press was free, but the ecological shock was too rapid or localized for political mechanisms to react in time.

  #### Crux 4: Intent and Capacity (GLF vs. Ireland)
  *   **The Question:** Does the distinction between "active extraction" (GLF) and "passive restraint" (Ireland) justify the categorization of "Political Crime"?
  *   **Evidence Required:** Comparative analysis of internal state communications (Politburo records vs. British Colonial Office memos) regarding knowledge of starvation at the time procurement/export decisions were made.
  *   **Predictions:**
      *   *Entitlement Camp:* Predicts GLF records will show leadership was aware of local starvation but prioritized procurement quotas, satisfying a threshold of reckless disregard warranting the "crime" label.
      *   *Availability Camp:* Predicts records will show leadership received falsified local reports (the "wind of exaggeration") and believed they were managing a shortage, not causing a famine, negating the *mens rea* required for "crime" and supporting "systemic failure."

