answer: |-
  Based on the five verdicts you provided, it is possible to construct a single, precise principle that accommodates all of them without abandoning any of your intuitions. Your intuitions align closely with a hybrid view in action theory that combines **certainty**, **control**, and a **normatively sensitive attitude condition**.

  Here is the principle that captures your data, followed by the analysis of your cases and the prediction for the new one.

  ### The Principle of Constitutive Stance

  An agent brings about a foreseen side-effect **intentionally** if and only if three conditions are met:

  1.  **Certainty:** The agent foresees the side-effect as a *virtual certainty* resulting from their action (not merely a risk or probability).
  2.  **Avoidability:** The agent could have avoided the side-effect by choosing a different course of action (i.e., it is not a physically necessitated byproduct of the only available means).
  3.  **Constitutive Stance:** The agent's attitude toward the side-effect satisfies one of two clauses:
      *   **(A) Endorsement:** The agent welcomes, desires, or actively incorporates the side-effect into their self-conception or goals (regardless of moral valence).
      *   **(B) Normative Indifference to Harm:** The agent is indifferent to a foreseen, certain harm that they had a moral duty to avoid. (Note: Indifference to a *benefit* does not satisfy this condition).

  ---

  ### How the Principle Fits Your Five Verdicts

  1.  **Harmful Chairman (Intentional):**
      *   *Certainty:* Yes (knows it will harm).
      *   *Avoidability:* Yes (could stop the program).
      *   *Stance:* Fits Clause (B). He is indifferent to a moral harm.
      *   *Result:* **Intentional.** (Matches your verdict).

  2.  **Helpful Chairman (Not Intentional):**
      *   *Certainty:* Yes.
      *   *Avoidability:* Yes.
      *   *Stance:* Fails Clause (A) (no delight) and Fails Clause (B) (benefit, not harm). Indifference to help is not sufficient.
      *   *Result:* **Not Intentional.** (Matches your verdict).

  3.  **Delighted Manager (Intentional):**
      *   *Certainty:* Yes (incidental but foreseen).
      *   *Avoidability:* Yes (could have chosen a different project).
      *   *Stance:* Fits Clause (A). She is delighted and highlights it (endorsement). This overrides the default rule that side-effect benefits are unintentional.
      *   *Result:* **Intentional.** (Matches your verdict and resolves your tension with Case 2).

  4.  **Texting Driver (Not Intentional):**
      *   *Certainty:* **No.** Killing a cyclist is a *risk*, not a virtual certainty, even if the norm violation is knowing.
      *   *Stance:* Irrelevant, as Condition 1 fails.
      *   *Result:* **Not Intentional.** (Matches your verdict; distinguishes recklessness from intention).

  5.  **Demolition Crew (Not Intentional):**
      *   *Certainty:* Yes.
      *   *Avoidability:* **No.** You specified the collapse "unavoidably cracks" the windows. This implies physical necessity given the task; there was no alternative method to achieve the collapse without the cracks.
      *   *Stance:* Irrelevant, as Condition 2 fails.
      *   *Result:* **Not Intentional.** (Matches your verdict; distinguishes physical byproducts from policy trade-offs).

  ---

  ### The New Case: The Anguished Executive

  **The Case:** An executive foresees environmental harm, proceeds anyway, but is privately anguished about it and pays for offsets out of his own pocket.

  **Application of the Principle:**
  1.  **Certainty:** Yes (foresees the harm).
  2.  **Avoidability:** Yes (could have halted the program).
  3.  **Constitutive Stance:**
      *   *Clause (A) Endorsement?* **No.** He is anguished and pays to mitigate it. He does not welcome the harm.
      *   *Clause (B) Normative Indifference?* **No.** He is not indifferent; he is "privately anguished."

  **Prediction:**
  According to the Principle of Constitutive Stance, the executive does **not** harm the environment intentionally.

  **Reasoning:**
  Your verdict on the Harmful Chairman (Case 1) hinged on the phrase "caring nothing about the environment." That indifference was the specific attitudinal component that transformed a foreseen certainty into an intentional act under Clause (B). By introducing anguish and offsetting behavior, you have removed the *indifference*. Since he also lacks *endorsement* (Clause A), the side-effect remains a foreseen but unintentional consequence of his pursuit of profit.

  ### Philosophical Cost
  To maintain this principle and fit all five of your verdicts, you must accept one controversial philosophical claim: **Moral valence affects intentionality.**

  Standard philosophical orthodoxy (the "Simple View") holds that intentionality is a purely psychological state independent of moral goodness or badness. Your verdicts (specifically the asymmetry between the Harmful and Helpful Chairmen) reject the Simple View in favor of the **Knobe Effect**. You are positing that our concept of "intentional" is partly normative: we are more willing to say someone *intended* a bad side-effect than a good one, unless they actively *endorse* the good one.

  If you are willing to accept that moral judgment shapes the attribution of intention, this principle holds your five verdicts together coherently. If you demand a morally neutral definition of intention, you would have to abandon either the Harmful Chairman verdict or the Helpful Chairman verdict to achieve consistency. Given your prompt, you seem committed to keeping both, so the Principle of Constitutive Stance is your best fit.
