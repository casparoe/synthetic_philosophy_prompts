answer: |-
  Yes, Good's theorem **fails** for a risk-weighted expected utility (REU) agent. An agent following Buchak's REU theory can rationally decline costless information, and in some cases, would even pay to avoid it.

  This is a well-known result in the literature on generalized expected utility (discussed by Buchak, Steele, Thoma, and others). Below is the breakdown of why the proof fails, the mechanism behind the negative value of information, and an assessment of whether this is a theoretical bug or a feature.

  ### 1. Where the Standard Proof Breaks Down

  To see exactly what goes wrong, we must look at the step in Good's theorem that relies on the **Independence Axiom** (or linearity of expectation).

  **The EU Proof:**
  Let $a^*$ be the optimal act without information. Let $\{E_j\}$ be a partition of states (the possible signals). Let $a_j^*$ be the optimal act conditional on signal $E_j$.
  The expected utility of acquiring information is:
  $$ V_{info} = \sum_j P(E_j) \cdot EU(a_j^* | E_j) $$
  The expected utility of acting without information is:
  $$ V_{blind} = EU(a^*) = \sum_j P(E_j) \cdot EU(a^* | E_j) $$
  Since $a_j^*$ is chosen to maximize utility given $E_j$, we know $EU(a_j^* | E_j) \ge EU(a^* | E_j)$ for every $j$. Therefore, summing these inequalities preserves the direction:
  $$ \sum_j P(E_j) EU(a_j^* | E_j) \ge \sum_j P(E_j) EU(a^* | E_j) $$
  Thus, $V_{info} \ge V_{blind}$.

  **The REU Breakdown:**
  In REU theory, the value of a gamble is not the probability-weighted sum of the values of its sub-gambles. The REU functional is non-linear in probabilities.
  Let $f_{info}$ be the "strategy act" that performs $a_j^*$ if signal $E_j$ occurs.
  The REU value of acquiring information is **not**:
  $$ \sum_j P(E_j) \cdot REU(a_j^* | E_j) \quad \text{(This is false in REU)} $$
  Instead, the agent must evaluate the **global distribution of outcomes** generated by the strategy $f_{info}$. Let $D_{info}$ be the probability distribution over final outcomes induced by the strategy, and $D_{blind}$ be the distribution induced by act $a^*$.
  $$ V_{info} = REU(D_{info}) $$
  $$ V_{blind} = REU(D_{blind}) $$

  **The Fatal Step:**
  In EU, $EU(D_{info}) = \sum P(E_j) EU(D_j)$. This linearity allows us to compare the conditional optima term-by-term.
  In REU, $REU(D_{info}) \neq \sum P(E_j) REU(D_j)$. Because the risk function $r(\cdot)$ transforms cumulative probabilities non-linearly, you cannot establish the inequality by comparing conditional choices locally. The risk weighting applies to the *aggregate* cumulative probabilities of the final outcomes.

  It is mathematically possible that while $a_j^*$ is locally optimal for every signal $E_j$, the **global risk profile** of the combined strategy $f_{info}$ is penalized more heavily by the risk function $r$ than the profile of the blind act $a^*$.

  ### 2. Intuitive Mechanism: Why Information Can Hurt

  Why would a global risk profile get worse with information? Information resolves uncertainty, which usually reduces risk. However, in REU, "risk" is not just variance; it is determined by the **ranking of outcomes** and the **weighting of cumulative probabilities**.

  Information can fragment a "favorable" probability mass into smaller chunks that receive lower risk weights.

  **A Conceptual Example:**
  Imagine a risk-averse REU agent (convex risk function $r$).
  *   **Blind Act:** Yields \$100 with probability 0.5 and \$0 with probability 0.5.
      *   The agent evaluates this using $r(0.5)$.
  *   **Information:** A signal arrives that correlates with the outcome.
      *   If Signal 1 (prob 0.5), the agent learns the chance of \$100 is now 0.9. She chooses a risky act to capitalize on this.
      *   If Signal 2 (prob 0.5), the agent learns the chance of \$100 is now 0.1. She chooses a safe act to protect against loss.

  The problem arises in the **ex-ante evaluation**. The agent evaluates the strategy *before* seeing the signal. The strategy creates a compound distribution. Due to the non-linearity of $r$, the risk weight assigned to the "middle" outcomes in the blind act might be more favorable than the weighted sum of the risk weights in the conditional acts.

  Specifically, information can turn a single "moderate risk" gamble into a lottery over "high risk" and "low risk" gambles. For a sufficiently risk-averse REU agent, the disutility of the potential "high risk" branch (even if it offers higher returns) can outweigh the utility of the flexibility, because the risk function penalizes the drop in cumulative probability more severely than EU does.

  In short: **Information forces contingency.** Contingency changes the cumulative probability structure of the final outcome distribution. If the new structure aligns poorly with the agent's risk function $r$, the REU value drops.

  ### 3. Normative Assessment: Bug or Feature?

  Is the refusal of free information a fatal flaw in REU theory, or a defensible consequence?

  #### The Case for "Bug" (The Standard Critique)
  From the perspective of instrumental rationality, refusing free information is costly.
  1.  **Money Pumps:** If an agent refuses free information that would lead to higher monetary expectation, they can be outperformed by an EU agent in the long run.
  2.  **Dynamic Inconsistency:** Critics argue this reveals a form of dynamic inconsistency. The agent prefers Act A ex-ante. If they could pre-commit to ignoring the signal, they would. But if they acquire the signal, their local preferences shift (due to the change in probability weights), leading them to choose a strategy that is ex-ante inferior. This looks like a failure of self-governance.
  3.  **Truth-Seeking:** Standard epistemology suggests evidence is inherently valuable. A normative theory that prescribes ignorance is counter-intuitive.

  #### The Case for "Feature" (The Buchak/REU Defense)
  Buchak and proponents argue that refusing information is **consistent** with the global risk attitude REU is designed to model.
  1.  **Ex-Ante Risk Profiles:** The REU agent cares about the risk structure of the gamble *as a whole*. Information changes the gamble. It transforms a single gamble into a compound gamble with a different risk profile. If the agent dislikes that new profile (e.g., it introduces "risk of regret" or fragments probability masses in a way $r$ penalizes), refusing it is rational *relative to their preferences*.
  2.  **Not Dynamic Inconsistency:** Buchak argues the agent is not dynamically inconsistent if they evaluate the choice "Take Info vs. Don't Take Info" as a single decision node ex-ante. If $REU(\text{No Info}) > REU(\text{Info})$, choosing "No Info" is the consistent maximization of their REU functional. The "inconsistency" only appears if you demand that conditional preferences (after seeing the signal) must align with ex-ante preferences in a way that violates the Sure Thing Principle—but REU *rejects* the Sure Thing Principle by design.
  3.  **Risk as a Value:** In EU, risk is merely a description of probability. In REU, risk attitude is a substantive value (like a preference for equality or security). Just as an egalitarian might refuse a policy that increases total wealth but increases inequality, an REU agent might refuse information that increases expected utility but worsens the "risk distribution."

  ### Conclusion

  Good's theorem fails in REU theory because the **linearity of expectation** is replaced by a **non-linear risk function**. The value of a strategy involving information cannot be decomposed into the weighted sum of its conditional parts.

  Whether this is a cost or a defense depends on your meta-ethical view of rationality:
  *   If rationality is **instrumental efficiency** (maximizing objective goods like money or welfare), it is a **cost**. The agent is leaving utility on the table.
  *   If rationality is **preference consistency** (maximizing one's own coherent valuation of gambles), it is a **feature**. The agent is faithfully respecting their global risk attitude, which values the *structure* of uncertainty, not just its resolution.

  Most decision theorists view the negative value of information as a significant **theoretical cost**, as it limits the prescriptive power of the theory (it's hard to advise someone to remain ignorant). However, Buchak maintains it is the necessary price of accommodating Allais preferences without abandoning the idea that risk attitude is a rational component of choice distinct from belief and utility.
