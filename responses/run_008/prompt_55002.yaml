prompt: |-
  I'm a senior editor at a popular history magazine and our line editors keep having to referee pieces built around non-human causes — a plague that "redrew the map of Europe," a drought behind a revolution, a volcanic winter that topples a dynasty. Some of these pieces are great, others quietly become "the germs did it" storytelling where nobody in the past actually makes a decision. My editors aren't historians and get about half an hour per draft, so vibes-based pushback isn't cutting it.

  Write me a procedure they can actually run on a draft: the questions to ask in order (I'm imagining stuff like: is the volcano doing the causal work or just setting the price of grain?, would the writer make the same claim if a human agent were substituted in?), what counts as a sufficient answer at each step, where the procedure terminates in a "rewrite this paragraph," and where it has to kick the draft back to me because the real issue is a value judgment about which story of the past we're telling, not a factual one. Be honest about the known failure modes — e.g. that the procedure will over-flag good environmental history, and what a cheap second-look pass for that looks like.

  Then run it on two drafts: one arguing a decade of cold, wet summers after a major eruption pushed a grain-short empire into civil war, and one arguing plague-driven labor scarcity forced elites to rewrite wage law — where the humans are visibly responding rather than being swept along. I'd also like one worked case where the procedure tells the writer to kill the thesis sentence, since that's usually the sentence the whole pitch was sold on and they'll fight us on it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Senior Editor at a history magazine.
      *   **Problem:** Line editors are struggling to referee "non-human cause" history (environmental determinism, disease, geography, etc.). Some pieces are good environmental history; others are lazy "germs did it" determinism that erases human agency.
      *   **Constraint:** Line editors aren't historians and have ~30 mins per draft. "Vibes-based pushback" isn't working.
      *   **Task:** Create a concrete procedure (checklist/questions) for line editors to evaluate these drafts.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Termination points (rewrite paragraph vs. kick back to Senior Editor).
          *   Acknowledge failure modes (over-flagging good env history) + quick fix.
          *   Run the procedure on two specific drafts (Volcano/Civil War vs. Plague/Wage Law).
          *   Include a worked case where the thesis sentence must be killed.
      *   **Tone:** Professional, practical, slightly weary but authoritative (Senior Editor to Senior Editor), honest about limitations.

  2.  **Deconstruct the Core Issue:**
      *   The tension is between *conditions* (environment, disease, climate) and *agency* (human decisions, politics, culture).
      *   Bad history: "The volcano caused the war." (Determinism)
      *   Good history: "The volcano created a crisis that political actors navigated, leading to war." (Interaction)
      *   The procedure needs to distinguish between *context/constraint* and *sole cause*.

  3.  **Drafting the Procedure (The "Non-Human Causality Checklist"):**
      *   *Goal:* Fast, actionable, binary where possible.
      *   *Step 1: The Verb Test.* Who is the subject of the active verbs? If it's "The drought caused," flag it. If it's "Farmers responded to the drought," pass.
      *   *Step 2: The Substitution Test.* Can I swap the non-human factor for a human one without breaking the logic? If "The King caused the war" makes as much sense as "The Volcano caused the war," the volcano is likely just a backdrop.
      *   *Step 3: The Alternative Pathway.* Did humans have a choice? If the text says "They *had* to rebel," that's determinism. If it says "They *chose* to rebel because...", that's agency.
      *   *Step 4: The Mechanism.* Is there a social/political mechanism linking the event to the outcome? (e.g., Price of grain $\to$ Unrest $\to$ Policy Failure $\to$ War). If it skips straight from Event $\to$ Outcome, it's magic.
      *   *Termination Points:*
          *   *Fixable:* Specific paragraphs lack mechanism. (Line edit).
          *   *Kickback:* The entire thesis relies on erasing agency. (Senior Editor decision).
      *   *Failure Mode:* Good environmental history often *looks* deterministic because the constraint was so severe.
      *   *Quick Fix:* Ask the writer to add one paragraph on "contemporary debate" or "alternative responses."

  4.  **Developing the Test Cases:**
      *   *Draft 1 (Volcano/Civil War):* Needs to be the "bad" one (or the one needing thesis death). Let's make it the "Thesis Death" case. It argues the eruption *made* the war inevitable.
      *   *Draft 2 (Plague/Wage Law):* Needs to be the "good" one. Humans responding to scarcity.
      *   *Draft 3 (Thesis Kill):* Wait, the prompt asks for *two* drafts initially, then *one* worked case where the thesis is killed. I should integrate the "Thesis Kill" into one of the two or make it a distinct third example. The prompt says: "Then run it on two drafts... I'd also like one worked case where the procedure tells the writer to kill the thesis sentence." This implies 2 standard runs + 1 specific "Thesis Kill" deep dive. I will structure it as: Procedure -> Run on Draft A (Volcano) -> Run on Draft B (Plague) -> Special Focus: The Thesis Kill (using the Volcano draft as the candidate for this, or a hybrid). Actually, reading closely: "run it on two drafts... I'd also like one worked case where the procedure tells the writer to kill the thesis sentence." I will treat the Volcano draft as the one that triggers the "Kill Thesis" outcome to save space and increase impact, or create a specific "Thesis Kill" section using a variation of the Volcano draft. Let's make the Volcano draft the one that requires the thesis kill, as that fits the "germs/volcano did it" trope best. The Plague draft will be the "Pass with Edits" example.
      *   *Correction:* To be most helpful, I should show a "Pass/Rewrite" scenario and a "Kickback/Thesis Kill" scenario.
      *   *Decision:*
          *   Draft 1 (Volcano): The "Thesis Kill" candidate.
          *   Draft 2 (Plague): The "Good Environmental History" candidate (Pass with minor edits).
          *   This covers all bases.

  5.  **Refining the Procedure (Iterative Polish):**
      *   Make it look like a memo or a style guide attachment.
      *   Ensure the "30-minute" constraint is respected. The questions must be skimmable.
      *   *Crucial Addition:* The "Human Substitution Test" is the strongest heuristic. If "The King" can replace "The Plague" and the sentence still works, the sentence is vague. If "The King" *cannot* replace "The Plague" but the outcome is the same, the Plague is a condition, not a cause.
      *   *Wait, let's refine the Substitution Test:* If I swap "The Plague" with "The King's Greed," does the logic hold? If yes, the Plague is irrelevant. If no, the Plague matters. But if the sentence is "The Plague forced the King to...", swapping to "The King's Greed forced the King to..." is nonsense. So the test is: *Does the non-human factor remove the need for a human decision?*

  6.  **Drafting the Content:**
      *   *Header:* Internal Memo.
      *   *Section 1:* The Protocol (The "Agency Audit").
      *   *Section 2:* Failure Modes (The "Malthusian Trap" false positive).
      *   *Section 3:* Run-throughs.
      *   *Section 4:* The Thesis Kill (Deep dive on the Volcano draft).

  7.  **Review against Constraints:**
      *   *Honest about failure modes?* Yes, need to acknowledge that sometimes constraints *are* so tight agency is minimal (e.g., total crop failure), but the *story* is still about how people processed that.
      *   *30 mins?* The checklist needs to be short. 5 questions max.
      *   *Tone:* Collegial, experienced, no-nonsense.

  8.  **Final Polish of the "Thesis Kill" Logic:**
      *   Why kill a thesis? Because it claims *inevitability*. "X caused Y" vs "X created the conditions for Y, which Z actors exploited."
      *   The specific sentence to kill is usually the one that says "Ultimately, it was the [Non-Human Factor] that decided..."
      *   I need to show *why* the line editor can't fix this themselves (it changes the argument, not just the prose).

  9.  **Constructing the Output:** (Self-Correction during drafting)
      *   Make sure the distinction between "Line Edit" and "Senior Editor Kickback" is clear. Line editors fix prose; Senior Editors fix arguments.
      *   Ensure the "Plague" example clearly shows humans *responding* (legislation, negotiation) rather than just dying.

  10. **Final Review:** Does this meet the "Senior Editor to Senior Editor" vibe? Yes. It acknowledges the political/philosophical weight of history writing.

  *(Self-Correction on the "Two Drafts + One Worked Case" instruction)*: The prompt says "run it on two drafts... I'd also like one worked case where the procedure tells the writer to kill the thesis sentence." This could mean 2 drafts total, one of which is the thesis kill. Or 2 drafts + 1 extra. To be efficient and punchy, I will use the two drafts requested, and designate one of them as the "Thesis Kill" case in the analysis. I will explicitly label them.
  *Actually, reading again:* "Then run it on two drafts... I'd also like one worked case where the procedure tells the writer to kill the thesis sentence."
  Okay, I will present Draft 1 (Volcano) and Draft 2 (Plague). I will ensure Draft 1 is the one that triggers the "Thesis Kill" protocol. That satisfies "run on two" and "include one thesis kill case."

  Let's refine the "Procedure" to be very sharp.
  1. The Subject/Verb Check.
  2. The "Could They Have Done Otherwise?" Test.
  3. The Mechanism Link.
  4. The Stakes (Who wins/loses?).

  Okay, ready to write.
answer: |-
  **INTERNAL MEMO**
  **TO:** Line Editing Team
  **FROM:** Senior Editor
  **SUBJECT:** Protocol for Non-Human Causality (The "Agency Audit")

  We are seeing a spike in drafts where climate, disease, or geography are doing too much heavy lifting. When a volcano "topples a dynasty," we risk erasing the humans who actually did the toppling. This isn't just stylistic; it's a philosophical stance on history that we need to vet consciously.

  You have 30 minutes. You are not historians. Do not fact-check the eruption date. Check the *causal logic*. Use the following four-step procedure.

  ### THE PROCEDURE: "THE AGENCY AUDIT"

  **Step 1: The Subject/Verb Check (2 Minutes)**
  Scan the topic sentences of the body paragraphs. Highlight the subject of the main active verb.
  *   **Pass:** Humans, institutions, or groups (e.g., "The Council voted," "Peasants fled," "The Emperor taxed").
  *   **Flag:** Non-human forces acting alone (e.g., "The drought caused," "The plague forced," "The climate decided").
  *   **Action:** If flagged, move to Step 2.

  **Step 2: The "Could They Have Done Otherwise?" Test (5 Minutes)**
  Find the specific claim where the non-human factor triggers the human outcome. Ask: *Does the text acknowledge that the humans had a choice, even if it was a bad one?*
  *   **Sufficient Answer:** The text explains *why* the humans chose the path they did (e.g., "Faced with famine, the Emperor *chose* to seize grain stores rather than open trade, sparking revolt").
  *   **Insufficient Answer:** The text implies inevitability (e.g., "The famine left the Emperor no choice but to seize grain").
  *   **Action:** If "inevitability" is implied, insert a comment: *"Specify the political calculation here. Was there an alternative policy that was rejected? If not, why not?"*

  **Step 3: The Mechanism Link (10 Minutes)**
  Trace the chain of events from the Non-Human Event (NHE) to the Human Outcome (HO).
  *   **Bad Chain:** NHE $\to$ HO (e.g., "The eruption caused the civil war.")
  *   **Good Chain:** NHE $\to$ Economic/Social Stress $\to$ Human Decision/Policy Failure $\to$ HO.
  *   **Action:** If the chain skips the "Human Decision" link, highlight the paragraph. Request a rewrite that inserts the political or social mediation.

  **Step 4: The Thesis Stress Test (10 Minutes)**
  Read the lede and the conclusion. Find the sentence that summarizes the main argument.
  *   **Pass:** The argument is about how humans *navigated* a crisis.
  *   **Fail:** The argument is that the crisis *determined* the outcome.
  *   **Action:**
      *   If the rest of the draft is good but the thesis is deterministic: **Kick to Senior Editor.** This is a structural argument change, not a line edit.
      *   If the draft is deterministic throughout: **Kick to Senior Editor.**
      *   If only specific paragraphs are deterministic: **Line Edit** using Step 2 & 3 instructions.

  ***

  ### KNOWN FAILURE MODES (The "Malthusian Trap")

  **The False Positive:** Sometimes, constraints *are* total. If a region experiences 100% crop failure for five years, people *will* starve or move. Agency is minimal.
  *   **The Smell Test:** Does the piece discuss *who* starved and *who* ate? If yes, it's good history (distribution is political). If it just says "people starved," it's bad history.
  *   **The Quick Fix:** If you flag a piece and the writer pushes back saying "There was no choice," ask them to add one paragraph on **differential impact**. Even in a famine, some people get fat. Who were they? What did they decide? If the writer cannot answer this, the piece is deterministic propaganda, not history.

  ***

  ### RUN-THROUGH: DRAFT A (The Volcano/Civil War)
  **Pitch:** A decade of cold, wet summers following the 536 CE eruption pushed the grain-short Byzantine Empire into civil war.
  **Time Elapsed:** 25 Minutes

  **Step 1: Subject/Verb Check**
  *   *Flagged:* "The ash cloud crippled agriculture." (Passable context).
  *   *Flagged:* "The cold weather destabilized the frontier." (Who does the destabilizing? The Goths? The Army?)
  *   *Flagged:* "Ultimately, the climate toppled Justinian's regime." (Major Flag).

  **Step 2: "Could They Have Done Otherwise?"**
  *   *Text:* "With grain supplies gone, the generals had no choice but to revolt."
  *   *Critique:* Generals always have a choice. They could have remained loyal and starved. They could have negotiated. The text treats rebellion as a physical reflex to hunger, not a political gamble.
  *   *Edit Note:* "Rewrite to show the generals' calculation. Did they revolt because they were hungry, or because they knew the Emperor couldn't pay them?"

  **Step 3: Mechanism Link**
  *   *Current Chain:* Eruption $\to$ Cold $\to$ Hunger $\to$ Civil War.
  *   *Missing Link:* How did hunger become war? Did the Emperor try to tax the hungry? Did he blame a minority group?
  *   *Edit Note:* "Insert the policy failure. The cold didn't fire the arrows; the tax collector did."

  **Step 4: Thesis Stress Test**
  *   *Thesis Sentence:* "While political intrigue played a role, it was the volcanic winter that truly ended the dynasty."
  *   *Analysis:* This sentence sells the pitch. It promises "Nature did it." The evidence in the draft, however, shows generals making moves. The thesis contradicts the evidence.
  *   **DECISION: KICK TO SENIOR EDITOR.**
  *   *Reasoning:* I cannot line-edit this. To fix the prose, I have to change the argument from "Climate Determinism" to "Climate as Catalyst." That changes the sell of the piece. The writer will fight this because it undermines their hook. You need to decide if we want to publish a piece that argues "Humans still matter" instead of "Nature is scary."

  ***

  ### RUN-THROUGH: DRAFT B (The Plague/Wage Law)
  **Pitch:** Plague-driven labor scarcity forced elites to rewrite wage law in 14th-century England.
  **Time Elapsed:** 20 Minutes

  **Step 1: Subject/Verb Check**
  *   *Pass:* "Surviving laborers demanded higher pay."
  *   *Pass:* "Parliament passed the Statute of Laborers."
  *   *Pass:* "Landlords lobbied the King."
  *   *Note:* The non-human factor (Plague) is present, but humans are the subjects of the verbs.

  **Step 2: "Could They Have Done Otherwise?"**
  *   *Text:* "Although the plague reduced the workforce, the Crown attempted to freeze wages to protect landlord interests."
  *   *Critique:* Explicitly acknowledges a choice (freezing wages) that was not economically inevitable.
  *   *Verdict:* Pass.

  **Step 3: Mechanism Link**
  *   *Chain:* Plague $\to$ Labor Scarcity $\to$ Worker Leverage $\to$ Elite Legislation $\to$ Social Unrest.
  *   *Critique:* The link is clear. The plague created the *condition* (scarcity), but the *cause* of the legal change was the elite response to that condition.
  *   *Verdict:* Pass.

  **Step 4: Thesis Stress Test**
  *   *Thesis Sentence:* "The Black Death did not liberate the peasantry; it forced the elite to codify their oppression through new laws."
  *   *Analysis:* This attributes agency to the elite. The plague is the context, not the actor.
  *   **DECISION: PASS WITH MINOR EDITS.**
  *   *Action:* There is one paragraph on page 4 that says "The disease swept away the old order." Change to "The disease created a crisis that swept away the old order." (Restores agency).

  ***

  ### WORKED CASE: KILLING THE THESIS SENTENCE
  **Context:** This is the specific scenario from Draft A (Volcano) where the procedure terminates at Step 4. This is the hardest conversation you will have.

  **The Sentence:**
  > *"In the end, the emperors were merely passengers; it was the ash in the stratosphere that steered the ship of state into the rocks."*

  **Why It Must Die:**
  1.  **It's Factually Dubious:** Emperors made specific budgetary and military decisions during the crisis. Some regions with the same ashfall did *not* have civil wars.
  2.  **It's Ethically Evasive:** If "the ash" caused the war, no one is responsible for the violence that followed. It absolves historical actors of cruelty.
  3.  **It Breaks the Magazine's Mission:** We publish history about human choices, not weather reports.

  **The Conversation (Script for Senior Editor):**
  *"I love the environmental angle. It's fresh. But this sentence sells a deterministic argument that your own evidence contradicts. Your draft shows generals choosing rebellion and emperors choosing tax hikes. If you keep this sentence, you are telling the reader to ignore the humans you just spent 3,000 words describing.*

  *We can't publish the 'ash steered the ship' line. You have two options:*
  1.  *Reframe the thesis: 'The ash created a crisis that exposed the regime's fragility.' (Humans remain the agents of the crash).*
  2.  *If you want to argue determinism, you need to prove that no other outcome was possible. That requires a comparative analysis of other volcanic events that didn't lead to war. Do you have that?*

  *If not, we cut the sentence. I know this was your hook. But a hook that snaps the spine of the argument isn't a hook; it's a liability."*

  **Why the Line Editor Can't Do This:**
  A line editor can change "steered" to "damaged." They cannot change the philosophical stance of the article without rewriting the argument. If a line editor attempts this, the writer will appeal to you, claiming the editor "didn't get the point." The point is exactly what needs to be negotiated.

  **Final Note to Team:**
  If you kick a draft to me with the tag **"Agency Audit Failed,"** I will know you've done the work. I'd rather we fight about the thesis in my office than publish a piece where nobody is responsible for anything.
