prompt: |-
  At a recent retrospective for a stalled platform migration — two years in, several million spent, the deadline slipped three times — our consultant argued for pressing on, on the grounds that continuing would be keeping a promise to our past selves. On her telling, the team that committed in year one paid a real price on the understanding that the work would be finished; abandoning it now would be like defaulting on a debt, and so honoring sunk costs is simply promise-keeping in the special case where the promisee is ourselves, earlier. Our engineering director waved this off as sentimentality: the money is gone either way, and a sunk cost is like water already under the bridge — fit for grief, not for decision.

  I would like you to audit the consultant's analogy rather than the director's slogan. Please proceed as follows:

  1. Set out the correspondence table explicitly: within the promise framing, what plays the role of promiser and promisee, of consideration, of the expectation created, of performance, of breach, and of the sanction or standing complaint that ordinarily backs a promise?

  2. Identify where the mapping breaks, and then sort the disanalogies: which ones actually matter for the consultant's conclusion (for instance, whether a party with no further interests or expectations can be a promisee, whether release from a promise requires the promisee's consent, and who could ever release us from this one) and which are merely differences of detail that she is entitled to stipulate away.

  3. Ask what the analogy quietly imports. In particular: does it presuppose that the past selves' expectations can bind us through later evidence they did not have, and does it conflate two different rational roles the past choice might play — a commitment whose authority survives new information versus mere evidence about value, on the model of a second opinion from someone who knew our constraints well but knows nothing of what we have since learned?

  4. Test the framing on cases: a marathon runner at mile eighteen who trained for a year; a reader four hundred pages into a trilogy she has soured on; a couple staying together because of the decades already invested; and our own migration, supposing a competitor has just shipped a product that achieves our project's entire purpose. Which verdicts does the promise framing get right, and where does it misfire relative to a simple preference-for-completion account on which finishing things is just one good among others?

  5. Say whether the conclusion the analogy was used to support — that we owe continuation — survives once the disanalogies are on the table. If it does not, consider whether a better analogy (sunk costs as a signal of reliability to collaborators whose future cooperation depends on it, as self-signaling of perseverance, as a burned bridge whose burning carries costs of its own) would support a weaker but defensible version of her position, and note the fallback move she might make: that even if no particular promise exists, it can still be rational to cultivate a general disposition to finish what one starts, and to act on that disposition even when, considered case by case, it loses. Finally, indicate where the director's dismissal is too quick: in what respects, if any, can honoring sunk costs be rational even though the promise framing fails?

  Please write in American English, and keep the treatment rigorous — I care about where each disanalogy does and does not bite, not about a general sermon against sunk costs.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Auditing a consultant's analogy regarding sunk costs in a stalled platform migration.
      *   **Consultant's Argument:** Continuing the project is "promise-keeping" to past selves. Abandoning it is defaulting on a debt to the team that started it. Sunk costs = promise-keeping to earlier selves.
      *   **Director's Counter:** Sunk costs are gone (water under the bridge); sentimentality shouldn't drive decisions.
      *   **Task:** Audit the *consultant's analogy* (not the director's slogan).
      *   **Required Steps:**
          1.  Set out the correspondence table (promiser, promisee, consideration, etc.).
          2.  Identify where the mapping breaks (sort disanalogies into "matters for conclusion" vs. "detail").
          3.  Ask what the analogy quietly imports (binding past expectations vs. evidence of value).
          4.  Test on cases (marathon, reader, couple, competitor shipping).
          5.  Evaluate the conclusion (does "we owe continuation" survive?); propose better analogies (signaling, disposition); note where the director is too quick.
      *   **Tone/Style:** American English, rigorous, focused on where disanalogies bite, no general sermons.

  2.  **Step 1: Correspondence Table:**
      *   *Promiser:* Current self/organization.
      *   *Promisee:* Past self/organization (Year One team).
      *   *Consideration:* The effort/sacrifice already expended (the "price paid").
      *   *Expectation Created:* The project would be finished.
      *   *Performance:* Completing the migration.
      *   *Breach:* Abandoning the migration.
      *   *Sanction/Standing Complaint:* Guilt, loss of self-trust, internal incoherence (since the promisee is the same entity).

  3.  **Step 2: Mapping Breaks & Disanalogies:**
      *   *Break 1: Identity.* Promiser and Promisee are numerically identical (or organizationally continuous). In standard contract law, distinct parties are required for enforcement.
      *   *Break 2: Consideration.* Consideration usually moves *from* the promisee *to* the promiser to induce the promise. Here, the "consideration" (sunk cost) was spent *before* or *during* the commitment, often to a third party (vendor), not to the future self.
      *   *Break 3: Release.* In contracts, a promisee can release a promiser. Can "Past Self" release "Current Self"? Past Self no longer exists to grant release.
      *   *Break 4: Information Asymmetry.* Past Self made the promise without knowledge of current obstacles (the slippage, the competitor).
      *   *Sorting:*
          *   *Matters:* Identity/Release (who can forgive the debt?), Information Asymmetry (can a promise bind without knowledge of changed circumstances?).
          *   *Detail:* Specific legal formalities (written vs. verbal).

  4.  **Step 3: Quiet Imports:**
      *   *Binding Expectations:* Does the analogy assume Past Self's expectations have normative authority over Current Self despite new info? This is the core philosophical tension (Ulysses pacts vs. rational updating).
      *   *Conflation:* It conflates *Commitment* (I will do X regardless) with *Prediction* (I expect X to happen). The consultant treats the past expenditure as a down-payment on a binding contract, but it might just be evidence of past valuation which is now outdated.

  5.  **Step 4: Case Testing:**
      *   *Marathon (Mile 18):* Promise framing works well here. Injury risk is known/managed. Finishing validates the training.
      *   *Reader (400 pages in):* Promise framing weak. No harm to past self if you stop. Enjoyment is the goal, not completion.
      *   *Couple (Decades invested):* Promise framing strong (vows), but sunk cost fallacy often lurks here. Is it the *time* or the *vows*? If the relationship is toxic, the "promise" might be voided by breach of care.
      *   *Migration (Competitor ships):* Promise framing fails. The *purpose* of the promise is defeated. A promise to build a bridge is void if the river dries up (frustration of purpose).
      *   *Preference-for-Completion:* The promise frame adds a *duty*, whereas preference-for-completion adds a *utility value*. The promise frame demands continuation even if utility is negative (unless excused).

  6.  **Step 5: Conclusion & Fallback:**
      *   *Does "We owe continuation" survive?* No, not as a strict debt. The "Past Self" cannot hold the "Current Self" to a contract made under false pretenses (regarding feasibility/value).
      *   *Better Analogies:*
          *   *Signaling:* Continuing signals reliability to *future* stakeholders (investors, employees).
          *   *Disposition:* Cultivating a "finisher" trait.
      *   *Director's Dismissal:* Too quick because ignoring the *signal* cost of quitting can be expensive. It's not about the money spent (sunk), it's about the reputation for execution (future value). Also, organizational morale (psychological sunk cost) is real, even if financial sunk cost isn't.

  7.  **Drafting - Section by Section (incorporating constraints):**
      *   *Tone Check:* Rigorous, analytical, American English.
      *   *Constraint Check:* Ensure I don't just bash sunk costs but analyze the *promise analogy*.
      *   *Refinement on Step 2:* Be precise about "Consideration." In contract law, past consideration is no consideration. This is a fatal legal flaw in the analogy.
      *   *Refinement on Step 3:* Focus on "Frustration of Purpose."
      *   *Refinement on Step 5:* Distinguish between "rational to cultivate a disposition" vs. "rational to follow it in this specific instance."

  8.  **Final Review against Prompt:**
      *   Did I audit the consultant, not the director? Yes.
      *   Is the correspondence table explicit? Yes.
      *   Did I sort disanalogies? Yes.
      *   Did I address the "quiet imports"? Yes.
      *   Did I test the four cases? Yes.
      *   Did I evaluate the conclusion and offer fallbacks? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't conflate the "Past Self" with the "Year One Team." The consultant says "promise to our past selves" but also mentions "the team that committed." I should treat the organization as the continuous entity, with "Past Self" being the organization at T1 and "Current Self" at T3.
  *Correction on Consideration:* The consultant argues the "price paid" *is* the consideration. In law, consideration must be bargained-for exchange. Sunk costs are not bargained-for exchange with the future self; they are expenditures. I need to highlight this "Past Consideration" doctrine.

  *Correction on Release:* If Past Self is gone, they can't release. But if the Organization is continuous, the Board/Leadership (Current Self) represents the Past Self. This implies the Current Self is both Promiser and Promisee. This collapses the obligation into self-regulation.

  *Refining the "Competitor" case:* This is the "Frustration of Purpose" doctrine in contract law. If the objective becomes impossible or pointless through no fault of the promiser, the duty is discharged. This directly counters the consultant.

  *Refining the Director's dismissal:* The director says money is gone. But the *signal* of quitting has future cost. That's where the director is too quick.

