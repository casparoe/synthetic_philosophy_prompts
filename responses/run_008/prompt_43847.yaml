  *   **If Priya prioritizes Taxonomy:** She says *Rickettsia* is **Alive** (because it's a bacterium).
  *   **If Priya prioritizes Metabolic Autonomy:** She says *Rickettsia* is **Not Alive** (because it steals ATP, just like a mitochondrion).

