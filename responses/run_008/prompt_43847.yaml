  Based on Priya's track record, she isn't winging it. She is running a consistent, implicit heuristic that aligns closely with a specific school of thought in the philosophy of biology, likely **Cell Theory combined with Metabolic Potentialism**. She distinguishes life based on **cellular continuity** and the **capacity for autonomy**, rather than current activity or reproductive output.

  Here is the breakdown of her rule, my predictions for your three trap cases, and the specific experiment you need to run next Friday to corner her.

  ### 1. The Underlying Rule: "Cellular Lineage with Reversible Dormancy"

  Priya's verdicts commit her to three non-negotiable criteria:
  1.  **Cellularity:** It must be a cell (or a multicellular aggregate of cells). This rules out viruses, Mimivirus, self-replicating RNA, prions, frost, and flames.
  2.  **Organismal Integrity:** It must be an organism, not a sub-cellular part. This rules out mitochondria (organelles) even if they have DNA/ribosomes.
  3.  **Metabolic Potential:** It does not need to be metabolizing *now*, but it must retain the *capacity* to metabolize and divide if conditions allow. This saves the endospore (dormant but wakeable) but kills the fixed paramecium (structurally intact but metabolically dead forever).

  **What she explicitly rejects:**
  *   **Reproduction as a requirement:** The mule and worker bee are sterile but alive.
  *   **Current Metabolism as a requirement:** The endospore is alive despite zero activity.
  *   **Genetic Material as sufficient:** Viruses and RNA have genes but aren't alive.

  ### 2. Predictions for Your Three Cases

  **Case 1: Rickettsia-type bacteria**
  *   **Prediction:** **Alive.**
  *   **Reasoning:** Despite being an obligate intracellular parasite that steals ATP, *Rickettsia* is taxonomically a bacterium. It has a cell membrane, ribosomes, and divides by fission. Crucially, unlike the mitochondrion (which she called "not alive"), *Rickettsia* is an **invader**, not an **integrated part**. It retains its own cellular boundary and lineage separate from the host. Priya's rejection of the mitochondrion suggests she draws the line at "organelle vs. organism," not "dependent vs. independent."
  *   **Confidence:** **Moderate-High.** (This is the biggest risk point, see below).

  **Case 2: A Prion**
  *   **Prediction:** **Not Alive.**
  *   **Reasoning:** This is the easiest call. Priya already ruled that self-replicating RNA is "not alive." A prion is even less than RNA: it has no genome, no metabolism, and no cellular boundary. It replicates via crystal-like templating (similar to her "frost crystals" verdict). It fails the Cellularity criterion completely.
  *   **Confidence:** **Very High.**

  **Case 3: Fixed Paramecium**
  *   **Prediction:** **Not Alive.**
  *   **Reasoning:** This tests her "Endospore" logic. She saved the endospore because it "never stopped counting" (potential for revival). The fixed paramecium has had that potential permanently destroyed by the preservative. It is a structure, not a system. It fails the Metabolic Potential criterion.
  *   **Confidence:** **Very High.**

  ### 3. The Weak Point: Where the Rule Might Break

  I am **least confident in the Rickettsia prediction**.

