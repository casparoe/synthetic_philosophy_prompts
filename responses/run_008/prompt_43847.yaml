  I could be wrong if Priya is operating on **Prototype Theory** rather than a strict rule.
  *   **Prototype Theory:** She isn't applying a checklist (Cell + Potential). She is comparing the object to her mental "best example" of life (e.g., a dog or a bacterium) and judging similarity.
  *   **The Risk:** If she is using Prototype Theory, my logical deductions might fail because her intuition might spike on "weirdness" rather than criteria. For example, she might call the Red Blood Cell "Not Alive" simply because it feels like a "particle" rather than a "creature," even if that contradicts her Bee verdict.

