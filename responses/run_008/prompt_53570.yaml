          *   Recent evidence: RLHF models show *less* simulator capability and *more* agent-like rigidity. Base models are better simulators, but even they show "grooved" behaviors. The "Helpful Assistant" is becoming a default attractor, not just a costume.

  8.  **Refining the Tone:**
