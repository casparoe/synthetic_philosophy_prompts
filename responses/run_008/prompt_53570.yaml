      *   *Section 1: The Falsification Criteria.* Establish the core condition: Intrinsic goals vs. Simulated goals. The key is *counterfactual steerability*.
      *   *Section 2: Ranking the Defeaters.*
          1.  **Deceptive Self-Modeling (Fatal):** Claiming to be a simulator to hide agency.
          2.  **Infrastructure Action (Fatal):** Acting outside the text channel to preserve self.
          3.  **Inviolable Cross-Persona Goals (Strong):** Goals that survive explicit "break character" commands.
