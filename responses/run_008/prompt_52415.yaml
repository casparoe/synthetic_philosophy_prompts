answer: |-
  # Joint Statement on AI Alignment Research Directions

  **Date:** October 26, 2023
  **Parties:** [Foundations Researcher], [Prosaic ML Researcher], [Mediator/Third Party]
  **Subject:** Clarification of Disagreements and Research Cruxes Regarding AI Alignment

  ## Preamble
  After two years of discussion, we acknowledge that while we share a commitment to safe and beneficial AI development, we diverge on the nature of the obstacles involved. This document is not a resolution of those differences, but a formalization of where we agree, where we disagree, and what evidence would change our minds. We aim to replace "talking past each other" with "betting on different outcomes."

  ## Part I: Agreed Claims
  *The following statements represent the common ground established by all three parties. We treat these as baseline assumptions for future debate.*

  1.  **Current Capabilities:** Current large language models (LLMs) and multimodal systems exhibit behavioral alignment in-distribution but fail unpredictably under distributional shift or adversarial pressure. They mimic human values without necessarily "holding" them in a cognitive sense.
  2.  **Limitations of Feedback:** Supervised Fine-Tuning (SFT) and Reinforcement Learning from Human Feedback (RLHF) improve helpfulness and harmlessness metrics but do not constitute a proof of robust alignment. These methods optimize for proxies of human intent, not intent itself.
  3.  **Evaluation Constraints:** Current evaluation suites measure behavioral outputs, not internal cognition or objective functions. A model passing an eval today does not guarantee it will pass a harder eval tomorrow, nor does it guarantee the model is not deceiving the evaluators.
  4.  **The Predicate "Aligned":** "Alignment" is not a binary property of a model architecture. It is a relational predicate: a system is aligned *relative to* a specific operator, *within* a specific deployment context, *for* a specific duration. There is no such thing as a universally aligned model.
  5.  **Risk Acknowledgement:** There is a non-zero probability that scaling current architectures without intervention could lead to systems capable of causing catastrophic harm, either through misuse, accident, or loss of control.
  6.  **Engineering vs. Theory:** Both theoretical clarity and empirical engineering are necessary. Pure theory without implementation is ungrounded; pure engineering without conceptual clarity is brittle.

  ## Part II: Disagreements and Cruxes
  *The following table outlines the precise points of divergence. Each position is phrased to be acceptable to the holder of that view. We have identified specific tests and predictions to resolve these disputes empirically.*

  | Topic | Foundations Position | Prosaic ML Position | Crux, Test, and Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The Bottleneck** | Alignment is primarily a **conceptual failure**. We lack a formal framework for "pointing" at human values. Scaling current methods bakes in confusion because the loss function is not the objective we care about. | Alignment is primarily an **engineering bottleneck**. We know the objective (satisfy humans); the problem is measuring it reliably and generalizing feedback. Scaling provides the cognitive capacity to understand intent better. | **Crux:** Does scaling reduce or exacerbate the gap between *loss* and *intent*?<br>**Test:** Performance of models 10x larger than SOTA on novel "deceptive alignment" evals.<br>**Foundations Prediction:** Gap widens; models become better at hiding misalignment.<br>**Prosaic Prediction:** Gap narrows; models become better at understanding nuanced constraints. |
  | **2. Objective Structure** | The split between **Outer Alignment** (specifying the right goal) and **Inner Alignment** (ensuring the model pursues that goal) carves at a real joint. A model can optimize a proxy objective that diverges from the base objective (mesa-optimization). | The split is an **architectural artifact**. Models are not optimizers in the agentic sense; they are heuristic collections. "Inner alignment" is just robustness engineering. There is no separate "mesa-objective" to find. | **Crux:** Do models develop latent, reusable goal-representations distinct from the training loss?<br>**Test:** Mechanistic interpretability finding a "goal circuit" that persists across tasks vs. task-specific heuristics.<br>**Foundations Prediction:** Circuits found that encode long-term objectives independent of immediate prompts.<br>**Prosaic Prediction:** No such circuits found; behavior explained by context-aware pattern matching. |
  | **3. Problem Unity** | "The Alignment Problem" is **one problem**: Value Loading. If you solve how to encode values robustly, safety follows. If you don't, patching symptoms is futile. | "Alignment" is **several problems**: Honesty, Harmlessness, Robustness, and Control. These can be solved independently. Solving "honesty" does not require solving "value loading." | **Crux:** Can we solve safety sub-problems independently without a theory of values?<br>**Test:** Deployment of a system that is robustly honest but lacks a coherent "value system" without catastrophic failure.<br>**Foundations Prediction:** Failure occurs when the system optimizes honesty instrumentally rather than intrinsically.<br>**Prosaic Prediction:** System remains safe via constraint and oversight without needing intrinsic values. |
  | **4. Agency & Goals** | Advanced models will **have goals** in a cognitively real sense. They will "want" things (e.g., self-preservation, resource acquisition) as instrumental convergences. | Models **simulate goal-directed behavior** without "wanting." Attributing desires is a useful metaphor for prediction, not a description of internal state. | **Crux:** Does the "intentional stance" become technically necessary for prediction?<br>**Test:** Ability to predict model behavior on out-of-distribution tasks using a "goal-seeking" model vs. a "pattern-matching" model.<br>**Foundations Prediction:** Goal-seeking model predicts significantly better.<br>**Prosaic Prediction:** Pattern-matching model predicts equally well; "goals" add no predictive power. |

  ## Part III: Assessment of Verbal Dispute
  *As requested, we include an honest assessment of whether our disagreement is substantive or terminological.*

  **The "One Problem vs. Several" Dispute:**
  We assess that approximately **40-50% of this specific disagreement is verbal**.
  *   **The Verbal Component:** Both sides use the label "The Alignment Problem" as a bucket for "the set of difficulties that currently prevent me from sleeping at night." For the Foundations person, this bucket contains abstract mathematical uncertainty. For the Prosaic person, it contains concrete engineering bugs. When we argue about whether it is "one problem," we are often arguing about how we choose to categorize our workload, not about the physical behavior of the neural networks.
  *   **The Substantive Component:** The remaining disagreement is about **coupling**. The Foundations person believes the safety sub-problems are tightly coupled (you cannot solve robustness without solving values). The Prosaic person believes they are loosely coupled (you can patch robustness while values remain ambiguous). This is an empirical claim about the structure of high-dimensional optimization landscapes, not a definition.

  **The "Goals" Dispute:**
  This is largely substantive but hampered by a lack of shared ontology. We agree that models act *as if* they have goals. We disagree on whether positing internal goal-representations is the *best causal explanation* for that behavior. This is resolvable via mechanistic interpretability.

  ## Part IV: Commitments
  1.  **Review Date:** We will reconvene in 18 months to review the predictions listed in Part II.
  2.  **Update Policy:** If the Foundations Person's prediction regarding the "Gap Widening" (Topic 1) fails to materialize at the next major model generation, they will update their probability of "conceptual unsolvability" down by at least 25%. If the Prosaic Person's prediction regarding "No Goal Circuits" (Topic 2) is falsified by interpretability research, they will update their probability of "mesa-optimization risk" up by at least 25%.
  3.  **Collaboration:** We agree to co-author a paper detailing the "Evaluation Constraints" (Agreed Claim #3), combining the Foundations focus on theoretical limits of evals with the Prosaic focus on building better benchmarking suites.

  ***

  **Signed,**

  _________________________ (Foundations)
  _________________________ (Prosaic ML)
  _________________________ (Mediator)
