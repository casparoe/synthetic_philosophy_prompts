          *   *The Limit Stage:* In the proof of ZL (via well-ordering/ordinals), you define a function by transfinite recursion. At limit $\lambda$, you need an upper bound for $\{x_\alpha \mid \alpha < \lambda\}$. ZL *hypothesis* gives you this. The *Choice* is needed to pick *which* upper bound (if not unique) and to pick the *next* element strictly above the bound if not maximal.
          *   *Replacement:* Transfinite recursion requires Replacement to ensure the sequence doesn't become a proper class before stopping. This is technical but relevant.
          *   *Advice:* The $\omega$-chain example is good for showing "finite induction isn't enough." But be careful: ZL *assumes* the chain has a bound. The failure of the "climb" intuition is that you can't guarantee the process *stops* without ordinals.
          *   *Replacement:* Mention it as a "deep cut" for the set theorists in the room, but don't let it derail the main philosophical point. It shows ZL is heavier than it looks.

      *   **Pedagogy Section:**
