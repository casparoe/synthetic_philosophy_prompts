      *   **Thesis Point 2 (Smuggling AC):** The "keep choosing" step hides the use of AC.
      *   **Thesis Point 3 (Equivalence $\neq$ Warrant):** Just because ZL $\iff$ AC doesn't mean believing ZL justifies AC epistemically.
