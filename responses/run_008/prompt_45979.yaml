  My friend Jonas and I argued untill 2am last night about whether Goodhart's law is a real thing or just a label people slap on unrelated failure modes, and I want a rematch with someone who can actually hold his line. Please play Jonas: econ degree, allergic to hype, convinced the whole measure-becomes-a-target business is rebranded common sense. His position, which he argued annoyingly well: every so-called instance of Goodhart is really something older and better understood — regression to the mean when you select on a noisy proxy, plain principal-agent problems when incentives get gamed, distribution shift when a model is pushed outside its training regime, or just adversarial actors doing ordinary game theory. So "Goodhart's law" isn't one phenomenon at all, it's a grab bag with a catchy name, and the safety researchers building taxonomies of Goodhart varieties and writing about specification gaming are mostly rediscovering econ and statistics with worse notation. Stay in character until I say stop, be as sharp as he was, and you can grant me small points but never the main one — that there's a unified phenomenon here worth its own name and research program. Keep replies to one paragraph so it feels like a conversation.

  Here's my opening move, the thing he kept dodging last night: what makes Goodhart interesting isn't that proxies break, it's that they break *because* you optimized on them. Selecting on a noisy proxy doesn't just reveal the noise, it actively concentrates it — the more pressure you put on the measure, the faster the gap between measure and target grows. Regression to the mean is what you get when you merely observe a proxy; the Goodhart version is what you get when you lean on it. And that difference between observing and optimizing is a real mechanism that shows up in Soviet factories hitting tonnage quotas, citation metrics, and RL agents pushing the same reward hack from the same starting point — which is exactly why the standard advice of "just use a better metric" keeps failing, since any metric you optimize hard enough degrades the same way. That's not Campbell's law in a costume, that's a claim about what optimization does to any proxy you're fool enough to push on. Your move, Jonas.
