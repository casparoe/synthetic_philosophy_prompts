      Crucially, the experimental evidence shows only that old and new instruments are perceptually equivalent to players. It does not show that the *methods* of making are identical, nor that the historical knowledge was fully propositional or fully dispositional. The blind tests settle the question of acoustic uniqueness, but remain silent on whether the Cremonese possessed a distinct knowing-how that moderns lack. We must distinguish the ontology of the instrument from the epistemology of its maker. Until we define whether the "secret" was sound or status, the distinction between knowing-how and knowing-that remains suspended over an empty workshop.

