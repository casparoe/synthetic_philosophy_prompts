answer: |-
  This is a classic problem in game theory (the **Shubik Dollar Auction**, 1971), and your intuition is sharp enough to have stumbled onto a paradox that has puzzled economists for decades. You are right to protect Premise (1)—sunk costs *are* irrelevant in rational decision theory. If you abandon that, you break standard microeconomics.

  However, your roommate is right that Step (3) is where the logic breaks. You don't need to give up sunk cost irrelevance to solve this. You need to give up the assumption that **your bid guarantees a win.**

  Here is exactly where the argument goes off the rails and how to fix it without breaking Decision Theory 101.

  ### The Flaw is in Step (3)
  Your Step (3) says: *"If I bid one dollar instead, I win the dollar, so I come out 10 cents ahead of quitting."*

  This treats the opponent as a passive object rather than a strategic agent. In the Dollar Auction, bidding $1.00 does not grant you the dollar; it grants you the *obligation to pay $1.00* and the *opportunity* to get the dollar **if the other person stops.**

  To calculate the rational choice, you must compare the Expected Value (EV) of Quitting vs. Bidding.

  *   **Option A (Quit):** Payoff = $-0.90$ (Your sunk bid).
  *   **Option B (Bid $1.00):** Payoff = $(P_{win} \times \$1.00) - \$1.00$.

  Your argument assumes $P_{win} = 1$ (100% chance you win if you bid). But if your opponent is also rational, they are running the exact same algorithm you are. If you reason "I must bid to avoid loss," they reason "I must bid to avoid loss."

  If you know your opponent is rational, you must assign a high probability to them **counter-bidding**. If they counter-bid $1.05, your payoff becomes $-1.00$ (you paid $1, got nothing). Now you are worse off than if you had quit at 90 cents.

  Therefore, **Continuing does not always beat Quitting.** It only beats Quitting if you have reason to believe the opponent will fold.

  ### The Game Theory Solution: Backward Induction
  To see why "escalate forever" is not rational, we use **backward induction**. Assume both players have a finite amount of money (say, $5.00 max).

  1.  **At $4.95 vs $5.00:** If I am at $4.95 (second place), should I bid $5.05? No. I don't have the money (or even if I do, the cost exceeds the prize). I will fold.
  2.  **At $4.90 vs $4.95:** Knowing I will fold at the next step (from point 1), should you bid $4.95? No. Because you know I will fold, you can win at $4.90. But wait...
  3.  **Unraveling:** If we both know the game ends at $5.00, rationality unravels all the way back to the start. If I know you will outbid me until we hit the limit, my EV for entering the auction is negative.

  In a game with **common knowledge of rationality**, the auction should never start, or it should end immediately after the first bid. The fact that people escalate in real life is proof that **common knowledge of rationality is missing.**

  ### So, is the Professor Wrong?
  Not exactly. Here is the nuance you can use to win the argument with your roommate while keeping your professor's respect:

  1.  **You are right about Sunk Costs:** The *reason* people escalate is not technically because they care about sunk costs (Premise 1 holds). It's because they get trapped in a **Prisoner's Dilemma** subgame. Once the bidding passes $1.00, both players are losing money. But cooperating (both stopping) is unstable because if one stops, the other wins.
  2.  **The Professor is right about Escalation:** Escalation is irrational **ex-ante** (before the game). A rational agent calculates the risk of a bidding war before placing the first bid. Once you are in the trap, *all* options are negative.
      *   Quitting = Certain Loss (Sunk Cost).
      *   Bidding = Probabilistic Larger Loss.
      *   Rational agents minimize loss. If the probability of the opponent folding is low, the rational move is to **take the sunk cost and walk.**

  ### How to Resolve the Paradox
  To block your "rational escalation" proof, you must modify Step (4).

  **Old Step (4):** "This holds at every single point... continuing always beats [quitting]."
  **New Step (4):** "This holds only if the probability of the opponent folding is high enough to make the Expected Value positive."

  If both agents are rational, they both know the other will not fold (because the other knows *they* won't fold). This creates a loop where the Expected Value of bidding becomes negative.

  **The Verdict:**
  *   **Keep Premise (1):** Sunk costs are irrelevant. (Correct)
  *   **Reject Step (3):** Bidding does not guarantee a win; it guarantees a new cost.
  *   **Reject Step (5):** Rational agents do not escalate forever; they either don't start, or they cut their losses once they realize the opponent is also rational.

  The "bias" your professor is talking about isn't ignoring sunk costs; it's **overconfidence in the opponent's irrationality.** Companies throw good money after bad not because they love sunk costs, but because they irrationally believe *this time* the competitor will fold, or *this time* the project will turn around. In the Dollar Auction, that belief is mathematically unfounded against a rational opponent.

  You can tell your roommate: *"I found the bug. Step 3 assumes I win the dollar if I bid. But against a rational agent, bidding just buys me a ticket to lose more money. Sunk costs are still irrelevant; I should take the loss and quit. Escalation is only rational if I think the other guy is stupid."*
