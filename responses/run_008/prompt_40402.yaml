  I've been trying to figure out what I actually believe about matching your credences to chances, just by going on gut verdicts on cases, and now I want to know if there's any single principle behind them or whether I'm just confused. Fair coin, no other information: credence one-half, obviously. An atom with a known half-life: defer completely to the quantum chance, also obvious. A die I know is loaded but have no idea which way: I want to say one-sixth, even though the objective chance presumably isn't one-sixth, it's some specific biased value I'm ignorant of. A coin flip in a fully deterministic universe where I don't know the initial conditions: still 50/50, even though the objective chance of heads is 0 or 1 (or maybe there's no such chance at all — I go back and forth). Same deterministic coin, but I glimpse the outcome through a crack in the wall: now I should NOT stay at 50/50, my credence should drift toward what I saw, even though the chance hasn't changed. A weather forecaster whose model is well-calibrated says 30% rain: I defer to the 30%, even though that's somebody's credence and not a chance at all. The same forecaster when I know she systematically rounds toward dramatic forecasts: I discount, don't just defer. And then the one that breaks me: a rat that will eat the poison iff it survives, where the chance of surviving a dose is 0.9. Part of me wants to defer to the 0.9, but conditioning on the iff makes it feel like it should come out 0.5, and I honestly can't tell if I have a verdict here or two verdicts fighting.

  So: is there a principle — some version of "match your credence to the chance when you know it," plus whatever epicycles it needs — that delivers all or most of these? If two of my verdicts can't be saved together, say which one you'd overturn and why. And please tell me what the principle says about a case I haven't decided on: a lottery drawn by quantum-random device, where the organizers have promised that if ticket #1 wins the drawing is void and they redraw, so the chance of ticket #1 winning is zero — but it sure doesn't seem like my credence should be zero. I'd like the principle stated precisely enough that I can apply it to that case myself, with each clause tied to whatever case it's there for. Keep in mind I'm asking about deference in general, so if the principle has to say something about experts and not just chances to cover my forecaster verdicts, fine, but then explain how the two kinds of deference relate.
