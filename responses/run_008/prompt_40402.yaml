answer: |-
  You are not confused. Your intuitions track the actual historical development of the philosophy of probability over the last 40 years. You have independently rediscovered the problems that forced philosophers to move from Lewis's **Principal Principle** to the **Generalized Principal Principle**, and then to various refinements concerning admissibility and self-location.

  There is a single principle that can unify almost all of these verdicts. It is a version of the **Generalized Deference Principle**. However, to make it work, we must accept that one of your intuitions (the Rat) is likely a cognitive illusion, and another (the Lottery) relies on an ambiguity in the proposition.

  Here is the principle, stated precisely, with annotations linking each clause to your cases.

  ### The Generalized Deference Principle (GDP)

  Let $Cr$ be your credence function, $A$ be a proposition, and $\mathcal{E}$ be an **expert function** (which assigns a value $x$ to $A$). Let $E$ be your total evidence.

  $$Cr(A \mid \langle \mathcal{E}(A) = x \rangle \land E) = x$$

  **Provided that:**
  1.  **$\mathcal{E}$ is recognized as an expert:** You believe $\mathcal{E}$ tracks the truth of $A$ better than you do.
  2.  **$E$ is admissible:** $E$ contains no information about the truth of $A$ that is not already mediated through $\mathcal{E}$.
  3.  **Uncertainty is integrated:** If you are uncertain about the value of $\mathcal{E}(A)$, your credence is the weighted average of the possible values.

  ---

  ### Clause-by-Clause Application to Your Cases

  #### 1. The Core Deference Clause
  > **Clause:** $Cr(A \mid \langle \mathcal{E}(A) = x \rangle) = x$
  > **Cases:** *Fair Coin, Radioactive Atom, Weather Forecaster (Calibrated).*

  This is the engine of the principle.
  *   **Fair Coin/Atom:** Here $\mathcal{E}$ is the **Objective Chance** function ($Ch$). You know $Ch(\text{Heads}) = 0.5$, so $Cr(\text{Heads}) = 0.5$.
  *   **Forecaster:** Here $\mathcal{E}$ is the **Forecaster's Credence** function. You have verified their calibration. They are an "expert" in the van Fraassen sense. You defer to their 30% just as you would defer to a chance of 30%.
  *   **Relation:** This unifies chance and expert credence. Objective chance is simply the **ideal expert**—a function that knows all the physical propensities. A weather forecaster is a **fallible expert**. You defer to both, but the "chance" function trumps the forecaster if they conflict (because chance is the more ideal expert).

  #### 2. The Admissibility Clause
  > **Clause:** Provided $E$ is *admissible*.
  > **Cases:** *Deterministic Coin (Peeking), Forecaster (Biased).*

  This is the most critical restriction. Evidence $E$ is **inadmissible** if it gives you direct information about the outcome $A$ that bypasses the expert function.
  *   **Deterministic Coin (Peeking):** You glimpse the outcome. This is inadmissible evidence about the *truth* of Heads. The GDP says: ignore the chance (0.5) and update on the evidence (what you saw). Your verdict to shift credence is correct.
  *   **Forecaster (Biased):** You know she rounds dramatically. This is inadmissible evidence about the *reliability* of the expert function itself. You are no longer conditioning on $\langle \mathcal{E}(A)=30\% \rangle$; you are conditioning on $\langle \mathcal{E}(A)=30\% \land \mathcal{E} \text{ is biased} \rangle$. The principle tells you to discount.
  *   **Deterministic Coin (Ignorant):** You have no inadmissible evidence. Even if the metaphysical chance is 0 or 1, you do not *know* that. You are deferring to the **epistemic chance** (the chance function appropriate to your state of knowledge). The GDP allows you to defer to the chance function *you take to be relevant*.

  #### 3. The Integration Clause
  > **Clause:** If uncertain about $x$, $Cr(A) = \sum Cr(\mathcal{E}(A)=x_i) \cdot x_i$.
  > **Cases:** *Loaded Die (Unknown Bias).*

  You don't know the specific chance $x$. You have a distribution over possible biases.
  *   **Loaded Die:** You assign a probability distribution over the possible biases (e.g., uniform over 0 to 1). The GDP requires you to average the chances weighted by your credence in those chances. If you have no reason to favor any bias, the math works out to 1/6. Your verdict is correct; you aren't matching a *single* known chance, you are integrating over *uncertain* chances.

  ---

  ### The Conflicts: Where to Overturn Verdicts

  You have two cases where your intuitions fight or seem to break the principle. Here is how to resolve them.

  #### 1. The Rat (Survival/Poison)
  *   **The Setup:** Chance of survival = 0.9. Rat eats poison *iff* it survives.
  *   **Your Conflict:** Defer to 0.9 vs. Intuition of 0.5.
  *   **The Verdict:** **Overturn the 0.5 intuition.**
  *   **Why:** The proposition "The rat eats the poison" is logically equivalent to "The rat survives." Therefore, $Ch(\text{Eats}) = Ch(\text{Survives}) = 0.9$. By the Core Deference Clause, your credence must be 0.9.
  *   **Source of Error:** The 0.5 intuition likely comes from a **selection effect confusion**. You might be implicitly asking, "Given that I am observing a rat that ate the poison, what is the probability it was the 'lucky' version?" or you are applying a Principle of Indifference to the two outcomes (Eat/Don't Eat) despite knowing they are not equiprobable. The GDP is clear: if the chance is 0.9, and you have no inadmissible evidence (you haven't peeked to see if it's eating), your credence is 0.9.

  #### 2. The Lottery (Redraw if #1 Wins)
  *   **The Setup:** Quantum draw. Rule: If #1 is drawn, void and redraw.
  *   **Your Intuition:** Chance(#1 Wins) = 0, but Credence(#1 Wins) $\neq$ 0.
  *   **The Verdict:** **Clarify the Proposition.**
  *   **Why:** The GDP demands $Cr(A) = Ch(A)$. If $Ch(\text{#1 Wins}) = 0$, then $Cr(\text{#1 Wins})$ *must* be 0.
  *   **Resolution:** Your intuition that credence shouldn't be zero stems from conflating two different propositions:
      1.  $A$: "Ticket #1 is **declared the winner**." (This includes the rule application). Here $Ch(A)=0$, so $Cr(A)=0$.
      2.  $B$: "Ticket #1 is **selected by the quantum device** in the initial draw." (This ignores the rule). Here $Ch(B) > 0$, so $Cr(B) > 0$.
      *   If you truly mean "Winning" (the final outcome), your credence *should* be zero. If you feel it shouldn't, you are secretly betting on proposition $B$ while calling it $A$. The GDP forces you to be precise: if the chance is zero, the credence is zero.

  ---

  ### Summary of the Unified View

  You can hold all your verdicts together if you adopt the **Generalized Deference Principle** with the following adjustments:

  1.  **Treat Chance as Expertise:** Chance is just the "ideal expert." This unifies the Coin, Atom, and Forecaster cases.
  2.  **Respect Admissibility:** This handles the Peeking and Biased Forecaster cases. If you know the outcome or the expert's flaw, you stop deferring.
  3.  **Integrate over Uncertainty:** This handles the Loaded Die. You defer to your *expectation* of the chance.
  4.  **Correct the Rat:** Accept 0.9. The 0.5 intuition is a cognitive bias regarding logical equivalence.
  5.  **Correct the Lottery:** Accept 0 (for the proposition "Wins"). The non-zero intuition is about the proposition "Selected."

  **The Principle for your notebook:**
  > "Match your credence to the expected value of the expert function (whether chance or person), conditional on your evidence being admissible (i.e., not revealing the outcome or the expert's unreliability directly)."

  This principle saves 90% of your intuitions and corrects the 10% where probability theory demands precision over gut feeling.
