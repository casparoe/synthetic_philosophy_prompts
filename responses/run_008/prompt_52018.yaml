      *   *SE Analogy:* Immutable infrastructure vs. Configurable flags. If your code has a flag `if (in_city) { pay = false }`, the driver's predictor sees that. You need code that says `if (hitchhiker_scenario) { pay = true }` regardless of location.

  5.  **Address the Prisoner's Dilemma (PD) / Copy Analogy:**
