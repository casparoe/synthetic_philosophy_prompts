prompt: |-
  I am a novelist four hundred pages into a trilogy set in a fictional archipelago whose Bronze-Age-style palace economies fall apart over the course of the second book, while a Maya-inspired heartland in the third book empties out after drought and war. My editor wants me to lean hard into "collapse" in the marketing copy and in the narration itself, but as I read around the archaeology I find the field split between those who see genuine civilizational failure and those who see reorganization, simplification, or migration that only looks like failure from the perspective of elites and later historians. Rather than guess per chapter, I want a decision procedure I can run myself, quickly, on any society I depict: the ordered questions to ask about it, what evidence within my own fictional world would count as a sufficient answer to each, where the procedure terminates in a verdict of collapse versus transformation versus something the dichotomy simply misses, and where it must hand the call back to me because the question is ultimately about which losses matter, which is a values question dressed up as an archaeological one. Please ground it in the actual shape of the scholarly debate, including the distinction between the fate of a political elite and the fate of the population at large, and the role of nostalgia in how decline gets narrated. Then run it on two cases: my palace economy, whose scribal class vanishes while the villagers carry on farming with faint memories of the old temples; and my drought-stricken heartland, where urban courts fail but the population persists in smaller settlements. Finally, apply it to my marquee fallen empire, which I have written from the start as an unambiguous collapse, and tell me honestly if the procedure says I got it wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User:** Novelist, 400 pages into a trilogy.
      *   **Setting:** Fictional archipelago (Book 2: Palace economy collapse), Maya-inspired heartland (Book 3: Drought/war emptying out), Marquee Fallen Empire (Book 1/Overall: Unambiguous collapse).
      *   **Conflict:** Editor wants "collapse" marketing/narration. Author reads archaeology and sees nuance (reorganization vs. failure).
      *   **Task:** Create a *decision procedure* (ordered questions, evidence criteria, termination points) to determine "Collapse" vs. "Transformation" vs. "Values Call."
      *   **Requirements:** Ground in scholarly debate (elite vs. populace, nostalgia), run on the two specific cases (Palace, Heartland), and run on the Marquee Empire (honest assessment).
      *   **Tone:** Professional, insightful, respectful of the creative process but rigorous about the historical analogues.

  2.  **Deconstruct the Scholarly Debate:**
      *   *Traditional View (Collapse):* Tainter (Complexity costs), Diamond (Environmental determinism). Focus on sudden loss of complexity, population drop, abandonment of sites.
      *   *Revisionist View (Transformation/Resilience):* McAnany & Yoffee (Questioning Collapse), Middleton (Resilience). Focus on continuity of commoners, shift in power structures, adaptation.
      *   *Key Distinctions:*
          *   Elite vs. Commoner fate (Did the kings die or did the farmers?).
          *   Complexity vs. Well-being (Did life get simpler but safer?).
          *   Narrative Perspective (Who is telling the story? The scribe or the farmer?).
          *   Nostalgia (The "Dark Age" is often a construct of later elites longing for lost glory).

  3.  **Drafting the Decision Procedure:**
      *   Need a flowchart-like structure but in text.
      *   *Step 1: Define the Unit of Analysis.* (What is collapsing? The state? The culture? The people?)
      *   *Step 2: Measure Socio-Political Complexity.* (Hierarchy, specialization, centralization.)
      *   *Step 3: Measure Demographic/Biological Continuity.* (Did people die/leave or just move/change habits?)
      *   *Step 4: Assess Quality of Life.* (Health, nutrition, violence.)
      *   *Step 5: The Narrative/Nostalgia Check.* (Who says it's a collapse?)
      *   *Termination Points:*
          *   *Verdict A: Systemic Collapse.* (Everything goes wrong.)
          *   *Verdict B: Political Transformation.* (Elites go, people stay.)
          *   *Verdict C: Adaptive Simplification.* (Life gets better/safer, less complex.)
          *   *Verdict D: The Values Call.* (Data is mixed; depends on what you value.)

  4.  **Running the Procedure on Case 1: The Palace Economy (Book 2):**
      *   *Scenario:* Scribal class vanishes, villagers farm on, faint memories of temples.
      *   *Analysis:*
          *   Complexity: Down (no scribes, no palaces).
          *   Demography: Stable (villagers stay).
          *   Quality of Life: Likely stable or improved (less tribute?).
          *   Narrative: Scribes call it collapse; farmers call it Tuesday.
      *   *Verdict:* Political Transformation / Adaptive Simplification. *Not* true civilizational collapse in the demographic sense.
      *   *Marketing Implication:* "Collapse" is misleading unless qualified (Collapse of Order, not People).

  5.  **Running the Procedure on Case 2: The Drought-Stricken Heartland (Book 3):**
      *   *Scenario:* Maya-inspired. Urban courts fail, population persists in smaller settlements.
      *   *Analysis:*
          *   Complexity: Down (no cities).
          *   Demography: Shifted (urban to rural), not necessarily vanished.
          *   Quality of Life: Harder (drought), but survival is success.
          *   Narrative: Elite monuments stop, but oral tradition continues.
      *   *Verdict:* Political Transformation / Resilience. (Classic Maya Terminal Classic pattern).
      *   *Marketing Implication:* "Collapse" sells, but "Abandonment" is more accurate.

  6.  **Running the Procedure on Case 3: The Marquee Fallen Empire:**
      *   *Scenario:* Written as "unambiguous collapse."
      *   *Constraint:* I don't know the specific details, but I need to challenge the user based on the procedure.
      *   *Strategy:* I need to ask the user to verify specific criteria. However, the prompt asks me to "tell me honestly if the procedure says I got it wrong." Since I can't know the *actual* fictional details beyond "unambiguous collapse," I must simulate the check based on the *claim* of unambiguity.
      *   *Critical Insight:* True "unambiguous collapse" (everyone dies or leaves, culture vanishes) is historically rare (e.g., Easter Island, maybe Greenland Norse). Most "empires" transform.
      *   *Honest Assessment:* If the user wrote *total* erasure, they might be historically outlier-ish. If they wrote *elite* erasure + *cultural* fragmentation, it's plausible. I need to push them to check if they conflated "End of Empire" with "End of People."
      *   *Refinement:* I will structure this as a "Stress Test." If the procedure flags it as Transformation, but the theme requires Collapse, that's a thematic choice, not an error. But if the *evidence* in the text contradicts the *label*, that's a consistency issue.

  7.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the tension (Editor's hook vs. Historical nuance). Validate the author's research.
      *   **The Procedure:** The "Civilizational Triage Protocol." 5 Steps.
      *   **Application:** Run the three cases.
      *   **The Marketing/Narrative Synthesis:** How to sell "Transformation" as "Collapse" without lying (focusing on the *perspective* of collapse).
      *   **The "Values Call":** Explicitly address where the data ends and the theme begins.

  8.  **Self-Correction/Nuance Check during Drafting:**
      *   *Caution:* Don't tell the author to rewrite 400 pages. The goal is to help them *frame* what they have.
      *   *Scholarly Grounding:* Name-drop Tainter, Diamond, McAnany, Yoffee, Middleton to show I understand the brief.
      *   *The "Values" Question:* This is crucial. Archaeology can't say if losing writing is "bad" if it means less starvation. The author must decide.
      *   *Nostalgia:* Ensure the procedure asks *who* is lamenting the loss.

  9.  **Final Polish:** Check tone. Ensure it sounds like a collaborative editor/historian hybrid. (Make sure to explicitly answer the "tell me honestly" part about the Marquee Empire).

  *(Self-Correction on the Marquee Empire)*: I cannot definitively say "You got it wrong" without reading the book. I must phrase this as: "If your evidence shows X, but you call it Y, here is the friction." I will assume "unambiguous collapse" implies total depopulation/cultural erasure and warn that this is the historically rarest outcome.

  10. **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Ordered questions? Yes.
      *   Evidence criteria? Yes.
      *   Termination verdicts? Yes.
      *   Values question identified? Yes.
      *   Grounded in scholarship? Yes.
      *   Run on 3 cases? Yes.

