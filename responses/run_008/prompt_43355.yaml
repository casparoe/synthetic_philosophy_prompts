answer: |-
  This is a sophisticated problem that sits exactly at the cutting edge of contemporary archaeology and complexity science. Your editor wants the dramatic hook of *Diamond's Collapse*; your research is telling you the nuanced reality of *McAnany and Yoffee's Questioning Collapse*.

  The good news is that you do not need to rewrite 400 pages to accommodate the scholarship. You need to calibrate the *lens* through which the collapse is viewed. "Collapse" is often a description of a specific viewpoint (the elite) mistaken for a total reality (the population).

  Below is the **Civilizational Triage Protocol**. It is designed to separate socio-political failure from demographic/cultural continuity. Following the protocol, I will run your three cases and give you the honest assessment you requested.

  ***

  ### The Civilizational Triage Protocol

  Run these five questions in order. Stop at the first definitive verdict. If you reach Step 5, you have entered the realm of thematic choice.

  #### Step 1: Define the Unit of Analysis
  **Question:** What specifically is ending?
  *   **Evidence to look for:** Is it the dynasty? The capital city? The writing system? The trade network? Or is it the biological population and the local language?
  *   **Decision:**
      *   If *only* the political superstructure (palaces, kings, taxes) ends: Proceed to Step 2.
      *   If the *population* dies out or migrates en masse to a completely different cultural zone: **Verdict: Demographic Collapse.** (Stop).
      *   If the *culture* (language, religion, kinship) vanishes entirely: **Verdict: Cultural Extinction.** (Stop).

  #### Step 2: Measure Socio-Political Complexity
  **Question:** Has the society simplified, or has it fragmented?
  *   **Evidence to look for:** Loss of specialization (potters becoming farmers), loss of hierarchy (no more palaces), loss of information storage (no more scribes).
  *   **Decision:**
      *   If complexity drops significantly but local organization remains: Proceed to Step 3.
      *   If complexity remains high but shifts location (e.g., capital moves): **Verdict: Political Relocation.** (Not Collapse).

  #### Step 3: Assess Quality of Life (Bioarchaeology)
  **Question:** Did the "collapse" make life worse for the survivors?
  *   **Evidence to look for:** Skeletal stress markers, nutrition, violence/trauma, workload.
  *   **Decision:**
      *   If health/nutrition *improves* or stays stable after the elite vanish (less tribute burden): **Verdict: Adaptive Simplification.** (The "Collapse" was a liberation).
      *   If health/nutrition *plummets* (famine, war, disease): Proceed to Step 4.

  #### Step 4: The Continuity Check
  **Question:** Do the descendants remember the ancestors?
  *   **Evidence to look for:** Oral traditions, reuse of ruins, continued worship at modified sites, material culture styles persisting in humble contexts.
  *   **Decision:**
      *   If there is a clear cultural thread connecting pre- and post-event: **Verdict: Political Transformation.** (The "Collapse" is a change of management).
      *   If the past is utterly unintelligible to the survivors: **Verdict: Systemic Collapse.** (Stop).

  #### Step 5: The Values Call (The Author's Domain)
  **Question:** Whose loss counts as a tragedy?
  *   **Context:** Archaeology can tell you the palace burned. It cannot tell you if the burning of the palace is a "tragedy" if the palace was built on slave labor.
  *   **Decision:**
      *   If you value *Complexity/Art/State Stability* over *Equity/Resilience*: You may narrate this as **Collapse**.
      *   If you value *Human Continuity/Adaptation* over *Monumentality*: You must narrate this as **Transformation**.
      *   **The Nostalgia Trap:** Ask yourself: *Who is narrating the decline?* If it is a survivor of the elite class, "Collapse" is their subjective truth, even if objective data shows resilience. You can depict "Collapse" as a *mood* rather than a *fact*.

  ***

  ### Case Application

  Here is how your fictional societies score when run through the protocol.

  #### Case 1: The Palace Economy (Book 2)
  *   **Scenario:** Scribal class vanishes, villagers farm on, faint memories of temples.
  *   **Step 1 (Unit):** Political superstructure ends (Scribes/Palace). Population stays. -> *Proceed.*
  *   **Step 2 (Complexity):** Significant simplification (no writing, no central tax). -> *Proceed.*
  *   **Step 3 (Quality of Life):** Villagers carry on farming. Historically, when tribute demands stop, commoner nutrition often *improves*. -> *Lean toward Adaptive Simplification.*
  *   **Step 4 (Continuity):** "Faint memories of old temples." This is key. The culture is not dead; it is oralized and localized. -> *Verdict: Political Transformation.*
  *   **Step 5 (Values):** The scribes see this as the end of the world. The farmers see it as the end of taxes.
  *   **Marketing/Narrative Advice:** Do not market this as "Civilizational Collapse." Market it as **"The Breaking of the Yoke."** In the narration, lean into the *elite perspective* for the tragedy. Let the scribe character mourn the loss of history (Collapse), while the farmer character celebrates the survival of the harvest (Transformation). The tension between these two views *is* the theme.

  #### Case 2: The Drought-Stricken Heartland (Book 3)
  *   **Scenario:** Maya-inspired. Urban courts fail, population persists in smaller settlements.
  *   **Step 1 (Unit):** Urban courts end. Population persists. -> *Proceed.*
  *   **Step 2 (Complexity):** Urbanization reverses. -> *Proceed.*
  *   **Step 3 (Quality of Life):** Drought implies stress. However, smaller settlements are often more resilient to drought than monolithic cities dependent on complex irrigation. -> *Mixed/Context Dependent.*
  *   **Step 4 (Continuity):** Population persists. In Maya archaeology, this is the "Terminal Classic." The monuments stop, but the people do not vanish. -> *Verdict: Political Transformation / Resilience.*
  *   **Step 5 (Values):** This is the classic "Dark Age" construct. Later historians call it a collapse because the *monuments* stop. The people call it survival.
  *   **Marketing/Narrative Advice:** Your editor wants "Collapse." You can give them **"Urban Collapse."** Be precise. The *cities* collapse. The *people* migrate and adapt. If you write this as everyone dying, you contradict the "population persists" premise. If you write it as the *dream of empire* dying while the people scatter, you satisfy both history and drama.

  #### Case 3: The Marquee Fallen Empire
  *   **Scenario:** Written from the start as an "unambiguous collapse."
  *   **The Honest Assessment:**
      If you have written this as **Demographic Collapse** (everyone died/left) or **Cultural Extinction** (language/religion totally erased), **the procedure suggests you have likely gotten it wrong**, or at least chosen a historical outlier.
      *   *Why:* True unambiguous collapse is incredibly rare in human history (e.g., Greenland Norse, perhaps Easter Island). Even Rome "transformed" rather than "collapsed" in the East, and in the West, the barbarian kingdoms were continuations by other means.
      *   *The Risk:* If your readers sense that the population just vanished without a trace, it may feel artificial compared to the nuance of Books 2 and 3.
      *   *The Fix:* You do not need to change the plot. You need to change the *definition of victory*.
      *   *Application of Step 5:* To keep "Unambiguous Collapse," you must prove that **Step 4 (Continuity)** failed. You need evidence that the survivors *could not* remember the past, or that the environment became genuinely uninhabitable.
      *   *Verdict:* If the land is still habitable and people are still there, it is not unambiguous collapse. It is **Catastrophic Transformation.**
      *   *Recommendation:* If you want to keep the "Collapse" label, ensure the *cost* of survival was the total erasure of identity. If the survivors speak a new language, worship new gods, and have no memory of the Empire, then you have achieved **Cultural Collapse** even if biological survival occurred. That is a valid, tragic verdict. But if they are just living in the ruins speaking the same tongue, your editor's "Collapse" tag is marketing hyperbole, not textual truth.

  ***

  ### Synthesis for the Editor and the Text

  Your editor wants "Collapse" because it sells. Archaeology says "Transformation" because it's accurate. You can bridge this gap using **Step 5: The Values Call.**

  1.  **Reframe the Marketing:** "Collapse" is not a scientific term in your blurb; it is an emotional one.
      *   *Instead of:* "The civilization collapses."
      *   *Try:* "The world they knew collapses." (Subjective vs. Objective).
  2.  **Narrative Focalization:** Use the procedure to assign truth to specific characters.
      *   The **Priest/Scribe** experiences Collapse (Step 2 failure).
      *   The **Farmer** experiences Transformation (Step 1 & 4 success).
      *   The **Tragedy** comes from the gap between them.
  3.  **The "Dark Age" Nostalgia:** Acknowledge in the text that "Collapse" is often a story told by the losers of the transition. If a character says, "Everything is ruined," have another character reply, "The temples are gone, but the children are fed."

  **Final Verdict on your Trilogy:**
  You are not writing a trilogy about *Collapse*. You are writing a trilogy about **the cost of Complexity.**
  *   Book 2: Complexity becomes too expensive (Palace falls).
  *   Book 3: Environment makes Complexity impossible (Cities fall).
  *   Book 1 (Empire): The memory of Complexity haunts the survivors.

  Tell your editor you are leaning into "Collapse," but you are defining it archaeologically: **The collapse of the State, not the People.** This allows you to keep the grim tone they want without violating the historical nuance you've researched. It makes the work smarter, not softer.
