answer: |-
  This is a classic reflective equilibrium exercise, and your intuitions are actually more coherent than you might fear. You are rejecting pure Act Utilitarianism (rightly, given the Footbridge/Transplant cases) but you are also chafing against the rigid, often metaphysical distinctions of the traditional Doctrine of Double Effect (DDE), specifically regarding the Loop case.

  The principle that achieves equilibrium across your specific set of verdicts is not standard DDE, nor is it simple Rights Theory. It is best described as **The Principle of Non-Manipulative Agency** (sometimes associated with the work of Frances Kamm or a refined Quinn-style Direct Agency).

  Here is the principle:

  > **It is permissible to act to save a greater number if the causal sequence of harm to the minority is initiated by redirecting an existing threat or by collateral damage, provided you do not actively manipulate the minority's body or status as the *instrument* of rescue.**

  Let's run this against your dataset.

  ### 1. The Fit Check
  *   **Switch:** You manipulate the *switch*, not the man. The trolley (existing threat) is redirected. **Verdict: Fine.**
  *   **Footbridge:** You manipulate the *man*. He is the projectile. You initiate a new causal chain involving his body. **Verdict: Not Fine.**
  *   **Transplant:** You manipulate the *patient*. He is the resource. **Verdict: Not Fine.**
  *   **Terror Bombing:** You manipulate the *civilians' status*. They are the target/means. **Verdict: Not Fine.**
  *   **Strategic Bombing:** You manipulate the *plant*. Civilians are collateral (side effect of destroying the plant). **Verdict: Grimly Fine.**
  *   **Loop:** You manipulate the *switch/trolley*. The man is passive. Even though his mass stops the trolley, you did not push him onto the track; you sent the threat to where he happened to be. **Verdict: Fine.**

  This principle respects your intuition that **Loop is Fine**. Traditional DDE often stumbles here because the man's death is causally necessary (a "means"). But under Non-Manipulative Agency, the distinction isn't "Means vs. Side Effect," it is **"Manipulating the Threat vs. Manipulating the Victim."** In Loop, you manipulate the threat.

  ### 2. Resolving Your "Bug"
  > *The one that really bugs me: in one version the big guy is standing on the side track as a mere side effect of my diverting... and in the other version his body is what stops the trolley. He dies either way, I divert either way, and these feel different to me. I suspect they shouldn't.*

  You are correct; they shouldn't be different. Under the Non-Manipulative Agency principle, **they are identical.**

  In both versions, your agency is directed at the *trolley*. In both versions, the man is passive. The microscopic difference in physics (whether the trolley derails *after* hitting him or derails *because* it hit him) does not change your moral relationship to him. You did not touch him. You did not use his body as a tool; you merely placed a threat in his vicinity.

  The reason they *feel* different is that the "Body Stops" version triggers our **Instrumentalization Alarm**. It *looks* like we are using him as a sandbag. But since we established that Loop is "Fine" in your equilibrium, you must accept that **passive instrumentalization via threat redirection is permissible.** The intuition that they are different is the noise. It is a cognitive bias favoring "cleaner" causal chains, but morally, your agency toward the victim is constant.

  ### 3. The Volunteer Case
  > *The big man volunteers — he sees what's happening and jumps himself.*

  This changes the moral geometry entirely.

  If the Big Man jumps in front of the trolley (Footbridge style) or jumps onto the side track (Loop style), **he waives his right against harm.**

  *   **Under Non-Manipulative Agency:** You are no longer the agent of his harm. He is. You are merely witnessing or facilitating a sacrifice he has chosen. The constraint against "manipulating the victim" vanishes because he is manipulating himself.
  *   **Under DDE:** His intent is suicide/sacrifice; your intent is saving the five. The moral burden of the death shifts to his consent.
  *   **Under Utilitarianism:** Obviously fine.

  **Verdict:** **Fine.** In fact, it is morally obligatory to *allow* him to do so (assuming his decision is competent), whereas in the non-volunteer Footbridge case, it is obligatory *not* to push him. Consent dissolves the deontological constraint.

  ### 4. Is DDE Circling Something Real?
  Yes, but "Means vs. Side Effect" is the wrong formulation. The DDE is a heuristic for **The Separateness of Persons.**

  Pure utilitarianism treats human bodies as containers of utility that can be shuffled around. Your intuitions (and the Non-Manipulative Agency principle) recognize that persons have **moral boundaries.**
  *   **Switch/Loop/Strategic Bombing:** You are acting on the world (tracks, trolleys, plants), and the harm crosses the person's boundary as a consequence.
  *   **Footbridge/Transplant/Terror:** You are acting *on the person's boundary* directly to extract utility from them.

  The Loop case feels weird because it sits on the border: the person's boundary *is* the stopper. But because *you* didn't push him across that boundary (the trolley did), you remain on the permissible side of the line.

  ### Summary for your Reflective Equilibrium
  1.  **Principle:** You may redirect existing threats to minimize loss, even if a specific individual's presence is causally required to arrest the threat, provided you do not actively manipulate that individual's body.
  2.  **The Bug:** The distinction between "Side Effect Death" and "Body Stops Death" is morally irrelevant. Your intuition that they differ is noise generated by the visceral "using" appearance of the latter. Bite the bullet: they are the same.
  3.  **The Volunteer:** Consent overrides the manipulation constraint. It is permissible.
  4.  **DDE Status:** It is a useful proxy for "Manipulation of Persons," but should be discarded when it conflicts with the deeper principle of Agency (as in the Loop case).

  This keeps you out of Utilitarianism (protecting the Footbridge/Transplant cases) but saves you from rigid Deontology that would forbid the Loop or Strategic Bombing. It is a stable, defensible position.
