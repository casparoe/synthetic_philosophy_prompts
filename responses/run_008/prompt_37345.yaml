answer: |-
  Here is a battle plan for your 20 minutes. Since you can't use slides, your whiteboard management and pacing are your only weapons.

  ### 1. The Order of Operations: Nail "Compute" First
  Do **not** start by defining "think." If you start with "What is thinking?", the English kids will say "feeling" and the CS kids will say "processing," and you'll be stuck in semantics for 10 minutes.

  **Start by redefining "Computer."**
  Most people think a computer is a plastic box with a screen. You need to move them to the functional definition immediately.
  *   **Write on board:** `COMPUTE ≠ ELECTRONICS`
  *   **Write on board:** `COMPUTE = FOLLOWING RULES ON SYMBOLS`
  *   **Say:** "For this discussion, a 'computer' isn't a MacBook. It's anything that takes an input, follows a strict rule, and gives an output. If you can do that with pen and paper, you're computing."

  **Why this first?** Once everyone agrees that "computing" is just rule-following, you can ask the real question: "Is the brain *just* a rule-follower, or is there something else happening?"

  ### 2. The One Example: "The Blind Librarian"
  Forget the calculator (too boring) and the rain gutter (too physical). Use **The Blind Librarian** (a simplified version of the famous "Chinese Room" argument). This works because it separates *manipulating symbols* from *understanding meaning*.

  **The Setup (Draw this on the board):**
  1.  Draw a stick figure in a box. Label him "The Librarian."
  2.  Draw a slot in the wall. Label it "Input."
  3.  Draw a massive bookshelf behind him. Label it "The Rulebook."
  4.  **The Scenario:** "The Librarian doesn't speak French. People slide notes in French through the slot. The Librarian has a Rulebook that says: 'If you see shape [X], slide out shape [Y].' He matches the shapes perfectly and slides answers back out."

  **Why this works for both groups:**
  *   **For the CS Kids:** This is a **Lookup Table** or a deterministic algorithm. They know this is technically "computation."
  *   **For the English Kids:** This is **acting** or **memorizing lines** without knowing the script's meaning.
  *   **The Kicker:** "To the person outside, the Librarian speaks French. To the Librarian, it's just shapes. Is the Librarian *thinking* in French?"

  **What the example needs to have:**
  *   **Syntax vs. Semantics:** Make sure you use those words. Syntax = the shape of the symbols (CS kids love this). Semantics = the meaning behind them (English kids love this).
  *   **Perfection:** The Librarian must never make a mistake. If he makes mistakes, people will argue he's "bad at computing," not "not thinking."

  **What the example needs to NOT have:**
  *   **Learning:** Do not let the discussion drift into "What if the Librarian learns?" That opens the Neural Network can of worms. Keep it static.
  *   **Biology:** Don't talk about neurons yet. Keep it about the *process*.

  ### 3. Misconceptions & When to Head Them Off
  You will get interrupted. Here is your defense matrix.

  **Misconception A: "But computers are made of metal, brains are meat."**
  *   **When it happens:** Usually in the first 3 minutes during your definition.
  *   **The Fix:** "That's the hardware. I'm talking about the software. If I write the same code on paper and run it myself, am I computing? Yes. So material doesn't matter, process does."

  **Misconception B: "If it acts like it thinks, it *is* thinking." (The Turing Test trap)**
  *   **When it happens:** During the Librarian example. Someone will say, "But if the answers are perfect, does it matter if he understands?"
  *   **The Fix:** "That's the behaviorist view. But if I memorize a speech in a language I don't know, and I deliver it perfectly, did I *say* anything? Or did I just make noise? We're asking if the *inside* matters."

  **Misconception C: "Brains are special/magic/souls."**
  *   **When it happens:** Near the end, when you apply this to humans.
  *   **The Fix:** "I'm not saying brains *aren't* special. I'm asking if the *mechanism* is computational. A bird flies, and a plane flies. They use different parts, but both use aerodynamics. Maybe brains use computation *plus* something else."

  **Misconception D: "AI is already conscious."**
  *   **When it happens:** Anytime someone mentions Chatbots.
  *   **The Fix:** "AI is a great example of the Librarian. It predicts the next word based on rules (stats). Does it *know* what it's saying? That's the question we're asking, not answering."

  ### 4. The "No-Go" Zone: Consciousness (Qualia)
  You must draw a line in the sand, or you will run out of time. The "Hard Problem" (why red *feels* like red) is a black hole.

  **How to say it without dodging:**
  Write **"THE HARD PROBLEM"** on the far corner of the board at the start.
  *   **Script:** "There is a difference between *processing information* (seeing a red light and stopping) and *experiencing information* (feeling the sensation of 'redness'). That second part is called Qualia. It's a massive philosophical rabbit hole. If we try to solve that today, we'll be here until graduation. Today, we are only asking if the *processing* part is computational. We are parking the 'feeling' part in the corner."

  ### 5. The Final Check-Out Question
  Do not ask "Any questions?" You will get silence. Ask a question that forces them to use the distinction you taught.

  **The Question:**
  *"If I built a robot that could recite every poem ever written perfectly, but it had no idea what 'sadness' felt like, did it understand the sad poems?"*

  **What to listen for:**
  *   **Bad Answer:** "Yes, because it got the words right." (They missed the Semantics point).
  *   **Bad Answer:** "No, because robots can't feel." (They ignored the Computation point).
  *   **Good Answer:** "It processed the syntax, but missed the semantics." OR "It computed the output, but didn't think the thought."

  ### 6. Whiteboard Layout Plan
  Since you have no slides, organize the board so the logic flows visually.

  *   **Left Third:** Definitions.
      *   `Compute = Rules + Symbols`
      *   `Think = ???`
  *   **Middle Third:** The Librarian Diagram.
      *   (Draw the box, the slot, the book).
      *   `Syntax (Shapes)` vs `Semantics (Meaning)`
  *   **Right Third:** The Parking Lot.
      *   `The Hard Problem (Feelings)` -> *Draw an arrow pointing off the board.*
      *   `Hardware (Meat vs Metal)` -> *Cross this out.*

  ### 7. Managing the AP CS Kids
  They are your biggest risk. They might try to correct you on architecture (Von Neumann vs. Neural Net).
  *   **Pre-empt them:** "For the CS folks in the room, I know we're simplifying architecture. I'm talking about **functionalism**—what the system *does*, not how the transistors are wired. Let's keep it abstract."
  *   **Use them:** If they bring up Neural Networks, say: "Exactly, a Neural Net is just a complex Rulebook. Does that change the Librarian problem?"

  ### Summary Timeline (20 Mins)
  *   **0:00-3:00:** Hook. Define Compute (Rules, not electronics). Park "Feelings" on the right side of the board.
  *   **3:00-10:00:** The Blind Librarian Example. Draw it. Walk them through the Input/Rulebook/Output loop. Introduce Syntax vs. Semantics.
  *   **10:00-15:00:** Apply to Brain. "Are neurons just biological switches? Is the Librarian us?" Let them debate.
  *   **15:00-18:00:** Handle Misconceptions (AI, Souls, Hardware). Remind them you aren't solving Consciousness.
  *   **18:00-20:00:** The Poem Question. Wrap up.

  **Final Tip:** If you get stuck, point to the board. "Look at the Librarian. He follows the rules. Does he understand?" It brings them back to the concrete example every time. Good luck.
