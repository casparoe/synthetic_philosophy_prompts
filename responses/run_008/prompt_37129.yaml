answer: |-
  **TO:** Architecture Review Board
  **FROM:** External Advisor, Rational Choice & Practical Reason
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo: Satisficing Planner Proposal

  **Recommendation**
  Adopt the satisficing module **with conditions**. The performance necessity is clear, but the safety lead's normative concerns require hard constraints on the annealing mechanism.

  **The Optimization Question**
  The third member argues satisficing is merely optimization with search costs priced in. Theoretically, this is Herbert Simon's original insight: if computation is costly, stopping early is optimal. However, there is a residual normative difference. Optimization requires knowing the marginal cost of further search to calculate the true maximum utility. We do not know this cost precisely; estimating it introduces error. Satisficing admits this ignorance. It shifts the engineering burden from calculating perfect search costs to validating the aspiration threshold. This matters because if we treat this as pure optimization, we might assume the threshold is self-justifying. Instead, we must treat the threshold as a safety-critical parameter that requires independent validation, not just tuning.

  **The Normative Question**
  The safety lead argues that knowingly accepting a worse plan is an "institutionalized bias toward mediocrity." This holds true only if "cost" correlates with safety risk. If the planner sacrifices route smoothness or margin for error to meet a deadline, that is a normative error, not an engineering tradeoff. However, if "cost" refers strictly to efficiency (fuel, time) and the vehicle remains within safe operating envelopes, then timeliness is itself a safety feature (preventing unpredictable stops). For the safety lead's position to win, we would need evidence that lower-cost routes inherently increase collision risk. Lacking that, we must assume efficiency and safety are decoupled, but verify this assumption.

  **Aspiration Annealing**
  Annealing lowers standards under pressure. In safety-critical systems, degrading standards under load is typically a design defect. However, under the framework of *bounded rationality* (making reasonable decisions within cognitive limits), it is defensible provided there is a hard floor. The system may accept less efficient routes as time pressure grows, but it must never accept unsafe ones. The current proposal lacks this floor.

  **Conditions for Adoption**
  1.  **Hard Safety Floor:** The aspiration threshold may anneal for efficiency metrics (fuel, time), but never below a fixed safety margin. This margin must be defined by the safety team, independent of estimated cost, within 14 days.
  2.  **Audit Triggers:** The regret audit must trigger an automatic rollback to fallback heuristics if "regret" (difference between committed plan and later found optimum) exceeds 15% for more than 5% of trips in any 24-hour window.
  3.  **Threshold Validation:** The initial 85% threshold must be validated against historical data to ensure it does not correlate with high-risk maneuvers. This report is due before deployment.
  4.  **Review Schedule:** The Board will review the regret audit data and safety metrics 30 days post-deployment to decide on permanent adoption.

  **Summary for Colleagues**
  We are approving the new planner because a timely plan is safer than a late one, but we are adding guardrails to address safety concerns. Philosophically, we acknowledge that "good enough" is not the same as "best possible," so we are treating the definition of "good enough" as a safety setting, not just a performance knob. The system will be allowed to pick less efficient routes when under heavy load, but it will never be allowed to drop below a fixed safety standard, regardless of time pressure. We will monitor the data closely for the first month to ensure we aren't accidentally trading safety for speed.
