prompt: |-
  Two guys on my team (both engineers, neither of us is a philosopher) got into a long argument after a standup about chaos theory and I need someone to referee it because honestly both sounded right to me. The trigger: one of them (Dave) said we'll never have good weather forecasts past a couple weeks no matter how much compute we throw at it, because chaos. Then it went like this:

  (1) Dave said that's also why the whole Laplace's demon idea is dead — if the tiniest measurement error explodes exponentially, then even if the world were deterministic we could never actually know its future, so determinism is pointless as an idea.

  (2) Miguel said that's conflating epistemic with ontic stuff (his phrase, which he had to explain to Dave twice): a chaotic system like the logistic map is 100% deterministic, we just can't predict it, and unpredictability doesn't disprove determinism. The demon doesn't need to measure anything — it already knows the state.

  (3) Dave came back with: but our best physics says the universe isn't deterministic anyway, quantum mechanics and all that, and chaos makes it worse — any microscopic quantum randomness gets amplified up to the macroscopic scale, so the actual future is genuinely open, not just unknown.

  (4) Miguel said quantum randomness mostly washes out statistically, and that anyway Dave was moving the goalposts — the original claim was about chaos, and chaos itself is a deterministic phenomenon, so it can't be evidence against determinism.

  (5) Dave said even granting all that, Miguel's position amounts to "the future is fixed but forever unknowable to us," and he wanted to know what work 'deterministic' is doing if literally no observer inside the system could ever exploit it — to us it's operationally identical to randomness.

  (6) Miguel's answer was that the difference is observable in principle: deterministic-chaotic systems have structure, that's why we can predict climate decades out even when weather breaks down after two weeks, whereas genuinely random systems wouldn't give us that.

  Neither of them would budge and then a meeting pulled us away. Please go through moves 1-6 and say who's right about each one, including whether Dave's move 5 is fair or a cheat, and what if anything both are missing. I'm also curious whether move 3 is even correct as physics, like whether chaos really does amplify quantum noise to everyday scales or whether that's hand-waving.
