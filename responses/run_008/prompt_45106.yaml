answer: |-
  # Decision Tree: Was Farming a Mistake?

  **Starting Point:** Some human groups switched from foraging to farming after the last ice age. Did that switch make things worse?

  **1. The Agency Question**
  To call something a "mistake," does someone have to have been able to choose otherwise?
  *   **Yes.** "Mistake" implies a chooser. Since farming crept up slowly and populations got locked in, no one chose the package.
      *   → **Leaf A: The "Wrong Question" View** (There was no agent choosing; it was an evolutionary trap, not a decision.)
  *   **No.** We can judge outcomes as good or bad even if they were accidental or unavoidable.
      *   → *Go to Question 2.*

  **2. The Scope Question**
  Are we talking about "Humanity" as a single block, or specific groups?
  *   **Specific Groups.** Some farms failed, some succeeded, some foragers stayed rich, some starved.
      *   → **Leaf B: The "Mixed and Locally Variable" View** (Stop generalizing; it depends on where and when.)
  *   **Humanity as a Whole.** We are looking for the net effect on the species across the long term.
      *   → *Go to Question 3.*

  **3. The Welfare Metric Question**
  How do we count "better"?
  *   **Total Sum.** Farming supported roughly 100 times more people. Even if individual lives were harder, more lives equals more total good.
      *   → **Leaf C: The "More-Lives-Beats-Better-Lives" View** (Population size outweighs individual hardship.)
  *   **Average Quality.** We care about how bad or good the *typical* life was, regardless of how many people there were.
      *   → *Go to Question 4.*

  **4. The Standpoint & Evidence Question**
  How do we know if the typical life was worse?
  *   **By Preference.** The people living it chose to stay on farms despite hardships. Revealed preference says it was worth it.
      *   → **Leaf D: The "Obviously Good Move" View** (If they preferred it, it was better for them.)
  *   **By Objective List.** We judge by health, freedom, and equality, regardless of whether they felt "stuck."
      *   *Follow-up:* Do skeletal signs of stress (disease, height loss) count as objective proof of suffering?
          *   **No.** Security, culture, and survival matter more than bone density.
              *   → **Leaf D: The "Obviously Good Move" View** (Converges here: Survival/security offsets physical stress.)
          *   **Yes.** Physical suffering and loss of leisure are the primary metrics.
              *   → *Go to Question 5.*

  **5. The Hierarchy Question**
  Did the new hierarchies (kings, priests, bosses) hurt everyone, or just the bottom?
  *   **Just the Bottom.** Elites gained security, power, and better nutrition. It was a trade-off, not a total loss.
      *   → **Leaf E: The "Unequal Progress" View** (Civilization advanced, but at the cost of equality.)
  *   **Everyone.** Even chiefs lost leisure, faced new warfare risks, and became dependent on unstable crops.
      *   → **Leaf F: The "Worst Mistake" View** (Hierarchy and health declines made everyone worse off.)

  ***

  ### Instructor Notes: Logical Space & Empty Branches

  **1. Unoccupied Branches (Views Nobody Holds)**
  *   **The "Accidental Catastrophe" Combo:** If a student answers **Yes** to Question 1 (Mistake requires a chooser) but still wants to land on **Leaf F** (Worst Mistake), they are linguistically contradicting themselves. However, many students *feel* this way—they want to say "Nobody chose it, BUT it was still terrible." In strict logic, this view is incoherent (you can't call an unchosen event a "mistake"), but psychologically it is very common. You may need to help them rephrase this as "The Worst Outcome" rather than "The Worst Mistake."
  *   **The "Elite Suffering" Paradox:** There is almost no historical support for the idea that hierarchy hurt *only* the elites while peasants benefited (the inverse of Question 5). If a student arrives here, they are likely misunderstanding the archaeological record regarding nutrition and disease loads among commoners vs. elites.

  **2. Inseparable Leaves (False Resolution)**
  *   **Leaf D Convergence:** Notice that **Leaf D** ("Obviously Good Move") can be reached via two different rational paths: either because the people *preferred* it (Preference Standpoint) OR because skeletal stress doesn't matter compared to security (Objective Standpoint + Dismissing Evidence). Your tree treats these as the same destination, but they are ethically distinct. One respects autonomy; the respects paternalistic welfare. Be aware that two students ending at Leaf D might actually disagree on *why* it was good.
  *   **Leaf A vs. Leaf B:** The "Wrong Question" (Agency) and "Mixed/Local" (Scope) leaves are difficult to separate in practice. Students who argue "You can't generalize" often also argue "Nobody chose this." If a student struggles to pick between them, allow them to hold both. They are mutually reinforcing skepticism rather than distinct positive claims.

  **3. The "Unequal Progress" Leaf (Leaf E)**
  *   This is the "Necessary Evil" position. It is logically stable but ethically uncomfortable. It admits farming was "worse" for the average person (Question 3 & 4) but denies it was a "mistake" for the species because it enabled complexity/elites (Question 5). Students often find this the hardest position to sit with, as it requires accepting permanent inequality as the price of civilization.
