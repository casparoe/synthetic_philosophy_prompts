answer: |-
  1. The practice restated
  In systems like Lean and Coq, the kernel is a minimal, trusted codebase validating proof terms against a fixed type theory. Steps must reduce to primitive operations (lambda application, definitional equality) or invoke declared axioms. Axioms are explicit dependencies; rules are implicit infrastructure. Isabelle differs slightly: its kernel validates inferences in a shallow meta-logic, where object-logic rules are often encoded as axioms or derived via ML functions, yet the meta-rules remain hardwired. In all cases, the kernel acts as the ultimate arbiter. It distinguishes between content (propositions, axioms) which is auditable, and procedure (inference rules) which is constitutive of the checker itself. The system assumes the kernel's correctness is a precondition for trust, not a theorem within the system. This creates a hard boundary: inside the logic, axioms are contingent; outside, rules are necessary. The kernel enforces a fixed logic, while allowing variable theories. The practice rests on this architectural division between fixed inference mechanisms and variable logical content.

  2. What the kernel presupposes about rules
  The kernel embodies Carroll's moral: rules are licenses to act, not premises to accept. By hardwiring inference into the checking loop, the system treats rules as constitutive of validity rather than contingent truths within the logic. This presupposes a foundationalist epistemology where justification terminates in fiat—the mechanical correctness of the kernel code. There is no internal theory of why modus ponens works; its validity is identical to the kernel's ability to execute it. This aligns with a pragmatic or inferentialist view: logical constants gain meaning through their rule-governed use, validated by the machine. The kernel assumes that trust is transferred from the mathematical truth to the computational process. It presupposes that the regress of justification must be halted externally, by engineering constraints rather than logical derivation. Consequently, the system treats the kernel's logic as normative for reasoning itself. To question the rules is to step outside the system, not to prove a theorem within it. Thus, the kernel presupposes that inference is a primitive activity that cannot be fully captured by propositional content without losing its force. The rule is the engine, not the fuel. Even Isabelle, which encodes object-rules as meta-axioms, relies on a deeper kernel validating the meta-logic. Thus, all designs presuppose a layer of unexamined inference. The fundamental presupposition is that mechanical verification provides a surrogate for epistemic certainty, grounding deduction in physical reliability rather than abstract intuition. The system assumes that if the code runs correctly, the inference holds, bypassing the need for further justification. By making rules unauditable, the design asserts they are not hypotheses subject to falsification but conditions of possibility for the proof itself. The kernel does not argue for the rules; it enacts them. Therefore, the justification is performative. The system presupposes that the user accepts the kernel's authority as a precondition for using the tool.

  3. Presupposition or mere fit
  The practice strictly requires only that inference rules be distinct from axioms in implementation; it does not strictly presuppose a specific philosophical justification for this distinction. It is compatible with Carroll's view (rules as licenses), but also with formalism (rules as symbol manipulation), inferentialism (meaning as use), or even coherentism (rules justified by the system's overall success). The design is philosophically underdetermined. It requires a regress-stopper, but not a theory of why that stopper is valid. The asymmetry between rules and axioms is structural, not necessarily ontological. However, the practice does presuppose that rules are safe enough to remain unaudited, unlike axioms. The system remains neutral on whether rules are analytic, synthetic, or conventional. It merely enforces a hierarchy where rules govern axioms. Thus, while the architecture mirrors Carroll's distinction, it does not commit the user to Carroll's philosophy. It allows rival accounts to coexist, provided they accept the kernel's authority. Strictly, it presupposes only that verification must terminate somewhere trusted. The crucial constraint is engineering: the kernel must be small enough to be trusted. This engineering constraint mimics a philosophical foundationalism but doesn't entail it. Thus, it is compatible with multiple epistemologies. It forces a structural distinction between rule and premise, but leaves the metaphysical status of that distinction open. The only strict presupposition is operational: there must be a fixed set of operations deemed valid without further proof. Beyond that, the philosophy is optional.

  4. The rule/axiom asymmetry
  The asymmetry presupposes that inference rules carry negligible epistemic risk compared to axioms. Axioms are treated as contingent claims requiring disclosure; rules are treated as necessary truths or safe operations. This assumes rules are truth-preserving absolutely, whereas axioms are truth-claims subject to error. However, this view is internally tense. Rules like ex falso quodlibet are safe only relative to consistency, which the system cannot verify (by Gödel). If the logic is inconsistent, rules propagate error instantly. Thus, rules carry hidden consistency risk. The system audits explicit assumptions but ignores the structural assumption of consistency. This suggests the asymmetry is pragmatic, not epistemic: rules are stable across theories, axioms vary. But it falsely implies rules are risk-free. The design assumes consistency is a background condition, not a dependency to track. This is consistent only if one views consistency as a precondition for meaning itself, not a theorem. If consistency is contingent, the asymmetry hides risk. The practice assumes users accept the logic's consistency as a package deal with the tool. It treats logical validity as distinct from theoretical truth. The asymmetry thus presupposes logic is privileged over theory, shielding rules from the scrutiny applied to axioms. By not auditing rules, the system implies they are constitutive of rationality itself, whereas axioms are merely claims within rationality. This distinction holds only if the kernel logic is indeed sound. If the kernel is buggy, the rules are unsafe. Thus, the asymmetry presupposes the kernel's implementation is perfect, shifting epistemic risk from logic to engineering.

  5. If the tortoise got her way
  If the tortoise prevailed, every inference step would require a proof that the rule used was valid. The kernel would need to verify not just the step, but the justification for the rule permitting the step. This leads to infinite regress: validating the rule requires a higher-order rule, ad infinitum. A terminating checker is impossible under this constraint. To build one, rules would become axioms, requiring a meta-rule to apply them, which would also need justification. The system would never produce a result, stuck verifying its own machinery. Alternatively, the checker would need to accept a hierarchy of meta-logics, each validating the one below, but the top level would still require unverified rules. Thus, a practical proof checker presupposes the tortoise is wrong about practice: we must stop somewhere. The only way to build a checker is to hardwire some rules, accepting them as brute facts. The tortoise's demand destroys the possibility of verification by demanding justification for the very mechanism of justification.
