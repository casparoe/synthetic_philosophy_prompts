  8.  **Final Polish:** (Mental check of the "Honor" flip). In dueling, the honor flipped from "brave" to "bully." In smoking, it flipped from "sophisticated" to "addict/inconsiderate." The "inconsiderate" part is key because of secondhand smoke.

  *(Self-Correction on the "Pledge"):* There wasn't a formal "I pledge not to smoke" movement like the footbinding one. However, the "Smoke-Free Family" or workplace policies functioned similarly. I should clarify that distinction.

  *(Self-Correction on Class):* Appiah argues honor is about the "respectable" class. If the practice becomes "low class," the respectable class has successfully abandoned it. So the persistence among the poor actually *supports* Appiah's specific claim about how elite honor drives change, even if the practice doesn't vanish globally.

