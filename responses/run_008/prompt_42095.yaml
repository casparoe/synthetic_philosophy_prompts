answer: |-
  Appiah's model fits the smoking case surprisingly well, provided you accept that "moral revolution" doesn't require the total extinction of a practice, but rather its expulsion from the sphere of respectable life. If you map the timeline, **Argument** leads (1964 Surgeon General), **Interest** aligns mid-game (airlines and employers realizing smokers cost more in cleaning, insurance, and productivity losses), but **Honor** is the closer. The 1964 report provided the moral ammunition, but smoking rates barely dipped for decades. The practice remained honorable—cool, adult, rebellious—because the social cost hadn't flipped. The pivot point was the secondhand smoke argument in the 80s and 90s. This transformed smoking from a *self-regarding* vice (like dueling) into an *other-regarding* assault. Once smoking was reclassified as imposing harm on non-consenting others, the honor calculus inverted. It stopped being a mark of sophistication and became a mark of selfishness. By the time NYC banned bars in 2003, the honor work was done: smoking in a group setting signaled that you valued your urge over the group's well-being.

  However, your intuition about the class stratification is the critical stress test for Appiah's thesis. Appiah argues that honor codes are driven by the "respectable" class looking to distinguish themselves from the "vulgar." In the smoking case, the respectable class (professionals, elites) abandoned the practice to signal health, discipline, and consideration. The "pledge" dynamic you mention wasn't a formal society like the anti-footbinding leagues, but it was institutionalized through workplace policies and dating markets. A "smoke-free workplace" is effectively a collective pledge: *we, the respectable employees, do not do this here.* To smoke was to opt out of the professional class. This confirms Appiah's thesis regarding the *elite* abandonment of the practice. The fact that smoking persists among the working class and poor doesn't disprove the honor model; it validates the sociological mechanism Appiah describes. Honor is relative. For the elite, smoking now costs honor. For some marginalized groups, it may still function as a coping mechanism or a subcultural signal, but it has lost its *universal* honor currency. The practice didn't die; it was gentrified out of existence.

  Where the model goes silent, however, is on the role of law and the specific nature of "harm." Appiah's cases (dueling, footbinding) rely on social stigma preceding or replacing law. With smoking, the secondhand smoke argument allowed the state to intervene as a protector of rights, not just an enforcer of manners. The shame wasn't just that smoking was *uncool*; it was that it was a *violation*. This accelerated the timeline compared to dueling. Furthermore, Appiah suggests arguments usually follow the honor shift to tidy up. With smoking, the scientific argument (health/harm) arguably *preceded* the honor shift by thirty years. This suggests a hybrid model: the Argument created the conditions for the Interest to align (litigation, insurance), which created the space for the Honor flip to stick. So, it was a moral revolution, but one where the "moral" was hygiene weaponized by class interest. The honor thesis holds for the *status* of the smoker, but the *eradication* (or containment) was driven by the unique ability to frame the habit as a trespass against others' bodies.
