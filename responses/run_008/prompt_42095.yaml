prompt: |-
  I quit smoking about two years ago (not a humblebrag, it was mostly becuse cigarettes got so damn expensive) and ever since Ive been kind of obsessed with how fast smoking went from totally normal to basically shameful. My parents' generation smoked in hospitals, on airplanes, at their desks. Now the couple of smokers left at my office huddle outside by the loading dock like they're doing something criminal. Around the same time I quit I reread Kwame Anthony Appiah's popular book on moral revolutions — The Honor Code — where he tries to explain how practices like dueling, footbinding, and the Atlantic slave trade actually died. His whole pitch is that moral arguments by themselves never do it: you need honor to flip (the practice stops conferring respect and starts costing it), plus material interests lining up on the right side, and the arguments mostly show up after the fact to tidy things up. He leans on Bernard Williams for the dueling analysis, something about dueling dying out when it stopped doing honor-work, though I confess I forget the exact mechanism.

  So here's my question: take the fall of smoking and run it through that model. The rough timeline as I understand it: the 1964 Surgeon General report on smoking and health, the secondhand smoke findings piling up in the 80s and 90s, smoking banned on US domestic flights around 1990, California banning it in bars in 1998, New York City in 2003, and now basically everywhere indoor in the Western world. Map that onto Appiah's three pieces — argument, interest, honor — and tell me which one was actually doing the work, and when. Was it even a moral revolution at all, or just a hygiene regulation plus forty years of people watching their relatives die of lung cancer? And here's the part I keep chewing on: unlike dueling or footbinding, smoking never actually ended, it just got reclassified from a glamorous universal habit into a lower-class vice. So does the case confirm the honor thesis, or does it show the thesis only explains the respectable version of a practice dying, and the unrespectable version just gets pushed outside the building?

  If you think the honor story holds up here, spell out what it would even look like — who lost honor, who gained it, whether there was something like the anti-footbinding pledge dynamic he describes (where people bound their reputations together by promising not to bind their daughters' feet / not to marry their sons to such families). And be honest about where the model goes silent or misdescribes things — the secondhand smoke point in particular seems to make this a harm-to-others argument from early on, which is not really how his cases work. A few paragraphs is fine, I'd rather have careful mapping than a lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The decline of smoking in the West (specifically US/UK context implied) analyzed through Kwame Anthony Appiah's *The Honor Code* framework.
      *   **Appiah's Framework:** Three components: Argument (moral reasoning), Interest (material/economic incentives), Honor (social status/respect). Appiah argues Argument alone fails; Honor flipping (practice goes from honorable to shameful) + Interest alignment drives change; Argument often rationalizes post-hoc.
      *   **Specific Questions:**
          *   Map the smoking timeline (1964 Surgeon General -> 90s bans -> present) onto Argument, Interest, Honor.
          *   Which component did the heavy lifting, and when?
          *   Was it a "moral revolution" or just hygiene/regulation + death watching?
          *   Address the class aspect: Smoking didn't end, it became a lower-class vice. Does this confirm or weaken the honor thesis?
          *   Identify the "honor mechanism": Who lost/gained honor? Was there an "anti-footbinding pledge" equivalent?
          *   Critique the model: Where does it fail? (Specifically regarding secondhand smoke/harm-to-others).
      *   **Tone/Style:** Careful mapping, honest critique, not a lecture, a few paragraphs (concise but dense).

  2.  **Deconstruct Appiah's Model vs. Smoking History:**
      *   *Argument:* 1964 Surgeon General (health risks). 1980s/90s (secondhand smoke). This is the "moral/hygiene" reasoning.
      *   *Interest:* Cost of cigarettes (user mentioned this), cost of healthcare/insurance for employers, productivity loss, litigation (Big Tobacco settlements).
      *   *Honor:* Smoking went from "cool/adult/rebellious" (Mad Men era) to "dirty/addicted/inconsiderate."
      *   *Timeline:*
          *   1964-1980: Argument exists, Honor mostly intact (cowboys, doctors in ads earlier, but shifting). Interest neutral or pro-tobacco.
          *   1980-1995: Secondhand smoke argument rises. Honor starts dipping (smokers asked to sit in back). Interest shifts (airlines want to save money/clean planes).
          *   1995-Present: Honor crash. Bans everywhere. Smoking = social suicide in professional settings.

  3.  **Address the "Moral Revolution" vs. "Hygiene" Question:**
      *   Appiah counts hygiene/health as part of the *Argument*, but the *Honor* shift is what makes it a moral revolution in his sense.
      *   Smoking is distinct because it involves harm to others (secondhand smoke). Appiah's cases (dueling, footbinding) are often self-harm or consensual harm within a code. Secondhand smoke makes it a liberty violation, which accelerates the honor shift.

  4.  **Address the Class/Exclusion Aspect:**
      *   User's insight: Smoking didn't die; it was class-stratified.
      *   Does this fit Appiah? Appiah focuses on the *elite* abandoning the practice first. In footbinding, elites stopped, then it trickled down/died out. In smoking, elites stopped, but it persisted among the working class/poor.
      *   This suggests the Honor shift is *class-coded*. It confirms the honor thesis for the *respectable* classes but shows the limits of the thesis regarding total eradication.

  5.  **Drafting the Response - Section by Section:**

      *   *Introduction:* Acknowledge the fit. Smoking is a textbook Appiah case, but with a twist (persistence among lower classes).
      *   *Mapping the Three:*
          *   *Argument:* 1964 starts it, but didn't stop smoking. Secondhand smoke (80s/90s) was the game changer because it moved from "self-harm" to "harming others."
          *   *Interest:* Airlines (cleaning costs), Employers (insurance/productivity), States (taxes vs. healthcare costs). User's point about price is key here.
          *   *Honor:* The crucial flip. From "glamorous" to "pariah."
      *   *The Mechanism:* Who lost honor? The smoker. Who gained? The non-smoker (virtuous, healthy, considerate). Was there a pledge? Not a formal one, but "Smoke-free workplace" policies acted as institutional pledges. Dating/marriage markets shifted (non-smokers won't date smokers).
      *   *The Critique (Class & Harm):*
          *   *Harm:* Appiah's model struggles slightly here because secondhand smoke makes it a rights violation, not just an honor code violation. The "shame" is backed by law faster than dueling was.
          *   *Class:* The practice didn't die; it was exiled. Appiah explains the *elite* abandonment well. The persistence among the poor suggests honor is relative to class. For the elite, smoking costs honor. For some subcultures, it might still signal toughness/authenticity, but generally, it's a "stigma" now.
      *   *Conclusion:* It confirms the thesis for the *social mainstreaming* of the ban, but highlights that honor is a currency that devalues differently across class lines.

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I address Bernard Williams/Dueling? The user mentioned it. I should briefly nod to the "honor-work" concept. Dueling stopped when it looked ridiculous, not just deadly. Smoking stopped when it looked pathetic, not just deadly.
      *   *Check:* Did I address the "pledge"? Appiah loves the pledge (like the anti-footbinding societies). For smoking, it's more about "Smoke-Free Generations" or corporate policies. I need to be careful not to invent a pledge that didn't exist, but identify the *functional equivalent*.
      *   *Check:* Keep it tight. User said "A few paragraphs is fine." Don't write an essay.
      *   *Tone:* Intellectual but conversational. Match the user's level of familiarity with the text.

  7.  **Final Review against constraints:**
      *   Map Argument, Interest, Honor? Yes.
      *   Which did the work/when? Yes (Honor/Interest late 90s).
      *   Moral revolution or hygiene? Yes (Hygiene provided the ammo, Honor fired the gun).
