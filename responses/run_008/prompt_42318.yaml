answer: |-
  This is a classic tension between *instrumental rationality* (what maximizes my payoff) and *moral rationality* (what maintains my integrity as a cooperator). Your intuitions are actually quite sophisticated; they suggest you are already rejecting the pure "Homo Economicus" model in favor of something more relational.

  There is a single principle that reconciles almost all of your verdicts, but it requires you to adjust your view on the **Announced Final Round**.

  ### The Principle: Invited Reliance

  **The Principle:** *Defection is permissible only when you have not invited another party to rely on your cooperation. Once you have induced a reasonable expectation of reciprocity—through explicit agreement, established pattern, or accepted role—defection becomes a form of exploitation, regardless of whether retaliation is possible.*

  This is distinct from the "Shadow of the Future." The Shadow of the Future is about *fear* (I won't defect because I'll get punished). Invited Reliance is about *obligation* (I won't defect because I led you to trust me).

  Here is how your cases stack up against this principle:

  **1. One-shot game against a stranger: Fine.**
  *   **Analysis:** No history exists. You have not signaled that you are a cooperator. The stranger cannot reasonably rely on you to cooperate because there is no precedent.
  *   **Verdict:** Consistent. No reliance was invited.

  **2. Repeated game against Tit-for-Tat: Not fine.**
  *   **Analysis:** By cooperating in previous rounds, you established a pattern. The TFT player is cooperating *because* you cooperated. You have invited them to rely on your continued cooperation. Defecting exploits that specific trust.
  *   **Verdict:** Consistent. Reliance was invited and then violated.

  **3. Announced final round: Fine (but uneasy).**
  *   **Analysis:** This is the outlier. Strategically, you are correct: there is no future punishment. But morally, you have benefited from the opponent's cooperation in rounds 1 through 99 *based on the pattern you built together*. To defect in round 100 is to retroactively turn the previous 99 rounds into a trap. You invited reliance for the duration of the relationship; cutting it off one move early to extract a bonus is exploiting the trust built during the relationship.
  *   **Verdict:** **Inconsistent.** Your unease is your moral compass correcting your game theory. Under the principle of Invited Reliance, this is **not fine**. It is a "breach of the spirit" even if it adheres to the "letter" of the end-game.

  **4. Large group gift (rounding error): Fine.**
  *   **Analysis:** This hinges on the word "gift." Contributions are voluntary. Unless you publicly pledged a specific amount that others matched, the group cannot reasonably rely on your specific contribution, especially if it is negligible.
  *   **Verdict:** Consistent. No specific reliance was invited.

  **5. Secretly skipping snack duty: Not fine.**
  *   **Analysis:** Unlike the gift, a rotation is a **duty**, not a voluntary contribution. By remaining in the group and accepting snacks from others, you implicitly accept the role of provider when your turn comes. "Secretly" skipping adds deception; you are allowing others to rely on you while knowing you won't deliver.
  *   **Verdict:** Consistent. You accepted a specific role and invited reliance.

  ### The Verdict That Has to Go

  To maintain moral consistency, you must revise your verdict on **Case 3 (The Announced Final Round)**.

  If it is wrong to defect against a Tit-for-Tat player because it exploits their trust, it is also wrong to defect on the final round of a long cooperation. The fact that the game is *announced* to end makes it a trap. You are essentially saying, "I will act as a cooperator as long as it suits me, and switch to predator the moment you are vulnerable." That violates the integrity of the relationship you built over the previous rounds.

  ### The Tourist Diner Case

  Now, let's apply the Principle of Invited Reliance to your undecided case: *A diner in a tourist town gives indifferent service to one-time visitors, assuming they will return regardless.*

  **The Analysis:**
  1.  **Is there an expectation?** Yes. In a commercial transaction, the menu and prices create an implicit contract. The customer relies on the price to reflect a standard of service and food quality.
  2.  **Is there reliance?** The tourists rely on the norms of the dining industry. Even if they are tourists, they are not strangers in the "one-shot game" sense; they are participants in a market with established rules.
  3.  **Does the "Shadow of the Future" matter?** The diner's logic is that the Shadow of the Future is broken (tourists return anyway). But under Invited Reliance, the threat of punishment doesn't create the obligation; the **transaction** does.
  4.  **The Exploitation:** The diner is effectively charging for "good service" (via standard prices) while delivering "indifferent service." They are inviting the tourists to rely on a standard of exchange that they do not intend to fulfill.

  **The Verdict:**
  **Not Fine.**
  Even if the tourists keep coming (perhaps due to lack of options or ignorance), the diner is violating the implicit contract of commerce. They are extracting value based on a false premise of quality. It is structurally identical to the **Snack Case**: accepting the benefits of a system (customers paying prices) while secretly shirking the obligation (providing commensurate service).

  ### Summary
  Your gut is telling you that morality in games isn't about *consequences* (will I get caught?), but about *integrity* (did I invite trust?).

  *   **Strategy asks:** "Can I get away with this?"
  *   **Integrity asks:** "Did I lead them to count on me?"

  If you adopt the **Principle of Invited Reliance**, you resolve the tension. You keep your verdicts on the stranger, the gift, and the snacks. You validate your unease about the final round by admitting that defection there is indeed morally suspect. And you classify the tourist diner not as a smart business, but as a free-rider on the reputation of the dining industry itself.
