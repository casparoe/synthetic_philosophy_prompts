      *   American English? (Yes).

  7.  *(Final thought on the "Verbal" claim)*: The user suggests it's verbal because one side cares about agency and the other about process. I need to point out that *why* they care about those things reveals a substantive disagreement about what constitutes a "person." If a person is a unified agent, Intentionalism is hard. If a person is a bundle of drives, Deflationism is easy. That's metaphysics, not just semantics. I will emphasize this.

