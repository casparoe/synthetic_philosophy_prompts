              2.  *Normativity:* Do we need intention to blame someone? (Ethical question).
          *   *Conclusion on this:* It's not *merely* verbal. It's a clash between conceptual analysis (philosophy's traditional tool) and naturalism (fitting philosophy to science).

      *   **Section 3: Paths to Progress:**
          *   *Stipulated Split:* (e.g., "Strong" vs. "Weak" self-deception). This happens often but doesn't solve the core tension.
