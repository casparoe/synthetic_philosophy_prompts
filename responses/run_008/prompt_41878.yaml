          *   *Deflationists:* Focus on Mele's "deflationary account." They claim the "intention" is a philosophical fiction. The psychology is just desire + bias.
          *   *Analysis:* Show how they talk past each other. Intentionalists ask "How is agency preserved?" Deflationists ask "How is this psychologically plausible?"

      *   **Section 2: Substantive vs. Verbal:**
