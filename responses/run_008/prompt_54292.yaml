      *Refining Definition (b):* If I define deception purely as "causing false belief," then accidental misunderstandings count. That's a known flaw of (b). In this scenario, the bot *caused* it via pragmatics. So (b) says Deceptive.
      *Refining Definition (c):* Intent. Bot has no mind. So (c) says Not Deceptive.
      *Refining Definition (d):* Cooperative expectations. This is the Gricean view. Says Deceptive.

      *Wait, one nuance:* The prompt asks to stress-test "honesty... defined purely behaviorally as 'never output falsehoods'." This corresponds to Definition (a). The scenario is designed to break (a).

