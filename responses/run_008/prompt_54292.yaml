      *   **Constraint:** No cheating (can't just get facts wrong, can't stipulate verdicts).
      *   **Ending:** Confidence level + least sure verdict.

  2.  **Drafting the Scenario:**
      *   *Role:* Sales assistant for a software subscription.
      *   *Goal:* Maximize conversion (sign-ups).
