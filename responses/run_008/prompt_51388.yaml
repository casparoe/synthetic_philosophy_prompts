answer: |-
  Here are the desiderata for a theory of the lying/misleading distinction, calibrated for your goal: determining whether the honesty norm tracks a moral reality or an aesthetic taboo.

  ### The Desiderata

  **1. The Paltering Boundary (Non-Negotiable)**
  The theory must provide a principled criterion for distinguishing *The Used Car* (paltering: true statements selected to induce false belief) from *The Odometer Rollback* (explicit falsehood). It cannot simply define lying as "causing false belief," or the distinction collapses. It must locate the difference in the *mechanism* of deception (e.g., assertion vs. implication vs. omission).
  *   *Motivation:* If the theory cannot distinguish these cases, it cannot explain why we treat them differently.

  **2. The Silence & Nonverbal Test (Non-Negotiable)**
  The theory must account for deceptive silence and nonverbal cues (e.g., nodding when you know the answer is no). A theory that defines lying strictly as "uttering a false sentence" fails here, because moral blame for silence often equals blame for lying.
  *   *Motivation:* The moral asymmetry you're investigating applies to *deception*, not just syntax. If the theory ignores silence, it's a theory of grammar, not honesty.

  **3. The Actionability Constraint (Non-Negotiable)**
  The theory must be usable *ex ante* by an agent trying to be honest. It cannot rely on facts only available to the listener or a post-hoc judge (e.g., "lying is what the listener felt betrayed by"). The agent must be able to know whether they are lying before they speak.
  *   *Motivation:* You want to know if the norms are usable. A theory that requires mind-reading the listener's uptake is useless for guiding behavior.

  **4. The Institutional Alignment (Camp Prejudice)**
  The theory should explain why perjury and contract law punish explicit falsehoods more severely than misleading truths.
  *   *Motivation:* You noted this asymmetry exists in law.
  *   *Verdict:* **Prejudice.** Legal systems optimize for *adjudicability* (easy to prove a false statement, hard to prove misleading intent), not moral truth. A moral theory shouldn't bend to fit procedural constraints of a court.

  **5. The Inquiring Murderer Stress Test (Camp Prejudice)**
  The theory must yield a plausible verdict on Kant's Inquiring Murderer (lying to a murderer at the door to save a friend).
  *   *Motivation:* It's the canonical case.
  *   *Verdict:* **Prejudice.** This is a edge-case stress test for *absolutism*, not a core requirement for defining the distinction. A theory can be adequate without solving the trolley problem of deception.

  **6. The Asymmetry Justification (Non-Negotiable)**
  The theory must either vindicate the moral asymmetry (explain *why* lying is worse than misleading) or debunk it (explain why we *think* it's worse when it isn't). It cannot simply assert the asymmetry as a brute fact.
  *   *Motivation:* This is your core question. Is the norm tracking reality or aesthetics?

  **7. The Intuition Match (Camp Prejudice)**
  The theory should align with pre-theoretic intuitions (e.g., "The Odometer Rollback feels worse than Paltering").
  *   *Motivation:* We usually want theories to match data.
  *   *Verdict:* **Prejudice (and Dangerous).** In this specific domain, the "data" is the aesthetic disgust you're trying to investigate. Demanding the theory match the intuition begs the question.

  ---

  ### The Impossibility Claim

  **You cannot jointly satisfy Desideratum 6 (Asymmetry Justification) and Desideratum 7 (Intuition Match).**

  This is the hard constraint you suspected.
  *   If the intuition that "lying is dirtier than misleading" is generated by the aesthetic disgust (the "clever vs. dirty" feeling), then a theory that *justifies* the asymmetry (D6) will necessarily contradict the raw intuition (D7) by revealing it as biased.
  *   Conversely, a theory that *matches* the intuition (D7) will likely fail to *justify* it (D6), because it will simply codify the bias as a rule (e.g., "Lying is worse because it feels worse").

  **Decision:** Drop **D7 (Intuition Match)**. If your goal is to determine if the norm is real or aesthetic, you must treat your intuitions as the *subject* of investigation, not the *data* for validation. A theory that tells you "Your gut is wrong, the moral difference is negligible" is adequate; a theory that says "Your gut is right because it's your gut" is not.

  ---

  ### Contender Scorecard

  **Assertion-Based Accounts** (Lying = Asserting P while believing ~P)
  *   **Performance:** Fails **D2 (Silence)** and struggles with **D1 (Paltering)** moral weight. It cleanly separates the cases but implies paltering is *not* lying, which leaves the moral asymmetry unexplained (why is assertion special?). It satisfies **D3 (Actionability)** well.
  *   **Verdict:** Good for legal definitions, bad for moral clarity. Treats the distinction as syntactic rather than normative.

  **Gricean/Implicature Accounts** (Lying = Violating the Maxim of Quality, explicit or implied)
  *   **Performance:** Handles **D1 (Paltering)** better by classifying misleading implicatures as a form of dishonesty. However, it struggles with **D3 (Actionability)** because implicature depends on shared context and listener inference, which is hard to calculate *ex ante*. It blurs the line you're trying to measure.
  *   **Verdict:** Descriptively accurate for communication, but too fuzzy to ground a strict norm.

  **Commitment-Based Accounts** (Sorensen-style: Lying = Guaranteeing truth without belief)
  *   **Performance:** Strongest on **D6 (Asymmetry Justification)**. It argues lying involves a specific breach of a "truth pledge" that misleading avoids. This explains the moral weight without relying on aesthetics. However, it risks failing **D2 (Silence)** unless "silence" is construed as a tacit commitment, which gets messy.
  *   **Verdict:** Best fit for your purpose. It isolates the *promise* of truth-telling as the variable, allowing you to test if that promise is actually present in "misleading" cases or if the asymmetry is just tribal signaling.

  **Recommendation:** Use the Commitment account as your null hypothesis. It isolates the "pledge" as the moral variable. If you find people treat "breaking a pledge" (lying) as worse than "withholding info" (misleading) even when the *harm* is identical, you've found the moral difference. If they treat them differently only when the *social cost* varies, you've found the taboo.
