      *   *The Tension:* Economists think it justifies ignoring realism. Philosophers think realism matters for explanation/mechanism.

  3.  **Develop the "Menu of Readings":**
      *   *Reading 1: The Abstraction/Truism Reading.* To explain a lot with a little, you must ignore details. Significant = general. General = abstract. Abstract = unrealistic details.
          *   *Status:* Trivial/True.
          *   *Licenses Dismissal?* No. It explains *why* assumptions are unrealistic, but doesn't justify ignoring *relevant* inaccuracies.
      *   *Reading 2: The 'As-If' Instrumentalist Reading.* Agents behave *as if* they maximize, even if they don't calculate. Assumptions aren't descriptions of psychology; they are predictive tools.
          *   *Status:* Substantive/Debatable (Friedman's billiard player example).
          *   *Licenses Dismissal?* Yes, but conditionally. Only if predictions hold.
      *   *Reading 3: The Strong F-Twist (Unrealism as Virtue).* The *more* unrealistic, the *better*. Realism is inversely correlated with significance.
          *   *Status:* False/Howler. (Musgrave's target).
          *   *Licenses Dismissal?* Yes, aggressively. But it's the philosophically weakest link.
      *   *Reading 4: The Dialectic/Defense Reading.* Defense against empirical surveys (Hall/Hitch) showing businessmen don't calculate MC=MR. Friedman argues the *validity* of the theory doesn't depend on the *motives* reported.
          *   *Status:* Substantive/Defensible (in context).
          *   *Licenses Dismissal?* Yes, regarding *motivational* realism, but not necessarily *structural* realism.

  4.  **Evaluate the "Seminar Usage":**
      *   The usage is: "Student says assumption X is unrealistic." Economist says: "Friedman says important theories have unrealistic assumptions. QED."
      *   Does Reading 1 license this? No, because abstraction doesn't mean *wildly* inaccurate on *crucial* variables.
      *   Does Reading 2 license this? Only if the model predicts well. The seminar usage skips the prediction check.
      *   Does Reading 3 license this? Yes, but it's false.
      *   Does Reading 4 license this? Only if the complaint is about internal reasoning, not market structure.

  5.  **Integrate Musgrave:**
      *   *Musgrave's Taxonomy:*
          1.  *Negligibility Assumptions:* Factor is present but negligible (e.g., air resistance in some physics).
          2.  *Domain Assumptions:* Theory applies only if condition holds (e.g., perfect competition applies only to commodity markets).
          3.  *Heuristic Assumptions:* Temporary simplifications to build the model (to be relaxed later).
      *   *Application:* Musgrave argues Friedman conflated these.
      *   *Defusing:* Musgrave defuses the "Strong F-Twist" (Reading 3). You can't say unrealism is *good*. You must say the assumption is negligible or defines the domain.
      *   *Seminar Usage:* The student complaint (perfect knowledge, no strategy) sounds like a Domain or Negligibility issue. If the economist treats it as Domain ("This model only works for wheat markets"), the dismissal is valid *if* the scope is acknowledged. If they treat it as Negligible ("Strategy doesn't matter"), they need evidence. Musgrave shows the seminar usage is sloppy because it doesn't specify *which* type of assumption is being defended.

