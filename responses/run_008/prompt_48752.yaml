  (2) If I'm a Boltzmann brain, my memories, including the memories of astronomical observations that support the theory, are just noise -- they carry no information about anything outside my skull.
  (3) So if the theory is true, my evidence gives me no justification for believing it.
  (4) A theory that destroys any justification for believing it cannot rationally be believed (he called this cognitive instability).
  (5) Our best cosmology -- accelerating expansion, eventual de Sitter phase, thermodynamic fluctuations over unimaginable timescales -- does imply Boltzmann brains vastly outnumber ordinary observers.
  (6) So our best cosmology cannot rationally be believed, and (7) we should revise or drop the cosmology.

  He's real smug about (7). Here's what bugs me though. The fluctuations are ultimately a prediction of statistical mechanics, which sits in the same evidence base as everything else, so his argument seems to make stat mech itself self-undermining, and nobody's about to give up stat mech. And it also seems like ANY theory on which people like me are a tiny minority of all observers -- huge universe full of aliens, say -- would trigger the exact same reasoning, which can't be right. When I raised this he said I was confusing my memories being false with my evidence being unreliable, or something, and I lost the thread.

  So: pick the step you'd actually reject and commit to it, with your reasons, and tell me honestly what that costs you. If you deny (5), I want to know whether that's scientifically respectable or just motivated reasoning about dark energy. If you deny (1), I want to know how I'm still allowed to use self-locating probabilities everywhere else, like in Sleeping Beauty-type cases. And if you think the argument is actually fine all the way through and he wins, say that too and tell me why the parity worry fails.
