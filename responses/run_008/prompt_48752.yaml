  My friend and I went til 3am on this and now I want someone to actually adjudicate, not hand me a menu of positions. Background: he's been reading pop cosmology stuff about the heat death of the universe and Boltzmann brains, and he's convinced modern cosmology refutes itself. His argument, numbered like he insisted on doing:

