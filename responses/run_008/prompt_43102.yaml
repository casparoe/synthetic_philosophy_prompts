answer: |-
  Your suspicion is mechanically correct but ontologically incomplete. You're right that the debate maps onto estimator assumptions, but wrong that this makes it "boring." The core friction isn't just about bias; it's about whether the estimand exists independently of the estimation procedure.

  **Translation**

  *   **Ranke:** The past is a fixed estimand ($\theta$). The archive is a high-fidelity sampling frame. Rigorous archival method is an unbiased, consistent estimator ($\hat{\theta}$). Error is random noise; truth is recoverable via variance reduction.
  *   **Carr:** The sampling frame is endogenous. Historians perform non-random sampling based on contemporary values, introducing unadjusted selection bias. The estimand is conditional on the historian's query; there is no population average treatment effect, only subpopulation effects defined by the historian's lens.
  *   **White:** Model class misspecification. The data generating process (DGP) lacks inherent narrative structure. There is no true $f(x)$. Narratives are smoothing functions imposed on sparse data. Choosing a plot (tragedy, comedy) is hyperparameter tuning driven by aesthetics or ideology, not cross-validation loss.

  **Residue Report**

  The translation holds well for Carr (selection bias) and White (regularization choices). It strains on Ranke. Your vocabulary assumes a true DGP exists waiting to be estimated. White argues the *structure* of the DGP is imposed by the modeler.

  This is the remainder: In data science, we assume $\theta$ is ontologically prior to $\hat{\theta}$. White claims the narrative structure of $\theta$ is created by $\hat{\theta}$. It's not just that every estimator has assumptions; it's that the assumptions construct the reality being estimated.

  So, is the debate "boring"? No. It's the difference between assuming a true label exists (supervised learning) versus claiming the labeling scheme is itself a social construct (unsupervised clustering projected as supervision). Your toolkit handles bias and variance well, but it treats the estimand as sacred. The historians are arguing about the divinity of the estimand. You assume the past is data; White argues the past is only data once you've decided what counts as a signal. The "radical" claim isn't that estimates are biased; it's that the target variable is engineered by the modeler. Your vocabulary lacks a term for "ontologically unstable estimand," which is precisely White's point.
