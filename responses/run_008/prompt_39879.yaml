  This is a fantastic dataset. Dana is a classic "field specimen" of a specific cluster of intuitions that keeps population ethicists up at night. She is consistently rejecting **Total Utilitarianism** (the view that more good lives = better world) and leaning heavily into **Person-Affecting** constraints.

  Here is the breakdown of her operating system, your predictions, and the one question that will crack her code.

  ### 1. Predictions on New Cases

  Based on her track record, here is how Dana will likely rule on your three new cases.

  **Case 1a: The Policy Trade-off**
  *   **Scenario:** Prevent one -5 life, but 8 billion existing people drop from +80 to +79.
  *   **Prediction:** **The policy is not worth it (Impermissible).**
  *   **Why:** This is the tension point between *preventing misery* and *harming existing people*. In Case 5, she prioritized improving the lives of existing people over creating a new happy person. In Case 6, she prioritized the high welfare of the 8 billion over the massive quantity of the 80 billion. She treats the 8 billion as "moral patients" who have claims, whereas the unborn -5 person does not exist to have a claim. On her view, you cannot sacrifice the welfare of actual people (even slightly) to prevent the existence of a potential person, because the potential person is not *harmed* by never existing (per her Case 2 verdict).

  **Case 1b: The Non-Identity Problem (Sam vs. Robin)**
  *   **Scenario:** Conceive now (Sam, +30) or wait (Robin, +70). Different children.
  *   **Prediction:** **Morally indifferent / No obligation to wait.**
  *   **Why:** This is the classic Non-Identity Problem. Since Sam would not exist if they waited, Sam is not *harmed* by being conceived now (his alternative is non-existence, which she views as neutral in Case 2). Since Robin doesn't exist in the first option, Robin isn't harmed either. Because she believes creating a happy life adds no moral value (Case 3: +40 person changes nothing), she likely views creating a +30 life vs. a +70 life as a wash. Neither is "wrong," and neither is "better."

  **Case 1c: The Risky Gamble**
  *   **Scenario:** 50% chance of +85, 50% chance of -5 vs. No kid.
  *   **Prediction:** **Wrong / Impermissible.**
  *   **Why:** This fits her "Asymmetry" perfectly. She views creating a miserable life as a strict negative (Case 1 & 4), but creating a happy life as neutral (Case 2 & 3). The expected value might be positive, but she isn't doing expected utility math; she's applying a constraint. The risk of committing the "wrong, full stop" act (creating a -5 life) outweighs the chance of performing a neutral act (creating a +85 life).

  ---

  ### 2. What Rule Is She Running?

  You are right that it isn't Total Utilitarianism. Her data eliminates the two most common population ethics theories immediately. She is running a hybrid system. Here are the two top contenders that fit her track record equally well:

  **Theory A: The Narrow Person-Affecting View (PAV) + The Asymmetry**
  *   **The Rule:** An outcome can only be *better* if it is better for *someone* who exists in both outcomes. We have a duty not to create people who will suffer, but no duty to create people who will be happy.
  *   **Fit:**
      *   Explains why adding a +40 person is neutral (it's not better for anyone).
      *   Explains why adding a -5 person is worse (it's worse for that child).
      *   Explains why she chose improving existing lives (Case 5) over adding new ones (benefits actual people).
      *   Explains why she rejects the Repugnant Conclusion (Case 6): The 8 billion are worse off in the +2 world.

  **Theory B: Critical-Level Utilitarianism (CLU) with a High Critical Level**
  *   **The Rule:** A life only adds value if its welfare exceeds a certain "critical level" (let's say +50). Lives below that level add negative value (or zero).
  *   **Fit:**
      *   If the Critical Level is around +50:
      *   Adding a +40 person adds negative/zero value (fits Case 3).
      *   Adding a -5 person adds massive negative value (fits Case 4).
      *   80 Billion at +2 is a disaster because $2 < 50$ (fits Case 6).
      *   Improving 8 billion existing people (Case 5) generates way more value than adding one person above the critical level.
  *   **The Glitch:** Standard CLU usually says a life *below* the critical level makes the world *worse*. Dana said the +40 person made the world "morally the same." This requires a specific "soft" version of CLU where lives between 0 and the Critical Level are neutral.

  **Diagnosis:**
  Dana is most likely a **Person-Affecting Theorist**. The "morally the same" verdict on the +40 person is the smoking gun. A Critical-Level theorist usually thinks adding a sub-par life drags the average down or adds negative value. Dana thinks it does *nothing*. That implies she doesn't think "value" exists impersonally; she thinks morality is about how we treat *specific people*.

  ---

  ### 3. The Killer Question

  To distinguish between **Person-Affecting View (PAV)** and **Critical-Level Utilitarianism (CLU)**, you need a case where *no existing people are affected*, but *impersonal value* might change.

  Ask her this:

  > **"Imagine World A has just one person, living a perfect +100 life. World B has that same person at +100, plus one billion *extra* people who also have perfect +100 lives. The original person is unaffected in both. Is World B *better* than World A?"**

  **Why this splits them:**
  *   **If she says "Yes, B is better":** She is a **Utilitarian** (likely Critical-Level with a low threshold). She believes more good lives make a world better, even if no specific existing person benefits. This contradicts her Case 3 verdict slightly, so she might waffle.
  *   **If she says "No, they are equal":** She is a strict **Person-Affecting Theorist**. Since the original person is equally well off, and the billion new people don't exist in World A to be "benefited" by being created, there is no moral difference.

  **The Follow-Up (if she hesitates):**
  > **"Okay, what if the billion extra people in World B have lives at +40 (the 'good but less good' life from before)? Is B better, worse, or the same as A?"**

  *   **PAV:** Still the **Same**. (Adding happy/neutral lives is never *better*).
  *   **CLU:** **Worse**. (If their critical level is high, adding billions of sub-critical lives drags the total value down).

  **Pro Tip:** Watch her face when you ask the first part. If she instinctively says "Obviously B is better, more happy people!", you've caught her in a contradiction with her "+40 person adds nothing" verdict. If she says "It doesn't matter," you've confirmed she's a hardline Person-Affecting theorist, and you can crush her in seminar with the **Non-Identity Problem** (Case 1b above), because that view implies we have no duty to choose the happier child if it's a different child.
