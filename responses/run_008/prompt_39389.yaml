      *   No leading questions? Yes.
      *   Accessible language? Yes.

      *Let's refine the HF/HetF separation question.*
      *   Q8: "Think of the cool water on a hot day and the satisfaction of finishing a hard task. Is there a specific 'ingredient' present in both experiences that makes them pleasures, or are they just both things you like?"
      *   Option A: There is a specific ingredient/quality they share. (HF)
