      *   *Q4 (Rival):* Focus on similarity between sensory and propositional.
      *   *Q5 (Deceived):* Focus on truth value of the object.
      *   *Q6 (Anticipation):* Focus on temporal location of the pleasure.
      *   *Q7 (Habit/Addiction):* Focus on motivation vs feeling (MOT).
      *   *Q8 (Commonality):* Directly ask about the "same thing" in different pleasures (HF vs HetF vs DEF).
      *   *Q9 (Unconscious/Asleep):* Can you have pleasure without awareness? (ATT vs Feeling).
      *   *Q10 (Intensity):* Is a mild pleasure the *same kind* as intense? (HF vs HetF).
      *   *Q11 (Sadist):* Mirror of Masochist/Rival.
      *   *Q12 (Deflationary check):* Ask if we need a definition at all.

      *Wait, I need to make sure the options map cleanly.* Let's group options by "Cluster."
      *   Cluster A: Sensation/Feeling focused (HF/HetF).
      *   Cluster B: Attitude/Aboutness focused (ATT).
      *   Cluster C: Manner/Mode focused (WoF).
      *   Cluster D: Behavior/Drive focused (MOT).
      *   Cluster E: Skeptical/Disjointed (DEF).

      *Refining the HF vs HetF distinction:* This is the trickiest. HF requires a *common* quality. HetF says pleasures feel different but are still feelings.
      *   *Question Idea:* Compare eating cake vs. solving a puzzle. Do they share a specific "ingredient"?
