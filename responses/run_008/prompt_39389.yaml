      *   **Format:** 10-12 scenario-based questions with 2-4 answer options each. No leading questions (e.g., "Is it a feeling?").
      *   **Scoring Key:** Map answer patterns to positions. Acknowledge mixed answers. Identify indistinguishable pairs. Flag incoherent combinations.
      *   **Required Cases:** Masochism, Deceived Businessman, Flow/Math Absorption, Sensory vs. Attitudinal (Rival), Pleasure Drug (No object), Anticipation.
      *   **Output:** Questions, Options, Scoring Key (with "awkward commitment" notes).

  2.  **Deconstruct the Theories (Mental Check):**
      *   *Homogeneous Feeling (HF):* Pleasure is a specific sensation (a "tingle," "glow," "hedonic tone"). Present in all pleasures.
      *   *Heterogeneous Feeling (HetF):* Pleasures are sensations, but they don't feel alike. United by being wanted/liked or just being "pleasures."
      *   *Attitudinal (ATT):* Pleasure is a pro-attitude (being pleased *that* P). No sensation needed.
      *   *Way of Feeling (WoF):* Pleasure isn't a separate thing; it's *how* you experience something (adverbial).
      *   *Motivational/Dispositional (MOT):* Pleasure is defined by what it makes you do (seek, sustain).
      *   *Deflationary (DEF):* No common thread. "Pleasure" is a family resemblance term or disjointed. Hedonism might need reworking.

  3.  **Drafting Questions (Iterative Process):**
      *   *Constraint:* Must use the required cases. Must avoid theory-laden language.
      *   *Case 1: Masochism.* (Pain + Pleasure?)
          *   Options need to distinguish: Is the pain *itself* pleasant (WoF/HetF)? Is there a separate feeling (HF)? Is it an attitude toward the pain (ATT)? Is it just that they keep doing it (MOT)?
      *   *Case 2: Deceived Businessman (Nozick-style).* (False belief enjoyment).
          *   Options: Does the falsity matter? (ATT might care about the object, HF just cares about the feeling).
      *   *Case 3: Flow/Math.* (Absorption without "warmth").
          *   Options: Is it pleasure because it feels good (HF - might say no)? Because they are engaged (MOT)? Because they are pleased *that* they are solving it (ATT)?
      *   *Case 4: Sensory vs. Attitudinal (Rival).* (Schadenfreude vs. Hot Shower).
          *   Options: Are these the *same kind* of thing? (HF says yes, DEF says no).
      *   *Case 5: Pleasure Drug.* (Pure sensation, no object).
          *   Options: Is this *true* pleasure? (ATT might say no, HF says yes).
      *   *Case 6: Anticipation.* (Looking forward).
          *   Options: Is the anticipation itself pleasant? (ATT/WoF vs MOT).
      *   *Need more to reach 10-12.*
      *   *Case 7: Boredom/Neutral.* (Doing something without feeling much).
      *   *Case 8: Memory.* (Remembering a past pleasure).
      *   *Case 9: Unnoticed Pleasure.* (Background hum of existence).
      *   *Case 10: The "Mistake" Case.* (Confusing pain for pleasure). This addresses the HF vs HetF difficulty.

      *Refining Options:* Ensure options don't sound like "I choose Attitudinal Theory." They must sound like intuitive reactions.
      *   *Bad Option:* "It is a propositional attitude."
      *   *Good Option:* "It depends on whether they are happy *that* it is happening, not how it feels."

  4.  **Developing the Scoring Key:**
      *   This is the hardest part. I need to map specific option choices to points for each theory.
      *   *Strategy:* Assign each option a "weight" toward specific theories.
      *   *Indistinguishability:* HF vs HetF is indeed hard. I need a specific question that targets the "common quality" intuition.
      *   *Incoherent Combos:* E.g., Saying pleasure is *only* a sensation but also saying the drug case isn't pleasure.
      *   *Awkward Commitments:* As requested (e.g., ATT on wishing you weren't pleased).

