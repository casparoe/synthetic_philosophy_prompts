      *Awkward Commitments:*
      *   HF: Must say masochist feels a "good sensation" inside the pain.
      *   HetF: Must explain what unites feelings if not quality.
      *   ATT: Must allow pleasure in things you wish weren't true (e.g., guilty pleasure).
      *   WoF: Hard to explain memory of pleasure without the mode.
      *   MOT: Must count addiction/compulsion as pleasure.
      *   DEF: Hedonism becomes "maximize... uh, whatever these things are."

