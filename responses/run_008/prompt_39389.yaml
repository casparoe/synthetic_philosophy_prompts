      *   This is accessible.

      *Let's refine the WoF vs ATT distinction.*
      *   WoF: "It's how you listen."
      *   ATT: "It's that you are glad you are listening."
      *   Q4 (Music/Rival) can handle this.

      *Let's write it.*

      *(Final Polish)*: Ensure the tone is helpful for a TA. Make the scoring key robust against "mixed" results, as students are inconsistent.

      *Wait, one detail:* "The quiz is meant to sort students by how they react to cases, not by which label they like."
      *   I need to make sure the scoring key doesn't just say "If you picked A, you are X." It needs to handle the "Real people will mix answers" instruction.
