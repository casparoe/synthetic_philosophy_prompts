answer: |-
  This is a sophisticated argument. Your roommate has essentially combined **Neoclassical Revealed Preference Theory** (you choose what you prefer) with the **Behavioral Econ Multiple Selves Model** (you are a series of time-sliced agents) to produce a conclusion that actually contradicts mainstream Behavioral Economics.

  She is arguing for a position often called **"Rational Addiction"** or **"Time-Consistent Preference Reversal."** It is logically tight *if* you accept her definition of rationality. However, she is making a category error that most behavioral economists (like Thaler, Sunstein, or Akerlof) would reject.

  Here is the breakdown of where to strike, why it works, and what it costs.

  ### The Weak Link: Premise (5)

  > *(5) The acting self's preference is therefore the only one with any standing at the moment of choice, and it wins — so the action is fully rational by the only standard available.*

  This is the non-sequitur. Even if we grant (4) (that no self is inherently more "real" than another), it does not follow that the *present* self gets dictatorial authority.

  **Why it looked obvious:**
  It relies on **Phenomenological Presentism**. In the moment of action, only the present self's neural firing patterns can move your muscles. It feels like the only thing that *can* matter is what matters *now*. It also relies on a strict definition of "Rationality" as "internal consistency at time $t$."

  **Why it is wrong:**
  It conflates **explanatory power** with **normative authority**.
  *   *Explanation:* Hyperbolic discounting explains *why* the preference flipped. (Descriptive)
  *   *Authority:* It does not justify *why* the flipped preference should win. (Normative)

  If you accept (5), you make the concept of a "person" incoherent. A person is not just a snapshot; a person is a narrative extended through time. If the "Present Self" can tyrannize the "Past Self" and "Future Self" without penalty, you don't have a person; you have a series of strangers fighting over a shared body.

  ### The Counter-Argument: The "Planner vs. Doer" Model

  Your roommate claims to be deep in behavioral econ, but she is actually using neoclassical tools to dismantle behavioral insights. Real behavioral econ (specifically the work of **Thaler & Shefrin**) explicitly models this conflict not as a "fair vote," but as a **Principal-Agent problem** within the self.

  **The Argument to Deploy:**

  1.  **Distinguish Decision Utility from Experienced Utility:**
      Tell her she is conflating *decision utility* (what you choose in the moment) with *experienced utility* (what actually benefits your welfare over time). Behavioral econ exists specifically because these two diverge. If they never diverged, we wouldn't need behavioral econ; we'd just have standard micro.
      *   *The Lockbox:* When you buy the lockbox at $t_1$, you are revealing a preference for a *constraint*. If breaking that constraint at $t_2$ were truly "rational," the purchase at $t_1$ would be a mistake. But we observe that people who use lockboxes report higher life satisfaction. Therefore, satisfying the $t_1$ preference yields higher *aggregate* utility than satisfying the $t_2$ preference.

  2.  **Invoke Higher-Order Preferences (Harry Frankfurt):**
      This is the philosophical nuclear option that behavioral economists respect.
      *   **First-Order Desire:** "I want to drink this beer." (The roommate says this is all that exists).
      *   **Second-Order Desire:** "I want to *not want* to drink this beer."
      *   Akrasia isn't choosing against your *strongest* desire; it's choosing against your **higher-order** desire.
      *   The alcoholic *does* prefer to lift the glass (1st order), but he *identifies* with the self that wants to be sober (2nd order). Rationality is aligning your actions with the self you *endorse*, not just the self that *shouts loudest*.

  3.  **The "Tyranny of the Present" Reductio:**
      If (5) is true, then **planning is irrational.**
      *   If only the acting self's preference has standing, then studying for an exam is irrational (because at the moment of studying, you prefer relaxing).
      *   Investing for retirement is irrational (because at the moment of spending, you prefer consumption).
      *   If she says "No, those are different because of future rewards," press her: "Why does the future reward count for the studying self, but the future hangover doesn't count for the drinking self?"
      *   She must admit that the **Extended Self** (the sum of all time-slices) has authority over the **Local Self**.

  ### Saving the Lockbox (and Regret)

  To save the lockbox, you need to argue that **precommitment is the rational strategy for an agent with known time-inconsistency.**

  *   **Her view:** Buying the lockbox is paying to frustrate your future self.
  *   **Your view:** Buying the lockbox is the **Past Self** (who is calm, informed, and untempted) delegating authority to a mechanism because they know the **Future Self** (who is hot, biased, and tempted) is a bad agent.
  *   **Why the Past Self has authority:** Because the Past Self's decision imposes fewer negative externalities on other selves. The "Sober Self" imposes no cost on the "Drunk Self" by locking the booze, but the "Drunk Self" imposes massive costs (hangover, health, regret) on the "Sober Self."
  *   Therefore, the "Sober Self" gets voting rights *in the future* via the lockbox. This isn't frustrating a preference; it's **enforcing a contract** between time-slices.

  ### What Does This Cost You?

  If you reject (5), you pay a price. You must accept:

  1.  **Paternalism of the Self:** You have to admit that you can be wrong about what is good for you *in the moment*. This feels intuitive to us, but it violates strict "Consumer Sovereignty" in economics.
  2.  **Complex Rationality:** Rationality is no longer "maximize utility at $t$." It becomes "maximize utility across $t_1...t_n$ subject to discounting." This is harder to model mathematically (which is why your roommate likes her version).
  3.  **The Drinking Self:** You conceded you're fine with this, but strictly speaking, if you reject (5), the drinking self *is* acting irrationally relative to the Extended Self's welfare function. They are being a "bad agent."

  ### The "Cheapest Exit" Strategy

  If you want to win this without becoming a philosophy major, use her own field against her.

  **Say this:**
  > "You're using Revealed Preference to prove there's no Akrasia, but Thaler and Sunstein explicitly use Akrasia to justify Nudges and Precommitment. If your argument were true, 'Nudge' theory would be impossible. You're treating the 'Present Self' as a sovereign consumer, but Behavioral Econ treats the 'Present Self' as a biased agent with systematic errors.
  >
  > If I buy a lockbox, I am revealing that my **Extended Preference** (over time) outweighs my **Local Preference** (in the moment). If you say the Local Preference wins by definition, you're defining away the very 'bias' Behavioral Econ is supposed to study. You're not doing Behavioral Econ; you're doing Neoclassical Econ with extra steps."

  **Summary of the Move:**
  1.  **Reject Premise (5).** The present self does not have exclusive standing.
  2.  **Why it looked obvious:** Confusion of *power* (who moves the hand) with *authority* (who sets the rules).
  3.  **The Cost:** You must accept that "Rationality" is a diachronic (over-time) property, not a synchronic (in-the-moment) one.
  4.  **The Win:** This makes the lockbox not only rational but *necessary* for a time-inconsistent agent. It makes regret intelligible (the Extended Self lamenting the Local Self's hijacking). And it aligns you with actual Behavioral Economics, while she is accidentally defending Neoclassical Rationality.
