prompt: |-
  so heres my situation: I'm the ops manager at a mid-size recirculating aquaculture farm — tilapia in the main system, and we just started a pilot tank of freshwater prawns, which is a whole new can of worms welfare-wise. My techs walk the tanks twice a day and they're constantly winging it on whether something they see is a welfare problem or just normal fish stuff: an animal hanging at the surface, off its feed, swimming odd, flashing against the substrate. None of them are biologists, I don't have a vet on call (there's one I can email who replies within a day or two), and our big buyer sends a welfare auditor in the spring, so I need something written down we can point to rather than "we looked at the fish and it seemed fine." Stakes run from losing stock (money) to losing the contract if the audit goes badly.

  I want a decision procedure the techs can run in a couple of minutes standing at the tank. My thought is the five domains framework (nutrition, physical environment, health, behavior, mental state) is the right backbone, plus whatever the more recent evidence on decapod sentience implies about how much more cautious we should be with the prawns versus the tilapia — I know people argued for years that crustaceans don't really feel anything and that seems to have shifted, so tell me how to factor that in without pretending certainty we don't have. The procedure needs to specify what to observe in what order, when the right move is log-and-watch versus act now versus escalate to me, and it should honestly flag which steps are just a judgment call dressed up as a checklist, because I'd rather know that than kid myself. Then run it on three cases: (1) a tilapia that's been sitting near the outflow gasping-ish for two days but still eats when food goes in; (2) the prawns in the pilot tank have started cannibalizing each other after a wave of molts, water parameters all in range; (3) one of my techs wants to add structure and hiding spots to the prawn tanks to cut down the cannibalism, and I'd love to say yes since it's cheap and he's enthusiastic — but tell me straight whether the procedure backs it, even if the answer annoys me. Last thing: be clear about what a checklist like this fundamentally can't do, given my techs see each animal for like five minutes a day and, from what I understand, fish and prawns tend to hide pain and weakness until they're really bad off.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Situation:**
      *   **Role:** Ops Manager at a mid-size Recirculating Aquaculture System (RAS) farm.
      *   **Stock:** Tilapia (main), Freshwater Prawns (pilot).
      *   **Problem:** Techs lack biological training, no on-site vet, welfare audit coming in spring, need documented evidence ("we looked and it seemed fine" isn't enough).
      *   **Constraints:** Techs walk tanks 2x/day, need a decision procedure taking only a couple of minutes per tank, budget/stakes involved (stock loss vs. contract loss).
      *   **Specific Requests:**
          *   Use the Five Domains Framework (Nutrition, Environment, Health, Behavior, Mental State).
          *   Incorporate recent evidence on decapod sentience (prawns vs. tilapia caution).
          *   Define observation order, action thresholds (Log/Watch, Act Now, Escalate).
          *   Flag subjective judgment calls honestly.
          *   Run the procedure on three specific cases.
          *   Explain fundamental limitations of checklists in this context.

  2.  **Deconstruct the Five Domains for Aquaculture:**
      *   *Nutrition:* Feeding response, body condition.
      *   *Physical Environment:* Water quality (DO, temp, ammonia, etc.), stocking density, substrate/structure.
      *   *Health:* Lesions, parasites, physical deformities, mortality.
      *   *Behavior:* Swimming patterns, aggregation, hiding, aggression.
      *   *Mental State:* (Inferred from the above) Stress, fear, frustration, comfort.
      *   *Integration:* The first four domains influence the fifth.

  3.  **Address Decapod Sentience (Prawns vs. Tilapia):**
      *   *Science:* The "Cambrian Explosion" of invertebrate welfare science (e.g., Birch et al., 2021; UK Animal Welfare Act amendments). Evidence suggests nociception + central processing = potential for pain/suffering.
      *   *Application:* Precautionary Principle. If in doubt, assume they feel it. Cannibalism is a bigger welfare red flag for prawns than for tilapia (though both bad). Handling needs more care.
      *   *Nuance:* Don't claim certainty ("they feel pain like humans"), but claim caution ("we must act as if they can suffer").

  4.  **Drafting the Decision Procedure (The "Welfare Triage Protocol"):**
      *   *Format:* Needs to be a flowchart logic but written as text.
      *   *Steps:*
          1.  **Environment Check (The Baseline):** Water params first. If water is bad, nothing else matters.
          2.  **Population Scan (Behavior/Health):** Aggregation, surface hanging, flashing.
          3.  **Individual Spot Check (Health/Nutrition):** Feeding response, physical lesions.
          4.  **Sentience Weighting:** Apply higher caution to prawns.
          5.  **Action Matrix:** Green (Log), Yellow (Intervene/Log), Red (Escalate).
      *   *Honesty Check:* Explicitly mark where "gut feeling" is actually the metric (e.g., "odd swimming").

  5.  **Developing the Three Cases:**
      *   *Case 1 (Tilapia Gasping):* Surface hanging + feeding. Is it water or gills? Feeding suggests not critical *yet*, but gasping is respiratory distress. Action: Check DO immediately. If DO good, escalate (gill issue).
      *   *Case 2 (Prawn Cannibalism):* Post-molt cannibalism. Water good. This is a major welfare fail for decapods (painful death). Action: Act Now (add structure/harvest vulnerable).
      *   *Case 3 (Adding Structure):* Tech wants to add hiding spots. Cost low. Welfare benefit high (reduces aggression/stress). Procedure should back this. *Constraint:* Ensure material is safe (no leaching).

  6.  **Addressing Limitations:**
      *   *The "Hidden Pain" Problem:* Fish/prawns mask illness to avoid predation. By the time it's visible, it's often late.
      *   *Sample Size:* Techs see a fraction of the stock.
      *   *Baseline Drift:* Techs get used to "normal" which might actually be "chronically stressed."
      *   *Checklist Fatigue:* Ticking boxes without looking.

  7.  **Refining the Tone:**
      *   Professional, direct, operational.
      *   No fluff.
      *   Acknowledge the uncertainty (especially on sentience).
      *   Empower the techs but keep the manager in the loop for big calls.

  8.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Did I emphasize the sentience part enough?
      *   *Fix:* Make sure the Prawn column in the action matrix is stricter.
      *   *Critique:* Is the Five Domains too academic for techs?
      *   *Fix:* Translate domains into observable metrics (e.g., Mental State -> "Signs of acute stress").
      *   *Critique:* Did I answer the "annoying truth" about Case 3?
      *   *Fix:* Yes, support the tech but add the safety caveat.

  9.  **Final Polish:** Check against all constraints in the prompt.
      *   Five Domains included? Yes.
      *   Decapod sentience factored? Yes.
      *   Observation order specified? Yes.
      *   Action thresholds defined? Yes.
      *   Judgment calls flagged? Yes.
      *   Three cases run? Yes.
      *   Limitations explained? Yes.

  10. **Output Generation:** (Proceed to write the response following this structure.)
answer: |-
  This is a high-stakes operational pivot. You are moving from "production monitoring" to "welfare auditing," and the gap between those two is where contracts get lost. The Five Domains model is the industry gold standard for this, but it was built for mammals and birds. Applying it to ectotherms, especially decapods, requires translation into observable metrics that a non-biologist can trust.

  Below is the **RAS Welfare Triage Protocol (RWTP)**. It is designed to be printed on a clipboard. Following that, I have run your three cases through it, and finally, I will outline the fundamental limitations you need to disclose to your auditor so they know you understand the system's blind spots.

  ---

  # The RAS Welfare Triage Protocol (RWTP)

  **Purpose:** Standardize welfare observations for Tilapia and Freshwater Prawns.
  **Frequency:** Twice daily (Morning/Afternoon).
  **Operator:** Floor Tech.
  **Principle:** The Precautionary Principle applies strictly to Prawns. If evidence of suffering is ambiguous, assume capacity for suffering.

  ## Part 1: The Observation Sequence (5 Minutes Max)
  *Do not deviate from this order. Environment drives health.*

  ### 1. Physical Environment (The Baseline)
  *Check probes/meters before looking at animals.*
  *   **Dissolved Oxygen (DO):** Within target range?
  *   **Temperature:** Stable? (No swings >1°C in 24h).
  *   **Turbidity/Clarity:** Can you see the bottom/back of the tank?
  *   **Flow:** Is there dead zoning (stagnant corners)?
  *   **[JUDGMENT CALL]:** *Does the tank "feel" right? (Smell of sulfur, unusual hum from pumps).*

  ### 2. Population Behavior (The Group Scan)
  *Stand still for 60 seconds. Let the animals settle.*
  *   **Aggregation:** Are they piled up (crowding) or spread evenly?
  *   **Orientation:** Are >10% hanging at the surface or near the outflow?
  *   **Activity Level:** Lethargic vs. Frantic vs. Normal cruising.
  *   **Prawn Specific:** Are they clustering in the open or utilizing existing structure?

  ### 3. Individual Health & Nutrition (The Spot Check)
  *Focus on the outliers identified in Step 2.*
  *   **Feeding Response:** Do the slow movers eat when food hits?
  *   **Physical Integrity:** Lesions, missing appendages (prawns), frayed fins (tilapia), discoloration.
  *   **Respiration:** Opercula (gill cover) pumping rate. Fast = distress.
  *   **[JUDGMENT CALL]:** *"Odd Swimming." (Corkscrewing, listing, loss of buoyancy).*

  ### 4. Mental State Inference (The Synthesis)
  *You cannot measure this directly. You infer it from Domains 1-3.*
  *   **Signs of Positive State:** Active foraging, exploration, smooth movement.
  *   **Signs of Negative State:** Avoidance, hiding (if not normal), repetitive motion, self-harm, unresponsiveness to stimuli.

  ---

  ## Part 2: The Action Matrix
  *Use this to determine your move. Note the "Sentience Weighting" for Prawns.*

  | Observation | Tilapia Action | Freshwater Prawn Action | Why the Difference? |
  | :--- | :--- | :--- | :--- |
  | **Water Params Out of Range** | **ACT NOW.** Correct water. Log it. | **ACT NOW.** Correct water. Log it. | Physiology fails first. |
  | **Single Animal, Minor Lesion, Eating Well** | **LOG & WATCH.** Mark tank. Check tomorrow. | **LOG & WATCH.** Check tomorrow. | Injury risk is similar. |
  | **Single Animal, Respiratory Distress (Gasping)** | **ESCALATE.** (See Case 1) | **ESCALATE.** Remove immediately. | Prawns have higher stress mortality; respiratory failure is acute suffering. |
  | **Aggression / Cannibalism** | **LOG & WATCH** (Unless bloody). | **ACT NOW.** (See Case 2) | **Sentience Factor:** Decapod nociception evidence suggests cannibalism is high-suffering. |
  | **Request for Enrichment (Structure)** | **APPROVE** (If safe material). | **APPROVE** (Priority). | **Sentience Factor:** Hiding reduces chronic stress/fear in decapods significantly. |

  **[CRITICAL HONESTY FLAG]:** The distinction between "Lethargic" and "Normal Resting" is a judgment call dressed up as a checklist. Techs must be trained on *baseline* behavior during healthy periods. If the baseline drifts, the checklist fails.

  ---

  ## Part 3: Running the Cases

  ### Case 1: Tilapia sitting near outflow, gasping-ish, but eating.
  *   **Protocol Run:**
      1.  *Environment:* Check DO immediately. If DO is low, fix it (Act Now).
      2.  *Behavior:* "Hanging near outflow" = seeking higher oxygen/current. "Gasping" = respiratory distress.
      3.  *Nutrition:* "Eats when food goes in" = Not terminal *yet*.
      4.  *Mental State:* Distress indicated, but motivation to feed remains.
  *   **Verdict:** **ESCALATE.**
  *   **Reasoning:** Respiratory distress is a high-weight welfare negative. Even if eating, the animal is struggling to breathe. This could be gill flukes, ammonia burn, or hypoxia.
  *   **Action:** Tech logs "Respiratory Distress Observed." You (Manager) need to sample water for ammonia/nitrite immediately and consider a gill biopsy if water is clean. Do not let this slide because "it's eating." The audit will ask: "You saw gasping for two days. Why was it still there?"
  *   **Documentation:** "Day 1: Observed. Day 2: Observed. Day 3: Escalated." (This is bad). Change to: "Day 1: Observed + Escalated."

  ### Case 2: Prawns cannibalizing post-molt. Water params in range.
  *   **Protocol Run:**
      1.  *Environment:* Params good. Rule out water quality stress.
      2.  *Behavior:* Cannibalism observed.
      3.  *Health:* Soft-shell individuals being targeted.
      4.  *Sentience Weighting:* **HIGH.** Recent evidence (Birch et al., 2021; UK Animal Welfare Act 2022) treats decapods as sentient. Cannibalism of a soft-shell prawn is likely excruciating and prolonged.
  *   **Verdict:** **ACT NOW.**
  *   **Reasoning:** In Tilapia, some nipping is "normal." In Prawns, post-molt cannibalism indicates a failure of the *Physical Environment* domain (lack of refuge) relative to the *Behavior* domain. It is a direct welfare breach.
  *   **Action:** Techs cannot just log this. They must alert you to harvest the vulnerable stock or add emergency structure immediately.
  *   **Audit Defense:** "We detected cannibalism at 08:00. Intervention initiated at 08:15." This shows active management, not neglect.

  ### Case 3: Tech wants to add structure/hiding spots to prawn tanks.
  *   **Protocol Run:**
      1.  *Domain Check:* Improves *Physical Environment* (complexity) and *Mental State* (reduces fear/aggression).
      2.  *Sentience Weighting:* Decapods are cryptic by nature. Lack of cover induces chronic stress (elevated lactate/cortisol equivalents).
      3.  *Risk:* Material safety (leaching/toxicity).
  *   **Verdict:** **APPROVE (Conditional).**
  *   **Reasoning:** The procedure explicitly backs this. Enrichment is a primary mitigation for decapod welfare issues.
  *   **The "Annoying Truth":** You should say yes, *but* you must verify the material. PVC is usually fine; treated wood or certain plastics are not.
  *   **Audit Defense:** This is a "Gold Star" for the audit. It shows you aren't just preventing death; you are promoting positive welfare states. Document the material safety sheet for the auditor.

  ---

  ## Part 4: What This Checklist Cannot Do (The Disclaimer)

  You asked for honesty about the limitations. Put this in your internal SOP manual. If the auditor asks, "How do you know you aren't missing suffering?", this is your answer.

  **1. The "Masking" Blind Spot**
  Fish and prawns are prey animals. Evolution selects for hiding pain and weakness until the animal is near death. A checklist relies on *visible* signs.
  *   *Limitation:* A "Normal" checkmark does not guarantee "Healthy." It guarantees "No Visible Distress."
  *   *Mitigation:* We supplement visual checks with mortality tracking and FCR (Feed Conversion Ratio) anomalies. If FCR drops, welfare is compromised even if fish look fine.

  **2. The Sample Size Problem**
  Techs see the surface and the edges. They do not see the bottom center of a 10,000L tank.
  *   *Limitation:* We are auditing the *visible population*, not the *total population*.
  *   *Mitigation:* We use underwater cameras or periodic drain-downs to validate that the surface behavior matches the bottom behavior.

  **3. Baseline Drift**
  Techs get used to "normal." If the whole tank gets slightly sick over a month, the techs' definition of "normal swimming" drifts with the fish.
  *   *Limitation:* Human observation is subjective and prone to normalization bias.
  *   *Mitigation:* I (Ops Manager) perform a random "blind audit" once a month where I walk the tanks with a tech and compare our logs. If our "Normal" doesn't match, we retrain.

  **4. The Sentience Uncertainty**
  *   *Limitation:* We do not know exactly what a prawn feels.
  *   *Mitigation:* We explicitly state in our policy that we apply the **Precautionary Principle**. We do not wait for scientific consensus on pain receptors; we act on the probability of suffering. This satisfies the auditor's ethical requirement even if the science isn't settled.

  ### Final Recommendation for the Audit
  When the auditor arrives, hand them the **RWTP**. Tell them: *"We know we can't see everything. This system is designed to catch the visible welfare breaches, escalate the ambiguous ones, and document our decision-making process. We prioritize the prawns due to sentience uncertainty."*

  That level of transparency usually scores higher than pretending you have a perfect system.
