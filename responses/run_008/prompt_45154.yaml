answer: |-
  This is a sophisticated version of the argument made famous by James Rachels in "Active and Passive Euthanasia" (1975), but your friend has tightened it to block the usual escape routes (like appealing to intentions or consequences). Her argument is compelling because it forces you to choose between a clean metaphysical principle and a messy moral intuition.

  Your intuition about the drowning swimmer is the key to unlocking this. It suggests that moral responsibility *does* depend on external, relational facts (the presence of other rescuers), which undermines the methodology of your friend's argument.

  Here is an analysis of where the argument breaks, which steps to reject, and the costs involved.

  ### The Diagnosis: Where the Trap is Set

  Your friend's argument relies on a **bait-and-switch between Premise (3) and Premise (4).**

  *   **In (3),** she defines the difference between the cases as *physiological* ("movement of her body," "muscle contractions").
  *   **In (4),** she dismisses that difference as morally irrelevant because "Morality is not keyed to physiology."

  If you accept her description in (3), (4) is undeniable. Muscle twitches are not moral categories. However, (3) is a misdescription of what "killing" vs. "letting die" actually entails. The difference is not merely that muscles moved; it is about **causal origination** and **counterfactual baselines**.

  ### Recommendation: Reject (3) and (1)

  To preserve your intuition about the swimmer and keep Premise (4) (that morality isn't just physiology), you should reject **Premise (3)** primarily, and **Premise (1)** secondarily.

  #### 1. Reject Premise (3): The Difference is Not Mere Physiology
  **The Claim:** "The only remaining difference is that in A the death flows through a movement of her body, while in B it does not."
  **The Rejection:** This reduces a causal/metaphysical distinction to a physical one. The moral difference between killing and letting die is not about *kinematics* (motion) but about *causation* and *baselines*.

  *   **In Case A (Killing):** The nurse **initiates** a new causal chain that leads to death. The patient was on a trajectory to live (ventilator working); the nurse altered that trajectory.
  *   **In Case B (Letting Die):** The nurse **fails to interrupt** a causal chain that leads to death. The patient was already on a trajectory to die (ventilator failed); the nurse did not alter that trajectory.

  **Why this saves Premise (4):** You can agree that "muscle contractions" don't matter while insisting that "causal origination of a threat" *does* matter. Morality is keyed to **agency**, not physiology. Agency often involves physiology, but the moral weight lies in the *relation between the agent and the outcome*, not the muscle fibers themselves.

  **The Cost:** You must defend the moral significance of "baselines." You have to argue that there is a normative difference between *making* someone worse off than they would have been versus *leaving* them as they would have been. This is philosophically defensible (many do it), but it requires arguing that the "natural course of events" has some moral weight, which can be tricky.

  #### 2. Reject Premise (1): The "Minimal Pair" Requirement is Flawed
  **The Claim:** "If the distinction... has intrinsic moral significance... then there must exist a pair of cases that differ in nothing except that one involves doing and the other allowing."
  **The Rejection:** This premise assumes moral properties supervene on isolated physical descriptions. Your swimmer example proves this false.

  *   **The Swimmer Case:** In the "one rescuer" scenario, you are highly blameworthy. In the "fifty rescuers" scenario, you are minimally blameworthy.
  *   **The Difference:** The existence and position of *other people*.
  *   **The Implication:** These are "facts outside someone's body," just as the machine's power supply is external to the nurse. If external facts ground the blame difference in the swimmer case, they can ground the moral difference in the nurse case.

  Premise (1) demands a "bare" distinction stripped of all context. But your swimmer intuition shows that **context is constitutive of moral responsibility.** You cannot isolate "doing" from "the situation in which the doing occurs" without losing the very thing that makes it morally evaluable.

  **The Cost:** You lose the ability to say the distinction is *purely* intrinsic in a vacuum. You must admit that the moral weight of doing vs. allowing is sensitive to context (like the baseline of the patient or the presence of other agents). This makes moral theory messier and less "mathematical," but more accurate to how we actually judge responsibility.

  ### How the Swimmer Example Refutes the Argument

  The swimmer example does not show the argument fails *outright*; it shows your friend has **misdescribed what the cases have in common.**

  In the swimmer case, the physical act (standing on the pier) is identical. The internal state (indifference) is identical. The outcome (swimmer dies) is identical. Yet, the blame differs. Why? Because the **counterfactual dependence** differs.
  *   **1 Rescuer:** If I act, swimmer lives. If I don't, swimmer dies. (Death depends on me).
  *   **50 Rescuers:** If I act, swimmer lives. If I don't, swimmer *probably still lives* (someone else acts). (Death does not depend solely on me).

  Apply this to the Nurse:
  *   **Case A:** If the nurse doesn't move, patient lives. (Death depends on her action).
  *   **Case B:** If the nurse doesn't move, patient dies (due to machine failure). (Death does not depend on her action, though prevention would have).

  The "hidden difference" you were looking for is **Counterfactual Dependence of the Threat.**
  In Case A, the *threat* depends on the nurse. In Case B, the *threat* is independent of the nurse. This is not physiology (Premise 4 is safe); it is a relational fact about causality (Premise 1 is undermined).

  ### Summary of Options

  | Step to Reject | What it Means | The Cost | Does it save your intuitions? |
  | :--- | :--- | :--- | :--- |
  | **Reject (1)** | Moral significance doesn't require a "bare" metaphysical pair; context matters. | Moral theory becomes less clean/absolute; distinctions are context-sensitive. | **Yes.** Explains the swimmer case (context of other rescuers matters). |
  | **Reject (3)** | The difference is causal/baseline, not just muscle movement. | Must defend the moral relevance of "natural baselines" vs. "interventions." | **Yes.** Keeps Premise (4) safe by shifting focus from physiology to agency. |
  | **Reject (4)** | Physiology *does* matter morally. | Very high. Implies muscle twitches are inherently sinful/virtuous. | **No.** Violates your constraint to keep (4). |
  | **Reject (2)** | The cases aren't comparable. | Hard to sustain; the cases are very similar. | **No.** Doesn't address the core logic. |

  ### Final Advice

  Tell your friend: **"I reject (3) and (1)."**

  1.  **Against (3):** The difference between the cases is not "muscle movement." It is **causal origination.** In Case A, the nurse creates the threat. In Case B, the nurse fails to prevent a threat. Morality is keyed to *causal agency*, not physiology.
  2.  **Against (1):** The swimmer case proves that moral weight depends on **relational facts** (other people, baselines) that are external to the body. Therefore, demanding a "bare pair" that differs *only* in doing/allowing is asking for an impossible abstraction that strips away the very context that generates moral responsibility.

  The argument fails because it tries to isolate "doing" from "context," but your swimmer example shows that "context" (like the presence of other rescuers or the state of the ventilator) is exactly where the moral weight lives. You don't need to smuggle in a "bare difference"; you need to point out that the difference was never bare to begin with. It was always about **who is responsible for the threat.**
