answer: |-
  # The Akrasia Archetype Quiz

  **Instructions:** Below are 8 concrete scenarios involving failure, habit, and self-control. For each, select the explanation that feels most *true* to you—not the one that sounds smartest, but the one that matches how you experience your own mind. Do not worry about philosophical labels; just pick the description that fits.

  ---

  ### 1. The $500 Contract
  Alex wants to quit smoking. He signs a contract: if he smokes a single cigarette in the next year, he must pay a hated rival $500. He never smokes. Why did this work?
  *   **A.** It made the cost of smoking real and immediate. Before, the health cost was abstract; now the financial pain was concrete.
  *   **B.** It bound "Present Alex" to the wishes of "Future Alex," preventing Present Alex from stealing resources from the future.
  *   **C.** It saved Alex the mental energy of having to say "no" to every craving. He didn't have to decide; the contract decided for him.
  *   **D.** It proves Alex didn't *actually* want to smoke more than he wanted to keep $500. He revealed his true preference.
  *   **E.** It allowed his rational planning system to override his impulse system by changing the stakes.

  ### 2. The Blank Page
  You sit down to write a report you genuinely care about. You don't want to do anything else. You feel no craving for distraction. Yet, you stare at the screen for two hours and write nothing. What happened?
  *   **A.** You were subconsciously avoiding the anxiety of potentially writing something bad. You acted to minimize pain.
  *   **B.** Your "doer" system was exhausted. You had used up your capacity for focused effort earlier in the day.
  *   **C.** The reward (finished report) was too far away. Your brain discounted it to zero compared to the immediate effort.
  *   **D.** A lower-level habit loop (freeze/avoid) hijacked your higher-level intention. You were in the wrong gear.
  *   **E.** In that moment, you preferred the safety of *not* finishing to the risk of finishing. You did what you wanted.

  ### 3. The Weeping Smoker
  A smoker lights up while crying. They say, "I hate this. I wish I wasn't doing this. I want to stop." But they inhale. What is the nature of this conflict?
  *   **A.** There is no conflict. In that exact second, the relief of nicotine outweighed the shame. The crying is just regret arriving late.
  *   **B.** The physical addiction circuitry is firing louder than the verbal planning circuitry. The elephant is overpowering the rider.
  *   **C.** They are mistaken about how bad the cigarette is *right now*. If they truly grokked the harm in the moment, the hand wouldn't move.
  *   **D.** The "force" of the craving is stronger than the "muscle" of their resolve. They were overpowered.
  *   **E.** Their "Now Self" values relief, while their "Reflective Self" values health. They are at war with their future self.

  ### 4. The Lock Checker
  Sam checks the door lock ten times before leaving. It's not pleasurable. It's not a "temptation." They just feel they *must*. Is this weakness of will?
  *   **A.** No, this is a mechanical malfunction, not a failure of will. It's a bug in the threat-detection system.
  *   **B.** Yes, because they are failing to act on their knowledge that the door is locked. They don't truly believe it's safe.
  *   **C.** Yes, because they lack the willpower to tolerate the uncertainty of not checking.
  *   **D.** No, because in that moment, reducing anxiety is their highest preference. They are satisfying a need.
  *   **E.** Yes, because their habitual system is overriding their reflective system.

  ### 5. The Atheist in the Pew
  Jordan hasn't believed in God for five years but still attends church every Sunday. They feel stuck. Why haven't they left?
  *   **A.** Their habits (System 1) haven't updated to match their new beliefs (System 2). The old script is still running.
  *   **B.** They actually value the community or tradition more than theological truth. They are revealing their true hierarchy of values.
  *   **C.** Breaking the social bond requires energy they don't have. They are depleted by other life stresses.
  *   **D.** They haven't fully internalized the knowledge that God isn't real. Part of them still fears divine punishment.
  *   **E.** The "cost" of leaving is immediate (social awkwardness), while the benefit (honesty) is abstract. The discount rate is too high.

  ### 6. The Broken Seal
  You are on a diet. You eat one donut. You think, "Well, the day is ruined," and eat three more. Why did the first donut cause the collapse?
  *   **A.** The first donut used up your daily "resistance budget." You had no willpower left for the next three.
  *   **B.** The first donut changed your belief about the day. You updated from "I am on a diet" to "I am a dieter who failed," changing your calculation.
  *   **C.** The first donut signaled that "Future You" will also eat donuts, so "Present You" might as well enjoy it now.
  *   **D.** It revealed that you didn't actually want the diet more than the donuts. The first one was the honest choice; the regret was performative.
  *   **E.** The impulse system sensed blood sugar and took the wheel. The planning system was disconnected.

  ### 7. The Happy Sinner
  Casey stays up late scrolling, eats the junk food, skips the gym, and feels *no regret* the next day. They say, "I enjoyed it. It was worth it."
  *   **A.** This is the only honest state. Regret is the illusion; action reveals preference.
  *   **B.** They lack the self-awareness to see the conflict. They are rationalizing a system error.
  *   **C.** Their "Now Self" and "Future Self" are perfectly aligned on hedonism. There is no time-inconsistency.
  *   **D.** They have trained their will to accept these choices, or they have no will to train.
  *   **E.** They truly believe the enjoyment outweighs the health cost. They are acting on knowledge.

  ### 8. The Nature of Temptation
  When you feel tempted to do something you know is bad, what does it feel like?
  *   **A.** Like a heavy weight or pressure pushing against me. I have to hold it back.
  *   **B.** Like a calculation where the short-term variable suddenly weighs 10x more than usual.
  *   **C.** Like a different person inside me grabbing the steering wheel.
  *   **D.** Like a confusion. If I really saw the outcome clearly, the feeling wouldn't exist.
  *   **E.** Like a signal that I actually want the thing, and my "shoulds" are just external rules I haven't accepted.

  ---

  # Scoring Key

  Tally your answers. Most of your selections should cluster around one or two letters.

  *   **Mostly A: The Socratic (Intellectualist)**
      *   **Theory:** Akrasia is impossible. Action always follows the perceived good. If you did the bad thing, you were ignorant of the true cost, or you subconsciously prioritized anxiety relief over the goal.
      *   **The Fix:** Better epistemology. Make the costs vivid, salient, and undeniable. If you *really* knew, you wouldn't do it.
      *   **Verdict on Precommitment:** Rational, but only because it corrects an information/calculation error.

  *   **Mostly B: The Partitioned Mind (Dual-Process)**
      *   **Theory:** You are multiple agents in one skull. Akrasia is a civil war where the fast, impulsive system hijacks the slow, planning system.
      *   **The Fix:** System design. Build habits that bypass the impulse, or strengthen the "Rider's" control over the "Elephant."
      *   **Verdict on Precommitment:** Rational, because it gives the Planning System a weapon the Impulse System can't override.

  *   **Mostly C: The Hyperbolic Discounter (Time-Inconsistency)**
      *   **Theory:** Your preferences change based on proximity. "Future You" wants health; "Present You" wants relief. Akrasia is a preference reversal across time.
      *   **The Fix:** Binding. Align the incentives of Present You with Future You (bundling, deadlines, penalties).
      *   **Verdict on Precommitment:** Rational, because it prevents Present You from stealing from Future You.

  *   **Mostly D: The Willpower-as-Strength (Resource Model)**
      *   **Theory:** Self-control is a depletable resource (a muscle or fuel tank). Akrasia is exhaustion. Temptation is a force that requires energy to resist.
      *   **The Fix:** Conservation. Sleep, rest, and precommitment to avoid spending the fuel.
      *   **Verdict on Precommitment:** Rational, because it saves your limited energy for where it's truly needed.

  *   **Mostly E: The Deflationary (Revealed Preference)**
      *   **Theory:** There is no weakness. You did what you wanted. "Regret" is just a preference change that happened after the fact.
      *   **The Fix:** Acceptance or re-evaluation. Stop lying to yourself about what you value. Either own the donut or change the value, but don't call it "weakness."
      *   **Verdict on Precommitment:** Irrational/Unnecessary. If you truly wanted to quit, you wouldn't need to pay someone to stop you.

  ---

  # Analysis & Caveats

  ### 1. The "Same Verdict, Opposite Reason" Trap
  Notice that **Socratic (A)** and **Deflationary (E)** often agree on the outcome ("The action was consistent with the internal state") but disagree on the mechanism.
  *   **Case:** *The Procrastinator (Q2).*
  *   **Socratic Verdict:** Rational. They prioritized avoiding anxiety over writing. (Error of *Belief/Value*).
  *   **Deflationary Verdict:** Rational. They preferred scrolling to writing. (Truth of *Preference*).
  *   **Why it matters:** The Socratic thinks you can *fix* the agent by teaching them the truth. The Deflationary thinks you can't "fix" them, only acknowledge that they value comfort over work. If you scored high on both A and E, you likely view akrasia as a **consistency** problem, not a **conflict** problem.

  ### 2. The Hyperbolic/Willpower Collapse
  You may find it hard to distinguish **Hyperbolic (C)** and **Willpower (D)**. This is a known theoretical collapse.
  *   **The Overlap:** Both recommend precommitment. Both view temptation as something to be avoided rather than engaged.
  *   **The Distinction:** Willpower views temptation as a **force** resisting you (Q8 Option A). Hyperbolic views temptation as a **preference shift** (Q8 Option B/C).
  *   **Why it matters:** If you are Willpower-focused, you rest to recharge. If you are Hyperbolic-focused, you restructure incentives. In practice, these look similar, but the *phenomenology* is different. If you scored high on both, you likely view self-control as a **struggle against an externalized internal force.**

  ### 3. The Compulsion Boundary
  **Question 4** was designed to see if you draw a line between Akrasia and Compulsion.
  *   **Partitioned (B)** and **Willpower (D)** tend to call compulsion a form of weakness (failure to control).
  *   **Socratic (A)** and **Deflationary (E)** tend to view it as consistent action (acting on fear or anxiety relief).
  *   **Partitioned (A option in Q4)** is the only one that explicitly says "This isn't will at all, it's a bug." If you chose A there but B elsewhere, you believe some failures are medical, not moral.

  ### 4. Who Can't Be Separated?
  This quiz cannot cleanly separate **Socratic** from **Hyperbolic** on the issue of Precommitment (Q1).
  *   **Socratic:** "The contract makes the cost real." (Epistemic fix).
  *   **Hyperbolic:** "The contract binds the future self." (Incentive fix).
  *   **Result:** Both select "It works because it changes the calculation."
  *   **Flag:** If you are trying to distinguish these two, you must ask: *Does the agent know the cost already?* The Socratic says "No, not really." The Hyperbolic says "Yes, but they discount it." The quiz options merge these because, behaviorally, the solution (make the cost salient) is identical.
