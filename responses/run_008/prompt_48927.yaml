answer: |-
  This is a fantastic question because it touches on some of the most common misconceptions in theoretical computer science. You are definitely not alone in feeling this way; pop-science coverage often blurs the lines between *computability*, *complexity*, and *physics*.

  The short answer is: **The Church-Turing Thesis (CTT) has not been refuted, nor was it ever a theorem to begin with.** Turing machines remain the standard not because of inertia, but because the definition of "computable" is mathematically robust in a way phlogiston never was.

  Here is the breakdown of where the confusion lies and why Turing machines are still the gold standard.

  ### 1. The Church-Turing Thesis is not a Theorem
  You wrote: *"Turing proved the Church-Turing thesis... it's a theorem like any other."*

  This is the root of the misunderstanding. **The Church-Turing Thesis cannot be proven.**

  *   **Why?** To prove a theorem, you need formal definitions. We have a formal definition of a "Turing Machine." However, we do not have a formal mathematical definition for the intuitive human concept of "effectively calculable" (i.e., what a human can do with pencil and paper following a strict method).
  *   **What Turing actually did:** Turing analyzed the process of human computation and argued that any step-by-step mechanical procedure can be reduced to the operations of his machine. Church did the same with Lambda Calculus. When they realized their two totally different formalisms defined the exact same set of functions, it became a strong **hypothesis** that they had captured the true limit of computation.
  *   **Status:** It is a philosophical claim about the relationship between mathematics and physical reality, not a mathematical truth within a closed system.

  ### 2. Quantum Computers Do Not Break Computability
  You wrote: *"Quantum computers... can apparently do things classical machines can't, which sounds like it flatly refutes the thesis."*

  This confuses **Computability Theory** with **Complexity Theory**.

  *   **Computability (What can be done?):** Can the problem be solved in *finite* time, given infinite resources?
  *   **Complexity (How fast can it be done?):** Can the problem be solved in *reasonable* time (e.g., polynomial time)?

  A quantum computer **cannot** compute anything that a classical Turing machine cannot. Any computation a quantum computer performs can be simulated by a classical Turing machine. The catch? The classical machine might take exponential time (millions of years) to do what the quantum computer does in minutes.

  The Church-Turing Thesis is about the *set* of solvable problems. Since Quantum Computers solve the exact same set of problems as Classical TMs (just faster), **they do not refute the thesis.** They refute the *Extended* Church-Turing Thesis (which claims that any reasonable model of computation can be efficiently simulated by a probabilistic Turing machine), but not the original thesis regarding what is computable at all.

  ### 3. Penrose and the "Hypercomputation" Claim
  You wrote: *"Penrose argue the brain manages non-computable stuff, so thats two seperate ways the thesis has been shown wrong."*

  Roger Penrose's argument (Orch-OR theory) suggests that human consciousness relies on quantum gravity effects in microtubules, allowing the brain to solve non-Turing-computable problems (like determining the truth of Gödel sentences).

  *   **Scientific Consensus:** This is a fringe view. Most neuroscientists and physicists believe the brain is a biological machine subject to the same physical laws as any other computer. There is currently **zero empirical evidence** that the brain can solve the Halting Problem or perform "hypercomputation."
  *   **Even if Penrose is Right:** If the brain *could* do non-computable things, it would refute the **Physical** Church-Turing Thesis (which states that every physical process can be simulated by a TM). It would *not* change the mathematical definition of computability. We would simply say, "The brain is a hypercomputer," and keep the Turing definition for "algorithmic computation."

  ### 4. Why We Still Use Turing Machines (It's Not Inertia)
  You asked: *"Is it just historical inertia, or does the old model have some real advantage?"*

  It is absolutely not inertia. It is because the concept of "Turing Computability" is **robust**.

  In the 1930s, logicians came up with many different ways to define computation:
  *   Turing Machines (tape and head)
  *   Lambda Calculus (function abstraction)
  *   General Recursive Functions (Gödel/Herbrand)
  *   Register Machines
  *   Tag Systems

  **They all turned out to be exactly equivalent.** Any function computable in one is computable in the others. This convergence is known as the **Invariance Thesis**. It suggests that "Turing Computability" isn't just an arbitrary model; it discovers a fundamental property of logic and information.

  **Why not switch?**
  1.  **Simplicity:** TMs are incredibly simple to define mathematically, making them perfect for proofs (like proving the Halting Problem is undecidable).
  2.  **Universality:** Since all programming languages (Python, C++, Quantum Circuits) are Turing-equivalent, proving something about TMs proves it about all of them.
  3.  **Precision:** Unlike "the brain" or "physical reality," a Turing Machine is a precise mathematical object. We define "computable" *as* "Turing computable." If we find a physical process that does more, we don't change the math; we acknowledge that physics exceeds our current model of algorithmic computation.

  ### The Phlogiston Analogy
  You mentioned: *"Feels a bit like still teaching phlogiston in chemistry."*

  This analogy doesn't hold because phlogiston was a **falsified physical theory**. It claimed to explain combustion, but experiments showed it didn't exist.

  The Turing Machine is more like the **definition of a "Triangle."**
  If you discovered a physical object that looked like a triangle but had 4 sides in some exotic quantum geometry, you wouldn't change the definition of a triangle in Euclidean geometry. You would say, "Physical space is non-Euclidean."

  Similarly, if quantum computers or brains do "more" than TMs, we don't throw out Turing Machines. We acknowledge that **Physical Computability** might be broader than **Algorithmic Computability**. But for the study of algorithms, logic, and software, the Turing Machine remains the precise, unchanging yardstick.

  ### Summary
  1.  **CTT is a hypothesis, not a theorem.** It links intuition to math.
  2.  **Quantum computers speed things up; they don't make the uncomputable computable.**
  3.  **Penrose's claims are unproven and controversial.**
  4.  **Turing Machines are used because they are mathematically robust and equivalent to all other logical models of computation.**

  We teach Turing Machines not because we think the universe is made of tape and heads, but because they define the boundary of what can be achieved by *logic and procedure*, regardless of the hardware.
