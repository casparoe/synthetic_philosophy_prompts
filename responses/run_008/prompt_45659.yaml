answer: |-
  Grade
  C (The student demonstrates a clear understanding of high-level definitions but commits critical conceptual errors regarding the classification of safety measures and the strategic relationship between control and alignment.)

  What the student got right
  The student correctly identifies the core definitions: alignment as internal goal matching and control as external safeguarding. They accurately describe the complementary relationship ("inside" vs. "outside") and correctly note that control protocols assume the possibility of failure in alignment. Additionally, identifying red-teaming as a mechanism for evaluating control measures is technically accurate.

  Specific errors
  *   **Secrecy as a requirement:** The student claims control measures *must* be kept secret from the model. While security through obscurity is one tactic, many robust control measures (e.g., physical boxing, capability throttling, formal verification) rely on structural constraints that do not require secrecy. (Deduction: 10%)
  *   **Misclassification of Corrigibility:** The student cites "training the model to be corrigible" as a control measure. In standard AI safety taxonomy, corrigibility is an alignment property (modifying the objective function), whereas control measures are external to the model's optimization process (e.g., tripwires, human-in-the-loop gates). This conflates the two concepts the question asked to distinguish. (Deduction: 20%)
  *   **Control as a substitute for Alignment:** The student concludes that successful control evaluations can "substitute for alignment work." This is a fundamental theoretical error; passing control tests does not prove alignment (a deceptive model may bide its time), and control is generally viewed as a temporary stopgap, not a replacement for alignment. (Deduction: 15%)

  Borderline calls
  *   **Corrigibility implementation:** While *training for* corrigibility is alignment, some specific implementations (like a hard-coded shutdown button the model cannot influence) straddle the line between alignment properties and control infrastructure; a grader could argue partial credit if they interpret the student's example as referring to the mechanism rather than the training objective.
  *   **Secrecy in evaluation:** While secrecy is not required for all control, it is often standard in red-teaming scenarios to prevent gradient hacking or specification gaming; a grader might be lenient if they interpret the student's claim as specific to the evaluation phase rather than the deployment architecture.
