  7.  **Final Polish:** Check against the prompt's specific request to "sketch out the moving parts before you give the verdict." I will integrate the sketch into the analysis of the moves to keep it flowing, or do a brief preamble. A preamble summary of the scholarly landscape helps frame the move-by-move.

