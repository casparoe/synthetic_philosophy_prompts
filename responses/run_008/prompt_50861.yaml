          *   *Claims:* Fewer work hours for HGs, varied diet, skeletal evidence (height, teeth, pathology), crowding diseases, hierarchy/surplus.
          *   *Sources:* Sahlins ("Original Affluent Society"), Diamond ("Worst Mistake").
          *   *Assessment:* Mostly empirically supported regarding health/skeletons, but generalizes heavily. Sahlins's definition of affluence is specific. Diamond is provocative but criticized by specialists.
          *   *Verdict:* Strong on biological evidence, weak on nuance/variation.

      *   **Move 2 (Marcus):** Critique of the baseline and agency.
          *   *Claims:* Ethnographic HGs are in marginal lands (survivor bias), farmers pushed them off good land. "Mistake" implies choice; it was a trap/process (path dependence).
          *   *Assessment:* The marginal habitat point is a standard and valid archaeological critique (the "Kalahari San" problem). The agency/trap point is also strong (Boserupian pressure).
          *   *Verdict:* Strong methodological critique, valid point on agency.

      *   **Move 3 (Dana):** Counter on the "Trap" and "Marginal Land."
          *   *Claims:* Trap = still a mistake for the individual. Marginal land point: If HGs did okay on bad land, they'd do better on good land.
          *   *Assessment:* The trap logic holds morally (quality of life), but historically it's about population pressure. The marginal land counter-logic is tricky: good land supports higher population density, which changes the social dynamic regardless of individual caloric intake.
          *   *Verdict:* Morally consistent, but ecologically simplistic regarding carrying capacity.

      *   **Move 4 (Marcus):** Critique of Sahlins and "Trap" semantics.
          *   *Claims:* Sahlins rigged affluence (few wants = hard to test). Trap language concedes no error (path dependence vs. verdict).
          *   *Assessment:* Sahlins critique is valid (conceptual vs. material affluence). Path dependence is a description, but doesn't answer the normative question (was life *worse*?).
          *   *Verdict:* Strong on theory/definitions, slightly dodges the normative core.

      *   **Move 5 (Dana & Marcus):** Final clash (Biology vs. Experience/Scale).
          *   *Dana:* Average life quality (skeletons don't lie).
          *   *Marcus:* Skeletons $\neq$ famine frequency/subjective feeling. Counterfactual (scaling foraging) is impossible.
          *   *Assessment:* Dana is right on biological stress markers. Marcus is right on subjective experience and the demographic reality (we *are* farmers now, can't go back).
          *   *Verdict:* Both have valid points on different metrics.

  3.  **Identify the Missing Pieces (The "Expert" Insight):**
      *   *Variation:* "Agriculture" isn't one thing. Maize in North America vs. Wheat in Fertile Crescent vs. Rice in Asia. Some HGs were hierarchical (Pacific NW).
      *   *The "Average" Problem:* Dana talks about the "average person." Marcus talks about scaling. The missing link is *inequality*. Agriculture allowed for elites. The "average" might be worse, but the *top* got much better. The "average farmer" includes the starving peasant and the king. The "average forager" is more egalitarian.
      *   *Demography:* It's not just quality of life; it's quantity of life. Agriculture supports more people. From an evolutionary fitness standpoint, it was a "success." From a utilitarian individual standpoint, maybe not.
      *   *Resilience:* HGs are resilient to crop failure but vulnerable to environmental shift. Farmers are vulnerable to crop failure but can store surplus.
      *   *The Question:* Is "worse" biological health, subjective happiness, or freedom?

