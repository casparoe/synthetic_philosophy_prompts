      *   "Is it AI risk?" paragraph? Yes.

  10. (Final thought): Ensure I mention the "Competitive Pressure" argument. That's the engine of the slow drift. If that engine breaks, the theory breaks.

  11. *Wait, one more nuance:* The user asks about "committed defenders of the view." Who are they? People like Robin Hanson (some aspects), certain governance researchers, maybe some parts of the "Alignment as Governance" crowd. I should characterize their likely concessions accurately.

