answer: |-
  This is a classic engineering leadership dilemma, and it's great that you're thinking about it principledly rather than just reacting emotionally. Your gut and your tech lead aren't actually pointing in opposite directions; they are optimizing for different variables.

  Your tech lead is optimizing for **code correctness**.
  Your gut is optimizing for **team health and trust**.

  Both are critical. If you ignore the tech lead, the code rots. If you ignore your gut, the team rots.

  Here is a framework for disentangling the technical signal from the social noise, and how to handle the "hypocrisy trap" you're worried about falling into.

  ### 1. The Principle of Anonymous Merit (The Tech Lead's Point)
  Your tech lead is objectively right about one thing: **A bug is a bug, regardless of who points it out.**

  In code review, the ideal mental model is to imagine the comment was written by an anonymous bot.
  *   **Is the technical point valid?** (e.g., "This edge case isn't handled," or "This query will N+1.")
  *   **Is the suggestion actionable?**

  If the answer is yes, you accept the feedback. If you reject a valid technical point because you dislike the messenger, you are prioritizing your ego over the product. That *does* make you unprofessional.

  **The Principle:** Evaluate the *proposition*, not the *proposer*.
  **The Action:** When D comments, strip away the tone and the name. If the technical claim is true, fix the code. This protects *your* reputation as an engineer who cares about quality, regardless of D's reputation.

  ### 2. The Principle of Psychological Safety (Your Point)
  However, your tech lead's view is incomplete because software engineering is a social activity. Code review isn't just about finding bugs; it's about knowledge sharing and maintaining a culture where people feel safe to take risks and admit mistakes.

  D is engaging in **blame**, not **review**.
  *   **Review:** "This error handling looks risky because X. Let's add a retry mechanism."
  *   **Blame:** "This error handling is sloppy. You should have caught this in testing."

  When someone consistently critiques others while failing to meet the same standards, it signals that the rules are weapons, not guardrails. This creates a culture of defensiveness. People stop shipping, they over-engineer to avoid criticism, or they hide mistakes.

  **The Principle:** Valid technical points do not justify toxic delivery or hypocritical enforcement.
  **The Action:** You don't have to accept the *tone*. You can acknowledge the technical point while setting boundaries on the interaction.

  ### 3. The Hypocrisy Trap (Your Standing)
  You asked: *"If I call D out on his hypocrisy... aren't I sort of doing the same thing he does?"*

  This is the most nuanced part. There is a difference between **policing code** and **policing behavior**.

  *   **D's behavior:** Policing code (often correctly) while violating standards himself.
  *   **Your potential behavior:** Policing D's behavior while admitting you violate standards yourself.

  If you call D out while you are also cutting corners, you lose moral authority. It becomes a "pot calling the kettle black" situation, and the team will view it as drama rather than process improvement.

  **However,** you have an out. You admitted: *"I've cut corners on code review plenty of times."*
  That is a fixable variable. D's hypocrisy is a pattern; your admitted corner-cutting can be a past behavior you are actively correcting.

  **The Principle:** You gain the standing to address cultural toxicity when you align your own actions with the standards you wish to see.
  **The Action:** Before you confront D or the lead about D's behavior, spend two weeks being ruthlessly rigorous with your own reviews and code. Once your own house is clean, you have the standing to talk about team standards.

  ### 4. A Principled Framework for Decision Making
  To answer your specific question on when a hypocrite's blame carries weight, use this matrix:

  | Scenario | Technical Validity | Hypocrisy Level | Action |
  | :--- | :--- | :--- | :--- |
  | **A** | Invalid | High | Reject technically. Ignore the person. |
  | **B** | Valid | High | **Accept the fix.** Document the standard. Ignore the tone. |
  | **C** | Valid | Low (They follow rules) | Accept the fix. Learn from them. |
  | **D** | Invalid | Low | Discuss technically. They are likely mistaken, not malicious. |

  **D falls into Scenario B.** You take the code improvement, but you do not grant him *status* or *authority*. You don't have to thank him profusely or treat him as a mentor. You treat him as a linter that sometimes runs hot.

  ### 5. How to Handle D (Without Being D)
  You don't need to "call D out" in a public showdown. That usually backfires. Instead, change the dynamic.

  **1. Depersonalize the Feedback**
  When D writes a blaming comment ("You should have caught this"), reply neutrally and technically.
  *   *D:* "This error handling is sloppy. You should have caught this in testing."
  *   *You:* "Good catch on the edge case. I'll add a specific test case for this scenario in this PR."
  *   *Why:* You validate the technical point (Lead is happy) but you refuse to engage with the blame (You protect your dignity).

  **2. Shift from "You" to "We"**
  If D's comments are consistently aggressive, bring it up in a retro, not a confrontation.
  *   *Don't say:* "D is too harsh and hypocritical."
  *   *Do say:* "I've noticed our code reviews are focusing heavily on what went wrong rather than how to fix it. Can we agree on a team norm that reviews focus on the code, not the testing process of the author?"
  *   *Why:* This addresses the behavior without attacking the person.

  **3. The "Clean Hands" Strategy**
  Since you admitted to cutting corners, fix that first. When you do eventually raise the issue of team standards with your Tech Lead, frame it around *sustainability*, not *D*.
  *   *Say:* "I want to make sure our review standards are sustainable for everyone. Sometimes I worry that if the standards are applied unevenly, it creates resentment. Can we clarify what 'done' looks like so we aren't relying on individual interpretation?"
  *   *Why:* This forces the Lead to address D's inconsistency without you having to name-and-shame.

  ### Summary
  Your tech lead is right that **truth is independent of the speaker.** Do not let your dislike of D result in worse code.

  But you are right that **trust is dependent on consistency.** A team cannot function long-term if the rules are weapons used by the hypocritical against the diligent.

  **The Verdict:**
  1.  **Accept D's technical points** when they are correct. Protect your code quality.
  2.  **Ignore D's tone.** Do not internalize the blame.
  3.  **Clean up your own corner-cutting.** This gives you the moral standing to care about culture.
  4.  **Address the culture, not the person.** Push for clear, written standards so that "sloppy" is defined by a doc, not by D's mood.

  D is playing a status game. The only way to win is to refuse to play, while ensuring your code is undeniable.
