answer: |-
  Two ethicists, Sarah and David, are grabbing coffee after a particularly brutal department meeting on normative theory. David looks exhausted.

  "I did it," David says, staring into his latte. "I finally found a genuinely supererogatory act."

  Sarah raises an eyebrow. "Define 'genuinely.' Did it maximize utility?"

  "Yes."

  "Did it involve significant sacrifice?"

  "Massive. I gave away my entire holiday bonus to fund a malaria net distribution in a high-impact zone."

  Sarah nods slowly. "Okay. But could you have given more?"

  "Well, sure, if I sold my car."

  "Then according to the Shallow Pond argument, keeping the car is morally equivalent to letting a child drown to buy a Honda. So the donation wasn't above and beyond; it was just meeting the baseline obligation of not letting children drown. It's obligatory."

  David sighs. "Fine. Next year, I'll sell the car. I'll give 90% of my income."

  "Okay," Sarah says. "But here's the Wolf problem. If you give 90% and you *don't* miss the money—if you genuinely prefer saving strangers to buying nice things—then you're a Moral Saint. And Wolf says Moral Saints are psychologically unhealthy and boring to be around. So we can't praise you, we have to intervene."

  "Okay, so I give the 90%, but I *hate* it. I cry every time I transfer the funds. I miss my car."

  "Then you're not a Saint," Sarah says. "You're just a person doing their duty while complaining about it. Which makes you morally adequate, but not praiseworthy. You don't get a gold star for not committing a slow-motion murder by hoarding resources."

  David puts his head in his hands. "So the category is empty. The 'Supererogation Bucket' has no bottom because the demandingness objection ate it, and it has no handle because the Moral Saint objection broke it."

  "Basically," Sarah says, taking a sip of her coffee. "There is no act that is good-but-not-required, because if it's good, it's required, and if you do it happily, you're defective, and if you do it sadly, you're just compliant."

  "There has to be *something*," David insists. "What if I save the child, give away the car, *hate* it, but do it with a smile so my family doesn't worry?"

  Sarah considers this. "So you're maximizing utility, violating your personal interests, suffering psychologically, and engaging in emotional labor to maintain social cohesion?"

  "Yes."

  "That's not supererogatory, David," she says, patting his arm. "That's just being married."
