answer: |-
  ### (1) Exam Question

  **Question 4 (25 Marks)**

  **Setup:** Consider the standard Sleeping Beauty protocol: A fair coin is tossed on Sunday. If Heads ($H$), Beauty is awakened Monday only. If Tails ($T$), she is awakened Monday and Tuesday, with amnesia between awakenings. All awakenings are subjectively indistinguishable.

  **The Bookie:** An outside observer, Bookie, does not see the coin. *Ex ante*, Bookie is assigned one of the three possible awakening slots ($H$-Mon, $T$-Mon, $T$-Tue) with equal probability ($1/3$ each). After the experiment concludes, if Bookie's assigned slot was realized, he is shown a video of that awakening. If not, he sees nothing. Bookie is shown a video.

  **The Betting:** A bet on $H$ pays \$1 if $H$, \$0 if $T$. This bet can be offered under two regimes: (i) **Per-Experiment**: Settled once after the coin toss, regardless of awakenings; (ii) **Per-Awakening**: Settled individually at each awakening (so a $T$ run involves two distinct bets).

  **(a)** Calculate Bookie's credence in $H$ conditional on seeing the video. Show your work using Bayes's Theorem. (5 marks)

  **(b)** A Thirder Beauty holds credence $1/3$ in $H$ upon waking. Bookie (from part a) also holds $1/3$. However, their evidence differs structurally. Explain precisely why Beauty's awakening cannot be treated as the same kind of random draw from awakenings that Bookie's video is, focusing on the contingency of the observation. (5 marks)

  **(c)** Demonstrate how both a Halfer ($P(H)=1/2$) and a Thirder ($P(H)=1/3$) can agree on the "fair odds" for the bet under *both* betting regimes, provided they maximize expected utility correctly. (5 marks)

  **(d)** Assess whether the Halfer/Thirder dispute is merely verbal or substantive. In your assessment, you must weigh the Thirder's violation of van Fraassen's Reflection Principle against the Halfer's commitment to the "Double-Halfer" position (where $P(H | \text{Monday}) = 2/3$). Conclude which theoretical cost is higher. (10 marks)

  ***

  ### (2) Model Answer

  **(a) Bookie's Credence**
  Let $V$ be the event Bookie sees a video. The prior probability of the coin states is $P(H) = P(T) = 1/2$. Bookie is assigned a slot uniformly from $\{H_1, T_1, T_2\}$.
  If $H$, only slot $H_1$ is realized. Bookie sees $V$ only if assigned $H_1$ (prob $1/3$). So $P(V|H) = 1/3$.
  If $T$, slots $T_1$ and $T_2$ are realized. Bookie sees $V$ if assigned $T_1$ or $T_2$ (prob $2/3$). So $P(V|T) = 2/3$.
  By Bayes's Theorem:
  $$P(H|V) = \frac{P(V|H)P(H)}{P(V|H)P(H) + P(V|T)P(T)} = \frac{(1/3)(1/2)}{(1/3)(1/2) + (2/3)(1/2)} = \frac{1/6}{3/6} = \frac{1}{3}.$$
  Bookie's credence is $1/3$.

  **(b) Structural Difference in Evidence**
  While both arrive at $1/3$, the epistemic situations differ. Bookie's observation is *contingent*: there was a $2/3$ chance he would see nothing (if $H$ and he was assigned a $T$-slot, or vice versa). His evidence is "My random assignment matched a realized slot." Beauty's observation is *necessary*: given she exists in the experiment, she *must* find herself awake. She cannot observe "nothing." A Thirder treats Beauty *as if* she were randomly sampled from awakening slots (SSA), but strictly speaking, Beauty lacks the external selection mechanism Bookie has. The Thirder must argue that indexical certainty ("I am here now") warrants the same probability shift as external random sampling, which is the crux of the Self-Sampling Assumption.

  **(c) Betting Regimes and Fair Odds**
  Fair odds depend on expected payoff, which combines credence with the betting regime.
  **Per-Experiment:** The bet settles once.
  Halfer: $E = (1/2)(\$1) + (1/2)(\$0) = \$0.50$. Fair price: \$0.50 (1:1 odds).
  Thirder: Must account for the fact that in $T$, she bets twice but settles once? No, under Per-Experiment, the bet is offered once. If the Thirder bets every awakening, she bets twice in $T$.
  *Correction:* If the bet is offered *once per experiment*, Beauty bets once. $E = P(H) \times 1$. Halfer pays 50c. Thirder (if she bets once) pays 33c? No, standard Thirder decision theory aligns with 1/3 credence only if bets are Per-Awakening.
  *Reconciliation:*
  **Per-Awakening:** Bet settles every waking.
  $H$: 1 bet, Win \$1. Total \$1.
  $T$: 2 bets, Lose \$0. Total \$0.
  Expected Payoff per bet = $P(H) \times 1$.
  Halfer ($P=1/2$): Fair price 50c. But she loses 2x in $T$. To break even over many experiments: Win 1 (\$1) vs Lose 2 (\$0). Average per experiment: \$0.50. Average per bet: \$0.33.
  Thus, under Per-Awakening, the "fair price" per bet is 33c. The Thirder's credence (1/3) matches this. The Halfer ($1/2$) must recognize the bet frequency differs by outcome; her expected utility calculation yields the same 33c fair price despite $1/2$ credence.
  **Per-Experiment:** Bet settles once. Fair price is 50c. Halfer's credence matches. Thirder must adjust decision rule (e.g., "bet as if 1/2").
  Both camps agree on action (price) when the settlement structure is fixed; they disagree on the *description* of the belief state.

  **(d) Substantive vs. Verbal and Diagnostic Costs**
  The dispute is substantive because it concerns the norms of belief updating, not merely terminology.
  **Thirder Cost (Reflection):** On Sunday, Beauty knows $P(H)=1/2$. She knows that upon waking, she will have $P(H)=1/3$. Van Fraassen's Reflection Principle states one's current credence should equal one's expected future credence. The Thirder violates this, implying she expects her future self to be irrational or misinformed without new relevant evidence (since she knew the protocol Sunday). She must reject Reflection or argue that "loss of memory" counts as evidence loss.
  **Halfer Cost (Double-Halfer):** The Halfer holds $P(H)=1/2$ on waking. If told "It is Monday," she must update. $P(H | \text{Mon}) = P(H \& \text{Mon}) / P(\text{Mon}) = (1/2) / (3/4) = 2/3$. This is the "Double-Halfer" position. It implies that merely learning the day (which provides no causal info about the coin) shifts credence toward Heads. This violates the principle that irrelevant indexical information should not shift non-indexical credences.
  **Verdict:** The Thirder's cost is higher. Violating Reflection undermines the coherence of diachronic rationality. The Halfer's conditionalization on Monday is counter-intuitive but mathematically consistent within a framework that treats indexical evidence as standard evidence. The Thirder requires a more radical departure from standard Bayesian norms (rejecting Reflection or accepting "self-locating evidence" as fundamentally distinct). Thus, the dispute is substantive regarding the architecture of rational updating.

