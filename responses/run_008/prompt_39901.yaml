  Here is the material I want the question built around, in three parts. First, my own variant of the setup, which I want stated in full in the question so it is self-contained: alongside the standard Sleeping Beauty protocol (fair coin Sunday night; Heads means one awakening Monday, Tails means awakenings Monday and Tuesday with amnesia in between), there is an outside observer, Bookie, who never sees the coin. After the experiment ends, Bookie is shown a video of exactly one awakening, chosen uniformly at random from all the awakenings that occurred, and is asked for his credence in Heads. Second, the settlement asymmetry: a bet on Heads can be offered to Beauty under two regimes — settled once per experiment, or placed and settled once per awakening (so a Tails run means two payoffs). Third, the two diagnostic problems: the thirder's apparent violation of Reflection (Sunday-Beauty, knowing she will wake with credence 1/3, must apparently expect her own future self to "irrationally" diverge from a credence of 1/2 today), and the halfer's problem with being told the day (the move to the double-halfer position, holding credence 1/2 on waking but 2/3 conditional on learning it is Monday, which requires treating temporal indexical evidence as somehow non-standard when conditionalized upon).

  Please think carefully before writing, and brainstorm a few possible framings before committing to one — I want the framing that best forces engagement with my material rather than with the textbook debate. Then deliver three things. (1) The exam question itself, self-contained, phrased so that a student who merely recites the standard arguments scores poorly: it should ask them to compute Bookie's credence, explain precisely why the thirder cannot treat Beauty's own awakening as the same kind of random draw from awakenings that Bookie's video is, show how the two betting regimes make the same "fair odds" answer available to both camps once the settlement structure is fixed, and then assess whether all this means the halfer/thirfer dispute is substantive or merely verbal about the word "credence," including the Reflection and double-halfer diagnostics as costs each camp must pay. (2) A model answer of about 600 words that is even-handed — it may land on a verdict, but only after laying out what each side must concede. (3) A marking scheme for the 25 marks: five or so must-hit points with the marks each is worth, a clear statement of what separates an A answer from a B answer in terms of the specific moves each must contain, and a one-line note on how students typically get each must-hit point wrong. Please keep the mathematics elementary enough for the exam conditions — explicit applications of Bayes's theorem with the numbers worked through, not appeals to measure-theoretic machinery.
