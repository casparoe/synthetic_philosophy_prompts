  ### (3) Marking Scheme

  **Total: 25 Marks**

  **1. Bookie's Calculation (5 Marks)**
  *   **Must-Hit:** Correct application of Bayes's Theorem yielding $P(H|V) = 1/3$.
  *   **Breakdown:** 2 marks for correct likelihoods ($1/3$ vs $2/3$); 2 marks for correct prior usage ($1/2$); 1 mark for final result.
  *   **A vs B:** A answers explicitly define the sample space of slots. B answers often assume $P(V|H)=1$ (ignoring the assignment probability).
  *   **Common Error:** Calculating $1/2$ by claiming Bookie sees "an awakening" in both worlds with equal probability.

  **2. Evidence Distinction (5 Marks)**
  *   **Must-Hit:** Identification that Bookie's observation is contingent (could have seen nothing) while Beauty's is necessary (given existence).
  *   **Breakdown:** 3 marks for identifying contingency vs. necessity; 2 marks for linking this to the Self-Sampling Assumption (SSA).
  *   **A vs B:** A answers explain *why* this matters for the Thirder's justification. B answers merely state they are different without epistemic analysis.
  *   **Common Error:** Claiming Beauty is "inside" and Bookie is "outside" without analyzing the probability of observation.

  **3. Betting Reconciliation (5 Marks)**
  *   **Must-Hit:** Demonstration that fair *prices* converge when betting frequency is accounted for, even if credences differ.
  *   **Breakdown:** 2 marks for Per-Experiment analysis (50c); 2 marks for Per-Awakening analysis (33c); 1 mark for explicit statement that actions align.
  *   **A vs B:** A answers show the Halfer calculating expected utility over the *experiment* to derive the per-awakening price. B answers claim Halfers must bet at 50c always.
  *   **Common Error:** Confusing "Fair Odds" with "Credence" without adjusting for the number of bets placed in Tails worlds.

  **4. Reflection Principle Diagnostic (5 Marks)**
  *   **Must-Hit:** Clear statement that Thirders violate Reflection (Sunday $1/2 \neq$ Expected Monday $1/3$).
  *   **Breakdown:** 3 marks for identifying the violation; 2 marks for explaining the implication (expecting future irrationality).
  *   **A vs B:** A answers discuss whether memory loss counts as "evidence." B answers simply cite the principle.
  *   **Common Error:** Denying Reflection applies to self-locating belief without argument.

  **5. Double-Halfer & Verdict (5 Marks)**
  *   **Must-Hit:** Identification of the Halfer's $P(H|\text{Mon})=2/3$ problem and a reasoned verdict on which cost is higher.
  *   **Breakdown:** 2 marks for deriving/stating the 2/3 conditional; 3 marks for a coherent verdict weighing the two costs.
  *   **A vs B:** A answers provide a philosophical justification for why one norm (Reflection vs. Conditionalization) is more fundamental. B answers pick a side based on intuition alone.
  *   **Common Error:** Concluding the dispute is "merely verbal" to avoid weighing the costs.
