          *   *Critique:* The author is gone. The code is a lossy compression of their intent. For undefined behavior (inputs never conceived), the intent *literally does not exist*. You can't find what was never put there.
      *   **Dave (Instrumentalism/Pragmatism):** Code is a tool. Meaning is use. If we change the use, the meaning changes.
