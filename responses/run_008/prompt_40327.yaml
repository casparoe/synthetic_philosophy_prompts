  3.  **Address the "Fact of the Matter" (The Philosophy of Software):**

      *   This is a classic problem in philosophy of language and law (Wittgenstein, Kripke, Dworkin).
      *   *Kripke's Wittgenstein:* No finite set of past examples (tests/usage) logically necessitates a specific future rule. (The "Quus" problem).
