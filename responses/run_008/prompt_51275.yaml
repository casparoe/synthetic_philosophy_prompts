answer: |-
  The pattern presupposes a theory of asymmetric moral temporality in which justice requires the state to permanently inherit debts owed to victims while granting citizens a provisional right to outgrow their own pasts.

  Regarding the sorting of subjects and beneficiaries, the formulation that remembering is a debt to the dead and forgetting a benefit to the living is insufficient because it misidentifies the moral locus of the duties. The duty to remember is not merely owed to the deceased but is constitutive of the living community's moral identity; it fixes the status of the harm as an immutable public truth that defines the boundaries of the political order. This explains why denial laws protect living survivors: they are guardians of that public truth, not merely recipients of emotional comfort. Conversely, the duty to forget is not a benefit earned by the wrongdoer but a structural requirement of liberal citizenship that treats agency as mutable. If the state permanently marked every individual by their worst act, it would deny the possibility of moral renewal and effectively exile citizens from the political community they are meant to inhabit. Thus, the implicit theory distinguishes between the *status of the victim* (fixed by the harm suffered) and the *status of the agent* (fluid based on the capacity for change).

  The skeptic's debunking explanation—that states remember others' crimes and forget their own—fails as a universal theory because it cannot account for instances where states do compel memory of their own atrocities, such as post-war Germany's institutionalization of Holocaust remembrance. Therefore, a principled implicit theory survives the debunking, provided it distinguishes between *constitutive crimes* and *administrative deviance*. The principled theory holds that states must remember acts that attack the very possibility of justice (genocide, systemic tyranny) regardless of the perpetrator, while forgetting acts that occur within the framework of a functioning legal order (juvenile theft, individual violence). The skeptic correctly identifies a frequent hypocrisy where states misclassify their own constitutive crimes as administrative errors to seal archives, but this is a failure of application rather than a refutation of the underlying theory. The pattern presupposes that justice requires transparency for systemic evils but opacity for individual rehabilitation, even if states often manipulate this classification to protect their legitimacy.

  The pattern is philosophically underdetermined because it is equally licensed by rival theories of justice, specifically utilitarianism and deontology. A utilitarian justifies the pattern by weighing the social harm of forgetting atrocities (recurrence) against the social harm of remembering individual crimes (recidivism and lost productivity); a deontologist justifies it by appealing to the respect owed to victims as ends in themselves versus the respect owed to agents as autonomous beings capable of change. If the implicit theory were replaced with the view that memory has no moral claim beyond the bereaved generation, the practice would change radically: statutory remembrance would expire after roughly eighty years, transforming from a moral duty into optional history education; archives would become disposable rather than perpetual; and expungement would become immediate rather than delayed. The state would cease to function as a trans-generational moral agent and would instead operate as a present-focused utility manager, severing the link between historical truth and current legitimacy.
