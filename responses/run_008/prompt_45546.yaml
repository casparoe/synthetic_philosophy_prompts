      *   The most critical upstream question is: **What are the minimum neurobiological and behavioral criteria for sentience in fish and decapods, and how do these map onto specific aquaculture stressors?**
      *   Why? Because without establishing sentience criteria, welfare indicators are meaningless, and counting individuals (like larvae) is ethically ungrounded. It's the foundation for everything else (measurement, weighting, counting).
      *   Refining the bottom line for impact: Prioritize validating sentience criteria and welfare indicators over aggregating suffering metrics, because aggregation is impossible without knowing who suffers and how to detect it.

