answer: |-
  Fund research validating sentience criteria and welfare indicators before funding work on aggregating suffering, because you cannot measure or weigh welfare states that you cannot reliably detect or confirm exist.

  The most upstream question is **what specific neurobiological and behavioral criteria constitute felt pain versus reflexive nociception in target aquaculture species.** This is the foundational constraint; if an animal lacks the substrate for affective experience, welfare interventions are misallocated resources, and all subsequent calculations of suffering are category errors. This work requires interdisciplinary teams of philosophers of mind to define functional criteria and neurobiologists to map them onto specific taxa, making it tractable only through collaboration. This ranking drops if consensus emerges on specific neural markers (e.g., specific thalamocortical equivalents or integrated information measures); it rises if new evidence suggests current models falsely attribute sentience to reflexive systems or if regulatory bodies demand higher evidentiary standards for protection.

  The second priority is **which non-invasive indicators validly proxy subjective welfare states in commercial species without causing additional stress.** This depends on the first question but is upstream of aggregation because you cannot sum welfare footprints without reliable metrics that distinguish stress from suffering. It is primarily tractable for biologists and ethologists, though conceptual work is needed to link proxies to states. A critical missing upstream issue here is the **validity of cross-species extrapolation**; most indicator work relies on model organisms (zebrafish, crayfish), not aquaculture species (salmon, shrimp), so funding must prioritize validation in actual farmed species. This moves down if a universal biomarker (e.g., a specific neural signature) is discovered; it moves up if current indicators (e.g., cortisol, ventilation) are proven to dissociate from affective state in high-stress environments.

  The third priority is **at what developmental stage larvae acquire the capacity for suffering, and whether high mortality prior to this stage constitutes a welfare loss.** This is downstream of sentience criteria but upstream of population ethics because counting dead larvae is meaningless if they were never sentient. It needs developmental biologists and ethicists to map nervous system development against functional pain criteria. It moves down if sentience is confirmed to onset only post-larval stage; it moves up if evidence shows early nociceptive systems are coupled with affective processing sooner than expected, making the massive mortality rates in shrimp larviculture the dominant welfare issue.

  The least upstream question is **how brief, high-intensity suffering (slaughter) should be weighted against chronic, low-intensity suffering (housing) across a population.** This is the least upstream question, as it requires settled answers on who suffers, how to measure it, and how many count. It is primarily tractable for philosophers and welfare economists. It moves up only if measurement and sentience are resolved; it moves down if empirical data shows one source of suffering overwhelmingly dominates the other regardless of weighting function, rendering the theoretical trade-off moot for practical intervention.
