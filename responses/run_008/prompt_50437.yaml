  2.  **Deconstruct the Paradox (for internal understanding, not exposition):**
      *   You pick Envelope A. It contains $X$.
      *   Envelope B contains either $2X$ or $X/2$.
      *   Expected value of switching = $0.5(2X) + 0.5(X/2) = 1.25X$.
      *   Since $1.25X > X$, you should switch.
      *   But if you switch to B, the same logic applies to A. So you should switch back.
