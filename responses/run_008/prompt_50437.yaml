      *   *Emotional Angle:* For an actuary, this is a glitch in the matrix of reason. It represents the failure of calculation to yield certainty. It mirrors grief—the inability to calculate the value of what's lost vs. what remains. Switching becomes a metaphor for second-guessing grief, or the futile desire to optimize loss.

