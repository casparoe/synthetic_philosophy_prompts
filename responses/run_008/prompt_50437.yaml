      *   **Scene 4: The Math.** Interior monologue. The expected value calculation. The itch. Why switch? Because $1.25x$. But why not stay? Because it's arbitrary. The actuary brain cannot tolerate the error.
      *   **Scene 5: The Emotional Core.** Why does she want to switch? Is it optimizing grief? Is it refusing to accept the first hand dealt? Julian was impulsive; she was careful. This is their final argument.
      *   **Scene 6: The Climax.** She decides to switch. She hands over A, takes B.
      *   **Scene 7: The Aftermath.** She holds B. She knows A is either half or double. The math is the same. She hasn't solved anything. David is gone. She missed the moment of closure.

  6.  **Refining the Prose:**
      *   Avoid jargon. No "expected value," "probability distribution." Use descriptions of weight, balance, scales.
