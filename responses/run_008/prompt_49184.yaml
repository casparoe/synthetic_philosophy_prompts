      *   Did I mark Non-negotiable vs. Camp Preference? Yes.
      *   Did I flag the inconsistent trio? Yes (Lewis's Trilemma).
      *   Did I identify the exclusionary requirement? Yes (usually Supervenience or Strict Admissibility).
      *   Did I score the 3 theories? Yes.

  7.  **Final Polish:** Ensure the tone is appropriate for a reading group prep sheet (analytic, structured, slightly provocative). (Proceed to generate output).

      *Wait, one nuance on the Trilemma:* The prompt asks to make the inconsistency precise. I need to explicitly state:
      1. Principal Principle (PP).
      2. Humean Supervenience (HS).
      3. Admissibility of Chance Claims (ACC).
      Show how HS + ACC $\to$ $\neg$PP (because chance claims carry info about the future under HS).

      *Exclusionary Requirement:* Which one excludes candidates? If we hold PP as sacred (per the prompt's job description), then HS is the one that gets excluded (or heavily modified). If we hold HS as sacred, PP gets modified (New Principle). The prompt says "Fix the purpose... vindicate deference". So PP is the anchor. Therefore, HS is the vulnerable point.

      *Let's write it.*
answer: |-
  # Specification for a Theory of Objective Chance
  **Prepared for:** Reading Group on Metaphysics of Probability
  **Purpose:** To vindicate rational deference to chance while maintaining chance as an ontic feature of the world.

  ## I. The Desiderata List
  A theory of chance is adequate only if it satisfies the **Non-negotiable** constraints. The **Camp Preferences** represent metaphysical commitments that theories may adopt, but which should not be presented as universal requirements for the concept of chance itself.

  ### 1. The Deference Constraint (The Principal Principle)
  *   **Specification:** If an agent learns that the objective chance of event $A$ is $x$, and possesses no *inadmissible* evidence, her credence in $A$ must be $x$. Formally: $C(A \mid Ch(A)=x \ \& \ E) = x$, where $E$ is admissible.
  *   **Case:** The baseline job description. Without this, "chance" is indistinguishable from physical necessity or mere frequency.
  *   **Status:** **Non-negotiable.** (This is the functional definition of the role.)

  ### 2. The Admissibility Criterion (The Crystal Ball)
  *   **Specification:** The theory must provide a principled distinction between admissible and inadmissible evidence. Specifically, it must explain why direct evidence of the outcome (e.g., a crystal ball showing $A$ occurs) overrides chance, while evidence of the past and laws does not.
  *   **Case:** **The Crystal Ball.** If I see tomorrow's lottery result in a crystal ball, my credence should be 1, not the chance $x$. A theory that cannot explain why this evidence "breaks" deference fails to distinguish chance from prophecy.
  *   **Status:** **Non-negotiable.** (Without this, the Deference Constraint is falsified by trivial counterexamples.)

  ### 3. The Fixity of the Past
  *   **Specification:** The objective chance of an event that has already occurred and settled must be 0 or 1.
  *   **Case:** **Past Events.** If the coin landed heads at $t_1$, its chance at $t_2$ (where $t_2 > t_1$) cannot be 0.5. Chance concerns future openness, not past mystery.
  *   **Status:** **Non-negotiable.** (Violating this collapses chance into epistemic probability.)

  ### 4. The Linearity Constraint (The Mixture)
  *   **Specification:** Deference must commute with uncertainty about chance values. If an agent knows the chance is either $x$ or $y$ with probabilities $p$ and $1-p$, her credence in $A$ must be $px + (1-p)y$.
  *   **Case:** **The Mixture Case.** If I know a coin is either biased 0.9 (50% chance) or 0.1 (50% chance), my credence in heads must be 0.5. A theory that forces me to pick one chance or the other without averaging fails to integrate chance into Bayesian reasoning.
  *   **Status:** **Non-negotiable.** (Required for coherence between first-order and higher-order probabilities.)

  ### 5. Ontic Independence (Objectivity)
  *   **Specification:** Chance facts must not reduce to facts about an agent's ignorance or evidence state. Two agents with different evidence in the same world must agree on the chance (even if they differ in credence).
  *   **Case:** General metaphysical grounding. Distinguishes objective chance from subjective probability.
  *   **Status:** **Non-negotiable.** (Explicitly required by the prompt's job description.)

  ### 6. Compatibility with Determinism
  *   **Specification:** The theory must state whether objective chances can exist in a world where fundamental laws are deterministic.
  *   **Case:** **Chances under Determinism.** In Statistical Mechanics, we assign probabilities to thermodynamic events despite underlying classical mechanics being deterministic.
  *   **Status:** **Camp Preference.** (Incompatibilists say "No chance without indeterminism." Compatibilists [e.g., Lewis, Loewer] say "Yes, level-relative chance." Do not demand one view as a condition of adequacy.)

  ### 7. Immunity to Undermining
  *   **Specification:** The theory must ensure that present chance facts are not rendered false by future patterns of events.
  *   **Case:** **Undermining.** If chances supervene on the total history (including the future), a future sequence of outcomes could make the present chance assignment false. A theory must explain why the present chance is stable despite this.
  *   **Status:** **Camp Preference.** (Humeans must modify Deference to solve this; Anti-Humeans claim this shows Humeanism is false. It is a theoretical cost, not a conceptual impossibility.)

  ### 8. Precision
  *   **Specification:** The theory must state whether objective chances are always precise real numbers or can be intervals.
  *   **Case:** **Imprecise Probabilities.** Some physical setups (e.g., unstable equilibria) may only fix a range of outcomes.
  *   **Status:** **Camp Preference.** (Orthodox probability theory assumes precision; imprecise probabilists disagree. Both are viable metaphysical positions.)

  ---

  ## II. The Inconsistency Trilemma
  The deepest result in the literature (Lewis, 1994; Hall, 1994) demonstrates that three plausible claims form an inconsistent triad. You cannot hold all three simultaneously.

  **The Trio:**
  1.  **The Principal Principle (PP):** $C(A \mid Ch(A)=x \ \& \ E) = x$ (for admissible $E$).
  2.  **Humean Supervenience (HS):** Chance facts supervene on the total pattern of occurrent facts (past, present, and *future*).
  3.  **Admissibility of Chance Claims:** Information about the present objective chance is itself admissible evidence (it does not give "crystal ball" information about the outcome).

  **The Conflict:**
  If **HS** is true, the present chance $Ch(A)=x$ is determined by the *entire* history of the world, including future events. Therefore, learning $Ch(A)=x$ provides information about the future pattern of events. If the future pattern includes the outcome of $A$, then learning $Ch(A)=x$ provides direct information about $A$'s outcome *other than via the chance value*.
  Consequently, under **HS**, the proposition $Ch(A)=x$ is **inadmissible** (violating **3**).
  If we insist it is admissible (**3**), then **PP** (**1**) yields incorrect credences because the chance claim carries "undermining" information about the future.
  To save **PP**, one must reject **HS** (Anti-Humeanism). To save **HS**, one must modify **PP** (Lewis's "New Principle").

  **The Exclusionary Requirement:**
  Given the job description fixed in the prompt ("vindicate deference"), **The Principal Principle (1)** is the anchor.
  Therefore, **Humean Supervenience (2)** is the requirement that does the most work in **excluding candidates**. Any theory that ties chance too tightly to the global future pattern (strict Humeanism) will fail the strict Deference Constraint unless it modifies the definition of deference. Theories that posit sui generis probabilistic laws (Anti-Humeanism) survive this trilemma but pay a metaphysical cost.

  ---

  ## III. Theory Scorecard
  *Brief evaluation of major candidates against the Non-negotiables (NN) and Camp Preferences (CP).*

  ### 1. Best-System Analysis (BSA) / Humeanism
  *   **Deference (NN):** **Fail (Strict) / Pass (Modified).** Fails the original Principal Principle due to the Undermining problem. Requires Lewis's "New Principle" to function.
  *   **Admissibility (NN):** **Pass.** Can define admissibility as "history up to time $t$," but tension remains with HS.
  *   **Fixity of Past (NN):** **Pass.** Past is fixed in the best system.
  *   **Objectivity (NN):** **Pass.** Chance is a feature of the systematization of the world, not the mind.
  *   **Determinism (CP):** **Pass (Compatibilist).** Easily accommodates SM chances as higher-level summaries.
  *   **Verdict:** Metaphysically parsimonious, but sacrifices the strict link between chance and credence.

  ### 2. Single-Case Propensities
  *   **Deference (NN):** **Pass.** Designed specifically to ground the Principal Principle directly.
  *   **Admissibility (NN):** **Pass.** Propensities are causal dispositions; knowing the disposition doesn't reveal the outcome (unless the disposition is 0 or 1).
  *   **Fixity of Past (NN):** **Pass.** Propensities are forward-looking.
  *   **Objectivity (NN):** **Pass.** Propensities are physical properties (like mass or charge).
  *   **Determinism (CP):** **Fail (Incompatibilist).** Generally requires indeterministic laws. Struggles with SM chances.
  *   **Verdict:** Strongest on the "Job Description," but metaphysically obscure (Humphrey's Paradox) and hostile to deterministic chance.

  ### 3. Hypothetical Frequentism
  *   **Deference (NN):** **Weak Pass.** Explains deference only via the Law of Large Numbers, which is less direct than PP.
  *   **Admissibility (NN):** **Pass.** Long-run frequencies are distinct from single outcomes.
  *   **Fixity of Past (NN):** **Pass.**
  *   **Objectivity (NN):** **Pass.** Facts about infinite sequences are worldly (on this view).
  *   **Mixture Case (NN):** **Fail.** Struggles with single-case uncertainty. If the "long run" is hypothetical, why should my credence in a *single* case match the hypothetical frequency? (The Reference Class Problem is fatal here).
  *   **Verdict:** Intuitively clear on objectivity, but fails to vindicate deference in single-case and mixture scenarios.

  ---
  **Recommendation for the Group:** Focus the argument on whether you are willing to modify the Principal Principle (favoring BSA) or whether you demand strict deference at the cost of Humean Supervenience (favoring Propensities). The "Determinism" constraint will likely split the room before the metaphysics even begins.
