      *   *Initial thought:* Use computers. *Correction:* Analog is faster for sketching concepts and removes tool friction.
      *   *Make sure the "Ambiguous Glyph" isn't just a trick.* It needs to rely on context (flanking letters) to resolve its identity.

  12. **Final Polish:** Ensure the distinction between "Category" (Letter Identity) and "Style" (Typeface Identity) is clear in the instructions without using the theoretical jargon until the end.

  *(Self-Correction on the "Ambiguous Glyph"):* Let's make sure it's specifically about the 'a'. Maybe a single-story vs double-story issue, or a shape that looks like a 'd' if the stem is on the right. Let's go with a shape that relies on the *neighbor* to define its directionality.

  *(Refining the Debrief):* Ensure I explicitly link the student's frustration during the grid task to the friend's "skeleton" vs. the instructor's "system" view.

