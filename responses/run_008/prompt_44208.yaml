answer: |-
  Here is a complete design for the session. It is tight on time (90 minutes), so strict facilitation is required. The design prioritizes the *felt experience* of the scoring rule changing the nature of the "belief" being reported.

  # Session Title: The Game of Truth
  **Goal:** Move from "credence as internal state" to "credence as strategic move" to "scoring rules as constitutive of the game."
  **Time:** 90 Minutes
  **Participants:** ~14
  **Materials:**
  *   Projector/Screen.
  *   Printed "Forecast Slips" (3 per person).
  *   Printed "Bookie's Ledger" (for the facilitator).
  *   Timer (visible).
  *   Cheap Prize (e.g., a used paperback, a mug, a bag of coffee).
  *   Whiteboard/Marker.

  ---

  ## Part 1: Setup & Round 1 (25 Minutes)
  **Concept:** Credence as a Move (Baseline).
  **Rule:** Quadratic Scoring (Brier Score).
  **Formula:** $Score = 1 - (p - outcome)^2$. (Range 0 to 1).

  1.  **Intro (5m):** Briefly state the goal. "Today we aren't just testing calibration. We are testing how the *rules of the game* change what it means to make a forecast."
  2.  **The Task (5m):** Distribute **Forecast Slip 1**.
      *   5 Binary Trivia Questions (Resolvable in-room via Google/Wikipedia).
      *   *Examples:* "Is the population of [City X] > 1 million?", "Was [Book Y] published before 1950?", "Is [Chemical Z] flammable?"
      *   Instruction: "Record your credence (0-100%) for 'True'. This round is scored using the standard Brier Score. Highest total points wins the prize."
  3.  **Forecasting (5m):** Participants fill out slips silently.
  4.  **Resolution & Scoring (10m):**
      *   Project the questions. Reveal answers one by one.
      *   Participants calculate their own scores (provide the formula on screen).
      *   Collect slips. Facilitator tallies top 3 scores on the whiteboard.
      *   **Debrief Note:** "Notice how you felt. You tried to match your number to your internal confidence. The rule felt transparent."

  ## Part 2: Round 2 - The Coherence Trap (25 Minutes)
  **Concept:** Probabilism as Dominance (Incoherence is a losing move).
  **Rule:** Brier Score, but on logically connected claims.
  **Claims:**
  1.  $A$: "The Eiffel Tower is taller than 350 meters."
  2.  $\neg A$: "The Eiffel Tower is NOT taller than 350 meters."
  3.  $A \land B$: "The Eiffel Tower is taller than 350 meters AND it was built before 1900."

  1.  **The Task (5m):** Distribute **Forecast Slip 2**.
      *   Participants assign probabilities to $A$, $\neg A$, and $A \land B$.
      *   Instruction: "Same scoring rule (Brier). Maximize your score."
  2.  **Forecasting (5m):** Participants fill out slips.
  3.  **The Bookie's Move (15m):**
      *   **Do not resolve the truth yet.**
      *   Ask for volunteers who assigned $P(A) + P(\neg A) \neq 1$ OR $P(A \land B) > P(A)$. (With 14 people, someone will have).
      *   **The Demonstration:** Pick one incoherent sheet. Project it.
      *   **The Bookie's Calculation:** Show that there exists a *coherent* set of probabilities that yields a better Brier score *regardless of the truth*.
      *   *Math for the Board:*
          *   Player's Incoherent Report: $P(A)=0.8, P(\neg A)=0.8$. (Sum > 1).
          *   Brier Penalty if True: $(1-0.8)^2 + (0-0.8)^2 = 0.04 + 0.64 = 0.68$.
          *   Brier Penalty if False: $(0-0.8)^2 + (1-0.8)^2 = 0.64 + 0.04 = 0.68$.
          *   *Total Loss:* 0.68 either way.
          *   **The Dominating Alternative:** Set $Q(A)=0.5, Q(\neg A)=0.5$.
          *   Brier Penalty if True: $(1-0.5)^2 + (0-0.5)^2 = 0.25 + 0.25 = 0.50$.
          *   Brier Penalty if False: $(0-0.5)^2 + (1-0.5)^2 = 0.50$.
          *   **Conclusion:** "By simply fixing your coherence, I have guaranteed you a better score (0.50 loss vs 0.68 loss) without knowing the answer. Your incoherence was a strictly dominated strategy."
      *   Resolve the trivia questions now to confirm the scores.

  ## Part 3: Round 3 - The Secret Switch (20 Minutes)
  **Concept:** Improperness (The rule dictates the epistemology).
  **Rule:** **"Confidence-Penalized" Rule** (Secretly Improper).
  **Formula:** $Score = [1 - (p - outcome)^2] - 2(p - 0.5)^2$.
  *   *Translation:* You get Brier points, but you lose 2 points for every unit you deviate from 50%.
  *   *Effect:* The optimal strategy is to report 50% on everything, regardless of knowledge.

  1.  **The Task (5m):** Distribute **Forecast Slip 3**.
      *   5 New Trivia Questions.
      *   **Crucial:** Do *not* announce the rule change. Say: "This round is scored for accuracy. Maximize your points."
  2.  **Forecasting (5m):** Watch the room. If the rule works, people who feel uncertain will drift toward 50% to stay "safe," even if they have a hunch. *Note: See critique section on the math of this.*
  3.  **The Reveal (10m):**
      *   Collect slips.
      *   Reveal the formula on the screen.
      *   Ask: "Who noticed their optimal strategy shifting?"
      *   Show the math: "If you report 90% and are right, you get Brier points but pay a confidence tax. If you report 50%, you pay no tax. The rule rewards *agnosticism*, not *accuracy*."
      *   **Point:** "This is an 'accuracy' rule in the ordinary sense (it uses the truth), but it is *improper*. It does not reward truth-seeking; it rewards safety-seeking."

  ## Part 4: Metric War (10 Minutes)
  **Concept:** Properness is necessary but not sufficient (Choice of Metric).
  **Activity:** Re-score Round 1 data.

  1.  **The Setup:** Take the top 3 leaderboards from Round 1 (Brier).
  2.  **The Switch:** Calculate **Logarithmic Score** for those same top 3 players.
      *   Formula: $\ln(p)$ if true, $\ln(1-p)$ if false. (Use natural log or base 10, just be consistent).
      *   *Note:* You need to handle $p=0$ or $p=1$ (assign a floor of 0.01 for the sake of the game to avoid infinity).
  3.  **The Discovery:** It is highly likely the ranking changes. Log score punishes overconfidence on errors much more severely than Brier.
      *   *Scenario:* Player A was 90% right always. Player B was 60% right always. Brier might prefer A. If Player A got one wrong at 99%, Log will crush them.
      *   If no divergence happens in the live data, have a **Prepared Hypothetical Sheet** ready to project that guarantees a divergence (e.g., "Forecaster X: 5 correct @ 90%, 1 wrong @ 90%" vs "Forecaster Y: 6 correct @ 60%").
  4.  **Point:** "Even among proper rules (rules that reward truth), the choice of metric changes who counts as the 'best' forecaster. Accuracy is not a single dimension."

  ## Part 5: Debrief (10 Minutes)
  **Guide for Facilitator:** Do not lecture. Ask questions that map their feelings to the concepts.

  1.  **On Credence as Action:** "In Round 1, did you feel like you were reporting a feeling, or making a bet?" (Target: It felt like a bet).
  2.  **On Dominance:** "In Round 2, when the Bookie showed the incoherent sheet, did it feel like a 'mistake' or a 'loss'?" (Target: It felt like handing money to the house).
  3.  **On Properness:** "In Round 3, when the rule changed, did your 'belief' change, or just your report?" (Target: My report changed to game the system. This proves the rule constitutes the belief).
  4.  **On Metric Choice:** "In Round 4, did the 'best' forecaster change? What does that say about 'Accuracy' as a goal?" (Target: Accuracy is a vector, not a scalar. We have to choose which errors we fear more).

  ---

  ## The Blunt Critique: What Will Go Wrong & What This Can't Do

  You asked for bluntness. Here is the failure mode analysis.

  ### 1. Predictable Failures (The "First Run" Bugs)
  *   **Time Creep in Round 2:** The Dominance calculation is mathematically dense. If you try to do it for multiple people, you will run out of time.
      *   *Fix:* Pre-select one clearly incoherent sheet during the forecasting phase. Do the math for *only that one person* on the board. Assert that the math holds for all others.
  *   **Round 3 "Hedging" Might Not Happen:** The "Confidence Penalty" rule I designed above incentivizes 50% reporting. However, if your group is competitive, they might notice the pattern after 2 questions and collude or complain.
      *   *Fix:* Be ready to admit the trick early if the mood sours. The pedagogical point holds even if they catch you after question 3.
      *   *Math Correction:* In your prompt, you mentioned linear rules lead to 50/50 hedging. **They do not.** A linear rule ($Score = p$ if true) incentivizes **extremization** (reporting 100% on your best guess). If you want hedging, you *must* use a penalty on confidence (like the one I designed in Round 3). Do not use a standard Linear Rule if you want to demonstrate hedging; use the Penalized Confidence rule.
  *   **Trivia Resolution Drag:** Looking up 15 trivia questions live takes forever.
      *   *Fix:* Have the answers pre-written on a hidden slide. Do not "search" live. Just reveal. The point is the scoring, not the research.

  ### 2. Fundamental Limitations (The "Lone Inquirer" Problem)
  You identified this, and it is crucial to state it clearly in the debrief so you don't undermine your own epistemology.

  *   **The Social vs. The Solitary:** This game works because there is a **Bookie** and a **Prize**. It models *pragmatic* rationality (winning the game).
      *   *The Limit:* Epistemology claims you should be coherent even if you are the last person on earth, with no Bookie, no prize, and no one to score you. This game cannot reproduce that feeling. It can only show that *if* you care about scores, you should be coherent.
      *   *The Debrief Line:* "We just proved that incoherence is a losing *strategy*. We did not prove it is a *sin*. The leap from 'You will lose points' to 'You are irrational' requires a premise we didn't test today: that accuracy is the only thing that matters."
  *   **The "As-If" Problem:** In Round 3, participants didn't actually *believe* the propositions were 50/50. They reported 50/50.
      *   *The Limit:* This demonstrates that scoring rules measure **reports**, not **minds**. It validates the behaviorist view of credence (credence *is* the betting disposition) but leaves the internalist view (credence is a private mental state) untouched.
      *   *The Debrief Line:* "Did you lie in Round 3? Or did your credence actually change? If you lied, then scoring rules don't measure belief; they measure compliance. If your credence changed, then belief is dangerously malleable."

  ### 3. A Cleaner Way to Force Metric Discovery (Round 4 Alternative)
  If the live re-scoring of Round 1 doesn't produce a leaderboard swap (which is common with small N), use the **"One Mistake" Demo**.
  *   Project two hypothetical forecasters.
  *   **Forecaster A:** 9 questions @ 90% confidence (Correct). 1 question @ 90% confidence (Wrong).
  *   **Forecaster B:** 10 questions @ 70% confidence (Correct).
  *   Ask the group: "Who is better?"
  *   Calculate Brier: A usually wins (high resolution).
  *   Calculate Log: B usually wins (A gets punished heavily for the one error).
  *   *Why this is cleaner:* It isolates the variable (risk tolerance) without needing to re-calculate 14 sheets of live data.

  ---

  ## Summary Checklist for Facilitator
  1.  **Prep:** 3 slips per person. Pre-calculated "Dominance" math for Round 2. Pre-calculated "Hypothetical Forecasters" for Round 4.
  2.  **Round 3 Rule:** Use $Score = \text{Brier} - 2(p - 0.5)^2$. (Do not use standard Linear rule if you want hedging).
  3.  **Ethics:** Reveal the Round 3 trick immediately. Do not let them leave thinking they were scored on Brier.
  4.  **Debrief:** End on the limitation. "This game shows why we need rules. It does not show why we need truth."
