prompt: |-
  My friends and I run a small wiki-ish project where we tag history-adjacent claims as "mainstream history," "fringe," or "pseudohistory," and I've slowly realized we've been doing it entirely by vibes. Atlantis is easy, Fomenko's new chronology is easy, ancient aliens is easy, but then it gets awkward fast: Gavin Menzies' 1421 stuff, the Solutrean hypothesis, Velikovsky — and worse, there are things that were once considered fringe and got rehabilitated, like continental drift in science, or in history things like the Younger Dryas impact hypothesis going from crackpot-adjacent to at least a serious debate in some circles. So before we tag another article I want the actual spec. Write the desiderata: what an adequate criterion for demarcating pseudohistory from merely heterodox or revisionist history has to deliver — the cases it has to classify correctly, the distinctions it absolutely cannot collapse (bad history vs. not-history-at-all, minority interpretation vs. methodologically broken work, revisionism vs. fabrication), what it should say about unfalsifiability, phantom or recycled evidence, conspiracy-shaped reasoning, and independence of corroborating sources — with the motivating case behind each requirement.

  A couple of things I specifically want your take on. First, mark which desiderata are non-negotiable and which are basically one camp's prejudice smuggled in as a criterion — I suspect some Popper-flavored demands don't transfer cleanly, since historians can't do experiments and everything rests on sources with provenance, so maybe falsifiability isn't the right lens at all. Second, tell me whether you think some subset of the desiderata is jointly unsatisfiable, because if the list can't all be met at once, that's actually the part I most want to know — it would tell us our tagging scheme needs a fourth category or something. And third, say briefly whether the criterion should be history-specific or just borrowed from philosophy of science with tweaks, since our one friend insists demarcation in history is basically the same problem and I'm not convinced. Don't bother scoring actual named pseudohistories against the list beyond using them as test cases, we'll do that ourselves on the wiki.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A small wiki project tagging history-adjacent claims (Mainstream, Fringe, Pseudohistory).
      *   **Problem:** Current method is "by vibes." Need a rigorous specification (desiderata) for demarcating pseudohistory from heterodox/revisionist history.
      *   **Specific Requirements:**
          1.  List desiderata (criteria) with motivating cases for each.
          2.  Address specific distinctions (bad history vs. not-history, minority vs. broken, revisionism vs. fabrication).
          3.  Address specific concepts (unfalsifiability, phantom evidence, conspiracy reasoning, independent corroboration).
          4.  **Task 1:** Mark desiderata as Non-Negotiable vs. Prejudice/Problematic (specifically regarding Popper/falsifiability).
          5.  **Task 2:** Assess if the desiderata are jointly unsatisfiable (implying a need for a 4th category).
          6.  **Task 3:** Assess if the criterion should be history-specific or borrowed from philosophy of science.
      *   **Constraint:** Do not score named pseudohistories (use them only as test cases/motivation).

  2.  **Deconstruct the Core Problem (Demarcation in History):**
      *   Pseudohistory isn't just "wrong history." It's history that *mimics* the form of historical inquiry while violating its epistemic norms.
      *   Revisionist history is essential for progress (e.g., civil rights narratives, economic reinterpretations).
      *   Science demarcation (Popper, Kuhn, Lakatos) doesn't map 1:1 because history is interpretive, evidentiary, and non-experimental.
      *   Key tension: How to distinguish "radically wrong but methodologically sound" from "methodologically corrupt."

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Need:* A way to catch the "vibes" without being arbitrary.
      *   *Candidate 1: Methodological Integrity.* Does it follow standard historical methods (source criticism, provenance)?
      *   *Candidate 2: Treatment of Evidence.* Does it ignore counter-evidence? Does it invent evidence?
      *   *Candidate 3: Explanatory Scope.* Does it rely on conspiracy to explain away lack of evidence?
      *   *Candidate 4: Engagement with Scholarship.* Does it engage with peers or talk only to the public?
      *   *Candidate 5: Falsifiability (The Popper Problem).* Can it be proven wrong?

  4.  **Addressing Task 1 (Non-Negotiable vs. Prejudice):**
      *   *Falsifiability:* In history, you can't "falsify" a narrative the same way you falsify a hypothesis in physics. Evidence can be reinterpreted. Strict Popperian falsifiability is a "Prejudice/Problematic" criterion here.
      *   *Consensus:* Relying solely on "what professors say" is an appeal to authority (Prejudice). However, *engagement* with the community is a methodological requirement (Non-Negotiable).
      *   *Source Integrity:* Fabricating or misrepresenting sources is Non-Negotiable.
      *   *Conspiracy:* Using conspiracy to immunize claims is Non-Negotiable (a hallmark of pseudoscience/pseudohistory).

  5.  **Addressing Task 2 (Joint Unsatisfiability):**
      *   Is there a tension? Yes. The tension lies between "Novelty/Revisionism" and "Methodological Conservatism."
      *   If we demand too much adherence to existing frameworks, we block legitimate paradigm shifts (e.g., Younger Dryas, though still debated, or the rehabilitation of certain archaeological views).
      *   If we allow too much freedom, we let pseudohistory in.
      *   *Verdict:* They aren't strictly unsatisfiable, but they create a "gray zone" (Fringe/Proto-science equivalent). This suggests the 3-category system (Mainstream/Fringe/Pseudo) might need a "Contested/Debated" or "Methodologically Unorthodox" category to handle the transition phase (like Continental Drift was).
      *   *Refinement:* The prompt asks if the *desiderata* are unsatisfiable. Actually, the problem is usually that "Fringe" and "Pseudo" get collapsed. If the criteria are strict, legitimate fringe becomes pseudo. If loose, pseudo becomes fringe. A 4th category ("Speculative" or "Hypothetical") might solve the *classification* problem, but the *criteria* themselves need to be robust. I should argue that the tension suggests the *taxonomy* is the problem, not necessarily the criteria, but a "Fringe" category often acts as a dumping ground for "Not Mainstream yet."

  6.  **Addressing Task 3 (History-Specific vs. Philosophy of Science):**
      *   History is not Science (Naturwissenschaften vs. Geisteswissenschaften).
      *   Science seeks universal laws; History seeks particular narratives based on traces.
      *   Borrowing from philosophy of science (Popper) is dangerous (see Falsifiability).
      *   Need a Philosophy of *History* approach (Collingwood, Bloch, Marwick). Focus on *inference to the best explanation* and *source criticism*.
      *   *Verdict:* Must be history-specific.

  7.  **Fleshing out the Desiderata (Iterative refinement):**

      *   *D1: Source Integrity.* (Non-Negotiable). Motivating case: Fabricated documents (e.g., Hitler Diaries).
      *   *D2: Immunizing Strategies.* (Non-Negotiable). Motivating case: "They hid the evidence." (Velikovsky/Fomenko).
      *   *D3: Explanatory Power vs. Ad Hocery.* (Non-Negotiable). Does the theory explain more than it assumes?
      *   *D4: Engagement with Counter-Evidence.* (Non-Negotiable). Ignoring the silence of the archive.
      *   *D5: Falsifiability.* (Prejudice). History deals with probabilities, not binary falsification.
      *   *D6: Consensus/Peer Review.* (Nuanced). Not "truth by vote," but "failure to engage" is a red flag.

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the difficulty. The "Vibes" problem is real.
      *   **Section 1: The Desiderata Specification.** List the criteria, the motivation, and the classification (Non-Negotiable vs. Prejudice).
      *   **Section 2: The Falsifiability/Science Question.** Address the Popper issue directly.
      *   **Section 3: Joint Unsatisfiability & The Fourth Category.** Analyze the tension and the taxonomy.
      *   **Section 4: History-Specific vs. Science-Borrowed.** Address the friend's argument.
      *   **Conclusion:** Summary advice.

  9.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Falsifiability:* Don't just say "Popper is wrong." Say "Falsifiability in history looks like *riskiness of prediction regarding evidence*, not experimental refutation." But as a hard criterion, it's problematic. Mark as Prejudice.
      *   *Correction on Unsatisfiability:* The prompt asks if the *desiderata* are unsatisfiable. I should argue that holding *all* non-negotiables simultaneously is possible, but applying them to the "Fringe" category is where it breaks. The "Fringe" category is the unstable one. If something is methodologically sound but lacks evidence, is it Fringe or Pseudo? If it has evidence but no consensus? The tension suggests the *labels* are the issue, specifically the "Fringe" bucket. I will suggest that "Fringe" often conflates "Methodologically Sound but Under-supported" with "Methodologically Flawed but Popular."
      *   *Younger Dryas:* Use this as the example of the "transition" problem. It moved from Pseudo-adjacent to Fringe/Debated.
      *   *Continental Drift:* Good example of "Mainstream rejection of valid theory." Why was it rejected? Lack of mechanism. History analog: Lack of documentary trail.

  10. **Final Polish:** Ensure tone is analytical, philosophical, but practical for a wiki project. Ensure all constraints of the prompt are met (marking non-negotiables, addressing unsatisfiability, addressing history-specificity).

      *(Self-Correction on "Joint Unsatisfiability"):* I need to be careful. If I say they *are* unsatisfiable, that implies the project is doomed. If I say they *aren't*, I ignore the gray zones. The nuanced take: The criteria are satisfiable, but the *tripartite taxonomy* is insufficient to capture the dynamic nature of historical inquiry. The "Fringe" category is the pressure point.

      *(Refining the "Prejudice" label):* Be careful not to dismiss philosophy of science entirely, but highlight where it misfires. Falsifiability is the big one. "Consensus" is another one that can be prejudicial if treated as truth rather than sociological fact.

      *(Final check on constraints):*
      - Desiderata list? Yes.
      - Motivating cases? Yes.
      - Mark Non-Negotiable vs. Prejudice? Yes.
      - Joint unsatisfiability analysis? Yes.
      - History-specific vs. Science? Yes.
      - No scoring of named cases? Yes.

      Let's write it.cw
answer: |-
  This is a classic demarcation problem, transposed from the philosophy of science to the philosophy of history. Your intuition is correct: "vibes" are essentially a heuristic for detecting methodological corruption, but heuristics fail at the boundaries.

  Below is the specification you asked for. It breaks down the desiderata into **Non-Negotiable** (constitutive of historical inquiry) and **Prejudice/Problematic** (imported from science or authority that distorts historical judgment). Following that, I address the three specific analytical tasks regarding falsifiability, joint satisfiability, and disciplinary specificity.

  ### Part 1: The Desiderata Specification

  Here are the criteria an adequate demarcation must satisfy.

  **1. The Integrity of the Trace (Source Criticism)**
  *   **Requirement:** The claim must rely on evidence that exists independently of the claimant's assertion, with a clear provenance chain. It cannot rely on evidence that is only accessible to the claimant, or evidence that appears only after the theory is proposed to fit the theory.
  *   **Motivating Case:** *The Hitler Diaries* (forged documents) vs. *Newly discovered archival letters*.
  *   **Status:** **Non-Negotiable.** Without this, you are not doing history; you are doing fiction.
  *   **Distinction:** Separates *Fabrication* from *Bad History*.

  **2. Immunity to Counter-Evidence (Immunizing Strategies)**
  *   **Requirement:** The framework must not explain away the absence of expected evidence by positing a conspiracy, a cataclysm that destroyed *only* the contradicting records, or a universal deception by the scholarly community. Lack of evidence must be admitted as a cost to the theory, not proof of its depth.
  *   **Motivating Case:** *Fomenko's New Chronology* (claims all ancient history is a forgery by a conspiracy) vs. *Standard Periodization* (admits gaps in the record).
  *   **Status:** **Non-Negotiable.** This is the strongest marker of pseudohistory.
  *   **Distinction:** Separates *Conspiracy-shaped reasoning* from *Revisionism*.

  **3. Inference to the Best Explanation (Abductive Strength)**
  *   **Requirement:** The claim must offer a causal or narrative mechanism that is more plausible, given the background knowledge of the era, than the mainstream alternative. It cannot rely on "miracles" or anachronistic capabilities without overwhelming evidence.
  *   **Motivating Case:** *Ancient Aliens* (requires extraterrestrial intervention because "humans couldn't build that") vs. *Engineering Archaeology* (demonstrates human capability).
  *   **Status:** **Non-Negotiable.**
  *   **Distinction:** Separates *Methodologically Broken Work* from *Minority Interpretation*.

  **4. Engagement with the Disciplinary Community**
  *   **Requirement:** The claimant must submit their findings to the standard channels of peer critique (journals, conferences) and address specific criticisms raised by experts, rather than bypassing them to appeal directly to the public.
  *   **Motivating Case:** *Velikovsky* (published bestsellers, ignored astronomical critiques) vs. *Revisionist Historians* (publish monographs, engage in debates).
  *   **Status:** **Non-Negotiable.** (Note: This is sociological, but essential for quality control).
  *   **Distinction:** Separates *Pseudohistory* from *Heterodox History*.

  **5. Falsifiability / Riskiness**
  *   **Requirement:** The claim must specify what evidence *would* prove it wrong.
  *   **Motivating Case:** *Popperian Science* vs. *Historical Narrative*.
  *   **Status:** **Prejudice/Problematic.** (See analysis below).
  *   **Distinction:** Often collapses *Speculative History* into *Pseudohistory*.

  **6. Consensus Alignment**
  *   **Requirement:** The claim must align with the majority view of current experts.
  *   **Motivating Case:** *Continental Drift (1920s)* vs. *Plate Tectonics (1960s)*.
  *   **Status:** **Prejudice/Problematic.**
  *   **Distinction:** Collapses *Fringe/Proto-Theory* into *Pseudohistory*.

  ---

  ### Part 2: Analytical Tasks

  #### 1. The Falsifiability Problem (Non-Negotiable vs. Prejudice)
  You are right to be suspicious of Popper. In the desiderata list above, I marked **Falsifiability** and **Consensus Alignment** as **Prejudice/Problematic**.

  **Why Falsifiability fails in History:**
  In physics, a hypothesis predicts a future observation. In history, a hypothesis reconstructs a past event. You cannot "falsify" the past in a lab; you can only find new traces that make a reconstruction less probable.
  *   **The Trap:** If you demand strict falsifiability, you tag *all* history as pseudohistory. Historical claims are probabilistic arguments based on incomplete data.
  *   **The Fix:** Replace "Falsifiability" with **"Riskiness of Evidence."** A good historical claim says, "If we dug here and found X, I would be wrong." A pseudohistorical claim says, "If we dig and find X, it was planted; if we find Y, it confirms me; if we find nothing, the evidence was destroyed."
  *   **Verdict:** Do not use "Falsifiability" as a tag criterion. Use "Immunizing Strategies" (Desideratum #2) instead. It captures the *spirit* of falsifiability (willingness to be wrong) without demanding experimental conditions history cannot meet.

  **Why Consensus fails:**
  As your Continental Drift example notes, truth is not a vote. Mainstream history is often wrong (e.g., pre-1960s social history ignoring marginalized groups).
  *   **The Trap:** Using consensus as a criterion protects the establishment from legitimate revisionism.
  *   **The Fix:** Use **Engagement** (Desideratum #4) instead of **Agreement**. A revisionist can be 100% opposed to consensus but still be "Mainstream/Fringe" rather than "Pseudo" if they engage with the counter-arguments using shared methods.

  #### 2. Joint Unsatisfiability and the "Fourth Category"
  Are these desiderata jointly unsatisfiable? **No, but your taxonomy is.**

  The criteria themselves are consistent. You can have a claim that has Source Integrity, avoids Immunizing Strategies, has Abductive Strength, and Engages the Community, yet is still **Wrong** and **Minority**.

  The problem is your three buckets: *Mainstream, Fringe, Pseudohistory.*
  *   **Pseudohistory** is defined by methodological corruption (violates Non-Negotiables 1-4).
  *   **Mainstream** is defined by consensus + methodological soundness.
  *   **Fringe** is currently doing too much work. It is capturing both "Methodologically Sound but Low Probability" (e.g., a specific battle location with scant evidence) AND "Methodologically Corrupt but Popular" (e.g., Atlantis).

  **The Unsatisfiable Tension:**
  There is a tension between **Desideratum 3 (Abductive Strength)** and **Desideratum 6 (Consensus - if you kept it).** But since we discarded Consensus, the real tension is between **Novelty** and **Plausibility**.
  *   Legitimate historical breakthroughs often look implausible *before* the evidence is found (e.g., The discovery of Troy by Schliemann was considered fringe/fanciful).
  *   Pseudohistory *mimics* this implausibility.

  **Recommendation:**
  The criteria are satisfiable, but they reveal that **Fringe** is not a stable epistemic category. It is a waiting room.
  *   If a claim meets Non-Negotiables 1-4 but lacks evidence/consensus, it is **Speculative/Hypothetical**.
  *   If it fails Non-Negotiables 1-4, it is **Pseudohistory**.
  *   If it meets 1-4 and has consensus, it is **Mainstream**.

  You likely need a fourth tag: **"Contested"** or **"Speculative."** This solves the *Younger Dryas Impact Hypothesis* problem. It was once "Pseudo-adjacent." Now it is "Contested" (serious debate, methodological engagement, but no consensus). If you force it into "Fringe," you stigmatize legitimate debate. If you force it into "Mainstream," you ignore the lack of agreement. "Fringe" should be reserved for "Methodologically sound but highly unlikely," whereas "Pseudo" is "Methodologically broken."

  #### 3. History-Specific vs. Philosophy of Science
  Your friend is wrong. **The criterion must be history-specific.**

  Borrowing from the philosophy of science (Popper, Kuhn, Lakatos) without heavy modification leads to category errors.
  *   **Science** seeks *nomothetic* knowledge (universal laws).
  *   **History** seeks *idiographic* knowledge (particular events).

  **Why Science Demarcation Fails Here:**
  1.  **Prediction vs. Retrodiction:** Science predicts the future; history retrodicts the past. Pseudoscience makes false predictions; Pseudohistory makes unfalsifiable *narratives*.
  2.  **Evidence vs. Data:** In science, data is generated. In history, evidence is discovered (and is always fragmentary). A "lack of data" in science might mean the theory is wrong; in history, it might mean the document rotted.
  3.  **Mechanism:** In science, a mechanism must be physically possible. In history, a mechanism must be *humanly* possible (psychology, sociology, logistics).

  **The Correct Lens:**
  Use the **Philosophy of History** (e.g., Marc Bloch, *The Historian's Craft*; or W.H. Walsh, *Philosophy of History*).
  *   Focus on **Source Criticism** (External and Internal).
  *   Focus on **Coherence** (Does this fit the web of known facts?).
  *   Focus on **Agency** (Does this attribute human capabilities to humans, or require magic/aliens/conspiracies?).

  ### Summary Advice for the Wiki

  1.  **Drop "Falsifiability"** as a explicit criterion. It confuses your editors. Replace it with **"Immunizing Strategies"** (Does the theory explain away lack of evidence via conspiracy?).
  2.  **Drop "Consensus"** as a hard boundary. Use it only as a descriptor of the current state, not a validator of truth.
  3.  **Adopt a "Methodology First" approach.**
      *   **Pseudohistory:** Fails Source Integrity OR uses Immunizing Strategies. (Hard boundary).
      *   **Mainstream:** Passes Methodology + High Consensus.
      *   **Fringe/Speculative:** Passes Methodology + Low Consensus/Low Evidence.
  4.  **Consider a "Contested" Tag.** For things like the Younger Dryas or Solutrean hypothesis, where the *methodology* is being debated rather than the *integrity* of the authors. This prevents you from having to decide if a live academic debate is "fringe" or "mainstream" before the dust settles.

  If you stick to **Methodological Integrity** (Non-Negotiables 1-4) rather than **Truth Claims**, you will avoid the trap of tagging legitimate revisionism as pseudohistory just because it turned out to be wrong. Pseudohistory isn't "wrong history"; it's "fake history." Make sure your spec targets the fakeness, not the error.
