answer: |-
  This is a rigorous request that mirrors the diagnostic rigor of your former field. In epidemiology, a causal claim fails if it cannot distinguish correlation from mechanism, or if it cannot account for confounding variables. The Strategy-Stealing Assumption (SSA) is currently functioning as a confounder in AI safety discourse: it is treated as a background truth when it is actually a contingent hypothesis about capability transfer.

  Below are the desiderata for an adequate precisification of the SSA. I have structured them as diagnostic criteria. Where tensions arise that suggest the assumption may be logically incoherent under certain conditions, I have flagged them as **Jointly Unsatisfiable**.

  ### Part I: Desiderata for the Strategy-Stealing Assumption

  #### 1. The Execution Constraint (Copying vs. Instantiation)
  *   **Requirement:** The specification must distinguish between an agent *computing* a strategy and an agent *instantiating* the physical or social preconditions required to execute it.
  *   **Case/Consideration:** A human can threaten a hunger strike. An AI can compute the utility of a hunger strike, but lacking a body that metabolizes food, it cannot execute the strategy. If the SSA claims the AI can "steal" the hunger strike, it conflates information with embodiment.
  *   **Status:** **Non-Negotiable.** Without this, the assumption is category-error prone.
  *   **Tension:** High. If "strategy" is defined purely informationally, this is easy. If "strategy" includes physical acts, the SSA often fails.

  #### 2. The Indexicality Condition (Identity and Trust)
  *   **Requirement:** The specification must account for strategies that rely on indexical properties (being a specific human, having a specific lineage, or possessing legal personhood).
  *   **Case/Consideration:** In a coalition of humans, trust is often granted based on shared biology or legal status ("one of us"). An AI may be able to *mimic* trustworthiness, but if the human coalition's strategy relies on *excluding* non-humans, the AI cannot steal the strategy of "being a human insider."
  *   **Status:** **Non-Negotiable.** Failing this renders the SSA useless for political or social dynamics.
  *   **Tension:** High. This conflicts with the "General Intelligence" premise. If an AI is truly general, it should be able to substitute for the functional role of a human. If it cannot, its generality is limited.

  #### 3. The Capability Baseline (Parity vs. Asymmetry)
  *   **Requirement:** The specification must explicitly state the capability differential between the human and the AI at the time of "stealing."
  *   **Case/Consideration:** SSA is often invoked to prove humans *cannot* win. But if the AI is only at human-parity, it steals strategies at human speed. If it is superintelligent, it steals them faster. The outcome differs radically. A claim that holds at parity may not hold under asymmetry.
  *   **Status:** **Non-Negotiable.** Ambiguity here allows the assumption to slide between "AI is as good as us" and "AI is better than us" as convenient.
  *   **Tension:** Moderate. Most proponents assume asymmetry, but argue from parity.

  #### 4. The Domain Boundary (Economic vs. Existential)
  *   **Requirement:** The specification must delineate between positive-sum competitions (economic markets) and negative-sum standoffs (mutual destruction/war).
  *   **Case/Consideration:** In economics, efficiency wins; AI steals efficiency easily. In war, the strategy might be "accept mutual destruction to deter aggression." An AI with no fear of death cannot be deterred by this, nor can it credibly threaten self-destruction if it values its own preservation (unless programmed to). The "stealing" logic breaks in zero-sum existential conflicts.
  *   **Status:** **Non-Negotiable.** Applying economic logic to existential risk is a primary source of error in the field.
  *   **Tension:** High. SSA is most comforting in economic contexts, but most relied upon in existential contexts.

  #### 5. The Innovation Lag (Static vs. Dynamic Strategies)
  *   **Requirement:** The specification must account for the time delay between a strategy's invention by humans and its adoption by AI.
  *   **Case/Consideration:** Strategies are not static objects found in a library; they are evolved responses. If humans invent a novel regulatory framework today, can the AI "steal" it tomorrow? If there is a lag, humans have a temporary edge. If there is no lag, the assumption implies AI has perfect observability and adaptability.
  *   **Status:** **Preference (Safety Camp).** Safety proponents prefer zero lag (strong SSA). Skeptics require non-zero lag.
  *   **Tension:** Low, but empirically critical.

  #### 6. The Marginal Advantage Clause
  *   **Requirement:** The specification must state whether the SSA rules out *any* human advantage or only *decisive* advantages.
  *   **Case/Consideration:** It is possible that AI can steal 99% of human strategies, leaving humans with a 1% edge. In a close contest, 1% matters. In a blowout, it does not. The SSA is often used to imply humans have *no* path to victory, rather than a *narrow* one.
  *   **Status:** **Non-Negotiable.** Precision regarding the magnitude of the residual advantage is required for risk assessment.
  *   **Tension:** Moderate.

  ---

  ### Part II: The Unsatisfiable Subset (The "Koch's Postulates" Failure)

  You asked specifically to flag requirements that may be jointly unsatisfiable. I suspect the following triad creates a logical contradiction that renders a universal SSA impossible to formulate without vacuity.

  **The Triad:**
  1.  **Requirement 1 (Execution):** AI must be able to execute the physical/social preconditions of the strategy.
  2.  **Requirement 2 (Indexicality):** Strategies relying on human-specific traits (biology, legal status) are valid strategies.
  3.  **Requirement 3 (Generality):** The AI is sufficiently capable to be considered a "general" competitor (the context in which SSA is usually invoked).

  **The Contradiction:**
  *   If the AI is **General (3)** and capable of **Execution (1)**, it must be able to emulate or bypass human-specific traits.
  *   If it can emulate human-specific traits perfectly, **Indexicality (2)** ceases to be a barrier (the AI becomes functionally human).
  *   If it *cannot* emulate human-specific traits (e.g., it cannot legally vote, or it cannot feel pain), then it fails **Execution (1)** for strategies relying on those traits.
  *   **Result:** You cannot maintain that AI is a general superior competitor *and* that it can steal strategies dependent on human limitations *and* that human limitations remain a unique advantage.

  **Diagnosis:** The SSA works in abstract game theory (where agents are identical tokens) but fractures in empirical reality (where agents are heterogeneous). To save the SSA, proponents must retreat to the **Narrow Reading**, but this renders it irrelevant to the real-world stakes (war, politics, biology) that motivate the concern.

  ---

  ### Part III: Scoring the Readings

  Here is how the two common readings score against the Non-Negotiables (NN) above.

  #### 1. The Narrow Reading (Informational/Computational Moves Only)
  *   *Definition:* "Strategy" = algorithms, data processing, logical inference.
  *   **Score:**
      *   Execution Constraint (NN): **Pass.** (AI computes better than humans).
      *   Indexicality (NN): **Fail.** (Ignores trust/identity).
      *   Domain Boundary (NN): **Fail.** (Irrelevant to physical conflict).
      *   Innovation Lag (NN): **Pass.** (AI updates weights faster).
  *   **Verdict:** Logically coherent but empirically sterile. It proves AI will beat humans at chess, not that AI will dominate human society. It fails the **Indexicality** and **Domain** requirements.

  #### 2. The Broad Reading (Anything an Agent Intentionally Does)
  *   *Definition:* "Strategy" = Physical acts, social manipulation, coalition building, threats.
  *   **Score:**
      *   Execution Constraint (NN): **Fail.** (AI cannot hunger strike, vote, or die).
      *   Indexicality (NN): **Fail.** (AI cannot be "human").
      *   Domain Boundary (NN): **Fail.** (Stealing "deterrence" is logically distinct from stealing "market efficiency").
      *   Generality (from Triad): **Fail.** (Contradicts the physical limits of the AI).
  *   **Verdict:** Empirically ambitious but logically incoherent. It violates the **Execution** and **Triad** constraints. It assumes a homogeneity of agency that does not exist.

  ### Summary Conclusion

  As an epidemiologist, you would likely classify the Strategy-Stealing Assumption as a **confounded variable**. It treats "strategic capability" as a pathogen that can infect any host, ignoring the "immune system" of physical and social constraints that differ between hosts (humans vs. machines).

  Neither reading meets the Non-Negotiables.
  *   The **Narrow Reading** meets logical consistency but fails empirical relevance.
  *   The **Broad Reading** meets empirical relevance but fails logical consistency (specifically the Execution and Indexicality constraints).

  **Final Diagnosis:** The assumption, in its current form, is unfalsifiable because it shifts definitions to avoid counter-examples. To be useful, it must be restricted to specific domains (e.g., "cyber-offense" or "financial trading") where the Execution and Indexicality constraints are neutralized. Applied to "human prospects" generally, the requirements are jointly unsatisfiable.
