prompt: |-
  I spent thirty-five years as an epidemiologist before retiring, and one habit from the bench I cannot shake is asking what a claim has to deliver before it counts as established. In my old field we had Koch's postulates: explicit criteria for when a microbe could be said to cause a disease. I have lately been reading discussions of artificial intelligence and human prospects, and they keep leaning on something people call the strategy-stealing assumption: roughly, that any strategy humans could use to secure an advantage over sufficiently capable AI systems is a strategy those systems could use just as well, so that if humans are to retain an edge, it must come from strategies that are in some way unavailable to machines. The assumption is doing a lot of quiet argumentative work, yet I have not found anyone state what a careful version of it would have to get right. So, before I read further, I want the specification settled. Write the desiderata: what any adequate precisification of the assumption must deliver. I would expect the list to cover, at minimum, which cases it must classify correctly (mutual-destruction standoffs versus ordinary economic competition; strategies that depend on embodiment, on being recognized and trusted as human, or on building coalitions among humans); which distinctions it must respect (between copying a strategy and having the means to execute it; between there being no human-favoring strategy and the best such strategy being only marginally better; between what holds at parity of capability and what holds under large asymmetries); and which empirical facts about how strategies actually spread and are countered it cannot contradict. For each requirement, give the case or consideration behind it, mark it non-negotiable or a preference of one camp, and flag any subset of the requirements you suspect is jointly unsatisfiable -- that possibility is what I most want to see, since a spec that cannot be met is itself a result. Then, and only briefly, score two readings I have encountered against your list: the narrow reading on which "strategy" covers only informational and computational moves, and the broad reading on which it covers anything an agent intentionally does to gain advantage. I am less interested in the scorecard than in whether either reading can meet the non-negotiables.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired epidemiologist (35 years experience). Values rigor, explicit criteria (like Koch's postulates), skepticism of undefined assumptions, interested in the logical structure of arguments.
      *   **Topic:** The "Strategy-Stealing Assumption" (SSA) in the context of AI safety and human-AI competition.
      *   **Task:** Write the *desiderata* (requirements/criteria) for an adequate precisification of the SSA.
      *   **Specific Requirements for the Output:**
          *   Cover specific cases (mutual destruction vs. economic competition, embodiment, trust, coalitions).
          *   Respect specific distinctions (copying vs. executing, no strategy vs. marginal strategy, parity vs. asymmetry).
          *   Not contradict empirical facts about strategy spread/countering.
          *   For each requirement: Give the case/consideration, mark as Non-Negotiable (NN) or Preference (P), flag potential joint unsatisfiability.
          *   Finally: Briefly score two readings (Narrow vs. Broad) against the list.
      *   **Goal:** The user wants to see if the assumption is coherent or if the requirements are jointly unsatisfiable (a "negative result" is valued).

  2.  **Deconstruct the Strategy-Stealing Assumption (SSA):**
      *   *Core Idea:* If a strategy works for humans to control/beat AI, AI could use it too (or better). Therefore, humans can only win if they have something AI *can't* do.
      *   *Context:* AI Safety/Alignment (Bostrom, Yudkowsky, Christiano, etc.).
      *   *Problem:* It's often used informally. "Stealing" is metaphorical. What counts as a strategy? What counts as "using" it?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Scope of "Strategy".*
          *   Consideration: Is it just code/logic, or does it include physical acts?
          *   Constraint: Must distinguish between *knowing* the strategy and *executing* it.
          *   Classification: NN.

      *   *Requirement 2: Capability Parity vs. Asymmetry.*
          *   Consideration: SSA usually assumes the AI is *at least* as capable. If AI is superintelligent, "stealing" is trivial. If AI is limited, stealing might fail.
          *   Constraint: Must specify the capability baseline.
          *   Classification: NN.

      *   *Requirement 3: Embodiment and Identity.*
          *   Consideration: Humans have bodies, legal rights, social trust. AI might not. Can AI "steal" the strategy of "being a human citizen"?
          *   Constraint: Must handle indexical properties (being *this* specific human).
          *   Classification: NN.

      *   *Requirement 4: Zero-Sum vs. Positive-Sum.*
          *   Consideration: Mutual destruction (war) vs. Economic competition. In war, destroying the opponent is a strategy. Can AI steal "threaten nuclear war"? Maybe, but humans have the buttons.
          *   Constraint: Must distinguish competitive contexts.
          *   Classification: NN.

      *   *Requirement 5: Marginal vs. Absolute Advantage.*
          *   Consideration: SSA implies AI matches humans. But what if humans have a tiny edge? Does SSA rule out *any* edge or just *significant* edges?
          *   Constraint: Must address the magnitude of the advantage.
          *   Classification: Preference (Safety camp wants strong SSA, Skeptics want weak). Let's make it NN for coherence.

      *   *Requirement 6: Empirical Plausibility (Diffusion).*
          *   Consideration: Strategies aren't static. They evolve. If humans invent a new strategy, can AI copy it instantly?
          *   Constraint: Cannot contradict how innovation actually spreads.
          *   Classification: NN.

      *   *Identifying Tensions/Unsatisfiability:*
          *   *Tension 1:* Embodiment vs. General Intelligence. If AI is general, why can't it emulate embodiment? If it can't, is it truly general?
          *   *Tension 2:* "Stealing" vs. "Execution." If the strategy relies on human biology (e.g., hunger, pain, kin selection), an AI literally *cannot* use it. But is that a "strategy" or a "constraint"?
          *   *Tension 3:* Parity vs. Asymmetry. If we assume parity for the sake of the argument, but reality is asymmetric, the assumption fails empirically.

  4.  **Refining the Desiderata (incorporating the Epidemiologist Persona):**
      *   Use language like "specificity," "sensitivity," "falsifiability," "confounding variables."
      *   Structure it like a protocol or a set of postulates.
      *   Highlight the "Koch's Postulates" parallel.

  5.  **Developing the Scoring Section:**
      *   *Narrow Reading (Info/Compute only):* Fails on embodiment/trust. Good for logic puzzles, bad for real world.
      *   *Broad Reading (Intentional acts):* Fails on "copying vs. executing." If I punch you, AI can't "steal" that if it has no fist.
      *   *Conclusion:* Both likely fail the Non-Negotiables regarding embodiment and execution.

  6.  **Review against Constraints:**
      *   Did I cover mutual destruction vs. economic? Yes.
      *   Embodiment/Trust/Coalitions? Yes.
      *   Copying vs. Executing? Yes.
      *   Parity vs. Asymmetry? Yes.
      *   Empirical facts? Yes.
      *   Mark NN vs. Preference? Yes.
      *   Flag unsatisfiable subsets? Yes (Crucial step).
      *   Score the two readings? Yes.

  7.  **Final Polish:**
      *   Tone: Respectful, rigorous, analytical. Acknowledge the user's background.
      *   Formatting: Clear headings, bullet points for readability.
      *   Self-Correction during drafting: I need to make sure I don't just explain SSA, but define the *criteria for a good definition* of SSA. The user wants the *desiderata for the assumption itself*, not an evaluation of AI.
      *   *Correction:* Ensure the "Unsatisfiable Subset" is prominent. The user specifically said "that possibility is what I most want to see."

  8.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
      *   *Intro:* Acknowledge the Koch's Postulates analogy.
      *   *Section 1: The Desiderata.* (Categorized for clarity).
      *   *Section 2: The Tension/Unsatisfiability Analysis.*
      *   *Section 3: Scoring the Readings.*
      *   *Conclusion:* Brief wrap-up.

  *(Self-Correction on "Non-Negotiable"):* In science, nothing is truly non-negotiable, but for the sake of the user's request (establishing criteria for a *valid* claim), I will treat logical coherence and empirical consistency as NN.

  *(Refining the "Unsatisfiable" point):* The biggest tension is between "AI is capable enough to steal any cognitive strategy" and "AI is restricted enough that it can't access human-specific leverage (biology/law)." If AI is super-capable, it should bypass restrictions. If it's restricted, it can't steal everything. This is the core contradiction.

