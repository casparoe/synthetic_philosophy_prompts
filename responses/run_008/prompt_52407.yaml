prompt: |-
  I run a weekend discussion group for strong high-school students who have some programming experience but no cognitive science. Next session is on Bongard problems — the invented grids of simple line drawings where six boxes on the left share some property that the six on the right lack, and the task is to name the property. Plan the session for me rather than explaining the puzzles yourself. In particular: what has to be established first so students don't mistake the task for ordinary visual puzzle-solving, and what role the students' own solving attempts should play in the arc; which single problem should carry the whole session — I want to design one where the most obvious rule is wrong, so that the point about there being multiple levels of description competing to explain the same data can emerge from their own frustration; the misconceptions I should expect (I anticipate something like "a good AI just needs better image recognition," and also "any correct-sounding rule is as good as any other"), where each will surface in the sequence, and how to head them off without simply telling students they're wrong; how to get across why a handful of positive and negative examples suffices for humans while the same problem swamps statistical learners, and how far I can go with analogy and conceptual slippage without teaching Hofstadter's actual Copycat architecture; and a closing check that would show whether they've absorbed the real lesson — that the ability to induce a concept from sparse examples is the phenomenon to be explained, not a given. Please also tell me what I should openly decline to cover at this level, and how to say so in a way that doesn't feel like a dodge.
