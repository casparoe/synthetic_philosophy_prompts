      *   Check the ranking of severity. The 3 vs 4 contradiction is the most damaging philosophically. The 6 vs 7 is the most damaging practically/semantically.
      *   Make sure to answer the specific prompt requirements (brainstorm first, then rank, then say what has to give).

  8.  **Final Review against constraints:**
