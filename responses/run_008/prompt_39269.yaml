      *   *On Tension B (6 vs 7):* I need to clarify the distinction between *Cause Ranking* (objective) and *Career Ranking* (subjective). View 7 claims the *framework* yields the same ranking. View 6 admits the *outcome* changes. The fix is semantic precision.
      *   *On View 5:* I should note that in development econ, "neglectedness" of health is controversial. Billions are spent. The EA argument is about *marginal* dollars. I should flag this as a potential external critique from their department, even if internally consistent.

  7.  **Final Polish:**
