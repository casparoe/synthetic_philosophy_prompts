answer: |-
  Dear friend,

  It sounds like a fantastic night, the kind where the drinks loosen the tongue and the metaphysics gets serious, and I am happy to weigh in on the bout between Marcus and Priya. You have asked me to walk through their four moves, rate them, decide who comes out ahead, and point out what they might have missed, so let us unravel the tapestry of their argument step by step.

  Starting with the first move, Marcus lays out the universalist position clearly and correctly, asserting that composition is unrestricted, meaning any plurality of objects constitutes a further object. This is a coherent and logically tidy view, often called mereological universalism, and he is right that it avoids the need for a special criterion of composition. Priya counters with the common-sense restrictivist view, claiming that parts need some form of unity, like contact or functional integration, to compose a whole. While Priya is right that this matches our everyday intuitions about what counts as an object, she is on weaker ground theoretically because she immediately invites the challenge of defining that unity without arbitrariness. So for move one, Marcus wins on theoretical simplicity while Priya wins on intuitive plausibility, making it a draw that sets the stage for the real fight.

  In the second move, Marcus presses the advantage by asking for the specific relation that governs composition, offering counterexamples to the natural candidates like contact or function. His examples of strangers brushing sleeves or a patient merged with an IV drip are effective because they show that any precise line drawn by Priya seems to include absurdities or exclude obvious objects. Priya responds by conceding that the boundary might be vague, suggesting that existence itself can be indeterminate in borderline cases. This is a standard defensive maneuver for the restrictivist, but it is risky. Marcus is right to press hard here because specifying a non-arbitrary restriction is the hardest part of restrictivism, but Priya is not wrong to suspect that our concepts of objects are indeed fuzzy. I would rate this move as a slight advantage to Marcus because he successfully exposes the difficulty of Priya's position, though her retreat to vagueness is a legitimate philosophical option rather than a surrender.

  The third move is the crux of the entire debate, where Marcus deploys what is known in the literature as the argument from vagueness, famously associated with David Lewis and Ted Sider. He claims that existence cannot be vague, meaning there cannot be a case where it is indeterminate whether an object exists, and therefore composition cannot be restricted since restrictions would create such vague boundaries. Priya does not have a direct answer to this in your summary, and honestly, this is the strongest argument in contemporary metaphysics for universalism. If one accepts classical logic and the principle that existence is not a vague matter, Marcus is logically correct here. Priya's earlier suggestion that existence could be vague is a view some metaphysicians hold, called ontic vagueness, but it is controversial and requires rejecting standard logical assumptions. On this move, Marcus is significantly more right according to the dominant analytic framework, as he identifies a genuine logical tension in Priya's view that she has not resolved.

  In the fourth and final move, Priya shifts ground to appeal to ontological parsimony, arguing that universalism clutters the universe with junk objects like bike-pigeon hybrids that nobody cares about or refers to. This is an appeal to theoretical virtue rather than truth, suggesting that an ontology with fewer objects is preferable. Marcus shrugs this off by distinguishing between what exists and what we care about, noting that positing objects is not the same as valuing them. He is technically right that parsimony is a pragmatic guide and not a truth-maker; the universe does not care if our ontology is cluttered. However, Priya is right to feel that an ontology that proliferates objects beyond all recognition loses touch with the phenomenon it was meant to explain. While Marcus wins the logical point that clutter is not falsity, Priya wins the rhetorical point that an ontology should illuminate reality rather than obscure it under an avalanche of entities. Overall, this move is a draw, with Marcus holding the logical high ground and Priya holding the phenomenological high ground.

  So who comes out more right overall? If we are judging by strict logical consistency and adherence to standard classical logic, Marcus wins the debate. His argument from vagueness is widely considered the most formidable challenge to restrictivism, and Priya lacks a decisive counter to the claim that existence cannot be vague. However, if we are judging by which view makes better sense of human experience and scientific practice, Priya is more right, as universalism requires us to accept a reality vastly stranger than the one we navigate daily. In the context of a metaphysics reading group, Marcus likely scored more points because he controlled the logical constraints of the discussion, but Priya correctly identified the high cost of his victory.

  Now, for the part you most want, there are indeed significant options and considerations that neither of them gestured at, and acknowledging them might dissolve the tension between their views. The most glaring omission is mereological nihilism, the view that composition never happens and only simple, partless objects exist. If Priya had adopted this view, she could agree with Marcus that there are no vague boundaries to existence because there are no composite objects to have boundaries; there are only simples arranged bike-wise or pigeon-wise. This bypasses the special composition question entirely and avoids both the clutter of universalism and the arbitrariness of restrictivism. Another major consideration they missed is the possibility of quantifier variance, championed by philosophers like Eli Hirsch. This view suggests that Marcus and Priya might be talking past each other because they are using the word exists with different meanings. Marcus might be using a logical quantifier that ranges over all possible sums, while Priya is using a restricted quantifier that ranges only over unified wholes. If existence is linguistically relative, then both could be right within their own linguistic frameworks, and the debate becomes verbal rather than substantive.

  Finally, they both assumed that the question presupposes a realist stance about objects, ignoring the possibility of conceptualism or anti-realism about composition. On this view, composition is not a mind-independent feature of the world but depends on our conceptual schemes or interests. This would validate Priya's intuition that unity matters without forcing her to find a mind-independent unity relation, and it would explain why Marcus's junk objects feel irrelevant because they fall outside our conceptual interests. Additionally, neither friend touched on the role of four-dimensionalism, the view that objects extend through time as well as space. Marcus's universalism fits very naturally with four-dimensionalism, where objects are spacetime worms, whereas Priya's restrictivism often relies on a three-dimensionalist view of persistence. If they clarified their commitments about time, the disagreement about composition might look very different. In sum, while Marcus won the logical skirmish, the war is far from over, and the most interesting paths forward lie in the options they did not explore, particularly nihilism and the idea that they might simply be speaking different ontological languages. I hope this helps you sleep better, or perhaps gives you new fuel for the next round.

  Best wishes
