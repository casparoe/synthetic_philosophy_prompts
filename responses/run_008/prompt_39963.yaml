prompt: |-
  A couple of friends from my metaphysics reading group got into it at a bar last week and I've been turning it over since. We'd been discussing the special composition question — i.e., when do some things add up to a further thing, the way my parts add up to me — and Marcus, who's basically a universalist, was needling Priya about it. (1) He said any objects whatsoever compose something: there exists right now a thing with his bike and a pigeon outside as it's two proper parts, scattered across town, and it's just as real as the bike is. Priya said that was just a mistake about what existing amounts to: an object isn't an object unless its parts are unified somehow — attached, or working together as a system — and bits scattered half a kilometer apart with nothing going on between them are simply not candidates for being one thing. (2) Marcus asked her to say which relation does the composing, then, and noted that every natural-looking candidate draws crazy lines: if contact counts, two strangers brushing sleeves on a packed train momentarily form a person-sized object; if functional integration counts, sand gets pretty integrated when the wind keeps rearranging it, and a patient plus the IV drip keeping him alive is presumably one organism. Priya said fine, maybe the criterion is vague like everything else — near the boundary it's just indeterminate whether there's a thing there. (3) Marcus said that can't be right: existence isn't the kind of thing that comes with fuzzy boundaries. It can be vague whether a term applies to something, he said, but not vague whether there is a something at all, so if her restrictions lead to absurdity at the clear cases and indeterminacy in between, that's evidence the restriction was a mistake and composition is unrestricted. (4) Priya's last stand was that his view has it's own absurdity: it makes the universe more populous than counting can keep track of, almost all of it junk objects nobody could ever refer to or care about, and a good ontology shouldn't posit that much trash. He shrugged that positing isn't the same as caring — she was objecting to the world being cluttered, not to any claim about it being false — and they adjourned for another round. I honestly couldn't say who had the better of it, and neither of them was bluffing.

  Could you go through the exchange move by move and rate each of the four moves, saying who's right about what, and then tell me who comes out more right overall? Also, and this is the part I most want, is there anything important that both of them are missing — some option or consideration neither of them so much as gestured at? I have some background in metaphysics but not deep, so feel free to explain as you go. Please write it as continuous prose with no headings, bullet points, bold text or tables — I want to read it like a letter.
