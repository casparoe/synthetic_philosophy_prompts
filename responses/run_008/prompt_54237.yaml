answer: |-
  (a) Ten Diagnostic Questions

  1.  **The Dirty Dishes:** You share a kitchen. Your flatmate leaves dishes in the sink. It doesn't block your use, but you find it visually stressful. They find washing up immediately tedious. There is no health risk. Should the flat have a rule forcing them to wash up, overriding their preference for convenience?
      *   A) Yes, my stress counts as much as their convenience.
      *   B) No, it's their mess to manage; my stress is my problem.

  2.  **The Office Thermostat:** You and a colleague share an office. You are cold; they are hot. Turning the heat up helps you significantly more than it hurts them (a net gain for the pair). However, they insist the thermostat is "their zone" to control. Should the heat be turned up?
      *   A) Yes, the net benefit to the pair outweighs their claim to control.
      *   B) No, their claim to control their zone is absolute, even if it hurts the pair.

  3.  **The Birthday Gift:** A group wants to buy a gift for Bob. Everyone, including Bob, agrees that Gift A is better than Gift B. However, Bob insists on choosing Gift B himself, claiming a right to choose his own gifts. Should the group buy Gift A?
      *   A) Yes, since everyone agrees A is better, even Bob (deep down).
      *   B) No, Bob's choice stands even if it seems worse for him.

  4.  **The Shift Swap:** You have a guaranteed right to pick your work shift. A swap becomes available that makes you and your coworker both happier, but it requires you to formally give up your right to pick *this specific* shift. Is the swap valid?
      *   A) Yes, rights can be set aside to make everyone better off.
      *   B) No, the right to pick is inalienable, even for a gain.

  5.  **The Noisy Neighbor:** A neighbor plays drums at noon. It is loud. Everyone on the street hates it except the drummer. The drummer claims a right to play in their own home. Should the street association ban it?
      *   A) Yes, the unanimous objection of the street overrides the home right.
      *   B) No, the home right protects them from the unanimous objection.

  6.  **The Offensive T-Shirt:** A colleague wears a T-shirt with a slogan everyone finds distasteful, though it targets no one present. They claim a right to dress as they please. Should there be a dress code banning it?
      *   A) Yes, some preferences (like wearing offensive slogans) shouldn't count.
      *   B) No, the right to dress covers even distasteful choices.

  7.  **The Secret Ballot:** A committee votes on a policy. The procedure allows a secret ballot. You vote 'Yes', but pressure makes you vote 'No'. The outcome is 'No'. Is this outcome legitimate?
      *   A) Yes, the procedure was fair, so the result stands.
      *   B) No, the true preference was 'Yes', so the result is flawed.

  8.  **The Locked Diary:** You find a roommate's locked diary. Reading it would reveal information that prevents a disaster for them (a clear gain), but it requires breaking the lock. Do you open it?
      *   A) No, the lock is a constraint that cannot be crossed, even for gain.
      *   B) Yes, the gain justifies opening it.

  9.  **The Apple:** Consider two situations: (1) You eat an apple because you wanted to. (2) You eat an apple because you were forced. Are these socially distinct outcomes?
      *   A) Yes, the choice process makes them different states of the world.
      *   B) No, the outcome is just "apple eaten" in both cases.

  10. **The Unanimous Veto:** Two people decide on a movie. Both have a right to pick. They disagree. A third person suggests a third movie everyone prefers. Can the third movie be chosen?
      *   A) Yes, if everyone prefers it, it should be chosen.
      *   B) No, the original two must exercise their rights first.

  11. **The Source of Error:** (Added to separate Cleaning vs. Domain) When we ignore the "dirty dishes" stress (Question 1), is it because that preference is *invalid* (Cleaning) or because we assume people *won't* have that preference in a valid system (Domain)?
      *   A) It is invalid; we filter it out.
      *   B) The system assumes it doesn't happen; if it does, the system breaks.

  (b) Scoring Key

  *   **Preference Cleaning:** Q1(B), Q6(A). *Logic:* Distinguishes "nosy" preferences from valid ones.
  *   **Procedural Liberalism (GPS):** Q7(A), Q4(B). *Logic:* Rights protect the game/process, not necessarily the utility outcome.
  *   **Waivable Rights (Gibbard):** Q4(A), Q3(B). *Logic:* Rights exist but can be waived for Pareto gains.
  *   **Domain Restriction:** Q1(B), Q11(B). *Logic:* The paradox arises from inadmissible preference profiles, not the rule.
  *   **Pareto Priority:** Q2(A), Q5(A). *Logic:* Unanimity/Net Gain trumps personal decisiveness.
  *   **Side Constraints / Fine Individuation:** Q8(A), Q9(A). *Logic:* Rights are trumps; states include the history of choice.

  (c) Decision Tree

  1.  **Node 1 (Conflict):** In a conflict between Unanimous Gain and Personal Control (Q2, Q3, Q5), who wins?
      *   **Branch 1.1:** Unanimous Gain wins. -> Go to Node 2.
      *   **Branch 1.2:** Personal Control wins. -> Go to Node 3.
  2.  **Node 2 (Nosy Preferences):** When Personal Control is overridden, do we count *all* objections (Q1, Q6)?
      *   **Branch 2.1:** Yes, all objections count. -> **Leaf: Pareto Priority**.
      *   **Branch 2.2:** No, filter "nosy" objections. -> Go to Node 6 (Cleaning vs Domain).
  3.  **Node 3 (Waiver):** Can Personal Control be waived for a Unanimous Gain (Q4)?
      *   **Branch 3.1:** Yes, rights are waivable. -> **Leaf: Waivable Rights (Gibbard)**.
      *   **Branch 3.2:** No, rights are inalienable. -> Go to Node 4.
  4.  **Node 4 (Procedure):** Does the legitimacy depend on the Process or the Outcome (Q7)?
      *   **Branch 4.1:** Process matters most. -> **Leaf: Procedural Liberalism (GPS)**.
      *   **Branch 4.2:** Outcome matters most. -> Go to Node 5.
  5.  **Node 5 (Individuation):** Are "Chosen X" and "Forced X" distinct states (Q8, Q9)?
      *   **Branch 5.1:** Yes, distinct states. -> **Leaf: Side Constraints / Fine Individuation**.
      *   **Branch 5.2:** No, same state. -> Go to Node 6.
  6.  **Node 6 (Cleaning vs Domain):** Why are nosy preferences excluded (Q11)?
      *   **Branch 6.1:** They are invalid inputs. -> **Leaf: Preference Cleaning**.
      *   **Branch 6.2:** They are inadmissible profiles. -> **Leaf: Domain Restriction**.

  **Notes on Empty Cells:**
  *   **Cell: Process Matters + Waivable Rights.** This cell is largely empty. If rights are waivable for outcomes, the procedure becomes secondary to the Pareto check. It is unattractive because it renders the procedural protection moot; if you can waive the right for gain, the game form doesn't constrain the outcome.
  *   **Cell: Side Constraints + Pareto Priority.** This is incoherent. Side constraints (trumps) by definition cannot be overridden by aggregate gain (Pareto).

  **Notes on Indistinguishable Leaves:**
  *   **Flagged Pair:** **Preference Cleaning** and **Domain Restriction**. In practice, both result in ignoring "nosy" preferences to save Liberalism. The quiz questions Q1 and Q6 yield the same outcome for both.
  *   **Resolution:** Question 11 was added to distinguish them based on *why* the preference is ignored (invalidity vs. inadmissibility). Without Q11, these leaves are indistinguishable in a quiz format.

  **Leaf Descriptions & Awkward Commitments:**
  1.  **Preference Cleaning:** We scrutinize preferences to exclude "meddlesome" ones. *Awkward Commitment:* Requires an arbiter to decide which preferences are "proper," violating neutrality.
  2.  **Procedural Liberalism (Gaertner, Pattanaik, Suzumura):** Rights define the game form, not the social outcome. *Awkward Commitment:* May protect empty rights if the game leads to inefficient outcomes everyone hates.
  3.  **Waivable Rights (Gibbard):** Rights are alienable to ensure Pareto efficiency. *Awkward Commitment:* Rights disappear exactly when they are most needed to protect the individual against the group. (Note: Gibbard is correctly attributed for waivability; strict conditionality on others' rights is a nuance often shared with game-form approaches).
  4.  **Domain Restriction:** The paradox only arises in rare, "inadmissible" preference profiles. *Awkward Commitment:* Assumes the real world is kinder than the model; fails if people are actually nosy.
  5.  **Pareto Priority:** Unanimity trumps liberty in cases of conflict. *Awkward Commitment:* Liberty is only granted for non-controversial choices, making it fragile.
  6.  **Side Constraints / Fine Individuation:** Rights are trumps; states include the history of choice. *Awkward Commitment:* Makes social choice nearly impossible by making every state unique to the agent.

  \answer{Pareto Priority|Preference Cleaning|Waivable Rights (Gibbard)|Procedural Liberalism (GPS)|Domain Restriction|Side Constraints / Fine Individuation}
