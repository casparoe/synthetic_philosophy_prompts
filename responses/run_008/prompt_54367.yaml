prompt: |-
  my brother lent me a pop-sci book about perception and there's a passage thats been bugging me. it goes something like: cognitive penetration is when your beliefs and expectations literally change what you see, not just how you judge it afterwards. it's basically top-down processing — the brain feeding its priors back into vision. psychologists have shown this everywhere: scared people literally see hills as steeper, hungry people see food as closer and bigger. so perception isn't a neutral window on the world, it's theory-laden all the way down, which kills the empiricist dream of science built on neutral observation. if seeing is already contaminated by believing, then two people with different theories literally inhabit different visual worlds, and you can never trust your eyes as evidence against your beliefs, because your eyes already agree with your beliefs.

  I'm inclined to buy the first half — the steeper-hills stuff sounds plausible — but the ending ("you can never trust your eyes") smells too strong, I just can't put my finger on why. can you go through it chunk by chunk and tell me which parts a careful philosopher of perception or a vision scientist would actually sign off on, which parts they'd wince at, and which are just wrong? I'm especially curious about the move in the middle, whether "top-down processing" and "cognitive penetration" are the same thing the way the passage treats them. and at the end tell me whether the never-trust-your-eyes conclusion follows from whatever survives the audit, or whether it needs extra premises the book didn't give me. no need to cite sources or give me reading lists, just your own breakdown.
