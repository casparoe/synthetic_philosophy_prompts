  A friend of mine who's deep into true crime podcasts gave me this rundown of the philosophy of punishment, and I want to know how much of it to trust. He said: 'Retributivism is the view that punishment is backward-looking — the offender did wrong, so suffering should be inflicted on him, period. That's really just revenge with a courtroom, since both are about making the wrongdoer suffer because he made someone suffer. Consequentialism is the opposite: forward-looking, we punish to deter, incapacitate, and rehabilitate, and the severity should be whatever level best reduces crime. The problem for consequentialism is that it has to approve of punishing an innocent person whenever that produces better outcomes — so if the real criminal can't be found, framing a scapegoat is fine. Everyone rejects that, so consequentialism is refuted. And since retributivism is just revenge in a robe, the only sensible position left is a mixed one where we use whichever tool works better case by case.' Something about this feels off to me — especially the 'just revenge with a courtroom' line and how quickly consequentialism gets refuted — but I don't know the literature well enough to say where. Can you go through it and separate what a careful retributivist would accept, what a careful consequentialist would accept, what's a misrepresentation, and whether his 'mixed view' conclusion actually follows from the parts that survive? Also I suspect the revenge comparison glosses over something retributivists think matters, but I can't put my finger on it. If the way I've framed this assumes something confused, or a point-by-point audit just isn't the right format here, tell me that plainly instead of playing along. Please write in American English.
