  Your reasoning presupposes that Galileo believed the Bible intended to teach scientific facts, which is precisely the distinction he contested. In his Letter to the Grand Duchess Christina, Galileo argued that scripture speaks in accommodated language, utilising phenomenological descriptions familiar to common people rather than technical astronomical truths. Thus, when the Bible states the Sun moves, it describes appearance, not physical reality, ensuring its spiritual inerrancy remains intact despite scientific correction. Galileo maintained that God authored two books: nature, written in mathematics, and scripture, written for salvation. Since both originate from the Divine, they cannot truly contradict; apparent conflicts arise solely from human misinterpretation of either sensory evidence or biblical metaphor. Consequently, he was not concealing disbelief nor claiming the Bible was scientifically wrong in its intended purpose. Rather, he asserted that biblical inerrancy concerns faith and morals, not physics. By separating theological authority from scientific description, Galileo harmonised his Catholic faith with Copernicanism, arguing that to insist on literal astronomical readings of scripture is to risk making faith appear foolish against demonstrable proof. His defence was not cowardice, but a sophisticated hermeneutic strategy.
