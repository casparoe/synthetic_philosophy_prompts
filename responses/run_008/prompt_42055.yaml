answer: |-
  # JOINT STATEMENT ON PRACTICAL STAKES AND EPISTEMIC STATUS
  **Adversarial Collaboration Project: The Stakes & Knowledge Initiative**
  **Signatories:** Dr. Elena Vance (Pragmatic Encroachment) & Dr. Marcus Thorne (Epistemic Purism)
  **Date:** October 24, 2023

  ## 1. Areas of Agreement

  After one year of dialectical exchange and experimental design, we affirm the following common ground regarding the data, theoretical constraints, and the scope of our disagreement:

  1.  **The Shared Stock of Cases:** We agree that standard "Bank Cases" (where a subject has identical evidence but different practical costs of error) elicit divergent intuitive responses from laypersons regarding knowledge attribution. We further agree that "Lottery Propositions" (e.g., "This ticket will lose") are treated differently from ordinary empirical claims despite comparable probabilistic support.
  2.  **The Knowledge-Action Connection:** We agree that knowledge is normatively significant for action and assertion. Specifically, we both accept a weak Knowledge-Action Principle: *If a subject knows $p$, it is prima facie appropriate to act on $p$.* We disagree on the converse and the direction of explanation.
  3.  **The Role of Evidence:** We agree that truth-conducive factors (evidence, reliability, safety) are necessary for knowledge. Neither of us argues that practical stakes can generate knowledge in the absence of evidence, nor that stakes can defeat knowledge if the evidence is maximally strong (e.g., perceptual certainty).
  4.  **What the Dispute Does Not Turn On:**
      *   **Skepticism:** This is not a debate about global skepticism; we assume a non-skeptical backdrop where ordinary knowledge is possible.
      *   **Semantic Contextualism:** We are not debating whether the word "knows" shifts semantic content across conversational contexts. We are debating invariantist theories about the *nature* of the state picked out by "knows."
      *   **Rationality of Action:** We agree that practical stakes *always* affect whether it is *rational to act* on a proposition. The dispute is whether this shift in practical rationality constitutes a shift in *knowledge*.

  ## 2. Table of Residual Disagreements

  The following table outlines our remaining substantive disagreements. To ensure charitable interpretation, each point is stated in language each signatory finds acceptable as a description of their own view.

  | Topic | Formulation Acceptable to Dr. Vance (Encroacher) | Formulation Acceptable to Dr. Thorne (Purist) |
  | :--- | :--- | :--- |
  | **The Locus of Stakes** | **Knowledge is Stake-Sensitive:** The threshold of evidence required to constitute knowledge rises as the practical costs of being wrong increase. Knowledge is the epistemic position sufficient for practical reliance. | **Knowledge is Stake-Insensitive:** The threshold of evidence required for knowledge is fixed by truth-conducive factors alone. Stakes affect the *warrant to act* on knowledge, not the knowledge state itself. |
  | **The Bank Intuition** | **A Genuine Datum:** The intuition that the High-Stakes bank customer lacks knowledge (while the Low-Stakes customer has it) is a reliable insight into the nature of knowledge that a theory must accommodate. | **A Performance Error:** The intuition that the High-Stakes bank customer lacks knowledge is a confusion between *knowing* and *being warranted to act*. The subject knows in both cases but is rational to check only in the high-stakes case. |
  | **Theoretical Cost** | **Unified Normativity:** Encroachment offers a simpler normative picture where epistemic and practical rationality are aligned; one cannot know $p$ yet be irrational to act on $p$. | **Modular Architecture:** Purism preserves the distinctness of epistemic normativity; the friction between knowing $p$ and hesitating to act on $p$ is a feature, not a bug, of having distinct epistemic and practical domains. |

  ## 3. Cruxes and Novel Test Cases

  We identify the following subquestions as "cruxes." Settling these empirically or conceptualizing them definitively would compel at least one of us to revise our current position. We have constructed two novel cases to test these cruxes.

  ### Crux A: The Locus of Practical Sensitivity (The Indemnified Inspector)

  **The Case:** A quality inspector must certify a bridge component. The evidence is strong (95% reliability) but not infallible.
  *   **Firm Stakes:** If the component fails, the firm faces bankruptcy and public harm (Extremely High).
  *   **Inspector Stakes:** The inspector is fully indemnified by insurance. She loses nothing if the component fails, and gains nothing if it succeeds (Null).
  *   **Question:** Does the inspector *know* the component is safe?

  **The Test:** We will survey lay judgments on whether the inspector "knows" the component is safe, varying the Firm's stakes while holding the Inspector's indemnification constant.

  | Position | Prediction | Evidence That Would Undermine View |
  | :--- | :--- | :--- |
  | **Encroacher (Vance)** | **Prediction:** Lay judgments will track the **Firm's Stakes**. Most will say she does *not* know, because the *action* of certifying is high-stakes, regardless of her insurance. <br>*(Rationale: Knowledge is the position sufficient for the action; the action remains high-risk.)* | If lay judgments track the **Inspector's Null Stakes** (saying she *does* know), I must concede that knowledge tracks the *subject's* practical rationality specifically, not the action's objective stakes. This forces a retreat to Subject-Sensitive Invariantism and abandons the broader "Action-First" motivation. |
  | **Purist (Thorne)** | **Prediction:** Lay judgments will track **Evidence Only**. Most will say she *does* know, provided the 95% reliability is sufficient for knowledge *simpliciter*. The Firm's stakes are irrelevant to epistemic status. | If lay judgments track the **Firm's Stakes** (saying she *does not* know), I must concede that non-evidential factors systematically influence epistemic attribution in a way that cannot be explained away as confusion about action. This would require incorporating practical variables into the conditions for knowledge. |

  ### Crux B: Factivity of Stakes (The Stakes-Blind Variant)

  **The Case:** A subject must decide whether to take a route home.
  *   **Actual Stakes:** There is a hidden sniper on the route (Extremely High).
  *   **Believed Stakes:** The subject reasonably believes the route is safe and standard (Low).
  *   **Evidence:** Identical to a standard low-stakes case (e.g., usual traffic report).
  *   **Question:** Does the subject *know* the route is safe?

  **The Test:** We will present vignettes where Actual Stakes and Believed Stakes come apart, asking subjects to attribute knowledge.

  | Position | Prediction | Evidence That Would Undermine View |
  | :--- | :--- | :--- |
  | **Encroacher (Vance)** | **Prediction:** Lay judgments will track **Actual Stakes**. Subjects will say she does *not* know, because her actual practical environment makes acting on the belief irrational, regardless of her belief about the stakes. | If lay judgments track **Believed Stakes** (saying she *does* know), I must concede that knowledge is sensitive only to the *subjective* practical situation. This weakens the link between knowledge and *objective* practical rationality, which is a core motivation for encroachment. |
  | **Purist (Thorne)** | **Prediction:** Lay judgments will track **Evidence**. Since evidence is fixed and sufficient for low-stakes knowledge, she *knows*. The hidden sniper is irrelevant to her epistemic position. | If lay judgments track **Actual Stakes** (saying she *does not* know), I must concede that facts about the world outside the subject's evidence (the presence of the sniper) can defeat knowledge. This violates the supervenience of knowledge on the subject's mental/evidential state. |

  ## 4. Note on Verbal Dispute and Substantive Remainder

  We acknowledge a potential verbal dispute regarding the term "knows."
  *   **Vance** suspects "knows" may semantically encode a threshold for rational action.
  *   **Thorne** suspects "knows" refers to a purely evidential state, and lay usage conflates this with "warranted to act."

  **Joint Verdict on Verbality:** We agree that even if this is partially verbal, the dispute remains **substantive**. Whether we call the state "knowledge" or "warranted belief," the normative question remains: *Is there a single normative status that governs both inquiry and action, or are these governed by distinct norms?*
  *   If Vance is right, improving one's evidence is sometimes unnecessary if stakes drop; inquiry is governed by practical needs.
  *   If Thorne is right, inquiry has a fixed standard independent of need; practical needs only govern the deployment of belief.

  We conclude that resolving the cruxes above will determine which normative architecture best fits human cognitive practice, regardless of the semantic label applied to the node in that architecture.

  ***

  **Signed,**

  *Dr. Elena Vance*
  *Dr. Marcus Thorne*
