prompt: |-
  So I've been rereading Hardin's "Living on a Lifeboat" (the 1974 BioScience essay) and it struck me that the Titanic disaster is basically the one time the metaphor got run as an actual experiment, with real lifeboats and real people outside them. And the historical result is awkward for Hardin: the constraint that killed people wasn't the boats' capacity being swamped — many boats left half empty — it was the rationing rules (women and children first, crew hesitation, third class kept behind gates) and the fact that the "lifeboat" had already sorted who was inside before anyone tried to climb in. That last bit feels like a hole in the whole framework: Hardin's lifeboat is supposed to be given, but real lifeboats come with a boarding policy baked in.

  Anyway, here's my ask: read James Cameron's Titanic through Hardin's lifeboat ethics, and tell me whether the film vindicates or refutes him. A few things I want you to actually grapple with: (1) does the film notice that under-filled boats are a problem for the swamping argument, or does it just treat scarcity as self-evident? (2) is "women and children first" a lifeboat ethic at all — Hardin wants a rule of survival for the collective, but WCF is a chivalric norm that can get the collective killed, so is the film endorsing a non-Hardinian ethics there? (3) the class stuff — steerage passengers literally locked below — where does the film land between "this is a failure of the rich nation's lifeboat" and "this is just how Hardin's world already works, sorted before the sinking"? Please don't make Cal the stand-in for every position you dislike, he's way too easy a target, and don't reduce the movie to an illustration either — if scenes resist the lifeboat reading (the string quartet, Rose jumping back onto the "sinking boat" to be with Jack, which flatly denies the metaphor's whole logic), say so honestly.

  After the essay part, give me a compact JSON summary with exactly these fields:

  - "verdict_on_hardin": one of "vindicated", "refuted", or "mixed", plus one sentence of why
  - "binding_constraint": "capacity" | "rationing_rules" | "pre_sorting", or an array if you think several, with a one-line justification
  - "strongest_scene": the scene that best supports your reading, and why
  - "resisting_scenes": an array of scenes that cut against your reading
  - "film_adds": one sentence on what the film dramatizes that Hardin's essay alone can't convey
