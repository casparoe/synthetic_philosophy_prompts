answer: |-
  The Titanic disaster is indeed the unintended empirical test of Garrett Hardin's "Lifeboat Ethics," and James Cameron's 1997 film serves as the detailed case study. Hardin's 1974 essay argues that rich nations are lifeboats adrift in a sea of poor nations, and that survival requires strict exclusion: admitting the swimmers will swamp the boat, killing everyone. He posits capacity as the hard constraint and exclusion as the moral necessity. Cameron's *Titanic*, however, dramatizes a scenario where the physical constraint was secondary to the social one. The film does not merely illustrate Hardin's thesis; it systematically dismantles it by showing that the tragedy was not caused by the limits of the lifeboat, but by the ethics used to manage it.

  **1. The Myth of Capacity vs. The Reality of Management**
  Hardin's argument rests on the premise that the lifeboat is at capacity, or that admitting more people inevitably leads to swamping. The film directly challenges this by highlighting the under-filled boats. In the loading sequences, officers Murdoch and Lightoller hesitate to fill the boats to capacity, fearing the davits will break or the boats will swamp if too many desperate people crowd the sides. Hardin would argue this hesitation proves the necessity of strict control; however, the film shows these boats lowering with empty seats while hundreds drown.

  The film notices this discrepancy. It treats scarcity not as a self-evident physical law, but as a managed resource subject to human error and caution. When Fifth Officer Lowe eventually returns to pick up survivors, the water is calm, and the boat does not swamp. This refutes Hardin's physical determinism. The constraint was not the wood and rivets of the lifeboat; it was the risk-aversion of the crew and the bureaucratic interpretation of safety. Hardin assumes the boat *cannot* hold more; the film shows the boat *could* have held more, but the operators believed Hardin's logic too literally.

  **2. Chivalry vs. Survival Ethics**
  Hardin proposes a "survival of the fitting" ethic: preserve the collective inside the boat to ensure the continuation of the culture/group. "Women and children first" (WCF) is ostensibly a rationing rule, but it is fundamentally anti-Hardinian. Hardin's ethic is utilitarian regarding the boat's integrity; WCF is deontological regarding moral duty. By prioritizing women and children, the crew actively excluded able-bodied men who could row, navigate, or defend the boat.

  The film endorses WCF not as a survival strategy, but as a moral imperative that transcends survival. When Cal Hockley attempts to board by claiming a lost child, he is utilizing a resource (the child) to bypass the ethic, but the film frames this as cowardice, not clever survivalism. Conversely, when men like Jack Dawson or Benjamin Guggenheim accept death to adhere to the norm, the film valorizes them. Hardin would view this as a failure of the lifeboat ethic—weakening the rowing power of the boat to satisfy a chivalric norm. The film argues that a survival strategy devoid of moral sacrifice is not worth surviving. It suggests that the "collective" Hardin wants to save is meaningless if it abandons its own ethical codes to persist.

  **3. Pre-Sorting and the Class Barrier**
  This is the most damning evidence against Hardin. Hardin's metaphor assumes the lifeboat is already formed ("the rich nations are already in the boat"). He takes the status quo of who is inside as a given starting point. *Titanic* dramatizes the *construction* of that boundary. The locking of the steerage gates is not a natural capacity limit; it is an active enforcement of class hierarchy during a crisis.

  The film lands firmly on the side of critique: the pre-sorting was a failure of the "rich nation's" ethics. By keeping third-class passengers below decks until the first-class passengers had access, the ship's officers effectively reduced the total human capacity of the lifeboat system. If the sorting had been fluid, more boats could have been filled before the ship sank. The film suggests that Hardin's "given" lifeboat is actually a fortified position maintained by violence (the locked gates, the weapons drawn on steerage passengers). The film argues that this pre-sorting didn't save the rich; it just ensured the poor died first. It refutes Hardin by showing that the boundary between "in" and "out" is porous and artificial, and maintaining it costs more lives than dissolving it would have.

  **4. Scenes That Resist the Metaphor**
  To its credit, the film does not reduce itself to a sociological diagram. There are moments that flatly deny the logic of lifeboat ethics, which is fundamentally about rational calculation of survival.
  *   **Rose returning to the sinking ship:** She jumps off the lifeboat to be with Jack. This is irrational by Hardin's metrics; she trades guaranteed safety for uncertain death based on love.
  *   **The String Quartet:** They play as the ship goes down. This prioritizes art and dignity over survival, suggesting that human meaning exists outside the biological imperative to stay in the boat.
  *   **Jack freezing in the water:** He gives up his spot on the plank. Hardin's ethic demands you hold the boat; Jack's ethic demands he share it, even at the cost of his life.

  These scenes resist the lifeboat reading because they assert that some values (love, art, solidarity) are higher than the survival of the individual or the collective unit. Hardin's essay is purely biological and economic; the film is humanist.

  **Conclusion**
  *Titanic* refutes Hardin not by denying scarcity—there were not enough boats—but by demonstrating that the allocation of scarcity was governed by flawed social rules rather than physical necessity. The film argues that Hardin's "lifeboat ethics" are a self-fulfilling prophecy: if you act as though the boat will swamp, you leave seats empty and people die. If you act as though exclusion is necessary, you lock gates and people die. The film vindicates an ethic of shared risk over an ethic of fortified survival.

