answer: |-
  # Specification of Desiderata for a Theory of Self-Deception

  ## 1. Introduction: The Need for Specification
  The literature on self-deception suffers from a category error: proponents defend solutions before agreeing on the problem. Some treat self-deception as a puzzle of doxastic logic (how can one believe *p* and *not-p*?), while others treat it as a puzzle of social psychology (how do we manage impressions?). To move past this, we must first establish the *explanandum*. An adequate theory cannot merely be metaphysically parsimonious; it must save the phenomena. The following desiderata specify what a theory must capture to count as a theory of *self-deception* rather than mere error, bias, or lying.

  ## 2. Core Desiderata
  Any adequate theory must satisfy the following five conditions. Each is motivated by a specific phenomenological case.

  ### D1: The Doxastic Commitment Condition
  **Requirement:** The subject must genuinely hold the false belief (*p*), not merely assert it.
  **Motivating Case:** *The Man Over His Ex.* He tells friends he is fine. If he is merely lying to save face, he is not self-deceived; he is deceptive. For it to be self-deception, he must, at some level, *believe* he is over her. A theory that reduces self-deception to conscious pretense fails here.
  **Constraint:** The theory must explain how a belief is formed/maintained without standard evidentiary support.

  ### D2: The Motivational Causation Condition
  **Requirement:** The etiology of the belief must be driven by a desire or need, not merely by cognitive error or lack of evidence.
  **Motivating Case:** *The Medical Results.* The person does not open the envelope. This is not random forgetfulness; it is strategic avoidance driven by the desire to avoid bad news. A theory of self-deception must distinguish between *being mistaken* (bad luck/cognitive limitation) and *making oneself mistaken* (motivated processing).
  **Constraint:** The motivation must be the primary causal driver, not just a background condition.

  ### D3: The Doxastic Tension Condition
  **Requirement:** The subject must exhibit behavioral or psychological traces of the unwelcome truth (*not-p*), even while avowing *p*.
  **Motivating Case:** *The Trader.* She avows "The market will recover" (*p*), yet she checks the price compulsively and experiences anxiety. If she truly believed *p* calmly, she would not check. The anxiety and checking behavior are traces of *not-p* (the fear of loss).
  **Constraint:** The theory cannot collapse the distinction between self-deception and simple delusion. Delusion lacks tension; self-deception thrives on it.

  ### D4: The Agency and Responsibility Condition
  **Requirement:** The subject must be in some sense responsible for the state, rather than being a passive victim of a cognitive glitch.
  **Motivating Case:** *All Cases.* We blame the Trader for her losses and the Medical Avoider for their late diagnosis. We hold them responsible in a way we do not hold a victim of optical illusions responsible. Self-deception implies a failure of rational governance that is attributable to the agent.
  **Constraint:** The theory must locate the "self" in self-deception. If the process is entirely subpersonal or mechanical, responsibility vanishes.

  ### D5: The Unified Architecture Constraint
  **Requirement:** The theory must not posit two distinct, fully-formed agents (homunculi) within the mind.
  **Motivating Case:** *General Metaphysics.* If we explain self-deception by saying "Part of me knows the truth and hides it from the part that believes the lie," we have solved the logical paradox at the cost of positing a "deceiver" and a "deceivee" as separate entities. This makes the unity of consciousness mysterious and dissolves the *self* in self-deception.
  **Constraint:** The mechanism must be compatible with a single, unified cognitive agent, even if that agent is complex.

  ---

  ## 3. Boundary Distinctions
  To satisfy the desiderata above, a theory must successfully demarcate self-deception from five neighboring phenomena. Failure to distinguish these indicates the theory is too broad (deflationary) or too narrow (intentionalist).

  1.  **Vs. Ordinary Wishful Thinking:** Wishful thinking is believing *p* because one wants *p*, often without conflicting evidence. Self-deception requires **D3 (Tension)**. The Trader is not just wishing; she is actively managing anxiety about evidence she claims to discount.
  2.  **Vs. Sour Grapes (Adaptive Preference):** In sour grapes, the agent changes their *desire* ("I didn't want that job anyway") to match reality. In self-deception, the agent changes their *belief* to match desire. The Medical Avoider still wants health; they just manipulate the belief about their status.
  3.  **Vs. Rational Updating from Selective Evidence:** Agents naturally seek confirming evidence (confirmation bias). Self-deception crosses into irrationality when the selectivity is **D2 (Motivationally Driven)** to a degree that violates the agent's own epistemic norms. The Trader isn't just analyzing; she is *fleeing* the implication of the data.
  4.  **Vs. Akrasia (Weakness of Will):** Akrasia is acting against one's better judgment (believing *not-p*, but doing *p*). Self-deception is judging *p* while behaving as if *not-p*. The Man Over His Ex is not acting against his judgment; his judgment itself is corrupted.
  5.  **Vs. Ignorance of Motives:** One can be unaware that one is biased. Self-deception is stronger: it is the production of a specific false belief. Ignorance of motives explains *why* the bias exists; self-deception is the *result* of that bias crystallizing into a belief state.

  ---

  ## 4. Tensions and The Killer Constraint

  ### The Fundamental Tension
  There is a strong suspicion that **D3 (Doxastic Tension)** and **D5 (Unified Architecture)** cannot be jointly satisfied without theoretical residue.
  *   To satisfy **D3**, the mind must register the truth (*not-p*) sufficiently to generate anxiety/avoidance (The Trader checking prices).
  *   To satisfy **D1 (Doxastic Commitment)**, the mind must settle on the falsehood (*p*) as the operative belief.
  *   To satisfy **D5 (Unified Architecture)**, these two states must exist in one mind without a partition.

  If the mind is unified, why doesn't the evidence for *not-p* (which causes the anxiety) update the belief *p*? If it does update it, you lose **D1**. If it doesn't, you need a barrier (partition), violating **D5**.

  ### The Killer Constraint: The Doxastic Tension Condition (D3)
  Of all the requirements, **D3** does the most work to eliminate otherwise attractive theories.
  *   **Why it is attractive to drop:** It is much easier to explain self-deception if we assume the agent simply believes the comfortable lie (*p*) and has no access to the truth. This makes the mind consistent.
  *   **Why it must be kept:** Without D3, self-deception becomes indistinguishable from simple error or delusion. The *anxiety* of the Trader and the *avoidance* of the Medical Patient are the empirical signatures of the phenomenon. They indicate that the truth is "present" enough to hurt, but "absent" enough to be denied.
  *   **Eliminative Power:** This requirement eliminates **Deflationary Accounts** (like Mele's) that argue the self-deceiver simply believes *p* via biased evidence gathering. If the agent simply believes *p*, why the anxiety? Why the avoidance? Deflationists must explain away the tension as mere "discomfort," but this often fails to capture the depth of the conflict evident in the Trader case. D3 forces the theory to account for the *presence of the absent truth*.

  ---

  ## 5. Scorecard: How Theories Survive (By Rewriting Rules)

  No existing theory satisfies all five desiderata without quietly rewriting one. Here is how the major contenders fare:

  | Theory | Proponent Style | Performance on Desiderata | The "Rewrite" (How they survive) |
  | :--- | :--- | :--- | :--- |
  | **Intentionalist** | Davidson | **Passes:** D1, D2, D3, D4.<br>**Fails:** D5. | **Rewrites D5 (Unified Architecture).** Davidson accepts a form of partition ("mental compartments"). He argues the mind is divided enough to allow a deceiver and deceivee, but unified enough to be one person. He sacrifices metaphysical simplicity to save the phenomenology of tension and agency. |
  | **Deflationist** | Mele | **Passes:** D1, D2, D5.<br>**Fails:** D3. | **Rewrites D3 (Doxastic Tension).** Mele argues the agent simply believes *p* due to motivationally biased evidence processing. The "tension" is reinterpreted as mere emotional discomfort or fear, not a trace of a contrary *belief*. This saves the unified mind but risks making self-deception look too much like ordinary bias. |
  | **Divisionist** | Modular/Subpersonal | **Passes:** D1, D2, D3, D5 (sort of).<br>**Fails:** D4. | **Rewrites D4 (Agency/Responsibility).** Divisionists posit subpersonal modules that hide information from other modules. This explains the tension and the unity (no homunculi), but it makes self-deception a mechanical glitch. The agent is no longer *responsible*; their modules are. It saves the science but loses the blame. |

  ## 6. Conclusion
  The specification reveals that self-deception is likely a "impossible object" in the space of rational agency. We want to say the agent is responsible (D4), but not that they intended the lie (which implies D5 violation). We want to say they believe the lie (D1), but act like they know the truth (D3).

  The **Doxastic Tension Condition (D3)** is the necessary burden. If a theory cannot explain why the Trader checks the price while avowing confidence, it has not explained self-deception; it has explained confidence. However, accepting D3 forces us into the contradiction with Unified Architecture. We are left with a choice: accept a partitioned mind (Davidson), accept a passive agent (Divisionist), or accept a thinner phenomenon (Mele). An honest theory must admit which desideratum it sacrifices. To demand all five is to demand a psychology that may not be humanly possible.
