prompt: |-
  I'm a backend engineer, zero formal philosophy, but I fell down the experimental philosophy rabbit hole a few years back when a coworker cited the Knobe effect in a retro to argue that shipping a known-breaking change "accidentally" is basically an oxymoron. The famous case for anyone who needs it: chairman of a board is told a new program will increase profits and (a) harm the environment or (b) help the environment, he says he doesn't care about the environment either way, just wants profit, and the program runs. Laypeople overwhelmingly say he intentionally harmed it in version (a) but did NOT intentionally help it in version (b), even though his head is described identically in both.

  Here's what's bugging me. This debate has been running for like 20 years and it's stuck in a way that feels very familiar from work: everyone agrees the "test fails" (the asymmetry replicates, in kids, across cultures, with variations), but nobody agrees whether the failure is in the code, the test, or the spec. Roughly three camps, as far as I can tell:

  1. Knobe's camp: the asymmetry is a feature, not a bug. The folk concept of intentional action is normatively loaded on purpose -- its whole job is blame assignment -- so of course moral evaluation feeds into the ascription. Asking for a "purely descriptive" concept of intentionality is asking folk concepts to not be folk concepts.
  2. The pragmatics camp (Adams and Steadman style): the asymmetry is basically conversational artifact. People don't literally judge that he intended the harm; they're reading the question as "is he a jerk here," and answering "intentionally" because saying otherwise would sound like excusing him. So the experiment measures implicature, not the concept.
  3. The "it's the tradeoff, not the norm" camp (I think this is Machery's line, among others): what drives the harm-case judgment isn't that a norm was violated per se, it's that the agent knowingly took the bad side effect as the price of his goal -- he endorsed it -- and "endorsed the tradeoff" is doing the work that "violated a norm" gets credited with.

  My working hypothesis, offered as just a hypothesis: this is a bug-vs-feature dispute with no spec to appeal to. All three camps can explain the same vignette battery, so the data underdetermines the theory, and the real fight is over what the concept of intentional action is FOR -- blame-catching tool, description of mental architecture, or contract-endorsement detector. If that's right, then it's not a factual disagreement at all, and more vignettes won't move it.

  But I might be wrong -- maybe one camp has actual predictions the others can't match and I just haven't found them. So diagnose the thing for real. Prescribe the answer in these sections, in this order: **"What the sides actually claim"** (~200 words, keep it tight, I did the reading), **"The diagnosis"** (~350 words -- is this substantive, verbal, or different-questions-under-one-name, and say why, not just which), **"What would count as progress"** (~250 words -- a distinction, a study design, a reformulation of the question, or an argument that none should be expected), and **"Your honest odds"** (~100 words -- given your diagnosis, do you think this gets resolved in the next 20 years, yes or no, and why). If you think my bug-vs-feature framing is off, say so directly instead of politely absorbing it.
